h/MathML\"><mn>2</mn><mo>.2</mo><mo>&#215;</mo><msup><mn>10</mn><mn>9</mn></msup><mo>&#160;</mo><mi>Pa</mi></math>", "image": null, "isCorrect": false}, {"id": "JyhMe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.2</mo><mo>&#215;</mo><msup><mn>10</mn><mn>7</mn></msup><mo>&#160;</mo><mi>Pa</mi></math>", "image": null, "isCorrect": false}, {"id": "hZNjG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.2</mo><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi>Pa</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Young&#39;s modulus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi><mo>=</mo><mfrac><mi>F</mi><mi>A</mi></mfrac><mfrac><mi>L</mi><mrow><mi>&#916;</mi><mi>L</mi></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mspace width=\"0.5em\"></mspace><mfrac><mi>F</mi><mi>A</mi></mfrac><mo>=</mo><mi>Y</mi><mfrac><mrow><mi>&#916;</mi><mi>L</mi></mrow><mi>L</mi></mfrac><mo>=</mo><mi>Y</mi><mi>&#945;</mi><mi>&#916;</mi><mi>T</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mspace width=\"0.5em\"></mspace><mi>P</mi><mo>=</mo><mn>2</mn><msup><mo>&#215;&#8203; 10</mo><mi>11</mi></msup><mo>&#215;</mo><mn>1</mn><mo>.1</mo><mo>&#215;</mo><msup><mi>10</mi><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#215;</mo><msup><mi>10</mi><mn>2</mn></msup></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>P</mi><mo>=</mo><mn>2</mn><mo>.</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup><mo>&#160;</mo><mi>Pa</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6486", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2014 (06 Apr)", "title": "JEE Main 2014 (06 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c5d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}], "question": {"text": "The ratio of the coefficient of volume expansion of a glass container to that of a viscous liquid kept inside the container is $1: 4$. What fraction of the inner volume of the container should the liquid occupy so that the volume of the remaining vacant space will be same at all temperatures ?", "image": null}, "options": [{"id": "jLi3p", "text": "\n$2: 5$\n", "image": null, "isCorrect": false}, {"id": "rKcys", "text": "\n$1: 4$\n", "image": null, "isCorrect": true}, {"id": "BstHZ", "text": "\n$1: 64$\n", "image": null, "isCorrect": false}, {"id": "de5IK", "text": "\n$1: 8$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When there is no change in liquid level in vessel then $\\gamma_{\\text {real }}^{\\prime}=\\gamma^{\\prime}$ vessel Change in volume in liquid relative to vessel\n$$\n\\Delta \\mathrm{V}_{\\mathrm{app}}=\\mathrm{V} \\gamma_{\\text {app }}^{\\prime} \\Delta \\theta=\\mathrm{V}\\left(\\gamma_{\\text {real }}^{\\prime}-\\gamma_{\\text {vessel }}^{\\prime}\\right)\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65af5", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}], "question": {"text": "A wooden wheel of radius $\\mathrm{R}$ is made of two semicircular parts (see figure); The two parts are held together by a ring made of a metal strip of cross sectional area S and length $L$. $L$ is slightly less than $2 \\pi R$. To fit the ring on the wheel, it is heated so that its temperature rises by $\\Delta \\mathrm{T}$ and it just steps over the wheel. As it cools down to surrounding temperature, it presses the semicircular parts together. If the coefficient of linear expansion of the metal is $\\alpha$, and its Youngs' modulus is $Y$, the force that one part of the wheel applies on the other part is :\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3PRx8aBt7A9OIY0MrkQ5PbuWekrDeRfZU1cHhi_z5X8.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "N4kln", "text": "\n$\\mathrm{2 \\pi S Y \\alpha \\Delta T}$\n", "image": null, "isCorrect": false}, {"id": "G4ZLi", "text": "\n$\\mathrm{S Y \\alpha \\Delta T}$\n", "image": null, "isCorrect": false}, {"id": "ZRHEK", "text": "\n$\\mathrm{\\pi S Y \\alpha \\Delta T}$\n", "image": null, "isCorrect": false}, {"id": "nAgC9", "text": "\n$\\mathrm{2 S Y \\alpha \\Delta T}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "If temperature increases by $\\Delta \\mathrm{T}$, \nIncrease in length $\\mathrm{L}, \\Delta \\mathrm{L}=\\mathrm{L} \\alpha \\Delta \\mathrm{T}$\n$\\therefore \\quad \\frac{\\Delta \\mathrm{L}}{\\mathrm{L}}=\\alpha \\Delta \\mathrm{T}$\nLet tension developed in the ring is $\\mathrm{T}$.\n$\\therefore \\quad \\frac{\\mathrm{T}}{\\mathrm{S}}=\\mathrm{Y} \\frac{\\Delta \\mathrm{L}}{\\mathrm{L}}=\\mathrm{Y} \\alpha \\Delta \\mathrm{T}$\n$\\therefore \\quad \\mathrm{T}=\\mathrm{S} \\mathrm{Y} \\alpha \\Delta \\mathrm{T}$\nFrom FBD of one part of the wheel,\n$\\mathrm{F}=2 \\mathrm{T}$\nWhere, $F$ is the force that one part of the wheel applies on the other part.\n$\\therefore \\mathrm{F}=2 \\mathrm{SY} \\alpha \\Delta \\mathrm{T}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/iDp-o4jBcp86lj9lyfKhIqjvfm3lEXf0qiE3Cp5TgdM.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "648b5a73417cc3fb48d691f0", "title": "Calorimetry", "totalQuestions": 40, "questions": [{"_id": "69d8076181239f6567c4f50c", "type": "numerical", "question": {"text": "The heat extracted out of $x$ gram of water initially at $50°C$ to cool it down to $0°C$ is sufficient to evaporate $(1000 - x)$ gram of water also initially at $50°C$. The value of $x$ (closest integer) is _______.<br>(Take latent heat of water $2256\\text{ kJ/kg.K}$, specific heat capacity of water $4200\\text{ J/kg.K}$)", "image": null}, "options": [], "correctValue": "922", "solution": {"text": "Heat extracted to cool $x$ gram of water from $50^{\\circ}\\text{C}$ to $0^{\\circ}\\text{C}$ is given by:<br><br>$Q_1 = m_1 c \\Delta T_1$<br><br>$Q_1 = x \\times 4.2 \\times (50 - 0) = 210x \\text{ J}$<br><br>Heat required to raise the temperature of $(1000 - x)$ gram of water from $50^{\\circ}\\text{C}$ to $100^{\\circ}\\text{C}$ and evaporate it is given by:<br><br>$Q_2 = m_2 c \\Delta T_2 + m_2 L$<br><br>$Q_2 = (1000 - x) \\times [4.2 \\times (100 - 50) + 2256]$<br><br>$Q_2 = (1000 - x) \\times (210 + 2256) = 2466(1000 - x) \\text{ J}$<br><br>Equating the heat extracted and the heat required:<br><br>$Q_1 = Q_2$<br><br>$210x = 2466(1000 - x)$<br><br>$210x = 2466000 - 2466x$<br><br>$2676x = 2466000$<br><br>$x = \\dfrac{2466000}{2676} \\approx 921.52$<br><br>The closest integer value for $x$ is $922$.<br><br>Answer: $922$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "9a97009362ad493d9cde198d4270aebc", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Uwbanbm9Yx8Pp.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Uwbanbm9Yx8Pp.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1ac8bfdbb24356397ab", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "10 kg of ice at $-10^{\\circ} \\mathrm{C}$ is added to 100 kg of water to lower its temperature from 25 ${ }^{\\circ} \\mathrm{C}$. Consider no heat exchange to surroundings. The decrement to the temperature of water is $\\_\\_\\_\\_$ ${ }^{\\circ} \\mathrm{C}$. <br> (specific heat of ice $=2100 \\mathrm{~J} / \\mathrm{Kg}.{ }^{\\circ} \\mathrm{C}$, specific heat of water $=4200 \\mathrm{~J} / \\mathrm{Kg}.{ }^{\\circ} \\mathrm{C}$, latent heat of fusion of ice $=3.36 \\times 10^{5} \\mathrm{~J} / \\mathrm{Kg}$)", "image": null}, "options": [{"id": "b6h3q", "text": "6.67", "isCorrect": false, "image": null}, {"id": "LdfmB", "text": "11.6", "isCorrect": false, "image": null}, {"id": "JcfkC", "text": "15", "isCorrect": false, "image": null}, {"id": "gNG0k", "text": "10", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Heat available from water cooling 25°C to 0°C: $Q_{available} = 100 \\times 4200 \\times 25 = 10.5 \\times 10^6$ J.<br>Heat to warm ice from -10°C to 0°C: $Q_1 = 10 \\times 2100 \\times 10 = 0.21 \\times 10^6$ J.<br>Heat to melt ice at 0°C: $Q_2 = 10 \\times 3.36 \\times 10^5 = 3.36 \\times 10^6$ J.<br>Total needed: $0.21 + 3.36 = 3.57 \\times 10^6$ J.<br>Since available heat exceeds required heat, all ice melts. Remaining heat: $10.5 - 3.57 = 6.93 \\times 10^6$ J<br>warms 110 kg water: $\\Delta T = \\frac{6.93 \\times 10^6}{110 \\times 4200} = 15$ °C.<br>Final temperature: 15°C.<br>Decrement in water temperature: $25 - 15 = 10$ °C.", "image": null}, "videoSolution": {"videoId": "391062911a5a438399cb3220429d5553", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/gPWkwp2Su46ON.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/gPWkwp2Su46ON.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1ab8bfdbb24356397a2", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Which of the following best represents the temperature versus heat supplied graph for water, in the range of $-20^{\\circ} \\mathrm{C}$ to $120^{\\circ} \\mathrm{C}$ ?", "image": null}, "options": [{"id": "B1OAV", "text": "<img style=\"width:200px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/28S1_o_27_1_1.png\">", "isCorrect": false, "image": null}, {"id": "Il1KB", "text": "<img style=\"width:200px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/28S1_o_27_2_1.png\">", "isCorrect": false, "image": null}, {"id": "GdXr1", "text": "<img style=\"width:200px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/28S1_o_27_3_1.png\">", "isCorrect": false, "image": null}, {"id": "TCHMs", "text": "<img style=\"width:200px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/28S1_o_27_4_1.png\">", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "No solution.", "image": null}, "videoSolution": {"videoId": "b209cb2f4d34489689b8fa15b4f4ce65", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/lS9G9sHLWLDd6.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/lS9G9sHLWLDd6.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c17b8bfdbb2435639556", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f41", "title": "JEE Main 2026 (21 January Shift 1)", "shortName": "2026 (21 January Shift 1)", "isVisible": true, "heldOn": "2026-01-21T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "A gas based geyser heats water flowing at the rate of 5.0 litres per minute from $27^{\\circ} \\mathrm{C}$ to $87^{\\circ} \\mathrm{C}$. The rate of consumption of the gas is $\\_\\_\\_\\_$ $\\mathrm{g} / \\mathrm{s}$. <br> (Take heat of combustion of gas $=5.0 \\times 10^{4} \\mathrm{~J} / \\mathrm{g}$) specific heat capacity of water $=4200 \\mathrm{~J} / \\mathrm{kg} \\cdot{ }^{\\circ} \\mathrm{C}$", "image": null}, "options": [{"id": "EBwRs", "text": "0.42", "isCorrect": true, "image": null}, {"id": "cvIGy", "text": "2.1", "isCorrect": false, "image": null}, {"id": "XKjGI", "text": "0.21", "isCorrect": false, "image": null}, {"id": "gM4Xi", "text": "4.2", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Flow rate = 5.0 L/min = 5.0 kg/min, $\\Delta T = 87 - 27 = 60$°C<br>Heat required per minute: $Q = mc\\Delta T = 5.0 \\times 4200 \\times 60 = 1.26 \\times 10^6$ J/min<br>If m grams of gas consumed per minute:<br>$m \\times 5.0 \\times 10^4 = 1.26 \\times 10^6$<br>$m = \\frac{1.26 \\times 10^6}{5.0 \\times 10^4} = 25.2$ g/min<br>Rate $= \\frac{25.2}{60} = 0.42$ g/s", "image": null}, "videoSolution": {"videoId": "152006ad5b0e45688c71f2c702028e15", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/ThqdIuiKOQvw6.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/ThqdIuiKOQvw6.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f41", "title": "JEE Main 2026 (21 January Shift 1)", "shortName": "2026 (21 January Shift 1)", "isVisible": true, "heldOn": "2026-01-21T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c667c09d044e4c1a1cb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2025 (8 Apr Shift 2)", "title": "JEE Main 2025 (8 Apr Shift 2)"}], "question": {"text": "Water falls from a height of 200 m into a pool. Calculate the rise in temperature of the water assuming no heat dissipation from the water in the pool.<br/>$\\left(\\right.$ Take $g=10 \\mathrm{~m} / \\mathrm{s}^2$, specific heat of water $\\left.=4200 \\mathrm{~J} /(\\mathrm{kg} \\mathrm{K})\\right)$", "image": null}, "options": [{"id": "UnecX", "text": "0.23 K", "image": null, "isCorrect": false}, {"id": "AiLrq", "text": "0.36 K", "image": null, "isCorrect": false}, {"id": "qOBqw", "text": "0.14 K", "image": null, "isCorrect": false}, {"id": "KlGgs", "text": "0.48 K", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{mgh}=\\mathrm{ms} \\Delta \\mathrm{T} \\\\ & \\Delta \\mathrm{T}=\\frac{\\mathrm{gh}}{\\mathrm{s}}=\\frac{10 \\times 200}{4200} \\mathrm{~K}=\\frac{10}{21} \\mathrm{~K}\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "5b158006bdc344afb5e39a03a6183fbc", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Nlfn5ewYTJhaL.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Nlfn5ewYTJhaL.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d80978e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2025 (8 Apr Shift 2)", "title": "JEE Main 2025 (8 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2ee99c8b73881fdaea14b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d9760a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T09:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 1)", "title": "JEE Main 2025 (23 Jan Shift 1)"}], "question": {"text": "A gun fires a lead bullet of temperature 300 K into a wooden block. The bullet having melting temperature of 600 K penetrates into the block and melts down. If the total heat required for the process is 625 J , then the mass of the bullet is $\\qquad$ grams.\n(Latent heat of fusion of lead $=2.5 \\times 10^4 \\mathrm{JKg}^{-1}$ and specific heat capacity of lead $=125 \\mathrm{JKg}^{-1}$ $\\left.\\mathrm{K}^{-1}\\right)$", "image": null}, "options": [{"id": "YJwCr", "text": "$10$", "image": null, "isCorrect": true}, {"id": "0GmaQ", "text": "$20$", "image": null, "isCorrect": false}, {"id": "obPgi", "text": "$5$", "image": null, "isCorrect": false}, {"id": "ymclX", "text": "$15$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & 625=\\mathrm{ms} \\Delta \\mathrm{T}+\\mathrm{mL} \\\\ & 625=\\mathrm{m}\\left[125 \\times 300+2.5 \\times 10^4\\right] \\\\ & 625=\\mathrm{m}[37500+25000] \\\\ & 625=\\mathrm{m}[62500] \\\\ & \\mathrm{m}=\\frac{1}{100} \\mathrm{~kg} \\\\ & \\mathrm{M}=10 \\text { grams }\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "3b2b28ece510465b833338318f709bf2", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/32SEYvXcw0oDp.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/32SEYvXcw0oDp.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5ca6d4514bf2d9760a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T09:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 1)", "title": "JEE Main 2025 (23 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2ee87c8b73881fdaea0ac", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d97608", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T09:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 1)", "title": "JEE Main 2025 (22 Jan Shift 1)"}], "question": {"text": "An amount of ice of mass $10^{-3} \\mathrm{~kg}$ and temperature $-10^{\\circ} \\mathrm{C}$ is transformed to vapour of temperature $110^{\\circ} \\mathrm{C}$ by applying heat. The total amount of work required for this conversion is, (Take, specific heat of ice $=2100 \\mathrm{Jkg}^{-1} \\mathrm{~K}^{-1}$, specific heat of water $=4180 \\mathrm{Jkg}^{-1} \\mathrm{~K}^{-1}$, specific heat of steam $=1920 \\mathrm{Jkg}^{-1} \\mathrm{~K}^{-1}$, Latent heat of ice $=3.35 \\times 10^5 \\mathrm{Jkg}^{-1}$ and Latent heat of steam $=2.25 \\times 10^6$ $\\mathrm{Jkg}^{-1}$ )", "image": null}, "options": [{"id": "yuCjf", "text": "3043 J", "image": null, "isCorrect": true}, {"id": "IsGnZ", "text": "3024 J", "image": null, "isCorrect": false}, {"id": "ZSj34", "text": "3003 J", "image": null, "isCorrect": false}, {"id": "ChKCV", "text": "3022 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/X88EdGmg-1k_ZNejeUN1uq-icKHGAyD_ULhPT5mUATc.original.fullsize.png\"><br>\n\n$\\begin{aligned} & \\Delta \\mathrm{Q}_1=\\mathrm{m} \\times \\mathrm{S}_1 \\times \\Delta \\mathrm{T}=10^{-3} \\times 2100 \\times 10=21 \\mathrm{~J} \\\\ & \\Delta \\mathrm{Q}_2=\\mathrm{m} \\times \\mathrm{L}_{\\mathrm{f}}=10^{-3} \\times 3.35 \\times 10^5=335 \\mathrm{~J} \\\\ & \\Delta \\mathrm{Q}_3=\\mathrm{m} \\times \\mathrm{S}_{\\mathrm{w}} \\times \\Delta \\mathrm{T}=10^{-3} \\times 4180 \\times 100=418 \\mathrm{~J} \\\\ & \\Delta \\mathrm{Q}_4=\\mathrm{m} \\times \\mathrm{L}_{\\mathrm{v}}=10^{-3} \\times 2.25 \\times 10^6=2250 \\mathrm{~J} \\\\ & \\Delta \\mathrm{Q}_5=\\mathrm{m} \\times \\mathrm{S}_{\\mathrm{v}} \\times \\Delta \\mathrm{T}=10^{-3} \\times 1920 \\times 10=19.2 \\mathrm{~J} \\\\ & \\Delta \\mathrm{Q}_{\\mathrm{net}}=3043.2 \\mathrm{~J}\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "719831495f2c44e49253c67cca2514a0", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/b52sp7c66n7Uv.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/b52sp7c66n7Uv.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5ca6d4514bf2d97608", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T09:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 1)", "title": "JEE Main 2025 (22 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd70ba0e94a3c4025ca6", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "A block of ice at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>10</mn><mo> </mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> is slowly heated and converted to steam at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo> </mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. Which of the following curves represent the phenomenon qualitatively:", "image": null}, "options": [{"id": "ttne8", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c786ae9c-14db-46a9-a091-c9170f550a04.png\" style=\"width: 220px; height: 185px;\"/>", "image": null, "isCorrect": false}, {"id": "68ixi", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d632f854-f69c-4a66-8347-b0c637af15ef.png\" style=\"width: 220px; height: 178px;\"/>", "image": null, "isCorrect": false}, {"id": "6xoAB", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/617e7529-8a65-4e1b-9355-c802ef9b73c2.png\" style=\"width: 220px; height: 170px;\"/>", "image": null, "isCorrect": false}, {"id": "GhQkQ", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/01688a02-4153-4031-b1d2-8d69786f8d65.png\" style=\"width: 220px; height: 182px;\"/>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<blockquote><p>When the state of the substance is not changing, temperature of the substance increases when heat is supplied to it. But when the substance changes the state, the heat supplied to it used as latent heat and the temperature remains constant until all the substance converts to other state.</p><p>Therefore, temperature of ice first increases from  <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>10</mn><mo> </mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo> </mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. Then, remains constant at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> till whole ice is melted. Then, it increases from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo> </mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo> </mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. Again it remains constant at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo> </mo><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> till whole water converts into steam.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "6fb5c1ce9c744dec806a185a9750ef31", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/PiI4jsBBkT44M.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/PiI4jsBBkT44M.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}], "questionStructure": ["GRAPH_BASED"], "previousYear": {"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d6854e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6492", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 1)", "title": "JEE Main 2023 (11 Apr Shift 1)"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>kg</mi></math> of water at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> is converted into steam at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> by boiling at atmospheric pressure. The volume of water changes from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>00</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math>&nbsp;as a liquid to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>671</mn><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math>&nbsp;as steam. The change in internal energy of the system during the process will be (Given latent heat of vaporisation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2257</mn><mo>&#160;</mo><mi>kJ</mi><mo>/</mo><mi>kg</mi></math>, Atmospheric pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"\"><mrow><mo>=</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi>Pa</mi></mrow></mfenced></math>", "image": null}, "options": [{"id": "U4Z4F", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2426</mn><mo>&#160;</mo><mi>kJ</mi></math>", "image": null, "isCorrect": false}, {"id": "ItGl6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mn>2090</mn><mo>&#160;</mo><mi>kJ</mi></math>", "image": null, "isCorrect": true}, {"id": "zmDt7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2090</mn><mo>&#160;</mo><mi>kJ</mi></math>", "image": null, "isCorrect": false}, {"id": "tI2Jf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mn>2476</mn><mo>&#160;</mo><mi>kJ</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The work to be done&nbsp;in the process is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnspacing=\"0px\" columnalign=\"right center left\"><mtr><mtd><mi>d</mi><mi>W</mi></mtd><mtd><mo>=</mo></mtd><mtd><mi>P</mi><mi>d</mi><mi>V</mi></mtd></mtr><mtr><mtd/><mtd><mo>=</mo></mtd><mtd><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi>Pa</mi><mo>&#215;</mo><mo>(</mo><mn>1</mn><mo>.</mo><mn>671</mn><mo>-</mo><mn>0</mn><mo>.</mo><mn>001</mn><mo>)</mo><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></mtd></mtr><mtr><mtd/><mtd><mo>=</mo></mtd><mtd><mn>1</mn><mo>.</mo><mn>670</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></mtd></mtr></mtable></math></p><p>The change in heat energy during the vaporisation process can be calculated as follows-</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnspacing=\"0px\" columnalign=\"right center left\"><mtr><mtd><mi>&#916;</mi><msub><mi>Q</mi><mtext>supplied&#160;</mtext></msub></mtd><mtd><mo>=</mo></mtd><mtd><mn>2257</mn><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></mtd></mtr><mtr><mtd/><mtd><mo>=</mo></mtd><mtd><mn>22</mn><mo>.</mo><mn>57</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></mtd></mtr></mtable></math></p><p>Hence, the change in internal energy in the process is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnspacing=\"0px\" columnalign=\"right center left\"><mtr><mtd><mi>&#916;</mi><mi>U</mi></mtd><mtd><mo>=</mo></mtd><mtd><mi>&#916;</mi><msub><mi>Q</mi><mi>supplied</mi></msub><mo>-</mo><mi>&#916;</mi><mi>W</mi></mtd></mtr><mtr><mtd/><mtd><mo>=</mo></mtd><mtd><mo>(</mo><mn>22</mn><mo>.</mo><mn>57</mn><mo>-</mo><mn>1</mn><mo>.</mo><mn>67</mn><mo>)</mo><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></mtd></mtr><mtr><mtd/><mtd><mo>=</mo></mtd><mtd><mn>20</mn><mo>.</mo><mn>9</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></mtd></mtr><mtr><mtd/><mtd><mo>=</mo></mtd><mtd><mn>2090</mn><mo>&#160;</mo><mi>kJ</mi></mtd></mtr></mtable></math></p>", "image": null}, "videoSolution": {"videoId": "4afc413750c5482a8d3324370091d033", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/e4xoSj3D1fY8a.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/e4xoSj3D1fY8a.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6492", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 1)", "title": "JEE Main 2023 (11 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d682e6", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "<p>A water heater of power <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2000</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi></math>&nbsp;is used to heat water. The specific heat capacity of water is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4200</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The efficiency of heater is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>70</mn><mo>%</mo></math>. Time required to heat <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>kg</mi></math> of water from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;is _____&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">s</mi></math>.</p><p>(Assume that the specific heat capacity of water remains constant over the temperature range of the water).</p>", "image": null}, "options": [], "correctValue": "300", "solution": {"text": "<p>Heat provided to water will be responsible for increase in temperature. Therefore, we can write</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>&#215;</mo><mi>P</mi><mo>&#215;</mo><mi>t</mi><mo>=</mo><mi>M</mi><mo>&#215;</mo><mi>s</mi><mo>&#215;</mo><mi>&#916;</mi><mi>T</mi></math></p><p>Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mfrac><mn>70</mn><mn>100</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>7</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>energy</mtext><mo>=</mo><mtext>power</mtext><mo>&#215;</mo><mtext>time</mtext></math>.</p><p>Therefore,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>4200</mn><mo>&#215;</mo><mfenced><mrow><mn>60</mn><mo>&#176;</mo><mo>-</mo><mn>10</mn><mo>&#176;</mo></mrow></mfenced></mrow><mrow><mn>0</mn><mo>.</mo><mn>7</mn><mo>&#215;</mo><mn>2000</mn></mrow></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi><mo>=</mo><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68171", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Heat energy of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>184</mn><mo>&#160;</mo><mi>kJ</mi></math>&nbsp;is given to ice of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>12</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, Specific heat of ice is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2222</mn><mo>.</mo><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>kg</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><mo>&#176;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup></math> and latent heat of ice is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>336</mn><mo>&#160;</mo><mi>kJ</mi><mo>&#160;</mo><msup><mi>kg</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup></math>.</p><p>(A) Final temperature of system will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math></p><p>(B) Final temperature of the system will be greater than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math></p><p>(C) The final system will have a mixture of ice and water in the ratio of&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mn>1</mn></math></p><p>(D) The final system will have a mixture of ice and water in the ratio of&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mn>5</mn></math></p><p>(E) The final system will have water only</p><p>Choose the correct answer from the options given below :</p>", "image": null}, "options": [{"id": "BGVdl", "text": "A and D only", "isCorrect": true, "image": null}, {"id": "tm8xz", "text": "B and D only", "isCorrect": false, "image": null}, {"id": "vwHjw", "text": "A and E only", "isCorrect": false, "image": null}, {"id": "6C01r", "text": "A and C only", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>Q</mi><mo>=</mo><mn>184</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>600</mn><mo>&#160;</mo><mi>kg</mi><mo>&#160;</mo><mtext>at</mtext><mo>&#160;</mo><mo>-</mo><mn>12</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>=</mo><mn>2222</mn><mo>.</mo><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>kg</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><mo>&#176;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>&#8211;</mo><mn>1</mn></mrow></msup></math>&nbsp;and</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>=</mo><mn>336</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>Heat required to convert ice from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><mn>12</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> to ice at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;will be,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mn>1</mn></msub><mo>=</mo><mn>0</mn><mo>.</mo><mn>600</mn><mo>&#215;</mo><mn>2222</mn><mo>.</mo><mn>3</mn><mo>&#215;</mo><mn>12</mn><mo>=</mo><mn>16000</mn><mo>.</mo><mn>56</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p>Remaining heat&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mn>184000</mn><mo>-</mo><mn>16000</mn><mo>.</mo><mn>56</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#160;</mo><mn>167999</mn><mo>.</mo><mn>44</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p>Heat required to melt ice completely at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mn>2</mn></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>0</mn><mo>.</mo><mn>600</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>336000</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>201600</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>&nbsp;needed which is more than&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>, so&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>%</mo></math>&nbsp;ice is not melted.</p><p>For amount of melted ice, we can write</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>167999</mn><mo>.</mo><mn>44</mn><mo>=</mo><mi>m</mi><mo>&#215;</mo><mn>336000</mn><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>m</mi><mo>=</mo><mo>&#160;</mo><mn>0</mn><mo>.</mo><mn>4999</mn><mo>&#160;</mo><mi>kg</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;mass of water&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>.</mo><mn>4999</mn><mo>&#160;</mo><mi>k</mi><mi>g</mi></math></p><p>Mass of ice remaining&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#160;</mo><mn>0</mn><mo>.</mo><mn>1001</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;Ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>1001</mn></mrow><mrow><mn>0</mn><mo>.</mo><mn>4999</mn></mrow></mfrac><mo>&#8776;</mo><mn>1</mn><mo>:</mo><mn>5</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["MULTI_STATEMENT"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d680ba", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "According to law of equipartition of energy the molar specific heat of a diatomic gas at constant volume where the molecule has one additional vibrational mode is :-", "image": null}, "options": [{"id": "6aAoX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>2</mn></mfrac><mi>R</mi></math>", "isCorrect": false, "image": null}, {"id": "XPYkh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi></math>", "isCorrect": false, "image": null}, {"id": "Hjjbk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi></math>", "isCorrect": false, "image": null}, {"id": "oquCE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mn>2</mn></mfrac><mi>R</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>A diatomic gas has 5 degrees of freedom apart from vibrational degree of freedom. For each additional vibrational mode, degree of freedom is increased by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>. So new degree of freedom,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>=</mo><mn>5</mn><mo>+</mo><mn>2</mn><mo>=</mo><mn>7</mn></math></p><p>Therefore, we require&nbsp;molar specific heat capacity at constant volume, which is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>v</mi></msub><mo>=</mo><mfrac><mi>f</mi><mn>2</mn></mfrac><mi>R</mi><mo>=</mo><mfrac><mn>7</mn><mn>2</mn></mfrac><mi>R</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d679b3", "previousYearPapers": [{"_id": "63134c746e7bc9b332483709", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 2)", "title": "JEE Main 2022 (26 Jul Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "An ice cube of dimensions <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&#160;</mo><mi>cm</mi><mo>&#215;</mo><mn>50</mn><mo>&#160;</mo><mi>cm</mi><mo>&#215;</mo><mn>20</mn><mo>&#160;</mo><mi>cm</mi></math> is placed in an insulation box of wall thickness <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>cm</mi></math>. The box keeping the ice cube at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> of temperature is brought to a room of temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. The rate of melting of ice is approximately: (Latent heat of fusion of ice is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><msup><mrow><mo>&#160;</mo><mi>kg</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and thermal conducting of insulation wall is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>05</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><mo>&#176;</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>)", "image": null}, "options": [{"id": "TmgTx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>61</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><mi>kg</mi><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "6lBEk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>61</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#160;</mo><mi>kg</mi><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": true, "image": null}, {"id": "S2ohQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>208</mn><mo>&#160;</mo><mi>kg</mi><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "LxDIc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#160;</mo><mi>kg</mi><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/bf89b94d-c6f0-47aa-9e67-497b6511a0fc-image.png\" style=\"width: 200px; height: 133px;\" /></p><p>Using the equation of conduction,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi>Q</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>K</mi><mi>A</mi><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></mrow><mi>l</mi></mfrac></math></p><p>Now the total area of the box will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mn>2</mn><mfenced><mrow><mn>0</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>5</mn><mo>+</mo><mn>0</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>2</mn><mo>+</mo><mn>0</mn><mo>.</mo><mn>2</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>6</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mn>2</mn><mfenced><mrow><mn>0</mn><mo>.</mo><mn>3</mn><mo>+</mo><mn>0</mn><mo>.</mo><mn>1</mn><mo>+</mo><mn>0</mn><mo>.</mo><mn>12</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mn>2</mn><mfenced><mrow><mn>0</mn><mo>.</mo><mn>52</mn></mrow></mfenced><mo>=</mo><mn>1</mn><mo>.</mo><mn>04</mn><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math></p><p>Therefore,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi>Q</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>K</mi><mi>A</mi><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></mrow><mi>l</mi></mfrac><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>05</mn><mo>&#215;</mo><mn>1</mn><mo>.</mo><mn>04</mn><mo>&#215;</mo><mn>40</mn></mrow><mrow><mn>0</mn><mo>.</mo><mn>01</mn></mrow></mfrac><mo>=</mo><mn>208</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>This heat will melt the ice. Therefore,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi>Q</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>d</mo><mi>m</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac><mi>L</mi><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mn>208</mn><mo>=</mo><mfrac><mrow><mo>d</mo><mi>m</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac><mo>&#215;</mo><mn>3</mn><mo>.</mo><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mfrac><mrow><mo>d</mo><mi>m</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac><mo>=</mo><mn>61</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup><mo>&#160;</mo><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483709", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 2)", "title": "JEE Main 2022 (26 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67857", "previousYearPapers": [{"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 2)", "title": "JEE Main 2022 (25 Jul Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "<p>A block of ice of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> is put in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> of water at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. The <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> of ice melts as the temperature of the water reaches <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> is</p><p>[Use: Specific heat capacity of water <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4200</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, Latent heat of ice <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>]</p>", "image": null}, "options": [], "correctValue": "90", "solution": {"text": "<blockquote><p>According to the principle of calorimetry, heat lost by hot body is equal to the heat gained by cold body.</p><p>The heat&nbsp;released by water</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>Q</mi><mo>=</mo><mi>m</mi><mi>s</mi><mo>&#8710;</mo><mi>T</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>3</mn><mo>&#215;</mo><mn>4200</mn><mo>&#215;</mo><mn>25</mn><mo>=</mo><mn>31500</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p>let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>&#160;</mo><mi>kg</mi></math> ice melts then,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>Q</mi><mo>=</mo><mi>m</mi><mi>L</mi><mo>=</mo><mi>m</mi><mo>&#215;</mo><mn>3</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>=</mo><mn>31500</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>m</mi><mo>=</mo><mfrac><mrow><mn>31500</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup></mrow><mrow><mn>3</mn><mo>.</mo><mn>5</mn></mrow></mfrac><mo>=</mo><mn>9000</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>5</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>09</mn><mo>&#160;</mo><mi>kg</mi><mo>=</mo><mn>90</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>90</mn></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 2)", "title": "JEE Main 2022 (25 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67e3f", "previousYearPapers": [{"_id": "62c481f101514d218a7934db", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 1)", "title": "JEE Main 2022 (29 Jun Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A cylinder of fixed capacity of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>44</mn><mo>.</mo><mn>8</mn></math>&nbsp;litres contains helium gas at standard temperature and pressure. The amount of heat needed to raise the temperature of gas in the cylinder by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>.</mo><mn>0</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> will be (Given gas constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>8</mn><mo>.</mo><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>)", "image": null}, "options": [{"id": "wqM8i", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>249</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "3chul", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>415</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "SeyjB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>498</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": true, "image": null}, {"id": "vw3g2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>830</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>At STP&nbsp;volume occupied by one mole of a gas is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>22</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">L</mi></math>. Therefore, number of moles are,&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><mfrac><mrow><mn>44</mn><mo>.</mo><mn>8</mn></mrow><mrow><mn>22</mn><mo>.</mo><mn>4</mn></mrow></mfrac><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi>mol</mi></math>.</p><p>The process is isochoric process as the volume of the cylinder remains fixed and&nbsp;helium is a monatomic gas. Therefore, amount of heat needed will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mi>n</mi><mo>Cv</mo><mi>&#916;</mi><mi>T</mi><mo>=</mo><mfenced><mn>2</mn></mfenced><mfenced><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi></mrow></mfenced><mfenced><mn>20</mn></mfenced><mo>=</mo><mn>3</mn><mo>&#215;</mo><mn>8</mn><mo>.</mo><mn>3</mn><mo>&#215;</mo><mn>20</mn><mo>=</mo><mn>498</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p>", "image": null}, "videoSolution": {"videoId": "7156177940914828a9e53b5914702bde", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/QnCxZwoJESFKn.480.jpeg", "thumbnailDark": "https://d1z78 normal\">C</mi><mprescripts/><none/><mo>&#8728;</mo></mmultiscripts><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>]</p>", "image": null}, "options": [], "correctValue": "42", "solution": {"text": "<p>Given here, mass flow rate of water,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>d</mo><mi>m</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi>kg</mi><mo>&#160;</mo><msup><mi>min</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>The geyser heats the water, raising the temperature from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>1</mn></msub><mo>=</mo><mn>30</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#952;</mi><mn>2</mn></msub><mo>=</mo><mn>70</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>.</p><p>Total heat utilised in raising the temperature,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>&#916;</mi><mi>Q</mi></mrow><mrow><mi>&#916;</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>d</mo><mi>m</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac><mo>&#215;</mo><mi>s</mi><mi>&#916;</mi><mi>&#952;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>&#916;</mi><mi>Q</mi></mrow><mrow><mi>&#916;</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>60</mn></mfrac><mo>&#215;</mo><mn>4</mn><mo>.</mo><mn>2</mn><mo>&#215;</mo><mn>40</mn><mo>=</mo><mfrac><mi>m</mi><mi>t</mi></mfrac><mo>&#215;</mo><mi>L</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>=</mo></math> heat of combination<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>8</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>Now, rate of consumption of fuel is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>m</mi><mi>t</mi></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>4</mn><mo>.</mo><mn>2</mn><mo>&#215;</mo><mn>40</mn></mrow><mrow><mn>60</mn><mo>&#215;</mo><mn>8</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>4</mn><mo>.</mo><mn>2</mn></mrow><mn>6</mn></mfrac><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>=</mo><mn>0</mn><mo>.</mo><mn>7</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mi>kg</mi><mo>&#160;</mo><msup><mi>sec</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>42</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>&#160;</mo><msup><mi>min</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d678f9", "previousYearPapers": [{"_id": "62c481f001514d218a7934d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 2)", "title": "JEE Main 2022 (25 Jun Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A copper block of mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>0</mn><mo>&#160;</mo><mi>kg</mi></math> is heated to a temperature of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> and is placed on a large ice block. What is the maximum amount of ice that can melt?<br />[Specific heat of copper : <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>39</mn><msup><mi>Jg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mmultiscripts><mi mathvariant=\"normal\">C</mi><mprescripts></mprescripts><none></none><mo>&#8728;</mo></mmultiscripts><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and latent heat of fusion of water : <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>335</mn><mo>&#160;</mo><msup><mi>Jg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>]", "image": null}, "options": [{"id": "x5Jmo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>kg</mi></math>", "isCorrect": false, "image": null}, {"id": "OnHKG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mi>kg</mi></math>", "isCorrect": false, "image": null}, {"id": "PpnD0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>9</mn><mo>&#160;</mo><mi>kg</mi></math>", "isCorrect": true, "image": null}, {"id": "l97CC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mi>kg</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given, mass of copper block <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>=</mo><mn>5</mn><mo>&#160;</mo><mi>kg</mi></math><br /><br />Change in temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#916;</mo><mtext>t</mtext></mrow></mfenced><mo>=</mo><mn>5</mn><mn>0</mn><mn>0</mn><mo>&#176;</mo><mtext>C</mtext></math><br /><br />Specific heat <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>s</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>39</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mrow><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>-</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>)</mo></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />Latent heat of fusion of water <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>=</mo><mn>335</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><br />Heat energy absorbed by copper block,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">Q</mtext><mn>1</mn></msub><mo>=</mo><mtext mathvariant=\"italic\">ms</mtext><mo>&#916;</mo><mtext mathvariant=\"italic\">t</mtext></math><br /><br />Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi><mo>&#39;</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>kg</mi><mo>&#160;</mo></math>of ice be melted.<br /><br />Heat energy required to melt ice, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mn>2</mn></msub><mo>=</mo><mi>m</mi><mo>&#39;</mo><mi>L</mi></math><br /><br />But heat energy absorbed by copper block is&nbsp;heat energy utilised by ice in melting,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><msub><mi>Q</mi><mn>1</mn></msub><mo>=</mo><msub><mi>Q</mi><mn>2</mn></msub></math>.<br />&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">ms</mtext><mo>&#916;</mo><mtext mathvariant=\"italic\">t</mtext><mo>=</mo><msup><mtext mathvariant=\"italic\">m</mtext><mo>&#39;</mo></msup><mtext mathvariant=\"italic\">L</mtext></math><br />or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext mathvariant=\"italic\">m</mtext><mo>&#39;</mo></msup><mo>=</mo><mfrac><mrow><mtext mathvariant=\"italic\">ms</mtext><mtext>&#160;</mtext><mo>&#916;</mo><mtext mathvariant=\"italic\">t</mtext></mrow><mtext mathvariant=\"italic\">L</mtext></mfrac></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>5</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>3</mn><mn>9</mn><mo>&#215;</mo><mn>5</mn><mn>0</mn><mn>0</mn></mrow><mrow><mn>3</mn><mn>3</mn><mn>5</mn></mrow></mfrac><mo>=</mo><mn>2</mn><mo>.</mo><mn>9</mn><mo>&#160;</mo><mi>kg</mi></math>", "image": null}, "videoSolution": {"videoId": "25bd844bc4dd4315a7c81cd30aba9162", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/McrpCJmlTrYXh.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/McrpCJmlTrYXh.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 2)", "title": "JEE Main 2022 (25 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d678b2", "previousYearPapers": [{"_id": "62c481f001514d218a7934d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 1)", "title": "JEE Main 2022 (25 Jun Shift 1)"}], "type": "numerical", "level": 2, "question": {"text": "<p>A steam engine intakes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math>&nbsp;of steam at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> per minute and cools it down to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. If latent heat of vaporization of steam is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>540</mn><mo>&#160;</mo><mi>cal</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, then the heat rejected by the steam engine per minute is _____&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi>cal</mi></math></p><p>(Given : specific heat capacity of water : <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>cal</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">g</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mmultiscripts><mi mathvariant=\"normal\">C</mi><mprescripts></mprescripts><none></none><mo>&#8728;</mo></mmultiscripts><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>)</p>", "image": null}, "options": [], "correctValue": "31", "solution": {"text": "<p>Heat rejected by the steam engine per minute will be equal to latent heat per minute plus heat rejected by the water to cool down.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#8710;</mo><mi>H</mi></mrow><mrow><mo>&#8710;</mo><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>&#8710;</mo><mi>m</mi></mrow><mrow><mo>&#8710;</mo><mi>t</mi></mrow></mfrac><mi>L</mi><mo>+</mo><mfrac><mrow><mo>&#8710;</mo><mi>m</mi></mrow><mrow><mo>&#8710;</mo><mi>t</mi></mrow></mfrac><mi>s</mi><mo>&#8710;</mo><mi>T</mi><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mfrac><mrow><mo>&#8710;</mo><mi>H</mi></mrow><mrow><mo>&#8710;</mo><mi>t</mi></mrow></mfrac><mo>=</mo><mn>50</mn><mo>&#215;</mo><mn>540</mn><mo>+</mo><mn>50</mn><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><mn>80</mn><mo>=</mo><mn>31000</mn><mo>&#160;</mo><mi>cal</mi><mo>&#160;</mo><msup><mi>min</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mn>31</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi>cal</mi><mo>&#160;</mo><msup><mi>min</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": {"videoId": "2ff853e7262745248350ab8578e24f82", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/RFRFYskI4A08U.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/RFRFYskI4A08U.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 1)", "title": "JEE Main 2022 (25 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d6779a", "previousYearPapers": [{"_id": "62c481f001514d218a7934d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T14:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 2)", "title": "JEE Main 2022 (24 Jun Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math>&nbsp;of iron nail is hit by a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>kg</mi></math> hammer striking at a velocity of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><msup><mrow><mo>&#160;</mo><mi>ms</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. What will be the rise in the temperature of the nail if one fourth of energy of the hammer goes into heating the nail ? [Specific heat capacity of iron <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>.</mo><mn>42</mn><msup><mi>Jg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mmultiscripts><mi mathvariant=\"normal\">C</mi><mprescripts></mprescripts><none></none><mo>&#8728;</mo></mmultiscripts><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>]", "image": null}, "options": [{"id": "vYwDv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>.</mo><mn>07</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": true, "image": null}, {"id": "XNs9T", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>.</mo><mn>75</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "WDtwO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1600</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "6KlwX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>675</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>If we heat-up an object, then, the&nbsp;energy is used to either change the temperature of the body or to change the state of the body.<br />If it&nbsp;changes the temperature, then,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mi>m</mi><mi>S</mi><mo>&#8710;</mo><mi>T</mi></math><br />where,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>&nbsp;is the heat given,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math>&nbsp;is the mass and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>T</mi></math>&nbsp;is the change in temperature.</p><p>We know that a moving object has&nbsp;an energy in the form of kinetic energy, i.e.,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mi>E</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></math></p><p>When that moving object strikes another object,&nbsp;it&nbsp;loses some energy which&nbsp;changes into the heat&nbsp;energy and this heat energy increases the temperature of the object.<br />Given&nbsp;a hammer of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>kg</mi></math>&nbsp;is moving with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.<br />Kinetic energy&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>(</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>)</mo><mo>&#160;</mo><mo>(</mo><mn>60</mn><msup><mo>)</mo><mn>2</mn></msup><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>2700</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><br />One-fourth of kinetic energy changes into heat energy.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>(</mo><mi>K</mi><mi>E</mi><mo>)</mo><mo>&#160;</mo><mo>=</mo></math>&nbsp;Heat energy<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>(</mo><mi>K</mi><mi>E</mi><mo>)</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mi>m</mi><mo>(</mo><mi>S</mi><mo>)</mo><mo>(</mo><mo>&#8710;</mo><mi>T</mi><mo>)</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>(</mo><mn>2700</mn><mo>)</mo><mo>&#160;</mo><mo>=</mo><mo>(</mo><mn>100</mn><mo>)</mo><mo>&#160;</mo><mo>(</mo><mn>0</mn><mo>.</mo><mn>42</mn><mo>)</mo><mo>&#160;</mo><mo>(</mo><mo>&#8710;</mo><mi>T</mi><mo>)</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#8710;</mo><mi>T</mi><mo>=</mo><mn>16</mn><mo>.</mo><mn>07</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math></p>", "image": null}, "videoSolution": {"videoId": "20f73159ca194748b097d539cad44bc4", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/E3KXcNlFclImQ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/E3KXcNlFclImQ.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T14:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 2)", "title": "JEE Main 2022 (24 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66e13", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf821", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-09-01T14:00:00.000Z", "isVisible": true, "shortName": "2021 (01 Sep Shift 2)", "title": "JEE Main 2021 (01 Sep Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Due to cold weather, a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math> water pipe of cross-sectional area <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><msup><mrow><mo>&#160;</mo><mi>cm</mi></mrow><mn>2</mn></msup></math> is filled with ice at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>10</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>.</mo></math>&nbsp;Resistive heating is used to melt the ice. Current of <math xml
