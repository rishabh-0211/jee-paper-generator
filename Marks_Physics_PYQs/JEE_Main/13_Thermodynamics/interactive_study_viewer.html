heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66e25", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf821", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-09-01T14:00:00.000Z", "isVisible": true, "shortName": "2021 (01 Sep Shift 2)", "title": "JEE Main 2021 (01 Sep Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "The width of one of the two slits in a Young&#39;s double slit experiment is three times the other slit. If the amplitude of the light coming from a slit is proportional to the slit-width, the ratio of minimum to maximum intensity in the interference pattern is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>:</mo><mo>&#160;</mo><mn>4</mn></math>&nbsp;where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mi>_</mi><mo>.</mo></math>", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "Given amplitude $\\propto$ slit width<br>Also intensity $\\propto(\\text { Amplitude })^2 \\propto(\\text { Slit width })^2$<br>$\\frac{I_1}{I_2}=\\left(\\frac{3}{1}\\right)^2=9 \\Rightarrow I_1=9 I_2$<br>$\\frac{I_{\\min }}{I_{\\max }}=\\left(\\frac{\\sqrt{I_1}-\\sqrt{I_2}}{\\sqrt{I_1}+\\sqrt{I_2}}\\right)^2=\\left(\\frac{3-1}{3+1}\\right)^2=\\frac{1}{4}=\\frac{x}{4}$<br>$\\Rightarrow x=1$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf821", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-09-01T14:00:00.000Z", "isVisible": true, "shortName": "2021 (01 Sep Shift 2)", "title": "JEE Main 2021 (01 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d676f0", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf820", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T14:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 2)", "title": "JEE Main 2021 (31 Aug Shift 2)"}], "type": "numerical", "level": 1, "question": {"text": "A sample of gas with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>=</mo><mn>1</mn><mo>.</mo><mn>5</mn></math> is taken through an adiabatic process in which the volume is compressed from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1200</mn><msup><mrow><mo>&#160;</mo><mi>cm</mi></mrow><mn>3</mn></msup></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><msup><mrow><mo>&#160;</mo><mi>cm</mi></mrow><mn>3</mn></msup><mo>.</mo></math>&nbsp;If the initial pressure is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#160;</mo><mi>kPa</mi><mo>.</mo></math>&nbsp;The absolute value of the workdone by the gas in the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>________</mi><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>.</mo></math>", "image": null}, "options": [], "correctValue": "480", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mi>i</mi></msub><mo>=</mo><mn>1200</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></mrow><mn>3</mn></msup><mo>,</mo><mo>&#160;</mo><msub><mi>P</mi><mi>i</mi></msub><mo>=</mo><mn>200</mn><mo>&#160;</mo><mi>KPa</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mi>f</mi></msub><mo>=</mo><mn>300</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup><msup><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></mrow><mn>3</mn></msup><mo>,</mo><mo>&#160;</mo><msub><mi>P</mi><mi>f</mi></msub><mo>=</mo><mo>?</mo></math><br /><math xmlns=\"http:// >16</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#215;</mo><mn>300</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow><mrow><mn>1</mn><mo>.</mo><mn>5</mn><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>240</mn><mo>-</mo><mn>480</mn></mrow><mrow><mn>0</mn><mo>.</mo><mn>5</mn></mrow></mfrac><mo>=</mo><mo>-</mo><mn>240</mn><mo>&#215;</mo><mn>2</mn><mo>=</mo><mo>-</mo><mn>480</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>|</mo><mi>W</mi><mo>|</mo><mo>=</mo><mn>480</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf820", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T14:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 2)", "title": "JEE Main 2021 (31 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d67628", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Jul Shift 2)", "title": "JEE Main 2021 (27 Jul Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "One mole of an ideal gas is taken through an adiabatic process where the temperature rises from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>37</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. If the ideal gas is composed of polyatomic molecule that has 4 vibrational modes, which of the following is true? <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>8</mn><mo>.</mo><mn>314</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><msup><mrow><mo>&#160;</mo><mi>mol</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mi mathvariant=\"normal\">k</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math>", "image": null}, "options": [{"id": "RQd4a", "text": "work done by the gas is close to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>332</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "xJXIR", "text": "work done on the gas is close to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>582</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": true, "image": null}, {"id": "eb5Sr", "text": "work done by the gas is close to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>582</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "mTGdh", "text": "work done on the gas is close to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>332</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Since, each vibrational mode, corresponds to two degrees of freedom, hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">f</mi><mo>=3&#160;(</mo><mi>trans</mi><mo>.)&#160;+3(&#160;</mo><mi>rot</mi><mo>.&#160;)+8(&#160;</mo><mi>vib</mi><mo>.&#160;)=14</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#38;</mo><mo>&#160;&#160;</mo><mi>&#947;</mi><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mn>2</mn><mi mathvariant=\"normal\">f</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mn>2</mn><mn>14</mn></mfrac><mo>=</mo><mfrac><mn>8</mn><mn>7</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">W</mi><mo>=</mo><mfrac><mrow><mi>nR</mi><mi>&#916;</mi><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mo>-</mo><mn>582</mn></math></p><p>As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">W</mi><mo>&#60;</mo><mn>0</mn></math>. work is done on the gas.</p>", "image": null}, "videoSolution": {"videoId": "c41c99e5beca44978b9b3571cb783cd3", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/6KBHKlzWMI34G.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/6KBHKlzWMI34G.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Jul Shift 2)", "title": "JEE Main 2021 (27 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d675d4", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf819", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-27T09:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Jul Shift 1)", "title": "JEE Main 2021 (27 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>In the reported figure, there is a cyclic process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>C</mi><mi>D</mi><mi>A</mi></math>&nbsp;on a sample of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> mol of a diatomic gas. The temperature of the gas during the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#8594;</mo><mi>B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>&#8594;</mo><mi>D</mi></math> are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mfenced><mrow><msub><mrow><mo>&#160;</mo><mi>T</mi></mrow><mn>1</mn></msub><mo>&#62;</mo><msub><mi>T</mi><mn>2</mn></msub></mrow></mfenced></math>&nbsp;respectively.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d41690be-d8fb-41c8-a0b0-7f3cbdb21800-image.png\" style=\"width: 250px; height: 239px;\" /></p><p>Choose the correct option out of the following for work done if processes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mi>C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi><mi>A</mi></math> are adiabatic.</p>", "image": null}, "options": [{"id": "UHfV6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>A</mi><mi>B</mi></mrow></msub><mo>=</mo><msub><mi>W</mi><mrow><mi>D</mi><mi>C</mi></mrow></msub></math>", "isCorrect": false, "image": null}, {"id": "eq1Ty", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>A</mi><mi>D</mi></mrow></msub><mo>=</mo><msub><mi>W</mi><mrow><mi>B</mi><mi>C</mi></mrow></msub></math>", "isCorrect": true, "image": null}, {"id": "0RQ7E", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>B</mi><mi>C</mi></mrow></msub><mo>+</mo><msub><mi>W</mi><mrow><mi>D</mi><mi>A</mi></mrow></msub><mo>&#62;</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "J4Fqi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>A</mi><mi>B</mi></mrow></msub><mo>&#60;</mo><msub><mi>W</mi><mrow><mi>C</mi><mi>D</mi></mrow></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Work done in adiabatic process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><m n 2021 (17 Mar Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d672ae", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T14:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 2)", "title": "JEE Main 2021 (25 Feb Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Thermodynamic process is shown below on a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>-</mo><mi>V</mi></math>&nbsp;diagram for one mole of an ideal gas. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><msub><mi>V</mi><mn>1</mn></msub></math>, then the ratio of temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>T</mi><mn>2</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mfrac></math> is :</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c12f95f7-47c6-427c-8bcf-2fb390575cba-image.png\" style=\"width: 280px; height: 196px;\" /></p>", "image": null}, "options": [{"id": "dtTfI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt></math>", "isCorrect": true, "image": null}, {"id": "uVCrp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac></math>", "isCorrect": false, "image": null}, {"id": "PSgDC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "17Oig", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c12f95f7-47c6-427c-8bcf-2fb390575cba-image.png\" style=\"width: 280px; height: 196px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi> ype": "singleCorrect", "level": 3, "question": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;mole of a perfect gas undergoes a cyclic process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>C</mi><mi>A</mi></math>&nbsp;(see figure) consisting of the following processes.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#8594;</mo><mi>B</mi><mo>:</mo></math> Isothermal expansion at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> so that the volume is doubled from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><msub><mi>V</mi><mn>1</mn></msub></math> and pressure changes from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>&#8594;</mo><mi>C</mi><mo>:</mo></math> Isobaric compression at pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub></math> to initial volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub><mo>.</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>&#8594;</mo><mi>A</mi><mo>:</mo></math>&nbsp;Isochoric change leading to change of pressure from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math></p><p>Total work done in the complete cycle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>C</mi><mi>A</mi></math> is:</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/89ffb312-e807-4ae0-b59d-be6dac55c474-image.png\" style=\"width: 270px; height: 222px;\" /></p>", "image": null}, "options": [{"id": "2Plha", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mi>R</mi><mi>T</mi><mfenced><mrow><mi>ln</mi><mn>2</mn><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced></math>", "isCorrect": true, "image": null}, {"id": "JL8Nk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mi>R</mi><mi>T</mi><mi>ln</mi><mn>2</mn></math>", "isCorrect": false, "image": null}, {"id": "GmLAO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mi>R</mi><mi>T</mi><mfenced><mrow><mi>ln</mi><mn>2</mn><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "eBE0U", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mi>isothermal</mi></msub><mo>=</mo><mo mathvariant=\"italic\">nRT</mo><mi>ln</mi><mfenced><mfrac><msub><mi>V</mi><mn>2</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mfrac></mfenced></math>\\</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mi>isobaric</mi></msub><mo>=</mo><mi>P</mi><mi>&#916;</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>&#916;</mi><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mi>isochoric</mi></msub><mo>=</mo><mn>0</mn></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/41577bdb-4fa0-45dc-84b7-ef3d995f5f8f-image.png\" style=\"width: 300px; height: 200px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>1</mn></msub><mo>=</mo><mi>n</mi><mi>R</mi><mi>T</mi><mi>ln</mi><mfenced><mfrac><mrow><mn>2</mn><mo>&#160;</mo><mi>V</mi></mrow><mrow><mo>&#160;</mo><mi>V</mi></mrow></mfrac></mfenced><mo>=</mo><mi>n</mi><mi>R</mi><mi>T</mi><mi heat of diatomic gas</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mfenced><mfrac><mi>m</mi><mi>&#961;</mi></mfrac></mfenced><mi>&#947;</mi></msup><mo>=</mo><mtext>constant</mtext><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math>, As&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>=</mo><mfrac><mi>m</mi><mi>&#961;</mi></mfrac></math></p><p>and mass is constant, then the&nbsp;pressure is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>P</mi><mo>&#8733;</mo><msup><mi>&#961;</mi><mi>&#947;</mi></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msub><mi>P</mi><mi>f</mi></msub><msub><mi>P</mi><mi>i</mi></msub></mfrac><mo>=</mo><msup><mfenced><mfrac><msub><mi>&#961;</mi><mi>f</mi></msub><msub><mi>&#961;</mi><mi>i</mi></msub></mfrac></mfenced><mi>&#947;</mi></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mi>n</mi><msub><mi>P</mi><mi>i</mi></msub></mrow><msub><mi>P</mi><mi>i</mi></msub></mfrac><mo>=</mo><msup><mfenced><mfrac><mrow><mn>32</mn><msub><mi>&#961;</mi><mi>i</mi></msub></mrow><msub><mi>&#961;</mi><mi>i</mi></msub></mfrac></mfenced><msup><mrow></mrow><mrow><mn>7</mn><mo>/</mo><mn>5</mn></mrow></msup></msup><mo>=</mo><mo>(</mo><mn>32</mn><msup><mo>)</mo><mrow><mn>7</mn><mo>/</mo><mn>5</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">n</mi><mo>=</mo><msup><mn>2</mn><mn>7</mn></msup><mo>=</mo><mn>128</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf805", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-05T14:00:00.000Z", "isVisible": true, "shortName": "2020 (05 Sep Shift 2)", "title": "JEE Main 2020 (05 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66aed", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf803", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-04T14:00:00.000Z", "isVisible": true, "shortName": "2020 (04 Sep Shift 2)", "title": "JEE Main 2020 (04 Sep Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "The change in the magnitude of the volume of an ideal gas when a small additional pressure&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi mathvariant=\"normal\">P</mi></math> is applied at a constant temperature, is the same as the change when the temperature is reduced by a small quantity&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi mathvariant=\"normal\">T</mi></math>&nbsp;at constant pressure. The initial temperature and pressure of the gas were <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>&#160;</mo></math>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>atm</mi></math>&nbsp;respectively. If&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>|</mo><mi>&#916;T</mi><mo>|</mo><mo>=</mo><mi mathvariant=\"normal\">C</mi><mo>|</mo><mi>&#916;P</mi><mo>|</mo></math>&nbsp;then value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>&nbsp;in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">K</mi><mo>/</mo><mi>atm</mi><mo>)</mo></math>&nbsp;&nbsp;is __________", "image": null}, "options": [], "correctValue": "150", "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PV</mi><mo>=</mo><mi>nRT</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P&#916;V</mi><mo>+</mo><mi>V&#916;P</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;V</mi><mo>=</mo><mo>-</mo><mfrac><mi>&#916;P</mi><mi mathvariant=\"normal\">P</mi></mfrac><mi mathvariant=\"normal\">V</mi><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math></p><p>&nbsp; In second case</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P&#916;V</mi><mo>=</mo><mo>-</mo><mi>nR&#916;T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;V</mi><mo>=</mo><mo>-</mo><mfrac><mi>nR&#916;T</mi><mi mathvariant=\"normal\">P</mi></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>ii</mi><mo>)</mo></math></p><p>equating&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>ii</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>nR&#916;T</mi><mi mathvariant=\"normal\">P</mi></mfrac><mo>=</mo><mo>-</mo><mfrac><mi>&#916;P</mi><mi mathvariant=\"normal\">P</mi></mfrac><mi mathvariant=\"normal\">V</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;T</mi><mo>=</mo><mi>&#916;P</mi><mo>&#160;</mo><mfrac><mi mathvariant=\"normal\">V</mi><mi>nR</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">c</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">v</mi><mi>nR</mi></mfrac></math></p><p>Putting the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">n</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>&#160;</mo><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>150</mn></math>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf803", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-04T14:00:00.000Z", "isVisible": true, "shortName": "2020 (04 Sep Shift 2)", "title": "JEE Main 2020 (04 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66ae6", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf803", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-04T14:00:00.000Z", "isVisible": true, "shortName": "2020 (04 Sep Shift 2)", "title": "JEE Main 2020 (04 Sep Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match the thermodynamics processes taking place in a system with the correct conditions. In the table : <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>Q</mi><mo>&#160;</mo></math>is the heat supplied, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>W</mi></math> is the work done and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi></math> is change in internal energy of the system.</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 350px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td>Process</td>\t\t\t<td>&nbsp;</td>\t\t\t<td>Condition</td>\t\t</tr>\t\t<tr>\t\t\t<td>(I)</td>\t\t\t<td>Adiabatic</td>\t\t\t<td>(A)</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>W</mi><mo>=</mo><mn>0</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>(II)</td>\t\t\t<td>Isothermal</td>\t\t\t<td>(B)</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>Q</mi><mo>=</mo><mn>0</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>(III)</td>\t\t\t<td>Isochoric</td>\t\t\t<td>(C)</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>&#8800;</mo><mn>0</mn><mo>,</mo><mo>&#8710;</mo><mi>W</mi><mo>&#8800;</mo><mn>0</mn><mo>,</mo><mo>&#8710;</mo><mi>Q</mi><mo>&#8800;</mo><mn>0</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>(IV)</td>\t\t\t<td>\t\t\t<p>Isobaric</p>\t\t\t</td>\t\t\t<td>(D)</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mn>0</mn></math></td>\t\t</tr>\t</tbody></table>", "image": null}, "options": [{"id": "m1COc", "text": "(I) - (A), (II) - (B), (III) - (D), (IV) - (D)", "isCorrect": false, "image": null}, {"id": "udo0G", "text": "(I) - (B), (II) - (A), (III) - (D), (IV) - (C)", "isCorrect": false, "image": null}, {"id": "F0wyK", "text": "(I) - (A), (II) - (A), (III) - (B), (IV) - (C)", "isCorrect": false, "image": null}, {"id": "yttRz", "text": "(I) - (B), (II) - (D), (III) - (A), (IV) - (C)", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>In Adiabatic&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;Q</mi><mo>=</mo><mn>0</mn></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>,</mo><mi>i</mi><mo>.</mo><mi>e</mi><mo>.</mo><mo>,</mo></math>&nbsp;Exchange of heat does not take place.</p><p>In Isothermal&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;U</mi><mo>=</mo><mn>0</mn></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>,</mo><mi>i</mi><mo>.</mo><mi>e</mi><mo>.</mo><mo>,</mo></math>&nbsp;Temperature does not change therefore internal energy also remains constant.</p><p>In Isochoric&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;W</mi><mo>=</mo><mn>0</mn></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>,</mo><mi>i</mi><mo>.</mo><mi>e</mi><mo>.</mo><mo>,</mo></math>&nbsp;Volume remains constant therefore work done is zero.</p><p>In Isobaric&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>&#8800;</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mo>&#8710;</mo><mi>W</mi><mo>&#8800;</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mo>&#8710;</mo><mi>Q</mi><mo>&#8800;</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mi>P</mi><mo>.</mo><mo>&#8710;</mo><mi>V</mi></math>, Volume changes so work done is not equal to zero.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mfrac><mi>f</mi><mn>2</mn></mfrac><mi>P</mi><mo>&#8710;</mo><mi>V</mi></math>, Volume changes therefore internal energy changes.<br />&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>Q</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>p</mi></msub><mo>&#8710;</mo><mi>T</mi></math>, Temperature changes therefore heat also changes.</p><p>&nbsp;</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ecde3d91842a5cf803", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-04T14:00:00.000Z", "isVisible": true, "shortName": "2020 (04 Sep Shift 2)", "title": "JEE Main 2020 (04 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d669fc", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf800", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-03T09:00:00.000Z", "isVisible": true, "shortName": "2020 (03 Sep Shift 1)", "title": "JEE Main 2020 (03 Sep Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A balloon filled with helium&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>32</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mtext>&#8201;</mtext><mi>and</mi><mtext>&#8201;</mtext><mn>1</mn><mo>.7</mo><mi>atm</mi></mrow></mfenced></math>&nbsp;bursts. Immediately after wards the expansion of helium can be considered as :&nbsp;", "image": null}, "options": [{"id": "qGHI7", "text": "irreversible isothermal", "isCorrect": false, "image": null}, {"id": "yHKmc", "text": "irreversible adiabatic", "isCorrect": true, "image": null}, {"id": "xxu0k", "text": "reversible adiabatic", "isCorrect": false, "image": null}, {"id": "JOJUf", "text": "reversible isothermal", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>A thermodynamic process that happens without transmitting heat or mass between the thermodynamic system and its surroundings is known as an adiabatic process.</p><p>An irreversible process is one in which the system and its surroundings are unable to revert to their original states.</p><p>Bursting of a balloon is an irreversible adiabatic process, because energy can not be restored in this process.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf800", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-03T09:00:00.000Z", "isVisible": true, "shortName": "2020 (03 Sep Shift 1)", "title": "JEE Main 2020 (03 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66dd8", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7fd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2020 (09 Jan Shift 2)", "title": "JEE Main 2020 (09 Jan Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "Starting at temperature <math><mn>300</mn><mi></mi><mi>K</mi><mo>,</mo></math> one mole of an ideal diatomic gas <math><mfenced separators=\"|\"><mrow><mi>&#947;</mi><mo>=</mo><mn>1.4</mn></mrow></mfenced></math> is first compressed adiabatically from volume <math><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></math> to <math><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>16</mn></mrow></mfrac><mo>.</mo></math> It is then allowed to expand isobarically to volume <math><mn>2</mn><msub><mrow><mi>V</mi></mrow><mrow><mn>2</mn></mrow></msub></math> . If all the processes are the quasi-static then the final temperature of the gas (in <math><msup><mrow><mi></mi></mrow><mrow><mi>o</mi></mrow></msup><mi>K</mi></math> ) is (to the nearest integer) ___________.", "image": null}, "options": [], "correctValue": "1819", "solution": {"text": "<math><mi>P</mi><msup><mrow><mi>V</mi></mrow><mrow><mi>y</mi></mrow></msup><mo>=</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi></math><br /><math><mi>T</mi><msup><mrow><mi>V</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi></math><br /><math><mn>300</mn><mi></mi><msup><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>1.4</mn><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><msub><mrow><mi>T</mi></mrow><mrow><mi>B</mi></mrow></msub><mi></mi><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>16</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn><mo>/</mo><mn>5</mn></mrow></msup></math><br /><math><msub><mrow><mi>T</mi></mrow><mrow><mi>B</mi></mrow></msub><mo>=</mo><mn>300</mn><mo>×</mo><msup><mrow><mn>2</mn></mrow><mrow><mn>8</mn><mo>/</mo><mn>5</mn></mrow></msup></math><br />Now for BC process<br /><math><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mi>B</mi></mrow></msub></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mi>B</mi></mrow></msub></mrow></mfrac><mo>=</mo><mi></mi><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mi>c</mi></mrow></msub></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mi>c</mi></mrow></msub></mrow></mfrac></math><br /><math><msub><mrow><mi>T</mi></mrow><mrow><mi>c</mi></mrow></msub><mo>=</mo><mi></mi><mfrac><mrow><msub><mrow><mi>V</mi></mrow><mrow><mi>c</mi></mrow></msub><msub><mrow><mi>T</mi></mrow><mrow><mi>B</mi></mrow></msub></mrow><mrow><msub><mrow><mi>v</mi></mrow><mrow><mi>B</mi></mrow></msub></mrow></mfrac><mo>=</mo><mn>2</mn><mo>×</mo><mn>300</mn><mo>×</mo><msup><mrow><mn>2</mn></mrow><mrow><mn>8</mn><mo>/</mo><mn>5</mn></mrow></msup></math><br /><math><msub><mrow><mi>T</mi></mrow><mrow><mi>c</mi></mrow></msub><mo>=</mo><mn>1818.859</mn></math><br /><math><msub><mrow><mi>T</mi></mrow><mrow><mi>c</mi></mrow></msub><mo>=</mo><mn>1819</mn><mi></mi><mi>K</mi></math><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fefec39d-c84f-42af-b368-089e652d4f11.jpeg\" />", "image": null}, "videoSolution": {"videoId": "35f4775eacb347319a08c3c2c267c966", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/dxMRzYWtAXmMX.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/dxMRzYWtAXmMX.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7fd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2020 (09 Jan Shift 2)", "title": "JEE Main 2020 (09 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66d84", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7fc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2020 (09 Jan Shift 1)", "title": "JEE Main 2020 (09 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Which of the following is an equivalent cyclic process corresponding to the thermodynamic cyclic given in the figure? Where, <math><mn>1</mn><mo>&#8594;</mo><mn>2</mn></math> is adiabatic. (Graphs are schematic and are not to scale)<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f07ebaab-f61b-4661-ac7e-a75406af8a0f.jpeg\" />", "image": null}, "options": [{"id": "VcZlP", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/9495245b-81dd-4980-b243-c7486d5295da.jpeg\">", "isCorrect": false, "image": null}, {"id": "6Bbc0", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/41f2a9db-eeb6-4436-b3f7-ffca5d08b75c.jpeg\">", "isCorrect": false, "image": null}, {"id": "RfGIH", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ade121ba-cac8-441c-8ddd-40ce2f0fc99a.jpeg\">", "isCorrect": true, "image": null}, {"id": "mnu3l", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/96a3b841-e141-44c4-8b42-d54b35a9789d.jpeg\">", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#8594;</mo><mn>1</mn></math>, Volume is constant,<br /><math><mi>P</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>P</mi><mi>T</mi><mo>;</mo></math> as P increases T increases.<br />For process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#8594;</mo><mn>2</mn></math>, the process is adiabatic process,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>&#947;</mi></msup><mo>=</mo></math> Constant<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>T</mi><msup><mi>V</mi><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo></math> Constant.<br />For process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#8594;</mo><mn>3</mn></math>, pressure is constant,<br /><math><mi>V</mi><mo>=</mo><mi>k</mi><mi>T</mi></math>.", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ecde3d91842a5cf7fc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2020 (09 Jan Shift 1)", "title": "JEE Main 2020 (09 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66ce7", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7fa", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-08T09:00:00.000Z", "isVisible": true, "shortName": "2020 (08 Jan Shift 1)", "title": "JEE Main 2020 (08 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A thermodynamic cycle <math><mi>x</mi><mi>y</mi><mi>z</mi><mi>x</mi></math> is shown on a <math><mi>V</mi></math> - <math><mi>T</mi></math> diagram.<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d1b1b24f-3b2d-4c64-8e65-2b661e144542-image.png\" style=\"width: 197px; height: 191px;\" /><br />The <math><mi>P</mi></math> - <math><mi>V</mi></math> diagram that best describes this cycle is: (Diagrams are schematic and not to scale)", "image": null}, "options": [{"id": "2RvJf", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/19266f58-ac95-46dd-8956-d70769e6ee28-image.png\" style=\"width: 195px; height: 182px;\" />", "isCorrect": true, "image": null}, {"id": "Bw2IK", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ffed9623-7d9a-45f9-9457-d7058c5fa050-image.png\" style=\"width: 208px; height: 194px;\" />", "isCorrect": false, "image": null}, {"id": "yx0rv", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2392293a-f486-42da-b90d-4437a074acdd-image.png\" style=\"width: 204px; height: 186px;\" />", "isCorrect": false, "image": null}, {"id": "jwl5N", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6b4ad85f-8eb7-4b7f-992e-c8a92d6c6713-image.png\" style=\"width: 225px; height: 210px;\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>According to the ideal equation,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>T</mi></math></p><p>In the given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>&#8208;</mo><mi>T</mi></math>&nbsp;diagram,</p><p>In process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#8594;</mo><mi>y</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>&#8733;</mo><mi>T</mi></math>.&nbsp;So, the process is isobaric process.</p><p>In process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>&#8594;</mo><mi>z</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>=</mo></math>&nbsp;constant. So, the process is an&nbsp;isochoric process.</p><p>In process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>z</mi><mo>&#8594;</mo><mi>x</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo></math>&nbsp;constant. So, the process is an isothermal process.</p><p>Analyzing using the ideal gas equation in each process, the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>&#8208;</mo><mi>V</mi></math>&nbsp;graph can be drawn as shown below,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/19266f58-ac95-46dd-8956-d70769e6ee28-image.png\" style=\"width: 195px; height: 182px;\" /></p>", "image": null}, "videoSolution": {"videoId": "282de4d91f7c4368813753c230a79b3e", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/P1PWzlFOE3DG3.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/P1PWzlFOE3DG3.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ecde3d91842a5cf7fa", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-08T09:00:00.000Z", "isVisible": true, "shortName": "2020 (08 Jan Shift 1)", "title": "JEE Main 2020 (08 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66caa", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-07T14:00:00.000Z", "isVisible": true, "shortName": "2020 (07 Jan Shift 2)", "title": "JEE Main 2020 (07 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Under an adiabatic process, the volume of an ideal gas gets doubled. Consequently, the mean collision time between the gas molecule changes from <math><msub><mrow><mi>&#964;</mi></mrow><mrow><mn>1</mn></mrow></msub></math> to <math><msub><mrow><mi>&#964;</mi></mrow><mrow><mn>2</mn></mrow></msub></math> . If <math><mfrac><mrow><msub><mrow><mi>C</mi></mrow><mrow><mi>P</mi></mrow></msub></mrow><mrow><msub><mrow><mi>C</mi></mrow><mrow><mi>v</mi></mrow></msub></mrow></mfrac><mo>=</mo><mi>&#947;</mi></math> for this gas then a good estimate for <math><mfrac><mrow><msub><mrow><mi>&#964;</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>&#964;</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></math> is given by", "image": null}, "options": [{"id": "BMjXt", "text": "<math><mn>2</mn></math>", "isCorrect": false, "image": null}, {"id": "eXDHx", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "UqDYy", "text": "<math><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mi>γ</mi></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "Xs5OH", "text": "<math><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mfrac><mrow><mi>γ</mi><mo>+</mo><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msup></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Relaxation time <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mi mathvariant=\"normal\">&#964;</mi></mfenced><mo>&#8733;</mo><mfrac><mi mathvariant=\"normal\">V</mi><msqrt><mi mathvariant=\"normal\">T</mi></msqrt></mfrac></math><br />And <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>&#8733;</mo><mfrac><mn>1</mn><msup><mi mathvariant=\"normal\">V</mi><mrow><mi mathvariant=\"normal\">&#947;</mi><mo>-</mo><mn>1</mn></mrow></msup></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#964;</mi><mo>&#8733;</mo><msup><mi mathvariant=\"normal\">V</mi><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">&#947;</mi><mo>-</mo><mn>1</mn></mrow><mn>2</mn></mfrac></mrow></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#964;</mi><mo>&#8733;</mo><msup><mi mathvariant=\"normal\">V</mi><mfrac><mrow><mn>1</mn><mo>+</mo><mi mathvariant=\"normal\">&#947;</mi></mrow><mn>2</mn></mfrac></msup></math><br /><math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">&#964;</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">&#964;</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi></mrow></msub></mrow></mfrac><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</ th><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">b</mi></math>", "isCorrect": false, "image": null}, {"id": "NhH4C", "text": "<math><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">b</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<math><mi mathvariant=\"normal\">a</mi><mo>→</mo></math> Isobaric process <br/><math><mi mathvariant=\"normal\">b</mi><mo>→</mo></math> Isothermal process <br/><math><mi mathvariant=\"normal\">c</mi><mo>→</mo></math> Adiabatic process <br/><math><mi mathvariant=\"normal\">d</mi><mo>→</mo></math> Isochoric process", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ecde3d91842a5cf7f1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 2)", "title": "JEE Main 2019 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d668bf", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ee", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 1)", "title": "JEE Main 2019 (12 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "For the given cyclic process <math><mi>C</mi><mi>A</mi><mi>B</mi></math> as shown for a gas, the work done is:<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ltovredjtcxncsznybroozsgnsindnggwvprafyydwzlnsashv.png\" />", "image": null}, "options": [{"id": "bwDeq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": true, "image": null}, {"id": "EdjHu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "yJ0qb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "BhCTh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The work done in a cyclic process is equal to the area of closed P-V curve cycle.</p><p>Work done,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo></math>&nbsp;Area of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>C</mi><mi>A</mi><mi>B</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>W</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mi>A</mi><mi>B</mi><mo>&#215;</mo><mi>A</mi><mi>C</mi></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mo>(</mo><mn>6</mn><mo>-</mo><mn>1</mn><mo>)</mo><mo>&#215;</mo><mo>(</mo><mn>5</mn><mo>-</mo><mn>1</mn><mo>)</mo><mo>=</mo><mn>10</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p>In the given P-V graph, the process is clockwise. So, the work done will be positive which means that the system is doing the work.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ebde3d91842a5cf7ee", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 1)", "title": "JEE Main 2019 (12 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d667a2", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "In a process, temperature and volume of one mole of an ideal monoatomic gas are varied according to the relation $\\mathrm{VT}=\\mathrm{K},$ where $\\mathrm{K}$ is a constant. In this process the temperature of the gas is increased by $\\Delta \\mathrm{T}$. The amount of heat absorbed by gas is (R is gas constant):", "image": null}, "options": [{"id": "q4RXf", "text": "$\\frac{1}{2} \\mathrm{R} \\Delta \\mathrm{T}$", "isCorrect": true, "image": null}, {"id": "4VVOF", "text": "$\\frac{1}{2} \\mathrm{KR} \\Delta \\mathrm{T}$", "isCorrect": false, "image": null}, {"id": "PbokK", "text": "$\\frac{3}{2} \\mathrm{R} \\Delta \\mathrm{T}$", "isCorrect": false, "image": null}, {"id": "HfIdz", "text": "$\\frac{2 \\mathrm{~K}}{3} \\Delta \\mathrm{T}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to question $\\mathrm{VT}=\\mathrm{K}$\r\n\r\nwe also know that $P V=n R T$\r\n\r\n$\\Rightarrow \\mathrm{T}=\\left(\\frac{\\mathrm{PV}}{\\mathrm{nR}}\\right)$\r\n\r\n$\\Rightarrow \\mathrm{V}\\left(\\frac{\\mathrm{PV}}{\\mathrm{nR}}\\right)=\\mathrm{k} \\Rightarrow \\mathrm{PV}^{2}=\\mathrm{K}$\r\n\r\n$\\because \\mathrm{C}=\\frac{\\mathrm{R}}{1-\\mathrm{x}}+\\mathrm{C}_{\\mathrm{v}}$ (For polytropic process)\r\n\r\n$\\mathrm{C}=\\frac{\\mathrm{R}}{1-2}+\\frac{3 \\mathrm{R}}{2}=\\frac{\\mathrm{R}}{2}$\r\n\r\n$\\therefore \\Delta \\mathrm{Q}=\\mathrm{nC} \\Delta \\mathrm{T}$\r\n\r\n$=\\frac{R}{2} \\times \\Delta \\mathrm{T}$ [here, $\\left.\\mathrm{n}=1 \\mathrm{~mole}\\right]$", "image": null}, "videoSolution": {"videoId": "441f5ef952624ca79252abe6ee13a534", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/VUad7j9dXaymL.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/VUad7j9dXaymL.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d66760", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A rigid diatomic ideal gas undergoes an adiabatic process at room temperature. The relation between temperature and volume for this process is $\\mathrm{TV}^{\\mathrm{x}}=$ constant, then $\\mathrm{x}$ is:", "image": null}, "options": [{"id": "A6vkN", "text": "$\\frac{3}{5}$", "isCorrect": false, "image": null}, {"id": "Ub6p7", "text": "$\\frac{2}{5}$", "isCorrect": true, "image": null}, {"id": "7c2Qf", "text": "$\\frac{2}{3}$", "isCorrect": false, "image": null}, {"id": "j4FuY", "text": "$\\frac{5}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Equation of adiabatic change is\r\n\r\n$$\r\n\r\n\\mathrm{TV}^{\\gamma-1}=\\text { constant }\r\n\r\n$$\r\n\r\nPut $\\gamma=\\frac{7}{5}$, we get: $\\gamma-1=\\frac{7}{5}-1$\r\n\r\n$\\therefore \\mathrm{x}=\\frac{2}{5}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d666fc", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7eb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 2)", "title": "JEE Main 2019 (10 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Half mole of an ideal monoatomic gas is heated at a constant pressure of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mtext>&#8201;</mtext><mi>atm</mi></math> from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#176;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90</mn><mo>&#176;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi></math>. Work done by the gas is<math><mo>(</mo></math>Gas constant,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>8.21</mn><mi>&#160;</mi><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>)", "image": null}, "options": [{"id": "KoVIc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>73</mn><mtext>&#8201;</mtext><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "2PYbr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>581</mn><mtext>&#8201;</mtext><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "n8w99", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>291</mn><mtext>&#8201;</mtext><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": true, "image": null}, {"id": "mUGCy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>146</mn><mtext>&#8201;</mtext><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Recall the formula of work done in terms of change in volume and pressure, in the case of isobaric process, where pressure is constant,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mi>P</mi><msub><mi>V</mi><mn>2</mn></msub><mo>-</mo><mi>P</mi><msub><mi>V</mi><mn>1</mn></msub></math>, now take the idea of ideal gas equation,&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mi>n</mi><mi>R</mi><msub><mi>T</mi><mn>2</mn></msub><mo>-</mo><mi>n</mi><mi>R</mi><msub><mi>T</mi><mn>1</mn></msub></math><math><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#215;</mo><mn>8.31</mn><mfenced separators=\"|\"><mrow><mn>70</mn></mrow></mfenced></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>291</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>.&nbsp;</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7eb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 2)", "title": "JEE Main 2019 (10 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d66532", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 1)", "title": "JEE Main 2019 (09 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A gas can be taken from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> via two different processes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ACB</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ADB</mi></math>.<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c66bfb8f-12d1-4f88-a003-8d04f817e5fd-D561.png\" style=\"width: 224px; height: 189px;\" /><br /><br />When path <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ACB</mi></math> is used <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mi>&#160;</mi><mi mathvariant=\"normal\">J</mi></math> of heat flows into the system and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mi>&#160;</mi><mi mathvariant=\"normal\">J</mi></math> of work is done by the system. If the path <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ADB</mi></math> is&nbsp;used then work done by the system is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math>, the heat flows into the system in the path <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ADB</mi></math> is:", "image": null}, "options": [{"id": "qUVnO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "5k5yc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "6luPK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": true, "image": null}, {"id": "FQoXp", "text": "<math><mn>80</mn><mi> </mi><mi>J</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For path <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ACB</mi></math>,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;Q</mi><mo>=</mo><mi>&#916;U</mi><mo>+</mo><mi>&#916;W</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>=</mo><mi>&#916;U</mi><mo>+</mo><mn>30</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi mathvariant=\"normal\">&#160;</mi><mi>&#916;U</mi><mo>=</mo><mn>30</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><br /><br />For path <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ADB</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;Q</mi><mo>=</mo><mi>&#916;U</mi><mo>+</mo><mi>&#916;W</mi></math><br /><br />As initial and find points are the same, change in internal energy is same in both the cases<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;Q</mi><mo>=</mo><mn>30</mn><mo>+</mo><mn>10</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>40</mn><mi>&#160;</mi><mi mathvariant=\"normal\">J</mi></math>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ebde3d91842a5cf7e8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 1)", "title": "JEE Main 2019 (09 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d66378", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "201 <mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Assuming isochoric process<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mo>&#8710;</mo><mi>U</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mn>0.2</mn><mo>&#215;</mo><mn>4184</mn><mo>&#215;</mo><mn>20</mn></math><br /><br /><math><mo>=</mo><mn>16.7</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">J</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7df", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2016 (09 Apr Online)", "title": "JEE Main 2016 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d6603d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7df", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2016 (09 Apr Online)", "title": "JEE Main 2016 (09 Apr Online)"}], "question": {"text": "The ratio of work done by an ideal monoatomic gas to the heat supplied to it in an isobaric process is", "image": null}, "options": [{"id": "TTMM7", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "JQLV2", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "4rRSb", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "B1GF6", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Work done by an ideal&nbsp;daitomic gas is given by,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mo>&#8710;</mo><mi>Q</mi><mo>-</mo><mo>&#8710;</mo><mi>U</mi><mspace linebreak=\"newline\"></mspace><mo>&#8710;</mo><mi>Q</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>p</mi></msub><mo>&#8710;</mo><mi>T</mi><mo>&#160;</mo><mi>w</mi><mi>h</mi><mi>e</mi><mi>r</mi><mi>e</mi><mo>&#160;</mo><msub><mi>C</mi><mi>p</mi></msub><mo>&#160;</mo><mi>f</mi><mi>o</mi><mi>r</mi><mo>&#160;</mo><mi>d</mi><mi>i</mi><mi>a</mi><mi>t</mi><mi>o</mi><mi>m</mi><mi>i</mi><mi>c</mi><mo>&#160;</mo><mi>g</mi><mi>a</mi><mi>s</mi><mo>&#160;</mo><mi>i</mi><mi>s</mi><mo>&#160;</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi><mspace linebreak=\"newline\"></mspace><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>v</mi></msub><mo>&#8710;</mo><mi>T</mi><mo>&#160;</mo><mi>w</mi><mi>h</mi><mi>e</mi><mi>r</mi><mi>e</mi><mo>&#160;</mo><msub><mi>C</mi><mi>v</mi></msub><mo>&#160;</mo><mi>f</mi><mi>o</mi><mi>r</mi><mo>&#160;</mo><mi>d</mi><mi>i</mi><mi>a</mi><mi>t</mi><mi>o</mi><mi>m</mi><mi>i</mi><mi>c</mi><mo>&#160;</mo><mi>g</mi><mi>a</mi><mi>s</mi><mo>&#160;</mo><mi>i</mi><mi>s</mi><mo>&#160;</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi><mspace linebreak=\"newline\"></mspace><mi>h</mi><mi>e</mi><mi>n</mi><mi>c</mi><mi>e</mi><mo>&#160;</mo><mi>W</mi><mo>=</mo><mi>n</mi><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi><mo>&#8710;</mo><mi>T</mi><mo>-</mo><mi>n</mi><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi><mo>&#8710;</mo><mi>T</mi><mo>=</mo><mi>n</mi><mi>R</mi><mo>&#8710;</mo><mi>T</mi><mfenced><mrow><mfrac><mn>5</mn><mn>2</mn></mfrac><mo>-</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></mrow></mfenced><mo>=</mo><mi>n</mi><mi>R</mi><mo>&#8710;</mo><mi>T</mi></math></p><p>And heat supplies is given by,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mo>&#8710;</mo><mi>Q</mi><msub><mo>)</mo><mi>p</mi></msub><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>p</mi></msub><mo>&#8710;</mo><mi>T</mi><mo>=</mo><mi>n</mi><mfrac><mn>5</mn><mn>2</mn></mfrac><mi>R</mi><mo>&#8710;</mo><mi>T</mi></math></p><p>Hence the ratio is given by<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">W</mi></mrow><msub><mfenced separators=\"|\"><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">Q</mi></mrow></mfenced><mi mathvariant=\"normal\">P</mi></msub></mfrac><mo>=</mo><mfrac><mrow><mi>n</mi><mi>R</mi><mo>&#8710;</mo><mi>T</mi></mrow><mrow><mi>n</mi><mstyle displaystyle=\"true\"><mfrac><mn>5</mn><mn>2</mn></mfrac></mstyle><mi>R</mi><mo>&#8710;</mo><mi>T</mi></mrow></mfrac></math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">W</mi></mrow><msub><mfenced separators=\"|\"><mrow><mo>&#8710;</mo><mi mathvariant=\"normal\">Q</mi></mrow></mfenced><mi mathvariant=\"normal\">P</mi></msub></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>5</mn></mfrac></math><br />&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7df", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2016 (09 Apr Online)", "title": "JEE Main 2016 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65fec", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6488", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2016 (03 Apr)", "title": "JEE Main 2016 (03 Apr)"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math>&nbsp;moles of an ideal gas undergoes a process <math><mi mathvariant=\"normal\">A</mi><mo>&#8594;</mo><mi mathvariant=\"normal\">B</mi></math> as shown in the figure. The maximum temperature of the gas during the process will be:<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1a78d642-10cf-4ba7-82fe-76b29a02abeb-image.png\" style=\"width: 200px; height: 208px;\" />", "image": null}, "options": [{"id": "Tjlwa", "text": "<math><mfrac><mrow><mn>9</mn><mi mathvariant=\"normal\"> </mi><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "T3SN2", "text": "<math><mfrac><mrow><mn>9</mn><mi mathvariant=\"normal\"> </mi><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ZgoGk", "text": "<math><mfrac><mrow><mn>9</mn><mi mathvariant=\"normal\">&nbsp;</mi><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>4</mn><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">R</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "YPj2f", "text": "<math><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\"> </mi><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><mn>2</mn><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">R</mi></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Temperature&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> will be maximum where product of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi></math> is max equation of line<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mo>&#8722;</mo><mfrac><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mfrac><mi>V</mi><mo>+</mo><mn>3</mn><msub><mi>P</mi><mn>0</mn></msub></math><br /><br />Multiplying both sides by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math>,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi><mo>=</mo><mo>&#8722;</mo><mfrac><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mfrac><msup><mi>V</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><msub><mi>P</mi><mn>0</mn></msub><mi>V</mi></math><br /><br />For maxima,&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math> <mrow> <mfrac> <mrow> <mi>d</mi><mo stretchy=\"false\">(</mo><mi>P</mi><mi>V</mi><mo stretchy=\"false\">)</mo></mrow> <mrow> <mi>d</mi><mi>V</mi></mrow> </mfrac> <mo>=</mo><mn>0</mn></mrow> </math><br /><br /><math> <mrow> <mo>&#8658;</mo><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mfrac> <mrow> <mo>&#8722;</mo><mn>2</mn><msub> <mi>P</mi> <mn>0</mn> </msub> </mrow> <mrow> <msub> <mi>V</mi> <mn>0</mn> </msub> </mrow> </mfrac> <mi>V</mi><mo>+</mo><mn>3</mn><msub> <mi>P</mi> <mn>0</mn> </msub> <mo>=</mo><mn>0</mn><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mo>&#8658;</mo><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mi>V</mi><mo>=</mo><mfrac> <mrow> <mn>3</mn><msub> <mi>V</mi> <mn>0</mn> </msub> </mrow> <mn>2</mn> </mfrac> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>and</mtext><mo>&#160;</mo><mi>P</mi><mo>=</mo><mfrac><mrow><mn>3</mn><msub><mi>P</mi><mn>0</mn></msub></mrow><mn>2</mn></mfrac></math><br /><br /><math> <mrow> <mo>&#8658;</mo><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mi>T</mi><mo>=</mo><mfrac> <mrow> <mi>P</mi><mi>V</mi></mrow> <mrow> <mi>n</mi><mi>R</mi></mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mn>9</mn><msub> <mi>P</mi> <mn>0</mn> </msub> <msub> <mi>V</mi> <mn>0</mn> </msub> </mrow> <mrow> <mi>4 n</mi><mi>R</mi></mrow> </mfrac> </mrow> </math><br /><br /><strong>Alternate method :</strong><br /><br />Since initial and final temperature are equal.<br /><br />Hence maximum temperature is at middle of line.<br /><br /><math> <mrow> <mi>P</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><msub> <mi>T</mi> <mrow> <mi>max</mi></mrow> </msub> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>T</mi><mi>max</mi></msub><mo>=</mo><mfrac><mrow><mfenced><mfrac><mrow><mn>3</mn><msub><mi>P</mi><mn>0</mn></msub></mrow><mn>2</mn></mfrac></mfenced><mfenced><mfrac><mrow><mn>3</mn><msub><mi>V</mi><mn>0</mn></msub></mrow><mn>2</mn></mfrac></mfenced></mrow><mrow><mi>n</mi><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>9</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></mrow><mrow><mn>4</mn><mi>n</mi><mi>R</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "648b5a3a0d9d0b909f7b6488", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2016 (03 Apr)", "title": "JEE Main 2016 (03 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65f40", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}], "question": {"text": "An ideal gas goes through a reversible cycle <math><mi>a</mi><mo>&#8594;</mo><mi>b</mi><mo>&#8594;</mo><mi>c</mi><mo>&#8594;</mo><mi>d</mi></math> has the V - T diagram shown below. Process <math><mi>d</mi><mo>&#8594;</mo><mi>a</mi><mi>&#160;</mi><mi>a</mi><mi>n</mi><mi>d</mi><mi>&#160;</mi><mi>b</mi><mo>&#8594;</mo><mi>c</mi></math> are adiabatic.<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/feb64732-39cd-4e8b-b354-6accffa0ae44-image.png\" style=\"width: 257px; height: 183px;\" /><br /><br />The corresponding P - V diagram for the process is (all figures are schematic and not drawn to scale) :", "image": null}, "options": [{"id": "90qyD", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a1963d6d-1d3f-4c22-9fb1-419878818f13-image.png\" style=\"width: 186px; height: 187px;\" />", "image": null, "isCorrect": true}, {"id": "ZOae4", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/652e2071-53ac-4af2-a942-e391a4d9a005-image.png\" style=\"width: 182px; height: 186px;\" />", "image": null, "isCorrect": false}, {"id": "DQ54k", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/4620bc1c-09cd-4f56-87b1-d8d1b666fb8f-image.png\" style=\"width: 177px; height: 183px;\" />", "image": null, "isCorrect": false}, {"id": "c2VdT", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/55331c29-a7c7-4aea-b98a-7416b4e55e10-image.png\" style=\"width: 184px; height: 189px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Is an adiabatic process<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><msup><mi>V</mi><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><mi>c</mi><mi>o</mi><mi>n</mi><mi>s</mi><mi>t</mi><mo>&#8658;</mo><mi>V</mi><msup><mi>T</mi><mfrac><mn>1</mn><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfrac></msup><mo>=</mo><mi>c</mi><mi>o</mi><mi>n</mi><mi>s</mi><mi>t</mi></math><br /><br /><math><mo>&#8658;</mo></math> as T increase V decreases at non-uniform rate<br /><br />In process <math><mi>a</mi><mo>&#8594;</mo><mi>b</mi></math> P = constant as <math><mi>V</mi><mo>&#8733;</mo><mi>T</mi></math><br /><br />In process <math><mi>c</mi><mo>&#8594;</mo><mi>d</mi></math> <math><msup><mrow><mi>P</mi></mrow><mrow><mi>&#8242;</mi></mrow></msup><mo>=</mo></math> constant s <math><mi>V</mi><mo>&#8733;</mo><mi>T</mi></math><br /><br />But since slope of V - T graph <math><mo>&#8733;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>P</mi></mrow></mfrac></math><br /><br />since slope of ab &lt; slope of cd<br /><br /><math><mo>&#8658;</mo><msub><mrow><mi>P</mi></mrow><mrow><mi>a</mi><mi>b</mi></mrow></msub><mo>&#62;</mo><msub><mrow><mi>P</mi></mrow><mrow><mi>c</mi><mi>d</mi></mrow></msub></math><br /><br />Also in adiabatic process <math><mi>d</mi><mo>&#8594;</mo><mi>a</mi></math> as T is increasing V in decreasing<br /><br /><math><mo>&#8658;</mo></math> P is increasing, so P - V diagram is as below<br /><br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a1963d6d-1d3f-4c22-9fb1-419878818f13-image.png\" style=\"width: 186px; height: 187px;\" />", "image": null}, "videoSolution": null, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65ede", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}], "question": {"text": "Consider a spherical shell of radius R at temperature T. The black body radiation inside it can be considered as an ideal gas of photons with internal energy per unit volume <math><mi>u</mi><mo>=</mo><mfrac><mrow><mi>U</mi></mrow><mrow><mi>V</mi></mrow></mfrac><mo>&#8733;</mo><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></math> and pressure <math><mi>p</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>U</mi></mrow><mrow><mi>V</mi></mrow></mfrac></mrow></mfenced></math> . If the shell now undergoes an adiabatic expansion the relation between T and R is:", "image": null}, "options": [{"id": "PnyWr", "text": "<math><mi>T</mi><mo>&prop;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "mu5fu", "text": "<math><mi>T</mi><mo>∝</mo><msup><mrow><mi>e</mi></mrow><mrow><mo>-</mo><mi>R</mi></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "TV5xK", "text": "<math><mi>T</mi><mo>∝</mo><msup><mrow><mi>e</mi></mrow><mrow><mo>-</mo><mn>3</mn><mi>R</mi></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "rdJVi", "text": "<math><mi>T</mi><mo>∝</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>R</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><mo>∵</mo><mi>&nbsp;</mi></math> in an adiabatic process.<br /><br /><math><mi>Q</mi><mo>=</mo><mn>0</mn></math><br /><br />So by first law of thermodynamics<br /><br /><math><mi>Q</mi><mo>=</mo><mi>d</mi><mi>U</mi><mo>+</mo><mi>W</mi></math><br /><br /><math><mo>⇒</mo><
