mn>0</mn><mo>=</mo><mi>d</mi><mi>U</mi><mo>+</mo><mi>W</mi></math><br /><br /><math><mo>⇒</mo><mi>W</mi><mo>=</mo><mo>-</mo><mi>d</mi><mi>U</mi></math><br /><br /><math><mo>∴</mo><mi>W</mi><mo>=</mo><mi>P</mi><mi>d</mi><mi>V</mi></math><br /><br /><math><mo>⇒</mo><mi>P</mi><mi>d</mi><mi>V</mi><mo>=</mo><mo>-</mo><mi>d</mi><mi>U</mi></math> ....(i)<br /><br />Given that <math><mfrac><mrow><mi>U</mi></mrow><mrow><mi>V</mi></mrow></mfrac><mo>∝</mo><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>⇒</mo><mi>U</mi><mo>=</mo><mi>k</mi><mi>V</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></math><br /><br /><math><mo>⇒</mo><mi>d</mi><mi>U</mi><mo>=</mo><mi>k</mi><mi>d</mi><mfenced separators=\"|\"><mrow><mi>V</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow></mfenced><mo>=</mo><mi>K</mi><mfenced separators=\"|\"><mrow><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mi>d</mi><mi>V</mi><mo>+</mo><mn>4</mn><msup><mrow><mi>T</mi></mrow><mrow><mn>3</mn></mrow></msup><mi>V</mi><mi>&nbsp;</mi><mi>d</mi><mi>T</mi></mrow></mfenced></math><br /><br />Also, <math><mi>P</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mfrac><mrow><mi>U</mi></mrow><mrow><mi>V</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mfrac><mrow><mi>k</mi><mi>V</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><mi>V</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>K</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mi>&nbsp;</mi></math><br /><br />Putting these values in equation (i)<br /><br /><math><mo>⇒</mo><mfrac><mrow><mi>K</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup></mrow><mrow><mn>3</mn></mrow></mfrac><mi>d</mi><mi>V</mi><mo>=</mo><mo>-</mo><mi>k</mi><mfenced separators=\"|\"><mrow><msup><mrow><mi>T</mi></mrow><mrow><mn>4</mn></mrow></msup><mi>d</mi><mi>V</mi><mo>+</mo><mn>4</mn><msup><mrow><mi>T</mi></mrow><mrow><mn>3</mn></mrow></msup><mi>V</mi><mi>&nbsp;</mi><mi>d</mi><mi>T</mi></mrow></mfenced></math><br /><br /><math><mo>⇒</mo><mfrac><mrow><mi>T</mi><mi>d</mi><mi>V</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mo>-</mo><mi>T</mi><mi>d</mi><mi>V</mi><mo>-</mo><mn>4</mn><mi>V</mi><mi>d</mi><mi>T</mi></math><br /><br /><math><mo>⇒</mo><mfrac><mrow><mn>4</mn><mi>T</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mi>d</mi><mi>V</mi><mo>=</mo><mo>-</mo><mn>4</mn><mi>V</mi><mi>d</mi><mi>T</mi></math><br /><br /><math><mo>⇒</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mfrac><mrow><mi>d</mi><mi>V</mi></mrow><mrow><mi>V</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mi>d</mi><mi>T</mi></mrow><mrow><mi>T</mi></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">ln</mi></mrow><mo>⁡</mo><mrow><mi>V</mi><mo>=</mo><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">ln</mi></mrow><mo>⁡</mo><mrow><mi>T</mi><mi>&nbsp;</mi><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">ln</mi></mrow><mo>⁡</mo><mrow><mi>V</mi><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">ln</mi></mrow><mo>⁡</mo><mrow><msup><mrow><mi>T</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></mrow></mrow></mrow></mrow></mrow></mrow></mrow></math><br /><br /><math><mo>⇒</mo><mi>V</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mtext>constant</mtext></math><br /><br /><math><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>π</mi><msup><mrow><mi>R</mi></mrow><mrow><mn>3</mn></mrow></msup><mi>&nbsp;</mi><msup><mrow><mi>T</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mtext>constant</mtext></math><br /><br /><math><mi>R</mi><mi>T</mi><mo>=</mo><mtext>constant</mtext></math><br /><br /><math><mo>⇒</mo><mi>T</mi><mo>∝</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>R</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65edc", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}], "question": {"text": "<p>Consider an ideal gas confined in an isolated closed chamber. As the gas undergoes an adiabatic expansion, the average time of collision between molecules increases as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>V</mi><mi mathvariant=\"normal\">q</mi></msup></math> , where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math> is the volume of the gas. The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math> is:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>&#947;</mi><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"italic\">P</mi></msub><msub><mi mathvariant=\"normal\">C</mi><mi>v</mi></msub></mfrac></mrow></mfenced></math></p>", "image": null}, "options": [{"id": "CH04u", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">&gamma;</mi><mo>-</mo><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "UtLUA", "text": "<math> <mrow> <mfrac> <mrow> <mn>3</mn> <mi>&gamma;</mi> <mo>+</mo> <mn>5</mn> </mrow> <mrow> <mn>6</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "cSp1j", "text": "<math><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">&gamma;</mi><mo>-</mo><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "KoECc", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">γ</mi><mo>+</mo><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>For an adiabatic process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><msup><mi>V</mi><mrow><mi>&#947;</mi><mo>&#8722;</mo><mn>1</mn></mrow></msup><mo>=</mo></math> constant.<br />We know that average time of collision between molecules</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#964;</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mi>n</mi><mi>&#960;</mi><msqrt><mn>2</mn></msqrt><msub><mi>v</mi><mi>rms</mi></msub><msup><mi>d</mi><mn>2</mn></msup></mrow></mfrac></math></p><p>where, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo></math>&nbsp;number of molecules per unit volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mrow><mi>rms</mi><mo>&#160;</mo></mrow></msub><mo>=</mo></math> rms velocity of molecules</p><p>As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>&#8733;</mo><mfrac><mn>1</mn><mi>V</mi></mfrac></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>v</mi><mi>rms</mi></msub><mo>&#8733;</mo><msqrt><mi>T</mi></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#964;</mi><mo>&#8733;</mo><mfrac><mi>V</mi><msqrt><mi>T</mi></msqrt></mfrac></math></p><p>Thus, we can write</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>=</mo><msub><mi>K</mi><mn>1</mn></msub><msup><mi>V</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mi>rms</mi></msub><mo>=</mo><msub><mi>K</mi><mn>2</mn></msub><msup><mi>T</mi><mfrac><mn>1</mn><mn>2</mn></mfrac></msup></math>.</p><p>where, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>K</mi><mn>2</mn></msub></math> are constants.</p><p>For adiabatic process, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><msup><mi>V</mi><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo></math> constant. Thus, we can write</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#964;</mi><mo>&#8733;</mo><mi>V</mi><msup><mi>T</mi><mrow><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></msup><mo>&#8733;</mo><mi>V</mi><msup><mfenced><msup><mi>V</mi><mrow><mn>1</mn><mo>-</mo><mi>&#947;</mi></mrow></msup></mfenced><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>2</mn></mfrac></msup></math></p><p>or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#964;</mi><mo>&#8733;</mo><msup><mi>V</mi><mfrac><mrow><mi>&#947;</mi><mo>+</mo><mn>1</mn></mrow><mn>2</mn></mfrac></msup></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65e82", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-19T09:00:00.000Z", "isVisible": true, "shortName": "2014 (19 Apr Online)", "title": "JEE Main 2014 (19 Apr Online)"}], "question": {"text": "A monoatomic gas is compressed from a volume of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math><span style=\"font-size: 10.8333px;\">&nbsp;</span>to a volume of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math>&nbsp;at a constant pressure of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></math>. Then it is heated at constant volume by supplying <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>150</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math> of energy. As a result,&nbsp;the internal energy of the gas", "image": null}, "options": [{"id": "8h7qC", "text": "Decreases by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "ZB59j", "text": "Increases by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>250</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}, {"id": "73Vm6", "text": "Decreases by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>250</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "7qst1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Isobaric process with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mn>0</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;</mo><mn>0</mn><mo>=</mo><mtext mathvariant=\"italic\">W</mtext><mo>+</mo><mo>&#916;</mo><mtext mathvariant=\"italic\">U</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mn>0</mn><mo>=</mo><mtext mathvariant=\"italic\">P</mtext><mo>&#916;</mo><mtext mathvariant=\"italic\">V</mtext><mo>+</mo><mo>&#916;</mo><mtext mathvariant=\"italic\">U</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;</mo><mo>&#916;</mo><mtext mathvariant=\"italic\">U</mtext><mo>=</mo><mo>-</mo><mtext mathvariant=\"italic\">P</mtext><mo>&#916;</mo><mtext mathvariant=\"italic\">V</mtext></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>1</mn><mn>0</mn><mn>0</mn><mfenced close=\"}\" open=\"{\"><mrow><mn>1</mn><mo>-</mo><mn>2</mn></mrow></mfenced><mo>&#160;</mo><mtext>J</mtext></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#916;</mo><mtext mathvariant=\"italic\">U</mtext><mo>=</mo><mn>1</mn><mn>0</mn><mn>0</mn><mtext>&#160;J</mtext></math><br /><br />Constant volume with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mn>150</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext mathvariant=\"italic\">Q</mtext><mo>=</mo><mn>0</mn><mo>+</mo><mo>&#916;</mo><mtext mathvariant=\"italic\">U</mtext></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;</mo><mo>&#916;</mo><msub><mtext mathvariant=\"italic\">U</mtext><mn>2</mn></msub><mo>=</mo><mn>1</mn><mn>5</mn><mn>0</mn><mo>J</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;&#160;</mo><mo>&#916;</mo><mtext mathvariant=\"italic\">U</mtext><mo>=</mo><mo>&#916;</mo><msub><mtext mathvariant=\"italic\">U</mtext><mn>1</mn></msub><mo>+</mo><mo>&#916;</mo><msub><mtext mathvariant=\"italic\">U</mtext><mn>2</mn></msub></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mo>+</mo> <mn>2</mn> <mn>5</mn> <mn>0</mn> <mo>J</mo> </mrow> </math><br /><br />Hence, internal energy increases by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>250</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-19T09:00:00.000Z", "isVisible": true, "shortName": "2014 (19 Apr Online)", "title": "JEE Main 2014 (19 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65dd1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}], "question": {"text": "An ideal monoatomic gas is confined in a cylinder by a spring loaded piston of cross section $8.0 \\times 10^{-3} \\mathrm{~m}^2$. Initially the gas is at $300 \\mathrm{~K}$ and occupies a volume of $2.4 \\times 10^{-3} \\mathrm{~m}^3$ and the spring is in its relaxed state as shown in figure. The gas is heated by a small heater until the piston moves out slowly by $0.1 \\mathrm{~m}$. The force constant of the spring is $8000 \\mathrm{~N} / \\mathrm{m}$ and the atmospheric pressure is $1.0 \\times 10^5 \\mathrm{~N} / \\mathrm{m}^2$. The cylinder and the piston are thermally insulated. The piston and the spring are massless and there is no friction between the piston and the cylinder. The final temperature of the gas will be: (Neglect the heat loss through the lead wires of the heater. The heat capacity of the heater coil is also negligible).\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/Bls62ubwSF5-q4Zq7yLFuC84FHGcfP9Ikww4cvswGy8.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "O35JI", "text": "\n$300 \\mathrm{~K}$\n", "image": null, "isCorrect": false}, {"id": "BEM4M", "text": "\n$800 \\mathrm{~K}$\n", "image": null, "isCorrect": false}, {"id": "egwaN", "text": "\n$500 \\mathrm{~K}$\n", "image": null, "isCorrect": true}, {"id": "ZNKRK", "text": "\n$1000 \\mathrm{~K}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65dd0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}], "question": {"text": "During an adiabatic compression, $830 \\mathrm{~J}$ of work is done on 2 moles of a diatomic ideal gas to reduce its volume by $50 \\%$. The change in its temperature is nearly: $\\left(\\mathrm{R}=8.3 \\mathrm{JK}^{-1} \\mathrm{~mol}^{-1}\\right)$", "image": null}, "options": [{"id": "h5Wto", "text": "\n$40 \\mathrm{~K}$\n", "image": null, "isCorrect": false}, {"id": "ARzyp", "text": "\n$33 \\mathrm{~K}$\n", "image": null, "isCorrect": false}, {"id": "siQry", "text": "\n$20 \\mathrm{~K}$\n", "image": null, "isCorrect": true}, {"id": "Z16Gs", "text": "\n$14 \\mathrm{~K}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given : work done, $W=830 \\mathrm{~J}$\nNo. of moles of gas, $\\mu=2$\nFor diatomic gas $\\gamma=1.4$\nWork done during an adiabatic change\n$$\n\\begin{aligned}\n&W=\\frac{\\mu R\\left(T_1-T_2\\right)}{\\gamma-1} \\\\\n&\\Rightarrow 830=\\frac{2 \\times 8.3(\\Delta T)}{1.4-1}=\\frac{2 \\times 8.3(\\Delta T)}{0.4} \\\\\n&\\Rightarrow \\Delta T=\\frac{830 \\times 0.4}{2 \\times 8.3}=20 \\mathrm{~K}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65d7e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2014 (09 Apr Online)", "title": "JEE Main 2014 (09 Apr Online)"}], "question": {"text": "The equation of state for a gas is given by <math> <mrow> <mtext>PV</mtext> <mo>=</mo> <mtext>nRT</mtext> <mo>+</mo> <mi>&#945;</mi> <mtext>V</mtext> </mrow> </math>,&nbsp;where n is the number of moles and <math> <mrow> <mi>&#945;</mi></mrow> </math>&nbsp; is a positive constant. The initial temperature and pressure of one mole of the gas contained in a cylinder are T<sub>0</sub> and P<sub>0</sub> respectively. The work done by the gas when its temperature doubles isobarically will be :", "image": null}, "options": [{"id": "8YzTk", "text": "<math> <mrow> <msub> <mtext>P</mtext> <mtext>0</mtext> </msub> <msub> <mo>T</mo> <mtext>0</mtext> </msub> <mi></mi><mi></mi><mi>ln</mi><mo>⁡</mo> <mo>2</mo> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "IBgUA", "text": "<math> <mrow> <mfrac> <mrow> <msub> <mtext>P</mtext> <mtext>0</mtext> </msub> <msub> <mo>T</mo> <mtext>0</mtext> </msub> <mo>R</mo> </mrow> <mrow> <msub> <mtext>P</mtext> <mtext>0</mtext> </msub> <mo>+</mo> <mi>&alpha;</mi> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "OmI0d", "text": "<math> <mrow> <mfrac> <mrow> <msub> <mtext>P</mtext> <mtext>0</mtext> </msub> <msub> <mo>T</mo> <mtext>0</mtext> </msub> <mo>R</mo> </mrow> <mrow> <msub> <mtext>P</mtext> <mtext>0</mtext> </msub> <mo>-</mo> <mi>&alpha;</mi> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "3Swrq", "text": "<math> <mrow> <msub> <mtext>P</mtext> <mtext>0</mtext> </msub> <msub> <mo>T</mo> <mtext>0</mtext> </msub> <mo>R</mo> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>PV</mtext> <mo>=</mo> <mtext>nRT</mtext> <mo>+</mo> <mi>&alpha;</mi> <mtext>V</mtext> </mrow> </math><br /><br /><math> <mrow> <mfrac> <mrow> <msub> <mtext>P</mtext> <mn>0</mn> </msub> <mtext>dV</mtext> </mrow> <mrow> <mtext>dT</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>R</mtext> <mo>+</mo> <mi>&alpha;</mi> <mfrac> <mrow> <mtext>dV</mtext> </mrow> <mrow> <mtext>dT</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>P</mtext> <mn>0</mn> </msub> <mo>-</mo> <mi>&alpha;</mi> </mrow> </mfenced> <mfrac> <mrow> <mtext>dV</mtext> </mrow> <mrow> <mtext>dT</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>R</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>&there4;&nbsp;&nbsp;&nbsp;</mo> <mtext>dV</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>RdT</mtext> </mrow> <mrow> <msub> <mtext>P</mtext> <mn>0</mn> </msub> <mo>-</mo> <mi>&alpha;</mi> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mo>&there4;&nbsp;&nbsp;&nbsp;</mo> <mtext>W</mtext> <mo>=</mo> <mo>&int;</mo> <msub> <mo>P</mo> <mn>0</mn> </msub> <mtext>dV</mtext> <mo>=</mo> <munderover> <mo>&int;</mo> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <mrow> <mn>2</mn> <msub> <mtext>T</mtext> <mn>0</mn> </msub> </mrow> </munderover> <mfrac> <mrow> <msub> <mtext>P</mtext> <mn>0</mn> </msub> <mtext>R</mtext> </mrow> <mrow> <msub> <mtext>P</mtext> <mn>0</mn> </msub> <mo>-</mo> <mi>&alpha;</mi> </mrow> </mfrac> <mtext>dT</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>=</mo> <mfrac> <mrow> <msub> <mtext>P</mtext> <mn>0</mn> </msub> <msub> <mtext>T</mtext> <mn>0</mn> </msub> <mtext>R</mtext> </mrow> <mrow> <msub> <mtext>P</mtext> <mn>0</mn> </msub> <mo>-</mo> <mi>&alpha;</mi> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2014 (09 Apr Online)", "title": "JEE Main 2014 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65d1c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6486", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2014 (06 Apr)", "title": "JEE Main 2014 (06 Apr)"}], "question": {"text": "<p>One mole of diatomic ideal gas undergoes a cyclic process ABC as shown in figure. The process BC is adiabatic. The temperatures at A, B and C are 400 K, 800 K and 600 K respectively. Choose the correct statement :<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/Q_12_Question_1.jpg\" style=\"width: 200px; height: 205px;\" /></p>\r", "image": null}, "options": [{"id": "6BGih", "text": "The change in internal energy in whole cyclic process is 250 R", "image": null, "isCorrect": false}, {"id": "YmXHG", "text": "The change in internal energy in the process CA is 700 R.", "image": null, "isCorrect": false}, {"id": "tKTBx", "text": "The change in internal energy in the process AB is&nbsp; - 350 R", "image": null, "isCorrect": false}, {"id": "9KhdV", "text": "The change in internal energy in the process BC is&nbsp; - 500 R", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/EM0025732_Ans_.jpg\" style=\"width: 215px; height: 190px;\" /><br /><br /><br /><math> <mrow> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>CA</mtext> </msub> <mo>=</mo> <msub> <mtext>nc</mtext> <mtext>v</mtext> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>T</mtext> <mtext>A</mtext> </msub> <mo>-</mo> <msub> <mtext>T</mtext> <mtext>C</mtext> </msub> </mrow> </mfenced> <mo>=</mo> <mn>1</mn> <mo>&times;</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>-</mo> <mn>2</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfenced> <mo>=</mo> <mo>-</mo> <mn>5</mn> <mn>0</mn> <mn>0</mn> <mtext>R</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>AB</mtext> </msub> <mo>=</mo> <msub> <mtext>nc</mtext> <mtext>v</mtext> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>T</mtext> <mtext>B</mtext> </msub> <mo>-</mo> <msub> <mtext>T</mtext> <mtext>A</mtext> </msub> </mrow> </mfenced> <mo>=</mo> <mn>1</mn> <mo>&times;</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> <mo>&times;</mo> <mn>4</mn> <mn>0</mn> <mn>0</mn> <mo>=</mo> <mo>+</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mn>0</mn> <mtext>R</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>&Delta;</mo> <msub> <mtext>U</mtext> <mtext>BC</mtext> </msub> <mo>=</mo> <msub> <mtext>nc</mtext> <mtext>v</mtext> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <msub> <mtext>T</mtext> <mtext>C</mtext> </msub> <mo>-</mo> <msub> <mtext>T</mtext> <mtext>B</mtext> </msub> </mrow> </mfenced> <mo>=</mo> <mn>1</mn> <mo>&times;</mo> <mfrac> <mrow> <mn>5</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mtext>R</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>-</mo> <mn>2</mn> <mn>0</mn> <mn>0</mn> </mrow> </mfenced> <mo>=</mo> <mo>-</mo> <mn>5</mn> <mn>0</mn> <mn>0</mn> <mtext>R</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "648b5a3a0d9d0b909f7b6486", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2014 (06 Apr)", "title": "JEE Main 2014 (06 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65cc1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}], "question": {"text": "A sample of gas expands from $V_1$ to $V_2$. In which of the following, the work done will be greatest?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/lqXD0vKUfjFklRy0miNMuJZwFFKkuYzMGjnjf3FISY8.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "hgbhJ", "text": "\nSame in all processes\n", "image": null, "isCorrect": false}, {"id": "8bZaj", "text": "\nIsobaric process\n", "image": null, "isCorrect": true}, {"id": "CIUNb", "text": "\nIsothermal process\n", "image": null, "isCorrect": false}, {"id": "LFJLj", "text": "\nAdiabatic process", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Work done $=$ Area bounded by PV graph and volume axis\nAmong the three process, bounded area by PV graph and volume axis is greatest for isobaric process, hence work done is greatest for isobaric process.", "image": null}, "videoSolution": null, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c1b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}], "question": {"text": "A certain amount of gas is taken through a cyclic process (A B C D A) that has two isobars, one isochore and one isothermal. The cycle can be represented on a $\\mathrm{P}-\\mathrm{V}$ indicator diagram as :", "image": null}, "options": [{"id": "9l5rP", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/lmr0HKzI7kUVtnwq77y7McRoVsFX8hFgiEgIPFArGsk.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "gpsfU", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/OxofYR0EWeoKcNXyRMUdZR0jlyE5xK3BAxdLy4_83Lw.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "25iOY", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/MJT97Gb1GR_l0XJpYqWomQEEwaB5-bsDjD6-FTkCZrY.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "vBZq3", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/qvUsIHjYuYvvw398VfJe2BmKUHt-xp8ue_QpNccFDP4.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "P-V indicator diagram for isobaric\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5puGDFiM9RoRMF1h575h0_uYOQloVJ5vA34GZ90O838.original.fullsize.png\"><br>\n$\\mathrm{P}-\\mathrm{V}$ indicator diagram for isochoric process<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/byDpfy4eZ2fXajGM1DIkMOsZO7vv8Jabbvm0dk0cebs.original.fullsize.png\"><br>\n$\\mathrm{P}-\\mathrm{V}$ indicator diagram for isothermal process<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3vPNwz2sYWGz2DAFjEkJeiUfQj4L2m8zot6cXJzP_cA.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c0a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}], "question": {"text": "An ideal gas at atmospheric pressure is adiabatically compressed so that its density becomes 32 times of its initial value. If the final pressure of gas is 128 atmospheres, the value of ' $\\gamma$ 'of the gas is :", "image": null}, "options": [{"id": "8cq8H", "text": "\n$1.5$\n", "image": null, "isCorrect": false}, {"id": "dY2Dr", "text": "\n$1.4$\n", "image": null, "isCorrect": true}, {"id": "Q97K4", "text": "\n$1.3$\n", "image": null, "isCorrect": false}, {"id": "DXkSR", "text": "\n$1.6$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Volume of the gas $\\mathrm{v}=\\frac{\\mathrm{m}}{\\mathrm{d}}$ and using $\\mathrm{PV}^\\gamma=$ constant\n$$\n\\begin{aligned}\n& \\frac{\\mathrm{P}^{\\prime}}{\\mathrm{P}}=\\frac{\\mathrm{V}}{\\mathrm{V}^{\\prime}}=\\left(\\frac{\\mathrm{d}^{\\prime}}{\\mathrm{d}}\\right)^\\gamma \\\\\n& \\text { or } 128=(32)^\\gamma \\\\\n& \\therefore \\gamma=\\frac{7}{5}=1.4\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65bc2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}], "question": {"text": "Figure shows the variation in temperature $(\\Delta \\mathrm{T})$ with the amount of heat supplied $\\mathrm{(Q)}$ in an isobaric process corresponding to a monoatomic $\\mathrm{(M)}$, diatomic $\\mathrm{(D)}$ and a polyatomic $\\mathrm{(P)}$ gas. The initial state of all the gases are the same and the scales for the two axes coincide. Ignoring vibrational degrees of freedom, the lines $a, b$ and $c$ respectively correspond to :\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/FDNkr1-n1jSa40_tHyMrUO94OSN_TFtIax96QZrxgqU.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "QQcae", "text": "\n$\\mathrm{P}$, $\\mathrm{M}$ and $\\mathrm{D}$\n", "image": null, "isCorrect": false}, {"id": "mcM8N", "text": "\n$\\mathrm{M}$, $\\mathrm{D}$ and $\\mathrm{P}$\n", "image": null, "isCorrect": true}, {"id": "8BH5W", "text": "\n$\\mathrm{P}$, $\\mathrm{D}$ and $\\mathrm{M}$\n", "image": null, "isCorrect": false}, {"id": "1e1XI", "text": "\n$\\mathrm{D}$, $\\mathrm{M}$ and $\\mathrm{P}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "On giving same amount of heat at constant pressure, there is no change in temperature for mono, dia and polyatomic.\n$(\\Delta \\mathrm{Q})_{\\mathrm{P}}=\\mu \\mathrm{C}_{\\mathrm{p}} \\Delta \\mathrm{T}\\left(\\mu=\\frac{\\text { No. of molecules }}{\\text { Avogedro's no. }}\\right)$\nor $\\quad \\Delta \\mathrm{T} \\propto \\frac{1}{\\text { no. of molecules }}$", "image": null}, "videoSolution": null, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65ab0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}], "question": {"text": "An ideal monatomic gas with pressure $P$, volume $V$ and temperature $T$ is expanded isothermally to a volume $2 V$ and a final pressure $P_i$. If the same gas is expanded adiabatically to a volume $2 \\mathrm{~V}$, the final pressure is $P_a$. The ratio $\\frac{P_a}{P_i}$ is", "image": null}, "options": [{"id": "0O31m", "text": "\n$2^{-1 / 3}$\n", "image": null, "isCorrect": false}, {"id": "3DZXG", "text": "\n$2^{1 / 3^6}$\n", "image": null, "isCorrect": false}, {"id": "DAZkh", "text": "\n$2^{2 / 3}$\n", "image": null, "isCorrect": false}, {"id": "n1aoR", "text": "\n$2^{-2 / 3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For isothermal process :\n$$\n\\begin{aligned}\n& P V=P_i 2 V \\\\\n& P=2 P_i\n\\end{aligned}\n$$\nFor adiabatic process\n$$\n\\mathrm{PV}^\\gamma=\\mathrm{P}_{\\mathrm{a}}(2 \\mathrm{~V})^\\gamma\n$$\n$(\\because$ for monatomic gas $\\gamma=5 / 3)$\n[From (i) ]\nor, $\\quad 2 \\mathrm{P}_{\\mathrm{i}} \\mathrm{V}^{\\frac{5}{3}}=P_a(2 \\mathrm{~V})^{\\frac{5}{3}}$\n$$\n\\begin{aligned}\n& \\Rightarrow \\frac{P_a}{P_i}=\\frac{2}{2^{\\frac{5}{3}}} \\\\\n& \\Rightarrow \\frac{P_a}{P_i}=2^{\\frac{-2}{3}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a5e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}], "question": {"text": "The pressure of an ideal gas varies with volume as $P=\\alpha V$, where $\\alpha$ is a constant. One mole of the gas is allowed to undergo expansion such that its volume becomes ' $m$ ' times its initial volume. The work done by the gas in the process is", "image": null}, "options": [{"id": "cDXyf", "text": "\n$\\frac{\\alpha V}{2}\\left(m^2-1\\right)$\n", "image": null, "isCorrect": false}, {"id": "XbJ1S", "text": "\n$\\frac{\\alpha^2 V^2}{2}\\left(m^2-1\\right)$\n", "image": null, "isCorrect": false}, {"id": "ViE4W", "text": "\n$\\frac{\\alpha}{2}\\left(m^2-1\\right)$\n", "image": null, "isCorrect": false}, {"id": "zxm7X", "text": "\n$\\frac{\\alpha V^2}{2}\\left(m^2-1\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $P=\\alpha V$\nWork done, $w=\\int_V^{m V} P d V$\n$=\\int_V^{m V} \\alpha V d V=\\frac{\\alpha V^2}{2}\\left(m^2-1\\right)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d659ed", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}], "question": {"text": "$n$ moles of an ideal gas undergo a process $A \\rightarrow B$ as shown in the figure. Maximum temperature of the gas during the process is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5K-QnjAnePVrTyiX2jsk1Tn3reCBdq9nhssOS9kB51s.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "1lN9Y", "text": "\n$\\frac{9 P_0 V_0}{n R}$\n", "image": null, "isCorrect": false}, {"id": "sZOfm", "text": "\n$\\frac{3 P_0 V_0}{2 n R}$\n", "image": null, "isCorrect": false}, {"id": "w2Icl", "text": "\n$\\frac{9 P_0 V_0}{2 n R}$\n", "image": null, "isCorrect": false}, {"id": "6t8hm", "text": "\n$\\frac{9 P_0 V_0}{4 n R}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For given graph, equation of $P$ - $V$ line is\n$$\nP-2 P_0=\\frac{2 P_0-P_0}{V_0-2 V_0}\\left(V-V_0\\right)\n$$\nSo, $P=3 P_0-\\frac{P_0}{V_0} V$ as $P V=n R T$\n$$\n\\Rightarrow\\left(3 P_0-\\frac{P_0}{V_0} V\\right) V=n R T ;\n$$\nFor maximum temperature $\\frac{d T}{d V}=0$\n$$\n\\Rightarrow \\frac{d T}{d V}=3 P_0-\\frac{2 P_0}{V_0} V=0 \\Rightarrow V=\\frac{3}{2} V_0\n$$\nAlso $P=\\frac{3}{2} P_0$\nSo, $T=\\frac{P V}{n R}=\\frac{1}{n R} \\times \\frac{3}{2} P_0 \\times \\frac{3}{2} V_0=\\frac{9 P_0 V_0}{4 n R}$", "image": null}, "videoSolution": null, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d659e8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}], "question": {"text": "A given ideal gas with $\\gamma=\\frac{C_p}{C_v}=1.5$ at a temperature $T$. If the gas is compressed adiabatically to one-fourth of its initial volume, the final temperature will be", "image": null}, "options": [{"id": "4Z4iv", "text": "\n$2 \\sqrt{2} T$\n", "image": null, "isCorrect": false}, {"id": "1TZjT", "text": "\n$4 T$\n", "image": null, "isCorrect": false}, {"id": "4LhI4", "text": "\n$2 T$\n", "image": null, "isCorrect": true}, {"id": "hfn49", "text": "\n$8 T$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$T V^{\\gamma-1}=$ constant\n$$\n\\begin{aligned}\n& T_1 V_1^{\\gamma-1}=\\mathrm{T}_2 V_2^{\\gamma-1} \\\\\n& \\Rightarrow T(V)^{1 / 2}=\\mathrm{T}_2\\left(\\frac{V}{4}\\right)^{1 / 2} \\\\\n& {\\left[\\because \\gamma=1.5, T_1=T, V_1=V \\text { and } V_2=\\frac{V}{4}\\right]} \\\\\n& \\therefore \\quad T_2=\\left(\\frac{4 V}{V}\\right)^{1 / 2} T=2 T\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6599b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}], "question": {"text": "This question has Statement 1 and Statement 2. Of the four choices given after the Statements, choose the one that best describes the two Statements.\nStatement 1: In an adiabatic process, change in internal energy of a gas is equal to work done on/ by the gas in the process.\nStatement 2: The temperature of a gas remains constant in an adiabatic process.", "image": null}, "options": [{"id": "jsC4L", "text": "\nStatement 1 is true, Statement 2 is true, Statement 2 is a correct explanation of Statement 1.\n", "image": null, "isCorrect": false}, {"id": "EF8zT", "text": "\nStatement 1 is true, Statement 2 is false.\n", "image": null, "isCorrect": true}, {"id": "M6qmc", "text": "\nStatement 1 is false, Statement 2 is true.\n", "image": null, "isCorrect": false}, {"id": "wXP5e", "text": "\nStatement 1 is false, Statement 2 is true, Statement 2 is not a correct explanation of Statement 1.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In an adiabatic process, $\\delta \\mathrm{H}=0$ And according to first law of thermodynamics\n$$\n\\begin{aligned}\n& \\delta H=\\delta U+W \\\\\n& \\therefore W=-\\delta U\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6598f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}], "question": {"text": "A perfect gas at $27^{\\circ} \\mathrm{C}$ is heated at constant pressure so as to double its volume. The final temperature of the gas will be, close to", "image": null}, "options": [{"id": "y3yaW", "text": "\n$327^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": true}, {"id": "UxBHc", "text": "\n$200^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": false}, {"id": "LnlmT", "text": "\n$54^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": false}, {"id": "SRoRR", "text": "\n$300^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $V_1=V$\n$$\n\\begin{aligned}\n& V_2=2 V \\\\\n& T_1=27^{\\circ}+273=300 \\mathrm{~K} \\\\\n& T_2=?\n\\end{aligned}\n$$\nFrom charle's law\n$$\n\\frac{V_1}{T_1}=\\frac{V_2}{T_2}(\\because \\text { Pressure is constant })\n$$\nor, $\\frac{V}{300}=\\frac{2 V}{T_2}$\n\n$$\n\\therefore \\quad T_2=600 \\mathrm{~K}=600-273=327^{\\circ} \\mathrm{C}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65afd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}], "question": {"text": "Helium gas goes through a cycle $\\mathrm{ABCDA}$ (consisting of two isochoric and two isobaric lines) as shown in figure. Efficiency of this cycle is nearly: \n (Assume the gas to be close to ideal gas)\n <img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/rVdThf6O8H2spdWc4Dnsk-1mT0Kk5WwjwRbvAp0K6cY.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "ifHsf", "text": "\n$15.4 \\%$\n", "image": null, "isCorrect": true}, {"id": "XxkF7", "text": "\n$9.1 \\%$\n", "image": null, "isCorrect": false}, {"id": "PvD8S", "text": "\n$10.5 \\%$\n", "image": null, "isCorrect": false}, {"id": "b5OJ0", "text": "\n$12.5 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Work done in complete cycle $=$ Area under $\\mathrm{P-V}$ graph\n$=\\mathrm{P}_0 \\mathrm{V}_0$\nfrom $A$ to $B$, heat given to the gas\n$=\\mathrm{nC}_{\\mathrm{v}} \\Delta \\mathrm{T}=\\mathrm{n} \\frac{3}{2} \\mathrm{R} \\Delta \\mathrm{T}=\\frac{3}{2} \\mathrm{~V}_0 \\Delta \\mathrm{P}=\\frac{3}{2} \\mathrm{P}_0 \\mathrm{V}_0$\nfrom $B$ to $C$, heat given to the system\n$=n C_{\\mathrm{p}} \\Delta \\mathrm{T}=\\mathrm{n}\\left(\\frac{5}{2} \\mathrm{R}\\right) \\Delta \\mathrm{T}$\n$=\\frac{5}{2}\\left(2 \\mathrm{P}_0\\right) \\Delta \\mathrm{V}=5 \\mathrm{P}_0 \\mathrm{V}_0$\nfrom $C$ to $D$ and $D$ to $A$, heat is rejected.\n$\\text { efficiency, } \\eta=\\frac{\\text { work done by gas }}{\\text { heat given to the gas }} \\times 100$\n$\\eta=\\frac{P_0 V_0}{\\frac{3}{2} P_0 V_0+5 P_0 V_0}=15.4 \\%$", "image": null}, "videoSolution": null, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d658e7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}], "question": {"text": "A diatomic ideal gas is used in a Car engine as the working substance. If during the adiabatic expansion part of the cycle, volume of the gas increases from $\\mathrm{V}$ to $32 \\mathrm{~V}$ the efficiency of the engine is", "image": null}, "options": [{"id": "tH0lb", "text": "\n$0.5$\n", "image": null, "isCorrect": false}, {"id": "fnhCh", "text": "\n$0.75$\n", "image": null, "isCorrect": true}, {"id": "8SvnA", "text": "\n$0.99$\n", "image": null, "isCorrect": false}, {"id": "miyAo", "text": "\n$0.25$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The efficiency of cycle is\n$$\n\\eta=1-\\frac{T_2}{T_1}\n$$\nfor adiabatic process\n$$\n\\text { TV }^{r^{-1}}=\\text { constant }\n$$\nFor diatomic gas $\\gamma=\\frac{7}{5}$\n$$\n\\begin{aligned}\n& \\mathrm{T}_1 \\mathrm{~V}_1^{\\gamma-1}=\\mathrm{T}_2 \\mathrm{~V}_2^{\\gamma-1} \\\\\n& \\mathrm{~T}_1=\\mathrm{T}_2\\left(\\frac{\\mathrm{V}_2}{\\mathrm{~V}_1}\\right)^{\\gamma-1} \\\\\n& \\mathrm{~T}_1=\\mathrm{T}_2(32)^{\\frac{7}{5}-1} \\\\\n&=\\mathrm{T}_2\\left(2^5\\right)^{2 / 5} \\\\\n&=\\mathrm{T}_2 \\times 4 \\\\\n& \\mathrm{~T}_1=4 \\mathrm{~T}_2 . \\\\\n& \\eta=\\left(1-\\frac{1}{4}\\right)=\\frac{3}{4}=0.75\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6589c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}], "question": {"text": "The net work done on the gas in the cycle ABCDA is", "image": null}, "options": [{"id": "Ek2C2", "text": "\nZero\n", "image": null, "isCorrect": false}, {"id": "yvxdu", "text": "\n$276 \\mathrm{R}$\n", "image": null, "isCorrect": true}, {"id": "gR3JV", "text": "\n$1076 \\mathrm{R}$\n", "image": null, "isCorrect": false}, {"id": "1Dl4M", "text": "\n$1904 \\mathrm{R}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n\\text { Net work done in a cycle } & =W_{A B}+W_{B C}+W_{C B}+W_{B A} \\\\\n& =400 R+2 \\times 2.303 \\times 500 R \\ln 2-400 R-414 R \\\\\n& =1000 R \\times \\ln 2-600 R \\times \\ln 2=400 R \\times \\ln 2=276 R\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6589b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}], "question": {"text": "The work done on the gas in taking it from $D$ to $A$ is", "image": null}, "options": [{"id": "0MIdZ", "text": "\n$-414 \\mathrm{R}$\n", "image": null, "isCorrect": true}, {"id": "QKQDy", "text": "\n$+414 \\mathrm{R}$\n", "image": null, "isCorrect": false}, {"id": "r0zNJ", "text": "\n$-690 \\mathrm{R}$\n", "image": null, "isCorrect": false}, {"id": "KDPNL", "text": "\n$+690 R$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At constant temperature (isothermal process)\n$$\n\\begin{aligned}\nW_{D A}=n R T \\ln \\left(\\frac{P_1}{P_2}\\right)= & 2.303 \\times 2 \\mathrm{R} \\times 300 \\log \\left(\\frac{10^5}{2 \\times 10^5}\\right) \\\\\n& =2.303 \\times 600 \\mathrm{R} \\log \\left(\\frac{1}{2}\\right) \\\\\n& =0.693 \\times 600 \\mathrm{R}=-414 \\mathrm{R} .\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6589a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}], "question": {"text": "Assuming the gas to be ideal the work done on the gas in taking it from $A$ to $B$ is", "image": null}, "options": [{"id": "x3xVy", "text": "\n$200 \\mathrm{R}$\n", "image": null, "isCorrect": false}, {"id": "W9eB4", "text": "\n$300 \\mathrm{R}$\n", "image": null, "isCorrect": false}, {"id": "sEjkH", "text": "\n$400 \\mathrm{R}$\n", "image": null, "isCorrect": true}, {"id": "Y8V7M", "text": "\n$500 \\mathrm{R}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& W_{A B}=\\Delta Q-\\Delta U={ }^{\\prime} C_p d T-n C_v d T \\text { (at } \\\\\n& \\text { constant pressure }) \\\\\n& =n\\left(C_p-C_v\\right) d t \\\\\n& =n R d T=2 \\times R \\times(500-300)=400 \\mathrm{R}\n\\end{aligned}\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/D_i9Os7KCdpdayR6IeU5E2c42VbTCObcGBxsjnx4J10.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6572f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}], "question": {"text": "The work of $146 \\mathrm{~kJ}$ is performed in order to compress one kilo mole of gas adiabatically and in this process the temperature of the gas increases by $7^{\\circ} \\mathrm{C}$. The gas is $\\left(\\mathrm{R}=8.3 \\mathrm{~J} \\mathrm{~mol}^{-1} \\mathrm{~K}^{-1}\\right)$", "image": null}, "options": [{"id": "60VTA", "text": "\nmonoatomic\n", "image": null, "isCorrect": false}, {"id": "5F5KH", "text": "\ndiatomic\n", "image": null, "isCorrect": true}, {"id": "MJRt5", "text": "\ntriatomic\n", "image": null, "isCorrect": false}, {"id": "Ky3ga", "text": "\na mixture of monoatomic and diatomic", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$146=C_v \\Delta T$\n$\\Rightarrow C_v=21 \\mathrm{~J} / \\mathrm{mol} \\mathrm{K}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65649", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "A system goes from $A$ to $B$ via two processes I and II as shown in the figure. If $\\Delta \\mathrm{U}_1$ and $\\Delta \\mathrm{U}_2$ are the changes in internal energies in the processes I and II respectively, the\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/-jEIBDr4M8WSybMw88TVNU6WEA419YY9AuJX9WdgfIo.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "0kfmn", "text": "\n$\\Delta \\mathrm{U}_1=\\Delta \\mathrm{U}_2$\n", "image": null, "isCorrect": true}, {"id": "nXp5s", "text": "\nrelation between $\\Delta \\mathrm{U}_1$ and $\\Delta \\mathrm{U}_2$ can not be determined\n", "image": null, "isCorrect": false}, {"id": "6Ht5g", "text": "\n$\\Delta \\mathrm{U}_2>\\Delta \\mathrm{U}_1$\n", "image": null, "isCorrect": false}, {"id": "MRnuM", "text": "\n$\\Delta \\mathrm{U}_2 < \\Delta \\mathrm{U}_1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Internal energy is state function", "image": null}, "videoSolution": null, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "648b5a73417cc3fb48d69193", "title": "Heat Engine, Refrigerator and Second Law of Thermodynamics", "totalQuestions": 52, "questions": [{"_id": "67a2eebcc8b73881fdaea273", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d9760e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-28T09:00:00.000Z", "isVisible": true, "shortName": "2025 (28 Jan Shift 1)", "title": "JEE Main 2025 (28 Jan Shift 1)"}], "question": {"text": "A Carnot engine $(\\mathrm{E})$ is working between two temperatures 473 K and 273 K . In a new system two engines - engine $E_1$ works between 473 K to 373 K and engine $E_2$ works between 373 K to 273 K .\nIf $\\eta_{12}, \\eta_1$ and $\\eta_2$ are the efficiencies of the engines $E, E_1$ and $E_2$, respectively, then", "image": null}, "options": [{"id": "BcDdK", "text": "$\\eta_{12}=\\eta_1 \\eta_2$", "image": null, "isCorrect": false}, {"id": "FfVwB", "text": "$\\eta_{12} \\geq \\eta_1+\\eta_2$", "image": null, "isCorrect": false}, {"id": "99TEI", "text": "$\\eta_{12}=\\eta_1+\\eta_2$", "image": null, "isCorrect": false}, {"id": "z9LCx", "text": "$\\eta_{12} \\lt \\eta_1+\\eta_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Efficiencies of a carnot engine $\\eta=1-\\frac{T_{\\text {sink }}}{T_{\\text {source }}}$\n$\\begin{aligned}\n\\Rightarrow & \\eta_1=1-\\frac{373 \\mathrm{~K}}{473 \\mathrm{~K}}=\\frac{100}{473} \\\\\n& \\eta_2=1-\\frac{273 \\mathrm{~K}}{373 \\mathrm{~K}}=\\frac{100}{373} \\\\\n& \\eta_{12}=1-\\frac{273 \\mathrm{~K}}{473 \\mathrm{~K}}=\\frac{100}{473} \\\\\n& \\eta_{12}-\\eta_1=\\frac{200}{473}-\\frac{100}{473}=\\frac{100}{473} < \\frac{100}{373} \\\\\n\\Rightarrow & \\eta_{12}-\\eta_1 < \\eta_2 \\\\\n\\text { or } & \\eta_{12} < \\eta_1+\\eta_2\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "d3792c25c18b4c749aae02d99f14eb27", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/qTD7DTrMuxD58.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/qTD7DTrMuxD58.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5da6d4514bf2d9760e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-28T09:00:00.000Z", "isVisible": true, "shortName": "2025 (28 Jan Shift 1)", "title": "JEE Main 2025 (28 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eea1c8b73881fdaea18f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d9760b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T14:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 2)", "title": "JEE Main 2025 (23 Jan Shift 2)"}], "question": {"text": "Water of mass $m$ gram is slowly heated to increase the temperature from $T_1$ to $T_z$ The change in entropy of the water, given specific heat of water is $1 \\mathrm{Jkg}^{-1} \\mathrm{~K}^{-1}$, is :", "image": null}, "options": [{"id": "xA3dO", "text": "$\\mathrm{m} \\ln \\left(\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}\\right)$", "image": null, "isCorrect": true}, {"id": "JyjAV", "text": "zero", "image": null, "isCorrect": false}, {"id": "069S9", "text": "$\\mathrm{m} \\ln \\left(\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}\\right)$", "image": null, "isCorrect": false}, {"id": "6TImv", "text": "$\\mathrm{m}\\left(\\mathrm{T}_2-\\mathrm{T}_1\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & d \\mathrm{Q}=\\mathrm{msdT} \\\\ & \\mathrm{dS}=\\frac{\\mathrm{dQ}}{\\mathrm{T}}=\\frac{\\mathrm{msdT}}{\\mathrm{T}} \\\\ & \\Delta \\mathrm{S}=\\int \\frac{\\mathrm{msdT}}{\\mathrm{T}}=\\mathrm{ms} \\ln \\frac{\\mathrm{T}_{\\mathrm{f}}}{\\mathrm{T}_{\\mathrm{i}}} \\\\ & \\Delta \\mathrm{S}=\\mathrm{m} \\ln \\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "1dccd65d59934f87b8814b9fdffbdae6", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/K3RvL6A6C2glR.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/K3RvL6A6C2glR.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5ca6d4514bf2d9760b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T14:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 2)", "title": "JEE Main 2025 (23 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d68603", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}], "question": {"text": "<p>An engine operating between the boiling and freezing points of water will have</p><p>A. Efficiency more than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>%</mo></math>.</p><p>B. Efficiency less than the efficiency of a Carnot engine operating between the same two temperatures.</p><p>C. Efficiency equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>%</mo></math>.</p><p>D. Efficiency less than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>%</mo></math>.</p><p>Choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "R7cJd", "text": "B, C and D only", "image": null, "isCorrect": false}, {"id": "a5w7j", "text": "A and B only", "image": null, "isCorrect": false}, {"id": "8eHQC", "text": "B and D only", "image": null, "isCorrect": true}, {"id": "x9P0U", "text": "B and C only", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The efficiency of Carnot engine can be calculated as follows:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"right center left\" columnspacing=\"0px\"><mtr><mtd><msub><mi>&#951;</mi><mi>C</mi></msub></mtd><mtd><mo>=</mo></mtd><mtd><mfenced><mrow><mn>1</mn><mo>-</mo><mfrac><mn>273</mn><mn>373</mn></mfrac></mrow></mfenced><mo>&#215;</mo><mn>100</mn><mo>%</mo></mtd></mtr><mtr><mtd></mtd><mtd><mo>=</mo></mtd><mtd><mn>26</mn><mo>.</mo><mn>8</mn><mo>%</mo></mtd></mtr></mtable></math></p><p>Hence, the efficiency of the engine is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#951;</mi><mi>engine</mi></msub><mo>&#60;</mo><msub><mi>&#951;</mi><mi>carnot</mi></msub></math>.</p>", "image": null}, "videoSolution": {"videoId": "e2177d568888469598666b6ced8dcffc", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/PtiIfqhqhTOmi.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/PtiIfqhqhTOmi.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "outOfSyllabus", "questionStructure": ["MULTI_STATEMENT"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68444", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 2)", "title": "JEE Main 2023 (08 Apr Shift 2)"}], "question": {"text": "Work done by a Carnot engine operating between temperatures <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>127</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>kJ</mi></math>. The amount of heat transferred to the engine by the reservoir is:", "image": null}, "options": [{"id": "2A24r", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&#160;</mo><mi>kJ</mi></math>", "image": null, "isCorrect": true}, {"id": "P3umB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>67</mn><mo>&#160;</mo><mi>kJ</mi></math>", "image": null, "isCorrect": false}, {"id": "6pLYC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>kJ</mi></math>", "image": null, "isCorrect": false}, {"id": "nPy0z", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi>kJ</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>The temperatures in Kelvin scales are&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>27</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>+</mo><mn>273</mn><mo>=</mo><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mspace linebreak=\"newline\"></mspace><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mn>127</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>+</mo><mn>273</mn><mo>=</mo><mn>400</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>The efficiency of the Carnot engine&nbsp;is</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mn>2</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mn>300</mn><mn>400</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math><br />Using the relation,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mfrac><mi>W</mi><mi>Q</mi></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mn>2</mn><mo>&#160;</mo><mi>kJ</mi></mrow><mi>Q</mi></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>&#8658;</mo><mi>Q</mi><mo>=</mo><mn>8</mn><mo>&#160;</mo><mi>kJ</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 2)", "title": "JEE Main 2023 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67f5b", "previousYearPapers": [{"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A Carnot engine operating between two reservoirs has efficiency <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math>. When the temperature of cold reservoir raised by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>, its efficiency decreases to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>6</mn></mfrac></math>. The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>, if the temperature of hot reservoir is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>99</mn><mo>&#176;</mo><mo>&#160;</mo><mi>C</mi></math>, will be", "image": null}, "options": [{"id": "W8kBk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>K</mi></math>", "isCorrect": false, "image": null}, {"id": "I3YiZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>33</mn><mo>&#160;</mo><mi>K</mi></math>", "isCorrect": false, "image": null}, {"id": "obBHi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>66</mn><mo>&#160;</mo><mi>K</mi></math>", "isCorrect": false, "image": null}, {"id": "tg9q6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>62</mn><mo>&#160;</mo><mi>K</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>A carnot engine works between two reservoirs, one hot reservoir and one cold reservoir.</p><p>The absolute temperature&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><msub><mi>T</mi><mi>H</mi></msub></mfenced></math>&nbsp;of the hot reservoir can be calculated as follows-</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"right center left\" columnspacing=\"0px\"><mtr><mtd><msub><mi>T</mi><mi>H</mi></msub></mtd><mtd><mo>=</mo></mtd><mtd><mn>99</mn><mo>&#176;</mo><mi>C</mi></mtd></mtr><mtr><mtd></mtd><mtd><mo>=</mo></mtd><mtd><mn>99</mn><mo>+</mo><mn>273</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></mtd></mtr><mtr><mtd></mtd><mtd><mo>=</mo></mtd><mtd><mo>&#160;</mo><mn>372</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></mtd></mtr></mtable></math></p><p>The formula to calculate the efficiency&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>&#951;</mi></mfenced></math>&nbsp;of the engine is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mo>&#160;</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mi>C</mi></msub><msub><mi>T</mi><mi>H</mi></msub></mfrac><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mn>1</mn><mo>)</mo></math></p><p>where,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>C</mi></msub></math>&nbsp;is the temperature of the cold reservoir.</p><p>Substituting&nbsp;the values of the known parameters in&nbsp;equation (1), we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"right center left\" columnspacing=\"0px\"><mtr><mtd><mfrac><mn>1</mn><mn>3</mn></mfrac></mtd><mtd><mo>=</mo></mtd><mtd><mo>&#160;</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mi>C</mi></msub><msub><mi>T</mi><mi>H</mi></msub></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo>&#8658;</mo></mtd><mtd><mfrac><msub><mi>T</mi><mi>C</mi></msub><msub><mi>T</mi><mi>H</mi></msub></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac></mtd></mtr><mtr><mtd></mtd><mtd><mo>&#8658;</mo></mtd><mtd><msub><mi>T</mi><mi>C</mi></msub><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>&#215;</mo><mn>372</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></mtd></mtr><mtr><mtd></mtd><mtd><mo>=</mo></mtd><mtd><mo>&#160;</mo><mn>248</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></mtd></mtr></mtable></math></p><p>The new efficiency of the engine&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#951;</mi><mo>&#39;</mo></mrow></mfenced></math>&nbsp;is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>&#39;</mo><mo>=</mo><mo>&#160;</mo><mn>1</mn><mo>-</mo><mfrac><mrow><msub><mi>T</mi><mi>C</mi></msub><mo>+</mo><mi>X</mi></mrow><msub><mi>T</mi><mi>H</mi></msub></mfrac><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mn>2</mn><mo>)</mo></math></p><p>Substituting&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>6</mn></mfrac></math>&nbsp;for&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>&#39;</mo></math>&nbsp;and the known values of the temperatures into equation (2), we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnspacing=\"0px\" columnalign=\"right center left\"><mtr><mtd><mfrac><mn>1</mn><mn>6</mn></mfrac></mtd><mtd><mo>=</mo></mtd><mtd><mo>&#160;</mo><mn>1</mn><mo>-</mo><mfrac><mrow><msub><mi>T</mi><mi>C</mi></msub><mo>+</mo><mi>X</mi></mrow><msub><mi>T</mi><mi>H</mi></msub></mfrac></mtd></mtr><mtr><mtd/><mtd><mo>&#8658;</mo></mtd><mtd><mfrac><mn>5</mn><mn>6</mn></mfrac><mo>=</mo><mfrac><mrow><msub><mi>T</mi><mi>C</mi></msub><mo>+</mo><mi>X</mi></mrow><msub><mi>T</mi><mi>H</mi></msub></mfrac></mtd></mtr><mtr><mtd/><mtd><mo>&#8658;</mo></mtd><mtd><mn>248</mn><mo>+</mo><mi>X</mi><mo>=</mo><mn>5</mn><mo>&#215;</mo><mn>62</mn></mtd></mtr><mtr><mtd/><mtd><mo>&#8658;</mo></mtd><mtd><mi>X</mi><mo>=</mo><mn>310</mn><mo>-</mo><mn>248</mn></mtd></mtr><mtr><mtd/><mtd><mo>=</mo></mtd><mtd><mn>62</mn><mo>&#160;</mo><mi>K</mi></mtd></mtr></mtable></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68226", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Given below are two statements : one is labelled as <strong>Assertion A</strong> and the other is labelled as <strong>Reason R.</strong></p><p><strong>Assertion A :</strong> Efficiency of a reversible heat engine will be highest at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><mn>273</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;temperature of cold reservoir.</p><p><strong>Reason R :</strong> The efficiency of Carnot&rsquo;s engine depends not only on temperature of cold reservoir but it depends on the temperature of hot reservoir too and is given as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mfenced><mrow><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mn>2</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mfrac></mrow></mfenced></math></p><p>In the light of the above statements, choose the correct answer from the options given below :</p>", "image": null}, "options": [{"id": "rR9ZV", "text": "A is true but R is false", "isCorrect": false, "image": null}, {"id": "7mqdq", "text": "Both A and R are true but R is NOT the correct explanation of A", "isCorrect": false, "image": null}, {"id": "vePJi", "text": "A is false but R is true", "isCorrect": false, "image": null}, {"id": "IPRIG", "text": "Both A and R are true and R is the correct explanation of A", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>As we know,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mrow><mi>sin</mi><mi>k</mi></mrow></msub><msub><mi>T</mi><mrow><mi>s</mi><mi>o</mi><mi>u</mi><mi>r</mi><mi>c</mi><mi>e</mi></mrow></msub></mfrac><mfenced><mrow><mtext>maximum&#160;value&#160;of</mtext><mo>&#160;</mo><mi>&#951;</mi><mo>=</mo><mn>1</mn></mrow></mfenced><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mn>1</mn><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mrow><mi>sin</mi><mi>k</mi></mrow></msub><msub><mi>T</mi><mrow><mi>s</mi><mi>o</mi><mi>u</mi><mi>r</mi><mi>c</mi><mi>e</mi></mrow></msub></mfrac><mspace linebreak=\"newline\"/><mo>&#8658;</mo><msub><mi>T</mi><mrow><mi>sin</mi><mi>k</mi></mrow></msub><mo>=</mo><mn>0</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>=</mo><mn>273</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math></p><p>Therefore, both A and R are true and R is the correct explanation of A.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["ASSERTION_REASON"], "previousYear": {"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}, "evalStatus": "incorrect", "lastPracticed": "2024-11-21T11:02:48.036Z"}, {"_id": "648b5a6f417cc3fb48d6805a", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A Carnot engine with efficiency <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>%</mo></math> takes heat from a source at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>. In order to increase the efficiency to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>70</mn><mo>%</mo></math>, keeping the temperature of sink same, the new temperature of the source will be:", "image": null}, "options": [{"id": "SDCiC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>360</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": false, "image": null}, {"id": "i7u2x", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1000</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": true, "image": null}, {"id": "YsQS7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>900</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": false, "image": null}, {"id": "C3K3F", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Efficiency of Carnot engine is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mi>sink</mi></msub><mrow><mo>&#160;</mo><msub><mi>T</mi><mi>source</mi></msub></mrow></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mn>2</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mfrac></math></p><p>Gi
