 {"_id": "6983c1a68bfdbb243563976a", "type": "numerical", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f48", "title": "JEE Main 2026 (24 January Shift 2)", "shortName": "2026 (24 January Shift 2)", "isVisible": true, "heldOn": "2026-01-24T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "When 300 J of heat given to an ideal gas with $C_{p}=\\frac{7}{2} R$ its temperature raises from $20^{\\circ} \\mathrm{C}$ to $50^{\\circ} \\mathrm{C}$ keeping its volume constant. If n is the number of moles of the gas, then what is the value of $100n$? $(\\mathrm{R}=8.314 \\mathrm{~J} / \\mathrm{mol}. \\mathrm{K})$", "image": null}, "options": [], "correctValue": 48, "solution": {"text": "Given: $C_P = \\frac{7}{2}R$, so $C_V = C_P - R = \\frac{5}{2}R$<br>$\\Delta Q = nC_V \\Delta T$ (constant volume)<br>$300 = n \\times \\frac{5}{2} \\times 8.314 \\times 30$<br>$n = 0.48$ mol<br>$100n = 48$", "image": null}, "videoSolution": {"videoId": "ee833bf4771142bea97676abbad75c67", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/S2uF0fjlVIwbm.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/S2uF0fjlVIwbm.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f48", "title": "JEE Main 2026 (24 January Shift 2)", "shortName": "2026 (24 January Shift 2)", "isVisible": true, "heldOn": "2026-01-24T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1998bfdbb24356396c2", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "One mole of an ideal diatomic gas expands from volume $V$ to 2 V isothermally at a temperature $27^{\\circ} \\mathrm{C}$ and does $W$ joule of work. If the gas undergoes same magnitude of expansion adiabatically from $27^{\\circ} \\mathrm{C}$ doing the same amount of work $W$, then its final temperature will be (close to) $\\_\\_\\_\\_$ ${ }^{\\circ} \\mathrm{C}$. <br>  $\\left(\\log _{\\mathrm{e}} 2=0.693\\right)$", "image": null}, "options": [{"id": "NpCSa", "text": "-30", "isCorrect": false, "image": null}, {"id": "8N6lR", "text": "-189", "isCorrect": false, "image": null}, {"id": "I0BoE", "text": "-117", "isCorrect": false, "image": null}, {"id": "Blpka", "text": "-56", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For isothermal expansion of 1 mole diatomic gas from V to 2V at 300 K:<br>$W = RT\\ln 2 = R(300)\\ln 2$ <br>For adiabatic expansion with same volume change and same work output:<br>$W = nC_V\\Delta T = C_V(T_i - T_f)$ <br>For diatomic gas, $C_V = \\frac{5}{2}R$. Setting work equal:<br>$R(300)\\ln 2 = \\frac{5}{2}R(300 - T_f)$ <br>Simplifying:<br>$300\\ln 2 = 2.5(300 - T_f)$, so $300(0.693) = 2.5(300 - T_f)$ <br>$207.9 = 750 - 2.5T_f$, giving $T_f = 216.84$ K $\\approx$ -56°C.", "image": null}, "videoSolution": {"videoId": "f2686e03a779418fa8394289fb4d91d6", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/rBgjnh29hkFGa.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/rBgjnh29hkFGa.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c18f8bfdbb2435639640", "type": "numerical", "level": 1, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f44", "title": "JEE Main 2026 (22 January Shift 2)", "shortName": "2026 (22 January Shift 2)", "isVisible": true, "heldOn": "2026-01-22T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "An insulated cylinder of volume $60 \\mathrm{~cm}^{3}$ is filled with a gas at $27^{\\circ} \\mathrm{C}$ and 2 atmospheric pressure. Then the gas is compressed making the final volume as $20 \\mathrm{~cm}^{3}$ while allowing the temperature to rise to $77^{\\circ} \\mathrm{C}$. The final pressure is $\\_\\_\\_\\_$ atmospheric pressure.", "image": null}, "options": [], "correctValue": 7, "solution": {"text": "$PV = nRT$<br>$\\dfrac{P_1 V_1}{RT_1} = \\dfrac{P_2 V_2}{RT_2}$<br>$\\dfrac{2 \\times 10^5 \\times 60}{300} = \\dfrac{P_2 \\times 20}{350}$<br>$P_2 = \\dfrac{2 \\times 10^5 \\times 7 \\times 3}{6}$<br>$P_2 = 7 \\times 10^5 = 7 \\text{ atm}$", "image": null}, "videoSolution": {"videoId": "c830df634de64e54ac1ec5ecaa94bbb1", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Ci5wPVTH6R7L5.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Ci5wPVTH6R7L5.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f44", "title": "JEE Main 2026 (22 January Shift 2)", "shortName": "2026 (22 January Shift 2)", "isVisible": true, "heldOn": "2026-01-22T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1838bfdbb24356395ab", "type": "numerical", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f42", "title": "JEE Main 2026 (21 January Shift 2)", "shortName": "2026 (21 January Shift 2)", "isVisible": true, "heldOn": "2026-01-21T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "A diatomic gas $(\\gamma=1.4)$ does 100 J of work when it is expanded isobarically. Then the heat given to the gas $\\_\\_\\_\\_$ J.", "image": null}, "options": [], "correctValue": 350, "solution": {"text": "For an isobaric process, the first law gives: $Q = \\Delta U + W$.<br>For a diatomic gas with $\\gamma = 1.4$, we have $C_V = \\frac{5}{2}R$ and $C_P = \\frac{7}{2}R$.<br>Since $W = nR\\Delta T = 100$ J for isobaric expansion, the change in internal energy is: $\\Delta U = nC_V\\Delta T = \\frac{5}{2}nR\\Delta T = \\frac{5}{2} \\times 100 = 250$ J.<br>Therefore, $Q = 250 + 100 = 350$ J.", "image": null}, "videoSolution": {"videoId": "097e5efea9f849c381059728828161f9", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/CjmfVGcjcBCZx.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/CjmfVGcjcBCZx.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f42", "title": "JEE Main 2026 (21 January Shift 2)", "shortName": "2026 (21 January Shift 2)", "isVisible": true, "heldOn": "2026-01-21T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c697c09d044e4c1a1d8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2025 (8 Apr Shift 2)", "title": "JEE Main 2025 (8 Apr Shift 2)"}], "question": {"text": "A monoatomic gas having $\\gamma=\\frac{5}{3}$ is stored in a thermally insulated container and the gas is suddenly compressed to $\\left(\\frac{1}{8}\\right)^{\\text {th }}$ of its initial volume. The ratio of final pressure and initial pressure is: ( $\\gamma$ is the ratio of specific heats of the gas at constant pressure and at constant volume)", "image": null}, "options": [{"id": "MFYFr", "text": "16", "image": null, "isCorrect": false}, {"id": "ugTj7", "text": "40", "image": null, "isCorrect": false}, {"id": "AgZC6", "text": "32", "image": null, "isCorrect": true}, {"id": "QBX69", "text": "28", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & P_i V_i^\\gamma=P_f V_f^\\gamma \\\\ & \\frac{P_f}{P_i}=\\left(\\frac{V_i}{V_f}\\right)^\\gamma=(8)^{5 / 3} \\\\ & \\frac{P_f}{P_i}=32\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "7c8f5ed35bf74333ae079b1165d85d8e", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/OkCmD9kg9tngx.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/OkCmD9kg9tngx.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d80978e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2025 (8 Apr Shift 2)", "title": "JEE Main 2025 (8 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c697c09d044e4c1a1d7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d809789", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T14:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 2)", "title": "JEE Main 2025 (7 Apr Shift 2)"}], "question": {"text": "Match List-I with List-II.<br/>$\\begin{array}{|l|l|l|l|} \\hline & \\text{List-I} & & \\text{List-II} \\\\ \\hline \\text{(A)} & \\text{Isothermal} & \\text{(I)} & \\Delta \\mathrm{W} \\text{(work done)} =0 \\\\ \\hline \\text{(B)} & \\text{Adiabatic} & \\text{(II)} & \\Delta \\mathrm{Q} \\text{(supplied heat)} =0 \\\\ \\hline \\text{(C)} & \\text{Isobaric} & \\text{(III)} & \\begin{array}{l}\\Delta \\mathrm{U} \\text{(change in internal} \\\\ \\text{energy} \\neq 0\\end{array} \\\\ \\hline \\text{(D)} & \\text{Isochoric} & \\text{(IV)} & \\Delta \\mathrm{U}=0 \\\\ \\hline\\end{array}$<br/>Choose the correct answer from the options given below :", "image": null}, "options": [{"id": "Lt1g5", "text": "(A)-(III), (B)-(II), (C)-(I), (D)-(IV)", "image": null, "isCorrect": false}, {"id": "WCCgZ", "text": "(A)-(IV), (B)-(I), (C)-(III), (D)-(II)", "image": null, "isCorrect": false}, {"id": "9liSH", "text": "(A)-(IV), (B)-(II), (C)-(III), (D)-(I)", "image": null, "isCorrect": true}, {"id": "LLzCM", "text": "(A)-(II), (B)-(IV), (C)-(I), (D)-(III)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A) Isothermal $\\rightarrow \\Delta \\mathrm{T}=0 \\rightarrow \\Delta \\mathrm{U}=0$ (IV)<br/>(B) Adiabatic $\\rightarrow \\Delta \\mathrm{Q}=0$ (II)<br/>(C) Isobaric $\\rightarrow \\Delta \\mathrm{P}=0 \\rightarrow \\Delta \\mathrm{U} \\neq 0$ (III)<br/>(D) Isochoric $\\rightarrow \\Delta \\mathrm{V}=0 \\rightarrow \\Delta \\mathrm{~W}=0(\\mathrm{I})$", "image": null}, "videoSolution": {"videoId": "94567e3a066245f5a27039d3cdc00c04", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/9Xxw3c9JHmy5p.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/9Xxw3c9JHmy5p.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "6852f2ff9d87935e0d809789", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T14:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 2)", "title": "JEE Main 2025 (7 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c697c09d044e4c1a1d6", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2fe9d87935e0d809788", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 1)", "title": "JEE Main 2025 (7 Apr Shift 1)"}], "question": {"text": "An ideal gas has undergone through the cyclic process as shown in the figure. Work done by the gas in the entire cycle is ______ $\\times 10^{-1} \\mathrm{~J}$.<br/>(Take $\\pi=3.14$)<br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/jp25l97anhBmAPyAXJkz4m3S-871cQqP-bf-E95aPD0.original.fullsize.png\"/>", "image": null}, "options": [], "correctValue": "314", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/yluOsT72LPxvbpSWdAKISafqm1yAIuDJXk_sMxenY38.original.fullsize.png\"/><br/>Area of circle, $\\mathrm{W}=\\frac{\\pi}{4} \\mathrm{~d}_1 \\mathrm{~d}_2$<br/>$\\mathrm{W}=\\frac{\\pi}{4}(500-300) \\times 10^3(350-150) \\times 10^{-6}$<br/>W = 31.4 Joule<br/>$\\mathrm{W}=314 \\times 10^{-1} \\mathrm{Joule}$", "image": null}, "videoSolution": {"videoId": "389ccb71c4834046b14f5c04196f04af", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/uakE8CHLd0lyU.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/uakE8CHLd0lyU.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "6852f2fe9d87935e0d809788", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2025 (7 Apr Shift 1)", "title": "JEE Main 2025 (7 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c677c09d044e4c1a1ce", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2025 (4 Apr Shift 2)", "title": "JEE Main 2025 (4 Apr Shift 2)"}], "question": {"text": "Match List-I with List-II.<br/>\\(\\begin{array}{|l|l|l|l|} \\hline & \\text{List - I} & & \\text{List - II} \\\\ \\hline \\text { (A) } & \\text { Isobaric } & \\text { (I) } & \\Delta Q=\\Delta W \\\\ \\hline \\text { (B) } & \\text { Isochoric } & \\text { (II) } & \\Delta Q=\\Delta U \\\\ \\hline \\text { (C) } & \\text { Adiabatic } & \\text { (III) } & \\Delta Q=\\text { zero } \\\\ \\hline \\text { (D) } & \\text { Isothermal } & \\text { (IV) } & \\Delta Q=\\Delta U+P \\Delta V \\\\ \\hline \\end{array}\\)<br/>$\\Delta \\mathrm{Q}=$ Heat supplied<br/>$\\Delta \\mathrm{W}=$ Work done by the system<br/>$\\Delta \\mathrm{U}=$ Change in internal energy<br/>$\\mathrm{P}=$ Pressure of the system<br/>$\\Delta \\mathrm{V}=$ Change in volume of the system<br/>Choose the correct answer from the options given below:", "image": null}, "options": [{"id": "21kYV", "text": "(A)-(IV), (B)-(III), (C)-(II), (D)-(I)", "image": null, "isCorrect": false}, {"id": "T5ctT", "text": "(A)-(IV), (B)-(I), (C)-(III), (D)-(II)", "image": null, "isCorrect": false}, {"id": "DtYXf", "text": "(A)-(IV), (B)-(II), (C)-(III), (D)-(I)", "image": null, "isCorrect": true}, {"id": "zejOy", "text": "(A)-(II), (B)-(IV), (C)-(III), (D)-(I)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A) Isobaric $(\\mathrm{P}=\\mathrm{C})$<br/>$\\Delta \\mathrm{Q}=\\Delta \\mathrm{U}+\\mathrm{P} \\Delta \\mathrm{~V}$<br/>(B) Isochoric $(\\mathrm{V}=\\mathrm{C})$<br/>$\\Delta \\mathrm{Q}=\\Delta \\mathrm{U}$<br/>(C) Adiabatic $(\\Delta \\mathrm{Q}=0)$<br/>$\\Delta \\mathrm{Q}=0$<br/>(D) Isothermal $(\\Delta \\mathrm{U}=0)$<br/>$\\Delta \\mathrm{Q}=\\Delta \\mathrm{W}$", "image": null}, "videoSolution": {"videoId": "6375639f0f944a4f93308d69fba80dbc", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/QaoESDF4ElUnM.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/QaoESDF4ElUnM.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "6852f2ff9d87935e0d80978a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2025 (4 Apr Shift 2)", "title": "JEE Main 2025 (4 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c697c09d044e4c1a1d9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2fe9d87935e0d809786", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-03T14:00:00.000Z", "isVisible": true, "shortName": "2025 (3 Apr Shift 2)", "title": "JEE Main 2025 (3 Apr Shift 2)"}], "question": {"text": "An ideal gas exists in a state with pressure $P_0$ volume $\\mathrm{V}_0$.It is isothermally expanded to 4 times of its initial volume $\\left(\\mathrm{V}_0\\right)$, then isobarically compressed to its original volume. Finally the system is heated isochorically to bring it to its initial state. The amount of heat exchanged in this process is :", "image": null}, "options": [{"id": "GHwxj", "text": "$\\mathrm{P}_0 \\mathrm{~V}_0(2 \\ln 2-0.75)$", "image": null, "isCorrect": true}, {"id": "VaxEd", "text": "$\\mathrm{P}_0 \\mathrm{~V}_0(\\ln 2-0.75)$", "image": null, "isCorrect": false}, {"id": "wP6gE", "text": "$\\mathrm{P}_0 \\mathrm{~V}_0(\\ln 2-0.25)$", "image": null, "isCorrect": false}, {"id": "Ttgji", "text": "$P_0 V_0(2 \\ln 2-0.25)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/rbb3JpnqJ0LtZIcUiwPULzDiFzpxHYbMbm338lcPV-s.original.fullsize.png\"/><br/>$\\begin{aligned} & \\omega_1=P_0 v_0 \\ln 4 \\\\ & \\omega_2=\\frac{P_0}{4}\\left(-3 v_0\\right)=-\\frac{3 P_0 v_0}{4}\\end{aligned}$<br/>$\\begin{aligned} & \\omega_3=0 \\\\ & \\mathrm{Q}_{\\mathrm{T}}=\\Delta \\mathrm{U}_{\\text {cyclic }}+\\omega\\end{aligned}$<br/>$\\mathrm{Q}_{\\mathrm{T}}=\\omega \\quad\\left(\\Delta \\mathrm{U}_{\\text {cyclic }}=0\\right)$<br/>$\\begin{aligned} & \\mathrm{Q}_{\\mathrm{T}}=\\mathrm{P}_0 \\mathrm{v}_0\\left(\\ln 4-\\frac{3}{4}\\right) \\\\ & =\\mathrm{P}_0 \\mathrm{v}_0(2 \\ln 2-0.75)\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "4b27e97f4fdb49119a25bcce9dc215ce", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/fQKNsZ8E0vMOY.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/fQKNsZ8E0vMOY.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2fe9d87935e0d809786", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-03T14:00:00.000Z", "isVisible": true, "shortName": "2025 (3 Apr Shift 2)", "title": "JEE Main 2025 (3 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c697c09d044e4c1a1d5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2fe9d87935e0d809786", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-03T14:00:00.000Z", "isVisible": true, "shortName": "2025 (3 Apr Shift 2)", "title": "JEE Main 2025 (3 Apr Shift 2)"}], "question": {"text": "Pressure of an ideal gas, contained in a closed vessel, is increased by $0.4 \\%$ when heated by $1^{\\circ} \\mathrm{C}$. Its initial temperature must be :", "image": null}, "options": [{"id": "5J7fF", "text": "$25^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "g4cDW", "text": "$2500\\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "uZ2K2", "text": "$250\\mathrm{~K}$", "image": null, "isCorrect": true}, {"id": "K0Oty", "text": "$250^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Isochoric process<br/>$\\begin{aligned} & \\mathrm{P} \\propto \\mathrm{T} \\\\ & \\frac{\\Delta \\mathrm{P}}{\\mathrm{P}}=\\frac{\\Delta \\mathrm{T}}{\\mathrm{T}}\\end{aligned}$<br/>$\\begin{aligned} & \\frac{0.4}{100}=\\frac{1}{T} \\\\ & T=250 \\mathrm{~K}\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "414244afef9340118930b03dbbd489b8", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/B7wuyiaRRadMM.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/B7wuyiaRRadMM.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2fe9d87935e0d809786", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-03T14:00:00.000Z", "isVisible": true, "shortName": "2025 (3 Apr Shift 2)", "title": "JEE Main 2025 (3 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c687c09d044e4c1a1d4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2025 (3 Apr Shift 1)", "title": "JEE Main 2025 (3 Apr Shift 1)"}], "question": {"text": "A gas is kept in a container having walls which are thermally non-conducting. Initially the gas has a volume of $800 \\mathrm{~cm}^3$ and temperature $27^{\\circ} \\mathrm{C}$. The change in temperature when the gas is adiabatically compressed to $200 \\mathrm{~cm}^3$ is :<br/>(Take $\\gamma=1.5: \\gamma$ is the ratio of specific heats at constant pressure and at constant volume)", "image": null}, "options": [{"id": "XE8Ih", "text": "327 K", "image": null, "isCorrect": false}, {"id": "bpFEp", "text": "600 K", "image": null, "isCorrect": false}, {"id": "CMFep", "text": "522 K", "image": null, "isCorrect": false}, {"id": "q4FZK", "text": "300 K", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned}<br/>& \\mathrm{V}_1=800 \\mathrm{~cm}^3 \\quad \\mathrm{~V}_2=200 \\mathrm{~cm}^3 \\\\\n& \\mathrm{~T}_1=300 \\mathrm{~K}<br/>\\end{aligned}$<br/>for adiabatic<br/>$\\begin{aligned}<br/>& \\mathrm{TV}^{\\gamma-1}=\\text { const. } \\\\\n& (300)(800)^{1.5-1}=\\mathrm{T}_2(200)^{1.5-1} \\\\\n& \\mathrm{~T}_2=300\\left[\\frac{800}{200}\\right]^{0.5}=300 \\times\\left(2^2\\right)^{1 / 2} \\\\\n& \\mathrm{~T}_2=600 \\mathrm{~K} \\\\\n& \\Delta \\mathrm{~T}=600-300=300 \\mathrm{~K}<br/>\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "d3d84a32ce1e44b186618fd7275267d8", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/rmPd6eLqa0HB6.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/rmPd6eLqa0HB6.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d80978d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2025 (3 Apr Shift 1)", "title": "JEE Main 2025 (3 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c687c09d044e4c1a1d3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-02T14:00:00.000Z", "isVisible": true, "shortName": "2025 (2 Apr Shift 2)", "title": "JEE Main 2025 (2 Apr Shift 2)"}], "question": {"text": "Identify the characteristics of an adiabatic process in a monoatomic gas.<br/>(A) Internal energy is constant.<br/>(B) Work done in the process is equal to the charge in internal energy.<br/>(C) The product of temperature and volume is a constant.<br/>(D) The product of pressure and volume is a constant.<br/>(E) The work done to change the temperature from $\\mathrm{T}_1$ to $\\mathrm{T}_2$ is proportional to $\\left(\\mathrm{T}_2-\\mathrm{T}_1\\right)$<br/>Choose the correct answer from the options given below :", "image": null}, "options": [{"id": "wYZFe", "text": "(A), (C), (D) only", "image": null, "isCorrect": false}, {"id": "io3cS", "text": "(A), (C), (E) only", "image": null, "isCorrect": false}, {"id": "xiQ6l", "text": "(B), (E) only", "image": null, "isCorrect": true}, {"id": "rbLnh", "text": "(B), (D) only", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{Q}=\\Delta \\mathrm{U}+\\mathrm{W}=0 \\Rightarrow-\\Delta \\mathrm{U}=\\mathrm{W} \\\\ & \\mathrm{WD}=-\\mathrm{nC}_{\\mathrm{v}} \\Delta \\mathrm{T} \\Rightarrow|\\mathrm{WD}|=\\mathrm{nC}_{\\mathrm{v}} \\Delta \\mathrm{T} \\propto \\mathrm{T}_2-\\mathrm{T}_1\\end{aligned}$<br/>$\\therefore \\mathrm{B} \\& \\mathrm{E}$ [Only possibility]", "image": null}, "videoSolution": {"videoId": "c44e14a9d1ec45d88ac8fbd1c2d21ab5", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/M2w3FPy6oQWwb.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/M2w3FPy6oQWwb.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["MULTI_STATEMENT"], "syllabusCategory": "noChange", "previousYear": {"_id": "6852f2ff9d87935e0d80978c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-02T14:00:00.000Z", "isVisible": true, "shortName": "2025 (2 Apr Shift 2)", "title": "JEE Main 2025 (2 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c687c09d044e4c1a1d2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-02T09:00:00.000Z", "isVisible": true, "shortName": "2025 (2 Apr Shift 1)", "title": "JEE Main 2025 (2 Apr Shift 1)"}], "question": {"text": "In an adiabatic process, which of the following statements is true?", "image": null}, "options": [{"id": "K6XAm", "text": "The molar heat capacity is infinite", "image": null, "isCorrect": false}, {"id": "vblgN", "text": "Work done by the gas equals the increase in internal energy", "image": null, "isCorrect": false}, {"id": "tSpmM", "text": "The molar heat capacity is zero", "image": null, "isCorrect": true}, {"id": "Dhjle", "text": "The internal energy of the gas decreases as the temperature increases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For adiabatic process, $\\mathrm{dQ}=0$<br/>$\\therefore$ Molar heat capacity $=0$<br/>$\\because \\mathrm{dQ}=0 \\Rightarrow \\mathrm{dU}=-\\mathrm{dW}$<br/>Also $\\mathrm{dU}=\\frac{\\mathrm{f}}{2} \\mathrm{nRdT}$<br/>$\\therefore$ Only option (3) is correct.", "image": null}, "videoSolution": {"videoId": "a44e4d5bbe9345d38ff66b0c217bf735", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/h0zLdmcOyP95B.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/h0zLdmcOyP95B.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d80978b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-02T09:00:00.000Z", "isVisible": true, "shortName": "2025 (2 Apr Shift 1)", "title": "JEE Main 2025 (2 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eed7c8b73881fdaea35c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d97611", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 2)", "title": "JEE Main 2025 (29 Jan Shift 2)"}], "question": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/n5gJgOGduhZn9_w8BJr8yRsK5UnNoIr7xi53-AHZ-hI.original.fullsize.png\"/><br/>\nA poly-atomic molecule ( $C_V=3 R, C_P=4 R$, where $R$ is gas constant) goes from phase space point $\\mathrm{A}\\left(\\mathrm{P}_{\\mathrm{A}}=10^5 \\mathrm{~Pa}, \\mathrm{~V}_{\\mathrm{A}}=4 \\times 10^{-6} \\mathrm{~m}^3\\right)$ to point $\\mathrm{B}\\left(\\mathrm{P}_{\\mathrm{B}}=5 \\times 10^4 \\mathrm{~Pa}, \\mathrm{~V}_{\\mathrm{B}}=6 \\times 10^{-6} \\mathrm{~m}^3\\right)$ to point $\\mathrm{C}\\left(\\mathrm{P}_{\\mathrm{C}}=10^4\\right.$ $\\left.\\mathrm{Pa}, \\mathrm{V}_{\\mathrm{C}}=8 \\times 10^{-6} \\mathrm{~m}^3\\right)$. A to B is an adiabatic path and $B$ to $C$ is an isothermal path.\nThe net heat absorbed per unit mole by the system is :", "image": null}, "options": [{"id": "9mFL3", "text": "$500 \\mathrm{R}(\\ln 3+\\ln 4)$", "image": null, "isCorrect": false}, {"id": "kwyur", "text": "$450 \\mathrm{R}(\\ln 4-\\ln 3)$", "image": null, "isCorrect": true}, {"id": "qoHJu", "text": "$500 \\mathrm{R} \\ln 2$", "image": null, "isCorrect": false}, {"id": "BPX9T", "text": "$400 \\mathrm{R} \\ln 4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\Delta \\mathrm{Q}_{\\mathrm{AB}}=0 \\text { adiabatic } \\\\ & \\Delta \\mathrm{Q}_{\\mathrm{BC}}=\\Delta \\mathrm{W}_{\\mathrm{BC}} \\\\ & =\\mathrm{nRT} \\ell \\mathrm{n}\\left(\\frac{\\mathrm{V}_{\\mathrm{C}}}{\\mathrm{V}_{\\mathrm{B}}}\\right)=450 \\mathrm{R} \\ell \\mathrm{n}\\left(\\frac{8 \\times 10^{-6}}{6 \\times 10^{-6}}\\right) \\\\ & =450 \\mathrm{R} \\ell \\mathrm{n}\\left(\\frac{4}{3}\\right)=450 \\mathrm{R}(\\ln 4-\\ell \\mathrm{n} 3) \\\\ & \\therefore \\Delta \\mathrm{Q}=\\Delta \\mathrm{Q}_{\\mathrm{AB}}+\\Delta \\mathrm{Q}_{\\mathrm{BC}} \\\\ & \\Delta \\mathrm{Q}=450 \\mathrm{R}(\\ell \\mathrm{n} 4-\\ell \\mathrm{n} 3)\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "23dd783be1e54e1eaa4c647c005f2c08", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/oP9sjHf2Xva9h.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/oP9sjHf2Xva9h.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "67a2eb5da6d4514bf2d97611", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 2)", "title": "JEE Main 2025 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eed6c8b73881fdaea34f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d97611", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 2)", "title": "JEE Main 2025 (29 Jan Shift 2)"}], "question": {"text": "Given below are two statements. One is labelled as Assertion (A) and the other is labelled as Reason (R).\n\nAssertion (A) : With the increase in the pressure of an ideal gas, the volume falls off more rapidly in an isothermal process in comparison to the adiabatic process.\n\nReason (R) : In isothermal process, $\\mathrm{PV}=$ constant, while in adiabatic process $\\mathrm{PV}^\\gamma=$ constant. Here $\\gamma$ is the ratio of specific heats, P is the pressure and V is the volume of the ideal gas.\n\nIn the light of the above statements, choose the correct answer from the options given below :", "image": null}, "options": [{"id": "w6I1C", "text": "Both (A) and (R) are true and (R) is the correct explanation of (A)", "image": null, "isCorrect": true}, {"id": "atmnJ", "text": "Both (A) and (R) are true but (R) is NOT the correct explanation of (A)", "image": null, "isCorrect": false}, {"id": "OMmvE", "text": "(A) is true but (R) is false", "image": null, "isCorrect": false}, {"id": "2V833", "text": "(A) is false but (R) is true", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/n7Za3l_9Bei27E5jS3K-kFM7Kp3C-JOe0edLH-cxhz4.original.fullsize.png\"><br>\n\n$\\left(\\frac{\\mathrm{dP}}{\\mathrm{dV}}\\right)_{\\text {Adiabatic }}>\\left(\\frac{\\mathrm{dP}}{\\mathrm{dV}}\\right)_{\\text {Isothermal }}$", "image": null}, "videoSolution": {"videoId": "520be2fbc13d4975b95f6c1d86c84870", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/bMg2HVGlZ9Yiv.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/bMg2HVGlZ9Yiv.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["ASSERTION_REASON"], "syllabusCategory": "noChange", "previousYear": {"_id": "67a2eb5da6d4514bf2d97611", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 2)", "title": "JEE Main 2025 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eecfc8b73881fdaea318", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d97610", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 1)", "title": "JEE Main 2025 (29 Jan Shift 1)"}], "question": {"text": "A container of fixed volume contains a gas at \\(27^{\\circ} \\mathrm{C}\\). To double the pressure of the gas, the temperature of gas should be raised to ______ \\({ }^{\\circ} \\mathrm{C}\\).", "image": null}, "options": [], "correctValue": "327", "solution": {"text": "$\\begin{aligned} V & =\\text { constant } \\\\ \\frac{P_1}{T_1} & =\\frac{P_2}{T_2} \\\\ P_2 & =2 P_1 \\\\ T_2 & =2 T_1 \\\\ & =2 \\times 300=600 \\mathrm{~K} \\\\ \\therefore T_2 & =327^{\\circ} \\mathrm{C}\\end{aligned}", "image": null}, "videoSolution": {"videoId": "d74308178d2a48ef98412080a781f4e3", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/fGy2LVc9nyLJy.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/fGy2LVc9nyLJy.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5da6d4514bf2d97610", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 1)", "title": "JEE Main 2025 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eecec8b73881fdaea30f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d97610", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 1)", "title": "JEE Main 2025 (29 Jan Shift 1)"}], "question": {"text": "The workdone in an adiabatic change in an ideal gas depends upon only :", "image": null}, "options": [{"id": "GAYMZ", "text": "change in its temperature", "image": null, "isCorrect": true}, {"id": "yHEZB", "text": "change in its volume", "image": null, "isCorrect": false}, {"id": "wkfSq", "text": "change in its pressure", "image": null, "isCorrect": false}, {"id": "6zpnd", "text": "change in its specific heat", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Work done in adiabatic process $=\\frac{n R \\Delta T}{1-\\gamma}$\nSo, depends upon change in temperature.", "image": null}, "videoSolution": {"videoId": "44ad5a57e1054094aa9f7ca04e54e7aa", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Yx6vgiDjDma6q.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Yx6vgiDjDma6q.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5da6d4514bf2d97610", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2025 (29 Jan Shift 1)", "title": "JEE Main 2025 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2ee9ac8b73881fdaea156", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d9760a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T09:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 1)", "title": "JEE Main 2025 (23 Jan Shift 1)"}], "question": {"text": "An ideal gas initially at $0^{\\circ} \\mathrm{C}$ temperature, is compressed suddenly to one fourth of its volume. If the ratio of specific heat at constant pressure to that at constant volume is $3 / 2$, the change in temperature due to the thermodynamic process is _____ K.", "image": null}, "options": [], "correctValue": "273", "solution": {"text": "$\\begin{aligned} & \\gamma=\\frac{3}{2} \\\\ & \\mathrm{Tv}^{\\gamma-1}=\\mathrm{C} \\\\ & 273 \\mathrm{~V}_0^{0.5}=\\mathrm{T}\\left(\\frac{\\mathrm{V}_0}{4}\\right)^{0.5} \\\\ & \\mathrm{~T}=273 \\times 2=546 \\\\ & \\Delta \\mathrm{~T}=273\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "8728f55635df424a82005f0e79f3f196", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/7L1k5fiiEfToe.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/7L1k5fiiEfToe.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5ca6d4514bf2d9760a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T09:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 1)", "title": "JEE Main 2025 (23 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6644675b970e6e9ab542d28e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda71", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 2)", "title": "JEE Main 2024 (09 Apr Shift 2)"}], "question": {"text": "A real gas within a closed chamber at $27^{\\circ} \\mathrm{C}$ undergoes the cyclic process as shown in figure. The gas obeys $P V^3=R T$ equation for the path $A$ to $B$. The net work done in the complete cycle is (assuming $R=8 \\mathrm{~J} / \\mathrm{mol} \\mathrm{K}$ ):\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/MaShLXI7MYXTuG2HJc9_KIJxN1dVYeOQKqX0uLnKwWc.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "ZDJCo", "text": "$20 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "WQiUb", "text": "$205 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "Uiv0q", "text": "$-20 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "d0QAA", "text": "$225 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{W}_{\\mathrm{AB}}=\\int \\mathrm{PdV} \\quad$ (Assuming $\\mathrm{T}$ to be constant)\n$\\begin{aligned} & =\\int \\frac{\\mathrm{RTdV}}{\\mathrm{V}^3} \\\\ & =\\mathrm{RT} \\int_2^4 \\mathrm{~V}^{-3} \\mathrm{dV} \\\\ & =8 \\times 300 \\times\\left(-\\frac{1}{2}\\left[\\frac{1}{4^2}-\\frac{1}{2^2}\\right]\\right) \\\\ & =225 \\mathrm{~J}\\end{aligned}$\n$\\begin{aligned}& \\mathrm{W}_{\\mathrm{BC}}=\\mathrm{P} \\int_4^2 \\mathrm{dV}=10(2-4)=-20 \\mathrm{~J} \\\\& \\mathrm{~W}_{\\mathrm{CA}}=0 \\\\& \\therefore \\mathrm{W}_{\\text {cycle }}=205 \\mathrm{~J}\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "45b3bf2cf07b4e179f888277e9c7eb6b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/yLUijckRcIVn4.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/yLUijckRcIVn4.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "664466ef278297dee60eda71", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 2)", "title": "JEE Main 2024 (09 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446751970e6e9ab542d234", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda70", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 1)", "title": "JEE Main 2024 (09 Apr Shift 1)"}], "question": {"text": "The volume of an ideal gas $(\\gamma=1.5)$ is changed adiabatically from 5 litres to 4 litres. The ratio of initial pressure to final pressure is:", "image": null}, "options": [{"id": "hCT5K", "text": "$\\frac{16}{25}$", "image": null, "isCorrect": false}, {"id": "k4wV1", "text": "$\\frac{4}{5}$", "image": null, "isCorrect": false}, {"id": "foOrr", "text": "$\\frac{8}{5 \\sqrt{5}}$", "image": null, "isCorrect": true}, {"id": "Ctjh7", "text": "$\\frac{2}{\\sqrt{5}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For Adiabatic process\n$\\begin{aligned} & P_i V_i=P_f V_f^\\gamma \\\\ & P_i(5)^{1.5}=P_f(4)^{1.5} \\\\ & \\frac{P_i}{P_f}=\\left(\\frac{4}{5}\\right)^{\\frac{3}{2}}=\\frac{4}{5} \\cdot\\left(\\frac{4}{5}\\right)^{\\frac{1}{2}} \\Rightarrow \\frac{8}{5 \\sqrt{5}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda70", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 1)", "title": "JEE Main 2024 (09 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446751970e6e9ab542d233", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda70", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 1)", "title": "JEE Main 2024 (09 Apr Shift 1)"}], "question": {"text": "A sample of 1 mole gas at temperature $\\mathrm{T}$ is adiabatically expanded to double its volume. If adiabatic constant for the gas is $\\gamma=\\frac{3}{2}$, then the work done by the gas in the process is:", "image": null}, "options": [{"id": "Ftqqn", "text": "$\\frac{R}{T}[2-\\sqrt{2}]$", "image": null, "isCorrect": false}, {"id": "vtDy5", "text": "$\\frac{T}{R}[2+\\sqrt{2}]$", "image": null, "isCorrect": false}, {"id": "ipJgU", "text": "RT $[2-\\sqrt{2}]$", "image": null, "isCorrect": true}, {"id": "qOPl0", "text": "$\\mathrm{RT}[2+\\sqrt{2}]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{TV}^{\\gamma-1}=\\text { constant } \\\\ & \\Rightarrow \\mathrm{T}(\\mathrm{V})^{\\frac{3}{2}-1}=\\mathrm{T}_{\\mathrm{f}}(2 \\mathrm{~V})^{\\frac{3}{2}-1} \\\\ & \\Rightarrow \\mathrm{TV}^{\\frac{1}{2}}=\\mathrm{T}_{\\mathrm{f}}(2)^{\\frac{1}{2}}(\\mathrm{~V})^{\\frac{1}{2}} \\\\ & \\Rightarrow \\mathrm{T}_{\\mathrm{f}}=\\left(\\frac{\\mathrm{T}}{\\sqrt{2}}\\right) \\\\ & \\text { Now, W.D. }=\\frac{\\mathrm{nR} \\Delta \\mathrm{T}}{1-\\gamma}=\\frac{1 \\cdot \\mathrm{R}\\left[\\frac{\\mathrm{T}}{\\sqrt{2}}-\\mathrm{T}\\right]}{1-\\frac{3}{2}} \\\\ & \\Rightarrow \\text { W.D. }=2 \\mathrm{RT}\\left[1-\\frac{1}{\\sqrt{2}}\\right] \\\\ & \\Rightarrow \\text { W.D. }=\\mathrm{RT}[2-\\sqrt{2}]\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "1a22e66fce284d368a3135bf93a1df6d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Me4zxZkiGez2V.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Me4zxZkiGez2V.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda70", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 1)", "title": "JEE Main 2024 (09 Apr Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T10:39:46.494Z"}, {"_id": "66446746970e6e9ab542d1cd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda6f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 2)", "title": "JEE Main 2024 (08 Apr Shift 2)"}], "question": {"text": "A diatomic gas $(\\gamma=1.4)$ does $100 \\mathrm{~J}$ of work in an isobaric expansion. The heat given to the gas is :", "image": null}, "options": [{"id": "8oc1z", "text": "$250 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "mn4sK", "text": "$150 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "uTYrS", "text": "$350 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "GJkpb", "text": "$490 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For Isobaric process\n$\\begin{aligned} & \\mathrm{w}=\\mathrm{P} \\Delta \\mathrm{v}=\\mathrm{nR} \\Delta \\mathrm{T}=100 \\mathrm{~J} \\\\ & \\mathrm{Q}=\\Delta \\mathrm{u}+\\mathrm{w} \\\\ & \\Delta \\mathrm{Q}=\\frac{\\mathrm{F}}{2} \\mathrm{nR} \\Delta \\mathrm{T}+\\mathrm{nR} \\Delta \\mathrm{T} \\\\ & \\left(\\frac{\\mathrm{f}}{2}+1\\right) \\mathrm{nR} \\Delta \\mathrm{T} \\\\ & \\left(\\frac{5}{2}+1\\right) 100=350 \\mathrm{~J}\\end{aligned}$<br />SECTION - B", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda6f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 2)", "title": "JEE Main 2024 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6644673c970e6e9ab542d177", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda6e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 1)", "title": "JEE Main 2024 (08 Apr Shift 1)"}], "question": {"text": "Two different adiabatic paths for the same gas intersect two isothermal curves as shown in P-V diagram. The relation between the ratio $\\frac{V_a}{V_d}$ and the ratio $\\frac{V_b}{V_c}$ is:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/4iaSAzfJTlk_pM-k7g3cPrdPRs6eBjPpBl3mPI4SUog.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "eUW14", "text": "$\\frac{V_a}{V_d} \\neq \\frac{V_b}{V_c}$", "image": null, "isCorrect": false}, {"id": "x0VUY", "text": "$\\frac{V_a}{V_d}=\\frac{V_b}{V_c}$", "image": null, "isCorrect": true}, {"id": "3sOFO", "text": "$\\frac{V_a}{V_d}=\\left(\\frac{V_b}{V_c}\\right)^{-1}$", "image": null, "isCorrect": false}, {"id": "V6mw6", "text": "$\\frac{V_a}{V_d}=\\left(\\frac{V_b}{V_c}\\right)^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For adiabatic process\n$\\mathrm{TV}^{\\gamma-1}=$ constant\n$\\begin{aligned} & \\mathrm{T}_{\\mathrm{a}} \\cdot \\mathrm{V}_{\\mathrm{a}}^{\\gamma-1}=\\mathrm{T}_{\\mathrm{d}} \\cdot \\mathrm{V}_{\\mathrm{d}}^{\\gamma-1} \\\\ & \\left(\\frac{\\mathrm{V}_{\\mathrm{a}}}{\\mathrm{V}_{\\mathrm{d}}}\\right)^{\\gamma-1}=\\frac{\\mathrm{T}_{\\mathrm{d}}}{\\mathrm{T}_{\\mathrm{a}}} \\\\ & \\mathrm{T}_{\\mathrm{b}} \\cdot \\mathrm{V}_{\\mathrm{b}}^{\\gamma-1}=\\mathrm{T}_{\\mathrm{c}} \\cdot \\mathrm{V}_{\\mathrm{c}}^{\\gamma-1} \\\\ & \\left(\\frac{\\mathrm{V}_{\\mathrm{b}}}{\\mathrm{V}_{\\mathrm{c}}}\\right)^{\\gamma-1}=\\frac{\\mathrm{T}_{\\mathrm{c}}}{\\mathrm{T}_{\\mathrm{b}}} \\\\ & \\frac{\\mathrm{V}_{\\mathrm{a}}}{\\mathrm{V}_{\\mathrm{d}}}=\\frac{\\mathrm{V}_{\\mathrm{b}}}{\\mathrm{V}_{\\mathrm{c}}} \\quad\\left(\\begin{array}{c}\\because \\mathrm{T}_{\\mathrm{d}}=\\mathrm{T}_{\\mathrm{c}} \\\\ \\mathrm{T}_{\\mathrm{a}}=\\mathrm{T}_{\\mathrm{b}}\\end{array}\\right)\\end{aligned}$", "image": null}, "videoSolution": null, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "664466ef278297dee60eda6e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2024 (08 Apr Shift 1)", "title": "JEE Main 2024 (08 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446716970e6e9ab542d012", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T09:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 1)", "title": "JEE Main 2024 (05 Apr Shift 1)"}], "question": {"text": "The heat absorbed by a system in going through the given cyclic process is :\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/rk_cil8WOBoaFAiS50kFTB3VWKXhqorLZFbmn_cAGWs.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "iAg04", "text": "$19.6 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "KHKJz", "text": "$61.6 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "f5NMt", "text": "$616 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "4VXkw", "text": "$431.2 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\Delta \\mathrm{U}=0(\\text { Cyclic process }) \\\\ & \\Delta \\mathrm{Q}=\\mathrm{W}=\\text { area of } \\mathrm{P}-\\mathrm{V} \\text { curve. } \\\\ & =\\pi \\times\\left(140 \\times 10^3 \\mathrm{~Pa}\\right) \\times\\left(140 \\times 10^{-6} \\mathrm{~m}^3\\right) \\\\ & \\Delta \\mathrm{Q}=61.6 \\mathrm{~J}\\end{aligned}$", "image": null}, "videoSolution": null, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "664466ee278297dee60eda6a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T09:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 1)", "title": "JEE Main 2024 (05 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6644670c970e6e9ab542cfb8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda69", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 2)", "title": "JEE Main 2024 (04 Apr Shift 2)"}], "question": {"text": "A sample of gas at temperature $T$ is adiabatically expanded to double its volume. Adiabatic constant for the gas is $\\gamma=3 / 2$. The work done by the gas in the process is:\n$(\\mu=1 \\mathrm{~mole})$", "image": null}, "options": [{"id": "iIs7S", "text": "$R T[1-2 \\sqrt{2}]$", "image": null, "isCorrect": false}, {"id": "zk0Qz", "text": "$R T[\\sqrt{2}-2]$", "image": null, "isCorrect": false}, {"id": "IGB5d", "text": "$R T[2-\\sqrt{2}]$", "image": null, "isCorrect": true}, {"id": "oNiPZ", "text": "$R T[2 \\sqrt{2}-1]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{W}=\\frac{\\mathrm{nR} \\Delta \\mathrm{T}}{1-\\gamma} \\\\ & \\mathrm{TV}^{\\gamma-1}=\\text { constan } \\mathrm{t}=\\mathrm{T}_{\\mathrm{f}}(2 \\mathrm{~V})^{\\gamma-1} \\\\ & \\mathrm{~T}_{\\mathrm{f}}=\\mathrm{T}\\left(\\frac{1}{2}\\right)^{1 / 2}=\\frac{\\mathrm{T}}{\\sqrt{2}} \\\\ & \\mathrm{~W}=\\frac{\\mathrm{R}\\left(\\frac{\\mathrm{T}}{\\sqrt{2}}-\\mathrm{T}\\right)}{1-\\frac{3}{2}}=2 \\mathrm{RT} \\frac{(\\sqrt{2}-1)}{\\sqrt{2}} \\\\ & =\\mathrm{RT}(2-\\sqrt{2})\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda69", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 2)", "title": "JEE Main 2024 (04 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446702970e6e9ab542cf58", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda68", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 1)", "title": "JEE Main 2024 (04 Apr Shift 1)"}], "question": {"text": "P-T diagram of an ideal gas having three different densities $\\rho_1, \\rho_2, \\rho_3$ (in three different cases) is shown in the figure. Which of the following is correct :\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/FY3RknQd1DR5i3YKub5pOiXUSbj4Xn7hbwpUytlXyE8.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "GQWhG", "text": "$\\rho_1>\\rho_2$", "image": null, "isCorrect": true}, {"id": "wGPaW", "text": "$\\rho_2 < \\rho_3$", "image": null, "isCorrect": false}, {"id": "UBg46", "text": "$\\rho_1=\\rho_2=\\rho_3$", "image": null, "isCorrect": false}, {"id": "vYxO3", "text": "$\\rho_1 < \\rho_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For ideal gas\n$\\begin{aligned}\n& P V=n R T \\\\\n& P V=\\frac{m}{M} R T \\\\\n& P=\\left(\\frac{M}{V}\\right) \\frac{R T}{M} \\\\\n& P=\\frac{\\rho R T}{M}\n\\end{aligned}$\n(Where $\\mathrm{m}$ is mass of gas and $\\mathrm{M}$ is molecular mass of gas)\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/sB72bMqLldNuXVQOFMuzIj48-a6mJ8Tb91CeUaR8zt0.original.fullsize.png\"><br />for same temperature $\\mathrm{P}_1>\\mathrm{P}_2>\\mathrm{P}_3$\nSo $\\rho_1>\\rho_2>\\rho_3$", "image": null}, "videoSolution": {"videoId": "d11bf34e152e44fcaca2f0f1a8372a00", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/E51EbANHZ44oZ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/E51EbANHZ44oZ.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "664466ee278297dee60eda68", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 1)", "title": "JEE Main 2024 (04 Apr Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T10:46:29.542Z"}, {"_id": "6682bd70ba0e94a3c4025ca8", "type": "singleCorrect", "level": 2, "questionLabels": [], "question": {"text": "A diatomic gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>γ</mi><mo>=</mo><mn>1</mn><mo>.</mo><mn>4</mn><mo>)</mo></math> does <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math> of work when it is expanded isobarically. The heat given to the gas in the process is :", "image": null}, "options": [{"id": "MhX8o", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>850</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "okq4e", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>800</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "89q2X", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "q9hxK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>700</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>For degree of freedom, we can write</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">γ</mi><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mn>2</mn><mi mathvariant=\"normal\">f</mi></mfrac><mo>=</mo><mn>1</mn><mo>.</mo><mn>4</mn><mspace linebreak=\"newline\"></mspace><mo>⇒</mo><mfrac><mn>2</mn><mi mathvariant=\"normal\">f</mi></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">f</mi><mo>=</mo><mn>5</mn></math></p><p>For isobaric process, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">W</mi><mo>=</mo><mi>nR</mi><mi>Δ</mi><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>200</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math>.</p><p>Now, we can write</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi><mo>=</mo><mfenced><mfrac><mrow><mi mathvariant=\"normal\">f</mi><mo>+</mo><mn>2</mn></mrow><mn>2</mn></mfrac></mfenced><mi>nRΔT</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>7</mn><mn>2</mn></mfrac><mo>×</mo><mn>200</mn><mo>=</mo><mn>700</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb07", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 2)", "title": "JEE Main 2024 (01 Feb Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb07", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 2)", "title": "JEE Main 2024 (01 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd71ba0e94a3c4025cae", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "The pressure and volume of an ideal gas are related as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mfrac><mn>3</mn><mn>2</mn></mfrac></msup><mo>=</mo><mi>K</mi></math> (Constant). The work done when the gas is taken from state <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mfenced><mrow><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><mo> </mo><msub><mi>V</mi><mn>1</mn></msub><mo>,</mo><mo> </mo><msub><mi>T</mi><mn>1</mn></msub></mrow></mfenced></math> to state <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mfenced><mrow><msub><mi>P</mi><mn>2</mn></msub><mo>,</mo><mo> </mo><msub><mi>V</mi><mn>2</mn></msub><mo>,</mo><mo> </mo><msub><mi>T</mi><mn>2</mn></msub></mrow></mfenced></math> is :", "image": null}, "options": [{"id": "ZkHN5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>(</mo><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub><mo>-</mo><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub><mo>)</mo></math>", "image": null, "isCorrect": true}, {"id": "YYc4k", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>(</mo><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub><mo>-</mo><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub><mo>)</mo></math>", "image": null, "isCorrect": false}, {"id": "5tfHj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mfenced><mrow><msqrt><msub><mi>P</mi><mn>1</mn></msub></msqrt><msub><mi>V</mi><mn>1</mn></msub><mo>−</mo><msqrt><msub><mi>P</mi><mn>2</mn></msub></msqrt><msub><mi>V</mi><mn>2</mn></msub></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "nVGbf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mfenced><mrow><msub><mi>P</mi><mn>2</mn></msub><msqrt><msub><mi>V</mi><mn>2</mn></msub></msqrt><mo>−</mo><msub><mi>P</mi><mn>1</mn></msub><msqrt><msub><mi>V</mi><mn>1</mn></msub></msqrt></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>For <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>x</mi></msup><mo>=</mo></math> constant, work done by the gas is given by, </p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mfrac><mrow><mi>n</mi><mi>R</mi><mi>Δ</mi><mi>T</mi></mrow><mrow><mn>1</mn><mo>−</mo><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub><mo>-</mo><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mrow><mrow><mn>1</mn><mo>−</mo><mi>x</mi></mrow></mfrac></math>.</p><p>Here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math>, therefore we can write</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mi>W</mi><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub><mo>−</mo><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mrow><mrow><mo>−</mo><mstyle displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mfenced><mrow><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub><mo>−</mo><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub></mrow></mfenced></math> </p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb06", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 1)", "title": "JEE Main 2024 (01 Feb Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb06", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T09:00:00.000Z", "isVisible": true, "sho math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∝</mo><mfrac><mn>1</mn><mi>P</mi></mfrac></math></p><p>As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><mi>Slope</mi></mfenced><mn>2</mn></msub><mo>&gt;</mo><msub><mfenced><mi>Slope</mi></mfenced><mn>1</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>P</mi><mn>2</mn></msub><mo>&lt;</mo><msub><mi>P</mi><mn>1</mn></msub></math></p>", "image": null}, "videoSolution": {"videoId": "437ad92e43dc4ad9940c8d17902c2c27", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/CsmJ8oa3grWOO.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/CsmJ8oa3grWOO.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}], "questionStructure": ["GRAPH_BASED"], "previousYear": {"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T10:26:47.085Z"}, {"_id": "6682bd71ba0e94a3c4025cac", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "<p>Choose the correct statement for processes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> &amp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> shown in figure.</p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/748c6504-0967-44db-a21e-dd004831a109.png\" style=\"width: 200px; height: 188px;\"/>", "image": null}, "options": [{"id": "eAvfY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>γ</mi></msup><mo>=</mo><mi>k</mi></math> for process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi><mo>=</mo><mi>k</mi></math> for process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>.", "image": null, "isCorrect": true}, {"id": "fGJJT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi><mo>=</mo><mi>k</mi></math> for process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>.", "image": null, "isCorrect": false}, {"id": "k6i36", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>P</mi><mrow><mi>γ</mi><mo>-</mo><mn>1</mn></mrow></msup><msup><mi>T</mi><mi>γ</mi></msup></mfrac><mo>=</mo><mi>k</mi></math> for process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mi>k</mi></math> for process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>.", "image": null, "isCorrect": false}, {"id": "JDDMa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>T</mi><mi>γ</mi></msup><msup><mi>P</mi><mrow><mi>γ</mi><mo>-</mo><mn>1</mn></mrow></msup></mfrac><mo>=</mo><mi>k</mi></math> for process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi><mo>=</mo><mi>k</mi></math> for process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Steeper curve (B) is adiabatic<br/>For adiabatic <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>PV</mi><mi>γ</mi></msup><mo>=</mo></math> constant</p><p>and curve (A) is isothermal. Therefore,<br/><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo></math> constant<br/><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>P</mi><mi>V</mi><mo>=</mo></math> constant</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}], "questionStructure": ["GRAPH_BASED"], "previousYear": {"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}, "evalStatus": "incorrect", "lastPracticed": "2024-11-21T10:27:20.082Z"}, {"_id": "6682bd71ba0e94a3c4025cab", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "During an adiabatic process, the pressure of a gas is found to be proportional to the cube of its absolute temperature. The ratio of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>C</mi><mi>p</mi></msub><msub><mi>C</mi><mi>v</mi></msub></mfrac></math> for the gas is :", "image": null}, "options": [{"id": "Z8kUs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>3</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Gfoeq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "oEqrn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>7</mn><mn>5</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "bY1HT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>7</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>It is given that</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>∝</mo><msup><mi>T</mi><mn>3</mn></msup><mspace linebreak=\"newline\"></mspace><mo>⇒</mo><mi>P</mi><msup><mi>T</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>=</mo><mtext>constant</mtext><mo> </mo><mo> </mo><mo> </mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>For an adiabatic process,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>γ</mi></msup><mo>=</mo><mtext>constant</mtext><mo> </mo><mo> </mo><mo> </mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>Assuming the gas to be a perfect gas, it can be written from equation (2) that</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mfenced><mfrac><mrow><mi>n</mi><mi>R</mi><mi>T</mi></mrow><mi>P</mi></mfrac></mfenced><mi>γ</mi></msup><mo>=</mo><mtext>constant</mtext><mspace linebreak=\"newline\"></mspace><mo>⇒</mo><msup><mi>P</mi><mrow><mn>1</mn><mo>-</mo><mi>γ</mi></mrow></msup><msup><mi>T</mi><mi>γ</mi></msup><mo>=</mo><mtext>constant</mtext><mspace linebreak=\"newline\"></mspace><mo>⇒</mo><mi>P</mi><msup><mi>T</mi><mfrac><mi>γ</mi><mrow><mn>1</mn><mo>-</mo><mi>γ</mi></mrow></mfrac></msup><mo>=</mo><mtext>constant</mtext></math></p><p>By comparing with equation(1), we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mi>γ</mi><mrow><mn>1</mn><mo>-</mo><mi>γ</mi></mrow></mfrac><mo>=</mo><mo>-</mo><mn>3</mn><mspace linebreak=\"newline\"></mspace><mo>⇒</mo><mi>γ</mi><mo>=</mo><mo>-</mo><mn>3</mn><mo>+</mo><mn>3</mn><mi>γ</mi><mspace linebreak=\"newline\"></mspace><mo>⇒</mo><mn>3</mn><mo>=</mo><mn>2</mn><mi>γ</mi><mspace linebreak=\"newline\"></mspace><mo>⇒</mo><mi>γ</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math></p>", "image": null}, "videoSolution": {"videoId": "8c2bd0fae7724f6e8dd5566ca097ffb4", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/OMdESyoMnD0FK.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/OMdESyoMnD0FK.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436baff", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T14:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 2)", "title": "JEE Main 2024 (27 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436baff", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T14:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 2)", "title": "JEE Main 2024 (27 Jan Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T10:30:52.071Z"}, {"_id": "648b5a71417cc3fb48d686b0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6495", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 Apr Shift 2)", "title": "JEE Main 2023 (13 Apr Shift 2)"}], "question": {"text": "<p>The initial pressure and volume of an ideal gas are<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><msub><mi>P</mi><mn>0</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>0</mn></msub></math>. The final pressure of the gas when the gas is suddenly compressed to volume<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mfrac><msub><mi>V</mi><mn>0</mn></msub><mn>4</mn></mfrac></math> will be:</p><p>(Given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi></math>= ratio of specific heats at constant pressure and at constant volume.)</p>", "image": null}, "options": [{"id": "9ysJX", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>0</mn></msub><mo>(</mo><mn>4</mn><msup><mo>)</mo><mi>&#947;</mi></msup></math></p>", "image": null, "isCorrect": true}, {"id": "mrEiM", "text": "<p>&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi>P</mi><mn>0</mn></msub></math></p>", "image": null, "isCorrect": false}, {"id": "cX59R", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>0</mn></msub></math></p>", "image": null, "isCorrect": false}, {"id": "wze5s", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>0</mn></msub><mo>(</mo><mn>4</mn><msup><mo>)</mo><mfrac><mn>1</mn><mi>&#947;</mi></mfrac></msup></math></p>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>As the gas is suddenly compressed the process is adiabatic.</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>&#947;</mi></msup><mo>=</mo><mi>constant</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>P</mi><mn>0</mn></msub><msubsup><mi>V</mi><mn>0</mn><mi>&#947;</mi></msubsup><mo>=</mo><mi>P</mi><mo>&#183;</mo><msup><mfenced><mfrac><msub><mi>V</mi><mn>0</mn></msub><mn>4</mn></mfrac></mfenced><mi>&#947;</mi></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mo>=</mo><msup><mn>4</mn><mi>&#947;</mi></msup><mo>&#183;</mo><msub><mi>P</mi><mn>0</mn></msub></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6495", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 Apr Shift 2)", "title": "JEE Main 2023 (13 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d685ae", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}], "question": {"text": "The thermodynamic process, in which internal energy of the system remains constant is", "image": null}, "options": [{"id": "jkUup", "text": "Isochoric", "image": null, "isCorrect": false}, {"id": "XkXz1", "text": "Adiabatic", "image": null, "isCorrect": false}, {"id": "vjXyk", "text": "Isothermal", "image": null, "isCorrect": true}, {"id": "EdxoN", "text": "Isobaric", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>An isothermal process is&nbsp;a thermodynamic process in which the temperature of a system remains constant. The transfer of heat into or out of the system happens so slowly that thermal equilibrium is maintained.</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>T</mi><mo>=</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mi>&#916;</mi><mi>U</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>V</mi></msub><mo>&#8710;</mo><mi>T</mi><mo>=</mo><mn>0</mn></math>.</p><p>According to first law of thermodynamics,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>Q</mi><mo>=</mo><mo>&#8710;</mo><mi>U</mi><mo>+</mo><mo>&#8710;</mo><mi>W</mi><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mo>&#8710;</mo><mi>Q</mi><mo>=</mo><mo>&#8710;</mo><mi>W</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6493", "
