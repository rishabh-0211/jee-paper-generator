ven: Initial efficiency&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mn>2</mn></msub><mn>600</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msub><mi>T</mi><mn>2</mn></msub><mn>600</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>When efficiency is increased to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>70</mn><mo>%</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>,</p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>T</mi><mo>&#39;</mo></msup></math>&nbsp;be&nbsp;new temperature of source&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>7</mn><mn>10</mn></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mn>300</mn><msup><mi>T</mi><mo>&#39;</mo></msup></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>300</mn><msup><mi>T</mi><mo>&#39;</mo></msup></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mn>7</mn><mn>10</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><msup><mi>T</mi><mo>&#39;</mo></msup><mo>=</mo><mn>1000</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67c25", "previousYearPapers": [{"_id": "63134c746e7bc9b332483706", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 1)", "title": "JEE Main 2022 (28 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A Carnot engine has efficiency of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>%</mo></math>. If the temperature of sink&nbsp;is reduced by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, its efficiency increases by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>%</mo></math>. The temperature of the source will be :", "image": null}, "options": [{"id": "fBhCS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>166</mn><mo>.</mo><mn>7</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": false, "image": null}, {"id": "Gpwon", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>255</mn><mo>.</mo><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": false, "image": null}, {"id": "dGrdh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>266</mn><mo>.</mo><mn>7</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": true, "image": null}, {"id": "gdMfD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>367</mn><mo>.</mo><mn>7</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Initial efficiency&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#951;</mi><mn>0</mn></msub><mo>=</mo><mn>50</mn><mo>%</mo></math>, the increase in&nbsp;efficiency is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>%</mo></math>. Therefore, new efficiency&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>50</mn><mfenced><mrow><mn>1</mn><mo>+</mo><mfrac><mn>30</mn><mn>100</mn></mfrac></mrow></mfenced><mo>=</mo><mn>65</mn><mo>%</mo></math>.</p><p>Efficiency of the Carnot engin is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mi>L</mi></msub><msub><mi>T</mi><mi>H</mi></msub></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>&#951;</mi><mn>0</mn></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mi>L</mi></msub><msub><mi>T</mi><mi>H</mi></msub></mfrac></math></p><p>When the temperature of the sink is decreased by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>=</mo><mn>40</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mn>1</mn><mo>&#183;</mo><mn>3</mn></mrow></mfenced><mo>=</mo><mn>1</mn><mo>-</mo><mfenced><mfrac><mrow><msub><mi>T</mi><mi>L</mi></msub><mo>-</mo><mn>40</mn></mrow><mrow><mo>&#160;</mo><msub><mi>T</mi><mi>H</mi></msub></mrow></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mn>1</mn><mo>&#183;</mo><mn>3</mn></mrow></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>+</mo><mfrac><mn>40</mn><msub><mi>T</mi><mi>H</mi></msub></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>T</mi><mi mathvariant=\"normal\">H</mi></msub><mo>=</mo><mn>266</mn><mo>.</mo><mn>7</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483706", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 1)", "title": "JEE Main 2022 (28 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67b18", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 2)", "title": "JEE Main 2022 (27 Jul Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>In <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>1</mn><mrow><mi>st</mi></mrow></msup></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mrow><mo>&nbsp;</mo></mrow></msup></math> case, Carnot engine operates between temperatures <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">K</mi></math>. In <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mrow><mi>nd</mi></mrow></msup></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mrow><mo>&nbsp;</mo></mrow></msup></math> case, as shown in the figure, a combination of two engines is used. The efficiency of this combination (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mrow><mi>nd</mi></mrow></msup></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mrow><mo>&nbsp;</mo></mrow></msup></math> case) will be :</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f33ff27b-9c83-44eb-b658-b40713bfb1be-image.png\" style=\"width: 150px; height: 217px;\" /></p>", "image": null}, "options": [{"id": "ixTCB", "text": "same as the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>1</mn><mrow><mi>st</mi><mo>&#160;</mo></mrow></msup></math> case", "isCorrect": true, "image": null}, {"id": "5uWFy", "text": "always greater than the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>1</mn><mrow><mi>st</mi><mo>&#160;</mo></mrow></msup></math> case", "isCorrect": false, "image": null}, {"id": "tgdoQ", "text": "always less than the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>1</mn><mrow><mi>st</mi><mo>&#160;</mo></mrow></msup></math> case", "isCorrect": false, "image": null}, {"id": "ZsPsY", "text": "may increase or decrease with respect to the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>1</mn><mrow><mi>st</mi><mo>&#160;</mo></mrow></msup></math> case", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>The efficiency of a Carnot engine operating between two temperatures is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mi>L</mi></msub><msub><mi>T</mi><mi>H</mi></msub></mfrac></math></p><p>For the first case : <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mn>100</mn><mn>300</mn></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac></math></p><p>For the second case : <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#951;</mi><mrow><mi>net</mi><mo>&#160;</mo></mrow></msub><mo>=</mo><msub><mi>&#951;</mi><mn>1</mn></msub><mo>+</mo><msub><mi>&#951;</mi><mn>2</mn></msub><mo>-</mo><msub><mi>&#951;</mi><mn>1</mn></msub><msub><mi>&#951;</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#951;</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mn>200</mn><mn>300</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#951;</mi><mn>2</mn></msub><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mn>100</mn><mn>200</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#951;</mi><mrow><mi>net</mi><mo>&#160;</mo></mrow></msub><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>6</mn></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi></math>(first case)<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>&#951;</mi></math>(second case)</p></blockquote>", "image": null}, "videoSolution": {"videoId": "e14630d701964afc93e8bc689f920e4a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/LZu0oAMzSQ1Ks.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/LZu0oAMzSQ1Ks.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["DIAGRAM_BASED"], "previousYear": {"_id": "63134c746e7bc9b33248370a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 2)", "title": "JEE Main 2022 (27 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67abe", "previousYearPapers": [{"_id": "63134c746e7bc9b332483705", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 1)", "title": "JEE Main 2022 (27 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Read the following statements :<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>. When small temperature difference between a liquid and its surrounding is doubled the rate of loss of heat of the liquid becomes twice.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>. Two bodies <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> having equal surface areas are maintained at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. The thermal radiation emitted in a given time by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> are in the ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>1</mn><mo>.</mo><mn>15</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>. A carnot Engine working between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math> has an efficiency of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>75</mn><mo>%</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi></math>. When small temperature difference between a liquid and its surrounding is quadrupled, the rate of loss of heat of the liquid becomes twice.</p><p>Choose the correct answer from the options given below :</p>", "image": null}, "options": [{"id": "2zBHf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi></math> only", "isCorrect": true, "image": null}, {"id": "sS9mq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi></math> only", "isCorrect": false, "image": null}, {"id": "SCuNo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi></math> only", "isCorrect": false, "image": null}, {"id": "rSWXB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi></math> only", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>. by Newton&#39;s law&nbsp;of cooling <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mrow><mi>d</mi><mi>&#952;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>&#8733;</mo><mi>&#916;</mi><mi>&#952;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>. According to Stephan&#39;s&nbsp;law&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mo>d</mo><mi>H</mi></mrow><mrow><mo>d</mo><mi>t</mi></mrow></mfrac><mo>=</mo><mi>&#963;</mi><mi>e</mi><mi>A</mi><msup><mi>T</mi><mn>4</mn></msup><mo>&#8658;</mo><mfrac><msub><mi>H</mi><mi>P</mi></msub><msub><mi>H</mi><mi>Q</mi></msub></mfrac><mo>=</mo><msup><mfenced><mfrac><msub><mi>T</mi><mi>P</mi></msub><msub><mi>T</mi><mi>Q</mi></msub></mfrac></mfenced><mn>4</mn></msup><mo>=</mo><msup><mfenced><mfrac><mn>283</mn><mn>293</mn></mfrac></mfenced><mn>4</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>H</mi><mi>P</mi></msub><mo>:</mo><msub><mi>H</mi><mi>Q</mi></msub><mo>=</mo><mn>1</mn><msup><mfenced><mrow><mn>1</mn><mo>.</mo><mn>03</mn></mrow></mfenced><mn>4</mn></msup><mo>=</mo><mn>1</mn><mo>:</mo><msup><mfenced><mrow><mn>1</mn><mo>.</mo><mn>03</mn></mrow></mfenced><mn>4</mn></msup><mo>=</mo><mn>1</mn><mo>:</mo><mn>1</mn><mo>.</mo><mn>15</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">B</mi></math> is correct</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>. The efficiency of the Carnot cycle is given by<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mn>1</mn></msub><msub><mi>T</mi><mn>2</mn></msub></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mn>100</mn><mn>400</mn></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>=</mo><mn>75</mn><mo>%</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi></math>.&nbsp;is wrong as according to the Newton&#39;s law of cooling&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>&#952;</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>&#8733;</mo><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MULTI_STATEMENT"], "previousYear": {"_id": "63134c746e7bc9b332483705", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 1)", "title": "JEE Main 2022 (27 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d6784f", "previousYearPapers": [{"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Ju age.png\" style=\"width: 150px; height: 186px;\" /></p><p>Efficiency of Carnot engine is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>Q</mi><mn>2</mn></msub><msub><mi>Q</mi><mn>1</mn></msub></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mn>2</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mfrac></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>1</mn><mo>-</mo><mfrac><mn>225</mn><mn>300</mn></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mn>2</mn></msub><mn>500</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mfrac><mn>5</mn><mn>3</mn></mfrac><mo>&#215;</mo><mn>225</mn><mo>=</mo><mn>375</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>So, temperature of sink is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>375</mn><mo>-</mo><mn>273</mn><mo>=</mo><mn>102</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934db", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 1)", "title": "JEE Main 2022 (29 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67b7f", "previousYearPapers": [{"_id": "62c481f101514d218a7934d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 1)", "title": "JEE Main 2022 (27 Jun Shift 1)"}], "type": "numerical", "level": 2, "question": {"text": "In a carnot engine, the temperature of reservoir is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>527</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> and that of sink&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>. If the workdone by the engine when it transfers heat from reservoir&nbsp;to sink is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12000</mn><mo>&#160;</mo><mi>kJ</mi></math>, the quantity of heat absorbed by the engine from reservoir is _____&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>.", "image": null}, "options": [], "correctValue": "16", "solution": {"text": "<p>Efficiency of Carnot engine is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mi>L</mi></msub><msub><mi>T</mi><mi>H</mi></msub></mfrac><mo>=</mo><mfrac><mi>W</mi><mi>Q</mi></mfrac></math>, where,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>&nbsp;is heat absorbed.</p><p>Here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>H</mi></msub><mo>=</mo><mn>527</mn><mo>+</mo><mn>273</mn><mo>=</mo><mn>800</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mn>200</mn><mn>800</mn></mfrac><mo>=</mo><mfrac><mn>12</mn><mi>Q</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>=</mo><mfrac><mn>12000</mn><mi>Q</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>Q</mi><mo>=</mo><mn>16</mn><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 1)", "title": "JEE Main 2022 (27 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67a75", "previousYearPapers": [{"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "<div>A heat engine operates with the cold reservoir at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>324</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>. The minimum temperature of the hot reservoir, if the heat engine takes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math> heat from the hot reservoir and delivers <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>180</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math> heat to the cold reservoir per cycle, is _____&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math>.</div>", "image": null}, "options": [], "correctValue": "540", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/928c1b20-13f8-44d1-97f7-f42cc7e6fdad-image.png\" style=\"width: 280px; height: 136px;\" /></p><p>Using the relation,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>Q</mi><mn>2</mn></msub><msub><mi>Q</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi>T</mi><mn>2</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mfrac></math></p><p>Or&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>180</mn><mn>300</mn></mfrac><mo>=</mo><mfrac><mn>324</mn><msub><mi>T</mi><mn>1</mn></msub></mfrac><mo>&#8658;</mo><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mfrac><mrow><mn>324</mn><mo>&#215;</mo><mn>300</mn></mrow><mn>180</mn></mfrac><mo>=</mo><mn>540</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67a09", "previousYearPapers": [{"_id": "62c481f001514d218a7934d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 1)", "title": "JEE Main 2022 (26 Jun Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The efficiency of a Carnot&#39;s engine, working between steam point and ice point, will be", "image": null}, "options": [{"id": "5oMZc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>26</mn><mo>.</mo><mn>81</mn><mo>%</mo></math>", "isCorrect": true, "image": null}, {"id": "1iIK0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>37</mn><mo>.</mo><mn>81</mn><mo>%</mo></math>", "isCorrect": false, "image": null}, {"id": "cbBnQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>47</mn><mo>.</mo><mn>81</mn><mo>%</mo></math>", "isCorrect": false, "image": null}, {"id": "9yCBz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>57</mn><mo>.</mo><mn>81</mn><mo>%</mo></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Steam point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>100</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>=</mo><mfenced><mrow><mn>100</mn><mo>+</mo><mn>273</mn></mrow></mfenced><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>=</mo><mn>373</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>Ice point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>=</mo><mfenced><mrow><mn>0</mn><mo>+</mo><mn>273</mn></mrow></mfenced><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>=</mo><mn>273</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>Now,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mrow><mi>s</mi><mi>i</mi><mi>n</mi><mi>k</mi></mrow></msub><msub><mi>T</mi><mrow><mi>s</mi><mi>o</mi><mi>u</mi><mi>r</mi><mi>c</mi><mi>e</mi></mrow></msub></mfrac></math>&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mn>273</mn><mn>373</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>100</mn><mn>373</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>%</mo></math>&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>26</mn><mo>.</mo><mn>81</mn><mo>%</mo></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 1)", "title": "JEE Main 2022 (26 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67791", "previousYearPapers": [{"_id": "62c481f001514d218a7934d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T14:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 2)", "title": "JEE Main 2022 (24 Jun Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A Carnot engine takes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5000</mn><mo>&#160;</mo><mi>kcal</mi></math> of heat from a reservoir at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>727</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> and gives heat to a sink at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>127</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. The work done by the engine is", "image": null}, "options": [{"id": "OVuFX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "60Rmr", "text": "Zero", "isCorrect": false, "image": null}, {"id": "CE5D9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>.</mo><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "J6dgL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Given,</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mfenced><mi>Heat</mi></mfenced><mo>=</mo><mn>5000</mn><mo>&#160;</mo><mi>kcal</mi><mo>=</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi>cal</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mfenced><mi>Sink</mi></mfenced><mo>=</mo><msup><mn>127</mn><mo>&#176;</mo></msup><mi mathvariant=\"normal\">C</mi><mo>=</mo><mfenced><mrow><mn>127</mn><mo>+</mo><mn>273</mn></mrow></mfenced><mi mathvariant=\"normal\">K</mi><mo>=</mo><mn>400</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub><mfenced><mi>Source</mi></mfenced><mo>=</mo><msup><mn>727</mn><mo>&#176;</mo></msup><mi mathvariant=\"normal\">C</mi><mo>=</mo><mfenced><mrow><mn>727</mn><mo>+</mo><mn>273</mn></mrow></mfenced><mi mathvariant=\"normal\">K</mi><mo>=</mo><mn>1000</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>The efficiency of the Carnot cycle is given by,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mi>sink</mi></msub><msub><mi>T</mi><mi>source</mi></msub></mfrac><mo>=</mo><mfrac><mi>W</mi><mi>Q</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mrow><mn>1</mn><mo>-</mo><mfrac><mn>400</mn><mn>1000</mn></mfrac></mrow></mfenced><mo>=</mo><mfrac><mn>6</mn><mn>10</mn></mfrac><mo>=</mo><mfrac><mi>W</mi><mn>5000</mn></mfrac></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>W</mi><mo>=</mo><mn>3000</mn><mo>&#160;</mo><mi>kcal</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn><mo>&#215;</mo><mo>&#215;</mo><mn>4</mn><mo>.</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mn>6</mn><mo>&#160;</mo></mrow></msup><mi mathvariant=\"normal\">J</mi><mo>=</mo><mn>12</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mn>6</mn><mo>&#160;</mo></mrow></msup><mi mathvariant=\"normal\">J</mi></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T14:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 2)", "title": "JEE Main 2022 (24 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67743", "previousYearPapers": [{"_id": "62c481f001514d218a7934d1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T09:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 1)", "title": "JEE Main 2022 (24 Jun Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A Carnot engine whose heat sinks at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, has an efficiency of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>%</mo></math>. By how many degrees should the temperature of the source be changed to increase the efficiency by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>%</mo></math> of the original efficiency ?", "image": null}, "options": [{"id": "AV7VE", "text": "Increases by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>18</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "fHGYV", "text": "Increases by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": true, "image": null}, {"id": "9EiBf", "text": "Increases by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "eCQa1", "text": "Increases by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>73</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Efficiency of carnot engine is given by,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mi>sink</mi></msub><msub><mi>T</mi><mi>source</mi></msub></mfrac></math>.</p><p>For initial case:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>sink</mi></msub><mo>=</mo><mfenced><mrow><mn>27</mn><mo>+</mo><mn>273</mn></mrow></mfenced><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>=</mo><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>So we can write,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mn>300</mn><msub><mi>T</mi><mn>1</mn></msub></mfrac></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mn>400</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>Now for the second case:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>sink</mi></msub><mo>=</mo><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>After increasing the previous efficiency by 100%, value of efficiency will get doubled.</p><p>Therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mn>300</mn><msub><mi>T</mi><mn>2</mn></msub></mfrac></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>600</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>Increase in temperature required will be,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>-</mo><mn>400</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>=</mo><mn>200</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T09:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 1)", "title": "JEE Main 2022 (24 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d6768b", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T09:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 1)", "title": "JEE Main 2021 (31 Aug Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A reversible engine has an efficiency of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>.</mo></math>&nbsp;If the temperature of the sink is reduced by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>58</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi><mo>,</mo></math>&nbsp;its efficiency becomes double. Calculate the temperature of the sink:", "image": null}, "options": [{"id": "jWM6u", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>180</mn><mo>.</mo><mn>4</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "IYJKH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>382</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "gGW0H", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>174</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": true, "image": null}, {"id": "39bQC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>280</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mi>L</mi></msub><msub><mi>T</mi><mi>H</mi></msub></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mi>L</mi></msub><msub><mi>T</mi><mi>H</mi></msub></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>T</mi><mi>L</mi></msub><msub><mi>T</mi><mi>H</mi></msub></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#951;</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mrow><msub><mi>T</mi><mi>L</mi></msub><mo>-</mo><mn>58</mn></mrow><msub><mi>T</mi><mi>H</mi></msub></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>T</mi><mi>L</mi></msub><mo>-</mo><mn>58</mn></mrow><msub><mi>T</mi><mi>H</mi></msub></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>T</mi><mi>L</mi></msub><mrow><msub><mi>T</mi><mi>L</mi></msub><mo>-</mo><mn>58</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mo>/</mo><mn>4</mn></mrow><mrow><mn>1</mn><mo>/</mo><mn>2</mn></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mrow><mo>&#160;</mo><mi>T</mi></mrow><mi>L</mi></msub><mo>=</mo><mn>3</mn><msub><mrow><mo>&#160;</mo><mi>T</mi></mrow><mi>L</mi></msub><mo>-</mo><mn>174</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>L</mi></msub><mo>=</mo><mn>174</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>This question is bonus as the value given by NTA in option was in degree celsius.</p>", "image": null}, "videoSolution": {"videoId": "3d8ee2400edc481caf49b5a425eea974", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/5xvU85T4ZDYTp.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/5xvU85T4ZDYTp.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T09:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 1)", "title": "JEE Main 2021 (31 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d67585", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 2)", "title": "JEE Main 2021 (27 Aug Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "A heat engine operates between a cold reservoir at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>400</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math> and a hot reservoir at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub></math>. It takes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math> of heat from the hot reservoir and delivers <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>240</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math> of heat to the cold reservoir in a cycle. The minimum temperature of the hot reservoir has to be", "image": null}, "options": [], "correctValue": "500", "solution": {"text": "<p>Recall the formula of efficiency of heat engine in terms of work done and heat supplied to the source,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#951;</mi><mo>=</mo><mfrac><mi>W</mi><msub><mi>Q</mi><mi mathvariant=\"normal\">H</mi></msub></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><msub><mi>T</mi><mi mathvariant=\"normal\">L</mi></msub><msub><mi>T</mi><mi mathvariant=\"normal\">H</mi></msub></mfrac></math>, here&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mi>L</mi></msub><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msub><mi>T</mi><mi>H</mi></msub></math>, is the temperature of the sink and source<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>60</mn><mn>300</mn></mfrac><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mn>400</mn><msub><mi>T</mi><mi>H</mi></msub></mfrac></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>T</mi><mi mathvariant=\"normal\">H</mi></msub><mo>=</mo><mn>500</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 2)", "title": "JEE Main 2021 (27 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d67412", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T14:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 2)", "title": "JEE Main 2021 (26 Aug Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A refrigerator consumes an average <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>35</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi></math> power to operate between temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>10</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. If there is no loss of energy then how much average heat per second does it transfer?", "image": null}, "options": [{"id": "vZxEl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>350</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "MCPvm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>298</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "xGzhf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>263</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": true, "image": null}, {"id": "6VVUe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>35</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fcb77d2b-8d0a-4d58-93e7-40ac8f983e2f-image.png\" style=\"width: 208px; height: 293px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">W</mi><mo>+</mo><msub><mi mathvariant=\"normal\">Q</mi><mn>2</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">Q</mi><mn>1</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">W</mi><mo>=</mo><msub><mi mathvariant=\"normal\">Q</mi><mn>1</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">Q</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">Q</mi><mn>2</mn></msub><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi></mrow></mfrac><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">Q</mi><mn>2</mn></msub><mrow><msub><mi mathvariant=\"normal\">Q</mi><mn>1</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">Q</mi><mn>2</mn></msub></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">Q</mi><mn>2</mn></msub><mi mathvariant=\"normal\">W</mi></mfrac><mo>=</mo><mfrac><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub><mrow><msub><mi mathvariant=\"normal\">T</mi><mn>1</mn></msub><mo>-</mo><msub><mi mathvariant=\"normal\">T</mi><mn>2</mn></msub></mrow></mfrac></math></p><p>For one second,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mn>35</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>Q</mi><mn>2</mn></msub><mn>35</mn></mfrac><mo>=</mo><mfrac><mn>263</mn><mrow><mn>298</mn><mo>-</mo><mn>263</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Q</mi><mn>2</mn></msub><mo>=</mo><mn>263</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p>Hence, average heat per second transferred&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>263</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T14:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 2)", "title": "JEE Main 2021 (26 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d6762e", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Jul Shift 2)", "title": "JEE Main 2021 (27 Jul Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Two Carnot engines <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> operate in series such that engine A absorbs heat at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>1</mn></msub></math> and rejects heat to a sink at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math>. Engine <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> absorbs half of the heat rejected by Engine<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>A</mi></math> and rejects heat to the sink at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mn>3</mn></msub></math>. When workdone in both the cases is equal, to value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math> is :", "image": null}, "options": [{"id": "TlzM6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac><msub><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi></mrow><mn>1</mn></msub><mo>+</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><msub><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi></mrow><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "fqzt0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac><msub><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi></mrow><mn>1</mn></msub><mo>+</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><msub><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi></mrow><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "Idgzm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac><msub><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi></mrow><mn>1</mn></msub><mo>+</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><msub><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi></mrow><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "189qK", "text": "<math xmlns=\"http:// /mo><mi mathvariant=\"normal\">J</mi></mrow></mfenced></math>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7fb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-08T14:00:00.000Z", "isVisible": true, "shortName": "2020 (08 Jan Shift 2)", "title": "JEE Main 2020 (08 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66cab", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-07T14:00:00.000Z", "isVisible": true, "shortName": "2020 (07 Jan Shift 2)", "title": "JEE Main 2020 (07 Jan Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Two ideal Carnot engines operate in cascade (all heat given up by one engine is used by the other engine to produce work) between temperatures, <math><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></math> . The temperature of the hot reservoir of the first engine is <math><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and the temperature of the cold reservoir of the second engine is <math><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></math> . <math><mi mathvariant=\"normal\">T</mi></math> is temperature of the sink of first engine which is also the source for the second engine. How is <math><mi mathvariant=\"normal\">T</mi></math> related to <math><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></math> , if both the engines perform equal amount of work?", "image": null}, "options": [{"id": "YUSAS", "text": "<math><mtext>T</mtext up></math> engine<br />Work done by <math><msup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi></mrow></msup></math> engine <math><mo>=</mo></math> work done by <math><mi mathvariant=\"normal\">I</mi><msup><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi></mrow></msup></math> engine.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi><mo>-</mo><msub><mi mathvariant=\"normal\">Q</mi><mn>2</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">Q</mi><mn>1</mn></msub><mo>-</mo><mi mathvariant=\"normal\">Q</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">Q</mi><mo>=</mo><msub><mi mathvariant=\"normal\">Q</mi><mn>1</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">Q</mi><mn>2</mn></msub></math><br /><math><mn>2</mn><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">T</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">T</mi></mrow></mfrac></math><br /><math><mtext>T</mtext><mo>=</mo><mfrac><mrow><msub><mrow><mtext>T</mtext></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mtext>T</mtext></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-07T14:00:00.000Z", "isVisible": true, "shortName": "2020 (07 Jan Shift 2)", "title": "JEE Main 2020 (07 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66c61", "previousYearP ], "question": {"text": "Two Carnot engines $\\mathrm{A}$ and $\\mathrm{B}$ are operated in series. Engine A receives heat from a reservoir at $600 \\mathrm{~K}$ and rejects heat to a reservoir at temperature T. Engine B receives heat rejected by engine A and in turn rejects it to a reservoir at $100 \\mathrm{~K}$. If the efficiencies of the two engines $\\mathrm{A}$ and $\\mathrm{B}$ are represented by $\\eta_A$ and $\\eta_B$ respectively, then what is the value of $\\frac{\\eta_{\\mathrm{A}}}{\\eta_{\\mathrm{B}}}$", "image": null}, "options": [{"id": "kfrb3", "text": "\n$\\frac{12}{7}$\n", "image": null, "isCorrect": false}, {"id": "yqoT6", "text": "\n$\\frac{12}{5}$\n", "image": null, "isCorrect": false}, {"id": "Dnvpa", "text": "\n$\\frac{5}{12}$\n", "image": null, "isCorrect": false}, {"id": "WZ2Os", "text": "\n$\\frac{7}{12}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Efficiency of engine $A, n_A=\\frac{T_1-T_2}{T_1}$ and $n_B=\\frac{T_2-T_3}{T_2} ; T_2=\\frac{T_1+T_3}{2}=350 \\mathrm{~K}$ or $\\frac{n_A}{n_B}=\\frac{\\frac{600-350}{600}}{\\frac{350-100}{350}}=\\frac{7}{12}$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 2 Online)", "title": "JEE Main 2018 (15 Apr Shift 2 Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d6631a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr)", "title": "JEE Main 2018 (15 Apr)"}], "question": {"text": "A Carnot&#39;s engine works like a refrigerator between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>250</
