n a thermodynamic process, its volume must increase.</p><p>In the light of the above statements, choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "UKtDz", "text": "Statement I is true but Statement II is false", "image": null, "isCorrect": false}, {"id": "rjVsY", "text": "Both Statement I and Statement II are false", "image": null, "isCorrect": false}, {"id": "4YGdo", "text": "Both Statement I and Statement II are true", "image": null, "isCorrect": false}, {"id": "pQYvS", "text": "Statement I is false but Statement II is true", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<blockquote><p>If heat energy is added to a thermodynamic system, one part increases the internal energy and the other part performs some work.</p><p>If heat is added to a system, the system can do work without changing its internal energy.&nbsp;Hence, statement 1 is false.</p><p>The formula to calculate the work done is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mo>&#8747;</mo><mi>P</mi><mi>d</mi><mi>V</mi></math></p><p>From the above equation, it can be concluded that if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>&#62;</mo><mn>0</mn></math>, i.e., work is done by the system, its volume must increase. Hence, statement II is true.</p></blockquote>", "image": null}, "videoSolution": null, "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T10:52:38.544Z"}, {"_id": "648b5a70417cc3fb48d68328", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 1)", "title": "JEE Main 2023 (06 Apr Shift 1)"}], "question": {"text": "<p>A source supplies heat to a system at the rate of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1000</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi><mo>.</mo></math> If the system performs work at a rate of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi><mo>.</mo></math> The rate at which internal energy of the system increases is</p>", "image": null}, "options": [{"id": "u29mK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi></math>", "image": null, "isCorrect": false}, {"id": "zETph", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>800</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi></math>", "image": null, "isCorrect": true}, {"id": "izLjK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi></math>", "image": null, "isCorrect": false}, {"id": "MM9xq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1200</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>According to the first law of thermodynamics,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mi>W</mi><mo>+</mo><mi>U</mi></math>.</p><p>Upon differentiation, we get&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>Q</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>d</mi><mi>W</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>d</mi><mi>U</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mfrac><mrow><mi>d</mi><mi>U</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>d</mi><mi>Q</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>d</mi><mi>W</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac></math></p><p>Given:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>Q</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mn>1000</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>W</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mn>200</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi></math></p><p>Therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>d</mi><mi>U</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mn>1000</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi><mo>-</mo><mn>200</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi><mo>=</mo><mn>800</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 1)", "title": "JEE Main 2023 (06 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68273", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b11", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 1)", "title": "JEE Main 2023 (31 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>The pressure of a gas changes linearly with volume from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;as shown in figure. If no heat is supplied to or extracted from the gas then change in the internal energy of the gas will be</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fa24b284-3656-46d6-b32d-f5188b3835dc-9895800_1.PNG\" style=\"width: 309px; height: 260px;\" /></p>", "image": null}, "options": [{"id": "2phgj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "tPQCM", "text": "Zero", "isCorrect": false, "image": null}, {"id": "G84uF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>4</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "8EIfw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Given here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>Q</mi><mo>=</mo><mn>0</mn></math></p><p>From first law of thermodynamics,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>Q</mi><mo>=</mo><mo>&#8710;</mo><mi>U</mi><mo>+</mo><mi>W</mi></math>, where,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi></math>&nbsp;is change in internal energy and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi></math>&nbsp;is work done.</p><p>We have,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mo>-</mo><mi>W</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mi>Area</mi><mo>&#160;</mo><mi>under</mi><mo>&#160;</mo><mi mathvariant=\"normal\">P</mi><mo>-</mo><mi mathvariant=\"normal\">V</mi><mo>&#160;</mo><mi>curve</mi><mo>=</mo><mo>&#8747;</mo><mi>P</mi><mi>d</mi><mi>V</mi></math></p><p>Here, volume decreases, hence work done by system will be negative.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mo>-</mo><mi>W</mi><mo>=</mo><mn>30</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#215;</mo><mn>150</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4500</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499871d196b49d9cd6b11", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 1)", "title": "JEE Main 2023 (31 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d681d0", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Heat is given to an ideal gas in an isothermal process.</p><p>A. Internal energy of the gas will decrease.</p><p>B. Internal energy of the gas will increase.</p><p>C. Internal energy of the gas will not change.</p><p>D. The gas will do positive work.</p><p>E. The gas will do negative work.</p><p>Choose the correct answer from the options given below :</p>", "image": null}, "options": [{"id": "XqR6R", "text": "A and E only", "isCorrect": false, "image": null}, {"id": "1ThXw", "text": "B and D only", "isCorrect": false, "image": null}, {"id": "LonRk", "text": "C and E only", "isCorrect": false, "image": null}, {"id": "3AG7u", "text": "C and D only", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>From the first law of thermodynamics, heat supplied to the system&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>, change in internal energy of the system&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi></math>&nbsp;and work done by the system&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi></math>&nbsp;are related as:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mo>&#8710;</mo><mi>U</mi><mo>+</mo><mi>W</mi></math></p><p>Since the process is isothermal, the temperature of the system is constant and therefore&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mn>0</mn></math>&nbsp;(i.e., internal energy is constant).&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>Q</mi><mo>=</mo><mi>W</mi></math></p><p>As heat is supplied to the system,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math>&nbsp;is positive and therefore<strong>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi></math></strong>&nbsp;is positive<strong>&nbsp;</strong>i.e., gas will do positive work.</p><p>Hence, correct options are C and D.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["MULTI_STATEMENT"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6810c", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Given below are two statements. One is labelled as <strong>Assertion A</strong> and the other is labelled as <strong>Reason R</strong>.</p><p><strong>Assertion A :</strong> If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mi>Q</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mi>W</mi></math> represent the heat supplied to the system and the work done on the system respectively. Then according to the first law of thermodynamics <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mi>Q</mi><mo>=</mo><mi>d</mi><mi>U</mi><mo>-</mo><mi>d</mi><mi>W</mi></math>.</p><p><strong>Reason R :</strong> First law of thermodynamics is based on law of conservation of energy.</p><p>In the light of the above statements, choose the correct answer from the option given below :</p>", "image": null}, "options": [{"id": "P5UDP", "text": "A is correct but R is not correct", "isCorrect": false, "image": null}, {"id": "S83fe", "text": "A is not correct but R is correct", "isCorrect": false, "image": null}, {"id": "zxqxm", "text": "Both A and R are correct and R is the correct explanation of A", "isCorrect": true, "image": null}, {"id": "IPOCR", "text": "Both A and R are correct but R is not the correct explanation of A", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The first law of thermodynamics is stated as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mi>Q</mi><mo>=</mo><mi>d</mi><mi>U</mi><mo>-</mo><mi>d</mi><mi>W</mi></math>. Since&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mi>Q</mi></math>&nbsp;is heat supplied to&nbsp;the system and positive thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mi>W</mi></math>&nbsp;is work done on the system, i.e., negative&nbsp;work.</p><p>We know that&nbsp;the first law of thermodynamics deals with work done, and heat energy supplied or removed from a system. Therefore, it is based on the conservation of energy. The&nbsp; law states that energy cannot be created or destroyed; it can only be converted from one form to another.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["ASSERTION_REASON"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67fb0", "previousYearPapers": [{"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)", "title": "JEE Main 2023 (24 Jan Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> of a liquid is converted to vapour at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi>Pa</mi></math> pressure. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>%</mo></math> of the heat supplied is used for increasing the volume by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1600</mn><mo>&#160;</mo><msup><mi>cm</mi><mn>3</mn></msup></math>&nbsp;during this phase change, then the increase in internal energy in the process will be :", "image": null}, "options": [{"id": "nyH7y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4320</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": true, "image": null}, {"id": "hC0Di", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>432000</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "MSS2x", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4800</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "7Yrir", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>32</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>As pressure against which expansion is happening is constant, work done can be written as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi mathvariant=\"normal\">P</mi><mi>&#916;</mi><mi mathvariant=\"normal\">V</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfenced><mrow><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup></mrow></mfenced><mo>&#215;</mo><mfenced><mrow><mn>1600</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>480</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><br />As only <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>%</mo></math> of heat is used in work done.<br />Hence <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>Q</mi><mo>=</mo><mfrac><mi>W</mi><mrow><mn>0</mn><mo>.</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mn>4800</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math><br />The rest goes in increase in internal energy, which is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90</mn><mo>%</mo></math> of heat.<br />Change in internal energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>.</mo><mn>9</mn><mo>&#215;</mo><mn>4800</mn><mo>=</mo><mn>4320</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)", "title": "JEE Main 2023 (24 Jan Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T11:13:34.220Z"}, {"_id": "648b5a6d417cc3fb48d67bcb", "previousYearPapers": [{"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>For a perfect gas, two pressures <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub></math> are shown in figure. The graph shows</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/81730a84-d2b5-488f-8df0-7095da14b460-image.png\" style=\"width: 200px; height: 195px;\" /></p>", "image": null}, "options": [{"id": "yTPxk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>P</mi><mn>2</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "ERp6A", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><mo>&#60;</mo><msub><mi>P</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "yXQVb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><mo>=</mo><msub><mi>P</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "04gTI", "text": "Insufficient data to draw any conclusion", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>We know that the ideal gas equation of gas is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>T</mi></math></p><p>Keeping the temperature constant, we have,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>&#8733;</mo><mfrac><mn>1</mn><mi>P</mi></mfrac></math></p><p>As seen from graph,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>V</mi><mn>1</mn></msub></math>, so&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><mo>&#62;</mo><msub><mi>P</mi><mn>2</mn></msub></math>.</p>", "image": null}, "videoSolution": {"videoId": "def6ef5ad0464901be10df72390ba6a3", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/84CKd73OBhAZT.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/84CKd73OBhAZT.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67a0b", "previousYearPapers": [{"_id": "62c481f001514d218a7934d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 1)", "title": "JEE Main 2022 (26 Jun Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A thermally insulated vessel contains an ideal gas of molecular mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>&nbsp;and ratio of specific heats <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>4</mn></math>. Vessel is moving with speed <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>v</mi></math> and is suddenly brought to rest. Assuming no heat is lost to the surrounding and vessel temperature of the gas increases by :<br />(<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo></math>&nbsp;universal gas constant)", "image": null}, "options": [{"id": "zUZDu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>M</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>7</mn><mi>R</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "6tCgf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>M</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "GDpd7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mfrac><mrow><mi>M</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>7</mn><mi>R</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "2par8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mfrac><mrow><mi>M</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "KE of the vessel <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>v</mi><mn>2</mn></msup></math><br /><br />When the vessel is suddenly stopped, the ordered motion of the gas molecules is converted into disordered motion of the molecules increasing thereby the internal energy of the gas. Thus,<br /><br /><math><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mi>n</mi><msub><mrow><mi>C</mi></mrow><mrow><mi>v</mi></mrow></msub><mo>&#8710;</mo><mi>T</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi>m</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mi>n</mi><mi>M</mi></mrow></mfenced><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><br />Where <math><mi>n</mi></math> is number of moles of the gas in the vessel and <math><mi>M</mi></math> is molecular weight of the gas.<br /><br /><math><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mo>&#8710;</mo><mi>T</mi><mo>=</mo><mfrac><mrow><mi>M</mi><msup><mrow><mi>v</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><msub><mrow><mi>C</mi></mrow><mrow><mi>v</mi></mrow></msub></mrow></mfrac></math><br /><br />As <math><msub><mrow><mi>C</mi></mrow><mrow><mi>v</mi></mrow></msub><mo>=</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mi mathvariant=\"normal\">&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#160;</mi><mi>&#160;</mi><mo>&#8710;</mo><mi>T</mi><mo>=</mo><mfrac><mrow><mi>M</mi><msup><mi>v</mi><mn>2</mn></msup><mo>(</mo><mi mathvariant=\"normal\">&#947;</mi><mo>-</mo><mn>1</mn><mo>)</mo></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>M</mi><msup><mi>v</mi><mn>2</mn></msup><mo>(</mo><mn>1</mn><mo>.</mo><mn>4</mn><mo>-</mo><mn>1</mn><mo>)</mo></mrow><mrow><mn>2</mn><mi>R</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>M</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><mrow><mn>5</mn><mi>R</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 1)", "title": "JEE Main 2022 (26 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d673b5", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 1)", "title": "JEE Main 2021 (26 Aug Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "An electric appliance supplies <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6000</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>min</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, heat to the system. If the system delivers a power of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90</mn><mo>&#160;</mo><mi mathvariant=\"normal\">W</mi></math>. How long it would take to increase the internal energy by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>?", "image": null}, "options": [{"id": "B8Mq9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>1</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>", "isCorrect": false, "image": null}, {"id": "fpWtv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>2</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>", "isCorrect": true, "image": null}, {"id": "9q4v5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>4</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>", "isCorrect": false, "image": null}, {"id": "bRHBG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mn>1</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/32ecd1d9-ea4e-42e6-ab78-8ade9bf117ff-image.png\" style=\"width: 300px; height: 183px;\" /></p><p>Recall the formula of the first law of thermodynamics in terms of change in internal energy and work done by the system,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>U</mi><mo>=</mo><mi>Q</mi><mo>-</mo><mi>W</mi></math>, given,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>U</mi><mo>=</mo><mn>2500</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mfrac><mn>6000</mn><mn>60</mn></mfrac><mo>&#215;</mo><mi>t</mi><mo>=</mo><mfenced><mrow><mn>100</mn><mi>t</mi><mo>&#160;</mo></mrow></mfenced><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mi>P</mi><mo>&#215;</mo><mi>t</mi><mo>=</mo><mn>90</mn><mi>t</mi></math>,&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2500</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>=</mo><mn>100</mn><mi>t</mi><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>-</mo><mn>90</mn><mi>t</mi><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>t</mi><mo>=</mo><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>2</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">s</mi></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 1)", "title": "JEE Main 2021 (26 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d670f9", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf815", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Jul Shift 2)", "title": "JEE Main 2021 (20 Jul Shift 2)"}], "type": "numerical", "level": 1, "question": {"text": "<p>One mole of an ideal gas at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> is taken from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> as shown in the given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi></math> indicator diagram. The work done by the system will be _______&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>.</mo></math>&nbsp;[Given,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>8</mn><mo>.</mo><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>mole</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>,</mo><mo>&#160;</mo><mi>ln</mi><mn>2</mn><mo>=</mo><mn>0</mn><mo>.</mo><mn>6931</mn></math>] (Round off to the nearest integer)</p><p>(Round off to the nearest integer)</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ed0a09f8-b185-4bbb-965c-cf5ebc80fb78-image.png\" style=\"width: 300px; height: 230px;\" /></p>", "image": null}, "options": [], "correctValue": "17258", "solution": {"text": "<p>Process of isothermal</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>T</mi><mi>&#8467;</mi><mi>n</mi><mfenced><mfrac><msub><mi>V</mi><mn>2</mn></msub><msub><mrow><mo>&#160;</mo><mi>V</mi></mrow><mn>1</mn></msub></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>&#215;</mo><mn>8</mn><mo>.</mo><mn>3</mn><mo>&#215;</mo><mn>300</mn><mo>&#215;</mo><mi>ln</mi><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>17258</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p>", "image": null}, "videoSolution": {"videoId": "58f89856b0c5426581074ad229e66e34", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/LsvCefSM8mVkk.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/LsvCefSM8mVkk.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92edde3d91842a5cf815", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Jul Shift 2)", "title": "JEE Main 2021 (20 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d6708c", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf814", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Jul Shift 1)", "title": "JEE Main 2021 (20 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The amount of heat needed to raise the temperature of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi>moles</mi></math> of a rigid diatomic gas from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> when no work is done is<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mo>(</mo><mi>R</mi></math> is the universal gas constant)", "image": null}, "options": [{"id": "hWS9K", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>250</mn><mi>R</mi></math>", "isCorrect": false, "image": null}, {"id": "RXIGy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>750</mn><mi>R</mi></math>", "isCorrect": false, "image": null}, {"id": "tL5aC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>175</mn><mi>R</mi></math>", "isCorrect": false, "image": null}, {"id": "eWV7W", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mi>R</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<div><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>Q</mi><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><mi>U</mi><mo>+</mo><mi mathvariant=\"normal\">&#916;</mi><mi>W</mi></math></div><div>Here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>W</mi><mo>=</mo><mn>0</mn></math></div><div><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>Q</mi><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><mi>U</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>V</mi></msub><mi mathvariant=\"normal\">&#916;</mi><mi>T</mi></math></div><div><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>Q</mi><mo>=</mo><mn>4</mn><mo>&#215;</mo><mfrac><mrow><mn>5</mn><mi>R</mi></mrow><mn>2</mn></mfrac><mo>(</mo><mn>50</mn><mo>)</mo><mo>=</mo><mn>500</mn><mi>R</mi></math></div><div>Hence option <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>4</mn><mo>)</mo><mo>.</mo></math></div>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf814", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Jul Shift 1)", "title": "JEE Main 2021 (20 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66e72", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-16T09:00:00.000Z", "isVisible": true, "shortName": "2021 (16 Mar Shift 1)", "title": "JEE Main 2021 (16 Mar Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "In thermodynamics, heat and work are :", "image": null}, "options": [{"id": "t9kTJ", "text": "Path functions", "isCorrect": true, "image": null}, {"id": "NNB7j", "text": "Intensive thermodynamic state variables", "isCorrect": false, "image": null}, {"id": "aw6PB", "text": "Extensive thermodynamic state variables", "isCorrect": false, "image": null}, {"id": "bVX8g", "text": "Point functions", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Heat and work are treated as path functions in thermodynamics.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>Q</mi><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><mi>U</mi><mo>+</mo><mi mathvariant=\"normal\">&#916;</mi><mi>W</mi></math></p><p>Since work done by gas depends on type of process i.e. path and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>U</mi></math>&nbsp;depends just on initial and final states, so <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>Q</mi></math> i.e. heat, also has to depend on process is path.</p>", "image": null}, "videoSolution": {"videoId": "6434c47e9703448fa7e262 t ]", "image": null}, "options": [], "correctValue": "60", "solution": {"text": "<p>We know that work done is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mo>&#8747;</mo><mi>P</mi><mi>d</mi><mi>V</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mo>=</mo><mfrac><mrow><mi>n</mi><mi>R</mi><mi>T</mi></mrow><mi>V</mi></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>W</mi><mo>=</mo><mo>&#8747;</mo><mfrac><mrow><mi>n</mi><mi>R</mi><mi>T</mi></mrow><mi>V</mi></mfrac><mi>d</mi><mi>v</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>3</mn></mfenced></math></p><p>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi><mo>=</mo><mi>K</mi><msup><mi>T</mi><mrow><mn>2</mn><mo>/</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>4</mn></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>W</mi><mo>=</mo><mo>&#8747;</mo><mfrac><mrow><mi>n</mi><mi>R</mi><mi>T</mi></mrow><mrow><mi>K</mi><msup><mi>T</mi><mrow><mn>2</mn><mo>/</mo><mn>3</mn></mrow></msup></mrow></mfrac><mo>&#183;</mo><mi>d</mi><mi>v</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>5</mn></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math> from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>4</mn></mfenced><mo>&#160;</mo><mo>:</mo><mo>&#160;< /mi><msup><mi>V</mi><mn>3</mn></msup><mi>d</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>d</mi><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>P</mi><mi>d</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>d</mi><mi>T</mi><mo>/</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> Work <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#8747;</mo><mi>P</mi><mi>d</mi><mi>V</mi><mo>=</mo><mo>&#8747;</mo><mfrac><mrow><mi>n</mi><mi>R</mi><mi>d</mi><mi>T</mi></mrow><mn>4</mn></mfrac><mo>=</mo><mfrac><mrow><mi>n</mi><mi>R</mi></mrow><mn>4</mn></mfrac><mi>&#916;</mi><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>200</mn><mn>4</mn></mfrac><mo>&#215;</mo><mi>n</mi><mi>R</mi><mo>=</mo><mn>50</mn><mi>n</mi><mi>R</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf80a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 1)", "title": "JEE Main 2021 (25 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d671fd", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf809", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Feb Shift 2)", "title": "JEE Main 2021 (24 Feb Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>If one mole of an ideal gas at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><msub><mi>V</mi><mn>1</mn></msub></mrow></mfenced></math> is allowed to expand reversibly and isothermally (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>) its pressure is reduced to one-half of the original pressure (see figure). This is followed by a constant volume cooling till its pressure is reduced to one-fourth of the initial value <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>B</mi><mo>&#8594;</mo><mi>C</mi></mrow></mfenced><mo>.</mo></math>&nbsp;Then it is restored to its initial state by a reversible adiabatic compression (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>). The net workdone by the gas is equal to:</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/bb1ac53f-4e50-4654-bd79-095a8834618a-image.png\" style=\"width: 300px; height: 237px;\" /></p>", "image": null}, "options": [{"id": "dphLY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "fDdTQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mi>T</mi><mi>ln</mi><mfenced><mn>2</mn></mfenced></math>", "isCorrect": false, "image": null}, {"id": "0JVYF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mrow><mi>R</mi><mi>T</mi></mrow><mrow><mn>2</mn><mfenced><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "RKIoz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo mathvariant=\"italic\">RT</mo><mfenced open=\"[\" close=\"]\"><mrow><mi>ln</mi><mfenced><mn>2</mn></mfenced><mo>-</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mfenced><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow></mfrac></mrow></mfenced></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>-</mo><mi>B</mi><mo>=</mo></math> isothermal process</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>A</mi><mi>B</mi></mrow></msub><mo>=</mo><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub><mo>&#160;</mo><mi>ln</mi><mfenced open=\"[\" close=\"]\"><mfrac><mrow><mn>2</mn><msub><mi>V</mi><mn>1</mn></msub></mrow><mrow><mo>&#160;</mo><msub><mi>V</mi><mn>1</mn></msub></mrow></mfrac></mfenced><mo>=</mo><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub><mi>ln</mi><mfenced><mn>2</mn></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo mathvariant=\"italic\">-</mo><mi>C</mi><mo>&#8594;</mo></math> Isochoric process</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>B</mi><mi>C</mi></mrow></msub><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>-</mo><mi>A</mi><mo>&#8594;</mo></math>Adiabatic process</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>C</mi><mi>A</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub><mo>-</mo><mfrac><msub><mi>P</mi><mn>1</mn></msub><mn>4</mn></mfrac><mo>&#215;</mo><mn>2</mn><msub><mi>V</mi><mn>1</mn></msub></mrow><mrow><mn>1</mn><mo>-</mo><mi>&#947;</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub><mfenced open=\"[\" close=\"]\"><mrow><mn>1</mn><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced></mrow><mrow><mn>1</mn><mo>-</mo><mi>&#947;</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mrow><mrow><mn>2</mn><mfenced><mrow><mn>1</mn><mo>-</mo><mi>&#947;</mi></mrow></mfenced></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mi>net</mi></msub><mo>=</mo><msub><mi>W</mi><mrow><mi>A</mi><mi>B</mi></mrow></msub><mo>+</mo><msub><mi>W</mi><mrow><mi>B</mi><mi>C</mi></mrow></msub><mo>+</mo><msub><mi>W</mi><mrow><mi>C</mi><mi>A</mi></mrow></msub><mo>&#160;&#160;</mo><mfenced open=\"{\" close=\"}\"><mrow><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub><mo>=</mo><mi>R</mi><mi>T</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub><mo>&#160;</mo><mi>ln</mi><mfenced><mn>2</mn></mfenced><mo>+</mo><mn>0</mn><mo>+</mo><mfrac><mrow><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mrow><mrow><mn>2</mn><mfenced><mrow><mn>1</mn><mo>-</mo><mi>&#947;</mi></mrow></mfenced></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mi>net</mi></msub><mo>=</mo><mi>R</mi><mi>T</mi><mo>&#160;</mo><mfenced open=\"[\" close=\"]\"><mrow><mi>ln</mi><mfenced><mn>2</mn></mfenced><mo>-</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mfenced><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow></mfrac></mrow></mfenced></math></p>", "image": null}, "videoSolution": {"videoId": "a9640cac82324649b7eb7bc12aaab000", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Ks5kT7vjqFeb7.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Ks5kT7vjqFeb7.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92edde3d91842a5cf809", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Feb Shift 2)", "title": "JEE Main 2021 (24 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66b2d", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf804", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-05T09:00:00.000Z", "isVisible": true, "shortName": "2020 (05 Sep Shift 1)", "title": "JEE Main 2020 (05 Sep Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Three different processes that can occur in an ideal monoatomic gas are shown in the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;vs <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math> diagram. The paths are labelled as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#8594;</mo><mi>B</mi><mo>,</mo><mi>A</mi><mo>&#8594;</mo><mi>C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#8594;</mo><mi>D</mi></math>. The change in internal energies during these process are taken as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mrow><mi>A</mi><mi>B</mi></mrow></msub><mo>,</mo><msub><mi>E</mi><mrow><mi>A</mi><mi>C</mi></mrow></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mrow><mi>A</mi><mi>D</mi></mrow></msub></math> and the work done as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>A</mi><mi>B</mi></mrow></msub><mo>,</mo><msub><mi>W</mi><mrow><mi>A</mi><mi>C</mi></mrow></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>A</mi><mi>D</mi></mrow></msub></math>. The correct relation between these parameters are:</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a8db4286-4507-419f-ae2f-86ed6c78a9e5-image.png\" style=\"width: 272px; height: 246px;\" /></p>", "image": null}, "options": [{"id": "zCZQU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mrow><mi mathvariant=\"italic\">A</mi><mi mathvariant=\"italic\">B</mi></mrow></msub><mo>=</mo><msub><mi>E</mi><mrow><mi mathvariant=\"italic\">A</mi><mi mathvariant=\"italic\">C</mi></mrow></msub><mo>&#60;</mo><msub><mi>E</m MathML\"><msub><mi>E</mi><mrow><mi mathvariant=\"italic\">A</mi><mi mathvariant=\"italic\">B</mi></mrow></msub><mo>&#62;</mo><msub><mi>E</mi><mrow><mi mathvariant=\"italic\">A</mi><mi mathvariant=\"italic\">C</mi></mrow></msub><mo>&#62;</mo><msub><mi>E</mi><mrow><mi mathvariant=\"italic\">A</mi><mi mathvariant=\"italic\">D</mi></mrow></msub><mo>,</mo><msub><mi>W</mi><mrow><mi mathvariant=\"italic\">A</mi><mi mathvariant=\"italic\">B</mi></mrow></msub><mo>&#60;</mo><msub><mi>W</mi><mrow><mi mathvariant=\"italic\">A</mi><mi mathvariant=\"italic\">C</mi></mrow></msub><mo>&#60;</mo><msub><mi>W</mi><mrow><mi mathvariant=\"italic\">A</mi><mi mathvariant=\"italic\">D</mi></mrow></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>E</mi><mrow><mi>A</mi><mi>B</mi></mrow></msub><mo>=</mo><msub><mi>E</mi><mrow><mi>A</mi><mi>C</mi></mrow></msub><mo>=</mo><msub><mi>E</mi><mrow><mi>A</mi><mi>D</mi></mrow></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">d</mi><mi>U</mi><mo>=</mo><mfrac><mrow><mi>n</mi><mi>f</mi><mi>R</mi></mrow><mn>2</mn></mfrac><mfenced><mrow><mo>&#160;</mo><msub><mi>T</mi><mi>f</mi></msub><mo>-</mo><msub><mi>T</mi><mi>i</mi></msub></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>A</mi><mi>B</mi></mrow></msub><mo>&#62;</mo><mn>0</mn><mo>(</mo><mo>+</mo><mo>)</mo><mo>&#160;</mo><mtext>as</mtext><mo>&#160;</mo><mi>V</mi><mo>&#8593;</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>A</mi><mi>C</mi></mrow></msub><mo>=</mo><mn>0</mn><mo>&#160;</mo><mtext>as</mtext><mo>&#160;</mo><mi>V</mi><mo>=</mo><mtext>constant</mtext></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>A</mi><mi>D</mi></mrow></msub><mo>&#60;</mo><mn>0</mn><mo>(</mo><mo>-</mo><mo>)</mo><mo>&#160;</mo><m thvariant=\"normal\">&#160;</mi><mo>&#8710;</mo><msub><mi mathvariant=\"normal\">U</mi><mi>A</mi></msub><mo>=</mo><mo>&#8710;</mo><msub><mi mathvariant=\"normal\">U</mi><mi>B</mi></msub></math> as change in internal energy depends on initial and final state and not the path.<br /><math><mo>&#8658;</mo></math> By comparing area under the curve,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">W</mi><msub><mrow/><mi>A</mi></msub></msub><mo>&#62;</mo><msub><mi mathvariant=\"normal\">W</mi><msub><mrow/><mi>B</mi></msub></msub></math><br />From <math><mi mathvariant=\"normal\">Q</mi><mo>=</mo><mi mathvariant=\"normal\">U</mi><mo>+</mo><mi mathvariant=\"normal\">W</mi></math><br />We can say, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">Q</mi><msub><mi mathvariant=\"normal\">P</mi><mi>A</mi></msub></msub><mo>&#62;</mo><msub><mi mathvariant=\"normal\">Q</mi><msub><mi mathvariant=\"normal\">P</mi><mi>B</mi></msub></msub></math>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ecde3d91842a5cf7f2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 1)", "title": "JEE Main 2019 (09 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65b5c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}], "question": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/96ec7011-da81-4760-9a44-0b5df4976d69-image.png\" style=\"width: 270px; height: 220px;\" /><br />The above&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>-</mo><mi>V</mi></math> diagram represents the thermodynamic cycle of an engine, operating with an ideal mono-atomic gas. The amount of heat, extracted from the source in a single cycle, is:", "image": null}, "options": [{"id": "eIHT0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mfrac><mrow><mn>1</mn><mn>1</mn></mrow><mn>2</mn></mfrac></mfenced><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "Q1yv6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "8rIZQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "EGTg6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mfrac><mrow><mn>1</mn><mn>3</mn></mrow><mn>2</mn></mfrac></mfenced><msub><mi>P</mi><mn>0</mn></msub><msub><mi>V</mi><mn>0</mn></msub></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The heat is extracted from the source during the process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>&#8594;</mo><mi mathvariant=\"normal\">B</mi><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi><mo>&#8594;</mo><mi mathvariant=\"normal\">C</mi></math></p><p><math><msub><mrow><mfenced separators=\"|\"><mrow><mo>&#8710;</mo><mi>Q</mi></mrow></mfenced></mrow><mrow><mi>A</mi><mi>B</mi></mrow></msub><mo>+</mo><msub><mrow><mfenced separators=\"|\"><mrow><mo>&#8710;</mo><mi>Q</mi></mrow></mfenced></mrow><mrow><mi>B</mi><mi>C</mi></mrow></msub></math><br /><br /><math> <mrow> <mo>=</mo><mi>n</mi><msub> <mi>C</mi> <mi>v</mi> </msub> <mi>d</mi><mi>T</mi><mo>+</mo><mi>n</mi><msub> <mi>C</mi> <mi>p</mi> </msub> <mi>d</mi><mi>T</mi></mrow> <mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msub><mrow><mi>P</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mn>2</mn><msub><mrow><mi>P</mi></mrow><mrow><mn>0</mn></mrow></msub><msub><mrow><mi>V</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br /><br /><math> <mrow> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> <mn>3</mn> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <msub> <mtext>P</mtext> <mn>0</mn> </msub> <msub> <mtext>V</mtext> <mn>0</mn> </msub> </mrow> </math></p>", "image": null}, "videoSolution": null, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6563d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "Which of the following is incorrect regarding the first law of thermodynamics?", "image": null}, "options": [{"id": "9Bz0o", "text": "\nIt is applicable to any cyclic process\n", "image": null, "isCorrect": false}, {"id": "ivERz", "text": "\nIt is a restatement of the principle of conservation of energy\n", "image": null, "isCorrect": false}, {"id": "DGeFo", "text": "\nIt introduces the concept of the internal energy\n", "image": null, "isCorrect": false}, {"id": "Ad8JH", "text": "\nIt introduces the concept of the entropy", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The first law of thermodynamics states the principle of conservation of energy. It introduces the concept of internal energy. And it is applicable for any cycle.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "648b5a73417cc3fb48d69196", "title": "Thermodynamic Processes", "totalQuestions": 127, "questions": [{"_id": "69d8073f81239f6567c4f384", "type": "singleCorrect", "question": {"text": "A cylinder with adiabatic walls is closed at both ends and is divided into two compartments by a frictionless adiabatic piston. Ideal gas is filled in both (left and right) the compartments at same $P, V, T$. Heating is started from left side until pressure changes to $\\dfrac{27P}{8}$. If initial volume of each compartment was $9$ litres then the final volume in right-hand side compartment is __________ litres. (for this ideal gas $C_P/C_V = 1.5$)", "image": null}, "options": [{"id": "NF4kj", "text": "$3$", "isCorrect": false, "image": null}, {"id": "JfI7J", "text": "$4$", "isCorrect": true, "image": null}, {"id": "rxNhF", "text": "$14$", "isCorrect": false, "image": null}, {"id": "XgIt7", "text": "$9$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The right compartment is enclosed by adiabatic walls and an adiabatic piston, and no heat is supplied to it. Therefore, the gas in the right compartment undergoes an adiabatic compression.<br><br>Since the piston is frictionless, the pressure in the right compartment is always equal to the pressure in the left compartment. The final pressure in both compartments is $P_f = \\dfrac{27P}{8}$.<br><br>For the adiabatic process in the right compartment, the equation is:<br>$P_i V_i^\\gamma = P_f V_f^\\gamma$<br><br>Given $P_i = P$, $V_i = 9$ L, $P_f = \\dfrac{27P}{8}$, and $\\gamma = \\dfrac{C_P}{C_V} = 1.5 = \\dfrac{3}{2}$. Substituting these values:<br>$P(9)^{3/2} = \\left(\\dfrac{27P}{8}\\right) V_f^{3/2}$<br><br>Since $9^{3/2} = (3^2)^{3/2} = 3^3 = 27$, the equation becomes:<br>$27P = \\dfrac{27P}{8} V_f^{3/2}$<br><br>Dividing both sides by $27P$:<br>$1 = \\dfrac{1}{8} V_f^{3/2}$<br><br>$V_f^{3/2} = 8$<br><br>Taking the power of $2/3$ on both sides:<br>$V_f = (8)^{2/3} = (2^3)^{2/3} = 2^2 = 4$ litres.<br><br>Answer: $4$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "fe0539ab89f74ac8939febaaf8b9f9ae", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/fOKosfbo7xZ9f.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/fOKosfbo7xZ9f.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8074e81239f6567c4f42e", "type": "numerical", "question": {"text": "A certain gas is isothermally compressed to $\\left(\\dfrac{1}{3}\\right)^{rd}$ of its initial volume ($V_o = 3$ litre) by applying required pressure. If the bulk modulus of the gas is $3 \\times 10^5$ N/m$^2$, the magnitude of work done on the gas is _______ J.", "image": null}, "options": [], "correctValue": "989", "solution": {"text": "For an isothermal process, the isothermal bulk modulus equals the gas pressure:<br>$B_T = -V\\dfrac{dP}{dV}$<br><br>Since $PV = \\text{constant}$, differentiating gives $P\\,dV + V\\,dP = 0$, so $\\dfrac{dP}{dV} = -\\dfrac{P}{V}$, which yields $B_T = P$.<br><br>Therefore, the initial pressure is:<br>$P_o = 3 \\times 10^5\\text{ N/m}^2$<br><br>Volumes:<br>$V_o = 3\\text{ L} = 3 \\times 10^{-3}\\text{ m}^3$<br>$V_f = \\dfrac{1}{3}V_o = 10^{-3}\\text{ m}^3$<br><br>Work done on the gas during an isothermal compression:<br>$W_{\\text{on}} = -W_{\\text{by}} = -P_o V_o \\ln\\left(\\dfrac{V_f}{V_o}\\right) = P_o V_o \\ln\\left(\\dfrac{V_o}{V_f}\\right)$<br><br>$W_{\\text{on}} = (3 \\times 10^5)(3 \\times 10^{-3})\\ln 3$<br><br>$W_{\\text{on}} = 900 \\ln 3\\text{ J}$<br><br>Using $\\ln 3 \\approx 1.0986$:<br>$W_{\\text{on}} \\approx 900 \\times 1.0986 \\approx 988.74\\text{ J}$<br><br>Rounded to the nearest integer:<br>$W_{\\text{on}} \\approx 989\\text{ J}$<br><br>Hence, the work done on the gas is approximately $989\\text{ J}$.", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "7669991a47524322b231ee426bb208f7", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/gB9MTb4ES3OCQ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/gB9MTb4ES3OCQ.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8074c81239f6567c4f41f", "type": "singleCorrect", "question": {"text": "Two closed vessels of same volume are joined through a narrow tube and both vessels are filled with air of pressure $90$ kPa and temperature $400$ K. Keeping the temperature of one vessel constant at $400$ K the second vessel temperature is raised to $500$ K. The final pressure in the vessels is _______ kPa.", "image": null}, "options": [{"id": "UXYWh", "text": "$100$", "isCorrect": true, "image": null}, {"id": "qbHCT", "text": "$120$", "isCorrect": false, "image": null}, {"id": "37H60", "text": "$90$", "isCorrect": false, "image": null}, {"id": "YqPXS", "text": "$105$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the volume of each vessel be $V$.<br><br>Initially, both vessels are at pressure $P_1 = 90$ kPa and temperature $T_1 = 400$ K.<br><br>Total number of moles initially is given by:<br><br>$n_i = \\dfrac{P_1 V}{R T_1} + \\dfrac{P_1 V}{R T_1} = \\dfrac{2 P_1 V}{R T_1}$<br><br>Finally, the temperature of the first vessel is $T_1 = 400$ K and the second vessel is $T_2 = 500$ K. Let the final pressure be $P_f$.<br><br>Total number of moles finally is given by:<br><br>$n_f = \\dfrac{P_f V}{R T_1} + \\dfrac{P_f V}{R T_2}$<br><br>Since the total number of moles remains constant, $n_i = n_f$:<br><br>$\\dfrac{2 P_1 V}{R T_1} = \\dfrac{P_f V}{R T_1} + \\dfrac{P_f V}{R T_2}$<br><br>Substituting the given values:<br><br>$\\dfrac{2 \\times 90}{400} = \\dfrac{P_f}{400} + \\dfrac{P_f}{500}$<br><br>$\\dfrac{180}{400} = P_f \\left( \\dfrac{1}{400} + \\dfrac{1}{500} \\right)$<br><br>$\\dfrac{180}{400} = P_f \\left( \\dfrac{5 + 4}{2000} \\right)$<br><br>$\\dfrac{180}{400} = P_f \\left( \\dfrac{9}{2000} \\right)$<br><br>$P_f = \\dfrac{180 \\times 2000}{400 \\times 9}$<br><br>$P_f = 20 \\times 5 = 100$ kPa<br><br>Answer: $100$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "a23e336d1edd4900894a8b965f142cae", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/PiHPMKB51jmLQ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/PiHPMKB51jmLQ.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8076081239f6567c4f4ff", "type": "singleCorrect", "question": {"text": "An ideal gas at pressure $P$ and temperature $T$ is expanding such that $PT^3 = $ constant. The coefficient of volume expansion of the gas is _______.", "image": null}, "options": [{"id": "6XRH2", "text": "$\\dfrac{2}{T}$", "isCorrect": false, "image": null}, {"id": "tENd6", "text": "$\\dfrac{1}{T}$", "isCorrect": false, "image": null}, {"id": "uno76", "text": "$\\dfrac{4}{T}$", "isCorrect": true, "image": null}, {"id": "BoDBE", "text": "$\\dfrac{3}{T}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given the process equation for the ideal gas:<br><br>$PT^3 = \\text{constant}$<br><br>From the ideal gas equation, $PV = nRT$, which gives $P = \\dfrac{nRT}{V}$.<br><br>Substituting $P$ into the process equation:<br><br>$\\left(\\dfrac{nRT}{V}\\right) T^3 = \\text{constant}$<br><br>$\\dfrac{T^4}{V} = \\text{constant}$<br><br>$V = k T^4$<br><br>Differentiating both sides with respect to temperature $T$:<br><br>$\\dfrac{dV}{dT} = 4k T^3$<br><br>The coefficient of volume expansion $\\gamma$ is defined as:<br><br>$\\gamma = \\dfrac{1}{V} \\dfrac{dV}{dT}$<br><br>Substituting the values of $V$ and $\\dfrac{dV}{dT}$:<br><br>$\\gamma = \\dfrac{1}{k T^4} (4k T^3) = \\dfrac{4}{T}$<br><br>Answer: $\\dfrac{4}{T}$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "9468c3573d6f4e0c98e852f077a6b6cd", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/1vdrbhcQZpoZQ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/1vdrbhcQZpoZQ.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8075381239f6567c4f46b", "type": "singleCorrect", "question": {"text": "An ideal gas undergoes a process maintaining relation between pressure $(P)$ and volume $(V)$ as $P = P_o\\left(1 + \\left(\\dfrac{V_o}{V}\\right)^2\\right)^{-1}$, where $P_o$ and $V_o$ are constants. If two samples $A$ and $B$ (two moles each) with initial volumes $V_o$ and $3V_o$ respectively undergo above mentioned process and attain same pressure, then the difference at the temperatures of these samples, $T_B - T_A$ is _____. ($R = $ gas constant)", "image": null}, "options": [{"id": "K6H3Y", "text": "$\\dfrac{9P_o V_o}{8R}$", "isCorrect": false, "image": null}, {"id": "AiAIt", "text": "$\\dfrac{11P_o V_o}{10R}$", "isCorrect": true, "image": null}, {"id": "kLb6j", "text": "$\\dfrac{7P_o V_o}{6R}$", "isCorrect": false, "image": null}, {"id": "JKmPx", "text": "$\\dfrac{13P_o V_o}{11R}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given relation between pressure and volume is:<br><br>$P = P_o\\left(1 + \\left(\\dfrac{V_o}{V}\\right)^2\\right)^{-1}$<br><br>For sample A, the initial volume is $V_A = V_o$. Substituting this into the given relation, the initial pressure $P_A$ is:<br><br>$P_A = P_o\\left(1 + \\left(\\dfrac{V_o}{V_o}\\right)^2\\right)^{-1} = \\dfrac{P_o}{2}$<br><br>Using the ideal gas equation $PV = nRT$ for $n = 2$ moles, the initial temperature $T_A$ is:<br><br>$T_A = \\dfrac{P_A V_A}{nR} = \\dfrac{\\left(\\dfrac{P_o}{2}\\right) V_o}{2R} = \\dfrac{P_o V_o}{4R}$<br><br>For sample B, the initial volume is $V_B = 3V_o$. Substituting this into the relation, the initial pressure $P_B$ is:<br><br>$P_B = P_o\\left(1 + \\left(\\dfrac{V_o}{3V_o}\\right)^2\\right)^{-1} = P_o\\left(1 + \\dfrac{1}{9}\\right)^{-1} = \\dfrac{9P_o}{10}$<br><br>The initial temperature $T_B$ for $n = 2$ moles is:<br><br>$T_B = \\dfrac{P_B V_B}{nR} = \\dfrac{\\left(\\dfrac{9P_o}{10}\\right) (3V_o)}{2R} = \\dfrac{27P_o V_o}{20R}$<br><br>The difference in the initial temperatures of the two samples is:<br><br>$T_B - T_A = \\dfrac{27P_o V_o}{20R} - \\dfrac{P_o V_o}{4R}$<br><br>$T_B - T_A = \\dfrac{27P_o V_o - 5P_o V_o}{20R} = \\dfrac{22P_o V_o}{20R} = \\dfrac{11P_o V_o}{10R}$<br><br>Answer: $\\dfrac{11P_o V_o}{10R}$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd5", "title": "JEE Main 2026 (04 April Shift 1)", "shortName": "2026 (04 April Shift 1)", "isVisible": true, "heldOn": "2026-04-04T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "aa75e957d774473780aea7d265d73e87", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/lTQMjyd2pvEJs.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/lTQMjyd2pvEJs.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd5", "title": "JEE Main 2026 (04 April Shift 1)", "shortName": "2026 (04 April Shift 1)", "isVisible": true, "heldOn": "2026-04-04T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8075a81239f6567c4f4c1", "type": "numerical", "question": {"text": "A vessel contains $0.15$ m$^3$ of a gas at pressure $8$ bar and temperature $140°$C with $c_p = 3R$ and $c_v = 2R$. It is expanded adiabatically till pressure falls to $1$ bar. The work done during this process is _______ kJ. ($R$ is gas constant)", "image": null}, "options": [], "correctValue": "120", "solution": {"text": "Given $P_1 = 8$ bar $= 8 \\times 10^5$ Pa, $V_1 = 0.15$ m$^3$, and $P_2 = 1$ bar $= 10^5$ Pa.<br><br>The adiabatic index $\\gamma$ is given by:<br><br>$\\gamma = \\dfrac{c_p}{c_v} = \\dfrac{3R}{2R} = 1.5$<br><br>For an adiabatic process, $P_1 V_1^\\gamma = P_2 V_2^\\gamma$.<br><br>$V_2 = V_1 \\left( \\dfrac{P_1}{P_2} \\right)^{\\dfrac{1}{\\gamma}}$<br><br>$V_2 = 0.15 \\times \\left( \\dfrac{8}{1} \\right)^{\\dfrac{1}{1.5}} = 0.15 \\times 8^{\\dfrac{2}{3}} = 0.15 \\times 4 = 0.6$ m$^3$<br><br>The work done during the adiabatic expansion is:<br><br>$W = \\dfrac{P_1 V_1 - P_2 V_2}{\\gamma - 1}$<br><br>$W = \\dfrac{8 \\times 10^5 \\times 0.15 - 1 \\times 10^5 \\times 0.6}{1.5 - 1}$<br><br>$W = \\dfrac{1.2 \\times 10^5 - 0.6 \\times 10^5}{0.5}$<br><br>$W = \\dfrac{0.6 \\times 10^5}{0.5} = 1.2 \\times 10^5$ J<br><br>$W = 120$ kJ<br><br>Answer: $120$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "be7719ce77e84061b7bcd4de0b559441", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/NdPLM5HJsyeNu.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/NdPLM5HJsyeNu.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1b28bfdbb2435639800", "type": "numerical", "level": 1, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "A thermodynamic system is taken through the cyclic process $A B C$ as shown in the figure. The total work done by the system during the cycle $A B C$ is $\\_\\_\\_\\_$ J. <br> <img style=\"width:250px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/28S2_q_46_1.png\">", "image": null}, "options": [], "correctValue": 300, "solution": {"text": "From the P-V diagram: A(2,100), B(5,300), C(5,100) in Pa and m³ units.<br>Process A→B is linear. Equation: $P = 100 + \\frac{200}{3}(V-2)$<br>$W_{AB} = \\int_2^5 \\frac{200V - 100}{3} dV = \\frac{1}{3}[100V^2 - 100V]_2^5 = \\frac{1800}{3} = 600$ J<br>Process B→C is isobaric: $W_{BC} = 300(5-5) = 0$ J<br>Process C→A is isobaric: $W_{CA} = 100(2-5) = -300$ J<br>Total work done by system: $W = 600 + 0 - 300 = 300$ J", "image": null}, "videoSolution": {"videoId": "3e2bff1c355b460a948f5f107f7211f6", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/WgOX6LGuIi9GW.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/WgOX6LGuIi9GW.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1ac8bfdbb24356397b1", "type": "singleCorrect", "level": 3, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "In the following $p-V$ diagram the equation of state along the curved path is given by $(V-2)^{2}=4 a p$ where $a$ is a constant. The total work done in the closed path is <br> <img style=\"width:300px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/28S1_q_42_1_v2.png\">", "image": null}, "options": [{"id": "iTfdi", "text": "$+\\frac{1}{3 a}$", "isCorrect": false, "image": null}, {"id": "CnjnV", "text": "$-\\frac{1}{3 a}$", "isCorrect": true, "image": null}, {"id": "CQI9r", "text": "$\\frac{1}{2 a}$", "isCorrect": false, "image": null}, {"id": "wfkN9", "text": "$-\\frac{1}{a}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "From the equation of state $(V-2)^2 = 4ap$, we get $p = \\frac{(V-2)^2}{4a}$.<br>At V = 1: $p = \\frac{1}{4a}$ and at V = 3: $p = \\frac{1}{4a}$.<br>The curved path A→B→C follows the given equation, while C→A is a straight line at constant pressure.<br>Work along the curved path:<br>$W_{ABC} = \\int_1^3 \\frac{(V-2)^2}{4a} dV = \\frac{1}{4a}\\left[\\frac{(V-2)^3}{3}\\right]_1^3 = \\frac{1}{4a} \\cdot \\frac{2}{3} = \\frac{1}{6a}$.<br>Work along C→A at constant pressure:<br>$W_{CA} = \\frac{1}{4a}(1-3) = -\\frac{1}{2a}$.<br>Total work: $W_{total} = \\frac{1}{6a} - \\frac{1}{2a} = -\\frac{1}{3a}$.", "image": null}, "videoSolution": {"videoId": "aa6fdf0663704fd8b91137f36362a72a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Ep8OUKz97r0Qe.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Ep8OUKz97r0Qe.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null},
