examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d684eb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6491", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 2)", "title": "JEE Main 2023 (10 Apr Shift 2)"}], "question": {"text": "<p>A gas is compressed adiabatically, which one of the following statement is NOT true?</p>", "image": null}, "options": [{"id": "C5OyZ", "text": "There is no heat supplied to the system", "image": null, "isCorrect": false}, {"id": "cNBvi", "text": "There is no change in the internal energy", "image": null, "isCorrect": true}, {"id": "ifpe8", "text": "<p>The temperature of the gas increases</p>", "image": null, "isCorrect": false}, {"id": "bljvK", "text": "The change in the internal energy is equal to the work done on the gas", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>In&nbsp;adiabatic process,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>Q</mi><mo>=</mo><mn>0</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>&#8800;</mo><mn>0</mn></math></p><p>Using the first&nbsp;law of thermodynamics,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>Q</mi><mo>=</mo><mo>&#8710;</mo><mi>U</mi><mo>+</mo><mi>W</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mo>-</mo><mi>W</mi><mo>&#160;</mo><mfenced><mrow><mi>W</mi><mo>&#160;</mo><mtext>is&#160;the&#160;work&#160;done&#160;by&#160;the&#160;gas</mtext><mo>,</mo><mo>&#160;</mo><mtext>so</mtext><mo>&#160;</mo><mo>-</mo><mi>W</mi><mo>&#160;</mo><mtext>will&#160;be&#160;the&#160;work&#160;done&#160;on&#160;the&#160;gas</mtext></mrow></mfenced></math></p><p>As the gas is compressed</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>&#160;</mo><mo>&#60;</mo><mn>0</mn></math></p><p>Therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>&#160;</mo><mo>&#62;</mo><mn>0</mn></math>&nbsp;and hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>T</mi><mo>&#160;</mo><mo>&#62;</mo><mn>0</mn></math>.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6491", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 2)", "title": "JEE Main 2023 (10 Apr Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T10:47:58.671Z"}, {"_id": "648b5a70417cc3fb48d68498", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6490", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 1)", "title": "JEE Main 2023 (10 Apr Shift 1)"}], "question": {"text": "Consider two containers <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> containing monoatomic gases at the same Pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>P</mi></mfenced></math>, Volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>V</mi></mfenced></math> and Temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>T</mi></mfenced></math>. The gas in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> is compressed isothermally to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>8</mn></mfrac></math> of its original volume while the gas in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> is compressed adiabatically to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>8</mn></mfrac></math> of its original volume. The ratio of final pressure of gas in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> to that of gas in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> is", "image": null}, "options": [{"id": "DzEyZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>", "image": null, "isCorrect": false}, {"id": "XZM8F", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "image": null, "isCorrect": true}, {"id": "EoCaZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>8</mn><mfrac><mn>3</mn><mn>2</mn></mfrac></msup></math>", "image": null, "isCorrect": false}, {"id": "PBISg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>8</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>In an isothermal process the temperature is constant.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>T</mi></math></p><p>So, it can be written that&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi><mo>=</mo><msub><mi>P</mi><mi>A</mi></msub><mfenced><mfrac><mi>V</mi><mn>8</mn></mfrac></mfenced><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><msub><mi>P</mi><mi>A</mi></msub><mo>=</mo><mn>8</mn><mi>P</mi></math></p><p>In an adiabatic process,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>&#947;</mi></msup><mo>=</mo></math>constant</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi></math>&nbsp;for monoatomic gas is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>3</mn></mfrac></math></p><p>So, it can be written</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>P</mi><mi>B</mi></msub><mi>P</mi></mfrac><mo>=</mo><msup><mfenced><mfrac><mi>V</mi><mstyle displaystyle=\"true\"><mfrac><mi>V</mi><mn>8</mn></mfrac></mstyle></mfrac></mfenced><mfrac><mn>5</mn><mn>3</mn></mfrac></msup><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><msub><mi>P</mi><mi>B</mi></msub><mo>=</mo><mn>32</mn><mi>P</mi></math></p><p>Thus, the ratio of the pressures is&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>P</mi><mi>B</mi></msub><msub><mi>P</mi><mi>A</mi></msub></mfrac><mo>=</mo><mfrac><mrow><mn>32</mn><mi>P</mi></mrow><mrow><mn>8</mn><mi>P</mi></mrow></mfrac><mo>=</mo><mn>4</mn></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6490", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 1)", "title": "JEE Main 2023 (10 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67f53", "previousYearPapers": [{"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>For three low density gases <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>,</mo><mo>&#160;</mo><mi>B</mi><mo>,</mo><mo>&#160;</mo><mi>C</mi></math> pressure versus temperature graphs are plotted while keeping them at constant volume, as shown in the figure</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/50ad71df-1295-4531-9fa8-356adf8a6b98-9896704.png\" style=\"width: 350px; height: 179px;\" /></p><p>The temperature corresponding to the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#39;</mo><mi>K</mi><mo>&#39;</mo></math> is:</p>", "image": null}, "options": [{"id": "rzgES", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>273</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": true, "image": null}, {"id": "1zV0m", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>100</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "df6On", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><mn>373</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "2SayX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>40</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>In case of&nbsp;constant volume process, i.e., isochoric process,&nbsp;</p><p>From ideal gas equation,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>P</mi><mi>T</mi></mfrac><mo>=</mo><mi>n</mi><mfrac><mi>R</mi><mi>V</mi></mfrac><mo>=</mo></math>constant</p><p>Or we have,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mfrac><mrow><mi>n</mi><mi>R</mi></mrow><mi>V</mi></mfrac><mfenced><mrow><mi>t</mi><mo>+</mo><mn>273</mn></mrow></mfenced></math></p><p>If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mi>t</mi><mo>=</mo><mo>-</mo><mn>273</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math></p><p>Thus, when temperature goes to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>273</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, all constituent particles get freezed and pressure goes to zero irrespective of the density of gas.</p><p>Hence, the temperature corresponding to the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi><mo>=</mo><mo>-</mo><mn>273</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67ef3", "previousYearPapers": [{"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A sample of gas at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is adiabatically expanded to double its volume. The work done by the gas in the process is given, (given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math>)&nbsp;:", "image": null}, "options": [{"id": "XCiiZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mi>T</mi><mi>R</mi><mfenced open=\"[\" close=\"]\"><mrow><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>2</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "z7GX6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mfrac><mi>T</mi><mi>R</mi></mfrac><mfenced open=\"[\" close=\"]\"><mrow><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>2</mn></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "NXw4J", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mfrac><mi>R</mi><mi>T</mi></mfrac><mfenced open=\"[\" close=\"]\"><mrow><mn>2</mn><mo>-</mo><msqrt><mn>2</mn></msqrt></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "kuggB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mi>R</mi><mi>T</mi><mfenced open=\"[\" close=\"]\"><mrow><mn>2</mn><mo>-</mo><msqrt><mn>2</mn></msqrt></mrow></mfenced></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Work done by gas in adiabatic process is:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mo>-</mo><mfrac><mfenced><mrow><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub><mo>-</mo><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub></mrow></mfenced><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfrac></math></p><p>&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mrow><mi>n</mi><mi>R</mi><mfenced><mrow><msub><mi>T</mi><mn>2</mn></msub><mo>-</mo><msub><mi>T</mi><mn>1</mn></msub></mrow></mfenced></mrow><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfrac></math></p><p>&nbsp;For an adiabatic process,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub><msup><msub><mi>V</mi><mn>1</mn></msub><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><msub><mi>T</mi><mn>2</mn></msub><msup><msub><mi>V</mi><mn>2</mn></msub><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>T</mi><msup><mi>V</mi><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>-</mo><mn>1</mn></mrow></msup><mo>=</mo><msub><mi>T</mi><mn>2</mn></msub><msup><mfenced><mrow><mn>2</mn><mi>V</mi></mrow></mfenced><mrow><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>-</mo><mn>1</mn></mrow></msup><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mi>T</mi><msup><mi>V</mi><mfrac><mn>1</mn><mn>2</mn></mfrac></msup><mo>=</mo><msub><mi>T</mi><mn>2</mn></msub><msup><mfenced><mrow><mn>2</mn><mi>V</mi></mrow></mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></msup><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mfrac><mi>T</mi><msqrt><mn>2</mn></msqrt></mfrac></math></p><p>Now, work done is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mfrac><mrow><mi>R</mi><mfenced><mrow><msub><mi>T</mi><mn>1</mn></msub><mo>-</mo><msub><mi>T</mi><mn>2</mn></msub></mrow></mfenced></mrow><mrow><mi>&#947;</mi><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>R</mi><mfenced><mrow><mi>T</mi><mo>-</mo><mstyle displaystyle=\"true\"><mfrac><mi>T</mi><msqrt><mn>2</mn></msqrt></mfrac></mstyle></mrow></mfenced></mrow><mstyle displaystyle=\"true\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mfrac><mo>=</mo><mi>R</mi><mi>T</mi><mfenced><mrow><mn>2</mn><mo>-</mo><msqrt><mn>2</mn></msqrt></mrow></mfenced></math></p>", "image": null}, "videoSolution": {"videoId": "91ddc9a8f61f4561aee1a8c7f8164ba1", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/DxkeFsmTPmAvX.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/DxkeFsmTPmAvX.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T11:42:18.940Z"}, {"_id": "648b5a70417cc3fb48d682d9", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A hypothetical gas expands adiabatically such that its volume changes from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>08</mn></math> litres to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn></math> litres. If the ratio of final pressure of the gas to initial pressure of the gas is<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>16</mn><mn>81</mn></mfrac></math> . Then the ratio of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>C</mi><mi>p</mi></msub><msub><mi>C</mi><mi>v</mi></msub></mfrac></math> will be.", "image": null}, "options": [{"id": "WOwLI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>3</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "HUmZ0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>1</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "uXoVM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "Zs6mR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>2</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi></math>&nbsp;be the ratio of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>C</mi><mi>p</mi></msub><msub><mi>C</mi><mi>v</mi></msub></mfrac></math>.</p><p>Then for adiabatic process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>&#947;</mi></msup><mo>&#160;</mo><mo>=</mo></math>Constant</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><msub><mi>P</mi><mi>i</mi></msub><msub><mi>P</mi><mi>f</mi></msub></mfrac><mo>=</mo><msup><mfenced><mfrac><msub><mi>V</mi><mi>f</mi></msub><msub><mi>V</mi><mi>i</mi></msub></mfrac></mfenced><mi>&#947;</mi></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced><mfrac><mn>81</mn><mn>16</mn></mfrac></mfenced><mo>=</mo><msup><mfenced><mfrac><mn>27</mn><mn>8</mn></mfrac></mfenced><mi>&#947;</mi></msup><mspace linebreak=\"newline\"/><mo>&#8658;</mo><msup><mfenced open=\"[\" close=\"]\"><msup><mfenced><mfrac><mn>3</mn><mn>2</mn></mfrac></mfenced><mn>3</mn></msup></mfenced><mfrac><mn>4</mn><mn>3</mn></mfrac></msup><mo>=</mo><msup><mfenced><mfrac><mn>27</mn><mn>8</mn></mfrac></mfenced><mi>&#947;</mi></msup><mspace linebreak=\"newline\"/></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#947;</mi><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math></p>", "image": null}, "videoSolution": {"videoId": "dd127497d7de4376a6ed5cc76e08ce8b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/SRyEmdaMvPRSj.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/SRyEmdaMvPRSj.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T10:53:21.963Z"}, {"_id": "648b5a70417cc3fb48d682d5", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Heat energy of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>735</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math> is given to a diatomic gas allowing the gas to expand at constant pressure. Each gas molecule rotates around an internal axis but do not oscillate. The increase in the internal energy of the gas will be:", "image": null}, "options": [{"id": "o9TFK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>525</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": true, "image": null}, {"id": "5daRs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>441</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "sd6U7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>572</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "g0eMn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>735</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>For isobaric process and diatomic gas we can write,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>Q</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>P</mi></msub><mi>&#916;</mi><mi>T</mi><mo>=</mo><mn>735</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi>n</mi><mfrac><mrow><mn>7</mn><mi>R</mi></mrow><mn>2</mn></mfrac><mi>&#916;</mi><mi>T</mi><mo>=</mo><mn>735</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>n</mi><mi>R</mi><mi>&#916;</mi><mi>T</mi><mo>=</mo><mn>210</mn></math></p><p>Now internal energy will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>U</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>V</mi></msub><mi>&#916;</mi><mi>T</mi><mspace linebreak=\"newline\"/><mo>=</mo><mi>n</mi><mfrac><mrow><mn>5</mn><mi>R</mi></mrow><mn>2</mn></mfrac><mi>&#916;</mi><mi>T</mi><mspace linebreak=\"newline\"/><mo>=</mo><mfrac><mn>5</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>210</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>525</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T10:54:44.465Z"}, {"_id": "648b5a6f417cc3fb48d68280", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b11", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 1)", "title": "JEE Main 2023 (31 Jan Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "The correct relation between&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>=</mo><mfrac><msub><mi>C</mi><mi>P</mi></msub><msub><mi>C</mi><mi>V</mi></msub></mfrac></math>&nbsp;and&nbsp;temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> is :", "image": null}, "options": [{"id": "izDyC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>&#8733;</mo><mfrac><mn>1</mn><msqrt><mi>T</mi></msqrt></mfrac></math>", "isCorrect": false, "image": null}, {"id": "MNodm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>&#8733;</mo><msup><mi>T</mi><mn>0</mn></msup></math>", "isCorrect": true, "image": null}, {"id": "19msr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>&#8733;</mo><mfrac><mn>1</mn><mi>T</mi></mfrac></math>", "isCorrect": false, "image": null}, {"id": "yM33u", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>&#8733;</mo><mi>T</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The ratio of molar specific heat capacity at constant pressure to the molar specific heat capacity at constant volume is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>C</mi><mi>P</mi></msub><msub><mi>C</mi><mi>V</mi></msub></mfrac><mo>=</mo><mi>&#947;</mi></math></p><p>where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi></math>&nbsp;is constant for a given gas.</p><p>Therefore,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>C</mi><mi>P</mi></msub><msub><mi>C</mi><mi>V</mi></msub></mfrac><mo>&#8733;</mo><msup><mi>T</mi><mn>0</mn></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b11", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 1)", "title": "JEE Main 2023 (31 Jan Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T11:02:10.502Z"}, {"_id": "648b5a6f417cc3fb48d6811b", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A bicycle tyre is filled with air having pressure of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>270</mn><mo>&#160;</mo><mi>kPa</mi></math>&nbsp;at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>. The approximate pressure of the air in the tyre when the temperature increases to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> is", "image": null}, "options": [{"id": "3j20d", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>270</mn><mo>&#160;</mo><mi>kPa</mi></math>", "isCorrect": false, "image": null}, {"id": "90IUM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>262</mn><mo>&#160;</mo><mi>kPa</mi></math>", "isCorrect": false, "image": null}, {"id": "K2FHE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>278</mn><mo>&#160;</mo><mi>kPa</mi></math>", "isCorrect": true, "image": null}, {"id": "hLq0R", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>360</mn><mo>&#160;</mo><mi>kPa</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><mo>=</mo><mn>270</mn><mo>&#160;</mo><mi>kPa</mi><mo>,</mo><mo>&#160;</mo><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mn>27</mn><mo>+</mo><mn>273</mn><mo>=</mo><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>,</mo><mo>&#160;</mo><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>36</mn><mo>+</mo><mn>273</mn><mo>=</mo><mn>309</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p>Ideal gas&nbsp;equation is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>T</mi></math>.</p><p>Considering isochoric process, i.e., constant&nbsp;volume&nbsp;so&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>&#8733;</mo><mi>T</mi></math></p><p>Thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>P</mi><mn>1</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mfrac><mo>=</mo><mfrac><msub><mi>P</mi><mn>2</mn></msub><msub><mi>T</mi><mn>2</mn></msub></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>P</mi><mn>2</mn></msub><mo>=</mo><mfrac><msub><mi>P</mi><mn>1</mn></msub><msub><mi>T</mi><mn>1</mn></msub></mfrac><mo>&#215;</mo><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mfrac><mrow><mn>270</mn><mo>&#215;</mo><mfenced><mn>309</mn></mfenced></mrow><mn>300</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>278</mn><mo>&#160;</mo><mi>kPa</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d680bc", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match List I with List II :</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 600px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td><strong>List I</strong></td>\t\t\t<td>&nbsp;</td>\t\t\t<td><strong>List II</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td>A</td>\t\t\t<td>Isothermal Process</td>\t\t\t<td>I</td>\t\t\t<td>Work done by the gas decreases internal energy</td>\t\t</tr>\t\t<tr>\t\t\t<td>B</td>\t\t\t<td>Adiabatic Process</td>\t\t\t<td>II</td>\t\t\t<td>No change in internal energy</td>\t\t</tr>\t\t<tr>\t\t\t<td>C</td>\t\t\t<td>Isochoric Process</td>\t\t\t<td>III</td>\t\t\t<td>The heat absorbed goes partly to increase internal energy and partly to do work</td>\t\t</tr>\t\t<tr>\t\t\t<td>D</td>\t\t\t<td>Isobaric Process</td>\t\t\t<td>IV</td>\t\t\t<td>No work is done on or by the gas</td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below :</p>", "image": null}, "options": [{"id": "p81Io", "text": "A-II, B-I, C-III, D-IV", "isCorrect": false, "image": null}, {"id": "1lIG4", "text": "A-II, B-I, C-IV, D-III", "isCorrect": true, "image": null}, {"id": "GBhMn", "text": "A-I, B-II, C-IV, D-III", "isCorrect": false, "image": null}, {"id": "fYHyk", "text": "A-I, B-II, C-III, D-IV", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>(A) Change in internal energy is expressed as<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>v</mi></msub><mo>&#8710;</mo><mi>T</mi></math>, here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>T</mi></math>&nbsp;is change in temperature.</p><p>Since, in an isothermal process temperature remains&nbsp;constant, thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#8594;</mo><mi>I</mi><mi>I</mi></math></p><p>(B) In an adiabatic process, heat transfer,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>0</mn></math>.</p><p>So, from first law of thermodynamics,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mo>&#8710;</mo><mi>U</mi><mo>&#160;</mo><mo>+</mo><mi>W</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mo>-</mo><mi>W</mi></math></p><p>Since, work done by gas is positive, thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi></math> is negative</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>&#8594;</mo><mi>I</mi></math></p><p>(C) In an isochoric process, volume remains constant, so work done by or on the gas&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>&#160;</mo><mo>=</mo><mi>P</mi><mo>&#8710;</mo><mi>V</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>&#8594;</mo><mi>I</mi><mi>V</mi></math></p><p>(D) In an isobaric process, pressure remains constant, so work done<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mi>P</mi><mo>&#8710;</mo><mi>V</mi><mo>&#8800;</mo><mn>0</mn></math>&nbsp;and&nbsp;change in internal energy&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>v</mi></msub><mo>&#8710;</mo><mi>T</mi><mo>&#8800;</mo><mn>0</mn></math></p><p>Thus, heat absorbed goes partly to increase internal energy and partly do work.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi><mo>&#8594;</mo><mi>I</mi><mi>I</mi><mi>I</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6800b", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "In an Isothermal change, the change in pressure and volume of a gas can be represented for three different temperature;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>3</mn></msub><mo>&#62;</mo><msub><mi>T</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>T</mi><mn>1</mn></msub></math>&nbsp;as:", "image": null}, "options": [{"id": "4Ryw0", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b6b6cc63-e289-4355-9b8b-946b2604511b-9894240.PNG\" style=\"width: 174px; height: 180px;\" />", "isCorrect": false, "image": null}, {"id": "gLYPp", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/44a259c5-c222-41bd-8812-11ebf3d2bf0f-9894240_1.PNG\" style=\"width: 175px; height: 180px;\" />", "isCorrect": false, "image": null}, {"id": "TnKsx", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/96136b78-f06b-4c49-9ca4-9b6efda284cf-9894240_2.PNG\" style=\"width: 175px; height: 180px;\" />", "isCorrect": false, "image": null}, {"id": "Kn95V", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fbb35a83-fdf7-47f3-82c9-e0d23deae04e-9894240_3.PNG\" style=\"width: 173px; height: 180px;\" />", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>In case of isothermal process, pressure vs volume graph is a rectangular hyperbola.</p><p>The graph of the isothermal process shifts away from the origin as the temperature of the process is increased. Thus, the curve away from the&nbsp;origin <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>3</mn></msub></math> have the highest temperature whereas the curve closer to the origin&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub></math> have the lowest temperature.</p><p>Here, the dotted line shows&nbsp;the isobaric line that implies&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>3</mn></msub><mo>&#62;</mo><msub><mi>T</mi><mn>2</mn></msub><mo>&#62;</mo><msub><mi>T</mi><mn>1</mn></msub></math>&nbsp;as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mfrac><mrow><mi>P</mi><mi>V</mi></mrow><mrow><mi>n</mi><mi>R</mi></mrow></mfrac></math>.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a127db4c-b436-48da-8688-5b0312b0b339-9894240_4.PNG\" style=\"width: 241px; height: 220px;\" /></p>", "image": null}, "videoSolution": {"videoId": "e6f26a38d71e4837a25b372d7071f69b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/MbGo2KTmTQjdl.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/MbGo2KTmTQjdl.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T11:05:18.652Z"}, {"_id": "648b5a6e417cc3fb48d67df1", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 2)", "title": "JEE Main 2022 (29 Jul Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>A thermodynamic system is taken from an original state <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi></math> to an intermediate state <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math> by the linear process shown in the figure. Its volume is then reduced to the original volume from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> by an isobaric process. The total work done by the gas from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math> will be</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6e88af83-8b52-4a85-9bef-1f8089e65a6e-image.png\" style=\"width: 240px; height: 195px;\" /></p>", "image": null}, "options": [{"id": "e2utM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>450</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "ShKB0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>450</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": true, "image": null}, {"id": "FZVQP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>900</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "wj4Fa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1350</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Total work done by the gas from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>F</mi></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo></math>Area of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>D</mi><mi>E</mi><mi>F</mi></math></p><p>Work done during the process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi><mi>E</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">W</mi><mi>DE</mi></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mn>600</mn><mo>+</mo><mn>300</mn></mrow></mfenced><mfenced><mrow><mn>5</mn><mo>-</mo><mn>2</mn></mrow></mfenced><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1350</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p>Work done during the process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mi>F</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">W</mi><mi>EF</mi></msub><mo>=</mo><mo>-</mo><mn>300</mn><mo>&#215;</mo><mn>3</mn><mo>=</mo><mo>-</mo><mn>900</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">W</mi><mi>DEF</mi></msub><mo>=</mo><msub><mi mathvariant=\"normal\">W</mi><mi>DE</mi></msub><mo>+</mo><msub><mi mathvariant=\"normal\">W</mi><mi>EF</mi></msub><mo>=</mo><mn>450</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "63134c746e7bc9b33248370c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 2)", "title": "JEE Main 2022 (29 Jul Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T11:24:32.148Z"}, {"_id": "648b5a6e417cc3fb48d67d9d", "previousYearPapers": [{"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}], "type": "numerical", "level": 2, "question": {"text": "<p>The pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math>&nbsp;and density <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>d</mi><mn>1</mn></msub></math> of diatomic gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#947;</mi><mo>=</mo><mfrac><mn>7</mn><mn>5</mn></mfrac></mrow></mfenced></math> changes suddenly to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub><mfenced><mrow><mo>&#62;</mo><msub><mi>P</mi><mn>1</mn></msub></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>d</mi><mn>2</mn></msub></math> respectively during an adiabatic process. The temperature of the gas increases and becomes____times of its initial temperature.&nbsp;</p><p>(given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>d</mi><mn>2</mn></msub><mrow><mo>&#160;</mo><msub><mi>d</mi><mn>1</mn></msub></mrow></mfrac><mo>=</mo><mn>32</mn></math>)</p>", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<blockquote><p>For adiabatic process,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>&#947;</mi></msup><mo>=</mo></math> constant</p><p>We know, density&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mo>=</mo><mfrac><mi>mass</mi><mi>Volume</mi></mfrac></math>.</p><p>Then, we have&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>P</mi><msup><mi>d</mi><mi>&#947;</mi></msup></mfrac><mo>=</mo></math> constant</p><p>Given here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>d</mi><mn>2</mn></msub><mrow><mo>&#160;</mo><msub><mi>d</mi><mn>1</mn></msub></mrow></mfrac><mo>=</mo><mn>32</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>=</mo><mfrac><mn>7</mn><mn>5</mn></mfrac></math>.</p><p>The ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>P</mi><mn>1</mn></msub><msub><mi>P</mi><mn>2</mn></msub></mfrac><mo>=</mo><msup><mfenced><mfrac><msub><mi>d</mi><mn>1</mn></msub><mrow><mo>&#160;</mo><msub><mi>d</mi><mn>2</mn></msub></mrow></mfrac></mfenced><mi>&#947;</mi></msup><mo>=</mo><msup><mfenced><mfrac><mn>1</mn><mn>32</mn></mfrac></mfenced><mfrac><mn>7</mn><mn>5</mn></mfrac></msup><mo>=</mo><mfrac><mn>1</mn><mn>128</mn></mfrac></math></p><p>The ratio of temperature using ideal gas equation is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>T</mi><mn>1</mn></msub><mrow><mo>&#160;</mo><msub><mi>T</mi><mn>2</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>1</mn></msub><mo>&#160;</mo><msub><mi>V</mi><mn>1</mn></msub></mrow><mrow><msub><mi>P</mi><mn>2</mn></msub><mo>&#160;</mo><msub><mi>V</mi><mn>2</mn></msub></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>128</mn></mfrac><mo>&#215;</mo><mn>32</mn><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p><p>Thus,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>4</mn><msub><mi>T</mi><mn>1</mn></msub></math>.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T11:25:02.118Z"}, {"_id": "648b5a6d417cc3fb48d67c90", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "At a certain temperature, the degrees of freedom per molecule for gas is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>. The gas performs <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>150</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math> of work when it expands under constant pressure. The amount of heat absorbed by the gas will be _____&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">J</mi></math>.", "image": null}, "options": [], "correctValue": "750", "solution": {"text": "<blockquote><p>For constant pressure process,</p><p>Work done is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>&#916;</mi><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>150</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>, here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;is gas constant.</p><p>Now, for above process,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>=</mo><mn>8</mn></math>.</p><p>So, specific heat at constant pressure is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>P</mi></msub><mo>=</mo><mfenced><mrow><mn>1</mn><mo>+</mo><mfrac><mi>f</mi><mn>2</mn></mfrac></mrow></mfenced><mi>R</mi></math>.</p><p>Amount of heat adsorbed by the gas is&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>P</mi></msub><mi>R</mi><mi>&#916;</mi><mi>T</mi><mo>=</mo><mfenced><mrow><mfrac><mi>f</mi><mn>2</mn></mfrac><mo>+</mo><mn>1</mn></mrow></mfenced><mi>n</mi><mi>R</mi><mi>&#916;</mi><mi>T</mi><mo>=</mo><mfenced><mrow><mfrac><mn>8</mn><mn>2</mn></mfrac><mo>+</mo><mn>1</mn></mrow></mfenced><mn>150</mn><mo>=</mo><mn>750</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "34978e0f991943e3afdc22c8d11da770", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/7bqvrqDflr7EG.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/7bqvrqDflr7EG.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T11:37:03.001Z"}, {"_id": "648b5a6c417cc3fb48d6795c", "previousYearPapers": [{"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 1)", "title": "JEE Main 2022 (26 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A monoatomic gas at pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> and volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math> is suddenly compressed to one eighth of its original volume. The final pressure at constant entropy will be", "image": null}, "options": [{"id": "7YRGe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>", "isCorrect": false, "image": null}, {"id": "MTSQr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mi>P</mi></math>", "isCorrect": false, "image": null}, {"id": "pEOm1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>32</mn><mi>P</mi></math>", "isCorrect": true, "image": null}, {"id": "V2b2n", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>64</mn><mi>P</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Change in entropy is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>d</mo><mi>S</mi><mo>=</mo><mfrac><mrow><mo>d</mo><mi>Q</mi></mrow><mi>T</mi></mfrac></math>. Since, the process is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>d</mo><mi>S</mi><mo>=</mo><mn>0</mn></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>d</mo><mi>Q</mi><mo>=</mo><mn>0</mn></math>. Therefore, constant entropy means the process is adiabatic.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>V</mi><mi>&#947;</mi></msup><mo>=</mo></math>constant</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>P</mi><mn>1</mn></msub><msubsup><mi>V</mi><mn>1</mn><mi>&#947;</mi></msubsup><mo>=</mo><msub><mi>P</mi><mn>2</mn></msub><msubsup><mi>V</mi><mn>2</mn><mi>&#947;</mi></msubsup></math></p><p>For a monatomic gas&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>=</mo><mfrac><mn>5</mn><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>P</mi><mn>1</mn></msub><msubsup><mi>V</mi><mn>1</mn><mfrac><mn>5</mn><mn>3</mn></mfrac></msubsup><mo>=</mo><msub><mi>P</mi><mn>2</mn></msub><msup><mfenced><mfrac><msub><mi>V</mi><mn>1</mn></msub><mn>8</mn></mfrac></mfenced><mfrac><mn>5</mn><mn>3</mn></mfrac></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>P</mi><mn>1</mn></msub><msubsup><mi>V</mi><mn>1</mn><mfrac><mn>5</mn><mn>3</mn></mfrac></msubsup><mo>=</mo><mfrac><mrow><msub><mi>P</mi><mn>2</mn></msub><mo>&#160;</mo><msubsup><mi>V</mi><mn>1</mn><mstyle displaystyle=\"true\"><mfrac><mn>5</mn><mn>3</mn></mfrac></mstyle></msubsup></mrow><mn>32</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>P</mi><mn>2</mn></msub><mo>=</mo><mn>32</mn><msub><mi>P</mi><mn>1</mn></msub></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 1)", "title": "JEE Main 2022 (26 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d6795b", "previousYearPapers": [{"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 1)", "title": "JEE Main 2022 (26 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn></math> mole of certain monoatomic ideal gas undergoes a temperature increase of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math> at constant pressure. The increase in the internal energy of the gas in this process is<br />(Given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>8</mn><mo>.</mo><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>)", "image": null}, "options": [{"id": "D5bPY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5810</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "JdG2N", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3486</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": true, "image": null}, {"id": "yCs0T", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11620</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "FsSUs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6972</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>For the given process&nbsp;pressure is constant therefore, it is an isobaric process.</p><p>For a quasi-static process the change in internal energy of an ideal gas is independent of the nature of the process and is given by,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>U</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>v</mi></msub><mi>&#916;</mi><mi>T</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>n</mi><mo>&#215;</mo><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mn>2</mn></mfrac><mo>&#215;</mo><mi>&#916;</mi><mi>T</mi></math></p><p>[molar heat capacity at constant volume for monatomic gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>3</mn><mi>R</mi></mrow><mn>2</mn></mfrac></math>]</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>U</mi><mo>=</mo><mn>7</mn><mo>&#215;</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>8</mn><mo>.</mo><mn>3</mn><mo>&#215;</mo><mn>40</mn><mo>=</mo><mn>3486</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 1)", "title": "JEE Main 2022 (26 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d677ed", "previousYearPapers": [{"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A certain amount of gas of volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>V</mi></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> temperature and pressure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>7</mn></msup><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup></math> expands isothermally until its volume gets doubled. Later it expands adiabatically until its volume gets redoubled. The final pressure of the gas will be (Use <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>=</mo><mn>1</mn><mo>.</mo><mn>5</mn></math>)", "image": null}, "options": [{"id": "VJtQY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>536</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi>Pa</mi></math>", "isCorrect": false, "image": null}, {"id": "2sCUX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>536</mn><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi>Pa</mi></math>", "isCorrect": true, "image": null}, {"id": "BuZa7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>25</mn><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi>Pa</mi></math>", "isCorrect": false, "image": null}, {"id": "pwVKz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>25</mn><mo>&#215;</mo><msup><mn>10</mn><mn>5</mn></msup><mo>&#160;</mo><mi>Pa</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Given here,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>7</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>=</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>7</mn></msup><mo>&#160;</mo><mi>Pa</mi></math></p><p>Using Boyle&#39;s law,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><msub><mi>V</mi><mn>1</mn></msub><mo>=</mo><msub><mi>P</mi><mn>2</mn></msub><msub><mi>V</mi><mn>2</mn></msub></math></p><p>Since <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><msub><mi>V</mi><mn>1</mn></msub></math>.</p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub><mo>=</mo><mfrac><msub><mi>P</mi><mn>1</mn></msub><mn>2</mn></mfrac></math>&nbsp;(isothermal expansion)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub><mo>=</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mn>7</mn></msup><mo>&#160;</mo><mi>Pa</mi></math></p><p>Now, during adiabatic expansion,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub><msup><mfenced><msub><mi>V</mi><mn>2</mn></msub></mfenced><mi>&#947;</mi></msup><mo>=</mo><msub><mi>P</mi><mn>3</mn></msub><msup><mfenced><mrow><mn>2</mn><msub><mi>V</mi><mn>2</mn></msub></mrow></mfenced><mi>&#947;</mi></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>3</mn></msub><mo>=</mo><mfrac><mrow><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mn>7</mn></msup></mrow><msup><mn>2</mn><mrow><mn>1</mn><mo>.</mo><mn>5</mn></mrow></msup></mfrac><mo>=</mo><mn>3</mn><mo>.</mo><mn>536</mn><mo>&#215;</mo><msup><mn>10</mn><mn>6</mn></msup><mo>&#160;</mo><mi>Pa</mi></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "9fe834fb8205423394debd1a62187518", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/M6PlcUWGnX37Y.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/M6PlcUWGnX37Y.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67e9c", "previousYearPapers": [{"_id": "62c481f101514d218a7934dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 2)", "title": "JEE Main 2022 (29 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Starting with the same initial conditions, an ideal gas expands from volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>1</mn></msub></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>V</mi><mn>2</mn></msub></math> in three different ways. The work done by the gas is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>1</mn></msub></math> if the process is purely isothermal, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>2</mn></msub></math>, if the process is purely adiabatic and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>3</mn></msub></math> if the process is purely&nbsp;isobaric. Then, choose the correct option", "image": null}, "options": [{"id": "i5ye7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>2</mn></msub><mo>&#60;</mo><msub><mi>W</mi><mn>1</mn></msub><mo>&#60;</mo><msub><mi>W</mi><mn>3</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "wwk1N", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>1</mn></msub><mo>&#60;</mo><msub><mi>W</mi><mn>2</mn></msub><mo>&#60;</mo><msub><mi>W</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "4iNMy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>2</mn></msub><mo>&#60;</mo><msub><mi>W</mi><mn>3</mn></msub><mo>&#60;</mo><msub><mi>W</mi><mn>1</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "d2MuO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mn>3</mn></msub><mo>&#60;</mo><msub><mi>W</mi><mn>1</mn></msub><mo>&#60;</mo><msub><mi>W</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>As we know, in isobaric process pressure remains constant and magnitude of slope of adiabatic curve will be more than the isothermal curve at the common point, therefore diagram for process will be as given below.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/867db2a6-a4da-4624-aeaa-b5fad7e5a5ff-image.png\" style=\"width: 200px; height: 161px;\" /></p><p>Also,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo></math> area under&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>-</mo><mi>V</mi></math>&nbsp;curve.</p><p>Hence,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><msub><mi>W</mi><mn>2</mn></msub><mo>&#60;</mo><msub><mi>W</mi><mn>1</mn></msub><mo>&#60;</mo><msub><mi>W</mi><mn>3</mn></msub></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["SEQUENCE_ORDER"], "syllabusCategory": "noChange", "previousYear": {"_id": "62c481f101514d218a7934dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 2)", "title": "JEE Main 2022 (29 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67d34", "previousYearPapers": [{"_id": "62c481f101514d218a7934da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 2)", "title": "JEE Main 2022 (28 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>A sample of an ideal gas is taken through the cyclic process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>C</mi><mi>A</mi></math> as shown in figure. It absorbs, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math> of heat during the part <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>, no heat during <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mi>C</mi></math> and rejects <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math> of heat during <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>A</mi></math>. A work of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math> is done on the gas during the part <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mi>C</mi></math>. The internal energy of the gas at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1560</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>. The work done by the gas during the part <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>A</mi></math> is</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a34d352d-82ef-450a-a47a-09a0cf5845cc-image.png\" style=\"width: 150px; height: 150px;\" /></p>", "image": null}, "options": [{"id": "9Co2B", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "enknQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": true, "image": null}, {"id": "qtexE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>30</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}, {"id": "XarRr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>60</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>&nbsp;In the part <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>&#8594;</mo><mi>B</mi></math>, the volume remains constant. Thus, the work done by the gas is zero. It is given that the heat absorbed by the gas is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>. From first&nbsp;law of thermodynamics, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><mi>U</mi><mo>+</mo><mi>W</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>40</mn><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><mi>U</mi><mo>+</mo><mn>0</mn><mo>&#8658;</mo><mi mathvariant=\"normal\">&#916;</mi><mi>U</mi><mo>=</mo><mn>40</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p>or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>U</mi><mo>=</mo><msub><mi>U</mi><mi>B</mi></msub><mo>-</mo><msub><mi>U</mi><mi>A</mi></msub><mo>=</mo><mn>40</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p>The increase in internal energy from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>. The internal energy is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1560</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>U</mi><mi>B</mi></msub><mo>-</mo><mn>1560</mn><mo>=</mo><mn>40</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#8658;</mo><msub><mi>U</mi><mi>B</mi></msub><mo>=</mo><mn>1600</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p>In the part <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>&#8594;</mo><mi>C</mi></math>, the work done by the gas is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math> and no heat is given to the system. Again using&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><mi>U</mi><mo>+</mo><mi>W</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><mi>U</mi><mo>-</mo><mn>50</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi>U</mi><mo>=</mo><msub><mi>U</mi><mi>C</mi></msub><mo>-</mo><msub><mi>U</mi><mi>B</mi></msub><mo>=</mo><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>U</mi><mi>C</mi></msub><mo>-</mo><mn>1600</mn><mo>=</mo><mn>50</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#8658;</mo><msub><mi>U</mi><mi>C</mi></msub><mo>=</mo><mn>1650</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p>&nbsp;The change in internal energy from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>&#8594;</mo><mi>A</mi></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mn>1560</mn><mo>-</mo><mn>1650</mn><mo>=</mo><mo>-</mo><mn>90</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p>The heat given to the system is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mo>-</mo><mn>60</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p>Using <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mi mathvariant=\"normal\">&#916;</mi><mi>U</mi><mo>+</mo><mi>W</mi></math>, we get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mi>Q</mi><mo>-</mo><mo>&#8710;</mo><mi>U</mi><mo>=</mo><mo>-</mo><mn>60</mn><mo>-</mo><mfenced><mrow><mo>-</mo><mn>90</mn></mrow></mfenced><mo>=</mo><mn>30</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p>", "image": null}, "videoSolution": {"videoId": "a542544b9bf94cbcae9cab86d7aed618", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/i4ZN4Mkwz8eJW.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/i4ZN4Mkwz8eJW.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "62c481f101514d218a7934da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 2)", "title": "JEE Main 2022 (28 Jun Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T11:29:01.945Z"}, {"_id": "648b5a6e417cc3fb48d67cee", "previousYearPapers": [{"_id": "62c481f101514d218a7934d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 1)", "title": "JEE Main 2022 (28 Jun Shift 1)"}], "type": "numerical", "level": 1, "question": {"text": "The total internal energy of two mole monoatomic ideal gas at temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mo>=</mo><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math> will be _____&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">J</mi></math>. (Given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mn>8</mn><mo>.</mo><mn>31</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#183;</mo><mi mathvariant=\"normal\">K</mi></math>)", "image": null}, "options": [], "correctValue": "7479", "solution": {"text": "<p>The internal energy&nbsp;of an ideal gas is a state function and is given by,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>U</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>v</mi></msub><mi>T</mi></math>.</p><p>For monatomic gas,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>v</mi></msub><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mi>R</mi></math>.</p><p>Therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>U</mi><mo>=</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>8</mn><mo>.</mo><mn>31</mn><mo>&#215;</mo><mn>300</mn><mo>=</mo><mn>7479</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 1)", "title": "JEE Main 2022 (28 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67cd9", "previousYearPapers": [{"_id": "62c481f101514d218a7934d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 1)", "title": "JEE Main 2022 (28 Jun Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p><strong>Statement - I :</strong> When <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#956;</mi></math> amount of an ideal gas undergoes adiabatic change from state <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>P</mi><mn>1</mn></msub><mo>,</mo><msub><mi>V</mi><mn>1</mn></msub><mo>,</mo><msub><mi>T</mi><mn>1</mn></msub></mrow></mfenced></math> to state <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>P</mi><mn>2</mn></msub><mo>,</mo><msub><mi>V</mi><mn>2</mn></msub><mo>,</mo><msub><mi>T</mi><mn>2</mn></msub></mrow></mfenced></math>, then work done is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mfrac><mrow><mi>&#956;</mi><mi>R</mi><mfenced><mrow><msub><mi>T</mi><mn>2</mn></msub><mo>-</mo><msub><mi>T</mi><mn>1</mn></msub></mrow></mfenced></mrow><mrow><mn>1</mn><mo>-</mo><mi>&#947;</mi></mrow></mfrac></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>=</mo><mfrac><msub><mi>C</mi><mi>P</mi></msub><msub><mi>C</mi><mi>V</mi></msub></mfrac></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo></math> universal gas constant.</p><p><strong>Statement - II :</strong> In the above case, when work is done on the gas, the temperature of the gas would rise.</p>", "image": null}, "options": [{"id": "mnJbv", "text": "Both statement-I and statement-II are true.", "isCorrect": true, "image": null}, {"id": "0zWX4", "text": "Both statement-I and statement-II are false.", "isCorrect": false, "image": null}, {"id": "Q1KQI", "text": "Statement-I is true but statement-II is false.", "isCorrect": false, "image": null}, {"id": "YaM50", "text": "Statement-I is false but statement-II is true.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The work done in an adiabatic process is given by,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>W</mi><mrow><mi>adiabatic</mi><mo>&#160;</mo></mrow></msub><mo>=</mo><mfrac><mrow><mi>n</mi><mi>R</mi><mfenced><mrow><msub><mi>T</mi><mi>f</mi></msub><mo>-</mo><msub><mi>T</mi><mi>i</mi></msub></mrow></mfenced></mrow><mrow><mn>1</mn><mo>-</mo><mi>&#947;</mi></mrow></mfrac><mo>&#8594;</mo></math> statement&nbsp;I is true.</p><p>For adiabatic process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>Q</mi><mo>=</mo><mn>0</mn></math>. From the first law of thermodynamics,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>Q</mi><mo>=</mo><mi>W</mi><mo>+</mo><mi>&#916;</mi><mi>U</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>=</mo><mi>W</mi><mo>+</mo><mi>&#916;</mi><mi>U</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>U</mi><mo>=</mo><mo>-</mo><mi>W</mi></math></p><p>If work is done on the gas, i.e. work is negative</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#916;</mi><mi>U</mi></math> is positive.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;The temperature will increase. Hence, statement II is also true.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "62c481f101514d218a7934d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 1)", "title": "JEE Main 2022 (28 Jun Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T11:36:19.873Z"}, {"_id": "648b5a6d417cc3fb48d67bdb", "previousYearPapers": [{"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}], "type": "numerical", "level": 1, "question": {"text": "A diatomic gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#947;</mi><mo>=</mo><mn>1</mn><mo>.</mo><mn>4</mn></mrow></mfenced></math> does <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math> of work when it is expanded isobarically. The heat given to the gas in the process is _____&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">J</mi></math>.", "image": null}, "options": [], "correctValue": "1400", "solution": {"text": "<p>For&nbsp;isobaric process:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mi>n</mi><mi>R</mi><mi>&#916;</mi><mi>T</mi></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>400</mn><mo>=</mo><mi>n</mi><mi>R</mi><mi>&#916;</mi><mi>T</mi></math></p><p>Also:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mi>n</mi><msub><mi>C</mi><mi>p</mi></msub><mi>&#916;</mi><mi>T</mi></math>&nbsp;</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>Q</mi><mo>=</mo><mi>n</mi><mfenced><mfrac><mrow><mn>7</mn><mi>R</mi></mrow><mn>2</mn></mfrac></mfenced><mi>&#916;</mi><mi>T</mi></math>&nbsp; (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>p</mi></msub><mo>=</mo><mfrac><mrow><mn>7</mn><mi>R</mi></mrow><mn>2</mn></mfrac></math>, for diatomic gas)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mfrac><mn>7</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>400</mn><mo>=</mo><mn>1400</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "
