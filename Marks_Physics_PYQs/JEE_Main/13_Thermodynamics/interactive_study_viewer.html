  <script>
    const data = {"index": 13, "chapterId": "616023e7441e5bacfafa72af", "chapter": "Thermodynamics", "exam": "JEE Main", "subject": "Physics", "totalTopics": 4, "totalQuestions": 232, "downloadTime": "2026-10-08 20:29:08", "topics": [{"index": 1, "topicId": "648b5a73417cc3fb48d69194", "title": "Thermodynamic Systems", "totalQuestions": 11, "questions": [{"_id": "69d8073381239f6567c4f2f1", "type": "singleCorrect", "question": {"text": "Consider the following statements:<br>A. Zeroth law of thermodynamics gives concept of temperature<br>B. First law of thermodynamics gives concept of internal energy<br>C. In isothermal expansion of ideal gas, $\\Delta Q \\neq \\Delta W$<br>D. Product of intensive and extensive variables is extensive<br>E. The ratio of any extensive variable to mass will be an extensive variable<br>Choose the correct combination of statements from the options given below:", "image": null}, "options": [{"id": "Sxmu9", "text": "C, D and E Only", "isCorrect": false, "image": null}, {"id": "Jq2xY", "text": "A, B and C Only", "isCorrect": false, "image": null}, {"id": "2miE0", "text": "A, B and D Only", "isCorrect": true, "image": null}, {"id": "RCR9R", "text": "B, C and D Only", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Statement A is correct because the zeroth law of thermodynamics defines temperature and thermal equilibrium.<br><br>Statement B is correct because the first law of thermodynamics introduces the concept of internal energy through the equation $\\Delta Q = \\Delta U + \\Delta W$.<br><br>Statement C is incorrect because for an isothermal expansion of an ideal gas, the change in internal energy $\\Delta U = 0$. According to the first law of thermodynamics, $\\Delta Q = \\Delta W$.<br><br>Statement D is correct because if an intensive variable (which is independent of the size of the system) is multiplied by an extensive variable (which is directly proportional to the size of the system), the product will be directly proportional to the size of the system, making it an extensive variable.<br><br>Statement E is incorrect because the ratio of two extensive variables (like any extensive variable and mass) is independent of the size of the system, making it an intensive variable.<br><br>Therefore, only statements A, B, and D are correct.<br><br>Answer: A, B and D Only", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "2b81f74300dd4fc7b43df3fe33ddb2d8", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/i7xxLnw0Q6hj6.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/i7xxLnw0Q6hj6.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["MULTI_STATEMENT"], "syllabusCategory": "noChange", "previousYear": {"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c687c09d044e4c1a1cf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2025 (4 Apr Shift 2)", "title": "JEE Main 2025 (4 Apr Shift 2)"}], "question": {"text": "There are two vessels filled with an ideal gas where volume of one is double the volume of other. The large vessel contains the gas at 8 kPa at 1000 K while the smaller vessel contains the gas at 7 kPa at 500 K. If the vessels are connected to each other by a thin tube allowing the gas to flow and the temperature of both vessels is maintained at 600 K , at steady state the pressure in the vessels will be (in kPa).", "image": null}, "options": [{"id": "emLDn", "text": "$4.4$", "image": null, "isCorrect": false}, {"id": "VVwPQ", "text": "$6$", "image": null, "isCorrect": true}, {"id": "vMppz", "text": "$24$", "image": null, "isCorrect": false}, {"id": "Jjbds", "text": "$18$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fvEA_8lzZ3cGyjkIEaxwsDTH_zQUGL0cGe6xBdb_b2E.original.fullsize.png\"/><br/>Number of masses will remain constant<br/>$\\begin{aligned}<br/>& \\mathrm{n}_1+\\mathrm{n}_2=\\mathrm{n}_{\\mathrm{f}} \\\\\n& \\frac{\\mathrm{P}_1 \\mathrm{~V}_1}{\\mathrm{RT}_1}+\\frac{\\mathrm{P}_2 \\mathrm{~V}_2}{\\mathrm{RT}_2}=\\frac{\\mathrm{P}_{\\mathrm{f}} \\mathrm{~V}_{\\mathrm{f}}}{\\mathrm{RT}_{\\mathrm{f}}} \\\\\n& \\frac{8 \\times 2 \\mathrm{~V}}{\\mathrm{R} \\times 1000}+\\frac{7 \\times \\mathrm{V}}{\\mathrm{R} \\times 500}=\\frac{\\mathrm{P}_{\\mathrm{f}}(3 \\mathrm{~V})}{\\mathrm{R} \\times 600} \\\\\n& \\frac{16}{1000}+\\frac{14}{1000}=\\frac{\\mathrm{P}_{\\mathrm{f}}}{\\mathrm{R} \\times 600} \\\\\n& \\frac{30}{1000}=\\frac{\\mathrm{P}_{\\mathrm{f}}}{200} \\\\\n& \\mathrm{P}_{\\mathrm{f}}=6 \\mathrm{kPa}<br/>\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "6f4bf732982f49f2b4949c3725ef959b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/QJ9Xnltlw0tHG.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/QJ9Xnltlw0tHG.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d80978a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2025 (4 Apr Shift 2)", "title": "JEE Main 2025 (4 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eeaac8b73881fdaea1da", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d9760c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2025 (24 Jan Shift 1)", "title": "JEE Main 2025 (24 Jan Shift 1)"}], "question": {"text": "An ideal gas goes from an initial state to final state. During the process, the pressure of gas increases linearly with temperature.\nA. The work done by gas during the process is zero.\nB. The heat added to gas is different from change in its internal energy.\nC. The volume of the gas is increased.\nD. The internal energy of the gas is increased.\nE. The process is isochoric (constant volume process)\nChoose the correct answer from the options given below:", "image": null}, "options": [{"id": "0y2KT", "text": "E Only", "image": null, "isCorrect": false}, {"id": "ZKqJM", "text": "A, B, C, D Only", "image": null, "isCorrect": false}, {"id": "lpP2Y", "text": "A, D, E Only", "image": null, "isCorrect": true}, {"id": "s8bv6", "text": "A, C Only", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given that\n$\\mathrm{P}=\\mathrm{kT}$\n$\\frac{\\mathrm{P}}{\\mathrm{~T}}=\\text { constant }$\n$\\therefore$ Volume is constant or isochoric process.\n$\\begin{aligned}\n& \\therefore \\mathrm{W}_{\\mathrm{D}}=0 \\\\\n& \\therefore \\mathrm{Q}=\\Delta \\mathrm{U}\n\\end{aligned}$\n\nAlso temperature increases hence internal energy increases.", "image": null}, "videoSolution": {"videoId": "c8ae672e6b5f4c4a9516ed5e8f0fa7e6", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/0FPPg6jjRzZBL.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/0FPPg6jjRzZBL.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["MULTI_STATEMENT"], "syllabusCategory": "noChange", "previousYear": {"_id": "67a2eb5ca6d4514bf2d9760c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2025 (24 Jan Shift 1)", "title": "JEE Main 2025 (24 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2ee99c8b73881fdaea149", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d9760a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T09:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 1)", "title": "JEE Main 2025 (23 Jan Shift 1)"}], "question": {"text": "$$ \\text{Match the LIST-I with LIST-II} $$ \\[\n\\begin{array}{|l|p{6cm}|l|p{4cm}|}\n\\hline \\textbf{LIST-I} &  & \\textbf{LIST-II} &  \\\\\n\\hline A. & \\text{Pressure varies inversely with volume of an ideal gas.} & I. & \\text{Adiabatic process} \\\\\n\\hline B. & \\text{Heat absorbed goes partly to increase internal energy and partly to do work.} & II. & \\text{Isochoric process} \\\\\n\\hline C. & \\text{Heat is neither absorbed nor released by a system.} & III. & \\text{Isothermal process} \\\\\n\\hline D. & \\text{No work is done on or by a gas.} & IV. & \\text{Isobaric process} \\\\\n\\hline\n\\end{array}\n\\] \n $$ \\text{Choose the correct answer from the options given below:} $$", "image": null}, "options": [{"id": "2hlQg", "text": "A-III, B-IV, C-I, D-II", "image": null, "isCorrect": true}, {"id": "I2V17", "text": "A-I, B-IV, C-II, D-III", "image": null, "isCorrect": false}, {"id": "0PsGf", "text": "A-III, B-I, C-IV, D-II", "image": null, "isCorrect": false}, {"id": "jT6GY", "text": "A-I, B-III, C-II, D-IV", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\mathrm{A} \\rightarrow \\mathrm{P} \\propto \\frac{1}{\\mathrm{~V}} \\\\\n& \\Rightarrow \\mathrm{PV}=\\text { constant } \\\\\n& \\Rightarrow \\mathrm{nRT}=\\text { const. } \\Rightarrow \\mathrm{T}=\\text { const. }\n\\end{aligned}$\n\nHence Isothermal III\nB $\\rightarrow$ IV\n$\\mathrm{W} \\neq 0, \\Delta \\mathrm{U} \\neq 0, \\Delta \\mathrm{Q} \\neq 0$ [only isobaric]\n$\\mathrm{C} \\rightarrow \\mathrm{I} \\Delta \\mathrm{Q}=0$ Adiabatic\n$\\mathrm{D} \\rightarrow$ II w $=0$ Isochoric\nIII, IV, I, II", "image": null}, "videoSolution": {"videoId": "7144c6118b794c5bbdec32fd9f286449", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/gFGYLDKYRawfL.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/gFGYLDKYRawfL.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "67a2eb5ca6d4514bf2d9760a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T09:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 1)", "title": "JEE Main 2025 (23 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2ee91c8b73881fdaea106", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d97609", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T14:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 2)", "title": "JEE Main 2025 (22 Jan Shift 2)"}], "question": {"text": "For a diatomic gas, if $\\gamma_1=\\left(\\frac{C p}{C v}\\right)$ for rigid molecules and $\\gamma_2=\\left(\\frac{C p}{C v}\\right)$ for another diatomic molecules, but also having vibrational modes. Then, which one of the following options is correct ? (Cp and Cv are specific heats of the gas at constant pressure and volume)", "image": null}, "options": [{"id": "bE6rL", "text": "$\\gamma_2=\\gamma_1$", "image": null, "isCorrect": false}, {"id": "NKQEP", "text": "$2 \\gamma_2=\\gamma_1$", "image": null, "isCorrect": false}, {"id": "ocuNl", "text": "$\\gamma_2 \\lt \\gamma_1$", "image": null, "isCorrect": true}, {"id": "7oAVJ", "text": "$\\gamma_2\\gt\\gamma_1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For rigid diatomic molecules\n$\\begin{array}{ll} \n& f=5 \\\\\n\\therefore & \\gamma_1=\\frac{7}{5}=1.4\n\\end{array}$\n\nFor non-rigid diatomic molecules\n$\\begin{array}{ll} \n& f=5+2=7 \\\\\n& \\gamma_2=\\frac{9}{7}=1.28 \\\\\n\\therefore & \\gamma_1>\\gamma_2\n\\end{array}$", "image": null}, "videoSolution": {"videoId": "95fac40ddabb476fae311c9f2412c3bb", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/MNlKc2qyLn7jV.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/MNlKc2qyLn7jV.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5ca6d4514bf2d97609", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T14:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 2)", "title": "JEE Main 2025 (22 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2ee90c8b73881fdaea0fa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d97609", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T14:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 2)", "title": "JEE Main 2025 (22 Jan Shift 2)"}], "question": {"text": "Given are statements for certain thermodynamic variables,\n(A) Internal energy, volume (V) and mass (M) are extensive variables.\n(B) Pressure (P), temperature (T) and density ( $\\rho$ ) are intensive variables.\n(C) Volume (V), temperature (T) and density ( $\\rho$ ) are intensive variables.\n(D) Mass (M), temperature (T) and internal energy are extensive variables.\n\nChoose the correct answer from the options given below :", "image": null}, "options": [{"id": "Ehp47", "text": "(B) and (C) Only", "image": null, "isCorrect": false}, {"id": "Ou5ko", "text": "(C) and (D) Only", "image": null, "isCorrect": false}, {"id": "P8YA9", "text": "(D) and (A) Only", "image": null, "isCorrect": false}, {"id": "ymMry", "text": "(A) and (B) Only", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Extensive variables depend on size and amount of system.\nExtensive : Volume, mass, internal energy\nIntensive : Pressure, temperature, density", "image": null}, "videoSolution": {"videoId": "1c62c56e94fa455e9c15bb6313f2bbde", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/cD0008u8tS8iG.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/cD0008u8tS8iG.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["MULTI_STATEMENT"], "syllabusCategory": "noChange", "previousYear": {"_id": "67a2eb5ca6d4514bf2d97609", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T14:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 2)", "title": "JEE Main 2025 (22 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6800f", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#947;</mi><mn>1</mn></msub></math> be the ratio of molar specific heat at constant pressure and molar specific heat at constant volume of a monoatomic gas and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#947;</mi><mn>2</mn></msub></math>&nbsp;be the similar ratio of diatomic gas. Considering the diatomic gas molecule as a rigid rotator, the ratio&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>&#947;</mi><mn>1</mn></msub><msub><mi>&#947;</mi><mn>2</mn></msub></mfrac></math>&nbsp;is:", "image": null}, "options": [{"id": "Vzb8L", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>27</mn><mn>35</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "oIHnR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>35</mn><mn>27</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "AUviG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>25</mn><mn>21</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "p4cHN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>21</mn><mn>25</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>As we know,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>v</mi></msub><mo>=</mo><mi>f</mi><mfrac><mi>R</mi><mn>2</mn></mfrac></math></p><p>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mi>p</mi></msub><mo>=</mo><msub><mi>C</mi><mi>v</mi></msub><mo>+</mo><mi>R</mi><mo>=</mo><mi>f</mi><mfrac><mi>R</mi><mn>2</mn></mfrac><mo>+</mo><mi>R</mi></math></p><p>Therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>=</mo><mfrac><msub><mi>C</mi><mi>p</mi></msub><msub><mi>C</mi><mi>v</mi></msub></mfrac><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mn>2</mn><mi>f</mi></mfrac></math></p><p>For monatomic gas,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>=</mo><mn>3</mn></math>&nbsp;and hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#947;</mi><mn>1</mn></msub><mo>=</mo><mfrac><mn>5</mn><mn>3</mn></mfrac></math></p><p>For diatomic gas, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>=</mo><mn>5</mn></math>&nbsp;and hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#947;</mi><mn>2</mn></msub><mo>=</mo><mfrac><mn>7</mn><mn>5</mn></mfrac></math></p><p>Required ratio,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>&#947;</mi><mn>1</mn></msub><msub><mi>&#947;</mi><mn>2</mn></msub></mfrac><mo>=</mo><mfrac><mn>25</mn><mn>21</mn></mfrac></math></p>", "image": null}, "videoSolution": {"videoId": "87423b79d98344b8831de9c140ab684d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/MpAy8D4X9pE1U.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/MpAy8D4X9pE1U.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T11:04:04.154Z"}, {"_id": "648b5a68417cc3fb48d66a8f", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf802", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-04T09:00:00.000Z", "isVisible": true, "shortName": "2020 (04 Sep Shift 1)", "title": "JEE Main 2020 (04 Sep Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mtext>C</mtext><mtext>p</mtext></msub><msub><mtext>C</mtext><mtext>v</mtext></msub></mfrac></math> ratio for ideal gases with different type of molecules:</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>Molecule Type</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext>C</mtext><mtext>p</mtext></msub><mo>/</mo><msub><mtext>C</mtext><mtext>v</mtext></msub></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>(A) Monoatomic</td>\t\t\t<td>(I)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>/</mo><mn>5</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>(B) Diatomic rigid molecules</td>\t\t\t<td>(II)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>/</mo><mn>7</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>(C) Diatomic non-rigid molecules</td>\t\t\t<td>(III)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>/</mo><mn>3</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>(D) Triatomic rigid molecules</td>\t\t\t<td>(IV)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>/</mo><mn>3</mn></math></td>\t\t</tr>\t</tbody></table>", "image": null}, "options": [{"id": "k559t", "text": "(A) &ndash; (IV), (B) &ndash; (II), (C) &ndash; (I), (D) &ndash; (III)", "isCorrect": false, "image": null}, {"id": "hA4jW", "text": "(A) &ndash; (III), (B) &ndash; (IV), (C) &ndash; (II), (D) &ndash; (I)", "isCorrect": false, "image": null}, {"id": "kH0dn", "text": "(A) &ndash; (IV), (B) &ndash; (I), (C) &ndash; (II), (D) &ndash; (III)", "isCorrect": true, "image": null}, {"id": "Wa5td", "text": "(A) &ndash; (II), (B) &ndash; (III), (C) &ndash; (I), (D) &ndash; (IV)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Relation between the ratio of specific heat and degree of freedom is given by,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mn>2</mn><mi>f</mi></mfrac><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mn>1</mn><mo>)</mo></math></p><p>For monoatomic molecule,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>=</mo><mn>3</mn></math></p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">&#947;</mi><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>=</mo><mfrac><mn>5</mn><mn>3</mn></mfrac></math></p><p>For diatomic rigid molecule&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>=</mo><mn>5</mn></math></p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#947;</mi><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mn>2</mn><mn>5</mn></mfrac><mo>=</mo><mfrac><mn>7</mn><mn>5</mn></mfrac></math></p><p>For diatomic non-rigid molecule&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>=</mo><mn>7</mn></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#947;</mi><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mn>2</mn><mn>7</mn></mfrac><mo>=</mo><mfrac><mn>9</mn><mn>7</mn></mfrac></math></p><p>For&nbsp;Triatomic rigid molecule&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>=</mo><mn>6</mn></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#947;</mi><mo>=</mo><mn>1</mn><mo>+</mo><mfrac><mn>2</mn><mn>6</mn></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["MATCH_THE_LIST"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ecde3d91842a5cf802", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-04T09:00:00.000Z", "isVisible": true, "shortName": "2020 (04 Sep Shift 1)", "title": "JEE Main 2020 (04 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d657c4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "JEE Main 2007"}], "question": {"text": "When a system is taken from state $i$ to state $f$ along the path $\\mathrm{iaf}$, it is found that $Q=50 \\mathrm{~cal}$ and $\\mathrm{W}=20 \\mathrm{~cal}$. Along the path' $\\mathrm{ibf}$ $\\mathrm{Q=36 ~cal}$. $\\mathrm{W}$ along the path $\\mathrm{ibf}$ is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/t_xT3GwsTcXXQvk1dV40FKHIXyCwdZ0L6_DJ4wz-izY.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "Cuaz9", "text": "\n$6 \\mathrm{~cal}$\n", "image": null, "isCorrect": true}, {"id": "MpvWw", "text": "\n$16 \\mathrm{~cal}$.\n", "image": null, "isCorrect": false}, {"id": "VZEG9", "text": "\n$66 \\mathrm{~cal}$.\n", "image": null, "isCorrect": false}, {"id": "cgZiJ", "text": "\n$14 \\mathrm{~cal}$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "questionStructure": ["DIAGRAM_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7c7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "JEE Main 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65566", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "Which of the following statements is correct for any thermodynamic system?", "image": null}, "options": [{"id": "FQJod", "text": "\nThe internal energy changes in all processes.\n", "image": null, "isCorrect": false}, {"id": "PG0TE", "text": "\nInternal energy and entropy are state functions.\n", "image": null, "isCorrect": true}, {"id": "1LWGj", "text": "\nThe change in entropy can never be zero.\n", "image": null, "isCorrect": false}, {"id": "z7PdF", "text": "\nThe work done in an adiabatic process is always zero.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d6549b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "Which of the following parameters does not characterize the thermodynamic state of matter?", "image": null}, "options": [{"id": "vDD7Y", "text": "\ntemperature\n", "image": null, "isCorrect": false}, {"id": "OYucL", "text": "\nPressure\n", "image": null, "isCorrect": false}, {"id": "svUDm", "text": "\nWork\n", "image": null, "isCorrect": true}, {"id": "xnbVb", "text": "\nVolume", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "648b5a73417cc3fb48d69195", "title": "First Law of Thermodynamics", "totalQuestions": 42, "questions": [{"_id": "69d8073981239f6567c4f33f", "type": "singleCorrect", "question": {"text": "Initial pressure and volume of a monoatomic ideal gas are $P$ and $V$. The change in internal energy of this gas in adiabatic expansion to volume $V_{final}=27V$ is ________ J.", "image": null}, "options": [{"id": "8n5Aj", "text": "$-2PV(3\\sqrt{3}-1)$", "isCorrect": false, "image": null}, {"id": "7cYXK", "text": "$\\dfrac{4}{3}PV$", "isCorrect": false, "image": null}, {"id": "O9ftn", "text": "$-\\dfrac{4}{3}PV$", "isCorrect": true, "image": null}, {"id": "TDzSZ", "text": "$\\dfrac{3}{4}PV$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a monoatomic ideal gas, the ratio of specific heats is $\\gamma = \\dfrac{5}{3}$.<br><br>In an adiabatic process, $PV^{\\gamma} = \\text{constant}$.<br><br>$P_1 V_1^{\\gamma} = P_2 V_2^{\\gamma}$<br><br>$P V^{5/3} = P_2 (27V)^{5/3}$<br><br>$P_2 = P \\left(\\dfrac{1}{27}\\right)^{5/3} = \\dfrac{P}{243}$<br><br>The change in internal energy is given by:<br><br>$\\Delta U = \\dfrac{P_2 V_2 - P_1 V_1}{\\gamma - 1}$<br><br>Substituting the values:<br><br>$\\Delta U = \\dfrac{\\left(\\dfrac{P}{243}\\right)(27V) - PV}{\\dfrac{5}{3} - 1}$<br><br>$\\Delta U = \\dfrac{\\dfrac{PV}{9} - PV}{\\dfrac{2}{3}}$<br><br>$\\Delta U = \\dfrac{-\\dfrac{8}{9}PV}{\\dfrac{2}{3}} = -\\dfrac{4}{3}PV$<br><br>Answer: $-\\dfrac{4}{3}PV$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7ddb", "title": "JEE Main 2026 (08 April Shift 2)", "shortName": "2026 (08 April Shift 2)", "isVisible": true, "heldOn": "2026-04-08T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "03858409c5664fb7859217e78c026f0e", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/lzaVfFm6xC6UU.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/lzaVfFm6xC6UU.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7ddb", "title": "JEE Main 2026 (08 April Shift 2)", "shortName": "2026 (08 April Shift 2)", "isVisible": true, "heldOn": "2026-04-08T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8073981239f6567c4f33e", "type": "singleCorrect", "question": {"text": "One mole of diatomic gas having rotational modes only is kept in a cylinder with a piston system. The cross-section area of the cylinder is $4$ cm$^2$. The gas is heated slowly to raise the temperature by $1.2\\,^\\circ$C during which the piston moves by $25$ mm. The amount of heat supplied to the gas is ________ J. (Atmospheric pressure $=100$ kPa, $R=8.3$ J/mol·K) (Neglect mass of the piston)", "image": null}, "options": [{"id": "CO0gk", "text": "$24.8$", "isCorrect": false, "image": null}, {"id": "MQlFY", "text": "$25$", "isCorrect": true, "image": null}, {"id": "gVtzG", "text": "$15.04$", "isCorrect": false, "image": null}, {"id": "lXEqi", "text": "$29.98$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the first law of thermodynamics:<br>$Q = \\Delta U + W$<br><br>Since the gas is diatomic with rotational modes only, the degrees of freedom are $f = 5$, so:<br>$C_V = \\dfrac{5}{2}R$<br><br>For $n = 1\\text{ mole}$ and $\\Delta T = 1.2\\text{ K}$:<br>$\\Delta U = nC_V\\Delta T = 1 \\times \\dfrac{5}{2} \\times 8.3 \\times 1.2 = 24.9\\text{ J}$<br><br>Work done by the gas:<br>$W = P\\,\\Delta V$<br><br>Cross-sectional area of the piston:<br>$A = 4\\text{ cm}^2 = 4 \\times 10^{-4}\\text{ m}^2$<br><br>Piston displacement:<br>$x = 25\\text{ mm} = 2.5 \\times 10^{-2}\\text{ m}$<br><br>Change in volume:<br>$\\Delta V = A \\cdot x = (4 \\times 10^{-4})(2.5 \\times 10^{-2}) = 1 \\times 10^{-5}\\text{ m}^3$<br><br>With $P = 100\\text{ kPa} = 10^5\\text{ Pa}$:<br>$W = (10^5)(1 \\times 10^{-5}) = 1\\text{ J}$<br><br>Therefore, the heat supplied is:<br>$Q = \\Delta U + W = 24.9 + 1 = 25.9\\text{ J}$<br><br>Hence, the heat supplied to the gas is $25.9\\text{ J}$.", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7ddb", "title": "JEE Main 2026 (08 April Shift 2)", "shortName": "2026 (08 April Shift 2)", "isVisible": true, "heldOn": "2026-04-08T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "8aa886febe8b4cf19542d830e07b4fab", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Gm19jCHadhSvR.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Gm19jCHadhSvR.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7ddb", "title": "JEE Main 2026 (08 April Shift 2)", "shortName": "2026 (08 April Shift 2)", "isVisible": true, "heldOn": "2026-04-08T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8072d81239f6567c4f2b5", "type": "numerical", "question": {"text": "$5$ moles of unknown gas is heated at constant volume from $10 \\, °C$ to $20 \\, °C$. The molar specific heat of this gas at constant pressure $c_p = 8$ cal/mol.°C and $R = 8.36$ J/mol.°C. The change in the internal energy of the gas is _______ calorie.", "image": null}, "options": [], "correctValue": "300", "solution": {"text": "Given $n = 5$ moles, $\\Delta T = 20^{\\circ}\\text{C} - 10^{\\circ}\\text{C} = 10^{\\circ}\\text{C}$.<br><br>The molar specific heat at constant pressure is $c_p = 8 \\text{ cal/mol}\\cdot^{\\circ}\\text{C}$.<br><br>The universal gas constant is $R = 8.36 \\text{ J/mol}\\cdot^{\\circ}\\text{C}$.<br><br>Converting $R$ into calories, we use $1 \\text{ cal} = 4.18 \\text{ J}$:<br><br>$R = \\dfrac{8.36}{4.18} \\text{ cal/mol}\\cdot^{\\circ}\\text{C} = 2 \\text{ cal/mol}\\cdot^{\\circ}\\text{C}$<br><br>Using Mayer's relation, the molar specific heat at constant volume is:<br><br>$c_v = c_p - R = 8 - 2 = 6 \\text{ cal/mol}\\cdot^{\\circ}\\text{C}$<br><br>The change in internal energy of the gas is given by:<br><br>$\\Delta U = n c_v \\Delta T$<br><br>$\\Delta U = 5 \\times 6 \\times 10 = 300 \\text{ cal}$<br><br>Answer: $300$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "7dadb4e5acf64c459f999bb6b08b8f33", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/twgepjpix21Qp.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/twgepjpix21Qp.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8075981239f6567c4f4b3", "type": "singleCorrect", "question": {"text": "Heat is supplied to a diatomic gas at constant pressure. Then the ratio of $\\Delta Q : \\Delta U : \\Delta W$ is _______.", "image": null}, "options": [{"id": "jwAuL", "text": "$2 : 3 : 5$", "isCorrect": false, "image": null}, {"id": "vu7YB", "text": "$5 : 3 : 2$", "isCorrect": false, "image": null}, {"id": "eg1mY", "text": "$2 : 5 : 7$", "isCorrect": false, "image": null}, {"id": "QQEPf", "text": "$7 : 5 : 2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For a diatomic gas, the number of degrees of freedom is $f = 5$.<br><br>The molar heat capacity at constant volume is $C_v = \\dfrac{f}{2}R = \\dfrac{5}{2}R$.<br><br>The molar heat capacity at constant pressure is $C_p = C_v + R = \\dfrac{7}{2}R$.<br><br>At constant pressure, the heat supplied is $\\Delta Q = nC_p\\Delta T = n\\left(\\dfrac{7}{2}R\\right)\\Delta T$.<br><br>The change in internal energy is $\\Delta U = nC_v\\Delta T = n\\left(\\dfrac{5}{2}R\\right)\\Delta T$.<br><br>The work done by the gas is $\\Delta W = nR\\Delta T = n\\left(\\dfrac{2}{2}R\\right)\\Delta T$.<br><br>The ratio $\\Delta Q : \\Delta U : \\Delta W$ is $\\dfrac{7}{2} : \\dfrac{5}{2} : \\dfrac{2}{2} = 7 : 5 : 2$.<br><br>Answer: $7 : 5 : 2$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "5ca1d9ffa3684994b29cc4d1911126c1", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/3Utr4sqNJMiGB.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/3Utr4sqNJMiGB.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1a58bfdbb243563975a", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f48", "title": "JEE Main 2026 (24 January Shift 2)", "shortName": "2026 (24 January Shift 2)", "isVisible": true, "heldOn": "2026-01-24T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "10 mole of an ideal gas is undergoing the process shown in the figure. The heat involved in the process from $P_{1}$ to $P_{2}$ is $\\alpha$ Joule ($P_{1}=21.7 \\mathrm{~Pa}$ and $\\left.P_{2}=30 \\mathrm{~Pa}, \\mathrm{C}_{v}=21 \\mathrm{~J} / \\mathrm{K}. \\mathrm{mol}, R=8.3 \\mathrm{~J} / \\mathrm{mol}. \\mathrm{K}\\right)$. The value of $\\alpha$ is $\\_\\_\\_\\_$. <br> <img style=\"width:300px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/24S2_q_30_1.png\">", "image": null}, "options": [{"id": "wHOJW", "text": "21", "isCorrect": true, "image": null}, {"id": "WjMgb", "text": "15", "isCorrect": false, "image": null}, {"id": "3csq8", "text": "28", "isCorrect": false, "image": null}, {"id": "oxmvI", "text": "24", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "From the given $P-V$ diagram, the process from $P_1$ to $P_2$ is an isochoric process because the volume remains constant at $V = 1\\text{ m}^3$.<br>For an isochoric process, the work done $W = 0$.<br>According to the first law of thermodynamics, the heat involved is $Q = \\Delta U + W = \\Delta U$.<br>The change in internal energy is given by $\\Delta U = n C_v \\Delta T$.<br>Using the ideal gas equation $PV = nRT$, we have $n\\Delta T = \\frac{V\\Delta P}{R}$.<br>Substituting this into the expression for $Q$:<br>$Q = C_v \\left( \\frac{V(P_2 - P_1)}{R} \\right)$<br>Given values: $n = 10$ moles, $V = 1\\text{ m}^3$, $P_1 = 21.7\\text{ Pa}$, $P_2 = 30\\text{ Pa}$, $C_v = 21\\text{ J/mol}\\cdot\\text{K}$, and $R = 8.3\\text{ J/mol}\\cdot\\text{K}$.<br>$Q = 21 \\times \\frac{1 \\times (30 - 21.7)}{8.3}$<br>$Q = 21 \\times \\frac{8.3}{8.3} = 21\\text{ J}$.<br>Thus, the value of $\\alpha$ is 21.", "image": null}, "videoSolution": {"videoId": "ba003068056e4f68a3e261b20b930ad3", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/0Id4Y2RsrTZD9.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/0Id4Y2RsrTZD9.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "6983c0cb2f90f45c755e5f48", "title": "JEE Main 2026 (24 January Shift 2)", "shortName": "2026 (24 January Shift 2)", "isVisible": true, "heldOn": "2026-01-24T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c19f8bfdbb243563970c", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f47", "title": "JEE Main 2026 (24 January Shift 1)", "shortName": "2026 (24 January Shift 1)", "isVisible": true, "heldOn": "2026-01-24T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Density of water at $4{ }^{\\circ} \\mathrm{C}$ and $20^{\\circ} \\mathrm{C}$ are $1000 \\mathrm{~kg} / \\mathrm{m}^{3}$ and $998 \\mathrm{~kg} / \\mathrm{m}^{3}$ respectively. The increase in internal energy of 4 kg of water when it is heated from $4{ }^{\\circ} \\mathrm{C}$ to $20^{\\circ} \\mathrm{C}$ is $\\_\\_\\_\\_$ J. <br> (specific heat capacity of water $=4.2 \\mathrm{~J} / \\mathrm{kg}$. and 1 atmospheric pressure $=10^{5} \\mathrm{~Pa}$)", "image": null}, "options": [{"id": "JdpD6", "text": "234699.2", "isCorrect": false, "image": null}, {"id": "FtQqJ", "text": "315826.2", "isCorrect": false, "image": null}, {"id": "6WS22", "text": "258700.8", "isCorrect": false, "image": null}, {"id": "aHHFB", "text": "268799.2", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Heat absorbed by water: $Q = mc\\Delta T = 4 \\times 4200 \\times 16 = 268800$ J. <br>Volume change: $V_1 = 4/1000 = 0.004$ m³ at 4°C, $V_2 = 4/998 ≈ 0.00401$ m³ at 20°C. <br>Work done by water at constant pressure: $W = P_{atm}\\Delta V = 10^5 \\times 0.00001 = 0.8$ J. <br>By first law of thermodynamics: $\\Delta U = Q - W = 268800 - 0.8 = 268799.2$ J", "image": null}, "videoSolution": {"videoId": "387895d8faa743f8a7b5084420373bef", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/OwRHpF9OwiQ9t.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/OwRHpF9OwiQ9t.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f47", "title": "JEE Main 2026 (24 January Shift 1)", "shortName": "2026 (24 January Shift 1)", "isVisible": true, "heldOn": "2026-01-24T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c19a8bfdbb24356396d2", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "The internal energy of a monoatomic gas is 3 nRT. One mole of helium is kept in a cylinder having internal cross section area of $17 \\mathrm{~cm}^{2}$ and fitted with a light movable frictionless piston. The gas is heated slowly by suppling 126 J heat. If the temperature rises by $4^{\\circ} \\mathrm{C}$, then the piston will move $\\_\\_\\_\\_$ cm. <br> (atmospheric pressure $=10^{5} \\mathrm{~Pa}$)", "image": null}, "options": [{"id": "uh1M8", "text": "1.45", "isCorrect": false, "image": null}, {"id": "By3Bh", "text": "15.5", "isCorrect": true, "image": null}, {"id": "Ph7A1", "text": "1.55", "isCorrect": false, "image": null}, {"id": "PN44Y", "text": "14.5", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The question states the internal energy of the gas is $U = 3nRT$.<br>The change in internal energy is $\\Delta U = 3nR\\Delta T$.<br>Given: $n = 1$ mole, $\\Delta T = 4^{\\circ}C = 4$ K, and $R \\approx 8.314$ J/mol·K.<br>$\\Delta U = 3 \\times 1 \\times 8.314 \\times 4 = 99.768$ J.<br>According to the first law of thermodynamics, $\\Delta Q = \\Delta U + W$.<br>Given heat supplied $\\Delta Q = 126$ J.<br>Work done by the gas $W = \\Delta Q - \\Delta U = 126 - 99.768 = 26.232$ J.<br>Since the piston is light and movable, the process occurs at constant atmospheric pressure $P = 10^5$ Pa.<br>Work done $W = P \\Delta V = P(A \\times d)$, where $A$ is the cross-section area and $d$ is the displacement of the piston.<br>$A = 17 \\text{ cm}^2 = 17 \\times 10^{-4} \\text{ m}^2$.<br>$26.232 = 10^5 \\times (17 \\times 10^{-4}) \\times d$.<br>$26.232 = 170 \\times d$.<br>$d = \\frac{26.232}{170} \\approx 0.1543$ m.<br>Converting to cm: $d \\approx 15.43$ cm.<br>Rounding to the nearest option, we get $15.5$ cm.", "image": null}, "videoSolution": {"videoId": "25a190add3844b8f88ec37e03bf62bc6", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/T9RVTUw6qPGB6.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/T9RVTUw6qPGB6.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c17d8bfdbb2435639561", "type": "numerical", "level": 1, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f41", "title": "JEE Main 2026 (21 January Shift 1)", "shortName": "2026 (21 January Shift 1)", "isVisible": true, "heldOn": "2026-01-21T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "10 mole of oxygen is heated at constant volume from $30^{\\circ} \\mathrm{C}$ to $40^{\\circ} \\mathrm{C}$. The change in the internal energy of the gas is $\\_\\_\\_\\_$ cal. (The molecular specific heat of oxygen at constant pressure, $C_{P}=7 \\mathrm{cal} / \\mathrm{mol}.{ }^{\\circ} \\mathrm{C}$ and $\\mathrm{R}=2 \\mathrm{cal} / \\mathrm{mol}.{ }^{\\circ} \\mathrm{C}$.)", "image": null}, "options": [], "correctValue": 500, "solution": {"text": "Given: $n = 10$ mol,<br>$\\Delta T = 40 - 30 = 10°C$, <br>$C_P = 7$ cal/mol·°C, <br>$R = 2$ cal/mol·°C<br>For ideal gas: $C_V = C_P - R = 7 - 2 = 5$ cal/mol·°C<br>Change in internal energy: $\\Delta U = nC_V\\Delta T = 10 \\times 5 \\times 10 = 500$ cal", "image": null}, "videoSolution": {"videoId": "96a1dfbf76f54897a379d6cfd07f4613", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/ZZdouSySEafyg.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/ZZdouSySEafyg.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f41", "title": "JEE Main 2026 (21 January Shift 1)", "shortName": "2026 (21 January Shift 1)", "isVisible": true, "heldOn": "2026-01-21T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c687c09d044e4c1a1d1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2025 (3 Apr Shift 1)", "title": "JEE Main 2025 (3 Apr Shift 1)"}], "question": {"text": "During the melting of a slab of ice at 273 K at atmospheric pressure :", "image": null}, "options": [{"id": "Pja4M", "text": "Internal energy of ice-water system remains unchanged.", "image": null, "isCorrect": false}, {"id": "01PU6", "text": "Positive work is done by the ice-water system on the atmosphere.", "image": null, "isCorrect": false}, {"id": "oNntk", "text": "Internal energy of the ice-water system decreases.", "image": null, "isCorrect": false}, {"id": "BlIf8", "text": "Positive work is done on the ice-water system by the atmosphere.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Volume decreases during melting of ice so positive work is done on ice water system by atmosphere<br/>Heat absorbed by ice water so $\\Delta \\mathrm{Q}$ is positive, work done by ice water system is negative<br/>Hence by first law of thermodynamics<br/>$\\Delta \\mathrm{U}=\\Delta \\mathrm{Q}+\\Delta \\mathrm{W}=\\text { Positive }$<br/>So internal energy increases", "image": null}, "videoSolution": {"videoId": "ba5c8af1c6da4f40b0640ac9f716d5a0", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/yElRf3Wbnrd0l.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/yElRf3Wbnrd0l.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d80978d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2025 (3 Apr Shift 1)", "title": "JEE Main 2025 (3 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542c687c09d044e4c1a1d0", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-02T14:00:00.000Z", "isVisible": true, "shortName": "2025 (2 Apr Shift 2)", "title": "JEE Main 2025 (2 Apr Shift 2)"}], "question": {"text": "The internal energy of air in $4 \\mathrm{~m} \\times 4 \\mathrm{~m} \\times 3 \\mathrm{~m}$ sized room at 1 atmospheric pressure will be _______ $\\times 10^6 \\mathrm{~J}$. (Consider air as diatomic molecule)", "image": null}, "options": [], "correctValue": "12", "solution": {"text": "To find the internal energy of gas in the room.<br/>$\\begin{aligned}<br/>& \\mathrm{U}=\\mathrm{nC}_{\\mathrm{v}} \\mathrm{~T}=\\mathrm{n} \\frac{5 \\mathrm{RT}}{2} \\\\\n& =\\frac{5}{2} \\mathrm{PV}=\\frac{5}{2} \\times 10^5 \\times 48=12 \\times 10^6 \\mathrm{~J}<br/>\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "21c3f3e294f448649be86770067ab9af", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/e4zdGD0uaXIEt.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/e4zdGD0uaXIEt.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d80978c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-02T14:00:00.000Z", "isVisible": true, "shortName": "2025 (2 Apr Shift 2)", "title": "JEE Main 2025 (2 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eeb5c8b73881fdaea232", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d9760d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2025 (24 Jan Shift 2)", "title": "JEE Main 2025 (24 Jan Shift 2)"}], "question": {"text": "Given below are two statements. One is labelled as Assertion (A) and the other is labelled as Reason (R).\nAssertion (A) : In an insulated container, a gas is adiabatically shrunk to half of its initial volume. The temperature of the gas decreases.\nReason (R): Free expansion of an ideal gas is an irreversible and an adiabatic process.\nIn the light of the above statements, choose the correct answer from the options given below :", "image": null}, "options": [{"id": "I1HrZ", "text": "Both $(\\mathbf{A})$ and $(\\mathbf{R})$ are true but $(\\mathbf{R})$ is NOT the correct explanation of $(\\mathbf{A})$", "image": null, "isCorrect": false}, {"id": "B8BpT", "text": "(A) is false but (R) is true", "image": null, "isCorrect": true}, {"id": "mDFRD", "text": "(A) is true but (R) is false", "image": null, "isCorrect": false}, {"id": "g5eRC", "text": "Both $(\\mathbf{A})$ and $(\\mathbf{R})$ are true and $(\\mathbf{R})$ is the correct explanation of $(\\mathbf{A})$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If the container is insulated then temperature is expected to increase in adiabatic compression. So (A) is wrong.\nAnd free expansion is irreversible and adiabatic process. So (R) is correct.", "image": null}, "videoSolution": {"videoId": "4c230fa9f6d04940adbd9cd8fe809bd3", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/tAQ3rVpilGFi6.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/tAQ3rVpilGFi6.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["ASSERTION_REASON"], "syllabusCategory": "noChange", "previousYear": {"_id": "67a2eb5da6d4514bf2d9760d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2025 (24 Jan Shift 2)", "title": "JEE Main 2025 (24 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eeb3c8b73881fdaea224", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5da6d4514bf2d9760d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2025 (24 Jan Shift 2)", "title": "JEE Main 2025 (24 Jan Shift 2)"}], "question": {"text": "The magnitude of heat exchanged by a system for the given cyclic process ABCA (as shown in figure) is (in SI unit) :\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/nN5IzO40VO4ldxkewipAuYOk3fi7nWQKK6sIjQcmTRE.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "PKNIj", "text": "$5 \\pi$", "image": null, "isCorrect": true}, {"id": "nh535", "text": "$40 \\pi$", "image": null, "isCorrect": false}, {"id": "Siyi5", "text": "$10 \\pi$", "image": null, "isCorrect": false}, {"id": "T4hI1", "text": "zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6S9FiJB_lQtZHWjLhiFsPat-2oggwDXTMvoh5o9pGDQ.original.fullsize.png\"><br>\n\n\n\n$\\begin{aligned} & \\mathrm{W}=\\frac{1}{2} \\pi \\mathrm{R}^2 \\\\ & =\\frac{1}{2} \\times \\pi \\times\\left(\\frac{200}{2} \\times 10^3\\right) \\times \\frac{200}{2} \\times 10^{-6} \\\\ & =\\frac{10 \\pi}{2}=5 \\pi \\mathrm{~J}\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "7d0ffd70f66e418e8f35090106c50066", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/214ll8Z4s0Jrm.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/214ll8Z4s0Jrm.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "67a2eb5da6d4514bf2d9760d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2025 (24 Jan Shift 2)", "title": "JEE Main 2025 (24 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eeacc8b73881fdaea1eb", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d9760c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2025 (24 Jan Shift 1)", "title": "JEE Main 2025 (24 Jan Shift 1)"}], "question": {"text": "The temperature of 1 mole of an ideal monoatomic gas is increased by $50^{\\circ} \\mathrm{C}$ at constant pressure. The total heat added and change in internal energy are $E_1$ and $E_2$, respectively. If $\\frac{E_1}{E_2}=\\frac{x}{9}$ then the value of $x$ is _____", "image": null}, "options": [], "correctValue": "15", "solution": {"text": "Given that process is isobaric $\\Delta \\mathrm{T}=50^{\\circ} \\mathrm{C}$\nQ in isobaric process $=\\mathrm{nC}_{\\mathrm{p}} \\Delta \\mathrm{T}=\\mathrm{E}_1$\n$\\Delta \\mathrm{U}$ in isobaric process $=\\mathrm{nC}_{\\mathrm{v}} \\Delta \\mathrm{T}=\\mathrm{E}_2$\n$\\therefore \\frac{\\mathrm{E}_1}{\\mathrm{E}_2}=\\frac{\\mathrm{C}_{\\mathrm{P}}}{\\mathrm{C}_{\\mathrm{v}}}=\\gamma$\n\nGiven, gas is monoatomic\n$\\begin{aligned}\n\\therefore \\gamma & =1+\\frac{2}{\\mathrm{f}} \\\\\n& =1+\\frac{2}{3} \\\\\n& =\\frac{5}{3}\n\\end{aligned}$\n\nNow, as per question.\n$\\begin{aligned}\n& \\frac{5}{3}=\\frac{x}{9} \\\\\n& x=15\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "3d414f7bacac4f46a282781cfca65fae", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/KmJB8lQCqLGip.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/KmJB8lQCqLGip.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5ca6d4514bf2d9760c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2025 (24 Jan Shift 1)", "title": "JEE Main 2025 (24 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2eea2c8b73881fdaea195", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67a2eb5ca6d4514bf2d9760b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T14:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 2)", "title": "JEE Main 2025 (23 Jan Shift 2)"}], "question": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/9Qu4S6kMxsiC1QGKxwd_kddKAMEbrl97CuiWYSnki80.original.fullsize.png\"/><br/>\nUsing the given $\\mathrm{P}-\\mathrm{V}$ diagram, the work done by an ideal gas along the path ABCD is :", "image": null}, "options": [{"id": "yvdfV", "text": "$3 \\mathrm{P}_0 \\mathrm{~V}_0$", "image": null, "isCorrect": false}, {"id": "AYGDd", "text": "$-4 \\mathrm{P}_0 \\mathrm{~V}_0$", "image": null, "isCorrect": false}, {"id": "h7YDq", "text": "$-3 \\mathrm{P}_0 \\mathrm{~V}_0$", "image": null, "isCorrect": true}, {"id": "KRhkv", "text": "$4 \\mathrm{P}_0 \\mathrm{~V}_0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/uoEzQ0C3anQbcnqgS31I_H-q2lpo4axe9Lq1iMzsG30.original.fullsize.png\"><br>\nArea under graph will be magnitude of graph and being counterclockwise graph it would be negative\n$\\begin{aligned}\n& \\text { Area }=2 P_0 \\times V_0+P_0 V_0=3 P_0 V_0 \\\\\n& \\mathrm{~W}=-3 P_0 V_0\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "ebb46ef43d354cb0975a19bccfaab77d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/2wcFhm2IgokLf.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/2wcFhm2IgokLf.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "67a2eb5ca6d4514bf2d9760b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-23T14:00:00.000Z", "isVisible": true, "shortName": "2025 (23 Jan Shift 2)", "title": "JEE Main 2025 (23 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446732970e6e9ab542d11b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ef278297dee60eda6d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 2)", "title": "JEE Main 2024 (06 Apr Shift 2)"}], "question": {"text": "A total of $48 \\mathrm{~J}$ heat is given to one mole of helium kept in a cylinder. The temperature of helium increases by $2^{\\circ} \\mathrm{C}$. The work done by the gas is:\nGiven, $\\mathrm{R}=8.3 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}$.", "image": null}, "options": [{"id": "4uXTu", "text": "$24.9 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "1Vm0X", "text": "$72.9 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "fBzLw", "text": "$48 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "SBBiN", "text": "$23.1 \\mathrm{~J}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$1^{\\text {st }}$ law of thermodynamics\n$\\begin{aligned}\n& \\Delta \\mathrm{Q}=\\Delta \\mathrm{U}+\\mathrm{W} \\\\\n& \\Rightarrow+48=\\mathrm{nC}_{\\mathrm{v}} \\Delta \\mathrm{T}+\\mathrm{W} \\\\\n& \\Rightarrow 48=(1)\\left(\\frac{3 \\mathrm{R}}{2}\\right)(2)+\\mathrm{W} \\\\\n& \\Rightarrow \\mathrm{W}=48-3 \\times \\mathrm{R} \\\\\n& \\Rightarrow \\mathrm{W}=48-3 \\times(8.3) \\\\\n& \\Rightarrow \\mathrm{W}=23.1 \\text { Joule }\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda6d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 2)", "title": "JEE Main 2024 (06 Apr Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T10:42:39.376Z"}, {"_id": "6682bd71ba0e94a3c4025caa", "type": "singleCorrect", "level": 2, "questionLabels": [], "question": {"text": "<p>A thermodynamic system is taken from an original state <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> to an intermediate state <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> by a linear process as shown in the figure. Its volume is then reduced to the original value from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> by an isobaric process. The total work done by the gas from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> would be :</p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2a96272b-4254-4cee-84b3-193b8206f736.png\" style=\"width: 300px; height: 222px;\"/>", "image": null}, "options": [{"id": "D5Apx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>33800</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "tOcni", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2200</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "3gNrX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "3j3ZD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>800</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2a96272b-4254-4cee-84b3-193b8206f736.png\" style=\"width: 300px; height: 222px;\"/></p><p>Work done during the path <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>→</mo><mi mathvariant=\"normal\">B</mi></math> can be written as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"right center left\" columnspacing=\"0px\"><mtr><mtd><msub><mi>W</mi><mi>AB</mi></msub></mtd><mtd><mo>=</mo></mtd><mtd><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>(</mo><mn>8000</mn><mo>+</mo><mn>4000</mn><mo>)</mo><mo> </mo><mi>dyne</mi><mo> </mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>×</mo><mfrac><mrow><mn>1</mn><mo> </mo><mi mathvariant=\"normal\">N</mi></mrow><mrow><msup><mn>10</mn><mn>5</mn></msup><mo> </mo><mi>dyne</mi></mrow></mfrac><mo>×</mo><mfrac><mrow><mn>1</mn><mo> </mo><msup><mi>cm</mi><mn>2</mn></msup></mrow><mrow><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo> </mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></mrow></mfrac><mo>×</mo><mfenced><mrow><mn>7</mn><mo>-</mo><mn>3</mn></mrow></mfenced><mo> </mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></mrow></mtd></mtr><mtr><mtd></mtd><mtd><mo>=</mo></mtd><mtd><mn>2400</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></mtd></mtr></mtable></math></p><p>The work done during the process <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>→</mo><mi mathvariant=\"normal\">C</mi></math> is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"right center left\" columnspacing=\"0px\"><mtr><mtd><msub><mi>W</mi><mi>BC</mi></msub></mtd><mtd><mo>=</mo></mtd><mtd><mfenced><mrow><mn>4000</mn><mo> </mo><mi>dyne</mi><mo> </mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>2</mn></mrow></msup><mo>×</mo><mfrac><mrow><mn>1</mn><mo> </mo><mi mathvariant=\"normal\">N</mi></mrow><mrow><msup><mn>10</mn><mn>5</mn></msup><mo> </mo><mi>dyne</mi></mrow></mfrac><mo>×</mo><mfrac><mrow><mn>1</mn><mo> </mo><msup><mi>cm</mi><mn>2</mn></msup></mrow><mrow><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo> </mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></mrow></mfrac></mrow></mfenced><mo>×</mo><mfenced><mrow><mn>3</mn><mo>-</mo><mn>7</mn></mrow></mfenced><mo> </mo><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></mtd></mtr><mtr><mtd></mtd><mtd><mo>=</mo></mtd><mtd><mo>-</mo><mn>1600</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></mtd></mtr></mtable></math></p><p>Hence, the total work done is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"right center left\" columnspacing=\"0px\"><mtr><mtd><mi>W</mi></mtd><mtd><mo>=</mo></mtd><mtd><msub><mi>W</mi><mi>AB</mi></msub><mo>+</mo><msub><mi>W</mi><mi>BC</mi></msub></mtd></mtr><mtr><mtd></mtd><mtd><mo>=</mo></mtd><mtd><mn>2400</mn><mo> </mo><mi mathvariant=\"normal\">J</mi><mo>-</mo><mn>1600</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></mtd></mtr><mtr><mtd></mtd><mtd><mo>=</mo></mtd><mtd><mn>800</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></mtd></mtr></mtable></math></p>", "image": null}, "videoSolution": {"videoId": "d64ba7443f5945a3a72fdd8b5920459c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/RiGOZsBMx8BzB.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/RiGOZsBMx8BzB.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}], "questionStructure": ["GRAPH_BASED"], "previousYear": {"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T10:33:18.956Z"}, {"_id": "6682bd70ba0e94a3c4025ca9", "type": "singleCorrect", "level": 2, "questionLabels": [], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>08</mn><mo> </mo><mi>kg</mi></math> air is heated at constant volume through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>. The specific heat of air at constant volume is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>17</mn><mo> </mo><mi>kcal</mi><mo> </mo><msup><mi>kg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo> </mo><mo>°</mo><msup><mi mathvariant=\"normal\">C</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo> </mo><mi mathvariant=\"normal\">J</mi><mo>=</mo><mn>4</mn><mo>.</mo><mn>18</mn><mo> </mo><mi>joule</mi><mo> </mo><msup><mi>cal</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>. The change in its internal energy is approximately.", "image": null}, "options": [{"id": "OI3lP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>318</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "CgDXD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>298</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "yVjne", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>284</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}, {"id": "VdqOM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>142</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The amount of work done for the given process should be zero, as the process is an isochoric process.</p><p>Thus, the change in internal energy will be equal to the heat exchanged in the process. Mathematically,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mo>∆</mo><mi>U</mi></math></p><p>Now,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∆</mo><mi>U</mi><mo>=</mo><mi>m</mi><mi>s</mi><mo>∆</mo><mi>T</mi><mo> </mo><mo> </mo><mo> </mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p>From equation (1), it follows that</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"right center left\" columnspacing=\"0px\"><mtr><mtd><mo>∆</mo><mi>U</mi></mtd><mtd><mo>=</mo></mtd><mtd><mn>0</mn><mo>.</mo><mn>08</mn><mo>×</mo><mo>(</mo><mn>170</mn><mo>×</mo><mn>4</mn><mo>.</mo><mn>18</mn><mo>)</mo><mo>×</mo><mn>5</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></mtd></mtr><mtr><mtd></mtd><mtd><mo>≈</mo></mtd><mtd><mo> </mo><mn>284</mn><mo> </mo><mi mathvariant=\"normal\">J</mi></mtd></mtr></mtable></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bafe", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T09:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 1)", "title": "JEE Main 2024 (27 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436bafe", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T09:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 1)", "title": "JEE Main 2024 (27 Jan Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-11-21T10:34:49.536Z"}, {"_id": "648b5a71417cc3fb48d6870f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}], "question": {"text": "<p>A thermodynamic system is taken through cyclic process. The total work done in the process is :</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/14b09126-4503-47a1-81f4-11b38bab1556.png\" style=\"width: 250px; height: 218px;\" /></p>", "image": null}, "options": [{"id": "ghWRO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "gA7ZT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": true}, {"id": "IflH6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>", "image": null, "isCorrect": false}, {"id": "MdJHk", "text": "Zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>The work done is given by the area of the&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>V</mi></math>&nbsp;graph of the loop.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>W</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><msub><mi>V</mi><mi>E</mi></msub><mo>-</mo><msub><mi>V</mi><mi>C</mi></msub></mrow></mfenced><mo>(</mo><msub><mi>P</mi><mi>D</mi></msub><mo>-</mo><msub><mi>P</mi><mi>C</mi></msub><mo>)</mo><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>300</mn></mrow><mn>2</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d683e5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}], "question": {"text": "<p>Given below are two statements:</p><p><strong>Statement I:</strong> If heat is added to a system, its temperature must increase.</p><p><strong>Statement II:</strong> If positive work is done by a system i
