/mo><mi>ln</mi><mn>200</mn><mo>&#8722;</mo><mi>ln</mi><mn>100</mn><mo>]</mo></mrow><mo>=</mo><mi>C</mi><mi>ln</mi><mn>2</mn></mtd></mtr><mtr><mtd></mtd></mtr><mtr><mtd><mtext>and</mtext><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mi>C</mi><mo>=</mo><mi mathvariant=\"normal\">J</mi><mo>&#160;</mo><msup><mfenced><mrow><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></mrow></mfenced><mrow><mo>-</mo><mn>1</mn></mrow></msup></mtd></mtr><mtr><mtd></mtd></mtr><mtr><mtd><mo>&#8658;</mo><mtext>&#8201;</mtext><mtext>&#8201;</mtext><mi>&#916;</mi><mi>S</mi><mo>=</mo><mi>ln</mi><mn>2</mn></mtd></mtr><mtr><mtd></mtd></mtr><mtr><mtd><mtext>Entrpoy&#160;change&#160;in&#160;same&#160;for&#160;both&#160;cases&#160;as&#160;C&#160;is&#160;constant,&#160;and</mtext></mtd></mtr><mtr><mtd><mtext>temperature&#160;change&#160;(i</mtext><mtext>.e</mtext><mtext>.&#160;from&#160;100&#160;to&#160;200)&#160;is&#160;same</mtext><mtext>.</mtext></mtd></mtr></mtable></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65e2a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}], "question": {"text": "A Carnot engine absorbs $1000 \\mathrm{~J}$ of heat energy from a reservoir at $127^{\\circ} \\mathrm{C}$ and rejects $600 \\mathrm{~J}$ of heat energy during each cycle. The efficiency of engine and temperature of sink will be:", "image": null}, "options": [{"id": "rSdDq", "text": "\n$20 \\%$ and $-43^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": false}, {"id": "EIlmM", "text": "\n$40 \\%$ and $-33^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": true}, {"id": "D8Rsc", "text": "\n$50 \\%$ and $-20^{\\circ} \\mathrm{C}$\n", "image": null, "isCorrect": false}, {"id": "QkCZY", "text": "\n$70 \\%$ and $-10^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given: $\\mathrm{Q}_1=1000 \\mathrm{~J}$\n$$\n\\begin{aligned}\n&\\mathrm{Q}_2=600 \\mathrm{~J} \\\\\n&\\mathrm{~T}_1=127^{\\circ} \\mathrm{C}=400 \\mathrm{~K} \\\\\n&\\mathrm{~T}_2=? \\\\\n&\\eta=?\n\\end{aligned}\n$$\nEfficiency of carnot engine,\n$$\n\\begin{aligned}\n&\\eta=\\frac{W}{Q_1} \\times 100 \\% \\\\\n&\\text { or, } \\eta=\\frac{Q_2-Q_1}{Q_1} \\times 100 \\%\n\\end{aligned}\n$$\nor, $\\eta=\\frac{\\mathrm{Q}_2-\\mathrm{Q}_1}{\\mathrm{Q}_1} \\times 100 \\%$\nor, $\\eta=\\frac{1000-600}{1000} \\times 100 \\%$\n$$\n\\eta=40 \\%\n$$\nNow, for carnot cycle $\\frac{\\mathrm{Q}_2}{\\mathrm{Q}_1}=\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}$\n$$\n\\begin{aligned}\n&\\frac{600}{1000}=\\frac{\\mathrm{T}_2}{400} \\\\\n&\\mathrm{~T}_2=\\frac{600 \\times 400}{1000}=240 \\mathrm{~K}=240-273 \\\\\n&\\therefore \\mathrm{T}_2=-33^{\\circ} \\mathrm{C}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65aac", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}], "question": {"text": "The door of a working refrigerator is left open in a well insulated room. The temperature of air in the room will", "image": null}, "options": [{"id": "FzAh3", "text": "\ndecrease\n", "image": null, "isCorrect": false}, {"id": "Qq2QA", "text": "\nincrease in winters and decrease in summers\n", "image": null, "isCorrect": false}, {"id": "3rzWm", "text": "\nremain the same\n", "image": null, "isCorrect": false}, {"id": "xncvn", "text": "\nincrease", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In a refrigerator, the heat dissipated in the atmosphere is more than that taken from the cooling chamber, therefore the room is heated. If the door of a refrigerator is kept open.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a47", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}], "question": {"text": "This question has Statement 1 and Statement 2. Of the four choices given after the Statements, choose the one that best describes the two Statements.\nStatement 1: An inventor claims to have constructed an engine that has an efficiency of $30 \\%$ when operated between the boiling and freezing points of water. This is not possible.\nStatement 2: The efficiency of a real engine is always less than the efficiency of a Carnot engine operating between the same two temperatures.", "image": null}, "options": [{"id": "XpS4f", "text": "\nStatement 1 is true, Statement 2 is true, Statement 2 is not the correct explanation of Statement 1.\n", "image": null, "isCorrect": false}, {"id": "vcXIH", "text": "\nStatement 1 is true, Statement 2 is false.\n", "image": null, "isCorrect": false}, {"id": "IJJSM", "text": "\nStatement 1 is false, Statement 2 is true.\n", "image": null, "isCorrect": false}, {"id": "nX8yc", "text": "\nStatement 1 is true, Statement 2 is true, Statement 2 is the correct explanation of Statement 1.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Carnot's theorem - no heat engine working between two given temperatures of source and sink can be more efficient than a perfectly reversible engine i.e. Carnot engine working between the same two temperatures.\nEfficiency of Carnot's engine, $n=1-\\frac{T_2}{T_1}$ where, $T_1=$ temperature of source $T_2=$ temperature of sink", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65b0a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}], "question": {"text": "A Carnot engine, whose efficiency is $40 \\%$, takes in heat from a source maintained at a temperature of $500 \\mathrm{~K}$ It is desired to have an engine of efficiency $60 \\%$. Then, the intake temperature for the same exhaust (sink) temperature must be", "image": null}, "options": [{"id": "DfHJZ", "text": "\nefficiency of Carnot engine cannot be made larger than $50 \\%$\n", "image": null, "isCorrect": false}, {"id": "zJiWu", "text": "\n$1200 \\mathrm{~K}$\n", "image": null, "isCorrect": false}, {"id": "7aaKD", "text": "\n$750 \\mathrm{~K}$\n", "image": null, "isCorrect": true}, {"id": "sgyNT", "text": "\n$600 \\mathrm{~K}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{40}{100}=\\frac{500-T_S}{500}, T_S=300 \\mathrm{~K}$\n$\\frac{600}{100}=\\frac{T-300}{T} \\Rightarrow T=750 \\mathrm{~K}$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65947", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}], "question": {"text": "A Carnot engine operating between temperatures $T_1$ and $T_2$ has efficiency $\\frac{1}{6}$. When $T_2$ is lowered by 62 $\\mathrm{K}$, its efficiency increases to $\\frac{1}{3}$. Then $T_1$ and $T_2$ are, respectively :", "image": null}, "options": [{"id": "npRjx", "text": "\n$372 \\mathrm{~K}$ and $330 \\mathrm{~K}$\n", "image": null, "isCorrect": false}, {"id": "Tuv51", "text": "\n$330 \\mathrm{~K}$ and $268 \\mathrm{~K}$\n", "image": null, "isCorrect": false}, {"id": "AZcQm", "text": "\n$310 \\mathrm{~K}$ and $248 \\mathrm{~K}$\n", "image": null, "isCorrect": false}, {"id": "2QiHw", "text": "\n$372 \\mathrm{~K}$ and $310 \\mathrm{~K}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\eta_1=\\frac{T_1-T_2}{T_1}=\\frac{1}{6}$\n$\\eta_2=\\frac{T_1-\\left(T_2-62\\right)}{T_1}=\\frac{1}{3}$\n$\\Rightarrow \\frac{T_1-T_2}{T_1}+\\frac{62}{T_1}=\\frac{1}{3}$\n$\\frac{1}{6}+\\frac{62}{T_1}=\\frac{1}{3}$\n$\\frac{62}{T_1}=\\frac{1}{6}$\n$\\therefore T_1=62 \\times 6=372 \\mathrm{~K}$\n$\\frac{T_1-T_2}{T_1}=\\frac{1}{6}$\n$1-\\frac{T_2}{T_1}=\\frac{1}{6}$\n$\\frac{T_2}{372}=\\frac{5}{6}$\n$\\Rightarrow T_2=310 \\mathrm{~K}$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d657ae", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "JEE Main 2007"}], "question": {"text": "A Carnot engine, having an efficiency of $\\eta=1 / 10$ as heat engine, is used as a refrigerator. If the work done on the system is $10 \\mathrm{~J}$, the amount of energy absorbed from the reservoir at lower temperature is", "image": null}, "options": [{"id": "7sNDa", "text": "\n$99 \\mathrm{~J}$\n", "image": null, "isCorrect": false}, {"id": "1jxYN", "text": "\n$90 \\mathrm{~J}$\n", "image": null, "isCorrect": true}, {"id": "WwJbP", "text": "\n$1 \\mathrm{~J}$\n", "image": null, "isCorrect": false}, {"id": "tTsqX", "text": "\n$100 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{W} & =\\mathrm{Q}_2\\left(\\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}-1\\right) \\quad \\eta=1-\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1} \\\\ 10 & =\\mathrm{Q}_2\\left(\\frac{10}{9}-1\\right) \\quad \\frac{1}{10}=1-\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1} \\Rightarrow \\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}=1-\\frac{1}{10}=\\frac{9}{10} \\\\ 10 & =\\mathrm{Q}_2\\left(\\frac{1}{9}\\right) \\Rightarrow \\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}=\\frac{10}{9} \\\\ \\mathrm{Q}_2 & =90 \\mathrm{~J}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "JEE Main 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65647", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "The temperature-entropy diagram of a reversible engine cycle is given in the figure. Its efficiency is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/Ace4kONNF6Vl209b4bzNk0emIgOQmIueDnbO_SB3QyQ.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "R2rbb", "text": "\n$1 / 2$\n", "image": null, "isCorrect": false}, {"id": "5hPpK", "text": "\n$1 / 4$\n", "image": null, "isCorrect": false}, {"id": "ZR6H1", "text": "\n$1 / 3$\n", "image": null, "isCorrect": true}, {"id": "xNhwy", "text": "\n$2 / 3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ePTbQunAJ0X7hwb_uzX6fTpEjJ5UwejO1SpnLEzaGuw.original.fullsize.png\"><br>\n$\\eta=\\frac{\\Delta \\mathrm{W}}{\\mathrm{Q}_{\\mathrm{BC}}}=\\frac{\\frac{\\mathrm{S}_0 \\mathrm{~T}_0}{2}}{\\frac{3 \\mathrm{~S}_0 \\mathrm{~T}_0}{2}}=1 / 3$", "image": null}, "videoSolution": null, "questionStructure": ["GRAPH_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d6549c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "A Carnot engine takes $3 \\times 10^6 \\mathrm{cal}$. of heat from a reservoir at $627^{\\circ} \\mathrm{C}$, and gives it to a sink at $27^{\\circ} \\mathrm{C}$. The work done by the engine is", "image": null}, "options": [{"id": "zqQYb", "text": "\n$4.2 \\times 10^6 \\mathrm{~J}$\n", "image": null, "isCorrect": false}, {"id": "L9C8G", "text": "\n$8.4 \\times 10^6 \\mathrm{~J}$\n", "image": null, "isCorrect": true}, {"id": "U4Ouw", "text": "\n$16.8 \\times 10^6 \\mathrm{~J}$\n", "image": null, "isCorrect": false}, {"id": "ELKZR", "text": "\nZero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\eta=\\frac{(627+273)-(273+27)}{627+273}$\n$=\\frac{900-300}{900}=\\frac{600}{900}=\\frac{2}{3}$\nwork $=(\\eta) \\times$ Heat\n$=\\frac{2}{3} \\times 3 \\times 10^6 \\times 4.2 \\mathrm{~J}=8.4 \\times 10^6 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65488", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "\"Heat cannot by itself flow from a body at lower temperature to a body at higher temperature\" is a statement or consequence of", "image": null}, "options": [{"id": "go41Q", "text": "\nsecond law of thermodynamics\n", "image": null, "isCorrect": true}, {"id": "07CXT", "text": "\nconservation of momentum\n", "image": null, "isCorrect": false}, {"id": "w4j5t", "text": "\nconservation of momentum\n", "image": null, "isCorrect": false}, {"id": "HNBk6", "text": "\nfirst law of thermodynamics", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "External amount of work must be done in order to flow heat from lower temperature to higher temperature. This is according to second law of thermodynamics.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d653bd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "Even Carnot engine cannot give 100% efficiency because we cannot", "image": null}, "options": [{"id": "EAI5h", "text": "\nprevent radiation\n", "image": null, "isCorrect": false}, {"id": "1ZoyL", "text": "\nfind ideal sources\n", "image": null, "isCorrect": false}, {"id": "dT1r3", "text": "\nreach absolute zero temperature\n", "image": null, "isCorrect": true}, {"id": "dxBx0", "text": "\neliminate friction", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Absolute zero temperature is practically not reachable", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65384", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "Which statement is incorrect?", "image": null}, "options": [{"id": "CIozl", "text": "\nall reversible cycles have same efficiency\n", "image": null, "isCorrect": true}, {"id": "Ds2GH", "text": "\nreversible cycle has more efficiency than an irreversible one\n", "image": null, "isCorrect": false}, {"id": "yj2wp", "text": "\nCarnot cycle is a reversible one\n", "image": null, "isCorrect": false}, {"id": "lgKJW", "text": "\nCarnot cycle has the maximum efficiency in all cycles", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Main';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
