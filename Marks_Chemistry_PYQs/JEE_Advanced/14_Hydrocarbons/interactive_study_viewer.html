00px;\" /></p>", "image": null}, "options": [{"id": "WPYfq", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/ef2587f9-4751-4369-9676-4867c81d31e8-d4.png\" style=\"width: 354px; height: 50px;\" /></p>", "isCorrect": false, "image": null}, {"id": "SDSHO", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/5eb4f849-b2e6-4090-b747-4870642f60f6-image.png\" style=\"width: 306px; height: 50px;\" /></p>", "isCorrect": true, "image": null}, {"id": "npD2a", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/1528e939-1ff5-49e4-8e66-3fe7539ada2d-image.png\" style=\"width: 264px; height: 80px;\" /></p>", "isCorrect": false, "image": null}, {"id": "Q3SXX", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/98f5422e-e973-48b2-a14b-c8a892aad0e3-image.png\" style=\"width: 353px; height: 50px;\" /></p>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img height=\"188\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/7a576f41-2c66-47a4-8f34-20c3ceba8034-image.png\" width=\"683\" /></p><p>In first step strong base&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>NH</mi><mn>2</mn><mo>&#8722;</mo></msubsup></math>&nbsp;will react with terminal alkyne. And in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mi>nd</mi></msup></math>&nbsp;step Birch reduction reaction will take place and give&nbsp;trans&nbsp;alkene.</p>", "image": null}, "videoSolution": {"videoId": "e5531b3cd04d457ca5fb657bc92bf293", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Idc4WEZiApj18.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Idc4WEZiApj18.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "619f94337e944e1fdc2859b4", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 1)", "title": "JEE Advanced 2021 (Paper 1)"}, "evalStatus": "correct", "lastPracticed": "2024-12-13T10:22:35.342Z"}, {"_id": "64b16a0ef23ac7d519f9b0ee", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}], "question": {"text": "The total number of alkenes possible by dehydrobromination of 3-bromo-3-cyclopentylhexane using alcoholic $\\mathrm{KOH}$ is", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "The substrate has three different types of $\\mathrm{B}-\\mathrm{H}$, therefore, first, three structural isomers of alkenes are expected as\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/2E-6lbXzWSzSfeC6dpZeGVGXsO8Qk5ByuknVh5D7qCA.original.fullsize.png\"><br>\nThe last two alkenes II and III are also capable of showing geometrical isomerism hence two geometrical isomers for each of them will be counted giving a total of five isomers.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64b16ae6f23ac7d519f9b950", "title": "Reactions of alkenes", "totalQuestions": 8, "questions": [{"_id": "6a0be51544d287c9361e5cce", "type": "singleCorrect", "question": {"text": "Natural rubber on complete ozonolysis ($\\text{O}_3$/Zn-$\\text{H}_2\\text{O}$) gives compound $\\textbf{X}$ as the major product. $\\textbf{X}$ gives positive iodoform and Tollen's tests. $\\textbf{X}$ on heating with aqueous NaOH gives $\\textbf{Y}$ as the major product. $\\textbf{Y}$ is", "image": null}, "options": [{"id": "C43nz", "text": "<img style=\"width: 70px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p2_english__q39_d1.png\" />", "isCorrect": true, "image": null}, {"id": "XCxuY", "text": "<img style=\"width: 130px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p2_english__q39_d2.png\" />", "isCorrect": false, "image": null}, {"id": "zODPy", "text": "<img style=\"width: 250px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p2_english__q39_d3.png\" />", "isCorrect": false, "image": null}, {"id": "PnGyn", "text": "<img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p2_english__q39_d4.png\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Natural rubber is cis-1,4-polyisoprene, with the repeating unit $[-\\text{CH}_2-\\text{C}(\\text{CH}_3)=\\text{CH}-\\text{CH}_2-]_n$.<br><br>Complete reductive ozonolysis ($\\text{O}_3$/Zn-$\\text{H}_2\\text{O}$) of natural rubber cleaves the double bonds to give 4-oxopentanal (levulinaldehyde) as compound X.<br><br>$[-\\text{CH}_2-\\text{C}(\\text{CH}_3)=\\text{CH}-\\text{CH}_2-]_n \\xrightarrow{\\text{O}_3/\\text{Zn-H}_2\\text{O}} n \\text{ CH}_3-\\text{C}(=\\text{O})-\\text{CH}_2-\\text{CH}_2-\\text{CHO}$<br><br>Compound X ($\\text{CH}_3-\\text{CO}-\\text{CH}_2-\\text{CH}_2-\\text{CHO}$) has a methyl ketone group, which gives a positive iodoform test, and an aldehyde group, which gives a positive Tollen's test.<br><br>When X is heated with aqueous NaOH, it undergoes an intramolecular aldol condensation. The base abstracts an $\\alpha$-proton from the terminal methyl group to form an enolate, which then attacks the aldehyde carbonyl carbon to form a stable five-membered ring.<br><br>The intermediate formed is 3-hydroxycyclopentanone, which upon heating undergoes dehydration to yield cyclopent-2-en-1-one as the major product Y.<br><br>Answer: <img style=\"width: 70px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p2_english__q39_d1.png\" />", "image": null}, "level": 3, "videoSolution": {"videoId": "878e5a80dc954e4fa570a08dd2cfcac4", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/BhVLjeh3g6MrW.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/BhVLjeh3g6MrW.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b43", "title": "JEE Advanced 2026 (Paper 2)", "shortName": "2026 (Paper 2)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b43", "title": "JEE Advanced 2026 (Paper 2)", "shortName": "2026 (Paper 2)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a0be51144d287c9361e5ca6", "type": "singleCorrect", "question": {"text": "The List-II contains products obtained from the reaction of compounds in List-I with $\\text{O}_3$/Zn-$\\text{H}_2\\text{O}$ followed by cyclization (via more stable enolate) in the presence of aqueous NaOH. Match each entry in List-I with appropriate entry in List-II and choose the correct option.<br><table style=\"border: 1px solid black; border-collapse: collapse; width: auto;\"><tr><th style=\"border: 1px solid black; padding: 10px;\">List-I</th><th style=\"border: 1px solid black; padding: 10px;\">List-II</th></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(P) <img style=\"width: 120px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q47_d1.png\" /></td><td style=\"border: 1px solid black; padding: 10px;\">(1) <img style=\"width: 120px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q47_d5.png\" /></td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(Q) <img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q47_d2.png\" /></td><td style=\"border: 1px solid black; padding: 10px;\">(2) <img style=\"width: 130px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q47_d6.png\" /></td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(R) <img style=\"width: 130px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q47_d3.png\" /></td><td style=\"border: 1px solid black; padding: 10px;\">(3) <img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q47_d7.png\" /></td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(S) <img style=\"width: 120px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q47_d4.png\" /></td><td style=\"border: 1px solid black; padding: 10px;\">(4) <img style=\"width: 130px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q47_d8.png\" /></td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\"></td><td style=\"border: 1px solid black; padding: 10px;\">(5) <img style=\"width: 130px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q47_d9.png\" /></td></tr></table>", "image": null}, "options": [{"id": "jSOxY", "text": "P $\\longrightarrow$ 2; Q $\\longrightarrow$ 4; R $\\longrightarrow$ 1; S $\\longrightarrow$ 3", "isCorrect": false, "image": null}, {"id": "DVE1F", "text": "P $\\longrightarrow$ 3; Q $\\longrightarrow$ 4; R $\\longrightarrow$ 5; S $\\longrightarrow$ 2", "isCorrect": false, "image": null}, {"id": "cWmox", "text": "P $\\longrightarrow$ 2; Q $\\longrightarrow$ 1; R $\\longrightarrow$ 5; S $\\longrightarrow$ 3", "isCorrect": true, "image": null}, {"id": "yxZYB", "text": "P $\\longrightarrow$ 3; Q $\\longrightarrow$ 5; R $\\longrightarrow$ 4; S $\\longrightarrow$ 2", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction sequence involves ozonolysis of the bicyclic alkenes followed by an intramolecular aldol condensation.<br><br>For compound (P), the structure is a 6,6-fused system (an octalin derivative) with methyl groups on opposite sides of the double bond. Ozonolysis cleaves the central double bond to form a 10-membered ring 1,6-diketone with methyl groups at the $\\alpha$-positions (C2 and C7). The base-catalyzed aldol condensation proceeds via the more stable trisubstituted enolate at C2, which attacks the C6 carbonyl group. This cyclization forms a new 5-membered ring fused to a 7-membered ring (a 5,7-fused system). The fusion carbons are C2 (bearing a methyl group) and C6 (bearing a hydroxyl group). The unreacted ketone is at C1, and the other methyl group is at C7. Both C1 and C7 are in the 7-membered ring. This matches the structure of product (2). Thus, P $\\rightarrow$ 2.<br><br>For compound (Q), the structure is a 7,5-fused system with methyl groups on different rings. Ozonolysis yields a 10-membered ring 1,7-diketone with methyl groups at C2 and C10. The more stable enolate at C2 attacks the C7 carbonyl group. This forms a 6-membered ring fused to another 6-membered ring (a 6,6-fused system). The fusion carbons are C2 (with a methyl group) and C7 (with a hydroxyl group). The unreacted ketone at C1 and the remaining methyl at C10 are both located in the same 6-membered ring. This corresponds to the structure of product (1). Thus, Q $\\rightarrow$ 1.<br><br>For compound (R), the structure is a 7,5-fused system with both methyl groups on the 7-membered ring. Ozonolysis produces a 10-membered ring 1,7-diketone with methyl groups at C2 and C6. The enolate at C2 attacks the C7 carbonyl, forming a 6,6-fused system. The fusion carbons are C2 (methyl) and C7 (hydroxyl). The unreacted ketone is at C1 (in one ring) and the remaining methyl is at C6 (in the other ring). This corresponds to product (5). Thus, R $\\rightarrow$ 5.<br><br>For compound (S), the structure is a 6,6-fused system with both methyl groups on the same side. Ozonolysis forms a 10-membered ring 1,6-diketone with methyl groups at C2 and C5. The enolate at C2 attacks the C6 carbonyl, yielding a 5,7-fused system. The fusion carbons are C2 (methyl) and C6 (hydroxyl). The unreacted ketone is at C1 (in the 7-membered ring) and the remaining methyl is at C5 (in the 5-membered ring). This corresponds to product (3). Thus, S $\\rightarrow$ 3.<br><br>Combining these results, the correct matching is P $\\rightarrow$ 2; Q $\\rightarrow$ 1; R $\\rightarrow$ 5; S $\\rightarrow$ 3.", "image": null}, "level": 3, "videoSolution": {"videoId": "7df7dd23b37a49fbaccf33ea4ec67bdc", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/P23Z4QB2RkwqB.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/P23Z4QB2RkwqB.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousY t contain any&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>2</mn></msub></math>&nbsp;group.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "d1be4d0c573b49df97ab11f12a832584", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/wr55LnO82Mims.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/wr55LnO82Mims.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "632c83583e3fd59bda92e46d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 2)", "title": "JEE Advanced 2022 (Paper 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-13T10:17:48.094Z"}, {"_id": "64b16a49f23ac7d519f9b30a", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf827", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2015-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2015 (Paper 2)", "title": "JEE Advanced 2015 (Paper 2)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "<p>In the following reactions, the product S is<br ><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image16-da399bcd-74f7-492b-b4eb-97a7052914af.png\"/></p>", "image": null}, "options": [{"id": "yhXzW", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image17-7b62b85e-08ec-4b37-9382-ac6c1a56014b.png\"/>", "isCorrect": true, "image": null}, {"id": "Mz0Yc", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image18-e7d1824e-ed82-4e2d-b682-beebfabcd3da.png\"/>", "isCorrect": false, "image": null}, {"id": "OFaIX", "t "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}], "question": {"text": "The reagent(s) for the following conversion,\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/A9a7Okowiwpx3PIHLDTJJVAdAOx9rgHb5pxdhCabhY0.original.fullsize.png\"><br>\nis/are", "image": null}, "options": [{"id": "hZsac", "text": "\nalcoholic $\\mathrm{KOH}$\n", "image": null, "isCorrect": false}, {"id": "A86gO", "text": "\nalcoholic KOH followed by $\\mathrm{NaNH}_2$\n", "image": null, "isCorrect": true}, {"id": "bHJ2u", "text": "\naqueous $\\mathrm{KOH}$ followed by $\\mathrm{NaNH}_2$\n", "image": null, "isCorrect": false}, {"id": "jmN13", "text": "\n$\\mathrm{Zn} / \\mathrm{CH}_3 \\mathrm{OH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/9AQ1xDYToHFJ_rT3ki-PBfrhDGNAVnOQaAcZv5LN_Do.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64b16ae6f23ac7d519f9b94f", "title": "Reactions of alkynes", "totalQuestions": 4, "questions": [{"_id": "6a0be51044d287c9361e5ca3", "type": "numerical", "question": {"text": "Treatment of buta-1,3-diyne with $\\text{NaNH}_2$ ($2$ equivalents), followed by reaction with excess of $trans$-$\\text{CH}_3\\text{-CH=CH-CH}_2\\text{-Br}$ gives $\\textbf{X}$ as the major product. The maximum number of carbon atoms that are collinear (in a straight line) in $\\textbf{X}$ is ____.", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "Buta-1,3-diyne ($HC \\equiv C - C \\equiv CH$) reacts with $2$ equivalents of $\\text{NaNH}_2$ to undergo double deprotonation, forming the acetylide dianion:<br><br>$HC \\equiv C - C \\equiv CH + 2\\text{NaNH}_2 \\rightarrow \\ ^\\ominus C \\equiv C - C \\equiv C ^\\ominus + 2\\text{NH}_3$<br><br>This dianion acts as a strong nucleophile and undergoes an $S_N2$ reaction with the primary allylic halide, $trans$-$\\text{CH}_3\\text{-CH=CH-CH}_2\\text{-Br}$ (excess ensures both sides react):<br><br>$^\\ominus C \\equiv C - C \\equiv C ^\\ominus + 2 \\text{CH}_3\\text{-CH=CH-CH}_2\\text{-Br} \\rightarrow \\text{CH}_3\\text{-CH=CH-CH}_2 - C \\equiv C - C \\equiv C - \\text{CH}_2\\text{-CH=CH-CH}_3$<br><br>In the major product $\\textbf{X}$, the central diyne unit consists of four $sp$ hybridized carbon atoms. The geometry around $sp$ hybridized carbons is linear (bond angle $180^\\circ$).<br><br>The two $sp^3$ hybridized $-\\text{CH}_2-$ carbons attached directly to the $sp$ carbons also lie on this same linear axis. Thus, the sequence of collinear carbon atoms is:<br><br>$-\\text{CH}_2 - C \\equiv C - C \\equiv C - \\text{CH}_2-$<br><br>The carbon atoms beyond the $-\\text{CH}_2-$ groups are attached at a tetrahedral angle ($\\sim 109.5^\\circ$) and are not collinear with the central axis.<br><br>Therefore, the maximum number of collinear carbon atoms in $\\textbf{X}$ is $6$.<br><br>Answer: $6$", "image": null}, "level": 2, "videoSolution": {"videoId": "4be22d22a2fe4866adeb0a293fb872d4", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/9iPEzPCtswNEr.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/9iPEzPCtswNEr.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66965de1d603121f43a42f77", "type": "multipleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}], "question": {"text": "The option(s) with correct sequence of reagents for the conversion of $\\mathbf{P}$ to $\\mathbf{Q}$ is(are) :\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/B97tDg14_ZhgFKBEZ1ZGYR7LIjP-cMKlM-B3iw5LKko.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "yk57b", "text": "i) Lindlar's catalyst, $\\mathrm{H}_2$; ii) $\\mathrm{SnCl}_2 / \\mathrm{HCl}$; iii) $\\mathrm{NaBH}_4$; iv) $\\mathrm{H}_3 \\mathrm{O}^{+}$", "image": null, "isCorrect": false}, {"id": "iE3Bh", "text": "i) Lindlar's catalyst, $\\mathrm{H}_2$; ii) $\\mathrm{H}_3 \\mathrm{O}^{+}$; iii) $\\mathrm{SnCl}_2 / \\mathrm{HCl}$; iv) $\\mathrm{NaBH}_4$", "image": null, "isCorrect": false}, {"id": "Fdswi", "text": "i) $\\mathrm{NaBH}_4$; ii) $\\mathrm{SnCl}_2 / \\mathrm{HCl}$; iii) $\\mathrm{H}_3 \\mathrm{O}^{+}$; iv) Lindlar's catalyst, $\\mathrm{H}_2$", "image": null, "isCorrect": true}, {"id": "IY53N", "text": "i) Lindlar's catalyst, $\\mathrm{H}_2$; ii) $\\mathrm{NaBH}_4$; iii) $\\mathrm{SnCl}_2 / \\mathrm{HCl}$; iv) $\\mathrm{H}_3 \\mathrm{O}^{+}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/-H5c9wVqjspu8jKFrWWkuVewovpSt6Q8vshM0MX2VmU.original.fullsize.png\"><br>", "image": null}, "videoSolution": {"videoId": "157eab90889d4e4e9e180ee858108e66", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/YYHoaEP6DuYm8.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/YYHoaEP6DuYm8.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}, "evalStatus": "incorrect", "lastPracticed": "2024-12-13T10:06:06.408Z"}, {"_id": "64b16a9df23ac7d519f9b601", "previousYearPapers": [{"_id": "632c83583e3fd59bda92e46d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 2)", "title": "JEE Advanced 2022 (Paper 2)"}], "type": "numerical", "level": 3, "question": {"text": "<p>The number of isomeric tetraenes (NOT containing sp-hybridized carbon atoms) that can be formed from the following reaction sequence is _____ .</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/d2f64c9a-9cb1-4c7f-981c-9109fedad31f-image.png\" style=\"width: 328px; height: 80px;\" /></p>", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "<blockquote><p>The anti-addition of hydrogen to an alkyne pi bond occurs when reacted with sodium or lithium metal dissolved in ammonia. This reaction produces a trans-alkene as its product.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/93b4600c-cd6b-4a37-9118-d7f3d031ff97-1636c929-fd14-4607-90d9-447685c5eeed-image.png\" style=\"width: 524px; height: 216px;\" /></p><p>Bromine react with alkene to give anti addition dibromo product. In this case both double bonds will react. In the next reaction elimination of HBr will take place forming tetraene.</p><p>The final tetraene&nbsp;product can show Geometrical isomerism along one double bond only. So, it will have two isomers only.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "ba59bdc1435e436b9ed176f4739e2ab4", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/hCnJYYv6E90WC.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/hCnJYYv6E90WC.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "632c83583e3fd59bda92e46d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 2)", "title": "JEE Advanced 2022 (Paper 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-13T10:12:46.746Z"}, {"_id": "64b169fdf23ac7d519f9b055", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}], "question": {"text": "The synthesis of 3-octyne is achieved by adding a bromoalkane into a mixture of sodium amide and an alkyne. The bromoalkane and alkyne respectively are", "image": null}, "options": [{"id": "7QVDY", "text": "\n$\\mathrm{BrCH}_2 \\mathrm{CH}_2 \\mathrm{CH}_2 \\mathrm{CH}_2 \\mathrm{CH}_3$ and $$\n\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{C} \\equiv \\mathrm{CH}\n$$\n", "image": null, "isCorrect": false}, {"id": "yBxjo", "text": "\n$\\mathrm{BrCH}_2 \\mathrm{CH}_2 \\mathrm{CH}_3$ and\n$$\n\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{CH}_2 \\mathrm{C} \\equiv \\mathrm{CH}\n$$\n", "image": null, "isCorrect": false}, {"id": "d6tYe", "text": "\n$\\mathrm{BrCH}_2 \\mathrm{CH}_2 \\mathrm{CH}_2 \\mathrm{CH}_2 \\mathrm{CH}_3$ and $$\n\\mathrm{CH}_3 \\mathrm{C} \\equiv \\equiv \\mathrm{CH}\n$$\n", "image": null, "isCorrect": false}, {"id": "ytEwa", "text": "\n$\\mathrm{BrCH}_2 \\mathrm{CH}_2 \\mathrm{CH}_2 \\mathrm{CH}_3$ and\n$$\n\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{C} \\equiv \\mathrm{CH}\n$$a)", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{C} \\equiv \\mathrm{C}-\\mathrm{CH}_2$ $-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{CH}_3$ There are two (marked) possibility of halides\nThus, in the given context\n$$\n\\begin{array}{r}\n\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{C} \\equiv \\mathrm{CH}+\\mathrm{NaNH}_2 \\longrightarrow \\\\\n\\mathrm{CH}_3 \\mathrm{CH}_2-\\mathrm{C} \\equiv \\overline{\\mathrm{CNa}^{+}}\n\\end{array}\n$$\n$$\n\\begin{aligned}\n\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{C} \\equiv \\overline{\\mathrm{CNa}} \\\\\n\\longrightarrow \\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{C} \\equiv \\mathrm{BrCH}_2 \\mathrm{CH}_2 \\mathrm{CH}_2 \\mathrm{CH}_3 \\\\\n\\text { 3-octyne } \\mathrm{CH}_2 \\mathrm{CH}_2 \\mathrm{CH}_2 \\mathrm{CH}_3\n\\end{aligned}\n$$\nHydrocarbon\nConceptual, reaction understanding II", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "64b16ae6f23ac7d519f9b94e", "title": "Reactions of aromatic compounds", "totalQuestions": 6, "questions": [{"_id": "6a0be51044d287c9361e5c9f", "type": "multipleCorrect", "question": {"text": "In the following reaction sequence, $\\textbf{Q}$, $\\textbf{R}$, $\\textbf{S}$ and $\\textbf{T}$ are the major products.<br><img style=\"width: 600px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q40_d1.png\" /><br>The correct statement(s) about $\\textbf{Q}$, $\\textbf{R}$, $\\textbf{S}$ and $\\textbf{T}$ is(are)", "image": null}, "options": [{"id": "eAs8C", "text": "$\\textbf{S}$ on warming with ammoniacal $\\text{AgNO}_3$ results in the formation of silver mirror.", "isCorrect": true, "image": null}, {"id": "XktGK", "text": "$\\textbf{Q}$ on treatment with $\\text{Cl}_2$(excess)/UV gives gammaxane.", "isCorrect": true, "image": null}, {"id": "oQUEy", "text": "$\\textbf{T}$ is a heterocyclic compound.", "isCorrect": true, "image": null}, {"id": "AeHDQ", "text": "$\\textbf{R}$ on acid catalyzed intramolecular cyclization followed by treatment with Zn-Hg/HCl gives 9,10-dihydroxyanthracene.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Kolbe's electrolysis of sodium butyrate ($\\text{CH}_3\\text{CH}_2\\text{CH}_2\\text{COONa}$) yields n-hexane.<br><br>Aromatization of n-hexane using $\\text{V}_2\\text{O}_5$ at $500^\\circ\\text{C}$ produces benzene ($Q$).<br><br>Benzene ($Q$) reacts with phthalic anhydride in the presence of anhydrous $\\text{AlCl}_3$ to form o-benzoylbenzoic acid ($R$).<br><br>Treatment of $R$ with $\\text{PCl}_5$ gives o-benzoylbenzoyl chloride, which upon Rosenmund reduction ($\\text{H}_2-\\text{Pd/BaSO}_4$) yields o-benzoylbenzaldehyde ($S$).<br><br>Condensation of $S$ with hydrazine ($\\text{NH}_2\\text{NH}_2$) forms 1-phenylphthalazine ($T$).<br><br>Evaluating the options:<br><br>(A) $S$ contains an aldehyde group and gives a positive Tollens' test (silver mirror).<br><br>(B) $Q$ (benzene) reacts with excess $\\text{Cl}_2$ under UV light to form benzene hexachloride (gammaxane).<br><br>(C) $T$ (1-phenylphthalazine) is a heterocyclic compound.<br><br>(D) Acid-catalyzed cyclization of $R$ yields anthraquinone, which on Clemmensen reduction (Zn-Hg/HCl) gives anthracene, not 9,10-dihydroxyanthracene.<br><br>Answer: $\\textbf{S}$ on warming with ammoniacal $\\text{AgNO}_3$ results in the formation of silver mirror.; $\\textbf{Q}$ on treatment with $\\text{Cl}_2$(excess)/UV gives gammaxane.; $\\textbf{T}$ is a heterocyclic compound.", "image": null}, "level": 3, "videoSolution": {"videoId": "e4eb9101ace0434abdff1dc8a0f0b138", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/ofZrzvDphqqOt.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/ofZrzvDphqqOt.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a49f23ac7d519f9b30b", "previousYearPape "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf827", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2015-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2015 (Paper 2)", "title": "JEE Advanced 2015 (Paper 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-13T10:26:43.006Z"}, {"_id": "64b16a2ff23ac7d519f9b21d", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf823", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 2)", "title": "JEE Advanced 2013 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<strong> Paragraph: </strong>\r\n\r\n$P$ and $Q$ are isomers of dicarboxylic acid $\\mathrm{C}_{4} \\mathrm{H}_{4} \\mathrm{O}_{4}$. Both decolorize $\\mathrm{Br}_{2} / \\mathrm{H}_{2} \\mathrm{O}$. On heating, $\\boldsymbol{P}$ forms the cyclic anhydride.\r\n\r\nUpon treatment with dilute alkaline $\\mathrm{KMnO}_{4}, \\boldsymbol{P}$ as well as $\\boldsymbol{Q}$ could produce one or more than one from $\\boldsymbol{S}, \\boldsymbol{T}$ and $\\boldsymbol{U}$.\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/dHAL-u7-4ut6ifehsp2LfMk8-Jc28xcx4bMj7J2e1B8.original.fullsize.png\"><br>\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/DBlxvwiAqaUu4-MpjtD7RNmLuEXqwr_4VzYrg6PK-48.original.fullsize.png\"><br>\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/ovwEZeZHEVHpZqMfR-JqiCsJNrr_NBTBT6pZFB-vnCQ.original.fullsize.png\"><br>\r\n\r\n<br> <strong> Question: </strong>\r\n\r\nIn the following reaction sequences $V$ and $W$ are, respectively\r\n\r\n$\\boldsymbol{Q} \\underset{\\Delta}{\\stackrel{\\mathrm{H}_{2} / \\mathrm{Ni}}{\\longrightarrow}} V$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/QlEzXf06kTj56DL0hfdQELd8CULOPU7Izqw-hYYL-2I.original.fullsize.png\">", "image": null}, "options": [{"id": "KbcF4", "text": "<img alt=\"\" src=\"https:/ , "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c47", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 2)", "title": "JEE Advanced 2010 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169ebf23ac7d519f9afac", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}], "question": {"text": "Match the compounds in Column I with their characteristic test(s)/reactions(s) given in Column II. Indicate your answer by darkening the appropriate bubbles of the $4 \\times 4$ matrix given in the ORS.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/TJVpaWmgq_MRw31jJHL907USap6KF9NIXYukIKdkNpw.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "dZR3V", "text": "\n(A) r,s, (B) p,q, (C) p,q,r, (D) p\n", "image": null, "isCorrect": true}, {"id": "OHn4N", "text": "\n(A) r, (B) p,q,s, (C) p,q,s, (D) p,q\n", "image": null, "isCorrect": false}, {"id": "HnTqk", "text": "\n(A) s, (B) q,r,s, (C) p,q,r,s, (D) p,q\n", "image": null, "isCorrect": false}, {"id": "W8DNK", "text": "\n(A) r,s, (B) p,q,s, (C) p,q,r, (D) p", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A-r; B-p, q; C- p, q, r; D-p\nSodium fusion extract gives Prussian blue when nitrogen is present alongwith carbon. Phenolic group and carboxylate gives positive $\\mathrm{FeCl}_3$ test - white precipitate comes with $\\mathrm{AgCl}$.\n$$\n\\text { Hydrazone formation occurs effectively at } \\mathrm{pH} \\approx 4.5 \\text {. The reaction proceeds in that }\n$$\ncondition only when $\\mathrm{H}^{+}$concentration is merely sufficient to activate. As $\\mathrm{H}^{+}$concentration raises, sufficient molecule of hydrazone gets converted into hydrazonium which is not nucleophilic and reaction becomes impossible. Further, low concentration of $\\mathrm{H}^{+}$(in the case of hydrolysis of 2, 4-dinitrophenyl hydrazonium bromide) is not effective to proceed elimination (rate determining step).\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/CjI78dy4abclm11LRXCdsAkn5nz4S5BhS3Jyxy1XhUg.original.fullsize.png\"><br>\nIf it is assumed that the given hydrazonian bromiate is the result as salt main $\\mathrm{HBr}$ is used as acid catalyst. Remember! hydrazone formation involves first addition and then elimination (res). In the second step substitution dominates over elimination ( $\\mathrm{HBr}$ is not a dehydrating reagent mutually).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
