rption as charcoal is already activated.<br />Since physical adsorption is spontaneous&nbsp;<math> <mrow> <mo>&#916;</mo> <mtext>G</mtext> </mrow> </math>&nbsp;is -ve<br /><math> <mrow> <mo>&#916;</mo> <mtext>G</mtext> <mo>=</mo> <mo>&#916;</mo> <mtext>H</mtext> <mo>-</mo> <mtext>T</mtext> <mo>&#916;</mo> <mtext>S</mtext> </mrow> </math><br />as <math> <mrow> <mo>&#916;</mo> <mtext>S</mtext> </mrow> </math> &nbsp;is -ve (passage of methylene&nbsp;blue from aqueous phase over the surface of adsorbent) i.e. <math> <mrow> <mo>&#916;</mo> <mtext>H</mtext> </mrow> </math>&nbsp;is highly -ve since process is exothermic in nature.</p><p>Physical adsorption is reversible in nature.</p><p>Physical adsorption decreases with increase in temperature.</p>", "image": null}, "videoSolution": {"videoId": "20273eb7646e45fa98720359f5a1cca7", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/ahasdDVEt0jM7.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/ahasdDVEt0jM7.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf822", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 1)", "title": "JEE Advanced 2013 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a22f23ac7d519f9b1a9", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}], "type": "multipleCorrect", "level": 1, "question": {"text": "The given graphs/data I, II, III and IV represent general trends observed for different physisorption and chemisorption processes under mild conditions of temperature and presure. Which of the following choice(s) about I, II, III and IV is (are) correct?\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/iiL_O4N_ATV7e7GF7H2Gvm0IrJRq38lolz7oPh6F5oM.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/6SI6tnEJ1AqqkUONXv8LTSzBpJSoMt1zcMfr5HT9mSU.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "sq11G", "text": "I is physisorption and II is chemisorption", "isCorrect": true, "image": null}, {"id": "HM1wl", "text": "$\\mathrm{I}$ is physisorption and $\\mathrm{III}$ is chemisorption", "isCorrect": false, "image": null}, {"id": "MbnOa", "text": "IV is chemisorption and II is chemisorption", "isCorrect": true, "image": null}, {"id": "Zmgmp", "text": "IV is chemisorption and III is chemisorption", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Graph (I) and (III) represent physisorption because, in physisorption, the amount of adsorption decreases with the increase of temperature and increases with the increase of pressure.\r\n\r\nGraph (II) represent chemisorption, because in chemisorption amount of adsorption increases with the increase of temperature. Graph (IV) is showing the formation of a chemical bond, hence chemisorption.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a0df23ac7d519f9b0e3", "type": "multipleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}], "question": {"text": "The correct statement(s) pertaining to the adsorption of a gas on a solid surface is(are)", "image": null}, "options": [{"id": "c7gLr", "text": "\nAdsorption is always exothermic\n", "image": null, "isCorrect": true}, {"id": "erqRl", "text": "\nPhysisorption may transform into chemisorption at high temperature\n", "image": null, "isCorrect": true}, {"id": "RuhYz", "text": "\nPhysisorption increases with increasing temperature but chemisorption decreases with increasing temperature\n", "image": null, "isCorrect": false}, {"id": "xjESH", "text": "\nChemisorption is more exothermic than physisorption, however it is very slow due to higher energy of activation", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(a) In the process of adsorption, a bond is formed between adsorbate and adsorbent, hence always exothermic.\n(b) Physisorption require very low activation energy while chemisorption require high activation energy. Therefore a physisorption may transform into chemisorption but only at high temperature.\n(c) It is wrong statement as at higher temperature, physically adsorbed substance starts desorbing.\n(d) In physical adsorption, van der Waals' force hold the adsorbate and adsorbent together which is a weak electrostatic attraction. In chemisorption, strong chemical bond binds the adsorbate to the adsorbent. Therefore, chemisorption is more exothermic than physical adsorption.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64b16ae6f23ac7d519f9b953", "title": "Colloids", "totalQuestions": 6, "questions": [{"_id": "64b16aa8f23ac7d519f9b667", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}], "question": {"text": "<p>Consider the following statements related to colloids.</p><p>(I) Lyophobic colloids are not formed by simple mixing of dispersed phase and dispersion medium.</p><p>(II) For emulsions, both the dispersed phase and the dispersion medium are liquid.</p><p>(III) Micelles are produced by dissolving a surfactant in any solvent at any temperature.</p><p>(IV) Tyndall effect can be observed from a colloidal solution with dispersed phase having the same refractive index as that of the dispersion medium.</p><p>The option with the correct set of statements is</p>", "image": null}, "options": [{"id": "filF3", "text": "(I) and (II)", "image": null, "isCorrect": true}, {"id": "vvbU7", "text": "(II) and (III)", "image": null, "isCorrect": false}, {"id": "QL2HC", "text": "(III) and (IV)", "image": null, "isCorrect": false}, {"id": "jkgav", "text": "(II) and (IV)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>As in Lyophobic colloids there is no interaction between dispersed phase and dispersion medium, special methods are used for preparation, simple mixing will not form colloid.</p><p>Emulsion are colloids of liquid dispersed phase and liquid dispersion medium.</p><p>Micelles formation occurs when temperature is above a particular temperature called Kraft temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">K</mi></msub></math>&nbsp;and concentration above a particular value know as critical micelle concentration (CMC).</p><p>Tyndall&#39;s effect can be observed when the refractive indices of the dispersed phase and the dispersion medium differ greatly in magnitude.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "57ec288149b748ae923e7e13e9e3caf6", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/HrVxQEMrrH0Tq.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/HrVxQEMrrH0Tq.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a8bf23ac7d519f9b561", "previousYearPapers": [{"_id": "619f94337e944e1fdc2859b4", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 1)", "title": "JEE Advanced 2021 (Paper 1)"}], "type": "multipleCorrect", "level": 1, "question": {"text": "The correct statement&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">s</mi></mfenced></math> related to colloids is(are)", "image": null}, "options": [{"id": "ZRJoy", "text": "The process of precipitating colloidal sol by an electrolyte is called peptization.", "isCorrect": false, "image": null}, {"id": "znvd2", "text": "Colloidal solution freezes at higher temperature than the true solution at the same concentration.", "isCorrect": true, "image": null}, {"id": "VwBH6", "text": "Surfactants form micelle above critical micelle concentration <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>CMC</mi></mfenced><mo>.</mo><mo>&#160;</mo><mi>CMC</mi></math> depends on temperature.", "isCorrect": true, "image": null}, {"id": "G6w6o", "text": "Micelles are macromolecular colloids.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The process of setting of colloidal particles by adding electrolyte is called coagulation or precipitation of the sol.<p>Peptization is the process of converting a precipitate into colloidal sol by shaking it in a medium in presence of a small amount of electrolyte.</p><p>Colloidal solution have a lower value of colligative properly so, their depression in freezing point will be low, and freezing point will be higher. Surfactants form&nbsp;micelle above C.M.C and value of CMC&nbsp;depends on temperature.</p><p>Micelles are not macromolecular colloids they are associated colloids. Since, many small molecules associate with each other to form micelles.</p>", "image": null}, "videoSolution": {"videoId": "1beecb6f6a964ed29793657b7b30a677", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/wc1gxQh1f8eFD.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/wc1gxQh1f8eFD.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "619f94337e944e1fdc2859b4", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 1)", "title": "JEE Advanced 2021 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a55f23ac7d519f9b373", "previousYearPapers": [{"_ hvariant=\"normal\">&nbsp;</mi><mo>:</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H,</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>:</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi></math>", "isCorrect": false, "image": null}, {"id": "advcc", "text": "<math><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>:</mo><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l,</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>:</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>11</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">S</mi><msubsup><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow><mrow><mo>-</mo></mrow></msubsup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">N</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mo>+</mo></mrow></msup><mi mathvariant=\"normal\">,&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>:</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></math>", "isCorrect": false, "image": null}, {"id": "CKoTa", "text": "<math><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>:</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H,</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>:</mo><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l,</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">I</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>:</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>11</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">S</mi><msubsup><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow><mrow><mo>-</mo></mrow></msubsup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">N</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mo>+</mo></mrow></msup></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Water has large surface tension due to very strong interaction. Generally adding organic derivatives to water decreases its surface tension due to hydrophobic interaction.<br />In case III, hydrophobic interaction is stronger than case II causing surface tension to decrease more rapidly.<br />Due to <math><msup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mo>+</mo></mrow></msup><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mo>&#8211;</mo></mrow></msup></math> (inorganic electrolyte) intermolecular forces increases, surface tension increases.", "image": null}, "videoSolution": {"videoId": "6b8590876ecd442da71441b016844485", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/rt0UClz23a54z.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/rt0UClz23a54z.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf829", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2016-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2016 (Paper 2)", "title": "JEE Advanced 2016 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a1bf23ac7d519f9b167", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}], "type": "multipleCorrect", "level": 1, "question": {"text": "Choose the correct reason(s) for the stability of the lyophobic colloidal particles.", "image": null}, "options": [{"id": "nyq9k", "text": "Preferential adsorption of ions on their surface from the solution.", "isCorrect": true, "image": null}, {"id": "12CNz", "text": "Preferential adsorption of solvent on their surface from the solution.", "isCorrect": false, "image": null}, {"id": "gABzd", "text": "Attraction between different particles having opposite charges on their surface.", "isCorrect": false, "image": null}, {"id": "xW6xE", "text": "Potential difference between the fixed layer and the diffused layer of opposite charges around the colloidal particles.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "(a) When two or more ions are present in the dispersion medium, preferential adsorption of the ion common to the colloidal particle takes place.\r\n\r\n(d) This is called zeta potential which helps in increasing the stability of the lyophobic sol.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169e9f23ac7d519f9af99", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}], "question": {"text": "Among the following, the surfactant that will form micelles in aqueous solution at the lowest molar concentration at ambient conditions is", "image": null}, "options": [{"id": "7wbBX", "text": "\n$\\mathrm{CH}_3\\left(\\mathrm{CH}_2\\right)_{15} \\mathrm{~N}^{+}\\left(\\mathrm{CH}_3\\right)_3 \\mathrm{Br}^{-}$\n", "image": null, "isCorrect": true}, {"id": "piJhc", "text": "\n$\\mathrm{CH}_3\\left(\\mathrm{CH}_2\\right)_{11} \\mathrm{OSO}_3^{-} \\mathrm{Na}^{+}$\n", "image": null, "isCorrect": false}, {"id": "7GEH6", "text": "\n$\\mathrm{CH}_3\\left(\\mathrm{CH}_2\\right)_6 \\mathrm{COO}^{-} \\mathrm{Na}^{+}$\n", "image": null, "isCorrect": false}, {"id": "RqE0P", "text": "\n$\\mathrm{CH}_3\\left(\\mathrm{CH}_2\\right)_{11} \\mathrm{~N}^{+}\\left(\\mathrm{CH}_3\\right)_3 \\mathrm{Br}^{-}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Sodium Hexadecyl trimethylammonium bromide (CTAB) dodecylsulphate\n(SDS)\nCMC $(\\mathrm{mm})>-10$\n1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169d4f23ac7d519f9aeda", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}], "question": {"text": "Statement I Micelles are formed by surfactant molecules above the critical micellar concentration (CMC).\nStatement II The conductivity of a solution having surfactant molecules deceases sharply at the CMC.", "image": null}, "options": [{"id": "vNIpR", "text": "\nStatement I is true, Statement II is true, Statement II is a correct explanation for Statement I\n", "image": null, "isCorrect": false}, {"id": "BQWzI", "text": "\nStatement I is true, Statement II is true, Statement II is not a correct explanation for Statement I\n", "image": null, "isCorrect": true}, {"id": "iZ5c2", "text": "\nStatement I is true, Statement II is false\n", "image": null, "isCorrect": false}, {"id": "xje3j", "text": "\nStatement I is false, Statement II is true", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At a certain concentration surfactant molecules start to aggregate and form micelle, the concentration is called critical micellisation concentration (CMC).\nAggregation of surfactant molecules (ions; $\\mathrm{RCOO}^{-}$) micelle formation cause effective fall in number of free ions to conduct electricity, thus, conductivity decreases at CMC.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64b16ae6f23ac7d519f9b956", "title": "Preparation and Purification of colloids", "totalQuestions": 1, "questions": [{"_id": "64b16a72f23ac7d519f9b47c", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf82e", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Paper 1)", "title": "JEE Advanced 2019 (Paper 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Molar conductivity <math><mfenced separators=\"|\"><mrow><mrow><msub><mo stretchy=\"false\">&#8896;</mo><mrow><mi mathvariant=\"normal\">m</mi></mrow></msub><mrow><mi>&#160;</mi></mrow></mrow></mrow></mfenced></math> of aqueous solution of sodium stearate, which behaves as a strong electrolyte, is recorded at varying concentration(c) of sodium stearate. Which one of the following plots provides the correct representation of micelle formation in the solution?<br />(Critical micelle concentration (CMC) is marked with an arrow in the figures.)", "image": null}, "options": [{"id": "V6Y3C", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/lmslzqazyrhgykipvwtgrkmvvzcrcyhdgupccyucptwksprkkv.jpeg\"/>", "isCorrect": false, "image": null}, {"id": "0zSHb", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/iezawzcykurholerwcnnbudbtomgoohjqvwlcuhezpeqmlleov.jpeg\"/>", "isCorrect": false, "image": null}, {"id": "Uu6Qj", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/ecwzkjnuovpilktvqihprhicqlspuqyimromoibapsnqgxutdp.jpeg\"/>", "isCorrect": true, "image": null}, {"id": "GqJJE", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/ipysicjbxarsaqhgxjtqiizrkrctqsprfxwkyraxzhvxfmrjly.jpeg\"/>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "With increase in concentration of sodium stearate <math><msub><mrow><mtext>λ</mtext></mrow><mrow><mtext>M</mtext></mrow></msub></math> decreases, but at CNC, formation of miceller take place and the <math><msub><mrow><mtext>λ</mtext></mrow><mrow><mtext>M</mtext></mrow></msub></math> decrease abruptly, this change in <math><msub><mrow><mtext>λ</mtext></mrow><mrow><mtext>M</mtext></mrow></msub></math> with respect to <math><msqrt><mtext>c</mtext></msqrt></math> is represented by plot.", "image": null}, "videoSolution": {"videoId": "4a70adb371114e5ea626401d0f7325a2", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/kbKSLu3bu5F96.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/kbKSLu3bu5F96.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf82e", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Paper 1)", "title": "JEE Advanced 2019 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64b16ae6f23ac7d519f9b954", "title": "Properties of colloidal solution", "totalQuestions": 2, "questions": [{"_id": "64b16a61f23ac7d519f9b3e6", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf82b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2017-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2017 (Paper 2)", "title": "JEE Advanced 2017 (Paper 2)"}], "type": "multipleCorrect", "level": 1, "question": {"text": "The correct statement(s) about surface properties is(are)", "image": null}, "options": [{"id": "WWz1W", "text": "Cloud is an emulsion type of colloid in which liquid is dispersed phase and gas is dispersion medium", "isCorrect": false, "image": null}, {"id": "orAG5", "text": "Adsorption is accompanied by decrease in enthalpy and decrease in entropy of the system", "isCorrect": true, "image": null}, {"id": "BP6ZF", "text": "Brownian motion of colloidal particles does not depend on the size of the particles but depends on viscosity of the solution", "isCorrect": false, "image": null}, {"id": "fWeFm", "text": "The critical temperatures of ethane and nitrogen are 563 K and 126 K, respectively. The adsorption of ethane will be more than that of nitrogen on same amount of activated charcoal at a given temperature", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>(i)&nbsp; Emulsion is liquid in liquid type colloid.</p><p>(ii)&nbsp; For adsorption,<math><mi mathvariant=\"normal\">&#916;</mi><mi>H</mi><mo>&#60;</mo><mn>0</mn></math>&nbsp;and&nbsp;<math><mi mathvariant=\"normal\">&#916;</mi><mi>S</mi><mo>&#60;</mo><mn>0</mn></math></p><p>(iii)&nbsp; Smaller the size and less viscous the dispersion medium, more will be the Brownian motion.</p><p>(iv)&nbsp; Higher the&nbsp;<math><msub><mrow><mi>T</mi></mrow><mrow><mi>C</mi></mrow></msub></math>,&nbsp;greater will be the extent of adsorption.</p>", "image": null}, "videoSolution": {"videoId": "da8807d5b67c4b4dbfa7325845a76763", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/UAJP136A3yVEh.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/UAJP136A3yVEh.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf82b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2017-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2017 (Paper 2)", "title": "JEE Advanced 2017 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169f0f23ac7d519f9afd7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}], "question": {"text": "Among the electrolytes $\\mathrm{Na}_2 \\mathrm{SO}_4, \\mathrm{CaCl}_2 \\quad \\mathrm{Al}_2\\left(\\mathrm{SO}_4\\right)_3$ and $\\mathrm{NH}_4 \\mathrm{Cl}$, the most effective coagulating agent for $\\mathrm{Sb}_2 \\mathrm{~S}_3$ sol is", "image": null}, "options": [{"id": "0840G", "text": "\n$\\mathrm{Na}_2 \\mathrm{SO}_4$\n", "image": null, "isCorrect": false}, {"id": "wmx2e", "text": "\n$\\mathrm{CaCl}_2$\n", "image": null, "isCorrect": false}, {"id": "KdS3v", "text": "\n$\\mathrm{Al}_2\\left(\\mathrm{SO}_4\\right)_3$\n", "image": null, "isCorrect": true}, {"id": "iGwWH", "text": "\n$\\mathrm{NH}_4 \\mathrm{Cl}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{Sb}_2 \\mathrm{~S}_3$ is an anionic $\\mathrm{sol}_2$, therefore cation of highest valency ( $\\mathrm{Al}^{3+}$ in the present case) would be most effective coagulating agent.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "685103376bba689a3eb09cef", "title": "Adsorption isotherms", "totalQuestions": 2, "questions": [{"_id": "6a0be51644d287c9361e5cd6", "type": "numerical", "question": {"text": "At a given temperature, $0.45$ g of acetic acid in $50$ mL of water is shaken with $1.0$ g of charcoal and the pH of the resulting solution is $3.0$. Assume, the adsorption of acetic acid from the aqueous solution by charcoal follows Freundlich isotherm,<br>$\\dfrac{x}{m} = k C^{1/n}$<br>If the plot of $\\log_{10}(x/m)$ against $\\log_{10}C$ gives a straight line with slope $1$, the value of $k$ in L mol$^{-1}$ is ____.<br>Given: The molar mass of acetic acid is $60$ g mol$^{-1}$.<br>The acid dissociation constant of acetic acid is $1.0 \\times 10^{-5}$ at the given temperature.<br>$x$ is the mass (in grams) of acetic acid adsorbed.<br>$m$ is the mass (in grams) of charcoal.<br>$C$ is the equilibrium concentration of acetic acid in the solution after the adsorption is complete.<br>$k$ and $n$ are constants for acetic acid$-$charcoal system at the given temperature.", "image": null}, "options": [], "correctValue": "1.5", "solution": {"text": "Given the pH of the resulting solution is $3.0$, the concentration of $H^+$ ions is:<br>$[H^+] = 10^{-3} \\text{ M}$<br><br>For the dissociation of acetic acid ($CH_3COOH \\rightleftharpoons CH_3COO^- + H^+$), the acid dissociation constant is given by:<br>$K_a = \\dfrac{[CH_3COO^-][H^+]}{[CH_3COOH]}$<br><br>Assuming $[CH_3COO^-] \\approx [H^+]$ and the equilibrium concentration of acetic acid is $C$, we can use the approximation:<br>$K_a = \\dfrac{[H^+]^2}{C}$<br>$1.0 \\times 10^{-5} = \\dfrac{(10^{-3})^2}{C}$<br>$C = \\dfrac{10^{-6}}{1.0 \\times 10^{-5}} = 0.1 \\text{ M}$<br><br>The number of moles of acetic acid remaining in the $50 \\text{ mL}$ ($0.05 \\text{ L}$) solution at equilibrium is:<br>$n_{eq} = C \\times V = 0.1 \\text{ mol L}^{-1} \\times 0.05 \\text{ L} = 0.005 \\text{ mol}$<br><br>The mass of acetic acid remaining in the solution is:<br>$W_{eq} = n_{eq} \\times \\text{Molar mass} = 0.005 \\text{ mol} \\times 60 \\text{ g mol}^{-1} = 0.30 \\text{ g}$<br><br>The initial mass of acetic acid was $0.45 \\text{ g}$. The mass of acetic acid adsorbed ($x$) by the charcoal is:<br>$x = 0.45 \\text{ g} - 0.30 \\text{ g} = 0.15 \\text{ g}$<br><br>The Freundlich adsorption isotherm is given by:<br>$\\dfrac{x}{m} = k C^{1/n}$<br><br>Taking the logarithm on both sides:<br>$\\log_{10}\\left(\\dfrac{x}{m}\\right) = \\log_{10}k + \\dfrac{1}{n} \\log_{10}C$<br><br>The plot of $\\log_{10}(x/m)$ against $\\log_{10}C$ is a straight line with a slope of $1$. Therefore:<br>$\\dfrac{1}{n} = 1 \\Rightarrow n = 1$<br><br>Substitute the values into the isotherm equation ($m = 1.0 \\text{ g}$):<br>$\\dfrac{0.15}{1.0} = k (0.1)^1$<br>$k = \\dfrac{0.15}{0.1} = 1.5 \\text{ L mol}^{-1}$<br><br>Answer: $1.5$", "image": null}, "level": 2, "videoSolution": {"videoId": "8a18ce72ad5c4681b796920cd83f9c52", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/52FN3oiYZAihj.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/52FN3oiYZAihj.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b43", "title": "JEE Advanced 2026 (Paper 2)", "shortName": "2026 (Paper 2)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b43", "title": "JEE Advanced 2026 (Paper 2)", "shortName": "2026 (Paper 2)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "685102c56bba689a3eb09cc9", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "684c67d769037fad219cb0c2", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 2)", "title": "JEE Advanced 2025 (Paper 2)"}], "question": {"text": "Adsorption of phenol from its aqueous solution on to fly ash obeys Freundlich isotherm. At a given temperature, from $10 \\mathrm{mg} \\mathrm{g}^{-1}$ and $16 \\mathrm{mg} \\mathrm{g}^{-1}$ aqueous phenol solutions, the concentrations of adsorbed phenol are measured to be $4 \\mathrm{mg} \\mathrm{g}^{-1}$ and $10 \\mathrm{mg} \\mathrm{g}^{-1}$, respectively. At this temperature, the concentration (in $\\mathrm{mg} \\mathrm{g}^{-1}$ ) of adsorbed phenol from $20 \\mathrm{mg} \\mathrm{g}^{-1}$ aqueous solution of phenol will be $\\qquad$ .<br>Use : $\\log _{10} 2=0.3$", "image": null}, "options": [], "correctValue": "15.62", "solution": {"text": "$\\begin{aligned}\n& \\frac{x}{m}=K \\times C^{1 / n} \\\\\n& \\log \\left(\\frac{x}{m}\\right)=\\log K+\\frac{1}{n} \\log C \\\\\n& \\log 4=\\log K+\\frac{1}{n} \\log 10 \\\\\n& 0.6=\\log K+\\frac{1}{n} .....(1) \\\\\n& \\log 10=\\log K+\\frac{1}{n} \\log 16 \\\\\n& 1=\\log K+\\frac{1}{n} \\times 1.2 ....(2) \\end{aligned}$\nEquation (2) - equation (1)\n$0.4=\\frac{1}{\\mathrm{n}} \\times(0.2) \\Rightarrow \\mathrm{n}=0.5$\nand $\\log \\mathrm{K}=-1.4$\n$\\begin{aligned}\n& \\log \\frac{x}{m}=\\log K+\\frac{1}{n} \\times \\log C \\\\\n& =-1.4+2 \\times \\log 20\n\\end{aligned}$\n$\\begin{aligned} & =-1.4+2.6=1.2 \\\\ & \\frac{\\mathrm{x}}{\\mathrm{m}}=10^{+1.2}=16 \\\\ & \\left(\\log 2=0.3,4 \\log 2=1.2,16=10^{+1.2}\\right)\\end{aligned}$\n$\\begin{aligned}\n& \\frac{x}{m}=K \\times C^{1 / n} \\\\\n& 4=K(10)^{1 / n}....(1) \\\\ \n& 10=K(16)^{1 / n}....(2) \\\\\n& X=K(20)^{1 / n}....(3)\n\\end{aligned}$\nOn solving equation (1) and (2)\n$\\frac{1}{n}=2$\nOn solving equation (1) and (3)\n$\\frac{4}{X}=\\left(\\frac{10}{20}\\right)^2$\n$X=16$\nOn solving equation (2) and (3)\n$\\begin{aligned}\n& \\frac{10}{X}=\\left(\\frac{16}{20}\\right)^2 \\\\\n& X=15.625\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "f964a3055937476db0e4a1502db13c66", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/ug5nM46WpmrvX.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/ug5nM46WpmrvX.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "684c67d769037fad219cb0c2", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 2)", "title": "JEE Advanced 2025 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
