hvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\">C</mi></mrow></mover><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">O</mi><mo>+</mo><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> <br >         <math><mn>4</mn><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">O</mi><mover accent=\"false\"><mo>→</mo><mrow><msup><mrow><mn>1100</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\">C</mi></mrow></mover><mn>2</mn><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">u</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> <br >         <math><mn>2</mn><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">u</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">u</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">S</mi><mover accent=\"false\"><mo>→</mo><mrow><mo>∆</mo></mrow></mover><mn>6</mn><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">u</mi><mo>+</mo><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null}, "videoSolution": {"videoId": "0a6b87346fb74fc78db2cd2a08b68182", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/pA3mGFdH0mbMc.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/pA3mGFdH0mbMc.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf824", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014 (Paper 1)", "title": "JEE Advanced 2014 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a2ef23ac7d519f9b210", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf823", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 2)", "title": "JEE Advanced 2013 (Paper 2)"}], "type": "multipleCorrect", "level": 1, "question": {"text": "The carbon-based reduction method is NOT used for the extraction of&nbsp;", "image": null}, "options": [{"id": "5SBHR", "text": "tin from&nbsp;<math><mrow>  <mi>S</mi><mo>&ApplyFunction;</mo>  <mi>n</mi>  <msub>        <mrow>          <mi>O</mi><mo>&ApplyFunction;</mo>        </mrow>        <mn>2</mn>  </msub></mrow></math>", "isCorrect": false, "image": null}, {"id": "RRqDz", "text": "iron from <math><mrow>  <msub>          <mtext  mathvariant=\"italic\">Fe</mtext>        <mn>2</mn>  </msub>  <msub>        <mrow>          <mi>O</mi><mo>&ApplyFunction;</mo>        </mrow>        <mn>3</mn>  </msub></mrow></math>", "isCorrect": false, "image": null}, {"id": "mxXLM", "text": "aluminium from <math> <mrow> <msub> <mtext mathvariant=\"italic\">Al</mtext> <mn>2</mn> </msub> <msub> <mrow> <mi></mi><mi></mi><mi>O</mi><mo>⁡</mo> </mrow> <mn>3</mn> </msub> </mrow> </math>", "isCorrect": true, "image": null}, {"id": "UFOkY", "text": "magnesium from <math> <mrow> <msub> <mtext mathvariant=\"italic\">MgCO</mtext> <mn>3</mn> </msub> <mo>&middot;</mo> <msub> <mtext mathvariant=\"italic\">CaCO</mtext> <mn>3</mn> </msub> </mrow> </math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Smelting : The process of extracting a metal in the state of fusion is called smelting. In this process the ore is mixed with carbon, obtained after the above reactions and heated in suitable furnace.</p><p>SnO<sub>2</sub> and Fe<sub>2</sub>O<sub>3</sub> are reduced by C reduction method.<br />Al<sub>2</sub>O<sub>3</sub> and MgCO<sub>3</sub>. CaCO<sub>3</sub> are reduced by electrolytic reduction.</p>", "image": null}, "videoSolution": {"videoId": "db09b8ddc95847dfb87b2c1c89089bc5", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/H3boYhUL6HE2O.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/H3boYhUL6HE2O.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf823", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 2)", "title": "JEE Advanced 2013 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169fff23ac7d519f9b063", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}], "question": {"text": "<strong>Paragraph:</strong>\nCopper is the most noble of the first row transition metals and occurs in small deposits in several countries. Ores of copper include chalcanthite $\\left(\\mathrm{CuSO}_4 \\cdot 5 \\mathrm{H}_2 \\mathrm{O}\\right)$, atacamite $\\left(\\mathrm{Cu}_2 \\mathrm{Cl}(\\mathrm{OH})_3\\right)$, cuprite $\\left(\\mathrm{Cu}_2 \\mathrm{O}\\right)$, copper glance $\\left(\\mathrm{Cu}_2 \\mathrm{~S}\\right)$ and malachite $\\left(\\mathrm{Cu}_2(\\mathrm{OH})_2 \\mathrm{CO}_3\\right)$. However, 80\\% of the world copper production comes from the ore chalcopyrite $\\left(\\mathrm{CuFeS}_2\\right)$. The extraction of copper from chalcopyrite involves partial roasting, removal of iron and self-reduction.<strong>Question:</strong>\nIn self-reduction, the reducing species is", "image": null}, "options": [{"id": "fngPD", "text": "\n$\\mathrm{S}$\n", "image": null, "isCorrect": false}, {"id": "eXEKv", "text": "\n$\\mathrm{O}^{2-}$\n", "image": null, "isCorrect": false}, {"id": "XMqBt", "text": "\n$\\mathrm{S}^{2-}$\n", "image": null, "isCorrect": true}, {"id": "nbhFg", "text": "\n$\\mathrm{SO}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{S}^{2-}$ acts as reducing species $2 \\mathrm{Cu}_2 \\mathrm{O}+\\mathrm{Cu}_2 \\mathrm{~S}^{2-} \\longrightarrow 6 \\mathrm{Cu}+\\mathrm{SO}_2$\nMetallurgy\nConceptual\nIII, II, II", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169ebf23ac7d519f9afaa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}], "question": {"text": "Match the conversions in Column I with the type(s) given in Column II. Indicate your answer by darkening the appropriate bubbles of the $4 \\times 4$ matrix given in the ORS.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/ucomvVlKQ_CiBxOlv7mu0IFQfu05rElGpRWCcPrudJI.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "AlODh", "text": "\n(A) p, (B) q, (C) p,r, (D) p,r,s\n", "image": null, "isCorrect": true}, {"id": "zFPlc", "text": "\n(A) q,r, (B) p,q, (C) s, (D) q,r,s\n", "image": null, "isCorrect": false}, {"id": "DpeZA", "text": "\n(A) p, (B) q,s, (C) r, (D) q,r\n", "image": null, "isCorrect": false}, {"id": "89zV1", "text": "\n(A) p,q, (B) q, (C) p,q, (D) q,s", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/RTlN6ixNP8LakoAWNPJ2h8GaTB8etWo-T-TqYSxfK94.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169d3f23ac7d519f9aed0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}], "question": {"text": "Extraction for zinc from zinc blende is achieved by", "image": null}, "options": [{"id": "YY1wT", "text": "\nelectrolytic reduction\n", "image": null, "isCorrect": false}, {"id": "ahmw3", "text": "\nroasting followed by reduction with carbon\n", "image": null, "isCorrect": true}, {"id": "MiSAU", "text": "\nroasting followed by reduction with another metal\n", "image": null, "isCorrect": false}, {"id": "4uSze", "text": "\nroasting followed by self-reduction", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Zinc blende is roasted and then treated with coke for the reduction.\n$$\n\\begin{gathered}\n2 \\mathrm{ZnS}+3 \\mathrm{O}_2 \\stackrel{\\Delta}{\\longrightarrow} 2 \\mathrm{ZnO}+2 \\mathrm{SO}_2 \\uparrow \\\\\n\\mathrm{ZnO}+\\mathrm{C} \\stackrel{\\Delta}{\\longrightarrow} \\mathrm{Zn}+\\mathrm{CO} \\uparrow\n\\end{gathered}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169ccf23ac7d519f9ae8c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}], "question": {"text": "Match the extraction processes listed in column I with metals listed in column II.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/T1XuJuazCxU0ENveihRFEqo1WSHuTkcfu_MEsZeXbXA.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "XGoSV", "text": "\n(A) P,S, (B) R, (C) P,Q, (D) P,S\n", "image": null, "isCorrect": false}, {"id": "qD3e8", "text": "\n(A) Q,S, (B) R, (C) S, (D) S\n", "image": null, "isCorrect": false}, {"id": "kgu0t", "text": "\n(A) P,R, (B) P, R, (C) Q, (D) R\n", "image": null, "isCorrect": false}, {"id": "AhpHW", "text": "\n(A) P,R, (B) P, (C) Q, (D) S", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Column I\nColumn II\n(A) Self reduction $\\left[\\begin{array}{c}P \\text { - Lead } \\\\ R \\text { - Copper }\\end{array}\\right]$\n$$\n\\begin{aligned}\n& \\text { i.e., } A \\rightleftarrows P \\text { and } R \\\\\n& \\text { In lead metal } \\\\\n& \\qquad\\left\\{\\begin{array}{c}\n2 \\mathrm{PbS}+3 \\mathrm{O}_2 \\longrightarrow 2 \\mathrm{PbO}+2 \\mathrm{SO}_2 \\\\\n2 \\mathrm{PbO}+\\mathrm{PbS} \\longrightarrow 3 \\mathrm{~Pb}+\\mathrm{SO}_2\n\\end{array}\\right.\n\\end{aligned}\n$$\n(self reduction)\nIn copper metal\n$$\n\\begin{aligned}\n& 2 \\mathrm{Cu}_2 \\mathrm{~S}+3 \\mathrm{O}_2 \\longrightarrow 2 \\mathrm{Cu}_2 \\mathrm{O}+2 \\mathrm{SO}_2 \\\\\n& \\mathrm{Cu}_2 \\mathrm{~S}+2 \\mathrm{Cu}_2 \\mathrm{O} \\longrightarrow 6 \\mathrm{Cu}+\\mathrm{SO}_2\n\\end{aligned}\n$$\n(self reduction)\n(B) Carbon reduction $P$-lead\n$$\n\\begin{aligned}\n& \\text { i.e., } \\mathrm{B}-\\mathrm{P} \\\\\n& \\text { In lead metal } \\\\\n& \\qquad \\mathrm{PbO}+\\mathrm{C} \\longrightarrow \\mathrm{Pb}+\\mathrm{CO} \\\\\n& \\mathrm{PbO}+\\mathrm{CO} \\longrightarrow \\mathrm{Pb}+\\mathrm{CO}_2\n\\end{aligned}\n$$\nCarbon reduction process is used for the reduction of oxides of electropositive metals like $\\mathrm{Fe}, \\mathrm{Pb}$ etc. This reduction is carried out with coal or coke on strongly heating.\n(C) Complex formation and displacement by metal.\ni.e., $C-Q$ (silver)\n\nIn silver metal\nArgentite mineral of $\\mathrm{Ag}\\left(\\mathrm{Ag}_2 \\mathrm{~S}\\right)$ is treated with $0.7 \\% \\mathrm{NaCN}$ solution in presence of air, therefore firstly sodium argento cyanide complex is formed which on heating with zinc metal, therefore by displacement silver is isolated.\n$$\n\\begin{aligned}\n& \\mathrm{Ag}_2 \\mathrm{~S}+4 \\mathrm{NaCN} \\longrightarrow 2 \\mathrm{Na}\\left[\\mathrm{Ag}(\\mathrm{CN})_2\\right]+\\mathrm{Na}_2 \\mathrm{~S} \\\\\n& 2 \\mathrm{Na}\\left[\\mathrm{Ag}(\\mathrm{CN})_2\\right]+\\mathrm{Zn} \\longrightarrow \\mathrm{Na}\\left[\\mathrm{Zn}(\\mathrm{CN})_4\\right]+\\underset{\\text { Soluble }}{2 \\mathrm{Ag}} \\downarrow\n\\end{aligned}\n$$\n(D) Decomposition of iodide-(S) Boron\n$$\n\\text { i.e., }(D)-(S)\n$$\nBy decomposition of iodide boron metal is isolated.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64b16adbf23ac7d519f9b8c9", "title": "Flux and Refractory materials", "totalQuestions": 1, "questions": [{"_id": "64b169fff23ac7d519f9b062", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}], "question": {"text": "<strong>Paragraph:</strong>\nCopper is the most noble of the first row transition metals and occurs in small deposits in several countries. Ores of copper include chalcanthite $\\left(\\mathrm{CuSO}_4 \\cdot 5 \\mathrm{H}_2 \\mathrm{O}\\right)$, atacamite $\\left(\\mathrm{Cu}_2 \\mathrm{Cl}(\\mathrm{OH})_3\\right)$, cuprite $\\left(\\mathrm{Cu}_2 \\mathrm{O}\\right)$, copper glance $\\left(\\mathrm{Cu}_2 \\mathrm{~S}\\right)$ and malachite $\\left(\\mathrm{Cu}_2(\\mathrm{OH})_2 \\mathrm{CO}_3\\right)$. However, 80\\% of the world copper production comes from the ore chalcopyrite $\\left(\\mathrm{CuFeS}_2\\right)$. The extraction of copper from chalcopyrite involves partial roasting, removal of iron and self-reduction.<strong>Question:</strong>\nIron is removed from chalcopyrite as", "image": null}, "options": [{"id": "3qDGq", "text": "\n$\\mathrm{FeO}$\n", "image": null, "isCorrect": false}, {"id": "gAJdR", "text": "\n$\\mathrm{FeS}$\n", "image": null, "isCorrect": false}, {"id": "FfIt5", "text": "\n$\\mathrm{Fe}_2 \\mathrm{O}_3$\n", "image": null, "isCorrect": false}, {"id": "ed9Nz", "text": "\n$\\mathrm{FeSiO}_3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Iron is removed in the form of slag of $\\mathrm{FeSiO}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64b16adaf23ac7d519f9b8c8", "title": "Extraction of Metals", "totalQuestions": 10, "questions": [{"_id": "64b16aa2f23ac7d519f9b631", "type": "multipleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}], "question": {"text": "The correct statement(s) related to processes involved in the extraction of metals is(are)<br />&nbsp;", "image": null}, "options": [{"id": "VO7z6", "text": "Roasting of Malachite produces Cuprite<br />&nbsp;", "image": null, "isCorrect": false}, {"id": "JtBsC", "text": "Calcination of Calamine produces Zincite<br />&nbsp;", "image": null, "isCorrect": true}, {"id": "UxtzX", "text": "Copper pyrites is heated with silica in a reverberatory furnace to remove iron<br />&nbsp;", "image": null, "isCorrect": true}, {"id": "Z5rW7", "text": "Impure silver is treated with aqueous <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>KCN</mi></math> in the presence of oxygen followed by reduction with zinc metal", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The ore Calamine contain&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ZnCO</mi><mn>3</mn></msub></math>. The Calamine on heating produces&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ZnO</mi></math>.<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>ZnCO</mi><mn>3</mn></msub><mover><mo>&#8594;</mo><mo>&#8710;</mo></mover><mi>ZnO</mi><mo>+</mo><msub><mi>CO</mi><mn>2</mn></msub></math></p><p>Cyanide process, also called Macarthur-forrest Process, method of extracting silver from impure&nbsp;ores by dissolving them in a dilute solution of sodium cyanide in the presence of oxygen. The complex formed in the above process reduced to silver metal by the treatment with zinc.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><mi>Ag</mi><mo>+</mo><mi>NaCN</mi><mover><mo>&#8594;</mo><mrow></mrow></mover><mi>Na</mi><mfenced close=\"]\" open=\"[\"><mrow><mi>Ag</mi><msub><mfenced><mi>CN</mi></mfenced><mn>2</mn></msub></mrow></mfenced><mo>+</mo><mi>NaOH</mi><mspace linebreak=\"newline\"></mspace><mi>Na</mi><mfenced close=\"]\" open=\"[\"><mrow><mi>Ag</mi><msub><mfenced><mi>CN</mi></mfenced><mn>2</mn></msub></mrow></mfenced><mover><mo>&#8594;</mo><mi>Zn</mi></mover><msub><mi>Na</mi><mn>2</mn></msub><mfenced close=\"]\" open=\"[\"><mrow><mi>Zn</mi><msub><mfenced><mi>CN</mi></mfenced><mn>4</mn></msub></mrow></mfenced><mo>+</mo><mi>Ag</mi><mspace linebreak=\"newline\"></mspace></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SiO</mi><mn>2</mn></msub></math>​&nbsp;(Silica) is a flux material. It removes impurities as slag. Here, slag consists of Iron in Sulphide ore of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cu</mi></math>, here impurity is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>FeO</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>FeO</mi><mo>+</mo><msub><mi>SiO</mi><mn>2</mn></msub><mover><mo>&#8594;</mo><mrow></mrow></mover><msub><mi>FeSiO</mi><mn>3</mn></msub></math></p><p>Malachite green is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CuCO</mi><mn>3</mn></msub><mo>.</mo><mi>Cu</mi><msub><mfenced><mi>OH</mi></mfenced><mn>2</mn></msub></math>&nbsp;and cuprite is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Cu</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>. The ore malachite green on heating gives cupric oxide but not cuprous oxide.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CuCO</mi><mn>3</mn></msub><mo>.</mo><mi>Cu</mi><msub><mfenced><mi>OH</mi></mfenced><mn>2</mn></msub><mover><mo>&#8594;</mo><mo>&#8710;</mo></mover><mn>2</mn><mi>CuO</mi><mo>+</mo><msub><mi>CO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math></p>", "image": null}, "videoSolution": {"videoId": "cb280608fe1245da835b36b2d21e50db", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/CSLfaw4N5J3RJ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/CSLfaw4N5J3RJ.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a9df23ac7d519f9b607", "previousYearPapers": [{"_id": "632c83583e3fd59bda92e46d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 2)", "title": "JEE Advanced 2022 (Paper 2)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "The correct option(s) related to the extraction of iron from its ore in the blast furnace operating in the temperature range <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>900</mn><mo>-</mo><mn>1500</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math> is(are)", "image": null}, "options": [{"id": "kOydp", "text": "Limestone is used to remove silicate impurity.", "isCorrect": true, "image": null}, {"id": "r1fic", "text": "Pig iron obtained from blast furnace contains about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>%</mo></math> carbon.", "isCorrect": true, "image": null}, {"id": "uu55E", "text": "Coke <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">C</mi></mfenced></math>converts <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math>&nbsp;to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CO</mi></math>.", "isCorrect": true, "image": null}, {"id": "Pemqc", "text": "Exhaust gases consist of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CO</mi></math>.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>(A) Limestone is added to remove silica as impurity.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CaO</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi>SiO</mi><mn>2</mn></msub><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><msub><mi>CaSiO</mi><mn>3</mn></msub><mo>&#160;</mo><mo>(</mo><mi>in</mi><mo>&#160;</mo><mi>the</mi><mo>&#160;</mo><mi>temperature</mi><mo>&#160;</mo><mi>range</mi><mo>&#160;</mo><mn>900</mn><mo>&#160;</mo><mo>&#8211;</mo><mo>&#160;</mo><mn>1500</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>)</mo></math></p><p>(B) Pig iron obtained from blast furnace contains <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>%</mo></math> carbon and many other impurities (eg. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi><mo>,</mo><mi mathvariant=\"normal\">P</mi><mo>,</mo><mi>Si</mi><mo>,</mo><mi>Mn</mi></math>) in small amount.</p><p>&nbsp;In fusion zone molten iron becomes heavy by absorbing elemental impurities and produces Pig iron. (in the temperature range 900 &ndash; 1500 K)</p><p>(C) Coke <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">C</mi></mfenced></math> converts <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math>&nbsp;in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CO</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi><mo>+</mo><msub><mi>CO</mi><mn>2</mn></msub><mo>&#8594;</mo><mn>2</mn><mi>CO</mi></math></p><p>(D) Exhaust gases consist of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CO</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math>.</p><p>Exhaust gases does not contain NO<sub>2</sub></p><p>Hence, (A,B,C)&nbsp;are correct.</p>", "image": null}, "videoSolution": {"videoId": "e2c76d9d9bc045e5b605997edb552f54", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/ObbUOLZ1Csyiz.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/ObbUOLZ1Csyiz.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "632c83583e3fd59bda92e46d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 2)", "title": "JEE Advanced 2022 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a97f23ac7d519f9b5d0", "previousYearPapers": [{"_id": "632c83573e3fd59bda92e46c", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 1)", "title": "JEE Advanced 2022 (Paper 1)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "The electrochemical extraction of aluminium from bauxite ore involves", "image": null}, "options": [{"id": "UKU9w", "text": "the reaction of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Al</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math> with coke <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">C</mi></mfenced></math> at a temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#62;</mo><mn>2500</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>.", "isCorrect": false, "image": null}, {"id": "w3V0g", "text": "the neutralization of aluminate solution by passing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math> gas to precipitate hydrated alumina <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>Al</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>.</mo><mn>3</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></mfenced></math>.", "isCorrect": true, "image": null}, {"id": "bpnCC", "text": "the dissolution of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Al</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math> in hot aqueous <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math>.", "isCorrect": true, "image": null}, {"id": "MiNuT", "text": "the electrolysis of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Al</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math> mixed with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>3</mn></msub><msub><mi>AlF</mi><mn>6</mn></msub></math> to give <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Al</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math>.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>(A) The reduction of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Al</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math> with coke <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">C</mi></mfenced></math> at a temperature <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#62;</mo><mn>2500</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> is not carried out due to the formation of carbides.</p><p>(B) It is correct as neutralisation of aluminate solution is done by passing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math> gas to precipitate hydrated alumina.</p><p>(C) Reaction of powdered one is carried out with hot concentrated <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>473</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>-</mo><mn>523</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>35</mn><mo>-</mo><mn>36</mn></math>&nbsp;bar pressure.</p><p>(D)Aluminium In the metallurgy of aluminium, purified Al<sub>2</sub>O<sub>3</sub> is mixed with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>3</mn></msub><msub><mi>AlF</mi><mn>6</mn></msub></math>&nbsp;or CaF<sub>2</sub> which lowers the melting point of the mixture and brings conductivity.Thus electrolysis of the molten mass is carried out in an electrolytic cell using carbon electrodes. The oxygen liberated at anode reacts with the carbon of anode producing CO and CO<sub>2</sub>&nbsp;and Al at the cathode.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "a67ca494f07f4b619ab42bf1cb75ead1", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/l5sWV1k0rWrJB.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/l5sWV1k0rWrJB.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "632c83573e3fd59bda92e46c", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 1)", "title": "JEE Advanced 2022 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a84f23ac7d519f9b526", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf831", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2020-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2020 (Paper 2)", "title": "JEE Advanced 2020 (Paper 2)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "Which among the following statement(s) is (are) true for the extraction of aluminium from bauxite?", "image": null}, "options": [{"id": "tJiCd", "text": "Hydrated <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Al</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math> precipitates, when <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math> is bubbled through a solution of sodium aluminate.", "isCorrect": true, "im : null}, {"id": "jblje", "text": "Impurities settle as anode-mud.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Impure Cu is used as anode pure Cu deposited at cathode. Electrolyte is acidified solution of  <math><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math>  impurities settle as anode mud.", "image": null}, "videoSolution": {"videoId": "d95e27079d2040888a8e16ff7da2748a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/UoTZDoESi8lyd.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/UoTZDoESi8lyd.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf826", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015 (Paper 1)", "title": "JEE Advanced 2015 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a27f23ac7d519f9b1d7", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf822", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 1)", "title": "JEE Advanced 2013 (Paper 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Sulfide ores are common for the metals&nbsp;", "image": null}, "options": [{"id": "KIh2l", "text": "Ag, Cu and Pb", "isCorrect": true, "image": null}, {"id": "0XBR3", "text": "Ag, Cu and&nbsp;Sn", "isCorrect": false, "image": null}, {"id": "btdRA", "text": "Ag, Mg and Pb", "isCorrect": false, "image": null}, {"id": "G9JEx", "text": "Al, Cu and Pb", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math> <mrow> <mtable> <mtr> <mtd> <msub> <mtext>Cu</mtext> <mn>2</mn> </msub> <mtext>S</mtext> <mo>-</mo> <mtext>Copper glance</mtext> </mtd> </mtr> <mtr> <mtd> <msub> <mtext>Ag</mtext> <mn>2</mn> </msub> <mtext>S</mtext> <mo>-</mo> <mtext>Silver glance</mtext> </mtd> </mtr> <mtr> <mtd> <mtext>PbS</mtext> <mo>-</mo> <mtext>galena</mtext></mtd></mtr></mtable></mrow></math></p><p>Common ore for :&nbsp;</p><p>Al : Al<sub>2</sub>O<sub>3</sub></p><p>Mg : MgCl<sub>2</sub></p><p>Sn : SnO<sub>2</sub></p>", "image": null}, "videoSolution": {"videoId": "9065440ac4654f19892b0e331b589040", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/5HoUoJuJd4p8p.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/5HoUoJuJd4p8p.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf822", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 1)", "title": "JEE Advanced 2013 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a21f23ac7d519f9b198", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "In the cyanide extraction process of silver from argentite ore, the oxidising and reducing agents used are", "image": null}, "options": [{"id": "i2XjE", "text": "$\\mathrm{O}_{2}$ and $\\mathrm{CO}$ respectively", "isCorrect": false, "image": null}, {"id": "mkhXV", "text": "$\\mathrm{O}_{2}$ and $\\mathrm{Zn}$ dust respectively", "isCorrect": true, "image": null}, {"id": "13YUP", "text": "$\\mathrm{HNO}_{3}$ and $\\mathrm{Zn}$ dust respectively", "isCorrect": false, "image": null}, {"id": "HSYOu", "text": "$\\mathrm{HNO}_{3}$ and $\\mathrm{CO}$ respectively", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reactions involved in cyanide extraction process are:\r\n\r\n$\\underset{\\text { (argentite) }}{\\mathrm{Ag}_{2} \\mathrm{~S}}+4 \\mathrm{NaCN} \\rightarrow 2 \\mathrm{Na}\\left[\\mathrm{Ag}(\\mathrm{CN})_{2}\\right]+\\mathrm{Na}_{2} \\mathrm{~S}$\r\n\r\n$4 \\mathrm{Na}_{2} \\mathrm{~S}+\\underset{\\text { Oxiding agent }}{5 \\mathrm{O}_{2}}+2 \\mathrm{H}_{2} \\mathrm{O} \\rightarrow 2 \\mathrm{Na}_{2} \\mathrm{SO}_{4}+4 \\mathrm{NaOH}+2 \\mathrm{~S}$\r\n\r\n$2 \\mathrm{Na}\\left[\\mathrm{Ag}(\\mathrm{CN})_{2}\\right]+\\underset{\\begin{array}{c}\\text { (reducing } \\\\ \\text { agent) }\\end{array}}{\\mathrm{Zn}} \\rightarrow \\mathrm{Na}_{2}\\left[\\mathrm{Zn}(\\mathrm{CN})_{4}\\right]+2 \\mathrm{Ag} \\downarrow$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a0df23ac7d519f9b0e5", "type": "multipleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}], "question": {"text": "Extraction of metal from the ore cassiterite involves", "image": null}, "options": [{"id": "bzRSy", "text": "\ncarbon reduction of an oxide ore\n", "image": null, "isCorrect": true}, {"id": "cwRIR", "text": "\nself-reduction of a sulphide ore\n", "image": null, "isCorrect": false}, {"id": "KCv7H", "text": "\nremoval of copper impurity\n", "image": null, "isCorrect": false}, {"id": "Bpr21", "text": "\nremoval of iron impurity", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The important ore of tin is cassiterite $\\left(\\mathrm{SnO}_2\\right)$. Tin is extracted from cassiterite ore by carbon reduction method in a blast furnace. $\\mathrm{SnO}_2+2 \\mathrm{C} \\rightarrow \\mathrm{Sn}+2 \\mathrm{CO}$\nThe product often contain traces of iron which is removed by blowing air through the melt to oxidise to $\\mathrm{FeO}$ which then floats to the surface.\n$2 \\mathrm{Fe}+\\mathrm{O}_2 \\rightarrow 2 \\mathrm{FeO}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169fff23ac7d519f9b061", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}], "question": {"text": "<strong>Paragraph:</strong>\nCopper is the most noble of the first row transition metals and occurs in small deposits in several countries. Ores of copper include chalcanthite $\\left(\\mathrm{CuSO}_4 \\cdot 5 \\mathrm{H}_2 \\mathrm{O}\\right)$, atacamite $\\left(\\mathrm{Cu}_2 \\mathrm{Cl}(\\mathrm{OH})_3\\right)$, cuprite $\\left(\\mathrm{Cu}_2 \\mathrm{O}\\right)$, copper glance $\\left(\\mathrm{Cu}_2 \\mathrm{~S}\\right)$ and malachite $\\left(\\mathrm{Cu}_2(\\mathrm{OH})_2 \\mathrm{CO}_3\\right)$. However, 80\\% of the world copper production comes from the ore chalcopyrite $\\left(\\mathrm{CuFeS}_2\\right)$. The extraction of copper from chalcopyrite involves partial roasting, removal of iron and self-reduction.<strong>Question:</strong>\nPartial roasting of chalcopyrite produces", "image": null}, "options": [{"id": "kk8N1", "text": "\n$\\mathrm{Cu}_2 \\mathrm{~S}$ and $\\mathrm{FeO}$\n", "image": null, "isCorrect": true}, {"id": "cJU83", "text": "\n$\\mathrm{Cu}_2 \\mathrm{O}$ and $\\mathrm{FeO}$\n", "image": null, "isCorrect": false}, {"id": "o0sgx", "text": "\n$\\mathrm{CuS}$ and $\\mathrm{Fe}_2 \\mathrm{O}_3$\n", "image": null, "isCorrect": false}, {"id": "SQ0Wl", "text": "\n$\\mathrm{Cu}_2 \\mathrm{O}$ and $\\mathrm{Fe}_2 \\mathrm{O}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$2 \\mathrm{CuFeS}_2+4 \\mathrm{O}_2 \\longrightarrow \\mathrm{Cu}_2 \\mathrm{~S}$\n$$\n+2 \\mathrm{FeO}+3 \\mathrm{SO}_2\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169e1f23ac7d519f9af54", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c42", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 1)", "title": "JEE Advanced 2008 (Paper 1)"}], "question": {"text": "Native silver metal forms a water soluble complex with a dilute aqueous solution of $\\mathrm{NaCN}$ in the presence of", "image": null}, "options": [{"id": "P09Jy", "text": "\nnitrogen\n", "image": null, "isCorrect": false}, {"id": "EFlpC", "text": "\noxygen\n", "image": null, "isCorrect": true}, {"id": "2q7Mg", "text": "\ncarbon dioxide\n", "image": null, "isCorrect": false}, {"id": "fNkBj", "text": "\nargon", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A water soluble complex of silver with a dilute aqueous solution of $\\mathrm{NaCN}$ is sodium argentocyanide. In the cyanide process, the native form is crushed and treated with $0.1-0.2 \\%$ solution of $\\mathrm{NaCN}$ and aerated.\n$$\n4 \\mathrm{Ag}+8 \\mathrm{NaCN}+2 \\mathrm{H}_2 \\mathrm{O}+\\mathrm{O}_2 \\longrightarrow 4 \\mathrm{Na}\\left[\\mathrm{Ag}(\\mathrm{CN})_2\\right]+4 \\mathrm{NaOH}\n$$\nArgentocyanide is soluble. Further, metals are recovered from the complex by reduction with zinc", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c42", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 1)", "title": "JEE Advanced 2008 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};

      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
