ds of the leaving groups in $\\mathbf{P}, \\mathbf{Q}$ and $\\mathbf{R}$ follows the order $\\mathbf{R}>\\mathbf{Q}>\\mathbf{P}$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/ukz9vPmqMsjg34CtucfqKDkoaRjDd_89Rw3UHZig5-k.original.fullsize.png\"><br>(A) Wrong: bond length order $\\mathrm{Q}>\\mathrm{P}>\\mathrm{R}$\n(B) Correct: Bond enthalpy $\\mathrm{R}>\\mathrm{P}>\\mathrm{Q}$\n(C) Wrong: $\\mathrm{S}_{\\mathrm{N}} 2$ reactivity $\\quad \\mathrm{Q}>\\mathrm{P}>\\mathrm{R}$\n(D) Wrong: $\\mathrm{pKa}(\\mathrm{HI} <\\mathrm{HBr} <\\mathrm{HF}) \\quad \\mathrm{R}>$ P $>\\mathrm{Q}(\\mathrm{pKa})$", "image": null}, "videoSolution": {"videoId": "92e9b6934b094ad69b4b056dafd42297", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/iZdC0Y5GVHV9C.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/iZdC0Y5GVHV9C.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "684c67d769037fad219cb0c1", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 1)", "title": "JEE Advanced 2025 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16aa9f23ac7d519f9b672", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}], "question": {"text": "<p>The reaction of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>-methyloct-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>-ene <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">P</mi><mo>,</mo><mn>2</mn><mo>.</mo><mn>52</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></math> with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HBr</mi></math> in the presence of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><mrow><msub><mi mathvariant=\"normal\">C</mi><mn>6</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub><mi>CO</mi></mrow></mfenced><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>&nbsp;gives two isomeric bromides in a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>:</mo><mo>&#160;</mo><mn>1</mn></math>&nbsp;ratio, with a combined yield of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>%</mo></math>. Of these, the entire amount of the primary alkyl bromide was reacted with an appropriate amount of diethylamine followed by treatment with aq. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">K</mi><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub></math>&nbsp;to give a non-ionic product <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math>&nbsp;in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn><mo>%</mo></math> Yield. The mass (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>mg</mi></math> ) of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> obtained is</p><p>[Use molar mass (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>gmol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> ): <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi><mo>=</mo><mn>1</mn><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>=</mo><mn>12</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">N</mi><mo>=</mo><mn>14</mn><mo>,</mo><mi>Br</mi><mo>=</mo><mn>80</mn></math>&nbsp;]</p>", "image": null}, "options": [], "correctValue": "1791", "solution": {"text": "<blockquote><p>The 1-alkene undergo addition reaction and major product formed according to anti-Markonikov&#39;s rule.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/90f8dfa8-7afa-41b8-8ecd-435fe27fadf0.png\" style=\"width: 821px; height: 147px;\" /></p><p>Moles of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mi>Mass</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi>Molar</mi><mo>&#160;</mo><mi>mass</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi mathvariant=\"normal\">P</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mo>.</mo><mn>52</mn></mrow><mn>252</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>01</mn><mo>&#160;</mo><mi>mol</mi></math></p><p>Given that isomeric bromides formed&nbsp;have&nbsp;the mole fractions&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>10</mn></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>10</mn></mfrac></math></p><p>Moles of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>(major product)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>.</mo><mn>02</mn><mo>&#215;</mo><mfrac><mn>9</mn><mn>10</mn></mfrac><mo>&#215;</mo><mfrac><mn>50</mn><mn>100</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>009</mn><mo>&#160;</mo><mi>mol</mi></math></p><p>Now the alkyl bromide formed undergo nucleophilic substitution reaction with diethyl amine and potassium carbonate.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/43d3b502-9f07-4b07-ae37-f5adc3ff919c.png\" style=\"width: 903px; height: 128px;\" /></p><p>In the above reaction, the product&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> formed has the molecular weight&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>199</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>&#160;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p>Mass of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>009</mn><mo>&#215;</mo><mn>199</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>.</mo><mn>791</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1791</mn><mo>&#160;</mo><mi>mg</mi></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "c56c66215b674c25b527c8f0dde61913", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/iIDIVpX4mNofe.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/iIDIVpX4mNofe.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16aa3f23ac7d519f9b640", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}], "question": {"text": "<p>Match the reactions in List-I with the features of their products in List-II and choose the correct option.</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td>List I</td>\t\t\t<td>&nbsp;</td>\t\t\t<td>List II</td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">P</mi><mo>)</mo></math></td>\t\t\t<td>\t\t\t<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mrow><mfenced><mo>-</mo></mfenced><mo>-</mo><mn>1</mn><mo>-</mo><mi>Bromo</mi><mo>-</mo><mn>2</mn><mo>-</mo><mi>ethylpentane</mi></mrow><mrow><mo>(</mo><mi>Single</mi><mo>&#160;</mo><mi>enantiomer</mi><mo>)</mo></mrow></munder><mo>&#160;</mo><mo>&#160;</mo><munderover><mo>&#8594;</mo><mrow><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">N</mi></msub><mo>&#160;</mo><mn>2</mn><mo>&#160;</mo><mo>&#160;</mo><mi>reaction</mi></mrow><mrow><mi>aq</mi><mo>.&#160;</mo><mi>NaOH</mi></mrow></munderover></math></p>\t\t\t</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math></td>\t\t\t<td>Inversion of configuration</td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">Q</mi><mo>)</mo></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mrow><mfenced><mo>-</mo></mfenced><mo>-</mo><mn>2</mn><mo>-</mo><mi>Bromopentane</mi></mrow><mfenced><mrow><mi>Single</mi><mo>&#160;</mo><mi>Enantiomer</mi></mrow></mfenced></munder><mo>&#160;</mo><mo>&#160;</mo><munderover><mo>&#8594;</mo><mrow><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">N</mi></msub><mo>&#160;</mo><mn>2</mn><mo>&#160;</mo><mi>reaction</mi></mrow><mrow><mi>aq</mi><mo>.&#160;</mo><mi>NaOH</mi></mrow></munderover><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math></td>\t\t\t<td>Retention of configuration</td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>)</mo></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mrow><mfenced><mo>-</mo></mfenced><mo>-</mo><mn>3</mn><mo>-</mo><mi>Bromo</mi><mo>-</mo><mn>3</mn><mo>-</mo><mo>&#160;</mo><mi>methylhexane</mi><mo>&#160;</mo></mrow><mfenced><mrow><mi>Single</mi><mo>&#160;</mo><mi>Enatiomer</mi></mrow></mfenced></munder><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><munderover><mo>&#8594;</mo><mrow><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">N</mi></msub><mn>1</mn></mrow><mrow><mi>aq</mi><mo>.</mo><mi>NaOH</mi></mrow></munderover></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math></td>\t\t\t<td>Mixture of enantiomers</td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">S</mi><mo>)</mo></math></td>\t\t\t<td><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/3fc785cc-3cbd-48aa-a886-784a5da46092.png\" style=\"width: 370px; height: 85px;\" /></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math></td>\t\t\t<td>Mixture of structural isomers</td>\t\t</tr>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td>&nbsp;</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math></td>\t\t\t<td>Mixture of diastereomers</td>\t\t</tr>\t</tbody></table><p>&nbsp;</p>", "image": null}, "options": [{"id": "3llK8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mn>1</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Q</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mn>2</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mn>5</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "eUJbe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mn>2</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Q</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mn>1</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mn>3</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mn>5</mn></math>", "image": null, "isCorrect": true}, {"id": "wCa1C", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>&#8594;</mo><mn>1</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Q</mi><mo>&#8594;</mo><mn>2</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>&#8594;</mo><mn>5</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>&#8594;</mo><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "aGycO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mn>2</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Q</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mn>4</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mn>3</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mn>5</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mrow><mn>1</mn><mo>-</mo><mi>Bromo</mi><mo>-</mo><mn>2</mn><mo>-</mo><mi>ethylpentane</mi></mrow><mrow><mo>(</mo><mi>Single</mi><mo>&#160;</mo><mi>enantiomer</mi><mo>)</mo></mrow></munder><mo>&#160;</mo><mo>&#160;</mo><munderover><mo>&#8594;</mo><mrow><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">N</mi></msub><mo>&#160;</mo><mn>2</mn><mo>&#160;</mo><mo>&#160;</mo><mi>reaction</mi></mrow><mrow><mi>aq</mi><mo>.&#160;</mo><mi>NaOH</mi></mrow></munderover><mn>2</mn><mo>-</mo><mi>ethylpentanol</mi></math></p><p>In the above reaction the chiral carbon is not involving in the reaction as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">N</mi></msub><mn>2</mn></math>&nbsp;reaction takes place via formation of transition state but not through formation of intermediate.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/3a6287c0-869a-41a6-b4b1-682673450b19.png\" style=\"width: 491px; height: 197px;\" /></p><p>In the above reaction, bromine attached to chiral carbon, and it is involving in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">N</mi></msub><mn>2</mn></math>&nbsp;reaction. Hence, the alcohol formed in inversion configuration.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/bd3d8dc7-e09e-42a3-97d3-06111b828e3c.png\" style=\"width: 759px; height: 214px;\" /></p><p>The substrate is undergoing&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">N</mi></msub><mn>1</mn></math>&nbsp;reaction. It takes place via formation of carbocation. Carbocation as planar, hence, the alcohol product formed is racemic mixture as nucleophile can attack from both the planes.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/80fe6476-4caf-439e-9013-7c743fddd96e.png\" style=\"width: 677px; height: 132px;\" /></p><p>The substrate is undergoing&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">N</mi></msub><mn>1</mn></math>&nbsp;&nbsp;reaction. It takes place via formation of carbocation. Carbocation as planar, hence, the two alcohol products are formed as nucleophile can attack from both the planes but the substrate&nbsp;already having the chiral centre, the mixture formed is diastereomeric mixture.<br />&nbsp;</p></blockquote>", "image": null}, "videoSolution": {"videoId": "276aa1d44de743d5888fb7951765bfe0", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/2Qthy3jb5q6kW.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/2Qthy3jb5q6kW.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}, "evalStatus": "correct", "lastPracticed": "2024-12-21T06:42:15.249Z"}, {"_id": "64b16a91f23ac7d519f9b59b", "previousYearPapers": [{"_id": "619f94437e944e1fdc2859b5", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 2)", "title": "JEE Advanced 2021 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<strong> Paragraph: </strong>\r\n\r\nThe amount of energy required to break a bond is same as the amount of energy released when the same bond is formed. In gaseous state, the energy required for homolytic cleavage of a bond is called Bond Dissociation Energy (BDE) or Bond Strength. BDE is affected by $s$-character of the bond and the stability of </mn></msub><mi>Cl</mi></math> formation is endothermic with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;H</mi><mo>&#176;</mo><mo>=</mo><mo>+</mo><mn>27</mn><mo>&#160;</mo><mi mathvariant=\"normal\">k</mi><mo>&#160;</mo><mi>cal</mi><mo>&#160;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "isCorrect": false, "image": null}, {"id": "l16uc", "text": "The reaction is exothermic with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;H</mi><mo>&#176;</mo><mo>=</mo><mo>-</mo><mn>25</mn><mo>&#160;</mo><mi mathvariant=\"normal\">k</mi><mo>&#160;</mo><mi>cal</mi><mo>&#160;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>4</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><msub><mi>Cl</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mover><mo>&#8594;</mo><mi>light</mi></mover><msub><mi>CH</mi><mn>3</mn></msub><mi>Cl</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><mi>HCl</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced></math><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>&#916;H</mi><mi mathvariant=\"normal\">r</mi><mo>&#8728;</mo></msubsup><mo>=</mo><mo>&#8721;</mo><msub><mfenced><mi>BDE</mi></mfenced><mi>reactans</mi></msub><mo>&#8722;</mo><mo>&#8721;</mo><msub><mfenced><mi>BDE</mi></mfenced><mi>products</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msub><mi mathvariant=\"normal\">E</mi><mrow><mi mathvariant=\"normal\">C</mi><mo>&#8722;</mo><mi mathvariant=\"normal\">H</mi></mrow></msub><mo>+</mo><msub><mi mathvariant=\"normal\">E</mi><mrow><mi>Cl</mi><mo>&#8722;</mo><mi>Cl</mi></mrow></msub><mo>&#8722;</mo><msub><mi mathvariant=\"normal\">E</mi><mrow><mi mathvariant=\"normal\">C</mi><mo>&#8722;</mo><mi>Cl</mi> stion-pool.getmarks.app/pyq/jee_advanced/Jee_advance_paper_2_Chem_Q.8_Opp_3.jpg\"/>", "isCorrect": true, "image": null}, {"id": "PR7bo", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Jee_advance_paper_2_Chem_Q.8_Opp_4.jpg\"/>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Jee_advance_paper_2_Chem_Q.26_Ans_1.jpg\"/></p><p><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Jee_advance_paper_2_Chem_Q.26_Ans_2.jpg\"/><br/> </p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Jee_advance_paper_2_Chem_Q.26_Ans_3.jpg\"/><br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Jee_advance_paper_2_Chem_Q.26_Ans_4.jpg\"/><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Jee_advance_paper_2_Chem_Q.26_Ans_5.1.jpg\"/><br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Jee_advance_paper_2_Chem_Q.26_Ans_5.2.jpg\"/>", "image": null}, "videoSolution": {"videoId": "57a7a900bc9940c6b34871d4c8990249", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/SEcr7FVHRAvKK.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/SEcr7FVHRAvKK.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf829", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2016-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2016 (Paper 2)", "title": "JEE Advanced 2016 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a15f23ac7d519f9b12b", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c49", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 2)", "title": "JEE Advanced 2011 (Paper 2)"}], "question": {"text": "The maximum number of isomers (including stereoisomers) that are possible on monochlorination of the following compounds, is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/JeNF0d7k61aH5ughmPwYN1pnR6BelAftYr5mz-uA5aI.original.fullsize.png\"><br>", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/IOaa7WUzCUYZoSZPBoLtPiymdayUAM8RrraVu0baORI.original.fullsize.png\"><br>\nI has one chiral carbon $=$ two isomers II has two chiral carbons and no symmetry $=$ four isomers.\nIII and IV have no chiral carbon, no stereoisomers.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c49", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 2)", "title": "JEE Advanced 2011 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169e2f23ac7d519f9af56", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c42", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 1)", "title": "JEE Advanced 2008 (Paper 1)"}], "question": {"text": "The major product of the following reaction is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/J7J35P-8NLJdFJ-RzFRBhfDQZUbpXGRhXFBSYHoanlw.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "j5RNq", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/4st1lqaE10UHFMQ7JmH7Lg6vOQToMH5oi1a_oQzkL8g.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "ZfCH1", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/uNZqKlaG27-DQEvSAzj74McBjUUreeZnYIPSt8Q_bis.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "nRU3g", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/gM200u5M1w27QYcSryLLfsW9mFjyaIft53WYLGgpy2I.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "TlGPc", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/iHfyg4ahMiQYBDcY_d9Mt9Qh78VanpbjHNdrxVTHV94.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{PhS}^{-}$is a strong nucleophile and dimethylformamide (DMF) is a highly polar aprotic solvent. Condition indicates that nucleophilic substitution $\\left(\\mathrm{S}_{\\mathrm{N}} 2\\right)$ takes place at $2^{\\circ}$ benzylic place, stereochemically it involves inversion of configuration.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/lCIeCvJ3B6Mr_ZmG8u7nddUDMXVFitGj550V4s_YDQU.original.fullsize.png\"><br>\nAryl group can exhibit neighbouring group or can show anchimeric assistance but not possible here due to deactivity imparted by $-\\mathrm{NO}_2$ and $-\\mathrm{F}$. It can be if $-\\mathrm{OCH}_3$ would have been instead of $-\\mathrm{NO}_2$.<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/jKeexw3aFTvCJAqz9sT8rE6xkc0YtE6Wmhx8gjSO0C4.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c42", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 1)", "title": "JEE Advanced 2008 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169ccf23ac7d519f9ae8f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}], "question": {"text": "Match the following \n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Xmaa26fH0hR4prHCjmrRrNH-rfprOx-3FtUrzpt4n6w.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "roJ0M", "text": "\n(A) Q, (B) P, (C) R,S, (D) Q,S\n", "image": null, "isCorrect": false}, {"id": "e0WEB", "text": "\n(A) S, (B) R, (C) R, (D) P,S\n", "image": null, "isCorrect": false}, {"id": "shZ98", "text": "\n(A) R, (B) Q, (C) S, (D) Q,S\n", "image": null, "isCorrect": false}, {"id": "3Of0E", "text": "\n(A) Q, (B) Q, (C) R,S, (D) P,S", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\text { (A) Match with (Q) }\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/pZbxv4ivUF9I7Kp-BSSuA_5S0dEaTlkWLMIkQCP26a4.original.fullsize.png\"><br>\nThe formation of $\\mathrm{CH}_2=\\mathrm{CH}-\\mathrm{CD}_3$ can be explained on the basis of the fact that $\\mathrm{C}-\\mathrm{D}$ bond is much stronger than $\\mathrm{C}-\\mathrm{H}$ bond.\n(B) match with (Q)\nReactivity of $\\mathrm{PhCHBrCH}_3$ is greater than\n$\\mathrm{Ph} \\mathrm{CHBrCD}_3$ because $\\mathrm{C}-\\mathrm{D}$ bond is more stronger than $\\mathrm{C}-\\mathrm{H}$ bond.\n\n$$\n\\text { (C) match with (R) and (S) }\n$$<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/eunRBn6utbgP22GT6vuptZpANFRSsz0948UmfNNgbvI.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/ZduTsP4411yF83jMwipCj7LUJoPCBkyfcaz8xXeUkbA.original.fullsize.png\"><br>\nIn the step (II), a slow unimolecular elimination occurs in the conjugate base of the reactant and hence this mechanism is called $E_1 C B$ or carbanion mechanism. Since step (I) must be reversible, if ethanol containing $\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{OD}$ is used as solvent, it would be expected that the original bromide would incorporate deuterium (D).\n\n$$\n\\text { (D) Match with (P) and (S) }\n$$\n\nStep I. $\\mathrm{PhCH}_2-\\mathrm{CH}_2-\\mathrm{Br} \\stackrel{\\text { Slow }}{\\longrightarrow} \\mathrm{PhCH}_2-\\stackrel{+}{\\mathrm{C}} \\mathrm{H}_2+\\mathrm{Br}^{-}$\nStep II. $\\mathrm{PhCH}_2-\\stackrel{+}{\\mathrm{C}_2} \\mathrm{H}_2 \\stackrel{\\text { Fast }}{\\longrightarrow} \\mathrm{Ph}-\\mathrm{CH}=\\mathrm{CH}_2+\\mathrm{H}^{-}$\nRate $\\propto\\left[\\mathrm{PhCH}_2-\\mathrm{CH}_2-\\mathrm{Br}\\right]$\nSimilarly\nStep II. $\\mathrm{PhCD}_2 \\stackrel{+}{\\mathrm{C}_2} \\mathrm{H}_2 \\stackrel{\\text { Fast }}{\\longrightarrow} \\mathrm{PhCD}=\\mathrm{CHD}+\\mathrm{H}^{+}$\nRate $\\propto\\left[\\mathrm{PhCD}_2-\\mathrm{CH}_2 \\mathrm{Br}\\right]$\nHence, $E_1$ reaction and first order kinetics.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64b16adbf23ac7d519f9b8d3", "title": "Preparation and Properties of Aryl Halides", "totalQuestions": 1, "questions": [{"_id": "64b16a9df23ac7d519f9b608", "previousYearPapers": [{"_id": "632c83583e3fd59bda92e46d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 2)", "title": "JEE Advanced 2022 (Paper 2)"}], "type": "multipleCorrect", "level": 3, "question": {"text": "<p>Considering the following reaction sequence, the correct statement(s) is(are)</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/bf1dbdd6-4543-470a-ad78-f427161828bf-image.png\" style=\"width: 449px; height: 150px;\" /></p>", "image": null}, "options": [{"id": "Hjmb3", "text": "Compounds <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math> are carboxylic acids.", "isCorrect": true, "image": null}, {"id": "h4beY", "text": "Compound <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> decolorizes bromine water.", "isCorrect": false, "image": null}, {"id": "T69wO", "text": "Compounds <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> react with hydroxylamine to give the corresponding oximes.", "isCorrect": true, "image": null}, {"id": "0sAEQ", "text": "Compound <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> reacts with dialkylcadmium to give the corresponding tertiary alcohol.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Benzene undergoes friedel craft&#39;s reaction with succinic anhydride in presence of anhydrous AlCl<sub>3</sub>&nbsp;to form P.The mechanism of the reaction is electrophilic substitution.</p><p>The keto group in P gets reduced on reaction Zn/Hg in HCl&nbsp;to form Q that is 4-phenylbutanoic acid.</p><p>This reacts with thionyl chloride to form R, that is&nbsp;</p><p>4-Phenylbutanoyl chloride.</p><p>R again undergoes friedel craft&#39;s reaction to form S.</p><p>S&nbsp;gets reduced on reaction Zn/Hg in HCl&nbsp;to form a hydrocarbon as given in the reactions below.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/f8018820-3055-42b2-b219-fcb8e77b8df7-image.png\" style=\"width: 484px; height: 300px;\" /></p><p>Compound <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">S</mi></mfenced></math> can not decolorizes bromine water.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/bfbb566c-ced0-4e1d-9193-98a4443b7aed-image.png\" style=\"width: 461px; height: 110px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">R</mi><mn>2</mn></msub><mi>Cd</mi></math> is a less reactive nucleophile so reaction stops at carbonyl group.</p><p>Due to the presence of carbonyl group both P and S forms oxime&nbsp;with hydroxyl amine.</p>", "image": null}, "videoSolution": {"videoId": "db1a753529834445a324b4aaf423ea51", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/gBw2W8BAskOhO.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/gBw2W8BAskOhO.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "632c83583e3fd59bda92e46d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 2)", "title": "JEE Advanced 2022 (Paper 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-21T06:47:33.375Z"}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
