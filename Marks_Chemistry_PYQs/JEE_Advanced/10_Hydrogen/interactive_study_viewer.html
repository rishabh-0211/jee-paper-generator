s) used for softening the temporary hardness of water is(are)", "image": null}, "options": [{"id": "6TVLe", "text": "\n$\\mathrm{Ca}_3\\left(\\mathrm{PO}_4\\right)_2$\n", "image": null, "isCorrect": false}, {"id": "TDbB5", "text": "\n$\\mathrm{Ca}(\\mathrm{OH})_2$\n", "image": null, "isCorrect": true}, {"id": "CY9Al", "text": "\n$\\mathrm{Na}_2 \\mathrm{CO}_3$\n", "image": null, "isCorrect": true}, {"id": "s9Ot6", "text": "\n$\\mathrm{NaOCl}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Softening the temporary hardness of water means conversion of bicarbonate into calcium carbonate (precipitation)\n$$\n\\begin{gathered}\n\\mathrm{Ca}\\left(\\mathrm{HCO}_3\\right)_2+\\mathrm{Ca}(\\mathrm{OH})_2 \\longrightarrow \\\\\n2 \\mathrm{CaCO}_3 \\downarrow+2 \\mathrm{H}_2 \\mathrm{O} \\\\\n\\mathrm{Ca}\\left(\\mathrm{HCO}_3\\right)_2+\\mathrm{Na}_2 \\mathrm{CO}_3 \\longrightarrow \\\\\n\\mathrm{CaCO}_3 \\downarrow+2 \\mathrm{NaHCO}_3\n\\end{gathered}\n$$\nEven $\\mathrm{NaOCl}$ can be used, as in aqueous medium $\\overline{\\mathrm{O}} \\mathrm{Cl}$ gets hydrolysed and makes solution alkaline enough to cause precipitation of $\\mathrm{CaCO}_3$.\n$$\n\\begin{aligned}\n\\mathrm{NaOCl}+\\mathrm{H}_2 \\mathrm{O} & \\rightleftharpoons \\mathrm{HOCl}+\\mathrm{NaOH} \\\\\n\\mathrm{OH}^{-}+\\mathrm{HCO}_3^{-} & \\longrightarrow \\mathrm{CO}_3^{2-}+\\mathrm{H}_2 \\mathrm{O}\n\\end{aligned}\n$$\nRepresentative elements (Hydrogen and its compounds)\nConceptual\nII", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};

      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';

    function renderQuestions(questions) {

        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">

              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>

            html += `

        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
