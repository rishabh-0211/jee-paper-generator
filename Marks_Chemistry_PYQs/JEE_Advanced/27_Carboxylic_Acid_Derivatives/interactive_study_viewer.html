: "https://d1z78r8i505acl.cloudfront.net/poster/UC6O80KYGdSTZ.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf829", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2016-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2016 (Paper 2)", "title": "JEE Advanced 2016 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a21f23ac7d519f9b19c", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The compound that undergoes decarboxylation most readily under mild condition is", "image": null}, "options": [{"id": "AZt6L", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/U2XxpDah8RlZahhfYNUqIu-gjAcZnKCXlvbBXQEpvgc.original.fullsize.png\">", "isCorrect": false, "image": null}, {"id": "cm99L", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/G2x3j3M6lfNfK05A9ZA9JsDVocPDwd-9R2JVbkklaAc.original.fullsize.png\">", "isCorrect": true, "image": null}, {"id": "BhQBC", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/ux7_FRzB9HRZws8RKmycNUVoeM2NsY5kdYo5mLv9OYM.original.fullsize.png\">", "isCorrect": false, "image": null}, {"id": "J1iTj", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/PbAnLAq5Y0zlI-nWPLYC8WiBGsoMPLOVB7eg_OYy4R4.original.fullsize.png\">", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\beta-$ Ketoacids undergo decarboxylation easily. It is due to the stability of transition state formed after decarboxylation of $\\beta$-keto acids. This is not possible in case of other acids.\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/G9onUPiY5nAanJf2o70Ze_djJIj72IOTdMvWWFJiWO8.original.fullsize.png\">", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a1bf23ac7d519f9b162", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The carboxyl functional group $(-\\mathrm{COOH})$ is present in", "image": null}, "options": [{"id": "8zIms", "text": "picricacid", "isCorrect": false, "image": null}, {"id": "FJEmc", "text": "barbituric acid", "isCorrect": false, "image": null}, {"id": "0FQSv", "text": "ascorbic acid", "isCorrect": false, "image": null}, {"id": "gs6Ze", "text": "aspirin", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/k7WmyASwckIsJjDhjh_uSBzZYXTpaYekwJJYDtvj4NA.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Lx1913Cy53_MT4XdgRq0yhP74rb0KP77fzdxGMTr0eU.original.fullsize.png\">", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169f0f23ac7d519f9afdc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}], "question": {"text": "The correct acidity order of the following is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/7b6qdMHsSZY6-VDA-Ft2vqn1SuYfdt-U_Nh6myMTsgA.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "zv8Ql", "text": "\nIII $>$ IV $>$ II $>$ I\n", "image": null, "isCorrect": true}, {"id": "H1Azj", "text": "\nIV $>$ III $>$ I $>$ II\n", "image": null, "isCorrect": false}, {"id": "RzL67", "text": "\nIII $>$ II $>$ I $>$ IV\n", "image": null, "isCorrect": false}, {"id": "A2aLu", "text": "\nII $>$ III $>$ IV $>$ I", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A carboxylic acid is stronger acid than phenol, hence both III and IV are stronger acids than both I and II. Also IV has a methyl group that gives electron donating inductive effect and decreases the acid strength. Therefore, III is stronger acid that IV. Between I and II, the dominant electron withdrawing inductive effect of chlorine increases acid strength of phenol slightly, hence II is stronger acid than I. Thus, the overall order is :\n(a) III $>$ IV $>$ II $>$ I", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64b16ad8f23ac7d519f9b8a8", "title": "Reactions Involving Acid Group", "totalQuestions": 4, "questions": [{"_id": "6a0be51044d287c9361e5ca2", "type": "numerical", "question": {"text": "The sum of total number of carbonyl groups ($\\text{>C=O}$) present in the major products $\\textbf{X}$ and $\\textbf{Y}$ in the following reactions is ____.<br><img style=\"width: 500px\" src=\"https://cdn.quizrr.in/question-assets/jee_adv/2026/watermarked_images/p1_english__q43_d1.png\" />", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "Reaction 1:<br>The reactant is 2,4-dimethyl-3-oxopentanedioic acid, which is a $\\beta$-keto acid (both $-\\text{CO}_2\\text{H}$ groups are at the $\\beta$-position with respect to the central ketone group). $\\beta$-keto acids readily undergo decarboxylation upon heating. Since there are two such groups, it will undergo double decarboxylation.<br><br>$\\text{HO}_2\\text{C}-\\text{CH}(\\text{CH}_3)-\\text{C}(=\\text{O})-\\text{CH}(\\text{CH}_3)-\\text{CO}_2\\text{H} \\xrightarrow{\\Delta} \\text{CH}_3-\\text{CH}_2-\\text{C}(=\\text{O})-\\text{CH}_2-\\text{CH}_3 + 2\\text{CO}_2$<br><br>The major product $\\textbf{X}$ is 3-pentanone. <br>Number of carbonyl groups ($>\\text{C=O}$) in $\\textbf{X} = 1$.<br><br>Reaction 2:<br>The reactant is *cis*-3,4-dicarboxycyclopentanone. The two carboxylic acid groups are on adjacent carbons (a 1,2-dicarboxylic acid system). Heating a 1,2-dicarboxylic acid leads to dehydration, forming a stable 5-membered cyclic anhydride.<br><br>The major product $\\textbf{Y}$ is the cyclic anhydride of the reactant, which is a fused bicyclic system containing the original cyclopentanone ring and a newly formed succinic anhydride ring.<br>The structure of $\\textbf{Y}$ contains one ketone carbonyl group and two anhydride carbonyl groups.<br>Number of carbonyl groups ($>\\text{C=O}$) in $\\textbf{Y} = 1 + 2 = 3$.<br><br>Sum of total number of carbonyl groups in $\\textbf{X}$ and $\\textbf{Y} = 1 + 3 = 4$.<br><br>Answer: $4$", "image": null}, "level": 2, "videoSolution": {"videoId": "133eff137b134041a1303fd849bb81cd", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/acirxQBl1lB3M.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/acirxQBl1lB3M.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "685102c46bba689a3eb09cc1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "684c67d769037fad219cb0c2", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 2)", "title": "JEE Advanced 2025 (Paper 2)"}], "question": {"text": "Monocyclic compounds $\\mathbf{P}, \\mathbf{Q}, \\mathbf{R}$ and $\\mathbf{S}$ are the major products formed in the reaction sequences given below.<br><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/hyUZrLh_aS_0NVujRtkkZcX1oLUlrbXGUKWg3zU4Qv4.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/N5Haau3AoC3j8SrHxV_iWUbOkrV_Hw2n4NSZ4gqBAbs.original.fullsize.png\"><br>The product having the highest num 0Z", "isVisible": true, "shortName": "2019 (Paper 2)", "title": "JEE Advanced 2019 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a3df23ac7d519f9b298", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf825", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2014-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2014 (Paper 2)", "title": "JEE Advanced 2014 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Different possible thermal decomposition pathways for peroxyesters are shown below. Match each<br >\r\n\r\npathway from List I with an appropriate structure from List II and select the correct answer using the code<br >\r\n\r\ngiven below the lists.<br ><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image26-192d6dfb-e615-477e-8c89-e1b8fc86dfde.jpg\"/><br/>\r\n\r\n \r\n\r\n</p><table border=\"1\"><tbody><tr><td> </td><td>List – I</td><td> </td><td>List – II</td></tr><tr><td>A</td><td>Pathway P</td><td>P.</td><td><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image27-cae9373e-82fd-4045-9de3-271eeb5dd604.jpg\"/></td></tr><tr><td>B.</td><td>Pathway Q</td><td>Q.</td><td><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image28-a27e749a-6051-4e20-9abe-745bcbccee07.jpg\"/></td></tr><tr><td>C.</td><td>Pathway R</td><td>R.</td><td><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image29-3c99672b-24fc-4ffd-8f0b-ad1c27e43f5b.jpg\"/></td></tr><tr><td>D.</td><td>Pathway S</td><td>S.</td><td><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image30-80827316-b739-4f71-8719-9b71884f14d6.jpg\"/></td></tr></tbody></table>", "image": null}, "options": [{"id": "t2AXn", "text": "a-p;b-r;c-s;d-q;", "isCorrect": true, "image": null}, {"id": "DHWky", "text": "a-s;b-p;c-r;d-q;", "isCorrect": false, "image": null}, {"id": "o4xv6", "text": "a-r;b-s;c-q;d-p;", "isCorrect": false, "image": null}, {"id": "28trR", "text": "a-s;b-p;c-q;d-r;", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image31-7c241392-326c-46b9-815d-a8fd2bf76da7.jpg\"/><br ><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image32-d6f3934c-ddf6-4792-abf0-1f6221432adf.jpg\"/><br ><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image33-cf4ef346-d882-44b3-80dd-23fdce711c96.jpg\"/><br ><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image34-d0236899-862a-4da6-9698-fa84e241228d.jpg\"/>", "image": null}, "videoSolution": {"videoId": "8435363cf0d0452ba8a93247e8686eb8", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/FGxZ7DiIAmK4t.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/FGxZ7DiIAmK4t.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf825", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2014-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2014 (Paper 2)", "title": "JEE Advanced 2014 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64b16ad7f23ac7d519f9b8a6", "title": "Preparation and Properties of Acid Derivatives", "totalQuestions": 6, "questions": [{"_id": "64b16aa8f23ac7d519f9b66c", "type": "multipleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}], "question": {"text": "<p>In the following reactions, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">P</mi><mo>,</mo><mi mathvariant=\"bold\">Q</mi><mo>,</mo><mi mathvariant=\"bold\">R</mi></math>, and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">S</mi></math> are the major products.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/a269bb02-9884-4024-964d-22a1c1145cb0.png\" style=\"width: 400px; height: 110px;\" /></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/a9b909d7-d90e-47c2-bec5-44781080da22.png\" style=\"width: 400px; height: 80px;\" /></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/0d775c2e-aba1-490e-b8c1-74a5e393036c.png\" style=\"width: 400px; height: 144px;\" /></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/d2b88317-9735-49a0-bd61-238cc9863345.png\" style=\"width: 400px; height: 107px;\" /></p><p>The correct statement(s) about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">P</mi><mo>,</mo><mi mathvariant=\"bold\">Q</mi><mo>,</mo><mi mathvariant=\"bold\">R</mi></math>, and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">S</mi></math> is(are)</p>", "image": null}, "options": [{"id": "cQVm8", "text": "P and Q are monomers of polymers dacron and glyptal, respectively.", "image": null, "isCorrect": false}, {"id": "BWvB7", "text": "P, Q, and R are dicarboxylic acids.", "image": null, "isCorrect": false}, {"id": "0mr2j", "text": "Compounds <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">Q</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> are the same.", "image": null, "isCorrect": true}, {"id": "4UYZU", "text": "<strong>R</strong> does not undergo aldol condensation and <strong>S</strong> does not undergo Cannizzaro reaction.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Toluene part of the reactant in the first reaction&nbsp;undergoes oxidation with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KMnO</mi><mn>4</mn></msub></math>, forms benzoic acid. In this conversion, alkyl part of toluene converts into carboxylic group. So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>&nbsp;is a monocarboxylic acid.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/9a0809ac-3caf-46c2-bd12-9e6d32fea27e.png\" style=\"width: 589px; height: 153px;\" /></p><p>Both ester and acid halides undergo hydrolysis to give carboxylic acid. Hence, the product&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math>&nbsp;is the dicarboxylic acid. And it is known as isophthalic acid.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/7c15c884-db08-4875-bf1c-c5e3bc16be1a.png\" style=\"width: 530px; height: 156px;\" /></p><p>In the third reaction, ester undergo hydrolysis in the first step, which results beta keto acid. Beta keto acids are unstable. They liberate carbon dioxide on heating. The alpha methyl ketone formed undergo oxidation with chromic acid give carboxylic acid. Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>&nbsp;is also isophthalic acid.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/7832a67c-385f-42ec-9604-242ea1375764.png\" style=\"width: 618px; height: 514px;\" /></p><p>In the fourth reaction, the bromo part reacts with magnesium metal to give Grignard reagent. Grignard reagent give carboxylic acid upon reaction with carbon dioxide. Now during the hydrolysis of previous step acetal cleavage takes place and gives aldehyde functional group. This aldehyde converts to carboxylic acid with Tollen&#39;s reagent. This results the terephthalic acid.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/c41496f5-e447-4c7a-849e-c96437945f0d.png\" style=\"width: 671px; height: 417px;\" /></p><p>The products&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi></math>&nbsp;are dicarboxylic acids and does not undergo Aldol condensation reaction or Cannizzaro&#39;s reaction.</p>", "image": null}, "videoSolution": {"videoId": "90f33f4d54de4a3e90b563344dfb09ca", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/sFxmViCqOZkZc.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/sFxmViCqOZkZc.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16aa3f23ac7d519f9b63e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}], "question": {"text": "<p>Match the reactions (in the given stoichiometry of the reactants) in List-I with one of their products given in List-II and choose the correct option.</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td><strong>List-I</strong></td>\t\t\t<td>&nbsp;</td>\t\t\t<td><strong>List-II</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td>(P)</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>+</mo><mn>3</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#8594;</mo></math></td>\t\t\t<td>(1)</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>(</mo><mi mathvariant=\"normal\">O</mi><mo>)</mo><mfenced><msub><mi>OCH</mi><mn>3</mn></msub></mfenced><msub><mi>Cl</mi><mn>2</mn></msub></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>(Q)</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>4</mn></msub><mo>+</mo><mn>3</mn><mi>NaOH</mi><mo>+</mo><mn>3</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#8594;</mo></math></td>\t\t\t<td>(2)</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msub><mi>PO</mi><mn>3</mn></msub></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>(R)</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>PCl</mi><mn>5</mn></msub><mo>+</mo><msub><mi>CH</mi><mn>3</mn></msub><mi>COOH</mi><mo>&#8594;</mo></math></td>\t\t\t<td>(3)</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>PH</mi><mn>3</mn></msub></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>(S)</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msub><mi>PO</mi><mn>2</mn></msub><mo>+</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><mn>4</mn><msub><mi>AgNO</mi><mn>3</mn></msub><mo>&#8594;</mo></math></td>\t\t\t<td>(4)</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>POCl</mi><mn>3</mn></msub></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td>&nbsp;</td>\t\t\t<td>(5)</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msub><mi>PO</mi><mn>4</mn></msub></math></td>\t\t</tr>\t</tbody></table><p>&nbsp;</p>", "image": null}, "options": [{"id": "S89Z3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>&#8594;</mo><mn>2</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Q</mi><mo>&#8594;</mo><mn>3</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>&#8594;</mo><mn>1</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>&#8594;</mo><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "AlQrx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>&#8594;</mo><mn>3</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Q</mi><mo>&#8594;</mo><mn>5</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>&#8594;</mo><mn>4</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>&#8594;</mo><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "Z9ghH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>&#8594;</mo><mn>5</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Q</mi><mo>&#8594;</mo><mn>2</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>&#8594;</mo><mn>1</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>&#8594;</mo><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "sNRWE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>&#8594;</mo><mn>2</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Q</mi><mo>&#8594;</mo><mn>3</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi><mo>&#8594;</mo><mn>4</mn><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>&#8594;</mo><mn>5</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<blockquote><p>Phosphorus trioxide reacts with water to form phosphorous acid,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>+</mo><mn>3</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#8594;</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msub><mi>PO</mi><mn>3</mn></msub></math></p><p>When acetic acid is heated with phosphorus pentachloride, acetyl chloride is obtained. In this reaction, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8722;</mo><mi>COOH</mi></math> group is converted to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8722;</mo><mi>COCl</mi></math> group. The side products are phosphorus oxychloride and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HCl</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>PCl</mi><mn>5</mn></msub><mo>+</mo><msub><mi>CH</mi><mn>3</mn></msub><mi>COOH</mi><mo>&#8594;</mo><msub><mi>CH</mi><mn>3</mn></msub><mi>COCl</mi><mo>+</mo><msub><mi>POCl</mi><mn>3</mn></msub><mo>+</mo><mi>HCl</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>4</mn></msub></math>&nbsp;undergo disproportionation reaction with sodium hydroxide.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>4</mn></msub><mo>+</mo><mn>3</mn><mi>NaOH</mi><mo>+</mo><mn>3</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#160;</mo><mover><mo>&#8594;</mo><mrow/></mover><msub><mi>PH</mi><mn>3</mn></msub><mo>+</mo><mn>3</mn><msub><mi>NaH</mi><mn>2</mn></msub><msub><mi>PO</mi><mn>2</mn></msub></math></p><p>Due to the presence two&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>-</mo><mi mathvariant=\"normal\">H</mi></math>&nbsp;bonds,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msub><mi>PO</mi><mn>2</mn></msub></math>&nbsp;acts as reducing agent. It reduces&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Ag</mi><mo>+</mo></msup></math>&nbsp;to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ag</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msub><mi>PO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><msub><mi>AgNO</mi><mn>3</mn></msub><mo>&#8594;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msub><mi>PO</mi><mn>4</mn></msub><mo>+</mo><msub><mi>HNO</mi><mn>3</mn></msub><mo>+</mo><mi>Ag</mi><mo>&#8595;</mo></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "5a3d64b5d55c4bd2b0285d686dae92f2", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Qogk18csBcaAo.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Qogk18csBcaAo.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a97f23ac7d519f9b5d2", "previousYearPapers": [{"_id": "632c83573e3fd59bda92e46c", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 1)", "title": "JEE Advanced 2022 (Paper 1)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "<p>Considering the reaction sequence given below, the correct statement(s) is(are)</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/da69cae0-5ed8-49c9-b5e7-e08fc78466a3-image.png\" style=\"width: 700px; height: 156px;\" /></p>", "image": null}, "options": [{"id": "Hraa4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> can be reduced to a primary alcohol using <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NaBH</mi><mn>4</mn></msub></math>.", "isCorrect": false, "image": null}, {"id": "Qccw2", "text": "Treating <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> with conc. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NH</mi><mn>4</mn></msub><mi>OH</mi></math> solution followed by acidification gives <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math>.", "isCorrect": true, "image": null}, {"id": "JpM1I", "text": "Treating <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Q</mi></math> with a solution of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NaNO</mi><mn>2</mn></msub></math> in&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>aq</mi><mo>.</mo><mi>HCl</mi></math> liberates <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub></math>.", "isCorrect": true, "image": null}, {"id": "H93Wq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> is more acidic than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi>COOH</mi></math>.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Propanoic acid is&nbsp;having &nbsp;&alpha;-hydrogen hence it is&nbsp;halogenated at the &alpha;-position on treatment with chlorine or bromine in the presence of small amount of red phosphorus to give &alpha;-bromo propanoic acid. The reaction is known as Hell-Volhard-Zelinsky reaction.</p><p>Second step of the reaction involves&nbsp;Gabriel phthalimide synthesis&nbsp;Where potassium salt of phthalimide which on heating with 2-bromo propanoic acid&nbsp;&nbsp;followed by alkaline hydrolysis produces the corresponding 2-amino propanoic acid. Aromatic primary amines cannot be prepared by this method.​​​​​​<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/2b9980e6-0166-452d-916f-d54a83570c40-image.png\" style=\"width: 600px; height: 268px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NaBH</mi><mn>4</mn></msub></math>&nbsp;cannot reduce the acids.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Conc</mi><mo>.</mo><mo>&#160;</mo><msub><mi>NH</mi><mn>4</mn></msub><mi>OH</mi></math>&nbsp;exist in the following equilibrium,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>NH</mi><mn>4</mn><mo>+</mo></msubsup><mo>&#160;</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msup><mi>OH</mi><mo>-</mo></msup><mo>&#8651;</mo><msub><mi>NH</mi><mn>3</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/0c48af1b-9e3a-4793-b084-1155b65f183b-image.png\" style=\"width: 581px; height: 228px;\" /></p>", "image": null}, "videoSolution": {"videoId": "b0a971ad74404a07ac551d996fb4a0a7", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/MNB2YAtqfXZUo.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.n heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "66965e04844b5f1d94e798b5", "title": "Abnormal Behaviour of Formic Acid", "totalQuestions": 1, "questions": [{"_id": "66965dc4d603121f43a3c5b1", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "66965789b31faf98fda8fef9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 1)", "title": "JEE Advanced 2024 (Paper 1)"}], "question": {"text": "In the following reaction sequence, the major product $\\mathbf{P}$ is formed.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/65VJZ6IJy8c-o86buKSkQTtePbf-UUSpW1Eyd2PytE8.original.fullsize.png\">\nGlycerol reacts completely with excess $\\mathbf{P}$ in the presence of an acid catalyst to form $\\mathbf{Q}$. Reaction of $\\mathbf{Q}$ with excess $\\mathrm{NaOH}$ followed by the treatment with $\\mathrm{CaCl}_2$ yields Ca-soap $\\mathbf{R}$, quantitatively. Starting with one mole of $\\mathbf{Q}$, the amount of $\\mathbf{R}$ produced in gram is ________.\n[Given, atomic weight: $\\mathrm{H}=1, \\mathrm{C}=12, \\mathrm{~N}=14, \\mathrm{O}=16, \\mathrm{Na}=23, \\mathrm{Cl}=35, \\mathrm{Ca}=40$ ]", "image": null}, "options": [], "correctValue": 909, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/FU-LArOFMNrHyc3DDcQnVLpDwqlq5F_MME0WmISMut0.original.fullsize.png\">\n$\\frac{3}{2}$ mole soap. $=\\frac{3}{2} \\times 606 \\mathrm{gm}=909 \\mathrm{gm}$", "image": null}, "videoSolution": {"videoId": "523bd1b1328343a595ba20b0b5c4b5bf", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Aam3ygpS0STAU.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Aam3ygpS0STAU.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb14     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
