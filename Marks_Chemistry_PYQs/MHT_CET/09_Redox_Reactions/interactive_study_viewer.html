  <script>
    const data = {"index": 9, "chapterId": "61c089bb9295944ba4ace25c", "chapter": "Redox Reactions", "exam": "MHT CET", "totalTopics": 6, "totalQuestions": 128, "downloadTime": "2026-10-08 20:06:01", "topics": [{"index": 1, "topicId": "65a263460279619d9d8a3db3", "title": "Oxidation and Reduction Reactions", "totalQuestions": 29, "questions": [{"_id": "6abb889115a9fc0fc8c144ef", "type": "singleCorrect", "question": {"text": "Which of the following is the strongest reducing agent?", "image": null}, "options": [{"id": "yYEfX", "label": "A", "text": "$\\text{Ag}^+$", "isCorrect": false, "image": null}, {"id": "qHoMq", "label": "B", "text": "$\\text{Li}$", "isCorrect": true, "image": null}, {"id": "fX31E", "label": "C", "text": "$\\text{F}_2$", "isCorrect": false, "image": null}, {"id": "EE8Ay", "label": "D", "text": "$\\text{Au}^+$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A reducing agent is a substance that loses electrons and undergoes oxidation.<br><br>The strength of a reducing agent is inversely proportional to its standard reduction potential.<br><br>Lithium ($\\text{Li}$) has the lowest standard reduction potential ($E^\\circ_{\\text{Li}^+/\\text{Li}} = -3.05\\text{ V}$) among all elements in the electrochemical series.<br><br>Therefore, $\\text{Li}$ has the highest tendency to lose electrons and is the strongest reducing agent.<br><br>$\\text{F}_2$ has the highest standard reduction potential and is the strongest oxidizing agent.<br><br>$\\text{Ag}^+$ and $\\text{Au}^+$ are also oxidizing agents as they tend to gain electrons to form their respective metals.<br><br>Answer: $\\text{Li}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c115a9fc0fc8c146b1", "type": "singleCorrect", "question": {"text": "Find the number of moles of electrons required for reduction of $3n$ moles of $\\text{Zn}^{2+}$ to $\\text{Zn}$", "image": null}, "options": [{"id": "qgKrb", "label": "A", "text": "$6n$", "isCorrect": true, "image": null}, {"id": "G4sZx", "label": "B", "text": "$4n$", "isCorrect": false, "image": null}, {"id": "BUc0e", "label": "C", "text": "$3n$", "isCorrect": false, "image": null}, {"id": "fIBCS", "label": "D", "text": "$2n$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reduction reaction of zinc ions is given by:<br><br>$\\text{Zn}^{2+} + 2e^{-} \\rightarrow \\text{Zn}$<br><br>From the balanced half-reaction, $1$ mole of $\\text{Zn}^{2+}$ requires $2$ moles of electrons for complete reduction.<br><br>Therefore, the number of moles of electrons required to reduce $3n$ moles of $\\text{Zn}^{2+}$ is:<br><br>$3n \\times 2 = 6n$<br><br>Answer: $6n$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bf15a9fc0fc8c1469e", "type": "singleCorrect", "question": {"text": "Which of the following properties is exhibited by reducing agent?", "image": null}, "options": [{"id": "74yzU", "label": "A", "text": "Undergoes oxidation", "isCorrect": true, "image": null}, {"id": "ZTb1Z", "label": "B", "text": "Brings about oxidation of other species", "isCorrect": false, "image": null}, {"id": "knkxh", "label": "C", "text": "Is electron acceptor", "isCorrect": false, "image": null}, {"id": "h4nSb", "label": "D", "text": "Undergoes reduction", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A reducing agent is a substance that reduces another species by donating electrons to it.<br><br>In the process of donating electrons, the oxidation state of the reducing agent increases, meaning it undergoes oxidation itself.<br><br>Therefore, a reducing agent undergoes oxidation.<br><br>Answer: Undergoes oxidation", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ff8c30a4553e1bdf0c", "type": "singleCorrect", "question": {"text": "Identify change in oxidation state of oxidising agent in following redox reaction.<br>$3\\text{H}_3\\text{AsO}_{3(aq)} + \\text{BrO}_{3(aq)}^- \\longrightarrow \\text{Br}_{(aq)}^- + 3\\text{H}_3\\text{AsO}_{4(aq)}$", "image": null}, "options": [{"id": "wTU28", "label": "A", "text": "$-1\\ \\text{to}\\ +5$", "isCorrect": false, "image": null}, {"id": "ldxy2", "label": "B", "text": "$+5\\ \\text{to}\\ -1$", "isCorrect": true, "image": null}, {"id": "fy7cK", "label": "C", "text": "$+3\\ \\text{to}\\ +5$", "isCorrect": false, "image": null}, {"id": "tsA3c", "label": "D", "text": "$+5\\ \\text{to}\\ +3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction is $3\\text{H}_3\\text{AsO}_{3(aq)} + \\text{BrO}_{3(aq)}^- \\longrightarrow \\text{Br}_{(aq)}^- + 3\\text{H}_3\\text{AsO}_{4(aq)}$<br><br>Let the oxidation state of As in $\\text{H}_3\\text{AsO}_3$ be $x$.<br>$3(+1) + x + 3(-2) = 0 \\Rightarrow x = +3$<br><br>Let the oxidation state of Br in $\\text{BrO}_3^-$ be $y$.<br>$y + 3(-2) = -1 \\Rightarrow y = +5$<br><br>Let the oxidation state of As in $\\text{H}_3\\text{AsO}_4$ be $z$.<br>$3(+1) + z + 4(-2) = 0 \\Rightarrow z = +5$<br><br>The oxidation state of Br in $\\text{Br}^-$ is $-1$.<br><br>The oxidation state of As increases from $+3$ to $+5$, so $\\text{H}_3\\text{AsO}_3$ undergoes oxidation and acts as a reducing agent.<br><br>The oxidation state of Br decreases from $+5$ to $-1$, so $\\text{BrO}_3^-$ undergoes reduction and acts as an oxidising agent.<br><br>The change in oxidation state of the oxidising agent is $+5$ to $-1$.<br><br>Answer: $+5\\ \\text{to}\\ -1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c68c30a4553e1bdcac", "type": "singleCorrect", "question": {"text": "Which of the following reactions is NOT an example of redox reaction?", "image": null}, "options": [{"id": "burk6", "label": "A", "text": "$\\text{Cl}_2 + 2\\text{H}_2\\text{O} + \\text{SO}_2 \\longrightarrow 4\\text{H}^+ + \\text{SO}_4^{2-} + 2\\text{Cl}^-$", "isCorrect": false, "image": null}, {"id": "mTEoo", "label": "B", "text": "$\\text{Cu}^{2+} + \\text{Zn} \\longrightarrow \\text{Cu} + \\text{Zn}^{2+}$", "isCorrect": false, "image": null}, {"id": "YiVPa", "label": "C", "text": "$2\\text{H}_2 + \\text{O}_2 \\longrightarrow 2\\text{H}_2\\text{O}$", "isCorrect": false, "image": null}, {"id": "i4MgV", "label": "D", "text": "$\\text{HCl} + \\text{H}_2\\text{O} \\longrightarrow \\text{H}_3\\text{O}^+ + \\text{Cl}^-$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "A redox reaction involves a change in the oxidation states of the elements involved.<br><br>In the reaction $\\text{Cl}_2 + 2\\text{H}_2\\text{O} + \\text{SO}_2 \\longrightarrow 4\\text{H}^+ + \\text{SO}_4^{2-} + 2\\text{Cl}^-$, the oxidation state of $\\text{Cl}$ changes from $0$ to $-1$ and $\\text{S}$ changes from $+4$ to $+6$. This is a redox reaction.<br><br>In the reaction $\\text{Cu}^{2+} + \\text{Zn} \\longrightarrow \\text{Cu} + \\text{Zn}^{2+}$, the oxidation state of $\\text{Cu}$ changes from $+2$ to $0$ and $\\text{Zn}$ changes from $0$ to $+2$. This is a redox reaction.<br><br>In the reaction $2\\text{H}_2 + \\text{O}_2 \\longrightarrow 2\\text{H}_2\\text{O}$, the oxidation state of $\\text{H}$ changes from $0$ to $+1$ and $\\text{O}$ changes from $0$ to $-2$. This is a redox reaction.<br><br>In the reaction $\\text{HCl} + \\text{H}_2\\text{O} \\longrightarrow \\text{H}_3\\text{O}^+ + \\text{Cl}^-$, the oxidation state of $\\text{H}$ remains $+1$, $\\text{Cl}$ remains $-1$, and $\\text{O}$ remains $-2$. Since there is no change in the oxidation state of any element, this is an acid-base reaction and not a redox reaction.<br><br>Answer: $\\text{HCl} + \\text{H}_2\\text{O} \\longrightarrow \\text{H}_3\\text{O}^+ + \\text{Cl}^-$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d28c30a4553e1bdd2c", "type": "singleCorrect", "question": {"text": "Which of the following phenomena represents oxidation?", "image": null}, "options": [{"id": "0CMnM", "label": "A", "text": "Removal of oxygen", "isCorrect": false, "image": null}, {"id": "mnPKV", "label": "B", "text": "Addition of electronegative element", "isCorrect": true, "image": null}, {"id": "vKjJy", "label": "C", "text": "Addition of electropositive element", "isCorrect": false, "image": null}, {"id": "b8qRg", "label": "D", "text": "Gain of electron", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Oxidation is defined as the addition of oxygen or any other electronegative element, the removal of hydrogen or any other electropositive element, or the loss of electrons.<br><br>Removal of oxygen represents reduction.<br><br>Addition of an electronegative element represents oxidation.<br><br>Addition of an electropositive element represents reduction.<br><br>Gain of electrons represents reduction.<br><br>Answer: Addition of electronegative element", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e08c30a4553e1bddc2", "type": "singleCorrect", "question": {"text": "For the following redox reaction, find the correct statement.<br>$\\text{Sn}^{2+} + 2\\text{Fe}^{3+} \\rightarrow \\text{Sn}^{4+} + 2\\text{Fe}^{2+}$", "image": null}, "options": [{"id": "6goxl", "label": "A", "text": "$\\text{Sn}^{2+}$ is undergoing oxidation.", "isCorrect": true, "image": null}, {"id": "kZN6P", "label": "B", "text": "$\\text{Fe}^{3+}$ is undergoing oxidation.", "isCorrect": false, "image": null}, {"id": "ENGgP", "label": "C", "text": "It is not a redox reaction.", "isCorrect": false, "image": null}, {"id": "UOHaa", "label": "D", "text": "Both $\\text{Sn}^{2+}$ and $\\text{Fe}^{3+}$ are oxidized.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction is $\\text{Sn}^{2+} + 2\\text{Fe}^{3+} \\rightarrow \\text{Sn}^{4+} + 2\\text{Fe}^{2+}$<br><br>The oxidation state of $\\text{Sn}$ increases from $+2$ to $+4$, which indicates that $\\text{Sn}^{2+}$ undergoes oxidation.<br><br>The oxidation state of $\\text{Fe}$ decreases from $+3$ to $+2$, which indicates that $\\text{Fe}^{3+}$ undergoes reduction.<br><br>Therefore, $\\text{Sn}^{2+}$ is undergoing oxidation.<br><br>Answer: $\\text{Sn}^{2+}$ is undergoing oxidation.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36d8c30a4553e1be39e", "type": "singleCorrect", "question": {"text": "Which of the following is NOT a redox reaction?", "image": null}, "options": [{"id": "Qbjhx", "label": "A", "text": "$\\text{Zn} + \\text{H}_2\\text{SO}_4 \\rightarrow \\text{ZnSO}_4 + \\text{H}_2$", "isCorrect": false, "image": null}, {"id": "6qciw", "label": "B", "text": "$\\text{Al(OH)}_3 + 3\\text{HCl} \\rightarrow \\text{AlCl}_3 + 3\\text{H}_2\\text{O}$", "isCorrect": true, "image": null}, {"id": "JQjNJ", "label": "C", "text": "$\\text{Mg} + 1/2 \\text{O}_2 \\rightarrow \\text{Mg}^{2+} + \\text{O}^{2-}$", "isCorrect": false, "image": null}, {"id": "N3Sgn", "label": "D", "text": "$\\text{Fe}_{(s)} + \\text{Cu}^{2+}_{(aq)} \\rightarrow \\text{Fe}^{2+}_{(aq)} + \\text{Cu}_{(s)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In the reaction $\\text{Zn} + \\text{H}_2\\text{SO}_4 \\rightarrow \\text{ZnSO}_4 + \\text{H}_2$, the oxidation state of Zn changes from $0$ to $+2$ and H changes from $+1$ to $0$. It is a redox reaction.<br><br>In the reaction $\\text{Al(OH)}_3 + 3\\text{HCl} \\rightarrow \\text{AlCl}_3 + 3\\text{H}_2\\text{O}$, the oxidation states of all elements remain the same (Al is $+3$, O is $-2$, H is $+1$, Cl is $-1$). It is an acid-base neutralization reaction, not a redox reaction.<br><br>In the reaction $\\text{Mg} + 1/2 \\text{O}_2 \\rightarrow \\text{Mg}^{2+} + \\text{O}^{2-}$, the oxidation state of Mg changes from $0$ to $+2$ and O changes from $0$ to $-2$. It is a redox reaction.<br><br>In the reaction $\\text{Fe}_{(s)} + \\text{Cu}^{2+}_{(aq)} \\rightarrow \\text{Fe}^{2+}_{(aq)} + \\text{Cu}_{(s)}$, the oxidation state of Fe changes from $0$ to $+2$ and Cu changes from $+2$ to $0$. It is a redox reaction.<br><br>Answer: $\\text{Al(OH)}_3 + 3\\text{HCl} \\rightarrow \\text{AlCl}_3 + 3\\text{H}_2\\text{O}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba8bf9280d7f9932b4e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following species acts as an weakest reducing agent?", "image": null}, "options": [{"id": "miFjV", "text": "$\\mathrm{Li}$", "image": null, "isCorrect": false}, {"id": "nDL3F", "text": "$\\mathrm{Li}^{+}$", "image": null, "isCorrect": false}, {"id": "La5Jo", "text": "$\\mathrm{F}_2$", "image": null, "isCorrect": false}, {"id": "QME4Y", "text": "$\\mathrm{F}^{-}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "A reducing agent is a substance that donates electrons and undergoes oxidation.<br><br>The strength of a reducing agent is inversely proportional to its standard reduction potential ($E^{\\circ}$). A lower (more negative) standard reduction potential indicates a stronger reducing agent, while a higher (more positive) standard reduction potential indicates a weaker reducing agent.<br><br>In the electrochemical series, fluorine ($\\mathrm{F}_2$) has the highest standard reduction potential ($E^{\\circ} = +2.87$ V), making it the strongest oxidizing agent. Consequently, its reduced form, the fluoride ion ($\\mathrm{F}^{-}$), has the least tendency to lose electrons and undergo oxidation.<br><br>Therefore, $\\mathrm{F}^{-}$ acts as the weakest reducing agent among the given species. (Note that $\\mathrm{Li}$ is the strongest reducing agent, while $\\mathrm{Li}^{+}$ and $\\mathrm{F}_2$ act as oxidizing agents).<br><br>Answer: $\\mathrm{F}^{-}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9abf9280d7f9932ac8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For a reaction, $\\mathrm{NH}_4 \\mathrm{NO}_2 \\rightarrow \\mathrm{~N}_2+2 \\mathrm{H}_2 \\mathrm{O}$. Which from following phenomena is true regarding nitrogen?", "image": null}, "options": [{"id": "uCFie", "text": "Oxidised", "image": null, "isCorrect": false}, {"id": "YwmEr", "text": "Reduced", "image": null, "isCorrect": false}, {"id": "dSAv8", "text": "Oxidised as well as reduced", "image": null, "isCorrect": true}, {"id": "phjn2", "text": "Neither oxidised nor reduced", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is $\\mathrm{NH}_4\\mathrm{NO}_2 \\rightarrow \\mathrm{N}_2 + 2\\mathrm{H}_2\\mathrm{O}$.<br><br>Ammonium nitrite ($\\mathrm{NH}_4\\mathrm{NO}_2$) consists of $\\mathrm{NH}_4^+$ and $\\mathrm{NO}_2^-$ ions.<br><br>Let the oxidation state of nitrogen in $\\mathrm{NH}_4^+$ be $x$.<br>$x + 4(+1) = +1 \\Rightarrow x = -3$<br><br>Let the oxidation state of nitrogen in $\\mathrm{NO}_2^-$ be $y$.<br>$y + 2(-2) = -1 \\Rightarrow y = +3$<br><br>In the product $\\mathrm{N}_2$, the oxidation state of nitrogen is $0$.<br><br>The nitrogen atom in $\\mathrm{NH}_4^+$ changes its oxidation state from $-3$ to $0$, which is an increase in oxidation state, hence it is oxidised.<br><br>The nitrogen atom in $\\mathrm{NO}_2^-$ changes its oxidation state from $+3$ to $0$, which is a decrease in oxidation state, hence it is reduced.<br><br>Therefore, nitrogen is oxidised as well as reduced.<br><br>Answer: Oxidised as well as reduced", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7dbf9280d7f99329b5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following species acts as strongest oxidising agent?", "image": null}, "options": [{"id": "S8dcX", "text": "Li", "image": null, "isCorrect": false}, {"id": "sYyh3", "text": "$\\mathrm{Li}^{+}$", "image": null, "isCorrect": false}, {"id": "SVKPZ", "text": "$F_2$", "image": null, "isCorrect": true}, {"id": "VSpHw", "text": "$\\mathrm{F}^{-}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "An oxidising agent is a species that accepts electrons and gets reduced.<br><br>Fluorine ($F_2$) has the highest standard reduction potential among all elements in the electrochemical series.<br><br>Thus, $F_2$ has the maximum tendency to accept electrons and get reduced to $F^{-}$.<br><br>Therefore, $F_2$ acts as the strongest oxidising agent.<br><br>Answer: $F_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5abf9280d7f993287a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify correct statement for the reaction.\n$\\mathrm{I}_2+\\mathrm{KClO}_3 \\xrightarrow{\\Delta} \\mathrm{ICl}+\\mathrm{KIO}_3$", "image": null}, "options": [{"id": "hnQcs", "text": "$\\mathrm{I}_2$ is an oxidising agent", "image": null, "isCorrect": false}, {"id": "obg32", "text": "$\\mathrm{KClO}_3$ is Reducing agent", "image": null, "isCorrect": false}, {"id": "gy3Z9", "text": "Oxidation number of 'Cl' decreases by 6", "image": null, "isCorrect": true}, {"id": "Xe2iO", "text": "Oxidation number of I increases by 2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let us determine the oxidation numbers of the elements in the reactants and products.<br><br>In the reactant $\\mathrm{I}_2$, the oxidation number of $\\mathrm{I}$ is $0$.<br><br>In $\\mathrm{KClO}_3$, let the oxidation number of $\\mathrm{Cl}$ be $x$.<br>$+1 + x + 3(-2) = 0 \\Rightarrow x = +5$<br><br>In the product $\\mathrm{ICl}$, since $\\mathrm{Cl}$ is more electronegative than $\\mathrm{I}$, the oxidation number of $\\mathrm{Cl}$ is $-1$ and that of $\\mathrm{I}$ is $+1$.<br><br>In $\\mathrm{KIO}_3$, let the oxidation number of $\\mathrm{I}$ be $y$.<br>$+1 + y + 3(-2) = 0 \\Rightarrow y = +5$<br><br>The oxidation number of $\\mathrm{Cl}$ changes from $+5$ in $\\mathrm{KClO}_3$ to $-1$ in $\\mathrm{ICl}$. Thus, the oxidation number of $\\mathrm{Cl}$ decreases by $6$.<br><br>Since the oxidation number of $\\mathrm{Cl}$ decreases, $\\mathrm{KClO}_3$ undergoes reduction and acts as an oxidising agent.<br><br>The oxidation number of $\\mathrm{I}$ increases from $0$ to $+1$ and $+5$. Thus, $\\mathrm{I}_2$ undergoes oxidation and acts as a reducing agent.<br><br>Therefore, the only correct statement is that the oxidation number of $\\mathrm{Cl}$ decreases by $6$.<br><br>Answer: Oxidation number of 'Cl' decreases by 6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ae0aee93fa0796dab3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Which of the following changes involves transfer of 5 electrons?", "image": null}, "options": [{"id": "Czktb", "text": "$\\mathrm{MnO}_4^{-} \\longrightarrow \\mathrm{Mn}^{2+}$", "image": null, "isCorrect": true}, {"id": "WG7V5", "text": "$\\mathrm{CrO}_4^{2-} \\longrightarrow \\mathrm{Cr}^{3+}$", "image": null, "isCorrect": false}, {"id": "BDQn8", "text": "$\\mathrm{NO}_3^{-} \\longrightarrow \\mathrm{NH}_4^{+}$", "image": null, "isCorrect": false}, {"id": "gPhKy", "text": "$\\mathrm{Cr}_2 \\mathrm{O}_7^{2-} \\longrightarrow 2 \\mathrm{Cr}^{3+}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\mathrm{MnO}_4^{-}$, the oxidation state of $\\mathrm{Mn}$ is calculated as $x + 4(-2) = -1 \\Rightarrow x = +7$.<br><br>In $\\mathrm{Mn}^{2+}$, the oxidation state of $\\mathrm{Mn}$ is $+2$.<br><br>The change in oxidation state is from $+7$ to $+2$, which corresponds to a transfer of $5$ electrons.<br><br>For $\\mathrm{CrO}_4^{2-} \\longrightarrow \\mathrm{Cr}^{3+}$, the oxidation state of $\\mathrm{Cr}$ changes from $+6$ to $+3$, involving $3$ electrons.<br><br>For $\\mathrm{NO}_3^{-} \\longrightarrow \\mathrm{NH}_4^{+}$, the oxidation state of $\\mathrm{N}$ changes from $+5$ to $-3$, involving $8$ electrons.<br><br>For $\\mathrm{Cr}_2 \\mathrm{O}_7^{2-} \\longrightarrow 2 \\mathrm{Cr}^{3+}$, the oxidation state of $\\mathrm{Cr}$ changes from $+6$ to $+3$ for two atoms, involving a total of $6$ electrons.<br><br>Answer: $\\mathrm{MnO}_4^{-} \\longrightarrow \\mathrm{Mn}^{2+}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262800279619d9d8a350b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Which element from following rapidly loses its luster in air and tarnishes?", "image": null}, "options": [{"id": "YW1yV", "text": "Ba", "image": null, "isCorrect": false}, {"id": "02EBp", "text": "Be", "image": null, "isCorrect": false}, {"id": "dvP11", "text": "K", "image": null, "isCorrect": true}, {"id": "nDwvO", "text": "Mg", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Elements of group 1 rapidly lose their luster in air due to formation of a layer of exide, peroxide or superoxide by reaction with oxygen in air.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626c0279619d9d8a346a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "What is the number of moles of electrons gained by one mole oxidizing agent in following redox reaction?\n$$\n\\mathrm{Zn}_{(\\mathrm{s})}+2 \\mathrm{HCl}_{(\\mathrm{aq})} \\longrightarrow \\mathrm{ZnCl}_2+\\mathrm{H}_2\n$$", "image": null}, "options": [{"id": "ZIBfp", "text": "$4$", "image": null, "isCorrect": false}, {"id": "d3mre", "text": "$3$", "image": null, "isCorrect": false}, {"id": "BgXLA", "text": "$2$", "image": null, "isCorrect": fals questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2603b0279619d9d8a22d4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "Identify reductant in following reaction.\n$$\n\\mathrm{C}_2 \\mathrm{O}_4^{2-}+\\mathrm{MnO}_4^{-}+\\mathrm{H}^{+} \\longrightarrow \\mathrm{Mn}^{2+}+\\mathrm{CO}_2+\\mathrm{H}_2 \\mathrm{O}\n$$", "image": null}, "options": [{"id": "ecODf", "text": "$\\mathrm{H}^{+}$", "image": null, "isCorrect": false}, {"id": "RWCXZ", "text": "$\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "gLG1i", "text": "$\\mathrm{C}_2 \\mathrm{O}_4^{2-}$", "image": null, "isCorrect": true}, {"id": "dT7UG", "text": "$\\mathrm{MnO}_4^{-}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\stackrel{+3}{\\mathrm{C}_2} \\mathrm{O}_4^{2-}+\\stackrel{+7}{\\mathrm{MnO}_4^{-}}+\\mathrm{H}^{+} \\longrightarrow \\stackrel{+2}{\\mathrm{Mn}^{2+}} \\mathrm{CO}_2+\\mathrm{H}_2 \\mathrm{O}$\nThe oxidation number of $\\mathrm{C}$ increase from $+3\\left(\\mathrm{C}_2 \\mathrm{O}_4^{2-}\\right)$ to $+4\\left(\\mathrm{CO}_2\\right)$ in above reaction.\n$\\therefore\\left(\\mathrm{C}_2 \\mathrm{O}_4^{2-}\\right)$ acts as a reductant.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fe20279619d9d8a2000", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "Identify the reducing agent in following reaction.\n$\\mathrm{CH}_{4(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{CO}_{2(\\mathrm{~g})}+2 \\mathrm{H}_{2} \\mathrm{O}_{(\\mathrm{l})}$", "image": null}, "options": [{"id": "nRPlP", "text": "$\\mathrm{CO}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "Ep9YO", "text": "$\\mathrm{H}_{2} \\mathrm{O}_{(\\mathrm{l})}$", "image": null, "isCorrect": false}, {"id": "nMKDm", "text": "$\\mathrm{O}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "7At7b", "text": "$\\mathrm{CH}_{4(\\mathrm{~g})}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(A)\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/SANuCHsdKTW6_-78kZEnqYSv8wrDgk5K1Nq3vqd3fX4.original.fullsize.png\"><br>\nSince oxygen $\\left(\\mathrm{O}_{2}\\right)$ is undergoing reduction, it is oxidizing agent.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25efa0279619d9d8a18cb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "Which of the following oxides can act both as oxidising agent as well as reducing agent?", "image": null}, "options": [{"id": "8uW6N", "text": "<math><msub><mrow><mi>N</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>O</mi></math>", "image": null, "isCorrect": false}, {"id": "tL4Cc", "text": "<math><mi>S</mi><msub><mrow><mi>O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "TSEks", "text": "<math><mi>S</mi><msub><mrow><mi>O</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "uA399", "text": "<math><msub><mrow><mi>P</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>O</mi></mrow><mrow><mn>5</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>S</mi><msub><mrow><mi>O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> oxides can act both as an oxidising agent as well as reducing agent. It behaves as a reducing agent in most conditions. It convert iron (III) ions to iron (II) ions and decolourises acidified potassium permanganate (VII) solution. <br/><math><mn>2</mn><mi>F</mi><msup><mrow><mi>e</mi></mrow><mrow><mn>3</mn><mo>+</mo></mrow></msup><mi>S</mi><msub><mrow><mi>O</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mn>2</mn><msub><mrow><mi>H</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>⊙</mo><mo>→</mo><mn>2</mn><mi>F</mi><msup><mrow><mi>e</mi></mrow><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>+</mo><mi>S</mi><msubsup><mrow><mi>O</mi></mrow><mrow><mn>4</mn></mrow><mrow><mn>2</mn><mo>-</mo></mrow></msubsup><mo>+</mo><mn>4</mn><msup><mrow><mi>H</mi></mrow><mrow><mo>+</mo></mrow></msup></math>  <br/>When <math><mi>S</mi><msub><mrow><mi>O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> reacts with <math><msub><mrow><mi>H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>S</mi><mo>,</mo></math> it produces sulphur and water. In this reaction, ‘ <math><mi>S</mi><msub><mrow><mi>O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> ’ act as an oxidising agent. <br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/8be3acf3-8867-44cf-a122-209e29247ab4.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ec20279619d9d8a170f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}], "question": {"text": "Which among the following compounds does not act as a reducing agent?", "image": null}, "options": [{"id": "cit0O", "text": "<math> <mrow> <msub> <mtext>H</mtext> <mtext>2</mtext> </msub> <mtext>O</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "SmHG0", "text": "<math> <mrow>  <msub>   <mrow>    <mtext>&#x00A0;H</mtext></mrow>   <mtext>2</mtext>  </msub>  <mtext>S</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "cC0iC", "text": "<math> <mrow>  <msub>   <mrow>    <mtext>&#x00A0;H</mtext></mrow>   <mtext>2</mtext>  </msub>  <mtext>Se</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "pxqe4", "text": "<math> <mrow>  <msub>   <mrow>    <mtext>&#x00A0;H</mtext></mrow>   <mtext>2</mtext>  </msub>  <mtext>Te</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Due to high <math> <mrow> <mtext>H</mtext><mo>−</mo><mtext>O</mtext></mrow> </math> bond strength, <math> <mrow> <msub> <mtext>H</mtext> <mtext>2</mtext> </msub> <mtext>O</mtext></mrow> </math> do not act as reducing agent, where as rest of then act as reducing agents.<br /><math> <mrow>  <munderover>   <mo>&#x2192;</mo>   <mrow>    <mtext>Reducing</mtext><mtext>&#x2004;</mtext><mtext>action</mtext><mtext>&#x2004;</mtext><mtext>increases</mtext></mrow>   <mrow>    <msub>     <mtext>H</mtext>     <mtext>2</mtext>    </msub>    <mtext>S</mtext><mtext>&#x2004;</mtext><mtext>&#x2004;</mtext><msub>     <mtext>H</mtext>     <mtext>2</mtext>    </msub>    <mtext>Se</mtext><mtext>&#x2004;</mtext><mtext>&#x2004;</mtext><msub>     <mtext>H</mtext>     <mtext>2</mtext>    </msub>    <mtext>Te</mtext></mrow>  </munderover>  </mrow></math><br />due to decrease in <math> <mrow> <mtext>H</mtext><mo>−</mo><mtext>E</mtext></mrow> </math> bond strength.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8e0279619d9d8a1567", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "Which of the following phosphorus oxyacids can act as a reducing agent?", "image": null}, "options": [{"id": "EUqvT", "text": "$\\mathrm{H}_{3} \\mathrm{PO}_{3}$", "image": null, "isCorrect": true}, {"id": "jXBGx", "text": "$\\mathrm{H}_{3} \\mathrm{PO}_{4}$", "image": null, "isCorrect": false}, {"id": "p5AZV", "text": "$\\mathrm{H}_{2} \\mathrm{P}_{2} \\mathrm{O}_{6}$", "image": null, "isCorrect": false}, {"id": "6gx0Z", "text": "$\\mathrm{H}_{4} \\mathrm{P}_{2} \\mathrm{O}_{7}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Oxyacid of phosphorus which contains $\\mathrm{P}-\\mathrm{H}$ bonds can act as a reducing agent. $\\mathrm{H}_{3} \\mathrm{PO}_{3}$ contains one $\\mathrm{P}-\\mathrm{H}$ bond and hence acts as a reducing agent.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/DMYpRcnKQJdROcZZ17kh3PDzbYGQUZ00NFLvWg6tItc.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263460279619d9d8a3db5", "title": "Types of redox reactions", "totalQuestions": 5, "questions": [{"_id": "6abb883315a9fc0fc8c14172", "type": "singleCorrect", "question": {"text": "Which among $\\text{F}_2$, $\\text{Cl}_2$, $\\text{Br}_2$ and $\\text{I}_2$ exhibit disproportionation reaction?", "image": null}, "options": [{"id": "BtlGG", "label": "A", "text": "$\\text{F}_2$ and $\\text{Cl}_2$", "isCorrect": false, "image": null}, {"id": "lMnKG", "label": "B", "text": "$\\text{Cl}_2, \\text{Br}_2$ and $\\text{I}_2$", "isCorrect": true, "image": null}, {"id": "EoUNR", "label": "C", "text": "Only $\\text{I}_2$", "isCorrect": false, "image": null}, {"id": "jcce5", "label": "D", "text": "$\\text{F}_2, \\text{Cl}_2$ and $\\text{Br}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Fluorine is the most electronegative element and does not exhibit any positive oxidation state. Hence, it can only be reduced from $0$ to $-1$ oxidation state and cannot undergo disproportionation.<br><br>Chlorine, bromine, and iodine have vacant d-orbitals and can exhibit positive oxidation states (such as $+1, +3, +5, +7$) along with the $-1$ oxidation state. Therefore, they undergo disproportionation reactions in alkaline medium.<br><br>For example, with cold and dilute alkali:<br>$\\text{X}_2 + 2\\text{OH}^- \\rightarrow \\text{X}^- + \\text{OX}^- + \\text{H}_2\\text{O}$ (where $\\text{X} = \\text{Cl}, \\text{Br}, \\text{I}$)<br><br>Thus, $\\text{Cl}_2$, $\\text{Br}_2$, and $\\text{I}_2$ exhibit disproportionation reactions.<br><br>Answer: $\\text{Cl}_2, \\text{Br}_2$ and $\\text{I}_2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261640279619d9d8a2c31", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "Identify correct statement for following reaction.\n$3 \\mathrm{Br}_2+6 \\mathrm{CO}_3{ }^{2-}+3 \\mathrm{H}_2 \\mathrm{O} \\rightarrow 5 \\mathrm{Br}^{-}+\\mathrm{BrO}_3{ }^{-}+6 \\mathrm{HCO}_3^{-}$", "image": null}, "options": [{"id": "5hfst", "text": "Bromine is neither reduced nor oxidised", "image": null, "isCorrect": false}, {"id": "ti7Yw", "text": "Bromine is oxidised and carbonate is reduced", "image": null, "isCorrect": false}, {"id": "SH5Q2", "text": "Bromine is reduced and water is oxidised", "image": null, "isCorrect": false}, {"id": "B9M7p", "text": "Bromine is both reduced and oxidised", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{Br}_2$ is undergoing oxidation as well as reduction.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260d00279619d9d8a2787", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "Which of following is NOT a redox reaction?", "image": null}, "options": [{"id": "k3ilq", "text": "$\\mathrm{CH}_3 \\mathrm{CHO}+\\mathrm{Cu}(\\mathrm{OH})_2 \\longrightarrow \\mathrm{CH}_3 \\mathrm{COOH}+\\mathrm{Cu}_2 \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "7ChXV", "text": "$\\mathrm{SnCl}_4+\\mathrm{FeCl}_2 \\longrightarrow \\mathrm{FeCl}_3+\\mathrm{SnCl}_2$", "image": null, "isCorrect": false}, {"id": "KYcmf", "text": "$\\mathrm{H}_2 \\mathrm{SO}_4+\\mathrm{Ca}(\\mathrm{OH})_2 \\longrightarrow \\mathrm{CaSO}_4+\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": true}, {"id": "ThR3s", "text": "$\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{OH}+[\\mathrm{O}] \\longrightarrow \\mathrm{CH}_3 \\mathrm{CHO}+\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{H}_2 \\mathrm{SO}_4+\\mathrm{Ca}(\\mathrm{OH})_2 \\longrightarrow \\mathrm{CaSO}_4+\\mathrm{H}_2 \\mathrm{O}$\nAcid Base\nIt is Acid-Base Reaction\nor double-displacement reaction.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f6e0279619d9d8a1c6a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "When $\\mathrm{SO}_{2}$ is passed through acidified $\\mathrm{K}_{2} \\mathrm{Cr}_{2} \\mathrm{0}$, the process that takes place is", "image": null}, "options": [{"id": "OSR2f", "text": "the solution turns blue", "image": null, "isCorrect": false}, {"id": "8MrzA", "text": "the solution is decolourised", "image": null, "isCorrect": false}, {"id": "bYmdg", "text": "$\\mathrm{SO}_{2}$ is reduced", "image": null, "isCorrect": false}, {"id": "tlrLO", "text": "green $\\mathrm{Cr}_{2}\\left(\\mathrm{SO}_{4}\\right)_{3}$ is formed", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When $\\mathrm{SO}_{2}$ is passed through acidified $\\mathrm{K}_{2} \\mathrm{Cr}_{2} \\mathrm{O}_{7}$ solution. $\\mathrm{SO}_{2}$ gas turns acidified potassium dichromate solution from orange to green reduced chromium $+4$ to $+3$.\n$\\mathrm{K}_{2} \\mathrm{Cr}_{2} \\mathrm{O}_{7}+2 \\mathrm{H}_{2} \\mathrm{SO}_{4}+3 \\mathrm{SO}_{2} \\rightarrow 2 \\mathrm{Cr}_{2}\\left(\\mathrm{SO}_{4}\\right)_{3}+\\mathrm{K}_{2} \\mathrm{SO}_{4}+\\mathrm{H}_{2} \\mathrm{O}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ee70279619d9d8a183a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "When <math><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math> solution in water is treated with concentrated <math><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi></math> it turns", "image": null}, "options": [{"id": "FvnhZ", "text": "Violet", "image": null, "isCorrect": false}, {"id": "2Wx4a", "text": "Yellow", "image": null, "isCorrect": true}, {"id": "BH8FY", "text": "Purple", "image": null, "isCorrect": false}, {"id": "O9f1b", "text": "Green", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo></mrow></mfenced><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\"></mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo></mrow></mfenced><mo>→</mo><munder><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">Y</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">w</mi></mrow></mfenced></mrow></munder><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo></mrow></mfenced><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263460279619d9d8a3db4", "title": "Oxidation number", "totalQuestions": 84, "questions": [{"_id": "6abb88d015a9fc0fc8c14734", "type": "singleCorrect", "question": {"text": "Find out the oxidation state of oxygen in $\\text{H}_2\\text{O}_2$", "image": null}, "options": [{"id": "JyL6z", "label": "A", "text": "$-1$", "isCorrect": true, "image": null}, {"id": "GPQEf", "label": "B", "text": "$-2$", "isCorrect": false, "image": null}, {"id": "HY5ps", "label": "C", "text": "$+1$", "isCorrect": false, "image": null}, {"id": "Y3aJz", "label": "D", "text": "$+2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the oxidation state of oxygen in $\\text{H}_2\\text{O}_2$ be $x$.<br><br>The oxidation state of hydrogen is $+1$.<br><br>Since the molecule is neutral, the sum of oxidation states of all atoms is zero.<br><br>$2(+1) + 2x = 0$<br><br>$2 + 2x = 0$<br><br>$2x = -2$<br><br>$x = -1$<br><br>The oxidation state of oxygen in $\\text{H}_2\\text{O}_2$ is $-1$.<br><br>Answer: $-1$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889f15a9fc0fc8c14572", "type": "singleCorrect", "question": {"text": "What is oxidation number of oxygen in super oxide of a monovalent metal?", "image": null}, "options": [{"id": "OXrxQ", "label": "A", "text": "$-2$", "isCorrect": false, "image": null}, {"id": "vnXxg", "label": "B", "text": "$-1/2$", "isCorrect": true, "image": null}, {"id": "vLqle", "label": "C", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "s9KdL", "label": "D", "text": "$-1.5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the monovalent metal be $M$. Its oxidation state is $+1$.<br><br>The formula of the superoxide of a monovalent metal is $MO_2$, which contains the superoxide ion $O_2^-$.<br><br>Let the oxidation number of oxygen be $x$.<br><br>The sum of oxidation numbers in a neutral compound is zero.<br><br>$+1 + 2x = 0$<br><br>$2x = -1$<br><br>$x = -1/2$<br><br>Answer: $-1/2$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884015a9fc0fc8c141ee", "type": "singleCorrect", "question": {"text": "Which of the following compounds has the lowest oxidation state of carbon?", "image": null}, "options": [{"id": "2GXe2", "label": "A", "text": "$\\text{CH}_4$", "isCorrect": true, "image": null}, {"id": "ksedh", "label": "B", "text": "$\\text{CCl}_4$", "isCorrect": false, "image": null}, {"id": "Q1132", "label": "C", "text": "$\\text{CF}_4$", "isCorrect": false, "image": null}, {"id": "9QmXr", "label": "D", "text": "$\\text{CO}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the oxidation state of carbon be $x$.<br><br>In $\\text{CH}_4$, hydrogen is less electronegative than carbon, so its oxidation state is $+1$.<br>$x + 4(+1) = 0 \\Rightarrow x = -4$<br><br>In $\\text{CCl}_4$, chlorine is more electronegative than carbon, so its oxidation state is $-1$.<br>$x + 4(-1) = 0 \\Rightarrow x = +4$<br><br>In $\\text{CF}_4$, fluorine is more electronegative than carbon, so its oxidation state is $-1$.<br>$x + 4(-1) = 0 \\Rightarrow x = +4$<br><br>In $\\text{CO}_2$, oxygen is more electronegative than carbon, so its oxidation state is $-2$.<br>$x + 2(-2) = 0 \\Rightarrow x = +4$<br><br>The lowest oxidation state of carbon is $-4$, which is found in $\\text{CH}_4$.<br><br>Answer: $\\text{CH}_4$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885015a9fc0fc8c14284", "type": "singleCorrect", "question": {"text": "Assign the oxidation number of $N$ in the following species respectively.<br>(i) $\\text{NH}_4^+$ &nbsp;&nbsp;&nbsp; (ii) $\\text{NO}_2$", "image": null}, "options": [{"id": "FSJDD", "label": "A", "text": "$+3,\\,-3$", "isCorrect": false, "image": null}, {"id": "Wk3FT", "label": "B", "text": "$-3,\\,+4$", "isCorrect": true, "image": null}, {"id": "8hNLa", "label": "C", "text": "$-4,\\,+3$", "isCorrect": false, "image": null}, {"id": "Y5Cre", "label": "D", "text": "$+5,\\,+3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the oxidation number of $N$ in $\\text{NH}_4^+$ be $x$.<br><br>$x + 4(+1) = +1$<br><br>$x = -3$<br><br>Let the oxidation number of $N$ in $\\text{NO}_2$ be $y$.<br><br>$y + 2(-2) = 0$<br><br>$y = +4$<br><br>The oxidation numbers of $N$ in $\\text{NH}_4^+$ and $\\text{NO}_2$ are $-3$ and $+4$ respectively.<br><br>Answer: $-3,\\,+4$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88af15a9fc0fc8c14608", "type": "singleCorrect", "question": {"text": "Identify the correct stock notation for manganese dioxide.", "image": null}, "options": [{"id": "tw1zw", "label": "A", "text": "$\\text{Mn(I)O}_2$", "isCorrect": false, "image": null}, {"id": "mtOZS", "label": "B", "text": "$\\text{Mn(II)O}_2$", "isCorrect": false, "image": null}, {"id": "NtxFN", "label": "C", "text": "$\\text{Mn(III)O}_2$", "isCorrect": false, "image": null}, {"id": "3S58I", "label": "D", "text": "$\\text{Mn(IV)O}_2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The chemical formula for manganese dioxide is $\\text{MnO}_2$.<br><br>Let the oxidation state of manganese (Mn) be $x$. The oxidation state of oxygen (O) is $-2$.<br><br>Since the molecule is neutral, the sum of the oxidation states is zero:<br><br>$x + 2(-2) = 0$<br><br>$x - 4 = 0$<br><br>$x = +4$<br><br>The oxidation state of manganese in manganese dioxide is $+4$.<br><br>In Stock notation, the oxidation state of the metal is indicated by a Roman numeral in parentheses immediately following the metal symbol. Therefore, the Stock notation for manganese dioxide is $\\text{Mn(IV)O}_2$.<br><br>Answer: $\\text{Mn(IV)O}_2$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886f15a9fc0fc8c143b0", "type": "singleCorrect", "question": {"text": "What is the oxidation number of S in $\\text{H}_2\\text{SO}_3$ and $\\text{H}_2\\text{S}_2\\text{O}_7$ respectively?", "image": null}, "options": [{"id": "BzDyL", "label": "A", "text": "$+2$ and $+4$", "isCorrect": false, "image": null}, {"id": "wI5TB", "label": "B", "text": "$+4$ and $+6$", "isCorrect": true, "image": null}, {"id": "cYuF9", "label": "C", "text": "$+3$ and $+5$", "isCorrect": false, "image": null}, {"id": "iGHEU", "label": "D", "text": "$+6$ and $+4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the oxidation number of S in $\\text{H}_2\\text{SO}_3$ be $x$.<br><br>$2(+1) + x + 3(-2) = 0$<br><br>$x - 4 = 0 \\Rightarrow x = +4$<br><br>Let the oxidation number of S in $\\text{H}_2\\text{S}_2\\text{O}_7$ be $y$.<br><br>$2(+1) + 2y + 7(-2) = 0$<br><br>$2y - 12 = 0 \\Rightarrow y = +6$<br><br>The oxidation numbers of S in $\\text{H}_2\\text{SO}_3$ and $\\text{H}_2\\text{S}_2\\text{O}_7$ are $+4$ and $+6$ respectively.<br><br>Answer: $+4$ and $+6$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887f15a9fc0fc8c14446", "type": "singleCorrect", "question": {"text": "What is the oxidation number of P in $\\text{NaH}_2\\text{PO}_4$?", "image": null}, "options": [{"id": "ONIN8", "label": "A", "text": "$+1$", "isCorrect": false, "image": null}, {"id": "e7bTZ", "label": "B", "text": "$+3$", "isCorrect": false, "image": null}, {"id": "jsEyB", "label": "C", "text": "$+5$", "isCorrect": true, "image": null}, {"id": "ordPH", "label": "D", "text": "$+7$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the oxidation number of P in $\\text{NaH}_2\\text{PO}_4$ be $x$.<br><br>The oxidation number of Na is $+1$, H is $+1$, and O is $-2$.<br><br>The sum of oxidation numbers of all atoms in a neutral molecule is zero.<br><br>Therefore, $1(+1) + 2(+1) + x + 4(-2) = 0$<br><br>$1 + 2 + x - 8 = 0$<br><br>$x - 5 = 0$<br><br>$x = +5$<br><br>Answer: $+5$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888f15a9fc0fc8c144dc", "type": "singleCorrect", "question": {"text": "What is the oxidation number of phosphorus in $\\text{Ca}_3(\\text{PO}_4)_2$?", "image": null}, "options": [{"id": "u2q4p", "label": "A", "text": "$+1$", "isCorrect": false, "image": null}, {"id": "vp6m0", "label": "B", "text": "$+3$", "isCorrect": false, "image": null}, {"id": "FPqdv", "label": "C", "text": "$+5$", "isCorrect": true, "image": null}, {"id": "JRYQ1", "label": "D", "text": "$+7$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the oxidation number of phosphorus be $x$.<br><br>The oxidation number of calcium (Ca) is $+2$ and oxygen (O) is $-2$.<br><br>In $\\text{Ca}_3(\\text{PO}_4)_2$, the sum of oxidation numbers of all atoms is zero.<br><br>$3(+2) + 2[x + 4(-2)] = 0$<br><br>$6 + 2(x - 8) = 0$<br><br>$6 + 2x - 16 = 0$<br><br>$2x - 10 = 0$<br><br>$x = +5$<br><br>Alternatively, considering the phosphate ion $\\text{PO}_4^{3-}$:<br><br>$x + 4(-2) = -3$<br><br>$x - 8 = -3$<br><br>$x = +5$<br><br>Answer: $+5$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886215a9fc0fc8c14334", "type": "singleCorrect", "question": {"text": "Find the oxidation number of S in Marshall's acid.", "image": null}, "options": [{"id": "AAXzS", "label": "A", "text": "$+5$", "isCorrect": false, "image": null}, {"id": "wCNrs", "label": "B", "text": "$+4$", "isCorrect": false, "image": null}, {"id": "wc2vj", "label": "C", "text": "$+7$", "isCorrect": false, "image": null}, {"id": "LuP9i", "label": "D", "text": "$+6$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Marshall's acid is peroxydisulfuric acid, having the chemical formula $H_2S_2O_8$.<br><br>The structure of Marshall's acid is $HO-S(=O)_2-O-O-S(=O)_2-OH$. It contains one peroxy linkage ($-O-O-$).<br><br>Let the oxidation number of S be $x$.<br><br>In $H_2S_2O_8$, there are $2$ hydrogen atoms with an oxidation state of $+1$, $6$ oxygen atoms with an oxidation state of $-2$, and $2$ oxygen atoms in the peroxy linkage with an oxidation state of $-1$.<br><br>Equating the sum of oxidation states to zero:<br><br>$2(+1) + 2(x) + 6(-2) + 2(-1) = 0$<br><br>$2 + 2x - 12 - 2 = 0$<br><br>$2x = 12$<br><br>$x = +6$<br><br>Alternatively, the calculated oxidation state without considering the peroxy linkage is $+7$, which exceeds the maximum possible oxidation state of sulfur ($+6$). Hence, the oxidation state of sulfur is $+6$.<br><br>Answer: $+6$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886015a9fc0fc8c1431a", "type": "singleCorrect", "question": {"text": "Which of the following compounds has a nitrogen atom with two different oxidation states?", "image": null}, "options": [{"id": "scLC0", "label": "A", "text": "$\\text{NH}_4\\text{NO}_3$", "isCorrect": true, "image": null}, {"id": "nB6vo", "label": "B", "text": "$\\text{N}_2\\text{H}_4$", "isCorrect": false, "image": null}, {"id": "atXXg", "label": "C", "text": "$\\text{N}_3\\text{H}$", "isCorrect": false, "image": null}, {"id": "XEKHt", "label": "D", "text": "$\\text{NH}_2\\text{CONH}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In $\\text{NH}_4\\text{NO}_3$, the compound exists as $\\text{NH}_4^+$ and $\\text{NO}_3^-$ ions.<br><br>For the ammonium ion ($\\text{NH}_4^+$), let the oxidation state of nitrogen be $x$.<br>$x + 4(+1) = +1 \\Rightarrow x = -3$<br><br>For the nitrate ion ($\\text{NO}_3^-$), let the oxidation state of nitrogen be $y$.<br>$y + 3(-2) = -1 \\Rightarrow y = +5$<br><br>Thus, nitrogen exhibits two different oxidation states, $-3$ and $+5$, in $\\text{NH}_4\\text{NO}_3$.<br><br>In $\\text{N}_2\\text{H}_4$, the oxidation state of both nitrogen atoms is $-2$.<br>In $\\text{N}_3\\text{H}$, the average oxidation state of nitrogen is $-1/3$.<br>In $\\text{NH}_2\\text{CONH}_2$ (urea), both nitrogen atoms are in identical environments and have an oxidation state of $-3$.<br><br>Answer: $\\text{NH}_4\\text{NO}_3$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883015a9fc0fc8c14158", "type": "singleCorrect", "question": {"text": "Consider the following compounds : $\\underline{\\text{K}}\\text{O}_2$, $\\text{H}_2\\underline{\\text{O}}_2$ and $\\text{H}_2\\underline{\\text{S}}\\text{O}_4$. The oxidation state of the underlined elements in them are, respectively,", "image": null}, "options": [{"id": "slb8i", "label": "A", "text": "$+1, -2$ and $+4$", "isCorrect": false, "image": null}, {"id": "YxNqY", "label": "B", "text": "$+4, -4$ and $+6$", "isCorrect": false, "image": null}, {"id": "5C2LO", "label": "C", "text": "$+1, -1$ and $+6$", "isCorrect": true, "image": null}, {"id": "NYEFh", "label": "D", "text": "$+2, -2$ and $+6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In $\\text{KO}_2$, potassium is an alkali metal, which always exhibits an oxidation state of $+1$.<br><br>In $\\text{H}_2\\text{O}_2$, oxygen is present in a peroxide linkage. Let the oxidation state of oxygen be $x$.<br>$2(+1) + 2x = 0 \\Rightarrow x = -1$<br><br>In $\\text{H}_2\\text{SO}_4$, let the oxidation state of sulphur be $y$.<br>$2(+1) + y + 4(-2) = 0 \\Rightarrow y = +6$<br><br>The oxidation states of the underlined elements are $+1$, $-1$ and $+6$ respectively.<br><br>Answer: $+1, -1$ and $+6$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2aa8c30a4553e1bdb84", "type": "singleCorrect", "question": {"text": "What is the oxidation state of Xe in $\\text{XeOF}_4$?", "image": null}, "options": [{"id": "Uxnkc", "label": "A", "text": "$+4$", "isCorrect": false, "image": null}, {"id": "sxLHz", "label": "B", "text": "$-4$", "isCorrect": false, "image": null}, {"id": "1uWLo", "label": "C", "text": "$-6$", "isCorrect": false, "image": null}, {"id": "9TDoG", "label": "D", "text": "$+6$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the oxidation state of Xe in $\\text{XeOF}_4$ be $x$.<br><br>The oxidation state of oxygen (O) is $-2$ and that of fluorine (F) is $-1$.<br><br>Since the molecule is neutral, the sum of the oxidation states of all atoms must be zero.<br><br>$x + (-2) + 4(-1) = 0$<br><br>$x - 2 - 4 = 0$<br><br>$x - 6 = 0$<br><br>$x = +6$<br><br>The oxidation state of Xe in $\\text{XeOF}_4$ is $+6$.<br><br>Answer: $+6$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2aa8c30a4553e1bdb83", "type": "singleCorrect", "question": {"text": "What is the oxidation number of Cl in $\\text{HOClO}_2$?", "image": null}, "options": [{"id": "GyhJi", "label": "A", "text": "$+7$", "isCorrect": false, "image": null}, {"id": "rg816", "label": "B", "text": "$+5$", "isCorrect": true, "image": null}, {"id": "E5vfd", "label": "C", "text": "$+3$", "isCorrect": false, "image": null}, {"id": "TCIPE", "label": "D", "text": "$+1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the oxidation number of $\\text{Cl}$ in $\\text{HOClO}_2$ (which is $\\text{HClO}_3$) be $x$.<br><br>The oxidation number of hydrogen ($\\text{H}$) is $+1$ and that of oxygen ($\\text{O}$) is $-2$.<br><br>The sum of the oxidation numbers of all atoms in a neutral molecule is zero.<br><br>$+1 + x + 3(-2) = 0$<br><br>$x - 5 = 0$<br><br>$x = +5$<br><br>The oxidation number of $\\text{Cl}$ in $\\text{HOClO}_2$ is $+5$.<br><br>Answer: $+5$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a88c30a4553e1bdb6a", "type": "singleCorrect", "question": {"text": "What is the number of electrons gained by Cl atom when $n$ mole of $\\text{ClO}_4^-$ is transformed into $n$ mole of $\\text{ClO}_2^-$ ion?", "image": null}, "options": [{"id": "1h24L", "label": "A", "text": "$3n$", "isCorrect": false, "image": null}, {"id": "ASxmS", "label": "B", "text": "$4n$", "isCorrect": true, "image": null}, {"id": "BJmT5", "label": "C", "text": "$n$", "isCorrect": false, "image": null}, {"id": "BgEO2", "label": "D", "text": "$2n$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the oxidation state of Cl in $\\text{ClO}_4^-$ be $x$.<br><br>$x + 4(-2) = -1 \\Rightarrow x = +7$<br><br>Let the oxidation state of Cl in $\\text{ClO}_2^-$ be $y$.<br><br>$y + 2(-2) = -1 \\Rightarrow y = +3$<br><br>The change in oxidation state of Cl is from $+7$ to $+3$. This means each Cl atom gains $4$ electrons during the transformation.<br><br>For $1$ mole of $\\text{ClO}_4^-$, $4$ moles of electrons are gained.<br><br>Therefore, for $n$ moles of $\\text{ClO}_4^-$, the number of moles of electrons gained is $4n$.<br><br>Answer: $4n$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3538c30a4553e1be28e", "type": "singleCorrect", "question": {"text": "What is the difference in oxidation number of nitrogen when nitric acid is converted into nitrous oxide ?", "image": null}, "options": [{"id": "mZ2so", "label": "A", "text": "$+1$", "isCorrect": false, "image": null}, {"id": "ZLYgW", "label": "B", "text": "$+2$", "isCorrect": false, "image": null}, {"id": "K201Q", "label": "C", "text": "$+4$", "isCorrect": true, "image": null}, {"id": "pkr7z", "label": "D", "text": "$+3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The chemical formula of nitric acid is $HNO_3$.<br><br>Let the oxidation state of nitrogen in $HNO_3$ be $x$.<br><br>$+1 + x + 3(-2) = 0 \\Rightarrow x = +5$<br><br>The chemical formula of nitrous oxide is $N_2O$.<br><br>Let the oxidation state of nitrogen in $N_2O$ be $y$.<br><br>$2y + (-2) = 0 \\Rightarrow y = +1$<br><br>The difference in the oxidation number of nitrogen is $5 - 1 = 4$.<br><br>Answer: $+4$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ef8c30a4553e1bde65", "type": "singleCorrect", "question": {"text": "What is the oxidation number of carbon in oxalic acid ?", "image
