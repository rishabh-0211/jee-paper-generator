<br/><math><mo>&#8658;</mo><mi mathvariant=\"normal\">x</mi><mo>=</mo><mo>-</mo><mn>1</mn><mo>+</mo><mn>6</mn><mo>=</mo><mo>+</mo><mn>5</mn></math>  <br/>Hence, bromine changes from <math><mi mathvariant=\"normal\">B</mi><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> <em>to</em> <math><mi mathvariant=\"normal\">B</mi><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mo>+</mo><mn>5</mn></mrow></msup></math> <em>.</em>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9d0279619d9d8a15dc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The oxidation number of $\\mathrm{C}$ atom in $\\mathrm{CH}_{2} \\mathrm{Cl}_{2}$ and $\\mathrm{CCl}_{4}$ are respectively", "image": null}, "options": [{"id": "ccUpY", "text": "$-2$ and $-4$", "image": null, "isCorrect": false}, {"id": "LMVTL", "text": "0 and $-4$", "image": null, "isCorrect": false}, {"id": "VvPZT", "text": "0 and 4", "image": null, "isCorrect": true}, {"id": "mZtsJ", "text": "2 and 4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the oxidation number of $C$ is $x$\n$\\mathrm{CH}_{2} \\mathrm{Cl}_{2}$\n$x+2(+1)+2(-1)=0$\n$x+2-2=0$\n$x=0$\n$\\mathrm{CCl}_{4}$\n$x+4(-1)=0$\n$x-4=0$\n$x=4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263460279619d9d8a3db6", "title": "Balancing of redox reactions", "totalQuestions": 3, "questions": [{"_id": "6792139b0aee93fa0796da1d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "What is the value of $x$ and $y$ in order to balance following redox reaction?\n$\\mathrm{xCuO}+\\mathrm{yNH}_3 \\longrightarrow \\mathrm{xCu}+\\mathrm{N}_2+\\mathrm{xH}_2 \\mathrm{O}$", "image": null}, "options": [{"id": "fW46A", "text": "$\\mathrm{x}=2, \\mathrm{y}=1$", "image": null, "isCorrect": false}, {"id": "UVqPD", "text": "$\\mathrm{x}=1, \\mathrm{y}=2$", "image": null, "isCorrect": false}, {"id": "ScP12", "text": "$x=3, y=2$", "image": null, "isCorrect": true}, {"id": "yrxil", "text": "$x=2, y=3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given chemical equation is $x\\mathrm{CuO} + y\\mathrm{NH}_3 \\longrightarrow x\\mathrm{Cu} + \\mathrm{N}_2 + x\\mathrm{H}_2\\mathrm{O}$.<br><br>Balancing the nitrogen atoms on both sides, there are 2 nitrogen atoms in $\\mathrm{N}_2$ on the product side. Thus, $y = 2$.<br><br>Substituting $y = 2$, the number of hydrogen atoms on the reactant side becomes $2 \\times 3 = 6$.<br><br>To balance the hydrogen atoms on the product side, we must have $2x = 6$, which gives $x = 3$.<br><br>Substituting $x = 3$ and $y = 2$ into the equation gives $3\\mathrm{CuO} + 2\\mathrm{NH}_3 \\longrightarrow 3\\mathrm{Cu} + \\mathrm{N}_2 + 3\\mathrm{H}_2\\mathrm{O}$.<br><br>Checking the oxygen and copper atoms, there are 3 Cu and 3 O atoms on both sides. The equation is completely balanced.<br><br>Therefore, $x = 3$ and $y = 2$.<br><br>Answer: $x=3, y=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d70279619d9d8a2fc2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "What is the value of $x$ in order to balance following redox reaction?\n$\\mathrm{Mn}_{(\\mathrm{aq})}^{2+}+x \\mathrm{ClO}_{3(\\mathrm{aq})}^{-} \\rightarrow \\mathrm{MnO}_{2(\\mathrm{~s})}+x \\mathrm{ClO}_{2(\\mathrm{aq})}$", "image": null}, "options": [{"id": "pZwxH", "text": "$x=1$", "image": null, "isCorrect": false}, {"id": "mERHj", "text": "$x=2$", "image": null, "isCorrect": true}, {"id": "Vzu4s", "text": "$x=3$", "image": null, "isCorrect": false}, {"id": "Nis7c", "text": "$x=4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The balanced equation is:\n$\\mathrm{Mn}_{(\\mathrm{aq})}^{2+}+2 \\mathrm{ClO}_{3(\\mathrm{aq})}^{-} \\rightarrow \\mathrm{MnO}_{2(\\mathrm{~s})}+2 \\mathrm{ClO}_{2(\\mathrm{aq})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260270279619d9d8a2230", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "What is the value of ' $x$ ' in order to balance the following redox reaction by ion electron method?\n$$\n\\mathrm{x} \\mathrm{H}_2 \\mathrm{O}_2+\\mathrm{ClO}_4 \\rightarrow \\mathrm{x} \\mathrm{O}_2+\\mathrm{ClO}_2+2 \\mathrm{H}_2 \\mathrm{O}\n$$", "image": null}, "options": [{"id": "heegp", "text": "3", "image": null, "isCorrect": false}, {"id": "CXUPb", "text": "4", "image": null, "isCorrect": false}, {"id": "IFpb7", "text": "1", "image": null, "isCorrect": false}, {"id": "X9THI", "text": "2", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{x} \\mathrm{H}_2 \\mathrm{O}_2+\\mathrm{ClO}_4^{-} \\rightarrow \\mathrm{x} \\mathrm{O}_2+\\mathrm{ClO}_2^{-}+2 \\mathrm{H}_2 \\mathrm{O}\n$$\nReduction Half Reaction\n$$\n\\mathrm{ClO}_4^{-} \\longrightarrow \\mathrm{ClO}_2^{-}\n$$\n$$\n4 \\mathrm{e}^{-}+4 \\mathrm{H}^{+}+\\mathrm{ClO}_4^{-} \\longrightarrow \\mathrm{ClO}_2^{-}+2 \\mathrm{H}_2 \\mathrm{O}\n$$\nOxidation Half Reaction,\n$$\n\\begin{aligned}\n& \\mathrm{H}_2 \\mathrm{O}_2 \\longrightarrow \\mathrm{O}_2 \\\\\n& \\mathrm{H}_2 \\mathrm{O}_2 \\longrightarrow \\mathrm{O}_2+2 \\mathrm{H}^{+}+2 \\mathrm{e}^{-}\n\\end{aligned}\n$$\nNet Redox reaction\n$$\n\\begin{aligned}\n& {\\left[4 \\mathrm{e}^{-} 4 \\mathrm{H}^{+}+\\mathrm{ClO}_4^{-} \\longrightarrow \\mathrm{ClO}_2^{-}+2 \\mathrm{H}_2 \\mathrm{O}\\right] \\times 1} \\\\\n& {\\left[2 \\mathrm{H}_2 \\mathrm{O}_2 \\longrightarrow \\mathrm{O}_2+2 \\mathrm{H}^{+}+2 \\mathrm{e}^{-}\\right] \\times 2} \\\\\n& 2 \\mathrm{H}_2 \\mathrm{O}_2+\\mathrm{ClO}_4^{-} \\longrightarrow 2 \\mathrm{O}_2+\\mathrm{ClO}_2^{-}+2 \\mathrm{H}_2 \\mathrm{O} \\\\\n& \\mathrm{x}=2\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a263460279619d9d8a3db1", "title": "Equivalence concept", "totalQuestions": 5, "questions": [{"_id": "65a2625d0279619d9d8a33ed", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "According to reaction,\n$\\mathrm{Mg}_{(\\mathrm{s})}+2 \\mathrm{HCl}_{(\\mathrm{aq})} \\longrightarrow \\mathrm{MgCl}_{2(\\mathrm{aq})}+\\mathrm{H}_{2(\\mathrm{~g})} \\uparrow$\nCalculate the mass of $\\mathrm{Mg}$ required to liberate\n$4.48 \\mathrm{dm}^3 \\mathrm{H}_2$ at STP.\n$\\left(\\right.$ Molar mass of $\\mathrm{Mg}=24 \\mathrm{~g} \\mathrm{~mol}^{-1}$ )", "image": null}, "options": [{"id": "L4YcI", "text": "$12 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "w0XKQ", "text": "$4.8 \\mathrm{~g}$", "image": null, "isCorrect": true}, {"id": "mC2nB", "text": "$6 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "Ml6P7", "text": "$2.4 \\mathrm{~g}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Number of moles of a gas (n)\n$=\\frac{\\text { Volume of gas at STP }}{22.4 \\mathrm{dm}^3 \\mathrm{~mol}^{-1}}$\n$\\therefore \\quad \\mathrm{n}=\\frac{4.48 \\mathrm{dm}^3}{22.4 \\mathrm{dm}^3 \\mathrm{~mol}^{-1}}=0.2 \\mathrm{~mol}$\n$\\mathrm{Mg}_{(\\mathrm{s})}+2 \\mathrm{HCl}_{(\\mathrm{aq})} \\longrightarrow \\mathrm{MgCl}_2+\\mathrm{H}_{2(\\mathrm{~g})} \\uparrow$\n$1 \\mathrm{~mol} \\mathrm{Mg} \\equiv 1 \\mathrm{~mol} \\mathrm{H}_2$ gas\n$\\therefore \\quad$ Mg required to liberate $0.2 \\mathrm{~mol} \\mathrm{H}_2$ gas\n$=0.2 \\mathrm{~mol}=0.2 \\times 24=4.8 \\mathrm{~g}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262330279619d9d8a3299", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "What is the mass of $\\mathrm{KClO}_{3(\\mathrm{~s})}$ required to liberate 22. $4 \\mathrm{dm}^3$ oxygen at STP during thermal decomposition?\n(Molar Mass of $\\mathrm{KClO}_{3(\\mathrm{~s})}=122.5 \\mathrm{~g} / \\mathrm{mol}$ )", "image": null}, "options": [{"id": "Nh1ko", "text": "$122.5 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "iGeDg", "text": "$81.67 \\mathrm{~g}$", "image": null, "isCorrect": true}, {"id": "td9XI", "text": "$10.25 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "OPluH", "text": "$8.16 \\mathrm{~g}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& 2 \\mathrm{KClO}_3 \\\\\n& {[2 \\mathrm{moles}]}\n\\end{aligned} \\longrightarrow 2 \\mathrm{KCl}+\\underset{[3 \\mathrm{moles}]}{3 \\mathrm{O}_2 \\uparrow}\n$$\n[3 moles]\n$$\n2 \\text { moles of } \\mathrm{KClO}_3=2 \\times 122.5=245 \\mathrm{~g}\n$$\n3 moles of $\\mathrm{O}_2$ at STP occupy $=\\left(3 \\times 22.4 \\mathrm{dm}^3\\right)$.\nThus, $245 \\mathrm{~g}$ of potassium chlorate will liberate $67.2 \\mathrm{dm}^3$ of oxygen gas.\n\nLet ' $x$ ' gram of $\\mathrm{KClO}_3$ liberate $22.4 \\mathrm{dm}^3$ of oxygen gas at S.T.P.\n$$\n\\therefore \\quad x=\\frac{245 \\times 22.4}{3 \\times 22.4}=81.67 \\mathrm{~g}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262220279619d9d8a3214", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Calculate amount of methane formed by liberation of $149.6 \\mathrm{~kJ}$ of heat using following equation.\n$$\n\\mathrm{C}_{(\\mathrm{s})}+2 \\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{CH}_{4(\\mathrm{~g})} \\quad \\Delta \\mathrm{H}=-74.8 \\mathrm{~kJ} / \\mathrm{mol}\n$$", "image": null}, "options": [{"id": "VibYX", "text": "$16 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "7UmMa", "text": "$24 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "pkymI", "text": "$32 \\mathrm{~g}$", "image": null, "isCorrect": true}, {"id": "DRibB", "text": "$48 \\mathrm{~g}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the given reaction, $74.8 \\mathrm{~kJ}$ of heat is evolved when 1 mol of methane is formed.\n$$\n\\begin{aligned}\n& 74.8 \\mathrm{~kJ} \\equiv 1 \\mathrm{~mol} \\mathrm{CH}_4=16 \\mathrm{~g} \\mathrm{CH}_4 \\\\\n& 149.6 \\mathrm{~kJ} \\equiv x \\mathrm{~g} \\mathrm{CH}_4 \\\\\n& x=\\frac{149.6 \\times 16}{74.8}=32 \\mathrm{~g}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262210279619d9d8a320c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "What volume of $\\mathrm{CO}_{2(\\mathrm{~g})}$ at STP is obtained by complete combustion of $6 \\mathrm{~g}$ carbon?", "image": null}, "options": [{"id": "JsobJ", "text": "$22.4 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "VoXGp", "text": "$11.2 \\mathrm{dm}^3$", "image": null, "isCorrect": true}, {"id": "mNCLO", "text": "$5.6 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "BumIy", "text": "$2.24 \\mathrm{dm}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\mathrm{C}_{(\\mathrm{g})}+\\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{CO}_{2(\\mathrm{~g})} \\\\ & 1 \\mathrm{~mol} \\mathrm{C} \\equiv 1 \\mathrm{~mol} \\mathrm{CO}_{2(\\mathrm{~g})} \\\\ & 6 \\mathrm{~g} \\mathrm{C}=0.5 \\mathrm{~mol} \\mathrm{C} \\\\ \\therefore \\quad & 0.5 \\mathrm{~mol} \\mathrm{C} \\equiv 0.5 \\mathrm{~mol} \\mathrm{CO}_{2(\\mathrm{~g})} \\\\ & \\text { At STP, } 1 \\mathrm{~mol} \\mathrm{CO}_{2(\\mathrm{~g})}=22.4 \\mathrm{dm}^3 \\\\ \\therefore \\quad & 0.5 \\mathrm{~mol} \\mathrm{CO} 2(\\mathrm{~g})=11.2 \\mathrm{dm}^3\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e670279619d9d8a1425", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "Copper is a divalent metal. The value of its electrochemical equivalent is $3.29 \\times 10^{-4} \\mathrm{~g} .$ Its atomic mass is", "image": null}, "options": [{"id": "9oiGL", "text": "$31.74 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "xYAyl", "text": "$63.5 \\mathrm{~g}$", "image": null, "isCorrect": true}, {"id": "IOfdP", "text": "$126.9 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "Gn4d4", "text": "$15.87 \\mathrm{~g}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Electrochemical equivalent, $Z=\\frac{E}{96500}$ $\\begin{array}{lr}\\text { or } & 3.29 \\times 10^{-4}=\\frac{E}{96500} \\\\ \\therefore \\quad E=31.74\\end{array}$\nAtomic mass $=2 \\times E$ $[\\because$ Cu is divalent.]\n$$\n=2 \\times 31.74=63.49 \\mathrm{~g}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a263460279619d9d8a3db2", "title": "Redox titration", "totalQuestions": 2, "questions": [{"_id": "6a44d3428c30a4553e1be1df", "type": "singleCorrect", "question": {"text": "Identify colour change when NaCl solution is titrated against $\\text{AgNO}_3$ solution using fluorescein indicator.", "image": null}, "options": [{"id": "OmC9P", "label": "A", "text": "Colourless to pale yellow", "isCorrect": false, "image": null}, {"id": "dy7JD", "label": "B", "text": "Reddish pink to pale yellow", "isCorrect": false, "image": null}, {"id": "nUXrL", "label": "C", "text": "Pale yellow to reddish pink", "isCorrect": true, "image": null}, {"id": "tyUAF", "label": "D", "text": "Colourless to reddish pink", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The titration of $\\text{NaCl}$ against $\\text{AgNO}_3$ using fluorescein indicator is an example of Fajan's method (precipitation titration).<br><br>Fluorescein acts as an adsorption indicator. In the aqueous solution, it exists as the fluoresceinate anion, which imparts a pale yellow (or yellowish-green) colour to the solution.<br><br>During the titration, $\\text{AgCl}$ precipitates. Before the equivalence point, the $\\text{AgCl}$ particles adsorb excess $\\text{Cl}^-$ ions, acquiring a negative charge that repels the fluoresceinate anions.<br><br>Just after the equivalence point, the addition of excess $\\text{AgNO}_3$ causes the $\\text{AgCl}$ particles to adsorb $\\text{Ag}^+$ ions, acquiring a positive charge.<br><br>The positively charged precipitate now strongly adsorbs the fluoresceinate anions. This adsorption deforms the electron cloud of the indicator, resulting in a distinct colour change to reddish pink on the surface of the precipitate.<br><br>Thus, the colour change observed at the end point is from pale yellow to reddish pink.<br><br>Answer: Pale yellow to reddish pink", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e790279619d9d8a14b5", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "How many gram-equivalents of $\\mathrm{NaOH}$ are required to neutralise $25 \\mathrm{~cm}^{3}$ of a decinormal $\\mathrm{HCl}$ solution?", "image": null}, "options": [{"id": "eOJT7", "text": "$0.00125$", "image": null, "isCorrect": false}, {"id": "HuhSW", "text": "$0.0025$", "image": null, "isCorrect": true}, {"id": "eEcYe", "text": "$0.0050$", "image": null, "isCorrect": false}, {"id": "wiwVv", "text": "$0.025$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For acid-base reactions, g-equivalent of acid $=$ g-equivalent of base\n$$\n\\begin{aligned}\n(\\mathrm{HCl}) &(\\mathrm{NaOH}) \\\\\n\\therefore \\text { g-equivalent of acid } &=\\left(25 \\times 10^{-3}\\right) \\mathrm{dm}^{3} \\times \\frac{1}{10} \\\\\n=& 25 \\times 10^{-4} \\\\\n\\text { or } &=0.0025\n\\end{aligned}\n$$\n$=\\mathrm{g}$ -equivalent of $\\mathrm{NaOH}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
