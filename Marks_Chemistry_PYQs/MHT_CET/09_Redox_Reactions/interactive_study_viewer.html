": null}, "options": [{"id": "3L8UZ", "label": "A", "text": "$+2$", "isCorrect": false, "image": null}, {"id": "C1CkB", "label": "B", "text": "$+3$", "isCorrect": true, "image": null}, {"id": "fyBTp", "label": "C", "text": "$+4$", "isCorrect": false, "image": null}, {"id": "iTBI6", "label": "D", "text": "$+6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The chemical formula of oxalic acid is $H_2C_2O_4$.<br><br>Let the oxidation number of carbon be $x$.<br><br>The oxidation number of hydrogen is $+1$ and that of oxygen is $-2$.<br><br>The sum of oxidation numbers of all atoms in a neutral molecule is zero.<br><br>$2(+1) + 2(x) + 4(-2) = 0$<br><br>$2 + 2x - 8 = 0$<br><br>$2x - 6 = 0$<br><br>$2x = 6$<br><br>$x = +3$<br><br>The oxidation number of carbon in oxalic acid is $+3$.<br><br>Answer: $+3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32a8c30a4553e1be0db", "type": "singleCorrect", "question": {"text": "What happens in the oxidation number of Mn during working of dry cell.", "image": null}, "options": [{"id": "zUvKv", "label": "A", "text": "Increases by 1", "isCorrect": false, "image": null}, {"id": "Drxgw", "label": "B", "text": "decreases by 1", "isCorrect": true, "image": null}, {"id": "nux2M", "label": "C", "text": "Increases by 2", "isCorrect": false, "image": null}, {"id": "YRGUL", "label": "D", "text": "decreases by 2", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In a dry cell, the reaction at the cathode involves the reduction of manganese dioxide ($MnO_2$).<br><br>The cathode reaction is:<br>$MnO_2 + NH_4^+ + e^- \\rightarrow MnO(OH) + NH_3$<br><br>The oxidation state of Mn in $MnO_2$ is $+4$.<br>The oxidation state of Mn in $MnO(OH)$ is $+3$.<br><br>The oxidation number of Mn changes from $+4$ to $+3$. Thus, the oxidation number of Mn decreases by $1$.<br><br>Answer: decreases by 1", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3438c30a4553e1be1e3", "type": "singleCorrect", "question": {"text": "Identify oxidation number of Sulphur respectively in $\\text{SO}_2$ and $\\text{SO}_4^{2-}$ .", "image": null}, "options": [{"id": "DWVWO", "label": "A", "text": "$+6 , +4$", "isCorrect": false, "image": null}, {"id": "vJ3ya", "label": "B", "text": "$+4, +6$", "isCorrect": true, "image": null}, {"id": "Yvosw", "label": "C", "text": "$+4, +3$", "isCorrect": false, "image": null}, {"id": "kDqdr", "label": "D", "text": "$+3, +4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the oxidation number of Sulphur in $\\text{SO}_2$ be $x$.<br><br>$x + 2(-2) = 0$<br><br>$x = +4$<br><br>Let the oxidation number of Sulphur in $\\text{SO}_4^{2-}$ be $y$.<br><br>$y + 4(-2) = -2$<br><br>$y - 8 = -2$<br><br>$y = +6$<br><br>The oxidation numbers of Sulphur in $\\text{SO}_2$ and $\\text{SO}_4^{2-}$ are $+4$ and $+6$ respectively.<br><br>Answer: $+4, +6$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d58c30a4553e1bdd46", "type": "singleCorrect", "question": {"text": "What is oxidation state of chlorine in chlorous acid?", "image": null}, "options": [{"id": "dgQf2", "label": "A", "text": "$+2$", "isCorrect": false, "image": null}, {"id": "Pdwu5", "label": "B", "text": "$+4$", "isCorrect": false, "image": null}, {"id": "y8ARl", "label": "C", "text": "$+3$", "isCorrect": true, "image": null}, {"id": "hDyhB", "label": "D", "text": "$+7$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The chemical formula of chlorous acid is $HClO_2$.<br><br>Let the oxidation state of chlorine be $x$.<br><br>The oxidation state of hydrogen is $+1$ and that of oxygen is $-2$.<br><br>Since the molecule is neutral, the sum of the oxidation states of all atoms is zero.<br><br>$+1 + x + 2(-2) = 0$<br><br>$1 + x - 4 = 0$<br><br>$x - 3 = 0$<br><br>$x = +3$<br><br>The oxidation state of chlorine in chlorous acid is $+3$.<br><br>Answer: $+3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3348c30a4553e1be146", "type": "singleCorrect", "question": {"text": "What is the oxidation number of oxygen in $\\text{KO}_2$ ?", "image": null}, "options": [{"id": "onynT", "label": "A", "text": "$-2$", "isCorrect": false, "image": null}, {"id": "R9F9J", "label": "B", "text": "$-1/2$", "isCorrect": true, "image": null}, {"id": "IdfV3", "label": "C", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "28gdI", "label": "D", "text": "$+2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the oxidation number of oxygen in $\\text{KO}_2$ be $x$.<br><br>Potassium is an alkali metal, so its oxidation state is always $+1$ in its compounds.<br><br>The sum of oxidation states of all atoms in a neutral molecule is zero.<br><br>$+1 + 2x = 0$<br><br>$2x = -1$<br><br>$x = -1/2$<br><br>The oxidation number of oxygen in $\\text{KO}_2$ is $-1/2$.<br><br>Answer: $-1/2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29a8c30a4553e1bdad4", "type": "singleCorrect", "question": {"text": "What is oxidation state of oxygen in $\\text{OF}_2$ and in $\\text{KO}_2$ respectively?", "image": null}, "options": [{"id": "UymF2", "label": "A", "text": "$+2$ and $+1$", "isCorrect": false, "image": null}, {"id": "Phg2B", "label": "B", "text": "$+2$ and $-1/2$", "isCorrect": true, "image": null}, {"id": "wNC3n", "label": "C", "text": "$+1$ and $-1/2$", "isCorrect": false, "image": null}, {"id": "7pgsh", "label": "D", "text": "$-2$ and $-1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In $\\text{OF}_2$, fluorine is more electronegative than oxygen and always has an oxidation state of $-1$.<br><br>Let the oxidation state of oxygen in $\\text{OF}_2$ be $x$.<br><br>$x + 2(-1) = 0 \\Rightarrow x = +2$<br><br>In $\\text{KO}_2$, potassium is an alkali metal and always has an oxidation state of $+1$.<br><br>Let the oxidation state of oxygen in $\\text{KO}_2$ be $y$.<br><br>$+1 + 2y = 0 \\Rightarrow y = -1/2$<br><br>The oxidation states of oxygen in $\\text{OF}_2$ and $\\text{KO}_2$ are $+2$ and $-1/2$ respectively.<br><br>Answer: $+2$ and $-1/2$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35f8c30a4553e1be308", "type": "singleCorrect", "question": {"text": "Find the oxidation number of Cl in $\\text{ClO}_4^{-1}$", "image": null}, "options": [{"id": "98cKD", "label": "A", "text": "$-9$", "isCorrect": false, "image": null}, {"id": "jZAhM", "label": "B", "text": "$+7$", "isCorrect": true, "image": null}, {"id": "pJ54C", "label": "C", "text": "$-7$", "isCorrect": false, "image": null}, {"id": "0e0TK", "label": "D", "text": "$+9$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the oxidation number of Cl be $x$.<br><br>The oxidation number of oxygen is generally $-2$.<br><br>The sum of oxidation numbers of all atoms in a polyatomic ion is equal to its net charge.<br><br>$x + 4(-2) = -1$<br><br>$x - 8 = -1$<br><br>$x = +7$<br><br>Answer: $+7$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871beebf9280d7f9932dba", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following compounds exhibits maximum oxidation state of carbon?", "image": null}, "options": [{"id": "Nibgi", "text": "$\\mathrm{CHCl}_3$", "image": null, "isCorrect": true}, {"id": "fXd9W", "text": "HCHO", "image": null, "isCorrect": false}, {"id": "uYKgz", "text": "$\\mathrm{CH}_3 \\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "BzIzK", "text": "$\\mathrm{C}_{12} \\mathrm{H}_{22} \\mathrm{O}_{11}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the oxidation state of carbon be $x$.<br><br>For $\\mathrm{HCHO}$:<br>$x + 2(+1) + 1(-2) = 0 \\Rightarrow x = 0$<br><br>For $\\mathrm{CH}_3\\mathrm{OH}$:<br>$x + 4(+1) + 1(-2) = 0 \\Rightarrow x = -2$<br><br>For $\\mathrm{CHCl}_3$:<br>$x + 1(+1) + 3(-1) = 0 \\Rightarrow x = +2$<br><br>For $\\mathrm{C}_{12}\\mathrm{H}_{22}\\mathrm{O}_{11}$:<br>$12x + 22(+1) + 11(-2) = 0 \\Rightarrow x = 0$<br><br>The maximum oxidation state of carbon is $+2$, which is exhibited by $\\mathrm{CHCl}_3$.<br><br>Answer: $\\mathrm{CHCl}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdcbf9280d7f9932d17", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the oxidation number of carbon in methanal?", "image": null}, "options": [{"id": "TmZCV", "text": "-2", "image": null, "isCorrect": false}, {"id": "R6S3P", "text": "+2", "image": null, "isCorrect": false}, {"id": "1Cxlm", "text": "zero", "image": null, "isCorrect": true}, {"id": "cuM8u", "text": "+4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical formula of methanal (formaldehyde) is $HCHO$.<br><br>Let the oxidation number of carbon be $x$.<br><br>The oxidation number of hydrogen is $+1$ and that of oxygen is $-2$.<br><br>The sum of oxidation numbers of all atoms in a neutral molecule is zero.<br><br>$x + 2(+1) + 1(-2) = 0$<br><br>$x + 2 - 2 = 0$<br><br>$x = 0$<br><br>The oxidation number of carbon in methanal is zero.<br><br>Answer: zero", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcfbf9280d7f9932ca3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In the equation,\n$\\mathrm{BiO}_3^{-}+6 \\mathrm{H}^{+}+x ~\\mathrm{e}^{-} \\rightarrow \\mathrm{Bi}^{3+}+3 \\mathrm{H}_2 \\mathrm{O}$\n\nWhat is the value of $x$ ?", "image": null}, "options": [{"id": "L4P68", "text": "2", "image": null, "isCorrect": true}, {"id": "OeWwi", "text": "3", "image": null, "isCorrect": false}, {"id": "QNKFp", "text": "4", "image": null, "isCorrect": false}, {"id": "G2XAX", "text": "6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given half-reaction is:<br><br>$\\mathrm{BiO}_3^{-} + 6 \\mathrm{H}^{+} + x \\mathrm{e}^{-} \\rightarrow \\mathrm{Bi}^{3+} + 3 \\mathrm{H}_2 \\mathrm{O}$<br><br>To find the value of $x$, we balance the total charge on both sides of the equation.<br><br>Total charge on the reactant side $= -1 + 6(+1) + x(-1) = 5 - x$<br><br>Total charge on the product side $= +3 + 3(0) = +3$<br><br>Equating the charges on both sides:<br><br>$5 - x = 3$<br><br>$x = 2$<br><br>Alternatively, the oxidation state of $\\mathrm{Bi}$ in $\\mathrm{BiO}_3^{-}$ is $+5$. It gets reduced to $\\mathrm{Bi}^{3+}$ (oxidation state $+3$). The decrease in oxidation state is $5 - 3 = 2$, which corresponds to the gain of $2$ electrons. Thus, $x = 2$.<br><br>Answer: 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbebf9280d7f9932c0c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is oxidation number of sulphur in $\\mathrm{SO}_3$ ?", "image": null}, "options": [{"id": "1ikRp", "text": "$+3$", "image": null, "isCorrect": false}, {"id": "ij0S9", "text": "$+4$", "image": null, "isCorrect": false}, {"id": "cwkTc", "text": "$+6$", "image": null, "isCorrect": true}, {"id": "ofsju", "text": "$-3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the oxidation number of sulphur in $\\mathrm{SO}_3$ be $x$.<br><br>The oxidation number of oxygen is generally $-2$.<br><br>The sum of oxidation numbers of all atoms in a neutral molecule is zero.<br><br>$x + 3(-2) = 0$<br><br>$x - 6 = 0$<br><br>$x = +6$<br><br>The oxidation number of sulphur in $\\mathrm{SO}_3$ is $+6$.<br><br>Answer: $+6$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bacbf9280d7f9932b75", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the oxidation number of phosphorus in calcium phosphate?", "image": null}, "options": [{"id": "CUKcy", "text": "+3", "image": null, "isCorrect": false}, {"id": "leq3K", "text": "+4", "image": null, "isCorrect": false}, {"id": "yNgAZ", "text": "+5", "image": null, "isCorrect": true}, {"id": "Bqabc", "text": "+6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical formula of calcium phosphate is $Ca_3(PO_4)_2$.<br><br>Let the oxidation number of phosphorus be $x$.<br><br>The oxidation number of calcium (Ca) is $+2$ and that of oxygen (O) is $-2$.<br><br>The sum of the oxidation numbers of all atoms in a neutral compound is zero.<br><br>$3(+2) + 2[x + 4(-2)] = 0$<br><br>$6 + 2(x - 8) = 0$<br><br>$6 + 2x - 16 = 0$<br><br>$2x - 10 = 0$<br><br>$2x = 10$<br><br>$x = +5$<br><br>Alternatively, considering the phosphate ion $PO_4^{3-}$:<br><br>$x + 4(-2) = -3$<br><br>$x - 8 = -3$<br><br>$x = +5$<br><br>Answer: +5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b89bf9280d7f9932a28", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify correct statement for reaction stated below.\n$\\mathrm{Ag}_2 \\mathrm{O}+\\mathrm{H}_2 \\mathrm{O}+2 \\overline{\\mathrm{e}} \\rightarrow 2 \\mathrm{Ag}+2 \\mathrm{OH}^{-}$", "image": null}, "options": [{"id": "uLTqD", "text": "Water is oxidised.", "image": null, "isCorrect": false}, {"id": "8fGXU", "text": "Hydrogen is oxidised.", "image": null, "isCorrect": false}, {"id": "qaATF", "text": "Silver is reduced.", "image": null, "isCorrect": true}, {"id": "hJlbg", "text": "Hydrogen is reduced.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is $\\mathrm{Ag}_2 \\mathrm{O} + \\mathrm{H}_2 \\mathrm{O} + 2 \\mathrm{e}^{-} \\rightarrow 2 \\mathrm{Ag} + 2 \\mathrm{OH}^{-}$.<br><br>The oxidation state of $\\mathrm{Ag}$ in $\\mathrm{Ag}_2 \\mathrm{O}$ is $+1$.<br><br>The oxidation state of $\\mathrm{Ag}$ in elemental $\\mathrm{Ag}$ is $0$.<br><br>Since the oxidation state of $\\mathrm{Ag}$ decreases from $+1$ to $0$, silver undergoes reduction.<br><br>The oxidation states of hydrogen and oxygen remain unchanged ($+1$ and $-2$ respectively).<br><br>Thus, silver is reduced.<br><br>Answer: Silver is reduced.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7abf9280d7f993299d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A compound of Xe and F is found to have atomic ratio $\\mathrm{Xe}: \\mathrm{F}$ as $0.4: 2.4$, Find the oxidation number of Xe ?", "image": null}, "options": [{"id": "Vc7we", "text": "$-4$", "image": null, "isCorrect": false}, {"id": "47dWd", "text": "Zero", "image": null, "isCorrect": false}, {"id": "3O2Nq", "text": "$+4$", "image": null, "isCorrect": false}, {"id": "iq6Qp", "text": "$+6$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given the atomic ratio of $\\mathrm{Xe} : \\mathrm{F}$ is $0.4 : 2.4$.<br><br>Simplifying the ratio by dividing by $0.4$:<br><br>$\\mathrm{Xe} : \\mathrm{F} = \\dfrac{0.4}{0.4} : \\dfrac{2.4}{0.4} = 1 : 6$<br><br>The empirical formula of the compound is $\\mathrm{XeF_6}$.<br><br>Let the oxidation number of $\\mathrm{Xe}$ be $x$.<br><br>Since the oxidation number of fluorine is $-1$:<br><br>$x + 6(-1) = 0$<br><br>$x = +6$<br><br>The oxidation number of $\\mathrm{Xe}$ is $+6$.<br><br>Answer: $+6$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b69bf9280d7f99328fa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the difference in oxidation number of Mn in $\\mathrm{KMnO}_4$ and $\\mathrm{MnO}_2$ ?", "image": null}, "options": [{"id": "ntARy", "text": "$1$", "image": null, "isCorrect": false}, {"id": "NA2Gm", "text": "$3$", "image": null, "isCorrect": true}, {"id": "3J1oD", "text": "$4$", "image": null, "isCorrect": false}, {"id": "VNJjg", "text": "$5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the oxidation number of $\\mathrm{Mn}$ in $\\mathrm{KMnO}_4$ be $x$.<br><br>$+1 + x + 4(-2) = 0$<br><br>$x - 7 = 0 \\Rightarrow x = +7$<br><br>Let the oxidation number of $\\mathrm{Mn}$ in $\\mathrm{MnO}_2$ be $y$.<br><br>$y + 2(-2) = 0$<br><br>$y - 4 = 0 \\Rightarrow y = +4$<br><br>The difference in the oxidation number of $\\mathrm{Mn}$ is $7 - 4 = 3$.<br><br>Answer: $3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5abf9280d7f993287e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the number of electrons transferred considering Mn when $\\mathrm{KMnO}_4$ is converted into $\\mathrm{Mn}_2 \\mathrm{O}_3$ ?", "image": null}, "options": [{"id": "W5M42", "text": "$1$", "image": null, "isCorrect": false}, {"id": "zsIFi", "text": "$3$", "image": null, "isCorrect": false}, {"id": "3WcUQ", "text": "$4$", "image": null, "isCorrect": true}, {"id": "KGDjV", "text": "$5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the oxidation state of $\\mathrm{Mn}$ in $\\mathrm{KMnO}_4$ be $x$.<br><br>$+1 + x + 4(-2) = 0$<br><br>$x = +7$<br><br>Let the oxidation state of $\\mathrm{Mn}$ in $\\mathrm{Mn}_2\\mathrm{O}_3$ be $y$.<br><br>$2y + 3(-2) = 0$<br><br>$y = +3$<br><br>The change in oxidation state of $\\mathrm{Mn}$ is from $+7$ to $+3$.<br><br>Number of electrons transferred per $\\mathrm{Mn}$ atom $= 7 - 3 = 4$.<br><br>Answer: $4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b48bf9280d7f99327d4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which is NOT correct regarding stock notation?", "image": null}, "options": [{"id": "2kgGP", "text": "$\\mathrm{Hg}_2$ (I) $\\mathrm{Cl}_2$ is reduced form of Hg (II) $\\mathrm{Cl}_2$", "image": null, "isCorrect": false}, {"id": "syjCR", "text": "Hg (II) $\\mathrm{Cl}_2$ is oxidised form of $\\mathrm{Hg}_2$ (I) $\\mathrm{Cl}_2$", "image": null, "isCorrect": false}, {"id": "5WSml", "text": "It helps to identify whether species is present in oxidised form or reduced form", "image": null, "isCorrect": false}, {"id": "wol97", "text": "Aurous chloride is written as Au (III) $\\mathrm{Cl}_3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Stock notation is used to specify the oxidation state of a metal in a compound by writing a Roman numeral in parentheses after the metal's symbol or name.<br><br>In $\\mathrm{Hg}_2\\mathrm{Cl}_2$, the oxidation state of Hg is $+1$, so it is written as Hg(I). In $\\mathrm{HgCl}_2$, the oxidation state of Hg is $+2$, so it is written as Hg(II). Thus, Hg(I) is the reduced form of Hg(II), and Hg(II) is the oxidised form of Hg(I).<br><br>Stock notation helps identify whether a species is present in an oxidised or reduced form by explicitly stating the oxidation number.<br><br>Aurous chloride contains gold in the $+1$ oxidation state, so its formula is $\\mathrm{AuCl}$ and its Stock notation is Au(I)Cl. Auric chloride contains gold in the $+3$ oxidation state, so its formula is $\\mathrm{AuCl}_3$ and its Stock notation is Au(III)$\\mathrm{Cl}_3$.<br><br>Therefore, the statement that aurous chloride is written as Au(III)$\\mathrm{Cl}_3$ is incorrect.<br><br>Answer: Aurous chloride is written as Au (III) $\\mathrm{Cl}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b39bf9280d7f9932743", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A compound contains atoms of $\\mathrm{x}, \\mathrm{y}$ and z elements. Oxidation numbers of $x, y$ and $z$ are $+3,+5$ and -2 respectively. Identify the possible formula of this compound?", "image": null}, "options": [{"id": "82BXj", "text": "$\\mathrm{XYZ}_2$", "image": null, "isCorrect": false}, {"id": "0t0Yd", "text": "$Y_2\\left(X Z_3\\right)_2$", "image": null, "isCorrect": false}, {"id": "HFFJJ", "text": "$\\mathrm{X}_3\\left(\\mathrm{YZ}_4\\right)_3$", "image": null, "isCorrect": true}, {"id": "U67sS", "text": "$\\mathrm{X}_3\\left(\\mathrm{Y}_4 \\mathrm{Z}\\right)_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a neutral compound, the algebraic sum of the oxidation numbers of all atoms must be zero.<br><br>Let us calculate the sum of oxidation numbers for each given option by substituting the values $+3$, $+5$, and $-2$ for $\\mathrm{X}$, $\\mathrm{Y}$, and $\\mathrm{Z}$ respectively:<br><br>For $\\mathrm{XYZ}_2$:<br>$(+3) + (+5) + 2(-2) = 8 - 4 = +4 \\neq 0$<br><br>For $\\mathrm{Y}_2(\\mathrm{XZ}_3)_2$:<br>$2(+5) + 2(+3) + 6(-2) = 10 + 6 - 12 = +4 \\neq 0$<br><br>For $\\mathrm{X}_3(\\mathrm{YZ}_4)_3$:<br>$3(+3) + 3(+5) + 12(-2) = 9 + 15 - 24 = 0$<br><br>For $\\mathrm{X}_3(\\mathrm{Y}_4\\mathrm{Z})_2$:<br>$3(+3) + 8(+5) + 2(-2) = 9 + 40 - 4 = +45 \\neq 0$<br><br>Since the sum of oxidation numbers is zero only for $\\mathrm{X}_3(\\mathrm{YZ}_4)_3$, it represents a possible valid formula for the compound.<br><br>Answer: $\\mathrm{X}_3\\left(\\mathrm{YZ}_4\\right)_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b25bf9280d7f99326a8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which metal in following compounds is not present in fractional oxidation state?", "image": null}, "options": [{"id": "rRqvb", "text": "$\\mathrm{Fe}_3 \\mathrm{O}_4$", "image": null, "isCorrect": false}, {"id": "B9myh", "text": "$\\mathrm{Mn}_3 \\mathrm{O}_4$", "image": null, "isCorrect": false}, {"id": "NOKVR", "text": "$\\mathrm{Pb}_3 \\mathrm{O}_4$", "image": null, "isCorrect": false}, {"id": "MqGIs", "text": "$\\mathrm{Na}_2 \\mathrm{~S}_4 \\mathrm{O}_6$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In $\\mathrm{Fe}_3 \\mathrm{O}_4$, the average oxidation state of the metal $\\mathrm{Fe}$ is $+8/3$.<br><br>In $\\mathrm{Mn}_3 \\mathrm{O}_4$, the average oxidation state of the metal $\\mathrm{Mn}$ is $+8/3$.<br><br>In $\\mathrm{Pb}_3 \\mathrm{O}_4$, the average oxidation state of the metal $\\mathrm{Pb}$ is $+8/3$.<br><br>In $\\mathrm{Na}_2 \\mathrm{S}_4 \\mathrm{O}_6$, the metal is $\\mathrm{Na}$ and its oxidation state is $+1$, which is an integer. The non-metal $\\mathrm{S}$ has an average oxidation state of $+2.5$.<br><br>Therefore, the metal in $\\mathrm{Na}_2 \\mathrm{S}_4 \\mathrm{O}_6$ is not present in a fractional oxidation state.<br><br>Answer: $\\mathrm{Na}_2 \\mathrm{~S}_4 \\mathrm{O}_6$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b14bf9280d7f9932619", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is a redox reaction?", "image": null}, "options": [{"id": "8qAbc", "text": "$\\mathrm{NaCl}+\\mathrm{KNO}_3 \\longrightarrow \\mathrm{NaNO}_3+\\mathrm{KCl}$", "image": null, "isCorrect": false}, {"id": "p78IU", "text": "$\\mathrm{Mg}(\\mathrm{OH})_2+2 \\mathrm{NH}_4 \\mathrm{Cl} \\longrightarrow \\mathrm{MgCl}_2+2 \\mathrm{NH}_4 \\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "no3Ea", "text": "$\\mathrm{CaC}_2 \\mathrm{O}_4+2 \\mathrm{HCl} \\longrightarrow \\mathrm{CaCl}_2+\\mathrm{H}_2 \\mathrm{C}_2 \\mathrm{O}_4$", "image": null, "isCorrect": false}, {"id": "BBNkN", "text": "$\\mathrm{Zn}+2 \\mathrm{AgCN} \\longrightarrow 2 \\mathrm{Ag}+\\mathrm{Zn}(\\mathrm{CN})_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "A redox reaction involves a change in the oxidation states of the reacting species.<br><br>In $\\mathrm{NaCl}+\\mathrm{KNO}_3 \\longrightarrow \\mathrm{NaNO}_3+\\mathrm{KCl}$, there is no change in the oxidation state of any element. It is a double displacement reaction.<br><br>In $\\mathrm{Mg}(\\mathrm{OH})_2+2 \\mathrm{NH}_4 \\mathrm{Cl} \\longrightarrow \\mathrm{MgCl}_2+2 \\mathrm{NH}_4 \\mathrm{OH}$, there is no change in the oxidation state of any element.<br><br>In $\\mathrm{CaC}_2 \\mathrm{O}_4+2 \\mathrm{HCl} \\longrightarrow \\mathrm{CaCl}_2+\\mathrm{H}_2 \\mathrm{C}_2 \\mathrm{O}_4$, there is no change in the oxidation state of any element.<br><br>In $\\mathrm{Zn}+2 \\mathrm{AgCN} \\longrightarrow 2 \\mathrm{Ag}+\\mathrm{Zn}(\\mathrm{CN})_2$, the oxidation state of $\\mathrm{Zn}$ changes from $0$ to $+2$ (oxidation) and the oxidation state of $\\mathrm{Ag}$ changes from $+1$ to $0$ (reduction).<br><br>Since both oxidation and reduction take place, it is a redox reaction.<br><br>Answer: $\\mathrm{Zn}+2 \\mathrm{AgCN} \\longrightarrow 2 \\mathrm{Ag}+\\mathrm{Zn}(\\mathrm{CN})_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b01bf9280d7f993258b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What are the respective oxidation states of sulphur atoms numbered 1 to 4 in tetrathionate ion shown below?\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/15eYP3mLDnFX4tgMJ_8IBwNw3MVRmaRsmUij27okCj4.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "4ahlF", "text": "$0,+5,+5,0$", "image": null, "isCorrect": false}, {"id": "7lfTw", "text": "$+5,0,0,+5$", "image": null, "isCorrect": true}, {"id": "1fysM", "text": "$+2,0,0,+2$", "image": null, "isCorrect": false}, {"id": "Gk7sC", "text": "$+2,-1,-1,+2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the tetrathionate ion ($S_4O_6^{2-}$), the structure is given as $^-O-S(=O)_2-S-S-S(=O)_2-O^-$.<br><br>To find the oxidation state of each sulphur atom, we consider the electronegativity of the attached atoms:<br>1. The terminal sulphur atoms ($S^1$ and $S^4$) are each bonded to three highly electronegative oxygen atoms (two via double bonds and one via a single bond) and one sulphur atom. <br>2. Each double bond with oxygen contributes $+2$ to the oxidation state of sulphur, and the single bond with oxygen contributes $+1$. The bond with the adjacent sulphur atom contributes $0$ because both atoms are of the same element.<br>3. Therefore, the oxidation state of $S^1$ and $S^4$ is $+2 + 2 + 1 + 0 = +5$.<br><br>4. The central sulphur atoms ($S^2$ and $S^3$) are bonded only to other sulphur atoms (homonuclear bonds).<br>5. Therefore, the oxidation state of $S^2$ and $S^3$ is $0$.<br><br>The respective oxidation states of sulphur atoms numbered 1 to 4 are $+5, 0, 0, +5$.<br><br>Answer: $+5,0,0,+5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214350aee93fa0796ded2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "What is the oxidation state of phosphorus in phosphate ion?", "image": null}, "options": [{"id": "LPozK", "text": "-5", "image": null, "isCorrect": false}, {"id": "rUw9i", "text": "+3", "image": null, "isCorrect": false}, {"id": "4c2XQ", "text": "$+5$", "image": null, "isCorrect": true}, {"id": "W1Yf9", "text": "+6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical formula of the phosphate ion is $\\text{PO}_4^{3-}$.<br><br>Let the oxidation state of phosphorus be $x$.<br><br>The oxidation state of each oxygen atom is $-2$.<br><br>The sum of the oxidation states of all atoms in a polyatomic ion is equal to the net charge of the ion. Therefore:<br><br>$x + 4(-2) = -3$<br><br>$x - 8 = -3$<br><br>$x = +5$<br><br>The oxidation state of phosphorus in the phosphate ion is $+5$.<br><br>Answer: $+5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214230aee93fa0796de46", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "What is change in oxidation number of nitrogen when $\\mathrm{NO}_3^{-}$is converted to $\\mathrm{NH}_4^{+}$ion?", "image": null}, "options": [{"id": "SFy5y", "text": "+5 to -3", "image": null, "isCorrect": true}, {"id": "Z3u7h", "text": "-3 to +5", "image": null, "isCorrect": false}, {"id": "4TQu8", "text": "+3 to -5", "image": null, "isCorrect": false}, {"id": "4kKwk", "text": "-5 to +3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the oxidation number of nitrogen in $\\mathrm{NO}_3^{-}$ be $x$.<br><br>$x + 3(-2) = -1$<br><br>$x - 6 = -1$<br><br>$x = +5$<br><br>Let the oxidation number of nitrogen in $\\mathrm{NH}_4^{+}$ be $y$.<br><br>$y + 4(+1) = +1$<br><br>$y + 4 = +1$<br><br>$y = -3$<br><br>The change in oxidation number of nitrogen is from $+5$ to $-3$.<br><br>Answer: +5 to -3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f90aee93fa0796dcfe", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Which of the following element in +1 oxidation state has largest ionic radius?", "image": null}, "options": [{"id": "YTZ9M", "text": "Rb", "image": null, "isCorrect": true}, {"id": "DLGv0", "text": "K", "image": null, "isCorrect": false}, {"id": "j2pIL", "text": "Na", "image": null, "isCorrect": false}, {"id": "mtFFG", "text": "Li", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given elements belong to Group 1 (alkali metals) of the periodic table.<br><br>As we move down the group, the number of electron shells increases, which leads to an increase in the ionic radius.<br><br>The order of ionic radii for alkali metal ions in the +1 oxidation state is $Li^{+} < Na^{+} < K^{+} < Rb^{+}$.<br><br>Therefore, among the given options, $Rb^{+}$ has the largest ionic radius.<br><br>Answer: Rb", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e80aee93fa0796dc76", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "What is oxidation number of S in $\\mathrm{SO}_3^{2-}$ ?", "image": null}, "options": [{"id": "XaUMB", "text": "-2", "image": null, "isCorrect": false}, {"id": "jrg5t", "text": "-3", "image": null, "isCorrect": false}, {"id": "WNGpd", "text": "+4", "image": null, "isCorrect": true}, {"id": "vz3Ju", "text": "+6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the oxidation number of S in $\\mathrm{SO}_3^{2-}$ be $x$.<br><br>The oxidation number of oxygen is generally $-2$.<br><br>The sum of the oxidation numbers of all atoms in a polyatomic ion is equal to the net charge on the ion.<br><br>$x + 3(-2) = -2$<br><br>$x - 6 = -2$<br><br>$x = +4$<br><br>Answer: +4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d80aee93fa0796dbf5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "What is the change in oxidation number of $S$ in following reaction?\r\n$\\mathrm{H}_2 \\mathrm{~S}+\\mathrm{NO}_3^{-} \\longrightarrow \\mathrm{H}_2 \\mathrm{O}+\\mathrm{NO}+\\mathrm{S}$\r\n[Note: The question has been modified to get the correct answer.]", "image": null}, "options": [{"id": "GM3ux", "text": "-2 to 0", "image": null, "isCorrect": true}, {"id": "GYakC", "text": "0 to -2", "image": null, "isCorrect": false}, {"id": "NNSuo", "text": "-2 to +2", "image": null, "isCorrect": false}, {"id": "xfVoD", "text": "0 to +2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\mathrm{H}_2\\mathrm{S}$, the oxidation state of hydrogen is $+1$.<br><br>Let the oxidation state of sulphur in $\\mathrm{H}_2\\mathrm{S}$ be $x$.<br><br>$2(+1) + x = 0$<br><br>$x = -2$<br><br>In the product, sulphur is present in its elemental state $\\mathrm{S}$, so its oxidation state is $0$.<br><br>Therefore, the change in oxidation number of $\\mathrm{S}$ is from $-2$ to $0$.<br><br>Answer: -2 to 0", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c50aee93fa0796db5f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "What is the oxidation state of iodine in $\\mathrm{I}_2 \\mathrm{Cl}_6$ ?", "image": null}, "options": [{"id": "UScLb", "text": "+7", "image": null, "isCorrect": false}, {"id": "HKlK0", "text": "-3", "image": null, "isCorrect": false}, {"id": "jzSVO", "text": "+3", "image": null, "isCorrect": true}, {"id": "mLM6o", "text": "-2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given compound is $\\mathrm{I}_2 \\mathrm{Cl}_6$, which is a dimer of iodine trichloride ($\\mathrm{ICl}_3$).<br><br>Chlorine is more electronegative than iodine, so its oxidation state is $-1$.<br><br>Let the oxidation state of iodine be $x$.<br><br>In $\\mathrm{I}_2 \\mathrm{Cl}_6$, the sum of oxidation states of all atoms must be zero:<br><br>$2x + 6(-1) = 0$<br><br>$2x - 6 = 0$<br><br>$2x = 6$<br><br>$x = +3$<br><br>Therefore, the oxidation state of iodine in $\\mathrm{I}_2 \\mathrm{Cl}_6$ is $+3$.<br><br>Answer: +3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c10aee93fa0796db46", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "What is the oxidation number of carbon in $\\mathrm{K}_2 \\mathrm{C}_2 \\mathrm{O}_4$ ?", "image": null}, "options": [{"id": "X8RJp", "text": "-2", "image": null, "isCorrect": false}, {"id": "Y9JS2", "text": "-3", "image": null, "isCorrect": false}, {"id": "K8YRt", "text": "+3", "image": null, "isCorrect": true}, {"id": "rtIZw", "text": "+4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the oxidation number of carbon in $\\mathrm{K}_2\\mathrm{C}_2\\mathrm{O}_4$ be $x$.<br><br>The oxidation number of potassium ($\\mathrm{K}$) is $+1$ and that of oxygen ($\\mathrm{O}$) is $-2$.<br><br>Since the sum of oxidation numbers of all atoms in a neutral molecule is zero, we have:<br><br>$2(+1) + 2(x) + 4(-2) = 0$<br><br>$2 + 2x - 8 = 0$<br><br>$2x - 6 = 0$<br><br>$2x = 6$<br><br>$x = +3$<br><br>The oxidation number of carbon is $+3$.<br><br>Answer: +3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b00aee93fa0796dabf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "What is the highest oxidation state of third row transition elements?", "image": null}, "options": [{"id": "cla3y", "text": "+5", "image": null, "isCorrect": false}, {"id": "hSVpQ", "text": "+6", "image": null, "isCorrect": false}, {"id": "owWPY", "text": "+7", "image": null, "isCorrect": false}, {"id": "MnpcZ", "text": "+8", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The third row transition elements correspond to the 5d series of the periodic table.<br><br>In this series, Osmium (Os) exhibits the highest oxidation state of +8 in compounds such as $OsO_4$.<br><br>Therefore, the highest oxidation state shown by third row transition elements is +8.<br><br>Answer: +8", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213af0aee93fa0796dab9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "What is the oxidation state of central metal ion in $\\left[\\mathrm{Fe}(\\mathrm{CN})_6\\right]^{4-}$ complex?", "image": null}, "options": [{"id": "aoUAB", "text": "+2", "image": null, "isCorrect": true}, {"id": "SgW27", "text": "-6", "image": null, "isCorrect": false}, {"id": "EF4Bw", "text": "-4", "image": null, "isCorrect": false}, {"id": "jAmQP", "text": "+3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the oxidation state of the central metal ion $\\mathrm{Fe}$ be $x$.<br><br>The oxidation state of each cyanide ligand $\\mathrm{CN}^{-}$ is $-1$.<br><br>The overall charge on the complex ion $\\left[\\mathrm{Fe}(\\mathrm{CN})_6\\right]^{4-}$ is $-4$.<br><br>Summing the oxidation states, we get:<br><br>$x + 6(-1) = -4$<br><br>$x - 6 = -4$<br><br>$x = +2$<br><br>The oxidation state of $\\mathrm{Fe}$ in the given complex is $+2$.<br><br>Answer: +2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138a0aee93fa0796d995", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "What is the oxidation state of S in $\\mathrm{SO}_4^{2-}$ ?", "image": null}, "options": [{"id": "uZnYV", "text": "+6", "image": null, "isCorrect": true}, {"id": "AKcbl", "text": "-6", "image": null, "isCorrect": false}, {"id": "IU3ia", "text": "+2", "image": null, "isCorrect": false}, {"id": "48TCG", "text": "+3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the oxidation state of S be $x$.<br><br>The oxidation state of oxygen is generally $-2$.<br><br>The sum of oxidation states of all atoms in a polyatomic ion is equal to the net charge on the ion.<br><br>For $\\mathrm{SO}_4^{2-}$:<br><br>$x + 4(-2) = -2$<br><br>$x - 8 = -2$<br><br>$x = +6$<br><br>Answer: +6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213750aee93fa0796d8f1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which compound from following contains iodine with highest oxidation number ?", "image": null}, "options": [{"id": "CMLJD", "text": "$\\mathrm{KIO}_3$", "image": null, "isCorrect": false}, {"id": "gBv5q", "text": "KI", "image": null, "isCorrect": false}, {"id": "8coXZ", "text": "$\\mathrm{IF}_5$", "image": null, "isCorrect": false}, {"id": "8Dos1", "text": "$\\mathrm{KIO}_4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the oxidation number of iodine be $x$.<br><br>In $\\mathrm{KIO}_3$:<br>$+1 + x + 3(-2) = 0 \\Rightarrow x = +5$<br><br>In $\\mathrm{KI}$:<br>$+1 + x = 0 \\Rightarrow x = -1$<br><br>In $\\mathrm{IF}_5$:<br>$x + 5(-1) = 0 \\Rightarrow x = +5$<br><br>In $\\mathrm{KIO}_4$:<br>$+1 + x + 4(-2) = 0 \\Rightarrow x = +7$<br><br>The highest oxidation number of iodine is $+7$, which is present in $\\mathrm{KIO}_4$.<br><br>Answer: $\\mathrm{KIO}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213650aee93fa0796d873", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "In which of the following compounds chlorine has highest oxidation state?", "image": null}, "options": [{"id": "fdMZx", "text": "KCl", "image": null, "isCorrect": false}, {"id": "aqjAI", "text": "HClO", "image": null, "isCorrect": false}, {"id": "Qz1ag", "text": "$\\quad \\mathrm{HClO}_2$", "image": null, "isCorrect": false}, {"id": "EiCr6", "text": "$\\quad \\mathrm{HClO}_4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the oxidation state of chlorine be $x$.<br><br>In $\\mathrm{KCl}$:<br>$+1 + x = 0 \\Rightarrow x = -1$<br><br>In $\\mathrm{HClO}$:<br>$+1 + x - 2 = 0 \\Rightarrow x = +1$<br><br>In $\\mathrm{HClO}_2$:<br>$+1 + x + 2(-2) = 0 \\Rightarrow x = +3$<br><br>In $\\mathrm{HClO}_4$:<br>$+1 + x + 4(-2) = 0 \\Rightarrow x = +7$<br><br>The highest oxidation state of chlorine is $+7$, which is in $\\mathrm{HClO}_4$.<br><br>Answer: $\\quad \\mathrm{HClO}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213520aee93fa0796d7df", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Identify the element reduced in following reaction.\r\n$\\mathrm{Cr}_2 \\mathrm{O}_7^{2-}+14 \\mathrm{H}^{+}+6 \\mathrm{I}^{-} \\longrightarrow 2 \\mathrm{Cr}^{3+}+3 \\mathrm{H}_2 \\mathrm{O}+3 \\mathrm{I}_2$", "image": null}, "options": [{"id": "X3dq7", "text": "Cr", "image": null, "isCorrect": true}, {"id": "adTl6", "text": "H", "image": null, "isCorrect": false}, {"id": "dDi25", "text": "0", "image": null, "isCorrect": false}, {"id": "2S41O", "text": "I", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\mathrm{Cr}_2\\mathrm{O}_7^{2-}$, the oxidation state of Cr is $+6$.<br><br>In the product $\\mathrm{Cr}^{3+}$, the oxidation state of Cr is $+3$.<br><br>Since the oxidation state of Cr decreases from $+6$ to $+3$, Cr undergoes reduction.<br><br>In $\\mathrm{I}^{-}$, the oxidation state of I is $-1$, and in $\\mathrm{I}_2$, it is $0$. Thus, I undergoes oxidation.<br><br>Therefore, the element reduced is Cr.<br><br>Answer: Cr", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262480279619d9d8a3343", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "What is the change in oxidation number of selenium in the following redox reaction?\n$$\n\\mathrm{SeO}_{3 \\text { (aq) }}^{2-}+\\mathrm{Cl}_{2(\\mathrm{~g})}+2 \\mathrm{OH}^{-} \\longrightarrow \\mathrm{SeO}_{4(\\text { (aq) }}^{2-}+2 \\mathrm{Cl}_{(\\text {(4q) })}^{-}+\\mathrm{H}_2 \\mathrm{O}\n$$", "image": null}, "options": [{"id": "mVQyv", "text": "+2 to -2", "image": null, "isCorrect": false}, {"id": "QVuNt", "text": "-2 to +2", "image": null, "isCorrect": false}, {"id": "qIKrc", "text": "+4 to +6", "image": null, "isCorrect": true}, {"id": "pqfGh", "text": "+3 to +4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\begin{array}{|l|l|}\n\\hline \\multicolumn{1}{|c|}{\\mathrm{SeO}_3^{2-}} & \\multicolumn{1}{c|}{\\mathrm{SeO}_4^{2-}} \\\\\n\\hline \\begin{array}{l}\nx+(-2 \\times 3)=-2 \\\\\nx=+4\n\\end{array} & x+(-2 \\times 4)=-2 \\\\\n& x=+6 \\\\\n\\hline\n\\end{array}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262350279619d9d8a32af", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "What is the change in oxidation number of $\\mathrm{Cr}$ in the following redox reaction?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/JBgMnWOn8lULGNYU8h0gNoBu3VN7gKiVFNOFty1vva0.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "pwfoG", "text": "+2 to +3", "image": null, "isCorrect": false}, {"id": "PJmjn", "text": "-2 to +3", "image": null, "isCorrect": false}, {"id": mes(-2)]=3+\\mathrm{x}-8$\n$\\therefore x=8-3=+5$\n$\\therefore$ Oxidation state of $\\mathrm{As}$ in $\\mathrm{H}_{3} \\mathrm{AsO}_{4}=+5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f4b0279619d9d8a1b52", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "Which among the following pair of elements show highest oxidation state $+7$ in their different compounds? (Atomic no. $\\mathrm{Cr}=24, \\mathrm{~V}=23, \\mathrm{Mn}=25, \\mathrm{Cl}=17, \\mathrm{~S}=16$ )", "image": null}, "options": [{"id": "LQ7Ce", "text": "$\\mathrm{Mn}, \\mathrm{Cl}$", "image": null, "isCorrect": true}, {"id": "c5Yii", "text": "$\\mathrm{Cr}, \\mathrm{Mn}$", "image": null, "isCorrect": false}, {"id": "FdxTD", "text": "$\\mathrm{V}, \\mathrm{Mn}$", "image": null, "isCorrect": false}, {"id": "oqaau", "text": "$\\mathrm{S}, \\mathrm{Cl}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Highest oxidation state of $\\mathrm{Cr}=+6, \\mathrm{Mn}=+7, \\mathrm{Cl}=+7, \\mathrm{~S}=+6, \\mathrm{~V}=+5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAtte
