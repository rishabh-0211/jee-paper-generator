c{1.6}{16} = 0.1$ mol<br><br>Number of molecules of $CH_4$ = $0.1 \\times N_A = 0.1 \\times 6.022 \\times 10^{23} = 6.022 \\times 10^{22}$<br><br>Number of electrons in one molecule of $CH_4$ = $6$ (from C) + $4 \\times 1$ (from H) = $10$<br><br>Total number of electrons = $10 \\times 6.022 \\times 10^{22} = 6.022 \\times 10^{23}$<br><br>Answer: $6.022 \\times 10^{23}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9abf9280d7f9932ac6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Find the number of millimoles for 0.160 g sodium hydroxide.", "image": null}, "options": [{"id": "y9r4R", "text": "$0.08$", "image": null, "isCorrect": false}, {"id": "UinnK", "text": "$0.20$", "image": null, "isCorrect": false}, {"id": "NmPP9", "text": "$4.0$", "image": null, "isCorrect": true}, {"id": "LwweE", "text": "$40.00$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molar mass of $\\text{NaOH} = 23 + 16 + 1 = 40 \\text{ g mol}^{-1}$<br><br>Number of moles of $\\text{NaOH} = \\dfrac{\\text{Mass}}{\\text{Molar mass}} = \\dfrac{0.160}{40} = 0.004 \\text{ mol}$<br><br>Number of millimoles = $0.004 \\times 1000 = 4.0 \\text{ mmol}$<br><br>Answer: $4.0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8dbf9280d7f9932a50", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the number of moles present in $1 \\mathrm{~m}^3$ of any gas at STP?", "image": null}, "options": [{"id": "MNoRY", "text": "32.4", "image": null, "isCorrect": false}, {"id": "KysQr", "text": "54.6", "image": null, "isCorrect": false}, {"id": "2PZfj", "text": "44.6", "image": null, "isCorrect": true}, {"id": "faSSp", "text": "28.2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At Standard Temperature and Pressure (STP), the molar volume of any ideal gas is $22.4 \\mathrm{~L}$.<br><br>Given volume of the gas, $V = 1 \\mathrm{~m}^3 = 1000 \\mathrm{~L}$.<br><br>The number of moles $n$ is given by the ratio of the given volume to the molar volume:<br><br>$n = \\dfrac{V}{V_m}$<br><br>$n = \\dfrac{1000}{22.4}$<br><br>$n = 44.64 \\mathrm{~mol}$<br><br>The number of moles present in $1 \\mathrm{~m}^3$ of the gas at STP is approximately $44.6$.<br><br>Answer: 44.6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7dbf9280d7f99329bb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Find the number of water molecules in 1 mL of water vapours at STP?", "image": null}, "options": [{"id": "cRkW5", "text": "$1.69 \\times 10^{19}$", "image": null, "isCorrect": false}, {"id": "gSeky", "text": "$2.00 \\times 10^{21}$", "image": null, "isCorrect": false}, {"id": "cOIjR", "text": "$1.05 \\times 10^{21}$", "image": null, "isCorrect": false}, {"id": "0td6T", "text": "$2.69 \\times 10^{19}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Volume of water vapour at STP = $1$ mL = $10^{-3}$ L<br><br>Molar volume of an ideal gas at STP = $22.4$ L<br><br>Number of moles of water vapour = $\\dfrac{10^{-3}}{22.4}$<br><br>Number of molecules = Number of moles $\\times N_A$<br><br>Number of molecules = $\\dfrac{10^{-3}}{22.4} \\times 6.022 \\times 10^{23}$<br><br>Number of molecules = $0.2688 \\times 10^{20} = 2.688 \\times 10^{19} \\approx 2.69 \\times 10^{19}$<br><br>Answer: $2.69 \\times 10^{19}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7abf9280d7f993299b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the difference in molar masses of Undecane and Decane?", "image": null}, "options": [{"id": "d0aeI", "text": "$140 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "sbJqn", "text": "$70 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "FqsRm", "text": "$24 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "c3oXF", "text": "$14 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Undecane and decane are successive members of the alkane homologous series.<br><br>The molecular formula of undecane is $C_{11}H_{24}$ and that of decane is $C_{10}H_{22}$.<br><br>Successive members of a homologous series differ by a $-CH_2-$ unit.<br><br>The molar mass of a $-CH_2-$ unit is $12 + 2(1) = 14 \\text{ g mol}^{-1}$.<br><br>Therefore, the difference in their molar masses is $14 \\text{ g mol}^{-1}$.<br><br>Answer: $14 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7abf9280d7f9932997", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A gaseous mixture of $\\mathrm{O}_2$ and $\\mathrm{CH}_4$ are in the ratio $1: 4$ by mass. Find the ratio of their molecules.", "image": null}, "options": [{"id": "FSG9z", "text": "$1: 4$", "image": null, "isCorrect": false}, {"id": "2nggO", "text": "$2: 3$", "image": null, "isCorrect": false}, {"id": "c2UIL", "text": "$1: 8$", "image": null, "isCorrect": true}, {"id": "utSI2", "text": "$3: 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the mass of $\\mathrm{O}_2$ be $w$ and the mass of $\\mathrm{CH}_4$ be $4w$.<br><br>Molar mass of $\\mathrm{O}_2 = 32 \\text{ g/mol}$<br><br>Molar mass of $\\mathrm{CH}_4 = 16 \\text{ g/mol}$<br><br>Number of moles of $\\mathrm{O}_2 = \\dfrac{w}{32}$<br><br>Number of moles of $\\mathrm{CH}_4 = \\dfrac{4w}{16} = \\dfrac{w}{4}$<br><br>The ratio of the number of molecules is equal to the ratio of the number of moles.<br><br>Ratio $= \\dfrac{w}{32} : \\dfrac{w}{4} = 1 : 8$<br><br>Answer: $1: 8$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b69bf9280d7f99328f8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the number of $\\mathrm{Cl}^{-}$ions in 222 g unhydrous calcium chloride ? (At. mass $\\mathrm{Ca}=40, \\mathrm{Cl}=35.5$ )", "image": null}, "options": [{"id": "WbkGh", "text": "$\\mathrm{N}_{\\mathrm{A}}$", "image": null, "isCorrect": false}, {"id": "Axj5l", "text": "$2 \\mathrm{~N}_{\\mathrm{A}}$", "image": null, "isCorrect": false}, {"id": "IGUxd", "text": "$3 \\mathrm{~N}_{\\mathrm{A}}$", "image": null, "isCorrect": false}, {"id": "2dRSa", "text": "$4 \\mathrm{~N}_{\\mathrm{A}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Molar mass of $\\mathrm{CaCl}_{2} = 40 + 2 \\times 35.5 = 111 \\text{ g/mol}$<br><br>Number of moles of $\\mathrm{CaCl}_{2} = \\dfrac{222}{111} = 2 \\text{ moles}$<br><br>One molecule of $\\mathrm{CaCl}_{2}$ dissociates to give 2 $\\mathrm{Cl}^{-}$ ions.<br><br>Number of moles of $\\mathrm{Cl}^{-}$ ions = $2 \\times 2 = 4 \\text{ moles}$<br><br>Number of $\\mathrm{Cl}^{-}$ ions = $4 \\mathrm{N}_{\\mathrm{A}}$<br><br>Answer: $4 \\mathrm{~N}_{\\mathrm{A}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5bbf9280d7f9932888", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the number of $\\mathrm{Ca}^{2+}$ ion in 222 g anhydrous calcium chloride? (At. mass $\\mathrm{Ca}=40, \\mathrm{Cl}=35.5$ )", "image": null}, "options": [{"id": "c0E72", "text": "$\\mathrm{N}_{\\mathrm{A}}$", "image": null, "isCorrect": false}, {"id": "Dr4ZE", "text": "$2 \\mathrm{~N}_{\\mathrm{A}}$", "image": null, "isCorrect": true}, {"id": "XfMdz", "text": "$3 \\mathrm{~N}_{\\mathrm{A}}$", "image": null, "isCorrect": false}, {"id": "DoyYq", "text": "$4 \\mathrm{~N}_{\\mathrm{A}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molar mass of $\\mathrm{CaCl}_2 = 40 + 2 \\times 35.5 = 111 \\text{ g mol}^{-1}$<br><br>Number of moles of $\\mathrm{CaCl}_2 = \\dfrac{222}{111} = 2 \\text{ moles}$<br><br>One molecule of $\\mathrm{CaCl}_2$ contains one $\\mathrm{Ca}^{2+}$ ion.<br><br>Therefore, 2 moles of $\\mathrm{CaCl}_2$ will contain 2 moles of $\\mathrm{Ca}^{2+}$ ions.<br><br>Number of $\\mathrm{Ca}^{2+}$ ions = $2 \\mathrm{N}_{\\mathrm{A}}$<br><br>Answer: $2 \\mathrm{~N}_{\\mathrm{A}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5abf9280d7f9932882", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The mass of $4.48 \\mathrm{dm}^3$ of certain gas is 5.6 g at STP. Assuming ideal behaviour, identify the probable gas from following.", "image": null}, "options": [{"id": "kOXhD", "text": "$\\mathrm{Cl}_2$", "image": null, "isCorrect": false}, {"id": "1d6Hl", "text": "$\\mathrm{O}_2$", "image": null, "isCorrect": false}, {"id": "QS9G8", "text": "$\\mathrm{N}_2$", "image": null, "isCorrect": true}, {"id": "KRval", "text": "$\\mathrm{CH}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At STP, the molar volume of an ideal gas is $22.4 \\text{ dm}^3\\text{/mol}$.<br><br>Number of moles of the gas, $n = \\dfrac{V}{22.4} = \\dfrac{4.48}{22.4} = 0.2 \\text{ mol}$<br><br>Molar mass of the gas, $M = \\dfrac{m}{n} = \\dfrac{5.6}{0.2} = 28 \\text{ g/mol}$<br><br>Checking the molar masses of the given options:<br>Molar mass of $\\mathrm{Cl}_2 = 2 \\times 35.5 = 71 \\text{ g/mol}$<br>Molar mass of $\\mathrm{O}_2 = 2 \\times 16 = 32 \\text{ g/mol}$<br>Molar mass of $\\mathrm{N}_2 = 2 \\times 14 = 28 \\text{ g/mol}$<br>Molar mass of $\\mathrm{CH}_4 = 12 + 4 \\times 1 = 16 \\text{ g/mol}$<br><br>The calculated molar mass matches that of $\\mathrm{N}_2$.<br><br>Answer: $\\mathrm{N}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b47bf9280d7f99327c8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Find the number of moles present in 0.448 L of dihydrogen at STP.", "image": null}, "options": [{"id": "mjMYe", "text": "0.08 mol", "image": null, "isCorrect": false}, {"id": "qAwgZ", "text": "0.06 mol", "image": null, "isCorrect": false}, {"id": "DPpDj", "text": "0.04 mol", "image": null, "isCorrect": false}, {"id": "gjiUU", "text": "0.02 mol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The volume of dihydrogen gas at STP is given as $0.448$ L.<br><br>The molar volume of any ideal gas at STP is $22.4$ L/mol.<br><br>The number of moles of a gas is calculated using the formula:<br><br>$\\text{Number of moles} = \\dfrac{\\text{Volume of gas at STP}}{\\text{Molar volume at STP}}$<br><br>$\\text{Number of moles} = \\dfrac{0.448}{22.4}$<br><br>$\\text{Number of moles} = 0.02$ mol<br><br>Answer: 0.02 mol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b28bf9280d7f99326c4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the mass in grams of 0.25 mol water?", "image": null}, "options": [{"id": "jJrdr", "text": "1.5 g", "image": null, "isCorrect": false}, {"id": "95XvU", "text": "2.5 g", "image": null, "isCorrect": false}, {"id": "O8RnT", "text": "4.5 g", "image": null, "isCorrect": true}, {"id": "UJxII", "text": "3.5 g", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical formula of water is $H_2O$.<br><br>Molar mass of $H_2O = 2(1) + 16 = 18 \\text{ g/mol}$.<br><br>Mass $= \\text{number of moles} \\times \\text{molar mass}$<br><br>Mass $= 0.25 \\times 18 = 4.5 \\text{ g}$.<br><br>Answer: 4.5 g", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b17bf9280d7f9932634", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Find the mass of potassium chlorate required to liberate $5.6 \\mathrm{~dm}^3$ of oxygen gas at STP ? (molar mass of $\\mathrm{KClO}_3=122.5 \\mathrm{~g} / \\mathrm{mol}$ )", "image": null}, "options": [{"id": "STQEx", "text": "$12.25 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "3lbBt", "text": "$15.32 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "ovRg4", "text": "$20.40 \\mathrm{~g}$", "image": null, "isCorrect": true}, {"id": "6ti3u", "text": "49.00 g", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The balanced chemical equation for the decomposition of potassium chlorate is:<br><br>$2\\mathrm{KClO}_3 \\rightarrow 2\\mathrm{KCl} + 3\\mathrm{O}_2$<br><br>From the stoichiometry of the reaction, $2$ moles of $\\mathrm{KClO}_3$ produce $3$ moles of $\\mathrm{O}_2$.<br><br>At STP, the volume of $1$ mole of a gas is approximately $22.4 \\mathrm{~dm}^3$.<br>Volume of $3$ moles of $\\mathrm{O}_2 = 3 \\times 22.4 = 67.2 \\mathrm{~dm}^3$.<br><br>Molar mass of $\\mathrm{KClO}_3 = 122.5 \\mathrm{~g/mol}$.<br>Mass of $2$ moles of $\\mathrm{KClO}_3 = 2 \\times 122.5 = 245 \\mathrm{~g}$.<br><br>This means $67.2 \\mathrm{~dm}^3$ of $\\mathrm{O}_2$ is liberated by $245 \\mathrm{~g}$ of $\\mathrm{KClO}_3$.<br><br>The mass of $\\mathrm{KClO}_3$ required to liberate $5.6 \\mathrm{~dm}^3$ of $\\mathrm{O}_2$ is:<br><br>$m = \\dfrac{245 \\times 5.6}{67.2} = \\dfrac{245}{12} \\approx 20.41 \\mathrm{~g}$<br><br>The closest given option is $20.40 \\mathrm{~g}$.<br><br>Answer: $20.40 \\mathrm{~g}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b01bf9280d7f9932587", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the volume occupied by 0.5 mol of $\\mathrm{CO}_2$ at STP?", "image": null}, "options": [{"id": "6k1FG", "text": "$5.6 \\mathrm{~dm}^3$", "image": null, "isCorrect": false}, {"id": "KLti6", "text": "$11.2 \\mathrm{~dm}^3$", "image": null, "isCorrect": true}, {"id": "N0fYC", "text": "$16.8 \\mathrm{~dm}^3$", "image": null, "isCorrect": false}, {"id": "gVnen", "text": "$22.4 \\mathrm{~dm}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At STP, the molar volume of an ideal gas is $22.4 \\mathrm{~dm}^3 \\mathrm{~mol}^{-1}$.<br><br>Volume occupied by a gas is given by the product of the number of moles and the molar volume.<br><br>Volume of $\\mathrm{CO}_2 = 0.5 \\mathrm{~mol} \\times 22.4 \\mathrm{~dm}^3 \\mathrm{~mol}^{-1}$<br><br>Volume of $\\mathrm{CO}_2 = 11.2 \\mathrm{~dm}^3$<br><br>Answer: $11.2 \\mathrm{~dm}^3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792144b0aee93fa0796df7e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Calculate mass in kg of 2.5 mole ammonia.", "image": null}, "options": [{"id": "7Fzqd", "text": "$5.10 \\times 10^{-2} \\mathrm{~kg}$", "image": null, "isCorrect": false}, {"id": "lVzgF", "text": "$4.25 \\times 10^{-2} \\mathrm{~kg}$.", "image": null, "isCorrect": true}, {"id": "DvS7Q", "text": "$1.72 \\times 10^{-2} \\mathrm{~kg}$", "image": null, "isCorrect": false}, {"id": "3mSbb", "text": "$3.44 \\times 10^{-2} \\mathrm{~kg}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molar mass of ammonia ($\\mathrm{NH_3}$) = $14 + 3(1) = 17 \\mathrm{~g~mol^{-1}}$<br><br>Mass of ammonia = number of moles $\\times$ molar mass<br><br>Mass = $2.5 \\mathrm{~mol} \\times 17 \\mathrm{~g~mol^{-1}} = 42.5 \\mathrm{~g}$<br><br>Mass in kg = $42.5 \\times 10^{-3} \\mathrm{~kg} = 4.25 \\times 10^{-2} \\mathrm{~kg}$<br><br>Answer: $4.25 \\times 10^{-2} \\mathrm{~kg}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214350aee93fa0796ded8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Find the number of moles of sodium atoms in $6.9 \\times 10^{-2} \\mathrm{~kg}\\left(\\right.$ Atomic mass $\\left.=23 \\mathrm{~g} \\mathrm{~mol}^{-1}\\right)$", "image": null}, "options": [{"id": "8RS5S", "text": "1.5", "image": null, "isCorrect": false}, {"id": "kHJcp", "text": "0.3", "image": null, "isCorrect": false}, {"id": "beA7h", "text": "3.0", "image": null, "isCorrect": true}, {"id": "lORyN", "text": "2.3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given mass of sodium $= 6.9 \\times 10^{-2} \\text{ kg}$<br><br>Converting mass into grams:<br>Mass $= 6.9 \\times 10^{-2} \\times 10^3 \\text{ g} = 69 \\text{ g}$<br><br>Atomic mass of sodium $= 23 \\text{ g mol}^{-1}$<br><br>Number of moles $= \\dfrac{\\text{Mass}}{\\text{Atomic mass}}$<br><br>Number of moles $= \\dfrac{69}{23} = 3.0 \\text{ mol}$<br><br>Answer: 3.0", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214110aee93fa0796ddb5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "What is the number of moles of water molecules present in a mole of carnallite?", "image": null}, "options": [{"id": "o2fQq", "text": "6", "image": null, "isCorrect": true}, {"id": "LnjnP", "text": "4", "image": null, "isCorrect": false}, {"id": "LHYXH", "text": "5", "image": null, "isCorrect": false}, {"id": "xWMp5", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical formula of carnallite is $KCl \\cdot MgCl_2 \\cdot 6H_2O$.<br><br>From the formula, it is clear that one mole of carnallite contains $6$ moles of water of crystallization.<br><br>Therefore, the number of moles of water molecules present in one mole of carnallite is $6$.<br><br>Answer: 6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fe0aee93fa0796dd25", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "How many molecules of carbon dioxide are formed when 0.6 g carbon is burnt in air?", "image": null}, "options": [{"id": "iE3GN", "text": "$3.01 \\times 10^{22}$", "image": null, "isCorrect": true}, {"id": "MeELr", "text": "$2.01 \\times 10^{23}$", "image": null, "isCorrect": false}, {"id": "Cvogw", "text": "$6.02 \\times 10^{22}$", "image": null, "isCorrect": false}, {"id": "xjcdT", "text": "$5.02 \\times 10^{23}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The balanced chemical equation for the combustion of carbon is:<br><br>$C + O_{2} \\rightarrow CO_{2}$<br><br>Number of moles of carbon is given by:<br><br>$n = \\dfrac{\\text{Mass}}{\\text{Molar mass}} = \\dfrac{0.6}{12} = 0.05 \\text{ mol}$<br><br>From the stoichiometry of the reaction, $1 \\text{ mol}$ of carbon produces $1 \\text{ mol}$ of carbon dioxide. Therefore, the number of moles of $CO_{2}$ formed is $0.05 \\text{ mol}$.<br><br>The number of molecules of $CO_{2}$ is:<br><br>$N = n \\times N_{A}$<br><br>$N = 0.05 \\times 6.022 \\times 10^{23}$<br><br>$N = 3.011 \\times 10^{22}$<br><br>Answer: $3.01 \\times 10^{22}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c50aee93fa0796db60", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Chlorine exists in two isotopic forms ${ }^{35} \\mathrm{Cl},{ }^{37} \\mathrm{Cl}$. If average atomic mass of chlorine is 35.5 , what is the percentage abundance of these isotopes respectively?", "image": null}, "options": [{"id": "fVy9V", "text": "$25 \\%, 75 \\%$", "image": null, "isCorrect": false}, {"id": "Iazlx", "text": "$75 \\%, 25 \\%$", "image": null, "isCorrect": true}, {"id": "87yxP", "text": "$50 \\%, 50 \\%$", "image": null, "isCorrect": false}, {"id": "0c9CP", "text": "$35 \\%, 65 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the percentage abundance of $^{35}\\text{Cl}$ be $x$.<br><br>The percentage abundance of $^{37}\\text{Cl}$ will be $100 - x$.<br><br>The average atomic mass is given by the formula:<br><br>$\\text{Average atomic mass} = \\dfrac{x \\times 35 + (100 - x) \\times 37}{100}$<br><br>Substituting the given average atomic mass of $35.5$:<br><br>$35.5 = \\dfrac{35x + 3700 - 37x}{100}$<br><br>$3550 = 3700 - 2x$<br><br>$2x = 150$<br><br>$x = 75$<br><br>The percentage abundance of $^{35}\\text{Cl}$ is $75\\%$.<br><br>The percentage abundance of $^{37}\\text{Cl}$ is $100 - 75 = 25\\%$.<br><br>Answer: $75 \\%, 25 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ad0aee93fa0796daa5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Chlorine has two isotopes ${ }^{35} \\mathrm{Cl}$ and ${ }^{37} \\mathrm{Cl}$ with average atomic mass of 35.5 . What is the ratio of their relative abundance respectively?", "image": null}, "options": [{"id": "Hm0OG", "text": "$1: 1$", "image": null, "isCorrect": false}, {"id": "1s5Ev", "text": "$2: 1$", "image": null, "isCorrect": false}, {"id": "sdpeP", "text": "$\\cdot 1: 3$", "image": null, "isCorrect": false}, {"id": "F9OLp", "text": "$3: 1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the relative abundance of $^{35}\\mathrm{Cl}$ be $x$ and that of $^{37}\\mathrm{Cl}$ be $y$.<br><br>The average atomic mass is given by:<br><br>$\\text{Average atomic mass} = \\dfrac{35x + 37y}{x + y}$<br><br>Given that the average atomic mass is $35.5$:<br><br>$\\dfrac{35x + 37y}{x + y} = 35.5$<br><br>$35x + 37y = 35.5x + 35.5y$<br><br>$1.5y = 0.5x$<br><br>$\\dfrac{x}{y} = \\dfrac{1.5}{0.5} = \\dfrac{3}{1}$<br><br>The ratio of their relative abundance is $3:1$.<br><br>Answer: $3: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139a0aee93fa0796da11", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "What is the volume occupied by 1 molecule of water, if its density is $1 \\mathrm{~g} \\mathrm{~cm}^{-3}$ ?", "image": null}, "options": [{"id": "yJEp5", "text": "$9.0 \\times 10^{-23} \\mathrm{~cm}^3$", "image": null, "isCorrect": false}, {"id": "dXuyf", "text": "$\\quad 2.98 \\times 10^{-23} \\mathrm{~cm}^3$", "image": null, "isCorrect": true}, {"id": "y4R96", "text": "$6.023 \\times 10^{-23} \\mathrm{~cm}^3$", "image": null, "isCorrect": false}, {"id": "b35iw", "text": "$5.50 \\times 10^{-23} \\mathrm{~cm}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molar mass of water $= 18 \\text{ g mol}^{-1}$<br><br>Density of water $= 1 \\text{ g cm}^{-3}$<br><br>Volume of $1 \\text{ mole}$ of water $= \\dfrac{18 \\text{ g}}{1 \\text{ g cm}^{-3}} = 18 \\text{ cm}^3$<br><br>Number of molecules in $1 \\text{ mole}$ of water $= 6.022 \\times 10^{23}$<br><br>Volume occupied by $1 \\text{ molecule}$ of water $= \\dfrac{18}{6.022 \\times 10^{23}} \\text{ cm}^3$<br><br>$= 2.989 \\times 10^{-23} \\text{ cm}^3 \\approx 2.98 \\times 10^{-23} \\text{ cm}^3$<br><br>Answer: $\\quad 2.98 \\times 10^{-23} \\mathrm{~cm}^3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213890aee93fa0796d98b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "What is the number of moles of nitrogen atoms present in one mole cytosine?", "image": null}, "options": [{"id": "GOIOZ", "text": "5", "image": null, "isCorrect": false}, {"id": "DjSLr", "text": "4", "image": null, "isCorrect": false}, {"id": "Oqd3n", "text": "3", "image": null, "isCorrect": true}, {"id": "WpPfY", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical formula of cytosine is $C_4H_5N_3O$.<br><br>The structure of cytosine consists of a pyrimidine ring, which contains two nitrogen atoms, and an exocyclic amino group, which contains one nitrogen atom.<br><br>Thus, there are $3$ nitrogen atoms present in one molecule of cytosine.<br><br>Therefore, one mole of cytosine contains $3$ moles of nitrogen atoms.<br><br>Answer: 3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213870aee93fa0796d97f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Calculate number of moles present in $9.10 \\times 10^{-2} \\mathrm{~kg}$ of water.", "image": null}, "options": [{"id": "w2y23", "text": "0.9", "image": null, "isCorrect": false}, {"id": "DrYXA", "text": "1.8", "image": null, "isCorrect": false}, {"id": "TCjIp", "text": "3.0", "image": null, "isCorrect": false}, {"id": "XaKaq", "text": "5.0", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Mass of water $= 9.10 \\times 10^{-2} \\text{ kg} = 91 \\text{ g}$<br><br>Molar mass of water ($\\text{H}_2\\text{O}$) $= 18 \\text{ g mol}^{-1}$<br><br>Number of moles $= \\dfrac{\\text{Mass}}{\\text{Molar mass}} = \\dfrac{91}{18} \\approx 5.05 \\text{ moles}$<br><br>The closest value among the given options is $5.0$.<br><br>Answer: 5.0", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213860aee93fa0796d976", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Calculate the molar mass of solute when 4 g of it dissolved in $1 \\mathrm{dm}^3$. solvent has osmotic pressure 2 atm at $300 \\mathrm{~K} .\\left[\\mathrm{R}=0 . \\hat{0} 82 \\mathrm{dm}^3 \\mathrm{~atm} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right]$", "image": null}, "options": [{"id": "a45oO", "text": "$49.2 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "Rb6nd", "text": "$44.5 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "5p9Dx", "text": "$54.2 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "IIRJn", "text": "$56.4 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Mass of solute, $w = 4 \\text{ g}$<br>Volume of solution, $V = 1 \\text{ dm}^3$<br>Osmotic pressure, $\\pi = 2 \\text{ atm}$<br>Temperature, $T = 300 \\text{ K}$<br>Gas constant, $R = 0.082 \\text{ dm}^3 \\text{ atm K}^{-1} \\text{ mol}^{-1}$<br><br>Using the formula for osmotic pressure:<br>$\\pi = C R T = \\dfrac{w R T}{M V}$<br><br>Rearranging for molar mass $M$:<br>$M = \\dfrac{w R T}{\\pi V}$<br><br>Substituting the given values:<br>$M = \\dfrac{4 \\times 0.082 \\times 300}{2 \\times 1}$<br><br>$M = \\dfrac{4 \\times 24.6}{2}$<br><br>$M = 2 \\times 24.6 = 49.2 \\text{ g mol}^{-1}$<br><br>Answer: $49.2 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133d0aee93fa0796d739", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "How many moles of carbon atoms are present in 3.6 kg of carbon?", "image": null}, "options": [{"id": "A1T9l", "text": "$3.0 \\times 10^2$ mole", "image": null, "isCorrect": true}, {"id": "I6eBI", "text": "$1.8 \\times 10^2$ mole", "image": null, "isCorrect": false}, {"id": "wPtWK", "text": "$2.4 \\times 10^2$ mole", "image": null, "isCorrect": false}, {"id": "9aiiK", "text": "$4.8 \\times 10^2$ mole", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Mass of carbon, $m = 3.6 \\text{ kg} = 3600 \\text{ g}$<br><br>Molar mass of carbon, $M = 12 \\text{ g/mol}$<br><br>Number of moles, $n = \\dfrac{m}{M}$<br><br>$n = \\dfrac{3600}{12} = 300 \\text{ moles}$<br><br>$n = 3.0 \\times 10^2 \\text{ mole}$<br><br>Answer: $3.0 \\times 10^2$ mole", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792132b0aee93fa0796d6b0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "What is the mass in kg of 5 mole of acetic acid (mol. mass $\\left.=60 \\mathrm{~g} \\mathrm{~mol}^{-1}\\right)$ ?", "image": null}, "options": [{"id": "8RzGB", "text": "0.3 kg", "image": null, "isCorrect": true}, {"id": "mk3Tg", "text": "3.0 kg", "image": null, "isCorrect": false}, {"id": "lTvhs", "text": "30 kg", "image": null, "isCorrect": false}, {"id": "akvtT", "text": "300 kg", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The molar mass of acetic acid is given as $60 \\text{ g mol}^{-1}$.<br><br>Mass of acetic acid in grams = number of moles $\\times$ molar mass<br><br>Mass = $5 \\text{ mol} \\times 60 \\text{ g mol}^{-1} = 300 \\text{ g}$<br><br>To convert the mass into kilograms, divide by $1000$:<br><br>Mass in kg = $\\dfrac{300}{1000} \\text{ kg} = 0.3 \\text{ kg}$<br><br>Answer: 0.3 kg", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262340279619d9d8a32a6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "What is the number of moles of donor atoms in n mole of $\\mathrm{NO}_2^{-}$?", "image": null}, "options": [{"id": "3COW8", "text": "$3 \\mathrm{n}$", "image": null, "isCorrect": false}, {"id": "sxKQl", "text": "$0$", "image": null, "isCorrect": false}, {"id": "aMBJW", "text": "$2 \\mathrm{n}$", "image": null, "isCorrect": true}, {"id": "06yKo", "text": "$\\mathrm{n}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The ligand $\\mathrm{NO}_2^{-}$links to metal ion through nitrogen or oxygen. Hence, there are two donor atoms per molecule and $2 \\mathrm{n}$ moles donor atoms per n mole.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262110279619d9d8a3187", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "Which from following substances consists of total 1 mole atoms in it? (Molar mass of $\\left.\\mathrm{NH}_3=17, \\mathrm{H}_2 \\mathrm{O}=18, \\mathr : false}, {"id": "uc4G8", "text": "$\\mathrm{n}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/WVC1loaAeUpc9-dqnp2B2IjLPQeijCpyAK0xUglYYH4.original.fullsize.png\"><br>\n1 molecule of isopentane has 1 secondary carbon atom.\n$\\therefore \\quad 1 \\mathrm{~mol}$ isopentane $=1 \\mathrm{~mol}$ secondary carbon atoms\n$\\therefore \\quad \\mathrm{n}$ mol isopentane $=\\mathrm{n}$ mol secondary carbon atoms", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e90279619d9d8a3050", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "Calculate the number of atoms present in unit cell of an element having molar mass $190 \\mathrm{~g} \\mathrm{~mol}^{-1}$ and density $20 \\mathrm{~g} \\mathrm{~cm}^{-3}$.\n$\\left[\\mathrm{a}^3 \\cdot \\mathrm{N}_{\\mathrm{A}}=38 \\mathrm{~cm}^3 \\mathrm{~mol}^{-1}\\right]$", "image": null}, "options": [{"id": "43g5Y", "text": "$1$", "image": null, "isCorrect": false}, {"id": "y8KLJ", "text": "$2$", "image": null, "isCorrect": false}, {"id": "mLmt9", "text": "$6$", "image": null, "isCorrect": false}, {"id": "WiOzn", "text": "$4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Density $(\\rho)=\\frac{M \\mathrm{n}}{\\mathrm{a}^3 \\mathrm{~N}_{\\mathrm{A}}}$\n$\\begin{aligned}\n& 20=\\frac{190 \\times \\mathrm{n}}{38} \\\\\n& \\mathrm{n}=\\frac{20 \\times 38}{190}=4\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e70279619d9d8a303f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "How many moles of nitrogen atoms are present in $8 \\mathrm{~g}$ of ammonium nitrate?", "image": null}, "options": [{"id": "GCIPF", "text": "$0.1 \\mathrm{~mol}$", "image": null, "isCorrect": false}, {"id": "gZbMc", "text": "$0.2 \\mathrm{~mol}$", "image": null, "isCorrect": true}, {"id": "ynKN5", "text": "$0.4 \\mathrm{~mol}$", "image": null, "isCorrect": false}, {"id": "oZOmH", "text": "$0.8 \\mathrm{~mol}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Chemical formula of ammonium nitrate is\n$\\begin{array}{ll} \n& \\mathrm{NH}_4 \\mathrm{NO}_3 . \\\\\n& 1 \\mathrm{~mol} \\mathrm{NH}_4 \\mathrm{NO}_3 \\equiv 2 \\mathrm{~mol} \\mathrm{~N} \\text {-atoms } \\\\\n\\therefore \\quad & 80 \\mathrm{~g} \\mathrm{NH}_4 \\mathrm{NO}_3^{-}=2 \\mathrm{~mol} \\mathrm{~N} \\text {-atoms } \\\\\n\\therefore \\quad & 8 \\mathrm{~g} \\mathrm{NH}_4 \\mathrm{NO}_3=0.2 \\mathrm{~mol} \\mathrm{~N} \\text {-atoms }\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14 le": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261af0279619d9d8a2e83", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Identify number of moles of donor atoms in $2 \\mathrm{n}$ mole of $\\mathrm{SCN}^{-}$.", "image": null}, "options": [{"id": "oOh5k", "text": "3n", "image": null, "isCorrect": false}, {"id": "UPkXS", "text": "6n", "image": null, "isCorrect": false}, {"id": "AlRSb", "text": "4n", "image": null, "isCorrect": true}, {"id": "dCg6E", "text": "n", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{SCN}^{-}$has two donor atoms nitrogen and sulfur either of which links to metal atom/ion when in forms a coordinate bond. Therefore, 1 mole of $\\mathrm{SCN}^{-}$will have 2 moles of donor atoms.\nHence, $2 \\mathrm{n}$ moles of $\\mathrm{SCN}^{-}$will have $4 \\mathrm{n}$ moles of donor atoms.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a00279619d9d8a2e0e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "What is the number of $\\mathrm{CO}_2$ molecules in 45.42 litre at STP? (Consider "}], "question": {"text": "Which among the following elements has highest number of atoms in $1 \\mathrm{~g}$ each ? (at. no. $\\mathrm{Au}=197, \\mathrm{Na}=23, \\mathrm{Cu}=63 \\cdot 5, \\mathrm{Fe}=56$ )", "image": null}, "options": [{"id": "YPoVb", "text": "$\\mathrm{Cu}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}, {"id": "Qw5CU", "text": "$\\mathrm{Na}_{(\\mathrm{s})}$", "image": null, "isCorrect": true}, {"id": "fjOHW", "text": "$\\mathrm{Au}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}, {"id": "IbB09", "text": "$\\mathrm{Fe}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "i. $1 \\mathrm{~g} \\mathrm{Fe}=\\frac{1}{56} \\mathrm{~mol}=\\frac{1}{56} \\times 6.022 \\times 10^{23}$ atoms of $\\mathrm{Fe}$\nii. $\\lg \\mathrm{Au}=\\frac{1}{197} \\mathrm{~mol}=\\frac{1}{197} \\times 6.022 \\times 10^{23}$ atoms of $\\mathrm{Au}$\niii. $1 \\mathrm{~g} \\mathrm{Na}=\\frac{1}{23} \\mathrm{~mol}=\\frac{1}{23} \\times 6.022 \\times 10^{23}$ atoms of $\\mathrm{Na}$\niv. $\\lg \\mathrm{Cu}=\\frac{1}{63.5} \\mathrm{~mol}=\\frac{1}{63.5} \\times 6.022 \\times 10^{23}$ atoms of $\\mathrm{Cu}$\nHence, $1 \\mathrm{~g}$ of Na has highest number of atoms.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f940279619d9d8a1da1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "How many moles of ethene are ongrightarrow \\mathrm{CO}_{2}+2 \\mathrm{H}_{2} \\mathrm{O}$\n1 mole of methane required $=2 \\times 22.4 \\mathrm{dm}^{3}$ of $\\mathrm{O}_{2}$\n$\\therefore \\quad 0.25$ mole of methane required $=2 \\times 22.4 \\times 0.25=11.2 \\mathrm{dm}^{3}$ of $\\mathrm{O}_{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f5d0279619d9d8a1be0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "What is the number of moles and total number of atoms respectively present in $5 \\cdot 6 \\mathrm{~cm}^{3}$ of ammonia gas at STP?", "image": null}, "options": [{"id": "wsuGU", "text": "$2 \\cdot 50 \\times 10^{-3} \\mathrm{~mol}$ and $1 \\cdot 5 \\times 10^{20}$ atoms", "image": null, "isCorrect": false}, {"id": "TUzOy", "text": "$1.505 \\mathrm{~mol}$ and $6.022 \\times 10^{20}$ atoms", "image": null, "isCorrect": false}, {"id": "CLenj", "text": "$2 \\cdot 05 \\mathrm{~mol}$ and $1 \\cdot 50 \\times 10^{20}$ atoms", "image": null, "isCorrect": false}, {"id": "0CSiX", "text": "$2 \\cdot 50 \\times 10^{-4} \\mathrm{~mol}$ and $6 \\cdot 022 \\times 10^{20}$ atoms", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Vol. of $\\mathrm{NH}_{3}$ gas at $\\mathrm{STP}=5.6 \\mathrm{~cm}^{3}=5.6 \\times 10^{-3} \\mathrm{dm}^{3}$\nNow $22.4 \\mathrm{dm}^{3}$ of $\\mathrm{NH}_{3}=1$ mole of $\\mathrm{NH}_{3}$ at $\\mathrm{STP}$\n$\\therefore 5.6 \\times 10^{-3} \\mathrm{dm}^{3}$ of $\\mathrm{NH}_{3}=\\frac{5.6 \\times 10^{-3}}{22.4}=2.5 \\times 10^{-4} \\mathrm{~mol}$ of $\\mathrm{NH}_{3}$\nNow, No. of atoms $=2.5 \\times 10^{-4} \\times 6.022 \\times 10^{21} \\times 4=6.022 \\times 10^{20}$ atoms", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f380279619d9d8a1ab8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "Which gas among the following contains maximum number of molecules at STP? (Molar masses in $\\mathrm{g} \\mathrm{mol}^{-1} \\mathrm{CO}_{2}=44, \\mathrm{Ar}=39 \\cdot 9, \\mathrm{CH}_{4}=16, \\mathrm{O}_{2}=32$)", "image": null}, "options": [{"id": "Q2kOc", "text": "$24 \\cdot 0 \\mathrm{~g}$ of $\\mathrm{O}_{2}$", "image": null, "isCorrect": false}, {"id": "qFMPr", "text": "$16 \\cdot 0 \\mathrm{~g}$ of $\\mathrm{CH}_{4}$", "image": null, "isCorrect": true}, {"id": "n1p7v", "text": "$13 \\cdot 3 \\mathrm{~g}$ of $\\mathrm{Ar}$", "image": null, "isCorrect": false}, {"id": "gdP9r", "text": "$11 \\mathrm{~g}$ of $\\mathrm{CO}_{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "i. $\\mathrm{n}_{\\mathrm{Ar}}=\\frac{13.3}{39.9}=0.33 \\mathrm{~mol}$\nii. $\\mathrm{n}_{\\mathrm{O}_{2}}=\\frac{24}{32}=0.75 \\mathrm{~mol}$\niii. $\\mathrm{n}_{\\mathrm{CO}_{2}}=\\frac{11}{44}=0.25 \\mathrm{~mol}$\niv. $n_{\\mathrm{CH}}=\\frac{16}{16}=1 \\mathrm{~mol}$\n$\\therefore ": "In the reaction\n$2 \\mathrm{KClO}_{3(\\mathrm{~s})} \\longrightarrow 2 \\mathrm{KCl}_{(\\mathrm{s})}+3 \\mathrm{O}_{2(\\mathrm{~g})} \\Delta \\mathrm{H}^{\\circ}=-78 \\mathrm{~kJ} .$ If $33 \\cdot 6 \\mathrm{~L}$ of oxygen gas is liberated at S.T.P.\nWhat is the mass of $\\mathrm{KCl}_{(s)}$ produced $?$ (at. mass $\\mathrm{K}=39, \\mathrm{Cl}=35 \\cdot 5 \\mathrm{~g} \\mathrm{~mol}^{-1}$ )", "image": null}, "options": [{"id": "XwrLf", "text": "$48 \\cdot 0 \\mathrm{~g}$", "image": null, "isCorrect": true}, {"id": "3pq62", "text": "$7.45 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "XiOcQ", "text": "$24 \\cdot 0 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "s252k", "text": "$74.5 \\mathrm{~g}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} 2 \\mathrm{KClO}_{3(s)} \\longrightarrow & 2 \\mathrm{KCl}_{(s)}+\\quad 3 \\mathrm{O}_{2(s)} \\\\ & 2 \\times 74.5 \\mathrm{~g} \\quad 3 \\times 22.4 \\mathrm{~L} \\\\ &=149 \\mathrm{~g} \\quad=67.2 \\mathrm{~L} \\end{aligned}$\nNow, $67.2 \\mathrm{~L}$ of $\\mathrm{O}_{2}=149 \\mathrm{~g}$ of $\\mathrm{KCl}$ at $\\mathrm{STP}$\n$\\quad 33.6 \\mathrm{~L}$ of $\\mathrm{O}_{2}=\\mathrm{x} \\mathrm{g}$ of $\\mathrm{KCl}$\n$\\therefore x=\\frac{149 \\times 33.6}{67.2}=74.5 \\mathrm{~g}$ of $\\mathrm{KCl}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f0d0279619d9d8a1961", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7b0279619d9d8a14c5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "$1 \\mathrm{u}(\\mathrm{amu})$ is equal to", "image": null}, "options": [{"id": "6lftl", "text": "$1.492 \\times 10^{-10} \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "Bs0K9", "text": "$1.492 \\times 10^{-7} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "50J6S", "text": "$1.492 \\times 10^{-13} \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "pcWxv", "text": "$6.023 \\times 10^{23} \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\quad 1 \\mathrm{u}=1.66 \\times 10^{-24} \\mathrm{~g}$\n$=1.66 \\times 10^{-27} \\mathrm{~kg}$\n$$\n=1.66 \\times 10^{-27} \\times\\left(3 \\times 10^{8}\\right)^{2} \\mathrm{~kg} \\mathrm{~m}^{2} \\mathrm{~s}^{-2}\\left(\\because E=m c^{2}\\right)\n$$\n$=1.494 \\times 10^{-10} \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263450279619d9d8a3dad", "title": "Quantitative measures in chemical equations", "totalQuestions": 25, "questions": [{"_id": "6a44d2ff8c30a4553e1bdf10", "type": "singleCorrect", "question": {"text": "What is the percentage atom economy when formula weight of product is $65$ u and the sum of formula weight of reactant is $130$ u?", "image": null}, "options": [{"id": "7XhlZ", "label": "A", "text": "$65\\%$", "isCorrect": false, "image": null}, {"id": "hR6Ta", "label": "B", "text": "$70\\%$", "isCorrect": false, "image": null}, {"id": "sjxAy", "label": "C", "text": "$40\\%$", "isCorrect": false, "image": null}, {"id": "1OGtV", "label": "D", "text": "$50\\%$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The percentage atom economy is calculated using the formula:<br><br>$\\text{Percentage atom economy} = \\dfrac{\\text{Formula weight of desired product}}{\\text{Sum of formula weights of all reactants}} \\times 100$<br><br>Substituting the given values:<br><br>$\\text{Percentage atom economy} = \\dfrac{65}{130} \\times 100 = 50\\%$<br><br>Answer: $50\\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e08c30a4553e1bddbf", "type": "singleCorrect", "question": {"text": "What is number of hydrogen molecules needed to synthesize 3.4 g of ammonia by reaction with nitrogen?", "image": null}, "options": [{"id": "WmQll", "label": "A", "text": "$6.022 \\times 10^{23}$", "isCorrect": false, "image": null}, {"id": "TMQ2K", "label": "B", "text": "$1.2044 \\times 10^{23}$", "isCorrect": false, "image": null}, {"id": "hKD7Q", "label": "C", "text": "$1.8066 \\times 10^{23}$", "isCorrect": true, "image": null}, {"id": "EsWV9", "label": "D", "text": "$1.8044 \\times 10^{24}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The balanced chemical equation for the synthesis of ammonia is:<br><br>$N_2 + 3H_2 \\rightarrow 2NH_3$<br><br>Molar mass of $NH_3 = 14 + 3 \\times 1 = 17 \\text{ g/mol}$<br><br>Moles of $NH_3$ to be synthesized $= \\dfrac{3.4}{17} = 0.2 \\text{ mol}$<br><br>From the balanced equation, $2 \\text{ moles}$ of $NH_3$ require $3 \\text{ moles}$ of $H_2$.<br><br>Moles of $H_2$ required $= \\dfrac{3}{2} \\times 0.2 = 0.3 \\text{ mol}$<br><br>Number of $H_2$ molecules $= 0.3 \\times 6.022 \\times 10^{23} = 1.8066 \\times 10^{23}$<br><br>Answer: $1.8066 \\times 10^{23}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3188c30a4553e1be017", "type": "singleCorrect", "question": {"text": "What is the approximate mass of the precipitate formed when $50$ mL of $16.9\\%$ solution of $\\text{AgNO}_3$ is mixed with $50$ mL of $7.45\\%$ KCl solution? (Molar mass of $\\text{AgNO}_3 = 169$ g/mol, KCl $= 74.5$ g/mol, AgCl $= 143.3$ g/mol)", "image": null}, "options": [{"id": "qjX4d", "label": "A", "text": "$3.5$ g", "isCorrect": false, "image": null}, {"id": "xk4fZ", "label": "B", "text": "$7$ g", "isCorrect": true, "image": null}, {"id": "o1uqN", "label": "C", "text": "$14$ g", "isCorrect": false, "image": null}, {"id": "2bPmo", "label": "D", "text": "$28$ g", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Mass of $\\text{AgNO}_3$ in $50$ mL of $16.9\\%$ (w/v) solution $= \\dfrac{16.9}{100} \\times 50 = 8.45$ g<br><br>Moles of $\\text{AgNO}_3 = \\dfrac{8.45}{169} = 0.05$ mol<br><br>Mass of KCl in $50$ mL of $7.45\\%$ (w/v) solution $= \\dfrac{7.45}{100} \\times 50 = 3.725$ g<br><br>Moles of KCl $= \\dfrac{3.725}{74.5} = 0.05$ mol<br><br>The balanced chemical equation is:<br>$\\text{AgNO}_3 + \\text{KCl} \\rightarrow \\text{AgCl} \\downarrow + \\text{KNO}_3$<br><br>Since $1$ mole of $\\text{AgNO}_3$ reacts with $1$ mole of KCl to give $1$ mole of AgCl, $0.05$ mol of $\\text{AgNO}_3$ will react completely with $0.05$ mol of KCl to form $0.05$ mol of AgCl.<br><br>Mass of AgCl precipitate $= 0.05 \\times 143.3 = 7.165$ g $\\approx 7$ g<br><br>Answer: $7$ g", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871babbf9280d7f9932b6e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The vapour density of a certain gas is 16. What is the volume occupied by 8 g of gas at STP assuming ideal behaviour?", "image": null}, "options": [{"id": "ClB2O", "text": "$2.80 \\mathrm{~dm}^3$", "image": null, "isCorrect": false}, {"id": "4GHTz", "text": "$5.6 \\mathrm{~dm}^3$", "image": null, "isCorrect": true}, {"id": "WxUwd", "text": "$11.2 \\mathrm{~dm}^3$", "image": null, "isCorrect": false}, {"id": "Sv6Tb", "text": "$2.24 \\mathrm{~dm}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molar mass of the gas $= 2 \\times \\text{Vapour density}$<br><br>Molar mass $= 2 \\times 16 = 32 \\text{ g/mol}$<br><br>Number of moles of the gas $= \\dfrac{\\text{Mass}}{\\text{Molar mass}} = \\dfrac{8}{32} = 0.25 \\text{ mol}$<br><br>Volume of $1 \\text{ mole}$ of an ideal gas at STP $= 22.4 \\text{ dm}^3$<br><br>Volume occupied by $0.25 \\text{ mol}$ of the gas $= 0.25 \\times 22.4 = 5.6 \\text{ dm}^3$<br><br>Answer: $5.6 \\mathrm{~dm}^3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6abf9280d7f99328ff", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is vapour density of $\\mathrm{O}_2$ gas?", "image": null}, "options": [{"id": "lm95K", "text": "$8$", "image": null, "isCorrect": false}, {"id": "0zInE", "text": "$16$", "image": null, "isCorrect": true}, {"id": "HCWgJ", "text": "$32$", "image": null, "isCorrect": false}, {"id": "jttEh", "text": "$22.4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Vapour density of a gas is defined as the ratio of its molar mass to the molar mass of hydrogen gas.<br><br>$\\text{Vapour density} = \\dfrac{\\text{Molar mass of gas}}{2}$<br><br>For $\\mathrm{O}_2$ gas, the molar mass is $32 \\text{ g mol}^{-1}$.<br><br>$\\text{Vapour density of } \\mathrm{O}_2 = \\dfrac{32}{2} = 16$<br><br>Answer: $16$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b03bf9280d7f993259f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In a chemical reaction, sum of formula weight of all reactants is 274 u and atom economy is $50 \\%$, calculate formula weight of desired product?", "image": null}, "options": [{"id": "VPxCt", "text": "137 u", "image": null, "isCorrect": true}, {"id": "pYRsv", "text": "274 u", "image": null, "isCorrect": false}, {"id": "sEKhu", "text": "167 u", "image": null, "isCorrect": false}, {"id": "mQR00", "text": "254 u", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The formula for atom economy is given by:<br><br>$\\% \\text{ Atom economy} = \\dfrac{\\text{Formula weight of desired product}}{\\text{Sum of formula weights of all reactants}} \\times 100$<br><br>Substituting the given values into the formula:<br><br>$50 = \\dfrac{\\text{Formula weight of desired product}}{274} \\times 100$<br><br>$\\text{Formula weight of desired product} = \\dfrac{50 \\times 274}{100}$<br><br>$\\text{Formula weight of desired product} = 137 \\text{ u}$<br><br>Answer: 137 u", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141f0aee93fa0796de25", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "What is the volume occupied by 2.5 mol of ammonia gas at STP?", "image": null}, "options": [{"id": "pjFV4", "text": "$22.4 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "nsEHF", "text": "$25.0 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "SbA2z", "text": "$33.6 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "njl0c", "text": "$56.0 \\mathrm{dm}^3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Number of moles of ammonia gas, $n = 2.5$ mol.<br><br>Molar volume of a gas at STP, $V_m = 22.4 \\mathrm{dm}^3 \\mathrm{mol}^{-1}$.<br><br>Volume occupied by the gas is given by $V = n \\times V_m$.<br><br>$V = 2.5 \\times 22.4$<br><br>$V = 56.0 \\mathrm{dm}^3$.<br><br>Answer: $56.0 \\mathrm{dm}^3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c00aee93fa0796db38", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "What is the volume of oxygen required for complete combustion of 0.25 mole of methane at S.T.P.?", "image": null}, "options": [{"id": "F3W24", "text": "$22.4 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "i7pZ1", "text": "$5.6 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "vrrqV", "text": "$11.2 \\mathrm{dm}^3$", "image": null, "isCorrect": true}, {"id": "VZS5r", "text": "$\\quad 7.46 \\mathrm{dm}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The balanced chemical equation for the combustion of methane is:<br><br>$\\mathrm{CH_4(g)} + 2\\mathrm{O_2(g)} \\rightarrow \\mathrm{CO_2(g)} + 2\\mathrm{H_2O(l)}$<br><br>From the stoichiometry of the reaction, $1$ mole of methane requires $2$ moles of oxygen for complete combustion.<br><br>Therefore, $0.25$ mole of methane requires $2 \\times 0.25 = 0.50$ mole of oxygen.<br><br>At S.T.P., the volume occupied by $1$ mole of a gas is $22.4 \\mathrm{\\, dm^3}$.<br><br>Volume of oxygen required $= 0.50 \\times 22.4 \\mathrm{\\, dm^3} = 11.2 \\mathrm{\\, dm^3}$.<br><br>Answer: $11.2 \\mathrm{dm}^3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ad0aee93fa0796daac", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Calculate mass in kg of $4.48 \\mathrm{dm}^3$ carbon dioxide at STP.", "image": null}, "options": [{"id": "n7Ba3", "text": "$2.2 \\times 10^{-3}$", "image": null, "isCorrect": false}, {"id": "0kOqS", "text": "$4.4 \\times 10^{-3}$", "image": null, "isCorrect": false}, {"id": "cmXPh", "text": "$6.6 \\times 10^{-3}$", "image": null, "isCorrect": false}, {"id": "ipmyB", "text": "$8.8 \\times 10^{-3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Volume of $CO_2$ at STP = $4.48 \\text{ dm}^3 = 4.48 \\text{ L}$<br><br>Number of moles of $CO_2$ = $\\dfrac{4.48}{22.4} = 0.2 \\text{ mol}$<br><br>Molar mass of $CO_2$ = $44 \\text{ g/mol}$<br><br>Mass of $CO_2$ = $0.2 \\times 44 = 8.8 \\text{ g}$<br><br>Mass in kg = $8.8 \\times 10^{-3} \\text{ kg}$<br><br>Answer: $8.8 \\times 10^{-3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620f0279619d9d8a3175", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "What is the value of percent atom economy when an organic compound of formula weight $75 \\mathrm{u}$ is obtained from reactants having sum formula weight $225 \\mathrm{u}$ ?", "image": null}, "options": [{"id": "g2Y93", "text": "$13.5$", "image": null, "isCorrect": false}, {"id": "MaBvt", "text": "$33.3$", "image": null, "isCorrect": true}, {"id": "YqxjO", "text": "$40.4$", "image": null, "isCorrect": false}, {"id": "EWKCY", "text": "$70.5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\%$ atom economy\n$=\\frac{\\text { Formula weight of the desired product }}{\\text { Sum of formula weight of all the reactants }} \\times 100$\nused in the reaction\n$\\% \\text { atom economy }=\\frac{75}{225} \\times 100=33.3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2619f0279619d9d8a2e08", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "What is the quantity of sugar charcoal remaining behind after charring 17.1 g sugar using conc. $\\mathrm{H}_2 \\mathrm{SO}_4$ under ideal conditions?", "image": null}, "options": [{"id": "5OQQC", "text": "7.2 g", "image": null, "isCorrect": true}, {"id": "C9JWK", "text": "14.4 g", "image": null, "isCorrect": false}, {"id": "6NSEx", "text": "10.5 g", "image": null, "isCorrect": false}, {"id": "Y6pDa", "text": "11.4 g", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{C}_{12} \\mathrm{H}_{22} \\mathrm{O}_{11} \\underset{-11 \\mathrm{H}_2 \\mathrm{O}}{\\longrightarrow} 12 \\mathrm{C}$\n$\\frac{17.1}{342}=0.05 \\text { moles } 0.6 \\mathrm{~mol}$\nMass of charcoal $=0.06 \\times 12=7.2 \\mathrm{~g}$", "image": null}, "videoSolu
