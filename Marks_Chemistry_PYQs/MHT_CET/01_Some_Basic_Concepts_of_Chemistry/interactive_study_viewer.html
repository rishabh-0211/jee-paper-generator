": false}, {"id": "IbmIt", "text": "$2.4088 \\times 10^{23}$", "image": null, "isCorrect": true}, {"id": "Xeld3", "text": "$1.8066 \\times 10^{22}$", "image": null, "isCorrect": false}, {"id": "WkyeD", "text": "$6.022 \\times 10^{23}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\text { For } \\mathrm{NH}_3 & \\\\ 22.4 \\mathrm{dm}^3 & =1 \\mathrm{~mol} \\\\ & =6.022 \\times 10^{22} \\text { molecules } \\\\ & =6.022 \\times 10^{22} \\times 4 \\text { atoms } \\\\ \\therefore \\quad 2.24 \\mathrm{dm}^3 & =0.1 \\mathrm{~mol} \\\\ & =0.6022 \\times 10^{22} \\text { molecules } \\\\ & =0.6022 \\times 10^{22} \\times 4 \\text { atoms } \\\\ & =2.4088 \\times 10^{23} \\text { atoms }\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2624b0279619d9d8a335f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Calculate the number of atoms present in unit cell if an element having molar mass $23 \\mathrm{~g} \\mathrm{~mol}^{-1}$ and density $0.96 \\mathrm{~g} \\mathrm{~cm}^{-3}$.\n$\\left[\\mathrm{a}^3 \\cdot \\mathrm{N}_{\\mathrm{A}}=48 \\mathrm{~cm}^3 \\mathrm{~mol}^{-1}\\right]$\n(A) 1\n(B) 2\n(C) 4\n(D) 6", "image": null}, "options": [{"id": "5rVtx", "text": "1", "image": null, "isCorrect": false}, {"id": "UC7q1", "text": "2", "image": null, "isCorrect": true}, {"id": "PFSRx", "text": "4", "image": null, "isCorrect": false}, {"id": "WYQ3V", "text": "6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\text { Density }(\\rho)=\\frac{\\mathrm{nM}}{\\mathrm{a}^3 \\mathrm{~N}_{\\mathrm{A}}} \\\\\n& 0.96=\\frac{\\mathrm{n} \\times 23}{48} \\\\\n& \\mathrm{n}=\\frac{0.96 \\times 48}{23}=2.003\n\\end{aligned}\n$$\nNumber of atoms present in unit cell $=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c40279619d9d8a2f32", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "Which one of the following set of compounds correctly illustrates the law of reciprocal proportions?", "image": null}, "options": [{"id": "7Npmb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi>PH</mi><mn>3</mn></msub><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>", "image": null, "isCorrect": true}, {"id": "O36VH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>5</mn></msub><mo>,</mo><msub><mi>PH</mi><mn>3</mn></msub><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>", "image": null, "isCorrect": false}, {"id": "hpqCS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>5</mn></msub><mo>,</mo><msub><mi>NH</mi><mn>3</mn></msub><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>", "image": null, "isCorrect": false}, {"id": "YcFaS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub><mo>,</mo><msub><mi>NH</mi><mn>3</mn></msub><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>The element <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><mi mathvariant=\"normal\">H</mi></math> combine separately with the third element <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> to form <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>PH</mi><mn>3</mn></msub></math> respectively and directly combine to form <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>. In <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>PH</mi><mn>3</mn></msub></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>31</mn></math> parts by mass of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> combine with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> parts by mass of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi></math> and in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>62</mn></math>&nbsp; parts by mass of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math> combine with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>48</mn></math> parts by mass of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math>. Thus the masses of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><mi mathvariant=\"normal\">O</mi></math> which combines with fixed mass of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi></math>(say&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>62</mn></math> parts by mass) are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><mn>48</mn></math> and they bear the ratio of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>8</mn></math></p></blockquote><blockquote><p>Now in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> parts by mass of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi></math> combines with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn></math> parts by mass of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math>. So, they combine in ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>:</mo><mn>16</mn></math> which is equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>:</mo><mn>8</mn></math> which is same as the first ratio.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c10279619d9d8a2f17", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "What volume of ammonia is formed when $10 \\mathrm{dm}^3$ dinitrogen reacts with $30 \\mathrm{dm}^3$ dihydrogen at same temperature and pressure?", "image": null}, "options": [{"id": "2s9Pl", "text": "$30 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "H0vAE", "text": "$20 \\mathrm{dm}^3$", "image": null, "isCorrect": true}, {"id": "8LkaC", "text": "$15 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "Kd7ja", "text": "$10 \\mathrm{dm}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Nitrogen }_{(\\mathrm{g})}+\\text { Hydrogen }_{(\\mathrm{g})} \\longrightarrow \\text { Ammonia }_{(\\mathrm{g})} \\\\ & {[1 \\mathrm{~L}] \\quad[3 \\mathrm{~L}] \\quad[2 \\mathrm{~L}]} \\\\ & {\\left[10 \\mathrm{dm}^3\\right] \\quad\\left[30 \\mathrm{dm}^3\\right] \\quad\\left[20 \\mathrm{dm}^3\\right]} \\\\ & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2602d0279619d9d8a225b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "\"Mass can neither be created nor destroyed\" is the statement of", "image": null}, "options": [{"id": "PC8TE", "text": "Gay Lussac Law of gaseous volume", "image": null, "isCorrect": false}, {"id": "pJwFn", "text": "Law of definite proportion", "image": null, "isCorrect": false}, {"id": "vCz8S", "text": "Law of conservation of mass", "image": null, "isCorrect": true}, {"id": "MMB1Y", "text": "Law of multiple proportions", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Law of conservation of mass: -\nMass can neither be created nor destroyed.\nLaw of multiple proportions\nAccording to this law, if two elements can combine to form more than one compound, the masses of one element that combine with a fixed mass of the other element, are in the ratio of small whole numbers.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260170279619d9d8a21af", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c lse}, {"id": "5qbZR", "text": "Law of multiple proportion", "image": null, "isCorrect": false}, {"id": "5lUpG", "text": "Law of definite proportion", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Pure samples of copper carbonate synthesized in laboratory and found naturally if both contains \\(51.35 \\%\\) copper \\(38.91 \\%\\) carbon and 9.74 % oxygen by weight. This is an accordance with Law of definite proportion.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fdf0279619d9d8a1fe8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "Find the empirical formula of organic compound if it contains $18.6 \\% \\mathrm{C}, 1 \\cdot 55 \\% \\mathrm{H}, 55 \\cdot 04 \\%$ chlorine ? (atomic mass $\\mathrm{C}=12, \\mathrm{H}=1, \\mathrm{Cl}=35 \\cdot 5, \\mathrm{O}=16$ )", "image": null}, "options": [{"id": "qmOw1", "text": "$\\mathrm{C}_{2} \\mathrm{H}_{2} \\mathrm{Cl}_{2} \\mathrm{O}_{2}$", "image": null, "isCorrect": false}, {"id": "BbEqC", "text": "$\\mathrm{CH}_{2} \\mathrm{ClO}$", "image": null, "isCorrect": false}, {"id": "2NIcK", "text": "CHClO", "image": null, "isCorrect": true}, {"id": "7PZ0T", "text": "$\\mathrm{CHClO}_{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The sum of the percentage of carbon, hydrogen, and chlorine is not $100 \\%$\nHence the rest of the part of the compound is oxygen\npercentage of oxygen $=100-(18.6+1.55+55.04)=24.81 \\%$\nSimplest ratio $=1: 1: 1: 1$\nHence empirical formula $=$ CHCIO\nEmpiraical formula weight $=12 \\times 1+1 \\times 1+35.5 \\times 1+16 \\times 1=64.5$\n$\\frac{\\text { molecular mass }}{\\text { empirical mass }}=\\frac{129}{64.5}=2$\nTherefore molecular formula $=\\mathrm{n} \\times($ Empiricalformula $)$\nMolecular formula $=2 \\times(\\mathrm{CHCIO})$\nMolecular formula $\\mathrm{C}_{2} \\mathrm{H}_{2} \\mathrm{Cl}_{2} \\mathrm{O}_{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fde0279619d9d8a1fe1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "A sample of calcium carbonate has the following percentage composition. $\\mathrm{Ca}=40 \\%, \\mathrm{C}=12 \\%$ and $0=48 \\%$\nAccording to law of definite proportion the weight of calcium in $4 \\mathrm{~g}$ of a sample of calcium carbonate from another source will be (at. no. $\\mathrm{Ca}=40, \\mathrm{C}=40, \\mathrm{C}=12,0=16$ )", "image": null}, "options": [{"id": "rteTC", "text": "$1.6 \\times 10^{-2} \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "MdLaV", "text": "$1.6 \\mathrm{~g}$", "image": null, "isCorrect": true}, {"id": "RmTiL", "text": "$0.1 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "PtCBD", "text": "$0.2 \\mathrm{~g}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\nIn $100 \\mathrm{~g}$ of $\\mathrm{CaCO}_{3}, 40 \\mathrm{~g} \\mathrm{Ca}$ is present\n$\\therefore$ In $4 \\mathrm{~g}$ of $\\mathrm{CaCO}_{3}=\\frac{4 \\times 40}{100}=1.6 \\mathrm{~g}$ of $\\mathrm{Ca}$ is present.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb60279619d9d8a1eaa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "Identify the symbol used for water according to Dalton's atomic theory?", "image": null}, "options": [{"id": "04GvW", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/vCUfeDhrTXgs51mdXuH2Fh94SOpsS6WDgt9aqSYReW4.original.fullsize.png\">", "image": null, "isCorrect": false}, {"id": "qg772", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/cua27_rgsDM9PSCqxfpWad3w5VDxScwoz7sfSbDd38o.original.fullsize.png\">", "image": null, "isCorrect": true}, {"id": "vod9g", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/s42Xl0twlLer1wdLlQEfbxIZNY5dQqWfR6Z16tm5TkQ.original.fullsize.png\">", "image": null, "isCorrect": false}, {"id": "YcCJX", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/G7cId19P-6-gk3yGYPTSo5waY_YlUkTzw8AdIqgsR80.original.fullsize.png\">", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\nAccording to Dalton's atomic theory,\n1.Symbol for hydrogen\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/j2NrdWnwI8AEfwv2xIjCrHx7ss0yEG6ECam_4zSiDgA.original.fullsize.png\"><br>\n2.Symbol for oxygen<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/-b2v_MUiOPPg_lJqR4Q4TvSCMqeuTIZ9m2ZHVDiNugo.original.fullsize.png\"><br>\n3.Symbol for sulphur<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/YtaXaJbBOGA2sUXoPi5tPb3qXKoQLtROyheiPsyZQ64.original.fullsize.png\"><br>\n4.Symbol for nitrogen<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/C-pP4dvdE8PdVFtraatNp7Jg2WOambaw-OPbvqKUT54.original.fullsize.png\"><br>\nThe following symbol represents the water molecule<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/7U-IX57tluOjy5kYVJ2lXp7746xsADmzmvp3kC0kJKQ.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fa70279619d9d8a1e35", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "An organic compound was found to contain $40.0 \\% \\mathrm{C}$ and $6.66 \\% \\mathrm{H}$. Find it's molecular formula (molar mass $=180$ )", "image": null}, "options": [{"id": "2uj2y", "text": "$\\mathrm{C}_{22} \\mathrm{H}_{24} \\mathrm{O}_{11}$", "image": null, "isCorrect": false}, {"id": "cO5b3", "text": "$\\mathrm{C}_{2} \\mathrm{H}_{4} \\mathrm{O}_{2}$", "image": null, "isCorrect": false}, {"id": "yLELr", "text": "$\\mathrm{CH}_{2} \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "cLTUK", "text": "$\\mathrm{C}_{6} \\mathrm{H}_{12} \\mathrm{O}_{6}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For this we make a table as:\n\\begin{array}{|c|c|c|c|c|}\n\\hline Elemen & \\%Compositio & Atomic & Mole & Simple Ratio \\\\\n\\hline \\mathrm{t} & \\mathrm{n} & Mass & Ratio & \\\\\n\\hline \\mathrm{C} & 40.00 \\% & 12 & (40 / 12) & (3 \\cdot 33 / 3 \\cdot 33)=1 \\\\\n\\hline \\mathrm{H} & 6.67 \\% & 1 & (6.67 / 1) & (6.667 / 3 \\cdot 33)=2 \\\\\n\\hline \\mathrm{O} & 53.33 \\% & 16 & (53 \\cdot 33 / 16 & (3 \\cdot 33 / 3 \\cdot 33)=1 \\\\\n\\hline\n\\end{array}\n$\\therefore$ Formula of compound is $=\\mathrm{CH}_{2} \\mathrm{O}$\nMolecular formula mass $=180$\nEmpirical formula mass $=12+2+16=30$\n$\\mathrm{n}=180 / 30=6$\nTherefore, molecular formula = empirical formula $\\times 6=\\mathrm{C}_{6} \\mathrm{H}_{12} \\mathrm{O}_{6}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f820279619d9d8a1d0e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "The molecular mass of an organic monobasic acid is 129 and value of $\\mathrm{n}$ is 2, what is empirical\nformula mass of compound?", "image": null}, "options": [{"id": "Htlnq", "text": "$158 \\cdot 0$", "image": null, "isCorrect": false}, {"id": "rbk2Y", "text": "$193 \\cdot 5$", "image": null, "isCorrect": false}, {"id": "DRrma", "text": "$64 \\cdot 5$", "image": null, "isCorrect": true}, {"id": "71trt", "text": "258", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Empirical formula mass = molecular mass / n = 129/2 = 64.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f120279619d9d8a198d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "What is the atomicity of aluminium phosphate?", "image": null}, "options": [{"id": "Uk30Z", "text": "8", "image": null, "isCorrect": false}, {"id": "0yb0S", "text": "6", "image": null, "isCorrect": true}, {"id": "aJqcD", "text": "5", "image": null, "isCorrect": false}, {"id": "sjlSi", "text": "13", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical formula for aluminium phosphate is <math><mi>A</mi><mi>I</mi><mi>P</mi><msub><mrow><mi>O</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>.</mo></math>  <br/>Atomicity of heternuclear molecule = total number of atoms present <br/><math><mo>∴</mo></math> Atomicity of <math><mi>A</mi><mi>l</mi><mi>P</mi><msub><mrow><mi>O</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>=</mo><mn>1</mn><mo>+</mo><mn>1</mn><mo>+</mo><mn>4</mn><mo>=</mo><mn>6</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25efb0279619d9d8a18d0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "The combining ratios of hydrogen and oxygen in water and hydrogen peroxide are 1: 8 and 1: 16. Which law is illustrated in this example?", "image": null}, "options": [{"id": "pZ0uD", "text": "Law of definite proportions", "image": null, "isCorrect": false}, {"id": "ZIJjc", "text": "Law of conservation of mass", "image": null, "isCorrect": false}, {"id": "pCaTu", "text": "Gay Lussac’s law of combining volumes of gases", "image": null, "isCorrect": false}, {"id": "vm0R9", "text": "Law of multiple proportions", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The combining ratios of hydrogen and oxygen in water and hydrogen peroxide are 1: 8 and 1: 16. It is an example of law of multiple proportions. According to this law, if two elements combine together to form several compounds then weight of one of these elements, which combines with a fixed weight of the other, are in ratio of simple whole numbers.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263450279619d9d8a3dae", "title": "Mole concept", "totalQuestions": 94, "questions": [{"_id": "6abb88d015a9fc0fc8c14731", "type": "singleCorrect", "question": {"text": "Which of the following gases has the maximum number of molecules?", "image": null}, "options": [{"id": "8H3Ne", "label": "A", "text": "$3.5$ g $\\text{N}_2$", "isCorrect": false, "image": null}, {"id": "H1vpT", "label": "B", "text": "$0.5$ g $\\text{H}_2$", "isCorrect": true, "image": null}, {"id": "tHxt9", "label": "C", "text": "$3.2$ g $\\text{O}_2$", "isCorrect": false, "image": null}, {"id": "vlZLE", "label": "D", "text": "$4.6$ g $\\text{NO}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The number of molecules is directly proportional to the number of moles.<br><br>Number of moles $n = \\dfrac{\\text{Mass}}{\\text{Molar mass}}$<br><br>For $3.5$ g $\\text{N}_2$: $n = \\dfrac{3.5}{28} = 0.125$ mol<br><br>For $0.5$ g $\\text{H}_2$: $n = \\dfrac{0.5}{2} = 0.25$ mol<br><br>For $3.2$ g $\\text{O}_2$: $n = \\dfrac{3.2}{32} = 0.1$ mol<br><br>For $4.6$ g $\\text{NO}_2$: $n = \\dfrac{4.6}{46} = 0.1$ mol<br><br>Since $0.5$ g $\\text{H}_2$ has the maximum number of moles, it contains the maximum number of molecules.<br><br>Answer: $0.5$ g $\\text{H}_2$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884015a9fc0fc8c141eb", "type": "singleCorrect", "question": {"text": "Calculate the volume occupied by $64 \\text{ g}$ dioxygen at STP.", "image": null}, "options": [{"id": "QcxSI", "label": "A", "text": "$22.4 \\text{ L}$", "isCorrect": false, "image": null}, {"id": "IXUTq", "label": "B", "text": "$44.8 \\text{ L}$", "isCorrect": true, "image": null}, {"id": "FeTDW", "label": "C", "text": "$11.2 \\text{ L}$", "isCorrect": false, "image": null}, {"id": "XkX8A", "label": "D", "text": "$33.6 \\text{ L}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Molar mass of dioxygen ($O_2$) is $32 \\text{ g mol}^{-1}$.<br><br>Number of moles of $O_2 = \\dfrac{64}{32} = 2 \\text{ moles}$.<br><br>At STP, the volume occupied by $1 \\text{ mole}$ of a gas is $22.4 \\text{ L}$.<br><br>Volume occupied by $2 \\text{ moles}$ of $O_2 = 2 \\times 22.4 = 44.8 \\text{ L}$.<br><br>Answer: $44.8 \\text{ L}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885015a9fc0fc8c14281", "type": "singleCorrect", "question": {"text": "A man purchased $171$ kg of cane sugar for Rs. $6840$. Calculate the cost of cane sugar per mole.", "image": null}, "options": [{"id": "UU5Vw", "label": "A", "text": "Rs. $12.56$", "isCorrect": false, "image": null}, {"id": "AI1Sr", "label": "B", "text": "Rs. $13.68$", "isCorrect": true, "image": null}, {"id": "kgv64", "label": "C", "text": "Rs. $14.28$", "isCorrect": false, "image": null}, {"id": "v4dx6", "label": "D", "text": "Rs. $15.42$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Mass of cane sugar = $171$ kg = $171000$ g<br><br>Molar mass of cane sugar ($C_{12}H_{22}O_{11}$) = $12 \\times 12 + 22 \\times 1 + 11 \\times 16 = 342$ g/mol<br><br>Number of moles = $\\dfrac{171000}{342} = 500$ moles<br><br>Cost of $500$ moles = Rs. $6840$<br><br>Cost per mole = $\\dfrac{6840}{500} = 13.68$ Rs.<br><br>Answer: Rs. $13.68$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88af15a9fc0fc8c14605", "type": "singleCorrect", "question": {"text": "Calculate the atomic mass in terms of $u$ if the mass of an atom is $4.9817 \\times 10^{-23}$ g.<br>[$1$ amu = $1.66056 \\times 10^{-24}$ g]", "image": null}, "options": [{"id": "JpYxj", "label": "A", "text": "$12\\ u$", "isCorrect": false, "image": null}, {"id": "CAKTO", "label": "B", "text": "$30\\ u$", "isCorrect": true, "image": null}, {"id": "zus3D", "label": "C", "text": "$25.4\\ u$", "isCorrect": false, "image": null}, {"id": "DeGSK", "label": "D", "text": "$8.35\\ u$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Mass of the atom = $4.9817 \\times 10^{-23}$ g<br><br>Mass of $1$ amu = $1.66056 \\times 10^{-24}$ g<br><br>Atomic mass in $u$ = $\\dfrac{\\text{Mass of the atom}}{\\text{Mass of } 1 \\text{ amu}}$<br><br>Atomic mass = $\\dfrac{4.9817 \\times 10^{-23}}{1.66056 \\times 10^{-24}}$<br><br>Atomic mass = $\\dfrac{49.817 \\times 10^{-24}}{1.66056 \\times 10^{-24}} = 30\\ u$<br><br>Answer: $30\\ u$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886f15a9fc0fc8c143ad", "type": "singleCorrect", "question": {"text": "An element has two isotopes of mass numbers $65$ and $67$ with abundances of $25\\%$ and $75\\%$ respectively. Then the average atomic mass of the element is", "image": null}, "options": [{"id": "mCgnr", "label": "A", "text": "$65.5$", "isCorrect": false, "image": null}, {"id": "EhRQH", "label": "B", "text": "$67.5$", "isCorrect": false, "image": null}, {"id": "nkWU7", "label": "C", "text": "$66.5$", "isCorrect": true, "image": null}, {"id": "9HaTb", "label": "D", "text": "$66$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The average atomic mass of an element is calculated using the formula:<br><br>$\\text{Average atomic mass} = \\dfrac{m_1 x_1 + m_2 x_2}{100}$<br><br>Substituting the given values:<br><br>$\\text{Average atomic mass} = \\dfrac{65 \\times 25 + 67 \\times 75}{100}$<br><br>$\\text{Average atomic mass} = \\dfrac{1625 + 5025}{100}$<br><br>$\\text{Average atomic mass} = \\dfrac{6650}{100} = 66.5$<br><br>Answer: $66.5$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887f15a9fc0fc8c14443", "type": "singleCorrect", "question": {"text": "Which of the following contains the maximum number of atoms?", "image": null}, "options": [{"id": "okoul", "label": "A", "text": "$18$ grams of water", "isCorrect": false, "image": null}, {"id": "boriT", "label": "B", "text": "$24$ grams of dioxygen", "isCorrect": false, "image": null}, {"id": "oxUoE", "label": "C", "text": "$22$ grams of carbon dioxide", "isCorrect": false, "image": null}, {"id": "72zTx", "label": "D", "text": "$16$ grams of methane", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Number of atoms can be calculated as the product of the number of moles of the substance, the number of atoms per molecule, and Avogadro's number ($N_A$).<br><br>For $18$ grams of water ($H_2O$):<br>Molar mass of $H_2O = 18 \\text{ g/mol}$<br>Moles of $H_2O = \\dfrac{18}{18} = 1 \\text{ mol}$<br>Atoms per molecule = $3$<br>Total atoms = $1 \\times 3 \\times N_A = 3 N_A$<br><br>For $24$ grams of dioxygen ($O_2$):<br>Molar mass of $O_2 = 32 \\text{ g/mol}$<br>Moles of $O_2 = \\dfrac{24}{32} = 0.75 \\text{ mol}$<br>Atoms per molecule = $2$<br>Total atoms = $0.75 \\times 2 \\times N_A = 1.5 N_A$<br><br>For $22$ grams of carbon dioxide ($CO_2$):<br>Molar mass of $CO_2 = 44 \\text{ g/mol}$<br>Moles of $CO_2 = \\dfrac{22}{44} = 0.5 \\text{ mol}$<br>Atoms per molecule = $3$<br>Total atoms = $0.5 \\times 3 \\times N_A = 1.5 N_A$<br><br>For $16$ grams of methane ($CH_4$):<br>Molar mass of $CH_4 = 16 \\text{ g/mol}$<br>Moles of $CH_4 = \\dfrac{16}{16} = 1 \\text{ mol}$<br>Atoms per molecule = $5$<br>Total atoms = $1 \\times 5 \\times N_A = 5 N_A$<br><br>Methane contains the maximum number of atoms.<br><br>Answer: $16$ grams of methane", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888f15a9fc0fc8c144d9", "type": "singleCorrect", "question": {"text": "Calculate the number of atoms in each of the following.<br>(a) $11.2$ g nitrogen (b) $1.15$ g sodium", "image": null}, "options": [{"id": "cHAWJ", "label": "A", "text": "Atoms of nitrogen $= 4.818 \\times 10^{23}$ and atoms of sodium $= 3.011 \\times 10^{22}$.", "isCorrect": true, "image": null}, {"id": "M0N7X", "label": "B", "text": "Atoms of nitrogen $= 6.022 \\times 10^{23}$ and atoms of sodium $= 4.802 \\times 10^{22}$.", "isCorrect": false, "image": null}, {"id": "60kQz", "label": "C", "text": "Atoms of nitrogen $= 1.204 \\times 10^{23}$ and atoms of sodium $= 5.604 \\times 10^{22}$.", "isCorrect": false, "image": null}, {"id": "wIG40", "label": "D", "text": "Atoms of nitrogen $= 3.011 \\times 10^{23}$ and atoms of sodium $= 1.204 \\times 10^{22}$.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "(a) For nitrogen:<br><br>Mass of nitrogen $= 11.2$ g<br><br>Molar mass of nitrogen atom (N) $= 14$ g/mol<br><br>Number of moles of N atoms $= \\dfrac{11.2}{14} = 0.8$ mol<br><br>Number of N atoms $= 0.8 \\times 6.022 \\times 10^{23} = 4.818 \\times 10^{23}$<br><br>(b) For sodium:<br><br>Mass of sodium $= 1.15$ g<br><br>Molar mass of sodium (Na) $= 23$ g/mol<br><br>Number of moles of Na atoms $= \\dfrac{1.15}{23} = 0.05$ mol<br><br>Number of Na atoms $= 0.05 \\times 6.022 \\times 10^{23} = 3.011 \\times 10^{22}$<br><br>Answer: Atoms of nitrogen $= 4.818 \\times 10^{23}$ and atoms of sodium $= 3.011 \\times 10^{22}$.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885f15a9fc0fc8c14317", "type": "singleCorrect", "question": {"text": "Calculate the number of molecules in $2$ mol of MgO.", "image": null}, "options": [{"id": "Ez7Sm", "label": "A", "text": "$2 \\times 10^{22}$", "isCorrect": false, "image": null}, {"id": "mcy44", "label": "B", "text": "$6.022 \\times 10^{23}$", "isCorrect": false, "image": null}, {"id": "ouYpl", "label": "C", "text": "$1.2044 \\times 10^{24}$", "isCorrect": true, "image": null}, {"id": "i5zA6", "label": "D", "text": "$6.022 \\times 10^{22}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Number of molecules = Number of moles $\\times$ Avogadro's number ($N_A$)<br><br>Number of molecules = $2 \\times 6.022 \\times 10^{23}$<br><br>Number of molecules = $1.2044 \\times 10^{24}$<br><br>Answer: $1.2044 \\times 10^{24}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bf15a9fc0fc8c1469b", "type": "singleCorrect", "question": {"text": "Identify the quantity of water (expressed in different terms) that contains highest number of water molecules in it.", "image": null}, "options": [{"id": "mP07G", "label": "A", "text": "$18$ mL of water", "isCorrect": true, "image": null}, {"id": "mXxjK", "label": "B", "text": "$10^{-3}$ mol of water", "isCorrect": false, "image": null}, {"id": "pyimb", "label": "C", "text": "$0.18$ g of water", "isCorrect": false, "image": null}, {"id": "ozNxu", "label": "D", "text": "$0.00224$ L of water vapour at $1$ atmp. and $273$K", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Density of water is $1$ g/mL.<br><br>Mass of $18$ mL of water $= 18$ g.<br><br>Number of moles in $18$ mL of water $= \\dfrac{18}{18} = 1$ mol.<br><br>Number of moles in $10^{-3}$ mol of water $= 0.001$ mol.<br><br>Number of moles in $0.18$ g of water $= \\dfrac{0.18}{18} = 0.01$ mol.<br><br>Number of moles in $0.00224$ L of water vapour at STP $= \\dfrac{0.00224}{22.4} = 0.0001$ mol.<br><br>Since $18$ mL of water has the maximum number of moles ($1$ mol), it contains the highest number of water molecules.<br><br>Answer: $18$ mL of water", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb882f15a9fc0fc8c14155", "type": "singleCorrect", "question": {"text": "Which of the following substances contains the maximum number of atoms?<br>(molar mass in g mol$^{-1}$ - $\\text{CO}_2 =44$, $\\text{H}_2 = 2$, $\\text{Cr} = 51.99$, $\\text{Cl}_2 =71$)", "image": null}, "options": [{"id": "9hU3I", "label": "A", "text": "$14.0$ g of Carbon dioxide.", "isCorrect": false, "image": null}, {"id": "Ym78J", "label": "B", "text": "$2.0$ g of dihydrogen", "isCorrect": true, "image": null}, {"id": "ejRyM", "label": "C", "text": "$12.0$ g of Chromium", "isCorrect": false, "image": null}, {"id": "LbrT8", "label": "D", "text": "$35.5$ g of chlorine gas", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Number of atoms in $14.0$ g of $\\text{CO}_2 = \\dfrac{14.0}{44} \\times 3 \\times N_A = 0.954 N_A$<br><br>Number of atoms in $2.0$ g of $\\text{H}_2 = \\dfrac{2.0}{2} \\times 2 \\times N_A = 2 N_A$<br><br>Number of atoms in $12.0$ g of $\\text{Cr} = \\dfrac{12.0}{51.99} \\times 1 \\times N_A = 0.23 N_A$<br><br>Number of atoms in $35.5$ g of $\\text{Cl}_2 = \\dfrac{35.5}{71} \\times 2 \\times N_A = 1 N_A$<br><br>The maximum number of atoms is present in $2.0$ g of dihydrogen.<br><br>Answer: $2.0$ g of dihydrogen", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a88c30a4553e1bdb67", "type": "singleCorrect", "question": {"text": "What is the number of molecules in 2.125 g of ammonia?", "image": null}, "options": [{"id": "EHG6O", "label": "A", "text": "$6.022 \\times 10^{23}$", "isCorrect": false, "image": null}, {"id": "qIEJw", "label": "B", "text": "$3.011 \\times 10^{23}$", "isCorrect": false, "image": null}, {"id": "Qhyou", "label": "C", "text": "$1.505 \\times 10^{22}$", "isCorrect": false, "image": null}, {"id": "bkAtc", "label": "D", "text": "$7.527 \\times 10^{22}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Molar mass of ammonia ($NH_3$) = $14 + 3 = 17 \\text{ g/mol}$<br><br>Number of moles of ammonia = $\\dfrac{2.125}{17} = 0.125 \\text{ mol}$<br><br>Number of molecules = $0.125 \\times 6.022 \\times 10^{23} = 7.527 \\times 10^{22}$<br><br>Answer: $7.527 \\times 10^{22}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3538c30a4553e1be28c", "type": "singleCorrect", "question": {"text": "What is average atomic mass of chlorine if its two isotopes $\\text{Cl}^{35}$ and $\\text{Cl}^{37}$ exists in relative abundance of $75\\%$ and $25\\%$ respectively ?", "image": null}, "options": [{"id": "P6ztw", "label": "A", "text": "$35.0$", "isCorrect": false, "image": null}, {"id": "gXwDu", "label": "B", "text": "$35.5$", "isCorrect": true, "image": null}, {"id": "o44Tc", "label": "C", "text": "$37.0$", "isCorrect": false, "image": null}, {"id": "lb8WS", "label": "D", "text": "$37.5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Average atomic mass is calculated using the formula:<br><br>Average atomic mass = $\\dfrac{m_1 \\times p_1 + m_2 \\times p_2}{100}$<br><br>where $m_1$ and $m_2$ are the atomic masses of the isotopes, and $p_1$ and $p_2$ are their respective percentage abundances.<br><br>Substituting the given values:<br><br>Average atomic mass = $\\dfrac{35 \\times 75 + 37 \\times 25}{100}$<br><br>Average atomic mass = $\\dfrac{2625 + 925}{100}$<br><br>Average atomic mass = $\\dfrac{3550}{100} = 35.5$<br><br>Answer: $35.5$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30b8c30a4553e1bdf8f", "type": "singleCorrect", "question": {"text": "Chlorine has two isotopes $\\text{Cl}^{37}$ and $\\text{Cl}^{35}$ with percentage abundance of $25\\%$ and $75\\%$ respectively. Find average atomic mass of chlorine ?", "image": null}, "options": [{"id": "OPNkp", "label": "A", "text": "$35$", "isCorrect": false, "image": null}, {"id": "Blsh7", "label": "B", "text": "$37$", "isCorrect": false, "image": null}, {"id": "NYKCP", "label": "C", "text": "$35.5$", "isCorrect": true, "image": null}, {"id": "ZUOl2", "label": "D", "text": "$36$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Average atomic mass is calculated using the formula:<br><br>$\\text{Average atomic mass} = \\dfrac{\\sum (\\text{Isotopic mass} \\times \\text{Percentage abundance})}{100}$<br><br>Substituting the given values:<br><br>$\\text{Average atomic mass} = \\dfrac{37 \\times 25 + 35 \\times 75}{100}$<br><br>$\\text{Average atomic mass} = \\dfrac{925 + 2625}{100}$<br><br>$\\text{Average atomic mass} = \\dfrac{3550}{100} = 35.5$<br><br>Answer: $35.5$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ff8c30a4553e1bdf0f", "type": "singleCorrect", "question": {"text": "What quantity of $\\text{H}_2\\text{O}$ in gram is present in $0.25$ mol of it?", "image": null}, "options": [{"id": "ttOcu", "label": "A", "text": "$4.5$ g", "isCorrect": true, "image": null}, {"id": "y5wKy", "label": "B", "text": "$0.25$ g", "isCorrect": false, "image": null}, {"id": "2BWf3", "label": "C", "text": "$18$ g", "isCorrect": false, "image": null}, {"id": "Pbo82", "label": "D", "text": "$5.4$ g", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Molar mass of $\\text{H}_2\\text{O} = 2 \\times 1 + 16 = 18 \\text{ g/mol}$<br><br>Mass of $\\text{H}_2\\text{O} = \\text{moles} \\times \\text{molar mass}$<br><br>Mass $= 0.25 \\times 18 = 4.5 \\text{ g}$<br><br>Answer: $4.5$ g", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f08c30a4553e1bde6e", "type": "singleCorrect", "question": {"text": "Find the number of molecules present in 70 g dinitrogen.", "image": null}, "options": [{"id": "zgQC1", "label": "A", "text": "$1.5055 \\times 10^{24}$", "isCorrect": true, "image": null}, {"id": "hPGoS", "label": "B", "text": "$1.5055 \\times 10^{23}$", "isCorrect": false, "image": null}, {"id": "pxs2C", "label": "C", "text": "$3.011 \\times 10^{24}$", "isCorrect": false, "image": null}, {"id": "t42Zu", "label": "D", "text": "$3.011 \\times 10^{23}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Molar mass of dinitrogen ($N_2$) is $28 \\text{ g mol}^{-1}$<br><br>Number of moles of $N_2$ = $\\dfrac{70}{28} = 2.5 \\text{ mol}$<br><br>Number of molecules = $n \\times N_A$<br><br>Number of molecules = $2.5 \\times 6.022 \\times 10^{23} = 1.5055 \\times 10^{24}$<br><br>Answer: $1.5055 \\times 10^{24}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3288c30a4553e1be0ca", "type": "singleCorrect", "question": {"text": "How many moles of potassium chlorate are heated to produce $22.4\\ \\text{lit}$ of oxygen at STP ?", "image": null}, "options": [{"id": "QLzZz", "label": "A", "text": "$\\dfrac{1}{2}\\ \\text{mole}$", "isCorrect": false, "image": null}, {"id": "ySQDn", "label": "B", "text": "$\\dfrac{1}{3}\\ \\text{mole}$", "isCorrect": false, "image": null}, {"id": "2OScu", "label": "C", "text": "$\\dfrac{1}{4}\\ \\text{mole}$", "isCorrect": false, "image": null}, {"id": "NXzFY", "label": "D", "text": "$\\dfrac{2}{3}\\ \\text{mole}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The balanced chemical equation for the thermal decomposition of potassium chlorate is:<br><br>$2KClO_3 \\rightarrow 2KCl + 3O_2$<br><br>At STP, $22.4\\ \\text{lit}$ of oxygen gas corresponds to $1\\ \\text{mole}$ of $O_2$.<br><br>From the stoichiometry of the reaction, $3\\ \\text{moles}$ of $O_2$ are produced by heating $2\\ \\text{moles}$ of $KClO_3$.<br><br>Therefore, the number of moles of $KClO_3$ required to produce $1\\ \\text{mole}$ of $O_2$ is $\\dfrac{2}{3}\\ \\text{mole}$.<br><br>Answer: $\\dfrac{2}{3}\\ \\text{mole}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3428c30a4553e1be1db", "type": "singleCorrect", "question": {"text": "How many moles of potassium chlorate are heated to produce $11 \\cdot 2$ L oxygen at STP ?", "image": null}, "options": [{"id": "xNCcW", "label": "A", "text": "$\\dfrac{1}{2}$ mole", "isCorrect": false, "image": null}, {"id": "QZmda", "label": "B", "text": "$\\dfrac{1}{3}$ mole", "isCorrect": true, "image": null}, {"id": "3yklN", "label": "C", "text": "$\\dfrac{1}{4}$ mole", "isCorrect": false, "image": null}, {"id": "yVBvg", "label": "D", "text": "$\\dfrac{2}{3}$ mole", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The balanced chemical equation for the decomposition of potassium chlorate is:<br><br>$2KClO_{3} \\rightarrow 2KCl + 3O_{2}$<br><br>At STP, the volume of $1$ mole of an ideal gas is $22 \\cdot 4$ L.<br><br>Number of moles of $O_{2}$ produced is:<br><br>$n(O_{2}) = \\dfrac{11 \\cdot 2}{22 \\cdot 4} = \\dfrac{1}{2}$ mole<br><br>From the stoichiometry of the reaction, $3$ moles of $O_{2}$ are produced from $2$ moles of $KClO_{3}$.<br><br>Therefore, the number of moles of $KClO_{3}$ required to produce $\\dfrac{1}{2}$ mole of $O_{2}$ is:<br><br>$n(KClO_{3}) = \\dfrac{2}{3} \\times n(O_{2}) = \\dfrac{2}{3} \\times \\dfrac{1}{2} = \\dfrac{1}{3}$ mole<br><br>Answer: $\\dfrac{1}{3}$ mole", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c48c30a4553e1bdc96", "type": "singleCorrect", "question": {"text": "Calculate the number of molecules present in 2.24 $\\text{dm}^3$ of carbon dioxide at STP ?", "image": null}, "options": [{"id": "mPf3M", "label": "A", "text": "$2.011 \\times 10^{22}$", "isCorrect": false, "image": null}, {"id": "BSgxD", "label": "B", "text": "$3.011 \\times 10^{22}$", "isCorrect": false, "image": null}, {"id": "Y9WkI", "label": "C", "text": "$6.022 \\times 10^{22}$", "isCorrect": true, "image": null}, {"id": "Vnjl1", "label": "D", "text": "$0.1 \\times 10^{23}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Volume of $\\text{CO}_2$ at STP = $2.24 \\text{ dm}^3 = 2.24 \\text{ L}$<br><br>Molar volume of an ideal gas at STP = $22.4 \\text{ L}$<br><br>Number of moles of $\\text{CO}_2 = \\dfrac{2.24}{22.4} = 0.1 \\text{ mol}$<br><br>Number of molecules = Number of moles $\\times N_A$<br><br>Number of molecules = $0.1 \\times 6.022 \\times 10^{23} = 6.022 \\times 10^{22}$<br><br>Answer: $6.022 \\times 10^{22}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d28c30a4553e1bdd29", "type": "singleCorrect", "question": {"text": "The ratio of mass of 'x' atoms of an element to mass of carbon atoms is 9:1. Find the mass of 1 mol of x if molar mass of carbon is 12 g/mol.", "image": null}, "options": [{"id": "T3Mwy", "label": "A", "text": "$54\\ \\text{g}$", "isCorrect": false, "image": null}, {"id": "ZpUHf", "label": "B", "text": "$108\\ \\text{g}$", "isCorrect": true, "image": null}, {"id": "lIGFd", "label": "C", "text": "$180\\ \\text{g}$", "isCorrect": false, "image": null}, {"id": "ve51T", "label": "D", "text": "$216\\ \\text{g}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the mass of one atom of element 'x' be $m_x$ and the mass of one carbon atom be $m_C$.<br><br>Given that the ratio of the mass of an atom of element 'x' to the mass of a carbon atom is $9:1$, we have:<br><br>$\\dfrac{m_x}{m_C} = \\dfrac{9}{1}$<br><br>The ratio of their molar masses is equal to the ratio of their atomic masses:<br><br>$\\dfrac{M_x}{M_C} = 9$<br><br>Given the molar mass of carbon, $M_C = 12\\ \\text{g/mol}$, the molar mass of element 'x' is:<br><br>$M_x = 9 \\times 12 = 108\\ \\text{g/mol}$<br><br>Therefore, the mass of $1\\ \\text{mol}$ of element 'x' is $108\\ \\text{g}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3338c30a4553e1be143", "type": "singleCorrect", "question": {"text": "Calculate the amount of aluminium present in $\\text{Al}_2(\\text{SO}_4)_3$ if the compound contains 4 g of sulfur.<br>[Molar mass of sulfur = 32 g/mol , Molar mass of Al =27 g/mol ]", "image": null}, "options": [{"id": "iRa7a", "label": "A", "text": "$2.25$ g", "isCorrect": true, "image": null}, {"id": "aTv45", "label": "B", "text": "$2.50$ g", "isCorrect": false, "image": null}, {"id": "RdH08", "label": "C", "text": "$2.0$ g", "isCorrect": false, "image": null}, {"id": "tHwBY", "label": "D", "text": "$2.75$ g", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In one mole of $\\text{Al}_2(\\text{SO}_4)_3$, there are $2$ moles of Al and $3$ moles of S.<br><br>Mass of Al in $1$ mole of compound $= 2 \\times 27 = 54$ g<br><br>Mass of S in $1$ mole of compound $= 3 \\times 32 = 96$ g<br><br>The ratio of the mass of Al to the mass of S in the compound is $\\dfrac{54}{96} = \\dfrac{9}{16}$.<br><br>Given the mass of S is $4$ g, the mass of Al is calculated as:<br><br>Mass of Al $= 4 \\times \\dfrac{9}{16} = \\dfrac{9}{4} = 2.25$ g<br><br>Answer: $2.25$ g", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e18c30a4553e1bddcd", "type": "singleCorrect", "question": {"text": "Find the mass of sodium carbonate in grams to form 100 ml 0.1 M solution in water?<br>( Molar mass of $\\text{Na}_2\\text{CO}_3$ = 106 g/mol)", "image": null}, "options": [{"id": "9shPX", "label": "A", "text": "$1.06$ g", "isCorrect": true, "image": null}, {"id": "iUkt8", "label": "B", "text": "$3.18$ g", "isCorrect": false, "image": null}, {"id": "1CWDD", "label": "C", "text": "$2.12$ g", "isCorrect": false, "image": null}, {"id": "psMTT", "label": "D", "text": "$4.16$ g", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Molarity is given by the formula:<br><br>$M = \\dfrac{n}{V \\text{ (in L)}}$<br><br>Substituting the given values:<br><br>$0.1 = \\dfrac{n}{0.1}$<br><br>$n = 0.01$ moles<br><br>Mass of $\\text{Na}_2\\text{CO}_3$ is calculated as:<br><br>$w = n \\times \\text{Molar mass}$<br><br>$w = 0.01 \\times 106 = 1.06$ g<br><br>Answer: $1.06$ g", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29a8c30a4553e1bdad1", "type": "singleCorrect", "question": {"text": "$1$ g of $\\text{H}_2$ contains the same number of molecules as in", "image": null}, "options": [{"id": "Thrg5", "label": "A", "text": "$14$ g of $\\text{N}_2$", "isCorrect": true, "image": null}, {"id": "4ksBE", "label": "B", "text": "$18$ g of $\\text{H}_2\\text{O}$", "isCorrect": false, "image": null}, {"id": "0JBKw", "label": "C", "text": "$16$ g of $\\text{CO}$", "isCorrect": false, "image": null}, {"id": "vyLsf", "label": "D", "text": "$28$ g of $\\text{N}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Number of moles of $\\text{H}_2 = \\dfrac{1}{2} = 0.5$ mol.<br><br>Number of moles of $\\text{N}_2$ in $14$ g $= \\dfrac{14}{28} = 0.5$ mol.<br><br>Number of moles of $\\text{H}_2\\text{O}$ in $18$ g $= \\dfrac{18}{18} = 1$ mol.<br><br>Number of moles of $\\text{CO}$ in $16$ g $= \\dfrac{16}{28} = \\dfrac{4}{7}$ mol.<br><br>Number of moles of $\\text{N}_2$ in $28$ g $= \\dfrac{28}{28} = 1$ mol.<br><br>Since the number of moles of $1$ g of $\\text{H}_2$ and $14$ g of $\\text{N}_2$ are equal, they contain the same number of molecules.<br><br>Answer: $14$ g of $\\text{N}_2$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36d8c30a4553e1be39b", "type": "singleCorrect", "question": {"text": "Which of the following contains maximum number of molecules?", "image": null}, "options": [{"id": "okcMx", "label": "A", "text": "$0.4$ g $\\text{H}_2$ gas", "isCorrect": false, "image": null}, {"id": "lkvei", "label": "B", "text": "$3.2$ g of $\\text{O}_2$ gas", "isCorrect": false, "image": null}, {"id": "JA0ck", "label": "C", "text": "$16.8 \\text{ dm}^3$ of $\\text{H}_2$ gas at STP", "isCorrect": true, "image": null}, {"id": "strzA", "label": "D", "text": "$11.2 \\text{ dm}^3$ of $\\text{O}_2$ gas at STP", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The number of molecules is directly proportional to the number of moles.<br><br>Number of moles of $\\text{H}_2$ in $0.4$ g = $\\dfrac{0.4}{2} = 0.2$ mol<br><br>Number of moles of $\\text{O}_2$ in $3.2$ g = $\\dfrac{3.2}{32} = 0.1$ mol<br><br>Number of moles of $\\text{H}_2$ in $16.8 \\text{ dm}^3$ at STP = $\\dfrac{16.8}{22.4} = 0.75$ mol<br><br>Number of moles of $\\text{O}_2$ in $11.2 \\text{ dm}^3$ at STP = $\\dfrac{11.2}{22.4} = 0.5$ mol<br><br>Since $0.75$ mol is the maximum among the given options, $16.8 \\text{ dm}^3$ of $\\text{H}_2$ gas at STP contains the maximum number of molecules.<br><br>Answer: $16.8 \\text{ dm}^3$ of $\\text{H}_2$ gas at STP", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35e8c30a4553e1be305", "type": "singleCorrect", "question": {"text": "Calculate the volume of $99$ g of $\\text{CO}_2$ at STP ?", "image": null}, "options": [{"id": "zx2Tf", "label": "A", "text": "$22.4$ L", "isCorrect": false, "image": null}, {"id": "z6Ido", "label": "B", "text": "$50.4$ L", "isCorrect": true, "image": null}, {"id": "bOfiU", "label": "C", "text": "$67.2$ L", "isCorrect": false, "image": null}, {"id": "5myLJ", "label": "D", "text": "$89.6$ L", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Molar mass of $\\text{CO}_2 = 12 + 2 \\times 16 = 44 \\text{ g/mol}$<br><br>Number of moles of $\\text{CO}_2 = \\dfrac{99}{44} = 2.25 \\text{ moles}$<br><br>Volume of $1 \\text{ mole}$ of a gas at STP $= 22.4 \\text{ L}$<br><br>Volume of $2.25 \\text{ moles}$ of $\\text{CO}_2 = 2.25 \\times 22.4 = 50.4 \\text{ L}$<br><br>Answer: $50.4$ L", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b68c30a4553e1bdbfd", "type": "singleCorrect", "question": {"text": "Calculate the mass of $100$ molecules of oxygen in amu and in grams.", "image": null}, "options": [{"id": "fC6bo", "label": "A", "text": "$3200$ u and $5.314 \\times 10^{-21}$ g", "isCorrect": true, "image": null}, {"id": "TowGm", "label": "B", "text": "$1600$ u and $2.657 \\times 10^{-21}$ g", "isCorrect": false, "image": null}, {"id": "XrZ0n", "label": "C", "text": "$32$ u and $1.328 \\times 10^{-21}$ g", "isCorrect": false, "image": null}, {"id": "z8jhG", "label": "D", "text": "$8$ u and $3.978 \\times 10^{-21}$ g", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Mass of one oxygen molecule ($O_2$) = $2 \\times 16$ u = $32$ u.<br><br>Mass of $100$ oxygen molecules = $100 \\times 32$ u = $3200$ u.<br><br>Since $1$ u = $1.6605 \\times 10^{-24}$ g, the mass in grams is given by:<br><br>Mass = $3200 \\times 1.6605 \\times 10^{-24}$ g = $5.314 \\times 10^{-21}$ g.<br><br>Answer: $3200$ u and $5.314 \\times 10^{-21}$ g", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c00bf9280d7f9932e5f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the number of hydrogen atoms present in 5.4 g of urea?", "image": null}, "options": [{"id": "OC1pu", "text": "$9.011 \\times 10^{23}$", "image": null, "isCorrect": false}, {"id": "G72iM", "text": "$6.022 \\times 10^{23}$", "image": null, "isCorrect": false}, {"id": "ABBmZ", "text": "$2.168 \\times 10^{23}$", "image": null, "isCorrect": true}, {"id": "SEe0l", "text": "$3.011 \\times 10^{23}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The molecular formula of urea is $NH_2CONH_2$.<br><br>Molar mass of urea = $14 + 2 + 12 + 16 + 14 + 2 = 60 \\text{ g mol}^{-1}$.<br><br>Number of moles of urea = $\\dfrac{5.4}{60} = 0.09 \\text{ mol}$.<br><br>One molecule of urea contains 4 hydrogen atoms.<br><br>Number of moles of hydrogen atoms = $4 \\times 0.09 = 0.36 \\text{ mol}$.<br><br>Number of hydrogen atoms = $0.36 \\times 6.022 \\times 10^{23} = 2.16792 \\times 10^{23} \\approx 2.168 \\times 10^{23}$.<br><br>Answer: $2.168 \\times 10^{23}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bedbf9280d7f9932db0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate mass of 0.25 mole of iron (molar mass $=56 \\mathrm{~g} \\mathrm{~mol}^{-1}$ )", "image": null}, "options": [{"id": "j8CJo", "text": "$1.4 \\times 10^{-2} \\mathrm{~kg}$", "image": null, "isCorrect": true}, {"id": "N2yaz", "text": "$5.6 \\times 10^{-2} \\mathrm{~kg}$", "image": null, "isCorrect": false}, {"id": "6wpGn", "text": "$2.8 \\times 10^{-2} \\mathrm{~kg}$", "image": null, "isCorrect": false}, {"id": "EsngW", "text": "$4.2 \\times 10^{-2} \\mathrm{~kg}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Number of moles of iron, $n = 0.25 \\text{ mol}$<br><br>Molar mass of iron, $M = 56 \\text{ g mol}^{-1}$<br><br>Mass of iron, $m = n \\times M$<br><br>$m = 0.25 \\times 56 = 14 \\text{ g}$<br><br>Converting mass to kg:<br><br>$m = 14 \\times 10^{-3} \\text{ kg} = 1.4 \\times 10^{-2} \\text{ kg}$<br><br>Answer: $1.4 \\times 10^{-2} \\mathrm{~kg}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdbbf9280d7f9932d0e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate number of molecules present in 5.4 g of urea (Molar mass of urea $=60 \\mathrm{~g} \\mathrm{~mol}^{-1}$ )", "image": null}, "options": [{"id": "MHa1d", "text": "$6.022 \\times 10^{22}$", "image": null, "isCorrect": false}, {"id": "bl37X", "text": "$5.419 \\times 10^{22}$", "image": null, "isCorrect": true}, {"id": "GxPfc", "text": "$4.312 \\times 10^{22}$", "image": null, "isCorrect": false}, {"id": "uelXP", "text": "$9.933 \\times 10^{22}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Number of moles of urea $= \\dfrac{5.4}{60} = 0.09 \\text{ mol}$<br><br>Number of molecules $= \\text{Number of moles} \\times N_A$<br><br>Number of molecules $= 0.09 \\times 6.022 \\times 10^{23} = 5.4198 \\times 10^{22}$<br><br>Answer: $5.419 \\times 10^{22}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcdbf9280d7f9932c8c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Find out the total number of electrons present in 3.2 g methane?", "image": null}, "options": [{"id": "g5bNW", "text": "$6.022 \\times 10^{23}$", "image": null, "isCorrect": false}, {"id": "IWx2i", "text": "$1.204 \\times 10^{24}$", "image": null, "isCorrect": true}, {"id": "pcOLP", "text": "$3.201 \\times 10^{23}$", "image": null, "isCorrect": false}, {"id": "IT578", "text": "$4.821 \\times 10^{22}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molar mass of methane ($CH_4$) = $12 + 4 \\times 1 = 16 \\text{ g mol}^{-1}$<br><br>Number of moles of methane = $\\dfrac{3.2}{16} = 0.2 \\text{ mol}$<br><br>Number of molecules of methane = $0.2 \\times 6.022 \\times 10^{23}$<br><br>Number of electrons in one molecule of $CH_4$ = $6 \\text{ (from C)} + 4 \\times 1 \\text{ (from H)} = 10$<br><br>Total number of electrons = $0.2 \\times 6.022 \\times 10^{23} \\times 10$<br><br>$= 2 \\times 6.022 \\times 10^{23} = 1.2044 \\times 10^{24}$<br><br>Answer: $1.204 \\times 10^{24}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbabf9280d7f9932be5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Find the volume of 56 g dinitrogen at STP", "image": null}, "options": [{"id": "Ejy6E", "text": "$11.2 \\mathrm{Lit}$", "image": null, "isCorrect": false}, {"id": "59dOy", "text": "$22.4 \\mathrm{Lit}$", "image": null, "isCorrect": false}, {"id": "gUxAk", "text": "$44.8 \\mathrm{Lit}$", "image": null, "isCorrect": true}, {"id": "Ki2Pg", "text": "$67.2 \\mathrm{Lit}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molar mass of dinitrogen ($N_2$) = $28 \\text{ g mol}^{-1}$<br><br>Number of moles ($n$) = $\\dfrac{56}{28} = 2 \\text{ mol}$<br><br>Volume of 1 mole of a gas at STP = $22.4 \\text{ Lit}$<br><br>Volume of 56 g of $N_2$ at STP = $2 \\times 22.4 = 44.8 \\text{ Lit}$<br><br>Answer: $44.8 \\mathrm{Lit}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871badbf9280d7f9932b7d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Find out total number of electrons present in 1.6 g methane?", "image": null}, "options": [{"id": "Qgfmr", "text": "$6.022 \\times 10^{23}$", "image": null, "isCorrect": true}, {"id": "iMgLv", "text": "$6.022 \\times 10^{22}$", "image": null, "isCorrect": false}, {"id": "Brv1K", "text": "$6.022 \\times 10^{21}$", "image": null, "isCorrect": false}, {"id": "DG1z1", "text": "$4.022 \\times 10^{20}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molar mass of methane ($CH_4$) = $12 + 4 \\times 1 = 16$ g/mol<br><br>Number of moles of $CH_4$ = $\\dfra
