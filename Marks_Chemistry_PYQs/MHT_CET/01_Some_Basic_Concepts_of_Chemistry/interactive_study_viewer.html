rtName": "2010", "title": "MHT CET 2010"}], "question": {"text": "$4 \\mathrm{~L}$ -atm is equal to", "image": null}, "options": [{"id": "c0ByN", "text": "$40.50 \\mathrm{cal}$", "image": null, "isCorrect": false}, {"id": "BtOBb", "text": "$78.75 \\mathrm{cal}$", "image": null, "isCorrect": false}, {"id": "GCrhT", "text": "$95.23 \\mathrm{cal}$", "image": null, "isCorrect": false}, {"id": "NQ9oZ", "text": "$96 \\mathrm{cal}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\because 1 \\mathrm{~L}-\\mathrm{atm} &=101.266 \\mathrm{~J} \\\\ \\therefore 4 \\mathrm{~L}-\\mathrm{atm} &=101.266 \\times 4 \\mathrm{~J} \\\\ &=405.06 \\mathrm{~J} \\\\ &=\\frac{405.06}{4.2} \\mathrm{cal} \\quad[\\because 1 \\mathrm{cal}=4.2 \\mathrm{~J}] \\\\ &=96.4 \\mathrm{cal} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263450279619d9d8a3dac", "title": "Concentration terms", "totalQuestions": 24, "questions": [{"_id": "6792140f0aee93fa0796ddaa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "What is value of percent atom economy when reactants having sum of formula weight 78 u results in the formation of a product with formula weight 65 u ?", "image": null}, "options": [{"id": "UkMJx", "text": "$70 \\%$", "image": null, "isCorrect": false}, {"id": "6txyW", "text": "$78 \\%$", "image": null, "isCorrect": false}, {"id": "blviN", "text": "$83 \\%$", "image": null, "isCorrect": true}, {"id": "PkFR4", "text": "$65 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The formula for percent atom economy is given by:<br><br>$\\text{Percent atom economy} = \\dfrac{\\text{Formula weight of the desired product}}{\\text{Sum of formula weights of all reactants}} \\times 100$<br><br>Substituting the given values:<br><br>$\\text{Percent atom economy} = \\dfrac{65}{78} \\times 100$<br><br>$\\text{Percent atom economy} = \\dfrac{5}{6} \\times 100 = 83.33 \\%$<br><br>Rounding to the nearest integer, the percent atom economy is $83 \\%$.<br><br>Answer: $83 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140c0aee93fa0796dd8c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "What is the percentage by mass of oxygen in NaOH ?\r\n(Atomic mass of $\\mathrm{Na}=23 \\mathrm{u}, \\mathrm{O}=16 \\mathrm{u}, \\mathrm{H}=1 \\mathrm{u}$ )", "image": null}, "options": [{"id": "ZT9vk", "text": "16", "image": null, "isCorrect": false}, {"id": "7ADpW", "text": "20", "image": null, "isCorrect": false}, {"id": "KSmTV", "text": "40", "image": null, "isCorrect": true}, {"id": "OuRwV", "text": "60", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molar mass of $\\mathrm{NaOH} = 23 + 16 + 1 = 40 \\mathrm{u}$<br><br>Mass of oxygen in $\\mathrm{NaOH} = 16 \\mathrm{u}$<br><br>Percentage by mass of oxygen $= \\dfrac{16}{40} \\times 100 = 40\\%$<br><br>Answer: 40", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2619a0279619d9d8a2de4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "What is the relation between molality of the solution and molar mass of solute?", "image": null}, "options": [{"id": "fHWu2", "text": "$\\mathrm{m}=\\frac{\\mathrm{M}_2 \\mathrm{~W}_2}{1000 \\mathrm{~W}_1}$", "image": null, "isCorrect": false}, {"id": "8j0cn", "text": "$\\mathrm{m}=\\frac{1000 \\mathrm{~W}_2}{\\mathrm{M}_2 \\mathrm{~W}_1}$", "image": null, "isCorrect": true}, {"id": "manhj", "text": "$\\mathrm{m}=\\frac{1000 \\mathrm{~W}_1}{\\mathrm{M}_2 \\mathrm{~W}_2}$", "image": null, "isCorrect": false}, {"id": "o3TDi", "text": "$\\mathrm{m}=\\frac{\\mathrm{M}_2 \\mathrm{~W}_1}{1000 \\mathrm{~W}_2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{m}=\\frac{\\mathrm{W}_2}{\\mathrm{M}_2} \\times \\frac{1000}{\\mathrm{~W}_1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAtte  "vsMtA", "text": "$72 \\mathrm{u}$", "image": null, "isCorrect": true}, {"id": "P3Huz", "text": "$24 u$", "image": null, "isCorrect": false}, {"id": "SrXab", "text": "$30 \\mathrm{u}$", "image": null, "isCorrect": false}, {"id": "rAAS9", "text": "$80 u$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\% \\text { atom economy }=\\frac{\\text { Product } w t}{\\text { Reactant } w t} \\times 100 \\\\ & 75=\\frac{54}{x} \\times 100 \\\\ & x=72 u\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260e40279619d9d8a2824", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "What is the density of water in $\\mathrm{kg} \\mathrm{dm}^{-3}$ if it's density in $\\mathrm{g}^{\\mathrm{cm}^{-3}}$ is 0.863 ?", "image": null}, "options": [{"id": "2c9y3", "text": "$4.60$", "image": null, "isCorrect": false}, {"id": "N2pTd", "text": "$7.86$", "image": null, "isCorrect": false}, {"id": "zHmYl", "text": "$8.63$", "image": null, "isCorrect": false}, {"id": "VolXn", "text": "$0.863$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "If density in $\\mathrm{g} / \\mathrm{cm}^3$ is 0.863 density in $\\frac{0.863}{\\frac{1}{1000} \\mathrm{dm}^3} \\times \\frac{1}{100} \\mathrm{~kg}$\n$=0.863 \\frac{\\mathrm{kg}}{\\mathrm{dm}^3}$", "image": null}, "videoSolution": null, "syllabusCategory ater $=\\frac{180 \\mathrm{~g}}{18 \\mathrm{~g} / \\mathrm{mol}}=10 \\mathrm{~mol}$\nMole fraction of cane sugar $=\\frac{0.1}{0.1+10}=0.0099$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb90279619d9d8a1ebc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "What is the molarity of solution containing $3 \\cdot 2 \\mathrm{~g}$ of NaOH (Molar mass $40 \\mathrm{~g} \\mathrm{~mol}^{-1}$. In $250 \\mathrm{~cm}^{3}$ of water?", "image": null}, "options": [{"id": "BuMlH", "text": "$0.512 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "4TiUR", "text": "$0.32 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": true}, {"id": "CH2kn", "text": "$0.032 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "G02fy", "text": "$0.02 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Mass of NaOH (m) = 3.2 g\nThe volume of water (V) = 250 cm3 = 0.25 L\nMol. wt of NaOH (m) = 40 g/mol\nn = 3.2 / 40 = 0.08\nMolarity = 0.08/0.25 = 0.32 mol dm-3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": d": "ALpxz", "text": "$498.758g$", "image": null, "isCorrect": true}, {"id": "TjRiC", "text": "300g", "image": null, "isCorrect": false}, {"id": "KMfDY", "text": "600g", "image": null, "isCorrect": false}, {"id": "XxptP", "text": "200g", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Mass of solution $=100 \\mathrm{~g}$. Mass of solute $=0.25 \\mathrm{~g}$.\n$\\therefore$ Mass of solvent $=100-0.25=99.75 \\mathrm{~g}$.\n$0.25$ of solute is present in $99.75 \\mathrm{~g}$ of solvent\n$\\therefore 1.25 \\mathrm{~g} .$ of solute will be present in \n$\\frac{99.75 \\times 1.25}{0.25}=498.75 \\mathrm{~g}$ of solvent.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f6f0279619d9d8a1c74", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "What is the mass percentage of carbon in urea? (mol. mass of urea $=60 \\mathrm{~g} \\mathrm{~mol}^{-1}$ )", "image": null}, "options": [{"id": "GYu0X", "text": "$28 \\cdot 0 \\%$", "image": null, "isCorrect": false}, {"id": "rUkR4", "text": "$20 \\cdot 0 \\%$", "image": null, "isCorrect": true}, {"id": "kGTkH", "text": "$26.67 \\%$", "image": null, "isCorrect": false}, {"id": "YDQsl", "text": "$46.67 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The molecular formula of Urea is:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/eG7gYdZEFAQM9ELfVWpAHB61h38fUnqRkghSwijjThM.original.fullsize.png\"><br>\nWe know,\nMass percentage of carbon in urea $=\\frac{\\text { Molar mass of carbon }}{\\text { molar mass of urea }} \\times 100$\nThus, the molar mass of Ureas $=4 \\times 1+12+2 \\times 14+16=60$\n$\\therefore$ Mass percentage of Carbon in Ureas $=\\frac{12}{60} \\times 100=20 \\%$\nHence, option A is correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f5b0279619d9d8a1bce", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "Mole fraction of solute in it's 2 molal aqueous solution is", "image": null}, "options": [{"id": "OIRXb", "text": "$28.775$", "image": null, "isCorrect": false}, {"id": "zQwwS", "text": "$0.034$", "image": null, "isCorrect": true}, {"id": "QSkzN", "text": "$0.054$", "image": null, "isCorrect": false}, {"id": "0BccF", "text": "$0.018$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No. of moles of solute $=2$\nMass of solvent $=1 \\mathrm{~kg}$\nSince it is an aqueous solution, thus the solvent must be water.\nMoles of solvent $=\\frac{1000}{18}=55.5$ moles\nMole fraction of solute $=\\frac{2}{57.5}=0.0347$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z",     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
