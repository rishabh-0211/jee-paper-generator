p Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260510279619d9d8a2384", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "Dissociation constant of propionic acid is $1.32 \\times 10^{-5}$. Calculate the degree of dissociation of acid in $0.05 \\mathrm{M}$ solution.", "image": null}, "options": [{"id": "JHgXv", "text": "$2.6 \\times 10^{-4}$", "image": null, "isCorrect": false}, {"id": "eux7p", "text": "$1.61 \\times 10^{-2}$", "image": null, "isCorrect": true}, {"id": "1bfsr", "text": "$1.90 \\times 10^{-2}$", "image": null, "isCorrect": false}, {"id": "mlYuA", "text": "$3.5 \\times 10^{-5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{COOH}$ (Propionic Acid)\n$$\n\\begin{aligned}\n& \\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{COOH}_{(\\mathrm{aq})} \\rightleftharpoons \\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{COO}_{(\\mathrm{aq})}^{-}+\\mathrm{H}_{(\\mathrm{aq})}^{+} \\\\\n& \\mathrm{t}=0_1 \\quad \\mathrm{C} \\\\\n& \\mathrm{t}=\\mathrm{t}_{\\mathrm{aq}}, \\quad \\mathrm{C}-\\mathrm{C} \\propto \\quad \\mathrm{C} \\propto \\quad \\mathrm{C} \\propto \\\\\n& \\mathrm{k}_{\\mathrm{a}}=\\frac{\\mathrm{c} \\propto^2}{1-\\propto} \\quad(1-\\propto \\simeq 1) \\\\\n&\n\\end{aligned}\n$$\n\n\n$$\n\\begin{aligned}\n& \\propto=\\sqrt{\\frac{\\mathrm{k}_{\\mathrm{a}}}{\\mathrm{C}}}=\\sqrt{\\frac{1.32 \\times 10^{-5}}{0.05}}=\\sqrt{\\frac{132 \\times 10^{-1}}{5}} \\times 10^{-2} \\quad \\mathrm{k}_{\\mathrm{a}}=\\mathrm{c}^2 \\\\\n& =\\sqrt{2.64} \\times 10^{-2}=1.61 \\times 10^{-2}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2603c0279619d9d8a22d8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "The $\\mathrm{pH}$ of $0.1 \\mathrm{M}$ solution of monobasic acid is 2.34 . Calculate the degree of dissociation of the acid.", "image": null}, "options": [{"id": "xcmA9", "text": "$3.1 \\times 10^{-2}$", "image": null, "isCorrect": false}, {"id": "9VrUR", "text": "$4.5 \\times 10^{-2}$", "image": null, "isCorrect": true}, {"id": "qOFiA", "text": "$2.18 \\times 10^{-2}$", "image": null, "isCorrect": false}, {"id": "8Kkch", "text": "$2.5 \\times 10^{-3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{pH}=2.34, \\mathrm{c}=0.1 \\mathrm{M}\n$$\n(i) $\\mathrm{pH}=-\\log _{10}\\left[\\mathrm{H}^{+}\\right]$\n$$\n\\begin{gathered}\n\\log _{10}\\left[\\mathrm{H}^{+}\\right]=-\\mathrm{pH}=-2.34 \\\\\n=-2-0.34-1+1 \\\\\n=-3+0.66=\\overline{3} .66\n\\end{gathered}\n$$\n$$\n\\therefore\\left[\\mathrm{H}^{+}\\right]=\\text {antilog } \\overline{3} .66\n$$\n$$\n=4.571 \\times 10^{-3} \\mathrm{~mol} \\mathrm{dm}^{-3}\n$$\n(ii) $\\left[\\mathrm{H}^{+}\\right]=\\mathrm{c} \\alpha$\n$$\n\\therefore \\alpha=\\frac{\\left[\\mathrm{H}^{+}\\right]}{\\mathrm{c}}=\\frac{4.571 \\times 10^{-3}}{0.1}=4.571 \\times 10^{-2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "held     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
