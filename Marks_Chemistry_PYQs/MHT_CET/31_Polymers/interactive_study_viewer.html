l": "A", "text": "phenol , chloroform", "isCorrect": false, "image": null}, {"id": "E7Eda", "label": "B", "text": "formaldehyde , NaOH", "isCorrect": false, "image": null}, {"id": "BqFiC", "label": "C", "text": "phenol , methanal", "isCorrect": true, "image": null}, {"id": "7qpCx", "label": "D", "text": "aniline , urea", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Bakelite is a condensation polymer formed by the reaction of phenol with formaldehyde in the presence of either an acid or a base catalyst.<br><br>The IUPAC name of formaldehyde is methanal.<br><br>Therefore, the monomers used to prepare bakelite are phenol and methanal.<br><br>Answer: phenol , methanal", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31c8c30a4553e1be047", "type": "singleCorrect", "question": {"text": "Which of the following polymers has ester linkage?", "image": null}, "options": [{"id": "NauGw", "label": "A", "text": "Orlon", "isCorrect": false, "image": null}, {"id": "Z3pqS", "label": "B", "text": "Dacron", "isCorrect": true, "image": null}, {"id": "Gr7mM", "label": "C", "text": "Teflon", "isCorrect": false, "image": null}, {"id": "5GObU", "label": "D", "text": "Neoprene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Dacron (also known as polyethylene terephthalate or PET) is a condensation polymer formed by the reaction of ethylene glycol and terephthalic acid. Since it is formed by the condensation of an alcohol and a carboxylic acid, it contains ester linkages ($-COO-$) and is classified as a polyester.<br><br>Orlon (polyacrylonitrile), Teflon (polytetrafluoroethylene), and Neoprene (polychloroprene) are addition polymers and do not contain ester linkages.<br><br>Answer: Dacron", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31c8c30a4553e1be046", "type": "singleCorrect", "question": {"text": "Which properties from following is improved by vulcanization of rubber?", "image": null}, "options": [{"id": "H4FEk", "label": "A", "text": "Plasticity", "isCorrect": false, "image": null}, {"id": "8vtov", "label": "B", "text": "Solubility in water", "isCorrect": false, "image": null}, {"id": "Lh4MT", "label": "C", "text": "Tensile strength", "isCorrect": true, "image": null}, {"id": "RmOI2", "label": "D", "text": "Electrical conductivity", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Natural rubber becomes soft at high temperatures and brittle at low temperatures. It also shows high water absorption capacity, is soluble in non-polar solvents, and has low tensile strength.<br><br>To improve these physical properties, vulcanization is carried out by heating a mixture of raw rubber with sulfur and an appropriate additive. This process introduces sulfur cross-links between the polymer chains.<br><br>As a result of vulcanization, the rubber becomes more elastic, less plastic, insoluble in organic solvents, and its tensile strength is significantly improved.<br><br>Answer: Tensile strength", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29e8c30a4553e1bdb02", "type": "singleCorrect", "question": {"text": "Name the catalyst used in the manufacture of HDPE polymer.", "image": null}, "options": [{"id": "NzLv2", "label": "A", "text": "Triethyl aluminum with titanium tetrachloride", "isCorrect": true, "image": null}, {"id": "p9ONT", "label": "B", "text": "Triethyl aluminum with zinc chloride", "isCorrect": false, "image": null}, {"id": "cNx99", "label": "C", "text": "Triethyl aluminum with nickel chloride", "isCorrect": false, "image": null}, {"id": "SYV2V", "label": "D", "text": "Triethyl aluminum with stannic chloride", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "High-density polyethylene (HDPE) is manufactured by the coordination polymerization of ethene using a Ziegler-Natta catalyst.<br><br>The Ziegler-Natta catalyst is a mixture of triethyl aluminum, $(C_2H_5)_3Al$, and titanium tetrachloride, $TiCl_4$.<br><br>Answer: Triethyl aluminum with titanium tetrachloride", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3718c30a4553e1be3cb", "type": "singleCorrect", "question": {"text": "Identify the monomer used to prepare orlon.", "image": null}, "options": [{"id": "l3lPA", "label": "A", "text": "vinyl chloride", "isCorrect": false, "image": null}, {"id": "qMHVW", "label": "B", "text": "acrylonitrile", "isCorrect": true, "image": null}, {"id": "Fou4l", "label": "C", "text": "styrene", "isCorrect": false, "image": null}, {"id": "picxR", "label": "D", "text": "tetrafluoroethylene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Orlon is the trade name for polyacrylonitrile (PAN).<br><br>It is an addition polymer formed by the polymerisation of acrylonitrile.<br><br>The chemical reaction is:<br><br>$n CH_2=CH-CN \\xrightarrow{\\text{Polymerisation}} [-CH_2-CH(CN)-]_n$<br><br>Thus, the monomer used to prepare orlon is acrylonitrile.<br><br>Answer: acrylonitrile", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3638c30a4553e1be334", "type": "singleCorrect", "question": {"text": "Which of the following is the monomer of Teflon polymer?", "image": null}, "options": [{"id": "W0Vp1", "label": "A", "text": "$\\text{FCH} = \\text{CH}_2$", "isCorrect": false, "image": null}, {"id": "sExka", "label": "B", "text": "$\\text{FCH} = \\text{CHF}$", "isCorrect": false, "image": null}, {"id": "1OPGI", "label": "C", "text": "$\\text{CF}_3 = \\text{CF}_3$", "isCorrect": false, "image": null}, {"id": "QmKk8", "label": "D", "text": "$\\text{CF}_2 = \\text{CF}_2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Teflon is the commercial name for polytetrafluoroethylene (PTFE).<br><br>It is an addition polymer formed by the polymerization of tetrafluoroethylene.<br><br>The chemical formula of the monomer tetrafluoroethylene is $\\text{CF}_2 = \\text{CF}_2$.<br><br>Answer: $\\text{CF}_2 = \\text{CF}_2$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ba8c30a4553e1bdc2d", "type": "singleCorrect", "question": {"text": "Which of the following compounds are used to obtain terylene polymer?", "image": null}, "options": [{"id": "N8vo6", "label": "A", "text": "Ethane-1,2-diol and Benzene-1,3 dicarboxylic acid", "isCorrect": false, "image": null}, {"id": "vJHg8", "label": "B", "text": "Propane-1, 2-diol and Benzene-1, 4 dicarboxylic acid", "isCorrect": false, "image": null}, {"id": "ZqXvY", "label": "C", "text": "Ethane-1,2-diol and Benzene-1, 4 dicarboxylic acid", "isCorrect": true, "image": null}, {"id": "JBhS7", "label": "D", "text": "Ethane-1,2-diol and Benzene-1, 2 dicarboxylic acid", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Terylene, also known as Dacron, is a polyester.<br><br>It is prepared by the condensation polymerization of ethylene glycol and terephthalic acid.<br><br>The IUPAC name of ethylene glycol is ethane-1,2-diol.<br><br>The IUPAC name of terephthalic acid is benzene-1,4-dicarboxylic acid.<br><br>Therefore, the monomers used to obtain terylene are ethane-1,2-diol and benzene-1,4-dicarboxylic acid.<br><br>Answer: Ethane-1,2-diol and Benzene-1, 4 dicarboxylic acid", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ba8c30a4553e1bdc2c", "type": "singleCorrect", "question": {"text": "Which of the following polymers is also called as dacron?", "image": null}, "options": [{"id": "ZhOT6", "label": "A", "text": "Teflon", "isCorrect": false, "image": null}, {"id": "Blgcc", "label": "B", "text": "PVC", "isCorrect": false, "image": null}, {"id": "SJU8w", "label": "C", "text": "Bakelite", "isCorrect": false, "image": null}, {"id": "bA7jS", "label": "D", "text": "Terylene", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Dacron is the trade name for the polymer polyethylene terephthalate (PET) in the United States, while in the United Kingdom, it is commonly known as Terylene.<br><br>It is a polyester made by the condensation polymerization of ethylene glycol and terephthalic acid.<br><br>Therefore, Terylene is also called Dacron.<br><br>Answer: Terylene", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bfebf9280d7f9932e4c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the name of monomer used in the formation of a polymer\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/cNuW3oLl5tshtWxRmJUry2m1UJDit5TDxb9DhobpbH4.original.fullsize.png\"><br> ?", "image": null}, "options": [{"id": "MCBe8", "text": "Isoprene", "image": null, "isCorrect": true}, {"id": "rzWCK", "text": "Tetrafluoroethylene", "image": null, "isCorrect": false}, {"id": "h1Zk2", "text": "Acrylonitrile", "image": null, "isCorrect": false}, {"id": "5Kz12", "text": "Caprolactum", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given polymer structure is $[-\\text{CH}_2 - \\text{C}(\\text{CH}_3) = \\text{CH} - \\text{CH}_2-]_n$.<br><br>This is the structure of polyisoprene, which is commonly known as natural rubber.<br><br>The monomer used to form this polymer is isoprene (IUPAC name: 2-methyl-1,3-butadiene).<br><br>The structure of isoprene is $\\text{CH}_2 = \\text{C}(\\text{CH}_3) - \\text{CH} = \\text{CH}_2$. Upon addition polymerization, the double bonds rearrange to form the repeating unit shown in the question.<br><br>Answer: Isoprene", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871befbf9280d7f9932dc8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following polymers is used as surgical suture?", "image": null}, "options": [{"id": "gO2Hx", "text": "Nylon 6,6", "image": null, "isCorrect": true}, {"id": "FABkA", "text": "HDP", "image": null, "isCorrect": false}, {"id": "MCHWc", "text": "Polyacrylonitrile", "image": null, "isCorrect": false}, {"id": "sIFvU", "text": "Nylon 6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nylon 6,6 is a polyamide polymer which is strong and has high tensile strength. It is widely used in the manufacture of sheets, bristles for brushes, surgical sutures, and textile fabrics.<br><br>High-density polyethylene (HDP) is used for making buckets, dustbins, bottles, and pipes.<br><br>Polyacrylonitrile is used as a substitute for wool in making commercial yarns like orlon or acrilan.<br><br>Nylon 6 is used for the manufacture of tyre cords, fabrics, and ropes.<br><br>Answer: Nylon 6,6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be1bf9280d7f9932d3f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following polymers is used to obtain surgical sutures?", "image": null}, "options": [{"id": "VLBks", "text": "Nylon 6", "image": null, "isCorrect": false}, {"id": "XmPHc", "text": "Nylon 6,6", "image": null, "isCorrect": true}, {"id": "EKSNS", "text": "Terylene", "image": null, "isCorrect": false}, {"id": "kcw1F", "text": "Neoprene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nylon 6,6 is a high molecular mass linear condensation polymer that possesses high tensile strength. It is spun into fibres and is widely used for making sheets, bristles for brushes, surgical sutures, and textile fabrics.<br><br>Nylon 6 is used for the manufacture of tyre cords, fabrics, and ropes.<br><br>Terylene is used for making wrinkle-free fabrics and blending with cotton and wool.<br><br>Neoprene is used for the manufacture of chemical containers, conveyer belts, gaskets, and hoses.<br><br>Therefore, Nylon 6,6 is the polymer used to obtain surgical sutures.<br><br>Answer: Nylon 6,6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdfbf9280d7f9932d2a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the monomers used in preparation of dacron .", "image": null}, "options": [{"id": "7c18B", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{OH}$ and $\\mathrm{CH}_2 \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "eNISr", "text": "$\\mathrm{H}_2 \\mathrm{C}=\\mathrm{CH}-\\mathrm{CH}=\\mathrm{CH}_2$ and $\\mathrm{H}_2 \\mathrm{C}=\\mathrm{CH}-\\mathrm{CN}$", "image": null, "isCorrect": false}, {"id": "8jMYE", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/d7mUKAMO_IsZ1qD_nl-FM0qRqpENVoUeu6ykRQqwMgA.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "2S4GB", "text": "$\\mathrm{H}_2 \\mathrm{C}=\\mathrm{CH}-\\mathrm{CN}$ and $\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{OH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Dacron, also known as terylene, is a polyester polymer.<br><br>It is prepared by the condensation polymerization of ethylene glycol (ethane-1,2-diol) and terephthalic acid (benzene-1,4-dicarboxylic acid) at high temperatures.<br><br>The chemical structure of ethylene glycol is $\\mathrm{HO}-(\\mathrm{CH}_2)_2-\\mathrm{OH}$.<br><br>The chemical structure of terephthalic acid is a benzene ring with two carboxylic acid groups at para positions, i.e., $\\mathrm{HOOC}-\\mathrm{C}_6\\mathrm{H}_4-\\mathrm{COOH}$.<br><br>These structures match the ones provided in the image.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/d7mUKAMO_IsZ1qD_nl-FM0qRqpENVoUeu6ykRQqwMgA.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcfbf9280d7f9932c9f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What are the compounds used to obtain nylon salt?", "image": null}, "options": [{"id": "FUfqG", "text": "Adipic acid and ammonia", "image": null, "isCorrect": false}, {"id": "nSa4L", "text": "Terephthalic acid and hexamethylenediamine", "image": null, "isCorrect": false}, {"id": "qXqvN", "text": "Adipic acid and hexamethylenediamine", "image": null, "isCorrect": true}, {"id": "niZJC", "text": "$\\beta$-hydroxybutyric acid and hexamethylenediamine", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nylon salt, also known as hexamethylenediammonium adipate, is an intermediate formed during the preparation of Nylon-6,6.<br><br>It is obtained by the neutralization reaction between a dicarboxylic acid and a diamine. Specifically, adipic acid (a 6-carbon dicarboxylic acid) reacts with hexamethylenediamine (a 6-carbon diamine) to form this salt.<br><br>The reaction is:<br>$HOOC-(CH_2)_4-COOH + H_2N-(CH_2)_6-NH_2 \\rightarrow [^-OOC-(CH_2)_4-COO^-][^+H_3N-(CH_2)_6-NH_3^+]$<br><br>Upon heating, nylon salt loses water molecules to undergo condensation polymerization, yielding the polyamide Nylon-6,6.<br><br>Answer: Adipic acid and hexamethylenediamine", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bccbf9280d7f9932c80", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following polymers does NOT contain either —COO— or —CO—NH— linkage in it?", "image": null}, "options": [{"id": "hWpF0", "text": "Perspex", "image": null, "isCorrect": false}, {"id": "kgMLV", "text": "Polyacrylamide", "image": null, "isCorrect": false}, {"id": "TiVvP", "text": "Glyptal", "image": null, "isCorrect": false}, {"id": "bwNPZ", "text": "Thermocol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Perspex is polymethyl methacrylate (PMMA), which contains an ester group ($\\text{—COO—}$).<br><br>Polyacrylamide is an addition polymer of acrylamide, which contains an amide group ($\\text{—CONH}_2$).<br><br>Glyptal is a polyester formed from ethylene glycol and phthalic acid, which contains ester linkages ($\\text{—COO—}$).<br><br>Thermocol is polystyrene, which is an addition polymer of styrene. It is a pure hydrocarbon polymer and does not contain any ester or amide linkages.<br><br>Answer: Thermocol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbebf9280d7f9932c07", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the monomers used in preparation of Nylon 2- nylon 6", "image": null}, "options": [{"id": "dF2cp", "text": "Glycine and $\\epsilon$ amino caproic acid", "image": null, "isCorrect": true}, {"id": "Ff3Gn", "text": "$\\beta$ - hydroxy butyric acid and $\\beta$ - hydroxy valeric acid", "image": null, "isCorrect": false}, {"id": "AMaox", "text": "Ethylene glycol and phthalic acid", "image": null, "isCorrect": false}, {"id": "yP3SE", "text": "Acrylamide and vinylchloride", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nylon 2-nylon 6 is an alternating polyamide copolymer which is biodegradable in nature.<br><br>The monomers used in the preparation of Nylon 2-nylon 6 are glycine ($\\text{H}_2\\text{N}-\\text{CH}_2-\\text{COOH}$) which contains 2 carbon atoms, and $\\epsilon$-amino caproic acid ($\\text{H}_2\\text{N}-(\\text{CH}_2)_5-\\text{COOH}$) which contains 6 carbon atoms.<br><br>Answer: Glycine and $\\epsilon$ amino caproic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbdbf9280d7f9932c01", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following house hold plastic material is used to prepare drinking straws ?", "image": null}, "options": [{"id": "GfrFG", "text": "PVC", "image": null, "isCorrect": false}, {"id": "iT0D9", "text": "LDPE", "image": null, "isCorrect": false}, {"id": "B59jG", "text": "PS", "image": null, "isCorrect": false}, {"id": "qaO60", "text": "PP", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Polypropylene (PP) is a thermoplastic polymer that is tough, heat-resistant, and highly resistant to chemical solvents, bases, and acids.<br><br>Due to its flexibility, non-toxicity, and food-safe nature, it is widely used in the manufacture of household plastic materials such as drinking straws, food containers, reusable water bottles, and bottle caps.<br><br>Answer: PP", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbabf9280d7f9932bea", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following polymers is used as wool substitute?", "image": null}, "options": [{"id": "NrEHV", "text": "Glyptal", "image": null, "isCorrect": false}, {"id": "n6kvF", "text": "Polyacrylonitrile", "image": null, "isCorrect": true}, {"id": "FZIN4", "text": "Terylene", "image": null, "isCorrect": false}, {"id": "31Hd5", "text": "Neoprene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Polyacrylonitrile (PAN) is an addition polymer of acrylonitrile. It is used as a substitute for wool in making commercial fibres such as Orlon or Acrilan, which are used for making blankets, sweaters, etc.<br><br>Glyptal is used in the manufacture of paints and lacquers.<br><br>Terylene is used in blending with cotton or wool and in safety helmets.<br><br>Neoprene is a synthetic rubber used for manufacturing conveyor belts, gaskets, and hoses.<br><br>Answer: Polyacrylonitrile", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871babbf9280d7f9932b72", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following polymers is used to obtain rubber belts?", "image": null}, "options": [{"id": "kNiR7", "text": "Buna-N", "image": null, "isCorrect": true}, {"id": "d1597", "text": "Perspex", "image": null, "isCorrect": false}, {"id": "VH6oF", "text": "PVC", "image": null, "isCorrect": false}, {"id": "M6Jz7", "text": "Polycarbonate", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Buna-N is a synthetic rubber which is a copolymer of 1,3-butadiene and acrylonitrile. It is highly resistant to the action of petrol, lubricating oils, and organic solvents. Because of these properties, Buna-N is widely used in making oil seals, tank linings, hoses, and rubber belts.<br><br>Perspex (Polymethyl methacrylate) is a transparent thermoplastic used as a glass substitute.<br><br>PVC (Polyvinyl chloride) is used for making pipes, raincoats, and cable insulation.<br><br>Polycarbonate is a tough, transparent plastic used in bulletproof glass and optical discs.<br><br>Answer: Buna-N", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871babbf9280d7f9932b69", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify polyamide polymer from following.", "image": null}, "options": [{"id": "F7Jg4", "text": "SBR", "image": null, "isCorrect": false}, {"id": "4gL0E", "text": "Melamine formaldehyde polymer", "image": null, "isCorrect": false}, {"id": "TdDHL", "text": "Bakelite", "image": null, "isCorrect": false}, {"id": "Ac5kO", "text": "Nylon 6,6", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Nylon 6,6 is a condensation polymer formed by the reaction of hexamethylenediamine and adipic acid. The monomers are linked together by amide linkages ($-CO-NH-$). Therefore, Nylon 6,6 is a polyamide polymer.<br><br>SBR is an addition copolymer of styrene and butadiene.<br><br>Melamine formaldehyde polymer is a cross-linked amino resin.<br><br>Bakelite is a cross-linked phenol-formaldehyde resin.<br><br>Answer: Nylon 6,6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9bbf9280d7f9932ad4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following is a polyester fibre?", "image": null}, "options": [{"id": "gwmcP", "text": "PHBV", "image": null, "isCorrect": true}, {"id": "Q9cr5", "text": "Urea formaldehyde", "image": null, "isCorrect": false}, {"id": "sYDGM", "text": "Thermocol", "image": null, "isCorrect": false}, {"id": "kZIgY", "text": "Polyacrylonitrile", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "PHBV (Poly $\\beta$-hydroxybutyrate-co-$\\beta$-hydroxyvalerate) is a copolymer of 3-hydroxybutanoic acid and 3-hydroxypentanoic acid. The monomers are linked by ester bonds, making it an aliphatic polyester.<br><br>Urea formaldehyde is a thermosetting condensation polymer.<br><br>Thermocol is polystyrene, which is an addition polymer.<br><br>Polyacrylonitrile is an addition polymer of acrylonitrile.<br><br>Therefore, PHBV is the only polyester among the given options.<br><br>Answer: PHBV", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8dbf9280d7f9932a4d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What are the monomers used in preparation of PHBV?", "image": null}, "options": [{"id": "xw6ci", "text": "$\\mathrm{HOOC}-\\left(\\mathrm{CH}_2\\right)_4-\\mathrm{COOH}$ and $\\mathrm{H}_2 \\mathrm{~N}-\\left(\\mathrm{CH}_2\\right)_6-\\mathrm{NH}_2$", "image": null, "isCorrect": false}, {"id": "leXQk", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/TgD16tEjsqhomuNikWD9_YU3gPsLE2Rs29SY1yNCQyI.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "vRBMs", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/RiHp2gR7-wgKwfqkj0awNhgu-hNq4PIhxGZJiL_ZVl8.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "UYng5", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{OH}$ and $\\mathrm{CH}_2 \\mathrm{O}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "PHBV (Poly $\\beta$-hydroxybutyrate-co-$\\beta$-hydroxyvalerate) is a biodegradable copolymer.<br><br>It is prepared by the copolymerization of 3-hydroxybutanoic acid and 3-hydroxypentanoic acid.<br><br>The structure of 3-hydroxybutanoic acid is $\\mathrm{HO-CH(CH_3)-CH_2-COOH}$.<br><br>The structure of 3-hydroxypentanoic acid is $\\mathrm{HO-CH(CH_2CH_3)-CH_2-COOH}$.<br><br>These monomers match the structures given in the third option.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/RiHp2gR7-wgKwfqkj0awNhgu-hNq4PIhxGZJiL_ZVl8.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8cbf9280d7f9932a44", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following polymers is used to obtain oil seals?", "image": null}, "options": [{"id": "QugX2", "text": "Teflon", "image": null, "isCorrect": true}, {"id": "D6gCY", "text": "Dacron", "image": null, "isCorrect": false}, {"id": "s4qp8", "text": "Nylon 6", "image": null, "isCorrect": false}, {"id": "eX1AO", "text": "LDP", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Teflon (polytetrafluoroethylene) is chemically inert and resistant to heat and corrosive liquids. Due to these properties, it is widely used in making non-stick cookware, oil seals, valves, and gaskets.<br><br>Dacron is used for making wrinkle-free fabrics.<br><br>Nylon 6 is used for making tyre cords, fabrics, and ropes.<br><br>LDP is used for making pipes, toys, and squeeze bottles.<br><br>Answer: Teflon", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7dbf9280d7f99329b8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following polymers contains $-\\mathrm{CO}-\\mathrm{NH}-$ linkage ?", "image": null}, "options": [{"id": "zpyAj", "text": "Glyptal", "image": null, "isCorrect": false}, {"id": "WrZ0L", "text": "Thermocol", "image": null, "isCorrect": false}, {"id": "Smz2z", "text": "Buna-N", "image": null, "isCorrect": false}, {"id": "GgLp0", "text": "Urea formaldehyde resin", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Glyptal is a polyester formed by the condensation of ethylene glycol and phthalic acid, so it contains ester ($-\\mathrm{COO}-$) linkages.<br><br>Thermocol is a commercial name for polystyrene, which is an addition polymer of styrene and contains only carbon-carbon bonds in its backbone.<br><br>Buna-N is an addition copolymer of 1,3-butadiene and acrylonitrile, containing carbon-carbon bonds and nitrile groups, but no amide linkages.<br><br>Urea formaldehyde resin is a condensation polymer of urea ($\\mathrm{NH_2-CO-NH_2}$) and formaldehyde ($\\mathrm{HCHO}$). The polymerization involves the formation of cross-links between urea molecules via methylene ($-\\mathrm{CH_2}-$) bridges, resulting in a structure that contains $-\\mathrm{CO}-\\mathrm{NH}-$ linkages.<br><br>Answer: Urea formaldehyde resin", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7cbf9280d7f99329ae", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify a monomer used in preparation of neoprene.", "image": null}, "options": [{"id": "js48M", "text": "2-methyl-1,3-butadiene", "image": null, "isCorrect": false}, {"id": "YxsLH", "text": "2-chloro-1,3-butadiene", "image": null, "isCorrect": true}, {"id": "vLMu6", "text": "Melamine", "image": null, "isCorrect": false}, {"id": "istZX", "text": "1,3-butadiene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Neoprene is a synthetic rubber formed by the free radical polymerization of chloroprene.<br><br>The IUPAC name of chloroprene is 2-chloro-1,3-butadiene, and its chemical structure is $CH_2=C(Cl)-CH=CH_2$.<br><br>Therefore, the monomer used in the preparation of neoprene is 2-chloro-1,3-butadiene.<br><br>Answer: 2-chloro-1,3-butadiene", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6dbf9280d7f9932923", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following polymers is used to prepare shoe soles?", "image": null}, "options": [{"id": "vbDho", "text": "Polyacrylamide", "image": null, "isCorrect": false}, {"id": "bmovJ", "text": "Perspex", "image": null, "isCorrect": false}, {"id": "bSlfa", "text": "Buna-N", "image": null, "isCorrect": true}, {"id": "9pfFg", "text": "Glyptal", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Buna-N (Nitrile rubber) is a synthetic rubber which is a copolymer of butadiene and acrylonitrile.<br><br>It is resistant to the action of petrol, lubricating oils, and organic solvents.<br><br>Due to its toughness and resistance to wear and tear, Buna-N is widely used in the manufacture of shoe soles, oil seals, hoses, and tank linings.<br><br>Answer: Buna-N", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6bbf9280d7f993290c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the monomer of natural rubber.", "image": null}, "options": [{"id": "mlm5a", "text": "Isoprene", "image": null, "isCorrect": true}, {"id": "SeFEi", "text": "Polyacrylonitrile", "image": null, "isCorrect": false}, {"id": "XNRT1", "text": "Chloroprene", "image": null, "isCorrect": false}, {"id": "g7K5A", "text": "Tetrafluoroethylene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Natural rubber is a linear polymer of isoprene (2-methyl-1,3-butadiene).<br><br>Chloroprene is the monomer of synthetic rubber (neoprene).<br><br>Tetrafluoroethylene is the monomer of Teflon.<br><br>Polyacrylonitrile is a polymer of acrylonitrile.<br><br>Answer: Isoprene", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b59bf9280d7f9932877", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the use of glyptal", "image": null}, "options": [{"id": "f3Tg9", "text": "To prepare gel used in electrophoresis.", "image": null, "isCorrect": false}, {"id": "idmPa", "text": "To obtain paints.", "image": null, "isCorrect": true}, {"id": "v9sOo", "text": "To obtain decorative laminates.", "image": null, "isCorrect": false}, {"id": "sKP9p", "text": "To obtain food grade plastic container.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Glyptal is a polyester formed by the condensation polymerization of ethylene glycol and phthalic acid.<br><br>It is primarily used in the manufacture of paints, coatings, and lacquers.<br><br>Answer: To obtain paints.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b47bf9280d7f99327c9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following compounds the thermocol is obtained?", "image": null}, "options": [{"id": "MuWyE", "text": "Bisphenol", "image": null, "isCorrect": false}, {"id": "HrKES", "text": "Vinylchloride", "image": null, "isCorrect": false}, {"id": "3ARil", "text": "Styrene", "image": null, "isCorrect": true}, {"id": "iovY0", "text": "Butadiene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Thermocol is a commercial name for expanded polystyrene.<br><br>Polystyrene is an addition polymer obtained by the polymerization of the monomer styrene.<br><br>Therefore, thermocol is obtained from styrene.<br><br>Answer: Styrene", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3bbf9280d7f9932757", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following polymers when blended with cotton develops terycot?", "image": null}, "options": [{"id": "7aNC8", "text": "Dacron", "image": null, "isCorrect": true}, {"id": "tcFwB", "text": "Nylon 6", "image": null, "isCorrect": false}, {"id": "lCvhh", "text": "Polyacrylonitrile", "image": null, "isCorrect": false}, {"id": "0gCQi", "text": "Nylon 6,6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Terycot is a blended fabric made by mixing Terylene and cotton.<br><br>Terylene is a polyester which is also commercially known as Dacron.<br><br>Therefore, Dacron when blended with cotton develops terycot.<br><br>Answer: Dacron", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3bbf9280d7f993274e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the monomer used in preparation of polyacrylonitrile?", "image": null}, "options": [{"id": "fYcP5", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/XesZ1NDcegcFQVSICwn-RTdcfboooAtXdyYqkicoi-Q.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "ipyR9", "text": "$\\mathrm{F}_2 \\mathrm{C}=\\mathrm{CF}_2$", "image": null, "isCorrect": false}, {"id": "pizIn", "text": "$\\mathrm{H}_2 \\mathrm{C}=\\mathrm{CH}-\\mathrm{CN}$", "image": null, "isCorrect": true}, {"id": "ubTuh", "text": "$\\mathrm{H}_2 \\mathrm{C}=\\mathrm{CH}-\\mathrm{CH}=\\mathrm{CH}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Polyacrylonitrile (PAN) is an addition polymer obtained by the polymerization of acrylonitrile.<br><br>The chemical formula of the monomer acrylonitrile is $\\mathrm{H}_2\\mathrm{C}=\\mathrm{CH}-\\mathrm{CN}$.<br><br>Answer: $\\mathrm{H}_2 \\mathrm{C}=\\mathrm{CH}-\\mathrm{CN}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214470aee93fa0796df64", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Which from following polymers is a urea-formaldehyde resin?", "image": null}, "options": [{"id": "j2loM", "text": "$\\quad\\left[\\mathrm{NH}-\\mathrm{CO}-\\mathrm{NH}-\\mathrm{CH}_2\\right]_{\\mathrm{n}}$", "image": null, "isCorrect": true}, {"id": "buTS4", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/7N3e4edzPWHjA7prll0Q8qQ0L4aYy--nVjSuK-zu5FY.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "Cxd39", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/zbFj6OEiqeBWHj7QLMZMvNLSqHoMivc9H_t-jWUKzVU.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "fFkh6", "text": "$\\left[\\mathrm{NH}\\left(\\mathrm{CH}_2\\right)_5 \\mathrm{CO}\\right]_{\\mathrm{n}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Urea-formaldehyde resin is a condensation polymer formed by the reaction between urea ($\\mathrm{NH_2-CO-NH_2}$) and formaldehyde ($\\mathrm{HCHO}$).<br><br>The initial reaction forms methylol urea derivatives, which then undergo condensation with the elimination of water molecules to form a polymer network.<br><br>The repeating unit of the resulting polymer chain contains the linkage formed from urea and formaldehyde, which is represented as $\\left[\\mathrm{NH}-\\mathrm{CO}-\\mathrm{NH}-\\mathrm{CH}_2\\right]_{\\mathrm{n}}$.<br><br>Other options represent:<br>$\\left[\\mathrm{NH}\\left(\\mathrm{CH}_2\\right)_5 \\mathrm{CO}\\right]_{\\mathrm{n}}$ is Nylon-6.<br>The first image represents polystyrene.<br>The second image represents polyacrylamide.<br><br>Answer: $\\quad\\left[\\mathrm{NH}-\\mathrm{CO}-\\mathrm{NH}-\\mathrm{CH}_2\\right]_{\\mathrm{n}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214450aee93fa0796df4f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Which from following polymers is classified as fibres?", "image": null}, "options": [{"id": "cFXb0", "text": "Polyesters", "image": null, "isCorrect": true}, {"id": "AXTEX", "text": "Vulcanized rubber", "image": null, "isCorrect": false}, {"id": "2ZbSu", "text": "Polythene", "image": null, "isCorrect": false}, {"id": "95cbl", "text": "Polyvinyls", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Polymers are classified based on the magnitude of intermolecular forces into four categories: elastomers, fibres, thermoplastic polymers, and thermosetting polymers.<br><br>Fibres are thread-forming solids which possess high tensile strength and high modulus. These characteristics are due to strong intermolecular forces like hydrogen bonding or dipole-dipole interactions, which lead to close packing of chains and impart crystalline nature. Examples include polyamides (nylon 6, 6) and polyesters (terylene).<br><br>Vulcanized rubber is classified as an elastomer.<br><br>Polythene and polyvinyls are classified as thermoplastic polymers.<br><br>Therefore, polyesters are classified as fibres.<br><br>Answer: Polyesters", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214320aee93fa0796deb9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Which of the following polymers need $\\mathrm{HO}-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{OH}$ as one of the monomers for its preparation?", "image": null}, "options": [{"id": "l5pK2", "text": "Nylon 6,6", "image": null, "isCorrect": false}, {"id": "fq65X", "text": "Dacron", "image": null, "isCorrect": true}, {"id": "1K7az", "text": "Polyacrylamide", "image": null, "isCorrect": false}, {"id": "rCdlh", "text": "Buna-N", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Dacron (also known as terylene) is a polyester polymer.<br><br>It is prepared by the condensation polymerization of ethylene glycol ($\\mathrm{HO}-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{OH}$) and terephthalic acid (benzene-1,4-dicarboxylic acid).<br><br>Nylon 6,6 is prepared from hexamethylenediamine and adipic acid.<br><br>Polyacrylamide is prepared from acrylamide.<br><br>Buna-N is prepared from 1,3-butadiene and acrylonitrile.<br><br>Thus, Dacron requires ethylene glycol as one of its monomers.<br><br>Answer: Dacron", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214220aee93fa0796de3a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Which of following polymer does not contain\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/nBWZXwqsnXKmVYJ-8jRGFSpB4GVE81O6yMOqucE6TNE.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "aWP4K", "text": "PAN", "image": null, "isCorrect": true}, {"id": "WZcS9", "text": "Nylon 6", "image": null, "isCorrect": false}, {"id": "6zN8c", "text": "Nylon 6,6", "image": null, "isCorrect": false}, {"id": "GYUlx", "text": "Nylon 2,6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The linkage shown in the image is an amide linkage ($-CO-NH-$).<br><br>Let us analyze the given polymers:<br>1. PAN (Polyacrylonitrile) is an addition polymer formed by the polymerization of acrylonitrile ($CH_2=CH-CN$). Its repeating unit is $-[CH_2-CH(CN)]_n-$, which does not contain an amide linkage.<br>2. Nylon 6 is a polyamide formed from caprolactam, so it contains amide linkages.<br>3. Nylon 6,6 is a polyamide formed from hexamethylenediamine and adipic acid, so it contains amide linkages.<br>4. Nylon 2,6 is a polyamide formed from glycine and aminocaproic acid, so it also contains amide linkages.<br><br>Therefore, PAN is the only polymer among the given options that does not contain the $-CO-NH-$ linkage.<br><br>Answer: PAN", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214200aee93fa0796de31", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Identify the polymer used to obtain disposable cups and plates.", "image": null}, "options": [{"id": "f5PfM", "text": "LDPE", "image": null, "isCorrect": false}, {"id": "AZvCV", "text": "Polypropylene", "image": null, "isCorrect": false}, {"id": "tBhMA", "text": "HDPE", "image": null, "isCorrect": false}, {"id": "oRt9H", "text": "Polystyrene", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Polystyrene is a synthetic aromatic hydrocarbon polymer made from the monomer styrene. It is widely used in the manufacture of disposable cups, plates, food containers, toys, and as an insulating material.<br><br>LDPE is used for packaging, squeeze bottles, and flexible pipes.<br><br>HDPE is used for buckets, dustbins, and bottles.<br><br>Polypropylene is used for ropes, toys, and pipes.<br><br>Answer: Polystyrene", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fa0aee93fa0796dd07", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Which among following polymers is used to manufacture water pipes?", "image": null}, "options": [{"id": "4nPy1", "text": "Polycarbonate", "image": null, "isCorrect": false}, {"id": "ySTLe", "text": "PVC", "image": null, "isCorrect": true}, {"id": "lQu34", "text": "Buna-N", "image": null, "isCorrect": false}, {"id": "8iSiK", "text": "Polyacrylamide", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Polyvinyl chloride (PVC) is a widely used synthetic plastic polymer. Due to its durability, resistance to chemicals, and low cost, it is extensively used in the manufacture of water pipes, plumbing fittings, and electrical cable insulation.<br><br>Polycarbonate is used for making CDs, DVDs, and bulletproof glass.<br><br>Buna-N is a synthetic rubber used for making oil seals and tank linings.<br><br>Polyacrylamide is used in water treatment and gel electrophoresis.<br><br>Answer: PVC", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ea0aee93fa0796dc85", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Which from following polymers needs dihydric alcohol and aromatic dicarboxylic acid for its synthesis?", "image": null}, "options": [{"id": "li3xq", "text": "Nylon 6", "image": null, "isCorrect": false}, {"id": "U1sR4", "text": "Dacron", "image": null, "isCorrect": true}, {"id": "WtTNZ", "text": "Bakelite", "image": null, "isCorrect": false}, {"id": "ZZdS4", "text": "Polyacrylamide", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Dacron (also known as Polyethylene terephthalate or PET) is a polyester.<br><br>It is synthesized by the condensation polymerization of ethylene glycol (ethane-1,2-diol), which is a dihydric alcohol, and terephthalic acid (benzene-1,4-dicarboxylic acid), which is an aromatic dicarboxylic acid.<br><br>Nylon 6 is synthesized from caprolactam.<br><br>Bakelite is synthesized from phenol and formaldehyde.<br><br>Polyacrylamide is synthesized from acrylamide.<br><br>Answer: Dacron", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e90aee93fa0796dc7d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Which from following polymer contains ester linkage?", "image": null}, "options": [{"id": "CW5lC", "text": "Nylon 6", "image": null, "isCorrect": false}, {"id": "f1nTp", "text": "Polyacrylonitrile", "image": null, "isCorrect": false}, {"id": "zmZJk", "text": "Teflon", "image": null, "isCorrect": false}, {"id": "QSkP2", "text": "PHBV", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Nylon 6 is a polyamide and contains amide linkages ($-CO-NH-$).<br><br>Polyacrylonitrile is an addition polymer of acrylonitrile and contains no ester linkages.<br><br>Teflon is an addition polymer of tetrafluoroethylene and contains no ester linkages.<br><br>PHBV (Poly $\\beta$-hydroxybutyrate-co-$\\beta$-hydroxyvalerate) is a copolymer of 3-hydroxybutanoic acid and 3-hydroxypentanoic acid. The monomers undergo condensation polymerization to form a polyester, which contains ester linkages ($-COO-$).<br><br>Answer: PHBV", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c50aee93fa0796db62", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Which from following monomers is used to obtain polymer represented as<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/OavrcCNGf_blkrcGYBFMmF6FhmF2C-A6e-z-vnjdjs.png\"/>", "image": null}, "options": [{"id": "4DsSg", "text": "Acrylamide", "image": null, "isCorrect": true}, {"id": "p2WBJ", "text": "Urea and Formaldehyde", "image": null, "isCorrect": false}, {"id": "Lfs85", "text": "Bisphenol", "image": null, "isCorrect": false}, {"id": "unaoI", "text": "Methylmethacrylate", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given polymer structure is polyacrylamide, which is represented as $[-\\text{CH}_2-\\text{CH}(\\text{CONH}_2)-]_n$.<br><br>It is an addition polymer formed by the polymerization of the monomer acrylamide.<br><br>The chemical structure of acrylamide is $\\text{CH}_2=\\text{CH}-\\text{CONH}_2$.<br><br>During polymerization, the double bond between the carbon atoms breaks to form single bonds with adjacent monomers, resulting in the given polymer chain.<br><br>Answer: Acrylamide", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213860aee93fa0796d977", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Identify thermoplastic polymer from following.", "image": null}, "options": [{"id": "b9gjQ", "text": "Urea formaldehyde resin", "image": null, "isCorrect": false}, {"id": "txOrd", "text": "Bakelite", "image": null, "isCorrect": false}, {"id": "I2IMr", "text": "Polythene", "image": null, "isCorrect": true}, {"id": "rSJ76", "text": "Buna-N", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Thermoplastic polymers are linear or slightly branched long chain molecules capable of repeatedly softening on heating and hardening on cooling. Examples include polythene, polystyrene, polyvinyls, etc.<br><br>Urea formaldehyde resin and Bakelite are heavily branched or cross-linked polymers, which are classified as thermosetting polymers.<br><br>Buna-N is a rubber-like solid with elastic properties, which is classified as an elastomer.<br><br>Therefore, polythene is the thermoplastic polymer.<br><br>Answer: Polythene", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213730aee93fa0796d8df", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which from following statements about neoprene is false?", "image": null}, "options": [{"id": "R3TsN", "text": "It is a copolymer and polymerization occurs in presence of MgO .", "image": null, "isCorrect": true}, {"id": "RFVTX", "text": "It is a synthetic rubber.", "image": null, "isCorrect": false}, {"id": "c48Vm", "text": "It is used to prepare hose pipes for transport of gasoline.", "image": null, "isCorrect": false}, {"id": "hQpRT", "text": "The monomer involved in its preparation is unsaturated.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Neoprene is a synthetic rubber formed by the free radical polymerization of chloroprene (2-chloro-1,3-butadiene).<br><br>Since only one type of monomer is involved in its preparation, neoprene is a homopolymer, not a copolymer.<br><br>The monomer chloroprene is unsaturated as it contains double bonds.<br><br>Neoprene has superior resistance to vegetable and mineral oils, making it suitable for manufacturing hose pipes for the transport of gasoline, conveyor belts, and gaskets.<br><br>Therefore, the statement that it is a copolymer is false.<br><br>Answer: It is a copolymer and polymerization occurs in presence of MgO .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213640aee93fa0796d86b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Which from following is NOT true about natural rubber?", "image": null}, "options": [{"id": "Xi9zU", "text": "It is formed by addition polymerization.", "image": null, "isCorrect": false}, {"id": "EXI2s", "text": "It is a linear polymer.", "image": null, "isCorrect": false}, {"id": "gkpfd", "text": "It has cis configuration of $\\mathrm{C}=\\mathrm{C}$.", "image": null, "isCorrect": false}, {"id": "pD6Pt", "text": "It contains butadine and styrene as monomer units.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Natural rubber is a linear polymer of isoprene (2-methyl-1,3-butadiene) and is also called cis-1,4-polyisoprene. It is formed by the addition polymerization of isoprene units.<br><br>The cis-configuration at each double bond does not allow the polymer chains to come close to each other for effective intermolecular attractions, which gives it elastic properties.<br><br>Styrene-butadiene rubber (SBR or Buna-S) is a synthetic rubber that contains 1,3-butadiene and styrene as monomer units, not natural rubber.<br><br>Therefore, the statement that it contains butadiene and styrene as monomer units is incorrect.<br><br>Answer: It contains butadine and styrene as monomer units.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133b0aee93fa0796d728", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Which form following is a use of polyester fibres?", "image": null}, "options": [{"id": "54hUL", "text": "Making bristles of brushes.", "image": null, "isCorrect": false}, {"id": "yySmD", "text": "To obtain orlon.", "image": null, "isCorrect": false}, {"id": "GnVNk", "text": "To obtain electric insulators.", "image": null, "isCorrect": false}, {"id": "3qMYY", "text": "To obtain terywool.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Polyester fibres, such as Terylene, are widely used in blending with natural fibres.<br><br>When Terylene (a polyester) is blended with wool, it forms terywool, which is used for making winter clothing.<br><br>Nylon is used for making bristles of brushes.<br><br>Orlon is an acrylic fibre.<br><br>Electric insulators are typically made from polymers like Bakelite or PVC.<br><br>Therefore, a primary use of polyester fibres is to obtain terywool.<br><br>Answer: To obtain terywool.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213260aee93fa0796d68c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Identify the monomers used for preparation of Buna-S.", "image": null}, "options": [{"id": "Of4Nd", "text": "Phenol and formaldehyde", "image": null, "isCorrect": false}, {"id": "pnmSH", "text": "1,3-butadiene and styrene", "image": null, "isCorrect": true}, {"id": "ENsaq", "text": "Ethylene glycol and styrene", "image": null, "isCorrect": false}, {"id": "JMHMC", "text": "$\\beta$-hydroxy butyric acid and phenol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Buna-S is an addition copolymer formed by the copolymerization of 1,3-butadiene and styrene in the presence of sodium as a catalyst.<br><br>The name Buna-S is derived from:<br>Bu $\\rightarrow$ 1,3-butadiene<br>na $\\rightarrow$ sodium (catalyst)<br>S $\\rightarrow$ styrene<br><br>Therefore, the monomers used for the preparation of Buna-S are 1,3-butadiene and styrene.<br><br>Answer: 1,3-butadiene and styrene", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213260aee93fa0796d685", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Which among the following polymers is obtained by, ring opening polymerization process?", "image": null}, "options": [{"id": "IsDMz", "text": "Polyacrylonitrile", "image": null, "isCorrect": false}, {"id": "J2lbL", "text": "Nylon 6,6", "image": null, "isCorrect": false}, {"id": "6baxg", "text": "Nylon 6", "image": null, "isCorrect": true}, {"id": "ODBvF", "text": "Terylene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nylon 6 is prepared by heating caprolactam with water at a high temperature. Caprolactam is a cyclic amide, and its polymerization involves a ring-opening process to form the linear polymer Nylon 6.<br><br>Polyacrylonitrile is formed by the addition polymerization of acrylonitrile.<br><br>Nylon 6,6 is formed by the condensation polymerization of hexamethylenediamine and adipic acid.<br><br>Terylene is formed by the condensation polymerization of ethylene glycol and terephthalic acid.<br><br>Answer: Nylon 6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262830279619d9d8a351e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Identify the use of HDP from following.", "image": null}, "options": [{"id": "Hl7Mj", "text": "Insulation of electric cables", "image": null, "isCorrect": false}, {"id": "bAE92", "text": "Manufacture of toys", "image": null, "isCorrect": true}, {"id": "iIwJK", "text": "Submarine cable insulation", "image": null, "isCorrect": false}, {"id": "ZZ7LC", "text": "Producing extruded films", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12|Ch-15|Subtopic-15.3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627e0279619d9d8a34f5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Which from following polymers is classified as fibres depending on inter molecular forces?", "image": null}, "options": [{"id": "gBCIm", "text": "Vulcanized rubber", "image": null, "isCorrect":
