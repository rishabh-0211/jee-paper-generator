  <script>
    const data = {"index": 31, "chapterId": "61c089aaff82b2b43fdc67be", "chapter": "Polymers", "exam": "MHT CET", "totalTopics": 2, "totalQuestions": 244, "downloadTime": "2026-10-08 20:07:31", "topics": [{"index": 1, "topicId": "65a263330279619d9d8a3cf5", "title": "Classification of Polymers", "totalQuestions": 88, "questions": [{"_id": "6abb88a415a9fc0fc8c1459f", "type": "singleCorrect", "question": {"text": "Which of the following polymers belongs elastomers?", "image": null}, "options": [{"id": "XXIlg", "label": "A", "text": "Polystyrene", "isCorrect": false, "image": null}, {"id": "4BBoe", "label": "B", "text": "Polythene", "isCorrect": false, "image": null}, {"id": "axm0A", "label": "C", "text": "Polyvinyls", "isCorrect": false, "image": null}, {"id": "8COsd", "label": "D", "text": "Neoprene", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Elastomers are rubber-like solid polymers with elastic properties. In these polymers, the polymer chains are held together by the weakest intermolecular forces, which permit the polymer to be stretched.<br><br>Neoprene is a synthetic rubber and belongs to the class of elastomers.<br><br>Polystyrene, polythene, and polyvinyls are examples of thermoplastic polymers, which have intermolecular forces of attraction intermediate between elastomers and fibres.<br><br>Answer: Neoprene", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b415a9fc0fc8c14635", "type": "singleCorrect", "question": {"text": "What type of polymer is the polystyrene?", "image": null}, "options": [{"id": "O5Rfn", "label": "A", "text": "a thermoplastic polymer", "isCorrect": true, "image": null}, {"id": "bNPiF", "label": "B", "text": "a thermosetting polymer", "isCorrect": false, "image": null}, {"id": "t6Zry", "label": "C", "text": "an elastomer", "isCorrect": false, "image": null}, {"id": "jMyvF", "label": "D", "text": "a cross-linked polymer", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Polystyrene is an addition polymer formed by the polymerization of the monomer styrene.<br><br>It is a linear polymer with no cross-linking between the chains. It can be repeatedly softened on heating and hardened on cooling, which is the defining characteristic of a thermoplastic polymer.<br><br>Therefore, polystyrene is a thermoplastic polymer.<br><br>Answer: a thermoplastic polymer", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887415a9fc0fc8c143dc", "type": "singleCorrect", "question": {"text": "Which of the following polymers is NOT semisynthetic?", "image": null}, "options": [{"id": "cyj9L", "label": "A", "text": "Cellulose acetate rayon", "isCorrect": false, "image": null}, {"id": "Yn3ku", "label": "B", "text": "Cuprammonium rayon", "isCorrect": false, "image": null}, {"id": "9qnTb", "label": "C", "text": "Teflon", "isCorrect": true, "image": null}, {"id": "5MFD7", "label": "D", "text": "Cellulose nitrate", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Semisynthetic polymers are mostly derived from naturally occurring polymers by chemical modifications. Examples include cellulose derivatives such as cellulose acetate (rayon), cellulose nitrate, and cuprammonium rayon.<br><br>Teflon (polytetrafluoroethylene) is a completely synthetic polymer prepared by the polymerization of tetrafluoroethylene under high pressure in the presence of a free radical catalyst.<br><br>Therefore, Teflon is not a semisynthetic polymer.<br><br>Answer: Teflon", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888415a9fc0fc8c14473", "type": "singleCorrect", "question": {"text": "Which polymer is obtained by ring opening polymerization?", "image": null}, "options": [{"id": "jgSMw", "label": "A", "text": "Terylene", "isCorrect": false, "image": null}, {"id": "aF74l", "label": "B", "text": "Nylon-6", "isCorrect": true, "image": null}, {"id": "w1wRk", "label": "C", "text": "Nylon-6,6", "isCorrect": false, "image": null}, {"id": "WyXaJ", "label": "D", "text": "Bakelite", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Nylon-6 is prepared by heating caprolactam with water at a high temperature ($533 - 543$ K). Caprolactam is a cyclic amide, and its polymerization involves the opening of this ring to form a linear polymer.<br><br>Terylene is a condensation polymer of ethylene glycol and terephthalic acid.<br><br>Nylon-6,6 is a condensation polymer of hexamethylenediamine and adipic acid.<br><br>Bakelite is a condensation polymer of phenol and formaldehyde.<br><br>Therefore, Nylon-6 is the only polymer among the given options obtained by ring opening polymerization.<br><br>Answer: Nylon-6", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888415a9fc0fc8c14472", "type": "singleCorrect", "question": {"text": "Identify the polymer, not having cross-linking.", "image": null}, "options": [{"id": "fMeqh", "label": "A", "text": "Bakelite", "isCorrect": false, "image": null}, {"id": "tUmSO", "label": "B", "text": "Low density polythene", "isCorrect": true, "image": null}, {"id": "i4aCg", "label": "C", "text": "Melamine", "isCorrect": false, "image": null}, {"id": "pyA0V", "label": "D", "text": "Vulcanized rubber", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Bakelite is a cross-linked thermosetting polymer formed by the condensation of phenol and formaldehyde.<br><br>Melamine is a cross-linked thermosetting polymer formed by the condensation of melamine and formaldehyde.<br><br>Vulcanized rubber contains sulfur cross-links between the polyisoprene chains to improve its elasticity and strength.<br><br>Low density polythene (LDPE) is a highly branched polymer formed by the free radical polymerization of ethene. It does not contain cross-links between the polymer chains and is a thermoplastic.<br><br>Answer: Low density polythene", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889415a9fc0fc8c14508", "type": "singleCorrect", "question": {"text": "Which of the following is a biodegradable polymer?", "image": null}, "options": [{"id": "ERQRf", "label": "A", "text": "Nylon 6", "isCorrect": false, "image": null}, {"id": "1IIxk", "label": "B", "text": "Nylon 6,6", "isCorrect": false, "image": null}, {"id": "a2Ouk", "label": "C", "text": "Both Nylon 6 and Nylon 6,6", "isCorrect": false, "image": null}, {"id": "n8BOE", "label": "D", "text": "Viscose rayon", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Viscose rayon is a semi-synthetic polymer, specifically a regenerated cellulose fiber. Since it is derived from natural cellulose, it can be decomposed by microorganisms and is therefore a biodegradable polymer.<br><br>Nylon 6 and Nylon 6,6 are synthetic polyamides and are non-biodegradable.<br><br>Answer: Viscose rayon", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c415a9fc0fc8c146cb", "type": "singleCorrect", "question": {"text": "Match <strong>List I</strong> with <strong>List II</strong><table style=\"border: 1px solid black; border-collapse: collapse; width: auto;\"><tr><th style=\"border: 1px solid black; padding: 10px;\">List I<br>Polymer</th><th style=\"border: 1px solid black; padding: 10px;\">List II<br>Application</th></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(A). Glyptal</td><td style=\"border: 1px solid black; padding: 10px;\">(i). Electrophoresis</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(B). Buna N</td><td style=\"border: 1px solid black; padding: 10px;\">(ii). LCD screen</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(C). Perspex</td><td style=\"border: 1px solid black; padding: 10px;\">(iii). Paints</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(D). Polyacrylamide</td><td style=\"border: 1px solid black; padding: 10px;\">(iv). Adhesive</td></tr></table>Choose the <strong>correct</strong> answer from the options given below:", "image": null}, "options": [{"id": "55DZj", "label": "A", "text": "(A)-(i), (B)-(ii), (C)-(iii), (D)-(iv)", "isCorrect": false, "image": null}, {"id": "60iVp", "label": "B", "text": "(A)-(iii), (B)-(ii), (C)-(iv), (D)-(i)", "isCorrect": false, "image": null}, {"id": "BhD5X", "label": "C", "text": "(A)-(iv), (B)-(iii), (C)-(ii), (D)-(i)", "isCorrect": false, "image": null}, {"id": "YUNFJ", "label": "D", "text": "(A)-(iii), (B)-(iv), (C)-(ii), (D)-(i)", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Glyptal is a polyester formed by the condensation of ethylene glycol and phthalic acid, and it is primarily used in the manufacture of paints and lacquers. Thus, (A) matches with (iii).<br><br>Buna N is a copolymer of 1,3-butadiene and acrylonitrile. It is resistant to the action of petrol, lubricating oil, and organic solvents, and is widely used in making oil seals, tank linings, and adhesives. Thus, (B) matches with (iv).<br><br>Perspex, also known as polymethyl methacrylate (PMMA), is a transparent thermoplastic. Due to its excellent optical clarity, it is used as a shatter-resistant alternative to glass in applications like lenses, light covers, and LCD screens. Thus, (C) matches with (ii).<br><br>Polyacrylamide is a highly water-absorbent polymer that forms a gel when hydrated. It is extensively used as a medium in gel electrophoresis (PAGE) for the separation of proteins and nucleic acids. Thus, (D) matches with (i).<br><br>The correct matching is (A)-(iii), (B)-(iv), (C)-(ii), (D)-(i).<br><br>Answer: (A)-(iii), (B)-(iv), (C)-(ii), (D)-(i)", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ac8c30a4553e1bdb96", "type": "singleCorrect", "question": {"text": "Which of the following is a cross-linked, thermosetting polymer?", "image": null}, "options": [{"id": "Jjugw", "label": "A", "text": "Bakelite", "isCorrect": true, "image": null}, {"id": "BfEbo", "label": "B", "text": "PVC", "isCorrect": false, "image": null}, {"id": "jk4pF", "label": "C", "text": "Polystyrene", "isCorrect": false, "image": null}, {"id": "ozoBR", "label": "D", "text": "PTFE (Teflon)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Bakelite is formed by the condensation reaction of phenol with formaldehyde. It is a highly cross-linked, thermosetting polymer which, once molded, cannot be remolded or reshaped by heating.<br><br>PVC, Polystyrene, and PTFE (Teflon) are examples of thermoplastic polymers, which can be repeatedly softened by heating and hardened by cooling.<br><br>Answer: Bakelite", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3548c30a4553e1be297", "type": "singleCorrect", "question": {"text": "Which from following polymers is obtained by condensation polymerization method?", "image": null}, "options": [{"id": "J5QqR", "label": "A", "text": "Polythene", "isCorrect": false, "image": null}, {"id": "Ynclc", "label": "B", "text": "Polyacrylonitrile", "isCorrect": false, "image": null}, {"id": "vmTB9", "label": "C", "text": "Teflon", "isCorrect": false, "image": null}, {"id": "ZSYYw", "label": "D", "text": "Dacron", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Polythene is an addition polymer formed by the repeated addition of ethene monomers.<br><br>Polyacrylonitrile is an addition polymer formed by the addition polymerization of acrylonitrile.<br><br>Teflon is an addition polymer formed by the addition polymerization of tetrafluoroethene.<br><br>Dacron (also known as terylene) is a condensation polymer formed by the condensation polymerization of ethylene glycol and terephthalic acid with the elimination of water molecules.<br><br>Answer: Dacron", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30d8c30a4553e1bdfa1", "type": "singleCorrect", "question": {"text": "Which from following polymers is classified as branched chain polymer?", "image": null}, "options": [{"id": "AtoSy", "label": "A", "text": "High density polythene", "isCorrect": false, "image": null}, {"id": "4AfBX", "label": "B", "text": "Low density polythene", "isCorrect": true, "image": null}, {"id": "nMdAU", "label": "C", "text": "PVC", "isCorrect": false, "image": null}, {"id": "yajbq", "label": "D", "text": "Melamine", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Low density polythene (LDPE) is synthesized by free radical polymerization, which involves chain transfer reactions that lead to a highly branched structure.<br><br>High density polythene (HDPE) and polyvinyl chloride (PVC) are linear polymers.<br><br>Melamine-formaldehyde resin is a cross-linked or network polymer.<br><br>Answer: Low density polythene", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30c8c30a4553e1bdf9c", "type": "singleCorrect", "question": {"text": "Which from following polymers is obtained by condensation polymerisation method ?", "image": null}, "options": [{"id": "lupPx", "label": "A", "text": "$[\\,\\text{CF}_2 - \\text{CF}_2\\,]_n$", "isCorrect": false, "image": null}, {"id": "2cPXa", "label": "B", "text": "$[\\,\\text{CH}_2 - \\text{CH}_2\\,]_n$", "isCorrect": false, "image": null}, {"id": "0VwKD", "label": "C", "text": "$[\\,\\text{NH} - (\\text{CH}_2)_5 - \\text{CO}\\,]_n$", "isCorrect": false, "image": null}, {"id": "TNf6f", "label": "D", "text": "<img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/18_april_shift_2__q78_d1.png\" />", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "To determine which polymer is obtained by condensation polymerisation, let us analyze each option:<br><br>1. $[\\,\\text{CF}_2 - \\text{CF}_2\\,]_n$ is Teflon (Polytetrafluoroethylene). It is formed by the addition polymerisation of tetrafluoroethene.<br><br>2. $[\\,\\text{CH}_2 - \\text{CH}_2\\,]_n$ is Polythene. It is formed by the addition polymerisation of ethene.<br><br>3. $[\\,\\text{NH} - (\\text{CH}_2)_5 - \\text{CO}\\,]_n$ is Nylon 6. It is synthesized by the ring-opening polymerisation of caprolactam. Since no small molecule is eliminated during the process, it is technically considered an addition polymerisation.<br><br>4. The polymer shown in the image is Nylon 6,6, which has the repeating unit $[\\,-\\text{CO}-(\\text{CH}_2)_4-\\text{CO}-\\text{NH}-(\\text{CH}_2)_6-\\text{NH}-\\,]_n$. It is formed by the condensation polymerisation of adipic acid and hexamethylenediamine, accompanied by the elimination of water molecules.<br><br>Therefore, Nylon 6,6 is the polymer obtained by the condensation polymerisation method.<br><br>Answer: <img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/18_april_shift_2__q78_d1.png\" />", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fe8c30a4553e1bdf08", "type": "singleCorrect", "question": {"text": "Identify ureaformaldehyde resin from following polymers?", "image": null}, "options": [{"id": "6E4Yy", "label": "A", "text": "<img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/18_april_shift_1__q79_d1.png\" />", "isCorrect": false, "image": null}, {"id": "kLAyB", "label": "B", "text": "<img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/18_april_shift_1__q79_d2.png\" />", "isCorrect": false, "image": null}, {"id": "j0iRZ", "label": "C", "text": "$[\\text{NH} - \\text{CO} - \\text{NH} - \\text{CH}_2]_n$", "isCorrect": true, "image": null}, {"id": "ScOud", "label": "D", "text": "$[\\text{NH} - (\\text{CH}_2)_5 - \\text{CO}]_n$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Urea-formaldehyde resin is a condensation polymer formed by the reaction between urea ($NH_2-CO-NH_2$) and formaldehyde ($HCHO$).<br><br>The initial reaction involves the formation of methylol urea derivatives, which then undergo condensation with the elimination of water molecules to form a cross-linked polymer network.<br><br>The repeating unit of the urea-formaldehyde polymer chain is derived from linking the nitrogen atoms of urea with the methylene ($-CH_2-$) group from formaldehyde.<br><br>The repeating unit is $[-NH-CO-NH-CH_2-]_n$.<br><br>Let us analyze the other options:<br>Option (1) is polyacrylamide.<br>Option (2) is polystyrene.<br>Option (4) is nylon-6, which is polycaprolactam.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fc8c30a4553e1bdef1", "type": "singleCorrect", "question": {"text": "Identify thermosetting polymer from following.", "image": null}, "options": [{"id": "Jfakf", "label": "A", "text": "Ureaformaldehyde resin", "isCorrect": true, "image": null}, {"id": "am2Jc", "label": "B", "text": "Polystyrene", "isCorrect": false, "image": null}, {"id": "FXRZ6", "label": "C", "text": "Buna-S", "isCorrect": false, "image": null}, {"id": "u25Ce", "label": "D", "text": "Terylene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Thermosetting polymers are cross-linked or heavily branched molecules, which on heating undergo extensive cross-linking in moulds and become infusible. These cannot be reused.<br><br>Examples of thermosetting polymers include Bakelite, urea-formaldehyde resins, and melamine-formaldehyde resins.<br><br>Polystyrene is a thermoplastic polymer.<br><br>Buna-S is an elastomer.<br><br>Terylene is a fibre.<br><br>Answer: Ureaformaldehyde resin", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f08c30a4553e1bde69", "type": "singleCorrect", "question": {"text": "What is a starting material used to obtain viscose rayon ?", "image": null}, "options": [{"id": "Y2sy1", "label": "A", "text": "Styrene", "isCorrect": false, "image": null}, {"id": "cr2YU", "label": "B", "text": "Cellulose", "isCorrect": true, "image": null}, {"id": "l54Gx", "label": "C", "text": "Acrylamide", "isCorrect": false, "image": null}, {"id": "K0lyw", "label": "D", "text": "Bisphenol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Viscose rayon is a semi-synthetic polymer. It is obtained by the chemical treatment of natural cellulose, which is typically sourced from wood pulp.<br><br>The cellulose is first dissolved in an alkaline solution of sodium hydroxide and then treated with carbon disulfide to form cellulose xanthate. This is further dissolved in dilute sodium hydroxide to form a viscous solution called viscose, which is then extruded into an acid bath to regenerate cellulose in the form of fine filaments known as viscose rayon.<br><br>Therefore, the starting material used to obtain viscose rayon is cellulose.<br><br>Answer: Cellulose", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3268c30a4553e1be0b2", "type": "singleCorrect", "question": {"text": "Which from following polymers is NOT obtained by addition polymerisation method?", "image": null}, "options": [{"id": "ITsvl", "label": "A", "text": "Teflon", "isCorrect": false, "image": null}, {"id": "8HgqT", "label": "B", "text": "Polyacrolonitrile", "isCorrect": false, "image": null}, {"id": "S1DHk", "label": "C", "text": "LDP", "isCorrect": false, "image": null}, {"id": "qyKgI", "label": "D", "text": "PHBV", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Teflon is an addition polymer of tetrafluoroethene.<br><br>Polyacrylonitrile is an addition polymer of acrylonitrile.<br><br>LDP (Low-density polyethylene) is an addition polymer of ethene.<br><br>PHBV (Poly $\\beta$-hydroxybutyrate-co-$\\beta$-hydroxyvalerate) is a condensation polymer of 3-hydroxybutanoic acid and 3-hydroxypentanoic acid.<br><br>Answer: PHBV", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3428c30a4553e1be1dd", "type": "singleCorrect", "question": {"text": "Which from following polymer is obtained by addition polymerization?", "image": null}, "options": [{"id": "jAAGz", "label": "A", "text": "<img style=\"width: 110px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_2__q55_d1.png\" />", "isCorrect": true, "image": null}, {"id": "l2iKI", "label": "B", "text": "$[\\text{NH} - (\\text{CH}_2)_5 - \\text{CO}]_n$", "isCorrect": false, "image": null}, {"id": "ckcGl", "label": "C", "text": "<img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_2__q55_d2.png\" />", "isCorrect": false, "image": null}, {"id": "ioVVm", "label": "D", "text": "<img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_2__q55_d3.png\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Addition polymerization involves the repeated addition of monomer molecules possessing double or triple bonds to form a polymer, without the elimination of any small molecules.<br><br>Option (322647) represents Polyacrylonitrile (PAN), which is formed by the addition polymerization of acrylonitrile ($\\text{CH}_2=\\text{CH}-\\text{CN}$).<br><br>Option (322648) represents Nylon-6, which is a condensation polymer of caprolactam.<br><br>Option (322649) represents Terylene (Dacron), which is a condensation polymer of ethylene glycol and terephthalic acid.<br><br>Option (322650) represents PHBV, which is a condensation polymer of 3-hydroxybutanoic acid and 3-hydroxypentanoic acid.<br><br>Therefore, the polymer obtained by addition polymerization is Polyacrylonitrile.<br><br>Answer: <img style=\"width: 110px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_2__q55_d1.png\" />", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c58c30a4553e1bdca4", "type": "singleCorrect", "question": {"text": "Which from following is a homopolymer ?", "image": null}, "options": [{"id": "MmRp4", "label": "A", "text": "Polyacrylonitrile", "isCorrect": true, "image": null}, {"id": "9z1IY", "label": "B", "text": "Buna - N", "isCorrect": false, "image": null}, {"id": "ycvYW", "label": "C", "text": "Urea formaldehyde resin", "isCorrect": false, "image": null}, {"id": "kfi9b", "label": "D", "text": "Polycarbonate", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A homopolymer is a polymer which is formed from only one type of monomer.<br><br>Polyacrylonitrile is formed by the addition polymerization of a single monomer, acrylonitrile.<br><br>Buna-N is a copolymer formed from two different monomers, 1,3-butadiene and acrylonitrile.<br><br>Urea formaldehyde resin is a condensation copolymer formed from urea and formaldehyde.<br><br>Polycarbonate is a condensation copolymer typically formed from bisphenol A and phosgene.<br><br>Therefore, polyacrylonitrile is the only homopolymer among the given options.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3388c30a4553e1be172", "type": "singleCorrect", "question": {"text": "Which of the following is not a basis of classification of polymers ?", "image": null}, "options": [{"id": "k53F4", "label": "A", "text": "Source", "isCorrect": false, "image": null}, {"id": "ve88a", "label": "B", "text": "Number of monomers", "isCorrect": true, "image": null}, {"id": "nJsmb", "label": "C", "text": "Method of preparation", "isCorrect": false, "image": null}, {"id": "Q7ncL", "label": "D", "text": "Structure", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Polymers are broadly classified on the basis of the following parameters:<br><br>1. Source (Natural, semi-synthetic, and synthetic polymers)<br>2. Structure (Linear, branched-chain, and cross-linked polymers)<br>3. Mode of polymerisation or method of preparation (Addition and condensation polymers)<br>4. Molecular forces (Elastomers, fibres, thermoplastics, and thermosetting polymers)<br><br>Polymers are not classified on the basis of the number of monomers. (Note: Based on the <i>types</i> of monomers, they are classified into homopolymers and copolymers, but not on the <i>number</i> of monomers).<br><br>Answer: Number of monomers", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e48c30a4553e1bddee", "type": "singleCorrect", "question": {"text": "Which among the following is NOT a polyester polymer ?", "image": null}, "options": [{"id": "HxTIz", "label": "A", "text": "Glyptal", "isCorrect": false, "image": null}, {"id": "AKapU", "label": "B", "text": "Novolac", "isCorrect": true, "image": null}, {"id": "OOfT3", "label": "C", "text": "PHBV", "isCorrect": false, "image": null}, {"id": "37kOr", "label": "D", "text": "Dacron", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Glyptal is a polyester polymer formed by the condensation of ethylene glycol and phthalic acid.<br><br>PHBV (Poly $\\beta$-hydroxybutyrate-co-$\\beta$-hydroxyvalerate) is a biodegradable aliphatic polyester.<br><br>Dacron (Terylene) is a polyester polymer formed by the condensation of ethylene glycol and terephthalic acid.<br><br>Novolac is a linear condensation polymer of phenol and formaldehyde, which does not contain ester linkages. Therefore, it is not a polyester polymer.<br><br>Answer: Novolac", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29e8c30a4553e1bdb01", "type": "singleCorrect", "question": {"text": "Identify the polymer obtained by addition polymerization method from following.", "image": null}, "options": [{"id": "IlG0P", "label": "A", "text": "Nylon 6", "isCorrect": false, "image": null}, {"id": "wajtI", "label": "B", "text": "Dacron", "isCorrect": false, "image": null}, {"id": "JVFnw", "label": "C", "text": "Polythene", "isCorrect": true, "image": null}, {"id": "YTn3w", "label": "D", "text": "Nylon 6,6", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Addition polymerization involves the repeated addition of monomer molecules possessing double or triple bonds to form a polymer without the elimination of any small molecules.<br><br>Polythene is formed by the addition polymerization of ethene ($CH_2=CH_2$) molecules.<br><br>Nylon 6, Dacron, and Nylon 6,6 are formed by condensation polymerization, which involves the elimination of small molecules like water.<br><br>Answer: Polythene", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29e8c30a4553e1bdb00", "type": "singleCorrect", "question": {"text": "Which of the following is chain growth polymer?", "image": null}, "options": [{"id": "yY5NY", "label": "A", "text": "Nylon-6", "isCorrect": false, "image": null}, {"id": "uXte8", "label": "B", "text": "Teflon", "isCorrect": true, "image": null}, {"id": "6EwiM", "label": "C", "text": "Nylon-66", "isCorrect": false, "image": null}, {"id": "4hjF0", "label": "D", "text": "Terylene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Chain growth polymers are formed by the repeated addition of monomer molecules possessing double or triple bonds, which is also known as addition polymerization.<br><br>Teflon (polytetrafluoroethylene) is formed by the addition polymerization of tetrafluoroethene ($CF_2=CF_2$). Thus, it is a chain growth polymer.<br><br>Nylon-6, Nylon-66, and Terylene are condensation polymers, which are formed by step growth polymerization.<br><br>Answer: Teflon", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3718c30a4553e1be3ca", "type": "singleCorrect", "question": {"text": "What type of polymer the natural rubber is?", "image": null}, "options": [{"id": "cCdly", "label": "A", "text": "Fibre", "isCorrect": false, "image": null}, {"id": "zZbXm", "label": "B", "text": "Elastomer", "isCorrect": true, "image": null}, {"id": "9FlwS", "label": "C", "text": "Thermoplastic", "isCorrect": false, "image": null}, {"id": "Xmv61", "label": "D", "text": "Thermosetting plastic", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Natural rubber is an addition polymer of isoprene (2-methyl-1,3-butadiene). It has weak intermolecular forces of attraction (van der Waals forces) between its polymer chains, which permit the polymer to be stretched. A few cross-links are introduced between the chains, which help the polymer retract to its original position after the force is released. Polymers with such elastic properties are classified as elastomers.<br><br>Therefore, natural rubber is an elastomer.<br><br>Answer: Elastomer", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3638c30a4553e1be335", "type": "singleCorrect", "question": {"text": "Buna - S is an example of ,", "image": null}, "options": [{"id": "sP2Gj", "label": "A", "text": "elastomer", "isCorrect": true, "image": null}, {"id": "CTKsG", "label": "B", "text": "fibre", "isCorrect": false, "image": null}, {"id": "dsF9f", "label": "C", "text": "thermoplastic polymer", "isCorrect": false, "image": null}, {"id": "mPS4Y", "label": "D", "text": "thermosetting polymer", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Buna-S is a synthetic rubber formed by the copolymerization of 1,3-butadiene and styrene.<br><br>Since it is a rubber, it possesses elastic properties and is classified as an elastomer.<br><br>The intermolecular forces in elastomers are weak van der Waals forces, which allow the polymer chains to be stretched.<br><br>Answer: elastomer", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bfbbf9280d7f9932e3b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify cross linked polymer from following.", "image": null}, "options": [{"id": "usowG", "text": "High density polythene", "image": null, "isCorrect": false}, {"id": "cPCjd", "text": "Low density polythene", "image": null, "isCorrect": false}, {"id": "tn6ds", "text": "Melamine", "image": null, "isCorrect": true}, {"id": "p9CdN", "text": "PVC", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Polymers are classified based on their structure into linear, branched, and cross-linked polymers.<br><br>High density polythene (HDPE) and Polyvinyl chloride (PVC) are linear polymers.<br><br>Low density polythene (LDPE) is a branched chain polymer.<br><br>Melamine (melamine-formaldehyde resin) is a cross-linked or network polymer, formed by the condensation of melamine and formaldehyde.<br><br>Answer: Melamine", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871befbf9280d7f9932dcb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following is a thermosetting polymer?", "image": null}, "options": [{"id": "LMy6Y", "text": "Bakelite", "image": null, "isCorrect": true}, {"id": "qEw1d", "text": "Buna-S", "image": null, "isCorrect": false}, {"id": "Atqca", "text": "Dacron", "image": null, "isCorrect": false}, {"id": "BqTZj", "text": "Polyvinyls", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Thermosetting polymers are heavily cross-linked or network polymers which on heating undergo extensive cross-linking in moulds and again become infusible. They cannot be reused.<br><br>Bakelite is a phenol-formaldehyde resin and is a classic example of a thermosetting polymer.<br><br>Buna-S is an elastomer.<br><br>Dacron is a polyester fibre.<br><br>Polyvinyls are generally thermoplastics.<br><br>Answer: Bakelite", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9dbf9280d7f9932ae3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following polymers is biodegradable?", "image": null}, "options": [{"id": "7d8E8", "text": "Nyon 6", "image": null, "isCorrect": false}, {"id": "CG82i", "text": "Nylon 6,6", "image": null, "isCorrect": false}, {"id": "CBv2d", "text": "Nylon 2-nylon 6", "image": null, "isCorrect": true}, {"id": "iPI0Y", "text": "HDP", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Biodegradable polymers are those which can be decomposed by microorganisms over a period of time. <br><br>Nylon 2-nylon 6 is an alternating polyamide copolymer of glycine (containing 2 carbon atoms) and amino caproic acid (containing 6 carbon atoms) and is a well-known biodegradable polymer. <br><br>Nylon 6, Nylon 6,6, and HDP (High Density Polythene) are synthetic polymers that are non-biodegradable.<br><br>Answer: Nylon 2-nylon 6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5bbf9280d7f9932887", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify a copolymer from following", "image": null}, "options": [{"id": "LuIjR", "text": "Buna-S", "image": null, "isCorrect": true}, {"id": "kd0oz", "text": "Polyacrylonitrile", "image": null, "isCorrect": false}, {"id": "dI1CJ", "text": "Polypropene", "image": null, "isCorrect": false}, {"id": "rO5jl", "text": "Nylon 6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A copolymer is a polymer derived from more than one species of monomer.<br><br>Buna-S is formed by the copolymerization of 1,3-butadiene and styrene. Therefore, it is a copolymer.<br><br>Polyacrylonitrile is formed by the polymerization of a single monomer, acrylonitrile, making it a homopolymer.<br><br>Polypropene is formed by the polymerization of a single monomer, propene, making it a homopolymer.<br><br>Nylon 6 is formed by the polymerization of a single monomer, caprolactam, making it a homopolymer.<br><br>Answer: Buna-S", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b49bf9280d7f99327d9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following is a thermosetting polymer ?", "image": null}, "options": [{"id": "jxfKe", "text": "Polyvinyl", "image": null, "isCorrect": false}, {"id": "4yt7e", "text": "Polystyrene", "image": null, "isCorrect": false}, {"id": "CgqM2", "text": "Ureaformaldehyde", "image": null, "isCorrect": true}, {"id": "o2kkH", "text": "Nylon 6,6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Thermosetting polymers are heavily cross-linked or network polymers which on heating undergo extensive cross-linking in moulds and again become infusible. They cannot be reused.<br><br>Urea-formaldehyde resin is a heavily cross-linked polymer and is an example of a thermosetting polymer.<br><br>Polyvinyl, polystyrene, and nylon 6,6 are examples of thermoplastic polymers or fibers, which can be softened on heating and hardened on cooling.<br><br>Answer: Ureaformaldehyde", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b27bf9280d7f99326bf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify thermoplastic polymer from following.", "image": null}, "options": [{"id": "d0vzx", "text": "Polyvinyl", "image": null, "isCorrect": true}, {"id": "qszwx", "text": "Bakelite", "image": null, "isCorrect": false}, {"id": "IoVU1", "text": "Terylene", "image": null, "isCorrect": false}, {"id": "K5SSi", "text": "Neoprene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Polymers are classified based on intermolecular forces into elastomers, fibres, thermoplastic polymers, and thermosetting polymers.<br><br>Thermoplastic polymers have intermolecular forces of attraction intermediate between elastomers and fibres. Examples include polyethene, polystyrene, and polyvinyls.<br><br>Bakelite is a thermosetting polymer.<br><br>Terylene is a fibre.<br><br>Neoprene is an elastomer.<br><br>Therefore, polyvinyl is a thermoplastic polymer.<br><br>Answer: Polyvinyl", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b25bf9280d7f99326ab", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the monomers use to prepare glyptal.", "image": null}, "options": [{"id": "QsSfS", "text": "$\\beta$ - Hydroxy butyric acid and $\\beta$ - Hydroxy valeric acid", "image": null, "isCorrect": false}, {"id": "eiJxn", "text": "Ethylene glycol and phenol", "image": null, "isCorrect": false}, {"id": "4AuGR", "text": "Ethylene glycol and Terephthalic acid", "image": null, "isCorrect": false}, {"id": "isnqu", "text": "Ethylene glycol and phtalic acid", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Glyptal is a polyester polymer.<br><br>It is prepared by the condensation polymerization of ethylene glycol (ethane-1,2-diol) and phthalic acid (benzene-1,2-dicarboxylic acid).<br><br>Ethylene glycol and terephthalic acid are the monomers for terylene (Dacron).<br><br>$\\beta$-Hydroxy butyric acid and $\\beta$-Hydroxy valeric acid are the monomers for PHBV.<br><br>Answer: Ethylene glycol and phtalic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b12bf9280d7f993260c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following polymers is classified as fibre?", "image": null}, "options": [{"id": "q0TkQ", "text": "Nylon 6, 6", "image": null, "isCorrect": true}, {"id": "XhxH1", "text": "Urea formaldehyde resin", "image": null, "isCorrect": false}, {"id": "9IoLD", "text": "Polystyrene", "image": null, "isCorrect": false}, {"id": "ZCIRD", "text": "Neoprene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Polymers are classified based on intermolecular forces into elastomers, fibres, thermoplastic polymers, and thermosetting polymers.<br><br>Nylon 6, 6 has strong intermolecular forces like hydrogen bonding, which lead to close packing of chains and impart high tensile strength. Therefore, it is classified as a fibre.<br><br>Urea formaldehyde resin is a thermosetting polymer.<br><br>Polystyrene is a thermoplastic polymer.<br><br>Neoprene is an elastomer.<br><br>Answer: Nylon 6, 6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b12bf9280d7f993260a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following polymers is obtained by condensation polymerisation method?", "image": null}, "options": [{"id": "KMMX0", "text": "Polythene", "image": null, "isCorrect": false}, {"id": "3YWVq", "text": "Nylon 6, 6", "image": null, "isCorrect": true}, {"id": "4uOHF", "text": "Polyacrylonitrile", "image": null, "isCorrect": false}, {"id": "kiXHn", "text": "Teflon", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Condensation polymerisation involves the repeated condensation reaction between two different bi-functional or tri-functional monomeric units, usually with the elimination of small molecules like water, alcohol, or hydrogen chloride.<br><br>Nylon 6, 6 is formed by the condensation polymerisation of hexamethylenediamine and adipic acid with the elimination of water molecules.<br><br>Polythene, polyacrylonitrile, and teflon are formed by addition polymerisation of ethene, acrylonitrile, and tetrafluoroethylene, respectively.<br><br>Answer: Nylon 6, 6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b02bf9280d7f9932590", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following polymers is obtained by addition polymerisation method?", "image": null}, "options": [{"id": "4x4QB", "text": "Nylon 6", "image": null, "isCorrect": false}, {"id": "tGCT3", "text": "Terylene", "image": null, "isCorrect": false}, {"id": "vEQIc", "text": "Nylon 6, 6", "image": null, "isCorrect": false}, {"id": "ia1QW", "text": "Teflon", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Teflon (polytetrafluoroethylene) is formed by the addition polymerisation of tetrafluoroethylene ($CF_2=CF_2$) monomers.<br><br>Nylon 6, Terylene, and Nylon 6, 6 are step-growth polymers formed by condensation polymerisation.<br><br>Therefore, Teflon is the polymer obtained by addition polymerisation.<br><br>Answer: Teflon", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b00bf9280d7f993257d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following polymers needs peroxide as initiator for preparation?", "image": null}, "options": [{"id": "C9GoX", "text": "Nylon 6,6", "image": null, "isCorrect": false}, {"id": "dcUdp", "text": "Polyacrylonitrile", "image": null, "isCorrect": true}, {"id": "GlclW", "text": "Terylene", "image": null, "isCorrect": false}, {"id": "weAWD", "text": "Bakelite", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Polyacrylonitrile is an addition polymer formed by the polymerization of acrylonitrile. Addition polymerization typically proceeds via a free radical mechanism, which requires a free radical initiator such as a peroxide (e.g., benzoyl peroxide).<br><br>Nylon 6,6, Terylene, and Bakelite are condensation polymers and do not require a peroxide initiator for their preparation.<br><br>Answer: Polyacrylonitrile", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214330aee93fa0796dec8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Which from following polymers is used as substitute for wool?", "image": null}, "options": [{"id": "YXkHp", "text": "Teflon", "image": null, "isCorrect": false}, {"id": "hyTFj", "text": "LDP.", "image": null, "isCorrect": false}, {"id": "moQdm", "text": "Dacron", "image": null, "isCorrect": false}, {"id": "oORBe", "text": "Polyacrylonitrile", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Polyacrylonitrile (PAN) is an addition polymer of acrylonitrile.<br><br>It resembles wool in its properties and is used as a substitute for wool in making commercial fibres such as Orlon or Acrilan, which are used for making blankets, sweaters, etc.<br><br>Teflon is used for non-stick coatings.<br><br>LDP is used for packaging and squeeze bottles.<br><br>Dacron is used for making crease-resistant clothes.<br><br>Answer: Polyacrylonitrile", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141e0aee93fa0796de21", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Which from following is semisynthetic polymer?", "image": null}, "options": [{"id": "bFdBt", "text": "Dacron", "image": null, "isCorrect": false}, {"id": "M5uOg", "text": "Nylon 6", "image": null, "isCorrect": false}, {"id": "f2ojz", "text": "Wool", "image": null, "isCorrect": false}, {"id": "lV52v", "text": "Cellulose nitrate", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Polymers are classified based on their source into natural, synthetic, and semisynthetic polymers.<br><br>Natural polymers are obtained from nature (plants and animals). Example: Wool.<br><br>Synthetic polymers are artificially prepared in the laboratory. Examples: Dacron, Nylon 6.<br><br>Semisynthetic polymers are derived from naturally occurring polymers by chemical modifications. Cellulose nitrate is prepared by the nitration of natural cellulose, making it a semisynthetic polymer.<br><br>Answer: Cellulose nitrate", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140e0aee93fa0796dda0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Which from following polymers (trade name) is used to obtain paints?", "image": null}, "options": [{"id": "Ieuhx", "text": "Glyptal", "image": null, "isCorrect": true}, {"id": "YZ9DU", "text": "Polycarbonate", "image": null, "isCorrect": false}, {"id": "KFkVV", "text": "Perspexe", "image": null, "isCorrect": false}, {"id": "F93nB", "text": "PVC", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Glyptal is a polyester formed by the condensation polymerization of ethylene glycol and phthalic acid. It is an alkyd resin and is widely used in the manufacture of paints, lacquers, and building materials.<br><br>Polycarbonate is used for making bulletproof glass and compact discs.<br><br>Perspex (Polymethyl methacrylate) is used for making lenses, transparent domes, and aircraft windows.<br><br>PVC (Polyvinyl chloride) is used for making pipes, raincoats, and electrical insulation.<br><br>Answer: Glyptal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140d0aee93fa0796dd96", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Identify the monomer used to obtain a polymer that resembles the wool.", "image": null}, "options": [{"id": "UNr03", "text": "$\\mathrm{CH}_2=\\mathrm{CHCN}$", "image": null, "isCorrect": true}, {"id": "kld0A", "text": "$\\mathrm{F}_2 \\mathrm{C}=\\mathrm{CF}_2$", "image": null, "isCorrect": false}, {"id": "HIDfm", "text": "$\\mathrm{H}_2 \\mathrm{C}=\\mathrm{CHCl}$", "image": null, "isCorrect": false}, {"id": "uKs4Z", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/J4uOYeifHybBfcaVrg2HSCsFfFAO4bXjkWMMwvNe6rQ.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The polymer that resembles wool and is used as its substitute in making blankets, sweaters, etc., is Polyacrylonitrile (PAN), also known commercially as Orlon or Acrilan.<br><br>The monomer used to prepare Polyacrylonitrile is acrylonitrile, which has the chemical formula $\\mathrm{CH}_2=\\mathrm{CHCN}$.<br><br>Other options:<br>$\\mathrm{F}_2 \\mathrm{C}=\\mathrm{CF}_2$ is tetrafluoroethylene, the monomer for Teflon.<br>$\\mathrm{H}_2 \\mathrm{C}=\\mathrm{CHCl}$ is vinyl chloride, the monomer for PVC.<br>The image shows chloroprene, the monomer for neoprene rubber.<br><br>Answer: $\\mathrm{CH}_2=\\mathrm{CHCN}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fc0aee93fa0796dd15", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Which from following polymers contain - $\\mathrm{CO}-\\mathrm{NH}-$ linkage in it?.", "image": null}, "options": [{"id": "BiQYw", "text": "Urea formaldehyde resin", "image": null, "isCorrect": true}, {"id": "CmaNl", "text": "Glyptal", "image": null, "isCorrect": false}, {"id": "hnwPf", "text": "Polycarbonate", "image": null, "isCorrect": false}, {"id": "V8fbf", "text": "Thermacol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Urea formaldehyde resin is a condensation polymer formed from urea ($\\mathrm{NH_2-CO-NH_2}$) and formaldehyde ($\\mathrm{HCHO}$). Its structure contains the $-\\mathrm{NH}-\\mathrm{CO}-\\mathrm{NH}-\\mathrm{CH_2}-$ repeating unit, which includes the $-\\mathrm{CO}-\\mathrm{NH}-$ (amide) linkage.<br><br>Glyptal is a polyester containing $-\\mathrm{CO}-\\mathrm{O}-$ linkages.<br><br>Polycarbonate contains carbonate ($-\\mathrm{O}-\\mathrm{CO}-\\mathrm{O}-$) linkages.<br><br>Thermacol (polystyrene) is an addition polymer containing only carbon-carbon bonds in its backbone.<br><br>Answer: Urea formaldehyde resin", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d40aee93fa0796dbd7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Which from following statements is NOT correct about thermoplastic polymers?", "image": null}, "options": [{"id": "AjjFS", "text": "These are softened on heating.", "image": null, "isCorrect": false}, {"id": "aFUJU", "text": "Intermolecular forces involved in these are moderately strong intermediate between elastomers and fibres.", "image": null, "isCorrect": false}, {"id": "6EzuQ", "text": "These possess extensive cross linking by covalent bonds.", "image": null, "isCorrect": true}, {"id": "yqTe8", "text": "These are easily moulded.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Thermoplastic polymers are linear or slightly branched long chain molecules capable of repeatedly softening on heating and hardening on cooling.<br><br>The intermolecular forces of attraction in thermoplastic polymers are intermediate between those of elastomers and fibres.<br><br>Because they soften on heating, they can be easily moulded into desired shapes.<br><br>Extensive cross-linking by covalent bonds is a characteristic of thermosetting polymers, not thermoplastic polymers. Therefore, the statement about extensive cross-linking is incorrect.<br><br>Answer: These possess extensive cross linking by covalent bonds.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d30aee93fa0796dbd0", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Identify the source of linen from following:", "image": null}, "options": [{"id": "0oPuR", "text": "Flax plant", "image": null, "isCorrect": true}, {"id": "CDbM0", "text": "Cotton plant", "image": null, "isCorrect": false}, {"id": "m2VgL", "text": "Cane plant", "image": null, "isCorrect": false}, {"id": "gpWJL", "text": "Rubber plant", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Linen is a textile made from the fibers of the flax plant. The fibers are extracted from the stem of the flax plant through a process called retting, and then spun into yarn to weave linen fabric.<br><br>Answer: Flax plant", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c40aee93fa0796db58", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Identify a polymer obtained from $\\beta$-hydroxybutyric acid and $\\beta$-hydroxyvaleric acid.", "image": null}, "options": [{"id": "8IzXo", "text": "PHBV", "image": null, "isCorrect": true}, {"id": "YvXXG", "text": "Nylon 2-nylon 6", "image": null, "isCorrect": false}, {"id": "QHTHH", "text": "Buna-N", "image": null, "isCorrect": false}, {"id": "lQ9Y5", "text": "Thermocol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The polymer obtained from the copolymerization of 3-hydroxybutanoic acid ($\\beta$-hydroxybutyric acid) and 3-hydroxypentanoic acid ($\\beta$-hydroxyvaleric acid) is Poly $\\beta$-hydroxybutyrate-co-$\\beta$-hydroxyvalerate, commonly known as PHBV.<br><br>PHBV is a biodegradable aliphatic polyester.<br><br>Nylon 2-nylon 6 is a copolymer of glycine and aminocaproic acid.<br><br>Buna-N is a copolymer of 1,3-butadiene and acrylonitrile.<br><br>Thermocol is a commercial name for polystyrene.<br><br>Answer: PHBV", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ae0aee93fa0796dab1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Identify the polymer used to obtain LCD screen from following.", "image": null}, "options": [{"id": "QWLhp", "text": "Polyacrylamide", "image": null, "isCorrect": false}, {"id": "RO15l", "text": "Buna-N", "image": null, "isCorrect": false}, {"id": "Xxm0v", "text": "Polycarbonate", "image": null, "isCorrect": true}, {"id": "3p4MJ", "text": "Perspex", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Polycarbonate is a tough, transparent, and high-impact resistant thermoplastic polymer.<br><br>It is widely used in the manufacture of electrical and telecommunication hardware, food-grade plastic containers, and LCD screens.<br><br>Polyacrylamide is used in gel electrophoresis.<br><br>Buna-N is a synthetic rubber used in oil seals and tank linings.<br><br>Perspex (PMMA) is used as a glass substitute in windows and lenses.<br><br>Thus, Polycarbonate is the polymer used to obtain LCD screens.<br><br>Answer: Polycarbonate", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ad0aee93fa0796daa9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Which from following polymers is grouped under elastomers?", "image": null}, "options": [{"id": "JZooa", "text": "Buna-S", "image": null, "isCorrect": true}, {"id": "iM0NR", "text": "Nylon 6,6", "image": null, "isCorrect": false}, {"id": "A4tiv", "text": "
