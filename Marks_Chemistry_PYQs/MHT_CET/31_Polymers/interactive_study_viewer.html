Terylene", "image": null, "isCorrect": false}, {"id": "m8Ons", "text": "Polythene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Elastomers are rubber-like solid polymers with elastic properties, where the polymer chains are held together by the weakest intermolecular forces.<br><br>Buna-S is a synthetic rubber and is classified as an elastomer.<br><br>Nylon 6,6 and Terylene are classified as fibres, which have strong intermolecular forces like hydrogen bonding.<br><br>Polythene is a thermoplastic polymer, which has intermolecular forces intermediate between elastomers and fibres.<br><br>Answer: Buna-S", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139a0aee93fa0796da13", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Identify biodegradable polymer from following.", "image": null}, "options": [{"id": "teXgQ", "text": "Teflon", "image": null, "isCorrect": false}, {"id": "t2r4Q", "text": "PHBV", "image": null, "isCorrect": true}, {"id": "9pdXi", "text": "LDP", "image": null, "isCorrect": false}, {"id": "LKO31", "text": "Polyacrylonitrile", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Biodegradable polymers are those which can be decomposed by microorganisms over a period of time.<br><br>PHBV (Poly $\\beta$-hydroxybutyrate-co-$\\beta$-hydroxyvalerate) is an aliphatic polyester and is a well-known biodegradable polymer.<br><br>Teflon, LDP (Low-density polyethylene), and Polyacrylonitrile are synthetic polymers that are non-biodegradable.<br><br>Answer: PHBV", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213990aee93fa0796da0b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Which polymer is obtained from monomers using\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/LbWk6uxmMnSRWz_CHcP1GaP6yB5J9UeBtTMNgLxRTG4.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "OLhHj", "text": "Polycarbonate", "image": null, "isCorrect": false}, {"id": "OxJDP", "text": "Polyacrylamide", "image": null, "isCorrect": false}, {"id": "4Yg25", "text": "Büna-N", "image": null, "isCorrect": true}, {"id": "9S4YB", "text": "Acrylic glass", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The first monomer shown in the image is 1,3-butadiene ($CH_2=CH-CH=CH_2$).<br><br>The second monomer shown is acrylonitrile ($CH_2=CH-CN$).<br><br>The copolymerization of 1,3-butadiene and acrylonitrile produces the polymer Buna-N (also known as nitrile rubber).<br><br>Answer: Büna-N", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138b0aee93fa0796d9a0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Which from following is an addition copolymer?", "image": null}, "options": [{"id": "ceCNw", "text": "Nylon 6", "image": null, "isCorrect": false}, {"id": "UFOFf", "text": "Nylon 6,6", "image": null, "isCorrect": false}, {"id": "XK5cS", "text": "Polythene", "image": null, "isCorrect": false}, {"id": "aqSVb", "text": "Buna - S", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Addition polymers are formed by the repeated addition of monomer molecules possessing double or triple bonds. Copolymers are formed by the polymerization of two or more different monomers.<br><br>Nylon 6 is a condensation homopolymer formed from caprolactam.<br><br>Nylon 6,6 is a condensation copolymer formed from hexamethylenediamine and adipic acid.<br><br>Polythene is an addition homopolymer formed from ethene.<br><br>Buna-S is formed by the addition polymerization of two different monomers, 1,3-butadiene and styrene. Therefore, it is an addition copolymer.<br><br>Answer: Buna - S", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213770aee93fa0796d8fc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which from following polymers is NOT obtained by addition polymerisation method?", "image": null}, "options": [{"id": "S2gIG", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/Uhc-d174pP9K-n-0w6_qIH2jo_HB7C-x-7yptiCLQtg.fullsize.png\"/>", "image": null, "isCorrect": false}, {"id": "DCLpG", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/vk-cd174pP9K-n-0w6_qIH2jo_HB7C-x-7yptiCLQtg.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "w38wo", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/3AFSEmGj84XUnAkgDaDM_61dvrzQOJUBfK3Znk7pIdA.original.fullsize.png\"/><br/>", "image": null, "isCorrect": true}, {"id": "2gZka", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/L3IC48tecCek7sZKlqTPvPB-gp7dg5x8JLkv47dRO0c.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Addition polymers are formed by the repeated addition of monomer molecules possessing double or triple bonds, without the elimination of any small molecules.<br><br>1. $[-\\text{CH}_2-\\text{CH}_2-]_n$ is polythene, formed by the addition polymerisation of ethene ($\\text{CH}_2=\\text{CH}_2$).<br><br>2. $[-\\text{CH}_2-\\text{CH}(\\text{CN})-]_n$ is polyacrylonitrile (PAN), formed by the addition polymerisation of acrylonitrile ($\\text{CH}_2=\\text{CH}-\\text{CN}$).<br><br>3. $[-\\text{NH}-(\\text{CH}_2)_5-\\text{CO}-]_n$ is Nylon-6, which is a condensation polymer obtained by heating caprolactam with water at high temperatures.<br><br>4. $[-\\text{CH}_2-\\text{CH}(\\text{Cl})-]_n$ is polyvinyl chloride (PVC), formed by the addition polymerisation of vinyl chloride ($\\text{CH}_2=\\text{CH}-\\text{Cl}$).<br><br>Therefore, Nylon-6 is not obtained by addition polymerisation.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/3AFSEmGj84XUnAkgDaDM_61dvrzQOJUBfK3Znk7pIdA.original.fullsize.png\"/><br/>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213510aee93fa0796d7d7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Which from following polymers is obtained by ring opening polymerization method?", "image": null}, "options": [{"id": "bYocj", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/oI45O4_stpb51AkxtOrKY1d9dqVKDY0JHie45Qx-rgQ.original.fullsize_2.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "GN9GS", "text": "$\\quad\\left[\\mathrm{NH}-\\left(\\mathrm{CH}_2\\right)_5-\\mathrm{CO}\\right]_{\\mathrm{n}}$", "image": null, "isCorrect": true}, {"id": "9QNbW", "text": "$\\left[\\mathrm{CH}_2-\\mathrm{CH}_2\\right]_{\\mathrm{n}}$", "image": null, "isCorrect": false}, {"id": "16oV8", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/Ea86H8EChpPTAwS5W0mWO0KGYFAcnDXsRuGJFHgu4mg.original.fullsize_2.png\"/><br/>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The polymer obtained by ring-opening polymerization is Nylon-6.<br><br>Nylon-6 is synthesized by heating caprolactam (a cyclic amide with a 7-membered ring) with water at a high temperature. The reaction involves the opening of the caprolactam ring to form the repeating unit of the polymer.<br><br>The structure of Nylon-6 is $[\\mathrm{NH}-(\\mathrm{CH}_2)_5-\\mathrm{CO}]_{\\mathrm{n}}$.<br><br>Other options:<br>1. Polyvinyl chloride (PVC) is formed by the addition polymerization of vinyl chloride.<br>2. Polyethylene is formed by the addition polymerization of ethene.<br>3. Nylon-6,6 is formed by the condensation polymerization of adipic acid and hexamethylenediamine.<br><br>Answer: $\\quad\\left[\\mathrm{NH}-\\left(\\mathrm{CH}_2\\right)_5-\\mathrm{CO}\\right]_{\\mathrm{n}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134d0aee93fa0796d7bb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Identify homopolymer from following.", "image": null}, "options": [{"id": "oXrdV", "text": "Polycarbonate", "image": null, "isCorrect": false}, {"id": "4UcLY", "text": "Buna-N", "image": null, "isCorrect": false}, {"id": "ADcfX", "text": "Glyptal", "image": null, "isCorrect": false}, {"id": "SUpA4", "text": "Thermocol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Thermocol is a commercial name for expanded polystyrene, which is an addition polymer formed by the polymerization of a single monomer, styrene. Hence, it is a homopolymer.<br><br>Polycarbonate is a copolymer of bisphenol A and phosgene.<br><br>Buna-N is a copolymer of 1,3-butadiene and acrylonitrile.<br><br>Glyptal is a copolymer of ethylene glycol and phthalic acid.<br><br>Answer: Thermocol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133c0aee93fa0796d732", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Identify thermosetting polymer from following.", "image": null}, "options": [{"id": "ZNIcq", "text": "Urea formaldehyde resin", "image": null, "isCorrect": true}, {"id": "hR1gf", "text": "Polystyrene", "image": null, "isCorrect": false}, {"id": "Nfdsy", "text": "Polyesters", "image": null, "isCorrect": false}, {"id": "ljyXC", "text": "Polyamides", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Thermosetting polymers are heavily branched or cross-linked polymers which on heating undergo extensive cross-linking in moulds and again become infusible. They cannot be reused.<br><br>Urea formaldehyde resin is a heavily cross-linked polymer and is a classic example of a thermosetting polymer.<br><br>Polystyrene is a thermoplastic polymer.<br><br>Polyesters and polyamides are generally classified as fibres or thermoplastics.<br><br>Answer: Urea formaldehyde resin", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262380279619d9d8a32c1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Which from following polymers is grouped in the category of elastomers?", "image": null}, "options": [{"id": "0kdhn", "text": "Neoprene", "image": null, "isCorrect": true}, {"id": "PIf1J", "text": "Terylene", "image": null, "isCorrect": false}, {"id": "WXtR9", "text": "Polystyrene", "image": null, "isCorrect": false}, {"id": "QT90w", "text": "Bakelite", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12 | Ch-15 | Subtopic-15.2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262240279619d9d8a3222", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Identify thermosetting polymer from following.", "image": null}, "options": [{"id": "3wkwC", "text": "Urea formaldehyde resin", "image": null, "isCorrect": true}, {"id": "gtGmX", "text": "Polythene", "image": null, "isCorrect": false}, {"id": "zuS1M", "text": "Polystyrene", "image": null, "isCorrect": false}, {"id": "9suXd", "text": "Polyvinyls", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\begin{array}{|l|l|l|} \\hline Std.12 & Ch-15 & Subtopic-15.2 \\\\ \\hline \\end{array}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fe0279619d9d8a30f3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Which among the following pairs of polymers contains both members as copolymers?", "image": null}, "options": [{"id": "ATHFU", "text": "Neoprene and Isoprene", "image": null, "isCorrect": false}, {"id": "leGfq", "text": "Orlon and Teflon", "image": null, "isCorrect": false}, {"id": "Ngxy2", "text": "Bakelite and Orlon", "image": null, "isCorrect": false}, {"id": "XS0I4", "text": "SBR and PHBV", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "PHBV - It is a copolymer of two bifunctional $\\beta$-hydroxy carboxylic acids, namely, $\\beta$-hydroxybutyric acid (3-hydroxybutanoic acid) and $\\beta$-hydroxyvaleric acid (3-hydroxypentanoic acid).\n\nSBR - It is a copolymer of styrene with butadiene.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "solution": {"text": "PHBV is obtained by the copolymerisation of 3 -hydroxybutanoic acid \\& 3- hydroxypentanoic acid.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Tt0cEqBp4wwcFXYz2GCIHWJD30ldD8IqPDMxidP9tic.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f480279619d9d8a1b35", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "Which among the following is a linear polymer?", "image": null}, "options": [{"id": "fcH2C", "text": "Melamine", "image": null, "isCorrect": false}, {"id": "qckup", "text": "Vulcanised rubber", "image": null, "isCorrect": false}, {"id": "R3Zpi", "text": "Polyvinylchloride", "image": null, "isCorrect": true}, {"id": "edbxQ", "text": "Polypropylene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "i. Linear polymer - Polyvinylchloride\nii. Branched chain polymer - Polypropylene\niii. Network or cross linked polymer - Vulcanised rubber, Melamine.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f220279619d9d8a1a0c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "Which among the following statements about terpenes is NOT true?", "image": null}, "options": [{"id": "QR3WT", "text": "Terpenes occur in essential oils", "image": null, "isCorrect": false}, {"id": "yDXmS", "text": "Terpenes include vitamin A, E and $\\mathrm{K}$", "image": null, "isCorrect": false}, {"id": "oCGwt", "text": "Terpenes consist of isoprene units", "image": null, "isCorrect": false}, {"id": "sC1d0", "text": "Terpenes are saturated hydrocarbons", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Terpenes are hydrocarbons that are classified by the number of isoprene units (C5H8), with the most common being mono-, sesqui-, and di-terpenes (C10, C15, and C20, respectively).\nTerpenes are highly aromatic compounds that determine the smell of many plants and herbs, such as rosemary and lavender, as well as some animals. Manufacturers use isolated terpenes to create the flavors and scents of many everyday products, such as perfumes, body products, and even foods.\nThe side chains of Vitamin A, E, K, squalene (unsaturated hydrocarbon found in shark, humans) are all constituents of terpenes.\nTerpenes are important constituents of essential oils, having a chemical structure consisting of repeated isoprene $\\left(\\mathrm{C}_{5} \\mathrm{H}_{8}\\right)$ units. They are classified into monoterpenes $\\left(C_{10}\\right)$, sesquiterpenes $\\left(C_{15}\\right)$, and diterpenes $\\left(C_{20}\\right)$ based on whether they are made up of two, three, or four isoprene units respectively.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eed0279619d9d8a1865", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "<math><mi mathvariant=\"normal\">β</mi></math> -pleated sheets of polypeptide chains are present in", "image": null}, "options": [{"id": "HLPVg", "text": "Secondary structure", "image": null, "isCorrect": true}, {"id": "Vb9AY", "text": "Primary structure", "image": null, "isCorrect": false}, {"id": "qnlLl", "text": "Tertiary structure", "image": null, "isCorrect": false}, {"id": "wdY3a", "text": "quaternary structure", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the <math><mi mathvariant=\"normal\">β</mi><mo>-</mo></math> sheets structure of proteins, polypeptide chains are present as parallel or anti-parallel to each other.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eec0279619d9d8a185a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "Which among the following is NOT a semi-synthetic polymer?", "image": null}, "options": [{"id": "7uqkE", "text": "Terylene", "image": null, "isCorrect": true}, {"id": "jN5Df", "text": "Viscose-Rayon", "image": null, "isCorrect": false}, {"id": "QOzam", "text": "Cupra-ammonium silk", "image": null, "isCorrect": false}, {"id": "qartF", "text": "Acetate Rayon", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Terylene is a synthetic polymer made-up of terephthalic acid and ethylene glycol.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f110279619d9d8a1982", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "Which of the following is a natural polymer?", "image": null}, "options": [{"id": "ckjAC", "text": "Nylon", "image": null, "isCorrect": false}, {"id": "dDCxW", "text": "Teflon", "image": null, "isCorrect": false}, {"id": "BLP5m", "text": "Linen", "image": null, "isCorrect": true}, {"id": "trk5d", "text": "Orlon", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Natural polymers are those polymers which are found in plants and animals. Among the given polymers liner is a natural polymer which is made from cellulose (polymer of glucose molecules).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eff0279619d9d8a18f6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "Which among the following polymer does not show cross linking in it?", "image": null}, "options": [{"id": "1rKVy", "text": "Nylon -6", "image": null, "isCorrect": true}, {"id": "nSeru", "text": "Bakelite", "image": null, "isCorrect": false}, {"id": "uvXih", "text": "Melamine", "image": null, "isCorrect": false}, {"id": "9VtLJ", "text": "Vulcanised Rubber", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nylon – 6 – polymer does not show cross linking in it. It is a linear polymer. It is obtained by heating caprolactum with water at a high temperature. Structural formula and name of given polymers is shown below: <br/><table border='1px solid'> <thead> <tr> <th>Name of polymer</th> <th>Structural formula</th> </tr> </thead> <tbody> <tr> <td>Nylon-6</td> <td><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/c96c2e1a-19a5-47a3-8c1a-dbe70a781a31.png\"></td> </tr> <tr> <td>Bakelite</td> <td><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/eda86b90-6aa2-4b17-a0ea-0ce6fac0f30e.png\"></td> </tr> <tr> <td>Melamine</td> <td><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/489f8779-b69f-4344-9bdf-59a21dbbe1d4.png\"></td> </tr> <tr> <td>Vulcanised rubber</td> <td><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/9dba93a1-760c-4438-9ad8-278bdf4113e5.png\"></td> </tr> </tbody> </table>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eff0279619d9d8a18f0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "A polymer which becomes soft on heating and hard on cooling, belongs to class of", "image": null}, "options": [{"id": "eKXsK", "text": "Fibers", "image": null, "isCorrect": false}, {"id": "gvrfd", "text": "Thermosetting Polymer", "image": null, "isCorrect": false}, {"id": "0waD6", "text": "Elastomer", "image": null, "isCorrect": false}, {"id": "rfYvu", "text": "Thermoplastic Polymer", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "‘A polymer which becomes soft on heating and hard on cooling belongs to class of thermoplastics. When these polymers are heated, the polymer becomes soft enough to be moulded into various shapes, e.g. polyethene, polystyrene etc.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed80279619d9d8a17bf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "Which of the following polymers is used to manufacture clothes for firefighters?", "image": null}, "options": [{"id": "ng57L", "text": "Thiokol", "image": null, "isCorrect": false}, {"id": "h0k2l", "text": "Kevlar", "image": null, "isCorrect": false}, {"id": "ZnJMX", "text": "Nomex", "image": null, "isCorrect": true}, {"id": "Uywr5", "text": "Dynel", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nomex is used to manufacture clothes for firefighters", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eaf0279619d9d8a1675", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "Correct statement regarding&nbsp;thermoplastic polymer is", "image": null}, "options": [{"id": "dc3S6", "text": "It does not become soft on heating under pressure", "image": null, "isCorrect": false}, {"id": "gvJRi", "text": "It can not be remoulded", "image": null, "isCorrect": false}, {"id": "Pos7q", "text": "It is either linear or branched chain polymer", "image": null, "isCorrect": true}, {"id": "CZvB3", "text": "It is cross-linked polymer", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Thermoplastic polymer is a linear or branched polymer which can be remolded and becomes soft on heating under pressure.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8f0279619d9d8a156c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "Which of the following can absorb over $90 \\%$ of its own mass of water and also does not stick to wounds?", "image": null}, "options": [{"id": "UDtVV", "text": "Saran", "image": null, "isCorrect": false}, {"id": "TSbHM", "text": "Thiokol", "image": null, "isCorrect": false}, {"id": "hLgvk", "text": "Rayon", "image": null, "isCorrect": true}, {"id": "iruv0", "text": "Gun cotton", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rayon can absorb over $90 \\%$ of its own weight of water and also does not stick to wounds.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e570279619d9d8a13a9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "Rayon is", "image": null}, "options": [{"id": "CYgew", "text": "natural silk", "image": null, "isCorrect": false}, {"id": "TrKbp", "text": "artificial silk", "image": null, "isCorrect": false}, {"id": "DsxBE", "text": "regenerated fibre", "image": null, "isCorrect": true}, {"id": "WUISG", "text": "synthetic fibre", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rayon is a regenerated fibre.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263330279619d9d8a3cf4", "title": "Preparation and Properties of Polymers", "totalQuestions": 156, "questions": [{"_id": "6abb88d515a9fc0fc8c14761", "type": "singleCorrect", "question": {"text": "Which of the following polymers is obtained from-hexamethylene diammonium adipate?", "image": null}, "options": [{"id": "ktpgc", "label": "A", "text": "Nylon 6", "isCorrect": false, "image": null}, {"id": "79BTp", "label": "B", "text": "Nylon 6,6", "isCorrect": true, "image": null}, {"id": "ofyqf", "label": "C", "text": "Dacron", "isCorrect": false, "image": null}, {"id": "n7SGC", "label": "D", "text": "Melamine", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Hexamethylene diammonium adipate is the salt formed by the reaction of hexamethylenediamine and adipic acid.<br><br>When this salt is heated under high pressure, it undergoes condensation polymerization with the elimination of water molecules to form the polyamide Nylon 6,6.<br><br>The name Nylon 6,6 indicates that both monomers (hexamethylenediamine and adipic acid) contain six carbon atoms each.<br><br>Answer: Nylon 6,6", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88d515a9fc0fc8c14760", "type": "singleCorrect", "question": {"text": "Among the given polymers, the transparent polymer used in safety Equipments like helmets is", "image": null}, "options": [{"id": "xUQU2", "label": "A", "text": "PVC", "isCorrect": false, "image": null}, {"id": "3YUQx", "label": "B", "text": "BUNA-N", "isCorrect": false, "image": null}, {"id": "4cxni", "label": "C", "text": "Perspex", "isCorrect": false, "image": null}, {"id": "XEpNP", "label": "D", "text": "Polycarbonate", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Polycarbonate is a tough, transparent, and high-impact resistant polymer.<br><br>Because of its exceptional impact strength and transparency, it is widely used in the manufacture of safety equipments such as helmets, bulletproof glass, and safety goggles.<br><br>PVC is mainly used for pipes and electrical insulation.<br><br>BUNA-N is a synthetic rubber used for oil seals and tank linings.<br><br>Perspex (PMMA) is a transparent polymer used as a glass substitute but is more brittle and less impact-resistant than polycarbonate.<br><br>Answer: Polycarbonate", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a415a9fc0fc8c1459e", "type": "singleCorrect", "question": {"text": "What type of polymers the polycarbonates are?", "image": null}, "options": [{"id": "9zYzW", "label": "A", "text": "Polyester polymers", "isCorrect": true, "image": null}, {"id": "oQx5o", "label": "B", "text": "Polyamide polymers", "isCorrect": false, "image": null}, {"id": "TKm7d", "label": "C", "text": "Biodegradable polymers", "isCorrect": false, "image": null}, {"id": "Xi6K7", "label": "D", "text": "Cross-linked polymers", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Polycarbonates are polymers containing carbonate groups ($-O-(C=O)-O-$) in their backbone chain.<br><br>Since the carbonate group is essentially an ester of carbonic acid, polycarbonates are classified as polyester polymers.<br><br>They are typically formed by the condensation reaction of bisphenol A and phosgene.<br><br>Answer: Polyester polymers", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884515a9fc0fc8c1421b", "type": "singleCorrect", "question": {"text": "Identify a monomer of natural rubber.", "image": null}, "options": [{"id": "udlfo", "label": "A", "text": "Styrene", "isCorrect": false, "image": null}, {"id": "igm59", "label": "B", "text": "Butadiene", "isCorrect": false, "image": null}, {"id": "oKnjV", "label": "C", "text": "Vinyl chloride", "isCorrect": false, "image": null}, {"id": "OR0y2", "label": "D", "text": "Isoprene", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Natural rubber is a linear polymer of isoprene (2-methyl-1,3-butadiene) and is also known as cis-1,4-polyisoprene.<br><br>Therefore, the monomer of natural rubber is isoprene.<br><br>Answer: Isoprene", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884515a9fc0fc8c1421a", "type": "singleCorrect", "question": {"text": "Identify a polymer containing nitrogen.", "image": null}, "options": [{"id": "Jc8Cl", "label": "A", "text": "Bakelite", "isCorrect": false, "image": null}, {"id": "VcHLk", "label": "B", "text": "Dacron", "isCorrect": false, "image": null}, {"id": "uyQuF", "label": "C", "text": "Rubber", "isCorrect": false, "image": null}, {"id": "1ZdB4", "label": "D", "text": "Nylon-6,6", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Bakelite is a condensation polymer of phenol and formaldehyde, which contains carbon, hydrogen, and oxygen.<br><br>Dacron (polyethylene terephthalate) is a polyester formed from ethylene glycol and terephthalic acid, containing carbon, hydrogen, and oxygen.<br><br>Rubber (natural rubber is polyisoprene) is a hydrocarbon polymer containing only carbon and hydrogen.<br><br>Nylon-6,6 is a polyamide formed by the condensation of hexamethylenediamine and adipic acid. The presence of the amide linkage ($-CO-NH-$) means it contains nitrogen.<br><br>Answer: Nylon-6,6", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885515a9fc0fc8c142b1", "type": "singleCorrect", "question": {"text": "The correct reactant pair for the formation of PHBV polymer is-", "image": null}, "options": [{"id": "yx21s", "label": "A", "text": "$3$-hydroxybutanoicacid and $3$-hydroxypentanoicacid", "isCorrect": true, "image": null}, {"id": "g1V0V", "label": "B", "text": "$2$-ethyl-$3$-hydroxybutanoicacid and $3$-hydroxybutanoicacid", "isCorrect": false, "image": null}, {"id": "qQ72m", "label": "C", "text": "$3$-hydroxybutanoicacid and $4$-hydroxy-$2$-methylpentanoicacid", "isCorrect": false, "image": null}, {"id": "ksQAX", "label": "D", "text": "$3$-hydroxy-$2$-methylbutanoicacid and $4$-hydroxy-$3$-methylpentanoicacid.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "PHBV stands for Poly($3$-hydroxybutyrate-co-$3$-hydroxyvalerate).<br><br>It is a biodegradable aliphatic polyester formed by the copolymerisation of $3$-hydroxybutanoic acid and $3$-hydroxypentanoic acid.<br><br>The structure of $3$-hydroxybutanoic acid is $CH_3-CH(OH)-CH_2-COOH$.<br><br>The structure of $3$-hydroxypentanoic acid is $CH_3-CH_2-CH(OH)-CH_2-COOH$.<br><br>These two monomers undergo condensation polymerisation to form PHBV.<br><br>Answer: $3$-hydroxybutanoicacid and $3$-hydroxypentanoicacid", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b415a9fc0fc8c14634", "type": "singleCorrect", "question": {"text": "Find monomers of PHBV.", "image": null}, "options": [{"id": "8bNRG", "label": "A", "text": "$\\beta$ - hydroxy Butyric acid and $\\beta$ - hydroxy Valeric acid", "isCorrect": true, "image": null}, {"id": "9KLyZ", "label": "B", "text": "Glycine and $\\epsilon$ amino caproic acid", "isCorrect": false, "image": null}, {"id": "Sbgpf", "label": "C", "text": "$\\alpha$ - hydroxy Butyric acid and $\\beta$ - hydroxy Valeric acid", "isCorrect": false, "image": null}, {"id": "EFufF", "label": "D", "text": "$\\beta$ - hydroxy Butyric acid and caproic acid", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "PHBV (Poly $\\beta$-hydroxybutyrate-co-$\\beta$-hydroxyvalerate) is a biodegradable aliphatic polyester.<br><br>It is obtained by the copolymerization of 3-hydroxybutanoic acid ($\\beta$-hydroxybutyric acid) and 3-hydroxypentanoic acid ($\\beta$-hydroxyvaleric acid).<br><br>Therefore, the monomers of PHBV are $\\beta$-hydroxybutyric acid and $\\beta$-hydroxyvaleric acid.<br><br>Answer: $\\beta$ - hydroxy Butyric acid and $\\beta$ - hydroxy Valeric acid", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887415a9fc0fc8c143dd", "type": "singleCorrect", "question": {"text": "Identify the monomeric unit present in Orlon.", "image": null}, "options": [{"id": "8Xub6", "label": "A", "text": "Acrolein", "isCorrect": false, "image": null}, {"id": "nhylm", "label": "B", "text": "Glycol", "isCorrect": false, "image": null}, {"id": "vBODa", "label": "C", "text": "Vinyl cyanide", "isCorrect": true, "image": null}, {"id": "o1Tjo", "label": "D", "text": "isoprene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Orlon is the commercial name for polyacrylonitrile (PAN).<br><br>It is an addition polymer formed by the polymerization of acrylonitrile.<br><br>The chemical name of acrylonitrile is vinyl cyanide, and its structure is $CH_2=CH-CN$.<br><br>Answer: Vinyl cyanide", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889415a9fc0fc8c14509", "type": "singleCorrect", "question": {"text": "Which of the following substances is used as accelerator for vulcanization of rubber?", "image": null}, "options": [{"id": "i1WBx", "label": "A", "text": "Manganese dioxide", "isCorrect": false, "image": null}, {"id": "XlfH0", "label": "B", "text": "Zinc butyl xanthate", "isCorrect": true, "image": null}, {"id": "qsX2a", "label": "C", "text": "Hydrogen sulphide", "isCorrect": false, "image": null}, {"id": "oCZV0", "label": "D", "text": "Zinc acetate", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Vulcanization of rubber is a process that improves the physical properties of natural rubber by heating it with sulfur. To increase the rate of vulcanization and lower the required temperature, certain chemical compounds called accelerators are added.<br><br>Zinc butyl xanthate is widely used as an ultra-accelerator in the vulcanization of rubber. It helps in speeding up the cross-linking process between polymer chains.<br><br>Answer: Zinc butyl xanthate", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886515a9fc0fc8c14347", "type": "singleCorrect", "question": {"text": "Which polymer is known as teflon?", "image": null}, "options": [{"id": "lN5L7", "label": "A", "text": "Polyvinyl chloride", "isCorrect": false, "image": null}, {"id": "VFL7d", "label": "B", "text": "Polytetrafluoroethylene", "isCorrect": true, "image": null}, {"id": "iPQf3", "label": "C", "text": "Polyacrylonitrile", "isCorrect": false, "image": null}, {"id": "WiCH1", "label": "D", "text": "Polyurethane", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Teflon is the commercial name for the polymer polytetrafluoroethylene (PTFE).<br><br>It is prepared by heating tetrafluoroethylene ($CF_2=CF_2$) with a free radical or persulphate catalyst at high pressures.<br><br>The polymerization reaction is:<br>$n CF_2=CF_2 \\xrightarrow{\\text{Catalyst/High pressure}} -(CF_2-CF_2)_n-$<br><br>Answer: Polytetrafluoroethylene", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886415a9fc0fc8c14346", "type": "singleCorrect", "question": {"text": "Which of the following is used to make paints and lacquers ?", "image": null}, "options": [{"id": "nOZFJ", "label": "A", "text": "Glyptal", "isCorrect": true, "image": null}, {"id": "WlwRs", "label": "B", "text": "Styrene", "isCorrect": false, "image": null}, {"id": "oaARd", "label": "C", "text": "Perspex", "isCorrect": false, "image": null}, {"id": "qX8aC", "label": "D", "text": "Polycarbonate", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Glyptal is a condensation polymer formed by the reaction of ethylene glycol and phthalic acid.<br><br>It is a highly cross-linked polymer and is widely used in the manufacture of paints and lacquers.<br><br>Styrene is a monomer used to make polystyrene.<br><br>Perspex (polymethyl methacrylate) is used as a glass substitute.<br><br>Polycarbonate is used to make bulletproof glass and compact discs.<br><br>Answer: Glyptal", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c415a9fc0fc8c146ca", "type": "singleCorrect", "question": {"text": "Identify the polymer obtained from acrylonitrile and 1,3-butadiene.", "image": null}, "options": [{"id": "1laYO", "label": "A", "text": "polystyrene", "isCorrect": false, "image": null}, {"id": "xQpaP", "label": "B", "text": "Buna-S", "isCorrect": false, "image": null}, {"id": "CEVow", "label": "C", "text": "Neoprene", "isCorrect": false, "image": null}, {"id": "wyhPm", "label": "D", "text": "Buna-N", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Buna-N is a copolymer formed by the addition polymerization of 1,3-butadiene and acrylonitrile in the presence of a peroxide catalyst.<br><br>The reaction is:<br>$n \\text{CH}_2=\\text{CH}-\\text{CH}=\\text{CH}_2 + n \\text{CH}_2=\\text{CH}(\\text{CN}) \\rightarrow [-\\text{CH}_2-\\text{CH}=\\text{CH}-\\text{CH}_2-\\text{CH}_2-\\text{CH}(\\text{CN})-]_n$<br><br>Buna-S is a copolymer of 1,3-butadiene and styrene.<br>Neoprene is a polymer of chloroprene.<br>Polystyrene is a polymer of styrene.<br><br>Answer: Buna-N", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883515a9fc0fc8c14185", "type": "singleCorrect", "question": {"text": "Which of the following compounds is used to obtain bakelite?", "image": null}, "options": [{"id": "akgHj", "label": "A", "text": "Melamine and formaldehyde", "isCorrect": false, "image": null}, {"id": "sAF7R", "label": "B", "text": "$1, 3$ - butadiene and styrene", "isCorrect": false, "image": null}, {"id": "kE4QN", "label": "C", "text": "Phenol and formaldehyde", "isCorrect": true, "image": null}, {"id": "w6nEF", "label": "D", "text": "Chloroprene and neoprene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Bakelite is a condensation polymer formed by the reaction of phenol and formaldehyde in the presence of either an acid or a base catalyst.<br><br>The initial reaction results in the formation of ortho and/or para-hydroxymethylphenol derivatives, which further react to form linear polymers called Novolac. Upon further heating with formaldehyde, Novolac undergoes cross-linking to form an infusible solid mass known as Bakelite.<br><br>Therefore, the monomers used to obtain Bakelite are phenol and formaldehyde.<br><br>Answer: Phenol and formaldehyde", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883515a9fc0fc8c14184", "type": "singleCorrect", "question": {"text": "Which of the following polymers is known as nylon?", "image": null}, "options": [{"id": "K9ftv", "label": "A", "text": "polyesters", "isCorrect": false, "image": null}, {"id": "yonsd", "label": "B", "text": "polythene", "isCorrect": false, "image": null}, {"id": "FVINz", "label": "C", "text": "polystyrene", "isCorrect": false, "image": null}, {"id": "OfuXJ", "label": "D", "text": "Polyamide polymers", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Nylon is a generic designation for a family of synthetic polymers known as polyamides.<br><br>Polyamides are polymers containing repeating amide linkages ($-CO-NH-$).<br><br>Therefore, polyamide polymers are known as nylon.<br><br>Answer: Polyamide polymers", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ac8c30a4553e1bdb97", "type": "singleCorrect", "question": {"text": "Which of the following is fully Fluorinated polymer?", "image": null}, "options": [{"id": "zl6Ma", "label": "A", "text": "PVC", "isCorrect": false, "image": null}, {"id": "9Y4av", "label": "B", "text": "Teflon", "isCorrect": true, "image": null}, {"id": "HQAlH", "label": "C", "text": "neoprene", "isCorrect": false, "image": null}, {"id": "rooZ2", "label": "D", "text": "Buna-S", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Teflon is the commercial name for polytetrafluoroethylene (PTFE).<br><br>The monomer of Teflon is tetrafluoroethylene, which has the chemical formula $CF_2=CF_2$.<br><br>Since all the hydrogen atoms in the ethylene monomer are replaced by fluorine atoms, Teflon is a fully fluorinated polymer.<br><br>PVC (polyvinyl chloride) contains chlorine and hydrogen, neoprene contains chlorine and hydrogen, and Buna-S is a hydrocarbon polymer containing only carbon and hydrogen.<br><br>Answer: Teflon", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3548c30a4553e1be293", "type": "singleCorrect", "question": {"text": "Which from following polymers is used to obtain shampoo bottles?", "image": null}, "options": [{"id": "MeVrp", "label": "A", "text": "HDPE", "isCorrect": true, "image": null}, {"id": "WwwC5", "label": "B", "text": "LDPE", "isCorrect": false, "image": null}, {"id": "BtA5V", "label": "C", "text": "PP", "isCorrect": false, "image": null}, {"id": "2Tj3U", "label": "D", "text": "PS", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "High-density polyethylene (HDPE) is a tough, hard, and rigid polymer with high tensile strength and excellent chemical resistance. Due to these properties, it is widely used in the manufacture of household articles like buckets, dustbins, pipes, and various types of bottles, including shampoo bottles and milk jugs.<br><br>Low-density polyethylene (LDPE) is typically used for flexible items like squeeze bottles and packaging films, while Polypropylene (PP) is used for ropes and toys, and Polystyrene (PS) is used for making thermocol and cabinet casings.<br><br>Answer: HDPE", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3518c30a4553e1be271", "type": "singleCorrect", "question": {"text": "Identify the monomers used for preparation of glyptal?", "image": null}, "options": [{"id": "Idjjt", "label": "A", "text": "Styrene and phosgene", "isCorrect": false, "image": null}, {"id": "3vk6Y", "label": "B", "text": "Ethylene glycol and phthalic acid", "isCorrect": true, "image": null}, {"id": "Chx5g", "label": "C", "text": "Butadiene and ethylene glycol", "isCorrect": false, "image": null}, {"id": "h7IAz", "label": "D", "text": "Acrylamide and urea", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Glyptal is a condensation polymer belonging to the class of polyesters.<br><br>It is synthesized by the condensation polymerization of ethylene glycol (ethane-1,2-diol) and phthalic acid (benzene-1,2-dicarboxylic acid).<br><br>The polymerization reaction involves the elimination of water molecules to form ester linkages between the monomers.<br><br>Answer: Ethylene glycol and phthalic acid", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f08c30a4553e1bde72", "type": "singleCorrect", "question": {"text": "Identify the use of LDP from following.", "image": null}, "options": [{"id": "eKmG4", "label": "A", "text": "Manufacture of buckets", "isCorrect": false, "image": null}, {"id": "vdvG0", "label": "B", "text": "Preparation of pipes for irrigation", "isCorrect": true, "image": null}, {"id": "5c6JX", "label": "C", "text": "For making nonstick cook ware", "isCorrect": false, "image": null}, {"id": "QtYNo", "label": "D", "text": "For making tyrecords", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Low Density Polyethylene (LDP) is widely used for the preparation of flexible pipes for agriculture, irrigation, domestic water line connections, and as insulation for electric cables.<br><br>High Density Polyethylene (HDP) is used for the manufacture of buckets, dustbins, and rigid pipes.<br><br>Teflon (Polytetrafluoroethylene) is used for making non-stick cookware.<br><br>Nylon 6 is used for making tyre cords, fabrics, and ropes.<br><br>Answer: Preparation of pipes for irrigation", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ef8c30a4553e1bde5f", "type": "singleCorrect", "question": {"text": "Which of the following is the use of HDPE ?", "image": null}, "options": [{"id": "bue1x", "label": "A", "text": "To obtain shopping bags", "isCorrect": false, "image": null}, {"id": "HJYKT", "label": "B", "text": "To prepare shampoo bottles", "isCorrect": true, "image": null}, {"id": "h1XJB", "label": "C", "text": "For making carpet", "isCorrect": false, "image": null}, {"id": "m9vLi", "label": "D", "text": "To obtain food container", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "High-density polyethylene (HDPE) is a tough, hard, and rigid polymer. It is widely used in the manufacture of buckets, dustbins, bottles (such as shampoo bottles), and pipes.<br><br>Low-density polyethylene (LDPE) is highly branched and flexible, making it suitable for shopping bags, squeeze bottles, toys, and flexible pipes.<br><br>Therefore, HDPE is used to prepare shampoo bottles.<br><br>Answer: To prepare shampoo bottles", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3428c30a4553e1be1dc", "type": "singleCorrect", "question": {"text": "Identify the polymer used to prepare disposable cups and plates.", "image": null}, "options": [{"id": "XV0Y9", "label": "A", "text": "Polypropylene", "isCorrect": false, "image": null}, {"id": "hOpj9", "label": "B", "text": "Polystyrene", "isCorrect": true, "image": null}, {"id": "PX943", "label": "C", "text": "Polyethylene terephthalate", "isCorrect": false, "image": null}, {"id": "wiJAi", "label": "D", "text": "High density polyethylene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Polystyrene is a synthetic aromatic hydrocarbon polymer made from the monomer styrene. It is widely used in the manufacture of disposable cups, plates, toys, radio and television cabinets, and as a wrapping material.<br><br>Polypropylene is used for ropes, toys, pipes, and fibres.<br><br>Polyethylene terephthalate (PET) is used for making bottles and synthetic fibres.<br><br>High density polyethylene (HDPE) is used for buckets, dustbins, bottles, and pipes.<br><br>Answer: Polystyrene", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3428c30a4553e1be1da", "type": "singleCorrect", "question": {"text": "Which from following is a first stage in preparation of viscose rayon ?", "image": null}, "options": [{"id": "2MF3J", "label": "A", "text": "$\\text{Cell} - \\text{OH} + \\text{NaOH}$", "isCorrect": true, "image": null}, {"id": "pwusH", "label": "B", "text": "<img style=\"width: 170px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_2__q52_d1.png\" />", "isCorrect": false, "image": null}, {"id": "d1gv0", "label": "C", "text": "<img style=\"width: 170px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_2__q52_d2.png\" />", "isCorrect": false, "image": null}, {"id": "8rm31", "label": "D", "text": "<img style=\"width: 250px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_2__q52_d3.png\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The preparation of viscose rayon involves several steps. <br><br>In the first stage, cellulose is treated with a concentrated solution of sodium hydroxide ($\\text{NaOH}$) to form alkali cellulose. The reaction is:<br>$\\text{Cell}-\\text{OH} + \\text{NaOH} \\rightarrow \\text{Cell}-\\text{ONa} + \\text{H}_2\\text{O}$<br><br>In the subsequent stages, the alkali cellulose is reacted with carbon disulfide ($\\text{CS}_2$) to form sodium cellulose xanthate, which is then dissolved in dilute $\\text{NaOH}$ to form a viscous solution called viscose. Finally, it is extruded into an acid bath to regenerate cellulose fibers.<br><br>Therefore, the first stage is the reaction of cellulose with $\\text{NaOH}$.<br><br>Answer: $\\text{Cell} - \\text{OH} + \\text{NaOH}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c48c30a4553e1bdc94", "type": "singleCorrect", "question": {"text": "Which from following polymers is used to obtain articles like rain coats?", "image": null}, "options": [{"id": "L3AU2", "label": "A", "text": "$-\\!\\!\\left[\\text{CH}_2 - \\text{CH}_2\\right]\\!\\!-_n$", "isCorrect": false, "image": null}, {"id": "SMHRq", "label": "B", "text": "$-\\!\\!\\left[\\text{CH}_2 - \\underset{\\text{CN}}{\\text{CH}}\\right]\\!\\!-_n$", "isCorrect": false, "image": null}, {"id": "FT9Zg", "label": "C", "text": "$-\\!\\!\\left[\\text{CH}_2 - \\underset{\\text{Cl}}{\\text{CH}}\\right]\\!\\!-_n$", "isCorrect": true, "image": null}, {"id": "TJkZL", "label": "D", "text": "$-\\!\\!\\left[\\text{CF}_2 - \\text{CF}_2\\right]\\!\\!-_n$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Polyvinyl chloride (PVC) is a widely used synthetic plastic polymer. It is water-resistant and durable, making it the primary material used in the manufacture of articles like raincoats, hand bags, vinyl flooring, and water pipes.<br><br>The monomer of PVC is vinyl chloride ($\\text{CH}_2=\\text{CHCl}$). Upon polymerization, it forms PVC, which has the repeating unit $-\\left[\\text{CH}_2 - \\underset{\\text{Cl}}{\\text{CH}}\\right]_n-$.<br><br>Answer: $-\\!\\!\\left[\\text{CH}_2 - \\underset{\\text{Cl}}{\\text{CH}}\\right]\\!\\!-_n$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d78c30a4553e1bdd5a", "type": "singleCorrect", "question": {"text": "Identify the polymer used to prepare plastic bottles needed to store cooking oil.", "image": null}, "options": [{"id": "Gwd4t", "label": "A", "text": "PVC", "isCorrect": false, "image": null}, {"id": "2dQ52", "label": "B", "text": "PS", "isCorrect": false, "image": null}, {"id": "gGAL4", "label": "C", "text": "LDPE", "isCorrect": false, "image": null}, {"id": "tDCKF", "label": "D", "text": "PET", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Polyethylene terephthalate (PET) is a strong, lightweight, and transparent synthetic resin belonging to the polyester family of polymers.<br><br>It provides an excellent barrier to oxygen and moisture, making it highly suitable for food packaging.<br><br>PET is widely blow-moulded into disposable plastic bottles used for storing cooking oil, mineral water, and carbonated beverages.<br><br>Answer: PET", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d68c30a4553e1bdd59", "type": "singleCorrect", "question": {"text": "Which polymer is commonly used in nonstick cookwares ?", "image": null}, "options": [{"id": "YjDij", "label": "A", "text": "PVC", "isCorrect": false, "image": null}, {"id": "zv9PR", "label": "B", "text": "Teflon", "isCorrect": true, "image": null}, {"id": "qQGZd", "label": "C", "text": "SBR", "isCorrect": false, "image": null}, {"id": "33Pj7", "label": "D", "text": "Buna -S", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Teflon (polytetrafluoroethylene) is chemically inert and highly resistant to heat. It has a very low coefficient of friction, which prevents food from sticking to the surface.<br><br>Therefore, Teflon is commonly used as a coating in nonstick cookware.<br><br>Answer: Teflon", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d68c30a4553e1bdd58", "type": "singleCorrect", "question": {"text": "Buna-S is prepared from", "image": null}, "options": [{"id": "RiORD", "label": "A", "text": "1, 3- butadiene and vinyl cyanide", "isCorrect": false, "image": null}, {"id": "kaSe3", "label": "B", "text": "1, 3- butadiene and styrene", "isCorrect": true, "image": null}, {"id": "kUBVN", "label": "C", "text": "1,2 -butadiene and vinyl cyanide", "isCorrect": false, "image": null}, {"id": "SQNjW", "label": "D", "text": "1, 2-butadiene and styrene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Buna-S is a copolymer synthesized from $1,3$-butadiene and styrene in the presence of sodium as a catalyst.<br><br>The \"Bu\" stands for $1,3$-butadiene, \"na\" stands for sodium, and \"S\" stands for styrene.<br><br>The polymerization reaction involves the addition of $1,3$-butadiene and styrene molecules to form the elastomer Buna-S, which is also known as styrene-butadiene rubber (SBR).<br><br>Answer: 1, 3- butadiene and styrene", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3388c30a4553e1be173", "type": "singleCorrect", "question": {"text": "Which of the following processes develops cross-links in elastomer?", "image": null}, "options": [{"id": "Ljruv", "label": "A", "text": "galvanization", "isCorrect": false, "image": null}, {"id": "pGpeV", "label": "B", "text": "vulcanization", "isCorrect": true, "image": null}, {"id": "fZbR9", "label": "C", "text": "polymerization", "isCorrect": false, "image": null}, {"id": "6lOrJ", "label": "D", "text": "hydration", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Vulcanization is the chemical process of heating natural rubber with sulfur to improve its physical properties. During this process, sulfur forms cross-links between the polyisoprene chains of the elastomer, which makes the rubber harder, stronger, and more elastic.<br><br>Galvanization is the process of applying a protective zinc coating to iron or steel to prevent rusting.<br><br>Polymerization is the process of forming a polymer from monomers.<br><br>Hydration is the addition of water molecules to a substance.<br><br>Answer: vulcanization", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e48c30a4553e1bddef", "type": "singleCorrect", "question": {"text": "Identify the monomers used to prepare bakelite from the following.", "image": null}, "options": [{"id": "aLbr2", "labe
