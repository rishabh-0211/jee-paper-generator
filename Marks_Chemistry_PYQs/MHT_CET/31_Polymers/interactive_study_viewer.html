els": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Identify the monomer used to prepare Teflon.", "image": null}, "options": [{"id": "Ymlfu", "text": "$\\mathrm{C}_2 \\mathrm{H}_4$", "image": null, "isCorrect": false}, {"id": "C73nf", "text": "$\\mathrm{C}_2 \\mathrm{H}_3 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "9jCtR", "text": "$\\mathrm{CONH}_2$ and $\\mathrm{CH}_2 \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "2yj6t", "text": "$\\mathrm{C}_2 \\mathrm{~F}_4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The monomer used in the preparation of teflon is tetrafluoroethylene, $\\left(\\mathrm{CF}_2=\\mathrm{CF}_2\\right)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2624a0279619d9d8a3354", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Which from following statements is NOT true about natural rubber?", "image": null}, "options": [{"id": "3HcXr", "text": "It is a linear polymer.", "image": null, "isCorrect": false}, {"id": "JXnMl", "text": "In this polymer chain has coiled structure.", "image": null, "isCorrect": false}, {"id": "HS7j4", "text": "In this polymer chains are held together by weak van der Waals forces.", "image": null, "isCorrect": false}, {"id": "CBOF6", "text": "It is obtained from chloroprene.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Natural rubber is a high molecular mass linear polymer of isoprene. It consists of various chains held together by. weak van der Waals forces and has coiled structure.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262370279619d9d8a32bd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Which among the following statements is NOT true for $\\mathrm{LDP}$ ?", "image": null}, "options": [{"id": "jrbBQ", "text": "It needs $\\mathrm{O}_2$ or peroxide as initiator synthesis process.", "image": null, "isCorrect": false}, {"id": "49v2i", "text": "It is a branched chain polymer.", "image": null, "isCorrect": false}, {"id": "Fubaw", "text": "It needs low pressure about $6-7$ atm in synthesis process.", "image": null, "isCorrect": true}, {"id": "zj5LF", "text": "It has low melting point than HDP.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "LDP is prepared by polymerization of ethylene under high pressure $(1000-2000 \\mathrm{~atm})$ and temperature\n$(350-570 \\mathrm{~K})$ in presence of traces of $\\mathrm{O}_2$ or peroxide as initiator.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", " paration of terylene, $n$ moles of glycol are required for $n$ moles of terephthalic acid.\n$\\therefore$ Per mole of terephthalic acid, moles of ethylene glycol required is $=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e670279619d9d8a1421", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "Adipic acid is used in the preparation of", "image": null}, "options": [{"id": "9bLRr", "text": "nylon-6", "image": null, "isCorrect": false}, {"id": "HJYz1", "text": "dacron", "image": null, "isCorrect": false}, {"id": "dA6BB", "text": "nylon-66", "image": null, "isCorrect": true}, {"id": "Wszxt", "text": "novolac", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nylon-66 is a polymer of hexamethylene diammine and adipic acid.\n$n \\mathrm{HOOC}\\left(\\mathrm{CH}_{2}\\right)_{4} \\mathrm{COOH}+n \\mathrm{H}_{2} \\mathrm{~N}\\left(\\mathrm{CH}_{2}\\right)_{6} \\mathrm{NH}_{2}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/t6wgpLBJ2HqklqRC0VOmZtw2lACoVFkU7QratkxuDM8.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e550279619d9d8a1399", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "Terylene is a polymer obtained from", "image": null}, "options": [{"id": "SWMer", "text": "ethylene glycol and glycerol", "image": null, "isCorrect": false}, {"id": "US6Fc", "text": "ethylene glycol and glyceraldehyde", "image": null, "isCorrect": false}, {"id": "53y37", "text": "ethylene glycol and terephthalic acid", "image": null, "isCorrect": true}, {"id": "1oriL", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ethylene glycol on reaction with terephthalic acid forms the polymer terylene (also known as dacron or terene) which is used as synthetic fibre.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/XunBeyJH2weEGk5MMeaotXP7Bn1-TxeD7nnVc1yx7yE.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e440279619d9d8a1313", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Terylene is the polyester of", "image": null}, "options": [{"id": "3b3O5", "text": "hexamethylene diamine and adipic acid", "image": null, "isCorrect": false}, {"id": "vSThx", "text": "vinyl chloride and formaldehyde", "image": null, "isCorrect": false}, {"id": "bM7JV", "text": "melamine and formaldehyde", "image": null, "isCorrect": false}, {"id": "JSisd", "text": "ethylene glycol and terephthalic acid", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Terylene (Dacron) is a polyester fibres which is prepared by condensation polymerisation of ethylene glycol and terephthalic acid with elimination of water.This reaction takes place about 425-475 K.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/rKzMHkA5J9Jp7FVnDHM8t8Xl9C6VCOPDrji6okBxYG8.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e440279619d9d8a130c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Nylon- 66 is not a", "image": null}, "options": [{"id": "uZKAZ", "text": "condensation polymer", "image": null, "isCorrect": false}, {"id": "5VQRu", "text": "polyamide", "image": null, "isCorrect": false}, {"id": "fl5DY", "text": "both (a) and (b)", "image": null, "isCorrect": false}, {"id": "367sc", "text": "None of the above", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Nylon-66 is polyamide fibre which is manufactured by the condensation polymerisation of adipic acid and hexamethylene diamine.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Khc6OXZSCFwSQid0PEqL6NCMrXvDcYgjxg_BtPxtiL8.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
