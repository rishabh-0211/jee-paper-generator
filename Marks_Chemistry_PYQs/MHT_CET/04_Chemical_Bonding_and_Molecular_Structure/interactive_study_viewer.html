  <script>
    const data = {"index": 4, "chapterId": "61c0898ae7a2999fd0a317b2", "chapter": "Chemical Bonding and Molecular Structure", "exam": "MHT CET", "totalTopics": 9, "totalQuestions": 218, "downloadTime": "2026-10-08 20:05:45", "topics": [{"index": 1, "topicId": "65a2632a0279619d9d8a3c97", "title": "Covalent and Co-ordinate Bonding", "totalQuestions": 27, "questions": [{"_id": "6a44d3298c30a4553e1be0d2", "type": "singleCorrect", "question": {"text": "What is formal charge on sulphur in sulphuric acid molecule?", "image": null}, "options": [{"id": "NY4aH", "label": "A", "text": "$-2$", "isCorrect": false, "image": null}, {"id": "DovzX", "label": "B", "text": "$+2$", "isCorrect": false, "image": null}, {"id": "adTtj", "label": "C", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "529Ik", "label": "D", "text": "$0$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The most stable Lewis structure of sulphuric acid ($H_2SO_4$) minimizes the formal charge by expanding the octet of the central sulphur atom. In this structure, sulphur forms two double bonds with two oxygen atoms and two single bonds with two hydroxyl ($-OH$) groups.<br><br>The formula for formal charge is:<br>Formal charge = (Valence electrons) - (Non-bonding electrons) - $\\dfrac{1}{2}$ (Bonding electrons)<br><br>For the sulphur atom in $H_2SO_4$:<br>Number of valence electrons = $6$<br>Number of non-bonding electrons = $0$<br>Number of bonding electrons = $12$ (since it forms $6$ bonds)<br><br>Formal charge = $6 - 0 - \\dfrac{12}{2} = 0$<br><br>Answer: $0$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3458c30a4553e1be1f4", "type": "singleCorrect", "question": {"text": "Which of the following statements regarding Pi $(\\pi)$ bond is NOT true ?", "image": null}, "options": [{"id": "wj1Fs", "label": "A", "text": "It is weaker than sigma bond.", "isCorrect": false, "image": null}, {"id": "EBgsc", "label": "B", "text": "It is formed by lateral overlapping of two half filled P orbitals.", "isCorrect": false, "image": null}, {"id": "3BYFr", "label": "C", "text": "It is formed after the formation of sigma bond.", "isCorrect": false, "image": null}, {"id": "pJzVI", "label": "D", "text": "The presence of Pi $(\\pi)$ bond increases the bond length of covalent bond.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "A pi ($\\pi$) bond is formed by the lateral or sideways overlapping of half-filled atomic orbitals (like p or d orbitals) after the formation of a sigma ($\\sigma$) bond.<br><br>Because the extent of overlapping in a $\\pi$ bond is less than that in a $\\sigma$ bond, a $\\pi$ bond is weaker than a $\\sigma$ bond.<br><br>The presence of a $\\pi$ bond between two atoms increases the bond order (e.g., from single to double or triple bond). An increase in bond order leads to a stronger attractive force between the atoms, which decreases the bond length. For example, the C-C single bond length is $1.54$ \\AA, whereas the C=C double bond length is $1.34$ \\AA.<br><br>Therefore, the statement that the presence of a $\\pi$ bond increases the bond length is incorrect.<br><br>Answer: The presence of Pi $(\\pi)$ bond increases the bond length of covalent bond.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e08c30a4553e1bddc1", "type": "singleCorrect", "question": {"text": "What type of bond and type of overlapping present in $\\text{N}_2$ molecule ?", "image": null}, "options": [{"id": "3eEC4", "label": "A", "text": "Single bond and s$-$s overlap", "isCorrect": false, "image": null}, {"id": "RL0Th", "label": "B", "text": "Double bond and s$-$p overlap", "isCorrect": false, "image": null}, {"id": "sLmzO", "label": "C", "text": "Triple bond and p$-$p overlap", "isCorrect": true, "image": null}, {"id": "CThBL", "label": "D", "text": "Double bond and p$-$p overlap", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The electronic configuration of a nitrogen atom is $1s^2 2s^2 2p^3$.<br><br>Each nitrogen atom has three half-filled $2p$ orbitals ($2p_x, 2p_y, 2p_z$). To achieve a stable octet configuration, two nitrogen atoms share three pairs of electrons, forming a triple bond ($N \\equiv N$).<br><br>The triple bond consists of one $\\sigma$ bond and two $\\pi$ bonds. The $\\sigma$ bond is formed by the axial overlapping of one set of $p$ orbitals (e.g., $2p_z - 2p_z$), while the two $\\pi$ bonds are formed by the lateral overlapping of the remaining two sets of $p$ orbitals (e.g., $2p_x - 2p_x$ and $2p_y - 2p_y$).<br><br>Since all the orbitals involved in the bond formation are $p$ orbitals, the overlapping is of the p$-$p type.<br><br>Therefore, the $N_2$ molecule contains a triple bond and exhibits p$-$p overlap.<br><br>Answer: Triple bond and p$-$p overlap", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3638c30a4553e1be330", "type": "singleCorrect", "question": {"text": "Identify the different types of bonds present in quaternary ammonium salts.", "image": null}, "options": [{"id": "quZPp", "label": "A", "text": "Covalent", "isCorrect": false, "image": null}, {"id": "kY4Z6", "label": "B", "text": "Ionic", "isCorrect": false, "image": null}, {"id": "m8Dwg", "label": "C", "text": "Covalent and co-ordinate", "isCorrect": false, "image": null}, {"id": "Iw2ck", "label": "D", "text": "covalent, co-ordinate and ionic", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Quaternary ammonium salts have the general formula $R_4N^+ X^-$.<br><br>The bonds present within the alkyl or aryl groups ($R$) and three of the nitrogen-carbon bonds are covalent.<br><br>The fourth nitrogen-carbon bond is formed by the donation of the lone pair of electrons from the nitrogen atom to an electron-deficient carbon atom, which is a co-ordinate (dative) bond.<br><br>The electrostatic force of attraction between the complex quaternary ammonium cation ($R_4N^+$) and the counter anion ($X^-$) constitutes an ionic bond.<br><br>Thus, quaternary ammonium salts contain covalent, co-ordinate, and ionic bonds.<br><br>Answer: covalent, co-ordinate and ionic", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c00bf9280d7f9932e63", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following molecules does not obey octet rule?", "image": null}, "options": [{"id": "IzvvI", "text": "$\\mathrm{CO}_2$", "image": null, "isCorrect": false}, {"id": "xpqwI", "text": "$\\mathrm{CHCl}_3$", "image": null, "isCorrect": false}, {"id": "Jk1OC", "text": "$\\mathrm{ClF}_3$", "image": null, "isCorrect": true}, {"id": "qd4oz", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\mathrm{CO}_2$, the central carbon atom forms two double bonds with oxygen atoms, resulting in $8$ electrons in its valence shell.<br><br>In $\\mathrm{CHCl}_3$, the central carbon atom forms four single bonds, resulting in $8$ electrons in its valence shell.<br><br>In $\\mathrm{ClF}_3$, the central chlorine atom has $7$ valence electrons. It forms $3$ single bonds with fluorine atoms and retains $2$ lone pairs. The total number of electrons around the central chlorine atom is $3 \\times 2 + 4 = 10$. This is an expanded octet, so it does not obey the octet rule.<br><br>In $\\mathrm{NH}_3$, the central nitrogen atom forms three single bonds and has one lone pair, resulting in $8$ electrons in its valence shell.<br><br>Thus, $\\mathrm{ClF}_3$ does not obey the octet rule.<br><br>Answer: $\\mathrm{ClF}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbebf9280d7f9932c0a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following pair of compounds consists equal number of lone pair of electrons in the valence shell of central atom?", "image": null}, "options": [{"id": "TjD7H", "text": "$\\mathrm{BrF}_5$ and $\\mathrm{XeF}_6$", "image": null, "isCorrect": true}, {"id": "Q9qaD", "text": "ICl and $\\mathrm{H}_2 \\mathrm{~S}$", "image": null, "isCorrect": false}, {"id": "M6VUP", "text": "$\\mathrm{ClF}_3$ and $\\mathrm{XeF}_2$", "image": null, "isCorrect": false}, {"id": "sZBtv", "text": "$\\mathrm{IF}_7$ and $\\mathrm{XeF}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For $\\mathrm{BrF}_5$, the central atom $\\mathrm{Br}$ has $7$ valence electrons. It forms $5$ single bonds with $\\mathrm{F}$ atoms, leaving $2$ non-bonding electrons, which corresponds to $1$ lone pair.<br><br>For $\\mathrm{XeF}_6$, the central atom $\\mathrm{Xe}$ has $8$ valence electrons. It forms $6$ single bonds with $\\mathrm{F}$ atoms, leaving $2$ non-bonding electrons, which corresponds to $1$ lone pair.<br><br>For $\\mathrm{ICl}$, the central atom $\\mathrm{I}$ has $7$ valence electrons. It forms $1$ single bond with $\\mathrm{Cl}$, leaving $6$ non-bonding electrons, which corresponds to $3$ lone pairs.<br><br>For $\\mathrm{H}_2\\mathrm{S}$, the central atom $\\mathrm{S}$ has $6$ valence electrons. It forms $2$ single bonds with $\\mathrm{H}$ atoms, leaving $4$ non-bonding electrons, which corresponds to $2$ lone pairs.<br><br>For $\\mathrm{ClF}_3$, the central atom $\\mathrm{Cl}$ has $7$ valence electrons. It forms $3$ single bonds with $\\mathrm{F}$ atoms, leaving $4$ non-bonding electrons, which corresponds to $2$ lone pairs.<br><br>For $\\mathrm{XeF}_2$, the central atom $\\mathrm{Xe}$ has $8$ valence electrons. It forms $2$ single bonds with $\\mathrm{F}$ atoms, leaving $6$ non-bonding electrons, which corresponds to $3$ lone pairs.<br><br>For $\\mathrm{IF}_7$, the central atom $\\mathrm{I}$ has $7$ valence electrons. It forms $7$ single bonds with $\\mathrm{F}$ atoms, leaving $0$ non-bonding electrons, which corresponds to $0$ lone pairs.<br><br>For $\\mathrm{XeF}_4$, the central atom $\\mathrm{Xe}$ has $8$ valence electrons. It forms $4$ single bonds with $\\mathrm{F}$ atoms, leaving $4$ non-bonding electrons, which corresponds to $2$ lone pairs.<br><br>Thus, only the pair $\\mathrm{BrF}_5$ and $\\mathrm{XeF}_6$ has an equal number of lone pairs ($1$ each) on the central atom.<br><br>Answer: $\\mathrm{BrF}_5$ and $\\mathrm{XeF}_6$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b57bf9280d7f9932861", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What different types of bonds are formed by chlorine with oxygen in perchloric acid?", "image": null}, "options": [{"id": "qj4Qk", "text": "2-single bonds and 2-double bonds", "image": null, "isCorrect": false}, {"id": "dG1rU", "text": "3 -single bonds and 1-double bond", "image": null, "isCorrect": false}, {"id": "zuAHE", "text": "2-single bonds and 3-double bonds", "image": null, "isCorrect": false}, {"id": "jUXzF", "text": "1 -single bond and 3-double bonds", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The chemical formula of perchloric acid is $HClO_4$.<br><br>In its structure, the central chlorine atom is bonded to four oxygen atoms. One of the oxygen atoms is further bonded to a hydrogen atom, forming a hydroxyl ($-OH$) group. This oxygen is attached to the chlorine atom by a single bond ($Cl-O$).<br><br>The other three oxygen atoms are bonded to the chlorine atom by double bonds ($Cl=O$) to minimize the formal charge on the atoms, as chlorine can expand its octet.<br><br>Therefore, chlorine forms $1$ single bond and $3$ double bonds with oxygen in perchloric acid.<br><br>Answer: 1 -single bond and 3-double bonds", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b49bf9280d7f99327e1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following molecules consist minimum lone pair of electrons in the valence shell of central atom?", "image": null}, "options": [{"id": "9rqdy", "text": "$\\mathrm{SCl}_2$", "image": null, "isCorrect": false}, {"id": "uOVSb", "text": "$\\mathrm{PCl}_3$", "image": null, "isCorrect": true}, {"id": "YagWl", "text": "$\\mathrm{ClF}_3$", "image": null, "isCorrect": false}, {"id": "As3lO", "text": "$\\mathrm{XeF}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\mathrm{SCl}_2$, the central atom sulphur has $6$ valence electrons. It forms $2$ bonds, leaving $4$ electrons or $2$ lone pairs.<br><br>In $\\mathrm{PCl}_3$, the central atom phosphorus has $5$ valence electrons. It forms $3$ bonds, leaving $2$ electrons or $1$ lone pair.<br><br>In $\\mathrm{ClF}_3$, the central atom chlorine has $7$ valence electrons. It forms $3$ bonds, leaving $4$ electrons or $2$ lone pairs.<br><br>In $\\mathrm{XeF}_4$, the central atom xenon has $8$ valence electrons. It forms $4$ bonds, leaving $4$ electrons or $2$ lone pairs.<br><br>Thus, $\\mathrm{PCl}_3$ has the minimum number of lone pairs on the central atom.<br><br>Answer: $\\mathrm{PCl}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b47bf9280d7f99327cc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is Lewis base?", "image": null}, "options": [{"id": "Foush", "text": "$\\mathrm{BF}_3$", "image": null, "isCorrect": false}, {"id": "qbKfA", "text": "$\\mathrm{Cu}^{2+}$", "image": null, "isCorrect": false}, {"id": "ULCAm", "text": "$\\mathrm{AlCl}_3$", "image": null, "isCorrect": false}, {"id": "ASfbZ", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "A Lewis base is a species that can donate a pair of electrons.<br><br>In $\\mathrm{NH}_3$, the central nitrogen atom has a lone pair of electrons which it can donate. Therefore, it acts as a Lewis base.<br><br>$\\mathrm{BF}_3$ and $\\mathrm{AlCl}_3$ are electron-deficient molecules where the central atom has an incomplete octet, so they act as Lewis acids.<br><br>$\\mathrm{Cu}^{2+}$ is a cation that can accept electron pairs, so it also acts as a Lewis acid.<br><br>Answer: $\\mathrm{NH}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b29bf9280d7f99326c9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify a molecule having highest number of lone pair of electrons in valence shell of central atom.", "image": null}, "options": [{"id": "SDF2E", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": false}, {"id": "dPa8w", "text": "$\\mathrm{SF}_4$", "image": null, "isCorrect": false}, {"id": "hO24R", "text": "$\\mathrm{ICl}_3$", "image": null, "isCorrect": true}, {"id": "7NI63", "text": "$\\mathrm{PCl}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\mathrm{NH}_3$, the central atom nitrogen has $5$ valence electrons. It forms $3$ single bonds with hydrogen atoms, leaving $2$ non-bonding electrons, which corresponds to $1$ lone pair.<br><br>In $\\mathrm{SF}_4$, the central atom sulphur has $6$ valence electrons. It forms $4$ single bonds with fluorine atoms, leaving $2$ non-bonding electrons, which corresponds to $1$ lone pair.<br><br>In $\\mathrm{ICl}_3$, the central atom iodine has $7$ valence electrons. It forms $3$ single bonds with chlorine atoms, leaving $4$ non-bonding electrons, which corresponds to $2$ lone pairs.<br><br>In $\\mathrm{PCl}_3$, the central atom phosphorus has $5$ valence electrons. It forms $3$ single bonds with chlorine atoms, leaving $2$ non-bonding electrons, which corresponds to $1$ lone pair.<br><br>Thus, $\\mathrm{ICl}_3$ has the highest number of lone pairs on the central atom.<br><br>Answer: $\\mathrm{ICl}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214220aee93fa0796de3f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Which among the following is an example of odd electron molecule?", "image": null}, "options": [{"id": "yWAD0", "text": "$\\mathrm{BF}_3$", "image": null, "isCorrect": false}, {"id": "mnGQ9", "text": "LiCl", "image": null, "isCorrect": false}, {"id": "SUvXg", "text": "NO", "image": null, "isCorrect": true}, {"id": "yduMK", "text": "$\\quad \\mathrm{PCl}_5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total number of valence electrons in $\\mathrm{BF}_3 = 3 + 3 \\times 7 = 24$ (even).<br><br>Total number of valence electrons in $\\mathrm{LiCl} = 1 + 7 = 8$ (even).<br><br>Total number of valence electrons in $\\mathrm{NO} = 5 + 6 = 11$ (odd).<br><br>Total number of valence electrons in $\\mathrm{PCl}_5 = 5 + 5 \\times 7 = 40$ (even).<br><br>Since $\\mathrm{NO}$ has an odd number of valence electrons, it is an odd electron molecule.<br><br>Answer: NO", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e70aee93fa0796dc70", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Which of the following compounds follows octet rule?", "image": null}, "options": [{"id": "d7OAK", "text": "$\\mathrm{H}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": false}, {"id": "9tgn7", "text": "$\\mathrm{NO}_2$", "image": null, "isCorrect": false}, {"id": "GXFLi", "text": "$\\mathrm{SCl}_2$", "image": null, "isCorrect": true}, {"id": "l0O3L", "text": "$\\mathrm{SF}_6$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\mathrm{H}_2 \\mathrm{SO}_4$, the central sulfur atom forms six bonds (two double bonds and two single bonds), resulting in 12 electrons in its valence shell. This is an example of an expanded octet.<br><br>In $\\mathrm{NO}_2$, the central nitrogen atom has 7 electrons in its valence shell, making it an odd-electron molecule that does not follow the octet rule.<br><br>In $\\mathrm{SCl}_2$, the central sulfur atom forms two single bonds with two chlorine atoms and has two lone pairs of electrons. The total number of electrons around the sulfur atom is $4 \\text{ (bonding)} + 4 \\text{ (non-bonding)} = 8$ electrons. Thus, it strictly follows the octet rule.<br><br>In $\\mathrm{SF}_6$, the central sulfur atom forms six single bonds, resulting in 12 electrons in its valence shell, which is again an expanded octet.<br><br>Answer: $\\mathrm{SCl}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d80aee93fa0796dbfa", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "What is the number of Lewis structures for $\\mathrm{NO}_2^{-}$?", "image": null}, "options": [{"id": "4k7kG", "text": "1", "image": null, "isCorrect": false}, {"id": "lU88b", "text": "2", "image": null, "isCorrect": true}, {"id": "Wnuku", "text": "3", "image": null, "isCorrect": false}, {"id": "6FXPs", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The total number of valence electrons in $\\mathrm{NO}_2^{-}$ is $5 \\text{ (from N)} + 2 \\times 6 \\text{ (from O)} + 1 \\text{ (from negative charge)} = 18$ electrons.<br><br>The skeletal structure is $\\text{O}-\\text{N}-\\text{O}$. Placing a single bond between N and each O uses 4 electrons, leaving 14 electrons.<br><br>Distributing the remaining electrons to complete the octets of the oxygen atoms requires 12 electrons (3 lone pairs on each O). The remaining 2 electrons are placed as a lone pair on the central nitrogen atom.<br><br>At this point, the nitrogen atom has only 6 electrons in its valence shell. To complete the octet of nitrogen, one lone pair from an oxygen atom is shared to form a double bond.<br><br>Since there are two equivalent oxygen atoms, the double bond can be formed with either of them. This results in two resonance structures:<br><br>$[\\text{O}=\\text{N}-\\text{O}]^{-}$ and $[\\text{O}-\\text{N}=\\text{O}]^{-}$<br><br>Thus, there are 2 Lewis structures for $\\mathrm{NO}_2^{-}$.<br><br>Answer: 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ac0aee93fa0796da9f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Identify the hybridisation and geometry of $\\mathrm{SF}_4$ molecule respectively.", "image": null}, "options": [{"id": "uAf8y", "text": "$\\mathrm{sp}_3^3$ and tetrahedral", "image": null, "isCorrect": false}, {"id": "4oZTF", "text": "$\\mathrm{sp}_3^3$ and trigonal bipyramidal", "image": null, "isCorrect": false}, {"id": "XK2Gv", "text": "$\\mathrm{sp}^3 \\mathrm{~d}^2$ and trigonal bipyramidal", "image": null, "isCorrect": false}, {"id": "E2wpE", "text": "$\\mathrm{sp}^3 \\mathrm{~d}$ and seesaw", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The central atom in $\\mathrm{SF}_4$ is sulfur (S).<br><br>Number of valence electrons of S = $6$<br><br>Number of monovalent atoms (F) = $4$<br><br>Steric number = $\\dfrac{1}{2}(6 + 4) = 5$<br><br>The hybridisation corresponding to steric number $5$ is $\\mathrm{sp}^3\\mathrm{d}$.<br><br>Number of bond pairs = $4$<br><br>Number of lone pairs = $5 - 4 = 1$<br><br>With $4$ bond pairs and $1$ lone pair, the electron geometry is trigonal bipyramidal and the molecular geometry is seesaw. The lone pair occupies an equatorial position to minimize lone pair-bond pair repulsions.<br><br>Answer: $\\mathrm{sp}^3 \\mathrm{~d}$ and seesaw", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134e0aee93fa0796d7bc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Which from following molecules has two lone pair of electrons in valence shell of its central atom?", "image": null}, "options": [{"id": "JppLf", "text": "$\\mathrm{SO}_2$", "image": null, "isCorrect": false}, {"id": "nGETN", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": false}, {"id": "YJEwl", "text": "$\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": true}, {"id": "urfW6", "text": "$\\mathrm{SF}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\mathrm{SO}_2$, the central atom sulphur has $6$ valence electrons. It forms two $\\sigma$ and two $\\pi$ bonds with two oxygen atoms, using $4$ electrons. Thus, it has $1$ lone pair.<br><br>In $\\mathrm{NH}_3$, the central atom nitrogen has $5$ valence electrons. It forms three single bonds with three hydrogen atoms, using $3$ electrons. Thus, it has $1$ lone pair.<br><br>In $\\mathrm{H}_2\\mathrm{O}$, the central atom oxygen has $6$ valence electrons. It forms two single bonds with two hydrogen atoms, using $2$ electrons. The remaining $4$ electrons form $2$ lone pairs.<br><br>In $\\mathrm{SF}_4$, the central atom sulphur has $6$ valence electrons. It forms four single bonds with four fluorine atoms, using $4$ electrons. Thus, it has $1$ lone pair.<br><br>Therefore, $\\mathrm{H}_2\\mathrm{O}$ has two lone pairs of electrons on its central atom.<br><br>Answer: $\\mathrm{H}_2 \\mathrm{O}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262830279619d9d8a3521", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "What is formal charge on carbon in the following Lewis structure?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/nk6xg2akT9EPWeculsn0fqkPqxhF-hR55EyIgHAQPJY.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "bm8mb", "text": "0", "image": null, "isCorrect": true}, {"id": "vi30Q", "text": "1", "image": null, "isCorrect": false}, {"id": "GJhAy", "text": "-1", "image": null, "isCorrect": false}, {"id": "o8Tza", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\text { Formal charge }=\\mathrm{VE}-\\mathrm{NE}-(\\mathrm{BE} / 2) \\\\ \\therefore \\quad & \\text { Formal charge on } \\mathrm{C}=4-0-(8 / 2)=0\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262470279619d9d8a333d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Which of the following molecules does NOT obey octet rule?", "image": null}, "options": [{"id": "gIasI", "text": "$\\mathrm{CCl}_4$", "image": null, "isCorrect": false}, {"id": "OshHb", "text": "$\\mathrm{Cl}_2$", "image": null, "isCorrect": false}, {"id": "DVfBv", "text": "$\\mathrm{O}_2$", "image": null, "isCorrect": false}, {"id": "f6655", "text": "$\\mathrm{BeF}_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In $\\mathrm{BeF}_2, \\mathrm{ ft 1)"}], "question": {"text": "Identify the molecule containing triple bond.", "image": null}, "options": [{"id": "TweYA", "text": "Ammonia", "image": null, "isCorrect": false}, {"id": "HNtia", "text": "Dinitrogen", "image": null, "isCorrect": true}, {"id": "K6C5w", "text": "Water", "image": null, "isCorrect": false}, {"id": "NMXrg", "text": "Methane", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$: \\mathrm{N} \\equiv \\mathrm{N}:$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2610b0279619d9d8a2959", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "Which among the following concepts is NOT introduced by V. B. Theory?", "image": null}, "options": [{"id": "gflpP", "text": "Delocalization of electron over the two nuclei.", "image": null, "isCorrect": false}, {"id": "TMncL", "text": "Shielding effect of electrons.", "image": null, "isCorrect": true}, {"id": "9Rxj2", "text": "Partial ionic character of a covalent bond.", "image": null, "isCorrect": false}, {"id": "8oerw", "text": "Number of lone pair and bonded pair of electrons decide the shape of the molecules.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "VBT says that overlapping of half-filled orbitals results in formation of bond. Formation of bond results in delocalization of $\\mathrm{e}^{-}$and form partial ionic character.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a80279619d9d8a2647", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "Which statement from following is correct for hemolytic fission?", "image": null}, "options": [{"id": "VNvlC", "text": "In this single electron of shared pair moves to one of bonded atom and other to other atom.", "image": null, "isCorrect": true}, {"id": "ozecq", "text": "In this electron deficient and electron rich species are formed.", "image": null, "isCorrect": false}, {"id": "fUe5w", "text": "In this electronegative atom pulls both electrons of shared pair.", "image": null, "isCorrect": false}, {"id": "qdU0I", "text": "In this carbon free radical formed has $\\mathrm{sp}^3$ hybridisation.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Homolytic fission (sometimes referred to as hemolysis) is a type of bond fission that involves the dissociation of a given molecule wherein one electron is retained by each of the original fragments of the molecule. Therefore, when a neutrally charged molecule is subjected to homolytic fission, two free radicals are obtained as the product (since each of the chemical species retains one electron from the bond pair).\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/rK6veBQtA4zzGRXkuNQv_UytKAOQgUUTfX8dqDIeIfY.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ff00279619d9d8a2072", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "Which of the following molecules has a central atom with complete octet?", "image": null}, "options": [{"id": "wHvp1", "text": "Methane", "image": null, "isCorrect": true}, {"id": "gftmG", "text": "Sulphur hexafluoride", "image": null, "isCorrect": false}, {"id": "csmu8", "text": "Aluminium chloride", "image": null, "isCorrect": false}, {"id": "weFHd", "text": "Boron trifluoride", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\n$\\mathrm{SF}_{6}$ - Expanded octet of $\\mathrm{S}$\n$\\mathrm{BF}_{3}, \\mathrm{AlCl}_{3} \\rightarrow$ Incomplete octet of $\\mathrm{B}$ and $\\mathrm{Al}$ respectively. $\\mathrm{CH}_{4}-$ Complete octet of $\\mathrm{C}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fde0279619d9d8a1fe2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "
