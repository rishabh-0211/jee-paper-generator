ctet", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f240279619d9d8a1a16", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "$\\mathrm{H}_{2}$ molecule is more stable than $\\mathrm{Li}_{2}$ molecule, because", "image": null}, "options": [{"id": "dd1fy", "text": "In $\\mathrm{H}_{2}$ molecule $\\sigma_{15}$ molecular orbitals are shielded by electrons.", "image": null, "isCorrect": false}, {"id": "hQPyE", "text": "In $\\mathrm{H}_{2}$ bond order is one.", "image": null, "isCorrect": false}, {"id": "GSaqo", "text": "In $\\mathrm{Li}_{2}$ molecule $\\sigma_{1 \\mathrm{~s}}$ molecular orbitals are shielded by electrons.", "image": null, "isCorrect": false}, {"id": "lI0zP", "text": "In $\\mathrm{Li}_{2}$ molecule, outer $\\sigma_{2 \\mathrm{~s}}$ molecular orbitals are shielded by the inner electrons.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8c0279619d9d8a1553", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "Which of the following does not contain any coordinate bond?", "image": null}, "options": [{"id": "0nYgr", "text": "$\\mathrm{H}_{3} \\mathrm{O}^{+}$", "image": null, "isCorrect": false}, {"id": "p7yQE", "text": "$\\mathrm{BF}_{4}^{-}$", "image": null, "isCorrect": false}, {"id": "91Ibk", "text": "$\\mathrm{HF}_{2}^{-}$", "image": null, "isCorrect": true}, {"id": "LYb6W", "text": "$\\mathrm{NH}_{4}^{+}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Only $\\mathrm{HF}_{2}^{-}$ has H-bonding $[\\mathrm{F}-\\mathrm{H}--\\mathrm{F}]^{-}$. Rest all\nthe molecules have coordinate bonds.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/sOAG9uWCP-Z1RflG-ft1Dh5M-WKjW_YHVChLJiW3qQk.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e400279619d9d8a12ed", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Which of the following contains both covalent and ionic bond ?", "image": null}, "options": [{"id": "paQk5", "text": "$\\mathrm{CCl}_{4}$", "image": null, "isCorrect": false}, {"id": "8QJ7c", "text": "$\\mathrm{CaCl}_{2}$", "image": null, "isCorrect": false}, {"id": "i77wd", "text": "$\\mathrm{NH}_{4} \\mathrm{Cl}$", "image": null, "isCorrect": true}, {"id": "Aet44", "text": "$\\mathrm{H}_{2} \\mathrm{O}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ammonium chloride contains both covalent\nand ionic bonds\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/F4kHDLsYI0_GBu-Z0WuFycqLT80mqboLOSzQ3RBtvT4.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a2632a0279619d9d8a3c96", "title": "Hybridisation and VSEPR Theory", "totalQuestions": 81, "questions": [{"_id": "6abb88d015a9fc0fc8c14733", "type": "singleCorrect", "question": {"text": "Which of the following pair of compounds consists equal number of lone pair of electrons in the valence shell of central atom?", "image": null}, "options": [{"id": "5boAF", "label": "A", "text": "$\\text{BrF}_5$ and $\\text{XeF}_6$", "isCorrect": true, "image": null}, {"id": "xOiup", "label": "B", "text": "$\\text{ICl}$ and $\\text{H}_2\\text{S}$", "isCorrect": false, "image": null}, {"id": "dUALE", "label": "C", "text": "$\\text{ClF}_3$ and $\\text{XeF}_2$", "isCorrect": false, "image": null}, {"id": "2aYxF", "label": "D", "text": "$\\text{IF}_7$ and $\\text{XeF}_4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For $\\text{BrF}_5$, the central atom Br has $7$ valence electrons. It forms $5$ single bonds with F atoms, leaving $2$ non-bonding electrons, which corresponds to $1$ lone pair.<br><br>For $\\text{XeF}_6$, the central atom Xe has $8$ valence electrons. It forms $6$ single bonds with F atoms, leaving $2$ non-bonding electrons, which corresponds to $1$ lone pair.<br><br>For $\\text{ICl}$, the central atom I has $3$ lone pairs, while for $\\text{H}_2\\text{S}$, the central atom S has $2$ lone pairs.<br><br>For $\\text{ClF}_3$, the central atom Cl has $2$ lone pairs, while for $\\text{XeF}_2$, the central atom Xe has $3$ lone pairs.<br><br>For $\\text{IF}_7$, the central atom I has $0$ lone pairs, while for $\\text{XeF}_4$, the central atom Xe has $2$ lone pairs.<br><br>Thus, $\\text{BrF}_5$ and $\\text{XeF}_6$ both have exactly $1$ lone pair of electrons on their central atoms.<br><br>Answer: $\\text{BrF}_5$ and $\\text{XeF}_6$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889f15a9fc0fc8c14571", "type": "singleCorrect", "question": {"text": "What is the shape of a molecule if it has two lone pairs and three bonding pairs of electrons?", "image": null}, "options": [{"id": "XK9GH", "label": "A", "text": "trigonal planar", "isCorrect": false, "image": null}, {"id": "hAYV0", "label": "B", "text": "tetrahedral", "isCorrect": false, "image": null}, {"id": "gvo8l", "label": "C", "text": "bent", "isCorrect": false, "image": null}, {"id": "FeNIi", "label": "D", "text": "T-shape", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The molecule has $3$ bonding pairs and $2$ lone pairs of electrons.<br><br>Total number of electron pairs = $3 + 2 = 5$.<br><br>The hybridization of the central atom is $sp^3d$, which corresponds to a trigonal bipyramidal electron geometry.<br><br>According to VSEPR theory, lone pairs occupy the equatorial positions to minimize lone pair-lone pair and lone pair-bond pair repulsions. Placing the two lone pairs in the equatorial positions leaves the three bonding pairs in one equatorial and two axial positions.<br><br>This arrangement results in a T-shaped molecular geometry (e.g., $ClF_3$).<br><br>Answer: T-shape", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887015a9fc0fc8c143b4", "type": "singleCorrect", "question": {"text": "Find the number of $sp^2$ hybridized carbon atoms in cycloheptatriene?", "image": null}, "options": [{"id": "Gu1XE", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "bC0lw", "label": "B", "text": "$6$", "isCorrect": true, "image": null}, {"id": "2KHos", "label": "C", "text": "$5$", "isCorrect": false, "image": null}, {"id": "X9G82", "label": "D", "text": "$7$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Cycloheptatriene is a seven-membered cyclic hydrocarbon with three double bonds. Its chemical formula is $C_7H_8$.<br><br>The structure contains six carbon atoms involved in the three double bonds. Each of these six carbon atoms is bonded to three other atoms (two carbons and one hydrogen) and has no lone pairs, giving a steric number of 3. Thus, they are $sp^2$ hybridized.<br><br>The seventh carbon atom is bonded to two carbon atoms and two hydrogen atoms with single bonds, giving a steric number of 4. Thus, it is $sp^3$ hybridized.<br><br>Therefore, the number of $sp^2$ hybridized carbon atoms in cycloheptatriene is 6.<br><br>Answer: $6$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887f15a9fc0fc8c14445", "type": "singleCorrect", "question": {"text": "Which of the following statements regarding the geometry and lone pair of electrons in the $\\text{NH}_3$ and $\\text{PCl}_3$ molecules is correct?", "image": null}, "options": [{"id": "1wGCe", "label": "A", "text": "Both have trigonal pyramidal geometry and one lone pair of electrons on the central atom.", "isCorrect": true, "image": null}, {"id": "6l7hD", "label": "B", "text": "Both have tetrahedral geometry and one lone pair of electrons on the central atom.", "isCorrect": false, "image": null}, {"id": "VhnrH", "label": "C", "text": "Both have trigonal pyramidal geometry and no lone pair of electrons on the central atom.", "isCorrect": false, "image": null}, {"id": "x1io7", "label": "D", "text": "Both have trigonal bipyramidal geometry and only $\\text{NH}_3$ has one lone pair of electrons on the central atom.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In $\\text{NH}_3$, the central nitrogen atom has $5$ valence electrons. It forms $3$ single bonds with hydrogen atoms, leaving $2$ non-bonding electrons which constitute $1$ lone pair. The steric number is $3 + 1 = 4$, corresponding to $sp^3$ hybridization. Due to the presence of one lone pair, the molecular geometry is trigonal pyramidal.<br><br>In $\\text{PCl}_3$, the central phosphorus atom also belongs to Group 15 and has $5$ valence electrons. It forms $3$ single bonds with chlorine atoms, leaving $1$ lone pair on the central atom. The steric number is $3 + 1 = 4$, corresponding to $sp^3$ hybridization. The molecular geometry is again trigonal pyramidal.<br><br>Thus, both $\\text{NH}_3$ and $\\text{PCl}_3$ have trigonal pyramidal geometry and one lone pair of electrons on the central atom.<br><br>Answer: Both have trigonal pyramidal geometry and one lone pair of electrons on the central atom.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889215a9fc0fc8c144f6", "type": "singleCorrect", "question": {"text": "Identify the structure of $\\text{XeF}_6$ molecule from following.", "image": null}, "options": [{"id": "91pxm", "label": "A", "text": "Square planar", "isCorrect": false, "image": null}, {"id": "hmyuo", "label": "B", "text": "Trigonal bipyramidal", "isCorrect": false, "image": null}, {"id": "8dbA0", "label": "C", "text": "Distorted octahedral", "isCorrect": true, "image": null}, {"id": "leFRh", "label": "D", "text": "Square pyramidal", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The central atom Xenon (Xe) has 8 valence electrons.<br><br>In $\\text{XeF}_6$, Xe forms 6 single bonds with 6 Fluorine atoms, utilizing 6 electrons. The remaining 2 electrons form 1 lone pair.<br><br>Total number of electron pairs (steric number) = $6 \\text{ (bond pairs)} + 1 \\text{ (lone pair)} = 7$.<br><br>The hybridization of the central atom is $sp^3d^3$, which corresponds to a pentagonal bipyramidal electron geometry.<br><br>Due to the presence of one lone pair and six bond pairs, the molecular geometry becomes distorted octahedral (or capped octahedral).<br><br>Answer: Distorted octahedral", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886015a9fc0fc8c14319", "type": "singleCorrect", "question": {"text": "What is the shape of $\\text{ClF}_3$ according to VSEPR theory ?", "image": null}, "options": [{"id": "7QOS4", "label": "A", "text": "Trigonal Bipyramidal", "isCorrect": false, "image": null}, {"id": "jBs9F", "label": "B", "text": "T - shape", "isCorrect": true, "image": null}, {"id": "JzxdR", "label": "C", "text": "See saw", "isCorrect": false, "image": null}, {"id": "YAI5s", "label": "D", "text": "Trigonal planar", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The central atom in $\\text{ClF}_3$ is Chlorine (Cl).<br><br>Number of valence electrons of Cl = $7$<br><br>Number of bond pairs (bp) with F atoms = $3$<br><br>Number of lone pairs (lp) on Cl = $\\dfrac{7 - 3}{2} = 2$<br><br>Total number of electron pairs = $3 \\text{ (bp)} + 2 \\text{ (lp)} = 5$<br><br>The hybridization of the central atom is $sp^3d$, which corresponds to a trigonal bipyramidal electron geometry.<br><br>According to VSEPR theory, to minimize lone pair-lone pair repulsions, the two lone pairs occupy the equatorial positions.<br><br>The three fluorine atoms occupy the remaining two axial positions and one equatorial position, resulting in a T-shaped molecular geometry.<br><br>Answer: T - shape", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bf15a9fc0fc8c1469d", "type": "singleCorrect", "question": {"text": "Identify the false statement regarding $\\text{PCl}_5$ by following.", "image": null}, "options": [{"id": "cpyDK", "label": "A", "text": "$\\text{PCl}_5$ possesses two different Cl-P-Cl bond angles", "isCorrect": false, "image": null}, {"id": "WxEZI", "label": "B", "text": "All five P-Cl bonds are identical in length", "isCorrect": true, "image": null}, {"id": "mlFZs", "label": "C", "text": "$\\text{PCl}_5$ exhibits $sp^3d$ hybridisation", "isCorrect": false, "image": null}, {"id": "ZGcRH", "label": "D", "text": "$\\text{PCl}_5$ consists of five P-Cl (sigma) bonds", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In $\\text{PCl}_5$, the central phosphorus atom undergoes $sp^3d$ hybridization, resulting in a trigonal bipyramidal geometry.<br><br>The molecule has three equatorial P-Cl bonds and two axial P-Cl bonds.<br><br>The equatorial-equatorial bond angle is $120^\\circ$ and the axial-equatorial bond angle is $90^\\circ$. Thus, it possesses two different Cl-P-Cl bond angles.<br><br>The axial bond pairs suffer more repulsion from the equatorial bond pairs, making the axial P-Cl bonds longer than the equatorial P-Cl bonds. Therefore, all five P-Cl bonds are not identical in length.<br><br>The molecule consists of five P-Cl single bonds, which are all sigma bonds.<br><br>Answer: All five P-Cl bonds are identical in length", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3528c30a4553e1be27c", "type": "singleCorrect", "question": {"text": "Identify linear molecule from following.", "image": null}, "options": [{"id": "f9Z4j", "label": "A", "text": "$\\text{SO}_2$", "isCorrect": false, "image": null}, {"id": "LbhGR", "label": "B", "text": "$\\text{BCl}_3$", "isCorrect": false, "image": null}, {"id": "gxW2b", "label": "C", "text": "$\\text{CO}_2$", "isCorrect": true, "image": null}, {"id": "oCOXI", "label": "D", "text": "$\\text{NH}_3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For $\\text{SO}_2$, the central sulphur atom has $2$ bond pairs and $1$ lone pair. The hybridization is $sp^2$ and the shape is bent.<br><br>For $\\text{BCl}_3$, the central boron atom has $3$ bond pairs and $0$ lone pairs. The hybridization is $sp^2$ and the shape is trigonal planar.<br><br>For $\\text{CO}_2$, the central carbon atom has $2$ bond pairs (sigma bonds) and $0$ lone pairs. The hybridization is $sp$ and the shape is linear.<br><br>For $\\text{NH}_3$, the central nitrogen atom has $3$ bond pairs and $1$ lone pair. The hybridization is $sp^3$ and the shape is trigonal pyramidal.<br><br>Thus, $\\text{CO}_2$ is the only linear molecule among the given options.<br><br>Answer: $\\text{CO}_2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30e8c30a4553e1bdfad", "type": "singleCorrect", "question": {"text": "What is the number of bond pair of electrons and lone pair of electrons present in the valence shell of chalcogens in their hydride ?", "image": null}, "options": [{"id": "3zynY", "label": "A", "text": "2 - Bond pair and 1- lone pair of electrons", "isCorrect": false, "image": null}, {"id": "ax5pI", "label": "B", "text": "2 - Bond pair and 2- lone pair of electrons", "isCorrect": true, "image": null}, {"id": "zjKhP", "label": "C", "text": "3 - Bond pair and 1- lone pair of electrons", "isCorrect": false, "image": null}, {"id": "RfAGs", "label": "D", "text": "3 - Bond pair and 2- lone pair of electrons", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Chalcogens belong to Group 16 of the periodic table and have 6 valence electrons ($ns^2 np^4$).<br><br>The general formula for the hydrides of chalcogens is $H_2E$ (where $E = O, S, Se, Te, Po$).<br><br>In the formation of $H_2E$, the chalcogen atom shares two of its valence electrons with two hydrogen atoms to form two single covalent bonds. This results in 2 bond pairs of electrons.<br><br>The remaining 4 valence electrons on the chalcogen atom do not participate in bonding and exist as 2 lone pairs of electrons.<br><br>Thus, the valence shell of a chalcogen in its hydride contains 2 bond pairs and 2 lone pairs of electrons.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fe8c30a4553e1bdf04", "type": "singleCorrect", "question": {"text": "Identify correct order for repulsion between electron pair present in valence shell of central atom of molecule?", "image": null}, "options": [{"id": "OcC6L", "label": "A", "text": "$\\text{Bp-Bp} > \\text{Lp-Bp} > \\text{Lp-Lp}$", "isCorrect": false, "image": null}, {"id": "YokSN", "label": "B", "text": "$\\text{Lp-Lp} > \\text{Lp-Bp} > \\text{Bp-Bp}$", "isCorrect": true, "image": null}, {"id": "92rka", "label": "C", "text": "$\\text{Lp-Bp} > \\text{Bp-Bp} > \\text{Lp-Lp}$", "isCorrect": false, "image": null}, {"id": "e1mni", "label": "D", "text": "$\\text{Lp-Lp} > \\text{Bp-Bp} > \\text{Lp-Bp}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to VSEPR theory, the electron pairs in the valence shell of the central atom repel each other to minimize electron-electron repulsion.<br><br>Lone pairs (Lp) are localized on the central atom and are attracted by only one nucleus, so they occupy more space and exert greater repulsion.<br><br>Bond pairs (Bp) are shared between two atoms and are attracted by two nuclei, so they occupy less space and exert lesser repulsion.<br><br>Thus, the correct order of repulsion between electron pairs is $\\text{Lp-Lp} > \\text{Lp-Bp} > \\text{Bp-Bp}$.<br><br>Answer: $\\text{Lp-Lp} > \\text{Lp-Bp} > \\text{Bp-Bp}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fc8c30a4553e1bdef3", "type": "singleCorrect", "question": {"text": "What is the number of $sp^3$ hybrid carbon atoms in $\\text{HO}(\\text{CH}_2)_2\\text{CH}(\\text{CH}_3)_2$?", "image": null}, "options": [{"id": "vpi2L", "label": "A", "text": "$2$", "isCorrect": false, "image": null}, {"id": "kSUVS", "label": "B", "text": "$3$", "isCorrect": false, "image": null}, {"id": "C6nUZ", "label": "C", "text": "$4$", "isCorrect": false, "image": null}, {"id": "0Lo6z", "label": "D", "text": "$5$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given molecule is 3-methylbutan-1-ol, with the expanded structural formula $\\text{HO}-\\text{CH}_2-\\text{CH}_2-\\text{CH}(\\text{CH}_3)-\\text{CH}_3$.<br><br>In this structure, every carbon atom is bonded to four other atoms (either carbon, hydrogen, or oxygen) entirely through single ($\\sigma$) bonds.<br><br>Since there are no $\\pi$ bonds present, all the carbon atoms are $sp^3$ hybridized.<br><br>Counting the carbon atoms:<br>Two $-\\text{CH}_2-$ groups $\\rightarrow 2$ carbon atoms<br>One $-\\text{CH}-$ group $\\rightarrow 1$ carbon atom<br>Two $-\\text{CH}_3$ groups $\\rightarrow 2$ carbon atoms<br><br>Total number of $sp^3$ hybridized carbon atoms $= 2 + 1 + 2 = 5$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f18c30a4553e1bde75", "type": "singleCorrect", "question": {"text": "Select the incorrect statement from the following.", "image": null}, "options": [{"id": "9ugjW", "label": "A", "text": "$\\text{NH}_3$ and $\\text{NF}_3$ both are polar molecules", "isCorrect": false, "image": null}, {"id": "98qcr", "label": "B", "text": "$\\text{NH}_3$ and $\\text{NF}_3$ both have pyramidal shape", "isCorrect": false, "image": null}, {"id": "IQ6Yn", "label": "C", "text": "In $\\text{NH}_3$ and $\\text{NF}_3$ the orbital dipole due to lone pair is in the same direction as that of resultant dipole moment of other three bonds", "isCorrect": true, "image": null}, {"id": "wXlGa", "label": "D", "text": "Dipole moment of $\\text{NH}_3$ is greater than $\\text{NF}_3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Both $\\text{NH}_3$ and $\\text{NF}_3$ have a central nitrogen atom with $sp^3$ hybridization and one lone pair, giving them a trigonal pyramidal shape. Both are polar molecules.<br><br>In $\\text{NH}_3$, nitrogen is more electronegative than hydrogen. The bond dipole moments of the three N-H bonds are directed towards the nitrogen atom. Their resultant dipole moment is in the same direction as the orbital dipole due to the lone pair, leading to a higher net dipole moment.<br><br>In $\\text{NF}_3$, fluorine is more electronegative than nitrogen. The bond dipole moments of the three N-F bonds are directed towards the fluorine atoms. Their resultant dipole moment is in the opposite direction to the orbital dipole due to the lone pair. This partial cancellation results in a lower net dipole moment for $\\text{NF}_3$ compared to $\\text{NH}_3$.<br><br>Therefore, the statement that the orbital dipole due to the lone pair is in the same direction as the resultant dipole moment of the three bonds in both molecules is incorrect.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3288c30a4553e1be0c8", "type": "singleCorrect", "question": {"text": "Which of the following compound has square pyramidal structure?", "image": null}, "options": [{"id": "q7zVa", "label": "A", "text": "$\\text{XeF}_4$", "isCorrect": false, "image": null}, {"id": "lNUHS", "label": "B", "text": "$\\text{XeF}_6$", "isCorrect": false, "image": null}, {"id": "SQ1E4", "label": "C", "text": "$\\text{XeO}_3$", "isCorrect": false, "image": null}, {"id": "t64aE", "label": "D", "text": "$\\text{XeOF}_4$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The shape of the molecules can be determined using VSEPR theory by calculating the number of bond pairs (bp) and lone pairs (lp) on the central Xenon (Xe) atom, which has 8 valence electrons.<br><br>For $\\text{XeF}_4$: Xe forms 4 single bonds with F atoms, using 4 electrons. Remaining electrons = 4 (2 lone pairs). With 4 bp and 2 lp, the hybridization is $sp^3d^2$ and the shape is square planar.<br><br>For $\\text{XeF}_6$: Xe forms 6 single bonds with F atoms, using 6 electrons. Remaining electrons = 2 (1 lone pair). With 6 bp and 1 lp, the hybridization is $sp^3d^3$ and the shape is distorted octahedral.<br><br>For $\\text{XeO}_3$: Xe forms 3 double bonds with O atoms, using 6 electrons. Remaining electrons = 2 (1 lone pair). With 3 bp ($\\sigma$-bonds) and 1 lp, the hybridization is $sp^3$ and the shape is trigonal pyramidal.<br><br>For $\\text{XeOF}_4$: Xe forms 1 double bond with O and 4 single bonds with F, using $2 + 4 = 6$ electrons. Remaining electrons = 2 (1 lone pair). With 5 bp ($\\sigma$-bonds) and 1 lp, the hybridization is $sp^3d^2$ and the shape is square pyramidal.<br><br>Answer: $\\text{XeOF}_4$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3438c30a4553e1be1e1", "type": "singleCorrect", "question": {"text": "Identify the number of lone pair and bond pair electrons present in the valence shell of central atom in $\\text{BrF}_3$.", "image": null}, "options": [{"id": "3jo4O", "label": "A", "text": "1 _ Lone pair and 2 _ Bond pair of electrons", "isCorrect": false, "image": null}, {"id": "LgMYO", "label": "B", "text": "2 _ Lone pair and 2 _ Bond pair of electrons", "isCorrect": false, "image": null}, {"id": "cLwlt", "label": "C", "text": "2 _ Lone pair and 3 _ Bond pair of electrons", "isCorrect": true, "image": null}, {"id": "KkhQi", "label": "D", "text": "1 _ Lone pair and 3 _ Bond pair of electrons", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The central atom in $\\text{BrF}_3$ is Bromine ($\\text{Br}$).<br><br>Number of valence electrons in $\\text{Br} = 7$.<br><br>Bromine forms $3$ single bonds with $3$ Fluorine atoms. Therefore, the number of bond pairs is $3$.<br><br>Number of electrons used in bonding $= 3$.<br><br>Remaining valence electrons on the central atom $= 7 - 3 = 4$.<br><br>Number of lone pairs $= \\dfrac{4}{2} = 2$.<br><br>Thus, the central atom has $2$ lone pairs and $3$ bond pairs of electrons.<br><br>Answer: 2 _ Lone pair and 3 _ Bond pair of electrons", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29a8c30a4553e1bdad3", "type": "singleCorrect", "question": {"text": "In the compound ${}^1\\text{CH}_2 = {}^2\\text{CH} - {}^3\\text{CH}_2 - {}^4\\text{CH}_2 - {}^5\\text{C} \\equiv {}^6\\text{CH}$, The $C_2 - C_3$ bond is of type", "image": null}, "options": [{"id": "0LuXU", "label": "A", "text": "$sp - sp^2$", "isCorrect": false, "image": null}, {"id": "UmxuN", "label": "B", "text": "$sp^3 - sp^3$", "isCorrect": false, "image": null}, {"id": "JHWkM", "label": "C", "text": "$sp - sp^3$", "isCorrect": false, "image": null}, {"id": "1Yy6g", "label": "D", "text": "$sp^2 - sp^3$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given compound is $^{1}\\text{CH}_2 = ^{2}\\text{CH} - ^{3}\\text{CH}_2 - ^{4}\\text{CH}_2 - ^{5}\\text{C} \\equiv ^{6}\\text{CH}$.<br><br>The hybridization of a carbon atom is determined by the number of sigma bonds it forms.<br><br>Carbon atom $C_2$ is bonded to one carbon atom via a double bond, one carbon atom via a single bond, and one hydrogen atom via a single bond. It forms $3$ sigma bonds and $1$ pi bond. Thus, $C_2$ is $sp^2$ hybridized.<br><br>Carbon atom $C_3$ is bonded to two carbon atoms via single bonds and two hydrogen atoms via single bonds. It forms $4$ sigma bonds and $0$ pi bonds. Thus, $C_3$ is $sp^3$ hybridized.<br><br>Therefore, the $C_2 - C_3$ bond is formed by the overlap of $sp^2$ and $sp^3$ hybridized orbitals, making it an $sp^2 - sp^3$ type bond.<br><br>Answer: $sp^2 - sp^3$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3708c30a4553e1be3c1", "type": "singleCorrect", "question": {"text": "Identify the type of hybridization of carbon that is attached to the OH group, in benzylic alcohol?", "image": null}, "options": [{"id": "wBjAT", "label": "A", "text": "$sp$", "isCorrect": false, "image": null}, {"id": "HUiGU", "label": "B", "text": "$sp^2$", "isCorrect": false, "image": null}, {"id": "CaiAt", "label": "C", "text": "$sp^3$", "isCorrect": true, "image": null}, {"id": "SQhRF", "label": "D", "text": "$dsp2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The structure of benzylic alcohol is $C_6H_5-CH_2-OH$.<br><br>The carbon atom attached to the $-OH$ group is bonded to one carbon atom of the benzene ring, two hydrogen atoms, and one oxygen atom.<br><br>Since it forms exactly four sigma bonds and has zero lone pairs, its steric number is $4$.<br><br>Therefore, the hybridization of this carbon atom is $sp^3$.<br><br>Answer: $sp^3$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b68c30a4553e1bdbff", "type": "singleCorrect", "question": {"text": "Identify the shape of $\\text{IF}_5$ molecule from the following options.", "image": null}, "options": [{"id": "sQNwd", "label": "A", "text": "Trigonal bipyramidal", "isCorrect": false, "image": null}, {"id": "rTs1P", "label": "B", "text": "Square planar", "isCorrect": false, "image": null}, {"id": "smD1w", "label": "C", "text": "Hexagonal", "isCorrect": false, "image": null}, {"id": "TgA0U", "label": "D", "text": "Square pyramidal", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The central atom is Iodine (I), which has $7$ valence electrons.<br><br>It forms $5$ single bonds with $5$ Fluorine (F) atoms.<br><br>Number of bond pairs = $5$<br><br>Number of lone pairs = $\\dfrac{7 - 5}{2} = 1$<br><br>Total number of electron pairs = $5 + 1 = 6$<br><br>The hybridization of the central atom is $sp^3d^2$, which corresponds to an octahedral electron geometry.<br><br>Due to the presence of $5$ bond pairs and $1$ lone pair, the molecular shape is square pyramidal.<br><br>Answer: Square pyramidal", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf0bf9280d7f9932dd2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following molecules is square pyramidal?", "image": null}, "options": [{"id": "fAuKv", "text": "$\\mathrm{XeOF}_4$", "image": null, "isCorrect": true}, {"id": "GtlGa", "text": "$\\mathrm{XeF}_4$", "image": null, "isCorrect": false}, {"id": "hVBZ2", "text": "$\\mathrm{XeF}_6$", "image": null, "isCorrect": false}, {"id": "dHdtb", "text": "$\\mathrm{XeO}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For $\\mathrm{XeOF}_4$, the central atom Xe has 8 valence electrons.<br><br>It forms 4 single bonds with 4 F atoms and 1 double bond with 1 O atom, using a total of 6 valence electrons.<br><br>Number of lone pairs on Xe = $\\dfrac{8 - 6}{2} = 1$.<br><br>Total number of electron domains = 5 (sigma bonds) + 1 (lone pair) = 6.<br><br>The hybridization is $sp^3d^2$. The electron geometry is octahedral and the molecular shape is square pyramidal.<br><br>For $\\mathrm{XeF}_4$, the shape is square planar.<br><br>For $\\mathrm{XeF}_6$, the shape is distorted octahedral.<br><br>For $\\mathrm{XeO}_3$, the shape is trigonal pyramidal.<br><br>Answer: $\\mathrm{XeOF}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd0bf9280d7f9932ca5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify a pair of molecules having similar shapes of both members.", "image": null}, "options": [{"id": "cJxy2", "text": "$\\mathrm{NH}_3,~~ \\mathrm{SO}_2$", "image": null, "isCorrect": false}, {"id": "xAcM4", "text": "$\\mathrm{XeF}_4,~~ \\mathrm{SF}_4$", "image": null, "isCorrect": false}, {"id": "aVdvg", "text": "$\\mathrm{H}_2 \\mathrm{O},~~ \\mathrm{SCl}_2$", "image": null, "isCorrect": true}, {"id": "ndyfx", "text": "$\\mathrm{PCl}_5,~~ \\mathrm{BrF}_5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For $\\mathrm{NH}_3$, the central nitrogen atom has 3 bond pairs and 1 lone pair, giving a trigonal pyramidal shape. For $\\mathrm{SO}_2$, the central sulfur atom has 2 bond pairs and 1 lone pair, giving a bent shape.<br><br>For $\\mathrm{XeF}_4$, the central xenon atom has 4 bond pairs and 2 lone pairs, resulting in a square planar shape. For $\\mathrm{SF}_4$, the central sulfur atom has 4 bond pairs and 1 lone pair, resulting in a see-saw shape.<br><br>For $\\mathrm{H}_2\\mathrm{O}$, the central oxygen atom has 2 bond pairs and 2 lone pairs, giving a bent (V-shaped) geometry. For $\\mathrm{SCl}_2$, the central sulfur atom also has 2 bond pairs and 2 lone pairs, resulting in a bent (V-shaped) geometry. Thus, both have similar shapes.<br><br>For $\\mathrm{PCl}_5$, the central phosphorus atom has 5 bond pairs and 0 lone pairs, giving a trigonal bipyramidal shape. For $\\mathrm{BrF}_5$, the central bromine atom has 5 bond pairs and 1 lone pair, giving a square pyramidal shape.<br><br>Answer: $\\mathrm{H}_2 \\mathrm{O},~~ \\mathrm{SCl}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9bbf9280d7f9932acf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What type of overlap is involved in the formation of C-H bonds in acetylene molecules?", "image": null}, "options": [{"id": "hkvmc", "text": "$s p^3-s$", "image": null, "isCorrect": false}, {"id": "Caaoo", "text": "$\\mathrm{sp}^2-\\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "EesEA", "text": "$s p-s$", "image": null, "isCorrect": true}, {"id": "3gXM3", "text": "sp-sp", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical formula of acetylene is $C_2H_2$ and its structure is $H-C \\equiv C-H$.<br><br>Each carbon atom in acetylene is bonded to two other atoms (one carbon and one hydrogen) and has no lone pairs. This corresponds to a steric number of 2, meaning both carbon atoms are $sp$ hybridized.<br><br>The hydrogen atom uses its half-filled $1s$ orbital for bonding.<br><br>Therefore, the C-H bond in acetylene is formed by the axial overlap of an $sp$ hybrid orbital of carbon and the $s$ orbital of hydrogen, which is an $sp-s$ overlap.<br><br>Answer: $s p-s$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6abf9280d7f9932900", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the correct statement regarding geometry and lone pair of electrons present in $\\mathrm{CH}_4$ and $\\mathrm{SiCl}_4$", "image": null}, "options": [{"id": "D69ce", "text": "Both have same geometry with two lone pair of electrons each.", "image": null, "isCorrect": false}, {"id": "R3sw6", "text": "Both have different geometry with one lone pair of electrons each.", "image": null, "isCorrect": false}, {"id": "MitRB", "text": "Both have same geometry with no lone pair of electrons each.", "image": null, "isCorrect": true}, {"id": "7Z5JF", "text": "Both have different geometry with no lone pair of electrons each.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For $\\mathrm{CH}_4$:<br>Central atom is Carbon (C) with $4$ valence electrons.<br>It forms $4$ single bonds with $4$ Hydrogen atoms.<br>Number of bond pairs $= 4$, number of lone pairs $= 0$.<br>Hybridization is $sp^3$ and geometry is tetrahedral.<br><br>For $\\mathrm{SiCl}_4$:<br>Central atom is Silicon (Si) with $4$ valence electrons.<br>It forms $4$ single bonds with $4$ Chlorine atoms.<br>Number of bond pairs $= 4$, number of lone pairs $= 0$.<br>Hybridization is $sp^3$ and geometry is tetrahedral.<br><br>Both $\\mathrm{CH}_4$ and $\\mathrm{SiCl}_4$ have the same geometry (tetrahedral) with no lone pair of electrons on the central atom.<br><br>Answer: Both have same geometry with no lone pair of electrons each.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5cbf9280d7f993288c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following species is not tetrahedral?", "image": null}, "options": [{"id": "xLUAF", "text": "$\\mathrm{CH}_4$", "image": null, "isCorrect": false}, {"id": "8cQLg", "text": "$\\mathrm{SF}_4$", "image": null, "isCorrect": true}, {"id": "UBHEt", "text": "$\\stackrel{+}{\\mathrm{N}} \\mathrm{H}_4$", "image": null, "isCorrect": false}, {"id": "1s0MH", "text": "$\\mathrm{SiCl}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\mathrm{CH}_4$, the central carbon atom has $4$ valence electrons and forms $4$ bond pairs with no lone pairs. The hybridization is $sp^3$ and the geometry is tetrahedral.<br><br>In $\\mathrm{SF}_4$, the central sulfur atom has $6$ valence electrons. It forms $4$ bond pairs with fluorine atoms and has $1$ lone pair. The hybridization is $sp^3d$ and the geometry is see-saw.<br><br>In $\\stackrel{+}{\\mathrm{N}} \\mathrm{H}_4$, the central nitrogen atom has $5$ valence electrons. After losing one electron to form the positive charge, it has $4$ electrons which form $4$ bond pairs with no lone pairs. The hybridization is $sp^3$ and the geometry is tetrahedral.<br><br>In $\\mathrm{SiCl}_4$, the central silicon atom has $4$ valence electrons and forms $4$ bond pairs with no lone pairs. The hybridization is $sp^3$ and the geometry is tetrahedral.<br><br>Thus, $\\mathrm{SF}_4$ is not tetrahedral.<br><br>Answer: $\\mathrm{SF}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3abf9280d7f993274a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is shape of $\\mathrm{BrF}_5$ molecule?", "image": null}, "options": [{"id": "cG7Pb", "text": "Trigonal pyramidal", "image": null, "isCorrect": false}, {"id": "EClib", "text": "Square planer", "image": null, "isCorrect": false}, {"id": "vhA8w", "text": "Square pyramidal", "image": null, "isCorrect": true}, {"id": "HZpLj", "text": "Bent 'T' shape", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The central atom bromine (Br) has $7$ valence electrons.<br><br>It forms $5$ sigma bonds with $5$ fluorine (F) atoms.<br><br>Number of lone pairs on Br = $\\dfrac{7 - 5}{2} = 1$.<br><br>Total number of electron pairs = $5$ (bond pairs) + $1$ (lone pair) = $6$.<br><br>The hybridization of the central atom is $sp^3d^2$.<br><br>Due to the presence of $5$ bond pairs and $1$ lone pair, the electron geometry is octahedral and the molecular shape is square pyramidal.<br><br>Answer: Square pyramidal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b27bf9280d7f99326bb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the geometry of $\\mathrm{TeF}_4$ molecule from the following.", "image": null}, "options": [{"id": "2aI3c", "text": "Linear", "image": null, "isCorrect": false}, {"id": "TfYuH", "text": "Tetrahedral", "image": null, "isCorrect": false}, {"id": "chaMH", "text": "Seesaw", "image": null, "isCorrect": true}, {"id": "Eagzy", "text": "Trigonal", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The central atom in $\\mathrm{TeF}_4$ is Tellurium (Te).<br><br>Number of valence electrons in Te = $6$.<br><br>Number of bond pairs (bp) formed with F atoms = $4$.<br><br>Number of lone pairs (lp) on Te = $\\dfrac{6 - 4}{2} = 1$.<br><br>Total number of electron pairs = $4 + 1 = 5$.<br><br>The steric number is $5$, which corresponds to $sp^3d$ hybridization. The expected electron pair geometry is trigonal bipyramidal.<br><br>Due to the presence of one lone pair occupying an equatorial position to minimize repulsion, the molecular geometry of $\\mathrm{TeF}_4$ is seesaw.<br><br>Answer: Seesaw", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b15bf9280d7f9932620", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following molecules has a regular geometry as expected?", "image": null}, "options": [{"id": "9ljMy", "text": "$\\mathrm{SiCl}_4$", "image": null, "isCorrect": true}, {"id": "xM6cV", "text": "$\\mathrm{SF}_4$", "image": null, "isCorrect": false}, {"id": "gtrMj", "text": "$\\mathrm{BrF}_5$", "image": null, "isCorrect": false}, {"id": "2EULw", "text": "$\\mathrm{XeF}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a molecule to have a regular geometry, the central atom must not have any lone pairs of electrons. All the electron pairs around the central atom should be bond pairs.<br><br>In $\\mathrm{SiCl}_4$, the central silicon atom has $4$ valence electrons and forms $4$ single bonds with chlorine atoms.<br>Number of lone pairs $= \\dfrac{4 - 4}{2} = 0$.<br>Since there are no lone pairs, it has a regular tetrahedral geometry.<br><br>In $\\mathrm{SF}_4$, the central sulphur atom has $6$ valence electrons and forms $4$ bonds, leaving $1$ lone pair. This results in an irregular see-saw shape.<br><br>In $\\mathrm{BrF}_5$, the central bromine atom has $7$ valence electrons and forms $5$ bonds, leaving $1$ lone pair. This results in an irregular square pyramidal shape.<br><br>In $\\mathrm{XeF}_4$, the central xenon atom has $8$ valence electrons and forms $4$ bonds, leaving $2$ lone pairs. This results in an irregular square planar shape.<br><br>Thus, only $\\mathrm{SiCl}_4$ has a regular geometry.<br><br>Answer: $\\mathrm{SiCl}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214100aee93fa0796ddb3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Which of the following molecules is an example of sp hybridization?", "image": null}, "options": [{"id": "p7A6k", "text": "Methane", "image": null, "isCorrect": false}, {"id": "Rld35", "text": "Acetylene", "image": null, "isCorrect": true}, {"id": "HGUVi", "text": "Ethylene", "image": null, "isCorrect": false}, {"id": "uDNcS", "text": "Ammonia", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In methane ($CH_4$), the central carbon atom forms four sigma bonds, so its hybridization is $sp^3$.<br><br>In acetylene ($C_2H_2$), each carbon atom forms two sigma bonds and two pi bonds, so its hybridization is $sp$.<br><br>In ethylene ($C_2H_4$), each carbon atom forms three sigma bonds and one pi bond, so its hybridization is $sp^2$.<br><br>In ammonia ($NH_3$), the central nitrogen atom forms three sigma bonds and has one lone pair, so its hybridization is $sp^3$.<br><br>Thus, acetylene is an example of $sp$ hybridization.<br><br>Answer: Acetylene", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fe0aee93fa0796dd22", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Identify the orbital having highest energy from following:", "image": null}, "options": [{"id": "mbuSz", "text": "2 p", "image": null, "isCorrect": false}, {"id": "0LaQu", "text": "3 s", "image": null, "isCorrect": false}, {"id": "d7ymK", "text": "3 d", "image": null, "isCorrect": false}, {"id": "jNomc", "text": "4 p", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The energy of an orbital is determined by the $(n+l)$ rule. The higher the value of $(n+l)$, the higher the energy of the orbital. If two orbitals have the same $(n+l)$ value, the one with the higher principal quantum number $n$ has higher energy.<br><br>For $2p$: $n=2$, $l=1 \\Rightarrow n+l = 3$<br>For $3s$: $n=3$, $l=0 \\Rightarrow n+l = 3$<br>For $3d$: $n=3$, $l=2 \\Rightarrow n+l = 5$<br>For $4p$: $n=4$, $l=1 \\Rightarrow n+l = 5$<br><br>Both $3d$ and $4p$ have $(n+l) = 5$. Since the $4p$ orbital has a higher value of $n$ ($n=4$) compared to the $3d$ orbital ($n=3$), the $4p$ orbital has higher energy.<br><br>Therefore, the $4p$ orbital has the highest energy among the given options.<br><br>Answer: 4 p", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e90aee93fa0796dc80", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "What type of hybridisation is involved in central atom of hydrides of group 16 elements?", "image": null}, "options": [{"id": "TzXnF", "text": "$\\mathrm{sp}^3 \\mathrm{~d}^2$", "image": null, "isCorrect": false}, {"id": "EniAo", "text": "$\\mathrm{sp}^3$", "image": null, "isCorrect": true}, {"id": "QYrbD", "text": "$\\mathrm{sp}^2$", "image": null, "isCorrect": false}, {"id": "UengZ", "text": "sp", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Group 16 elements form hydrides of the general formula $H_2E$, where E is the group 16 element (O, S, Se, Te).<br><br>The central atom E has 6 valence electrons.<br><br>In $H_2E$, the central atom forms 2 sigma bonds with two hydrogen atoms and has 2 lone pairs of electrons.<br><br>Number of electron pairs (steric number) = Number of sigma bonds + Number of lone pairs = $2 + 2 = 4$.<br><br>A steric number of 4 corresponds to $\\mathrm{sp}^3$ hybridization.<br><br>Therefore, the central atom in hydrides of group 16 elements undergoes $\\mathrm{sp}^3$ hybridization.<br><br>Answer: $\\mathrm{sp}^3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c10aee93fa0796db41", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "What is the shape of bromine pentafluoride?", "image": null}, "options": [{"id": "J3tCA", "text": "Trigonal pyramidal", "image": null, "isCorrect": false}, {"id": "pUDeb", "text": "Square pyramidal", "image": null, "isCorrect": true}, {"id": "tfqFN", "text": "Square planar", "image": null, "isCorrect": false}, {"id": "GLatF", "text": "Distorted octahedral", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The central atom in bromine pentafluoride ($BrF_5$) is bromine (Br), which has $7$ valence electrons.<br><br>It forms $5$ single bonds with $5$ fluorine atoms, using $5$ of its valence electrons. The remaining $2$ electrons form $1$ lone pair.<br><br>Total number of electron domains = $5$ (bonding pairs) + $1$ (lone pair) = $6$.<br><br>This corresponds to $sp^3d^2$ hybridization, which has an octahedral electron geometry.<br><br>Due to the presence of one lone pair, the molecular geometry (shape) becomes square pyramidal.<br><br>Answer: Square pyramidal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ad0aee93fa0796daa8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Which from following molecules has trigonal planar geometry?", "image": null}, "options": [{"id": "Pqfsu", "text": "$\\mathrm{CH}_4$", "image": null, "isCorrect": false}, {"id": "egf6T", "text": "$\\mathrm{C}_2 \\mathrm{H}_2$", "image": null, "isCorrect": false}, {"id": "pYt4z", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": false}, {"id": "qsaDA", "text": "$\\mathrm{BF}_3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In $\\mathrm{CH}_4$, the central carbon atom has $4$ bond pairs and $0$ lone pairs. Its hybridization is $sp^3$ and the geometry is tetrahedral.<br><br>In $\\mathrm{C}_2 \\mathrm{H}_2$, the carbon atoms are $sp$ hybridized and the molecule has a linear geometry.<br><br>In $\\mathrm{NH}_3$, the central nitrogen atom has $3$ bond pairs and $1$ lone pair. Its hybridization is $sp^3$ and the geometry is trigonal pyramidal.<br><br>In $\\mathrm{BF}_3$, the central boron atom has $3$ bond pairs and $0$ lone pairs. Its hybridization is $sp^2$ and the geometry is trigonal planar.<br><br>Answer: $\\mathrm{BF}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213870aee93fa0796d97a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "What is the number of lone pair of electrons on central halogen atom in $\\mathrm{BrF}_3$ ?", "image": null}, "options": [{"id": "gI5eS", "text": "2", "image": null, "isCorrect": true}, {"id": "HiUB7", "text": "3", "image": null, "isCorrect": false}, {"id": "9MJbG", "text": "1", "image": null, "isCorrect": false}, {"id": "9Zhk4", "text": "0", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The central atom in $\\mathrm{BrF}_3$ is Bromine (Br).<br><br>Number of valence electrons in Br = $7$<br><br>Number of bond pairs formed with F atoms = $3$<br><br>Number of remaining non-bonding electrons on Br = $7 - 3 = 4$<br><br>Number of lone pairs = $\\dfrac{4}{2} = 2$<br><br>Thus, the central halogen atom in $\\mathrm{BrF}_3$ has $2$ lone pairs of electrons.<br><br>Answer: 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213740aee93fa0796d8e9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which from following molecules does not have lone pair of electrons in valence shell of central atom?", "image": null}, "options": [{"id": "VU5BY", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": false}, {"id": "LvfVB", "text": "$\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "kJU3U", "text": "$\\mathrm{SO}_2$", "image": null, "isCorrect": false}, {"id": "9OZbT", "text": "$\\mathrm{BF}_3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In $\\mathrm{NH}_3$, the central atom nitrogen has $5$ valence electrons. It forms $3$ bonds with hydrogen atoms, leaving $1$ lone pair.<br><br>In $\\mathrm{H}_2\\mathrm{O}$, the central atom oxygen has $6$ valence electrons. It forms $2$ bonds with hydrogen atoms, leaving $2$ lone pairs.<br><br>In $\\mathrm{SO}_2$, the central atom sulphur has $6$ valence electrons. It forms $2$ double bonds with oxygen atoms (using $4$ electrons), leaving $1$ lone pair.<br><br>In $\\mathrm{BF}_3$, the central atom boron has $3$ valence electrons. It forms $3$ single bonds with fluorine atoms, using all its valence electrons. Thus, there are $0$ lone pairs on the central atom.<br><br>Answer: $\\mathrm{BF}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213630aee93fa0796d869", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Which of the following types of hybridisation result in trigonal geometry?", "image": null}, "options": [{"id": "O2WvL", "text": "sp", "image": null, "isCorrect": false}, {"id": "HQh4U", "text": "$\\mathrm{dsp}^2$", "image": null, "isCorrect": false}, {"id": "6YSBq", "text": "$\\mathrm{sp}^2$", "image": null, "isCorrect": true}, {"id": "2Dh2i", "text": "$\\mathrm{sp}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\text{sp}$ hybridisation results in linear geometry.<br><br>$\\text{dsp}^2$ hybridisation results in square planar geometry.<br><br>$\\text{sp}^2$ hybridisation results in trigonal planar geometry.<br><br>$\\text{sp}^3$ hybridisation results in tetrahedral geometry.<br><br>Therefore, $\\text{sp}^2$ hybridisation results in trigonal geometry.<br><br>Answer: $\\mathrm{sp}^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213610aee93fa0796d856", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "What is the number of lone pairs of electrons on the iodine atom in an IF molecule?", "image": null}, "options": [{"id": "HQDWY", "text": "3", "image": null, "isCorrect": true}, {"id": "BhldR", "text": "2", "image": null, "isCorrect": false}, {"id": "8CpFI", "text": "1", "image": null, "isCorrect": false}, {"id": "D2CpY", "text": "Zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Iodine is a halogen and belongs to Group 17 of the periodic table, having $7$ valence electrons in its outermost shell.<br><br>In the IF molecule, iodine forms one single covalent bond with the fluorine atom, sharing $1$ of its valence electrons.<br><br>The number of remaining non-bonding valence electrons on the iodine atom is $7 - 1 = 6$.<br><br>These $6$ electrons constitute $\\dfrac{6}{2} = 3$ lone pairs.<br><br>Thus, there are $3$ lone pairs of electrons on the iodine atom in an IF molecule.<br><br>Answer: 3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134c0aee93fa0796d7b3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Identify the structure of $\\mathrm{XeF}_4$ molecule from following.", "image": null}, "options": [{"id": "uOCc1", "text": "Trigonal pyramidal", "image": null, "isCorrect": false}, {"id": "Sz93E", "text": "Square pyramidal", "image": null, "isCorrect": false}, {"id": "f0HjO", "text": "Square planar", "image": null, "isCorrect": true}, {"id": "SgTsf", "text": "Distorted octahedral", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The central atom in $\\mathrm{XeF}_4$ is Xenon (Xe).<br><br>Number of valence electrons in Xe = $8$<br><br>Number of monovalent atoms (F) attached = $4$<br><br>Total number of electron pairs around Xe = $\\dfrac{1}{2}(8 + 4) = 6$<br><br>Number of bond pairs = $4$<br><br>Number of lone pairs = $6 - 4 = 2$<br><br>Since there are $6$ electron pairs, the hybridization of Xe is $sp^3d^2$, which corresponds to an octahedral electron geometry.<br><br>According to VSEPR theory, to minimize repulsion, the two lone pairs occupy the opposite axial positions. The four fluorine atoms occupy the equatorial positions.<br><br>Thus, the molecular structure of $\\mathrm{XeF}_4$ is square planar.<br><br>Answer: Square planar", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133c0aee93fa0796d730", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Which from following molecules is tetrahedral?", "image": null}, "options": [{"id": "IqA2E", "text": "$\\mathrm{C}_2 \\mathrm{H}_2$", "image": null, "isCorrect": false}, {"id": "tDR8X", "text": "$\\mathrm{CH}_4$.", "image": null, "isCorrect": true}, {"id": "dV1yp", "text": "$\\mathrm{BeCl}_2$", "image": null, "isCorrect": false}, {"id": "WH0me", "text": "$\\mathrm{BF}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\mathrm{C}_2 \\mathrm{H}_2$, the carbon atoms are $sp$ hybridized, resulting in a linear geometry.<br><br>In $\\mathrm{CH}_4$, the central carbon atom is $sp^3$ hybridized with four bond pairs and zero lone pairs, resulting in a tetrahedral geometry.<br><br>In $\\mathrm{BeCl}_2$, the central beryllium atom is $sp$ hybridized, resulting in a linear geometry.<br><br>In $\\mathrm{BF}_3$, the central boron atom is $sp^2$ hybridized, resulting in a trigonal planar geometry.<br><br>Therefore, $\\mathrm{CH}_4$ is the tetrahedral molecule.<br><br>Answer: $\\mathrm{CH}_4$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262800279619d9d8a3506", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "What is the number of $\\mathrm{sp}^3$ hybrid carbon atoms in $\\mathrm{HO}\\left(\\mathrm{CH}_2\\right)_3 \\mathrm{CH}\\lef
