t/2XUSWjmqGIyrDqnoVopwx3JYqxNj1Zzm6XWFUiOXq_4.original.fullsize.png\">", "image": null, "isCorrect": false}, {"id": "yRH79", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/vrpHQ6u2qR9J6OJ8soPVyem8Pp7CrBLDw4jgwweix8g.original.fullsize.png\">", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In $\\mathrm{SnCl}_{2}, \\mathrm{Sn}$ is $s p^{2}$ hybridized. As such it has two\nbond pairs and one lone pair of electrons. Therefore, its structure is as:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/2tW_RflVveUHBPDFRAZrxT6BQOewDaZ9IyFfWmNDl2k.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/J2Z6WU8t3LyI7_XZjq3XDGDBSky75PKnMpdU-uGB3_Y.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e420279619d9d8a1300", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Geometry of $\\mathrm{SiO}_{4}^{4-}$ anion is", "image": null}, "options": [{"id": "rSxpg", "text": "tetrahedral", "image": null, "isCorrect": true}, {"id": "h4c1l", "text": "trigonal", "image": null, "isCorrect": false}, {"id": "SEoV5", "text": "trihedral", "image": null, "isCorrect": false}, {"id": "iABei", "text": "pentagonal", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e400279619d9d8a12ec", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Structure of ammonia is", "image": null}, "options": [{"id": "6j8dN", "text": "pyramidal", "image": null, "isCorrect": true}, {"id": "d1zR9", "text": "tetrahedral", "image": null, "isCorrect": false}, {"id": "Xmfr9", "text": "trigonal", "image": null, "isCorrect": false}, {"id": "xl273", "text": "trigonal pyramidal", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Structure of ammonia is pyramidal (Distorted\nfrom tetrahedral to pyramidal due to repulsion\nbetween lone pair and bond pair of electrons).\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/EKJTD60iJ7Y_wMwC5n5B8TDdYIdc6ErXWlEtF6uoDPs.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a2632b0279619d9d8a3c98", "title": "Molecular Orbital Theory", "totalQuestions": 49, "questions": [{"_id": "6abb88d115a9fc0fc8c1473b", "type": "singleCorrect", "question": {"text": "Which of the following is an example of diamagnetic species?", "image": null}, "options": [{"id": "2h1qV", "label": "A", "text": "Fe", "isCorrect": false, "image": null}, {"id": "Advul", "label": "B", "text": "Gd", "isCorrect": false, "image": null}, {"id": "slZq9", "label": "C", "text": "$\\text{H}_2\\text{O}$", "isCorrect": true, "image": null}, {"id": "XSV0I", "label": "D", "text": "$\\text{Fe}^{3+}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Fe has the electronic configuration $[\\text{Ar}] 3d^{6} 4s^{2}$, which contains $4$ unpaired electrons, making it paramagnetic (specifically ferromagnetic).<br><br>Gd has the electronic configuration $[\\text{Xe}] 4f^{7} 5d^{1} 6s^{2}$, which contains $8$ unpaired electrons, making it paramagnetic (specifically ferromagnetic).<br><br>$\\text{Fe}^{3+}$ has the electronic configuration $[\\text{Ar}] 3d^{5}$, which contains $5$ unpaired electrons, making it paramagnetic.<br><br>$\\text{H}_2\\text{O}$ has all its electrons paired in its molecular structure, making it a diamagnetic species.<br><br>Answer: $\\text{H}_2\\text{O}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885015a9fc0fc8c14283", "type": "singleCorrect", "question": {"text": "What is bond order in $\\text{N}_2$ molecule?", "image": null}, "options": [{"id": "Gpw9N", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "xlvdm", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "KkWxk", "label": "C", "text": "$3$", "isCorrect": true, "image": null}, {"id": "GplrK", "label": "D", "text": "$4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Total number of electrons in $\\text{N}_2$ molecule is $14$.<br><br>The molecular orbital electronic configuration of $\\text{N}_2$ is:<br>$\\sigma_{1s}^{2} \\sigma^{*}_{1s}^{2} \\sigma_{2s}^{2} \\sigma^{*}_{2s}^{2} \\pi_{2p_x}^{2} \\pi_{2p_y}^{2} \\sigma_{2p_z}^{2}$<br><br>Number of bonding electrons, $N_b = 10$<br>Number of antibonding electrons, $N_a = 4$<br><br>Bond order $= \\dfrac{1}{2}(N_b - N_a)$<br><br>Bond order $= \\dfrac{1}{2}(10 - 4) = 3$<br><br>Answer: $3$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88af15a9fc0fc8c14607", "type": "singleCorrect", "question": {"text": "Which of the following pair of species has bond order one?", "image": null}, "options": [{"id": "vTgki", "label": "A", "text": "$\\text{N}_2,\\ \\text{CO}$", "isCorrect": false, "image": null}, {"id": "JoV4L", "label": "B", "text": "$\\text{N}_2,\\ \\text{NO}^+$", "isCorrect": false, "image": null}, {"id": "dESZ0", "label": "C", "text": "$\\text{O}_2^{2-},\\ \\text{F}_2$", "isCorrect": true, "image": null}, {"id": "GZzW5", "label": "D", "text": "$\\text{CO},\\ \\text{NO}^+$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Total number of electrons in $\\text{N}_2$, $\\text{CO}$, and $\\text{NO}^+$ is $14$.<br><br>According to molecular orbital theory, species with $14$ electrons have a bond order of $3$.<br><br>Total number of electrons in $\\text{O}_2^{2-}$ and $\\text{F}_2$ is $18$.<br><br>The molecular orbital electronic configuration for $18$ electrons is $\\sigma_{1s}^{2} \\sigma^{*}_{1s}^{2} \\sigma_{2s}^{2} \\sigma^{*}_{2s}^{2} \\sigma_{2p_z}^{2} \\pi_{2p_x}^{2} \\pi_{2p_y}^{2} \\pi^{*}_{2p_x}^{2} \\pi^{*}_{2p_y}^{2}$.<br><br>Bond order = $\\dfrac{1}{2}(N_b - N_a) = \\dfrac{1}{2}(10 - 8) = 1$.<br><br>Thus, both $\\text{O}_2^{2-}$ and $\\text{F}_2$ have a bond order of $1$.<br><br>Answer: $\\text{O}_2^{2-},\\ \\text{F}_2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a88c30a4553e1bdb69", "type": "singleCorrect", "question": {"text": "What is the proportionality between (I) Bond length and size of atom (II) Bond length and multiplicity of bond respectively?", "image": null}, "options": [{"id": "BXQcS", "label": "A", "text": "(I)- direct (II)- inverse", "isCorrect": true, "image": null}, {"id": "k7du0", "label": "B", "text": "(I)- direct (II)- direct", "isCorrect": false, "image": null}, {"id": "z43QU", "label": "C", "text": "(I)-inverse (II)-direct", "isCorrect": false, "image": null}, {"id": "6l8ok", "label": "D", "text": "(I)-inverse (II)-inverse", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Bond length is the equilibrium distance between the nuclei of two bonded atoms in a molecule.<br><br>As the size of the bonded atoms increases, the distance between their nuclei increases. Thus, bond length is directly proportional to the size of the atom.<br><br>Bond multiplicity refers to the number of bonds between two atoms (single, double, triple). As bond multiplicity increases, the bond becomes stronger and the atoms are pulled closer together, decreasing the bond length. Thus, bond length is inversely proportional to the multiplicity of the bond.<br><br>Hence, (I) is direct and (II) is inverse.<br><br>Answer: (I)- direct (II)- inverse", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fe8c30a4553e1bdf07", "type": "singleCorrect", "question": {"text": "Which among the following molecule exhibits paramagnetism?", "image": null}, "options": [{"id": "p3EDT", "label": "A", "text": "$\\text{O}_2$", "isCorrect": true, "image": null}, {"id": "5KHIl", "label": "B", "text": "$\\text{O}_3$", "isCorrect": false, "image": null}, {"id": "P1tX8", "label": "C", "text": "$\\text{N}_2$", "isCorrect": false, "image": null}, {"id": "F50kL", "label": "D", "text": "$\\text{F}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Molecular Orbital Theory, the electronic configuration of $\\text{O}_2$ (16 electrons) is:<br><br>${\\sigma_{1s}}^2 {{\\sigma^{*}}_{1s}}^2 \\sigma_{2s}^2 {{\\sigma^{*}}_{2s}}^2 {\\sigma_{2p_z}}^2 {\\pi_{2p_x}}^2 {\\pi_{2p_y}}^2 {{\\pi^{*}}_{2p_x}}^1 {{\\pi^{*}}_{2p_y}}^1$<br><br>Due to the presence of two unpaired electrons in the degenerate antibonding $\\pi^{*}$ molecular orbitals, $\\text{O}_2$ is paramagnetic.<br><br>$\\text{N}_2$ (14 electrons) and $\\text{F}_2$ (18 electrons) have all their electrons paired in their molecular orbitals, making them diamagnetic.<br><br>$\\text{O}_3$ (ozone) also has all its electrons paired and is diamagnetic.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d28c30a4553e1bdd2b", "type": "singleCorrect", "question": {"text": "What is the total number of electrons present in bonding and antibonding orbitals respectively in $\\text{F}_2$ molecule according to MO theory ?", "image": null}, "options": [{"id": "iv8m6", "label": "A", "text": "Bonding - 8,  Antibonding - 10", "isCorrect": false, "image": null}, {"id": "MiMEs", "label": "B", "text": "Bonding - 6,  Antibonding - 12", "isCorrect": false, "image": null}, {"id": "pEiPk", "label": "C", "text": "Bonding - 10,  Antibonding - 8", "isCorrect": true, "image": null}, {"id": "7opN4", "label": "D", "text": "Bonding - 12,  Antibonding - 6", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The atomic number of fluorine ($\\text{F}$) is $9$. Therefore, the total number of electrons in the $\\text{F}_2$ molecule is $18$.<br><br>According to Molecular Orbital Theory, the electronic configuration of $\\text{F}_2$ is:<br>$\\sigma_{1s}^2 \\sigma^{*}_{1s}{}^2 \\sigma_{2s}^2 \\sigma^{*}_{2s}{}^2 \\sigma_{2p_z}^2 \\pi_{2p_x}^2 \\pi_{2p_y}^2 \\pi^{*}_{2p_x}{}^2 \\pi^{*}_{2p_y}{}^2$<br><br>The electrons present in orbitals without an asterisk are bonding electrons ($N_b$), and those in orbitals with an asterisk are antibonding electrons ($N_a$).<br><br>Number of bonding electrons ($N_b$) = $2 (\\sigma_{1s}) + 2 (\\sigma_{2s}) + 2 (\\sigma_{2p_z}) + 2 (\\pi_{2p_x}) + 2 (\\pi_{2p_y}) = 10$<br><br>Number of antibonding electrons ($N_a$) = $2 (\\sigma^{*}_{1s}) + 2 (\\sigma^{*}_{2s}) + 2 (\\pi^{*}_{2p_x}) + 2 (\\pi^{*}_{2p_y}) = 8$<br><br>Thus, there are $10$ bonding electrons and $8$ antibonding electrons.<br><br>Answer: Bonding - 10,  Antibonding - 8", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3348c30a4553e1be145", "type": "singleCorrect", "question": {"text": "Which of the following molecules is paramagnetic?", "image": null}, "options": [{"id": "0kd3u", "label": "A", "text": "$\\text{Li}_2$", "isCorrect": false, "image": null}, {"id": "5kvbR", "label": "B", "text": "$\\text{N}_2$", "isCorrect": false, "image": null}, {"id": "LVel3", "label": "C", "text": "$\\text{O}_2$", "isCorrect": true, "image": null}, {"id": "8Pj8y", "label": "D", "text": "$\\text{F}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to molecular orbital theory, the electronic configurations of the given molecules are written to determine the presence of unpaired electrons.\n\n$\\text{Li}_2$ ($6$ electrons): $\\sigma_{1s}^{2} \\sigma_{1s}^{*2} \\sigma_{2s}^{2}$\n\nSince all electrons are paired, it is diamagnetic.\n\n$\\text{N}_2$ ($14$ electrons): $\\sigma_{1s}^{2} \\sigma_{1s}^{*2} \\sigma_{2s}^{2} \\sigma_{2s}^{*2} \\pi_{2p_x}^{2} \\parallel \\pi_{2p_y}^{2} \\sigma_{2p_z}^{2}$\n\nSince all electrons are paired, it is diamagnetic.\n\n$\\text{O}_2$ ($16$ electrons): $\\sigma_{1s}^{2} \\sigma_{1s}^{*2} \\sigma_{2s}^{2} \\sigma_{2s}^{*2} \\sigma_{2p_z}^{2} \\pi_{2p_x}^{2} \\parallel \\pi_{2p_y}^{2} \\pi_{2p_x}^{*1} \\parallel \\pi_{2p_y}^{*1}$\n\nDue to the presence of two unpaired electrons in the $\\pi^{*}$ antibonding molecular orbitals, $\\text{O}_2$ is paramagnetic.\n\n$\\text{F}_2$ ($18$ electrons): $\\sigma_{1s}^{2} \\sigma_{1s}^{*2} \\sigma_{2s}^{2} \\sigma_{2s}^{*2} \\sigma_{2p_z}^{2} \\pi_{2p_x}^{2} \\parallel \\pi_{2p_y}^{2} \\pi_{2p_x}^{*2} \\parallel \\pi_{2p_y}^{*2}$\n\nSince all electrons are paired, it is diamagnetic.\n\nAnswer: $\\text{O}_2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871becbf9280d7f9932da6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the bond order of $\\mathrm{NO}^{+}$ion.", "image": null}, "options": [{"id": "Xz6yA", "text": "3", "image": null, "isCorrect": true}, {"id": "OtFPv", "text": "1", "image": null, "isCorrect": false}, {"id": "b25tT", "text": "2", "image": null, "isCorrect": false}, {"id": "8JGK8", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total number of electrons in $\\mathrm{NO}^{+}$ ion = $7 \\text{ (from N)} + 8 \\text{ (from O)} - 1 \\text{ (for positive charge)} = 14$.<br><br>The molecular orbital electronic configuration of $\\mathrm{NO}^{+}$ is:<br>$\\sigma_{1s}^{2} \\sigma^{*}_{1s}^{2} \\sigma_{2s}^{2} \\sigma^{*}_{2s}^{2} \\pi_{2p_x}^{2} \\pi_{2p_y}^{2} \\sigma_{2p_z}^{2}$<br><br>Number of bonding electrons ($N_b$) = $2 + 2 + 2 + 2 + 2 = 10$<br>Number of antibonding electrons ($N_a$) = $2 + 2 = 4$<br><br>Bond order = $\\dfrac{1}{2}(N_b - N_a)$<br><br>Bond order = $\\dfrac{1}{2}(10 - 4) = \\dfrac{6}{2} = 3$<br><br>Answer: 3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdebf9280d7f9932d25", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is correct decreasing order of bond length regarding $\\mathrm{N}_2, \\mathrm{O}_2$ and $\\mathrm{Cl}_2$ ?", "image": null}, "options": [{"id": "hThd3", "text": "$\\mathrm{Cl}_2>\\mathrm{O}_2>\\mathrm{N}_2$", "image": null, "isCorrect": true}, {"id": "MylIR", "text": "$\\mathrm{Cl}_2>\\mathrm{N}_2>\\mathrm{O}_2$", "image": null, "isCorrect": false}, {"id": "aYRJg", "text": "$\\mathrm{O}_2>\\mathrm{N}_2>\\mathrm{Cl}_2$", "image": null, "isCorrect": false}, {"id": "pIqQR", "text": "$\\mathrm{N}_2>\\mathrm{O}_2>\\mathrm{Cl}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Bond length depends on the size of the bonded atoms and the bond order.<br><br>Chlorine belongs to the third period, so its atomic radius is much larger than that of nitrogen and oxygen, which belong to the second period. Hence, the $\\mathrm{Cl}-\\mathrm{Cl}$ single bond in $\\mathrm{Cl}_2$ is the longest.<br><br>In $\\mathrm{N}_2$, the nitrogen atoms are bonded by a triple bond ($\\mathrm{N}\\equiv\\mathrm{N}$, bond order $3$). In $\\mathrm{O}_2$, the oxygen atoms are bonded by a double bond ($\\mathrm{O}=\\mathrm{O}$, bond order $2$).<br><br>Since bond length is inversely proportional to bond order, the triple bond in $\\mathrm{N}_2$ is shorter than the double bond in $\\mathrm{O}_2$.<br><br>The experimental bond lengths are approximately $199 \\text{ pm}$ for $\\mathrm{Cl}_2$, $121 \\text{ pm}$ for $\\mathrm{O}_2$, and $110 \\text{ pm}$ for $\\mathrm{N}_2$.<br><br>Thus, the correct decreasing order of bond length is $\\mathrm{Cl}_2 > \\mathrm{O}_2 > \\mathrm{N}_2$.<br><br>Answer: $\\mathrm{Cl}_2>\\mathrm{O}_2>\\mathrm{N}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871baabf9280d7f9932b65", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the number of electrons in bonding molecular orbitals and antibonding molecular orbitals respectively in $\\mathrm{F}_2$ molecule.", "image": null}, "options": [{"id": "Ly8go", "text": "12 and 6", "image": null, "isCorrect": false}, {"id": "cffEp", "text": "10 and 8", "image": null, "isCorrect": true}, {"id": "oR3yo", "text": "8 and 10", "image": null, "isCorrect": false}, {"id": "kIApO", "text": "6 and 12", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The atomic number of fluorine is 9. The total number of electrons in the $\\mathrm{F}_2$ molecule is $9 + 9 = 18$.<br><br>The molecular orbital electronic configuration of $\\mathrm{F}_2$ is:<br>$\\sigma_{1s}^2 \\sigma^{*}_{1s}^2 \\sigma_{2s}^2 \\sigma^{*}_{2s}^2 \\sigma_{2p_z}^2 \\pi_{2p_x}^2 \\pi_{2p_y}^2 \\pi^{*}_{2p_x}^2 \\pi^{*}_{2p_y}^2$<br><br>Number of electrons in bonding molecular orbitals ($N_b$):<br>$N_b = 2 (\\sigma_{1s}) + 2 (\\sigma_{2s}) + 2 (\\sigma_{2p_z}) + 2 (\\pi_{2p_x}) + 2 (\\pi_{2p_y}) = 10$<br><br>Number of electrons in antibonding molecular orbitals ($N_a$):<br>$N_a = 2 (\\sigma^{*}_{1s}) + 2 (\\sigma^{*}_{2s}) + 2 (\\pi^{*}_{2p_x}) + 2 (\\pi^{*}_{2p_y}) = 8$<br><br>Therefore, the number of electrons in bonding and antibonding molecular orbitals are 10 and 8 respectively.<br><br>Answer: 10 and 8", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7dbf9280d7f99329b6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify isoelectronic pair from following.", "image": null}, "options": [{"id": "1xDoV", "text": "Ne and $\\mathrm{O}^{--}$", "image": null, "isCorrect": true}, {"id": "WdyZt", "text": "$\\mathrm{Cl}^{-}$and Ca", "image": null, "isCorrect": false}, {"id": "BZTo1", "text": "Ar and $\\mathrm{F}^{-}$", "image": null, "isCorrect": false}, {"id": "lE1Fe", "text": "$\\mathrm{K}^{+}$and $\\mathrm{Al}^{+3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Isoelectronic species are atoms or ions that have the same number of electrons.<br><br>For Ne, the atomic number is $10$, so it has $10$ electrons.<br><br>For $\\mathrm{O}^{--}$, the atomic number of oxygen is $8$. Gaining $2$ electrons gives it $8 + 2 = 10$ electrons.<br><br>Since both Ne and $\\mathrm{O}^{--}$ have $10$ electrons, they form an isoelectronic pair.<br><br>Checking other options:<br>$\\mathrm{Cl}^{-}$ has $18$ electrons, Ca has $20$ electrons.<br>Ar has $18$ electrons, $\\mathrm{F}^{-}$ has $10$ electrons.<br>$\\mathrm{K}^{+}$ has $18$ electrons, $\\mathrm{Al}^{+3}$ has $10$ electrons.<br><br>Answer: Ne and $\\mathrm{O}^{--}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b79bf9280d7f993298e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following molecules contains maximum number of electrons in antibonding molecular orbitals?", "image": null}, "options": [{"id": "MklVl", "text": "$\\mathrm{Li}_2$", "image": null, "isCorrect": false}, {"id": "v99VK", "text": "$\\mathrm{N}_2$", "image": null, "isCorrect": false}, {"id": "mKvzV", "text": "$\\mathrm{O}_2$", "image": null, "isCorrect": false}, {"id": "jWOeA", "text": "$F_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The electronic configuration of the given molecules based on molecular orbital theory is as follows:<br><br>For $\\mathrm{Li}_2$ (Total electrons = $6$):<br>$\\sigma_{1s}^2 \\sigma^{*}_{1s}{}^2 \\sigma_{2s}^2$<br>Number of electrons in antibonding molecular orbitals = $2$<br><br>For $\\mathrm{N}_2$ (Total electrons = $14$):<br>$\\sigma_{1s}^2 \\sigma^{*}_{1s}{}^2 \\sigma_{2s}^2 \\sigma^{*}_{2s}{}^2 \\pi_{2p_x}^2 \\pi_{2p_y}^2 \\sigma_{2p_z}^2$<br>Number of electrons in antibonding molecular orbitals = $2 + 2 = 4$<br><br>For $\\mathrm{O}_2$ (Total electrons = $16$):<br>$\\sigma_{1s}^2 \\sigma^{*}_{1s}{}^2 \\sigma_{2s}^2 \\sigma^{*}_{2s}{}^2 \\sigma_{2p_z}^2 \\pi_{2p_x}^2 \\pi_{2p_y}^2 \\pi^{*}_{2p_x}{}^1 \\pi^{*}_{2p_y}{}^1$<br>Number of electrons in antibonding molecular orbitals = $2 + 2 + 1 + 1 = 6$<br><br>For $\\mathrm{F}_2$ (Total electrons = $18$):<br>$\\sigma_{1s}^2 \\sigma^{*}_{1s}{}^2 \\sigma_{2s}^2 \\sigma^{*}_{2s}{}^2 \\sigma_{2p_z}^2 \\pi_{2p_x}^2 \\pi_{2p_y}^2 \\pi^{*}_{2p_x}{}^2 \\pi^{*}_{2p_y}{}^2$<br>Number of electrons in antibonding molecular orbitals = $2 + 2 + 2 + 2 = 8$<br><br>Thus, $\\mathrm{F}_2$ contains the maximum number of electrons in antibonding molecular orbitals.<br><br>Answer: $F_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b38bf9280d7f993273d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Select the incorrect statement about $\\mathrm{N}_2$ molecule.", "image": null}, "options": [{"id": "vuAmA", "text": "It is more stable than $\\mathrm{O}_2$ molecule.", "image": null, "isCorrect": false}, {"id": "IS5Zy", "text": "It consists more electrons in bonding molecular orbitals than $\\mathrm{O}_2$", "image": null, "isCorrect": true}, {"id": "hhR3A", "text": "Its bond order is 3", "image": null, "isCorrect": false}, {"id": "LTnqd", "text": "It is dimagnetic", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The molecular orbital electronic configuration of $\\mathrm{N}_2$ (14 electrons) is:<br><br>$\\sigma_{1s}^2 \\sigma^{*2}_{1s} \\sigma_{2s}^2 \\sigma^{*2}_{2s} \\pi_{2p_x}^2 \\pi_{2p_y}^2 \\sigma_{2p_z}^2$<br><br>Number of bonding electrons ($N_b$) = $10$<br>Number of antibonding electrons ($N_a$) = $4$<br>Bond order = $\\dfrac{1}{2}(N_b - N_a) = \\dfrac{1}{2}(10 - 4) = 3$<br><br>Since all electrons are paired, $\\mathrm{N}_2$ is diamagnetic.<br><br>The molecular orbital electronic configuration of $\\mathrm{O}_2$ (16 electrons) is:<br><br>$\\sigma_{1s}^2 \\sigma^{*2}_{1s} \\sigma_{2s}^2 \\sigma^{*2}_{2s} \\sigma_{2p_z}^2 \\pi_{2p_x}^2 \\pi_{2p_y}^2 \\pi^{*1}_{2p_x} \\pi^{*1}_{2p_y}$<br><br>Number of bonding electrons ($N_b$) = $10$<br>Number of antibonding electrons ($N_a$) = $6$<br>Bond order = $\\dfrac{1}{2}(10 - 6) = 2$<br><br>Since the bond order of $\\mathrm{N}_2$ ($3$) is greater than that of $\\mathrm{O}_2$ ($2$), $\\mathrm{N}_2$ is more stable than $\\mathrm{O}_2$.<br><br>Both $\\mathrm{N}_2$ and $\\mathrm{O}_2$ have exactly $10$ electrons in their bonding molecular orbitals. Thus, the statement that $\\mathrm{N}_2$ consists of more electrons in bonding molecular orbitals than $\\mathrm{O}_2$ is incorrect.<br><br>Answer: It consists more electrons in bonding molecular orbitals than $\\mathrm{O}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792144a0aee93fa0796df7b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "What is the number of electrons present in antibonding orbitals of $\\mathrm{N}_2$ molecule according to molecular orbital theory?", "image": null}, "options": [{"id": "a4vIY", "text": "14", "image": null, "isCorrect": false}, {"id": "v5UG5", "text": "04", "image": null, "isCorrect": true}, {"id": "6Xrg3", "text": "10", "image": null, "isCorrect": false}, {"id": "MMpQO", "text": "06", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The total number of electrons in the $\\mathrm{N}_2$ molecule is $7 + 7 = 14$.<br><br>The molecular orbital electronic configuration of $\\mathrm{N}_2$ is:<br><br>$\\sigma_{1s}^{2} \\sigma^{*}_{1s}^{2} \\sigma_{2s}^{2} \\sigma^{*}_{2s}^{2} \\pi_{2p_x}^{2} \\pi_{2p_y}^{2} \\sigma_{2p_z}^{2}$<br><br>The antibonding molecular orbitals are denoted by an asterisk ($^{*}$). In the $\\mathrm{N}_2$ molecule, the electrons present in antibonding orbitals are in $\\sigma^{*}_{1s}$ and $\\sigma^{*}_{2s}$.<br><br>Number of electrons in antibonding orbitals = $2 + 2 = 4$.<br><br>Answer: 04", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214370aee93fa0796dee6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "What is the total number of electrons present in bonding orbitals of $\\mathrm{O}_2$ molecule according to molecular orbital theory?", "image": null}, "options": [{"id": "YlV9M", "text": "16", "image": null, "isCorrect": false}, {"id": "V5kzs", "text": "06", "image": null, "isCorrect": false}, {"id": "TMC80", "text": "10", "image": null, "isCorrect": true}, {"id": "FHokQ", "text": "04", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The total number of electrons in an $\\mathrm{O}_2$ molecule is $16$.<br><br>According to molecular orbital theory, the electronic configuration of $\\mathrm{O}_2$ is:<br><br>$\\sigma_{1s}^{2} \\sigma^{*}_{1s}^{2} \\sigma_{2s}^{2} \\sigma^{*}_{2s}^{2} \\sigma_{2p_z}^{2} \\pi_{2p_x}^{2} \\pi_{2p_y}^{2} \\pi^{*}_{2p_x}^{1} \\pi^{*}_{2p_y}^{1}$<br><br>The bonding molecular orbitals are those without an asterisk ($^{*}$). The electrons present in these orbitals are:<br><br>$\\sigma_{1s}^{2}$ ($2$ electrons)<br><br>$\\sigma_{2s}^{2}$ ($2$ electrons)<br><br>$\\sigma_{2p_z}^{2}$ ($2$ electrons)<br><br>$\\pi_{2p_x}^{2}$ ($2$ electrons)<br><br>$\\pi_{2p_y}^{2}$ ($2$ electrons)<br><br>Total number of bonding electrons $= 2 + 2 + 2 + 2 + 2 = 10$.<br><br>Answer: 10", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c30aee93fa0796db54", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Which of the following molecule has bond order 2?", "image": null}, "options": [{"id": "Pzp9V", "text": "$\\mathrm{N}_2$", "image": null, "isCorrect": false}, {"id": "TRaWL", "text": "$\\mathrm{H}_2$", "image": null, "isCorrect": false}, {"id": "WeZWP", "text": "$\\mathrm{O}_2$", "image": null, "isCorrect": true}, {"id": "Vp8Lz", "text": "$\\mathrm{F}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The electronic configuration of $\\mathrm{O}_2$ (16 electrons) according to Molecular Orbital Theory is:<br><br>$\\sigma_{1s}^2 \\sigma^{*}_{1s}^2 \\sigma_{2s}^2 \\sigma^{*}_{2s}^2 \\sigma_{2p_z}^2 \\pi_{2p_x}^2 \\pi_{2p_y}^2 \\pi^{*}_{2p_x}^1 \\pi^{*}_{2p_y}^1$<br><br>Number of bonding electrons, $N_b = 10$<br><br>Number of antibonding electrons, $N_a = 6$<br><br>Bond order $= \\dfrac{1}{2}(N_b - N_a) = \\dfrac{1}{2}(10 - 6) = 2$<br><br>For $\\mathrm{N}_2$, bond order is $3$.<br><br>For $\\mathrm{H}_2$, bond order is $1$.<br><br>For $\\mathrm{F}_2$, bond order is $1$.<br><br>Answer: $\\mathrm{O}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138a0aee93fa0796d993", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Identify the bond order and magnetic nature of - $\\mathrm{Li}_2$ mólecule respectively.", "image": null}, "options": [{"id": "aQA2G", "text": "1 and diamagnetic", "image": null, "isCorrect": true}, {"id": "DB8yN", "text": "2 and diamagnetic", "image": null, "isCorrect": false}, {"id": "E216m", "text": "1 and paramagnetic", "image": null, "isCorrect": false}, {"id": "NCsP8", "text": "2 and paramagnetic", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total number of electrons in $\\mathrm{Li}_2$ molecule is $3 + 3 = 6$.<br><br>The molecular orbital electronic configuration of $\\mathrm{Li}_2$ is $\\sigma_{1s}^{2} \\sigma^{*}_{1s}^{2} \\sigma_{2s}^{2}$.<br><br>Number of bonding electrons, $N_b = 4$<br>Number of antibonding electrons, $N_a = 2$<br><br>Bond order = $\\dfrac{1}{2}(N_b - N_a) = \\dfrac{1}{2}(4 - 2) = 1$<br><br>Since all electrons are paired in the molecular orbitals, the $\\mathrm{Li}_2$ molecule is diamagnetic.<br><br>Answer: 1 and diamagnetic", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213860aee93fa0796d971", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Identify the orbital having lowest energy from following.", "image": null}, "options": [{"id": "Lisgf", "text": "2 p", "image": null, "isCorrect": true}, {"id": "kEhlC", "text": "3 s", "image": null, "isCorrect": false}, {"id": "cvL2H", "text": "3 d", "image": null, "isCorrect": false}, {"id": "6NO64", "text": "$4 p$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the $(n + l)$ rule, the energy of an orbital depends on the sum of the principal quantum number $n$ and the azimuthal quantum number $l$.<br><br>For $2p$: $n = 2$, $l = 1 \\Rightarrow n + l = 3$<br>For $3s$: $n = 3$, $l = 0 \\Rightarrow n + l = 3$<br>For $3d$: $n = 3$, $l = 2 \\Rightarrow n + l = 5$<br>For $4p$: $n = 4$, $l = 1 \\Rightarrow n + l = 5$<br><br>For orbitals with the same $(n + l)$ value, the one with the lower value of $n$ has lower energy. Thus, the $2p$ orbital has lower energy than the $3s$ orbital.<br><br>Therefore, the $2p$ orbital has the lowest energy among the given options.<br><br>Answer: 2 p", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213260aee93fa0796d68a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "What is the bond order in CO molecule?", "image": null}, "options": [{"id": "bCxsl", "text": "1", "image": null, "isCorrect": false}, {"id": "7pDaI", "text": "3", "image": null, "isCorrect": true}, {"id": "0BjZx", "text": "2", "image": null, "isCorrect": false}, {"id": "gZpER", "text": "$\\dfrac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total number of electrons in CO molecule = $6 + 8 = 14$<br><br>The molecular orbital electronic configuration of CO is $\\sigma_{1s}^{2} \\sigma^{*}_{1s}^{2} \\sigma_{2s}^{2} \\sigma^{*}_{2s}^{2} \\pi_{2p_x}^{2} \\pi_{2p_y}^{2} \\sigma_{2p_z}^{2}$<br><br>Number of bonding electrons, $N_b = 10$<br><br>Number of antibonding electrons, $N_a = 4$<br><br>Bond order = $\\dfrac{1}{2}(N_b - N_a) = \\dfrac{1}{2}(10 - 4) = 3$<br><br>Answer: 3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262810279619d9d8a3510", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Find the number of unpaired electrons for copper in ground state configuration.", "image": null}, "options": [{"id": "nLsE3", "text": "1", "image": null, "isCorrect": true}, {"id": "ocogz", "text": "2", "image": null, "isCorrect": false}, {"id": "YFD8D", "text": "3", "image": null, "isCorrect": false}, {"id": "QByIj", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{Cu}(\\mathrm{Z}=29):[\\mathrm{Ar}] 3 \\mathrm{~d}^{10} 4 \\mathrm{~s}^1$\n$\\therefore \\quad$ No. of unpaired electrons $=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625d0279619d9d8a33ef", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "What is the bond order in $\\mathrm{N}_2^*$ ?", "image": null}, "options": [{"id": "1H0Xs", "text": "0", "image": null, "isCorrect": false}, {"id": "UStGv", "text": "1", "image": null, "isCorrect": false}, {"id": "dIYBD", "text": "2", "image": null, "isCorrect": false}, {"id": "m2tTv", "text": "2.5", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Electronic configuration of $\\mathrm{N}_2^{+}:(\\sigma 1 \\mathrm{~s})^2\\left(\\sigma^* 1 \\mathrm{~s}\\right)^2$\n$(\\sigma 2 \\mathrm{~s})^2\\left(\\sigma^* 2 \\mathrm{~s}\\right)^2\\left(\\pi 2 \\mathrm{p}_{\\mathrm{x}}\\right)^2\\left(\\pi 2 \\mathrm{p}_{\\mathrm{y}}\\right)^2\\left(\\sigma 2 \\mathrm{p}_{\\mathrm{z}}\\right)^1$\nBond order $=\\frac{\\mathrm{N}_{\\mathrm{b}}-\\mathrm{N}_{\\mathrm{a}}}{2}=\\frac{1}{2}(9-4)=2.5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262360279619d9d8a32b4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "What is bond order of $\\mathrm{F}_2$ molecule?", "image": null}, "options": [{"id": "Xuaam", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "QCkMi", "text": "$1$", "image": null, "isCorrect": true}, {"id": "ewbZ4", "text": "$2$", "image": null, "isCorrect": false}, {"id": "z5t1M", "text": "$3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The electronic configuration of $\\mathrm{F}_2$\n$$\n\\begin{aligned}\n& (\\sigma 1 \\mathrm{~s})^2\\left(\\sigma^* 1 \\mathrm{~s}\\right)^2(\\sigma 2 \\mathrm{~s})^2\\left(\\sigma^* 2 \\mathrm{~s}\\right)^2\\left(\\sigma 2 \\mathrm{p}_{\\mathrm{z}}\\right)^2\\left(\\pi 2 \\mathrm{p}_{\\mathrm{x}}\\right)^2 \\\\\n& \\left(\\pi 2 \\mathrm{p}_{\\mathrm{y}}\\right)^2\\left(\\pi^* 2 \\mathrm{p}_{\\mathrm{x}}\\right)^2\\left(\\pi^* 2 \\mathrm{p}_{\\mathrm{y}}\\right)^2 \\\\\n& \\text { Bond order of } \\mathrm{F}_2 \\text { molecule }=\\frac{\\mathrm{N}_{\\mathrm{b}}-\\mathrm{N}_{\\mathrm{a}}}{2}=\\frac{10-8}{2}=1\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262000279619d9d8a3100", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Identify a molecule with incomplete octet from following.", "image": null}, "options": [{"id": "G0hgS", "text": "$\\mathrm{SF}_6$", "image": null, "isCorrect": false}, {"id": "n7tqX", "text": "$\\mathrm{PCl}_5$", "image": null, "isCorrect": false}, {"id": "T6Ys5", "text": "$\\mathrm{LiCl}$", "image": null, "isCorrect": true}, {"id": "WWV3b", "text": "$\\mathrm{H}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{Li}$ in $\\mathrm{LiCl}$ has less than eight electrons in its valence shell. It has only four electrons. Hence, it has an incomplete octet. Molecules like $\\mathrm{SF}_6$, $\\mathrm{PCl}_5, \\mathrm{H}_2 \\mathrm{SO}_4$ have an expanded octet. They have more than eight electrons around the central atom.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "no ma^{*} 2 s^{2}, \\sigma 2 p_{z}^{2}, \\pi 2 p_{x}^{2}=\\pi 2 p_{y}^{2}$\n$\\pi^{\\star} 2 p_{x}^{1}$\nBond order $=\\frac{8-3}{2}=2.5$\n(c) $\\mathrm{O}_{2}^{-}=K K^{\\prime} \\sigma 2 s^{2}, \\sigma^{\\star} 2 s^{2}, \\sigma 2 p_{z}^{2}, \\pi 2 p_{x}^{2} \\approx \\pi 2 p_{y}^{2}$\n$\\pi 2 p_{x}^{2} \\approx \\pi \\cdot 2 p_{y}^{*}$\nBond order $=\\frac{8-5}{2}=1.5$\n(d) $\\mathrm{O}_{2}=K K^{\\prime} \\sigma 2 s^{2}, \\sigma^{\\star} 2 s^{2}, \\sigma 2 p_{z}^{2}, \\pi 2 p_{x}^{2} \\approx \\pi 2 p_{y}^{2}$\n$\\pi 2 p_{x}^{*} \\approx \\pi 2 p_{y}^{1}$\nBond order $=\\frac{8-4}{2}=2$\n: Bond energy $\\propto \\frac{1}{\\text { Bond order }}$\n$\\therefore \\mathrm{O}_{2}^{2-}$ has highest bond energy.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9d0279619d9d8a15e1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "Which of the following has least bond energy?", "image": null}, "options": [{"id": "7nWCO", "text": "$\\mathrm{N}_{2}^{2-}$", "image": null, "isCorrect": false}, {"id": "l6kmR", "text": "$\\mathrm{N}_{2}$", "image": null, "isCorrect": false}, {"id": "FvgfL", "text": "$\\mathrm{N}_{2}^{+}$", "image": null, "isCorrect": false}, {"id": "MG73T", "text": "$\\mathrm{N}_{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{N}_{2}^{2-}=K K^{\\prime} \\sigma 2 s^{2}, \\sigma 2 s^{2}, \\sigma 2 p_{z}^{2}, \\pi 2 p_{x}^{2}, \\approx \\pi & 2 p_{y}^{2} \\\\ & \\pi 2 p_{x}^{2} \\end{aligned}$\n$\\begin{aligned} \\therefore \\text { Bond order } &=\\frac{N_{b}-N_{a}}{2} \\\\ &=\\frac{8-4}{2}=2 \\end{aligned}$\n(b) $\\mathrm{N}_{2}^{-}=K K^{\\prime} \\sigma 2 \\mathrm{~s}^{2}, \\sigma 2 \\mathrm{~s}^{2}, \\sigma 2 p_{z}^{2}, \\pi 2 p_{x}^{2}=\\pi 2 p_{y}^{2}$\nBond order $=\\frac{8-3}{2}=2.5$\n(c) $\\mathrm{N}_{2}^{+}=K K^{\\prime} \\sigma 2 s^{2} \\sigma 2 s^{2}, \\pi 2 p_{x}^{2}=\\pi 2 p_{y}^{2}, \\sigma 2 p_{z}^{1}$\nBond order $=\\frac{7-2}{2}=2.5$\n(d) $\\mathrm{N}_{2}=K K^{\\prime} \\sigma 2 s^{2}, \\sigma^{\\dagger} 2 s^{2}, \\pi 2 p_{x}^{2}=\\pi 2 p_{y}^{2}, \\sigma 2 p_{z}^{2}$\nBond order $=\\frac{8-2}{2}=3$\n$\\because$ Bond energy $\\propto \\frac{1}{\\text { Bond order }}$\n$\\therefore \\mathrm{N}_{2}$ has least bond energy.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e400279619d9d8a12ee", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The bond energy is the energy required to", "image": null}, "options": [{"id": "z45Q1", "text": "dissociate one mole of the substance", "image": null, "isCorrect": false}, {"id": "CCLM3", "text": "dissociate bond in $1 \\mathrm{~kg}$ of the substance", "image": null, "isCorrect": false}, {"id": "eTBDu", "text": "break one mole of similar bonds", "image": null, "isCorrect": true}, {"id": "U24vP", "text": "break bonds in one mole of substance", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The bond energy is the energy required to break one mole of similar bonds.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a2632b0279619d9d8a3c9c", "title": "Ionic bond", "totalQuestions": 12, "questions": [{"_id": "6abb884015a9fc0fc8c141ed", "type": "singleCorrect", "question": {"text": "Which of the following is the correct order of lattice energy?", "image": null}, "options": [{"id": "9OD6o", "label": "A", "text": "$\\text{AlCl}_3 > \\text{CaCl}_2 > \\text{NaCl}$", "isCorrect": true, "image": null}, {"id": "u9SZJ", "label": "B", "text": "$\\text{AlCl}_3 > \\text{NaCl} > \\text{CaCl}_2$", "isCorrect": false, "image": null}, {"id": "mhO8p", "label": "C", "text": "$\\text{CaCl}_2 > \\text{AlCl}_3 > \\text{NaCl}$", "isCorrect": false, "image": null}, {"id": "GTZE1", "label": "D", "text": "$\\text{NaCl} > \\text{CaCl}_2 > \\text{AlCl}_3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Lattice energy is directly proportional to the product of the charges on the ions and inversely proportional to the sum of their ionic radii.<br><br>Lattice Energy $\\propto \\dfrac{|Z^+ Z^-|}{r^+ + r^-}$<br><br>In the given compounds, the anion is $\\text{Cl}^-$ in all cases. The cations are $\\text{Al}^{3+}$, $\\text{Ca}^{2+}$, and $\\text{Na}^+$.<br><br>The product of charges $|Z^+ Z^-|$ for the compounds are:<br>$\\text{AlCl}_3$: $|(+3)(-1)| = 3$<br>$\\text{CaCl}_2$: $|(+2)(-1)| = 2$<br>$\\text{NaCl}$: $|(+1)(-1)| = 1$<br><br>Since the charge factor dominates and the ionic radius also decreases in the order $\\text{Na}^+ > \\text{Ca}^{2+} > \\text{Al}^{3+}$, both factors contribute to increasing lattice energy in the same direction.<br><br>Thus, the correct order of lattice energy is $\\text{AlCl}_3 > \\text{CaCl}_2 > \\text{NaCl}$.<br><br>Answer: $\\text{AlCl}_3 > \\text{CaCl}_2 > \\text{NaCl}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30a8c30a4553e1bdf88", "type": "singleCorrect", "question": {"text": "Which of the following is favourable condition for the formation of ionic bond ?", "image": null}, "options": [{"id": "BL7ti", "label": "A", "text": "Low ionization enthalpy of metal and low negative value of electron gain enthalpy of non metal.", "isCorrect": false, "image": null}, {"id": "TO3BL", "label": "B", "text": "Low ionization enthalpy of metal and high negative value of electron gain enthalpy of non metal.", "isCorrect": true, "image": null}, {"id": "Kpz5I", "label": "C", "text": "High ionization enthalpy of metal and high negative value of electron gain enthalpy of non metal.", "isCorrect": false, "image": null}, {"id": "qg0lC", "label": "D", "text": "High ionization enthalpy of metal and low negative value of electron gain enthalpy of non metal.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The formation of an ionic bond involves the transfer of electrons from a metal atom to a non-metal atom.<br><br>The metal atom loses an electron to form a cation. This process requires energy, which is the ionization enthalpy. A lower ionization enthalpy means the metal can easily lose its valence electrons, favoring cation formation.<br><br>The non-metal atom gains an electron to form an anion. This process releases energy, which is measured as the electron gain enthalpy. A high negative value of electron gain enthalpy indicates that a large amount of energy is released, making the formation of the anion highly favorable.<br><br>Therefore, the favorable conditions for the formation of an ionic bond are a low ionization enthalpy of the metal and a high negative value of electron gain enthalpy of the non-metal.<br><br>Answer: Low ionization enthalpy of metal and high negative value of electron gain enthalpy of non metal.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8cbf9280d7f9932a48", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following compounds has high lattice enthalpy?", "image": null}, "options": [{"id": "ocRtz", "text": "LiCl", "image": null, "isCorrect": false}, {"id": "UH4XT", "text": "NaCl", "image": null, "isCorrect": false}, {"id": "uf9mC", "text": "$\\mathrm{BeF}_2$", "image": null, "isCorrect": true}, {"id": "3XPKR", "text": "$\\mathrm{CaCl}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Lattice enthalpy is directly proportional to the product of the charges on the ions and inversely proportional to the internuclear distance (sum of ionic radii).<br><br>Lattice enthalpy $\\propto \\dfrac{q_1 q_2}{r^+ + r^-}$<br><br>Among the given options, $\\mathrm{Be}^{2+}$ and $\\mathrm{Ca}^{2+}$ have a $+2$ charge, whereas $\\mathrm{Li}^{+}$ and $\\mathrm{Na}^{+}$ have a $+1$ charge. Due to the higher charge, $\\mathrm{BeF}_2$ and $\\mathrm{CaCl}_2$ will have significantly higher lattice enthalpies than $\\mathrm{LiCl}$ and $\\mathrm{NaCl}$.<br><br>Comparing $\\mathrm{BeF}_2$ and $\\mathrm{CaCl}_2$, the ionic radius of $\\mathrm{Be}^{2+}$ is much smaller than that of $\\mathrm{Ca}^{2+}$, and the ionic radius of $\\mathrm{F}^{-}$ is smaller than that of $\\mathrm{Cl}^{-}$.<br><br>Because of the smaller sizes of both the cation and the anion in $\\mathrm{BeF}_2$, the internuclear distance is the shortest, leading to the strongest electrostatic forces of attraction.<br><br>Therefore, $\\mathrm{BeF}_2$ has the highest lattice enthalpy.<br><br>Answer: $\\mathrm{BeF}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2612c0279619d9d8a2a63", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "Identify the element having highest ionization enthalpy.", "image": null}, "options": [{"id": "eIu2h", "text": "$\\mathrm{Li}$", "image": null, "isCorrect": true}, {"id": "qthub", "text": "K", "image": null, "isCorrect": false}, {"id": "9Lgct", "text": "$\\mathrm{Rb}$", "image": null, "isCorrect": false}, {"id": "DVVZM", "text": "Cs", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a group as we move down wards I.E. decreases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260d20279619d9d8a2795", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "What is the formal charge on ' $\\mathrm{N}$ ' atom in $[: \\ddot{\\mathrm{S}}-\\mathrm{C} \\equiv \\mathrm{N} \\text { : }]^{\\ominus}$ ion?", "image": null}, "options": [{"id": "RuktG", "text": "zero", "image": null, "isCorrect": true}, {"id": "CiqmI", "text": "+3", "image": null, "isCorrect": false}, {"id": "WTalv", "text": "-2", "image": null, "isCorrect": false}, {"id": "upGl8", "text": "+2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Formal charge$=\\left[\\begin{array}{l}\\text { Total no. of } \\\\ \\text { valence } \\mathrm{e}^{-} \\\\ \\text {in freestate }\\end{array}\\right]-\\left[\\begin{array}{l}\\text { Total no. of } \\\\ \\text { lonepair } \\\\ \\text { electrons }\\end{array}\\right]-\\frac{1}{2}\\left[\\begin{array}{l}\\text  (21 Sep Shift 2)"}], "question": {"text": "What is the formal charge of oxygen atoms in carbon monoxide?", "image": null}, "options": [{"id": "OTNS5", "text": "+2", "image": null, "isCorrect": false}, {"id": "oYVdr", "text": "+1", "image": null, "isCorrect": true}, {"id": "yX5wa", "text": "-1", "image": null, "isCorrect": false}, {"id": "Lb2TN", "text": "Zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Lewis's structure of carbon monoxide $\\Rightarrow: \\mathrm{C} \\equiv \\mathrm{O}$ :\n$$\n\\begin{aligned}\n& \\text { Formal charge }=\\left[\\begin{array}{c}\n\\text { Total no.of valence } \\\\\n\\mathrm{e}^{-} \\text {infreestate }\n\\end{array}\\right]-\\left[\\begin{array}{c}\n\\text { Total no.of lone } \\\\\n\\text { pairelectrons }\n\\end{array}\\right]-\\frac{1}{2}\\left[\\begin{array}{c}\n\\text { no. of bonding electrons } \\\\\n\\text { on thatparticularatom }\n\\end{array}\\right] \\\\\n& =6-2-\\frac{1}{2} \\times 6 \\\\\n& =+1\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604c0279619d9d8a235a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "What is the formal charge on carbon atom in $\\mathrm{CO}_3^{2-}$ ion?", "image": null}, "options": [{"id": "YnxD1", "text": "-2", "image": null, "isCorrect": false}, {"id": "PY341", "text": "-4", "image": null, "isCorrect": false}, {"id": "5TcKk", "text": "+4", "image": null, "isCorrect": false}, {"id": "H1qJX", "text": "zero", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/NIVNTObak_TVPeodQ9KH0tKKloMPaYU1q7oLZ1SVWMA.original.fullsize.png\"><br>\n\n$$\n\\begin{aligned}\n& \\text { Formal charg } e=\\left[\\begin{array}{c}\n\\text { Total no.of valence } \\\\\n\\mathrm{e}^{-} \\text {in freestate }\n\\end{array}\\right]-\\left[\\begin{array}{c}\n\\text { Total no.oflone } \\\\\n\\text { pair electrons }\n\\end{array}\\right]-\\frac{1}{2}\\left[\\begin{array}{c}\n\\text { no.of bonding electrons } \\\\\n\\text { on that particular atom }\n\\end{array}\\right] \\\\\n& =4-0-\\frac{1}{2} \\times 8=0 \\\\\n&\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fde0279619d9d8a1fe6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "Which of the following is an ionic compound?", "image": null}, "options": [{"id": "0GxnJ", "text": "$\\mathrm{SO}_{2}$", "image": null, "isCorrect": false}, {"id": "BYBXA", "text": "ICl", "image": null, "isCorrect": false}, {"id": "kxOGs", "text": "$\\mathrm{CHCl}_{3}$", "image": null, "isCorrect": false}, {"id": "XfBVT", "text": "KI", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(D)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fa50279619d9d8a1e23", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "Which of the following is true for the compound $\\mathrm{AB}$, if it is formed by transfer of an electron from $A$ to $B$ ?", "image": null}, "options": [{"id": "cyjMg", "text": "$\\mathrm{B}$ is divalent", "image": null, "isCorrect": false}, {"id": "exGK3", "text": "A is divalent", "image": null, "isCorrect": false}, {"id": "EPXTG", "text": "AB forms electrovalent bond", "image": null, "isCorrect": true}, {"id": "8top9", "text": "AB forms covalent bond", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a2632b0279619d9d8a3c99", "title": "Polarization", "totalQuestions": 8, "questions": [{"_id": "6abb88a215a9fc0fc8c1458b", "type": "singleCorrect", "question": {"text": "Which is the correct decreasing order for ionic character of halides, where M is a monovalent metal?", "image": null}, "options": [{"id": "kULV4", "label": "A", "text": "$\\text{MF} > \\text{MCl} > \\text{MBr} > \\text{MI}$", "isCorrect": true, "image": null}, {"id": "WJ6nv", "label": "B", "text": "$\\text{MI} > \\text{MBr} > \\text{MCl} > \\text{MF}$", "isCorrect": false, "image": null}, {"id": "wTKK9", "label": "C", "text": "$\\text{MI} > \\text{MCl} > \\text{MBr} > \\text{MF}$", "isCorrect": false, "image": null}, {"id": "Wi1o4", "label": "D", "text": "$\\text{MF} > \\text{MBr} > \\text{MCl} > \\text{MI}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Fajan's rules, the covalent character of a bond increases with the size of the anion, assuming the cation remains the same.<br><br>The size of the halide ions increases down the group: $\\text{F}^- < \\text{Cl}^- < \\text{Br}^- < \\text{I}^-$.<br><br>As the size of the anion increases, its polarizability increases, which leads to an increase in the covalent character of the metal halide.<br><br>Therefore, the covalent character increases in the order: $\\text{MF} < \\text{MCl} < \\text{MBr} < \\text{MI}$.<br><br>Consequently, the ionic character follows the reverse order, decreasing as: $\\text{MF} > \\text{MCl} > \\text{MBr} > \\text{MI}$.<br><br>Alternatively, based on electronegativity, fluorine is the most electronegative halogen. The electronegativity difference between the metal and the halogen is maximum for $\\text{MF}$ and minimum for $\\text{MI}$. Hence, $\\text{MF}$ has the highest ionic character.<br><br>Answer: $\\text{MF} > \\text{MCl} > \\text{MBr} > \\text{MI}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3278c30a4553e1be0be", "type": "singleCorrect", "question": {"text": "Which of the following metal halides have more covalent character?", "image": null}, "options": [{"id": "QZSoA", "label": "A", "text": "$\\text{SnCl}_2$", "isCorrect": false, "image": null}, {"id": "2pSwW", "label": "B", "text": "$\\text{PbCl}_4$", "isCorrect": true, "image": null}, {"id": "Ym9JY", "label": "C", "text": "$\\text{SbCl}_3$", "isCorrect": false, "image": null}, {"id": "hQvFd", "label": "D", "text": "$\\text{PbCl}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Fajan's rules, the covalent character of a metal halide increases with an increase in the positive charge on the central metal cation. A higher charge on the cation results in greater polarizing power, which increases the covalent character of the bond.<br><br>The oxidation states of the central metal cations in the given options are:<br>$\\text{SnCl}_2$: $+2$<br>$\\text{PbCl}_4$: $+4$<br>$\\text{SbCl}_3$: $+3$<br>$\\text{PbCl}_2$: $+2$<br><br>Since $\\text{Pb}$ in $\\text{PbCl}_4$ has the highest oxidation state of $+4$, the $\\text{Pb}^{4+}$ ion has the maximum polarizing power. Thus, $\\text{PbCl}_4$ has the most covalent character.<br><br>Answer: $\\text{PbCl}_4$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871affbf9280d7f9932572", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following compounds has maximum covalent character?", "image": null}, "options": [{"id": "EQuNe", "text": "LiCl", "image": null, "isCorrect": false}, {"id": "WATLW", "text": "LiI", "image": null, "isCorrect": true}, {"id": "hs6se", "text": "NaCl", "image": null, "isCorrect": false}, {"id": "RC7d4", "text": "NaI", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Fajan's rules, the covalent character of an ionic compound increases with a decrease in the size of the cation and an increase in the size of the anion.<br><br>Among the given cations ($\\text{Li}^{+}$ and $\\text{Na}^{+}$), $\\text{Li}^{+}$ has a smaller size, which gives it a higher polarizing power.<br><br>Among the given anions ($\\text{Cl}^{-}$ and $\\text{I}^{-}$), $\\text{I}^{-}$ has a larger size, which makes it more polarizable.<br><br>Therefore, the combination of the smallest cation ($\\text{Li}^{+}$) and the largest anion ($\\text{I}^{-}$) results in the maximum covalent character. Thus, $\\text{LiI}$ has the maximum covalent character.<br><br>Answer: LiI", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPractice
