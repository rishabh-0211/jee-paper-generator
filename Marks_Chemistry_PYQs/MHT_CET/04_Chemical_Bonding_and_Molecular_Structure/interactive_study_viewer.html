, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/EwLdNJZlQ7i-UMzcgwJBMaNiOgp6XFPIy0BiTYQdJxg.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260e60279619d9d8a2835", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "Which among the following is correct decreasing order of covalent character of ionic bond?", "image": null}, "options": [{"id": "9RFa1", "text": "$\\mathrm{AlCl}_3>\\mathrm{MgCl}_2>\\mathrm{NaCl}$", "image": null, "isCorrect": true}, {"id": "BzHsj", "text": "$\\mathrm{AlCl}_3>\\mathrm{NaCl}>\\mathrm{MgCl}_2$", "image": null, "isCorrect": false}, {"id": "aUX4d", "text": "$\\mathrm{MgCl}_2>\\mathrm{MgCl}_2>\\mathrm{AlCl}_3$", "image": null, "isCorrect": false}, {"id": "tTcFv", "text": "$\\mathrm{NaCl}>\\mathrm{MgCl}_2>\\mathrm{AlCl}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "More is the change on cation greater is polarising power and more is the covalent character order of polarizing power $\\mathrm{Al}^{+3}>\\mathrm{Mg}^{+2}>\\mathrm{Na}^{+}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604d0279619d9d8a2360", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "Identify metal halide from following having highest ionic character? $(M=$ metal atom $)$", "image": null}, "options": [{"id": "0VBYI", "text": "$\\mathrm{MF}$", "image": null, "isCorrect": true}, {"id": "CMfYL", "text": "$\\mathrm{MBr}$", "image": null, "isCorrect": false}, {"id": "0KaVw", "text": "$\\mathrm{MI}$", "image": null, "isCorrect": false}, {"id": "zUzF8", "text": "$\\mathrm{MCl}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to fajan's rule as the size of anion increases its ionic character will decrease. Since the size of $\\mathrm{F}^{-}$is the lowest among halides hence MF has the highest ionic character.\nOrder of ionic character:\n$$\n\\mathrm{MF}>\\mathrm{MCl}>\\mathrm{MBr}>\\mathrm{MI}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eb30279619d9d8a1690", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "Which among the following solids is a non-polar solid?", "image": null}, "options": [{"id": "n5Q0g", "text": "Hydrogen chloride", "image": null, "isCorrect": false}, {"id": "4Fsm3", "text": "Sulphur dioxide", "image": null, "isCorrect": false}, {"id": "iac7w", "text": "Water", "image": null, "isCorrect": false}, {"id": "YkrWD", "text": "Carbon dioxide", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Carbon dioxide is a non-polar solid.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "6a44d3898c30a4553e1be401", "title": "Characteristics of covalent compound", "totalQuestions": 1, "questions": [{"_id": "6a44d2ee8c30a4553e1bde5c", "type": "singleCorrect", "question": {"text": "Which of the following ethers is gaseous at room temperature ?", "image": null}, "options": [{"id": "RlGQL", "label": "A", "text": "1 - Methoxypropane", "isCorrect": false, "image": null}, {"id": "zyVuA", "label": "B", "text": "1 - Ethoxypropane", "isCorrect": false, "image": null}, {"id": "dEKHz", "label": "C", "text": "Methoxyethane", "isCorrect": true, "image": null}, {"id": "xeVJw", "label": "D", "text": "Ethoxyethane", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Dimethyl ether and ethyl methyl ether (methoxyethane) are gases at room temperature.<br><br>Other lower homologues of ethers, such as diethyl ether (ethoxyethane), 1-methoxypropane, and 1-ethoxypropane, are colourless, highly volatile liquids at room temperature.<br><br>Therefore, methoxyethane is gaseous at room temperature.<br><br>Answer: Methoxyethane", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "65a2632b0279619d9d8a3c9b", "title": "Properties of ionic compounds", "totalQuestions": 10, "questions": [{"_id": "6abb888015a9fc0fc8c1444d", "type": "singleCorrect", "question": {"text": "Identify a pair of isomorphous substances from following.", "image": null}, "options": [{"id": "AvmW3", "label": "A", "text": "Diamond and Fullerene", "isCorrect": false, "image": null}, {"id": "DFG5h", "label": "B", "text": "$\\beta$ - Quartz and Cristobalite", "isCorrect": false, "image": null}, {"id": "VrgUt", "label": "C", "text": "Sodium fluoride and Magnesium oxide", "isCorrect": true, "image": null}, {"id": "eh0sd", "label": "D", "text": "Calcite and Aragonite", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Isomorphous substances are those that have the same crystal structure and similar chemical composition.<br><br>Sodium fluoride (NaF) and Magnesium oxide (MgO) both crystallize in the face-centered cubic (fcc) rock salt structure. They have the same atomic ratio ($1:1$) and their constituent ions are isoelectronic ($Na^+$ and $Mg^{2+}$, $F^-$ and $O^{2-}$). Thus, they form an isomorphous pair.<br><br>Diamond and Fullerene are allotropes of carbon with different structures.<br><br>$\\beta$-Quartz and Cristobalite are polymorphs of silica with different structures.<br><br>Calcite and Aragonite are polymorphs of calcium carbonate with different structures.<br><br>Answer: Sodium fluoride and Magnesium oxide", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8dbf9280d7f9932a4c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following pair of compounds exhibits isomorphism?", "image": null}, "options": [{"id": "KcmWL", "text": "Calcite and aragonite", "image": null, "isCorrect": false}, {"id": "EsNfY", "text": "$\\alpha$-quartz and cristobalite", "image": null, "isCorrect": false}, {"id": "xNxXR", "text": "Sodium nitrate and calcium carbonate", "image": null, "isCorrect": true}, {"id": "Ul3jx", "text": "Diamond and fullerene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Isomorphism is the phenomenon in which two or more different substances have the same crystal structure. They typically have the same atomic ratio.<br><br>Sodium nitrate ($NaNO_3$) and calcium carbonate ($CaCO_3$) have the same atomic ratio ($1:1:3$) and crystallize in the same rhombohedral structure. Therefore, they exhibit isomorphism.<br><br>Calcite and aragonite are polymorphs of calcium carbonate.<br><br>$\\alpha$-quartz and cristobalite are polymorphs of silica.<br><br>Diamond and fullerene are allotropes (polymorphs) of carbon.<br><br>Answer: Sodium nitrate and calcium carbonate", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213860aee93fa0796d978", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Calculate radius of fourth orbit of $\\mathrm{B}^{4+}$ ion.", "image": null}, "options": [{"id": "FDpLA", "text": "169.3 pm", "image": null, "isCorrect": true}, {"id": "ybb0X", "text": "211.6 pm", "image": null, "isCorrect": false}, {"id": "mYSHP", "text": "380.8 pm", "image": null, "isCorrect": false}, {"id": "JVMa4", "text": "413.2 pm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The radius of the $n$-th Bohr orbit for a hydrogen-like species is given by the formula:<br><br>$r_n = 52.9 \\times \\dfrac{n^2}{Z} \\text{ pm}$<br><br>For the $\\mathrm{B}^{4+}$ ion, the atomic number $Z = 5$ and the orbit number $n = 4$.<br><br>Substituting these values into the formula:<br><br>$r_4 = 52.9 \\times \\dfrac{4^2}{5} \\text{ pm}$<br><br>$r_4 = 52.9 \\times \\dfrac{16}{5} \\text{ pm}$<br><br>$r_4 = 52.9 \\times 3.2 \\text{ pm}$<br><br>$r_4 = 169.28 \\text{ pm} \\approx 169.3 \\text{ pm}$<br><br>Answer: 169.3 pm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625d0279619d9d8a33ea", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Which of the following compounds has lowest boiling point?", "image": null}, "options": [{"id": "MHnGc", "text": "Chloromethane", "image": null, "isCorrect": false}, {"id": "K9WJy", "text": "Fluoromethane", "image": null, "isCorrect": true}, {"id": "9ZZYE", "text": "Iodomethane", "image": null, "isCorrect": false}, {"id": "zS4oH", "text": "Bromomethane", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a given alkyl group, the boiling point increases with increasing atomic mass of halogen. Hence, boiling point of the given alkyl halides decreases in the order:\n$\\mathrm{CH}_3 \\mathrm{I}>\\mathrm{CH}_3 \\mathrm{Br}>\\mathrm{CH}_3 \\mathrm{Cl}>\\mathrm{CH}_3 \\mathrm{~F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ff0279619d9d8a30f8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Which of the following compounds has highest boiling point?", "image": null}, "options": [{"id": "L9QOI", "text": "Chloromethane", "image": null, "isCorrect": false}, {"id": "qKVQX", "text": "Fluoromethane", "image": null, "isCorrect": false}, {"id": "yB8SA", "text": "Iodomethane", "image": null, "isCorrect": true}, {"id": "PnE2V", "text": "Bromomethane", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molecules with higher molecular mass have higher boiling points.\n\nSo, for given alkyl group $\\left(-\\mathrm{CH}_3\\right)$ boiling point decreases as, $\\mathrm{CH}_3 \\mathrm{I}>\\mathrm{CH}_3 \\mathrm{Br}>\\mathrm{CH}_3 \\mathrm{Cl}>\\mathrm{CH}_3 \\mathrm{~F}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c40279619d9d8a2f2b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "Which of the following compounds has the highest boiling point?", "image": null}, "options": [{"id": "tt7YQ", "text": "Chloromethane", "image": null, "isCorrect": false}, {"id": "rckm0", "text": "Fluoromethane", "image": null, "isCorrect": false}, {"id": "pXfFr", "text": "Iodomethane", "image": null, "isCorrect": true}, {"id": "8DtX2", "text": "Bromomethane", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molecules with higher molecular mass generally have higher boiling points. So, for given alkyl group (here $-\\mathrm{CH}_3$ ) boiling point decreases as, $\\mathrm{RI}>\\mathrm{RBr}>\\mathrm{RCl}>\\mathrm{RF}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260640279619d9d8a241b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "In which of the following salts, the solubility increases appreciably with increase in temperature?", "image": null}, "options": [{"id": "BqXlo", "text": "KBr", "image": null, "isCorrect": true}, {"id": "yv8pU", "text": "NaBr", "image": null, "isCorrect": false}, {"id": "grUwr", "text": "NaCl", "image": null, "isCorrect": false}, {"id": "m3Ppp", "text": "KCl", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The solubility of solid solute depends upon temperature.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/1ezyqpnQ-NysmFTH4AjBTTCjyt8Ly6Ygm_JIGGMvXWo.original.fullsize.png\"><br>\nVariation of solubilities of some ionic solids with temperature\n- Generally, rise in temperature increase the solubility. This is due to expansion of holes or empty spaces in the liquid solvent. Generally, $10^{\\circ} \\mathrm{C}$ rise in temperature, increase the solubility of solids two-fold.\n- Dissolution process may be endothermic or exothermic.\n- The solubility of the substances like $\\mathrm{NaBr}, \\mathrm{NaCl}, \\mathrm{KCl}$, etc. changes slightly with the increase in temperature.\n- The solubility of the salts like $\\mathrm{NaNO}_3, \\mathrm{KNO}_3, \\mathrm{KBr}$, etc. increases appreciable with the increase in temperature.\n- The solubility of $\\mathrm{Na}_2 \\mathrm{SO}_4$ first increase and after $30^{\\circ} \\mathrm{C}$ decreases with the increase in temperature.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fba0279619d9d8a1ec3", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "Which among the following compounds has highest boiling point?", "image": null}, "options": [{"id": "OUEYI", "text": "$\\mathrm{CH}_{3}-\\mathrm{CH}_{2}-\\mathrm{CH}_{2}-\\mathrm{CH}_{2}-\\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "a9CI0", "text": "$\\mathrm{CH}_{3}-\\mathrm{CH}_{2}-\\mathrm{COCH}_{3}$", "image": null, "isCorrect": false}, {"id": "o1mw2", "text": "$\\mathrm{CH}_{3}-\\mathrm{CH}_{2}-\\mathrm{COOH}$", "image": null, "isCorrect": true}, {"id": "bXW1C", "text": "$\\mathrm{CH}_{3}-\\mathrm{CH}_{2}-\\mathrm{CH}_{2}-\\mathrm{CHO}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Carboxylic Acids have extensive amount of H-Bonding in them, that is why they have high boiling points as compare to other functional groups.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f5a0279619d9d8a1bca", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "Which of the following compounds has highest boiling point?", "image": null}, "options": [{"id": "PIFuT", "text": "$\\mathrm{CH}_{3}\\left(\\mathrm{CH}_{2}\\right)_{2} \\mathrm{CH}_{2} \\mathrm{OH}$", "image": null, "isCorrect": true}, {"id": "Ek8Ik", "text": "$\\mathrm{C}_{2} \\mathrm{H}_{5} \\mathrm{CH}\\left(\\mathrm{CH}_{3}\\right)_{2}$", "image": null, "isCorrect": false}, {"id": "52WLq", "text": "$\\mathrm{CH}_{3}\\left(\\mathrm{CH}_{2}\\right)_{2} \\mathrm{CH}_{2} \\mathrm{NH}_{2}$", "image": null, "isCorrect": false}, {"id": "k8lAb", "text": "$\\left(\\mathrm{C}_{2} \\mathrm{H}_{5}\\right)_{2} \\mathrm{NH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Alchohols have higher BP than Amines due to more extensive H-bonding.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f590279619d9d8a1bbf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "Which of the following has highest boiling point?", "image": null}, "options": [{"id": "294gq", "text": "$1 \\%$ urea solution", "image": null, "isCorrect": false}, {"id": "suVHo", "text": "$1 \\%$ sucrose", "image": null, "isCorrect": false}, {"id": "eAI0J", "text": "$1 \\%$ NaCl solution", "image": null, "isCorrect": false}, {"id": "61VOY", "text": "$1 \\% \\mathrm{CaCl}_{2}$ solution", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The elevation in boiling point is given by\n$\\Delta T_{b}=i \\times k_{b} \\times m$\nWest, $\\Delta T_{B}=$ Elevation in boiling point\n$i=$ Van't Voff factor\n$K_{b}=$ molal boiling point constant\n$m=$ molality of solution. (it is same fore\nall, acconding to question)\nTherefore, Elevation in boiling paint is directly proportional to the number of species present in the solution (van't Ueff factor)\n(i) $0.1 \\mathrm{M} \\mathrm{NaCl} \\Rightarrow i=2$, since NaCl is ionic and if will dessociate into $\\mathrm{Na}^{+}$and $\\mathrm{Cl}^{-}$in aqueals solution\n(ii) $0.1 \\mathrm{M}$ suchose $\\Rightarrow$ it will not dissociate in aqueous solution, since it is covalent in nuture.\n(iio) $0.1 \\mathrm{M} q \\mathrm{ucose} \\Rightarrow$ it will not dissociate in aqueous solution, since it is coualent in nature.\n(iv) $0.1 \\mathrm{M}$ urea $\\Rightarrow$ it will not dissociate in aqueous solution, since it is covalent in nature.\nTherefore, Nacl will have highest boiling point because it is ionic and will have highest number of solute particles.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "65a2632b0279619d9d8a3c9a", "title": "Dipole moment", "totalQuestions": 14, "questions": [{"_id": "6abb88d015a9fc0fc8c14736", "type": "singleCorrect", "question": {"text": "Which of the following compounds exhibits the highest boiling point?", "image": null}, "options": [{"id": "Pm7HX", "label": "A", "text": "Propane.", "isCorrect": false, "image": null}, {"id": "embT8", "label": "B", "text": "Dimethyl ether.", "isCorrect": false, "image": null}, {"id": "ht0nd", "label": "C", "text": "Methyl chloride.", "isCorrect": false, "image": null}, {"id": "X2UaF", "label": "D", "text": "Methyl cynide.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The boiling point of a compound depends on the strength of its intermolecular forces.<br><br>Propane ($CH_3CH_2CH_3$) is a non-polar molecule and exhibits only weak London dispersion forces, resulting in the lowest boiling point.<br><br>Dimethyl ether ($CH_3OCH_3$) and methyl chloride ($CH_3Cl$) are polar molecules and exhibit dipole-dipole interactions, giving them higher boiling points than propane.<br><br>Methyl cyanide ($CH_3CN$) is highly polar due to the strongly electronegative nitrogen atom and the $C \\equiv N$ triple bond, which creates a very large dipole moment. This leads to exceptionally strong dipole-dipole interactions between its molecules.<br><br>Therefore, methyl cyanide has the highest boiling point among the given compounds.<br><br>Answer: Methyl cynide.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886f15a9fc0fc8c143af", "type": "singleCorrect", "question": {"text": "Identify the set of molecules which have similar dipole moment from the following.", "image": null}, "options": [{"id": "15crV", "label": "A", "text": "$\\text{H}_2, \\text{CO}_2, \\text{BF}_3, \\text{CCl}_4$", "isCorrect": true, "image": null}, {"id": "zMaCu", "label": "B", "text": "$\\text{H}_2, \\text{CO}_2, \\text{NF}_3, \\text{CH}_4$", "isCorrect": false, "image": null}, {"id": "UxUhO", "label": "C", "text": "$\\text{H}_2, \\text{CO}_2, \\text{NH}_3, \\text{CHCl}_3$", "isCorrect": false, "image": null}, {"id": "TM3hk", "label": "D", "text": "$\\text{HBr}, \\text{CO}_2, \\text{NF}_3, \\text{CHCl}_3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The dipole moment of a molecule depends on its geometry and the polarity of its bonds.<br><br>$\\text{H}_2$ is a homonuclear diatomic molecule, so its dipole moment is zero.<br><br>$\\text{CO}_2$ has a linear geometry ($\\text{O=C=O}$) where the bond dipoles cancel each other out, resulting in a net dipole moment of zero.<br><br>$\\text{BF}_3$ has a symmetrical trigonal planar geometry, so the three $\\text{B-F}$ bond dipoles cancel each other out, giving a net dipole moment of zero.<br><br>$\\text{CCl}_4$ has a symmetrical tetrahedral geometry, so the four $\\text{C-Cl}$ bond dipoles cancel each other out, resulting in a net dipole moment of zero.<br><br>Since all the molecules in the first set ($\\text{H}_2, \\text{CO}_2, \\text{BF}_3, \\text{CCl}_4$) have a net dipole moment of zero, they have similar dipole moments.<br><br>In the other options, molecules like $\\text{NF}_3$, $\\text{NH}_3$, $\\text{CHCl}_3$, and $\\text{HBr}$ have asymmetric geometries or different atoms attached to the central atom, leading to non-zero dipole moments.<br><br>Answer: $\\text{H}_2, \\text{CO}_2, \\text{BF}_3, \\text{CCl}_4$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c58c30a4553e1bdc9e", "type": "singleCorrect", "question": {"text": "Identify a molecule having highest dipole moment from following.", "image": null}, "options": [{"id": "MLUe6", "label": "A", "text": "$\\text{NH}_3$", "isCorrect": false, "image": null}, {"id": "ZFGm8", "label": "B", "text": "$\\text{H}_2\\text{O}$", "isCorrect": true, "image": null}, {"id": "J2UvL", "label": "C", "text": "$\\text{CHCl}_3$", "isCorrect": false, "image": null}, {"id": "7JTwL", "label": "D", "text": "$\\text{BeF}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The dipole moment of a molecule depends on its geometry and the electronegativity difference between its constituent atoms.<br><br>For $\\text{H}_2\\text{O}$, the oxygen atom is highly electronegative and possesses two lone pairs. The molecule has a bent structure, and the bond dipoles along with the lone pair dipoles reinforce each other, resulting in a high dipole moment of approximately $1.85\\text{ D}$.<br><br>For $\\text{NH}_3$, the nitrogen atom has one lone pair and the molecule is trigonal pyramidal. Its dipole moment is approximately $1.47\\text{ D}$.<br><br>For $\\text{CHCl}_3$, the molecule has a tetrahedral geometry but is asymmetric. Its dipole moment is approximately $1.04\\text{ D}$.<br><br>For $\\text{BeF}_2$, the molecule is linear and symmetric. The two $\\text{Be-F}$ bond dipoles are equal and opposite, cancelling each other out and resulting in a dipole moment of $0\\text{ D}$.<br><br>Thus, $\\text{H}_2\\text{O}$ has the highest dipole moment among the given molecules.<br><br>Answer: $\\text{H}_2\\text{O}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3188c30a4553e1be019", "type": "singleCorrect", "question": {"text": "Which of the following order of dipole moment for stated molecules is correct?", "image": null}, "options": [{"id": "GlnPE", "label": "A", "text": "$\\text{BF}_3 > \\text{NF}_3 > \\text{NH}_3$", "isCorrect": false, "image": null}, {"id": "uJuIv", "label": "B", "text": "$\\text{NF}_3 > \\text{BF}_3 > \\text{NH}_3$", "isCorrect": false, "image": null}, {"id": "xLaBQ", "label": "C", "text": "$\\text{NH}_3 > \\text{BF}_3 > \\text{NF}_3$", "isCorrect": false, "image": null}, {"id": "wzWz5", "label": "D", "text": "$\\text{NH}_3 > \\text{NF}_3 > \\text{BF}_3$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "$\\text{BF}_3$ has a symmetrical trigonal planar geometry, so its net dipole moment is zero.<br><br>In $\\text{NH}_3$, the N-H bond dipoles and the lone pair dipole are in the same direction, which add up to give a high dipole moment.<br><br>In $\\text{NF}_3$, the N-F bond dipoles and the lone pair dipole are in opposite directions, which partially cancel each other, resulting in a lower dipole moment than $\\text{NH}_3$.<br><br>Therefore, the correct order of dipole moment is $\\text{NH}_3 > \\text{NF}_3 > \\text{BF}_3$.<br><br>Answer: $\\text{NH}_3 > \\text{NF}_3 > \\text{BF}_3$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbdbf9280d7f9932bfe", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is more polar?", "image": null}, "options": [{"id": "xUVL1", "text": "$\\mathrm{H}_2 \\mathrm{S}$", "image": null, "isCorrect": false}, {"id": "FuInJ", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": true}, {"id": "18nBe", "text": "$\\mathrm{NF}_3$", "image": null, "isCorrect": false}, {"id": "VotTI", "text": "$\\mathrm{CHCl}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The polarity of a molecule is determined by its net dipole moment.<br><br>The dipole moments of the given molecules are approximately:<br>$\\mathrm{H}_2\\mathrm{S} \\approx 0.95$ D<br>$\\mathrm{NH}_3 \\approx 1.47$ D<br>$\\mathrm{NF}_3 \\approx 0.23$ D<br>$\\mathrm{CHCl}_3 \\approx 1.04$ D<br><br>In $\\mathrm{NH}_3$, the orbital dipole due to the lone pair is in the same direction as the resultant dipole moment of the three N-H bonds, leading to a high net dipole moment. In $\\mathrm{NF}_3$, the orbital dipole opposes the resultant of the N-F bonds, resulting in a low dipole moment.<br><br>Thus, $\\mathrm{NH}_3$ has the highest dipole moment and is the most polar among the given options.<br><br>Answer: $\\mathrm{NH}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f90aee93fa0796dd00", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Which of the following molecules has zero dipole moment?", "image": null}, "options": [{"id": "oCadW", "text": "HF", "image": null, "isCorrect": false}, {"id": "i1RDc", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": false}, {"id": "UmRkL", "text": "$\\mathrm{BF}_3$", "image": null, "isCorrect": true}, {"id": "OHI4f", "text": "$\\mathrm{CHCl}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\mathrm{HF}$, there is an electronegativity difference between hydrogen and fluorine, resulting in a non-zero dipole moment.<br><br>In $\\mathrm{NH}_3$, the molecule has a trigonal pyramidal geometry with a lone pair on the nitrogen atom. The bond dipoles and the lone pair dipole do not cancel out, resulting in a net non-zero dipole moment.<br><br>In $\\mathrm{BF}_3$, the molecule has a symmetrical trigonal planar geometry. The three $\\mathrm{B}-\\mathrm{F}$ bonds are identical and arranged at an angle of $120^{\\circ}$ to each other. The vector sum of the three bond dipoles is zero, making the net dipole moment zero.<br><br>In $\\mathrm{CHCl}_3$, the molecule has a tetrahedral geometry but the $\\mathrm{C}-\\mathrm{H}$ and $\\mathrm{C}-\\mathrm{Cl}$ bonds have different polarities. The asymmetry prevents the bond dipoles from cancelling out, resulting in a non-zero dipole moment.<br><br>Answer: $\\mathrm{BF}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213600aee93fa0796d84d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Which from following molecules exhibits lowest dipole moment?", "image": null}, "options": [{"id": "4z4rT", "text": "$\\mathrm{CH}_3 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "KkHQM", "text": "$\\mathrm{CH}_3 \\mathrm{Cl}$", "image": null, "isCorrect": false}, {"id": "5I13M", "text": "$\\quad \\mathrm{CH}_3 \\mathrm{Br}$", "image": null, "isCorrect": false}, {"id": "bAAr8", "text": "$\\quad \\mathrm{CH}_3 \\mathrm{I}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The dipole moment of a molecule is given by the product of the magnitude of partial charge and the internuclear distance ($\\mu = q \\times d$).<br><br>For methyl halides ($\\mathrm{CH}_3\\mathrm{X}$), as we move down the halogen group from $\\mathrm{Cl}$ to $\\mathrm{I}$, the electronegativity of the halogen decreases significantly. This results in a smaller partial charge separation ($q$) between the carbon and halogen atoms.<br><br>Although the bond length ($d$) increases down the group, the decrease in the magnitude of charge ($q$) is more dominant for $\\mathrm{Br}$ and $\\mathrm{I}$.<br><br>The experimental dipole moments of the given molecules are approximately:<br>$\\mathrm{CH}_3\\mathrm{Cl} \\approx 1.87 \\text{ D}$<br>$\\mathrm{CH}_3\\mathrm{F} \\approx 1.85 \\text{ D}$<br>$\\mathrm{CH}_3\\mathrm{Br} \\approx 1.81 \\text{ D}$<br>$\\mathrm{CH}_3\\mathrm{I} \\approx 1.62 \\text{ D}$<br><br>Thus, $\\mathrm{CH}_3\\mathrm{I}$ has the lowest dipole moment.<br><br>Answer: $\\quad \\mathrm{CH}_3 \\mathrm{I}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2612d0279619d9d8a2a6b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "Which among the following statements is NOT correct about dipole moment of $\\mathrm{NH}_3$ and $\\mathrm{NF}_3$ ?", "image": null}, "options": [{"id": "bRAF5", "text": "Fluorine is less electronegative than nitrogen.", "image": null, "isCorrect": true}, {"id": "zLIO7", "text": "The dipole moment of $\\mathrm{NH}_3$ is more than that of $\\mathrm{NF}_3$.", "image": null, "isCorrect": false}, {"id": "TnwP8", "text": "In $\\mathrm{NH}_3$ orbital dipole is in the same direction as that of resultant dipole moment of $\\mathrm{N}-\\mathrm{H}$ bonds.", "image": null, "isCorrect": false}, {"id": "EKCm0", "text": "In $\\mathrm{NF}_3$ orbital dipole is in the opposite direction of the resultant dipole moment of three N-F bonds.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{F}$ is more $\\mathrm{EN}$ than $\\mathrm{N}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260f40279619d9d8a289f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "Which of the following molecules has maximum value of dipole moment?", "image": null}, "options": [{"id": "j3ubS", "text": "$\\mathrm{CH}_3-\\mathrm{Cl}$", "image": null, "isCorrect": false}, {"id": "QCMkN", "text": "$\\mathrm{CH}_3-\\mathrm{O}-\\mathrm{CH}_3$", "image": null, "isCorrect": false}, {"id": "hbD8W", "text": "$\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{CH}_3$", "image": null, "isCorrect": false}, {"id": "QJGP5", "text": "$\\mathrm{CH}_3-\\mathrm{CN}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Theory based.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5 tion": {"text": "Identify the type of intermolecular force present between benzene and ammonia", "image": null}, "options": [{"id": "8pCMK", "text": "Hydrogen bonding", "image": null, "isCorrect": false}, {"id": "4BJfY", "text": "Dipole - dipole interaction", "image": null, "isCorrect": false}, {"id": "v2iA6", "text": "Dipole - induced dipole interaction", "image": null, "isCorrect": true}, {"id": "zy0ia", "text": "Ion- dipole interaction", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260040279619d9d8a2115", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "Which of the following molecules has zero dipole moment?", "image": null}, "options": [{"id": "NNTSj", "text": "$\\mathrm{H}_{2} \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "LRaOV", "text": "$\\mathrm{x}_{2} \\mathrm{H}_{2} \\mathrm{~S}$", "image": null, "isCorrect": false}, {"id": "ADuQU", "text": "$\\mathrm{X}_{3} \\cdot \\mathrm{NF}_{3}$", "image": null, "isCorrect": false}, {"id": "zBrv7", "text": "$\\mathrm{CO}_{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/wotWqtBOoysYa5vj4Yxyz3Y1_YNUO8Kgi7YFtBRIRMg.original.fullsize.png\"><br>\nIn $\\mathrm{CO}_{2}$, the $\\mathrm{C}-\\mathrm{O}$ bond dipoles are equal in magnitude but oriented in opposite directions (at $180^{\\circ}$). Their vector sum is zero, so $\\mathrm{CO}_{2}$ has no net dipole.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f490279619d9d8a1b3e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "Which among the following is NOT a polar molecular solid?", "image": null}, "options": [{"id": "WAbIV", "text": "$\\mathrm{CH}_{4}$", "image": null, "isCorrect": true}, {"id": "m31l5", "text": "$\\mathrm{SO}_{2}$", "image": null, "isCorrect": false}, {"id": "ele3j", "text": "HCl", "image": null, "isCorrect": false}, {"id": "zwc1N", "text": "$\\mathrm{H}_{2} \\mathrm{~S}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Methane has symmetrical tetrahedral structure hence dipole moment is zero. Therefore it is non-polar.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f460279619d9d8a1b27", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "If 'Q' is the magnitude of charge and 'r' is the distance between the centres of positive and negative charges then dipole moment $(\\mu)$ is given by", "image": null}, "options": [{"id": "lDnmh", "text": "$\\mu=\\mathrm{Q}+\\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "Znxnp", "text": "$\\mu=Q \\times r$", "image": null, "isCorrect": true}, {"id": "CWnEY", "text": "$\\mu=\\frac{\\mathrm{Q}}{\\mathrm{r}}$", "image": null, "isCorrect": false}, {"id": "gx9ta", "text": "$\\mu=Q-r$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If ' $Q$ ' is the magnitude of charge and ' $r$ ' is the distance between the centres of positive and negative charges then dipole moment $(\\mu)$ is given by $\\boldsymbol{\\mu}=\\mathbf{Q} \\times \\mathbf{r}$.\nDipole moment $(\\mu)$ is the product of the magnitude of the charge $(Q)$ and the distance between the centres of positive and negative charge (r).\n$\\therefore \\mu=Q \\times r$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 9, "topicId": "65a2632b0279619d9d8a3c9d", "title": "Van Der Waals Forces, Hydrogen Bonding and Metallic Bonding", "totalQuestions": 16, "questions": [{"_id": "6abb884415a9fc0fc8c14212", "type": "singleCorrect", "question": {"text": "Identify the compound having lowest boiling point.", "image": null}, "options": [{"id": "bfldd", "label": "A", "text": "$\\text{H}_2\\text{O}$", "isCorrect": false, "image": null}, {"id": "6lHX4", "label": "B", "text": "$\\text{CH}_2(\\text{OH})\\text{-CH}_2(\\text{OH})$", "isCorrect": false, "image": null}, {"id": "sAjGG", "label": "C", "text": "$\\text{CH}_3 - \\text{O} - \\text{C}_2\\text{H}_5$", "isCorrect": true, "image": null}, {"id": "PAW4g", "label": "D", "text": "$\\text{C}_3\\text{H}_7 - \\text{OH}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Boiling point depends on the strength of intermolecular forces.<br><br>$\\text{H}_2\\text{O}$, $\\text{CH}_2(\\text{OH})\\text{-CH}_2(\\text{OH})$, and $\\text{C}_3\\text{H}_7\\text{-OH}$ contain $-\\text{OH}$ groups, which can form strong intermolecular hydrogen bonds.<br><br>$\\text{CH}_3\\text{-O-C}_2\\text{H}_5$ is an ether and lacks hydrogen attached directly to oxygen. Thus, it cannot form intermolecular hydrogen bonds with itself. Its molecules are held together by weaker dipole-dipole interactions and van der Waals forces.<br><br>Due to the weakest intermolecular forces, $\\text{CH}_3\\text{-O-C}_2\\text{H}_5$ has the lowest boiling point among the given compounds.<br><br>Answer: $\\text{CH}_3 - \\text{O} - \\text{C}_2\\text{H}_5$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884015a9fc0fc8c141f0", "type": "singleCorrect", "question": {"text": "What types of intermolecular forces are present in $\\text{N}_2$ molecules?", "image": null}, "options": [{"id": "RKA0i", "label": "A", "text": "London dispersion forces", "isCorrect": true, "image": null}, {"id": "vQqMb", "label": "B", "text": "Dipole-dipole interactions", "isCorrect": false, "image": null}, {"id": "capO5", "label": "C", "text": "Dipole-induced dipole interactions", "isCorrect": false, "image": null}, {"id": "CUfAl", "label": "D", "text": "Hydrogen bonding", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The $\\text{N}_2$ molecule is a homonuclear diatomic molecule, which means both nitrogen atoms have the same electronegativity.<br><br>As a result, the shared electron pair is equally attracted by both atoms, making the $\\text{N}_2$ molecule completely non-polar with a zero dipole moment.<br><br>Since there is no permanent dipole, dipole-dipole and dipole-induced dipole interactions are absent.<br><br>Hydrogen bonding is also not possible because there are no hydrogen atoms present in the molecule.<br><br>The only intermolecular forces that exist between non-polar molecules like $\\text{N}_2$ are London dispersion forces, which arise due to instantaneous dipole-induced dipole interactions.<br><br>Answer: London dispersion forces", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885015a9fc0fc8c14286", "type": "singleCorrect", "question": {"text": "Which of the following terms is used for presence of H bonding in a molecule itself?", "image": null}, "options": [{"id": "5gk9V", "label": "A", "text": "London dispersion forces.", "isCorrect": false, "image": null}, {"id": "vVqzP", "label": "B", "text": "Ion -dipole interactions", "isCorrect": false, "image": null}, {"id": "C57gf", "label": "C", "text": "intramolecular H bonding", "isCorrect": true, "image": null}, {"id": "D2eYD", "label": "D", "text": "intermolecular H bonding", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Hydrogen bonding that occurs within a single molecule is known as intramolecular hydrogen bonding.<br><br>Hydrogen bonding that occurs between two different molecules is known as intermolecular hydrogen bonding.<br><br>Therefore, the presence of H bonding in a molecule itself is termed intramolecular H bonding.<br><br>Answer: intramolecular H bonding", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30a8c30a4553e1bdf87", "type": "singleCorrect", "question": {"text": "Which is the correct decreasing order of boiling points for different compounds from following ?", "image": null}, "options": [{"id": "jf2LD", "label": "A", "text": "$\\text{CH}_3\\text{Cl} > \\text{CH}_3\\text{Br} > \\text{CH}_2\\text{Br}_2 > \\text{CHBr}_3$", "isCorrect": false, "image": null}, {"id": "Xy4RP", "label": "B", "text": "$\\text{CH}_3\\text{Br} > \\text{CH}_2\\text{Br}_2 > \\text{CHBr}_3 > \\text{CH}_3\\text{Cl}$", "isCorrect": false, "image": null}, {"id": "ucXTY", "label": "C", "text": "$\\text{CH}_2\\text{Br}_2 > \\text{CHBr}_3 > \\text{CH}_3\\text{Br} > \\text{CH}_3\\text{Cl}$", "isCorrect": false, "image": null}, {"id": "SN9WB", "label": "D", "text": "$\\text{CHBr}_3 > \\text{CH}_2\\text{Br}_2 > \\text{CH}_3\\text{Br} > \\text{CH}_3\\text{Cl}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The boiling point of haloalkanes increases with an increase in the molecular mass and the size of the halogen atom due to the stronger van der Waals forces of attraction.<br><br>Comparing the given compounds:<br>$\\text{CH}_3\\text{Cl}$ has one chlorine atom.<br>$\\text{CH}_3\\text{Br}$ has one bromine atom, which is heavier and larger than chlorine.<br>$\\text{CH}_2\\text{Br}_2$ has two bromine atoms.<br>$\\text{CHBr}_3$ has three bromine atoms.<br><br>The molecular mass follows the order: $\\text{CHBr}_3 > \\text{CH}_2\\text{Br}_2 > \\text{CH}_3\\text{Br} > \\text{CH}_3\\text{Cl}$.<br><br>Therefore, the decreasing order of boiling points is $\\text{CHBr}_3 > \\text{CH}_2\\text{Br}_2 > \\text{CH}_3\\text{Br} > \\text{CH}_3\\text{Cl}$.<br><br>Answer: $\\text{CHBr}_3 > \\text{CH}_2\\text{Br}_2 > \\text{CH}_3\\text{Br} > \\text{CH}_3\\text{Cl}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30a8c30a4553e1bdf82", "type": "singleCorrect", "question": {"text": "Which from following gases is least soluble in water under same conditions of temperature and pressure ?", "image": null}, "options": [{"id": "eGTYi", "label": "A", "text": "$\\text{HCl}$", "isCorrect": false, "image": null}, {"id": "zQoev", "label": "B", "text": "$\\text{CO}_2$", "isCorrect": false, "image": null}, {"id": "JI2pe", "label": "C", "text": "$\\text{NH}_3$", "isCorrect": false, "image": null}, {"id": "DpJUa", "label": "D", "text": "$\\text{O}_2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Water is a polar solvent. Gases that are polar, can form hydrogen bonds, or react with water are highly soluble in it.<br><br>$\\text{HCl}$ and $\\text{NH}_3$ are highly soluble due to ionization and hydrogen bonding, respectively.<br><br>$\\text{CO}_2$ is moderately soluble as it reacts with water to form carbonic acid.<br><br>$\\text{O}_2$ is a non-polar gas and interacts with water only through weak dipole-induced dipole forces, making it the least soluble among the given gases.<br><br>Answer: $\\text{O}_2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ef8c30a4553e1bde60", "type": "singleCorrect", "question": {"text": "Which from following gases is least soluble in water at same temperature and pressure ?", "image": null}, "options": [{"id": "s5jUD", "label": "A", "text": "$\\text{NH}_3$", "isCorrect": false, "image": null}, {"id": "6fQu8", "label": "B", "text": "$\\text{CO}_2$", "isCorrect": false, "image": null}, {"id": "4k7EN", "label": "C", "text": "$\\text{HCl}$", "isCorrect": false, "image": null}, {"id": "eOTHO", "label": "D", "text": "$\\text{N}_2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Solubility of a gas in water depends on its ability to interact with water molecules. Water is a polar solvent.<br><br>$\\text{NH}_3$ is highly soluble in water due to its ability to form intermolecular hydrogen bonds with water.<br><br>$\\text{HCl}$ is a polar molecule that ionizes completely in water, making it highly soluble.<br><br>$\\text{CO}_2$ is moderately soluble because it reacts with water to form carbonic acid ($\\text{H}_2\\text{CO}_3$).<br><br>$\\text{N}_2$ is a non-polar diatomic gas that neither reacts with water nor forms hydrogen bonds. Therefore, it has the weakest interaction with water molecules and is the least soluble among the given gases.<br><br>Answer: $\\text{N}_2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bfbbf9280d7f9932e3c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following forces is involved in dinitrogen?", "image": null}, "options": [{"id": "KCyJB", "text": "Dipole - dipole interaction", "image": null, "isCorrect": false}, {"id": "UZaz6", "text": "Dipole - induced dipole interaction", "image": null, "isCorrect": false}, {"id": "2QeGo", "text": "London dispersion force", "image": null, "isCorrect": true}, {"id": "fzk9b", "text": "Hydrogen bonding", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Dinitrogen ($N_2$) is a homonuclear diatomic molecule. Since both atoms have the same electronegativity, the molecule is non-polar and has no permanent dipole moment.<br><br>The only intermolecular forces that exist between non-polar molecules are London dispersion forces (also known as induced dipole - induced dipole interactions).<br><br>Dipole-dipole interactions require permanent dipoles, dipole-induced dipole interactions require at least one polar molecule, and hydrogen bonding requires a hydrogen atom bonded to a highly electronegative atom (F, O, or N). None of these apply to $N_2$.<br><br>Answer: London dispersion force", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bedbf9280d7f9932db8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from the following molecules does not develop intermolecular hydrogen bonding?", "image": null}, "options": [{"id": "XTXc5", "text": "$\\mathrm{Br}_2$", "image": null, "isCorrect": true}, {"id": "WbPCH", "text": "$\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "P25nY", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": false}, {"id": "lFGsm", "text": "HF", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Hydrogen bonding is a special type of dipole-dipole interaction that occurs when a hydrogen atom is covalently bonded to a highly electronegative atom such as fluorine (F), oxygen (O), or nitrogen (N).<br><br>In $\\mathrm{H}_2 \\mathrm{O}$, $\\mathrm{NH}_3$, and HF, the hydrogen atom is bonded to O, N, and F respectively, allowing them to form intermolecular hydrogen bonds.<br><br>$\\mathrm{Br}_2$ is a non-polar molecule and does not contain any hydrogen atoms. Therefore, it cannot form hydrogen bonds. The only intermolecular forces present in $\\mathrm{Br}_2$ are weak London dispersion forces.<br><br>Answer: $\\mathrm{Br}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be0bf9280d7f9932d34", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The attractive interactions between cations and mobile electrons in metallic solid is called", "image": null}, "options": [{"id": "Q9w3p", "text": "ionic bond", "image": null, "isCorrect": false}, {"id": "5WIXa", "text": "covalent bond", "image": null, "isCorrect": false}, {"id": "eVzuG", "text": "weak dipole-dipole interactions", "image": null, "isCorrect": false}, {"id": "sL6uG", "text": "metallic bond", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In a metallic solid, the constituent particles are positive ions (cations) immersed in a sea of delocalized, mobile electrons.<br><br>The electrostatic force of attraction between these positively charged metal ions and the mobile electrons is known as a metallic bond.<br><br>Answer: metallic bond", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214450aee93fa0796df56", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Which of the following molecule can form hydrogen bonding with itself?", "image": null}, "options": [{"id": "R7DTg", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": true}, {"id": "Dzp7u", "text": "$\\mathrm{C}_2 \\mathrm{H}_6$", "image": null, "isCorrect": false}, {"id": "k6zEF", "text": "$\\mathrm{H}_2 \\mathrm{~S}$", "image": null, "isCorrect": false}, {"id": "z7IDH", "text": "$\\mathrm{CH}_3-\\mathrm{O}-\\mathrm{CH}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Hydrogen bonding is a special type of dipole-dipole interaction that occurs when a hydrogen atom is covalently bonded to a highly electronegative atom such as fluorine, oxygen, or nitrogen (F, O, N).<br><br>In $\\mathrm{NH}_3$, the hydrogen atoms are directly bonded to the highly electronegative nitrogen atom, which also possesses a lone pair of electrons. This allows $\\mathrm{NH}_3$ molecules to form intermolecular hydrogen bonds with each other.<br><br>In $\\mathrm{C}_2 \\mathrm{H}_6$ and $\\mathrm{H}_2 \\mathrm{S}$, the hydrogen atoms are bonded to carbon and sulfur respectively, which are not sufficiently electronegative to form hydrogen bonds.<br><br>In $\\mathrm{CH}_3-\\mathrm{O}-\\mathrm{CH}_3$ (dimethyl ether), there are no hydrogen atoms directly bonded to the oxygen atom, so it cannot act as a hydrogen bond donor to form hydrogen bonds with itself.<br><br>Therefore, only $\\mathrm{NH}_3$ can form hydrogen bonding with itself.<br><br>Answer: $\\mathrm{NH}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262360279619d9d8a32b5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Which of the following compounds does NOT develop intermolecular hydrogen bonding?", "image": null}, "options": [{"id": "fU9po", "text": "Cyclohexylamine", "image": null, "isCorrect": false}, {"id": "n7RCC", "text": "Allylamine", "image": null, "isCorrect": false}, {"id": "ythAb", "text": "Trimethylamine", "image": null, "isCorrect": true}, {"id": "TswCu", "text": "Diphenylamine", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Trimethylamine, $\\mathrm{N}\\left(\\mathrm{CH}_3\\right)$ does not contain $\\mathrm{N}-\\mathrm{H}$ bond and hence it does not develop intermolecular hydrogen bonding.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262240279619d9d8a3220", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Which of the following molecules shows intramolecular hydrogen bonding?", "image": null}, "options": [{"id": "pz7L2", "text": "Benzoic acid", "image": null, "isCorrect": false}, {"id": "t7EjZ", "text": "Salicylaldehyde", "image": null, "isCorrect": true}, {"id": "ilz0g", "text": "Benzaldehyde", "image": null, "isCorrect": false}, {"id": "kRhwF", "text": "Phenol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Intramolecular hydrogen bonding takes place when five membered or six membered rings are formed.</p><p>Benzoic acid, benzaldehyde and&nbsp;phenol does not have&nbsp;this property and that is why&nbsp;they cannot form intramolecular hydrogen bonds. But by the structure of salicylaldehyde, it can be said that, it can form intramolecular hydrogen bonds as shown below:</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/6c09bbf3-fcbf-4061-8f5d-79fdd7a25d72-z1.png\" style=\"width: 37 (10 Aug Shift 1)"}], "question": {"text": "Which of the following molecules has intramolecular hydrogen bonding?", "image": null}, "options": [{"id": "o9PUh", "text": "Ammonia", "image": null, "isCorrect": false}, {"id": "qf36f", "text": "Hydrogen fluoride", "image": null, "isCorrect": false}, {"id": "TNNfN", "text": "Water", "image": null, "isCorrect": false}, {"id": "L2YgE", "text": "Ethylene glycol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/bPJI4MR9w2vKBKImBJYSdBout4mjCe8vSdwjPLY-J2c.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fcc0279619d9d8a1f58", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "In which of the following compounds intra molecular hydrogen bonding is present?", "image": null}, "options": [{"id": "Ju5BB", "text": "ethanol", "image": null, "isCorrect": false}, {"id": "2EGx0", "text": "o-nitrophenol", "image": null, "isCorrect": true}, {"id": "jf9jd", "text": "water", "image": null, "isCorrect": false}, {"id": "m0YKa", "text": "ammonia", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "o-nitrophenol\nIn o-nitro phenol, there is intramolecular hydrogen bonding between the hydrogen of the - $\\mathrm{OH}$ group and the oxygen of the $\\mathrm{NO}_{2}$ group, resulting in a lower boiling point.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/cV5VvvhyROSASBN2lOM-1O-s4BUWLlkOTTMMG72NbO8.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fbc0279619d9d8a1ed2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "What type of inter molecular force is present between magnesium chloride and water?", "image": null}, "options": [{"id": "UyOBn", "text": "Dipole-dipole interaction", "image": null, "isCorrect": false}, {"id": "mgQlG", "text": "Ion-dipole interaction", "image": null, "isCorrect": true}, {"id": "zzP7H", "text": "Dipole-induced dipole interaction", "image": null, "isCorrect": false}, {"id": "Ku5jw", "text": "Hydrogen bonding", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ion-dipole interaction\nBetween magnesium chloride and water, there is an ion-dipole interaction. This contact is caused by polar water molecules interacting with a magnesium ion. The water molecule's oxygen atom contains a tiny negative charge, which attracts the positively charged magnesium ion. These are substantially weaker forces than covalent or ionic bonding.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
