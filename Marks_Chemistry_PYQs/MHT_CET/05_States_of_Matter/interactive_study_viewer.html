2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "A cold drink bottle contains <math><mn>200</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">L</mi></math> liquid in which <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is <math><mn>0.1</mn></math> molar <math><mo>.</mo></math> Considering <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> as an ideal gas the volume of the dissolved <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> at S.T.P is", "image": null}, "options": [{"id": "cIa2r", "text": "<math><mn>22.4</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">L</mi></math>", "image": null, "isCorrect": false}, {"id": "pXInx", "text": "<math><mn>0.224</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">L</mi></math>", "image": null, "isCorrect": false}, {"id": "Pgbao", "text": "<math><mn>2.24</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">L</mi></math>", "image": null, "isCorrect": false}, {"id": "I4mUi", "text": "<math><mn>0.448</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">L</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Moles of <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> dissolved <math><mo>=</mo><mi mathvariant=\"normal\">M</mi><mo>×</mo><mi mathvariant=\"normal\">V</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">L</mi></mrow></mfenced></math>  <br/><math><mo>=</mo><mn>0.1</mn><mo>×</mo><mfrac><mrow><mn>200</mn></mrow><mrow><mn>1000</mn></mrow></mfrac></math>  <br/><math><mo>=</mo><mn>0.02</mn></math>  <br/>Volume of <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> at STP <math><mo>=</mo><mn>0.02</mn><mo>×</mo><mn>22.4</mn><mi mathvariant=\"normal\">L</mi></math>  <br/><math><mo>=</mo><mn>0.448</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">L</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eb30279619d9d8a168e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "The relation between solubility of a gas in liquid at constant temperature and external pressure is stated by which law?", "image": null}, "options": [{"id": "Yffc5", "text": "Raoult's law", "image": null, "isCorrect": false}, {"id": "196Pe", "text": "Boyle's law", "image": null, "isCorrect": false}, {"id": "I53J6", "text": "Charles's law", "image": null, "isCorrect": false}, {"id": "eRWDG", "text": "Henry's law", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Henry's law states the relation between solubility of gas in liquid at constant temperature and external pressure.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263480279619d9d8a3dcb", "title": "Mixture of gases", "totalQuestions": 17, "questions": [{"_id": "6a44d2a88c30a4553e1bdb6c", "type": "singleCorrect", "question": {"text": "A mixture of 0.5 mol $\\text{N}_2$ gas, 1.0 mol $\\text{O}_2$ gas and 1.5 mol $\\text{H}_2$ gas exerts a total pressure of 18 bar. Find the partial pressure of $\\text{O}_{2(g)}$.", "image": null}, "options": [{"id": "HQzGY", "label": "A", "text": "$4.0$ bar", "isCorrect": false, "image": null}, {"id": "mlDWX", "label": "B", "text": "$6.0$ bar", "isCorrect": true, "image": null}, {"id": "wF2Nn", "label": "C", "text": "$8.0$ bar", "isCorrect": false, "image": null}, {"id": "lJHi7", "label": "D", "text": "$10.0$ bar", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Total number of moles in the mixture is:<br><br>$n_{total} = n_{N_2} + n_{O_2} + n_{H_2}$<br><br>$n_{total} = 0.5 + 1.0 + 1.5 = 3.0$ mol<br><br>Mole fraction of $\\text{O}_2$ is:<br><br>$x_{O_2} = \\dfrac{n_{O_2}}{n_{total}} = \\dfrac{1.0}{3.0} = \\dfrac{1}{3}$<br><br>According to Dalton's law of partial pressures, the partial pressure of $\\text{O}_2$ is:<br><br>$P_{O_2} = x_{O_2} \\times P_{total}$<br><br>$P_{O_2} = \\dfrac{1}{3} \\times 18 = 6.0$ bar<br><br>Answer: $6.0$ bar", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f18c30a4553e1bde7e", "type": "singleCorrect", "question": {"text": "A container contains mixture of He and Ne gases at certain temperature. He is 20 % by mass of mixture. What is the ratio of partial pressure of Helium to Neon ?", "image": null}, "options": [{"id": "2RkZr", "label": "A", "text": "$1:2$", "isCorrect": false, "image": null}, {"id": "AGTQL", "label": "B", "text": "$2:1$", "isCorrect": false, "image": null}, {"id": "TmQMF", "label": "C", "text": "$5:4$", "isCorrect": true, "image": null}, {"id": "8NQT8", "label": "D", "text": "$3:2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the total mass of the mixture be $100$ g.<br><br>Mass of He $= 20$ g<br><br>Mass of Ne $= 80$ g<br><br>Molar mass of He $= 4$ g/mol<br><br>Molar mass of Ne $= 20$ g/mol<br><br>Number of moles of He, $n_{\\text{He}} = \\dfrac{20}{4} = 5$<br><br>Number of moles of Ne, $n_{\\text{Ne}} = \\dfrac{80}{20} = 4$<br><br>According to Dalton's law of partial pressures, the ratio of partial pressures is equal to the ratio of number of moles.<br><br>$\\dfrac{P_{\\text{He}}}{P_{\\text{Ne}}} = \\dfrac{n_{\\text{He}}}{n_{\\text{Ne}}} = \\dfrac{5}{4}$<br><br>Answer: $5:4$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32a8c30a4553e1be0dc", "type": "singleCorrect", "question": {"text": "What ratio by mass of 'Ne' and $\\text{CH}_4$ should be mixed so that partial pressure exerted by each gas is same?", "image": null}, "options": [{"id": "RLMDi", "label": "A", "text": "$1:1$", "isCorrect": false, "image": null}, {"id": "JCLgH", "label": "B", "text": "$2:1$", "isCorrect": false, "image": null}, {"id": "GnrCW", "label": "C", "text": "$2:3$", "isCorrect": false, "image": null}, {"id": "IfHSQ", "label": "D", "text": "$5:4$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the mass of Ne be $w_1$ and the mass of $\\text{CH}_4$ be $w_2$.<br><br>Molar mass of Ne $= 20 \\text{ g/mol}$<br>Molar mass of $\\text{CH}_4 = 16 \\text{ g/mol}$<br><br>Number of moles of Ne, $n_{\\text{Ne}} = \\dfrac{w_1}{20}$<br>Number of moles of $\\text{CH}_4$, $n_{\\text{CH}_4} = \\dfrac{w_2}{16}$<br><br>According to Dalton's law of partial pressures, the partial pressure of a gas in a mixture is directly proportional to its number of moles. Since the partial pressures of both gases are equal, their number of moles must be equal.<br><br>$n_{\\text{Ne}} = n_{\\text{CH}_4}$<br><br>$\\dfrac{w_1}{20} = \\dfrac{w_2}{16}$<br><br>$\\dfrac{w_1}{w_2} = \\dfrac{20}{16} = \\dfrac{5}{4}$<br><br>The required ratio by mass is $5:4$.<br><br>Answer: $5:4$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bddbf9280d7f9932d1b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A container consists mixture of four gases as $5 \\mathrm{~g~} \\mathrm{H}_2, 8 \\mathrm{~g~} \\mathrm{He}, 50 \\mathrm{~g~} \\mathrm{CO}_2$ and 20 g Ne at a certain temperature. Which of the following gases exerts minimum partial pressure?", "image": null}, "options": [{"id": "ViFez", "text": "$\\mathrm{H}_2$", "image": null, "isCorrect": false}, {"id": "asbqD", "text": "He", "image": null, "isCorrect": false}, {"id": "02LGl", "text": "$\\mathrm{CO}_2$", "image": null, "isCorrect": false}, {"id": "QSFrG", "text": "Ne", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Partial pressure of a gas in a mixture is directly proportional to its number of moles ($P_i \\propto n_i$).<br><br>Number of moles of $\\text{H}_2 = \\dfrac{5}{2} = 2.5 \\text{ mol}$<br><br>Number of moles of $\\text{He} = \\dfrac{8}{4} = 2.0 \\text{ mol}$<br><br>Number of moles of $\\text{CO}_2 = \\dfrac{50}{44} = 1.136 \\text{ mol}$<br><br>Number of moles of $\\text{Ne} = \\dfrac{20}{20} = 1.0 \\text{ mol}$<br><br>Since Ne has the minimum number of moles, it exerts the minimum partial pressure.<br><br>Answer: Ne", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bccbf9280d7f9932c84", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Equal masses of helium and oxygen are mixed in an empty container at $25^{\\circ} \\mathrm{C}$. What is the fraction of the total pressure exerted by helium?", "image": null}, "options": [{"id": "oCexk", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "YzNQ7", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "t1ihc", "text": "$\\frac{8}{9}$", "image": null, "isCorrect": true}, {"id": "vWlyK", "text": "$\\frac{7}{9}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the mass of helium and oxygen be $m$.<br><br>Molar mass of helium, $M_{\\mathrm{He}} = 4 \\mathrm{~g/mol}$<br><br>Molar mass of oxygen, $M_{\\mathrm{O}_2} = 32 \\mathrm{~g/mol}$<br><br>Number of moles of helium, $n_{\\mathrm{He}} = \\dfrac{m}{4}$<br><br>Number of moles of oxygen, $n_{\\mathrm{O}_2} = \\dfrac{m}{32}$<br><br>Total number of moles, $n_{\\mathrm{total}} = n_{\\mathrm{He}} + n_{\\mathrm{O}_2} = \\dfrac{m}{4} + \\dfrac{m}{32} = \\dfrac{9m}{32}$<br><br>According to Dalton's law of partial pressures, the fraction of total pressure exerted by a gas is equal to its mole fraction.<br><br>Fraction of pressure exerted by helium $= \\dfrac{n_{\\mathrm{He}}}{n_{\\mathrm{total}}} = \\dfrac{\\dfrac{m}{4}}{\\dfrac{9m}{32}} = \\dfrac{32}{36} = \\dfrac{8}{9}$<br><br>Answer: $\\frac{8}{9}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbabf9280d7f9932bec", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A container contains $4 \\mathrm{~g}$ $\\mathrm{H}_2, 4 \\mathrm{~g}$ $\\mathrm{He}$ and certain amount of ' Ne ' at a certain temperature. What is the mass of 'Ne' required so that the partial pressure exerted by ' Ne ' is equal to the partial pressure of He ?", "image": null}, "options": [{"id": "7ML2W", "text": "4 g", "image": null, "isCorrect": false}, {"id": "MpdUx", "text": "8 g", "image": null, "isCorrect": false}, {"id": "PTCNn", "text": "10 g", "image": null, "isCorrect": false}, {"id": "qdFU1", "text": "20 g", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Dalton's law of partial pressures, the partial pressure of a gas in a mixture is directly proportional to its number of moles.<br><br>Given that the partial pressure of Ne is equal to the partial pressure of He:<br><br>$P_{\\text{Ne}} = P_{\\text{He}}$<br><br>$\\dfrac{n_{\\text{Ne}} RT}{V} = \\dfrac{n_{\\text{He}} RT}{V}$<br><br>$n_{\\text{Ne}} = n_{\\text{He}}$<br><br>Number of moles of He is given by:<br><br>$n_{\\text{He}} = \\dfrac{\\text{Mass of He}}{\\text{Molar mass of He}} = \\dfrac{4}{4} = 1 \\text{ mol}$<br><br>Therefore, the number of moles of Ne required is also $1 \\text{ mol}$.<br><br>Mass of Ne = $n_{\\text{Ne}} \\times \\text{Molar mass of Ne}$<br><br>Mass of Ne = $1 \\times 20 = 20 \\text{ g}$<br><br>Answer: 20 g", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9bbf9280d7f9932ace", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A container contains equal masses of $\\mathrm{H}_2, \\mathrm{He}, \\mathrm{CO}_2$ and Ne at a certain temperature. Which of the following gases exerts minimum partial pressure?", "image": null}, "options": [{"id": "IceK0", "text": "$\\mathrm{H}_2$", "image": null, "isCorrect": false}, {"id": "HJTlz", "text": "He", "image": null, "isCorrect": false}, {"id": "Q8RYY", "text": "$\\mathrm{CO}_2$", "image": null, "isCorrect": true}, {"id": "YbgQ7", "text": "Ne", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the mass of each gas be $m$.<br><br>The number of moles of a gas is given by $n = \\dfrac{m}{M}$, where $M$ is the molar mass.<br><br>The molar masses of the given gases are:<br>$M(\\mathrm{H}_2) = 2 \\text{ g/mol}$<br>$M(\\mathrm{He}) = 4 \\text{ g/mol}$<br>$M(\\mathrm{Ne}) = 20 \\text{ g/mol}$<br>$M(\\mathrm{CO}_2) = 44 \\text{ g/mol}$<br><br>Since $\\mathrm{CO}_2$ has the highest molar mass, it will have the minimum number of moles for a given mass.<br><br>According to Dalton's law of partial pressures, the partial pressure of a gas is directly proportional to its number of moles ($P \\propto n$).<br><br>Therefore, $\\mathrm{CO}_2$ exerts the minimum partial pressure.<br><br>Answer: $\\mathrm{CO}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8bbf9280d7f9932a3e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A container contains equal masses of $\\mathrm{H}_2, \\mathrm{He}, \\mathrm{CO}_2$ and Ne at a certain temperature. Which of the following gas exerts maximum partial pressure?", "image": null}, "options": [{"id": "etnfV", "text": "$\\mathrm{H}_2$", "image": null, "isCorrect": true}, {"id": "xbTkI", "text": "He", "image": null, "isCorrect": false}, {"id": "cLPyq", "text": "$\\mathrm{CO}_2$", "image": null, "isCorrect": false}, {"id": "jR4oV", "text": "Ne", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the mass of each gas be $m$.<br><br>The number of moles of a gas is given by $n = \\dfrac{m}{M}$, where $M$ is the molar mass.<br><br>The partial pressure of a gas is $P = \\dfrac{nRT}{V}$. Since $R, T,$ and $V$ are constant for all gases in the container, the partial pressure is directly proportional to the number of moles, $P \\propto n \\propto \\dfrac{1}{M}$.<br><br>The gas with the minimum molar mass will have the maximum number of moles and exert the maximum partial pressure.<br><br>Molar masses of the given gases are:<br>$M(\\mathrm{H}_2) = 2 \\text{ g/mol}$<br>$M(\\mathrm{He}) = 4 \\text{ g/mol}$<br>$M(\\mathrm{Ne}) = 20 \\text{ g/mol}$<br>$M(\\mathrm{CO}_2) = 44 \\text{ g/mol}$<br><br>Since $\\mathrm{H}_2$ has the minimum molar mass, it has the maximum number of moles and exerts the maximum partial pressure.<br><br>Answer: $\\mathrm{H}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b49bf9280d7f99327e2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the SI unit of rate of diffusion for a gas?", "image": null}, "options": [{"id": "fOlyP", "text": "$\\mathrm{dm}^{-3} \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "U8RK3", "text": "$\\mathrm{dm}^3 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "hKkLp", "text": "$\\mathrm{mL}^{-1} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "eAUQs", "text": "mL s", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate of diffusion of a gas is defined as the volume of the gas that diffuses per unit time.<br><br>$\\text{Rate of diffusion} = \\dfrac{\\text{Volume of gas diffused}}{\\text{Time taken}}$<br><br>The standard unit of volume is $\\mathrm{m}^3$ (or $\\mathrm{dm}^3$, $\\mathrm{cm}^3$) and the SI unit of time is second ($\\mathrm{s}$).<br><br>Among the given options, the correct unit for the rate of diffusion is $\\mathrm{dm}^3 \\mathrm{~s}^{-1}$.<br><br>Answer: $\\mathrm{dm}^3 \\mathrm{~s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b38bf9280d7f993273c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A container consisting mixture of $28 \\mathrm{~g} \\mathrm{~N}_2, 8 \\mathrm{~g~} \\mathrm{He}$ and 40 g Ne at $25^{\\circ} \\mathrm{C}$. If the total pressure exerted by the gaseous mixture is 20 bar, What is the partial pressure exerted by $\\mathrm{N}_2$ ?", "image": null}, "options": [{"id": "HARRC", "text": "2 bar", "image": null, "isCorrect": false}, {"id": "V2wgq", "text": "4 bar", "image": null, "isCorrect": true}, {"id": "8WVSM", "text": "5 bar", "image": null, "isCorrect": false}, {"id": "L35Pj", "text": "8 bar", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Number of moles of $N_2$, $n_{N_2} = \\dfrac{28}{28} = 1$ mol<br><br>Number of moles of $He$, $n_{He} = \\dfrac{8}{4} = 2$ mol<br><br>Number of moles of $Ne$, $n_{Ne} = \\dfrac{40}{20} = 2$ mol<br><br>Total number of moles, $n_{total} = 1 + 2 + 2 = 5$ mol<br><br>Mole fraction of $N_2$, $x_{N_2} = \\dfrac{n_{N_2}}{n_{total}} = \\dfrac{1}{5}$<br><br>Partial pressure of $N_2$, $P_{N_2} = x_{N_2} \\times P_{total}$<br><br>$P_{N_2} = \\dfrac{1}{5} \\times 20 = 4$ bar<br><br>Answer: 4 bar", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140c0aee93fa0796dd8f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Calculate the partial pressure exerted by dioxygen from a mixture of $32 \\mathrm{~g} \\mathrm{O}_2, 80 \\mathrm{~g} \\cdot \\mathrm{Ar}$ (mol.mass 40) and 4 g dihydrogen( $\\mathrm{P}_{\\text {total }}=10 \\mathrm{bar}$ ).", "image": null}, "options": [{"id": "FYFOb", "text": "1 bar", "image": null, "isCorrect": false}, {"id": "dieDn", "text": "2 bar", "image": null, "isCorrect": true}, {"id": "pPa1v", "text": "4 bar", "image": null, "isCorrect": false}, {"id": "VZfIv", "text": "5 bar", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Number of moles of $O_2 = \\dfrac{32}{32} = 1$ mol<br><br>Number of moles of $Ar = \\dfrac{80}{40} = 2$ mol<br><br>Number of moles of $H_2 = \\dfrac{4}{2} = 2$ mol<br><br>Total number of moles $= 1 + 2 + 2 = 5$ mol<br><br>Mole fraction of $O_2 = \\dfrac{1}{5}$<br><br>Partial pressure of $O_2 = \\text{Mole fraction of } O_2 \\times P_{\\text{total}}$<br><br>$P_{O_2} = \\dfrac{1}{5} \\times 10 = 2$ bar<br><br>Answer: 2 bar", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213270aee93fa0796d691", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Which from following gases of same mass and volume exerts highest pressure at constant temperature?", "image": null}, "options": [{"id": "QWSBm", "text": "$\\mathrm{N}_2$", "image": null, "isCorrect": false}, {"id": "8kaz3", "text": "$\\mathrm{O}_2$", "image": null, "isCorrect": false}, {"id": "Awu5N", "text": "$\\mathrm{Cl}_2$", "image": null, "isCorrect": false}, {"id": "v1VYc", "text": "$\\mathrm{H}_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to the ideal gas equation, $PV = nRT$.<br><br>The number of moles is given by $n = \\dfrac{m}{M}$, where $m$ is the given mass and $M$ is the molar mass of the gas.<br><br>Substituting this into the ideal gas equation gives $P = \\dfrac{mRT}{MV}$.<br><br>Since mass $m$, volume $V$, and temperature $T$ are constant for all the gases, the pressure $P$ is inversely proportional to the molar mass $M$ ($P \\propto \\dfrac{1}{M}$).<br><br>The molar masses of the given gases are:<br>$\\mathrm{H}_2 = 2 \\text{ g/mol}$<br>$\\mathrm{N}_2 = 28 \\text{ g/mol}$<br>$\\mathrm{O}_2 = 32 \\text{ g/mol}$<br>$\\mathrm{Cl}_2 = 71 \\text{ g/mol}$<br><br>Since $\\mathrm{H}_2$ has the lowest molar mass, it will have the highest number of moles for a given mass, and therefore it will exert the highest pressure.<br><br>Answer: $\\mathrm{H}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262800279619d9d8a350c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "A neon-dioxygen mixture contains $64 \\mathrm{~g} \\mathrm{O}_2$ and $160 \\mathrm{~g} \\mathrm{Ne}$. If the total pressure is $25 \\mathrm{bar}$, calculate the partial pressure of dioxygen.", "image": null}, "options": [{"id": "mTN0e", "text": "5 bar", "image": null, "isCorrect": true}, {"id": "rOIYL", "text": "7.5 bar", "image": null, "isCorrect": false}, {"id": "N5KzT", "text": "10 bar", "image": null, "isCorrect": false}, {"id": "yDDvb", "text": "20 bar", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{n}_{\\mathrm{O}_2}=\\frac{64}{32}=2 \\mathrm{~mol} ; \\mathrm{n}_{\\mathrm{N}_{\\mathrm{e}}}=\\frac{160}{20}=8 \\mathrm{~mol} \\\\ & x_{\\mathrm{O}_2}=\\frac{\\mathrm{n}_{\\mathrm{O}_2}}{\\mathrm{n}_{\\text {Total }}}=\\frac{2}{2+8}=\\frac{2}{10}=0.2 \\\\ & \\mathrm{P}_{\\mathrm{O}_2}=x_{\\mathrm{O}_2} \\times \\mathrm{P}_{\\text {Total }}=0.2 \\times 25=5 \\mathrm{bar}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625a0279619d9d8a33d3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "A closed container contains mixture of non-reacting gases A and B. Partial pressure of $A$ and $B$ are 4.5 bar and 5.5 . bar respectively. Find mole fraction of $\\mathrm{A}$ and $\\mathrm{B}$ respectively.", "image": null}, "options": [{"id": "l5KGI", "text": "0.035 and 0.065", "image": null, "isCorrect": false}, {"id": "ArZ0Q", "text": "0.055 and 0.045", "image": null, "isCorrect": false}, {"id": "PcDGz", "text": "0.45 and 0.55", "image": null, "isCorrect": true}, {"id": "ZapAH", "text": "0.55 and 0.45", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{P}_{\\text {Total }}=\\mathrm{P}_{\\mathrm{A}}+\\mathrm{P}_{\\mathrm{B}} & =4.5+5.5 \\\\ & =10.0 \\mathrm{bar}\\end{aligned}$\n$\\mathrm{P}_{\\mathrm{A}}=x_{\\mathrm{A}} \\times \\mathrm{P}_{\\text {Total }}$\n$x_{\\mathrm{A}}=\\frac{\\mathrm{P}_{\\mathrm{A}}}{\\mathrm{P}_{\\text {Total }}}=\\frac{4.5}{10}=0.45$\n$x_{\\mathrm{B}}=\\frac{\\mathrm{P}_{\\mathrm{B}}}{\\mathrm{P}_{\\text {Total }}}=\\frac{5.5}{10}=0.55$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262380279619d9d8a32c0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "The partial vapour pressure of any volatile component of a solution is equal to the vapour pressure of the pure component multiplied by its mole fraction in the solution is called", "image": null}, "options": [{"id": "W27Rr", "text": "Dalton's law", "image": null, "isCorrect": false}, {"id": "xgrlv", "text": "Avogadro's law", "image": null, "isCorrect": false}, {"id": "YenGL", "text": "Raoult's law", "image": null, "isCorrect": true}, {"id": "W9gbw", "text": "Henry's law", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std. $12 \\mid$ Ch-2 $\\mid$ Subtopic-2.5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262360279619d9d8a32b0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Equal masses of $\\mathrm{H}_{2(\\mathrm{~g})}$ and $\\mathrm{He}_{(\\mathrm{g})}$ are enclosed in a container at constant temperature. The ratio of partial pressure of $\\mathrm{H}_2$ to $\\mathrm{He}$ is", "image": null}, "options": [{"id": "I9Ppg", "text": "$1: 1$", "image": null, "isCorrect": false}, {"id": "fey3D", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "tixpW", "text": "$2: 1$", "image": null, "isCorrect": true}, {"id": "UbPbo", "text": "$1: 4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the mass be ' $x$ '.\n$$\n\\mathrm{n}_{\\mathrm{H}_2}=\\frac{\\mathrm{xg}}{2 \\mathrm{~g} \\mathrm{~mol}^{-1}}=\\frac{\\mathrm{x}}{2}\n$$\n$$\n\\begin{aligned}\n& \\mathrm{n}_{\\mathrm{He}}=\\frac{\\mathrm{xg}}{4 \\mathrm{~g} \\mathrm{~mol}^{-1}}=\\frac{\\mathrm{x}}{4} \\\\\n& \\mathrm{n}_{\\text {Total }}=\\frac{3 \\mathrm{x}}{4}\n\\end{aligned}\n$$\n\nNow,\n$$\n\\begin{aligned}\n& x_{\\mathrm{H}_2}=\\frac{\\mathrm{n}}{\\mathrm{n}_{\\text {Total }}}=\\frac{\\mathrm{x} / 2}{3 \\mathrm{x} / 4}=\\frac{2}{3} \\\\\n& x_{\\mathrm{H}_e}=\\frac{\\mathrm{n}}{\\mathrm{n}_{\\text {Total }}}=\\frac{\\mathrm{x} / 4}{3 \\mathrm{x} / 4}=\\frac{1}{3}\n\\end{aligned}\n$$\n\nNow,\n$$\n\\begin{gathered}\n\\mathrm{P}_{\\mathrm{H}_2}=x_{\\mathrm{H}_2} \\times \\mathrm{P}_{\\text {Tótal }}=\\frac{2}{3} \\times \\mathrm{P} \\\\\n\\mathrm{P}_{\\mathrm{He}}=x_{\\mathrm{He}} \\times \\mathrm{P}_{\\text {Total }}=\\frac{1}{3} \\times \\mathrm{P} \\\\\n\\mathrm{P}_{\\mathrm{H}_2}: \\mathrm{P}_{\\mathrm{H}_{\\mathrm{e}}}=\\frac{2 / 3 \\mathrm{P}}{1 / 3 \\mathrm{P}}=2: 1\n\\end{gathered}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261500279619d9d8a2b8a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "If the mixture of $7 g$ of $N_2$ and $8 g$ of $\\mathrm{Ar}$ in a cylinder has the total pressure $27 \\mathrm{bar}$. What is the partial pressure of $N_2$ ?\n(Atomic mass of $N=14 \\mathrm{~g} \\mathrm{~mol}^{-1}, \\mathrm{Ar}=40 \\mathrm{~g} \\mathrm{~mol}^{-1}$ )", "image": null}, "options": [{"id": "6yvx7", "text": "18 bar", "image": null, "isCorrect": false}, {"id": "gjAq8", "text": "12 bar", "image": null, "isCorrect": false}, {"id": "jaO59", "text": "15 bar", "image": null, "isCorrect": true}, {"id": "sDWNn", "text": "9 bar", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Moles of $N_2=\\frac{7}{28}=\\frac{1}{4}$\nMoles of $\\mathrm{Ar}=\\frac{8}{40}=\\frac{1}{5}$\nPartial pressure $=X_{N_2} \\times P_T$\nPartial pressure of\n$\\begin{aligned}\nN_2 & =\\frac{\\frac{1}{4}}{\\frac{1}{4}+\\frac{1}{5}} \\times 27 \\\\\n& =\\frac{\\frac{1}{4}}{\\frac{9}{20}} \\times 27 \\\\\n& =\\frac{1}{4} \\times \\frac{20}{9} \\times 27 \\\\\n& =15 \\mathrm{bar}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263480279619d9d8a3dc7", "title": "Kinetic theory of gases", "totalQuestions": 3, "questions": [{"_id": "6a44d3348c30a4553e1be148", "type": "singleCorrect", "question": {"text": "Which of the following statements is true about ideal gas ?", "image": null}, "options": [{"id": "Qgp68", "label": "A", "text": "It shows deviation from Boyle's law and Charles' law.", "isCorrect": false, "image": null}, {"id": "yysEh", "label": "B", "text": "Its molecules are not perfectly elastic.", "isCorrect": false, "image": null}, {"id": "lhrWb", "label": "C", "text": "It does not exist.", "isCorrect": true, "image": null}, {"id": "c2hhK", "label": "D", "text": "Intermolecular attraction is present in it, hence a collision takes place with loss of kinetic energy.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "An ideal gas is a hypothetical concept and does not exist in reality. Real gases behave as ideal gases only under conditions of low pressure and high temperature.<br><br>According to the kinetic theory of gases, an ideal gas strictly obeys Boyle's law, Charles' law, and other gas laws under all conditions of temperature and pressure. The collisions between its molecules are perfectly elastic, and there are no intermolecular forces of attraction between its molecules.<br><br>Thus, the statement that it does not exist is true.<br><br>Answer: It does not exist.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b68c30a4553e1bdc02", "type": "singleCorrect", "question": {"text": "According to the kinetic molecular theory of gases, the average kinetic energy of gas molecules:", "image": null}, "options": [{"id": "Au5VJ", "label": "A", "text": "Increases with increase in pressure", "isCorrect": false, "image": null}, {"id": "bCW6G", "label": "B", "text": "Decreases with increase in volume", "isCorrect": false, "image": null}, {"id": "vXonS", "label": "C", "text": "Is directly proportional to the absolute temperature", "isCorrect": true, "image": null}, {"id": "ChTql", "label": "D", "text": "Is the same for all gases at the same volume", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the kinetic molecular theory of gases, the average translational kinetic energy of a gas molecule is given by $E = \\dfrac{3}{2}kT$, where $k$ is the Boltzmann constant and $T$ is the absolute temperature.<br><br>For one mole of an ideal gas, the average kinetic energy is $E = \\dfrac{3}{2}RT$, where $R$ is the universal gas constant.<br><br>This shows that the average kinetic energy of gas molecules depends only on the absolute temperature and is directly proportional to it. It is independent of pressure, volume, and the nature of the gas.<br><br>Answer: Is directly proportional to the absolute temperature", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7d0279619d9d8a14d6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "Argon possesses", "image": null}, "options": [{"id": "GPzQg", "text": "translational motion only", "image": null, "isCorrect": true}, {"id": "MI4Vu", "text": "translational + rotational motion", "image": null, "isCorrect": false}, {"id": "HP0nE", "text": "translational + vibrational motion", "image": null, "isCorrect": false}, {"id": "CY9RJ", "text": "translational $+$ rotational $+$ vibrational motion", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Argon is a monatomic gas, thus its molecules can move in any direction in space. Hence, it can have three independent motions (all translational). Therefore, argon possesses only translational motion.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263480279619d9d8a3dc9", "title": "Real Gases and Van der Waal's Equation", "totalQuestions": 8, "questions": [{"_id": "6abb88af15a9fc0fc8c1460a", "type": "singleCorrect", "question": {"text": "Which of the following gases exhibits positive deviation from ideal behavior at all pressures?", "image": null}, "options": [{"id": "CCuqK", "label": "A", "text": "$\\text{H}_2$", "isCorrect": true, "image": null}, {"id": "ekgvf", "label": "B", "text": "$\\text{O}_2$", "isCorrect": false, "image": null}, {"id": "Cjvl8", "label": "C", "text": "$\\text{CH}_4$", "isCorrect": false, "image": null}, {"id": "IOJyg", "label": "D", "text": "$\\text{CO}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The compressibility factor $Z$ is given by $Z = \\dfrac{PV}{nRT}$. For an ideal gas, $Z = 1$.<br><br>For real gases, deviation from ideal behavior is explained by the van der Waals equation: $\\left(P + \\dfrac{a}{V^2}\\right)(V - b) = RT$ for 1 mole of gas.<br><br>For exceptionally small molecules like $\\text{H}_2$ and $\\text{He}$, the intermolecular attractive forces are very weak. Therefore, the van der Waals constant '$a$' is negligibly small, and the term $\\dfrac{a}{V^2}$ can be ignored.<br><br>The equation simplifies to $P(V - b) = RT$.<br><br>$PV - Pb = RT$<br><br>$PV = RT + Pb$<br><br>Dividing by $RT$, we get:<br><br>$Z = \\dfrac{PV}{RT} = 1 + \\dfrac{Pb}{RT}$<br><br>Since $P$, $b$, $R$, and $T$ are all positive quantities, $Z > 1$ at all pressures. This means $\\text{H}_2$ exhibits positive deviation from ideal behavior at all pressures.<br><br>Other gases like $\\text{O}_2$, $\\text{CH}_4$, and $\\text{CO}_2$ have significant attractive forces (larger '$a$' values), so they initially show negative deviation ($Z < 1$) at low pressures before showing positive deviation at high pressures.<br><br>Answer: $\\text{H}_2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3188c30a4553e1be01c", "type": "singleCorrect", "question": {"text": "Calculate the compressibility factor of $1$ mole of a certain real gas if it occupies $0.4 \\text{ dm}^3$ at $300$ K and $40$ atm. [R $= 0.082$ atm $\\text{dm}^3 \\text{K}^{-1}\\text{mol}^{-1}$]", "image": null}, "options": [{"id": "FICxP", "label": "A", "text": "$0.45$", "isCorrect": false, "image": null}, {"id": "5sr5Y", "label": "B", "text": "$0.65$", "isCorrect": true, "image": null}, {"id": "OZmug", "label": "C", "text": "$0.85$", "isCorrect": false, "image": null}, {"id": "jusDK", "label": "D", "text": "$1.00$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The compressibility factor $Z$ is given by the formula:<br><br>$Z = \\dfrac{PV}{nRT}$<br><br>Substituting the given values:<br><br>$Z = \\dfrac{40 \\times 0.4}{1 \\times 0.082 \\times 300}$<br><br>$Z = \\dfrac{16}{24.6}$<br><br>$Z \\approx 0.65$<br><br>Answer: $0.65$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b26bf9280d7f99326b4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If compressibility factor of real gas is 1.05 at STP. What is molar volume of real gas?", "image": null}, "options": [{"id": "umjc9", "text": "$22.40 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "y0GKP", "text": "$21.33 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "brLkB", "text": "$23.52 \\mathrm{dm}^3$", "image": null, "isCorrect": true}, {"id": "nKmtB", "text": "$23.05 \\mathrm{dm}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The compressibility factor $Z$ is given by the ratio of the molar volume of a real gas to the molar volume of an ideal gas at the same temperature and pressure.<br><br>$Z = \\dfrac{V_{\\text{real}}}{V_{\\text{ideal}}}$<br><br>At STP, the molar volume of an ideal gas is $V_{\\text{ideal}} = 22.4 \\text{ dm}^3$.<br><br>Given $Z = 1.05$, we can find the molar volume of the real gas as:<br><br>$V_{\\text{real}} = Z \\times V_{\\text{ideal}}$<br><br>$V_{\\text{real}} = 1.05 \\times 22.4 \\text{ dm}^3$<br><br>$V_{\\text{real}} = 23.52 \\text{ dm}^3$<br><br>Answer: $23.52 \\mathrm{dm}^3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139e0aee93fa0796da36", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "What volume of chlorine gas (molar mass 71) is evolved at STP during electrolysis of fused NaCl by passage of 1 amp current for 965 second?\n(At STP, V = $22.4 . \\mathrm{dm}^3$ )", "image": null}, "options": [{"id": "MFqP5", "text": "0.112 L", "image": null, "isCorrect": true}, {"id": "Emwxe", "text": "$\\quad 0.224 \\mathrm{~L}$", "image": null, "isCorrect": false}, {"id": "OfoHp", "text": "1.12 L", "image": null, "isCorrect": false}, {"id": "swmli", "text": "$\\quad 2.24 \\mathrm{~L}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Reaction at anode: $2\\mathrm{Cl}^{-} \\rightarrow \\mathrm{Cl}_{2} + 2\\mathrm{e}^{-}$<br><br>Charge passed $Q = I \\times t = 1 \\times 965 = 965 \\text{ C}$<br><br>Number of Faradays passed $= \\dfrac{965}{96500} = 0.01 \\text{ F}$<br><br>Since $2 \\text{ F}$ of charge produces $1 \\text{ mole}$ of $\\mathrm{Cl}_{2}$ gas, the moles of $\\mathrm{Cl}_{2}$ produced $= \\dfrac{0.01}{2} = 0.005 \\text{ mol}$<br><br>Volume of $\\mathrm{Cl}_{2}$ at STP $= 0.005 \\times 22.4 \\text{ L} = 0.112 \\text{ L}$<br><br>Answer: 0.112 L", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213880aee93fa0796d987", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Which of the following formula is used to calculate compressibility factor?", "image": null}, "options": [{"id": "TnoRM", "text": "$\\mathrm{Z}=\\dfrac{\\mathrm{PVT}}{\\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "VNobL", "text": "$\\mathrm{Z}=\\dfrac{\\mathrm{nRT}}{\\mathrm{PV}}$", "image": null, "isCorrect": false}, {"id": "mwcyb", "text": "$\\mathrm{Z}=\\dfrac{\\mathrm{PV}}{\\mathrm{nRT}}$", "image": null, "isCorrect": true}, {"id": "tn6SU", "text": "$\\mathrm{Z}=\\left(\\dfrac{\\mathrm{PV}}{\\mathrm{RT}}\\right) \\times \\mathrm{n}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The compressibility factor $Z$ is defined as the ratio of the actual volume of a gas to the volume of an ideal gas at the same temperature and pressure.<br><br>For an ideal gas, $PV_{ideal} = nRT$, so $V_{ideal} = \\dfrac{nRT}{P}$.<br><br>For a real gas, $Z = \\dfrac{V_{real}}{V_{ideal}} = \\dfrac{V}{\\dfrac{nRT}{P}} = \\dfrac{PV}{nRT}$.<br><br>Answer: $\\mathrm{Z}=\\dfrac{\\mathrm{PV}}{\\mathrm{nRT}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ff0279619d9d8a30fd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Which of the following formulae is used to determine compressibility factor for measurement of deviation from ideal behaviour?", "image": null}, "options": [{"id": "O00OD", "text": "$\\mathrm{Z}=\\frac{\\mathrm{nRT}}{\\mathrm{PV}}$", "image": null, "isCorrect": false}, {"id": "mf5HI", "text": "$\\mathrm{Z}=\\frac{\\mathrm{PV}}{\\mathrm{nRT}}$", "image": null, "isCorrect": true}, {"id": "3XdoU", "text": "$\\mathrm{Z}=\\frac{\\mathrm{nRT}}{\\mathrm{V}}$", "image": null, "isCorrect": false}, {"id": "udc1Y", "text": "$\\mathrm{Z}=\\frac{\\mathrm{nRT}}{\\mathrm{P}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ea0279619d9d8a3059", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "What is the volume of 1 mole real gas at. STP $\\left(\\mathrm{V}_0=22.4 \\mathrm{dm}^3\\right)$, if compressibility factor of real gas is 1.1 at STP?", "image": null}, "options": [{"id": "5I3zo", "text": "$22.40 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "1HAG5", "text": "$23.64 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "hOuah", "text": "$24.64 \\mathrm{dm}^3$", "image": null, "isCorrect": true}, {"id": "TcS9H", "text": "$23.50 \\mathrm{dm}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\mathrm{Z}=\\frac{\\mathrm{V}_{\\text {real }}}{\\mathrm{V}_{\\text {ideal }}} \\\\\n& \\mathrm{V}_{\\text {real }}=\\mathrm{Z} \\times \\mathrm{V}_{\\text {ideal }}=1.1 \\times 22.4=24.64 \\mathrm{dm}^3\n\\end{aligned}$\nAlternate method:\n$\\begin{aligned}\n\\mathrm{Z} & =\\frac{\\mathrm{PV}}{\\mathrm{nRT}} \\\\\n1.1 & =\\frac{1 \\times \\mathrm{V}}{1 \\times 0.08206 \\times 273} \\\\\n1.1 & =\\frac{\\mathrm{V}}{0.08206 \\times 273} \\\\\n\\therefore \\quad \\mathrm{V} & =24.64 \\mathrm{dm}^3\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f220279619d9d8a1a09", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "According to Andrews isothermals at what temperature the carbondioxide gas starts to condense at 73 atmosphere?", "image": null}, "options": [{"id": "EQjwo", "text": "$21 \\cdot 5^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "40HQE", "text": "$30 \\cdot 98^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "YBt7Q", "text": "$13 \\cdot 1^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "ZbNhF", "text": "$48 \\cdot 1^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For $\\mathrm{CO}_{2}$, critical pressure $\\left(\\mathrm{P}_{\\mathrm{C}}\\right)=73$ atm \ncritical temperature $\\left(\\mathrm{T}_{\\mathrm{C}}\\right)=30.98{ }^{\\circ} \\mathrm{C}$,", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "6a44d38b8c30a4553e1be402", "title": "Liquid State", "totalQuestions": 1, "questions": [{"_id": "6a44d2fd8c30a4553e1bdefc", "type": "singleCorrect", "question": {"text": "Which of the following is not an illustration of viscosity?", "image": null}, "options": [{"id": "OLTui", "label": "A", "text": "Gradation of lubricant oils", "isCorrect": false, "image": null}, {"id": "Oi2er", "label": "B", "text": "Indication of Cardiovascular disease", "isCorrect": false, "image": null}, {"id": "UZgek", "label": "C", "text": "Cleansing action of soap", "isCorrect": true, "image": null}, {"id": "YHQ0w", "label": "D", "text": "Thickening of glass panes of old buildings", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Gradation of lubricant oils is done on the basis of their viscosity.<br><br>High viscosity of blood is an indicator of cardiovascular diseases.<br><br>Glass is a supercooled liquid with very high viscosity, which causes it to flow downwards very slowly over time, resulting in the thickening of glass panes at the bottom in old buildings.<br><br>The cleansing action of soap is based on the principle of surface tension, not viscosity. Soap lowers the surface tension of water, allowing it to spread and penetrate more easily.<br><br>Answer: Cleansing action of soap", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a263480279619d9d8a3dca", "title": "Critical phenomena and liquefaction", "totalQuestions": 7, "questions": [{"_id": "6abb889f15a9fc0fc8c14574", "type": "singleCorrect", "question": {"text": "What is the value of critical temperature of $\\text{CO}_2$ in $^\\circ$C?", "image": null}, "options": [{"id": "T2UdE", "label": "A", "text": "$33.2^\\circ\\text{C}$", "isCorrect": false, "image": null}, {"id": "qzyAX", "label": "B", "text": "$30.98^\\circ\\text{C}$", "isCorrect": true, "image": null}, {"id": "KVTPP", "label": "C", "text": "$154.3^\\circ\\text{C}$", "isCorrect": false, "image": null}, {"id": "RCb4z", "label": "D", "text": "$126.0^\\circ\\text{C}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The critical temperature of a gas is the temperature above which it cannot be liquefied, regardless of the amount of pressure applied.<br><br>From Andrews' isotherms for carbon dioxide, the critical temperature ($T_c$) of $\\text{CO}_2$ is experimentally determined to be $30.98^\\circ\\text{C}$.<br><br>Answer: $30.98^\\circ\\text{C}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bf15a9fc0fc8c146a0", "type": "singleCorrect", "question": {"text": "Which among the following gases is difficult to liquefy ?", "image": null}, "options": [{"id": "tFfiX", "label": "A", "text": "Chlorine gas", "isCorrect": false, "image": null}, {"id": "x8wWN", "label": "B", "text": "Nitrogen gas", "isCorrect": true, "image": null}, {"id": "m5OWP", "label": "C", "text": "Ammonia gas", "isCorrect": false, "image": null}, {"id": "wGF0B", "label": "D", "text": "Sulphur dioxide gas", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The ease of liquefaction of a gas depends on the strength of intermolecular forces and its critical temperature. Gases with higher critical temperatures are easier to liquefy.<br><br>Ammonia ($NH_3$) has strong intermolecular hydrogen bonding.<br><br>Sulphur dioxide ($SO_2$) is a polar molecule with strong dipole-dipole interactions.<br><br>Chlorine ($Cl_2$) is non-polar but has a large molecular size, leading to strong London dispersion forces.<br><br>Nitrogen ($N_2$) is a small, non-polar molecule with very weak London dispersion forces and a very low critical temperature ($126$ K).<br><br>Therefore, nitrogen gas is the most difficult to liquefy among the given options.<br><br>Answer: Nitrogen gas", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214220aee93fa0796de3c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Which among the following gases is difficult to liquify?", "image": null}, "options": [{"id": "x9o59", "text": "$\\mathrm{SO}_2$", "image": null, "isCorrect": false}, {"id": "6xTJg", "text": "$\\mathrm{Cl}_2$", "image": null, "isCorrect": false}, {"id": "WTDHh", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": false}, {"id": "NNfPJ", "text": "$\\mathrm{O}_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The ease of liquefaction of a gas depends on the strength of its intermolecular forces, which is reflected in its critical temperature. Gases with higher critical temperatures are easier to liquefy.<br><br>$\\mathrm{NH}_3$ exhibits strong intermolecular hydrogen bonding.<br><br>$\\mathrm{SO}_2$ is a polar molecule with strong dipole-dipole interactions.<br><br>$\\mathrm{Cl}_2$ is a non-polar molecule but has a relatively large molecular mass, resulting in significant London dispersion forces.<br><br>$\\mathrm{O}_2$ is a small, non-polar diatomic molecule with very weak London dispersion forces and a low critical temperature. Therefore, it is the most difficult to liquefy among the given gases.<br><br>Answer: $\\mathrm{O}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "20 ge": null, "isCorrect": false}, {"id": "cOyzS", "text": "$493 \\mathrm{~K}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Critical temperature of water is $647.096 \\mathrm{~K}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260620279619d9d8a240d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "Which among the following gases is adsorbed to greater extent at similar conditions of temperature and pressure if the adsorbent remains same?", "image": null}, "options": [{"id": "An9gw", "text": "$\\mathrm{N}_2$", "image": null, "isCorrect": false}, {"id": "ymmGc", "text": "$\\mathrm{Cl}_2$", "image": null, "isCorrect": true}, {"id": "l32DI", "text": "$\\mathrm{H}_2$", "image": null, "isCorrect": false}, {"id": "Mct58", "text": "$\\mathrm{O}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "- Gas having higher critical temperature is adsorbed to greater extent.\n$\\begin{array}{llll}\\mathrm{H}_2 & 33.145 \\mathrm{~K} & \\mathrm{O}_2 & 154.60 \\mathrm{~K} \\\\ \\mathrm{~N}_2 & 126.19 \\mathrm{~K} & \\mathrm{Cl}_2 & 417 \\mathrm{~K}\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f910279619d9d8a1d86", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "Which among the following gases liquefy easily?", "image": null}, "options": [{"id": "QDiu4", "text": "oxygen", "image": null, "isCorrect": false}, {"id": "sfPhy", "text": "helium", "image": null, "isCorrect": false}, {"id": "PNwd5", "text": "chlorine", "image": null, "isCorrect": true}, {"id": "Acin6", "text": "nitrogen", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Gases that are liquefied using the pressure method are chlorine, $\\mathrm{CO}_{2}$ etc. Permanent gases such as $\\mathrm{H}_{2}, \\mathrm{O}_{2}, \\mathrm{~N}_{2}$ and real gases cannot be liquefied easily by the processes of compressing, cooling or applying pressure.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
