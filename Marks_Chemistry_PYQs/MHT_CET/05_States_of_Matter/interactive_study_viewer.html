  <script>
    const data = {"index": 5, "chapterId": "61c089a6ced83e1eb2cecb67", "chapter": "States of Matter", "exam": "MHT CET", "totalTopics": 6, "totalQuestions": 92, "downloadTime": "2026-10-08 20:05:47", "topics": [{"index": 1, "topicId": "65a263480279619d9d8a3dc8", "title": "Gas laws and Ideal Gas Equation", "totalQuestions": 56, "questions": [{"_id": "6abb887015a9fc0fc8c143b2", "type": "singleCorrect", "question": {"text": "Which of the following gases has the highest density under normal conditions?", "image": null}, "options": [{"id": "MEzDN", "label": "A", "text": "$\\text{O}_2$", "isCorrect": false, "image": null}, {"id": "HZFbc", "label": "B", "text": "$\\text{SO}_2$", "isCorrect": true, "image": null}, {"id": "Uf5Lz", "label": "C", "text": "$\\text{CH}_4$", "isCorrect": false, "image": null}, {"id": "1Q13z", "label": "D", "text": "$\\text{N}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The density of an ideal gas is given by the formula $d = \\dfrac{PM}{RT}$, where $P$ is pressure, $M$ is molar mass, $R$ is the universal gas constant, and $T$ is temperature.<br><br>Under normal conditions (constant temperature and pressure), the density of a gas is directly proportional to its molar mass ($d \\propto M$).<br><br>Calculating the molar mass of the given gases:<br>Molar mass of $\\text{O}_2 = 2 \\times 16 = 32 \\text{ g/mol}$<br>Molar mass of $\\text{SO}_2 = 32 + 2 \\times 16 = 64 \\text{ g/mol}$<br>Molar mass of $\\text{CH}_4 = 12 + 4 \\times 1 = 16 \\text{ g/mol}$<br>Molar mass of $\\text{N}_2 = 2 \\times 14 = 28 \\text{ g/mol}$<br><br>Since $\\text{SO}_2$ has the highest molar mass, it will have the highest density under normal conditions.<br><br>Answer: $\\text{SO}_2$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888015a9fc0fc8c14448", "type": "singleCorrect", "question": {"text": "The volume of a given mass of a gas at $27^\\circ\\text{C}$ is $2.1\\,\\text{dm}^3$. Calculate the new volume of a gas at constant pressure when the temperature is $7^\\circ\\text{C}$.", "image": null}, "options": [{"id": "XLdeB", "label": "A", "text": "$1.96\\,\\text{dm}^3$", "isCorrect": true, "image": null}, {"id": "9roig", "label": "B", "text": "$1.50\\,\\text{dm}^3$", "isCorrect": false, "image": null}, {"id": "5QHU0", "label": "C", "text": "$1.34\\,\\text{dm}^3$", "isCorrect": false, "image": null}, {"id": "cK9Co", "label": "D", "text": "$1.18\\,\\text{dm}^3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given, initial volume $V_1 = 2.1\\,\\text{dm}^3$<br><br>Initial temperature $T_1 = 27^\\circ\\text{C} = 27 + 273 = 300\\,\\text{K}$<br><br>Final temperature $T_2 = 7^\\circ\\text{C} = 7 + 273 = 280\\,\\text{K}$<br><br>At constant pressure, according to Charles's law:<br><br>$\\dfrac{V_1}{T_1} = \\dfrac{V_2}{T_2}$<br><br>$V_2 = \\dfrac{V_1 T_2}{T_1}$<br><br>$V_2 = \\dfrac{2.1 \\times 280}{300}$<br><br>$V_2 = 1.96\\,\\text{dm}^3$<br><br>Answer: $1.96\\,\\text{dm}^3$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889015a9fc0fc8c144de", "type": "singleCorrect", "question": {"text": "Find the new volume of the gas at temperature at $25^\\circ\\text{C}$ by keeping constant pressure. If the same gas occupies $240$ $\\text{dm}^3$ volume at $10^\\circ\\text{C}$.", "image": null}, "options": [{"id": "EiuuH", "label": "A", "text": "$252.72$ $\\text{dm}^3$", "isCorrect": true, "image": null}, {"id": "wxfnr", "label": "B", "text": "$227.91$ $\\text{dm}^3$", "isCorrect": false, "image": null}, {"id": "IQUnY", "label": "C", "text": "$225.27$ $\\text{dm}^3$", "isCorrect": false, "image": null}, {"id": "tdRGu", "label": "D", "text": "$272.19$ $\\text{dm}^3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Charles's Law, at constant pressure, the volume of a fixed mass of gas is directly proportional to its absolute temperature.<br><br>$\\dfrac{V_1}{T_1} = \\dfrac{V_2}{T_2}$<br><br>Given:<br>$V_1 = 240 \\text{ dm}^3$<br>$T_1 = 10^\\circ\\text{C} = 10 + 273 = 283 \\text{ K}$<br>$T_2 = 25^\\circ\\text{C} = 25 + 273 = 298 \\text{ K}$<br><br>Substituting the values into the equation:<br><br>$\\dfrac{240}{283} = \\dfrac{V_2}{298}$<br><br>$V_2 = \\dfrac{240 \\times 298}{283}$<br><br>$V_2 = \\dfrac{71520}{283} = 252.72 \\text{ dm}^3$<br><br>Answer: $252.72$ $\\text{dm}^3$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886015a9fc0fc8c1431c", "type": "singleCorrect", "question": {"text": "A sample of nitrogen gas occupies a volume of $320$ cm$^3$ at STP. Calculate its volume at $66\\,^\\circ$C and $0.825$ bar pressure", "image": null}, "options": [{"id": "2h578", "label": "A", "text": "$481.6$ cm$^3$", "isCorrect": true, "image": null}, {"id": "uh7KT", "label": "B", "text": "$332.4$ cm$^3$", "isCorrect": false, "image": null}, {"id": "wue1Q", "label": "C", "text": "$80$ cm$^3$", "isCorrect": false, "image": null}, {"id": "vg1pS", "label": "D", "text": "$104.9$ cm$^3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "At STP:<br><br>$P_1 = 1 \\text{ bar}$<br><br>$V_1 = 320 \\text{ cm}^3$<br><br>$T_1 = 273.15 \\text{ K}$<br><br>Final conditions:<br><br>$P_2 = 0.825 \\text{ bar}$<br><br>$T_2 = 66^{\\circ}\\text{C} = 66 + 273.15 = 339.15 \\text{ K}$<br><br>Using the combined gas law:<br><br>$\\dfrac{P_1 V_1}{T_1} = \\dfrac{P_2 V_2}{T_2}$<br><br>$V_2 = \\dfrac{P_1 V_1 T_2}{P_2 T_1}$<br><br>$V_2 = \\dfrac{1 \\times 320 \\times 339.15}{0.825 \\times 273.15}$<br><br>$V_2 = 481.6 \\text{ cm}^3$<br><br>Answer: $481.6$ cm$^3$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883015a9fc0fc8c1415a", "type": "singleCorrect", "question": {"text": "A hot air balloon has a volume of $2800$ dm$^3$ at $100\\,^\\circ$C. What is the volume if air cools to $27\\,^\\circ$C?", "image": null}, "options": [{"id": "D845J", "label": "A", "text": "$2252$ dm$^3$.", "isCorrect": true, "image": null}, {"id": "2OVZO", "label": "B", "text": "$2450$ dm$^3$.", "isCorrect": false, "image": null}, {"id": "xoYgC", "label": "C", "text": "$2656$ dm$^3$.", "isCorrect": false, "image": null}, {"id": "Igh0T", "label": "D", "text": "$2912$ dm$^3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Charles's law, at constant pressure, the volume of a fixed mass of gas is directly proportional to its absolute temperature.<br><br>$\\dfrac{V_1}{T_1} = \\dfrac{V_2}{T_2}$<br><br>Given:<br>$V_1 = 2800$ dm$^3$<br>$T_1 = 100^{\\circ}$C $= 100 + 273 = 373$ K<br>$T_2 = 27^{\\circ}$C $= 27 + 273 = 300$ K<br><br>Substituting the values:<br><br>$V_2 = \\dfrac{V_1 T_2}{T_1}$<br><br>$V_2 = \\dfrac{2800 \\times 300}{373}$<br><br>$V_2 \\approx 2252$ dm$^3$<br><br>Answer: $2252$ dm$^3$.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3528c30a4553e1be27e", "type": "singleCorrect", "question": {"text": "Find the number of moles of $\\text{CO}_2$ present in a sample occuping $4 \\times 10^{-3}\\,\\text{m}^3$ at $1.104 \\times 10^5\\,\\text{Nm}^{-2}$ pressure ($R \\times T = 2208\\ \\text{J mol}^{-1}$)", "image": null}, "options": [{"id": "t14BK", "label": "A", "text": "$0.1$ mole", "isCorrect": false, "image": null}, {"id": "9iH5J", "label": "B", "text": "$0.2$ mole", "isCorrect": true, "image": null}, {"id": "dQ7Jj", "label": "C", "text": "$0.3$ mole", "isCorrect": false, "image": null}, {"id": "7QhuG", "label": "D", "text": "$0.4$ mole", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the ideal gas equation, $PV = nRT$<br><br>Rearranging for the number of moles $n$, we get $n = \\dfrac{PV}{RT}$<br><br>Substituting the given values:<br><br>$n = \\dfrac{1.104 \\times 10^5 \\times 4 \\times 10^{-3}}{2208}$<br><br>$n = \\dfrac{441.6}{2208}$<br><br>$n = 0.2$ mole<br><br>Answer: $0.2$ mole", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3448c30a4553e1be1f3", "type": "singleCorrect", "question": {"text": "A gas at $10\\,^\\circ\\text{C}$ occupies a volume of 283 mL. if it is heated to $20\\,^\\circ\\text{C}$ keeping the pressure constant. What is the new volume of gas ?", "image": null}, "options": [{"id": "FoBt5", "label": "A", "text": "$566 \\text{ mL}$", "isCorrect": false, "image": null}, {"id": "OD0jH", "label": "B", "text": "$450 \\text{ mL}$", "isCorrect": false, "image": null}, {"id": "KqrHV", "label": "C", "text": "$350 \\text{ mL}$", "isCorrect": false, "image": null}, {"id": "QyoKB", "label": "D", "text": "$293 \\text{ mL}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to Charles's Law, at constant pressure, $\\dfrac{V_1}{T_1} = \\dfrac{V_2}{T_2}$<br><br>Given:<br>$V_1 = 283 \\text{ mL}$<br>$T_1 = 10\\,^\\circ\\text{C} = 10 + 273 = 283 \\text{ K}$<br>$T_2 = 20\\,^\\circ\\text{C} = 20 + 273 = 293 \\text{ K}$<br><br>Substituting the values:<br>$\\dfrac{283}{283} = \\dfrac{V_2}{293}$<br><br>$V_2 = 293 \\text{ mL}$<br><br>Answer: $293 \\text{ mL}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c88c30a4553e1bdcbd", "type": "singleCorrect", "question": {"text": "$V_0$ and $V_t$ are volumes of an ideal gas at $0\\ ^\\circ\\text{C}$ and $t\\ ^\\circ\\text{C}$ respectively, find ratio $\\dfrac{V_t}{V_0}$", "image": null}, "options": [{"id": "4LJYM", "label": "A", "text": "$\\dfrac{1}{273} \\times t$", "isCorrect": false, "image": null}, {"id": "z2K4p", "label": "B", "text": "$1 + 273 \\times t$", "isCorrect": false, "image": null}, {"id": "pQvXb", "label": "C", "text": "$1 + \\dfrac{t}{273}$", "isCorrect": true, "image": null}, {"id": "Swret", "label": "D", "text": "$\\dfrac{1}{273 + t}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Charles's law, at constant pressure, the volume of a fixed mass of an ideal gas is directly proportional to its absolute temperature.<br><br>$V \\propto T$<br><br>$\\dfrac{V_t}{V_0} = \\dfrac{T_t}{T_0}$<br><br>The absolute temperatures are $T_0 = 273\\text{ K}$ and $T_t = (273 + t)\\text{ K}$.<br><br>$\\dfrac{V_t}{V_0} = \\dfrac{273 + t}{273}$<br><br>$\\dfrac{V_t}{V_0} = 1 + \\dfrac{t}{273}$<br><br>Answer: $1 + \\dfrac{t}{273}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d28c30a4553e1bdd2e", "type": "singleCorrect", "question": {"text": "At constant temperature, a gas occupies a volume of 200 mL at a pressure of 500 mm Hg. What will be its volume at 800 mm Hg pressure?", "image": null}, "options": [{"id": "K7CXj", "label": "A", "text": "$280\\ \\text{mL}$", "isCorrect": false, "image": null}, {"id": "AcgQI", "label": "B", "text": "$125\\ \\text{mL}$", "isCorrect": true, "image": null}, {"id": "I5ydC", "label": "C", "text": "$100\\ \\text{mL}$", "isCorrect": false, "image": null}, {"id": "CWHbK", "label": "D", "text": "$350\\ \\text{mL}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Boyle's law, at constant temperature, $P_1 V_1 = P_2 V_2$.<br><br>Given $P_1 = 500\\ \\text{mm Hg}$, $V_1 = 200\\ \\text{mL}$, and $P_2 = 800\\ \\text{mm Hg}$.<br><br>Substituting the values:<br><br>$500 \\times 200 = 800 \\times V_2$<br><br>$V_2 = \\dfrac{500 \\times 200}{800} = 125\\ \\text{mL}$<br><br>Answer: $125\\ \\text{mL}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e08c30a4553e1bddc4", "type": "singleCorrect", "question": {"text": "Calculate the new pressure of the gas enclosed in a cylinder when it compressed from 5 L to 2 L at 1 atm and 300 K. The final temperature in this process is 500 K.", "image": null}, "options": [{"id": "DxYZU", "label": "A", "text": "$1.5$ atm", "isCorrect": false, "image": null}, {"id": "yI5fL", "label": "B", "text": "$3.12$ atm", "isCorrect": false, "image": null}, {"id": "xsNyl", "label": "C", "text": "$2.5$ atm", "isCorrect": false, "image": null}, {"id": "YTChS", "label": "D", "text": "$4.16$ atm", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Using the combined gas law equation:<br><br>$\\dfrac{P_1 V_1}{T_1} = \\dfrac{P_2 V_2}{T_2}$<br><br>Given values are:<br><br>$P_1 = 1$ atm, $V_1 = 5$ L, $T_1 = 300$ K<br><br>$V_2 = 2$ L, $T_2 = 500$ K<br><br>Substituting the values into the equation:<br><br>$\\dfrac{1 \\times 5}{300} = \\dfrac{P_2 \\times 2}{500}$<br><br>$P_2 = \\dfrac{1 \\times 5 \\times 500}{300 \\times 2}$<br><br>$P_2 = \\dfrac{25}{6} \\approx 4.16$ atm<br><br>Answer: $4.16$ atm", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29a8c30a4553e1bdad6", "type": "singleCorrect", "question": {"text": "A gas occupies a volume of $0.35$ dm$^3$ at $290$ K and $2$ atm. Pressure. Calculate the volume of gas at STP.", "image": null}, "options": [{"id": "CDeQw", "label": "A", "text": "$3.11$ dm$^3$", "isCorrect": false, "image": null}, {"id": "xd9dz", "label": "B", "text": "$0.66$ dm$^3$", "isCorrect": true, "image": null}, {"id": "nU6O0", "label": "C", "text": "$0.11$ dm$^3$", "isCorrect": false, "image": null}, {"id": "qONrr", "label": "D", "text": "$3.5$ dm$^3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the combined gas equation:<br><br>$\\dfrac{P_1 V_1}{T_1} = \\dfrac{P_2 V_2}{T_2}$<br><br>Given:<br>$P_1 = 2$ atm<br>$V_1 = 0.35$ dm$^3$<br>$T_1 = 290$ K<br><br>At STP:<br>$P_2 = 1$ atm<br>$T_2 = 273$ K<br><br>Substituting the values:<br><br>$\\dfrac{2 \\times 0.35}{290} = \\dfrac{1 \\times V_2}{273}$<br><br>$V_2 = \\dfrac{2 \\times 0.35 \\times 273}{290}$<br><br>$V_2 = \\dfrac{191.1}{290} \\approx 0.66$ dm$^3$<br><br>Answer: $0.66$ dm$^3$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36d8c30a4553e1be3a0", "type": "singleCorrect", "question": {"text": "Calculate the temperature of 2 moles of gas occupying a volume of 5.0 liters at 24.6 atmospheres?<br>($R = 0.0821$ L atm K$^{-1}$ mol$^{-1}$)", "image": null}, "options": [{"id": "5ovhq", "label": "A", "text": "$476^\\circ$C", "isCorrect": true, "image": null}, {"id": "xFQAM", "label": "B", "text": "$480^\\circ$C", "isCorrect": false, "image": null}, {"id": "PfhYX", "label": "C", "text": "$440^\\circ$C", "isCorrect": false, "image": null}, {"id": "GxY0e", "label": "D", "text": "$450^\\circ$C", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the ideal gas equation $PV = nRT$<br><br>Substituting the given values:<br><br>$24.6 \\times 5.0 = 2 \\times 0.0821 \\times T$<br><br>$123 = 0.1642 \\times T$<br><br>$T = \\dfrac{123}{0.1642} = 749.08$ K<br><br>Converting to Celsius:<br><br>$T = 749.08 - 273.15 = 475.93^{\\circ}\\text{C} \\approx 476^{\\circ}\\text{C}$<br><br>Answer: $476^\\circ$C", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35f8c30a4553e1be30a", "type": "singleCorrect", "question": {"text": "A syringe has a volume of $10.0\\ \\text{cm}^3$ at a pressure of $1$ atm. If the end is sealed and the plunger is pushed down (constant temperature), what will be the final volume when the pressure becomes $3.5$ atm?", "image": null}, "options": [{"id": "ygXtP", "label": "A", "text": "$35.0\\ \\text{cm}^3$", "isCorrect": false, "image": null}, {"id": "7ekPA", "label": "B", "text": "$2.86\\ \\text{cm}^3$", "isCorrect": true, "image": null}, {"id": "z43UD", "label": "C", "text": "$0.286\\ \\text{cm}^3$", "isCorrect": false, "image": null}, {"id": "xpX3H", "label": "D", "text": "$3.50\\ \\text{cm}^3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Boyle's Law at constant temperature:<br><br>$P_1 V_1 = P_2 V_2$<br><br>Given $P_1 = 1\\ \\text{atm}$, $V_1 = 10.0\\ \\text{cm}^3$, and $P_2 = 3.5\\ \\text{atm}$.<br><br>Substituting the values:<br><br>$1 \\times 10.0 = 3.5 \\times V_2$<br><br>$V_2 = \\dfrac{10.0}{3.5} = 2.857\\ \\text{cm}^3$<br><br>Rounding to appropriate significant figures, $V_2 = 2.86\\ \\text{cm}^3$.<br><br>Answer: $2.86\\ \\text{cm}^3$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b15bf9280d7f9932622", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following is true according to Gay-Lussac's law?", "image": null}, "options": [{"id": "mmHaP", "text": "$\\frac{\\mathrm{V}}{\\mathrm{T}}=$ constant at constant pressure and for fixed mass of gas.", "image": null, "isCorrect": false}, {"id": "wU2wc", "text": "$\\frac{\\mathrm{p}}{\\mathrm{d}}=$ constant at constant temperature and fixed mass of gas.", "image": null, "isCorrect": false}, {"id": "UACdW", "text": "$\\frac{\\mathrm{P}}{\\mathrm{T}}=$ constant at constant volume and fixed mass of gas.", "image": null, "isCorrect": true}, {"id": "4cyza", "text": "$\\mathrm{P} \\times \\mathrm{V}=$ constant at constant temperature and for fixed mass of gas.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Gay-Lussac's law, for a fixed mass of gas at constant volume, the pressure is directly proportional to its absolute temperature.<br><br>$\\mathrm{P} \\propto \\mathrm{T}$ at constant $\\mathrm{V}$ and $\\mathrm{n}$.<br><br>$\\dfrac{\\mathrm{P}}{\\mathrm{T}} = \\text{constant}$<br><br>Answer: $\\frac{\\mathrm{P}}{\\mathrm{T}}=$ constant at constant volume and fixed mass of gas.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b02bf9280d7f9932597", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Four vessels of same volume consist equal moles of four gases $\\mathrm{H}_2, \\mathrm{Cl}_2$, $\\mathrm{N}_2$ and $\\mathrm{O}_2$ separately at same temperature. The pressure exerted by the gas is maximum for -", "image": null}, "options": [{"id": "MkJAQ", "text": "$\\mathrm{Cl}_2$", "image": null, "isCorrect": false}, {"id": "S2E2D", "text": "$\\mathrm{H}_2$", "image": null, "isCorrect": true}, {"id": "FBzF7", "text": "$\\mathrm{N}_2$", "image": null, "isCorrect": false}, {"id": "Molfd", "text": "$\\mathrm{O}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the ideal gas equation, $P = \\dfrac{nRT}{V}$. If the gases behaved ideally, they would all exert the same pressure since $n$, $V$, and $T$ are constant.<br><br>However, for real gases, the pressure is given by the van der Waals equation:<br>$P = \\dfrac{nRT}{V - nb} - \\dfrac{an^2}{V^2}$<br><br>The term $\\dfrac{an^2}{V^2}$ represents the reduction in pressure due to intermolecular forces of attraction. The van der Waals constant $a$ is a measure of the strength of these attractive forces.<br><br>Among the given gases, $\\mathrm{H}_2$ has the smallest size and the weakest intermolecular forces (London dispersion forces). Therefore, it has the minimum value of $a$.<br><br>Because the reduction in pressure is minimum for $\\mathrm{H}_2$, it exerts the maximum pressure. Alternatively, at room temperature, the compressibility factor $Z = \\dfrac{PV}{nRT}$ is greater than $1$ for $\\mathrm{H}_2$, whereas $Z < 1$ for $\\mathrm{N}_2$, $\\mathrm{O}_2$, and $\\mathrm{Cl}_2$ at moderate pressures. Since $P = \\dfrac{ZnRT}{V}$, the pressure is maximum for $\\mathrm{H}_2$.<br><br>Answer: $\\mathrm{H}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214370aee93fa0796dee4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Which of the following equations gives combined relationship of Boyle's law and Charle's law?", "image": null}, "options": [{"id": "akNbB", "text": "$\\frac{\\mathrm{P}_1 \\mathrm{~V}_2}{\\mathrm{~T}_1}=\\frac{\\mathrm{P}_2 \\mathrm{~V}_1}{\\mathrm{~T}_2}$", "image": null, "isCorrect": false}, {"id": "auv0c", "text": "$\\mathrm{n}=\\frac{\\mathrm{RT}}{\\mathrm{PV}}$", "image": null, "isCorrect": false}, {"id": "FpEyT", "text": "$\\frac{P_1 V_1}{T_1}=\\frac{P_2 V_2}{T_2}$", "image": null, "isCorrect": true}, {"id": "A5k5T", "text": "$\\mathrm{p}=\\frac{\\mathrm{RT}}{\\mathrm{nV}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Boyle's law, the volume of a given mass of gas is inversely proportional to its pressure at constant temperature:<br><br>$V \\propto \\dfrac{1}{P}$ (at constant $T$ and $n$)<br><br>According to Charles's law, the volume of a given mass of gas is directly proportional to its absolute temperature at constant pressure:<br><br>$V \\propto T$ (at constant $P$ and $n$)<br><br>Combining both laws, we get:<br><br>$V \\propto \\dfrac{T}{P}$<br><br>$\\dfrac{PV}{T} = \\text{constant}$<br><br>For two different states of the same amount of gas, the relationship can be written as:<br><br>$\\dfrac{P_1 V_1}{T_1} = \\dfrac{P_2 V_2}{T_2}$<br><br>Answer: $\\frac{P_1 V_1}{T_1}=\\frac{P_2 V_2}{T_2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214360aee93fa0796dedf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "What is the numerical value of gas constant R in terms of $\\mathrm{L} \\mathrm{atm} \\mathrm{K}{ }^{-1} \\mathrm{~mol}^{-1}$ ?", "image": null}, "options": [{"id": "A4EBp", "text": "0.085", "image": null, "isCorrect": false}, {"id": "69Ver", "text": "0.082", "image": null, "isCorrect": true}, {"id": "wOrV0", "text": "8.314", "image": null, "isCorrect": false}, {"id": "pc0lh", "text": "1.987", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The universal gas constant $R$ has different numerical values depending on the units used.<br><br>In SI units, $R = 8.314 \\text{ J K}^{-1} \\text{ mol}^{-1}$.<br><br>In calories, $R = 1.987 \\text{ cal K}^{-1} \\text{ mol}^{-1}$.<br><br>In terms of litre-atmosphere, the value of the gas constant is $R = 0.0821 \\text{ L atm K}^{-1} \\text{ mol}^{-1}$.<br><br>Thus, the numerical value of $R$ in $\\text{L atm K}^{-1} \\text{ mol}^{-1}$ is approximately $0.082$.<br><br>Answer: 0.082", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214200aee93fa0796de2e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "3.4 moles of an ideal gas occupies volume of 68 mL at 300 K . What would be the pressure of gas? $\\left(\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right)$", "image": null}, "options": [{"id": "EjLtb", "text": "$1.247 \\times 10^5 \\mathrm{kPa}$", "image": null, "isCorrect": true}, {"id": "913MJ", "text": "$2.431 \\times 10^3 \\mathrm{kPa}$", "image": null, "isCorrect": false}, {"id": "Lukpo", "text": "$1.031 \\times 10^5 \\mathrm{kPa}$", "image": null, "isCorrect": false}, {"id": "B2dOs", "text": "$3.247 \\times 10^5 \\mathrm{kPa}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the ideal gas equation, $PV = nRT$.<br><br>Given:<br>$n = 3.4$ mol<br>$V = 68$ mL $= 68 \\times 10^{-6}$ m$^3$<br>$T = 300$ K<br>$R = 8.314$ J K$^{-1}$ mol$^{-1}$<br><br>Substituting the values into the equation:<br>$P = \\dfrac{nRT}{V}$<br><br>$P = \\dfrac{3.4 \\times 8.314 \\times 300}{68 \\times 10^{-6}}$<br><br>$P = \\dfrac{1020 \\times 8.314}{68} \\times 10^6$<br><br>$P = 15 \\times 8.314 \\times 10^6$ Pa<br><br>$P = 124.71 \\times 10^6$ Pa<br><br>$P = 1.2471 \\times 10^8$ Pa<br><br>Converting to kPa ($1$ kPa $= 10^3$ Pa):<br>$P = 1.2471 \\times 10^5$ kPa<br><br>Answer: $1.247 \\times 10^5 \\mathrm{kPa}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fb0aee93fa0796dd0a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "If $P_1$ partial pressure of a gas and $x_1$ is its mole fraction in a mixture, then correct relation between $P_1$ and $x_1$ is", "image": null}, "options": [{"id": "iE1xf", "text": "$\\quad \\mathrm{P}_{\\text {total }}=\\mathrm{P}_1 \\mathrm{X}_1$", "image": null, "isCorrect": false}, {"id": "BREaQ", "text": "$\\quad \\mathrm{x}_1=\\frac{\\mathrm{P}_1}{\\mathrm{P}_{\\text {total }}}$", "image": null, "isCorrect": true}, {"id": "08vV1", "text": "$\\quad \\mathrm{P}_{\\text {total }}=1-\\mathrm{P}_1 \\mathrm{x}_1$", "image": null, "isCorrect": false}, {"id": "51DvK", "text": "$\\quad \\mathrm{P}_{\\text {total }}=\\mathrm{P}_1\\left(1-\\mathrm{x}_1\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Dalton's law of partial pressures, the partial pressure of a gas in a mixture is equal to the product of its mole fraction and the total pressure of the mixture.<br><br>$P_1 = x_1 \\times P_{\\text{total}}$<br><br>Rearranging the terms, we get:<br><br>$x_1 = \\dfrac{P_1}{P_{\\text{total}}}$<br><br>Answer: $\\quad \\mathrm{x}_1=\\frac{\\mathrm{P}_1}{\\mathrm{P}_{\\text {total }}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d80aee93fa0796dbf8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "What is the volume of a gas at $1.032 \\times 10^5 \\mathrm{Nm}^{-2}$ if it occupies $1 \\mathrm{dm}^3$ of volume at normal temperature and pressure?", "image": null}, "options": [{"id": "e3ra2", "text": "$0.982 \\cdot \\mathrm{dm}^3$", "image": null, "isCorrect": true}, {"id": "uxIED", "text": "$1.3 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "CMfj8", "text": "$1.5 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "LVJlw", "text": "$1.7 \\mathrm{dm}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At normal temperature and pressure (NTP), the pressure is $P_1 = 1.01325 \\times 10^5 \\mathrm{Nm}^{-2}$.<br><br>The initial volume is $V_1 = 1 \\mathrm{dm}^3$.<br><br>The final pressure is $P_2 = 1.032 \\times 10^5 \\mathrm{Nm}^{-2}$.<br><br>Since the temperature remains constant, Boyle's law is applicable:<br><br>$P_1 V_1 = P_2 V_2$<br><br>$V_2 = \\dfrac{P_1 V_1}{P_2}$<br><br>$V_2 = \\dfrac{1.01325 \\times 10^5 \\times 1}{1.032 \\times 10^5}$<br><br>$V_2 \\approx 0.982 \\mathrm{dm}^3$<br><br>Answer: $0.982 \\cdot \\mathrm{dm}^3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213bf0aee93fa0796db36", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "A gas occupies $11.2 \\mathrm{dm}^3$ at 105 kPa What is the volume if pressure is increased to 210 kPa ?", "image": null}, "options": [{"id": "vyydZ", "text": "$5.6 \\mathrm{dm}^3$", "image": null, "isCorrect": true}, {"id": "VSyka", "text": "$16.8 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "02n3b", "text": "$22.4 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "3NgAH", "text": "$33.6 \\mathrm{dm}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using Boyle's law, $P_1 V_1 = P_2 V_2$ at constant temperature.<br><br>Given $P_1 = 105 \\text{ kPa}$, $V_1 = 11.2 \\text{ dm}^3$, and $P_2 = 210 \\text{ kPa}$.<br><br>Substituting the values:<br><br>$105 \\times 11.2 = 210 \\times V_2$<br><br>$V_2 = \\dfrac{105 \\times 11.2}{210}$<br><br>$V_2 = \\dfrac{11.2}{2} = 5.6 \\text{ dm}^3$<br><br>Answer: $5.6 \\mathrm{dm}^3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213760aee93fa0796d8f9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Calculate the volume of gas at 1.25 atmosphere, if volume occupied by gas at 1 atmosphere and at same temperature is 25 mL .", "image": null}, "options": [{"id": "MTScT", "text": "15 mL", "image": null, "isCorrect": false}, {"id": "T2IqO", "text": "20 mL", "image": null, "isCorrect": true}, {"id": "cxFjX", "text": "25 mL", "image": null, "isCorrect": false}, {"id": "kWDcn", "text": "35 mL", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Boyle's law, at constant temperature, $P_1 V_1 = P_2 V_2$.<br><br>Given $P_1 = 1$ atm, $V_1 = 25$ mL, and $P_2 = 1.25$ atm.<br><br>Substituting the values:<br><br>$1 \\times 25 = 1.25 \\times V_2$<br><br>$V_2 = \\dfrac{25}{1.25} = 20$ mL.<br><br>Answer: 20 mL", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213600aee93fa0796d850", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Which of the following graphs explains Boyle's law?", "image": null}, "options": [{"id": "yCB7z", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/YzdLLjwXyPSb4xUCSu3XHwgYwyimSkE_B5GsAx2JfQU.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "qYrMH", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/_x6pb8k9G188ebUFSV9_UPmqn7tSNTToET3Ia6wBlIM.original.fullsize.png\"/><br/>", "image": null, "isCorrect": true}, {"id": "pPCCY", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/QlDPWby_b_1eNenYa0I2XqVkKPpUEILPlyOw7oq--ms.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "uALjm", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/z4-rTGQhbmfXtYl33nrLMW--X4-7mL35E5IVTXJlGOk.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Boyle's law, for a fixed mass of an ideal gas at constant temperature, the pressure is inversely proportional to its volume. <br><br>Mathematically, $P \\propto \\dfrac{1}{V}$ or $PV = \\text{constant}$.<br><br>Since the product $PV$ remains constant at a given temperature, a graph of $PV$ versus $P$ (or $V$) will be a straight line parallel to the pressure (or volume) axis. <br><br>Looking at the given options, the second graph shows $PV$ as a horizontal line against $P$, which correctly represents Boyle's law.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/_x6pb8k9G188ebUFSV9_UPmqn7tSNTToET3Ia6wBlIM.original.fullsize.png\"/><br/>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134f0aee93fa0796d7c8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "How many moles of dioxygen are present in $8.314 \\times 10^{-3} \\mathrm{~m}^3$ of it at 318 K having pressure $3.18 \\times 10^5 \\mathrm{Nm}^{-2} ?\\left(\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right)$", "image": null}, "options": [{"id": "scqWe", "text": "0.1 mole", "image": null, "isCorrect": false}, {"id": "ljqdW", "text": "1.0 mole", "image": null, "isCorrect": true}, {"id": "YMwnL", "text": "1.5 mole", "image": null, "isCorrect": false}, {"id": "yLABj", "text": "2.0 mole", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the ideal gas equation:<br><br>$PV = nRT$<br><br>Given values are:<br>$P = 3.18 \\times 10^5 \\text{ N m}^{-2}$<br>$V = 8.314 \\times 10^{-3} \\text{ m}^3$<br>$T = 318 \\text{ K}$<br>$R = 8.314 \\text{ J K}^{-1} \\text{ mol}^{-1}$<br><br>Substituting the values into the equation:<br><br>$n = \\dfrac{PV}{RT}$<br><br>$n = \\dfrac{3.18 \\times 10^5 \\times 8.314 \\times 10^{-3}}{8.314 \\times 318}$<br><br>$n = \\dfrac{3.18 \\times 10^2}{318}$<br><br>$n = \\dfrac{318}{318} = 1.0 \\text{ mole}$<br><br>Answer: 1.0 mole", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133c0aee93fa0796d731", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Which of the following equations is true for $8.8 \\times 10^{-2} \\mathrm{~kg}$ of carbon dioxide gas?", "image": null}, "options": [{"id": "1AZ6d", "text": "$\\mathrm{PV}=1.5 \\mathrm{RT}$", "image": null, "isCorrect": false}, {"id": "K920T", "text": "$\\mathrm{PV}=\\mathrm{RT}$", "image": null, "isCorrect": false}, {"id": "hRI1M", "text": "$\\quad \\mathrm{PV}=2 \\mathrm{RT}$", "image": null, "isCorrect": true}, {"id": "VVtbi", "text": "$\\quad \\mathrm{PV}=3 \\mathrm{RT}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Mass of $CO_2$ gas $= 8.8 \\times 10^{-2} \\mathrm{~kg} = 88 \\mathrm{~g}$<br><br>Molar mass of $CO_2 = 12 + 2(16) = 44 \\mathrm{~g/mol}$<br><br>Number of moles $n = \\dfrac{88}{44} = 2 \\mathrm{~mol}$<br><br>Using the ideal gas equation $PV = nRT$<br><br>$PV = 2RT$<br><br>Answer: $\\quad \\mathrm{PV}=2 \\mathrm{RT}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626c0279619d9d8a346b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Find the temperature in degree Celsius if volume and pressure of 2 mole ideal gas is $20 \\mathrm{dm}^3$ and 4.926 atmospheres respectively.\n$$\n\\left(\\mathrm{R}=0-0821 \\mathrm{dm}^3 \\mathrm{~atm} \\mathrm{~K} \\mathrm{mol}^{-1}\\right)\n$$", "image": null}, "options": [{"id": "yYRwT", "text": "$273$", "image": null, "isCorrect": false}, {"id": "HcrfT", "text": "$327$", "image": null, "isCorrect": true}, {"id": "ylYz0", "text": "$600$", "image": null, "isCorrect": false}, {"id": "FEDhg", "text": "$453$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to ideal gas equation,\n$$\n\\begin{aligned}\n\\mathrm{PV} & =\\mathrm{nRT} \\\\\n\\therefore \\quad \\mathrm{T} & =\\frac{\\mathrm{PV}}{\\mathrm{nR}}=\\frac{4.926 \\times 20}{12 \\times 0.0821} \\\\\n\\mathrm{~T} & =600 \\mathrm{~K}\n\\end{aligned}\n$$\nTemp. in ${ }^{\\circ} \\mathrm{C}=600-273=327^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262460279619d9d8a3338", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "The volume of a gas is $4 \\mathrm{dm}^3$ at $0^{\\circ} \\mathrm{C}$. Calculate new volume at constant pressure when the temperature is increased by $10^{\\circ} \\mathrm{C}$.", "image": null}, "options": [{"id": "L9XiN", "text": "$2.07 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "vfYzw", "text": "$3.21 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "kvY0K", "text": "$4.14 \\mathrm{dm}^3$", "image": null, "isCorrect": true}, {"id": "cCv0x", "text": "$6.54 \\mathrm{dm}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Charles' law,\n$$\n\\begin{aligned}\n& \\frac{\\mathrm{V}_1}{\\mathrm{~T}_1}=\\frac{\\mathrm{V}_2}{\\mathrm{~T}_2} \\text { (at constant } \\mathrm{P} \\text { and } \\mathrm{n} \\text { ) } \\\\\n& \\mathrm{T}_1=0{ }^{\\circ} \\mathrm{C}=273 \\mathrm{~K} \\\\\n& \\mathrm{~T}_2=10^{\\circ} \\mathrm{C}=283 \\mathrm{~K} \\\\\n& \\frac{4 \\mathrm{dm}^3}{273 \\mathrm{~K}}=\\frac{\\mathrm{V}_2}{283 \\mathrm{~K}} \\\\\n& \\mathrm{~V}_2=\\frac{4 \\times 283}{273}=4.1465 \\mathrm{dm}^3\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262260279619d9d8a322e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "A hot air balloon has volume of $2000 \\mathrm{dm}^3$ at $99^{\\circ} \\mathrm{C}$. What is the new volume if air in balloon cools to $80^{\\circ} \\mathrm{C}$ ?", "image": null}, "options": [{"id": "M0vLP", "text": "$2428.9 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "KcuOy", "text": "$2656.9 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "d2yt9", "text": "$2814.9 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "m4WwI", "text": "$1897.8 \\mathrm{dm}^3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\text { Using Charles' law, } \\\\ & \\frac{\\mathrm{V}_1}{\\mathrm{~T}_1}=\\frac{\\mathrm{V}_2}{\\mathrm{~T}_2} \\\\ \\therefore \\quad & \\frac{2000 \\mathrm{dm}^3}{372 \\mathrm{~K}}=\\frac{\\mathrm{V}_2}{353 \\mathrm{~K}} \\\\ \\therefore \\quad & \\mathrm{V}_2=\\frac{2000 \\times 353}{372}=1897.8 \\mathrm{dm}^3\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262110279619d9d8a3185", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "If $\\mathrm{N}_2$ gas is compressed at 2 atmosphere from $9.0 \\mathrm{~L}$ to $3.0 \\mathrm{~L}$ at $300 \\mathrm{~K}$, find the final pressure at same temperature.", "image": null}, "options": [{"id": "kSvRY", "text": "$1.66 \\mathrm{~atm}$", "image": null, "isCorrect": false}, {"id": "v4HrK", "text": "$3.32 \\mathrm{~atm}$", "image": null, "isCorrect": false}, {"id": "dvRrI", "text": "$6.0 \\mathrm{~atm}$", "image": null, "isCorrect": true}, {"id": "7WJwE", "text": "$9.0 \\mathrm{~atm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Boyle's law, $\\mathrm{P}_1 \\mathrm{~V}_1=\\mathrm{P}_2 \\mathrm{~V}_2$ (at constant $\\mathrm{n}$ and $\\mathrm{T}$ )\n$\\therefore \\quad P_2=\\frac{P_1 V_1}{V_2}=\\frac{2 \\times 9.0}{3.0}=6.0 \\text { bar }$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fd0279619d9d8a30ed", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "What is the volume in $\\mathrm{dm}^3$ occupied by $3 \\mathrm{~mol}$ of ammonia gas at STP?", "image": null}, "options": [{"id": "2DFYk", "text": "$2.24$", "image": null, "isCorrect": false}, {"id": "Kd370", "text": "$22.4$", "image": null, "isCorrect": false}, {"id": "0QzFf", "text": "$56.0$", "image": null, "isCorrect": false}, {"id": "PF3uH", "text": "$67.2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Number of moles of a gas }(\\mathrm{n}) \\\\ & \\quad=\\frac{\\text { Volume of a gas at STP }}{\\text { Molar volume of a gas }} \\\\ & \\therefore \\quad \\text { Volume of ammonia gas at STP } \\\\ & =\\text { Number of moles of the gas }(\\mathrm{n}) \\\\ & \\quad \\times \\text { Molar volume of the gas } \\\\ & =3 \\mathrm{~mol} \\times 22.4 \\mathrm{dm}^3 \\mathrm{~mol}^{-1} \\\\ & =67.2 \\mathrm{dm}^3\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d50279619d9d8a2faf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "What is new temperature of a gas when its initial volume $3 \\mathrm{dm}^3$ at $300 \\mathrm{~K}$ is doubled at constant pressure?", "image": null}, "options": [{"id": "o9TNq", "text": "$450 \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "12d1k", "text": "$600 \\mathrm{~K}$", "image": null, "isCorrect": true}, {"id": "SjM6w", "text": "$750 \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "Gmg4p", "text": "$900 \\mathrm{~K}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\text { Using Charles' law, } \\\\ & \\frac{\\mathrm{V}_1}{\\mathrm{~T}_1}=\\frac{\\mathrm{V}_2}{\\mathrm{~T}_2} \\\\ \\therefore \\quad & \\frac{3 \\mathrm{dm}^3}{300 \\mathrm{~K}}=\\frac{2 \\times 3 \\mathrm{dm}^3}{\\mathrm{~T}_2} \\\\ \\therefore \\quad & \\mathrm{T}_2=\\frac{2 \\times 3 \\times 300}{3}=600 \\mathrm{~K}\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b00279619d9d8a2e8a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "At $0^{\\circ} \\mathrm{C}$ a gas occupies 22.4 liters. What is the temperature in Kelvin to reach the volume of 224 liters?", "image": null}, "options": [{"id": "o7XCL", "text": "$546 K$", "image": null, "isCorrect": false}, {"id": "aT3cV", "text": "$273K$", "image": null, "isCorrect": false}, {"id": "smoQF", "text": "$2730K$", "image": null, "isCorrect": true}, {"id": "WAEdd", "text": "$5460K$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Charles' law, $\\frac{\\mathrm{V}_1}{\\mathrm{~T}_1}=\\frac{\\mathrm{V}_2}{\\mathrm{~T}_2} \\quad$ (at constant $\\mathrm{n}$ and $\\mathrm{P}$ )\n$\\therefore \\quad \\mathrm{T}_2=\\frac{\\mathrm{V}_2 \\times \\mathrm{T}_1}{\\mathrm{~V}_1}=\\frac{224 \\times 273}{22.4}=2730 \\mathrm{~K}$", "i tion": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2603d0279619d9d8a22e0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "A mas occupies $11.2 \\mathrm{dm}^3$ at $105 \\mathrm{kPa}$. What is its volume if pressure is increased to $210 \\mathrm{kPa}$ ?", "image": null}, "options": [{"id": "vcw6m", "text": "$22.4 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "ZeNsd", "text": "$33.6 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "3NSMk", "text": "$5.6 \\mathrm{dm}^3$", "image": null, "isCorrect": true}, {"id": "PwiWI", "text": "$16.8 \\mathrm{dm}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{P}_1=105 \\mathrm{kPa}, \\mathrm{V}_1=11.2 \\mathrm{dm}^3\n$$\n$$\n\\mathrm{P}_2=210 \\mathrm{kPa}, \\mathrm{V}_2=?\n$$\nAccording to Boyle's law, $\\mathrm{P}_1 \\mathrm{~V}_1=\\mathrm{P}_2 \\mathrm{P}_2$\n$$\n\\therefore \\mathrm{V}_2 \\frac{\\mathrm{P}_1 \\mathrm{~V}_2}{\\mathrm{P}_2}=\\frac{105 \\mathrm{kPa} \\times 11.2 \\mathrm{dm}^3}{210 \\mathrm{kPa}}=5.6 \\mathrm{dm}^3\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260290279619d9d8a223d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "Keeping temperature constant the pressure of $11.2 \\mathrm{dm}^3$ of a gas was increased from $105 \\mathrm{kPa}$ to $420 \\mathrm{kPa}$. What is the new volume of gas?", "image": null}, "options": [{"id": "LcCLQ", "text": "$1.4 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "DHjtk", "text": "$7.0 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "BziHi", "text": "$5.6 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "5ipoC", "text": "$2.8\\mathrm{dm}^3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{P}_1 \\mathrm{~V}_1=\\mathrm{P}_2 \\mathrm{~V}_2 \\\\ & 105 \\times 11.2=420 \\times \\mathrm{V}_2 \\\\ & \\mathrm{~V}_2=\\frac{105 \\times 11.2}{420} \\\\ & 2.8 \\mathrm{dm}^3\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260050279619d9d8a211a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "Volume of a balloon at $25^{\\circ} \\mathrm{C}$ and 1 bar pressure is $2 \\cdot 27 \\mathrm{~L}$. If the pressure of the gas in balloon is reduced to $0.227$ bar, what is the rise in volume of a gas?", "image": null}, "options": [{"id": "ad4Pz", "text": "$12.27 \\mathrm{~L}$", "image": null, "isCorrect": false}, {"id": "ezXTa", "text": "$\\quad 7 \\cdot 73 \\mathrm{~L}$", "image": null, "isCorrect": true}, {"id": "OJKTv", "text": "$10 \\mathrm{~L}$", "image": null, "isCorrect": false}, {"id": "FWYNc", "text": "$\\times 4.10 .227 \\mathrm{~L}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$P_{1}=1 \\mathrm{~bar}, \\quad V_{1}=2.27 \\mathrm{~L}$\n$\\mathrm{P}_{2}=0.227 \\mathrm{~bar}, \\quad \\mathrm{V}_{2}=?$\nAccording to Boyle's Law, $P_{1} V_{1}=P_{2} V_{2}$\n$\\therefore V_{2}=\\frac{P_{1} V_{1}}{P_{2}}=\\frac{1 \\times 2.27}{0.227}=10 \\mathrm{~L}$\n$\\therefore$ The rise in volume of gas $=10-2.27=7.73 \\mathrm{~L}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ff00279619d9d8a2070", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "What is the unit of viscosity?", "image": null}, "options": [{"id": "OkvCO", "text": "$\\mathrm{Kg} \\mathrm{s}^{-1}$", "image": null, "isCorrect": false}, {"id": "GWjf3", "text": "$\\mathrm{Nsm}^{-2}$", "image": null, "isCorrect": true}, {"id": "rX5Vo", "text": "$\\mathrm{Kg} \\mathrm{s}^{2}$", "image": null, "isCorrect": false}, {"id": "wlmZS 0.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "If 2 moles of an ideal gas at $546 \\mathrm{~K}$ has volume of $44 \\cdot 8 \\mathrm{~L}$, then what will be it's pressure ? $(\\mathrm{R}=0.082)$", "image": null}, "options": [{"id": "uhTqH", "text": "1.998atm", "image": null, "isCorrect": true}, {"id": "bROIg", "text": "1.098atm", "image": null, "isCorrect": false}, {"id": "6PW27", "text": "2.408atm", "image": null, "isCorrect": false}, {"id": "1xfHk", "text": "3.129atm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D) $\\mathrm{n}=2$ moles $, \\mathrm{T}=546 \\mathrm{~K}, \\quad \\mathrm{~V}=44.8 \\mathrm{~L}$, $\\mathrm{R}=0.082, \\quad \\mathrm{P}=?$\nAccording to ideal gas equation, $\\mathrm{PV}=\\mathrm{nRT} \\quad \\therefore \\mathrm{P}=\\frac{\\mathrm{nRT}}{\\mathrm{V}}$ $\\therefore \\mathrm{P}=\\frac{2 \\times 0.082 \\times 546}{44.8}=1.998 \\mathrm{~atm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fa80279619d9d8a1e3e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "According to Andrews isothermals, the minimum temperature at which carbon dioxide gas obeys Boyles law is", "image": null}, "options": [{"id": "oGX0g", "text": "$32 \\cdot 5^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "sdaVF", "text": "$31 \\cdot 1{ }^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "rrNSM", "text": "$48 \\cdot 1{ }^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "C51kN", "text": "$35.5^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f830279619d9d8a1d15", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "At what new pressure $100 \\mathrm{~mL}$ of a gas at pressure of $720 \\mathrm{~mm}$ will occupy volume of $84 \\mathrm{~mL}$\nkeeping temperature constant?", "image": null}, "options": [{"id": "8IsAd", "text": "$857 \\cdot 14 \\mathrm{~mm}$", "image": null, "isCorrect": true}, {"id": "FQ48M", "text": "$712 \\cdot 14 \\mathrm{~mm}$", "image": null, "isCorrect": false}, {"id": "al70E", "text": "$816 \\cdot 60 \\mathrm{~mm}$", "image": null, "isCorrect": false}, {"id": "YNFhL", "text": "$604 \\cdot 82 \\mathrm{~mm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Boyle's law, $P_{1} V_{1}=P_{2} V_{2}$\n$\\therefore P_{2}=\\frac{P_{1} V_{1}}{V_{2}}=\\frac{720 \\times 100}{84}=857.14 \\mathrm{~mm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f6b0279619d9d8a1c50", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "A certain mass of a gas occupies a volume of $2 \\mathrm{dm}^{3}$ at STP. At what temperature the volume of gas becomes double, keeping the pressure constant?", "image": null}, "options": [{"id": "DnQQz", "text": "$540.15^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "kKTSr", "text": "$400.15^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "vjuV1", "text": "$546 \\cdot 15^{\\circ}$ C", "image": null, "isCorrect": false}, {"id": "Fn1aT", "text": "$273.15^{\\circ}$ C", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{array}{l}\n\\mathrm{V}_{1}=2 \\mathrm{dm}^{3}, \\mathrm{~T}_{1}=273.15 \\mathrm{~K} \\\\\n\\mathrm{~V}_{2}=4 \\mathrm{dm}^{3}, \\mathrm{~T}_{2}=?\n\\end{array}\n$$\nAccording to Charle's law,\n$$\n\\begin{array}{l}\n\\frac{V_{1}}{T_{1}}=\\frac{V_{2}}{T_{2}} \\quad \\therefore T_{2}=\\frac{V_{2} \\times T_{1}}{V_{1}} \\\\\n\\therefore T_{2}=\\frac{4 \\times 273.15}{2}=546.3 \\mathrm{~K}\n\\end{array}\n$$\nNow, $\\mathrm{T} \\mathrm{k}=\\mathrm{t}^{\\circ} \\mathrm{C}+273.15$\n$\\therefore \\mathrm{t}^{\\circ} \\mathrm{C}=\\mathrm{T} \\mathrm{k}-273.15$\n$\\therefore \\mathrm{t}^{\\circ} \\mathrm{C}=546.3-273.15=273.15^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f590279619d9d8a1bbd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "A gas has a volume of $3 \\cdot 4 \\mathrm{~L}$ at $25^{\\circ} \\mathrm{C}$. What is the final temperature if the volume increases to $10 \\cdot 2 \\mathrm{~L}$ at constant pressure.", "image": null}, "options": [{"id": "tyYgd", "text": "$1894 \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "T08Nh", "text": "$694 \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "X9hxn", "text": "$894 \\mathrm{~K}$", "image": null, "isCorrect": true}, {"id": "DeuWq", "text": "$394 \\mathrm{~K}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll}\nV_{1}=3.4 \\mathrm{~L}, & T_{1}=25^{\\circ} \\mathrm{C}=25+273=298 \\mathrm{~K} \\\\\nV_{2}=10.2 \\mathrm{~L}, & T_{2}=?\n\\end{array}$\nAccording to Charle's Law,\n$\\begin{array}{l}\n\\frac{\\mathrm{V}_{1}}{\\mathrm{~T}_{1}}=\\frac{\\mathrm{V}_{2}}{\\mathrm{~T}_{2}} \\text { (at constant } \\mathrm{P} \\text { and } \\mathrm{n} \\text { ) } \\\\\n\\therefore \\mathrm{T}_{2}=\\frac{\\mathrm{V}_{2} \\times \\mathrm{T}_{1}}{\\mathrm{~V}_{1}}=\\frac{10.2 \\mathrm{~L} \\times 298 \\mathrm{~K}}{3.4 \\mathrm{~L}} \\quad \\therefore \\mathrm{T}_{2}=894 \\mathrm{~K}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f490279619d9d8a1b3f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "A certain sample of gas has a volume of $0.2 \\mathrm{~L}$ at one atmosphere pressure and 273.15 K. What is the volume of gas at $273.15^{\\circ} \\mathrm{C}$ at same pressure?", "image": null}, "options": [{"id": "xGkhp", "text": "$2.703 \\mathrm{~L}$", "image": null, "isCorrect": false}, {"id": "sWDfF", "text": "$0.2 \\mathrm{~L}$", "image": null, "isCorrect": false}, {"id": "cZlL9", "text": "$0.4 \\mathrm{~L}$", "image": null, "isCorrect": true}, {"id": "twnl6", "text": "$5.406 \\mathrm{~L}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{V}_{1}=0.2 \\mathrm{~L} \\quad, \\quad \\mathrm{~T}_{1}=237.15 \\mathrm{~K}$\n$\\mathrm{~V}_{2}=? \\quad, \\quad \\mathrm{~T}_{2}=273.15+273.15=546.30 \\mathrm{~K}$\n$\\therefore \\quad$ According to Charle's law,\n$\\frac{\\mathrm{V}_{1}}{\\mathrm{~T}_{1}}=\\frac{\\mathrm{V}_{2}}{\\mathrm{~T}_{2}} \\quad$ (at constant $\\mathrm{P}$ and $\\mathrm{n}$ )\n$\\therefore \\quad \\mathrm{V}_{2}=\\frac{\\mathrm{V}_{1} \\times \\mathrm{T}_{2}}{\\mathrm{~T}_{1}}=\\frac{0.2 \\times 546.30}{273.15}=0.4 \\mathrm{~L}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f3802796
