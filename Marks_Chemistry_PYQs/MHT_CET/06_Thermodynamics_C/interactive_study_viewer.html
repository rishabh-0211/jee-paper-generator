19d9d8a2a76", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "Calculate the change in internal energy of the system if $37.6 \\mathrm{~J}$ of work is done by the system with heat loss of $14.6 \\mathrm{~J}$ ?", "image": null}, "options": [{"id": "lQmcF", "text": "$-52.2 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "dShdp", "text": "$-549 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "SJXZi", "text": "$-12.57 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "IdZDI", "text": "$-23.0 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From I $^{\\text {st }}$ law of thermodynamic\nAccording to $\\mathrm{I}^{\\text {st }}$ law of thermodynamics\n$\\begin{aligned} & \\Delta \\mathrm{E}=\\delta \\mathrm{Q}+\\delta \\mathrm{W} \\\\ & =-14.6+(-37.6) \\\\ & =-52.2 \\mathrm{KJ}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2611a0279619d9d8a29d6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "A gas is allowed to expand in an insulated container against a constant external pressure of 2.5 bar from $4.5 \\mathrm{dm}^3$ to $7 \\times 10^{-3} \\mathrm{~m}^3$. What is the change in internal energy of the gas?", "image": null}, "options": [{"id": "InPw5", "text": "$-625 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "gWCMU", "text": "$-312.5 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "ir2h3", "text": "$-112.3 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "a4g1P", "text": "$-3.25 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Container is insulated\n$\\therefore \\delta Q=0$\nWe know $\\Delta \\mathrm{E}=\\delta \\mathrm{Q}+\\delta \\mathrm{W}$\n$\\begin{aligned} & =0+\\left[-\\mathrm{P}\\left(\\mathrm{V}_2-\\mathrm{V}_1\\right)\\right] \\\\ & =-2.5(7-4.5) \\\\ & =-2.5(2.5) \\times 100 \\\\ & =-625 \\mathrm{~J}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2610c0279619d9d8a2964", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "What is the work done at $300 \\mathrm{~K}$ for the reaction?\n$\\mathrm{SO}_2(\\mathrm{~g})+\\frac{1}{2} \\mathrm{O}_2(\\mathrm{~g}) \\rightarrow \\mathrm{SO}_3(\\mathrm{~g}) ?$\n$($ Given $\\mathrm{R}=8.314) \\mathrm{K}^{-1} \\mathrm{~mol}^{-1}$", "image": null}, "options": [{"id": "uwQQ3", "text": "$-1247.1 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "Bkf38", "text": "$-247 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "RbloQ", "text": "$850.7 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "f9yWX", "text": "$1247 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{W}=\\Delta \\mathrm{n}_{\\mathrm{g}} \\mathrm{RT} \\\\ & =-\\frac{1}{2} \\times 8.314 \\times 300 \\\\ & =-1247.1 \\mathrm{~J}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261060279619d9d8a2935", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "A certain system is exothermic by $260 \\mathrm{~kJ}$ and does $10 \\mathrm{~kJ}$ of work. What is the change in internal energy?", "image": null}, "options": [{"id": "DvSSm", "text": "$-250 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "5OFjQ", "text": "$-540 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "si55o", "text": "$-140 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "CSzsd", "text": "$-270 \\mathrm{~kJ}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\Delta E=8 Q+8 W \\\\ & =-260+(-10) \\\\ & =-270 \\mathrm{KJ}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260fa0279619d9d8a28ce", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "Calculate $\\Delta \\mathrm{U}$ if $2 \\mathrm{~kJ}$ heat is released and $10 \\mathrm{~kJ}$ of work is done on the system.", "image": null}, "options": [{"id": "wUBJA", "text": "$20 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "dn4s3", "text": "$12 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "h7Vlp", "text": "$8 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "NffbT", "text": "$5 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From $\\mathrm{I}^{\\text {st }}$ law of thermodynamics\n$\\begin{aligned} & \\Delta \\mathrm{E}=\\partial \\mathrm{Q}+\\partial \\mathrm{W} \\\\ & =-2+10 \\\\ & =8 \\mathrm{KJ}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260f90279619d9d8a28cd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "An ideal gas is compressed from a volume of $1 \\mathrm{~m}^3$ to $0.5 \\mathrm{~m}^3$ at a pressure of 0.2 bar. what is the value of work done by the gas during compression?", "image": null}, "options": [{"id": "lNZ0D", "text": "$10 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "xN1Ql", "text": "$201.0 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "bBmuG", "text": "$497 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "OD6R6", "text": "$190 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{W}=-\\mathrm{P}\\left(\\mathrm{V}_2-\\mathrm{V}_1\\right) \\\\ & =-0.2(0.5-1) \\mathrm{bar}-\\mathrm{m}^3 \\\\ & =0.1 \\mathrm{bar}-\\mathrm{m}^3 \\\\ & =10 \\mathrm{KJ}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260e50279619d9d8a282b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "If $65 \\mathrm{~kJ}$ of work is done on the system and it releases and it releases $25 \\mathrm{~kJ}$ of heat. What is change in internal energy of the system?", "image": null}, "options": [{"id": "MNzuX", "text": "$16.25 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "PfzJB", "text": "$40 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "3KRpD", "text": "$90 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "tJe77", "text": "$2.6 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\Delta E=\\delta Q+\\delta W \\\\ & =-25+65 \\\\ & =40 \\mathrm{KJ}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260e40279619d9d8a2820", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "Under isothermal condition a gas expands from $0.2 \\mathrm{dm}^3$ to $0.8 \\mathrm{dm}^3$ against a constant pressure of 2 bar at $300 \\mathrm{~K}$. Find the work done by the gas.", "image": null}, "options": [{"id": "axkL3", "text": "$160 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "4690i", "text": "$-120 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "W3qrc", "text": "$-40 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "ESU5C", "text": "$20 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{W} & =-\\mathrm{PdV} \\\\ & =-2(0.8-0.2) \\mathrm{bar}-\\mathrm{dm}^2 \\\\ & =-2(0.6) \\times 10^2 \\mathrm{~J} \\\\ & =-120 \\mathrm{~J}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260d40279619d9d8a27a3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "For isochoric process, the first law of thermodynamics can be expressed as", "image": null}, "options": [{"id": "LreaA", "text": "$\\Delta \\mathrm{U}=\\mathrm{Qv}$", "image": null, "isCorrect": true}, {"id": "ToLZV", "text": "$-\\Delta \\mathrm{U}=\\mathrm{Q}-\\mathrm{P} \\Delta \\mathrm{V}$", "image": null, "isCorrect": false}, {"id": "nnSD2", "text": "$-\\Delta \\mathrm{U}=-\\mathrm{W}$", "image": null, "isCorrect": false}, {"id": "9osqb", "text": "$\\mathrm{W}=-\\mathrm{Q}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For Isochoric process, Volume remains constant.\n$\\begin{aligned}\n& \\Delta \\mathrm{V}=0 \\\\\n& \\mathrm{~W}=-\\mathrm{P} \\Delta \\mathrm{V}=0\n\\end{aligned}$\nFirst Law of thermodynamics,\n$\\Delta \\mathrm{U}=\\mathrm{q}+\\mathrm{W}$\nAt constant volume condition, $\\left(\\mathrm{W}=0, \\mathrm{q}=\\mathrm{q}_{\\mathrm{v}}\\right)$\n$\\Delta \\mathrm{U}=\\mathrm{q}_{\\mathrm{v}}$\nOr $\\Delta \\mathrm{U}=\\mathrm{Q}_{\\mathrm{V}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260cf0279619d9d8a277a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "When certain volume of gas expands against a constant external pressure of $2.40 \\times 10^5 \\mathrm{~Pa}$ at $300 \\mathrm{~K}$ to $2.2 \\times 10^{-3} \\mathrm{~m}^3$. If the work obtained is $-0.048 \\mathrm{~kJ}$. What is the initial volume of the gas?", "image": null}, "options": [{"id": "hGtbM", "text": "$2 \\times 10^{-3} \\mathrm{~m}^3$", "image": null, "isCorrect": true}, {"id": "5s9Et", "text": "$4.5 \\times 10^{-2} \\mathrm{~m}^3$", "image": null, "isCorrect": false}, {"id": "dinxf", "text": "$1.5 \\times 10^{-3} \\mathrm{~m}^3$", "image": null, "isCorrect": false}, {"id": "zIyrI", "text": "$2.8 \\times 10^{-2} \\mathrm{~m}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{W}=-\\mathrm{P}_{\\mathrm{ext}}\\left[\\mathrm{V}_2-\\mathrm{V}_1\\right] \\\\ & -0.048 \\times 1000 \\mathrm{~J}=-2.4 \\times 10^5 \\mathrm{~Pa}\\left[2.2 \\times 10^{-3}-\\mathrm{V}_1\\right] \\mathrm{m}^3 \\\\ & \\frac{48}{2.8} \\times 10^{-5}=2.2 \\times 10^{-3}-\\mathrm{V}_1 \\\\ & \\mathrm{~V}_1=2.2 \\times 10^{-3}-0.2 \\times 10^{-3} \\\\ & \\mathrm{~V}_1=2 \\times 10^{-3} \\mathrm{~m}^3\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ce0279619d9d8a2775", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "What is internal energy change when $62 \\mathrm{~J}$ of work is done on the system and $128 \\mathrm{~J}$ of heat is transferred to surrounding?", "image": null}, "options": [{"id": "9VMDR", "text": "-62 J", "image": null, "isCorrect": false}, {"id": "C74B5", "text": "-190 J", "image": null, "isCorrect": false}, {"id": "8qofu", "text": "-128 J", "image": null, "isCorrect": false}, {"id": "BfFhW", "text": "-66 J", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Work done on the system $=+62 \\mathrm{~J}$\nHeat released to the surrounding $=-128 \\mathrm{~J}$\nFrom first law of thermodynamics,\n$\\begin{aligned}\n& \\Delta \\mathrm{U}=\\mathrm{q}+\\mathrm{W} \\\\\n& =-128+62 \\\\\n& =-66 \\mathrm{~J}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260bf0279619d9d8a26f8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "What is the constant external pressure of an ideal gas when expanded from $2 \\times 10^{-2} \\mathrm{~m}^3$ to $3 \\times 10^{-2} \\mathrm{~m}^3$, if the work done by the gas is $-5.09 \\mathrm{~kJ}$ ?", "image": null}, "options": [{"id": "4d6Jb", "text": "$5.09 \\times 10^5 \\mathrm{Nm}^{-2}$", "image": null, "isCorrect": true}, {"id": "sxSa7", "text": "$1.01 \\times 10^5 \\mathrm{Nm}^{-2}$", "image": null, "isCorrect": false}, {"id": "st794", "text": "$2.02 \\times 10^5 \\mathrm{Nm}^{-2}$", "image": null, "isCorrect": false}, {"id": "aglD9", "text": "$5.60 \\times 10^5 \\mathrm{Nm}^{-2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{W}=-\\mathrm{P}_{\\text {ext }}\\left[\\mathrm{V}_2-\\mathrm{V}_1\\right] \\\\ & \\mathrm{W}=-5.09 \\mathrm{~kJ} \\\\ & =-5090 \\mathrm{~J} \\\\ & -5090=-\\mathrm{P}_{\\text {ext }}\\left[3 \\times 10^{-2}-2 \\times 10^{-2}\\right] \\\\ & 5090=\\operatorname{Pext} \\times 1 \\times 10^{-2} \\\\ & \\mathrm{P}_{\\text {ext }}=509000 \\mathrm{Nm}^{-2} \\\\ & =5.09 \\times 10^5 \\mathrm{Nm}^{-2}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260bc0279619d9d8a26e4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "During a process, system absorbs $710 \\mathrm{~J}$ of heat and increases the internal energy by $460 \\mathrm{~J}$. What is the work performed by system?", "image": null}, "options": [{"id": "o2ZHD", "text": "-250 J", "image": null, "isCorrect": true}, {"id": "4CowF", "text": "-1170 J", "image": null, "isCorrect": false}, {"id": "fG7Fg", "text": "-710 J", "image": null, "isCorrect": false}, {"id": "ygFj6", "text": "-460 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{q}=+710 \\mathrm{~J} \\\\\n& \\Delta \\mathrm{U}=460 \\mathrm{~J}\n\\end{aligned}\n$$\nFrom Ist law of thermodynamics,\n$$\n\\begin{aligned}\n& \\Delta \\mathrm{U}=\\mathrm{q}+\\mathrm{w} \\\\\n& 460=710+\\mathrm{w} \\\\\n& \\mathrm{w}=460-710 \\\\\n& =-250 \\mathrm{~J}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ad0279619d9d8a2669", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "A system does $394 \\mathrm{~J}$ of work on surrounding by absorbing $701 \\mathrm{~J}$ heat. What is the change in internal energy of the system?", "image": null}, "options": [{"id": "rnxzf", "text": "$547 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "fzG87", "text": "$1095 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "plteE", "text": "$307 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "8TD8q", "text": "$394 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{W}=-394 \\mathrm{~J} \\quad$ work done by system $(-)$ ve\n$\\mathrm{q}=+701 \\mathrm{~J} \\quad$ Heat absorbed by system $(+)$ ve From First law of thermodynamics.\n$$\n\\begin{aligned}\n& \\Delta \\mathrm{U}=\\mathrm{q}+\\mathrm{W} \\\\\n& =701-394 \\\\\n& =307 \\mathrm{~J}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ac0279619d9d8a2667", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "A system given out $\\mathrm{x} \\mathrm{J}$ of heat and does $\\mathrm{y} \\mathrm{J}$ of work on it's surrounding. What is the internal energy change?", "image": null}, "options": [{"id": "jrSON", "text": "$-x-y ~ J$", "image": null, "isCorrect": true}, {"id": "7fPmw", "text": "$y-x ~ J$", "image": null, "isCorrect": false}, {"id": "Qzfc1", "text": "$x-y ~ J$", "image": null, "isCorrect": false}, {"id": "JQtJE", "text": "$x+y ~ J$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{q}=-\\mathrm{xJ}$ Heat released by system $(-)$ ve $\\mathrm{w}=-\\mathrm{yJ}$ Work done by system $(-)$ ve From first law of thermodynamics.\n$$\n\\begin{aligned}\n& \\Delta \\mathrm{U}=\\mathrm{q}+\\mathrm{w} \\\\\n& =-\\mathrm{x}-\\mathrm{y} \\mathrm{J}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2609c0279619d9d8a25e1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "A monoatomic ideal gas, initially at temperature ' $\\mathrm{T}_1$ ' is enclosed in a cylinder fitted with a frictionless piston. The gas is allowed to expand adiabatically to a temperature ' $\\mathrm{T}_2$ ' by releasing the piston suddenly $L_1$ and $L_2$ are the lengths of the gas columns before and after the expansion respectively. The $\\frac{\\mathrm{T}_2}{\\mathrm{~T}_1}$ is", "image": null}, "options": [{"id": "sIfzS", "text": "$\\left[\\frac{\\mathrm{L}_1}{\\mathrm{~L}_2}\\right]^{2 / 3}$", "image": null, "isCorrect": true}, {"id": "3fMsn", "text": "$\\left[\\frac{\\mathrm{L}_1}{\\mathrm{~L}_2}\\right]^{1 / 2}$", "image": null, "isCorrect": false}, {"id": "C1WRd", "text": "$\\left[\\frac{\\mathrm{L}_2}{\\mathrm{~L}_1}\\right]^{1 / 2}$", "image": null, "isCorrect": false}, {"id": "dt8L0", "text": "$\\left[\\frac{\\mathrm{L}_2}{\\mathrm{~L}_1}\\right]^{2 / 3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In an adiabatic process $\\mathrm{T}_1 \\mathrm{~V}_1^{-1}=\\mathrm{T}_2 \\mathrm{~V}_2^{-1}$\nFor an ideal mono atomic gas the no of degree of freedom is 3\n$$\n\\begin{aligned}\n& \\mathrm{Y}=1+\\frac{2}{\\mathrm{f}}=1+\\frac{2}{3} \\\\\n& \\frac{\\mathrm{T}_1}{\\mathrm{~T}_2}=\\left(\\frac{\\mathrm{V}_2}{\\mathrm{~V}_1}\\right)^{\\mathrm{Y}-1}=\\left(\\frac{\\mathrm{V}_2}{\\mathrm{~V}_1}\\right)^{2 / 3}=\\left(\\frac{\\mathrm{L}_2}{\\mathrm{~L}_1}\\right)^{2 / 3}\n\\end{aligned}\n$$\nSince volume is proportional to length due to area being constant.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2609b0279619d9d8a25e0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "When $\\mathrm{x} \\mathrm{kJ}$ heat is provided to a system, work equivalent to $\\mathrm{y} \\mathrm{J}$ is done on it. What is internal energy change during this operation?", "image": null}, "options": [{"id": "4bsvq", "text": "$(1000 x+y) J$", "image": null, "isCorrect": true}, {"id": "jN2hc", "text": "$1000(x+y) J$", "image": null, "isCorrect": false}, {"id": "SpwCu", "text": "$(x+1000 y) J$", "image": null, "isCorrect": false}, {"id": "TK9Ju", "text": "$x+y ~ J$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{Q}=+\\mathrm{xkJ}=1000 \\mathrm{x} \\mathrm{J} \\\\\n& \\mathrm{W}=+\\mathrm{y} \\mathrm{J}\n\\end{aligned}\n$$\nFrom I law of Thermodynamics\n$$\n\\begin{aligned}\n& \\Delta U=Q+W \\\\\n& =(1000 x+y) J\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2609a0279619d9d8a25d8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "A gas is allowed to expand against a constant external pressure of 2.5 bar from an initial volume ' $x$ ' $L$ to final volume of $4.5 \\mathrm{~L}$. If amount of work done is $5 \\mathrm{dm}^3$ bar, what is the value of ' $x$ '?", "image": null}, "options": [{"id": "A4lGD", "text": "2.5 L", "image": null, "isCorrect": true}, {"id": "eT4w9", "text": "4.5 L", "image": null, "isCorrect": false}, {"id": "uDLHT", "text": "6.0 L", "image": null, "isCorrect": false}, {"id": "Y7J5S", "text": "1.2 L", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "1.2 Work done $=-5$ bar. $\\mathrm{dm}^3$ (due to expansion work done will be negative)\n$$\n\\mathrm{W}=-\\operatorname{Pext}\\left[\\mathrm{V}_2-\\mathrm{V}_1\\right] \\quad\\left(1 \\mathrm{~L}=1 \\mathrm{dm}^3\\right)\n$$\n$$\n-5 \\text { bar- } \\mathrm{dm}^3=-2.5 \\text { bar }[4.5-\\mathrm{x}] \\mathrm{dm}^3\n$$\n$4.5-\\mathrm{x}=\\frac{5}{2.5}$\n$$\n\\begin{aligned}\n& 4.5-x=2 \\\\\n& x=4.5-2 \\\\\n& x=2.5 L\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260990279619d9d8a25ca", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "In a process, a system performs $238 \\mathrm{~J}$ of work on it's surrounding by absorbing $54 \\mathrm{~J}$ of heat. What is the change in internal energy of system during this operation?", "image": null}, "options": [{"id": "wzF0M", "text": "222 J", "image": null, "isCorrect": false}, {"id": "KvMwT", "text": "-192 J", "image": null, "isCorrect": false}, {"id": "xpA5W", "text": "54 J", "image": null, "isCorrect": false}, {"id": "A6iPb", "text": "-184 J", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Heat absorbed by the system is $(+)$ ve. Work done by the system is (-) ve.\n$$\n\\begin{aligned}\n& \\mathrm{W}=-238 \\mathrm{~J} \\\\\n& \\mathrm{q}=+54 \\mathrm{~J} \\\\\n& \\Delta \\mathrm{U}=\\mathrm{q}+\\mathrm{w} \\\\\n& =54-238 \\\\\n& =-184 \\mathrm{~J}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260760279619d9d8a24af", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "1 mole of an ideal gas expands isothermally and reversibly by decreasing pressure form $210 \\mathrm{kPa}$ to $105 \\mathrm{kPa}$ at $300 \\mathrm{~K}$. What is the work done? $\\left(\\mathrm{R}=8.314 \\mathrm{JK}^{-1} \\mathrm{~mol}^{-1}\\right)$", "image": null}, "options": [{"id": "mgDhb", "text": "1960 J", "image": null, "isCorrect": false}, {"id": "ZcEEh", "text": "864 J", "image": null, "isCorrect": false}, {"id": "mn18N", "text": "1296 J", "image": null, "isCorrect": false}, {"id": "Ofhzt", "text": "1729 J", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For Isothermal reversible process,\n$$\n\\begin{aligned}\n& \\mathrm{W}=-2.303 \\mathrm{nRT} \\log \\frac{\\mathrm{P}_1}{\\mathrm{P}_2} \\\\\n& =-2.303 \\times 1 \\times 8.314 \\times 300 \\log \\frac{210}{105} \\\\\n& =-2.303 \\times 8.314 \\times 300 \\times \\log 2 \\\\\n& =-1729 \\mathrm{~J}(\\log 2=0.3010) \\\\\n& |\\mathrm{W}|=1729 \\mathrm{~J}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260710279619d9d8a2487", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "The expansion of gas having no opposing force is called as", "image": null}, "options": [{"id": "nCZU3", "text": "free expansion", "image": null, "isCorrect": true}, {"id": "AAJXc", "text": "reversible expansion", "image": null, "isCorrect": false}, {"id": "3Kfyq", "text": "adiabatic expansion", "image": null, "isCorrect": false}, {"id": "MyJbT", "text": "isothermal expansion", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The expansion of gas having no opposing force or expansion of gas in vacuum is called as free expansion.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260640279619d9d8a241c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "Two moles of an ideal gas are expanded isothermally from 15 $\\mathrm{dm}^3$ to $20 \\mathrm{dm}^3$. If the amount of work done is $-6 \\mathrm{dm}^3$ bar, find external pressure needed to obtain this work.", "image": null}, "options": [{"id": "FGnd0", "text": "$1.2 \\times 10^5 \\mathrm{~Pa}$", "image": null, "isCorrect": true}, {"id": "OS2LK", "text": "$3.2 \\mathrm{~Pa}$", "image": null, "isCorrect": false}, {"id": "v2PBl", "text": "$8.1 \\times 10^4 \\mathrm{~Pa}$", "image": null, "isCorrect": false}, {"id": "Wqaeb", "text": "$2.4 \\mathrm{~Pa}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{W}=- \\text { Pext. }\\left[\\mathrm{V}_2-\\mathrm{V}_1\\right] \\\\ & -6 \\text { bar. } \\mathrm{dm}^3=- \\text { Pext }[20-15] \\\\ & \\text { Pext }=\\frac{6}{5}=1.2 \\text { bar } \\\\ & \\left(1 \\text { bar }=10^5 \\mathrm{~Pa}\\right) \\\\ & \\text { Pext }=1.2 \\times 10^5 \\mathrm{~Pa}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260610279619d9d8a2402", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "When 1 mole of gas is heated at constant volume, the temperature rises form $273 \\mathrm{~K}$ to $546 \\mathrm{~K}$. If heat supplied to the gas is $\\mathrm{xJ}$, then find the correct statement from following.", "image": null}, "options": [{"id": "AScDP", "text": "$\\mathrm{Q}=\\Delta \\mathrm{U}=\\mathrm{x}, \\mathrm{W}=0$", "image": null, "isCorrect": true}, {"id": "hmsHI", "text": "$\\mathrm{Q}=\\mathrm{W}=\\mathrm{x} J, \\Delta \\mathrm{V}=0$", "image": null, "isCorrect": false}, {"id": "tYaPB", "text": "$\\Delta \\mathrm{V}=0, \\mathrm{Q}=\\mathrm{W}=-\\mathrm{x} J$", "image": null, "isCorrect": false}, {"id": "YG46C", "text": "$\\mathrm{Q}=-\\mathrm{W}=\\mathrm{x} J, \\Delta \\mathrm{V}=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{W}=- \\text { Pext. } \\Delta \\mathrm{V}\n$$\nDue to constant volume $\\Delta \\mathrm{V}=0, \\mathrm{~W}=0$\n$$\nq=x J\n$$\nFirst law of thermodynamics,\n$$\n\\begin{aligned}\n& \\Delta \\mathrm{U}=\\mathrm{q}+\\mathrm{w} \\\\\n& \\Delta \\mathrm{U}=\\mathrm{xJ}=\\mathrm{q}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604e0279619d9d8a2369", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "A gas is allowed to expand in an insulated container against a constant external pressure of $2.5 \\mathrm{~atm}$ from $2.5 \\mathrm{~L}$ to $4.5 \\mathrm{~L}$, the change in internal energy of the gas in joules is", "image": null}, "options": [{"id": "AWH1y", "text": "$-836.3 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "iPw4W", "text": "$-1136.2 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "wQc9h", "text": "$-450 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "nfYgI", "text": "$-506.5 \\mathrm{~J}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{q}=0$ due to insulated container From first law of thermodynamics,\n$$\n\\begin{aligned}\n& \\Delta \\mathrm{U}=\\mathrm{q}+\\mathrm{w} \\\\\n& \\mathrm{W}=-\\operatorname{Pext}\\left[\\mathrm{V}_2-\\mathrm{V}_1\\right] \\\\\n& =-2.5[4.5-2.5] \\mathrm{atm}-\\mathrm{L} \\\\\n& =-2.5 \\times 2 \\mathrm{~atm}-\\mathrm{L} \\\\\n& =-5 \\times 101.3 \\mathrm{~J} \\\\\n& =-506.5 \\mathrm{~J} \\\\\n& \\Delta \\mathrm{U}=\\mathrm{q}+\\mathrm{w} \\\\\n& =0-506.5 \\\\\n& =-506.5 \\mathrm{~J}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604c0279619d9d8a2359", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "What is the work done when a gas is compressed from $2.5 \\times$ $10^{-2} \\mathrm{~m}^3$ to $1.3 \\times 10^{-2} \\mathrm{~m}^3$ at constant external pressure of 4.05 bar?", "image": null}, "options": [{"id": "LK5HD", "text": "$4050 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "xYMQy", "text": "$4400 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "bYCe5", "text": "$4200 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "h3Ng6", "text": "$4860 \\mathrm{~J}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{W}=-\\operatorname{Pext}\\left[\\mathrm{V}_2-\\mathrm{V}_1\\right] \\\\\n& =-4.05\\left[1.3 \\times 10^{-2}-2.5 \\times 10^{-2}\\right] \\\\\n& =4.05 \\times 1.2 \\times 10^{-2}=4.86 \\times 10^{-2} \\mathrm{bar}-\\mathrm{m}^3 \\\\\n& \\left(1 \\mathrm{bar}=10^5 \\mathrm{~Pa}, 1 \\mathrm{~Pa}-\\mathrm{m}^3=1 \\mathrm{~J}\\right) \\\\\n& \\mathrm{W}=4.86 \\times 10^{-2} \\times 10^5 \\mathrm{~Pa}-\\mathrm{m}^2 \\\\\n& =4860 \\mathrm{~J}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2603d0279619d9d8a22e3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "An ideal gas on isothermal reversible compression from $10 \\mathrm{~L}$ to $5 \\mathrm{~L}$ performs $1730 \\mathrm{~J}$ of work at $300 \\mathrm{~K}$. Calculate number of moles of gas involved in compression? $\\left(\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right)$", "image": null}, "options": [{"id": "POh56", "text": "2.5", "image": null, "isCorrect": false}, {"id": "EAD9j", "text": "2", "image": null, "isCorrect": false}, {"id": "lIxF2", "text": "1", "image": null, "isCorrect": true}, {"id": "RvM4z", "text": "3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{V}_1=10 \\mathrm{~L}, \\mathrm{~V}_2=5 \\mathrm{~L}, \\mathrm{~W}=1730 \\mathrm{~J}, \\mathrm{~T}=300 \\mathrm{~K}, \\mathrm{R}=8.314 \\mathrm{JK}^{-1} \\mathrm{~mol}^{-1}, \\mathrm{n} \\\\\n& =? \\\\\n& \\mathrm{~W}_{\\max }=-2.303 \\mathrm{nRT} \\log _{10} \\frac{\\mathrm{V}_2}{\\mathrm{~V}_1} \\\\\n& \\therefore 1730 \\mathrm{~J}=-2.303 \\mathrm{n} \\times 8.314 \\mathrm{JK}^{-1} \\mathrm{~mol}^{-1} \\times 300 \\mathrm{~K} \\times \\log _{10}\\left(\\frac{5}{10}\\right) \\\\\n& \\therefore \\mathrm{n}=\\frac{1730 \\mathrm{~J}}{-2.303 \\times 8.314 \\mathrm{JK}^{-1} \\mathrm{mo}^{-1} \\times 300 \\mathrm{~K} \\times \\log _{10}(0.5)} \\\\\n& \\therefore \\mathrm{n}=\\frac{1730}{-5744.14 \\times(-0.3010)} \\mathrm{mol} \\\\\n& \\therefore \\mathrm{n}=\\frac{1730}{1729} \\approx 1 \\mathrm{~mol}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260390279619d9d8a22c2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "Which of the following reactions shows work of compression?", "image": null}, "options": [{"id": "HOKj0", "text": "$\\mathrm{NH}_{3(\\mathrm{~g}) t": false}, {"id": "dqJv8", "text": "total energy of final state only", "image": null, "isCorrect": false}, {"id": "wiZOW", "text": "number of steps involved in system", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Internal energy is state function. Its change will depend only on initial and final states of a system.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260180279619d9d8a21b1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "An ideal gas expands isothermally and reversibly from $10 \\mathrm{~m}^{3}$ to $20 \\mathrm{~m}^{3}$ at $300 \\mathrm{~K}$ performing $5 \\cdot 187 \\mathrm{~kJ}$ of work on surrrounding. Calculate number of moles of gas undergoing expansion? $\\left(\\mathrm{R}=8 \\cdot 314 \\mathrm{JK}^{-1} \\mathrm{~mol}^{-1}\\right.$ )", "image": null}, "options": [{"id": "ZGgpU", "text": "1.5", "image": null, "isCorrect": false}, {"id": "VlMCi", "text": "2", "image": null, "isCorrect": false}, {"id": "i9FtL", "text": "3", "image": null, "isCorrect": true}, {"id": "0qe6c", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{V}_{1}=10 \\mathrm{~m}^{3}, \\mathrm{~V}_{2}=20 \\mathrm{~m}^{3}, \\mathrm{~T}=300 \\mathrm{~K}$\n$\\mathrm{W}_{\\max }=-5.187 \\mathrm{~kJ}=-5187 \\mathrm{~J}, \\mathrm{n}=?$\n$\\mathrm{W}_{\\max }=-2.303 \\mathrm{~nRT} \\log _{10} evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260070279619d9d8a212d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "What is the work done when 2 mole of an ideal gas are expanded isothermally and reversibly from $5 \\mathrm{~m}^{3}$ to $10 \\mathrm{~m}^{3}$ at $300 \\mathrm{~K} ?\\left(\\mathrm{R}=8 \\cdot 314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right)$", "image": null}, "options": [{"id": "SNtXD", "text": "$-34.58 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "b1LCc", "text": "$3 .458 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "IotCm", "text": "$-1.728 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "RVt10", "text": "$-3 \\cdot 458 \\mathrm{k}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{n}=2$ mole, $\\quad V_{1}=5 \\mathrm{~m}^{3}, V_{2}=10 \\mathrm{~m}^{3}$\n$\\mathrm{T}=300 \\mathrm{~K}, \\quad \\mathrm{R}=8.314 \\mathrm{~JK}^{-1} \\mathrm{~mol}^{-1}$\n$\\mathrm{W}_{\\max }=-2.303 \\mathrm{nRT} \\log _{10} \\frac{\\mathrm{V}_{2}}{\\mathrm{~V}_{1}}$\n$\\therefore W_{\\max }=-2.303 \\times 2 \\times 8.314 \\times 300 \\log _{10} \\frac{10}{5}$\n$=-3457.97 \\mathrm{~J}$\n$\\therefore \\mathrm{W}_{\\max }=-3.458 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260070279619d9d8a2126", "type": "singleCorrect", "level": : null}, "options": [{"id": "1cSbe", "text": "$497.5 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "jRZPa", "text": "$99.50 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "hxGFZ", "text": "$248.7 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "xcyq2", "text": "$49 \\cdot 75 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$=-499 \\mathrm{KJ}$\n$\\mathrm{n}=2$ moles\n$\\mathrm{V}_{1}=5 \\mathrm{~m}^{3}$\n$\\mathrm{~V}_{2}=1 \\mathrm{dm}^{3}=10^{-2} \\mathrm{~m}^{3}$\n$\\mathrm{~T}_{1}=300 \\mathrm{~K}$\n$\\mathrm{P}=100 \\mathrm{KP}_{\\mathrm{a}}=10^{5} \\mathrm{P}_{\\mathrm{a}}$\nwork done $=-\\mathrm{P} \\Delta \\mathrm{V}$\n$\\quad=-10^{5}\\left(\\mathrm{~V}_{2}-\\mathrm{V}_{1}\\right)$\n$\\quad=-10^{5}\\left(10^{-2}-5\\right)$\nwork done $=-499 \\mathrm{KJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb70279619d9d8a1eae", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "An ideal gas expands isothermally and reversibly from $10 \\mathrm{~m}^{3}$ to $20 \\mathrm{~m}^{3}$ at $300 \\mathrm{~K}$, performing $5 \\cdot 187 \\mathrm{~kJ}$ of work on surrounding, calculate number of moles of gas used?", "image": null}, "options": [{"id": "SVj2K", "text": "1", "image": null, "isCorrect": false}, {"id": "NG4hB", "text": "3", "image": null, "isCorrect": true}, {"id": "L43lx", "text": "2", "image": null, "isCorrect": false}, {"id": "6MnxX", "text": "1.5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\n$\\begin{array}{l}\nV_{1}=10 \\mathrm{~m}^{3}=10 \\times 10^{3} \\mathrm{dm}^{3} \\\\\nV_{2}=20 \\mathrm{~m}^{3}=20 \\times 10^{3} \\mathrm{dm}^{3}\n\\end{array}$\n$T=300 K, W=-5.187 \\mathrm{~kJ}=-5187 \\mathrm{~J}$\n$W=-2.303 \\mathrm{nRT} \\log \\frac{V_{2}}{V_{1}}$\n$\\therefore-5187=-2.303 \\times n \\times 8.314 \\times 300 \\times \\log _{10} \\frac{20 \\times 10^{3}}{10 \\times 10^{3}}$\n$\\therefore n=\\frac{5187}{2.303 \\times 8.314 \\times 300 \\times 0.301}$\n$\\therefore n=3$ moles", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb60279619d9d8a1ea9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "A sample of gas absorbs $4000 \\mathrm{~kJ}$ of heat and surrounding does $2000 \\mathrm{~J}$ of work on sample. What is the value of $\\Delta \\mathrm{U}$ ?", "image": null}, "options": [{"id": "xjhuz", "text": "$2000 \\mathrm{kJ}$", "image": null, "isCorrect": false}, {"id": "DZi3k", "text": "$4002 \\mathrm{kJ}$", "image": null, "isCorrect": true}, {"id": "dHF3U", "text": "$4000 \\mathrm{kJ}$", "image": null, "isCorrect": false}, {"id": "Zfdba", "text": "$6000 \\mathrm{kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\n$Q=+4000 \\mathrm{~ sVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "Calculate the amount of work done during isothermal expansion of a gas from a volume of $4 \\mathrm{dm}^{3}$ to $6 \\mathrm{dm}^{3}$ against a constant external pressure of 3 atmosphere?", "image": null}, "options": [{"id": "4Swm9", "text": "$-30 \\cdot 4 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "2lZtp", "text": "$-60 \\cdot 8 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "me8al", "text": "$-607 \\cdot 8 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "myVJa", "text": "$-6 \\cdot 0 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{V}_{1}=4 \\mathrm{dm}^{3}, & \\mathrm{~V}_{2}=6 \\mathrm{dm}^{3}, \\quad \\mathrm{P}_{\\mathrm{ex}}=3 \\mathrm{~atm} \\\\ \\text { Now, } \\mathrm{W}=&-\\mathrm{P}_{\\mathrm{ex}}\\left(\\mathrm{V}_{2}-\\mathrm{V}_{1}\\right)=-3(6-4) \\\\=&-6 \\mathrm{~L} . \\mathrm{atm}=-6 \\times 101.3 \\mathrm{~J} \\\\ \\mathrm{~W}=&-607.8 \\mathrm{~J} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f5c0279619d9d8a1bd9", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "In an isothermal and reversible process, $1 \\cdot 6 \\times 10^{-2} \\mathrm{~kg} \\mathrm{O}_{2}$ expands from $10 \\mathrm{dm}^{3}$ to $100 \\mathrm{dm}^{3}$ at $300 \\mathrm{~K}$, work done in the process is $(\\mathrm{R}=8.314 \\mathrm{~J})$", "image": null}, "options": [{"id": "ccElv", "text": "$-1436 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "eILb2", "text": "$-5744 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "pWdKC", "text": "$-4308 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "7LQoS", "text": "$-2872 \\mathrm{~J}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{V}_{1}=10 \\mathrm{dm}^{3} \\quad, \\mathrm{~V}_{2}=100 \\mathrm{dm}^{3}, \\quad \\mathrm{~T}=300 \\mathrm{~K}$,\n$\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}, \\quad \\mathrm{~m}_{\\mathrm{O}_{2}}=1.6 \\times 10^{-2} \\mathrm{~kg}=16 \\mathrm{~g}$\n$\\therefore \\quad \\mathrm{n}=\\frac{\\mathrm{m}_{\\mathrm{O}_{2}}}{\\mathrm{M}_{\\mathrm{O}_{2}}}=\\frac{16}{32}=0.5 \\mathrm{~mol}$\nFor isothermal and reversible process,\n$\\begin{aligned}\nW_{\\max } &=-2.303 \\mathrm{nRT} \\log _{10} \\frac{V_{2}}{V_{1}} \\\\\n\\therefore W_{\\max } &=-2.303 \\times 0.5 \\times 8.314 \\times 300 \\times \\log _{10} \\frac{100}{10}=-2872 \\mathrm{~J}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f330279619d9d8a1a8f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "When 2 moles of an ideal gas are expanded isothermally from a volume of $12.5 \\mathrm{~L}$ to 15.0 L against constant external pressure of $760 \\mathrm{~mm} \\mathrm{Hg}$. Calculate the amount of work done in joule?", "image": null}, "options": [{"id": "qCxFj", "text": "$-253 \\cdot 25 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "3LwF1", "text": "$-190 \\cdot 0 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "Quzaa", "text": "$-1924 \\cdot 0 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "qWQPb", "text": "$-25 \\cdot 325 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{n} &=2 \\mathrm{~mol}, \\quad \\mathrm{~V}_{1}=12.5 \\mathrm{~L}=12.5 \\times 10^{-3} \\mathrm{~m}^{3}, \\quad \\mathrm{~V}_{2}=15.0 \\mathrm{~L}=15.0 \\times 10^{-3} \\mathrm{~m}^{3}, \\\\ \\mathrm{P} &=760 \\mathrm{~mm} \\text { of } \\mathrm{Hg}=1.013 \\times 10^{5} \\mathrm{Nm}^{-2} \\\\ \\mathrm{~W} &=-\\mathrm{P}_{\\mathrm{ext}}\\left(\\mathrm{V}_{2}-\\mathrm{V}_{1}\\right)=-1.013 \\times 10^{5}(15.0-12.5) 10^{-3} \\\\ &=-2.5325 \\times 10^{5} \\times 10^{-3} \\\\ \\therefore \\quad \\mathrm{W} &=-253.25 \\mathrm{~J} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ee80279619d9d8a183c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "Three moles of an ideal gas are expanded isothermally fro > <mi>O</mi> <mn>2</mn> </msub> <mrow><mo>(</mo> <mi>g</mi> <mo>)</mo></mrow><mo>→</mo><mi>C</mi><msub> <mi>O</mi> <mn>2</mn> </msub> <mrow><mo>(</mo> <mi>g</mi> <mo>)</mo></mrow><mo>+</mo><mn>2</mn><msub> <mi>H</mi> <mn>2</mn> </msub> <mi>O</mi><mrow><mo>(</mo> <mi>l</mi> <mo>)</mo></mrow></mrow> </math><br />Amount of work done&nbsp;<math><mo>=</mo><mo>-</mo><mo>∆</mo><mi>n</mi><mi>R</mi><mi>T</mi></math><br />1 mole of methane reacts with 2 moles of oxygen to produce 2 moles of <math><mi>C</mi><msub><mrow><mi>O</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br />Hence, 0.5 mole of <math><mi>C</mi><msub><mrow><mi>H</mi></mrow><mrow><mn>4</mn></mrow></msub></math> reacts with 1 mole of <math><msub><mrow><mi>O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> to produce 1 mole of <math><mi>C</mi><msub><mrow><mi>O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>.<br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msub><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo></math> moles of reactants = 1.5<br /><math><msub><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo></math> moles of product = 1<br /><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mo>∆</mo><mi>n</mi><mo>=</mo><msub><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><msub><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>1</mn><mo>-</mo><mn>1.5</mn><mo>=</mo><mo>-</mo><mn>0.5</mn></math><br /><math><mi>w</mi><mo>=</mo><mo>-</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>0.5</mn></mrow></mfenced><mo>×</mo><mn>300</mn><mo>×</mo><mn>8.314</mn><mi>&nbsp;</mi><mi>J</mi><msup><mrow><mi>K</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mi>&nbsp;</mi><mi>m</mi><mi>o</mi><msup><mrow><mi>l</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math><br /><math><mo>=</mo><mo>+</mo><mn>2494</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">J</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eb30279619d9d8a1693", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "Mathematical equation of first law of thermodynamics for an isochoric process is", "image": null}, "options": [{"id": "Vo4Jw", "text": "<math><mo>∆</mo><mi>U</mi><mo>=</mo><msub><mrow><mi>q</mi></mrow><mrow><mi>v</mi></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "bcRTB", "text": "<math><mo>-∆</mo><mi>U</mi><mo>=</mo><msub><mrow><mi>q</mi></mrow><mrow><mi>v</mi></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "b2pqF", "text": "<math><mi>q</mi><mo>=</mo><mo>-</mo><mi>W</mi></math>", "image": null, "isCorrect": false}, {"id": "DeHyS", "text": "<math><mo>∆</mo><mi>U</mi><mo>=</mo><mi>W</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mo>∆</mo><mi>U</mi><mo>=</mo><msub><mrow><mi>q</mi></mrow><mrow><mi>v</mi></mrow></msub></math>  is the mathematical equation of first law of thermodynamics for isochoric process.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7d0279619d9d8a14db", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The pressure of a gas is $100 \\mathrm{kPa}$. If it is compressed from $1 \\mathrm{~m}^{3}$ to $10 \\mathrm{dm}^{3}$, find the work done.", "image": null}, "options": [{"id": "zFaHA", "text": "$990 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "nwrh3", "text": "$9990 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "Z9EtQ", "text": "$9900 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "zVn7D", "text": "$99000 \\mathrm{~J}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given,\n$$\n\\text { pressure, } p=100 \\mathrm{kPa}=10^{5} \\mathrm{~Pa}\n$$\nInitial volume, $V_{1}=1 \\mathrm{~m}^{3}$\n$$\n\\text { Final volume, } \\begin{aligned}\nV_{2} &=10 \\times 10^{-3} \\mathrm{~m}^{3}=10^{-2} \\mathrm{~m}^{3} \\\\\nW &=p \\Delta V \\\\\n&=10^{5}\\left(1-10^{-2}\\right)=99,000 \\mathrm{~J}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e680279619d9d8a142a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "$16 \\mathrm{~g}$ of oxygen gas expands isothermally and reversibly at $300 \\mathrm{~K}$ from $10 \\mathrm{dm}^{3}$ to $100 \\mathrm{dm}^{3}$. The work done is (in $J$ )", "image": null}, "options": [{"id": "PoiXZ", "text": "zero", "image": null, "isCorrect": false}, {"id": "P7iV7", "text": "$-2875 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "ES93U", "text": "$+2875 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "hPH2C", "text": "infinite", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} W &=-2.303 \\mathrm{nRT} \\log \\frac{V_{2}}{V_{1}} \\\\ &=-2.303 \\times \\frac{16}{32} \\times 8.314 \\times 300 \\log \\frac{100}{10} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e680279619d9d8a1429", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "At the same conditions of pressure, volume and temperature, work done is maximum for which gas if all gases have equal masses?", "image": null}, "options": [{"id": "aPym4", "text": "$\\mathrm{NH}_{3}$", "image": null, "isCorrect": true}, {"id": "SdnfF", "text": "$\\mathrm{N}_{2}$", "image": null, "isCorrect": false}, {"id": "f1VD1", "text": "$\\mathrm{Cl}_{2}$", "image": null, "isCorrect": false}, {"id": "ppTBE", "text": "$\\mathrm{H}_{2} \\mathrm{~S}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When $p, V$ and $T$ are same and mass is also same, work done depends only upon molecular mass. $W \\propto \\frac{1}{M}($ where, $M=$ molecular mass $)$\nAmong the given gases, $\\mathrm{NH}_{3}$ has lowest molecular mass, so work done is maximum for it.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e670279619d9d8a1427", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "In...... process, work is done at the expense of internal energy.", "image": null}, "options": [{"id": "snxlm", "text": "isothermal", "image": null, "isCorrect": false}, {"id": "Mu2ZC", "text": "isochoric", "image": null, "isCorrect": false}, {"id": "axDkq", "text": "adiabatic", "image": null, "isCorrect": true}, {"id": "OEaOZ", "text": "isobaric", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that\n$$\n\\Delta E=Q+W\n$$\nIf heat supplied from the surrounding, $Q=0$\n$\\therefore$\n$\\Delta E=W$\nie, work is done at the expense of only internal energy and $Q=0$ for adiabatic process.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a2632b0279619d9d8a3c9e", "title": "Laws of Thermochemistry and Enthalpy Change", "totalQuestions": 116, "questions": [{"_id": "6abb88d215a9fc0fc8c14746", "type": "singleCorrect", "question": {"text": "Find the entropy change of the surrounding if the standard enthalpy of formation of a substance is $-447$ kJ mol$^{-1}$", "image": null}, "options": [{"id": "uevRH", "label": "A", "text": "$1500$ J K$^{-1}$", "isCorrect": true, "image": null}, {"id": "N9g7W", "label": "B", "text": "$-1500$ J K$^{-1}$", "isCorrect": false, "image": null}, {"id": "m53ah", "label": "C", "text": "$1000$ J K$^{-1}$", "isCorrect": false, "image": null}, {"id": "aBsqF", "label": "D", "text": "$-1000$ J K$^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The standard enthalpy of formation of the substance is given as $\\Delta H_{sys} = -447$ kJ mol$^{-1} = -447000$ J mol$^{-1}$.<br><br>The standard temperature is $T = 298$ K.<br><br>The heat absorbed by the surrounding is equal to the heat released by the system:<br><br>$q_{surr} = -\\Delta H_{sys} = -(-447000) = 447000$ J mol$^{-1}$<br><br>The entropy change of the surrounding is given by:<br><br>$\\Delta S_{surr} = \\dfrac{q_{surr}}{T}$<br><br>$\\Delta S_{surr} = \\dfrac{447000}{298} = 1500$ J K$^{-1}$ mol$^{-1}$<br><br>Answer: $1500$ J K$^{-1}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88d215a9fc0fc8c14745", "type": "singleCorrect", "question": {"text": "Calculate the amount of heat evolved when $33$ g. $\\text{CO}_2(g)$ formed if the reaction is<br>$\\text{CH}_2\\text{O}(g) + \\text{O}_2(g) \\rightarrow \\text{CO}_2(g) + \\text{H}_2\\text{O}(g);\\ \\Delta H = -527$ kJ", "image": null}, "options": [{"id": "Xec9B", "label": "A", "text": "$527$ kJ", "isCorrect": false, "image": null}, {"id": "KZTLS", "label": "B", "text": "$395.3$ kJ", "isCorrect": true, "image": null}, {"id": "hrFCc", "label": "C", "text": "$263.5$ kJ", "isCorrect": false, "image": null}, {"id": "8PcRo", "label": "D", "text": "$131.8$ kJ", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "From the given balanced chemical equation, the formation of $1$ mole of $\\text{CO}_2$ releases $527$ kJ of heat.<br><br>Molar mass of $\\text{CO}_2 = 12 + 2 \\times 16 = 44$ g/mol.<br><br>Number of moles of $\\text{CO}_2$ in $33$ g = $\\dfrac{33}{44} = 0.75$ mol.<br><br>Heat evolved for $0.75$ mol of $\\text{CO}_2$ = $0.75 \\times 527$ kJ = $395.25$ kJ $\\approx 395.3$ kJ.<br><br>Answer: $395.3$ kJ", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a115a9fc0fc8c14583", "type": "singleCorrect", "question": {"text": "Evaluate the standard enthalpy of formation of $\\text{C}_2\\text{H}_4$ in kJ/mol from the following data,<br>$\\text{C}_2\\text{H}_{4(g)} + 3\\text{O}_{2(g)} \\rightarrow 2\\text{CO}_{2(g)} + 2\\text{H}_2\\text{O}_{(l)}$ $\\Delta_r H^0 = -1411$ kJ/mol<br>$\\Delta_f H^0 (\\text{CO}_2) = -393$ kJ/mol<br>$\\Delta_f H^0 (\\text{H}_2\\text{O}) = -285$ kJ/mol", "image": null}, "options": [{"id": "Ebwtm", "label": "A", "text": "$1195$ kJ/mol", "isCorrect": false, "image": null}, {"id": "1wEQ5", "label": "B", "text": "$-1195$ kJ/mol", "isCorrect": false, "image": null}, {"id": "56C0t", "label": "C", "text": "$55$ kJ/mol", "isCorrect": true, "image": null}, {"id": "I6Z9v", "label": "D", "text": "$-52$ kJ/mol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The standard enthalpy of reaction is given by:<br><br>$\\Delta_r H^0 = \\sum \\Delta_f H^0 (\\text{products}) - \\sum \\Delta_f H^0 (\\text{reactants})$<br><br>For the given combustion reaction:<br><br>$\\Delta_r H^0 = [2 \\Delta_f H^0 (\\text{CO}_2) + 2 \\Delta_f H^0 (\\text{H}_2\\text{O})] - [\\Delta_f H^0 (\\text{C}_2\\text{H}_4) + 3 \\Delta_f H^0 (\\text{O}_2)]$<br><br>Substituting the given values and knowing that $\\Delta_f H^0 (\\text{O}_2) = 0$:<br><br>$-1411 = [2(-393) + 2(-285)] - [\\Delta_f H^0 (\\text{C}_2\\text{H}_4) + 0]$<br><br>$-1411 = [-786 - 570] - \\Delta_f H^0 (\\text{C}_2\\text{H}_4)$<br><br>$-1411 = -1356 - \\Delta_f H^0 (\\text{C}_2\\text{H}_4)$<br><br>$\\Delta_f H^0 (\\text{C}_2\\text{H}_4) = -1356 + 1411 = 55 \\text{ kJ/mol}$<br><br>Answer: $55$ kJ/mol", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a115a9fc0fc8c14582", "type": "singleCorrect", "question": {"text": "Find the value of $\\Delta_{(sub)}H$ for water if, enthalpy of fusion of water is $6.0$ kJ mol$^{-1}$ and enthalpy of vapourisation is $45.0$ kJ mol$^{-1}$", "image": null}, "options": [{"id": "1l6xO", "label": "A", "text": "$-51.0$ kJ", "isCorrect": false, "image": null}, {"id": "guK6S", "label": "B", "text": "$-41.0$ kJ", "isCorrect": false, "image": null}, {"id": "ZNvQx", "label": "C", "text": "$41.0$ kJ", "isCorrect": false, "image": null}, {"id": "MTANn", "label": "D", "text": "$51.0$ kJ", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to Hess's Law, the enthalpy of sublimation is the sum of the enthalpy of fusion and the enthalpy of vaporization.<br><br>$\\Delta_{sub}H = \\Delta_{fus}H + \\Delta_{vap}H$<br><br>Substituting the given values:<br><br>$\\Delta_{sub}H = 6.0 + 45.0 = 51.0$ kJ mol$^{-1}$<br><br>Answer: $51.0$ kJ", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885215a9fc0fc8c14296", "type": "singleCorrect", "question": {"text": "Calculate the standard enthalpy of combustion of $\\text{C}_2\\text{H}_2(g)$,<br>$\\text{C}_2\\text{H}_2(g) + 5/2\\,\\text{O}_2(g) \\rightarrow 2\\text{CO}_2(g) + \\text{H}_2\\text{O}(l)$<br>$[\\Delta_f H^0(\\text{CO}_2) = -390$ kJ $\\text{mol}^{-1}$, $\\Delta_f H^0(\\text{H}_2\\text{O}) = -285$ kJ $\\text{mol}^{-1}$ and $\\Delta_f H^0(\\text{C}_2\\text{H}_2) = 225$ kJ $\\text{mol}^{-1}]$", "image": null}, "options": [{"id": "qNL9Z", "label": "A", "text": "$\\Delta_c H^0\\,(\\text{C}_2\\text{H}_2) = -1290$ kJ $\\text{mol}^{-1}$", "isCorrect": true, "image": null}, {"id": "V0HoX", "label": "B", "text": "$\\Delta_c H^0(\\text{C}_2\\text{H}_2) = -645$ kJ $\\text{mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "k3OZ5", "label": "C", "text": "$\\Delta_c H^0(\\text{C}_2\\text{H}_2) = -1935$ kJ $\\text{mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "ft4T5", "label": "D", "text": "$\\Delta_c H^0(\\text{C}_2\\text{H}_2) = -2580$ kJ $\\text{mol}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The standard enthalpy of combustion is given by the difference between the sum of standard enthalpies of formation of products and reactants.<br><br>$\\Delta_c H^0 = \\sum \\Delta_f H^0(\\text{products}) - \\sum \\Delta_f H^0(\\text{reactants})$<br><br>For the given reaction:<br><br>$\\Delta_c H^0 = [2 \\Delta_f H^0(\\text{CO}_2) + \\Delta_f H^0(\\text{H}_2\\text{O})] - [\\Delta_f H^0(\\text{C}_2\\text{H}_2) + \\dfrac{5}{2} \\Delta_f H^0(\\text{O}_2)]$<br><br>Substituting the given values:<br><br>$\\Delta_c H^0 = [2(-390) + (-285)] - [225 + 0]$<br><br>$\\Delta_c H^0 = [-780 - 285] - 225$<br><br>$\\Delta_c H^0 = -1065 - 225 = -1290 \\text{ kJ mol}^{-1}$<br><br>Answer: $\\Delta_c H^0\\,(\\text{C}_2\\text{H}_2) = -1290$ kJ $\\text{mol}^{-1}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887115a9fc0fc8c143c1", "type": "singleCorrect", "question": {"text": "Calculate the heat of formation of $\\text{SO}_2$ from the following data,<br>i) $\\text{S} + 3/2\\,\\text{O}_2(g) \\rightarrow \\text{SO}_3(g)$, $\\Delta H = -5Y$ kJ<br>ii) $\\text{SO}_2 + 1/2\\,\\text{O}_2(g) \\rightarrow \\text{SO}_3(g)$, $\\Delta H = -3Y$ kJ", "image": null}, "options": [{"id": "M9azx", "label": "A", "text": "$2Y$ kJ", "isCorrect": false, "image": null}, {"id": "u2oQU", "label": "B", "text": "$8Y$ kJ", "isCorrect": false, "image": null}, {"id": "zepZY", "label": "C", "text": "$-8Y$ kJ", "isCorrect": false, "image": null}, {"id": "x9Xot", "label": "D", "text": "$-2Y$ kJ", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The required reaction for the heat of formation of $\\text{SO}_2$ is:<br><br>$\\text{S} + \\text{O}_2(g) \\rightarrow \\text{SO}_2(g)$<br><br>Given reactions are:<br><br>(i) $\\text{S} + 3/2\\,\\text{O}_2(g) \\rightarrow \\text{SO}_3(g)$, $\\Delta H_1 = -5Y$ kJ<br><br>(ii) $\\text{SO}_2 + 1/2\\,\\text{O}_2(g) \\rightarrow \\text{SO}_3(g)$, $\\Delta H_2 = -3Y$ kJ<br><br>Subtracting equation (ii) from equation (i), we get:<br><br>$\\text{S} + 3/2\\,\\text{O}_2(g) - \\text{SO}_2 - 1/2\\,\\text{O}_2(g) \\rightarrow \\text{SO}_3(g) - \\text{SO}_3(g)$<br><br>$\\text{S} + \\text{O}_2(g) \\rightarrow \\text{SO}_2(g)$<br><br>The enthalpy change for this reaction is:<br><br>$\\Delta H = \\Delta H_1 - \\Delta H_2$<br><br>$\\Delta H = -5Y - (-3Y) = -2Y$ kJ<br><br>Answer: $-2Y$ kJ", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "
