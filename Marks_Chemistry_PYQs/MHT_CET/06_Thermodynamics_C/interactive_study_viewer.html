y is a state function, its change depends only on the initial and final states of the system and is independent of the path followed.<br><br>Therefore, the only correct statement is that entropy measures randomness.<br><br>Answer: It measures randomness.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e28c30a4553e1bddd4", "type": "singleCorrect", "question": {"text": "For a certain reaction, $\\Delta H^0$ is $-345$ kJ and $\\Delta S^0$ is $-123\\ \\text{JK}^{-1}$. At what temperature the change over from spontaneous to nonspontaneous will occur?", "image": null}, "options": [{"id": "bLxXC", "label": "A", "text": "$1052$ K", "isCorrect": false, "image": null}, {"id": "xrnU8", "label": "B", "text": "$1956$ K", "isCorrect": false, "image": null}, {"id": "6pzV3", "label": "C", "text": "$2568$ K", "isCorrect": false, "image": null}, {"id": "mPup5", "label": "D", "text": "$2805$ K", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The changeover from spontaneous to nonspontaneous occurs when $\\Delta G^0 = 0$.<br><br>Using the Gibbs free energy equation:<br><br>$\\Delta G^0 = \\Delta H^0 - T\\Delta S^0$<br><br>Setting $\\Delta G^0 = 0$ gives:<br><br>$T = \\dfrac{\\Delta H^0}{\\Delta S^0}$<br><br>Substituting the given values (converting $\\Delta H^0$ to Joules):<br><br>$T = \\dfrac{-345 \\times 10^3 \\text{ J}}{-123 \\text{ JK}^{-1}}$<br><br>$T = 2804.87 \\text{ K}$<br><br>$T \\approx 2805 \\text{ K}$<br><br>Answer: $2805$ K", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3198c30a4553e1be02b", "type": "singleCorrect", "question": {"text": "Which of the following processes has $\\Delta S$ negative?", "image": null}, "options": [{"id": "IDlzD", "label": "A", "text": "Dissolving Sugar in Water", "isCorrect": false, "image": null}, {"id": "1jFA0", "label": "B", "text": "Adsorption of a Gas on a Solid Surface", "isCorrect": true, "image": null}, {"id": "zUD3I", "label": "C", "text": "$2\\text{NH}_3(g) \\rightarrow \\text{N}_2(g) + 3\\text{H}_2(g)$", "isCorrect": false, "image": null}, {"id": "SMtNu", "label": "D", "text": "Sublimation of Dry Ice", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Entropy ($\\Delta S$) is a measure of randomness or disorder in a system.<br><br>For dissolving sugar in water, solid sugar molecules break apart and mix with water, increasing the randomness. Thus, $\\Delta S > 0$.<br><br>For the adsorption of a gas on a solid surface, the gas molecules are restricted to the surface of the solid, which decreases their translational degrees of freedom. The randomness of the system decreases, leading to $\\Delta S < 0$.<br><br>For the reaction $2\\text{NH}_3(g) \\rightarrow \\text{N}_2(g) + 3\\text{H}_2(g)$, the number of gaseous moles increases from $2$ to $4$ ($\\Delta n_g = 2$). An increase in gaseous moles increases randomness, so $\\Delta S > 0$.<br><br>For the sublimation of dry ice, solid $\\text{CO}_2$ converts into gaseous $\\text{CO}_2$. Since gases are more disordered than solids, $\\Delta S > 0$.<br><br>Therefore, the only process with a negative $\\Delta S$ is the adsorption of a gas on a solid surface.<br><br>Answer: Adsorption of a Gas on a Solid Surface", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36f8c30a4553e1be3b0", "type": "singleCorrect", "question": {"text": "For a certain reaction $\\Delta H = -50$ kJ and $\\Delta S = -100$ J/K find the temperature so that the reaction is spontaneous.", "image": null}, "options": [{"id": "tu3zJ", "label": "A", "text": "$650$ K", "isCorrect": false, "image": null}, {"id": "oW1rO", "label": "B", "text": "$600$ K", "isCorrect": false, "image": null}, {"id": "cYAKj", "label": "C", "text": "$550$ K", "isCorrect": false, "image": null}, {"id": "KDPyx", "label": "D", "text": "$450$ K", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For a reaction to be spontaneous, the change in Gibbs free energy must be negative, i.e., $\\Delta G < 0$.<br><br>Using the Gibbs free energy equation:<br><br>$\\Delta G = \\Delta H - T\\Delta S$<br><br>Substituting the given values ($\\Delta H = -50000$ J and $\\Delta S = -100$ J/K):<br><br>$-50000 - T(-100) < 0$<br><br>$-50000 + 100T < 0$<br><br>$100T < 50000$<br><br>$T < 500$ K<br><br>The reaction is spontaneous at temperatures below $500$ K. Among the given options, only $450$ K satisfies this condition.<br><br>Answer: $450$ K", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf0bf9280d7f9932dce", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In a reversible expansion, one mole of gas is expanded isothermally at 200 K till its volume increases 10 times. Calculate $\\Delta S_{\\text {total }}$ at equilibrium?", "image": null}, "options": [{"id": "DU2rg", "text": "Zero J K$^{-1}$", "image": null, "isCorrect": true}, {"id": "ZMQpa", "text": "19.14 J K$^{-1}$", "image": null, "isCorrect": false}, {"id": "PEcpo", "text": "38.9 J K$^{-1}$", "image": null, "isCorrect": false}, {"id": "byyWw", "text": "-19.14 J K$^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a reversible process, the system and surroundings are always in thermal and mechanical equilibrium with each other.<br><br>The total entropy change of the universe is the sum of the entropy change of the system and the surroundings:<br>$\\Delta S_{\\text{total}} = \\Delta S_{\\text{sys}} + \\Delta S_{\\text{surr}}$<br><br>During a reversible isothermal expansion, the heat absorbed by the system from the surroundings is $q_{\\text{rev}}$. The entropy change of the system is:<br>$\\Delta S_{\\text{sys}} = \\dfrac{q_{\\text{rev}}}{T}$<br><br>Since the surroundings lose the exact same amount of heat reversibly at the same temperature, the entropy change of the surroundings is:<br>$\\Delta S_{\\text{surr}} = -\\dfrac{q_{\\text{rev}}}{T}$<br><br>Therefore, the total entropy change is:<br>$\\Delta S_{\\text{total}} = \\dfrac{q_{\\text{rev}}}{T} - \\dfrac{q_{\\text{rev}}}{T} = 0$<br><br>At equilibrium (or for any reversible process), the total entropy change $\\Delta S_{\\text{total}}$ is always zero.<br><br>Answer: Zero J K$^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd0bf9280d7f9932ca7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate $\\Delta S_{\\text {total }}$ for a certain reaction if $\\Delta H=-150 \\mathrm{~kJ}$ and $\\Delta S=32 \\mathrm{JK}^{-1}$ at 300 K .", "image": null}, "options": [{"id": "BJFoP", "text": "$266~ \\mathrm{JK}^{-1}$", "image": null, "isCorrect": false}, {"id": "rqaxs", "text": "$532~ \\mathrm{JK}^{-1}$", "image": null, "isCorrect": true}, {"id": "swyWZ", "text": "$798~ \\mathrm{JK}^{-1}$", "image": null, "isCorrect": false}, {"id": "smHEp", "text": "$468~ \\mathrm{JK}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The total entropy change for a reaction is given by:<br><br>$\\Delta S_{\\text{total}} = \\Delta S_{\\text{sys}} + \\Delta S_{\\text{surr}}$<br><br>The entropy change of the surroundings is related to the enthalpy change of the system by the formula:<br><br>$\\Delta S_{\\text{surr}} = -\\dfrac{\\Delta H}{T}$<br><br>Substituting the given values (converting $\\Delta H$ to Joules):<br><br>$\\Delta S_{\\text{surr}} = -\\dfrac{-150 \\times 10^3}{300} = 500 \\text{ J K}^{-1}$<br><br>Now, substituting $\\Delta S_{\\text{sys}}$ and $\\Delta S_{\\text{surr}}$ into the total entropy equation:<br><br>$\\Delta S_{\\text{total}} = 32 + 500 = 532 \\text{ J K}^{-1}$<br><br>Answer: $532~ \\mathrm{JK}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3cbf9280d7f993275d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify from following physical transformations that exhibits decrease in entropy.", "image": null}, "options": [{"id": "icCkV", "text": "$\\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{s})} \\longrightarrow \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}$", "image": null, "isCorrect": false}, {"id": "SRlPm", "text": "$\\mathrm{H}_2 \\mathrm{O}_{(\\ell)} \\longrightarrow \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}$", "image": null, "isCorrect": false}, {"id": "cPBZp", "text": "$\\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{s})} \\longrightarrow \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}$", "image": null, "isCorrect": false}, {"id": "2gSbq", "text": "$\\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})} \\longrightarrow \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Entropy is a measure of the randomness or disorder of a system.<br><br>The entropy of different states of matter follows the order: Solid < Liquid < Gas.<br><br>For the transformation $\\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})} \\longrightarrow \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}$, the system changes from a highly disordered gaseous state to a less disordered liquid state.<br><br>Therefore, the randomness decreases, which means the entropy decreases ($\\Delta S < 0$).<br><br>Answer: $\\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})} \\longrightarrow \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b17bf9280d7f9932635", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following reactions exhibits decrease in entropy?", "image": null}, "options": [{"id": "D0Gha", "text": "$2 \\mathrm{H}_2 \\mathrm{O}_{2(l)} \\longrightarrow 2 \\mathrm{H}_2 \\mathrm{O}_{(l)}+\\mathrm{O}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "i4309", "text": "$\\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{H}_{(\\mathrm{g})}$", "image": null, "isCorrect": false}, {"id": "tdo2e", "text": "$\\mathrm{CaCO}_{3(\\mathrm{~s})} \\xrightarrow{\\Delta} \\mathrm{CaO}_{(\\mathrm{s})}+\\mathrm{CO}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "Rbbt4", "text": "$2 \\mathrm{H}_{2(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{l})}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Entropy is a measure of randomness or disorder of a system. The entropy of a substance is highest in the gaseous state, lower in the liquid state, and lowest in the solid state. A reaction exhibits a decrease in entropy if the number of moles of gaseous products is less than the number of moles of gaseous reactants ($\\Delta n_g < 0$).<br><br>For $2 \\mathrm{H}_2 \\mathrm{O}_{2(l)} \\longrightarrow 2 \\mathrm{H}_2 \\mathrm{O}_{(l)}+\\mathrm{O}_{2(\\mathrm{~g})}$, a liquid decomposes to form a liquid and a gas. $\\Delta n_g = 1 - 0 = 1 > 0$. Entropy increases.<br><br>For $\\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{H}_{(\\mathrm{g})}$, one mole of gas forms two moles of gas. $\\Delta n_g = 2 - 1 = 1 > 0$. Entropy increases.<br><br>For $\\mathrm{CaCO}_{3(\\mathrm{~s})} \\xrightarrow{\\Delta} \\mathrm{CaO}_{(\\mathrm{s})}+\\mathrm{CO}_{2(\\mathrm{~g})}$, a solid decomposes to form a solid and a gas. $\\Delta n_g = 1 - 0 = 1 > 0$. Entropy increases.<br><br>For $2 \\mathrm{H}_{2(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{l})}$, three moles of gaseous reactants form two moles of liquid product. $\\Delta n_g = 0 - 3 = -3 < 0$. Since gases are converted into a liquid, the randomness decreases significantly, leading to a decrease in entropy.<br><br>Answer: $2 \\mathrm{H}_{2(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{l})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b13bf9280d7f9932614", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the entropy change of surrounding if 2 moles of $\\mathrm{H}_2$ and 1 mole of $\\mathrm{O}_2$ gas combine to form 2 moles of liquid water by releasing 525 kJ heat to surrounding at constant pressure and at 300 K .", "image": null}, "options": [{"id": "8j7wv", "text": "$1700 \\mathrm{~J} \\mathrm{~K}^{-1}$", "image": null, "isCorrect": false}, {"id": "rujwy", "text": "$1750 \\mathrm{~J} \\mathrm{~K}^{-1}$", "image": null, "isCorrect": true}, {"id": "K7hW6", "text": "$1800 \\mathrm{~J} \\mathrm{~K}^{-1}$", "image": null, "isCorrect": false}, {"id": "v4oD5", "text": "$1650 \\mathrm{JK}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The heat released by the system to the surrounding is $525 \\text{ kJ}$.<br><br>Therefore, the heat absorbed by the surrounding is $q_{\\text{surr}} = +525 \\text{ kJ} = 525000 \\text{ J}$.<br><br>The temperature of the surrounding is $T = 300 \\text{ K}$.<br><br>The entropy change of the surrounding is given by the formula:<br><br>$\\Delta S_{\\text{surr}} = \\dfrac{q_{\\text{surr}}}{T}$<br><br>Substituting the given values:<br><br>$\\Delta S_{\\text{surr}} = \\dfrac{525000}{300} = 1750 \\text{ J K}^{-1}$<br><br>Answer: $1750 \\mathrm{~J} \\mathrm{~K}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b00bf9280d7f9932581", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate $\\Delta S$ total for a certain reaction at 298 K if $\\Delta \\mathrm{H}^{\\circ}=-208.6 \\mathrm{~kJ}$ and $\\Delta S^{\\circ}=-36 J^{-1}$", "image": null}, "options": [{"id": "Ykfx8", "text": "$664 \\mathrm{JK}^{-1}$", "image": null, "isCorrect": true}, {"id": "4Jj01", "text": "$834 \\mathrm{JK}^{-1}$", "image": null, "isCorrect": false}, {"id": "KWexn", "text": "$926 \\mathrm{JK}^{-1}$", "image": null, "isCorrect": false}, {"id": "JkAvS", "text": "$736 \\mathrm{JK}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The total entropy change is given by the sum of the entropy change of the system and the surroundings.<br><br>$\\Delta S_{\\text{total}} = \\Delta S_{\\text{sys}} + \\Delta S_{\\text{surr}}$<br><br>The entropy change of the surroundings is calculated as:<br><br>$\\Delta S_{\\text{surr}} = -\\dfrac{\\Delta H_{\\text{sys}}}{T}$<br><br>Substituting the given values:<br><br>$\\Delta S_{\\text{surr}} = -\\dfrac{-208.6 \\times 10^3}{298} = 700 \\text{ J K}^{-1}$<br><br>Now, calculating the total entropy change:<br><br>$\\Delta S_{\\text{total}} = -36 + 700 = 664 \\text{ J K}^{-1}$<br><br>Answer: $664 \\mathrm{JK}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792144a0aee93fa0796df76", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Which of the following equation, relates temperature of a reaction with $\\Delta \\mathrm{H}^{\\circ}$ and $\\Delta \\mathrm{S}^{\\circ}$ at equilibrium?", "image": null}, "options": [{"id": "Oxevm", "text": "$\\Delta H^{\\circ}=\\frac{T}{\\Delta S^{\\circ}}$", "image": null, "isCorrect": false}, {"id": "g4FHh", "text": "$\\Delta \\mathrm{H}^{\\circ}=\\frac{\\Delta \\mathrm{S}^{\\circ}}{\\mathrm{T}}$", "image": null, "isCorrect": false}, {"id": "9Eczx", "text": "$\\Delta \\mathrm{H}^{\\circ}=\\mathrm{T} \\Delta \\mathrm{S}^{\\circ}$", "image": null, "isCorrect": true}, {"id": "vYe5s", "text": "$\\Delta \\mathrm{H}^{\\circ}=\\frac{1}{\\mathrm{~T} \\Delta \\mathrm{~S}^{\\circ}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At equilibrium, the standard Gibbs free energy change is zero, i.e., $\\Delta G^{\\circ} = 0$.<br><br>The relation between standard Gibbs free energy change, standard enthalpy change, and standard entropy change is given by the Gibbs-Helmholtz equation:<br><br>$\\Delta G^{\\circ} = \\Delta H^{\\circ} - T \\Delta S^{\\circ}$<br><br>Substituting $\\Delta G^{\\circ} = 0$:<br><br>$0 = \\Delta H^{\\circ} - T \\Delta S^{\\circ}$<br><br>$\\Delta H^{\\circ} = T \\Delta S^{\\circ}$<br><br>Answer: $\\Delta \\mathrm{H}^{\\circ}=\\mathrm{T} \\Delta \\mathrm{S}^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214330aee93fa0796dec7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "The enthalpy of vaporisation of a liquid is $30 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$ and entropy of vaporisation is $75 \\mathrm{JK}^{-1} \\mathrm{~mol}^{-1}$. Calculate boiling point of liquid at 1 atm .", "image": null}, "options": [{"id": "q9n7s", "text": "250 K", "image": null, "isCorrect": false}, {"id": "xydmP", "text": "400 K", "image": null, "isCorrect": true}, {"id": "9JfsU", "text": "450 K", "image": null, "isCorrect": false}, {"id": "eBLUh", "text": "600 K", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br><br>$\\Delta H_{\\text{vap}} = 30 \\text{ kJ mol}^{-1} = 30000 \\text{ J mol}^{-1}$<br><br>$\\Delta S_{\\text{vap}} = 75 \\text{ J K}^{-1} \\text{ mol}^{-1}$<br><br>At the boiling point, the liquid and vapour phases are in equilibrium, hence $\\Delta G = 0$.<br><br>$\\Delta G = \\Delta H_{\\text{vap}} - T_b \\Delta S_{\\text{vap}} = 0$<br><br>$T_b = \\dfrac{\\Delta H_{\\text{vap}}}{\\Delta S_{\\text{vap}}}$<br><br>$T_b = \\dfrac{30000}{75} = 400 \\text{ K}$<br><br>Answer: 400 K", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c30aee93fa0796db4f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Which of the following equations indicates increase in entropy?", "image": null}, "options": [{"id": "yjCSc", "text": "$\\quad \\mathrm{CaO}_{(\\mathrm{s})}+\\mathrm{CO}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{CaCO}_{3(\\mathrm{~s})}$", "image": null, "isCorrect": false}, {"id": "S8QOy", "text": "$\\mathrm{NaCl}_{(\\mathrm{aq})} \\longrightarrow \\mathrm{NaCl}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}, {"id": "Z0TQ0", "text": "$\\mathrm{NaNO}_{3(\\mathrm{~s})} \\longrightarrow \\mathrm{Na}_{(\\mathrm{aq})}^{+}+\\mathrm{NO}_{3(\\mathrm{aq})}^{-}$", "image": null, "isCorrect": true}, {"id": "4bLv9", "text": "$\\mathrm{N}_{2(\\mathrm{~g})}+3 \\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{NH}_{3(\\mathrm{~g})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Entropy is a measure of randomness or disorder of a system.<br><br>In the reaction $\\mathrm{CaO}_{(\\mathrm{s})}+\\mathrm{CO}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{CaCO}_{3(\\mathrm{~s})}$, the number of gaseous moles decreases from $1$ to $0$, so entropy decreases.<br><br>In the reaction $\\mathrm{NaCl}_{(\\mathrm{aq})} \\longrightarrow \\mathrm{NaCl}_{(\\mathrm{s})}$, aqueous ions form a solid, leading to a decrease in randomness, so entropy decreases.<br><br>In the reaction $\\mathrm{NaNO}_{3(\\mathrm{~s})} \\longrightarrow \\mathrm{Na}_{(\\mathrm{aq})}^{+}+\\mathrm{NO}_{3(\\mathrm{aq})}^{-}$, a solid dissociates into aqueous ions, which increases the randomness of the system, so entropy increases.<br><br>In the reaction $\\mathrm{N}_{2(\\mathrm{~g})}+3 \\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{NH}_{3(\\mathrm{~g})}$, the number of gaseous moles decreases from $4$ to $2$, so entropy decreases.<br><br>Answer: $\\mathrm{NaNO}_{3(\\mathrm{~s})} \\longrightarrow \\mathrm{Na}_{(\\mathrm{aq})}^{+}+\\mathrm{NO}_{3(\\mathrm{aq})}^{-}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213770aee93fa0796d901", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Calculate the entropy change for melting $1 \\text{ g}$ ice at $0^\\circ\\text{C}$ in $\\text{cal g}^{-1}\\text{ K}^{-1}$ if heat of fusion of ice at $0^\\circ\\text{C}$ is $80 \\text{ cal g}^{-1}$.", "image": null}, "options": [{"id": "Aq8LW", "text": "0.039", "image": null, "isCorrect": false}, {"id": "lwCGx", "text": "0.293", "image": null, "isCorrect": true}, {"id": "UA9aI", "text": "8.0", "image": null, "isCorrect": false}, {"id": "uHjnp", "text": "27.3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The entropy change for the melting of ice is given by the formula:<br><br>$\\Delta S = \\dfrac{\\Delta H_{f}}{T}$<br><br>Given:<br>Heat of fusion of ice, $\\Delta H_{f} = 80 \\text{ cal g}^{-1}$<br>Temperature, $T = 0^\\circ\\text{C} = 273 \\text{ K}$<br><br>Substituting the values into the formula:<br><br>$\\Delta S = \\dfrac{80}{273} \\text{ cal g}^{-1} \\text{ K}^{-1}$<br><br>$\\Delta S = 0.293 \\text{ cal g}^{-1} \\text{ K}^{-1}$<br><br>Answer: 0.293", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626c0279619d9d8a3465", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "If enthalpy change for following reaction at $300 \\mathrm{~K}$ is $+7 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$ find the entropy change of surrounding?\n$$\n\\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{s})} \\longrightarrow \\mathrm{H}_2 \\mathrm{O}_{(l)}\n$$", "image": null}, "options": [{"id": "FovPq", "text": "$-42.8 \\mathrm{~J} \\mathrm{~K}^{-1}$", "image": null, "isCorrect": false}, {"id": "Wdf6n", "text": "$-23.3 \\mathrm{~J} \\mathrm{~K}^{-1}$", "image": null, "isCorrect": true}, {"id": "8qOKt", "text": "$-30.7 \\mathrm{~J} \\mathrm{~K}^{-1}$", "image": null, "isCorrect": false}, {"id": "bs8lg", "text": "$-110.0 \\mathrm{~J} \\mathrm{~K}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\Delta \\mathrm{S}_{\\text {surr }} & =-\\frac{\\Delta \\mathrm{H}^{\\circ}}{\\mathrm{T}}=-\\frac{(+7 \\mathrm{~kJ})}{300 \\mathrm{~K}} \\\\ & =-0.00233 \\mathrm{~kJ} \\mathrm{~K}^{-1} \\\\ & =-23.3 \\mathrm{~J} \\mathrm{~K}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620f0279619d9d8a3176", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "Calculate $\\Delta \\mathrm{S}_{\\text {total }}$ for the following reaction at $300 \\mathrm{~K}$.\n$\\begin{aligned} & \\mathrm{NH}_4 \\mathrm{NO}_{3(\\mathrm{~s})} \\longrightarrow \\mathrm{NH}_{(\\mathrm{zq})}^{+}+\\mathrm{NO}_{3(\\mathrm{uq})}^{-} \\\\ & \\left(\\Delta \\mathrm{H}=28.1 \\mathrm{~kJ} \\mathrm{~mol}^{-1}, \\Delta \\mathrm{S}_{\\mathrm{sys}}=108.7 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right)\\end{aligned}$", "image": null}, "options": [{"id": "qkQtA", "text": "$15.1 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "ozx9d", "text": "$93.6 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "zdvAT", "text": "$84.3 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "4HOi2", "text": "$202.3 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\Delta \\mathrm{S}_{\\text {surr }} & =\\frac{Q_{\\text {rvv }}}{T}=\\frac{-\\Delta H}{T} \\\\ & =\\frac{-28.1 \\times 10^3 \\mathrm{~J} \\mathrm{~mol}^{-1}}{300 \\mathrm{~K}} \\\\ & =-93.67 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1} \\\\ \\Delta \\mathrm{S}_{\\text {total }} & =\\Delta \\mathrm{S}_{\\text {sys }}+\\Delta \\mathrm{S}_{\\text {surr }} \\\\ & =108.7+(-93.67) \\\\ & =15.03 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fca0279619d9d8a1f47", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "If entropy of a solid is greater than zero, at $\\mathrm{T}=0$, it is called", "image": null}, "options": [{"id": "CyVyb", "text": "standard entropy", "image": null, "isCorrect": false}, {"id": "0Tujj", "text": "residual entropy", "image": null, "isCorrect": true}, {"id": "Cuorj", "text": "formal entropy", "image": null, "isCorrect": false}, {"id": "epB3N", "text": "absolute entropy", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(C)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f930279619d9d8a1d9b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "What is the value of $\\Delta \\mathrm{S}_{(\\text {total })}$ for following reaction at $300 \\mathrm{~K}$\n$\\mathrm{Fe}_{2} \\mathrm{O}_{3(\\mathrm{~s})}+3 \\mathrm{CO}_{(\\mathrm{g})} \\longrightarrow 2 \\mathrm{Fe}_{(\\mathrm{s})}+3 \\mathrm{CO}_{2(\\mathrm{~g})} \\Delta \\mathrm{H}^{\\circ}=-25 \\mathrm{~kJ}, \\Delta \\mathrm{S}^{\\circ}=15 \\mathrm{JK}^{-1}$", "image": null}, "options": [{"id": "9YZtL", "text": "$68 \\cdot 2 \\mathrm{JK}^{-1}$", "image": null, "isCorrect": false}, {"id": "E6yLj", "text": "$98 \\cdot 3 \\mathrm{JK}^{-1}$", "image": null, "isCorrect": true}, {"id": "b6ZOr", "text": "$8 \\cdot 32 \\mathrm{JK}^{-1}$", "image": null, "isCorrect": false}, {"id": "uRh92", "text": "$-10 \\cdot 0 \\mathrm{JK}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction the exothermic,\n$$\n\\begin{aligned}\n\\therefore \\Delta H_{\\text {sur }} &=+25 \\mathrm{~kJ}=25000 \\mathrm{~J} \\\\\n\\therefore \\Delta S_{\\text {sur }} &=\\frac{\\Delta H_{\\text {arr }}}{T}=\\frac{25000 \\mathrm{~J}}{300 \\mathrm{~K}}=83.33 \\mathrm{JK}^{-1} \\\\\n\\Delta S_{\\text {ton } 1} &=\\Delta S_{\\text {sys }}+\\Delta S_{\\text {surr }} \\\\\n&=15 \\mathrm{JK}^{-1}+83.33 \\mathrm{JK}^{-1} \\\\\n\\therefore \\Delta S_{\\text {tow }} &=98.33 \\mathrm{~J} \\mathrm{~K}^{-1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f230279619d9d8a1a12", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "For the following reaction\n$\\mathrm{Fe}_{2} \\mathrm{O}_{3(\\mathrm{~s})}+3 \\mathrm{CO}_{(\\mathrm{g})} \\longrightarrow 2 \\mathrm{Fe}_{(\\mathrm{s})}+3 \\mathrm{CO}_{2(\\mathrm{~g})} \\Delta \\mathrm{H}^{\\circ}=-29 \\cdot 8 \\mathrm{~kJ}$\nand $\\Delta \\mathrm{S}^{\\circ}=15 \\mathrm{JK}^{-1}$. What is the value of $\\Delta \\mathrm{S}_{\\text {(total) }}$ at $298 \\mathrm{~K}$ ?", "image": null}, "options": [{"id": "YnrE1", "text": "29.8 J", "image": null, "isCorrect": false}, {"id": "CA201", "text": "$100 \\cdot 0 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "eAOlW", "text": "$298 \\cdot 0 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "P8U6K", "text": "$115 \\cdot 0 \\mathrm{~J}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Since the reaction is exothermic, system loses heat to surrounding. Hence the entropy of the surrounding increases.\n$\\begin{aligned}\n\\quad \\Delta \\mathrm{H}_{\\text {surr }} &=+29.8 \\mathrm{~kJ}=29800 \\mathrm{~J} \\\\\n\\therefore \\Delta \\mathrm{S}_{\\text {sur }} &=\\frac{\\Delta \\mathrm{H}_{\\text {sur }}}{\\mathrm{T}}=\\frac{29800}{298}=100 \\mathrm{JK}^{-1} \\\\\n\\therefore \\quad \\Delta \\mathrm{S}_{\\text {Total }} &=\\Delta \\mathrm{S}_{\\text {sys }}+\\Delta \\mathrm{S}_{\\text {surr }}=15+100=115 \\mathrm{JK}^{-1}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eeb0279619d9d8a1859", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "For a process, entropy change of a system is expressed as", "image": null}, "options": [{"id": "nJY0X", "text": "<math><mi mathvariant=\"normal\">H</mi><mo>-</mo><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">S</mi></math>", "image": null, "isCorrect": false}, {"id": "URF5O", "text": "<math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">q</mi></mrow><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">v</mi></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">T</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "vrA5m", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">q</mi></mrow><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">v</mi></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "B8wre", "text": "<math><msub><mrow><mi mathvariant=\"normal\">q</mi></mrow><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">v</mi></mrow></msub><mo>×</mo><mi mathvariant=\"normal\">T</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to second law of thermodynamics: <br/><math><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">S</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">q</mi></mrow><mrow><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">v</mi></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">T</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a2632b0279619d9d8a3ca1", "title": "Third law of thermodynamics", "totalQuestions": 25, "questions": [{"_id": "6abb88b115a9fc0fc8c1461a", "type": "singleCorrect", "question": {"text": "For the following reaction,<br>$\\text{C}(s) + 2\\text{H}_2(g) \\rightarrow \\text{CH}_4(g);\\ \\Delta_r H^0 = -75\\ \\text{kJ}$.<br>Calculate $\\Delta G^0$ if $\\Delta S^0$ is $185\\ \\text{JK}^{-1}$.", "image": null}, "options": [{"id": "lcnXB", "label": "A", "text": "$-130.13\\ \\text{kJ}$", "isCorrect": true, "image": null}, {"id": "LotJ6", "label": "B", "text": "$130.13\\ \\text{kJ}$", "isCorrect": false, "image": null}, {"id": "t6HVD", "label": "C", "text": "$19.87\\ \\text{kJ}$", "isCorrect": false, "image": null}, {"id": "rLH85", "label": "D", "text": "$-19.87\\ \\text{kJ}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given:<br>$\\Delta H^0 = -75\\ \\text{kJ}$<br>$\\Delta S^0 = 185\\ \\text{J K}^{-1} = 0.185\\ \\text{kJ K}^{-1}$<br>Standard temperature, $T = 298\\ \\text{K}$<br><br>Using the Gibbs free energy equation:<br>$\\Delta G^0 = \\Delta H^0 - T\\Delta S^0$<br><br>Substituting the values:<br>$\\Delta G^0 = -75 - (298 \\times 0.185)$<br><br>$\\Delta G^0 = -75 - 55.13$<br><br>$\\Delta G^0 = -130.13\\ \\text{kJ}$<br><br>Answer: $-130.13\\ \\text{kJ}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888115a9fc0fc8c14457", "type": "singleCorrect", "question": {"text": "Calculate the free energy change for a certain reaction at $300$ K if $\\Delta H$ is $60$ kJ and $\\Delta S$ is $-120\\,\\text{JK}^{-1}$.", "image": null}, "options": [{"id": "JfOXN", "label": "A", "text": "$24.0$ kJ", "isCorrect": false, "image": null}, {"id": "Phusl", "label": "B", "text": "$-35.5$ kJ", "isCorrect": false, "image": null}, {"id": "AxriH", "label": "C", "text": "$96.0$ kJ", "isCorrect": true, "image": null}, {"id": "oQ9fF", "label": "D", "text": "$-57.5$ kJ", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The Gibbs free energy change is given by the equation:<br><br>$\\Delta G = \\Delta H - T\\Delta S$<br><br>Given values are:<br>$\\Delta H = 60$ kJ<br>$T = 300$ K<br>$\\Delta S = -120$ J K$^{-1} = -0.12$ kJ K$^{-1}$<br><br>Substituting these values into the equation:<br><br>$\\Delta G = 60 - (300)(-0.12)$<br><br>$\\Delta G = 60 - (-36)$<br><br>$\\Delta G = 96.0$ kJ<br><br>Answer: $96.0$ kJ", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883215a9fc0fc8c1416a", "type": "singleCorrect", "question": {"text": "For a certain reaction, change in enthalpy is $-225$ kJ and entropy change $= -150$ JK$^{-1}$. Find the temperature so that $\\Delta G$ is zero.", "image": null}, "options": [{"id": "eBCVS", "label": "A", "text": "$350$ K", "isCorrect": false, "image": null}, {"id": "lkdhS", "label": "B", "text": "$1500$ K", "isCorrect": true, "image": null}, {"id": "DJmfi", "label": "C", "text": "$105$ K", "isCorrect": false, "image": null}, {"id": "7uZXS", "label": "D", "text": "$1800$ K", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the Gibbs free energy equation:<br><br>$\\Delta G = \\Delta H - T\\Delta S$<br><br>For $\\Delta G = 0$, we have:<br><br>$T = \\dfrac{\\Delta H}{\\Delta S}$<br><br>Given $\\Delta H = -225$ kJ $= -225000$ J and $\\Delta S = -150$ J K$^{-1}$:<br><br>$T = \\dfrac{-225000}{-150} = 1500$ K<br><br>Answer: $1500$ K", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30d8c30a4553e1bdfa5", "type": "singleCorrect", "question": {"text": "Calculate standard Gibbs energy for any gaseous reaction if values of $K_p$ and $R$ respectively are $3.5 \\times 10^{17}$ ; $8.314\\,\\text{JK}^{-1}\\text{mol}^{-1}$", "image": null}, "options": [{"id": "Ehgb6", "label": "A", "text": "$-100.1\\,\\text{kJ mol}^{-1}$", "isCorrect": true, "image": null}, {"id": "JkGzy", "label": "B", "text": "$-79.5\\,\\text{kJ mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "aBkQQ", "label": "C", "text": "$-71.4\\,\\text{kJ mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "lRcJz", "label": "D", "text": "$-89.5\\,\\text{kJ mol}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The standard Gibbs free energy change is given by the relation:<br><br>$\\Delta G^{\\circ} = -RT \\ln K_p = -2.303 RT \\log K_p$<br><br>Assuming standard temperature $T = 298\\,\\text{K}$:<br><br>$\\Delta G^{\\circ} = -2.303 \\times 8.314 \\times 298 \\times \\log(3.5 \\times 10^{17})$<br><br>$\\Delta G^{\\circ} = -5705.8 \\times (\\log 3.5 + 17)$<br><br>$\\Delta G^{\\circ} = -5705.8 \\times (0.544 + 17)$<br><br>$\\Delta G^{\\circ} = -5705.8 \\times 17.544$<br><br>$\\Delta G^{\\circ} = -100102\\,\\text{J mol}^{-1} \\approx -100.1\\,\\text{kJ mol}^{-1}$<br><br>Answer: $-100.1\\,\\text{kJ mol}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ff8c30a4553e1bdf13", "type": "singleCorrect", "question": {"text": "Identify from following, the relation between standard free energy change in a reaction and equilibrium constant $K_c$.", "image": null}, "options": [{"id": "hf5qV", "label": "A", "text": "$\\triangle G^\\circ = RT \\ln K_c$", "isCorrect": false, "image": null}, {"id": "2OfLU", "label": "B", "text": "$-\\triangle G^\\circ = \\dfrac{RT}{\\ln K_c}$", "isCorrect": false, "image": null}, {"id": "VwjVD", "label": "C", "text": "$\\triangle G^\\circ = \\dfrac{\\ln K_c}{RT}$", "isCorrect": false, "image": null}, {"id": "Dx9Rv", "label": "D", "text": "$-\\triangle G^\\circ = RT \\ln K_c$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The relation between the free energy change and the reaction quotient is given by $\\Delta G = \\Delta G^\\circ + RT \\ln Q$.<br><br>At equilibrium, the free energy change $\\Delta G = 0$ and the reaction quotient $Q = K_c$.<br><br>Substituting these values into the equation, we get $0 = \\Delta G^\\circ + RT \\ln K_c$.<br><br>Rearranging the terms yields $-\\Delta G^\\circ = RT \\ln K_c$.<br><br>Answer: $-\\triangle G^\\circ = RT \\ln K_c$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3288c30a4553e1be0cb", "type": "singleCorrect", "question": {"text": "For a certain reaction, $\\Delta\\text{H}^\\circ = 40\\ \\text{kJ}$ and $\\Delta\\text{S}^\\circ = 80\\ \\text{JK}^{-1}$. Find the temperature so that $\\Delta\\text{G}^\\circ = 0$", "image": null}, "options": [{"id": "NAMk9", "label": "A", "text": "$500\\ \\text{K}$", "isCorrect": true, "image": null}, {"id": "WEsBH", "label": "B", "text": "$400\\ \\text{K}$", "isCorrect": false, "image": null}, {"id": "DU342", "label": "C", "text": "$300\\ \\text{K}$", "isCorrect": false, "image": null}, {"id": "tGzM4", "label": "D", "text": "$600\\ \\text{K}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the Gibbs free energy equation:<br><br>$\\Delta G^\\circ = \\Delta H^\\circ - T\\Delta S^\\circ$<br><br>For $\\Delta G^\\circ = 0$, we get:<br><br>$T = \\dfrac{\\Delta H^\\circ}{\\Delta S^\\circ}$<br><br>Given $\\Delta H^\\circ = 40\\ \\text{kJ} = 40000\\ \\text{J}$ and $\\Delta S^\\circ = 80\\ \\text{J K}^{-1}$.<br><br>Substituting the values:<br><br>$T = \\dfrac{40000}{80} = 500\\ \\text{K}$<br><br>Answer: $500\\ \\text{K}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d48c30a4553e1bdd40", "type": "singleCorrect", "question": {"text": "Which of the following statements is not correct ?", "image": null}, "options": [{"id": "VzcTI", "label": "A", "text": "$\\Delta G^\\circ$ is an extensive property.", "isCorrect": false, "image": null}, {"id": "CR8bm", "label": "B", "text": "$E^\\circ$ cell is an intensive property.", "isCorrect": false, "image": null}, {"id": "HPOJw", "label": "C", "text": "For a chemical reaction to be spontaneous $\\Delta G$ must be $-\\text{ve}$.", "isCorrect": false, "image": null}, {"id": "NLFH8", "label": "D", "text": "Electrical work is equal to $\\Delta G$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Gibbs free energy ($G$) and standard Gibbs free energy change ($\\Delta G^\\circ$) depend on the quantity of the substance, hence they are extensive properties.<br><br>Standard cell potential ($E^\\circ_{\\text{cell}}$) is independent of the amount of substance, hence it is an intensive property.<br><br>For a spontaneous reaction at constant temperature and pressure, the change in Gibbs free energy ($\\Delta G$) must be negative ($\\Delta G < 0$).<br><br>The reversible electrical work done by a galvanic cell is equal to the decrease in its Gibbs free energy. Therefore, electrical work done by the system is equal to $-\\Delta G$, not $\\Delta G$.<br><br>Thus, the statement \"Electrical work is equal to $\\Delta G$\" is incorrect.<br><br>Answer: Electrical work is equal to $\\Delta G$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e28c30a4553e1bddd3", "type": "singleCorrect", "question": {"text": "For a reaction to be spontaneous at all temperatures, the values of enthalpy change and entropy change should be", "image": null}, "options": [{"id": "4SLXh", "label": "A", "text": "$\\Delta H > 0$ and $\\Delta S > 0$", "isCorrect": false, "image": null}, {"id": "oVS3c", "label": "B", "text": "$\\Delta H < 0$ and $\\Delta S > 0$", "isCorrect": true, "image": null}, {"id": "U6qxn", "label": "C", "text": "$\\Delta H < 0$ and $\\Delta S < 0$", "isCorrect": false, "image": null}, {"id": "Yc4oo", "label": "D", "text": "$\\Delta H > 0$ and $\\Delta S < 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a reaction to be spontaneous, the change in Gibbs free energy must be negative, i.e., $\\Delta G < 0$.<br><br>The relationship between $\\Delta G$, enthalpy change $\\Delta H$, and entropy change $\\Delta S$ is given by the Gibbs equation:<br><br>$\\Delta G = \\Delta H - T\\Delta S$<br><br>Since absolute temperature $T$ is always positive, for $\\Delta G$ to be negative at all temperatures, both terms contributing to $\\Delta G$ must favor spontaneity. This happens when:<br><br>$\\Delta H < 0$ (exothermic reaction)<br>$\\Delta S > 0$ (increase in entropy)<br><br>Under these conditions, the term $-T\\Delta S$ is negative, and since $\\Delta H$ is also negative, their sum $\\Delta G$ will always be negative regardless of the temperature.<br><br>Answer: $\\Delta H < 0$ and $\\Delta S > 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3618c30a4553e1be31a", "type": "singleCorrect", "question": {"text": "The equilibrium constant for a reaction is $100$. What will be the value of standard Gibbs energy change at $298$ K ? ($R = 8.314$ J $\\text{K}^{-1}\\text{mol}^{-1}$)", "image": null}, "options": [{"id": "1xibf", "label": "A", "text": "$-11.411$ KJ/mol", "isCorrect": true, "image": null}, {"id": "RFd7W", "label": "B", "text": "$-5.744$ KJ/mol", "isCorrect": false, "image": null}, {"id": "JDxKV", "label": "C", "text": "$-570.584$ KJ/mol", "isCorrect": false, "image": null}, {"id": "4PB8l", "label": "D", "text": "$-57.058$ KJ/mol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The standard Gibbs free energy change is given by the equation:<br><br>$\\Delta G^{\\circ} = -RT \\ln K = -2.303 RT \\log K$<br><br>Substituting the given values:<br><br>$R = 8.314 \\text{ J K}^{-1}\\text{mol}^{-1}$<br>$T = 298 \\text{ K}$<br>$K = 100$<br><br>$\\Delta G^{\\circ} = -2.303 \\times 8.314 \\times 298 \\times \\log(100)$<br><br>$\\Delta G^{\\circ} = -2.303 \\times 8.314 \\times 298 \\times 2$<br><br>$\\Delta G^{\\circ} = -11411.7 \\text{ J mol}^{-1}$<br><br>$\\Delta G^{\\circ} \\approx -11.411 \\text{ kJ mol}^{-1}$<br><br>Answer: $-11.411$ KJ/mol", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c00bf9280d7f9932e66", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For a certain reaction $\\Delta H=-225 \\mathrm{~kJ}$ and $\\Delta S=-150 \\mathrm{JK}^{-1}$. Find the temperature so that $\\Delta \\mathrm{G}$ is zero.", "image": null}, "options": [{"id": "PedwH", "text": "1500 K", "image": null, "isCorrect": true}, {"id": "COOZI", "text": "1450 K", "image": null, "isCorrect": false}, {"id": "6dc4g", "text": "1340 K", "image": null, "isCorrect": false}, {"id": "mYJRI", "text": "1300 K", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relationship between Gibbs free energy, enthalpy, and entropy is given by:<br><br>$\\Delta G = \\Delta H - T\\Delta S$<br><br>For the reaction to be at equilibrium, $\\Delta G = 0$. Therefore:<br><br>$0 = \\Delta H - T\\Delta S$<br><br>$T = \\dfrac{\\Delta H}{\\Delta S}$<br><br>Given values are:<br>$\\Delta H = -225 \\text{ kJ} = -225000 \\text{ J}$<br>$\\Delta S = -150 \\text{ J K}^{-1}$<br><br>Substituting these values into the equation:<br><br>$T = \\dfrac{-225000}{-150}$<br><br>$T = 1500 \\text{ K}$<br><br>Answer: 1500 K", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be1bf9280d7f9932d3c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify from following the correct set of thermodynamic conditions for the reaction to be spontaneous at all temperature.", "image": null}, "options": [{"id": "y2M5u", "text": "$\\triangle \\mathrm{H}>0$ and $\\triangle \\mathrm{S}>0$", "image": null, "isCorrect": false}, {"id": "aGf8o", "text": "$\\Delta \\mathrm{H} < 0$ and $\\Delta \\mathrm{S} < 0$", "image": null, "isCorrect": false}, {"id": "lBCXE", "text": "$\\triangle \\mathrm{H} < 0$ and $\\triangle \\mathrm{S}>0$", "image": null, "isCorrect": true}, {"id": "sxdXP", "text": "$\\Delta H>0$ and $\\Delta S < 0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The condition for a reaction to be spontaneous is $\\Delta G < 0$.<br><br>From the Gibbs free energy equation, $\\Delta G = \\Delta H - T\\Delta S$.<br><br>For the reaction to be spontaneous at all temperatures, $\\Delta G$ must be negative for all values of $T$. Since $T$ is always positive (in Kelvin), this is possible only when $\\Delta H < 0$ and $\\Delta S > 0$.<br><br>Under these conditions, both terms $\\Delta H$ and $-T\\Delta S$ are negative, making $\\Delta G$ negative at all temperatures.<br><br>Answer: $\\triangle \\mathrm{H} < 0$ and $\\triangle \\mathrm{S}>0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcebf9280d7f9932c95", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify from following the correct set of thermodynamic conditions for the reaction to be nonspontaneous at all temperature.", "image": null}, "options": [{"id": "UD1SF", "text": "$\\triangle \\mathrm{H} < 0$ and $\\triangle \\mathrm{S} < 0$", "image": null, "isCorrect": false}, {"id": "TZb9d", "text": "$\\triangle \\mathrm{H}>0$ and $\\triangle \\mathrm{S}>0$", "image": null, "isCorrect": false}, {"id": "8DQ5S", "text": "$\\triangle \\mathrm{H} < 0$ and $\\triangle \\mathrm{S}>0$", "image": null, "isCorrect": false}, {"id": "98P48", "text": "$\\triangle \\mathrm{H}>0$ and $\\triangle \\mathrm{S} < 0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The spontaneity of a reaction is determined by the Gibbs free energy change, given by the equation $\\Delta G = \\Delta H - T\\Delta S$.<br><br>For a reaction to be nonspontaneous at all temperatures, $\\Delta G$ must be positive ($\\Delta G > 0$) regardless of the temperature $T$ (which is always positive in Kelvin).<br><br>If $\\Delta H > 0$ and $\\Delta S < 0$, then the term $-T\\Delta S$ will be positive.<br><br>Thus, $\\Delta G = (+ \\text{ve}) + (+ \\text{ve}) > 0$ at all temperatures.<br><br>Therefore, the condition for a reaction to be nonspontaneous at all temperatures is $\\Delta H > 0$ and $\\Delta S < 0$.<br><br>Answer: $\\triangle \\mathrm{H}>0$ and $\\triangle \\mathrm{S} < 0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbfbf9280d7f9932c10", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For a certain reaction, $\\Delta \\mathrm{H}=-210 \\mathrm{~kJ}$ and $\\Delta \\mathrm{S}=-150 \\mathrm{~J} \\mathrm{~K}^{-1}$ Find the temperature so that $\\Delta \\mathrm{G}=0$", "image": null}, "options": [{"id": "1lGsT", "text": "1100 K", "image": null, "isCorrect": false}, {"id": "WrVER", "text": "1200 K", "image": null, "isCorrect": false}, {"id": "gfxG1", "text": "1400 K", "image": null, "isCorrect": true}, {"id": "sGcIW", "text": "1300 K", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br><br>$\\Delta H = -210 \\text{ kJ} = -210000 \\text{ J}$<br><br>$\\Delta S = -150 \\text{ J K}^{-1}$<br><br>$\\Delta G = 0$<br><br>Using the Gibbs free energy equation:<br><br>$\\Delta G = \\Delta H - T\\Delta S$<br><br>Substituting $\\Delta G = 0$:<br><br>$0 = \\Delta H - T\\Delta S$<br><br>$T = \\dfrac{\\Delta H}{\\Delta S}$<br><br>Substituting the given values:<br><br>$T = \\dfrac{-210000}{-150}$<br><br>$T = 1400 \\text{ K}$<br><br>Answer: 1400 K", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba8bf9280d7f9932b50", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate $\\Delta \\mathrm{H}^{\\circ}$ for a reaction at $298 \\mathrm{~K}$ if $\\Delta \\mathrm{S}^{\\circ}=120 \\mathrm{JK}^{-1}$ and $\\Delta \\mathrm{G}^{\\circ}=28000 \\mathrm{~J}$", "image": null}, "options": [{"id": "aoZxC", "text": "15.94 kJ", "image": null, "isCorrect": false}, {"id": "2sBe2", "text": "31.83 kJ", "image": null, "isCorrect": false}, {"id": "KzhDj", "text": "94.12 kJ", "image": null, "isCorrect": false}, {"id": "3gI36", "text": "63.76 kJ", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Using the Gibbs free energy equation:<br><br>$\\Delta G^{\\circ} = \\Delta H^{\\circ} - T \\Delta S^{\\circ}$<br><br>Rearranging for $\\Delta H^{\\circ}$:<br><br>$\\Delta H^{\\circ} = \\Delta G^{\\circ} + T \\Delta S^{\\circ}$<br><br>Substituting the given values:<br><br>$\\Delta H^{\\circ} = 28000 + (298 \\times 120)$<br><br>$\\Delta H^{\\circ} = 28000 + 35760$<br><br>$\\Delta H^{\\circ} = 63760 \\text{ J}$<br><br>Converting to kilojoules:<br><br>$\\Delta H^{\\circ} = 63.76 \\text{ kJ}$<br><br>Answer: 63.76 kJ", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9cbf9280d7f9932ad9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify from following the correct set of thermodynamic conditions for the reaction to be spontaneous below equilibrium temperature.", "image": null}, "options": [{"id": "673kC", "text": "$\\Delta \\mathrm{H} < 0$ and $\\Delta \\mathrm{S} < 0$", "image": null, "isCorrect": true}, {"id": "tqm4X", "text": "$\\Delta H>0$ and $\\Delta S>0$", "image": null, "isCorrect": false}, {"id": "nLKFV", "text": "$\\Delta \\mathrm{H} < 0$ and $\\Delta \\mathrm{S}>0$", "image": null, "isCorrect": false}, {"id": "etvxn", "text": "$\\Delta \\mathrm{H}>0$ and $\\Delta \\mathrm{S} < 0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The Gibbs free energy change is given by $\\Delta G = \\Delta H - T\\Delta S$.<br><br>For a reaction to be spontaneous, $\\Delta G < 0$.<br><br>At equilibrium, $\\Delta G = 0$, which gives the equilibrium temperature $T_{eq} = \\dfrac{\\Delta H}{\\Delta S}$.<br><br>For the reaction to be spontaneous below $T_{eq}$, we require $\\Delta G < 0$ when $T < T_{eq}$.<br><br>If $\\Delta H < 0$ and $\\Delta S < 0$, then $T_{eq}$ is positive. For $T < T_{eq}$, we have $T < \\dfrac{\\Delta H}{\\Delta S}$. Since $\\Delta S$ is negative, multiplying both sides by $\\Delta S$ reverses the inequality, giving $T\\Delta S > \\Delta H$, which means $\\Delta H - T\\Delta S < 0$. Thus, $\\Delta G < 0$ and the reaction is spontaneous at temperatures below $T_{eq}$.<br><br>If $\\Delta H > 0$ and $\\Delta S > 0$, the reaction is spontaneous only above $T_{eq}$.<br><br>Therefore, the correct conditions are $\\Delta H < 0$ and $\\Delta S < 0$.<br><br>Answer: $\\Delta \\mathrm{H} < 0$ and $\\Delta \\mathrm{S} < 0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b49bf9280d7f99327df", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following set of thermodynamic conditions is true for the reaction to be spontaneous at high temperature?", "image": null}, "options": [{"id": "6k5XC", "text": "$\\Delta \\mathrm{H} < 0$ and $\\Delta \\mathrm{S} < 0$", "image": null, "isCorrect": false}, {"id": "62h6H", "text": "$\\Delta H>0$ and $\\Delta S>0$", "image": null, "isCorrect": true}, {"id": "9AQZ5", "text": "$\\Delta \\mathrm{H} < 0$ and $\\Delta \\mathrm{S}>0$", "image": null, "isCorrect": false}, {"id": "pEo06", "text": "$\\Delta H>0$ and $\\Delta S < 0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The Gibbs free energy change is given by the equation $\\Delta G = \\Delta H - T\\Delta S$.<br><br>For a reaction to be spontaneous, $\\Delta G$ must be negative ($\\Delta G < 0$).<br><br>If $\\Delta H > 0$ and $\\Delta S > 0$, the term $T\\Delta S$ is positive. At high temperatures, the magnitude of $T\\Delta S$ becomes greater than $\\Delta H$.<br><br>This results in $\\Delta G = \\Delta H - T\\Delta S < 0$, making the reaction spontaneous at high temperatures.<br><br>Answer: $\\Delta H>0$ and $\\Delta S>0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140e0aee93fa0796dd9e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Calculate the value of $\\Delta \\mathrm{G}$ for the following reaction at $300 \\mathrm{~K}$. $\\mathrm{N}_2 \\mathrm{O}_{4(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{NO}_{2(\\mathrm{~g})}$\r\nif $\\Delta \\mathrm{H}=57.44 \\mathrm{~kJ}$ and $\\Delta \\mathrm{S}=176 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}$.", "image": null}, "options": [{"id": "y5OIl", "text": "120.20 kJ", "image": null, "isCorrect": false}, {"id": "n4BUF", "text": "-110.24 kJ", "image": null, "isCorrect": false}, {"id": "swVtw", "text": "$\\quad-46.4 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "nIFeL", "text": "$\\quad 4.64 \\mathrm{~kJ}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given:<br><br>$\\Delta H = 57.44 \\text{ kJ}$<br><br>$\\Delta S = 176 \\text{ J K}^{-1} \\text{ mol}^{-1} = 0.176 \\text{ kJ K}^{-1} \\text{ mol}^{-1}$<br><br>$T = 300 \\text{ K}$<br><br>Using the Gibbs free energy equation:<br><br>$\\Delta G = \\Delta H - T \\Delta S$<br><br>Substituting the given values:<br><br>$\\Delta G = 57.44 - (300 \\times 0.176)$<br><br>$\\Delta G = 57.44 - 52.8$<br><br>$\\Delta G = 4.64 \\text{ kJ}$<br><br>Answer: $\\quad 4.64 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d60aee93fa0796dbeb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "For the reaction $\\mathrm{CH}_{4(\\mathrm{~g})}+\\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{C}_2 \\mathrm{H}_{6(\\mathrm{~g})}$ $\\mathrm{K}_{\\mathrm{p}}=3.356 \\times 10^{17}$, calculate $\\Delta \\mathrm{G}^{\\circ}$ for the reaction at 298 K .", "image": null}, "options": [{"id": "NFHRU", "text": "$-90 \\mathrm{~kJ~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "btBPx", "text": "$-100 \\mathrm{~kJ~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "gOrQm", "text": "$235.6 \\mathrm{~kJ~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "aweVx", "text": "$33.56 \\mathrm{~kJ~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard Gibbs free energy change is related to the equilibrium constant by the equation:<br><br>$\\Delta G^{\\circ} = -2.303 RT \\log K_{p}$<br><br>Given:<br><br>$R = 8.314 \\text{ J K}^{-1} \\text{ mol}^{-1}$<br><br>$T = 298 \\text{ K}$<br><br>$K_{p} = 3.356 \\times 10^{17}$<br><br>Substituting the values into the equation:<br><br>$\\Delta G^{\\circ} = -2.303 \\times 8.314 \\times 298 \\times \\log(3.356 \\times 10^{17})$<br><br>$\\log(3.356 \\times 10^{17}) = \\log(3.356) + 17 \\approx 0.526 + 17 = 17.526$<br><br>$\\Delta G^{\\circ} = -5705.8 \\times 17.526 \\text{ J mol}^{-1}$<br><br>$\\Delta G^{\\circ} \\approx -99998 \\text{ J mol}^{-1}$<br><br>$\\Delta G^{\\circ} \\approx -100 \\text{ kJ mol}^{-1}$<br><br>Answer: $-100 \\mathrm{~kJ~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134e0aee93fa0796d7c2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Calculate Gibbs energy change for a reaction having $\\Delta \\mathrm{H}=31400 \\mathrm{~J}, \\Delta \\mathrm{~S}=32 \\mathrm{JK}^{-1}$ at $1000^{\\circ} \\mathrm{C}$ ?", "image": null}, "options": [{"id": "PYY3L", "text": "-4668 J", "image": null, "isCorrect": false}, {"id": "ArXAt", "text": "-9336 J", "image": null, "isCorrect": true}, {"id": "JbHdZ", "text": "-4073 J", "image": null, "isCorrect": false}, {"id": "DnQq2", "text": "-2334 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>$\\Delta H = 31400 \\text{ J}$<br>$\\Delta S = 32 \\text{ J K}^{-1}$<br>$T = 1000^{\\circ}\\text{C} = 1000 + 273 = 1273 \\text{ K}$<br><br>Using the Gibbs free energy equation:<br>$\\Delta G = \\Delta H - T\\Delta S$<br><br>Substituting the values:<br>$\\Delta G = 31400 - (1273 \\times 32)$<br>$\\Delta G = 31400 - 40736$<br>$\\Delta G = -9336 \\text{ J}$<br><br>Answer: -9336 J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b20279619d9d8a2e9c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Calculate the value of $\\Delta G$ for following reaction at $300 \\mathrm{~K}$.\n$\\begin{aligned} & \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{s})} \\longrightarrow \\mathrm
