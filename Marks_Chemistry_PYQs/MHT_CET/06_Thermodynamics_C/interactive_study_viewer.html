615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887115a9fc0fc8c143c0", "type": "singleCorrect", "question": {"text": "$\\text{CH}_{4(g)} \\rightarrow \\text{C}_{(g)} + 4\\text{H}_{(g)}$, $\\Delta H = 1660$ kJ/mol.<br>What type of enthalpy does the reaction represent?", "image": null}, "options": [{"id": "x5cw6", "label": "A", "text": "Enthalpy of decomposition", "isCorrect": false, "image": null}, {"id": "E2tFE", "label": "B", "text": "Enthalpy of atomization", "isCorrect": true, "image": null}, {"id": "6irvA", "label": "C", "text": "Enthalpy of ionization", "isCorrect": false, "image": null}, {"id": "n0xbR", "label": "D", "text": "Enthalpy of vaporization", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction is $\\text{CH}_{4(g)} \\rightarrow \\text{C}_{(g)} + 4\\text{H}_{(g)}$.<br><br>In this reaction, one mole of gaseous methane is completely dissociated into its constituent gaseous atoms.<br><br>The enthalpy change accompanying the complete dissociation of one mole of a substance into its gaseous atoms is called the enthalpy of atomization.<br><br>Therefore, the given reaction represents the enthalpy of atomization.<br><br>Answer: Enthalpy of atomization", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888115a9fc0fc8c14456", "type": "singleCorrect", "question": {"text": "Which of the following processes is exothermic?", "image": null}, "options": [{"id": "lJZT0", "label": "A", "text": "$\\text{Na}_{(g)} \\rightarrow \\text{Na}^+_{(g)}$", "isCorrect": false, "image": null}, {"id": "PGNpt", "label": "B", "text": "$\\text{Cl}_{(g)} \\rightarrow \\text{Cl}^-_{(g)}$", "isCorrect": true, "image": null}, {"id": "57YfQ", "label": "C", "text": "$\\text{Cl}_{2(g)} \\rightarrow \\text{Cl}_{(g)} + \\text{Cl}_{(g)}$", "isCorrect": false, "image": null}, {"id": "VsBZd", "label": "D", "text": "$\\text{NaCl}_{(s)} + \\text{aq.} \\rightarrow \\text{Na}^+_{(aq)} + \\text{Cl}^-_{(aq)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The process $\\text{Na}_{(g)} \\rightarrow \\text{Na}^+_{(g)}$ represents the ionization of sodium, which requires energy (ionization enthalpy is positive), making it endothermic.<br><br>The process $\\text{Cl}_{(g)} \\rightarrow \\text{Cl}^-_{(g)}$ represents the addition of an electron to a chlorine atom. The first electron gain enthalpy of chlorine is highly negative, meaning energy is released, making it an exothermic process.<br><br>The process $\\text{Cl}_{2(g)} \\rightarrow \\text{Cl}_{(g)} + \\text{Cl}_{(g)}$ represents bond dissociation, which requires energy (bond dissociation enthalpy is positive), making it endothermic.<br><br>The process $\\text{NaCl}_{(s)} + \\text{aq.} \\rightarrow \\text{Na}^+_{(aq)} + \\text{Cl}^-_{(aq)}$ represents the dissolution of sodium chloride in water. The lattice enthalpy is slightly greater than the hydration enthalpy, so the enthalpy of solution is positive, making it endothermic.<br><br>Answer: $\\text{Cl}_{(g)} \\rightarrow \\text{Cl}^-_{(g)}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889115a9fc0fc8c144ee", "type": "singleCorrect", "question": {"text": "What is the enthalpy of vaporization of methanol, if $17.64$ kJ heat is required for vaporization of $16$ g of it?", "image": null}, "options": [{"id": "X65ol", "label": "A", "text": "$17.64$ kJ/mol", "isCorrect": false, "image": null}, {"id": "rCpdR", "label": "B", "text": "$35.28$ kJ/mol", "isCorrect": true, "image": null}, {"id": "I5ntW", "label": "C", "text": "$52.92$ kJ/mol", "isCorrect": false, "image": null}, {"id": "ByObg", "label": "D", "text": "$70.56$ kJ/mol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Molar mass of methanol ($CH_3OH$) = $12 + 4 \\times 1 + 16 = 32$ g/mol.<br><br>Number of moles in $16$ g of methanol = $\\dfrac{16}{32} = 0.5$ mol.<br><br>Heat required to vaporize $0.5$ mol of methanol = $17.64$ kJ.<br><br>Enthalpy of vaporization ($\\Delta_{vap}H$) = $\\dfrac{17.64}{0.5} = 35.28$ kJ/mol.<br><br>Answer: $35.28$ kJ/mol", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888f15a9fc0fc8c144db", "type": "singleCorrect", "question": {"text": "Which of the following covalent bonds has the highest bond enthalpy?", "image": null}, "options": [{"id": "xNgDs", "label": "A", "text": "$\\text{C}-\\text{H}$", "isCorrect": false, "image": null}, {"id": "tJgBk", "label": "B", "text": "$\\text{C}-\\text{C}$", "isCorrect": false, "image": null}, {"id": "NcSCs", "label": "C", "text": "$\\text{O}-\\text{H}$", "isCorrect": false, "image": null}, {"id": "7hrli", "label": "D", "text": "$\\text{C}=\\text{C}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The approximate bond enthalpies for the given covalent bonds are:<br><br>$\\text{C}-\\text{H} \\approx 414 \\text{ kJ/mol}$<br><br>$\\text{C}-\\text{C} \\approx 347 \\text{ kJ/mol}$<br><br>$\\text{O}-\\text{H} \\approx 464 \\text{ kJ/mol}$<br><br>$\\text{C}=\\text{C} \\approx 611 \\text{ kJ/mol}$<br><br>Since $\\text{C}=\\text{C}$ is a double bond (consisting of one $\\sigma$ and one $\\pi$ bond), it is stronger and requires more energy to break compared to the single bonds listed. Therefore, the $\\text{C}=\\text{C}$ bond has the highest bond enthalpy.<br><br>Answer: $\\text{C}=\\text{C}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883215a9fc0fc8c14169", "type": "singleCorrect", "question": {"text": "Calculate $\\Delta_f H$ for $\\text{C}(s) + 2\\text{H}_2(g) \\rightarrow \\text{CH}_4(g)$<br>i. $\\text{C}(s) + \\text{O}_2(g) \\rightarrow \\text{CO}_2(g); \\Delta H_1 = -393.5$ kJ/mol<br>ii. $\\text{H}_2(g) + 1/2\\,\\text{O}_2(g) \\rightarrow \\text{H}_2\\text{O}(l); \\Delta H_2 = -285.8$ kJ/mol<br>iii. $\\text{CH}_4(g) + 2\\text{O}_2(g) \\rightarrow \\text{CO}_2(g) + 2\\text{H}_2\\text{O}(l); \\Delta H_3 = -890.3$ kJ/mol", "image": null}, "options": [{"id": "IpJ9P", "label": "A", "text": "$-1855.4$ kJ/mol", "isCorrect": false, "image": null}, {"id": "MVp7P", "label": "B", "text": "$-211$ kJ/mol", "isCorrect": false, "image": null}, {"id": "7P8pj", "label": "C", "text": "$-74.8$ kJ/mol", "isCorrect": true, "image": null}, {"id": "6ZleP", "label": "D", "text": "$1068.4$ kJ/mol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The target reaction is $\\text{C}(s) + 2\\text{H}_2(g) \\rightarrow \\text{CH}_4(g)$<br><br>This reaction can be obtained by applying Hess's Law to the given equations:<br><br>Equation (i) + $2 \\times$ Equation (ii) - Equation (iii)<br><br>$\\Delta_f H = \\Delta H_1 + 2\\Delta H_2 - \\Delta H_3$<br><br>$\\Delta_f H = -393.5 + 2(-285.8) - (-890.3)$<br><br>$\\Delta_f H = -393.5 - 571.6 + 890.3$<br><br>$\\Delta_f H = -965.1 + 890.3 = -74.8 \\text{ kJ/mol}$<br><br>Answer: $-74.8$ kJ/mol", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883115a9fc0fc8c14168", "type": "singleCorrect", "question": {"text": "Which of the following enthalpy change is negative?", "image": null}, "options": [{"id": "jBvUp", "label": "A", "text": "Enthalpy of fusion", "isCorrect": false, "image": null}, {"id": "YYTir", "label": "B", "text": "Enthalpy of condensation", "isCorrect": true, "image": null}, {"id": "qYwa4", "label": "C", "text": "Enthaly of vaporization", "isCorrect": false, "image": null}, {"id": "n8LCs", "label": "D", "text": "Enthalpy of sublimation", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Enthalpy of fusion is the heat energy required to change a solid into a liquid, which is an endothermic process ($\\Delta H > 0$).<br><br>Enthalpy of vaporization is the heat energy required to change a liquid into a gas, which is an endothermic process ($\\Delta H > 0$).<br><br>Enthalpy of sublimation is the heat energy required to change a solid directly into a gas, which is an endothermic process ($\\Delta H > 0$).<br><br>Enthalpy of condensation is the heat energy released when a gas changes into a liquid. Since heat is released, it is an exothermic process and its enthalpy change is negative ($\\Delta H < 0$).<br><br>Answer: Enthalpy of condensation", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2aa8c30a4553e1bdb7c", "type": "singleCorrect", "question": {"text": "The enthalpy of combustion of C, $\\text{H}_2$, and $\\text{CH}_4$ are $-390$, $-285$ and $-890$ kJ/mol. Find the enthalpy of formation of methane.", "image": null}, "options": [{"id": "dkePT", "label": "A", "text": "$-70$ kJ", "isCorrect": true, "image": null}, {"id": "0RKUr", "label": "B", "text": "$-111$ kJ", "isCorrect": false, "image": null}, {"id": "mANfD", "label": "C", "text": "$-170$ kJ", "isCorrect": false, "image": null}, {"id": "6xE7b", "label": "D", "text": "$-85$ kJ", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The required reaction for the formation of methane is:<br><br>$\\text{C(s)} + 2\\text{H}_2\\text{(g)} \\rightarrow \\text{CH}_4\\text{(g)}$<br><br>The enthalpy of formation can be calculated using the enthalpies of combustion of the reactants and products:<br><br>$\\Delta H_f(\\text{CH}_4) = \\Delta H_c(\\text{C}) + 2\\Delta H_c(\\text{H}_2) - \\Delta H_c(\\text{CH}_4)$<br><br>Substituting the given values:<br><br>$\\Delta H_f(\\text{CH}_4) = -390 + 2(-285) - (-890)$<br><br>$\\Delta H_f(\\text{CH}_4) = -390 - 570 + 890$<br><br>$\\Delta H_f(\\text{CH}_4) = -960 + 890 = -70 \\text{ kJ/mol}$<br><br>Answer: $-70$ kJ", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3548c30a4553e1be28f", "type": "singleCorrect", "question": {"text": "Identify the law for the statement \"Overall the enthalpy change for a reaction is equal to sum of enthalpy changes of individual steps in the reaction\"", "image": null}, "options": [{"id": "HoAjE", "label": "A", "text": "First law of thermodynamics", "isCorrect": false, "image": null}, {"id": "qYRdF", "label": "B", "text": "Hess's law", "isCorrect": true, "image": null}, {"id": "J8etl", "label": "C", "text": "Avogadro's law", "isCorrect": false, "image": null}, {"id": "JCuRX", "label": "D", "text": "Second law of thermodynamics", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Hess's law of constant heat summation states that the total enthalpy change for a chemical reaction is independent of the path by which the reaction occurs. <br><br>If a reaction takes place in several steps, the overall enthalpy change is equal to the sum of the enthalpy changes of the individual steps. This is because enthalpy is a state function, meaning it depends only on the initial and final states of the system, not on the path taken.<br><br>Answer: Hess's law", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ee8c30a4553e1bde5a", "type": "singleCorrect", "question": {"text": "Calculate the standard enthalpy change for the following reaction,<br>$2\\text{C}_2\\text{H}_6\\text{(g)} + 7\\text{O}_2\\text{(g)} \\longrightarrow 4\\text{CO}_2\\text{(g)} + 6\\text{H}_2\\text{O}\\text{(l)}$<br>Given, $\\Delta_f H^\\circ(\\text{C}_2\\text{H}_6) = -85\\ \\text{kJ mol}^{-1}$<br>$\\Delta_f H^\\circ(\\text{CO}_2) = -390\\ \\text{kJ mol}^{-1}$<br>$\\Delta_f H^\\circ(\\text{H}_2\\text{O}) = -285\\ \\text{kJ mol}^{-1}$", "image": null}, "options": [{"id": "ZSTSp", "label": "A", "text": "$-2900\\ \\text{kJ}$", "isCorrect": false, "image": null}, {"id": "Fityj", "label": "B", "text": "$-3100\\ \\text{kJ}$", "isCorrect": true, "image": null}, {"id": "NrG1r", "label": "C", "text": "$-3000\\ \\text{kJ}$", "isCorrect": false, "image": null}, {"id": "ukPxh", "label": "D", "text": "$-3200\\ \\text{kJ}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The standard enthalpy of reaction is calculated using the formula:<br><br>$\\Delta_r H^\\circ = \\sum \\Delta_f H^\\circ(\\text{products}) - \\sum \\Delta_f H^\\circ(\\text{reactants})$<br><br>For the given reaction:<br><br>$\\Delta_r H^\\circ = [4 \\times \\Delta_f H^\\circ(\\text{CO}_2) + 6 \\times \\Delta_f H^\\circ(\\text{H}_2\\text{O})] - [2 \\times \\Delta_f H^\\circ(\\text{C}_2\\text{H}_6) + 7 \\times \\Delta_f H^\\circ(\\text{O}_2)]$<br><br>Substituting the given values:<br><br>$\\Delta_r H^\\circ = [4(-390) + 6(-285)] - [2(-85) + 7(0)]$<br><br>$\\Delta_r H^\\circ = [-1560 - 1710] - [-170]$<br><br>$\\Delta_r H^\\circ = -3270 + 170 = -3100\\ \\text{kJ}$<br><br>Answer: $-3100\\ \\text{kJ}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3458c30a4553e1be1f9", "type": "singleCorrect", "question": {"text": "Calculate the standard enthalpy of combustion of carbon monoxide if<br>$\\Delta_f H^\\circ (\\text{CO}) = -110 \\text{ kJ mol}^{-1}$<br>$\\Delta_f H^\\circ (\\text{CO}_2) = -393 \\text{ kJ mol}^{-1}$", "image": null}, "options": [{"id": "ayubn", "label": "A", "text": "$-503 \\text{ kJ mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "3kuX6", "label": "B", "text": "$-110 \\text{ kJ mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "2BtRl", "label": "C", "text": "$-283 \\text{ kJ mol}^{-1}$", "isCorrect": true, "image": null}, {"id": "TvkeK", "label": "D", "text": "$-383 \\text{ kJ mol}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The combustion reaction of carbon monoxide is given by:<br><br>$\\text{CO(g)} + \\dfrac{1}{2} \\text{O}_2\\text{(g)} \\rightarrow \\text{CO}_2\\text{(g)}$<br><br>The standard enthalpy of combustion is calculated using the standard enthalpies of formation:<br><br>$\\Delta_c H^\\circ (\\text{CO}) = \\sum \\Delta_f H^\\circ (\\text{products}) - \\sum \\Delta_f H^\\circ (\\text{reactants})$<br><br>$\\Delta_c H^\\circ (\\text{CO}) = \\Delta_f H^\\circ (\\text{CO}_2) - \\left[ \\Delta_f H^\\circ (\\text{CO}) + \\dfrac{1}{2} \\Delta_f H^\\circ (\\text{O}_2) \\right]$<br><br>Since the standard enthalpy of formation of $\\text{O}_2$ in its standard state is zero:<br><br>$\\Delta_c H^\\circ (\\text{CO}) = -393 - (-110 + 0)$<br><br>$\\Delta_c H^\\circ (\\text{CO}) = -393 + 110 = -283 \\text{ kJ mol}^{-1}$<br><br>Answer: $-283 \\text{ kJ mol}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3458c30a4553e1be1f8", "type": "singleCorrect", "question": {"text": "Which of the following processes is an endothermic ?", "image": null}, "options": [{"id": "QAudk", "label": "A", "text": "The aqueous NaOH and HCl solutions mixed together.", "isCorrect": false, "image": null}, {"id": "T1nlF", "label": "B", "text": "Formation of ammonia by Haber process.", "isCorrect": false, "image": null}, {"id": "lnCVo", "label": "C", "text": "Ice melts at room temperature.", "isCorrect": true, "image": null}, {"id": "1k8v2", "label": "D", "text": "The freezing of liquid water.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Mixing of aqueous NaOH and HCl is a neutralization reaction, which is highly exothermic.<br><br>Formation of ammonia by the Haber process is an exothermic reaction as heat is released.<br><br>Melting of ice requires the absorption of heat from the surroundings to overcome the intermolecular forces of attraction between water molecules. Thus, it is an endothermic process.<br><br>Freezing of liquid water releases heat to the surroundings, making it an exothermic process.<br><br>Answer: Ice melts at room temperature.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c78c30a4553e1bdcb2", "type": "singleCorrect", "question": {"text": "Which of the following equations is used to obtain enthalpy change of a reaction?", "image": null}, "options": [{"id": "jrE42", "label": "A", "text": "$\\Delta H = \\sum \\Delta H_P - \\sum \\Delta H_R$", "isCorrect": true, "image": null}, {"id": "DTSMi", "label": "B", "text": "$\\Delta H = \\sum \\Delta H_R - \\sum \\Delta H_P$", "isCorrect": false, "image": null}, {"id": "c4COz", "label": "C", "text": "$\\Delta H = \\sum \\Delta H_P + \\sum \\Delta H_R$", "isCorrect": false, "image": null}, {"id": "ET5ZN", "label": "D", "text": "$\\Delta H = \\dfrac{\\sum \\Delta H_P}{\\sum \\Delta H_R}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The enthalpy change of a reaction is defined as the difference between the sum of the enthalpies of the products and the sum of the enthalpies of the reactants.<br><br>$\\Delta H = \\sum \\Delta H_P - \\sum \\Delta H_R$<br><br>where $\\sum \\Delta H_P$ is the sum of enthalpies of products and $\\sum \\Delta H_R$ is the sum of enthalpies of reactants.<br><br>Answer: $\\Delta H = \\sum \\Delta H_P - \\sum \\Delta H_R$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c48c30a4553e1bdc95", "type": "singleCorrect", "question": {"text": "At $25\\ ^\\circ\\text{C}$ standard enthalpy of combustion of $\\text{H}_2$, Cyclohexene and cyclohexane are -241, -3800 and -3920 kJ $\\text{mol}^{-1}$ respectively. What is the heat of hydrogenation of cyclohexene?", "image": null}, "options": [{"id": "X6NDW", "label": "A", "text": "$-121$ kJ", "isCorrect": true, "image": null}, {"id": "hElKj", "label": "B", "text": "$-242$ kJ", "isCorrect": false, "image": null}, {"id": "BUzdc", "label": "C", "text": "$121$ kJ", "isCorrect": false, "image": null}, {"id": "HFYow", "label": "D", "text": "$363$ kJ", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The hydrogenation reaction of cyclohexene is given by:<br><br>$\\text{C}_6\\text{H}_{10} + \\text{H}_2 \\rightarrow \\text{C}_6\\text{H}_{12}$<br><br>The enthalpy of hydrogenation can be calculated using the standard enthalpies of combustion of the reactants and products:<br><br>$\\Delta H = \\sum \\Delta H_c(\\text{Reactants}) - \\sum \\Delta H_c(\\text{Products})$<br><br>$\\Delta H = \\Delta H_c(\\text{C}_6\\text{H}_{10}) + \\Delta H_c(\\text{H}_2) - \\Delta H_c(\\text{C}_6\\text{H}_{12})$<br><br>Substituting the given values:<br><br>$\\Delta H = -3800 + (-241) - (-3920)$<br><br>$\\Delta H = -4041 + 3920 = -121 \\text{ kJ mol}^{-1}$<br><br>Answer: $-121$ kJ", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d48c30a4553e1bdd3e", "type": "singleCorrect", "question": {"text": "The heat of combustion of carbon to $\\text{CO}_2$ is $-393.5\\ \\text{kJ/mol}$. The heat released upon formation of 35.2 g of $\\text{CO}_2$ from carbon and oxygen gas is", "image": null}, "options": [{"id": "piJWi", "label": "A", "text": "$+315\\ \\text{kJ}$", "isCorrect": false, "image": null}, {"id": "sjfwe", "label": "B", "text": "$-315\\ \\text{kJ}$", "isCorrect": true, "image": null}, {"id": "MYPd7", "label": "C", "text": "$-3.15\\ \\text{kJ}$", "isCorrect": false, "image": null}, {"id": "k6wGh", "label": "D", "text": "$-630\\ \\text{kJ}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The combustion reaction of carbon is given by:<br><br>$\\text{C(s)} + \\text{O}_2\\text{(g)} \\rightarrow \\text{CO}_2\\text{(g)}$<br><br>The heat of combustion of carbon to $\\text{CO}_2$ is $\\Delta H = -393.5\\ \\text{kJ/mol}$.<br><br>Molar mass of $\\text{CO}_2 = 12 + 2 \\times 16 = 44\\ \\text{g/mol}$.<br><br>Number of moles in $35.2\\ \\text{g}$ of $\\text{CO}_2$ is:<br><br>$n = \\dfrac{35.2}{44} = 0.8\\ \\text{mol}$<br><br>The enthalpy change for the formation of $0.8\\ \\text{mol}$ of $\\text{CO}_2$ is:<br><br>$\\Delta H = 0.8\\ \\text{mol} \\times (-393.5\\ \\text{kJ/mol}) = -314.8\\ \\text{kJ} \\approx -315\\ \\text{kJ}$<br><br>The negative sign indicates that the heat is released during the process.<br><br>Answer: $-315\\ \\text{kJ}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d48c30a4553e1bdd3d", "type": "singleCorrect", "question": {"text": "Calculate the enthalpy change when 6 g. $\\text{CO(g)}$ reacts with sufficient $\\text{NO}_2\\text{(g)}$ according to the following reaction<br>$4\\,\\text{CO(g)} + 2\\,\\text{NO}_2\\text{(g)} \\rightarrow 4\\,\\text{CO}_2\\text{(g)} + 2\\text{N}_2\\text{(g)}\\,;\\ \\Delta_r H^0 = -1200\\ \\text{kJ}$", "image": null}, "options": [{"id": "W31Wo", "label": "A", "text": "$-16.08\\ \\text{kJ}$.", "isCorrect": false, "image": null}, {"id": "N7ckK", "label": "B", "text": "$-32.15\\ \\text{kJ}$.", "isCorrect": false, "image": null}, {"id": "1gqtM", "label": "C", "text": "$-64.29\\ \\text{kJ}$", "isCorrect": true, "image": null}, {"id": "qSPVe", "label": "D", "text": "$-128.58\\ \\text{kJ}$.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Molar mass of $\\text{CO} = 12 + 16 = 28\\ \\text{g mol}^{-1}$<br><br>Number of moles of $\\text{CO} = \\dfrac{6}{28} = \\dfrac{3}{14}\\ \\text{mol}$<br><br>From the given balanced equation, the enthalpy change for the reaction of $4\\ \\text{mol}$ of $\\text{CO}$ is $-1200\\ \\text{kJ}$.<br><br>Enthalpy change for $1\\ \\text{mol}$ of $\\text{CO} = \\dfrac{-1200}{4} = -300\\ \\text{kJ}$<br><br>Enthalpy change for $\\dfrac{3}{14}\\ \\text{mol}$ of $\\text{CO} = -300 \\times \\dfrac{3}{14} = -64.285\\ \\text{kJ} \\approx -64.29\\ \\text{kJ}$<br><br>Answer: $-64.29\\ \\text{kJ}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3358c30a4553e1be158", "type": "singleCorrect", "question": {"text": "What is the change in entropy of surrounding for the reaction,<br>$\\text{H}_{2(g)} + 1/2\\ \\text{O}_{2(g)} \\rightarrow \\text{H}_2\\text{O}_{(l)}$<br>at 298 K if standard enthalpy of formation of water is $-286$ kJ ?", "image": null}, "options": [{"id": "pjWKl", "label": "A", "text": "$959.7\\ \\text{JK}^{-1}$", "isCorrect": true, "image": null}, {"id": "csNso", "label": "B", "text": "$801.5\\ \\text{JK}^{-1}$", "isCorrect": false, "image": null}, {"id": "JZW6d", "label": "C", "text": "$850.7\\ \\text{JK}^{-1}$", "isCorrect": false, "image": null}, {"id": "POspS", "label": "D", "text": "$980.0\\ \\text{JK}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The standard enthalpy of formation of water is the enthalpy change of the system for the given reaction.<br><br>$\\Delta H_{\\text{sys}} = -286\\ \\text{kJ} = -286000\\ \\text{J}$<br><br>The heat absorbed by the surroundings at constant pressure is given by:<br><br>$q_{\\text{surr}} = -\\Delta H_{\\text{sys}} = 286000\\ \\text{J}$<br><br>The change in entropy of the surroundings is calculated as:<br><br>$\\Delta S_{\\text{surr}} = \\dfrac{q_{\\text{surr}}}{T}$<br><br>Substituting the given values:<br><br>$\\Delta S_{\\text{surr}} = \\dfrac{286000}{298} = 959.7\\ \\text{J K}^{-1}$<br><br>Answer: $959.7\\ \\text{JK}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29c8c30a4553e1bdae6", "type": "singleCorrect", "question": {"text": "The enthalpy of combustion of cyclohexane, cyclohexene and $\\text{H}_2$ are respectively $-3920, -3800$ and $-241$ KJ mol$^{-1}$. The enthalpy of hydrogenation of cyclohexene is", "image": null}, "options": [{"id": "o1zey", "label": "A", "text": "$-121$ KJ mol$^{-1}$", "isCorrect": true, "image": null}, {"id": "UNcNy", "label": "B", "text": "$+121$ KJ mol$^{-1}$", "isCorrect": false, "image": null}, {"id": "MBPhJ", "label": "C", "text": "$-242$ KJ mol$^{-1}$", "isCorrect": false, "image": null}, {"id": "ML14C", "label": "D", "text": "$+242$ KJ mol$^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The hydrogenation reaction of cyclohexene is given by:<br><br>$\\text{C}_6\\text{H}_{10} + \\text{H}_2 \\rightarrow \\text{C}_6\\text{H}_{12}$<br><br>The enthalpy of hydrogenation can be calculated using the enthalpies of combustion of the reactants and products:<br><br>$\\Delta H = \\sum \\Delta H_c(\\text{reactants}) - \\sum \\Delta H_c(\\text{products})$<br><br>$\\Delta H = [\\Delta H_c(\\text{C}_6\\text{H}_{10}) + \\Delta H_c(\\text{H}_2)] - \\Delta H_c(\\text{C}_6\\text{H}_{12})$<br><br>Substituting the given values:<br><br>$\\Delta H = [-3800 + (-241)] - (-3920)$<br><br>$\\Delta H = -4041 + 3920$<br><br>$\\Delta H = -121 \\text{ kJ mol}^{-1}$<br><br>Answer: $-121$ KJ mol$^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36e8c30a4553e1be3af", "type": "singleCorrect", "question": {"text": "Calculate the enthalpy change of the reaction,<br>$\\text{H}_2\\text{(g)} + \\text{Cl}_2\\text{(g)} \\rightarrow 2\\text{HCl(g)}$<br>if bond energies (kJ mol$^{-1}$):<br>H–H = 436, Cl–Cl = 242, H–Cl = 431", "image": null}, "options": [{"id": "zhKve", "label": "A", "text": "$-184$ kJ/mol", "isCorrect": true, "image": null}, {"id": "MQmYy", "label": "B", "text": "$-246$ kJ/mol", "isCorrect": false, "image": null}, {"id": "LFS6I", "label": "C", "text": "$-242$ kJ/mol", "isCorrect": false, "image": null}, {"id": "dsBD9", "label": "D", "text": "$-431$ kJ/mol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The enthalpy change of the reaction is given by the difference between the sum of bond energies of reactants and the sum of bond energies of products.<br><br>$\\Delta H = \\sum \\text{BE(Reactants)} - \\sum \\text{BE(Products)}$<br><br>For the given reaction:<br>$\\text{H}_2\\text{(g)} + \\text{Cl}_2\\text{(g)} \\rightarrow 2\\text{HCl(g)}$<br><br>$\\Delta H = [\\text{BE(H-H)} + \\text{BE(Cl-Cl)}] - [2 \\times \\text{BE(H-Cl)}]$<br><br>Substituting the given values:<br>$\\Delta H = (436 + 242) - (2 \\times 431)$<br><br>$\\Delta H = 678 - 862$<br><br>$\\Delta H = -184 \\text{ kJ mol}^{-1}$<br><br>Answer: $-184$ kJ/mol", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3608c30a4553e1be319", "type": "singleCorrect", "question": {"text": "The bond dissociation enthalpy of $\\text{H}_2$, $\\text{Cl}_2$ and HCl are $434$, $242$ and $431$ kJ $\\text{mol}^{-1}$ respectively. Calculate the enthalpy of formation of HCl.", "image": null}, "options": [{"id": "4Qgj5", "label": "A", "text": "$-93$ kJ $\\text{mol}^{-1}$", "isCorrect": true, "image": null}, {"id": "KFZKw", "label": "B", "text": "$245$ kJ $\\text{mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "pSrB2", "label": "C", "text": "$93$ kJ $\\text{mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "l9Ud6", "label": "D", "text": "$-245$ kJ $\\text{mol}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reaction for the formation of HCl is:<br><br>$\\dfrac{1}{2} \\text{H}_2(g) + \\dfrac{1}{2} \\text{Cl}_2(g) \\rightarrow \\text{HCl}(g)$<br><br>The enthalpy of formation is given by:<br><br>$\\Delta_f H = \\sum \\text{BE}(\\text{reactants}) - \\sum \\text{BE}(\\text{products})$<br><br>$\\Delta_f H = \\left[ \\dfrac{1}{2} \\text{BE}(\\text{H}_2) + \\dfrac{1}{2} \\text{BE}(\\text{Cl}_2) \\right] - \\text{BE}(\\text{HCl})$<br><br>Substituting the given values:<br><br>$\\Delta_f H = \\left[ \\dfrac{1}{2}(434) + \\dfrac{1}{2}(242) \\right] - 431$<br><br>$\\Delta_f H = (217 + 121) - 431$<br><br>$\\Delta_f H = 338 - 431 = -93 \\text{ kJ mol}^{-1}$<br><br>Answer: $-93$ kJ $\\text{mol}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b88c30a4553e1bdc12", "type": "singleCorrect", "question": {"text": "Calculate the enthalpy change for the following reaction, using given bond energy (kJ/mol)<br>(C-H = $414$, H-O = $463$, H-Cl = $431$, C-Cl = $326$ and C-O = $335$)<br>$\\text{CH}_3\\text{OH}_{(g)} + \\text{HCl}_{(g)} \\rightarrow \\text{CH}_3\\text{Cl}_{(g)} + \\text{H}_2\\text{O}_{(g)}$", "image": null}, "options": [{"id": "jb9lP", "label": "A", "text": "$-23 \\text{ kJmol}^{-1}$", "isCorrect": true, "image": null}, {"id": "eOYoG", "label": "B", "text": "$-42 \\text{ kJmol}^{-1}$", "isCorrect": false, "image": null}, {"id": "VpZGr", "label": "C", "text": "$-59 \\text{ kJmol}^{-1}$", "isCorrect": false, "image": null}, {"id": "SCkgd", "label": "D", "text": "$-51 \\text{ kJmol}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The enthalpy of reaction is given by:<br><br>$\\Delta H = \\sum \\text{BE(Reactants)} - \\sum \\text{BE(Products)}$<br><br>$\\Delta H = [3 \\times \\text{BE(C-H)} + \\text{BE(C-O)} + \\text{BE(O-H)} + \\text{BE(H-Cl)}] - [3 \\times \\text{BE(C-H)} + \\text{BE(C-Cl)} + 2 \\times \\text{BE(O-H)}]$<br><br>Canceling the common bond energies on both sides:<br><br>$\\Delta H = \\text{BE(C-O)} + \\text{BE(H-Cl)} - \\text{BE(C-Cl)} - \\text{BE(O-H)}$<br><br>Substituting the given values:<br><br>$\\Delta H = 335 + 431 - 326 - 463$<br><br>$\\Delta H = 766 - 789 = -23 \\text{ kJ mol}^{-1}$<br><br>Answer: $-23 \\text{ kJmol}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871becbf9280d7f9932da8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following processes occurs in the reaction given below\n$\\mathrm{C}_{\\text {(graphite) }} \\longrightarrow \\mathrm{C}_{(\\mathrm{g})} \\text { ? }$", "image": null}, "options": [{"id": "fv4C0", "text": "Sublimation", "image": null, "isCorrect": true}, {"id": "4oPis", "text": "Vaporisation", "image": null, "isCorrect": false}, {"id": "uCPQu", "text": "Fusion", "image": null, "isCorrect": false}, {"id": "TGZmx", "text": "Ionisation", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is $\\mathrm{C}_{\\text{(graphite)}} \\longrightarrow \\mathrm{C}_{\\text{(g)}}$.<br><br>In this process, solid carbon (graphite) is directly converted into gaseous carbon atoms without passing through the liquid state.<br><br>The direct conversion of a solid into a gas is known as sublimation.<br><br>Answer: Sublimation", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdebf9280d7f9932d26", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the standard enthalpy change of following reaction.\n$\\begin{aligned}\n& \\mathrm{CH}_{4(\\mathrm{~g})}+2 \\mathrm{O}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{CO}_{2(\\mathrm{~g})}+2 \\mathrm{H}_2 \\mathrm{O}_{(\\ell)} \\\\\n& \\text { if } \\quad \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(C H_4\\right)=-75 \\mathrm{~kJ} \\mathrm{~mol}^{-1} \\\\\n& \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(C \\mathrm{O}_2\\right)=-390 \\mathrm{~kJ} \\mathrm{~mol}^{-1} \\\\\n& \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(\\mathrm{H}_2 \\mathrm{O}\\right)=-286 \\mathrm{~kJ} \\mathrm{~mol}^{-1}\n\\end{aligned}$", "image": null}, "options": [{"id": "9idGj", "text": "-887.00 kJ", "image": null, "isCorrect": true}, {"id": "e9NEX", "text": "-1325.00 kJ", "image": null, "isCorrect": false}, {"id": "Ayjbt", "text": "-1035.00 kJ", "image": null, "isCorrect": false}, {"id": "gDGEK", "text": "-1770.00 kJ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard enthalpy of reaction is calculated using the formula:<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = \\sum \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\text{products}) - \\sum \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\text{reactants})$<br><br>For the given reaction:<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{CO}_2) + 2 \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{H}_2 \\mathrm{O})] - [\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{CH}_4) + 2 \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{O}_2)]$<br><br>The standard enthalpy of formation of $\\mathrm{O}_2$ in its standard state is zero. Substituting the given values:<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [-390 + 2(-286)] - [-75 + 2(0)]$<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [-390 - 572] - [-75]$<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = -962 + 75 = -887 \\text{ kJ}$<br><br>Answer: -887.00 kJ", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871badbf9280d7f9932b79", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following transformations is endothermic in nature?", "image": null}, "options": [{"id": "MO6y6", "text": "$\\mathrm{H}_2 \\mathrm{O}_{(\\ell)} \\rightarrow \\mathrm{H}_2 \\mathrm{O}_{(s)}$", "image": null, "isCorrect": false}, {"id": "Fg008", "text": "$\\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{s})} \\rightarrow \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}$", "image": null, "isCorrect": true}, {"id": "rsfRT", "text": "$\\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})} \\rightarrow \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}$", "image": null, "isCorrect": false}, {"id": "AdOwF", "text": "$\\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})} \\rightarrow \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "An endothermic process is one in which heat is absorbed by the system from the surroundings, meaning $\\Delta H > 0$.<br><br>The transformation $\\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{s})} \\rightarrow \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}$ represents the melting of ice into liquid water. This process requires an input of heat to overcome the intermolecular hydrogen bonds in the solid state, making it an endothermic process.<br><br>The other transformations (freezing, condensation, and deposition) release heat and are therefore exothermic in nature.<br><br>Answer: $\\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{s})} \\rightarrow \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b99bf9280d7f9932ac0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the standard enthalpy change for synthesis of ammonia gas from following data\ni. $2 \\mathrm{H}_{2(\\mathrm{~g})}+\\mathrm{N}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{N}_2 \\mathrm{H}_{4(\\mathrm{~g})} ; \\quad \\Delta_{\\mathrm{r}} \\mathrm{H}_1^0=95.4 \\mathrm{~kJ}$\nii. $\\mathrm{N}_2 \\mathrm{H}_{4(\\mathrm{~g})}+\\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{NH}_{3(\\mathrm{~g})} ; \\quad \\Delta_{\\mathrm{r}} \\mathrm{H}_2^0=-187.6 \\mathrm{~kJ}$", "image": null}, "options": [{"id": "VcR8t", "text": "$-92.2 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "2GiLj", "text": "$-46.1 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "rPJIQ", "text": "$-138.3 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "Y3nl8", "text": "$-283.2 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical equation for the synthesis of ammonia gas is:<br><br>$\\mathrm{N}_{2(\\mathrm{g})} + 3\\mathrm{H}_{2(\\mathrm{g})} \\longrightarrow 2\\mathrm{NH}_{3(\\mathrm{g})}$<br><br>The given reactions are:<br>i. $2\\mathrm{H}_{2(\\mathrm{g})} + \\mathrm{N}_{2(\\mathrm{g})} \\longrightarrow \\mathrm{N}_2\\mathrm{H}_{4(\\mathrm{g})}; \\quad \\Delta_{\\mathrm{r}} \\mathrm{H}_1^0 = 95.4 \\mathrm{~kJ}$<br>ii. $\\mathrm{N}_2\\mathrm{H}_{4(\\mathrm{g})} + \\mathrm{H}_{2(\\mathrm{g})} \\longrightarrow 2\\mathrm{NH}_{3(\\mathrm{g})}; \\quad \\Delta_{\\mathrm{r}} \\mathrm{H}_2^0 = -187.6 \\mathrm{~kJ}$<br><br>Adding equations (i) and (ii), we get:<br><br>$2\\mathrm{H}_{2(\\mathrm{g})} + \\mathrm{N}_{2(\\mathrm{g})} + \\mathrm{N}_2\\mathrm{H}_{4(\\mathrm{g})} + \\mathrm{H}_{2(\\mathrm{g})} \\longrightarrow \\mathrm{N}_2\\mathrm{H}_{4(\\mathrm{g})} + 2\\mathrm{NH}_{3(\\mathrm{g})}$<br><br>$\\mathrm{N}_{2(\\mathrm{g})} + 3\\mathrm{H}_{2(\\mathrm{g})} \\longrightarrow 2\\mathrm{NH}_{3(\\mathrm{g})}$<br><br>The standard enthalpy change for the overall reaction is the sum of the enthalpy changes of the individual reactions:<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^0 = \\Delta_{\\mathrm{r}} \\mathrm{H}_1^0 + \\Delta_{\\mathrm{r}} \\mathrm{H}_2^0$<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^0 = 95.4 \\mathrm{~kJ} + (-187.6 \\mathrm{~kJ})$<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^0 = -92.2 \\mathrm{~kJ}$<br><br>Answer: $-92.2 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8bbf9280d7f9932a37", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the standard enthalpy change for reaction,\n$\\begin{aligned}\n& \\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{OH}_{(\\ell)}+3 \\mathrm{O}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{CO}_{2(\\mathrm{~g})}+3 \\mathrm{H}_2 \\mathrm{O}_{(\\ell)} \\\\\n& \\text {If,}\\\\\n& \\text {} \\begin{aligned}\n\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{OH}\\right) & =-280 \\mathrm{~kJ} \\mathrm{~mol}^{-1} \\\\\n\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(\\mathrm{CO}_2\\right) & =-390 \\mathrm{~kJ} \\mathrm{~mol}^{-1} \\\\\n\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(\\mathrm{H}_2 \\mathrm{O}\\right) & =-285 \\mathrm{~kJ} \\mathrm{~mol}^{-1}\n\\end{aligned}\n\\end{aligned}$", "image": null}, "options": [{"id": "GbssC", "text": "$-678.00 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "I8u0g", "text": "$-2033.00 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "bsUkr", "text": "$-1355.00 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "ITLBl", "text": "$-1016.00 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard enthalpy of reaction is given by:<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = \\sum \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\text{products}) - \\sum \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\text{reactants})$<br><br>For the given reaction:<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [2 \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{CO}_2) + 3 \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{H}_2\\mathrm{O})] - [\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{C}_2\\mathrm{H}_5\\mathrm{OH}) + 3 \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{O}_2)]$<br><br>Substituting the given values and noting that $\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{O}_2) = 0$ for an element in its standard state:<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [2(-390) + 3(-285)] - [-280 + 3(0)]$<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [-780 - 855] - [-280]$<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = -1635 + 280 = -1355 \\mathrm{~kJ}$<br><br>Answer: $-1355.00 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b89bf9280d7f9932a23", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following reactions is exothermic?", "image": null}, "options": [{"id": "in2LZ", "text": "$\\mathrm{KOH}_{(\\mathrm{aq})}+\\mathrm{HNO}_{3(\\mathrm{aq})} \\rightarrow \\mathrm{KNO}_{3(\\mathrm{aq})}+\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": true}, {"id": "0JSCs", "text": "$\\mathrm{H}_2 \\mathrm{O}_{(s)} \\rightarrow \\mathrm{H}_2 \\mathrm{O}_{(l)}$", "image": null, "isCorrect": false}, {"id": "b1EWB", "text": "$\\mathrm{NaCl}_{(\\mathrm{s})}+\\mathrm{aq} \\rightarrow \\mathrm{Na}_{(\\mathrm{aq})}^{+}+\\mathrm{Cl}_{(\\mathrm{aq})}^{-}$", "image": null, "isCorrect": false}, {"id": "4aHyj", "text": "$\\mathrm{N}_{2(\\mathrm{~g})}+2 \\mathrm{O}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{NO}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction $\\mathrm{KOH}_{(\\mathrm{aq})}+\\mathrm{HNO}_{3(\\mathrm{aq})} \\rightarrow \\mathrm{KNO}_{3(\\mathrm{aq})}+\\mathrm{H}_2 \\mathrm{O}$ is a neutralization reaction between a strong base and a strong acid. Neutralization reactions are always exothermic because they involve the formation of water from $\\mathrm{H}^{+}$ and $\\mathrm{OH}^{-}$ ions, releasing heat ($\\Delta H \\approx -57.1 \\text{ kJ/mol}$).<br><br>The melting of ice ($\\mathrm{H}_2 \\mathrm{O}_{(s)} \\rightarrow \\mathrm{H}_2 \\mathrm{O}_{(l)}$) requires heat and is endothermic.<br><br>The dissolution of $\\mathrm{NaCl}$ in water is slightly endothermic.<br><br>The formation of $\\mathrm{NO}_2$ from $\\mathrm{N}_2$ and $\\mathrm{O}_2$ is an endothermic reaction.<br><br>Answer: $\\mathrm{KOH}_{(\\mathrm{aq})}+\\mathrm{HNO}_{3(\\mathrm{aq})} \\rightarrow \\mathrm{KNO}_{3(\\mathrm{aq})}+\\mathrm{H}_2 \\mathrm{O}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7bbf9280d7f99329a3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the enthalpy of solution of potassium chloride if its $\\Delta_{\\mathrm{L}} \\mathrm{H}=700 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$ and $\\Delta_{\\text {hyd }} \\mathrm{H}=-680 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null}, "options": [{"id": "zIuLW", "text": "$20 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "qBV4f", "text": "$345 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "Konz7", "text": "$690 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "q41jx", "text": "$1380 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The enthalpy of solution is the sum of the lattice enthalpy and the hydration enthalpy.<br><br>$\\Delta_{\\text{sol}} \\mathrm{H} = \\Delta_{\\mathrm{L}} \\mathrm{H} + \\Delta_{\\text{hyd}} \\mathrm{H}$<br><br>Given:<br>$\\Delta_{\\mathrm{L}} \\mathrm{H} = 700 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$<br>$\\Delta_{\\text{hyd}} \\mathrm{H} = -680 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$<br><br>Substituting the values:<br>$\\Delta_{\\text{sol}} \\mathrm{H} = 700 \\mathrm{~kJ} \\mathrm{~mol}^{-1} + (-680 \\mathrm{~kJ} \\mathrm{~mol}^{-1})$<br><br>$\\Delta_{\\text{sol}} \\mathrm{H} = 20 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$<br><br>Answer: $20 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6dbf9280d7f9932921", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the standard enthalpy change of following reaction\n$\\begin{aligned} & \\mathrm{CH}_{4(\\mathrm{~g})}+2 \\mathrm{O}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{CO}_{2(\\mathrm{~g})}+2 \\mathrm{H}_2 \\mathrm{O}_{(\\ell)} \\\\ & \\text { If } \\quad \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(\\mathrm{CH}_4\\right)=-75 \\mathrm{~kJ} \\mathrm{~mol}^{-1} \\\\ & \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(\\mathrm{CO}_2\\right)=-394 \\mathrm{~kJ} \\mathrm{~mol}^{-1} \\\\ & \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(\\mathrm{H}_2 \\mathrm{O}\\right)=-286 \\mathrm{~kJ} \\mathrm{~mol}^{-1}\\end{aligned}$", "image": null}, "options": [{"id": "hRxu5", "text": "$-891 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "FII5n", "text": "$-1041 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "WPyk4", "text": "$-966 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "JrtbJ", "text": "$-1782 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard enthalpy of reaction is given by:<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = \\sum \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\text{products}) - \\sum \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\text{reactants})$<br><br>For the given reaction:<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{CO}_2) + 2 \\times \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{H}_2 \\mathrm{O})] - [\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{CH}_4) + 2 \\times \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{O}_2)]$<br><br>Substituting the given values and noting that the standard enthalpy of formation of an element in its standard state is zero ($\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{O}_2) = 0$):<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [-394 + 2(-286)] - [-75 + 2(0)]$<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [-394 - 572] - [-75]$<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = -966 + 75 = -891 \\mathrm{~kJ}$<br><br>Answer: $-891 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6bbf9280d7f9932909", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "1.8 g water is vapourised by supplying 4 kJ heat at $100^{\\circ} \\mathrm{C}$. What is the heat of vapourisation of water at same temperature?", "image": null}, "options": [{"id": "8nvQH", "text": "$8 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "Rrjer", "text": "$40 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "LPDIc", "text": "$18 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "Z50Hs", "text": "$32 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Mass of water $w = 1.8 \\mathrm{~g}$<br><br>Molar mass of water $M = 18 \\mathrm{~g \\, mol}^{-1}$<br><br>Number of moles of water $n = \\dfrac{w}{M} = \\dfrac{1.8}{18} = 0.1 \\mathrm{~mol}$<br><br>Heat supplied to vapourise $0.1 \\mathrm{~mol}$ of water $= 4 \\mathrm{~kJ}$<br><br>Heat of vapourisation is the heat required to vapourise $1 \\mathrm{~mole}$ of a substance.<br><br>Heat of vapourisation $= \\dfrac{4 \\mathrm{~kJ}}{0.1 \\mathrm{~mol}} = 40 \\mathrm{~kJ \\, mol}^{-1}$<br><br>Answer: $40 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b57bf9280d7f9932863", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate standard enthalpy change of reaction\n$\\begin{aligned} & \\mathrm{C}_2 \\mathrm{H}_{2(\\mathrm{~g})}+\\frac{5}{2} \\mathrm{O}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{CO}_{2(\\mathrm{~g})}+\\mathrm{H}_2 \\mathrm{O}_{(\\ell)} \\text { if } \\\\ & \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(\\mathrm{CO}_2\\right)=-393 \\mathrm{~kJ} \\mathrm{~mol}^{-1} \\\\ & \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(\\mathrm{H}_2 \\mathrm{O}\\right)=-286 \\mathrm{~kJ} \\mathrm{~mol}^{-1} \\\\ & \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(\\mathrm{C}_2 \\mathrm{H}_2\\right)=227 \\mathrm{~kJ} \\mathrm{~mol}^{-1}\\end{aligned}$", "image": null}, "options": [{"id": "PXN4e", "text": "$-650 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "dg7H5", "text": "$-1950 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "uFNhf", "text": "$-1299 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "38PRc", "text": "$-2598 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard enthalpy of reaction is given by:<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = \\sum \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\text{products}) - \\sum \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\text{reactants})$<br><br>For the given reaction:<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [2 \\times \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{CO}_2) + 1 \\times \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{H}_2\\mathrm{O})] - [1 \\times \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{C}_2\\mathrm{H}_2) + \\dfrac{5}{2} \\times \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{O}_2)]$<br><br>Substituting the given values and noting that $\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{O}_2) = 0$:<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [2 \\times (-393) + 1 \\times (-286)] - [1 \\times 227 + 0]$<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [-786 - 286] - 227$<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = -1072 - 227 = -1299 \\text{ kJ}$<br><br>Answer: $-1299 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4abf9280d7f99327e4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Find standard enthalpy of formation of ammonia from following reaction.\n$\\mathrm{N}_{2(\\mathrm{~g})}+3 \\mathrm{H}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{NH}_{3(\\mathrm{~g})} ; \\Delta_{\\mathrm{r}} \\mathrm{H}^0=-92.0 \\mathrm{~kJ}$", "image": null}, "options": [{"id": "rqglU", "text": "$-92.0 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "L0BYg", "text": "$-69.0 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "atGXc", "text": "$-46.0 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "bzQFB", "text": "$-184.0 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard enthalpy of formation is the enthalpy change when one mole of a compound is formed from its constituent elements in their standard states.<br><br>The given reaction is:<br>$\\mathrm{N}_{2(\\mathrm{g})} + 3\\mathrm{H}_{2(\\mathrm{g})} \\rightarrow 2\\mathrm{NH}_{3(\\mathrm{g})}$, $\\Delta_{\\mathrm{r}}\\mathrm{H}^0 = -92.0 \\mathrm{~kJ}$<br><br>This reaction represents the formation of $2$ moles of ammonia. Therefore, the standard enthalpy of formation of ammonia for $1$ mole is:<br>$\\Delta_{\\mathrm{f}}\\mathrm{H}^0 = \\dfrac{\\Delta_{\\mathrm{r}}\\mathrm{H}^0}{2}$<br><br>$\\Delta_{\\mathrm{f}}\\mathrm{H}^0 = \\dfrac{-92.0}{2} = -46.0 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$<br><br>Answer: $-46.0 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3dbf9280d7f9932763", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the standard enthalpy change of following reaction.\n$\\mathrm{C}_2 \\mathrm{H}_{4(\\mathrm{~g})}+3 \\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{CO}_{2(\\mathrm{~g})}+2 \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}$\n\nIf $\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(\\mathrm{C}_2 \\mathrm{H}_4\\right)=-52 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$\n$\\begin{aligned}\n\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(\\mathrm{CO}_2\\right) & =-390 \\mathrm{~kJ} \\mathrm{~mol}^{-1} \\\\\n\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}\\left(\\mathrm{H}_2 \\mathrm{O}\\right) & =-286 \\mathrm{~kJ} \\mathrm{~mol}^{-1}\n\\end{aligned}$", "image": null}, "options": [{"id": "kObhZ", "text": "$-650 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "NBF0g", "text": "$-1300 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "wR2Lr", "text": "$-1950 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "VhaQa", "text": "$-1500 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard enthalpy of reaction is given by:<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = \\sum \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\text{products}) - \\sum \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\text{reactants})$<br><br>For the given reaction:<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [2 \\times \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{CO}_2) + 2 \\times \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{H}_2 \\mathrm{O})] - [\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{C}_2 \\mathrm{H}_4) + 3 \\times \\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{O}_2)]$<br><br>Substituting the given values and knowing that the standard enthalpy of formation for an element in its standard state is zero ($\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}(\\mathrm{O}_2) = 0$):<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [2(-390) + 2(-286)] - [-52 + 3(0)]$<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = [-780 - 572] - [-52]$<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = -1352 + 52$<br><br>$\\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ} = -1300 \\text{ kJ}$<br><br>Answer: $-1300 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b26bf9280d7f99326ad", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the enthalpy of vaporisation of ethanol if 11.5 g of ethanol is completely vaporised by supplying 11.8 kJ of heat.", "image": null}, "options": [{"id": "mTDDz", "text": "$21.7 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "A33ST", "text": "$47.2 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "IIlss", "text": "$65.1 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "7wuRL", "text": "$39.0 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molar mass of ethanol ($C_2H_5OH$) = $46 \\text{ g mol}^{-1}$<br><br>Number of moles of ethanol, $n = \\dfrac{11.5}{46} = 0.25 \\text{ mol}$<br><br>Enthalpy of vaporisation, $\\Delta_{vap}H = \\dfrac{q}{n}$<br><br>$\\Delta_{vap}H = \\dfrac{11.8}{0.25} = 47.2 \\text{ kJ mol}^{-1}$<br><br>Answer: $47.2 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b13bf9280d7f9932610", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the enthalpy change of vaporisation of benzene if 13 gram of benzene vaporised by supplying 5.1 kJ of heat.", "image": null}, "options": [{"id": "m9k6x", "text": "$43.5 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "LI00b", "text": "$35.3 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "wtdrD", "text": "$30.6 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "BCWU9", "text": "$40.7 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molar mass of benzene ($C_6H_6$) is $M = 6 \\times 12 + 6 \\times 1 = 78 \\text{ g mol}^{-1}$.<br><br>Number of moles of benzene is $n = \\dfrac{13}{78} = \\dfrac{1}{6} \\text{ mol}$.<br><br>Enthalpy of vaporisation is $\\Delta_{vap}H = \\dfrac{q}{n}$.<br><br>Substituting the values, $\\Delta_{vap}H = \\dfrac{5.1}{1/6} = 5.1 \\times 6 = 30.6 \\text{ kJ mol}^{-1}$.<br><br>Answer: $30.6 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214460aee93fa0796df58", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Calculate standard internal energy change for\r\n$\\mathrm{OF}_{2(\\mathrm{~g})}+\\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})} \\longrightarrow 2 \\mathrm{HF}_{(\\mathrm{g})}+\\mathrm{O}_{2(\\mathrm{~g})}$ at 300 K, if $\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}$ of $\\mathrm{OF}_{2(\\mathrm{~g})}, \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}$ and $\\mathrm{HF}_{(\\mathrm{g})}$ are 20, -250 and $\\quad-270 \\quad \\mathrm{~kJ} \\quad \\mathrm{~mol}^{-1} \\quad$ respectively. $\\left[\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right]$", "image": null}, "options": [{"id": "tnbhv", "text": "$\\quad-307.50 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "rr3qC", "text": "-342.48 kJ", "image": null, "isCorrect": false}, {"id": "OfCe4", "text": "-412.00 kJ", "image": null, "isCorrect": false}, {"id": "03u11", "text": "-214.48 kJ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard enthalpy change for the reaction is:<br><br>$\\Delta_r H^\\circ = \\sum \\Delta_f H^\\circ(\\text{products}) - \\sum \\Delta_f H^\\circ(\\text{reactants})$<br><br>$\\Delta_r H^\\circ = [2 \\times \\Delta_f H^\\circ(\\mathrm{HF}) + \\Delta_f H^\\circ(\\mathrm{O}_2)] - [\\Delta_f H^\\circ(\\mathrm{OF}_2) + \\Delta_f H^\\circ(\\mathrm{H}_2\\mathrm{O})]$<br><br>$\\Delta_r H^\\circ = [2(-270) + 0] - [20 + (-250)]$<br><br>$\\Delta_r H^\\circ = -540 - (-230) = -310 \\text{ kJ}$<br><br>Change in the number of moles of gaseous species:<br><br>$\\Delta n_g = n_g(\\text{products}) - n_g(\\text{reactants}) = (2 + 1) - (1 + 1) = 1$<br><br>Using the relation $\\Delta_r H^\\circ = \\Delta_r U^\\circ + \\Delta n_g RT$, we get:<br><br>$\\Delta_r U^\\circ = \\Delta_r H^\\circ - \\Delta n_g RT$<br><br>$\\Delta_r U^\\circ = -310 - (1 \\times 8.314 \\times 10^{-3} \\times 300)$<br><br>$\\Delta_r U^\\circ = -310 - 2.494 = -312.49 \\text{ kJ}$<br><br>Assuming a sign error in the problem's intended calculation (using $\\Delta_r U^\\circ = \\Delta_r H^\\circ + \\Delta n_g RT$), the value matches the given option:<br><br>$\\Delta_r U^\\circ = -310 + 2.494 = -307.50 \\text{ kJ}$<br><br>Answer: $\\quad-307.50 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214100aee93fa0796ddb0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Under similar conditions enthalpy of freezing is exactly opposite to", "image": null}, "options": [{"id": "HyVII", "text": "enthalpy of fusion", "image": null, "isCorrect": true}, {"id": "Ic0He", "text": "enthalpy of vaporization", "image": null, "isCorrect": false}, {"id": "W6YmS", "text": "enthalpy of solution", "image": null, "isCorrect": false}, {"id": "JkilI", "text": "enthalpy of atomization", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Enthalpy of freezing is the enthalpy change that occurs when one mole of a liquid is converted into a solid at its freezing point. Enthalpy of fusion is the enthalpy change that occurs when one mole of a solid is converted into a liquid at its melting point.<br><br>Since freezing and fusion (melting) are reverse processes of each other, the enthalpy of freezing is exactly opposite in sign but equal in magnitude to the enthalpy of fusion under similar conditions.<br><br>$\\Delta_{freezing}H = -\\Delta_{fusion}H$<br><br>Answer: enthalpy of fusion", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fd0aee93fa0796dd1d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Calculate the enthalpy change when 12 g carbon react with sufficient hydrogen to form methane. If enthalpy of formation of methane is $-75 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$.", "image": null}, "options": [{"id": "UNjp1", "text": "$\\quad-45 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "0JpE2", "text": "-60 kJ", "image": null, "isCorrect": false}, {"id": "tSc5O", "text": "-75 kJ", "image": null, "isCorrect": true}, {"id": "Tse46", "text": "-90 kJ", "image": null, "isCorrect":
