rect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the work done in the oxidation of one mole $\\mathrm{HCl}_{(\\mathrm{g})}$ at $27^{\\circ} \\mathrm{C}$, according to reaction.\n$4 \\mathrm{HCl}_{(\\mathrm{g})}+\\mathrm{O}_{2_{(\\mathrm{g})}} \\rightarrow 2 \\mathrm{Cl}_{2_{(\\mathrm{g})}}+2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})} \\quad\\left(\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right)$", "image": null}, "options": [{"id": "7lLUB", "text": "2494.2 J", "image": null, "isCorrect": false}, {"id": "wzwDb", "text": "623.6 J", "image": null, "isCorrect": true}, {"id": "40lMZ", "text": "$1247.1 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "46j0G", "text": "1870.7 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is:<br><br>$4 \\mathrm{HCl}_{(\\mathrm{g})} + \\mathrm{O}_{2(\\mathrm{g})} \\rightarrow 2 \\mathrm{Cl}_{2(\\mathrm{g})} + 2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}$<br><br>For the oxidation of $4$ moles of $\\mathrm{HCl}$, the change in the number of moles of gaseous substances is:<br><br>$\\Delta n_g = (n_g)_{\\text{products}} - (n_g)_{\\text{reactants}} = (2 + 2) - (4 + 1) = -1 \\text{ mol}$<br><br>The work done for the oxidation of $4$ moles of $\\mathrm{HCl}$ is given by:<br><br>$W = -\\Delta n_g R T$<br><br>$W = -(-1) \\times 8.314 \\times 300 = 2494.2 \\text{ J}$<br><br>Therefore, the work done for the oxidation of $1$ mole of $\\mathrm{HCl}$ is:<br><br>$W_{1 \\text{ mol}} = \\dfrac{2494.2}{4} = 623.55 \\text{ J} \\approx 623.6 \\text{ J}$<br><br>Answer: 623.6 J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871beebf9280d7f9932dbb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the work done in kJ when 3 moles of an ideal gas at $27^{\\circ} \\mathrm{C}$ expand isothermally and reversibly from 10 atm . to $1 \\mathrm{~atm}\\left[\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right]$", "image": null}, "options": [{"id": "Ac3B2", "text": "-17.23", "image": null, "isCorrect": true}, {"id": "cVyRn", "text": "-27.23", "image": null, "isCorrect": false}, {"id": "75jWE", "text": "-34.46", "image": null, "isCorrect": false}, {"id": "JB7SX", "text": "-68.92", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done in an isothermal reversible expansion of an ideal gas is given by the formula:<br><br>$W = -2.303 n R T \\log_{10} \\left( \\dfrac{P_1}{P_2} \\right)$<br><br>Given:<br>$n = 3 \\text{ mol}$<br>$R = 8.314 \\text{ J K}^{-1} \\text{ mol}^{-1}$<br>$T = 27^{\\circ}\\text{C} = 27 + 273 = 300 \\text{ K}$<br>$P_1 = 10 \\text{ atm}$<br>$P_2 = 1 \\text{ atm}$<br><br>Substituting the values into the formula:<br><br>$W = -2.303 \\times 3 \\times 8.314 \\times 300 \\times \\log_{10} \\left( \\dfrac{10}{1} \\right)$<br><br>$W = -2.303 \\times 7482.6 \\times \\log_{10} (10)$<br><br>$W = -17232.43 \\times 1 \\text{ J}$<br><br>$W = -17232.43 \\text{ J}$<br><br>$W = -17.23 \\text{ kJ}$<br><br>Answer: -17.23", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bddbf9280d7f9932d1c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the work done if 1 mole of certain gas compressed isothermally and reversibly at 300 K from initial pressure $x$ bar to final pressure $2 x$ bar $\\left[\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right]$", "image": null}, "options": [{"id": "oEDQe", "text": "1.729 kJ", "image": null, "isCorrect": true}, {"id": "7Aenh", "text": "0.865 kJ", "image": null, "isCorrect": false}, {"id": "cPWS6", "text": "2.593 kJ", "image": null, "isCorrect": false}, {"id": "RB1NJ", "text": "3.458 kJ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done in an isothermal and reversible process is given by the formula:<br><br>$W = 2.303 nRT \\log_{10} \\left( \\dfrac{P_2}{P_1} \\right)$<br><br>Given values are:<br>$n = 1 \\text{ mol}$<br>$R = 8.314 \\text{ J K}^{-1} \\text{ mol}^{-1}$<br>$T = 300 \\text{ K}$<br>$P_1 = x \\text{ bar}$<br>$P_2 = 2x \\text{ bar}$<br><br>Substituting the values into the formula:<br><br>$W = 2.303 \\times 1 \\times 8.314 \\times 300 \\times \\log_{10} \\left( \\dfrac{2x}{x} \\right)$<br><br>$W = 2.303 \\times 8.314 \\times 300 \\times \\log_{10}(2)$<br><br>Using $\\log_{10}(2) = 0.3010$:<br><br>$W = 2.303 \\times 8.314 \\times 300 \\times 0.3010$<br><br>$W = 1728.9 \\text{ J}$<br><br>$W = 1.729 \\text{ kJ}$<br><br>Answer: 1.729 kJ", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bccbf9280d7f9932c83", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the change in internal energy of the system if work done by the system is 18 joule and absorbs heat 50 joule in a particular reaction.", "image": null}, "options": [{"id": "yb9QJ", "text": "20 J", "image": null, "isCorrect": false}, {"id": "Gmggc", "text": "32 J", "image": null, "isCorrect": true}, {"id": "m43v0", "text": "48 J", "image": null, "isCorrect": false}, {"id": "kViZ8", "text": "68 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics, the change in internal energy ($\\Delta U$) is given by:<br><br>$\\Delta U = q + W$<br><br>Since heat is absorbed by the system, $q = +50$ J.<br><br>Since work is done by the system, $W = -18$ J.<br><br>Substituting these values into the equation:<br><br>$\\Delta U = 50 + (-18) = 32$ J<br><br>Answer: 32 J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbabf9280d7f9932be6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the work done in joule if 1 mole of an ideal gas compressed from volume $24 \\mathrm{dm}^3$ to $13 \\mathrm{dm}^3$ at constant external pressure 3 bar.", "image": null}, "options": [{"id": "O181o", "text": "3300 J", "image": null, "isCorrect": true}, {"id": "W5SxZ", "text": "2250 J", "image": null, "isCorrect": false}, {"id": "zE7JL", "text": "4400 J", "image": null, "isCorrect": false}, {"id": "jL2n6", "text": "4870 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Initial volume, $V_1 = 24 \\text{ dm}^3$<br>Final volume, $V_2 = 13 \\text{ dm}^3$<br>Constant external pressure, $P_{\\text{ext}} = 3 \\text{ bar}$<br><br>The work done during compression against a constant external pressure is given by:<br>$W = -P_{\\text{ext}} \\Delta V = -P_{\\text{ext}} (V_2 - V_1)$<br><br>Substituting the given values:<br>$W = -3 \\times (13 - 24)$<br>$W = -3 \\times (-11) = 33 \\text{ bar dm}^3$<br><br>To convert the work done into Joules, we use the conversion factor $1 \\text{ bar dm}^3 = 100 \\text{ J}$:<br>$W = 33 \\times 100 \\text{ J} = 3300 \\text{ J}$<br><br>Answer: 3300 J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba9bf9280d7f9932b57", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the work done in joule if 1 mole of ideal gas is compressed from $25 \\mathrm{dm}^3$ to $13 \\mathrm{dm}^3$ at constant external pressure 4 bar.", "image": null}, "options": [{"id": "NK1wA", "text": "2400 J", "image": null, "isCorrect": false}, {"id": "t3cIg", "text": "4800 J", "image": null, "isCorrect": true}, {"id": "7v0mG", "text": "6000 J", "image": null, "isCorrect": false}, {"id": "CeLbU", "text": "7200 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done during an irreversible process at constant external pressure is given by:<br><br>$W = -P_{\\text{ext}} \\Delta V = -P_{\\text{ext}} (V_2 - V_1)$<br><br>Given:<br>$P_{\\text{ext}} = 4 \\text{ bar}$<br>$V_1 = 25 \\text{ dm}^3$<br>$V_2 = 13 \\text{ dm}^3$<br><br>Substituting the values:<br><br>$W = -4 \\times (13 - 25)$<br><br>$W = -4 \\times (-12) = 48 \\text{ bar dm}^3$<br><br>To convert the work done into joules, we use the conversion factor $1 \\text{ bar dm}^3 = 100 \\text{ J}$:<br><br>$W = 48 \\times 100 \\text{ J} = 4800 \\text{ J}$<br><br>Answer: 4800 J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9cbf9280d7f9932adf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate work done if 1 mole of an ideal gas expands isothermally from $2 \\mathrm{dm}^3$ to $2.8 \\mathrm{dm}^3$ against constant external pressure 1 atm", "image": null}, "options": [{"id": "CAhMx", "text": "$-40.52 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "iLgXj", "text": "$-81.04 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "TCeN9", "text": "$-121.56 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "SvSRa", "text": "$-60.78 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done during expansion against a constant external pressure is given by the formula:<br><br>$W = -P_{\\text{ext}} \\Delta V$<br><br>Given:<br><br>$P_{\\text{ext}} = 1 \\text{ atm}$<br><br>$V_1 = 2 \\text{ dm}^3$<br><br>$V_2 = 2.8 \\text{ dm}^3$<br><br>$\\Delta V = V_2 - V_1 = 2.8 - 2 = 0.8 \\text{ dm}^3$<br><br>Substituting the values into the formula:<br><br>$W = -1 \\text{ atm} \\times 0.8 \\text{ dm}^3 = -0.8 \\text{ dm}^3 \\text{ atm}$<br><br>To convert the work into Joules, we use the conversion factor $1 \\text{ dm}^3 \\text{ atm} = 101.3 \\text{ J}$:<br><br>$W = -0.8 \\times 101.3 \\text{ J} = -81.04 \\text{ J}$<br><br>Answer: $-81.04 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8abf9280d7f9932a2d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate work done in isothermal reversible expansion of 1 mole ideal gas from initial pressure 10 bar to final pressure 1 bar at 300 K $\\left(\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right)$", "image": null}, "options": [{"id": "eD4ke", "text": "$-2.87 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "Zqyvg", "text": "$-8.60 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "f3rjQ", "text": "$-5.74 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "eDnr6", "text": "$-11.49 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done in an isothermal reversible expansion is given by the formula:<br><br>$W = -2.303 n R T \\log_{10} \\left( \\dfrac{P_1}{P_2} \\right)$<br><br>Substituting the given values:<br><br>$n = 1 \\text{ mol}$<br><br>$R = 8.314 \\text{ J K}^{-1} \\text{ mol}^{-1}$<br><br>$T = 300 \\text{ K}$<br><br>$P_1 = 10 \\text{ bar}$<br><br>$P_2 = 1 \\text{ bar}$<br><br>$W = -2.303 \\times 1 \\times 8.314 \\times 300 \\times \\log_{10} \\left( \\dfrac{10}{1} \\right)$<br><br>$W = -2.303 \\times 2494.2 \\times 1$<br><br>$W = -5744.14 \\text{ J}$<br><br>$W = -5.74 \\text{ kJ}$<br><br>Answer: $-5.74 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7cbf9280d7f99329ac", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the change in internal energy of the system if 20 kJ work is done on the system and it releases 10 kJ heat in a particular reaction.", "image": null}, "options": [{"id": "HekDo", "text": "20 kJ", "image": null, "isCorrect": false}, {"id": "8LCCE", "text": "40 kJ", "image": null, "isCorrect": false}, {"id": "BPII2", "text": "10 kJ", "image": null, "isCorrect": true}, {"id": "LaS49", "text": "30 kJ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics, the change in internal energy is given by:<br><br>$\\Delta U = q + W$<br><br>Since work is done on the system, $W = +20 \\text{ kJ}$.<br><br>Since heat is released by the system, $q = -10 \\text{ kJ}$.<br><br>Substituting these values, we get:<br><br>$\\Delta U = -10 \\text{ kJ} + 20 \\text{ kJ} = +10 \\text{ kJ}$<br><br>Answer: 10 kJ", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b79bf9280d7f993298f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify from following reactions that exhibits negative work done.", "image": null}, "options": [{"id": "ix8vm", "text": "$2 \\mathrm{H}_2 \\mathrm{O}_{2(\\ell)} \\rightarrow 2 \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}+\\mathrm{O}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": true}, {"id": "W32Yn", "text": "$\\mathrm{NH}_{3(\\mathrm{~g})}+\\mathrm{HCl}_{(\\mathrm{g})} \\rightarrow \\mathrm{NH}_4 \\mathrm{Cl}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}, {"id": "L11bA", "text": "$\\mathrm{H}_{2(\\mathrm{~g})}+\\mathrm{Cl}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{HCl}_{(\\mathrm{g})}$", "image": null, "isCorrect": false}, {"id": "NQc3Y", "text": "$\\mathrm{N}_{2(\\mathrm{~g})}+3 \\mathrm{H}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{NH}_{3(\\mathrm{~g})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done in a chemical reaction is given by the expression $W = -\\Delta n_g RT$, where $\\Delta n_g$ is the change in the number of moles of gaseous substances.<br><br>For work done to be negative ($W < 0$), the value of $\\Delta n_g$ must be positive ($\\Delta n_g > 0$), which means the reaction involves an expansion (increase in gaseous moles).<br><br>Let us calculate $\\Delta n_g$ for each given reaction:<br><br>For $2 \\mathrm{H}_2 \\mathrm{O}_{2(\\ell)} \\rightarrow 2 \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}+\\mathrm{O}_{2(\\mathrm{~g})}$:<br>$\\Delta n_g = 1 - 0 = 1 > 0$<br>Since $\\Delta n_g$ is positive, $W = -1 \\times RT = -RT < 0$. This reaction exhibits negative work done.<br><br>For $\\mathrm{NH}_{3(\\mathrm{~g})}+\\mathrm{HCl}_{(\\mathrm{g})} \\rightarrow \\mathrm{NH}_4 \\mathrm{Cl}_{(\\mathrm{s})}$:<br>$\\Delta n_g = 0 - (1 + 1) = -2 < 0$<br>Here $W = -(-2)RT = 2RT > 0$ (positive work done).<br><br>For $\\mathrm{H}_{2(\\mathrm{~g})}+\\mathrm{Cl}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{HCl}_{(\\mathrm{g})}$:<br>$\\Delta n_g = 2 - (1 + 1) = 0$<br>Here $W = 0$ (zero work done).<br><br>For $\\mathrm{N}_{2(\\mathrm{~g})}+3 \\mathrm{H}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{NH}_{3(\\mathrm{~g})}$:<br>$\\Delta n_g = 2 - (1 + 3) = -2 < 0$<br>Here $W = -(-2)RT = 2RT > 0$ (positive work done).<br><br>Answer: $2 \\mathrm{H}_2 \\mathrm{O}_{2(\\ell)} \\rightarrow 2 \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}+\\mathrm{O}_{2(\\mathrm{~g})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b69bf9280d7f99328fb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the work done in joule if 2 moles of an ideal gas expand isothermally from $15.5 \\mathrm{dm}^3$ to $20 \\mathrm{dm}^3$ at constant pressure 1 atm .", "image": null}, "options": [{"id": "fdbcu", "text": "$-456 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "amAWk", "text": "$-228 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "8bIki", "text": "$-684 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "AZqOK", "text": "$-912 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done during expansion against a constant external pressure is given by $W = -P_{\\text{ext}} \\Delta V$.<br><br>Given $P_{\\text{ext}} = 1 \\text{ atm}$, $V_1 = 15.5 \\text{ dm}^3$, and $V_2 = 20 \\text{ dm}^3$.<br><br>$\\Delta V = V_2 - V_1 = 20 - 15.5 = 4.5 \\text{ dm}^3$<br><br>$W = -1 \\times 4.5 = -4.5 \\text{ dm}^3 \\text{ atm}$<br><br>To convert the work into joules, multiply by $101.3 \\text{ J} / \\text{dm}^3 \\text{ atm}$:<br><br>$W = -4.5 \\times 101.3 \\text{ J} = -455.85 \\text{ J} \\approx -456 \\text{ J}$<br><br>Answer: $-456 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5abf9280d7f993287c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the change in internal energy of the system if 25 kJ of work done by the system and it absorbs 10 kJ of heat.", "image": null}, "options": [{"id": "eQWW6", "text": "$-10 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "hGan5", "text": "$-35 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "nIDqP", "text": "$-15 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "fIOhW", "text": "$-25 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics:<br><br>$\\Delta U = q + W$<br><br>where $q$ is the heat absorbed by the system and $W$ is the work done on the system.<br><br>Given:<br>Heat absorbed by the system, $q = +10 \\text{ kJ}$<br>Work done by the system, $W = -25 \\text{ kJ}$<br><br>Substituting the values:<br><br>$\\Delta U = 10 + (-25) = -15 \\text{ kJ}$<br><br>Answer: $-15 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b48bf9280d7f99327d1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the work done in following reaction at $27^{\\circ} \\mathrm{C}$.\n$4 \\mathrm{SO}_{2(\\mathrm{~g})}+2 \\mathrm{O}_{2(\\mathrm{~g})} \\rightarrow 4 \\mathrm{SO}_{3(\\mathrm{~g})},\\left(\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right)$", "image": null}, "options": [{"id": "r9Lct", "text": "$4988.4 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "tl63r", "text": "$2494.2 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "KMM9g", "text": "$1247.1 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "YfPco", "text": "$3741.3 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given chemical reaction is:<br>$4 \\mathrm{SO}_{2(\\mathrm{g})} + 2 \\mathrm{O}_{2(\\mathrm{g})} \\rightarrow 4 \\mathrm{SO}_{3(\\mathrm{g})}$<br><br>The change in the number of moles of gas ($\\Delta n_g$) is given by:<br>$\\Delta n_g = \\text{moles of gaseous products} - \\text{moles of gaseous reactants}$<br>$\\Delta n_g = 4 - (4 + 2) = 4 - 6 = -2 \\text{ mol}$<br><br>The temperature is $T = 27^{\\circ} \\mathrm{C} = 27 + 273 = 300 \\mathrm{~K}$.<br><br>The work done in a chemical reaction is given by the formula:<br>$W = -\\Delta n_g R T$<br><br>Substituting the values:<br>$W = -(-2 \\text{ mol}) \\times 8.314 \\mathrm{~J \\mathrm{~K}^{-1} \\mathrm{mol}^{-1} \\times 300 \\mathrm{~K}$<br>$W = 2 \\times 8.314 \\times 300$<br>$W = 600 \\times 8.314$<br>$W = 4988.4 \\mathrm{~J}$<br><br>Answer: $4988.4 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b38bf9280d7f9932736", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate work done if 1 mole of an ideal gas compressed isothermally and reversibly from $12 \\mathrm{dm}^3$ to $6 \\mathrm{dm}^3$ at 300 K .\n$\\left[\\mathrm{R}=8.314 \\mathrm{JK}^{-1} \\mathrm{~mol}^{-1}\\right]$", "image": null}, "options": [{"id": "SzWf4", "text": "1.729 kJ", "image": null, "isCorrect": true}, {"id": "G1dMV", "text": "3.458 kJ", "image": null, "isCorrect": false}, {"id": "H4O0D", "text": "5.187 kJ", "image": null, "isCorrect": false}, {"id": "mXLtn", "text": "6.916 kJ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done in an isothermal reversible process is given by the formula:<br><br>$W = -2.303 nRT \\log_{10} \\left( \\dfrac{V_2}{V_1} \\right)$<br><br>Given:<br>$n = 1 \\text{ mol}$<br>$R = 8.314 \\text{ J K}^{-1} \\text{ mol}^{-1}$<br>$T = 300 \\text{ K}$<br>$V_1 = 12 \\text{ dm}^3$<br>$V_2 = 6 \\text{ dm}^3$<br><br>Substituting the values into the formula:<br><br>$W = -2.303 \\times 1 \\times 8.314 \\times 300 \\times \\log_{10} \\left( \\dfrac{6}{12} \\right)$<br><br>$W = -2.303 \\times 8.314 \\times 300 \\times \\log_{10} (0.5)$<br><br>Using $\\log_{10} (0.5) = -0.3010$:<br><br>$W = -5744.14 \\times (-0.3010)$<br><br>$W = 1728.98 \\text{ J}$<br><br>$W \\approx 1.729 \\text{ kJ}$<br><br>Answer: 1.729 kJ", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b25bf9280d7f99326a6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the constant external pressure required to expand 2 moles of an ideal gas from volume $15 \\mathrm{dm}^3$ to $20 \\mathrm{dm}^3$ if amount of work done is $-600 \\mathrm{~J}$", "image": null}, "options": [{"id": "jP41A", "text": "1.2 bar", "image": null, "isCorrect": true}, {"id": "ypkts", "text": "1.5 bar", "image": null, "isCorrect": false}, {"id": "4Dkpz", "text": "1.8 bar", "image": null, "isCorrect": false}, {"id": "pGr1O", "text": "2.1 bar", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done during expansion against a constant external pressure is given by the formula:<br><br>$W = -P_{\\text{ext}} \\Delta V$<br><br>Given:<br>$W = -600 \\text{ J}$<br>$V_1 = 15 \\text{ dm}^3$<br>$V_2 = 20 \\text{ dm}^3$<br><br>Change in volume, $\\Delta V = V_2 - V_1 = 20 - 15 = 5 \\text{ dm}^3$<br><br>We know the conversion factor between Joules and $\\text{dm}^3 \\cdot \\text{bar}$ is:<br>$1 \\text{ dm}^3 \\cdot \\text{bar} = 100 \\text{ J}$<br><br>Converting the work done into $\\text{dm}^3 \\cdot \\text{bar}$:<br>$W = \\dfrac{-600}{100} = -6 \\text{ dm}^3 \\cdot \\text{bar}$<br><br>Substituting the values into the work formula:<br>$-6 = -P_{\\text{ext}} \\times 5$<br><br>$P_{\\text{ext}} = \\dfrac{6}{5} = 1.2 \\text{ bar}$<br><br>Answer: 1.2 bar", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b25bf9280d7f99326a5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following process involves zero work done?", "image": null}, "options": [{"id": "VvK8D", "text": "Isobaric expansion of gas.", "image": null, "isCorrect": false}, {"id": "M04wo", "text": "Adiabatic compression of gas.", "image": null, "isCorrect": false}, {"id": "qXOhk", "text": "Isothermal expansion of gas.", "image": null, "isCorrect": false}, {"id": "9GUb8", "text": "Free expansion of gas.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Work done by a gas during expansion is given by $W = -P_{ext} \\Delta V$.<br><br>In free expansion, a gas expands into a vacuum where the external pressure is zero ($P_{ext} = 0$).<br><br>Substituting $P_{ext} = 0$ in the work equation gives $W = 0$.<br><br>Therefore, free expansion of a gas involves zero work done.<br><br>Answer: Free expansion of gas.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b02bf9280d7f9932593", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following reactions performs zero work?", "image": null}, "options": [{"id": "FxeAv", "text": "$\\mathrm{CH}_{4(\\mathrm{~g})}+\\mathrm{Cl}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{CH}_3 \\mathrm{Cl}_{(\\mathrm{g})}+\\mathrm{HCl}_{(\\mathrm{g})}$", "image": null, "isCorrect": true}, {"id": "bjBxr", "text": "$3 \\mathrm{H}_{2(\\mathrm{~g})}+\\mathrm{N}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{NH}_{3(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "CNsdG", "text": "$\\mathrm{C}_2 \\mathrm{H}_{2(\\mathrm{~g})}+\\frac{5}{2} \\mathrm{O}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{CO}_{2(\\mathrm{~g})}+\\mathrm{H}_2 \\mathrm{O}_{(l)}$", "image": null, "isCorrect": false}, {"id": "G7AgN", "text": "$2 \\mathrm{C}_2 \\mathrm{H}_{6(\\mathrm{~g})}+7 \\mathrm{O}_{2(\\mathrm{~g})} \\rightarrow 4 \\mathrm{CO}_{2(\\mathrm{~g})}+6 \\mathrm{H}_2 \\mathrm{O}_{(l)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done in a chemical reaction at constant temperature and pressure is given by $W = -\\Delta n_g RT$, where $\\Delta n_g$ is the difference between the number of moles of gaseous products and gaseous reactants.<br><br>For work to be zero, $\\Delta n_g$ must be zero.<br><br>Let us calculate $\\Delta n_g$ for each given reaction:<br><br>For $\\mathrm{CH}_{4(\\mathrm{g})}+\\mathrm{Cl}_{2(\\mathrm{g})} \\rightarrow \\mathrm{CH}_3 \\mathrm{Cl}_{(\\mathrm{g})}+\\mathrm{HCl}_{(\\mathrm{g})}$:<br>$\\Delta n_g = (1 + 1) - (1 + 1) = 2 - 2 = 0$<br>Since $\\Delta n_g = 0$, the work done is zero.<br><br>For $3 \\mathrm{H}_{2(\\mathrm{g})}+\\mathrm{N}_{2(\\mathrm{g})} \\rightarrow 2 \\mathrm{NH}_{3(\\mathrm{g})}$:<br>$\\Delta n_g = 2 - (3 + 1) = -2$<br><br>For $\\mathrm{C}_2 \\mathrm{H}_{2(\\mathrm{g})}+\\dfrac{5}{2} \\mathrm{O}_{2(\\mathrm{g})} \\rightarrow 2 \\mathrm{CO}_{2(\\mathrm{g})}+\\mathrm{H}_2 \\mathrm{O}_{(l)}$:<br>$\\Delta n_g = 2 - \\left(1 + \\dfrac{5}{2}\\right) = -1.5$<br><br>For $2 \\mathrm{C}_2 \\mathrm{H}_{6(\\mathrm{g})}+7 \\mathrm{O}_{2(\\mathrm{g})} \\rightarrow 4 \\mathrm{CO}_{2(\\mathrm{g})}+6 \\mathrm{H}_2 \\mathrm{O}_{(l)}$:<br>$\\Delta n_g = 4 - (2 + 7) = -5$<br><br>Therefore, the reaction $\\mathrm{CH}_{4(\\mathrm{g})}+\\mathrm{Cl}_{2(\\mathrm{g})} \\rightarrow \\mathrm{CH}_3 \\mathrm{Cl}_{(\\mathrm{g})}+\\mathrm{HCl}_{(\\mathrm{g})}$ performs zero work.<br><br>Answer: $\\mathrm{CH}_{4(\\mathrm{~g})}+\\mathrm{Cl}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{CH}_3 \\mathrm{Cl}_{(\\mathrm{g})}+\\mathrm{HCl}_{(\\mathrm{g})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b01bf9280d7f9932588", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the change in internal energy of the system if 20 kJ of work is done on the system and it releases 10 kJ of heat in a particular reaction.", "image": null}, "options": [{"id": "abnnO", "text": "30 kJ", "image": null, "isCorrect": false}, {"id": "UDkUo", "text": "10 kJ", "image": null, "isCorrect": true}, {"id": "vbpC5", "text": "$-15 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "jMwXh", "text": "$-20 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics, the change in internal energy is given by $\\Delta U = q + W$.<br><br>Since work is done on the system, $W = +20 \\text{ kJ}$.<br><br>Since heat is released by the system, $q = -10 \\text{ kJ}$.<br><br>Substituting these values into the equation:<br><br>$\\Delta U = -10 \\text{ kJ} + 20 \\text{ kJ} = +10 \\text{ kJ}$.<br><br>Answer: 10 kJ", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214480aee93fa0796df6a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Calculate internal energy change of a system if work done by the system is 8 J and heat supplied to it is 40 J .", "image": null}, "options": [{"id": "18YgC", "text": "-48 J", "image": null, "isCorrect": false}, {"id": "9G4AA", "text": "-40 J", "image": null, "isCorrect": false}, {"id": "P1r6j", "text": "$32 \\mathrm{J}$", "image": null, "isCorrect": true}, {"id": "sqjFB", "text": "24 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics:<br><br>$\\Delta U = q + W$<br><br>Heat supplied to the system, $q = +40$ J<br><br>Work done by the system, $W = -8$ J<br><br>$\\Delta U = 40 - 8 = 32$ J<br><br>Answer: $32 \\mathrm{J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214340aee93fa0796dece", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Find work done on 2 mole of an ideal gas at $27^{\\circ} \\mathrm{C}$ if it is compressed reversibly and isothermally from $1.01 \\times 10^5 \\mathrm{Nm}^{-2}$ to $5.05 \\times 10^6 \\mathrm{Nm}^{-2}$ pressure.", "image": null}, "options": [{"id": "xMOHm", "text": "19.52 kJ", "image": null, "isCorrect": true}, {"id": "c16h4", "text": "1.95 kJ", "image": null, "isCorrect": false}, {"id": "5CsVh", "text": "39.04 kJ", "image": null, "isCorrect": false}, {"id": "qFxxU", "text": "3.904 kJ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a reversible isothermal process, the work done is given by:<br><br>$W = -2.303 nRT \\log_{10} \\left( \\dfrac{P_1}{P_2} \\right)$<br><br>Given:<br>$n = 2 \\text{ mol}$<br>$T = 27^{\\circ} \\mathrm{C} = 300 \\text{ K}$<br>$R = 8.314 \\text{ J K}^{-1} \\text{ mol}^{-1}$<br>$P_1 = 1.01 \\times 10^5 \\text{ Nm}^{-2}$<br>$P_2 = 5.05 \\times 10^6 \\text{ Nm}^{-2}$<br><br>Substituting the values into the formula:<br><br>$W = -2.303 \\times 2 \\times 8.314 \\times 300 \\times \\log_{10} \\left( \\dfrac{1.01 \\times 10^5}{5.05 \\times 10^6} \\right)$<br><br>$W = -11488.28 \\times \\log_{10} \\left( \\dfrac{1}{50} \\right)$<br><br>$W = 11488.28 \\times \\log_{10} (50)$<br><br>Using $\\log_{10} (50) = \\log_{10} \\left(\\dfrac{100}{2}\\right) = 2 - 0.3010 = 1.699$:<br><br>$W = 11488.28 \\times 1.699$<br><br>$W = 19518.58 \\text{ J}$<br><br>$W = 19.52 \\text{ kJ}$<br><br>Answer: 19.52 kJ", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214240aee93fa0796de4f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "In a particular reaction ' $x$ ' kJ of heat is released by the system and ' y ' kJ of work done is done on the system. What is internal energy change?", "image": null}, "options": [{"id": "lllqN", "text": "$\\mathrm{x}-\\mathrm{ykJ}$", "image": null, "isCorrect": false}, {"id": "XgLiK", "text": "$\\mathrm{y}-\\mathrm{xkJ}$", "image": null, "isCorrect": true}, {"id": "Uo3RY", "text": "$\\mathrm{x}+\\mathrm{ykJ}$", "image": null, "isCorrect": false}, {"id": "mq1yD", "text": "xy kJ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics, the change in internal energy is given by $\\Delta U = q + W$.<br><br>Since heat is released by the system, $q = -x$ kJ.<br><br>Since work is done on the system, $W = +y$ kJ.<br><br>Substituting these values into the equation, we get $\\Delta U = -x + y = y - x$ kJ.<br><br>Answer: $\\mathrm{y}-\\mathrm{xkJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214230aee93fa0796de45", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Find the constant external pressure required to expand a gas from 2.5 L to 4.5 L if amount of work done is 500 J at 298 K ?", "image": null}, "options": [{"id": "dKeGK", "text": "1 bar", "image": null, "isCorrect": false}, {"id": "Lz4Mn", "text": "2.0 bar", "image": null, "isCorrect": false}, {"id": "efo7W", "text": "1.5 bar", "image": null, "isCorrect": false}, {"id": "F2dlj", "text": "2.5 bar", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The magnitude of work done during expansion against a constant external pressure is given by $|W| = P_{ext} \\Delta V$.<br><br>Given $|W| = 500 \\text{ J}$.<br><br>Since $1 \\text{ L bar} = 100 \\text{ J}$, the work done in L bar is:<br><br>$|W| = \\dfrac{500}{100} \\text{ L bar} = 5 \\text{ L bar}$<br><br>The change in volume is:<br><br>$\\Delta V = V_2 - V_1 = 4.5 \\text{ L} - 2.5 \\text{ L} = 2.0 \\text{ L}$<br><br>Substituting the values into the work equation:<br><br>$5 \\text{ L bar} = P_{ext} \\times 2.0 \\text{ L}$<br><br>$P_{ext} = \\dfrac{5}{2.0} \\text{ bar} = 2.5 \\text{ bar}$<br><br>Answer: 2.5 bar", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214210aee93fa0796de36", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "A system performs mechanical work equal to 15 kJ and looses 2 kJ of heat to surrounding. What is the change in internal energy of a system?", "image": null}, "options": [{"id": "LwOJj", "text": "-15 kJ", "image": null, "isCorrect": false}, {"id": "TbeSE", "text": "-17 kJ", "image": null, "isCorrect": true}, {"id": "lKLzn", "text": "13 kJ", "image": null, "isCorrect": false}, {"id": "KWzIO", "text": "19 kJ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics:<br><br>$\\Delta U = q + W$<br><br>Since the system loses heat to the surroundings, the heat transferred is negative:<br><br>$q = -2$ kJ<br><br>Since the system performs mechanical work on the surroundings, the work done is negative:<br><br>$W = -15$ kJ<br><br>Substituting these values into the equation:<br><br>$\\Delta U = -2 + (-15) = -17$ kJ<br><br>Answer: -17 kJ", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214120aee93fa0796ddbc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "100 ml of $\\mathrm{H}_{2(\\mathrm{~g})}$ and 100 ml of $\\mathrm{Cl}_{2(\\mathrm{~g})}$ were allowed to react at 1 bar pressure as\r\n$\\mathrm{H}_{2(\\mathrm{~g})}+\\mathrm{Cl}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{HCl}_{(\\mathrm{g})}$\r\nWhat will be the PV type of work done diuring reaction?", "image": null}, "options": [{"id": "kv11B", "text": "Zero J", "image": null, "isCorrect": true}, {"id": "YN83A", "text": "+10 J", "image": null, "isCorrect": false}, {"id": "4dibz", "text": "-10 J", "image": null, "isCorrect": false}, {"id": "gOfqp", "text": "$\\quad-100 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is $\\mathrm{H}_{2(\\mathrm{g})} + \\mathrm{Cl}_{2(\\mathrm{g})} \\longrightarrow 2\\mathrm{HCl}_{(\\mathrm{g})}$<br><br>The initial volume of the reactant gases is $V_1 = 100 \\text{ ml} + 100 \\text{ ml} = 200 \\text{ ml}$<br><br>According to Gay-Lussac's law of gaseous volumes, $1$ volume of $\\mathrm{H}_2$ reacts with $1$ volume of $\\mathrm{Cl}_2$ to produce $2$ volumes of $\\mathrm{HCl}$.<br><br>Thus, $100 \\text{ ml}$ of $\\mathrm{H}_2$ and $100 \\text{ ml}$ of $\\mathrm{Cl}_2$ will produce $200 \\text{ ml}$ of $\\mathrm{HCl}$.<br><br>The final volume of the gas is $V_2 = 200 \\text{ ml}$<br><br>The change in volume is $\\Delta V = V_2 - V_1 = 200 \\text{ ml} - 200 \\text{ ml} = 0$<br><br>The PV type of work done is given by $W = -P_{ext} \\Delta V$<br><br>Substituting $\\Delta V = 0$, we get $W = 0 \\text{ J}$<br><br>Answer: Zero J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fc0aee93fa0796dd12", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Two moles of an ideal gas are compressed isothermally and reversibly from 40 L to 20 L at 300 K . What is the work done? $\\left(\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right.$ )", "image": null}, "options": [{"id": "KXsmy", "text": "3.46 kJ", "image": null, "isCorrect": true}, {"id": "0lsEy", "text": "4.16 kJ", "image": null, "isCorrect": false}, {"id": "wORWa", "text": "2.08 kJ", "image": null, "isCorrect": false}, {"id": "VgRup", "text": "6.12 kJ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done in an isothermal reversible process is given by:<br><br>$W = -2.303 n R T \\log_{10} \\left( \\dfrac{V_2}{V_1} \\right)$<br><br>Given:<br>$n = 2$ mol<br>$R = 8.314 \\text{ J K}^{-1} \\text{ mol}^{-1}$<br>$T = 300$ K<br>$V_1 = 40$ L<br>$V_2 = 20$ L<br><br>Substituting the values:<br><br>$W = -2.303 \\times 2 \\times 8.314 \\times 300 \\times \\log_{10} \\left( \\dfrac{20}{40} \\right)$<br><br>$W = -11488.28 \\times \\log_{10} (0.5)$<br><br>$W = -11488.28 \\times (-0.3010)$<br><br>$W = 3457.97 \\text{ J}$<br><br>$W \\approx 3.46 \\text{ kJ}$<br><br>Answer: 3.46 kJ", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f80aee93fa0796dcf7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Identify the process from following such that volume of system remains constant.", "image": null}, "options": [{"id": "qBelT", "text": "adiabatic process", "image": null, "isCorrect": false}, {"id": "u5DfG", "text": "isochoric process", "image": null, "isCorrect": true}, {"id": "AEOBp", "text": "isothermal process", "image": null, "isCorrect": false}, {"id": "RiWmF", "text": "isobaric process", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In an isochoric process, the volume of the system remains constant throughout the process, meaning $\\Delta V = 0$.<br><br>In an adiabatic process, there is no heat exchange with the surroundings ($Q = 0$).<br><br>In an isothermal process, the temperature remains constant ($\\Delta T = 0$).<br><br>In an isobaric process, the pressure remains constant ($\\Delta P = 0$).<br><br>Answer: isochoric process", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e70aee93fa0796dc6f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "An ideal gas expands against constant external pressure of 2 bar from 5 lit to 8 lit and absorbs 10 kJ of heat. What is $\\Delta \\mathrm{U}$ of the system?", "image": null}, "options": [{"id": "nTTU7", "text": "10600 J", "image": null, "isCorrect": false}, {"id": "oJJ9N", "text": "9400 J", "image": null, "isCorrect": true}, {"id": "M4yIF", "text": "-10600 J", "image": null, "isCorrect": false}, {"id": "FC1an", "text": "-9400 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Work done during expansion against a constant external pressure is given by:<br><br>$W = -P_{ext} \\Delta V$<br><br>$W = -2 \\text{ bar} \\times (8 \\text{ L} - 5 \\text{ L})$<br><br>$W = -2 \\times 3 = -6 \\text{ L bar}$<br><br>Converting to Joules ($1 \\text{ L bar} = 100 \\text{ J}$):<br><br>$W = -6 \\times 100 \\text{ J} = -600 \\text{ J}$<br><br>Heat absorbed by the system, $q = 10 \\text{ kJ} = 10000 \\text{ J}$<br><br>According to the first law of thermodynamics:<br><br>$\\Delta U = q + W$<br><br>$\\Delta U = 10000 \\text{ J} + (-600 \\text{ J})$<br><br>$\\Delta U = 9400 \\text{ J}$<br><br>Answer: 9400 J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e60aee93fa0796dc68", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "2 moles of an ideal gas expands isothermally from $5 \\mathrm{dm}^3$ to $10 \\mathrm{dm}^3$ at a constant external pressure of 1.5 bar. Calculate work done.", "image": null}, "options": [{"id": "SOs9q", "text": "$7.5 \\mathrm{dm}^3$ bar", "image": null, "isCorrect": false}, {"id": "bih9n", "text": "$-7.5 \\mathrm{dm}^3$ bar", "image": null, "isCorrect": true}, {"id": "vz1JX", "text": "$22.5 \\mathrm{dm}^3$ bar", "image": null, "isCorrect": false}, {"id": "USGZj", "text": "$-22.5 \\mathrm{dm}^3$ bar", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done during an isothermal expansion against a constant external pressure is given by the formula:<br><br>$W = -P_{\\text{ext}} \\Delta V$<br><br>$W = -P_{\\text{ext}} (V_2 - V_1)$<br><br>Given:<br>$P_{\\text{ext}} = 1.5 \\text{ bar}$<br>$V_1 = 5 \\text{ dm}^3$<br>$V_2 = 10 \\text{ dm}^3$<br><br>Substituting the values:<br><br>$W = -1.5 \\times (10 - 5)$<br><br>$W = -1.5 \\times 5$<br><br>$W = -7.5 \\text{ dm}^3 \\text{ bar}$<br><br>Answer: $-7.5 \\mathrm{dm}^3$ bar", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d70aee93fa0796dbee", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "A gas expands isothermally against a constant external pressure of 1 bar from $10 \\mathrm{dm}^3$ to $20 \\mathrm{dm}^3$ by absorbing 800 J of heat from surrounding. Calculate value of $\\Delta \\mathrm{U}$.", "image": null}, "options": [{"id": "l6Kd5", "text": "100 J", "image": null, "isCorrect": false}, {"id": "1adxw", "text": "$-200 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "CVVxt", "text": "200 J", "image": null, "isCorrect": false}, {"id": "bKFRT", "text": "-300 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Work done during the expansion against a constant external pressure is given by $W = -P_{\\text{ext}} \\Delta V$.<br><br>Substituting the given values:<br><br>$W = -1 \\text{ bar} \\times (20 - 10) \\text{ dm}^3 = -10 \\text{ bar dm}^3$<br><br>Since $1 \\text{ bar dm}^3 = 100 \\text{ J}$, we get $W = -1000 \\text{ J}$.<br><br>The heat absorbed by the gas from the surroundings is $q = 800 \\text{ J}$.<br><br>According to the first law of thermodynamics:<br><br>$\\Delta U = q + W$<br><br>$\\Delta U = 800 \\text{ J} - 1000 \\text{ J} = -200 \\text{ J}$<br><br>Answer: $-200 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c40aee93fa0796db5a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "2 moles of an ideal gas are expanded isothermally and reversibly from 20 L to 40 L at 300 K . Calculate work done.\r\n( $\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}$ )", "image": null}, "options": [{"id": "4hjUe", "text": "$-5.713 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "eheog", "text": "-11.526 J", "image": null, "isCorrect": false}, {"id": "a5aBN", "text": "$-16.939 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "Qyh3a", "text": "$-3457 \\cdot 97 \\mathrm{~J}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For an isothermal reversible expansion of an ideal gas, the work done is given by the formula:<br><br>$W = -2.303 nRT \\log \\left( \\dfrac{V_2}{V_1} \\right)$<br><br>Given values are:<br>$n = 2 \\text{ moles}$<br>$R = 8.314 \\text{ J K}^{-1} \\text{ mol}^{-1}$<br>$T = 300 \\text{ K}$<br>$V_1 = 20 \\text{ L}$<br>$V_2 = 40 \\text{ L}$<br><br>Substituting these values into the formula:<br><br>$W = -2.303 \\times 2 \\times 8.314 \\times 300 \\times \\log \\left( \\dfrac{40}{20} \\right)$<br><br>$W = -2.303 \\times 2 \\times 8.314 \\times 300 \\times \\log 2$<br><br>Using $\\log 2 = 0.3010$:<br><br>$W = -2.303 \\times 2 \\times 8.314 \\times 300 \\times 0.3010$<br><br>$W = -3457.97 \\text{ J}$<br><br>Answer: $-3457 \\cdot 97 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c30aee93fa0796db50", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Which from following statements is true about internal energy?", "image": null}, "options": [{"id": "t2TZp", "text": "It increases with increase in temperature.", "image": null, "isCorrect": true}, {"id": "6fghd", "text": "It decreases with increase in temperature.", "image": null, "isCorrect": false}, {"id": "RylaZ", "text": "Remain constant on changing temperature.", "image": null, "isCorrect": false}, {"id": "Mr9cw", "text": "It is not a state function.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Internal energy is the sum of the kinetic and potential energies of all the particles in a system.<br><br>The kinetic energy of the particles is directly proportional to the absolute temperature of the system. Therefore, as the temperature increases, the kinetic energy of the molecules increases, which in turn increases the internal energy of the system.<br><br>Also, internal energy is a state function because its value depends only on the current state of the system and not on the path taken to reach that state.<br><br>Answer: It increases with increase in temperature.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ac0aee93fa0796daa3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "10 g each of $\\text{NH}_3$, $\\text{N}_2$, $\\text{Cl}_2$ and $\\text{H}_2\\text{S}$ are expanded isothermally and reversibly at same temperature by the same volume ratio. Identify gas that performs maximum work.", "image": null}, "options": [{"id": "yYDPP", "text": "$\\mathrm{N}_2$", "image": null, "isCorrect": false}, {"id": "PoYvH", "text": "$\\mathrm{Cl}_2$", "image": null, "isCorrect": false}, {"id": "FVmVC", "text": "$\\mathrm{H}_2 \\mathrm{S}$", "image": null, "isCorrect": false}, {"id": "7o8un", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Work done in an isothermal reversible expansion is given by $W = -nRT \\ln\\left(\\dfrac{V_2}{V_1}\\right)$.<br><br>The magnitude of work done is $|W| = nRT \\ln\\left(\\dfrac{V_2}{V_1}\\right)$.<br><br>Since the mass $m$, temperature $T$, and volume ratio $\\dfrac{V_2}{V_1}$ are the same for all gases, the magnitude of work done is directly proportional to the number of moles $n$.<br><br>Number of moles $n = \\dfrac{m}{M}$, where $M$ is the molar mass.<br><br>Thus, the gas with the minimum molar mass will have the maximum number of moles and will perform the maximum work.<br><br>Molar masses of the given gases are:<br>$M(\\text{NH}_3) = 17 \\text{ g/mol}$<br>$M(\\text{N}_2) = 28 \\text{ g/mol}$<br>$M(\\text{H}_2\\text{S}) = 34 \\text{ g/mol}$<br>$M(\\text{Cl}_2) = 71 \\text{ g/mol}$<br><br>Since $\\text{NH}_3$ has the minimum molar mass, it has the maximum number of moles for the given $10 \\text{ g}$ mass.<br><br>Therefore, $\\text{NH}_3$ performs the maximum work.<br><br>Answer: $\\mathrm{NH}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139e0aee93fa0796da33", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Two moles of an ideal gas is expanded isothermally from a volume of $300 \\mathrm{~cm}^3$ to 2.5 $\\mathrm{dm}^3$ at 298 K against a constant pressure at 1.9 bar. Calculate the work done in joules.", "image": null}, "options": [{"id": "fziqW", "text": "-418 J .", "image": null, "isCorrect": true}, {"id": "HvV2I", "text": "$-565 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "S6VMy", "text": "-918 J", "image": null, "isCorrect": false}, {"id": "aLfYe", "text": "$-950 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done during an irreversible isothermal expansion against a constant external pressure is given by $W = -P_{\\text{ext}} \\Delta V$.<br><br>Given:<br>$P_{\\text{ext}} = 1.9 \\text{ bar}$<br>$V_1 = 300 \\text{ cm}^3 = 0.3 \\text{ dm}^3 = 0.3 \\text{ L}$<br>$V_2 = 2.5 \\text{ dm}^3 = 2.5 \\text{ L}$<br><br>Change in volume, $\\Delta V = V_2 - V_1 = 2.5 - 0.3 = 2.2 \\text{ L}$<br><br>Substituting the values into the work formula:<br>$W = -1.9 \\text{ bar} \\times 2.2 \\text{ L} = -4.18 \\text{ L} \\cdot \\text{bar}$<br><br>Since $1 \\text{ L} \\cdot \\text{bar} = 100 \\text{ J}$, we get:<br>$W = -4.18 \\times 100 \\text{ J} = -418 \\text{ J}$<br><br>Answer: -418 J .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139a0aee93fa0796da16", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "What is change in internal energy of the system when work done by the system is 150 J and system release 300 J of heat?", "image": null}, "options": [{"id": "zhb2m", "text": "+450 J", "image": null, "isCorrect": false}, {"id": "Do86Q", "text": "-450 J", "image": null, "isCorrect": true}, {"id": "AYUYS", "text": "+300 J", "image": null, "isCorrect": false}, {"id": "1YAuM", "text": "-150 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics, the change in internal energy ($\\Delta U$) is given by:<br><br>$\\Delta U = q + w$<br><br>Since heat is released by the system, $q = -300$ J.<br><br>Since work is done by the system, $w = -150$ J.<br><br>Substituting the values:<br><br>$\\Delta U = -300 - 150 = -450$ J.<br><br>Answer: -450 J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213880aee93fa0796d982", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Which from the following defines enthalpy of a system?", "image": null}, "options": [{"id": "tOgnD", "text": "Ratio of pressure to volume", "image": null, "isCorrect": false}, {"id": "ZYnrP", "text": "Product of pressure and volume", "image": null, "isCorrect": false}, {"id": "P1DYt", "text": "Internal energy (U) + PV", "image": null, "isCorrect": true}, {"id": "bzq3D", "text": "Internal energy (U) - PV", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Enthalpy ($H$) of a thermodynamic system is defined as the sum of its internal energy ($U$) and the product of its pressure ($P$) and volume ($V$).<br><br>$H = U + PV$<br><br>Answer: Internal energy (U) + PV", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213870aee93fa0796d97b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "One mole of a gas occupying 3 L volume is expanded against a constant external pressure of 1 bar to a volume of 15 L. Calculate the work ($W$) involved in the process.", "image": null}, "options": [{"id": "9Ejpg", "text": "$1.200 \\times 10^3 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "g2gg8", "text": "$-2.43 \\times 10^3 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "ybAxV", "text": "$-1.200 \\times 10^3 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "ITBoR", "text": "$2.43 \\times 10^3 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done during expansion against a constant external pressure is given by the formula:<br><br>$W = -P_{\\text{ext}} \\Delta V$<br><br>Given values are:<br><br>$P_{\\text{ext}} = 1 \\text{ bar}$<br><br>$V_1 = 3 \\text{ L}$<br><br>$V_2 = 15 \\text{ L}$<br><br>Change in volume, $\\Delta V = V_2 - V_1 = 15 - 3 = 12 \\text{ L}$<br><br>Substituting the values into the formula:<br><br>$W = -1 \\times 12 = -12 \\text{ L bar}$<br><br>Using the conversion factor $1 \\text{ L bar} = 100 \\text{ J}$:<br><br>$W = -12 \\times 100 \\text{ J} = -1200 \\text{ J} = -1.200 \\times 10^3 \\text{ J}$<br><br>Answer: $-1.200 \\times 10^3 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213780aee93fa0796d906", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which of the following set of properties is correct when one mole of a gas is heated keeping volume constant by increasing temperature and supplying 500 J of heat?", "image": null}, "options": [{"id": "nULhd", "text": "$\\mathrm{q}=\\mathrm{w}=500 \\mathrm{~J}, \\Delta \\mathrm{U}=0$", "image": null, "isCorrect": false}, {"id": "3cno8", "text": "$\\mathrm{q}=\\Delta \\mathrm{U}=500 \\mathrm{~J}, \\mathrm{w}=0$", "image": null, "isCorrect": true}, {"id": "iFhfu", "text": "$\\mathrm{q}=\\Delta \\mathrm{U}=-500 \\mathrm{~J}, \\mathrm{w}=0$", "image": null, "isCorrect": false}, {"id": "2tnPK", "text": "$\\mathrm{q}=500 \\mathrm{~J}, \\Delta \\mathrm{U}=\\mathrm{w}=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a process at constant volume, the change in volume $\\Delta V = 0$.<br><br>The work done by or on the gas is given by $w = -P\\Delta V = 0$.<br><br>Heat is supplied to the gas, so $q = +500 \\text{ J}$.<br><br>According to the first law of thermodynamics, $\\Delta U = q + w$.<br><br>Substituting the values, $\\Delta U = 500 + 0 = 500 \\text{ J}$.<br><br>Thus, $q = \\Delta U = 500 \\text{ J}$ and $w = 0$.<br><br>Answer: $\\mathrm{q}=\\Delta \\mathrm{U}=500 \\mathrm{~J}, \\mathrm{w}=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213770aee93fa0796d8fd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which of the following symbols represent heat of reaction at constant volume?", "image": null}, "options": [{"id": "VNmou", "text": "$\\Delta \\mathrm{H}$", "image": null, "isCorrect": false}, {"id": "dxQ9g", "text": "dq", "image": null, "isCorrect": false}, {"id": "LSEZB", "text": "$\\Delta \\mathrm{S}$", "image": null, "isCorrect": false}, {"id": "5whkH", "text": "$\\Delta \\mathrm{U}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "From the first law of thermodynamics, the heat supplied to a system is given by $q = \\Delta U + W$.<br><br>At constant volume, the work done by the system is $W = P\\Delta V = 0$.<br><br>Substituting this into the first law equation, we get $q_v = \\Delta U$.<br><br>Thus, the heat of reaction at constant volume is equal to the change in internal energy, which is represented by the symbol $\\Delta U$.<br><br>Answer: $\\Delta \\mathrm{U}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213640aee93fa0796d86a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Which of the following statements is appropriate as per first law of thermodynamics?", "image": null}, "options": [{"id": "mDxTv", "text": "Energy of the system remains constant.", "image": null, "isCorrect": false}, {"id": "nLSDK", "text": "Energy of the surrounding remains constant.", "image": null, "isCorrect": false}, {"id": "HHn7R", "text": "Entropy of the universe remains constant.", "image": null, "isCorrect": false}, {"id": "vgjWo", "text": "Energy of the universe remains constant.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics, energy can neither be created nor destroyed; it can only be transformed from one form to another.<br><br>The universe is considered an isolated system, meaning no energy can enter or leave it. Therefore, the total energy of the universe (system + surroundings) always remains constant.<br><br>Answer: Energy of the universe remains constant.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133b0aee93fa0796d72c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "If 1 L gas is enclosed in a cylinder, absorbs 302.6 J of heat and expands to 2 L against constant external pressure of 2 atm. Calculate internal energy change of the gas.", "image": null}, "options": [{"id": "FrTtd", "text": "200 J", "image": null, "isCorrect": false}, {"id": "Z7PV0", "text": "300 J", "image": null, "isCorrect": false}, {"id": "mUn2k", "text": "400 J", "image": null, "isCorrect": false}, {"id": "VgpbL", "text": "100 J", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given, initial volume $V_1 = 1$ L and final volume $V_2 = 2$ L.<br><br>External pressure $P_{ext} = 2$ atm.<br><br>Work done during expansion against constant external pressure is given by:<br><br>$w = -P_{ext} \\Delta V$<br><br>$w = -2 \\times (2 - 1) = -2$ L atm<br><br>Converting to Joules ($1$ L atm $= 101.3$ J):<br><br>$w = -2 \\times 101.3 = -202.6$ J<br><br>Heat absorbed by the gas, $q = 302.6$ J.<br><br>According to the first law of thermodynamics:<br><br>$\\Delta U = q + w$<br><br>$\\Delta U = 302.6 - 202.6 = 100$ J<br><br>Answer: 100 J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792132c0aee93fa0796d6b2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "A gas absorbs a certain amount of heat and expands by $200 \\mathrm{~cm}^3$ against a constant external pressure of $2 \\times 10^5 \\mathrm{Nm}^{-2}$. What is work done by system?", "image": null}, "options": [{"id": "WvbwC", "text": "$-400$ J", "image": null, "isCorrect": false}, {"id": "gIlrj", "text": "$-40$ J", "image": null, "isCorrect": true}, {"id": "n2tdn", "text": "$-4$ J", "image": null, "isCorrect": false}, {"id": "M50tS", "text": "$-253 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The work done by the system during expansion against a constant external pressure is given by $W = -P_{\\text{ext}} \\Delta V$.<br><br>Given:<br>$P_{\\text{ext}} = 2 \\times 10^5 \\text{ N m}^{-2}$<br>$\\Delta V = 200 \\text{ cm}^3 = 200 \\times 10^{-6} \\text{ m}^3 = 2 \\times 10^{-4} \\text{ m}^3$<br><br>Substituting the values:<br>$W = -(2 \\times 10^5) \\times (2 \\times 10^{-4})$<br>$W = -40 \\text{ J}$<br><br>Answer: $-40$ J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213290aee93fa0796d69c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "In a process 605 J heat is absorbed by the system and 380 J work is done by the system on surrounding. What is the value of $\\Delta \\mathrm{U}$ ?", "image": null}, "options": [{"id"
