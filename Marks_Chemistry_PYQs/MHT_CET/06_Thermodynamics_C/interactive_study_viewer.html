 false}], "correctValue": null, "solution": {"text": "The molar mass of carbon is $12 \\text{ g mol}^{-1}$.<br><br>Number of moles of carbon in $12 \\text{ g}$ is given by:<br><br>$n = \\dfrac{12 \\text{ g}}{12 \\text{ g mol}^{-1}} = 1 \\text{ mol}$<br><br>The standard enthalpy of formation of methane is the enthalpy change when $1 \\text{ mole}$ of methane is formed from its constituent elements in their standard states:<br><br>$\\text{C(s)} + 2\\text{H}_2\\text{(g)} \\rightarrow \\text{CH}_4\\text{(g)}$<br><br>The enthalpy of formation of methane is given as $-75 \\text{ kJ mol}^{-1}$.<br><br>Since $1 \\text{ mole}$ of carbon reacts to form $1 \\text{ mole}$ of methane, the enthalpy change for the reaction of $12 \\text{ g}$ of carbon is:<br><br>$\\Delta H = 1 \\text{ mol} \\times (-75 \\text{ kJ mol}^{-1}) = -75 \\text{ kJ}$<br><br>Answer: -75 kJ", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d60aee93fa0796dbe7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "For an ideal gas, the heat of reaction at constant pressure and heat of reaction at constant volume are related by equation", "image": null}, "options": [{"id": "FYclj", "text": "$\\dot{H}+U=P V$", "image": null, "isCorrect": false}, {"id": "bdeNO", "text": "$\\mathrm{U}=\\mathrm{H}+\\mathrm{P} \\Delta \\mathrm{V}$", "image": null, "isCorrect": false}, {"id": "ty5r8", "text": "$\\Delta \\mathrm{U}=\\Delta \\mathrm{H}+\\dfrac{\\Delta \\mathrm{n}}{\\mathrm{RT}}$", "image": null, "isCorrect": false}, {"id": "1LOd6", "text": "$\\Delta \\mathrm{H}=\\Delta \\mathrm{U}+\\Delta \\mathrm{nRT}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The heat of reaction at constant pressure is equal to the change in enthalpy, $\\Delta H$.<br><br>The heat of reaction at constant volume is equal to the change in internal energy, $\\Delta U$.<br><br>By definition, enthalpy is given by $H = U + PV$.<br><br>For a chemical reaction at constant temperature and pressure, the change in enthalpy is:<br><br>$\\Delta H = \\Delta U + \\Delta(PV)$<br><br>For an ideal gas, the ideal gas equation is $PV = nRT$. Since $R$ and $T$ are constant, the change in $PV$ is due to the change in the number of moles of gas, $\\Delta n$.<br><br>$\\Delta(PV) = \\Delta nRT$<br><br>Substituting this into the enthalpy equation, we get:<br><br>$\\Delta H = \\Delta U + \\Delta nRT$<br><br>Answer: $\\Delta \\mathrm{H}=\\Delta \\mathrm{U}+\\Delta \\mathrm{nRT}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b20aee93fa0796dacd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "For the reaction,\r\n$2 \\mathrm{H}_{2(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}, \\Delta \\mathrm{H}^{\\circ}=-573.2 \\mathrm{~kJ}$\r\nWhat is heat of decomposition of water per mol?", "image": null}, "options": [{"id": "SOSJ1", "text": "-28.66 kJ", "image": null, "isCorrect": false}, {"id": "bhrrN", "text": "143.3 kJ", "image": null, "isCorrect": false}, {"id": "wnZZl", "text": "286.6 kJ", "image": null, "isCorrect": true}, {"id": "60PuA", "text": "573.2 kJ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is:<br><br>$2 \\mathrm{H}_{2(\\mathrm{g})} + \\mathrm{O}_{2(\\mathrm{g})} \\longrightarrow 2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}, \\Delta \\mathrm{H}^{\\circ} = -573.2 \\mathrm{~kJ}$<br><br>The decomposition reaction of water is the reverse of the given reaction:<br><br>$2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})} \\longrightarrow 2 \\mathrm{H}_{2(\\mathrm{g})} + \\mathrm{O}_{2(\\mathrm{g})}, \\Delta \\mathrm{H}^{\\circ} = +573.2 \\mathrm{~kJ}$<br><br>This is the enthalpy change for the decomposition of $2$ moles of water.<br><br>The heat of decomposition of water per mole is:<br><br>$\\Delta \\mathrm{H} = \\dfrac{+573.2}{2} = 286.6 \\mathrm{~kJ}$<br><br>Answer: 286.6 kJ", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b00aee93fa0796dac3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Identify the factor from following on which heat of reaction does not depend.", "image": null}, "options": [{"id": "gVOn8", "text": "Physical states of reactants and products.", "image": null, "isCorrect": false}, {"id": "eHD3I", "text": "Total number of steps in which reaction occurs.", "image": null, "isCorrect": true}, {"id": "Uf4Yz", "text": "Temperature of the reaction.", "image": null, "isCorrect": false}, {"id": "AUUsR", "text": "Whether the reaction is carried out at constant pressure or constant volume.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Hess's law of constant heat summation, the total enthalpy change or heat of reaction for a chemical reaction is the same regardless of whether the reaction takes place in a single step or in multiple steps.<br><br>The heat of reaction depends on the physical states of reactants and products, the temperature of the reaction (Kirchhoff's equation), and whether the reaction is carried out at constant pressure or constant volume ($\\Delta H$ vs $\\Delta U$).<br><br>Therefore, the heat of reaction does not depend on the total number of steps in which the reaction occurs.<br><br>Answer: Total number of steps in which reaction occurs.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213990aee93fa0796da08", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "For the reaction,\n$\\mathrm{C}_3 \\mathrm{H}_{8(\\mathrm{~g})}+5 \\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow 3 \\mathrm{CO}_{2(\\mathrm{~g})}+4 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{i})}$\nat constant temperature, $\\Delta \\mathrm{H}-\\Delta \\mathrm{U}$ is", "image": null}, "options": [{"id": "CYoeD", "text": "$\\quad-2 \\mathrm{RT}$", "image": null, "isCorrect": false}, {"id": "ivhFl", "text": "RT", "image": null, "isCorrect": false}, {"id": "fYIXa", "text": "$\\quad-3 R T$", "image": null, "isCorrect": true}, {"id": "guoYz", "text": "3 RT", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is $\\mathrm{C}_3\\mathrm{H}_{8(\\mathrm{g})} + 5\\mathrm{O}_{2(\\mathrm{g})} \\longrightarrow 3\\mathrm{CO}_{2(\\mathrm{g})} + 4\\mathrm{H}_2\\mathrm{O}_{(\\mathrm{l})}$<br><br>The relationship between enthalpy change ($\\Delta H$) and internal energy change ($\\Delta U$) is given by:<br><br>$\\Delta H = \\Delta U + \\Delta n_g RT$<br><br>where $\\Delta n_g$ is the change in the number of moles of gaseous species.<br><br>$\\Delta n_g = \\sum n_{\\text{gaseous products}} - \\sum n_{\\text{gaseous reactants}}$<br><br>For the given reaction:<br><br>$\\Delta n_g = 3 - (1 + 5) = 3 - 6 = -3$<br><br>Substituting $\\Delta n_g$ in the equation:<br><br>$\\Delta H = \\Delta U - 3RT$<br><br>$\\Delta H - \\Delta U = -3RT$<br><br>Answer: $\\quad-3 R T$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213860aee93fa0796d974", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Calculate heat required to convert 9 g of liquid water to water vapours from following equations.<br><br>$H_{2(g)} + \\dfrac{1}{2}O_{2(g)} \\rightarrow H_2O_{(g)}$ $\\Delta H = -57$ kCal<br>$H_{2(g)} + \\dfrac{1}{2}O_{2(g)} \\rightarrow H_2O_{(l)}$ $\\Delta H = -68.3$ kCal", "image": null}, "options": [{"id": "mJH8A", "text": "5.65 k Cal", "image": null, "isCorrect": true}, {"id": "e1moq", "text": "6.28 k Cal", "image": null, "isCorrect": false}, {"id": "Wx7vw", "text": "$7.05 \\mathrm{k} \\mathrm{Cal}$", "image": null, "isCorrect": false}, {"id": "6l3v5", "text": "9.72 k Cal", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equations:<br><br>$H_{2(g)} + \\dfrac{1}{2}O_{2(g)} \\rightarrow H_2O_{(g)}$, $\\Delta H_1 = -57$ kCal<br><br>$H_{2(g)} + \\dfrac{1}{2}O_{2(g)} \\rightarrow H_2O_{(l)}$, $\\Delta H_2 = -68.3$ kCal<br><br>Subtracting the second equation from the first equation, we get the equation for the vaporization of water:<br><br>$H_2O_{(l)} \\rightarrow H_2O_{(g)}$<br><br>$\\Delta H_{vap} = \\Delta H_1 - \\Delta H_2 = -57 - (-68.3) = 11.3$ kCal/mol<br><br>This is the heat required to vaporize $1$ mole ($18$ g) of water.<br><br>Number of moles in $9$ g of water = $\\dfrac{9}{18} = 0.5$ mol<br><br>Heat required for $9$ g of water = $0.5 \\times 11.3 = 5.65$ kCal<br><br>Answer: 5.65 k Cal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213650aee93fa0796d874", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Given that\r\n$\\mathrm{C}_{(\\mathrm{g})}+4 \\mathrm{H}_{(\\mathrm{g})} \\longrightarrow \\mathrm{CH}_{4(\\mathrm{~g})} \\Delta \\mathrm{H}^{\\circ}=-1665 \\mathrm{~kJ}$\r\nWhat is bond energy per mole of $\\mathrm{C}-\\mathrm{H}$ bond ?", "image": null}, "options": [{"id": "MZmPk", "text": "$416 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "AEUs8", "text": "$\\quad-416 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "DiqqV", "text": "$832.5 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "oZSeh", "text": "$\\quad-832.5 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction represents the formation of $\\mathrm{CH}_{4}$ from its constituent gaseous atoms:<br><br>$\\mathrm{C}_{(\\mathrm{g})} + 4 \\mathrm{H}_{(\\mathrm{g})} \\longrightarrow \\mathrm{CH}_{4(\\mathrm{g})} \\quad \\Delta \\mathrm{H}^{\\circ} = -1665 \\mathrm{~kJ}$<br><br>The bond dissociation energy is the energy required to break the bonds, which corresponds to the reverse reaction:<br><br>$\\mathrm{CH}_{4(\\mathrm{g})} \\longrightarrow \\mathrm{C}_{(\\mathrm{g})} + 4 \\mathrm{H}_{(\\mathrm{g})} \\quad \\Delta \\mathrm{H}^{\\circ} = +1665 \\mathrm{~kJ}$<br><br>Since one molecule of methane contains four $\\mathrm{C}-\\mathrm{H}$ bonds, the energy required to break four moles of $\\mathrm{C}-\\mathrm{H}$ bonds is $1665 \\mathrm{~kJ}$.<br><br>Bond energy per mole of $\\mathrm{C}-\\mathrm{H}$ bond $= \\dfrac{1665}{4} = 416.25 \\mathrm{~kJ} \\mathrm{~mol}^{-1} \\approx 416 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$<br><br>Bond energy is always a positive quantity.<br><br>Answer: $416 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135f0aee93fa0796d849", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Find value of Q from following equations.\n(i) $\\mathrm{C}_{(\\mathrm{s})}+\\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{CO}_{2(\\mathrm{~g})} \\Delta \\mathrm{H}=\\mathrm{QkJ}$\n(ii) $\\mathrm{C}_{(\\mathrm{s})}+\\dfrac{1}{2} \\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{CO}_{(\\mathrm{g})} \\quad \\Delta \\mathrm{H}=-\\mathrm{x}$\n(iii) $\\mathrm{CO}_{(\\mathrm{g})}+\\dfrac{1}{2} \\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{CO}_{2(\\mathrm{~g})} \\quad \\Delta \\mathrm{H}=-\\mathrm{y}$", "image": null}, "options": [{"id": "VRcHr", "text": "$-(x+y) k J$", "image": null, "isCorrect": true}, {"id": "dgtqL", "text": "$\\quad(x-y) k J$", "image": null, "isCorrect": false}, {"id": "meRXY", "text": "$\\dfrac{-\\mathrm{x}+\\mathrm{y}}{2} \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "qcqTU", "text": "$\\dfrac{\\mathrm{x}+\\mathrm{y}}{2} \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Hess's law of constant heat summation, the enthalpy change of a reaction is the same whether it occurs in one step or multiple steps.<br><br>Adding equation (ii) and equation (iii):<br><br>$\\mathrm{C}_{(\\mathrm{s})} + \\dfrac{1}{2} \\mathrm{O}_{2(\\mathrm{g})} \\longrightarrow \\mathrm{CO}_{(\\mathrm{g})} \\quad \\Delta \\mathrm{H} = -\\mathrm{x}$<br><br>$\\mathrm{CO}_{(\\mathrm{g})} + \\dfrac{1}{2} \\mathrm{O}_{2(\\mathrm{g})} \\longrightarrow \\mathrm{CO}_{2(\\mathrm{g})} \\quad \\Delta \\mathrm{H} = -\\mathrm{y}$<br><br>The sum of the two equations gives equation (i):<br><br>$\\mathrm{C}_{(\\mathrm{s})} + \\mathrm{O}_{2(\\mathrm{g})} \\longrightarrow \\mathrm{CO}_{2(\\mathrm{g})}$<br><br>The enthalpy change for this overall reaction is the sum of the individual enthalpy changes:<br><br>$\\Delta \\mathrm{H} = -\\mathrm{x} + (-\\mathrm{y}) = -(\\mathrm{x}+\\mathrm{y}) \\mathrm{kJ}$<br><br>Comparing this with equation (i), we get:<br><br>$\\mathrm{Q} = -(\\mathrm{x}+\\mathrm{y})$<br><br>Answer: $-(x+y) k J$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134e0aee93fa0796d7bf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "What is the value of standard enthalpy of formation of dihydrogen?", "image": null}, "options": [{"id": "7fyDb", "text": "436.4 kJ", "image": null, "isCorrect": false}, {"id": "i7Vir", "text": "$0 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "OWQWj", "text": "100.3 kJ", "image": null, "isCorrect": false}, {"id": "3tk6b", "text": "$200.5 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard enthalpy of formation of an element in its standard reference state is taken as zero by convention.<br><br>Since dihydrogen ($H_2$) in the gaseous state is the standard reference state for hydrogen, its standard enthalpy of formation is $0 \\text{ kJ}$.<br><br>Answer: $0 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134d0aee93fa0796d7ba", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "If bond formation energy of $\\mathrm{H}-\\mathrm{H}$ bond is $-433 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$ find the bond dissociation energy for 0.5 mole $\\mathrm{H}_{2(\\mathrm{~g})}$.", "image": null}, "options": [{"id": "YimCa", "text": "108.0 kJ", "image": null, "isCorrect": false}, {"id": "1ctBg", "text": "216.5 kJ", "image": null, "isCorrect": true}, {"id": "55Ljy", "text": "433.0 kJ", "image": null, "isCorrect": false}, {"id": "pT19C", "text": "324.5 kJ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Bond formation energy of $\\mathrm{H}-\\mathrm{H}$ bond $= -433 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$<br><br>Bond dissociation energy is the energy required to break one mole of bonds, which is equal in magnitude but opposite in sign to the bond formation energy.<br><br>Bond dissociation energy for $1$ mole of $\\mathrm{H}_{2(\\mathrm{g})} = +433 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$<br><br>For $0.5$ mole of $\\mathrm{H}_{2(\\mathrm{g})}$, the bond dissociation energy is $0.5 \\times 433 = 216.5 \\mathrm{~kJ}$<br><br>Answer: 216.5 kJ", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133d0aee93fa0796d73a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Calculate enthalpy change for following reaction.\r\n$\\mathrm{H}_2 \\mathrm{C}=\\mathrm{CH}_{2(\\mathrm{~g})}+\\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{H}_3 \\mathrm{C}-\\mathrm{CH}_{3(\\mathrm{~g})}$\r\n[The bond energy of $\\mathrm{C}-\\mathrm{H}, \\mathrm{C}-\\mathrm{C}, \\mathrm{C}=\\mathrm{C}$ and $\\mathrm{H}-\\mathrm{H}$ is $414,347,615$ and 435 kJ respectively]", "image": null}, "options": [{"id": "clnws", "text": "125 kJ", "image": null, "isCorrect": false}, {"id": "1hJiB", "text": "-125 kJ", "image": null, "isCorrect": true}, {"id": "LZ6I4", "text": "250 kJ", "image": null, "isCorrect": false}, {"id": "fsk6y", "text": "$\\quad-250 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The enthalpy change of the reaction can be calculated using the bond energies of the reactants and products.<br><br>$\\Delta H = \\sum \\text{Bond energies of reactants} - \\sum \\text{Bond energies of products}$<br><br>In the given reaction, the bonds broken are one $\\mathrm{C}=\\mathrm{C}$ bond and one $\\mathrm{H}-\\mathrm{H}$ bond. The bonds formed are one $\\mathrm{C}-\\mathrm{C}$ bond and two $\\mathrm{C}-\\mathrm{H}$ bonds (since four $\\mathrm{C}-\\mathrm{H}$ bonds are present in the reactant ethene and six in the product ethane, the net change is the formation of two $\\mathrm{C}-\\mathrm{H}$ bonds).<br><br>$\\Delta H = [\\text{BE}(\\mathrm{C}=\\mathrm{C}) + \\text{BE}(\\mathrm{H}-\\mathrm{H})] - [\\text{BE}(\\mathrm{C}-\\mathrm{C}) + 2 \\times \\text{BE}(\\mathrm{C}-\\mathrm{H})]$<br><br>Substituting the given values:<br><br>$\\Delta H = [615 + 435] - [347 + 2 \\times 414]$<br><br>$\\Delta H = 1050 - [347 + 828]$<br><br>$\\Delta H = 1050 - 1175$<br><br>$\\Delta H = -125 \\text{ kJ}$<br><br>Answer: -125 kJ", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133c0aee93fa0796d734", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Which of the following is true for the value of $\\Delta H - \\Delta U$ for an isothermal process of an ideal gas?", "image": null}, "options": [{"id": "u6kKc", "text": "R", "image": null, "isCorrect": false}, {"id": "aS4pJ", "text": "$\\dfrac{3}{2} R$", "image": null, "isCorrect": false}, {"id": "a0E4z", "text": "Zero", "image": null, "isCorrect": true}, {"id": "FOG11", "text": "$\\dfrac{5}{2} R$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For an ideal gas, enthalpy $H$ and internal energy $U$ are functions of temperature only.<br><br>The relationship between enthalpy and internal energy is given by $H = U + PV$.<br><br>For an ideal gas, $PV = nRT$, so $H = U + nRT$.<br><br>The change in enthalpy is $\\Delta H  "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "The enthalpies of combustion of C(graphite) and C(diamond) are -393.8 and $-395.3 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$ respectively. The enthalpy of conversion of $\\mathrm{C}$ (graphite) to $\\mathrm{C}$ (diamond) is", "image": null}, "options": [{"id": "RxHSK", "text": "$-12.5 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "OzkDi", "text": "$-789.1 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "x1BUs", "text": "$79.0 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "4VETY", "text": "$1.5 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{eq}^{\\mathrm{n}} 1 \\ldots . . \\mathrm{C}(\\text { graphite })+\\mathrm{O}_2(\\mathrm{~g}) \\rightarrow \\mathrm{CO}_2(\\mathrm{~g}) \\quad \\Delta \\mathrm{H}_1=-393.8 \\frac{\\mathrm{KJ}}{\\mathrm{mol}} \\\\ & \\mathrm{eq}^{\\mathrm{n}} 2 \\ldots . . \\mathrm{C}(\\text { diamond })+\\mathrm{O}_2(\\mathrm{~g}) \\rightarrow \\mathrm{CO}_2(\\mathrm{~g}) \\quad \\Delta \\mathrm{H}_2=-395.3 \\frac{\\mathrm{KJ}}{\\mathrm{mol}} \\\\ & \\therefore \\mathrm{eq}^{\\mathrm{n}} 1-\\mathrm{eq}^{\\mathrm{n} 2}=\\Delta \\mathrm{H}_1-\\Delta \\mathrm{H}_2 \\\\ & =-393.8-(-395.3) \\\\ & =1.5 \\frac{\\mathrm{KJ}}{\\mathrm{mol}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatu ernal energy changes by $24 \\mathrm{~kJ}$. Calculate the value of $\\Delta \\mathrm{H}$ at $298 \\mathrm{~K}$ in $\\mathrm{kJ} / \\mathrm{mol}$.\n(Molar mass of sucrose $=342 \\mathrm{~g} \\mathrm{~mol}^{-1}$ )", "image": null}, "options": [{"id": "ShQ5I", "text": "$-140.3 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "ajI1K", "text": "$2014 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "Muael", "text": "$-5612 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "hpPdk", "text": "$8208 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{C}_{12} \\mathrm{H}_{22} \\mathrm{O}_{11}(\\mathrm{~s})+12 \\mathrm{O}_2(\\mathrm{~g}) \\rightarrow 12 \\mathrm{CO}_2(\\mathrm{~g})+11 \\mathrm{H}_2 \\mathrm{O}(\\mathrm{c}) \\\\ & \\Delta \\mathrm{ng}=12-12=0 \\\\ & \\Delta \\mathrm{H}=\\Delta \\mathrm{E}+\\Delta \\mathrm{ngRT} \\\\ & =24 \\mathrm{~kJ} \\\\ & \\Delta \\mathrm{H} \\text { for } 2 \\text { g sucrose }=-\\frac{24}{342} \\times 2 \\\\ & =0.1403 \\mathrm{~kJ} \\\\ & =-140.3 \\mathrm{~J}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261090279619d9d8a294a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "The difference between enthalpy change and internal energy change for the combustion of one mole of ethyl alcohol is", "image": null}, "options": [{"id": "psVDp", "text": "$-\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "SrI5U", "text": "$-1.5 \\mathrm{RT}$", "image": null, "isCorrect": false}, {"id": "3oLw7", "text": "-RT", "image": null, "isCorrect": true}, {"id": "ufCtV", "text": "$-2 \\mathrm{RT}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{OH}(\\ell)+3 \\mathrm{O}_2(\\mathrm{~g}) \\rightarrow 2 \\mathrm{CO}_2(\\mathrm{~g})+3 \\mathrm{H}_2 \\mathrm{O}(\\ell) \\\\ & \\Delta \\mathrm{H}=\\Delta \\mathrm{E}+\\Delta_{\\mathrm{ng}} \\mathrm{RT}\\end{aligned}$\nHere $\\Delta_{\\mathrm{ng}}=2-3=-1$\n$\\therefore \\Delta H=\\Delta E-R T$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260e40279619d9d8a281f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "What is change in internal energy if a system gains $\\mathrm{xJ}$ of heat and yJ work is done on it?", "image": null}, "options": [{"id": "dayfG", "text": "$x-y$", "image": null, "isCorrect": false}, {"id": "sVi53", "text": "$-x+y$", "image": null, "isCorrect": false}, {"id": "6LqQQ", "text": "$-x-y$", "image": null, "isCorrect": false}, {"id": "NpEaX", "text": "$x+y$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\Delta \\mathrm{E} & =\\delta \\mathrm{Q}=\\delta \\mathrm{W} \\\\ & =+\\mathrm{x}+\\mathrm{y}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260860279619d9d8a2531", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "What is enthalpy of formation of $\\mathrm{NH}_3$ if bond enthalpies are as $(\\mathrm{N} \\equiv \\mathrm{N})=941 \\mathrm{~kJ},(\\mathrm{H}-\\mathrm{H})=436 \\mathrm{~kJ},(\\mathrm{~N}-\\mathrm{H})=389 \\mathrm{~kJ}$ ?", "image": null}, "options": [{"id": "GBoiH", "text": "$-84.5 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "GoSea", "text": "$-21.25 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "5nOaL", "text": "$-42.5 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "jIoSD", "text": "$-63.45 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\frac{1}{2} \\mathrm{~N}_{2(\\mathrm{~g})}+\\frac{3}{2} \\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{NH}_{3(\\mathrm{~g})} \\\\ & \\Delta \\mathrm{H}_{\\text {reacion }}=\\Delta \\mathrm{H}_{\\mathrm{f}\\left(\\mathrm{NH}_3\\right)}=\\frac{1}{2} \\mathrm{BE}_{(\\mathrm{NaN})}+\\frac{3}{2} \\mathrm{BE}(\\mathrm{H}-\\mathrm{H})-3 \\mathrm{BE}_{(\\mathrm{N}-\\mathrm{H})} \\\\ & \\Delta \\mathrm{H}_{\\mathrm{f}\\left(\\mathrm{NH}_3\\right)}=\\frac{1}{2} \\times 941+\\frac{3}{2} \\times 436-3 \\times 389 \\\\ & =470.5+654-1167 \\\\ & =-42.5 \\mathrm{~kJ}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260850279619d9d8a252c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "Formation of $\\mathrm{NO}_{2(\\mathrm{~g})}$ from $\\mathrm{N}_{2(\\mathrm{~g})}$ and $\\mathrm{O}_{2(\\mathrm{~g})}$ is an endothermic process. Which of the following is true for this reaction?", "image": null}, "options": [{"id": "BOOso", "text": "$\\Delta \\mathrm{H}=0$", "image": null, "isCorrect": false}, {"id": "HTcYn", "text": "$\\Delta \\mathrm{H} < 0$", "image": null, "isCorrect": false}, {"id": "VgCj5", "text": "$\\Delta \\mathrm{H}=\\Delta \\mathrm{U}$", "image": null, "isCorrect": false}, {"id": "ZzfdA", "text": "$\\Delta \\mathrm{H}>0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\frac{1}{2} \\mathrm{~N}_{2(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{NO}_2(\\mathrm{~g})\n$$\nIn endothermic process heat is absorbed during the reaction.\n$$\n\\Delta \\mathrm{H}>\\mathrm{O}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260850279619d9d8a2528", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "What is the difference between $\\Delta \\mathrm{H}$ and $\\Delta \\mathrm{U}$ for reaction given below at $298 \\mathrm{~K}$ ? $\\left(\\mathrm{R}=8.314 \\mathrm{JK}^{-1} \\mathrm{~mol}^{-1}\\right)$\n$$\n2 \\mathrm{C}_6 \\mathrm{H}_{6(\\ell)}+150_{2(\\mathrm{~g})} \\rightarrow 12 \\mathrm{CO}_{2(\\mathrm{~g})}+6 \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}\n$$", "image": null}, "options": [{"id": "YFnTp", "text": "$-2.72 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "De0L7", "text": "$-7.43 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "tMWyM", "text": "$-7.8 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "YHc8L", "text": "$-3.72 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\Delta \\mathrm{H}-\\Delta \\mathrm{U}=\\Delta \\mathrm{ngRT} \\\\ & \\Delta \\mathrm{ng}=12-15=-3 \\\\ & \\Delta \\mathrm{H}-\\Delta \\mathrm{U}=-3 \\times 8.314 \\times 298 \\\\ & =-7432.7 \\mathrm{~J}=-7.432 \\mathrm{~kJ}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260740279619d9d8a249d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "Enthalpy of formation of methane is $-75 \\mathrm{~kJ} / \\mathrm{mol}$. What is the enthalpy change for formation of $24 \\mathrm{~g}$ of methane?", "image": null}, "options": [{"id": "gefiR", "text": "$-112.5 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "iIJTl", "text": "$-75 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "FT6nE", "text": "$-150 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "piNpE", "text": "$-130 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Enthalpy of formation for $1 \\mathrm{~mol}$ methane $\\left(\\mathrm{CH}_4\\right)$ is $-75 \\mathrm{~kJ} / \\mathrm{mol}$ moles of $\\mathrm{CH}_4=\\frac{24}{16}=1.5 \\mathrm{moles}$\nChange in enthalpy of formation $=-75 \\times 1.5$ $=-112.5 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605f0279619d9d8a23f1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "What is the value of $\\Delta \\mathrm{H}-\\Delta \\mathrm{U}$ for the formation of 2 moles of ammonia from $\\mathrm{H}_{2(\\mathrm{~g})}$ and $\\mathrm{N}_{2(\\mathrm{~g})}$ ?", "image": null}, "options": [{"id": "oke0M", "text": "$-\\frac{\\mathrm{RT}}{2}$", "image": null, "isCorrect": false}, {"id": "zTM03", "text": "$\\frac{\\mathrm{RT}}{2}$", "image": null, "isCorrect": false}, {"id": "Je5rF", "text": "$-2 \\mathrm{RT}$", "image": null, "isCorrect": true}, {"id": "to4fl", "text": "$2 \\mathrm{RT}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{N}_{2(\\mathrm{~g})}+3 \\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{NH}_{3(\\mathrm{~g})} \\\\ & \\Delta \\mathrm{H}-\\Delta \\mathrm{U}=\\Delta \\mathrm{n}_{\\mathrm{g}} \\cdot \\mathrm{RT} \\\\ & \\Delta \\mathrm{n}_{\\mathrm{g}}=[\\text { Sum of stoichiometric coefficients of gaseous products] } \\\\ & -[\\text { Sum of stoichiometric coefficients of gaseous reactant] } \\\\ & \\Delta \\mathrm{n}_{\\mathrm{g}}=2-1-3=-2 \\\\ & \\Delta \\mathrm{H}-\\Delta \\mathrm{U}-2 \\mathrm{RT}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2603b0279619d9d8a22d2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "Calculate change in enthalpy when $39 \\mathrm{~g}$ acetylene is completely burnt with oxygen and enthalpy of combustion of acetylene is $1300 \\mathrm{~kJ} / \\mathrm{mol}$.", "image": null}, "options": [{"id": "eBKIL", "text": "$-975 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "6MR4H", "text": "$-650 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "YJgwe", "text": "$-1950 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "VAK65", "text": "$-1600 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{C}_2 \\mathrm{H}_{2(\\mathrm{~g})}+\\frac{5}{2} \\mathrm{O}_{(2)} \\longrightarrow 2 \\mathrm{CO}_{(\\mathrm{g})}+\\mathrm{H}_2 \\mathrm{O}_{(\\ell)} ; \\Delta_{\\mathrm{r}} \\mathrm{H}^{\\circ}=-1300 \\mathrm{~kJ} \\mathrm{~mol}^{-1} \\\\\n& \\text { Acetylene } \\\\\n& \\text { When } 26 \\mathrm{~g} \\text { of acetylene is completely burnt, the change in } \\\\\n& \\text { enthalpy }=-1300 \\mathrm{~kJ} \\\\\n& \\therefore \\text { For } 39 \\mathrm{~g} \\text { of acetylene, the change in enthalpy } \\\\\n& =\\frac{-1300 \\times 39}{26}=-1950 \\mathrm{~kJ}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2602a0279619d9d8a2246", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "Calculate difference between $\\Delta \\mathrm{H}$ and $\\Delta \\mathrm{U}$ for following reaction at $25^{\\circ} \\mathrm{C}$ ?\n$$\n\\mathrm{C}_2 \\mathrm{H}_{6(\\mathrm{~g})}+3.50_2 \\rightarrow 2 \\mathrm{CO}_{2(\\mathrm{~g})}+3 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{l})}\\left(\\mathrm{R}=8.314 \\mathrm{JK}^{-1} \\mathrm{~mol}^{-1}\\right)\n$$", "image": null}, "options": [{"id": "gPg0y", "text": "$-9.3 \\mathrm{~kJ}$", "image": null, "isCorrect": false} rm{~g})} \\longrightarrow \\mathrm{H}_{2} \\mathrm{O}_{(\\ell)} \\quad \\Delta \\mathrm{H}_{\\mathrm{f}}^{0}=-286 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$\nFor $18 \\mathrm{~g}$ of $\\mathrm{H}_{2} \\mathrm{O}$, amount of energy liberated $=286 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$\n$\\therefore$ For $1.8 \\mathrm{~g}$ of $\\mathrm{H}_{2} \\mathrm{O}$, amount of energy liberated $=\\frac{1.8 \\times 286}{18}=28.6 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fe00279619d9d8a1ff1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "From the given reaction,\n$\\mathrm{N}_{2(\\mathrm{~g})}+3 \\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{NH}_{3(\\mathrm{~g})} \\Delta \\mathrm{H}=-92 \\cdot 6 \\mathrm{~kJ}$, the enthalpy of formation of $\\mathrm{NH}_{3}$ is", "image": null}, "options": [{"id": "kxysi", "text": "$-92 \\cdot 6 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "072Uc", "text": "$-138 \\cdot 9 \\mathrm{k} \\mathrm{J}$", "image": null, "isCorrect": false}, {"id": "pSnfL", "text": "$-185 \\cdot 2 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "V01CU", "text": "$-46 \\cdot 3 \\mathrm{~kJ}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(B)\n$\\mathrm{N}_{2(\\mathrm{~g})}+3 \\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{NH}_{3(\\mathrm{~g})} \\quad \\Delta \\mathrm{H}=-92.6 \\mathrm{~kJ}$ $\\therefore$ Enthalpy of formation of $\\mathrm{NH}_{3}=\\frac{-92.6}{2}=-46.3 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fdf0279619d9d8a1fef", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "If $2 \\mathrm{~kJ}$ of heat is released from system and $6 \\mathrm{~kJ}$ of work is done on the system, what is enthalpy change of system?", "image": null}, "options": [{"id": "FpABu", "text": "$+8 \\mathrm{k}$", "image": null, "isCorrect": false}, {"id": "SiYIr", "text": "$+6 \\mathrm{k} \\mathrm{J}$", "image": null, "isCorrect": false}, {"id": "pTRm9", "text": "$-8 \\mathrm{k}]$", "image": null, "isCorrect": false}, {"id": "WKW7u", "text": "$-2 \\mathrm{k} \\mathrm{J}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(A)\n$Q=-2 \\mathrm{~kJ}, \\quad W=+6 \\mathrm{~kJ}$ $\\therefore \\quad \\Delta U=Q+W=-2+6=4 \\mathrm{~kJ}$\nNow, $\\Delta H=\\Delta U-W=4-6=-2 k J$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb80279619d9d8a1eb8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "Identify the element having highest enthalpy of atomization from following.", "image": null}, "options": [{"id": "ZMoDJ", "text": "$\\operatorname{Cu}(Z=29)$", "image": null, "isCorrect": false}, {"id": "dItXP", "text": "$\\mathrm{Fe}(Z=26)$", "image": null, "isCorrect": true}, {"id": "2x9J5", "text": "$Zn(Z=30)$", "image": null, "isCorrect": false}, {"id": "qTTcZ", "text": "$\\mathrm{Sc}(Z=21)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Fe $(Z=26)$\nThe atomisation enthalpy of iron (Fe) is the highest. It is determined by the strength of the metallic connection, which is in turn determined by the amount of unpaired electrons. The metallic link will be stronger as the number of unpaired electrons increases. In the electronic configuration of $\\mathrm{Fe}(Z=26)$, four unpaired electrons are present.\n$\\mathrm{Fe}=1 \\mathrm{~s}^{2}, 2 \\mathrm{~s}^{2}, 2 \\mathrm{p}^{6}, 3 \\mathrm{~s}^{2}, 3 \\mathrm{p}^{6}, 3 \\mathrm{~d}^{6}, 4 \\mathrm{~s}^{2}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/G41g4xhBfea9w-mbz7UMPv0AIIWUrUEH2MQn3BavaAo.original.fullsize.png\"><br>\nNumber of unpaired electrons $=4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb80279619d9d8a1eb6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "If $38 \\cdot 55 \\mathrm{~kJ}$ of heat is absorbed when $6 \\cdot 0 \\mathrm{~g}$ of $\\mathrm{O}_{2}$ react with CIF according to reaction $2 \\mathrm{CIF}_{(\\mathrm{g})}+\\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{Cl}_{2} \\mathrm{O}_{(\\mathrm{g})}+0 \\mathrm{~F}_{2}(\\mathrm{~g})$\nWhat is the standard enthalpy of reaction?", "image": null}, "options": [{"id": "OS0z4", "text": "$72.28 \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "bcCmp", "text": "$205.6 \\mathrm{k} \\mathrm{J}$", "image": null, "isCorrect": true}, {"id": "rmshx", "text": "$102.8 \\mathrm{k}]$", "image": null, "isCorrect": false}, {"id": "PacgN", "text": "$49.80 \\mathrm{k}]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\n$\\begin{array}{l}\n2 \\mathrm{ClF}_{(\\mathrm{g})}+\\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{Cl}_{2} \\mathrm{O}_{(\\mathrm{g})}+\\mathrm{OF}_{2(\\mathrm{~g})} \\\\\n\\text { For } 6.0 \\mathrm{~g} \\text { of } \\mathrm{O}_{2} \\Rightarrow \\Delta \\mathrm{H}=+38.55 \\mathrm{~kJ} \\\\\n\\therefore \\text { For } 32.0 \\mathrm{~g} \\text { of } \\mathrm{O}_{2} \\Rightarrow \\Delta \\mathrm{H}^{0}=\\frac{38.55 \\times 32}{6}=205.6 \\mathrm{~kJ}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f950279619d9d8a1daa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "What is the value of $\\Delta \\mathrm{H}^{\\circ}$ for the formation of ethanol from ethene gas and liquid water from following data?\n(i) $\\mathrm{C}_{2} \\mathrm{H}_{5} \\mathrm{OH}_{(1)}+3 \\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{CO}_{2(\\mathrm{~g})}+3 \\mathrm{H}_{2} \\mathrm{O}_{(\\mathrm{l})} \\Delta \\mathrm{H}^{\\circ}=-1368 \\mathrm{~kJ}$\n(ii) $\\mathrm{C}_{2} \\mathrm{H}_{4(\\mathrm{~g})}+3 \\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{CO}_{2(\\mathrm{~g})}+2 \\mathrm{H}_{2} \\mathrm{O}_{(\\mathrm{l})} \\Delta \\mathrm{H}^{\\circ}=1410 \\mathrm{~kJ}$", "image": null}, "options": [{"id": "QcxXZ", "text": "$-1326 \\cdot 0 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "yNBR3", "text": "$-4188 \\cdot 0 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "Wa6hr", "text": "$-42 \\cdot 0 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "UZn6a", "text": "$-2778 \\cdot 0 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Subtract equation (i) from equation (ii) $\\therefore \\quad \\Delta H^{0}=1410-1368=42 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f830279619d9d8a1d14", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "Relation between $\\Delta \\mathrm{H}$ and $\\Delta \\mathrm{U}$ for the reaction\n$2 \\mathrm{SO}_{3(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{SO}_{2_{(\\mathrm{g})}}+\\mathrm{O}_{2_{(\\mathrm{g})}}$ is", "image": null}, "options": [{"id": "WO8fE", "text": "$\\Delta \\mathrm{H}-\\Delta \\mathrm{U}=2 \\mathrm{RT}$", "image": null, "isCorrect": false}, {"id": "TdKo8", "text": "$\\Delta \\mathrm{H}-\\Delta \\mathrm{U}=\\mathrm{RT}$", "image": null, "isCorrect": true}, {"id": "DWSlR", "text": "$\\Delta \\mathrm{H}+\\Delta \\mathrm{U}=-\\mathrm{RT}$", "image": null, "isCorrect": false}, {"id": "4EuSf", "text": "$\\Delta \\mathrm{H}+\\Delta \\mathrm{U}=\\mathrm{RT}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$2 \\mathrm{SO}_{3(g)} \\longrightarrow 2 \\mathrm{SO}_{2(g)}+\\mathrm{O}_{2(g)}$\n$\\Delta \\mathrm{n}=3-2=1$\n$\\mathrm{Now}, \\Delta \\mathrm{H}=\\Delta \\mathrm{U}+\\Delta \\mathrm{n} \\mathrm{RT}$\n$\\therefore \\Delta \\mathrm{H}-\\Delta \\mathrm{U}=\\mathrm{RT}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f800279619d9d8a1cff", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "What is the quantity of heat evolved when $6 \\mathrm{~g}$ carbon combines with sulphur to form $\\mathrm{CS}_{2}$\naccording to the reaction\n$\\mathrm{C}+\\mathrm{S}_{2} \\rightarrow \\mathrm{CS}_{2} \\quad \\Delta \\mathrm{H}=-92 \\mathrm{KJ} \\mathrm{mol}^{-1}$", "image": null}, "options": [{"id": "QCG2m", "text": "$22 \\mathrm{KJ}$", "image": null, "isCorrect": false}, {"id": "iShft", "text": "$32 \\mathrm{KJ}$", "image": null, "isCorrect": false}, {"id": "iRPgk", "text": "$46 \\mathrm{KJ}$", "image": null, "isCorrect": true}, {"id": "MVL3v", "text": "$11 \\mathrm{KJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{C}+\\mathrm{S}_{2} \\longrightarrow \\mathrm{CS}_{2}$\n$\\Delta \\mathrm{H}=-92 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$ (Endothermic reaction)\nFor $12 \\mathrm{~g} \\mathrm{C}$, heat evolved $=92 \\mathrm{~kJ}$\n$\\therefore$ For $6 \\mathrm{~g} \\mathrm{C}$, heat evolved $=46 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f6f0279619d9d8a1c73", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "Energy required to dissociate $16 \\mathrm{~g} \\mathrm{O}_{2(\\mathrm{~g})}$ into free atoms is $x \\mathrm{~kJ}$. The value of bond enthalpy of $\\mathrm{O}=O$ bond is", "image": null}, "options": [{"id": "krBk2", "text": "$2 x KJ$", "image": null, "isCorrect": true}, {"id": "gR3Mm", "text": "$\\frac{x}{2} \\mathbf{KJ}$", "image": null, "isCorrect": false}, {"id": "coUW1", "text": "$4 x kJ$", "image": null, "isCorrect": false}, {"id": "8EaTJ", "text": "16xKJ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f6f0279619d9d8a1c6e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "Heat of combustion of $\\mathrm{C}_{(\\mathrm{s})}, \\mathrm{H}_{2(\\mathrm{~g})}$ and $\\mathrm{C}_{2} \\mathrm{H}_{6(\\mathrm{~g})}$ are $-x_{1},-x_{2}$ and $-x_{3}$ respectively. Hence heat of formation of $\\mathrm{C}_{2} \\mathrm{H}_{6(\\mathrm{~g})}$ is", "image": null}, "options": [{"id": "8F6Fu", "text": "$-x_{1}-x_{2}+x_{3}$", "image": null, "isCorrect": false}, {"id": "LdbmG", "text": "$-2 x_{1}-3 x_{2}+x_{3}$", "image": null, "isCorrect": true}, {"id": "Cjnn8", "text": "$x_{1}+x_{2}-x_{3}$", "image": null, "isCorrect": false}, {"id": "YgOHW", "text": "$-x_{3}+2 x_{1}+3 x_{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "i. $\\quad \\mathrm{C}+\\mathrm{O}_{2} \\longrightarrow \\mathrm{CO}_{2} \\quad \\Delta \\mathrm{H}_{1}=-\\mathrm{x}_{1}$\nii. $\\mathrm{H}_{2}+\\frac{1}{2} \\mathrm{O}_{2} \\longrightarrow \\mathrm{H}_{2} \\mathrm{O} \\quad \\Delta \\mathrm{H}_{2}=-\\mathrm{x}_{2}$\niii. $\\mathrm{C}_{2} \\mathrm{H}_{6}+\\frac{7}{2} \\mathrm{O}_{2} \\rightarrow 2 \\mathrm{CO}_{2}+3 \\mathrm{H}_{2} \\mathrm{O} \\quad \\Delta \\mathrm{H}_{3}=-\\mathrm{x}_{3}$\nMultiply equation (i) by $2+$ multiply equation (ii) by 3 - equation (iii)\n$$\n\\begin{array}{l}\n\\therefore 2 \\mathrm{C}+3 \\mathrm{H}_{2} \\longrightarrow \\mathrm{C}_{2} \\mathrm{H}_{6} \\\\\n\\therefore \\Delta \\mathrm{H}=2 \\Delta \\mathrm{H}_{1}+3 \\Delta \\mathrm{H}_{2}-\\Delta \\mathrm{H}_{3} \\\\\n\\therefore \\Delta \\mathrm{H}=-2 \\mathrm{x}_{1}-3 \\mathrm{x}_{2}+\\mathrm{x}_{3}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f5e0279619d9d8a1be5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "For following reaction, relation between $\\Delta \\mathrm{H}$ and $\\Delta \\mathrm{U}$ is\n$2 \\mathrm{SO}_{3(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{SO}_{3(\\mathrm{~g})}$", "image": null}, "options": [{"id": "cdwzH", "text": "$\\Delta \\mathrm{H}=\\Delta \\mathrm{U}-2 \\mathrm{RT}$", "image": null, "isCorrect": false}, {"id": "YrZYw", "text": "$\\Delta \\mathrm{H}=\\Delta \\mathrm{U}-\\mathrm{RT}$", "image": null, "isCorrect": true}, {"id": "NW1f3", "text": "$\\Delta \\mathrm{H}=\\Delta \\mathrm{U}+2 \\mathrm{RT}$", "image": null, "isCorrect": false}, {"id": "2Z35r", "text": "$\\Delta \\mathrm{H}=\\Delta \\mathrm{U}+\\mathrm{RT}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\Delta \\mathrm{H}=\\Delta \\mathrm{U}+\\Delta \\mathrm{n}_{(\\mathrm{g})} \\ l, "isCorrect": false}, {"id": "T5ogK", "text": "$-31.5 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "MNB2z", "text": "$-315 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "b3I27", "text": "$+31.5 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n\\mathrm{C}+\\mathrm{O}_{2} \\longrightarrow \\mathrm{CO}_{2} & \\\\\n& \\Delta H=-393.5 \\mathrm{~kJ} / \\mathrm{mol}\n\\end{aligned}\n$$\nHeat released upon the formation of $44 \\mathrm{~g}$ of\n$$\n\\mathrm{CO}_{2}=-393.5 \\mathrm{~kJ}\n$$\n$\\therefore$ Heat released upon the formation of $1 \\mathrm{~g}$ of\n$$\n\\mathrm{CO}_{2}=\\frac{-393.5}{44} \\mathrm{~kJ}\n$$\n$\\therefore$ Heat released upon the formation of $35.2 \\mathrm{~g}$ of\n$$\n\\begin{aligned}\n\\mathrm{CO}_{2} &=\\frac{-393.5}{44} \\times 35.2 \\\\\n& \\simeq-315 \\mathrm{~kJ}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8c0279619d9d8a1551", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "According to Hess's law, the heat of reaction depends upon", "image": null}, "options": [{"id": "vaa4N", "text": "initial condition of reactants", "image": null, "isCorrect": false}, {"id": "oSeqQ", "text": "initial and final conditions of reactants", "image": null, "isCorrect": true}, {"id": "L6rYO", "text": "intermediate path of the reaction", "image": null, "isCorrect": false}, {"id": "TxbTZ", "text": "end conditions of reactants", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Hess's law, the heat of reaction depends upon the initial and final conditions of reactants.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8c0279619d9d8a1550", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "The heat of neutralisation of a strong acid and a strong alkali is $57.0 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$. The heat released\nwhen $0.5$ mole of $\\mathrm{HNO}_{3}$ solution is mixed with $0.2$ mole of $\\mathrm{KOH}$ is", "image": null}, "options": [{"id": "OdPyQ", "text": "$57.0 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "VPSos", "text": "$11.4 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "jyZg5", "text": "$28.5 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "KnU4S", "text": "$34.9 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\because 0.2$ mole will neutralise $0.2$ mole of $\\mathrm{HNO}_{3}$.\n$$\n\\begin{aligned}\n\\therefore \\text { Heat evolved } &=57 \\times 0.2 \\\\\n&=11.4 \\mathrm{~kJ}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7a0279619d9d8a14c1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "Find the correct equation", "image": null}, "options": [{"id": "6k7hX", "text": "$E_{2}-E_{1}-H_{2}+H_{1}=n_{2} R T-n_{1} R T$", "image": null, "isCorrect": false}, {"id": "feok9", "text": "$E_{2}-E_{1}-H_{2}-H_{1}=n_{2} R T-n_{1} R T$", "image": null, "isCorrect": false}, {"id": "QRJg4", "text": "$H_{2}-H_{1}-E_{2}+E_{1}=n_{2} R T-n_{1} R T$", "image": null, "isCorrect": true}, {"id": "j3lvL", "text": "$H_{2}-H_{1}-E_{2}+E_{1}=n_{2} R T-n_{1} R T$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that,\nor\n$$\n\\begin{array}{l}\n\\Delta H=\\Delta E+\\Delta n_{g} R T \\\\\nH_{2}-H_{1}=E_{2}-E_{1}+\\left(n_{2} R T-n_{1} R T\\right) \\\\\nH_{2}-H_{1}-E_{2}+E_{1}=n_{2} R T-n_{1} R T\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e790279619d9d8a14b6", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The heat of formation of water is $260 \\mathrm{~kJ}$. How much $\\mathrm{H}_{2} \\mathrm{O}$ is decomposed by $130 \\mathrm{~kJ}$ of heat ?", "image": null}, "options": [{"id": "HuUwH", "text": "$0.25 \\mathrm{~mol}$", "image": null, "isCorrect": false}, {"id": "YddlF", "text": "$1 \\mathrm{~mol}$", "image": null, "isCorrect": false}, {"id": "Avo3t", "text": "$0.5 \\mathrm{~mol}$", "image": null, "isCorrect": true}, {"id": "dWG4f", "text": "$2 \\mathrm{~mol}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction for the formation of water is as\n$$\n\\mathrm{H}_{2}+\\frac{1}{2} \\mathrm{O}_{2} \\longrightarrow \\mathrm{H}_{2} \\mathrm{O} ; \\quad \\Delta H=260 \\mathrm{~kJ} \\ldots \\text { (i) }\n$$\nOn reversing Eq. (i), we get $\\underset{1}{\\mathrm{H}_{2} \\mathrm{O}} \\longrightarrow \\mathrm{H}_{2}+\\frac{1}{2} \\mathrm{O}_{2}$\n$$\n\\Delta H=-260 \\mathrm{~kJ}\n$$\n$\\because$ By $260 \\mathrm{~kJ}$ heat water decomposed $=1 \\mathrm{~mol}$ $\\therefore 130 \\mathrm{k}_{\\mathrm{I}} \\mathrm{I}$ hont will decomposo water $=\\frac{1 \\times 130}{260}$\n$$\n=0.5 \\mathrm{~mol}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e6a0279619d9d8a143c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "Heat of combustion of methane is $-800 \\mathrm{~kJ}$. What is the heat of combustion for $4 \\times 10^{-4} \\mathrm{~kg}$\nof methane?", "image": null}, "options": [{"id": "JPKvf", "text": "$-800 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "3RJkB", "text": "$-3.2 \\times 10^{4} \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "aFDkt", "text": "$-20 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "g3A2M", "text": "$-1600 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{CH}_{4}+2 \\mathrm{O}_{2} \\longrightarrow \\mathrm{CO}_{2}+2 \\mathrm{H}_{2} \\mathrm{O} ; \\Delta H_{c}=-800 \\mathrm{~kJ}$\n$16 \\mathrm{~g}$\n$\\because$ Heat of combustion of $16 \\times 10^{-3} \\mathrm{~kg}$ $\\mathrm{CH}_{4}=-800 \\mathrm{~kJ}$\n$\\therefore$ Heat of combustion of $4 \\times 10^{-4} \\mathrm{~kg} \\mathrm{CH}_{4}$ will be\n$$\n\\begin{array}{l}\n=-\\frac{800 \\times 4 \\times 10^{-4}}{16 \\times 10^{-3}} \\\\\n=-20 \\mathrm{~kJ}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e560279619d9d8a139c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "If $\\mathrm{C}(s)+\\mathrm{O}_{2}(g) \\longrightarrow \\mathrm{CO}_{2}(g) ; \\Delta H=r$\nand $\\mathrm{CO}(g)+\\frac{1}{2} \\mathrm{O}_{2} \\longrightarrow \\mathrm{CO}_{2}(g): \\Delta H=s$\nthen, the heat of formation of $\\mathrm{CO}$ is", "image": null}, "options": [{"id": "wUCVv", "text": "$r+s$", "image": null, "isCorrect": false}, {"id": "BzCvP", "text": "$r-s$", "image": null, "isCorrect": true}, {"id": "qZsAi", "text": "$s-r$", "image": null, "isCorrect": false}, {"id": "Nhi1T", "text": "$\\mathrm{rs}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{C}(s)+\\mathrm{O}_{2}(g) \\rightarrow \\mathrm{CO}_{2}(g) ; \\Delta H=r$ ...(i)\n$\\mathrm{CO}(g)+\\frac{1}{2} \\mathrm{O}_{2}(g) \\rightarrow \\mathrm{CO}_{2}(g) ; \\Delta H=s$ ...(ii)\n$\\mathrm{C}(s)+\\frac{1}{2} \\mathrm{O}_{2}(g) \\longrightarrow \\mathrm{CO}(g) ; \\Delta H=?$\nSubtract Eq. (ii) from Eq. (i) \n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/bNzT4AbsDh5utzXcQVKr5SrIy6HpF5_VPrSzHMHQDnw.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e540279619d9d8a138d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "If $\\Delta E$ is the heat of reaction for $\\mathrm{C}_{2} \\mathrm{H}_{5} \\mathrm{OH}(\\mathrm{l})+3 \\mathrm{O}_{2}(g) \\longrightarrow 2 \\mathrm{CO}_{2}(\\mathrm{~g})+3 \\mathrm{H}_{2} \\mathrm{O}(\\mathrm{l})$\nat constant volume, the $\\Delta H$ (heat of reaction at constant pressure), at constant temperature is", "image": null}, "options": [{"id": "voi7H", "text": "$\\Delta H=\\Delta E+R T$", "image": null, "isCorrect": false}, {"id": "lDG5d", "text": "$\\Delta H=\\Delta E-R T$", "image": null, "isCorrect": true}, {"id": "Geusz", "text": "$\\Delta H=\\Delta E-2 R T$", "image": null, "isCorrect": false}, {"id": "12Qw3", "text": "$\\Delta H=\\Delta E+2 R T$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that, $\\Delta H=\\Delta E+\\Delta n R T$\nwhere, $\\Delta n=$ number of moles of gaseous products - number of moles of gaseous reactants\n$\\begin{array}{lrl} & =2-3= & -1 \\\\ \\text { So, } & & \\Delta H=\\Delta E-R T\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e400279619d9d8a12f1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Hess's law is based on", "image": null}, "options": [{"id": "A8mCd", "text": "law of conservation of mass", "image": null, "isCorrect": false}, {"id": "VYskH", "text": "law of conservation of energy", "image": null, "isCorrect": true}, {"id": "kECwS", "text": "first law of thermodynamics", "image": null, "isCorrect": false}, {"id": "8Wa0U", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Hess's law is based upon law of conservation of energy ie, first law of thermodynamics.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e400279619d9d8a12f0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "For an ideal gas, the heat of reaction at constant pressure and constant volume are related as", "image": null}, "options": [{"id": "h4A4q", "text": "$H+E=p V$", "image": null, "isCorrect": false}, {"id": "gksrr", "text": "$E=H+p \\Delta V$", "image": null, "isCorrect": false}, {"id": "Ml5Id", "text": "$q_{p}=q_{v}+\\Delta n R T$", "image": null, "isCorrect": true}, {"id": "VJGfq", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The heat of reaction for an ideal gas, at constant pressure and constant volume are related as\n$$\n\\begin{array}{ll}\n\\therefore & \\Delta H=\\Delta E+\\Delta n R T \\\\\n\\because & q_{p}=q_{V}+\\Delta n R T\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e400279619d9d8a12ef", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "For the reaction, $2 \\mathrm{H}_{2}(g)+\\mathrm{O}_{2}(g) \\longrightarrow 2 \\mathrm{H}_{2} \\mathrm{O}(g)$\n$$\n\\Delta H^{\\circ}=-573.2 \\mathrm{~kJ}\n$$\nThe heat of decomposition of water per mole is", "image": null}, "options": [{"id": "oBYTc", "text": "$286.6 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "ZnKFo", "text": "$573.2 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "rud5q", "text": "$-28.66 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "OoiT5", "text": "zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Heat of decomposition of water is\n$$\n\\begin{aligned}\n\\mathrm{H}_{2} \\mathrm{O}(g) \\longrightarrow & \\mathrm{H}_{2}(g)+\\frac{1}{2} \\mathrm{O}_{2}(g), \\\\\n\\Delta H=\\frac{+573.2}{2}=286.6 \\mathrm{~kJ} / \\mathrm{mol}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a2632b0279619d9d8a3ca2", "title": "Entropy and Second law of thermodynamics", "totalQuestions": 21, "questions": [{"_id": "6abb88a115a9fc0fc8c14584", "type": "singleCorrect", "question": {"text": "Calulate $\\Delta S_{(total)}$ for following reaction.<br>$\\text{CH}_3\\text{OH}_{(l)} + 3/2 \\text{O}_{2(g)} \\rightarrow \\text{CO}_{2(g)} + 2\\text{H}_2\\text{O}_{(l)}$, $\\Delta H = -726$ kJ mol$^{-1}$, $\\Delta S_{(system)} = 42$ JK$^{-1}$<br>(both at $298$ K)", "image": null}, "options": [{"id": "Mxmll", "label": "A", "text": "$2.478$ kJ K$^{-1}$", "isCorrect": true, "image": null}, {"id": "G5jxW", "label": "B", "text": "$-2.378$ kJ K$^{-1}$", "isCorrect": false, "image": null}, {"id": "tP6ME", "label": "C", "text": "$39.58$ kJ K$^{-1}$", "isCorrect": false, "image": null}, {"id": "BGAmM", "label": "D", "text": "$44.42$ kJ K$^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The total entropy change is given by the sum of the entropy change of the system and the surroundings:<br><br>$\\Delta S_{(total)} = \\Delta S_{(system)} + \\Delta S_{(surrounding)}$<br><br>The entropy change of the surroundings can be calculated using the enthalpy change of the system:<br><br>$\\Delta S_{(surrounding)} = -\\dfrac{\\Delta H_{(system)}}{T}$<br><br>Substituting the given values:<br><br>$\\Delta S_{(surrounding)} = -\\dfrac{-726 \\times 10^3}{298} = 2436.24 \\text{ J K}^{-1}$<br><br>Now, calculating the total entropy change:<br><br>$\\Delta S_{(total)} = 42 + 2436.24 = 2478.24 \\text{ J K}^{-1}$<br><br>Converting to kilojoules:<br><br>$\\Delta S_{(total)} = 2.478 \\text{ kJ K}^{-1}$<br><br>Answer: $2.478$ kJ K$^{-1}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889115a9fc0fc8c144ec", "type": "singleCorrect", "question": {"text": "Which of the following statements regarding entropy is correct?", "image": null}, "options": [{"id": "5YO88", "label": "A", "text": "It decreases in spontaneous process.", "isCorrect": false, "image": null}, {"id": "TQNlD", "label": "B", "text": "Change in entropy of sublimation is negative.", "isCorrect": false, "image": null}, {"id": "nw9PN", "label": "C", "text": "It measures randomness.", "isCorrect": true, "image": null}, {"id": "JcD7n", "label": "D", "text": "It is path dependent.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Entropy is a thermodynamic state function that measures the degree of randomness or disorder of a system.<br><br>For a spontaneous process, the total entropy of the universe increases, meaning $\\Delta S_{total} > 0$.<br><br>Sublimation involves the conversion of a solid directly into a gas, which leads to an increase in randomness, so $\\Delta S_{sublimation}$ is positive.<br><br>Since entrop
