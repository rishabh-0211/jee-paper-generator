  <script>
    const data = {"index": 6, "chapterId": "61c0898b8cd9aeee427e0b41", "chapter": "Thermodynamics (C)", "exam": "MHT CET", "totalTopics": 5, "totalQuestions": 355, "downloadTime": "2026-10-08 20:05:50", "topics": [{"index": 1, "topicId": "65a2632b0279619d9d8a3c9f", "title": "System and surrounding", "totalQuestions": 23, "questions": [{"_id": "6abb88d215a9fc0fc8c14744", "type": "singleCorrect", "question": {"text": "Which of the following statements is correct about temperature and internal energy ?", "image": null}, "options": [{"id": "MITte", "label": "A", "text": "Both are extensive properties of the system.", "isCorrect": false, "image": null}, {"id": "6iPFV", "label": "B", "text": "Both are the intensive properties of the system.", "isCorrect": false, "image": null}, {"id": "3Sozz", "label": "C", "text": "Intensive and extensive properties of the system respectively.", "isCorrect": true, "image": null}, {"id": "LO0ol", "label": "D", "text": "Extensive and intensive properties of the system respectively.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Intensive properties are those which do not depend on the mass or size of the system. Temperature is independent of the amount of substance present, so it is an intensive property.<br><br>Extensive properties are those which depend on the mass or size of the system. Internal energy is directly proportional to the amount of substance, so it is an extensive property.<br><br>Therefore, temperature and internal energy are intensive and extensive properties of the system respectively.<br><br>Answer: Intensive and extensive properties of the system respectively.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884215a9fc0fc8c141fe", "type": "singleCorrect", "question": {"text": "Which of the following is NOT the state function?", "image": null}, "options": [{"id": "XWM6H", "label": "A", "text": "Gibbs energy", "isCorrect": false, "image": null}, {"id": "DZOzM", "label": "B", "text": "Temperature", "isCorrect": false, "image": null}, {"id": "EkeG6", "label": "C", "text": "Heat", "isCorrect": true, "image": null}, {"id": "bA33K", "label": "D", "text": "Heat transfer at constant volume ($Q_v$)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "State functions are properties whose values depend only on the initial and final states of the system and not on the path taken.<br><br>Gibbs energy ($G$) and temperature ($T$) are state functions.<br><br>Heat transfer at constant volume ($Q_v$) is equal to the change in internal energy ($\\Delta U$), which is a state function.<br><br>Heat ($Q$) and work ($W$) are path functions because their values depend on the path followed during a process.<br><br>Therefore, heat is not a state function.<br><br>Answer: Heat", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886115a9fc0fc8c1432a", "type": "singleCorrect", "question": {"text": "Which of the following is an extensive property?", "image": null}, "options": [{"id": "b1531", "label": "A", "text": "Melting point", "isCorrect": false, "image": null}, {"id": "42K54", "label": "B", "text": "Density", "isCorrect": false, "image": null}, {"id": "OblSd", "label": "C", "text": "Mass", "isCorrect": true, "image": null}, {"id": "qIXFA", "label": "D", "text": "Viscosity", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Extensive properties are those whose value depends on the quantity or size of matter present in the system.<br><br>Mass depends on the amount of matter present, so it is an extensive property.<br><br>Melting point, density, and viscosity are independent of the amount of matter present, so they are intensive properties.<br><br>Answer: Mass", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30a8c30a4553e1bdf81", "type": "singleCorrect", "question": {"text": "Which from following is NOT a state function ?", "image": null}, "options": [{"id": "QbY1x", "label": "A", "text": "Volume", "isCorrect": false, "image": null}, {"id": "eOJE1", "label": "B", "text": "Pressure", "isCorrect": false, "image": null}, {"id": "vfArU", "label": "C", "text": "Work", "isCorrect": true, "image": null}, {"id": "j95yF", "label": "D", "text": "Temperature", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "State functions are properties whose values depend only on the state of the system and are independent of the path followed to reach that state.<br><br>Pressure, volume, and temperature are state functions because they depend only on the initial and final states of the system.<br><br>Work and heat are path functions because their values depend on the specific path taken to go from the initial state to the final state.<br><br>Therefore, work is not a state function.<br><br>Answer: Work", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3198c30a4553e1be02a", "type": "singleCorrect", "question": {"text": "Which of the following properties of a system depends upon the amount of matter and path?", "image": null}, "options": [{"id": "cA7bN", "label": "A", "text": "Heat", "isCorrect": true, "image": null}, {"id": "Mv46Y", "label": "B", "text": "Free energy", "isCorrect": false, "image": null}, {"id": "Lg6pT", "label": "C", "text": "Enthalpy", "isCorrect": false, "image": null}, {"id": "xkjUP", "label": "D", "text": "Entropy", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Properties that depend on the amount of matter present in the system are known as extensive properties.<br><br>Properties whose values depend on the specific path taken to go from the initial state to the final state are known as path functions.<br><br>Free energy, enthalpy, and entropy are state functions, meaning their values depend only on the initial and final states of the system and are independent of the path followed.<br><br>Heat is a path function because the amount of heat exchanged depends on the process or path taken. It also depends on the amount of matter (extensive in nature), as the heat required to change the state of a system is proportional to its mass or number of moles ($q = mc\\Delta T$).<br><br>Answer: Heat", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c00bf9280d7f9932e5e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following is an example of an intensive property of the system?", "image": null}, "options": [{"id": "EeiLw", "text": "Volume", "image": null, "isCorrect": false}, {"id": "Eyga0", "text": "Enthalpy", "image": null, "isCorrect": false}, {"id": "5R3Z3", "text": "Entropy", "image": null, "isC  "Which of the following is NOT an intensive property?", "image": null}, "options": [{"id": "7Iot1", "text": "Surface tension", "image": null, "isCorrect": false}, {"id": "0sCmJ", "text": "Density", "image": null, "isCorrect": false}, {"id": "t7I7G", "text": "Refractive index", "image": null, "isCorrect": false}, {"id": "L5cZJ", "text": "Heat capacity", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "i. Extensive property - heat capacity (depends on the amount of matter present in the system)\nii. Intensive property - surface tension, density, refractive index (independent of the amount of matter present in the system)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eb50279619d9d8a169f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "Identify the extensive property amongst the following.", "image": null}, "options": [{"id": "gAH8Y", "text": "Viscosity", "image": null, "isCorrect": false}, {"id": "GvsB2", "text": "Heat capacity", "image": null, "isCorrect": true}, {"id": "wFnfq", "text": "Density", "image": null, "isCorrect": false}, {"id": "1Xgxr", "text": "Surface tension", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Heat capacity is the only extensive capacity among the following.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e400279619d9d8a12f2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Which of the following is a path function?", "image": null}, "options": [{"id": "9uZf6", "text": "Internal energy", "image": null, "isCorrect": false}, {"id": "nirXc", "text": "Enthalpy", "image": null, "isCorrect": false}, {"id": "gVz47", "text": "Work", "image": null, "isCorrect": true}, {"id": "H29Ul", "text": "Entropy", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Internal energy, enthalpy and entropy are state functions but work and heat are path function.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a2632b0279619d9d8a3ca0", "title": "First Law and Basic Fundamentals of Thermodynamics", "totalQuestions": 170, "questions": [{"_id": "6abb884215a9fc0fc8c14200", "type": "singleCorrect", "question": {"text": "2 moles of an ideal gas expand isothermally and reversibly from $10 \\text{ L}$ to $50 \\text{ L}$ at $298 \\text{ K}$. Calculate the work done during this expansion. ($R = 8.314 \\text{ JK}^{-1}\\text{ mol}^{-1}$)", "image": null}, "options": [{"id": "aftWB", "label": "A", "text": "$-79.756 \\text{ J}$", "isCorrect": false, "image": null}, {"id": "iuzhQ", "label": "B", "text": "$-7.9756 \\text{ J}$", "isCorrect": false, "image": null}, {"id": "4cFLH", "label": "C", "text": "$-7975 \\text{ kJ}$", "isCorrect": false, "image": null}, {"id": "sWHY9", "label": "D", "text": "$-7.975 \\text{ kJ}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The work done during an isothermal and reversible expansion of an ideal gas is given by the formula:<br><br>$W = -2.303 nRT \\log \\left( \\dfrac{V_2}{V_1} \\right)$<br><br>Given values are:<br>$n = 2 \\text{ moles}$<br>$R = 8.314 \\text{ J K}^{-1} \\text{ mol}^{-1}$<br>$T = 298 \\text{ K}$<br>$V_1 = 10 \\text{ L}$<br>$V_2 = 50 \\text{ L}$<br><br>Substituting these values into the formula:<br><br>$W = -2.303 \\times 2 \\times 8.314 \\times 298 \\times \\log \\left( \\dfrac{50}{10} \\right)$<br><br>$W = -11411.6 \\times \\log(5)$<br><br>Using $\\log(5) \\approx 0.699$:<br><br>$W = -11411.6 \\times 0.699$<br><br>$W \\approx -7976 \\text{ J}$<br><br>$W \\approx -7.975 \\text{ kJ}$<br><br>Answer: $-7.975 \\text{ kJ}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884215a9fc0fc8c141ff", "type": "singleCorrect", "question": {"text": "A gas expands by $2500 \\text{ cm}^3$ against constant external pressure $1.5 \\text{ atm}$ at constant temperature of $300 \\text{ K}$. Calculate the work of expansion in kJ.", "image": null}, "options": [{"id": "eTAjH", "label": "A", "text": "$-0.380$", "isCorrect": true, "image": null}, {"id": "mwaXQ", "label": "B", "text": "$-0.350$", "isCorrect": false, "image": null}, {"id": "7Hkjy", "label": "C", "text": "$-0.42$", "isCorrect": false, "image": null}, {"id": "iuC5H", "label": "D", "text": "$-0.45$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given change in volume $\\Delta V = 2500 \\text{ cm}^3 = 2.5 \\text{ L}$.<br><br>External pressure $P_{ext} = 1.5 \\text{ atm}$.<br><br>The work done during expansion against a constant external pressure is given by:<br><br>$W = -P_{ext} \\Delta V$<br><br>$W = -1.5 \\times 2.5 = -3.75 \\text{ L atm}$<br><br>Using the conversion factor $1 \\text{ L atm} = 101.325 \\text{ J}$:<br><br>$W = -3.75 \\times 101.325 \\text{ J} = -379.968 \\text{ J}$<br><br>Converting to kilojoules:<br><br>$W \\approx -0.380 \\text{ kJ}$<br><br>Answer: $-0.380$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885215a9fc0fc8c14295", "type": "singleCorrect", "question": {"text": "Calculate the work done when $2$ moles of an ideal gas expand isothermaly and reversibly from $10$ $\\text{dm}^3$ to $20$ $\\text{dm}^3$ at $300$ K<br>$(R = 8.314\\,\\text{JK}^{-1}\\text{mol}^{-1})$", "image": null}, "options": [{"id": "hJxzT", "label": "A", "text": "$-3458\\,J$", "isCorrect": true, "image": null}, {"id": "jzkwv", "label": "B", "text": "$-1729\\,J$", "isCorrect": false, "image": null}, {"id": "KIu58", "label": "C", "text": "$-864.5\\,J$", "isCorrect": false, "image": null}, {"id": "Ly76s", "label": "D", "text": "$-2593\\,J$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For an isothermal reversible expansion of an ideal gas, the work done is given by:<br><br>$W = -2.303 nRT \\log_{10}\\left(\\dfrac{V_2}{V_1}\\right)$<br><br>Substituting the given values $n = 2$, $R = 8.314 \\, \\text{J K}^{-1} \\text{mol}^{-1}$, $T = 300 \\, \\text{K}$, $V_1 = 10 \\, \\text{dm}^3$, and $V_2 = 20 \\, \\text{dm}^3$:<br><br>$W = -2.303 \\times 2 \\times 8.314 \\times 300 \\times \\log_{10}\\left(\\dfrac{20}{10}\\right)$<br><br>$W = -2.303 \\times 4988.4 \\times \\log_{10}(2)$<br><br>$W = -11488.28 \\times 0.3010$<br><br>$W \\approx -3458 \\, \\text{J}$<br><br>Answer: $-3458\\,J$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885215a9fc0fc8c14294", "type": "singleCorrect", "question": {"text": "In a process, $\\Delta U = 0$ and $q \\neq 0$. Then the process must involve", "image": null}, "options": [{"id": "wdFhz", "label": "A", "text": "No work is done during the process.", "isCorrect": false, "image": null}, {"id": "BDA1N", "label": "B", "text": "Heat is transferred, but no mechanical work occurs.", "isCorrect": false, "image": null}, {"id": "gm8kf", "label": "C", "text": "Work done by or on a system exactly equal in magnitude and opposite in sign to a heat transfer.", "isCorrect": true, "image": null}, {"id": "43Y6g", "label": "D", "text": "There is a change in internal energy of the system throughout the process.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics, the change in internal energy is given by $\\Delta U = q + w$.<br><br>Given that $\\Delta U = 0$, we can substitute this into the equation to get $0 = q + w$, which implies $w = -q$.<br><br>Since $q \\neq 0$, it follows that $w \\neq 0$. This means that the work done by or on the system is exactly equal in magnitude and opposite in sign to the heat transfer.<br><br>Answer: Work done by or on a system exactly equal in magnitude and opposite in sign to a heat transfer.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b115a9fc0fc8c14619", "type": "singleCorrect", "question": {"text": "Calculate the work done in the following reaction<br>$\\text{NH}_4\\text{NO}_{3(s)} \\rightarrow \\text{N}_2\\text{O}_{(g)} + 2\\text{H}_2\\text{O}_{(g)}$ at $300$ K.<br>[$R = 8.314\\ \\text{J K}^{-1}\\ \\text{mol}^{-1}$]", "image": null}, "options": [{"id": "lx35R", "label": "A", "text": "$-7.483\\ \\text{kJ mol}^{-1}$", "isCorrect": true, "image": null}, {"id": "hLnOc", "label": "B", "text": "$-3.741\\ \\text{kJ mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "kNfFJ", "label": "C", "text": "$-11.224\\ \\text{kJ mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "WhBmW", "label": "D", "text": "$-14.966\\ \\text{kJ mol}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction is $\\text{NH}_4\\text{NO}_{3(s)} \\rightarrow \\text{N}_2\\text{O}_{(g)} + 2\\text{H}_2\\text{O}_{(g)}$<br><br>The change in the number of gaseous moles is given by:<br><br>$\\Delta n_g = \\text{moles of gaseous products} - \\text{moles of gaseous reactants}$<br><br>$\\Delta n_g = (1 + 2) - 0 = 3$<br><br>The work done in a chemical reaction at constant temperature and pressure is:<br><br>$W = -\\Delta n_g R T$<br><br>Substituting the given values ($R = 8.314\\ \\text{J K}^{-1}\\ \\text{mol}^{-1}$, $T = 300\\ \\text{K}$):<br><br>$W = -3 \\times 8.314 \\times 300$<br><br>$W = -7482.6\\ \\text{J mol}^{-1}$<br><br>$W = -7.483\\ \\text{kJ mol}^{-1}$<br><br>Answer: $-7.483\\ \\text{kJ mol}^{-1}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b115a9fc0fc8c14618", "type": "singleCorrect", "question": {"text": "Which of the following processes uses the total heat absorbed by system to perform work on the surrounding?", "image": null}, "options": [{"id": "W9Zir", "label": "A", "text": "Adiabatic", "isCorrect": false, "image": null}, {"id": "TMycy", "label": "B", "text": "Isothermal", "isCorrect": true, "image": null}, {"id": "TMniI", "label": "C", "text": "Isochoric", "isCorrect": false, "image": null}, {"id": "PznEQ", "label": "D", "text": "Isobaric", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics, $\\Delta Q = \\Delta U + \\Delta W$.<br><br>If the total heat absorbed by the system is used entirely to perform work on the surroundings, then $\\Delta Q = \\Delta W$.<br><br>This implies that the change in internal energy of the system is zero, i.e., $\\Delta U = 0$.<br><br>For an ideal gas, the internal energy depends only on temperature. Since $\\Delta U = 0$, the change in temperature $\\Delta T = 0$.<br><br>A process in which the temperature remains constant is called an isothermal process.<br><br>Answer: Isothermal", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887115a9fc0fc8c143c2", "type": "singleCorrect", "question": {"text": "Calculate the constant external pressure required to compress $4$ moles of an ideal gas, from volume $30$ dm$^3$ to $20$ dm$^3$ when the work obtained is $4053$ J.", "image": null}, "options": [{"id": "FPL1S", "label": "A", "text": "$4$ atm.", "isCorrect": true, "image": null}, {"id": "HYVoe", "label": "B", "text": "$4.5$ atm.", "isCorrect": false, "image": null}, {"id": "qUXCF", "label": "C", "text": "$5$ atm.", "isCorrect": false, "image": null}, {"id": "1xq5w", "label": "D", "text": "$3.5$ atm.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Work done during compression against a constant external pressure is given by $W = -P_{ext} \\Delta V$.<br><br>Given work done on the gas, $W = 4053$ J.<br><br>Converting work into L atm using $1$ L atm $= 101.325$ J:<br><br>$W = \\dfrac{4053}{101.325} = 40$ L atm<br><br>Initial volume, $V_1 = 30$ dm$^3 = 30$ L<br><br>Final volume, $V_2 = 20$ dm$^3 = 20$ L<br><br>Change in volume, $\\Delta V = V_2 - V_1 = 20 - 30 = -10$ L<br><br>Substituting the values into the work formula:<br><br>$40 = -P_{ext} \\times (-10)$<br><br>$P_{ext} = 4$ atm<br><br>Answer: $4$ atm.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888115a9fc0fc8c14458", "type": "singleCorrect", "question": {"text": "In a particular reaction, $4$ kJ of heat is released by the system and $8$ kJ of work is done on the system. Determine the value of $\\Delta U$.", "image": null}, "options": [{"id": "OS0Fa", "label": "A", "text": "$+2$ kJ", "isCorrect": false, "image": null}, {"id": "2XeFX", "label": "B", "text": "$-2$ kJ", "isCorrect": false, "image": null}, {"id": "lz6bR", "label": "C", "text": "$+4$ kJ", "isCorrect": true, "image": null}, {"id": "BZQXs", "label": "D", "text": "$-4$ kJ", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics:<br><br>$\\Delta U = q + w$<br><br>Given that heat is released by the system, $q = -4$ kJ.<br><br>Work is done on the system, so $w = +8$ kJ.<br><br>Substituting the values:<br><br>$\\Delta U = -4 + 8 = +4$ kJ.<br><br>Answer: $+4$ kJ", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889115a9fc0fc8c144ed", "type": "singleCorrect", "question": {"text": "If $X$ moles of $\\text{O}_2$ gas expand isothermally and reversibly from volume $2$ $\\text{dm}^3$ to volume $20$ $\\text{dm}^3$ at $300$ K, the work obtained is $-17.232$ kJ. Calculate the value of $X$.<br>[$R = 8.314$ $\\text{J K}^{-1}\\text{mol}^{-1}$]", "image": null}, "options": [{"id": "QTdrF", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "u7wpv", "label": "B", "text": "$0.5$", "isCorrect": false, "image": null}, {"id": "AfBI9", "label": "C", "text": "$2$", "isCorrect": false, "image": null}, {"id": "vajPm", "label": "D", "text": "$3$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For an isothermal reversible expansion of an ideal gas, the work done is given by the formula:<br><br>$W = -2.303 n R T \\log_{10} \\left( \\dfrac{V_2}{V_1} \\right)$<br><br>Given:<br>$W = -17.232 \\text{ kJ} = -17232 \\text{ J}$<br>$n = X$<br>$R = 8.314 \\text{ J K}^{-1}\\text{mol}^{-1}$<br>$T = 300 \\text{ K}$<br>$V_1 = 2 \\text{ dm}^3$<br>$V_2 = 20 \\text{ dm}^3$<br><br>Substituting the given values into the formula:<br><br>$-17232 = -2.303 \\times X \\times 8.314 \\times 300 \\times \\log_{10} \\left( \\dfrac{20}{2} \\right)$<br><br>$-17232 = -2.303 \\times X \\times 8.314 \\times 300 \\times \\log_{10} (10)$<br><br>$-17232 = -2.303 \\times X \\times 8.314 \\times 300 \\times 1$<br><br>$X = \\dfrac{17232}{2.303 \\times 8.314 \\times 300}$<br><br>$X = \\dfrac{17232}{5744.14}$<br><br>$X = 3$<br><br>Answer: $3$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886215a9fc0fc8c1432c", "type": "singleCorrect", "question": {"text": "$1$ mole of an ideal gas expands isothermally and reversibly from an initial volume of $10$ L to a final volume of $20$ L at $300$K. Calculate the work done in expanding the gas. ( R = $8.314$ J K$^{-1}$ mol$^{-1}$ )", "image": null}, "options": [{"id": "rXx0U", "label": "A", "text": "$-750$ J", "isCorrect": false, "image": null}, {"id": "xut2a", "label": "B", "text": "$-1500$ J", "isCorrect": false, "image": null}, {"id": "THhsV", "label": "C", "text": "$-1729$ J", "isCorrect": true, "image": null}, {"id": "Lqnpd", "label": "D", "text": "$-3456$ J", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For an isothermal reversible expansion of an ideal gas, the work done is given by the formula:<br><br>$W = -2.303 nRT \\log_{10}\\left(\\dfrac{V_2}{V_1}\\right)$<br><br>Given values are:<br>$n = 1$ mol<br>$R = 8.314$ J K$^{-1}$ mol$^{-1}$<br>$T = 300$ K<br>$V_1 = 10$ L<br>$V_2 = 20$ L<br><br>Substituting these values into the formula:<br><br>$W = -2.303 \\times 1 \\times 8.314 \\times 300 \\times \\log_{10}\\left(\\dfrac{20}{10}\\right)$<br><br>$W = -2.303 \\times 2494.2 \\times \\log_{10}(2)$<br><br>Using $\\log_{10}(2) = 0.3010$:<br><br>$W = -2.303 \\times 2494.2 \\times 0.3010$<br><br>$W = -1728.98$ J<br><br>Rounding to the nearest integer, we get $W \\approx -1729$ J.<br><br>Answer: $-1729$ J", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886215a9fc0fc8c1432b", "type": "singleCorrect", "question": {"text": "Calculate the change in internal energy of the system if $40$ kJ of work is done by the system, and it absorbs $20$ kJ of heat", "image": null}, "options": [{"id": "zNzd7", "label": "A", "text": "$-20$ kJ", "isCorrect": true, "image": null}, {"id": "rcB4S", "label": "B", "text": "$20$ kJ", "isCorrect": false, "image": null}, {"id": "x3gaU", "label": "C", "text": "$-60$ kJ", "isCorrect": false, "image": null}, {"id": "cxdMj", "label": "D", "text": "$40$ kJ", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics:<br><br>$\\Delta U = q + W$<br><br>Heat absorbed by the system, $q = +20$ kJ<br><br>Work done by the system, $W = -40$ kJ<br><br>Substituting the values:<br><br>$\\Delta U = 20 - 40 = -20$ kJ<br><br>Answer: $-20$ kJ", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c115a9fc0fc8c146b0", "type": "singleCorrect", "question": {"text": "Calculate the work done, when three moles of an ideal gas expand isothermally from $16\\,dm^3$ to $20\\,dm^3$, at a constant external pressure of $1.5$ bar.", "image": null}, "options": [{"id": "IDQIW", "label": "A", "text": "$600$ J", "isCorrect": false, "image": null}, {"id": "HY6ZB", "label": "B", "text": "$-600$ J", "isCorrect": true, "image": null}, {"id": "Uf6gc", "label": "C", "text": "$-400$ J", "isCorrect": false, "image": null}, {"id": "AOS6j", "label": "D", "text": "$400$ J", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The work done during an irreversible isothermal expansion against a constant external pressure is given by the formula:<br><br>$W = -P_{ext} \\Delta V$<br><br>Given:<br>$P_{ext} = 1.5$ bar<br>$V_1 = 16\\,dm^3$<br>$V_2 = 20\\,dm^3$<br><br>Change in volume, $\\Delta V = V_2 - V_1 = 20 - 16 = 4\\,dm^3$<br><br>Substituting the values into the formula:<br><br>$W = -1.5 \\times 4 = -6$ bar$\\cdot dm^3$<br><br>Since $1$ bar$\\cdot dm^3 = 100$ J, we convert the work done into Joules:<br><br>$W = -6 \\times 100 = -600$ J<br><br>Answer: $-600$ J", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c115a9fc0fc8c146ae", "type": "singleCorrect", "question": {"text": "Which of the following statements is NOT true regarding the isothermal process?", "image": null}, "options": [{"id": "BpGPZ", "label": "A", "text": "Heat is either added or removed from the system.", "isCorrect": false, "image": null}, {"id": "UBDAp", "label": "B", "text": "The temperature of the system remains constant.", "isCorrect": false, "image": null}, {"id": "UVvth", "label": "C", "text": "The internal energy of the system remains constant.", "isCorrect": false, "image": null}, {"id": "wmq6D", "label": "D", "text": "No heat enters or leaves the system.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "In an isothermal process, the temperature of the system remains constant, which implies $\\Delta T = 0$.<br><br>For an ideal gas, the internal energy depends only on temperature, so the internal energy also remains constant, meaning $\\Delta U = 0$.<br><br>According to the first law of thermodynamics, $Q = \\Delta U + W$. Since $\\Delta U = 0$, we get $Q = W$.<br><br>This indicates that heat must be added to or removed from the system to balance the work done by or on the gas, maintaining a constant temperature.<br><br>The statement that no heat enters or leaves the system describes an adiabatic process, not an isothermal process. Therefore, this statement is incorrect regarding an isothermal process.<br><br>Answer: No heat enters or leaves the system.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2aa8c30a4553e1bdb7b", "type": "singleCorrect", "question": {"text": "Calculate the change in internal energy if an ideal gas expands from $0.5\\ \\text{dm}^3$ to $3.5\\ \\text{dm}^3$ at constant pressure 2 bar by absorbing 1800 J heat energy.", "image": null}, "options": [{"id": "ytKVK", "label": "A", "text": "$1200$ J.", "isCorrect": true, "image": null}, {"id": "g1ngb", "label": "B", "text": "$-1200$ J.", "isCorrect": false, "image": null}, {"id": "hfTME", "label": "C", "text": "$2400$ J.", "isCorrect": false, "image": null}, {"id": "foFfh", "label": "D", "text": "$-2400$ J.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $V_1 = 0.5\\ \\text{dm}^3$, $V_2 = 3.5\\ \\text{dm}^3$, $P = 2\\ \\text{bar}$, and heat absorbed $q = 1800\\ \\text{J}$.<br><br>Work done during expansion at constant pressure is given by $W = -P(V_2 - V_1)$.<br><br>$W = -2 \\times (3.5 - 0.5) = -6\\ \\text{bar}\\cdot\\text{dm}^3$<br><br>Since $1\\ \\text{bar}\\cdot\\text{dm}^3 = 100\\ \\text{J}$, we have $W = -600\\ \\text{J}$.<br><br>According to the first law of thermodynamics, $\\Delta U = q + W$.<br><br>Substituting the values, $\\Delta U = 1800 - 600 = 1200\\ \\text{J}$.<br><br>Answer: $1200$ J.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a98c30a4553e1bdb7a", "type": "singleCorrect", "question": {"text": "Which of the following processes exhibits the decrease in internal energy of a system?", "image": null}, "options": [{"id": "HBbG6", "label": "A", "text": "Isothermal expansion of an ideal gas.", "isCorrect": false, "image": null}, {"id": "DDpKo", "label": "B", "text": "Isothrmal compression of an ideal gas.", "isCorrect": false, "image": null}, {"id": "8loXA", "label": "C", "text": "Adiabatic expansion of an ideal gas.", "isCorrect": true, "image": null}, {"id": "knZxJ", "label": "D", "text": "Adiabatic compression of an ideal gas", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics, $\\Delta U = q + w$.<br><br>For an isothermal process, the temperature remains constant ($\\Delta T = 0$). Since the internal energy of an ideal gas depends only on temperature, $\\Delta U = 0$ for both isothermal expansion and compression.<br><br>For an adiabatic process, there is no heat exchange with the surroundings, so $q = 0$. The first law becomes $\\Delta U = w$.<br><br>During adiabatic expansion, work is done by the gas on the surroundings, meaning $w < 0$. Consequently, $\\Delta U < 0$, which indicates a decrease in the internal energy of the system.<br><br>During adiabatic compression, work is done on the gas, meaning $w > 0$, leading to an increase in internal energy.<br><br>Answer: Adiabatic expansion of an ideal gas.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3548c30a4553e1be291", "type": "singleCorrect", "question": {"text": "If $2$ mole of an ideal gas expand isothermally and reversibly at $27^\\circ$C from 1 $\\text{dm}^3$ to $1\\ \\text{m}^3$ calculate work done? $[R = 8.314\\ \\text{J K}^{-1}\\text{mol}^{-1}]$", "image": null}, "options": [{"id": "Avq6T", "label": "A", "text": "$-49.95$ kJ", "isCorrect": false, "image": null}, {"id": "uvlGY", "label": "B", "text": "$-99.90$ kJ", "isCorrect": false, "image": null}, {"id": "wf4dH", "label": "C", "text": "$-34.46$ kJ", "isCorrect": true, "image": null}, {"id": "J7fmq", "label": "D", "text": "$-68.92$ kJ", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given:<br><br>$n = 2\\text{ mol}$<br><br>$T = 27^\\circ\\text{C} = 300\\text{ K}$<br><br>$V_1 = 1\\text{ dm}^3$<br><br>$V_2 = 1\\text{ m}^3 = 1000\\text{ dm}^3$<br><br>$R = 8.314\\text{ J K}^{-1}\\text{mol}^{-1}$<br><br>The work done in a reversible isothermal expansion is given by:<br><br>$W = -2.303 nRT \\log_{10} \\left( \\dfrac{V_2}{V_1} \\right)$<br><br>Substituting the given values:<br><br>$W = -2.303 \\times 2 \\times 8.314 \\times 300 \\times \\log_{10} \\left( \\dfrac{1000}{1} \\right)$<br><br>$W = -2.303 \\times 600 \\times 8.314 \\times 3$<br><br>$W = -34464.8\\text{ J}$<br><br>$W = -34.46\\text{ kJ}$<br><br>Answer: $-34.46$ kJ", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30c8c30a4553e1bdf9e", "type": "singleCorrect", "question": {"text": "Calculate the work done for the following reaction at $27\\,^\\circ\\text{C}$<br>$\\text{C}_2\\text{H}_{4(g)} + \\text{H}_{2(g)} \\longrightarrow \\text{C}_2\\text{H}_{6(g)}$  ($R = 8.314\\,\\text{JK}^{-1}\\text{mol}^{-1}$)", "image": null}, "options": [{"id": "pRQiB", "label": "A", "text": "$2494.2$ J", "isCorrect": true, "image": null}, {"id": "jYAnB", "label": "B", "text": "$124.71$ J", "isCorrect": false, "image": null}, {"id": "u5QZK", "label": "C", "text": "$3741.3$ J", "isCorrect": false, "image": null}, {"id": "CLryc", "label": "D", "text": "$187.07$ J", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction is $\\text{C}_2\\text{H}_{4(g)} + \\text{H}_{2(g)} \\longrightarrow \\text{C}_2\\text{H}_{6(g)}$<br><br>Change in number of moles of gaseous species, $\\Delta n_g = n_p - n_r$<br><br>$\\Delta n_g = 1 - (1 + 1) = -1$<br><br>Work done, $W = -\\Delta n_g RT$<br><br>$W = -(-1) \\times 8.314 \\times (27 + 273)$<br><br>$W = 1 \\times 8.314 \\times 300$<br><br>$W = 2494.2$ J<br><br>Answer: $2494.2$ J", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ff8c30a4553e1bdf0a", "type": "singleCorrect", "question": {"text": "A gas absorbs $120$ J of heat and expands by $300 \\times 10^{-6}\\ \\text{m}^3$ against a constant external pressure of $2 \\times 10^5\\ \\text{Nm}^{-2}$. What will be the change in internal energy of the system ?", "image": null}, "options": [{"id": "tMylH", "label": "A", "text": "$180$ J", "isCorrect": false, "image": null}, {"id": "rarwQ", "label": "B", "text": "$240$ J", "isCorrect": false, "image": null}, {"id": "WstUf", "label": "C", "text": "$120$ J", "isCorrect": false, "image": null}, {"id": "cHnhe", "label": "D", "text": "$60$ J", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Heat absorbed by the gas, $q = +120\\ \\text{J}$<br><br>Work done by the gas during expansion against constant external pressure is given by $W = -P_{\\text{ext}} \\Delta V$<br><br>Substituting the given values:<br><br>$W = -(2 \\times 10^5\\ \\text{Nm}^{-2}) \\times (300 \\times 10^{-6}\\ \\text{m}^3)$<br><br>$W = -60\\ \\text{J}$<br><br>According to the first law of thermodynamics:<br><br>$\\Delta U = q + W$<br><br>$\\Delta U = 120\\ \\text{J} - 60\\ \\text{J} = 60\\ \\text{J}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fe8c30a4553e1bdf02", "type": "singleCorrect", "question": {"text": "An ideal gas expands from initial volume $5\\ \\text{dm}^3$ to $15\\ \\text{dm}^3$ against a constant external pressure of $2$ atm. What is the work done by the gas ?", "image": null}, "options": [{"id": "A8r5Y", "label": "A", "text": "$-1202.6$ J", "isCorrect": false, "image": null}, {"id": "UincY", "label": "B", "text": "$-2026.4$ J", "isCorrect": true, "image": null}, {"id": "wLMaz", "label": "C", "text": "$-1101.32$ J", "isCorrect": false, "image": null}, {"id": "AMIkC", "label": "D", "text": "$-1013.2$ J", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The work done by a gas during expansion against a constant external pressure is given by the formula:<br><br>$W = -P_{\\text{ext}} \\Delta V$<br><br>Given:<br>$P_{\\text{ext}} = 2\\ \\text{atm}$<br>$V_i = 5\\ \\text{dm}^3 = 5\\ \\text{L}$<br>$V_f = 15\\ \\text{dm}^3 = 15\\ \\text{L}$<br><br>Change in volume:<br>$\\Delta V = V_f - V_i = 15 - 5 = 10\\ \\text{L}$<br><br>Substituting the values into the formula:<br>$W = -2\\ \\text{atm} \\times 10\\ \\text{L} = -20\\ \\text{L}\\ \\text{atm}$<br><br>To convert the work done into Joules, use the conversion factor $1\\ \\text{L}\\ \\text{atm} = 101.32\\ \\text{J}$:<br>$W = -20 \\times 101.32\\ \\text{J} = -2026.4\\ \\text{J}$<br><br>Answer: $-2026.4$ J", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f28c30a4553e1bde82", "type": "singleCorrect", "question": {"text": "1 mole of an ideal gas is compressed isothermally and reversibly from initial pressure $x$ kPa to final pressure $2x$ kPa at 300 K. Find the work done $(R = 8.314\\ \\text{J K}^{-1}\\text{mol}^{-1})$", "image": null}, "options": [{"id": "Z6okf", "label": "A", "text": "$1432$ J", "isCorrect": false, "image": null}, {"id": "0d2At", "label": "B", "text": "$1865$ J", "isCorrect": false, "image": null}, {"id": "d0GTd", "label": "C", "text": "$1296$ J", "isCorrect": false, "image": null}, {"id": "IfDl2", "label": "D", "text": "$1729$ J", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For an isothermal reversible process, the work done is given by:<br><br>$W = nRT \\ln\\left(\\dfrac{P_2}{P_1}\\right)$<br><br>Substituting the given values:<br><br>$n = 1$ mol<br><br>$T = 300$ K<br><br>$P_1 = x$ kPa<br><br>$P_2 = 2x$ kPa<br><br>$R = 8.314$ J K$^{-1}$ mol$^{-1}$<br><br>$W = 1 \\times 8.314 \\times 300 \\times \\ln\\left(\\dfrac{2x}{x}\\right)$<br><br>$W = 2494.2 \\times \\ln(2)$<br><br>$W = 2494.2 \\times 0.693$<br><br>$W \\approx 1729$ J<br><br>Answer: $1729$ J", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f18c30a4553e1bde79", "type": "singleCorrect", "question": {"text": "Which of the following is the correct expression of the first law of thermodynamics for adiabatic processes ?", "image": null}, "options": [{"id": "FHz8M", "label": "A", "text": "$W = -Q$", "isCorrect": false, "image": null}, {"id": "uDYjS", "label": "B", "text": "$-\\Delta U = -W$", "isCorrect": true, "image": null}, {"id": "2iDSi", "label": "C", "text": "$\\Delta U = QV$", "isCorrect": false, "image": null}, {"id": "ucTY5", "label": "D", "text": "$\\Delta U = Q_P - P_{\\text{ext}}\\,\\Delta V$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics, the change in internal energy is given by $\\Delta U = Q + W$.<br><br>For an adiabatic process, there is no heat exchange between the system and the surroundings, which means $Q = 0$.<br><br>Substituting $Q = 0$ into the first law equation, we get $\\Delta U = W$.<br><br>Multiplying both sides by $-1$, this can be written as $-\\Delta U = -W$.<br><br>Answer: $-\\Delta U = -W$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3298c30a4553e1be0d5", "type": "singleCorrect", "question": {"text": "Calculate $\\Delta\\text{H}$ for the following reaction at $300\\ \\text{K}$<br>$2\\text{C}_{(s)} + 3\\text{H}_{2(g)} \\longrightarrow \\text{C}_2\\text{H}_{6(g)}$ if $\\Delta\\text{U}$ for the reaction is $-80\\ \\text{kJ}$ ($\\text{R} = 8.314\\ \\text{JK}^{-1}\\text{mol}^{-1}$)", "image": null}, "options": [{"id": "GwCZn", "label": "A", "text": "$-85.00\\ \\text{kJ}$", "isCorrect": true, "image": null}, {"id": "gQJu3", "label": "B", "text": "$-43.00\\ \\text{kJ}$", "isCorrect": false, "image": null}, {"id": "yx4r3", "label": "C", "text": "$-128.00\\ \\text{kJ}$", "isCorrect": false, "image": null}, {"id": "zO5tG", "label": "D", "text": "$-170.00\\ \\text{kJ}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction is $2\\text{C}_{(s)} + 3\\text{H}_{2(g)} \\longrightarrow \\text{C}_2\\text{H}_{6(g)}$<br><br>Change in number of gaseous moles, $\\Delta n_g = n_{p(g)} - n_{r(g)} = 1 - 3 = -2$<br><br>Given $\\Delta\\text{U} = -80\\ \\text{kJ}$<br><br>$T = 300\\ \\text{K}$<br><br>$R = 8.314\\ \\text{J K}^{-1}\\text{mol}^{-1} = 8.314 \\times 10^{-3}\\ \\text{kJ K}^{-1}\\text{mol}^{-1}$<br><br>Using the relation $\\Delta\\text{H} = \\Delta\\text{U} + \\Delta n_g RT$<br><br>$\\Delta\\text{H} = -80 + (-2) \\times 8.314 \\times 10^{-3} \\times 300$<br><br>$\\Delta\\text{H} = -80 - 4.9884$<br><br>$\\Delta\\text{H} = -84.9884\\ \\text{kJ} \\approx -85.00\\ \\text{kJ}$<br><br>Answer: $-85.00\\ \\text{kJ}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3278c30a4553e1be0c1", "type": "singleCorrect", "question": {"text": "Which from following is correct expression of first law of thermodynamics for isothermal process?", "image": null}, "options": [{"id": "zgLtT", "label": "A", "text": "$\\text{W} = -\\text{Q}$", "isCorrect": true, "image": null}, {"id": "biLPD", "label": "B", "text": "$-\\Delta\\text{U} = -\\text{W}$", "isCorrect": false, "image": null}, {"id": "Qf4Fa", "label": "C", "text": "$\\Delta\\text{U} = \\text{Q}_\\text{v}$", "isCorrect": false, "image": null}, {"id": "GlwnT", "label": "D", "text": "$\\text{Q}_\\text{p} = \\Delta\\text{U} + \\text{P}_{\\text{ext}}\\Delta\\text{V}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics, the change in internal energy is given by $\\Delta U = Q + W$.<br><br>For an isothermal process, the temperature of the system remains constant, so $\\Delta T = 0$.<br><br>Since the internal energy of an ideal gas depends only on temperature, the change in internal energy is zero, $\\Delta U = 0$.<br><br>Substituting $\\Delta U = 0$ into the first law equation gives:<br><br>$0 = Q + W$<br><br>$W = -Q$<br><br>Answer: $\\text{W} = -\\text{Q}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3468c30a4553e1be1ff", "type": "singleCorrect", "question": {"text": "Calculate the quantity of heat released from system when 2 moles of and ideal gas compressed isothermally from volume $25 \\text{ dm}^3$ to $10 \\text{ dm}^3$ at constant external pressure 4 bar.", "image": null}, "options": [{"id": "BttSX", "label": "A", "text": "$5 \\cdot 5 \\text{ kJ}$", "isCorrect": false, "image": null}, {"id": "MiKlp", "label": "B", "text": "$5 \\cdot 0 \\text{ kJ}$", "isCorrect": false, "image": null}, {"id": "oU5FT", "label": "C", "text": "$6 \\cdot 5 \\text{ kJ}$", "isCorrect": false, "image": null}, {"id": "McaQw", "label": "D", "text": "$6 \\cdot 0 \\text{ kJ}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For an isothermal process of an ideal gas, the change in internal energy $\\Delta U = 0$.<br><br>From the first law of thermodynamics:<br><br>$\\Delta U = q + w \\Rightarrow q = -w$<br><br>The work done during irreversible compression at a constant external pressure is given by:<br><br>$w = -P_{\\text{ext}} \\Delta V = -P_{\\text{ext}} (V_2 - V_1)$<br><br>Given:<br><br>$P_{\\text{ext}} = 4 \\text{ bar}$<br><br>$V_1 = 25 \\text{ dm}^3$<br><br>$V_2 = 10 \\text{ dm}^3$<br><br>Substituting the values:<br><br>$w = -4 \\times (10 - 25) = 60 \\text{ bar} \\cdot \\text{dm}^3$<br><br>Since $1 \\text{ bar} \\cdot \\text{dm}^3 = 100 \\text{ J}$:<br><br>$w = 60 \\times 100 \\text{ J} = 6000 \\text{ J} = 6.0 \\text{ kJ}$<br><br>Therefore, $q = -6.0 \\text{ kJ}$.<br><br>The quantity of heat released from the system is $6.0 \\text{ kJ}$.<br><br>Answer: $6 \\cdot 0 \\text{ kJ}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c68c30a4553e1bdcad", "type": "singleCorrect", "question": {"text": "A system is provided 50 J of heat and work done on the system is 10 J. What is change in internal energy ?", "image": null}, "options": [{"id": "mLI2O", "label": "A", "text": "$40$ J", "isCorrect": false, "image": null}, {"id": "bZj2X", "label": "B", "text": "$60$ J", "isCorrect": true, "image": null}, {"id": "5Lme4", "label": "C", "text": "$30$ J", "isCorrect": false, "image": null}, {"id": "7pF7V", "label": "D", "text": "$50$ J", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics:<br><br>$\\Delta U = q + w$<br><br>where $q$ is the heat supplied to the system and $w$ is the work done on the system.<br><br>Given:<br><br>$q = +50$ J (heat is provided to the system)<br><br>$w = +10$ J (work is done on the system)<br><br>Substituting the values:<br><br>$\\Delta U = 50 + 10 = 60$ J<br><br>Answer: $60$ J", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d48c30a4553e1bdd3c", "type": "singleCorrect", "question": {"text": "Identify the process that proceeds with no heat exchange between system and surrounding.", "image": null}, "options": [{"id": "JzXqd", "label": "A", "text": "Isothermal", "isCorrect": false, "image": null}, {"id": "xndZF", "label": "B", "text": "Isobaric", "isCorrect": false, "image": null}, {"id": "bakPs", "label": "C", "text": "Isochoric", "isCorrect": false, "image": null}, {"id": "9UDQO", "label": "D", "text": "Adiabatic", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "An adiabatic process is defined as a thermodynamic process in which there is no heat exchange between the system and its surroundings. In this process, $q = 0$.<br><br>An isothermal process occurs at constant temperature ($\\Delta T = 0$).<br><br>An isobaric process occurs at constant pressure ($\\Delta P = 0$).<br><br>An isochoric process occurs at constant volume ($\\Delta V = 0$).<br><br>Answer: Adiabatic", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3358c30a4553e1be157", "type": "singleCorrect", "question": {"text": "In a particular reaction, 4 kJ heat is released by the system and 12 kJ work done on the system. Calculate the $\\Delta H$ and $\\Delta U$.", "image": null}, "options": [{"id": "qnwNn", "label": "A", "text": "$\\Delta H = 4$ kJ and $\\Delta U = 16$ kJ", "isCorrect": false, "image": null}, {"id": "Vk2uV", "label": "B", "text": "$\\Delta H = -4$ kJ and $\\Delta U = 8$ kJ", "isCorrect": true, "image": null}, {"id": "7uNY6", "label": "C", "text": "$\\Delta H = -4$ kJ and $\\Delta U = -16$ kJ", "isCorrect": false, "image": null}, {"id": "elxWR", "label": "D", "text": "$\\Delta H = 4$ kJ and $\\Delta U = -16$ kJ", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Heat released by the system, $q = -4$ kJ.<br><br>Work done on the system, $w = +12$ kJ.<br><br>According to the first law of thermodynamics:<br><br>$\\Delta U = q + w$<br><br>$\\Delta U = -4 + 12 = 8$ kJ.<br><br>For a reaction at constant pressure, the enthalpy change is equal to the heat exchanged:<br><br>$\\Delta H = q_p = -4$ kJ.<br><br>Answer: $\\Delta H = -4$ kJ and $\\Delta U = 8$ kJ", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3358c30a4553e1be156", "type": "singleCorrect", "question": {"text": "Which of the following relations is correct for a reaction $\\text{S}_{(s)} + \\text{O}_{2(g)} \\rightarrow \\text{SO}_{2(g)}$ ?", "image": null}, "options": [{"id": "zCXlN", "label": "A", "text": "$\\Delta H > \\Delta U$", "isCorrect": false, "image": null}, {"id": "muXOS", "label": "B", "text": "$\\Delta H < \\Delta U$", "isCorrect": false, "image": null}, {"id": "KkAgN", "label": "C", "text": "$\\Delta H = 0$", "isCorrect": false, "image": null}, {"id": "QsfV9", "label": "D", "text": "$\\Delta H = \\Delta U$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given reaction is $\\text{S}_{(s)} + \\text{O}_{2(g)} \\rightarrow \\text{SO}_{2(g)}$<br><br>The relationship between enthalpy change ($\\Delta H$) and internal energy change ($\\Delta U$) is given by:<br><br>$\\Delta H = \\Delta U + \\Delta n_g RT$<br><br>where $\\Delta n_g$ is the change in the number of moles of gaseous substances.<br><br>$\\Delta n_g = \\text{moles of gaseous products} - \\text{moles of gaseous reactants}$<br><br>For the given reaction, $\\text{SO}_{2}$ is the only gaseous product and $\\text{O}_{2}$ is the only gaseous reactant. Solid sulfur ($\\text{S}_{(s)}$) is not considered.<br><br>$\\Delta n_g = 1 - 1 = 0$<br><br>Substituting $\\Delta n_g = 0$ into the equation:<br><br>$\\Delta H = \\Delta U + (0)RT$<br><br>$\\Delta H = \\Delta U$<br><br>Answer: $\\Delta H = \\Delta U$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3198c30a4553e1be02c", "type": "singleCorrect", "question": {"text": "$\\text{C}_2\\text{H}_5\\text{OH}(l) + 3\\text{O}_2(g) \\rightarrow 2\\text{CO}_2(g) + 3\\text{H}_2\\text{O}(l)$<br>The value of enthalpy change ($\\Delta H$) for above reaction at $27\\,^\\circ\\text{C}$ is $-1366.5$ kJ $\\text{mol}^{-1}$. Then value of internal energy change for the same reaction at this temperature will be", "image": null}, "options": [{"id": "OZwHa", "label": "A", "text": "$-1369.0$ kJ $\\text{mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "EnNvX", "label": "B", "text": "$-1364.0$ kJ $\\text{mol}^{-1}$", "isCorrect": true, "image": null}, {"id": "A7ya8", "label": "C", "text": "$-1371.5$ kJ $\\text{mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "mnmTt", "label": "D", "text": "$-1361.5$ kJ $\\text{mol}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given chemical equation is:<br><br>$\\text{C}_2\\text{H}_5\\text{OH}(l) + 3\\text{O}_2(g) \\rightarrow 2\\text{CO}_2(g) + 3\\text{H}_2\\text{O}(l)$<br><br>The change in the number of moles of gaseous species, $\\Delta n_g$, is calculated as:<br><br>$\\Delta n_g = n_{p(g)} - n_{r(g)} = 2 - 3 = -1$<br><br>The relationship between enthalpy change ($\\Delta H$) and internal energy change ($\\Delta U$) is given by:<br><br>$\\Delta H = \\Delta U + \\Delta n_g RT$<br><br>Given:<br>$\\Delta H = -1366.5 \\text{ kJ mol}^{-1}$<br>$R = 8.314 \\times 10^{-3} \\text{ kJ K}^{-1} \\text{ mol}^{-1}$<br>$T = 27^\\circ\\text{C} = 300 \\text{ K}$<br><br>Substituting the values into the equation:<br><br>$-1366.5 = \\Delta U + (-1) \\times (8.314 \\times 10^{-3}) \\times 300$<br><br>$-1366.5 = \\Delta U - 2.4942$<br><br>$\\Delta U = -1366.5 + 2.4942 = -1364.0058 \\text{ kJ mol}^{-1}$<br><br>Rounding to one decimal place, we get $-1364.0 \\text{ kJ mol}^{-1}$.<br><br>Answer: $-1364.0$ kJ $\\text{mol}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29c8c30a4553e1bdae5", "type": "singleCorrect", "question": {"text": "A gas expands from a volume of $1$ dm$^3$ to $1.25$ dm$^3$ under a pressure of $1$ bar. Find the change in internal energy if $150$ J of heat is supplied to the system.", "image": null}, "options": [{"id": "nZ3HM", "label": "A", "text": "$125$ J", "isCorrect": true, "image": null}, {"id": "uQxpU", "label": "B", "text": "$175$ J", "isCorrect": false, "image": null}, {"id": "E9YMr", "label": "C", "text": "$-125$ J", "isCorrect": false, "image": null}, {"id": "ivzhJ", "label": "D", "text": "$-175$ J", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $V_1 = 1$ dm$^3$ and $V_2 = 1.25$ dm$^3$.<br><br>Change in volume, $\\Delta V = 1.25 - 1 = 0.25$ dm$^3 = 0.25$ L.<br><br>External pressure, $P = 1$ bar.<br><br>Work done during expansion is given by $W = -P \\Delta V$.<br><br>$W = -1 \\times 0.25 = -0.25$ L bar.<br><br>Since $1$ L bar $= 100$ J, we have $W = -0.25 \\times 100 = -25$ J.<br><br>Heat supplied to the system, $q = 150$ J.<br><br>According to the first law of thermodynamics, $\\Delta U = q + W$.<br><br>$\\Delta U = 150 - 25 = 125$ J.<br><br>Answer: $125$ J", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29c8c30a4553e1bdae4", "type": "singleCorrect", "question": {"text": "In which of the following processes the internal energy of system remain constant?", "image": null}, "options": [{"id": "cuYsX", "label": "A", "text": "Isobaric Process", "isCorrect": false, "image": null}, {"id": "vTe6L", "label": "B", "text": "Isochoric Process", "isCorrect": false, "image": null}, {"id": "BlP1b", "label": "C", "text": "Isothermal Process", "isCorrect": true, "image": null}, {"id": "5MjhB", "label": "D", "text": "Adiabatic Process", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The internal energy of an ideal gas is a function of its temperature only, given by $U = \\dfrac{f}{2} n R T$.<br><br>For the internal energy to remain constant, the change in temperature must be zero ($\\Delta T = 0$).<br><br>A process in which the temperature of the system remains constant is known as an isothermal process.<br><br>Therefore, the internal energy of the system remains constant in an isothermal process.<br><br>Answer: Isothermal Process", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b78c30a4553e1bdc11", "type": "singleCorrect", "question": {"text": "Calculate the work done when $1$ mole of an ideal gas is expanded reversibly and isothermally from initial pressure $10$ bar to final pressure $1$ bar at constant temperature $300$ K. [$R = 8.314 \\text{ J K}^{-1} \\text{ mol}^{-1}$]", "image": null}, "options": [{"id": "2TQ7k", "label": "A", "text": "$-5.744$ kJ", "isCorrect": true, "image": null}, {"id": "gma1m", "label": "B", "text": "$-5.123$ kJ", "isCorrect": false, "image": null}, {"id": "gBjHc", "label": "C", "text": "$-6.514$ kJ", "isCorrect": false, "image": null}, {"id": "e9kP1", "label": "D", "text": "$-4.981$ kJ", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a reversible isothermal expansion of an ideal gas, the work done is given by the formula:<br><br>$W = -2.303 nRT \\log_{10}\\left(\\dfrac{P_1}{P_2}\\right)$<br><br>Given:<br>$n = 1 \\text{ mol}$<br>$R = 8.314 \\text{ J K}^{-1} \\text{ mol}^{-1}$<br>$T = 300 \\text{ K}$<br>$P_1 = 10 \\text{ bar}$<br>$P_2 = 1 \\text{ bar}$<br><br>Substituting the values into the formula:<br><br>$W = -2.303 \\times 1 \\times 8.314 \\times 300 \\times \\log_{10}\\left(\\dfrac{10}{1}\\right)$<br><br>$W = -2.303 \\times 2494.2 \\times 1$<br><br>$W = -5744.14 \\text{ J}$<br><br>$W = -5.744 \\text{ kJ}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b78c30a4553e1bdc10", "type": "singleCorrect", "question": {"text": "Which of the following processes exhibits, $\\Delta U = 0$?", "image": null}, "options": [{"id": "H1ZbZ", "label": "A", "text": "Adiabatic process", "isCorrect": false, "image": null}, {"id": "MfU1U", "label": "B", "text": "Isothermal process", "isCorrect": true, "image": null}, {"id": "EVKIb", "label": "C", "text": "Isobaric process", "isCorrect": false, "image": null}, {"id": "59KAf", "label": "D", "text": "Isochoric process", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The internal energy of an ideal gas is a function of temperature only.<br><br>The change in internal energy is given by $\\Delta U = n C_v \\Delta T$.<br><br>In an isothermal process, the temperature of the system remains constant, which implies $\\Delta T = 0$.<br><br>Substituting $\\Delta T = 0$ yields $\\Delta U = 0$.<br><br>Therefore, an isothermal process exhibits $\\Delta U = 0$.<br><br>Answer: Isothermal process", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bffbf9280d7f9932e56", "type": "singleCor
