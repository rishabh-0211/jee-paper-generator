: "rkZte", "text": "-225 J", "image": null, "isCorrect": false}, {"id": "ODARG", "text": "-985 J", "image": null, "isCorrect": false}, {"id": "n7BEf", "text": "+225 J", "image": null, "isCorrect": true}, {"id": "8zR2Y", "text": "+985 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the first law of thermodynamics:<br><br>$\\Delta U = q + w$<br><br>Heat absorbed by the system, $q = +605$ J<br><br>Work done by the system on the surroundings, $w = -380$ J<br><br>$\\Delta U = 605 - 380 = +225$ J<br><br>Answer: +225 J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262820279619d9d8a351b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Calculate the PV type of work for the following reaction at 1 bar pressure.\n$\\underset{(150 \\mathrm{~mL})}{\\mathrm{C}_3 \\mathrm{H}_{6(\\mathrm{~g})}}+\\underset{(150 \\mathrm{~mL})}{\\mathrm{HCl}_{(\\mathrm{g})}} \\longrightarrow \\underset{(150 \\mathrm{~mL})}{\\mathrm{C}_3 \\mathrm{H}_7 \\mathrm{Cl}_{(\\mathrm{g})}}$", "image": null}, "options": [{"id": "Oc1ox", "text": "$5.2 J$", "image": null, "isCorrect": false}, {"id": "DpoPr", "text": "$10.21 J$", "image": null, "isCorrect": false}, {"id": "XR36B", "text": "$15.00 J$", "image": null, "isCorrect": true}, {"id": "Rx7bz", "text": "$18.2 J$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{W} & =-\\mathrm{P}_{\\text {ext }} \\Delta \\mathrm{V}=-\\mathrm{P}_{\\text {ext }}\\left(\\mathrm{V}_2-\\mathrm{V}_1\\right) \\\\ \\mathrm{V}_1 & =150+150=300 \\mathrm{~mL}=0.3 \\mathrm{dm}^3 \\\\ \\mathrm{~V}_2 & =150 \\mathrm{~mL}=0.15 \\mathrm{dm}^3 \\\\ \\mathrm{P}_{\\text {ext }} & =1 \\mathrm{bar} \\\\ \\mathrm{W} & =-1(0.15-0.3) \\\\ & =0.15 \\mathrm{dm}^3 \\text { bar } \\\\ & =15.0 \\mathrm{~J} \\quad\\left(\\because 100 \\mathrm{~J}=1 \\mathrm{dm}^3 \\text { bar }\\right)\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262800279619d9d8a3507", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Which from following thermodynamic properties is a path function?", "image": null}, "options": [{"id": "aozCm", "text": "Internal energy", "image": null, "isCorrect": false}, {"id": "C4tn4", "text": "Work", "image": null, "isCorrect": true}, {"id": "vldKB", "text": "Entropy", "image": null, "isCorrect": false}, {"id": "GHSyq", "text": "Enthalpy", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12|Ch-12|Subtopic-4.2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626e0279619d9d8a347a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Identify false statement regarding isothermal process from following.", "image": null}, "options": [{"id": "Vtlxd", "text": "System can exchange heat energy with the surrounding.", "image": null, "isCorrect": false}, {"id": "mOBby", "text": "Enthalpy of system remains constant.", "image": null, "isCorrect": true}, {"id": "Bs9Fv", "text": "Temperature of systems remains constant", "image": null, "isCorrect": false}, {"id": "kJL5M", "text": "Internal energy of system remains constant", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std. $12 \\mid$ Ch-4 | Subtopic-4.2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626d0279619d9d8a3473", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Calculate $\\Delta \\mathrm{H}$ for following reaction, at $25^{\\circ} \\mathrm{C}$.\nCalculate $\\Delta \\mathrm{H}$ for following reaction, at $25^{\\circ} \\mathrm{C}$.\n$$\n\\begin{aligned}\n& \\mathrm{NH}_2 \\mathrm{CN}_{(\\mathrm{g})}+\\frac{3}{2} \\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{N}_{2(\\mathrm{~g})}+\\mathrm{CO}_{2(\\mathrm{~g})}+\\mathrm{H}_2 \\mathrm{O}_{(l)} \\\\\n& \\left(\\Delta \\mathrm{U}=-740.5 \\mathrm{~kJ}, \\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right)\n\\end{aligned}\n$$", "image": null}, "options": [{"id": "PwQd1", "text": "$-708.4 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "qbLns", "text": "$-789.4 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "c4PW8", "text": "$-741.7 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "kb1k8", "text": "$-863.9 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\Delta \\mathrm{n}_{\\mathrm{g}}=2-\\frac{3}{2}=\\frac{1}{2} \\mathrm{~mol} \\\\\n& \\begin{aligned}\n\\mathrm{R} & =8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^1 \\\\\n& =8.314 \\times 10^{-3} \\mathrm{~kJ} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\n\\end{aligned}\n\\end{aligned}\n$$\n\nNow, using formula,\n$$\n\\begin{aligned}\n\\Delta \\mathrm{H}= & \\Delta \\mathrm{U}+\\Delta \\mathrm{n}_{\\mathrm{g}} \\mathrm{RT} \\\\\n=-740.5 \\mathrm{~kJ}+ & \\left(\\frac{1}{2} \\mathrm{~mol}\\right) \\times 8.314 \\\\\n& \\times 10^{-3} \\mathrm{~kJ} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1} \\times 298 \\mathrm{~K}\n\\end{aligned}\n$$\n$\\begin{aligned} & =-740.5 \\mathrm{~kJ}+1.2388 \\mathrm{~kJ} \\\\ & =-739.26 \\mathrm{~kJ} \\mathrm{~mol}^{-1} \\\\ & \\approx-741.7 \\mathrm{~kJ} \\mathrm{~mol}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625d0279619d9d8a33ee", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "An ideal gas absorbs $210 \\mathrm{~J}$ of heat and undergoes expansion from $3 \\mathrm{~L}$ to $6 \\mathrm{~L}$ against a constant external pressure of $10^5 \\mathrm{~Pa}$. What is the value of $\\Delta \\mathrm{U}$ ?", "image": null}, "options": [{"id": "E9FmD", "text": "$310 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "aAGza", "text": "$-90 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "t77aF", "text": "$-210 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "HpiIU", "text": "$190 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$1 \\mathrm{~Pa}=1 \\times 10^{-5}$ bar\n$\\therefore \\quad 10^5 \\mathrm{~Pa}=1 \\mathrm{bar}$\n$\\mathrm{W}=-\\mathrm{P}_{\\mathrm{ext}} \\times \\Delta \\mathrm{V}=-1 \\times(6-3)=-3 \\mathrm{dm}^3$ bar\n$1 \\mathrm{dm}^3 \\mathrm{bar}=100 \\mathrm{~J}$\n$\\therefore \\quad \\mathrm{W}=-300 \\mathrm{~J}$\n$\\mathrm{Q}=+210 \\mathrm{~J}$\nAccording to first law of thermodynamics,\n$\\Delta \\mathrm{U}=\\mathrm{Q}+\\mathrm{W}$\n$\\therefore \\quad \\Delta U=+210 \\mathrm{~J}+(-300 \\mathrm{~J})=-90 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625c0279619d9d8a33e4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Two moles of an ideal gas expand freely and isothermally from $5 \\mathrm{dm}^3$ to $50 \\mathrm{dm}^3$. What is the value of $\\Delta \\mathrm{H}$ ?", "image": null}, "options": [{"id": "bKKQh", "text": "Zero kJ", "image": null, "isCorrect": true}, {"id": "iwtYk", "text": "$20 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "pHfkx", "text": "$100 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "6shxS", "text": "$150 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A free expansion means expansion against zero opposing force. $\\mathrm{P}_{\\mathrm{ext}}=0$ and hence, $\\mathrm{W}=0$\nFor isothermal process, $\\Delta \\mathrm{U}=0$.\n$\\Delta \\mathrm{H}=\\Delta \\mathrm{U}+\\mathrm{P} \\Delta \\mathrm{V}=\\Delta \\mathrm{U}-\\mathrm{W}$\n$\\Delta \\mathrm{H}=0-0=0 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262490279619d9d8a3350", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Calculate the work done in the following reaction at $300 \\mathrm{~K}$ and at constant pressure.\n$$\n\\begin{aligned}\n& \\left(\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right) \\\\\n& 4 \\mathrm{HCl}_{(\\mathrm{g})}+\\mathrm{O}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{Cl}_{2(\\mathrm{~g})}+2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}\n\\end{aligned}\n$$", "image": null}, "options": [{"id": "fovCC", "text": "$-7482 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "hrHJC", "text": "$-4988 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "U5QGo", "text": "$2494 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "t1RKs", "text": "$3200 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{W} & =-\\Delta \\mathrm{n}_{\\mathrm{g}} \\mathrm{RT} \\\\ & =-(4-5) \\times 8.314 \\times 300 \\\\ & =1 \\times 8.314 \\times 300 \\\\ & =2494.2 \\mathrm{~J}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262480279619d9d8a3347", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "One mole of an ideal gas performs $900 \\mathrm{~J}$ of work on surrounding. If internal energy increases by $625 \\mathrm{~J}$, find the value of $\\Delta \\mathrm{H}$.", "image": null}, "options": [{"id": "7fF2Y", "text": "$-275 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "EESRt", "text": "$200 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "OHJ6K", "text": "$-150 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "pMJug", "text": "$1525 \\mathrm{~J}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\mathrm{W}=-900 \\mathrm{~J}, \\Delta \\mathrm{U}=+625 \\mathrm{~J} \\\\ & \\text { Assuming constant pressure, } \\\\ & \\Delta \\mathrm{H}=\\Delta \\mathrm{U}+\\mathrm{P}_{\\mathrm{ext}} \\Delta \\mathrm{V} \\\\ \\therefore \\quad & \\Delta \\mathrm{H}=\\Delta \\mathrm{U}-\\mathrm{W} \\\\ \\therefore \\quad & \\Delta \\mathrm{H}=+625-(-900)=1525 \\mathrm{~J}\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262470279619d9d8a333a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Which of the following processes exhibits increase in internal energy?", "image": null}, "options": [{"id": "L48hU", "text": "Adiabatic compression of gas.", "image": null, "isCorrect": true}, {"id": "MZStZ", "text": "Adiabatic expansion of gas.", "image": null, "isCorrect": false}, {"id": "aLas5", "text": "Isothermal expansion of gas.", "image": null, "isCorrect": false}, {"id": "Dq2IZ", "text": "Isothermal compression of gas.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In adiabatic process, there is no exchange of heat between system and its surroundings. So, $-\\Delta \\mathrm{U}=-\\mathrm{W}$ or $\\Delta \\mathrm{U}=\\mathrm{W}$ During compression work is done on the system by the surroundings. Therefore, $\\mathrm{W}$ is positive. Thus, the internal energy would increase during the adiabatic compression of a gas.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262370279619d9d8a32be", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Equal masses in grams of $\\mathrm{H}_2, \\mathrm{~N}_2, \\mathrm{Cl}_2$, and $\\mathrm{O}_2$, are enclosed in cylinders separately. If these gases expand isothermally and reversibly by $10 \\mathrm{dm}^3$ at $300 \\mathrm{~K}$, the work done by gas is maximum for", "image": null}, "options": [{"id": "C0KQ2", "text": "$\\mathrm{H}_2$", "image": null, "isCorrect": true}, {"id": "ybh9X", "text": "$\\mathrm{N}_2$", "image": null, "isCorrect": false}, {"id": "X8wE1", "text": "$\\mathrm{Cl}_2$", "image": null, "isCorrect": false}, {"id": "o9mey", "text": "$\\mathrm{O}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{W}_{\\max }=-2.303 \\mathrm{nRT} \\log _{10} \\frac{\\mathrm{V}_2}{\\mathrm{~V}_1}\n$$\n\nHence, $\\mathrm{W}_{\\max } \\infty \\mathrm{n}$ (Given: R, T, $\\mathrm{V}_2, \\mathrm{~V}_1=$ Constant)\n$\\therefore \\quad \\mathrm{W}_{\\max } \\propto \\frac{1}{\\mathrm{M} . \\mathrm{W} .}$ (Given: equal mass)\nHence, lower the molecular mass, greater is the work done. Among the given, $\\mathrm{H}_2$ has the lowest molecular mass.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262340279619d9d8a32a2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "A gas absorbs $150 \\mathrm{~J}$ heat and expands by $300 \\mathrm{~cm}^3$ against a constant external pressure $2 \\times 10^5 \\mathrm{~N} \\mathrm{~m}^{-2}$, What is $\\Delta \\mathrm{U}$ of the system?", "image": null}, "options": [{"id": "1dwIJ", "text": "$210 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "VN8Br", "text": "$90 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "dqcBw", "text": "$450 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "LgfsH", "text": "$-300 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{array}{rl}\n300 \\mathrm{~cm}^3=300 \\times 10^{-6} \\mathrm{~m}^3 & \\mathrm{~W} \\\\\n& =-\\mathrm{P}_{\\text {ext }} \\Delta \\mathrm{V} \\\\\n& =-2 \\times 10^5 \\mathrm{~N} \\mathrm{~m}^{-2} \\times\\left(300 \\times 10^{-6} \\mathrm{~m}^3\\right) \\\\\n& =-60 \\mathrm{~N} \\mathrm{~m} \\\\\n& =-60 \\mathrm{~J} \\\\\n\\therefore \\quad \\mathrm{W} & =-60 \\mathrm{~J}\n\\end{array}\n$$\n\nNow,\n$$\n\\begin{aligned}\n\\therefore \\quad \\Delta \\mathrm{U} & =\\mathrm{q}+\\mathrm{P}_{\\text {ext }} \\Delta \\mathrm{V} \\\\\n& =150 \\mathrm{~J}+(-60 \\mathrm{~J}) \\\\\n& =90 \\mathrm{~J}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262330279619d9d8a329c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Which among the following is NOT the feature of reversible process?", "image": null}, "options": [{"id": "28GvY", "text": "The driving and opposing forces differ by large amount.", "image": null, "isCorrect": true}, {"id": "wPwrR", "text": "The process can be reversed by infinitesimal change in pressure.", "image": null, "isCorrect": false}, {"id": "hNlME", "text": "A reversible process proceeds very slowly.", "image": null, "isCorrect": false}, {"id": "5vT7C", "text": "The system attains mechanical equilibrium at the end of every step.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12 | Ch-4 | Subtopic-4.2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262220279619d9d8a3211", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "For reaction, $\\mathrm{CO}_{(\\mathrm{g})}+\\frac{1}{2} \\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{CO}_{2(\\mathrm{~g})}$ Which of the following equations is CORRECT at constant $T$ and $P$ ?", "image": null}, "options": [{"id": "EMP8X", "text": "$\\Delta \\mathrm{H} < \\Delta \\mathrm{U}$", "image": null, "isCorrect": true}, {"id": "28rqm", "text": "$\\Delta \\mathrm{H}>\\Delta \\mathrm{U}$", "image": null, "isCorrect": false}, {"id": "uzbYE", "text": "$\\Delta \\mathrm{H}=\\Delta \\mathrm{U}$", "image": null, "isCorrect": false}, {"id": "7snXK", "text": "$\\Delta \\mathrm{H}^{\\prime}=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\Delta \\mathrm{H}=\\Delta \\mathrm{U}+\\Delta \\mathrm{n}_{\\mathrm{g}} \\mathrm{RT} \\\\ & \\Delta \\mathrm{n}_{\\mathrm{g}}=1-(1+0.5)=-0.5 \\\\ & \\Delta \\mathrm{H}=\\Delta \\mathrm{U}-0.5 \\\\ & \\Rightarrow \\Delta \\mathrm{H} < \\Delta \\mathrm{U}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262120279619d9d8a3193", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "What is the work done during oxidation of 4 moles of $\\mathrm{SO}_{2(\\mathrm{~g})}$ to $\\mathrm{SO}_{3(\\mathrm{~g})}$ at $27^{\\circ} \\mathrm{C}$ ? $\\left(\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right)$", "image": null}, "options": [{"id": "E6nkn", "text": "$1.780 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "exZ5a", "text": "$-1.125 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "y67Bi", "text": "$3.234 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "TV7Ez", "text": "$-4.988 \\mathrm{~kJ}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For oxidation of 4 moles of $\\mathrm{SO}_2$, the reaction is given as follows:\n$\\begin{aligned}\n& 4 \\mathrm{SO}_{2(\\mathrm{~g})}+2 \\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow 4 \\mathrm{SO}_{3(\\mathrm{~g})} \\\\\n& \\Delta \\mathrm{n}_{\\mathrm{g}}=\\text { (moles of product gases) }\n\\\\& \\text { - (moles of reactant gases) } \\\\\n& \\Delta \\mathrm{n}_{\\mathrm{g}}=4-6=-2 \\mathrm{~mol} \\\\\n& \\mathrm{~W}=-\\Delta \\mathrm{n}_{\\mathrm{g}} \\mathrm{RT} \\\\\n& =-(-2 \\mathrm{~mol}) \\times 8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1} \\times 300 \\mathrm{~K} \\\\\n& =+4988.4 \\mathrm{~J} \\\\\n& =+4.988 \\mathrm{~kJ} \\\\\n&\n\\end{aligned}$\n[Note: For the given question, none of the provided options is the correct answer.]", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262000279619d9d8a3105", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "What is value of PV type of work for following reaction at 1 bar?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/cZaYEeg_oJ2yffxTTXj010eWkUZp6Z0PN5LfyljtS5k.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "NxHG0", "text": "$3.5 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "GVh5H", "text": "$4.5 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "X9Rt5", "text": "$9.0 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "6l75n", "text": "$15 \\mathrm{~J}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& 1 \\text { mole of } \\mathrm{C}_2 \\mathrm{H}_4 \\text { reacts with } 1 \\text { mole of } \\mathrm{HCl} \\text { to } \\\\\n& \\text { produce } 1 \\mathrm{~mole} \\text { of } \\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{Cl} \\text {. } \\\\\n& \\text { Hence, } 150 \\mathrm{~mL} \\text { of } \\mathrm{HCl} \\text { would react with only } \\\\\n& 150 \\mathrm{~mL} \\text { of } \\mathrm{C}_2 \\mathrm{H}_4 \\text { to produce } 150 \\mathrm{~mL} \\text { of } \\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{Cl} . \\\\\n& \\mathrm{V}_1=150 \\mathrm{~mL}+150 \\mathrm{~mL}=300 \\mathrm{~mL}=0.3 \\mathrm{dm}^3 \\\\\n& \\mathrm{~V}_2=150 \\mathrm{~mL}=0.15 \\mathrm{dm}^3 \\\\\n& \\mathrm{~W}=-\\mathrm{P}_{\\text {ext }} \\Delta \\mathrm{V}=-\\mathrm{P}_{\\text {ext }}\\left(\\mathrm{V}_2-\\mathrm{V}_1\\right) \\\\\n& \\therefore \\quad \\mathrm{W}=-1 \\text { bar }\\left(0.15 \\mathrm{dm}^3-0.3 \\mathrm{dm}^3\\right) \\\\\n& \\therefore \\quad \\mathrm{W}=0.15 \\mathrm{dm}^3 \\text { bar } \\\\\n& \\therefore \\quad W=0.15 \\mathrm{dm}^3 \\text { bar } \\times 100 \\frac{\\mathrm{J}}{\\mathrm{dm}^3 \\text { bar }} \\\\\n& \\therefore \\quad W=15 \\mathrm{~J}\n\\end{aligned}\n$$\n\nThe PV work in joules is $15 \\mathrm{~J}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fc0279619d9d8a30e3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Which among the following is TRUE for isobaric process?", "image": null}, "options": [{"id": "HFLY1", "text": "$\\Delta \\mathrm{U}=0$", "image": null, "isCorrect": false}, {"id": "JUQzK", "text": "$-\\Delta \\mathrm{U}=-\\mathrm{W}$", "image": null, "isCorrect": false}, {"id": "s5BZf", "text": "$\\Delta \\mathrm{U}=\\mathrm{Q}$", "image": null, "isCorrect": false}, {"id": "QAgJI", "text": "$\\mathrm{Q}_{\\mathrm{P}}=\\Delta \\mathrm{U}+\\mathrm{P}_{\\mathrm{ext}} \\Delta \\mathrm{V}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When chemical reactions are carried out in the open containers under constant atmospheric pressure (isobaric process), $\\Delta \\mathrm{V} \\neq 0$.\n$$\n\\mathrm{W}=-\\mathrm{P}_{\\mathrm{ext}} \\Delta \\mathrm{V}\n$$\n\nThe mathematical expression of first law of thermodynamics is $\\Delta \\mathrm{U}=\\mathrm{Q}+\\mathrm{W}$.\n$$\n\\begin{array}{ll}\n\\therefore & \\Delta U=Q_P-P_{\\text {ext }} \\Delta V \\\\\n\\therefore & Q_P=\\Delta U+P_{\\text {ext }} \\Delta V\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fc0279619d9d8a30e1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "What is the value of increase in internal energy when system does $8 \\mathrm{~J}$ of work on surrounding by supplying $40 \\mathrm{~J}$ of heat to it?", "image": null}, "options": [{"id": "L51eY", "text": "$23 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "Qx2yM", "text": "$32 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "f4q5e", "text": "$40 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "9zNA6", "text": "$48 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Heat $(Q)=+40 \\mathrm{~J}$\nWork $(W)=-8 \\mathrm{~J}$\nAccording to first law of thermodynamics,\n$$\n\\begin{aligned}\n& \\Delta \\mathrm{U}=\\mathrm{Q}+\\mathrm{W} \\\\\n& \\Delta \\mathrm{U}=(+40-8) \\mathrm{J} \\quad \\therefore \\quad \\Delta \\mathrm{U}=+32 \\mathrm{~J}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e80279619d9d8a3044", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "A gas absorbs $200 \\mathrm{~J}$ heat and expands by $500 \\mathrm{~cm}^3$ against a constant external pressure $2 \\times 10^5 \\mathrm{~N} \\mathrm{~m}^{-2}$. What is the change in internal energy?", "image": null}, "options": [{"id": "TO7CU", "text": "$800 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "KrC6y", "text": "$-750 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "C9F8t", "text": "$100 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "ULxL4", "text": "$-150 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\Delta V=500 \\mathrm{~cm}^3=0.5 \\mathrm{dm}^3 \\\\ & \\mathrm{P}_{\\mathrm{ext}}=2 \\times 10^5 \\mathrm{~N} \\mathrm{~m}^{-2}=2 \\text { bar } \\\\ & \\text { (since, } 1 \\times 10^5 \\mathrm{~N} \\mathrm{~m}^{-2}=1 \\text { bar) } \\\\ & \\mathrm{W}=-\\mathrm{P}_{\\mathrm{ext}} \\times \\Delta \\mathrm{V} \\\\ & =-2 \\times(0.5) \\\\ & =-1 \\mathrm{dm}^3 \\text { bar } \\\\ & \\therefore \\quad \\mathrm{W}=-100 \\mathrm{~J} \\quad\\left(\\text { since, } 1 \\mathrm{dm}^3 \\mathrm{bar}=100 \\mathrm{~J}\\right) \\\\ & \\text { According to first law of thermodynamics, } \\\\ & \\Delta U=Q+W=200 \\mathrm{~J}-100 \\mathrm{~J}=+100 \\mathrm{~J} \\\\ & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d90279619d9d8a2fd5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "Calculate the final volume when 2 moles of an ideal gas expand from $3 \\mathrm{dm}^3$ at constant external pressure 1.6 bar and the work done in the process is $800 \\mathrm{~J}$.", "image": null}, "options": [{"id": "QPHWw", "text": "$2.66 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "sdesU", "text": "$4.8 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "XBu4J", "text": "$5.0 \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "bRrPp", "text": "$8.0 \\mathrm{dm}^3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{W}=-\\mathrm{P}_{\\text {ext }} \\Delta \\mathrm{V}=-\\mathrm{P}_{\\text {ext }}\\left(\\mathrm{V}_2-\\mathrm{V}_1\\right) \\\\ & \\mathrm{V}_1=3 \\mathrm{dm}^3 \\\\ & \\mathrm{~V}_2=? \\\\ & \\mathrm{P}_{\\text {ext }}=1.6 \\text { bar } \\\\ & \\mathrm{W}=-800 \\mathrm{~J}=8 \\mathrm{dm}^3 \\text { bar }\\left(\\because 100 \\mathrm{~J}=1 \\mathrm{dm}^3 \\text { bar }\\right) \\\\ & -8=-1.6\\left(\\mathrm{~V}_2-3\\right) \\\\ & \\mathrm{V}_2-3=5 \\\\ & \\mathrm{~V}_2=8 \\mathrm{dm}^3\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d90279619d9d8a2fd0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "What is change in internal energy when system releases $8 \\mathrm{~kJ}$ of heat and performs $660 \\mathrm{~J}$ of work on the surrounding?", "image": null}, "options": [{"id": "UFmQR", "text": "$-7340 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "kVBRE", "text": "$-5400 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "jKYn1", "text": "$-8660 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "ZTV5A", "text": "$-1212 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\Delta \\mathrm{U}=\\mathrm{Q}+\\mathrm{W}=-8000 \\mathrm{~J}-660 \\mathrm{~J}=-8660 \\mathrm{~J}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d60279619d9d8a2fba", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "The difference between $\\Delta \\mathrm{H}$ and $\\Delta \\mathrm{U}$ is usually significant for systems consisting of:", "image": null}, "options": [{"id": "U7vrr", "text": "only solids", "image": null, "isCorrect": false}, {"id": "dFMvQ", "text": "only gases", "image": null, "isCorrect": true}, {"id": "9e3VY", "text": "only liquids", "image": null, "isCorrect": false}, {"id": "hTtsC", "text": "both solids and liquids", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12|Ch-4|Subopic-4.8", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c50279619d9d8a2f38", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "An ideal gas expands by $1.5 \\mathrm{~L}$ against a constant external pressure of $2 \\mathrm{~atm}$ at $298 \\mathrm{~K}$. Calculate the work done?", "image": null}, "options": [{"id": "IBWdT", "text": "$\\quad-75 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "EplGw", "text": "$\\quad-303.9 \\mathrm{~J}$", "image": null, "isCorrect": true}, {"id": "86e6J", "text": "$13.3 \\mathrm{~J}$", "image": null, "isCorrect": false}, {"id": "tYLtn", "text": "$-30 \\mathrm{~J}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n\\mathrm{W} & =-\\mathrm{P}_{\\text {ext }} \\Delta \\mathrm{V} \\\\\n& =-2 \\mathrm{~atm} \\times(1.5 \\mathrm{~L}) \\\\\n& =-3 \\mathrm{~atm} \\mathrm{~L} \\times 1.01325=-3.0398 \\mathrm{dm}^3 \\mathrm{bar}\n\\end{aligned}$\nNow, $1 \\mathrm{dm}^3$ bar $=100 \\mathrm{~J}$\n$\\text { Hence, } \\begin{aligned}\n-3.0398 \\mathrm{dm}^3 \\text { bar } \\times \\frac{100 \\mathrm{~J}}{1 \\mathrm{dm}^3 \\mathrm{bar}} & =-303.98 \\mathrm{~J} \\\\\n& \\cong-303.9 \\mathrm{~J}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c30279619d9d8a2f23", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "What is the value of $\\Delta \\mathrm{H}-\\Delta \\mathrm{U}$ for the following reaction?\n$2 \\mathrm{C}_{(\\mathrm{s})}+3 \\mathrm{H}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{C}_2 \\mathrm{H}_{6(\\mathrm{~g})}$", "image": null}, "options": [{"id": "pgLzq", "text": "$4 \\mathrm{RT}$", "image": null, "isCorrect": false}, {"id": "yV3Dj", "text": "$-5 \\mathrm{RT}$", "image": null, "isCorrect": false}, {"id": "Yc1ld", "text": "$\\mathrm{RT}$", "image": null, "isCorrect": false}, {"id": "hS12o", "text": "$-2 \\mathrm{RT}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\Delta \\mathrm{n}_{\\mathrm{g}}=\\text { (moles of product gases) } \\\\ & \\Delta \\mathrm{n}_{\\mathrm{g}}=1-3=-2 \\mathrm{~mol} \\\\ & \\text { Now, using formula, } \\\\ & \\Delta \\mathrm{H}=\\Delta \\mathrm{U}+\\Delta \\mathrm{n}_{\\mathrm{g}} \\mathrm{RT} \\\\ \\therefore \\quad & \\Delta \\mathrm{H}=\\Delta \\mathrm{U}-2 \\mathrm{RT} \\\\ \\therefore \\quad & \\Delta \\mathrm{H}-\\Delta \\mathrm{U}=-2 \\mathrm{RT}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261af0279619d9d8a2e87", "  "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "An ideal gas is allowed to expand from $2 \\mathrm{dm}^3$ to $6 \\times 10^{-3} \\mathrm{~m}^3$ against a constant external pressure of 1 bar. The work done in $\\mathrm{kJ}$ is", "image": null}, "options": [{"id": "HQHLL", "text": "-6.0 kJ", "image": null, "isCorrect": false}, {"id": "gyHwL", "text": "-0.4 kJ", "image": null, "isCorrect": true}, {"id": "dFspR", "text": "-4.0 kJ", "image": null, "isCorrect": false}, {"id": "PFfiZ", "text": "-2 kJ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{W} & =-\\mathrm{P}\\left(\\mathrm{V}_2-\\mathrm{V}_1\\right) \\\\ & =-\\left(6 \\times 10^{-3}-2 \\times 10^{-3}\\right) \\mathrm{bar}-\\mathrm{m}^3 \\\\ & =-4 \\times 10^{-3} \\times 10^5 \\frac{\\mathrm{N}}{\\mathrm{m}^2}-\\mathrm{m}^3 \\\\ & =-400 \\mathrm{~J}=-0.4 \\mathrm{KJ}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2619d0279619d9d8a2dfa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "If a system absorbs $30 \\mathrm{~kJ}$ of heat and perform $12 \\mathrm{~kJ}$ of work on the surrounding. What is the increase in internal energy of the system?", "image": null}, "options": [{"id": "bH3jk", "text": "18 kJ", "image": null, "isCorrect": true}, {"id": "TFC3K", "text": "2.5 kJ", "image": null,
