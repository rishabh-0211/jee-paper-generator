"MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260990279619d9d8a25cc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "Which from the following is the correct relationship between standard Gibbs energy change and standard cell potential?", "image": null}, "options": [{"id": "bA8pl", "text": "$-\\Delta \\mathrm{G}^{\\circ}=-\\mathrm{nFE}_{\\text {cell }}^0$", "image": null, "isCorrect": false}, {"id": "YTqlw", "text": "$\\Delta \\mathrm{G}^{\\circ}=\\frac{\\mathrm{E}_{\\mathrm{cel} 1}^{\\circ}}{\\mathrm{nF}}$", "image": null, "isCorrect": false}, {"id": "vExbP", "text": "$\\mathrm{E}_{\\text {cel1 }}^0=\\Delta \\mathrm{G}^{\\circ} \\times \\mathrm{nF}$", "image": null, "isCorrect": false}, {"id": "4W5aZ", "text": "$\\Delta \\mathrm{G}^{\\circ}=-\\mathrm{nFE}_{\\text {cell }}^{\\circ}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Relationship between standard gibbs energy change and standard cell potential is,\n$$\n\\Delta \\mathrm{G}^{\\circ}=-\\mathrm{nFE}_{\\text {cell }}^{\\circ}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260890279619d9d8a254b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "Pure dihydrogen (99.5\\%) is obtained by the electrolysis of", "image": null}, "options": [{"id": "4JVdP", "text": "$\\mathrm{NaOH}_{(\\mathrm{aq})}$ using $\\mathrm{Zn}$ electrode", "image": null, "isCorrect": false}, {"id": "Uko93", "text": "pure water", "image": null, "isCorrect": false}, {"id": "UTi1z", "text": "dil. $\\mathrm{H}_2 \\mathrm{SO}_4$ using cadmium electrodes", "image": null, "isCorrect": false}, {"id": "TD9X2", "text": "warm barium hydroxide using $\\mathrm{Ni}$ electrodes", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "- In the laboratory, high purity compounds can be obtained only with electrolysis.\n- $\\quad$ Similarly, highly purified dihydrogen is also obtained by electrolyzing water using a small amount of acid or base.\n- Here, $\\mathrm{Ba}(\\mathrm{OH})_2$ is a base. Hence, electrolyzing water in the presence of a base $\\mathrm{Ba}(\\mathrm{OH})_2$ gives us the highly purified (> $99.95 \\%$ ) Dihydrogen $\\left(\\mathrm{H}_2\\right)$ using Ni electrodes.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260860279619d9d8a2536", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "How many Faraday of electricity is required to deposit $0.8 \\mathrm{~g}$ of calcium at cathode by the electrolysis of $\\mathrm{CaCl}_2$ ?", "image": null}, "options": [{"id": "Xn2dK", "text": "$4 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "CAYtg", "text": "$0.04 \\mathrm{~F}$", "image": null, "isCorrect": true}, {"id": "IZJGd", "text": "$2.5 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "Mn4re", "text": "$2 \\mathrm{~F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{Ca}^{2+} \\longrightarrow \\mathrm{Ca}_{(\\mathrm{s})} \\\\\n& \\qquad \\mathrm{nf}=2 \\\\\n& \\text { moles of calcium }=\\frac{0.8}{40}=2 \\times 10^{-2} \\\\\n& \\text { no. of equivalents of calcium } \\\\\n& =\\text { moles } \\times \\mathrm{nf} \\\\\n& =2 \\times 10^{-2} \\times 2 \\\\\n& =4 \\times 10^{-2}=0.04\n\\end{aligned}\n$$\nTo deposit 1 equivalent of electrolyte 1 Faraday electricity is required.\n\nTo deposit 0.04 equivalents of electrolyte, $0.04 \\mathrm{~F}$ electricity is required.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260600279619d9d8a23fb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "What is the number of moles of electrons passed when current of 5 ampere is passed through a solution of $\\mathrm{FeCl}_3$ for 20 minutes?", "image": null}, "options": [{"id": "JLlwW", "text": "$6.25 \\times 10^{-2}$", "image": null, "isCorrect": true}, {"id": "HO4yE", "text": "$1.56 \\times 10^{-2}$", "image": null, "isCorrect": false}, {"id": "WoJmK", "text": "$3.12 \\times 10^{-2}$", "image": null, "isCorrect": false}, {"id": "1aFVP", "text": "$4.25 \\times 10^{-2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& Q=I . t \\\\\n& =5 \\times 20 \\times 60 \\\\\n& =6000 \\mathrm{C}\n\\end{aligned}\n$$\nCharge of 1 mole electrons $=96500 \\mathrm{C}$\nno. of moles of electrons $=\\frac{\\mathrm{Q}}{96500}=\\frac{6000}{96500} \\simeq 6.25 \\times 10^{-2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604f0279619d9d8a2371", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "What is the number of electrons passed through an electrolyte solution when 1 ampere current is passed for 16.1 minutes?", "image": null}, "options": [{"id": "1H32t", "text": "$5.022 \\times 10^{24}$", "image": null, "isCorrect": false}, {"id": "xysAZ", "text": "$3.011 \\times 10^{22}$", "image": null, "isCorrect": false}, {"id": "vkoiA", "text": "$6.022 \\times 10^{21}$", "image": null, "isCorrect": true}, {"id": "21I1r", "text": "$2.022 \\times 10^{23}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{q}=\\mathrm{ne} \\\\\n& \\mathrm{q}=\\mathrm{I} . \\mathrm{t} \\\\\n& \\mathrm{n}=\\text { no. of electrons } \\\\\n& \\mathrm{e}=\\text { change of one electron } \\\\\n& \\mathrm{I}=\\text { Current supplied } \\\\\n& \\mathrm{t}=\\text { time in seconds } \\\\\n& \\mathrm{q}=1 \\times 16.1 \\times 60=\\mathrm{ne} \\\\\n& \\mathrm{n}=\\frac{16.1 \\times 60}{1.602 \\times 10^{-19}}=6.022 \\times 10^{21}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2603e0279619d9d8a22e7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "Which from following NOT correct regarding electrolysis?", "image": null}, "options": [{"id": "rjuBJ", "text": "It helps in refining of metals.", "image": null, "isCorrect": false}, {"id": "hJzk8", "text": "Conversion of electrical energy into chemical energy takes place.", "image": null, "isCorrect": false}, {"id": "6GOPp", "text": "It is useful in electroplating.", "image": null, "isCorrect": false}, {"id": "5iqV5", "text": "Metal is deposited at anode.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When molten ionic compound is electrolyzed, a metal is deposited at cathode.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260280279619d9d8a2237", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "How many faraday of electricity is required to produce $10 \\mathrm{~g}$ of calcium metal (molar mass $=40 \\mathrm{~g} \\mathrm{~mol}^{-1}$ ) from calcium ions?", "image": null}, "options": [{"id": "cFQXz", "text": "$1.5 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "VdpBL", "text": "$2.0\\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "9V65h", "text": "$0.50 \\mathrm{~F}$", "image": null, "isCorrect": true}, {"id": "Vm73S", "text": "$1.0 \\mathrm{~F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n2 \\mathrm{e}^{-}+\\mathrm{Ca}^{2+} \\longrightarrow \\mathrm{Ca}_{(\\mathrm{s})}\n$$\nCharge of $1 \\mathrm{~mol}$ electron $=1$ faraday of electricity To produce $1 \\mathrm{~mol}$ calcium metal $2 \\mathrm{~F}$ electricity is required Moles of calcium $=\\frac{10}{40}=0.25$\nTo produce $0.25 \\mathrm{~mol}$ calcium electricity required $=2 \\times 0.25=0.5 \\mathrm{~F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260160279619d9d8a21a0", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "$\\mathrm{E}^{\\circ}$ cell is $1 \\cdot 049 \\mathrm{~V}$ and involves transfer of 2 electrons, calculate equilibrium constant of cell?", "image": null}, "options": [{"id": "jCTLf", "text": "$2.75 \\times 10^{35}$", "image": null, "isCorrect": true}, {"id": "E2azg", "text": "$2.75 \\times 10^{10}$", "image": null, "isCorrect": false}, {"id": "SPu3X", "text": "$0 \\cdot 524 \\times 10^{35}$", "image": null, "isCorrect": false}, {"id": "H6w9k", "text": "$2 \\cdot 098 \\times 10^{10}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{E}_{\\text {cell }}^{0}=1.049 \\mathrm{~V}, \\quad \\mathrm{n}=2, \\quad \\mathrm{~K}=?$\n$\\mathrm{E}_{\\text {cell }}^{0}=\\frac{0.0592}{\\mathrm{n}} \\log _{10} \\mathrm{~K}$\n$\\therefore \\log _{10} \\mathrm{~K}=\\frac{\\mathrm{E}_{\\text {cell }}^{0} \\times \\mathrm{n}}{0.0592}=\\frac{1.049 \\times 2}{0.0592}$\n$\\therefore \\log _{10} \\mathrm{~K}=35.439$\n$\\therefore \\mathrm{K} =$ Antilog $(35.439)$\n$\\therefore \\mathrm{K}=2.75 \\times 10^{35}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ff40279619d9d8a2094", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "What is the SI unit for electrochemical equivalent?", "image": null}, "options": [{"id": "hTOQZ", "text": "$\\mathrm{J} \\mathrm{C}^{-1}$", "image": null, "i g}$ of $\\mathrm{Mg}=\\frac{4.8 \\times 2}{24}=0.4 \\mathrm{~F}$ of electricity.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ff10279619d9d8a2077", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "Number of electrons involved in the reaction when 1 faraday of electricity is passed through an electrolytic solution is?", "image": null}, "options": [{"id": "8H78P", "text": "$8 \\times 10^{16}$", "image": null, "isCorrect": false}, {"id": "POPkf", "text": "96500", "image": null, "isCorrect": false}, {"id": "8Mfxw", "text": "$12 \\times 10^{46}$", "image": null, "isCorrect": false}, {"id": "XwEhp", "text": "$6.022 \\times 10^{23}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(D)\n1 Faraday is the electric charge on one mole of electrons $\\left(6.022 \\times 10^{23}\\right.$ electrons).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc90279619d9d8a1f3d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "A solution of $\\mathrm{CuSO}_{4}$ is electrolysed using a current of $1 \\cdot 5$ amperes for 10 minutes. What mass of Cu is deposited at cathode ? (At. mass of $\\mathrm{Cu}=63 \\cdot 7$ )", "image": null}, "options": [{"id": "DMvTZ", "text": "0.395g", "image": null, "isCorrect": false}, {"id": "ktkUT", "text": "0.150g", "image": null, "isCorrect": false}, {"id": "BrnBY", "text": "0.637g", "image": null, "isCorrect": false}, {"id": "VqBAp", "text": "0.297g", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(D)\nThe half reaction at cathode is\n$\\mathrm{Cu}_{\\text {(aq) }}^{2+}+2 \\mathrm{e}^{--} \\longrightarrow \\mathrm{Cu}_{(\\mathrm{s})}$ Mole ratio $=\\frac{1}{2}, \\mathrm{t}=10 \\mathrm{~min}=600 \\mathrm{~s}$\nMass of $\\mathrm{Cu}$ deposited $=\\frac{\\mathrm{I} \\times \\mathrm{t}}{96500} \\times$ mole ratio $\\times$ molar mass of $\\mathrm{Cu}$\n$=\\frac{1.5 \\times 600}{96500} \\times \\frac{1}{2} \\times 63.7=0.297 \\mathrm{~g}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb70279619d9d8a1eac", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "How many electrons are involved in the reaction when $0 \\cdot 40$ F of electricity is passed through an electrolytic solution?", "image": null}, "options": [{"id": "qOyci", "text": "$6.642 \\times 10^{25}$", "image": null, "isCorrect": false}, {"id": "OAmzr", "text": "$2.4088 \\times 10^{23}$", "image": null, "isCorrect": true}, {"id": "c7XHD", "text": "$1.505 \\times 10^{24}$", "image": null, "isCorrect": false}, {"id": "vSEzw", "text": "$6.022 \\times 10^{23}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(C)\n$\\begin{array}{l}\n1 \\mathrm{~F}=96500 \\mathrm{C} \\\\\n\\therefore \\quad 0.4 \\mathrm{~F}=96500 \\times 0.4=38600 \\mathrm{C}\n\\end{array}$\n$\\begin{aligned}\n\\text { Now, } 96500 \\mathrm{C} &=6.022 \\times 10^{23} \\text { electrons } \\\\\n\\therefore 38600 \\mathrm{C} &=\\frac{6.022 \\times 10^{23} \\times 38600}{96500} \\\\\n&=2.4088 \\times 10^{23} \\text { electrons }\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fa70279619d9d8a1e34", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "What is the standard free energy change for the cell, having following cell reaction? $2 \\mathrm{Ag}_{(\\mathrm{aq} .)}^{+}+\\mathrm{Cd}_{(\\mathrm{s})} \\longrightarrow 2 \\mathrm{Ag}_{(\\mathrm{s})}+\\mathrm{Cd}_{(\\mathrm{aq})}^{2+}, \\mathrm{E}^{\\circ} \\mathrm{cell}=1 \\cdot 20 \\mathrm{~V}$", "image": null}, "options": [{"id": "CT1at", "text": "$-231 \\cdot 6 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "nUufH", "text": "$-160 \\cdot 8 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "zNl79", "text": "$-115 \\cdot 8 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "KMn55", "text": "$-260 \\cdot 8 \\mathrm{K} \\mathrm{j}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$2 \\mathrm{Ag}_{(\\mathrm{aq})}^{+}+\\mathrm{Cd}_{(\\mathrm{s})} \\longrightarrow 2 \\mathrm{Ag}_{(\\mathrm{s})}+\\mathrm{Cd}_{(\\mathrm{aq})}^{2+}$\n$\\therefore \\mathrm{n}=2$\n$\\Delta \\mathrm{G}^{0}=-\\mathrm{nFE}_{\\mathrm{cell}}^{0}=-2 \\times 96500 \\times 1.20=-231600 \\mathrm{~J}=-231.6 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fa60279619d9d8a1e2e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "For the following cell, standard potential of copper electrode in $0.337 \\mathrm{~V}$ and standard cell potential is $0.463 \\mathrm{~V}$ $\\mathrm{Cu}\\left|\\mathrm{Cu}^{2+}(1 \\mathrm{M}) \\| \\mathrm{Ag}^{+}(1 \\mathrm{M})\\right| \\mathrm{Ag}$\nWhat is the standard potential of silver electrode?", "image": null}, "options": [{"id": "RtW8C", "text": "$-0.126 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "2XgLX", "text": "$0.800 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "w1otG", "text": "$-0.463 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "tiFpa", "text": "$0.126 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{E}_{\\mathrm{cell}}^{0}=0.463 \\mathrm{~V}, \\quad \\mathrm{E}_{\\mathrm{Cu}}^{0}=0.337 \\mathrm{~V}$\n$\\mathrm{E}_{\\mathrm{cell}}^{0}=\\mathrm{E}_{\\mathrm{Ag}}^{0}-\\mathrm{E}_{\\mathrm{Cu}}^{0}$\n$\\therefore \\mathrm{E}_{\\mathrm{Ag}}^{0}=\\mathrm{E}_{\\mathrm{cell}}^{0}+\\mathrm{E}_{\\mathrm{Cu}}^{0}=0.463+0.337=0.800 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f810279619d9d8a1d01", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "How many electrons flow when a current of 5 amp is passed through a cell for 200 sec?", "image": null}, "options": [{"id": "HP4vT", "text": "$9.65 \\times 10^{21}$", "image": null, "isCorrect": false}, {"id": "Z5cNt", "text": "$1 \\cdot 60 \\times 10^{21}$", "image": null, "isCorrect": false}, {"id": "0Cdt8", "text": "$3 \\cdot 12 \\times 10^{21}$", "image": null, "isCorrect": false}, {"id": "VmzmQ", "text": "$6 \\cdot 24 \\times 10^{21}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{Q}=\\mathrm{I} \\times \\mathrm{t}=5 \\times 200=1000 \\mathrm{C}\n$$\nThe charge of one electron is $1.602 \\times 10^{-19} \\mathrm{C}$\nNo. of electrons passed $=\\frac{1000 \\mathrm{C}}{1.602 \\times 10^{-19 "2009", "title": "MHT CET 2009"}], "question": {"text": "The standard reduction potential for $\\mathrm{Mg}^{2+} / \\mathrm{Mg}$ is $-2.37 \\mathrm{~V}$ and for $\\mathrm{Cu}^{2+} / \\mathrm{Cu}$ is $0.337$. The $E_{\\text {cell }}^{\\circ}$ for the following reaction is $\\mathrm{Mg}+\\mathrm{Cu}^{2+} \\longrightarrow \\mathrm{Mg}^{2+}+\\mathrm{Cu}$", "image": null}, "options": [{"id": "0nAmv", "text": "$+2.03 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "N7PPP", "text": "$-2.03 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "n7tNi", "text": "$-2.7 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "oav9Z", "text": "$+2.7 \\mathrm{~V}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$E_{\\text {cell }}^{\\circ}=E_{\\text {cathode }}^{\\circ}-E_{\\text {anode }}^{\\circ}$\n$$\n\\begin{aligned}\n=E_{\\left(\\mathrm{Cu}^{2+} / \\mathrm{Cu}\\right)}^{\\circ}-E_{\\left(\\mathrm{Mg}^{2+} / \\mathrm{Mg}\\right)}^{\\circ} &=0.337-(-2.37) \\mathrm{V} \\\\\n&=2.7 \\mathrm{~V}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e590279619d9d8a13b2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The standard reduction potentials at $298 \\mathrm{~K}$ for the following half-cell reactions are given on next page\n$\\mathrm{Zn}^{2+}(a q)+2 e^{-} \\rightleftharpoons \\mathrm{Zn}(s)-0.762$\n$\\mathrm{Cr}^{3+}(a q)+3 e^{-} \\rightleftharpoons \\mathrm{Cr}(s)-0.74$\n$2 \\mathrm{H}^{+}(a q)+2 e^{-} \\rightleftharpoons \\mathrm{H}_{2}(g)+0.00$\n$\\mathrm{Fe}^{3+}(a q)+e^{-} \\rightleftharpoons \\mathrm{Fe}^{2+}(a q)+0.77$\nWhich one of the following is the strongest reducing agent?", "image": null}, "options": [{"id": "FImZL", "text": "$\\mathrm{Zn}(s)$", "image": null, "isCorrect": true}, {"id": "U6OnC", "text": "$\\operatorname{Cr}(s)$", "image": null, "isCorrect": false}, {"id": "eLizk", "text": "$\\mathrm{H}_{2}(s)$", "image": null, "isCorrect": false}, {"id": "H60ki", "text": "$\\mathrm{Fe}^{2+}(a q)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The metals having higher negative value of standard reduction potential are placed above hydrogen in electrochemical series. The metals placed above hydrogen has a great tendency to donate electrons or oxidising power. The metals having great oxidising power are strongest reducing agent. Zn has higher negative value of standard reduction potential. Therefore, it is the strongest reducing agent.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e570279619d9d8a13a4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "$\\mathrm{Cu}^{+}(a q)$ is unstable in solution and undergoes simultaneous oxidation and reduction, according to the reaction\n$2 \\mathrm{Cu}^{+}(a q) \\rightleftharpoons \\mathrm{Cu}^{2+}(a q)+\\mathrm{Cu}(s)$\nchoose correct $E^{\\circ}$ for above reaction if\n$E_{\\mathrm{Cu}^{2+} / \\mathrm{Cu}}^{\\circ}=0.34 \\mathrm{~V}$ and $E_{\\mathrm{Cu}^{2+} / \\mathrm{Cu}^{+}}^{\\circ}=0.15 \\mathrm{~V}$", "image": null}, "options": [{"id": "3Ufcg", "text": "$-0.38 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "aTcLt", "text": "$+0.49 \\mathrm{~V}$\n$(\\mathrm{c})+0.38 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "qFPBG", "text": "$-0.19 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "XEaIY", "text": "NULL", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e540279619d9d8a138c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "Cell reaction is spontaneous, when", "image": null}, "options": [{"id": "OsLUb", "text": "$E_{\\text {red }}^{\\circ}$ is negative", "image": null, "isCorrect": false}, {"id": "XJtQ5", "text": "$E_{\\mathrm{red}}^{\\circ}$ is positive", "image": null, "isCorrect": false}, {"id": "L8SGx", "text": "$\\Delta G^{\\circ}$ is negative", "image": null, "isCorrect": true}, {"id": "WA2Kd", "text": "$\\Delta G^{\\circ}$ is positive", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\Delta G=\\Delta H-T \\Delta S$\nFor a spontaneous celll reaction, $\\Delta H$ should be negative and $\\Delta S$ should be positive. Hence, $\\Delta G$ should be negative.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e410279619d9d8a12f5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The standard $E_{\\text {red }}^{\\circ}$ values of $A, B$ and $C$ are $+0.68 \\mathrm{~V},-2.54 \\mathrm{~V},-0.50 \\mathrm{~V}$ respectively. The\norder of their reducing power is", "image": null}, "options": [{"id": "dGmwR", "text": "$A>B>C$", "image": null, "isCorrect": false}, {"id": "FNeit", "text": "$A>C>B$", "image": null, "isCorrect": false}, {"id": "xI4BY", "text": "$C>B>A$", "image": null, "isCorrect": false}, {"id": "ptQZ6", "text": "$B>C>A$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Reducing character is based upon higher negative value of reduction electrode potential.\nThus, order of reducing character is\n$$\nB>C>A\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e410279619d9d8a12f4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "EMF of hydrogen electrode in term of $\\mathrm{pH}$ is (at 1 atm pressure).", "image": null}, "options": [{"id": "aSeVq", "text": "$E_{\\mathrm{H}_{2}}=\\frac{R T}{F} \\times \\mathrm{pH}$", "image": null, "isCorrect": false}, {"id": "r3ExZ", "text": "$E_{\\mathrm{H}_{2}}=\\frac{R T}{F} \\cdot \\frac{1}{\\mathrm{pH}}$", "image": null, "isCorrect": false}, {"id": "Kqzfc", "text": "$E_{\\mathrm{H}_{2}}=\\frac{2.303 \\mathrm{RT}}{F} \\mathrm{pH}$", "image": null, "isCorrect": false}, {"id": "aETqa", "text": "$E_{\\mathrm{H}_{2}}=-0.591 \\mathrm{pH}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$2 \\mathrm{H}^{+}+2 e^{-} \\longrightarrow \\mathrm{H}_{2}$\nAccording to Nernst equation,\n$$\n\\begin{aligned}\nE &=E^{\\circ}+\\frac{0.0591}{n} \\log \\frac{1}{\\left[\\mathrm{H}^{+}\\right]^{2}} \\\\\nE &=0-\\frac{0.0591}{2} \\log \\left[\\mathrm{H}^{+}\\right]^{2} \\\\\n&=-0.0591 \\mathrm{pH}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e410279619d9d8a12f3", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The amount of silver deposited on passing $2 \\mathrm{~F}$ of electricity through aqueous solution of $\\mathrm{AgNO}_{3}$ is", "image": null}, "options": [{"id": "fhrUq", "text": "$54 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "WMg4z", "text": "$108 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "3MAkr", "text": "$216 \\mathrm{~g}$", "image": null, "isCorrect": true}, {"id": "3RhHV", "text": "$324 \\mathrm{~g}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According Faraday law's\n$$\n\\begin{array}{l}\nm=z \\times Q=\\frac{E \\times Q}{96500} \\\\\nm=\\frac{108}{96500} \\times 2 \\times 96500=216 \\mathrm{~g}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a2632c0279619d9d8a3ca7", "title": "Types of half cells", "totalQuestions": 2, "questions": [{"_id": "65a25fe10279619d9d8a1ffc", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "Which among the following is an example of metal-sparingly soluble salt electrode?", "image": null}, "options": [{"id": "whqYF", "text": "$\\mathrm{OH}^{-}$ (aq.) $\\mid \\mathrm{O}_{2(\\mathrm{~g})}, \\mathrm{Pt}$", "image": null, "isCorrect": false}, {"id": "RDgOa", "text": "$\\mathrm{Cl}^{-}$ (aq.) $\\left|\\mathrm{AgCl}_{(\\mathrm{s})}\\right| \\mathrm{Ag}_{(\\mathrm{s})}$", "image": null, "isCorrect": true}, {"id": "LrFSj", "text": "$\\mathrm{Zn}^{2+}$ (aq.) $\\mid \\mathrm{Zn}(\\mathrm{s})$", "image": null, "isCorrect": false}, {"id": "708mS", "text": "$\\mathrm{Cu}^{+}$ (aq.), $\\mathrm{Cu}^{2+}$ (aq.) $\\mathrm{Pt}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ag/AgCl is a second type electrode in which the metal is in contact wit its low soluble salt and the anion of that salt. In your case, the metal is Ag in contact with its low soluble salt AgCl + its anion Cl(-) and the reaction is AgCl + e = Ag + Cl(-). This reaction is the half cell of Ag/AgCl ref. electrode.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f910279619d9d8a1d88", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "Which among the following is an example of Metal - metal ion electrode?", "image": null}, "options": [{"id": "jViIt", "text": "$\\mathrm{Fe}^{3+}$ (aq.), $\\mathrm{Fe}^{2+}$ (aq.) $\\mid \\mathrm{Pt}$", "image": null, "isCorrect": false}, {"id": "4rxfh", "text": "$\\mathrm{Cl}^{-}{ }_{(\\text {aq. })}\\left|\\mathrm{AgCl}_{(\\mathrm{s})}\\right| \\mathrm{Ag}$", "image": null, "isCorrect": false}, {"id": "xc9AX", "text": "$\\mathrm{Zn}^{2+}$ (aq.) $\\mid \\mathrm{Zn}_{(s)}$", "image": null, "isCorrect": true}, {"id": "tHWIg", "text": "$\\mathrm{OH}^{-}$ (aq.) $\\left|\\mathrm{O}_{ \\left.2(\\mathrm{~g}), \\mathrm{PO}_{2}\\right)}\\right| \\mathrm{Pt}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Zn2+ | Zn is an example of metal-metal ion electrode .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a2632c0279619d9d8a3ca8", "title": "Concentration cell", "totalQuestions": 3, "questions": [{"_id": "6abb885215a9fc0fc8c14299", "type": "singleCorrect", "question": {"text": "The main function of a salt bridge in an electrochemical cell is to:", "image": null}, "options": [{"id": "1uxu1", "label": "A", "text": "Increase cell potential", "isCorrect": false, "image": null}, {"id": "puCsz", "label": "B", "text": "Decreases the reaction rate", "isCorrect": false, "image": null}, {"id": "kR9PM", "label": "C", "text": "Maintain electrical neutrality in half-cells", "isCorrect": true, "image": null}, {"id": "m3oqu", "label": "D", "text": "Increase the reaction rate", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A salt bridge is a U-shaped tube containing an inert electrolyte like $KCl$, $KNO_3$, or $NH_4NO_3$ in agar-agar or gelatin.<br><br>Its primary functions in an electrochemical cell are to complete the inner electrical circuit by allowing the movement of ions and to maintain the electrical neutrality of the electrolytes in the two half-cells.<br><br>As oxidation occurs at the anode, positive ions accumulate in the anodic half-cell. Similarly, as reduction occurs at the cathode, negative ions accumulate in the cathodic half-cell. The salt bridge provides anions to the anodic compartment and cations to the cathodic compartment to neutralize this charge buildup.<br><br>Answer: Maintain electrical neutrality in half-cells", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b68c30a4553e1bdc00", "type": "singleCorrect", "question": {"text": "Identify the function of salt bridge.", "image": null}, "options": [{"id": "uldHK", "label": "A", "text": "As cathode", "isCorrect": false, "image": null}, {"id": "yzStr", "label": "B", "text": "As anode", "isCorrect": false, "image": null}, {"id": "dpPBH", "label": "C", "text": "To connect two half cells.", "isCorrect": true, "image": null}, {"id": "lqk6I", "label": "D", "text": "To measure electrode potential.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A salt bridge is a U-shaped tube containing an inert electrolyte in a gel-like substance.<br><br>Its primary functions are to complete the electrical circuit by connecting the two half-cells and to maintain the electrical neutrality of the solutions in the two half-cells.<br><br>Therefore, its function is to connect two half cells.<br><br>Answer: To connect two half cells.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2619f0279619d9d8a2e03", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Which of the following is NOT a function of salt bridge?", "image": null}, "options": [{"id": "nVSab", "text": "Provide electrical contact", "image": null, "isCorrect": false}, {"id": "TJ9bm", "text": "Convert electrical energy to chemical energy", "image": null, "isCorrect": true}, {"id": "bLVqP", "text": "Maintain electrical neutrality", "image": null, "isCorrect": false}, {"id": "pIrAE", "text": "Prevent mixing of solutions", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Theory based", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a2632c0279619d9d8a3ca6", "title": "Commercial Cells and Batteries", "totalQuestions": 23, "questions": [{"_id": "6a44d3528c30a4553e1be282", "type": "singleCorrect", "question": {"text": "Which of the following reactions occurs at cathode during recharging of lead accumulator ?", "image": null}, "options": [{"id": "YOHAh", "label": "A", "text": "$\\text{PbO}_{2(s)} + 4\\text{H}^+_{(aq.)} + \\text{SO}_4^{2-}{}_{(aq.)} + 2e^- \\rightarrow \\text{Pb}_{(s)} + \\text{PbSO}_{4(s)} + 2\\text{H}_2\\text{O}_{(\\ell)}$", "isCorrect": false, "image": null}, {"id": "3e0I4", "label": "B", "text": "$\\text{PbO}_{2(s)} + 4\\text{H}^+\\ 2e^- \\rightarrow \\text{Pb}^{2+} + 2\\text{H}_2\\text{O}_{(\\ell)}$", "isCorrect": false, "image": null}, {"id": "DoCDF", "label": "C", "text": "$\\text{Pb}_{(s)} + \\text{SO}_4^{2-}{}_{(aq.)} \\rightarrow \\text{PbSO}_{4(s)} + 2e^-$", "isCorrect": false, "image": null}, {"id": "CeRmZ", "label": "D", "text": "$\\text{PbSO}_{4(s)} + 2e^- \\rightarrow \\text{Pb}_{(s)} + \\text{SO}_4^{2-}{}_{(aq.)}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "During the discharging of a lead accumulator, the cell acts as a galvanic cell with the following reactions:<br>At anode (oxidation): $\\text{Pb}_{(s)} + \\text{SO}_4^{2-}{}_{(aq.)} \\rightarrow \\text{PbSO}_{4(s)} + 2e^-$<br>At cathode (reduction): $\\text{PbO}_{2(s)} + \\text{SO}_4^{2-}{}_{(aq.)} + 4\\text{H}^+_{(aq.)} + 2e^- \\rightarrow \\text{PbSO}_{4(s)} + 2\\text{H}_2\\text{O}_{(\\ell)}$<br><br>During recharging, an external voltage is applied and the cell acts as an electrolytic cell. The reactions are reversed. The electrode that acted as the anode during discharge becomes the cathode (where reduction occurs), and the electrode that acted as the cathode becomes the anode (where oxidation occurs).<br><br>At cathode (reduction) during recharging:<br>$\\text{PbSO}_{4(s)} + 2e^- \\rightarrow \\text{Pb}_{(s)} + \\text{SO}_4^{2-}{}_{(aq.)}$<br><br>At anode (oxidation) during recharging:<br>$\\text{PbSO}_{4(s)} + 2\\text{H}_2\\text{O}_{(\\ell)} \\rightarrow \\text{PbO}_{2(s)} + \\text{SO}_4^{2-}{}_{(aq.)} + 4\\text{H}^+_{(aq.)} + 2e^-$<br><br>Answer: $\\text{PbSO}_{4(s)} + 2e^- \\rightarrow \\text{Pb}_{(s)} + \\text{SO}_4^{2-}{}_{(aq.)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3468c30a4553e1be202", "type": "singleCorrect", "question": {"text": "What is the change in oxidation number of Pb at positive electrode of lead accumulator acting as galvanic cell ?", "image": null}, "options": [{"id": "qbCX6", "label": "A", "text": "increases by 1", "isCorrect": false, "image": null}, {"id": "dL7XM", "label": "B", "text": "decreases by 1", "isCorrect": false, "image": null}, {"id": "q9G6t", "label": "C", "text": "increases by 2", "isCorrect": false, "image": null}, {"id": "BLWzj", "label": "D", "text": "decreases by 2", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "In a lead accumulator acting as a galvanic cell (discharging), the positive electrode acts as the cathode where reduction takes place.<br><br>The reaction at the positive electrode is:<br>$PbO_2(s) + SO_4^{2-}(aq) + 4H^+(aq) + 2e^- \\rightarrow PbSO_4(s) + 2H_2O(l)$<br><br>The oxidation state of Pb in $PbO_2$ is $+4$.<br>The oxidation state of Pb in $PbSO_4$ is $+2$.<br><br>The oxidation number of Pb changes from $+4$ to $+2$, which means it decreases by $2$.<br><br>Answer: decreases by 2", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c58c30a4553e1bdc9c", "type": "singleCorrect", "question": {"text": "Which of the following hot aqueous solutions is used to dip carbon rods of $\\text{H}_2 - \\text{O}_2$ fuel cell ?", "image": null}, "options": [{"id": "Bbziv", "label": "A", "text": "$\\text{KCl}$", "isCorrect": false, "image": null}, {"id": "jfVn3", "label": "B", "text": "$\\text{KOH}$", "isCorrect": true, "image": null}, {"id": "VKJHi", "label": "C", "text": "$\\text{H}_2\\text{SO}_4$", "isCorrect": false, "image": null}, {"id": "BP3UP", "label": "D", "text": "$\\text{NH}_4\\text{Cl}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In a hydrogen-oxygen fuel cell, the electrolyte used is a hot concentrated aqueous solution of potassium hydroxide ($\\text{KOH}$) or sodium hydroxide ($\\text{NaOH}$).<br><br>The porous carbon electrodes, which are impregnated with a suitable catalyst like platinum or palladium, are dipped in this hot aqueous solution of $\\text{KOH}$ to facilitate the flow of ions between the electrodes.<br><br>Answer: $\\text{KOH}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3358c30a4553e1be159", "type": "singleCorrect", "question": {"text": "What happens during the discharge of a lead storage battery?", "image": null}, "options": [{"id": "BiSMf", "label": "A", "text": "$\\text{SO}_2$ is evolved", "isCorrect": false, "image": null}, {"id": "LPA5N", "label": "B", "text": "Pb is formed", "isCorrect": false, "image": null}, {"id": "ef2rO", "label": "C", "text": "$\\text{H}_2\\text{SO}_4$ is consumed", "isCorrect": true, "image": null}, {"id": "u2p9q", "label": "D", "text": "$\\text{PbSO}_4$ is consumed", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "During the discharge of a lead storage battery, the following reactions take place:<br><br>At anode: $\\text{Pb}(s) + \\text{SO}_4^{2-}(aq) \\rightarrow \\text{PbSO}_4(s) + 2e^-$<br><br>At cathode: $\\text{PbO}_2(s) + \\text{SO}_4^{2-}(aq) + 4\\text{H}^+(aq) + 2e^- \\rightarrow \\text{PbSO}_4(s) + 2\\text{H}_2\\text{O}(l)$<br><br>Overall reaction: $\\text{Pb}(s) + \\text{PbO}_2(s) + 2\\text{H}_2\\text{SO}_4(aq) \\rightarrow 2\\text{PbSO}_4(s) + 2\\text{H}_2\\text{O}(l)$<br><br>From the overall cell reaction, it is clear that sulphuric acid ($\\text{H}_2\\text{SO}_4$) is consumed during the discharge process.<br><br>Answer: $\\text{H}_2\\text{SO}_4$ is consumed", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e28c30a4553e1bddd5", "type": "singleCorrect", "question": {"text": "Which of the following is an electrolyte in dry cell ?", "image": null}, "options": [{"id": "NOce0", "label": "A", "text": "Potassium hydroxide", "isCorrect": false, "image": null}, {"id": "gGqnw", "label": "B", "text": "Sulphuric acid", "isCorrect": false, "image": null}, {"id": "mg7I6", "label": "C", "text": "Ammonium chloride and zinc chloride", "isCorrect": true, "image": null}, {"id": "DWWoZ", "label": "D", "text": "Manganese dioxide", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A dry cell, also known as a Leclanché cell, consists of a zinc container that acts as the anode and a carbon (graphite) rod that acts as the cathode.<br><br>The space between the electrodes is filled with a moist paste of ammonium chloride ($NH_4Cl$) and zinc chloride ($ZnCl_2$), which serves as the electrolyte.<br><br>Manganese dioxide ($MnO_2$) mixed with carbon powder surrounds the cathode and acts as a depolarizer, while potassium hydroxide is used in alkaline batteries and sulphuric acid in lead-acid accumulators.<br><br>Answer: Ammonium chloride and zinc chloride", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31a8c30a4553e1be02e", "type": "singleCorrect", "question": {"text": "Which from following statements regarding mercury battery is NOT true?", "image": null}, "options": [{"id": "pl10K", "label": "A", "text": "It is a primary dry cell.", "isCorrect": false, "image": null}, {"id": "GewoO", "label": "B", "text": "It consists of Zn anode amalgamated with mercury.", "isCorrect": false, "image": null}, {"id": "cYJtu", "label": "C", "text": "The electrolyte is strongly acidic.", "isCorrect": true, "image": null}, {"id": "R5uGo", "label": "D", "text": "In this Hg is obtained by reduction of HgO", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A mercury battery is a primary dry cell.<br><br>The anode consists of zinc amalgamated with mercury, $\\text{Zn(Hg)}$.<br><br>The cathode is a paste of $\\text{HgO}$ and carbon, where $\\text{HgO}$ is reduced to $\\text{Hg}$ during the operation of the cell.<br><br>The electrolyte is a paste of $\\text{KOH}$ and $\\text{ZnO}$. Since $\\text{KOH}$ is a strong base, the electrolyte is strongly alkaline, not acidic.<br><br>Therefore, the statement that the electrolyte is strongly acidic is incorrect.<br><br>Answer: The electrolyte is strongly acidic.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b88c30a4553e1bdc13", "type": "singleCorrect", "question": {"text": "Which of the following statements is true about the voltaic cell?", "image": null}, "options": [{"id": "6R8Jm", "label": "A", "text": "It converts chemical energy into electrical energy.", "isCorrect": true, "image": null}, {"id": "lrQpR", "label": "B", "text": "It converts electrical energy into chemical energy.", "isCorrect": false, "image": null}, {"id": "tF1rE", "label": "C", "text": "The anode of voltaic cells is positive.", "isCorrect": false, "image": null}, {"id": "hauZS", "label": "D", "text": "The cathode of voltaic cell is negative.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A voltaic cell (or galvanic cell) is an electrochemical cell that uses a spontaneous chemical reaction to generate an electric current. Therefore, it converts chemical energy into electrical energy.<br><br>In a voltaic cell, oxidation occurs at the anode, making it the negative electrode, while reduction occurs at the cathode, making it the positive electrode. An electrolytic cell, on the other hand, converts electrical energy into chemical energy.<br><br>Answer: It converts chemical energy into electrical energy.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcbbf9280d7f9932c7a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following changes takes place at positive electrode during recharging of lead accumulator?", "image": null}, "options": [{"id": "4OgXA", "text": "Pb is oxidised to $\\mathrm{PbSO}_4$", "image": null, "isCorrect": false}, {"id": "gMVaT", "text": "$\\mathrm{PbSO}_4$ is oxidised to $\\mathrm{PbO}_2$", "image": null, "isCorrect": true}, {"id": "3sm3o", "text": "$\\mathrm{PbSO}_4$ is reduced to Pb", "image": null, "isCorrect": false}, {"id": "F2MR3", "text": "$\\mathrm{PbO}_2$ is reduced to $\\mathrm{PbSO}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "During the discharging of a lead accumulator, the positive electrode acts as a cathode where $\\mathrm{PbO}_2$ is reduced to $\\mathrm{PbSO}_4$.<br><br>During recharging, the cell operates as an electrolytic cell and the reactions are reversed. The positive electrode is connected to the positive terminal of the external DC source and acts as an anode, where oxidation takes place.<br><br>The reaction at the positive electrode during recharging is:<br>$\\mathrm{PbSO}_4(s) + 2\\mathrm{H}_2\\mathrm{O}(l) \\rightarrow \\mathrm{PbO}_2(s) + 4\\mathrm{H}^+(aq) + \\mathrm{SO}_4^{2-}(aq) + 2e^-$<br><br>Thus, $\\mathrm{PbSO}_4$ is oxidised to $\\mathrm{PbO}_2$.<br><br>Answer: $\\mathrm{PbSO}_4$ is oxidised to $\\mathrm{PbO}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b39bf9280d7f9932741", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following change takes place at positive electrode during working of dry cell?", "image": null}, "options": [{"id": "zvPzW", "text": "$\\mathrm{Zn}_{(\\mathrm{s})}$ is oxidised to $\\mathrm{Zn}^{+2}{ }_{(\\mathrm{aq})}$", "image": null, "isCorrect": false}, {"id": "VtdL0", "text": "$\\mathrm{Zn}^{+2}{ }_{(\\mathrm{aq})}$ is reduced to $\\mathrm{Zn}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}, {"id": "fT5Lv", "text": "$\\mathrm{MnO}_{2(\\mathrm{~s})}$ is reduced to $\\mathrm{Mn}_2 \\mathrm{O}_{3(\\mathrm{~s})}$", "image": null, "isCorrect": true}, {"id": "fXUDL", "text": "$\\mathrm{Mn}_2 \\mathrm{O}_{3(\\mathrm{~s})}$ is oxidised to $\\mathrm{MnO}_{2(\\mathrm{~s})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a dry cell, the positive electrode (cathode) is a graphite rod surrounded by a paste of $\\mathrm{MnO}_2$ and carbon powder.<br><br>During the working of the cell, reduction takes place at the positive electrode. The reaction is given by:<br><br>$2\\mathrm{MnO}_{2(\\mathrm{s})} + 2\\mathrm{NH}_{4(\\mathrm{aq})}^+ + 2\\mathrm{e}^- \\rightarrow \\mathrm{Mn}_2\\mathrm{O}_{3(\\mathrm{s})} + 2\\mathrm{NH}_{3(\\mathrm{aq})} + \\mathrm{H}_2\\mathrm{O}_{(\\mathrm{l})}$<br><br>In this reaction, the oxidation state of $\\mathrm{Mn}$ decreases from $+4$ in $\\mathrm{MnO}_2$ to $+3$ in $\\mathrm{Mn}_2\\mathrm{O}_3$.<br><br>Thus, $\\mathrm{MnO}_{2(\\mathrm{s})}$ is reduced to $\\mathrm{Mn}_2\\mathrm{O}_{3(\\mathrm{s})}$.<br><br>Answer: $\\mathrm{MnO}_{2(\\mathrm{~s})}$ is reduced to $\\mathrm{Mn}_2 \\mathrm{O}_{3(\\mathrm{~s})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b24bf9280d7f993269e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following species acts as reducing agent during working of hydrogen-oxygen fuel cell?", "image": null}, "options": [{"id": "wp0w9", "text": "$\\mathrm{H}_2$", "image": null, "isCorrect": true}, {"id": "um39I", "text": "$\\mathrm{O}_2$", "image": null, "isCorrect": false}, {"id": "qunuP", "text": "$\\mathrm{H}^{+}$", "image": null, "isCorrect": false}, {"id": "7wiQg", "text": "NaOH", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a hydrogen-oxygen fuel cell, the reactions at the electrodes are:<br><br>At anode (oxidation): $2\\mathrm{H}_2(g) + 4\\mathrm{OH}^-(aq) \\rightarrow 4\\mathrm{H}_2\\mathrm{O}(l) + 4\\mathrm{e}^-$<br><br>At cathode (reduction): $\\mathrm{O}_2(g) + 2\\mathrm{H}_2\\mathrm{O}(l) + 4\\mathrm{e}^- \\rightarrow 4\\mathrm{OH}^-(aq)$<br><br>Since $\\mathrm{H}_2$ undergoes oxidation by losing electrons, it acts as the reducing agent. $\\mathrm{O}_2$ undergoes reduction and acts as the oxidizing agent.<br><br>Answer: $\\mathrm{H}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ae0aee93fa0796dab0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Which of the following is used to avoid leakage of electrolyte in dry cell?", "image": null}, "options": [{"id": "wXeLq", "text": "Paste of $\\mathrm{MnO}_2$", "image": null, "isCorrect": false}, {"id": "mQAzN", "text": "Paste of $\\mathrm{NH}_4 \\mathrm{Cl}$", "image": null, "isCorrect": false}, {"id": "OFcNe", "text": "Starch", "image": null, "isCorrect": true}, {"id": "sBrms", "text": "Paste of $\\mathrm{ZnCl}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a dry cell, the electrolyte is a moist paste of $\\mathrm{NH}_4\\mathrm{Cl}$ and $\\mathrm{ZnCl}_2$. To prevent the leakage of this electrolyte and maintain its consistency as a thick paste, a thickening agent such as starch is added to the mixture.<br><br>Answer: Starch", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213750aee93fa0796d8ee", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which of the following reactions occurs at cathode during discharging of lead accumulator?", "image": null}, "options": [{"id": "j7oRx", "text": "$\\mathrm{PbSO}_{4(\\mathrm{~s})}+2 \\mathrm{e}^{-} \\longrightarrow \\mathrm{Pb}_{(\\mathrm{s})}+\\mathrm{SO}_{4 \\text { (aq.) }}^{2-}$", "image": null, "isCorrect": false}, {"id": "w0C9D", "text": "$\\mathrm{Pb}_{(\\mathrm{s})}+\\mathrm{SO}_{4(\\text { (aq. })}^{2-} \\longrightarrow \\mathrm{PbSO}_{4(\\mathrm{~s})}+2 \\mathrm{e}^{-}$", "image": null, "isCorrect": false}, {"id": "izSsK", "text": "$\\mathrm{PbO}_{2(\\mathrm{~s})}+4 \\mathrm{H}_{(\\mathrm{aq})}^{+}+\\mathrm{SO}_{4(\\mathrm{aq})}^{2-}+2 \\mathrm{e}^{-} \\longrightarrow \\mathrm{PbSO}_{4(s)}+2 \\mathrm{H}_2 \\mathrm{O}_{(1)}$", "image": null, "isCorrect": true}, {"id": "uHejI", "text": "$\\mathrm{PbSO}_{4(\\mathrm{~s})}+2 \\mathrm{H}_2 \\mathrm{O}_{(1)} \\longrightarrow \\mathrm{PbO}_{2(\\mathrm{~s})}+4 \\mathrm{H}_{(\\mathrm{aq} .)}^{+}+\\mathrm{SO}_{4(\\mathrm{aq} .)}^{2-}+2 \\mathrm{e}^{-}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "During the discharging of a lead accumulator, it acts as a galvanic cell. Reduction occurs at the cathode.<br><br>At the cathode, lead dioxide ($\\mathrm{PbO}_2$) is reduced to lead sulfate ($\\mathrm{PbSO}_4$) in the presence of sulfuric acid.<br><br>The reaction at the cathode is:<br>$\\mathrm{PbO}_{2(\\mathrm{s})} + 4\\mathrm{H}^{+}_{(\\mathrm{aq})} + \\mathrm{SO}_{4(\\mathrm{aq})}^{2-} + 2\\mathrm{e}^{-} \\longrightarrow \\mathrm{PbSO}_{4(\\mathrm{s})} + 2\\mathrm{H}_2\\mathrm{O}_{(\\mathrm{l})}$<br><br>At the anode, oxidation of lead takes place:<br>$\\mathrm{Pb}_{(\\mathrm{s})} + \\mathrm{SO}_{4(\\mathrm{aq})}^{2-} \\longrightarrow \\mathrm{PbSO}_{4(\\mathrm{s})} + 2\\mathrm{e}^{-}$<br><br>Answer: $\\mathrm{PbO}_{2(\\mathrm{~s})}+4 \\mathrm{H}_{(\\mathrm{aq})}^{+}+\\mathrm{SO}_{4(\\mathrm{aq})}^{2-}+2 \\mathrm{e}^{-} \\longrightarrow \\mathrm{PbSO}_{4(s)}+2 \\mathrm{H}_2 \\mathrm{O}_{(1)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213520aee93fa0796d7de", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Which of the following statements is NOT correct for $\\mathrm{H}_2-\\mathrm{O}_2$ fuel cell?", "image": null}, "options": [{"id": "b1bgc", "text": "$\\mathrm{H}_{2(\\mathrm{~g})}$ serves as fuel", "image": null, "isCorrect": false}, {"id": "xhn0Y", "text": "$\\mathrm{O}_{2(\\mathrm{~g})}$ is an oxidising agent", "image": null, "isCorrect": false}, {"id": "b9tjt", "text": "Platinum wires are used as anode and cathode", "image": null, "isCorrect": true}, {"id": "Wb8cp", "text": "Hot aqueous KOH solution acts as an electrolyte", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a $\\mathrm{H}_2-\\mathrm{O}_2$ fuel cell, hydrogen gas acts as the fuel and oxygen gas acts as the oxidising agent.<br><br>The electrolyte used is a concentrated aqueous solution of sodium hydroxide or potassium hydroxide (KOH).<br><br>The electrodes are made of porous carbon containing suitable catalysts like finely divided platinum or palladium metal. Platinum wires are not used as the anode and cathode.<br><br>Therefore, the statement that platinum wires are used as anode and cathode is incorrect.<br><br>Answer: Platinum wires are used as anode and cathode", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134f0aee93fa0796d7cb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Calculate the amount of electricity required to convert 1.1 mol of $\\mathrm{Cr}_2 \\mathrm{O}_7^{2-}$ to $\\mathrm{Cr}^{+3}$ in acidic medium.", "image": null}, "options": [{"id": "mZ9JV", "text": "$6.369 \\times 10^5 \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "CEdEK", "text": "$1.462 \\times 10^5 \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "I0Hr3", "text": "$4.839 \\times 10^5 \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "GI6AW", "text": "$3.419 \\times 10^5 \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The balanced half-reaction for the reduction of dichromate ion in acidic medium is:<br><br>$\\mathrm{Cr}_2 \\mathrm{O}_7^{2-} + 14\\mathrm{H}^+ + 6\\mathrm{e}^- \\rightarrow 2\\mathrm{Cr}^{3+} + 7\\mathrm{H}_2\\mathrm{O}$<br><br>From the stoichiometry of the reaction, 1 mole of $\\mathrm{Cr}_2 \\mathrm{O}_7^{2-}$ requires 6 moles of electrons.<br><br>Number of moles of electrons required for 1.1 moles of $\\mathrm{Cr}_2 \\mathrm{O}_7^{2-}$ is $1.1 \\times 6 = 6.6$ moles.<br><br>The amount of electricity required is given by $Q = nF$, where $F \\approx 96500 \\mathrm{C}$.<br><br>$Q = 6.6 \\times 96500 \\mathrm{C} = 636900 \\mathrm{C} = 6.369 \\times 10^5 \\mathrm{C}$<br><br>Answer: $6.369 \\times 10^5 \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133a0aee93fa0796d726", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Which of the following changes occurs during the discharging of lead accumulator?", "image": null}, "options": [{"id": "SimCV", "text": "$\\mathrm{Pb}_{(s)}$ is reduced", "image": null, "isCorrect": false}, {"id": "GU5at", "text": "$\\mathrm{H}_2 \\mathrm{SO}_4$ is consumed", "image": null, "isCorrect": true}, {"id": "QPnhQ", "text": "$\\mathrm{PbSO}_4$ is consumed", "image": null, "isCorrect": false}, {"id": "4LdPy", "text": "$\\mathrm{PbO}_2$ is produced", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "During the discharging of a lead accumulator, the cell reactions are:<br><br>At anode: $\\mathrm{Pb}_{(s)} + \\mathrm{SO}_4^{2-}_{(aq)} \\rightarrow \\mathrm{PbSO}_4(s) + 2e^-$<br><br>At cathode: $\\mathrm{PbO}_2(s) + \\mathrm{SO}_4^{2-}_{(aq)} + 4\\mathrm{H}^+_{(aq)} + 2e^- \\rightarrow \\mathrm{PbSO}_4(s) + 2\\mathrm{H}_2\\mathrm{O}(l)$<br><br>Overall reaction: $\\mathrm{Pb}_{(s)} + \\mathrm{PbO}_2(s) + 2\\mathrm{H}_2\\mathrm{SO}_4(aq) \\rightarrow 2\\mathrm{PbSO}_4(s) + 2\\mathrm{H}_2\\mathrm{O}(l)$<br><br>From the overall reaction, it is clear that $\\mathrm{H}_2\\mathrm{SO}_4$ is consumed, $\\mathrm{Pb}_{(s)}$ is oxidized, and $\\mathrm{PbSO}_4$ is produced.<br><br>Answer: $\\mathrm{H}_2 \\mathrm{SO}_4$ is consumed", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626e0279619d9d8a3478", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Which from following is NOT true about voltaic cell?", "image": null}, "options": [{"id": "cuwDK", "text": "The anode acts as negative electrode.", "image": null, "isCorrect": false}, {"id": "LYT6a", "text": "The cathode acts as a positive electrode.", "image": null, "isCorrect": false}, {"id": "l3PIm", "text": "It converts electrical energy into chemical energy", "image": null, "isCorrect": true}, {"id": "INlxd", "text": "Dry cell is an example of voltaic cell.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12 |Ch-5 | Subtopic-5.6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262480279619d9d8a3342", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Identify the overall oxidation reaction that occurs in lead storage cell during discharge.", "image": null}, "options": [{"id": "RpIeb", "text": "$\\mathrm{Pb}_{(\\mathrm{aq})}^{++}+\\mathrm{SO}_{4(\\mathrm{sq})}^{--} \\longrightarrow \\mathrm{PbSO}_{4(\\mathrm{~s})}$", "image": null, "isCorrect": false}, {"id": "tuZmT", "text": "$\\mathrm{PbSO}_{4(\\mathrm{~s})}+2 \\mathrm{H}_2 \\mathrm{O}_{(0)} \\longrightarrow \\mathrm{PbO}_{2(\\mathrm{~s})}+4\\mathrm{H}_{(\\mathrm{aq})}^{+}$\n$$\n+\\mathrm{SO}_{4(\\mathrm{xq})}^{--}+2 \\mathrm{e}^{-}\n$$", "image": null, "isCorrect": false}, {"id": "7kJj3", "text": "$\\mathrm{Pb}_{(8)}+\\mathrm{SO}_{4(\\mathrm{aq})}^{--} \\longrightarrow \\mathrm{PbSO}_{4(\\mathrm{~s})}+2 \\mathrm{e}^{-}$", "image": null, "isCorrect": true}, {"id": "xGSGg", "text": "$\\quad \\mathrm{PbSO}_{4(\\mathrm{~s})}+2 \\mathrm{e}^{-} \\longrightarrow \\mathrm{Pb}_{(\\mathrm{s})}+\\mathrm{SO}_{4(\\mathrm{mp})}^{--}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When the lead storage cell provides current (i.e., during discharge), spongy lead ( $\\mathrm{Pb}$ ) is oxidised to $\\mathrm{Pb}^{2+}$ ions and negative charge accumulates on lead plates. The $\\mathrm{Pb}^{2+}$ ions so formed combine with $\\mathrm{SO}_4^{2-}$ ions from $\\mathrm{H}_2 \\mathrm{SO}_4$ to form insoluble $\\mathrm{PbSO}_4$. The overall oxidation is the sum of these two processes.\n$$\n\\begin{aligned}\n& \\mathrm{Pb}_{(\\mathrm{s})} \\longrightarrow \\mathrm{Pb}_{(\\text {(4) }}^{2+}+2 \\mathrm{e}^{-} \\quad \\text { (oxidation) } \\\\\n& \\mathrm{Pb}_{(\\text {(aq) }}^{2+}+\\mathrm{SO}_{4(\\text { (4) })}^{2-} \\longrightarrow \\mathrm{PbSO}_{4(\\mathrm{~s})} \\quad \\text { (precipitation) } \\\\\n& \\hline \\mathrm{Pb}_{(\\mathrm{s})}+\\mathrm{SO}_{4(\\text { (aq) }}^{2-} \\longrightarrow \\mathrm{PbSO}_{4(\\mathrm{~s})}+2 \\mathrm{e}^{-}\n\\end{aligned}\n$$\n(Overall oxidation)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b10279619d9d8a2e97", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Identify the gas produced due to reduction of $\\mathrm{NH}_4^{+}$ions at cathode during working of dry cell.", "image": null}, "options": [{"id": "uZLRx", "text": "Ammonia", "image": null, "isCorrect": false}, {"id": "fAt2G", "text": "Hydrogen", "image": null, "isCorrect": true}, {"id": "aawrB", "text": "Hydrogen chloride", "image": null, "isCorrect": false}, {"id": "F3LXd", "text": "Chlorine", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a dry cell, at cathode, $\\mathrm{NH}_4^{+}$ions are reduced and hydrogen gas is produced.\n$2 \\mathrm{NH}_{4(\\mathrm{aq})}^{+}+2 \\mathrm{e}^{-} \\longrightarrow 2 \\mathrm{NH}_{3(\\mathrm{aq})}+\\mathrm{H}_{2(\\mathrm{~g})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261890279619d9d8a2d5b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "Which of the following is NOT an example of secondary voltaic cell?", "image": null}, "options": [{"id": "xxm1a", "text": "Nickel-cadmium cell", "image": null, "isCorrect": false}, {"id": "SiP65", "text": "Dry cell", "image": null, "isCorrect": true}, {"id": "5sGZc", "text": "Lead storage battery", "image": null, "isCorrect": false}, {"id": "30TJy", "text": "Mercury cell", "image": null, "isCorrect": false}], "corre
