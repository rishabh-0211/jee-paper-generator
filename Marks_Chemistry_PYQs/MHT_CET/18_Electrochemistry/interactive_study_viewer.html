", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "The conductivity of $0.3 \\mathrm{M}$ solution of $\\mathrm{KCl}$ at $298 \\mathrm{~K}$ is $0.0627 \\mathrm{~S} \\mathrm{~cm}^1$. What is its molar conductivity?", "image": null}, "options": [{"id": "lGph9", "text": "$104 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "aNnU6", "text": "$188 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "iZT6M", "text": "$209 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "7UUPH", "text": "$109 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\Lambda_{\\mathrm{m}}=\\frac{\\mathrm{k} \\times 1000}{\\mathrm{M}} \\\\ & \\mathrm{k}=0.0627 \\mathrm{~S} \\mathrm{~cm}^1 \\\\ & \\mathrm{M}=0.3 \\\\ & =\\frac{0.0627 \\times 1000}{0.3} \\\\ & =209 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260980279619d9d8a25c5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "The resistance of $0.2 \\mathrm{M}$ solution of an electrolyte is $30 \\mathrm{ohm}$ and conductivity are $1.2 \\mathrm{~S} \\mathrm{~m}^{-1}$. What is the value of cell constant?", "image": null}, "options": [{"id": "X5IeL", "text": "$0.47 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "KHzFX", "text": "$0.1 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "WYzf3", "text": "$0.36 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "vomNF", "text": "$0.2 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Conductivity }(\\mathrm{k})=\\frac{1}{\\mathrm{R}} \\cdot \\frac{1}{\\mathrm{~A}} \\quad \\frac{1}{\\mathrm{~A}}=\\text { cell constant } \\\\ & \\frac{1}{\\mathrm{~A}}=\\mathrm{k} \\times \\mathrm{R}=1.2 \\times 30 \\\\ & =36 \\mathrm{~m}^{-1} \\\\ & =\\frac{36}{100} \\mathrm{~cm}^{-1} \\\\ & \\frac{1}{\\mathrm{~A}}=0.36 \\mathrm{~cm}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260960279619d9d8a25b8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "The conductivity of $0.04 \\mathrm{M} \\mathrm{BaCl}_2$ solution is $0.0112 \\Omega^{-1} \\mathrm{~cm}^{-1}$ at $25^{\\circ} \\mathrm{C}$. what is it's molar conductivity?", "image": null}, "options": [{"id": "BzEb8", "text": "$357.0 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "XH19U", "text": "$140.0 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "aF8wb", "text": "$44.8 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "KRu2o", "text": "$280.0 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\Lambda_{\\mathrm{m}}=\\frac{\\mathrm{k} \\times 1000}{\\mathrm{M}}\n$$\nConductivity $(\\mathrm{k})=0.0112 \\Omega^{-1} \\mathrm{~cm}^{-1}$\n$$\n\\begin{aligned}\n& \\Lambda_{\\mathrm{m}}=\\frac{0.0112 \\times 1000}{0.04} \\\\\n& =280 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260890279619d9d8a2549", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "What is the conductivity of $0.02 \\mathrm{M} \\mathrm{KCl}$ solution if cell constant is $1.29 \\mathrm{~cm}^{-1}$ with resistance $645 \\Omega$ ?", "image": null}, "options": [{"id": "Pg4si", "text": "$5.0 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "coniI", "text": "$2.0 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "rDUxQ", "text": "$8.3 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "U1o7Y", "text": "$2.5 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{K}=\\frac{1}{\\mathrm{R}} \\cdot \\frac{\\ell}{\\mathrm{A}} \\quad\\left(\\text { Cell constant }=\\frac{\\ell}{\\mathrm{A}}\\right) \\\\ & \\mathrm{K}=\\frac{1}{645} \\times 1.29 \\\\ & =0.002 \\\\ & =2 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260850279619d9d8a252b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "Electrical conductance due to all the ions in $1 \\mathrm{~cm}^3$ of given solution is called as", "image": null}, "options": [{"id": "uMV5a", "text": "Molar conductivity", "image": null, "isCorrect": false}, {"id": "50aY4", "text": "Resistivity", "image": null, "isCorrect": false}, {"id": "FQiOV", "text": "Conductivity", "image": null, "isCorrect": true}, {"id": "S2w1R", "text": "Electrical conductance", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Specific conductance/Conductivity (к):-\nIt is defined as the reciprocal of specific resistance, $\\kappa=\\frac{1}{\\rho}$\n$$\n\\begin{aligned}\n\\mathrm{R} & =\\rho \\frac{\\ell}{\\mathrm{A}} \\\\\n\\frac{1}{\\rho} & =\\frac{1}{\\mathrm{R}} \\cdot \\frac{\\ell}{\\mathrm{A}} \\\\\n\\mathrm{K} & =\\mathrm{G} \\times \\mathrm{G}^{\\circ}\n\\end{aligned}\n$$\nSpecific conductance $=$ Conductance $\\times$ cell constant Hence specific conductivity of a solution is defined as the conductance offered by $1 \\mathrm{~cm}^3$ of electrolytic solution. Unit of $\\mathrm{\\kappa}$ is ohm ${ }^{-1} \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260760279619d9d8a24ac", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "What is the resistance of $0.01 \\mathrm{M} \\mathrm{KCl}$ solution if its conductivity is $200 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$ and cell constant is $1 \\mathrm{~cm}^{-1}$ ?", "image": null}, "options": [{"id": "t2Fd1", "text": "$1 \\times 10^{-3} \\mathrm{ohm}$", "image": null, "isCorrect": false}, {"id": "yCpKW", "text": "$5 \\times 10^{-3} \\mathrm{ohm}$", "image": null, "isCorrect": true}, {"id": "hMFPV", "text": "$4 \\times 10^{-3} \\mathrm{ohm}$", "image": null, "isCorrect": false}, {"id": "LiXjv", "text": "$2 \\times 10^{-3} \\mathrm{ohm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Conductivity }=\\frac{1}{\\mathrm{R}} \\cdot \\frac{\\ell}{\\mathrm{A}} \\\\ & \\frac{\\ell}{\\mathrm{A}}=\\text { cell constant } \\\\ & 200=\\frac{1}{\\mathrm{R}} \\times 1 \\\\ & \\mathrm{R}=\\frac{1}{200} \\mathrm{ohm} \\\\ & \\mathrm{R}=5 \\times 10^{-3} \\mathrm{ohm}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260730279619d9d8a249b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "Molar conductivity of $0.04 \\mathrm{M} \\mathrm{BaCl}_2$ solution is $230 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ at $27^{\\circ} \\mathrm{C}$. what is its conductivity?", "image": null}, "options": [{"id": "3gAwg", "text": "$2.3 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "dr1Ys", "text": "$9.2 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "LLLLS", "text": "$6.9 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "Ziztv", "text": "$4.6 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\Lambda_{\\mathrm{m}}=\\frac{\\mathrm{k} \\times 100}{\\mathrm{M}} \\\\ & 230=\\frac{\\mathrm{k} \\times 100}{0.04} \\\\ & \\mathrm{k}=\\frac{230 \\times 0.04}{1000} \\\\ & =9.2 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260710279619d9d8a248b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "Which from following electrolytes, molar conductivity is determined using Kohlrausch theory?", "image": null}, "options": [{"id": "vLYRd", "text": "$\\mathrm{KCl}$", "image": null, "isCorrect": false}, {"id": "W2K2b", "text": "$\\mathrm{Na}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": false}, {"id": "NDzAw", "text": "$\\mathrm{CH}_3 \\mathrm{COOH}$", "image": null, "isCorrect": true}, {"id": "9Bz93", "text": "$\\mathrm{HCl}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Kohlrausch law is used to determine limiting molar conductivity of weak electrotytes.\n$\\mathrm{CH}_3 \\mathrm{COOH} \\rightarrow$ weak electrolyte\n$\\mathrm{KCl}, \\mathrm{Na}_2 \\mathrm{SO}_4, \\mathrm{HCl} \\rightarrow$ Strong electrolytes", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260610279619d9d8a2403", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "What will be the concentration of solution of electrolyte if it's molar conductivity and conductivity are respectively $230 \\Omega^{-1}$ $\\mathrm{cm}^2 \\mathrm{~mol}^{-1}$ and $0.0115 \\Omega^{-1} \\mathrm{~cm}^{-1}$ at $298 \\mathrm{~K}$ ?", "image": null}, "options": [{"id": "rby0o", "text": "$0.04 \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "VLMbY", "text": "$0.03 \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "FF9Zr", "text": "$0.01 \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "5lEQ2", "text": "$0.05 \\mathrm{M}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\Lambda_{\\mathrm{m}}=\\frac{\\mathrm{k} \\times 1000}{\\mathrm{M}}\\left(\\begin{array}{c}\\Lambda_{\\mathrm{m}}=\\text { Molar Conductivity } \\\\ \\mathrm{k}=\\text { Conductivity }\\end{array}\\right) \\\\ & 230=\\frac{0.0115 \\times 1000}{\\mathrm{M}} \\\\ & \\mathrm{M}=\\frac{0.0115 \\times 1000}{230}=0.05 \\mathrm{M}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260510279619d9d8a2382", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "Which among the following statements is true for conductivity?", "image": null}, "options": [{"id": "GzJTD", "text": "It is inversely proportional to resistivity.", "image": null, "isCorrect": true}, {"id": "UqVWu", "text": "It is inversely proportional to molar conductivity.", "image": null, "isCorrect": false}, {"id": "TEbGD", "text": "It is directly proportional to resistivity.", "image": null, "isCorrect": false}, {"id": "Di1XD", "text": "It is directly proportional to resistance.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Specific conductance/ Conductivity (k): -\nIt is defined as the reciprocal of specific resistance, or resistivity, $\\mathrm{k}=\\frac{1}{\\rho}$\n$$\n\\begin{aligned}\n& \\mathrm{R}=\\rho \\frac{\\ell}{\\mathrm{A}} \\\\\n& \\frac{1}{\\rho}=\\frac{1}{\\mathrm{R}} \\cdot \\frac{\\ell}{\\mathrm{A}} \\\\\n& \\mathrm{k}=\\mathrm{G} \\times \\mathrm{G}^*\n\\end{aligned}\n$$\nSpecific conductance $=$ Conductance $\\times$ Cell constant\nHence specific conductivity of a solution is defined as the conductance offered by $1 \\mathrm{~cm}^3$ of electrolytic solution.\nUnit of $\\mathrm{k}$ is ohm ${ }^{-1} \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604e0279619d9d8a236d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "The molar conductivity of $0.4 \\mathrm{M} \\mathrm{KCl}$ solution is $2.5 \\times 10^5 \\Omega^{-1}$ $\\mathrm{cm}^2 \\mathrm{~mol}^{-1}$. What is the resistivity of solution?", "image": null}, "options": [{"id": "p4E8N", "text": "$2.1 \\times 10^2$", "image": null, "isCorrect": false}, {"id": "7miQe", "text": "$2.5 \\times 10^2$", "image": null, "isCorrect": false}, {"id": "gjTpj", "text": "$1 \\times 10^{-2}$", "image": null, "isCorrect": true}, {"id": "ElllI", "text": "$2.8 \\times 10^{-2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\Lambda_{\\mathrm{m}}=\\frac{\\mathrm{k} \\times 1000}{\\mathrm{M}} \\\\\n& 2.5 \\times 10^5=\\frac{\\mathrm{k} \\times 1000}{0.4} \\\\\n& \\text { Conductivity }(\\mathrm{k})=\\frac{1}{\\rho(\\text { resistivity })} \\\\\n& =\\frac{2.5 \\times 10^5 \\times 0.4}{1000} \\\\\n& =100 \\Omega^{-1} \\mathrm{~cm}^{-1} \\\\\n& \\rho=\\frac{1}{\\mathrm{k}}=\\frac{1}{100}=10^{-2} \\Omega \\mathrm{cm}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2603f0279619d9d8a22ee", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "A conductivity cell shows resistance of $600 \\mathrm{ohm}$. If conductivity of $0.01 \\mathrm{M} \\mathrm{KCl}$ is $0.0015 \\Omega^{-1} \\mathrm{~cm}^{-1}$, what is cell constant?", "image": null}, "options": [{"id": "pEdCK", "text": "$0.60 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "ijXrL", "text": "$0.45 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "rBKjo", "text": "$0.90 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "PPIZV", "text": "$75 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{R}=600 \\Omega, \\mathrm{k}_{\\mathrm{KCl}}=0.0015 \\Omega^{-} \\mathrm{cm}^{-1}, \\mathrm{c}=0.01 \\mathrm{M} \\text { Cell constant }= \\\\\n& \\mathrm{k}_{\\mathrm{KCl}} \\times \\mathrm{R}_{\\text {solution }}=0.0015 \\Omega^{-1} \\mathrm{~cm}^{-1} \\times 600 \\Omega=0.90 \\mathrm{~cm}^{-1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2603e0279619d9d8a22e6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "The molar conductivity of $0.1 \\mathrm{M} \\mathrm{BaCl}_2$ solution is $106 \\Omega^{-1} \\mathrm{~cm}^2$ $\\mathrm{mol}^{-1}$ at $25^{\\circ} \\mathrm{C}$. What is it's conductivity?", "image": null}, "options": [{"id": "JKUqp", "text": "$1.06 \\times 10^{-2} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "PX45h", "text": "$5.03 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "dwnHT", "text": "$3.66 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "TH3kc", "text": "$2.6 \\times 10^{-2} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\wedge=\\frac{1000 \\mathrm{k}}{\\mathrm{C}} \\quad \\therefore \\mathrm{k}=\\frac{\\wedge \\mathrm{c}}{1000}\n$$\nNow, $\\wedge=106 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}, \\mathrm{c}=0.1 \\mathrm{~mol} \\mathrm{~L}^{-1}$\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{k}=\\frac{106 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1} \\times 0.1 \\mathrm{molL}^{-1}}{1000 \\mathrm{~cm}^3 \\mathrm{~L}^{-1}} \\\\\n& \\therefore \\mathrm{k}=1.06 \\times 10^{-2} \\Omega^{-1} \\mathrm{~cm}^{-1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2602b0279619d9d8a2252", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "What is the molar conductivity of $0.05 \\mathrm{M}$ solution of sodium hydroxide, if its conductivity is $0.0118 \\mathrm{~S} \\mathrm{~cm}^{-1}$ at $298 \\mathrm{~K}$ ?", "image": null}, "options": [{"id": "5uk4x", "text": "$236 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "FiX27", "text": "$423 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "zqdQS", "text": "$354\\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "Ij44B", "text": "$590 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{M}=0.05, \\mathrm{k}(\\text { conductivity })=0.0118 \\mathrm{Scm}^{-1} \\\\ & \\Lambda_{\\mathrm{m}}=\\frac{\\mathrm{k} \\times 1000}{\\mathrm{M}} \\\\ & \\Lambda_{\\mathrm{m}}=\\frac{0.0118 \\times 1000}{0.05} \\\\ & \\Lambda_{\\mathrm{m}}=236 \\mathrm{Scm}^2 \\cdot \\mathrm{mol}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2602a0279619d9d8a2248", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "Which among the following aqueous salt solution is used in conductivity cell to determine cell constant?", "image": null}, "options": [{"id": "QelSh", "text": "$\\mathrm{AgNO}_3$", "image": null, "isCorrect": false}, {"id": "dpMwN", "text": "$\\mathrm{ZnSO}_4$", "image": null, "isCorrect": false}, {"id": "m2HPo", "text": "$\\mathrm{KCl}$", "image": null, "isCorrect": true}, {"id": "dCInP", "text": "$\\mathrm{CuSO}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The cell constant is generally found by measuring the conductivity of an aqueous solution of $\\mathrm{KCl}$ because its conductivity is known accurately at various concentrations and at different temperatures.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260140279619d9d8a2196 ct": false}, {"id": "UuLoI", "text": "$2 \\cdot 5 \\times 10^{-2} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "YdpYn", "text": "$4 \\cdot 0 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{C}=0.01 \\mathrm{~M}, \\quad \\wedge=400.0 ~\\Omega^{-1} \\mathrm{~cm}^{2} \\mathrm{~mol}^{-1}$\n$\\mathrm{k}=?$\n$\\wedge=\\frac{1000 \\mathrm{~k}}{\\mathrm{C}} \\quad \\therefore \\mathrm{k}=\\frac{\\wedge \\times \\mathrm{C}}{1000}$\n$\\therefore \\mathrm{k}=\\frac{400.0 \\times 0.01}{1000}=4.0 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fe00279619d9d8a1ff7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "The distance between electrodes of a conductivity cell is $0.98 \\mathrm{~cm}$ and area of cross section is $1.96 \\mathrm{~cm}^{2} .$ What is the cell constant?", "image": null}, "options": [{"id": "fMBHi", "text": "$1 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "Idyaf", "text": "$1.5 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "79C70", "text": "$2 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "Vg4zr", "text": "$0.5 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(C)\nCell constant, $\\mathrm{b}=\\frac{\\ell}{\\mathrm{a}}=\\frac{0.98 \\mathrm{~cm}}{1.96 \\mathrm{~cm}^{2}}=0.5 \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fcb0279619d9d8a1f4f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "If resistivity of $0.8 \\mathrm{M} \\mathrm{KCl}$ solution is $2 \\cdot 5 \\times 10^{-3} \\Omega \\mathrm{cm} .$ Calculate molar conductivity of solution?", "image": null}, "options": [{"id": "cvAiR", "text": "$3 \\times 10^{5} \\Omega^{-1} \\mathrm{~cm}^{2} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "A9atA", "text": "$2 \\times 10^{5} \\Omega^{-1} \\mathrm{~cm}^{2} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "6JkSV", "text": "$4 \\times 10^{5} \\Omega^{-1} \\mathrm{~cm}^{2} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "GRL5f", "text": "$5 \\times 10^{5} \\Omega^{-1} \\mathrm{~cm}^{2} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(A)\n$\\begin{array}{l}\n\\text { Conductivity }(\\mathrm{k})=\\frac{1}{\\text { resistivity }}=\\frac{1}{2.5 \\times 10^{-3} \\Omega \\mathrm{cm}}=0.4 \\times 10^{3} \\Omega^{-1} \\mathrm{~cm}^{-1} \\\\\n\\text { Molar conductivity } \\quad\\left(\\Lambda_{\\mathrm{m}}\\right)=\\frac{1000 \\mathrm{k}}{\\mathrm{C}}=\\frac{1000 \\mathrm{~cm}^{3} \\mathrm{~L}^{-1} \\times 0.4 \\times 10^{3} \\Omega^{-1} \\mathrm{~cm}^{-1}}{0.8 \\mathrm{~mol} \\mathrm{~L}^{-1}}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fbb0279619d9d8a1ed0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "What will be the concentration of NaCl solution, if the molar conductivity and conductivity of NaCl solution is $124 \\cdot 3 \\Omega^{-1} \\mathrm{~cm}^{2} \\mathrm{~mol}^{-1}$ and $1 \\cdot 243 \\times 10^{-4} \\Omega^{-1} \\mathrm{~cm}^{2}$\nrespectively?", "image": null}, "options": [{"id": "KQpzu", "text": "$0.001$ mol $\\mathrm{L}^{-1}$", "image": null, "isCorrect": true}, {"id": "iPv2j", "text": "$0.01 \\mathrm{~mol} \\mathrm{~L}^{-1}$", "image": null, "isCorrect": false}, {"id": "PyDuW", "text": "$0.02$ mol $I_{1}^{-1}$", "image": null, "isCorrect": false}, {"id": "ZMKhY", "text": "$0.1 \\mathrm{~mol} \\mathrm{~L}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\n$\\begin{array}{l}\n\\Lambda=124.3 \\Omega^{-1} \\mathrm{~cm}^{2} \\mathrm{~mol}^{-1}, \\mathrm{k}=1.243 \\times 10^{-4} \\Omega^{-1} \\mathrm{~cm}^{2} \\\\\n\\mathrm{C}=? \\\\\n\\wedge=\\frac{1000 \\mathrm{k}}{\\mathrm{C}} \\quad \\therefore \\mathrm{C}=\\frac{1000 \\mathrm{k}}{\\wedge} \\\\\n\\therefore \\mathrm{C}=\\frac{1000 \\times 1.243 \\times 10^{-4}}{124.3}=0.001 \\mathrm{~mol} \\mathrm{~L}^{-1}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f900279619d9d8a1d7f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "What is the relation between cell constant, conductivity and electrical resistance?", "image": null}, "options": [{"id": "mekVj", "text": "$\\mathrm{k}=\\frac{\\mathrm{R}}{\\mathrm{b}}$", "image": null, "isCorrect": false}, {"id": "putP5", "text": "$\\mathrm{k}=\\frac{\\mathrm{b}}{\\mathrm{R}}$", "image": null, "isCorrect": true}, {"id": "wkVRt", "text": "$\\mathrm{k}=\\frac{1}{\\mathrm{R} . \\mathrm{b}}$", "image": null, "isCorrect": false}, {"id": "Q4iZj", "text": "$\\mathrm{k}=\\mathrm{R} \\cdot \\mathrm{b}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{E}_{\\mathrm{cell}}^{0}=0.463 \\mathrm{~V}, \\quad \\mathrm{E}_{\\mathrm{Cu}}^{0}=0.337 \\mathrm{~V}$\n$\\mathrm{E}_{\\mathrm{cell}}^{0}=\\mathrm{E}_{\\mathrm{Ag}}^{0}-\\mathrm{E}_{\\mathrm{Cu}}^{0}$\n$\\therefore \\mathrm{E}_{\\mathrm{Ag}}^{0}=\\mathrm{E}_{\\mathrm{cell}}^{0}+\\mathrm{E}_{\\mathrm{Cu}}^{0}=0.463+0.337=0.800 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f7f0279619d9d8a1cf8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "If the conductivity of $0.08 \\mathrm{M}$ KCl solution is $2 \\times 10^{-2} \\Omega^{-1}$, what is the molar conductivity of the solution?", "image": null}, "options": [{"id": "Y0a7B", "text": "350 $\\Omega^{-1} \\mathrm{Cm}^{2} \\mathrm{mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "4mv5l", "text": "250 $\\Omega^{-1} \\mathrm{Cm}^{2} \\mathrm{mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "5OkAa", "text": "25.0 $\\Omega^{-1} \\mathrm{Cm}^{2} \\mathrm{mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "c3fEV", "text": "0.25 $\\Omega^{-1} \\mathrm{Cm}^{2} \\mathrm{mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\Lambda=\\frac{1000 \\mathrm{k}}{\\mathrm{C}}=\\frac{1000 \\times 2 \\times 10^{-2}}{0.08}=250 \\Omega^{-1} \\mathrm{~cm}^{2} \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f6c0279619d9d8a1c5d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "What is the molar conductivity at infinite dilution of $\\mathrm{CaCl}_{2}$, if the molar conductivity of $\\mathrm{Ca}^{2+}$ ion and $\\mathrm{Cl}^{-}$ ion at infinite dilution is 119 and $71 \\Omega^{-1} \\mathrm{~cm}^{2}$ $\\mathrm{mol}^{-1}$", "image": null}, "options": [{"id": "Mpel0", "text": "$431 \\cdot 0 \\Omega^{-1} \\mathrm{~cm}^{2} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "HGlAC", "text": "$341 \\cdot 0 \\Omega^{-1} \\mathrm{~cm}^{2} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "3LjuB", "text": "$261 \\cdot 0 \\Omega^{-1} \\mathrm{~cm}^{2} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "9Sln2", "text": "$126 \\cdot 0 \\Omega^{-1} \\mathrm{~cm}^{2} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "By Kohlrausch Law of independent migration of ions,\n$$\n\\begin{aligned}\n\\wedge_{0\\left(\\mathrm{CaCl}_{2}\\right)} &=\\lambda_{\\mathrm{Ca}^{2+}}^{0}+2 \\lambda_{\\mathrm{Cl}^{-}}^{0} \\\\\n&=119+2(71) \\\\\n&=261.0 \\Omega^{-1} \\mathrm{~cm}^{2} \\mathrm{~mol}^{-1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f6b0279619d9d8a1c4e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "What is the cell constant of $\\frac{\\mathrm{N}}{10} \\mathrm{KCl}$ solution at $25^{\\circ} \\mathrm{C}$, if conductivity and resistance of a solution is $0.0112 \\Omega^{-1} \\mathrm{~cm}^{-1}$ and $55 \\cdot 0 \\Omega$ respectively?", "image": null}, "options": [{"id": "3iQ00", "text": "$0.616 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "4FXl2", "text": "$0 \\cdot 491 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "hWuh7", "text": "$2 \\cdot 0 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "AnC2g", "text": "$0 \\cdot 2 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n\\mathrm{k}=0.0112 \\Omega^{-1} \\mathrm{~cm}^{-1} &, \\mathrm{R}=55.0 \\Omega \\\\\n\\text { Cell constant, } \\mathrm{b} &=\\mathrm{k} \\times \\mathrm{R} \\\\\n&=0.0112 \\Omega^{-1} \\mathrm{~cm}^{-1} \\times 55.0 \\Omega \\\\\n\\therefore \\mathrm{b} &=0.616 \\mathrm{~cm}^{-1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f590279619d9d8a1bc3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "Conductivity cell is filled with $0.01$ M KCl gives a resistance of $484 \\Omega$ and conductivity of $0.00141 \\Omega^{-1} \\mathrm{~cm}^{-1}$ at $25^{\\circ} \\mathrm{C}$. What is cell constant?", "image": null}, "options": [{"id": "EQztx", "text": "$0 \\cdot 682 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "n5jZ4", "text": "$0 \\cdot 341 \\mat     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
