ortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3618c30a4553e1be31b", "type": "singleCorrect", "question": {"text": "Match List I with List II.<br><table style=\"border: 1px solid black; border-collapse: collapse; width: auto;\"><tr><th style=\"border: 1px solid black; padding: 10px;\">List I (Conversion)</th><th style=\"border: 1px solid black; padding: 10px;\">List II (Number of Faraday required)</th></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">A. $1$ mole of $\\text{H}_2\\text{O}$ to $\\text{O}_2$</td><td style=\"border: 1px solid black; padding: 10px;\">I. $3F$</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">B. $1$ mol of $\\text{MnO}_4^-$ to $\\text{Mn}^{2+}$</td><td style=\"border: 1px solid black; padding: 10px;\">II. $2F$</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">C. $1.5$ mol of Ca from molten $\\text{CaCl}_2$</td><td style=\"border: 1px solid black; padding: 10px;\">III. $1F$</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">D. $1$ mol of FeO to $\\text{Fe}_2\\text{O}_3$</td><td style=\"border: 1px solid black; padding: 10px;\">IV. $5F$</td></tr></table>Choose the correct answer from the options given below :", "image": null}, "options": [{"id": "Q659m", "label": "A", "text": "A-II, B-IV, C-I, D-III", "isCorrect": true, "image": null}, {"id": "3RqWm", "label": "B", "text": "A-III, B-IV, C-I, D-II", "isCorrect": false, "image": null}, {"id": "NoELR", "label": "C", "text": "A-II, B-III, C-I, D-IV", "isCorrect": false, "image": null}, {"id": "uLyuj", "label": "D", "text": "A-III, B-IV, C-II, D-I", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In conversion A, $H_2O \\rightarrow \\dfrac{1}{2}O_2 + 2H^+ + 2e^-$, the charge required for $1$ mole of $H_2O$ is $2F$.<br><br>In conversion B, $MnO_4^- + 8H^+ + 5e^- \\rightarrow Mn^{2+} + 4H_2O$, the oxidation state of Mn changes from $+7$ to $+2$, so the charge required for $1$ mole of $MnO_4^-$ is $5F$.<br><br>In conversion C, $Ca^{2+} + 2e^- \\rightarrow Ca$, the charge required for $1$ mole of $Ca$ is $2F$. Therefore, the charge required for $1.5$ moles of $Ca$ is $1.5 \\times 2F = 3F$.<br><br>In conversion D, $Fe^{2+} \\rightarrow Fe^{3+} + e^-$, the oxidation state of Fe changes from $+2$ in $FeO$ to $+3$ in $Fe_2O_3$, so the charge required for $1$ mole of $FeO$ is $1F$.<br><br>Matching these values yields A-II, B-IV, C-I, D-III.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b88c30a4553e1bdc14", "type": "singleCorrect", "question": {"text": "Which of the following statements is correct regarding electrolysis of molten NaCl?", "image": null}, "options": [{"id": "zddy5", "label": "A", "text": "Pale green $\\text{Cl}_2$ gas released at anode", "isCorrect": false, "image": null}, {"id": "rQGzm", "label": "B", "text": "Molten silvery white sodium is deposited at cathode", "isCorrect": false, "image": null}, {"id": "8zKE4", "label": "C", "text": "Decomposition of NaCl into Na metal and $\\text{Cl}_2$ gas", "isCorrect": false, "image": null}, {"id": "2qyXo", "label": "D", "text": "Both options A and B", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "During the electrolysis of molten $\\text{NaCl}$, the ions present are $\\text{Na}^+$ and $\\text{Cl}^-$.<br><br>At the cathode (reduction):<br>$\\text{Na}^+ + e^- \\rightarrow \\text{Na}(l)$<br>Since the operating temperature is much higher than the melting point of sodium, molten silvery-white sodium metal is deposited at the cathode.<br><br>At the anode (oxidation):<br>$2\\text{Cl}^- \\rightarrow \\text{Cl}_2(g) + 2e^-$<br>Pale green chlorine gas is liberated at the anode.<br><br>Since both statements A and B correctly describe the observations at the respective electrodes during the electrolysis process, the correct choice is both A and B.<br><br>Answer: Both options A and B", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bedbf9280d7f9932db9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What product is obtained by electrolysis of $50 \\%$ solution of sulfuric acid on further hydrolysis?", "image": null}, "options": [{"id": "Hyd99", "text": "$\\mathrm{H}_2 \\mathrm{O}_2$", "image": null, "isCorrect": true}, {"id": "FMchC", "text": "$\\mathrm{H}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "L2TlH", "text": "$\\mathrm{SO}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "yQhtj", "text": "$\\mathrm{H}_2 \\mathrm{~S}_2 \\mathrm{O}_8$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Electrolysis of $50 \\%$ solution of sulfuric acid produces peroxydisulfuric acid ($\\mathrm{H}_2\\mathrm{S}_2\\mathrm{O}_8$) at the anode.<br><br>$2\\mathrm{HSO}_4^- \\rightarrow \\mathrm{H}_2\\mathrm{S}_2\\mathrm{O}_8 + 2e^-$<br><br>Further hydrolysis of peroxydisulfuric acid yields hydrogen peroxide ($\\mathrm{H}_2\\mathrm{O}_2$) and sulfuric acid.<br><br>$\\mathrm{H}_2\\mathrm{S}_2\\mathrm{O}_8 + 2\\mathrm{H}_2\\mathrm{O} \\rightarrow 2\\mathrm{H}_2\\mathrm{SO}_4 + \\mathrm{H}_2\\mathrm{O}_2$<br><br>Thus, the product obtained is $\\mathrm{H}_2\\mathrm{O}_2$.<br><br>Answer: $\\mathrm{H}_2 \\mathrm{O}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871becbf9280d7f9932dad", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the quantity of electricity required to liberate $0.224 \\mathrm{dm}^3$ of chlorine at STP during the electrolysis of fused sodium chloride?", "image": null}, "options": [{"id": "SA7n3", "text": "1930 C", "image": null, "isCorrect": true}, {"id": "pu4DV", "text": "1090 C", "image": null, "isCorrect": false}, {"id": "WaWiw", "text": "96500 C", "image": null, "isCorrect": false}, {"id": "lVpE8", "text": "965 C", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction for the liberation of chlorine gas at the anode is:<br><br>$2\\text{Cl}^- \\rightarrow \\text{Cl}_2(g) + 2e^-$<br><br>Volume of $\\text{Cl}_2$ gas liberated at STP = $0.224 \\text{ dm}^3$<br><br>Number of moles of $\\text{Cl}_2$ gas = $\\dfrac{0.224}{22.4} = 0.01 \\text{ mol}$<br><br>From the reaction, $1 \\text{ mol}$ of $\\text{Cl}_2$ requires $2 \\text{ mol}$ of electrons.<br><br>Number of moles of electrons required = $2 \\times 0.01 = 0.02 \\text{ mol}$<br><br>Quantity of electricity required $Q = n \\times F$<br><br>$Q = 0.02 \\times 96500 \\text{ C} = 1930 \\text{ C}$<br><br>Answer: 1930 C", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871becbf9280d7f9932daa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following is common for electrolysis of molten NaCl and aqueous NaCl ?", "image": null}, "options": [{"id": "ROxqH", "text": "$\\mathrm{Cl}_2$ gas is liberated at anode.", "image": null, "isCorrect": true}, {"id": "hTjDs", "text": "$\\mathrm{H}_{2(\\mathrm{~g})}$ is liberated at cathode.", "image": null, "isCorrect": false}, {"id": "pXLV7", "text": "$\\mathrm{Na}_{(\\mathrm{s})}$ is collected at cathode.", "image": null, "isCorrect": false}, {"id": "1nKvV", "text": "NaCl is converted to $\\mathrm{NaOH}_{(\\mathrm{aq})}$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "During the electrolysis of molten NaCl:<br>At cathode: $\\mathrm{Na}^{+} + \\mathrm{e}^{-} \\rightarrow \\mathrm{Na}_{(\\mathrm{s})}$<br>At anode: $2\\mathrm{Cl}^{-} \\rightarrow \\mathrm{Cl}_{2(\\mathrm{g})} + 2\\mathrm{e}^{-}$<br><br>During the electrolysis of aqueous NaCl:<br>At cathode: $2\\mathrm{H}_2\\mathrm{O}_{(\\mathrm{l})} + 2\\mathrm{e}^{-} \\rightarrow \\mathrm{H}_{2(\\mathrm{g})} + 2\\mathrm{OH}^{-}_{(\\mathrm{aq})}$ (since the reduction potential of water is higher than that of $\\mathrm{Na}^{+}$)<br>At anode: $2\\mathrm{Cl}^{-} \\rightarrow \\mathrm{Cl}_{2(\\mathrm{g})} + 2\\mathrm{e}^{-}$ (due to overvoltage of $\\mathrm{O}_2$, $\\mathrm{Cl}_2$ is liberated instead of $\\mathrm{O}_2$)<br><br>Thus, the liberation of $\\mathrm{Cl}_2$ gas at the anode is common to both processes.<br><br>Answer: $\\mathrm{Cl}_2$ gas is liberated at anode.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be1bf9280d7f9932d3d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following net cell reaction takes place in a galvanic cell containing copper electrode and standard hydrogen electrode ?\n$\\mathrm{E}^{\\circ}\\left(\\mathrm{Cu}_{(\\mathrm{aq})}^{+2} \\mid \\mathrm{Cu}_{(\\mathrm{s})}\\right)=+0.34 \\mathrm{~V}$", "image": null}, "options": [{"id": "C5O2n", "text": "$\\mathrm{Cu}_{(\\mathrm{s})}+2 \\mathrm{H}_{(\\mathrm{aq})}^{+} \\longrightarrow \\mathrm{Cu}_{(\\mathrm{aq})}^{+2}+\\mathrm{H}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "dqRkb", "text": "$\\mathrm{H}_{2(\\mathrm{~g})}+\\mathrm{Cu}_{(\\mathrm{aq})}^{+2} \\longrightarrow 2 \\mathrm{H}_{(\\mathrm{aq})}^{+}+\\mathrm{Cu}_{(\\mathrm{s})}$", "image": null, "isCorrect": true}, {"id": "Z3wr0", "text": "$\\mathrm{Cu}_{(\\mathrm{s})}+\\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{Cu}_{(\\mathrm{aq})}^{+2}+2 \\mathrm{H}_{(\\mathrm{aq})}^{+}$", "image": null, "isCorrect": false}, {"id": "m6iFW", "text": "$\\mathrm{Cu}_{(\\mathrm{aq})}^{+2}+2 \\mathrm{H}_{(\\mathrm{aq})}^{+} \\longrightarrow \\mathrm{Cu}_{(\\mathrm{s})}+\\mathrm{H}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard reduction potential of the copper electrode is $E^{\\circ}(\\mathrm{Cu}^{+2} \\mid \\mathrm{Cu}) = +0.34 \\mathrm{~V}$.<br><br>The standard reduction potential of the standard hydrogen electrode (SHE) is $E^{\\circ}(\\mathrm{H}^{+} \\mid \\mathrm{H}_2) = 0.00 \\mathrm{~V}$.<br><br>Since the standard reduction potential of copper is greater than that of hydrogen, copper has a higher tendency to get reduced. Therefore, in the galvanic cell, the copper electrode acts as the cathode (where reduction occurs) and the standard hydrogen electrode acts as the anode (where oxidation occurs).<br><br>At anode (oxidation):<br>$\\mathrm{H}_{2(\\mathrm{g})} \\longrightarrow 2\\mathrm{H}^{+}_{(\\mathrm{aq})} + 2\\mathrm{e}^{-}$<br><br>At cathode (reduction):<br>$\\mathrm{Cu}^{+2}_{(\\mathrm{aq})} + 2\\mathrm{e}^{-} \\longrightarrow \\mathrm{Cu}_{(\\mathrm{s})}$<br><br>Adding the two half-cell reactions gives the net cell reaction:<br>$\\mathrm{H}_{2(\\mathrm{g})} + \\mathrm{Cu}^{+2}_{(\\mathrm{aq})} \\longrightarrow 2\\mathrm{H}^{+}_{(\\mathrm{aq})} + \\mathrm{Cu}_{(\\mathrm{s})}$<br><br>Answer: $\\mathrm{H}_{2(\\mathrm{~g})}+\\mathrm{Cu}_{(\\mathrm{aq})}^{+2} \\longrightarrow 2 \\mathrm{H}_{(\\mathrm{aq})}^{+}+\\mathrm{Cu}_{(\\mathrm{s})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be0bf9280d7f9932d33", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What happens to the emf for the cell , ${ }^{\\ominus} \\mathrm{Zn}_{(\\mathrm{s})}\\left|\\mathrm{Zn}^{+2}(1 \\mathrm{M})\\right|\\left|\\mathrm{Ag}^{+1}(1 \\mathrm{M})\\right| \\stackrel{\\oplus}{\\mathrm{Ag}}_{(\\mathrm{s})}$ if concentration of $\\mathrm{Ag}^{+1}$ decreases to 0.1 M ?", "image": null}, "options": [{"id": "erwXc", "text": "increase by 0.0592 V", "image": null, "isCorrect": false}, {"id": "MhdBh", "text": "decrease by 0.0592 V", "image": null, "isCorrect": true}, {"id": "bVm0f", "text": "increase by 0.0296 V", "image": null, "isCorrect": false}, {"id": "WRNlr", "text": "decrease by 0.0296 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The cell reaction is $\\mathrm{Zn}_{(\\mathrm{s})} + 2\\mathrm{Ag}^{+}_{(\\mathrm{aq})} \\rightarrow \\mathrm{Zn}^{2+}_{(\\mathrm{aq})} + 2\\mathrm{Ag}_{(\\mathrm{s})}$.<br><br>The number of electrons transferred is $n = 2$.<br><br>The Nernst equation for the cell is:<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - \\dfrac{0.0592}{2} \\log \\dfrac{[\\mathrm{Zn}^{2+}]}{[\\mathrm{Ag}^{+}]^2}$<br><br>Initially, $[\\mathrm{Zn}^{2+}] = 1 \\text{ M}$ and $[\\mathrm{Ag}^{+}] = 1 \\text{ M}$.<br><br>$E_{\\text{cell}, 1} = E^{\\circ}_{\\text{cell}} - \\dfrac{0.0592}{2} \\log \\dfrac{1}{1^2} = E^{\\circ}_{\\text{cell}}$<br><br>When $[\\mathrm{Ag}^{+}]$ decreases to $0.1 \\text{ M}$:<br><br>$E_{\\text{cell}, 2} = E^{\\circ}_{\\text{cell}} - \\dfrac{0.0592}{2} \\log \\dfrac{1}{(0.1)^2}$<br><br>$E_{\\text{cell}, 2} = E^{\\circ}_{\\text{cell}} - \\dfrac{0.0592}{2} \\log (100)$<br><br>$E_{\\text{cell}, 2} = E^{\\circ}_{\\text{cell}} - \\dfrac{0.0592}{2} \\times 2 = E^{\\circ}_{\\text{cell}} - 0.0592 \\text{ V}$<br><br>The emf of the cell decreases by $0.0592 \\text{ V}$.<br><br>Answer: decrease by 0.0592 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdfbf9280d7f9932d27", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is reduction potential of hydrogen gas electrode when pure hydrogen gas is at 1 atmospheric pressure and platinum electrode is in contact with HCl solution of PH 1 at 298 K ?", "image": null}, "options": [{"id": "fYsbA", "text": "-0.1184 V", "image": null, "isCorrect": false}, {"id": "bHLxD", "text": "-0.0592 V", "image": null, "isCorrect": true}, {"id": "fflrj", "text": "-0.0296 V", "image": null, "isCorrect": false}, {"id": "YFFOw", "text": "-0.592 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reduction half-reaction for the hydrogen electrode is:<br><br>$H^{+} + e^{-} \\rightarrow \\dfrac{1}{2}H_{2}(g)$<br><br>The Nernst equation for the reduction potential is given by:<br><br>$E = E^{\\circ} - \\dfrac{0.0592}{n} \\log_{10} \\dfrac{P_{H_{2}}^{1/2}}{[H^{+}]}$<br><br>For the standard hydrogen electrode, $E^{\\circ} = 0$ V. Here, $n = 1$, $P_{H_{2}} = 1$ atm, and $pH = 1$.<br><br>Since $pH = -\\log_{10}[H^{+}]$, we have $[H^{+}] = 10^{-1}$ M.<br><br>Substituting the values into the Nernst equation:<br><br>$E = 0 - \\dfrac{0.0592}{1} \\log_{10} \\dfrac{1^{1/2}}{10^{-1}}$<br><br>$E = -0.0592 \\log_{10} (10^{1})$<br><br>$E = -0.0592 \\times 1 = -0.0592$ V<br><br>Answer: -0.0592 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd0bf9280d7f9932ca8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{E}^{\\circ}\\left(\\mathrm{Cu}_{(\\mathrm{aq})}^{+2} \\mid \\mathrm{Cu}_{(\\mathrm{s})}\\right)=+0.34 \\mathrm{~V}$.\nWhat is potential for $\\mathrm{Cu}_{(\\mathrm{s})} \\rightarrow \\mathrm{Cu}_{(\\mathrm{aq})}^{+2}(0.1 \\mathrm{M})+2 \\overline{\\mathrm{e}}$ at 298 K ?", "image": null}, "options": [{"id": "CiNiI", "text": "+0.3696 V", "image": null, "isCorrect": false}, {"id": "OfcN8", "text": "-0.3696 V", "image": null, "isCorrect": false}, {"id": "29sgl", "text": "+0.3104 V", "image": null, "isCorrect": false}, {"id": "5y1Yh", "text": "-0.3104 V", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given standard reduction potential is $E^{\\circ}_{\\text{red}} = +0.34 \\text{ V}$.<br><br>The required reaction is an oxidation reaction:<br>$\\mathrm{Cu}_{(\\mathrm{s})} \\rightarrow \\mathrm{Cu}_{(\\mathrm{aq})}^{+2}(0.1 \\text{ M}) + 2 \\mathrm{e}^{-}$<br><br>The standard oxidation potential is:<br>$E^{\\circ}_{\\text{ox}} = -E^{\\circ}_{\\text{red}} = -0.34 \\text{ V}$<br><br>Using the Nernst equation for the oxidation potential at $298 \\text{ K}$:<br>$E_{\\text{ox}} = E^{\\circ}_{\\text{ox}} - \\dfrac{0.0592}{n} \\log_{10}[\\mathrm{Cu}^{+2}]$<br><br>Here, the number of electrons transferred is $n = 2$ and $[\\mathrm{Cu}^{+2}] = 0.1 \\text{ M}$.<br><br>$E_{\\text{ox}} = -0.34 - \\dfrac{0.0592}{2} \\log_{10}(0.1)$<br><br>$E_{\\text{ox}} = -0.34 - 0.0296 \\times (-1)$<br><br>$E_{\\text{ox}} = -0.34 + 0.0296$<br><br>$E_{\\text{ox}} = -0.3104 \\text{ V}$<br><br>Answer: -0.3104 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcfbf9280d7f9932c9e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For the cell reaction,\n$\\mathrm{A}_{(\\mathrm{s})}+\\mathrm{B}^{+2}{ }_{(\\mathrm{aq})} \\rightarrow \\mathrm{A}^{+2}{ }_{(\\mathrm{aq})}+\\mathrm{B}_{(\\mathrm{s})}$\nif equilibrium constant of reaction is $10^4$ at 298 K . What is standard emf of cell?", "image": null}, "options": [{"id": "Ddbd6", "text": "0.0592 V", "image": null, "isCorrect": false}, {"id": "fA4O5", "text": "0.1184 V", "image": null, "isCorrect": true}, {"id": "baoQL", "text": "0.1776 V", "image": null, "isCorrect": false}, {"id": "nncRC", "text": "0.2368 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relation between standard emf of the cell and equilibrium constant at 298 K is given by:<br><br>$E^{\\circ}_{\\text{cell}} = \\dfrac{0.0592}{n} \\log_{10} K$<br><br>From the given cell reaction, the number of electrons transferred is $n = 2$.<br><br>Given $K = 10^4$, substituting the values we get:<br><br>$E^{\\circ}_{\\text{cell}} = \\dfrac{0.0592}{2} \\log_{10} (10^4)$<br><br>$E^{\\circ}_{\\text{cell}} = \\dfrac{0.0592}{2} \\times 4$<br><br>$E^{\\circ}_{\\text{cell}} = 0.0592 \\times 2 = 0.1184 \\text{ V}$<br><br>Answer: 0.1184 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbbbf9280d7f9932bee", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If standard reduction potential $\\left(\\mathrm{E}^{\\circ}\\right)$ of $\\left(\\mathrm{Mg}_{(\\mathrm{aq})}^{+2} \\mid \\mathrm{Mg}_{(\\mathrm{s})}\\right)$, $\\left(\\mathrm{Ag}^{+}{ }_{(\\mathrm{aq})} \\mid \\mathrm{Ag}_{(\\mathrm{s})}\\right),\\left(\\mathrm{Zn}^{+2}{ }_{(\\mathrm{aq})} \\mid \\mathrm{Zn}_{(\\mathrm{s})}\\right)$ and $\\left(\\mathrm{Cu}^{+2}{ }_{(\\mathrm{aq})} \\mid \\mathrm{Cu}_{(\\mathrm{s})}\\right)$ are -2.37 V , $+0.79 \\mathrm{~V},-0.76 \\mathrm{~V}$ and +0.34 V respectively. Which of the following reaction is spontaneous?", "image": null}, "options": [{"id": "Lgs2g", "text": "$\\mathrm{Zn}_{(\\mathrm{s})}+\\mathrm{Mg}_{(\\mathrm{aq})}^{+2} \\longrightarrow \\mathrm{Zn}_{(\\mathrm{aq})}^{+2}+\\mathrm{Mg}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}, {"id": "oOV3Y", "text": "$2 \\mathrm{Ag}_{(\\mathrm{s})+} \\mathrm{Zn}_{(\\mathrm{aq})}^{+2} \\longrightarrow 2 \\mathrm{Ag}_{(\\mathrm{aq})}^{+}+\\mathrm{Zn}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}, {"id": "UTlwC", "text": "$\\mathrm{Zn}_{(\\mathrm{s})}+\\mathrm{Cu}_{(\\mathrm{aq})}^{+2} \\longrightarrow \\mathrm{Zn}_{(\\mathrm{aq})}^{+2}+\\mathrm{Cu}_{(\\mathrm{s})}$", "image": null, "isCorrect": true}, {"id": "A3HBa", "text": "$\\mathrm{Cu}_{(\\mathrm{s})}+\\mathrm{Mg}_{(\\mathrm{aq})}^{+2} \\longrightarrow \\mathrm{Cu}_{(\\mathrm{aq})}^{+2}+\\mathrm{Mg}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a reaction to be spontaneous, the standard cell potential $E^{\\circ}_{\\text{cell}}$ must be positive. The standard cell potential is given by:<br><br>$E^{\\circ}_{\\text{cell}} = E^{\\circ}_{\\text{cathode}} - E^{\\circ}_{\\text{anode}}$<br><br>Let us calculate $E^{\\circ}_{\\text{cell}}$ for each given reaction:<br><br>For $\\mathrm{Zn}_{(\\mathrm{s})} + \\mathrm{Mg}_{(\\mathrm{aq})}^{+2} \\longrightarrow \\mathrm{Zn}_{(\\mathrm{aq})}^{+2} + \\mathrm{Mg}_{(\\mathrm{s})}$:<br>$\\mathrm{Mg}$ is reduced (cathode) and $\\mathrm{Zn}$ is oxidized (anode).<br>$E^{\\circ}_{\\text{cell}} = -2.37 - (-0.76) = -1.61 \\text{ V}$ (Non-spontaneous)<br><br>For $2 \\mathrm{Ag}_{(\\mathrm{s})} + \\mathrm{Zn}_{(\\mathrm{aq})}^{+2} \\longrightarrow 2 \\mathrm{Ag}_{(\\mathrm{aq})}^{+} + \\mathrm{Zn}_{(\\mathrm{s})}$:<br>$\\mathrm{Zn}$ is reduced (cathode) and $\\mathrm{Ag}$ is oxidized (anode).<br>$E^{\\circ}_{\\text{cell}} = -0.76 - 0.79 = -1.55 \\text{ V}$ (Non-spontaneous)<br><br>For $\\mathrm{Zn}_{(\\mathrm{s})} + \\mathrm{Cu}_{(\\mathrm{aq})}^{+2} \\longrightarrow \\mathrm{Zn}_{(\\mathrm{aq})}^{+2} + \\mathrm{Cu}_{(\\mathrm{s})}$:<br>$\\mathrm{Cu}$ is reduced (cathode) and $\\mathrm{Zn}$ is oxidized (anode).<br>$E^{\\circ}_{\\text{cell}} = 0.34 - (-0.76) = +1.10 \\text{ V}$ (Spontaneous)<br><br>For $\\mathrm{Cu}_{(\\mathrm{s})} + \\mathrm{Mg}_{(\\mathrm{aq})}^{+2} \\longrightarrow \\mathrm{Cu}_{(\\mathrm{aq})}^{+2} + \\mathrm{Mg}_{(\\mathrm{s})}$:<br>$\\mathrm{Mg}$ is reduced (cathode) and $\\mathrm{Cu}$ is oxidized (anode).<br>$E^{\\circ}_{\\text{cell}} = -2.37 - 0.34 = -2.71 \\text{ V}$ (Non-spontaneous)<br><br>Since $E^{\\circ}_{\\text{cell}}$ is positive only for the reaction between $\\mathrm{Zn}$ and $\\mathrm{Cu}^{+2}$, it is the spontaneous reaction.<br><br>Answer: $\\mathrm{Zn}_{(\\mathrm{s})}+\\mathrm{Cu}_{(\\mathrm{aq})}^{+2} \\longrightarrow \\mathrm{Zn}_{(\\mathrm{aq})}^{+2}+\\mathrm{Cu}_{(\\mathrm{s})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbabf9280d7f9932be4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the charge required to convert $2 \\mathrm{~mol}$ $\\mathrm{KMnO}_4$ to $\\mathrm{MnSO}_4$ ?", "image": null}, "options": [{"id": "k0Maa", "text": "2 F", "image": null, "isCorrect": false}, {"id": "6fpBv", "text": "4 F", "image": null, "isCorrect": false}, {"id": "Vx8qH", "text": "5 F", "image": null, "isCorrect": false}, {"id": "RimRL", "text": "10 F", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The oxidation state of $\\mathrm{Mn}$ in $\\mathrm{KMnO}_4$ is $+7$.<br><br>The oxidation state of $\\mathrm{Mn}$ in $\\mathrm{MnSO}_4$ is $+2$.<br><br>The reduction half-reaction is:<br><br>$\\mathrm{MnO}_4^- + 8\\mathrm{H}^+ + 5\\mathrm{e}^- \\rightarrow \\mathrm{Mn}^{2+} + 4\\mathrm{H}_2\\mathrm{O}$<br><br>This shows that $1 \\mathrm{~mol}$ of $\\mathrm{KMnO}_4$ requires $5 \\mathrm{~mol}$ of electrons for reduction.<br><br>Therefore, $2 \\mathrm{~mol}$ of $\\mathrm{KMnO}_4$ will require $2 \\times 5 = 10 \\mathrm{~mol}$ of electrons.<br><br>Since $1 \\mathrm{~mol}$ of electrons corresponds to $1 \\mathrm{~F}$ of charge, the total charge required is $10 \\mathrm{~F}$.<br><br>Answer: 10 F", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bacbf9280d7f9932b77", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $E^{\\circ}\\left(\\mathrm{Zn}_{(\\mathrm{aq})}^{+2} \\mid \\mathrm{Zn}_{(\\mathrm{s})}\\right)=-0.76 \\mathrm{~V}$.\nCalculate potential for $\\mathrm{Zn}_{(\\mathrm{s})} \\rightarrow \\mathrm{Zn}_{(0.01 \\mathrm{M})}^{+2}+2 \\overline{\\mathrm{e}}$ at 298 K ?", "image": null}, "options": [{"id": "zj7Gh", "text": "$+0.8192 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "MoN2L", "text": "$-0.8192$", "image": null, "isCorrect": false}, {"id": "ax8ZD", "text": "$+0.7008 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "ZHo8m", "text": "$-0.7008 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given standard reduction potential is $E^{\\circ}(\\mathrm{Zn}^{+2} \\mid \\mathrm{Zn}) = -0.76 \\mathrm{~V}$.<br><br>The standard oxidation potential is $E^{\\circ}_{\\mathrm{ox}} = -E^{\\circ}_{\\mathrm{red}} = +0.76 \\mathrm{~V}$.<br><br>The oxidation half-reaction is:<br>$\\mathrm{Zn}_{(\\mathrm{s})} \\rightarrow \\mathrm{Zn}^{+2}_{(\\mathrm{aq})} + 2 \\mathrm{e}^{-}$<br><br>Here, the number of electrons transferred is $n = 2$ and the concentration of $\\mathrm{Zn}^{+2}$ is $0.01 \\mathrm{~M} = 10^{-2} \\mathrm{~M}$.<br><br>Using the Nernst equation for the oxidation potential at $298 \\mathrm{~K}$:<br>$E_{\\mathrm{ox}} = E^{\\circ}_{\\mathrm{ox}} - \\dfrac{0.0592}{n} \\log_{10} [\\mathrm{Zn}^{+2}]$<br><br>Substituting the values:<br>$E_{\\mathrm{ox}} = 0.76 - \\dfrac{0.0592}{2} \\log_{10} (10^{-2})$<br><br>$E_{\\mathrm{ox}} = 0.76 - 0.0296 \\times (-2)$<br><br>$E_{\\mathrm{ox}} = 0.76 + 0.0592 = +0.8192 \\mathrm{~V}$<br><br>Answer: $+0.8192 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871babbf9280d7f9932b6f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For the cell involving following reaction.\n$\\mathrm{Zn}_{(\\mathrm{s})}+\\mathrm{Ni}_{(\\mathrm{aq})}^{+2} \\longrightarrow \\mathrm{Zn}_{(\\mathrm{aq})}^{+2}+\\mathrm{Ni}_{(\\mathrm{s})}$\n$\\mathrm{E}_{\\text {cell }}^{\\circ}=0.5 \\mathrm{~V}$. What is standard Gibb's energy change of cell reaction?", "image": null}, "options": [{"id": "8zvF0", "text": "$-193 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "UUUwi", "text": "$-905 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "0SGyY", "text": "$-96.5 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "ElDmI", "text": "$-89.65 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard Gibbs energy change is given by the equation:<br><br>$\\Delta G^{\\circ} = -nFE^{\\circ}_{\\text{cell}}$<br><br>For the given cell reaction, the number of electrons transferred is $n = 2$.<br><br>Given $E^{\\circ}_{\\text{cell}} = 0.5 \\text{ V}$ and Faraday's constant $F = 96500 \\text{ C mol}^{-1}$.<br><br>Substituting the values:<br><br>$\\Delta G^{\\circ} = -2 \\times 96500 \\times 0.5$<br><br>$\\Delta G^{\\circ} = -96500 \\text{ J}$<br><br>$\\Delta G^{\\circ} = -96.5 \\text{ kJ}$<br><br>Answer: $-96.5 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9dbf9280d7f9932ae7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A hypothetical galvanic cell is\n$\\ominus_{\\mathrm{A}_{(\\mathrm{s})}}\\left|\\mathrm{A}^{+}(1 \\mathrm{M})\\right|\\left|\\mathrm{B}^{+2}(1 \\mathrm{M})\\right| \\mathrm{B}_{(\\mathrm{s})}^{\\oplus}$\nand emf of cell is positive. What is the possible cell reaction?", "image": null}, "options": [{"id": "qJvqV", "text": "$\\mathrm{A}_{(\\mathrm{s})}+\\mathrm{B}_{(\\mathrm{aq})}^{+2} \\rightarrow \\mathrm{~A}_{(\\mathrm{aq})}^{+1}+\\mathrm{B}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}, {"id": "9wONU", "text": "$2 \\mathrm{~A}_{(\\mathrm{s})}+\\mathrm{B}_{(\\mathrm{aq})}^{+2} \\rightarrow 2 \\stackrel{+}{\\mathrm{A}}_{(\\mathrm{aq})}^{1}+\\mathrm{B}_{(\\mathrm{s})}$", "image": null, "isCorrect": true}, {"id": "GHjD5", "text": "$\\mathrm{A}_{(\\mathrm{s})}+2 \\mathrm{~B}_{(\\mathrm{aq})}^{+2} \\rightarrow \\mathrm{~A}_{(\\mathrm{aq})}^{+1}+2 \\mathrm{~B}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}, {"id": "FWeAC", "text": "$2 \\mathrm{~A}_{(\\mathrm{aq})}^{+}+\\mathrm{B}_{(\\mathrm{s})} \\rightarrow 2 \\mathrm{~A}_{(\\mathrm{s})}+\\stackrel{+2}{\\mathrm{~B}}_{(\\mathrm{aq})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given cell representation is:<br><br>$\\ominus \\mathrm{A}_{(\\mathrm{s})} | \\mathrm{A}^{+}(1 \\mathrm{M}) || \\mathrm{B}^{+2}(1 \\mathrm{M}) | \\mathrm{B}_{(\\mathrm{s})} \\oplus$<br><br>In a galvanic cell, oxidation occurs at the anode (left side) and reduction occurs at the cathode (right side).<br><br>At anode (oxidation half-reaction):<br>$\\mathrm{A}_{(\\mathrm{s})} \\rightarrow \\mathrm{A}^{+}_{(\\mathrm{aq})} + \\mathrm{e}^{-}$<br><br>At cathode (reduction half-reaction):<br>$\\mathrm{B}^{+2}_{(\\mathrm{aq})} + 2\\mathrm{e}^{-} \\rightarrow \\mathrm{B}_{(\\mathrm{s})}$<br><br>To balance the number of electrons, multiply the oxidation half-reaction by $2$:<br>$2\\mathrm{A}_{(\\mathrm{s})} \\rightarrow 2\\mathrm{A}^{+}_{(\\mathrm{aq})} + 2\\mathrm{e}^{-}$<br><br>Adding the two half-reactions gives the overall cell reaction:<br>$2\\mathrm{A}_{(\\mathrm{s})} + \\mathrm{B}^{+2}_{(\\mathrm{aq})} \\rightarrow 2\\mathrm{A}^{+}_{(\\mathrm{aq})} + \\mathrm{B}_{(\\mathrm{s})}$<br><br>Answer: $2 \\mathrm{~A}_{(\\mathrm{s})}+\\mathrm{B}_{(\\mathrm{aq})}^{+2} \\rightarrow 2 \\stackrel{+}{\\mathrm{A}}_{(\\mathrm{aq})}^{1}+\\mathrm{B}_{(\\mathrm{s})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9dbf9280d7f9932ae4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The standard emf for cell,\n$\\Theta_{\\mathrm{Cd}_{(\\mathrm{s})}}\\left|\\mathrm{Cd}^{+2}(1 \\mathrm{M})\\right|\\left|\\mathrm{Cu}^{+2}(1 \\mathrm{M})\\right| \\mathrm{Cu}_{(\\mathrm{s})}^{\\oplus}$\nis 0.74 V . If concentration of $\\mathrm{Cd}_{(\\mathrm{aq})}^{+2}$ and $\\mathrm{Cu}_{(\\mathrm{aq})}^{+2}$ decreases by 10 times at 298 K . Calculate emf of cell.", "image": null}, "options": [{"id": "RHzM4", "text": "$+0.074 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "PD9ow", "text": "$+0.850 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "gEwPI", "text": "$+0.680 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "Lqt9a", "text": "$+0.740 \\mathrm{~V}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The cell reaction is $\\mathrm{Cd}_{(\\mathrm{s})} + \\mathrm{Cu}^{+2}_{(\\mathrm{aq})} \\rightarrow \\mathrm{Cd}^{+2}_{(\\mathrm{aq})} + \\mathrm{Cu}_{(\\mathrm{s})}$.<br><br>The Nernst equation for the cell is given by:<br><br>$E_{\\mathrm{cell}} = E^{\\circ}_{\\mathrm{cell}} - \\dfrac{0.0592}{n} \\log_{10} \\dfrac{[\\mathrm{Cd}^{+2}]}{[\\mathrm{Cu}^{+2}]}$<br><br>Given that the standard emf $E^{\\circ}_{\\mathrm{cell}} = 0.74 \\mathrm{~V}$ and the number of electrons transferred $n = 2$.<br><br>When the concentration of both $\\mathrm{Cd}^{+2}$ and $\\mathrm{Cu}^{+2}$ decreases by 10 times, their new concentrations become $0.1 \\mathrm{~M}$ each.<br><br>Substituting these values into the Nernst equation:<br><br>$E_{\\mathrm{cell}} = 0.74 - \\dfrac{0.0592}{2} \\log_{10} \\left(\\dfrac{0.1}{0.1}\\right)$<br><br>$E_{\\mathrm{cell}} = 0.74 - \\dfrac{0.0592}{2} \\log_{10}(1)$<br><br>Since $\\log_{10}(1) = 0$, we get:<br><br>$E_{\\mathrm{cell}} = 0.74 - 0 = +0.740 \\mathrm{~V}$<br><br>Answer: $+0.740 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b99bf9280d7f9932aba", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following statements is true regarding the cell emf at 298 K for $\\stackrel{\\ominus}{\\mathrm{Ni}}{ }_{(\\mathrm{s})}|\\stackrel{+2}{\\mathrm{Ni}}(0.01 \\mathrm{M})|\\left|\\mathrm{Ag}^{+}(0.01 \\mathrm{M})\\right| \\mathrm{Ag}_{(\\mathrm{s})}^{\\oplus}$", "image": null}, "options": [{"id": "PtyI6", "text": "less than $E^{\\circ}{ }_{\\text {cell }}$ by 0.0592 V", "image": null, "isCorrect": true}, {"id": "UdK62", "text": "greater than $\\mathrm{E}^{\\circ}{ }_{\\text {cell }}$ by 0.0592 V", "image": null, "isCorrect": false}, {"id": "WF7O8", "text": "less than $E^{\\circ}{ }_{\\text {cell }}$ by 0.0296 V", "image": null, "isCorrect": false}, {"id": "WLKdW", "text": "greater than $\\mathrm{E}^{\\circ}{ }_{\\text {cell }}$ by 0.0296 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The cell reaction is $\\mathrm{Ni}_{(\\mathrm{s})} + 2\\mathrm{Ag}^{+}_{(\\mathrm{aq})} \\rightarrow \\mathrm{Ni}^{2+}_{(\\mathrm{aq})} + 2\\mathrm{Ag}_{(\\mathrm{s})}$.<br><br>The number of electrons transferred is $n = 2$.<br><br>Using the Nernst equation at 298 K:<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - \\dfrac{0.0592}{n} \\log_{10} \\dfrac{[\\mathrm{Ni}^{2+}]}{[\\mathrm{Ag}^{+}]^2}$<br><br>Substituting the given concentrations $[\\mathrm{Ni}^{2+}] = 0.01 \\text{ M}$ and $[\\mathrm{Ag}^{+}] = 0.01 \\text{ M}$:<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - \\dfrac{0.0592}{2} \\log_{10} \\dfrac{0.01}{(0.01)^2}$<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - 0.0296 \\log_{10} (100)$<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - 0.0296 \\times 2$<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - 0.0592 \\text{ V}$<br><br>Thus, the cell emf is less than $E^{\\circ}_{\\text{cell}}$ by $0.0592 \\text{ V}$.<br><br>Answer: less than $E^{\\circ}{ }_{\\text {cell }}$ by 0.0592 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8cbf9280d7f9932a47", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is value of $E_{\\text {cell }}$ at 298 K for the reaction, $\\mathrm{Zn}_{(\\mathrm{s})}+\\mathrm{Cu}^{+2}(0.1 \\mathrm{M}) \\rightarrow \\mathrm{Zn}^{+2}(0.1 \\mathrm{M})+\\mathrm{Cu}_{(\\mathrm{s})}$ if $\\mathrm{E}_{\\text {cell }}^{\\circ}=1.1 \\mathrm{~V}$ ?", "image": null}, "options": [{"id": "SaCv6", "text": "1.1 V", "image": null, "isCorrect": true}, {"id": "tmzFw", "text": "0.11 V", "image": null, "isCorrect": false}, {"id": "OgKZu", "text": "1.0408 V", "image": null, "isCorrect": false}, {"id": "Yf4WH", "text": "0.0296 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given cell reaction is $\\mathrm{Zn}_{(\\mathrm{s})} + \\mathrm{Cu}^{+2}_{(\\mathrm{aq})} \\rightarrow \\mathrm{Zn}^{+2}_{(\\mathrm{aq})} + \\mathrm{Cu}_{(\\mathrm{s})}$<br><br>The number of electrons transferred in the reaction is $n = 2$.<br><br>Using the Nernst equation at 298 K:<br><br>$E_{\\text{cell}} = E_{\\text{cell}}^{\\circ} - \\dfrac{0.0592}{n} \\log_{10} \\dfrac{[\\mathrm{Zn}^{+2}]}{[\\mathrm{Cu}^{+2}]}$<br><br>Substituting the given values:<br><br>$E_{\\text{cell}} = 1.1 - \\dfrac{0.0592}{2} \\log_{10} \\left( \\dfrac{0.1}{0.1} \\right)$<br><br>$E_{\\text{cell}} = 1.1 - \\dfrac{0.0592}{2} \\log_{10} (1)$<br><br>Since $\\log_{10} (1) = 0$:<br><br>$E_{\\text{cell}} = 1.1 - 0 = 1.1 \\text{ V}$<br><br>Answer: 1.1 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8bbf9280d7f9932a3d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Standard potential of electrode reaction $\\mathrm{Cu}^{+2}{ }_{(\\mathrm{aq})}+2 \\overline{\\mathrm{e}} \\rightarrow \\mathrm{Cu}_{(\\mathrm{s})}$ is +0.34 V . What is standard potential of reaction\n$2 \\mathrm{Cu}_{(\\mathrm{s})} \\rightarrow 2 \\mathrm{Cu}_{(\\mathrm{aq})}^{+2}+4 \\overline{\\mathrm{e}} ?$", "image": null}, "options": [{"id": "st3Zn", "text": "$+0.68 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "34f0B", "text": "$-0.68 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "t9Lzg", "text": "$+0.34 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "2N8gs", "text": "$-0.34 \\mathrm{~V}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given reduction reaction is $\\mathrm{Cu}^{+2}_{(\\mathrm{aq})} + 2\\mathrm{e}^{-} \\rightarrow \\mathrm{Cu}_{(\\mathrm{s})}$ with $E^{\\circ} = +0.34 \\mathrm{~V}$.<br><br>The required reaction is the reverse of the given reaction, multiplied by 2: $2\\mathrm{Cu}_{(\\mathrm{s})} \\rightarrow 2\\mathrm{Cu}^{+2}_{(\\mathrm{aq})} + 4\\mathrm{e}^{-}$.<br><br>When a reaction is reversed, the sign of its standard potential is reversed. Thus, the potential becomes $-0.34 \\mathrm{~V}$.<br><br>Standard electrode potential is an intensive property, meaning it is independent of the amount of substance or the stoichiometric coefficients in the balanced equation. Multiplying the reaction by 2 does not change the value of $E^{\\circ}$.<br><br>Therefore, the standard potential of the required reaction is $-0.34 \\mathrm{~V}$.<br><br>Answer: $-0.34 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8abf9280d7f9932a33", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Consider galvanic cell,\n${ }^{\\ominus} \\mathrm{A}_{(\\mathrm{s})}\\left|\\mathrm{A}_{(\\mathrm{aq})}^{+2}\\right|\\left|\\mathrm{B}_{(\\mathrm{aq})}^{+}\\right| \\mathrm{B}_{(\\mathrm{s})}^{\\oplus}$\nif emf of cell is positive, identify a correct cell reaction from following.", "image": null}, "options": [{"id": "qEjij", "text": "$\\mathrm{A}_{(\\mathrm{s})}+\\mathrm{B}_{(\\mathrm{aq})}^{+2} \\rightarrow \\mathrm{~A}_{(\\mathrm{aq})}^{+2}+\\mathrm{B}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}, {"id": "drymV", "text": "$\\mathrm{A}_{(\\mathrm{s})}+2 \\mathrm{~B}_{(\\mathrm{aq})}^{+} \\rightarrow \\mathrm{A}_{(\\mathrm{aq})}^{+2}+2 \\mathrm{~B}_{(\\mathrm{s})}$", "image": null, "isCorrect": true}, {"id": "9B4wf", "text": "$2 \\mathrm{~A}_{(\\mathrm{aq})}^{+2}+\\mathrm{B}_{(\\mathrm{s})} \\rightarrow 2 \\mathrm{~A}_{(\\mathrm{s})}+\\mathrm{B}_{(\\mathrm{aq})}^{+}$", "image": null, "isCorrect": false}, {"id": "k7ljG", "text": "$2 \\mathrm{~A}_{(\\mathrm{s})}+\\mathrm{B}_{(\\mathrm{aq})}^{+} \\rightarrow 2 \\mathrm{~A}_{(\\mathrm{aq})}^{+2}+\\mathrm{B}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the given cell representation, the left side represents the anode where oxidation takes place, and the right side represents the cathode where reduction takes place.<br><br>Oxidation half-reaction at anode:<br>$\\mathrm{A}_{(\\mathrm{s})} \\rightarrow \\mathrm{A}_{(\\mathrm{aq})}^{+2} + 2\\mathrm{e}^{-}$<br><br>Reduction half-reaction at cathode:<br>$\\mathrm{B}_{(\\mathrm{aq})}^{+} + \\mathrm{e}^{-} \\rightarrow \\mathrm{B}_{(\\mathrm{s})}$<br><br>To balance the number of electrons, multiply the reduction half-reaction by 2:<br>$2\\mathrm{B}_{(\\mathrm{aq})}^{+} + 2\\mathrm{e}^{-} \\rightarrow 2\\mathrm{B}_{(\\mathrm{s})}$<br><br>Adding the oxidation and reduction half-reactions gives the overall cell reaction:<br>$\\mathrm{A}_{(\\mathrm{s})} + 2\\mathrm{B}_{(\\mathrm{aq})}^{+} \\rightarrow \\mathrm{A}_{(\\mathrm{aq})}^{+2} + 2\\mathrm{B}_{(\\mathrm{s})}$<br><br>Answer: $\\mathrm{A}_{(\\mathrm{s})}+2 \\mathrm{~B}_{(\\mathrm{aq})}^{+} \\rightarrow \\mathrm{A}_{(\\mathrm{aq})}^{+2}+2 \\mathrm{~B}_{(\\mathrm{s})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7abf9280d7f9932996", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{E}^{\\circ}\\left(\\mathrm{Al}_{(\\mathrm{aq})}^{+3} \\mid \\mathrm{Al}_{(\\mathrm{s})}\\right)=-1.66 \\mathrm{~V}$.\nWhat is potential of $\\mathrm{Al}_{(\\mathrm{s})} \\rightarrow \\mathrm{Al}^{+3}(0.1 \\mathrm{M})+3 \\overline{\\mathrm{e}}$ at 298 K ?", "image": null}, "options": [{"id": "5bORR", "text": "$+1.540 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "bVY8J", "text": "$-1.540 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "R0FIg", "text": "$+1.679 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "tz0Xb", "text": "$-1.679 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given standard reduction potential is $E^{\\circ}_{\\mathrm{red}} = -1.66 \\mathrm{~V}$.<br><br>The standard oxidation potential is $E^{\\circ}_{\\mathrm{ox}} = -E^{\\circ}_{\\mathrm{red}} = +1.66 \\mathrm{~V}$.<br><br>The given half-cell reaction is an oxidation reaction:<br><br>$\\mathrm{Al}_{(\\mathrm{s})} \\rightarrow \\mathrm{Al}^{+3}(0.1 \\mathrm{M}) + 3 \\mathrm{e}^{-}$<br><br>Here, the number of electrons involved is $n = 3$ and the concentration of $\\mathrm{Al}^{+3}$ is $0.1 \\mathrm{M}$.<br><br>Using the Nernst equation for the oxidation potential:<br><br>$E_{\\mathrm{ox}} = E^{\\circ}_{\\mathrm{ox}} - \\dfrac{0.0592}{n} \\log_{10}[\\mathrm{Al}^{+3}]$<br><br>Substituting the values:<br><br>$E_{\\mathrm{ox}} = 1.66 - \\dfrac{0.0592}{3} \\log_{10}(0.1)$<br><br>$E_{\\mathrm{ox}} = 1.66 - 0.0197 \\times (-1)$<br><br>$E_{\\mathrm{ox}} = 1.66 + 0.0197 = +1.6797 \\mathrm{~V}$<br><br>Rounding to three decimal places, we get $+1.679 \\mathrm{~V}$.<br><br>Answer: $+1.679 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b79bf9280d7f993298d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{E}^{\\circ}\\left(\\mathrm{Fe}_{(\\mathrm{aq})}^{+2} \\mid \\mathrm{Fe}_{(\\mathrm{s})}\\right)=-0.44 \\mathrm{~V}$ and $\\mathrm{E}^{\\circ}\\left(\\mathrm{Sn}_{(\\mathrm{aq})}^{+2} \\mid \\operatorname{Sn}_{(\\mathrm{s})}\\right)=-0.14 \\mathrm{~V}$. What is standard emf of cell containing the two electrodes?", "image": null}, "options": [{"id": "KzW5C", "text": "$+0.30 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "DXXm4", "text": "$-0.30 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "3OnfR", "text": "$+0.58 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "EkSva", "text": "$-0.58 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given standard reduction potentials:<br><br>$\\mathrm{E}^{\\circ}_{\\mathrm{Fe}^{+2} \\mid \\mathrm{Fe}} = -0.44 \\mathrm{~V}$<br><br>$\\mathrm{E}^{\\circ}_{\\mathrm{Sn}^{+2} \\mid \\mathrm{Sn}} = -0.14 \\mathrm{~V}$<br><br>The electrode with the higher standard reduction potential acts as the cathode, while the one with the lower standard reduction potential acts as the anode.<br><br>Since $-0.14 \\mathrm{~V} > -0.44 \\mathrm{~V}$, the tin ($\\mathrm{Sn}$) electrode is the cathode and the iron ($\\mathrm{Fe}$) electrode is the anode.<br><br>The standard emf of the cell is given by:<br><br>$\\mathrm{E}^{\\circ}_{\\text{cell}} = \\mathrm{E}^{\\circ}_{\\text{cathode}} - \\mathrm{E}^{\\circ}_{\\text{anode}}$<br><br>$\\mathrm{E}^{\\circ}_{\\text{cell}} = -0.14 \\mathrm{~V} - (-0.44 \\mathrm{~V})$<br><br>$\\mathrm{E}^{\\circ}_{\\text{cell}} = -0.14 \\mathrm{~V} + 0.44 \\mathrm{~V} = +0.30 \\mathrm{~V}$<br><br>Answer: $+0.30 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6ebf9280d7f9932925", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{E}^{\\circ}\\left(\\mathrm{Mg}_{(\\mathrm{aq)})}^{+2} \\mid \\mathrm{Mg}_{(\\mathrm{s})}\\right)=-2.37 \\mathrm{~V}$.\nWhat is potential for $\\mathrm{Mg}_{(\\mathrm{s})} \\rightarrow \\mathrm{Mg}^{+2}(0.01 \\mathrm{M})+2 \\overline{\\mathrm{e}}$ at 298 K ?", "image": null}, "options": [{"id": "UrFPe", "text": "$+2.3108 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "vqNz5", "text": "$-2.3108 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "vwFfu", "text": "$+2.4292 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "7mt13", "text": "$-2.4292 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given standard reduction potential is $\\mathrm{E}^{\\circ}_{\\mathrm{red}} = -2.37 \\mathrm{~V}$.<br><br>The standard oxidation potential is $\\mathrm{E}^{\\circ}_{\\mathrm{ox}} = -\\mathrm{E}^{\\circ}_{\\mathrm{red}} = +2.37 \\mathrm{~V}$.<br><br>The given reaction is an oxidation half-reaction:<br>$\\mathrm{Mg}_{(\\mathrm{s})} \\rightarrow \\mathrm{Mg}^{+2}(0.01 \\mathrm{M}) + 2 \\mathrm{e}^{-}$<br><br>Here, the number of electrons transferred is $n = 2$ and the concentration of $\\mathrm{Mg}^{+2}$ is $0.01 \\mathrm{M} = 10^{-2} \\mathrm{M}$.<br><br>Using the Nernst equation for the oxidation potential at $298 \\mathrm{~K}$:<br>$\\mathrm{E}_{\\mathrm{ox}} = \\mathrm{E}^{\\circ}_{\\mathrm{ox}} - \\dfrac{0.0592}{n} \\log_{10} [\\mathrm{Mg}^{+2}]$<br><br>Substituting the values:<br>$\\mathrm{E}_{\\mathrm{ox}} = 2.37 - \\dfrac{0.0592}{2} \\log_{10} (10^{-2})$<br><br>$\\mathrm{E}_{\\mathrm{ox}} = 2.37 - 0.0296 \\times (-2)$<br><br>$\\mathrm{E}_{\\mathrm{ox}} = 2.37 + 0.0592 = +2.4292 \\mathrm{~V}$<br><br>Answer: $+2.4292 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6cbf9280d7f9932918", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If standard reduction potential $\\left(\\mathrm{E}^{\\circ}\\right)$ of $\\left(\\stackrel{+2}{\\mathrm{Ni}_{(\\mathrm{aq})}} \\mid \\mathrm{Ni}_{(\\mathrm{s})}\\right)$ and $\\left(\\underset{(\\mathrm{aq})}{\\stackrel{+3}{\\mathrm{Al}}} \\mid \\mathrm{Al}_{(\\mathrm{s})}\\right)$ are -0.25 V and -1.66 V respectively. What is standard emf of cell reaction $2 \\mathrm{Al}_{(\\mathrm{s})}+3 \\mathrm{Ni}_{(\\mathrm{aq})}^{+2} \\rightarrow 2 \\mathrm{Al}_{(\\mathrm{aq})}^{+3}+3 \\mathrm{Ni}_{(\\mathrm{s})}$", "image": null}, "options": [{"id": "SP3QV", "text": "$+2.57 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "VGHM2", "text": "$-2.57 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "in1PX", "text": "$+1.41 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "urT76", "text": "$-1.91 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given cell reaction is $2 \\mathrm{Al}_{(\\mathrm{s})}+3 \\mathrm{Ni}_{(\\mathrm{aq})}^{+2} \\rightarrow 2 \\mathrm{Al}_{(\\mathrm{aq})}^{+3}+3 \\mathrm{Ni}_{(\\mathrm{s})}$.<br><br>In this reaction, oxidation of $\\mathrm{Al}$ takes place, so it acts as the anode. Reduction of $\\mathrm{Ni}^{+2}$ takes place, so it acts as the cathode.<br><br>The standard emf of the cell is calculated using the formula:<br><br>$E^{\\circ}_{\\text{cell}} = E^{\\circ}_{\\text{cathode}} - E^{\\circ}_{\\text{anode}}$<br><br>Substituting the given standard reduction potentials:<br><br>$E^{\\circ}_{\\text{cell}} = E^{\\circ}_{\\mathrm{Ni}^{+2}/\\mathrm{Ni}} - E^{\\circ}_{\\mathrm{Al}^{+3}/\\mathrm{Al}}$<br><br>$E^{\\circ}_{\\text{cell}} = -0.25 - (-1.66)$<br><br>$E^{\\circ}_{\\text{cell}} = -0.25 + 1.66 = +1.41 \\text{ V}$<br><br>Answer: $+1.41 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6bbf9280d7f9932906", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following reactions exhibit minimum standard reduction potential?", "image": null}, "options": [{"id": "txXbD", "text": "$2 \\mathrm{H}_{(\\mathrm{aq})}^{+}+2 \\overline{\\mathrm{e}} \\rightarrow \\mathrm{H}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "IKoKy", "text": "$\\mathrm{F}_{2(\\mathrm{~g})}+2 \\overline{\\mathrm{e}} \\rightarrow 2 \\mathrm{~F}_{(\\mathrm{aq})}^{-}$", "image": null, "isCorrect": false}, {"id": "aseR2", "text": "$\\operatorname{Li}_{(\\mathrm{aq})}^{+}+\\overline{\\mathrm{e}} \\rightarrow \\operatorname{Li}_{(\\mathrm{s})}$", "image": null, "isCorrect": true}, {"id": "jrME8", "text": "$\\mathrm{Cl}_{2(\\mathrm{~g})}+2 \\overline{\\mathrm{e}} \\rightarrow 2 \\mathrm{Cl}_{(\\mathrm{aq})}^{-}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard reduction potential values for the given half-reactions are:<br><br>$E^{\\circ}_{\\mathrm{H}^{+}/\\mathrm{H}_{2}} = 0.00 \\mathrm{~V}$<br><br>$E^{\\circ}_{\\mathrm{F}_{2}/\\mathrm{F}^{-}} = +2.87 \\mathrm{~V}$<br><br>$E^{\\circ}_{\\mathrm{Li}^{+}/\\mathrm{Li}} = -3.05 \\mathrm{~V}$<br><br>$E^{\\circ}_{\\mathrm{Cl}_{2}/\\mathrm{Cl}^{-}} = +1.36 \\mathrm{~V}$<br><br>Lithium has the lowest standard reduction potential in the electrochemical series. Thus, the reduction of $\\mathrm{Li}^{+}$ to $\\mathrm{Li}$ exhibits the minimum standard reduction potential.<br><br>Answer: $\\operatorname{Li}_{(\\mathrm{aq})}^{+}+\\overline{\\mathrm{e}} \\rightarrow \\operatorname{Li}_{(\\mathrm{s})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5cbf9280d7f993288d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For the cell reaction,\n$2 \\mathrm{Al}_{(\\mathrm{s})}+3 \\mathrm{Cu}^{+2}{ }_{(\\mathrm{aq})} \\rightarrow 2 \\mathrm{Al}^{+3}{ }_{(\\mathrm{aq})}+3 \\mathrm{Cu}_{(\\mathrm{s})}$\n\nIf $\\Delta \\mathrm{G}^{\\circ}=-1158 \\mathrm{~kJ}$, What is $\\mathrm{E}_{\\text {cell }}^{\\circ}$ ?", "image": null}, "options": [{"id": "3tSFB", "text": "3 V", "image": null, "isCorrect": false}, {"id": "iIl23", "text": "2.5 V", "image": null, "isCorrect": false}, {"id": "uEqDR", "text": "2 V", "image": null, "isCorrect": true}, {"id": "tjmV0", "text": "1.5 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relationship between standard Gibbs free energy change and standard cell potential is given by:<br><br>$\\Delta G^{\\circ} = -n F E^{\\circ}_{\\text{cell}}$<br><br>For the given cell reaction, the oxidation half-reaction is $2 \\mathrm{Al} \\rightarrow 2 \\mathrm{Al}^{+3} + 6 \\mathrm{e}^{-}$, so the number of moles of electrons transferred is $n = 6$.<br><br>Given:<br>$\\Delta G^{\\circ} = -1158 \\text{ kJ} = -1158000 \\text{ J}$<br>$F = 96500 \\text{ C mol}^{-1}$<br><br>Substituting the values into the equation:<br><br>$-1158000 = -6 \\times 96500 \\times E^{\\circ}_{\\text{cell}}$<br><br>$-1158000 = -579000 \\times E^{\\circ}_{\\text{cell}}$<br><br>$E^{\\circ}_{\\text{cell}} = \\dfrac{1158000}{579000} = 2 \\text{ V}$<br><br>Answer: 2 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b59bf9280d7f9932870", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following relations about $\\mathrm{E}^{\\circ}$ cell is false?", "image": null}, "options": [{"id": "3AD1w", "text": "$\\mathrm{E}_{\\text {cell }}^{\\circ}=\\mathrm{E}_{(\\text {cathode })}^{\\circ}-\\mathrm{E}_{(\\text {anode })}^{\\circ}$", "image": null, "isCorrect": false}, {"id": "7elxL", "text": "$\\mathrm{E}_{\\text {cell }}^{\\circ}=\\frac{0.0592}{\\mathrm{n}} \\times \\log _{10} \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "Tq8ii", "text": "$\\mathrm{E}_{\\text {cell }}^{\\circ}=\\frac{\\Delta \\mathrm{G}^{\\circ}}{\\mathrm{nF}}$", "image": null, "isCorrect": true}, {"id": "5Lt09", "text": "$\\mathrm{E}_{\\text {cell }}^{\\circ}=\\mathrm{E}_{\\text {(right) }}^{\\circ}-\\mathrm{E}_{\\text {(left) }}^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard Gibbs free energy change is related to the standard cell potential by the equation $\\Delta \\mathrm{G}^{\\circ} = -\\mathrm{nF} \\mathrm{E}_{\\text{cell}}^{\\circ}$.<br><br>Rearranging this equation gives $\\mathrm{E}_{\\text{cell}}^{\\circ} = -\\dfrac{\\Delta \\mathrm{G}^{\\circ}}{\\mathrm{nF}}$.<br><br>The relation given in the option is missing the negative sign, making it false.<br><br>The other relations are correct standard formulas:<br>$\\mathrm{E}_{\\text{cell}}^{\\circ} = \\mathrm{E}_{\\text{cathode}}^{\\circ} - \\mathrm{E}_{\\text{anode}}^{\\circ}$<br>$\\mathrm{E}_{\\text{cell}}^{\\circ} = \\mathrm{E}_{\\text{right}}^{\\circ} - \\mathrm{E}_{\\text{left}}^{\\circ}$<br>$\\mathrm{E}_{\\text{cell}}^{\\circ} = \\dfrac{0.0592}{\\mathrm{n}} \\log_{10} \\mathrm{K}$ (at $298 \\text{ K}$)<br><br>Answer: $\\mathrm{E}_{\\text {cell }}^{\\circ}=\\frac{\\Delta \\mathrm{G}^{\\circ}}{\\mathrm{nF}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b58bf9280d7f9932869", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{E}^{\\circ}\\left(\\mathrm{Ag}^{+}{ }_{(\\mathrm{aq})} \\mid \\mathrm{Ag}_{(\\mathrm{s})}\\right)=+0.80 \\mathrm{~V}$\nWhat is potential developed for $\\mathrm{Ag}_{(\\mathrm{s})} \\rightarrow \\mathrm{Ag}^{+1}(0.01 \\mathrm{M})+\\overline{\\mathrm{e}}$ at 298 K ?", "image": null}, "options": [{"id": "LKgCm", "text": "$+0.9184 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "k6V9s", "text": "$-0.9184 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "qrCaB", "text": "$+0.6816 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "sQyIO", "text": "$-0.6816 \\mathrm{~V}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given reaction is an oxidation reaction: $\\mathrm{Ag}_{(\\mathrm{s})} \\rightarrow \\mathrm{Ag}^{+}_{(\\mathrm{aq})} + \\mathrm{e}^{-}$<br><br>The standard oxidation potential is the negative of the standard reduction potential:<br>$\\mathrm{E}^{\\circ}_{\\text{ox}} = -\\mathrm{E}^{\\circ}_{\\text{red}} = -0.80 \\mathrm{~V}$<br><br>According to the Nernst equation for the oxidation half-cell at $298 \\mathrm{~K}$:<br>$\\mathrm{E}_{\\text{ox}} = \\mathrm{E}^{\\circ}_{\\text{ox}} - \\dfrac{0.0592}{n} \\log_{10}[\\mathrm{Ag}^{+}]$<br><br>Here, the number of electrons transferred is $n = 1$ and the concentration is $[\\mathrm{Ag}^{+}] = 0.01 \\mathrm{~M} = 10^{-2} \\mathrm{~M}$. Substituting these values:<br>$\\mathrm{E}_{\\text{ox}} = -0.80 - \\dfrac{0.0592}{1} \\log_{10}(10^{-2})$<br><br>$\\mathrm{E}_{\\text{ox}} = -0.80 - 0.0592 \\times (-2)$<br><br>$\\mathrm{E}_{\\text{ox}} = -0.80 + 0.1184$<br><br>$\\mathrm{E}_{\\text{ox}} = -0.6816 \\mathrm{~V}$<br><br>Answer: $-0.6816 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4bbf9280d7f99327f0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If standard emf of cell\n$\\mathrm{Zn}_{(\\mathrm{s})}\\left|\\mathrm{Zn}_{(1 \\mathrm{M})}^{+2} \\| \\mathrm{Ag}_{(1 \\mathrm{M})}^{+1}\\right| \\mathrm{Ag}_{(\\mathrm{s})} \\quad$ is 1.55 V.\nWhat is electrical work done under standard conditions?", "image": null}, "options": [{"id": "evWaV", "text": "$-144.750 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "fF4qj", "text": "$-193.00 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "3USjR", "text": "$-299.150 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "UuiB1", "text": "$-386.00 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The cell reaction for the given cell is:<br><br>$\\mathrm{Zn}_{(\\mathrm{s})} + 2\\mathrm{Ag}_{(\\mathrm{aq})}^{+} \\rightarrow \\mathrm{Zn}_{(\\mathrm{aq})}^{2+} + 2\\mathrm{Ag}_{(\\mathrm{s})}$<br><br>The number of moles of electrons transferred in the balanced cell reaction is $n = 2$.<br><br>Standard emf of the cell, $E^{\\circ} = 1.55 \\text{ V}$.<br><br>Faraday's constant, $F = 96500 \\text{ C mol}^{-1}$.<br><br>The electrical work done under standard conditions is given by the standard Gibbs free energy change ($\\Delta G^{\\circ}$):<br><br>$\\Delta G^{\\circ} = -nFE^{\\circ}$<br><br>$\\Delta G^{\\circ} = -2 \\times 96500 \\times 1.55$<br><br>$\\Delta G^{\\circ} = -299150 \\text{ J}$<br><br>$\\Delta G^{\\circ} = -299.150 \\text{ kJ}$<br><br>Answer: $-299.150 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4abf9280d7f99327ea", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{E}^{\\circ}\\left(\\mathrm{Mg}^{+2}{ }_{(\\mathrm{aq})} \\mid \\mathrm{Mg}_{(\\mathrm{s})}\\right)=-2.37 \\mathrm{~V}$.\nWhat is potential for $\\mathrm{Mg}_{(\\mathrm{s})} \\longrightarrow \\mathrm{Mg}^{+2}(0.1 \\mathrm{M})+2 \\overline{\\mathrm{e}}$ at 298 K ?", "image": null}, "options": [{"id": "aX1sd", "text": "$+2.3996 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "6Pv5c", "text": "$-2.3996 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "otfe5", "text": "$+2.3404 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "Es1Rn", "text": "$-2.3404 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given standard reduction potential is $E^{\\circ}_{\\text{red}} = -2.37 \\text{ V}$.<br><br>The given half-cell reaction is an oxidation reaction:<br>$\\mathrm{Mg}_{(\\mathrm{s})} \\longrightarrow \\mathrm{Mg}^{+2}(0.1 \\mathrm{M}) + 2\\mathrm{e}^{-}$<br><br>The standard oxidation potential is:<br>$E^{\\circ}_{\\text{ox}} = -E^{\\circ}_{\\text{red}} = -(-2.37 \\text{ V}) = +2.37 \\text{ V}$<br><br>Using the Nernst equation for the oxidation half-cell at $298 \\text{ K}$:<br>$E_{\\text{ox}} = E^{\\circ}_{\\text{ox}} - \\dfrac{0.0592}{n} \\log_{10}[\\mathrm{Mg}^{+2}]$<br><br>Here, the number of electrons transferred is $n = 2$ and the concentration is $[\\mathrm{Mg}^{+2}] = 0.1 \\text{ M}$.<br><br>Substituting the values:<br>$E_{\\text{ox}} = 2.37 - \\dfrac{0.0592}{2} \\log_{10}(0.1)$<br><br>$E_{\\text{ox}} = 2.37 - 0.0296 \\times (-1)$<br><br>$E_{\\text{ox}} = 2.37 + 0.0296 = +2.3996 \\text{ V}$<br><br>Answer: $+2.3996 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b48bf9280d7f99327d0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Select false statement from the following regarding electrochemical cell.", "image": null}, "options": [{"id": "rptdX", "text": "Standard cell potential of electro chemical cell is an intensive property.", "image": null, "isCorrect": false}, {"id": "f3v1q", "text": "Electrode potential depends on concentration of salt solution is in contact with electrode.", "image": null, "isCorrect": false}, {"id": "tGStN", "text": "Standard free energy change of cell is an intensive property.", "image": null, "isCorrect": true}, {"id": "3RXfK", "text": "Electrical work done in galvanic cell is equal to decrease in Gibb's energy.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Standard cell potential ($E^{\\circ}$) is an intensive property because it does not depend on the amount of substance present in the cell.<br><br>Electrode potential depends on the concentration of the electrolyte solution as given by the Nernst equation.<br><br>Standard free energy change ($\\Delta G^{\\circ}$) is an extensive property because it depends on the number of moles of electrons transferred ($n$) in the cell reaction, as given by the relation $\\Delta G^{\\circ} = -nFE^{\\circ}$.<br><br>Electrical work done by a galvanic cell is equal to the decrease in Gibbs free energy, i.e., $W_{max} = -\\Delta G$.<br><br>Thus, the statement that standard free energy change is an intensive property is false.<br><br>Answer: Standard free energy change of cell is an intensive property.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3bbf9280d7f9932756", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following statement is correct regarding emf of cell for the cell reaction,\n$\\mathrm{Cd}_{(\\mathrm{s})}+\\mathrm{Cu}_{(\\mathrm{aq})}^{+2} \\longrightarrow \\mathrm{Cd}_{(\\mathrm{aq})}^{+2}+\\mathrm{Cu}_{(\\mathrm{s})}$\nif concentration of $\\mathrm{Cd}^{+2}$ is 10 times greater than concentration of $\\mathrm{Cu}_{(\\mathrm{aq})}^{+2}$ at 298 K ?", "image": null}, "options": [{"id": "uZtuh", "text": "greater than $\\mathrm{E}_{\\text {cell }}^{\\circ}$ by 0.0592 V", "image": null, "isCorrect": false}, {"id": "zTSU7", "text": "less than $E^{\\circ}{ }_{\\text {cell }}$ by 0.0592 V", "image": null, "isCorrect": false}, {"id": "W6JfU", "text": "greater than $\\mathrm{E}_{\\text {cell }}^{\\circ}$ by 0.0296 V", "image": null, "isCorrect": false}, {"id": "zqHFG", "text": "less than $\\mathrm{E}^{\\circ}{ }_{\\text {cell }}$ by 0.0296 V", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given cell reaction is:<br><br>$\\mathrm{Cd}_{(\\mathrm{s})} + \\mathrm{Cu}_{(\\mathrm{aq})}^{+2} \\longrightarrow \\mathrm{Cd}_{(\\mathrm{aq})}^{+2} + \\mathrm{Cu}_{(\\mathrm{s})}$<br><br>The number of electrons transferred in the reaction is $n = 2$.<br><br>According to the Nernst equation at $298 \\text{ K}$:<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - \\dfrac{0.0592}{n} \\log_{10} \\dfrac{[\\mathrm{Cd}^{+2}]}{[\\mathrm{Cu}^{+2}]}$<br><br>Given that the concentration of $\\mathrm{Cd}^{+2}$ is 10 times greater than the concentration of $\\mathrm{Cu}^{+2}$, we have $\\dfrac{[\\mathrm{Cd}^{+2}]}{[\\mathrm{Cu}^{+2}]} = 10$.<br><br>Substituting the values into the equation:<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - \\dfrac{0.0592}{2} \\log_{10}(10)$<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - 0.0296 \\times 1$<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - 0.0296 \\text{ V}$<br><br>Thus, the emf of the cell is less than $E^{\\circ}_{\\text{cell}}$ by $0.0296 \\text{ V}$.<br><br>Answer: less than $\\mathrm{E}^{\\circ}{ }_{\\text {cell }}$ by 0.0296 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b37bf9280d7f9932732", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Assume the cell reaction,\n$\\mathrm{A}_{(\\mathrm{s})}+\\mathrm{B}_{(\\mathrm{aq})}^{+2} \\rightarrow \\mathrm{~A}_{(\\mathrm{aq})}^{+2}+\\mathrm{B}_{(\\mathrm{s})}$\nif $\\Delta \\mathrm{G}^{\\circ}=-386 \\mathrm{~kJ}$ at 298 K . What is $\\mathrm{E}_{\\text {cell }}^{\\circ}$ ?", "image": null}, "options": [{"id": "KdXH2", "text": "1 V", "image": null, "isCorrect": false}, {"id": "c9kwA", "text": "1.5 V", "image": null, "isCorrect": false}, {"id": "IcSJX", "text": "2 V", "image": null, "isCorrect": true}, {"id": "UP9Zd", "text": "$2.5 \\mathrm{~V}$", "image": null, "isCo
