  <script>
    const data = {"index": 18, "chapterId": "61c089a9afb1dfe892f13bf6", "chapter": "Electrochemistry", "exam": "MHT CET", "totalTopics": 6, "totalQuestions": 329, "downloadTime": "2026-10-08 20:06:30", "topics": [{"index": 1, "topicId": "65a2632c0279619d9d8a3ca3", "title": "Cells and Electrode Potential, Nernst Equation", "totalQuestions": 173, "questions": [{"_id": "6abb88d215a9fc0fc8c14749", "type": "singleCorrect", "question": {"text": "Calculate the standard emf of Zn-Cu cell if $E^\\circ(\\text{Zn}^{2+}/\\text{Zn}) = -0.76$ V and $E^0(\\text{Cu}^{2+}/\\text{Cu}) = 0.34$ V", "image": null}, "options": [{"id": "BS26c", "label": "A", "text": "$0.42$ V", "isCorrect": false, "image": null}, {"id": "zxhQT", "label": "B", "text": "$0.76$ V", "isCorrect": false, "image": null}, {"id": "UwL8r", "label": "C", "text": "$1.1$ V", "isCorrect": true, "image": null}, {"id": "eYOjy", "label": "D", "text": "$1.52$ V", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a Zn-Cu cell, zinc acts as the anode (undergoes oxidation) and copper acts as the cathode (undergoes reduction).<br><br>The standard emf of the cell is given by:<br><br>$E^{\\circ}_{\\text{cell}} = E^{\\circ}_{\\text{cathode}} - E^{\\circ}_{\\text{anode}}$<br><br>Substituting the given standard reduction potentials:<br><br>$E^{\\circ}_{\\text{cell}} = E^{\\circ}(\\text{Cu}^{2+}/\\text{Cu}) - E^{\\circ}(\\text{Zn}^{2+}/\\text{Zn})$<br><br>$E^{\\circ}_{\\text{cell}} = 0.34 - (-0.76)$<br><br>$E^{\\circ}_{\\text{cell}} = 0.34 + 0.76 = 1.1$ V<br><br>Answer: $1.1$ V", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88d215a9fc0fc8c14747", "type": "singleCorrect", "question": {"text": "Identify the <strong>FALSE</strong> statement from the following.", "image": null}, "options": [{"id": "7DQHr", "label": "A", "text": "Standard cell potential of galvanic cell is an extensive property.", "isCorrect": true, "image": null}, {"id": "D1Aiw", "label": "B", "text": "Standard electrode potential is an intensive property.", "isCorrect": false, "image": null}, {"id": "pFCdH", "label": "C", "text": "For spontaneous cell reaction in galvanic cell, free energy change should be negative.", "isCorrect": false, "image": null}, {"id": "jpNfH", "label": "D", "text": "For spontaneous cell reaction in galvanic cell equilibrium constant of reaction should be greater than 1.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Standard cell potential ($E^{\\circ}_{cell}$) and standard electrode potential are intensive properties because they do not depend on the amount of substance present in the cell. Multiplying a half-reaction by a stoichiometric coefficient does not change its standard potential.<br><br>For a spontaneous cell reaction, the change in Gibbs free energy ($\\Delta G$) must be negative.<br><br>Since $\\Delta G^{\\circ} = -RT \\ln K$, for a spontaneous reaction under standard conditions ($\\Delta G^{\\circ} < 0$), the equilibrium constant $K$ must be greater than $1$.<br><br>Thus, the statement that standard cell potential is an extensive property is false.<br><br>Answer: Standard cell potential of galvanic cell is an extensive property.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a115a9fc0fc8c14586", "type": "singleCorrect", "question": {"text": "For the cell<br>$\\text{Ni}_{(s)} | \\text{Ni}^{++}_{(1M)} || \\text{Cu}^{++}_{(1M)} | \\text{Cu}_{(s)}$, if the concentration of an ion in the anode compartment is doubled, then the emf of cell will be", "image": null}, "options": [{"id": "HHzC0", "label": "A", "text": "increased by $2$ V.", "isCorrect": false, "image": null}, {"id": "IFXmK", "label": "B", "text": "decreased by $2$ V.", "isCorrect": false, "image": null}, {"id": "eWJFZ", "label": "C", "text": "increased by $0.00891$ V.", "isCorrect": false, "image": null}, {"id": "PBBKh", "label": "D", "text": "decreased by $0.00891$ V.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The cell reaction is:<br><br>$\\text{Ni}_{(s)} + \\text{Cu}^{++}_{(aq)} \\rightarrow \\text{Ni}^{++}_{(aq)} + \\text{Cu}_{(s)}$<br><br>The number of electrons transferred is $n = 2$.<br><br>According to the Nernst equation:<br><br>$E = E^{\\circ} - \\dfrac{0.0591}{2} \\log \\dfrac{[\\text{Ni}^{++}]}{[\\text{Cu}^{++}]}$<br><br>Initially, $[\\text{Ni}^{++}] = 1$ M and $[\\text{Cu}^{++}] = 1$ M.<br><br>$E_{1} = E^{\\circ} - \\dfrac{0.0591}{2} \\log(1) = E^{\\circ}$<br><br>When the concentration of the ion in the anode compartment ($[\\text{Ni}^{++}]$) is doubled, $[\\text{Ni}^{++}] = 2$ M.<br><br>$E_{2} = E^{\\circ} - \\dfrac{0.0591}{2} \\log(2)$<br><br>$E_{2} = E^{\\circ} - \\dfrac{0.0591}{2} \\times 0.3010$<br><br>$E_{2} \\approx E^{\\circ} - 0.00891 \\text{ V}$<br><br>Therefore, the emf of the cell is decreased by $0.00891$ V.<br><br>Answer: decreased by $0.00891$ V.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884215a9fc0fc8c14203", "type": "singleCorrect", "question": {"text": "A battery delivers a steady current of $3.00$ ampere for $10.0$ hours. Calculate the number of moles of electrons passed.", "image": null}, "options": [{"id": "prC3s", "label": "A", "text": "$3.6$", "isCorrect": false, "image": null}, {"id": "e3UCf", "label": "B", "text": "$1.12$", "isCorrect": true, "image": null}, {"id": "TYH5o", "label": "C", "text": "$4.5$", "isCorrect": false, "image": null}, {"id": "OF1cN", "label": "D", "text": "$2.7$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The total charge passed can be calculated using the formula $Q = I \\times t$.<br><br>Given:<br>Current, $I = 3.00$ A<br>Time, $t = 10.0$ hours $= 10.0 \\times 60 \\times 60 = 36000$ s<br><br>Substituting the values:<br>$Q = 3.00 \\times 36000 = 108000$ C<br><br>The charge of one mole of electrons is $1$ Faraday ($F \\approx 96500$ C).<br><br>Number of moles of electrons $= \\dfrac{Q}{F}$<br><br>Number of moles of electrons $= \\dfrac{108000}{96500} \\approx 1.119$<br><br>Rounding to appropriate significant figures, we get $1.12$ moles.<br><br>Answer: $1.12$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b115a9fc0fc8c1461d", "type": "singleCorrect", "question": {"text": "Calculate the mass of cobalt deposited when $10$ ampere current is passed for $109$ minutes through cobalt chloride solution. (Molar mass of $\\text{Co} = 59$ g/mol)", "image": null}, "options": [{"id": "8P48V", "label": "A", "text": "$4.0\\ \\text{g}$", "isCorrect": false, "image": null}, {"id": "bftqC", "label": "B", "text": "$20.0\\ \\text{g}$", "isCorrect": true, "image": null}, {"id": "Gs5xq", "label": "C", "text": "$40.0\\ \\text{g}$", "isCorrect": false, "image": null}, {"id": "L4Gl0", "label": "D", "text": "$6.6\\ \\text{g}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given:<br>Current, $I = 10$ A<br>Time, $t = 109$ min $= 109 \\times 60$ s $= 6540$ s<br>Molar mass of Co $= 59$ g/mol<br><br>In cobalt chloride ($\\text{CoCl}_2$), the valency of cobalt is $2$. The reduction reaction is:<br>$\\text{Co}^{2+} + 2e^{-} \\rightarrow \\text{Co}$<br><br>Equivalent mass of Co, $E = \\dfrac{\\text{Molar mass}}{\\text{Valency}} = \\dfrac{59}{2} = 29.5$ g/eq<br><br>Total charge passed, $Q = I \\times t = 10 \\times 6540 = 65400$ C<br><br>According to Faraday's first law of electrolysis, the mass of cobalt deposited is:<br>$W = \\dfrac{E \\times Q}{96500}$<br><br>$W = \\dfrac{29.5 \\times 65400}{96500}$<br><br>$W = \\dfrac{1929300}{96500} \\approx 19.99$ g<br><br>Rounding off, the mass of cobalt deposited is $20.0$ g.<br><br>Answer: $20.0\\ \\text{g}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b115a9fc0fc8c1461c", "type": "singleCorrect", "question": {"text": "Identify the $E_{red}$ value from following, if $\\text{CuSO}_4$ solution dipped with Cu rod is diluted to $10$ times.", "image": null}, "options": [{"id": "7vgsd", "label": "A", "text": "More by $0.02958$ V, than $E^0_{red}$", "isCorrect": false, "image": null}, {"id": "EIVzA", "label": "B", "text": "Less by $0.02958$ V, than $E^0_{red}$", "isCorrect": true, "image": null}, {"id": "8XEip", "label": "C", "text": "More by $0.0592$ V, than $E^0_{red}$", "isCorrect": false, "image": null}, {"id": "g8f5Z", "label": "D", "text": "Less by $0.0592$ V, than $E^0_{red}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reduction half-reaction for the copper electrode is:<br><br>$\\text{Cu}^{2+} + 2e^{-} \\rightarrow \\text{Cu}$<br><br>The Nernst equation for the reduction potential is given by:<br><br>$E_{red} = E^{0}_{red} - \\dfrac{0.05916}{2} \\log \\dfrac{1}{[\\text{Cu}^{2+}]}$<br><br>Assuming the initial solution is in its standard state, $[\\text{Cu}^{2+}] = 1 \\text{ M}$, so $E_{red} = E^{0}_{red}$.<br><br>When the solution is diluted $10$ times, the new concentration becomes $[\\text{Cu}^{2+}] = 0.1 \\text{ M}$.<br><br>Substituting this into the Nernst equation:<br><br>$E_{red} = E^{0}_{red} - \\dfrac{0.05916}{2} \\log \\dfrac{1}{0.1}$<br><br>$E_{red} = E^{0}_{red} - 0.02958 \\log 10$<br><br>$E_{red} = E^{0}_{red} - 0.02958 \\text{ V}$<br><br>Thus, the reduction potential is less by $0.02958 \\text{ V}$ than $E^{0}_{red}$.<br><br>Answer: Less by $0.02958$ V, than $E^0_{red}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887115a9fc0fc8c143c3", "type": "singleCorrect", "question": {"text": "What is the number of moles of electrons that are required for the reduction of $2$ moles of $\\text{Al}^{+3}$ to Al?", "image": null}, "options": [{"id": "gbfw2", "label": "A", "text": "$3$", "isCorrect": false, "image": null}, {"id": "U4Fkr", "label": "B", "text": "$4$", "isCorrect": false, "image": null}, {"id": "iSf29", "label": "C", "text": "$6$", "isCorrect": true, "image": null}, {"id": "mUpYN", "label": "D", "text": "$1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reduction reaction of $\\text{Al}^{+3}$ to $\\text{Al}$ is given by:<br><br>$\\text{Al}^{+3} + 3e^{-} \\rightarrow \\text{Al}$<br><br>From the stoichiometry of the reaction, $1$ mole of $\\text{Al}^{+3}$ requires $3$ moles of electrons for complete reduction.<br><br>Therefore, the number of moles of electrons required for the reduction of $2$ moles of $\\text{Al}^{+3}$ is $2 \\times 3 = 6$ moles.<br><br>Answer: $6$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888115a9fc0fc8c1445a", "type": "singleCorrect", "question": {"text": "Calculate the standard potential of the cell that has the following reaction.<br>$\\text{Zn}_{(s)} + 2\\text{H}^+_{(1M)} \\rightarrow \\text{H}_{2(g,1\\text{atm})} + \\text{Zn}^{2+}_{(1M)}$ if $E^0(\\text{Zn}^{2+}/\\text{Zn}) = -0.763$ V.", "image": null}, "options": [{"id": "gTDgu", "label": "A", "text": "$0.763$ V", "isCorrect": true, "image": null}, {"id": "m5S0C", "label": "B", "text": "$0.381$ V", "isCorrect": false, "image": null}, {"id": "CqFCt", "label": "C", "text": "$-0.763$ V", "isCorrect": false, "image": null}, {"id": "bNhY3", "label": "D", "text": "$0.14$ V", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The standard cell potential is given by the formula:<br><br>$E^0_{\\text{cell}} = E^0_{\\text{cathode}} - E^0_{\\text{anode}}$<br><br>In the given cell reaction, hydrogen undergoes reduction at the cathode and zinc undergoes oxidation at the anode.<br><br>$E^0_{\\text{cathode}} = E^0(\\text{H}^+/\\text{H}_2) = 0.000\\text{ V}$<br><br>$E^0_{\\text{anode}} = E^0(\\text{Zn}^{2+}/\\text{Zn}) = -0.763\\text{ V}$<br><br>Substituting the values:<br><br>$E^0_{\\text{cell}} = 0.000 - (-0.763) = 0.763\\text{ V}$<br><br>Answer: $0.763$ V", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889215a9fc0fc8c144f1", "type": "singleCorrect", "question": {"text": "When $6$ g Cu metal is deposited at the cathode during the passage of $3$ ampere current through its salt solution for $x$ minutes. Calculate the value of $x$ if the molar mass of copper is $63.5$ $\\text{g mol}^{-1}$", "image": null}, "options": [{"id": "1lpFR", "label": "A", "text": "$50.1$ minutes", "isCorrect": false, "image": null}, {"id": "bVXkC", "label": "B", "text": "$202.6$ minutes", "isCorrect": false, "image": null}, {"id": "4MLFD", "label": "C", "text": "$152$ minutes", "isCorrect": false, "image": null}, {"id": "PgaBB", "label": "D", "text": "$101.3$ minutes", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The deposition of copper at the cathode follows the reaction:<br><br>$\\text{Cu}^{2+} + 2\\text{e}^{-} \\rightarrow \\text{Cu}$<br><br>The equivalent mass of copper is $E = \\dfrac{63.5}{2} = 31.75 \\text{ g eq}^{-1}$<br><br>According to Faraday's first law of electrolysis:<br><br>$W = \\dfrac{E \\cdot I \\cdot t}{96500}$<br><br>Given $W = 6 \\text{ g}$, $I = 3 \\text{ A}$, and $t = x \\text{ minutes} = 60x \\text{ s}$, substituting these values gives:<br><br>$6 = \\dfrac{31.75 \\cdot 3 \\cdot 60x}{96500}$<br><br>$x = \\dfrac{6 \\cdot 96500}{31.75 \\cdot 180}$<br><br>$x = \\dfrac{96500}{952.5} \\approx 101.3 \\text{ minutes}$<br><br>Answer: $101.3$ minutes", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889115a9fc0fc8c144f0", "type": "singleCorrect", "question": {"text": "Calculate the electrode potential of $\\text{Mg}^{2+}/\\text{Mg}$ electrode having $0.01$ M concentration of $\\text{Mg}^{2+}$ ($E^\\circ \\text{Mg}^{2+}/\\text{Mg} = -2.36$ V).", "image": null}, "options": [{"id": "KWY2w", "label": "A", "text": "$-2.42$ V", "isCorrect": true, "image": null}, {"id": "v6nSG", "label": "B", "text": "$-2.30$ V", "isCorrect": false, "image": null}, {"id": "dQKrk", "label": "C", "text": "$-2.89$ V", "isCorrect": false, "image": null}, {"id": "1REkK", "label": "D", "text": "$1.84$ V", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reduction half-reaction for the magnesium electrode is:<br><br>$\\text{Mg}^{2+} + 2e^{-} \\rightarrow \\text{Mg}$<br><br>Here, the number of electrons involved, $n = 2$.<br><br>Using the Nernst equation for the electrode potential:<br><br>$E = E^{\\circ} - \\dfrac{0.0591}{n} \\log \\dfrac{1}{[\\text{Mg}^{2+}]}$<br><br>Substituting the given values ($E^{\\circ} = -2.36$ V, $[\\text{Mg}^{2+}] = 0.01$ M):<br><br>$E = -2.36 - \\dfrac{0.0591}{2} \\log \\dfrac{1}{0.01}$<br><br>$E = -2.36 - 0.02955 \\log 100$<br><br>$E = -2.36 - 0.02955 \\times 2$<br><br>$E = -2.36 - 0.0591$<br><br>$E = -2.4191$ V $\\approx -2.42$ V<br><br>Answer: $-2.42$ V", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886215a9fc0fc8c1432f", "type": "singleCorrect", "question": {"text": "The standard EMF of the cell, Ni | $\\text{Ni}^{2+}$ || $\\text{Cu}^{2+}$ | Cu is $0.59$ Volt. The standard reduction potential of a copper electrode is $0.34$ volt. What is the standard electrode potential of nickel electrode ?", "image": null}, "options": [{"id": "seKUL", "label": "A", "text": "$0.25$ volt", "isCorrect": false, "image": null}, {"id": "Xoa2k", "label": "B", "text": "$-0.25$ volt", "isCorrect": true, "image": null}, {"id": "CwjWa", "label": "C", "text": "$0.93$ volt", "isCorrect": false, "image": null}, {"id": "8SWm7", "label": "D", "text": "$-0.93$ volt", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The standard EMF of the cell is given by $E^{\\circ}_{\\text{cell}} = E^{\\circ}_{\\text{cathode}} - E^{\\circ}_{\\text{anode}}$.<br><br>From the cell representation, copper is at the cathode and nickel is at the anode.<br><br>$E^{\\circ}_{\\text{cell}} = E^{\\circ}_{\\text{Cu}^{2+}/\\text{Cu}} - E^{\\circ}_{\\text{Ni}^{2+}/\\text{Ni}}$<br><br>Substituting the given values:<br><br>$0.59 = 0.34 - E^{\\circ}_{\\text{Ni}^{2+}/\\text{Ni}}$<br><br>$E^{\\circ}_{\\text{Ni}^{2+}/\\text{Ni}} = 0.34 - 0.59 = -0.25 \\text{ V}$<br><br>Answer: $-0.25$ volt", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886215a9fc0fc8c1432d", "type": "singleCorrect", "question": {"text": "Which of the following statements is NOT true about electrolysis of aqueous sodium chloride ?", "image": null}, "options": [{"id": "Jj1b1", "label": "A", "text": "$\\text{H}_2$ gas is liberated at anode.", "isCorrect": true, "image": null}, {"id": "WczKm", "label": "B", "text": "$\\text{Cl}_2$ gas is released at anode.", "isCorrect": false, "image": null}, {"id": "JtOSK", "label": "C", "text": "NaCl solution is converted to sodium hydroxide.", "isCorrect": false, "image": null}, {"id": "G3BFs", "label": "D", "text": "$\\text{O}_2$ gas is not liberated at anode.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "During the electrolysis of aqueous sodium chloride, the following reactions take place:<br><br>At the cathode (reduction): Water is reduced in preference to $\\text{Na}^+$ ions because the standard reduction potential of water is higher than that of $\\text{Na}^+$.<br>$2\\text{H}_2\\text{O}(l) + 2\\text{e}^- \\rightarrow \\text{H}_2(g) + 2\\text{OH}^-(aq)$<br>Thus, $\\text{H}_2$ gas is liberated at the cathode, not at the anode.<br><br>At the anode (oxidation): Chloride ions are oxidized in preference to water due to the overpotential of oxygen.<br>$2\\text{Cl}^-(aq) \\rightarrow \\text{Cl}_2(g) + 2\\text{e}^-$<br>Thus, $\\text{Cl}_2$ gas is liberated at the anode, and $\\text{O}_2$ gas is not liberated.<br><br>In the solution, $\\text{Na}^+$ and $\\text{OH}^-$ ions remain, converting the aqueous $\\text{NaCl}$ solution into sodium hydroxide ($\\text{NaOH}$).<br><br>Therefore, the statement that $\\text{H}_2$ gas is liberated at the anode is incorrect.<br><br>Answer: $\\text{H}_2$ gas is liberated at anode.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c115a9fc0fc8c146b3", "type": "singleCorrect", "question": {"text": "When $4$ A current was passed through a salt solution for $45$ minutes, $2.977$ g metal was deposited. Calculate the charge on metal ion having molar mass $106.4$ g mol$^{-1}$.", "image": null}, "options": [{"id": "dsPva", "label": "A", "text": "$+1$", "isCorrect": false, "image": null}, {"id": "RJkCb", "label": "B", "text": "$+2$", "isCorrect": false, "image": null}, {"id": "Km36w", "label": "C", "text": "$+3$", "isCorrect": false, "image": null}, {"id": "19jdW", "label": "D", "text": "$+4$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given:<br>Current, $I = 4$ A<br>Time, $t = 45$ min $= 45 \\times 60 = 2700$ s<br>Mass deposited, $w = 2.977$ g<br>Molar mass, $M = 106.4$ g mol$^{-1}$<br>Faraday's constant, $F = 96500$ C mol$^{-1}$<br><br>Using Faraday's first law of electrolysis:<br>$w = \\dfrac{M \\times I \\times t}{n \\times F}$<br><br>Rearranging for the charge on the metal ion ($n$):<br>$n = \\dfrac{M \\times I \\times t}{w \\times F}$<br><br>Substituting the values:<br>$n = \\dfrac{106.4 \\times 4 \\times 2700}{2.977 \\times 96500}$<br><br>$n = \\dfrac{1149120}{287280.5} \\approx 4$<br><br>The charge on the metal ion is $+4$.<br><br>Answer: $+4$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c115a9fc0fc8c146b2", "type": "singleCorrect", "question": {"text": "When same quantity of electricity is passed through two different cells containing copper sulfate and silver nitrate, if $0.99$ g Ag and $0.29$ g Cu are deposited, calculate the molar mass of Ag (Molar mass of Cu = $63.2$ g/mol)", "image": null}, "options": [{"id": "oNN4V", "label": "A", "text": "$63.5$ g/mol", "isCorrect": false, "image": null}, {"id": "XCs3H", "label": "B", "text": "$10.78$ g/mol", "isCorrect": false, "image": null}, {"id": "ct89X", "label": "C", "text": "$107.8$ g/mol", "isCorrect": true, "image": null}, {"id": "1UJDo", "label": "D", "text": "$31.6$ g/mol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Faraday's second law of electrolysis:<br><br>$\\dfrac{W_{Ag}}{W_{Cu}} = \\dfrac{E_{Ag}}{E_{Cu}}$<br><br>In $\\text{AgNO}_3$, the valency of Ag is $1$, so the equivalent mass of Ag is $E_{Ag} = \\dfrac{M_{Ag}}{1} = M_{Ag}$.<br><br>In $\\text{CuSO}_4$, the valency of Cu is $2$, so the equivalent mass of Cu is $E_{Cu} = \\dfrac{M_{Cu}}{2} = \\dfrac{63.2}{2} = 31.6 \\text{ g/eq}$.<br><br>Substituting the given values:<br><br>$\\dfrac{0.99}{0.29} = \\dfrac{M_{Ag}}{31.6}$<br><br>$M_{Ag} = \\dfrac{0.99 \\times 31.6}{0.29} \\approx 107.8 \\text{ g/mol}$<br><br>Answer: $107.8$ g/mol", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883215a9fc0fc8c1416c", "type": "singleCorrect", "question": {"text": "Calculate $E^o_{cell}$ of the following cell at $298$ K.<br>$\\text{Pb}_{(s)}\\,|\\,\\text{Pb}^{+2}_{(aq)}\\,||\\,\\text{Ag}^+_{(aq)}\\,|\\,\\text{Ag}_{(s)}$<br>$E^o\\text{Pb}^{+2}/\\text{Pb} = -0.126$ V, $E^o\\,\\text{Ag}^+/\\text{Ag} = +0.799$ V", "image": null}, "options": [{"id": "Od2N3", "label": "A", "text": "$-0.925$ V", "isCorrect": false, "image": null}, {"id": "Mhazi", "label": "B", "text": "$0.936$ V", "isCorrect": false, "image": null}, {"id": "U1F04", "label": "C", "text": "$0.925$ V", "isCorrect": true, "image": null}, {"id": "iOvrT", "label": "D", "text": "$0.673$ V", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The cell representation is given as $\\text{Pb}_{(s)}\\,|\\,\\text{Pb}^{+2}_{(aq)}\\,||\\,\\text{Ag}^+_{(aq)}\\,|\\,\\text{Ag}_{(s)}$.<br><br>Here, Pb acts as the anode and Ag acts as the cathode.<br><br>The standard cell potential is given by the formula:<br><br>$E^o_{cell} = E^o_{cathode} - E^o_{anode}$<br><br>Substituting the given standard reduction potentials:<br><br>$E^o_{cell} = E^o_{\\text{Ag}^+/\\text{Ag}} - E^o_{\\text{Pb}^{+2}/\\text{Pb}}$<br><br>$E^o_{cell} = 0.799 - (-0.126)$<br><br>$E^o_{cell} = 0.799 + 0.126 = 0.925$ V<br><br>Answer: $0.925$ V", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883215a9fc0fc8c1416b", "type": "singleCorrect", "question": {"text": "The standard electrode potential for $\\text{Ag}^+_{(aq)}+e^-\\rightarrow\\text{Ag}_{(s)}$ is $0.79$ V. What is the stranded potential for the reaction: $2\\text{Ag}_{(s)}\\rightarrow 2\\text{Ag}^+_{(aq)}+2e^-$.", "image": null}, "options": [{"id": "y9f9J", "label": "A", "text": "$+1.58$ V", "isCorrect": false, "image": null}, {"id": "QOhPq", "label": "B", "text": "$-1.58$ V", "isCorrect": false, "image": null}, {"id": "nBRTR", "label": "C", "text": "$+0.79$ V", "isCorrect": false, "image": null}, {"id": "sQQSj", "label": "D", "text": "$-0.79$ V", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given standard reduction potential for $\\text{Ag}^+_{(aq)} + e^- \\rightarrow \\text{Ag}_{(s)}$ is $E^{\\circ} = 0.79$ V.<br><br>The required reaction is $2\\text{Ag}_{(s)} \\rightarrow 2\\text{Ag}^+_{(aq)} + 2e^-$, which is the reverse of the given reaction multiplied by $2$.<br><br>When a reaction is reversed, the sign of its standard potential is reversed. Thus, the oxidation potential is $-0.79$ V.<br><br>Standard electrode potential is an intensive property, meaning it does not depend on the stoichiometric coefficients of the reaction. Multiplying the reaction by $2$ does not change the value of the potential.<br><br>Therefore, the standard potential for the given reaction is $-0.79$ V.<br><br>Answer: $-0.79$ V", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2aa8c30a4553e1bdb7f", "type": "singleCorrect", "question": {"text": "Determine the electrode potential of $\\text{Sn}^{2+}(0.01\\text{M})\\ |\\ \\text{Sn(s)}$ at $25^\\circ\\text{C}$ if $E^\\circ_{\\text{Sn}}$ is $-0.136$ V.", "image": null}, "options": [{"id": "4IbK2", "label": "A", "text": "$0.186$ V", "isCorrect": false, "image": null}, {"id": "sG2cq", "label": "B", "text": "$-0.186$ V", "isCorrect": false, "image": null}, {"id": "6waqX", "label": "C", "text": "$-0.195$ V", "isCorrect": true, "image": null}, {"id": "t1axB", "label": "D", "text": "$0.195$ V", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reduction half-reaction is $\\text{Sn}^{2+} + 2e^{-} \\rightarrow \\text{Sn(s)}$.<br><br>Using the Nernst equation:<br><br>$E = E^{\\circ} - \\dfrac{0.0591}{n} \\log \\dfrac{1}{[\\text{Sn}^{2+}]}$<br><br>Substituting the given values ($n = 2$, $[\\text{Sn}^{2+}] = 0.01\\text{ M}$, $E^{\\circ} = -0.136\\text{ V}$):<br><br>$E = -0.136 - \\dfrac{0.0591}{2} \\log \\dfrac{1}{0.01}$<br><br>$E = -0.136 - 0.02955 \\log (100)$<br><br>$E = -0.136 - 0.02955 \\times 2$<br><br>$E = -0.136 - 0.0591$<br><br>$E = -0.1951\\text{ V} \\approx -0.195\\text{ V}$<br><br>Answer: $-0.195$ V", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3518c30a4553e1be278", "type": "singleCorrect", "question": {"text": "What is the quantity of electricity required to produce $8$ g of Mg (molar mass = $24\\ \\text{g mol}^{-1}$) from $\\text{MgCl}_2$ solution ?", "image": null}, "options": [{"id": "2GPAX", "label": "A", "text": "$0.222$ F", "isCorrect": false, "image": null}, {"id": "FSo2W", "label": "B", "text": "$0.444$ F", "isCorrect": false, "image": null}, {"id": "NGJmP", "label": "C", "text": "$0.666$ F", "isCorrect": true, "image": null}, {"id": "q4iNL", "label": "D", "text": "$0.888$ F", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reduction reaction of magnesium is given by:<br><br>$\\text{Mg}^{2+} + 2e^{-} \\rightarrow \\text{Mg}$<br><br>From the stoichiometry of the reaction, $1$ mole of Mg requires $2$ moles of electrons, which corresponds to $2\\text{ F}$ of electricity.<br><br>Number of moles of Mg to be produced = $\\dfrac{\\text{Mass}}{\\text{Molar mass}} = \\dfrac{8}{24} = \\dfrac{1}{3}\\text{ mol}$<br><br>Quantity of electricity required = $\\dfrac{1}{3} \\times 2\\text{ F} = \\dfrac{2}{3}\\text{ F} = 0.666\\text{ F}$<br><br>Answer: $0.666$ F", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3008c30a4553e1bdf14", "type": "singleCorrect", "question": {"text": "What is number of moles of electron passed when a current of $2$ Amp flows through solution of electrolyte for $10$ minutes?", "image": null}, "options": [{"id": "xmn2y", "label": "A", "text": "$1.784 \\times 10^{-2}$", "isCorrect": false, "image": null}, {"id": "cpKr7", "label": "B", "text": "$1.243 \\times 10^{-2}$", "isCorrect": true, "image": null}, {"id": "bA8uF", "label": "C", "text": "$2.022 \\times 10^{-2}$", "isCorrect": false, "image": null}, {"id": "8Y87F", "label": "D", "text": "$8.041 \\times 10^{-2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given, current $I = 2$ A and time $t = 10$ minutes $= 10 \\times 60 = 600$ s.<br><br>Total charge passed is given by $Q = I \\times t$<br><br>$Q = 2 \\times 600 = 1200$ C<br><br>The charge of one mole of electrons is $1$ Faraday ($F \\approx 96500$ C).<br><br>Number of moles of electrons $= \\dfrac{Q}{F}$<br><br>Number of moles of electrons $= \\dfrac{1200}{96500} = 0.012435$ mol<br><br>Number of moles of electrons $\\approx 1.243 \\times 10^{-2}$ mol<br><br>Answer: $1.243 \\times 10^{-2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fe8c30a4553e1bdf03", "type": "singleCorrect", "question": {"text": "During the electrolysis of aqueous NaCl the product formed at cathode is?", "image": null}, "options": [{"id": "EiQAx", "label": "A", "text": "$\\text{Cl}_{2(g)}$", "isCorrect": false, "image": null}, {"id": "h2k4D", "label": "B", "text": "$\\text{O}_{2(g)}$", "isCorrect": false, "image": null}, {"id": "8zv7H", "label": "C", "text": "$\\text{Na}_{(s)}$", "isCorrect": false, "image": null}, {"id": "SOsF2", "label": "D", "text": "$\\text{H}_{2(g)}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "In the electrolysis of aqueous $\\text{NaCl}$, the ions present in the solution are $\\text{Na}^{+}$, $\\text{Cl}^{-}$, $\\text{H}^{+}$, and $\\text{OH}^{-}$.<br><br>At the cathode, reduction occurs. The competing reactions are:<br>$\\text{Na}^{+} + e^{-} \\rightarrow \\text{Na}_{(s)}$ ($E^{\\circ} = -2.71 \\text{ V}$)<br>$2\\text{H}_{2}\\text{O}_{(l)} + 2e^{-} \\rightarrow \\text{H}_{2(g)} + 2\\text{OH}^{-}_{(aq)}$ ($E^{\\circ} = -0.83 \\text{ V}$)<br><br>Since the standard reduction potential of water is greater than that of sodium ions, water is preferentially reduced at the cathode.<br><br>Thus, hydrogen gas ($\\text{H}_{2(g)}$) is liberated at the cathode.<br><br>Answer: $\\text{H}_{2(g)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f28c30a4553e1bde7f", "type": "singleCorrect", "question": {"text": "A galvanic cell consist copper electrode and standard hydrogen electrode. If $E^\\circ\\left(\\text{Cu}^{+2}_{(aq)} | \\text{Cu}_{(s)}\\right) = +0.34\\,\\text{V}$, then identify a reaction taking place at positive electrode during working of cell.", "image": null}, "options": [{"id": "wCUJp", "label": "A", "text": "$\\text{Cu}_{(s)} \\longrightarrow \\text{Cu}^{+2}_{(aq)} + 2e^-$", "isCorrect": false, "image": null}, {"id": "SGh1R", "label": "B", "text": "$\\text{Cu}^{+2}_{(aq)} + 2e^- \\longrightarrow \\text{Cu}_{(s)}$", "isCorrect": true, "image": null}, {"id": "C7oBE", "label": "C", "text": "$\\text{H}_2\\text{(g)} \\longrightarrow 2\\text{H}^+_{(aq)} + 2e^-$", "isCorrect": false, "image": null}, {"id": "FeEuK", "label": "D", "text": "$\\text{H}^+_{(aq)} + 2e^- \\longrightarrow \\text{H}_2\\text{(g)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $E^\\circ(\\text{Cu}^{+2}/\\text{Cu}) = +0.34\\,\\text{V}$ and $E^\\circ(\\text{H}^+/\\text{H}_2) = 0.00\\,\\text{V}$.<br><br>Since the standard reduction potential of the copper electrode is greater than that of the standard hydrogen electrode, copper acts as the cathode and the hydrogen electrode acts as the anode.<br><br>In a galvanic cell, the cathode is the positive electrode where reduction takes place.<br><br>The reduction reaction at the positive electrode (copper cathode) is:<br><br>$\\text{Cu}^{+2}_{(aq)} + 2e^- \\longrightarrow \\text{Cu}_{(s)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f18c30a4553e1bde76", "type": "singleCorrect", "question": {"text": "If standard reduction potential of Zn, Ni and Fe are $-0.76\\,\\text{V}$, $-0.23\\,\\text{V}$ and $-0.44\\,\\text{V}$ respectively. For the reaction (Stated below) to be spontaneous find out electrodes X and Y considering above electrode potentials<br>$\\text{X}_{(s)} + \\text{Y}^{+2}_{(aq)} \\longrightarrow \\text{X}^{+2}_{(aq)} + \\text{Y}_{(s)}$", "image": null}, "options": [{"id": "Hv7Gs", "label": "A", "text": "X = Ni , Y = Fe", "isCorrect": false, "image": null}, {"id": "8nK0k", "label": "B", "text": "X = Ni , Y = Zn", "isCorrect": false, "image": null}, {"id": "IQRMM", "label": "C", "text": "X = Fe , Y = Zn", "isCorrect": false, "image": null}, {"id": "foObt", "label": "D", "text": "X = Zn , Y = Ni", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For the given reaction $\\text{X}_{(s)} + \\text{Y}^{+2}_{(aq)} \\longrightarrow \\text{X}^{+2}_{(aq)} + \\text{Y}_{(s)}$, X undergoes oxidation and acts as the anode, while Y undergoes reduction and acts as the cathode.<br><br>For the reaction to be spontaneous, the standard cell potential $E^{\\circ}_{\\text{cell}}$ must be positive.<br><br>$E^{\\circ}_{\\text{cell}} = E^{\\circ}_{\\text{cathode}} - E^{\\circ}_{\\text{anode}} = E^{\\circ}_{\\text{Y}} - E^{\\circ}_{\\text{X}} > 0$<br><br>This implies $E^{\\circ}_{\\text{Y}} > E^{\\circ}_{\\text{X}}$.<br><br>Given standard reduction potentials:<br>$E^{\\circ}_{\\text{Zn}} = -0.76\\,\\text{V}$<br>$E^{\\circ}_{\\text{Ni}} = -0.23\\,\\text{V}$<br>$E^{\\circ}_{\\text{Fe}} = -0.44\\,\\text{V}$<br><br>Checking the given options:<br>If X = Ni, Y = Fe: $E^{\\circ}_{\\text{cell}} = -0.44 - (-0.23) = -0.21\\,\\text{V}$ (Non-spontaneous)<br>If X = Ni, Y = Zn: $E^{\\circ}_{\\text{cell}} = -0.76 - (-0.23) = -0.53\\,\\text{V}$ (Non-spontaneous)<br>If X = Fe, Y = Zn: $E^{\\circ}_{\\text{cell}} = -0.76 - (-0.44) = -0.32\\,\\text{V}$ (Non-spontaneous)<br>If X = Zn, Y = Ni: $E^{\\circ}_{\\text{cell}} = -0.23 - (-0.76) = +0.53\\,\\text{V}$ (Spontaneous)<br><br>Thus, the reaction is spontaneous when X = Zn and Y = Ni.<br><br>Answer: X = Zn , Y = Ni", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ef8c30a4553e1bde5e", "type": "singleCorrect", "question": {"text": "If standard reduction potential of four electrodes A, B, C, D are $+2.5\\,\\text{V}, +3.0\\,\\text{V}, -2.0\\,\\text{V}$ and $-1.5\\,\\text{V}$ respectively. When is the standard emf of cell maximum?", "image": null}, "options": [{"id": "2qO7y", "label": "A", "text": "'A' is anode and 'B' is cathode", "isCorrect": false, "image": null}, {"id": "jwuSG", "label": "B", "text": "'B' is anode and 'D' is cathode", "isCorrect": false, "image": null}, {"id": "c7oLY", "label": "C", "text": "'C' is anode and 'B' is cathode", "isCorrect": true, "image": null}, {"id": "fjgTQ", "label": "D", "text": "'B' is anode and 'C' is cathode", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The standard emf of a cell is given by $E^{\\circ}_{\\text{cell}} = E^{\\circ}_{\\text{cathode}} - E^{\\circ}_{\\text{anode}}$.<br><br>To obtain the maximum standard emf, the cathode must have the highest standard reduction potential and the anode must have the lowest standard reduction potential.<br><br>Given standard reduction potentials are:<br>$E^{\\circ}_{\\text{A}} = +2.5\\text{ V}$<br>$E^{\\circ}_{\\text{B}} = +3.0\\text{ V}$<br>$E^{\\circ}_{\\text{C}} = -2.0\\text{ V}$<br>$E^{\\circ}_{\\text{D}} = -1.5\\text{ V}$<br><br>The highest reduction potential is for electrode B ($+3.0\\text{ V}$), so B should act as the cathode.<br><br>The lowest reduction potential is for electrode C ($-2.0\\text{ V}$), so C should act as the anode.<br><br>Maximum $E^{\\circ}_{\\text{cell}} = 3.0 - (-2.0) = 5.0\\text{ V}$.<br><br>Thus, 'C' is the anode and 'B' is the cathode.<br><br>Answer: 'C' is anode and 'B' is cathode", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3298c30a4553e1be0d1", "type": "singleCorrect", "question": {"text": "For a certain redox reaction in galvanic cell $\\text{X}_{(s)} + \\text{Y}^{2+}_{(aq)} \\longrightarrow \\text{X}^{2+}_{(aq)} + \\text{Y}_{(s)}$, $\\text{E}^\\circ$ cell is $0.0296\\ \\text{V}$ at $298\\ \\text{K}$. What is equilibrium constant of reaction?", "image": null}, "options": [{"id": "np2ev", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "RYPFK", "label": "B", "text": "$10$", "isCorrect": true, "image": null}, {"id": "znimN", "label": "C", "text": "$100$", "isCorrect": false, "image": null}, {"id": "ho9XU", "label": "D", "text": "$1000$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The relation between standard cell potential and equilibrium constant at $298\\ \\text{K}$ is given by:<br><br>$E^{\\circ}_{\\text{cell}} = \\dfrac{0.0591}{n} \\log K_c$<br><br>For the given reaction, the number of electrons transferred is $n = 2$.<br><br>Substituting the given values:<br><br>$0.0296 = \\dfrac{0.0591}{2} \\log K_c$<br><br>$0.0296 \\approx 0.02955 \\log K_c$<br><br>$\\log K_c = \\dfrac{0.0296}{0.02955} \\approx 1$<br><br>$K_c = 10^1 = 10$<br><br>Answer: $10$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3268c30a4553e1be0b3", "type": "singleCorrect", "question": {"text": "Which of the following net cell reactions occurs in a galvanic cell containing cadmium electrode and standard hydrogen electrode?<br>$\\text{E}^\\circ_{(\\text{Cd}^{2+}_{(aq)}|\\text{Cd}_{(s)})} = -0.403\\ \\text{V}$.", "image": null}, "options": [{"id": "nasGh", "label": "A", "text": "$\\text{H}_{2(g)} + \\text{Cd}^{2+}_{(aq)} \\longrightarrow 2\\text{H}^+_{(aq)} + \\text{Cd}_{(s)}$", "isCorrect": false, "image": null}, {"id": "6lYkN", "label": "B", "text": "$\\text{Cd}_{(s)} + 2\\text{H}^+_{(aq)} \\longrightarrow \\text{Cd}^{2+}_{(aq)} + \\text{H}_{2(g)}$", "isCorrect": true, "image": null}, {"id": "3Lfy2", "label": "C", "text": "$2\\text{H}_{2(g)} + \\text{Cd}^{2+}_{(aq)} \\longrightarrow 4\\text{H}^+_{(aq)} + \\text{Cd}_{(s)}$", "isCorrect": false, "image": null}, {"id": "0kAtM", "label": "D", "text": "$2\\text{Cd}_{(s)} + 2\\text{H}^+_{(aq)} \\longrightarrow 2\\text{Cd}^{2+}_{(aq)} + \\text{H}_{2(g)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $E^\\circ_{\\text{Cd}^{2+}|\\text{Cd}} = -0.403\\ \\text{V}$ and $E^\\circ_{\\text{H}^+|\\text{H}_2} = 0.00\\ \\text{V}$.<br><br>Since the standard reduction potential of cadmium is lower than that of hydrogen, cadmium has a higher tendency to get oxidized. Therefore, cadmium will act as the anode (oxidation) and the standard hydrogen electrode will act as the cathode (reduction).<br><br>At anode: $\\text{Cd}_{(s)} \\longrightarrow \\text{Cd}^{2+}_{(aq)} + 2\\text{e}^-$<br><br>At cathode: $2\\text{H}^+_{(aq)} + 2\\text{e}^- \\longrightarrow \\text{H}_{2(g)}$<br><br>Adding the two half-cell reactions, the net cell reaction is:<br><br>$\\text{Cd}_{(s)} + 2\\text{H}^+_{(aq)} \\longrightarrow \\text{Cd}^{2+}_{(aq)} + \\text{H}_{2(g)}$<br><br>Answer: $\\text{Cd}_{(s)} + 2\\text{H}^+_{(aq)} \\longrightarrow \\text{Cd}^{2+}_{(aq)} + \\text{H}_{2(g)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3448c30a4553e1be1f0", "type": "singleCorrect", "question": {"text": "If standard reduction potential $(E^0)$ of $\\left(\\text{Al}^{+3}_{(aq)}|\\text{Al}_{(s)}\\right)$, $\\left(\\text{Fe}^{+2}_{(aq)}|\\text{Fe}_{(s)}\\right)$, $\\left(\\text{Cu}^{+2}_{(aq)}|\\text{Cu}_{(s)}\\right)$ and $\\left(\\text{Ag}^{+1}_{(aq)}|\\text{Ag}_{(s)}\\right)$ are $-1 \\cdot 66$ V, $-0 \\cdot 44$ V, $+0 \\cdot 34$ V and $+0 \\cdot 79$ V respectively. Which of the following reaction is non spontaneous ?", "image": null}, "options": [{"id": "yLy5D", "label": "A", "text": "$2\\text{Ag}_{(s)} + \\text{Fe}^{+2}_{(aq)} \\rightarrow 2\\text{Ag}^{+1}_{(aq)} + \\text{Fe}_{(s)}$", "isCorrect": true, "image": null}, {"id": "xcV28", "label": "B", "text": "$2\\text{Al}_{(s)} + 3\\text{Cu}^{+2}_{(aq)} \\rightarrow 2\\text{Al}^{+3}_{(aq)} + 3\\text{Cu}_{(s)}$", "isCorrect": false, "image": null}, {"id": "AWGPp", "label": "C", "text": "$\\text{Fe}_{(s)} + \\text{Cu}^{+2}_{(aq)} \\rightarrow \\text{Fe}^{+2}_{(aq)} + \\text{Cu}_{(s)}$", "isCorrect": false, "image": null}, {"id": "d8ZYt", "label": "D", "text": "$2\\text{Al}_{(s)} + 3\\text{Fe}^{+2}_{(aq)} \\rightarrow 2\\text{Al}^{+3}_{(aq)} + 3\\text{Fe}_{(s)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a reaction to be non-spontaneous, the standard cell potential $E^{0}_{\\text{cell}}$ must be negative, where $E^{0}_{\\text{cell}} = E^{0}_{\\text{cathode}} - E^{0}_{\\text{anode}}$.<br><br>For the reaction $2\\text{Ag}_{(s)} + \\text{Fe}^{+2}_{(aq)} \\rightarrow 2\\text{Ag}^{+1}_{(aq)} + \\text{Fe}_{(s)}$:<br><br>$\\text{Ag}$ undergoes oxidation (anode) and $\\text{Fe}^{+2}$ undergoes reduction (cathode).<br><br>$E^{0}_{\\text{cell}} = E^{0}_{\\text{Fe}^{+2}/\\text{Fe}} - E^{0}_{\\text{Ag}^{+}/\\text{Ag}}$<br><br>$E^{0}_{\\text{cell}} = -0.44 - 0.79 = -1.23 \\text{ V}$<br><br>Since $E^{0}_{\\text{cell}} < 0$, this reaction is non-spontaneous.<br><br>For the other reactions, $E^{0}_{\\text{cell}}$ is positive, making them spontaneous:<br><br>$2\\text{Al}_{(s)} + 3\\text{Cu}^{+2}_{(aq)} \\rightarrow 2\\text{Al}^{+3}_{(aq)} + 3\\text{Cu}_{(s)} \\Rightarrow E^{0}_{\\text{cell}} = 0.34 - (-1.66) = +2.00 \\text{ V}$<br><br>$\\text{Fe}_{(s)} + \\text{Cu}^{+2}_{(aq)} \\rightarrow \\text{Fe}^{+2}_{(aq)} + \\text{Cu}_{(s)} \\Rightarrow E^{0}_{\\text{cell}} = 0.34 - (-0.44) = +0.78 \\text{ V}$<br><br>$2\\text{Al}_{(s)} + 3\\text{Fe}^{+2}_{(aq)} \\rightarrow 2\\text{Al}^{+3}_{(aq)} + 3\\text{Fe}_{(s)} \\Rightarrow E^{0}_{\\text{cell}} = -0.44 - (-1.66) = +1.22 \\text{ V}$<br><br>Answer: $2\\text{Ag}_{(s)} + \\text{Fe}^{+2}_{(aq)} \\rightarrow 2\\text{Ag}^{+1}_{(aq)} + \\text{Fe}_{(s)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c58c30a4553e1bdca3", "type": "singleCorrect", "question": {"text": "If the emf of cell, $\\text{Cu}_{(s)} \\mid \\text{Cu}^{2+}_{(1M)} \\| \\text{Ag}^{+}_{(1M)} \\mid \\text{Ag}$ is 0.463 V at $25\\ ^\\circ\\text{C}$ and standard potential of Cu electrode is 0.337 V. Find the standard potential of Ag electrode", "image": null}, "options": [{"id": "U7TUk", "label": "A", "text": "$0.128\\ \\text{V}$", "isCorrect": false, "image": null}, {"id": "JiaJh", "label": "B", "text": "$-0.128\\ \\text{V}$", "isCorrect": false, "image": null}, {"id": "6apyf", "label": "C", "text": "$0.8\\ \\text{V}$", "isCorrect": true, "image": null}, {"id": "Bh5OU", "label": "D", "text": "$-0.8\\ \\text{V}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The cell representation is $\\text{Cu}_{(s)} \\mid \\text{Cu}^{2+}_{(1M)} \\| \\text{Ag}^{+}_{(1M)} \\mid \\text{Ag}$.<br><br>Since the concentrations of the ions are $1\\ \\text{M}$, the given emf is the standard emf of the cell, $E^{\\circ}_{\\text{cell}} = 0.463\\ \\text{V}$.<br><br>The standard reduction potential of the anode (Cu) is $E^{\\circ}_{\\text{Cu}^{2+}/\\text{Cu}} = 0.337\\ \\text{V}$.<br><br>Using the relation for standard cell potential:<br><br>$E^{\\circ}_{\\text{cell}} = E^{\\circ}_{\\text{cathode}} - E^{\\circ}_{\\text{anode}}$<br><br>$E^{\\circ}_{\\text{cell}} = E^{\\circ}_{\\text{Ag}^{+}/\\text{Ag}} - E^{\\circ}_{\\text{Cu}^{2+}/\\text{Cu}}$<br><br>Substituting the given values:<br><br>$0.463 = E^{\\circ}_{\\text{Ag}^{+}/\\text{Ag}} - 0.337$<br><br>$E^{\\circ}_{\\text{Ag}^{+}/\\text{Ag}} = 0.463 + 0.337 = 0.800\\ \\text{V}$<br><br>The standard potential of the Ag electrode is $0.8\\ \\text{V}$.<br><br>Answer: $0.8\\ \\text{V}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d48c30a4553e1bdd41", "type": "singleCorrect", "question": {"text": "What mass of silver (Atomic mass = 108 g/mol) deposited by a quantity of electricity which displaces 5600 mL of $\\text{O}_2$ at STP ?", "image": null}, "options": [{"id": "MXeQ5", "label": "A", "text": "$5.4\\ \\text{g}$", "isCorrect": false, "image": null}, {"id": "sd1qH", "label": "B", "text": "$10.8\\ \\text{g}$", "isCorrect": false, "image": null}, {"id": "24QdS", "label": "C", "text": "$54.0\\ \\text{g}$", "isCorrect": false, "image": null}, {"id": "1hXM3", "label": "D", "text": "$108.0\\ \\text{g}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Volume of $O_2$ displaced at STP = $5600$ mL = $5.6$ L.<br><br>Moles of $O_2$ = $\\dfrac{5.6}{22.4} = 0.25$ mol.<br><br>The reaction for the liberation of $O_2$ is:<br>$2H_2O \\rightarrow O_2 + 4H^+ + 4e^-$<br><br>Number of moles of electrons (Faradays) required for $0.25$ mol of $O_2$ = $0.25 \\times 4 = 1$ F.<br><br>The reaction for the deposition of silver is:<br>$Ag^+ + e^- \\rightarrow Ag$<br><br>Since $1$ F of electricity deposits $1$ mole of Ag, the mass of Ag deposited is:<br>$1 \\times 108 = 108.0$ g.<br><br>Answer: $108.0\\ \\text{g}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d48c30a4553e1bdd3f", "type": "singleCorrect", "question": {"text": "Which of the following reactions takes place at anode during the electrolysis of molten NaCl?", "image": null}, "options": [{"id": "vXXDT", "label": "A", "text": "$\\text{Na}^+_{(l)} + \\text{e}^- \\rightarrow \\text{Na}_{(l)}$", "isCorrect": false, "image": null}, {"id": "KGvCH", "label": "B", "text": "$\\text{Na}_{(s)} \\rightarrow \\text{Na}^+_{(l)} + \\text{e}^-$", "isCorrect": false, "image": null}, {"id": "qtPan", "label": "C", "text": "$\\text{Cl}_{2(g)} + 2\\text{e}^- \\rightarrow 2\\text{Cl}^-_{(l)}$", "isCorrect": false, "image": null}, {"id": "etuaQ", "label": "D", "text": "$2\\text{Cl}^-_{(l)} \\rightarrow \\text{Cl}_{2(g)} + 2\\text{e}^-$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "During the electrolysis of molten $\\text{NaCl}$, the ions present are $\\text{Na}^+$ and $\\text{Cl}^-$.<br><br>At the anode, oxidation takes place. The chloride ions ($\\text{Cl}^-$) migrate to the anode and lose electrons to form chlorine gas.<br><br>The reaction at the anode is:<br>$2\\text{Cl}^-_{(l)} \\rightarrow \\text{Cl}_{2(g)} + 2\\text{e}^-$<br><br>At the cathode, reduction takes place. The sodium ions ($\\text{Na}^+$) migrate to the cathode and gain electrons to form liquid sodium.<br><br>The reaction at the cathode is:<br>$\\text{Na}^+_{(l)} + \\text{e}^- \\rightarrow \\text{Na}_{(l)}$<br><br>Answer: $2\\text{Cl}^-_{(l)} \\rightarrow \\text{Cl}_{2(g)} + 2\\text{e}^-$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3368c30a4553e1be15b", "type": "singleCorrect", "question": {"text": "Identify the reaction from following so that the standard potential of $\\text{Cu}^{+2}/\\text{Cu}$ electrode is 0.34 V. with respective to SHE ?", "image": null}, "options": [{"id": "4nWTx", "label": "A", "text": "$\\text{Cu} \\rightarrow \\text{Cu}^{+2} + 2e^-$", "isCorrect": false, "image": null}, {"id": "dgmwf", "label": "B", "text": "$\\text{Cu}^{+2} + 2e^- \\rightarrow \\text{Cu}$", "isCorrect": true, "image": null}, {"id": "coEw3", "label": "C", "text": "$\\text{Cu}^+ \\rightarrow \\text{Cu}^{+2} + e^-$", "isCorrect": false, "image": null}, {"id": "L6SmU", "label": "D", "text": "$\\text{Cu}^{+3} \\rightarrow \\text{Cu}^{+2} + e^-$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to IUPAC convention, the standard electrode potential is defined as the standard reduction potential.<br><br>For the $\\text{Cu}^{+2}/\\text{Cu}$ electrode, the reduction half-reaction involves the gain of electrons by $\\text{Cu}^{+2}$ ions to form solid $\\text{Cu}$.<br><br>The reaction is $\\text{Cu}^{+2} + 2e^- \\rightarrow \\text{Cu}$, and its standard reduction potential is $+0.34\\text{ V}$ with respect to the Standard Hydrogen Electrode (SHE).<br><br>Answer: $\\text{Cu}^{+2} + 2e^- \\rightarrow \\text{Cu}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3358c30a4553e1be15a", "type": "singleCorrect", "question": {"text": "The cells A and B contain aqueous solutions of ferrous chloride and ferric chloride respectively. The mass of iron deposited by the same quantity of electricity in cells A and B is in the ratio.", "image": null}, "options": [{"id": "YCQAc", "label": "A", "text": "$1:1$", "isCorrect": false, "image": null}, {"id": "WReD2", "label": "B", "text": "$2:1$", "isCorrect": false, "image": null}, {"id": "k28tB", "label": "C", "text": "$3:1$", "isCorrect": false, "image": null}, {"id": "622h6", "label": "D", "text": "$3:2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "In cell A, ferrous chloride ($\\text{FeCl}_2$) contains iron in the $+2$ oxidation state. The reduction reaction is:<br><br>$\\text{Fe}^{2+} + 2e^{-} \\rightarrow \\text{Fe}$<br><br>The equivalent weight of iron in cell A is $E_A = \\dfrac{M}{2}$, where $M$ is the atomic mass of iron.<br><br>In cell B, ferric chloride ($\\text{FeCl}_3$) contains iron in the $+3$ oxidation state. The reduction reaction is:<br><br>$\\text{Fe}^{3+} + 3e^{-} \\rightarrow \\text{Fe}$<br><br>The equivalent weight of iron in cell B is $E_B = \\dfrac{M}{3}$.<br><br>According to Faraday's second law of electrolysis, the mass of a substance deposited by the same quantity of electricity is directly proportional to its equivalent weight. Thus, the ratio of the mass of iron deposited in cell A to that in cell B is:<br><br>$\\dfrac{m_A}{m_B} = \\dfrac{E_A}{E_B} = \\dfrac{\\dfrac{M}{2}}{\\dfrac{M}{3}} = \\dfrac{3}{2}$<br><br>The ratio is $3:2$.<br><br>Answer: $3:2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e28c30a4553e1bddd6", "type": "singleCorrect", "question": {"text": "The $E^0_{\\text{cell}}$ of $\\text{Al}_{(s)} | \\text{Al}^{3+}(1\\text{M}) || \\text{Pb}^{2+}(1\\text{M}) | \\text{Pb}_{(s)}$ cell is 1.5 V if $E^0_{\\text{Pb}}$ is $-0.14$ V then $E^0_{\\text{Al}}$ will be", "image": null}, "options": [{"id": "jogan", "label": "A", "text": "$1.64$ V", "isCorrect": false, "image": null}, {"id": "oSUN3", "label": "B", "text": "$-1.64$ V", "isCorrect": true, "image": null}, {"id": "itggX", "label": "C", "text": "$1.36$ V", "isCorrect": false, "image": null}, {"id": "UW2zv", "label": "D", "text": "$-1.36$ V", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The standard cell potential is given by the difference between the standard reduction potentials of the cathode and the anode.<br><br>$E^{0}_{\\text{cell}} = E^{0}_{\\text{cathode}} - E^{0}_{\\text{anode}}$<br><br>From the given cell representation, aluminium (Al) undergoes oxidation and acts as the anode, while lead (Pb) undergoes reduction and acts as the cathode.<br><br>$E^{0}_{\\text{cell}} = E^{0}_{\\text{Pb}^{2+}/\\text{Pb}} - E^{0}_{\\text{Al}^{3+}/\\text{Al}}$<br><br>Substituting the given values:<br><br>$1.5 = -0.14 - E^{0}_{\\text{Al}^{3+}/\\text{Al}}$<br><br>$E^{0}_{\\text{Al}^{3+}/\\text{Al}} = -0.14 - 1.5 = -1.64 \\text{ V}$<br><br>Answer: $-1.64$ V", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29c8c30a4553e1bdae9", "type": "singleCorrect", "question": {"text": "Which of the following reaction is possible at anode?", "image": null}, "options": [{"id": "T2HZE", "label": "A", "text": "$\\text{F}_2 + 2e^- \\rightarrow 2\\text{F}^-$", "isCorrect": false, "image": null}, {"id": "xacl3", "label": "B", "text": "$2\\text{H}^+ + \\dfrac{1}{2}\\text{O}_2 + 2e^- \\rightarrow \\text{H}_2\\text{O}$", "isCorrect": false, "image": null}, {"id": "5iVQy", "label": "C", "text": "$\\text{Fe}^{2+} \\rightarrow \\text{Fe}^{3+} + 1e^-$", "isCorrect": true, "image": null}, {"id": "eB8BB", "label": "D", "text": "$\\text{Cu}^{2+} + 2e^- \\rightarrow \\text{Cu}(s)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "At the anode, oxidation takes place. Oxidation is defined as the loss of electrons.<br><br>Analyzing the given reactions:<br><br>$\\text{F}_2 + 2e^- \\rightarrow 2\\text{F}^-$ involves the gain of electrons, hence it is a reduction reaction.<br><br>$2\\text{H}^+ + \\dfrac{1}{2}\\text{O}_2 + 2e^- \\rightarrow \\text{H}_2\\text{O}$ involves the gain of electrons, hence it is a reduction reaction.<br><br>$\\text{Fe}^{2+} \\rightarrow \\text{Fe}^{3+} + 1e^-$ involves the loss of an electron, hence it is an oxidation reaction.<br><br>$\\text{Cu}^{2+} + 2e^- \\rightarrow \\text{Cu}(s)$ involves the gain of electrons, hence it is a reduction reaction.<br><br>Since only the third reaction represents oxidation, it is the only reaction possible at the anode.<br><br>Answer: $\\text{Fe}^{2+} \\rightarrow \\text{Fe}^{3+} + 1e^-$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29c8c30a4553e1bdae8", "type": "singleCorrect", "question": {"text": "Which of the following statements is correct regarding the cathode of electrochemical cell ?", "image": null}, "options": [{"id": "Y0x3M", "label": "A", "text": "Oxidation occurs at the cathode", "isCorrect": false, "image": null}, {"id": "IKImo", "label": "B", "text": "Reduction occurs at cathode", "isCorrect": true, "image": null}, {"id": "q8pc0", "label": "C", "text": "Usually denoted by a negative sign", "isCorrect": false, "image": null}, {"id": "JShqn", "label": "D", "text": "Is usually made up of non conducting material.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In any electrochemical cell, whether galvanic or electrolytic, reduction always takes place at the cathode.<br><br>Oxidation always takes place at the anode.<br><br>The cathode is made of a conducting material to allow the flow of electrons.<br><br>In a galvanic cell, the cathode is denoted by a positive sign, whereas in an electrolytic cell, it is denoted by a negative sign. Thus, the only universally correct statement is that reduction occurs at the cathode.<br><br>Answer: Reduction occurs at cathode", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36f8c30a4553e1be3b2", "type": "singleCorrect", "question": {"text": "Identify from following cell reactions that is spontaneous under standard state of conditions.", "image": null}, "options": [{"id": "OMflg", "label": "A", "text": "$\\text{Ca(s)} + \\text{Cd}^{2+}\\text{(aq)} \\rightarrow \\text{Ca}^{2+}\\text{(aq)} + \\text{Cd(s)}$, $[E^0_{\\text{Ca}} = -2.866$ V & $E^0_{\\text{Cd}} = -0.403$ V$]$", "isCorrect": true, "image": null}, {"id": "sWKz1", "label": "B", "text": "$2\\text{Br}^-\\text{(s)} + \\text{Sn}^{2+}\\text{(aq)} \\rightarrow \\text{Br}_2\\text{(l)} + \\text{Sn(s)}$, $[E^0_{\\text{Br}} = 1.08$ V & $E^0_{\\text{Sn}} = -0.136$ V$]$", "isCorrect": false, "image": null}, {"id": "hHxkx", "label": "C", "text": "$2\\text{Ag(s)} + \\text{Ni}^{2+}\\text{(aq)} \\rightarrow 2\\text{Ag}^+\\text{(aq)} + \\text{Ni(s)}$, $[E^0_{\\text{Ag}} = 0.799$ V & $E^0_{\\text{Ni}} = -0.257$ V$]$", "isCorrect": false, "image": null}, {"id": "0Aof7", "label": "D", "text": "$2\\text{Au(s)} + \\text{Zn}^{2+}\\text{(aq)} \\rightarrow 2\\text{Au}^+\\text{(aq)} + \\text{Zn(s)}$, $[E^0_{\\text{Au}} = 1.68$ V & $E^0_{\\text{Zn}} = -0.763$ V$]$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a cell reaction to be spontaneous under standard conditions, the standard cell potential $E^{\\circ}_{\\text{cell}}$ must be positive.<br><br>$E^{\\circ}_{\\text{cell}} = E^{\\circ}_{\\text{cathode}} - E^{\\circ}_{\\text{anode}}$<br><br>Evaluating the given options:<br><br>For $\\text{Ca(s)} + \\text{Cd}^{2+}\\text{(aq)} \\rightarrow \\text{Ca}^{2+}\\text{(aq)} + \\text{Cd(s)}$:<br>Cathode (reduction): $\\text{Cd}^{2+} \\rightarrow \\text{Cd}$<br>Anode (oxidation): $\\text{Ca} \\rightarrow \\text{Ca}^{2+}$<br>$E^{\\circ}_{\\text{cell}} = -0.403 - (-2.866) = +2.463 \\text{ V}$ (Spontaneous)<br><br>For $2\\text{Br}^-\\text{(s)} + \\text{Sn}^{2+}\\text{(aq)} \\rightarrow \\text{Br}_2\\text{(l)} + \\text{Sn(s)}$:<br>Cathode: $\\text{Sn}^{2+} \\rightarrow \\text{Sn}$<br>Anode: $2\\text{Br}^- \\rightarrow \\text{Br}_2$<br>$E^{\\circ}_{\\text{cell}} = -0.136 - 1.08 = -1.216 \\text{ V}$ (Non-spontaneous)<br><br>For $2\\text{Ag(s)} + \\text{Ni}^{2+}\\text{(aq)} \\rightarrow 2\\text{Ag}^+\\text{(aq)} + \\text{Ni(s)}$:<br>Cathode: $\\text{Ni}^{2+} \\rightarrow \\text{Ni}$<br>Anode: $\\text{Ag} \\rightarrow \\text{Ag}^+$<br>$E^{\\circ}_{\\text{cell}} = -0.257 - 0.799 = -1.056 \\text{ V}$ (Non-spontaneous)<br><br>For $2\\text{Au(s)} + \\text{Zn}^{2+}\\text{(aq)} \\rightarrow 2\\text{Au}^+\\text{(aq)} + \\text{Zn(s)}$:<br>Cathode: $\\text{Zn}^{2+} \\rightarrow \\text{Zn}$<br>Anode: $\\text{Au} \\rightarrow \\text{Au}^+$<br>$E^{\\circ}_{\\text{cell}} = -0.763 - 1.68 = -2.443 \\text{ V}$ (Non-spontaneous)<br><br>The only reaction with a positive standard cell potential is the first one.<br><br>Answer: $\\text{Ca(s)} + \\text{Cd}^{2+}\\text{(aq)} \\rightarrow \\text{Ca}^{2+}\\text{(aq)} + \\text{Cd(s)}$, $[E^0_{\\text{Ca}} = -2.866$ V & $E^0_{\\text{Cd}} = -0.403$ V$]$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3618c30a4553e1be31d", "type": "singleCorrect", "question": {"text": "The standard potential of $\\text{Cu}^{+2}/\\text{Cu}$ is $0.34$ V at $298$ K. Calculate its potential at the same temperature when the $\\text{Cu}^{+2}$ ion concentration is $0.1$ M.", "image": null}, "options": [{"id": "g3xvY", "label": "A", "text": "$0.64$ V", "isCorrect": false, "image": null}, {"id": "lfwjN", "label": "B", "text": "$0.34$ V", "isCorrect": false, "image": null}, {"id": "9ZVRj", "label": "C", "text": "$0.31$ V", "isCorrect": true, "image": null}, {"id": "u6XkS", "label": "D", "text": "$0.37$ V", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reduction half-reaction is $\\text{Cu}^{+2} + 2e^{-} \\rightarrow \\text{Cu}$.<br><br>Using the Nernst equation for the electrode potential:<br><br>$E = E^{\\circ} - \\dfrac{0.0591}{n} \\log \\dfrac{1}{[\\text{Cu}^{+2}]}$<br><br>Given $E^{\\circ} = 0.34$ V, $n = 2$, and $[\\text{Cu}^{+2}] = 0.1$ M.<br><br>$E = 0.34 - \\dfrac{0.0591}{2} \\log \\dfrac{1}{0.1}$<br><br>$E = 0.34 - 0.0295 \\log 10$<br><br>$E = 0.34 - 0.0295 \\times 1$<br><br>$E = 0.3105$ V $\\approx 0.31$ V.<br><br>Answer: $0.31$ V", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "sh
