ctValue": null, "solution": {"text": "Dry cell is primary cell", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260bc0279619d9d8a26df", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "During the electrolysis of fused $\\mathrm{NaCl}$, the product obtained at anode is", "image": null}, "options": [{"id": "LxH86", "text": "$\\mathrm{Na}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}, {"id": "UTcbj", "text": "$\\mathrm{Cl}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": true}, {"id": "s0DuI", "text": "$\\mathrm{O}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "rF9vy", "text": "$\\mathrm{Na}_{(l)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Anode: The electrode of an electrochemical cell at which oxidation occurs.\n\nCathode: The electrode of an electrochemical cell at which reduction occurs.\nElectrolysis of molten $\\mathrm{NaCl}$ or fused $\\mathrm{NaCl}$\nSodium ions migrate to cathode, where electron enter, the melt is reduced to sodium metal\n$$\n\\mathrm{Na}^{+}+\\mathrm{e}^{-} \\longrightarrow \\mathrm{Cl}_2+\\mathrm{e}^{-}\n$$\nChlorine ions migrate to anode. They give up their electrons to the anode\nand are oxidized to chlorine gas:\n$$\n\\mathrm{Cl}^{-} \\longrightarrow \\frac{1}{2} \\mathrm{Cl}_2+\\mathrm{e}^{-}\n$$\nOverall reaction\n$$\n2 \\mathrm{NaCl} \\longrightarrow 2 \\mathrm{Na}(\\mathrm{s})+\\mathrm{Cl}_2 \\text { (g) }\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2605e0279619d9d8a23f0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "Which among the following statement is true for Galvanic cell?", "image": null}, "options": [{"id": "udtj5", "text": "The anode is negative and cathode is positive.", "image": null, "isCorrect": true}, {"id": "JPnSO", "text": "Electrical energy is converted into chemical energy.", "image": null, "isCorrect": false}, {"id": "qdePy", "text": "The anode is positive and cathode is negative.", "image": null, "isCorrect": false}, {"id": "1Lc84", "text": "Oxidation takes place at positive electrode and reduction takes place at negative electrode.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "- In galvanic cell anode is negative at which oxidation takes place and cathode is positive at which reduction takes place.\nIn galvanic cell chemical energy is converted into chemical energy", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260060279619d9d8a2123", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "During discharging the change taking place at cathode in lead accumulator is", "image": null}, "options": [{"id": "WH0kI", "text": "$\\mathrm{Pb}_{(\\mathrm{s})}$ is oxidised to $\\mathrm{Pb}_{(\\text {aq. } .}^{2+}$", "image": null, "isCorrect": false}, {"id": "cG3s4", "text": "$\\mathrm{Pb}_{\\text {(aq.) }}^{2+}$ is oxidised to $\\mathrm{PbO}_{2(\\mathrm{~s})}$", "image": null, "isCorrect": false}, {"id": "WsNAj", "text": "$\\mathrm{Pb} \\mathrm{O}_{2(\\mathrm{~s})}$ is reduced to $\\mathrm{Pb}_{(\\text {aq. })}^{2+}$", "image": null, "isCorrect": true}, {"id": "5iNZI", "text": "$\\mathrm{Pb}_{\\text {(aq.) }}^{2+}$ is reduced to $\\mathrm{Pb}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f0d0279619d9d8a1966", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "Which of the following acts as oxidising agent in hydrogen- oxygen fuel cell?", "image": null}, "options": [{"id": "URGj0", "text": "<math><msub><mrow><mi>H</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "lrIYJ", "text": "<math><msub><mrow><mi>O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "gDYzc", "text": "<math><mi>K</mi><mi>O</mi><mi>H</mi></math>", "image": null, "isCorrect": false}, {"id": "DAR5Q", "text": "C", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Hydrogen – oxygen fuel cell is electrochemical cell that converts the chemical energy of hydrogen which is a fuel and oxygen which act as an oxidising agent into electricity through a pair of redox reaction. Thus, option <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">b</mi></mrow></mfenced></math> is a correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a2632c0279619d9d8a3ca5", "title": "Corrosion", "totalQuestions": 2, "questions": [{"_id": "6abb885215a9fc0fc8c14297", "type": "singleCorrect", "question": {"text": "If a galvanized iron sheet is scratched and the iron surface is exposed to the atmosphere, the iron does not undergo corrosion. This is because:", "image": null}, "options": [{"id": "G7LV8", "label": "A", "text": "Zinc forms a protective oxide layer that covers the scratch.", "isCorrect": false, "image": null}, {"id": "8ZggP", "label": "B", "text": "Iron has a higher reduction potential than zinc, making iron the cathode.", "isCorrect": true, "image": null}, {"id": "QOE9y", "label": "C", "text": "Zinc has a lower oxidation potential than iron, acting as a sacrificial anode.", "isCorrect": false, "image": null}, {"id": "zuFhU", "label": "D", "text": "Electrons flow from the iron to the zinc to prevent oxidation.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The standard reduction potential of zinc ($E^{\\circ}_{\\text{Zn}^{2+}/\\text{Zn}} = -0.76 \\text{ V}$) is lower than that of iron ($E^{\\circ}_{\\text{Fe}^{2+}/\\text{Fe}} = -0.44 \\text{ V}$).<br><br>Since iron has a higher reduction potential than zinc, it has a greater tendency to get reduced. When the galvanized sheet is scratched and both metals are exposed to the environment, an electrochemical cell is formed.<br><br>Zinc, having a higher oxidation potential, acts as the anode and undergoes oxidation preferentially. It supplies electrons to the iron, which acts as the cathode. This prevents the oxidation of iron, thereby protecting it from corrosion. This method of protection is known as cathodic protection.<br><br>Answer: Iron has a higher reduction potential than zinc, making iron the cathode.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed40279619d9d8a17a0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "During galvanization of iron, which metal is used for coating the iron surface?", "image": null}, "options": [{"id": "GjNBB", "text": "Copper", "image": null, "isCorrect": false}, {"id": "AI5Ja", "text": "Zinc", "image": null, "isCorrect": true}, {"id": "kKrNJ", "text": "Nickel", "image": null, "isCorrect": false}, {"id": "CHvs6", "text": "Tin", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Because zinc gets oxidized first when comes in contact with moisture&nbsp;and hence iron surface is protected from corrosion.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a2632c0279619d9d8a3ca4", "title": "Conductance and Conductivity", "totalQuestions": 126, "questions": [{"_id": "6abb88d215a9fc0fc8c14748", "type": "singleCorrect", "question": {"text": "The molar conductivities of NaCl, HCl and $\\text{C}_2\\text{H}_5\\text{COONa}$ at infinite dilution are $126.45$, $426.16$ and $91$ ohm$^{-1}$cm$^2$. The molar conductivity of $\\text{C}_2\\text{H}_5\\text{COOH}$ is", "image": null}, "options": [{"id": "WsNo6", "label": "A", "text": "$201.28$ ohm$^{-1}$cm$^2$", "isCorrect": false, "image": null}, {"id": "KWXFL", "label": "B", "text": "$698.28$ ohm$^{-1}$cm$^2$", "isCorrect": false, "image": null}, {"id": "WvJkw", "label": "C", "text": "$540.48$ ohm$^{-1}$cm$^2$", "isCorrect": false, "image": null}, {"id": "3Dx25", "label": "D", "text": "$390.71$ ohm$^{-1}$cm$^2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to Kohlrausch's law of independent migration of ions, the molar conductivity of an electrolyte at infinite dilution is the sum of the limiting molar conductivities of its constituent ions.<br><br>$\\Lambda^{\\circ}_{m}(\\text{C}_2\\text{H}_5\\text{COOH}) = \\Lambda^{\\circ}_{m}(\\text{C}_2\\text{H}_5\\text{COO}^{-}) + \\Lambda^{\\circ}_{m}(\\text{H}^{+})$<br><br>This can be obtained by adding and subtracting the appropriate strong electrolytes:<br><br>$\\Lambda^{\\circ}_{m}(\\text{C}_2\\text{H}_5\\text{COOH}) = \\Lambda^{\\circ}_{m}(\\text{C}_2\\text{H}_5\\text{COONa}) + \\Lambda^{\\circ}_{m}(\\text{HCl}) - \\Lambda^{\\circ}_{m}(\\text{NaCl})$<br><br>Substituting the given values:<br><br>$\\Lambda^{\\circ}_{m}(\\text{C}_2\\text{H}_5\\text{COOH}) = 91 + 426.16 - 126.45$<br><br>$\\Lambda^{\\circ}_{m}(\\text{C}_2\\text{H}_5\\text{COOH}) = 517.16 - 126.45 = 390.71 \\text{ ohm}^{-1}\\text{cm}^2$<br><br>Answer: $390.71$ ohm$^{-1}$cm$^2$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a115a9fc0fc8c14587", "type": "singleCorrect", "question": {"text": "What is the molar conductivity of a $0.5$ mol/dm$^3$ $\\text{AgNO}_3$ solution if electrolytic conductivity of it is $5.76 \\times 10^{-3}$ S cm$^{-1}$ at $298$ K?", "image": null}, "options": [{"id": "HX2M7", "label": "A", "text": "$2.88$ S cm$^2$ mol$^{-1}$", "isCorrect": false, "image": null}, {"id": "fmaD5", "label": "B", "text": "$11.52$ S cm$^2$ mol$^{-1}$", "isCorrect": true, "image": null}, {"id": "UqDEu", "label": "C", "text": "$0.086$ S cm$^2$ mol$^{-1}$", "isCorrect": false, "image": null}, {"id": "SWiIE", "label": "D", "text": "$28.8$ S cm$^2$ mol$^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given:<br>Concentration $C = 0.5$ mol/dm$^3 = 0.5$ mol/L<br>Conductivity $\\kappa = 5.76 \\times 10^{-3}$ S cm$^{-1}$<br><br>The formula for molar conductivity is:<br>$\\Lambda_m = \\dfrac{\\kappa \\times 1000}{C}$<br><br>Substituting the given values:<br>$\\Lambda_m = \\dfrac{5.76 \\times 10^{-3} \\times 1000}{0.5}$<br><br>$\\Lambda_m = \\dfrac{5.76}{0.5} = 11.52$ S cm$^2$ mol$^{-1}$<br><br>Answer: $11.52$ S cm$^2$ mol$^{-1}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a115a9fc0fc8c14585", "type": "singleCorrect", "question": {"text": "Identify the value of $1$ S cm$^2$ mol$^{-1}$ from following.", "image": null}, "options": [{"id": "hIBqS", "label": "A", "text": "$10^{-4}$ S m$^2$ mol$^{-1}$", "isCorrect": true, "image": null}, {"id": "j1Htc", "label": "B", "text": "$10^{2}$ S m$^2$ mol$^{-1}$", "isCorrect": false, "image": null}, {"id": "a6Ose", "label": "C", "text": "$10^{-2}$ S m$^2$ mol$^{-1}$", "isCorrect": false, "image": null}, {"id": "ByykB", "label": "D", "text": "$10^{4}$ S m$^2$ mol$^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "We know that $1 \\text{ cm} = 10^{-2} \\text{ m}$.<br><br>Squaring both sides gives $1 \\text{ cm}^2 = (10^{-2} \\text{ m})^2 = 10^{-4} \\text{ m}^2$.<br><br>Substituting this into the given unit:<br><br>$1 \\text{ S cm}^2 \\text{ mol}^{-1} = 1 \\text{ S} (10^{-4} \\text{ m}^2) \\text{ mol}^{-1} = 10^{-4} \\text{ S m}^2 \\text{ mol}^{-1}$.<br><br>Answer: $10^{-4}$ S m$^2$ mol$^{-1}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884215a9fc0fc8c14202", "type": "singleCorrect", "question": {"text": "The molar conductivity of $0.01\\text{M}$ acetic acid at $25^\\circ$C is $16 \\text{ S m}^2 \\text{ mol}^{-1}$. Find its percent dissociation in the $0.01\\text{M}$ solution if molar conductivity of acetic acid at zero concentration is $390 \\text{ S m}^2 \\text{ mol}^{-1}$.", "image": null}, "options": [{"id": "oeAUf", "label": "A", "text": "$1\\%$", "isCorrect": false, "image": null}, {"id": "STRJI", "label": "B", "text": "$2.2\\%$", "isCorrect": false, "image": null}, {"id": "XU4yB", "label": "C", "text": "$3\\%$", "isCorrect": false, "image": null}, {"id": "olcrX", "label": "D", "text": "$4.1\\%$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The degree of dissociation $\\alpha$ is given by the ratio of molar conductivity at a given concentration to the molar conductivity at infinite dilution (zero concentration).<br><br>$\\alpha = \\dfrac{\\Lambda_m}{\\Lambda_m^\\circ}$<br><br>Given:<br>$\\Lambda_m = 16 \\text{ S m}^2 \\text{ mol}^{-1}$<br>$\\Lambda_m^\\circ = 390 \\text{ S m}^2 \\text{ mol}^{-1}$<br><br>Substituting the values:<br>$\\alpha = \\dfrac{16}{390} \\approx 0.041$<br><br>Percent dissociation $= \\alpha \\times 100$<br><br>Percent dissociation $= 0.041 \\times 100 = 4.1\\%$<br><br>Answer: $4.1\\%$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884215a9fc0fc8c14201", "type": "singleCorrect", "question": {"text": "What is the common unit of molar conductivity?", "image": null}, "options": [{"id": "OLZV0", "label": "A", "text": "$\\text{S m}^2 \\text{ mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "8acTX", "label": "B", "text": "$\\text{ohm}^{-1} \\text{ cm}^2 \\text{ mol}^{-1}$", "isCorrect": true, "image": null}, {"id": "pZfLj", "label": "C", "text": "$\\text{ohm cm}^2 \\text{ mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "pOoh7", "label": "D", "text": "$\\text{ohm}^{-1} \\text{ cm}^2 \\text{ mol}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Molar conductivity ($\\Lambda_m$) is defined as the conducting power of all the ions produced by dissolving one mole of an electrolyte in a solution.<br><br>Mathematically, it is given by:<br>$\\Lambda_m = \\dfrac{\\kappa}{C}$<br><br>Where $\\kappa$ is the conductivity with common units of $\\text{ohm}^{-1} \\text{ cm}^{-1}$ (or $\\text{S cm}^{-1}$) and $C$ is the concentration expressed in $\\text{mol cm}^{-3}$.<br><br>Substituting the units, we get:<br>$\\Lambda_m = \\dfrac{\\text{ohm}^{-1} \\text{ cm}^{-1}}{\\text{mol cm}^{-3}} = \\text{ohm}^{-1} \\text{ cm}^2 \\text{ mol}^{-1}$<br><br>Thus, the common unit of molar conductivity is $\\text{ohm}^{-1} \\text{ cm}^2 \\text{ mol}^{-1}$.<br><br>Answer: $\\text{ohm}^{-1} \\text{ cm}^2 \\text{ mol}^{-1}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885215a9fc0fc8c14298", "type": "singleCorrect", "question": {"text": "A conductivity cell containing $0.01$ M KCl produces resistance $600$ ohms at $25^\\circ C$. Find the cell constant if conductivity of $0.01$ M KCl at the same temperature is $0.0014$ $\\text{ohm}^{-1}\\,\\text{cm}^{-1}$.", "image": null}, "options": [{"id": "X08QA", "label": "A", "text": "$0.8\\,\\text{cm}^{-1}$", "isCorrect": false, "image": null}, {"id": "0AyJW", "label": "B", "text": "$0.84\\,\\text{cm}^{-1}$", "isCorrect": true, "image": null}, {"id": "GnxNi", "label": "C", "text": "$0.88\\,\\text{cm}^{-1}$", "isCorrect": false, "image": null}, {"id": "WNiUh", "label": "D", "text": "$0.76\\,\\text{cm}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given:<br><br>Resistance $R = 600$ $\\text{ohm}$<br><br>Conductivity $\\kappa = 0.0014$ $\\text{ohm}^{-1}\\,\\text{cm}^{-1}$<br><br>The cell constant $G^*$ is given by the relation:<br><br>$G^* = \\kappa \\times R$<br><br>Substituting the given values:<br><br>$G^* = 0.0014 \\times 600$<br><br>$G^* = 0.84$ $\\text{cm}^{-1}$<br><br>Answer: $0.84\\,\\text{cm}^{-1}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b115a9fc0fc8c1461b", "type": "singleCorrect", "question": {"text": "Which of the following is the correct expression for molar conductivity of $\\text{Na}_2\\text{SO}_4$ at infinite dilution?", "image": null}, "options": [{"id": "yTZbf", "label": "A", "text": "$\\Lambda_0(\\text{Na}_2\\text{SO}_4) = 2\\lambda^0_{(\\text{Na}^+)} + \\lambda^0(\\text{SO}_4^{2-})$", "isCorrect": true, "image": null}, {"id": "KQhO3", "label": "B", "text": "$\\Lambda_0(\\text{Na}_2\\text{SO}_4) = \\lambda^0_{(\\text{Na}^+)} + 2\\lambda^0(\\text{SO}_4^{2-})$", "isCorrect": false, "image": null}, {"id": "VjFAz", "label": "C", "text": "$\\Lambda_0(\\text{Na}_2\\text{SO}_4) = \\lambda^0(\\text{Na}^+) + \\lambda^0(\\text{SO}_4^{2-})$", "isCorrect": false, "image": null}, {"id": "USe2g", "label": "D", "text": "$\\Lambda_0(\\text{Na}_2\\text{SO}_4) = (1/2)\\lambda^0(\\text{Na}^+) + \\lambda^0(\\text{SO}_4^{2-})$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Kohlrausch's law of independent migration of ions, the limiting molar conductivity of an electrolyte is the sum of the limiting ionic conductivities of the cation and the anion, each multiplied by the number of ions present in one formula unit of the electrolyte.<br><br>The dissociation of sodium sulphate is given by:<br><br>$\\text{Na}_2\\text{SO}_4 \\rightarrow 2\\text{Na}^+ + \\text{SO}_4^{2-}$<br><br>Thus, the molar conductivity at infinite dilution is:<br><br>$\\Lambda_0(\\text{Na}_2\\text{SO}_4) = 2\\lambda^0(\\text{Na}^+) + \\lambda^0(\\text{SO}_4^{2-})$<br><br>Answer: $\\Lambda_0(\\text{Na}_2\\text{SO}_4) = 2\\lambda^0_{(\\text{Na}^+)} + \\lambda^0(\\text{SO}_4^{2-})$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887215a9fc0fc8c143c5", "type": "singleCorrect", "question": {"text": "Two solutions have concentration ratio $0.4$ and conductivity ratio $0.2$. What is the ratio of their molar conductivities?", "image": null}, "options": [{"id": "Eo5eO", "label": "A", "text": "$0.1$", "isCorrect": false, "image": null}, {"id": "0w63i", "label": "B", "text": "$0.2$", "isCorrect": false, "image": null}, {"id": "O5yWC", "label": "C", "text": "$0.5$", "isCorrect": true, "image": null}, {"id": "Huw7x", "label": "D", "text": "$0.4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Molar conductivity $\\Lambda_m$ is related to conductivity $\\kappa$ and concentration $C$ by the formula:<br><br>$\\Lambda_m = \\dfrac{\\kappa \\times 1000}{C}$<br><br>For two solutions, the ratio of their molar conductivities is given by:<br><br>$\\dfrac{\\Lambda_{m1}}{\\Lambda_{m2}} = \\dfrac{\\kappa_1}{\\kappa_2} \\times \\dfrac{C_2}{C_1}$<br><br>Given that the concentration ratio $\\dfrac{C_1}{C_2} = 0.4$ and the conductivity ratio $\\dfrac{\\kappa_1}{\\kappa_2} = 0.2$.<br><br>Substituting the given values:<br><br>$\\dfrac{\\Lambda_{m1}}{\\Lambda_{m2}} = \\dfrac{0.2}{0.4} = 0.5$<br><br>Answer: $0.5$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887215a9fc0fc8c143c4", "type": "singleCorrect", "question": {"text": "Calculate the molar conductivity of $0.001$ M $\\text{AgNO}_3$ solution if the conductivity of $0.001$ M $\\text{AgNO}_3$ solution is $1.3 \\times 10^{-4}$ ohm$^{-1}$ cm$^{-1}$.", "image": null}, "options": [{"id": "gkiHn", "label": "A", "text": "$130$ ohm$^{-1}$ cm$^2$ mol$^{-1}$", "isCorrect": true, "image": null}, {"id": "k1LsW", "label": "B", "text": "$125$ ohm$^{-1}$ cm$^2$ mol$^{-1}$", "isCorrect": false, "image": null}, {"id": "mrcze", "label": "C", "text": "$140$ ohm$^{-1}$ cm$^2$ mol$^{-1}$", "isCorrect": false, "image": null}, {"id": "6RvxN", "label": "D", "text": "$135$ ohm$^{-1}$ cm$^2$ mol$^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given conductivity, $\\kappa = 1.3 \\times 10^{-4}$ ohm$^{-1}$ cm$^{-1}$<br><br>Concentration, $C = 0.001$ M<br><br>The formula for molar conductivity is:<br><br>$\\Lambda_m = \\dfrac{\\kappa \\times 1000}{C}$<br><br>Substituting the given values:<br><br>$\\Lambda_m = \\dfrac{1.3 \\times 10^{-4} \\times 1000}{0.001}$<br><br>$\\Lambda_m = \\dfrac{1.3 \\times 10^{-1}}{10^{-3}}$<br><br>$\\Lambda_m = 130$ ohm$^{-1}$ cm$^2$ mol$^{-1}$<br><br>Answer: $130$ ohm$^{-1}$ cm$^2$ mol$^{-1}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888215a9fc0fc8c1445b", "type": "singleCorrect", "question": {"text": "The molar conductivity of HCl, $\\text{CH}_3\\text{COONa}$ and NaCl are $426.16\\,\\text{S cm}^2/\\text{mol}$, $91.0\\,\\text{S cm}^2/\\text{mol}$ and $126.4\\,\\text{S cm}^2/\\text{mol}$. What would be the $\\Lambda_0$ for $\\text{CH}_3\\text{COOH}$?", "image": null}, "options": [{"id": "IyO3n", "label": "A", "text": "$461.56\\,\\text{S cm}^2/\\text{mol}$", "isCorrect": false, "image": null}, {"id": "l2mse", "label": "B", "text": "$390.76\\,\\text{S cm}^2/\\text{mol}$", "isCorrect": true, "image": null}, {"id": "VxZQT", "label": "C", "text": "$-208.76\\,\\text{S cm}^2/\\text{mol}$", "isCorrect": false, "image": null}, {"id": "2okaR", "label": "D", "text": "$643.56\\,\\text{S cm}^2/\\text{mol}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to Kohlrausch's law of independent migration of ions:<br><br>$\\Lambda_0(\\text{CH}_3\\text{COOH}) = \\Lambda_0(\\text{CH}_3\\text{COONa}) + \\Lambda_0(\\text{HCl}) - \\Lambda_0(\\text{NaCl})$<br><br>Substituting the given values:<br><br>$\\Lambda_0(\\text{CH}_3\\text{COOH}) = 91.0 + 426.16 - 126.4$<br><br>$\\Lambda_0(\\text{CH}_3\\text{COOH}) = 517.16 - 126.4 = 390.76\\,\\text{S cm}^2/\\text{mol}$<br><br>Answer: $390.76\\,\\text{S cm}^2/\\text{mol}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888115a9fc0fc8c14459", "type": "singleCorrect", "question": {"text": "What is molar conductivity of acetic acid in $0.02$ M solution if its conductivity at the same concentration is $8 \\times 10^{-5}\\,\\text{ohm}^{-1}\\text{cm}^{-1}$?", "image": null}, "options": [{"id": "teUEZ", "label": "A", "text": "$10\\,\\text{ohm}^{-1}\\text{cm}^{2}\\text{mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "oOjCz", "label": "B", "text": "$8\\,\\text{ohm}^{-1}\\text{cm}^{2}\\text{mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "owmYS", "label": "C", "text": "$5\\,\\text{ohm}^{-1}\\text{cm}^{2}\\text{mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "u4tDO", "label": "D", "text": "$4\\,\\text{ohm}^{-1}\\text{cm}^{2}\\text{mol}^{-1}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given conductivity $\\kappa = 8 \\times 10^{-5}\\,\\text{ohm}^{-1}\\text{cm}^{-1}$<br><br>Concentration $C = 0.02\\,\\text{M}$<br><br>Molar conductivity $\\Lambda_m = \\dfrac{\\kappa \\times 1000}{C}$<br><br>$\\Lambda_m = \\dfrac{8 \\times 10^{-5} \\times 1000}{0.02}$<br><br>$\\Lambda_m = \\dfrac{8 \\times 10^{-2}}{2 \\times 10^{-2}}$<br><br>$\\Lambda_m = 4\\,\\text{ohm}^{-1}\\text{cm}^{2}\\text{mol}^{-1}$<br><br>Answer: $4\\,\\text{ohm}^{-1}\\text{cm}^{2}\\text{mol}^{-1}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883215a9fc0fc8c1416d", "type": "singleCorrect", "question": {"text": "What is the SI unit of molar conductivity?", "image": null}, "options": [{"id": "8eXop", "label": "A", "text": "$\\text{S m}^2\\text{mol}^{-1}$", "isCorrect": true, "image": null}, {"id": "U34DK", "label": "B", "text": "$\\Omega^{-1}\\text{cm}^2\\text{mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "EGyg5", "label": "C", "text": "$\\text{Sm}^{-2}\\text{mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "5MCpw", "label": "D", "text": "$\\Omega^{-1}\\text{cm}^{-2}\\text{mol}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Molar conductivity is given by $\\Lambda_m = \\dfrac{\\kappa}{c}$<br><br>The SI unit of conductivity $\\kappa$ is $\\text{S m}^{-1}$<br><br>The SI unit of concentration $c$ is $\\text{mol m}^{-3}$<br><br>Substituting the units, we get:<br><br>$\\Lambda_m = \\dfrac{\\text{S m}^{-1}}{\\text{mol m}^{-3}} = \\text{S m}^2 \\text{mol}^{-1}$<br><br>Answer: $\\text{S m}^2\\text{mol}^{-1}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2aa8c30a4553e1bdb7e", "type": "singleCorrect", "question": {"text": "If molar conductance at infinite dilution for $\\text{CH}_3\\text{COO}^-$ and $\\text{H}^+$ ions are $50\\ \\text{S cm}^2\\ \\text{mol}^{-1}$ and $350\\ \\text{S cm}^2\\ \\text{mol}^{-1}$ respectively, molar conductivity of $5 \\times 10^{-2}$ M $\\text{CH}_3\\text{COOH}$ is $20\\ \\text{S cm}^2\\text{mol}^{-1}$. What is the hydrogen ion concentration in $\\text{mol/dm}^3$ of $\\text{CH}_3\\text{COOH}$?", "image": null}, "options": [{"id": "pvKgp", "label": "A", "text": "$5 \\times 10^{-2}$", "isCorrect": false, "image": null}, {"id": "UIrMg", "label": "B", "text": "$5 \\times 10^{-3}$", "isCorrect": false, "image": null}, {"id": "vMHjd", "label": "C", "text": "$2.5 \\times 10^{-3}$", "isCorrect": true, "image": null}, {"id": "7FkjE", "label": "D", "text": "$2.5 \\times 10^{-4}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Molar conductivity at infinite dilution for $\\text{CH}_3\\text{COOH}$ is given by Kohlrausch's law:<br><br>$\\Lambda_m^\\infty = \\lambda^\\infty(\\text{CH}_3\\text{COO}^-) + \\lambda^\\infty(\\text{H}^+)$<br><br>$\\Lambda_m^\\infty = 50 + 350 = 400\\ \\text{S cm}^2\\ \\text{mol}^{-1}$<br><br>Degree of dissociation $\\alpha$ is:<br><br>$\\alpha = \\dfrac{\\Lambda_m}{\\Lambda_m^\\infty} = \\dfrac{20}{400} = 0.05$<br><br>Hydrogen ion concentration is:<br><br>$[\\text{H}^+] = C\\alpha = (5 \\times 10^{-2}) \\times 0.05 = 2.5 \\times 10^{-3}\\ \\text{mol/dm}^3$<br><br>Answer: $2.5 \\times 10^{-3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2aa8c30a4553e1bdb7d", "type": "singleCorrect", "question": {"text": "Which of the following expressions indicates the correct relationship between molar conductivity of strong electrolyte and its concentration?", "image": null}, "options": [{"id": "Hbb9j", "label": "A", "text": "$\\Lambda = \\Lambda_0 + \\sqrt{c}$", "isCorrect": false, "image": null}, {"id": "20n4u", "label": "B", "text": "$\\Lambda = \\Lambda_0 - a\\sqrt{c}$", "isCorrect": true, "image": null}, {"id": "0S7zs", "label": "C", "text": "$\\Lambda = \\Lambda_0 + a\\sqrt{c}$", "isCorrect": false, "image": null}, {"id": "CmCqh", "label": "D", "text": "$\\Lambda = \\Lambda_0 - \\sqrt{c}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The relationship between molar conductivity ($\\Lambda$) and concentration ($c$) for a strong electrolyte is given by the Debye-Huckel-Onsager equation.<br><br>The equation is $\\Lambda = \\Lambda_0 - a\\sqrt{c}$, where $\\Lambda_0$ is the limiting molar conductivity at infinite dilution and $a$ is a constant that depends on the nature of the electrolyte, solvent, and temperature.<br><br>Answer: $\\Lambda = \\Lambda_0 - a\\sqrt{c}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3518c30a4553e1be270", "type": "singleCorrect", "question": {"text": "What is the molar conductivity of $0.02$ M KI solution if its conductivity is $4.37 \\times 10^{-4}\\,\\Omega^{-1}\\,\\text{cm}^{-1}$ ?", "image": null}, "options": [{"id": "umMkW", "label": "A", "text": "$8.74\\ \\Omega^{-1}\\,\\text{cm}^2\\text{mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "DbMuz", "label": "B", "text": "$21.85\\ \\Omega^{-1}\\,\\text{cm}^2\\text{mol}^{-1}$", "isCorrect": true, "image": null}, {"id": "AEq9F", "label": "C", "text": "$43.70\\ \\Omega^{-1}\\,\\text{cm}^2\\text{mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "GaQTf", "label": "D", "text": "$13.65\\ \\Omega^{-1}\\,\\text{cm}^2\\text{mol}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given:<br><br>Conductivity, $\\kappa = 4.37 \\times 10^{-4} \\, \\Omega^{-1} \\, \\text{cm}^{-1}$<br><br>Molarity, $M = 0.02 \\, \\text{M}$<br><br>The formula for molar conductivity is:<br><br>$\\Lambda_m = \\dfrac{\\kappa \\times 1000}{M}$<br><br>Substituting the given values:<br><br>$\\Lambda_m = \\dfrac{4.37 \\times 10^{-4} \\times 1000}{0.02}$<br><br>$\\Lambda_m = \\dfrac{0.437}{0.02}$<br><br>$\\Lambda_m = 21.85 \\, \\Omega^{-1} \\, \\text{cm}^2 \\, \\text{mol}^{-1}$<br><br>Answer: $21.85\\ \\Omega^{-1}\\,\\text{cm}^2\\text{mol}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30e8c30a4553e1bdfaf", "type": "singleCorrect", "question": {"text": "What is molar conductivity of $\\text{CH}_3\\text{COOH}$ at zero concentration if the molar conductivities of $\\text{H}_2\\text{SO}_4$, $\\text{K}_2\\text{SO}_4$ and $\\text{CH}_3\\text{COOK}$ at zero concentrations are respectively x, y and z $\\Omega^{-1}\\text{cm}^2\\text{mol}^{-1}$ ?", "image": null}, "options": [{"id": "OwY6D", "label": "A", "text": "$\\dfrac{(x - y)}{2} + z$", "isCorrect": true, "image": null}, {"id": "vS4tL", "label": "B", "text": "$(x - y + 2z)$", "isCorrect": false, "image": null}, {"id": "ir0sk", "label": "C", "text": "$(x + y - z)$", "isCorrect": false, "image": null}, {"id": "jt3aF", "label": "D", "text": "$\\dfrac{(x - y)}{2} + 2z$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "By Kohlrausch's law of independent migration of ions:<br><br>$\\Lambda^\\circ_m(H_2SO_4) = 2\\lambda^\\circ(H^+) + \\lambda^\\circ(SO_4^{2-}) = x$<br><br>$\\Lambda^\\circ_m(K_2SO_4) = 2\\lambda^\\circ(K^+) + \\lambda^\\circ(SO_4^{2-}) = y$<br><br>$\\Lambda^\\circ_m(CH_3COOK) = \\lambda^\\circ(CH_3COO^-) + \\lambda^\\circ(K^+) = z$<br><br>The molar conductivity of $CH_3COOH$ at zero concentration is:<br><br>$\\Lambda^\\circ_m(CH_3COOH) = \\lambda^\\circ(CH_3COO^-) + \\lambda^\\circ(H^+)$<br><br>Subtracting the second equation from the first:<br><br>$x - y = 2\\lambda^\\circ(H^+) - 2\\lambda^\\circ(K^+)$<br><br>$\\dfrac{x - y}{2} = \\lambda^\\circ(H^+) - \\lambda^\\circ(K^+)$<br><br>Adding this to the third equation:<br><br>$\\dfrac{x - y}{2} + z = [\\lambda^\\circ(H^+) - \\lambda^\\circ(K^+)] + [\\lambda^\\circ(CH_3COO^-) + \\lambda^\\circ(K^+)]$<br><br>$\\dfrac{x - y}{2} + z = \\lambda^\\circ(CH_3COO^-) + \\lambda^\\circ(H^+)$<br><br>Therefore, $\\Lambda^\\circ_m(CH_3COOH) = \\dfrac{x - y}{2} + z$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30c8c30a4553e1bdf96", "type": "singleCorrect", "question": {"text": "What must be the molarity of $\\text{BaCl}_2$ solution to have molar conductivity $240\\,\\Omega^{-1}\\text{cm}^2\\text{mol}^{-1}$ and conductivity $0.012\\,\\Omega^{-1}\\text{cm}^{-1}$ at $25^\\circ\\text{C}$ ?", "image": null}, "options": [{"id": "XOCNa", "label": "A", "text": "$0.01$ M", "isCorrect": false, "image": null}, {"id": "iTGzE", "label": "B", "text": "$0.02$ M", "isCorrect": false, "image": null}, {"id": "vV7yd", "label": "C", "text": "$0.05$ M", "isCorrect": true, "image": null}, {"id": "7JVJE", "label": "D", "text": "$0.1$ M", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The relationship between molar conductivity $\\Lambda_m$, conductivity $\\kappa$, and molarity $M$ is given by the formula:<br><br>$\\Lambda_m = \\dfrac{\\kappa \\times 1000}{M}$<br><br>Given values are:<br>$\\Lambda_m = 240 \\, \\Omega^{-1}\\text{cm}^2\\text{mol}^{-1}$<br>$\\kappa = 0.012 \\, \\Omega^{-1}\\text{cm}^{-1}$<br><br>Substituting the given values into the formula:<br><br>$240 = \\dfrac{0.012 \\times 1000}{M}$<br><br>$240 = \\dfrac{12}{M}$<br><br>$M = \\dfrac{12}{240}$<br><br>$M = 0.05 \\, \\text{M}$<br><br>Answer: $0.05$ M", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ff8c30a4553e1bdf0b", "type": "singleCorrect", "question": {"text": "What is the conductivity of $0.02\\ \\text{M}\\ \\text{AgNO}_3$ solution having cell constant $1.2\\ \\text{cm}^{-1}$ and resistance $95.0\\ \\text{ohms}$ ?", "image": null}, "options": [{"id": "caB8t", "label": "A", "text": "$1.140 \\times 10^{-2}\\ \\Omega^{-1}\\ \\text{cm}^{-1}$", "isCorrect": false, "image": null}, {"id": "pM2GR", "label": "B", "text": "$1.263 \\times 10^{-2}\\ \\Omega^{-1}\\ \\text{cm}^{-1}$", "isCorrect": true, "image": null}, {"id": "PstwX", "label": "C", "text": "$1.340 \\times 10^{-2}\\ \\Omega^{-1}\\ \\text{cm}^{-1}$", "isCorrect": false, "image": null}, {"id": "ZFKjI", "label": "D", "text": "$1.463 \\times 10^{-2}\\ \\Omega^{-1}\\ \\text{cm}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given:<br><br>Resistance, $R = 95.0\\ \\Omega$<br><br>Cell constant, $G^{*} = 1.2\\ \\text{cm}^{-1}$<br><br>The conductivity $\\kappa$ is given by the relation:<br><br>$\\kappa = \\dfrac{1}{R} \\times G^{*}$<br><br>Substituting the given values:<br><br>$\\kappa = \\dfrac{1}{95.0} \\times 1.2$<br><br>$\\kappa = 0.01263\\ \\Omega^{-1}\\ \\text{cm}^{-1}$<br><br>$\\kappa = 1.263 \\times 10^{-2}\\ \\Omega^{-1}\\ \\text{cm}^{-1}$<br><br>Answer: $1.263 \\times 10^{-2}\\ \\Omega^{-1}\\ \\text{cm}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3458c30a4553e1be1f6", "type": "singleCorrect", "question": {"text": "The graphical variation of molar conductivity $(\\Lambda)$ against square root of molar concentration $(\\sqrt{c})$ of certain electrolyte 'X' is linear with intercept on y axis. Identify X from following.", "image": null}, "options": [{"id": "BlKSu", "label": "A", "text": "$\\text{CH}_3\\text{COOH}$", "isCorrect": false, "image": null}, {"id": "kwsOl", "label": "B", "text": "$\\text{NH}_4\\text{OH}$", "isCorrect": false, "image": null}, {"id": "F2ZAS", "label": "C", "text": "$\\text{HCOOH}$", "isCorrect": false, "image": null}, {"id": "GDkQB", "label": "D", "text": "$\\text{CH}_3\\text{COONa}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to the Debye-Hückel-Onsager equation, the variation of molar conductivity $\\Lambda_m$ with the square root of concentration $\\sqrt{c}$ is given by $\\Lambda_m = \\Lambda_m^\\circ - A\\sqrt{c}$.<br><br>This linear relationship with a definite y-intercept ($\\Lambda_m^\\circ$) is observed only for strong electrolytes.<br><br>Weak electrolytes show a steep curve at low concentrations and do not have a linear plot or a well-defined intercept.<br><br>Among the given options, $\\text{CH}_3\\text{COOH}$, $\\text{NH}_4\\text{OH}$, and $\\text{HCOOH}$ are weak electrolytes.<br><br>$\\text{CH}_3\\text{COONa}$ is a salt of a weak acid and a strong base, making it a strong electrolyte.<br><br>Therefore, $\\text{CH}_3\\text{COONa}$ will show a linear variation with an intercept on the y-axis.<br><br>Answer: $\\text{CH}_3\\text{COONa}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c48c30a4553e1bdc98", "type": "singleCorrect", "question": {"text": "The conductivity of 0.02 M of KCl solution at 298 K is 0.0123 $\\text{ohm}^{-1}\\ \\text{cm}^{-1}$. If the resistance of the cell containing this solution is 120 ohms, what is the value of the cell constant ?", "image": null}, "options": [{"id": "Npiu9", "label": "A", "text": "$1.050\\ \\text{cm}^{-1}$", "isCorrect": false, "image": null}, {"id": "RbVa6", "label": "B", "text": "$1.025\\ \\text{cm}^{-1}$", "isCorrect": false, "image": null}, {"id": "Nf0tx", "label": "C", "text": "$1.376\\ \\text{cm}^{-1}$", "isCorrect": false, "image": null}, {"id": "VKbwA", "label": "D", "text": "$1.476\\ \\text{cm}^{-1}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The relation between conductivity $\\kappa$, resistance $R$, and cell constant $G^*$ is given by:<br><br>$G^* = \\kappa \\times R$<br><br>Given:<br>$\\kappa = 0.0123 \\text{ ohm}^{-1}\\ \\text{cm}^{-1}$<br>$R = 120 \\text{ ohms}$<br><br>Substituting the values:<br><br>$G^* = 0.0123 \\times 120$<br><br>$G^* = 1.476 \\text{ cm}^{-1}$<br><br>Answer: $1.476\\ \\text{cm}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e28c30a4553e1bddd7", "type": "singleCorrect", "question": {"text": "Calculate the concentration of silver nitrate solution if molar conductivity and conductivity of silver nitrate at $25^\\circ$C are respectively 120 ohm$^{-1}$ cm$^2$ mol$^{-1}$ and 0.0024 ohm$^{-1}$ cm$^{-1}$.", "image": null}, "options": [{"id": "0AgXK", "label": "A", "text": "$0.01$ M", "isCorrect": false, "image": null}, {"id": "VcSsn", "label": "B", "text": "$0.02$ M", "isCorrect": true, "image": null}, {"id": "QLYMc", "label": "C", "text": "$0.03$ M", "isCorrect": false, "image": null}, {"id": "RDouP", "label": "D", "text": "$0.04$ M", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The relationship between molar conductivity $\\Lambda_m$, conductivity $\\kappa$, and concentration $C$ in molarity is given by:<br><br>$\\Lambda_m = \\dfrac{\\kappa \\times 1000}{C}$<br><br>Rearranging the formula to solve for concentration $C$:<br><br>$C = \\dfrac{\\kappa \\times 1000}{\\Lambda_m}$<br><br>Substituting the given values $\\kappa = 0.0024 \\text{ ohm}^{-1} \\text{ cm}^{-1}$ and $\\Lambda_m = 120 \\text{ ohm}^{-1} \\text{ cm}^2 \\text{ mol}^{-1}$:<br><br>$C = \\dfrac{0.0024 \\times 1000}{120}$<br><br>$C = \\dfrac{2.4}{120}$<br><br>$C = 0.02 \\text{ M}$<br><br>Answer: $0.02$ M", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31a8c30a4553e1be02f", "type": "singleCorrect", "question": {"text": "The molar conductivity of $0.01$ M monobasic acid at $25\\,^\\circ\\text{C}$ is $15$ ohm$^{-1}$ cm$^2$ mol$^{-1}$. The molar conductivity of the same acid at infinite dilution is $375$ ohm$^{-1}$ cm$^2$ mol$^{-1}$. Calculate $[\\text{H}^+]$ in solution.", "image": null}, "options": [{"id": "xbxga", "label": "A", "text": "$2.0 \\times 10^{-4}$ M", "isCorrect": false, "image": null}, {"id": "NJmPj", "label": "B", "text": "$3.0 \\times 10^{-4}$ M", "isCorrect": false, "image": null}, {"id": "rtnBC", "label": "C", "text": "$4.0 \\times 10^{-4}$ M", "isCorrect": true, "image": null}, {"id": "lka2p", "label": "D", "text": "$5.0 \\times 10^{-4}$ M", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The degree of dissociation $\\alpha$ is given by the ratio of molar conductivity at a given concentration to the molar conductivity at infinite dilution.<br><br>$\\alpha = \\dfrac{\\Lambda_m}{\\Lambda_m^\\infty}$<br><br>Substituting the given values:<br><br>$\\alpha = \\dfrac{15}{375} = 0.04$<br><br>For a weak monobasic acid, the concentration of hydrogen ions is given by:<br><br>$[\\text{H}^+] = C\\alpha$<br><br>Substituting $C = 0.01$ M and $\\alpha = 0.04$:<br><br>$[\\text{H}^+] = 0.01 \\times 0.04 = 4.0 \\times 10^{-4}$ M<br><br>Answer: $4.0 \\times 10^{-4}$ M", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31a8c30a4553e1be02d", "type": "singleCorrect", "question": {"text": "The molar conductivity of $0.04$ M $\\text{AB}_2$ type salt solution at $300$ K is $200\\,\\Omega^{-1}\\text{cm}^2\\text{mol}^{-1}$. Find the conductivity.", "image": null}, "options": [{"id": "HYBsH", "label": "A", "text": "$0.006\\,\\Omega^{-1}\\text{cm}^{-1}$", "isCorrect": false, "image": null}, {"id": "KRjX4", "label": "B", "text": "$0.008\\,\\Omega^{-1}\\text{cm}^{-1}$", "isCorrect": true, "image": null}, {"id": "CcHhL", "label": "C", "text": "$0.01\\,\\Omega^{-1}\\text{cm}^{-1}$", "isCorrect": false, "image": null}, {"id": "aFfXk", "label": "D", "text": "$0.015\\,\\Omega^{-1}\\text{cm}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The relation between molar conductivity $\\Lambda_m$, conductivity $\\kappa$, and molarity $M$ is given by:<br><br>$\\Lambda_m = \\dfrac{\\kappa \\times 1000}{M}$<br><br>Given:<br><br>$\\Lambda_m = 200\\,\\Omega^{-1}\\text{cm}^2\\text{mol}^{-1}$<br><br>$M = 0.04$ M<br><br>Substituting the given values into the formula:<br><br>$200 = \\dfrac{\\kappa \\times 1000}{0.04}$<br><br>$\\kappa = \\dfrac{200 \\times 0.04}{1000}$<br><br>$\\kappa = \\dfrac{8}{1000} = 0.008\\,\\Omega^{-1}\\text{cm}^{-1}$<br><br>Answer: $0.008\\,\\Omega^{-1}\\text{cm}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29c8c30a4553e1bdae7", "type": "singleCorrect", "question": {"text": "Which of the following solutions will have the highest electrical conductivity?", "image": null}, "options": [{"id": "SUsBD", "label": "A", "text": "Distilled water", "isCorrect": false, "image": null}, {"id": "kcTmC", "label": "B", "text": "Sugar solution", "isCorrect": false, "image": null}, {"id": "QD3Fz", "label": "C", "text": "Salt solution", "isCorrect": true, "image": null}, {"id": "zF6kL", "label": "D", "text": "Alcohol solution", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Electrical conductivity of a solution depends on the concentration of free ions present in it.<br><br>Distilled water is a very poor conductor of electricity due to the negligible concentration of $H^+$ and $OH^-$ ions.<br><br>Sugar and alcohol are covalent compounds and do not dissociate into ions when dissolved in water. Hence, their solutions are non-electrolytes and do not conduct electricity.<br><br>Salt is an ionic compound and a strong electrolyte. It completely dissociates into its constituent ions in an aqueous solution, providing a large number of free ions for the conduction of electricity.<br><br>Thus, the salt solution will have the highest electrical conductivity.<br><br>Answer: Salt solution", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36f8c30a4553e1be3b3", "type": "singleCorrect", "question": {"text": "Calculate the molar conductivity of 0.2 M KCl solution at 298 K ($k = 0.0248 \\ \\Omega^{-1}$cm$^{-1}$)", "image": null}, "options": [{"id": "Mxq35", "label": "A", "text": "$143 \\ \\Omega^{-1}$ cm$^2$ mol$^{-1}$", "isCorrect": false, "image": null}, {"id": "czGKK", "label": "B", "text": "$98 \\ \\Omega^{-1}$ cm$^2$ mol$^{-1}$", "isCorrect": false, "image": null}, {"id": "9s0QU", "label": "C", "text": "$124 \\ \\Omega^{-1}$ cm$^2$ mol$^{-1}$", "isCorrect": true, "image": null}, {"id": "s8Db7", "label": "D", "text": "$87 \\ \\Omega^{-1}$ cm$^2$ mol$^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given concentration $C = 0.2$ M and conductivity $k = 0.0248 \\ \\Omega^{-1}$ cm$^{-1}$.<br><br>The formula for molar conductivity is $\\Lambda_m = \\dfrac{k \\times 1000}{C}$.<br><br>Substituting the given values:<br><br>$\\Lambda_m = \\dfrac{0.0248 \\times 1000}{0.2}$<br><br>$\\Lambda_m = \\dfrac{24.8}{0.2} = 124 \\ \\Omega^{-1}$ cm$^2$ mol$^{-1}$.<br><br>Answer: $124 \\ \\Omega^{-1}$ cm$^2$ mol$^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36f8c30a4553e1be3b1", "type": "singleCorrect", "question": {"text": "Identify the correct name of law.<br>\"At infinite dilution each ion migrates independent of co-ion and contributes to total molar conductivity of an elctrolyte irrespective of the nature of other ion to which it is associated.\"", "image": null}, "options": [{"id": "XQ3B7", "label": "A", "text": "Henry's law", "isCorrect": false, "image": null}, {"id": "voNod", "label": "B", "text": "Raoult's law", "isCorrect": false, "image": null}, {"id": "QN8tk", "label": "C", "text": "Nernst derivative law", "isCorrect": false, "image": null}, {"id": "EtGnd", "label": "D", "text": "Kohlrausch's law of independent migration of ions", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given statement describes Kohlrausch's law of independent migration of ions. According to this law, at infinite dilution, when dissociation is complete, each ion makes a definite contribution towards the equivalent or molar conductivity of the electrolyte irrespective of the nature of the other ion with which it is associated.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3618c30a4553e1be31c", "type": "singleCorrect", "question": {"text": "Which from following options is true when an electrolyte solution is diluted ?", "image": null}, "options": [{"id": "q4nRW", "label": "A", "text": "both $\\Lambda$ and $k$ increases", "isCorrect": false, "image": null}, {"id": "0rzcm", "label": "B", "text": "both $\\Lambda$ and $k$ decreases", "isCorrect": false, "image": null}, {"id": "RJgj1", "label": "C", "text": "$\\Lambda$ increases and $k$ decreases", "isCorrect": true, "image": null}, {"id": "17FPT", "label": "D", "text": "$\\Lambda$ decreases and $k$ increases", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "When an electrolyte solution is diluted, the volume of the solution increases, which leads to a decrease in the number of ions per unit volume. As a result, the specific conductivity ($k$) decreases.<br><br>Molar conductivity ($\\Lambda$) is the conductance of the volume of solution containing one mole of the electrolyte. It is given by $\\Lambda = k \\times V$. Upon dilution, the increase in volume ($V$) more than compensates for the decrease in specific conductivity ($k$). Additionally, for weak electrolytes, the degree of dissociation increases, and for strong electrolytes, interionic attractions decrease, leading to higher ionic mobility. Thus, molar conductivity ($\\Lambda$) increases.<br><br>Therefore, $\\Lambda$ increases and $k$ decreases.<br><br>Answer: $\\Lambda$ increases and $k$ decreases", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b88c30a4553e1bdc15", "type": "singleCorrect", "question": {"text": "At $298$ K, the specific conductance ($\\kappa$) of a $0.0020$ M NaCl solution is $2.50 \\times 10^{-4} \\text{ S cm}^{-1}$. Calculate the molar conductivity ($\\Lambda_m$) of the solution in $\\text{S cm}^2 \\text{ mol}^{-1}$.", "image": null}, "options": [{"id": "b0Q0T", "label": "A", "text": "$125$", "isCorrect": true, "image": null}, {"id": "7YiPp", "label": "B", "text": "$62.5$", "isCorrect": false, "image": null}, {"id": "eTxg4", "label": "C", "text": "$12.5$", "isCorrect": false, "image": null}, {"id": "TXU6b", "label": "D", "text": "$250$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given:<br><br>$\\kappa = 2.50 \\times 10^{-4} \\text{ S cm}^{-1}$<br><br>$C = 0.0020 \\text{ M}$<br><br>The molar conductivity $\\Lambda_m$ is given by the formula:<br><br>$\\Lambda_m = \\dfrac{\\kappa \\times 1000}{C}$<br><br>Substituting the given values:<br><br>$\\Lambda_m = \\dfrac{2.50 \\times 10^{-4} \\times 1000}{0.0020}$<br><br>$\\Lambda_m = \\dfrac{0.250}{0.0020}$<br><br>$\\Lambda_m = 125 \\text{ S cm}^2 \\text{ mol}^{-1}$<br><br>Answer: $125$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c01bf9280d7f9932e6a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the SI unit of resistivity?", "image": null}, "options": [{"id": "I1xin", "text": "$\\Omega \\mathrm{m}$", "image": null, "isCorrect": true}, {"id": "exFie", "text": "$\\Omega \\mathrm{m}^{-1}$", "image": null, "isCorrect": false}, {"id": "hLOBD", "text": "$\\Omega^{-1} \\mathrm{~m}^{-1}$", "image": null, "isCorrect": false}, {"id": "bmiWY", "text": "$\\Omega \\mathrm{m}^{-2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The resistance $R$ of a conductor is given by the formula:<br><br>$R = \\rho \\dfrac{L}{A}$<br><br>where $\\rho$ is the resistivity, $L$ is the length, and $A$ is the cross-sectional area.<br><br>Rearranging the formula for resistivity, we get:<br><br>$\\rho = \\dfrac{RA}{L}$<br><br>Substituting the SI units for resistance ($\\Omega$), area ($\\mathrm{m}^2$), and length ($\\mathrm{m}$):<br><br>Unit of $\\rho = \\dfrac{\\Omega \\times \\mathrm{m}^2}{\\mathrm{m}} = \\Omega \\mathrm{m}$<br><br>Answer: $\\Omega \\mathrm{m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bffbf9280d7f9932e54", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is percent dissociation of $\\mathrm{NH}_4 \\mathrm{OH}$ if molar conductance at zero concentration for $\\mathrm{NH}_4 \\mathrm{Cl}, \\mathrm{NaCl}$ and NaOH are 130,109 and $213 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ respectively and molar conductivity of $0.01 \\mathrm{M} \\mathrm{NH}_4 \\mathrm{OH}$ is $9.0 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ ?", "image": null}, "options": [{"id": "ZazkW", "text": "$\\frac{100}{40}$", "image": null, "isCorrect": false}, {"id": "lFIVZ", "text": "$\\frac{100}{35}$", "image": null, "isCorrect": false}, {"id": "l5SzO", "text": "$\\frac{100}{32}$", "image": null, "isCorrect": false}, {"id": "dVLm4", "text": "$\\frac{100}{26}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Using Kohlrausch's law of independent migration of ions:<br><br>$\\Lambda^{\\circ}(\\mathrm{NH}_4\\mathrm{OH}) = \\Lambda^{\\circ}(\\mathrm{NH}_4\\mathrm{Cl}) + \\Lambda^{\\circ}(\\mathrm{NaOH}) - \\Lambda^{\\circ}(\\mathrm{NaCl})$<br><br>Substituting the given values:<br><br>$\\Lambda^{\\circ}(\\mathrm{NH}_4\\mathrm{OH}) = 130 + 213 - 109 = 234 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$<br><br>The degree of dissociation $\\alpha$ is given by:<br><br>$\\alpha = \\dfrac{\\Lambda}{\\Lambda^{\\circ}}$<br><br>$\\alpha = \\dfrac{9.0}{234} = \\dfrac{1}{26}$<br><br>Percent dissociation is:<br><br>$\\% \\alpha = \\alpha \\times 100 = \\dfrac{100}{26}$<br><br>Answer: $\\frac{100}{26}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871befbf9280d7f9932dcc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the cell constant of conductivity cell containing $0.01 \\mathrm{M} \\mathrm{AgNO}_3$ solution having resistance $1440 \\Omega$ and conductivity $0.001262 \\Omega^{-1} \\mathrm{~cm}^{-1}$.", "image": null}, "options": [{"id": "PnH2f", "text": "$1.817 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "fRQFK", "text": "$1.014 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "JcQ9R", "text": "$0.883 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "TPCtg", "text": "$1.411 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The cell constant is given by the product of conductivity and resistance.<br><br>Cell constant $= k \\times R$<br><br>Given:<br>$k = 0.001262 \\Omega^{-1} \\mathrm{~cm}^{-1}$<br>$R = 1440 \\Omega$<br><br>Substituting the values:<br>Cell constant $= 0.001262 \\times 1440$<br><br>Cell constant $= 1.81728 \\mathrm{~cm}^{-1}$<br><br>Rounding off, we get $1.817 \\mathrm{~cm}^{-1}$.<br><br>Answer: $1.817 \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbcbf9280d7f9932bf7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is molar conductivity at zero concentration in $\\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ for aluminium sulphate, if molar ionic conductivities at zero concentration of $\\mathrm{Al}^{+3}$ and $\\mathrm{SO}_4^{-2}$ are $189 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ and $50.1 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ respectively?", "image": null}, "options": [{"id": "82OTQ", "text": "$239.1$", "image": null, "isCorrect": false}, {"id": "QlMvI", "text": "$428.1$", "image": null, "isCorrect": false}, {"id": "ekfW9", "text": "$478.2$", "image": null, "isCorrect": false}, {"id": "SdEFu", "text": "$528.3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Kohlrausch's law of independent migration of ions, the molar conductivity of an electrolyte at zero concentration is given by the sum of the molar ionic conductivities of its constituent ions, each multiplied by the number of ions present in one formula unit.<br><br>The chemical formula for aluminium sulphate is $\\mathrm{Al}_2(\\mathrm{SO}_4)_3$. It dissociates as:<br><br>$\\mathrm{Al}_2(\\mathrm{SO}_4)_3 \\rightarrow 2\\mathrm{Al}^{3+} + 3\\mathrm{SO}_4^{2-}$<br><br>The molar conductivity at zero concentration for aluminium sulphate is:<br><br>$\\Lambda^{\\circ}_{m} = 2 \\lambda^{\\circ}_{\\mathrm{Al}^{3+}} + 3 \\lambda^{\\circ}_{\\mathrm{SO}_4^{2-}}$<br><br>Substituting the given values:<br><br>$\\Lambda^{\\circ}_{m} = 2(189) + 3(50.1)$<br><br>$\\Lambda^{\\circ}_{m} = 378 + 150.3$<br><br>$\\Lambda^{\\circ}_{m} = 528.3 \\, \\Omega^{-1} \\mathrm{cm}^2 \\mathrm{mol}^{-1}$<br><br>Answer: $528.3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9abf9280d7f9932ac5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following is nonconductor of electricity?", "image": null}, "options": [{"id": "YucET", "text": "Solid sodium chloride", "image": null, "isCorrect": true}, {"id": "VCt88", "text": "Aqueous potassium chloride", "image": null, "isCorrect": false}, {"id": "64EJN", "text": "Graphite (s)", "image": null, "isCorrect": false}, {"id": "DKAmF", "text": "Copper metal (s)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Solid sodium chloride is an ionic solid. In the solid state, the ions are held in fixed positions by strong electrostatic forces of attraction and are not free to move. Therefore, it does not conduct electricity.<br><br>Aqueous potassium chloride contains free mobile ions and conducts electricity.<br><br>Graphite has delocalized electrons in its structure, making it a good conductor of electricity.<br><br>Copper metal is a metallic solid and conducts electricity due to the presence of free valence electrons.<br><br>Answer: Solid sodium chloride", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b00bf9280d7f993257f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following is the correct relationship between molar conductivity ($\\Lambda$), conductivity (k) and molarity (M) of solution for electrolyte?", "image": null}, "options": [{"id": "8nABQ", "text": "$\\mathrm{k}=\\frac{\\Lambda \\times \\mathrm{C}}{1000}$", "image": null, "isCorrect": true}, {"id": "FX6rL", "text": "$\\Lambda=\\frac{100 \\times \\mathrm{k}}{\\mathrm{C}}$", "image": null, "isCorrect": false}, {"id": "spgYX", "text": "$\\wedge=\\frac{k \\times C}{1000}$", "image": null, "isCorrect": false}, {"id": "1PA6S", "text": "$\\mathrm{k}=\\frac{1000 \\times \\mathrm{C}}{\\wedge}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The molar conductivity ($\\Lambda$) of a solution is defined as the conducting power of all the ions produced by dissolving one mole of an electrolyte in solution. It is related to conductivity ($k$) and molar concentration ($C$) by the formula:<br><br>$\\Lambda = \\dfrac{1000 \\times k}{C}$<br><br>Rearranging this equation to solve for conductivity ($k$), we get:<br><br>$k = \\dfrac{\\Lambda \\times C}{1000}$<br><br>Answer: $\\mathrm{k}=\\frac{\\Lambda \\times \\mathrm{C}}{1000}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214460aee93fa0796df57", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Calculate the cell constant of conductivity cell containing 0.1 M KCl solution having resistance $60 \\Omega$ and conductivity $0.014 \\Omega^{-1} \\mathrm{~cm}^{-1}$ at $25^{\\circ} \\mathrm{C}$.", "image": null}, "options": [{"id": "uGG2f", "text": "$0.42 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "lgDRU", "text": "$0.84 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "Fw8ef", "text": "$0.60 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "2egG7", "text": "$1.04 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relationship between conductivity $k$, resistance $R$, and cell constant is given by:<br><br>$k = \\dfrac{1}{R} \\times \\text{Cell constant}$<br><br>Rearranging the formula to solve for the ce
