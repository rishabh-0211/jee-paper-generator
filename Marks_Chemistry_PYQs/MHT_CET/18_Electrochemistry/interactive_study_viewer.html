rrect": false}], "correctValue": null, "solution": {"text": "The relationship between standard Gibbs free energy change and standard cell potential is given by $\\Delta G^{\\circ} = -nFE_{\\text{cell}}^{\\circ}$.<br><br>For the given cell reaction, the number of electrons transferred is $n = 2$.<br><br>Given $\\Delta G^{\\circ} = -386 \\text{ kJ} = -386000 \\text{ J}$ and $F = 96500 \\text{ C mol}^{-1}$.<br><br>Substituting the values into the equation:<br><br>$-386000 = -2 \\times 96500 \\times E_{\\text{cell}}^{\\circ}$<br><br>$-386000 = -193000 \\times E_{\\text{cell}}^{\\circ}$<br><br>$E_{\\text{cell}}^{\\circ} = \\dfrac{-386000}{-193000} = 2 \\text{ V}$<br><br>Answer: 2 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b27bf9280d7f99326b7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following formulae is used to obtain value of $\\mathrm{E}_{\\text {cell }}^*$ for a reaction taking place in Dry cell?", "image": null}, "options": [{"id": "VOa8K", "text": "$\\frac{-\\Delta G^{\\circ}}{F}$", "image": null, "isCorrect": false}, {"id": "DJE8m", "text": "$\\frac{-\\Delta G^{\\circ}}{2 F}$", "image": null, "isCorrect": true}, {"id": "H2qgg", "text": "$\\frac{-\\Delta G^{\\circ}}{3 F}$", "image": null, "isCorrect": false}, {"id": "8neW1", "text": "$\\frac{-\\Delta G^{\\circ}}{4 F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard Gibbs free energy change for a cell reaction is related to the standard cell potential by the equation:<br><br>$\\Delta G^{\\circ} = -n F E^{\\circ}_{\\text{cell}}$<br><br>For a dry cell (Leclanché cell), the half-reactions are:<br>Anode (oxidation): $Zn(s) \\rightarrow Zn^{2+}(aq) + 2e^{-}$<br>Cathode (reduction): $2NH_4^{+}(aq) + 2MnO_2(s) + 2e^{-} \\rightarrow Mn_2O_3(s) + 2NH_3(aq) + H_2O(l)$<br><br>The overall cell reaction involves the transfer of $2$ moles of electrons, which means $n = 2$.<br><br>Substituting $n = 2$ into the equation, we get:<br><br>$\\Delta G^{\\circ} = -2 F E^{\\circ}_{\\text{cell}}$<br><br>Rearranging the formula to solve for $E^{\\circ}_{\\text{cell}}$ gives:<br><br>$E^{\\circ}_{\\text{cell}} = \\dfrac{-\\Delta G^{\\circ}}{2 F}$<br><br>Answer: $\\frac{-\\Delta G^{\\circ}}{2 F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b24bf9280d7f99326a2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Standard potential $\\left(\\mathrm{E}^*\\right)$ of $\\mathrm{Zn}^{+2}{ }_{(a q)}+2 \\overline{\\mathrm{e}} \\rightarrow \\mathrm{Zn}_{(s)}$ is -0.76 V .\nWhat is standard potential of reaction $2 \\mathrm{Zn}_{(\\mathrm{s})} \\rightarrow 2 \\mathrm{Zn}^{+2}{ }_{(\\mathrm{aq})}+4 \\overline{\\mathrm{e}}$ ?", "image": null}, "options": [{"id": "db6yX", "text": "$-1.52 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "Nx019", "text": "$+1.52 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "79oe8", "text": "$-0.76 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "HKWmC", "text": "$+0.76 \\mathrm{~V}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given reaction is the reduction of zinc:<br><br>$\\mathrm{Zn}^{2+}_{(aq)} + 2e^{-} \\rightarrow \\mathrm{Zn}_{(s)}$ with $E^{\\circ} = -0.76 \\text{ V}$<br><br>The required reaction is the oxidation of zinc:<br><br>$2\\mathrm{Zn}_{(s)} \\rightarrow 2\\mathrm{Zn}^{2+}_{(aq)} + 4e^{-}$<br><br>This reaction is obtained by reversing the given reduction reaction and multiplying it by 2. Reversing a cell reaction changes the sign of its standard potential. Therefore, the standard oxidation potential is:<br><br>$E^{\\circ}_{\\text{ox}} = -E^{\\circ}_{\\text{red}} = -(-0.76 \\text{ V}) = +0.76 \\text{ V}$<br><br>Multiplying the reaction by a stoichiometric coefficient does not change the value of the standard potential because standard electrode potential is an intensive property. It depends only on the nature of the material and the concentration, not on the amount of substance reacting.<br><br>Thus, the standard potential for the given reaction remains $+0.76 \\text{ V}$.<br><br>Answer: $+0.76 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b16bf9280d7f993262d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For the cell,\n${ }^{\\ominus} \\mathrm{Zn}_{(s)}\\left|\\mathrm{Zn}^{+2}(1 \\mathrm{M})\\right|\\left|\\mathrm{Ag}^{+1}(1 \\mathrm{M})\\right| \\mathrm{Ag}_{(s)}^{\\oplus}$\n\nIf concentration of $\\mathrm{Zn}^{+2}$ decreases to 0.1 M at 298 K . then emf of cell", "image": null}, "options": [{"id": "eTF70", "text": "increases by 0.0592 V", "image": null, "isCorrect": false}, {"id": "H4OSv", "text": "decreases by 0.0592 V", "image": null, "isCorrect": false}, {"id": "0vWjI", "text": "increases by 0.0296 V", "image": null, "isCorrect": true}, {"id": "Bt0yj", "text": "decreases by 0.0296 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The cell reaction is:<br><br>$\\mathrm{Zn}_{(s)} + 2\\mathrm{Ag}^{+}_{(aq)} \\rightarrow \\mathrm{Zn}^{2+}_{(aq)} + 2\\mathrm{Ag}_{(s)}$<br><br>The number of electrons transferred is $n = 2$.<br><br>According to the Nernst equation at $298 \\mathrm{K}$:<br><br>$E_{\\mathrm{cell}} = E^{\\circ}_{\\mathrm{cell}} - \\dfrac{0.0592}{2} \\log_{10} \\dfrac{[\\mathrm{Zn}^{2+}]}{[\\mathrm{Ag}^{+}]^2}$<br><br>Initially, $[\\mathrm{Zn}^{2+}] = 1 \\mathrm{M}$ and $[\\mathrm{Ag}^{+}] = 1 \\mathrm{M}$.<br><br>$E_1 = E^{\\circ}_{\\mathrm{cell}} - \\dfrac{0.0592}{2} \\log_{10} (1) = E^{\\circ}_{\\mathrm{cell}}$<br><br>When $[\\mathrm{Zn}^{2+}]$ decreases to $0.1 \\mathrm{M}$:<br><br>$E_2 = E^{\\circ}_{\\mathrm{cell}} - \\dfrac{0.0592}{2} \\log_{10} \\left(\\dfrac{0.1}{1^2}\\right)$<br><br>$E_2 = E^{\\circ}_{\\mathrm{cell}} - \\dfrac{0.0592}{2} \\log_{10} (10^{-1})$<br><br>$E_2 = E^{\\circ}_{\\mathrm{cell}} - \\dfrac{0.0592}{2} (-1)$<br><br>$E_2 = E^{\\circ}_{\\mathrm{cell}} + 0.0296 \\mathrm{V}$<br><br>Change in emf $= E_2 - E_1 = 0.0296 \\mathrm{V}$<br><br>Therefore, the emf of the cell increases by $0.0296 \\mathrm{V}$.<br><br>Answer: increases by 0.0296 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b13bf9280d7f9932616", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the number of faraday required to form $1 \\mathrm{~mol~} \\mathrm{H}_2$ by reduction of $\\mathrm{H}^{+}$ions?", "image": null}, "options": [{"id": "cW0SZ", "text": "$4$", "image": null, "isCorrect": false}, {"id": "uN5ed", "text": "$2$", "image": null, "isCorrect": true}, {"id": "LpJfe", "text": "$0.5$", "image": null, "isCorrect": false}, {"id": "kxqYg", "text": "$1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reduction reaction of $\\text{H}^{+}$ ions to form hydrogen gas is given by:<br><br>$2\\text{H}^{+} + 2\\text{e}^{-} \\rightarrow \\text{H}_2$<br><br>From the stoichiometry of the reaction, $1$ mole of $\\text{H}_2$ gas is produced by the consumption of $2$ moles of electrons.<br><br>Since the charge of $1$ mole of electrons is equal to $1$ Faraday ($1\\text{ F}$), the charge required to produce $1$ mole of $\\text{H}_2$ is $2$ Faradays.<br><br>Answer: $2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b12bf9280d7f993260b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For a Galvanic cell consisting zinc electrode and standard hydrogen electrode, $\\mathrm{E}^{\\circ}\\left(\\mathrm{Zn}_{(\\mathrm{aq})}^{+2} \\mid \\mathrm{Zn}_{(\\mathrm{s})}\\right)=-0.76 \\mathrm{~V}$. Identify the reaction that takes place at positive electrode during working of cell?", "image": null}, "options": [{"id": "KTXWZ", "text": "$\\mathrm{Zn}_{(\\mathrm{s})} \\longrightarrow \\mathrm{Zn}^{+2}{ }_{(\\mathrm{aq})}+2 \\mathrm{e}^{-}$", "image": null, "isCorrect": false}, {"id": "kJiRD", "text": "$\\mathrm{Zn}^{+2}{ }_{(\\mathrm{aq})}+2 \\mathrm{e}^{-} \\longrightarrow \\mathrm{Zn}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}, {"id": "UQIEB", "text": "$\\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{H}_{(\\mathrm{g})}^{+}+2 \\mathrm{e}^{-}$", "image": null, "isCorrect": false}, {"id": "Kr5AZ", "text": "$2 \\mathrm{H}^{+}{ }_{(\\mathrm{aq})}+2 \\mathrm{e}^{-} \\longrightarrow \\mathrm{H}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The standard reduction potential of the zinc electrode is $E^{\\circ}_{\\mathrm{Zn}^{2+}/\\mathrm{Zn}} = -0.76 \\mathrm{~V}$ and that of the standard hydrogen electrode (SHE) is $E^{\\circ}_{\\mathrm{H}^{+}/\\mathrm{H}_2} = 0.00 \\mathrm{~V}$.<br><br>In a Galvanic cell, the electrode with the higher standard reduction potential acts as the cathode (positive electrode) and undergoes reduction. The electrode with the lower standard reduction potential acts as the anode (negative electrode) and undergoes oxidation.<br><br>Since $0.00 \\mathrm{~V} > -0.76 \\mathrm{~V}$, the standard hydrogen electrode acts as the cathode (positive electrode) and the zinc electrode acts as the anode (negative electrode).<br><br>At the positive electrode (cathode), reduction of hydrogen ions takes place:<br><br>$2\\mathrm{H}^{+}_{(\\mathrm{aq})} + 2\\mathrm{e}^{-} \\longrightarrow \\mathrm{H}_{2(\\mathrm{g})}$<br><br>Answer: $2 \\mathrm{H}^{+}{ }_{(\\mathrm{aq})}+2 \\mathrm{e}^{-} \\longrightarrow \\mathrm{H}_{2(\\mathrm{~g})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b03bf9280d7f993259a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "How long should aqueous NaCl be electrolysed by passing 100 ampere current, so that 0.5 mol chlorine is released at anode?", "image": null}, "options": [{"id": "Hf939", "text": "96500 seconds", "image": null, "isCorrect": false}, {"id": "1bLbX", "text": "9650 seconds", "image": null, "isCorrect": false}, {"id": "K2iux", "text": "965 seconds", "image": null, "isCorrect": true}, {"id": "Qbt3A", "text": "96.5 seconds", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The oxidation reaction at the anode is:<br><br>$2Cl^{-} \\rightarrow Cl_2 + 2e^{-}$<br><br>From the stoichiometry of the reaction, 1 mole of $Cl_2$ gas is produced by the passage of 2 moles of electrons.<br><br>Therefore, 0.5 mole of $Cl_2$ gas requires $0.5 \\times 2 = 1$ mole of electrons.<br><br>Charge required, $Q = 1 \\text{ F} = 96500 \\text{ C}$<br><br>Using the formula $Q = I \\times t$:<br><br>$96500 = 100 \\times t$<br><br>$t = \\dfrac{96500}{100} = 965 \\text{ seconds}$<br><br>Answer: 965 seconds", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871affbf9280d7f9932578", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For the cell reaction,\n$\\mathrm{Zn}_{(\\mathrm{s})}+2 \\mathrm{Ag}_{(\\mathrm{aq})}^{+} \\longrightarrow \\mathrm{Zn}_{(\\mathrm{aq})}^{+2}+2 \\mathrm{Ag}_{(\\mathrm{s})}$\nCell potential is less than $\\mathrm{E}^{\\circ}$ cell by 0.0592 V at 298 K when", "image": null}, "options": [{"id": "fv3PI", "text": "$\\left[\\mathrm{Zn}^{+2}\\right]=1 \\mathrm{M}$ and $\\left[\\mathrm{Ag}^{+}\\right]=0.1 \\mathrm{M}$", "image": null, "isCorrect": true}, {"id": "aMs4C", "text": "$\\left[\\mathrm{Zn}^{+2}\\right]=1 \\mathrm{M}$ and $\\left[\\mathrm{Ag}^{+}\\right]=0.01 \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "NVTg5", "text": "$\\left[\\mathrm{Zn}^{+2}\\right]=0.1 \\mathrm{M}$ and $\\left[\\mathrm{Ag}^{+}\\right]=1 \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "RtKNX", "text": "$\\left[\\mathrm{Zn}^{+2}\\right]=0.01 \\mathrm{M}$ and $\\left[\\mathrm{Ag}^{+}\\right]=1 \\mathrm{M}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given cell reaction is:<br><br>$\\mathrm{Zn}_{(\\mathrm{s})}+2 \\mathrm{Ag}_{(\\mathrm{aq})}^{+} \\longrightarrow \\mathrm{Zn}_{(\\mathrm{aq})}^{+2}+2 \\mathrm{Ag}_{(\\mathrm{s})}$<br><br>The number of electrons transferred in the reaction is $n = 2$.<br><br>According to the Nernst equation at 298 K:<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - \\dfrac{0.0592}{n} \\log_{10} \\dfrac{[\\mathrm{Zn}^{+2}]}{[\\mathrm{Ag}^{+}]^2}$<br><br>It is given that the cell potential is less than $E^{\\circ}_{\\text{cell}}$ by 0.0592 V, which means:<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - 0.0592$<br><br>Substituting this into the Nernst equation:<br><br>$E^{\\circ}_{\\text{cell}} - 0.0592 = E^{\\circ}_{\\text{cell}} - \\dfrac{0.0592}{2} \\log_{10} \\dfrac{[\\mathrm{Zn}^{+2}]}{[\\mathrm{Ag}^{+}]^2}$<br><br>$0.0592 = \\dfrac{0.0592}{2} \\log_{10} \\dfrac{[\\mathrm{Zn}^{+2}]}{[\\mathrm{Ag}^{+}]^2}$<br><br>$\\log_{10} \\dfrac{[\\mathrm{Zn}^{+2}]}{[\\mathrm{Ag}^{+}]^2} = 2$<br><br>$\\dfrac{[\\mathrm{Zn}^{+2}]}{[\\mathrm{Ag}^{+}]^2} = 10^2 = 100$<br><br>Checking the given options, for $[\\mathrm{Zn}^{+2}] = 1 \\mathrm{M}$ and $[\\mathrm{Ag}^{+}] = 0.1 \\mathrm{M}$:<br><br>$\\dfrac{[\\mathrm{Zn}^{+2}]}{[\\mathrm{Ag}^{+}]^2} = \\dfrac{1}{(0.1)^2} = \\dfrac{1}{0.01} = 100$<br><br>This satisfies the required condition.<br><br>Answer: $\\left[\\mathrm{Zn}^{+2}\\right]=1 \\mathrm{M}$ and $\\left[\\mathrm{Ag}^{+}\\right]=0.1 \\mathrm{M}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214490aee93fa0796df74", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Which from following equations represents a correct relationship between standard cell potential and equilibrium constant for cell reaction?", "image": null}, "options": [{"id": "5D086", "text": "$\\mathrm{E}_{\\mathrm{cell}}^{\\circ}=-\\frac{2.303 \\mathrm{RT}}{\\mathrm{nF}}$", "image": null, "isCorrect": false}, {"id": "WQFzl", "text": "$\\mathrm{E}_{\\text {cell }}^{\\circ}=\\frac{0.0592}{\\mathrm{nF}} \\log _{10} \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "xooGr", "text": "$\\mathrm{E}_{\\text {cell }}^{\\circ}=\\frac{0.0592}{\\mathrm{n}} \\log _{10} \\mathrm{~K}$", "image": null, "isCorrect": true}, {"id": "Op7v5", "text": "$\\mathrm{E}_{\\text {cell }}^{\\circ}=\\frac{0.0592}{\\mathrm{n}} \\ln \\mathrm{K}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relationship between standard Gibbs free energy change and standard cell potential is given by:<br><br>$\\Delta G^{\\circ} = -nFE_{\\text{cell}}^{\\circ}$<br><br>The relationship between standard Gibbs free energy change and equilibrium constant is:<br><br>$\\Delta G^{\\circ} = -2.303 RT \\log_{10} K$<br><br>Equating the two expressions for $\\Delta G^{\\circ}$:<br><br>$-nFE_{\\text{cell}}^{\\circ} = -2.303 RT \\log_{10} K$<br><br>$E_{\\text{cell}}^{\\circ} = \\dfrac{2.303 RT}{nF} \\log_{10} K$<br><br>At standard temperature $T = 298 \\text{ K}$, substituting $R = 8.314 \\text{ J K}^{-1} \\text{ mol}^{-1}$ and $F = 96500 \\text{ C mol}^{-1}$:<br><br>$\\dfrac{2.303 \\times 8.314 \\times 298}{96500} \\approx 0.0592 \\text{ V}$<br><br>Therefore, the equation becomes:<br><br>$E_{\\text{cell}}^{\\circ} = \\dfrac{0.0592}{n} \\log_{10} K$<br><br>Answer: $\\mathrm{E}_{\\text {cell }}^{\\circ}=\\frac{0.0592}{\\mathrm{n}} \\log _{10} \\mathrm{~K}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214460aee93fa0796df5d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "What is the number of faraday required to produce $\\cdot 0.18 \\mathrm{~g}$ aluminium at cathode during electrolysis of molten $\\mathrm{AlCl}_3$ ?\r\n(Molar mass of $\\mathrm{Al}=27 \\mathrm{~g} \\mathrm{~mol}^{-1}$ )", "image": null}, "options": [{"id": "b3Rpe", "text": "0.02 F", "image": null, "isCorrect": true}, {"id": "r42fx", "text": "0.03 F", "image": null, "isCorrect": false}, {"id": "mKXWK", "text": "0.25 F", "image": null, "isCorrect": false}, {"id": "6KeSx", "text": "0.30 F", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reduction reaction of aluminium at the cathode is given by:<br><br>$\\mathrm{Al}^{3+} + 3\\mathrm{e}^{-} \\rightarrow \\mathrm{Al}$<br><br>This indicates that $3 \\mathrm{~F}$ of electricity is required to deposit $1 \\mathrm{~mol}$ of $\\mathrm{Al}$ ($27 \\mathrm{~g}$).<br><br>Number of moles of $\\mathrm{Al}$ to be deposited $= \\dfrac{0.18}{27} = \\dfrac{2}{300} \\mathrm{~mol}$<br><br>Number of faradays required $= 3 \\times \\text{moles of } \\mathrm{Al}$<br><br>$= 3 \\times \\dfrac{2}{300} = 0.02 \\mathrm{~F}$<br><br>Answer: 0.02 F", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214350aee93fa0796ded6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Consider the following cell\r\n$\\left.\\mathrm{Zn}_{(\\mathrm{s})} \\mid \\mathrm{Zn}_{(\\mathrm{IM})}^{2+}\\right)\\left|\\mathrm{KCl}_{(\\mathrm{sat})}\\right| \\underset{\\text { (paste) }}{\\mathrm{Hg}_2 \\mathrm{Cl}_2} \\mid \\mathrm{Hg}$\r\n$\\mathrm{E}^{\\circ}$ cell $=1.007 \\mathrm{~V}$ and $\\mathrm{E}^{\\circ}$ calomel $=0.242 \\mathrm{~V}$ What is the standard potential of Zn ?", "image": null}, "options": [{"id": "OOC2L", "text": "$\\quad-0.765 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "PNlUi", "text": "0.765 V", "image": null, "isCorrect": false}, {"id": "yEQhY", "text": "-1.247 V", "image": null, "isCorrect": false}, {"id": "Ciikn", "text": "1.247 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard cell potential is given by the difference between the standard reduction potentials of the cathode and the anode.<br><br>$E^{\\circ}_{\\text{cell}} = E^{\\circ}_{\\text{cathode}} - E^{\\circ}_{\\text{anode}}$<br><br>From the given cell representation, zinc acts as the anode (oxidation half-cell) and the calomel electrode acts as the cathode (reduction half-cell).<br><br>$E^{\\circ}_{\\text{cell}} = E^{\\circ}_{\\text{calomel}} - E^{\\circ}_{\\text{Zn}}$<br><br>Substituting the given values:<br><br>$1.007 = 0.242 - E^{\\circ}_{\\text{Zn}}$<br><br>$E^{\\circ}_{\\text{Zn}} = 0.242 - 1.007$<br><br>$E^{\\circ}_{\\text{Zn}} = -0.765 \\text{ V}$<br><br>Answer: $\\quad-0.765 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214250aee93fa0796de52", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "What is the decreasing order of deposition of metal on electrode if standard reduction potentials are given as -\r\n$\\mathrm{Ag}^{+}\\left|\\mathrm{Ag}=0.80 \\mathrm{~V}, \\mathrm{Cu}^{2+}\\right| \\mathrm{Cu}=0.337 \\mathrm{~V}$\r\n$\\mathrm{Sn}^{2+}\\left|\\mathrm{Sn}=-0.136 \\mathrm{~V}, \\mathrm{Cd}^{2+}\\right| \\mathrm{Cd}=-0.403 \\mathrm{~V}$", "image": null}, "options": [{"id": "Q1kvm", "text": "$\\mathrm{Ag} \\gt \\mathrm{Cu} \\gt \\mathrm{Sn} \\gt \\mathrm{Cd}$", "image": null, "isCorrect": true}, {"id": "crf4e", "text": "$\\mathrm{Cu} \\gt \\mathrm{Sn} \\gt \\mathrm{Cd} \\gt \\mathrm{Ag}$", "image": null, "isCorrect": false}, {"id": "qATlT", "text": "$\\mathrm{Sn} \\gt \\mathrm{Cd} \\gt \\mathrm{Ag} \\gt \\mathrm{Cu}$", "image": null, "isCorrect": false}, {"id": "lDZDy", "text": "$\\mathrm{Cd} \\gt \\mathrm{Sn} \\gt \\mathrm{Cu} \\gt \\mathrm{Ag}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The tendency of a metal ion to undergo reduction and deposit on the electrode is directly proportional to its standard reduction potential ($E^{\\circ}$).<br><br>Higher the standard reduction potential, greater is the tendency of the metal ion to get reduced and deposited.<br><br>The given standard reduction potentials are:<br>$E^{\\circ}_{\\mathrm{Ag}^{+}/\\mathrm{Ag}} = 0.80 \\mathrm{~V}$<br>$E^{\\circ}_{\\mathrm{Cu}^{2+}/\\mathrm{Cu}} = 0.337 \\mathrm{~V}$<br>$E^{\\circ}_{\\mathrm{Sn}^{2+}/\\mathrm{Sn}} = -0.136 \\mathrm{~V}$<br>$E^{\\circ}_{\\mathrm{Cd}^{2+}/\\mathrm{Cd}} = -0.403 \\mathrm{~V}$<br><br>Arranging the standard reduction potentials in decreasing order:<br>$0.80 \\mathrm{~V} \\gt 0.337 \\mathrm{~V} \\gt -0.136 \\mathrm{~V} \\gt -0.403 \\mathrm{~V}$<br><br>Therefore, the decreasing order of deposition of the metals is $\\mathrm{Ag} \\gt \\mathrm{Cu} \\gt \\mathrm{Sn} \\gt \\mathrm{Cd}$.<br><br>Answer: $\\mathrm{Ag} \\gt \\mathrm{Cu} \\gt \\mathrm{Sn} \\gt \\mathrm{Cd}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140f0aee93fa0796dda6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Calculate the mass of ' Ca ' deposited at cathode by passing 0.8 ampere current through molten $\\mathrm{CaCl}_2$ in 60 minutes.\r\n[Molar mass of $\\mathrm{Ca}=40 \\mathrm{~g} \\mathrm{~mol}^{-1}$ ]", "image": null}, "options": [{"id": "BN6Ab", "text": "0.4 g", "image": null, "isCorrect": false}, {"id": "Hnw84", "text": "0.5 g", "image": null, "isCorrect": false}, {"id": "LmiQQ", "text": "0.6 g", "image": null, "isCorrect": true}, {"id": "rNnwu", "text": "0.7 g", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction at the cathode is:<br><br>$\\mathrm{Ca}^{2+} + 2\\mathrm{e}^{-} \\rightarrow \\mathrm{Ca}$<br><br>The number of moles of electrons required to deposit one mole of Ca is $n = 2$.<br><br>The given parameters are $I = 0.8 \\mathrm{~A}$, $t = 60 \\mathrm{~min} = 3600 \\mathrm{~s}$, and $M = 40 \\mathrm{~g~mol}^{-1}$.<br><br>Using Faraday's first law of electrolysis, the mass of Ca deposited is:<br><br>$W = \\dfrac{I \\times t \\times M}{n \\times F}$<br><br>Substituting the values:<br><br>$W = \\dfrac{0.8 \\times 3600 \\times 40}{2 \\times 96500}$<br><br>$W = \\dfrac{115200}{193000}$<br><br>$W = 0.5968 \\mathrm{~g} \\approx 0.6 \\mathrm{~g}$<br><br>Answer: 0.6 g", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140e0aee93fa0796dd9c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "The $\\mathrm{E}_{\\text {cell }}^{\\circ}$ of $\\mathrm{Cu}_{(\\mathrm{s})}\\left|\\mathrm{Cu}_{(\\mathrm{IM})}^{++}\\right|\\left|\\mathrm{Ag}_{(\\mathrm{IM})}^{+}\\right| \\mathrm{Ag}_{(\\mathrm{s})}$ is 0.647 volt. Calculate the $\\mathrm{E}_{\\mathrm{Ag}}^{\\circ}$ if $\\mathrm{E}_{\\mathrm{Cu}_{\\mathrm{u}}^{\\circ}}$ is 0.153 V .", "image": null}, "options": [{"id": "cjO0n", "text": "0.8 V", "image": null, "isCorrect": true}, {"id": "Qd820", "text": "0.5 V", "image": null, "isCorrect": false}, {"id": "IWMd0", "text": "-0.8 V", "image": null, "isCorrect": false}, {"id": "x0r3B", "text": "-0.5 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the given cell representation, copper ($\\mathrm{Cu}$) undergoes oxidation and acts as the anode, while silver ($\\mathrm{Ag}$) undergoes reduction and acts as the cathode.<br><br>The standard cell potential is given by:<br><br>$\\mathrm{E}_{\\text{cell}}^{\\circ} = \\mathrm{E}_{\\text{cathode}}^{\\circ} - \\mathrm{E}_{\\text{anode}}^{\\circ}$<br><br>Substituting the given values:<br><br>$0.647 = \\mathrm{E}_{\\mathrm{Ag}}^{\\circ} - \\mathrm{E}_{\\mathrm{Cu}}^{\\circ}$<br><br>$0.647 = \\mathrm{E}_{\\mathrm{Ag}}^{\\circ} - 0.153$<br><br>$\\mathrm{E}_{\\mathrm{Ag}}^{\\circ} = 0.647 + 0.153$<br><br>$\\mathrm{E}_{\\mathrm{Ag}}^{\\circ} = 0.8 \\text{ V}$<br><br>Answer: 0.8 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140c0aee93fa0796dd93", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Find the number of electrons that generate 1 coulomb charge ?", "image": null}, "options": [{"id": "c7Q6z", "text": "$\\quad 6.24 \\times 10^{18}$", "image": null, "isCorrect": true}, {"id": "jW1w6", "text": "$1.25 \\times 10^{18}$", "image": null, "isCorrect": false}, {"id": "ipMwu", "text": "$6.22 \\times 10^{23}$", "image": null, "isCorrect": false}, {"id": "UX45l", "text": "$3.12 \\times 10^{18}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The charge of a single electron is $e = 1.602 \\times 10^{-19}$ C.<br><br>Let $n$ be the number of electrons required to generate a total charge $q = 1$ C.<br><br>Using the quantization of charge, $q = ne$<br><br>$n = \\dfrac{q}{e}$<br><br>$n = \\dfrac{1}{1.602 \\times 10^{-19}}$<br><br>$n = 6.24 \\times 10^{18}$<br><br>Answer: $\\quad 6.24 \\times 10^{18}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e80aee93fa0796dc77", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "When fused NaCl undergoes electrolysis the product formed at cathode is", "image": null}, "options": [{"id": "lxnJ9", "text": "$\\mathrm{Cl}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "Uzold", "text": "$\\mathrm{Na}_{(\\mathrm{s})}$", "image": null, "isCorrect": true}, {"id": "PYgWJ", "text": "$\\mathrm{Na}-\\mathrm{Hg}_{(1)}$", "image": null, "isCorrect": false}, {"id": "qxQzO", "text": "$\\mathrm{H}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the electrolysis of fused (molten) $\\mathrm{NaCl}$, the only ions present are $\\mathrm{Na}^{+}$ and $\\mathrm{Cl}^{-}$.<br><br>At the cathode (negative electrode), reduction of sodium ions takes place:<br>$\\mathrm{Na}^{+} + \\mathrm{e}^{-} \\rightarrow \\mathrm{Na}_{(\\mathrm{s})}$<br><br>At the anode (positive electrode), oxidation of chloride ions takes place:<br>$2\\mathrm{Cl}^{-} \\rightarrow \\mathrm{Cl}_{2(\\mathrm{g})} + 2\\mathrm{e}^{-}$<br><br>Therefore, sodium metal $\\mathrm{Na}_{(\\mathrm{s})}$ is formed at the cathode.<br><br>Answer: $\\mathrm{Na}_{(\\mathrm{s})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d80aee93fa0796dbf7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Calculate the $\\text{E}^\\circ_{\\text{cell}}$ of $\\text{Al} \\vert{} \\text{Al}_2(\\text{SO}_4)_{3(1\\text{M})} \\vert{}\\vert{} \\text{HCl}_{(1\\text{M})} \\vert{} \\text{H}_{2(\\text{g})(1\\text{atm})}, \\text{Pt}$ (Given $\\text{E}^\\circ_{\\text{Al}^{3+}\\vert{}\\text{Al}}$ $= -1.66 \\text{ V}$ )", "image": null}, "options": [{"id": "HW5KQ", "text": "1.66 V", "image": null, "isCorrect": true}, {"id": "0uRbk", "text": "-1.66 V", "image": null, "isCorrect": false}, {"id": "THxny", "text": "0.0533 V", "image": null, "isCorrect": false}, {"id": "fmhQp", "text": "1.14 V", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given cell representation is $\\text{Al} \\vert{} \\text{Al}^{3+} \\vert{}\\vert{} \\text{H}^+ \\vert{} \\text{H}_2, \\text{Pt}$.<br><br>The anode is the aluminum electrode and the cathode is the Standard Hydrogen Electrode (SHE).<br><br>The standard reduction potential of the cathode is $\\text{E}^\\circ_{\\text{H}^+\\vert{}\\text{H}_2} = 0.00 \\text{ V}$.<br><br>The standard reduction potential of the anode is $\\text{E}^\\circ_{\\text{Al}^{3+}\\vert{}\\text{Al}} = -1.66 \\text{ V}$.<br><br>The standard cell potential is given by:<br><br>$\\text{E}^\\circ_{\\text{cell}} = \\text{E}^\\circ_{\\text{cathode}} - \\text{E}^\\circ_{\\text{anode}}$<br><br>$\\text{E}^\\circ_{\\text{cell}} = 0.00 \\text{ V} - (-1.66 \\text{ V})$<br><br>$\\text{E}^\\circ_{\\text{cell}} = 1.66 \\text{ V}$<br><br>Answer: 1.66 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d70aee93fa0796dbf3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Which of the following is released at cathode during electrolysis of aqueous sodium chloride?", "image": null}, "options": [{"id": "5QDaX", "text": "$\\mathrm{Cl}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "DuivX", "text": "$\\mathrm{Na}_{(\\mathrm{s})}$", "image": null, "isCorrect": false}, {"id": "hGOqM", "text": "$\\mathrm{O}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "4lzgw", "text": "$\\mathrm{H}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "During the electrolysis of aqueous sodium chloride, the ions present in the solution are $\\mathrm{Na}^+$, $\\mathrm{Cl}^-$, $\\mathrm{H}^+$, and $\\mathrm{OH}^-$.<br><br>At the cathode, reduction takes place. The two possible reduction reactions are:<br>$\\mathrm{Na}^+_{(aq)} + e^- \\rightarrow \\mathrm{Na}_{(s)}$ ($E^\\circ = -2.71$ V)<br>$2\\mathrm{H}_2\\mathrm{O}_{(l)} + 2e^- \\rightarrow \\mathrm{H}_{2(g)} + 2\\mathrm{OH}^-_{(aq)}$ ($E^\\circ = -0.83$ V)<br><br>Since the standard reduction potential of water is higher than that of sodium ions, water is preferentially reduced at the cathode. Thus, hydrogen gas ($\\mathrm{H}_{2(g)}$) is released at the cathode.<br><br>At the anode, oxidation of chloride ions takes place due to the overpotential of oxygen, releasing chlorine gas ($\\mathrm{Cl}_{2(g)}$).<br><br>Answer: $\\mathrm{H}_{2(\\mathrm{~g})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b10aee93fa0796dacb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "What is the quantity of electricity required to produce 4.8 g of Mg (molar mass $=24 \\mathrm{~g} \\mathrm{~mol}^{-1}$ ) from its salt solution?", "image": null}, "options": [{"id": "V4Nzl", "text": "10 F", "image": null, "isCorrect": false}, {"id": "z7RtS", "text": "4 F", "image": null, "isCorrect": false}, {"id": "wuI4K", "text": "1 F", "image": null, "isCorrect": false}, {"id": "Lz4z2", "text": "0.4 F", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Moles of Mg produced = $\\dfrac{4.8}{24} = 0.2$ mol<br><br>The reduction reaction for magnesium is:<br><br>$Mg^{2+} + 2e^{-} \\rightarrow Mg$<br><br>From the stoichiometry, 1 mole of Mg requires 2 moles of electrons, which corresponds to 2 F of electricity.<br><br>Quantity of electricity required for 0.2 mol of Mg = $0.2 \\times 2$ F = 0.4 F<br><br>Answer: 0.4 F", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213890aee93fa0796d98e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "If $\\mathrm{E}^{\\circ}$ cell for $\\mathrm{Cd}_{(\\mathrm{s})}\\left|\\mathrm{Cd}_{(\\mathrm{IM})}^{2+} \\square \\mathrm{Ag}_{(\\mathrm{IM})}^{+}\\right| \\mathrm{Ag}_{(\\mathrm{s})}$ is 1.2 V . What is the emf of the cell at $25^{\\circ} \\mathrm{C}$ ?", "image": null}, "options": [{"id": "dEIGq", "text": "$\\quad-1.2 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "IUGJa", "text": "2.4 V", "image": null, "isCorrect": false}, {"id": "BDfiQ", "text": "-2.4 V", "image": null, "isCorrect": false}, {"id": "cfj5W", "text": "1.2 V", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The cell reaction is $\\text{Cd}_{(s)} + 2\\text{Ag}^{+}_{(aq)} \\rightarrow \\text{Cd}^{2+}_{(aq)} + 2\\text{Ag}_{(s)}$.<br><br>The Nernst equation for the cell at $25^{\\circ}\\text{C}$ is given by:<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - \\dfrac{0.0591}{n} \\log \\dfrac{[\\text{Cd}^{2+}]}{[\\text{Ag}^{+}]^2}$<br><br>Given that $[\\text{Cd}^{2+}] = 1\\text{ M}$ and $[\\text{Ag}^{+}] = 1\\text{ M}$, and $E^{\\circ}_{\\text{cell}} = 1.2\\text{ V}$.<br><br>Substituting the values into the Nernst equation:<br><br>$E_{\\text{cell}} = 1.2 - \\dfrac{0.0591}{2} \\log \\dfrac{1}{1^2}$<br><br>$E_{\\text{cell}} = 1.2 - \\dfrac{0.0591}{2} \\log (1)$<br><br>Since $\\log(1) = 0$:<br><br>$E_{\\text{cell}} = 1.2 - 0 = 1.2\\text{ V}$<br><br>Answer: 1.2 V", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213790aee93fa0796d90b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Calculate the amount of electricity required in coulombs to convert 0.08 mol of $\\mathrm{MnO}_4^{-}$to $\\mathrm{Mn}^{2+}$.", "image": null}, "options": [{"id": "i5htn", "text": "96500 C", "image": null, "isCorrect": false}, {"id": "66Rbl", "text": "38600 C", "image": null, "isCorrect": true}, {"id": "ohlcU", "text": "48250 C", "image": null, "isCorrect": false}, {"id": "Xar5u", "text": "19300 C", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The balanced half-reaction for the reduction of $\\mathrm{MnO}_4^{-}$ to $\\mathrm{Mn}^{2+}$ is:<br><br>$\\mathrm{MnO}_4^{-} + 8\\mathrm{H}^{+} + 5\\mathrm{e}^{-} \\rightarrow \\mathrm{Mn}^{2+} + 4\\mathrm{H}_2\\mathrm{O}$<br><br>The oxidation state of $\\mathrm{Mn}$ changes from $+7$ to $+2$, which involves a transfer of $5$ electrons.<br><br>Number of moles of electrons required for $1$ mole of $\\mathrm{MnO}_4^{-}$ is $5$ moles.<br><br>For $0.08$ moles of $\\mathrm{MnO}_4^{-}$, the number of moles of electrons required is $0.08 \\times 5 = 0.4$ moles.<br><br>Since $1$ mole of electrons carries a charge of $1$ Faraday ($96500$ C), the total charge required is:<br><br>$Q = 0.4 \\times 96500$ C<br><br>$Q = 38600$ C<br><br>Answer: 38600 C", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133f0aee93fa0796d747", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Calculate the quantity of electricity required to liberate 0.1 mole of chlorine gas during electrolysis of molten sodium chloride.", "image": null}, "options": [{"id": "dwewz", "text": "9665 C", "image": null, "isCorrect": false}, {"id": "8pGV9", "text": "19300 C", "image": null, "isCorrect": true}, {"id": "FRTEn", "text": "14500 C", "image": null, "isCorrect": false}, {"id": "4FZs9", "text": "96500 C", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction at the anode during the electrolysis of molten sodium chloride is:<br><br>$2Cl^{-} \\rightarrow Cl_{2} + 2e^{-}$<br><br>From the stoichiometry of the reaction, $1$ mole of $Cl_{2}$ gas is liberated by $2$ moles of electrons.<br><br>Therefore, $0.1$ mole of $Cl_{2}$ gas will require $0.1 \\times 2 = 0.2$ moles of electrons.<br><br>The quantity of electricity required for $1$ mole of electrons is $1$ Faraday ($1$ F $= 96500$ C).<br><br>Quantity of electricity required $= 0.2 \\times 96500$ C $= 19300$ C.<br><br>Answer: 19300 C", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213280aee93fa0796d696", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Which from following is NOT true about electrolysis of molten NaCl ?", "image": null}, "options": [{"id": "GDXAc", "text": "$\\mathrm{Cl}_2$ gas is liberated at anode.", "image": null, "isCorrect": false}, {"id": "yOgzc", "text": "Na is deposited at cathode.", "image": null, "isCorrect": false}, {"id": "CteGD", "text": "The decomposition of NaCl into $\\mathrm{Na}_{(\\mathrm{s})}$ and $\\mathrm{Cl}_{2(\\mathrm{~g})}$ is spontaneous.", "image": null, "isCorrect": true}, {"id": "Oettm", "text": "Electrical energy is used to carry out the reaction.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Electrolysis of molten NaCl is a non-spontaneous process that requires the input of electrical energy to drive the chemical reaction.<br><br>At the cathode (reduction): $\\mathrm{Na}^{+} + \\mathrm{e}^{-} \\rightarrow \\mathrm{Na}_{(l)}$<br><br>At the anode (oxidation): $2\\mathrm{Cl}^{-} \\rightarrow \\mathrm{Cl}_{2(g)} + 2\\mathrm{e}^{-}$<br><br>Thus, $\\mathrm{Cl}_2$ gas is liberated at the anode and sodium metal is deposited at the cathode. Since electrical energy is used to carry out the reaction, the decomposition of NaCl into Na and $\\mathrm{Cl}_2$ is non-spontaneous.<br><br>Therefore, the statement that the decomposition is spontaneous is incorrect.<br><br>Answer: The decomposition of NaCl into $\\mathrm{Na}_{(\\mathrm{s})}$ and $\\mathrm{Cl}_{2(\\mathrm{~g})}$ is spontaneous.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213260aee93fa0796d688", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Which from following expressions is used to calculate $\\mathrm{E}_{\\text {cell }}$ for the following cell at $25^{\\circ} \\mathrm{C}$ ?\r\n$\\mathrm{Pb}_{(\\mathrm{s})}\\left|\\mathrm{Pb}_{(\\mathrm{IM})}^{++}\\right|\\left|\\mathrm{Ag}_{(10 \\mathrm{M})}^{+}\\right| \\mathrm{Ag}_{(\\mathrm{s})}$", "image": null}, "options": [{"id": "qNBBq", "text": "$\\cdot \\mathrm{E}_{\\text {cell }}=\\left(\\mathrm{E}_{\\text {cell }}^{\\circ}+0.0592\\right) \\mathrm{V}$", "image": null, "isCorrect": true}, {"id": "Uc2IU", "text": "$\\mathrm{E}_{\\text {cell }}=\\left(\\mathrm{E}_{\\text {cell }}^{\\circ}-0.0592\\right) \\mathrm{V}$", "image": null, "isCorrect": false}, {"id": "jBu5v", "text": "$E_{\\text {cell }}=\\left(E_{\\text {cell }}^{\\circ}-0.0296\\right) V$", "image": null, "isCorrect": false}, {"id": "ZFUJb", "text": "$\\mathrm{E}_{\\mathrm{cell}}=\\left(\\mathrm{E}_{\\mathrm{cell}}^{\\circ}+0.0296\\right) \\mathrm{V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The cell reaction for the given cell is:<br><br>$\\mathrm{Pb}_{(\\mathrm{s})} + 2\\mathrm{Ag}^{+}_{(\\mathrm{aq})} \\rightarrow \\mathrm{Pb}^{2+}_{(\\mathrm{aq})} + 2\\mathrm{Ag}_{(\\mathrm{s})}$<br><br>The number of electrons exchanged in the reaction is $n = 2$.<br><br>Using the Nernst equation at $25^{\\circ}\\mathrm{C}$:<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - \\dfrac{0.0592}{n} \\log_{10} \\dfrac{[\\mathrm{Pb}^{2+}]}{[\\mathrm{Ag}^{+}]^2}$<br><br>Substituting the given concentrations $[\\mathrm{Pb}^{2+}] = 1\\mathrm{M}$ and $[\\mathrm{Ag}^{+}] = 10\\mathrm{M}$:<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - \\dfrac{0.0592}{2} \\log_{10} \\dfrac{1}{(10)^2}$<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - 0.0296 \\log_{10} (10^{-2})$<br><br>$E_{\\text{cell}} = E^{\\circ}_{\\text{cell}} - 0.0296 \\times (-2)$<br><br>$E_{\\text{cell}} = (E^{\\circ}_{\\text{cell}} + 0.0592) \\mathrm{V}$<br><br>Answer: $\\cdot \\mathrm{E}_{\\text {cell }}=\\left(\\mathrm{E}_{\\text {cell }}^{\\circ}+0.0592\\right) \\mathrm{V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262810279619d9d8a350f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "$\\begin{aligned} & \\text { Calculate } \\mathrm{E}_{\\text {cell }}^{\\circ} \\text { for } \\mathrm{Cd}_{(\\mathrm{s})}\\left|\\mathrm{Cd}_{(\\mathrm{IM})}^{++}\\right|\\left|\\mathrm{Ag}_{(\\mathrm{MM})}^{+}\\right| \\mathrm{Ag}_{(\\mathrm{s})} . \\\\ & {\\left[\\mathrm{E}_{\\mathrm{Cd}}^{\\circ}=-0.403 \\mathrm{~V} ; \\mathrm{E}_{\\mathrm{Ag}}^{\\circ}=0.799 \\mathrm{~V}\\right]}\\end{aligned}$", "image": null}, "options": [{"id": "BoWJr", "text": "$1.202 V$", "image": null, "isCorrect": true}, {"id": "iMKHb", "text": "$-1.202 V$", "image": null, "isCorrect": false}, {"id": "MRCbW", "text": "$0.396 V$", "image": null, "isCorrect": false}, {"id": "ceaTA", "text": "$-0.396 V$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the given cell, anode is $\\mathrm{Cd}$ and cathode is Ag.\n$\\begin{aligned}\n\\mathrm{E}_{\\text {cell }}^{\\circ} & =\\mathrm{E}_{\\text {cathode }}^{\\circ}-\\mathrm{E}_{\\text {anode }}^{\\circ} \\\\\n& =0.799-(-0.403) \\\\\n& =1.202 \\mathrm{~V}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262800279619d9d8a3508", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Which among the following species is reduced by tin easily?", "image": null}, "options": [{"id": "j7sdk", "text": "Iodine", "image": null, "isCorrect": true}, {"id": "nyRF6", "text": "Iron", "image": null, "isCorrect": false}, {"id": "HsNdb", "text": "Zinc", "image": null, "isCorrect": false}, {"id": "LvbQU", "text": "Sodium", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Among the given species, only iodine has positive $\\mathrm{E}^{\\circ}$ value. Higher (more positive) $\\mathrm{E}^{\\circ}$ value for a half reaction indicates its greater tendency to get reduced.\nTherefore, iodine is reduced by tin easily.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626b0279619d9d8a345d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Which from following expressions is used to find the cell potential of $\\mathrm{Cd}_{\\text {(s) }}\\left|\\mathrm{Cd}_{\\text {(aq) }}^{++}\\right|\\left|\\mathrm{Cu}_{\\text {(aq) }}^{++}\\right| \\mathrm{Cu}_{\\text {(s) }}$ cell at $25^{\\circ} \\mathrm{C}$ ?", "image": null}, "options": [{"id": "Pg03Z", "text": "$\\mathrm{E}_{\\text {cell }}=\\mathrm{E}_{\\text {cell }}^{\\mathrm{o}}-0.0296 \\log \\frac{\\left[\\mathrm{Cd}^{++}\\right]}{\\left[\\mathrm{Cu}^{++}\\right]}$", "image": null, "isCorrect": true}, {"id": "ssWsx", "text": "$\\mathrm{E}_{\\text {cell }}=\\mathrm{E}_{\\text {cell }}^{\\mathrm{o}}+0.0296 \\log \\frac{\\left[\\mathrm{Cd}^{++}\\right]}{\\left[\\mathrm{Cu}^{++}\\right]}$", "image": null, "isCorrect": false}, {"id": "Kmyqx", "text": "$\\mathrm{E}_{\\mathrm{cell}}=\\mathrm{E}_{\\text {cell }}^{\\mathrm{o}}-0.0592 \\log \\frac{\\left[\\mathrm{Cu}^{++}\\right]}{\\left[\\mathrm{Cd}^{++}\\right]}$", "image": null, "isCorrect": false}, {"id": "yiJzb", "text": "$\\mathrm{E}_{\\text {cell }}=\\mathrm{E}_{\\text {cell }}^{\\mathrm{o}}+0.0592 \\log \\frac{\\left[\\mathrm{Cu}^{++}\\right]}{\\left[\\mathrm{Cd}^{++}\\right]}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Cell reaction:\n$$\n\\begin{aligned}\n& \\mathrm{Cd}_{(\\mathrm{s})} \\longrightarrow \\mathrm{Cd}_{(\\mathrm{aq})}^{2+}+2 \\mathrm{e}^{-} \\quad \\text { (oxidation at anode) } \\\\\n& \\mathrm{Cu}_{(\\mathrm{aq})}^{2+}+2 \\mathrm{e}^{-} \\longrightarrow \\mathrm{Cu}_{(\\mathrm{s})} \\quad \\text { (reduction at cathode) } \\\\\n& \\hline \\mathrm{Cd}_{(\\mathrm{s})}+\\mathrm{Cu}_{(\\mathrm{aq})}^{2+} \\longrightarrow \\mathrm{Cd}_{(\\mathrm{aq})}^{2+}+2 \\mathrm{Cu}_{(\\mathrm{s})} \\\\\n& \\text { (overall reaction) }\n\\end{aligned}\n$$\nNow,\n$$\n\\begin{aligned}\n\\mathrm{E}_{\\text {cell }} & =\\mathrm{E}_{\\text {cell }}^{\\mathrm{o}}-\\frac{0.0592 \\mathrm{~V}}{\\mathrm{n}} \\log _{10} \\frac{[\\text { Product }]}{[\\text { Reactant }]} \\\\\n& =0.02-\\frac{0.0592 \\mathrm{~V}}{2} \\log _{10} \\frac{\\left[\\mathrm{Cd}^{++}\\right]}{\\left[\\mathrm{Cu}^{++}\\right]} \\\\\n& =\\mathrm{E}_{\\text {cell }}^{\\prime}-0.0296 \\log \\frac{\\left[\\mathrm{Cd}^{++}\\right]}{\\left[\\mathrm{Cu}^{++}\\right]}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625a0279619d9d8a33d8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Calculate $\\mathrm{E}_{\\text {cell }}^{\\circ}$ for the following.\n$\\mathrm{Zn}_{(\\mathrm{s})}\\left|\\mathrm{Zn}_{(1 \\mathrm{M})}^{++}\\right|\\left|\\mathrm{Pb}_{(1 \\mathrm{M})}^{++}\\right| \\mathrm{Pb}_{(\\mathrm{s})}$ if $\\mathrm{E}_{\\mathrm{Zn}^{\\circ}}^{\\circ}=-0.763 \\mathrm{~V}$ and\n$\\mathrm{E}_{\\mathrm{Pb}}^{\\mathrm{o}}=-0.126 \\mathrm{~V}$", "image": null}, "options": [{"id": "QPrCy", "text": "$0.637 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "IdH6c", "text": "$-0.530 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "8SAUZ", "text": "$-0.889 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "UQuvV", "text": "$0.789 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the given cell, $\\mathrm{Zn}$ acts as anode and $\\mathrm{Pb}$ acts as cathode.\n$\\mathrm{E}_{\\text {cell }}^0=\\mathrm{E}_{\\text {cathode }}^0-\\mathrm{E}_{\\text {anode }}^0$\n$=\\mathrm{E}_{\\mathrm{Pb}}^0-\\mathrm{E}_{\\mathrm{Zn}}^0=-0.126 \\mathrm{~V}-(-0.763) \\mathrm{V}$\n$=0.637 \\mathrm{~V}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2624a0279619d9d8a3358", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Calculate the time required in second to deposit $6.35 \\mathrm{~g}$ copper from its salt solution by passing 5 ampere current.\n[Molar mass of $\\mathrm{Cu}=63.5 \\mathrm{~g} \\mathrm{~mol}^{-1}$ ]", "image": null}, "options": [{"id": "vV69E", "text": "3600", "image": null, "isCorrect": false}, {"id": "iSAcj", "text": "3700", "image": null, "isCorrect": false}, {"id": "CrIB7", "text": "3860", "image": null, "isCorrect": true}, {"id": "fkJbR", "text": "4000", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{Cu}_{(\\mathrm{s})}^{2+}+2 \\mathrm{e}^{-} \\longrightarrow \\mathrm{Cu}_{(\\mathrm{s})} \\\\ & \\text { Mole ratio }=\\frac{1 \\mathrm{~mol}}{2 \\mathrm{~mole}^{-}} \\\\ & \\mathrm{W}=\\frac{\\mathrm{I}(\\mathrm{A}) \\times \\mathrm{t}(\\mathrm{s})}{96500\\left(\\mathrm{C} / \\mathrm{mol} \\mathrm{e}^{-}\\right)} \\times \\text {mole ratio } \\times \\text { molar mass } \\\\ & 6.35 \\mathrm{~g}=\\frac{5 \\times \\mathrm{t}}{96500\\left(\\mathrm{C} / \\mathrm{mol} \\mathrm{e}^{-}\\right)} \\times \\frac{1 \\mathrm{~mol}}{2 \\mathrm{~mol} \\mathrm{e}} \\times 63.5 \\mathrm{~g} \\mathrm{~mol}^{-1} \\\\ & \\mathrm{t}=\\frac{6.35 \\times 96500 \\times 2}{5 \\times 63.5}=3860 \\text { seconds }\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262470279619d9d8a333b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Calculate $\\mathrm{E}_{\\text {cell }}^{\\circ}$ if the equilibrium constant for following reaction is $1.2 \\times 10^6$.\n$$\n2 \\mathrm{Cu}_{(\\mathrm{aq})}^{+} \\longrightarrow \\mathrm{Cu}_{(\\mathrm{aq})}^{++}+\\mathrm{Cu}_{(\\mathrm{s})}\n$$", "image": null}, "options": [{"id": "rdxiX", "text": "$0.36 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "gKFNJ", "text": "$-0.36 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "aMugC", "text": "$-0.18 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "zod8j", "text": "$0.18 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{E}_{\\text {cell }}^0=\\frac{0.0592}{\\mathrm{n}} \\log _{10} \\mathrm{~K} \\text { at } 298 \\mathrm{~K} \\\\ & \\mathrm{Cu}_{(\\mathrm{mq})}^{+}+\\mathrm{e}^{-} \\longrightarrow \\mathrm{Cu}_{(\\mathrm{s})} \\\\ & \\frac{\\mathrm{Cu}_{\\text {(aq) }}^{+} \\longrightarrow \\mathrm{Cu}_{\\text {(aq) }}^{2+}+\\mathrm{e}^{-}}{2 \\mathrm{Cu}_{\\text {(aq) }}^{+} \\longrightarrow \\mathrm{Cu}_{(\\text {aq) }}^{2+}+\\mathrm{Cu}_{(\\mathrm{s})}} \\\\ & \\therefore \\quad \\mathrm{n}=1 \\\\ & \\therefore \\quad \\mathrm{E}_{\\text {eell }}^0=\\frac{0.0592}{1} \\log _{10}\\left(1.2 \\times 10^6\\right) \\\\ & =0.0592\\left(\\log 1.2+\\log 10^6\\right) \\\\ & =0.0592(0.079+6) \\\\ & =0.0592 \\times 6.079 \\\\ & =0.36 \\mathrm{~V} \\\\ & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262330279619d9d8a329e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Calculate the $\\mathrm{E}_{\\text {cell }}$ for $\\mathrm{Zn}_{(\\mathrm{s})}\\left|\\mathrm{Zn}_{(0.1 \\mathrm{M})}^{++}\\right|\\left|\\mathrm{Cr}_{(0.1 \\mathrm{M})}^{+++}\\right| \\mathrm{Cr}_{(\\mathrm{s})}$ at $25^{\\circ} \\mathrm{C}$ if $\\mathrm{E}_{\\text {cell }}^{\\circ}$ is $0.02 \\mathrm{~V}$", "image": null}, "options": [{"id": "WvLas", "text": "$-0.05 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "3E477", "text": "$0.03 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "29Ygc", "text": "$-0.06 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "V6EfH", "text": "$0.07 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction is\n$$\n\\begin{aligned}\n& 3 \\mathrm{Zn}_{(\\mathrm{s})}+2 \\mathrm{Cr}_{(0.1 \\mathrm{M})}^{3+} \\longrightarrow 3 \\mathrm{Zn}_{(0.1)}^{2+}+2 \\mathrm{Cr}_{(\\mathrm{s})} \\\\\n& \\mathrm{E}_{\\text {cell }}=\\mathrm{E}_{\\text {cell }}^{\\circ}-\\frac{0.0592 \\mathrm{~V}}{\\mathrm{n}} \\log _{10} \\frac{\\left[\\mathrm{Zn}^{2+}\\right]^3}{\\left[\\mathrm{Cr}^{3+}\\right]^2}\n\\end{aligned}\n$$\n$\\begin{aligned} \\therefore \\quad \\mathrm{E}_{\\text {cell }} & =0.02 \\mathrm{~V}-\\frac{0.0592 \\mathrm{~V}}{6} \\log _{10} \\frac{(0.1)^3}{(0.1)^2} \\\\ & =0.02 \\mathrm{~V}-\\frac{0.0592 \\mathrm{~V}}{6} \\log _{10} 0.1 \\\\ & =0.02 \\mathrm{~V}+\\frac{0.0592 \\mathrm{~V}}{6} \\times 1 \\\\ & =0.02 \\mathrm{~V}+0.0099 \\mathrm{~V} \\\\ & =0.03 \\mathrm{~V}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262250279619d9d8a3226", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Which from following is strongest reducing agent?", "image": null}, "options": [{"id": "kJwBr", "text": "$\\mathrm{K}$", "image": null, "isCorrect": true}, {"id": "GRuO0", "text": "$\\mathrm{Al}$", "image": null, "isCorrect": false}, {"id": "KnAKa", "text": "$\\mathrm{Mg}$", "image": null, "isCorrect": false}, {"id": "eWkYI", "text": "$\\mathrm{Ag}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The strength of reducing agents increases from top to bottom in the electrochemical series as $\\mathrm{E}^0$ values decrease. Among the given options, $\\mathrm{K}$ has the lowest value of $\\mathrm{E}^{\\circ}(-2.925 \\mathrm{~V})$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262230279619d9d8a3216", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Electrolytic cells containing $\\mathrm{Zn}$ and $\\mathrm{Al}$ salt solutions are connected in series. If $6.5 \\mathrm{~g}$ of $\\mathrm{Zn}$ is deposited in one cell calculate mass of Al deposited in second cell (molar mass : $\\mathrm{Zn}=65$, $\\mathrm{Al}=27$ ) by passing definite quantity of electricity?", "image": null}, "options": [{"id": "zSBat", "text": "$2.4 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "ga7eX", "text": "$2.1 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "Sz3Un", "text": "$2.7 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "gMZy3", "text": "$1.8 \\mathrm{~g}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Cell 1:\n$$\n\\begin{aligned}\n& \\mathrm{Zn}_{(\\mathrm{m})}^{2+}+2 \\mathrm{e}^{-} \\longrightarrow \\mathrm{Zn}_{(\\mathrm{s})} \\\\\n& (\\text { mole ratio) })_1=\\frac{1 \\mathrm{~mol}}{2 \\mathrm{~mole}^{-}}\n\\end{aligned}\n$$\nCell 2:\n$$\n\\begin{aligned}\n& \\mathrm{Al}_{(\\mathrm{sq})}^{3+}+3 \\mathrm{e}^{-} \\longrightarrow \\mathrm{Al}_{(\\mathrm{s})} \\\\\n& (\\text { mole ratio })_2=\\frac{1 \\mathrm{~mol}}{3 \\mathrm{~mole}^{-}}\n\\end{aligned}\n$$\n$\\begin{aligned} & \\frac{\\mathrm{W}_1}{(\\text { mole ratio })_1 \\times \\mathrm{M}_1}=\\frac{\\mathrm{W}_2}{(\\text { mole ratio })_2 \\times \\mathrm{M}_2} \\\\ & \\frac{6.5 \\mathrm{~g}}{1 \\mathrm{~mol} / 2 \\mathrm{~mol} \\mathrm{e}^{-} \\times 65 \\mathrm{~g} \\mathrm{~mol}^{-1}} \\\\ & =\\frac{\\mathrm{W}_2}{1 \\mathrm{~mol} / 3 \\mathrm{~mol} \\mathrm{e}^{-} \\times 27 \\mathrm{~g} \\mathrm{~mol}^{-1}} \\\\ & \\frac{6.5 \\mathrm{~g} \\times 2}{65}=\\frac{\\mathrm{W}_2 \\times 3}{27} \\\\ & \\mathrm{~W}_2=\\frac{6.5 \\times 2 \\times 27}{65 \\times 3}=1.8 \\mathrm{~g}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262200279619d9d8a3203", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Calculate $\\Delta \\mathrm{G}^{\\circ}$ for the reaction $\\mathrm{Mg}_{(s)}+\\mathrm{Sn}_{(\\mathrm{aq})}^{++} \\longrightarrow \\mathrm{Mg}_{(\\mathrm{mq})}^{++}+\\mathrm{Sn}_{(s)}$ if $\\mathrm{E}_{\\text {cell }}^0$ is $2.23 \\mathrm{~V}$.", "image": null}, "options": [{"id": "SQgpu", "text": "$-430.4 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "arerP", "text": "$215.2 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "Qkh1A", "text": "$645.6 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "xnVdD", "text": "$-860.8 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\Delta \\mathrm{G}^{\\circ} & =-\\mathrm{nFE}_{\\text {cell }}^{\\circ} \\\\ & =-2 \\times 96500 \\times 2.23 \\\\ & =-430390 \\mathrm{~J} \\\\ & =-430.4 \\mathrm{~kJ}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262120279619d9d8a3192", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "Calculate the $\\mathrm{E}_{\\text {cell }}^o$ for $\\mathrm{Zn}_{(\\mathrm{s})}\\left|\\mathrm{Zn}_{(\\mathrm{IM})}^{+}\\right|\\left|\\mathrm{Cd}_{(\\mathrm{IM})}^{+}\\right| \\mathrm{Cd}_{(\\mathrm{s})}$ at $25^{\\circ} \\mathrm{C}\\left[\\mathrm{E}_{\\mathrm{Zn}}^{\\circ}=-0.763 \\mathrm{~V} ; \\mathrm{E}_{\\mathrm{Cd}}^{\\circ}=-0.403 \\mathrm{~V}\\right]$", "image": null}, "options": [{"id": "Ul7Cf", "text": "$0.36 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "dXYzj", "text": "$1.17 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "MNuMW", "text": "$-0.36 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "0LWKU", "text": "$-1.17 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the given cell reaction, anode is $\\mathrm{Zn}$ and cathode is $\\mathrm{Cd}$.\n$\\begin{aligned}\n\\mathrm{E}_{\\text {cell }}^o & =\\mathrm{E}_{\\text {cathode }}^{\\circ}-\\mathrm{E}_{\\text {anode }}^0 \\\\\n& =-0.403-(-0.763) \\\\\n& =0.36 \\mathrm{~V}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fd0279619d9d8a30e8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Find the number of faradays of electricity required to produce $45 \\mathrm{~g}$ of $\\mathrm{Al}$ from molten $\\mathrm{Al}_2 \\mathrm{O}_3$.", "image": null}, "options": [{"id": "v9XXv", "text": "$1 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "AfElf", "text": "$3 \\mathrm{~F}$", "image": null, "isCorrect": false}, {"id": "LsmNO", "text": "$5\\mathrm{~F}$", "image": null, "isCorrect": true}, {"id": "OLOID", "text": "$7 \\mathrm{~F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{Al}^{3+}+3 \\mathrm{e}^{-} \\longrightarrow \\mathrm{Al}\n$$\n\nThe equation shows that 3 moles of electrons are required to produce 1 mole of $\\mathrm{Al}$ (i.e., $27 \\mathrm{~g}$ of $\\mathrm{Al}$ ).\n$\\therefore \\quad 3 \\mathrm{~F}$ of electricity is required to produce $27 \\mathrm{~g}$ of $\\mathrm{Al}$ from molten $\\mathrm{Al}_2 \\mathrm{O}_3$.\n$\\therefore \\quad$ Faradays of electricity required to produce $45 \\mathrm{~g}$ of $\\mathrm{Al}=\\frac{3}{27} \\times 45=5 \\mathrm{~F}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ec0279619d9d8a3065", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "Calculate $\\mathrm{E}_{\\text {cell }}^{\\circ}$ in which following reaction occurs. $\\mathrm{Mg}_{(\\mathrm{s})}+2 \\mathrm{Ag}_{(1 \\mathrm{M})}^{+} \\rightarrow \\mathrm{Mg}_{(1 \\mathrm{M})}^{++}+2 \\mathrm{Ag}_{(\\mathrm{s})}$ if $\\mathrm{E}_{\\mathrm{Ag}}^{\\circ}=0.8 \\mathrm{~V}$ and $\\mathrm{E}_{\\mathrm{Mg}}^{\\circ}=-2.37 \\mathrm{~V}$", "image": null}, "options": [{"id": "TmGtY", "text": "$-3.17 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "D0Zx1", "text": "$3.17 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "meOrp", "text": "$-1.57 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "JYwqR", "text": "$1.57 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the given cell reaction, anode is $\\mathrm{Mg}$ and cathode is Ag.\n$\\begin{aligned}\n\\mathrm{E}_{\\text {cell }}^0 & =\\mathrm{E}_{\\text {cathode }}^0-\\mathrm{E}_{\\text {anode }}^0 \\\\\n& =0.8-(-2.37) \\\\\n& =3.17 \\mathrm{~V}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c10279619d9d8a2f16", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "A reaction, $\\mathrm{Ni}_{(\\mathrm{s})}+\\mathrm{Cu}_{(\\mathrm{IM})}^{++} \\rightarrow \\mathrm{Ni}_{(\\mathrm{IM} 2}^{++}+\\mathrm{Cu}_{(\\mathrm{s})}$ occurs in a cell. Calculate $\\mathrm{E}_{\\mathrm{cell}}^6$ if $\\mathrm{E}_{\\mathrm{Cu}}^0=0.337 \\mathrm{~V}$ and $\\mathrm{E}_{\\mathrm{Ni}}^{\\mathrm{o}}=-0.257 \\mathrm{~V}$", "image": null}, "options": [{"id": "7W55B", "text": "$0.594 \\mathrm{~V}$", "image": null, "isCorrect": true}, {"id": "VmEcY", "text": "$-0.594 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "efVC9", "text": "$-0.08 \\mathrm{~V}$", "image": null, "isCorrect": false}, {"id": "kpNAo", "text": "$0.08 \\mathrm{~V}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The standard cell potential is given by\n$\\begin{aligned}\n\\mathrm{E}_{\\text {cell }}^o & =\\mathrm{E}_{\\text {cathode }}^{\\circ}-\\mathrm{E}_{\\text {anode }}^o \\\\\n\\mathrm{E}_{\\text {cell }}^{\\circ} & =\\mathrm{E}_{\\mathrm{Cu}}^{\\circ}-\\mathrm{E}_{\\mathrm{Ni}}^{\\circ} \\\\\n& =(0.337 \\mathrm{~V})-(-0.257 \\mathrm{~V}) \\\\\n& =0.337 \\mathrm{~V}+0.257 \\mathrm{~V} \\\\\n& =0.594 \\mathrm{~V}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ae0279619d9d8a2e7b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Calculate $\\Delta \\mathrm{G}^{\\circ}$ for the cell:\n$\\mathrm{Sn}_{(\\mathrm{s})}\\left|\\operatorname{Sn}_{(\\mathrm{IM})}^{++}\\right|\\left|\\operatorname{Ag}_{(\\mathrm{IM})}^{+}\\right| \\mathrm{Ag}_{(\\mathrm{s})} \\text { at } 25^{\\circ} \\mathrm{C}\\left(\\mathrm{E}_{\\text {cell }}^{\\circ}=0.90 \\mathrm{~V}\\right)$", "image": null}, "options": [{"id": "kfXNB", "text": "$-173.7 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "sgDgC", "text": "$-225.3 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "qZuHo", "text": "$-100.2 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "FNzyi", "text": "$-290.8 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\Delta \\mathrm{G}^{\\circ} & =-\
