ll constant:<br><br>$\\text{Cell constant} = k \\times R$<br><br>Substituting the given values:<br><br>$\\text{Cell constant} = 0.014 \\Omega^{-1} \\mathrm{cm}^{-1} \\times 60 \\Omega$<br><br>$\\text{Cell constant} = 0.84 \\mathrm{cm}^{-1}$<br><br>Answer: $0.84 \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214350aee93fa0796ded3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Which from the following concentrations of a weak electrolyte solution exhibits maximum molar conductivity?", "image": null}, "options": [{"id": "jtRem", "text": "$\\quad 0.004 \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "iEykm", "text": "0.002 M", "image": null, "isCorrect": false}, {"id": "dMei5", "text": "$\\quad 0.005 \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "oejzN", "text": "$\\quad 0.001 \\mathrm{M}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Molar conductivity of a weak electrolyte increases with a decrease in concentration (or increase in dilution). This is because the degree of dissociation of a weak electrolyte increases with dilution, producing more ions per mole of the electrolyte in the solution.<br><br>Among the given options, $0.001 \\mathrm{M}$ is the lowest concentration.<br><br>Therefore, the $0.001 \\mathrm{M}$ solution will exhibit the maximum molar conductivity.<br><br>Answer: $\\quad 0.001 \\mathrm{M}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214330aee93fa0796dec5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "What is the conductivity of 0.05 M NaOH solution having resistance 31.5 ohm and cell constant $0.315 \\mathrm{~cm}^{-1}$ ?", "image": null}, "options": [{"id": "5QKi2", "text": "$100 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "3u3lE", "text": "$0.02 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "SAhQw", "text": "$0.09 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "UfyX7", "text": "$0.01 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given:<br>Resistance, $R = 31.5 \\text{ ohm}$<br>Cell constant $= 0.315 \\text{ cm}^{-1}$<br><br>The conductivity $k$ is given by the formula:<br>$k = \\dfrac{1}{R} \\times \\text{Cell constant}$<br><br>Substituting the given values:<br>$k = \\dfrac{1}{31.5} \\times 0.315$<br><br>$k = 0.01 \\text{ ohm}^{-1} \\text{ cm}^{-1}$<br><br>Answer: $0.01 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214220aee93fa0796de41", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "The conductivity of 0.02 M solution of $\\mathrm{AgNO}_3$ is $0.00216 \\Omega^{-1} \\mathrm{~cm}^{-1}$ at 298 K . What is its molar conductivity?", "image": null}, "options": [{"id": "BYYc3", "text": "$232.0 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "Xxdux", "text": "$402.0 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "lK39W", "text": "$108.0 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "2musm", "text": "$150.0 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The molar conductivity $\\Lambda_m$ is given by the formula:<br><br>$\\Lambda_m = \\dfrac{1000 \\times \\kappa}{C}$<br><br>Given:<br>Conductivity, $\\kappa = 0.00216 \\Omega^{-1} \\mathrm{~cm}^{-1}$<br>Concentration, $C = 0.02 \\mathrm{~M}$<br><br>Substituting the values into the formula:<br><br>$\\Lambda_m = \\dfrac{1000 \\times 0.00216}{0.02}$<br><br>$\\Lambda_m = \\dfrac{2.16}{0.02}$<br><br>$\\Lambda_m = 108.0 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$<br><br>Answer: $108.0 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214200aee93fa0796de30", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Calculate the percentage dissociation of 0.05 M solution of weak electrolyte if its molar conductivity and molar conductivity at infinite dilution are respectively. $3.3 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ and $132 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$.", "image": null}, "options": [{"id": "yHCCJ", "text": "$4.0 \\%$", "image": null, "isCorrect": false}, {"id": "glLKZ", "text": "$3.5 \\%$", "image": null, "isCorrect": false}, {"id": "TMsxi", "text": "$2.5 \\%$", "image": null, "isCorrect": true}, {"id": "IAtry", "text": "$10.0 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The degree of dissociation $\\alpha$ is given by the ratio of molar conductivity at a given concentration to the molar conductivity at infinite dilution.<br><br>$\\alpha = \\dfrac{\\Lambda_m}{\\Lambda_m^\\infty}$<br><br>Substituting the given values:<br><br>$\\alpha = \\dfrac{3.3}{132} = 0.025$<br><br>Percentage dissociation $= \\alpha \\times 100$<br><br>Percentage dissociation $= 0.025 \\times 100 = 2.5 \\%$<br><br>Answer: $2.5 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fd0aee93fa0796dd1a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Which of the following cannot be used as standard solution for determination of cell constant of conductivity cell?", "image": null}, "options": [{"id": "wqlHj", "text": "1 M KCl", "image": null, "isCorrect": false}, {"id": "ntVSE", "text": "0.1 M KCl", "image": null, "isCorrect": false}, {"id": "SvGgH", "text": "$0.01 \\mathrm{M} \\mathrm{KCl}$", "image": null, "isCorrect": false}, {"id": "lTjWX", "text": "Saturated KCl", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The cell constant of a conductivity cell is determined by measuring the resistance of a standard solution whose conductivity is accurately known at a given temperature.<br><br>Standard solutions of KCl such as $1 \\text{ M}$, $0.1 \\text{ M}$, and $0.01 \\text{ M}$ are used because their conductivities are precisely known and tabulated at various temperatures.<br><br>Saturated KCl solution is not used as a standard solution for determining the cell constant because its concentration and conductivity vary significantly with temperature and it is not a standard reference for this purpose.<br><br>Answer: Saturated KCl", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fb0aee93fa0796dd0d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Cell constant of a conductivity cell is $0.9 \\mathrm{~cm}^{-1}$ and resistance shown by $\\mathrm{AgNO}_3$ solution is 6530 ohm. What is the conductivity of $\\mathrm{AgNO}_3$ solution?", "image": null}, "options": [{"id": "IRBXL", "text": "$725 \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "ov7KW", "text": "$5870 \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "PbepS", "text": "$1.38 \\times 10^{-4} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "rdvMT", "text": "$4.72 \\times 10^{-4} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The formula for conductivity $k$ is given by:<br><br>$k = \\dfrac{\\text{Cell constant}}{R}$<br><br>Given:<br>Cell constant $= 0.9 \\text{ cm}^{-1}$<br>Resistance $R = 6530 \\text{ } \\Omega$<br><br>Substituting the values into the formula:<br><br>$k = \\dfrac{0.9}{6530}$<br><br>$k = 1.378 \\times 10^{-4} \\text{ } \\Omega^{-1} \\text{ cm}^{-1}$<br><br>$k \\approx 1.38 \\times 10^{-4} \\text{ } \\Omega^{-1} \\text{ cm}^{-1}$<br><br>Answer: $1.38 \\times 10^{-4} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f90aee93fa0796dd01", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "What is the concentration of an electrolyte solution to have molar conductivity of $101 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ and conductivity of $1.01 \\times 10^{-2} \\Omega^{-1} \\mathrm{~cm}^{-1}$ at 298 K ?", "image": null}, "options": [{"id": "HfwJQ", "text": "0.05 M", "image": null, "isCorrect": false}, {"id": "lWseH", "text": "0.1 M", "image": null, "isCorrect": true}, {"id": "lJu0X", "text": "0.15 M", "image": null, "isCorrect": false}, {"id": "ToN9U", "text": "0.2 M", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relationship between molar conductivity $\\Lambda_m$, conductivity $\\kappa$, and concentration $C$ is given by:<br><br>$\\Lambda_m = \\dfrac{1000 \\times \\kappa}{C}$<br><br>Rearranging the formula to solve for concentration $C$:<br><br>$C = \\dfrac{1000 \\times \\kappa}{\\Lambda_m}$<br><br>Substituting the given values $\\kappa = 1.01 \\times 10^{-2} \\, \\Omega^{-1} \\, \\text{cm}^{-1}$ and $\\Lambda_m = 101 \\, \\Omega^{-1} \\, \\text{cm}^2 \\, \\text{mol}^{-1}$:<br><br>$C = \\dfrac{1000 \\times 1.01 \\times 10^{-2}}{101}$<br><br>$C = \\dfrac{10.1}{101}$<br><br>$C = 0.1 \\, \\text{M}$<br><br>Answer: 0.1 M", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ea0aee93fa0796dc88", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "The conductivity of 0.02 M KCl solution is $0.00250 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$. What is its molar conductivity?", "image": null}, "options": [{"id": "aoPor", "text": "$125 \\mathrm{ohm}^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "tEFI6", "text": "$0.05 \\mathrm{ohm}^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "e6CWs", "text": "$725 \\mathrm{ohm}^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "8ECnP", "text": "$800 \\mathrm{ohm}^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Conductivity, $\\kappa = 0.00250 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$<br>Concentration, $C = 0.02 \\mathrm{M}$<br><br>The formula for molar conductivity is:<br>$\\Lambda_m = \\dfrac{1000 \\times \\kappa}{C}$<br><br>Substituting the given values:<br>$\\Lambda_m = \\dfrac{1000 \\times 0.00250}{0.02}$<br><br>$\\Lambda_m = \\dfrac{2.5}{0.02}$<br><br>$\\Lambda_m = 125 \\mathrm{ohm}^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$<br><br>Answer: $125 \\mathrm{ohm}^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e90aee93fa0796dc7f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "The resistance of conductivity cell filled with 0.1 M KCl solution is 100 ohm and conductivity is $1.70 \\times 10^{-4} \\mathrm{~S} \\mathrm{~cm}^{-1}$. What is the cell constant of the cell?", "image": null}, "options": [{"id": "ECFer", "text": "$1.70 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "bvlEf", "text": "$0.017 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "erqvI", "text": "$0.058 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "rrLTt", "text": "$0.012 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The cell constant is given by the product of conductivity and resistance.<br><br>Cell constant $= k \\times R$<br><br>Given:<br>Conductivity, $k = 1.70 \\times 10^{-4} \\mathrm{~S} \\mathrm{~cm}^{-1}$<br>Resistance, $R = 100 \\ \\Omega$<br><br>Substituting the values:<br>Cell constant $= 1.70 \\times 10^{-4} \\times 100$<br><br>Cell constant $= 1.70 \\times 10^{-2} \\mathrm{~cm}^{-1} = 0.017 \\mathrm{~cm}^{-1}$<br><br>Answer: $0.017 \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d30aee93fa0796dbcd", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "The molar conductivity of 0.01 M acetic acid at $25^{\\circ} \\mathrm{C}$ is $16.5 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ and its molar conductivity at zero concentration is $390.7 \\ \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$. What is its degree of dissociation?", "image": null}, "options": [{"id": "VS2rP", "text": "0.0223", "image": null, "isCorrect": false}, {"id": "AYJRT", "text": "0.0422", "image": null, "isCorrect": true}, {"id": "0oeAO", "text": "0.0642", "image": null, "isCorrect": false}, {"id": "bKDhC", "text": "0.0821", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The degree of dissociation $\\alpha$ is given by the ratio of molar conductivity at a given concentration to the molar conductivity at infinite dilution (zero concentration).<br><br>$\\alpha = \\dfrac{\\Lambda_m}{\\Lambda_m^\\circ}$<br><br>Given:<br>$\\Lambda_m = 16.5 \\ \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$<br>$\\Lambda_m^\\circ = 390.7 \\ \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$<br><br>Substituting the values:<br><br>$\\alpha = \\dfrac{16.5}{390.7}$<br><br>$\\alpha = 0.0422$<br><br>Answer: 0.0422", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c50aee93fa0796db64", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Which of the following substances conducts electricity?", "image": null}, "options": [{"id": "NWlfT", "text": "Diamond", "image": null, "isCorrect": false}, {"id": "OKQV2", "text": "Sulphur (solid)", "image": null, "isCorrect": false}, {"id": "q9ynH", "text": "Molten NaCl", "image": null, "isCorrect": true}, {"id": "gTZAa", "text": "Crystalline NaCl", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Diamond is a covalent network solid where all valence electrons of carbon are involved in bonding, leaving no free electrons to conduct electricity.<br><br>Solid sulphur is a molecular solid with no free electrons or ions, so it acts as an insulator.<br><br>Crystalline NaCl is an ionic solid where the ions are held tightly in a rigid lattice and cannot move, so it does not conduct electricity.<br><br>In molten NaCl, the electrostatic forces of attraction between the oppositely charged ions are overcome by heat. The ions become free to move and can conduct electricity.<br><br>Answer: Molten NaCl", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c50aee93fa0796db63", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "What is the conductivity of 0.05 M KCl solution if cell constant is $1.32 \\mathrm{~cm}^{-1}$ and resistance is 528 ohm?", "image": null}, "options": [{"id": "S1Mus", "text": "$0.0401 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "wIfln", "text": "$0.0051 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "Xkcij", "text": "$0.0025 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "MsWf6", "text": "$0.0691 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Cell constant, $G^{*} = 1.32 \\mathrm{~cm}^{-1}$<br>Resistance, $R = 528 \\mathrm{~ohm}$<br><br>The formula for conductivity ($\\kappa$) is:<br>$\\kappa = \\dfrac{1}{R} \\times G^{*}$<br><br>Substituting the given values:<br>$\\kappa = \\dfrac{1}{528} \\times 1.32$<br>$\\kappa = \\dfrac{132}{52800}$<br>$\\kappa = \\dfrac{1}{400}$<br>$\\kappa = 0.0025 \\mathrm{~ohm}^{-1} \\mathrm{~cm}^{-1}$<br><br>Answer: $0.0025 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c40aee93fa0796db59", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "A conductivity cell dipped in 0.05 M KCl has resistance 600 ohm . If conductivity is $0.0012 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$. What is the value of cell constant?", "image": null}, "options": [{"id": "kUYrR", "text": "$0.50 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "m8sx0", "text": "$0.72 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "MkN7E", "text": "$1.5 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "GaxSn", "text": "$2.0 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relationship between conductivity ($\\kappa$), resistance ($R$), and cell constant ($G^{*}$) is given by:<br><br>$\\kappa = \\dfrac{1}{R} \\times G^{*}$<br><br>Rearranging the formula to solve for the cell constant:<br><br>$G^{*} = \\kappa \\times R$<br><br>Substituting the given values:<br><br>$G^{*} = 0.0012 \\text{ ohm}^{-1} \\text{ cm}^{-1} \\times 600 \\text{ ohm}$<br><br>$G^{*} = 0.72 \\text{ cm}^{-1}$<br><br>Answer: $0.72 \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c10aee93fa0796db45", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Which of the following units of electrical measurement is not equivalent to 1 Siemen?", "image": null}, "options": [{"id": "BNLUi", "text": "$\\Omega^{-1}$", "image": null, "isCorrect": false}, {"id": "Xy3Fv", "text": "$\\mathrm{AV}^{-1}$", "image": null, "isCorrect": false}, {"id": "uThUg", "text": "$\\mathrm{CV}^{-1} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "cL0QG", "text": "$\\Omega$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Siemen is the SI unit of electrical conductance, which is the reciprocal of electrical resistance.<br><br>Conductance $G = \\dfrac{1}{R}$<br><br>Unit of $G = \\Omega^{-1}$<br><br>From Ohm's law, $V = IR$, which gives $G = \\dfrac{I}{V}$<br><br>Unit of $G = \\mathrm{A} \\mathrm{V}^{-1}$<br><br>Since current $I = \\dfrac{Q}{t}$, we can write $G = \\dfrac{Q}{Vt}$<br><br>Unit of $G = \\mathrm{C} \\mathrm{V}^{-1} \\mathrm{s}^{-1}$<br><br>Thus, $\\Omega$ is the unit of resistance and is not equivalent to Siemen.<br><br>Answer: $\\Omega$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ac0aee93fa0796daa2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Resistance and conductivity of a cell containing 0.1 M KCl solution at 298 K are 115 ohm and $1.90 \\times 10^{-3} \\mathrm{~S} \\mathrm{~cm}^{-1}$ respectively. What is the value of cell constant?", "image": null}, "options": [{"id": "QKK0C", "text": "$0.165 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "QfkUY", "text": "$1.601 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "rm7H3", "text": "$2.185 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "wY4lj", "text": "$0.218 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The relation between cell constant ($G^*$), resistance ($R$), and conductivity ($\\kappa$) is given by:<br><br>$G^* = \\kappa \\times R$<br><br>Given:<br>Resistance, $R = 115 \\ \\Omega$<br>Conductivity, $\\kappa = 1.90 \\times 10^{-3} \\ \\text{S cm}^{-1}$<br><br>Substituting the given values into the formula:<br><br>$G^* = (1.90 \\times 10^{-3} \\ \\text{S cm}^{-1}) \\times (115 \\ \\Omega)$<br><br>$G^* = 218.5 \\times 10^{-3} \\ \\text{cm}^{-1}$<br><br>$G^* = 0.2185 \\ \\text{cm}^{-1}$<br><br>Rounding off to three decimal places, the cell constant is $0.218 \\ \\text{cm}^{-1}$.<br><br>Answer: $0.218 \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139c0aee93fa0796da21", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "For which electrolyte the molar conductivity at infinite dilution can not be obtained graphically?", "image": null}, "options": [{"id": "qvYsE", "text": "$\\mathrm{HNO}_3$", "image": null, "isCorrect": false}, {"id": "kdkVm", "text": "$\\quad \\mathrm{H}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": false}, {"id": "EgT7n", "text": "$\\mathrm{CH}_3 \\mathrm{COOH}$", "image": null, "isCorrect": true}, {"id": "O0OCy", "text": "KCl", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molar conductivity at infinite dilution ($\\Lambda_m^\\circ$) can be obtained graphically by extrapolating the plot of $\\Lambda_m$ versus $\\sqrt{c}$ to zero concentration for strong electrolytes.<br><br>For weak electrolytes, the plot of $\\Lambda_m$ versus $\\sqrt{c}$ shows a steep increase in molar conductivity at very low concentrations. Due to this steep curve, it is not possible to extrapolate the graph to zero concentration to determine $\\Lambda_m^\\circ$.<br><br>Among the given options, $\\mathrm{HNO}_3$, $\\mathrm{H}_2\\mathrm{SO}_4$, and $\\mathrm{KCl}$ are strong electrolytes. $\\mathrm{CH}_3\\mathrm{COOH}$ is a weak electrolyte.<br><br>Therefore, the molar conductivity at infinite dilution for $\\mathrm{CH}_3\\mathrm{COOH}$ cannot be obtained graphically.<br><br>Answer: $\\mathrm{CH}_3 \\mathrm{COOH}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138b0aee93fa0796d99c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Which of the following expressions for conductivity of solution of an electrolyte is NOT correct?", "image": null}, "options": [{"id": "wIIsC", "text": "$\\kappa =\\dfrac{1}{\\varrho}$", "image": null, "isCorrect": false}, {"id": "L1Oq9", "text": "$\\kappa =\\dfrac{1}{\\mathrm{R}} \\dfrac{\\mathrm{a}}{l}$", "image": null, "isCorrect": true}, {"id": "zVgAz", "text": "$\\kappa =\\mathrm{G} \\dfrac{l}{\\mathrm{a}}$", "image": null, "isCorrect": false}, {"id": "YmEFs", "text": "$\\kappa =\\Lambda . \\mathrm{c}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Conductivity $\\kappa$ is the reciprocal of resistivity $\\varrho$, so $\\kappa = \\dfrac{1}{\\varrho}$.<br><br>Resistance $R$ is given by $R = \\varrho \\dfrac{l}{a}$.<br><br>Taking the reciprocal, $\\dfrac{1}{R} = \\dfrac{1}{\\varrho} \\dfrac{a}{l}$.<br><br>Since conductance $G = \\dfrac{1}{R}$ and $\\kappa = \\dfrac{1}{\\varrho}$, we get $G = \\kappa \\dfrac{a}{l}$.<br><br>Rearranging for $\\kappa$, we get $\\kappa = G \\dfrac{l}{a} = \\dfrac{1}{R} \\dfrac{l}{a}$.<br><br>Molar conductivity $\\Lambda$ is defined as $\\Lambda = \\dfrac{\\kappa}{c}$, which gives $\\kappa = \\Lambda \\cdot c$.<br><br>The expression $\\kappa = \\dfrac{1}{R} \\dfrac{a}{l}$ is incorrect.<br><br>Answer: $\\kappa =\\dfrac{1}{\\mathrm{R}} \\dfrac{\\mathrm{a}}{l}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138a0aee93fa0796d994", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "What is the conductivity of 0.02 M AgNO 3 solution having cell constant $1.1 \\mathrm{~cm}^{-1}$ and resistance is 94.5 ohms?", "image": null}, "options": [{"id": "gfcMy", "text": "$0.0216 . \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "HPmRz", "text": "$0.0116 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "sCGMj", "text": "$0.0416 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "Zn4z8", "text": "$0.0859 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Cell constant, $G^{*} = 1.1 \\text{ cm}^{-1}$<br><br>Resistance, $R = 94.5 \\text{ ohm}$<br><br>Conductivity $\\kappa$ is given by the relation:<br><br>$\\kappa = \\dfrac{G^{*}}{R}$<br><br>Substituting the given values:<br><br>$\\kappa = \\dfrac{1.1}{94.5}$<br><br>$\\kappa = 0.01164 \\text{ ohm}^{-1} \\text{ cm}^{-1}$<br><br>$\\kappa \\approx 0.0116 \\text{ ohm}^{-1} \\text{ cm}^{-1}$<br><br>Answer: $0.0116 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213780aee93fa0796d907", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "The conductivity of 0.005 M NaI solution at $25^{\\circ} \\mathrm{C}$ is $6.07 \\times 10^{-4} \\Omega^{-1} \\mathrm{~cm}^{-1}$. Calculate its molar conductivity", "image": null}, "options": [{"id": "O1atA", "text": "$121.4 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "mGodR", "text": "$110.1 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "WN37r", "text": "$201.1 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "9TVpA", "text": "$241.4 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given conductivity $\\kappa = 6.07 \\times 10^{-4} \\Omega^{-1} \\mathrm{~cm}^{-1}$ and concentration $C = 0.005 \\mathrm{~M}$.<br><br>The molar conductivity $\\Lambda_m$ is given by the formula:<br><br>$\\Lambda_m = \\dfrac{\\kappa \\times 1000}{C}$<br><br>Substituting the given values:<br><br>$\\Lambda_m = \\dfrac{6.07 \\times 10^{-4} \\times 1000}{0.005}$<br><br>$\\Lambda_m = \\dfrac{0.607}{0.005}$<br><br>$\\Lambda_m = 121.4 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$<br><br>Answer: $121.4 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213640aee93fa0796d871", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "What is the cell constant, if two platinum electrodes in conductivity cell are separated by 0.92 cm and area of cross section is $1.2 \\mathrm{~cm}^2$ ?", "image": null}, "options": [{"id": "z01S8", "text": "$0.767 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "CmfeY", "text": "$0.906 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "gCVfm", "text": "$1.304 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "Z8G6W", "text": "$1.104 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The cell constant $G^*$ is given by the formula:<br><br>$G^* = \\dfrac{l}{A}$<br><br>where $l$ is the distance between the electrodes and $A$ is the area of cross section.<br><br>Given:<br>$l = 0.92 \\text{ cm}$<br>$A = 1.2 \\text{ cm}^2$<br><br>Substituting the values:<br><br>$G^* = \\dfrac{0.92}{1.2} \\text{ cm}^{-1}$<br><br>$G^* = \\dfrac{92}{120} \\text{ cm}^{-1} = 0.7666... \\text{ cm}^{-1}$<br><br>$G^* \\approx 0.767 \\text{ cm}^{-1}$<br><br>Answer: $0.767 \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213630aee93fa0796d867", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "A conductivity cell dipped on 0.05 M KCl has resistance 600 ohm . If conductivity is $0.0015 \\mathrm{ohm}^{-1} \\mathrm{~cm}^{-1}$. What is the value of cell constant?", "image": null}, "options": [{"id": "wIMGd", "text": "$0.47 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "zOqM0", "text": "$0.90 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "IFqij", "text": "$1.5 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "a5vPT", "text": "$2.5 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relationship between conductivity $\\kappa$, resistance $R$, and cell constant $G^*$ is given by:<br><br>$G^* = \\kappa \\times R$<br><br>Given:<br>$\\kappa = 0.0015 \\, \\Omega^{-1} \\text{cm}^{-1}$<br>$R = 600 \\, \\Omega$<br><br>Substituting the given values:<br><br>$G^* = 0.0015 \\times 600$<br><br>$G^* = 0.90 \\, \\text{cm}^{-1}$<br><br>Answer: $0.90 \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213620aee93fa0796d860", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "The limiting molar conductivities $\\left(\\Lambda_0\\right)$ for NaCl , KBr and KCl are 126, 152 and $150 \\mathrm{~S} \\mathrm{~cm} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ respectively. What is the $A_0$ of NaBr ?", "image": null}, "options": [{"id": "32Xiu", "text": "$128 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "3wj4z", "text": "$302 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "R4vnJ", "text": "$278 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "FrrHy", "text": "$176 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Kohlrausch's law of independent migration of ions:<br><br>$\\Lambda_0(\\text{NaBr}) = \\lambda_0(\\text{Na}^+) + \\lambda_0(\\text{Br}^-)$<br><br>This can be written in terms of the given electrolytes as:<br><br>$\\Lambda_0(\\text{NaBr}) = \\Lambda_0(\\text{NaCl}) + \\Lambda_0(\\text{KBr}) - \\Lambda_0(\\text{KCl})$<br><br>Substituting the given values:<br><br>$\\Lambda_0(\\text{NaBr}) = 126 + 152 - 150$<br><br>$\\Lambda_0(\\text{NaBr}) = 128 \\text{ S cm}^2 \\text{ mol}^{-1}$<br><br>Answer: $128 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134d0aee93fa0796d7b6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "The molar conductivity of 0.02 M KCl solution is $410 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ at $25^{\\circ} \\mathrm{C}$. Calculate its conductivity?", "image": null}, "options": [{"id": "P1001", "text": "$8.2 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "La4qf", "text": "$2.8 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "ZIjIp", "text": "$4.1 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "YXInd", "text": "$5.4 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relation between molar conductivity ($\\Lambda_m$) and conductivity ($\\kappa$) is given by:<br><br>$\\Lambda_m = \\dfrac{\\kappa \\times 1000}{C}$<br><br>Rearranging the formula to solve for $\\kappa$:<br><br>$\\kappa = \\dfrac{\\Lambda_m \\times C}{1000}$<br><br>Substituting the given values $\\Lambda_m = 410 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ and $C = 0.02$ M:<br><br>$\\kappa = \\dfrac{410 \\times 0.02}{1000}$<br><br>$\\kappa = \\dfrac{8.2}{1000}$<br><br>$\\kappa = 8.2 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$<br><br>Answer: $8.2 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133a0aee93fa0796d720", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The resistance of a conductivity cell of 0.1 M KCl solution is 120 ohm and conductivity is $1.64 \\times 10^{-4} \\mathrm{~S} \\mathrm{~cm}^{-1}$. What is the value of cell constant?", "image": null}, "options": [{"id": "RstS1", "text": "$0.0136 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "IM5hE", "text": "$0.0618 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "ehX99", "text": "$0.0196 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "5TUL9", "text": "$0.0731 \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Resistance, $R = 120 \\ \\Omega$<br>Conductivity, $\\kappa = 1.64 \\times 10^{-4} \\ \\mathrm{S} \\ \\mathrm{cm}^{-1}$<br><br>The relation between cell constant ($G^*$), conductivity ($\\kappa$), and resistance ($R$) is given by:<br>$G^* = \\kappa \\times R$<br><br>Substituting the given values:<br>$G^* = 1.64 \\times 10^{-4} \\ \\mathrm{S} \\ \\mathrm{cm}^{-1} \\times 120 \\ \\Omega$<br>$G^* = 196.8 \\times 10^{-4} \\ \\mathrm{cm}^{-1}$<br>$G^* \\approx 0.0196 \\ \\mathrm{cm}^{-1}$<br><br>Answer: $0.0196 \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213290aee93fa0796d69e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "The resistance of decimolar solution of NaCl is 30 ohms. Calculate the conductivity of solution if the cell constant is $0.33 \\mathrm{~cm}^{-1}$.", "image": null}, "options": [{"id": "SnzVB", "text": "$0.025 \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "C7Sly", "text": "$0.035 \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "X0aS5", "text": "$0.011 \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "PuJWd", "text": "$0.029 \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, resistance $R = 30 \\Omega$<br><br>Cell constant $G^{*} = 0.33 \\text{ cm}^{-1}$<br><br>The conductivity $\\kappa$ is given by the relation:<br><br>$\\kappa = \\dfrac{G^{*}}{R}$<br><br>Substituting the given values:<br><br>$\\kappa = \\dfrac{0.33}{30} = 0.011 \\Omega^{-1} \\text{ cm}^{-1}$<br><br>Answer: $0.011 \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262810279619d9d8a3514", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "An organic monobasic acid has dissociation constant $2.25 \\times 10^{-6}$. What is percent dissociation in its $0.01 \\mathrm{M}$ solution?", "image": null}, "options": [{"id": "2Ib0O", "text": "$1.5 \\%$", "image": null, "isCorrect": true}, {"id": "4IqRU", "text": "$15 \\%$", "image": null, "isCorrect": false}, {"id": "J1nMh", "text": "$5 \\%$", "image": null, "isCorrect": false}, {"id": "jAocG", "text": "$0.5 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{K}_{\\mathrm{a}}=2.25 \\times 10^{-6}$\nFor a weak monobasic acid,\n$\\begin{aligned}\n\\alpha=\\sqrt{\\frac{\\mathrm{K}_{\\mathrm{a}}}{\\mathrm{c}}}=\\sqrt{\\frac{2.25 \\times 10^{-6}}{0.01}}=\\sqrt{2.25 \\times 10^{-4}}=0.015 \\\\\n\\therefore \\quad \\text { Percent dissociation }=\\alpha \\times 100 \\\\\n=0.015 \\times 100=1.5 \\%\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262800279619d9d8a3505", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "A conductivity cell containing $0.001 \\mathrm{M} \\mathrm{AgNO}_3$ solution develops resistance $6530 \\mathrm{ohm}$ at $25^{\\circ} \\mathrm{C}$. Calculate the electrical conductivity of solution at same temperature if the cell constant is $0.653 \\mathrm{~cm}^{-1}$.", "image": null}, "options": [{"id": "mSveq", "text": "$1.3 \\times 10^{-4} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "CQCOH", "text": "$1.5 \\times 10^{-4} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "Of1dX", "text": "$1.7 \\times 10^{-4} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "tmlxr", "text": "$1.0 \\times 10^{-4} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\text { Cell constant }=\\mathrm{k} \\times \\mathrm{R} \\\\ \\therefore & 0.653=\\mathrm{k} \\times 6530 \\\\ \\therefore & \\mathrm{k}=\\frac{0.653}{6530}=1 \\times 10^{-4} \\Omega^{-1} \\mathrm{~cm}^{-1}\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626f0279619d9d8a347e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Calculate molar conductivity of $\\mathrm{NH}_4 \\mathrm{OH}$ at infinite dilution if molar conductivities of $\\mathrm{Ba}(\\mathrm{OH})_2 \\mathrm{BaCl}_2$ and $\\mathrm{NH}_4 \\mathrm{Cl}$ at infinite dilution are $520,280,129 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ respectively.", "image": null}, "options": [{"id": "6asm4", "text": "$249.0 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "cbUOb", "text": "$498.0 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "ok5MS", "text": "$125.0 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "m5MnD", "text": "$369.0 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Kohlrausch law,\ni. $\\quad \\wedge_0\\left(\\mathrm{Ba}(\\mathrm{OH})_2\\right)=\\lambda_{\\mathrm{Ba}^{2+}}^0+2 \\lambda_{\\mathrm{OH}^{-}}^0$\nii. $\\wedge_0\\left(\\mathrm{BaCl}_2\\right)=\\lambda_{\\mathrm{Ba}^{2+}}^0+2 \\lambda_{\\mathrm{Cl}^{-}}^0$\niii. $\\quad \\wedge_0\\left(\\mathrm{NH}_4 \\mathrm{Cl}\\right)=\\lambda_{\\mathrm{NH}_4^{+}}^0+\\lambda_{\\mathrm{Cl}^{-}}^0$\n$\\mathrm{Eq}(\\mathrm{i})+\\frac{1}{2} \\mathrm{Eq}$ (ii) $-\\frac{1}{2} \\mathrm{Eq}$ (iii) gives\n$\\begin{aligned} \\wedge_0\\left(\\mathrm{NH}_4 \\mathrm{OH}\\right)=\\wedge_0\\left(\\mathrm{NH}_4 \\mathrm{Cl}\\right)+ & \\frac{1}{2} \\wedge_0\\left(\\mathrm{Ba}(\\mathrm{OH})_2\\right) \\\\ & -\\frac{1}{2} \\wedge_0\\left(\\mathrm{BaCl}_2\\right)\\end{aligned}$\n$\\wedge_0\\left(\\mathrm{NH}_4 \\mathrm{OH}\\right)=129+\\frac{1}{2} 520-\\frac{1}{2} 280$\n$=249.0 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626e0279619d9d8a347b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Calculate dissociation constant of $0.001 \\mathrm{M}$ weak monoacidic base undergoing $2 \\%$ dissociation.", "image": null}, "options": [{"id": "zmwdK", "text": "$4 \\times 10^{-7}$", "image": null, "isCorrect": true}, {"id": "ooqcE", "text": "$2 \\times 10^{-6}$", "image": null, "isCorrect": false}, {"id": "pavoA", "text": "$2 \\times 10^{-7}$", "image": null, "isCorrect": false}, {"id": "tgIvx", "text": "$1 \\times 10^{-7}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\alpha=\\frac{\\text { Percent dissociation }}{100}=\\frac{2}{100}=0.02 \\\\ & K_a=\\alpha^2 c=(0.02)^2 \\times 0.001=4 \\times 10^{-7}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625e0279619d9d8a33f5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "What is the molar concentration of acetic acid if value of its dissociation constant is $1.8 \\times 10^{-5}$ and degree of dissociation is 0.02 ?", "image": null}, "options": [{"id": "C1SUG", "text": "$4.6 \\times 10^{-3} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "BQFi6", "text": "$4.5 \\times 10^{-2} \\mathrm{M}$", "image": null, "isCorrect": true}, {"id": "skOD2", "text": "$4.0 \\times 10^{-4} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "OZI9a", "text": "$3.6 \\times 10^{-2} \\mathrm{M}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{K}_{\\mathrm{a}}=1.8 \\times 10^{-5} ; \\alpha=0.02$\nFor a weak monobasic acid,\n$\\mathrm{K}_{\\mathrm{a}}=\\alpha^2 \\mathrm{c}$\n$\\therefore \\quad c=\\frac{\\mathrm{K}_{\\mathrm{a}}}{\\alpha^2}=\\frac{1.8 \\times 10^{-5}}{0.02^2}=0.045 \\mathrm{M}=4.5 \\times 10^{-2} \\mathrm{M}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625b0279619d9d8a33da", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "What is the molar conductivity of $0.005 \\mathrm{M}$ $\\mathrm{NaI}$ solution if its conductivity is $6.065 \\times 10^{-4} \\Omega^{-1} \\mathrm{~cm}^{-1}$ ?", "image": null}, "options": [{"id": "XbeBa", "text": "$121.3 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "YY3aJ", "text": "$115.1 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "LSF7h", "text": "$126.5 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "BhdYS", "text": "$131.2 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\wedge_{\\mathrm{m}}=\\frac{1000 \\mathrm{k}}{\\mathrm{c}}$\n$=\\frac{1000 \\times 6.065 \\times 10^{-4}}{0.005}=121.3 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262580279619d9d8a33c7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Which from the following expression represents molar conductivity of an electrolyte $\\mathrm{A}_2 \\mathrm{~B}_3$ type?", "image": null}, "options": [{"id": "eudP3", "text": "$2 \\lambda_{\\mathrm{A}^{++}}^0+3 \\lambda_{\\mathrm{B}^{--}}^0$", "image": null, "isCorrect": true}, {"id": "UVQk8", "text": "$13 \\lambda_{\\mathrm{A}^{+++}}^0+2 \\lambda_{\\mathrm{B}^{-}}^0$", "image": null, "isCorrect": false}, {"id": "m2lTW", "text": "$2 \\lambda_{\\mathrm{A}^{+*+}}^0+\\lambda_{\\mathrm{B}^{-}}^0$", "image": null, "isCorrect": false}, {"id": "DQ1PI", "text": "$\\lambda_{\\mathrm{A}^{4++}}^0+3 \\lambda_{\\mathrm{B}^{-}}^0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molar conductivity at zero concentration for an electrolyte is given by\n$\\Lambda_0=\\mathrm{n}_{+} \\lambda_{+}^0+\\mathrm{n}_{-} \\lambda_{-}^0$\n$\\mathrm{A}_2 \\mathrm{~B}_3 \\rightleftharpoons 2 \\mathrm{~A}^{3+}+3 \\mathrm{~B}^{2-}$\n$\\Lambda_0\\left(A_2 B_3\\right)=2 \\lambda_{\\mathrm{A}^{+++}}^0+3 \\lambda_{\\mathrm{B}^{--}}^0$", "image": null}, "videoSolution": null, "syllabusCa  2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262330279619d9d8a3298", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Which of the following expressions represents molar conductivity of $\\mathrm{AB}_3$ type electrolyte?", "image": null}, "options": [{"id": "0eItM", "text": "$3 \\lambda_{\\mathrm{A}^{+++}}^{\\circ}+\\lambda_{\\mathrm{B}^{-}}^0$", "image": null, "isCorrect": false}, {"id": "eNnpv", "text": "$\\lambda_{\\mathrm{A}^{+1+}}^0+\\lambda_{\\mathrm{B}^{-}}^0$", "image": null, "isCorrect": false}, {"id": "1tA9P", "text": "$\\lambda_{\\mathrm{A}^{++}}^0+3 \\lambda_{\\mathrm{B}^{-}}^0$", "image": null, "isCorrect": true}, {"id": "msG84", "text": "$2\\lambda_{\\mathrm{A}^{++}}^{\\circ}+\\lambda_{\\mathrm{B}^{-}}^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\wedge_0=\\mathrm{n}_{+} \\lambda_{+}^0+\\mathrm{n}_{-} \\lambda_{-}^0\n$$\n\nWhere, $\\lambda_{+}$and $\\lambda$ are molar conductivities of cation and anion, respectively, and $\\mathrm{n}_{+}$and $\\mathrm{n}$ are the number of moles of cation and anion specified in the chemical formula of an electrolyte.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262000279619d9d8a3103", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Which among the following is CORRECT formula for determination of cell constant?", "image": null}, "options": [{"id": "GeCDv", "text": "$\\frac{l}{\\mathrm{a}}=\\frac{\\mathrm{k}}{\\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "1HNDi", "text": "$\\frac{l}{\\mathrm{a}}=\\mathrm{k} \\cdot \\mathrm{R}$", "image": null, "isCorrect": true}, {"id": "yCZxM", "text": "$\\frac{l}{\\mathrm{a}}=\\frac{\\mathrm{R}}{\\mathrm{k}}$", "image": null, "isCorrect": false}, {"id": "kOkaU", "text": "$\\frac{l}{\\mathrm{a}}=\\frac{1}{\\mathrm{R}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\mathrm{k}=\\mathrm{G} \\frac{\\mathrm{l}}{\\mathrm{a}}=\\frac{1}{\\mathrm{R}} \\frac{\\mathrm{l}}{\\mathrm{a}} \\\\ \\therefore \\quad & \\text { Cell constant }=\\frac{l}{\\mathrm{a}}=\\mathrm{k} \\cdot \\mathrm{R}\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ff0279619d9d8a30fe", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "The molar conductivity of $0.02 \\mathrm{M} \\mathrm{AgI}$ at $298 \\mathrm{~K}$ is $142.3 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$. What is its conductivity?", "image": null}, "options": [{"id": "pd4B9", "text": "$1.42 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "4UbW8", "text": "$2.41 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "WxTBg", "text": "$2.85 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "RSXgL", "text": "$7.11 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\wedge & =\\frac{1000 \\mathrm{k}}{\\mathrm{c}} \\\\ \\mathrm{k} & =\\frac{\\Lambda \\mathrm{c}}{1000} \\\\ \\mathrm{k} & =\\frac{142.3 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1} \\times 0.02 \\mathrm{~mol} \\mathrm{~L}^{-1}}{1000 \\mathrm{~cm}^3 \\mathrm{~L}^{-1}} \\\\ \\therefore \\quad \\mathrm{k} & =2.85 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ed0279619d9d8a306c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "Calculate the conductivity of $0.02 \\mathrm{M}$ electrolyte solution if its molar conductivity is $407.2 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ ?", "image": null}, "options": [{"id": "dK06H", "text": "$8.144 \\times 10^{-3} \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "gV3kq", "text": "$4 te increases on dilution while conductivity (k) decreases on dilution.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d90279619d9d8a2fd4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "What mass of $\\mathrm{Mg}$ is produced during electrolysis of molten $\\mathrm{MgCl}_2$ by passing $2 \\mathrm{amp}$ current for 482.5 second?\n$\\left(\\right.$ Molar mass $\\mathrm{Mg}=24 \\mathrm{~g} \\mathrm{~mol}^{-1}$ )", "image": null}, "options": [{"id": "IMst0", "text": "$0.12 \\mathrm{~g}$", "image": null, "isCorrect": true}, {"id": "LIZ6Q", "text": "$0.24 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "DvzzB", "text": "$1.2 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "fNmzd", "text": "$0.4 \\mathrm{~g}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{Mg}_{(\\mathrm{s})}^{2+}+2 \\mathrm{e}^{-} \\longrightarrow \\mathrm{Mg}_{(\\mathrm{s})} \\\\ & \\text { Mole ratio }=\\frac{1 \\mathrm{~mol}}{2 \\mathrm{~mole}^{-}} \\\\ & \\mathrm{W}=\\frac{\\mathrm{I}(\\mathrm{A}) \\times \\mathrm{t}(\\mathrm{s})}{96500\\left(\\mathrm{C} / \\mathrm{mol} \\mathrm{e}^{-}\\right)} \\times \\text {mole ratio } \\times \\text { molar mass } \\\\ & \\mathrm{W}=\\frac{2 \\times 482.5}{96500\\left(\\mathrm{C} / \\mathrm{mol} \\mathrm{e}^{-}\\right)} \\times \\frac{1 \\mathrm{~mol}}{2 \\mathrm{~mol} \\mathrm{e}^{-}} \\times 24 \\mathrm{~g} \\mathrm{~mol}^{-1} \\\\ & \\mathrm{~W}=0.12 \\mathrm{~g}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d40279619d9d8a2fa8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "Conductivity of a solution is $1.26 \\times 10^{-2} \\Omega^{-1} \\mathrm{~cm}^{-1}$. Calculate molar conductivity for $0.01 \\mathrm{M}$ solution.", "image": null}, "options": [{"id": "d2kkY", "text": "$1.26 \\times 10^3 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "vVB0f", "text": "$2.52 \\times 10^3 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "RTx5L", "text": "$4.82 \\times 10^3 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "3PrE4", "text": "$6.30 \\times 10^3 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\Lambda & =\\frac{1000 \\mathrm{k}}{\\mathrm{c}} \\\\ & =\\frac{1000 \\mathrm{~cm}^3 \\mathrm{~L}^{-1} \\times 1.26 \\times 10^{-2} \\Omega^{-1} \\mathrm{~cm}^{-1}}{0.01 \\mathrm{~mol} \\mathrm{~L}^{-1}} \\\\ & =1.26 \\times 10^3 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c30279619d9d8a2f24", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "Which from the following compound solutions in water of equal concentration has electrical conductivity nearly same as distilled water?", "image": null}, "options": [{"id": "yg39O", "text": "Urea", "image": null, "isCorrect": true}, {"id": "N3ZMJ", "text": "Sodium chloride", "image": null, "isCorrect": false}, {"id": "FNUkB", "text": "Sodium hydroxide", "image": null, "isCorrect": false}, {"id": "f1s2U", "text": "Acetic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Urea is nonelectrolyte and hence, it has electrical conductivity nearly same as distilled water. Sodium chloride and sodium hydroxide are strong electrolytes while acetic acid is weak electrolyte.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c00279619d9d8a2f12", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "What is the conductivity of $0.05 \\mathrm{M} \\mathrm{BaCl}_2$ solution if its molar conductivity is $220 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1} ?$", "image": null}, "options": [{"id": "Y3Xjp", "text": "$0.011 \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": true}, {"id": "o9xcU", "text": "$0.022 \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "XVw9Q", "text": "$0.033 \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}, {"id": "f1kv5", "text": "$0.044 \\Omega^{-1} \\mathrm{~cm}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\Lambda & =\\frac{1000 \\mathrm{k}}{\\mathrm{c}} \\\\ \\mathrm{k} & =\\frac{\\Lambda \\mathrm{c}}{1000} \\\\ \\mathrm{k} & =\\frac{220 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1} \\times 0.05 \\mathrm{~mol} \\mathrm{~L}^{-1}}{1000 \\mathrm{~cm}^3 \\mathrm{~L}^{-1}} \\\\ & =0.011 \\Omega^{-1} \\mathrm{~cm}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261af0279619d9d8a2e82", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Calculate current in ampere required to deposit $4.8 \\mathrm{~g} \\mathrm{Cu}$ from it's salt solution in 30 minutes. $\\left[\\right.$ Molar mass of $\\left.\\mathrm{Cu}=63.5 \\mathrm{~g} \\mathrm{~mol}^{-1}\\right]$", "image": null}, "options": [{"id": "Nwcpz", "text": "8.1 ampere", "image": null, "isCorrect": true}, {"id": "s7UwU", "text": "6.4 ampere", "image": null, "isCorrect": false}, {"id": "MBwkw", "text": "10.5 ampere", "image": null, "isCorrect": false}, {"id": "wobP9", "text": "12.3 ampere", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{Cu}_{(\\mathrm{s})}^{2+}+2 \\mathrm{e}^{-} \\longrightarrow \\mathrm{Cu}_{(\\mathrm{s})} \\\\ & \\text { Mole ratio }=\\frac{1 \\mathrm{~mol}}{2 \\mathrm{~mole}^{-}} \\\\ & \\mathrm{W}=\\frac{\\mathrm{I}(\\mathrm{A}) \\times \\mathrm{t}(\\mathrm{s})}{96500\\left(\\mathrm{C} / \\mathrm{mol} \\mathrm{e}^{-}\\right)} \\times \\text {mole ratio } \\times \\text { molar mass } \\\\ & 4.8 \\mathrm{~g}=\\frac{\\mathrm{I}(\\mathrm{A}) \\times 30 \\times 60}{96500\\left(\\mathrm{C} / \\mathrm{mol} \\mathrm{e}^{-}\\right)} \\times \\frac{1 \\mathrm{~mol}}{2 \\mathrm{~mol} \\mathrm{e}^{-}} \\times 63.5 \\mathrm{~g} \\mathrm{~mol}^{-1} \\\\ & \\mathrm{I}(\\mathrm{A})=\\frac{4.8 \\times 96500 \\times 2}{63.5 \\times 30 \\times 60}=8.1 \\mathrm{~A}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261890279619d9d8a2d5c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "Calculate $\\wedge_0$ of $\\mathrm{CH}_2 \\mathrm{ClCOOH}$ if $\\wedge_0$ for $\\mathrm{HCl}, \\mathrm{KCl}$ and $\\mathrm{CH}_2 \\mathrm{ClCOOK}$ are 4.2, 1.5 and $1.1 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ respectively?", "image": null}, "options": [{"id": "eLzaK", "text": "$1.9 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "4nRBH", "text": "$4.2 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "ow2sq", "text": "$2.7 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "BauQC", "text": "$3.8 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\wedge \\mathrm{CH}_2 \\mathrm{CICOOH}=\\wedge_{\\mathrm{CH}_2 \\mathrm{CICOOK}}^0+\\wedge_{\\mathrm{HCI}}^0-\\wedge_{\\mathrm{KCI}}^0 \\\\ & =4.2+1.1-1.5 \\\\ & =3.8 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2617a0279619d9d8a2ce5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "Calculate the molar conductivity of $\\mathrm{CH}_2 \\mathrm{ClCOOH}$ at zero concentration if molar conductivities of $\\mathrm{HCl}, \\mathrm{KCl}$ and $\\mathrm{CH}_2 \\mathrm{ClCOOK}$ at zero concentration are $4.2,1.4$ and $1.1 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ respectively.", "image": null}, "options": [{"id": "Mo0eE", "text": "$3.9 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "l2fAu", "text": "$4.5 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "iuXXH", "text": "$6.6 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "Qdlij", "text": "$1.7 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\Lambda_{\\mathrm{CH}_2 \\mathrm{ClCOOH}}^{\\circ} & =\\Lambda_{\\mathrm{CH}_2 \\mathrm{ClCOOK}}^{\\circ}+\\Lambda_{\\mathrm{HCl}}^{\\circ}-\\Lambda_{\\mathrm{KCl}}^{\\circ} \\\\ \\Lambda_{\\mathrm{CH}_2 \\mathrm{ClCOOH}}^{\\circ} & =1.1+4.2-1.4 \\\\ & =3.9 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261640279619d9d8a2c32", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "Molar conductivity of $0.01 \\mathrm{M} \\mathrm{CH}_3 \\mathrm{COOH}$ is $19.5 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$. Calculate its degree of dissociation if molar conductivity at zero concentration is $390 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ ?", "image": null}, "options": [{"id": "51OyN", "text
