  <script>
    const data = {"index": 20, "chapterId": "61c089a95e8b78d6a63befa1", "chapter": "Surface Chemistry", "exam": "MHT CET", "totalTopics": 8, "totalQuestions": 126, "downloadTime": "2026-10-08 20:06:44", "topics": [{"index": 1, "topicId": "65a2632d0279619d9d8a3cb6", "title": "Adsorption", "totalQuestions": 25, "questions": [{"_id": "6abb88d015a9fc0fc8c14737", "type": "singleCorrect", "question": {"text": "Identify false statement among the following regarding adsorption.", "image": null}, "options": [{"id": "XlnmU", "label": "A", "text": "It is a surface phenomenon.", "isCorrect": false, "image": null}, {"id": "BXDTi", "label": "B", "text": "It is an exothermic process.", "isCorrect": false, "image": null}, {"id": "PMYDJ", "label": "C", "text": "Gases having low critical temperature can be readily adsorbed by solid adsorbent.", "isCorrect": true, "image": null}, {"id": "r7gWP", "label": "D", "text": "Colloidal substances acts as good adsorbents.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Adsorption is a surface phenomenon where molecules accumulate at the surface rather than in the bulk.<br><br>During adsorption, there is always a decrease in residual forces of the surface, which leads to a decrease in surface energy. This energy is released as heat, making adsorption an exothermic process.<br><br>The extent of adsorption of a gas on a solid depends on the nature of the gas. Easily liquefiable gases, which have higher critical temperatures, are adsorbed more readily because the van der Waals forces are stronger. Therefore, gases with low critical temperatures are not readily adsorbed.<br><br>Colloidal substances have a very large surface area per unit mass, which makes them excellent adsorbents.<br><br>Thus, the statement that gases having low critical temperature can be readily adsorbed is false.<br><br>Answer: Gases having low critical temperature can be readily adsorbed by solid adsorbent.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88af15a9fc0fc8c1460b", "type": "singleCorrect", "question": {"text": "Which of the following statements is NOT True with respect to physisorption?", "image": null}, "options": [{"id": "aJg76", "label": "A", "text": "It is reversible", "isCorrect": false, "image": null}, {"id": "2k5ZZ", "label": "B", "text": "It is multimolecular.", "isCorrect": false, "image": null}, {"id": "oSlET", "label": "C", "text": "$\\Delta H < 0$", "isCorrect": false, "image": null}, {"id": "VYVHS", "label": "D", "text": "$\\Delta S > 0$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Physisorption involves weak van der Waals forces and is a reversible process.<br><br>It can form multimolecular layers on the adsorbent surface at higher pressures.<br><br>Adsorption is an exothermic process, meaning the enthalpy change is negative ($\\Delta H < 0$).<br><br>During adsorption, the gas molecules are restricted to the surface of the solid, which decreases their randomness or entropy. Therefore, the entropy change is negative ($\\Delta S < 0$).<br><br>Thus, the statement $\\Delta S > 0$ is not true.<br><br>Answer: $\\Delta S > 0$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886015a9fc0fc8c1431d", "type": "singleCorrect", "question": {"text": "The phenomenon in which adsorption and absorption take place simultaneously is called", "image": null}, "options": [{"id": "V2Wsc", "label": "A", "text": "Sorption", "isCorrect": true, "image": null}, {"id": "mek3T", "label": "B", "text": "Adsorption", "isCorrect": false, "image": null}, {"id": "PG5jy", "label": "C", "text": "Desorption", "isCorrect": false, "image": null}, {"id": "NTrcI", "label": "D", "text": "Deposition", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The phenomenon in which both adsorption and absorption take place simultaneously is known as sorption.<br><br>Adsorption is a surface phenomenon where particles accumulate on the surface, whereas absorption is a bulk phenomenon where particles are uniformly distributed throughout the body of the material.<br><br>Desorption is the process of removing an adsorbed substance from a surface, and deposition is the phase transition in which gas transforms into solid without passing through the liquid phase.<br><br>Answer: Sorption", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30c8c30a4553e1bdf9d", "type": "singleCorrect", "question": {"text": "Which of following forces is responsible for physisorption ?", "image": null}, "options": [{"id": "zM5JH", "label": "A", "text": "Coulombic force", "isCorrect": false, "image": null}, {"id": "6z9gW", "label": "B", "text": "Electrostatic force", "isCorrect": false, "image": null}, {"id": "ttxrm", "label": "C", "text": "London force of dispersion", "isCorrect": true, "image": null}, {"id": "kzCMM", "label": "D", "text": "Hydrogen bonding", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Physisorption, also known as physical adsorption, arises due to weak van der Waals forces between the adsorbate and the adsorbent.<br><br>London force of dispersion is a type of van der Waals force and is the primary force responsible for physisorption.<br><br>Coulombic and electrostatic forces are strong forces typically associated with ionic interactions or chemisorption, while hydrogen bonding is a specific dipole-dipole interaction not universally responsible for physisorption.<br><br>Answer: London force of dispersion", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36e8c30a4553e1be3ae", "type": "singleCorrect", "question": {"text": "Which of the following statements is correct for the spontaneous adsorption of a gas?", "image": null}, "options": [{"id": "wkoXH", "label": "A", "text": "$\\Delta S$ is negative and, therefore $\\Delta H$ should be highly positive", "isCorrect": false, "image": null}, {"id": "mmtSw", "label": "B", "text": "$\\Delta S$ is negative and therefore, $\\Delta H$ should be highly negative.", "isCorrect": true, "image": null}, {"id": "gml7w", "label": "C", "text": "$\\Delta S$ is positive and therefore, $\\Delta H$ should be negative.", "isCorrect": false, "image": null}, {"id": "SHO2h", "label": "D", "text": "$\\Delta S$ is positive and therefore, $\\Delta H$ should also be highly positive.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "During the adsorption of a gas, the gas molecules are restricted to the surface of the solid, which decreases their randomness or entropy. Thus, the change in entropy, $\\Delta S$, is negative.<br><br>For a process to be spontaneous, the change in Gibbs free energy, $\\Delta G$, must be negative.<br><br>According to the Gibbs-Helmholtz equation:<br>$\\Delta G = \\Delta H - T\\Delta S$<br><br>Since $\\Delta S$ is negative, the term $-T\\Delta S$ becomes positive. For $\\Delta G$ to be negative, the enthalpy change, $\\Delta H$, must be negative and its magnitude must be large enough to overcome the positive $-T\\Delta S$ term.<br><br>Therefore, $\\Delta S$ is negative and $\\Delta H$ should be highly negative.<br><br>Answer: $\\Delta S$ is negative and therefore, $\\Delta H$ should be highly negative.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35f8c30a4553e1be30b", "type": "singleCorrect", "question": {"text": "Identify the gas adsorbed by solid to the largest extent at their respective critical temperature.", "image": null}, "options": [{"id": "o6wcc", "label": "A", "text": "$\\text{N}_{2(g)}$", "isCorrect": false, "image": null}, {"id": "COVA9", "label": "B", "text": "$\\text{O}_{2(g)}$", "isCorrect": false, "image": null}, {"id": "q5lW5", "label": "C", "text": "$\\text{H}_{2(g)}$", "isCorrect": false, "image": null}, {"id": "S5IzN", "label": "D", "text": "$\\text{SO}_{2(g)}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The extent of adsorption of a gas on a solid surface depends on the strength of intermolecular forces. Gases with higher critical temperatures have stronger van der Waals forces of attraction and are more easily liquefiable, leading to a greater extent of adsorption.<br><br>The critical temperatures of the given gases are approximately:<br>$\\text{H}_{2} \\approx 33 \\text{ K}$<br>$\\text{N}_{2} \\approx 126 \\text{ K}$<br>$\\text{O}_{2} \\approx 154 \\text{ K}$<br>$\\text{SO}_{2} \\approx 430 \\text{ K}$<br><br>Since $\\text{SO}_{2}$ has the highest critical temperature among the given options, it has the strongest intermolecular forces and is adsorbed to the largest extent.<br><br>Answer: $\\text{SO}_{2(g)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b68c30a4553e1bdc03", "type": "singleCorrect", "question": {"text": "Which of the following assertions about the extent of physisorption is correct?", "image": null}, "options": [{"id": "CLdwe", "label": "A", "text": "Increases with increase in temperature", "isCorrect": false, "image": null}, {"id": "ZPK9t", "label": "B", "text": "Decreases with increase in surface area", "isCorrect": false, "image": null}, {"id": "ueoTi", "label": "C", "text": "Decreases with increase in the strength of Van der Waals forces", "isCorrect": false, "image": null}, {"id": "7ESWW", "label": "D", "text": "Decreases with increase in temperature", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Physisorption is an exothermic process. According to Le Chatelier's principle, an increase in temperature shifts the equilibrium in the backward direction, leading to desorption. Thus, the extent of physisorption decreases with an increase in temperature.<br><br>Additionally, the extent of physisorption increases with an increase in the surface area of the adsorbent and with an increase in the strength of Van der Waals forces between the adsorbate and adsorbent.<br><br>Answer: Decreases with increase in temperature", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bfdbf9280d7f9932e44", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is NOT a characterstic of chemisorption?", "image": null}, "options": [{"id": "o9NUY", "text": "It is specific.", "image": null, "isCorrect": false}, {"id": "hECw5", "text": "Heat released is in the range of $40-200 \\mathrm{~kJ} / \\mathrm{mol}$.", "image": null, "isCorrect": false}, {"id": "TH4Vg", "text": "Formation of multimolecular layer of adsorbate.", "image": null, "isCorrect": true}, {"id": "U7GMR", "text": "It is irreversible.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Chemisorption involves the formation of chemical bonds between the adsorbate molecules and the surface of the adsorbent.<br><br>Because chemical bonds can only be formed directly with the surface molecules, chemisorption results in the formation of a unimolecular layer (monolayer) of the adsorbate.<br><br>Physisorption, which involves weak van der Waals forces, can form multimolecular layers.<br><br>Other characteristics of chemisorption include being highly specific, irreversible, and having a high heat of adsorption (typically in the range of $40-200 \\mathrm{~kJ} / \\mathrm{mol}$ or $80-240 \\mathrm{~kJ} / \\mathrm{mol}$).<br><br>Therefore, the formation of a multimolecular layer is not a characteristic of chemisorption.<br><br>Answer: Formation of multimolecular layer of adsorbate.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcdbf9280d7f9932c87", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following gases is least adsorbed on solid at similar conditions of temperature and pressure?", "image": null}, "options": [{"id": "HGIvu", "text": "$\\mathrm{Cl}_2$", "image": null, "isCorrect": false}, {"id": "1Gxv1", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": false}, {"id": "KPI5W", "text": "$\\mathrm{SO}_2$", "image": null, "isCorrect": false}, {"id": "6aEyD", "text": "$\\mathrm{H}_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The extent of adsorption of a gas on a solid surface depends on the critical temperature of the gas.<br><br>Gases with higher critical temperatures are more easily liquefiable and have stronger van der Waals forces of attraction, leading to greater adsorption.<br><br>Among the given gases, $\\mathrm{H}_2$ has the lowest critical temperature and the weakest van der Waals forces.<br><br>Therefore, $\\mathrm{H}_2$ is least adsorbed on a solid under similar conditions of temperature and pressure.<br><br>Answer: $\\mathrm{H}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba8bf9280d7f9932b54", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Find the temperature from following graph so that highest amount of a gas is adsorbed\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/SKgFjsJoaL_ysiXxLcHGrXC94-xf7lDVQZTnrOtSP5g.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "7K0CZ", "text": "195 K", "image": null, "isCorrect": true}, {"id": "Rqz9p", "text": "210 K", "image": null, "isCorrect": false}, {"id": "9Goe6", "text": "244 K", "image": null, "isCorrect": false}, {"id": "EISGw", "text": "273 K", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given graph represents adsorption isotherms, plotting the amount of gas adsorbed per unit mass of adsorbent ($\\dfrac{x}{m}$) against pressure ($p$) at different temperatures.<br><br>From the graph, at any constant pressure, the value of $\\dfrac{x}{m}$ is maximum for the uppermost curve.<br><br>The uppermost curve corresponds to the temperature $195\\text{ K}$.<br><br>Since physical adsorption is an exothermic process, the extent of adsorption decreases with an increase in temperature. Thus, the highest amount of gas is adsorbed at the lowest temperature shown, which is $195\\text{ K}$.<br><br>Answer: 195 K", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3abf9280d7f9932746", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is effectively used to remove E. coli bacteria from water?", "image": null}, "options": [{"id": "Me4AZ", "text": "Silver nanoparticles", "image": null, "isCorrect": true}, {"id": "bxQ5l", "text": "Carbon black nanoparticles", "image": null, "isCorrect": false}, {"id": "EpXm5", "text": "$\\mathrm{TiO}_2$ nanoparticles", "image": null, "isCorrect": false}, {"id": "8pzK3", "text": "Silicon nanoparticles", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Silver nanoparticles act as highly effective antibacterial agents. They are widely used in water purification systems to effectively remove E. coli bacteria from water.<br><br>Answer: Silver nanoparticles", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3abf9280d7f9932745", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following gases is adsorbed to greater extent if adsorbent remains same at similar conditions of temperature and pressure?", "image": null}, "options": [{"id": "wp189", "text": "$\\mathrm{O}_2$", "image": null, "isCorrect": false}, {"id": "CSIOR", "text": "$\\mathrm{SO}_2$", "image": null, "isCorrect": true}, {"id": "ojj0U", "text": "$\\mathrm{N}_2$", "image": null, "isCorrect": false}, {"id": "5XwbH", "text": "$\\mathrm{H}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The extent of adsorption of a gas on a solid surface depends on its critical temperature. Gases with higher critical temperatures are more easily liquefiable and have stronger van der Waals forces of attraction, leading to a greater extent of adsorption.<br><br>Among the given gases, $\\mathrm{SO}_2$ has the highest critical temperature, making it the most easily liquefiable gas.<br><br>Therefore, $\\mathrm{SO}_2$ is adsorbed to a greater extent compared to $\\mathrm{O}_2$, $\\mathrm{N}_2$, and $\\mathrm{H}_2$.<br><br>Answer: $\\mathrm{SO}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b15bf9280d7f9932623", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify example of sorption from following.", "image": null}, "options": [{"id": "OPURY", "text": "Charcoal is added to methylene blue solution.", "image": null, "isCorrect": false}, {"id": "xhTqV", "text": "Chalk is dipped in ink.", "image": null, "isCorrect": true}, {"id": "ShOVL", "text": "Hydrogen gas is passed over platinum.", "image": null, "isCorrect": false}, {"id": "TaglC", "text": "Oxygen gas is passed over finely divided nickel.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Sorption is a process in which both adsorption and absorption take place simultaneously.<br><br>When a chalk stick is dipped in ink, the colored pigment of the ink is adsorbed on the surface of the chalk, while the solvent (water) is absorbed into the bulk of the chalk. Since both phenomena occur at the same time, it is an example of sorption.<br><br>Charcoal added to methylene blue solution, hydrogen gas passed over platinum, and oxygen gas passed over finely divided nickel are all examples of adsorption.<br><br>Answer: Chalk is dipped in ink.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d30aee93fa0796dbcf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Which from following statements is NOT true about absorption?", "image": null}, "options": [{"id": "pPVXw", "text": "Concentration of absorbate is uniform throughout the bulk of the absorbent.", "image": null, "isCorrect": false}, {"id": "aRDfG", "text": "It is independent of temperature and pressure.", "image": null, "isCorrect": false}, {"id": "4jPA6", "text": "It is not accompanied by evolution or absorption of heat.", "image": null, "isCorrect": false}, {"id": "jGulD", "text": "It depends on surface area.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Absorption is a bulk phenomenon where the absorbed matter is uniformly distributed throughout the bulk of the absorbent.<br><br>According to the standard differences between adsorption and absorption:<br>1. Absorption is a bulk phenomenon, whereas adsorption is a surface phenomenon.<br>2. Absorption is independent of surface area, whereas adsorption depends on the surface area of the adsorbent.<br>3. Absorption is generally considered independent of temperature and pressure in this context, whereas adsorption depends on them.<br>4. Absorption is not accompanied by the evolution or absorption of heat, whereas adsorption is an exothermic process.<br><br>Therefore, the statement \"It depends on surface area\" is true for adsorption but NOT true for absorption.<br><br>Answer: It depends on surface area.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627f0279619d9d8a3503", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Which of the following gases is readily adsorbed by solid adsorbent?", "image": null}, "options": [{"id": "5Cjp4", "text": "$Cl_2$", "image": null, "isCorrect": true}, {"id": "Ew7sv", "text": "$N_2$", "image": null, "isCorrect": false}, {"id": "OsBxs", "text": "$O_2$", "image": null, "isCorrect": false}, {"id": "fWH2H", "text": "$H_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Gases having high critical temperature liquefy easily and can be readily adsorbed. Examples: $\\mathrm{SO}_2, \\mathrm{Cl}_2, \\mathrm{NH}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262450279619d9d8a3330", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Identify FALSE statement regarding adsorption from following.", "image": null}, "options": [{"id": "6epgN", "text": "It takes place due to unbalanced forces acting on the surface of solid or liquid.", "image": null, "isCorrect": false}, {"id": "F2emC", "text": "During adsorption surface energy of adsorbent increases.", "image": null, "isCorrect": true}, {"id": "sxJRF", "text": "It is caused by van der Waals forces.", "image": null, "isCorrect": false}, {"id": "xzAJR", "text": "It is an exothermic process.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "During adsorption, surface energy (surface tension) of the adsorbent decreases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:0
