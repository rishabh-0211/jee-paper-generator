e": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260bd0279619d9d8a26e9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "Which of the following statements is true for adsorption?", "image": null}, "options": [{"id": "eo0df", "text": "It is accompanied by evolution of heat.", "image": null, "isCorrect": true}, {"id": "He7XS", "text": "It is a bulk phenomenon.", "image": null, "isCorrect": false}, {"id": "4Wz61", "text": "It is independent of surface area.", "image": null, "isCorrect": false}, {"id": "c250l", "text": "It is independent of temperature.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "- Adsorption is exothermic process.\n- Adsorption is surface phenomenon.\n- Adsorption depends on Temperature.\n- It depends on the surface area. It increases with increase of surface area.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260730279619d9d8a2498", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "Which among the following is true for chemisorption?", "image": null}, "options": [{"id": "WgCeB", "text": "Heat of adsorption is in the range of $20-40 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "20Hrq", "text": "It is multimolecular layered", "image": null, "isCorrect": false}, {"id": "kZYup", "text": "Van der Waals forces are involved", "image": null, "isCorrect": false}, {"id": "GedTF", "text": "It is favored at high temperature up to certain limit", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Chemical adsorption\n- It is caused by chemical bond formation.\n- Heat of adsorption is high.\n- High temperature is favorable. It increases with increase of temperature.\n- It forms unimolecular layer.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604c0279619d9d8a2357", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "Which of following statement is correct for physisorption?", "image": null}, "options": [{"id": "H8P7C", "text": "It involves formation of covalent or ionic bonds.", "image": null, "isCorrect": false}, {"id": "AOFQM", "text": "It is favoured at high temperature.", "image": null, "isCorrect": false}, {"id": "ZmH31", "text": "It is reversible.", "image": null, "isCorrect": true}, {"id": "zQsMz", "text": "It is very specific.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Physisorption\n- It arises because of van der Waals' force.\n- It is not specific in nature.\n- It is reversible in nature.\n- Low temperature is favorable for adsorption. It decreases with increase of temperature.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a2632d0279619d9d8a3cb2", "title": "Adsorption isotherms", "totalQuestions": 5, "questions": [{"_id": "68871b59bf9280d7f9932876", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following represents the Freundlich's empirical equation for adsorption of gas on solid (for $\\mathrm{n}>1$)", "image": null}, "options": [{"id": "kg2V5", "text": "$\\frac{x}{\\mathrm{~m}}=\\mathrm{kp}^{\\frac{1}{\\mathrm{n}}}$", "image": null, "isCorrect": true}, {"id": "OZirH", "text": "$\\frac{\\mathrm{m}}{x}=\\mathrm{kp}^{\\frac{1}{\\mathrm{n}}}$", "image": null, "isCorrect": false}, {"id": "cZ98w", "text": "$\\frac{x}{\\mathrm{~m}}=\\mathrm{kp}^{\\mathrm{n}}$", "image": null, "isCorrect": false}, {"id": "ktBT8", "text": "$\\frac{\\mathrm{m}}{x}=\\mathrm{kp}^{\\mathrm{n}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The Freundlich adsorption isotherm gives the empirical relationship between the quantity of gas adsorbed by a unit mass of solid adsorbent and pressure at a particular temperature.<br><br>The equation is expressed as:<br><br>$\\dfrac{x}{m} = k p^{\\dfrac{1}{n}}$<br><br>where $x$ is the mass of the gas adsorbed on mass $m$ of the adsorbent at pressure $p$, and $k$ and $n$ are constants which depend on the nature of the adsorbent and the gas at a particular temperature, with $n > 1$.<br><br>Answer: $\\frac{x}{\\mathrm{~m}}=\\mathrm{kp}^{\\frac{1}{\\mathrm{n}}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214370aee93fa0796dee5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "What is the value of slope in Freundlich adsorption isotherm $\\log \\frac{\\mathrm{x}}{\\mathrm{m}}$ against $\\log \\mathrm{C}$ ?", "image": null}, "options": [{"id": "EFbbF", "text": "$\\frac{1}{\\mathrm{n}}$", "image": null, "isCorrect": true}, {"id": "dGBCq", "text": "n", "image": null, "isCorrect": false}, {"id": "DvNOQ", "text": "K", "image": null, "isCorrect": false}, {"id": "QxSsj", "text": "$\\quad \\log \\mathrm{K}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The Freundlich adsorption isotherm is given by the equation:<br><br>$\\dfrac{x}{m} = K C^{1/n}$<br><br>Taking the logarithm on both sides, we get:<br><br>$\\log \\left(\\dfrac{x}{m}\\right) = \\log K + \\dfrac{1}{n} \\log C$<br><br>This equation is of the form of a straight line, $y = mx + c$, where:<br><br>$y = \\log \\left(\\dfrac{x}{m}\\right)$<br><br>$x = \\log C$<br><br>Slope ($m$) = $\\dfrac{1}{n}$<br><br>y-intercept ($c$) = $\\log K$<br><br>Therefore, the value of the slope in the plot of $\\log \\left(\\dfrac{x}{m}\\right)$ against $\\log C$ is $\\dfrac{1}{n}$.<br><br>Answer: $\\frac{1}{\\mathrm{n}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a80279619d9d8a2648", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "What is the value of intercept on y-axis when $\\log \\frac{x}{m}$ is plotted against lop P in Freundlich isotherm?", "image": null}, "options": [{"id": "TIvt3", "text": "$\\frac{1}{\\mathrm{n}}$", "image": null, "isCorrect": false}, {"id": "fQW1m", "text": "$\\log \\mathrm{k}$", "image": null, "isCorrect": true}, {"id": "kKOvu", "text": "$\\mathrm{n}$", "image": null, "isCorrect": false}, {"id": "X5Vj1", "text": "$\\mathrm{k}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Freundlich isotherm,\n$$\n\\frac{\\mathrm{x}}{\\mathrm{m}}=\\mathrm{kp}^{\\frac{1}{\\mathrm{n}}}\n$$\nTaking log,\n$$\n\\begin{aligned}\n& \\log \\frac{x}{m}=\\log k+\\frac{1}{n} \\log P \\\\\n& y=C+m x\n\\end{aligned}\n$$\nIntercept $=\\operatorname{logk}$\n$$\n\\text { Slope }=\\frac{1}{\\mathrm{n}}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f4b0279619d9d8a1b4c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "Freundlich's equation for adsorption of gas on solid is represented as", "image": null}, "options": [{"id": "yWNCM", "text": "$\\frac{\\mathrm{m}}{\\mathrm{x}}=\\mathrm{k} \\mathrm{P}^{\\mathrm{n}}$", "image": null, "isCorrect": false}, {"id": "v0oDv", "text": "$\\frac{x}{m}=k P^{n}$", "image": null, "isCorrect": false}, {"id": "aNIEn", "text": "$\\frac{\\mathrm{m}}{\\mathrm{x}}=\\mathrm{k} \\mathrm{P}^{\\frac{1}{\\mathrm{n}}}$", "image": null, "isCorrect": false}, {"id": "bmEaM", "text": "$\\frac{\\mathrm{x}}{\\mathrm{m}}=\\mathrm{k} \\mathrm{P}^{\\frac{1}{\\mathrm{n}}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e410279619d9d8a12f8", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Freundlich adsorption isotherm is", "image": null}, "options": [{"id": "AqSzZ", "text": "$\\frac{x}{m}=k p^{1 / n}$", "image": null, "isCorrect": false}, {"id": "4VktT", "text": "$x=m k p^{1 / n}$", "image": null, "isCorrect": false}, {"id": "o3q60", "text": "$x / m=k p^{-n}$", "image": null, "isCorrect": false}, {"id": "FmH8i", "text": "All of these", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Freundlich adsorption isotherm is\n$$\nx / m=k p^{1 / n}\n$$\nHere $p, k$ and $n$ are constant. Note : Freundlich isotherm is not applicable at high pressure.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a2632d0279619d9d8a3cb3", "title": "Catalysis and Theories of Catalysis", "totalQuestions": 8, "questions": [{"_id": "6a44d2e28c30a4553e1bddd9", "type": "singleCorrect", "question": {"text": "What is the role of catalyst in catalytic reaction ?", "image": null}, "options": [{"id": "TOUbd", "label": "A", "text": "It decreases the enthalpy of reaction.", "isCorrect": false, "image": null}, {"id": "3a7uj", "label": "B", "text": "It increases the enthalpy of reaction.", "isCorrect": false, "image": null}, {"id": "s4RXc", "label": "C", "text": "It decreases the energy of activation of reaction.", "isCorrect": true, "image": null}, {"id": "s3pgH", "label": "D", "text": "It increases the energy of activation of reaction.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A catalyst increases the rate of a chemical reaction by providing an alternative reaction pathway that has a lower activation energy.<br><br>It does not alter the enthalpy, entropy, or Gibbs free energy of the reaction.<br><br>Thus, the primary role of a catalyst is to decrease the energy of activation of the reaction.<br><br>Answer: It decreases the energy of activation of reaction.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bfebf9280d7f9932e52", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify catalyst used in following reaction.\n$\\mathrm{CO}_{(\\mathrm{g})}+\\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})} \\xrightarrow{623 \\mathrm{~K}} \\mathrm{CO}_{2(\\mathrm{~g})}+\\mathrm{H}_{2(\\mathrm{~g})}$", "image": null}, "options": [{"id": "rkDDh", "text": "Iron chromate", "image": null, "isCorrect": true}, {"id": "sTr6l", "text": "Vanadium pentoxide", "image": null, "isCorrect": false}, {"id": "MedjJ", "text": "Ni metal", "image": null, "isCorrect": false}, {"id": "VjnLs", "text": "Traces of acid or alkali", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is the water-gas shift reaction, which is used to increase the production of dihydrogen from syngas.<br><br>$\\mathrm{CO}_{(\\mathrm{g})} + \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})} \\xrightarrow{\\text{Iron chromate, } 673 \\mathrm{~K}} \\mathrm{CO}_{2(\\mathrm{~g})} + \\mathrm{H}_{2(\\mathrm{~g})}$<br><br>The catalyst used in this reaction is iron chromate.<br><br>Answer: Iron chromate", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213260aee93fa0796d68b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Which of the following is an example of heterogenous catalysis?", "image": null}, "options": [{"id": "XnYb6", "text": "Oxidation of $\\mathrm{SO}_{2(\\mathrm{~g})}$ in presence of $\\mathrm{NO}_{(\\mathrm{g})}$.", "image": null, "isCorrect": false}, {"id": "tLK0b", "text": "Decomposition of aqueous $\\mathrm{H}_2 \\mathrm{O}_2{ }^{-}$in presence of $\\mathrm{I}_{\\text {(aq) }}^{-}$.", "image": null, "isCorrect": false}, {"id": "AVBD0", "text": "Hydrolysis of sugar in presence of aq. $\\mathrm{H}_2 \\mathrm{SO}_4$.", "image": null, "isCorrect": false}, {"id": "3SEU2", "text": "Hydrogenation of vegetable oil in presence of $\\mathrm{Ni}_{(\\mathrm{s})}$.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Heterogeneous catalysis is a catalytic process in which the catalyst and the reactants are in different phases.<br><br>In the oxidation of $\\mathrm{SO}_{2(\\mathrm{g})}$ in the presence of $\\mathrm{NO}_{(\\mathrm{g})}$, both the reactants and the catalyst are in the gaseous phase, making it an example of homogeneous catalysis.<br><br>In the decomposition of aqueous $\\mathrm{H}_2\\mathrm{O}_2$ in the presence of $\\mathrm{I}^{-}_{(\\mathrm{aq})}$, both the reactant and the catalyst are in the aqueous phase, which is homogeneous catalysis.<br><br>In the hydrolysis of sugar in the presence of aqueous $\\mathrm{H}_2\\mathrm{SO}_4$, the reactants and the catalyst are in the same liquid phase, so it is homogeneous catalysis.<br><br>In the hydrogenation of vegetable oil (liquid) with $\\mathrm{H}_{2(\\mathrm{g})}$ in the presence of $\\mathrm{Ni}_{(\\mathrm{s})}$, the catalyst is in the solid phase while the reactants are in liquid and gaseous phases. Since the catalyst and reactants are in different phases, this is an example of heterogeneous catalysis.<br><br>Answer: Hydrogenation of vegetable oil in presence of $\\mathrm{Ni}_{(\\mathrm{s})}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261660279619d9d8a2c41", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "Which of the following conversions is carried out by using charcoal catalyst?", "image": null}, "options": [{"id": "kE7RM", "text": "$\\mathrm{SO}_2(g)+\\mathrm{Cl}_2(g) \\rightarrow \\mathrm{SO}_2 \\mathrm{Cl}_2(l)$", "image": null, "isCorrect": true}, {"id": "nCsxF", "text": "$4 \\mathrm{HCl}+\\mathrm{O}_2 \\rightarrow 2 \\mathrm{Cl}_2+2 \\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "8YlHE", "text": "$2 \\mathrm{SO}_2(g)+\\mathrm{O}_2(g) \\rightarrow 2 \\mathrm{SO}_3(g)$", "image": null, "isCorrect": false}, {"id": "C4Gaz", "text": "$2 \\mathrm{ZnS}(s)+3 \\mathrm{O}_2(g) \\rightarrow 2 \\mathrm{ZnO}(s)+2 \\mathrm{SO}_2(g)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{SO}_2+\\mathrm{Cl}_2 \\rightarrow \\mathrm{SO}_2 \\mathrm{Cl}_2$\nFor this reaction charcoal can be used as a catalyst.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260d30279619d9d8a279f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "Which of the following is a first step in mechanism of heterogenous catalysis?", "image": null}, "options": [{"id": "RmAuD", "text": "Desorption of reaction product from catalyst surface", "image": null, "isCorrect": false}, {"id": "jSoCZ", "text": "Adsorption of reactant molecules on catalyst surface to form an intermediate", "image": null, "isCorrect": false}, {"id": "TqMkI", "text": "Occurrence of chemical reaction on catalyst surface to form an intermediate", "image": null, "isCorrect": false}, {"id": "lmS0d", "text": "Diffusion of reactants towards catalyst surface", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The catalytic activity is localised on the surface of the catalyst. The mechanism involves five steps:\n(i) Diffusion of reactants to the surface of the catalyst.\n(ii) Adsorption of reactant molecules on the surface of the catalyst.\n(iii) Occurrence of chemical reaction on the catalyst surface, through formation of an intermediate.\n(iv) Desorption of reaction products away from the catalyst surface.\n(v) Diffusion of reaction products away from the catalyst surface.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fef0279619d9d8a206b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "Identify the enzyme ' $\\mathrm{X}$ ' in the following reaction. $\\mathrm{H}_{2} \\mathrm{O}_{2}(\\mathrm{aq}) \\stackrel{\\mathrm{x}}{\\longrightarrow} \\mathrm{H}_{2} \\mathrm{O}_{(\\mathrm{l})}+\\frac{1}{2} \\mathrm{O}_{2}(\\mathrm{~g})$", "image": null}, "options": [{"id": "GS8MM", "text": "amylase", "image": null, "isCorrect": false}, {"id": "jq8sA", "text": "ferroxidase", "image": null, "isCorrect": false}, {"id": "IGvDW", "text": "Catalase", "image": null, "isCorrect": true}, {"id": "1V5BA", "text": "carbonic anhydrase", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fba0279619d9d8a1ec5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "Identify the enzyme that catalyses the reaction of $\\mathrm{CO}_{2}$ with water in human body?", "image": null}, "options": [{"id": "6IPfS", "text": "Ferroxidase", "image": null, "isCorrect": true}, {"id": "vA3Tq", "text": "Catalase", "image": null, "isCorrect": false}, {"id": "LlpnD", "text": "Nitrogenase", "image": null, "isCorrect": false}, {"id": "akE1L", "text": "Carbonic anhydrase", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Carbonic anhydrase\nIn the human body, the carbonic anhydrase enzyme catalyses the reaction of $\\mathrm{CO}_{2}$ with water. It catalyses a reaction that converts $\\mathrm{CO}_{2}$ and water into carbonic acid, which dissociates into protons and bicarbonate ions. It is found in red blood cells.\n$\\mathrm{CO}_{2}+\\mathrm{H}_{2} \\mathrm{O} \\stackrel{\\text { Carbonic anhydrase }}{\\longrightarrow} \\mathrm{H}_{2} \\mathrm{CO}_{3}$\n$\\mathrm{CO}_{2}$ is transported from tissues to the lungs through the bloodstream.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f200279619d9d8a19f6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "Which of the following is a character of catalyst?", "image": null}, "options": [{"id": "mtG0K", "text": "It changes the position of equilibrium.", "image": null, "isCorrect": false}, {"id": "YxYkq", "text": "It increases the rates of both forward and Backward reactions equally in reversible reaction.", "image": null, "isCorrect": true}, {"id": "euxbc", "text": "It affects the energies of reactants and products of the reaction.", "image": null, "isCorrect": false}, {"id": "RNLv5", "text": "It increases the activation energy of reactants.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Reactions can be sped up by the addition of a catalyst, including reversible reactions involving a final equilibrium state. Recall that for a reversible reaction, the equilibrium state is one in which the forward and reverse reaction rates are equal. In the presence of a catalyst, both the forward and reverse reaction rates will speed up equally, thereby allowing the system to reach equilibrium faster. However, it is very important to keep in mind that the addition of a catalyst has no effect whatsoever on the final equilibrium position of the reaction. It simply gets it there faster.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a2632d0279619d9d8a3cb5", "title": "Colloids", "totalQuestions": 33, "questions": [{"_id": "6abb884015a9fc0fc8c141f1", "type": "singleCorrect", "question": {"text": "Identify a positively charged sol from the following.", "image": null}, "options": [{"id": "uaAz3", "label": "A", "text": "Antimony trisulfide", "isCorrect": false, "image": null}, {"id": "2krjH", "label": "B", "text": "Eosin", "isCorrect": false, "image": null}, {"id": "gCbS5", "label": "C", "text": "Gum", "isCorrect": false, "image": null}, {"id": "W53Jl", "label": "D", "text": "Hemoglobin", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to the classification of colloidal sols based on the nature of charge on the particles:<br><br>Positively charged sols include hydrated metallic oxides (e.g., $Fe_2O_3 \\cdot xH_2O$), basic dyes (e.g., methylene blue), hemoglobin (blood), and certain oxides (e.g., $TiO_2$).<br><br>Negatively charged sols include metal sols (e.g., Cu, Ag, Au), metallic sulfides (e.g., $Sb_2S_3$, $As_2S_3$), acid dyes (e.g., eosin, congo red), and naturally occurring macromolecular sols (e.g., starch, gum, gelatin, clay).<br><br>Therefore, hemoglobin is a positively charged sol, while antimony trisulfide, eosin, and gum are negatively charged sols.<br><br>Answer: Hemoglobin", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885015a9fc0fc8c14287", "type": "singleCorrect", "question": {"text": "Which of the following cations has maximum coagulating power to cause precipitation of negatively charged arsenious sulfide ?", "image": null}, "options": [{"id": "2sShD", "label": "A", "text": "$\\text{Na}^+$", "isCorrect": false, "image": null}, {"id": "crujE", "label": "B", "text": "$\\text{Zn}^{++}$", "isCorrect": false, "image": null}, {"id": "iLdeB", "label": "C", "text": "$\\text{Ca}^{++}$", "isCorrect": false, "image": null}, {"id": "9sOAu", "label": "D", "text": "$\\text{Al}^{+++}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to the Hardy-Schulze rule, the coagulating power of an ion is directly proportional to the magnitude of its charge (valency) for an oppositely charged sol.<br><br>Arsenious sulfide is a negatively charged sol, so cations are responsible for its coagulation.<br><br>The given cations and their charges are:<br>$\\text{Na}^+$ : $+1$<br>$\\text{Zn}^{++}$ : $+2$<br>$\\text{Ca}^{++}$ : $+2$<br>$\\text{Al}^{+++}$ : $+3$<br><br>Since $\\text{Al}^{+++}$ has the highest positive charge, it has the maximum coagulating power.<br><br>Answer: $\\text{Al}^{+++}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887015a9fc0fc8c143b3", "type": "singleCorrect", "question": {"text": "What type of colloid the cloud is?", "image": null}, "options": [{"id": "paDX8", "label": "A", "text": "Solid sol", "isCorrect": false, "image": null}, {"id": "Cl7C4", "label": "B", "text": "Aerosol", "isCorrect": true, "image": null}, {"id": "FZn4V", "label": "C", "text": "Emulsion", "isCorrect": false, "image": null}, {"id": "ZfAYD", "label": "D", "text": "Gel", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A cloud is a colloidal dispersion in which the dispersed phase is liquid (water droplets) and the dispersion medium is gas (air).<br><br>A colloidal system consisting of a liquid dispersed in a gas is known as an aerosol.<br><br>Answer: Aerosol", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888015a9fc0fc8c14449", "type": "singleCorrect", "question": {"text": "Identify the correct order of coagulating power of ions for the coagulation of $\\text{As}_2\\text{S}_3$ sol from the following.", "image": null}, "options": [{"id": "HRBJD", "label": "A", "text": "$\\text{Na}^+ > \\text{Ba}^{2+} > \\text{Al}^{3+}$", "isCorrect": false, "image": null}, {"id": "6rxQG", "label": "B", "text": "$\\text{Cl}^- > \\text{SO}_4^{2-} > \\text{PO}_4^{3-}$", "isCorrect": false, "image": null}, {"id": "kLP2E", "label": "C", "text": "$\\text{Al}^{3+} > \\text{Ba}^{2+} > \\text{Na}^{+}$", "isCorrect": true, "image": null}, {"id": "qGA9C", "label": "D", "text": "$\\text{PO}_4^{3-} > \\text{SO}_4^{2-} > \\text{Cl}^-$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\text{As}_2\\text{S}_3$ is a negatively charged sol because it adsorbs $\\text{S}^{2-}$ ions on its surface.<br><br>According to the Hardy-Schulze rule, the coagulation of a negatively charged sol is brought about by cations, and the coagulating power of an ion is directly proportional to its valency.<br><br>The valencies of the given cations are $+3$ for $\\text{Al}^{3+}$, $+2$ for $\\text{Ba}^{2+}$, and $+1$ for $\\text{Na}^{+}$.<br><br>Therefore, the correct order of coagulating power is $\\text{Al}^{3+} > \\text{Ba}^{2+} > \\text{Na}^{+}$.<br><br>Answer: $\\text{Al}^{3+} > \\text{Ba}^{2+} > \\text{Na}^{+}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c015a9fc0fc8c146a1", "type": "singleCorrect", "question": {"text": "What type of collodial system is milk?", "image": null}, "options": [{"id": "xKw4u", "label": "A", "text": "Sol", "isCorrect": false, "image": null}, {"id": "0Sr2i", "label": "B", "text": "Emulsion", "isCorrect": true, "image": null}, {"id": "t0I9s", "label": "C", "text": "Gel", "isCorrect": false, "image": null}, {"id": "f5ZNJ", "label": "D", "text": "Aerosol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Milk is a colloidal dispersion of liquid fat globules in water.<br><br>Since both the dispersed phase and the dispersion medium are liquids, this type of colloidal system is classified as an emulsion.<br><br>Answer: Emulsion", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3528c30a4553e1be281", "type": "singleCorrect", "question": {"text": "Identify the term used to describe movement of colloidal particles under applied electric potential without using semipermeable membrane.", "image": null}, "options": [{"id": "iiF6V", "label": "A", "text": "Dialysis", "isCorrect": false, "image": null}, {"id": "IN4wh", "label": "B", "text": "Electrophoresis", "isCorrect": true, "image": null}, {"id": "l06CL", "label": "C", "text": "Electroosmosis", "isCorrect": false, "image": null}, {"id": "uYqWC", "label": "D", "text": "Brownian motion", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The movement of colloidal particles under the influence of an applied electric potential is called electrophoresis.<br><br>When the movement of colloidal particles is prevented by some suitable means (like a semipermeable membrane), it is observed that the dispersion medium begins to move in an electric field. This phenomenon is termed electroosmosis.<br><br>Since the question specifies the movement of colloidal particles without using a semipermeable membrane, the correct term is electrophoresis.<br><br>Answer: Electrophoresis", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fd8c30a4553e1bdefb", "type": "singleCorrect", "question": {"text": "Which of the following properties of colloid is used to measure the rate of migration of sol particles?", "image": null}, "options": [{"id": "fJFuD", "label": "A", "text": "Tyndall effect", "isCorrect": false, "image": null}, {"id": "lISkr", "label": "B", "text": "Brownian motion", "isCorrect": false, "image": null}, {"id": "ND3lz", "label": "C", "text": "Electrophoresis", "isCorrect": true, "image": null}, {"id": "dmT2b", "label": "D", "text": "Electroosmosis", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Electrophoresis is the phenomenon of movement of colloidal particles under the influence of an applied electric field. By observing this movement, the rate of migration of sol particles can be measured.<br><br>Tyndall effect is the scattering of light by colloidal particles.<br><br>Brownian motion is the continuous zig-zag motion of colloidal particles.<br><br>Electroosmosis is the movement of the dispersion medium under an electric field when the colloidal particles are prevented from moving.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f28c30a4553e1bde80", "type": "singleCorrect", "question": {"text": "Which of the following is an example of macromolecular colloid?", "image": null}, "options": [{"id": "dPz4X", "label": "A", "text": "Proteins", "isCorrect": true, "image": null}, {"id": "RYA58", "label": "B", "text": "Detergents", "isCorrect": false, "image": null}, {"id": "3u2Of", "label": "C", "text": "Soap", "isCorrect": false, "image": null}, {"id": "fOXul", "label": "D", "text": "$\\text{S}_8$ sulphur molecules", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Macromolecular colloids are formed when large molecules (macromolecules) having colloidal dimensions are dispersed in a suitable dispersion medium. Examples include naturally occurring macromolecules such as starch, cellulose, proteins, and enzymes, as well as man-made polymers like polythene, nylon, and polystyrene.<br><br>Soaps and detergents are examples of associated colloids (micelles), which are formed by the aggregation of a large number of ions in concentrated solutions.<br><br>Sulphur sol, consisting of particles containing a thousand or more $\\text{S}_8$ sulphur molecules, is an example of a multimolecular colloid.<br><br>Therefore, proteins are an example of a macromolecular colloid.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36d8c30a4553e1be3a1", "type": "singleCorrect", "question": {"text": "Identify the correct statement regarding lyophilic colloid from the following.", "image": null}, "options": [{"id": "6dma1", "label": "A", "text": "It is irreversible.", "isCorrect": false, "image": null}, {"id": "QSVzZ", "label": "B", "text": "It is solvent hating colloid.", "isCorrect": false, "image": null}, {"id": "FB3AJ", "label": "C", "text": "It is formed only by special methods.", "isCorrect": false, "image": null}, {"id": "gGbUo", "label": "D", "text": "It is solvent loving colloid.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The word lyophilic means liquid-loving or solvent-loving. Therefore, lyophilic colloids are solvent-loving colloids.<br><br>They are reversible in nature because if the dispersion medium is separated from the dispersed phase, the sol can be reconstituted by simply remixing with the dispersion medium.<br><br>They can be prepared easily by directly mixing the dispersed phase with the dispersion medium, without requiring any special methods.<br><br>Answer: It is solvent loving colloid.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbebf9280d7f9932c0d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following substances is classified as macromolecular colloid?", "image": null}, "options": [{"id": "1s2fQ", "text": "Soap", "image": null, "isCorrect": false}, {"id": "NybOq", "text": "Detergent", "image": null, "isCorrect": false}, {"id": "jFFxp", "text": "$\\mathrm{S}_8$ sulphur molecules", "image": null, "isCorrect": false}, {"id": "V3gus", "text": "Nylon", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Colloids are classified into three types based on the type of particles of the dispersed phase:<br><br>1. Multimolecular colloids: Formed by the aggregation of a large number of atoms or smaller molecules. Example: Sulphur sol ($\\mathrm{S}_8$).<br><br>2. Macromolecular colloids: Formed by macromolecules (polymers) having large molecular masses. Examples: Starch, cellulose, proteins, nylon, polystyrene, synthetic rubber.<br><br>3. Associated colloids (Micelles): Formed by the aggregation of ions in concentrated solutions. Examples: Soaps and synthetic detergents.<br><br>Therefore, nylon is classified as a macromolecular colloid.<br><br>Answer: Nylon", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9abf9280d7f9932aca", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What type of colloid the fog is ?", "image": null}, "options": [{"id": "JWVEU", "text": "Aerosol", "image": null, "isCorrect": true}, {"id": "ZYIxN", "text": "Foam", "image": null, "isCorrect": false}, {"id": "iu4ri", "text": "Gel", "image": null, "isCorrect": false}, {"id": "QL3Er", "text": "Emulsion", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Fog is a colloidal system in which the dispersed phase is a liquid and the dispersion medium is a gas.<br><br>A colloidal dispersion of a liquid in a gas is known as an aerosol.<br><br>Therefore, fog is an example of an aerosol.<br><br>Answer: Aerosol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8bbf9280d7f9932a3c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following is classified as multimolecular colloid?", "image": null}, "options": [{"id": "dejU2", "text": "Starch", "image": null, "isCorrect": false}, {"id": "09iIm", "text": "Cellulose", "image": null, "isCorrect": false}, {"id": "2g2Wf", "text": "$\\mathrm{S}_8$ sulphur molecules", "image": null, "isCorrect": true}, {"id": "Sf5fA", "text": "Plastics", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Colloids are classified into three types based on the type of particles of the dispersed phase: multimolecular, macromolecular, and associated colloids.<br><br>Multimolecular colloids are formed by the aggregation of a large number of atoms or smaller molecules of a substance (having a diameter less than $1\\text{ nm}$). An example is sulphur sol, which consists of particles containing a thousand or more $\\mathrm{S}_8$ sulphur molecules.<br><br>Macromolecular colloids are formed by large molecules (macromolecules) that have sizes in the colloidal range. Examples include naturally occurring macromolecules like starch, cellulose, and proteins, as well as man-made macromolecules like plastics and synthetic rubber.<br><br>Therefore, $\\mathrm{S}_8$ sulphur molecules form a multimolecular colloid.<br><br>Answer: $\\mathrm{S}_8$ sulphur molecules", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214100aee93fa0796ddad", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Identify dispersed phase and dispersion medium in fog respectively.", "image": null}, "options": [{"id": "nX4vQ", "text": "liquid and gas.", "image": null, "isCorrect": true}, {"id": "8emYJ", "text": "gas and liquid.", "image": null, "isCorrect": false}, {"id": "vqHWP", "text": "solid and gas.", "image": null, "isCorrect": false}, {"id": "dFHZn", "text": "gas and solid.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Fog is an example of a colloidal system known as an aerosol.<br><br>In fog, fine droplets of water are suspended in the air. Therefore, the dispersed phase is liquid (water droplets) and the dispersion medium is gas (air).<br><br>Answer: liquid and gas.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c10aee93fa0796db42", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "What type of colloid is the soap lather?", "image": null}, "options": [{"id": "59JKe", "text": "Solid sol", "image": null, "isCorrect": false}, {"id": "1dOyc", "text": "Emulsion", "image": null, "isCorrect": false}, {"id": "G76nK", "text": "Foam", "image": null, "isCorrect": true}, {"id": "7Hksj", "text": "Aerosol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Soap lather is a colloidal system in which a gas is dispersed in a liquid medium.<br><br>A colloidal system with a gas as the dispersed phase and a liquid as the dispersion medium is known as foam.<br><br>Therefore, soap lather is an example of foam.<br><br>Answer: Foam", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139d0aee93fa0796da2b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "What type of colloid is milk?", "image": null}, "options": [{"id": "bWcdr", "text": "Solid in liquid", "image": null, "isCorrect": false}, {"id": "hnc12", "text": "Liquid in solid", "image": null, "isCorrect": false}, {"id": "OtaG8", "text": "Liquid in Liquid", "image": null, "isCorrect": true}, {"id": "XcMAT", "text": "Gas in liquid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Milk is an emulsion, which is a specific type of colloidal system.<br><br>In an emulsion, both the dispersed phase and the dispersion medium are liquids. In the case of milk, liquid fat drops are dispersed in water.<br><br>Therefore, milk is a liquid in liquid type of colloid.<br><br>Answer: Liquid in Liquid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213890aee93fa0796d98c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Which from following anions has lowest coagulating power for precipitation of positive sol?", "image": null}, "options": [{"id": "Sj8DD", "text": "$\\left[\\mathrm{Fe}(\\mathrm{CN})_6\\right]^4$.", "image": null, "isCorrect": false}, {"id": "UfDfM", "text": "$\\mathrm{PO}_4^{3-}$", "image": null, "isCorrect": false}, {"id": "Os34x", "text": "$\\mathrm{SO}_4^{2-}$", "image": null, "isCorrect": false}, {"id": "bWOPr", "text": "$\\mathrm{Cl}^{-}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to the Hardy-Schulze rule, the coagulating power of an ion for a given sol is directly proportional to the magnitude of its charge (valency).<br><br>For the precipitation of a positive sol, anions are responsible for coagulation. The given anions and their charges are:<br>$\\left[\\mathrm{Fe}(\\mathrm{CN})_6\\right]^{4-}$ has a charge of $-4$<br>$\\mathrm{PO}_4^{3-}$ has a charge of $-3$<br>$\\mathrm{SO}_4^{2-}$ has a charge of $-2$<br>$\\mathrm{Cl}^{-}$ has a charge of $-1$<br><br>Since $\\mathrm{Cl}^{-}$ has the lowest magnitude of charge, it possesses the lowest coagulating power among the given options.<br><br>Answer: $\\mathrm{Cl}^{-}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213740aee93fa0796d8eb", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which from following statements is NOT true about lyophilic colloids?", "image": null}, "options": [{"id": "QvTLu", "text": "The particles of dispersed phase have greater affinity for the dispersion medium.", "image": null, "isCorrect": false}, {"id": "pLCFu", "text": "These are reversible.", "image": null, "isCorrect": false}, {"id": "fSbhn", "text": "These are self stabilized.", "image": null, "isCorrect": false}, {"id": "MQxc3", "text": "Coagulation occurs even by adding very small amount of electrolytes.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Lyophilic colloids are liquid-loving colloids where the dispersed phase has a strong affinity for the dispersion medium. This strong interaction leads to extensive solvation, making them highly stable and self-stabilized.<br><br>Because of their high stability, they are not easily coagulated. A large amount of electrolyte is required to cause their coagulation (a process known as salting out). The statement that coagulation occurs even by adding a very small amount of electrolytes is true for lyophobic colloids, not lyophilic colloids.<br><br>They are also reversible in nature, meaning if the dispersion medium is separated from the dispersed phase, the sol can be reconstituted simply by remixing.<br><br>Answer: Coagulation occurs even by adding very small amount of electrolytes.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213620aee93fa0796d85b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Which is NOT an example of macromolecular colloid?", "image": null}, "options": [{"id": "HOyPB", "text": "Protein", "image": null, "isCorrect": false}, {"id": "GEBtf", "text": "Polythene", "image": null, "isCorrect": false}, {"id": "PV3GT", "text": ". Nylon", "image": null, "isCorrect": false}, {"id": "uhJA3", "text": "Soap", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Macromolecular colloids are formed when macromolecules (polymers) having large molecular masses are dispersed in a suitable dispersion medium. Examples of naturally occurring macromolecular colloids include starch, cellulose, proteins, and enzymes. Examples of man-made macromolecular colloids include polythene, nylon, polystyrene, and synthetic rubber.<br><br>Soap, however, forms an associated colloid (micelle) when its concentration in the solution exceeds the critical micelle concentration (CMC). It is not a macromolecular colloid.<br><br>Answer: Soap", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134f0aee93fa0796d7c4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Which from following is an example of multimolecular colloids?", "image": null}, "options": [{"id": "GXQJD", "text": "Soap", "image": null, "isCorrect": false}, {"id": "NNHTh", "text": "Polythene", "image": null, "isCorrect": false}, {"id": "7ELX9", "text": "Sulfur molecule $\\left(\\mathrm{S}_8\\right)$", "image": null, "isCorrect": true}, {"id": "phYjb", "text": "Nylon", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Multimolecular colloids are formed by the aggregation of a large number of atoms or smaller molecules of a substance to form species in the colloidal size range.<br><br>Sulfur sol consists of particles containing a thousand or more of $S_8$ sulfur molecules, making it a multimolecular colloid.<br><br>Soap forms associated colloids (micelles) above a certain concentration called the critical micelle concentration.<br><br>Polythene and nylon are polymers and form macromolecular colloids.<br><br>Thus, sulfur molecule ($S_8$) is an example of a multimolecular colloid.<br><br>Answer: Sulfur molecule $\\left(\\mathrm{S}_8\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133d0aee93fa0796d738", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Identify dispersed phase and dispersion medium in cheese.\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/JkG1k1oYyO-L23CtAevZnQAZy52dB4LWCtvge8Ffhic.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "POk1Z", "text": "1", "image": null, "isCorrect": true}, {"id": "vZwUu", "text": "2", "image": null, "isCorrect": false}, {"id": "r0hQP", "text": "3", "image": null, "isCorrect": false}, {"id": "dzGWo", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Cheese is an example of a colloidal system known as a gel.<br><br>In a gel, the dispersed phase is a liquid and the dispersion medium is a solid.<br><br>From the given table, row 1 correctly represents this colloidal system with a liquid dispersed phase and a solid dispersion medium.<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262830279619d9d8a3520", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "What type of following solutions is the gasoline?", "image": null}, "options": [{"id": "5OC3X", "text": "Liquid as solute and liquid as solvent", "image": null, "isCorrect": true}, {"id": "KkRbn", "text": "Liquid as solute and solid as solvent", "image": null, "isCorrect": false}, {"id": "CGg1N", "text": "Solid as solute and liquid as solvent", "image": null, "isCorrect": false}, {"id": "rAjST", "text": "Gas as solute and liquid as solvent", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12|Ch-2|Subtopic-2.2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626c0279619d9d8a3464", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Which of the following ion has greater coagulating power for negatively charged sol?", "image": null}, "options": [{"id": "qnRJU", "text": "$\\mathrm{Fe}(\\mathrm{CN})_6^{4-}$", "image": null, "isCorrect": false}, {"id": "onGFY", "text": "$\\mathrm{PO}_4^{3-}$", "image": null, "isCorrect": false}, {"id": "cZTdN", "text": "$\\mathrm{Ba}^{2+}$", "image": null, "isCorrect": false}, {"id": "f0zQQ", "text": "$\\mathrm{Al}^{3+}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In the coagulation of negative sol, greater the positive charge of the flocculating ion added, greater is its power to cause precipitation.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d70279619d9d8a2fc0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "Which of the following is character of lyophilic colloid?", "image": null}, "options": [{"id": "QBgO8", "text": "Particles of dispersed phase have no affinity for dispersion medium.", "image": null, "isCorrect": false}, {"id": "R7MAA", "text": "Particles easily detected under ultramicroscope.", "image": null, "isCorrect": false}, {"id": "J7U7P", "text": "Addition of large amount of electrolyte causes precipitation.", "image": null, "isCorrect": true}, {"id": "9MLyQ", "text": "These are irreversible colloids.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In lyophilic colloid, the particles of dispersed phase have a great affinity for the dispersion medium. The particles are not easily visible even under ultramicroscope. Lyophilic colloids are reversible colloids.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2619f0279619d9d8a2e04", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Which is NOT an example of macro molecular colloid?", "image": null}, "options": [{"id": "y463G", "text": "Polythene", "image": null, "isCorrect": false}, {"id": "14kcC", "text": "Soap", "image": null, "isCorrect": true}, {"id": "IcOZC", "text": "Nylon", "image": null, "isCorrect": false}, {"id": "X3ZmC", "text": "Proteins", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Theory based.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "short
