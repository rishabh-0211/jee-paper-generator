 [{"id": "MB5FV", "text": "liquid in gas", "image": null, "isCorrect": true}, {"id": "0JHML", "text": "liquid in solid", "image": null, "isCorrect": false}, {"id": "U1h0Q", "text": "liquid in liquid", "image": null, "isCorrect": false}, {"id": "340qz", "text": "gas in liquid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Solution of chloroform in nitrogen is an example of liquid in gas", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f810279619d9d8a1d02", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "Which of the following is an example of hydrophobic sol?", "image": null}, "options": [{"id": "vYCFz", "text": "Rubber in benzene", "image": null, "isCorrect": false}, {"id": "AdoFE", "text": "Cellulose acetate in acetone", "image": null, "isCorrect": false}, {"id": "sTzDS", "text": "Metal sulphide", "image": null, "isCorrect": true}, {"id": "ufuJR", "text": "Starch in water", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f710279619d9d8a1c7f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "Which of the following can form colloidal sol with water?", "image": null}, "options": [{"id": "oL1Ii", "text": "Common salt", "image": null, "isCorrect": false}, {"id": "SF979", "text": "Starch", "image": null, "isCorrect": true}, {"id": "ge1ip", "text": "Glucose", "image": null, "isCorrect": false}, {"id": "13SQl", "text": "Ammonium sulphate", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "68871e7abf9280d7f9933082", "title": "Preparation and Purification of colloids", "totalQuestions": 2, "questions": [{"_id": "68871b5abf9280d7f993287f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify sequential reactions involved in Sol-Gel process .", "image": null}, "options": [{"id": "ZHyjH", "text": "Poly condensation and hydorlysis", "image": null, "isCorrect": false}, {"id": "S4BeY", "text": "Hydrolysis and poly condensation", "image": null, "isCorrect": true}, {"id": "Ynqzu", "text": "Poly condensation and oxidation", "image": null, "isCorrect": false}, {"id": "ZIhwf", "text": "Oxidation and hydrolysis", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The sol-gel process is a wet-chemical technique used for the synthesis of nanomaterials, glassy, and ceramic materials.<br><br>The process involves the conversion of monomers into a colloidal solution (sol) that acts as the precursor for an integrated network (gel).<br><br>The sequential reactions involved in the sol-gel process are:<br>1. Hydrolysis of the precursor (usually metal alkoxides) to form hydroxyl groups.<br>2. Polycondensation of the resulting hydroxyl groups to form a three-dimensional network (gel) with the elimination of water or alcohol.<br><br>Therefore, the correct sequence of reactions is hydrolysis followed by polycondensation.<br><br>Answer: Hydrolysis and poly condensation", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b02bf9280d7f9932595", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Match column I (process) with column II (application)\n$\\begin{array}{|l|l|l|l|} \\hline & \\text{Column I} & & \\text{Column II} \\\\ \\hline \\text{A)} & \\text{Dialysis} & \\text{a)} & \\text{Cleansing action of soap} \\\\ \\hline \\text{B)} & \\text{Peptization} & \\text{b)} & \\text{Coagulation} \\\\ \\hline \\text{C)} & \\text{Emulsification} & \\text{c)} & \\text{Colloidal Solution Preparation} \\\\ \\hline \\text{D)} & \\text{Electrophoresis} & \\text{d)} & \\text{Purification of colloidal solution} \\\\ \\hline \\end{array}$", "image": null}, "options": [{"id": "vPkDO", "text": "$\\mathrm{A}=\\mathrm{d}, \\mathrm{B}=\\mathrm{a}, \\mathrm{C}=\\mathrm{c}, \\mathrm{D}=\\mathrm{b}$", "image": null, "isCorrect": false}, {"id": "yAGen", "text": "$\\mathrm{A}=\\mathrm{d}, \\mathrm{B}=\\mathrm{c}, \\mathrm{C}=\\mathrm{a}, \\mathrm{D}=\\mathrm{b}$", "image": null, "isCorrect": true}, {"id": "hNXzd", "text": "$A=c, B=b, C=d, D=a$", "image": null, "isCorrect": false}, {"id": "B29oL", "text": "$A=b, B=c, C=a, D=d$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Dialysis is a process used for the purification of colloidal solutions by removing dissolved impurities using a semipermeable membrane. Thus, A matches with d.<br><br>Peptization is the process of converting a fresh precipitate into colloidal particles by adding a suitable electrolyte. It is a method for the preparation of colloidal solutions. Thus, B matches with c.<br><br>Emulsification is the process of forming an emulsion. The cleansing action of soap is based on the emulsification of grease and dirt. Thus, C matches with a.<br><br>Electrophoresis involves the movement of colloidal particles under the influence of an electric field. When these particles reach the oppositely charged electrode, they lose their charge and undergo coagulation. Thus, D matches with b.<br><br>The correct matching is A=d, B=c, C=a, D=b.<br><br>Answer: $\\mathrm{A}=\\mathrm{d}, \\mathrm{B}=\\mathrm{c}, \\mathrm{C}=\\mathrm{a}, \\mathrm{D}=\\mathrm{b}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a2632d0279619d9d8a3cb1", "title": "Properties of colloidal solution", "totalQuestions": 25, "questions": [{"_id": "6a44d3268c30a4553e1be0b4", "type": "singleCorrect", "question": {"text": "Which from following anions has greater power for coagulation of positive sol?", "image": null}, "options": [{"id": "GjABu", "label": "A", "text": "$\\text{Cl}^-$", "isCorrect": false, "image": null}, {"id": "3NSmB", "label": "B", "text": "$[\\text{Fe(CN)}_6]^{4-}$", "isCorrect": true, "image": null}, {"id": "psGsg", "label": "C", "text": "$\\text{PO}_4^{2-}$", "isCorrect": false, "image": null}, {"id": "3JqaD", "label": "D", "text": "$\\text{SO}_4^{2-}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the Hardy-Schulze rule, the coagulating power of an ion is directly proportional to the magnitude of its charge (valency). For the coagulation of a positive sol, an anion is required.<br><br>The given anions and their charge magnitudes are:<br>$\\text{Cl}^-$ : $1$<br>$\\text{SO}_4^{2-}$ : $2$<br>$\\text{PO}_4^{3-}$ (given as $\\text{PO}_4^{2-}$ in options) : $3$<br>$[\\text{Fe(CN)}_6]^{4-}$ : $4$<br><br>Since $[\\text{Fe(CN)}_6]^{4-}$ has the highest negative charge, it possesses the maximum coagulating power among the given options.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3348c30a4553e1be149", "type": "singleCorrect", "question": {"text": "Which of the following properties is responsible for the development of colour to the colloids?", "image": null}, "options": [{"id": "VCgtH", "label": "A", "text": "Tyndall effect", "isCorrect": true, "image": null}, {"id": "9xUp9", "label": "B", "text": "Brownian motion", "isCorrect": false, "image": null}, {"id": "JIuCi", "label": "C", "text": "Electrophoresis", "isCorrect": false, "image": null}, {"id": "FZnKh", "label": "D", "text": "Electroosmosis", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The colour of a colloidal solution depends on the wavelength of light scattered by the dispersed particles.<br><br>The scattering of light by colloidal particles is known as the Tyndall effect.<br><br>Therefore, the Tyndall effect is responsible for the development of colour in colloids.<br><br>Answer: Tyndall effect", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e08c30a4553e1bddc5", "type": "singleCorrect", "question": {"text": "Which of the following exhibits the minimum coagulating power for precipitating of positively charged ferric oxide sol ?", "image": null}, "options": [{"id": "FrJ6H", "label": "A", "text": "$\\text{KNO}_3$", "isCorrect": true, "image": null}, {"id": "XS4DZ", "label": "B", "text": "$\\text{K}_2\\text{SO}_4$", "isCorrect": false, "image": null}, {"id": "WK18A", "label": "C", "text": "$\\text{K}_3\\text{PO}_4$", "isCorrect": false, "image": null}, {"id": "3XFqn", "label": "D", "text": "$\\text{K}_4\\text{Fe(CN)}_6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the Hardy-Schulze rule, the coagulating power of an ion is directly proportional to the magnitude of its charge.<br><br>Since the ferric oxide sol is positively charged, the anions of the added electrolyte are responsible for its coagulation.<br><br>The anions provided by the given electrolytes are:<br>$\\text{KNO}_3 \\rightarrow \\text{NO}_3^{-}$ (charge magnitude = $1$)<br>$\\text{K}_2\\text{SO}_4 \\rightarrow \\text{SO}_4^{2-}$ (charge magnitude = $2$)<br>$\\text{K}_3\\text{PO}_4 \\rightarrow \\text{PO}_4^{3-}$ (charge magnitude = $3$)<br>$\\text{K}_4[\\text{Fe(CN)}_6] \\rightarrow [\\text{Fe(CN)}_6]^{4-}$ (charge magnitude = $4$)<br><br>The order of coagulating power is $[\\text{Fe(CN)}_6]^{4-} > \\text{PO}_4^{3-} > \\text{SO}_4^{2-} > \\text{NO}_3^{-}$.<br><br>Thus, $\\text{KNO}_3$ exhibits the minimum coagulating power.<br><br>Answer: $\\text{KNO}_3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3188c30a4553e1be01d", "type": "singleCorrect", "question": {"text": "Match <strong>List I</strong> with <strong>List II</strong><br><table style=\"border: 1px solid black; border-collapse: collapse; width: auto;\"><tr><th style=\"border: 1px solid black; padding: 10px;\">List I</th><th style=\"border: 1px solid black; padding: 10px;\">List II</th></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(A). Brownian Motion</td><td style=\"border: 1px solid black; padding: 10px;\">(I). Removal of impurities from the colloidal sols using a semipermeable membrane.</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(B). Tyndall Effect</td><td style=\"border: 1px solid black; padding: 10px;\">(II). Movement of colloidal particles under the influence of an electric field.</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(C). Electrophoresis</td><td style=\"border: 1px solid black; padding: 10px;\">(III). Random movement of colloidal particles due to kinetic energy.</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(D). Dialysis</td><td style=\"border: 1px solid black; padding: 10px;\">(IV). Scattering of light by colloidal particles</td></tr></table>Choose the <strong>correct</strong> answer from the options given below:", "image": null}, "options": [{"id": "xQoLZ", "label": "A", "text": "(A) - (I), (B) - (II), (C) - (III), (D) - (IV)", "isCorrect": false, "image": null}, {"id": "T2Ehl", "label": "B", "text": "(A) - (II), (B) - (IV), (C) - (I), (D) - (III)", "isCorrect": false, "image": null}, {"id": "hKwbF", "label": "C", "text": "(A) - (I), (B) - (II), (C) - (IV), (D) - (III)", "isCorrect": false, "image": null}, {"id": "LSueA", "label": "D", "text": "(A) - (III), (B) - (IV), (C) - (II), (D) - (I)", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Brownian motion is the continuous random zig-zag movement of colloidal particles due to unequal bombardment by the molecules of the dispersion medium. Thus, (A) $\\rightarrow$ (III).<br><br>Tyndall effect is the scattering of light by colloidal particles, making the path of light visible. Thus, (B) $\\rightarrow$ (IV).<br><br>Electrophoresis is the movement of colloidal particles towards oppositely charged electrodes under the influence of an applied electric field. Thus, (C) $\\rightarrow$ (II).<br><br>Dialysis is the process of removing dissolved impurities from a colloidal sol using a semipermeable membrane. Thus, (D) $\\rightarrow$ (I).<br><br>The correct matching is (A) - (III), (B) - (IV), (C) - (II), (D) - (I).<br><br>Answer: (A) - (III), (B) - (IV), (C) - (II), (D) - (I)", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871beebf9280d7f9932dbe", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the negatively charged sol from following.", "image": null}, "options": [{"id": "uyYuB", "text": "Eosin", "image": null, "isCorrect": true}, {"id": "RdrVF", "text": "Titanium oxide", "image": null, "isCorrect": false}, {"id": "HYNJX", "text": "Methylene blue", "image": null, "isCorrect": false}, {"id": "fuZlR", "text": "Haemoglobin", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Colloidal sols are classified into positively and negatively charged sols based on the nature of the charge on the colloidal particles.<br><br>Positively charged sols include hydrated metallic oxides, basic dyes (such as methylene blue), haemoglobin, and oxides like titanium dioxide ($\\text{TiO}_2$).<br><br>Negatively charged sols include metal sols (like copper, silver, gold), metallic sulphides (like $\\text{As}_2\\text{S}_3$), acid dyes (such as eosin and congo red), and natural sols like starch, gum, and clay.<br><br>Therefore, eosin forms a negatively charged sol.<br><br>Answer: Eosin", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7dbf9280d7f99329b2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following ion exihibits maximum power of coagulation for positively charged sol?", "image": null}, "options": [{"id": "dvIbF", "text": "$\\mathrm{So}_4^{2-}$", "image": null, "isCorrect": false}, {"id": "Acjsb", "text": "$\\mathrm{Cl}^{-}$", "image": null, "isCorrect": false}, {"id": "V6YZW", "text": "$\\mathrm{PO}_4^{3-}$", "image": null, "isCorrect": false}, {"id": "Q8ibx", "text": "$\\left[\\mathrm{Fe}(\\mathrm{CN})_6\\right]^{4-}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to the Hardy-Schulze rule, the coagulating power of an ion for a given sol is directly proportional to the magnitude of the charge on the effective ion (flocculating ion).<br><br>For a positively charged sol, anions act as the coagulating ions. The greater the negative charge on the anion, the higher its coagulating power.<br><br>The charges on the given anions are:<br>$\\mathrm{SO}_4^{2-}$ has a charge of $-2$<br>$\\mathrm{Cl}^{-}$ has a charge of $-1$<br>$\\mathrm{PO}_4^{3-}$ has a charge of $-3$<br>$\\left[\\mathrm{Fe}(\\mathrm{CN})_6\\right]^{4-}$ has a charge of $-4$<br><br>Since $\\left[\\mathrm{Fe}(\\mathrm{CN})_6\\right]^{4-}$ has the maximum negative charge, it exhibits the maximum power of coagulation for a positively charged sol.<br><br>Answer: $\\left[\\mathrm{Fe}(\\mathrm{CN})_6\\right]^{4-}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6dbf9280d7f993291b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following process does NOT results in coagulation?", "image": null}, "options": [{"id": "rhs1N", "text": "electrophoresis", "image": null, "isCorrect": false}, {"id": "YqNyQ", "text": "by adding excess solvent", "image": null, "isCorrect": true}, {"id": "Eebh9", "text": "by mixing two oppositely charged sols", "image": null, "isCorrect": false}, {"id": "5JQHL", "text": "by boiling", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Coagulation of a colloidal sol can be achieved by methods that neutralize the charge on the colloidal particles or disturb their stability.<br><br>Electrophoresis causes coagulation because colloidal particles move towards the oppositely charged electrode, lose their charge, and precipitate.<br><br>Boiling causes coagulation because increased collisions between particles and the dispersion medium disturb the adsorbed ion layer, reducing the charge on the particles.<br><br>Mixing two oppositely charged sols results in mutual coagulation as they neutralize each other's charge.<br><br>Adding excess solvent merely dilutes the sol and does not neutralize the charge or cause the particles to aggregate. Therefore, it does not result in coagulation.<br><br>Answer: by adding excess solvent", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b48bf9280d7f99327cf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the property of colloidal solutions so that colloidal particles move freely towards respective electrodes under an applied electrical potential.", "image": null}, "options": [{"id": "adCFY", "text": "Brownian motion", "image": null, "isCorrect": false}, {"id": "C0hhu", "text": "Electrophoresis", "image": null, "isCorrect": true}, {"id": "GJ0XP", "text": "Electroosmosis", "image": null, "isCorrect": false}, {"id": "tKQ6F", "text": "Dialysis", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The movement of colloidal particles towards the respective electrodes under the influence of an applied electrical potential is called electrophoresis.<br><br>Brownian motion is the continuous zig-zag motion of colloidal particles.<br><br>Electroosmosis is the movement of the dispersion medium under an applied electric field when the particles are prevented from moving.<br><br>Dialysis is a method of purification of colloidal solutions.<br><br>Answer: Electrophoresis", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b27bf9280d7f99326bd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is not negatively charged sol?", "image": null}, "options": [{"id": "IhXJr", "text": "$\\mathrm{As}_2 \\mathrm{~S}_3$", "image": null, "isCorrect": false}, {"id": "cJu2v", "text": "Haemoglobin", "image": null, "isCorrect": true}, {"id": "EXLKV", "text": "Clay", "image": null, "isCorrect": false}, {"id": "YXwOe", "text": "Cango Red", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the classification of colloidal sols based on the charge of the colloidal particles:<br><br>Negatively charged sols include metallic sulfides (like $\\mathrm{As}_2\\mathrm{S}_3$), acid dyes (like Congo red), and naturally occurring substances like clay, starch, and charcoal.<br><br>Positively charged sols include hydrated metallic oxides, basic dyes, and haemoglobin (blood).<br><br>Therefore, haemoglobin is a positively charged sol and not a negatively charged sol.<br><br>Answer: Haemoglobin", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214490aee93fa0796df71", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "What is the number of electrons present in antibonding orbitals of \\(\\mathrm{N}_2\\) molecule according to molecular orbital theory?", "image": null}, "options": [{"id": "7nMu6", "text": "14", "image": null, "isCorrect": false}, {"id": "nl2bu", "text": "04", "image": null, "isCorrect": true}, {"id": "A5It3", "text": "10", "image": null, "isCorrect": false}, {"id": "OodVJ", "text": "06", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The total number of electrons in the $N_2$ molecule is $7 + 7 = 14$.<br><br>The molecular orbital electronic configuration of $N_2$ is:<br><br>$\\sigma_{1s}^{2} \\sigma^{*}_{1s}^{2} \\sigma_{2s}^{2} \\sigma^{*}_{2s}^{2} \\pi_{2p_x}^{2} \\pi_{2p_y}^{2} \\sigma_{2p_z}^{2}$<br><br>The antibonding molecular orbitals are denoted by an asterisk ($^{*}$).<br><br>The electrons present in antibonding orbitals are in $\\sigma^{*}_{1s}$ and $\\sigma^{*}_{2s}$.<br><br>Number of electrons in antibonding orbitals = $2 + 2 = 4$.<br><br>Answer: 04", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213af0aee93fa0796dab8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Which from following anions has maximum coagulating power for precipitation of positive sol?", "image": null}, "options": [{"id": "mfShR", "text": "$\\left[\\mathrm{Fe}(\\mathrm{CN})_6\\right]^{4-}$", "image": null, "isCorrect": true}, {"id": "rcOnE", "text": "$\\mathrm{Cl}^{-}$", "image": null, "isCorrect": false}, {"id": "NKufA", "text": "$\\quad \\mathrm{SO}_4^{-}$", "image": null, "isCorrect": false}, {"id": "7oAzw", "text": "$\\mathrm{PO}_4^{--}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the Hardy-Schulze rule, the coagulating power of an ion is directly proportional to the magnitude of its charge (valency). For the precipitation of a positive sol, an anion is required as the coagulating ion.<br><br>The charges on the given anions are:<br>$\\left[\\mathrm{Fe}(\\mathrm{CN})_6\\right]^{4-}$ has a charge of $-4$<br>$\\mathrm{Cl}^{-}$ has a charge of $-1$<br>$\\mathrm{SO}_4^{2-}$ has a charge of $-2$<br>$\\mathrm{PO}_4^{3-}$ has a charge of $-3$<br><br>Since $\\left[\\mathrm{Fe}(\\mathrm{CN})_6\\right]^{4-}$ has the maximum negative charge, it possesses the maximum coagulating power for a positive sol.<br><br>Answer: $\\left[\\mathrm{Fe}(\\mathrm{CN})_6\\right]^{4-}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262100279619d9d8a3180", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "Which of the following is positively charged sol?", "image": null}, "options": [{"id": "81E7J", "text": "Haemoglobin in blood", "image": null, "isCorrect": true}, {"id": "kVOHx", "text": "Sol of starch", "image": null, "isCorrect": false}, {"id": "WPMaf", "text": "Gelatin", "image": null, "isCorrect": false}, {"id": "4esFY", "text": "'Ag' sol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Haemoglobin in blood is a positively charged sol whereas sol of starch, gelatin sol and silver sol are negatively charged sols.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261400279619d9d8a2b0a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 ( orrectValue": null, "solution": {"text": "Highest valency $=$ Highest precipitating power.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25efb0279619d9d8a18d4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "The precipitation power of an electrolyte increase with", "image": null}, "options": [{"id": "OyEca", "text": "Rise in temperature", "image": null, "isCorrect": false}, {"id": "xKSYh", "text": "Atomic radii", "image": null, "isCorrect": false}, {"id": "PuFAa", "text": "Ionic radii", "image": null, "isCorrect": false}, {"id": "n08IO", "text": "Charge of an ion", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The precipitation power of an electrolyte increases with charge of an ion. It can be explained on the basis of Hardy – Schulze rule. Greater the valence of the flocculating ion added, the greater is its power to cause precipitation.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e410279619d9d8a12f7", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Blue colour of water in sea is due to", "image": null}, "options": [{"id": "xENsF", "text": "refraction of blue light by impurities", "image": null, "isCorrect": false}, {"id": "ZGeZW", "text": "refraction blue sky by water", "image": null, "isCorrect": false}, {"id": "BlBXl", "text": "scattering of light by water", "image": null, "isCorrect": true}, {"id": "YC4Ru", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The colour of a colloidal solution depends on the wavelength of the light scattered by the dispersed particles, which in turn depends on the size and the nature of particle. The colour of water in sea is blue due to the scattering of light by water.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "65a2632d0279619d9d8a3cb4", "title": "Emulsions and Gels", "totalQuestions": 10, "questions": [{"_id": "6abb889f15a9fc0fc8c14575", "type": "singleCorrect", "question": {"text": "Which of the following statements is NOT true regarding oil in water emulsion?", "image": null}, "options": [{"id": "gJrgI", "label": "A", "text": "The oil is dispersed phase and water is dispersion medium.", "isCorrect": false, "image": null}, {"id": "KZkfy", "label": "B", "text": "If water is added, it will be miscible with the emulsion.", "isCorrect": false, "image": null}, {"id": "RudGe", "label": "C", "text": "The addition of a small amount of an electrolyte has no effect on conducting power.", "isCorrect": true, "image": null}, {"id": "VTUVn", "label": "D", "text": "Water is a continuous phase.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In an oil-in-water emulsion, oil is the dispersed phase and water is the dispersion medium, which acts as the continuous phase.<br><br>Since water is the continuous phase, the emulsion can be diluted with water, making it miscible.<br><br>Because the continuous phase is aqueous, the emulsion can conduct electricity. The addition of a small amount of an electrolyte will increase the conducting power of the emulsion.<br><br>Therefore, the statement that the addition of a small amount of an electrolyte has no effect on conducting power is incorrect.<br><br>Answer: The addition of a small amount of an electrolyte has no effect on conducting power.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889015a9fc0fc8c144df", "type": "singleCorrect", "question": {"text": "Which of the following properties is NOT true regarding emulsion?", "image": null}, "options": [{"id": "dMUPE", "label": "A", "text": "The droplets in emulsions are often negatively charged and can be precipitated by electrolysis.", "isCorrect": false, "image": null}, {"id": "9nP9N", "label": "B", "text": "Emulsions exhibit Brownian movement and Tyndall effect.", "isCorrect": false, "image": null}, {"id": "uBvwe", "label": "C", "text": "The two liquids in emulsion can not be seperated by heating, freezing etc.", "isCorrect": true, "image": null}, {"id": "xpLsL", "label": "D", "text": "The emulsions are stabilised by addition of third component called emulsifying agent.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Emulsions can be broken into their constituent liquids by physical methods such as heating, freezing, centrifuging, etc. This process is known as demulsification. Therefore, the statement that the two liquids in an emulsion cannot be separated by heating, freezing, etc., is incorrect.<br><br>The other statements are true:<br>1. Emulsions are colloidal systems, so they exhibit the Tyndall effect and Brownian movement.<br>2. Emulsions are thermodynamically unstable and are stabilised by the addition of a third component called an emulsifying agent.<br>3. The dispersed droplets in emulsions are often negatively charged and can be precipitated (coagulated) by the addition of electrolytes.<br><br>Answer: The two liquids in emulsion can not be seperated by heating, freezing etc.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c68c30a4553e1bdca9", "type": "singleCorrect", "question": {"text": "Which from following is NOT an example of oil in water emulsion?", "image": null}, "options": [{"id": "waRu9", "label": "A", "text": "Paint", "isCorrect": false, "image": null}, {"id": "NjgCP", "label": "B", "text": "Butter", "isCorrect": true, "image": null}, {"id": "Zkynv", "label": "C", "text": "Vanishing cream", "isCorrect": false, "image": null}, {"id": "ZTJEa", "label": "D", "text": "Milk", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Emulsions are broadly classified into two types based on the dispersed phase and dispersion medium:<br><br>1. Oil in water (O/W) emulsion: In this type, oil acts as the dispersed phase and water acts as the dispersion medium. Examples include milk, vanishing cream, and paint.<br><br>2. Water in oil (W/O) emulsion: In this type, water acts as the dispersed phase and oil acts as the dispersion medium. Examples include butter, cold cream, and cod liver oil.<br><br>Since butter is a water in oil (W/O) emulsion, it is not an example of an oil in water emulsion.<br><br>Answer: Butter", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29a8c30a4553e1bdad7", "type": "singleCorrect", "question": {"text": "Which of the following is a water-in-oil type of emulsion?", "image": null}, "options": [{"id": "N9N1W", "label": "A", "text": "Milk", "isCorrect": false, "image": null}, {"id": "x3d3e", "label": "B", "text": "Vanishing Cream", "isCorrect": false, "image": null}, {"id": "KXhCQ", "label": "C", "text": "Paint", "isCorrect": false, "image": null}, {"id": "td1Os", "label": "D", "text": "Butter", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Emulsions are colloidal systems in which both the dispersed phase and the dispersion medium are liquids.<br><br>In a water-in-oil (W/O) emulsion, water is the dispersed phase and oil is the dispersion medium.<br><br>Butter is an example of a water-in-oil emulsion, where water is dispersed in fat (oil).<br><br>Milk and vanishing cream are examples of oil-in-water (O/W) emulsions, where oil is dispersed in water.<br><br>Answer: Butter", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f90aee93fa0796dcfb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Which among the following is an example of emulsion?", "image": null}, "options": [{"id": "j8peM", "text": "Foam rubber", "image": null, "isCorrect": false}, {"id": "6Jf2z", "text": "Froth", "image": null, "isCorrect": false}, {"id": "Bww3t", "text": "Gelatin", "image": null, "isCorrect": false}, {"id": "agI49", "text": "Hair cream", "image": null, "isCorrect": true}], "correctValue": null, "solutio $1-100$ nm).<br><br>Zero-dimensional ($0$D) nanomaterials have all three dimensions in the nanoscale. Examples include nanoparticles, quantum dots, and fullerenes.<br><br>One-dimensional ($1$D) nanomaterials have two dimensions in the nanoscale. Examples include nanotubes and nanowires.<br><br>Two-dimensional ($2$D) nanomaterials have one dimension in the nanoscale. Examples include graphene and nanofilms.<br><br>Since nanoparticles have all three dimensions in the nanoscale, they are classified as zero-dimensional.<br><br>Answer: zero dimensional", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3638c30a4553e1be336", "type": "singleCorrect", "question": {"text": "Which of the following nanomaterial has all the three dimensions $< 100$ nm?", "image": null}, "options": [{"id": "o7aSK", "label": "A", "text": "Nanotubes", "isCorrect": false, "image": null}, {"id": "eeY05", "label": "B", "text": "Nanowires", "isCorrect": false, "image": null}, {"id": "uDzZm", "label": "C", "text": "Nanoshells", "isCorrect": true, "image": null}, {"id": "CoAZM", "label": "D", "text": "Thin films", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Nanomaterials are classified based on the number of dimensions that are in the nanoscale range ($1$ to $100$ nm).<br><br>Zero-dimensional (0D) nanomaterials have all three dimensions in the nanoscale ($< 100$ nm). Examples include nanoparticles, quantum dots, and nanoshells.<br><br>One-dimensional (1D) nanomaterials have two dimensions in the nanoscale and one dimension outside the nanoscale. Examples include nanotubes and nanowires.<br><br>Two-dimensional (2D) nanomaterials have one dimension in the nanoscale and two dimensions outside the nanoscale. Examples include thin films and coatings.<br><br>Since nanoshells are zero-dimensional nanomaterials, they have all three dimensions less than $100$ nm.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871beebf9280d7f9932dc0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following nanomaterial has all three dimensions less than 100 nm ?", "image": null}, "options": [{"id": "KTljW", "text": "Nanoshells", "image": null, "isCorrect": true}, {"id": "v4QuZ", "text": "Nanotubes", "image": null, "isCorrect": false}, {"id": "VovKF", "text": "Thin films", "image": null, "isCorrect": false}, {"id": "XEMjX", "text": "Fibres", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nanomaterials are classified based on the number of dimensions that are not confined to the nanoscale range (less than $100$ nm).<br><br>Zero-dimensional (0D) nanomaterials have all three dimensions in the nanoscale (less than $100$ nm). Examples include nanoparticles, quantum dots, and nanoshells.<br><br>One-dimensional (1D) nanomaterials have two dimensions in the nanoscale. Examples include nanotubes, nanowires, and nanofibres.<br><br>Two-dimensional (2D) nanomaterials have one dimension in the nanoscale. Examples include thin films, layers, and coatings.<br><br>Since nanoshells are zero-dimensional nanomaterials, they have all three dimensions less than $100$ nm.<br><br>Answer: Nanoshells", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdfbf9280d7f9932d2c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which instrument is used for determination of particle size?", "image": null}, "options": [{"id": "PRbdG", "text": "SEM", "image": null, "isCorrect": false}, {"id": "ZDNJm", "text": "TEM", "image": null, "isCorrect": true}, {"id": "jbN4t", "text": "FTIR", "image": null, "isCorrect": false}, {"id": "WYBne", "text": "UV visible spectroscopy", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the analytical techniques used for characterizing nanomaterials:<br><br>Scanning Electron Microscope (SEM) is used to determine the structure and morphology of the particles.<br><br>Transmission Electron Microscope (TEM) is specifically used to determine the particle size.<br><br>Fourier Transform Infrared Spectroscopy (FTIR) is used to determine the absorption of functional groups and binding nature.<br><br>UV-visible spectroscopy is used for the preliminary assessment of optical properties.<br><br>Therefore, TEM is the instrument used for the determination of particle size.<br><br>Answer: TEM", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcfbf9280d7f9932ca1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the technique used to know binding nature of nanomaterials?", "image": null}, "options": [{"id": "OO0Z7", "text": "SEM", "image": null, "isCorrect": false}, {"id": "MVf4f", "text": "TEM", "image": null, "isCorrect": false}, {"id": "xDz57", "text": "XRD", "image": null, "isCorrect": false}, {"id": "UL5iI", "text": "FTIR", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to the analytical techniques for the characterization of nanomaterials, Fourier Transform Infrared Spectroscopy (FTIR) is used to determine the absorption of functional groups and the binding nature of the nanomaterials.<br><br>SEM (Scanning Electron Microscope) is used for studying surface morphology.<br><br>TEM (Transmission Electron Microscope) is used for determining particle size and internal structure.<br><br>XRD (X-ray Diffraction) is used for determining crystal structure and phase.<br><br>Answer: FTIR", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627f0279619d9d8a3504", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Which from following is an example of two dimensional nanostructures?", "image": null}, "options": [{"id": "5CkRm", "text": "Nanoparticles", "image": null, "isCorrect": false}, {"id": "CU7xK", "text": "Thin Films", "image": null, "isCorrect": true}, {"id": "VQM11", "text": "Qauntum dots", "image": null, "isCorrect": false}, {"id": "tdiFQ", "text": "Nanowires", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12|Ch-16|Subtopic-16.5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625b0279619d9d8a33e1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023- s", "image": null, "isCorrect": true}, {"id": "yhIXx", "text": "Microcapsules", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "'One dimension less than $100 \\mathrm{~nm}$ ' implies that the nanomaterial is a two-dimensional nanostructure. Among the given options, thin films are two-dimensional nanostructures.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262220279619d9d8a3212", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Identify the example of zero-dimensional nanostructure from following.", "image": null}, "options": [{"id": "dPaz1", "text": "Nanotubes", "image": null, "isCorrect": false}, {"id": "KiAq0", "text": "Fibres", "image": null, "isCorrect": false}, {"id": "TKKqy", "text": "Thin films", "image": null, "isCorrect": false}, {"id": "X79wV", "text": "Quantum dots", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "\\begin{array}{|l|l|l|} \\hline Std.12 & Ch-16 & Subtopic-16.5 \\\\ \\hline \\end{array}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261670279619d9d8a2c46", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "Which among following is a zero-dimensional nanostructure?", "image": null}, "options": [{"id": "VlSmT", "text": "Nano rods", "image": null, "isCorrect": false}, {"id": "v3P70", "text": "Nanaowires", "image": null, "isCorrect": false}, {"id": "gyt4e", "text": "Nanoparticles", "image": null, "isCorrect": true}, {"id": "Vw1Ue", "text": "Thin flims", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nanoparticles is a zero-dimensional nanostructure.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260630279619d9d8a2415", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "Which among the following is NOT an example of one-dimensional nanostructure?", "image": null}, "options": [{"id": "oDz7n", "text": "Nano shells", "image": null, "isCorrect": true}, {"id": "rkrfM", "text": "Nanowires", "image": null, "isCorrect": false}, {"id": "gKTwU", "text": "Nanutubes", "image": null, "isCorrect": false}, {"id": "S6C8L", "text": "Fibres", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nano shells is not an example of one-dimensional nanostructure.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
