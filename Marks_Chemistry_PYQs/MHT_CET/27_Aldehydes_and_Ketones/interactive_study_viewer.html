[{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "Carbolic acid is oxidised by acidified sodium dichromate to give", "image": null}, "options": [{"id": "u2n0f", "text": "Acetone", "image": null, "isCorrect": false}, {"id": "ZkcAv", "text": "Ethyl methyl ketone", "image": null, "isCorrect": false}, {"id": "aWVrN", "text": "Benzoquinone", "image": null, "isCorrect": true}, {"id": "nEzMb", "text": "Anthraquinone", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Carbolic acid (also known as phenol) is oxidised by acidified sodium dichromate to given benzoquinone. IN presence of air, phenols are slowly oxidised to dark coloured mixtures containing quinones. <br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/f107a178-6702-46dc-b683-a958707a1059.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7b0279619d9d8a14c7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "Ethyl methyl ketone is obtained by heating calcium salts of", "image": null}, "options": [{"id": "cJyOk", "text": "formic acid $+$ propionic acid", "image": null, "isCorrect": false}, {"id": "Va5yU", "text": "acetic acid + propionic acid", "image": null, "isCorrect": true}, {"id": "raDO7", "text": "acetic acid only", "image": null, "isCorrect": false}, {"id": "21KZG", "text": "acetic acid + methanoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ethyl methyl ketone is an unsymmetric ketone, so two different acids (in the form of calcium salt) are used. The structure of ethyl methyl ketone is\n$$\n\\mathrm{C}_{2} \\mathrm{H}_{5} \\mathrm{COCH}_{3}\n$$\nThe structure shows the presence of 4 carbon atoms, thus the calcium salts must be of acetic acid and propionic acid to form $\\mathrm{C}_{2} \\mathrm{H}_{5} \\mathrm{COCH}_{3}$.\n$$\n\\begin{array}{r}\n\\left(\\mathrm{C}_{2} \\mathrm{H}_{5} \\mathrm{COO}\\right)_{2} \\mathrm{Ca}+\\left(\\mathrm{CH}_{3} \\mathrm{COO}\\right)_{2} \\mathrm{Ca} \\stackrel{\\text { Distill }}{\\longrightarrow} \\\\\n\\mathrm{C}_{2} \\mathrm{H}_{5} \\mathrm{COCH}_{3}+\\mathrm{CaCO}_{3}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e6b0279619d9d8a1443", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "Pentan-3-one is not obtained from", "image": null}, "options": [{"id": "9Fr1G", "text": "2, 2-dichloro pentane", "image": null, "isCorrect": true}, {"id": "VuAM0", "text": "3 , 3 -dichloro pentane", "image": null, "isCorrect": false}, {"id": "kPHQG", "text": "pentan-3-ol", "image": null, "isCorrect": false}, {"id": "zr5KX", "text": "pent-2-yne", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "2, 2-dichloropentane gives pentan-2-one, not pentan-3-one as\n <img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/EnWlBSi0kVjy2nss2gb8mElOSZlcKFBfy3yHZYQgMqQ.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263350279619d9d8a3d05", "title": "Method of preparation for Aldehydes", "totalQuestions": 40, "questions": [{"_id": "6abb88b315a9fc0fc8c1462f", "type": "singleCorrect", "question": {"text": "Which of the following compounds is used to prepare aliphatic aldehydes by Rosenmund reduction?", "image": null}, "options": [{"id": "rTbPH", "label": "A", "text": "$R-\\text{COOH}$", "isCorrect": false, "image": null}, {"id": "xTUem", "label": "B", "text": "$R-\\text{CN}$", "isCorrect": false, "image": null}, {"id": "5lMzT", "label": "C", "text": "$R-\\text{COCl}$", "isCorrect": true, "image": null}, {"id": "GBm9L", "label": "D", "text": "$R-O-R$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Rosenmund reduction is the catalytic hydrogenation of an acyl chloride (acid chloride) to an aldehyde.<br><br>The reaction is given by:<br>$R-\\text{COCl} + H_2 \\xrightarrow{Pd/BaSO_4} R-\\text{CHO} + HCl$<br><br>Thus, $R-\\text{COCl}$ is used to prepare aliphatic aldehydes by Rosenmund reduction.<br><br>Answer: $R-\\text{COCl}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3548c30a4553e1be299", "type": "singleCorrect", "question": {"text": "Which of the following reaction represents Rosenmund reduction ?", "image": null}, "options": [{"id": "18qeT", "label": "A", "text": "$\\text{R}-\\text{CO}-\\text{Cl} \\xrightarrow[\\large{\\text{Pd}-\\text{BaSO}_4}]{\\large{\\text{H}_2}} \\text{R}-\\text{CHO} + \\text{HCl}$", "isCorrect": true, "image": null}, {"id": "YLEq8", "label": "B", "text": "$\\text{R}-\\text{CN} \\xrightarrow[\\large{\\text{H}_3\\text{O}^+}]{\\large{\\text{SnCl}_2,\\text{HCl}}} \\text{R}-\\text{CHO} + \\text{NH}_4\\text{Cl}$", "isCorrect": false, "image": null}, {"id": "5AICx", "label": "C", "text": "$\\text{R}-\\text{CHO} \\xrightarrow[\\large{\\Delta}]{\\large{\\text{Zn}-\\text{Hg conc.HCl}}} \\text{R}-\\text{CH}_3 + \\text{H}_2\\text{O}$", "isCorrect": false, "image": null}, {"id": "n1kSb", "label": "D", "text": "$\\text{R}-\\text{CO}-\\text{R} \\xrightarrow[\\large{\\text{ii) KOH, HO}-\\text{CH}_2-\\text{CH}_2-\\text{OH},\\ \\Delta}]{\\large{\\text{i) H}_2\\text{N}-\\text{NH}_2}} \\text{R}-\\text{CH}_2-\\text{R}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Rosenmund reduction is the catalytic hydrogenation of an acid chloride to an aldehyde.<br><br>The catalyst used is palladium on barium sulfate ($\\text{Pd}-\\text{BaSO}_4$), which is partially poisoned to prevent further reduction of the aldehyde to an alcohol.<br><br>The reaction is given by:<br>$\\text{R}-\\text{CO}-\\text{Cl} \\xrightarrow[\\text{Pd}-\\text{BaSO}_4]{\\text{H}_2} \\text{R}-\\text{CHO} + \\text{HCl}$<br><br>The other reactions are:<br>Stephen reaction: Reduction of nitriles to aldehydes using $\\text{SnCl}_2/\\text{HCl}$ followed by hydrolysis.<br>Clemmensen reduction: Reduction of aldehydes or ketones to alkanes using $\\text{Zn}-\\text{Hg}$ and conc. $\\text{HCl}$.<br>Wolff-Kishner reduction: Reduction of aldehydes or ketones to alkanes using hydrazine and a strong base like $\\text{KOH}$ in ethylene glycol.<br><br>Answer: $\\text{R}-\\text{CO}-\\text{Cl} \\xrightarrow[\\large{\\text{Pd}-\\text{BaSO}_4}]{\\large{\\text{H}_2}} \\text{R}-\\text{CHO} + \\text{HCl}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30c8c30a4553e1bdf97", "type": "singleCorrect", "question": {"text": "What is the product formed on Rosenmund reduction of benzoyl chloride ?", "image": null}, "options": [{"id": "tPMMG", "label": "A", "text": "Benzene", "isCorrect": false, "image": null}, {"id": "0OWw1", "label": "B", "text": "Benzyl alcohol", "isCorrect": false, "image": null}, {"id": "SXHm7", "label": "C", "text": "Benzaldehyde", "isCorrect": true, "image": null}, {"id": "rWPK5", "label": "D", "text": "Chlorobenzene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Rosenmund reduction is the catalytic hydrogenation of an acid chloride to an aldehyde.<br><br>The reagent used is hydrogen gas in the presence of a palladium catalyst supported on barium sulfate ($H_2 / Pd-BaSO_4$).<br><br>When benzoyl chloride ($C_6H_5COCl$) is subjected to Rosenmund reduction, it is reduced to benzaldehyde ($C_6H_5CHO$).<br><br>The reaction is:<br>$C_6H_5COCl + H_2 \\xrightarrow{Pd/BaSO_4} C_6H_5CHO + HCl$<br><br>Therefore, the product formed is benzaldehyde.<br><br>Answer: Benzaldehyde", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f08c30a4553e1bde73", "type": "singleCorrect", "question": {"text": "Identify the 'product' in the following reaction.<br>Pent - 3 - enenitrile $\\xrightarrow[\\large{\\text{H}_3\\text{O}^+}]{\\large{\\text{Al H (i-Bu)}_2}}$ Product", "image": null}, "options": [{"id": "teeCO", "label": "A", "text": "Pent - 3 - en - 1 - amine", "isCorrect": false, "image": null}, {"id": "pAycI", "label": "B", "text": "Pentanal", "isCorrect": false, "image": null}, {"id": "BrOJh", "label": "C", "text": "Pent - 3 - enal", "isCorrect": true, "image": null}, {"id": "3qVxg", "label": "D", "text": "Pent - 3 - en -1 - ol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reactant is pent-3-enenitrile, which has the structure $\\text{CH}_3-\\text{CH}=\\text{CH}-\\text{CH}_2-\\text{CN}$.<br><br>Diisobutylaluminium hydride (DIBAL-H), represented as $\\text{AlH(i-Bu)}_2$, is a selective reducing agent. It reduces nitriles to imines at low temperatures, which upon subsequent acidic hydrolysis ($\\text{H}_3\\text{O}^+$) yield aldehydes.<br><br>DIBAL-H does not reduce isolated carbon-carbon double bonds.<br><br>The reaction proceeds as follows:<br>$\\text{CH}_3-\\text{CH}=\\text{CH}-\\text{CH}_2-\\text{C}\\equiv\\text{N} \\xrightarrow{\\text{AlH(i-Bu)}_2} \\text{CH}_3-\\text{CH}=\\text{CH}-\\text{CH}_2-\\text{CH}=\\text{N}-\\text{Al(i-Bu)}_2$<br><br>$\\text{CH}_3-\\text{CH}=\\text{CH}-\\text{CH}_2-\\text{CH}=\\text{N}-\\text{Al(i-Bu)}_2 \\xrightarrow{\\text{H}_3\\text{O}^+} \\text{CH}_3-\\text{CH}=\\text{CH}-\\text{CH}_2-\\text{CHO}$<br><br>The final product is pent-3-enal.<br><br>Answer: Pent - 3 - enal", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3288c30a4553e1be0cd", "type": "singleCorrect", "question": {"text": "Identify the reagent 'R' used in the following reaction<br>$\\text{C}_6\\text{H}_5\\text{COCl} \\xrightarrow{\\large{\\text{R}}} \\text{C}_6\\text{H}_5\\text{CHO} + \\text{HCl}$", "image": null}, "options": [{"id": "uNg0e", "label": "A", "text": "$\\text{CO}, \\text{HCl}$", "isCorrect": false, "image": null}, {"id": "IZIUL", "label": "B", "text": "$\\text{H}_2, \\text{Pd}-\\text{BaSO}_4$", "isCorrect": true, "image": null}, {"id": "Ph27W", "label": "C", "text": "$\\text{DIBAl}-\\text{H}$", "isCorrect": false, "image": null}, {"id": "sqvx5", "label": "D", "text": "$\\text{H}_2\\text{O}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction is the conversion of benzoyl chloride ($\\text{C}_6\\text{H}_5\\text{COCl}$) to benzaldehyde ($\\text{C}_6\\text{H}_5\\text{CHO}$).<br><br>This transformation is known as the Rosenmund reduction.<br><br>The reagent used for this reaction is hydrogen gas in the presence of a palladium catalyst supported on barium sulfate ($\\text{H}_2, \\text{Pd}-\\text{BaSO}_4$).<br><br>The barium sulfate acts as a catalytic poison that partially deactivates the palladium, preventing the further reduction of the newly formed aldehyde into an alcohol.<br><br>Thus, the reagent 'R' is $\\text{H}_2, \\text{Pd}-\\text{BaSO}_4$.<br><br>Answer: $\\text{H}_2, \\text{Pd}-\\text{BaSO}_4$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3288c30a4553e1be0c3", "type": "singleCorrect", "question": {"text": "Identify the product 'B' in the following reaction<br>$\\text{Isopropyl cyanide} \\xrightarrow{\\large{\\text{SnCl}_2, \\text{HCl}}} \\text{A} \\xrightarrow{\\large{\\text{H}_3\\text{O}^+}} \\text{B} + \\text{NH}_4\\text{Cl}$", "image": null}, "options": [{"id": "TjHUt", "label": "A", "text": "Propanal", "isCorrect": false, "image": null}, {"id": "AiXBV", "label": "B", "text": "Propanone", "isCorrect": false, "image": null}, {"id": "3DTS1", "label": "C", "text": "2-Methylpropanal", "isCorrect": true, "image": null}, {"id": "5Oel4", "label": "D", "text": "2-Methylpropanoic acid", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction is Stephen reduction.<br><br>Isopropyl cyanide is $\\text{CH}_3-\\text{CH}(\\text{CH}_3)-\\text{CN}$.<br><br>When isopropyl cyanide is treated with $\\text{SnCl}_2$ and $\\text{HCl}$, it undergoes reduction to form an imine hydrochloride intermediate (A).<br><br>$\\text{CH}_3-\\text{CH}(\\text{CH}_3)-\\text{CN} + 2[\\text{H}] + \\text{HCl} \\xrightarrow{\\text{SnCl}_2, \\text{HCl}} \\text{CH}_3-\\text{CH}(\\text{CH}_3)-\\text{CH}=\\text{NH}\\cdot\\text{HCl}$ (A)<br><br>Acidic hydrolysis of the imine hydrochloride yields the corresponding aldehyde (B).<br><br>$\\text{CH}_3-\\text{CH}(\\text{CH}_3)-\\text{CH}=\\text{NH}\\cdot\\text{HCl} + \\text{H}_2\\text{O} \\xrightarrow{\\text{H}_3\\text{O}^+} \\text{CH}_3-\\text{CH}(\\text{CH}_3)-\\text{CHO} + \\text{NH}_4\\text{Cl}$<br><br>The product B is $\\text{CH}_3-\\text{CH}(\\text{CH}_3)-\\text{CHO}$, which is 2-methylpropanal.<br><br>Answer: 2-Methylpropanal", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bffbf9280d7f9932e55", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the reagent used for Rosenmund reduction.", "image": null}, "options": [{"id": "dx8Bw", "text": "$\\mathrm{H}_2 / \\mathrm{Ni}$", "image": null, "isCorrect": false}, {"id": "0EncJ", "text": "$\\mathrm{H}_2 / \\mathrm{Pd}, \\mathrm{BaSO}_4$", "image": null, "isCorrect": true}, {"id": "bCSj2", "text": "$\\mathrm{Na}-\\mathrm{Hg} / \\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "HQ44R", "text": "$\\mathrm{SnCl}_2-\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rosenmund reduction is the catalytic hydrogenation of an acyl chloride to an aldehyde.<br><br>The reagent used for this reaction is hydrogen gas in the presence of a palladium catalyst supported on barium sulfate, which acts as a poison to prevent further reduction of the aldehyde to an alcohol.<br><br>Therefore, the reagent is $\\mathrm{H}_2 / \\mathrm{Pd}, \\mathrm{BaSO}_4$.<br><br>Answer: $\\mathrm{H}_2 / \\mathrm{Pd}, \\mathrm{BaSO}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b12bf9280d7f9932608", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Benzonitrile on reduction with stannous chloride in presence of hydrochloric acid followed by acid hydrolysis forms,", "image": null}, "options": [{"id": "P9MUI", "text": "Benzal chloride", "image": null, "isCorrect": false}, {"id": "JrSyT", "text": "Benzoyl chloride", "image": null, "isCorrect": false}, {"id": "a5Sk0", "text": "Benzophenone", "image": null, "isCorrect": false}, {"id": "hsFI7", "text": "Benzaldehyde", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The reduction of benzonitrile with stannous chloride ($SnCl_2$) and hydrochloric acid ($HCl$) followed by acid hydrolysis is known as the Stephen reaction.<br><br>In the first step, benzonitrile is reduced to an imine hydrochloride intermediate:<br>$C_6H_5-C\\equiv N + 2[H] + HCl \\xrightarrow{SnCl_2/HCl} C_6H_5-CH=NH\\cdot HCl$<br><br>In the second step, acid hydrolysis of the imine hydrochloride yields benzaldehyde:<br>$C_6H_5-CH=NH\\cdot HCl + H_2O \\xrightarrow{H_3O^+} C_6H_5-CHO + NH_4Cl$<br><br>Thus, the final product is benzaldehyde.<br><br>Answer: Benzaldehyde", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214350aee93fa0796ded7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Identify the substrate ' A ' in the following conversion.\r\n$A \\xrightarrow[\\mathrm{H}_3 \\mathrm{O}^{+}]{\\mathrm{AlH}(\\mathrm{i}-\\mathrm{Bu})_2} \\text { Pent-3-enal }$", "image": null}, "options": [{"id": "3Tl5u", "text": "Pentanenitrile", "image": null, "isCorrect": false}, {"id": "InEta", "text": "Pent-3-enenitrile", "image": null, "isCorrect": true}, {"id": "T5VN3", "text": "Pent-3-en-1-amine", "image": null, "isCorrect": false}, {"id": "qYJh0", "text": "Pent-3-ynenitrile", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reagent $\\mathrm{AlH}(\\mathrm{i}-\\mathrm{Bu})_2$ is Diisobutylaluminium hydride (DIBAL-H). It selectively reduces nitriles to imines, which upon acid hydrolysis ($\\mathrm{H}_3\\mathrm{O}^{+}$) yield aldehydes. DIBAL-H does not reduce isolated carbon-carbon double bonds under normal conditions.<br><br>The product given is pent-3-enal, which has the structure $\\mathrm{CH_3-CH=CH-CH_2-CHO}$.<br><br>To obtain pent-3-enal, the substrate 'A' must be a nitrile with the same carbon skeleton and double bond position. Replacing the $-\\mathrm{CHO}$ group with a $-\\mathrm{CN}$ group gives $\\mathrm{CH_3-CH=CH-CH_2-CN}$.<br><br>The IUPAC name of this substrate is pent-3-enenitrile.<br><br>Answer: Pent-3-enenitrile", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e90aee93fa0796dc7b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Which reagent from following is used for preparation of aliphatic aldehyde from nitriles?", "image": null}, "options": [{"id": "Fq5Xa", "text": "$\\mathrm{CrO}_2 \\mathrm{Cl}_2$ in $\\mathrm{CS}_2$", "image": null, "isCorrect": false}, {"id": "OH5Wl", "text": "$\\mathrm{CrO}_3$ in acetic anhydride", "image": null, "isCorrect": false}, {"id": "PMvmE", "text": "$\\mathrm{SnCl}_2, \\mathrm{HCl}$", "image": null, "isCorrect": true}, {"id": "yx5Y5", "text": "$\\mathrm{Co}, \\mathrm{HCl}$, anhydrous $\\mathrm{AlCl}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The preparation of aliphatic aldehydes from nitriles is carried out using Stephen reaction.<br><br>In this reaction, nitriles are reduced to the corresponding imine hydrochloride by stannous chloride ($\\mathrm{SnCl}_2$) in the presence of hydrochloric acid ($\\mathrm{HCl}$). The imine hydrochloride on acid hydrolysis gives the corresponding aliphatic aldehyde.<br><br>$R-C \\equiv N + 2[H] \\xrightarrow{\\mathrm{SnCl}_2, \\mathrm{HCl}} R-CH=NH \\cdot \\mathrm{HCl} \\xrightarrow{\\mathrm{H}_3\\mathrm{O}^+} R-CHO + \\mathrm{NH}_4\\mathrm{Cl}$<br><br>$\\mathrm{CrO}_2\\mathrm{Cl}_2$ in $\\mathrm{CS}_2$ and $\\mathrm{CrO}_3$ in acetic anhydride are used for the oxidation of toluene to benzaldehyde (Etard reaction and related oxidation).<br><br>$\\mathrm{CO}, \\mathrm{HCl}$ with anhydrous $\\mathrm{AlCl}_3$ is used for the preparation of benzaldehyde from benzene (Gattermann-Koch reaction).<br><br>Answer: $\\mathrm{SnCl}_2, \\mathrm{HCl}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e60aee93fa0796dc65", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Identify reagent used for preparation of benzophenone from benzonitrile?", "image": null}, "options": [{"id": "OP917", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{MgBr}$", "image": null, "isCorrect": true}, {"id": "g8A8I", "text": "$\\mathrm{CH}_3 \\mathrm{MgCl}$ (in dry ether)", "image": null, "isCorrect": false}, {"id": "vQZUv", "text": "$\\left(\\mathrm{CH}_3\\right)_2 \\mathrm{Cd}$", "image": null, "isCorrect": false}, {"id": "qPYsm", "text": "$\\mathrm{AlH}(\\mathrm{i}-\\mathrm{Bu})_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Benzophenone is prepared from benzonitrile by the action of phenylmagnesium bromide (a Grignard reagent) followed by acid hydrolysis.<br><br>The reaction proceeds as follows:<br><br>$\\mathrm{C}_6\\mathrm{H}_5\\mathrm{C}\\equiv\\mathrm{N} + \\mathrm{C}_6\\mathrm{H}_5\\mathrm{MgBr} \\xrightarrow{\\text{dry ether}} (\\mathrm{C}_6\\mathrm{H}_5)_2\\mathrm{C}=\\mathrm{NMgBr}$<br><br>The intermediate imine complex upon acid hydrolysis gives benzophenone:<br><br>$(\\mathrm{C}_6\\mathrm{H}_5)_2\\mathrm{C}=\\mathrm{NMgBr} \\xrightarrow{\\mathrm{H}_3\\mathrm{O}^+} \\mathrm{C}_6\\mathrm{H}_5-\\mathrm{CO}-\\mathrm{C}_6\\mathrm{H}_5 + \\mathrm{NH}_3 + \\mathrm{Mg}(\\mathrm{OH})\\mathrm{Br}$<br><br>Thus, the required reagent is $\\mathrm{C}_6\\mathrm{H}_5\\mathrm{MgBr}$.<br><br>Answer: $\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{MgBr}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c30aee93fa0796db53", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Identify the product obtained in following reaction.\n$\\text{C}_6\\text{H}_6 \\xrightarrow[\\text{Anhyd. }\\mathrm{AlCl_3}\\text{, }\\mathrm{pressure}]{\\text{CO, }\\mathrm{HCl}} \\text{product}$", "image": null}, "options": [{"id": "TOTiJ", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{COOH}$", "image": null, "isCorrect": false}, {"id": "sY10d", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{CHO}$", "image": null, "isCorrect": true}, {"id": "aNm2p", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{CHCl}_2$", "image": null, "isCorrect": false}, {"id": "DxH7J", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{Cl}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is the Gattermann-Koch formylation reaction.<br><br>Benzene reacts with carbon monoxide and hydrogen chloride in the presence of anhydrous aluminum chloride under high pressure to form benzaldehyde.<br><br>The mixture of $\\text{CO}$ and $\\text{HCl}$ in the presence of $\\text{AlCl}_3$ generates the formyl cation $[\\text{H}-\\text{C}^{+}=\\text{O}]$ in situ, which acts as an electrophile and attacks the benzene ring.<br><br>$\\text{C}_6\\text{H}_6 + \\text{CO} + \\text{HCl} \\xrightarrow{\\text{Anhyd. } \\text{AlCl}_3} \\text{C}_6\\text{H}_5\\text{CHO} + \\text{HCl}$<br><br>The product obtained is benzaldehyde ($\\text{C}_6\\text{H}_5\\text{CHO}$).<br><br>Answer: $\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{CHO}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c20aee93fa0796db49", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Identify the product ' B ' obtained in following reaction.\r\n$\\mathrm{R}-\\mathrm{C} \\equiv \\mathrm{~N} \\xrightarrow{\\mathrm{SnCl}_2} \\mathrm{ACl} \\xrightarrow{\\mathrm{H}_3 \\mathrm{O}^{+}} \\mathrm{B}$", "image": null}, "options": [{"id": "RkTrj", "text": "$\\mathrm{R}-\\mathrm{NH}_2$", "image": null, "isCorrect": false}, {"id": "NgLOm", "text": "$\\mathrm{R}-\\mathrm{CONH}_2$", "image": null, "isCorrect": false}, {"id": "T9v4h", "text": "$\\mathrm{R}-\\mathrm{CHO}$", "image": null, "isCorrect": true}, {"id": "6h4JY", "text": "$\\mathrm{R}-\\mathrm{COOH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is the Stephen reduction reaction.<br><br>When an alkyl cyanide (nitrile) is treated with stannous chloride ($\\mathrm{SnCl}_2$) and hydrochloric acid ($\\mathrm{HCl}$), it undergoes reduction to form an imine hydrochloride intermediate (A).<br><br>$\\mathrm{R}-\\mathrm{C} \\equiv \\mathrm{N} + 2\\mathrm{H} \\xrightarrow{\\mathrm{SnCl}_2 / \\mathrm{HCl}} \\mathrm{R}-\\mathrm{CH}=\\mathrm{NH} \\cdot \\mathrm{HCl}$<br><br>The imine hydrochloride on acid hydrolysis ($\\mathrm{H}_3\\mathrm{O}^+$) yields an aldehyde (B).<br><br>$\\mathrm{R}-\\mathrm{CH}=\\mathrm{NH} \\cdot \\mathrm{HCl} \\xrightarrow{\\mathrm{H}_3\\mathrm{O}^+} \\mathrm{R}-\\mathrm{CHO} + \\mathrm{NH}_4\\mathrm{Cl}$<br><br>Thus, the final product B is $\\mathrm{R}-\\mathrm{CHO}$.<br><br>Answer: $\\mathrm{R}-\\mathrm{CHO}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213760aee93fa0796d8f4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which of the following is Stephen reaction?", "image": null}, "options": [{"id": "V9gMK", "text": "$\\mathrm{R}-\\mathrm{COCl} \\xrightarrow[\\text { Pd-BaSO }]{\\mathrm{H}_2} \\mathrm{R}-\\mathrm{CHO}+\\mathrm{HCl}$", "image": null, "isCorrect": false}, {"id": "Vrr5G", "text": "$\\mathrm{R}-\\mathrm{CN} \\xrightarrow[\\text { i) } \\mathrm{H}_3 \\mathrm{O}^{+}]{\\text {i) } \\mathrm{SnCl}_2, \\mathrm{HCl}} \\mathrm{R}-\\mathrm{CHO}+\\mathrm{NH}_4 \\mathrm{Cl}$", "image": null, "isCorrect": true}, {"id": "gklkN", "text": "$\\mathrm{R}-\\mathrm{CHO} \\xrightarrow[\\Delta]{\\mathrm{Zn}-\\mathrm{Hg} \\text { conc. } \\mathrm{HCl}} \\mathrm{R}-\\mathrm{CH}_3+\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "usqte", "text": "$\\mathrm{R}-\\mathrm{CHO} \\xrightarrow[\\text { ii) } \\mathrm{KOH}, \\mathrm{HO}-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{OH}]{\\text { i) } \\mathrm{H}_2-\\mathrm{NH}_2}$ $\\mathrm{R}-\\mathrm{CH}_2-\\mathrm{R}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The Stephen reaction involves the reduction of an alkyl cyanide (nitrile) to an imine hydrochloride using stannous chloride ($\\mathrm{SnCl}_2$) and hydrochloric acid ($\\mathrm{HCl}$), followed by hydrolysis with water to yield an aldehyde.<br><br>The reaction is given by:<br>$\\mathrm{R}-\\mathrm{CN} \\xrightarrow{\\mathrm{SnCl}_2, \\mathrm{HCl}} \\mathrm{R}-\\mathrm{CH}=\\mathrm{NH} \\cdot \\mathrm{HCl} \\xrightarrow{\\mathrm{H}_3\\mathrm{O}^{+}} \\mathrm{R}-\\mathrm{CHO} + \\mathrm{NH}_4\\mathrm{Cl}$<br><br>The other reactions are:<br>$\\mathrm{R}-\\mathrm{COCl} \\xrightarrow{\\mathrm{H}_2, \\mathrm{Pd}-\\mathrm{BaSO}_4} \\mathrm{R}-\\mathrm{CHO}$ is the Rosenmund reduction.<br>$\\mathrm{R}-\\mathrm{CHO} \\xrightarrow{\\mathrm{Zn}-\\mathrm{Hg}, \\text{conc. } \\mathrm{HCl}} \\mathrm{R}-\\mathrm{CH}_3$ is the Clemmensen reduction.<br>$\\mathrm{R}-\\mathrm{CHO} \\xrightarrow{\\mathrm{NH}_2-\\mathrm{NH}_2, \\mathrm{KOH}} \\mathrm{R}-\\mathrm{CH}_3$ is the Wolff-Kishner reduction.<br><br>Answer: $\\mathrm{R}-\\mathrm{CN} \\xrightarrow[\\text { i) } \\mathrm{H}_3 \\mathrm{O}^{+}]{\\text {i) } \\mathrm{SnCl}_2, \\mathrm{HCl}} \\mathrm{R}-\\mathrm{CHO}+\\mathrm{NH}_4 \\mathrm{Cl}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134f0aee93fa0796d7c6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Identify the reagent ' R ' used in the following reaction.\r\nBenzoyl chloride $\\xrightarrow{R}$ Benzaldehyde", "image": null}, "options": [{"id": "SytaV", "text": "$\\mathrm{CO}, \\mathrm{HCl}$", "image": null, "isCorrect": false}, {"id": "ZFaKK", "text": "$\\mathrm{H}_2, \\mathrm{Pd}-\\mathrm{BaSO}_4$", "image": null, "isCorrect": true}, {"id": "gLIHB", "text": "DIBAI-H", "image": null, "isCorrect": false}, {"id": "hq04h", "text": "$\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The conversion of benzoyl chloride to benzaldehyde is known as the Rosenmund reduction.<br><br>In this reaction, an acid chloride is hydrogenated over a catalyst of palladium on barium sulfate.<br><br>The reagent 'R' is $\\mathrm{H}_2, \\mathrm{Pd}-\\mathrm{BaSO}_4$.<br><br>Barium sulfate acts as a catalytic poison to the palladium catalyst, which prevents the further reduction of the newly formed aldehyde into an alcohol.<br><br>Answer: $\\mathrm{H}_2, \\mathrm{Pd}-\\mathrm{BaSO}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262700279619d9d8a348b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Identify the product ' $\\mathrm{B}$ ' in the following reaction. Toluene <img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/BMXV7ZBJxwJdPEPCDqbbMhrIWN-oNnSTo7An3RlyhfA.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "cvXzj", "text": "Benzal chloride", "image": null, "isCorrect": false}, {"id": "avSF7", "text": "Benzaldehyde", "image": null, "isCorrect": true}, {"id": "HxYzH", "text": "Benzyl alcohol", "image": null, "isCorrect": false}, {"id": "VQe3H", "text": "Benzoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/C9Hu26orLCjtOc4VENwGBi5ydgMLT5csZCoNbO-oEvA.original.fullsize.png\"><br>", "image": null}, "videoSolution": nu yl group on benzene ring is converted to aldehydic group is called", "image": null}, "options": [{"id": "fsN78", "text": "Etard reaction", "image": null, "isCorrect": true}, {"id": "T89yC", "text": "Fridel - Craft reaction", "image": null, "isCorrect": false}, {"id": "U4HWv", "text": "Rosenmund reaction", "image": null, "isCorrect": false}, {"id": "5lDzU", "text": "Gatterman - Koch reaction", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(a) Etard reaction\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/MkA7alucsfct5vdnw8PfX2-Mt-O-mUDuqqHeE_YB_OI.original.fullsize.png\"><br>\n(b) Fridel - Craft reaction<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/-YO84fBlKw-GPOSQJ72uNCj18OPAy7OArjt48Pf0S3M.original.fullsize.png\"><br>\n(c) Rosenmund reaction<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/KZL3v9IfreZ3i71eHweXoa9sg0-7tTUp6RwtzkRzots.original.fullsize.png\"><br>\n(d)<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/o28FXGk6TzsIVJtIvwpXhM_2IrwtfCZxkp094Xxf0HM.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260040279619d9d8a2114", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "Which of the following is used to convert olefins into aldehyde?", "image": null}, "options": [{"id": "pMMcZ", "text": "$\\mathrm{H}_{2}$ and $\\mathrm{CO}$", "image": null, "isCorrect": true}, {"id": "pfO0L", "text": "$\\mathrm{H}_{2}$", "image": null, "isCorrect": false}, {"id": "uH40z", "text": "CO and alkyne", "image": null, "isCorrect": false}, {"id": "vjrhL", "text": "$\\mathrm{CO}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Aldehydes are prepared from alkene in oxo process. In presence of cobalt tetracarbonyl, alkynes react with $\\mathrm{CO}$ and hydrogen to form aldehydes.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/HFWmQWfeMMwo9uEpJ93PtLZmhZkrYNRJLqLGpHErrYQ.original.fullsize.png\"><br>\nAldehydes are also prepared by hydroboration oxidation of alkynes.<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/2oocE8cA1J7LKQQEQgA4sxFWdG8QaWGDclx__TdqvOE.original.fullsize.png\"><br>\nThe hydration of propyne gives acetone.<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Z1wdovSAjTmfaCc41pIAxByAHR1VkmuPEoDdbVCAiYA.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ff30279619d9d8a2088", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "Which of the following is a Stephen reaction?", "image": null}, "options": [{"id": "EJfNN", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Cv5goOZodRadIVmNoj2UVibjvTGvtrAA9cdXW_JBH7k.original.fullsize.png\">", "image": null, "isCorrect": false}, {"id": "1ZjiR", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/UXFHtiy74oHESVo98ppSucTY8t-lJPIBV4IWlpFfKzA.original.fullsize.png\">", "image": null, "isCorrect": false}, {"id": "ANsSY", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/3wni0zmurvCOSTUFN64OWvoWnFnRAsdsVGK5skRJdCQ.original.fullsize.png\">", "image": null, "isCorrect": false}, {"id": "av6cN", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/_jVTwr5GIDIgkwHIdaPOuoedqGXcMbyaTDbkqFGy0ck.original.fullsize.png\">", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(D)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fcd0279619d9d8a1f5d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "An acylchloride is hydrogenated over catalyst palladium on barium sulphate to form an aldehyde. This reaction is called as", "image": null}, "options": [{"id": "ukSI8", "text": "Stephen reaction", "image": null, "isCorrect": false}, {"id": "HO2Ax", "text": "Rosenmund reduction", "image": null, "isCorrect": true}, {"id": "WKalC", "text": "Etard reaction", "image": null, "isCorrect": false}, {"id": "JOLyW", "text": "Wolff- Kishner reduction", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(B)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f950279619d9d8a1da8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "Identify 'A' in the following reaction, $\\mathrm{A} \\frac{\\mathrm{H}_{2}}{\\mathrm{Pd}-\\mathrm{BaSO}_{4}}>\\mathrm{C}_{6} \\mathrm{H}_{5} \\mathrm{CH} \\mathrm{O}+\\mathrm{HCl}$", "image": null}, "options": [{"id": "XAoFi", "text": "Benzoic acid", "image": null, "isCorrect": false}, {"id": "D9ieK", "text": "Benzyl chloride", "image": null, "isCorrect": false}, {"id": "vistq", "text": "Benzoyl chloride", "image": null, "isCorrect": true}, {"id": "5rjUk", "text": "Chlorobenzene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When benzoyl chloride is hydrogenated in the presence palladium on barium sulphate $\\left(\\mathrm{Pd} / \\mathrm{BaSO}_{4}\\right)$, benzaldehyde is obtained. This reaction is called Rosenmund reduction.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/4ym-duRK_R9Zf3MiVCW9SPF2iaUADeoB4ZDYo2_Vczs.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f7f0279619d9d8a1cf6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "Chromyl chloride converts methyl group to a chromium complex, which on acid hydrolysis gives corresponding aldehyde. This reaction is called", "image": null}, "options": [{"id": "KwWUz", "text": "Stephen reaction", "image": null, "isCorrect": false}, {"id": "rZksI", "text": "Wolff-Kishner reaction", "image": null, "isCorrect": false}, {"id": "IQmQL", "text": "Etard reaction", "image": null, "isCorrect": true}, {"id": "iS0yo", "text": "Rosenmund reaction", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When toluene is treated with solution of chromyl chloride $\\left(\\mathrm{CrO}_{2} \\mathrm{Cl}_{2}\\right)$ in $\\mathrm{CS}_{2}$, brown chrominum complex is obtained, which on acid hydrolysis gives benzaldehyde. This reaction is called Etard reaction.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/K6v5tJQdff_6r2MfHM-kILxk9vO4ExQhF55KTeVVR1w.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f700279619d9d8a1c7c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "Which among following compounds in obtained when calcium formate is dry distilled alone?", "image": null}, "options": [{"id": "VGRJK", "text": "Methanoic acid", "image": null, "isCorrect": false}, {"id": "3Iwza", "text": "Methanal", "image": null, "isCorrect": true}, {"id": "kcyAC", "text": "Methanol", "image": null, "isCorrect": false}, {"id": "5VsWa", "text": "Methoxy methane", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Calcium formate or dry distillation gives formaldehyde\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/QPrPlVOILQqUsGLA7MbwFQ1Yy1e5tn-n32EOlCK44Mc.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f5d0279619d9d8a1be2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "Identify product 'A' in the following reaction\n$\\mathrm{R}-\\mathrm{C} \\equiv \\mathrm{N} \\frac{\\mathrm{i}) \\mathrm{DIBAl}-\\mathrm{H}}{\\mathrm{ii}) \\mathrm{H}_{3} \\mathrm{O}^{+}} \\longrightarrow \\mathrm{A}$", "image": null}, "options": [{"id": "FKHR5", "text": "$\\mathrm{R}-\\mathrm{CONH}_{2}$", "image": null, "isCorrect": false}, {"id": "9pmKg", "text": "$\\mathrm{R}-\\mathrm{COOH}$", "image": null, "isCorrect": false}, {"id": "Q8Trs", "text": "$\\mathrm{R}-\\mathrm{CH} \\mathrm{O}$", "image": null, "isCorrect": true}, {"id": "RWHgk", "text": "$\\mathrm{R}-\\mathrm{CH}_{2} \\mathrm{NH}_{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f470279619d9d8a1b2e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "Which of the following is obtained by hydrogenation of benzoyl chloride in presence of $\\mathrm{Pd}$ on $\\mathrm{BaSO}_{4}$ ?", "image": null}, "options": [{"id": "K8JCm", "text": "Benzene", "image": null, "isCorrect": false}, {"id": "k8p3N", "text": "Benzoic acid", "image": null, "isCorrect": false}, {"id": "hY6H3", "text": "Benzyl alcohol", "image": null, "isCorrect": false}, {"id": "BVXoy", "text": "Benzaldehyde", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Rosenmund reduction\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/psIqk-8cbgTVTBsmgv5JRRKMDw7R9SWX9JtGYWUWugU.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f210279619d9d8a1a04", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "Which of the following is Rosenmund reduction?", "image": null}, "options": [{"id": "AvZY2", "text": "$\\mathrm{R}-\\mathrm{C} \\equiv \\mathrm{N}+2[\\mathrm{H}] \\underset{\\mathrm{dil} \\mathrm{HCl}}{\\mathrm{SnCl}_{2}}{\\longrightarrow} \\mathrm{R}-\\mathrm{CH}=\\mathrm{NH} \\cdot \\mathrm{HCl} \\stackrel{\\mathrm{H}_{3} \\mathrm{O}^{+}}{\\longrightarrow} \\mathrm{R}-\\mathrm{CHO}+\\mathrm{NH}_{4} \\mathrm{Cl}$", "image": null, "isCorrect": true}, {"id": "rW4gm", "text": "$\\mathrm{R}-\\mathrm{CH} \\mathrm{O} \\frac{\\mathrm{H}_{2} \\mathrm{~N}-\\mathrm{NH}_{2}}{-\\mathrm{H}_{2} \\mathrm{O}}^{-} \\mathrm{R}-\\mathrm{CH}=\\mathrm{N}-\\mathrm{NH}_{2} \\frac{\\text { KOH/ethylene glycol }}{\\Delta} \\mathrm{RCH}_{3}+\\mathrm{N}_{2}$", "image": null, "isCorrect": false}, {"id": "UrUup", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/uC_-9svDgcasQdlawXbhSBhZK0dk8JS3jpIpd6tW_Ew.original.fullsize.png\">", "image": null, "isCorrect": false}, {"id": "qH5dN", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/6qRjxxtYmPv4lozoN3M8py0r756Ldn8S3IX-oT4YxXw.original.fullsize.png\">", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263350279619d9d8a3d03", "title": "Method of preparation for Ketones", "totalQuestions": 15, "questions": [{"_id": "6abb88c315a9fc0fc8c146c5", "type": "singleCorrect", "question": {"text": "Identify the product obtained when acetonitrile reacts with methyl magnesium chloride in dry ether followed by acid hydrolysis.", "image": null}, "options": [{"id": "Goj9K", "label": "A", "text": "Propion aldehyde.", "isCorrect": false, "image": null}, {"id": "khXID", "label": "B", "text": "Ethyl methyl Ketone.", "isCorrect": false, "image": null}, {"id": "2ERz1", "label": "C", "text": "Acetone.", "isCorrect": true, "image": null}, {"id": "5WDcQ", "label": "D", "text": "Acetaldehyde.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Acetonitrile is $CH_3CN$.<br><br>When acetonitrile reacts with methyl magnesium chloride ($CH_3MgCl$) in the presence of dry ether, a nucleophilic addition reaction takes place. The methyl carbanion from the Grignard reagent attacks the electrophilic carbon of the cyano group, forming an imine complex.<br><br>$CH_3-C \\equiv N + CH_3MgCl \\xrightarrow{\\text{dry ether}} CH_3-C(CH_3)=NMgCl$<br><br>Upon subsequent acid hydrolysis, the imine complex is converted into a ketone.<br><br>$CH_3-C(CH_3)=NMgCl \\xrightarrow{H_3O^+} CH_3-C(=O)-CH_3 + NH_3 + Mg(OH)Cl$<br><br>The final product is acetone.<br><br>Answer: Acetone.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3278c30a4553e1be0b9", "type": "singleCorrect", "question": {"text": "Benzonitrile on reaction with a reagent in dry ether followed by hydrolysis forms benzophenone along with ammonia and hydroxymagnesium bromide. Identify the reagent used in above transformation.", "image": null}, "options": [{"id": "WvIbH", "label": "A", "text": "$\\text{C}_6\\text{H}_5\\text{MgCl}$", "isCorrect": false, "image": null}, {"id": "x57ZJ", "label": "B", "text": "$\\text{C}_2\\text{H}_5\\text{MgBr}$", "isCorrect": false, "image": null}, {"id": "Dyq21", "label": "C", "text": "$\\text{C}_6\\text{H}_5\\text{MgI}$", "isCorrect": false, "image": null}, {"id": "8SOaH", "label": "D", "text": "$\\text{C}_6\\text{H}_5\\text{MgBr}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Benzonitrile ($\\text{C}_6\\text{H}_5\\text{CN}$) reacts with a Grignard reagent to form an imine salt, which on hydrolysis gives a ketone.<br><br>Since the product is benzophenone ($\\text{C}_6\\text{H}_5\\text{COC}_6\\text{H}_5$), the Grignard reagent must provide a phenyl group ($\\text{C}_6\\text{H}_5^-$).<br><br>The formation of hydroxymagnesium bromide ($\\text{Mg(OH)Br}$) as a by-product indicates that the halogen in the Grignard reagent is bromine.<br><br>The reaction is:<br><br>$\\text{C}_6\\text{H}_5\\text{CN} + \\text{C}_6\\text{H}_5\\text{MgBr} \\xrightarrow{\\text{dry ether}} (\\text{C}_6\\text{H}_5)_2\\text{C=NMgBr}$<br><br>$(\\text{C}_6\\text{H}_5)_2\\text{C=NMgBr} + 2\\text{H}_2\\text{O} \\rightarrow (\\text{C}_6\\text{H}_5)_2\\text{C=O} + \\text{NH}_3 + \\text{Mg(OH)Br}$<br><br>The reagent used is $\\text{C}_6\\text{H}_5\\text{MgBr}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3468c30a4553e1be205", "type": "singleCorrect", "question": {"text": "Identify the product 'Y' in the following reaction $\\text{Benzonitrile} \\xrightarrow{\\large{\\text{C}_6\\text{H}_5\\text{MgBr} / \\text{dry ether}}} X \\xrightarrow{\\large{\\text{H}_3\\text{O}^+}} Y + \\text{MgBr(OH)} + \\text{NH}_3$", "image": null}, "options": [{"id": "VxsMd", "label": "A", "text": "Benzophenone", "isCorrect": true, "image": null}, {"id": "LxIRR", "label": "B", "text": "Benzylalcohol", "isCorrect": false, "image": null}, {"id": "qWwdo", "label": "C", "text": "Benzaldehyde", "isCorrect": false, "image": null}, {"id": "aXfCW", "label": "D", "text": "Benzoic acid", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Benzonitrile is $C_6H_5CN$.<br><br>When benzonitrile reacts with phenylmagnesium bromide ($C_6H_5MgBr$) in the presence of dry ether, a nucleophilic addition takes place at the electrophilic carbon of the cyanide group, forming an imine salt intermediate ($X$).<br><br>$C_6H_5CN + C_6H_5MgBr \\xrightarrow{\\text{dry ether}} (C_6H_5)_2C=NMgBr$<br><br>Upon acid hydrolysis ($H_3O^+$), the imine salt intermediate ($X$) is converted into a ketone.<br><br>$(C_6H_5)_2C=NMgBr \\xrightarrow{H_3O^+} (C_6H_5)_2C=O + NH_3 + MgBr(OH)$<br><br>The product $Y$ is $(C_6H_5)_2C=O$, which is benzophenone.<br><br>Answer: Benzophenone", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b98c30a4553e1bdc25", "type": "singleCorrect", "question": {"text": "Identify the product obtained when Grignard reagent reacts with alkyl cyanide followed by acid hydrolysis.", "image": null}, "options": [{"id": "4JRcT", "label": "A", "text": "an aldehyde", "isCorrect": false, "image": null}, {"id": "ESu0V", "label": "B", "text": "a ketone", "isCorrect": true, "image": null}, {"id": "TaCyj", "label": "C", "text": "a primary alcohol", "isCorrect": false, "image": null}, {"id": "dxpSU", "label": "D", "text": "a secondary alcohol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Grignard reagents ($R'MgX$) react with alkyl cyanides ($R-C\\equiv N$) to form an imine salt intermediate.<br><br>$R-C\\equiv N + R'MgX \\rightarrow R-C(R')=NMgX$<br><br>Upon acid hydrolysis, the imine salt is converted into a ketone.<br><br>$R-C(R')=NMgX + H_3O^+ \\rightarrow R-C(=O)-R' + NH_3 + Mg(OH)X$<br><br>Thus, the final product obtained is a ketone.<br><br>Answer: a ketone", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8abf9280d7f9932a2c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify substrate 'S' in the following reaction.\n$\\mathrm{S} \\xrightarrow{\\text { Dimethyl cadmium }} \\text { Propanone }+ \\text { Cadmium chloride }$", "image": null}, "options": [{"id": "exl20", "text": "Ethyl chloride", "image": null, "isCorrect": false}, {"id": "uer0w", "text": "Ethylene dichloride", "image": null, "isCorrect": false}, {"id": "TVsYK", "text": "Ethanoyl chloride", "image": null, "isCorrect": true}, {"id": "hj2nF", "text": "Ethylidene dichloride", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction of an acyl chloride with dialkyl cadmium yields a ketone.<br><br>The general reaction is:<br>$2 \\mathrm{R-COCl} + \\mathrm{R'_2Cd} \\rightarrow 2 \\mathrm{R-CO-R'} + \\mathrm{CdCl_2}$<br><br>Given that the product is propanone ($\\mathrm{CH_3-CO-CH_3}$) and the reagent is dimethyl cadmium ($\\mathrm{(CH_3)_2Cd}$), the alkyl group $\\mathrm{R'}$ is $\\mathrm{CH_3}$.<br><br>Thus, the acyl chloride must have $\\mathrm{R} = \\mathrm{CH_3}$, which corresponds to $\\mathrm{CH_3-COCl}$.<br><br>$\\mathrm{CH_3-COCl}$ is ethanoyl chloride (acetyl chloride).<br><br>The balanced chemical equation is:<br>$2 \\mathrm{CH_3-COCl} + \\mathrm{(CH_3)_2Cd} \\rightarrow 2 \\mathrm{CH_3-CO-CH_3} + \\mathrm{CdCl_2}$<br><br>Therefore, the substrate 'S' is ethanoyl chloride.<br><br>Answer: Ethanoyl chloride", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b14bf9280d7f993261a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product ' B ' in the following sequence of ractions.\nMethyl magnesium bromide $\\xrightarrow{\\mathrm{CdCl}_2} \\mathrm{~A} \\xrightarrow{\\mathrm{CH}_3 \\mathrm{COCl}} \\mathrm{B}$", "image": null}, "options": [{"id": "7G30X", "text": "Dimethyl cadmium", "image": null, "isCorrect": false}, {"id": "TdAef", "text": "Propanone", "image": null, "isCorrect": true}, {"id": "ts62z", "text": "Butanone", "image": null, "isCorrect": false}, {"id": "sPMQF", "text": "Propanal", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Methyl magnesium bromide reacts with cadmium chloride to form dimethyl cadmium (A).<br><br>$2\\mathrm{CH}_3\\mathrm{MgBr} + \\mathrm{CdCl}_2 \\rightarrow (\\mathrm{CH}_3)_2\\mathrm{Cd} + 2\\mathrm{Mg(Br)Cl}$<br><br>Dimethyl cadmium (A) then reacts with acetyl chloride ($\\mathrm{CH}_3\\mathrm{COCl}$) to form propanone (B).<br><br>$2\\mathrm{CH}_3\\mathrm{COCl} + (\\mathrm{CH}_3)_2\\mathrm{Cd} \\rightarrow 2\\mathrm{CH}_3\\mathrm{COCH}_3 + \\mathrm{CdCl}_2$<br><br>Thus, product B is propanone.<br><br>Answer: Propanone", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214210aee93fa0796de33", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Which of the following is a simple ketone?", "image": null}, "options": [{"id": "vKKhD", "text": "Acetophenone", "image": null, "isCorrect": false}, {"id": "nXlYS", "text": "Butanone", "image": null, "isCorrect": false}, {"id": "R0EI4", "text": "Benzophenone", "image": null, "isCorrect": true}, {"id": "Irti5", "text": "Pentan-2-one", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A simple (or symmetrical) ketone is one in which the two alkyl or aryl groups attached to the carbonyl carbon are identical.<br><br>Acetophenone is methyl phenyl ketone, which has different groups (methyl and phenyl) and is a mixed ketone.<br><br>Butanone is ethyl methyl ketone, which has different groups (ethyl and methyl) and is a mixed ketone.<br><br>Benzophenone is diphenyl ketone, which has identical groups (two phenyl groups) and is a simple ketone.<br><br>Pentan-2-one is methyl propyl ketone, which has different groups (methyl and propyl) and is a mixed ketone.<br><br>Answer: Benzophenone", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262820279619d9d8a3519", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Identify substrate ' $\\mathrm{A}$ ' in the following reaction.\n$\\begin{aligned} 2 \\mathrm{nA} \\stackrel{\\text { Dimethyl cadmium }}{\\longrightarrow} & 2 \\mathrm{n} \\text { Propanone } \\\\ & +\\mathrm{n} \\text { Cadmium chloride }\\end{aligned}$", "image": null}, "options": [{"id": "mXGiN", "text": "Ethyl chloride", "image": null, "isCorrect": false}, {"id": "WbVhS", "text": "Ethylene dichloride", "image": null, "isCorrect": false}, {"id": "5Lm8o", "text": "Ethanoyl chloride", "image": null, "isCorrect": true}, {"id": "mtJsG", "text": "Ethylidene dichloride", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/dFs_5AELw0Vr4dRRR_uYhsypF0AsYjHo7y7B6gMdT94.original.fullsize.png\"><br>\nKetones are prepared from acyl chloride by reaction with dialkyl cadmium.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2619b0279619d9d8a2de5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Identify the product $\\mathrm{P}$ in following reaction\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/fUF9UUKPuNUP_ybmO_xtfsz-LR6jxxyMnf7PZjwXGMU.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "MT6rA", "text": "R-CHO", "image": null, "isCorrect": false}, {"id": "iVLNs", "text": "R-CO-R'", "image": null, "isCorrect": true}, {"id": " h ethyl magnesium iodide in presence of dry ether gives complex. This imine complex on acid hydrolysis forms", "image": null}, "options": [{"id": "sO9IL", "text": "2-Pentanone", "image": null, "isCorrect": false}, {"id": "E7ppX", "text": "Butanone", "image": null, "isCorrect": false}, {"id": "0ahpr", "text": "Propanone", "image": null, "isCorrect": false}, {"id": "ckchX", "text": "3-Pentanone", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(A)\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/ut_f4sjUh7JSZkNoEQIDKzkIchmW-xGvJeuJSL3-glY.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fa80279619d9d8a1e3b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "Identify 'A' in the following reaction\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/uCLxUe3NSKPXVKaty6IRaQfyDRLg0JefIJcgOashRvk.original.fullsize.png\">", "image": null}, "options": [{"id": "hoZfT", "text": "$\\mathrm{CH}_{3}-\\mathrm{Mg}-\\mathrm{Cl}$", "image": null, "isCorrect": false}, {"id": "FYqdL", "text": "$\\mathrm{C}_{6} \\mathrm{H}_{5}-\\mathrm{CO}-\\mathrm{Cl}$", "image": null, "isCorrect": false}, {"id": "GbL3a", "text": "$\\mathrm{CH}_{3}-\\mathrm{CO}-\\mathrm{Cl}$", "image": null, "isCorrect": true}, {"id": "ZXApO", "text": "$\\mathrm{C}_{6} \\mathrm{H}_{5}-\\mathrm{CH}_{2}-\\mathrm{Cl}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/CYIxGnX1QoQuRZ847cxu-Al-KGES3qYA7SvdHMeH_IA.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f5e0279619d9d8a1be8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "Which among the following compounds is treated with benzonitrile of obtain benzophenon in dry ether and then acid hydrolysis?", "image": null}, "options": [{"id": "GJenH", "text": "$\\mathrm{CH}_{3} \\mathrm{COCH}_{3}$", "image": null, "isCorrect": false}, {"id": "jfBOy", "text": "$\\mathrm{C}_{6} \\mathrm{H}_{5} \\mathrm{MgBr}$", "image": null, "isCorrect": true}, {"id": "6b3nD", "text": "$\\mathrm{C}_{6} \\mathrm{H}_{5} \\mathrm{ONa}$", "image": null, "isCorrect": false}, {"id": "Y8QHw", "text": "$\\mathrm{CH}_{3} \\mathrm{MgBr}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/rYCLhuRenYHOioY6Op2DCwmwNKDVBMdqFEaaBfZxO0Y.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eb20279619d9d8a168a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "Which of the following compounds when treated with dibenzyl cadmium yields benzyl methyl ketone?", "image": null}, "options": [{"id": "hUaod", "text": "Acetone", "image": null, "isCorrect": false}, {"id": "NoKRq", "text": "Acetaldehyde", "image": null, "isCorrect": false}, {"id": "C7StU", "text": "Acetic acid", "image": null, "isCorrect": false}, {"id": "g8RsC", "text": "Acetyl chloride", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Acetyl chloride + dibenzyl cadmium <math><mo>→</mo></math>&nbsp;Benzyl methyl ketone", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263350279619d9d8a3d01", "title": "Chemical reactions for aldehydes and ketones", "totalQuestions": 53, "questions": [{"_id": "6abb88d415a9fc0fc8c1475b", "type": "singleCorrect", "question": {"text": "In haloform reaction of acetaldehyde and all methyl ketones ($\\text{CH}_3\\text{COR}$), methyl group is converted to", "image": null}, "options": [{"id": "4m0Kg", "label": "A", "text": "sodium salt", "isCorrect": false, "image": null}, {"id": "Lnjbs", "label": "B", "text": "haloform", "isCorrect": true, "image": null}, {"id": "sOl4g", "label": "C", "text": "sodium hydroxide", "isCorrect": false, "image": null}, {"id": "WJEZ3", "label": "D", "text": "sodium hypohalite", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In the haloform reaction, methyl ketones ($\\text{CH}_3\\text{COR}$) or acetaldehyde react with halogen and aqueous sodium hydroxide to form a haloform ($\\text{CHX}_3$) and the sodium salt of a carboxylic acid ($\\text{RCOONa}$).<br><br>The general reaction is given by:<br>$\\text{RCOCH}_3 + 3\\text{X}_2 + 4\\text{NaOH} \\rightarrow \\text{CHX}_3 + \\text{RCOONa} + 3\\text{NaX} + 3\\text{H}_2\\text{O}$<br><br>The methyl group ($\\text{CH}_3$) is converted into haloform ($\\text{CHX}_3$), while the rest of the molecule forms the sodium salt of the carboxylic acid.<br><br>Answer: haloform", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a315a9fc0fc8c14598", "type": "singleCorrect", "question": {"text": "Which of the following compounds is most reactive towards nucleophilic addition reaction?", "image": null}, "options": [{"id": "aY417", "label": "A", "text": "<img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/19_may_shift_2__q92_d1_v2.png\" />", "isCorrect": false, "image": null}, {"id": "1QcQ8", "label": "B", "text": "<img style=\"width: 180px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/19_may_shift_2__q92_d2_v2.png\" />", "isCorrect": false, "image": null}, {"id": "0Nmyz", "label": "C", "text": "$\\text{C}_2\\text{H}_5\\text{-CO-H}$", "isCorrect": true, "image": null}, {"id": "Ll67A", "label": "D", "text": "$\\text{C}_2\\text{H}_5\\text{-CO-C}_2\\text{H}_5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reactivity of carbonyl compounds towards nucleophilic addition reactions depends on steric and electronic factors.<br><br>1. Steric factor: Aldehydes are generally more reactive than ketones because the presence of two relatively large alkyl or aryl groups in ketones hinders the approach of the nucleophile to the carbonyl carbon.<br><br>2. Electronic factor: Alkyl groups have an electron-donating inductive effect (+I effect), which reduces the partial positive charge on the carbonyl carbon, making it less electrophilic. Aromatic rings (like phenyl) reduce the electrophilicity of the carbonyl carbon through resonance (+R effect).<br><br>Comparing the given options:<br>- $\\text{C}_2\\text{H}_5\\text{-CO-H}$ (Propanal) is an aliphatic aldehyde.<br>- Benzaldehyde is an aromatic aldehyde, which is less reactive than aliphatic aldehydes due to the resonance stabilization from the benzene ring.<br>- $\\text{C}_2\\text{H}_5\\text{-CO-C}_2\\text{H}_5$ (Pentan-3-one) and Acetophenone are ketones, which are less reactive than aldehydes.<br><br>Therefore, the aliphatic aldehyde, $\\text{C}_2\\text{H}_5\\text{-CO-H}$, is the most reactive towards nucleophilic addition.<br><br>Answer: $\\text{C}_2\\text{H}_5\\text{-CO-H}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "sho
