O}$", "image": null, "isCorrect": true}, {"id": "9lvPl", "text": "$\\mathrm{C}_{2}^{+} \\mathrm{CHO}$", "image": null, "isCorrect": false}, {"id": "kUWl3", "text": "$\\stackrel{+}{\\mathrm{CH}_{2} \\mathrm{OH}}$", "image": null, "isCorrect": false}, {"id": "74HDZ", "text": "$: \\overline{\\mathrm{C}} \\mathrm{HCHO}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The $\\alpha$ -hydrogen atoms of acetaldehyde due to $-E$ effect of $>\\mathrm{C}=\\mathrm{O}$ group is slightly acidic\nin nature. In crossed aldol condensation between formaldehyde and acetaldehdye in the first step $\\mathrm{OH}^{-}$ ion (from the base added) abstracts one of these acidic $\\alpha$ -hydrogens to form carbanion or enolate ion which is stabilised by resonance.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/PvQr_sLXEbjXqLWZY8bMzqS5T6dwEdNVwT8BUEQqBvs.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a263350279619d9d8a3d06", "title": "Reactions for aldehydes", "totalQuestions": 8, "questions": [{"_id": "6792139f0aee93fa0796da37", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Identify the test from following so that aldehyde when boiled with ammoniacal silver nitrate solution deposts silver.", "image": null}, "options": [{"id": "R4E9T", "text": "Schiff's test", "image": null, "isCorrect": false}, {"id": "vV5hB", "text": "Tollen's test", "image": null, "isCorrect": true}, {"id": "tUf15", "text": "Gehling test", "image": null, "isCorrect": false}, {"id": "6cLjM", "text": "Iodoform test", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Tollen's reagent is an ammoniacal silver nitrate solution, which contains the complex ion $[Ag(NH_3)_2]^+$.<br><br>When an aldehyde is heated with Tollen's reagent, the aldehyde is oxidized to the corresponding carboxylate anion, and the silver ions are reduced to metallic silver.<br><br>$RCHO + 2[Ag(NH_3)_2]^+ + 3OH^- \\rightarrow RCOO^- + 2Ag \\downarrow + 4NH_3 + 2H_2O$<br><br>The metallic silver deposits on the inner walls of the test tube, forming a silver mirror. This test is known as Tollen's test.<br><br>Answer: Tollen's test", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139e0aee93fa0796da32", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "What is the product obtained in the reaction?\n\\(\\mathrm{CH}_3-\\mathrm{CH}=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{CHO} \\xrightarrow[\\text { (i) } \\mathrm{H}_3 \\mathrm{O}^{+}]{\\text {(i) } \\mathrm{LAH}_4} \\text { product }\\)", "image": null}, "options": [{"id": "dRLoz", "text": "$\\mathrm{CH}_3-\\mathrm{CH}=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{OH}$", "image": null, "isCorrect": true}, {"id": "55UBN", "text": "$\\mathrm{CH}_3-\\mathrm{CH}=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{COOH}$", "image": null, "isCorrect": false}, {"id": "xNzxC", "text": "$\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{CHO}$", "image": null, "isCorrect": false}, {"id": "BVbq1", "text": "$\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{CH}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Lithium aluminium hydride ($\\mathrm{LiAlH}_4$) is a strong reducing agent that reduces aldehydes to primary alcohols.<br><br>It generally does not reduce isolated carbon-carbon double bonds ($\\mathrm{C}=\\mathrm{C}$).<br><br>In the given reactant $\\mathrm{CH}_3-\\mathrm{CH}=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{CHO}$, the double bond is isolated from the aldehyde group. Therefore, only the $-\\mathrm{CHO}$ group is reduced to $-\\mathrm{CH}_2\\mathrm{OH}$ while the double bond remains intact.<br><br>The reaction is:<br><br>$\\mathrm{CH}_3-\\mathrm{CH}=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{CHO} \\xrightarrow[\\text{(ii) } \\mathrm{H}_3\\mathrm{O}^{+}]{\\text{(i) } \\mathrm{LiAlH}_4} \\mathrm{CH}_3-\\mathrm{CH}=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{OH}$<br><br>Answer: $\\mathrm{CH}_3-\\mathrm{CH}=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{OH}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213500aee93fa0796d7cd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Which of the following compounds does not undergo haloform reaction?", "image": null}, "options": [{"id": "zvXqf", "text": "Ethanal", "image": null, "isCorrect": false}, {"id": "Sonwj", "text": "Propanal", "image": null, "isCorrect": true}, {"id": "v5IOe", "text": "Propanone", "image": null, "isCorrect": false}, {"id": "Qidj8", "text": "Butanone", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The haloform reaction is given by compounds containing a $CH_3-CO-$ group (methyl ketones) or compounds that can be oxidized to such a group (like $CH_3-CH(OH)-$ groups).<br><br>Ethanal ($CH_3-CHO$) contains a $CH_3-CO-$ group.<br><br>Propanone ($CH_3-CO-CH_3$) contains a $CH_3-CO-$ group.<br><br>Butanone ($CH_3-CO-CH_2-CH_3$) contains a $CH_3-CO-$ group.<br><br>Propanal ($CH_3-CH_2-CHO$) does not contain a $CH_3-CO-$ group and cannot be oxidized to one. Thus, it does not undergo the haloform reaction.<br><br>Answer: Propanal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fd0279619d9d8a30ec", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Identify the products of following reaction:\nMethanal + Benzene carbaldehyde $\\underset{\\text { i. conc. } \\mathrm{NaOH}^{\\mathrm{i}}}{\\stackrel{\\text { i. } \\mathrm{H}_3 \\mathrm{O}^{+}}{\\longrightarrow}}$", "image": null}, "options": [{"id": "dDzNQ", "text": "Methanoic acid and phenyl methanol", "image": null, "isCorrect": true}, {"id": "KOyoJ", "text": "Methanol and benzoic acid", "image": null, "isCorrect": false}, {"id": "WBYeQ", "text": "Methanol and phenol", "image": null, "isCorrect": false}, {"id": "gK16n", "text": "Methanoic acid and phenol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When a mixture of methanal and benzene carbaldehyde (aldehyde with no $\\alpha$-hydrogen) is treated with a strong base, methanal is oxidized to methanoic acid while benzene carbaldehyde is reduced to phenyl methanol.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/0--obukv-SvxBTjMxO8yTgrTtX5gY7h6P8t_NV5371s.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d60279619d9d8a2fbe", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "Which among the following colours is obtained in Schiff test of aldehydes?", "image": null}, "options": [{"id": "WvS2Y", "text": "Blue", "image": null, "isCorrect": false}, {"id": "lKH1M", "text": "Green", "image": null, "isCorrect": false}, {"id": "oGp7h", "text": "Magenta", "image": null, "isCorrect": true}, {"id": "EV3dD", "text": "Black", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When alcoholic solution of aldehyde is treated with few drops of Schiff's reagent, pink or red or magenta colour appears.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2612d0279619d9d8a2a6c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "Which of the following compounds is obtained when $\\mathrm{R}-\\mathrm{CHO}$ is treated with dilute nitric acid?", "image": null}, "options": [{"id": "9mazi", "text": "Ketones", "image": null, "isCorrect": false}, {"id": "wdzvX", "text": "Carboxylic acids", "image": null, "isCorrect": true}, {"id": "WG95f", "text": "Alcohols", "image": null, "isCorrect": false}, {"id": "Rb102", "text": "Amides", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{R}-\\mathrm{CH}=\\mathrm{O} \\underset{\\text { oxidation }}{\\stackrel{\\text { DilHNO}_3}{\\longrightarrow}} \\underset{\\text { Carboxylicacid }}{\\mathrm{R}-\\mathrm{COOH}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ff20279619d9d8a2080", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "Which of the following compounds reacts with ammonia to form urotropine?", "image": null}, "options": [{"id": "MXkA5", "text": "Ethanal", "image": null, "isCorrect": false}, {"id": "hhyXY", "text": "Methanal", "image": null, "isCorrect": true}, {"id": "fRrYr", "text": "Propanone", "image": null, "isCorrect": false}, {"id": "ULcUA", "text": "Propanal", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Methanal\nMethanal $(\\mathrm{HCHO})$ reacts with ammonia to form urotropine. Reaction is shown below:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/bC-kB8UVXrsAXvP9rETkXUXjFJ-5jtC6DYUxHYULKXg.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f360279619d9d8a1aa8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "Which of the following is a solid trimer of formaldehyde?", "image": null}, "options": [{"id": "wpF4r", "text": "Metaldehyde", "image": null, "isCorrect": false}, {"id": "VNRSb", "text": "Paraformaldehyde", "image": null, "isCorrect": false}, {"id": "GVTL3", "text": "Paraldehyde", "image": null, "isCorrect": false}, {"id": "aLcNq", "text": "Trioxane", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a263350279619d9d8a3d04", "title": "Reactions for ketones", "totalQuestions": 2, "questions": [{"_id": "6792140e0aee93fa0796dda2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Identify the reagent ' R ' used in the following reaction.\r\nKetone $\\xrightarrow{\\mathrm{R}}$ Semicarbazone", "image": null}, "options": [{"id": "zJOJC", "text": "$\\mathrm{NH}_2 \\mathrm{OH}$.", "image": null, "isCorrect": false}, {"id": "W43QX", "text": "$\\mathrm{NH}_2-\\mathrm{NH}-\\mathrm{CONH}_2$", "image": null, "isCorrect": true}, {"id": "FjGxs", "text": "$\\mathrm{NH}_2-\\mathrm{NH}-\\mathrm{C}_6 \\mathrm{H}_5$", "image": null, "isCorrect": false}, {"id": "NvNmB", "text": "$\\mathrm{NH}_2-\\mathrm{NH}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ketones react with semicarbazide to form semicarbazones.<br><br>The chemical formula of semicarbazide is $\\mathrm{NH}_2-\\mathrm{NH}-\\mathrm{CONH}_2$.<br><br>The reaction is given by:<br><br>$\\mathrm{R}_2\\mathrm{C}=\\mathrm{O} + \\mathrm{H}_2\\mathrm{N}-\\mathrm{NH}-\\mathrm{CONH}_2 \\rightarrow \\mathrm{R}_2\\mathrm{C}=\\mathrm{N}-\\mathrm{NH}-\\mathrm{CONH}_2 + \\mathrm{H}_2\\mathrm{O}$<br><br>Answer: $\\mathrm{NH}_2-\\mathrm{NH}-\\mathrm{CONH}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25efd0279619d9d8a18e3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "Which of the following does not given yellow soild on treatment with sodium hypoiodite?", "image": null}, "options": [{"id": "KAeeX", "text": "Acetophenone", "image": null, "isCorrect": false}, {"id": "bxRXx", "text": "Pentan – 3 – one", "image": null, "isCorrect": true}, {"id": "R32KB", "text": "Pentan – 2 –one", "image": null, "isCorrect": false}, {"id": "PsYUn", "text": "Ethanal", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Pentan – 3 – one does not give yellow solid on treatment with sodium hypoiodite because this reaction is given by only methyl ketones. Ketones that have at least one methyl group linked to the carbonyl carbon atom are oxidised by sodium hypoiodite to sodium salts of corresponding carboxylic acids. This reaction is called iodoform reaction.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "6792168e0aee93fa0796e199", "title": "Tests for aldehyde and ketones", "totalQuestions": 11, "questions": [{"_id": "6abb88d415a9fc0fc8c1475a", "type": "singleCorrect", "question": {"text": "Which of the following compounds shows Silver mirror test ?", "image": null}, "options": [{"id": "2Oh06", "label": "A", "text": "Acetone", "isCorrect": false, "image": null}, {"id": "8U5gc", "label": "B", "text": "Acetaldehyde", "isCorrect": true, "image": null}, {"id": "hvId2", "label": "C", "text": "Ethanol", "isCorrect": false, "image": null}, {"id": "msMQE", "label": "D", "text": "Benzophenone", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The Silver mirror test is given by Tollens' reagent, which is an ammoniacal silver nitrate solution.<br><br>Aldehydes are oxidized by Tollens' reagent to their corresponding carboxylate ions, and $Ag^+$ is reduced to metallic silver, which forms a silver mirror on the inner walls of the test tube.<br><br>Ketones and alcohols generally do not give this test.<br><br>Among the given options, Acetaldehyde is an aldehyde and thus gives a positive Silver mirror test. Acetone and Benzophenone are ketones, and Ethanol is an alcohol.<br><br>The reaction is:<br>$CH_3CHO + 2[Ag(NH_3)_2]^+ + 3OH^- \\rightarrow CH_3COO^- + 2Ag \\downarrow + 4NH_3 + 2H_2O$<br><br>Answer: Acetaldehyde", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885415a9fc0fc8c142a9", "type": "singleCorrect", "question": {"text": "Which of the following compounds develops a pink color with Schiff's reagent?", "image": null}, "options": [{"id": "KHqbs", "label": "A", "text": "Acetaldehyde", "isCorrect": true, "image": null}, {"id": "WNtxZ", "label": "B", "text": "Acetone", "isCorrect": false, "image": null}, {"id": "AU3yr", "label": "C", "text": "Acetic acid", "isCorrect": false, "image": null}, {"id": "EnrZz", "label": "D", "text": "Methyl acetate", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Schiff's reagent is used as a chemical test to distinguish aldehydes from ketones.<br><br>When an aldehyde is treated with Schiff's reagent, it restores the original pink or magenta color of the dye. Ketones, carboxylic acids, and esters do not give this test.<br><br>Among the given options, acetaldehyde is an aldehyde, while acetone is a ketone, acetic acid is a carboxylic acid, and methyl acetate is an ester.<br><br>Therefore, acetaldehyde develops a pink color with Schiff's reagent.<br><br>Answer: Acetaldehyde", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c315a9fc0fc8c146c3", "type": "singleCorrect", "question": {"text": "Which of the following tests is used to identify ketones ?", "image": null}, "options": [{"id": "Tl7PL", "label": "A", "text": "Sodium nitroprusside test", "isCorrect": true, "image": null}, {"id": "EKGQt", "label": "B", "text": "Tollen's test", "isCorrect": false, "image": null}, {"id": "mLuWu", "label": "C", "text": "Schiff test", "isCorrect": false, "image": null}, {"id": "asIRz", "label": "D", "text": "Felhing test", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Tollen's test, Schiff's test, and Fehling's test are specifically used to identify aldehydes, as aldehydes give positive results for these tests while ketones do not.<br><br>Sodium nitroprusside test is used to identify ketones. When a ketone is treated with sodium nitroprusside in an alkaline medium, it forms a red or wine-red coloured complex due to the presence of an $\\alpha$-hydrogen atom.<br><br>Therefore, the sodium nitroprusside test is used to identify ketones.<br><br>Answer: Sodium nitroprusside test", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ab8c30a4553e1bdb90", "type": "singleCorrect", "question": {"text": "Which of the following compounds exhibits Schiff test?", "image": null}, "options": [{"id": "Os8LA", "label": "A", "text": "Ketones", "isCorrect": false, "image": null}, {"id": "88FwZ", "label": "B", "text": "Carboxylic acids", "isCorrect": false, "image": null}, {"id": "orLCh", "label": "C", "text": "Aldehydes", "isCorrect": true, "image": null}, {"id": "PSAeb", "label": "D", "text": "Ethers", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Schiff's reagent is a dilute solution of rosaniline hydrochloride (magenta dye) whose pink colour has been discharged by passing $SO_2$.<br><br>When an aldehyde is treated with Schiff's reagent, the pink or magenta colour is restored.<br><br>Ketones, carboxylic acids, and ethers do not respond to this test.<br><br>Therefore, aldehydes exhibit the Schiff test.<br><br>Answer: Aldehydes", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3378c30a4553e1be16d", "type": "singleCorrect", "question": {"text": "Which of following observations is found in Tollens test for aldehydes?", "image": null}, "options": [{"id": "ASawj", "label": "A", "text": "The formation of pink or magenta color upon the addition of the reagent to the sample solution.", "isCorrect": false, "image": null}, {"id": "jPd1G", "label": "B", "text": "Formation of an Ag layer on sides of test tube upon addition and warming of the reagent.", "isCorrect": true, "image": null}, {"id": "Iv8fV", "label": "C", "text": "Formation of brick-red precipitate upon heating with reagent.", "isCorrect": false, "image": null}, {"id": "leKBA", "label": "D", "text": "Appearance of red color upon shaking with reagent.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Tollens' reagent is an ammoniacal silver nitrate solution, $[Ag(NH_3)_2]^+$.<br><br>When an aldehyde is warmed with Tollens' reagent, the aldehyde is oxidized to the corresponding carboxylate ion, while the silver ions are reduced to metallic silver.<br><br>$RCHO + 2[Ag(NH_3)_2]^+ + 3OH^- \\rightarrow RCOO^- + 2Ag\\downarrow + 4NH_3 + 2H_2O$<br><br>The metallic silver deposits on the inner walls of the test tube, forming a characteristic silver mirror or an Ag layer. This observation confirms the presence of an aldehyde group.<br><br>The formation of a pink or magenta color is observed in Schiff's test, and a brick-red precipitate is observed in Fehling's test.<br><br>Answer: Formation of an Ag layer on sides of test tube upon addition and warming of the reagent.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29e8c30a4553e1bdafa", "type": "singleCorrect", "question": {"text": "Which of the following compounds dose NOT respond positively to the iodoform test ?", "image": null}, "options": [{"id": "b24RA", "label": "A", "text": "Acetaldehyde", "isCorrect": false, "image": null}, {"id": "KgUhr", "label": "B", "text": "Propan-2-ol", "isCorrect": false, "image": null}, {"id": "gOjDp", "label": "C", "text": "Propanone", "isCorrect": false, "image": null}, {"id": "KWXgo", "label": "D", "text": "Pentan-3-one", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The iodoform test is given by compounds containing a methyl ketone group ($CH_3-CO-$) or a secondary alcohol group with a terminal methyl ($CH_3-CH(OH)-$), which gets oxidized to a methyl ketone by the reagent.<br><br>Acetaldehyde ($CH_3-CHO$) contains a $CH_3-CO-$ group and gives a positive test.<br><br>Propan-2-ol ($CH_3-CH(OH)-CH_3$) contains a $CH_3-CH(OH)-$ group and gives a positive test.<br><br>Propanone ($CH_3-CO-CH_3$) contains a $CH_3-CO-$ group and gives a positive test.<br><br>Pentan-3-one ($CH_3-CH_2-CO-CH_2-CH_3$) does not contain a $CH_3-CO-$ group. Therefore, it does not respond positively to the iodoform test.<br><br>Answer: Pentan-3-one", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29d8c30a4553e1bdaf5", "type": "singleCorrect", "question": {"text": "Which of the following compounds can not form iodoform?", "image": null}, "options": [{"id": "d0d2m", "label": "A", "text": "Ethyl methyl ketone", "isCorrect": false, "image": null}, {"id": "vnOsv", "label": "B", "text": "Isopropyl alcohol", "isCorrect": false, "image": null}, {"id": "u3veG", "label": "C", "text": "3-Methyl - 2- butanone", "isCorrect": false, "image": null}, {"id": "b6AQP", "label": "D", "text": "Isobutyl alcohol", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The iodoform test is given by compounds containing either a methyl ketone group ($CH_3-CO-$) or a secondary alcohol group with a terminal methyl ($CH_3-CH(OH)-$ group), as well as ethanol and acetaldehyde.<br><br>Ethyl methyl ketone ($CH_3-CO-CH_2-CH_3$) contains a $CH_3-CO-$ group, so it gives a positive iodoform test.<br><br>Isopropyl alcohol ($CH_3-CH(OH)-CH_3$) contains a $CH_3-CH(OH)-$ group, so it gives a positive iodoform test.<br><br>3-Methyl-2-butanone ($CH_3-CO-CH(CH_3)_2$) contains a $CH_3-CO-$ group, so it gives a positive iodoform test.<br><br>Isobutyl alcohol ($(CH_3)_2CH-CH_2-OH$) is a primary alcohol (other than ethanol) and does not contain a $CH_3-CH(OH)-$ group. Upon oxidation, it forms isobutyraldehyde, which lacks a $CH_3-CO-$ group. Therefore, it does not give the iodoform test.<br><br>Answer: Isobutyl alcohol", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b98c30a4553e1bdc26", "type": "singleCorrect", "question": {"text": "Acetaldehyde, when heated in the presence of sodium hydroxide and iodine forms", "image": null}, "options": [{"id": "cCIBw", "label": "A", "text": "Sodium formate", "isCorrect": true, "image": null}, {"id": "N5xIa", "label": "B", "text": "Sodium acetate", "isCorrect": false, "image": null}, {"id": "jZaKt", "label": "C", "text": "Ethanol", "isCorrect": false, "image": null}, {"id": "2cPJX", "label": "D", "text": "Iodoethane", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Acetaldehyde ($CH_3CHO$) contains a $CH_3-CO-$ group, so it undergoes the iodoform reaction when heated with iodine and sodium hydroxide.<br><br>The reaction proceeds as follows:<br><br>$CH_3CHO + 3I_2 + 4NaOH \\xrightarrow{\\Delta} CHI_3 + HCOONa + 3NaI + 3H_2O$<br><br>The products formed are iodoform ($CHI_3$) as a yellow precipitate and sodium formate ($HCOONa$).<br><br>Answer: Sodium formate", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bccbf9280d7f9932c81", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following does NOT exhibit haloform reaction?", "image": null}, "options": [{"id": "5j1IE", "text": "Ethanal", "image": null, "isCorrect": false}, {"id": "oApw9", "text": "Propanal", "image": null, "isCorrect": true}, {"id": "8pT51", "text": "Propanone", "image": null, "isCorrect": false}, {"id": "Pr2iK", "text": "Butanone", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The haloform reaction is given by compounds containing a methyl ketone group, i.e., $CH_3-CO-$ group, or compounds that can be oxidized to contain this group (like $CH_3-CH(OH)-$ group).<br><br>Ethanal ($CH_3-CHO$) contains the $CH_3-CO-$ group.<br><br>Propanone ($CH_3-CO-CH_3$) contains the $CH_3-CO-$ group.<br><br>Butanone ($CH_3-CO-CH_2-CH_3$) contains the $CH_3-CO-$ group.<br><br>Propanal ($CH_3-CH_2-CHO$) does not contain the $CH_3-CO-$ group. Therefore, it does not exhibit the haloform reaction.<br><br>Answer: Propanal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b37bf9280d7f9932735", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following compounds forms pink colouration on addition of Schiff's reagent?", "image": null}, "options": [{"id": "OXyDh", "text": "Propanol", "image": null, "isCorrect": false}, {"id": "8WRgA", "text": "Propanone", "image": null, "isCorrect": false}, {"id": "4BXaR", "text": "Propanal", "image": null, "isCorrect": true}, {"id": "X6wyB", "text": "Propanoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Schiff's reagent is used as a qualitative test to distinguish aldehydes from ketones.<br><br>Aldehydes restore the pink or magenta colour of Schiff's reagent, whereas ketones, alcohols, and carboxylic acids do not give this test.<br><br>Among the given options, propanal is an aldehyde. Therefore, it forms a pink colouration on addition of Schiff's reagent.<br><br>Answer: Propanal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213770aee93fa0796d8fb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which of the following compounds when treated with ammoniacal silver nitrate exhibits silver mirror test?", "image": null}, "options": [{"id": "niBdi", "text": "Ethanol", "image": null, "isCorrect": false}, {"id": "qojW5", "text": "Ethanal", "image": null, "isCorrect": true}, {"id": "0z37j", "text": "Ethoxyethane", "image": null, "isCorrect": false}, {"id": "iMDIe", "text": "Ethanoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ammoniacal silver nitrate is known as Tollens' reagent. It is a mild oxidizing agent used to distinguish aldehydes from ketones and other functional groups.<br><br>Tollens' reagent oxidizes aldehydes to their corresponding carboxylate ions and gets reduced to metallic silver, which deposits on the inner walls of the test tube to form a silver mirror.<br><br>Among the given options, ethanal is an aldehyde. Ethanol (an alcohol), ethoxyethane (an ether), and ethanoic acid (a carboxylic acid) do not react with Tollens' reagent.<br><br>The reaction for ethanal is:<br>$CH_3CHO + 2[Ag(NH_3)_2]^+ + 3OH^- \\rightarrow CH_3COO^- + 2Ag\\downarrow + 4NH_3 + 2H_2O$<br><br>Thus, ethanal exhibits the silver mirror test.<br><br>Answer: Ethanal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "68871e75bf9280d7f9933080", "title": "Method of Preparation for Both Aldehydes and Ketones", "totalQuestions": 3, "questions": [{"_id": "6a44d2d68c30a4553e1bdd52", "type": "singleCorrect", "question": {"text": "Identify the name of the above reaction.<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/15_april_shift_2__q92_d1.png\" />", "image": null}, "options": [{"id": "7NGXa", "label": "A", "text": "Etard reaction", "isCorrect": false, "image": null}, {"id": "UNfxI", "label": "B", "text": "Gatterman-Koch formylation reaction", "isCorrect": true, "image": null}, {"id": "lajOH", "label": "C", "text": "Stephen reaction", "isCorrect": false, "image": null}, {"id": "pPGhk", "label": "D", "text": "Rosenmund reaction", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction shows the conversion of benzene to benzaldehyde using carbon monoxide ($CO$) and hydrogen chloride ($HCl$) in the presence of anhydrous aluminum chloride ($AlCl_3$) under high pressure.<br><br>This specific transformation is known as the Gatterman-Koch formylation reaction. In this reaction, a formyl cation is generated in situ from $CO$, $HCl$, and the Lewis acid catalyst ($AlCl_3$), which then undergoes electrophilic aromatic substitution with benzene to form benzaldehyde.<br><br>Let us review the other options:<br>1. Etard reaction: Involves the oxidation of toluene to benzaldehyde using chromyl chloride ($CrO_2Cl_2$).<br>2. Stephen reaction: Involves the reduction of nitriles to aldehydes using tin(II) chloride ($SnCl_2$) and $HCl$, followed by hydrolysis.<br>3. Rosenmund reaction: Involves the catalytic hydrogenation of acid chlorides to aldehydes using palladium on barium sulfate ($Pd/BaSO_4$).<br><br>Therefore, the correct name for the given reaction is the Gatterman-Koch formylation reaction.<br><br>Answer: Gatterman-Koch formylation reaction", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3638c30a4553e1be331", "type": "singleCorrect", "question": {"text": "In Gatterman reaction, which of the following catalyst is used?", "image": null}, "options": [{"id": "4F9XH", "label": "A", "text": "CO, HCl and anhyd. $\\text{AlCl}_3$", "isCorrect": false, "image": null}, {"id": "xW2OC", "label": "B", "text": "Copper powder and HBr", "isCorrect": true, "image": null}, {"id": "LY7Ti", "label": "C", "text": "Cu + Aq. $\\text{NaNO}_2$", "isCorrect": false, "image": null}, {"id": "RKCdd", "label": "D", "text": "KOH + $\\text{Br}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The Gatterman reaction is a modification of the Sandmeyer reaction used for the synthesis of aryl halides from aryl diazonium salts. In this reaction, finely divided copper powder is used as a catalyst along with a halogen acid such as $\\text{HCl}$ or $\\text{HBr}$.<br><br>$\\text{Ar-N}_2^+ \\text{X}^- \\xrightarrow{\\text{Cu powder / HX}} \\text{Ar-X} + \\text{N}_2$<br><br>Option (318007) represents the reagents for the Gatterman-Koch formylation reaction.<br><br>Option (318010) represents the reagents for the Hoffmann bromamide degradation reaction.<br><br>Therefore, copper powder and $\\text{HBr}$ are used in the Gatterman reaction.<br><br>Answer: Copper powder and HBr", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b24bf9280d7f993269d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following reagents is used in Gatterman-Koch formylation of arene?", "image": null}, "options": [{"id": "G6wjA", "text": "$\\mathrm{AlH}(\\mathrm{i}-\\mathrm{Bu})_2$", "image": null, "isCorrect": false}, {"id": "5WJsC", "text": "$\\mathrm{CO}, \\mathrm{HCl}$ (anhyd. $\\mathrm{AlCl}_3$ )", "image": null, "isCorrect": true}, {"id": "J1vVb", "text": "$\\mathrm{CrO}_2 \\mathrm{Cl}_2\\left(\\mathrm{CS}_2\\right)$", "image": null, "isCorrect": false}, {"id": "qtDfc", "text": "DIBAI - H", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Gatterman-Koch formylation is a reaction in which an arene (such as benzene) is treated with carbon monoxide ($\\mathrm{CO}$) and hydrogen chloride ($\\mathrm{HCl}$) in the presence of a Lewis acid catalyst like anhydrous aluminum chloride ($\\mathrm{AlCl}_3$) and cuprous chloride ($\\mathrm{CuCl}$) to form benzaldehyde.<br><br>$\\mathrm{CrO}_2\\mathrm{Cl}_2$ in $\\mathrm{CS}_2$ is used in the Etard reaction to convert toluene to benzaldehyde.<br><br>DIBAL-H ($\\mathrm{AlH}(\\mathrm{i}-\\mathrm{Bu})_2$) is a reducing agent used to reduce nitriles or esters to aldehydes.<br><br>Therefore, the reagent used in Gatterman-Koch formylation is $\\mathrm{CO}, \\mathrm{HCl}$ (anhyd. $\\mathrm{AlCl}_3$).<br><br>Answer: $\\mathrm{CO}, \\mathrm{HCl}$ (anhyd. $\\mathrm{AlCl}_3$ )", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 9, "topicId": "65a263340279619d9d8a3d00", "title": "Tests for Aldehyde and Ketones", "totalQuestions": 10, "questions": [{"_id": "65a261c20279619d9d8a2f1e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "Which of the following on reaction with ammoniacal silver nitrate forms silver precipitate?", "image": null}, "options": [{"id": "WXYbC", "text": "Ethanol", "image": null, "isCorrect": false}, {"id": "awFOQ", "text": "Ethanal", "image": null, "isCorrect": true}, {"id": "ryAB7", "text": "Ethoxyethane", "image": null, "isCorrect": false}, {"id": "LGEMU", "text": "Ethanoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Tollens' reagent oxidises aldehyde to the corresponding carboxylate anion. Silver gets precipitated as greyish black precipitate.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2619f0279619d9d8a2e05", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Which among the following compounds does not exhibit iodoform test?", "image": null}, "options": [{"id": "Rrhub", "text": "Acetaldehyde", "image": null, "isCorrect": false}, {"id": "c8Asa", "text": "sec-Butyl alcohol", "image": null, "isCorrect": false}, {"id": "g5EuF", "text": "n-Butyl alcohol", "image": null, "isCorrect": true}, {"id": "0S1FD", "text": "Acetophenone", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/MMNidmuNUI8eXNZ8TV-AFRbweHM5VOhbal0jKAT4crQ.original.fullsize.png\"><br>\nType compound exhibit iodoform test\n$\\mathrm{H}_3-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{CH}-\\mathrm{OH}$\nn-butyl alcohol has no resemblance with above structure.\nThus, it do not show iodoform test.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalS     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
