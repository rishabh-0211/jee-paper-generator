rtName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885415a9fc0fc8c142ab", "type": "singleCorrect", "question": {"text": "Which of the following compounds forms $4$-Methylpent-$3$-en-$2$-one by aldol condensation on further dehydration.", "image": null}, "options": [{"id": "7HVSG", "label": "A", "text": "Two molecules of acetone", "isCorrect": true, "image": null}, {"id": "fxlKX", "label": "B", "text": "Two molecules of acetaldehyde", "isCorrect": false, "image": null}, {"id": "jfSjd", "label": "C", "text": "Acetaldehyde and formaldehyde", "isCorrect": false, "image": null}, {"id": "wMbng", "label": "D", "text": "Acetaldehyde and acetone", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The structure of $4$-methylpent-$3$-en-$2$-one is $\\text{CH}_3-\\text{C}(\\text{CH}_3)=\\text{CH}-\\text{CO}-\\text{CH}_3$.<br><br>In an aldol condensation followed by dehydration, an $\\alpha,\\beta$-unsaturated carbonyl compound is formed. To identify the reactants, we cleave the $\\text{C}=\\text{C}$ double bond. The $\\alpha$-carbon (adjacent to the carbonyl group) gains two hydrogen atoms, and the $\\beta$-carbon gains an oxygen atom to form a carbonyl group.<br><br>Cleaving the double bond in $4$-methylpent-$3$-en-$2$-one yields two molecules of $\\text{CH}_3-\\text{CO}-\\text{CH}_3$ (acetone).<br><br>Therefore, two molecules of acetone undergo aldol condensation to form diacetone alcohol, which on dehydration yields $4$-methylpent-$3$-en-$2$-one (also known as mesityl oxide).<br><br>Answer: Two molecules of acetone", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887415a9fc0fc8c143d7", "type": "singleCorrect", "question": {"text": "Which of the following compounds, when reacted with ketones forms oxime?", "image": null}, "options": [{"id": "A82JV", "label": "A", "text": "Hydrazine", "isCorrect": false, "image": null}, {"id": "ROW69", "label": "B", "text": "Semicarbazide", "isCorrect": false, "image": null}, {"id": "dDqvx", "label": "C", "text": "Hydroxyl amine", "isCorrect": true, "image": null}, {"id": "YIx4s", "label": "D", "text": "Phenyl hydrazine", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Ketones react with hydroxyl amine ($NH_2OH$) to form oximes.<br><br>$R_2C=O + NH_2OH \\rightarrow R_2C=N-OH + H_2O$<br><br>Hydrazine reacts with ketones to form hydrazones, semicarbazide forms semicarbazones, and phenyl hydrazine forms phenylhydrazones.<br><br>Answer: Hydroxyl amine", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887315a9fc0fc8c143d6", "type": "singleCorrect", "question": {"text": "Which of the following compounds undergoes Cannizzaro's reaction?", "image": null}, "options": [{"id": "ngU6b", "label": "A", "text": "Acetaldehyde", "isCorrect": false, "image": null}, {"id": "EcC5v", "label": "B", "text": "Formaldehyde", "isCorrect": true, "image": null}, {"id": "fdfZ5", "label": "C", "text": "Propionaldehyde", "isCorrect": false, "image": null}, {"id": "NH4f7", "label": "D", "text": "Butyraldehyde", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Cannizzaro's reaction is a characteristic reaction of aldehydes that do not contain any $\\alpha$-hydrogen atom.<br><br>Acetaldehyde ($CH_3CHO$), propionaldehyde ($CH_3CH_2CHO$), and butyraldehyde ($CH_3CH_2CH_2CHO$) all possess $\\alpha$-hydrogen atoms and thus undergo aldol condensation instead of Cannizzaro's reaction.<br><br>Formaldehyde ($HCHO$) lacks an $\\alpha$-hydrogen atom and therefore undergoes Cannizzaro's reaction when treated with a concentrated base, yielding methanol and formate ion.<br><br>Answer: Formaldehyde", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888315a9fc0fc8c1446d", "type": "singleCorrect", "question": {"text": "What types of compounds are formed when alkanones react with ethane-1,2-diol?", "image": null}, "options": [{"id": "j6VeB", "label": "A", "text": "hemiacetals", "isCorrect": false, "image": null}, {"id": "BwHs6", "label": "B", "text": "cyclic ketals", "isCorrect": true, "image": null}, {"id": "lHNzl", "label": "C", "text": "cyclic acetals", "isCorrect": false, "image": null}, {"id": "S4dC7", "label": "D", "text": "acetals", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Alkanones (ketones) react with ethane-1,2-diol (ethylene glycol) in the presence of dry hydrogen chloride gas to form cyclic ketals.<br><br>The reaction proceeds via the nucleophilic addition of the diol to the carbonyl carbon of the ketone, followed by the elimination of a water molecule. Since a diol is used, both hydroxyl groups react with the same carbonyl carbon, resulting in a five-membered cyclic structure known as a cyclic ketal (or ethylene glycol ketal).<br><br>Answer: cyclic ketals", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886415a9fc0fc8c14341", "type": "singleCorrect", "question": {"text": "Which of the following carbonyl compounds is most reactive toward nucleophilic addition?", "image": null}, "options": [{"id": "l7uMw", "label": "A", "text": "Ethanal", "isCorrect": false, "image": null}, {"id": "yEfht", "label": "B", "text": "Benzaldehyde", "isCorrect": false, "image": null}, {"id": "a5uuI", "label": "C", "text": "Methanal", "isCorrect": true, "image": null}, {"id": "EqjRJ", "label": "D", "text": "Propanone", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reactivity of carbonyl compounds towards nucleophilic addition depends on both steric and electronic factors.<br><br>Steric factor: As the number and size of alkyl or aryl groups attached to the carbonyl carbon increase, steric hindrance increases, making the approach of the nucleophile more difficult.<br><br>Electronic factor: Alkyl groups exert a $+I$ (electron-donating) effect, which decreases the magnitude of the positive charge on the carbonyl carbon, thereby reducing its electrophilicity. Aryl groups also decrease reactivity due to resonance stabilization of the carbonyl group.<br><br>Methanal ($\\text{HCHO}$) has two small hydrogen atoms and no electron-donating alkyl or aryl groups attached to the carbonyl carbon. It has the least steric hindrance and the highest electrophilicity at the carbonyl carbon.<br><br>Thus, the order of reactivity towards nucleophilic addition is: Methanal $>$ Ethanal $>$ Benzaldehyde $>$ Propanone.<br><br>Therefore, methanal is the most reactive among the given compounds.<br><br>Answer: Methanal", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886415a9fc0fc8c1433f", "type": "singleCorrect", "question": {"text": "Identify the product obtained when benzaldehyde is oxidized by $\\text{KMnO}_4$.", "image": null}, "options": [{"id": "BOHEE", "label": "A", "text": "Benzoic acid", "isCorrect": true, "image": null}, {"id": "WLLxF", "label": "B", "text": "Benzyl alcohol", "isCorrect": false, "image": null}, {"id": "XD7DD", "label": "C", "text": "Toluene", "isCorrect": false, "image": null}, {"id": "VE2gC", "label": "D", "text": "Benzene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Benzaldehyde ($\\text{C}_6\\text{H}_5\\text{CHO}$) undergoes oxidation when treated with a strong oxidizing agent such as potassium permanganate ($\\text{KMnO}_4$).<br><br>The aldehyde group ($-\\text{CHO}$) is oxidized to a carboxylic acid group ($-\\text{COOH}$).<br><br>The chemical reaction is:<br>$\\text{C}_6\\text{H}_5\\text{CHO} \\xrightarrow{\\text{KMnO}_4} \\text{C}_6\\text{H}_5\\text{COOH}$<br><br>Thus, the product obtained is benzoic acid.<br><br>Answer: Benzoic acid", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883415a9fc0fc8c1417f", "type": "singleCorrect", "question": {"text": "$\\underset{\\text{(Carbonyl group in aldehydes and ketones)}}{\\text{C}=\\text{O}} + 4[H] \\xrightarrow[\\Delta]{\\text{Zn-Hg, conc. HCl}} \\underset{\\text{(Methylene group)}}{-\\text{CH}_2} + \\text{H}_2\\text{O}$<br>Identify the name of above reaction.", "image": null}, "options": [{"id": "jBhgD", "label": "A", "text": "Mendius reduction", "isCorrect": false, "image": null}, {"id": "RC2ST", "label": "B", "text": "Clemmensen Reduction", "isCorrect": true, "image": null}, {"id": "AFize", "label": "C", "text": "Wolf-Kishner reduction", "isCorrect": false, "image": null}, {"id": "SyjoJ", "label": "D", "text": "Hofmann degradation", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reduction of a carbonyl group (in aldehydes and ketones) to a methylene group ($-\\text{CH}_2-$) using zinc amalgam (Zn-Hg) and concentrated hydrochloric acid (conc. HCl) is known as the Clemmensen reduction.<br><br>Wolf-Kishner reduction achieves the same transformation but uses hydrazine ($\\text{NH}_2\\text{NH}_2$) and a strong base (like KOH) with heat.<br><br>Mendius reduction is the reduction of nitriles to primary amines using sodium and ethanol.<br><br>Hofmann degradation converts a primary amide to a primary amine with one less carbon atom using $\\text{Br}_2$ and NaOH.<br><br>Answer: Clemmensen Reduction", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883415a9fc0fc8c1417e", "type": "singleCorrect", "question": {"text": "Which of the following statements regarding aldol condensation is TRUE?", "image": null}, "options": [{"id": "U5y7n", "label": "A", "text": "It is a nucleophilic addition elimination reaction.", "isCorrect": true, "image": null}, {"id": "WPOnX", "label": "B", "text": "It is self redox reaction.", "isCorrect": false, "image": null}, {"id": "7tZA3", "label": "C", "text": "It is a disproportionation reaction.", "isCorrect": false, "image": null}, {"id": "kaazu", "label": "D", "text": "It is exhibited by lower aldehydes only.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Aldol condensation involves two main steps:<br><br>1. Nucleophilic addition of an enolate ion to the carbonyl carbon of another aldehyde or ketone molecule to form a $\\beta$-hydroxy carbonyl compound (aldol).<br><br>2. Elimination of a water molecule (dehydration) from the aldol to form an $\\alpha,\\beta$-unsaturated carbonyl compound.<br><br>Thus, the overall process is a nucleophilic addition-elimination reaction.<br><br>Cannizzaro reaction is a self-redox or disproportionation reaction, which makes the second and third statements incorrect for aldol condensation.<br><br>Aldol condensation is exhibited by all aldehydes and ketones containing at least one $\\alpha$-hydrogen atom, not just lower aldehydes, making the fourth statement incorrect.<br><br>Answer: It is a nucleophilic addition elimination reaction.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883415a9fc0fc8c1417d", "type": "singleCorrect", "question": {"text": "Which of the following aldehydes exhibits Cannizzaro reaction when heated with strong alkali?", "image": null}, "options": [{"id": "hDNvf", "label": "A", "text": "Benzaldehyde", "isCorrect": true, "image": null}, {"id": "rVFbH", "label": "B", "text": "Acetaldehyde", "isCorrect": false, "image": null}, {"id": "rWIpr", "label": "C", "text": "Propionaldehyde", "isCorrect": false, "image": null}, {"id": "dT6vW", "label": "D", "text": "Butyraldehyde", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Aldehydes which do not contain an $\\alpha$-hydrogen atom undergo the Cannizzaro reaction when heated with a strong alkali.<br><br>Benzaldehyde ($C_6H_5CHO$) does not have any $\\alpha$-hydrogen atom, hence it exhibits the Cannizzaro reaction.<br><br>Acetaldehyde ($CH_3CHO$), propionaldehyde ($CH_3CH_2CHO$), and butyraldehyde ($CH_3CH_2CH_2CHO$) all contain $\\alpha$-hydrogen atoms and thus undergo aldol condensation instead of the Cannizzaro reaction.<br><br>Answer: Benzaldehyde", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883415a9fc0fc8c1417c", "type": "singleCorrect", "question": {"text": "Which of the following reagents forms semicarbazone when treated with ketones?", "image": null}, "options": [{"id": "UxuUs", "label": "A", "text": "Hydroxyl amine", "isCorrect": false, "image": null}, {"id": "H1sci", "label": "B", "text": "Hydrazine", "isCorrect": false, "image": null}, {"id": "E7wuK", "label": "C", "text": "Phenyl hydrazine", "isCorrect": false, "image": null}, {"id": "pSunz", "label": "D", "text": "Semicarbazide", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Ketones react with semicarbazide to form semicarbazones.<br><br>The general reaction is:<br>$R_2C=O + H_2N-NH-CO-NH_2 \\rightarrow R_2C=N-NH-CO-NH_2 + H_2O$<br><br>Other reagents and their products with ketones are:<br>Hydroxyl amine ($NH_2OH$) forms oximes.<br>Hydrazine ($NH_2NH_2$) forms hydrazones.<br>Phenyl hydrazine ($PhNHNH_2$) forms phenylhydrazones.<br><br>Answer: Semicarbazide", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ab8c30a4553e1bdb8f", "type": "singleCorrect", "question": {"text": "Which of the following reactions is preferentially used to prepare the corresponding paraffins from alkanone?", "image": null}, "options": [{"id": "EmQgH", "label": "A", "text": "Clemmensen reduction", "isCorrect": true, "image": null}, {"id": "EwMCU", "label": "B", "text": "Etard reaction", "isCorrect": false, "image": null}, {"id": "LEnqq", "label": "C", "text": "Rosenmund reduction", "isCorrect": false, "image": null}, {"id": "3BG0v", "label": "D", "text": "Haloform reaction", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Alkanones (ketones) are reduced to the corresponding paraffins (alkanes) by Clemmensen reduction. In this reaction, the carbonyl group ($>C=O$) is converted into a methylene group ($>CH_2$) using zinc amalgam ($Zn-Hg$) and concentrated hydrochloric acid ($HCl$).<br><br>Etard reaction is used to oxidize toluene to benzaldehyde.<br><br>Rosenmund reduction is used to convert acid chlorides into aldehydes.<br><br>Haloform reaction is used to convert methyl ketones into a haloform and a carboxylic acid salt.<br><br>Answer: Clemmensen reduction", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d68c30a4553e1bdd53", "type": "singleCorrect", "question": {"text": "Acetone on heating with $\\text{CrO}_3$ mainly forms,", "image": null}, "options": [{"id": "H7agy", "label": "A", "text": "Acetic acid", "isCorrect": true, "image": null}, {"id": "uLV44", "label": "B", "text": "Ethyl alcohol", "isCorrect": false, "image": null}, {"id": "wVUNm", "label": "C", "text": "Toluene", "isCorrect": false, "image": null}, {"id": "XKRjk", "label": "D", "text": "Dimethyl ether", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Ketones are generally resistant to oxidation under normal conditions. However, on vigorous heating with strong oxidizing agents like $\\text{CrO}_3$, they undergo cleavage of the C-C bond to form carboxylic acids with fewer carbon atoms.<br><br>Acetone ($\\text{CH}_3\\text{COCH}_3$) undergoes oxidation to form a two-carbon carboxylic acid and a one-carbon fragment which further oxidizes to carbon dioxide and water.<br><br>$\\text{CH}_3\\text{COCH}_3 \\xrightarrow{\\text{CrO}_3, \\Delta} \\text{CH}_3\\text{COOH} + \\text{CO}_2 + \\text{H}_2\\text{O}$<br><br>The main product formed is acetic acid.<br><br>Answer: Acetic acid", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3378c30a4553e1be16a", "type": "singleCorrect", "question": {"text": "An organic compound $\\text{CH}_3\\text{-CH=CH-CH}_2\\text{-CHO}$ is taken in two different containers A and B. Sample in A is treated with $\\text{H}_2$ / Ni forming new compound P. Sample in B is treated with $\\text{LiAlH}_4$ and hydrolyzed further forming new compound Q. Identify P and Q.", "image": null}, "options": [{"id": "F9Kw6", "label": "A", "text": "$\\text{P} = \\text{Q} = \\text{CH}_3\\text{-CH=CH-CH}_2\\text{-CH}_2\\text{OH}$", "isCorrect": false, "image": null}, {"id": "rCEJx", "label": "B", "text": "$\\text{P} = \\text{Q} = \\text{CH}_3(\\text{CH}_2)_3\\text{CH}_2\\text{OH}$", "isCorrect": false, "image": null}, {"id": "94N7t", "label": "C", "text": "$\\text{P} = \\text{CH}_3(\\text{CH}_2)_3\\text{CHO}$ and $\\text{Q} = \\text{CH}_3(\\text{CH}_2)_3\\text{CH}_2\\text{OH}$", "isCorrect": false, "image": null}, {"id": "NFj2H", "label": "D", "text": "$\\text{P} = \\text{CH}_3(\\text{CH}_2)_3\\text{CH}_2\\text{OH}$ and $\\text{Q} = \\text{CH}_3\\text{-CH=CH-CH}_2\\text{-CH}_2\\text{OH}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given organic compound is $\\text{CH}_3\\text{-CH=CH-CH}_2\\text{-CHO}$.<br><br>When treated with $\\text{H}_2$ in the presence of Ni catalyst, both the carbon-carbon double bond and the aldehyde group are reduced. The alkene is reduced to an alkane and the aldehyde is reduced to a primary alcohol. Thus, the product P is pentan-1-ol, which is $\\text{CH}_3(\\text{CH}_2)_3\\text{CH}_2\\text{OH}$.<br><br>When treated with $\\text{LiAlH}_4$ followed by hydrolysis, only the aldehyde group is reduced to a primary alcohol. $\\text{LiAlH}_4$ does not reduce isolated carbon-carbon double bonds. Thus, the double bond remains intact and the product Q is pent-3-en-1-ol, which is $\\text{CH}_3\\text{-CH=CH-CH}_2\\text{-CH}_2\\text{OH}$.<br><br>Therefore, $\\text{P} = \\text{CH}_3(\\text{CH}_2)_3\\text{CH}_2\\text{OH}$ and $\\text{Q} = \\text{CH}_3\\text{-CH=CH-CH}_2\\text{-CH}_2\\text{OH}$.<br><br>Answer: $\\text{P} = \\text{CH}_3(\\text{CH}_2)_3\\text{CH}_2\\text{OH}$ and $\\text{Q} = \\text{CH}_3\\text{-CH=CH-CH}_2\\text{-CH}_2\\text{OH}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31b8c30a4553e1be040", "type": "singleCorrect", "question": {"text": "Which of the following statements is true regarding Cannizzaro reaction?", "image": null}, "options": [{"id": "3IjVy", "label": "A", "text": "Some aldehydes are converted to the respective alcohols and the salt of the respective carboxylic acid.", "isCorrect": true, "image": null}, {"id": "fMMDs", "label": "B", "text": "Alcohol is converted into aldehyde", "isCorrect": false, "image": null}, {"id": "EnBOR", "label": "C", "text": "Primary amine is converted into isocyanide", "isCorrect": false, "image": null}, {"id": "XmCFI", "label": "D", "text": "Acid is converted into amine", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Cannizzaro reaction is a disproportionation reaction in which aldehydes without an $\\alpha$-hydrogen atom are treated with a strong base.<br><br>In this reaction, one molecule of the aldehyde is reduced to the corresponding primary alcohol, while another molecule is oxidized to the salt of the corresponding carboxylic acid.<br><br>For example, formaldehyde ($HCHO$) reacts with concentrated $NaOH$ to form methanol ($CH_3OH$) and sodium formate ($HCOONa$).<br><br>Therefore, some aldehydes are converted to the respective alcohols and the salt of the respective carboxylic acid.<br><br>Answer: Some aldehydes are converted to the respective alcohols and the salt of the respective carboxylic acid.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31b8c30a4553e1be03f", "type": "singleCorrect", "question": {"text": "Aldehydes are more reactive than ketone towards nucleophilic attack because of?", "image": null}, "options": [{"id": "R5jQF", "label": "A", "text": "less steric hindrance in ketone", "isCorrect": false, "image": null}, {"id": "LNbL2", "label": "B", "text": "presence of two alkyl group on ketone decreases its electrophilicity", "isCorrect": true, "image": null}, {"id": "iQcRf", "label": "C", "text": "presence of one alkyl group on aldehyde decreases its electrophilicity", "isCorrect": false, "image": null}, {"id": "Dbg98", "label": "D", "text": "alkyl group have electron withdrawing effect.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reactivity of carbonyl compounds towards nucleophilic addition depends on steric and electronic factors.<br><br>Steric factor: Ketones have two alkyl groups attached to the carbonyl carbon, which causes more steric hindrance to the approaching nucleophile compared to aldehydes, which have only one alkyl group and one small hydrogen atom.<br><br>Electronic factor: Alkyl groups are electron-donating in nature due to the $+I$ effect. In ketones, the presence of two electron-donating alkyl groups reduces the partial positive charge on the carbonyl carbon more effectively than the single alkyl group in aldehydes. This decreases the electrophilicity of the carbonyl carbon in ketones, making them less reactive towards nucleophilic attack.<br><br>Therefore, the presence of two alkyl groups on a ketone decreases its electrophilicity.<br><br>Answer: presence of two alkyl group on ketone decreases its electrophilicity", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3708c30a4553e1be3c5", "type": "singleCorrect", "question": {"text": "Identify the reagent used in the transformation of Ketone into semicarbazone.", "image": null}, "options": [{"id": "TSWnR", "label": "A", "text": "$\\text{NH}_2-\\text{OH}$", "isCorrect": false, "image": null}, {"id": "zQsN4", "label": "B", "text": "$\\text{NH}_2-\\text{NH}_2$", "isCorrect": false, "image": null}, {"id": "qwNub", "label": "C", "text": "$\\text{NH}_2-\\text{NH}-\\text{CONH}_2$", "isCorrect": true, "image": null}, {"id": "NsUTw", "label": "D", "text": "$\\text{NH}_2-\\text{NH}-\\text{C}_6\\text{H}_5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The transformation of a ketone into a semicarbazone involves the reaction of the ketone with semicarbazide.<br><br>The chemical formula of semicarbazide is $\\text{NH}_2-\\text{NH}-\\text{CONH}_2$.<br><br>The reaction proceeds via nucleophilic addition followed by the elimination of a water molecule, resulting in the formation of a semicarbazone ($>\\text{C}=\\text{N}-\\text{NH}-\\text{CONH}_2$).<br><br>Other reagents given:<br>$\\text{NH}_2-\\text{OH}$ (hydroxylamine) forms an oxime.<br>$\\text{NH}_2-\\text{NH}_2$ (hydrazine) forms a hydrazone.<br>$\\text{NH}_2-\\text{NH}-\\text{C}_6\\text{H}_5$ (phenylhydrazine) forms a phenylhydrazone.<br><br>Answer: $\\text{NH}_2-\\text{NH}-\\text{CONH}_2$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3708c30a4553e1be3c3", "type": "singleCorrect", "question": {"text": "Identify the product obtained when ketone reacts with $\\text{NH}_2$-$\\text{NH}_2$.", "image": null}, "options": [{"id": "jPna6", "label": "A", "text": "Aniline", "isCorrect": false, "image": null}, {"id": "VOIwg", "label": "B", "text": "Hydrazone", "isCorrect": true, "image": null}, {"id": "veqnD", "label": "C", "text": "Phenyl hydrazone", "isCorrect": false, "image": null}, {"id": "r6LCd", "label": "D", "text": "Anisole", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Ketones react with hydrazine ($H_2N-NH_2$) to form hydrazones.<br><br>The reaction proceeds via nucleophilic addition of hydrazine to the carbonyl group, followed by the elimination of a water molecule.<br><br>$R_2C=O + H_2N-NH_2 \\rightarrow R_2C=N-NH_2 + H_2O$<br><br>The resulting product, $R_2C=N-NH_2$, is known as a hydrazone.<br><br>Answer: Hydrazone", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3638c30a4553e1be32f", "type": "singleCorrect", "question": {"text": "When ethanal and propanal undergo aldol condensation with dilute NaOH, the pair of products obtained by cross condensation reaction is", "image": null}, "options": [{"id": "npsXp", "label": "A", "text": "but-2-enal and 2-methylpent-2-enal", "isCorrect": false, "image": null}, {"id": "BTTHl", "label": "B", "text": "but-2-enal and pent-2-enal", "isCorrect": false, "image": null}, {"id": "M8t79", "label": "C", "text": "2-methylbut-2-enal and pent-2-enal", "isCorrect": true, "image": null}, {"id": "2lvhw", "label": "D", "text": "2-methylbut-2-enal and 2-methylpent-2-enal", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Ethanal is $CH_3CHO$ and propanal is $CH_3CH_2CHO$.<br><br>Cross aldol condensation occurs when the enolate ion of one aldehyde attacks the carbonyl carbon of the other aldehyde.<br><br>Case 1: Enolate of ethanal attacks propanal.<br>$CH_3CH_2CHO + CH_3CHO \\xrightarrow{OH^-} CH_3CH_2CH(OH)CH_2CHO \\xrightarrow{\\Delta} CH_3CH_2CH=CHCHO$<br>The product formed is pent-2-enal.<br><br>Case 2: Enolate of propanal attacks ethanal.<br>$CH_3CHO + CH_3CH_2CHO \\xrightarrow{OH^-} CH_3CH(OH)CH(CH_3)CHO \\xrightarrow{\\Delta} CH_3CH=C(CH_3)CHO$<br>The product formed is 2-methylbut-2-enal.<br><br>Thus, the pair of products obtained by cross condensation is 2-methylbut-2-enal and pent-2-enal.<br><br>Answer: 2-methylbut-2-enal and pent-2-enal", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b98c30a4553e1bdc27", "type": "singleCorrect", "question": {"text": "Which of the following reactions is an example of a disproportionation reaction?", "image": null}, "options": [{"id": "mXt0A", "label": "A", "text": "Wolf-Kishner reduction.", "isCorrect": false, "image": null}, {"id": "EA4ig", "label": "B", "text": "Aldol condensation.", "isCorrect": false, "image": null}, {"id": "jFkyE", "label": "C", "text": "Clemmenson reduction.", "isCorrect": false, "image": null}, {"id": "nsiHp", "label": "D", "text": "Cannizzaro reaction.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "A disproportionation reaction is a redox reaction in which the same substance undergoes both oxidation and reduction simultaneously.<br><br>In the Cannizzaro reaction, aldehydes lacking $\\alpha$-hydrogens undergo self-oxidation and self-reduction in the presence of a concentrated base.<br><br>One molecule of the aldehyde is reduced to the corresponding alcohol, while another molecule is oxidized to the salt of the corresponding carboxylic acid.<br><br>For example: $2HCHO + NaOH \\rightarrow HCOONa + CH_3OH$<br><br>Here, formaldehyde is oxidized to sodium formate and reduced to methanol. Thus, the Cannizzaro reaction is an example of a disproportionation reaction.<br><br>Wolf-Kishner and Clemmensen reductions are purely reduction reactions, whereas Aldol condensation is a condensation reaction.<br><br>Answer: Cannizzaro reaction.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bffbf9280d7f9932e5c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the reaction so that carbonyl group of aldehydes and ketones is reduced to methylene group on treatment with Zinc-amalgam and concentrated hydrochloric acid.", "image": null}, "options": [{"id": "h9bJA", "text": "Wolf-Kishner reduction.", "image": null, "isCorrect": false}, {"id": "s3vjt", "text": "Stephan reaction.", "image": null, "isCorrect": false}, {"id": "kakYj", "text": "Clemmensen reduction.", "image": null, "isCorrect": true}, {"id": "tFra3", "text": "Etard reaction.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reduction of the carbonyl group of aldehydes and ketones to a methylene group ($>C=O \\rightarrow >CH_2$) using Zinc-amalgam (Zn-Hg) and concentrated hydrochloric acid (HCl) is known as Clemmensen reduction.<br><br>Wolff-Kishner reduction uses hydrazine ($NH_2NH_2$) followed by heating with sodium or potassium hydroxide in a high boiling solvent like ethylene glycol.<br><br>Stephen reaction involves the reduction of nitriles to aldehydes using stannous chloride ($SnCl_2$) and hydrochloric acid ($HCl$).<br><br>Etard reaction is the oxidation of toluene to benzaldehyde using chromyl chloride ($CrO_2Cl_2$).<br><br>Answer: Clemmensen reduction.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bedbf9280d7f9932db7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following has higher boiling point?", "image": null}, "options": [{"id": "k2rx4", "text": "Hexanal", "image": null, "isCorrect": true}, {"id": "0sklm", "text": "Ethanal", "image": null, "isCorrect": false}, {"id": "EnrcP", "text": "Propanal", "image": null, "isCorrect": false}, {"id": "23wzd", "text": "Pentanal", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The boiling point of aldehydes increases with an increase in molecular mass due to the corresponding increase in the magnitude of van der Waals forces of attraction.<br><br>Among the given options, hexanal has the highest number of carbon atoms (six) and thus the highest molecular mass.<br><br>Therefore, hexanal has the highest boiling point.<br><br>Answer: Hexanal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdbbf9280d7f9932d11", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product formed when Hex-3-enenitrile is reduced with diisobutylaluminium hydride followed by acid hydrolysis?", "image": null}, "options": [{"id": "LIjrY", "text": "Hexanal", "image": null, "isCorrect": false}, {"id": "dmTLj", "text": "Hexan - 3 - one", "image": null, "isCorrect": false}, {"id": "O2ZK6", "text": "Hex - 3 - enal", "image": null, "isCorrect": true}, {"id": "3bDb5", "text": "Hexanoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reactant is Hex-3-enenitrile, which has the structure $CH_3-CH_2-CH=CH-CH_2-CN$.<br><br>Diisobutylaluminium hydride (DIBAL-H) is a selective reducing agent. It reduces nitriles ($-CN$) to imines, which upon subsequent acid hydrolysis yield aldehydes ($-CHO$).<br><br>DIBAL-H does not reduce isolated carbon-carbon double bonds ($-C=C-$).<br><br>Therefore, the $-CN$ group is converted to a $-CHO$ group while the double bond at the third carbon remains unaffected.<br><br>The product formed is $CH_3-CH_2-CH=CH-CH_2-CHO$, which is Hex-3-enal.<br><br>Answer: Hex - 3 - enal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bccbf9280d7f9932c7e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the products of following reaction?\n$\\text { Formaldehyde }+ \\text { Benzaldehyde } \\xrightarrow[\\text { ii) } \\mathrm{H}_3 \\mathrm{O}^{+}]{\\text {i) conc. } \\mathrm{NaOH}} \\text { Products }$", "image": null}, "options": [{"id": "p48Ts", "text": "Phenylmethanol and methanol", "image": null, "isCorrect": false}, {"id": "UOlZk", "text": "Methanol and benzoic acid", "image": null, "isCorrect": false}, {"id": "SbD8u", "text": "Methanoic acid and phenylmethanol", "image": null, "isCorrect": true}, {"id": "9S8gl", "text": "Methanoic acid and benzoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Formaldehyde and benzaldehyde both lack $\\alpha$-hydrogen atoms. When treated with concentrated $\\text{NaOH}$, they undergo a crossed Cannizzaro reaction.<br><br>Formaldehyde is more reactive towards nucleophilic addition by the hydroxide ion, so it undergoes oxidation to form sodium formate, while benzaldehyde undergoes reduction to form benzyl alcohol (phenylmethanol).<br><br>$\\text{HCHO} + \\text{C}_6\\text{H}_5\\text{CHO} \\xrightarrow{\\text{conc. NaOH}} \\text{HCOONa} + \\text{C}_6\\text{H}_5\\text{CH}_2\\text{OH}$<br><br>Upon acidification with $\\text{H}_3\\text{O}^+$, sodium formate is converted to methanoic acid.<br><br>$\\text{HCOONa} \\xrightarrow{\\text{H}_3\\text{O}^+} \\text{HCOOH}$<br><br>Thus, the final products are methanoic acid and phenylmethanol.<br><br>Answer: Methanoic acid and phenylmethanol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbebf9280d7f9932c0f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is used as reagent in Etard reaction?", "image": null}, "options": [{"id": "XkgMs", "text": "Chromium chloride", "image": null, "isCorrect": false}, {"id": "bU9QQ", "text": "Chromyl chloride", "image": null, "isCorrect": true}, {"id": "RWSQH", "text": "Chromium oxide", "image": null, "isCorrect": false}, {"id": "4Xboc", "text": "Chromic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The Etard reaction involves the oxidation of a methyl group attached to an aromatic ring (such as in toluene) to an aldehyde group (such as benzaldehyde).<br><br>The reagent used for this specific oxidation is chromyl chloride ($CrO_2Cl_2$) dissolved in a non-polar solvent like $CS_2$ or $CCl_4$, followed by acid hydrolysis.<br><br>Therefore, chromyl chloride is the correct reagent.<br><br>Answer: Chromyl chloride", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871baabf9280d7f9932b67", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the name of reaction if carbonyl group of aldehydes and ketones is reduced to methylene group on treatment with hydrazine followed by heating with sodium hydroxide in ethylene glycol.", "image": null}, "options": [{"id": "D3G0R", "text": "Wolf-Kishner reduction", "image": null, "isCorrect": true}, {"id": "ELkbT", "text": "Clemmensen reduction", "image": null, "isCorrect": false}, {"id": "a0hw0", "text": "Stephen reaction", "image": null, "isCorrect": false}, {"id": "waggm", "text": "Etard reaction", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reduction of the carbonyl group of aldehydes and ketones to a methylene group on treatment with hydrazine ($NH_2-NH_2$) followed by heating with sodium hydroxide or potassium hydroxide in a high boiling solvent like ethylene glycol is known as the Wolff-Kishner reduction.<br><br>Clemmensen reduction involves the use of zinc amalgam and concentrated hydrochloric acid.<br><br>Stephen reaction is the reduction of nitriles to aldehydes using tin(II) chloride and HCl.<br><br>Etard reaction is the oxidation of toluene to benzaldehyde using chromyl chloride.<br><br>Answer: Wolf-Kishner reduction", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9cbf9280d7f9932adb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following has lowest boiling point?", "image": null}, "options": [{"id": "U7ipk", "text": "Pentanal", "image": null, "isCorrect": false}, {"id": "paF3G", "text": "Propanal", "image": null, "isCorrect": false}, {"id": "24KMf", "text": "Methanal", "image": null, "isCorrect": true}, {"id": "9ky84", "text": "Ethanal", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The boiling point of aldehydes increases with an increase in molecular mass due to the corresponding increase in the magnitude of van der Waals forces of attraction.<br><br>Among the given options, methanal (HCHO) has the lowest molecular mass (1 carbon atom), followed by ethanal (2 carbon atoms), propanal (3 carbon atoms), and pentanal (5 carbon atoms).<br><br>Therefore, methanal has the weakest intermolecular forces and consequently the lowest boiling point. It is a gas at room temperature.<br><br>Answer: Methanal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8dbf9280d7f9932a4a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following compounds has highest boiling point?", "image": null}, "options": [{"id": "HYoXA", "text": "Propanal", "image": null, "isCorrect": false}, {"id": "YXUfj", "text": "Ethanal", "image": null, "isCorrect": false}, {"id": "GHPHw", "text": "Pentanal", "image": null, "isCorrect": false}, {"id": "00l6p", "text": "Hexanal", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The boiling point of aldehydes increases with an increase in molecular mass due to an increase in the magnitude of van der Waals forces of attraction.<br><br>Among the given options, hexanal has the highest number of carbon atoms (six) and hence the highest molecular mass.<br><br>Therefore, hexanal has the highest boiling point.<br><br>Answer: Hexanal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7bbf9280d7f99329a0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the substrate ' $A$ ' in the following conversion.\n$\\mathrm{A} \\xrightarrow[\\mathrm{H}_3 \\mathrm{O}^{+}]{\\mathrm{AlH}(\\mathrm{i}-\\mathrm{Bu})_2} \\text { Pent-3-enal }$", "image": null}, "options": [{"id": "uOAIw", "text": "Pentanenitrile", "image": null, "isCorrect": false}, {"id": "tsIuD", "text": "Pent-3-enenitrile", "image": null, "isCorrect": true}, {"id": "UAdcW", "text": "Pent-3-en-1-amine", "image": null, "isCorrect": false}, {"id": "RIH8K", "text": "Pent-3-ynenitrile", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reagent $\\mathrm{AlH}(\\mathrm{i}-\\mathrm{Bu})_2$ is DIBAL-H (diisobutylaluminium hydride).<br><br>DIBAL-H selectively reduces nitriles to imines, which upon acid hydrolysis ($\\mathrm{H}_3\\mathrm{O}^{+}$) yield aldehydes. It does not reduce isolated carbon-carbon double bonds.<br><br>The product is pent-3-enal, which has the structure $\\mathrm{CH}_3-\\mathrm{CH}=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{CHO}$.<br><br>To obtain pent-3-enal, the substrate 'A' must be a nitrile with the same carbon skeleton and double bond position. Replacing the aldehyde group ($\\mathrm{-CHO}$) with a nitrile group ($\\mathrm{-CN}$) gives $\\mathrm{CH}_3-\\mathrm{CH}=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{CN}$.<br><br>The IUPAC name of this compound is pent-3-enenitrile.<br><br>Answer: Pent-3-enenitrile", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4bbf9280d7f99327f8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the reagent ' $R$ ' used in the following reaction.\nKetone $\\xrightarrow{\\mathrm{R}}$ Semicarbazone", "image": null}, "options": [{"id": "VB3DZ", "text": "$\\mathrm{NH}_2 \\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "TKgIH", "text": "$\\mathrm{NH}_2-\\mathrm{NH}-\\mathrm{CONH}_2$", "image": null, "isCorrect": true}, {"id": "nhR4U", "text": "$\\mathrm{NH}_2-\\mathrm{NH}-\\mathrm{C}_6 \\mathrm{H}_5$", "image": null, "isCorrect": false}, {"id": "JgVUt", "text": "$\\mathrm{NH}_2-\\mathrm{NH}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction of a ketone with semicarbazide yields a semicarbazone.<br><br>The chemical formula of semicarbazide is $\\mathrm{NH}_2-\\mathrm{NH}-\\mathrm{CONH}_2$.<br><br>The general reaction is:<br>$\\mathrm{R}_2\\mathrm{C}=\\mathrm{O} + \\mathrm{H}_2\\mathrm{N}-\\mathrm{NH}-\\mathrm{CONH}_2 \\rightarrow \\mathrm{R}_2\\mathrm{C}=\\mathrm{N}-\\mathrm{NH}-\\mathrm{CONH}_2 + \\mathrm{H}_2\\mathrm{O}$<br><br>Other reagents given in the options form different products:<br>$\\mathrm{NH}_2\\mathrm{OH}$ (Hydroxylamine) forms oximes.<br>$\\mathrm{NH}_2-\\mathrm{NH}-\\mathrm{C}_6\\mathrm{H}_5$ (Phenylhydrazine) forms phenylhydrazones.<br>$\\mathrm{NH}_2-\\mathrm{NH}_2$ (Hydrazine) forms hydrazones.<br><br>Answer: $\\mathrm{NH}_2-\\mathrm{NH}-\\mathrm{CONH}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3cbf9280d7f993275b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following compounds has highest boiling point?", "image": null}, "options": [{"id": "VGYxx", "text": "Acetaldehyde", "image": null, "isCorrect": false}, {"id": "djkii", "text": "Propionaldehyde", "image": null, "isCorrect": false}, {"id": "cr9i9", "text": "Butyraldehyde", "image": null, "isCorrect": false}, {"id": "QyvYB", "text": "Valeraldehyde", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The boiling point of aldehydes increases with an increase in molecular mass due to an increase in the magnitude of van der Waals forces of attraction.<br><br>Among the given options, valeraldehyde (pentanal) has the highest number of carbon atoms (five carbon atoms) and thus the highest molecular mass.<br><br>Therefore, valeraldehyde has the highest boiling point.<br><br>Answer: Valeraldehyde", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3bbf9280d7f993274f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product ' $B$ ' in following reaction.\n$\\text { Ethanal } \\xrightarrow{\\text { dil } \\mathrm{NaOH}} \\mathrm{~A} \\xrightarrow[-\\mathrm{H}_2 \\mathrm{O}]{\\Delta} \\mathrm{B}$", "image": null}, "options": [{"id": "I2Y8c", "text": "3-Hydroxybutanal", "image": null, "isCorrect": false}, {"id": "U7Lfw", "text": "4-Hydroxybutanal", "image": null, "isCorrect": false}, {"id": "WGS5D", "text": "But-2-enal", "image": null, "isCorrect": true}, {"id": "hGYZL", "text": "But-3-enal", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ethanal ($\\mathrm{CH}_3\\mathrm{CHO}$) undergoes aldol condensation in the presence of dilute $\\mathrm{NaOH}$ to form 3-hydroxybutanal (product A).<br><br>$2\\mathrm{CH}_3\\mathrm{CHO} \\xrightarrow{\\text{dil } \\mathrm{NaOH}} \\mathrm{CH}_3-\\mathrm{CH}(\\mathrm{OH})-\\mathrm{CH}_2-\\mathrm{CHO}$<br><br>Upon heating, 3-hydroxybutanal undergoes dehydration (loss of a water molecule) to form an $\\alpha,\\beta$-unsaturated aldehyde, But-2-enal (product B).<br><br>$\\mathrm{CH}_3-\\mathrm{CH}(\\mathrm{OH})-\\mathrm{CH}_2-\\mathrm{CHO} \\xrightarrow{\\Delta} \\mathrm{CH}_3-\\mathrm{CH}=\\mathrm{CH}-\\mathrm{CHO} + \\mathrm{H}_2\\mathrm{O}$<br><br>Thus, product B is But-2-enal.<br><br>Answer: But-2-enal", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b00bf9280d7f9932584", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product of following reaction.\n$\\text { Formaldehyde }+ \\text { Benzaldehyde } \\frac{\\text { conc. } \\mathrm{NaOH}}{\\mathrm{H}_3 \\mathrm{O}^{+}} \\text {prodcut }$", "image": null}, "options": [{"id": "Sy7r3", "text": "Phenyl methanol and methanol", "image": null, "isCorrect": false}, {"id": "j1ZVi", "text": "Methanol and benzoic acid", "image": null, "isCorrect": false}, {"id": "90LRW", "text": "Methanoic acid and phenyl methanol", "image": null, "isCorrect": true}, {"id": "os31H", "text": "Methanoic acid and benzoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is a crossed Cannizzaro reaction between formaldehyde and benzaldehyde, both of which lack $\\alpha$-hydrogen atoms.<br><br>When treated with concentrated $\\text{NaOH}$, the more reactive aldehyde, formaldehyde, undergoes oxidation to form the formate ion, while benzaldehyde undergoes reduction to form benzyl alcohol (phenyl methanol).<br><br>$\\text{HCHO} + \\text{C}_6\\text{H}_5\\text{CHO} \\xrightarrow{\\text{conc. NaOH}} \\text{HCOONa} + \\text{C}_6\\text{H}_5\\text{CH}_2\\text{OH}$<br><br>Upon subsequent acidification with $\\text{H}_3\\text{O}^{+}$, the sodium formate is converted into formic acid (methanoic acid).<br><br>$\\text{HCOONa} \\xrightarrow{\\text{H}_3\\text{O}^{+}} \\text{HCOOH}$<br><br>Thus, the final products are methanoic acid and phenyl methanol.<br><br>Answer: Methanoic acid and phenyl methanol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b00bf9280d7f993257c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the reagent $R$ used in following reaction.\nKetone $\\xrightarrow{\\mathrm{R}}$ semi carbazone", "image": null}, "options": [{"id": "37boL", "text": "$\\mathrm{NH}_2 \\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "Wlr8i", "text": "$\\mathrm{NH}_2 \\mathrm{NHCONH}_2$", "image": null, "isCorrect": true}, {"id": "PSP2T", "text": "$\\mathrm{NH}_2 \\mathrm{NHC}_6 \\mathrm{H}_5$", "image": null, "isCorrect": false}, {"id": "xR4zp", "text": "$\\mathrm{NH}_2-\\mathrm{NH}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ketones react with semicarbazide in a weakly acidic medium to form semicarbazones.<br><br>The chemical formula of semicarbazide is $\\mathrm{NH}_2\\mathrm{NHCONH}_2$.<br><br>The general reaction is:<br>$\\mathrm{R}_2\\mathrm{C=O} + \\mathrm{H}_2\\mathrm{N-NH-CO-NH}_2 \\rightarrow \\mathrm{R}_2\\mathrm{C=N-NH-CO-NH}_2 + \\mathrm{H}_2\\mathrm{O}$<br><br>Therefore, the reagent $R$ is $\\mathrm{NH}_2\\mathrm{NHCONH}_2$.<br><br>Answer: $\\mathrm{NH}_2 \\mathrm{NHCONH}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139e0aee93fa0796da35", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Which of the following compounds is used to convert acetaldehyde into acetaldehyde cynanohydrin?", "image": null}, "options": [{"id": "NPxzc", "text": "$\\mathrm{FeCl}_3$ (neutral)", "image": null, "isCorrect": false}, {"id": "CYoBU", "text": "$\\mathrm{H}_2 \\mathrm{SO}_4$ (dil.)", "image": null, "isCorrect": false}, {"id": "psVxO", "text": "HCN", "image": null, "isCorrect": true}, {"id": "X9zBb", "text": "$\\mathrm{NaHSO}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Acetaldehyde reacts with hydrogen cyanide ($\\mathrm{HCN}$) to undergo nucleophilic addition, forming acetaldehyde cyanohydrin.<br><br>$\\mathrm{CH}_3\\mathrm{CHO} + \\mathrm{HCN} \\rightarrow \\mathrm{CH}_3\\mathrm{CH}(\\mathrm{OH})\\mathrm{CN}$<br><br>Answer: HCN", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134e0aee93fa0796d7bd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Identify the product ' B ' in the following sequence of reactions.\r\nPropanone $\\xrightarrow{\\mathrm{Ba}(\\mathrm{OH})_2} \\mathrm{~A} \\xrightarrow[-\\mathrm{H}_2 \\mathrm{O}]{\\Delta} \\mathrm{B}$", "image": null}, "options": [{"id": "EyBiW", "text": "4-Hydroxy-4-methylpentan-2-one", "image": null, "isCorrect": false}, {"id": "uahhs", "text": "2-methylpentan-3-one", "image": null, "isCorrect": false}, {"id": "5xLoT", "text": "2-methylpent-2-en-4-one", "image": null, "isCorrect": false}, {"id": "CdvoH", "text": "4-methylpent-3-en-2-one", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Propanone undergoes aldol addition in the presence of dilute base $\\mathrm{Ba}(\\mathrm{OH})_2$ to form diacetone alcohol (Product A).<br><br>$2 \\mathrm{CH}_3-\\mathrm{CO}-\\mathrm{CH}_3 \\xrightarrow{\\mathrm{Ba}(\\mathrm{OH})_2} \\mathrm{CH}_3-\\mathrm{C}(\\mathrm{OH})(\\mathrm{CH}_3)-\\mathrm{CH}_2-\\mathrm{CO}-\\mathrm{CH}_3$<br><br>Product A is 4-hydroxy-4-methylpentan-2-one.<br><br>Upon heating, Product A undergoes dehydration (loss of a water molecule) to form a stable $\\alpha,\\beta$-unsaturated ketone (Product B).<br><br>$\\mathrm{CH}_3-\\mathrm{C}(\\mathrm{OH})(\\mathrm{CH}_3)-\\mathrm{CH}_2-\\mathrm{CO}-\\mathrm{CH}_3 \\xrightarrow{\\Delta} (\\mathrm{CH}_3)_2\\mathrm{C}=\\mathrm{CH}-\\mathrm{CO}-\\mathrm{CH}_3 + \\mathrm{H}_2\\mathrm{O}$<br><br>According to IUPAC nomenclature, the principal functional group is the ketone, so numbering starts from the right to give the carbonyl carbon the lowest possible number (C2). The double bond is at C3 and a methyl group is at C4. Thus, Product B is 4-methylpent-3-en-2-one.<br><br>Answer: 4-methylpent-3-en-2-one", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133d0aee93fa0796d73b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Identify the product ' B ' in the following reaction.\r\nEthylphenyl ketone \\(\\xrightarrow[-\\mathrm{H}_2 \\mathrm{O}]{\\mathrm{H}_2 \\mathrm{N}-\\mathrm{NH}_2}\\) $\\mathrm{A} \\xrightarrow{\\mathrm{KOH}, \\mathrm{HO}_1\\left(\\mathrm{CH}_2\\right)_2 \\mathrm{OH}} \\mathrm{B}$", "image": null}, "options": [{"id": "ApE5k", "text": "Phenylhydrazone", "image": null, "isCorrect": false}, {"id": "jLxFR", "text": "Ethylbenzene", "image": null, "isCorrect": false}, {"id": "Uyher", "text": "n-propylbenzene", "image": null, "isCorrect": true}, {"id": "fe2y8", "text": "Isopropylbenzene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ethylphenyl ketone is $C_6H_5-CO-CH_2-CH_3$.<br><br>Reaction of ethylphenyl ketone with hydrazine ($H_2N-NH_2$) results in the elimination of a water molecule to form the corresponding hydrazone (A), $C_6H_5-C(=N-NH_2)-CH_2-CH_3$.<br><br>Heating the hydrazone with a strong base like $KOH$ in a high-boiling solvent like ethylene glycol ($HO-CH_2-CH_2-OH$) is known as the Wolff-Kishner reduction.<br><br>In this reduction, the carbonyl group ($>C=O$) is completely reduced to a methylene group ($-CH_2-$).<br><br>Thus, $C_6H_5-CO-CH_2-CH_3$ is converted to $C_6H_5-CH_2-CH_2-CH_3$, which is n-propylbenzene.<br><br>Answer: n-propylbenzene", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262230279619d9d8a3219", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Identify product ' $B$ ' in following sequence of reactions.\n$2n Propanone \\stackrel{\\mathrm{Ba}(\\mathrm{OH})_2}{\\longrightarrow} \\mathrm{A} \\stackrel{\\Delta}{-\\mathrm{H}_2 \\mathrm{O}} \\mathrm{nB}$", "image": null}, "options": [{"id": "XngzC", "text": "4-Hydroxy-4-methylpentan-2-one", "image": null, "isCorrect": false}, {"id": "Ox6Lg", "text": "2-Methylpentan-3-one", "image": null, "isCorrect": false}, {"id": "uhoaP", "text": "2-Methylpent-2-en-4-one", "image": null, "isCorrect": false}, {"id": "Dblpb", "text": "4-Methylpent-3-en-2-one", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Bf6cJI1fDygr4nnGiFqgEei8Jfba1-yZRLAkuKRXfSI.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title":
