  <script>
    const data = {"index": 8, "chapterId": "61c089baae7c6e324a7753e5", "chapter": "Ionic Equilibrium", "exam": "MHT CET", "totalTopics": 6, "totalQuestions": 274, "downloadTime": "2026-10-08 20:05:56", "topics": [{"index": 1, "topicId": "65a2632e0279619d9d8a3cba", "title": "Theories of Acids and Bases", "totalQuestions": 61, "questions": [{"_id": "6abb884115a9fc0fc8c141fd", "type": "singleCorrect", "question": {"text": "If $pK_b$ value for fluoride ion at $25^\\circ$C is $10.83$, calculate the ionisation constant of hydrofluoric acid in water at this temperature.", "image": null}, "options": [{"id": "5W2ct", "label": "A", "text": "$1.74 \\times 10^{-5}$", "isCorrect": false, "image": null}, {"id": "6YfeE", "label": "B", "text": "$3.52 \\times 10^{-3}$", "isCorrect": false, "image": null}, {"id": "IIgHj", "label": "C", "text": "$6.75 \\times 10^{-4}$", "isCorrect": true, "image": null}, {"id": "vsPUO", "label": "D", "text": "$5.38 \\times 10^{-2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a conjugate acid-base pair, the relationship between the ionization constant of the acid ($K_a$) and the base ($K_b$) is given by:<br><br>$pK_a + pK_b = pK_w$<br><br>At $25^{\\circ}$C, the ionic product of water $pK_w = 14$.<br><br>Given $pK_b$ for fluoride ion ($F^{-}$) is $10.83$.<br><br>$pK_a = 14 - 10.83 = 3.17$<br><br>The ionization constant of hydrofluoric acid (HF) is:<br><br>$K_a = 10^{-pK_a} = 10^{-3.17}$<br><br>$K_a = 10^{-4} \\times 10^{0.83}$<br><br>Since $\\log(6.75) \\approx 0.83$, we have $10^{0.83} \\approx 6.75$.<br><br>$K_a = 6.75 \\times 10^{-4}$<br><br>Answer: $6.75 \\times 10^{-4}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885115a9fc0fc8c14291", "type": "singleCorrect", "question": {"text": "Identify the conjugate base of $\\text{NH}_3$ from following.", "image": null}, "options": [{"id": "85UXK", "label": "A", "text": "$\\text{NH}_4^+$", "isCorrect": false, "image": null}, {"id": "BLRnH", "label": "B", "text": "$\\text{NH}_4\\text{OH}$", "isCorrect": false, "image": null}, {"id": "dLLof", "label": "C", "text": "$\\text{NH}_2\\text{OH}$", "isCorrect": false, "image": null}, {"id": "CFs1H", "label": "D", "text": "$\\text{NH}_2^-$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to the Bronsted-Lowry concept, a conjugate base is formed when a species donates a proton ($\\text{H}^+$).<br><br>The reaction for the removal of a proton from $\\text{NH}_3$ is given by:<br><br>$\\text{NH}_3 \\rightarrow \\text{H}^+ + \\text{NH}_2^-$<br><br>Thus, the conjugate base of $\\text{NH}_3$ is $\\text{NH}_2^-$.<br><br>Answer: $\\text{NH}_2^-$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887115a9fc0fc8c143bf", "type": "singleCorrect", "question": {"text": "Calculate the dissociation constant of weak monobasic acid if it dissociates to $0.04\\%$ in $0.2$ M solution.", "image": null}, "options": [{"id": "F1559", "label": "A", "text": "$5.4 \\times 10^{-8}$", "isCorrect": false, "image": null}, {"id": "acD60", "label": "B", "text": "$4.8 \\times 10^{-8}$", "isCorrect": false, "image": null}, {"id": "YwfrC", "label": "C", "text": "$3.9 \\times 10^{-8}$", "isCorrect": false, "image": null}, {"id": "3f7OQ", "label": "D", "text": "$3.2 \\times 10^{-8}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given concentration $C = 0.2$ M<br><br>Degree of dissociation $\\alpha = 0.04\\% = 4 \\times 10^{-4}$<br><br>For a weak monobasic acid, the dissociation constant is given by $K_a = C\\alpha^2$ (since $\\alpha \\ll 1$).<br><br>Substituting the values:<br><br>$K_a = 0.2 \\times (4 \\times 10^{-4})^2$<br><br>$K_a = 0.2 \\times 16 \\times 10^{-8}$<br><br>$K_a = 3.2 \\times 10^{-8}$<br><br>Answer: $3.2 \\times 10^{-8}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887115a9fc0fc8c143be", "type": "singleCorrect", "question": {"text": "Calculate the amount of acetic acid in one liter of its solution if the degree of dissociation is $1.3\\%$ [$K_a = 1.8 \\times 10^{-5}$]", "image": null}, "options": [{"id": "DTQpd", "label": "A", "text": "$1.6$ g", "isCorrect": false, "image": null}, {"id": "uepTH", "label": "B", "text": "$6.36$ g", "isCorrect": true, "image": null}, {"id": "I9ukR", "label": "C", "text": "$3.2$ g", "isCorrect": false, "image": null}, {"id": "NM2HE", "label": "D", "text": "$9.8$ g", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a weak acid, the dissociation constant $K_a$ is given by:<br><br>$K_a = C\\alpha^2$<br><br>Given:<br>$\\alpha = 1.3\\% = 0.013$<br>$K_a = 1.8 \\times 10^{-5}$<br><br>Substituting the values to find the concentration $C$:<br><br>$C = \\dfrac{K_a}{\\alpha^2} = \\dfrac{1.8 \\times 10^{-5}}{(0.013)^2}$<br><br>$C = \\dfrac{1.8 \\times 10^{-5}}{1.69 \\times 10^{-4}} \\approx 0.106 \\text{ mol L}^{-1}$<br><br>The molar mass of acetic acid ($CH_3COOH$) is $60 \\text{ g mol}^{-1}$.<br><br>Amount of acetic acid in $1 \\text{ L}$ of solution = $C \\times \\text{Molar mass}$<br><br>Amount = $0.106 \\times 60 = 6.36 \\text{ g}$<br><br>Answer: $6.36$ g", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888215a9fc0fc8c1445f", "type": "singleCorrect", "question": {"text": "Which of the following molecules has highest $pK_a$ value?", "image": null}, "options": [{"id": "gQiZ6", "label": "A", "text": "$\\text{HCl}$", "isCorrect": false, "image": null}, {"id": "ifDJo", "label": "B", "text": "$\\text{HF}$", "isCorrect": true, "image": null}, {"id": "cg2Wn", "label": "C", "text": "$\\text{HBr}$", "isCorrect": false, "image": null}, {"id": "XedgZ", "label": "D", "text": "$\\text{HI}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The acidic strength of hydrogen halides increases down the group in the periodic table. This is because the size of the halogen atom increases from $\\text{F}$ to $\\text{I}$, which decreases the bond dissociation enthalpy of the $\\text{H-X}$ bond, making it easier to release an $\\text{H}^+$ ion.<br><br>The order of acidic strength is $\\text{HF} < \\text{HCl} < \\text{HBr} < \\text{HI}$.<br><br>The $pK_a$ value is inversely proportional to the acidic strength. A weaker acid has a higher $pK_a$ value.<br><br>Since $\\text{HF}$ is the weakest acid among the given hydrogen halides, it has the highest $pK_a$ value.<br><br>Answer: $\\text{HF}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889115a9fc0fc8c144e9", "type": "singleCorrect", "question": {"text": "Which of the following is not amphoteric?", "image": null}, "options": [{"id": "JTMva", "label": "A", "text": "$\\text{H}_2\\text{O}$", "isCorrect": false, "image": null}, {"id": "nrR0w", "label": "B", "text": "$\\text{HCl}$", "isCorrect": true, "image": null}, {"id": "tYgFH", "label": "C", "text": "$\\text{NH}_3$", "isCorrect": false, "image": null}, {"id": "QU1ol", "label": "D", "text": "$\\text{HCO}_3^-$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "An amphoteric substance is one that can act as both an acid (proton donor) and a base (proton acceptor).<br><br>$\\text{H}_2\\text{O}$ can donate a proton to form $\\text{OH}^-$ and accept a proton to form $\\text{H}_3\\text{O}^+$.<br><br>$\\text{NH}_3$ can donate a proton to form $\\text{NH}_2^-$ and accept a proton to form $\\text{NH}_4^+$.<br><br>$\\text{HCO}_3^-$ can donate a proton to form $\\text{CO}_3^{2-}$ and accept a proton to form $\\text{H}_2\\text{CO}_3$.<br><br>$\\text{HCl}$ is a strong acid that readily donates a proton to form $\\text{Cl}^-$, but it does not accept a proton under normal conditions. Thus, it is not amphoteric.<br><br>Answer: $\\text{HCl}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886115a9fc0fc8c14329", "type": "singleCorrect", "question": {"text": "A weak monobasic acid is $18$ % dissociated in $0.05$ M solution. Calculate the concentration of solution if it is $10$ % dissociated .", "image": null}, "options": [{"id": "PFtr3", "label": "A", "text": "$0.162$ M.", "isCorrect": true, "image": null}, {"id": "oxtYx", "label": "B", "text": "$0.141$ M.", "isCorrect": false, "image": null}, {"id": "qj8tm", "label": "C", "text": "$0.184$ M.", "isCorrect": false, "image": null}, {"id": "1PUbk", "label": "D", "text": "$0.125$ M.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a weak monobasic acid, the dissociation constant $K_a$ is given by Ostwald's dilution law:<br><br>$K_a = C \\alpha^2$<br><br>Since the acid is the same, $K_a$ remains constant at a given temperature. Therefore, we can write:<br><br>$C_1 \\alpha_1^2 = C_2 \\alpha_2^2$<br><br>Given values are:<br>$C_1 = 0.05$ M<br>$\\alpha_1 = 18\\% = 0.18$<br>$\\alpha_2 = 10\\% = 0.10$<br><br>Substituting these values into the equation:<br><br>$0.05 \\times (0.18)^2 = C_2 \\times (0.10)^2$<br><br>$0.05 \\times 0.0324 = C_2 \\times 0.01$<br><br>$0.00162 = C_2 \\times 0.01$<br><br>$C_2 = \\dfrac{0.00162}{0.01} = 0.162$ M<br><br>Answer: $0.162$ M.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886115a9fc0fc8c14327", "type": "singleCorrect", "question": {"text": "Identify conjugate bases of $\\text{HCO}_3^-$ and $\\text{HS}^-$ respectively.", "image": null}, "options": [{"id": "9dI7T", "label": "A", "text": "$\\text{H}_2\\text{CO}_3$ and $\\text{H}_2\\text{S}$", "isCorrect": false, "image": null}, {"id": "ApW9M", "label": "B", "text": "$\\text{CO}_3^{--}$ and $\\text{S}^{--}$", "isCorrect": true, "image": null}, {"id": "up1Ku", "label": "C", "text": "$\\text{HCO}_3^{--}$ and $\\text{H}_2\\text{S}$", "isCorrect": false, "image": null}, {"id": "H8ygh", "label": "D", "text": "$\\text{H}_2\\text{CO}_3^{--}$ and $\\text{S}^-$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A conjugate base is formed when an acid loses a proton ($\\text{H}^+$).<br><br>For $\\text{HCO}_3^-$, the removal of one $\\text{H}^+$ ion gives:<br>$\\text{HCO}_3^- \\rightarrow \\text{H}^+ + \\text{CO}_3^{2-}$<br><br>For $\\text{HS}^-$, the removal of one $\\text{H}^+$ ion gives:<br>$\\text{HS}^- \\rightarrow \\text{H}^+ + \\text{S}^{2-}$<br><br>Thus, the conjugate bases of $\\text{HCO}_3^-$ and $\\text{HS}^-$ are $\\text{CO}_3^{--}$ and $\\text{S}^{--}$ respectively.<br><br>Answer: $\\text{CO}_3^{--}$ and $\\text{S}^{--}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c115a9fc0fc8c146ac", "type": "singleCorrect", "question": {"text": "A weak monobasic acid is $0.08\\%$ dissociated in $0.02$M solution. Calculate the dissociation constant of weak acid.", "image": null}, "options": [{"id": "NMy2v", "label": "A", "text": "$1.28 \\times 10^{-8}$", "isCorrect": true, "image": null}, {"id": "9SXil", "label": "B", "text": "$1.50 \\times 10^{-8}$", "isCorrect": false, "image": null}, {"id": "SwzLu", "label": "C", "text": "$1.1 \\times 10^{-8}$", "isCorrect": false, "image": null}, {"id": "7lX6C", "label": "D", "text": "$1.60 \\times 10^{-8}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given concentration $C = 0.02$ M<br><br>Degree of dissociation $\\alpha = 0.08\\% = \\dfrac{0.08}{100} = 8 \\times 10^{-4}$<br><br>For a weak monobasic acid, the dissociation constant $K_a$ is given by Ostwald's dilution law:<br><br>$K_a = \\dfrac{C\\alpha^2}{1 - \\alpha}$<br><br>Since $\\alpha \\ll 1$, we can approximate $1 - \\alpha \\approx 1$.<br><br>$K_a = C\\alpha^2$<br><br>Substituting the given values:<br><br>$K_a = 0.02 \\times (8 \\times 10^{-4})^2$<br><br>$K_a = 0.02 \\times 64 \\times 10^{-8}$<br><br>$K_a = 1.28 \\times 10^{-8}$<br><br>Answer: $1.28 \\times 10^{-8}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c115a9fc0fc8c146ab", "type": "singleCorrect", "question": {"text": "Identify the conjugate acid of $\\text{NH}_3$ from following.", "image": null}, "options": [{"id": "GQbXF", "label": "A", "text": "$\\text{NH}_4^+$", "isCorrect": true, "image": null}, {"id": "K18nQ", "label": "B", "text": "$\\text{NH}_2^-$", "isCorrect": false, "image": null}, {"id": "HSys3", "label": "C", "text": "$\\text{H}_3\\text{O}^+$", "isCorrect": false, "image": null}, {"id": "2TOFL", "label": "D", "text": "$\\text{NH}_4\\text{OH}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the Brønsted-Lowry concept, a conjugate acid is formed when a base accepts a proton ($\\text{H}^+$).<br><br>$\\text{NH}_3 + \\text{H}^+ \\rightarrow \\text{NH}_4^+$<br><br>Therefore, the conjugate acid of $\\text{NH}_3$ is $\\text{NH}_4^+$.<br><br>Answer: $\\text{NH}_4^+$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883115a9fc0fc8c14165", "type": "singleCorrect", "question": {"text": "Which of the following is a strong electrolyte?", "image": null}, "options": [{"id": "eanl2", "label": "A", "text": "Acetic acid", "isCorrect": false, "image": null}, {"id": "VsBAy", "label": "B", "text": "Ammonium hydroxide", "isCorrect": false, "image": null}, {"id": "AJYYN", "label": "C", "text": "Sodium chloride", "isCorrect": true, "image": null}, {"id": "qpgZJ", "label": "D", "text": "Carbonic acid", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Strong electrolytes are substances that completely dissociate into ions in aqueous solutions.<br><br>Sodium chloride ($\\text{NaCl}$) is a salt of a strong acid ($\\text{HCl}$) and a strong base ($\\text{NaOH}$), so it completely ionizes in water, making it a strong electrolyte.<br><br>Acetic acid, ammonium hydroxide, and carbonic acid are weak electrolytes as they only partially dissociate in water.<br><br>Answer: Sodium chloride", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30c8c30a4553e1bdf9a", "type": "singleCorrect", "question": {"text": "Calculate the molar concentration of weak monobasic acid if $K_a = 1.8 \\times 10^{-5}$ and degree of dissociation is $0.01$ ?", "image": null}, "options": [{"id": "8p1Am", "label": "A", "text": "$1.8 \\times 10^{-1}$", "isCorrect": true, "image": null}, {"id": "hZ6Ud", "label": "B", "text": "$1.8 \\times 10^{-2}$", "isCorrect": false, "image": null}, {"id": "ANyfT", "label": "C", "text": "$5.55 \\times 10^{-3}$", "isCorrect": false, "image": null}, {"id": "vuCt4", "label": "D", "text": "$5.55 \\times 10^{-4}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a weak monobasic acid, the dissociation constant is given by:<br><br>$K_a = \\dfrac{C\\alpha^2}{1-\\alpha}$<br><br>Since $\\alpha = 0.01$, which is very small compared to $1$, we can approximate $1-\\alpha \\approx 1$.<br><br>$K_a = C\\alpha^2$<br><br>Rearranging for $C$:<br><br>$C = \\dfrac{K_a}{\\alpha^2}$<br><br>Substituting the given values:<br><br>$C = \\dfrac{1.8 \\times 10^{-5}}{(0.01)^2}$<br><br>$C = \\dfrac{1.8 \\times 10^{-5}}{10^{-4}}$<br><br>$C = 1.8 \\times 10^{-1}$ M<br><br>Answer: $1.8 \\times 10^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30b8c30a4553e1bdf8a", "type": "singleCorrect", "question": {"text": "Which of the following equimolar solutions is the best conductor of electricity at same temperature ?", "image": null}, "options": [{"id": "MxpRz", "label": "A", "text": "$\\text{CH}_3\\text{COOH}$", "isCorrect": false, "image": null}, {"id": "AcGMr", "label": "B", "text": "$\\text{NH}_4\\text{OH}$", "isCorrect": false, "image": null}, {"id": "2l5qa", "label": "C", "text": "$\\text{HCl}$", "isCorrect": true, "image": null}, {"id": "Rs6bs", "label": "D", "text": "$\\text{C}_6\\text{H}_{12}\\text{O}_6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Electrical conductivity of an aqueous solution depends on the number of ions present and their ionic mobility.<br><br>$\\text{HCl}$ is a strong electrolyte and dissociates completely in water to give $\\text{H}^+$ and $\\text{Cl}^-$ ions.<br><br>$\\text{CH}_3\\text{COOH}$ and $\\text{NH}_4\\text{OH}$ are weak electrolytes and dissociate only partially, producing fewer ions.<br><br>$\\text{C}_6\\text{H}_{12}\\text{O}_6$ (glucose) is a non-electrolyte and does not dissociate into ions.<br><br>Furthermore, the $\\text{H}^+$ ion has exceptionally high ionic mobility in water.<br><br>Thus, the equimolar solution of $\\text{HCl}$ has the highest concentration of highly mobile ions, making it the best conductor of electricity.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fd8c30a4553e1bdef4", "type": "singleCorrect", "question": {"text": "A weak base is $1.3\\%$ dissociated in its aqueous solution. If $K_b$ for weak base is $1.69 \\times 10^{-5}$ at $298$ K. Find the concentration of aqueous solution of weak base.", "image": null}, "options": [{"id": "BoSZF", "label": "A", "text": "$1$ M", "isCorrect": false, "image": null}, {"id": "qTX9v", "label": "B", "text": "$0.1$ M", "isCorrect": true, "image": null}, {"id": "1SR4t", "label": "C", "text": "$0.01$ M", "isCorrect": false, "image": null}, {"id": "DQ91w", "label": "D", "text": "$0.001$ M", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a weak base, the dissociation constant $K_b$ is given by Ostwald's dilution law:<br><br>$K_b = \\dfrac{C \\alpha^2}{1 - \\alpha}$<br><br>Since the degree of dissociation $\\alpha = 1.3\\% = 0.013$ is very small ($\\alpha \\ll 1$), we can approximate $1 - \\alpha \\approx 1$. The expression simplifies to:<br><br>$K_b = C \\alpha^2$<br><br>Rearranging for concentration $C$:<br><br>$C = \\dfrac{K_b}{\\alpha^2}$<br><br>Substituting the given values $K_b = 1.69 \\times 10^{-5}$ and $\\alpha = 0.013$:<br><br>$C = \\dfrac{1.69 \\times 10^{-5}}{(0.013)^2}$<br><br>$C = \\dfrac{1.69 \\times 10^{-5}}{1.69 \\times 10^{-4}}$<br><br>$C = 10^{-1} = 0.1$ M<br><br>Answer: $0.1$ M", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32a8c30a4553e1be0de", "type": "singleCorrect", "question": {"text": "Which of the following is Lewis acid?", "image": null}, "options": [{"id": "Bc37s", "label": "A", "text": "$\\text{BaCl}_2$", "isCorrect": false, "image": null}, {"id": "GwuQr", "label": "B", "text": "$\\text{KCl}$", "isCorrect": false, "image": null}, {"id": "w3ANA", "label": "C", "text": "$\\text{BeCl}_2$", "isCorrect": true, "image": null}, {"id": "wpoTl", "label": "D", "text": "$\\text{LiCl}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A Lewis acid is a chemical species that can accept a pair of electrons.<br><br>In $\\text{BeCl}_2$, the central beryllium atom forms two single covalent bonds with two chlorine atoms. The valence shell of beryllium in this molecule contains only $4$ electrons, which means its octet is incomplete.<br><br>Due to this electron deficiency, $\\text{BeCl}_2$ has a strong tendency to accept electron pairs from other species (Lewis bases) to complete its octet. For example, in the solid state, it forms a polymeric chain structure through coordinate bonding where chlorine atoms donate electron pairs to adjacent beryllium atoms.<br><br>The other given compounds ($\\text{BaCl}_2$, $\\text{KCl}$, $\\text{LiCl}$) are predominantly ionic, and their respective cations have stable noble gas (or duplet) configurations, so they do not act as Lewis acids.<br><br>Answer: $\\text{BeCl}_2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3268c30a4553e1be0ad", "type": "singleCorrect", "question": {"text": "Identify the conjugate bases of $\\text{H}_3\\text{PO}_3$ and $\\text{H}_2\\text{SO}_4$ respectively from following.", "image": null}, "options": [{"id": "EgbVH", "label": "A", "text": "$\\text{HPO}_3^{2-}$ and $\\text{SO}_4^{2-}$", "isCorrect": false, "image": null}, {"id": "PczFr", "label": "B", "text": "$\\text{HPO}_3^{2-}$ and $\\text{HSO}_4^{-}$", "isCorrect": false, "image": null}, {"id": "TomYl", "label": "C", "text": "$\\text{H}_2\\text{PO}_3^{-}$ and $\\text{HSO}_4^{-}$", "isCorrect": true, "image": null}, {"id": "lQlvE", "label": "D", "text": "$\\text{PO}_3^{3-}$ and $\\text{SO}_4^{2-}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The conjugate base of a Bronsted acid is formed by the removal of one proton ($H^+$) from it.<br><br>For $H_3PO_3$, the removal of one $H^+$ yields its conjugate base:<br><br>$H_3PO_3 \\rightarrow H^+ + H_2PO_3^-$<br><br>For $H_2SO_4$, the removal of one $H^+$ yields its conjugate base:<br><br>$H_2SO_4 \\rightarrow H^+ + HSO_4^-$<br><br>Therefore, the conjugate bases of $H_3PO_3$ and $H_2SO_4$ are $H_2PO_3^-$ and $HSO_4^-$ respectively.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3358c30a4553e1be153", "type": "singleCorrect", "question": {"text": "Identify from following a weak electrolyte based on their dissociation nature in aqueous medium.", "image": null}, "options": [{"id": "y6uZr", "label": "A", "text": "$\\text{NH}_3$", "isCorrect": true, "image": null}, {"id": "7TUVj", "label": "B", "text": "$\\text{NaOH}$", "isCorrect": false, "image": null}, {"id": "kiFel", "label": "C", "text": "$\\text{KOH}$", "isCorrect": false, "image": null}, {"id": "Od82y", "label": "D", "text": "$\\text{HI}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Strong electrolytes dissociate completely in an aqueous solution. <br><br> $\\text{NaOH}$ and $\\text{KOH}$ are strong bases and dissociate completely into their respective ions. <br><br> $\\text{HI}$ is a strong acid and also dissociates completely into ions. <br><br> $\\text{NH}_3$ is a weak base and dissociates only partially in an aqueous solution to form $\\text{NH}_4^+$ and $\\text{OH}^-$ ions. <br><br> Thus, $\\text{NH}_3$ is a weak electrolyte.<br><br>Answer: $\\text{NH}_3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e18c30a4553e1bddcf", "type": "singleCorrect", "question": {"text": "Identify from following the conjugate base of $[\\text{Zn}(\\text{H}_2\\text{O})_4]^{2+}$", "image": null}, "options": [{"id": "2PgnL", "label": "A", "text": "$[\\text{Zn}(\\text{H}_2\\text{O})_4]^{2-}\\,\\text{NH}_3$", "isCorrect": false, "image": null}, {"id": "341eR", "label": "B", "text": "$[\\text{Zn}(\\text{H}_2\\text{O})_3]^{2-}$", "isCorrect": false, "image": null}, {"id": "0c3JQ", "label": "C", "text": "$[\\text{Zn}(\\text{H}_2\\text{O})_3\\text{OH}]^{+}$", "isCorrect": true, "image": null}, {"id": "RESdb", "label": "D", "text": "$[\\text{Zn}(\\text{H}_2\\text{O})\\text{H}]^{3+}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the Bronsted-Lowry theory, a conjugate base is formed when an acid loses a proton ($\\text{H}^{+}$).<br><br>The given species is $[\\text{Zn}(\\text{H}_2\\text{O})_4]^{2+}$.<br><br>Removing a proton ($\\text{H}^{+}$) from one of the coordinated water molecules gives:<br><br>$[\\text{Zn}(\\text{H}_2\\text{O})_4]^{2+} \\rightarrow [\\text{Zn}(\\text{H}_2\\text{O})_3(\\text{OH})]^{+} + \\text{H}^{+}$<br><br>Thus, the conjugate base is $[\\text{Zn}(\\text{H}_2\\text{O})_3\\text{OH}]^{+}$.<br><br>Answer: $[\\text{Zn}(\\text{H}_2\\text{O})_3\\text{OH}]^{+}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3198c30a4553e1be027", "type": "singleCorrect", "question": {"text": "Identify the strongest base according to Bronsted-Lowry theory from following.", "image": null}, "options": [{"id": "VDGtB", "label": "A", "text": "$\\text{Cl}^-$", "isCorrect": false, "image": null}, {"id": "7cQtC", "label": "B", "text": "$\\text{CH}_3\\text{COO}^-$", "isCorrect": true, "image": null}, {"id": "sIuaY", "label": "C", "text": "$\\text{NO}_3^-$", "isCorrect": false, "image": null}, {"id": "8vE1o", "label": "D", "text": "$\\text{HSO}_4^-$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "According to the Bronsted-Lowry theory, a stronger base has a weaker conjugate acid.<br><br>The conjugate acids of the given bases are:<br>$\\text{Cl}^- \\rightarrow \\text{HCl}$ (strong acid)<br>$\\text{CH}_3\\text{COO}^- \\rightarrow \\text{CH}_3\\text{COOH}$ (weak acid)<br>$\\text{NO}_3^- \\rightarrow \\text{HNO}_3$ (strong acid)<br>$\\text{HSO}_4^- \\rightarrow \\text{H}_2\\text{SO}_4$ (strong acid)<br><br>Since $\\text{CH}_3\\text{COOH}$ is the weakest acid among the given conjugate acids, its conjugate base $\\text{CH}_3\\text{COO}^-$ is the strongest base.<br><br>Answer: $\\text{CH}_3\\text{COO}^-$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36e8c30a4553e1be3ac", "type": "singleCorrect", "question": {"text": "What is the relationship between the degree of dissociation of a weak base and its concentration?", "image": null}, "options": [{"id": "fw0ib", "label": "A", "text": "The degree of dissociation of a weak base is directly proportional to square root of its concentration.", "isCorrect": false, "image": null}, {"id": "jW5UB", "label": "B", "text": "The degree of dissociation of a weak base is inversely proportional to square root of its concentration.", "isCorrect": true, "image": null}, {"id": "lKp4r", "label": "C", "text": "The degree of dissociation of a weak base doesn't depend on concentration.", "isCorrect": false, "image": null}, {"id": "tdUco", "label": "D", "text": "The degree of dissociation of a weak base is directly proportional to its concentration", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a weak base $BOH$, the dissociation reaction is $BOH \\rightleftharpoons B^+ + OH^-$.<br><br>Let the initial concentration be $C$ and the degree of dissociation be $\\alpha$.<br><br>At equilibrium, the concentrations are $[BOH] = C(1-\\alpha)$, $[B^+] = C\\alpha$, and $[OH^-] = C\\alpha$.<br><br>The base dissociation constant $K_b$ is given by $K_b = \\dfrac{[B^+][OH^-]}{[BOH]} = \\dfrac{C\\alpha \\cdot C\\alpha}{C(1-\\alpha)} = \\dfrac{C\\alpha^2}{1-\\alpha}$.<br><br>For a weak base, $\\alpha$ is very small compared to $1$, so $1-\\alpha \\approx 1$.<br><br>Thus, $K_b \\approx C\\alpha^2 \\Rightarrow \\alpha = \\sqrt{\\dfrac{K_b}{C}}$.<br><br>Therefore, the degree of dissociation of a weak base is inversely proportional to the square root of its concentration.<br><br>Answer: The degree of dissociation of a weak base is inversely proportional to square root of its concentration.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bffbf9280d7f9932e5b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is degree of dissociation of $\\mathrm{CH}_3 \\mathrm{COOH}$ if $\\wedge^{\\circ}\\left(\\mathrm{CH}_3 \\mathrm{COO}^{-}\\right)=50 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$, $\\wedge^{\\circ}\\left(\\mathrm{H}^{+}\\right)=350 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ and molar conductivity of $5 \\times 10^{-2} \\mathrm{M} \\mathrm{CH}_3 \\mathrm{COOH}$ is $20 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ ?", "image": null}, "options": [{"id": "FqKeY", "text": "$1.25 \\times 10^{-4}$", "image": null, "isCorrect": false}, {"id": "XOPWe", "text": "$1.25 \\times 10^{-2}$", "image": null, "isCorrect": false}, {"id": "kSClC", "text": "$5 \\times 10^{-2}$", "image": null, "isCorrect": true}, {"id": "tRuRV", "text": "$5 \\times 10^{-4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The limiting molar conductivity of $\\mathrm{CH}_3\\mathrm{COOH}$ is given by Kohlrausch's law:<br><br>$\\wedge^{\\circ}_{m}(\\mathrm{CH}_3\\mathrm{COOH}) = \\wedge^{\\circ}(\\mathrm{CH}_3\\mathrm{COO}^{-}) + \\wedge^{\\circ}(\\mathrm{H}^{+})$<br><br>$\\wedge^{\\circ}_{m}(\\mathrm{CH}_3\\mathrm{COOH}) = 50 + 350 = 400 \\mathrm{~S} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$<br><br>The degree of dissociation $\\alpha$ is the ratio of molar conductivity at a given concentration to the limiting molar conductivity:<br><br>$\\alpha = \\dfrac{\\wedge_{m}}{\\wedge^{\\circ}_{m}}$<br><br>$\\alpha = \\dfrac{20}{400} = \\dfrac{1}{20} = 0.05$<br><br>$\\alpha = 5 \\times 10^{-2}$<br><br>Answer: $5 \\times 10^{-2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bfebf9280d7f9932e50", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify conjugate acid and conjugate base for $\\mathrm{HCO}_3{ }^{-}$ion respectively", "image": null}, "options": [{"id": "riEiK", "text": "$\\mathrm{CO}_3{ }^{2-}$ and $\\mathrm{H}_2 \\mathrm{CO}_3$", "image": null, "isCorrect": false}, {"id": "viGGL", "text": "$\\mathrm{H}_2 \\mathrm{CO}_3$ and $\\mathrm{CO}_2$", "image": null, "isCorrect": false}, {"id": "SYy3u", "text": "$\\mathrm{CO}_2$ and $\\mathrm{H}_2 \\mathrm{CO}_3$", "image": null, "isCorrect": false}, {"id": "DNYRB", "text": "$\\mathrm{H}_2 \\mathrm{CO}_3$ and $\\mathrm{CO}_3{ }^{2-}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to the Bronsted-Lowry theory, a conjugate acid is formed when a species accepts a proton ($\\mathrm{H}^+$), and a conjugate base is formed when a species donates a proton ($\\mathrm{H}^+$).<br><br>For the $\\mathrm{HCO}_3^{-}$ ion:<br>Conjugate acid = $\\mathrm{HCO}_3^{-} + \\mathrm{H}^+ \\rightarrow \\mathrm{H}_2\\mathrm{CO}_3$<br>Conjugate base = $\\mathrm{HCO}_3^{-} - \\mathrm{H}^+ \\rightarrow \\mathrm{CO}_3^{2-}$<br><br>Thus, the conjugate acid and conjugate base are $\\mathrm{H}_2\\mathrm{CO}_3$ and $\\mathrm{CO}_3^{2-}$ respectively.<br><br>Answer: $\\mathrm{H}_2 \\mathrm{CO}_3$ and $\\mathrm{CO}_3{ }^{2-}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf0bf9280d7f9932dd5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following is a strong electrolyte?", "image": null}, "options": [{"id": "QCIYn", "text": "$\\mathrm{NH}_4 \\mathrm{Cl}$", "image": null, "isCorrect": true}, {"id": "DQfH3", "text": "$\\mathrm{CH}_3 \\mathrm{COOH}$", "image": null, "isCorrect": false}, {"id": "4RaNk", "text": "$\\mathrm{NH}_4 \\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "R4usB", "text": "$\\mathrm{H}_2 \\mathrm{CO}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Strong electrolytes are substances that completely dissociate into ions in aqueous solutions. These include strong acids, strong bases, and most salts.<br><br>$\\mathrm{CH}_3 \\mathrm{COOH}$ is a weak acid, hence a weak electrolyte.<br><br>$\\mathrm{NH}_4 \\mathrm{OH}$ is a weak base, hence a weak electrolyte.<br><br>$\\mathrm{H}_2 \\mathrm{CO}_3$ is a weak acid, hence a weak electrolyte.<br><br>$\\mathrm{NH}_4 \\mathrm{Cl}$ is a salt formed from a weak base ($\\mathrm{NH}_4 \\mathrm{OH}$) and a strong acid ($\\mathrm{HCl}$). It completely dissociates into $\\mathrm{NH}_4^+$ and $\\mathrm{Cl}^-$ ions in aqueous solution, making it a strong electrolyte.<br><br>Answer: $\\mathrm{NH}_4 \\mathrm{Cl}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b78bf9280d7f993298a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify conjugate acid-base pair from following equilibrium reaction.\n$\\mathrm{HSO}_{3(\\mathrm{aq})}^{-}+\\mathrm{H}_3 \\mathrm{O}_{(\\mathrm{aq})}^{+} \\rightleftharpoons \\mathrm{H}_2 \\mathrm{SO}_3+\\mathrm{H}_2 \\mathrm{O}$", "image": null}, "options": [{"id": "JVHQp", "text": "$\\mathrm{H}_2 \\mathrm{SO}_3$ and $\\mathrm{HSO}_3^{-}$", "image": null, "isCorrect": true}, {"id": "bLqxB", "text": "$\\mathrm{HSO}_3^{-}$and $\\mathrm{H}_3 \\mathrm{O}^{+}$", "image": null, "isCorrect": false}, {"id": "bo6a8", "text": "$\\mathrm{H}_2 \\mathrm{SO}_3$ and $\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "vf5nq", "text": "$\\mathrm{H}_3 \\mathrm{O}^{+}$and $\\mathrm{H}_2 \\mathrm{SO}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A conjugate acid-base pair consists of two species that differ by a single proton ($\\mathrm{H}^+$).<br><br>In the given reaction:<br>$\\mathrm{HSO}_3^{-}$ accepts a proton to form $\\mathrm{H}_2 \\mathrm{SO}_3$. Thus, $\\mathrm{HSO}_3^{-}$ is the base and $\\mathrm{H}_2 \\mathrm{SO}_3$ is its conjugate acid.<br><br>$\\mathrm{H}_3 \\mathrm{O}^{+}$ donates a proton to form $\\mathrm{H}_2 \\mathrm{O}$. Thus, $\\mathrm{H}_3 \\mathrm{O}^{+}$ is the acid and $\\mathrm{H}_2 \\mathrm{O}$ is its conjugate base.<br><br>The conjugate acid-base pairs are $\\mathrm{H}_2 \\mathrm{SO}_3$ / $\\mathrm{HSO}_3^{-}$ and $\\mathrm{H}_3 \\mathrm{O}^{+}$ / $\\mathrm{H}_2 \\mathrm{O}$.<br><br>Among the given options, $\\mathrm{H}_2 \\mathrm{SO}_3$ and $\\mathrm{HSO}_3^{-}$ represent a conjugate acid-base pair.<br><br>Answer: $\\mathrm{H}_2 \\mathrm{SO}_3$ and $\\mathrm{HSO}_3^{-}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b69bf9280d7f99328f4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the conjugate acid-base pair respectively from following equilibrium reaction.\n$\\mathrm{HPO}_{4(\\mathrm{aq})}^{2-}+\\mathrm{H}_2 \\mathrm{O}_{(\\ell)} \\rightleftharpoons \\mathrm{PO}_{4(\\mathrm{aq})}^{3-}+\\mathrm{H}_3 \\mathrm{O}_{(\\mathrm{aq})}^{+}$", "image": null}, "options": [{"id": "Mufq9", "text": "$\\mathrm{H}_3 \\mathrm{O}^{+}$and $\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": true}, {"id": "ZgHdD", "text": "$\\mathrm{H}_2 \\mathrm{O}$ and $\\mathrm{HPO}_4^{2-}$", "image": null, "isCorrect": false}, {"id": "RF2Ba", "text": "$\\mathrm{PO}_4^{3-}$ and $\\mathrm{H}_3 \\mathrm{O}^{+}$", "image": null, "isCorrect": false}, {"id": "B8p2E", "text": "$\\mathrm{H}_3 \\mathrm{O}^{+}$and $\\mathrm{HPO}_4{ }^{2-}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the Bronsted-Lowry theory, a conjugate acid-base pair consists of two species that differ by a single proton ($\\mathrm{H}^{+}$).<br><br>In the given equilibrium reaction:<br>$\\mathrm{HPO}_{4}^{2-} + \\mathrm{H}_2 \\mathrm{O} \\rightleftharpoons \\mathrm{PO}_{4}^{3-} + \\mathrm{H}_3 \\mathrm{O}^{+}$<br><br>$\\mathrm{HPO}_{4}^{2-}$ donates a proton to become $\\mathrm{PO}_{4}^{3-}$. Thus, $\\mathrm{HPO}_{4}^{2-}$ is the acid and $\\mathrm{PO}_{4}^{3-}$ is its conjugate base.<br><br>$\\mathrm{H}_2 \\mathrm{O}$ accepts a proton to become $\\mathrm{H}_3 \\mathrm{O}^{+}$. Thus, $\\mathrm{H}_2 \\mathrm{O}$ is the base and $\\mathrm{H}_3 \\mathrm{O}^{+}$ is its conjugate acid.<br><br>The two conjugate acid-base pairs in this reaction are ($\\mathrm{HPO}_{4}^{2-}$, $\\mathrm{PO}_{4}^{3-}$) and ($\\mathrm{H}_3 \\mathrm{O}^{+}$, $\\mathrm{H}_2 \\mathrm{O}$).<br><br>Among the given options, $\\mathrm{H}_3 \\mathrm{O}^{+}$ and $\\mathrm{H}_2 \\mathrm{O}$ represent a valid conjugate acid-base pair respectively.<br><br>Answer: $\\mathrm{H}_3 \\mathrm{O}^{+}$and $\\mathrm{H}_2 \\mathrm{O}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214450aee93fa0796df55", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Calculate the pH of 0.02 M monobasic acid having $2 \\%$ dissociation.", "image": null}, "options": [{"id": "PAACy", "text": "3.4", "image": null, "isCorrect": true}, {"id": "MLZbo", "text": "4.5", "image": null, "isCorrect": false}, {"id": "9Wohl", "text": "5.1", "image": null, "isCorrect": false}, {"id": "oYsLB", "text": "5.8", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Concentration of monobasic acid, $C = 0.02$ M<br>Degree of dissociation, $\\alpha = 2\\% = 0.02$<br><br>The concentration of hydrogen ions is given by:<br>$[H^+] = C \\alpha$<br>$[H^+] = 0.02 \\times 0.02 = 4 \\times 10^{-4}$ M<br><br>The pH of the solution is:<br>$pH = -\\log_{10}[H^+]$<br>$pH = -\\log_{10}(4 \\times 10^{-4})$<br>$pH = 4 - \\log_{10} 4$<br>$pH = 4 - 0.6020 = 3.398 \\approx 3.4$<br><br>Answer: 3.4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214440aee93fa0796df4e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Which from following substances acts as a base when reacted with water?", "image": null}, "options": [{"id": "AAIu4", "text": "$\\mathrm{CH}_3 \\mathrm{COOH}$", "image": null, "isCorrect": false}, {"id": "npaA4", "text": "$\\mathrm{H}_2 \\mathrm{C}_2 \\mathrm{O}_4$", "image": null, "isCorrect": false}, {"id": "dm2Uk", "text": "HCl", "image": null, "isCorrect": false}, {"id": "r2Ilc", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Ammonia ($\\mathrm{NH}_3$) reacts with water to form ammonium ion ($\\mathrm{NH}_4^+$) and hydroxide ion ($\\mathrm{OH}^-$).<br><br>$\\mathrm{NH}_3 + \\mathrm{H}_2\\mathrm{O} \\rightleftharpoons \\mathrm{NH}_4^+ + \\mathrm{OH}^-$<br><br>Since $\\mathrm{NH}_3$ accepts a proton from water, it acts as a Bronsted-Lowry base. The other substances ($\\mathrm{CH}_3\\mathrm{COOH}$, $\\mathrm{H}_2\\mathrm{C}_2\\mathrm{O}_4$, and $\\mathrm{HCl}$) are acids and donate protons to water.<br><br>Answer: $\\mathrm{NH}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140e0aee93fa0796dd9d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Conjugate acid of $\\mathrm{NH}_2^{-}$and $\\mathrm{NH}_3$ are respectively", "image": null}, "options": [{"id": "i680m", "text": "$\\mathrm{NH}_4 \\mathrm{OH}$ and $\\mathrm{NH}_2 \\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "Ho3S6", "text": "$\\mathrm{NH}_3$ and $\\mathrm{NH}_2^{-}$", "image": null, "isCorrect": false}, {"id": "wHJWg", "text": "$\\mathrm{NH}_3$ and $\\mathrm{NH}_4{ }^{+}$", "image": null, "isCorrect": true}, {"id": "pVNU8", "text": "$\\mathrm{NH}_4{ }^{+}$and $\\mathrm{NH}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The conjugate acid of a species is formed by the addition of a proton ($\\mathrm{H}^{+}$) to it.<br><br>For $\\mathrm{NH}_2^{-}$, the conjugate acid is $\\mathrm{NH}_2^{-} + \\mathrm{H}^{+} \\rightarrow \\mathrm{NH}_3$.<br><br>For $\\mathrm{NH}_3$, the conjugate acid is $\\mathrm{NH}_3 + \\mathrm{H}^{+} \\rightarrow \\mathrm{NH}_4^{+}$.<br><br>Thus, the conjugate acids are $\\mathrm{NH}_3$ and $\\mathrm{NH}_4^{+}$ respectively.<br><br>Answer: $\\mathrm{NH}_3$ and $\\mathrm{NH}_4{ }^{+}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fc0aee93fa0796dd14", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Which among the following is the conjugate base of $\\mathrm{HClO}_4$ ?", "image": null}, "options": [{"id": "4SfQG", "text": "$\\mathrm{ClO}_4^{2-}$", "image": null, "isCorrect": false}, {"id": "dmyXB", "text": "$\\mathrm{ClO}_4$", "image": null, "isCorrect": false}, {"id": "JJao2", "text": "HCl", "image": null, "isCorrect": false}, {"id": "HQVIb", "text": "$\\mathrm{ClO}_4^{-}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to the Bronsted-Lowry theory, a conjugate base is formed when an acid donates a proton ($\\mathrm{H}^+$).<br><br>$\\mathrm{HClO}_4 \\rightleftharpoons \\mathrm{H}^+ + \\mathrm{ClO}_4^-$<br><br>Thus, the conjugate base of $\\mathrm{HClO}_4$ is $\\mathrm{ClO}_4^-$.<br><br>Answer: $\\mathrm{ClO}_4^{-}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213eb0aee93fa0796dc8d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Which among the following salts turns red litmus blue in its aqueous solution?", "image": null}, "options": [{"id": "ayLVM", "text": "$\\mathrm{Na}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": false}, {"id": "q6gyh", "text": "$\\mathrm{CH}_3 \\mathrm{COONa}$", "image": null, "isCorrect": true}, {"id": "VJ5Qg", "text": "$\\mathrm{NH}_4 \\mathrm{NO}_3$", "image": null, "isCorrect": false}, {"id": "qC2pf", "text": "$\\mathrm{CuCl}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A salt whose aqueous solution turns red litmus blue must be basic in nature.<br><br>A basic solution is formed by the hydrolysis of a salt derived from a weak acid and a strong base.<br><br>$\\mathrm{Na}_2 \\mathrm{SO}_4$ is a salt of a strong acid ($\\mathrm{H}_2 \\mathrm{SO}_4$) and a strong base ($\\mathrm{NaOH}$). Its solution is neutral.<br><br>$\\mathrm{CH}_3 \\mathrm{COONa}$ is a salt of a weak acid ($\\mathrm{CH}_3 \\mathrm{COOH}$) and a strong base ($\\mathrm{NaOH}$). The acetate ion undergoes hydrolysis to produce $\\mathrm{OH}^-$ ions, making the solution basic. Thus, it turns red litmus blue.<br><br>$\\mathrm{NH}_4 \\mathrm{NO}_3$ is a salt of a strong acid ($\\mathrm{HNO}_3$) and a weak base ($\\mathrm{NH}_4 \\mathrm{OH}$). Its solution is acidic.<br><br>$\\mathrm{CuCl}_2$ is a salt of a strong acid ($\\mathrm{HCl}$) and a weak base ($\\mathrm{Cu(OH)}_2$). Its solution is acidic.<br><br>Answer: $\\mathrm{CH}_3 \\mathrm{COONa}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e90aee93fa0796dc82", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "A monobasic acid is $5 \\%$ dissociated in its 0.02 M solution. Calculate the dissociation constant of acid.", "image": null}, "options": [{"id": "aKA1X", "text": "$2 \\times 10^{-2}$", "image": null, "isCorrect": false}, {"id": "mTKCr", "text": "$4 \\times 10^{-4}$", "image": null, "isCorrect": false}, {"id": "EuLI5", "text": "$5 \\times 10^{-5}$", "image": null, "isCorrect": true}, {"id": "uraaf", "text": "$2.5 \\times 10^{-4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, concentration $C = 0.02$ M<br><br>Degree of dissociation $\\alpha = 5\\% = 0.05$<br><br>For a weak monobasic acid, the dissociation constant $K_a$ is given by:<br><br>$K_a = \\dfrac{C \\alpha^2}{1 - \\alpha}$<br><br>Since $\\alpha$ is very small, $1 - \\alpha \\approx 1$.<br><br>$K_a = C \\alpha^2$<br><br>Substituting the given values:<br><br>$K_a = 0.02 \\times (0.05)^2$<br><br>$K_a = 0.02 \\times 0.0025$<br><br>$K_a = 5 \\times 10^{-5}$<br><br>Answer: $5 \\times 10^{-5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d20aee93fa0796dbc9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Calculate dissociation constant of a weak monobasic acid if it is $0.05 \\%$ dissociated in 0.02 M solution.", "image": null}, "options": [{"id": "N6R0C", "text": "$2.0 \\times 10^{-9}$", "image": null, "isCorrect": false}, {"id": "wLIOw", "text": "$3.0 \\times 10^{-9}$", "image": null, "isCorrect": false}, {"id": "NMOu7", "text": "$4.0 \\times 10^{-9}$", "image": null, "isCorrect": false}, {"id": "I0ks8", "text": "$5.0 \\times 10^{-9}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Degree of dissociation, $\\alpha = 0.05\\% = \\dfrac{0.05}{100} = 5 \\times 10^{-4}$<br><br>Concentration, $C = 0.02$ M<br><br>For a weak monobasic acid, the dissociation constant is given by:<br><br>$K_a = \\dfrac{C \\alpha^2}{1 - \\alpha}$<br><br>Since $\\alpha \\ll 1$, $1 - \\alpha \\approx 1$<br><br>$K_a = C \\alpha^2$<br><br>Substituting the values:<br><br>$K_a = 0.02 \\times (5 \\times 10^{-4})^2$<br><br>$K_a = 2 \\times 10^{-2} \\times 25 \\times 10^{-8}$<br><br>$K_a = 50 \\times 10^{-10} = 5.0 \\times 10^{-9}$<br><br>Answer: $5.0 \\times 10^{-9}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c50aee93fa0796db5e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "What is the pH of $10^{-8} \\mathrm{MHCl}$ solution?", "image": null}, "options": [{"id": "QOSIR", "text": "8", "image": null, "isCorrect": false}, {"id": "ci5Tg", "text": "7", "image": null, "isCorrect": false}, {"id": "Q0xp9", "text": "&lt; 7", "image": null, "isCorrect": true}, {"id": "PIHQO", "text": "$\\gt8$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a very dilute acidic solution like $10^{-8}$ M HCl, the contribution of $H^+$ from the autoionization of water cannot be neglected.<br><br>Total $[H^+] = [H^+]_{\\text{HCl}} + [H^+]_{\\text{H}_2\\text{O}}$<br><br>Let $[H^+]_{\\text{H}_2\\text{O}} = x$. Then $[OH^-] = x$.<br><br>$[H^+]_{\\text{total}} = 10^{-8} + x$<br><br>Using the ionic product of water, $K_w = [H^+][OH^-] = 10^{-14}$<br><br>$(10^{-8} + x)x = 10^{-14}$<br><br>$x^2 + 10^{-8}x - 10^{-14} = 0$<br><br>Solving the quadratic equation for $x$:<br><br>$x = \\dfrac{-10^{-8} + \\sqrt{10^{-16} + 4 \\times 10^{-14}}}{2} \\approx 9.5 \\times 10^{-8}$ M<br><br>Total $[H^+] = 10^{-8} + 9.5 \\times 10^{-8} = 1.05 \\times 10^{-7}$ M<br><br>$\\text{pH} = -\\log(1.05 \\times 10^{-7}) = 7 - \\log(1.05) \\approx 6.98$<br><br>Since the solution is acidic, the pH must be less than 7.<br><br>Answer: &lt; 7", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139d0aee93fa0796da28", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Which among the following is correct conjugate actd base pair for the equation stated below?\n$\\mathrm{HCl}+\\mathrm{NH}_3 \\rightleftharpoons \\mathrm{NH}_4^{+}+\\mathrm{Cl}^{-}$", "image": null}, "options": [{"id": "tbIzq", "text": "$\\mathrm{Cl}^{-}$and $\\mathrm{NH}_4^{+}$", "image": null, "isCorrect": false}, {"id": "BgWkV", "text": "HCl and $\\mathrm{NH}_3$", "image": null, "isCorrect": false}, {"id": "aGInn", "text": "$\\mathrm{NH}_4^{+}$and $\\mathrm{NH}_3$", "image": null, "isCorrect": true}, {"id": "BEAbe", "text": "$\\mathrm{NH}_4^{+}$and HCl", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A conjugate acid-base pair consists of two species that differ by a single proton ($\\mathrm{H}^+$).<br><br>In the given reaction, $\\mathrm{HCl}$ donates a proton to form $\\mathrm{Cl}^-$, making $\\mathrm{HCl}$ and $\\mathrm{Cl}^-$ a conjugate acid-base pair.<br><br>Similarly, $\\mathrm{NH}_3$ accepts a proton to form $\\mathrm{NH}_4^+$, making $\\mathrm{NH}_4^+$ and $\\mathrm{NH}_3$ a conjugate acid-base pair.<br><br>Among the given options, $\\mathrm{NH}_4^+$ and $\\mathrm{NH}_3$ represent a correct conjugate acid-base pair.<br><br>Answer: $\\mathrm{NH}_4^{+}$and $\\mathrm{NH}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139b0aee93fa0796da1e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Molar conductivity of 0.02 M weak acid is $7.92 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$ and its molar conductivity at infinite dilution is $232.7 \\Omega^{-1} \\mathrm{~cm}^2 \\mathrm{~mol}^{-1}$.\nCalculate degree of dissociation of weak acid.", "image": null}, "options": [{"id": "MXAme", "text": "0.0112", "image": null, "isCorrect": false}, {"id": "BzOTK", "text": "0.0341", "image": null, "isCorrect": true}, {"id": "BKKAo", "text": "0.0694", "image": null, "isCorrect": false}, {"id": "M0ozI", "text": "0.292", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The degree of dissociation $\\alpha$ of a weak electrolyte is given by the ratio of its molar conductivity at a given concentration to its molar conductivity at infinite dilution.<br><br>$\\alpha = \\dfrac{\\Lambda_m}{\\Lambda_m^\\infty}$<br><br>Given:<br>$\\Lambda_m = 7.92 \\, \\Omega^{-1} \\text{cm}^2 \\text{mol}^{-1}$<br>$\\Lambda_m^\\infty = 232.7 \\, \\Omega^{-1} \\text{cm}^2 \\text{mol}^{-1}$<br><br>Substituting the values:<br>$\\alpha = \\dfrac{7.92}{232.7}$<br><br>$\\alpha \\approx 0.034035 \\approx 0.0341$<br><br>Answer: 0.0341", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213780aee93fa0796d904", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Calculate the concentration of weak monobasic acid if its degree of dissociation and dissociation constant are $5.0 \\times 10^{-4}$ and $5.0 \\times 10^{-9}$ respectively.", "image": null}, "options": [{"id": "OMo4g", "text": "0.1 M", "image": null, "isCorrect": false}, {"id": "5sqKo", "text": "$\\quad 0.02 \\mathrm{M}$", "image": null, "isCorrect": true}, {"id": "A2YAz", "text": "$\\quad 0.03 \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "LXuDm", "text": "$\\quad 0.04 \\mathrm{M}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a weak monobasic acid, the dissociation constant is given by $K_a = C \\alpha^2$ (since $\\alpha \\ll 1$).<br><br>Rearranging for concentration $C$:<br><br>$C = \\dfrac{K_a}{\\alpha^2}$<br><br>Substituting the given values:<br><br>$C = \\dfrac{5.0 \\times 10^{-9}}{(5.0 \\times 10^{-4})^2}$<br><br>$C = \\dfrac{5.0 \\times 10^{-9}}{25.0 \\times 10^{-8}}$<br><br>$C = \\dfrac{5.0}{25.0} \\times 10^{-1}$<br><br>$C = 0.2 \\times 10^{-1} = 0.02$ M<br><br>Answer: $\\quad 0.02 \\mathrm{M}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213630aee93fa0796d868", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Calculate ' $\\alpha$ ' for 0.1 M acetic acid $\\left(\\mathrm{K}_{\\mathrm{a}}=1.0 \\times 10^{-5}\\right)$", "image": null}, "options": [{"id": "dMBdV", "text": "$10^{-2}$", "image": null, "isCorrect": true}, {"id": "MNXYR", "text": "$10^{-3}$", "image": null, "isCorrect": false}, {"id": "1sUdq", "text": "$10^{-4}$", "image": null, "isCorrect": false}, {"id": "ZAv2x", "text": "$10^{-5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $C = 0.1$ M and $K_a = 1.0 \\times 10^{-5}$.<br><br>For a weak acid, the dissociation constant is given by $K_a = \\dfrac{C \\alpha^2}{1 - \\alpha}$.<br><br>Since $K_a$ is very small, $\\alpha \\ll 1$, which gives $1 - \\alpha \\approx 1$.<br><br>Therefore, $K_a = C \\alpha^2$.<br><br>Substituting the given values:<br><br>$1.0 \\times 10^{-5} = 0.1 \\times \\alpha^2$<br><br>$\\alpha^2 = \\dfrac{1.0 \\times 10^{-5}}{0.1} = 10^{-4}$<br><br>$\\alpha = \\sqrt{10^{-4}} = 10^{-2}$<br><br>Answer: $10^{-2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213610aee93fa0796d854", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Which of the following compounds is amphoteric in nature?", "image": null}, "options": [{"id": "ExBVW", "text": "HCl", "image": null, "isCorrect": false}, {"id": "5jQrE", "text": "$\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": true}, {"id": "3BDBR", "text": "$\\mathrm{CH}_3 \\mathrm{COOH}$", "image": null, "isCorrect": false}, {"id": "cDj7o", "text": "NaOH", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "An amphoteric substance is one that can act as both an acid and a base.<br><br>According to the Brønsted-Lowry theory, water ($\\mathrm{H}_2 \\mathrm{O}$) can donate a proton to form $\\mathrm{OH}^{-}$ (acting as an acid) and accept a proton to form $\\mathrm{H}_3\\mathrm{O}^{+}$ (acting as a base).<br><br>Reaction as a base: $\\mathrm{H}_2\\mathrm{O} + \\mathrm{HCl} \\rightleftharpoons \\mathrm{H}_3\\mathrm{O}^{+} + \\mathrm{Cl}^{-}$<br><br>Reaction as an acid: $\\mathrm{H}_2\\mathrm{O} + \\mathrm{NH}_3 \\rightleftharpoons \\mathrm{OH}^{-} + \\mathrm{NH}_4^{+}$<br><br>$\\mathrm{HCl}$ is a strong acid, $\\mathrm{NaOH}$ is a strong base, and $\\mathrm{CH}_3\\mathrm{COOH}$ is a weak acid. Therefore, $\\mathrm{H}_2 \\mathrm{O}$ is the only amphoteric compound among the given options.<br><br>Answer: $\\mathrm{H}_2 \\mathrm{O}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134c0aee93fa0796d7b4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Calculate $\\left[\\mathrm{H}_3 \\mathrm{O}^{+}\\right]$in 0.02 M solution of monobasic acid if dissociation constant is $1.8 \\times 10^{-5}$.", "image": null}, "options": [{"id": "tpEzs", "text": "$\\quad 3.0 \\times 10^{-4} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "igOEd", "text": "$6.0 \\times 10^{-4} \\mathrm{M}$", "image": null, "isCorrect": true}, {"id": "3DOI9", "text": "$2.0 \\times 10^{-4} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "om3jC", "text": "$4.0 \\times 10^{-4} \\mathrm{M}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a weak monobasic acid, the dissociation constant $K_a$ is given by $K_a = \\dfrac{C\\alpha^2}{1-\\alpha}$.<br><br>Assuming $\\alpha \\ll 1$, we have $K_a = C\\alpha^2 \\Rightarrow \\alpha = \\sqrt{\\dfrac{K_a}{C}}$.<br><br>The concentration of hydronium ions is $[\\mathrm{H}_3 \\mathrm{O}^{+}] = C\\alpha = \\sqrt{K_a \\times C}$.<br><br>Substituting the given values:<br><br>$[\\mathrm{H}_3 \\mathrm{O}^{+}] = \\sqrt{1.8 \\times 10^{-5} \\times 0.02}$<br><br>$[\\mathrm{H}_3 \\mathrm{O}^{+}] = \\sqrt{3.6 \\times 10^{-7}}$<br><br>$[\\mathrm{H}_3 \\mathrm{O}^{+}] = \\sqrt{36 \\times 10^{-8}}$<br><br>$[\\mathrm{H}_3 \\mathrm{O}^{+}] = 6.0 \\times 10^{-4} \\mathrm{M}$<br><br>Answer: $6.0 \\times 10^{-4} \\mathrm{M}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133e0aee93fa0796d743", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Which of the following species acts as a conjugate base in the reverse reaction, according to Bronsted-Lowry theory?\n\\(\\mathrm{HCl}+\\mathrm{NH}_3 \\rightleftharpoons \\mathrm{NH}_{4(\\mathrm{aq})}^{+}+\\mathrm{Cl}_{(\\mathrm{aq})}^{-}\\)", "image": null}, "options": [{"id": "yIDew", "text": "$\\mathrm{Cl}^{-}$", "image": null, "isCorrect": true}, {"id": "gLnAN", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": false}, {"id": "boegK", "text": "$\\mathrm{NH}_4^{+}$", "image": null, "isCorrect": false}, {"id": "MjZIP", "text": "HCl", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the Bronsted-Lowry theory, an acid is a proton donor and a base is a proton acceptor.<br><br>In the given reversible reaction:<br>$\\mathrm{HCl} + \\mathrm{NH}_3 \\rightleftharpoons \\mathrm{NH}_4^+ + \\mathrm{Cl}^-$<br><br>In the forward reaction, $\\mathrm{HCl}$ donates a proton to $\\mathrm{NH}_3$. Thus, $\\mathrm{HCl}$ acts as an acid and $\\mathrm{NH}_3$ acts as a base. The species formed after $\\mathrm{HCl}$ loses a proton is $\\mathrm{Cl}^-$, which is its conjugate base.<br><br>In the reverse reaction:<br>$\\mathrm{NH}_4^+ + \\mathrm{Cl}^- \\rightleftharpoons \\mathrm{HCl} + \\mathrm{NH}_3$<br><br>Here, $\\mathrm{NH}_4^+$ donates a proton to $\\mathrm{Cl}^-$. Since $\\mathrm{Cl}^-$ accepts the proton, it acts as a base. Therefore, $\\mathrm{Cl}^-$ is the conjugate base that acts as a base in the reverse reaction.<br><br>Answer: $\\mathrm{Cl}^{-}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6
