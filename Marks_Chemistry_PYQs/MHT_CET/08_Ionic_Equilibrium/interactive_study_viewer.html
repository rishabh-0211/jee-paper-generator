c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133a0aee93fa0796d724", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Calculate $\\left[\\mathrm{H}_3 \\mathrm{O}^{+}\\right]$of a monobasic acid if it is $0.04 \\%$ dissociated in 0.05 M solution.", "image": null}, "options": [{"id": "LKisn", "text": "$1 \\times 10^{-5}$", "image": null, "isCorrect": false}, {"id": "PG6va", "text": "$1.5 \\times 10^{-5}$", "image": null, "isCorrect": false}, {"id": "yy3Tx", "text": "$2.0 \\times 10^{-5}$", "image": null, "isCorrect": true}, {"id": "kkFpE", "text": "$3.0 \\times 10^{-5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a weak monobasic acid, the concentration of hydronium ions is given by $[\\mathrm{H}_3\\mathrm{O}^+] = C\\alpha$.<br><br>Given concentration $C = 0.05$ M.<br><br>Degree of dissociation $\\alpha = 0.04\\% = \\dfrac{0.04}{100} = 4 \\times 10^{-4}$.<br><br>Substituting the values:<br><br>$[\\mathrm{H}_3\\mathrm{O}^+] = 0.05 \\times 4 \\times 10^{-4}$<br><br>$[\\mathrm{H}_3\\mathrm{O}^+] = 2.0 \\times 10^{-5}$ M.<br><br>Answer: $2.0 \\times 10^{-5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213290aee93fa0796d6a3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Which of the following salt solutions turns red litmus blue?", "image": null}, "options": [{"id": "RIjbJ", "text": "$\\mathrm{NH}_4 \\mathrm{CN}$", "image": null, "isCorrect": true}, {"id": "xbVDv", "text": "$\\mathrm{NH}_4 \\mathrm{Cl}$", "image": null, "isCorrect": false}, {"id": "1LpUf", "text": "$\\mathrm{NH}_4 \\mathrm{NO}_3$", "image": null, "isCorrect": false}, {"id": "PhrIj", "text": "$\\mathrm{NaNO}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A solution that turns red litmus blue must be basic in nature.<br><br>$\\mathrm{NH}_4\\mathrm{CN}$ is a salt of a weak acid ($\\mathrm{HCN}$) and a weak base ($\\mathrm{NH}_4\\mathrm{OH}$).<br><br>The dissociation constant of $\\mathrm{NH}_4\\mathrm{OH}$ ($K_b \\approx 1.8 \\times 10^{-5}$) is greater than the dissociation constant of $\\mathrm{HCN}$ ($K_a \\approx 4.9 \\times 10^{-10}$).<br><br>Since $K_b > K_a$, the anionic hydrolysis of $\\mathrm{CN}^-$ is more extensive than the cationic hydrolysis of $\\mathrm{NH}_4^+$, resulting in an excess of $\\mathrm{OH}^-$ ions.<br><br>Thus, the aqueous solution of $\\mathrm{NH}_4\\mathrm{CN}$ is basic and turns red litmus blue.<br><br>$\\mathrm{NH}_4\\mathrm{Cl}$ and $\\mathrm{NH}_4\\mathrm{NO}_3$ are salts of a strong acid and a weak base, so their solutions are acidic.<br><br>$\\mathrm{NaNO}_3$ is a salt of a strong acid and a strong base, so its solution is neutral.<br><br>Answer: $\\mathrm{NH}_4 \\mathrm{CN}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627f0279619d9d8a3501", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Identify base ${ }_2$ for following equation according to Bronsted-Lowry theory.\n$\\mathrm{HCl}_{(\\mathrm{aq})}+\\mathrm{H}_2 \\mathrm{O}_{(0)} \\rightleftharpoons \\mathrm{H}_3 \\mathrm{O}_{(\\mathrm{squ})}^{+}+\\mathrm{Cl}_{(\\mathrm{aq})}^{-}$", "image": null}, "options": [{"id": "89x8Z", "text": "$\\mathrm{H}_3 \\mathrm{O}_{(\\text {(aq) }}^{+}$", "image": null, "isCorrect": false}, {"id": "IkaPZ", "text": "$\\mathrm{H}_2 \\mathrm{O}_{(l)}$", "image": null, "isCorrect": true}, {"id": "VJ1sj", "text": "$\\mathrm{Cl}_{(\\mathrm{aq})}^{-}$", "image": null, "isCorrect": false}, {"id": "Uxe7q", "text": "$\\mathrm{HCl}_{(\\mathrm{aq})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/AYCZ9-2CZaC_4cdpSUN-t3icAu3vexgUa0u49NcR1x8.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626b0279619d9d8a3463", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Which activity from following is exhibited by Lewis base according to definition?", "image": null}, "options": [{"id": "rNEFd", "text": "accept a pair of electron", "image": null, "isCorrect": false}, {"id": "Wyg3a", "text": "donate a pair of electron", "image": null, "isCorrect": true}, {"id": "ZssPk", "text": "accept $\\mathrm{H}^{+}$ions", "image": null, "isCorrect": false}, {"id": "IVV11", "text": "donate $\\mathrm{OH}$ ions", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std. $12 \\mid$ Ch-3 $\\mid$ Subtopic-3.3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262130279619d9d8a3195", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "What is the formal charge on sulfur in following Lewis structure?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/JIj6bW9iXpUMO34Xzuf2wxLnphcUCjBvKZeI9e70MpI.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "twG0t", "text": "$2$", "image": null, "isCorrect": false}, {"id": "QWzlq", "text": "$-2$", "image": null, "isCorrect": false}, {"id": "0XBrw", "text": "$0$", "image": null, "isCorrect": true}, {"id": "Got3i", "text": "$-1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Formal Charge $(\\mathrm{FC})=$ V.E. - N.E. $-1 / 2$ (B.E.) $\\mathrm{FC}$ on $\\mathrm{S}=6-0-1 / 2(12)=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d60279619d9d8a2fb8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "Lewis acid is a substance that:", "image": null}, "options": [{"id": "gYZvR", "text": "gives $\\mathrm{H}^{+}$ions aqueous solution", "image": null, "isCorrect": false}, {"id": "XY1eL", "text": "accepts a proton", "image": null, "isCorrect": false}, {"id": "TL6dN", "text": "accepts electron pair", "image": null, "isCorrect": true}, {"id": "RYVN8", "text": "donates a proton", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12|Ch-3|Subopic-3.3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2619e0279619d9d8a2e02", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Which among the following is NOT Lewis acid?", "image": null}, "options": [{"id": "v8qm5", "text": "$\\mathrm{AlCl}_3$", "image": null, "isCorrect": false}, {"id": "dNBf3", "text": "$\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": true}, {"id": "a47wb", "text": "$\\mathrm{BF}_3$", "image": null, "isCorrect": false}, {"id": "bx3EG", "text": "$\\mathrm{Ag}^{+}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{H}_2 \\mathrm{O}$ is a lewis base not acid as it contains 2, lone pair of electrons.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2618a0279619d9d8a2d64", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "Which of the following is a Lewis acid but not a Bronsted acid?", "image": null}, "options": [{"id": "z1svl", "text": "$\\mathrm{HSO}_4^{-}$", "image": null, "isCorrect": false}, {"id": "1Pk3d", "text": "$\\mathrm{HNO}_3$", "image": null, "isCorrect": false}, {"id": "o0nK7", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": false}, {"id": "BGGbi", "text": "$\\mathrm{BCl}_3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/u4bbTz7rcdRLaqFJYbd44t420B6ejgjpvS6GbNebmlQ.original.fullsize.png\">\nElectron deficient compound therefore Lewis acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2617a0279619d9d8a2ce0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "According to Bronsted - Lowry theory the acids in the following are\n$\\mathrm{ClO}_4^{-}+\\mathrm{HCO}_3^{-} \\rightarrow \\mathrm{HClO}_4+\\mathrm{CO}_3^{2-}$", "image": null}, "options": [{"id": "1Zu7o", "text": "$\\mathrm{HCO}_3^{-}$and $\\mathrm{HClO}_4$", "image": null, "isCorrect": true}, {"id": "8GU4J", "text": "$\\mathrm{ClO}_4^{-}$and $\\mathrm{CO}_3^{2-}$", "image": null, "isCorrect": false}, {"id": "ALELb", "text": "$\\mathrm{HClO}_4$ and $\\mathrm{CO}_3^{-2}$", "image": null, "isCorrect": false}, {"id": "UvYou", "text": "$\\mathrm{ClO}_4^{-}$and $\\mathrm{HCO}_3^{-}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/itqdIhtsQwsfSp78_6VP83DUUF8zK6-xB9n_JmgQlGI.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261080279619d9d8a2945", "type": "singleCorrect", " e": null, "solution": {"text": "$\\mathrm{HSO}_4^{-}$is an amphoteric specie.\nIt can act as an acid as well as base.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2609a0279619d9d8a25d4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "Identify conjugate acid-Base pair in the following reaction.\n$$\n\\mathrm{HCl}_{(\\mathrm{aq})}+\\mathrm{H}_2 \\mathrm{O}_{(t)} \\rightleftharpoons \\mathrm{H}_3 \\mathrm{O}_{(\\mathrm{aq})}^{+}+\\mathrm{Cl}_{(\\mathrm{aq})}^{-}\n$$", "image": null}, "options": [{"id": "3Zax8", "text": "$\\mathrm{H}_3 \\mathrm{O}_{(\\mathrm{aq})}^{+}$and $\\mathrm{Cl}_{(\\mathrm{aq})}^{-}$", "image": null, "isCorrect": false}, {"id": "0jykR", "text": "$\\mathrm{H}_3 \\mathrm{O}_{(\\mathrm{aq})}^{+}$and $\\mathrm{H}_2 \\mathrm{O}_{(l)}$", "image": null, "isCorrect": true}, {"id": "qVbAN", "text": "$\\mathrm{HCl}_{(\\mathrm{aq})}$ and $\\mathrm{H}_2 \\mathrm{O}_{(l)}$", "image": null, "isCorrect": false}, {"id": "PjO2k", "text": "$\\mathrm{Cl}_{(\\mathrm{aq})}^{-}$and $\\mathrm{H}_2 \\mathrm{O}_{(l)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/fgvZ0KZmptgB9XGErS9daQDovsfaPPEQN2AIYncVqAg.original.fullsize.png\"><br>\nConjugate Acid - Base pairs in given reaction,\n(1) $\\mathrm{HCl}_{(\\mathrm{aq})}$ and $\\mathrm{Cl}_{(\\mathrm{aq})}^{-}$\n(2) $\\mathrm{H}_2 \\mathrm{O}_{(\\ell)}$ and $\\mathrm{H}_3 \\mathrm{O}_{(\\mathrm{aq})}^{+}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260840279619d9d8a2520", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "Which of the following is NOT a correct mathematical equation for Ostwald dilution law?", "image": null}, "options": [{"id": "V9HCT", "text": "$\\propto=\\sqrt{\\frac{\\mathrm{K}_{\\mathrm{a}}}{\\mathrm{c}}}$", "image": null, "isCorrect": false}, {"id": "XOzM5", "text": "$\\mathrm{K}=\\frac{\\propto^2}{\\mathrm{~V}}$", "image": null, "isCorrect": false}, {"id": "qav63", "text": "$\\mathrm{K}=\\propto^2 \\mathrm{c}$", "image": null, "isCorrect": false}, {"id": "J3qvq", "text": "$\\propto=\\sqrt{\\frac{\\mathrm{K}_{\\mathrm{a}}}{\\mathrm{V}}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Ostwald dilution law of weak electrolyte,\n$$\n\\begin{aligned}\n& \\mathrm{HA}_{(\\mathrm{aq})} \\rightleftharpoons \\mathrm{H}_{(\\mathrm{aq})}^{+}+\\mathrm{A}_{(\\mathrm{aq})}^{-} \\\\\n& \\mathrm{C} \\quad-\\quad- \\\\\n& \\mathrm{C}-\\mathrm{C} \\propto \\quad \\mathrm{C} \\propto \\quad \\mathrm{C} \\propto \\\\\n& \\mathrm{K}_{\\mathrm{a}}=\\frac{\\left[\\mathrm{H}^{+}\\right]\\left[\\mathrm{A}^{-}\\right]}{[\\mathrm{HA}]} \\\\\n& \\mathrm{K}_{\\mathrm{a}}=\\frac{\\mathrm{C} \\propto^2}{1-\\propto c}(1-\\propto \\simeq 1) \\\\\n& \\mathrm{K}_{\\mathrm{a}}=\\mathrm{C} \\propto^2 \\\\\n& \\propto^2=\\frac{\\mathrm{K}_{\\mathrm{a}}}{\\mathrm{C}} \\\\\n& \\propto=\\sqrt{\\frac{\\mathrm{K}_{\\mathrm{a}}}{\\mathrm{C}}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2603f0279619d9d8a22f0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "Which from following compounds accepts proton from water molecule according to Bronsted-Lowry theory?", "image": null}, "options": [{"id": "x7EuR", "text": "$\\mathrm{NaOH}_{(\\mathrm{aq})}$", "image": null, "isCorrect": false}, {"id": "ugNua", "text": "$\\mathrm{HCl}_{(\\mathrm{aq})}$", "image": null, "isCorrect": false}, {"id": "ny8Vc", "text": "$\\mathrm{NH}_{3(\\mathrm{aq})}$", "image": null, "isCorrect": true}, {"id": "SJPPW", "text": "$\\mathrm{NH}_4 \\mathrm{OH}_{(\\mathrm{aq})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{H}_2 \\mathrm{O}_{(\\ell)}+\\mathrm{NH}_{3(\\mathrm{aq})} \\rightleftharpoons \\mathrm{NH}_{4(\\mathrm{aq})}^{+}+\\mathrm{OH}_{(\\mathrm{aq})}^{-}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260290279619d9d8a223c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "A substance containing hydrogen and releasing $\\mathrm{H}^{+}$in aqueous medium is acid. Identify theory suggesting this concept, from following.", "image": null}, "options": [{"id": "nnlFl", "text": "Ostwald theory", "image": null, "isCorrect": false}, {"id": "wWzAW", "text": "Bronsted-Lowry theory", "image": null, "isCorrect": false}, {"id": "FgGsN", "text": "Arrhenius theory", "image": null, "isCorrect": true}, {"id": "xRpOD", "text": "Lewis theory", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Arrhenius theory an acid is a\nSubstance that contains hydrogen and gives $\\mathrm{H}^{+}$ions in an aqueous solution.\n- $\\quad$ Lewis acid $\\rightarrow$ lone pair acceptor\n- $\\quad$ Bronsted-Lowry acid is a substance which donates a proton or $\\mathrm{H}^{+}$ion to the other compound and forms a conjugated base.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9d0279619d9d8a15de", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The conjugate acid of $\\mathrm{HS}^{-}$ is", "image": null}, "options": [{"id": "XJqyY", "text": "$\\mathrm{S}^{2-}$", "image": null, "isCorrect": false}, {"id": "VBOSC", "text": "$\\mathrm{H}_{2} \\mathrm{~S}$", "image": null, "isCorrect": true}, {"id": "UdMOq", "text": "Both (a) and (b)", "image": null, "isCorrect": false}, {"id": "7UcGA", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/oeK_knzYBB6tNTFujCqxpydmqqfP55JhLSAnuSlXDwI.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7d0279619d9d8a14dc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "Which is not an example of common ion effect?", "image": null}, "options": [{"id": "sI3iV", "text": "$\\mathrm{NaCl}+\\mathrm{AgCl}$", "image": null, "isCorrect": false}, {"id": "N9NUD", "text": "$\\mathrm{H}_{2} \\mathrm{~S}+\\mathrm{HCl}$", "image": null, "isCorrect": false}, {"id": "ytzuw", "text": "$\\mathrm{CH}_{3} \\mathrm{COOH}+\\mathrm{NaOH}$", "image": null, "isCorrect": true}, {"id": "aogyQ", "text": "$\\mathrm{NH}_{4} \\mathrm{OH}+\\mathrm{NH}_{4} \\mathrm{Cl}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Common ion effect is the suppression of degree of dissociation of a weak electrolyte in the presence of a strong electrolyte having common ion.\nAmong the given, $\\mathrm{CH}_{3} \\mathrm{COOH}+\\mathrm{NaOH}$ has no common ion, thus does not exhibit common ion effect.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7b0279619d9d8a14c9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "Conjugate acid-base pair differ by", "image": null}, "options": [{"id": "9xBdU", "text": "electron", "image": null, "isCorrect": false}, {"id": "WrEHw", "text": "proton", "image": null, "isCorrect": true}, {"id": "LobR4", "text": "neutron", "image": null, "isCorrect": false}, {"id": "qndSd", "text": "hydroxyl group", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Bronsted-Lowry concept, after losing a proton, acids convert into conjugate base and after gaining a proton, bases convert into their conjugate acid, ie,\n$$\n\\begin{array}{l}\n\\text { Acid }-\\mathrm{H}^{+} \\longrightarrow \\text { conjugate base } \\\\\n\\text { Base }+\\mathrm{H}^{+} \\longrightarrow \\text { conjugate acid }\n\\end{array}\n$$\nThus, conjugate acid-base pair is differ by proton.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e540279619d9d8a138e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "Which one of the following species acts as both Bronsted acid and base?", "image": null}, "options": [{"id": "pOXdD", "text": "$\\mathrm{H}_{2} \\mathrm{PO}_{2}^{-}$", "image": null, "isCorrect": false}, {"id": "BPXDU", "text": "$\\mathrm{HPO}_{3}^{2-}$", "image": null, "isCorrect": false}, {"id": "Msgbi", "text": "$\\mathrm{HPO}_{4}^{2-}$", "image": null, "isCorrect": true}, {"id": "Ec4xs", "text": "All of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{HPO}_{4}^{2-}+\\mathrm{H}_{2} \\mathrm{O} \\rightleftharpoons \\mathrm{H}_{2} \\mathrm{PO}_{4}^{2-}+\\mathrm{OH}^{-}$\n$\\mathrm{HPO}_{4}^{2-}+\\mathrm{H}_{2} \\mathrm{O} \\rightleftharpoons \\mathrm{PO}_{4}^{3-}+\\mathrm{H}_{3} \\mathrm{O}^{+}$\n$\\mathrm{H}_{2} \\mathrm{PO}_{2}^{-}$ is a conjugate base of $\\mathrm{H}_{3} \\mathrm{PO}_{2}$ (a\nmonobasic acid) and does not give $\\mathrm{H}^{+}, \\mathrm{HPO}_{3}^{2-}$ is a conjugate base of $\\mathrm{H}_{2} \\mathrm{PO}_{3}^{-}$ and does not ionise further, since $\\mathrm{H}_{3} \\mathrm{PO}_{3}$ is a dibasic acid.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e420279619d9d8a12fb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "When ammonium chloride is added to ammonia solution, the $\\mathrm{pH}$ of the resulting solution will be", "image": null}, "options": [{"id": "GqIge", "text": "increased", "image": null, "isCorrect": false}, {"id": "E0Zeu", "text": "seven", "image": null, "isCorrect": false}, {"id": "4tqD2", "text": "decreased", "image": null, "isCorrect": true}, {"id": "dTV5C", "text": "unchanged", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Due to common ion effect, rate of ionization of $\\mathrm{NH}_{4}$ OH decreases, so lower [OH $]$ is obtained. Hence, $\\mathrm{pH}$ value decrease.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a2632e0279619d9d8a3cbc", "title": "Ionic Product of Water", "totalQuestions": 15, "questions": [{"_id": "6abb889115a9fc0fc8c144ea", "type": "singleCorrect", "question": {"text": "What is degree of ionization of water at $298$ K?", "image": null}, "options": [{"id": "zrrwH", "label": "A", "text": "$1.8 \\times 10^{-6}$", "isCorrect": false, "image": null}, {"id": "AVb6q", "label": "B", "text": "$1.8 \\times 10^{-7}$", "isCorrect": false, "image": null}, {"id": "mNuxx", "label": "C", "text": "$1.8 \\times 10^{-8}$", "isCorrect": false, "image": null}, {"id": "5IhQU", "label": "D", "text": "$1.8 \\times 10^{-9}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "At $298$ K, the ionic product of water is $K_w = 10^{-14}$.<br><br>In pure water, the concentration of hydrogen ions is $[H^+] = \\sqrt{K_w} = 10^{-7}$ M.<br><br>The molarity of pure water is $C = \\dfrac{1000}{18} = 55.55$ M.<br><br>The degree of ionization $\\alpha$ is given by the ratio of the concentration of ionized water to the total concentration of water.<br><br>$\\alpha = \\dfrac{[H^+]}{C} = \\dfrac{10^{-7}}{55.55} = 1.8 \\times 10^{-9}$<br><br>Answer: $1.8 \\times 10^{-9}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883115a9fc0fc8c14166", "type": "singleCorrect", "question": {"text": "What is the $\\text{P}^{OH}$ of solution having $[\\text{H}_3\\text{O}^+]\\,1\\times 10^{-4}$ at $298$ K?", "image": null}, "options": [{"id": "oav0L", "label": "A", "text": "$4$", "isCorrect": false, "image": null}, {"id": "UJWC2", "label": "B", "text": "$10$", "isCorrect": true, "image": null}, {"id": "wozUx", "label": "C", "text": "$1$", "isCorrect": false, "image": null}, {"id": "pgYv1", "label": "D", "text": "$12$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $[\\text{H}_3\\text{O}^+] = 1 \\times 10^{-4}$ M.<br><br>The pH of the solution is calculated as:<br><br>$\\text{pH} = -\\log[\\text{H}_3\\text{O}^+]$<br><br>$\\text{pH} = -\\log(1 \\times 10^{-4}) = 4$<br><br>At $298$ K, the ionic product of water gives the relationship:<br><br>$\\text{pH} + \\text{pOH} = 14$<br><br>Substituting the value of pH:<br><br>$4 + \\text{pOH} = 14$<br><br>$\\text{pOH} = 14 - 4 = 10$<br><br>Answer: $10$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29b8c30a4553e1bdae1", "type": "singleCorrect", "question": {"text": "What is the concentration of hydrogen ion in the solution when the concentration of hydroxyl ion is $0.08$ mol / dm$^3$ at $298$ K ?", "image": null}, "options": [{"id": "5pDzV", "label": "A", "text": "$0.125$ mol/L", "isCorrect": false, "image": null}, {"id": "RVrj0", "label": "B", "text": "$0.125 \\times 10^{-12}$ mol/L", "isCorrect": true, "image": null}, {"id": "KYI4z", "label": "C", "text": "$0.0125$ mol/L", "isCorrect": false, "image": null}, {"id": "lx1up", "label": "D", "text": "$0.125 \\times 10^{-10}$ mol/L", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "At $298$ K, the ionic product of water is $K_w = [H^+][OH^-] = 1.0 \\times 10^{-14}$.<br><br>Given $[OH^-] = 0.08$ mol/dm$^3$ = $0.08$ mol/L.<br><br>$[H^+] = \\dfrac{K_w}{[OH^-]} = \\dfrac{1.0 \\times 10^{-14}}{0.08}$<br><br>$[H^+] = \\dfrac{1}{8} \\times 10^{-12} = 0.125 \\times 10^{-12}$ mol/L.<br><br>Answer: $0.125 \\times 10^{-12}$ mol/L", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36e8c30a4553e1be3ab", "type": "singleCorrect", "question": {"text": "Which of the following sentences is true for a basic solution?", "image": null}, "options": [{"id": "Hysf1", "label": "A", "text": "For basic solution, $[\\text{H}_3\\text{O}^+] = [\\text{OH}^-]$", "isCorrect": false, "image": null}, {"id": "M0ON7", "label": "B", "text": "In basic solution, the excess of $\\text{OH}^-$ ions are present.", "isCorrect": true, "image": null}, {"id": "qCVfF", "label": "C", "text": "In the basic solution, there is excess of $\\text{H}_3\\text{O}^+$ ions.", "isCorrect": false, "image": null}, {"id": "MXpFX", "label": "D", "text": "The pOH of a basic solution can be calculated by pOH = $-\\log[\\text{H}^+]$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In a neutral solution, $[\\text{H}_3\\text{O}^+] = [\\text{OH}^-]$.<br><br>In an acidic solution, $[\\text{H}_3\\text{O}^+] > [\\text{OH}^-]$, meaning there is an excess of $\\text{H}_3\\text{O}^+$ ions.<br><br>In a basic solution, $[\\text{OH}^-] > [\\text{H}_3\\text{O}^+]$, meaning there is an excess of $\\text{OH}^-$ ions.<br><br>The pOH of any solution is defined as $\\text{pOH} = -\\log[\\text{OH}^-]$.<br><br>Thus, the only true statement is that in a basic solution, an excess of $\\text{OH}^-$ ions are present.<br><br>Answer: In basic solution, the excess of $\\text{OH}^-$ ions are present.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbebf9280d7f9932c09", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A monobasic weak acid dissociates $2 \\%$ in its 0.002 M solution.\nCalculate the dissociation constant of weak acid.", "image": null}, "options": [{"id": "tIvxR", "text": "$2 \\times 10^{-9}$", "image": null, "isCorrect": false}, {"id": "CubDw", "text": "$8 \\times 10^{-7}$", "image": null, "isCorrect": true}, {"id": "uqTyQ", "text": "$6 \\times 10^{-7}$", "image": null, "isCorrect": false}, {"id": "2OULU", "text": "$4 \\times 10^{-6}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $C = 0.002$ M and $\\alpha = 2\\% = 0.02$.<br><br>For a weak monobasic acid, the dissociation constant $K_a$ is given by Ostwald's dilution law:<br><br>$K_a = C \\alpha^2$<br><br>Substituting the given values:<br><br>$K_a = 0.002 \\times (0.02)^2$<br><br>$K_a = 2 \\times 10^{-3} \\times 4 \\times 10^{-4}$<br><br>$K_a = 8 \\times 10^{-7}$<br><br>Answer: $8 \\times 10^{-7}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871baabf9280d7f9932b64", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the value of dissociation constant of weak acid, which dissociates to $0.01 \\%$ in its 0.1 M solution?", "image": null}, "options": [{"id": "9shOr", "text": "$10^{-3}$", "image": null, "isCorrect": false}, {"id": "bUeZl", "text": "$10^{-4}$", "image": null, "isCorrect": false}, {"id": "JVhWA", "text": "$10^{-5}$", "image": null, "isCorrect": false}, {"id": "QNqHg", "text": "$10^{-9}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given concentration $C = 0.1$ M and percent dissociation $= 0.01 \\%$.<br><br>The degree of dissociation $\\alpha = \\dfrac{0.01}{100} = 10^{-4}$.<br><br>The dissociation constant $K_a$ for a weak acid is given by Ostwald's dilution law:<br><br>$K_a = \\dfrac{C \\alpha^2}{1 - \\alpha}$<br><br>Since $\\alpha \\ll 1$, $1 - \\alpha \\approx 1$.<br><br>$K_a = C \\alpha^2$<br><br>Substituting the given values:<br><br>$K_a = 0.1 \\times (10^{-4})^2$<br><br>$K_a = 10^{-1} \\times 10^{-8} = 10^{-9}$<br><br>Answer: $10^{-9}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b59bf9280d7f9932874", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A monobasic weak acid dissociates to $1.2 \\%$ in its 0.01 M solution at 298 K . Calculate dissociation constant of it.", "image": null}, "options": [{"id": "xFNx8", "text": "$1.04 \\times 10^{-8}$", "image": null, "isCorrect": false}, {"id": "CLZM6", "text": "$1.44 \\times 10^{-6}$", "image": null, "isCorrect": true}, {"id": "v5hNw", "text": "$1.30 \\times 10^{-6}$", "image": null, "isCorrect": false}, {"id": "uKDpv", "text": "$1.18 \\times 10^{-5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $C = 0.01 \\text{ M}$ and $\\alpha = 1.2\\% = 0.012$.<br><br>For a weak monobasic acid, the dissociation constant $K_a$ is given by Ostwald's dilution law:<br><br>$K_a = \\dfrac{C \\alpha^2}{1 - \\alpha}$<br><br>Since $\\alpha$ is very small, $1 - \\alpha \\approx 1$. Thus, the formula simplifies to:<br><br>$K_a = C \\alpha^2$<br><br>Substituting the given values:<br><br>$K_a = 0.01 \\times (0.012)^2$<br><br>$K_a = 10^{-2} \\times 1.44 \\times 10^{-4}$<br><br>$K_a = 1.44 \\times 10^{-6}$<br><br>Answer: $1.44 \\times 10^{-6}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fd0279619d9d8a30ea", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "What is the concentration of $\\mathrm{OH}^{-}$ion in a solution containing $0.05 \\mathrm{M} \\mathrm{H}^{+}$ions?", "image": null}, "options": [{"id": "BOmN5", "text": "$2.5 \\times 10^{-13} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "d3Gio", "text": "$5.0 \\times 10^{-2} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "g0jIP", "text": "$2.0 \\times 10^{-13} \\mathrm{M}$", "image": null, "isCorrect": true}, {"id": "LAqHM", "text": "$4.2 \\times 10^{-12} \\mathrm{M}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\mathrm{K}_{\\mathrm{w}}=\\left[\\mathrm{H}_3 \\mathrm{O}^{+}\\right]\\left[\\mathrm{OH}^{-}\\right] \\\\ \\therefore \\quad & 10^{-14}=0.05 \\times\\left[\\mathrm{OH}^{-}\\right] \\\\ & {\\left[\\mathrm{OH}^{-}\\right]=\\frac{10^{-14}}{0.05}} \\\\ & {\\left[\\mathrm{OH}^{-}\\right]=2.0 \\times 10^{-13} \\mathrm{M}}\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261430279619d9d8a2b22", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "A solution has $\\left[\\mathrm{H}^{+}\\right]=0.001 \\mathrm{M}$. What sis the value of $\\left[\\mathrm{OH}^{-}\\right]$", "image": null}, "options": [{"id": "MgPgN", "text": "$10^{-2} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "CY97f", "text": "$10^{-3} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "hlQGH", "text": "$1 \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "DJWI7", "text": "$10^{-11} \\mathrm{M}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\left[\\mathrm{OH}^{-}\\right]=\\frac{\\mathrm{k}_{\\mathrm{w}}}{\\left[\\mathrm{H}^{+}\\right]}=\\frac{10^{-14}}{10^{-3}}=10^{-11} \\mathrm{M}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260620279619d9d8a240b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "The $\\left[\\mathrm{OH}^{-}\\right]$in a solution is $1 \\times 10^{-12} \\mathrm{~mol} \\mathrm{dm}^{-3}$. What is the concentration of $\\mathrm{H}^{+}$ions?", "image": null}, "options": [{"id": "3dPN8", "text": "$0.1 \\mathrm{~mol} \\mathrm{dm}^{-1}$", "image": null, "isCorrect": false}, {"id": "3eZ43", "text": "$1.0 \\mathrm{~mol} \\mathrm{dm}^{-1}$", "image": null, "isCorrect": false}, {"id": "hsd6J", "text": "$2.0 \\mathrm{~mol} \\mathrm{dm}^{-1}$", "image": null, "isCorrect": false}, {"id": "Pfl0j", "text": "$0.01 \\mathrm{~mol} \\mathrm{dm}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In an aqueous solution\n$$\n\\begin{aligned}\n& {\\left[\\mathrm{H}^{+}\\right] \\times\\left[\\mathrm{OH}^{-}\\right]=10^{-14}} \\\\\n& {\\left[\\mathrm{H}^{+}\\right]=\\frac{10^{-14}}{\\left[\\mathrm{OH}^{-}\\right]}} \\\\\n& =\\frac{10^{-14}}{1 \\times 10^{-12}}=10^{-2} \\text { or } 0.01 \\mathrm{~mol} \\mathrm{dm}^{-3}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea10279619d9d8a1601", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The degree of ionization of $0.4 \\mathrm{M}$ acetic acid will be $\\left(K_{a}=1.8 \\times 10^{-5}\\right)$", "image": null}, "options": [{"id": "diu9m", "text": "$6.71 \\times 10^{-3}$", "image": null, "isCorrect": true}, {"id": "ynXU1", "text": "$1.6 \\times 10^{-3}$", "image": null, "isCorrect": false}, {"id": "YhArW", "text": "$0.4 \\times 1.8 \\times 10^{-5}$", "image": null, "isCorrect": false}, {"id": "ligHq", "text": "$1.8 \\times 10^{-5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a weak acid (acetic acid),\n$$\n\\begin{aligned}\nK_{a} &=C \\alpha^{2} \\\\\n1.8 \\times 10^{-5} &=0.4 \\times \\alpha^{2} \\\\\n\\alpha &=\\sqrt{\\frac{1.8 \\times 10^{-5}}{0.4}} \\\\\n&=6.71 \\times 10^{-3}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e6a0279619d9d8a143d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "In a solution, $0.02 \\mathrm{M}$ acetic acid is $4 \\%$ dissociated. The $\\left[\\mathrm{OH}^{-}\\right]$ in the solution is", "image": null}, "options": [{"id": "gDWjl", "text": "$8 \\times 10^{-4}$", "image": null, "isCorrect": false}, {"id": "T2bej", "text": "$2 \\times 10^{-14}$", "image": null, "isCorrect": false}, {"id": "Bq4Rg", "text": "$8 \\times 10^{10}$", "image": null, "isCorrect": false}, {"id": "le8pk", "text": "$1.25 \\times 10^{-11}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\left[\\mathrm{H}^{+}\\right]=\\sqrt{\\alpha^{2} C^{2}}=\\sqrt{(0.02)^{2} \\cdot(0.04)^{2}}=8 \\times 10^{-4}$\n$\\left[\\mathrm{H}^{+}\\right]\\left[\\mathrm{OH}^{-}\\right]=10^{-14}$\n$\\therefore\\left[\\mathrm{OH}^{-}\\right]=\\frac{10^{-14}}{8 \\times 10^{-4}}=1.25 \\times 10^{-11} \\mathrm{M}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e690279619d9d8a1437", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "The number of hydroxyl ions in $10 \\mathrm{~cm}^{3}$ of $0.2 \\mathrm{M}$ HCl solution is", "image": null}, "options": [{"id": "ukE19", "text": "$5 \\times 10^{-14}$", "image": null, "isCorrect": false}, {"id": "ethDP", "text": "$3 \\times 10^{9}$", "image": null, "isCorrect": false}, {"id": "EqmXb", "text": "$3 \\times 10^{12}$", "image": null, "isCorrect": true}, {"id": "QBN6c", "text": "$5 \\times 10^{-12}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\left[\\mathrm{H}^{+}\\right]=0.2 \\mathrm{M}$ (given, $\\mathrm{HCl}=0.2 \\mathrm{M}$ )\n$\\left[\\mathrm{H}^{+}\\right]\\left[\\mathrm{OH}^{-}\\right]=10^{-14}$\n$\\left[\\mathrm{OH}^{-}\\right]=\\frac{10^{-14}}{0.2}=5 \\times 10^{-14} \\mathrm{M}$\nConcentration of hydroxyl ions in $0.2 \\mathrm{M} \\mathrm{HCl}$\n$$\n=5 \\times 10^{-14} \\mathrm{M}\n$$\n$\\therefore$ The number of moles of hydroxyl ions\n$$\n=5 \\times 10^{-14} \\times 1000\n$$\nThe number of $\\mathrm{OH}^{-}$ in $10 \\mathrm{~cm}^{3}$\n$$\n\\begin{array}{l}\n=\\frac{5 \\times 10^{-14} \\times 1000 \\times 6.023 \\times 10^{23}}{10} \\\\\n=3 \\times 10^{12}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e660279619d9d8a141e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "$0.1 \\mathrm{M}$ solution of which of the following has almost unity degree of dissociation?", "image": null}, "options": [{"id": "wR9Ca", "text": "Ammonium chloride", "image": null, "isCorrect": false}, {"id": "GkcYI", "text": "Potassium chloride", "image": null, "isCorrect": true}, {"id": "jfh3J", "text": "Sodium acetate", "image": null, "isCorrect": false}, {"id": "qj8AE", "text": "All of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Among the given, only potassium chloride (KCl) is a strong electrolyte, so its degree of dissociation is almost unity.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e660279619d9d8a141c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "The degree of dissociation of a $0.01 \\mathrm{M}$ weak acid is $10^{-3}$. Its $\\mathrm{pOH}$ is", "image": null}, "options": [{"id": "TEzC1", "text": "$\\underline{5}$", "image": null, "isCorrect": false}, {"id": "Crwwb", "text": "3", "image": null, "isCorrect": false}, {"id": "96o8g", "text": "9", "image": null, "isCorrect": true}, {"id": "YCMAW", "text": "11", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\left[\\mathrm{H}^{+}\\right]=\\sqrt{K_{a} \\cdot C}=139$\nOr $=\\sqrt{\\alpha^{2} \\cdot C^{2}} \\quad\\left[\\therefore K_{a}=\\alpha^{2} C\\right]$\n$$\n\\begin{aligned}\n=& \\sqrt{\\left(10^{-3}\\right)^{2} \\cdot(0.01)^{2}} \\\\\n=& 10^{-5} \\\\\n\\mathrm{pH}=-\\log \\left[\\mathrm{H}^{+}\\right] &=-\\log 10^{-5} \\\\\n&=5\n\\end{aligned}\n$$\n$\\mathrm{pOH}=14-5=9$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a2632e0279619d9d8a3cb8", "title": "PH of solutions", "totalQuestions": 78, "questions": [{"_id": "6abb88d215a9fc0fc8c14743", "type": "singleCorrect", "question": {"text": "What is the pH of $0.01$ M acetic acid that is $1\\%$ ionized?", "image": null}, "options": [{"id": "9A3KP", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "52f3j", "label": "B", "text": "$3$", "isCorrect": false, "image": null}, {"id": "B9a7w", "label": "C", "text": "$2$", "isCorrect": false, "image": null}, {"id": "rx7l4", "label": "D", "text": "$4$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given concentration of acetic acid, $C = 0.01$ M<br><br>Degree of ionization, $\\alpha = 1\\% = 0.01$<br><br>The concentration of hydrogen ions is given by $[H^{+}] = C\\alpha$<br><br>$[H^{+}] = 0.01 \\times 0.01 = 10^{-4}$ M<br><br>$\\text{pH} = -\\log[H^{+}]$<br><br>$\\text{pH} = -\\log(10^{-4}) = 4$<br><br>Answer: $4$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88d115a9fc0fc8c14742", "type": "singleCorrect", "question": {"text": "Determine the $[\\text{OH}^-]$ of a solution of weak base BOH having its pH $9.75$ at $298$ K.", "image": null}, "options": [{"id": "WJ7zn", "label": "A", "text": "$6.512 \\times 10^{-5}$ M", "isCorrect": false, "image": null}, {"id": "dHZlm", "label": "B", "text": "$5.623 \\times 10^{-5}$ M", "isCorrect": true, "image": null}, {"id": "Zxm3x", "label": "C", "text": "$4.647 \\times 10^{-5}$ M", "isCorrect": false, "image": null}, {"id": "aHd9R", "label": "D", "text": "$3.540 \\times 10^{-5}$ M", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "At $298$ K, the relationship between pH and pOH is given by:<br><br>$\\text{pH} + \\text{pOH} = 14$<br><br>Given $\\text{pH} = 9.75$, substituting this value yields:<br><br>$\\text{pOH} = 14 - 9.75 = 4.25$<br><br>The concentration of hydroxide ions is calculated as:<br><br>$[\\text{OH}^-] = 10^{-\\text{pOH}} = 10^{-4.25}$<br><br>This can be rewritten as:<br><br>$[\\text{OH}^-] = 10^{0.75} \\times 10^{-5}$<br><br>Evaluating $10^{0.75}$:<br><br>$10^{0.75} = 10^{3/4} = (1000)^{1/4} \\approx 5.623$<br><br>Therefore, the concentration is:<br><br>$[\\text{OH}^-] = 5.623 \\times 10^{-5}$ M<br><br>Answer: $5.623 \\times 10^{-5}$ M", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a115a9fc0fc8c14581", "type": "singleCorrect", "question": {"text": "What is the pH of a mixture of $40$ ml of $0.1$ M $\\text{Ba(HCOO)}_2$ and $20$ ml of $0.1$ M $\\text{HCOOH}$ solution?<br>($pK_a$ for formic acid $= 5$)", "image": null}, "options": [{"id": "9vG6n", "label": "A", "text": "$2.8$", "isCorrect": false, "image": null}, {"id": "9dkua", "label": "B", "text": "$5.6$", "isCorrect": true, "image": null}, {"id": "CnrnY", "label": "C", "text": "$8.4$", "isCorrect": false, "image": null}, {"id": "SOFKn", "label": "D", "text": "$11.2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Millimoles of $\\text{Ba(HCOO)}_2 = 40 \\times 0.1 = 4$ mmol<br><br>Since each mole of $\\text{Ba(HCOO)}_2$ provides two moles of formate ions, millimoles of $\\text{HCOO}^- = 2 \\times 4 = 8$ mmol<br><br>Millimoles of $\\text{HCOOH} = 20 \\times 0.1 = 2$ mmol<br><br>The mixture of a weak acid ($\\text{HCOOH}$) and its conjugate base ($\\text{HCOO}^-$) forms an acidic buffer. The pH of the buffer is given by the Henderson-Hasselbalch equation:<br><br>$\\text{pH} = pK_a + \\log \\left( \\dfrac{[\\text{Conjugate Base}]}{[\\text{Acid}]} \\right)$<br><br>$\\text{pH} = 5 + \\log \\left( \\dfrac{8}{2} \\right)$<br><br>$\\text{pH} = 5 + \\log 4$<br><br>$\\text{pH} = 5 + 2 \\log 2 = 5 + 2(0.3) = 5.6$<br><br>Answer: $5.6$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a115a9fc0fc8c1457f", "type": "singleCorrect", "question": {"text": "Which of the following aqueous solutions turns blue litmus red?", "image": null}, "options": [{"id": "Fcxtt", "label": "A", "text": "Aqueous $\\text{NaCl}$", "isCorrect": false, "image": null}, {"id": "QzpPs", "label": "B", "text": "Aqueous $\\text{KCl}$", "isCorrect": false, "image": null}, {"id": "rW81a", "label": "C", "text": "Aqueous solution of $\\text{CO}_2$", "isCorrect": true, "image": null}, {"id": "BD600", "label": "D", "text": "Aqueous $\\text{NaOH}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Blue litmus turns red in an acidic solution.<br><br>Aqueous $\\text{NaCl}$ and aqueous $\\text{KCl}$ are salts of strong acids and strong bases, so their solutions are neutral.<br><br>Aqueous $\\text{NaOH}$ is a strong base, so its solution is basic and turns red litmus blue.<br><br>Aqueous solution of $\\text{CO}_2$ forms carbonic acid ($\\text{H}_2\\text{CO}_3$), which is acidic in nature. Therefore, it turns blue litmus red.<br><br>Answer: Aqueous solution of $\\text{CO}_2$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884115a9fc0fc8c141fc", "type": "singleCorrect", "question": {"text": "Phosphoric acid dissociates upto 80% in its $0.02 \\text{ M}$ solution at $25^\\circ$C. Calculate the pH of the solution.", "image": null}, "options": [{"id": "mCkj3", "label": "A", "text": "$1.319$", "isCorrect": true, "image": null}, {"id": "HROBt", "label": "B", "text": "$1.651$", "isCorrect": false, "image": null}, {"id": "4LtXT", "label": "C", "text": "$1.101$", "isCorrect": false, "image": null}, {"id": "lUO7S", "label": "D", "text": "$1.921$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Concentration of phosphoric acid, $C = 0.02 \\text{ M}$<br><br>Basicity of phosphoric acid ($H_3PO_4$), $n = 3$<br><br>Degree of dissociation, $\\alpha = 80\\% = 0.8$<br><br>Assuming all three protons dissociate to the given extent, the concentration of hydrogen ions is:<br><br>$[H^+] = n \\times C \\times \\alpha$<br><br>$[H^+] = 3 \\times 0.02 \\times 0.8 = 0.048 \\text{ M}$<br><br>The pH of the solution is calculated as:<br><br>$pH = -\\log[H^+]$<br><br>$pH = -\\log(0.048)$<br><br>$pH = -\\log(48 \\times 10^{-3})$<br><br>$pH = 3 - \\log(48)$<br><br>$pH = 3 - (\\log 16 + \\log 3)$<br><br>$pH = 3 - (4 \\log 2 + \\log 3)$<br><br>$pH = 3 - (4 \\times 0.301 + 0.477)$<br><br>$pH = 3 - 1.681 = 1.319$<br><br>Answer: $1.319$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b115a9fc0fc8c14617", "type": "singleCorrect", "question": {"text": "Calculate the $[\\text{CH}_3\\text{COO}^-]$ in $0.1$M solution of acetic acid if $K_a$ for acetic acid is $1.8 \\times 10^{-5}$.", "image": null}, "options": [{"id": "xo7Om", "label": "A", "text": "$1.34 \\times 10^{-3}\\ \\text{M}$", "isCorrect": true, "image": null}, {"id": "t3ayU", "label": "B", "text": "$1.68 \\times 10^{-3}\\ \\text{M}$", "isCorrect": false, "image": null}, {"id": "0WsaO", "label": "C", "text": "$2.12 \\times 10^{-3}\\ \\text{M}$", "isCorrect": false, "image": null}, {"id": "Hf72k", "label": "D", "text": "$2.34 \\times 10^{-3}\\ \\text{M}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The dissociation of acetic acid is given by:<br><br>$\\text{CH}_3\\text{COOH} \\rightleftharpoons \\text{CH}_3\\text{COO}^- + \\text{H}^+$<br><br>Initial concentration $C = 0.1\\ \\text{M}$.<br><br>Let the degree of dissociation be $\\alpha$.<br><br>$K_a = \\dfrac{[\\text{CH}_3\\text{COO}^-][\\text{H}^+]}{[\\text{CH}_3\\text{COOH}]} = \\dfrac{C\\alpha \\cdot C\\alpha}{C(1-\\alpha)} \\approx C\\alpha^2$<br><br>Since $K_a$ is very small, $1 - \\alpha \\approx 1$.<br><br>$[\\text{CH}_3\\text{COO}^-] = C\\alpha = \\sqrt{K_a C}$<br><br>Substituting the given values:<br><br>$[\\text{CH}_3\\text{COO}^-] = \\sqrt{1.8 \\times 10^{-5} \\times 0.1} = \\sqrt{1.8 \\times 10^{-6}}$<br><br>$[\\text{CH}_3\\text{COO}^-] = 1.34 \\times 10^{-3}\\ \\text{M}$<br><br>Answer: $1.34 \\times 10^{-3}\\ \\text{M}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b015a9fc0fc8c14615", "type": "singleCorrect", "question": {"text": "If the dissociation constant of $\\text{NH}_4\\text{OH}$ is $1.8 \\times 10^{-5}$, calculate its degree of dissociation in $0.01$ M.", "image": null}, "options": [{"id": "IzjsR", "label": "A", "text": "$0.01215$", "isCorrect": false, "image": null}, {"id": "unI6z", "label": "B", "text": "$0.0357$", "isCorrect": false, "image": null}, {"id": "C16oq", "label": "C", "text": "$0.06132$", "isCorrect": false, "image": null}, {"id": "SXQ8x", "label": "D", "text": "$0.04242$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For a weak base, the dissociation constant $K_b$ is given by Ostwald's dilution law:<br><br>$K_b = \\dfrac{C \\alpha^2}{1 - \\alpha}$<br><br>Since $K_b$ is very small, we can assume $1 - \\alpha \\approx 1$. The expression simplifies to:<br><br>$K_b = C \\alpha^2$<br><br>Rearranging for the degree of dissociation $\\alpha$:<br><br>$\\alpha = \\sqrt{\\dfrac{K_b}{C}}$<br><br>Substituting the given values $K_b = 1.8 \\times 10^{-5}$ and $C = 0.01$ M:<br><br>$\\alpha = \\sqrt{\\dfrac{1.8 \\times 10^{-5}}{0.01}}$<br><br>$\\alpha = \\sqrt{1.8 \\times 10^{-3}}$<br><br>$\\alpha = \\sqrt{18 \\times 10^{-4}}$<br><br>$\\alpha = 4.242 \\times 10^{-2}$<br><br>$\\alpha = 0.04242$<br><br>Answer: $0.04242$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888115a9fc0fc8c14455", "type": "singleCorrect", "question": {"text": "What is the pOH of $0.002$ M strong monoprotic acid?", "image": null}, "options": [{"id": "oxn1D", "label": "A", "text": "$3 - \\log 2$", "isCorrect": false, "image": null}, {"id": "svsK8", "label": "B", "text": "$14 - \\log 2$", "isCorrect": false, "image": null}, {"id": "zia5O", "label": "C", "text": "$11 + \\log 2$", "isCorrect": true, "image": null}, {"id": "1ZRKd", "label": "D", "text": "$11 - \\log 2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a strong monoprotic acid, the concentration of hydrogen ions is equal to the concentration of the acid.<br><br>$[H^+] = 0.002 \\text{ M} = 2 \\times 10^{-3} \\text{ M}$<br><br>$\\text{pH} = -\\log[H^+] = -\\log(2 \\times 10^{-3}) = 3 - \\log 2$<br><br>Using the relation $\\text{pH} + \\text{pOH} = 14$:<br><br>$\\text{pOH} = 14 - (3 - \\log 2) = 11 + \\log 2$<br><br>Answer: $11 + \\log 2$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888115a9fc0fc8c14453", "type": "singleCorrect", "question": {"text": "Which of the following has the highest pH?", "image": null}, "options": [{"id": "JUmQa", "label": "A", "text": "Distilled water", "isCorrect": false, "image": null}, {"id": "Fmb6Y", "label": "B", "text": "$1\\text{M}\\,\\text{NH}_3$", "isCorrect": false, "image": null}, {"id": "KVviq", "label": "C", "text": "$1\\text{M}\\,\\text{NaOH}$", "isCorrect": true, "image": null}, {"id": "8EJbE", "label": "D", "text": "$1\\text{M}\\,\\text{CH}_3\\text{COOH}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Distilled water is neutral with a pH of $7$.<br><br>$1\\text{M}\\,\\text{NH}_3$ is a weak base and partially dissociates in water, giving a pH between $7$ and $14$.<br><br>$1\\text{M}\\,\\text{NaOH}$ is a strong base and completely dissociates in water, giving $[\\text{OH}^{-}] = 1\\text{M}$. The pOH is $-\\log(1) = 0$, so the pH is $14$.<br><br>$1\\text{M}\\,\\text{CH}_3\\text{COOH}$ is a weak acid and has a pH less than $7$.<br><br>Therefore, $1\\text{M}\\,\\text{NaOH}$ has the highest pH.<br><br>Answer: $1\\text{M}\\,\\text{NaOH}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883115a9fc0fc8c14167", "type": "singleCorrect", "question": {"text": "Calculate the pH of $10^{-8}$ M HCl solution at $25\\,^\\circ$C.", "image": null}, "options": [{"id": "sju7l", "label": "A", "text": "$8.0$", "isCorrect": false, "image": null}, {"id": "RgtCJ", "label": "B", "text": "$7.0$", "isCorrect": false, "image": null}, {"id": "QD0tM", "label": "C", "text": "$6.9586$", "isCorrect": true, "image": null}, {"id": "aSaoc", "label": "D", "text": "$7.0414$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a very dilute solution of a strong acid like $10^{-8}$ M HCl, the $H^+$ ions from the autoionization of water cannot be neglected.<br><br>Taking the approximate contribution of $H^+$ from water as $10^{-7}$ M:<br><br>$[H^+]_{\\text{total}} = [H^+]_{\\text{HCl}} + [H^+]_{\\text{water}}$<br><br>$[H^+]_{\\text{total}} = 10^{-8} + 10^{-7} = 1.1 \\times 10^{-7}$ M<br><br>$\\text{pH} = -\\log(1.1 \\times 10^{-7})$<br><br>$\\text{pH} = 7 - \\log(1.1)$<br><br>$\\text{pH} = 7 - 0.0414 = 6.9586$<br><br>Answer: $6.9586$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a98c30a4553e1bdb79", "type": "singleCorrect", "question": {"text": "There are two different solutions, A and B. The pH of solution A is 4. Find the pH of solution B having $[\\text{H}^+]$ three times that of solution A.", "image": null}, "options": [{"id": "9eeOu", "label": "A", "text": "$3.5229$", "isCorrect": true, "image": null}, {"id": "BFaKe", "label": "B", "text": "$4.229$", "isCorrect": false, "image": null}, {"id": "21X9G", "label": "C", "text": "$3.229$", "isCorrect": false, "image": null}, {"id": "ML5X2", "label": "D", "text": "$3.5223$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The pH of solution A is given as $4$.<br><br>$[\\text{H}^+]_A = 10^{-4} \\text{ M}$<br><br>For solution B, the hydrogen ion concentration is three times that of solution A.<br><br>$[\\text{H}^+]_B = 3 \\times [\\text{H}^+]_A = 3 \\times 10^{-4} \\text{ M}$<br><br>$\\text{pH of solution B} = -\\log[\\text{H}^+]_B$<br><br>$\\text{pH} = -\\log(3 \\times 10^{-4})$<br><br>$\\text{pH} = 4 - \\log 3$<br><br>Using $\\log 3 = 0.4771$:<br><br>$\\text{pH} = 4 - 0.4771 = 3.5229$<br><br>Answer: $3.5229$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a98c30a4553e1bdb77", "type": "singleCorrect", "question": {"text": "What is the pH of 1 molar HCl solution? (assume complete dissociation)", "image": null}, "options": [{"id": "h3Yqa", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "kHZbM", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "eQ6Qt", "label": "C", "text": "Zero", "isCorrect": true, "image": null}, {"id": "QCHiY", "label": "D", "text": "$7$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "HCl is a strong acid and dissociates completely in water.<br><br>$HCl \\rightarrow H^+ + Cl^-$<br><br>For a $1\\text{ M}$ solution of HCl, the concentration of hydrogen ions is:<br><br>$[H^+] = 1\\text{ M}$<br><br>$\\text{pH} = -\\log_{10}[H^+]$<br><br>$\\text{pH} = -\\log_{10}(1) = 0$<br><br>Answer: Zero", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3558c30a4553e1be29e", "type": "singleCorrect", "question": {"text": "What is the normal pH range of human blood?", "image": null}, "options": [{"id": "4S1HB", "label": "A", "text": "$6.0$ to $6.4$", "isCorrect": false, "image": null}, {"id": "86eL5", "label": "B", "text": "$7.36$ to $7.42$", "isCorrect": true, "image": null}, {"id": "XPUAG", "label": "C", "text": "$6.4$ to $6.95$", "isCorrect": false, "image": null}, {"id": "vXyro", "label": "D", "text": "$7.8$ to $8.0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The normal pH of human blood is slightly basic, typically maintained in a narrow range between $7.35$ and $7.45$.<br><br>Among the given options, the range $7.36$ to $7.42$ correctly represents this physiological pH range.<br><br>This pH is tightly regulated by various buffer systems in the body, primarily the bicarbonate buffer system.<br><br>Answer: $7.36$ to $7.42$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3528c30a4553e1be27f", "type": "singleCorrect", "question": {"text": "Calculate the pOH of $0.01$ M monobasic acid that is completely dissociated, at $298$ K.", "image": null}, "options": [{"id": "3xgqz", "label": "A", "text": "$02$", "isCorrect": false, "image": null}, {"id": "jeVe2", "label": "B", "text": "$12$", "isCorrect": true, "image": null}, {"id": "sQi5u", "label": "C", "text": "$03$", "isCorrect": false, "image": null}, {"id": "jHm08", "label": "D", "text": "$11$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a completely dissociated monobasic acid, the concentration of hydrogen ions is equal to the concentration of the acid.<br><br>$[H^+] = 0.01$ M $= 10^{-2}$ M<br><br>The pH of the solution is calculated as:<br><br>$\\text{pH} = -\\log[H^+] = -\\log(10^{-2}) = 2$<br><br>At $298$ K, the relationship between pH and pOH is:<br><br>$\\text{pH} + \\text{pOH} = 14$<br><br>Substituting the value of pH:<br><br>$\\text{pOH} = 14 - 2 = 12$<br><br>Answer: $12$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3528c30a4553e1be27d", "type": "singleCorrect", "question": {"text": "A weak monobasic acid is $4\\%$ dissociated in $0.05$ M solution. What is percent dissociation in $0.1$ M solution ?", "image": null}, "options": [{"id": "0rOT7", "label": "A", "text": "$5.715\\%$", "isCorrect": false, "image": null}, {"id": "P50N3", "label": "B", "text": "$8.516\\%$", "isCorrect": false, "image": null}, {"id": "WKewS", "label": "C", "text": "$2.828\\%$", "isCorrect": true, "image": null}, {"id": "7Nyta", "label": "D", "text": "$4.620\\%$", "isCorrect": false, "imag
