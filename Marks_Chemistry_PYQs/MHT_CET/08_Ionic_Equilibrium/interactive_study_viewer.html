 "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The solubility product of salt $\\mathrm{B}_2 \\mathrm{~A}$ is $3.2 \\times 10^{-11}$ at 298 K . What is solubility of the salt at same temperature ?", "image": null}, "options": [{"id": "VcSy4", "text": "$5.52 \\times 10^{-5} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "vmag4", "text": "$4.92 \\times 10^{-4} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "apsVZ", "text": "$2.00 \\times 10^{-4} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": true}, {"id": "hRIQF", "text": "$3.52 \\times 10^{-5} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of the salt $\\mathrm{B}_2\\mathrm{A}$ is given by:<br><br>$\\mathrm{B}_2\\mathrm{A} \\rightleftharpoons 2\\mathrm{B}^+ + \\mathrm{A}^{2-}$<br><br>Let the solubility of the salt be $S$. Then, $[\\mathrm{B}^+] = 2S$ and $[\\mathrm{A}^{2-}] = S$.<br><br>The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [\\mathrm{B}^+]^2 [\\mathrm{A}^{2-}] = (2S)^2 (S) = 4S^3$<br><br>Given $K_{sp} = 3.2 \\times 10^{-11}$, substituting this value:<br><br>$4S^3 = 3.2 \\times 10^{-11}$<br><br>$S^3 = \\dfrac{3.2 \\times 10^{-11}}{4} = 0.8 \\times 10^{-11} = 8 \\times 10^{-12}$<br><br>Taking the cube root on both sides:<br><br>$S = (8 \\times 10^{-12})^{1/3} = 2.00 \\times 10^{-4} \\mathrm{~mol~dm}^{-3}$<br><br>Answer: $2.00 \\times 10^{-4} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcbbf9280d7f9932c78", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The solubility product of AgBr is $4.9 \\times 10^{-13}$ at a certain temperature. Calculate the solubility .", "image": null}, "options": [{"id": "qYv5I", "text": "$4 \\times 10^{-6} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "NwgRX", "text": "$4 \\times 10^{-7} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "i3Jto", "text": "$7 \\times 10^{-7} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": true}, {"id": "Y53kw", "text": "$3 \\times 10^{-8} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of silver bromide is given by:<br><br>$\\text{AgBr} \\rightleftharpoons \\text{Ag}^+ + \\text{Br}^-$<br><br>Let the solubility of $\\text{AgBr}$ be $S$.<br><br>$K_{sp} = [\\text{Ag}^+][\\text{Br}^-] = S \\times S = S^2$<br><br>Given $K_{sp} = 4.9 \\times 10^{-13}$<br><br>$S^2 = 4.9 \\times 10^{-13} = 49 \\times 10^{-14}$<br><br>$S = \\sqrt{49 \\times 10^{-14}} = 7 \\times 10^{-7} \\text{ mol dm}^{-3}$<br><br>Answer: $7 \\times 10^{-7} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba9bf9280d7f9932b5c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The solubility product of the sparingly soluble salt $A B_2$ is $2.56 \\times 10^{-10}$ at 298 K. Calculate its solubility in $\\mathrm{mol~} \\mathrm{dm}^{-3}$ at the same temperature ?", "image": null}, "options": [{"id": "1h7xO", "text": "$1 \\times 10^{-4}$", "image": null, "isCorrect": false}, {"id": "oSbbb", "text": "$2 \\times 10^{-2}$", "image": null, "isCorrect": false}, {"id": "sir7B", "text": "$4 \\times 10^{-4}$", "image": null, "isCorrect": true}, {"id": "DdiFm", "text": "$3 \\times 10^{-2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of the sparingly soluble salt $AB_2$ is given by:<br><br>$AB_2 \\rightleftharpoons A^{2+} + 2B^{-}$<br><br>Let the solubility of the salt be $S$ mol dm$^{-3}$.<br><br>The concentrations of the ions at equilibrium are:<br>$[A^{2+}] = S$<br>$[B^{-}] = 2S$<br><br>The solubility product $K_{sp}$ is:<br>$K_{sp} = [A^{2+}][B^{-}]^2$<br>$K_{sp} = (S)(2S)^2 = 4S^3$<br><br>Given $K_{sp} = 2.56 \\times 10^{-10}$, substituting this value:<br>$4S^3 = 2.56 \\times 10^{-10}$<br>$S^3 = \\dfrac{2.56 \\times 10^{-10}}{4}$<br>$S^3 = 0.64 \\times 10^{-10} = 64 \\times 10^{-12}$<br><br>Taking the cube root on both sides:<br>$S = (64 \\times 10^{-12})^{1/3}$<br>$S = 4 \\times 10^{-4}$ mol dm$^{-3}$<br><br>Answer: $4 \\times 10^{-4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9dbf9280d7f9932ae5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the equilibrium concentration of $\\mathrm{Pb}^{++}$ions in a solution of PbS containing $1 \\times 10^{-11} \\mathrm{~mol~} \\mathrm{dm}{ }^{-3}$ of sulphide ions.\n(Given $\\mathrm{K}_{\\mathrm{sp}}$ for $\\mathrm{PbS}=8.0 \\times 10^{-28}$ )", "image": null}, "options": [{"id": "zUmVu", "text": "$4 \\times 10^{-14}$", "image": null, "isCorrect": false}, {"id": "sYBOu", "text": "$4 \\times 10^{-17}$", "image": null, "isCorrect": false}, {"id": "KJbFj", "text": "$8 \\times 10^{-17}$", "image": null, "isCorrect": true}, {"id": "hGCEq", "text": "$8 \\times 10^{-11}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The solubility product of $\\mathrm{PbS}$ is given by the expression:<br><br>$\\mathrm{K}_{\\mathrm{sp}} = [\\mathrm{Pb}^{++}][\\mathrm{S}^{--}]$<br><br>Substituting the given values:<br><br>$8.0 \\times 10^{-28} = [\\mathrm{Pb}^{++}] \\times (1 \\times 10^{-11})$<br><br>$[\\mathrm{Pb}^{++}] = \\dfrac{8.0 \\times 10^{-28}}{1 \\times 10^{-11}}$<br><br>$[\\mathrm{Pb}^{++}] = 8.0 \\times 10^{-17} \\mathrm{~mol~} \\mathrm{dm}^{-3}$<br><br>Answer: $8 \\times 10^{-17}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8abf9280d7f9932a34", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Solubility of binary sparingly soluble salt is $1.12 \\times 10^{-4} \\mathrm{~g} / \\mathrm{dm}^3$.\nCalculate its solubility product (molar mass of salt $=112 \\mathrm{~g} \\mathrm{~mol}^{-1}$ )", "image": null}, "options": [{"id": "fRc2U", "text": "$1 \\times 10^{-3}$", "image": null, "isCorrect": false}, {"id": "WAyj6", "text": "$1 \\times 10^{-6}$", "image": null, "isCorrect": false}, {"id": "QR0pd", "text": "$1 \\times 10^{-9}$", "image": null, "isCorrect": false}, {"id": "ovD41", "text": "$1 \\times 10^{-12}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Molar solubility $S$ is calculated by dividing the solubility in $\\mathrm{g/dm^3}$ by the molar mass of the salt.<br><br>$S = \\dfrac{1.12 \\times 10^{-4}}{112} = 1 \\times 10^{-6} \\mathrm{~mol/dm^3}$<br><br>For a binary sparingly soluble salt (which dissociates into two ions, i.e., a 1:1 type salt), the solubility product $K_{sp}$ is given by:<br><br>$K_{sp} = S^2$<br><br>$K_{sp} = (1 \\times 10^{-6})^2 = 1 \\times 10^{-12}$<br><br>Answer: $1 \\times 10^{-12}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7bbf9280d7f99329a8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The solubility product of NiS is $4.9 \\times 10^{-5}$ at 298 K. Calculate its solubility in $\\mathrm{mol~} \\mathrm{dm}^{-3}$ at the same temperature?", "image": null}, "options": [{"id": "wlXd2", "text": "$1.69 \\times 10^{-3}$", "image": null, "isCorrect": false}, {"id": "88WWI", "text": "$7.0 \\times 10^{-3}$", "image": null, "isCorrect": true}, {"id": "4tJhv", "text": "$2.45 \\times 10^{-3}$", "image": null, "isCorrect": false}, {"id": "bodLd", "text": "$6.18 \\times 10^{-3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of NiS is given by:<br><br>$\\mathrm{NiS} \\rightleftharpoons \\mathrm{Ni}^{2+} + \\mathrm{S}^{2-}$<br><br>Let the solubility of NiS be $S$. Then, $[\\mathrm{Ni}^{2+}] = S$ and $[\\mathrm{S}^{2-}] = S$.<br><br>The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [\\mathrm{Ni}^{2+}][\\mathrm{S}^{2-}] = S \\times S = S^2$<br><br>Given $K_{sp} = 4.9 \\times 10^{-5}$, we have:<br><br>$S^2 = 4.9 \\times 10^{-5} = 49 \\times 10^{-6}$<br><br>$S = \\sqrt{49 \\times 10^{-6}} = 7.0 \\times 10^{-3} \\mathrm{~mol~dm}^{-3}$<br><br>Answer: $7.0 \\times 10^{-3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6abf9280d7f99328fd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The solubility of sparingly soluble salt $\\mathrm{AX}_2$ is $1 \\times 10^{-4} \\mathrm{~mol~} \\mathrm{dm}^{-3}$ at 298 K . Calculate its solubility product?", "image": null}, "options": [{"id": "3zc6L", "text": "$2 \\times 10^{-12}$", "image": null, "isCorrect": false}, {"id": "8ktAN", "text": "$4 \\times 10^{-12}$", "image": null, "isCorrect": true}, {"id": "Vjefq", "text": "$2 \\times 10^{-10}$", "image": null, "isCorrect": false}, {"id": "22cmN", "text": "$4 \\times 10^{-10}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of the sparingly soluble salt $\\mathrm{AX}_2$ is given by:<br><br>$\\mathrm{AX}_2 \\rightleftharpoons \\mathrm{A}^{2+} + 2\\mathrm{X}^{-}$<br><br>Let the solubility of the salt be $S$. Then the equilibrium concentrations are:<br><br>$[\\mathrm{A}^{2+}] = S$<br><br>$[\\mathrm{X}^{-}] = 2S$<br><br>The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [\\mathrm{A}^{2+}][\\mathrm{X}^{-}]^2$<br><br>$K_{sp} = (S)(2S)^2 = 4S^3$<br><br>Given $S = 1 \\times 10^{-4} \\mathrm{~mol~} \\mathrm{dm}^{-3}$, substituting this value:<br><br>$K_{sp} = 4 \\times (1 \\times 10^{-4})^3$<br><br>$K_{sp} = 4 \\times 10^{-12}$<br><br>Answer: $4 \\times 10^{-12}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b59bf9280d7f9932875", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The solubility of calcium carbonate at 298 K is $6.4 \\times 10^{-5} \\mathrm{~mol~} \\mathrm{dm}^{-3}$.\nCalculate the value of solubility product at the same temperature?", "image": null}, "options": [{"id": "5zSS1", "text": "$5.06 \\times 10^{-10}$", "image": null, "isCorrect": false}, {"id": "MaCKt", "text": "$4.096 \\times 10^{-9}$", "image": null, "isCorrect": true}, {"id": "1OBBZ", "text": "$3.05 \\times 10^{-10}$", "image": null, "isCorrect": false}, {"id": "e84Gy", "text": "$2.8 \\times 10^{-9}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of calcium carbonate is given by:<br><br>$CaCO_3(s) \\rightleftharpoons Ca^{2+}(aq) + CO_3^{2-}(aq)$<br><br>Let the solubility of $CaCO_3$ be $S$.<br><br>$[Ca^{2+}] = S$<br><br>$[CO_3^{2-}] = S$<br><br>The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [Ca^{2+}][CO_3^{2-}] = S^2$<br><br>Given $S = 6.4 \\times 10^{-5} \\text{ mol dm}^{-3}$<br><br>$K_{sp} = (6.4 \\times 10^{-5})^2$<br><br>$K_{sp} = 40.96 \\times 10^{-10} = 4.096 \\times 10^{-9}$<br><br>Answer: $4.096 \\times 10^{-9}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b48bf9280d7f99327d6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The solubility product of $\\mathrm{PbI}_2$ is $1.08 \\times 10^{-7}$. Calculate its solubility in $\\mathrm{mol~} \\mathrm{dm}^{-3}$ at 298 K ?", "image": null}, "options": [{"id": "Pav1P", "text": "$2.018 \\times 10^{-3}$", "image": null, "isCorrect": false}, {"id": "G70dx", "text": "$2.011 \\times 10^{-9}$", "image": null, "isCorrect": false}, {"id": "TJUuA", "text": "$1.259 \\times 10^{-9}$", "image": null, "isCorrect": false}, {"id": "0YcLF", "text": "$3.0 \\times 10^{-3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The dissociation reaction of $\\mathrm{PbI}_2$ is:<br><br>$\\mathrm{PbI}_2(s) \\rightleftharpoons \\mathrm{Pb}^{2+}(aq) + 2\\mathrm{I}^-(aq)$<br><br>Let the solubility of $\\mathrm{PbI}_2$ be $S \\mathrm{~mol~dm}^{-3}$.<br><br>$[\\mathrm{Pb}^{2+}] = S$<br><br>$[\\mathrm{I}^-] = 2S$<br><br>The solubility product $K_{sp}$ is given by:<br><br>$K_{sp} = [\\mathrm{Pb}^{2+}][\\mathrm{I}^-]^2$<br><br>$K_{sp} = (S)(2S)^2 = 4S^3$<br><br>Given $K_{sp} = 1.08 \\times 10^{-7}$, substituting this value:<br><br>$4S^3 = 1.08 \\times 10^{-7}$<br><br>$S^3 = \\dfrac{1.08 \\times 10^{-7}}{4} = 0.27 \\times 10^{-7} = 27 \\times 10^{-9}$<br><br>Taking the cube root on both sides:<br><br>$S = (27 \\times 10^{-9})^{1/3} = 3.0 \\times 10^{-3} \\mathrm{~mol~dm}^{-3}$<br><br>Answer: $3.0 \\times 10^{-3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3abf9280d7f9932748", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The solubility of salt $\\mathrm{BA}_2$ is $4 \\times 10^{-4} \\mathrm{~mol~} \\mathrm{dm}^{-3}$. What is solubility product of the salt?", "image": null}, "options": [{"id": "CdrBq", "text": "$1.55 \\times 10^{-8}$", "image": null, "isCorrect": false}, {"id": "KUWZm", "text": "$2.56 \\times 10^{-10}$", "image": null, "isCorrect": true}, {"id": "mibVG", "text": "$3.60 \\times 10^{-8}$", "image": null, "isCorrect": false}, {"id": "hAYmi", "text": "$6.41 \\times 10^{-10}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of the salt $\\mathrm{BA}_2$ is given by:<br><br>$\\mathrm{BA}_2 \\rightleftharpoons \\mathrm{B}^{2+} + 2\\mathrm{A}^{-}$<br><br>Let the solubility of the salt be $S$. Then the concentrations of the ions are:<br><br>$[\\mathrm{B}^{2+}] = S$<br><br>$[\\mathrm{A}^{-}] = 2S$<br><br>The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [\\mathrm{B}^{2+}][\\mathrm{A}^{-}]^2$<br><br>$K_{sp} = (S)(2S)^2 = 4S^3$<br><br>Given $S = 4 \\times 10^{-4} \\mathrm{~mol~} \\mathrm{dm}^{-3}$, substituting this value:<br><br>$K_{sp} = 4 \\times (4 \\times 10^{-4})^3$<br><br>$K_{sp} = 4 \\times 64 \\times 10^{-12}$<br><br>$K_{sp} = 256 \\times 10^{-12}$<br><br>$K_{sp} = 2.56 \\times 10^{-10}$<br><br>Answer: $2.56 \\times 10^{-10}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b26bf9280d7f99326af", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The solubility of AgBr is $7.1 \\times 10^{-7} \\mathrm{~mol~} \\mathrm{dm}^{-3}$. Calculate it's solubility product at the same temperature.", "image": null}, "options": [{"id": "foUPM", "text": "$7.08 \\times 10^{-13}$", "image": null, "isCorrect": false}, {"id": "ieczg", "text": "$3.67 \\times 10^{-13}$", "image": null, "isCorrect": false}, {"id": "Q6236", "text": "$5.89 \\times 10^{-13}$", "image": null, "isCorrect": false}, {"id": "dTWZr", "text": "$5.04 \\times 10^{-13}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The dissociation of silver bromide is given by:<br><br>$\\text{AgBr} \\rightleftharpoons \\text{Ag}^{+} + \\text{Br}^{-}$<br><br>Let the solubility of $\\text{AgBr}$ be $S$.<br><br>The solubility product $K_{sp}$ is given by:<br><br>$K_{sp} = [\\text{Ag}^{+}][\\text{Br}^{-}] = S \\times S = S^2$<br><br>Given $S = 7.1 \\times 10^{-7} \\text{ mol dm}^{-3}$<br><br>$K_{sp} = (7.1 \\times 10^{-7})^2$<br><br>$K_{sp} = 50.41 \\times 10^{-14} = 5.04 \\times 10^{-13}$<br><br>Answer: $5.04 \\times 10^{-13}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b24bf9280d7f993269c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Solubility of $\\mathrm{Ca}_3\\left(\\mathrm{PO}_4\\right)_2$ is 'S' mol $\\mathrm{dm}^{-3}$. Find solubility product.", "image": null}, "options": [{"id": "FHrMn", "text": "$S^5$", "image": null, "isCorrect": false}, {"id": "JDoC5", "text": "$108 \\mathrm{~S}^5$", "image": null, "isCorrect": true}, {"id": "gXrUN", "text": "$54 S^5$", "image": null, "isCorrect": false}, {"id": "4i74v", "text": "$12 S^5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of calcium phosphate is given by:<br><br>$\\mathrm{Ca}_3(\\mathrm{PO}_4)_2 \\rightleftharpoons 3\\mathrm{Ca}^{2+} + 2\\mathrm{PO}_4^{3-}$<br><br>Let the solubility of $\\mathrm{Ca}_3(\\mathrm{PO}_4)_2$ be $S$ mol $\\mathrm{dm}^{-3}$.<br><br>The equilibrium concentrations of the ions are:<br><br>$[\\mathrm{Ca}^{2+}] = 3S$<br><br>$[\\mathrm{PO}_4^{3-}] = 2S$<br><br>The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [\\mathrm{Ca}^{2+}]^3 [\\mathrm{PO}_4^{3-}]^2$<br><br>$K_{sp} = (3S)^3 (2S)^2$<br><br>$K_{sp} = 27S^3 \\times 4S^2$<br><br>$K_{sp} = 108S^5$<br><br>Answer: $108 \\mathrm{~S}^5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b12bf9280d7f9932607", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the value of $\\mathrm{K}_{\\mathrm{sp}}$ for saturated solution of $\\mathrm{Ba}(\\mathrm{OH})_2$ having pH 12 ?", "image": null}, "options": [{"id": "Zh5I7", "text": "$4 \\times 10^{-4}$", "image": null, "isCorrect": false}, {"id": "ok84n", "text": "$4 \\times 10^{-6}$", "image": null, "isCorrect": false}, {"id": "tqOqY", "text": "$5 \\times 10^{-6}$", "image": null, "isCorrect": false}, {"id": "qRaH5", "text": "$5 \\times 10^{-7}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $\\text{pH} = 12$<br><br>$\\text{pOH} = 14 - \\text{pH} = 14 - 12 = 2$<br><br>$[\\text{OH}^-] = 10^{-\\text{pOH}} = 10^{-2} \\text{ M}$<br><br>The dissociation of $\\text{Ba}(\\text{OH})_2$ is given by:<br><br>$\\text{Ba}(\\text{OH})_2 \\rightleftharpoons \\text{Ba}^{2+} + 2\\text{OH}^-$<br><br>From the stoichiometry, $[\\text{Ba}^{2+}] = \\dfrac{[\\text{OH}^-]}{2} = \\dfrac{10^{-2}}{2} = 5 \\times 10^{-3} \\text{ M}$<br><br>The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [\\text{Ba}^{2+}][\\text{OH}^-]^2$<br><br>$K_{sp} = (5 \\times 10^{-3}) \\times (10^{-2})^2$<br><br>$K_{sp} = 5 \\times 10^{-7}$<br><br>Answer: $5 \\times 10^{-7}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b03bf9280d7f9932598", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The solubility product of a sparingly soluble salt AX is $4.9 \\times 10^{-13}$. What is its solubility in $\\mathrm{mol~} \\mathrm{dm}^{-3}$ ?", "image": null}, "options": [{"id": "kJYCS", "text": "$2.4 \\times 10^{-13}$", "image": null, "isCorrect": false}, {"id": "A92B5", "text": "$4.9 \\times 10^{-7}$", "image": null, "isCorrect": false}, {"id": "iq7Cw", "text": "$7.0 \\times 10^{-7}$", "image": null, "isCorrect": true}, {"id": "JIJ3r", "text": "$7.0 \\times 10^{-13}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a sparingly soluble salt $AX$, the dissociation equilibrium is:<br><br>$AX \\rightleftharpoons A^+ + X^-$<br><br>Let the solubility of the salt be $S$. Then the concentrations of the ions are $[A^+] = S$ and $[X^-] = S$.<br><br>The solubility product $K_{sp}$ is given by:<br><br>$K_{sp} = [A^+][X^-] = S \\times S = S^2$<br><br>Given $K_{sp} = 4.9 \\times 10^{-13}$, we can write this as $49 \\times 10^{-14}$.<br><br>$S^2 = 49 \\times 10^{-14}$<br><br>$S = \\sqrt{49 \\times 10^{-14}} = 7.0 \\times 10^{-7} \\text{ mol dm}^{-3}$<br><br>Answer: $7.0 \\times 10^{-7}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214480aee93fa0796df6c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Calculate the solubility product of sparingly soluble salt BA at $27^{\\circ} \\mathrm{C}$ if its solubility is $1.8 \\times 10^{-5} \\mathrm{~mol} \\mathrm{dm}^{-3}$ at same temperature.", "image": null}, "options": [{"id": "GTyoU", "text": "$3.24 \\times 10^{-10}$", "image": null, "isCorrect": true}, {"id": "EmjaP", "text": "$2.44 \\times 10^{-10}$", "image": null, "isCorrect": false}, {"id": "bVm6X", "text": "$1.64 \\times 10^{-10}$", "image": null, "isCorrect": false}, {"id": "Ixiez", "text": "$4.00 \\times 10^{-10}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of the sparingly soluble salt $\\text{BA}$ is given by:<br><br>$\\text{BA} \\rightleftharpoons \\text{B}^{+} + \\text{A}^{-}$<br><br>Let the solubility of the salt be $S$. The concentrations of the ions are:<br><br>$[\\text{B}^{+}] = S$<br><br>$[\\text{A}^{-}] = S$<br><br>The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [\\text{B}^{+}][\\text{A}^{-}] = S^2$<br><br>Given $S = 1.8 \\times 10^{-5} \\text{ mol dm}^{-3}$, substituting this value:<br><br>$K_{sp} = (1.8 \\times 10^{-5})^2$<br><br>$K_{sp} = 3.24 \\times 10^{-10}$<br><br>Answer: $3.24 \\times 10^{-10}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214370aee93fa0796dee3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Calculate the solubility in $\\mathrm{mol} \\mathrm{dm}^{-3}$ of sparingly soluble salt BA if its solubility product $4.9 \\times 10^{-13}$ at same temperature.", "image": null}, "options": [{"id": "LNRjw", "text": "$7.0 \\times 10^{-7}$", "image": null, "isCorrect": true}, {"id": "RYEsJ", "text": "$7.5 \\times 10^{-7}$", "image": null, "isCorrect": false}, {"id": "juHrI", "text": "$8.0 \\times 10^{-7}$", "image": null, "isCorrect": false}, {"id": "BiG4H", "text": "$4.9 \\times 10^{-7}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of the sparingly soluble salt $\\mathrm{BA}$ is given by:<br><br>$\\mathrm{BA} \\rightleftharpoons \\mathrm{B}^{+} + \\mathrm{A}^{-}$<br><br>Let the solubility of the salt be $S \\mathrm{mol} \\mathrm{dm}^{-3}$.<br><br>The solubility product $K_{sp}$ is given by:<br><br>$K_{sp} = [\\mathrm{B}^{+}][\\mathrm{A}^{-}] = S \\times S = S^2$<br><br>Given $K_{sp} = 4.9 \\times 10^{-13}$, we have:<br><br>$S^2 = 4.9 \\times 10^{-13} = 49 \\times 10^{-14}$<br><br>$S = \\sqrt{49 \\times 10^{-14}} = 7.0 \\times 10^{-7} \\mathrm{mol} \\mathrm{dm}^{-3}$<br><br>Answer: $7.0 \\times 10^{-7}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d70aee93fa0796dbf2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Which from the following equations represents the relation between solubility ( $\\mathrm{mol} \\mathrm{L}^{-1}$ ) and solubility product for a salt $\\mathrm{B}_3 \\mathrm{~A}_2$ ?", "image": null}, "options": [{"id": "m3oEi", "text": "$\\mathrm{S}=\\left(\\dfrac{\\mathrm{K}_{\\mathrm{sp}}}{108}\\right)^{\\dfrac{1}{5}}$", "image": null, "isCorrect": true}, {"id": "vgHAV", "text": "$\\quad \\mathrm{S}=\\left(108 \\times \\mathrm{K}_{\\mathrm{sp}}\\right)^{1 / 5}$", "image": null, "isCorrect": false}, {"id": "LD4YK", "text": "$\\mathrm{S}=\\left(\\dfrac{\\mathrm{K}_{\\mathrm{sp}}}{27}\\right)^{\\dfrac{1}{5}}$", "image": null, "isCorrect": false}, {"id": "MqQyr", "text": "$\\mathrm{S}=\\left(27 \\times \\mathrm{K}_{\\mathrm{sp}}\\right)^{1 / 5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of the salt $B_3A_2$ is given by:<br><br>$B_3A_2 \\rightleftharpoons 3B^{2+} + 2A^{3-}$<br><br>Let the solubility of the salt be $S$. The equilibrium concentrations of the ions are:<br><br>$[B^{2+}] = 3S$<br><br>$[A^{3-}] = 2S$<br><br>The solubility product $K_{sp}$ is written as:<br><br>$K_{sp} = [B^{2+}]^3 [A^{3-}]^2$<br><br>Substituting the concentrations:<br><br>$K_{sp} = (3S)^3 (2S)^2$<br><br>$K_{sp} = 27S^3 \\times 4S^2$<br><br>$K_{sp} = 108S^5$<br><br>Rearranging for $S$:<br><br>$S^5 = \\dfrac{K_{sp}}{108}$<br><br>$S = \\left(\\dfrac{K_{sp}}{108}\\right)^{\\dfrac{1}{5}}$<br><br>Answer: $\\mathrm{S}=\\left(\\dfrac{\\mathrm{K}_{\\mathrm{sp}}}{108}\\right)^{\\dfrac{1}{5}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c00aee93fa0796db3c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Calculate solubility $\\left(\\mathrm{moldm}^{-3}\\right)$ of a sparingly soluble electrolyte AB at 298 K if its solubility product is $1.6 \\times 10^{-5}$ ?", "image": null}, "options": [{"id": "wrJUV", "text": "$1.6 \\times 10^{-3}$", "image": null, "isCorrect": false}, {"id": "5UvB9", "text": "$2.5 \\times 10^{-3}$", "image": null, "isCorrect": false}, {"id": "SYop0", "text": "$4.0 \\times 10^{-3}$", "image": null, "isCorrect": true}, {"id": "0CLjd", "text": "$8.0 \\times 10^{-3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the sparingly soluble electrolyte AB, the dissociation equilibrium is:<br><br>$AB(s) \\rightleftharpoons A^+(aq) + B^-(aq)$<br><br>Let the solubility of AB be $S$.<br><br>The solubility product $K_{sp}$ is given by:<br><br>$K_{sp} = [A^+][B^-] = S \\times S = S^2$<br><br>Given $K_{sp} = 1.6 \\times 10^{-5}$, we have:<br><br>$S^2 = 1.6 \\times 10^{-5} = 16 \\times 10^{-6}$<br><br>$S = \\sqrt{16 \\times 10^{-6}} = 4.0 \\times 10^{-3}$<br><br>Answer: $4.0 \\times 10^{-3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b00aee93fa0796dac0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Calculate the solubility of sparingly soluble salt $\\mathrm{BA}^{\\prime}$ in $\\mathrm{mol} \\mathrm{dm}^{-3}$ at 300 K if its solubility product is $4.9 \\times 10^{-9}$ at same temperature.", "image": null}, "options": [{"id": "B6NU5", "text": "$5.72 \\times 10^{-5}$", "image": null, "isCorrect": false}, {"id": "OrvKk", "text": "$6.40 \\times 10^{-5}$", "image": null, "isCorrect": false}, {"id": "LZHtZ", "text": "$7.00 \\times 10^{-5}$", "image": null, "isCorrect": true}, {"id": "88rJ8", "text": "$7.81 \\times 10^{-5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a sparingly soluble salt $\\mathrm{BA}$, the dissociation equilibrium is:<br><br>$\\mathrm{BA} \\rightleftharpoons \\mathrm{B}^{+} + \\mathrm{A}^{-}$<br><br>Let the solubility of the salt be $S$. Then the concentration of the ions will be:<br><br>$[\\mathrm{B}^{+}] = S$<br><br>$[\\mathrm{A}^{-}] = S$<br><br>The solubility product $K_{sp}$ is given by:<br><br>$K_{sp} = [\\mathrm{B}^{+}][\\mathrm{A}^{-}] = S \\times S = S^2$<br><br>Given $K_{sp} = 4.9 \\times 10^{-9}$, we can write:<br><br>$S^2 = 4.9 \\times 10^{-9} = 49 \\times 10^{-10}$<br><br>$S = \\sqrt{49 \\times 10^{-10}} = 7.00 \\times 10^{-5} \\text{ mol dm}^{-3}$<br><br>Answer: $7.00 \\times 10^{-5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138b0aee93fa0796d99b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Calculate the solubility product of sparingly soluble salt BA at $25^{\\circ} \\mathrm{C}$ if its solubility is $7.2 \\times 10^{-7} \\mathrm{~mol} \\mathrm{dm}^{-3}$ at same temperature.", "image": null}, "options": [{"id": "idXw0", "text": "$4.810 \\times 10^{-13}$", "image": null, "isCorrect": false}, {"id": "uRs2n", "text": "$5.184 \\times 10^{-13}$", "image": null, "isCorrect": true}, {"id": "ukauD", "text": "$6.454 \\times 10^{-13}$", "image": null, "isCorrect": false}, {"id": "aTDRh", "text": "$5.925 \\times 10^{-13}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of the sparingly soluble salt $BA$ is given by:<br><br>$BA \\rightleftharpoons B^+ + A^-$<br><br>If $S$ is the solubility of the salt, the equilibrium concentrations of the ions are:<br><br>$[B^+] = S$<br><br>$[A^-] = S$<br><br>The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [B^+][A^-] = S \\times S = S^2$<br><br>Given solubility $S = 7.2 \\times 10^{-7} \\mathrm{mol} \\mathrm{dm}^{-3}$<br><br>$K_{sp} = (7.2 \\times 10^{-7})^2$<br><br>$K_{sp} = 51.84 \\times 10^{-14}$<br><br>$K_{sp} = 5.184 \\times 10^{-13}$<br><br>Answer: $5.184 \\times 10^{-13}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213510aee93fa0796d7d9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Which of the following equations represents the relation between solubility and solubility product for salt $\\mathrm{BA}_3$ ?", "image": null}, "options": [{"id": "0avG4", "text": "$\\mathrm{S}=\\left(\\dfrac{\\mathrm{K}_{\\mathrm{sp}}}{27}\\right)^{1 / 4}$", "image": null, "isCorrect": true}, {"id": "oi1fa", "text": "$\\mathrm{S}=\\left(27 \\times \\mathrm{K}_{\\mathrm{sp}}\\right)^{1 / 4}$", "image": null, "isCorrect": false}, {"id": "jWkp3", "text": "$\\mathrm{S}=\\left(\\dfrac{\\mathrm{K}_{\\mathrm{sp}}}{4}\\right)^{1 / 4}$", "image": null, "isCorrect": false}, {"id": "jEL2X", "text": "$\\quad \\mathrm{S}=\\left(4 \\times \\mathrm{K}_{\\mathrm{sp}}\\right)^{1 / 4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of the salt $BA_3$ can be represented as:<br><br>$BA_3 \\rightleftharpoons B^{3+} + 3A^{-}$<br><br>Let the solubility of the salt be $S$. Then the equilibrium concentrations are:<br><br>$[B^{3+}] = S$<br><br>$[A^{-}] = 3S$<br><br>The expression for the solubility product $K_{sp}$ is:<br><br>$K_{sp} = [B^{3+}][A^{-}]^3$<br><br>Substituting the concentrations:<br><br>$K_{sp} = (S)(3S)^3$<br><br>$K_{sp} = S \\times 27S^3$<br><br>$K_{sp} = 27S^4$<br><br>Rearranging for $S$:<br><br>$S^4 = \\dfrac{K_{sp}}{27}$<br><br>$S = \\left(\\dfrac{K_{sp}}{27}\\right)^{1/4}$<br><br>Answer: $\\mathrm{S}=\\left(\\dfrac{\\mathrm{K}_{\\mathrm{sp}}}{27}\\right)^{1 / 4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133b0aee93fa0796d729", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Calculate the solubility product of sparingly soluble salt BA at 300 K if its solubility is $9.1 \\times 10^{-3} \\mathrm{moldm}^{-3}$ at same temperature.", "image": null}, "options": [{"id": "zThiB", "text": "$9.635 \\times 10^{-5}$", "image": null, "isCorrect": false}, {"id": "EvJyP", "text": "$9.012 \\times 10^{-5}$", "image": null, "isCorrect": false}, {"id": "nUNGU", "text": "$\\quad 8.281 \\times 10^{-5}$", "image": null, "isCorrect": true}, {"id": "ccI1l", "text": "$7.816 \\times 10^{-5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of the sparingly soluble salt $BA$ is given by:<br><br>$BA \\rightleftharpoons B^+ + A^-$<br><br>If $s$ is the solubility of the salt, then the equilibrium concentrations of the ions are:<br><br>$[B^+] = s$<br><br>$[A^-] = s$<br><br>The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [B^+][A^-] = s \\times s = s^2$<br><br>Given $s = 9.1 \\times 10^{-3} \\text{ mol dm}^{-3}$, substituting this value:<br><br>$K_{sp} = (9.1 \\times 10^{-3})^2$<br><br>$K_{sp} = 82.81 \\times 10^{-6}$<br><br>$K_{sp} = 8.281 \\times 10^{-5}$<br><br>Answer: $\\quad 8.281 \\times 10^{-5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627e0279619d9d8a34fb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "The solubility product of $\\mathrm{PbCl}_2$ at $298 \\mathrm{~K}$ is $3.2 \\times 10^{-5}$. What is its solubility in mol dm${ }^{-3}$ ?", "image": null}, "options": [{"id": "xfMvv", "text": "$8 \\times 10^{-6}$", "image": null, "isCorrect": false}, {"id": "3IAme", "text": "$2 \\times 10^{-2}$", "image": null, "isCorrect": true}, {"id": "dJArM", "text": "$5.6 \\times 10^{-3}$", "image": null, "isCorrect": false}, {"id": "imHK1", "text": "$5.0 \\times 10^{-2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{K}_{\\text {sp }}=3.2 \\times 10^{-5} \\\\ & \\mathrm{PbCl}_{2(\\mathrm{~s})} \\rightleftharpoons \\mathrm{Pb}_{(\\mathrm{aq})}^{2+}+2 \\mathrm{Cl}_{(\\mathrm{aq})}^{-} \\\\ & \\therefore \\quad \\mathrm{K}_{\\mathrm{sp}}=4 \\mathrm{~S}^3 \\\\ & \\therefore \\quad 4 \\mathrm{~S}^3=3.2 \\times 10^{-5} \\\\ & \\mathrm{~S}=\\sqrt[3]{\\frac{3.2 \\times 10^{-5}}{4}} \\\\ & =\\sqrt[3]{8 \\times 10^{-6}} \\\\ & =2 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\\\ & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625c0279619d9d8a33e7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Which among the following salts exhibits inverse relation between its solubility and temperature?", "image": null}, "options": [{"id": "cqwGH", "text": "$\\mathrm{NaBr}$", "image": null, "isCorrect": false}, {"id": "sA5za", "text": "$\\mathrm{NaNO}_3$", "image": null, "isCorrect": false}, {"id": "m4oFN", "text": "$\\mathrm{KNO}_3$", "image": null, "isCorrect": false}, {"id": "xe3BG", "text": "$\\mathrm{Na}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Solubility of $\\mathrm{Na}_2 \\mathrm{SO}_4$ decreases with increase of temperature.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2624a0279619d9d8a3352", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "If $\\mathrm{K}_{\\mathrm{sp}}$ is solubility product of $\\mathrm{Al}(\\mathrm{OH})_3$, its solubility is expressed by formula,", "image": null}, "options": [{"id": "yr1ks", "text": "$\\sqrt[3]{\\frac{4}{\\mathrm{~K}_{\\mathrm{sp}}}}$", "image": null, "isCorrect": false}, {"id": "lQ898", "text": "$\\sqrt[3]{\\frac{\\mathrm{K}_{s p}}{4}}$", "image": null, "isCorrect": false}, {"id": "85rpe", "text": "$\\sqrt[4]{\\frac{K_{s p}}{27}}$", "image": null, "isCorrect": true}, {"id": "QqHmz", "text": "$\\sqrt[4]{\\mathrm{K}_{\\mathrm{sp}} \\times 27}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\mathrm{Al}(\\mathrm{OH})_{3(\\mathrm{~s})} \\rightleftharpoons \\mathrm{Al}_{(\\mathrm{mq})}^{3+}+3 \\mathrm{OH}_{(\\mathrm{sq})}^{-} \\\\ & \\text {Here, } x=1, \\mathrm{y}=3 \\\\ \\therefore \\quad & \\mathrm{K}_{s p}=x^x \\mathrm{y}^{\\mathrm{y}} \\mathrm{S}^{x+y}=(1)^1(3)^3 \\mathrm{~S}^{1+3}=27 \\mathrm{~S}^4 \\\\ \\therefore \\quad & \\mathrm{S}=\\sqrt[4]{\\frac{\\mathrm{K}_{\\mathrm{sp}}}{27}}\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f209 rue, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262340279619d9d8a32a0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "What is the solubility of $\\mathrm{AgCl}_{(\\mathrm{s})}$ if its solubility product is $1.6 \\times 10^{-10}$ ?", "image": null}, "options": [{"id": "ahwpz", "text": "$1.26 \\times 10^{-5} \\mathrm{M}$", "image": null, "isCorrect": true}, {"id": "1Zhj5", "text": "$1.00 \\times 10^{-9} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "69KPj", "text": "$2.6 \\times 10^{-5} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "Ge41L", "text": "$1.56 \\times 10^{-9} \\mathrm{M}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{AgCl}_{(\\mathrm{s})} \\rightleftharpoons \\mathrm{Ag}_{\\text {(aq) }}^{+}+\\mathrm{Cl}_{\\text {(aq) }}^{-} \\\\ & x=1, \\mathrm{y}=1 \\\\ & \\mathrm{~K}_{\\text {sp }}=x^x \\mathrm{y}^{\\mathrm{y}} \\mathrm{S}^{x+\\mathrm{y}}=(1)^1(1)^1 \\mathrm{~S}^{1+1}=\\mathrm{S}^2 \\\\ & \\mathrm{~S}=\\sqrt{\\mathrm{K}_{\\mathrm{sp}}}=\\sqrt{1.6 \\times 10^{-10}} \\\\ & \\quad=1.26 \\times 10^{-5} \\mathrm{M}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262210279619d9d8a3206", "type": "singleCorrect", "level": 1, "questionLabels": [ rm{~L}^{-1}$", "image": null, "isCorrect": true}, {"id": "oVyKA", "text": "$3.228 \\times 10^{-3} \\mathrm{~mol} \\mathrm{~L}^{-1}$", "image": null, "isCorrect": false}, {"id": "j0QWX", "text": "$2.831 \\times 10^{-3} \\mathrm{~mol} \\mathrm{~L}^{-1}$", "image": null, "isCorrect": false}, {"id": "nTNu6", "text": "$1.811 \\times 10^{-3} \\mathrm{~mol} \\mathrm{~L}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\text { For } \\mathrm{PbI}_2, \\\\ & \\mathrm{PbI}_{2(\\mathrm{~s})} \\rightleftharpoons \\mathrm{Pb}_{\\text {(aq) }}^{2+}+2 \\mathrm{I}_{(\\mathrm{aq})}^{-} \\\\ & x=1, \\mathrm{y}=2 \\\\ \\therefore \\quad & \\mathrm{K}_{\\mathrm{sp}}=x^x \\mathrm{y}^{\\mathrm{y}} \\mathrm{S}^{x+\\mathrm{y}}=(1)^1(2)^2 \\mathrm{~S}^{1+2}=4 \\mathrm{~S}^3 \\\\ \\therefore \\quad & \\mathrm{S}=\\sqrt[3]{\\frac{\\mathrm{Ksp}}{4}}=\\sqrt[3]{\\frac{7.0 \\times 10^{-9}}{4}}=1.21 \\times 10^{-3} \\mathrm{~mol} \\mathrm{~L}^{-1}\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b30279619d9d8a2ea6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Solubility of a salt $A_2 B_3$ is $1 \\times 10^{-3} \\mathrm{~mol} \\mathrm{dm}^{-3}$. What is the value of its solubility product?", "image": null}, "options": [{"id": "cqATY", "text": "$1.08 \\times 10^{-13}$", "image": null, "isCorrect": true}, {"id": "k4Xqg", "text": "$8.1 \\times 10^{-15}$", "image": null, "isCorrect": false}, {"id": "C6CR1", "text": "$2.7 \\times 10^{-15}$", "image": null, "isCorrect": false}, {"id": "YCmdo", "text": "$2.0 \\times 10^{-13}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{A}_2 \\mathrm{~B}_{3(\\mathrm{~s})} \\rightleftharpoons 2 \\mathrm{~A}_{(\\text {(aq) }}^{3+}+3 \\mathrm{~B}_{(\\text {aq })}^{2-}$\n$\\begin{aligned} & \\text { Here, } x=2, \\mathrm{y}=3 \\\\ & \\begin{aligned} \\mathrm{K}_{\\text {sp }} & =x^x \\mathrm{y}^{\\mathrm{y}} \\mathrm{S}^{x+y} \\\\ & =(2)^2(3)^3 \\mathrm{~S}^{2+3} \\\\ & =108 \\mathrm{~S}^5\\end{aligned} \\\\ & \\begin{aligned} \\mathrm{K}_{\\text {sp }} & =108 \\times\\left(1 \\times 10^{-3}\\right)^5 \\\\ & =108 \\times 10^{-15} \\\\ & =1.08 \\times 10^{-13}\\end{aligned}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2610a0279619d9d8a2955", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "What is the $\\mathrm{pH}$ at which $\\mathrm{Mg}(\\mathrm{OH})_2$ starts to precipitate from a solution containing $0.1 \\mathrm{M} \\mathrm{Mg}^{2+}$ ions?\n(Given Ksp for $\\mathrm{Mg}(\\mathrm{OH})_2=1.0 \\times 10^{-11}$ )", "image": null}, "options": [{"id": "E2pgs", "text": "7", "image": null, "isCorrect": false}, {"id": "L9ul6", "text": "4", "image": null, "isCorrect": false}, {"i tionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
