"isCorrect": false}, {"id": "UpdIQ", "text": "$0.062 \\%$", "image": null, "isCorrect": false}, {"id": "NfqgX", "text": "$0.80 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\propto=7.2 \\times 10^{-4} \\times 100 \\\\ & =0.072 \\%\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260cf0279619d9d8a277d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "What is the $\\mathrm{pH}$ of $0.005 \\mathrm{M} \\mathrm{H}_2 \\mathrm{SO}_4$ solution?", "image": null}, "options": [{"id": "iRLwB", "text": "5.0", "image": null, "isCorrect": false}, {"id": "oFDp0", "text": "2.3", "image": null, "isCorrect": false}, {"id": "LlrHl", "text": "3.3", "image": null, "isCorrect": false}, {"id": "LYjAc", "text": "2.0", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{H}_2 \\mathrm{SO}_4 \\longrightarrow 2 \\mathrm{H}^{+}+\\mathrm{SO}_4^{2-} \\\\ & {\\left[\\mathrm{H}_2 \\mathrm{SO}_4\\right]=0.005 \\mathrm{M}} \\\\ & {\\left[\\mathrm{H}^{+}\\right]=2 \\times 0.005=0.01 \\mathrm{M}} \\\\ & \\mathrm{pH}=-\\log \\left[\\mathrm{H}^{+}\\right]=-\\log 0.01 \\\\ & \\mathrm{pH}=2\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260be0279619d9d8a26f3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "$\\mathrm{pH}$ of soft drink is 3.6. Calculate the concentration of hydrogen ions in it.", "image": null}, "options": [{"id": "oU6Er", "text": "$2.51 \\times 10^{-4} \\mathrm{M}$", "image": null, "isCorrect": true}, {"id": "1HlF2", "text": "$2.3 \\times 10^{-3} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "bMk6v", "text": "$2.0 \\times 10^{-3} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "YTh9A", "text": "$2.81 \\times 10^{-4} \\mathrm{M}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{pH}=-\\log _{10}\\left[\\mathrm{H}^{+}\\right] \\\\ & {\\left[\\mathrm{H}^{+}\\right]=10^{-\\mathrm{pH}}} \\\\ & =10^{-3.6} \\\\ & =10^{-4+0.4} \\quad\\left(10^{0.4}=2.51\\right) \\\\ & =10^{0.4} \\times 10^{-4} \\\\ & {\\left[\\mathrm{H}^{+}\\right]=2.51 \\times 10^{-4} \\mathrm{M}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260620279619d9d8a240f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "The pH of $0.005 \\mathrm{M} \\mathrm{KOH}$ is 9.95. Calculate the $\\left[\\mathrm{OH}^{-}\\right]$", "image": null}, "options": [{"id": "I6Pi9", "text": "$6.71 \\times 10^{-4} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "7z15y", "text": "$1.12 \\times 10^{-4} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "q1JGz", "text": "$4.45 \\times 10^{-5} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "5160v", "text": "$8.91 \\times 10^{-5} \\mathrm{M}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{P}^{\\mathrm{H}}+\\mathrm{P}^{\\mathrm{OH}}=14 \\\\ & \\mathrm{P}^{\\mathrm{OH}}=14-.9 .95 \\\\ & =4.05 \\\\ & \\mathrm{P}^{\\mathrm{OH}}=-\\log _{10}\\left[\\mathrm{OH}^{-}\\right] \\\\ & {\\left[\\mathrm{OH}^{-}\\right]=10^{-\\mathrm{P}^{\\mathrm{OH}}}=10^{-4.05}} \\\\ & =10^{-5+0.95}=10^{-5} \\times 10^{0.95}=8.91 \\times 10^{-5} \\mathrm{M}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604f0279619d9d8a236f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "What is the $\\mathrm{pH}$ of $0.02 \\mathrm{M} \\mathrm{NaOH}$ solution?", "image": null}, "options": [{"id": "JYEAd", "text": "10.3", "image": null, "isCorrect": false}, {"id": "F5o7B", "text": "11.3", "image": null, "isCorrect": false}, {"id": "tg6Na", "text": "11.7", "image": null, "isCorrect": false}, {"id": "NlD2I", "text": "12.3", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n[\\mathrm{NaOH}]=\\left[\\mathrm{OH}^{-}\\right]=2 \\times 10^{-2} \\mathrm{M}\n$$\n$\\mathrm{NaOH}$ is strong Base.\n$$\n\\begin{aligned}\n& \\mathrm{P}^{\\mathrm{OH}}=-\\log \\left[\\mathrm{OH}^{-}\\right]=-\\log \\left(2 \\times 10^{-2}\\right) \\\\\n& =2-\\log 2 \\\\\n& =2-0.3=1.7 \\\\\n& \\mathrm{P}^{\\mathrm{H}}+\\mathrm{P}^{\\mathrm{OH}}=14 \\\\\n& \\mathrm{p}^{\\mathrm{H}}=14-\\mathrm{P}^{\\mathrm{OH}}=14-1.7=12.3\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9f0279619d9d8a15ed", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The hydrogen ion concentration of a solution is $3.98 \\times 10^{-6}$ mole per liter. The $\\mathrm{pH}$ value of this solution will be", "image": null}, "options": [{"id": "bUqQh", "text": "$6.0$", "image": null, "isCorrect": false}, {"id": "lxibW", "text": "$5.8$", "image": null, "isCorrect": false}, {"id": "KMvXv", "text": "$5.4$", "image": null, "isCorrect": true}, {"id": "M75cD", "text": "$5.9$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{pH}=-\\log \\left[\\mathrm{H}^{+}\\right]$\n$=-\\log \\left(3.98 \\times 10^{-6}\\right)$\n$=-\\log 3.98-\\log 10^{-6}$\n$=-0.59+6=5.41$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8b0279619d9d8a1549", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "An acid solution of $\\mathrm{pH}=6$ is diluted 1000 times, the pH of the final solution becomes", "image": null}, "options": [{"id": "qTpr0", "text": "$6.01$", "image": null, "isCorrect": false}, {"id": "aVAzc", "text": "9", "image": null, "isCorrect": false}, {"id": "aaZjJ", "text": "$3.5$", "image": null, "isCorrect": false}, {"id": "2v8hm", "text": "$6.99$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\because \\mathrm{pH}=6$\n$\\therefore$\n$\\left[\\mathrm{H}^{+}\\right]=10^{-6} \\mathrm{M}$\nAfter dilution $\\left[\\mathrm{H}^{+}\\right]=\\frac{10^{-6}}{1000}=10^{-9} \\mathrm{M}$\n$\\therefore\\left[\\mathrm{H}^{+}\\right]$ from $\\mathrm{H}_{2} \\mathrm{O}$ cannot be neglected.\nTotal $\\left[\\mathrm{H}^{+}\\right]=10^{-9}+10^{-7}$\n$\\begin{aligned} &=10^{-7}\\left(10^{-2}+1\\right) \\\\ &=10^{-7}(1.01) \\\\ \\mathrm{pH} &=-\\log \\left(1.01 \\times 10^{-7}\\right) \\\\ &=7-0.0043 \\\\ &=6.9957 \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e670279619d9d8a1423", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "If $20 \\mathrm{~mL}$ of an acidic solution of $\\mathrm{pH} 3$ is diluted to $100 \\mathrm{~mL}$, the $\\mathrm{H}^{+}$ ion concentration will be", "image": null}, "options": [{"id": "UCElp", "text": "$1 \\times 10^{-3} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "9P96h", "text": "$2 \\times 10^{-3} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "yVCOS", "text": "$2 \\times 10^{-4} \\mathrm{M}$", "image": null, "isCorrect": true}, {"id": "0Nbs3", "text": "$0.02 \\times 10^{-4} \\mathrm{M}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{pH}=3$ (given)\n$\\begin{aligned} \\therefore\\left[\\mathrm{H}^{+}\\right]=1 \\times 10^{-3} \\mathrm{M} &=1 \\times 10^{-3} \\mathrm{~N} \\\\ N_{1} V_{1} &=N_{2} V_{2} \\\\ 1 \\times 10^{-3} \\times 20 &=N_{2} \\times 100 \\\\ N_{2} &=2 \\times 10^{-4} \\\\ \\therefore \\quad\\left[\\mathrm{H}^{+}\\right] &=2 \\times 10^{-4} \\mathrm{M} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e580279619d9d8a13aa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The $\\mathrm{pH}$ of a $0.1 \\mathrm{M}$ solution of $\\mathrm{NH}_{4} \\mathrm{OH}$ (having $K_{b}=1.0 \\times 10^{-5}$ ) is equal to", "image": null}, "options": [{"id": "d8sVb", "text": "10", "image": null, "isCorrect": false}, {"id": "vPxj4", "text": "6", "image": null, "isCorrect": false}, {"id": "U7Aqb", "text": "11", "image": null, "isCorrect": true}, {"id": "ZNgCl", "text": "12", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\\left[\\mathrm{OH}^{-}\\right] &=\\sqrt{K_{b} \\times C} \\\\ &=\\sqrt{1 \\times 10^{-5} \\times 10^{-1}}=\\sqrt{10^{-6}}=10^{-3} \\\\ K_{w} &=\\left[\\mathrm{H}^{+}\\right]\\left[\\mathrm{OH}^{-}\\right] \\\\ 10^{-14} &=\\left[\\mathrm{H}^{+}\\right]\\left[10^{-3}\\right] \\\\\\left[\\mathrm{H}^{+}\\right] &=10^{-11} \\\\ \\text { Hence, } \\mathrm{pH} &=-\\log \\mathrm{H}^{+} \\\\ &=-\\log \\left(1 \\times 10^{-11}\\right)=11 \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e410279619d9d8a12f9", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The $\\mathrm{pH}$ of a $10^{-8}$ molar solution of $\\mathrm{HCl}$ in water is", "image": null}, "options": [{"id": "MJ0im", "text": "8", "image": null, "isCorrect": false}, {"id": "PxKC0", "text": "between 7 and 8", "image": null, "isCorrect": false}, {"id": "5I5gv", "text": "between 6 and 7", "image": null, "isCorrect": true}, {"id": "HPEe2", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{pH}=-\\log \\left[\\mathrm{H}^{+}\\right]=-\\log 10^{-8}=8$\nIt is not possible for acid, so it is $\\left[\\mathrm{H}^{+}\\right]$, the $\\left[\\mathrm{H}^{+}\\right]$ of water is also added. Total $\\left[\\mathrm{H}^{+}\\right]$ in solution\n$$\n\\begin{aligned}\n&=\\left[\\mathrm{H}^{+}\\right] \\text {of } \\mathrm{HCl}+\\left[\\mathrm{H}^{+}\\right] \\text {of water } \\\\\n&=\\left(1 \\times 10^{-8}+1 \\times 10^{-7}\\right) \\mathrm{M} \\\\\n&=(1+10) \\times 10^{-8}=11 \\times 10^{-8} \\mathrm{M} \\\\\n\\therefore \\quad \\mathrm{pH} &=-\\log \\left[\\mathrm{H}^{+}\\right] \\\\\n&=-\\log 11 \\times 10^{-8} \\\\\n&=-\\log 11+8 \\log 10 \\\\\n&=-1.0414+8=6.9586\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a2632e0279619d9d8a3cbb", "title": "Salt Hydrolysis", "totalQuestions": 34, "questions": [{"_id": "6abb884115a9fc0fc8c141fb", "type": "singleCorrect", "question": {"text": "Which of the following salts does not undergo hydrolysis?", "image": null}, "options": [{"id": "5Lf3s", "label": "A", "text": "Ammonium chloride .", "isCorrect": false, "image": null}, {"id": "TALP7", "label": "B", "text": "Sodium carbonate .", "isCorrect": false, "image": null}, {"id": "87HhA", "label": "C", "text": "Ammonium cyanide .", "isCorrect": false, "image": null}, {"id": "Zoy6L", "label": "D", "text": "Potassium nitrate .", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Salts formed by the neutralization of a strong acid and a strong base do not undergo hydrolysis because their constituent ions are weak conjugate acids and bases, which do not react with water.<br><br>Ammonium chloride ($NH_4Cl$) is a salt of a weak base ($NH_4OH$) and a strong acid ($HCl$), so it undergoes cationic hydrolysis.<br><br>Sodium carbonate ($Na_2CO_3$) is a salt of a strong base ($NaOH$) and a weak acid ($H_2CO_3$), so it undergoes anionic hydrolysis.<br><br>Ammonium cyanide ($NH_4CN$) is a salt of a weak base ($NH_4OH$) and a weak acid ($HCN$), so it undergoes both cationic and anionic hydrolysis.<br><br>Potassium nitrate ($KNO_3$) is a salt of a strong base ($KOH$) and a strong acid ($HNO_3$). Therefore, it does not undergo hydrolysis.<br><br>Answer: Potassium nitrate .", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887115a9fc0fc8c143bd", "type": "singleCorrect", "question": {"text": "Which of the following salts is made by weak acid and weak base?", "image": null}, "options": [{"id": "WCCRl", "label": "A", "text": "$\\text{CH}_3\\text{COOK}$", "isCorrect": false, "image": null}, {"id": "j11YS", "label": "B", "text": "$\\text{NaNO}_3$", "isCorrect": false, "image": null}, {"id": "59wj4", "label": "C", "text": "$\\text{CH}_3\\text{COONH}_4$", "isCorrect": true, "image": null}, {"id": "bsdKF", "label": "D", "text": "$\\text{NH}_4\\text{Cl}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\text{CH}_3\\text{COOK}$ is a salt of a weak acid ($\\text{CH}_3\\text{COOH}$) and a strong base ($\\text{KOH}$).<br><br>$\\text{NaNO}_3$ is a salt of a strong acid ($\\text{HNO}_3$) and a strong base ($\\text{NaOH}$).<br><br>$\\text{CH}_3\\text{COONH}_4$ is a salt of a weak acid ($\\text{CH}_3\\text{COOH}$) and a weak base ($\\text{NH}_4\\text{OH}$).<br><br>$\\text{NH}_4\\text{Cl}$ is a salt of a strong acid ($\\text{HCl}$) and a weak base ($\\text{NH}_4\\text{OH}$).<br><br>Thus, $\\text{CH}_3\\text{COONH}_4$ is the salt made by a weak acid and a weak base.<br><br>Answer: $\\text{CH}_3\\text{COONH}_4$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ee8c30a4553e1bde55", "type": "singleCorrect", "question": {"text": "Which of the following aqueous salt solutions has the least pH value ?", "image": null}, "options": [{"id": "XES1W", "label": "A", "text": "$\\text{Na}_2\\text{CO}_3$", "isCorrect": false, "image": null}, {"id": "WGBSK", "label": "B", "text": "$\\text{CuCl}_2$", "isCorrect": true, "image": null}, {"id": "DgTFA", "label": "C", "text": "$\\text{CH}_3\\text{COONa}$", "isCorrect": false, "image": null}, {"id": "oGWtL", "label": "D", "text": "$\\text{NaNO}_3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\text{Na}_2\\text{CO}_3$ is a salt of a strong base ($\\text{NaOH}$) and a weak acid ($\\text{H}_2\\text{CO}_3$), so its aqueous solution is basic with $\\text{pH} > 7$.<br><br>$\\text{CuCl}_2$ is a salt of a weak base ($\\text{Cu(OH)}_2$) and a strong acid ($\\text{HCl}$), so its aqueous solution undergoes cationic hydrolysis to give an acidic solution with $\\text{pH} < 7$.<br><br>$\\text{CH}_3\\text{COONa}$ is a salt of a strong base ($\\text{NaOH}$) and a weak acid ($\\text{CH}_3\\text{COOH}$), so its aqueous solution is basic with $\\text{pH} > 7$.<br><br>$\\text{NaNO}_3$ is a salt of a strong base ($\\text{NaOH}$) and a strong acid ($\\text{HNO}_3$), so its aqueous solution is neutral with $\\text{pH} = 7$.<br><br>Therefore, $\\text{CuCl}_2$ has the least pH value.<br><br>Answer: $\\text{CuCl}_2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c58c30a4553e1bdc9a", "type": "singleCorrect", "question": {"text": "Which from following salts does not undergo hydrolysis ?", "image": null}, "options": [{"id": "LCADK", "label": "A", "text": "Ammonium nitrate", "isCorrect": false, "image": null}, {"id": "aAVsP", "label": "B", "text": "Sodium acetate", "isCorrect": false, "image": null}, {"id": "prccP", "label": "C", "text": "Ammonium cyanide", "isCorrect": false, "image": null}, {"id": "6vSKN", "label": "D", "text": "Sodium nitrate", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Salts of strong acids and strong bases do not undergo hydrolysis because their constituent ions do not react with water to produce $H^+$ or $OH^-$ ions.<br><br>Ammonium nitrate is a salt of a weak base ($NH_4OH$) and a strong acid ($HNO_3$), so it undergoes cationic hydrolysis.<br><br>Sodium acetate is a salt of a strong base ($NaOH$) and a weak acid ($CH_3COOH$), so it undergoes anionic hydrolysis.<br><br>Ammonium cyanide is a salt of a weak base ($NH_4OH$) and a weak acid ($HCN$), so it undergoes both cationic and anionic hydrolysis.<br><br>Sodium nitrate is a salt of a strong base ($NaOH$) and a strong acid ($HNO_3$). Therefore, it does not undergo hydrolysis.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d38c30a4553e1bdd3a", "type": "singleCorrect", "question": {"text": "Which of the following salt undergoes anionic hydrolysis ?", "image": null}, "options": [{"id": "Ojx17", "label": "A", "text": "$\\text{CuSO}_4$", "isCorrect": false, "image": null}, {"id": "gScaj", "label": "B", "text": "$\\text{Na}_2\\text{CO}_3$", "isCorrect": true, "image": null}, {"id": "yxq4e", "label": "C", "text": "$\\text{NH}_4\\text{Cl}$", "isCorrect": false, "image": null}, {"id": "d3sQz", "label": "D", "text": "$\\text{FeCl}_3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Anionic hydrolysis occurs in salts formed by the neutralization of a strong base and a weak acid.<br><br>$\\text{CuSO}_4$ is a salt of a weak base ($\\text{Cu(OH)}_2$) and a strong acid ($\\text{H}_2\\text{SO}_4$). It undergoes cationic hydrolysis.<br><br>$\\text{Na}_2\\text{CO}_3$ is a salt of a strong base ($\\text{NaOH}$) and a weak acid ($\\text{H}_2\\text{CO}_3$). The carbonate ion ($\\text{CO}_3^{2-}$) undergoes anionic hydrolysis to produce $\\text{OH}^-$ ions: $\\text{CO}_3^{2-} + \\text{H}_2\\text{O} \\rightleftharpoons \\text{HCO}_3^- + \\text{OH}^-$.<br><br>$\\text{NH}_4\\text{Cl}$ is a salt of a weak base ($\\text{NH}_4\\text{OH}$) and a strong acid ($\\text{HCl}$). It undergoes cationic hydrolysis.<br><br>$\\text{FeCl}_3$ is a salt of a weak base ($\\text{Fe(OH)}_3$) and a strong acid ($\\text{HCl}$). It undergoes cationic hydrolysis.<br><br>Thus, $\\text{Na}_2\\text{CO}_3$ undergoes anionic hydrolysis.<br><br>Answer: $\\text{Na}_2\\text{CO}_3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d38c30a4553e1bdd39", "type": "singleCorrect", "question": {"text": "Identify from the following salts an example of a salt of strong acid and weak base.", "image": null}, "options": [{"id": "a79nh", "label": "A", "text": "Ammonium acetate.", "isCorrect": false, "image": null}, {"id": "L68It", "label": "B", "text": "Sodium acetate.", "isCorrect": false, "image": null}, {"id": "v0yn9", "label": "C", "text": "Copper (II) chloride.", "isCorrect": true, "image": null}, {"id": "6ZOz5", "label": "D", "text": "Sodium carbonate.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Ammonium acetate is a salt of a weak acid (acetic acid) and a weak base (ammonium hydroxide).<br><br>Sodium acetate is a salt of a weak acid (acetic acid) and a strong base (sodium hydroxide).<br><br>Copper (II) chloride is a salt of a strong acid (hydrochloric acid) and a weak base (copper (II) hydroxide).<br><br>Sodium carbonate is a salt of a weak acid (carbonic acid) and a strong base (sodium hydroxide).<br><br>Thus, copper (II) chloride is the correct example of a salt of a strong acid and a weak base.<br><br>Answer: Copper (II) chloride.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b78c30a4553e1bdc0f", "type": "singleCorrect", "question": {"text": "Which of the following aqueous solution of salt have $pH < 7$ at $298$ K?", "image": null}, "options": [{"id": "zJ12o", "label": "A", "text": "$\\text{KNO}_3$", "isCorrect": false, "image": null}, {"id": "fSLQh", "label": "B", "text": "$\\text{Na}_2\\text{CO}_3$", "isCorrect": false, "image": null}, {"id": "YplFn", "label": "C", "text": "$\\text{CH}_3\\text{COONH}_4$", "isCorrect": false, "image": null}, {"id": "X5X6x", "label": "D", "text": "$\\text{CuCl}_2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "$\\text{KNO}_3$ is a salt of a strong acid ($\\text{HNO}_3$) and a strong base ($\\text{KOH}$). Its aqueous solution does not undergo hydrolysis and remains neutral with $\\text{pH} = 7$.<br><br>$\\text{Na}_2\\text{CO}_3$ is a salt of a weak acid ($\\text{H}_2\\text{CO}_3$) and a strong base ($\\text{NaOH}$). It undergoes anionic hydrolysis, making the solution basic with $\\text{pH} > 7$.<br><br>$\\text{CH}_3\\text{COONH}_4$ is a salt of a weak acid ($\\text{CH}_3\\text{COOH}$) and a weak base ($\\text{NH}_4\\text{OH}$). Since $K_a \\approx K_b$, its aqueous solution is almost neutral with $\\text{pH} \\approx 7$.<br><br>$\\text{CuCl}_2$ is a salt of a strong acid ($\\text{HCl}$) and a weak base ($\\text{Cu(OH)}_2$). The $\\text{Cu}^{2+}$ ion undergoes cationic hydrolysis to produce $\\text{H}^+$ ions, making the solution acidic with $\\text{pH} < 7$.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b78c30a4553e1bdc0e", "type": "singleCorrect", "question": {"text": "What happens when solid $\\text{Na}_2\\text{CO}_3$ dissolved in water?", "image": null}, "options": [{"id": "LbZsf", "label": "A", "text": "an increase in $[\\text{OH}^-]$", "isCorrect": true, "image": null}, {"id": "M9Otu", "label": "B", "text": "no change in pH", "isCorrect": false, "image": null}, {"id": "pl2fs", "label": "C", "text": "an increase in $[\\text{H}^+]$ ions", "isCorrect": false, "image": null}, {"id": "rMPwV", "label": "D", "text": "turns blue litmus red.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\text{Na}_2\\text{CO}_3$ is a salt of a strong base ($\\text{NaOH}$) and a weak acid ($\\text{H}_2\\text{CO}_3$).<br><br>When dissolved in water, it dissociates completely into $\\text{Na}^+$ and $\\text{CO}_3^{2-}$ ions.<br><br>The carbonate ion undergoes anionic hydrolysis:<br><br>$\\text{CO}_3^{2-} + \\text{H}_2\\text{O} \\rightleftharpoons \\text{HCO}_3^- + \\text{OH}^-$<br><br>This hydrolysis produces $\\text{OH}^-$ ions, leading to an increase in $[\\text{OH}^-]$ concentration and making the solution basic.<br><br>Answer: an increase in $[\\text{OH}^-]$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b78c30a4553e1bdc0d", "type": "singleCorrect", "question": {"text": "What happens when $\\text{CuSO}_4$ is dissolved in water?<br>Identify correct statements from the following", "image": null}, "options": [{"id": "fsrWu", "label": "A", "text": "Anion of the salt react with water.", "isCorrect": false, "image": null}, {"id": "JCEIY", "label": "B", "text": "Its solution will turn red litmus into blue.", "isCorrect": false, "image": null}, {"id": "f53f8", "label": "C", "text": "The pH of the solution will be less than $7$.", "isCorrect": true, "image": null}, {"id": "ML204", "label": "D", "text": "The $\\text{CuSO}_4$ will not undergo hydrolysis reaction.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\text{CuSO}_4$ is a salt of a weak base ($\\text{Cu(OH)}_2$) and a strong acid ($\\text{H}_2\\text{SO}_4$).<br><br>When dissolved in water, the $\\text{Cu}^{2+}$ cation undergoes hydrolysis to produce $\\text{H}^+$ ions:<br><br>$\\text{Cu}^{2+} + 2\\text{H}_2\\text{O} \\rightleftharpoons \\text{Cu(OH)}_2 + 2\\text{H}^+$<br><br>Due to the generation of $\\text{H}^+$ ions, the solution becomes acidic.<br><br>Therefore, the pH of the solution will be less than $7$.<br><br>The anion $\\text{SO}_4^{2-}$ does not undergo hydrolysis as it is derived from a strong acid.<br><br>An acidic solution turns blue litmus red, not red litmus blue.<br><br>Answer: The pH of the solution will be less than $7$.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdcbf9280d7f9932d19", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following salts turns red litmus blue in its aqueous solution?", "image": null}, "options": [{"id": "ceHcw", "text": "$\\mathrm{CH}_3 \\mathrm{COONa}$", "image": null, "isCorrect": true}, {"id": "gasOX", "text": "$\\mathrm{CuCl}_2$", "image": null, "isCorrect": false}, {"id": "mFz03", "text": "KCl", "image": null, "isCorrect": false}, {"id": "wjeKn", "text": "KCl", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A salt that turns red litmus blue must have a basic aqueous solution.<br><br>A basic solution is formed by the hydrolysis of a salt derived from a weak acid and a strong base.<br><br>$\\mathrm{CH}_3 \\mathrm{COONa}$ is a salt of a weak acid ($\\mathrm{CH}_3 \\mathrm{COOH}$) and a strong base ($\\mathrm{NaOH}$).<br><br>In aqueous solution, the acetate ion undergoes hydrolysis to produce $\\mathrm{OH}^-$ ions:<br><br>$\\mathrm{CH}_3 \\mathrm{COO}^- + \\mathrm{H}_2 \\mathrm{O} \\rightleftharpoons \\mathrm{CH}_3 \\mathrm{COOH} + \\mathrm{OH}^-$<br><br>The resulting solution is basic and turns red litmus blue.<br><br>$\\mathrm{CuCl}_2$ is a salt of a strong acid and a weak base, so its solution is acidic.<br><br>$\\mathrm{KCl}$ is a salt of a strong acid and a strong base, so its solution is neutral.<br><br>Answer: $\\mathrm{CH}_3 \\mathrm{COONa}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcdbf9280d7f9932c8d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following salt turns blue litmus red in its aqueous solution?", "image": null}, "options": [{"id": "g6GwE", "text": "$\\mathrm{CuSO}_4$", "image": null, "isCorrect": true}, {"id": "SlTxK", "text": "$\\mathrm{Na}_2 \\mathrm{CO}_3$", "image": null, "isCorrect": false}, {"id": "mylAx", "text": "$\\mathrm{Na}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": false}, {"id": "2ZLWX", "text": "$\\mathrm{NaNO}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A salt that turns blue litmus red must form an acidic aqueous solution.<br><br>An acidic solution is formed by the hydrolysis of a salt derived from a strong acid and a weak base.<br><br>$\\mathrm{CuSO}_4$ is a salt of a strong acid ($\\mathrm{H}_2\\mathrm{SO}_4$) and a weak base ($\\mathrm{Cu(OH)}_2$). Its aqueous solution undergoes cationic hydrolysis to produce excess $\\mathrm{H}^+$ ions, making the solution acidic.<br><br>$\\mathrm{Na}_2\\mathrm{CO}_3$ is a salt of a strong base ($\\mathrm{NaOH}$) and a weak acid ($\\mathrm{H}_2\\mathrm{CO}_3$), forming a basic solution.<br><br>$\\mathrm{Na}_2\\mathrm{SO}_4$ and $\\mathrm{NaNO}_3$ are salts of strong acids and strong bases, forming neutral solutions.<br><br>Thus, $\\mathrm{CuSO}_4$ turns blue litmus red.<br><br>Answer: $\\mathrm{CuSO}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb9bf9280d7f9932be2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following salts forms basic solution when dissolved in water?", "image": null}, "options": [{"id": "iaLJI", "text": "$\\mathrm{NaNO}_3$", "image": null, "isCorrect": false}, {"id": "YUCuI", "text": "$\\mathrm{CH}_3 \\mathrm{COONH}_4$", "image": null, "isCorrect": false}, {"id": "Lh1FN", "text": "KCN", "image": null, "isCorrect": true}, {"id": "7dACM", "text": "$\\mathrm{NH}_4 \\mathrm{~F}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{NaNO}_3$ is a salt of a strong acid ($\\mathrm{HNO}_3$) and a strong base ($\\mathrm{NaOH}$). Its aqueous solution is neutral.<br><br>$\\mathrm{CH}_3 \\mathrm{COONH}_4$ is a salt of a weak acid ($\\mathrm{CH}_3 \\mathrm{COOH}$) and a weak base ($\\mathrm{NH}_4 \\mathrm{OH}$). Since $K_a \\approx K_b$, its aqueous solution is nearly neutral.<br><br>KCN is a salt of a weak acid (HCN) and a strong base (KOH). The cyanide ion undergoes anionic hydrolysis to produce $\\mathrm{OH}^-$ ions, making the solution basic.<br><br>$\\mathrm{NH}_4 \\mathrm{F}$ is a salt of a weak base ($\\mathrm{NH}_4 \\mathrm{OH}$) and a weak acid (HF). Since $K_a > K_b$, its aqueous solution is slightly acidic.<br><br>Answer: KCN", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba8bf9280d7f9932b4c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following salts turns blue litmus red in its aqueous solution?", "image": null}, "options": [{"id": "ido4G", "text": "KCN", "image": null, "isCorrect": false}, {"id": "t0QMl", "text": "$\\mathrm{Na}_2 \\mathrm{CO}_3$", "image": null, "isCorrect": false}, {"id": "HYj4L", "text": "$\\mathrm{NaNO}_3$", "image": null, "isCorrect": false}, {"id": "j5qXC", "text": "$\\mathrm{CuCl}_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "A salt that turns blue litmus red must form an acidic aqueous solution.<br><br>An acidic solution is formed by the hydrolysis of a salt derived from a strong acid and a weak base.<br><br>$\\mathrm{KCN}$ is a salt of a strong base ($\\mathrm{KOH}$) and a weak acid ($\\mathrm{HCN}$), so its solution is basic.<br><br>$\\mathrm{Na}_2\\mathrm{CO}_3$ is a salt of a strong base ($\\mathrm{NaOH}$) and a weak acid ($\\mathrm{H}_2\\mathrm{CO}_3$), so its solution is basic.<br><br>$\\mathrm{NaNO}_3$ is a salt of a strong base ($\\mathrm{NaOH}$) and a strong acid ($\\mathrm{HNO}_3$), so its solution is neutral.<br><br>$\\mathrm{CuCl}_2$ is a salt of a weak base ($\\mathrm{Cu(OH)}_2$) and a strong acid ($\\mathrm{HCl}$), so its solution is acidic and turns blue litmus red.<br><br>Answer: $\\mathrm{CuCl}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9abf9280d7f9932ac7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following salts forms basic solution when dissolved in water?", "image": null}, "options": [{"id": "dX8oi", "text": "$\\mathrm{NH}_4 \\mathrm{NO}_3$", "image": null, "isCorrect": false}, {"id": "oSO48", "text": "$\\mathrm{Na}_2 \\mathrm{CO}_3$", "image": null, "isCorrect": true}, {"id": "yxW56", "text": "$\\mathrm{NaNO}_3$", "image": null, "isCorrect": false}, {"id": "wKxfH", "text": "$\\mathrm{CuSO}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A salt of a strong base and a weak acid undergoes anionic hydrolysis to form a basic solution.<br><br>$\\mathrm{NH}_4 \\mathrm{NO}_3$ is a salt of a weak base ($\\mathrm{NH}_4\\mathrm{OH}$) and a strong acid ($\\mathrm{HNO}_3$), so its solution is acidic.<br><br>$\\mathrm{Na}_2 \\mathrm{CO}_3$ is a salt of a strong base ($\\mathrm{NaOH}$) and a weak acid ($\\mathrm{H}_2\\mathrm{CO}_3$), so its solution is basic.<br><br>$\\mathrm{NaNO}_3$ is a salt of a strong base ($\\mathrm{NaOH}$) and a strong acid ($\\mathrm{HNO}_3$), so its solution is neutral.<br><br>$\\mathrm{CuSO}_4$ is a salt of a weak base ($\\mathrm{Cu(OH)}_2$) and a strong acid ($\\mathrm{H}_2\\mathrm{SO}_4$), so its solution is acidic.<br><br>Answer: $\\mathrm{Na}_2 \\mathrm{CO}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b88bf9280d7f9932a20", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following salts forms basic solution in water?", "image": null}, "options": [{"id": "wtMjA", "text": "$\\mathrm{NH}_4 \\mathrm{NO}_3$", "image": null, "isCorrect": false}, {"id": "kpBfE", "text": "$\\mathrm{Na}_2 \\mathrm{CO}_3$", "image": null, "isCorrect": true}, {"id": "AJIyO", "text": "$\\mathrm{NH}_4 \\mathrm{Cl}$", "image": null, "isCorrect": false}, {"id": "iHSYY", "text": "$\\mathrm{Na}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{NH}_4 \\mathrm{NO}_3$ is a salt of a strong acid ($\\mathrm{HNO}_3$) and a weak base ($\\mathrm{NH}_4\\mathrm{OH}$). Its aqueous solution is acidic.<br><br>$\\mathrm{Na}_2 \\mathrm{CO}_3$ is a salt of a weak acid ($\\mathrm{H}_2\\mathrm{CO}_3$) and a strong base ($\\mathrm{NaOH}$). Its aqueous solution is basic due to anionic hydrolysis.<br><br>$\\mathrm{NH}_4 \\mathrm{Cl}$ is a salt of a strong acid ($\\mathrm{HCl}$) and a weak base ($\\mathrm{NH}_4\\mathrm{OH}$). Its aqueous solution is acidic.<br><br>$\\mathrm{Na}_2 \\mathrm{SO}_4$ is a salt of a strong acid ($\\mathrm{H}_2\\mathrm{SO}_4$) and a strong base ($\\mathrm{NaOH}$). Its aqueous solution is neutral.<br><br>Answer: $\\mathrm{Na}_2 \\mathrm{CO}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b38bf9280d7f993273b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following salts turns red litmus blue in its aqueous solution?", "image": null}, "options": [{"id": "OD7Bl", "text": "KCN", "image": null, "isCorrect": true}, {"id": "jXvjK", "text": "$\\mathrm{NaNO}_3$", "image": null, "isCorrect": false}, {"id": "xGLBG", "text": "NaCl", "image": null, "isCorrect": false}, {"id": "fwKgH", "text": "KCl", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A salt that turns red litmus blue must have a basic aqueous solution. This occurs when the salt is formed from a strong base and a weak acid.<br><br>KCN is a salt of a strong base (KOH) and a weak acid (HCN). In aqueous solution, the cyanide ion undergoes hydrolysis to produce $OH^{-}$ ions, making the solution basic.<br><br>$\\mathrm{NaNO}_3$, NaCl, and KCl are salts of strong acids and strong bases. Their aqueous solutions are neutral and do not affect litmus paper.<br><br>Thus, KCN turns red litmus blue.<br><br>Answer: KCN", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b03bf9280d7f99325a0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following salts is NOT hydrolysed in water?", "image": null}, "options": [{"id": "VKFkf", "text": "$\\mathrm{Na}_2 \\mathrm{CO}_3$", "image": null, "isCorrect": false}, {"id": "HH8Q3", "text": "$\\mathrm{NH}_4 \\mathrm{CN}$", "image": null, "isCorrect": false}, {"id": "YviVj", "text": "$\\mathrm{KNO}_3$", "image": null, "isCorrect": true}, {"id": "M9ggJ", "text": "KCN", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Salts of strong acids and strong bases do not undergo hydrolysis in water because their constituent ions are weak conjugate acids and bases, which do not react with water to produce $H^+$ or $OH^-$ ions.<br><br>$\\mathrm{Na}_2 \\mathrm{CO}_3$ is a salt of a strong base ($\\mathrm{NaOH}$) and a weak acid ($\\mathrm{H}_2\\mathrm{CO}_3$), so it undergoes anionic hydrolysis.<br><br>$\\mathrm{NH}_4 \\mathrm{CN}$ is a salt of a weak base ($\\mathrm{NH}_4\\mathrm{OH}$) and a weak acid ($\\mathrm{HCN}$), so it undergoes both cationic and anionic hydrolysis.<br><br>$\\mathrm{KNO}_3$ is a salt of a strong base ($\\mathrm{KOH}$) and a strong acid ($\\mathrm{HNO}_3$), so it does not undergo hydrolysis.<br><br>$\\mathrm{KCN}$ is a salt of a strong base ($\\mathrm{KOH}$) and a weak acid ($\\mathrm{HCN}$), so it undergoes anionic hydrolysis.<br><br>Answer: $\\mathrm{KNO}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213880aee93fa0796d983", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Which from following salts is NOT derived from weak acid and weak base?", "image": null}, "options": [{"id": "nn2d5", "text": "Ammonium fluoride", "image": null, "isCorrect": false}, {"id": "lkck1", "text": "Ammonium cyanide", "image": null, "isCorrect": false}, {"id": "GgIGL", "text": "Ammonium acetate", "image": null, "isCorrect": false}, {"id": "DOe5Q", "text": "Ammonium chloride", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Ammonium fluoride ($NH_4F$) is a salt of ammonium hydroxide ($NH_4OH$), a weak base, and hydrofluoric acid ($HF$), a weak acid.<br><br>Ammonium cyanide ($NH_4CN$) is a salt of ammonium hydroxide ($NH_4OH$), a weak base, and hydrocyanic acid ($HCN$), a weak acid.<br><br>Ammonium acetate ($CH_3COONH_4$) is a salt of ammonium hydroxide ($NH_4OH$), a weak base, and acetic acid ($CH_3COOH$), a weak acid.<br><br>Ammonium chloride ($NH_4Cl$) is a salt of ammonium hydroxide ($NH_4OH$), a weak base, and hydrochloric acid ($HCl$), a strong acid.<br><br>Therefore, ammonium chloride is not derived from a weak acid and a weak base.<br><br>Answer: Ammonium chloride", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262580279619d9d8a33c5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Which among the following salt solution in water is acidic in nature?", "image": null}, "options": [{"id": "QoCe0", "text": "$\\mathrm{CuCl}_2$", "image": null, "isCorrect": true}, {"id": "fwfgV", "text": "$\\mathrm{NH}_4 \\mathrm{CN}$", "image": null, "isCorrect": false}, {"id": "Gk2nV", "text": "$\\mathrm{KCN}$", "image": null, "isCorrect": false}, {"id": "u5ExC", "text": "$\\mathrm{CH}_3 \\mathrm{COONa}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(1) $\\mathrm{CuCl}_2$ : Salt of strong acid and weak base: Solution is acidic.\n(2) $\\mathrm{NH}_4 \\mathrm{CN}$ : Salt of weak acid and weak base for which $\\mathrm{K}_{\\mathrm{a}} < \\mathrm{K}_{\\mathrm{b}}$ : Solution is basic.\n(3) $\\mathrm{KCN}$ : Salt of weak acid and strong base: Solution is basic.\n(4) $\\mathrm{CH}_3 \\mathrm{COUNa}$ : Salt of weak acid and strong base: Solution is basic.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262380279619d9d8a32c2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Which among the following is NOT an example of salt of strong acid and weak base?", "image": null}, "options": [{"id": "W4lhL", "text": "$\\mathrm{NH}_4 \\mathrm{Cl}$", "image": null, "isCorrect": false}, {"id": "aynEj", "text": "$\\mathrm{NH}_4 \\mathrm{NO}_3$", "image": null, "isCorrect": false}, {"id": "ImdUb", "text": "$\\mathrm{CuSO}_4$", "image": null, "isCorrect": false}, {"id": "gUQEd", "text": "$\\mathrm{Na}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{Na}_2 \\mathrm{SO}_4$ is a salt of strong base $(\\mathrm{NaOH})$ and strong acid $\\left(\\mathrm{H}_2 \\mathrm{SO}_4\\right)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620e0279619d9d8a3171", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "Identify the salt that undergoes hydrolysis and forms acidic solution from following.", "image": null}, "options": [{"id": "aynAB", "text": "$\\mathrm{Na}_2 \\mathrm{CO}_3$", "image": null, "isCorrect": false}, {"id": "L0T2k", "text": "$\\mathrm{NH}_4 \\mathrm{NO}_3$", "image": null, "isCorrect": true}, {"id": "46AiY", "text": "$\\mathrm{NH}_4 \\mathrm{CN}$", "image": null, "isCorrect": false}, {"id": "SMSld", "text": "$\\mathrm{KCN}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A) $\\mathrm{Na}_2 \\mathrm{CO}_3$ : Salt of weak acid and strong base: Solution is basic.\n(B) $\\mathrm{NH}_4 \\mathrm{NO}_3:$ Salt of strong acid and weak base: Solution is acidic.\n(C) $\\mathrm{NH}_4 \\mathrm{CN}$; Salt of weak acid and weak base for which $\\mathrm{K}_{\\mathrm{a}} < \\mathrm{K}_{\\mathrm{b}}$ : Solution is basic.\n(D) $\\mathrm{KCN}_t$. Salt of weak acid and strong base: Solution is basic.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05- t is a salt of strong acid and weak base.", "image": null, "isCorrect": true}, {"id": "Mlczk", "text": "It is a salt of weak acid and weak base.", "image": null, "isCorrect": false}, {"id": "fpjQz", "text": "It is salt of strong acid and strong base.", "image": null, "isCorrect": false}, {"id": "TTWP7", "text": "It is a salt of weak acid and strong base.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{CuSO}_4$ is a salt of $\\mathrm{Cu}(\\mathrm{OH})_2(\\mathrm{WB})$ and $\\mathrm{H}_2 \\mathrm{SO}_4(\\mathrm{SA})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261530279619d9d8a2ba7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "Which among the following is an example of salt of weak acid and strong base?", "image": null}, "options": [{"id": "NLyfs", "text": "$\\mathrm{Na}_2 \\mathrm{So}_4$", "image": null, "isCorrect": false}, {"id": "tgj96", "text": "$\\mathrm{NH}_4 \\mathrm{CN}$", "image": null, "isCorrect": false}, {"id": "ZKzvl", "text": "KCN", "image": null, "isCorrect": true}, {"id": "68o3d", "text": "KCl", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{KCN}$ is a salt of $\\mathrm{KOH}(\\mathrm{SB})$ and $\\mathrm{HCN}$ (WA)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261300279619d9d8a2a88", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "which among the following salts is formed of strong base and weak acid?", "image": null}, "options": [{"id": "Kduos", "text": "$\\mathrm{CuSO}_4$", "image": null, "isCorrect": false}, {"id": "mAK73", "text": "$\\mathrm{NaNO}_3$", "image": null, "isCorrect": false}, {"id": "NR8xe", "text": "$\\mathrm{NaCl}$", "image": null, "isCorrect": false}, {"id": "4ecNH", "text": "KCN", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/CsMb9aMEvGRMK3I_gNz3croldAkNeiac-hrNzHhNPIc.original.fullsize.png\">\nThis salt is made of $\\mathrm{KOH}(\\mathrm{SB})$ and $\\mathrm{HCN}\\left(\\mathrm{W}_{\\mathrm{A}}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2611b0279619d9d8a29dd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "Identify weak acid weak base salt from following.", "image": null}, "options": [{"id": "hbMUA", "text": "Potassium bromide", "image": null, "isCorrect": false}, {"id": "OEEvb", "text": "Ammonium sulphate", "image": null, "isCorrect": false}, {"id": "XQFqn", "text": "Ammonium acetate", "image": null, "isCorrect": true}, {"id": "MPOXC", "text": "Ammonium chloride", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{CH}_3 \\mathrm{COONH}_4$ is a salt of $\\mathrm{CH}_3 \\mathrm{COOH}(\\mathrm{WA})$ and $\\mathrm{NH}_4 \\mathrm{OH}(\\mathrm{WB})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c00279619d9d8a2703", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "Which among the following salts undergoes hydrolysis?", "image": null}, "options": [{"id": "datHK", "text": "$\\mathrm{Na}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": false}, {"id": "4G7vi", "text": "$\\mathrm{KCl}$", "image": null, "isCorrect": false}, {"id": "AButV", "text": "$\\mathrm{NH}_4 \\mathrm{Cl}$", "image": null, "isCorrect": true}, {"id": "aGLBk", "text": "$\\mathrm{KNO}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "- Salt which is obtained from any weak acid or weak base undergoes hydrolysis.\n$$\n\\begin{aligned}\n& \\mathrm{NH}_4 \\mathrm{Cl} \\rightarrow \\text { Salt of } \\mathrm{SA}(\\mathrm{HCl})+\\mathrm{WB}\\left(\\mathrm{NH}_4 \\mathrm{OH}\\right) \\\\\n& \\mathrm{Na}_2 \\mathrm{SO}_4 \\rightarrow \\text { Salt of } \\mathrm{SA}\\left(\\mathrm{H}_2 \\mathrm{SO}_4\\right)+\\mathrm{SB}(\\mathrm{NaOH}) \\\\\n& \\mathrm{KCl} \\rightarrow \\text { Salt of } \\mathrm{SA}(\\mathrm{HCl})+\\mathrm{SB}(\\mathrm{KOH}) \\\\\n& \\mathrm{KNO}_3 \\rightarrow \\text { Salt of } \\mathrm{SA}(\\mathrm{HNO})+\\mathrm{SB}(\\mathrm{KOH})\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260aa0279619d9d8a2657", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "Which among the following salt solution in water shows $\\mathrm{pH}$ less than 7 ?", "image": null}, "options": [{"id": "MOtmF", "text": "$\\mathrm{CuCl}_2$", "image": null, "isCorrect": true}, {"id": "Ylk8Z", "text": "$\\mathrm{CH}_3 \\mathrm{COONH}_4$", "image": null, "isCorrect": false}, {"id": "C0G83", "text": "$\\mathrm{Na}_2 \\mathrm{CO}_3$", "image": null, "isCorrect": false}, {"id": "uq6cH", "text": "$\\mathrm{KNO}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{CuCl}_2 \\rightarrow \\text { Salt of } \\mathrm{SA}+\\mathrm{WB}\\left(\\text { Acidic } \\mathrm{P}^{\\mathrm{H}} < 7\\right) \\\\ & \\mathrm{CH}_3 \\mathrm{COONH}_4 \\rightarrow \\text { Salt of WA }+\\mathrm{WB}\\left(\\text { Neutral } \\mathrm{P}^{\\mathrm{H}}=7\\right) \\\\ & \\mathrm{Na}_2 \\mathrm{CO}_3 \\rightarrow \\text { salt of WA }+\\mathrm{SB}\\left(\\text { Basic } \\mathrm{P}^{\\mathrm{H}}>7\\right) \\\\ & \\mathrm{KNO}_3 \\rightarrow \\text { Salt of SA }+\\mathrm{SB}\\left(\\text { Neutral } \\mathrm{P}^{\\mathrm{H}}=7\\right)\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260750279619d9d8a24ab", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "Which of the following salt solutions is highly acidic?", "image": null}, "options": [{"id": "FSmKE", "text": "Ammonium acetate", "image": null, "isCorrect": false}, {"id": "hOhgs", "text": "Ammonium cynide", "image": null, "isCorrect": false}, {"id": "jcroy", "text": "Sodium chloride", "image": null, "isCorrect": false}, {"id": "KvMEG", "text": "sec-Butyl alcohol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Ammonium acetate $\\rightarrow$ Neutral\nAmmonium cynide $\\rightarrow$ Basic\nSodium chloride $\\rightarrow$ Neutral\nSec-Butyl alcohol $\\rightarrow$ Acidic", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260630279619d9d8a2412", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "Which among the following salt solution in water shows $\\mathrm{pH}$ greater than 7 ?", "image": null}, "options": [{"id": "uBzGa", "text": "Sodium acetate", "image": null, "isCorrect": true}, {"id": "l2HkG", "text": "Sodium sulphate", "image": null, "isCorrect": false}, {"id": "fymwm", "text": "Copper sulphate", "image": null, "isCorrect": false}, {"id": "h2mvw", "text": "Ammonium chloride", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Sodium acetate $\\rightarrow$ Salt of WA $+\\mathrm{SB}$ (Basic)\nSodium sulphate $\\rightarrow$ Salt of SA + SB (Neutral)\nCopper sulphate $\\rightarrow$ Salt of SA + WB (Acidic)\nAmmonium chloride $\\rightarrow$ Salt of SA + WB (Acidic)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8a0279619d9d8a1547", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "Which of the following salts will not undergo hydrolysis?", "image": null}, "options": [{"id": "a6nZ3", "text": "$\\mathrm{NH}_{4} \\mathrm{Cl}$", "image": null, "isCorrect": false}, {"id": "rrwHb", "text": "KCN", "image": null, "isCorrect": false}, {"id": "WVm41", "text": "$\\mathrm{KNO}_{3}$", "image": null, "isCorrect": true}, {"id": "DQbwC", "text": "$\\mathrm{Na}_{2} \\mathrm{CO}_{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Potassium nitrate $\\left(\\mathrm{KNO}_{3}\\right)$ is a salt of strong base and strong acid and hence, will not undergo\nhydrolysis.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7e0279619d9d8a14df", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "$\\mathrm{NH}_{4} \\mathrm{Cl}$ is acidic due to", "image": null}, "options": [{"id": "HWy4o", "text": "cationic hydrolysis", "image": null, "isCorrect": true}, {"id": "DQ0cL", "text": "anionic hydrolysis", "image": null, "isCorrect": false}, {"id": "YGOoB", "text": "its ionic nature", "image": null, "isCorrect": false}, {"id": "CiOdb", "text": "$\\mathrm{pH}>7$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{NH}_{4} \\mathrm{Cl}+\\mathrm{H}_{2} \\mathrm{O} \\longrightarrow \\mathrm{NH}_{4} \\mathrm{OH}+\\mathrm{HCl}$\nOr\n$$\n\\begin{array}{l}\n\\mathrm{NH}_{4}^{+}+\\mathrm{Cl}^{-}+\\mathrm{H}_{2} \\mathrm{O} \\longrightarrow \\mathrm{NH}_{4} \\mathrm{OH}+\\mathrm{H}^{+}+\\mathrm{Cl}^{-} \\\\\n\\text {or } \\quad \\mathrm{NH}_{4}^{+}+\\mathrm{H}_{2} \\mathrm{O} \\longrightarrow \\mathrm{NH}_{4} \\mathrm{OH}+\\mathrm{H}^{+}\n\\end{array}\n$$\ncation\nDue to the presence of $\\mathrm{H}^{+}$, after cationic hydrolysis, in the solution, the solution of $\\mathrm{NH}_{4} \\mathrm{Cl}$ is acidic.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7a0279619d9d8a14bd", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "Ammonium acetate which is $0.01 \\quad \\mathrm{M}$, is hydrolysed to $0.001 \\mathrm{M}$ concentration. Calculate the change in $\\mathrm{pH}$ in $0.001 \\mathrm{M}$ solution, if initially $\\mathrm{pH}=\\mathrm{pK}_{a}$", "image": null}, "options": [{"id": "ZkZdf", "text": "5", "image": null, "isCorrect": false}, {"id": "BRHr8", "text": "10", "image": null, "isCorrect": false}, {"id": "xNba6", "text": "100", "image": null, "isCorrect": false}, {"id": "A0Fbr", "text": "1", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{array}{c}\\mathrm{CH}_{3} \\mathrm{COONH}_{4}+\\mathrm{H}_{2} \\mathrm{O} \\longrightarrow \\mathrm{CH}_{3} \\mathrm{COOH}+\\mathrm{NH}_{4} \\mathrm{OH} \\\\ 0.01 \\mathrm{M} & 0.001 \\mathrm{M} \\\\ \\mathrm{pH}=\\mathrm{p} K_{a}+\\log \\frac{\\left[\\mathrm{CH}_{3} \\mathrm{COONH}_{4}\\right]}{\\left[\\mathrm{CH}_{3} \\mathrm{COOH}\\right]} \\\\ =\\mathrm{p} K_{a}+\\log \\left[\\frac{0.01}{0.001}\\right] \\\\ =\\mathrm{p} K_{a}+\\log 10 \\\\ =\\mathrm{p} K_{a}+1 \\\\ \\therefore \\text { Change in } \\mathrm{pH}=1\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e420279619d9d8a12fc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The hydrolysis of sodium carbonate involves the reaction between", "image": null}, "options": [{"id": "1h8yL", "text": "sodium ion and water", "image": null, "isCorrect": false}, {"id": "XfMPA", "text": "$\\mathrm{Na}^{+}$ and $\\mathrm{OH}^{-}$", "image": null, "isCorrect": false}, {"id": "9Mptt", "text": "$\\mathrm{CO}_{3}^{2-}$ and water", "image": null, "isCorrect": true}, {"id": "Yftek", "text": "$\\mathrm{CO}_{3}^{2-}$ and $\\mathrm{H}^{+}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{Na}_{2} \\mathrm{CO}_{3}+2 \\mathrm{H}_{2} \\mathrm{O} & \\rightleftharpoons 2 \\mathrm{NaOH}+\\mathrm{H}_{2} \\mathrm{CO}_{3} \\\\ & \\text { or } 2 \\mathrm{Na}^{+}+\\mathrm{CO}_{3}^{2-}+2 \\mathrm{H}_{2} \\mathrm{O} \\\\ & \\rightleftharpoons 2 \\mathrm{Na}^{+}+2 \\mathrm{OH}^{-}+\\mathrm{H}_{2} \\mathrm{CO}_{3} \\\\ & \\text { or } \\mathrm{CO}_{3}^{2-}+2 \\mathrm{H}_{2} \\mathrm{O} \\rightleftharpoons 2 \\mathrm{OH}^{-}+\\mathrm{H}_{2} \\mathrm{CO}_{3} \\end{aligned}$\nIt is anionic hydrolysis.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a2632e0279619d9d8a3cbd", "title": "Buffer solutions", "totalQuestions": 26, "questions": [{"_id": "6abb88d115a9fc0fc8c14741", "type": "singleCorrect", "question": {"text": "Which from following buffers is used as highly effective stabilizer in the preparation of penicillin?", "image": null}, "options": [{"id": "f5ktZ", "label": "A", "text": "Ammonium hydroxide and ammonium chloride", "isCorrect": false, "image": null}, {"id": "osycp", "label": "B", "text": "Acetic acid and sodium acetate", "isCorrect": false, "image": null}, {"id": "RN8Js", "label": "C", "text": "Formic acid and sodium acetate", "isCorrect": false, "image": null}, {"id": "AYCRq", "label": "D", "text": "Citric acid and sodium citrate", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Various buffer solutions are used in the pharmaceutical industry to maintain the pH and stability of drug preparations.<br><br>A mixture of citric acid and sodium citrate forms an acidic buffer.<br><br>This specific buffer is used as a highly effective stabilizer in the preparation of penicillin.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b115a9fc0fc8c14616", "type": "singleCorrect", "question": {"text": "Calculate the pH of buffer solution containing $0.02$ M weak acid and $0.04$ M its salt with a strong base.<br>[$K_a = 7.2 \\times 10^{-4}$]", "image": null}, "options": [{"id": "6yplX", "label": "A", "text": "$3.14$", "isCorrect": false, "image": null}, {"id": "FA8yF", "label": "B", "text": "$3.44$", "isCorrect": true, "image": null}, {"id": "8jhQg", "label": "C", "text": "$3.76$", "isCorrect": false, "image": null}, {"id": "qXGQ2", "label": "D", "text": "$3.96$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the Henderson-Hasselbalch equation for an acidic buffer:<br><br>$pH = pK_a + \\log \\left( \\dfrac{[\\text{Salt}]}{[\\text{Acid}]} \\right)$<br><br>Given values are:<br>$[\\text{Acid}] = 0.02$ M<br>$[\\text{Salt}] = 0.04$ M<br>$K_a = 7.2 \\times 10^{-4}$<br><br>First, calculate the $pK_a$ of the weak acid:<br>$pK_a = -\\log(K_a) = -\\log(7.2 \\times 10^{-4})$<br>$pK_a = 4 - \\log(7.2)$<br>$pK_a = 4 - 0.857 = 3.143$<br><br>Now, substitute the values into the Henderson-Hasselbalch equation:<br>$pH = 3.143 + \\log \\left( \\dfrac{0.04}{0.02} \\right)$<br>$pH = 3.143 + \\log(2)$<br>$pH = 3.143 + 0.301 = 3.444$<br><br>Rounding to two decimal places, we get $pH = 3.44$.<br><br>Answer: $3.44$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889115a9fc0fc8c144eb", "type": "singleCorrect", "question": {"text": "One litre of a buffer solution containing $0.01$ M $\\text{NH}_4\\text{Cl}$ and $0.1$ M $\\text{NH}_4\\text{OH}$ has $pK_b$ value of $5$. Find the pH.", "image": null}, "options": [{"id": "4wglG", "label": "A", "text": "$9$", "isCorrect": false, "image": null}, {"id": "GVTgn", "label": "B", "text": "$10$", "isCorrect": true, "image": null}, {"id": "hj5xg", "label": "C", "text": "$4$", "isCorrect": false, "image": null}, {"id": "NiWYK", "label": "D", "text": "$6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using Henderson-Hasselbalch equation for a basic buffer:<br><br>$pOH = pK_b + \\log \\left( \\dfrac{[\\text{Salt}]}{[\\text{Base}]} \\right)$<br><br>Given $[\\text{Salt}] = [\\text{NH}_4\\text{Cl}] = 0.01$ M, $[\\text{Base}] = [\\text{NH}_4\\text{OH}] = 0.1$ M, and $pK_b = 5$.<br><br>Substituting the values:<br><br>$pOH = 5 + \\log \\left( \\dfrac{0.01}{0.1} \\right)$<br><br>$pOH = 5 + \\log (10^{-1})$<br><br>$pOH = 5 - 1 = 4$<br><br>The pH of the solution is given by:<br><br>$pH = 14 - pOH$<br><br>$pH = 14 - 4 = 10$<br><br>Answer: $10$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a98c30a4553e1bdb78", "type": "singleCorrect", "question": {"text": "Calculate the pH of buffer solution containing 0.1M $\\text{CH}_3\\text{COOH}$ and 0.1 M $\\text{CH}_3\\text{COONa}$ $[K_a = 1.8 \\times 10^{-5}]$", "image": null}, "options": [{"id": "XeIPM", "label": "A", "text": "$4.745$", "isC
