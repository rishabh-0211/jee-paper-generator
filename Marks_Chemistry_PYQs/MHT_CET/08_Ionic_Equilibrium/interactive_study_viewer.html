orrect": true, "image": null}, {"id": "4r3tQ", "label": "B", "text": "$5.741$", "isCorrect": false, "image": null}, {"id": "WofUT", "label": "C", "text": "$2.876$", "isCorrect": false, "image": null}, {"id": "A90RQ", "label": "D", "text": "$7.001$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the Henderson-Hasselbalch equation for an acidic buffer:<br><br>$\\text{pH} = \\text{p}K_a + \\log \\left( \\dfrac{[\\text{Salt}]}{[\\text{Acid}]} \\right)$<br><br>Given $[\\text{Salt}] = 0.1 \\text{ M}$ and $[\\text{Acid}] = 0.1 \\text{ M}$<br><br>$\\text{pH} = -\\log(1.8 \\times 10^{-5}) + \\log \\left( \\dfrac{0.1}{0.1} \\right)$<br><br>$\\text{pH} = 5 - \\log(1.8) + \\log(1)$<br><br>$\\text{pH} = 5 - 0.255 + 0 = 4.745$<br><br>Answer: $4.745$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29b8c30a4553e1bdae3", "type": "singleCorrect", "question": {"text": "Match <strong>List I</strong> with <strong>List II</strong><br><table style=\"border: 1px solid black; border-collapse: collapse; width: auto;\"><tr><th style=\"border: 1px solid black; padding: 10px;\">List I<br>(Buffers)</th><th style=\"border: 1px solid black; padding: 10px;\">List II<br>(Applications)</th></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(A) $\\text{HCO}_3^{-1} + \\text{H}_2\\text{CO}_3$</td><td style=\"border: 1px solid black; padding: 10px;\">(I) Maintain the pH of blood forms $7.36$ to $7.42$</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(B) Phosphates</td><td style=\"border: 1px solid black; padding: 10px;\">(II) In Medicine</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(C) Sodium Citrate</td><td style=\"border: 1px solid black; padding: 10px;\">(III) In Qualitative analysis of basic radicals</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(D) $\\text{NH}_4\\text{Cl} + \\text{NH}_4\\text{OH}$</td><td style=\"border: 1px solid black; padding: 10px;\">(IV) In fertilizers</td></tr></table><br>Choose the <strong>correct</strong> answer from the options given below:", "image": null}, "options": [{"id": "dNzzA", "label": "A", "text": "(A) - (I), (B) - (II), (C) - (III), (D) - (IV)", "isCorrect": false, "image": null}, {"id": "77hkh", "label": "B", "text": "(A) - (II), (B) - (IV), (C) - (I), (D) - (III)", "isCorrect": false, "image": null}, {"id": "t3oEQ", "label": "C", "text": "(A) - (I), (B) - (IV), (C) - (II), (D) - (III)", "isCorrect": true, "image": null}, {"id": "mzXMi", "label": "D", "text": "(A) - (III), (B) - (IV), (C) - (I), (D) - (II)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "(A) $\\text{HCO}_3^{-} + \\text{H}_2\\text{CO}_3$ is the bicarbonate buffer system which is responsible for maintaining the pH of human blood between $7.36$ and $7.42$.<br><br>(B) Phosphates are extensively used in the agricultural industry for the manufacturing of fertilizers.<br><br>(C) Sodium citrate is widely used in medicine, commonly acting as an anticoagulant for blood storage and transfusions.<br><br>(D) $\\text{NH}_4\\text{Cl} + \\text{NH}_4\\text{OH}$ is a basic buffer used in the qualitative analysis of Group III basic radicals to maintain the required pH for the precipitation of their hydroxides.<br><br>Thus, the correct matching is (A) - (I), (B) - (IV), (C) - (II), (D) - (III).<br><br>Answer: (A) - (I), (B) - (IV), (C) - (II), (D) - (III)", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29b8c30a4553e1bdae2", "type": "singleCorrect", "question": {"text": "Find the pH of a solution formed by mixing equal volume of solution of $0.1$ M sodium propionate and $0.1$ molar propionic acid.<br>(Given The dissociation constant of propionic acid is $1.3 \\times 10^{-5}$)", "image": null}, "options": [{"id": "xH45f", "label": "A", "text": "$2.45$", "isCorrect": false, "image": null}, {"id": "rThcD", "label": "B", "text": "$4.89$", "isCorrect": true, "image": null}, {"id": "EgRl6", "label": "C", "text": "$5.98$", "isCorrect": false, "image": null}, {"id": "VEFEI", "label": "D", "text": "$6.89$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The mixture of propionic acid and sodium propionate forms an acidic buffer.<br><br>Using the Henderson-Hasselbalch equation:<br><br>$\\text{pH} = \\text{p}K_a + \\log \\left( \\dfrac{[\\text{Salt}]}{[\\text{Acid}]} \\right)$<br><br>Since equal volumes of $0.1$ M solutions are mixed, the concentrations of the salt and the acid in the final mixture are equal.<br><br>$\\text{pH} = \\text{p}K_a + \\log(1)$<br><br>$\\text{pH} = \\text{p}K_a = -\\log(K_a)$<br><br>$\\text{pH} = -\\log(1.3 \\times 10^{-5})$<br><br>$\\text{pH} = 5 - \\log(1.3)$<br><br>$\\text{pH} = 5 - 0.1139 = 4.8861 \\approx 4.89$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bffbf9280d7f9932e57", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Find the concentration of sodium acetate when added to 0.1 M solution of acetic acid to form a buffer solution of $\\mathrm{pH}=5.5$ ?\n$\\left(\\mathrm{pK}_{\\mathrm{a}} \\text { of } \\mathrm{CH}_3 \\mathrm{COOH}=4.5\\right)$", "image": null}, "options": [{"id": "muBs7", "text": "0.1 M", "image": null, "isCorrect": false}, {"id": "Q6Dit", "text": "0.01 M", "image": null, "isCorrect": false}, {"id": "KaqYy", "text": "1.0 M", "image": null, "isCorrect": true}, {"id": "2U0gH", "text": "10.0 M", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the Henderson-Hasselbalch equation for an acidic buffer:<br><br>$pH = pK_a + \\log_{10} \\left( \\dfrac{[\\text{Salt}]}{[\\text{Acid}]} \\right)$<br><br>Substituting the given values:<br><br>$5.5 = 4.5 + \\log_{10} \\left( \\dfrac{[\\text{Salt}]}{0.1} \\right)$<br><br>$1.0 = \\log_{10} \\left( \\dfrac{[\\text{Salt}]}{0.1} \\right)$<br><br>Taking antilog on both sides:<br><br>$\\dfrac{[\\text{Salt}]}{0.1} = 10^1 = 10$<br><br>$[\\text{Salt}] = 10 \\times 0.1 = 1.0 \\text{ M}$<br><br>Answer: 1.0 M", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b27bf9280d7f99326ba", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the pH of buffer solution formed by mixing 0.01 M acetic acid and 0.05 M sodium acetate $\\left(\\mathrm{pK}_2=4.7447\\right)$", "image": null}, "options": [{"id": "mpjvs", "text": "$2.80$", "image": null, "isCorrect": false}, {"id": "mhPEO", "text": "$3.00$", "image": null, "isCorrect": false}, {"id": "h9PuM", "text": "$5.44$", "image": null, "isCorrect": true}, {"id": "6KK9B", "text": "$6.5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The pH of an acidic buffer solution is given by the Henderson-Hasselbalch equation:<br><br>$\\mathrm{pH} = \\mathrm{pK}_a + \\log_{10} \\left( \\dfrac{[\\text{Salt}]}{[\\text{Acid}]} \\right)$<br><br>Given values are:<br>$[\\text{Salt}] = [\\text{Sodium acetate}] = 0.05 \\text{ M}$<br>$[\\text{Acid}] = [\\text{Acetic acid}] = 0.01 \\text{ M}$<br>$\\mathrm{pK}_a = 4.7447$<br><br>Substituting the values into the equation:<br><br>$\\mathrm{pH} = 4.7447 + \\log_{10} \\left( \\dfrac{0.05}{0.01} \\right)$<br><br>$\\mathrm{pH} = 4.7447 + \\log_{10} (5)$<br><br>Using the standard value $\\log_{10} (5) \\approx 0.6990$:<br><br>$\\mathrm{pH} = 4.7447 + 0.6990$<br><br>$\\mathrm{pH} = 5.4437 \\approx 5.44$<br><br>Answer: $5.44$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b13bf9280d7f9932613", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the pH of buffer solution prepared by mixing 0.01 M weak acid and 0.02 M salt of weak acid with strong base ?\n$\\left(\\mathrm{pK}_{\\mathrm{a}}=4.680\\right)$", "image": null}, "options": [{"id": "NrrHS", "text": "$4.379$", "image": null, "isCorrect": false}, {"id": "Rk7Ue", "text": "$2.379$", "image": null, "isCorrect": false}, {"id": "aeCt6", "text": "$4.981$", "image": null, "isCorrect": true}, {"id": "xBKlS", "text": "$2.981$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the Henderson-Hasselbalch equation for an acidic buffer:<br><br>$\\text{pH} = \\text{pK}_a + \\log_{10} \\left( \\dfrac{[\\text{Salt}]}{[\\text{Acid}]} \\right)$<br><br>Given:<br>$[\\text{Acid}] = 0.01 \\text{ M}$<br>$[\\text{Salt}] = 0.02 \\text{ M}$<br>$\\text{pK}_a = 4.680$<br><br>Substituting the values:<br><br>$\\text{pH} = 4.680 + \\log_{10} \\left( \\dfrac{0.02}{0.01} \\right)$<br><br>$\\text{pH} = 4.680 + \\log_{10}(2)$<br><br>$\\text{pH} = 4.680 + 0.3010$<br><br>$\\text{pH} = 4.981$<br><br>Answer: $4.981$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214370aee93fa0796dee1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Which from following mixtures in water acts as a buffer?", "image": null}, "options": [{"id": "O7is9", "text": "Acetic acid and sodium acetate", "image": null, "isCorrect": true}, {"id": "QgA1X", "text": "Acetic acid and ammonium chloride", "image": null, "isCorrect": false}, {"id": "lgzQ1", "text": "Ammonium hydroxide and sodium chloride", "image": null, "isCorrect": false}, {"id": "vyMi4", "text": "Formic acid and acetic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A buffer solution is defined as a mixture of a weak acid and its salt with a strong base (acidic buffer) or a weak base and its salt with a strong acid (basic buffer).<br><br>Acetic acid is a weak acid and sodium acetate is its salt with a strong base (sodium hydroxide). Therefore, the mixture of acetic acid and sodium acetate in water acts as an acidic buffer.<br><br>The other mixtures do not form conjugate acid-base pairs required for buffer action.<br><br>Answer: Acetic acid and sodium acetate", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214200aee93fa0796de2c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Acidic buffer solution is prepared by mixing proportionate quantity of", "image": null}, "options": [{"id": "eDPdN", "text": "strong acid and its salt with weak base.", "image": null, "isCorrect": false}, {"id": "DLJ6p", "text": "strong base and its salt with weak acid.", "image": null, "isCorrect": false}, {"id": "S4s9J", "text": "weak acid and its salt with strong base.", "image": null, "isCorrect": true}, {"id": "n19WE", "text": "weak base and its salt with strong acid.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "An acidic buffer solution is a mixture containing a weak acid and its salt with a strong base.<br><br>For example, a mixture of acetic acid ($CH_3COOH$), which is a weak acid, and sodium acetate ($CH_3COONa$), which is its salt with a strong base ($NaOH$).<br><br>Answer: weak acid and its salt with strong base.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e80aee93fa0796dc7a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "A buffer solution is prepared by mixing 0.01 M HCN and 0.02 MNaCN . If $\\mathrm{K}_{\\mathrm{a}}$ for HCN is $6.6 \\times 10^{-10}$, what is the concentration of $\\mathrm{H}^{+}$ions in solution?", "image": null}, "options": [{"id": "SXr55", "text": "$3.3 \\times 10^{-6} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "zyZX8", "text": "$3.3 \\times 10^{-10} \\mathrm{M}$", "image": null, "isCorrect": true}, {"id": "X7lv7", "text": "$1.32 \\times 10^{-6} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "6hAkv", "text": "$1.32 \\times 10^{-10} \\mathrm{M}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The concentration of hydrogen ions in an acidic buffer solution is given by the formula:<br><br>$[H^+] = K_a \\times \\dfrac{[\\text{Acid}]}{[\\text{Salt}]}$<br><br>Given:<br><br>$[\\text{Acid}] = [\\text{HCN}] = 0.01 \\text{ M}$<br><br>$[\\text{Salt}] = [\\text{NaCN}] = 0.02 \\text{ M}$<br><br>$K_a = 6.6 \\times 10^{-10}$<br><br>Substituting the given values into the formula:<br><br>$[H^+] = 6.6 \\times 10^{-10} \\times \\dfrac{0.01}{0.02}$<br><br>$[H^+] = 6.6 \\times 10^{-10} \\times \\dfrac{1}{2}$<br><br>$[H^+] = 3.3 \\times 10^{-10} \\text{ M}$<br><br>Answer: $3.3 \\times 10^{-10} \\mathrm{M}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d40aee93fa0796dbdc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "A buffer solution contains equal concentrations of weak acid and its salt with strong base. Calculate pH of buffer solution if dissociation constant of weak acid is $1.8 \\times 10^{-5}$.", "image": null}, "options": [{"id": "70fKZ", "text": "4.7447", "image": null, "isCorrect": true}, {"id": "l9CPg", "text": "5.1420", "image": null, "isCorrect": false}, {"id": "e7HQI", "text": "5.8496", "image": null, "isCorrect": false}, {"id": "fLq26", "text": "4.0128", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using Henderson-Hasselbalch equation for an acidic buffer:<br><br>$pH = pK_a + \\log \\dfrac{[\\text{Salt}]}{[\\text{Acid}]}$<br><br>Given that the concentrations of the weak acid and its salt are equal, $[\\text{Salt}] = [\\text{Acid}]$.<br><br>$pH = pK_a + \\log(1) = pK_a$<br><br>$pK_a = -\\log(K_a) = -\\log(1.8 \\times 10^{-5})$<br><br>$pK_a = 5 - \\log(1.8) = 5 - 0.2553 = 4.7447$<br><br>$pH = 4.7447$<br><br>Answer: 4.7447", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b10aee93fa0796dac9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Calculate the pH of buffer solution containing 0.04 M NaF and $0.02 \\mathrm{MHF}\\left[\\mathrm{pK}_a=3 \\cdot 142\\right]$.", "image": null}, "options": [{"id": "IKhcq", "text": "4.5", "image": null, "isCorrect": false}, {"id": "8m65y", "text": "3.4", "image": null, "isCorrect": true}, {"id": "Uv9eD", "text": "2.6", "image": null, "isCorrect": false}, {"id": "rj1iG", "text": "5.1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the Henderson-Hasselbalch equation for an acidic buffer:<br><br>$pH = pK_a + \\log\\left(\\dfrac{[\\text{Salt}]}{[\\text{Acid}]}\\right)$<br><br>Given values are:<br><br>$pK_a = 3.142$<br><br>$[\\text{Salt}] = [\\text{NaF}] = 0.04 \\text{ M}$<br><br>$[\\text{Acid}] = [\\text{HF}] = 0.02 \\text{ M}$<br><br>Substituting the values into the equation:<br><br>$pH = 3.142 + \\log\\left(\\dfrac{0.04}{0.02}\\right)$<br><br>$pH = 3.142 + \\log(2)$<br><br>Using the value of $\\log(2) = 0.3010$:<br><br>$pH = 3.142 + 0.3010 = 3.443$<br><br>Rounding to one decimal place, the pH is $3.4$.<br><br>Answer: 3.4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ac0aee93fa0796daa0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Which from following buffers is used to maintain the pH of human blood naturally?", "image": null}, "options": [{"id": "SydGS", "text": "Hydrogen cyanide and sodium cyanide", "image": null, "isCorrect": false}, {"id": "qrKBE", "text": "Copper hydroxide and copper chloride", "image": null, "isCorrect": false}, {"id": "H43fF", "text": "Carbonic acid and salt of carbonic acid", "image": null, "isCorrect": true}, {"id": "7W4WY", "text": "Ammonium hydroxide and ammonium chloride", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The pH of human blood is maintained at approximately $7.4$ by the carbonic acid-bicarbonate buffer system.<br><br>This buffer system consists of a weak acid, carbonic acid ($H_2CO_3$), and its conjugate base, bicarbonate ion ($HCO_3^-$), which is present as a salt of carbonic acid.<br><br>Therefore, carbonic acid and salt of carbonic acid are used to maintain the pH of human blood naturally.<br><br>Answer: Carbonic acid and salt of carbonic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213750aee93fa0796d8ec", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Calculate the pH of a buffer solution containing 0.35 M weak acid and 0.70 M of its salt with strong base if $\\mathrm{pK}_{\\mathrm{a}}$ is 4.56 .", "image": null}, "options": [{"id": "Dt87b", "text": "6.11", "image": null, "isCorrect": false}, {"id": "U3RdX", "text": "3.72", "image": null, "isCorrect": false}, {"id": "3E8NU", "text": "4.86", "image": null, "isCorrect": true}, {"id": "XrFcT", "text": "5.65", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the Henderson-Hasselbalch equation for an acidic buffer:<br><br>$\\text{pH} = \\text{pK}_{a} + \\log\\left(\\dfrac{[\\text{Salt}]}{[\\text{Acid}]}\\right)$<br><br>Substituting the given values:<br><br>$\\text{pH} = 4.56 + \\log\\left(\\dfrac{0.70}{0.35}\\right)$<br><br>$\\text{pH} = 4.56 + \\log(2)$<br><br>$\\text{pH} = 4.56 + 0.3010 = 4.8610$<br><br>Rounding to two decimal places, we get $4.86$.<br><br>Answer: 4.86", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213740aee93fa0796d8e8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which from following mixtures in water acts as a basic buffer?", "image": null}, "options": [{"id": "YGhH7", "text": "$\\mathrm{NH}_4 \\mathrm{OH}+\\mathrm{NH}_4 \\mathrm{Cl}$", "image": null, "isCorrect": true}, {"id": "GONes", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{COOH}+\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{COONa}$", "image": null, "isCorrect": false}, {"id": "P2tHw", "text": "$\\mathrm{HCOOH}+\\mathrm{HCOOK}$", "image": null, "isCorrect": false}, {"id": "0leG3", "text": "$\\mathrm{CH}_3 \\mathrm{COOH}+\\mathrm{CH}_3 \\mathrm{COONa}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A basic buffer is formed by mixing a weak base and its salt with a strong acid.<br><br>$\\mathrm{NH}_4 \\mathrm{OH}$ is a weak base and $\\mathrm{NH}_4 \\mathrm{Cl}$ is its salt with the strong acid $\\mathrm{HCl}$. Thus, the mixture of $\\mathrm{NH}_4 \\mathrm{OH}$ and $\\mathrm{NH}_4 \\mathrm{Cl}$ acts as a basic buffer.<br><br>The other three mixtures consist of a weak acid ($\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{COOH}$, $\\mathrm{HCOOH}$, $\\mathrm{CH}_3 \\mathrm{COOH}$) and its salt with a strong base, which act as acidic buffers.<br><br>Answer: $\\mathrm{NH}_4 \\mathrm{OH}+\\mathrm{NH}_4 \\mathrm{Cl}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213520aee93fa0796d7e0", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Calculate the pH of buffer solution containing 0:027M weak acid and 0.054 M of its salt with strong base if $\\mathrm{pK}_{\\mathrm{a}}$ is 4.2 .", "image": null}, "options": [{"id": "t85sW", "text": "4.5", "image": null, "isCorrect": true}, {"id": "Mh1R2", "text": "3.2", "image": null, "isCorrect": false}, {"id": "RM8dY", "text": "5.6", "image": null, "isCorrect": false}, {"id": "WTsxN", "text": "6.4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the Henderson-Hasselbalch equation for an acidic buffer:<br><br>$\\text{pH} = \\text{pK}_{a} + \\log\\left(\\dfrac{[\\text{Salt}]}{[\\text{Acid}]}\\right)$<br><br>Given:<br>$[\\text{Acid}] = 0.027 \\text{ M}$<br>$[\\text{Salt}] = 0.054 \\text{ M}$<br>$\\text{pK}_{a} = 4.2$<br><br>Substituting the values:<br><br>$\\text{pH} = 4.2 + \\log\\left(\\dfrac{0.054}{0.027}\\right)$<br><br>$\\text{pH} = 4.2 + \\log(2)$<br><br>Using $\\log(2) \\approx 0.3$:<br><br>$\\text{pH} = 4.2 + 0.3 = 4.5$<br><br>Answer: 4.5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213280aee93fa0796d69b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "What is the value of pOH if a buffer solution is prepared by mixing equal volumes of $0.4 \\mathrm{M} \\mathrm{NH}_4 \\mathrm{OH}$ and $0.5 \\mathrm{M} \\mathrm{NH}_4 \\mathrm{Cl}$ solutions. $\\left(\\mathrm{pK}_{\\mathrm{b}}=4.730\\right)$", "image": null}, "options": [{"id": "BGSVv", "text": "6.0", "image": null, "isCorrect": false}, {"id": "wKI9g", "text": "4.83", "image": null, "isCorrect": true}, {"id": "0f0A7", "text": "10.42", "image": null, "isCorrect": false}, {"id": "Sabpr", "text": "7.81", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When equal volumes of the two solutions are mixed, the total volume becomes double, so the concentration of each component becomes half of its initial value.<br><br>$[\\mathrm{Base}] = [\\mathrm{NH}_4\\mathrm{OH}] = \\dfrac{0.4}{2} = 0.2 \\mathrm{M}$<br><br>$[\\mathrm{Salt}] = [\\mathrm{NH}_4\\mathrm{Cl}] = \\dfrac{0.5}{2} = 0.25 \\mathrm{M}$<br><br>Using the Henderson-Hasselbalch equation for a basic buffer:<br><br>$\\mathrm{pOH} = \\mathrm{pK}_{\\mathrm{b}} + \\log \\left( \\dfrac{[\\mathrm{Salt}]}{[\\mathrm{Base}]} \\right)$<br><br>$\\mathrm{pOH} = 4.730 + \\log \\left( \\dfrac{0.25}{0.20} \\right)$<br><br>$\\mathrm{pOH} = 4.730 + \\log \\left( \\dfrac{5}{4} \\right)$<br><br>$\\mathrm{pOH} = 4.730 + \\log 5 - \\log 4$<br><br>$\\mathrm{pOH} = 4.730 + 0.699 - 0.602$<br><br>$\\mathrm{pOH} = 4.730 + 0.097 = 4.827 \\approx 4.83$<br><br>Answer: 4.83", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213270aee93fa0796d693", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "What is the ratio of concentration of salt to concentration of weak acid in buffer solution to maintain its pH value $7.2\\left(\\mathrm{pK}_{\\mathrm{a}}=6.2\\right)$.", "image": null}, "options": [{"id": "5HTe4", "text": "1.5", "image": null, "isCorrect": false}, {"id": "yuKlV", "text": "10.0", "image": null, "isCorrect": true}, {"id": "jXOMa", "text": "5.0", "image": null, "isCorrect": false}, {"id": "jFkdh", "text": "8.5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the Henderson-Hasselbalch equation for an acidic buffer:<br><br>$\\text{pH} = \\text{pK}_{\\text{a}} + \\log\\left(\\dfrac{[\\text{Salt}]}{[\\text{Acid}]}\\right)$<br><br>Given $\\text{pH} = 7.2$ and $\\text{pK}_{\\text{a}} = 6.2$, substituting these values:<br><br>$7.2 = 6.2 + \\log\\left(\\dfrac{[\\text{Salt}]}{[\\text{Acid}]}\\right)$<br><br>$1.0 = \\log\\left(\\dfrac{[\\text{Salt}]}{[\\text{Acid}]}\\right)$<br><br>Taking antilog on both sides:<br><br>$\\dfrac{[\\text{Salt}]}{[\\text{Acid}]} = 10^{1} = 10.0$<br><br>Answer: 10.0", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262480279619d9d8a3344", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "A buffer solution is prepared by mixing equimolar acetic acid and sodium acetate. If ' $\\mathrm{K}_{\\mathrm{a}}$ ' of acetic acid is $1.78 \\times 10^{-5}$, find the $\\mathrm{pH}$ of buffer solution.", "image": null}, "options": [{"id": "vvSS9", "text": "4.75", "image": null, "isCorrect": true}, {"id": "LBKji", "text": "8.9", "image": null, "isCorrect": false}, {"id": "GWXTp", "text": "9.4", "image": null, "isCorrect": false}, {"id": "sjgvP", "text": "2.6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For acidic buffer,\n$$\n\\begin{aligned}\n\\mathrm{pH} & =\\mathrm{pK}_{\\mathrm{a}}+\\log _{10} \\frac{[\\text { Salt }]}{[\\text { Acid }]}=\\mathrm{pK}_{\\mathrm{a}}+\\log _{10} \\frac{1}{1}=\\mathrm{pK}_{\\mathrm{a}} \\\\\n\\mathrm{pK}_{\\mathrm{a}} & =-\\log _{10} \\mathrm{~K}_{\\mathrm{a}}=-\\log _{10}\\left(1.78 \\times 10^{-5}\\right) \\\\\n& =-\\left(\\log _{10} 1.78+\\log _{10} 10^{-5}\\right) \\\\\n& =-(0.25-5)=4.75\n\\end{aligned}\n$$\nTherefore, $\\mathrm{pH}$ of buffer solution $=4.75$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262350279619d9d8a32ab", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "A buffer solution is prepared by mixing $0.01 \\mathrm{M}$ weak acid and $0.05 \\mathrm{M}$ solution of a salt of weak acid and strong base. What is the $\\mathrm{pH}$ of buffer solution? $(\\mathrm{pKa}=4.74)$", "image": null}, "options": [{"id": "G7YvU", "text": "$3.34$", "image": null, "isCorrect": false}, {"id": "8xZoT", "text": "$4.80$", "image": null, "isCorrect": false}, {"id": "ZSlIc", "text": "$5.44$", "image": null, "isCorrect": true}, {"id": "JNEhw", "text": "$6.93$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{pH} & =\\mathrm{pK}_{\\mathrm{a}}+\\log _{10} \\frac{[\\text { salt }]}{[\\text { acid }]} \\\\ & =4.74+\\log _{10} \\frac{0.05}{0.01} \\\\ & =4.74+0.7=5.44\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b00279619d9d8a2e91", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Which salt from following forms aqueous solution having $\\mathrm{pH}$ less than 7 ?", "image": null}, "options": [{"id": "L7K7O", "text": "$CH_3COONa$", "image": null, "isCorrect": false}, {"id": "UZpI9", "text": "$Na_2SO_4$", "image": null, "isCorrect": false}, {"id": "xNr9A", "text": "$CuSO_4$", "image": null, "isCorrect": true}, {"id": "3iRDz", "text": "$Na_2CO_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A salt of strong acid and weak base forms aqueous solution having $\\mathrm{pH}$ less than 7 (that is, it forms an acidic solution). $\\mathrm{CuSO}_4$ is salt of strong acid $\\mathrm{H}_2 \\mathrm{SO}_4$ and weak base $\\mathrm{Cu}(\\mathrm{OH})_2$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261af0279619d9d8a2e88", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "A buffer solution is prepared by mixing $0.2 \\mathrm{M}$ sodium acetate and $0.1 \\mathrm{M}$ acetic acid. If $\\mathrm{pK}_{\\mathrm{a}}$ for acetic acid is 4.7 , find the $\\mathrm{pH}$.", "image": null}, "options": [{"id": "UWmG2", "text": "3.0", "image": null, "isCorrect": false}, {"id": "8WK33", "text": "4.0", "image": null, "isCorrect": false}, {"id": "7ZTg7", "text": "5.0", "image": null, "isCorrect": true}, {"id": "EnIEx", "text": "2.0", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using Henderson's equation,\n$\\begin{aligned}\n& \\mathrm{pH}=\\mathrm{pK}_{\\mathrm{a}}+\\log _{10} \\frac{[\\text { Salt }]}{[\\text { Acid }]} \\\\\n& \\mathrm{pH}=4.7+\\log _{10} \\frac{0.2}{0.1} \\\\\n& \\mathrm{pH}=4.7+\\log _{10} 2=4.7+0.3010=5.001\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261630279619d9d8a2c28", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "A buffer solution is prepared by mixing $0.1 \\mathrm{M} \\mathrm{HCN}$ and $0.2 \\mathrm{M} \\mathrm{NaCN}$ What is the $\\mathrm{pH}$ of buffer solution if $\\mathrm{pKa}$ of $\\mathrm{HCN}$ is 9.3? $(\\log 2=0.3010)$", "image": null}, "options": [{"id": "fCjYB", "text": "4.2", "image": null, "isCorrect": false}, {"id": "rA1Mw", "text": "2.0", "image": null, "isCorrect": false}, {"id": "3PxEG", "text": "9.60", "image": null, "isCorrect": true}, {"id": "iRViK", "text": "6.15", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{pH}=\\mathrm{pKa}+\\log \\frac{[\\text { Salt }]}{[\\text { Acid }]} \\\\ & =9.3+\\log \\frac{(0.2)}{(0.1)} \\\\ & =9.3+0.3010 \\\\ & =9.60\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604e0279619d9d8a2366", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "Which among the following salts turns blue litmus red in its aqueous solution?", "image": null}, "options": [{"id": "7Vx3Q", "text": "$\\mathrm{NH}_4 \\mathrm{CN}$", "image": null, "isCorrect": false}, {"id": "KH4Oc", "text": "$\\mathrm{NH}_4 \\mathrm{~F}$", "image": null, "isCorrect": true}, {"id": "9x6km", "text": "$\\mathrm{CH}_3 \\mathrm{COONa}$", "image": null, "isCorrect": false}, {"id": "REPBC", "text": "$\\mathrm{CH}_3 \\mathrm{COONH}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>To identify the salt that yields an acidic aqueous solution—thus turning blue litmus red—consider the hydrolysis behavior based on the strength of the parent acid and base.</p><p>Option A, $\\text{KCN}$, derives from a strong base (KOH) and weak acid (HCN). The cyanide ion hydrolyzes as $\\text{CN}^- + \\text{H}_2\\text{O} \\rightleftharpoons \\text{HCN} + \\text{OH}^-$, producing hydroxide ions and resulting in a basic solution.</p><p>Option B, $\\text{Na}_2\\text{CO}_3$, originates from a strong base (NaOH) and weak acid ($\\text{H}_2\\text{CO}_3$). The carbonate ion hydrolyzes via $\\text{CO}_3^{2-} + \\text{H}_2\\text{O} \\rightleftharpoons \\text{HCO}_3^- + \\text{OH}^-$, also yielding a basic solution.</p><p>Option C, $\\text{NaNO}_3$, is formed from a strong base (NaOH) and strong acid ($\\text{HNO}_3$). Neither ion hydrolyzes significantly, so the solution remains neutral.</p><p>Option D, $\\text{CuCl}_2$, arises from a weak base ($\\text{Cu(OH)}_2$) and strong acid (HCl). The copper(II) ion hydrolyzes as $\\text{Cu}^{2+} + 2\\text{H}_2\\text{O} \\rightleftharpoons \\text{Cu(OH)}_2 + 2\\text{H}^+$, producing hydrogen ions and creating an acidic solution.</p><p>Consequently, $\\text{CuCl}_2$ is the salt that turns blue litmus red.</p><p>The final answer is $\\boxed{\\text{D}}$</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a2632e0279619d9d8a3cb9", "title": "Solubility", "totalQuestions": 60, "questions": [{"_id": "6abb88a115a9fc0fc8c14580", "type": "singleCorrect", "question": {"text": "The solubility product of a sparingly soluble salt $\\text{BA}_2$ is $1.08 \\times 10^{-10}$. Calculate its solubility in g dm$^{-3}$ if the molar mass of salt is $175$ g mol$^{-1}$.", "image": null}, "options": [{"id": "g6Y26", "label": "A", "text": "$5.25 \\times 10^{-2}$ g dm$^{-3}$.", "isCorrect": true, "image": null}, {"id": "OHscs", "label": "B", "text": "$1.75 \\times 10^{-2}$ g dm$^{-3}$", "isCorrect": false, "image": null}, {"id": "fTQNr", "label": "C", "text": "$3.50 \\times 10^{-2}$ g dm$^{-3}$.", "isCorrect": false, "image": null}, {"id": "mKRdS", "label": "D", "text": "$7.00 \\times 10^{-3}$ g dm$^{-3}$.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The dissociation of the sparingly soluble salt $\\text{BA}_2$ is given by:<br><br>$\\text{BA}_2 \\rightleftharpoons \\text{B}^{2+} + 2\\text{A}^{-}$<br><br>Let the solubility of the salt be $s$ mol dm$^{-3}$.<br><br>$K_{sp} = [\\text{B}^{2+}][\\text{A}^{-}]^2 = (s)(2s)^2 = 4s^3$<br><br>Given $K_{sp} = 1.08 \\times 10^{-10}$, we have:<br><br>$4s^3 = 1.08 \\times 10^{-10}$<br><br>$s^3 = 0.27 \\times 10^{-10} = 27 \\times 10^{-12}$<br><br>$s = 3 \\times 10^{-4}$ mol dm$^{-3}$<br><br>The molar mass of the salt is $175$ g mol$^{-1}$.<br><br>Solubility in g dm$^{-3}$ = $s \\times \\text{Molar mass}$<br><br>Solubility = $3 \\times 10^{-4} \\times 175 = 525 \\times 10^{-4} = 5.25 \\times 10^{-2}$ g dm$^{-3}$<br><br>Answer: $5.25 \\times 10^{-2}$ g dm$^{-3}$.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885215a9fc0fc8c14293", "type": "singleCorrect", "question": {"text": "The $K_{SP}$ of $\\text{Mg(OH)}_2$ is $1.2 \\times 10^{-11}$. Then what will be the highest pH of the $0.1$ M $\\text{Mg}^{2+}$ ions from which $\\text{Mg(OH)}_2$ is not precipitated?", "image": null}, "options": [{"id": "1tlMi", "label": "A", "text": "$4.96$", "isCorrect": false, "image": null}, {"id": "qInfg", "label": "B", "text": "$6.96$", "isCorrect": false, "image": null}, {"id": "DTBYo", "label": "C", "text": "$7.54$", "isCorrect": false, "image": null}, {"id": "O9wZT", "label": "D", "text": "$9.04$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For precipitation of $\\text{Mg(OH)}_2$ not to occur, the ionic product must be less than or equal to $K_{SP}$.<br><br>$[\\text{Mg}^{2+}][\\text{OH}^-]^2 \\le K_{SP}$<br><br>Substituting the given values:<br><br>$0.1 \\times [\\text{OH}^-]^2 \\le 1.2 \\times 10^{-11}$<br><br>$[\\text{OH}^-]^2 \\le 1.2 \\times 10^{-10}$<br><br>$[\\text{OH}^-] \\le \\sqrt{1.2} \\times 10^{-5}$<br><br>$[\\text{OH}^-] \\le 1.095 \\times 10^{-5}$<br><br>Taking the negative logarithm on both sides:<br><br>$\\text{pOH} \\ge -\\log(1.095 \\times 10^{-5})$<br><br>$\\text{pOH} \\ge 5 - \\log(1.095)$<br><br>$\\text{pOH} \\ge 5 - 0.04 = 4.96$<br><br>Since $\\text{pH} + \\text{pOH} = 14$ at $25^{\\circ}\\text{C}$:<br><br>$14 - \\text{pH} \\ge 4.96$<br><br>$\\text{pH} \\le 14 - 4.96$<br><br>$\\text{pH} \\le 9.04$<br><br>Thus, the highest pH from which $\\text{Mg(OH)}_2$ is not precipitated is $9.04$.<br><br>Answer: $9.04$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885215a9fc0fc8c14292", "type": "singleCorrect", "question": {"text": "Calculate the solubility in g/L of sparingly soluble salt $BA$ if solubility product is $5.2 \\times 10^{-13}$ (molar mass $BA = 188$ g/mol).", "image": null}, "options": [{"id": "KiyUb", "label": "A", "text": "$2.68 \\times 10^{-4}\\,g/L$", "isCorrect": false, "image": null}, {"id": "pdDPf", "label": "B", "text": "$2.15 \\times 10^{-4}\\,g/L$", "isCorrect": false, "image": null}, {"id": "LJf8Y", "label": "C", "text": "$1.355 \\times 10^{-4}\\,g/L$", "isCorrect": true, "image": null}, {"id": "UAFcM", "label": "D", "text": "$4.845 \\times 10^{-4}\\,g/L$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For the sparingly soluble salt $BA$, the dissociation is given by:<br><br>$BA \\rightleftharpoons B^{+} + A^{-}$<br><br>Let the solubility of $BA$ be $s$ mol/L. The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [B^{+}][A^{-}] = s^{2}$<br><br>Given $K_{sp} = 5.2 \\times 10^{-13}$, we have:<br><br>$s = \\sqrt{5.2 \\times 10^{-13}} = \\sqrt{52 \\times 10^{-14}} \\approx 7.21 \\times 10^{-7}$ mol/L<br><br>To find the solubility in g/L, multiply the molar solubility by the molar mass of $BA$ ($188$ g/mol):<br><br>Solubility in g/L $= s \\times M = 7.21 \\times 10^{-7} \\times 188$<br><br>Solubility in g/L $\\approx 1355.48 \\times 10^{-7} \\approx 1.355 \\times 10^{-4}$ g/L<br><br>Answer: $1.355 \\times 10^{-4}\\,g/L$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888115a9fc0fc8c14454", "type": "singleCorrect", "question": {"text": "Which of the following is correct expression for solubility product of calcium phosphate?", "image": null}, "options": [{"id": "6XwZ4", "label": "A", "text": "$K_{sp} = [\\text{Ca}^{2+}]^2[\\text{PO}_4^{3-}]^2$", "isCorrect": false, "image": null}, {"id": "ZhA2F", "label": "B", "text": "$K_{SP} = [\\text{Ca}^{3+}]^2[\\text{PO}_4^{2-}]^3$", "isCorrect": false, "image": null}, {"id": "soabS", "label": "C", "text": "$K_{SP} = [\\text{Ca}^{2+}]^2[\\text{PO}_4^{2-}]^3$", "isCorrect": false, "image": null}, {"id": "9OX8e", "label": "D", "text": "$K_{SP} = [\\text{Ca}^{2+}]^3[\\text{PO}_4^{3-}]^2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The chemical formula of calcium phosphate is $\\text{Ca}_3(\\text{PO}_4)_2$.<br><br>The dissociation equilibrium of calcium phosphate in water is given by:<br><br>$\\text{Ca}_3(\\text{PO}_4)_2(s) \\rightleftharpoons 3\\text{Ca}^{2+}(aq) + 2\\text{PO}_4^{3-}(aq)$<br><br>The solubility product constant, $K_{sp}$, is the product of the molar concentrations of the constituent ions, each raised to the power of its stoichiometric coefficient in the balanced equilibrium equation.<br><br>Therefore, the expression for the solubility product is:<br><br>$K_{sp} = [\\text{Ca}^{2+}]^3[\\text{PO}_4^{3-}]^2$<br><br>Answer: $K_{SP} = [\\text{Ca}^{2+}]^3[\\text{PO}_4^{3-}]^2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886115a9fc0fc8c14328", "type": "singleCorrect", "question": {"text": "The solubility product of sparingly soluble salt BA at $25\\,^\\circ$C is $6.0 \\times 10^{-13}$. What is the solubility of it?", "image": null}, "options": [{"id": "YimrQ", "label": "A", "text": "$7.746 \\times 10^{-7}$ mol dm$^{-3}$", "isCorrect": true, "image": null}, {"id": "XJAKQ", "label": "B", "text": "$7.142 \\times 10^{-7}$ mol dm$^{-3}$", "isCorrect": false, "image": null}, {"id": "0Pc6b", "label": "C", "text": "$7.344 \\times 10^{-7}$ mol dm$^{-3}$", "isCorrect": false, "image": null}, {"id": "jUshZ", "label": "D", "text": "$7.964 \\times 10^{-7}$ mol dm$^{-3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The dissociation of the sparingly soluble salt BA is given by:<br><br>$BA \\rightleftharpoons B^+ + A^-$<br><br>Let the solubility of the salt be $s$.<br><br>The solubility product $K_{sp}$ is given by:<br><br>$K_{sp} = [B^+][A^-] = s \\times s = s^2$<br><br>Given $K_{sp} = 6.0 \\times 10^{-13}$, we can write:<br><br>$s^2 = 6.0 \\times 10^{-13} = 60 \\times 10^{-14}$<br><br>$s = \\sqrt{60 \\times 10^{-14}} = \\sqrt{60} \\times 10^{-7}$<br><br>Since $\\sqrt{60} \\approx 7.746$, we get:<br><br>$s = 7.746 \\times 10^{-7}$ mol dm$^{-3}$<br><br>Answer: $7.746 \\times 10^{-7}$ mol dm$^{-3}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c115a9fc0fc8c146ad", "type": "singleCorrect", "question": {"text": "The solubility of sparingly soluble salt $BA$ in water is $1.2 \\times 10^{-5}$ mol dm$^{-3}$. Find its solubility product.", "image": null}, "options": [{"id": "xMvL4", "label": "A", "text": "$1.22 \\times 10^{-10}$", "isCorrect": false, "image": null}, {"id": "L5ZvG", "label": "B", "text": "$1.44 \\times 10^{-10}$", "isCorrect": true, "image": null}, {"id": "zAafg", "label": "C", "text": "$1.88 \\times 10^{-10}$", "isCorrect": false, "image": null}, {"id": "fEjLz", "label": "D", "text": "$2.08 \\times 10^{-10}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The dissociation of the sparingly soluble salt $BA$ is given by:<br><br>$BA \\rightleftharpoons B^{+} + A^{-}$<br><br>Let the solubility of the salt be $s$. Then the equilibrium concentrations are:<br><br>$[B^{+}] = s$<br><br>$[A^{-}] = s$<br><br>The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [B^{+}][A^{-}] = s \\times s = s^2$<br><br>Given $s = 1.2 \\times 10^{-5}$ mol dm$^{-3}$, substituting this value gives:<br><br>$K_{sp} = (1.2 \\times 10^{-5})^2$<br><br>$K_{sp} = 1.44 \\times 10^{-10}$<br><br>Answer: $1.44 \\times 10^{-10}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f08c30a4553e1bde6c", "type": "singleCorrect", "question": {"text": "The solubility of salt $\\text{AX}_2$ is $6 \\times 10^{-12}\\ \\text{mol dm}^{-3}$. What is solubility product of the salt ?", "image": null}, "options": [{"id": "zoFke", "label": "A", "text": "$2.06 \\times 10^{-24}$", "isCorrect": false, "image": null}, {"id": "E1wVF", "label": "B", "text": "$2.48 \\times 10^{-24}$", "isCorrect": false, "image": null}, {"id": "F848L", "label": "C", "text": "$4.32 \\times 10^{-34}$", "isCorrect": false, "image": null}, {"id": "FHdxc", "label": "D", "text": "$8.64 \\times 10^{-34}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The dissociation of the salt $\\text{AX}_2$ is given by:<br><br>$\\text{AX}_2 \\rightleftharpoons \\text{A}^{2+} + 2\\text{X}^-$<br><br>Let the solubility of the salt be $s$.<br><br>$[\\text{A}^{2+}] = s$<br><br>$[\\text{X}^-] = 2s$<br><br>The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [\\text{A}^{2+}][\\text{X}^-]^2 = (s)(2s)^2 = 4s^3$<br><br>Given $s = 6 \\times 10^{-12}\\ \\text{mol dm}^{-3}$, substituting this value:<br><br>$K_{sp} = 4 \\times (6 \\times 10^{-12})^3$<br><br>$K_{sp} = 4 \\times 216 \\times 10^{-36}$<br><br>$K_{sp} = 864 \\times 10^{-36} = 8.64 \\times 10^{-34}$<br><br>Answer: $8.64 \\times 10^{-34}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3278c30a4553e1be0c0", "type": "singleCorrect", "question": {"text": "The solubility of a sparingly soluble a salt $\\text{AB}_2$ is $1 \\times 10^{-6}\\ \\text{mol/dm}^3$. Calculate its solubility product?", "image": null}, "options": [{"id": "9rk89", "label": "A", "text": "$1 \\times 10^{-12}$", "isCorrect": false, "image": null}, {"id": "EnEJ8", "label": "B", "text": "$2 \\times 10^{-12}$", "isCorrect": false, "image": null}, {"id": "pV6xA", "label": "C", "text": "$3 \\times 10^{-12}$", "isCorrect": false, "image": null}, {"id": "DJZR8", "label": "D", "text": "$4 \\times 10^{-18}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The dissociation of the salt $AB_2$ is given by:<br><br>$AB_2 \\rightleftharpoons A^{2+} + 2B^-$<br><br>Let the solubility of the salt be $S$. The equilibrium concentrations are:<br><br>$[A^{2+}] = S$<br><br>$[B^-] = 2S$<br><br>The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [A^{2+}][B^-]^2$<br><br>$K_{sp} = (S)(2S)^2 = 4S^3$<br><br>Given $S = 1 \\times 10^{-6}\\ \\text{mol/dm}^3$, substituting this value:<br><br>$K_{sp} = 4(1 \\times 10^{-6})^3$<br><br>$K_{sp} = 4 \\times 10^{-18}$<br><br>Answer: $4 \\times 10^{-18}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3478c30a4553e1be208", "type": "singleCorrect", "question": {"text": "The solubility of sapringly soluble salt $\\text{AB}_2$ is $18 \\cdot 78 \\times 10^{-4} \\text{ g/dm}^3$ What is its solubility product ? (Molar mass of $\\text{AB}_2 = 187 \\cdot 8 \\text{ g mol}^{-1}$)", "image": null}, "options": [{"id": "xdI7J", "label": "A", "text": "$2 \\times 10^{-15}$", "isCorrect": false, "image": null}, {"id": "1z6s1", "label": "B", "text": "$4 \\times 10^{-15}$", "isCorrect": true, "image": null}, {"id": "Ym4hW", "label": "C", "text": "$6 \\times 10^{-15}$", "isCorrect": false, "image": null}, {"id": "L6LKO", "label": "D", "text": "$8 \\times 10^{-15}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Solubility $S$ in $\\text{mol dm}^{-3}$ is calculated by dividing the solubility in $\\text{g dm}^{-3}$ by the molar mass.<br><br>$S = \\dfrac{18 \\cdot 78 \\times 10^{-4}}{187 \\cdot 8} = 10^{-5} \\text{ mol dm}^{-3}$<br><br>The dissociation of the salt $\\text{AB}_2$ is given by:<br><br>$\\text{AB}_2 \\rightleftharpoons \\text{A}^{2+} + 2\\text{B}^{-}$<br><br>The solubility product $K_{sp}$ is:<br><br>$K_{sp} = [\\text{A}^{2+}][\\text{B}^{-}]^2 = (S)(2S)^2 = 4S^3$<br><br>Substituting the value of $S$:<br><br>$K_{sp} = 4 \\times (10^{-5})^3 = 4 \\times 10^{-15}$<br><br>Answer: $4 \\times 10^{-15}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3428c30a4553e1be1d9", "type": "singleCorrect", "question": {"text": "Which of the following is correct relationship between solubility and solubility product for silver oxalate ?", "image": null}, "options": [{"id": "GAbd4", "label": "A", "text": "$S = \\sqrt[3]{K_{sp} \\times 4}$", "isCorrect": false, "image": null}, {"id": "YjL8F", "label": "B", "text": "$S = \\sqrt[3]{\\dfrac{4}{K_{sp}}}$", "isCorrect": false, "image": null}, {"id": "dfVYW", "label": "C", "text": "$S = \\sqrt[3]{\\dfrac{K_{sp}}{4}}$", "isCorrect": true, "image": null}, {"id": "PISUP", "label": "D", "text": "$S = \\sqrt[4]{\\dfrac{K_{sp}}{27}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The chemical formula of silver oxalate is $Ag_2C_2O_4$.<br><br>The dissociation reaction is:<br>$Ag_2C_2O_4(s) \\rightleftharpoons 2Ag^+(aq) + C_2O_4^{2-}(aq)$<br><br>Let the solubility of silver oxalate be $S$.<br>Then, $[Ag^+] = 2S$ and $[C_2O_4^{2-}] = S$.<br><br>The solubility product $K_{sp}$ is given by:<br>$K_{sp} = [Ag^+]^2 [C_2O_4^{2-}]$<br><br>Substituting the concentrations:<br>$K_{sp} = (2S)^2 (S) = 4S^3$<br><br>$S^3 = \\dfrac{K_{sp}}{4}$<br><br>$S = \\sqrt[3]{\\dfrac{K_{sp}}{4}}$<br><br>Answer: $S = \\sqrt[3]{\\dfrac{K_{sp}}{4}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c58c30a4553e1bdca1", "type": "singleCorrect", "question": {"text": "Calculate the solubility in mol $\\text{dm}^{-3}$ of sparingly soluble salt BA at 293 K if its solubility product is $8.56 \\times 10^{-5}$ at same temperature.", "image": null}, "options": [{"id": "uK5Nk", "label": "A", "text": "$8.123 \\times 10^{-3}$", "isCorrect": false, "image": null}, {"id": "wUwuC", "label": "B", "text": "$8.780 \\times 10^{-3}$", "isCorrect": false, "image": null}, {"id": "j63PN", "label": "C", "text": "$9.252 \\times 10^{-3}$", "isCorrect": true, "image": null}, {"id": "fS0a9", "label": "D", "text": "$7.756 \\times 10^{-3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The dissociation of the sparingly soluble salt BA is given by:<br><br>$BA \\rightleftharpoons B^+ + A^-$<br><br>Let the solubility of the salt be $s$ mol $\\text{dm}^{-3}$.<br><br>The solubility product $K_{sp}$ is given by:<br><br>$K_{sp} = [B^+][A^-] = s \\times s = s^2$<br><br>Given $K_{sp} = 8.56 \\times 10^{-5}$, we have:<br><br>$s^2 = 8.56 \\times 10^{-5} = 85.6 \\times 10^{-6}$<br><br>$s = \\sqrt{85.6 \\times 10^{-6}} = 9.252 \\times 10^{-3} \\text{ mol dm}^{-3}$<br><br>Answer: $9.252 \\times 10^{-3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d48c30a4553e1bdd3b", "type": "singleCorrect", "question": {"text": "The solubility product of sparingly soluble salt BA is $4 \\times 10^{-13}$. Calculate the $[\\text{A}^-]$ if $[\\text{B}^+]$ is $1 \\times 10^{-6}\\ \\text{M}$.", "image": null}, "options": [{"id": "9mEwD", "label": "A", "text": "$2 \\times 10^{-7}\\ \\text{M}$", "isCorrect": false, "image": null}, {"id": "02YL9", "label": "B", "text": "$3 \\times 10^{-7}\\ \\text{M}$", "isCorrect": false, "image": null}, {"id": "OdyDw", "label": "C", "text": "$4 \\times 10^{-7}\\ \\text{M}$", "isCorrect": true, "image": null}, {"id": "oMkP2", "label": "D", "text": "$5 \\times 10^{-7}\\ \\text{M}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The dissociation of the sparingly soluble salt $\\text{BA}$ is given by:<br><br>$\\text{BA} \\rightleftharpoons \\text{B}^+ + \\text{A}^-$<br><br>The solubility product expression is:<br><br>$K_{sp} = [\\text{B}^+][\\text{A}^-]$<br><br>Given:<br><br>$K_{sp} = 4 \\times 10^{-13}$<br><br>$[\\text{B}^+] = 1 \\times 10^{-6}\\ \\text{M}$<br><br>Substituting the given values into the expression:<br><br>$4 \\times 10^{-13} = (1 \\times 10^{-6}) \\times [\\text{A}^-]$<br><br>$[\\text{A}^-] = \\dfrac{4 \\times 10^{-13}}{1 \\times 10^{-6}}$<br><br>$[\\text{A}^-] = 4 \\times 10^{-7}\\ \\text{M}$<br><br>Answer: $4 \\times 10^{-7}\\ \\text{M}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3358c30a4553e1be155", "type": "singleCorrect", "question": {"text": "The solubility product of a sparingly soluble salt BA is $6.4 \\times 10^{-13}$. Calculate it's solubility in $\\text{g dm}^{-3}$ .<br>Molar mass of salt is $190\\ \\text{g mol}^{-1}$ .", "image": null}, "options": [{"id": "Zihe0", "label": "A", "text": "$1.52 \\times 10^{-4}$", "isCorrect": true, "image": null}, {"id": "5o5Kw", "label": "B", "text": "$1.25 \\times 10^{-4}$", "isCorrect": false, "image": null}, {"id": "w8CYf", "label": "C", "text": "$2.1 \\times 10^{-4}$", "isCorrect": false, "image": null}, {"id": "qa8Ya", "label": "D", "text": "$1.9 \\times 10^{-4}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a sparingly soluble salt $BA$, the dissociation equilibrium is given by $BA \\rightleftharpoons B^+ + A^-$.<br><br>Let the solubility of the salt be $s$ in $\\text{mol dm}^{-3}$.<br><br>The solubility product $K_{sp}$ is given by:<br><br>$K_{sp} = [B^+][A^-] = s \\times s = s^2$<br><br>Substituting the given value of $K_{sp}$:<br><br>$s^2 = 6.4 \\times 10^{-13} = 64 \\times 10^{-14}$<br><br>$s = \\sqrt{64 \\times 10^{-14}} = 8 \\times 10^{-7}\\ \\text{mol dm}^{-3}$<br><br>To convert the solubility from $\\text{mol dm}^{-3}$ to $\\text{g dm}^{-3}$, multiply by the molar mass of the salt:<br><br>Solubility in $\\text{g dm}^{-3} = s \\times \\text{Molar mass}$<br><br>Solubility $= 8 \\times 10^{-7}\\ \\text{mol dm}^{-3} \\times 190\\ \\text{g mol}^{-1}$<br><br>Solubility $= 1520 \\times 10^{-7}\\ \\text{g dm}^{-3} = 1.52 \\times 10^{-4}\\ \\text{g dm}^{-3}$<br><br>Answer: $1.52 \\times 10^{-4}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3358c30a4553e1be154", "type": "singleCorrect", "question": {"text": "The solubility of AgCl in 0.1 M NaCl is S mol/L. If the solubility product of AgCl is $1.8 \\times 10^{-10}$, then S is approximately:", "image": null}, "options": [{"id": "DGntW", "label": "A", "text": "$1.8 \\times 10^{-9}$ M", "isCorrect": true, "image": null}, {"id": "5TnF1", "label": "B", "text": "$1.8 \\times 10^{-10}$ M", "isCorrect": false, "image": null}, {"id": "KIMZb", "label": "C", "text": "$1.8 \\times 10^{-11}$ M", "isCorrect": false, "image": null}, {"id": "uG1pE", "label": "D", "text": "$1.8 \\times 10^{-12}$ M", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The dissociation of AgCl is given by:<br><br>$AgCl(s) \\rightleftharpoons Ag^{+}(aq) + Cl^{-}(aq)$<br><br>Let the solubility of AgCl in $0.1$ M NaCl be $S$ mol/L.<br><br>The concentration of $Ag^{+}$ is $S$ and the concentration of $Cl^{-}$ is $S + 0.1$.<br><br>Since $K_{sp}$ is very small, $S$ is negligible compared to $0.1$, so $[Cl^{-}] \\approx 0.1$ M.<br><br>The solubility product expression is:<br><br>$K_{sp} = [Ag^{+}][Cl^{-}]$<br><br>$1.8 \\times 10^{-10} = S \\times 0.1$<br><br>$S = \\dfrac{1.8 \\times 10^{-10}}{0.1} = 1.8 \\times 10^{-9}$ M<br><br>Answer: $1.8 \\times 10^{-9}$ M", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e28c30a4553e1bddd1", "type": "singleCorrect", "question": {"text": "What is the solubility product of binary sparingly soluble salt BA if 100 mL saturated solution of salt consist $10^{-4}$ moles at room temperature?", "image": null}, "options": [{"id": "cIas1", "label": "A", "text": "$1 \\times 10^{-4}$", "isCorrect": false, "image": null}, {"id": "qF752", "label": "B", "text": "$1 \\times 10^{-6}$", "isCorrect": true, "image": null}, {"id": "FX0wC", "label": "C", "text": "$1 \\times 10^{-8}$", "isCorrect": false, "image": null}, {"id": "xZkEY", "label": "D", "text": "$1 \\times 10^{-10}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The solubility $S$ of the salt is the number of moles dissolved per litre of the saturated solution.<br><br>Given moles of salt $= 10^{-4}$ and volume $= 100$ mL $= 0.1$ L.<br><br>$S = \\dfrac{10^{-4}}{0.1} = 10^{-3}$ mol L$^{-1}$<br><br>For a binary salt $BA$, the dissociation is:<br><br>$BA \\rightleftharpoons B^{+} + A^{-}$<br><br>The solubility product $K_{sp}$ is given by:<br><br>$K_{sp} = [B^{+}][A^{-}] = S \\times S = S^2$<br><br>Substituting the value of $S$:<br><br>$K_{sp} = (10^{-3})^2 = 1 \\times 10^{-6}$<br><br>Answer: $1 \\times 10^{-6}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3198c30a4553e1be028", "type": "singleCorrect", "question": {"text": "The solubility of sparingly soluble salts $\\text{MX}_1$, $\\text{MX}_2$ and $\\text{MX}_3$ is $1 \\times 10^{-3}$ mol/L. Hence, their respective solubility products are", "image": null}, "options": [{"id": "3PfvS", "label": "A", "text": "$1 \\times 10^{-6}$, $4 \\times 10^{-9}$ and $27 \\times 10^{-12}$", "isCorrect": true, "image": null}, {"id": "dvcGh", "label": "B", "text": "$1 \\times 10^{-9}$, $4 \\times 10^{-9}$ and $32 \\times 10^{-12}$", "isCorrect": false, "image": null}, {"id": "fMo4s", "label": "C", "text": "$1 \\times 10^{-9}$, $8 \\times 10^{-8}$ and $32 \\times 10^{-12}$", "isCorrect": false, "image": null}, {"id": "BTzsv", "label": "D", "text": "$1 \\times 10^{-6}$, $8 \\times 10^{-8}$ and $27 \\times 10^{-12}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For the salt $\\text{MX}_1$ (type $\\text{AB}$):<br>$\\text{MX}_1 \\rightleftharpoons \\text{M}^+ + \\text{X}^-$<br>$K_{sp} = S^2$<br>Substituting $S = 1 \\times 10^{-3}$ mol/L:<br>$K_{sp} = (1 \\times 10^{-3})^2 = 1 \\times 10^{-6}$<br><br>For the salt $\\text{MX}_2$ (type $\\text{AB}_2$):<br>$\\text{MX}_2 \\rightleftharpoons \\text{M}^{2+} + 2\\text{X}^-$<br>$K_{sp} = (S)(2S)^2 = 4S^3$<br>Substituting $S = 1 \\times 10^{-3}$ mol/L:<br>$K_{sp} = 4(1 \\times 10^{-3})^3 = 4 \\times 10^{-9}$<br><br>For the salt $\\text{MX}_3$ (type $\\text{AB}_3$):<br>$\\text{MX}_3 \\rightleftharpoons \\text{M}^{3+} + 3\\text{X}^-$<br>$K_{sp} = (S)(3S)^3 = 27S^4$<br>Substituting $S = 1 \\times 10^{-3}$ mol/L:<br>$K_{sp} = 27(1 \\times 10^{-3})^4 = 27 \\times 10^{-12}$<br><br>Answer: $1 \\times 10^{-6}$, $4 \\times 10^{-9}$ and $27 \\times 10^{-12}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3608c30a4553e1be316", "type": "singleCorrect", "question": {"text": "What is the solubility of $\\text{BaSO}_4$ in g /$\\text{dm}^3$ if its solubility product is $1.0 \\times 10^{-10}$ at $25^\\circ$C. [Molar mass of $\\text{BaSO}_4 = 233$ g/mol]", "image": null}, "options": [{"id": "ZwsUj", "label": "A", "text": "$2.33 \\times 10^{-3}$ g/$\\text{dm}^3$", "isCorrect": true, "image": null}, {"id": "3cr9x", "label": "B", "text": "$4.66 \\times 10^{-3}$ g/$\\text{dm}^3$", "isCorrect": false, "image": null}, {"id": "zTdWg", "label": "C", "text": "$3.48$ g/$\\text{dm}^3$", "isCorrect": false, "image": null}, {"id": "1l7lz", "label": "D", "text": "$1.16 \\times 10^{-3}$ g/$\\text{dm}^3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the solubility of $\\text{BaSO}_4$ be $s$ mol/$\\text{dm}^3$.<br><br>The dissociation reaction is:<br>$\\text{BaSO}_4(s) \\rightleftharpoons \\text{Ba}^{2+}(aq) + \\text{SO}_4^{2-}(aq)$<br><br>The solubility product $K_{sp}$ is given by:<br>$K_{sp} = [\\text{Ba}^{2+}][\\text{SO}_4^{2-}] = s \\times s = s^2$<br><br>Substituting the given value of $K_{sp}$:<br>$s^2 = 1.0 \\times 10^{-10}$<br>$s = 1.0 \\times 10^{-5}$ mol/$\\text{dm}^3$<br><br>To find the solubility in g/$\\text{dm}^3$, multiply the molar solubility by the molar mass of $\\text{BaSO}_4$:<br>Solubility = $s \\times \\text{Molar mass}$<br>Solubility = $1.0 \\times 10^{-5} \\times 233$<br>Solubility = $2.33 \\times 10^{-3}$ g/$\\text{dm}^3$<br><br>Answer: $2.33 \\times 10^{-3}$ g/$\\text{dm}^3$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871beebf9280d7f9932dbd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the ionic concentration of sparingly soluble salt BA in mol dm ${ }^{-3}$ at 300 K when equilibrium is attained if solubility product of salt is $2.7 \\times 10^{-10}$ at same temperature.", "image": null}, "options": [{"id": "XkY0Q", "text": "$1.643 \\times 10^{-5}$", "image": null, "isCorrect": true}, {"id": "H4xQe", "text": "$1.123 \\times 10^{-5}$", "image": null, "isCorrect": false}, {"id": "gnXLK", "text": "$2.051 \\times 10^{-5}$", "image": null, "isCorrect": false}, {"id": "k1k4y", "text": "$2.263 \\times 10^{-5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The dissociation of the sparingly soluble salt BA is given by:<br><br>$BA \\rightleftharpoons B^+ + A^-$<br><br>Let the solubility of the salt be $S$ mol dm$^{-3}$. The concentrations of the ions at equilibrium are $[B^+] = S$ and $[A^-] = S$.<br><br>The solubility product $K_{sp}$ is given by:<br><br>$K_{sp} = [B^+][A^-] = S^2$<br><br>Substituting the given value of $K_{sp}$:<br><br>$S^2 = 2.7 \\times 10^{-10}$<br><br>$S = \\sqrt{2.7 \\times 10^{-10}}$<br><br>$S = 1.643 \\times 10^{-5}$ mol dm$^{-3}$<br><br>Answer: $1.643 \\times 10^{-5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdbbf9280d7f9932d10", "type": "singleCorrect", "level": 2,
