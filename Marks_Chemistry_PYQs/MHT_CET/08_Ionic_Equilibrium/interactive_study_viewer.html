e": null}], "correctValue": null, "solution": {"text": "For a weak monobasic acid, the dissociation constant $K_a$ is given by Ostwald's dilution law:<br><br>$K_a = C \\alpha^2$<br><br>where $C$ is the concentration and $\\alpha$ is the degree of dissociation.<br><br>Given $C_1 = 0.05$ M and $\\alpha_1 = 4\\% = 0.04$:<br><br>$K_a = 0.05 \\times (0.04)^2 = 0.05 \\times 0.0016 = 8 \\times 10^{-5}$<br><br>For the new concentration $C_2 = 0.1$ M, let the degree of dissociation be $\\alpha_2$:<br><br>$K_a = C_2 \\alpha_2^2$<br><br>$8 \\times 10^{-5} = 0.1 \\times \\alpha_2^2$<br><br>$\\alpha_2^2 = \\dfrac{8 \\times 10^{-5}}{0.1} = 8 \\times 10^{-4}$<br><br>$\\alpha_2 = \\sqrt{8 \\times 10^{-4}} = 2.828 \\times 10^{-2}$<br><br>The percent dissociation in $0.1$ M solution is $2.828\\%$.<br><br>Answer: $2.828\\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30e8c30a4553e1bdfb1", "type": "singleCorrect", "question": {"text": "Calculate the $[\\text{H}_3\\text{O}^+]$ if pH of the solution is $4.25$", "image": null}, "options": [{"id": "Yxv1i", "label": "A", "text": "$6.123 \\times 10^{-5}$ M", "isCorrect": false, "image": null}, {"id": "EARfR", "label": "B", "text": "$5.623 \\times 10^{-5}$ M", "isCorrect": true, "image": null}, {"id": "CpRZu", "label": "C", "text": "$4.508 \\times 10^{-5}$ M", "isCorrect": false, "image": null}, {"id": "fUdwL", "label": "D", "text": "$4.085 \\times 10^{-5}$ M", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\text{pH} = -\\log[\\text{H}_3\\text{O}^+]$<br><br>$[\\text{H}_3\\text{O}^+] = 10^{-\\text{pH}}$<br><br>$[\\text{H}_3\\text{O}^+] = 10^{-4.25}$<br><br>$[\\text{H}_3\\text{O}^+] = 10^{0.75} \\times 10^{-5}$<br><br>$[\\text{H}_3\\text{O}^+] = 5.623 \\times 10^{-5} \\text{ M}$<br><br>Answer: $5.623 \\times 10^{-5}$ M", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30c8c30a4553e1bdf9f", "type": "singleCorrect", "question": {"text": "If $[\\text{H}_3\\text{O}^+]$ of a solution is $1 \\times 10^{-4}$. What is the value of pOH at $298\\,\\text{K}$ ?", "image": null}, "options": [{"id": "Ksrhn", "label": "A", "text": "$4$", "isCorrect": false, "image": null}, {"id": "6ThBN", "label": "B", "text": "$10$", "isCorrect": true, "image": null}, {"id": "4ggFt", "label": "C", "text": "$12$", "isCorrect": false, "image": null}, {"id": "FdxQx", "label": "D", "text": "$14$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $[\\text{H}_3\\text{O}^+] = 1 \\times 10^{-4}$ M.<br><br>The pH of the solution is given by:<br><br>$\\text{pH} = -\\log[\\text{H}_3\\text{O}^+]$<br><br>$\\text{pH} = -\\log(1 \\times 10^{-4}) = 4$<br><br>At $298\\,\\text{K}$, the relationship between pH and pOH is:<br><br>$\\text{pH} + \\text{pOH} = 14$<br><br>Substituting the value of pH:<br><br>$4 + \\text{pOH} = 14$<br><br>$\\text{pOH} = 10$<br><br>Answer: $10$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fc8c30a4553e1bdeec", "type": "singleCorrect", "question": {"text": "What is the pH of solution containing $5 \\times 10^{-4}\\ \\text{M}\\ \\text{H}^+$ ion?", "image": null}, "options": [{"id": "yyOep", "label": "A", "text": "$4.699$", "isCorrect": false, "image": null}, {"id": "fcuHa", "label": "B", "text": "$3.301$", "isCorrect": true, "image": null}, {"id": "SHmPR", "label": "C", "text": "$5.401$", "isCorrect": false, "image": null}, {"id": "cxnZd", "label": "D", "text": "$3.725$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The pH of a solution is given by the negative logarithm of the hydrogen ion concentration:<br><br>$\\text{pH} = -\\log[\\text{H}^+]$<br><br>Given $[\\text{H}^+] = 5 \\times 10^{-4}\\ \\text{M}$<br><br>$\\text{pH} = -\\log(5 \\times 10^{-4})$<br><br>$\\text{pH} = -(\\log 5 + \\log 10^{-4})$<br><br>$\\text{pH} = -(\\log 5 - 4)$<br><br>$\\text{pH} = 4 - \\log 5$<br><br>Using the value $\\log 5 \\approx 0.699$:<br><br>$\\text{pH} = 4 - 0.699 = 3.301$<br><br>Answer: $3.301$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ee8c30a4553e1bde5d", "type": "singleCorrect", "question": {"text": "An organic monobasic acid has dissociation constant $1.96 \\times 10^{-8}$. What is its percentage dissociation in $0.01$ M solution ?", "image": null}, "options": [{"id": "IIH5v", "label": "A", "text": "$1.40\\,\\%$", "isCorrect": false, "image": null}, {"id": "kEiRK", "label": "B", "text": "$0.14\\,\\%$", "isCorrect": true, "image": null}, {"id": "ZV3FO", "label": "C", "text": "$2.4\\,\\%$", "isCorrect": false, "image": null}, {"id": "91JPz", "label": "D", "text": "$0.19\\,\\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a weak monobasic acid, the dissociation constant is given by $K_a = C\\alpha^2$, where $\\alpha$ is the degree of dissociation and $C$ is the concentration.<br><br>$\\alpha = \\sqrt{\\dfrac{K_a}{C}}$<br><br>Substituting the given values $K_a = 1.96 \\times 10^{-8}$ and $C = 0.01$ M:<br><br>$\\alpha = \\sqrt{\\dfrac{1.96 \\times 10^{-8}}{0.01}}$<br><br>$\\alpha = \\sqrt{1.96 \\times 10^{-6}}$<br><br>$\\alpha = 1.4 \\times 10^{-3}$<br><br>Percentage dissociation $= \\alpha \\times 100$<br><br>Percentage dissociation $= 1.4 \\times 10^{-3} \\times 100 = 0.14\\,\\%$<br><br>Answer: $0.14\\,\\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3268c30a4553e1be0b5", "type": "singleCorrect", "question": {"text": "What is the molarity of $\\text{H}_2\\text{SO}_4$ solution having $\\text{pH} = 4$ ?", "image": null}, "options": [{"id": "UfcNa", "label": "A", "text": "$4 \\times 10^{-1}\\ \\text{M}$", "isCorrect": false, "image": null}, {"id": "u8uBO", "label": "B", "text": "$4 \\times 10^{-2}\\ \\text{M}$", "isCorrect": false, "image": null}, {"id": "K0tpK", "label": "C", "text": "$5 \\times 10^{-5}\\ \\text{M}$", "isCorrect": true, "image": null}, {"id": "pysZs", "label": "D", "text": "$1 \\times 10^{-4}\\ \\text{M}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\text{pH} = 4$<br><br>$[\\text{H}^+] = 10^{-4}\\ \\text{M}$<br><br>$\\text{H}_2\\text{SO}_4$ is a strong diprotic acid and dissociates completely in dilute solutions:<br><br>$\\text{H}_2\\text{SO}_4 \\rightarrow 2\\text{H}^+ + \\text{SO}_4^{2-}$<br><br>Therefore, $[\\text{H}^+] = 2 \\times [\\text{H}_2\\text{SO}_4]$<br><br>$[\\text{H}_2\\text{SO}_4] = \\dfrac{[\\text{H}^+]}{2} = \\dfrac{10^{-4}}{2} = 5 \\times 10^{-5}\\ \\text{M}$<br><br>Answer: $5 \\times 10^{-5}\\ \\text{M}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3438c30a4553e1be1e6", "type": "singleCorrect", "question": {"text": "What is the pH of resulting solution when $20 \\text{ mL } \\dfrac{M}{10} \\text{ NaOH}$ and $10 \\text{ mL } \\dfrac{M}{10} \\text{ H}_2\\text{SO}_4$ are mixed together ?", "image": null}, "options": [{"id": "oQ2hA", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "RiD9x", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "blg9N", "label": "C", "text": "$7$", "isCorrect": true, "image": null}, {"id": "6Gi1Z", "label": "D", "text": "$10$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Millimoles of $\\text{NaOH} = 20 \\times \\dfrac{1}{10} = 2 \\text{ mmol}$<br><br>Millimoles of $\\text{OH}^{-} = 2 \\text{ mmol}$<br><br>Millimoles of $\\text{H}_2\\text{SO}_4 = 10 \\times \\dfrac{1}{10} = 1 \\text{ mmol}$<br><br>Millimoles of $\\text{H}^{+} = 1 \\times 2 = 2 \\text{ mmol}$<br><br>Since the millimoles of $\\text{H}^{+}$ and $\\text{OH}^{-}$ are equal, complete neutralization takes place.<br><br>The resulting solution contains $\\text{Na}_2\\text{SO}_4$, which is a salt of a strong acid and a strong base.<br><br>Therefore, the solution is neutral and its pH is $7$.<br><br>Answer: $7$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e18c30a4553e1bddd0", "type": "singleCorrect", "question": {"text": "Calculate pOH of 0.001M HCl solution.", "image": null}, "options": [{"id": "RC4cA", "label": "A", "text": "$11$", "isCorrect": true, "image": null}, {"id": "2EYcT", "label": "B", "text": "$10$", "isCorrect": false, "image": null}, {"id": "X0mkl", "label": "C", "text": "$12$", "isCorrect": false, "image": null}, {"id": "RxkvV", "label": "D", "text": "$3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "HCl is a strong acid and dissociates completely in aqueous solution.<br><br>$[H^+] = 0.001 \\text{ M} = 10^{-3} \\text{ M}$<br><br>$pH = -\\log[H^+] = -\\log(10^{-3}) = 3$<br><br>Using the relation $pH + pOH = 14$<br><br>$pOH = 14 - 3 = 11$<br><br>Answer: $11$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3198c30a4553e1be029", "type": "singleCorrect", "question": {"text": "The dissociation constant of weak acid HA is $1.5 \\times 10^{-5}$. Find the percent dissociation, containing $0.2$ moles per $2$ liters of solution.", "image": null}, "options": [{"id": "6waTV", "label": "A", "text": "$1.22\\%$", "isCorrect": true, "image": null}, {"id": "ybFgZ", "label": "B", "text": "$1.18\\%$", "isCorrect": false, "image": null}, {"id": "H8oMq", "label": "C", "text": "$1.14\\%$", "isCorrect": false, "image": null}, {"id": "FfbIl", "label": "D", "text": "$1.26\\%$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Concentration of the weak acid $C = \\dfrac{0.2}{2} = 0.1$ M<br><br>Dissociation constant $K_a = 1.5 \\times 10^{-5}$<br><br>For a weak acid, $K_a = C \\alpha^2$ (assuming $\\alpha \\ll 1$)<br><br>$\\alpha = \\sqrt{\\dfrac{K_a}{C}} = \\sqrt{\\dfrac{1.5 \\times 10^{-5}}{0.1}} = \\sqrt{1.5 \\times 10^{-4}}$<br><br>$\\alpha = 1.224 \\times 10^{-2}$<br><br>Percent dissociation $= \\alpha \\times 100 = 1.224 \\times 10^{-2} \\times 100 = 1.22\\%$<br><br>Answer: $1.22\\%$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36e8c30a4553e1be3ad", "type": "singleCorrect", "question": {"text": "A weak monobasic acid is 0.04 % dissociated in 0.25 M solution. What is pH of the solution?", "image": null}, "options": [{"id": "QrR8C", "label": "A", "text": "$2.5$", "isCorrect": false, "image": null}, {"id": "J48xu", "label": "B", "text": "$4$", "isCorrect": true, "image": null}, {"id": "1kGRH", "label": "C", "text": "$5$", "isCorrect": false, "image": null}, {"id": "rIJC3", "label": "D", "text": "$10$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given concentration of the weak monobasic acid, $C = 0.25$ M.<br><br>Degree of dissociation, $\\alpha = 0.04\\% = \\dfrac{0.04}{100} = 4 \\times 10^{-4}$.<br><br>For a weak monobasic acid, the hydrogen ion concentration is given by:<br><br>$[H^+] = C\\alpha$<br><br>Substituting the values:<br><br>$[H^+] = 0.25 \\times 4 \\times 10^{-4} = 10^{-4}$ M.<br><br>The pH of the solution is:<br><br>$pH = -\\log[H^+]$<br><br>$pH = -\\log(10^{-4}) = 4$.<br><br>Answer: $4$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3608c30a4553e1be317", "type": "singleCorrect", "question": {"text": "$2.8$ g of KOH is dissolved in a $500$ mL solution at $298$ K. What is the $p^H$ of solution ? (molar mass of KOH = $56$ g/mol)", "image": null}, "options": [{"id": "kbObo", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "OarFQ", "label": "B", "text": "$8$", "isCorrect": false, "image": null}, {"id": "ndFV6", "label": "C", "text": "$11$", "isCorrect": false, "image": null}, {"id": "PMJnt", "label": "D", "text": "$13$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Moles of KOH = $\\dfrac{2.8}{56} = 0.05$ mol<br><br>Volume of solution = $500$ mL = $0.5$ L<br><br>Molarity of KOH = $\\dfrac{0.05}{0.5} = 0.1$ M<br><br>Since KOH is a strong base, it dissociates completely in water.<br><br>$[OH^{-}] = 0.1$ M = $10^{-1}$ M<br><br>$pOH = -\\log[OH^{-}] = -\\log(10^{-1}) = 1$<br><br>At $298$ K, $pH + pOH = 14$<br><br>$pH = 14 - 1 = 13$<br><br>Answer: $13$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3608c30a4553e1be315", "type": "singleCorrect", "question": {"text": "What is the normal pH of human blood?", "image": null}, "options": [{"id": "LKGci", "label": "A", "text": "$7.0$", "isCorrect": false, "image": null}, {"id": "dpYlU", "label": "B", "text": "$6.9$", "isCorrect": false, "image": null}, {"id": "IFsJJ", "label": "C", "text": "$7.4$", "isCorrect": true, "image": null}, {"id": "aJRtZ", "label": "D", "text": "$8.1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The normal pH of human blood is strictly maintained in a narrow range between $7.35$ and $7.45$.<br><br>The average normal pH of human blood is $7.4$.<br><br>This slightly basic pH is essential for the proper functioning of enzymes and various physiological processes in the body.<br><br>Answer: $7.4$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c01bf9280d7f9932e67", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the ionisation constant of $0.08 \\mathrm{~mol~} \\mathrm{dm}^{-3}$ of a monobasic acid having $\\mathrm{pH}=2$", "image": null}, "options": [{"id": "YzrOb", "text": "$3.531 \\times 10^{-7}$", "image": null, "isCorrect": false}, {"id": "wVSdw", "text": "$2.081 \\times 10^{-6}$", "image": null, "isCorrect": false}, {"id": "w5Zyx", "text": "$3.456 \\times 10^{-8}$", "image": null, "isCorrect": false}, {"id": "sadtI", "text": "$1.25 \\times 10^{-3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given, concentration $c = 0.08 \\text{ mol dm}^{-3}$ and $\\text{pH} = 2$.<br><br>The concentration of hydrogen ions is given by:<br><br>$[\\text{H}^+] = 10^{-\\text{pH}} = 10^{-2} \\text{ mol dm}^{-3}$<br><br>For a weak monobasic acid, the ionization constant $K_a$ is approximated as:<br><br>$K_a = \\dfrac{[\\text{H}^+]^2}{c}$<br><br>Substituting the given values:<br><br>$K_a = \\dfrac{(10^{-2})^2}{0.08}$<br><br>$K_a = \\dfrac{10^{-4}}{8 \\times 10^{-2}}$<br><br>$K_a = \\dfrac{1}{8} \\times 10^{-2}$<br><br>$K_a = 0.125 \\times 10^{-2} = 1.25 \\times 10^{-3}$<br><br>Answer: $1.25 \\times 10^{-3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf0bf9280d7f9932dd1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the concentration of $\\mathrm{H}_3 \\mathrm{O}^{+}$ion if pH of solution is $2.8$.", "image": null}, "options": [{"id": "GJzNb", "text": "$1.585 \\times 10^{-3} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": true}, {"id": "MnS9q", "text": "$2.678 \\times 10^{-3} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "7d8OC", "text": "$1.012 \\times 10^{-3} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "zcOgJ", "text": "$3.027 \\times 10^{-3} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relationship between pH and hydronium ion concentration is given by:<br><br>$\\mathrm{pH} = -\\log_{10} [\\mathrm{H}_3\\mathrm{O}^+]$<br><br>Substituting the given pH value:<br><br>$2.8 = -\\log_{10} [\\mathrm{H}_3\\mathrm{O}^+]$<br><br>$\\log_{10} [\\mathrm{H}_3\\mathrm{O}^+] = -2.8$<br><br>$[\\mathrm{H}_3\\mathrm{O}^+] = \\text{antilog}(-2.8)$<br><br>To find the antilog, the number is written with a positive mantissa:<br><br>$-2.8 = -3 + 0.2 = \\bar{3}.2000$<br><br>$[\\mathrm{H}_3\\mathrm{O}^+] = \\text{antilog}(\\bar{3}.2000)$<br><br>Using the antilog table for $0.2000$, the value is $1.585$.<br><br>$[\\mathrm{H}_3\\mathrm{O}^+] = 1.585 \\times 10^{-3} \\mathrm{~mol~dm}^{-3}$<br><br>Answer: $1.585 \\times 10^{-3} \\mathrm{~mol~} \\mathrm{dm}^{-3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be1bf9280d7f9932d3b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is pH of weak dibasic acid, that is $2 \\%$ dissociated in its $\\mathrm{M} / 100$ solution at 298 K ?", "image": null}, "options": [{"id": "f1LwX", "text": "1.6990", "image": null, "isCorrect": false}, {"id": "zERyP", "text": "2.3979", "image": null, "isCorrect": false}, {"id": "ds9mD", "text": "3.3970", "image": null, "isCorrect": true}, {"id": "rLGIO", "text": "4.6990", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Concentration of the weak dibasic acid, $C = \\dfrac{1}{100} \\text{ M} = 0.01 \\text{ M}$<br>Degree of dissociation, $\\alpha = 2\\% = 0.02$<br><br>For a weak dibasic acid, assuming both protons dissociate to the given degree, the concentration of hydrogen ions is given by:<br>$[H^+] = 2 \\times C \\times \\alpha$<br><br>Substituting the given values:<br>$[H^+] = 2 \\times 0.01 \\times 0.02 = 4 \\times 10^{-4} \\text{ M}$<br><br>The pH of the solution is calculated as:<br>$\\text{pH} = -\\log_{10}[H^+]$<br>$\\text{pH} = -\\log_{10}(4 \\times 10^{-4})$<br>$\\text{pH} = 4 - \\log_{10} 4$<br><br>Using the standard value $\\log_{10} 4 \\approx 0.6021$:<br>$\\text{pH} = 4 - 0.6021 = 3.3979$<br><br>The closest given option is $3.3970$ (which is likely a slight typographical error in the question for $3.3979$).<br><br>Answer: 3.3970", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bccbf9280d7f9932c86", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Dissociation constant of 0.01 M weak acid is $10^{-4}$. What is percent dissociation of acid?", "image": null}, "options": [{"id": "WhBAA", "text": "$2 \\%$", "image": null, "isCorrect": false}, {"id": "x8Bnl", "text": "$6 \\%$", "image": null, "isCorrect": false}, {"id": "vcs9s", "text": "$10 \\%$", "image": null, "isCorrect": true}, {"id": "bHCmT", "text": "$1.5 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br><br>Concentration of weak acid, $C = 0.01$ M $= 10^{-2}$ M<br><br>Dissociation constant, $K_a = 10^{-4}$<br><br>The degree of dissociation $\\alpha$ for a weak acid is given by Ostwald's dilution law:<br><br>$\\alpha = \\sqrt{\\dfrac{K_a}{C}}$<br><br>Substituting the given values:<br><br>$\\alpha = \\sqrt{\\dfrac{10^{-4}}{10^{-2}}}$<br><br>$\\alpha = \\sqrt{10^{-2}} = 10^{-1} = 0.1$<br><br>Percent dissociation is calculated as:<br><br>$\\% \\alpha = \\alpha \\times 100$<br><br>$\\% \\alpha = 0.1 \\times 100 = 10 \\%$<br><br>Answer: $10 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbbbf9280d7f9932bf5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the pH of centimolar solution of monoacidic weak base. Which is $10 \\%$ dissociated in its aqueous solution?", "image": null}, "options": [{"id": "M2DsP", "text": "9", "image": null, "isCorrect": false}, {"id": "Igkvt", "text": "10", "image": null, "isCorrect": false}, {"id": "dSgGy", "text": "11", "image": null, "isCorrect": true}, {"id": "jbW4g", "text": "12", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concentration of the solution, $C = 0.01$ M (centimolar)<br><br>Degree of dissociation, $\\alpha = 10\\% = 0.1$<br><br>For a monoacidic weak base, the concentration of hydroxide ions is given by:<br><br>$[OH^{-}] = C \\alpha$<br><br>$[OH^{-}] = 0.01 \\times 0.1 = 10^{-3}$ M<br><br>$pOH = -\\log_{10}[OH^{-}] = -\\log_{10}(10^{-3}) = 3$<br><br>We know that $pH + pOH = 14$<br><br>$pH = 14 - 3 = 11$<br><br>Answer: 11", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b98bf9280d7f9932ab7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The pH of monoacidic base is 10 . Calculate its percentage dissociation in 0.01 M solution at 298 K ?", "image": null}, "options": [{"id": "3NFMD", "text": "$10 \\%$", "image": null, "isCorrect": false}, {"id": "EZ4MJ", "text": "$5 \\%$", "image": null, "isCorrect": false}, {"id": "QMauM", "text": "$2 \\%$", "image": null, "isCorrect": false}, {"id": "TU04t", "text": "$1 \\%$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given pH of the monoacidic base $= 10$<br><br>At $298$ K, we know that $\\text{pH} + \\text{pOH} = 14$<br><br>$\\text{pOH} = 14 - 10 = 4$<br><br>The concentration of hydroxide ions is given by:<br><br>$[OH^{-}] = 10^{-\\text{pOH}} = 10^{-4}$ M<br><br>For a weak monoacidic base, the hydroxide ion concentration is related to the degree of dissociation $\\alpha$ and concentration $C$ by:<br><br>$[OH^{-}] = C \\alpha$<br><br>Substituting the given values ($C = 0.01$ M):<br><br>$10^{-4} = 0.01 \\times \\alpha$<br><br>$\\alpha = \\dfrac{10^{-4}}{10^{-2}} = 10^{-2} = 0.01$<br><br>Percentage dissociation $= \\alpha \\times 100 = 0.01 \\times 100 = 1 \\%$<br><br>Answer: $1 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b89bf9280d7f9932a2a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A weak base is $5 \\%$ dissociated in its 0.01 M solution. Calculate the dissociation constant.", "image": null}, "options": [{"id": "PfaHe", "text": "$3.5 \\times 10^{-6}$", "image": null, "isCorrect": false}, {"id": "tQdNS", "text": "$2.0 \\times 10^{-5}$", "image": null, "isCorrect": false}, {"id": "DxX5l", "text": "$2.3 \\times 10^{-4}$", "image": null, "isCorrect": false}, {"id": "VgzlR", "text": "$2.5 \\times 10^{-5}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given:<br>Concentration of the weak base, $c = 0.01$ M<br>Degree of dissociation, $\\alpha = 5\\% = 0.05$<br><br>For a weak base, the dissociation constant $K_b$ is given by Ostwald's dilution law:<br>$K_b = \\dfrac{c \\alpha^2}{1 - \\alpha}$<br><br>Since $\\alpha$ is small, $1 - \\alpha \\approx 1$. The formula simplifies to:<br>$K_b = c \\alpha^2$<br><br>Substituting the given values:<br>$K_b = 0.01 \\times (0.05)^2$<br>$K_b = 10^{-2} \\times 25 \\times 10^{-4}$<br>$K_b = 25 \\times 10^{-6} = 2.5 \\times 10^{-5}$<br><br>Answer: $2.5 \\times 10^{-5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7abf9280d7f993299e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A weak monoacidic base dissociates to $1.5 \\%$ in 0.001 M solution at 298 K . Calculate the dissociation constant of weak base.", "image": null}, "options": [{"id": "q9EPo", "text": "$2.25 \\times 10^{-7}$", "image": null, "isCorrect": true}, {"id": "2sBnA", "text": "$3.05 \\times 10^{-7}$", "image": null, "isCorrect": false}, {"id": "DnJsP", "text": "$2.5 \\times 10^{-5}$", "image": null, "isCorrect": false}, {"id": "69GAx", "text": "$3.725 \\times 10^{-6}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, concentration $C = 0.001 \\text{ M} = 10^{-3} \\text{ M}$<br><br>Degree of dissociation $\\alpha = 1.5 \\% = 1.5 \\times 10^{-2}$<br><br>For a weak monoacidic base, the dissociation constant $K_b$ is given by Ostwald's dilution law:<br><br>$K_b = \\dfrac{C \\alpha^2}{1 - \\alpha}$<br><br>Since $\\alpha$ is very small compared to 1, $1 - \\alpha \\approx 1$.<br><br>$K_b = C \\alpha^2$<br><br>Substituting the values:<br><br>$K_b = 10^{-3} \\times (1.5 \\times 10^{-2})^2$<br><br>$K_b = 10^{-3} \\times 2.25 \\times 10^{-4}$<br><br>$K_b = 2.25 \\times 10^{-7}$<br><br>Answer: $2.25 \\times 10^{-7}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6dbf9280d7f993291a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the value of dissociation constant of weak monoacidic base if it dissociates to $2 \\%$ in 0.1 M solution?", "image": null}, "options": [{"id": "5dpfC", "text": "$6 \\times 10^{-5}$", "image": null, "isCorrect": false}, {"id": "dVZzM", "text": "$4 \\times 10^{-5}$", "image": null, "isCorrect": true}, {"id": "VzZyt", "text": "$2 \\times 10^{-5}$", "image": null, "isCorrect": false}, {"id": "IJufN", "text": "$1 \\times 10^{-5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Percentage dissociation = $2\\%$<br>Degree of dissociation, $\\alpha = \\dfrac{2}{100} = 0.02$<br>Concentration, $C = 0.1$ M<br><br>For a weak monoacidic base, the dissociation constant $K_b$ is given by Ostwald's dilution law:<br>$K_b = \\dfrac{C \\alpha^2}{1 - \\alpha}$<br><br>Since $\\alpha$ is very small compared to $1$, $1 - \\alpha \\approx 1$.<br>$K_b \\approx C \\alpha^2$<br><br>Substituting the values:<br>$K_b = 0.1 \\times (0.02)^2$<br>$K_b = 0.1 \\times 4 \\times 10^{-4}$<br>$K_b = 4 \\times 10^{-5}$<br><br>Answer: $4 \\times 10^{-5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b57bf9280d7f9932864", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following formulae is used to find the $\\left[\\mathrm{OH}^{-}\\right]$ion concentration of a weak monoacidic base?", "image": null}, "options": [{"id": "klrRR", "text": "$\\mathrm{K}_{\\mathrm{b}} \\cdot \\mathrm{c}$", "image": null, "isCorrect": false}, {"id": "cNFuQ", "text": "$\\sqrt{\\mathrm{K}_{\\mathrm{b}} \\cdot \\mathrm{c}}$", "image": null, "isCorrect": true}, {"id": "EnDGF", "text": "$\\sqrt{\\frac{K_b}{c}}$", "image": null, "isCorrect": false}, {"id": "8kPLs", "text": "$\\sqrt{K_b}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider a weak monoacidic base $\\mathrm{BOH}$ with initial concentration $c$ and degree of dissociation $\\alpha$.<br><br>The dissociation equilibrium is:<br>$\\mathrm{BOH} \\rightleftharpoons \\mathrm{B}^{+} + \\mathrm{OH}^{-}$<br><br>At equilibrium, the concentrations are:<br>$[\\mathrm{BOH}] = c(1-\\alpha)$<br>$[\\mathrm{B}^{+}] = c\\alpha$<br>$[\\mathrm{OH}^{-}] = c\\alpha$<br><br>The base dissociation constant $K_b$ is given by:<br>$K_b = \\dfrac{[\\mathrm{B}^{+}][\\mathrm{OH}^{-}]}{[\\mathrm{BOH}]} = \\dfrac{(c\\alpha)(c\\alpha)}{c(1-\\alpha)} = \\dfrac{c\\alpha^2}{1-\\alpha}$<br><br>For a weak base, $\\alpha$ is very small compared to $1$, so $1-\\alpha \\approx 1$.<br><br>$K_b = c\\alpha^2 \\Rightarrow \\alpha = \\sqrt{\\dfrac{K_b}{c}}$<br><br>The concentration of hydroxide ions is:<br>$[\\mathrm{OH}^{-}] = c\\alpha = c\\sqrt{\\dfrac{K_b}{c}} = \\sqrt{K_b \\cdot c}$<br><br>Answer: $\\sqrt{\\mathrm{K}_{\\mathrm{b}} \\cdot \\mathrm{c}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4bbf9280d7f99327ef", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the value of pH of a NaOH solution that dissociates $2 \\%$ in its 0.01 M solution?", "image": null}, "options": [{"id": "gcZGZ", "text": "$9.704$", "image": null, "isCorrect": false}, {"id": "zhCRq", "text": "$10.301$", "image": null, "isCorrect": true}, {"id": "64ktW", "text": "$8.621$", "image": null, "isCorrect": false}, {"id": "djCo4", "text": "$8.750$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concentration of NaOH, $C = 0.01$ M<br><br>Degree of dissociation, $\\alpha = 2\\% = 0.02$<br><br>The concentration of hydroxide ions is given by:<br><br>$[OH^{-}] = C \\alpha = 0.01 \\times 0.02 = 2 \\times 10^{-4}$ M<br><br>$\\text{pOH} = -\\log_{10}[OH^{-}] = -\\log_{10}(2 \\times 10^{-4})$<br><br>$\\text{pOH} = 4 - \\log_{10}2 = 4 - 0.301 = 3.699$<br><br>$\\text{pH} = 14 - \\text{pOH} = 14 - 3.699 = 10.301$<br><br>Answer: $10.301$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b39bf9280d7f9932742", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "4 gram of NaOH is added in water to form 500 mL solution at 298 K .\nWhat is pH of solution? (Molar mass of $\\mathrm{NaOH}=40 \\mathrm{~g} \\mathrm{~mol}^{-1}$ )", "image": null}, "options": [{"id": "j0etm", "text": "$8.6990$", "image": null, "isCorrect": false}, {"id": "StITB", "text": "$10.3010$", "image": null, "isCorrect": false}, {"id": "x2NQh", "text": "$10.6990$", "image": null, "isCorrect": false}, {"id": "9desv", "text": "$13.3010$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Number of moles of NaOH = $\\dfrac{4}{40} = 0.1$ mol<br><br>Volume of solution = $500$ mL = $0.5$ L<br><br>Molarity of NaOH = $\\dfrac{0.1}{0.5} = 0.2$ M<br><br>Since NaOH is a strong base, it dissociates completely.<br><br>$[\\text{OH}^{-}] = 0.2$ M<br><br>$\\text{pOH} = -\\log_{10}[\\text{OH}^{-}] = -\\log_{10}(0.2)$<br><br>$\\text{pOH} = -\\log_{10}(2 \\times 10^{-1}) = 1 - \\log_{10}2$<br><br>$\\text{pOH} = 1 - 0.3010 = 0.6990$<br><br>$\\text{pH} = 14 - \\text{pOH} = 14 - 0.6990 = 13.3010$<br><br>Answer: $13.3010$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b17bf9280d7f9932637", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If pH of solution changes from 4 to 5 . then the $\\mathrm{H}_3 \\mathrm{O}^{+}$ion concentration of solution", "image": null}, "options": [{"id": "gjRhD", "text": "decreases by one times", "image": null, "isCorrect": false}, {"id": "uKFFr", "text": "increases by one times", "image": null, "isCorrect": false}, {"id": "8Qvty", "text": "increases by 10 times", "image": null, "isCorrect": false}, {"id": "7Cnon", "text": "decreases by 10 times", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\text{pH} = -\\log_{10}[\\mathrm{H}_3\\mathrm{O}^{+}]$<br><br>For initial $\\text{pH} = 4$, $[\\mathrm{H}_3\\mathrm{O}^{+}]_1 = 10^{-4} \\text{ M}$<br><br>For final $\\text{pH} = 5$, $[\\mathrm{H}_3\\mathrm{O}^{+}]_2 = 10^{-5} \\text{ M}$<br><br>Taking the ratio of the concentrations:<br><br>$\\dfrac{[\\mathrm{H}_3\\mathrm{O}^{+}]_1}{[\\mathrm{H}_3\\mathrm{O}^{+}]_2} = \\dfrac{10^{-4}}{10^{-5}} = 10$<br><br>$[\\mathrm{H}_3\\mathrm{O}^{+}]_2 = \\dfrac{[\\mathrm{H}_3\\mathrm{O}^{+}]_1}{10}$<br><br>Thus, the $\\mathrm{H}_3\\mathrm{O}^{+}$ ion concentration decreases by $10$ times.<br><br>Answer: decreases by 10 times", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b02bf9280d7f993258e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The pH of a sample of vinegar is 3.76. Calculate the concentration of hydrogen ion in it in $\\mathrm{mol~} \\mathrm{dm}^{-3}$ ?", "image": null}, "options": [{"id": "qsQbo", "text": "$1.97 \\times 10^{-4}$", "image": null, "isCorrect": false}, {"id": "Bbpxk", "text": "$1.738 \\times 10^{-4}$", "image": null, "isCorrect": true}, {"id": "vJ7cK", "text": "$1.84 \\times 10^{-4}$", "image": null, "isCorrect": false}, {"id": "h7h6g", "text": "$1.283 \\times 10^{-4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The relationship between pH and hydrogen ion concentration is given by:<br><br>$\\text{pH} = -\\log_{10} [\\text{H}^+]$<br><br>Substituting the given pH value:<br><br>$3.76 = -\\log_{10} [\\text{H}^+]$<br><br>$\\log_{10} [\\text{H}^+] = -3.76$<br><br>To find the concentration, we take the antilog:<br><br>$[\\text{H}^+] = \\text{antilog}(-3.76)$<br><br>$[\\text{H}^+] = \\text{antilog}(\\bar{4}.24)$<br><br>From the antilog table, the value for $0.24$ is $1.738$. Therefore:<br><br>$[\\text{H}^+] = 1.738 \\times 10^{-4} \\text{ mol dm}^{-3}$<br><br>Answer: $1.738 \\times 10^{-4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214320aee93fa0796debe", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Calculate the pH of 0.01 M sulphuric acid.", "image": null}, "options": [{"id": "h4kuS", "text": "1.699", "image": null, "isCorrect": true}, {"id": "Gdqjl", "text": "2.00", "image": null, "isCorrect": false}, {"id": "ybvmT", "text": "0.699", "image": null, "isCorrect": false}, {"id": "JEi8r", "text": "3.398", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Sulphuric acid is a strong diprotic acid and dissociates completely in aqueous solution.<br><br>$H_2SO_4 \\rightarrow 2H^+ + SO_4^{2-}$<br><br>Concentration of $H_2SO_4 = 0.01$ M<br><br>$[H^+] = 2 \\times 0.01 = 0.02$ M<br><br>pH = $-\\log_{10}[H^+]$<br><br>pH = $-\\log_{10}(0.02)$<br><br>pH = $-\\log_{10}(2 \\times 10^{-2})$<br><br>pH = $2 - \\log_{10}2$<br><br>pH = $2 - 0.3010 = 1.699$<br><br>Answer: 1.699", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141f0aee93fa0796de23", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "An aqueous solution of strong monoacidic base is of $1 \\times 10^{-4} \\mathrm{M}$. What is the value of pH at $25^{\\circ} \\mathrm{C} \\cdot$ ?", "image": null}, "options": [{"id": "4e1vo", "text": "7", "image": null, "isCorrect": false}, {"id": "hMu4C", "text": "4", "image": null, "isCorrect": false}, {"id": "WV2wn", "text": "3", "image": null, "isCorrect": false}, {"id": "WUxIv", "text": "10", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a strong monoacidic base, the concentration of hydroxide ions is equal to the concentration of the base.<br><br>$[\\mathrm{OH}^{-}] = 1 \\times 10^{-4} \\mathrm{M}$<br><br>$\\mathrm{pOH} = -\\log_{10}[\\mathrm{OH}^{-}]$<br><br>$\\mathrm{pOH} = -\\log_{10}(1 \\times 10^{-4}) = 4$<br><br>At $25^{\\circ} \\mathrm{C}$, $\\mathrm{pH} + \\mathrm{pOH} = 14$<br><br>$\\mathrm{pH} = 14 - 4 = 10$<br><br>Answer: 10", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214120aee93fa0796ddbb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "The dissociation constant of a weak monobasic acid is $3.2 \\times 10^{-4}$. Calculate the degree of dissociation in its 0.04 M solution.", "image": null}, "options": [{"id": "iDvQ8", "text": "0.0128", "image": null, "isCorrect": false}, {"id": "RiwKp", "text": "0.0151", "image": null, "isCorrect": false}, {"id": "DzReX", "text": "0.078", "image": null, "isCorrect": false}, {"id": "50h4W", "text": "0.089", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given:<br>$K_a = 3.2 \\times 10^{-4}$<br>$c = 0.04$ M<br><br>Using Ostwald's dilution law for a weak monobasic acid, the dissociation constant is given by:<br>$K_a = c \\alpha^2$<br><br>Rearranging the formula to solve for the degree of dissociation $\\alpha$:<br>$\\alpha = \\sqrt{\\dfrac{K_a}{c}}$<br><br>Substituting the given values:<br>$\\alpha = \\sqrt{\\dfrac{3.2 \\times 10^{-4}}{0.04}}$<br><br>$\\alpha = \\sqrt{80 \\times 10^{-4}}$<br><br>$\\alpha = 8.94 \\times 10^{-2}$<br><br>$\\alpha = 0.0894 \\approx 0.089$<br><br>Answer: 0.089", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214100aee93fa0796ddb1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "A buffer solution is prepared by mixing $0.2 \\mathrm{M} \\mathrm{NH} \\mathrm{O}_4 \\mathrm{OH}$ and $1 \\mathrm{M} \\mathrm{NH}_4 \\mathrm{Cl}$.\r\nWhat is the pH value of buffer solution?\r\n(Give $\\mathrm{pK}_{\\mathrm{b}}=7.744$ )", "image": null}, "options": [{"id": "mT9UR", "text": "5.56", "image": null, "isCorrect": true}, {"id": "VaPOv", "text": "6.99", "image": null, "isCorrect": false}, {"id": "bdPon", "text": "8.44", "image": null, "isCorrect": false}, {"id": "Vgr6J", "text": "9.56", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a basic buffer solution, the Henderson-Hasselbalch equation is given by:<br><br>$\\mathrm{pOH} = \\mathrm{pK}_{\\mathrm{b}} + \\log_{10} \\left( \\dfrac{[\\mathrm{Salt}]}{[\\mathrm{Base}]} \\right)$<br><br>Substituting the given values:<br><br>$\\mathrm{pOH} = 7.744 + \\log_{10} \\left( \\dfrac{1}{0.2} \\right)$<br><br>$\\mathrm{pOH} = 7.744 + \\log_{10}(5)$<br><br>Using $\\log_{10}(5) \\approx 0.699$:<br><br>$\\mathrm{pOH} = 7.744 + 0.699 = 8.443$<br><br>The relationship between $\\mathrm{pH}$ and $\\mathrm{pOH}$ is:<br><br>$\\mathrm{pH} + \\mathrm{pOH} = 14$<br><br>$\\mathrm{pH} = 14 - 8.443 = 5.557$<br><br>Rounding off to two decimal places, we get $\\mathrm{pH} \\approx 5.56$.<br><br>Answer: 5.56", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fd0aee93fa0796dd1f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "What is pH of a centimolar solution of $\\mathrm{H}_2 \\mathrm{SO}_4$ ?", "image": null}, "options": [{"id": "mj9uB", "text": "1.7", "image": null, "isCorrect": true}, {"id": "7NL3w", "text": "2.0", "image": null, "isCorrect": false}, {"id": "QDsNk", "text": "3.2", "image": null, "isCorrect": false}, {"id": "Gu5lM", "text": "4.5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concentration of $\\mathrm{H}_2\\mathrm{SO}_4 = 0.01$ M (centimolar solution).<br><br>$\\mathrm{H}_2\\mathrm{SO}_4$ is a strong diprotic acid and dissociates completely as:<br><br>$\\mathrm{H}_2\\mathrm{SO}_4 \\rightarrow 2\\mathrm{H}^+ + \\mathrm{SO}_4^{2-}$<br><br>$[\\mathrm{H}^+] = 2 \\times 0.01 = 0.02$ M<br><br>$\\mathrm{pH} = -\\log_{10}[\\mathrm{H}^+]$<br><br>$\\mathrm{pH} = -\\log_{10}(2 \\times 10^{-2})$<br><br>$\\mathrm{pH} = 2 - \\log_{10}2$<br><br>$\\mathrm{pH} = 2 - 0.3010 = 1.699 \\approx 1.7$<br><br>Answer: 1.7", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139e0aee93fa0796da30", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Dissociation constant and degree of dissociation of weak acid are $1.8 \\times 10^{-5}$ and 0.03 respectively. What will be the concentration of solution of weak acid?", "image": null}, "options": [{"id": "TBD61", "text": "0.2 M", "image": null, "isCorrect": false}, {"id": "VLIUg", "text": "$\\quad 0.02 \\mathrm{M}$", "image": null, "isCorrect": true}, {"id": "QbHS5", "text": "$\\quad 0.5 \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "YXZCg", "text": "0.05 M", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a weak acid, the dissociation constant is given by Ostwald's dilution law:<br><br>$K_{a} = \\dfrac{C \\alpha^{2}}{1 - \\alpha}$<br><br>Since $\\alpha = 0.03$ is very small compared to $1$, we can approximate $1 - \\alpha \\approx 1$.<br><br>$K_{a} = C \\alpha^{2}$<br><br>Rearranging for concentration $C$:<br><br>$C = \\dfrac{K_{a}}{\\alpha^{2}}$<br><br>Substituting the given values $K_{a} = 1.8 \\times 10^{-5}$ and $\\alpha = 0.03$:<br><br>$C = \\dfrac{1.8 \\times 10^{-5}}{(0.03)^{2}}$<br><br>$C = \\dfrac{1.8 \\times 10^{-5}}{9 \\times 10^{-4}}$<br><br>$C = 0.2 \\times 10^{-1}$<br><br>$C = 0.02 \\text{ M}$<br><br>Answer: $\\quad 0.02 \\mathrm{M}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139a0aee93fa0796da14", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "What is the pOH of millimolar solution of $\\mathrm{Ca}(\\mathrm{OH})_2$ ?", "image": null}, "options": [{"id": "m5JOc", "text": "2.7", "image": null, "isCorrect": true}, {"id": "omrJS", "text": "10.3", "image": null, "isCorrect": false}, {"id": "WKaQo", "text": "12.3", "image": null, "isCorrect": false}, {"id": "D5xMQ", "text": "11.3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concentration of $\\mathrm{Ca}(\\mathrm{OH})_2 = 1 \\text{ mM} = 10^{-3} \\text{ M}$<br><br>$\\mathrm{Ca}(\\mathrm{OH})_2$ dissociates completely as:<br><br>$\\mathrm{Ca}(\\mathrm{OH})_2 \\rightarrow \\mathrm{Ca}^{2+} + 2\\mathrm{OH}^-$<br><br>Concentration of $\\mathrm{OH}^-$ ions is:<br><br>$[\\mathrm{OH}^-] = 2 \\times 10^{-3} \\text{ M}$<br><br>$\\text{pOH} = -\\log[\\mathrm{OH}^-]$<br><br>$\\text{pOH} = -\\log(2 \\times 10^{-3})$<br><br>$\\text{pOH} = 3 - \\log 2$<br><br>$\\text{pOH} = 3 - 0.3 = 2.7$<br><br>Answer: 2.7", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138c0aee93fa0796d9a2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Calculate the $[\\mathrm{OH}]$ if pOH of solution is 4.94", "image": null}, "options": [{"id": "APLpC", "text": "$2.356 \\times 10^{-5} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "SbPaW", "text": "$1.881 \\times 10^{-5} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "YK8te", "text": "$\\quad 1.417 \\times 10^{-5} \\mathrm{M}$", "image": null, "isCorrect": false}, {"id": "IbXSk", "text": "$1.148 \\times 10^{-5} \\mathrm{M}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $\\mathrm{pOH} = 4.94$<br><br>We know that $\\mathrm{pOH} = -\\log[\\mathrm{OH}^{-}]$<br><br>$-\\log[\\mathrm{OH}^{-}] = 4.94$<br><br>$[\\mathrm{OH}^{-}] = 10^{-4.94}$<br><br>$[\\mathrm{OH}^{-}] = 10^{-5 + 0.06} = 10^{0.06} \\times 10^{-5}$<br><br>Since $\\log(1.148) \\approx 0.06$, we have $10^{0.06} \\approx 1.148$<br><br>Therefore, $[\\mathrm{OH}^{-}] = 1.148 \\times 10^{-5} \\mathrm{M}$<br><br>Answer: $1.148 \\times 10^{-5} \\mathrm{M}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213620aee93fa0796d85e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Calculate pH of 0.002 M KOH solution.", "image": null}, "options": [{"id": "sO1tG", "text": "10.4", "image": null, "isCorrect": false}, {"id": "tkgx3", "text": "11.3", "image": null, "isCorrect": true}, {"id": "28qIg", "text": "12.4", "image": null, "isCorrect": false}, {"id": "csTlY", "text": "13.2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "KOH is a strong base and dissociates completely in aqueous solution.<br><br>$[OH^{-}] = 0.002 \\text{ M} = 2 \\times 10^{-3} \\text{ M}$<br><br>$pOH = -\\log[OH^{-}] = -\\log(2 \\times 10^{-3})$<br><br>$pOH = 3 - \\log 2 = 3 - 0.3 = 2.7$<br><br>$pH = 14 - pOH = 14 - 2.7 = 11.3$<br><br>Answer: 11.3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626c0279619d9d8a3468", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Calculate the $\\mathrm{pH}$ of $0.01 \\mathrm{M}$ strong dibasic acid.", "image": null}, "options": [{"id": "b9Le1", "text": "$5.5$", "image": null, "isCorrect": false}, {"id": "eqEdM", "text": "$2.5$", "image": null, "isCorrect": false}, {"id": "PpN4Q", "text": "$2.0$", "image": null, "isCorrect": false}, {"id": "OyWfV", "text": "$1.7$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & {\\left[\\mathrm{H}_3 \\mathrm{O}^{+}\\right]=2 \\times \\mathrm{c}=2 \\times 0.01 \\mathrm{M}=2 \\times 10^{-2} \\mathrm{M}} \\\\ & \\mathrm{pH}=-\\log _{10}\\left[\\mathrm{H}_3 \\mathrm{O}^{+}\\right] \\\\ & =-\\log _{10}\\left[2 \\times 10^{-2}\\right] \\\\ & =-\\log _{10} 2-\\log _{10} 10^{-2} \\\\ & =-\\log _{10} 2+2 \\\\ & =2-0.3010 \\\\ & \\mathrm{pH}=1.7 \\\\ & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625c0279619d9d8a33e3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "What is the $\\mathrm{pH}$ of solution containing $4.62 \\times 10^{-4} \\mathrm{M} \\mathrm{H}^{+}$ions?", "image": null}, "options": [{"id": "nBNTt", "text": "8.62", "image": null, "isCorrect": false}, {"id": "S5e6s", "text": "4.64", "image": null, "isCorrect": false}, {"id": "J4NqO", "text": "5.66", "image": null, "isCorrect": false}, {"id": "2OxkM", "text": "3.34", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{pH} & =-\\log _{10}\\left[\\mathrm{H}^{+}\\right] \\\\ & =-\\log _{10}\\left(4.62 \\times 10^{-4}\\right) \\\\ & =-\\left[\\log _{10} 4.62+\\left(\\log _{10} 10^{-4}\\right)\\right] \\\\ & =-[0.6646-4] \\\\ & =3.3354\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262220279619d9d8a3213", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "What is $\\mathrm{pH}$ of solution containing $50 \\mathrm{~mL}$ each of $0.1 \\mathrm{M}$ sodium acetate and $0.01 \\mathrm{M}$ acetic acid? $\\left(\\mathrm{pK}_{\\mathrm{a}} \\mathrm{CH}_3 \\mathrm{COOH}=4.50\\right)$", "image": null}, "options": [{"id": "uZrLc", "text": "$2.5$", "image": null, "isCorrect": false}, {"id": "4BfIi", "text": "$3.5$", "image": null, "isCorrect": false}, {"id": "03g8a", "text": "$4.5$", "image": null, "isCorrect": false}, {"id": "xdvZu", "text": "$5.5$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For acidic buffer solution\n$$\n\\begin{aligned}\n& \\mathrm{pH}=\\mathrm{pK}_{\\mathrm{a}}+\\log _{10} \\frac{[\\text { Salt }]}{[\\text { Acid }]} ; \\\\\n& \\mathrm{pH}=4.50+\\log _{10} \\frac{0.1}{0.01} \\\\\n& \\mathrm{pH}=4.50+\\log 10 ; \\mathrm{pH}=5.50\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262200279619d9d8a3202", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Find $\\left[\\mathrm{OH}^{-}\\right]$if a monoacidic base is $3 \\%$ ionised in its $0.04 \\mathrm{M}$ solution.", "image": null}, "options": [{"id": "VbziI", "text": "$3.1 \\times 10^{-2} \\mathrm{~mol} \\mathrm{~L}^{-1}$", "image": null, "isCorrect": false}, {"id": "VdZ02", "text": "$4.5 \\times 10^{-3} \\mathrm{~mol} \\mathrm{~L}^{-1}$", "image": null, "isCorrect": false}, {"id": "9ZOne", "text": "$9.0 \\times 10^{-2} \\mathrm{~mol} \\mathrm{~L}^{-1}$", "image": null, "isCorrect": false}, {"id": "TsNSD", "text": "$1.2 \\times 10^{-3} \\mathrm{~mol} \\mathrm{~L}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a monoacidic base,\n$$\n\\begin{aligned}\n& {\\left[\\mathrm{OH}^{-}\\right]=\\mathrm{c} \\times \\alpha} \\\\\n& {\\left[\\mathrm{OH}^{-}\\right]=0.04 \\times \\frac{3}{100}} \\\\\n& {\\left[\\mathrm{OH}^{-}\\right]=1.2 \\times 10^{-3} \\mathrm{~mol} \\mathrm{~L}^{-1}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262100279619d9d8a3183", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "What is the $\\mathrm{pH}$ of $0.005 \\mathrm{M} \\mathrm{NaOH}$ solution?", "image": null}, "options": [{"id": "k24YN", "text": "$2.30$", "image": null, "isCorrect": false}, {"id": "MqBBU", "text": "$12.6$", "image": null, "isCorrect": false}, {"id": "y5Q4r", "text": "$11.7$", "image": null, "isCorrect": true}, {"id": "ZAl0S", "text": "$3.2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{NaOH} \\longrightarrow \\mathrm{Na}^{+}+\\mathrm{OH}^{-} \\\\ & \\begin{array}{lll}0.005 \\mathrm{M} & 0.005 \\mathrm{M} & 0.005 \\mathrm{M}\\end{array} \\\\ & \\mathrm{pOH}=-\\log _{10}[\\mathrm{OH}] \\\\ & =-\\log _{10}[0.005] \\\\ & =-\\log _{10}\\left(5 \\times 10^{-3}\\right) \\\\ & =-\\left[\\log 10^{-3}+\\log 5\\right] \\\\ & =-[-3+0.699] \\\\ & =-[-2.301] \\\\ & =2.301 \\\\ & \\mathrm{pOH}+\\mathrm{pH}=14 \\\\ & \\therefore \\quad \\mathrm{pH}=14-2.301 \\\\ & =11.699 \\\\ & \\approx 11.7 \\\\ & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ff0279619d9d8a30fc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Calculate the $\\mathrm{pH}$ of $1.36 \\times 10^{-2} \\mathrm{M}$ solution of perchloric acid.", "image": null}, "options": [{"id": "IE20q", "text": "$1.43$", "image": null, "isCorrect": false}, {"id": "cjQxJ", "text": "$1.86$", "image": null, "isCorrect": true}, {"id": "qoyb0", "text": "$2.43$", "image": null, "isCorrect": false}, {"id": "rB8ch", "text": "$2.86$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Perchloric acid is a strong monobasic acid. Hence, $\\left[\\mathrm{H}_3 \\mathrm{O}^{+}\\right]=1.36 \\times 10^{-2} \\mathrm{M}$\n$$\n\\begin{aligned}\n\\therefore \\quad \\mathrm{pH} & =-\\log _{10}\\left[\\mathrm{H}_3 \\mathrm{O}^{+}\\right] \\\\\n& =-\\log _{10}\\left[1.36 \\times 10^{-2}\\right] \\\\\n& =-\\log _{10} 1.36-\\log _{10} 10^{-2} \\\\\n& =-\\log _{10} 1.36+2 \\\\\n& =2-0.1335 \\\\\n\\therefore \\quad \\mathrm{pH} & =1.86\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fb0279619d9d8a30da", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Which among the following amines has highest value of $\\mathrm{pK}_{\\mathrm{b}}$ ?", "image": null}, "options": [{"id": "bmx0A", "text": "$\\left(\\mathrm{CH}_3\\right)_2 \\mathrm{NH}$", "image": null, "isCorrect": false}, {"id": "3W66s", "text": "$\\left(\\mathrm{CH}_3\\right)_3 \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "9KqEW", "text": "$\\mathrm{CH}_3 \\mathrm{NH}_2$", "image": null, "isCorrect": false}, {"id": "pNYcE", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{NH}_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e90279619d9d8a304d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "Calculate the $\\mathrm{pH}$ of a buffer solution containing $0.01 \\mathrm{M}$ salt and $0.004 \\mathrm{M}$ weak acid.\n$\\left(\\mathrm{pK}_{\\mathrm{a}}=4.762\\right)$", "image": null}, "option
