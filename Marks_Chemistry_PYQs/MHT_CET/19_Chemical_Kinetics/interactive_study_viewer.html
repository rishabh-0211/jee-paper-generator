-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134e0aee93fa0796d7c1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Which of the following statements is correct about zero order reaction?", "image": null}, "options": [{"id": "jnKl9", "text": "Rate of reaction depends on rate constant.", "image": null, "isCorrect": false}, {"id": "rRsYi", "text": "Rate of reaction is independent of concentration of reactant.", "image": null, "isCorrect": true}, {"id": "NyMyW", "text": "Half life of reaction does not depend on initial concentration.", "image": null, "isCorrect": false}, {"id": "dJmzh", "text": "Unit of rate constant is time ${ }^{-1}$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a zero order reaction, the rate law is given by:<br><br>$\\text{Rate} = k[A]^0 = k$<br><br>This shows that the rate of the reaction is equal to the rate constant and is completely independent of the concentration of the reactant.<br><br>The half-life of a zero order reaction is given by:<br><br>$t_{1/2} = \\dfrac{[A]_0}{2k}$<br><br>This indicates that the half-life is directly proportional to the initial concentration of the reactant, so it does depend on it.<br><br>The unit of the rate constant $k$ for a zero order reaction is $\\text{mol L}^{-1} \\text{time}^{-1}$. The unit $\\text{time}^{-1}$ corresponds to a first order reaction.<br><br>Therefore, the correct statement is that the rate of reaction is independent of the concentration of the reactant.<br><br>Answer: Rate of reaction is independent of concentration of reactant.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134e0aee93fa0796d7be", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "What time is required for 100 g of reactant to reduce to 25 g in a first order reaction having half life 5760 year?", "image": null}, "options": [{"id": "UsU8S", "text": "4760 year", "image": null, "isCorrect": false}, {"id": "70tRS", "text": "8640 year", "image": null, "isCorrect": false}, {"id": "S69FL", "text": "2880 year", "image": null, "isCorrect": false}, {"id": "l6gad", "text": "11520 year", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Initial amount of reactant, $N_0 = 100$ g<br><br>Final amount of reactant, $N_t = 25$ g<br><br>Half-life, $t_{1/2} = 5760$ years<br><br>For a first order reaction, the amount remaining after $n$ half-lives is given by $N_t = \\dfrac{N_0}{2^n}$<br><br>$25 = \\dfrac{100}{2^n}$<br><br>$2^n = 4 \\Rightarrow n = 2$<br><br>Total time required, $t = n \\times t_{1/2}$<br><br>$t = 2 \\times 5760 = 11520$ years<br><br>Answer: 11520 year", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133f0aee93fa0796d746", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "In a first order reaction if concentartion of reactant drops from $0.8 \\mathrm{~mol} \\mathrm{~L}^{-1}$ to $0.4 \\mathrm{~mol} \\mathrm{~L}^{-1}$ in 15 minute. What is the time required to drop concentration from $0.1 \\mathrm{~mol} \\mathrm{~L}^{-1}$ to 0.025 mol $\\mathrm{L}^{-1}$.", "image": null}, "options": [{"id": "q9PWE", "text": "7.5 minute", "image": null, "isCorrect": false}, {"id": "P8jfO", "text": "15 minute", "image": null, "isCorrect": false}, {"id": "uzDnJ", "text": "30 minute", "image": null, "isCorrect": true}, {"id": "LhKm7", "text": "60 minute", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, the half-life $t_{1/2}$ is independent of the initial concentration.<br><br>The concentration drops from $0.8 \\mathrm{~mol} \\mathrm{~L}^{-1}$ to $0.4 \\mathrm{~mol} \\mathrm{~L}^{-1}$ (which is exactly half of the initial concentration) in $15$ minutes. Thus, $t_{1/2} = 15$ minutes.<br><br>The time required for the concentration to drop from $0.1 \\mathrm{~mol} \\mathrm{~L}^{-1}$ to $0.025 \\mathrm{~mol} \\mathrm{~L}^{-1}$ can be calculated by finding the number of half-lives.<br><br>$0.1 \\xrightarrow{t_{1/2}} 0.05 \\xrightarrow{t_{1/2}} 0.025$<br><br>This process takes $2$ half-lives.<br><br>Total time required $= 2 \\times t_{1/2} = 2 \\times 15 = 30$ minutes.<br><br>Answer: 30 minute", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262700279619d9d8a3488", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Calculate half life of first order reaction if rate constant of reaction is $2.772 \\times 10^{-3} \\mathrm{~s}^{-1}$", "image": null}, "options": [{"id": "bBCn0", "text": "$125 \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "nB3gF", "text": "$250 \\mathrm{~s}$", "image": null, "isCorrect": true}, {"id": "S2JBZ", "text": "$100 \\mathrm{~s}$", "image": null, "isCorrect": false}, {"id": "A8h2v", "text": "$150 \\mathrm{~s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{k}=\\frac{0.693}{\\mathrm{t}_{1 / 2}} \\\\ \\therefore \\quad \\mathrm{t}_{1 / 2} & =\\frac{0.693}{\\mathrm{k}}=\\frac{0.693}{2.772 \\times 10^{-3} \\mathrm{~s}^{-1}}=250 \\mathrm{~s}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2624a0279619d9d8a3353", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Which from following is the slope of the graph of $[\\mathrm{A}]_{\\mathrm{t}}$ versus time for zero order reaction?", "image": null}, "options": [{"id": "NO20X", "text": "$-\\mathrm{k}$", "image": null, "isCorrect": true}, {"id": "B1qlO", "text": "$\\mathrm{k}$", "image": null, "isCorrect": false}, {"id": "k5Avt", "text": "$\\frac{\\mathrm{k}}{2.303}$", "image": null, "isCorrect": false}, {"id": "jA21I", "text": "$\\frac{-\\mathrm{k}}{2.303}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/0P864b3VOTG4su9__G9SNRzssX2s730dYkgL6jtvb54.original.fullsize.png\"><br>\n\nVariation of $[\\mathrm{A}]_{\\mathrm{t}}$ with time $(\\mathrm{t})$ for a zero ordepreaction", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fe0279619d9d8a30f2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "What is half life time of a first order reaction if initial conc. of reactant is $0.01 \\mathrm{~mol} \\mathrm{~L}^{-1}$ and rate of reaction is $0.00352 \\mathrm{~mol} \\mathrm{~L}^{-1}$ minute ${ }^{-1}$ ?", "image": null}, "options": [{"id": "T88k9", "text": "1.969 minute", "image": null, "isCorrect": true}, {"id": "nF0zt", "text": "7.75 minute", "image": null, "isCorrect": false}, {"id": "KvJa2", "text": "16.69 minute", "image": null, "isCorrect": false}, {"id": "hyYMU", "text": "19.69 minute", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, rate $=\\mathrm{k}[\\mathrm{A}]$\n$$\n\\begin{aligned}\n& \\therefore \\quad \\begin{array}{l}\n0.00352 \\mathrm{~mol} \\mathrm{~L}^{-1} \\text { minute } \\\\\n\\mathrm{k}=0.352 \\text { minute }^{-1}\n\\end{array} \\\\\n& \\begin{aligned}\n\\text { Half-life period, }\\left(\\mathrm{t}_{1 / 2}\\right)=\\frac{0.693}{\\mathrm{k}} & =\\frac{0.693}{0.352} \\\\\n& =1.969 \\text { minute }\n\\end{aligned}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ec0279619d9d8a3068", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "Time required for $90 \\%$ completion of a first order reaction is ' $x$ ' minute. Calculate the time required to complete $99.9 \\%$ of the reaction at same temperature.", "image": null}, "options": [{"id": "56csC", "text": "$x$ minute", "image": null, "isCorrect": false}, {"id": "JnJjz", "text": "$2 x$ minute", "image": null, "isCorrect": false}, {"id": "A6X49", "text": "$3 x$ minute", "image": null, "isCorrect": true}, {"id": "GjND4", "text": "$\\frac{x}{2}$ minute", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{t}_{90 \\%} & =\\frac{2.303}{\\mathrm{k}} \\log _{10} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_t}=\\frac{2.303}{\\mathrm{k}} \\log _{10} \\frac{100}{10} \\\\ & =\\frac{2.303}{\\mathrm{k}} \\log _{10} 10 \\\\ \\mathrm{t}_{99.9 \\%} & =\\frac{2.303}{\\mathrm{k}} \\log _{10} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}}=\\frac{2.303}{\\mathrm{k}} \\log _{10} \\frac{100}{0.1} \\\\ & =\\frac{2.303}{\\mathrm{k}} \\log _{10} 1000 \\\\ \\frac{\\mathrm{t}_{99.9 \\%}}{\\mathrm{t}_{90 \\%}} & =\\frac{\\frac{2.303}{\\mathrm{k}} \\log _{10} 1000}{\\frac{2.303}{\\mathrm{k}} \\log _{10} 10}=\\frac{\\log _{10} 1000}{\\log _{10} 10}=\\frac{3}{1} \\\\ \\therefore \\quad \\mathrm{t}_{99.9 \\%} & =3 \\times \\mathrm{t}_{90 \\%}=3 x \\text { minute } \\quad \\text { (since, } \\mathrm{t}_{90 \\%}=x \\text { minute) }\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d70279619d9d8a2fc3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "The reaction, $3 \\mathrm{ClO}^{-} \\rightarrow \\mathrm{ClO}_3^{-}+2 \\mathrm{Cl}^{-}$occurs in two steps:\ni. $\\quad 2 \\mathrm{ClO}^{-} \\rightarrow \\mathrm{ClO}_2^{-}+\\mathrm{Cl}^{-}$\nii. $\\quad \\mathrm{ClO}_2^{-}+\\mathrm{ClO}^{-} \\rightarrow \\mathrm{ClO}_3^{-}+\\mathrm{Cl}^{-}$, the reaction intermediate is:", "image": null}, "options": [{"id": "6UEYQ", "text": "$\\mathrm{Cl}^{-}$", "image": null, "isCorrect": false}, {"id": "ygm8G", "text": "$\\mathrm{ClO}_2^{-}$", "image": null, "isCorrect": true}, {"id": "23r8s", "text": "$\\mathrm{ClO}_3^{-}$", "image": null, "isCorrect": false}, {"id": "VL42P", "text": "$\\mathrm{ClO}^{-}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{ClO}_2^{-}$is produced in step (i) and consumed in step (ii). Therefore, $\\mathrm{ClO}_2^{-}$is the reaction intermediate.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d60279619d9d8a2fbc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "What is the half life of a first order reaction if rate constant is $4.2 \\times 10^{-2}$ per day?", "image": null}, "options": [{"id": "mbJaG", "text": "5.0 day", "image": null, "isCorrect": false}, {"id": "h7g9I", "text": "16.5 day", "image": null, "isCorrect": true}, {"id": "qg6hA", "text": "28.0 day", "image": null, "isCorrect": false}, {"id": "Dx0jx", "text": "9.0 day", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, $\\mathrm{t}_{1 / 2}=\\frac{0.693}{\\mathrm{k}}=\\frac{0.693}{4.2 \\times 10^{-2}}=16.5$ days", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c50279619d9d8a2f39", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "The rate law for the reaction $\\mathrm{A}+\\mathrm{B} \\rightarrow$ product is given by rate $=k[A][B]$ Calculate $[A]$ if rate of reaction and rate constant are $0.25 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$ and $6.25 \\mathrm{~mol}^{-1} \\mathrm{dm}^3 \\mathrm{~s}^{-1}$ respectively $\\left[[\\mathrm{B}]=0.25 \\mathrm{~mol} \\mathrm{dm}^{-3}\\right]$", "image": null}, "options": [{"id": "9mBel", "text": "$0.22 \\mathrm{~mol} \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "R5WHc", "text": "$0.16 \\mathrm{~mol} \\mathrm{dm}^3$", "image": null, "isCorrect": true}, {"id": "STxbQ", "text": "$0.30 \\mathrm{~mol} \\mathrm{dm}^3$", "image": null, "isCorrect": false}, {"id": "reXQ1", "text": "$0.25 \\mathrm{~mol} \\mathrm{dm}^3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\text { rate }=\\mathrm{k}[\\mathrm{A}][\\mathrm{B}] & \\\\ \\therefore \\quad[\\mathrm{A}]=\\frac{\\text { rate }}{\\mathrm{k}[\\mathrm{B}]} & =\\frac{0.25 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}}{6.25 \\mathrm{~mol}^{-1} \\mathrm{dm}^3 \\mathrm{~s}^{-1} \\times 0.25 \\mathrm{~mol} \\mathrm{dm}^{-3}} \\\\ & =0.16 \\mathrm{~mol} \\mathrm{dm}^3\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2 _{1 / 2}=3.48 \\mathrm{~min}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260d00279619d9d8a2782", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "Half-life and rate constant for first order reaction are related by equation,", "image": null}, "options": [{"id": "71Lfg", "text": "$t_{1 / 2}=\\frac{k}{0.693}$", "image": null, "isCorrect": false}, {"id": "IvR5o", "text": "$\\mathrm{k}=\\frac{[\\mathrm{A}]_0-[\\mathrm{A}]_{\\mathrm{t}}}{\\mathrm{t}_{1 / 2}}$", "image": null, "isCorrect": false}, {"id": "iXXWB", "text": "$\\mathrm{t}_{1 / 2}=\\frac{0.693}{\\mathrm{k}}$", "image": null, "isCorrect": true}, {"id": "eAwNx", "text": "$\\mathrm{t}_{1 / 2}=\\frac{[\\mathrm{A}]_{\\mathrm{t}}-[\\mathrm{A}]_0}{\\mathrm{k}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For first order reaction,\n$\\mathrm{t}=\\frac{2.303}{\\mathrm{k}} \\cdot \\log \\frac{\\mathrm{a}_0}{\\mathrm{a}_0-\\mathrm{x}}$\nAt half-life, $x=a_0 / 2$\n$\\begin{aligned}\n& \\mathrm{t}=\\frac{2.303}{\\mathrm{k}} \\cdot \\log \\frac{\\mathrm{a}_0}{\\mathrm{a}_0-\\frac{\\mathrm{a}_0}{2}} \\\\\n& \\mathrm{t}_{1 / 2}=\\frac{2.303}{\\mathrm{k}} \\cdot \\log 2=\\frac{2.303 \\times 0.3010}{\\mathrm{k}} \\\\\n& \\mathrm{t}_{1 / 2}=\\frac{0.693}{\\mathrm{k}}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c10279619d9d8a270a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "Which of the following equations represents integrated rate law for zero order reaction?", "image": null}, "options": [{"id": "jE95L", "text": "$\\mathrm{k}=\\frac{[\\mathrm{A}]_{\\mathrm{t}}-[\\mathrm{A}]_0}{\\mathrm{t}}$", "image": null, "isCorrect": false}, {"id": "wQKYr", "text": "$\\mathrm{k}=\\frac{1}{\\mathrm{t}} \\log _{10} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}}$", "image": null, "isCorrect": false}, {"id": "bEKgf", "text": "$\\mathrm{k}=\\frac{[\\mathrm{A}]_0-[\\mathrm{A}]_{\\mathrm{t}}}{\\mathrm{t}}$", "image": null, "isCorrect": true}, {"id": "JV24C", "text": "$\\mathrm{k}=\\frac{\\mathrm{t}}{2.303} \\times \\log _{10} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let us consider a zero order reaction,\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/QXImv2P_CnB60zbSCsDdsPgHLNS7IFGlB_0wi-rKti0.original.fullsize.png\"><br>\n$$\n\\begin{aligned}\n& -\\frac{\\mathrm{d}[\\mathrm{A}]}{\\mathrm{dt}}=\\mathrm{k}[\\mathrm{A}]^0 \\\\\n& -\\frac{\\mathrm{d}[\\mathrm{A}]}{\\mathrm{dt}}=\\mathrm{k}[\\mathrm{A}]^0=\\mathrm{k} \\\\\n& -\\int \\mathrm{d}[\\mathrm{A}]=\\int \\mathrm{kdt} \\\\\n& -[\\mathrm{A}]_{\\mathrm{t}}=\\mathrm{kt}+\\mathrm{c} \\\\\n& \\text { at } \\mathrm{t}=0 \\quad \\quad[\\mathrm{~A}]_{\\mathrm{t}}=[\\mathrm{A}]_0 \\\\\n& -[\\mathrm{A}]_0=\\mathrm{k} \\times 0+\\mathrm{C} \\\\\n& \\mathrm{C}=-[\\mathrm{A}]_0\n\\end{aligned}\n$$\nOn substituting the value of $C$\n$$\n\\begin{aligned}\n& -[\\mathrm{A}]_{\\mathrm{t}}=\\mathrm{kt}-[\\mathrm{A}]_0 \\\\\n& {[\\mathrm{~A}]_{\\mathrm{t}}=[\\mathrm{A}]_0-\\mathrm{kt}} \\\\\n& \\mathrm{y}=\\mathrm{C}-\\mathrm{mx} \\\\\n& {[\\mathrm{A}]_0-[\\mathrm{A}]_{\\mathrm{t}}=\\mathrm{kt}} \\\\\n& \\mathrm{k}=\\frac{[\\mathrm{A}]_0-[\\mathrm{A}]_{\\mathrm{t}}}{\\mathrm{t}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260bd0279619d9d8a26ec", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "Which of the following represents integrated rate law equation for gas phase first order reaction, $\\mathrm{A}_{(\\mathrm{g})} \\rightarrow \\mathrm{B}_{(\\mathrm{g})}+\\mathrm{C}_{(\\mathrm{g})}$\nIf $\\mathrm{P}_{\\mathrm{i}}=$ initial pressure of $\\mathrm{A}$\n$\\mathrm{P}=$ total pressure of reaction mixture at time?", "image": null}, "options": [{"id": "qlawh", "text": "$\\mathrm{k}=2.303 \\times \\log _{10} \\frac{\\mathrm{P}_{\\mathrm{i}}}{2 \\mathrm{P}_{\\mathrm{i}}-\\mathrm{P}}$", "image": null, "isCorrect": false}, {"id": "PYy5l", "text": "$\\mathrm{k}=\\frac{2.303}{\\mathrm{t}} \\times \\log _{10} \\frac{\\mathrm{P}_{\\mathrm{i}}}{2 \\mathrm{P}_{\\mathrm{i}}-\\mathrm{P}}$", "image": null, "isCorrect": true}, {"id": "Bbyjo", "text": "$\\mathrm{k}=\\frac{1}{\\mathrm{t}} \\ln \\frac{2 \\mathrm{P}_{\\mathrm{i}}-\\mathrm{P}}{\\mathrm{P}_{\\mathrm{i}}}$", "image": null, "isCorrect": false}, {"id": "1YBvL", "text": "$\\mathrm{k}=\\frac{2.303}{\\mathrm{t}} \\times \\log _{10} \\frac{\\mathrm{P}_{\\mathrm{i}}-\\mathrm{P}}{\\mathrm{P}_{\\mathrm{i}}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{llcc} & \\mathrm{A}_{(\\mathrm{g})} \\longrightarrow & \\mathrm{B}_{(\\mathrm{g})}+\\mathrm{C}_{(\\mathrm{g})} \\\\ \\mathrm{t}=0 . & \\mathrm{P}_{\\mathrm{i}} & - & - \\\\ \\mathrm{t}=\\mathrm{t}, & \\mathrm{P}_{\\mathrm{i}}-\\mathrm{x} & \\mathrm{x} & \\mathrm{x}\\end{array}$\nTotal pressure of reaction mixture at time $\\mathrm{t}(\\mathrm{P})=\\mathrm{P}_{\\mathrm{i}}-\\mathrm{x}+\\mathrm{x}+\\mathrm{x}$\n$$\n\\begin{aligned}\n& \\mathrm{P}=\\mathrm{P}_{\\mathrm{i}}+\\mathrm{x} \\\\\n& \\mathrm{x}=\\mathrm{P}-\\mathrm{Pi}\n\\end{aligned}\n$$\nFor first order reaction,\n$$\n\\begin{aligned}\n& \\mathrm{K}=\\frac{2.303}{\\mathrm{t}} \\cdot \\log \\frac{\\mathrm{P}_{\\mathrm{i}}}{\\mathrm{P}_{\\mathrm{i}}-\\mathrm{x}} \\\\\n& =\\frac{2.303}{\\mathrm{t}} \\log \\frac{\\mathrm{P}_{\\mathrm{i}}}{\\mathrm{P}_{\\mathrm{i}}-\\left(\\mathrm{P}-\\mathrm{P}_{\\mathrm{i}}\\right)} \\\\\n& \\mathrm{K}=\\frac{2.303}{\\mathrm{t}} \\cdot \\log \\frac{\\mathrm{P}_{\\mathrm{i}}}{2 \\mathrm{P}_{\\mathrm{i}}-\\mathrm{P}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260860279619d9d8a2530", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "Which is rate constant of a first order reaction if 0.08 mole of reactant reduces to 0.02 mole in 23.03 minute?", "image": null}, "options": [{"id": "GU4D1", "text": "$0.2303 \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}, {"id": "PwNxC", "text": "$1.6021 \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}, {"id": "o4PE2", "text": "$0.4031 \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}, {"id": "nwP8Z", "text": "$0.06021 \\mathrm{~min}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{K}=\\frac{2.303}{\\mathrm{t}} \\log \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}} \\\\ & \\mathrm{K}=\\frac{2.303}{23.03} \\cdot \\log \\frac{0.08}{0.02} \\\\ & \\mathrm{~K}=\\frac{1}{10} \\log 4 \\\\ & =\\frac{2 \\log 2}{10}=0.0602 \\mathrm{~min}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260750279619d9d8a24a6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "For a reaction $\\mathrm{A} \\rightarrow$ product, rate constant is $2 \\times 10^{-2} \\mathrm{~s}^{-1}$. The initial concentration of $\\mathrm{A}$ is $1.0 \\mathrm{~mol} \\mathrm{dm}^{-3}$. What is the value of $\\log \\frac{1}{[\\mathrm{~A}]_{\\mathrm{t}}}$ after 100 seconds?", "image": null}, "options": [{"id": "QUo8p", "text": "$0.423 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "OFQiS", "text": "$0.135 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "0bF8W", "text": "$0.270 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "fqnv2", "text": "$0.868 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{k}=2 \\times 10^{-2} \\mathrm{~s}^{-1} \\text { (first order reaction) } \\\\ & 2.303 \\log \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}}=\\mathrm{kt} \\\\ & \\left([\\mathrm{A}]_0=1 \\mathrm{M}\\right) \\log \\frac{1}{[\\mathrm{~A}]_{\\mathrm{t}}}=\\frac{\\mathrm{k}}{2.303} \\times \\mathrm{t}=\\frac{2 \\times 10^{-2} \\times 100}{2.303}=0.868\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260610279619d9d8a2405", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "Identify the product $(\\mathrm{X})$ formed in the following reaction.\n$$\n\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{OH}+\\mathrm{CH}_3 \\mathrm{COOH} \\stackrel{\\mathrm{H}^{+}}{\\rightleftharpoons} \\mathrm{X}\n$$", "image": null}, "options": [{"id": "clxco", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{O}-\\mathrm{CO}-\\mathrm{CH}_3$", "image": null, "isCorrect": true}, {"id": "7S0in", "text": "$\\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{CH}_3$", "image": null, "isCorrect": false}, {"id": "pJFWH", "text": "$\\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{O}-\\mathrm{CH}_3$", "image": null, "isCorrect": false}, {"id": "QdJde", "text": "$\\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{COO}-\\mathrm{CH}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/tTC2lt3RA4lcQaF2KY1K_Cs4iqVyPHNT8p8qiw-D4es.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260610279619d9d8a2404", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "What is the half-life of a first order reaction if time required to decrease concentration of reactant from $1.0 \\mathrm{M}$ to $0.25 \\mathrm{M}$ is 10 hours?", "image": null}, "options": [{"id": "g3Wwm", "text": "12 hour", "image": null, "isCorrect": false}, {"id": "WBA5F", "text": "4 hour", "image": null, "isCorrect": false}, {"id": "UGWcD", "text": "5 hour", "image": null, "isCorrect": true}, {"id": "NHclG", "text": "10 hour", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For first order reaction\n$$\n\\mathrm{k}=\\frac{1}{\\mathrm{t}} \\ln \\frac{\\mathrm{A}_0}{\\mathrm{At}}=\\frac{1}{10} \\cdot \\ln \\frac{1}{0.25}=\\frac{\\ln 4}{10} \\mathrm{~h}^{-1}\n$$\nHalf-life, $\\mathrm{t}_{1 / 2}=\\frac{\\ln 2}{\\mathrm{k}}=\\frac{\\ln 2}{\\ln 4 / 10}=\\frac{10 \\cdot \\ln 2}{2 \\cdot \\ln 2}$\n$$\n\\mathrm{t}_{1 / 2}=5 \\text { hour }\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260600279619d9d8a23fa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "For a first order reaction, intercept of the graph between $\\log \\left(\\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}} \\mathrm{Y}\\right.$-axis) and time. (X-axis) is equal to", "image": null}, "options": [{"id": "cJ97N", "text": "$-\\frac{\\mathrm{k}}{2.303 \\mathrm{~K}}$", "image": null, "isCorrect": false}, {"id": "jGxNK", "text": "$-\\log [\\mathrm{A}]_0$", "image": null, "isCorrect": false}, {"id": "r5E0F", "text": "zero", "image": null, "isCorrect": true}, {"id": "M4kPH", "text": "$\\frac{2.303}{\\mathrm{~K}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For $1^{\\text {st }}$ order reaction,\n$2.303 \\log \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}}=\\mathrm{kt}$\n$$\n\\log \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}}=\\frac{\\mathrm{k}}{2.303} \\cdot \\mathrm{t}, \\mathrm{y}=\\mathrm{mx} ; \\quad \\mathrm{C}=0[\\text { Intercept }=0]\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260500279619d9d8a2379", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "Slope of the graph between rate (Y-axis) and [A] (X-axis) for the first order reaction is equal to", "image": null}, "options": [{"id": "vZw6n", "text": "$\\mathrm{k}$", "image": null, "isCorrect": true}, {"id": "pkvuX", "text": "$\\frac{2.303}{\\mathrm{k}}$", "image": null, "isCorrect": false}, {"id": "Smgpo", "text": "$\\frac{\\mathrm{k}}{2.303}$", "image": null, "isCorrect": false}, {"id": "SifEk", "text": "$-\\mathrm{k}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/yxiCjPK8pR4JErceicgfdYzZpQKxYIKNZejftnEK3XY.original.fullsize.png\"><br>\nFor first order reaction,\nRate law is\n$$\n\\begin{aligned}\n& \\text { Rate }=\\mathrm{k}[\\mathrm{A}]^1 \\\\\n& \\mathrm{y}=\\mathrm{m} \\cdot \\mathrm{x} \\\\\n& \\text { slope }=\\mathrm{m}=\\mathrm{k}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604d0279619d9d8a235f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "In a first order reaction, concentration of reactant is reduced to $(1 / 8)^{\\text {th }}$ of concentration in 23.03 minutes. What is half-life period of reaction?", "image": null}, "options": [{"id": "Lsxid", "text": "$25 \\mathrm{~min}$", "image": null, "isCorrect": false}, {"id": "EUvr4", "text": "$7.7 \\mathrm{~min}$", "image": null, "isCorrect": true}, {"id": "GpacF", "text": "$15 \\mathrm{~min}$", "image": null, "isCorrect": false}, {"id": "2FQvA", "text": "$30 \\mathrm{~min}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial concentration $\\mathrm{a}_0=\\mathrm{a}$ (let)\nFinal concentration $a_t=\\frac{a}{8}$\n$1^{\\text {st }}$ order reaction\n$$\n\\begin{aligned}\n& \\mathrm{k}=\\frac{2.303}{\\mathrm{t}} \\log \\frac{\\mathrm{a}_0}{\\mathrm{a}_{\\mathrm{t}}}=\\frac{2.303}{23.03} \\log \\frac{\\mathrm{a}}{\\mathrm{a} / 8} \\\\\n& \\mathrm{k}=\\frac{1}{10} \\log 8=\\frac{3}{10} \\log 2=0.3 \\log 2\n\\end{aligned}\n$$\nHalf -life $\\mathrm{t}_{1 / 2}=\\frac{2.303 \\log 2}{\\mathrm{k}}$\n$$\n\\begin{aligned}\n& =\\frac{2.303 \\times \\log }{0.3 \\log 2} \\\\\n& =7.7 \\mathrm{~min}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2603c0279619d9d8a22da", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "Half-life for a first order reaction is 6.93 hour. What is the time required for $80 \\%$ completion of the reaction?", "image": null}, "options": [{"id": "QUBAm", "text": "12 hours", "image": null, "isCorrect": false}, {"id": "fferk", "text": "18 hours", "image": null, "isCorrect": false}, {"id": "3An0b", "text": "6 hours", "image": null, "isCorrect": false}, {"id": "EFCNj", "text": "16 hours", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For first order reaction,\n$$\n\\mathrm{k}=\\frac{0.693}{\\mathrm{t}_{\\frac{1}{2}}}=\\frac{0.693}{6.93}=0.1 \\text { hour }^{-1}\n$$\nHere, $[\\mathrm{A}]_0=100,[\\mathrm{~A}]_{\\mathrm{t}}=100-80=20$\n$$\n\\begin{aligned}\n& \\text { Now, } \\mathrm{k}=\\frac{2.303}{\\mathrm{t}} \\log _{10} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}} \\\\\n& \\therefore \\mathrm{t}=\\frac{2.303}{0.1} \\log _{10} \\frac{100}{20}=23.03 \\times \\log _{10} 5=23.03 \\times 0.699 \\\\\n& =16.10 \\text { hours. }\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2602b0279619d9d8a224f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "What type of reaction order is followed by radioactive processes?", "image": null}, "options": [{"id": "dxIjD", "text": "0", "image": null, "isCorrect": false}, {"id": "vmdqV", "text": "1", "image": null, "isCorrect": true}, {"id": "CZkb8", "text": "2", "image": null, "isCorrect": false}, {"id": "PEG3f", "text": "1.5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "All radioactive processes are of first order", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260270279619d9d8a222c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "In a first order reaction concentration of reactant decreases from $20 \\mathrm{~m} \\mathrm{~mol}$ to $10 \\mathrm{~m} \\mathrm{~mol}$ in $1.151 \\mathrm{~min}$. What is rate constant?", "image": null}, "options": [{"id": "gB5LI", "text": "$1.15 \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}, {"id": "1vcqu", "text": "$3.0 \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}, {"id": "nXyW1", "text": "$5.50 \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}, {"id": "szOtT", "text": "$0.60 \\mathrm{~min}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "for 1st order reaction\n$$\n\\begin{aligned}\n& \\text { rate constant }(\\mathrm{k})=\\frac{2.303}{\\ell} \\log \\frac{\\mathrm{a}_{\\mathrm{o}}}{\\mathrm{a}_{\\mathrm{t}}} \\\\\n& \\mathrm{a}_{\\mathrm{o}}=\\text { Initial amount }=20 \\mathrm{~m} \\mathrm{~mol} \\\\\n& \\text { at }=\\text { final amount }=10 \\mathrm{~m} \\mathrm{~mol} \\\\\n& \\mathrm{k}=\\frac{2.303}{1.151} \\cdot \\log \\frac{20}{10} \\\\\n& =\\frac{2.303}{1.151} \\times \\log 2 \\\\\n& =\\frac{2.303 \\times .0 .3010}{1.151} \\\\\n& \\mathrm{k}=0.60 \\mathrm{~min}^{-1} \\\\\n&\n\\end{aligned}\nII $^{\\text {nd }}$ Method\nAs concentration decreases from $20 \\mathrm{~m} \\mathrm{~mol}$ to $10 \\mathrm{~m} \\mathrm{~mol}$ in $1.151 \\mathrm{~min}$ $\\ell_{1 / 2}=1.151 \\mathrm{~min}=\\frac{\\ell \\mathrm{n} 2}{\\mathrm{~K}}$ $\\mathrm{k}=\\frac{\\ln 2}{1.151}=\\frac{0.693}{1.151}$ $\\mathrm{k}=0.60 \\mathrm{~min}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260020279619d9d8a2100", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "A first order reaction is $75 \\%$ completed in 60 minutes, the time required for it's $50 \\%$ completion is.", "image": null}, "options": [{"id": "DZeYi", "text": "$120 \\mathrm{~min}$", "image": null, "isCorrect": false}, {"id": "VlC6x", "text": "$60 \\mathrm{~min}$", "image": null, "isCorrect": false}, {"id": "MKwhN", "text": "$40 \\mathrm{~min}$", "image": null, "isCorrect": false}, {"id": "Fi0xV", "text": "$30 \\mathrm{~min}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "i. $[\\mathrm{A}]_{0}=100, \\quad[\\mathrm{~A}]_{\\mathrm{t}}=100-75=25, \\mathrm{t}=60 \\mathrm{~min}$\nFor first order reaction,\n$\\mathrm{k}=\\frac{2.303}{\\mathrm{t}} \\log _{10} \\frac{[\\mathrm{A}]_{0}}{[\\mathrm{~A}]_{t}}$\n$\\therefore \\mathrm{k}=\\frac{2.303}{60 \\mathrm{~min}} \\log _{10} \\frac{100}{25}$\n$\\mathrm{k}=\\frac{2.303 \\times 0.6020}{60 \\mathrm{~min}}=0.0231 \\mathrm{~min}^{-1}$\nii. The time required for $50 \\%$ completion of reaction is,\n$\\mathrm{t}_{1 / 2}=\\frac{0.693}{0.0231 \\mathrm{~min}^{-1}}=30 \\mathrm{~min}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fef0279619d9d8a2069", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "For first order reaction the concentration of reactant decreases form $0 \\cdot 2$ to $0.1 \\mathrm{M}$ in 100 minutes. What is the rate constant of the reaction?", "image": null}, "options": [{"id": "AyLbk", "text": "$6.93 \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}, {"id": "DBUiM", "text": "$69 \\cdot 3 \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}, {"id": "FdRgM", "text": "$6.93 \\times 10^{-3} \\mathrm{~min}^{-1}$", "image": null, "isCorrect": true}, {"id": "Zsl09", "text": "$144 \\cdot 3 \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\n$\\begin{aligned}\n\\mathrm{k} &=\\frac{0.693}{\\mathrm{t}_{1 / 2}} \\text { (For first order reaction) } \\\\\n\\therefore \\mathrm{k} &=\\frac{0.693}{100 \\mathrm{~min}}=6.93 \\times 10^{-3} \\mathrm{~min}^{-1}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fef0279619d9d8a2068", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "A first order reaction is $25 \\%$ completed in 40 minutes. What is the rate constant $\\mathrm{k}$ for the reaction?", "image": null}, "options": [{"id": "vOk2I", "text": "$\\frac{2.303 \\times \\log 1 \\cdot 33}{40}$", "image": null, "isCorrect": true}, {"id": "LLig0", "text": "$2 \\cdot 303 \\times \\log \\frac{4}{3}$", "image": null, "isCorrect": false}, {"id": "Mb9sC", "text": "$\\frac{2 \\cdot 303}{40} \\times \\log \\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "xWMx2", "text": "$\\frac{2 \\cdot 303 \\times \\log 4}{40 \\times 3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(B)\n$\\begin{aligned}[\\mathrm{A}]_{0} &=100,[\\mathrm{~A}]_{\\mathrm{t}}=100-25=75, \\mathrm{t}=40 \\min \\\\ \\mathrm{k} &=\\frac{2.303}{\\mathrm{t}} \\log _{10} \\frac{[\\mathrm{A}]_{0}}{[\\mathrm{~A}]_{\\mathrm{t}}} \\\\ \\therefore \\mathrm{k} &=\\frac{2.303}{40} \\log _{10} \\frac{100}{75}=\\frac{2.303 \\times \\log 1.33}{40} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fe20279619d9d8a2001", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "Half-life of first order reaction X \\longrightarrow $\\mathrm{Y}+\\mathrm{Z}$ is 3 minutes. What is the time required to reduce the concentration of ${ }^{\\prime} \\mathrm{X}^{\\prime}$ by $90 \\%$ of it's initial concentration?", "image": null}, "options": [{"id": "5aFiN", "text": "$4 \\cdot 12$ minutes", "image": null, "isCorrect": false}, {"id": "zkez9", "text": "$9.969$ minutes", "image": null, "isCorrect": true}, {"id": "hGWMr", "text": "$9 \\cdot 105$ minutes", "image": null, "isCorrect": false}, {"id": "ThbBB", "text": "$12 \\cdot 05$ minutes", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\n$\\begin{array}{l}\n\\mathrm{t}_{1 / 2}=3 \\mathrm{~min} \\\\\n\\therefore \\mathrm{k}=\\frac{0.693}{\\mathrm{t}_{1 / 2}}=\\frac{0.693}{3}=0.231 \\mathrm{~min}^{-1}\n\\end{array}$\n$\\begin{array}{l}\n{[\\mathrm{A}]_{0}=\\text { Original amount of reactant }=100} \\\\\n{[\\mathrm{~A}]_{t}=\\text { Reactant remaining unreacted }=100-90=10}\n\\end{array}$\nFor first order reaction,\n$t=\\frac{2.303}{k} \\log _{10} \\frac{[A]_{0}}{[A]_{t}}=\\frac{2.303}{0.231 \\mathrm{~min}^{-1}} \\log _{10} \\frac{100}{10}=9.969 \\mathrm{~min}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "i onstant for first order reaction is $0.02232 \\mathrm{~min}^{-1}$. Calculate the time required for $75 \\%$\ncompletion of the reaction.", "image": null}, "options": [{"id": "qbPQr", "text": "$62 \\cdot 12 \\mathrm{~min}$", "image": null, "isCorrect": true}, {"id": "MCk8S", "text": "$\\ 28.31 \\mathrm{~min}$", "image": null, "isCorrect": false}, {"id": "fUwll", "text": "$12.77 \\mathrm{~min}$", "image": null, "isCorrect": false}, {"id": "pbDPz", "text": "$\\ 48 \\cdot 12 \\mathrm{~min}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If $[\\mathrm{A}]_{0}=100, \\quad[\\mathrm{~A}]_{\\mathrm{t}}=100-75=25$\n$\\mathrm{k}=0.02232 \\min ^{-1}, \\quad t=?$\n$t=\\frac{2.303}{k} \\log \\frac{[\\mathrm{A}]_{0}}{[\\mathrm{~A}]_{t}}=\\frac{2.303}{0.02232} \\log \\frac{100}{25}$\n$\\therefore t=62.12 \\min$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f5c0279619d9d8a1bda", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "The half life of a first order reaction is $6.0$ hour. How long will it take for the concentration of reactant to decrease from $0.4 \\mathrm{M}$ to $0 \\cdot 12 \\mathrm{M} ?$", "image": null}, "options": [{"id": "XZmla", "text": "$30 \\cdot 36 \\mathrm{~h}$", "image": null, "isCorrect": false}, {"id": "KRcDw", "text": "$10.42 \\mathrm{~h}$", "image": null, "isCorrect": true}, {"id": "QfIQa", "text": "$4.25 \\mathrm{~h}$", "image": null, "isCorrect": false}, {"id": "FCJEw", "text": "$9.51 \\mathrm{~h}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For first order reaction,\n$\\begin{array}{l}\nk=\\frac{0.693}{t_{1 / 2}}=\\frac{0.693}{6.0 h}=0.1155 h^{-1} \\\\\n\\text { Here, }[A]_{0}=0.4 M,[A]_{t}=0.12 M \\\\\n\\therefore t=\\frac{2.303}{k} \\log _{10} \\frac{[A]_{0}}{[A]_{1}}=\\frac{2.303}{0.1155 h^{-1}} \\times \\log _{10} \\frac{0.4}{0.12}=\\frac{2.303}{0.1155} \\times 0.5224 \\\\\n\\therefore t=10.42 h\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f5a0279619d9d8a1bc9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "For the first order reaction $\\mathrm{A} \\rightarrow \\mathrm{B}$, The rate constant is $0 \\cdot 25 \\mathrm{~S}^{-1}$, if the concentration of $\\mathrm{A}$ is reduced to half, the value of rate constant will be", "image": null}, "options": [{"id": "VOAC2", "text": "$2 \\cdot 25 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "BEo3n", "text": "$0.075 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "DIyvR", "text": "$0 \\cdot 30 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "2wwFa", "text": "$0 \\cdot 25 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Rate constant for first order reaction is independent of initial concentration. Thus, $\\mathrm{k}=0.25 \\mathrm{~s}^{-1}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f4a0279619d9d8a1b45", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "In a first order reaction $87.5 \\%$ of reactant is converted in to product in 15 minutes. The rate constant for the reaction is given by", "image": null}, "options": [{"id": "24vps", "text": "$\\frac{0.693}{5} \\mathrm{~min}^{-1}$", "image": null, "isCorrect": true}, {"id": "E84S8", "text": "$\\frac{0.693}{15} \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}, {"id": "UTCVD", "text": "$\\frac{5}{0.693} \\min ^{-1}$", "image": null, "isCorrect": false}, {"id": "ivUtL", "text": "$0.693 \\times 5 \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$87.5 \\%$ of reactant is converted into product in 15 minutes, means $12.5 \\%$ remains unreacted\n$[\\mathrm{A}]_{0}=100, \\quad[\\mathrm{~A}]_{t}=100-87.5=12.5$\n$k=\\frac{2.303}{15} \\log _{10} \\frac{[A]_{0}}{[A]_{t}}$\n$k=\\frac{2.303}{15} \\log _{10} \\frac{100}{12.5}$\n$k=\\frac{2.303}{15} \\log _{10} 8=\\frac{0.693}{5} \\min ^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f340279619d9d8a1a9c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "Half life of first order reaction is 20 minutes. What is the time taken to reduce the initial concentration of the reactant to $\\frac{1}{10}$ th ?", "image": null}, "options": [{"id": "mjFsf", "text": "$6.6 \\mathrm{~min}$", "image": null, "isCorrect": false}, {"id": "ffVPu", "text": "$66.56 \\mathrm{~min}$", "image": null, "isCorrect": true}, {"id": "Vm7RZ", "text": "$150 \\mathrm{~min}$", "image": null, "isCorrect": false}, {"id": "OMU1L", "text": "$79 \\cdot 68 \\mathrm{~min}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For first order reaction,\n$k=\\frac{0.693}{t_{1 / 2}}=\\frac{0.693}{20}=0.0346 \\mathrm{~min}$\nHere, if $[A]_{0}=1,[A]_{1}-\\frac{1}{10}, t_{1}/10=?$\n$\\begin{array}{l}\nk=\\frac{2.303}{t} \\log \\frac{[\\mathrm{A}]_{0}}{[\\mathrm{~A}]_{1}} \\\\\n\\therefore t_{1 / 10}=\\frac{2.303}{0.0346} \\log 10=66.56 \\mathrm{~min}\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25efc0279619d9d8a18db", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "The integrated rate equation for first order reaction, <math><mi>A</mi><mo>→</mo></math> product, is", "image": null}, "options": [{"id": "0y2Sp", "text": "<math><mi>k</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>t</mi></mrow></mfrac><mi>l</mi><mi>n</mi><mfrac><mrow><msub><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></mrow><mrow><mi>t</mi></mrow></msub></mrow><mrow><msub><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "uQdOl", "text": "<math><mi>k</mi><mo>=</mo><mfrac><mrow><mn>2303</mn></mrow><mrow><mi>t</mi></mrow></mfrac><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>10</mn></mrow></msub><mfrac><mrow><msub><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><msub><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></mrow><mrow><mi>t</mi></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "RueDZ", "text": "<math><mi>k</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>t</mi></mrow></mfrac><mi>l</mi><mi>n</mi><mfrac><mrow><msub><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></mrow><mrow><mn>0</mn></mrow></msub><mo>.</mo></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "LglcP", "text": "<math><mi>k</mi><mo>=</mo><mn>2303</mn><mtext> </mtext><mi>t</mi><msub><mrow><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>10</mn></mrow></msub><mfrac><mrow><msub><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></mrow><mrow><mn>0</mn></mrow></msub></mrow><mrow><msub><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></mrow><mrow><mi>t</mi></mrow></msub></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The integrated rate equation for first order<br />Reaction, <math><mi>A</mi><mo>→</mo></math> product is <math><mi>k</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>t</mi></mrow></mfrac><mtext> </mtext><mi>I</mi><mi>n</mi><mtext> </mtext><mfrac><mrow><msub><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></mrow><mrow><mi>t</mi></mrow></msub></mrow><mrow><msub><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfrac><mo>.</mo></math><br />For 1<sup>st</sup> order reactions, <math><mi>R</mi><mo>→</mo><mi>P</mi></math><br />Rate = <math><mfrac><mrow><mo>-</mo><mi>d</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>R</mi></mrow></mfenced></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mover><mrow><mi>k</mi></mrow><mrow><mo>·</mo></mrow></mover><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>R</mi></mrow></mfenced></math><br />On integrating this equation, we get<br />In <math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>R</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mi>k</mi><mi>t</mi><mo>+</mo><mi>l</mi><mtext>                        </mtext><mo>.</mo><mo>.</mo><mo>.</mo><mfenced separators=\"|\"><mrow><mi>i</mi></mrow></mfenced></math><br />At <math><mi>t</mi><mo>=</mo><mn>0</mn><mo>,</mo><mi>R</mi><mo>=</mo><msub><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>R</mi></mrow></mfenced></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mo>-</mo><mi>k</mi><mo>×</mo><mn>0</mn><mo>+</mo><mi>l</mi></math><br />In <math><msub><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>R</mi></mrow></mfenced></mrow><mrow><mn>0</mn></mrow></msub><mo>=</mo><mi>l</mi></math><br />Substituting the value of l in (i) and on rearrangement, we get<br />In <math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>R</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mi>k</mi><mi>t</mi><mo>+</mo><mi>I</mi><mi>n</mi><msub><mrow><mi>R</mi></mrow><mrow><mn>0</mn></mrow></msub></math><br />And, <math><mi>k</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>t</mi></mrow></mfrac><mi>I</mi><mi>n</mi><mfrac><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msub><mrow><mi>R</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced></mrow><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>R</mi></mrow></mfenced></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8b0279619d9d8a154e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "A first order reaction is given as $A \\rightarrow$ products. Its integrated equation is", "image": null}, "options": [{"id": "P4w7S", "text": "$k=\\frac{2.303}{t} \\log \\frac{a-x}{a}$", "image": null, "isCorrect": false}, {"id": "mqwxT", "text": "$k=\\frac{1}{t} \\log \\frac{a}{a-x}$", "image": null, "isCorrect": false}, {"id": "HxUb1", "text": "$k=\\frac{2.303}{t} \\log \\frac{a}{a-x}$", "image": null, "isCorrect": true}, {"id": "A9EWh", "text": "$-k=\\frac{1}{t} \\log \\frac{a-x}{a}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction,\n$$\nk=\\frac{2.303}{t} \\log \\frac{a}{a-x}\n$$\nwhere, ' $a$ ' is the initial concentration and ' $x$ ' is the amount reacted in time ${ }^{\\prime}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8b0279619d9d8a154c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "${ }_{90} \\mathrm{Th}^{228}$ emits four alpha and one beta particles. Number of neutrons in daughter element is", "image": null}, "options": [{"id": "QDt4F", "text": "129", "image": null, "isCorrect": true}, {"id": "15GPS", "text": "190", "image": null, "isCorrect": false}, {"id": "rbOqf", "text": "232", "image": null, "isCorrect": false}, {"id": "HOoex", "text": "138", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$90 \\mathrm{Th}^{228} \\underset{-4 \\alpha}{\\longrightarrow} 82^{212} \\underset{-\\beta}{\\longrightarrow}{ }_{83} \\mathrm{Y}^{212}$\ndaughter element\nNumber of neutrons = mass number - atomic number\n$$\n\\begin{array}{l}\n=212-83 \\\\\n=129\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8b0279619d9d8a154b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "Unit of decay constant of radioactive disintegration is", "image": null}, "options": [{"id": "i1Co5", "text": "time", "image": null, "isCorrect": false}, {"id": "qabke", "text": "$\\min ^{-2}$", "image": null, "isCorrect": false}, {"id": "FaRRS", "text": "time $^{-1}$", "image": null, "isCorrect": true}, {"id": "tQBUS", "text": "time mol $^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a radioactive disintegration,\n$$\nk=\\frac{2.303}{t} \\log \\frac{N_{0}}{N}\n$$\nwhere, $k$ is known as decay constant or disintegration constant.\nThe unit for decay constant is time $^{-1}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7a0279619d9d8a14bf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "For nuclear fusion reactions, the fusion temperature is of the order of", "image": null}, "options": [{"id": "xsRfP", "text": "$10^{5} \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "TbhU8", "text": "$10^{3} \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "xYIqk", "text": "$10^{7} \\mathrm{~K}$", "image": null, "isCorrect": true}, {"id": "ogETR", "text": "$100 \\mathrm{~K}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the occurrence of nuclear fusion a very high temperature (ie, 20 million $\\mathrm{K}$ or $2 \\times 10^{7} \\mathrm{~K}$ is required. Thus, these reactions are also known as thermonuclear reactions.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e790279619d9d8a14bb", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The first order integrated rate equation is", "image": null}, "options": [{"id": "cnmzE", "text": "$k=\\frac{x}{t}$", "image": null, "isCorrect": false}, {"id": "QmW3f", "text": "$k=-\\frac{2.303}{t} \\log \\frac{a}{a-x}$", "image": null, "isCorrect": false}, {"id": "phKaV", "text": "$k=\\frac{1}{t} \\ln \\frac{a}{a-x}$", "image": null, "isCorrect": true}, {"id": "LuzKw", "text": "$k=\\frac{1}{t} \\frac{x}{a(a-x)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For first order,\n$$\n\\text { rate }=\\frac{d[R]}{d t}=k[R]\n$$\nor\n$$\n\\frac{d[R]}{[R]}=k d t\n$$\nOn integrating Eq. (i)\n$$\n\\begin{array}{l}\n\\int \\frac{d[R]}{[R]}=k \\int d t \\\\\n\\ln [R]=-k t+C\n\\end{array}\n$$\n$\\ldots$\n$$\n\\text { At } t=0,[R]=\\left[R_{0}\\right]\n$$\n[where, $R=$ final concentration, ie, $a-x$ and\n$R_{0}$ is the initial concentration, $\\left.i e, a .\\right]$\n$$\n\\ln \\left[R_{0}\\right]=C\n$$\nOn putting the value of $C$ in Eq. (ii), we get\n$$\n\\begin{array}{r}\n\\ln [R]=-k t+\\ln \\left[R_{0}\\right] \\\\\n-k t=\\ln [R]-\\ln \\left[R_{0}\\right] \\\\\nk t=\\ln \\left[R_{0}\\right]-\\ln [R]\n\\end{array}\n$$\nor\n$$\n\\begin{aligned}\nk &=\\frac{1}{t} \\ln \\frac{\\left[R_{0}\\right]}{[R]} \\\\\nor k&=\\frac{1}{t} \\ln \\frac{a}{a-x}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e690279619d9d8a1432", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "Which is a correct integrated rate equation?", "image": null}, "options": [{"id": "EdX48", "text": "$k=-\\frac{2.303}{t} \\log \\frac{a}{a-x}$", "image": null, "isCorrect": false}, {"id": "kmOcv", "text": "$k=\\frac{-2.303}{t} \\log \\frac{a-x}{a}$", "image": null, "isCorrect": true}, {"id": "ATxMI", "text": "$-d(a-x)=k d t$", "image": null, "isCorrect": false}, {"id": "JduHY", "text": "All are integrated rate equations", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The integrated rate equation for zero order reaction is\n$$\nt=\\frac{x}{k}\n$$\nand for first order reaction is\nOr\n$$\n\\begin{array}{l}\nk=\\frac{2.303}{t} \\log \\frac{a}{a-x} \\\\\n=-\\frac{2.303}{t} \\log \\frac{(a-x)}{a}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e680279619d9d8a142c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "The calculated mass of ${ }_{20} \\mathrm{Ca}^{40}$ is $40.328 \\mathrm{u}$. It releases $306.3 \\mathrm{MeV}$ energy in a nuclear process. Its isotopic mass is", "image": null}, "options": [{"id": "XCcrQ", "text": "$39.998$", "image": null, "isCorrect": true}, {"id": "ldkL0", "text": "$40.6570$", "image": null, "isCorrect": false}, {"id": "1v8uN", "text": "$0.3290$", "image": null, "isCorrect": false}, {"id": "XZ2VC", "text": "$2.85 \\times 10^{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{BE}=\\Delta m \\times 931 \\mathrm{MeV}$\n$306.3=\\Delta m \\times 931$\n$\\Delta m=0.3290$\n$\\Delta m=$ calculated mass $-$ isotopic mass\n- Isotopic mass $=\\Delta m-$ calculated mass\n$$\n\\begin{aligned}=& 0.3290-40.328 \\\\ &=-39.998 \\\\ \\therefore \\text { Isotopic mass } &=39.998 \\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e660279619d9d8a141b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "An element ${ }_{x} A^{y}$ emits $5 \\alpha$ and $4 \\beta$ particles to give ${ }_{82} B^{207}$. The number of protons and neutrons in $A$ are respectively", "image": null}, "options": [{"id": "WKmgK", "text": "88227", "image": null, "isCorrect": false}, {"id": "C2lfz", "text": "88139", "image": null, "isCorrect": true}, {"id": "apAfv", "text": "82227", "image": null, "isCorrect": false}, {"id": "KEjWb", "text": "84139", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "${ }_{x} A^{y} \\longrightarrow{ }_{82} B^{207}+5_{2} \\mathrm{He}^{4}+4{ }_{-1} \\beta^{0}$\nOn comparing,\n$$\n\\begin{aligned}\nx &=82+5 \\times 2+4(-1)=88 \\\\\ny &=207+5 \\times 4+4 \\times 0 \\\\\n&=227\n\\end{aligned}\n$$\n$\\operatorname{In}_{88} A^{227}$\nthe number of protons $=88$ the number of neutrons $=227-88$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e570279619d9d8a13a6", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "After how many seconds will the concentration of the reactant in a first order reaction be halved if the rate constant is $1.155 \\times 10^{-3} \\mathrm{~s}^{-1}$ ?", "image": null}, "options": [{"id": "AMbDs", "text": "600", "image": null, "isCorrect": true}, {"id": "Boho9", "text": "100", "image": null, "isCorrect": false}, {"id": "Ioqeo", "text": "60", "image": null, "isCorrect": false}, {"id": "QO0lU", "text": "10", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rate constant $k=1.155 \\times 10^{-3} \\mathrm{~s}^{-1}$\n$k=\\frac{2.303}{t} \\log \\frac{a}{(a-x)} \\quad \\because a=a,(a-x)=\\frac{a}{2}$\n$\\begin{aligned} t_{1 / 2} &=\\frac{2.303}{k} \\log \\frac{a}{a / 2} \\\\ &=\\frac{2.303}{1.155 \\times 10^{-3}} \\log 2 \\\\ &=\\frac{2.303}{1.155 \\times 10^{-3}} \\times 0.3010 \\end{aligned}$\n$\\begin{aligned} &=\\frac{0.693 \\times 10^{3}}{1.155} \\\\ \\text { or } t_{1 / 2} &=\\frac{0.693}{k}=\\frac{0.693}{1.155 \\times 10^{-3}} \\\\ &=600 \\mathrm{~s} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e570279619d9d8a13a3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "Which of the following has the maximum penetrating power?", "image": null}, "options": [{"id": "cctYV", "text": "$\\alpha$ -particle", "image": null, "isCorrect": false}, {"id": "Z5Wdh", "text": "Proton", "image": null, "isCorrect": false}, {"id": "jkzJR", "text": "$\\gamma$ -radiation", "image": null, "isCorrect": true}, {"id": "Dj6yr", "text": "Positron", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\gamma$ -radiations are neutral, so not deflected by electric and magnetic field. Thus, have maximum penetrating power.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e570279619d9d8a13a2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "A radioactive isotope having $t_{1 / 2}=3$ days was read after 12 days. If $3 g$ of isotope is contained in container, the initial weight of isotope was", "image": null}, "options": [{"id": "C6jG8", "text": "$12 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "exi1E", "text": "$24 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "vFJQJ", "text": "$36 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "XzJ5G", "text": "$48 \\mathrm{~g}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} T &=n \\times t_{1 / 2} \\\\ 12 &=n \\times 3 \\\\ n &=4 \\\\ N &=N_{0} \\times\\left(\\frac{1}{2}\\right)^{n} \\\\ 3 &=N_{0} \\times\\left(\\frac{1}{2}\\right)^{4} \\\\ 3 &=N_{0} \\times \\frac{1}{16} \\\\ N_{0} &=16 \\times 3=48 \\mathrm{~g} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e560279619d9d8a139b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shor
