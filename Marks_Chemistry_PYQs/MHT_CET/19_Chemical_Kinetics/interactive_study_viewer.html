r>$a - x = a - 0.75a = 0.25a$<br><br>Substituting these values into the rate equation:<br><br>$k = \\dfrac{2.303}{30} \\log \\left( \\dfrac{a}{0.25a} \\right)$<br><br>$k = \\dfrac{2.303}{30} \\log (4)$<br><br>$k = \\dfrac{2.303}{30} \\times 0.6020$<br><br>$k = \\dfrac{1.386}{30} = 0.0462\\ \\text{minute}^{-1}$<br><br>Alternatively, $75\\%$ decomposition corresponds to two half-lives:<br><br>$t_{75\\%} = 2 \\times t_{1/2} \\Rightarrow 30 = 2 \\times t_{1/2} \\Rightarrow t_{1/2} = 15\\ \\text{minutes}$<br><br>$k = \\dfrac{0.693}{t_{1/2}} = \\dfrac{0.693}{15} = 0.0462\\ \\text{minute}^{-1}$<br><br>The closest given option is $0.0463\\ \\text{minute}^{-1}$.<br><br>Answer: $0.0463\\ \\text{minute}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fd8c30a4553e1bdef8", "type": "singleCorrect", "question": {"text": "Rate constant of decomposition of hydrogen peroxide is $0.0204\\ \\text{minutes}^{-1}$, calculate half life of reaction.", "image": null}, "options": [{"id": "QZuR9", "label": "A", "text": "$17.56$ minutes", "isCorrect": false, "image": null}, {"id": "7tFC9", "label": "B", "text": "$33.97$ minutes", "isCorrect": true, "image": null}, {"id": "2Y8Sv", "label": "C", "text": "$51.50$ minutes", "isCorrect": false, "image": null}, {"id": "6JMhH", "label": "D", "text": "$68.70$ minutes", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The unit of the rate constant is $\\text{minutes}^{-1}$, which indicates that the decomposition of hydrogen peroxide is a first-order reaction.<br><br>For a first-order reaction, the half-life is given by:<br><br>$t_{1/2} = \\dfrac{0.693}{k}$<br><br>Substituting the given value of $k = 0.0204\\ \\text{minutes}^{-1}$:<br><br>$t_{1/2} = \\dfrac{0.693}{0.0204}$<br><br>$t_{1/2} = 33.97\\ \\text{minutes}$<br><br>Answer: $33.97$ minutes", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f08c30a4553e1bde6f", "type": "singleCorrect", "question": {"text": "What is the time required for 75 % completion of a first order reaction if rate constant is $23.03\\ \\text{minute}^{-1}$ ?", "image": null}, "options": [{"id": "gkm2p", "label": "A", "text": "$12.00$ s", "isCorrect": false, "image": null}, {"id": "RbhN4", "label": "B", "text": "$3.6$ s", "isCorrect": true, "image": null}, {"id": "SRaE4", "label": "C", "text": "$36$ s", "isCorrect": false, "image": null}, {"id": "AFo1v", "label": "D", "text": "$6.0$ s", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the time required for a given completion is given by:<br><br>$t = \\dfrac{2.303}{k} \\log \\left( \\dfrac{a}{a-x} \\right)$<br><br>Given $k = 23.03 \\text{ min}^{-1}$ and for $75\\%$ completion, $x = 0.75a$.<br><br>$t = \\dfrac{2.303}{23.03} \\log \\left( \\dfrac{a}{a - 0.75a} \\right)$<br><br>$t = 0.1 \\log \\left( \\dfrac{1}{0.25} \\right)$<br><br>$t = 0.1 \\log 4$<br><br>$t = 0.1 \\times 0.602 = 0.0602 \\text{ min}$<br><br>Converting the time into seconds:<br><br>$t = 0.0602 \\times 60 \\text{ s} = 3.612 \\text{ s} \\approx 3.6 \\text{ s}$<br><br>Answer: $3.6$ s", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ef8c30a4553e1bde66", "type": "singleCorrect", "question": {"text": "For a reaction $\\text{A} \\longrightarrow$ product, $k = 2 \\times 10^{-2}\\ \\text{s}^{-1}$. If the initial concentration of A is $1.0\\ \\text{mol dm}^{-3}$ find the value of $\\log \\dfrac{1}{[A]_t}$ after 100 second ?", "image": null}, "options": [{"id": "RTCCW", "label": "A", "text": "$0.135$", "isCorrect": false, "image": null}, {"id": "T8Obk", "label": "B", "text": "$0.270$", "isCorrect": false, "image": null}, {"id": "NeyLn", "label": "C", "text": "$0.430$", "isCorrect": false, "image": null}, {"id": "M5cea", "label": "D", "text": "$0.868$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The unit of rate constant $k$ is $\\text{s}^{-1}$, indicating that the reaction is of first order.<br><br>For a first-order reaction, the integrated rate equation is:<br><br>$k = \\dfrac{2.303}{t} \\log \\dfrac{[A]_0}{[A]_t}$<br><br>Substituting the given values $k = 2 \\times 10^{-2}\\ \\text{s}^{-1}$, $t = 100\\ \\text{s}$, and $[A]_0 = 1.0\\ \\text{mol dm}^{-3}$:<br><br>$2 \\times 10^{-2} = \\dfrac{2.303}{100} \\log \\dfrac{1.0}{[A]_t}$<br><br>$2 \\times 10^{-2} \\times 100 = 2.303 \\log \\dfrac{1}{[A]_t}$<br><br>$2 = 2.303 \\log \\dfrac{1}{[A]_t}$<br><br>$\\log \\dfrac{1}{[A]_t} = \\dfrac{2}{2.303} = 0.868$<br><br>Answer: $0.868$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32a8c30a4553e1be0dd", "type": "singleCorrect", "question": {"text": "In a first order reaction 20 millimole of reactant is lowered to 10 millimole in $0.3010$ minute. Find rate constant of the reaction?", "image": null}, "options": [{"id": "WvQGb", "label": "A", "text": "$3.010\\ \\text{minute}^{-1}$", "isCorrect": false, "image": null}, {"id": "6CEsu", "label": "B", "text": "$0.602\\ \\text{minute}^{-1}$", "isCorrect": false, "image": null}, {"id": "AoNIp", "label": "C", "text": "$2.303\\ \\text{minute}^{-1}$", "isCorrect": true, "image": null}, {"id": "YRqwk", "label": "D", "text": "$0.301\\ \\text{minute}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by the expression:<br><br>$k = \\dfrac{2.303}{t} \\log \\left( \\dfrac{a}{a - x} \\right)$<br><br>Given:<br>Initial amount, $a = 20$ millimole<br>Amount after time $t$, $a - x = 10$ millimole<br>Time, $t = 0.3010$ minute<br><br>Substituting the given values into the equation:<br><br>$k = \\dfrac{2.303}{0.3010} \\log \\left( \\dfrac{20}{10} \\right)$<br><br>$k = \\dfrac{2.303}{0.3010} \\log 2$<br><br>Using the standard value $\\log 2 = 0.3010$:<br><br>$k = \\dfrac{2.303}{0.3010} \\times 0.3010$<br><br>$k = 2.303\\ \\text{minute}^{-1}$<br><br>Answer: $2.303\\ \\text{minute}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3448c30a4553e1be1ec", "type": "singleCorrect", "question": {"text": "In first order reaction 20 millimole of reactant is reduced to 10 millimole in $1 \\cdot 151$ minute. Find rate constant.", "image": null}, "options": [{"id": "8a6d8", "label": "A", "text": "$0 \\cdot 6023 \\text{ minute}^{-1}$", "isCorrect": true, "image": null}, {"id": "wt1iU", "label": "B", "text": "$6 \\cdot 120 \\text{ minute}^{-1}$", "isCorrect": false, "image": null}, {"id": "9Do9g", "label": "C", "text": "$0 \\cdot 3010 \\text{ minute}^{-1}$", "isCorrect": false, "image": null}, {"id": "PGbyo", "label": "D", "text": "$2 \\cdot 010 \\text{ minute}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant is given by<br><br>$k = \\dfrac{2 \\cdot 303}{t} \\log \\left( \\dfrac{a}{a-x} \\right)$<br><br>Substituting the given values $a = 20$ millimole, $a-x = 10$ millimole, and $t = 1 \\cdot 151$ minute:<br><br>$k = \\dfrac{2 \\cdot 303}{1 \\cdot 151} \\log \\left( \\dfrac{20}{10} \\right)$<br><br>$k = \\dfrac{2 \\cdot 303}{1 \\cdot 151} \\log 2$<br><br>$k = \\dfrac{2 \\cdot 303 \\times 0 \\cdot 3010}{1 \\cdot 151}$<br><br>$k = 0 \\cdot 6023 \\text{ minute}^{-1}$<br><br>Answer: $0 \\cdot 6023 \\text{ minute}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c88c30a4553e1bdcbf", "type": "singleCorrect", "question": {"text": "Half life of zero order reaction is 1 hour. If initial concentration of reactant is 2.0 mol $\\text{L}^{-1}$, find the time required to decrease concentration from 0.50 to 0.25 mol $\\text{L}^{-1}$", "image": null}, "options": [{"id": "PgE9e", "label": "A", "text": "$0.25$ hour", "isCorrect": true, "image": null}, {"id": "wBotW", "label": "B", "text": "$0.50$ hour", "isCorrect": false, "image": null}, {"id": "htH4n", "label": "C", "text": "$1.00$ hour", "isCorrect": false, "image": null}, {"id": "tV5ns", "label": "D", "text": "$4.00$ hour", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a zero order reaction, the half-life is given by $t_{1/2} = \\dfrac{[A]_0}{2k}$<br><br>Substituting the given values:<br><br>$1 = \\dfrac{2.0}{2k} \\Rightarrow k = 1.0 \\text{ mol L}^{-1} \\text{ hour}^{-1}$<br><br>The integrated rate equation for a zero order reaction is $[A]_t = [A]_0 - kt$<br><br>For the concentration to decrease from $0.50 \\text{ mol L}^{-1}$ to $0.25 \\text{ mol L}^{-1}$, the time required is:<br><br>$\\Delta t = \\dfrac{[A]_1 - [A]_2}{k}$<br><br>$\\Delta t = \\dfrac{0.50 - 0.25}{1.0} = 0.25 \\text{ hour}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c68c30a4553e1bdcaa", "type": "singleCorrect", "question": {"text": "If time required for 90 % completion of a first order reaction is '$t$'. What is the time required for 99.9 % completion of reaction at same temperature?", "image": null}, "options": [{"id": "Yvi3t", "label": "A", "text": "$3t$", "isCorrect": true, "image": null}, {"id": "mh0Mo", "label": "B", "text": "$2t$", "isCorrect": false, "image": null}, {"id": "VjaT6", "label": "C", "text": "$t$", "isCorrect": false, "image": null}, {"id": "l1sUX", "label": "D", "text": "$\\dfrac{3t}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the time required for completion is given by $t = \\dfrac{2.303}{k} \\log \\left( \\dfrac{a}{a-x} \\right)$<br><br>For $90\\%$ completion, $x = 0.9a$<br><br>$t_{90\\%} = \\dfrac{2.303}{k} \\log \\left( \\dfrac{a}{a - 0.9a} \\right) = \\dfrac{2.303}{k} \\log 10 = \\dfrac{2.303}{k}$<br><br>Given $t_{90\\%} = t$, so $t = \\dfrac{2.303}{k}$<br><br>For $99.9\\%$ completion, $x = 0.999a$<br><br>$t_{99.9\\%} = \\dfrac{2.303}{k} \\log \\left( \\dfrac{a}{a - 0.999a} \\right) = \\dfrac{2.303}{k} \\log 1000 = \\dfrac{2.303}{k} \\times 3$<br><br>Substituting the value of $t$, we get $t_{99.9\\%} = 3t$<br><br>Answer: $3t$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d48c30a4553e1bdd43", "type": "singleCorrect", "question": {"text": "If for a first-order reaction, $[A]_0 = 1.0\\ \\text{M}$ and $[A]_t = 0.25\\ \\text{M}$ after 276 s, find the value of the rate constant (k).", "image": null}, "options": [{"id": "Hn5C4", "label": "A", "text": "$0.0021\\ \\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "GhyMf", "label": "B", "text": "$0.0050\\ \\text{s}^{-1}$", "isCorrect": true, "image": null}, {"id": "p6cdm", "label": "C", "text": "$0.003\\ \\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "d8N1X", "label": "D", "text": "$0.006\\ \\text{s}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first-order reaction, the concentration after $n$ half-lives is given by $[A]_t = \\dfrac{[A]_0}{2^n}$.<br><br>Given $[A]_0 = 1.0\\ \\text{M}$ and $[A]_t = 0.25\\ \\text{M}$, we have:<br><br>$0.25 = \\dfrac{1.0}{2^n} \\Rightarrow 2^n = 4 \\Rightarrow n = 2$<br><br>Thus, two half-lives have passed in $276\\ \\text{s}$.<br><br>$2 t_{1/2} = 276\\ \\text{s} \\Rightarrow t_{1/2} = 138\\ \\text{s}$<br><br>The rate constant $k$ is given by:<br><br>$k = \\dfrac{0.693}{t_{1/2}} = \\dfrac{0.693}{138}$<br><br>$k \\approx 0.0050\\ \\text{s}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31a8c30a4553e1be032", "type": "singleCorrect", "question": {"text": "The time required for $90\\%$ completion of a certain first order reaction is $1$ hour. Calculate the time required for $99.9\\%$ completion of the same reaction.", "image": null}, "options": [{"id": "jzQVn", "label": "A", "text": "$2$ hours.", "isCorrect": false, "image": null}, {"id": "kVstf", "label": "B", "text": "$1$ hour.", "isCorrect": false, "image": null}, {"id": "XEcPd", "label": "C", "text": "$3$ hours.", "isCorrect": true, "image": null}, {"id": "eUEEQ", "label": "D", "text": "$0.5$ hour.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by $k = \\dfrac{2.303}{t} \\log \\left( \\dfrac{a}{a-x} \\right)$<br><br>For $90\\%$ completion, $t_{90\\%} = 1$ hour.<br><br>$k = \\dfrac{2.303}{1} \\log \\left( \\dfrac{100}{100-90} \\right) = 2.303 \\log 10 = 2.303 \\text{ hour}^{-1}$<br><br>For $99.9\\%$ completion, the time required is:<br><br>$t_{99.9\\%} = \\dfrac{2.303}{k} \\log \\left( \\dfrac{100}{100-99.9} \\right)$<br><br>$t_{99.9\\%} = \\dfrac{2.303}{2.303} \\log \\left( \\dfrac{100}{0.1} \\right)$<br><br>$t_{99.9\\%} = \\log 1000 = 3$ hours.<br><br>Answer: $3$ hours.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31a8c30a4553e1be030", "type": "singleCorrect", "question": {"text": "What is the value of the slope of a graph obtained by plotting the concentration of reactant $(A)_t$ versus time for zero order reaction?", "image": null}, "options": [{"id": "jGt07", "label": "A", "text": "$-k$", "isCorrect": true, "image": null}, {"id": "HPO75", "label": "B", "text": "$1/2k$", "isCorrect": false, "image": null}, {"id": "F8Lxn", "label": "C", "text": "$k/2.303$", "isCorrect": false, "image": null}, {"id": "ANXYw", "label": "D", "text": "$2.303/k$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a zero order reaction, the rate of reaction is independent of the concentration of the reactant.<br><br>The integrated rate equation for a zero order reaction is given by:<br><br>$[A]_t = -kt + [A]_0$<br><br>where $[A]_t$ is the concentration of the reactant at time $t$, $[A]_0$ is the initial concentration, and $k$ is the rate constant.<br><br>Comparing this equation with the equation of a straight line $y = mx + c$, we get:<br><br>$y = [A]_t$<br><br>$x = t$<br><br>$m = -k$<br><br>$c = [A]_0$<br><br>Thus, plotting the concentration of reactant $[A]_t$ versus time $t$ yields a straight line with a slope of $-k$.<br><br>Answer: $-k$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29c8c30a4553e1bdaec", "type": "singleCorrect", "question": {"text": "A first order reaction takes $16$ minutes for it's $50\\%$ completion. What fraction that would react in $32$ minutes from the beginning?", "image": null}, "options": [{"id": "NSU0d", "label": "A", "text": "$1/2$", "isCorrect": false, "image": null}, {"id": "6Nu4w", "label": "B", "text": "$1/4$", "isCorrect": false, "image": null}, {"id": "u4Qmo", "label": "C", "text": "$1/8$", "isCorrect": false, "image": null}, {"id": "mwMoL", "label": "D", "text": "$3/4$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the half-life is given as $t_{1/2} = 16$ minutes.<br><br>The time given is $t = 32$ minutes.<br><br>The number of half-lives is $n = \\dfrac{t}{t_{1/2}} = \\dfrac{32}{16} = 2$.<br><br>The fraction of the reactant remaining after $n$ half-lives is $\\dfrac{1}{2^n}$.<br><br>Fraction remaining $= \\dfrac{1}{2^2} = \\dfrac{1}{4}$.<br><br>The fraction of the reactant that has reacted is $1 - \\dfrac{1}{4} = \\dfrac{3}{4}$.<br><br>Answer: $3/4$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29c8c30a4553e1bdaeb", "type": "singleCorrect", "question": {"text": "The half-life of a first-order reaction is $20$ minutes. What is the rate constant (in min$^{-1}$) for this reaction?", "image": null}, "options": [{"id": "8AOTa", "label": "A", "text": "$0.0347$", "isCorrect": true, "image": null}, {"id": "SgXXM", "label": "B", "text": "$0.5$", "isCorrect": false, "image": null}, {"id": "nHeIO", "label": "C", "text": "$13.86$", "isCorrect": false, "image": null}, {"id": "luBAe", "label": "D", "text": "$34.67$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first-order reaction, the rate constant $k$ is related to the half-life $t_{1/2}$ by the equation:<br><br>$k = \\dfrac{0.693}{t_{1/2}}$<br><br>Given $t_{1/2} = 20$ minutes.<br><br>Substituting the value:<br><br>$k = \\dfrac{0.693}{20}$<br><br>$k = 0.03465 \\text{ min}^{-1}$<br><br>Rounding off, we get $k \\approx 0.0347 \\text{ min}^{-1}$.<br><br>Answer: $0.0347$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36f8c30a4553e1be3b5", "type": "singleCorrect", "question": {"text": "In first order reaction, 20 % concentration remains after 10 min. What would be the rate constant of reaction if $\\log_{10}(5) = 0.6989$?", "image": null}, "options": [{"id": "Zyo3o", "label": "A", "text": "$1.609$ min$^{-1}$", "isCorrect": false, "image": null}, {"id": "AYNSH", "label": "B", "text": "$6.989$ min$^{-1}$", "isCorrect": false, "image": null}, {"id": "9sedV", "label": "C", "text": "$16.09$ min$^{-1}$", "isCorrect": false, "image": null}, {"id": "rtELM", "label": "D", "text": "$0.1609$ min$^{-1}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by the formula:<br><br>$k = \\dfrac{2.303}{t} \\log_{10} \\left( \\dfrac{[A]_0}{[A]_t} \\right)$<br><br>Given that $20\\%$ concentration remains after $10$ min, we have:<br><br>$t = 10$ min<br><br>$[A]_t = \\dfrac{20}{100} [A]_0 = 0.2 [A]_0$<br><br>Substituting these values into the formula:<br><br>$k = \\dfrac{2.303}{10} \\log_{10} \\left( \\dfrac{[A]_0}{0.2 [A]_0} \\right)$<br><br>$k = \\dfrac{2.303}{10} \\log_{10}(5)$<br><br>Given $\\log_{10}(5) = 0.6989$:<br><br>$k = \\dfrac{2.303}{10} \\times 0.6989$<br><br>$k = 0.2303 \\times 0.6989$<br><br>$k = 0.1609$ min$^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3618c30a4553e1be320", "type": "singleCorrect", "question": {"text": "The half life of first order reaction is $850$ s. The initial concentration of the reactant is $0.06$ mol $\\text{dm}^{-3}$. What concentration would remain after $1200$ s ?", "image": null}, "options": [{"id": "QGgX2", "label": "A", "text": "$0.023$ mol $\\text{dm}^{-3}$", "isCorrect": true, "image": null}, {"id": "H9rqQ", "label": "B", "text": "$0.035$ mol $\\text{dm}^{-3}$", "isCorrect": false, "image": null}, {"id": "brOXH", "label": "C", "text": "$5.25$ mol $\\text{dm}^{-3}$", "isCorrect": false, "image": null}, {"id": "FNckl", "label": "D", "text": "$6.25$ mol $\\text{dm}^{-3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by:<br><br>$k = \\dfrac{0.693}{t_{1/2}}$<br><br>Substituting the given half-life $t_{1/2} = 850$ s:<br><br>$k = \\dfrac{0.693}{850} = 8.15 \\times 10^{-4} \\text{ s}^{-1}$<br><br>The integrated rate law for a first order reaction is:<br><br>$k = \\dfrac{2.303}{t} \\log \\left( \\dfrac{[A]_0}{[A]_t} \\right)$<br><br>Substituting the values $t = 1200$ s and $[A]_0 = 0.06 \\text{ mol dm}^{-3}$:<br><br>$8.15 \\times 10^{-4} = \\dfrac{2.303}{1200} \\log \\left( \\dfrac{0.06}{[A]_t} \\right)$<br><br>$\\log \\left( \\dfrac{0.06}{[A]_t} \\right) = \\dfrac{8.15 \\times 10^{-4} \\times 1200}{2.303} \\approx 0.425$<br><br>Taking the antilog on both sides:<br><br>$\\dfrac{0.06}{[A]_t} = 10^{0.425} \\approx 2.66$<br><br>$[A]_t = \\dfrac{0.06}{2.66} \\approx 0.0226 \\text{ mol dm}^{-3}$<br><br>Rounding off, the concentration remaining is approximately $0.023 \\text{ mol dm}^{-3}$.<br><br>Answer: $0.023$ mol $\\text{dm}^{-3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3618c30a4553e1be31f", "type": "singleCorrect", "question": {"text": "Half life period of a first order reaction is $1386$ seconds. The rate constant of the reaction is", "image": null}, "options": [{"id": "eHxUq", "label": "A", "text": "$5.5 \\times 10^{-2} \\times s^{-1}$", "isCorrect": false, "image": null}, {"id": "CubyB", "label": "B", "text": "$0.5 \\times 10^{-3} \\times s^{-1}$", "isCorrect": true, "image": null}, {"id": "V7xUh", "label": "C", "text": "$5 \\times 10^{-2} \\times s^{-1}$", "isCorrect": false, "image": null}, {"id": "5t6MA", "label": "D", "text": "$5 \\times 10^{-3} \\times s^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is related to the half life period $t_{1/2}$ by the formula:<br><br>$k = \\dfrac{0.693}{t_{1/2}}$<br><br>Given $t_{1/2} = 1386 \\text{ s}$, substituting this value:<br><br>$k = \\dfrac{0.693}{1386}$<br><br>$k = \\dfrac{693 \\times 10^{-3}}{2 \\times 693}$<br><br>$k = 0.5 \\times 10^{-3} \\text{ s}^{-1}$<br><br>Answer: $0.5 \\times 10^{-3} \\times s^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b88c30a4553e1bdc18", "type": "singleCorrect", "question": {"text": "A first order reaction complete $60$% in $20$ minutes. How long will the reaction take to complete $84$%?", "image": null}, "options": [{"id": "H2oDy", "label": "A", "text": "$54$ min", "isCorrect": false, "image": null}, {"id": "sTiYL", "label": "B", "text": "$68$ min", "isCorrect": false, "image": null}, {"id": "v9CuM", "label": "C", "text": "$40$ min", "isCorrect": true, "image": null}, {"id": "KXU8c", "label": "D", "text": "$76$ min", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant is given by $k = \\dfrac{2.303}{t} \\log\\left(\\dfrac{a}{a-x}\\right)$<br><br>For $60\\%$ completion in $20$ minutes:<br><br>$k = \\dfrac{2.303}{20} \\log\\left(\\dfrac{100}{100-60}\\right) = \\dfrac{2.303}{20} \\log(2.5)$<br><br>For $84\\%$ completion in time $t$:<br><br>$k = \\dfrac{2.303}{t} \\log\\left(\\dfrac{100}{100-84}\\right) = \\dfrac{2.303}{t} \\log(6.25)$<br><br>Equating the two expressions for $k$:<br><br>$\\dfrac{1}{20} \\log(2.5) = \\dfrac{1}{t} \\log(2.5^2)$<br><br>$\\dfrac{1}{20} \\log(2.5) = \\dfrac{2}{t} \\log(2.5)$<br><br>$t = 40$ min<br><br>Answer: $40$ min", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b88c30a4553e1bdc17", "type": "singleCorrect", "question": {"text": "The rate constant for a first order reaction is $60 \\text{ s}^{-1}$. How much time will it take to reduce the concentration of the reactant to $1/20^{\\text{th}}$ of its initial value?", "image": null}, "options": [{"id": "7EWrz", "label": "A", "text": "$0.0529$ s", "isCorrect": false, "image": null}, {"id": "myDu1", "label": "B", "text": "$0.0852$ s", "isCorrect": false, "image": null}, {"id": "ky45u", "label": "C", "text": "$0.0499$ s", "isCorrect": true, "image": null}, {"id": "4GWOG", "label": "D", "text": "$0.0357$ s", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the time required is given by the integrated rate equation:<br><br>$t = \\dfrac{2.303}{k} \\log \\left( \\dfrac{[R]_0}{[R]} \\right)$<br><br>Given $k = 60 \\text{ s}^{-1}$ and the final concentration $[R] = \\dfrac{[R]_0}{20}$.<br><br>Substituting the values into the equation:<br><br>$t = \\dfrac{2.303}{60} \\log \\left( \\dfrac{[R]_0}{\\dfrac{[R]_0}{20}} \\right)$<br><br>$t = \\dfrac{2.303}{60} \\log(20)$<br><br>Using $\\log(20) = \\log(2 \\times 10) = \\log 2 + \\log 10 = 0.3010 + 1 = 1.3010$:<br><br>$t = \\dfrac{2.303 \\times 1.3010}{60}$<br><br>$t = \\dfrac{2.9962}{60}$<br><br>$t \\approx 0.0499 \\text{ s}$<br><br>Answer: $0.0499$ s", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bfdbf9280d7f9932e46", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is half life of a first order reaction if time required to decrease concentration of reactant from 0.4 M to 0.1 M is $x$ hour?", "image": null}, "options": [{"id": "5H85Q", "text": "$x$ hour", "image": null, "isCorrect": false}, {"id": "VFG2k", "text": "$2 x$ hour", "image": null, "isCorrect": false}, {"id": "9lcwC", "text": "$\\frac{x}{2}$ hour", "image": null, "isCorrect": true}, {"id": "frHkj", "text": "$\\frac{3 x}{2}$ hour", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, the concentration of the reactant after $n$ half-lives is given by:<br><br>$[A]_t = \\dfrac{[A]_0}{2^n}$<br><br>Given $[A]_0 = 0.4$ M and $[A]_t = 0.1$ M, we can write:<br><br>$0.1 = \\dfrac{0.4}{2^n}$<br><br>$\\dfrac{1}{4} = \\dfrac{1}{2^n}$<br><br>$\\left(\\dfrac{1}{2}\\right)^2 = \\left(\\dfrac{1}{2}\\right)^n$<br><br>Therefore, $n = 2$.<br><br>The total time $t$ is related to the half-life $t_{1/2}$ by $t = n \\times t_{1/2}$.<br><br>Given $t = x$ hour, we have:<br><br>$x = 2 \\times t_{1/2}$<br><br>$t_{1/2} = \\dfrac{x}{2}$ hour<br><br>Answer: $\\frac{x}{2}$ hour", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871befbf9280d7f9932dca", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is numerical value of rate constant of a first order reaction that is $20 \\%$ completed in 10 minute ?", "image": null}, "options": [{"id": "zWj0u", "text": "0.0223", "image": null, "isCorrect": true}, {"id": "lDEPJ", "text": "0.0322", "image": null, "isCorrect": false}, {"id": "bjlym", "text": "0.223", "image": null, "isCorrect": false}, {"id": "967QQ", "text": "0.322", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by the formula:<br><br>$k = \\dfrac{2.303}{t} \\log_{10} \\left( \\dfrac{[A]_0}{[A]_t} \\right)$<br><br>Given that the reaction is $20 \\%$ completed in $10$ minutes:<br><br>$[A]_0 = 100$<br><br>$[A]_t = 100 - 20 = 80$<br><br>$t = 10$ min<br><br>Substituting the values into the formula:<br><br>$k = \\dfrac{2.303}{10} \\log_{10} \\left( \\dfrac{100}{80} \\right)$<br><br>$k = 0.2303 \\log_{10} (1.25)$<br><br>$k = 0.2303 \\times 0.0969$<br><br>$k = 0.0223$ min$^{-1}$<br><br>Answer: 0.0223", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be0bf9280d7f9932d39", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The slope of a graph $\\log [A]_t$ versus ' $t$ ' for first order reaction is $-2.5 \\times 10^{-3} \\mathrm{~s}^{-1}$. Find rate constant of the reaction?", "image": null}, "options": [{"id": "Lns8G", "text": "$1.263 \\times 10^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "J2I3P", "text": "$3.471 \\times 10^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "WpNwH", "text": "$5.757 \\times 10^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "WiL43", "text": "$8.125 \\times 10^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, the integrated rate law is given by:<br><br>$k = \\dfrac{2.303}{t} \\log \\dfrac{[A]_0}{[A]_t}$<br><br>Rearranging the equation in the form of a straight line $y = mx + c$:<br><br>$\\log [A]_t = -\\dfrac{k}{2.303} t + \\log [A]_0$<br><br>The graph of $\\log [A]_t$ versus $t$ is a straight line with slope $m = -\\dfrac{k}{2.303}$.<br><br>Given slope $= -2.5 \\times 10^{-3} \\text{ s}^{-1}$.<br><br>$-\\dfrac{k}{2.303} = -2.5 \\times 10^{-3}$<br><br>$k = 2.303 \\times 2.5 \\times 10^{-3}$<br><br>$k = 5.7575 \\times 10^{-3} \\text{ s}^{-1}$<br><br>Answer: $5.757 \\times 10^{-3} \\mathrm{~s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbdbf9280d7f9932c02", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the time required for $99 \\%$ completion of a first order reaction if rate constant is $23.03 \\mathrm{~min}^{-1}$ ?", "image": null}, "options": [{"id": "s1aqP", "text": "0.2 minute", "image": null, "isCorrect": true}, {"id": "67ZJT", "text": "0.4 minute", "image": null, "isCorrect": false}, {"id": "rPOd5", "text": "6.2 minute", "image": null, "isCorrect": false}, {"id": "bV1yH", "text": "8.1 minute", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, the time required is given by the integrated rate law:<br><br>$t = \\dfrac{2.303}{k} \\log_{10} \\left( \\dfrac{[A]_0}{[A]_t} \\right)$<br><br>For $99\\%$ completion, let $[A]_0 = 100$. Then $[A]_t = 100 - 99 = 1$.<br><br>Given $k = 23.03 \\text{ min}^{-1}$.<br><br>Substituting the values:<br><br>$t = \\dfrac{2.303}{23.03} \\log_{10} \\left( \\dfrac{100}{1} \\right)$<br><br>$t = 0.1 \\times \\log_{10}(100)$<br><br>$t = 0.1 \\times 2 = 0.2 \\text{ min}$<br><br>Answer: 0.2 minute", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9dbf9280d7f9932ae6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A first order reaction is $50 \\%$ completed in 16 minute. Find the percentage of reactant reacting in 32 minute.", "image": null}, "options": [{"id": "xdlRv", "text": "$25 \\%$", "image": null, "isCorrect": false}, {"id": "UT0bf", "text": "$40 \\%$", "image": null, "isCorrect": false}, {"id": "d98LA", "text": "$50 \\%$", "image": null, "isCorrect": false}, {"id": "X4hne", "text": "$75 \\%$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a first order reaction, the half-life is constant.<br><br>Given that the reaction is $50 \\%$ completed in $16$ minutes, the half-life is $t_{1/2} = 16$ minute.<br><br>The given time is $t = 32$ minute.<br><br>Number of half-lives, $n = \\dfrac{t}{t_{1/2}} = \\dfrac{32}{16} = 2$<br><br>The amount of reactant remaining after $n$ half-lives is given by:<br><br>$[A] = \\dfrac{[A]_0}{2^n}$<br><br>$[A] = \\dfrac{[A]_0}{2^2} = \\dfrac{[A]_0}{4} = 0.25 [A]_0$<br><br>Percentage of reactant remaining $= 25 \\%$<br><br>Percentage of reactant reacting (reacted) $= 100 \\% - 25 \\% = 75 \\%$<br><br>Answer: $75 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8dbf9280d7f9932a4f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is an example of first order reaction?", "image": null}, "options": [{"id": "Q08cf", "text": "$\\mathrm{CH}_3 \\mathrm{CHO}_{(\\mathrm{g})} \\rightarrow \\mathrm{CH}_{4(\\mathrm{~g})}+\\mathrm{CO}_{(\\mathrm{g})}$", "image": null, "isCorrect": false}, {"id": "DsOBf", "text": "$2 \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{F}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{NO}_2 \\mathrm{~F}_{(\\mathrm{g})}$", "image": null, "isCorrect": false}, {"id": "OieQ2", "text": "$2 \\mathrm{NO}_{(\\mathrm{g})}+2 \\mathrm{H}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{N}_{2(\\mathrm{~g})}+2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}$", "image": null, "isCorrect": false}, {"id": "fsOTr", "text": "$2 \\mathrm{H}_2 \\mathrm{O}_{2(\\ell)} \\rightarrow 2 \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}+\\mathrm{O}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The decomposition of hydrogen peroxide is a well-known example of a first-order reaction. The rate law is given by Rate = $k[\\mathrm{H}_2\\mathrm{O}_2]$.<br><br>The decomposition of acetaldehyde ($\\mathrm{CH}_3\\mathrm{CHO}$) is a fractional order reaction (order = $1.5$).<br><br>The reaction between $\\mathrm{NO}_2$ and $\\mathrm{F}_2$ is a second-order reaction.<br><br>The reaction between $\\mathrm{NO}$ and $\\mathrm{H}_2$ is a third-order reaction.<br><br>Therefore, $2 \\mathrm{H}_2 \\mathrm{O}_{2(\\ell)} \\rightarrow 2 \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}+\\mathrm{O}_{2(\\mathrm{~g})}$ is the correct example of a first-order reaction.<br><br>Answer: $2 \\mathrm{H}_2 \\mathrm{O}_{2(\\ell)} \\rightarrow 2 \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}+\\mathrm{O}_{2(\\mathrm{~g})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8abf9280d7f9932a31", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The rate constant of a first order reaction is $1.15 \\times 10^{-3} \\mathrm{~s}^{-1}$. How long will 5 g of reactant take to reduce to 3 g ?", "image": null}, "options": [{"id": "zKVRK", "text": "314 second", "image": null, "isCorrect": false}, {"id": "oWMaR", "text": "240 second", "image": null, "isCorrect": false}, {"id": "9VK53", "text": "404 second", "image": null, "isCorrect": false}, {"id": "aagta", "text": "444 second", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a first order reaction, the time required is given by the integrated rate law:<br><br>$t = \\dfrac{2.303}{k} \\log_{10} \\left( \\dfrac{[A]_0}{[A]_t} \\right)$<br><br>Given:<br>$k = 1.15 \\times 10^{-3} \\text{ s}^{-1}$<br>$[A]_0 = 5 \\text{ g}$<br>$[A]_t = 3 \\text{ g}$<br><br>Substituting the values into the formula:<br><br>$t = \\dfrac{2.303}{1.15 \\times 10^{-3}} \\log_{10} \\left( \\dfrac{5}{3} \\right)$<br><br>$t = \\dfrac{2.303}{1.15 \\times 10^{-3}} (\\log_{10} 5 - \\log_{10} 3)$<br><br>$t = \\dfrac{2.303}{1.15 \\times 10^{-3}} (0.6990 - 0.4771)$<br><br>$t = \\dfrac{2.303}{1.15 \\times 10^{-3}} \\times 0.2219$<br><br>$t = 2.0026 \\times 10^3 \\times 0.2219$<br><br>$t \\approx 444 \\text{ s}$<br><br>Answer: 444 second", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7dbf9280d7f99329ba", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The half life values for two different first order reaction A and $B$ are 75 minute and 2.5 hour respectively. What is the $\\frac{r_B}{r_A}$ ratio of rate constants?", "image": null}, "options": [{"id": "Ot890", "text": "$0.5$", "image": null, "isCorrect": true}, {"id": "uGXiY", "text": "$2.0$", "image": null, "isCorrect": false}, {"id": "y6pAd", "text": "$14.2$", "image": null, "isCorrect": false}, {"id": "malUW", "text": "$22.0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is inversely proportional to the half-life $t_{1/2}$:<br><br>$k = \\dfrac{0.693}{t_{1/2}}$<br><br>Given the half-lives of reactions A and B:<br><br>$(t_{1/2})_A = 75$ min<br><br>$(t_{1/2})_B = 2.5$ hour $= 2.5 \\times 60 = 150$ min<br><br>The ratio of the rate constants is:<br><br>$\\dfrac{r_B}{r_A} = \\dfrac{k_B}{k_A} = \\dfrac{(t_{1/2})_A}{(t_{1/2})_B}$<br><br>$\\dfrac{r_B}{r_A} = \\dfrac{75}{150} = 0.5$<br><br>Answer: $0.5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6ebf9280d7f9932924", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Half life of a first order reaction is 20 minute. The time taken to reduce the initial concentration of reactant to $(1 / 10)^{\\text {th }}$ is $\\qquad$", "image": null}, "options": [{"id": "i6cFn", "text": "$46.60 \\mathrm{~min}$", "image": null, "isCorrect": false}, {"id": "44Gll", "text": "66.46 min", "image": null, "isCorrect": true}, {"id": "bZWzJ", "text": "79.68 min", "image": null, "isCorrect": false}, {"id": "dlFuK", "text": "88.00 min", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by:<br><br>$k = \\dfrac{0.693}{t_{1/2}}$<br><br>Given $t_{1/2} = 20 \\text{ min}$,<br><br>$k = \\dfrac{0.693}{20} \\text{ min}^{-1}$<br><br>The time $t$ required for the concentration to reduce to $(1/10)^{\\text{th}}$ of its initial value is:<br><br>$t = \\dfrac{2.303}{k} \\log_{10} \\left( \\dfrac{[A]_0}{[A]_t} \\right)$<br><br>Substituting $[A]_t = \\dfrac{[A]_0}{10}$ and $k = \\dfrac{0.693}{20}$:<br><br>$t = \\dfrac{2.303 \\times 20}{0.693} \\log_{10} (10)$<br><br>$t = \\dfrac{46.06}{0.693} \\times 1$<br><br>$t = 66.46 \\text{ min}$<br><br>Answer: 66.46 min", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5bbf9280d7f9932889", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For a reaction,\n$A \\rightarrow B$, rate equation is '$r=K[A]^{\\circ}$'\nIf initial concentration of reactant is 'a' $\\mathrm{mol~} \\mathrm{dm}^{-3}$ find half life time of reaction.", "image": null}, "options": [{"id": "DFdHx", "text": "$\\frac{\\mathrm{a}}{4 \\mathrm{k}}$", "image": null, "isCorrect": false}, {"id": "jpVz8", "text": "$\\frac{\\mathrm{a}}{\\mathrm{k}}$", "image": null, "isCorrect": false}, {"id": "ZMkZ0", "text": "$\\frac{5 \\mathrm{a}}{2 \\mathrm{k}}$", "image": null, "isCorrect": false}, {"id": "wjjIz", "text": "$\\frac{\\mathrm{a}}{2 \\mathrm{k}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given rate equation is $r = k[A]^0$, which indicates that the reaction is of zero order.<br><br>For a zero order reaction, the integrated rate law is given by:<br><br>$[A]_t = [A]_0 - kt$<br><br>At half-life, $t = t_{1/2}$ and the concentration of reactant becomes half of its initial value, so $[A]_t = \\dfrac{[A]_0}{2}$.<br><br>Given the initial concentration $[A]_0 = a$, we substitute these values into the integrated rate equation:<br><br>$\\dfrac{a}{2} = a - k t_{1/2}$<br><br>$k t_{1/2} = a - \\dfrac{a}{2} = \\dfrac{a}{2}$<br><br>$t_{1/2} = \\dfrac{a}{2k}$<br><br>Answer: $\\frac{\\mathrm{a}}{2 \\mathrm{k}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b48bf9280d7f99327d5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate the time in seconds required to reduce the concentration of reactant to half of initial concentration for first order reaction if rate constant is $1.386 \\times 10^{-3} \\mathrm{~s}^{-1}$", "image": null}, "options": [{"id": "gQNcw", "text": "140 s", "image": null, "isCorrect": false}, {"id": "8Cfl5", "text": "290 s", "image": null, "isCorrect": false}, {"id": "Ajity", "text": "390 s", "image": null, "isCorrect": false}, {"id": "OUy0x", "text": "500 s", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a first order reaction, the half-life is given by the formula:<br><br>$t_{1/2} = \\dfrac{0.693}{k}$<br><br>Substituting the given value of rate constant $k = 1.386 \\times 10^{-3} \\mathrm{~s}^{-1}$:<br><br>$t_{1/2} = \\dfrac{0.693}{1.386 \\times 10^{-3}}$<br><br>$t_{1/2} = \\dfrac{1}{2 \\times 10^{-3}}$<br><br>$t_{1/2} = \\dfrac{1000}{2} = 500 \\mathrm{~s}$<br><br>Answer: 500 s", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3bbf9280d7f9932754", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Half life of a first order reaction is 3 minute. What is the time required to reduce the concentration of reactant by $90 \\%$ of its initial concentration?", "image": null}, "options": [{"id": "aEiFq", "text": "4.12 minute", "image": null, "isCorrect": false}, {"id": "Go0wf", "text": "7.32 minute", "image": null, "isCorrect": false}, {"id": "yX135", "text": "9.97 minute", "image": null, "isCorrect": true}, {"id": "tz2lz", "text": "12.05 minute", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by:<br><br>$k = \\dfrac{0.693}{t_{1/2}}$<br><br>Substituting $t_{1/2} = 3 \\text{ min}$:<br><br>$k = \\dfrac{0.693}{3} = 0.231 \\text{ min}^{-1}$<br><br>The concentration is reduced by $90 \\%$, which means the remaining concentration $[A]_t$ is $10 \\%$ of the initial concentration $[A]_0$.<br><br>$[A]_t = 0.10 [A]_0$<br><br>The time $t$ required is given by the first order integrated rate law:<br><br>$t = \\dfrac{2.303}{k} \\log_{10} \\left( \\dfrac{[A]_0}{[A]_t} \\right)$<br><br>$t = \\dfrac{2.303}{0.231} \\log_{10} \\left( \\dfrac{[A]_0}{0.10 [A]_0} \\right)$<br><br>$t = \\dfrac{2.303}{0.231} \\log_{10} (10)$<br><br>$t = \\dfrac{2.303}{0.231} \\times 1 \\approx 9.97 \\text{ min}$<br><br>Answer: 9.97 minute", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b16bf9280d7f993262b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Half life of a first order reaction is 900 minute at 400 K , find its half life at 300 K ?\n$\\left(\\frac{\\mathrm{Ea}}{2.303 \\mathrm{R}}=1.3056 \\times 10^3\\right)$", "image": null}, "options": [{"id": "D4TU9", "text": "$5512.5$ minute", "image": null, "isCorrect": false}, {"id": "QTSh8", "text": "$11025.0$ minute", "image": null, "isCorrect": true}, {"id": "OVoCq", "text": "8314.3 minute", "image": null, "isCorrect": false}, {"id": "t7TCV", "text": "2303.1 minute", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the Arrhenius equation:<br><br>$\\log \\left( \\dfrac{k_2}{k_1} \\right) = \\dfrac{E_a}{2.303 R} \\left( \\dfrac{T_2 - T_1}{T_1 T_2} \\right)$<br><br>Let $T_2 = 400$ K and $T_1 = 300$ K. Substituting the given values:<br><br>$\\log \\left( \\dfrac{k_{400}}{k_{300}} \\right) = 1.3056 \\times 10^3 \\times \\left( \\dfrac{400 - 300}{400 \\times 300} \\right)$<br><br>$\\log \\left( \\dfrac{k_{400}}{k_{300}} \\right) = 1.3056 \\times 10^3 \\times \\dfrac{100}{120000} = \\dfrac{1305.6}{1200} = 1.088$<br><br>Taking antilog on both sides:<br><br>$\\dfrac{k_{400}}{k_{300}} = \\text{antilog}(1.088) \\approx 12.25$<br><br>For a first order reaction, half-life is inversely proportional to the rate constant, $t_{1/2} = \\dfrac{0.693}{k}$.<br><br>$\\dfrac{(t_{1/2})_{300}}{(t_{1/2})_{400}} = \\dfrac{k_{400}}{k_{300}} = 12.25$<br><br>$(t_{1/2})_{300} = 12.25 \\times 900 = 11025.0$ minute<br><br>Answer: $11025.0$ minute", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b00bf9280d7f9932583", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following is correct regarding $t_{1 / 2}$ of reaction if we double the initial concentration of a reactant in first order reaction?", "image": null}, "options": [{"id": "8xg3n", "text": "$t_{\\frac{1}{2}}$ will increase by two times", "image": null, "isCorrect": false}, {"id": "hmBJX", "text": "$t_{\\frac{1}{2}}$ will decrease by four times", "image": null, "isCorrect": false}, {"id": "NKSWT", "text": "$t_{\\frac{1}{2}}$ remains the same", "image": null, "isCorrect": true}, {"id": "D2la0", "text": "$\\mathrm{t}_{\\frac{1}{2}}$ will decrease by two times", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, the half-life is given by the expression:<br><br>$t_{1/2} = \\dfrac{0.693}{k}$<br><br>This expression shows that the half-life of a first order reaction is independent of the initial concentration of the reactant.<br><br>Therefore, if the initial concentration of the reactant is doubled, the half-life $t_{1/2}$ remains the same.<br><br>Answer: $t_{\\frac{1}{2}}$ remains the same", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b00bf9280d7f993257b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In a first order reaction concentration of reactant decreases from 20 milli mol dm-3 to 8 milli mol dm-3 in 40 minute, find rate constant of reaction?", "image": null}, "options": [{"id": "7FXyO", "text": "0.011 minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "crKOa", "text": "0.023 minute $^{-1}$", "image": null, "isCorrect": true}, {"id": "YVPLQ", "text": "0.032 minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "JDkQO", "text": "0.041 minute $^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by:<br><br>$k = \\dfrac{2.303}{t} \\log_{10} \\left( \\dfrac{[A]_0}{[A]_t} \\right)$<br><br>Given:<br>$[A]_0 = 20$ milli mol dm$^{-3}$<br>$[A]_t = 8$ milli mol dm$^{-3}$<br>$t = 40$ minute<br><br>Substituting the values:<br><br>$k = \\dfrac{2.303}{40} \\log_{10} \\left( \\dfrac{20}{8} \\right)$<br><br>$k = \\dfrac{2.303}{40} \\log_{10} (2.5)$<br><br>$k = \\dfrac{2.303}{40} \\times 0.3979$<br><br>$k = \\dfrac{0.9164}{40}$<br><br>$k = 0.02291$ minute$^{-1}$<br><br>$k \\approx 0.023$ minute$^{-1}$<br><br>Answer: 0.023 minute $^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214460aee93fa0796df5a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "In a first order reaction $60 \\%$ of the reactant converts into product in 45 minute. Calculate rate constant of the reaction.", "image": null}, "options": [{"id": "Z9S0R", "text": "0.0102 minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "U0lI9", "text": "0.0204 minute $^{-1}$", "image": null, "isCorrect": true}, {"id": "GrIgN", "text": "0.0306 minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "IXf5k", "text": "0.0408 minute $^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by:<br><br>$k = \\dfrac{2.303}{t} \\log_{10} \\left( \\dfrac{[A]_0}{[A]_t} \\right)$<br><br>Given that $60 \\%$ of the reactant converts into product in $45$ minutes, we have:<br>$t = 45 \\text{ minute}$<br>$[A]_0 = 100$<br>$[A]_t = 100 - 60 = 40$<br><br>Substituting these values into the formula:<br><br>$k = \\dfrac{2.303}{45} \\log_{10} \\left( \\dfrac{100}{40} \\right)$<br><br>$k = \\dfrac{2.303}{45} \\log_{10} (2.5)$<br><br>Using $\\log_{10} (2.5) = 0.3979$:<br><br>$k = \\dfrac{2.303 \\times 0.3979}{45}$<br><br>$k = \\dfrac{0.9164}{45}$<br><br>$k = 0.02036 \\text{ minute}^{-1} \\approx 0.0204 \\text{ minute}^{-1}$<br><br>Answer: 0.0204 minute $^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214360aee93fa0796dedd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "A zero order reaction has half life time of 0.2 minute. If initial concentration of reactant is $0.2 \\mathrm{~mol} \\mathrm{dm}^{-3}$. Find rate constant.", "image": null}, "options": [{"id": "JpKeY", "text": "$0.2 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}, {"id": "2Ho7T", "text": "$0.5 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~min}^{-1}$", "image": null, "isCorrect": true}, {"id": "Debfo", "text": "$1.4 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}, {"id": "RRrrc", "text": "$6.0 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a zero order reaction, the half-life is given by:<br><br>$t_{1/2} = \\dfrac{[A]_0}{2k}$<br><br>Rearranging for the rate constant $k$:<br><br>$k = \\dfrac{[A]_0}{2 t_{1/2}}$<br><br>Substituting the given values:<br><br>$k = \\dfrac{0.2}{2 \\times 0.2}$<br><br>$k = \\dfrac{0.2}{0.4} = 0.5 \\text{ mol dm}^{-3} \\text{ min}^{-1}$<br><br>Answer: $0.5 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~min}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e80aee93fa0796dc74", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Initial concentration of reactant in a first order reaction is $0.08 \\mathrm{~mol} \\mathrm{dm}^{-3}$ What concentration would remain after 40 minute?\r\n$\\left(\\operatorname{given} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}}=5.00\\right)$", "image": null}, "options": [{"id": "1H20T", "text": "$0.008 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "MJItz", "text": "$0.08 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "EqLlv", "text": "$0.016 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": true}, {"id": "PPNqs", "text": "$0.032 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Initial concentration, $[A]_0 = 0.08 \\text{ mol dm}^{-3}$<br>Ratio of initial concentration to concentration at time $t$, $\\dfrac{[A]_0}{[A]_t} = 5.00$<br><br>We need to find the concentration remaining after 40 minutes, which is $[A]_t$.<br><br>Using the given ratio:<br>$[A]_t = \\dfrac{[A]_0}{5.00}$<br><br>Substituting the value of $[A]_0$:<br>$[A]_t = \\dfrac{0.08}{5.00} = 0.016 \\text{ mol dm}^{-3}$<br><br>Answer: $0.016 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e70aee93fa0796dc6c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Rate constant of a reaction,\r\n$2 \\mathrm{NO}_2 \\mathrm{Cl}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{Cl}_{2(\\mathrm{~g})}$\r\nis 4.7672 minute $^{-1}$. Calculate half life of reaction.", "image": null}, "options": [{"id": "O8WOK", "text": "0.0727 minute", "image": null, "isCorrect": false}, {"id": "odKXJ", "text": "0.1454 minute", "image": null, "isCorrect": true}, {"id": "WhppS", "text": "0.2181 minute", "image": null, "isCorrect": false}, {"id": "IkMYJ", "text": "0.4362 minute", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The unit of the rate constant is $\\text{minute}^{-1}$, which indicates that the reaction is of the first order.<br><br>For a first-order reaction, the half-life $t_{1/2}$ is given by the formula:<br><br>$t_{1/2} = \\dfrac{0.693}{k}$<br><br>Substituting the given value of the rate constant $k = 4.7672 \\text{ minute}^{-1}$:<br><br>$t_{1/2} = \\dfrac{0.693}{4.7672}$<br><br>$t_{1/2} = 0.145368 \\text{ minute}$<br><br>Rounding off to four decimal places, we get:<br><br>$t_{1/2} \\approx 0.1454 \\text{ minute}$<br><br>Answer: 0.1454 minute", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d60aee93fa0796dbec", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Rate of a first order reaction is $1.5 \\times 10^{-2} \\mathrm{~mol} \\mathrm{~L}^{-1}$ minute ${ }^{-1}$ at 0.5 M concentration of reactant, calculate half life of reaction.", "image": null}, "options": [{"id": "r9Vwz", "text": "0.383 minute", "image": null, "isCorrect": false}, {"id": "kVpMt", "text": "7.53 minute", "image": null, "isCorrect": false}, {"id": "xEe8i", "text": "8.73 minute", "image": null, "isCorrect": false}, {"id": "dK95g", "text": "23.1 minute", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate equation is given by:<br><br>$\\text{Rate} = k[A]$<br><br>Substituting the given values:<br><br>$1.5 \\times 10^{-2} = k \\times 0.5$<br><br>$k = \\dfrac{1.5 \\times 10^{-2}}{0.5} = 3.0 \\times 10^{-2} \\text{ min}^{-1}$<br><br>The half-life of a first order reaction is given by:<br><br>$t_{1/2} = \\dfrac{0.693}{k}$<br><br>$t_{1/2} = \\dfrac{0.693}{3.0 \\times 10^{-2}} = 23.1 \\text{ min}$<br><br>Answer: 23.1 minute", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213720aee93fa0796d8dc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Half life of a first order reaction is 1 hour. What fraction of it will remain after 3 hour?", "image": null}, "options": [{"id": "0D3zY", "text": "$\\dfrac{1}{8}$", "image": null, "isCorrect": true}, {"id": "eQTku", "text": "$\\dfrac{1}{9}$", "image": null, "isCorrect": false}, {"id": "FJsRG", "text": "$\\dfrac{1}{16}$", "image": null, "isCorrect": false}, {"id": "Uk91Z", "text": "$\\dfrac{1}{64}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, the amount of reactant remaining after $n$ half-lives is given by $N = N_0 \\left(\\dfrac{1}{2}\\right)^n$.<br><br>Given half-life $t_{1/2} = 1$ hour and total time $t = 3$ hours.<br><br>Number of half-lives $n = \\dfrac{t}{t_{1/2}} = \\dfrac{3}{1} = 3$.<br><br>Fraction remaining $= \\dfrac{N}{N_0} = \\left(\\dfrac{1}{2}\\right)^3 = \\dfrac{1}{8}$.<br><br>Answer: $\\dfrac{1}{8}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213620aee93fa0796d85d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Half life of a zero order reaction is directly proportional to $\\qquad$", "image": null}, "options": [{"id": "uNYAb", "text": "temperature", "image": null, "isCorrect": false}, {"id": "vHwqY", "text": "rate constant", "image": null, "isCorrect": false}, {"id": "qRQRq", "text": "amount of product formed", "image": null, "isCorrect": false}, {"id": "katEt", "text": "initial concentration of reactant", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a zero order reaction, the integrated rate equation is given by:<br><br>$[A] = [A]_0 - kt$<br><br>At half-life, $t = t_{1/2}$ and $[A] = \\dfrac{[A]_0}{2}$.<br><br>Substituting these values into the rate equation:<br><br>$\\dfrac{[A]_0}{2} = [A]_0 - k t_{1/2}$<br><br>$k t_{1/2} = \\dfrac{[A]_0}{2}$<br><br>$t_{1/2} = \\dfrac{[A]_0}{2k}$<br><br>Thus, the half-life of a zero order reaction is directly proportional to the initial concentration of the reactant.<br><br>Answer: initial concentration of reactant", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213610aee93fa0796d852", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "What is rate constant of a first order reaction if $60 \\%$ reactant decompose in 45 minute?", "image": null}, "options": [{"id": "rR66s", "text": "0.010 minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "2Ge8a", "text": "0.015 minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "t8Y8h", "text": "0.020 minute $^{-1}$", "image": null, "isCorrect": true}, {"id": "Ikp3T", "text": "0.025 minute $^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by:<br><br>$k = \\dfrac{2.303}{t} \\log \\left( \\dfrac{a}{a-x} \\right)$<br><br>Given $t = 45$ minute, and $60\\%$ reactant decomposes, so $x = 0.6a$.<br><br>Remaining concentration $a-x = a - 0.6a = 0.4a$.<br><br>Substituting the values:<br><br>$k = \\dfrac{2.303}{45} \\log \\left( \\dfrac{a}{0.4a} \\right)$<br><br>$k = \\dfrac{2.303}{45} \\log (2.5)$<br><br>$k = \\dfrac{2.303}{45} \\times 0.3979$<br><br>$k = \\dfrac{0.916}{45}$<br><br>$k \\approx 0.020$ minute$^{-1}$<br><br>Answer: 0.020 minute $^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135f0aee93fa0796d848", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "For a zero order reaction $\\mathrm{A} \\longrightarrow$ product. Conc. of A decreases from $0.8 \\mathrm{~mol} \\mathrm{dm}^{-3}$ to $0.2 \\mathrm{~mol} \\mathrm{dm}^{-3}$ in 6 minute. What is rate constant of the reaction?", "image": null}, "options": [{"id": "i72tt", "text": "$0.01 \\mathrm{~mol} \\mathrm{dm}^{-3}$ minute ${ }^{-1}$", "image": null, "isCorrect": false}, {"id": "Hh23l", "text": "$1.0 \\mathrm{~mol} \\mathrm{dm}^{-3}$ minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "UVcVp", "text": "$0.1 \\mathrm{~mol} \\mathrm{dm}^{-3}$ minute $^{-1}$", "image": null, "isCorrect": true}, {"id": "ZUcnp", "text": "$1.66 \\mathrm{~mol} \\mathrm{dm}^{-3}$ minute ${ }^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a zero order reaction, the integrated rate equation is given by:<br><br>$[\\mathrm{A}]_0 - [\\mathrm{A}] = kt$<br><br>Given:<br>$[\\mathrm{A}]_0 = 0.8 \\mathrm{~mol} \\mathrm{dm}^{-3}$<br>$[\\mathrm{A}] = 0.2 \\mathrm{~mol} \\mathrm{dm}^{-3}$<br>$t = 6 \\mathrm{~minute}$<br><br>Substituting the values in the equation:<br><br>$0.8 - 0.2 = k \\times 6$<br><br>$0.6 = 6k$<br><br>$k = \\dfrac{0.6}{6} = 0.1 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{minute}^{-1}$<br><br>Answer: $0.1 \\mathrm{~mol} \\mathrm{dm}^{-3}$ minute $^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024
