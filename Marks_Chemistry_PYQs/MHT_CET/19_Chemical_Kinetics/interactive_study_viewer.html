nSo, if $[A]_0=100$, then $[A]_{\\mathrm{t}}=100-99.9=0.1$\n$$\n\\begin{aligned}\n\\mathrm{t} & =\\frac{2.303}{\\mathrm{k}} \\log _{10} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_4} \\\\\n& =\\frac{2.303}{0.576} \\log _{10} \\frac{100}{0.1}=\\frac{2.303}{0.576} \\log _{19}(1000) \\\\\n& =\\frac{2.303}{0.576} \\times 3 \\\\\n& =11.99 \\approx 12 \\text { minutes }\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620f0279619d9d8a317b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "Calculate the rate constant of the first order reaction if $80 \\%$ of the reactant reacted in 15 minute.", "image": null}, "options": [{"id": "T4sqz", "text": "0.11 minute $^{-1}$", "image": null, "isCorrect": true}, {"id": "DfiXK", "text": "0.22 minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "V3Bxw", "text": "0.34 minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "oyOUO", "text": "0.42 minute $^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$80 \\%$ of the reactant has reacted.\nSo, if $[A]_0=100$, then $[A]_{\\mathrm{t}}=100-80=20$\n$\\begin{aligned}\n\\mathrm{k} & =\\frac{2.303}{\\mathrm{t}} \\log _{10} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}} \\\\\n& =\\frac{2.303}{15} \\log _{10} \\frac{100}{20} \\\\\n& =\\frac{2.303}{15} \\log _{10}(5) \\\\\n& =\\frac{2.303}{15} \\times 0.699 \\\\\n& =0.1073 \\\\\n& \\approx 0.11 \\text { minute }^{-1}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e80279619d9d8a3047", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "Calculate the rate constant for the first order reaction, $\\mathrm{A} \\rightarrow \\mathrm{B}$ if the rate of reaction is $5.4 \\times 10^{-6} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$ and $[\\mathrm{A}]=0.3 \\mathrm{M}$.", "image": null}, "options": [{"id": "ClQ6C", "text": "$1.8 \\times 10^{-5} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "Xz1uP", "text": "$1.5 \\times 10^{-5} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "ctmkW", "text": "$2.1 \\times 10^{-5} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "vle7T", "text": "$2.4 \\times 10^{-5} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the first order reaction, $\\mathrm{A} \\longrightarrow \\mathrm{B}$, Rate $=\\mathrm{k}[\\mathrm{A}]$\n$\\begin{aligned}\n\\therefore \\quad \\mathrm{k} & =\\frac{\\text { Rate }}{[\\mathrm{A}]}=\\frac{5.4 \\times 10^{-6} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}}{0.3 \\mathrm{~mol} \\mathrm{dm}^{-3}} \\\\\n& =1.8 \\times 10^{-5} \\mathrm{~s}^{-1}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c20279619d9d8a2f1b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "Calculate the rate constant of first order reaction if the concentration of the reactant decreases by $90 \\%$ in 30 minutes.", "image": null}, "options": [{"id": "oLwac", "text": "$7.7 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": true}, {"id": "rPoz6", "text": "$4.2 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "Nm2ya", "text": "$2.1 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "NoNvj", "text": "$3.5 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Concentration decreases by $90 \\%$. Hence, $10 \\%$ reactant is left after 30 minutes.\n$\\begin{aligned}\n\\mathrm{k} & =\\frac{2.303}{\\mathrm{t}} \\log _{10} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}} \\\\\n\\mathrm{k} & =\\frac{2.303}{30} \\log _{10} \\frac{100}{10} \\\\\n& =\\frac{2.303}{30 \\mathrm{~min}} \\\\\n& =7.7 \\times 10^{-2} \\mathrm{~min}^{-1}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": " Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261640279619d9d8a2c2e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "What is order of reaction if unit of rate constant is $\\mathrm{s}^{-1}$ ?", "image": null}, "options": [{"id": "gU23Y", "text": "3", "image": null, "isCorrect": false}, {"id": "S75qU", "text": "2", "image": null, "isCorrect": false}, {"id": "NYj0D", "text": "0", "image": null, "isCorrect": false}, {"id": "B5jbZ", "text": "1", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "If order of $\\mathrm{rx}^{\\mathrm{n}}$ is $\\mathrm{n}$ the unit of rate constant is $\\mathrm{K}=\\left(\\frac{\\mathrm{mol}}{\\text { lit }}\\right)^{1-\\mathrm{n}} \\mathrm{sec}^{-1}$\n$\\therefore 1-n=0$\nor $n=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261540279619d9d8a2ba9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "The rate law for a reaction between reactants $A, B$ and $C$ is $r=K[A][B][C]^2$, if concentration of $A$ is halved, then rate of reaction", "image": null}, "options": [{"id": "Mfaxe", "text": "increase $\\frac{1}{2}$ times", "image": null, "isCorrect": false}, {"id": "s2abb", "text": "remains the same", "image": null, "isCorrect": false}, {"id": "nGTEx", "text": "decreases $\\frac{1}{2}$ times", "image": null, "isCorrect": true}, {"id": "Ir6SD", "text": "increase 2 times", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{r}=\\mathrm{K}[\\mathrm{A}][\\mathrm{B}][\\mathrm{C}]^2$ of canc. of $\\mathrm{A}$ is halved\n$\\mathrm{r}=\\mathrm{K} \\frac{[\\mathrm{A}]}{2}[\\mathrm{~B}][\\mathrm{C}]^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261520279619d9d8a2ba0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "Which of the following is an example of first order reaction?", "image": null}, "options": [{"id": "UlDnw", "text": "$2 \\mathrm{NH}_3(\\mathrm{~g}) \\rightarrow \\mathrm{N}_2(\\mathrm{~g})+3 \\mathrm{H}_2(\\mathrm{~g})$", "image": null, "isCorrect": false}, {"id": "Q8GyR", "text": "$2 \\mathrm{H}_2 \\mathrm{O}(\\mathrm{l}) \\rightarrow 2 \\mathrm{H}_2 \\mathrm{O}(\\mathrm{l})+\\mathrm{O}_2(\\mathrm{~g})$", "image": null, "isCorrect": false}, {"id": "cCMYt", "text": "$4 \\mathrm{PH}_3 \\stackrel{\\mathrm{W}}{\\longrightarrow} \\mathrm{P}_4+6 \\mathrm{H}_2(\\mathrm{~g})$", "image": null, "isCorrect": false}, {"id": "Hg6Ga", "text": "$2 \\mathrm{~N}_2 \\mathrm{O}(\\mathrm{g}) \\stackrel{\\mathrm{Pt}}{\\longrightarrow} 2 \\mathrm{~N}_2(\\mathrm{~g})+\\mathrm{O}_2(\\mathrm{~g})$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Reaction order is an experimentally determined quantity describing how rate depends on reactant concentrations. A first-order reaction exhibits a rate linearly dependent on a single reactant concentration, or one where the sum of concentration exponents in the rate law equals one.</p><p>Considering each option:</p><p><strong>A)</strong> $\\mathrm{CH}_3\\mathrm{CHO}_{(\\mathrm{g})} \\rightarrow \\mathrm{CH}_{4(\\mathrm{~g})}+\\mathrm{CO}_{(\\mathrm{g})}$: Acetaldehyde decomposition may follow first-order kinetics at high temperatures but exhibits complex behavior and is not universally first-order.</p><p><strong>B)</strong> $2\\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{F}_{2(\\mathrm{~g})} \\rightarrow 2\\mathrm{NO}_2\\mathrm{~F}_{(\\mathrm{g})}$: The rate law is Rate $= k[\\mathrm{NO}_2][\\mathrm{F}_2]$, with exponent sum $1+1=2$, indicating second-order kinetics.</p><p><strong>C)</strong> $2\\mathrm{NO}_{(\\mathrm{g})}+2\\mathrm{H}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{N}_{2(\\mathrm{~g})}+2\\mathrm{H}_2\\mathrm{O}_{(\\mathrm{g})}$: The rate law is Rate $= k[\\mathrm{NO}]^2[\\mathrm{H}_2]$, with exponent sum $2+1=3$, making it third-order.</p><p><strong>D)</strong> $2\\mathrm{H}_2\\mathrm{O}_{2(\\ell)} \\rightarrow 2\\mathrm{H}_2\\mathrm{O}_{(\\ell)}+\\mathrm{O}_{2(\\mathrm{~g})}$: Hydrogen peroxide decomposition has the rate law Rate $= k[\\mathrm{H}_2\\mathrm{O}_2]$, with exponent 1, confirming it as a first-order reaction.</p><p>Option D is the unambiguous example of first-order kinetics.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261440279619d9d8a2b27", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "Rate of reaction for $2 \\mathrm{X}+\\mathrm{Y} \\rightarrow 3 \\mathrm{~W}+\\mathrm{Z}$ is $1.2 \\times 10^{-4} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$ when $[\\mathrm{X}]=[\\mathrm{Y}]=0.6 \\mathrm{~mol} \\mathrm{dm}^{-3}$\nCalculate value of rate constant if reaction is first order in $\\mathrm{X}$ and zero order in Y", "image": null}, "options": [{"id": "MMkDW", "text": "$1.2 \\times 10^{-4} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "qo88m", "text": "$6 \\times 10^{-3} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "VxRuj", "text": "$2 \\times 10^{-4} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": true}, {"id": "NR4u3", "text": "$1.8 \\times 10^{-3} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{R}=-\\frac{1}{2} \\frac{\\mathrm{d}[\\mathrm{X}]}{\\mathrm{dt}}=-\\frac{\\mathrm{d}[\\mathrm{Y}]}{\\mathrm{dt}}=\\frac{1}{3} \\frac{\\mathrm{d}[\\mathrm{W}]}{\\mathrm{dt}}=\\frac{\\mathrm{d}[\\mathrm{Z}]}{\\mathrm{dt}} \\\\ & \\mathrm{R}=\\mathrm{k}[\\mathrm{X}] \\\\ & 1.2 \\times 10^{-4}=\\mathrm{k}(0.6) \\\\ & \\mathrm{k}=2 \\times 10^{-4} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2611d0279619d9d8a29eb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "For the reaction $2 \\mathrm{~A}+\\mathrm{B} \\rightarrow$ product, rate of the reaction is $15 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$. When $[\\mathrm{A}]=0.3 \\mathrm{~mol} \\mathrm{dm}^{-3}$ and $[B]=0.05 \\mathrm{~mol} \\mathrm{dm}^{-3}$. What is the value of rate constant if reaction is first order in both the reactants?", "image": null}, "options": [{"id": "NVvIx", "text": "$8$", "image": null, "isCorrect": false}, {"id": "XLVzw", "text": "$10$", "image": null, "isCorrect": true}, {"id": "NeXB6", "text": "$2$", "image": null, "isCorrect": false}, {"id": "DiK5t", "text": "$5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{r}=\\mathrm{k}(\\mathrm{A})(\\mathrm{B}) \\\\ & \\Rightarrow 15 \\times 10^{-2}=\\mathrm{k}(0.3)(0.05) \\Rightarrow \\mathrm{k}=10 \\ell / \\mathrm{mol}-\\mathrm{sec}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2610b0279619d9d8a295c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "Rate law equation for a reaction is $R=k[x][y]$, rate of reaction doubles when", "image": null}, "options": [{"id": "Tvnu0", "text": "conc. of $\\mathrm{x}$ is kept constant and conc. of $\\mathrm{y}$ is halved", "image": null, "isCorrect": false}, {"id": "eFuNe", "text": "conc. of both $\\mathrm{x}$ and $\\mathrm{y}$ is doubled", "image": null, "isCorrect": false}, {"id": "iDB70", "text": "conc. of $\\mathrm{x}$ is doubled and conc. of $\\mathrm{y}$ is kept constant", "image": null, "isCorrect": true}, {"id": "VcKjb", "text": "conc. of $\\mathrm{y}$ is doubled and conc. of $\\mathrm{x}$ is halved", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{r}=\\mathrm{k}(\\mathrm{x})(\\mathrm{y})$\nOf $\\mathrm{x}$ is doubled and $\\mathrm{y}$ remains constant the rate is doubled.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261090279619d9d8a2949", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "Rate of first order reaction $\\mathrm{A} \\rightarrow$ product is $0.01 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$, calculate rate constant if concentration of reactant is $0.2 \\mathrm{M}$ ?", "image": null}, "options": [{"id": "oEFkN", "text": "$0.05 \\mathrm{sec}^{-1}$", "image": null, "isCorrect": true}, {"id": "t4IDx", "text": "$0.1 \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "NJ2ss", "text": "$0.5 \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "sOp9d", "text": "$0.01 \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{r}=\\mathrm{K}(\\mathrm{A})$\n$0.01=K(0.2)$\n$\\mathrm{K}=\\frac{0.01}{0.20}=0.05 \\mathrm{sec}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261080279619d9d8a2944", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "Rate of reaction $\\mathrm{x}+\\mathrm{y} \\rightarrow$ product is $5.4 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$. When $[\\mathrm{x}]=0.2 \\mathrm{~mol} \\mathrm{dm}^{-3}$ and $[\\mathrm{y}]=0.1 \\mathrm{~mol} \\mathrm{dm}^{-3}$, calculate rate constant of reaction if it is first order in $\\mathrm{X}$ and second order in $\\mathrm{Y}$", "image": null}, "options": [{"id": "4G1lN", "text": "$18 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "8OpAs", "text": "$27 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{sec}^{-1}$", "image": null, "isCorrect": true}, {"id": "kwKoO", "text": "$32 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "TtgYX", "text": "$12 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{r}=-\\frac{\\mathrm{d}(\\mathrm{x})}{\\mathrm{dt}}=-\\frac{\\mathrm{d}(\\mathrm{y})}{\\mathrm{dt}} \\\\ & \\mathrm{r}=5.4 \\times 10^{-2} \\frac{\\mathrm{mol}}{\\mathrm{dm}^3-\\mathrm{sec}} \\\\ & \\mathrm{r}=\\mathrm{k}[\\mathrm{x}] \\cdot[\\mathrm{y}]^2 \\\\ & 5.4 \\times 10^{-2}=\\mathrm{K}(0.2)(0.1)^2 \\\\ & \\mathrm{~K}=27 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{sec}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ab0279619d9d8a265a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "The rate law equation for a reaction between $\\mathrm{A}, \\mathrm{B}$ and $\\mathrm{C}$ is $\\mathrm{r}=\\mathrm{k}[\\mathrm{A}][\\mathrm{B}][\\mathrm{C}]^2$, what will be new rate of reaction if concentration of both A and B are doubled.", "image": null}, "options": [{"id": "K1UK7", "text": "$2 r$", "image": null, "isCorrect": false}, {"id": "J6Ole", "text": "$4 \\mathrm{r}$", "image": null, "isCorrect": true}, {"id": "ElS08", "text": "$6 \\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "peXTN", "text": "$8 r$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{r}=\\mathrm{k}[\\mathrm{A}][\\mathrm{B}][\\mathrm{C}]^2 \\\\ & \\mathrm{~A} \\rightarrow 2 \\mathrm{~A} \\\\ & \\mathrm{~B} \\rightarrow 2 \\mathrm{~B} \\\\ & \\mathrm{r}_{\\text {new }}=\\mathrm{k}[2 \\mathrm{~A}][2 \\mathrm{~B}][\\mathrm{C}]^2 \\\\ & \\frac{\\mathrm{r}_{\\text {new }}}{\\mathrm{r}}=\\frac{\\mathrm{k}[2 \\mathrm{~A}][2 \\mathrm{~B}][\\mathrm{C}]^2}{\\mathrm{k}[\\mathrm{A}][\\mathrm{B}][\\mathrm{C}]^2} \\\\ & \\frac{\\mathrm{r}_{\\text {new }}}{\\mathrm{r}}=2 \\times 2, \\mathrm{r}_{\\text {new }}=4 \\mathrm{r}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a90279619d9d8a264e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "The order of reaction for which the units of rate constant are $\\mathrm{mol} \\mathrm{dm}{ }^{-3} \\mathrm{~s}^{-1}$ is", "image": null}, "options": [{"id": "ioWnG", "text": "2", "image": null, "isCorrect": false}, {"id": "J7WIi", "text": "1", "image": null, "isCorrect": false}, {"id": "dXuEC", "text": "0", "image": null, "isCorrect": true}, {"id": "7PleT", "text": "3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/i7h2wVof5Vwg3nIrgEUmUFZlM4fAvzeSicbCPMGH1hI.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260970279619d9d8a25be", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "For the reaction $\\mathrm{A}+\\mathrm{B} \\rightarrow$ product, rate of reaction is $3.6 \\times 10^{-2}$ $\\mathrm{mol} \\mathrm{dm}{ }^{-3} \\mathrm{sec}^{-1}$.\nWhen $[\\mathrm{A}]=0.2 \\mathrm{~mol} \\mathrm{dm}^{-3}$ and $[\\mathrm{B}]=0.1 \\mathrm{~mol} \\mathrm{dm}^{-3}$, find rate constant of reaction if it is second order with respective to both reactants.", "image": null}, "options": [{"id": "8j2E4", "text": "$18 \\mathrm{~mol}^{-3} \\mathrm{dm}^9 \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "I4m7D", "text": "$90 \\mathrm{~mol}^{-3} \\mathrm{dm}^9 \\mathrm{sec}^{-1}$", "image": null, "isCorrect": true}, {"id": "DZyFe", "text": "$72 \\mathrm{~mol}^{-3} \\mathrm{dm}^9 \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "aVPjN", "text": "$36 \\mathrm{~mol}^{-3} \\mathrm{dm}^9 \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rate law is.\n$$\n\\begin{aligned}\n& \\mathrm{r}=\\mathrm{K}[\\mathrm{A}]^2[\\mathrm{~B}]^2 \\\\\n& 3.6 \\times 10^{-2}=\\mathrm{k}(0.2)^2(0.1)^2 \\\\\n& \\mathrm{~K}=\\frac{3.6 \\times 10^{-2}}{0.04 \\times 0.01} \\\\\n& \\mathrm{~K}=90 \\mathrm{~mol}^{-3} \\mathrm{dm}^9 \\mathrm{sec}^{-1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260970279619d9d8a25ba", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "If decomposition of hydrogen peroxide is a first order reaction, it's rate law equation can be represented as", "image": null}, "options": [{"id": "hKHvs", "text": "$\\mathrm{r}=\\frac{\\mathrm{k}}{\\left[\\mathrm{H}_2 \\mathrm{O}_2\\right]}$", "image": null, "isCorrect": false}, {"id": "obRtM", "text": "$\\mathrm{r}=\\mathrm{k}\\left[\\mathrm{H}_2 \\mathrm{O}_2\\right]$", "image": null, "isCorrect": true}, {"id": "IuzdC", "text": "$\\mathrm{r}=\\mathrm{k} \\frac{\\left[\\mathrm{H}_2 \\mathrm{O}\\right]\\left[\\mathrm{O}_2\\right]^{1 / 2}}{\\left[\\mathrm{H}_2 \\mathrm{O}_2\\right]}$", "image": null, "isCorrect": false}, {"id": "BgB7t", "text": "$\\mathrm{r}=\\mathrm{k} \\frac{\\left[\\mathrm{H}_2 \\mathrm{O}_2\\right]}{\\left[\\mathrm{H}_2 \\mathrm{O}_2\\right]\\left[\\mathrm{O}_2\\right]^{1 / 2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{H}_2 \\mathrm{O}_2 \\longrightarrow \\mathrm{H}_2 \\mathrm{O}+\\frac{1}{2} \\mathrm{O}_2\n$$\nReaction is first order reaction.\nRate law equation can be represented as,\n$$\n\\mathrm{R}=\\mathrm{k}\\left[\\mathrm{H}_2 \\mathrm{O}_2\\right]^1\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260880279619d9d8a2543", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "Which of the following statement is NOT true for a reaction having rate law $\\mathrm{r}=\\mathrm{k}\\left[\\mathrm{H}_2\\right]\\left[\\mathrm{I}_2\\right]$ ?", "image": null}, "options": [{"id": "s6e5Z", "text": "The reaction is first order in $\\mathrm{H}_2$", "image": null, "isCorrect": false}, {"id": "6jrZH", "text": "Overall order of reaction is 1", "image": null, "isCorrect": true}, {"id": "nrhEW", "text": "The reaction is first order in $\\mathrm{I}_2$", "image": null, "isCorrect": false}, {"id": "sCqrZ", "text": "Overall order of reaction is 2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{r}=\\mathrm{k}\\left[\\mathrm{H}_2\\right]\\left[\\mathrm{I}_2\\right]\n$$\nOverall order of reaction is 2 .\nOrder of reaction wrt $\\mathrm{H}_2$ is 1 and Order of reaction wrt $I_2$ is 1 .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260760279619d9d8a24ad", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "For the reaction $2 \\mathrm{~A}+2 \\mathrm{~B} \\rightarrow 2 \\mathrm{C}+\\mathrm{D}$ \nIf $\\mathrm{r}=\\mathrm{k}[\\mathrm{A}]^2[\\mathrm{~B}]^0$, then rate of reaction is", "image": null}, "options": [{"id": "TNOd2", "text": "inversely proportional to square of concentration of A", "image": null, "isCorrect": false}, {"id": "eXXwq", "text": "independent of concentration of A", "image": null, "isCorrect": false}, {"id": "10PW8", "text": "independent of concentration of B", "image": null, "isCorrect": true}, {"id": "Z1zww", "text": "directly proportional to concentration of B", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\mathrm{r}=\\mathrm{k}[\\mathrm{A}]^2[\\mathrm{~B}]^0\n$$\nOrder wrt B is zero\nRate will be independent of concentration of $\\mathrm{B}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260710279619d9d8a2489", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "Identify order of reaction if it's rate constant is $\\mathrm{x} \\mathrm{sec}^{-1}$.", "image": null}, "options": [{"id": "mrClg", "text": "3", "image": null, "isCorrect": false}, {"id": "hvW3t", "text": "2", "image": null, "isCorrect": false}, {"id": "7Mpls", "text": "0", "image": null, "isCorrect": false}, {"id": "3WbLk", "text": "1", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Unit of Rate constant $(\\mathrm{k})$ is $\\mathrm{M}^{(1-\\text { order })} \\cdot \\mathrm{sec}^{-1}$ $\\mathrm{k}=\\mathrm{x} \\mathrm{sec}^{-1}$ (given)\n(By comparison) $1-$ order $=0$\nOrder $=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260190279619d9d8a21ba", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "Consider the reaction $2 \\mathrm{~A}+2 \\mathrm{~B} \\rightarrow \\mathrm{C}+2 \\mathrm{D}$. If the concentration of $\\mathrm{A}$ is doubled at constant $\\mathrm{B}$, the rate increases by a factor 4 . If the concentration of $\\mathrm{B}$ is doubled at constant $A$, rate is doubled. What is the rate law?", "image": null}, "options": [{"id": "WJHDW", "text": "$r=k[A]^{2}[B]^{2}$", "image": null, "isCorrect": false}, {"id": "AjoZh", "text": "$r=k[A]^{4}[B]^{2}$", "image": null, "isCorrect": false}, {"id": "9mOCw", "text": "$r=k[A][B]^{2}$", "image": null, "isCorrect": false}, {"id": "XiCp5", "text": "$r=k[A]^{2}[B]$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{A}+\\mathrm{B}_{2} \\longrightarrow \\mathrm{AB}+\\mathrm{B}$\nGiven Rate $\\propto[\\mathrm{A}]$ and not on $[\\mathrm{B}]$\nRate depends on concentration of reactants.\nRate $=\\mathrm{k}[\\mathrm{A}]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260040279619d9d8a2111", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "What is the molecularity and order of the following reaction if rate law is rate $=\\mathrm{K}\\left[\\mathrm{O}_{3}\\right][\\mathrm{O}]$ respectively?\n$\\mathrm{O}_{3(\\mathrm{~g})}+\\mathrm{O}_{(\\mathrm{g})} \\longrightarrow 2 \\mathrm{O}_{2(\\mathrm{~g})}$", "image": null}, "options": [{"id": "6FdzU", "text": "3 and 2", "image": null, "isCorrect": false}, {"id": "cwIrd", "text": "3 and 1", "image": null, "isCorrect": false}, {"id": "uidea", "text": "3 and 2", "image": null, "isCorrect": true}, {"id": "7noHf", "text": "4 and 2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{O}_{3(\\mathrm{g})}+\\mathrm{O}_{(\\mathrm{g})} \\longrightarrow 2 \\mathrm{O}_{2(\\mathrm{g})}$\ni. rate $=\\mathrm{k}\\left[\\mathrm{O}_{3}\\right][\\mathrm{O}]$\n$\\therefore$ Order of reaction $=2$\nii. Molecularity (No. of reactant molecules taking part in reaction) $=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fba0279619d9d8a1ec1", "  "02LJZ", "text": "$1.5$", "image": null, "isCorrect": true}, {"id": "Kqbie", "text": "0", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Decomposition of gaseous acetaldehyde,\n$\\mathrm{CH}_{3} \\mathrm{CHO}_{(\\mathrm{g})} \\longrightarrow \\mathrm{CH}_{4(\\mathrm{~g})}+\\mathrm{CO}_{(\\mathrm{g})}$\n$\\therefore$ Rate $=\\mathrm{k}\\left[\\mathrm{CH}_{3} \\mathrm{CHO}\\right]^{3 / 2}$\nThe order of the reaction is $1.5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f6e0279619d9d8a1c67", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "The rate law for the reaction $\\mathrm{A}+\\mathrm{B}+\\mathrm{C} \\longrightarrow$ Product is expressed as Rate $=\\mathrm{K}[\\mathrm{A}]^{2}[\\mathrm{~B}]^{1}[\\mathrm{C}]^{0} .$ What is the overall order of the reaction?", "image": null}, "options": [{"id": "6f2IQ", "text": "3", "image": null, "isCorrect": true}, {"id": "JSA5b", "text": "0", "image": null, "isCorrect": false}, {"id": "U81rA", "text": "1", "image": null, "isCorrect": false}, {"id": "OuY7R", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00 eldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "The rate constant and half-life of a first-order reaction are related to each other as -", "image": null}, "options": [{"id": "yLA1k", "text": "<math><mi>&nbsp;</mi><msub><mrow><mi>t</mi></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msub><mo>=</mo><mfrac><mrow><mn>0.693</mn></mrow><mrow><mi>K</mi></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "o4LoA", "text": "<math><msub><mrow><mi>t</mi></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msub><mo>=</mo><mn>0.693</mn><mi>K</mi></math>", "image": null, "isCorrect": false}, {"id": "7HwwF", "text": "<math><mi>K</mi><mo>=</mo><mn>0.693</mn><mi> </mi><msub><mrow><mi>t</mi></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "oDfXl", "text": "<math><mi>K</mi><msub><mrow><mi>t</mi></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msub><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>0.693</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The half life of <math><msup><mrow><mn>1</mn></mrow><mrow><mi>s</mi><mi>t</mi></mrow></msup></math> order rate of reaction is given as <math><msub><mrow><mi>t</mi></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msub><mo>=</mo><mfrac><mrow><mn>0.693</mn></mrow><mrow><mi>K</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7a0279619d9d8a14c3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The units of rate constant for first order reaction are", "image": null}, "options": [{"id": "BHSj7", "text": "$\\mathrm{mol} \\mathrm{L}^{-1} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "wxWsU", "text": "$\\mathrm{s}^{-1}$", "image": null, "isCorrect": true}, {"id": "OiNHw", "text": "$\\mathrm{I} \\cdot \\mathrm{mol}^{-1} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "YCrZp", "text": "$\\mathrm{I}^{2} \\mathrm{mo}^{-2} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For $n$ th order reaction, the units of rate constant $=\\left(\\mathrm{mol} \\mathrm{L}^{-1}\\right)^{1-n} \\mathrm{~s}^{-1}$\n(where, $n=$ order of reaction $)$\n$\\therefore$ For Ist order reaction, the units of rate constant $=\\left(\\mathrm{mol} \\mathrm{L}^{-1}\\right)^{1-1} \\mathrm{~s}^{-1}$\n$=\\mathrm{s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e690279619d9d8a1433", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "For which order reaction, the unit of rate constant is time $^{-1}$ ?", "image": null}, "options": [{"id": "zIlij", "text": "Zero order", "image": null, "isCorrect": false}, {"id": "w2OTz", "text": "First order", "image": null, "isCorrect": true}, {"id": "GQiHz", "text": "Second order", "image": null, "isCorrect": false}, {"id": "BC3nl", "text": "Third order", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Units of rate constant for $n$ order $=\\mathrm{mol}^{1-n} \\mathrm{~L}^{n-1} \\mathrm{~s}^{-1} .$\nGiven, unit of rate constant $=\\mathrm{mol}^{0} \\mathrm{~L}^{0}$ time $^{-1}$. On comparing,\n$\\therefore$\n$$\n\\begin{array}{l}\n0=n-1 \\\\\nn=+1\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e580279619d9d8a13b0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "For a reaction, $A+2 B \\longrightarrow C$, rate is given by $+\\frac{d[C]}{d t}=k[A][B]$, hence, the order of the reaction is", "image": null}, "options": [{"id": "rTUOe", "text": "3", "image": null, "isCorrect": false}, {"id": "owMgG", "text": "2", "image": null, "isCorrect": true}, {"id": "aECDW", "text": "1", "image": null, "isCorrect": false}, {"id": "8zLZ0", "text": "0", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rate $\\left(\\frac{+d c}{d t}\\right)=k[A][B]$\nThus, the order of reaction w.r.t. $A=1$\nthe order of reaction $w . r . t . B=1$\nTotal order of reaction $=1+1=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e420279619d9d8a12fd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "A certain nuclide has a half-life period of 30 min. If a sample containing 600 atoms is allowed to decay for 90 min, how many atoms will remain ?", "image": null}, "options": [{"id": "PpjWv", "text": "200 atoms", "image": null, "isCorrect": false}, {"id": "B1jVO", "text": "450 atoms", "image": null, "isCorrect": false}, {"id": "uO0uu", "text": "75 atoms", "image": null, "isCorrect": true}, {"id": "M7nLL", "text": "150 atoms", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} n &=\\frac{\\text { total time }}{\\text { half- life period }}=\\frac{90}{30}=3 \\\\ N &=N_{0} \\times\\left(\\frac{1}{2}\\right)^{n} \\\\ &=600 \\times\\left(\\frac{1}{2}\\right)^{3} \\\\ &=\\frac{600}{8} \\\\ &=75 \\text { atoms } \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a2632e0279619d9d8a3cbf", "title": "Integrated rate laws", "totalQuestions": 127, "questions": [{"_id": "6abb88d315a9fc0fc8c1474c", "type": "singleCorrect", "question": {"text": "The half life of a first order reaction is $13.86$ minutes. Calculate the time required for the reactant to be reduced to $20\\%$.", "image": null}, "options": [{"id": "TYwQQ", "label": "A", "text": "$8.05$ min.", "isCorrect": false, "image": null}, {"id": "h7bjQ", "label": "B", "text": "$16.1$ min.", "isCorrect": false, "image": null}, {"id": "jvUx4", "label": "C", "text": "$32.2$ min.", "isCorrect": true, "image": null}, {"id": "PBVvZ", "label": "D", "text": "$48.3$ min.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by:<br><br>$k = \\dfrac{0.693}{t_{1/2}}$<br><br>Substituting the given half-life $t_{1/2} = 13.86$ min:<br><br>$k = \\dfrac{0.693}{13.86} = 0.05 \\text{ min}^{-1}$<br><br>The time $t$ required for the reactant to be reduced to $20\\%$ of its initial concentration is calculated using the first order integrated rate equation:<br><br>$t = \\dfrac{2.303}{k} \\log \\left( \\dfrac{[A]_0}{[A]} \\right)$<br><br>Given that the reactant is reduced to $20\\%$, $[A] = 0.20 [A]_0$.<br><br>$t = \\dfrac{2.303}{0.05} \\log \\left( \\dfrac{100}{20} \\right)$<br><br>$t = \\dfrac{2.303}{0.05} \\log 5$<br><br>Using $\\log 5 = 0.699$:<br><br>$t = 46.06 \\times 0.699 = 32.19 \\text{ min} \\approx 32.2 \\text{ min}$<br><br>Answer: $32.2$ min.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a215a9fc0fc8c1458a", "type": "singleCorrect", "question": {"text": "The rate constant for a first order reaction is $2.2 \\times 10^{-5}$ s$^{-1}$ at $320^\\circ\\text{C}$. Calculate the time required for $15\\%$ completion?", "image": null}, "options": [{"id": "TV2Qg", "label": "A", "text": "$639$ S", "isCorrect": false, "image": null}, {"id": "e999p", "label": "B", "text": "$7391$ S", "isCorrect": true, "image": null}, {"id": "wzThA", "label": "C", "text": "$3971$ S", "isCorrect": false, "image": null}, {"id": "dCaFL", "label": "D", "text": "$9371$ S", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the time required is given by the integrated rate equation:<br><br>$t = \\dfrac{2.303}{k} \\log \\left( \\dfrac{a}{a-x} \\right)$<br><br>Given $k = 2.2 \\times 10^{-5} \\text{ s}^{-1}$. For $15\\%$ completion, the remaining concentration is $100 - 15 = 85\\%$.<br><br>$t = \\dfrac{2.303}{2.2 \\times 10^{-5}} \\log \\left( \\dfrac{100}{85} \\right)$<br><br>$t = \\dfrac{2.303}{2.2 \\times 10^{-5}} (\\log 20 - \\log 17)$<br><br>Substituting the values $\\log 20 \\approx 1.3010$ and $\\log 17 \\approx 1.2304$:<br><br>$t = \\dfrac{2.303}{2.2 \\times 10^{-5}} (1.3010 - 1.2304)$<br><br>$t = \\dfrac{2.303 \\times 0.0706}{2.2 \\times 10^{-5}}$<br><br>$t = \\dfrac{0.16259}{2.2 \\times 10^{-5}}$<br><br>$t \\approx 7391 \\text{ s}$<br><br>Answer: $7391$ S", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b215a9fc0fc8c14620", "type": "singleCorrect", "question": {"text": "For the first order reaction, the half life period is $10$ minutes. What quantity of reactant remains after $30$ minutes if the initial quantity of reactant taken is $1$ g?", "image": null}, "options": [{"id": "y4Jgg", "label": "A", "text": "$0.25\\ \\text{g}$", "isCorrect": false, "image": null}, {"id": "EJNWT", "label": "B", "text": "$0.33\\ \\text{g}$", "isCorrect": false, "image": null}, {"id": "Y9iYA", "label": "C", "text": "$0.125\\ \\text{g}$", "isCorrect": true, "image": null}, {"id": "BmuTh", "label": "D", "text": "$0.0625\\ \\text{g}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $t_{1/2} = 10$ minutes and total time $t = 30$ minutes.<br><br>Number of half-lives $n = \\dfrac{t}{t_{1/2}} = \\dfrac{30}{10} = 3$<br><br>For a first order reaction, the amount of reactant remaining after $n$ half-lives is given by:<br><br>$N = N_0 \\left(\\dfrac{1}{2}\\right)^n$<br><br>Substituting the given values:<br><br>$N = 1 \\times \\left(\\dfrac{1}{2}\\right)^3$<br><br>$N = \\dfrac{1}{8} = 0.125\\ \\text{g}$<br><br>Answer: $0.125\\ \\text{g}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b215a9fc0fc8c1461f", "type": "singleCorrect", "question": {"text": "If time required for $99\\%$ completion of a first order reaction is $t$ minutes, find the time required for $99.9\\%$ completion.", "image": null}, "options": [{"id": "sVmYS", "label": "A", "text": "$t$ minutes.", "isCorrect": false, "image": null}, {"id": "TQdDi", "label": "B", "text": "$2t$ minutes.", "isCorrect": false, "image": null}, {"id": "cQcDm", "label": "C", "text": "$3t/2$ minutes.", "isCorrect": true, "image": null}, {"id": "T5c1u", "label": "D", "text": "$t/2$ minutes.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the time required for completion is given by $t = \\dfrac{2.303}{k} \\log \\left( \\dfrac{a}{a-x} \\right)$<br><br>For $99\\%$ completion, $t_{99\\%} = \\dfrac{2.303}{k} \\log \\left( \\dfrac{100}{100-99} \\right) = \\dfrac{2.303}{k} \\log(100) = \\dfrac{2.303}{k} \\times 2$<br><br>Given $t_{99\\%} = t$, we have $t = \\dfrac{2.303}{k} \\times 2$<br><br>For $99.9\\%$ completion, $t_{99.9\\%} = \\dfrac{2.303}{k} \\log \\left( \\dfrac{100}{100-99.9} \\right) = \\dfrac{2.303}{k} \\log(1000) = \\dfrac{2.303}{k} \\times 3$<br><br>Substituting $\\dfrac{2.303}{k} = \\dfrac{t}{2}$, we get $t_{99.9\\%} = \\dfrac{t}{2} \\times 3 = \\dfrac{3t}{2}$ minutes.<br><br>Answer: $3t/2$ minutes.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887215a9fc0fc8c143c8", "type": "singleCorrect", "question": {"text": "A first order reaction has a half life period $69.3$ seconds. Calculate the rate of reaction if the concentration of reactant is $0.1$ M.", "image": null}, "options": [{"id": "3hKdc", "label": "A", "text": "$1.0 \\times 10^{-1}$ mol dm$^{-3}$ s$^{-1}$", "isCorrect": false, "image": null}, {"id": "ffaE4", "label": "B", "text": "$1.0 \\times 10^{-2}$ mol dm$^{-3}$ s$^{-1}$", "isCorrect": false, "image": null}, {"id": "3VdyF", "label": "C", "text": "$1.0 \\times 10^{-3}$ mol dm$^{-3}$ s$^{-1}$", "isCorrect": true, "image": null}, {"id": "eBzRM", "label": "D", "text": "$1.0 \\times 10^{-4}$ mol dm$^{-3}$ s$^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is related to the half-life $t_{1/2}$ by the equation:<br><br>$k = \\dfrac{0.693}{t_{1/2}}$<br><br>Substituting the given value of $t_{1/2} = 69.3$ s:<br><br>$k = \\dfrac{0.693}{69.3} = 0.01$ s$^{-1} = 1.0 \\times 10^{-2}$ s$^{-1}$<br><br>The rate of a first order reaction is given by:<br><br>Rate $= k[A]$<br><br>Given the concentration of the reactant $[A] = 0.1$ M (or mol dm$^{-3}$):<br><br>Rate $= (1.0 \\times 10^{-2} \\text{ s}^{-1}) \\times (0.1 \\text{ mol dm}^{-3})$<br><br>Rate $= 1.0 \\times 10^{-3}$ mol dm$^{-3}$ s$^{-1}$<br><br>Answer: $1.0 \\times 10^{-3}$ mol dm$^{-3}$ s$^{-1}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887215a9fc0fc8c143c7", "type": "singleCorrect", "question": {"text": "What is the slope for a first-order reaction plot of $\\log[A]_0/[A]_t$ vs time $(t)$?", "image": null}, "options": [{"id": "b4hPz", "label": "A", "text": "slope $= k/2.303$", "isCorrect": true, "image": null}, {"id": "VdGCc", "label": "B", "text": "slope $= -k/2.303$", "isCorrect": false, "image": null}, {"id": "6eHKt", "label": "C", "text": "slope $= k$", "isCorrect": false, "image": null}, {"id": "eEBAj", "label": "D", "text": "slope $= -k$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first-order reaction, the integrated rate law is given by:<br><br>$k = \\dfrac{2.303}{t} \\log \\dfrac{[A]_0}{[A]_t}$<br><br>Rearranging the equation to the form of a straight line $y = mx + c$:<br><br>$\\log \\dfrac{[A]_0}{[A]_t} = \\dfrac{k}{2.303} t$<br><br>Comparing this with $y = mx + c$, where $y = \\log \\dfrac{[A]_0}{[A]_t}$ and $x = t$, we get:<br><br>Slope $(m) = \\dfrac{k}{2.303}$<br><br>Answer: slope $= k/2.303$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887215a9fc0fc8c143c6", "type": "singleCorrect", "question": {"text": "Which of the following is the correct relation for half life period of a zero order reaction?", "image": null}, "options": [{"id": "fgsKA", "label": "A", "text": "It is directly proportional to initial concentration of reactants", "isCorrect": true, "image": null}, {"id": "VzV52", "label": "B", "text": "It is inversely proportional concentrations of reactants", "isCorrect": false, "image": null}, {"id": "Dzwas", "label": "C", "text": "It is directly proportional to the concentration of product.", "isCorrect": false, "image": null}, {"id": "CsMhx", "label": "D", "text": "It is inversely proportional to the square of initial concentration of reactants", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a zero order reaction, the integrated rate equation is given by:<br><br>$[A] = [A]_0 - kt$<br><br>At half life, $t = t_{1/2}$ and the concentration of reactant becomes half of its initial value, so $[A] = \\dfrac{[A]_0}{2}$.<br><br>Substituting these values into the rate equation:<br><br>$\\dfrac{[A]_0}{2} = [A]_0 - k t_{1/2}$<br><br>$k t_{1/2} = \\dfrac{[A]_0}{2}$<br><br>$t_{1/2} = \\dfrac{[A]_0}{2k}$<br><br>Thus, $t_{1/2} \\propto [A]_0$.<br><br>The half life period of a zero order reaction is directly proportional to the initial concentration of the reactants.<br><br>Answer: It is directly proportional to initial concentration of reactants", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888215a9fc0fc8c1445e", "type": "singleCorrect", "question": {"text": "A first-order reaction takes $20$ minutes to reach $15\\%$ completion. Calculate the rate constant of the reaction.", "image": null}, "options": [{"id": "eO3WW", "label": "A", "text": "$0.0025\\,\\text{min}^{-1}$", "isCorrect": false, "image": null}, {"id": "zVFBO", "label": "B", "text": "$0.0081\\,\\text{min}^{-1}$", "isCorrect": true, "image": null}, {"id": "kGUAG", "label": "C", "text": "$0.0012\\,\\text{min}^{-1}$", "isCorrect": false, "image": null}, {"id": "bb7vY", "label": "D", "text": "$0.0064\\,\\text{min}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first-order reaction, the rate constant is given by:<br><br>$k = \\dfrac{2.303}{t} \\log \\left( \\dfrac{a}{a-x} \\right)$<br><br>Substituting the given values ($t = 20$ min, $x = 15\\%$):<br><br>$k = \\dfrac{2.303}{20} \\log \\left( \\dfrac{100}{100 - 15} \\right)$<br><br>$k = \\dfrac{2.303}{20} \\log \\left( \\dfrac{100}{85} \\right)$<br><br>$k = \\dfrac{2.303}{20} \\times 0.0706 \\approx 0.0081 \\, \\text{min}^{-1}$<br><br>Answer: $0.0081\\,\\text{min}^{-1}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888215a9fc0fc8c1445d", "type": "singleCorrect", "question": {"text": "The half life of a first order reaction is $600$ second. How long will it take for $20\\%$ of the reactant to react?", "image": null}, "options": [{"id": "diQFa", "label": "A", "text": "$193.2$ s", "isCorrect": true, "image": null}, {"id": "qKNFo", "label": "B", "text": "$150.5$ s", "isCorrect": false, "image": null}, {"id": "NmxbU", "label": "C", "text": "$300.0$ s", "isCorrect": false, "image": null}, {"id": "gyt5i", "label": "D", "text": "$170.4$ s", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by:<br><br>$k = \\dfrac{2.303 \\log 2}{t_{1/2}}$<br><br>Given $t_{1/2} = 600$ s, the time $t$ required for $20\\%$ of the reactant to react is:<br><br>$t = \\dfrac{2.303}{k} \\log \\left( \\dfrac{a}{a-x} \\right)$<br><br>Substituting $k$ and the amounts $a = 100$ and $a-x = 100 - 20 = 80$:<br><br>$t = \\dfrac{t_{1/2}}{\\log 2} \\log \\left( \\dfrac{100}{80} \\right)$<br><br>$t = \\dfrac{600}{0.3010} \\log (1.25)$<br><br>$t = \\dfrac{600}{0.3010} \\times 0.0969$<br><br>$t \\approx 193.2$ s<br><br>Answer: $193.2$ s", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889215a9fc0fc8c144f4", "type": "singleCorrect", "question": {"text": "Calculate the rate constant of first order reaction if the slope of graph of $\\log [A]_0/[A]_t$ versus time is $8.5 \\times 10^{-3}$ $\\text{s}^{-1}$.", "image": null}, "options": [{"id": "BzEfh", "label": "A", "text": "$2.728 \\times 10^{-2}$ $\\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "d0eSc", "label": "B", "text": "$2.258 \\times 10^{-2}$ $\\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "UfcSj", "label": "C", "text": "$1.132 \\times 10^{-2}$ $\\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "9ze9y", "label": "D", "text": "$1.958 \\times 10^{-2}$ $\\text{s}^{-1}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the integrated rate equation is:<br><br>$k = \\dfrac{2.303}{t} \\log \\dfrac{[A]_0}{[A]_t}$<br><br>Rearranging this equation, we get:<br><br>$\\log \\dfrac{[A]_0}{[A]_t} = \\dfrac{k}{2.303} t$<br><br>This equation is in the form of a straight line $y = mx$, where $y = \\log \\dfrac{[A]_0}{[A]_t}$ and $x = t$.<br><br>The slope of the graph of $\\log \\dfrac{[A]_0}{[A]_t}$ versus $t$ is given by:<br><br>$\\text{Slope} = \\dfrac{k}{2.303}$<br><br>Given that the slope is $8.5 \\times 10^{-3} \\text{ s}^{-1}$:<br><br>$\\dfrac{k}{2.303} = 8.5 \\times 10^{-3}$<br><br>$k = 8.5 \\times 10^{-3} \\times 2.303$<br><br>$k = 19.5755 \\times 10^{-3} \\text{ s}^{-1}$<br><br>$k \\approx 1.958 \\times 10^{-2} \\text{ s}^{-1}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886215a9fc0fc8c14331", "type": "singleCorrect", "question": {"text": "The rate constant for a first order reaction is $4.606 \\times 10^{-3}$ s$^{-1}$. Calculate the time required to reduce $2.0$ g of the reactant to $0.2$ g .", "image": null}, "options": [{"id": "5F7Ej", "label": "A", "text": "$200$ s", "isCorrect": false, "image": null}, {"id": "tQxVA", "label": "B", "text": "$500$ s", "isCorrect": true, "image": null}, {"id": "mAzro", "label": "C", "text": "$1000$ s", "isCorrect": false, "image": null}, {"id": "ZV2Zn", "label": "D", "text": "$100$ s", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the time required is given by<br><br>$t = \\dfrac{2.303}{k} \\log \\dfrac{[A]_0}{[A]}$<br><br>Given:<br>$k = 4.606 \\times 10^{-3} \\text{ s}^{-1}$<br>$[A]_0 = 2.0 \\text{ g}$<br>$[A] = 0.2 \\text{ g}$<br><br>Substituting the values:<br><br>$t = \\dfrac{2.303}{4.606 \\times 10^{-3}} \\log \\dfrac{2.0}{0.2}$<br><br>$t = \\dfrac{1}{2 \\times 10^{-3}} \\log 10$<br><br>$t = \\dfrac{1000}{2} \\times 1 = 500 \\text{ s}$<br><br>Answer: $500$ s", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c215a9fc0fc8c146b6", "type": "singleCorrect", "question": {"text": "Rate constant for first order reaction is $40\\,s^{-1}$. Calculate the time required to reduce the concentration to $1/20$ th of its initial value.", "image": null}, "options": [{"id": "kUS2P", "label": "A", "text": "$3.50 \\times 10^{-2}$ s", "isCorrect": false, "image": null}, {"id": "LsfU1", "label": "B", "text": "$5.12 \\times 10^{-2}$ s", "isCorrect": false, "image": null}, {"id": "eGipq", "label": "C", "text": "$4.50 \\times 10^{-2}$ s", "isCorrect": false, "image": null}, {"id": "cECBF", "label": "D", "text": "$7.48 \\times 10^{-2}$ s", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the time required is given by the integrated rate equation:<br><br>$t = \\dfrac{2.303}{k} \\log \\left( \\dfrac{[A]_0}{[A]} \\right)$<br><br>Given $k = 40 \\, \\text{s}^{-1}$ and $[A] = \\dfrac{[A]_0}{20}$<br><br>$t = \\dfrac{2.303}{40} \\log(20)$<br><br>Using $\\log 20 = \\log 2 + \\log 10 \\approx 0.3 + 1 = 1.3$<br><br>$t = \\dfrac{2.303 \\times 1.3}{40}$<br><br>$t = \\dfrac{2.9939}{40} = 0.07484 \\, \\text{s}$<br><br>$t = 7.48 \\times 10^{-2} \\, \\text{s}$<br><br>Answer: $7.48 \\times 10^{-2}$ s", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883215a9fc0fc8c1416f", "type": "singleCorrect", "question": {"text": "What is the half life of a first order reaction if the value of the rate constant is $3.0\\times 10^{-2}\\,\\text{s}^{-1}$?", "image": null}, "options": [{"id": "iiJ2g", "label": "A", "text": "$0.231$ s", "isCorrect": false, "image": null}, {"id": "PzRMn", "label": "B", "text": "$2.31$ s", "isCorrect": false, "image": null}, {"id": "ey4QR", "label": "C", "text": "$23.1$ s", "isCorrect": true, "image": null}, {"id": "Y1XQV", "label": "D", "text": "$231$ s", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the half life $t_{1/2}$ is given by the formula:<br><br>$t_{1/2} = \\dfrac{0.693}{k}$<br><br>Substituting the given value of the rate constant $k = 3.0 \\times 10^{-2} \\, \\text{s}^{-1}$:<br><br>$t_{1/2} = \\dfrac{0.693}{3.0 \\times 10^{-2}}$<br><br>$t_{1/2} = \\dfrac{69.3}{3.0}$<br><br>$t_{1/2} = 23.1 \\, \\text{s}$<br><br>Answer: $23.1$ s", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3558c30a4553e1be29b", "type": "singleCorrect", "question": {"text": "Identify correct statement regarding order of reaction from following.", "image": null}, "options": [{"id": "4hFCq", "label": "A", "text": "Rate of zero order reaction depends on initial concentration of reactant.", "isCorrect": false, "image": null}, {"id": "sGT4n", "label": "B", "text": "Decomposition of acetaldehyde is a first order reaction.", "isCorrect": false, "image": null}, {"id": "O8lo4", "label": "C", "text": "Half life of first order reaction is independent of initial concentration of reactant.", "isCorrect": true, "image": null}, {"id": "AuFBh", "label": "D", "text": "Half life of zero order reaction is independent of initial concentration of reactant", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a zero order reaction, the rate is given by $r = k[A]^0 = k$. Thus, the rate is independent of the concentration of the reactant.<br><br>The decomposition of acetaldehyde ($CH_3CHO \\rightarrow CH_4 + CO$) is a fractional order reaction with an order of $1.5$.<br><br>For a first order reaction, the half-life is given by $t_{1/2} = \\dfrac{0.693}{k}$. This shows that the half-life is independent of the initial concentration of the reactant.<br><br>For a zero order reaction, the half-life is given by $t_{1/2} = \\dfrac{[A]_0}{2k}$. This shows that the half-life is directly proportional to the initial concentration of the reactant.<br><br>Therefore, the only correct statement is that the half-life of a first order reaction is independent of the initial concentration of the reactant.<br><br>Answer: Half life of first order reaction is independent of initial concentration of reactant.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3548c30a4553e1be290", "type": "singleCorrect", "question": {"text": "Calculate rate constant of a first order reaction having half life $1$ minute $40$ second?", "image": null}, "options": [{"id": "8QN2d", "label": "A", "text": "$1.76 \\times 10^{-3}\\ \\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "mAJx2", "label": "B", "text": "$2.31 \\times 10^{-3}\\ \\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "umTV2", "label": "C", "text": "$6.93 \\times 10^{-3}\\ \\text{s}^{-1}$", "isCorrect": true, "image": null}, {"id": "6ZtF8", "label": "D", "text": "$4.61 \\times 10^{-3}\\ \\text{s}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given half-life of the first order reaction, $t_{1/2} = 1 \\text{ minute } 40 \\text{ seconds}$<br><br>Converting to seconds, $t_{1/2} = 60 + 40 = 100 \\text{ s}$<br><br>For a first order reaction, the rate constant $k$ is given by the relation:<br><br>$k = \\dfrac{0.693}{t_{1/2}}$<br><br>Substituting the value of $t_{1/2}$:<br><br>$k = \\dfrac{0.693}{100 \\text{ s}}$<br><br>$k = 6.93 \\times 10^{-3} \\text{ s}^{-1}$<br><br>Answer: $6.93 \\times 10^{-3}\\ \\text{s}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30e8c30a4553e1bdfac", "type": "singleCorrect", "question": {"text": "Half life of a first order reaction is $900$ second. If initial concentration of reactant is $0.08\\,\\text{mol dm}^{-3}$ find concentration that remains after $35$ minute ?", "image": null}, "options": [{"id": "LZp6B", "label": "A", "text": "$0.159\\,\\text{mol dm}^{-3}$", "isCorrect": false, "image": null}, {"id": "a2v7H", "label": "B", "text": "$0.0159\\,\\text{mol dm}^{-3}$", "isCorrect": true, "image": null}, {"id": "tiNhS", "label": "C", "text": "$1.05\\,\\text{mol dm}^{-3}$", "isCorrect": false, "image": null}, {"id": "UwDzs", "label": "D", "text": "$0.759\\,\\text{mol dm}^{-3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $t_{1/2} = 900$ s and $t = 35$ min $= 35 \\times 60 = 2100$ s.<br><br>Number of half-lives $n = \\dfrac{t}{t_{1/2}} = \\dfrac{2100}{900} = \\dfrac{7}{3}$.<br><br>For a first order reaction, the concentration remaining after $n$ half-lives is given by:<br><br>$[A] = \\dfrac{[A]_0}{2^n}$<br><br>Substituting the given values:<br><br>$[A] = \\dfrac{0.08}{2^{7/3}}$<br><br>$[A] = \\dfrac{0.08}{4 \\times 2^{1/3}}$<br><br>Since $2^{1/3} \\approx 1.26$:<br><br>$[A] \\approx \\dfrac{0.08}{4 \\times 1.26} = \\dfrac{0.08}{5.04} \\approx 0.0159 \\text{ mol dm}^{-3}$<br><br>Answer: $0.0159\\,\\text{mol dm}^{-3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30a8c30a4553e1bdf86", "type": "singleCorrect", "question": {"text": "For a first order reaction, half life is $5$ hour. What time is required to reduce $10$ g of reactant to $2.5$ g ?", "image": null}, "options": [{"id": "9tRCo", "label": "A", "text": "$3$ hour", "isCorrect": false, "image": null}, {"id": "VO0UR", "label": "B", "text": "$4$ hour", "isCorrect": false, "image": null}, {"id": "tNcrF", "label": "C", "text": "$5$ hour", "isCorrect": false, "image": null}, {"id": "YtIYp", "label": "D", "text": "$10$ hour", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the amount of reactant remaining after $n$ half-lives is given by $N_t = \\dfrac{N_0}{2^n}$<br><br>Given initial amount $N_0 = 10$ g and final amount $N_t = 2.5$ g<br><br>Substituting the values, $2.5 = \\dfrac{10}{2^n}$<br><br>$2^n = \\dfrac{10}{2.5} = 4$<br><br>$2^n = 2^2 \\Rightarrow n = 2$<br><br>Total time required $t = n \\times t_{1/2}$<br><br>Given $t_{1/2} = 5$ hour<br><br>$t = 2 \\times 5 = 10$ hour<br><br>Answer: $10$ hour", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fe8c30a4553e1bdf00", "type": "singleCorrect", "question": {"text": "A first order reaction take $30$ minutes for $75\\%$ decomposition, calculate its rate constant ?", "image": null}, "options": [{"id": "73yoP", "label": "A", "text": "$0.0238\\ \\text{minute}^{-1}$", "isCorrect": false, "image": null}, {"id": "sxk4z", "label": "B", "text": "$0.0463\\ \\text{minute}^{-1}$", "isCorrect": true, "image": null}, {"id": "jBbm6", "label": "C", "text": "$0.0715\\ \\text{minute}^{-1}$", "isCorrect": false, "image": null}, {"id": "rJAok", "label": "D", "text": "$0.0957\\ \\text{minute}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the integrated rate law is given by:<br><br>$k = \\dfrac{2.303}{t} \\log \\left( \\dfrac{a}{a-x} \\right)$<br><br>Given that the reaction is $75\\%$ complete in $30$ minutes:<br><br>$t = 30\\ \\text{minutes}$<br><br>$x = 0.75a$<br><b
