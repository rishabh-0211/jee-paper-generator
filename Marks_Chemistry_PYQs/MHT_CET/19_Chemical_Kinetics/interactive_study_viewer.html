tName": "2008", "title": "MHT CET 2008"}], "question": {"text": "For a first order reaction, the half-life period is", "image": null}, "options": [{"id": "9jUiq", "text": "dependent on the square of the initial concentration", "image": null, "isCorrect": false}, {"id": "fW6OO", "text": "dependent on first power of initial concentration", "image": null, "isCorrect": false}, {"id": "MuENb", "text": "dependent on the square root of initial concentration", "image": null, "isCorrect": false}, {"id": "t8duA", "text": "independent on initial concentration", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$t_{1 / 2}=\\frac{1}{(a)^{n-1}}$\nwhere, $n=$ order of reaction $a=$ initial concentration For first order reaction,\n$$\n\\begin{aligned}\nn &=1 \\\\\nt_{1 / 2} &=\\frac{1}{a^{1}-1} \\\\\na &=\\frac{1}{a^{0}}=0\n\\end{aligned}\n$$\nThus, for a first order reaction, $t_{1 / 2}$ is independent on initial concentration.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e530279619d9d8a1386", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "In successive emission of $\\alpha$ -and $\\beta$ -particles, the number of $\\alpha$ -and $\\beta$ -particles should be emitted for the conversion of ${ }_{92} \\mathrm{U}^{238}$ to ${ }_{82} \\mathrm{~Pb}^{206}$ are", "image": null}, "options": [{"id": "YQVfj", "text": "$7 \\alpha, 5 \\beta$", "image": null, "isCorrect": false}, {"id": "tUa0u", "text": "$6 \\alpha, 4 \\beta$", "image": null, "isCorrect": false}, {"id": "udtfn", "text": "$4 \\alpha, 3 \\beta$", "image": null, "isCorrect": false}, {"id": "lvDln", "text": "$8 \\alpha, 6 \\beta$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "${ }_{92} \\mathrm{U}^{238} \\longrightarrow{ }_{82} \\mathrm{~Pb}^{206}+m_{2} \\mathrm{He}^{4}+n_{-1} e^{0}$\nOn comparing both sides\n$$\n\\begin{aligned}\n238 &=206+4 m \\\\\n\\Rightarrow \\quad m &=8 \\\\\n92 &=82+2 m-n \\\\\n2 m-n &=10 \\\\\n\\Rightarrow \\quad n &=6\n\\end{aligned}\n$$\n$\\therefore \\alpha$ -particles emitted, $m=8$ $\\beta$ -particles emitted, $n=6$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e420279619d9d8a12ff", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "$\\longrightarrow{ }_{82} \\mathrm{~Pb}^{208}$. The number of $\\alpha$\nand $\\beta$ -particles emitted during the above reaction is", "image": null}, "options": [{"id": "XGlmp", "text": "$8 \\alpha$ and $4 \\beta$", "image": null, "isCorrect": false}, {"id": "gRa93", "text": "$8 \\alpha$ and $16 \\beta$", "image": null, "isCorrect": false}, {"id": "a6COH", "text": "$4 \\alpha$ and $2 \\beta$", "image": null, "isCorrect": false}, {"id": "Yo7dp", "text": "$6 \\alpha$ and $4 \\beta$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "No. of $\\alpha$ particles $=\\frac{232-208}{4}=\\frac{24}{4}=6 \\alpha$\nNo. of $\\beta$ particles $=2 \\times 6-(90-82)$\n$$\n\\begin{array}{l}\n=12-8 \\\\\n=4 \\beta\n\\end{array}\n$$\nHence, $6 \\alpha$ and $4 \\beta$ particles are emitted.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a2632f0279619d9d8a3cc2", "title": "Methods to determine order of reaction", "totalQuestions": 7, "questions": [{"_id": "6792138b0aee93fa0796d99d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "The experimentally determined rate law for the following reaction is Rate = k[H₂O₂]. What is the order of the reaction $2H_2O_{2(g)} \\longrightarrow 2H_2O_{(l)} + O_{2(g)}$?", "image": null}, "options": [{"id": "9B7X7", "text": "0", "image": null, "isCorrect": false}, {"id": "xO5iW", "text": "3", "image": null, "isCorrect": false}, {"id": "oDlMj", "text": "2", "image": null, "isCorrect": false}, {"id": "5FEo2", "text": "1", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The order of a reaction is defined as the sum of the powers of the concentration terms in the experimentally determined rate law.<br><br>Given the rate law:<br>$\\text{Rate} = k[H_2O_2]$<br><br>The power of the concentration term $[H_2O_2]$ is $1$.<br><br>Therefore, the order of the reaction is $1$.<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620e0279619d9d8a3170", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "For a reaction $\\mathrm{A}+\\mathrm{B} \\rightarrow$ product, if $[\\mathrm{A}]$ is doubled keeping [B] constant, the rate of reaction doubles. Calculate the order of reaction with respect to $A$.", "image": null}, "options": [{"id": "mnY1J", "text": "$0$", "image": null, "isCorrect": false}, {"id": "GqGPZ", "text": "$1 / 2$", "image": null, "isCorrect": false}, {"id": "c5uNp", "text": "$1$", "image": null, "isCorrect": true}, {"id": "u4h7r", "text": "$2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\mathrm{A}+\\mathrm{B} \\longrightarrow \\text { Product } \\\\ & \\text { Rate }^{\\mathrm{k}[\\mathrm{A}]^x[\\mathrm{~B}]^{\\mathrm{y}}} \\\\ & \\text { Rate }_1=\\mathrm{k}[2 \\mathrm{~A}]^x[\\mathrm{~B}]^{\\mathrm{y}} \\\\ \\therefore \\quad & \\frac{\\text { Rate }_1}{\\text { Rate }}=\\frac{\\mathrm{k} 2^x[\\mathrm{~A}]^x[\\mathrm{~B}]^y}{\\mathrm{k}[\\mathrm{A}]^x[\\mathrm{~B}]^{\\mathrm{y}}}\\end{array}$\n$\\begin{array}{ll}\n\\therefore & \\frac{2 \\times \\text { Rate }}{\\text { Rate }}=2^x \\\\\n\\therefore & 2^x=2 \\\\\n\\therefore & x=1\n\\end{array}$\n$\\therefore \\quad$ Order of reaction with respect to $A=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fd0279619d9d8a30ee", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Slope of the graph between $\\log \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}}$ (y axis) and time ( $x$ axis) for first order reaction is equal to:", "image": null}, "options": [{"id": "W6DOq", "text": "$\\pm \\frac{k}{2.303}$", "image": null, "isCorrect": true}, {"id": "TtsSx", "text": "$\\mathrm{k}$", "image": null, "isCorrect": false}, {"id": "etDkT", "text": "$-\\mathrm{k}$", "image": null, "isCorrect": false}, {"id": "EzvuZ", "text": "$-\\frac{2.303}{k}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The integrated rate law for the first order reaction is\n$$\n\\begin{gathered}\nk=\\frac{2.303}{t} \\log _{10} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}} \\\\\n\\log _{10} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}}=\\frac{\\mathrm{k}}{2.303} \\mathrm{t} \\\\\n\\downarrow \\\\\n\\mathrm{y} \\quad \\mathrm{m} x\n\\end{gathered}\n$$\n\nThe graph of $\\log _{10} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}}$ versus time $(\\mathrm{t})$ is a straight line passing through origin with slope $(\\mathrm{m})=+\\frac{\\mathrm{k}}{2.303}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b00279619d9d8a2e90", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Calculate the amount of reactant in percent that remains after 60 minutes involved in first order reaction. $\\left(\\mathrm{k}=0.02303\\right.$ minute $\\left.^{-1}\\right)$", "image": null}, "options": [{"id": "CSKbe", "text": "$25 \\%$", "image": null, "isCorrect": true}, {"id": "gaFys", "text": "$50 \\%$", "image": null, "isCorrect": false}, {"id": "9LPlF", "text": "$75 \\%$", "image": null, "isCorrect": false}, {"id": "rDNQ3", "text": "$12.5 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction,\n$\\begin{aligned}\n& k=\\frac{0.693}{t_{1 / 2}} \\\\\n& t_{1 / 2}=\\frac{0.693}{0.02303}=30 \\mathrm{~min}\n\\end{aligned}$\nPercent of reactant that remains after $t_{1 / 2}=50 \\%$. $2 \\times \\mathrm{t}_{1 / 2}=60 \\mathrm{~min}$\nTherefore, percent of reactant that remains after $2 \\mathrm{t}_{1 / 2}=25 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ae0279619d9d8a2e7f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Which from following is the slope of the graph of rate versus concentration of the reactant for first order reaction?", "image": null}, "options": [{"id": "UKAUZ", "text": "$-k$", "image": null, "isCorrect": false}, {"id": "pXuHY", "text": "$k$", "image": null, "isCorrect": true}, {"id": "6f4IR", "text": "$\\frac {k}{2.303}$", "image": null, "isCorrect": false}, {"id": "fQ1j1", "text": "$\\frac {-k}{2.303}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.12|Ch-6|Subtopic-6.5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2609a0279619d9d8a25d3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "A reaction is first order with respective to A and second order with respective to $B$. What is the effect on reaction rate if concentration of B is increased 3 times?", "image": null}, "options": [{"id": "a90qi", "text": "Rate increases 6 times", "image": null, "isCorrect": false}, {"id": "gFcdj", "text": "Rate increase 9 times", "image": null, "isCorrect": true}, {"id": "m6ODl", "text": "Rate increase 2 times", "image": null, "isCorrect": false}, {"id": "m8e7e", "text": "Rate increase 3 times", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rate law of reaction,\n$$\n\\mathrm{r}=\\mathrm{k}[\\mathrm{A}]^{\\prime}[\\mathrm{B}]^2\n$$\nIf concentration of $\\mathrm{B}$ is increased 3 times,\n$$\n\\begin{aligned}\n& \\mathrm{B} \\rightarrow 3 \\mathrm{~B} \\\\\n& \\mathrm{r}_{\\mathrm{New}}=\\mathrm{k}[\\mathrm{A}][3 \\mathrm{~B}]^2 \\\\\n& \\frac{\\mathrm{r}_{\\mathrm{New}}}{\\mathrm{r}}=\\frac{\\mathrm{k}[\\mathrm{A}][3 \\mathrm{~B}]^2}{\\mathrm{k}[\\mathrm{A}][\\mathrm{B}]^2} \\\\\n& \\frac{\\mathrm{r}_{\\mathrm{New}}}{\\mathrm{r}}=3^2 \\\\\n& \\mathrm{r}_{\\mathrm{New}}=9 \\mathrm{r}\n\\end{aligned}\n$$\nRate increase 9 times.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eec0279619d9d8a185c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "Which among the following reaction is an example of a zero order reaction?", "image": null}, "options": [{"id": "xPOT3", "text": "<math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>12</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>22</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>11</mn><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo></mrow></mfenced></mrow></msub><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">l</mi></mrow></mfenced></mrow></msub><mo>→</mo><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>6</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>12</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>6</mn><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo></mrow></mfenced></mrow></msub><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>6</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>12</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>6</mn><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo></mrow></mfenced></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "CpDdc", "text": "<math><mn>2</mn><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced></mrow></msub><mover accent=\"false\"><mo>→</mo><mrow><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\"></mi></mrow></mover><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mn>2</mn><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced></mrow></msub><mo>+</mo><mn>3</mn><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "2l3vl", "text": "<math><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">l</mi></mrow></mfenced></mrow></msub><mo>→</mo><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">l</mi></mrow></mfenced></mrow></msub><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "FqwiT", "text": "<math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced></mrow></msub><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced></mrow></msub><mo>→</mo><mn>2</mn><mi mathvariant=\"normal\">H</mi><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Decomposition of ammonia in the presence of <math><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">t</mi></math> catalyst is an example of a zero-order reaction.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a2632f0279619d9d8a3cc3", "title": "Parallel and Sequencial rate laws", "totalQuestions": 2, "questions": [{"_id": "68871b4bbf9280d7f99327f3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If a reaction occurs in following two steps\ni) $2 \\mathrm{ClO}^{-} \\rightarrow \\mathrm{ClO}_2^{-}$\nii) $\\mathrm{ClO}_2^{-}+\\mathrm{ClO}^{-} \\rightarrow \\mathrm{ClO}_3^{-}+\\mathrm{Cl}^{-}$\nFind the reaction intermediate.", "image": null}, "options": [{"id": "oyGyH", "text": "$\\mathrm{ClO}^{-}$", "image": null, "isCorrect": false}, {"id": "DxvPL", "text": "$\\mathrm{ClO}_3^{-}$", "image": null, "isCorrect": false}, {"id": "ENKvp", "text": "$\\mathrm{Cl}^{-}$", "image": null, "isCorrect": false}, {"id": "uLFaU", "text": "$\\mathrm{ClO}_2^{-}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "A reaction intermediate is a chemical species that is formed in one elementary step and consumed in a subsequent step of a reaction mechanism.<br><br>In the given mechanism:<br>Step i) $2 \\mathrm{ClO}^{-} \\rightarrow \\mathrm{ClO}_2^{-}$ (Formation of $\\mathrm{ClO}_2^{-}$)<br>Step ii) $\\mathrm{ClO}_2^{-} + \\mathrm{ClO}^{-} \\rightarrow \\mathrm{ClO}_3^{-} + \\mathrm{Cl}^{-}$ (Consumption of $\\mathrm{ClO}_2^{-}$)<br><br>Since $\\mathrm{ClO}_2^{-}$ is produced in the first step and consumed in the second step, it does not appear in the overall balanced chemical equation ($3 \\mathrm{ClO}^{-} \\rightarrow \\mathrm{ClO}_3^{-} + \\mathrm{Cl}^{-}$).<br><br>Therefore, $\\mathrm{ClO}_2^{-}$ is the reaction intermediate.<br><br>Answer: $\\mathrm{ClO}_2^{-}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2612f0279619d9d8a2a82", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "A complex reaction takes place in 2 steps\n(i) $\\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{F}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{NO}_2 \\mathrm{~F}_{(\\mathrm{g})}+\\mathrm{F}_{(\\mathrm{g})}+$ (slow)\n(ii) $\\mathrm{F}_{(\\mathrm{g})}+\\mathrm{NO}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{NO}_2 \\mathrm{~F}_{(\\mathrm{g})}($ fast $)$\nIdentify the reaction intermediate?", "image": null}, "options": [{"id": "sxvZZ", "text": "$\\mathrm{F}_{(\\mathrm{g})}$", "image": null, "isCorrect": true}, {"id": "yCNNl", "text": "$\\mathrm{NO}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "8d4ky", "text": "$\\mathrm{F}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "kEkyu", "text": "$\\mathrm{NO}_2 \\mathrm{~F}_{(\\mathrm{g})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Reaction intermediates are those substance which are formed in one step and get consumed in the successive step\n$\\therefore$ In the given mechanism it is $\\mathrm{F}(\\mathrm{g})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "6a44d3938c30a4553e1be403", "title": "Radioactivity", "totalQuestions": 3, "questions": [{"_id": "6abb88af15a9fc0fc8c14609", "type": "singleCorrect", "question": {"text": "Identify radioactive element from the following.", "image": null}, "options": [{"id": "GpY4z", "label": "A", "text": "$\\text{Fr}$", "isCorrect": true, "image": null}, {"id": "cBYPs", "label": "B", "text": "$\\text{K}$", "isCorrect": false, "image": null}, {"id": "1vqwr", "label": "C", "text": "$\\text{Rb}$", "isCorrect": false, "image": null}, {"id": "51s11", "label": "D", "text": "$\\text{Li}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Francium ($\\text{Fr}$) is the heaviest alkali metal belonging to group 1 of the periodic table. It is a highly radioactive element. Its most stable isotope, $^{223}\\text{Fr}$, has a half-life of only 22 minutes.<br><br>Lithium ($\\text{Li}$), Potassium ($\\text{K}$), and Rubidium ($\\text{Rb}$) are not considered primarily radioactive elements, although some of them have naturally occurring radioactive isotopes in trace amounts.<br><br>Answer: $\\text{Fr}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c115a9fc0fc8c146af", "type": "singleCorrect", "question": {"text": "Calculate the time required to reduce the radioactive substance to $20\\%$ if the half life period is $10$ minutes.", "image": null}, "options": [{"id": "grEHG", "label": "A", "text": "$23.23$ minute", "isCorrect": true, "image": null}, {"id": "0Hrxm", "label": "B", "text": "$14.41$ minute", "isCorrect": false, "image": null}, {"id": "iqH9k", "label": "C", "text": "$18.52$ minute", "isCorrect": false, "image": null}, {"id": "qkITj", "label": "D", "text": "$34.4$ minute", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The radioactive decay follows first-order kinetics.<br><br>The decay constant $\\lambda$ is given by:<br><br>$\\lambda = \\dfrac{0.693}{t_{1/2}} = \\dfrac{0.693}{10} = 0.0693 \\text{ min}^{-1}$<br><br>The time required for the substance to reduce to $20\\%$ is calculated using the first-order rate equation:<br><br>$t = \\dfrac{2.303}{\\lambda} \\log \\left( \\dfrac{N_0}{N_t} \\right)$<br><br>Substituting $N_0 = 100$ and $N_t = 20$:<br><br>$t = \\dfrac{2.303}{0.0693} \\log \\left( \\dfrac{100}{20} \\right)$<br><br>$t = \\dfrac{2.303}{0.0693} \\log 5$<br><br>Using $\\log 5 = 0.699$:<br><br>$t = \\dfrac{2.303 \\times 0.699}{0.0693} = 23.23 \\text{ min}$<br><br>Answer: $23.23$ minute", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3368c30a4553e1be15c", "type": "singleCorrect", "question": {"text": "What is order of radioactive decay of a substance ?", "image": null}, "options": [{"id": "7ju0y", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "GnS1F", "label": "B", "text": "$1$", "isCorrect": true, "image": null}, {"id": "BsT5q", "label": "C", "text": "$1.5$", "isCorrect": false, "image": null}, {"id": "YiHpA", "label": "D", "text": "$2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Radioactive decay follows first-order kinetics.<br><br>The rate of decay is directly proportional to the number of undecayed nuclei present at that instant.<br><br>$-\\dfrac{dN}{dt} = \\lambda N$<br><br>Since the rate depends on the first power of the number of nuclei, the order of radioactive decay is $1$.<br><br>Answer: $1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "65a2632e0279619d9d8a3cc1", "title": "Arrhenius theory", "totalQuestions": 20, "questions": [{"_id": "6abb88d215a9fc0fc8c1474b", "type": "singleCorrect", "question": {"text": "What is the role of $\\text{MnO}_2$ during the thermal decomposition of $\\text{KClO}_3$?", "image": null}, "options": [{"id": "CjvwB", "label": "A", "text": "It increases the reaction's enthalpy.", "isCorrect": false, "image": null}, {"id": "khjpJ", "label": "B", "text": "It increases the energy of activation of the reaction.", "isCorrect": false, "image": null}, {"id": "2xgkW", "label": "C", "text": "It decreases the energy of activation of the reaction.", "isCorrect": true, "image": null}, {"id": "AL73V", "label": "D", "text": "It reduces the rate of collisions between reactant molecules.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "During the thermal decomposition of $\\text{KClO}_3$, $\\text{MnO}_2$ acts as a positive catalyst.<br><br>A positive catalyst increases the rate of a chemical reaction by providing an alternative reaction pathway that has a lower activation energy.<br><br>Therefore, $\\text{MnO}_2$ decreases the energy of activation of the reaction.<br><br>Answer: It decreases the energy of activation of the reaction.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a215a9fc0fc8c14589", "type": "singleCorrect", "question": {"text": "The rate constants for the first order reaction are $x$ s$^{-1}$ at $300$ K and $y$ s$^{-1}$ at $320$ K. Calculate the activation energy of the reaction.<br>$[R = 8.314$ J K$^{-1}$ mol$^{-1}$ and $y/x = 4]$", "image": null}, "options": [{"id": "cjoAs", "label": "A", "text": "$55.34$ kJ.", "isCorrect": true, "image": null}, {"id": "59B1O", "label": "B", "text": "$27.67$ kJ.", "isCorrect": false, "image": null}, {"id": "xy5R5", "label": "C", "text": "$83.1$ kJ.", "isCorrect": false, "image": null}, {"id": "ZxU7u", "label": "D", "text": "$110.68$ kJ.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the Arrhenius equation:<br><br>$\\log \\left( \\dfrac{k_2}{k_1} \\right) = \\dfrac{E_a}{2.303 R} \\left( \\dfrac{T_2 - T_1}{T_1 T_2} \\right)$<br><br>Given $k_1 = x$ at $T_1 = 300$ K and $k_2 = y$ at $T_2 = 320$ K, with $\\dfrac{y}{x} = 4$.<br><br>$\\log(4) = \\dfrac{E_a}{2.303 \\times 8.314} \\left( \\dfrac{320 - 300}{300 \\times 320} \\right)$<br><br>$0.602 = \\dfrac{E_a}{19.147} \\left( \\dfrac{20}{96000} \\right)$<br><br>$0.602 = \\dfrac{E_a}{19.147} \\left( \\dfrac{1}{4800} \\right)$<br><br>$E_a = 0.602 \\times 19.147 \\times 4800$<br><br>$E_a = 55327$ J mol$^{-1} \\approx 55.34$ kJ mol$^{-1}$<br><br>Answer: $55.34$ kJ.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884215a9fc0fc8c14205", "type": "singleCorrect", "question": {"text": "Calculate the activation energy when the rate of chemical reaction doubles with an increase of $10 \\text{ K}$ in absolute temperature from $298 \\text{ K}$. ($R \\times 2.303 = 19.15 \\text{ J K}^{-1}\\text{ mol}^{-1}$).", "image": null}, "options": [{"id": "2ETLI", "label": "A", "text": "$35.85 \\text{ KJ mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "KlbPJ", "label": "B", "text": "$52.89 \\text{ KJ mol}^{-1}$", "isCorrect": true, "image": null}, {"id": "PAS4s", "label": "C", "text": "$42.36 \\text{ KJ mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "DzKST", "label": "D", "text": "$26.14 \\text{ KJ mol}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the Arrhenius equation:<br><br>$\\log \\left( \\dfrac{k_2}{k_1} \\right) = \\dfrac{E_a}{2.303 R} \\left( \\dfrac{T_2 - T_1}{T_1 T_2} \\right)$<br><br>Given $T_1 = 298 \\text{ K}$, $T_2 = 308 \\text{ K}$, $\\dfrac{k_2}{k_1} = 2$, and $2.303 R = 19.15 \\text{ J K}^{-1} \\text{ mol}^{-1}$.<br><br>Substituting the values:<br><br>$\\log(2) = \\dfrac{E_a}{19.15} \\left( \\dfrac{308 - 298}{298 \\times 308} \\right)$<br><br>$0.301 = \\dfrac{E_a}{19.15} \\left( \\dfrac{10}{91784} \\right)$<br><br>$E_a = \\dfrac{0.301 \\times 19.15 \\times 91784}{10}$<br><br>$E_a \\approx 52897 \\text{ J mol}^{-1} = 52.89 \\text{ kJ mol}^{-1}$<br><br>Answer: $52.89 \\text{ KJ mol}^{-1}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b115a9fc0fc8c1461e", "type": "singleCorrect", "question": {"text": "Identify the correct representation of Arrhenius equation from following.", "image": null}, "options": [{"id": "yToDA", "label": "A", "text": "$k = A \\cdot e^{E_a/T}$", "isCorrect": false, "image": null}, {"id": "HgOJc", "label": "B", "text": "$k = A \\cdot e^{E_a/RT}$", "isCorrect": false, "image": null}, {"id": "S2TK1", "label": "C", "text": "$k = A \\cdot e^{-E_a/R}$", "isCorrect": false, "image": null}, {"id": "3m0ML", "label": "D", "text": "$k = A \\cdot e^{-E_a/RT}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The Arrhenius equation describes the effect of temperature on the rate constant of a chemical reaction.<br><br>The equation is given by $k = A \\cdot e^{-E_a/RT}$<br><br>where $k$ is the rate constant, $A$ is the pre-exponential factor, $E_a$ is the activation energy, $R$ is the universal gas constant, and $T$ is the absolute temperature.<br><br>Answer: $k = A \\cdot e^{-E_a/RT}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886215a9fc0fc8c1432e", "type": "singleCorrect", "question": {"text": "Which of the following is the correct Arrhenius equation expressing the effect of temperature on the rate constant of a reaction?", "image": null}, "options": [{"id": "c6QVS", "label": "A", "text": "$k = E_a / (RT)$", "isCorrect": false, "image": null}, {"id": "CC7R2", "label": "B", "text": "$k = Ae^{(-E_a/RT)}$", "isCorrect": true, "image": null}, {"id": "PM6SE", "label": "C", "text": "$k = Ae^{(E_a/RT)}$", "isCorrect": false, "image": null}, {"id": "l7RSZ", "label": "D", "text": "$k = e^{(-E_a/RT)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The Arrhenius equation describes the temperature dependence of reaction rates. It is given by the expression:<br><br>$k = Ae^{-E_a/RT}$<br><br>where $k$ is the rate constant, $A$ is the pre-exponential factor (or frequency factor), $E_a$ is the activation energy, $R$ is the universal gas constant, and $T$ is the absolute temperature.<br><br>Answer: $k = Ae^{(-E_a/RT)}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2aa8c30a4553e1bdb82", "type": "singleCorrect", "question": {"text": "What is the role of catalyst in reaction?", "image": null}, "options": [{"id": "lfMEj", "label": "A", "text": "To increase activation energy of a reaction", "isCorrect": false, "image": null}, {"id": "RdWt4", "label": "B", "text": "To decrease the equilibrium constant of the reaction", "isCorrect": false, "image": null}, {"id": "txW4I", "label": "C", "text": "To supply energy to the reactants", "isCorrect": false, "image": null}, {"id": "nOZyG", "label": "D", "text": "To decrease activation energy of a reaction", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "A catalyst increases the rate of a chemical reaction by providing an alternative reaction pathway that has a lower activation energy.<br><br>It does not alter the equilibrium constant, nor does it supply energy to the reactants.<br><br>Therefore, the primary role of a catalyst is to decrease the activation energy of a reaction.<br><br>Answer: To decrease activation energy of a reaction", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c88c30a4553e1bdcba", "type": "singleCorrect", "question": {"text": "What is the term used for the minimum kinetic energy required for the reactant molecules to undergo reaction?", "image": null}, "options": [{"id": "RlEmf", "label": "A", "text": "Potential energy", "isCorrect": false, "image": null}, {"id": "ZzXNs", "label": "B", "text": "Bond energy", "isCorrect": false, "image": null}, {"id": "fEuAc", "label": "C", "text": "Thermal energy", "isCorrect": false, "image": null}, {"id": "eR0Ok", "label": "D", "text": "Activation energy", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The minimum kinetic energy that reactant molecules must possess in order to undergo a chemical reaction is called activation energy.<br><br>It acts as an energy barrier that must be overcome for the reactants to be converted into products.<br><br>Answer: Activation energy", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d48c30a4553e1bdd42", "type": "singleCorrect", "question": {"text": "The equation for the rate constant is $k = Ae^{-E_a/RT}$.<br>A chemical reaction will proceed more rapidly if there is a decrease in", "image": null}, "options": [{"id": "CfR4Q", "label": "A", "text": "$k$", "isCorrect": false, "image": null}, {"id": "epdim", "label": "B", "text": "$A$", "isCorrect": false, "image": null}, {"id": "6g9JF", "label": "C", "text": "$E_a$", "isCorrect": true, "image": null}, {"id": "57oPX", "label": "D", "text": "$T$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The rate of a chemical reaction is directly proportional to the rate constant $k$.<br><br>According to the Arrhenius equation, $k = Ae^{-E_a/RT}$.<br><br>For the reaction to proceed more rapidly, the rate constant $k$ must increase.<br><br>A decrease in the activation energy $E_a$ makes the exponent $-E_a/RT$ less negative, which increases the value of $e^{-E_a/RT}$.<br><br>Therefore, a decrease in $E_a$ leads to an increase in $k$, making the reaction proceed more rapidly.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3368c30a4553e1be15e", "type": "singleCorrect", "question": {"text": "The rate constant of reaction is $1.5 \\times 10^7\\ \\text{s}^{-1}$ at 300 K and $3.0 \\times 10^7\\ \\text{s}^{-1}$ at 330 K. What is the activation energy for the reaction? [ $R \\times 2.303 = 19.15\\ \\text{JK}^{-1}\\text{mol}^{-1}$]", "image": null}, "options": [{"id": "1ydsv", "label": "A", "text": "$18.02\\ \\text{kJ mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "5EWEg", "label": "B", "text": "$20.1\\ \\text{kJ mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "zneXR", "label": "C", "text": "$19.02\\ \\text{kJ mol}^{-1}$", "isCorrect": true, "image": null}, {"id": "8jVzi", "label": "D", "text": "$21.5\\ \\text{kJ mol}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the Arrhenius equation:<br><br>$\\log \\left( \\dfrac{k_2}{k_1} \\right) = \\dfrac{E_a}{2.303 R} \\left( \\dfrac{T_2 - T_1}{T_1 T_2} \\right)$<br><br>Substituting the given values:<br><br>$\\log \\left( \\dfrac{3.0 \\times 10^7}{1.5 \\times 10^7} \\right) = \\dfrac{E_a}{19.15} \\left( \\dfrac{330 - 300}{300 \\times 330} \\right)$<br><br>$\\log (2) = \\dfrac{E_a}{19.15} \\left( \\dfrac{30}{99000} \\right)$<br><br>$0.301 = \\dfrac{E_a}{19.15} \\left( \\dfrac{1}{3300} \\right)$<br><br>$E_a = 0.301 \\times 19.15 \\times 3300$<br><br>$E_a = 19021.695\\ \\text{J mol}^{-1}$<br><br>$E_a \\approx 19.02\\ \\text{kJ mol}^{-1}$<br><br>Answer: $19.02\\ \\text{kJ mol}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcebf9280d7f9932c98", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Calculate rate constant of a first order reaction having pre exponential factor $1.6 \\times 10^{13} \\mathrm{~s}^{-1} \\quad\\left(\\mathrm{E}_{\\mathrm{a}} / 2.303 \\mathrm{RT}=21\\right)$", "image": null}, "options": [{"id": "ErMSI", "text": "$1.6 \\times 10^{-13}$", "image": null, "isCorrect": false}, {"id": "t1Pge", "text": "$3.2 \\times 10^{-13}$", "image": null, "isCorrect": false}, {"id": "4nXTb", "text": "$3.2 \\times 10^{-8}$", "image": null, "isCorrect": false}, {"id": "PeNqd", "text": "$1.6 \\times 10^{-8}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to the Arrhenius equation:<br><br>$k = A e^{-E_a / RT}$<br><br>This can be expressed in terms of base 10 as:<br><br>$k = A \\times 10^{-E_a / 2.303 RT}$<br><br>Given $A = 1.6 \\times 10^{13} \\text{ s}^{-1}$ and $\\dfrac{E_a}{2.303 RT} = 21$, substituting these values:<br><br>$k = 1.6 \\times 10^{13} \\times 10^{-21}$<br><br>$k = 1.6 \\times 10^{-8} \\text{ s}^{-1}$<br><br>Answer: $1.6 \\times 10^{-8}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bacbf9280d7f9932b74", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The rate constant is doubled when temperature increases from $27^{\\circ} \\mathrm{C}$ to $37^{\\circ} \\mathrm{C}$. What is activation energy in kJ ?", "image": null}, "options": [{"id": "4DvnG", "text": "21.32", "image": null, "isCorrect": false}, {"id": "WDC46", "text": "34.12", "image": null, "isCorrect": false}, {"id": "442CO", "text": "53.60", "image": null, "isCorrect": true}, {"id": "4ytoX", "text": "43.54", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>$T_1 = 27^{\\circ} \\mathrm{C} = 300 \\mathrm{K}$<br>$T_2 = 37^{\\circ} \\mathrm{C} = 310 \\mathrm{K}$<br>$\\dfrac{k_2}{k_1} = 2$<br>$R = 8.314 \\mathrm{\\, J \\, K^{-1} \\, mol^{-1}}$<br><br>Using the Arrhenius equation:<br>$\\log_{10} \\left( \\dfrac{k_2}{k_1} \\right) = \\dfrac{E_a}{2.303 R} \\left( \\dfrac{T_2 - T_1}{T_1 T_2} \\right)$<br><br>Substituting the values:<br>$\\log_{10} (2) = \\dfrac{E_a}{2.303 \\times 8.314} \\left( \\dfrac{310 - 300}{300 \\times 310} \\right)$<br><br>$0.3010 = \\dfrac{E_a}{19.147} \\left( \\dfrac{10}{93000} \\right)$<br><br>$E_a = \\dfrac{0.3010 \\times 19.147 \\times 93000}{10}$<br><br>$E_a = 53598.6 \\mathrm{\\, J \\, mol^{-1}}$<br><br>$E_a = 53.60 \\mathrm{\\, kJ \\, mol^{-1}}$<br><br>Answer: 53.60", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b24bf9280d7f993269f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The rate constant for a first order reaction is $0.58 \\mathrm{~s}^{-1}$ at 300 K and $0.026 \\mathrm{~s}^{-1}$ at 290 K .\nWhat is the energy of activation? $\\left(\\mathrm{R}=8.314 \\mathrm{~J} \\mathrm{~K}^{-1} \\mathrm{~mol}^{-1}\\right)$", "image": null}, "options": [{"id": "GMS9y", "text": "$124.48 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "zzfQT", "text": "$224.55 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "gB3Dl", "text": "$348.18 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "yne6g", "text": "$513.21 \\mathrm{~kJ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given:<br>Rate constant at $T_1 = 290 \\mathrm{~K}$ is $k_1 = 0.026 \\mathrm{~s}^{-1}$<br>Rate constant at $T_2 = 300 \\mathrm{~K}$ is $k_2 = 0.58 \\mathrm{~s}^{-1}$<br>Gas constant $R = 8.314 \\mathrm{~J \\, K}^{-1} \\mathrm{mol}^{-1}$<br><br>Using the Arrhenius equation:<br>$\\log \\left( \\dfrac{k_2}{k_1} \\right) = \\dfrac{E_a}{2.303 R} \\left( \\dfrac{T_2 - T_1}{T_1 T_2} \\right)$<br><br>Substituting the given values:<br>$\\log \\left( \\dfrac{0.58}{0.026} \\right) = \\dfrac{E_a}{2.303 \\times 8.314} \\left( \\dfrac{300 - 290}{290 \\times 300} \\right)$<br><br>$\\log (22.3) = \\dfrac{E_a}{19.147} \\left( \\dfrac{10}{87000} \\right)$<br><br>$1.348 = \\dfrac{E_a}{19.147} \\times \\dfrac{1}{8700}$<br><br>$E_a = 1.348 \\times 19.147 \\times 8700$<br><br>$E_a = 224548 \\mathrm{~J \\, mol}^{-1}$<br><br>$E_a = 224.55 \\mathrm{~kJ \\, mol}^{-1}$<br><br>Answer: $224.55 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214320aee93fa0796dec0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Which of the following is true for a reaction as per collision theory?", "image": null}, "options": [{"id": "1ONAZ", "text": "Every collision between reactants leads to chemical reaction.", "image": null, "isCorrect": false}, {"id": "GpSNQ", "text": "It may be expected that rate of reaction is equal to rate of collision.", "image": null, "isCorrect": true}, {"id": "JXfpG", "text": "For gas phase reactions, the number of collisions is far less compared to observed rate.", "image": null, "isCorrect": false}, {"id": "nEa25", "text": "The colliding molecules do not need proper orientation.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the collision theory of bimolecular reactions, chemical reactions occur as a result of collisions between reactant molecules. Based on this, it may be expected that the rate of reaction is equal to the rate of collision.<br><br>However, the other statements are incorrect because:<br>1. Not every collision leads to a chemical reaction; only effective collisions (with sufficient energy and proper orientation) result in a reaction.<br>2. For gas-phase reactions, the number of collisions is far greater (not less) compared to the observed rate of reaction.<br>3. The colliding molecules must have proper orientation to form the products.<br><br>Thus, the only true statement among the given options is that it may be expected that the rate of reaction is equal to the rate of collision.<br><br>Answer: It may be expected that rate of reaction is equal to rate of collision.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213760aee93fa0796d8fa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "In the Arrhenius plot of logk versus $1 / T$ find the value of intercept on $y$ axis", "image": null}, "options": [{"id": "LvuUO", "text": "$\\quad \\log _{10} \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "4Udw7", "text": "$\\dfrac{-\\mathrm{Ea}}{\\mathrm{R}}$", "image": null, "isCorrect": false}, {"id": "eyK2h", "text": "$\\quad \\ln k$", "image": null, "isCorrect": false}, {"id": "L9BQJ", "text": "$\\quad R / E_a$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The Arrhenius equation is given by $k = A e^{-E_a / RT}$<br><br>Taking the logarithm to the base $10$ on both sides, we get:<br><br>$\\log_{10} k = \\log_{10} A - \\dfrac{E_a}{2.303 RT}$<br><br>This equation is of the form $y = mx + c$, which represents a straight line.<br><br>Here, $y = \\log_{10} k$ and $x = \\dfrac{1}{T}$<br><br>The slope of the line is $m = -\\dfrac{E_a}{2.303 R}$<br><br>The y-intercept is $c = \\log_{10} A$<br><br>Thus, in the plot of $\\log_{10} k$ versus $\\dfrac{1}{T}$, the intercept on the y-axis is $\\log_{10} A$.<br><br>Answer: $\\quad \\log _{10} \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213390aee93fa0796d71c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "What is the value of slope, if $\\log _{10} \\mathrm{~K}$ (y-axis) is plotted versus $1 / \\mathrm{T}$ (x-axis) for Arrhenius equation?", "image": null}, "options": [{"id": "5dv77", "text": "$\\log _{10} \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "b8mdF", "text": "$\\dfrac{2 \\cdot 303 \\mathrm{R}}{\\mathrm{E}_{\\mathrm{a}}}$", "image": null, "isCorrect": false}, {"id": "4TN0X", "text": "$\\dfrac{-\\mathrm{E}_{\\mathrm{a}}}{2 \\cdot 303 \\mathrm{R}}$", "image": null, "isCorrect": true}, {"id": "jx38i", "text": "$-\\log _{10} \\mathrm{~A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The Arrhenius equation is given by:<br><br>$K = A e^{-E_a / RT}$<br><br>Taking natural logarithm on both sides:<br><br>$\\ln K = \\ln A - \\dfrac{E_a}{RT}$<br><br>Converting to base 10 logarithm:<br><br>$2.303 \\log_{10} K = 2.303 \\log_{10} A - \\dfrac{E_a}{RT}$<br><br>Dividing by $2.303$:<br><br>$\\log_{10} K = \\log_{10} A - \\dfrac{E_a}{2.303 RT}$<br><br>Comparing this with the equation of a straight line $y = mx + c$, where $y = \\log_{10} K$ and $x = \\dfrac{1}{T}$:<br><br>Slope $m = \\dfrac{-E_a}{2.303 R}$<br><br>Answer: $\\dfrac{-\\mathrm{E}_{\\mathrm{a}}}{2 \\cdot 303 \\mathrm{R}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f4a0279619d9d8a1b49", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "The highest peak in energy profile diagram for mechanism of alkaline hydrolysis of tertiary butyl bromide represents", "image": null}, "options": [{"id": "tPHsn", "text": "transition state of $1^{\\text {st }}$ step", "image": null, "isCorrect": true}, {"id": "eO681", "text": "formation of carbocation", "image": null, "isCorrect": false}, {"id": "8YsIv", "text": "transition state of $2^{\\text {nd }}$ step", "image": null, "isCorrect": false}, {"id": "GclWQ", "text": "products", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The alkaline hydrolysis to tert-butyl bromide with aqueous alkali such as $\\mathrm{NaOH}$ or $\\mathrm{KOH}$ is as follows.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/xo2CD3oOWiE8MKKYMUSouWbD9pplZPkbq5eRKLdjAM4.original.fullsize.png\"><br>\nThe rate of this reaction depends only on the concentration of the tert-butyl bromide and is independent of the concentration of alkali added.\nRate $\\alpha\\left[\\left(\\mathrm{CH}_{3}\\right)_{3} \\mathrm{C}-\\mathrm{Br}\\right]$\nRate $=\\mathrm{K}\\left[\\left(\\mathrm{CH}_{3}\\right)_{3} \\mathrm{C}-\\mathrm{Br}\\right]$\nThis is a first order reaction because rate of hydrolysis of $\\left(\\mathrm{CH}_{3}\\right)_{3}-\\mathrm{Br}$ is independent of the concentration of alkali or $\\mathrm{OH}^{-}$ions. This can be explained by two-step mechanism shown below. Each step is an elementary reaction with its own rate constant, step 1 proceeds much more slowly than step 2 .<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/UFjRWnfHLIse5xynqJbierkJPdRXnmcoKff6OxlWwiE.original.fullsize.png\"><br>\nRate of reaction $=\\mathrm{k}_{1}\\left[\\left(\\mathrm{CH}_{3}\\right)_{3} \\mathrm{C}-\\mathrm{Br}\\right]$\nThe first step consists of breaking of $\\mathrm{C}-\\mathrm{Br}$ bond and it determines the rate of overall reaction. So, step 1 is called the rate-determining step. The rate determining step in this reaction involves only a single molecule, therefore, it is said to be unimolecular. Also, this type of mechanism is known as $\\mathrm{SN}^{1}$ mechanism(substitution, nucleophilic, unimolecular).<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Cukn5bqSVv4oVCx7UlzhLIa23zPVkZA4J4Jn56jxt8o.original.fullsize.png\"><br>\nRate of reaction $=\\mathrm{k}_{2}\\left[\\left(\\mathrm{CH}_{3}\\right)_{3} \\mathrm{C}^{+}\\right]\\left[\\mathrm{OH}^{-}\\right]$\nThe second step involves the attack of $\\mathrm{OH}^{-}$ion. This is the fast step, since it is the bond formation step.\nEnergy profile diagram of $\\mathrm{SN}^{1}$ mechanism shows that rate of a reaction is independent of the concentration of nucleophile. The first step requires larger activation energy $\\left(\\Delta \\mathrm{E}_{1}\\right)$ than the second step $\\left(\\Delta \\mathrm{E}_{2}\\right)$. The first step to form carbocation determines the rate of overall reaction. The second step, which is the attack of nucleophile on carbocation is exothermic i.e., it is a lower energy transition state. The intermediate carbocation appears at a low point in the diagram. The conditions and reagents which favour the formation of carbocation will accelerate the $\\mathrm{SN}^{1}$ reaction. The energy difference between products and reactants is $\\Delta \\mathrm{H}$, i.e., Heat of reaction.<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/-_0bN68YsStQoPEX2kgvuodw_d7CW66cAIaRzDl4vgQ.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f330279619d9d8a1a90", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "Which among the following is correct when energy of activation, Ea of the catalyzed reaction decreases at constant temperature and for same concentration?", "image": null}, "options": [{"id": "A8Z55", "text": "Ea/RT decreases", "image": null, "isCorrect": true}, {"id": "OdQFW", "text": "K decreases", "image": null, "isCorrect": false}, {"id": "ROyAl", "text": "$\\mathrm{e}^{-\\mathrm{Ea} / \\mathrm{RT}}$ decreases", "image": null, "isCorrect": false}, {"id": "OqGUF", "text": "$-\\mathrm{Ea} / \\mathrm{RT}$ decreases", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f0f0279619d9d8a1975", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "The activation energy of a reaction is zero. Its rate constant at 280 K is <math><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup><msup><mrow><mi>s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>,</mo></math> the rate constant at 300 K is", "image": null}, "options": [{"id": "diH5W", "text": "<math><mn>3.2</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup><msup><mrow><mi>s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "ZgTHF", "text": "Zero", "image": null, "isCorrect": false}, {"id": "RzQVT", "text": "<math><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup><msup><mrow><mi>s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "028V4", "text": "<math><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup><msup><mrow><mi>s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<strong>Key Idea</strong> Arrhenius equations is given as: <br/><math><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">g</mi><mfrac><mrow><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi>k</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi>E</mi></mrow><mrow><mi>a</mi></mrow></msub></mrow><mrow><mn>2.303</mn><mi>R</mi></mrow></mfrac><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></mrow></mfenced></math>  <br/>Given, <br/>Activation energy of a reaction, <math><msub><mrow><mi>E</mi></mrow><mrow><mi>A</mi></mrow></msub><mo>=</mo><mn>0</mn></math>  <br/>Rate constant, <math><msub><mrow><mi>k</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup><msup><mrow><mi>s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>  <br/>Temperature, <math><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>280</mn><mi>K</mi><mo>,</mo><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>300</mn><mi>K</mi></math>  <br/>According to Arrhenius equation <br/><math><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">g</mi><mfrac><mrow><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>0</mn></mrow><mrow><mn>2.303</mn><mi>R</mi></mrow></mfrac><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>280</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>300</mn></mrow></mfrac></mrow></mfenced></math>  <br/><math><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">g</mi><mfrac><mrow><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>0</mn></math>  <br/><math><mfrac><mrow><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfrac><mo>=</mo></math> antilog 0 <br/><math><mfrac><mrow><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>1</mn></math>  <br/><math><mo>∴</mo><mtext>        </mtext><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>1.6</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup><msup><mrow><mi>s</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>", "image" : "2017", "title": "MHT CET 2017"}], "question": {"text": "Which among the following equations represents Arrhenius equation?", "image": null}, "options": [{"id": "XAgXJ", "text": "<math><mtext>K</mtext><mo>=</mo><mtext>A.</mtext><msup><mrow><mtext>e</mtext></mrow><mrow><mrow><mrow><msub><mrow><mtext>E</mtext></mrow><mrow><mtext>a</mtext></mrow></msub></mrow><mo>/</mo><mrow><mtext>(R</mtext><mtext>T)</mtext></mrow></mrow></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "bzN0Z", "text": "<math><mtext mathvariant=\"normal\">&nbsp;</mtext><mtext>K</mtext><mo>=</mo><mtext>A</mtext><mo>.</mo><msup><mrow><mtext>e</mtext></mrow><mrow><mrow><mrow><mtext>R</mtext><mtext>T</mtext></mrow><mo>/</mo><mrow><msub><mrow><mtext>E</mtext></mrow><mrow><mtext>a</mtext></mrow></msub></mrow></mrow></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "wSW92", "text": "<math><mtext>K</mtext><mo>=</mo><mfrac><mrow><mtext>A</mtext></mrow><mrow><msup><mrow><mtext>e</mtext></mrow><mrow><mrow><mrow><msub><mrow><mtext>E</mtext></mrow><mrow><mtext>a</mtext></mrow></msub></mrow><mo>/</mo><mrow><mtext>(RT)</mtext></mrow></mrow></mrow></msup></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "qXsKH", "text": "<math><mtext mathvariant=\"normal\">&nbsp;</mtext><mtext>K</mtext><mo>=</mo><mfrac><mrow><mtext>A</mtext></mrow><mrow><msup><mrow><mtext>e</mtext></mrow><mrow><mrow><mrow><mtext>R</mtext><mtext>T</mtext></mrow><mo>/</mo><mrow><mtext>E</mtext><mtext>a</mtext></mrow></mrow></mrow></msup></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Arrhenius equation is<br /><math> <mrow> <mtext>K</mtext><mo>=</mo><mtext>A</mtext><msup> <mtext>e</mtext> <mrow> <mo>−</mo><msub> <mtext>E</mtext> <mtext>a</mtext> </msub> <mo>/</mo><mrow><mo>(</mo> <mrow> <mtext>R</mtext><mtext>T</mtext></mrow> <mo>)</mo></mrow></mrow> </msup> </mrow> </math><br /><math> <mrow> <mo>∴</mo><mtext>K</mtext><mo>=</mo><mfrac> <mtext>A</mtext> <mrow> <msup> <mtext>e</mtext> <mrow> <msub> <mtext>E</mtext> <mtext>a</mtext> </msub> <mo>/</mo><mrow><mo>(</mo> <mrow> <mtext>R</mtext><mtext>T</mtext></mrow> <mo>)</mo></mrow></mrow> </msup> </mrow> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
