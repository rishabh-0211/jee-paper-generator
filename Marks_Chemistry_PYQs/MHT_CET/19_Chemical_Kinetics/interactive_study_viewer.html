Correct": false}, {"id": "1zOKf", "text": "$3.3 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "X0qOy", "text": "$4.4 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "RPUcj", "text": "$6.6 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& 3 \\mathrm{I}^{-}+\\mathrm{S}_2 \\mathrm{O}_8^{2-} \\rightarrow \\mathrm{I}_3^{-}+2 \\mathrm{SO}_4^{2-} \\\\\n& \\text { Rate of reaction }=-\\frac{1}{3} \\frac{\\mathrm{d}\\left[\\mathrm{I}^{-}\\right]}{\\mathrm{dt}}=+\\frac{1}{2} \\frac{\\mathrm{d}\\left[\\mathrm{SO}_4^{2-}\\right]}{\\mathrm{dt}} \\\\\n& \\begin{aligned}\n-\\frac{\\mathrm{d}\\left[\\mathrm{I}^{-}\\right]}{\\mathrm{dt}} & =\\frac{3}{2} \\frac{\\mathrm{d}\\left[\\mathrm{SO}_4^{2-}\\right]}{\\mathrm{dt}}=\\frac{3}{2} \\times 2.2 \\times 10^{-2} \\\\\n& =3.3 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}\n\\end{aligned}\n\\end{aligned}\n$$\n[Note: In the question, $\\frac{\\mathrm{d}\\left[\\mathrm{I}^{-}\\right]}{\\mathrm{dt}}$ is changed to $-\\frac{\\mathrm{d}\\left[\\mathrm{I}^{-}\\right]}{\\mathrm{dt}}$ to apply appropriate textual concepts.]", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a00279619d9d8a2e0d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 A ": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8b0279619d9d8a154f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "In a multistep reaction, the overall rate of reaction is equal to the", "image": null}, "options": [{"id": "1G9TO", "text": "rate of slowest step", "image": null, "isCorrect": true}, {"id": "qJ0Dj", "text": "rate of fastest step", "image": null, "isCorrect": false}, {"id": "nqeS7", "text": "average rate of various step", "image": null, "isCorrect": false}, {"id": "Ldp5c", "text": "the rate of last step", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rate of reaction depends upon the slowest step, hence the overall rate of a multistep reaction is equal to the rate of slowest step.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e6b0279619d9d8a1448", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "Kirchoff's equation is", "image": null}, "options": [{"id": "8Gdib", "text": "$\\log \\frac{k_{2}}{k_{1}}=\\frac{E_{a}}{2.303 \\mathrm{R}}\\left[\\frac{1}{T_{1}}-\\frac{1}{T_{2}}\\right]$", "image": null, "isCorrect": false}, {"id": "gXLXF", "text": "$\\log \\frac{p_{2}}{p_{1}}=\\frac{\\Delta H_{V}}{2.303 R}\\left[\\frac{T_{2}-T_{1}}{T_{1} \\times T_{2}}\\right]$", "image": null, "isCorrect": false}, {"id": "liTf6", "text": "$\\Delta C_{p}=\\frac{\\Delta H_{2}-\\Delta H_{1}}{T_{2}-T_{1}}$", "image": null, "isCorrect": true}, {"id": "9P7GY", "text": "$\\log \\frac{k_{2}}{k_{1}}=\\frac{\\Delta H}{2.303 R}\\left[\\frac{1}{T_{1}}-\\frac{1}{T_{2}}\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation given, in option (a) is Arrhenius equation, in option (b) is Clausius-Clapeyron equation, in option (c) is Kirchoff's equation, in option (d) is van't Hoff equation.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e540279619d9d8a138f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "For the reaction : $\\mathrm{H}_{2}+\\mathrm{I}_{2} \\longrightarrow 2 \\mathrm{HI}$, the\ndifferential rate law is", "image": null}, "options": [{"id": "bFSkJ", "text": "$-\\frac{d\\left[\\mathrm{H}_{2}\\right]}{d t}=-\\frac{d\\left[\\mathrm{I}_{2}\\right]}{d t}=2 \\frac{d[\\mathrm{HI}]}{d t}$", "image": null, "isCorrect": false}, {"id": "99Arb", "text": "$-\\frac{d\\left[\\mathrm{H}_{2}\\right]}{d t}=-2 \\frac{d\\left[\\mathrm{I}_{2}\\right]}{d t}=\\frac{d[\\mathrm{HI}]}{d t}$", "image": null, "isCorrect": true}, {"id": "LWGMS", "text": "$-\\frac{d\\left[\\mathrm{H}_{2}\\right]}{d t}=-\\frac{d\\left[\\mathrm{I}_{2}\\right]}{d t}=\\frac{d[\\mathrm{HI}]}{d t}$", "image": null, "isCorrect": false}, {"id": "NpPxJ", "text": "$-\\frac{d\\left[\\mathrm{H}_{2}\\right]}{d t}=-\\frac{d\\left[\\mathrm{I}_{2}\\right]}{d t}=\\frac{d[\\mathrm{HI}]}{d t}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{H}_{2}+\\mathrm{I}_{2} \\longrightarrow 2 \\mathrm{HI}$\nRate of reaction $=\\frac{-d\\left[\\mathrm{H}_{2}\\right]}{\\mathrm{dt}}=\\frac{-d\\left[\\mathrm{I}_{2}\\right]}{\\mathrm{dt}}=\\frac{1}{2} \\frac{d[\\mathrm{HI}]}{\\mathrm{d} t}$\nor $\\quad \\frac{-2 d\\left[\\mathrm{H}_{2}\\right]}{d t}=\\frac{-2 d\\left[\\mathrm{I}_{2}\\right]}{d t}=\\frac{d[\\mathrm{HI}]}{d t}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a2632e0279619d9d8a3cbe", "title": "Rate law and rate constant", "totalQuestions": 112, "questions": [{"_id": "6abb884215a9fc0fc8c14206", "type": "singleCorrect", "question": {"text": "Identify the nature of the graph obtained when rate versus initial concentration is plotted for first order reaction.", "image": null}, "options": [{"id": "wmJKh", "label": "A", "text": "A straight line passing through the origine having -ve slope.", "isCorrect": false, "image": null}, {"id": "TqlRV", "label": "B", "text": "A straight line parallel to X axis.", "isCorrect": false, "image": null}, {"id": "pBUhZ", "label": "C", "text": "A straight line passing through the origine having +ve slope.", "isCorrect": true, "image": null}, {"id": "xkjUo", "label": "D", "text": "A straight line intercepting X and Y axes.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate law is given by:<br><br>$\\text{Rate} = k[A]$<br><br>where $k$ is the rate constant and $[A]$ is the concentration of the reactant.<br><br>Comparing this with the equation of a straight line, $y = mx + c$, we get:<br><br>$y = \\text{Rate}$<br>$x = [A]$<br>$m = k$<br>$c = 0$<br><br>Since the rate constant $k$ is always positive, the slope $m$ is positive. The $y$-intercept $c$ is zero, which means the line passes through the origin.<br><br>Thus, the plot of rate versus initial concentration for a first order reaction is a straight line passing through the origin with a positive slope.<br><br>Answer: A straight line passing through the origine having +ve slope.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884215a9fc0fc8c14204", "type": "singleCorrect", "question": {"text": "The rate law for a reaction is Rate $= k[A]^2[B]^0$. The overall order is", "image": null}, "options": [{"id": "wEehw", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "kcuEl", "label": "B", "text": "$1$", "isCorrect": false, "image": null}, {"id": "SF9x2", "label": "C", "text": "$2$", "isCorrect": true, "image": null}, {"id": "GFPno", "label": "D", "text": "$3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The rate law for the given reaction is Rate $= k[A]^2[B]^0$.<br><br>The overall order of a reaction is defined as the sum of the exponents of the concentration terms in the rate law expression.<br><br>Overall order $= 2 + 0 = 2$.<br><br>Answer: $2$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885315a9fc0fc8c1429c", "type": "singleCorrect", "question": {"text": "How is the rate of second order reaction affected when the concentration of the reactant is increased by $2$ times its initial value ?", "image": null}, "options": [{"id": "g2VdQ", "label": "A", "text": "Remains the same.", "isCorrect": false, "image": null}, {"id": "xt8a6", "label": "B", "text": "It quadruples", "isCorrect": true, "image": null}, {"id": "ZmNUA", "label": "C", "text": "It triples", "isCorrect": false, "image": null}, {"id": "7CmdR", "label": "D", "text": "It doubles", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For a second order reaction, the rate law is given by:<br><br>$r_1 = k[A]^2$<br><br>When the concentration of the reactant is increased by $2$ times its initial value, the new concentration becomes $2[A]$.<br><br>The new rate of the reaction is:<br><br>$r_2 = k(2[A])^2$<br><br>$r_2 = 4k[A]^2$<br><br>$r_2 = 4r_1$<br><br>Thus, the rate of the reaction quadruples.<br><br>Answer: It quadruples", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885215a9fc0fc8c1429b", "type": "singleCorrect", "question": {"text": "Determine the rate law for a reaction, $2\\,\\text{NO} + \\text{Br}_2 \\rightarrow 2\\,\\text{NOBr}$ that occurs in following two steps.<br>i) $\\text{NO} + \\text{Br}_2 \\rightarrow \\text{NOBr}_2$ (fast)<br>ii) $\\text{NOBr}_2 + \\text{NO} \\rightarrow 2\\text{NOBr}$ (slow)", "image": null}, "options": [{"id": "TQKVY", "label": "A", "text": "$r = k[\\text{NOBr}_2][\\text{NO}]$", "isCorrect": false, "image": null}, {"id": "RZ2Ol", "label": "B", "text": "$r = k'[\\text{NO}]^2[\\text{Br}_2]$", "isCorrect": true, "image": null}, {"id": "cjp76", "label": "C", "text": "$r = k'[\\text{NO}][\\text{Br}_2]$", "isCorrect": false, "image": null}, {"id": "BtWzH", "label": "D", "text": "$r = k[\\text{NO}][\\text{Br}_2]^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The rate of the reaction is determined by the slowest step, which is the rate-determining step.<br><br>From step (ii), the rate equation is:<br>$r = k[\\text{NOBr}_2][\\text{NO}]$<br><br>Since $\\text{NOBr}_2$ is an intermediate, its concentration must be expressed in terms of the reactants. Assuming step (i) is a fast equilibrium:<br>$K_{eq} = \\dfrac{[\\text{NOBr}_2]}{[\\text{NO}][\\text{Br}_2]}$<br><br>$[\\text{NOBr}_2] = K_{eq}[\\text{NO}][\\text{Br}_2]$<br><br>Substituting this into the rate equation:<br>$r = k(K_{eq}[\\text{NO}][\\text{Br}_2])[\\text{NO}]$<br><br>$r = k'[\\text{NO}]^2[\\text{Br}_2]$ where $k' = k K_{eq}$<br><br>Answer: $r = k'[\\text{NO}]^2[\\text{Br}_2]$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885215a9fc0fc8c1429a", "type": "singleCorrect", "question": {"text": "For the reaction $A(g) + B(g) \\rightarrow 2AB(g)$ rate law is rate $= k[A][B]^{1/2}$. Identify TRUE statements about the reaction from following.", "image": null}, "options": [{"id": "LpbbY", "label": "A", "text": "The reaction is bimolecular and its order is two.", "isCorrect": false, "image": null}, {"id": "4PsgS", "label": "B", "text": "The reaction is unimolecular and its order is one.", "isCorrect": false, "image": null}, {"id": "fJFdC", "label": "C", "text": "The reaction is bimolecular and it is first order.", "isCorrect": false, "image": null}, {"id": "vBTQ0", "label": "D", "text": "The reaction is bimolecular and its order is $3/2$.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For the given reaction $A(g) + B(g) \\rightarrow 2AB(g)$, two reactant molecules are involved. Thus, the molecularity of the reaction is $2$, making it a bimolecular reaction.<br><br>The order of a reaction is the sum of the powers of the concentration terms in the experimentally determined rate law.<br><br>Given rate $= k[A][B]^{1/2}$<br><br>Order $= 1 + \\dfrac{1}{2} = \\dfrac{3}{2}$<br><br>Therefore, the reaction is bimolecular and its order is $3/2$.<br><br>Answer: The reaction is bimolecular and its order is $3/2$.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888215a9fc0fc8c1445c", "type": "singleCorrect", "question": {"text": "If for a reaction, $A + B \\rightarrow C + D$, when $[A]$ alone is doubled, the rate gets doubled and when $[B]$ alone is increased by $9$ times, the rate gets tripled. Find the order of reaction.", "image": null}, "options": [{"id": "Wx4Dl", "label": "A", "text": "$3/4$", "isCorrect": false, "image": null}, {"id": "1hECd", "label": "B", "text": "$3/2$", "isCorrect": true, "image": null}, {"id": "Uqg2D", "label": "C", "text": "$4/9$", "isCorrect": false, "image": null}, {"id": "ezdEe", "label": "D", "text": "$2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the rate law for the reaction be $r = k[A]^x[B]^y$.<br><br>When $[A]$ alone is doubled, the rate gets doubled:<br><br>$2r = k(2[A])^x[B]^y$<br><br>Dividing this by the initial rate equation gives $2^x = 2$, which implies $x = 1$.<br><br>When $[B]$ alone is increased by $9$ times, the rate gets tripled:<br><br>$3r = k[A]^x(9[B])^y$<br><br>Dividing this by the initial rate equation gives $9^y = 3$.<br><br>Since $9^y = (3^2)^y = 3^{2y}$, we have $3^{2y} = 3^1$, which implies $2y = 1$ and $y = \\dfrac{1}{2}$.<br><br>The overall order of the reaction is the sum of the individual orders:<br><br>Order $= x + y = 1 + \\dfrac{1}{2} = \\dfrac{3}{2}$<br><br>Answer: $3/2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889215a9fc0fc8c144f3", "type": "singleCorrect", "question": {"text": "Which of the following statements is correct?", "image": null}, "options": [{"id": "Fbsqn", "label": "A", "text": "The order of reaction is always equal to molecularity.", "isCorrect": false, "image": null}, {"id": "y15hj", "label": "B", "text": "The order of chemical reaction is determined experimentally.", "isCorrect": true, "image": null}, {"id": "hVx6Y", "label": "C", "text": "The molecularity of reaction can be fractional.", "isCorrect": false, "image": null}, {"id": "n8Lgj", "label": "D", "text": "The order of reaction depends only on stoichiometric coefficients.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The order of a chemical reaction is an experimentally determined quantity and cannot be deduced merely from the balanced chemical equation.<br><br>Molecularity is a theoretical concept representing the number of reacting species taking part in an elementary reaction, so it must be a positive integer and cannot be zero or fractional.<br><br>The order of a reaction may or may not be equal to its molecularity and does not depend only on the stoichiometric coefficients.<br><br>Answer: The order of chemical reaction is determined experimentally.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889215a9fc0fc8c144f2", "type": "singleCorrect", "question": {"text": "For a reaction $A \\rightarrow$ Product, the rate constant is $6.09 \\times 10^{-3}$ $\\text{hour}^{-1}$. What is the order of the reaction?", "image": null}, "options": [{"id": "gFo3V", "label": "A", "text": "Zero", "isCorrect": false, "image": null}, {"id": "T64rC", "label": "B", "text": "$1.5$", "isCorrect": false, "image": null}, {"id": "C8ihq", "label": "C", "text": "$1$", "isCorrect": true, "image": null}, {"id": "g8hAz", "label": "D", "text": "$2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The unit of the rate constant for an $n$-th order reaction is given by $(\\text{concentration})^{1-n} \\text{time}^{-1}$.<br><br>Given the rate constant $k = 6.09 \\times 10^{-3} \\text{ hour}^{-1}$, the unit is $\\text{time}^{-1}$.<br><br>Equating the units, we get $(\\text{concentration})^{1-n} = (\\text{concentration})^{0}$.<br><br>Therefore, $1 - n = 0 \\Rightarrow n = 1$.<br><br>The reaction is of the first order.<br><br>Answer: $1$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886215a9fc0fc8c14332", "type": "singleCorrect", "question": {"text": "The rate of reaction, $A + B \\rightarrow C$ is $3.6 \\times 10^{-2}$ mol dm$^{-3}$ s$^{-1}$ when $[A] = [B] = 0.2$ mol dm$^{-3}$. Calculate the rate constant if the reaction is first order in A and second order in B.", "image": null}, "options": [{"id": "lxJ0l", "label": "A", "text": "$4.5$ mol$^{-2}$ dm$^6$ s$^{-1}$", "isCorrect": true, "image": null}, {"id": "vOaM9", "label": "B", "text": "$3.6$ mol$^{-2}$ dm$^6$ s$^{-1}$", "isCorrect": false, "image": null}, {"id": "qVu8N", "label": "C", "text": "$5.4$ mol$^{-2}$ dm$^6$ s$^{-1}$", "isCorrect": false, "image": null}, {"id": "ctUbO", "label": "D", "text": "$2.7$ mol$^{-2}$ dm$^6$ s$^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The rate law for the given reaction is:<br><br>$\\text{Rate} = k[A]^1[B]^2$<br><br>Substituting the given values into the rate law equation:<br><br>$3.6 \\times 10^{-2} = k(0.2)(0.2)^2$<br><br>$3.6 \\times 10^{-2} = k(0.008)$<br><br>$k = \\dfrac{3.6 \\times 10^{-2}}{8 \\times 10^{-3}}$<br><br>$k = 4.5 \\text{ mol}^{-2} \\text{ dm}^6 \\text{ s}^{-1}$<br><br>Answer: $4.5$ mol$^{-2}$ dm$^6$ s$^{-1}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c215a9fc0fc8c146b4", "type": "singleCorrect", "question": {"text": "Which of the following is a pseudo-first order reaction?", "image": null}, "options": [{"id": "8sFVf", "label": "A", "text": "Decomposition of ammonia on platinum metal", "isCorrect": false, "image": null}, {"id": "pY7hq", "label": "B", "text": "Decomposition of $\\text{H}_2\\text{O}_2(l)$", "isCorrect": false, "image": null}, {"id": "T2l1h", "label": "C", "text": "Decomposition of $\\text{N}_2\\text{O}_5(g)$", "isCorrect": false, "image": null}, {"id": "pQl4R", "label": "D", "text": "Hydrolysis of methyl acetate", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "A pseudo-first order reaction is a bimolecular reaction that appears to follow first-order kinetics because one of the reactants is present in large excess, making its concentration essentially constant throughout the reaction.<br><br>The acid-catalyzed hydrolysis of methyl acetate is given by the equation:<br>$\\text{CH}_3\\text{COOCH}_3 + \\text{H}_2\\text{O} \\xrightarrow{\\text{H}^+} \\text{CH}_3\\text{COOH} + \\text{CH}_3\\text{OH}$<br><br>The rate law is expected to be:<br>$\\text{Rate} = k[\\text{CH}_3\\text{COOCH}_3][\\text{H}_2\\text{O}]$<br><br>Since water is present in large excess, its concentration remains practically constant. The rate law becomes:<br>$\\text{Rate} = k'[\\text{CH}_3\\text{COOCH}_3]$ where $k' = k[\\text{H}_2\\text{O}]$<br><br>Thus, it behaves as a first-order reaction and is called a pseudo-first order reaction.<br><br>Decomposition of ammonia on platinum metal is a zero-order reaction at high pressure.<br>Decomposition of $\\text{H}_2\\text{O}_2(l)$ and $\\text{N}_2\\text{O}_5(g)$ are true first-order reactions.<br><br>Answer: Hydrolysis of methyl acetate", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883215a9fc0fc8c14170", "type": "singleCorrect", "question": {"text": "In a reaction, $2A_{(g)}\\rightarrow$ Products, the rate law is $r=k[A]^2$. Calculate the rate constant if the rate of reaction is $6.5\\times 10^{-6}$ mol L$^{-1}$ S$^{-1}$ and $[A]$ is $2\\times 10^{-3}$ mol/L.", "image": null}, "options": [{"id": "ZxOx1", "label": "A", "text": "$1.625$ mol$^{-1}$L s$^{-1}$", "isCorrect": true, "image": null}, {"id": "6zgsL", "label": "B", "text": "$2.521$ mol$^{-1}$L s$^{-1}$", "isCorrect": false, "image": null}, {"id": "CXWi2", "label": "C", "text": "$3.125$ mol$^{-1}$L s$^{-1}$", "isCorrect": false, "image": null}, {"id": "xuTiP", "label": "D", "text": "$2.015$ mol$^{-1}$L s$^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given rate law is $r = k[A]^2$<br><br>Substituting the given values:<br><br>$6.5 \\times 10^{-6} = k(2 \\times 10^{-3})^2$<br><br>$k = \\dfrac{6.5 \\times 10^{-6}}{4 \\times 10^{-6}}$<br><br>$k = 1.625$ mol$^{-1}$ L s$^{-1}$<br><br>Answer: $1.625$ mol$^{-1}$L s$^{-1}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2aa8c30a4553e1bdb81", "type": "singleCorrect", "question": {"text": "Calculate the rate constant of first order reaction $\\text{A} \\rightarrow \\text{B}$ having rate $5.4 \\times 10^{-6}\\ \\text{mol dm}^{-3}\\text{s}^{-1}$ and $[\\text{A}] = 0.3$ M.", "image": null}, "options": [{"id": "3MlBH", "label": "A", "text": "$1.52 \\times 10^{-5}\\ \\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "fl2Xl", "label": "B", "text": "$1.68 \\times 10^{-5}\\ \\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "0Tigt", "label": "C", "text": "$1.72 \\times 10^{-5}\\ \\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "RlyDV", "label": "D", "text": "$1.80 \\times 10^{-5}\\ \\text{s}^{-1}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate law is given by:<br><br>$\\text{Rate} = k[\\text{A}]$<br><br>Substituting the given values:<br><br>$5.4 \\times 10^{-6} = k \\times 0.3$<br><br>$k = \\dfrac{5.4 \\times 10^{-6}}{0.3}$<br><br>$k = 18 \\times 10^{-6}\\ \\text{s}^{-1}$<br><br>$k = 1.80 \\times 10^{-5}\\ \\text{s}^{-1}$<br><br>Answer: $1.80 \\times 10^{-5}\\ \\text{s}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2aa8c30a4553e1bdb80", "type": "singleCorrect", "question": {"text": "What is the order and molecularity of the following elementary reaction?<br>$2\\text{NO}_{2(g)} \\rightarrow 2\\text{NO}_{(g)} + \\text{O}_{2(g)}$, rate $= k \\times [\\text{NO}_2]^2$", "image": null}, "options": [{"id": "eg4ul", "label": "A", "text": "The reaction is second order and biomolecular.", "isCorrect": true, "image": null}, {"id": "Dc9Ug", "label": "B", "text": "The reaction is first order and bimolecular.", "isCorrect": false, "image": null}, {"id": "0pQVZ", "label": "C", "text": "The reaction is second order and unimolecular.", "isCorrect": false, "image": null}, {"id": "pR76o", "label": "D", "text": "The reaction is zero order and unimolecular.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For an elementary reaction, the rate law is determined by its stoichiometry.<br><br>Given rate $= k[\\text{NO}_2]^2$<br><br>The order of the reaction is the sum of the exponents of the concentration terms in the rate law. Here, the exponent is $2$, so the order is $2$.<br><br>The molecularity of an elementary reaction is the number of reactant molecules participating in the reaction. Since $2$ molecules of $\\text{NO}_2$ are reacting, the molecularity is $2$ (bimolecular).<br><br>Thus, the reaction is second order and bimolecular.<br><br>Answer: The reaction is second order and biomolecular.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3008c30a4553e1bdf19", "type": "singleCorrect", "question": {"text": "Which of the following is an elementary reaction ?", "image": null}, "options": [{"id": "c9cXU", "label": "A", "text": "$\\text{O}_{3(g)} \\rightarrow \\text{O}_{2(g)} + \\text{O}_{(g)}$", "isCorrect": true, "image": null}, {"id": "MIMAw", "label": "B", "text": "$2\\text{NO}_2\\text{Cl}_{(g)} \\rightarrow 2\\text{NO}_{2(g)} + \\text{Cl}_{2(g)}$", "isCorrect": false, "image": null}, {"id": "TmSQT", "label": "C", "text": "$2\\text{NO}_{2(g)} + \\text{F}_{2(g)} \\rightarrow 2\\text{NO}_2\\text{F}_{(g)}$", "isCorrect": false, "image": null}, {"id": "2aw2w", "label": "D", "text": "$2\\text{NO}_{(g)} + \\text{Cl}_{2(g)} \\rightarrow 2\\text{NOCl}_{(g)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "An elementary reaction is one that occurs in a single step and has a single transition state.<br><br>The decomposition of ozone, $\\text{O}_{3(g)} \\rightarrow \\text{O}_{2(g)} + \\text{O}_{(g)}$, is a unimolecular elementary reaction.<br><br>The other reactions are complex and occur in multiple steps:<br><br>$2\\text{NO}_2\\text{Cl}_{(g)} \\rightarrow 2\\text{NO}_{2(g)} + \\text{Cl}_{2(g)}$ occurs via:<br>Step 1: $\\text{NO}_2\\text{Cl} \\rightarrow \\text{NO}_2 + \\text{Cl}$ (slow)<br>Step 2: $\\text{NO}_2\\text{Cl} + \\text{Cl} \\rightarrow \\text{NO}_2 + \\text{Cl}_2$ (fast)<br><br>$2\\text{NO}_{2(g)} + \\text{F}_{2(g)} \\rightarrow 2\\text{NO}_2\\text{F}_{(g)}$ occurs via:<br>Step 1: $\\text{NO}_2 + \\text{F}_2 \\rightarrow \\text{NO}_2\\text{F} + \\text{F}$ (slow)<br>Step 2: $\\text{NO}_2 + \\text{F} \\rightarrow \\text{NO}_2\\text{F}$ (fast)<br><br>$2\\text{NO}_{(g)} + \\text{Cl}_{2(g)} \\rightarrow 2\\text{NOCl}_{(g)}$ occurs via:<br>Step 1: $\\text{NO} + \\text{Cl}_2 \\rightleftharpoons \\text{NOCl}_2$ (fast)<br>Step 2: $\\text{NOCl}_2 + \\text{NO} \\rightarrow 2\\text{NOCl}$ (slow)<br><br>Therefore, only the first reaction is elementary.<br><br>Answer: $\\text{O}_{3(g)} \\rightarrow \\text{O}_{2(g)} + \\text{O}_{(g)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f18c30a4553e1bde77", "type": "singleCorrect", "question": {"text": "Which of the following is an example of fractional order reaction ?", "image": null}, "options": [{"id": "6u4aE", "label": "A", "text": "$2\\text{H}_2\\text{O}_2\\text{(g)} \\longrightarrow 2\\text{H}_2\\text{O}\\text{(l)} + \\text{O}_2\\text{(g)}$", "isCorrect": false, "image": null}, {"id": "pBo9T", "label": "B", "text": "$\\text{H}_2\\text{(g)} + \\text{I}_2\\text{(g)} \\longrightarrow 2\\text{HI}\\text{(g)}$", "isCorrect": false, "image": null}, {"id": "ihyUx", "label": "C", "text": "$\\text{CH}_3\\text{CHO}\\text{(g)} \\longrightarrow \\text{CH}_4\\text{(g)} + \\text{CO}\\text{(g)}$", "isCorrect": true, "image": null}, {"id": "xoaQD", "label": "D", "text": "$2\\text{NO}\\text{(g)} + 2\\text{H}_2\\text{(g)} \\longrightarrow \\text{N}_2\\text{(g)} + 2\\text{H}_2\\text{O}\\text{(l)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The decomposition of acetaldehyde ($\\text{CH}_3\\text{CHO}$) is a well-known example of a fractional order reaction.<br><br>The experimentally determined rate law for this reaction is given by:<br><br>$\\text{Rate} = k[\\text{CH}_3\\text{CHO}]^{1.5}$<br><br>Thus, the overall order of the reaction is $1.5$, which is a fractional value.<br><br>For the other given reactions:<br>Decomposition of $\\text{H}_2\\text{O}_2$ is a first-order reaction.<br>Formation of $\\text{HI}$ from $\\text{H}_2$ and $\\text{I}_2$ is a second-order reaction.<br>Reaction between $\\text{NO}$ and $\\text{H}_2$ is a third-order reaction.<br><br>Answer: $\\text{CH}_3\\text{CHO}\\text{(g)} \\longrightarrow \\text{CH}_4\\text{(g)} + \\text{CO}\\text{(g)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3298c30a4553e1be0d3", "type": "singleCorrect", "question": {"text": "For the reaction $2\\text{NOBr}_{(g)} \\longrightarrow 2\\text{NO}_{(g)} + \\text{Br}_{2(g)}$, rate law is $r = k[\\text{NOBr}]^2$. Rate constant is $1.62\\ \\text{M s}^{-1}$ and concentration of NOBr is $5 \\times 10^{-3}\\ \\text{M}$,<br>What is rate of reaction?", "image": null}, "options": [{"id": "y9Zxw", "label": "A", "text": "$4.05 \\times 10^{-5}\\ \\text{M s}^{-1}$", "isCorrect": true, "image": null}, {"id": "iMADD", "label": "B", "text": "$6.48 \\times 10^{-6}\\ \\text{M s}^{-1}$", "isCorrect": false, "image": null}, {"id": "6gInp", "label": "C", "text": "$2.12 \\times 10^{-5}\\ \\text{M s}^{-1}$", "isCorrect": false, "image": null}, {"id": "mFDqU", "label": "D", "text": "$8.63 \\times 10^{-6}\\ \\text{M s}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given rate law is $r = k[\\text{NOBr}]^2$<br><br>Substituting the given values:<br><br>$r = 1.62 \\times (5 \\times 10^{-3})^2$<br><br>$r = 1.62 \\times 25 \\times 10^{-6}$<br><br>$r = 40.5 \\times 10^{-6}$<br><br>$r = 4.05 \\times 10^{-5}\\ \\text{M s}^{-1}$<br><br>Answer: $4.05 \\times 10^{-5}\\ \\text{M s}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3288c30a4553e1be0c9", "type": "singleCorrect", "question": {"text": "Which of the following reactions has of overall order $1.5$ ?", "image": null}, "options": [{"id": "nhXp7", "label": "A", "text": "$2\\text{H}_2\\text{O}_{2(g)} \\longrightarrow 2\\text{H}_2\\text{O}_{(\\ell)} + \\text{O}_{2(g)}$", "isCorrect": false, "image": null}, {"id": "F5zR6", "label": "B", "text": "$\\text{H}_{2(g)} + \\text{I}_{2(g)} \\longrightarrow 2\\text{HI}_{(g)}$", "isCorrect": false, "image": null}, {"id": "alIWZ", "label": "C", "text": "$\\text{CH}_3\\text{CHO}_{(g)} \\longrightarrow \\text{CH}_{4(g)} + \\text{CO}_{(g)}$", "isCorrect": true, "image": null}, {"id": "8bZy5", "label": "D", "text": "$2\\text{NO}_{(g)} + 2\\text{H}_{2(g)} \\longrightarrow \\text{N}_{2(g)} + 2\\text{H}_2\\text{O}_{(\\ell)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The thermal decomposition of acetaldehyde is a well-known example of a reaction with a fractional order.<br><br>The reaction is: $\\text{CH}_3\\text{CHO}_{(g)} \\longrightarrow \\text{CH}_{4(g)} + \\text{CO}_{(g)}$<br><br>The experimentally determined rate law for this reaction is:<br><br>$\\text{Rate} = k[\\text{CH}_3\\text{CHO}]^{1.5}$<br><br>Thus, the overall order of the reaction is $1.5$.<br><br>For the other reactions:<br>$\\text{H}_{2(g)} + \\text{I}_{2(g)} \\longrightarrow 2\\text{HI}_{(g)}$ follows second-order kinetics.<br>$2\\text{H}_2\\text{O}_{2(g)} \\longrightarrow 2\\text{H}_2\\text{O}_{(\\ell)} + \\text{O}_{2(g)}$ follows first-order kinetics.<br>$2\\text{NO}_{(g)} + 2\\text{H}_{2(g)} \\longrightarrow \\text{N}_{2(g)} + 2\\text{H}_2\\text{O}_{(\\ell)}$ follows third-order kinetics.<br><br>Answer: $\\text{CH}_3\\text{CHO}_{(g)} \\longrightarrow \\text{CH}_{4(g)} + \\text{CO}_{(g)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3468c30a4553e1be200", "type": "singleCorrect", "question": {"text": "For the reaction $2\\text{NOBr}_{(g)} \\rightarrow 2\\text{NO}_{(g)} + \\text{Br}_{2(g)}$ rate law is $r = k[\\text{NOBr}]^2$, if rate constant is $1 \\cdot 62 \\text{ mol dm}^{-3}\\text{ s}^{-1}$ and concentration of NOBr is $2 \\times 10^{-3} \\text{ mol L}^{-1}$. What is the rate of reaction ?", "image": null}, "options": [{"id": "1OGc3", "label": "A", "text": "$4 \\cdot 05 \\times 10^{-5} \\text{ mol dm}^{-3}\\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "DLn5h", "label": "B", "text": "$6 \\cdot 48 \\times 10^{-6} \\text{ mol dm}^{-3}\\text{s}^{-1}$", "isCorrect": true, "image": null}, {"id": "NrNXg", "label": "C", "text": "$2 \\cdot 12 \\times 10^{-5} \\text{ mol dm}^{-3}\\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "wzHul", "label": "D", "text": "$8 \\cdot 63 \\times 10^{-6} \\text{ mol dm}^{-3}\\text{s}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given rate law is $r = k[\\text{NOBr}]^2$<br><br>Substituting the given values:<br><br>$k = 1.62$<br><br>$[\\text{NOBr}] = 2 \\times 10^{-3} \\text{ mol L}^{-1} = 2 \\times 10^{-3} \\text{ mol dm}^{-3}$<br><br>$r = 1.62 \\times (2 \\times 10^{-3})^2$<br><br>$r = 1.62 \\times 4 \\times 10^{-6}$<br><br>$r = 6.48 \\times 10^{-6} \\text{ mol dm}^{-3}\\text{s}^{-1}$<br><br>Answer: $6 \\cdot 48 \\times 10^{-6} \\text{ mol dm}^{-3}\\text{s}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3428c30a4553e1be1de", "type": "singleCorrect", "question": {"text": "Which of the following is an example of second order reaction ?", "image": null}, "options": [{"id": "rmNa9", "label": "A", "text": "$2\\,\\text{H}_2\\text{O}_{2(l)} \\rightarrow 2\\text{H}_2\\text{O}_{(l)} + \\text{O}_{2(g)}$", "isCorrect": false, "image": null}, {"id": "LSWAw", "label": "B", "text": "$\\text{CH}_3\\text{CHO}_{(g)} \\rightarrow \\text{CH}_{4(g)} + \\text{CO}_{(g)}$", "isCorrect": false, "image": null}, {"id": "fdTdW", "label": "C", "text": "$2\\,\\text{NO}_{2(g)} + \\text{F}_{2(g)} \\rightarrow 2\\text{NO}_2\\text{F}_{(g)}$", "isCorrect": true, "image": null}, {"id": "BweV0", "label": "D", "text": "$2\\,\\text{NO}_{(g)} + 2\\text{H}_{2(g)} \\rightarrow \\text{N}_{2(g)} + 2\\text{H}_2\\text{O}_{(l)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The order of a reaction is determined experimentally by its rate law.<br><br>For the decomposition of hydrogen peroxide, the rate law is Rate = $k[\\text{H}_2\\text{O}_2]$. It is a first-order reaction.<br><br>For the thermal decomposition of acetaldehyde, the rate law is Rate = $k[\\text{CH}_3\\text{CHO}]^{1.5}$. It is a fractional-order (1.5) reaction.<br><br>For the reaction between $\\text{NO}_2$ and $\\text{F}_2$, the mechanism involves a slow rate-determining step: $\\text{NO}_2 + \\text{F}_2 \\rightarrow \\text{NO}_2\\text{F} + \\text{F}$. The rate law is Rate = $k[\\text{NO}_2][\\text{F}_2]$. The overall order is $1 + 1 = 2$, making it a second-order reaction.<br><br>For the reaction between $\\text{NO}$ and $\\text{H}_2$, the rate law is Rate = $k[\\text{NO}]^2[\\text{H}_2]$. The overall order is $2 + 1 = 3$, making it a third-order reaction.<br><br>Thus, $2\\,\\text{NO}_{2(g)} + \\text{F}_{2(g)} \\rightarrow 2\\text{NO}_2\\text{F}_{(g)}$ is the correct example of a second-order reaction.<br><br>Answer: $2\\,\\text{NO}_{2(g)} + \\text{F}_{2(g)} \\rightarrow 2\\text{NO}_2\\text{F}_{(g)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d48c30a4553e1bdd44", "type": "singleCorrect", "question": {"text": "The rate law for the reaction $A + B \\rightarrow P$ is found to be rate $= k[A]^2[B]$.<br>The rate constant of the reaction at 300 K is $6.0\\ \\text{M}^{-2}\\text{s}^{-1}$. Calculate the rate of the reaction when $[A] = 1\\ \\text{M}$ and $[B] = 0.2\\ \\text{M}$", "image": null}, "options": [{"id": "2G0yV", "label": "A", "text": "$0.6\\ \\text{M s}^{-1}$.", "isCorrect": false, "image": null}, {"id": "x63HL", "label": "B", "text": "$1.2\\ \\text{M s}^{-1}$.", "isCorrect": true, "image": null}, {"id": "K5JHd", "label": "C", "text": "$1.8\\ \\text{M s}^{-1}$.", "isCorrect": false, "image": null}, {"id": "gsZPn", "label": "D", "text": "$2.4\\ \\text{M s}^{-1}$.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given rate law is $\\text{Rate} = k[A]^2[B]$.<br><br>Substituting the given values:<br><br>$\\text{Rate} = 6.0 \\times (1)^2 \\times 0.2$<br><br>$\\text{Rate} = 1.2\\ \\text{M s}^{-1}$<br><br>Answer: $1.2\\ \\text{M s}^{-1}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3368c30a4553e1be15d", "type": "singleCorrect", "question": {"text": "The rate constant for the reaction $2\\text{N}_2\\text{O}_5 \\rightarrow 4\\text{NO}_2 + \\text{O}_2$ is $3.0 \\times 10^{-5}\\ \\text{s}^{-1}$. If the rate is $2.4 \\times 10^{-5}\\ \\text{mole L}^{-1}\\ \\text{s}^{-1}$ then the concentration of $\\text{N}_2\\text{O}_5\\,(\\text{mol L}^{-1})$ is", "image": null}, "options": [{"id": "BKulO", "label": "A", "text": "$1.4$", "isCorrect": false, "image": null}, {"id": "yeWVT", "label": "B", "text": "$1.2$", "isCorrect": false, "image": null}, {"id": "8u3gh", "label": "C", "text": "$0.04$", "isCorrect": false, "image": null}, {"id": "3878w", "label": "D", "text": "$0.8$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "From the unit of the rate constant ($\\text{s}^{-1}$), we can determine that the given reaction is a first-order reaction.<br><br>For a first-order reaction, the rate law is expressed as:<br>$\\text{Rate} = k[\\text{N}_2\\text{O}_5]$<br><br>Given values are:<br>$\\text{Rate} = 2.4 \\times 10^{-5} \\text{ mole L}^{-1} \\text{s}^{-1}$<br>$k = 3.0 \\times 10^{-5} \\text{ s}^{-1}$<br><br>Substituting these values into the rate equation:<br>$2.4 \\times 10^{-5} = 3.0 \\times 10^{-5} \\times [\\text{N}_2\\text{O}_5]$<br><br>Solving for the concentration of $\\text{N}_2\\text{O}_5$:<br>$[\\text{N}_2\\text{O}_5] = \\dfrac{2.4 \\times 10^{-5}}{3.0 \\times 10^{-5}}$<br><br>$[\\text{N}_2\\text{O}_5] = \\dfrac{2.4}{3.0}$<br><br>$[\\text{N}_2\\text{O}_5] = 0.8 \\text{ mol L}^{-1}$<br><br>Answer: $0.8$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e28c30a4553e1bddda", "type": "singleCorrect", "question": {"text": "The rate of reaction $\\text{A} + \\text{B} \\rightarrow \\text{P}$ is $4 \\times 10^{-2}\\ \\text{mol dm}^{-3}\\ \\text{s}^{-1}$<br>When $[A] = 0.2\\ \\text{mole dm}^{-3}$ and $[B] = 0.1\\ \\text{mole dm}^{-3}$, What is the rate constant of reaction, if it is first order with respect to A and second order with respect to B ?", "image": null}, "options": [{"id": "2D71H", "label": "A", "text": "$10\\ \\text{mol}^{-2}\\text{dm}^6\\ \\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "7rcth", "label": "B", "text": "$20\\ \\text{mol}^{-2}\\text{dm}^6\\ \\text{s}^{-1}$", "isCorrect": true, "image": null}, {"id": "TgJxh", "label": "C", "text": "$25\\ \\text{mol}^{-2}\\text{dm}^6\\ \\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "HKq1Y", "label": "D", "text": "$40\\ \\text{mol}^{-2}\\text{dm}^6\\ \\text{s}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The rate law for the given reaction is:<br><br>$\\text{Rate} = k[A]^1[B]^2$<br><br>Substituting the given values into the rate law equation:<br><br>$4 \\times 10^{-2} = k(0.2)(0.1)^2$<br><br>$4 \\times 10^{-2} = k(0.2)(0.01)$<br><br>$4 \\times 10^{-2} = k(2 \\times 10^{-3})$<br><br>$k = \\dfrac{4 \\times 10^{-2}}{2 \\times 10^{-3}}$<br><br>$k = 20\\ \\text{mol}^{-2}\\text{dm}^6\\ \\text{s}^{-1}$<br><br>Answer: $20\\ \\text{mol}^{-2}\\text{dm}^6\\ \\text{s}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31a8c30a4553e1be031", "type": "singleCorrect", "question": {"text": "The rate of the reaction $2A + 3B \\rightarrow 2C + D$ is $6 \\times 10^{-4} \\text{ mol dm}^{-3}\\text{ s}^{-1}$, when $[A] = [B] = 0.3 \\text{ mol dm}^{-3}$. If the reaction is of first order for A and zeroth order for B, then find the rate constant.", "image": null}, "options": [{"id": "DW4i7", "label": "A", "text": "$1 \\times 10^{-3}\\text{ s}^{-1}$", "isCorrect": false, "image": null}, {"id": "6cUec", "label": "B", "text": "$2 \\times 10^{-3}\\text{ s}^{-1}$", "isCorrect": true, "image": null}, {"id": "dcsCp", "label": "C", "text": "$3 \\times 10^{-3}\\text{ s}^{-1}$", "isCorrect": false, "image": null}, {"id": "Ieg90", "label": "D", "text": "$4 \\times 10^{-3}\\text{ s}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The rate law for the given reaction is written as:<br><br>$\\text{Rate} = k[A]^1[B]^0$<br><br>Substituting the given values into the rate law equation:<br><br>$6 \\times 10^{-4} = k(0.3)^1(0.3)^0$<br><br>$6 \\times 10^{-4} = k \\times 0.3$<br><br>$k = \\dfrac{6 \\times 10^{-4}}{0.3}$<br><br>$k = 2 \\times 10^{-3} \\text{ s}^{-1}$<br><br>Answer: $2 \\times 10^{-3}\\text{ s}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29c8c30a4553e1bdaea", "type": "singleCorrect", "question": {"text": "The rate constant of a reaction is $k = 3.28 \\times 10^{-4}$ s$^{-1}$. Find the order of the reaction.", "image": null}, "options": [{"id": "RjmQY", "label": "A", "text": "Zero order", "isCorrect": false, "image": null}, {"id": "PZsJG", "label": "B", "text": "First order", "isCorrect": true, "image": null}, {"id": "kPs2L", "label": "C", "text": "Second order", "isCorrect": false, "image": null}, {"id": "xX3Tv", "label": "D", "text": "Third order", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The unit of the rate constant $k$ for an $n$-th order reaction is given by (mol L$^{-1}$)$^{1-n}$ s$^{-1}$.<br><br>Given that the unit of the rate constant is s$^{-1}$, we can equate the powers of concentration:<br><br>$1 - n = 0$<br><br>$n = 1$<br><br>Therefore, the reaction is of the first order.<br><br>Answer: First order", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36f8c30a4553e1be3b6", "type": "singleCorrect", "question": {"text": "For the reaction, $A + B \\rightarrow P$, the rate law is rate $= k[A][B]^2$. The rate of reaction is $0.25 \\text{ Ms}^{-1}$ when $[A] = 1$ M, $[B] = 0.2$ M at $25^\\circ$C. Calculate the rate constant of the reaction at the same temperature.", "image": null}, "options": [{"id": "TF4V7", "label": "A", "text": "$6.25 \\text{ M}^{-2}\\text{s}^{-1}$", "isCorrect": true, "image": null}, {"id": "rlz7O", "label": "B", "text": "$6.0 \\text{ M}^{-2}\\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "6jZz8", "label": "C", "text": "$6.5 \\text{ M}^{-2}\\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "VXgVa", "label": "D", "text": "$6.75 \\text{ M}^{-2}\\text{s}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given rate law is $\\text{rate} = k[A][B]^2$.<br><br>Substituting the given values:<br><br>$0.25 = k(1)(0.2)^2$<br><br>$0.25 = k(0.04)$<br><br>$k = \\dfrac{0.25}{0.04} = 6.25 \\text{ M}^{-2}\\text{s}^{-1}$<br><br>Answer: $6.25 \\text{ M}^{-2}\\text{s}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36f8c30a4553e1be3b4", "type": "singleCorrect", "question": {"text": "Identify a type of order of reaction that its unit of rate constant is mol dm$^{-3}$s$^{-1}$ from the following.", "image": null}, "options": [{"id": "wkBEi", "label": "A", "text": "Zero-order reaction", "isCorrect": true, "image": null}, {"id": "OPVZk", "label": "B", "text": "First-order reaction", "isCorrect": false, "image": null}, {"id": "eAKe7", "label": "C", "text": "Second-order reaction", "isCorrect": false, "image": null}, {"id": "Lkhed", "label": "D", "text": "Third-order reaction", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The general formula for the unit of the rate constant $k$ for an $n$-th order reaction is given by $(\\text{concentration})^{1-n} \\text{time}^{-1}$.<br><br>Using the standard units of concentration as $\\text{mol dm}^{-3}$ and time as $\\text{s}$, the unit of $k$ becomes $(\\text{mol dm}^{-3})^{1-n} \\text{s}^{-1}$.<br><br>The given unit of the rate constant is $\\text{mol dm}^{-3}\\text{s}^{-1}$.<br><br>Comparing the powers of the concentration term, we get:<br><br>$1 - n = 1$<br><br>$n = 0$<br><br>Therefore, the reaction is a zero-order reaction.<br><br>Answer: Zero-order reaction", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3618c30a4553e1be31e", "type": "singleCorrect", "question": {"text": "What is the order of the following reaction ?<br>$2\\text{H}_2\\text{O}_2 (l) \\rightarrow 2\\text{H}_2\\text{O} (l) + \\text{O}_2 (g)$, if rate = $k [\\text{H}_2\\text{O}_2]$", "image": null}, "options": [{"id": "QyNs9", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "7g09I", "label": "B", "text": "$1$", "isCorrect": true, "image": null}, {"id": "mvn6B", "label": "C", "text": "$2$", "isCorrect": false, "image": null}, {"id": "jiWAA", "label": "D", "text": "$3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The rate law for the given reaction is provided as rate = $k [\\text{H}_2\\text{O}_2]$.<br><br>The order of a reaction is defined as the sum of the exponents of the concentration terms in the rate law expression.<br><br>In this rate law, the exponent of the concentration of $\\text{H}_2\\text{O}_2$ is $1$.<br><br>Therefore, the order of the reaction is $1$.<br><br>Answer: $1$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b88c30a4553e1bdc16", "type": "singleCorrect", "question": {"text": "Which of the following statements is NOT true about the rate constant?", "image": null}, "options": [{"id": "3u35n", "label": "A", "text": "It is proportionality constant in rate law that relates reaction rate to reactant concentrations.", "isCorrect": false, "image": null}, {"id": "ehSQN", "label": "B", "text": "It is independent of concentration of reactant.", "isCorrect": false, "image": null}, {"id": "IZyfy", "label": "C", "text": "It varies with temperature.", "isCorrect": false, "image": null}, {"id": "aQFpK", "label": "D", "text": "Greater the value of rate constant slower is the reaction.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "According to the rate law, the rate of a reaction is given by $\\text{Rate} = k[\\text{Reactants}]^{n}$.<br><br>Here, $k$ is the rate constant, which is a proportionality constant relating the reaction rate to the reactant concentrations.<br><br>The rate constant $k$ is independent of the initial concentration of the reactants but depends on the temperature as given by the Arrhenius equation $k = A e^{-E_a/RT}$.<br><br>From the rate law, it is evident that the rate of the reaction is directly proportional to the rate constant $k$. Therefore, a greater value of the rate constant implies a faster reaction, not a slower one.<br><br>Hence, the statement 'Greater the value of rate constant slower is the reaction' is incorrect.<br><br>Answer: Greater the value of rate constant slower is the reaction.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bfbbf9280d7f9932e3a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following statements is NOT correct regarding order of reaction?", "image": null}, "options": [{"id": "fB8j9", "text": "It is determined experimentally.", "image": null, "isCorrect": false}, {"id": "c3NoV", "text": "It is not influenced by stoichiometric coefficient of reactants.", "image": null, "isCorrect": false}, {"id": "bZStE", "text": "It is sum of power to the concentration terms of reactants in rate law equation.", "image": null, "isCorrect": false}, {"id": "GY6vB", "text": "It is always whole number.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The order of a reaction is an experimentally determined quantity.<br><br>It is defined as the sum of the powers of the concentration terms of the reactants in the experimentally determined rate law equation.<br><br>It is independent of the stoichiometric coefficients of the reactants in the balanced chemical equation.<br><br>The order of a reaction can be zero, a fraction, or an integer. Therefore, the statement that it is always a whole number is incorrect.<br><br>Answer: It is always whole number.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871befbf9280d7f9932dc6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The rate constant for the reaction, $2 \\mathrm{~N}_2 \\mathrm{O}_{5(\\mathrm{~g})} \\rightarrow 2 \\mathrm{~N}_2 \\mathrm{O}_{4(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})}$ is $4.98 \\times 10^{-4} \\mathrm{~s}^{-1}$. What is order of reaction?", "image": null}, "options": [{"id": "tzTBr", "text": "1", "image": null, "isCorrect": true}, {"id": "GrJWA", "text": "2", "image": null, "isCorrect": false}, {"id": "5piTs", "text": "0", "image": null, "isCorrect": false}, {"id": "tHmj2", "text": "3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The unit of the rate constant $k$ is $\\mathrm{s}^{-1}$.<br><br>The general unit for the rate constant of an $n$-th order reaction is $(\\mathrm{mol} \\mathrm{L}^{-1})^{1-n} \\mathrm{s}^{-1}$.<br><br>For $n = 1$, the unit is $(\\mathrm{mol} \\mathrm{L}^{-1})^{1-1} \\mathrm{s}^{-1} = \\mathrm{s}^{-1}$.<br><br>Since the given rate constant has the unit $\\mathrm{s}^{-1}$, the reaction is of first order.<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdebf9280d7f9932d23", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A complex reaction takes place in following steps.\n$\\begin{aligned}\n& \\mathrm{NO}_2 \\mathrm{Cl}_{(\\mathrm{g})} \\longrightarrow \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{Cl}_{(\\mathrm{g})} \\text { (slow) } \\\\\n& \\mathrm{NO}_2 \\mathrm{Cl}_{(\\mathrm{g})}+\\mathrm{Cl}_{(\\mathrm{g})} \\longrightarrow \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{Cl}_{2(\\mathrm{~g})} \\text { (fast) }\n\\end{aligned}$\n\nIdentify rate law equation for this reaction.", "image": null}, "options": [{"id": "3PyzD", "text": "$\\mathrm{r}=\\mathrm{k}\\left[\\mathrm{NO}_2 \\mathrm{Cl}\\right]$", "image": null, "isCorrect": true}, {"id": "B3PnA", "text": "$\\mathrm{r}=\\mathrm{k}\\left[\\mathrm{NO}_2\\right][\\mathrm{Cl}]$", "image": null, "isCorrect": false}, {"id": "3G29q", "text": "$\\mathrm{r}=\\mathrm{k}\\left[\\mathrm{NO}_2\\right]^2$", "image": null, "isCorrect": false}, {"id": "Jo0mR", "text": "$\\mathrm{r}=\\mathrm{k}\\left[\\mathrm{NO}_2 \\mathrm{Cl}\\right]^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate of a complex reaction is determined by the slowest step in its mechanism, known as the rate-determining step.<br><br>The given slow step is:<br>$\\mathrm{NO}_2\\mathrm{Cl}_{(\\mathrm{g})} \\longrightarrow \\mathrm{NO}_{2(\\mathrm{g})} + \\mathrm{Cl}_{(\\mathrm{g})}$<br><br>The rate law equation is written based on the concentration of the reactants in the slow step.<br><br>Therefore, the rate law equation is:<br>$\\mathrm{r} = \\mathrm{k}[\\mathrm{NO}_2\\mathrm{Cl}]$<br><br>Answer: $\\mathrm{r}=\\mathrm{k}\\left[\\mathrm{NO}_2 \\mathrm{Cl}\\right]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcdbf9280d7f9932c8b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Rate of the reaction $\\mathrm{A}+\\mathrm{B} \\rightarrow$ product is $3.6 \\times 10^{-2} \\mathrm{~mol~} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$ and rate law is $\\mathrm{r}=\\mathrm{k}[\\mathrm{A}][\\mathrm{B}]^2$. What is rate constant of the reaction if $[\\mathrm{A}]=0.2 \\mathrm{M}$ and $[\\mathrm{B}]=0.1 \\mathrm{M}$ ?", "image": null}, "options": [{"id": "t6kcg", "text": "$10 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "OCdk5", "text": "$18 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "xo3yE", "text": "$24 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "XFQ9M", "text": "$4.8 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given rate law is $r = k[\\mathrm{A}][\\mathrm{B}]^2$<br><br>Substituting the given values:<br><br>$3.6 \\times 10^{-2} = k \\times (0.2) \\times (0.1)^2$<br><br>$3.6 \\times 10^{-2} = k \\times 0.2 \\times 0.01$<br><br>$3.6 \\times 10^{-2} = k \\times 2 \\times 10^{-3}$<br><br>$k = \\dfrac{3.6 \\times 10^{-2}}{2 \\times 10^{-3}}$<br><br>$k = 1.8 \\times 10 = 18 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$<br><br>Answer: $18 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcbbf9280d7f9932c7d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the order of following elementary reaction?\n$2 \\mathrm{NO}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{NO}_{(\\mathrm{g})}+\\mathrm{O}_{2(\\mathrm{~g})}$", "image": null}, "options": [{"id": "vPwtb", "text": "1", "image": null, "isCorrect": false}, {"id": "juIvM", "text": "1.5", "image": null, "isCorrect": false}, {"id": "bWgvU", "text": "2", "image": null, "isCorrect": true}, {"id": "caJPs", "text": "3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For an elementary reaction, the order of the reaction is equal to the sum of the stoichiometric coefficients of the reactants.<br><br>The given elementary reaction is $2 \\mathrm{NO}_{2(\\mathrm{g})} \\longrightarrow 2 \\mathrm{NO}_{(\\mathrm{g})} + \\mathrm{O}_{2(\\mathrm{g})}$.<br><br>The stoichiometric coefficient of the reactant $\\mathrm{NO}_{2}$ is $2$.<br><br>Therefore, the rate law is given by $\\text{Rate} = k[\\mathrm{NO}_{2}]^{2}$.<br><br>The order of the reaction is $2$.<br><br>Answer: 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbcbf9280d7f9932bfa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is an example of second order reaction?", "image": null}, "options": [{"id": "y7YVU", "text": "$2 \\mathrm{H}_2 \\mathrm{O}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{H}_2 \\mathrm{O}_{(\\ell)}+\\mathrm{O}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "nsOYZ", "text": "$\\mathrm{H}_{2(\\mathrm{~g})}+\\mathrm{I}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{HI}_{(\\mathrm{g})}$", "image": null, "isCorrect": true}, {"id": "WiWsg", "text": "$\\mathrm{CH}_3 \\mathrm{CHO}_{(\\mathrm{g})} \\longrightarrow \\mathrm{CH}_{4(\\mathrm{~g})}+\\mathrm{CO}_{(\\mathrm{g})}$", "image": null, "isCorrect": false}, {"id": "vszoU", "text": "$2 \\mathrm{NO}_{(\\mathrm{g})}+2 \\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{N}_{2(\\mathrm{~g})}+2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The decomposition of hydrogen peroxide is a first-order reaction.<br><br>The reaction between hydrogen and iodine to form hydrogen iodide is a second-order reaction. The rate law is given by $\\text{Rate} = k[\\mathrm{H}_2][\\mathrm{I}_2]$.<br><br>The decomposition of acetaldehyde is a fractional-order reaction (order $= 1.5$).<br><br>The reaction between nitric oxide and hydrogen is a third-order reaction. The rate law is given by $\\text{Rate} = k[\\mathrm{NO}]^2[\\mathrm{H}_2]$.<br><br>Thus, $\\mathrm{H}_{2(\\mathrm{g})} + \\mathrm{I}_{2(\\mathrm{g})} \\longrightarrow 2 \\mathrm{HI}_{(\\mathrm{g})}$ is an example of a second-order reaction.<br><br>Answer: $\\mathrm{H}_{2(\\mathrm{~g})}+\\mathrm{I}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{HI}_{(\\mathrm{g})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871babbf9280d7f9932b6b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $r=k[A]^2[B]$ is rate law equation for reaction $A+B \\rightarrow C$, at $[A]=1 \\mathrm{M}$ and $[B]=0.2 \\mathrm{M}$, Calculate rate of reaction if rate constant is $6.25 \\mathrm{M}^{-2} \\mathrm{~s}^{-1}$", "image": null}, "options": [{"id": "SCCsr", "text": "$1.25 \\mathrm{~mol}$ $\\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "I1zG8", "text": "$3.40 \\mathrm{~mol}$ $\\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "74kWe", "text": "$5.88 \\mathrm{~mol}$ $\\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "LdzaD", "text": "$8.58 \\mathrm{~mol}$ $\\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate law equation is given by $r = k[A]^2[B]$.<br><br>Given values are:<br>$k = 6.25 \\mathrm{M}^{-2} \\mathrm{s}^{-1}$<br>$[A] = 1 \\mathrm{M}$<br>$[B] = 0.2 \\mathrm{M}$<br><br>Substituting these values into the rate law equation:<br>$r = 6.25 \\times (1)^2 \\times 0.2$<br><br>$r = 6.25 \\times 1 \\times 0.2$<br><br>$r = 1.25 \\mathrm{M} \\mathrm{s}^{-1}$<br><br>Since $1 \\mathrm{M} = 1 \\mathrm{mol} \\mathrm{dm}^{-3}$, the rate of reaction is $1.25 \\mathrm{mol} \\mathrm{dm}^{-3} \\mathrm{s}^{-1}$.<br><br>Answer: $1.25 \\mathrm{~mol}$ $\\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871baabf9280d7f9932b63", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For a reaction $\\mathrm{A} \\rightarrow$ Product, rate constant is $6.93 \\times 10^{-3}$ hour $^{-1}$. What is order of reaction?", "image": null}, "options": [{"id": "a5LT4", "text": "Zero", "image": null, "isCorrect": false}, {"id": "PGXEa", "text": "1", "image": null, "isCorrect": true}, {"id": "zBr5p", "text": "1.5", "image": null, "isCorrect": false}, {"id": "KB0fy", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The unit of the rate constant $k$ for an $n$-th order reaction is given by $(\\text{mol L}^{-1})^{1-n} \\text{time}^{-1}$.<br><br>Given the rate constant $k = 6.93 \\times 10^{-3} \\text{ hour}^{-1}$, the unit is $\\text{time}^{-1}$.<br><br>Equating the units, we get $(\\text{mol L}^{-1})^{1-n} = 1$, which implies $1 - n = 0 \\Rightarrow n = 1$.<br><br>Thus, the reaction is a first-order reaction.<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09
