:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9bbf9280d7f9932acd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Rate of reaction is $r_1=k[A]^a[B]^b$. If the concentration of $A$ is doubled and $B$ is halved the new rate is $r_2$, What is the value of $\\frac{r_2}{r_1}$ ?", "image": null}, "options": [{"id": "2zbhn", "text": "$a-b$", "image": null, "isCorrect": false}, {"id": "tZNNi", "text": "$a+b$", "image": null, "isCorrect": false}, {"id": "UX9ng", "text": "$2^{(a-b)}$", "image": null, "isCorrect": true}, {"id": "bTqb7", "text": "$\\frac{1}{2}(a+b)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The initial rate of reaction is given by:<br><br>$r_1 = k[A]^a[B]^b$<br><br>When the concentration of $A$ is doubled and $B$ is halved, the new concentrations become $[A]' = 2[A]$ and $[B]' = \\dfrac{[B]}{2}$.<br><br>The new rate of reaction is:<br><br>$r_2 = k[A]'^a[B]'^b$<br><br>Substituting the new concentrations, we get:<br><br>$r_2 = k(2[A])^a\\left(\\dfrac{[B]}{2}\\right)^b$<br><br>$r_2 = k \\cdot 2^a[A]^a \\cdot 2^{-b}[B]^b$<br><br>$r_2 = 2^{a-b} \\cdot k[A]^a[B]^b$<br><br>Since $r_1 = k[A]^a[B]^b$, we can write:<br><br>$r_2 = 2^{a-b} \\cdot r_1$<br><br>Therefore, the ratio is:<br><br>$\\dfrac{r_2}{r_1} = 2^{a-b}$<br><br>Answer: $2^{(a-b)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b98bf9280d7f9932ab8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Rate law for the reaction,\n$\\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{CO}_{(\\mathrm{g})} \\rightarrow \\mathrm{NO}_{(\\mathrm{g})}+\\mathrm{CO}_{2(\\mathrm{~g})}$ is as $\\mathrm{R}=\\mathrm{k}\\left[\\mathrm{NO}_2\\right]^2$\nWhat is the order of reaction w.r.t. CO ?", "image": null}, "options": [{"id": "lJVL3", "text": "Zero", "image": null, "isCorrect": true}, {"id": "AfxDW", "text": "$1$", "image": null, "isCorrect": false}, {"id": "3oaoQ", "text": "$1.5$", "image": null, "isCorrect": false}, {"id": "S16ZR", "text": "$2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given rate law for the reaction is $\\mathrm{R}=\\mathrm{k}\\left[\\mathrm{NO}_2\\right]^2$.<br><br>This can be written as $\\mathrm{R}=\\mathrm{k}\\left[\\mathrm{NO}_2\\right]^2[\\mathrm{CO}]^0$.<br><br>The order of reaction with respect to a reactant is the power to which its concentration term is raised in the rate law equation.<br><br>Since the concentration of $\\mathrm{CO}$ does not appear in the rate law, its power is zero.<br><br>Therefore, the order of reaction with respect to $\\mathrm{CO}$ is zero.<br><br>Answer: Zero", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7cbf9280d7f99329b1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For a reaction, $\\mathrm{A}+\\mathrm{B} \\longrightarrow$ product, it is found that rate law is $\\mathrm{r}=\\mathrm{k}[\\mathrm{A}]^{1.5}[\\mathrm{~B}]^{2.5}$. What is the order of reaction?", "image": null}, "options": [{"id": "rJTOx", "text": "$1.5$", "image": null, "isCorrect": false}, {"id": "194Nx", "text": "$2.5$", "image": null, "isCorrect": false}, {"id": "RYkhz", "text": "$+1$", "image": null, "isCorrect": false}, {"id": "VHSc8", "text": "$4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The rate law for the reaction is given as $r = k[A]^{1.5}[B]^{2.5}$.<br><br>The overall order of a reaction is the sum of the exponents of the concentration terms in the rate law expression.<br><br>Order of reaction $= 1.5 + 2.5 = 4$.<br><br>Answer: $4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6abf9280d7f9932905", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Rate law for the reaction $\\mathrm{aA}+\\mathrm{bB} \\rightarrow \\mathrm{cC}+\\mathrm{dD}$ is $\\mathrm{r}=\\mathrm{k}[\\mathrm{A}][\\mathrm{B}]$, the rate of reaction doubles if", "image": null}, "options": [{"id": "MtXZU", "text": "Concentration of both $A$ and $B$ are doubled.", "image": null, "isCorrect": false}, {"id": "i5uXZ", "text": "Concentration of $A$ is doubled and concentration of $B$ is kept constant.", "image": null, "isCorrect": true}, {"id": "sY7Yk", "text": "Concentration of $B$ is doubled and concentration of $A$ is halved.", "image": null, "isCorrect": false}, {"id": "A8gGz", "text": "Concentration of A is kept constant and concentration of B is halved.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given the rate law $r = k[A][B]$.<br><br>Let the initial rate be $r_1 = k[A][B]$.<br><br>Checking the given options:<br><br>If the concentration of both A and B are doubled, $r_2 = k(2[A])(2[B]) = 4k[A][B] = 4r_1$.<br><br>If the concentration of A is doubled and the concentration of B is kept constant, $r_2 = k(2[A])[B] = 2k[A][B] = 2r_1$.<br><br>If the concentration of B is doubled and the concentration of A is halved, $r_2 = k\\left(\\dfrac{[A]}{2}\\right)(2[B]) = k[A][B] = r_1$.<br><br>If the concentration of A is kept constant and the concentration of B is halved, $r_2 = k[A]\\left(\\dfrac{[B]}{2}\\right) = \\dfrac{1}{2}k[A][B] = \\dfrac{r_1}{2}$.<br><br>Thus, the rate of reaction doubles when the concentration of A is doubled and the concentration of B is kept constant.<br><br>Answer: Concentration of $A$ is doubled and concentration of $B$ is kept constant.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b57bf9280d7f9932865", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Rate law for the reaction $\\mathrm{aA}+\\mathrm{bB} \\rightarrow \\mathrm{cC}+\\mathrm{dD}$ is $\\mathrm{r}=\\mathrm{k}[\\mathrm{A}][\\mathrm{B}]$. Which from following conditions does NOT affect the rate of reaction?", "image": null}, "options": [{"id": "7hLDv", "text": "Concentration of $A$ is doubled and concentration of $B$ is kept constant.", "image": null, "isCorrect": false}, {"id": "KsKDQ", "text": "Concentration of $B$ is doubled and concentration of $A$ is kept constant.", "image": null, "isCorrect": false}, {"id": "lRTt3", "text": "Concentration of $B$ is doubled and concentration of $A$ is halved.", "image": null, "isCorrect": true}, {"id": "QI58i", "text": "Concentration of $A$ is kept constant and concentration of $B$ is halved.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given rate law is $r = k[A][B]$.<br><br>Let the initial rate be $r_{1} = k[A][B]$.<br><br>When the concentration of $B$ is doubled and the concentration of $A$ is halved, the new rate $r_{2}$ becomes:<br><br>$r_{2} = k \\left(\\dfrac{[A]}{2}\\right) (2[B])$<br><br>$r_{2} = k[A][B] = r_{1}$<br><br>Since $r_{2} = r_{1}$, the rate of the reaction remains unchanged. In all other given conditions, the rate of the reaction changes.<br><br>Answer: Concentration of $B$ is doubled and concentration of $A$ is halved.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b47bf9280d7f99327ce", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the order and molecularity respectively for the elementary reaction given below?\n$\\mathrm{O}_{3(\\mathrm{~g})+} \\mathrm{O}_{(\\mathrm{g})} \\rightarrow 2 \\mathrm{O}_{2(\\mathrm{~g})}$ if $\\mathrm{r}=\\mathrm{k}\\left[\\mathrm{O}_3\\right][\\mathrm{O}]$", "image": null}, "options": [{"id": "rHQGy", "text": "$2^{\\text {nd }}$ and 1", "image": null, "isCorrect": false}, {"id": "FlSQv", "text": "$1^{\\text {st }}$ and 2", "image": null, "isCorrect": false}, {"id": "FIsEa", "text": "$2^{\\text {nd }}$ and 2", "image": null, "isCorrect": true}, {"id": "KHsX2", "text": "$1^{\\text {st }}$ and 1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is an elementary reaction: $\\mathrm{O}_{3(\\mathrm{g})} + \\mathrm{O}_{(\\mathrm{g})} \\rightarrow 2\\mathrm{O}_{2(\\mathrm{g})}$<br><br>The rate law is given as $r = k[\\mathrm{O}_3][\\mathrm{O}]$.<br><br>The order of a reaction is the sum of the powers of the concentration terms in the rate law equation.<br><br>Order $= 1 + 1 = 2$<br><br>The molecularity of an elementary reaction is the number of reactant particles taking part in the reaction.<br><br>Since one molecule of $\\mathrm{O}_3$ and one atom of $\\mathrm{O}$ react, the molecularity is $1 + 1 = 2$.<br><br>Thus, the order is $2$ and the molecularity is $2$.<br><br>Answer: $2^{\\text {nd }}$ and 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3abf9280d7f9932747", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is order and molecularity of following reaction?\n$\\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{NO}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{NO}_{(\\mathrm{g})}+\\mathrm{O}_{2(\\mathrm{~g})}$", "image": null}, "options": [{"id": "Uazmp", "text": "order 1, molecularity 2", "image": null, "isCorrect": false}, {"id": "UHYKN", "text": "order 2, molecularity 2", "image": null, "isCorrect": true}, {"id": "d9vrC", "text": "order 2, molecularity 3", "image": null, "isCorrect": false}, {"id": "FHGkF", "text": "order zero, molecularity 2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is $2\\mathrm{NO}_{2(\\mathrm{g})} \\longrightarrow 2\\mathrm{NO}_{(\\mathrm{g})} + \\mathrm{O}_{2(\\mathrm{g})}$.<br><br>The rate law for this reaction is experimentally determined as $\\text{Rate} = k[\\mathrm{NO}_2]^2$.<br><br>Thus, the order of the reaction with respect to $\\mathrm{NO}_2$ is $2$, making the overall order $2$.<br><br>Since two molecules of $\\mathrm{NO}_2$ participate as reactants in the elementary step, the molecularity of the reaction is also $2$.<br><br>Answer: order 2, molecularity 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b38bf9280d7f9932739", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If concentration of reactant ' A ' is increased by 10 times, rate of reaction increases 100 times. What is order of reaction if rate law is $\\mathrm{r}=\\mathrm{k}[\\mathrm{A}]^x$", "image": null}, "options": [{"id": "VDr39", "text": "$1$", "image": null, "isCorrect": false}, {"id": "Psqqz", "text": "$1.5$", "image": null, "isCorrect": false}, {"id": "66USQ", "text": "$2$", "image": null, "isCorrect": true}, {"id": "sYRFZ", "text": "$3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The initial rate of reaction is given by:<br><br>$r_1 = k[A]^x$<br><br>When the concentration of A is increased by $10$ times, the new rate becomes:<br><br>$r_2 = k(10[A])^x$<br><br>$r_2 = 10^x k[A]^x$<br><br>$r_2 = 10^x r_1$<br><br>It is given that the rate increases $100$ times, so $r_2 = 100 r_1$. Substituting this into the equation:<br><br>$100 r_1 = 10^x r_1$<br><br>$10^x = 100$<br><br>$10^x = 10^2$<br><br>$x = 2$<br><br>The order of the reaction is $2$.<br><br>Answer: $2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b27bf9280d7f99326be", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The rate constant for the reaction, $2 \\mathrm{~N}_2 \\mathrm{O}_{5(g)} \\longrightarrow 2 \\mathrm{~N}_2 \\mathrm{O}_{4(g)}+\\mathrm{O}_{2(g)}$ is $4.98 \\times 10^{-4} \\mathrm{~s}^{-1}$. What is the order of reaction?", "image": null}, "options": [{"id": "21uIG", "text": "$2$", "image": null, "isCorrect": false}, {"id": "fliaQ", "text": "$1$", "image": null, "isCorrect": true}, {"id": "k2OlZ", "text": "Zero", "image": null, "isCorrect": false}, {"id": "vRjCP", "text": "$3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The unit of the rate constant for an $n$-th order reaction is given by $(\\text{mol L}^{-1})^{1-n} \\text{s}^{-1}$.<br><br>Given that the rate constant is $4.98 \\times 10^{-4} \\text{ s}^{-1}$, the unit is $\\text{s}^{-1}$.<br><br>Equating the units, we get $(\\text{mol L}^{-1})^{1-n} \\text{s}^{-1} = \\text{s}^{-1}$.<br><br>This implies $1 - n = 0$, which gives $n = 1$.<br><br>Thus, the reaction is of the first order.<br><br>Answer: $1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b17bf9280d7f9932633", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Rate law for the reaction,\n$\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{I}_{(\\mathrm{g})} \\rightarrow \\mathrm{C}_2 \\mathrm{H}_{4(\\mathrm{~g})}+\\mathrm{HI}_{(\\mathrm{g})} \\text { is } \\mathrm{r}=\\mathrm{k}\\left[\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{I}\\right]$\n\nWhat is the order and molecularity of this reaction?", "image": null}, "options": [{"id": "5jdoD", "text": "order and molecularity both are 1", "image": null, "isCorrect": true}, {"id": "5o8ds", "text": "order is 1 and molecularity is 2", "image": null, "isCorrect": false}, {"id": "xwcrN", "text": "order and molecularity both are 2", "image": null, "isCorrect": false}, {"id": "ldNSz", "text": "order is 2 and molecularity is 1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given rate law is $r = k[\\mathrm{C}_2\\mathrm{H}_5\\mathrm{I}]$.<br><br>The order of a reaction is the sum of the powers of the concentration terms in the rate law. Since the power of $[\\mathrm{C}_2\\mathrm{H}_5\\mathrm{I}]$ is $1$, the order of the reaction is $1$.<br><br>Molecularity is the number of reactant molecules taking part in an elementary reaction. In the given reaction, only one molecule of $\\mathrm{C}_2\\mathrm{H}_5\\mathrm{I}$ is involved as the reactant. Therefore, the molecularity of the reaction is $1$.<br><br>Hence, both the order and molecularity of the reaction are $1$.<br><br>Answer: order and molecularity both are 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792144a0aee93fa0796df78", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "For the reaction,\r\n$\\mathrm{H}_{2(\\mathrm{~g})}+\\mathrm{Br}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{HBr}_{(\\mathrm{g})}, \\mathrm{r}=\\mathrm{k}\\left[\\mathrm{H}_2\\right]\\left[\\mathrm{Br}_2\\right]^{\\frac{1}{2}}$\r\nWhat is the molecularity and order of reaction respectively?", "image": null}, "options": [{"id": "e8Scb", "text": "Monomolecular and $\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "dOKH8", "text": "Monomolecular and 1", "image": null, "isCorrect": false}, {"id": "4itfi", "text": "Monomolecular and $\\frac{3}{2}$", "image": null, "isCorrect": false}, {"id": "7Nm9q", "text": "Bimolecular and $\\frac{3}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The molecularity of a reaction is the number of reactant molecules taking part in the balanced chemical equation.<br><br>For the given reaction, $\\mathrm{H}_{2(\\mathrm{g})} + \\mathrm{Br}_{2(\\mathrm{g})} \\longrightarrow 2 \\mathrm{HBr}_{(\\mathrm{g})}$, there is one molecule of $\\mathrm{H}_2$ and one molecule of $\\mathrm{Br}_2$.<br><br>Molecularity = $1 + 1 = 2$ (Bimolecular).<br><br>The order of a reaction is the sum of the powers of the concentration terms in the experimentally determined rate law.<br><br>Given rate law: $\\mathrm{r} = \\mathrm{k}[\\mathrm{H}_2][\\mathrm{Br}_2]^{\\dfrac{1}{2}}$<br><br>Order = $1 + \\dfrac{1}{2} = \\dfrac{3}{2}$<br><br>Thus, the reaction is bimolecular and its order is $\\dfrac{3}{2}$.<br><br>Answer: Bimolecular and $\\frac{3}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214340aee93fa0796decf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Rate of reaction, $\\mathrm{A}+\\mathrm{B} \\rightarrow$ product, is $7.2 \\times 10^{-2} \\mathrm{moldm}^{-3} \\mathrm{~s}^{-1}$ at $[\\mathrm{A}]=0.4 \\mathrm{~mol} \\mathrm{dm}^{-3}$ and $[B]=0.1 \\mathrm{~mol} \\mathrm{dm}^{-3}$. The reaction is first order in A and second order in B. Calculate rate constant.", "image": null}, "options": [{"id": "4e88s", "text": "$14 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "Z8RPu", "text": "$12 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "t4k1u", "text": "$18 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "0mvWv", "text": "$20 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate law for the given reaction is:<br><br>$\\text{Rate} = k[\\mathrm{A}]^1[\\mathrm{B}]^2$<br><br>Substituting the given values:<br><br>$7.2 \\times 10^{-2} = k(0.4)(0.1)^2$<br><br>$k = \\dfrac{7.2 \\times 10^{-2}}{0.4 \\times 0.01}$<br><br>$k = \\dfrac{7.2 \\times 10^{-2}}{4 \\times 10^{-3}}$<br><br>$k = 18 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$<br><br>Answer: $18 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214210aee93fa0796de39", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "For reaction $\\mathrm{A}+\\mathrm{B} \\rightarrow$ product, rate of reaction is $3.6 \\times 10^{-2} \\mathrm{moldm}^{-3}\\mathrm{sec}^{-1}$. When $[A]=0.2 \\mathrm{moldm}^{-3}$ and $[B]=0.1 \\mathrm{moldm}^{-3}$, calculate rate constant of reaction if reaction is first order in A and second order in B ?", "image": null}, "options": [{"id": "g18If", "text": "$3.6 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "XXetm", "text": "$1.8 \\mathrm{~mol}^{-2} \\mathrm{dm}^{-6} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "Vpo6A", "text": "$18 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{sec}^{-1}$", "image": null, "isCorrect": true}, {"id": "an4AD", "text": "$36 \\mathrm{~mol}^{-2} \\mathrm{dm}^{-6} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate law for the given reaction is:<br><br>$\\text{Rate} = k [A]^1 [B]^2$<br><br>Substituting the given values into the rate law equation:<br><br>$3.6 \\times 10^{-2} = k (0.2) (0.1)^2$<br><br>$k = \\dfrac{3.6 \\times 10^{-2}}{0.2 \\times 0.01}$<br><br>$k = \\dfrac{3.6 \\times 10^{-2}}{2 \\times 10^{-3}}$<br><br>$k = 18$<br><br>The unit of the rate constant for a third-order reaction is $\\mathrm{mol}^{-2} \\mathrm{dm}^6 \\mathrm{sec}^{-1}$.<br><br>Therefore, $k = 18 \\mathrm{mol}^{-2} \\mathrm{dm}^6 \\mathrm{sec}^{-1}$.<br><br>Answer: $18 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{sec}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214110aee93fa0796ddb4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "A first order reaction takes 40 minute for $20 \\%$ decomposition. Calculate its rate constant.", "image": null}, "options": [{"id": "7mDKp", "text": "$5.6 \\times 10^{-3}$ minute ${ }^{-1}$", "image": null, "isCorrect": true}, {"id": "dJnCm", "text": "$4.5 \\times 10^{-3}$ minute ${ }^{-1}$", "image": null, "isCorrect": false}, {"id": "SdS56", "text": "$6.5 \\times 10^{-3}$ minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "Z9U9P", "text": "$7.2 \\times 10^{-3}$ minute ${ }^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by:<br><br>$k = \\dfrac{2.303}{t} \\log_{10} \\left( \\dfrac{[A]_0}{[A]_t} \\right)$<br><br>Given $t = 40$ minute, and for $20 \\%$ decomposition, $[A]_0 = 100$ and $[A]_t = 100 - 20 = 80$.<br><br>$k = \\dfrac{2.303}{40} \\log_{10} \\left( \\dfrac{100}{80} \\right)$<br><br>$k = \\dfrac{2.303}{40} \\log_{10} (1.25)$<br><br>$k = \\dfrac{2.303}{40} \\times 0.0969$<br><br>$k = \\dfrac{0.22316}{40}$<br><br>$k = 0.005579 \\text{ minute}^{-1}$<br><br>$k \\approx 5.6 \\times 10^{-3} \\text{ minute}^{-1}$<br><br>Answer: $5.6 \\times 10^{-3}$ minute ${ }^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140d0aee93fa0796dd94", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Which among the following statements is NOT true about rate constant?", "image": null}, "options": [{"id": "ZVvbz", "text": "It is independent of concentration.", "image": null, "isCorrect": false}, {"id": "VgRxj", "text": "It varies with temperature.", "image": null, "isCorrect": false}, {"id": "D9Bhr", "text": "For unit concentration it is equal to rate of reaction.", "image": null, "isCorrect": false}, {"id": "xwQfj", "text": "It is directly proportional to the product of concentrations of reacting species.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The rate of a reaction is directly proportional to the product of the concentrations of the reacting species raised to their respective powers. The proportionality constant in this rate law expression is the rate constant ($k$).<br><br>The rate constant is independent of the initial concentrations of the reactants. It depends only on the temperature and the presence of a catalyst (as given by the Arrhenius equation $k = A e^{-E_a/RT}$).<br><br>If the concentration of each reacting species is unity, the rate of the reaction becomes equal to the rate constant.<br><br>Thus, the statement that the rate constant is directly proportional to the product of concentrations of reacting species is incorrect.<br><br>Answer: It is directly proportional to the product of concentrations of reacting species.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140c0aee93fa0796dd8d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "For the reaction\r\n$\\begin{aligned}\r\n& 2 \\mathrm{NO}_{(\\mathrm{g})}+2 \\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow \\mathrm{N}_{2(\\mathrm{~g})}+2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{s})} \\\\\r\n& \\text { rate }=\\mathrm{k}[\\mathrm{NO}]^2\\left[\\mathrm{H}_2\\right]\r\n\\end{aligned}$\r\nWhat is the order of reaction with respect to $\\mathrm{H}_2$ and overall order of reaction respectively?", "image": null}, "options": [{"id": "vN0tV", "text": "0,2", "image": null, "isCorrect": false}, {"id": "n0Jgy", "text": "1,3", "image": null, "isCorrect": true}, {"id": "jjCHU", "text": "2,1", "image": null, "isCorrect": false}, {"id": "Q7tXt", "text": "3,1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate law is given by $\\text{rate} = k[\\mathrm{NO}]^2[\\mathrm{H}_2]$.<br><br>The order of reaction with respect to a particular reactant is the exponent of its concentration term in the rate law. For $\\mathrm{H}_2$, the exponent is $1$.<br><br>The overall order of the reaction is the sum of the exponents of all concentration terms in the rate law.<br><br>Overall order $= 2 + 1 = 3$.<br><br>Thus, the order with respect to $\\mathrm{H}_2$ is $1$ and the overall order is $3$.<br><br>Answer: 1,3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fd0aee93fa0796dd20", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "What is the time needed to reduce the initial concentration of reactant to $10 \\%$ in a first order reaction if its half life time is 10 minutes?", "image": null}, "options": [{"id": "CSZCt", "text": "15 minute", "image": null, "isCorrect": false}, {"id": "XIcqR", "text": "20 minute", "image": null, "isCorrect": false}, {"id": "cgbJn", "text": "25 minute", "image": null, "isCorrect": false}, {"id": "VU6rU", "text": "33 minute", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by:<br><br>$k = \\dfrac{2.303 \\log_{10} 2}{t_{1/2}}$<br><br>Given $t_{1/2} = 10$ minutes, we have:<br><br>$k = \\dfrac{2.303 \\times 0.3010}{10} = 0.0693 \\text{ min}^{-1}$<br><br>The time $t$ required for the concentration to reduce to $10\\%$ of its initial value is given by:<br><br>$t = \\dfrac{2.303}{k} \\log_{10} \\left( \\dfrac{[A]_0}{[A]_t} \\right)$<br><br>Here, $[A]_t = \\dfrac{10}{100} [A]_0 = 0.1 [A]_0$.<br><br>$t = \\dfrac{2.303}{0.0693} \\log_{10} \\left( \\dfrac{[A]_0}{0.1 [A]_0} \\right)$<br><br>$t = \\dfrac{2.303}{0.0693} \\log_{10} (10)$<br><br>$t = \\dfrac{2.303}{0.0693} \\times 1 \\approx 33.23 \\text{ minutes}$<br><br>The closest value is $33 \\text{ minute}$.<br><br>Answer: 33 minute", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d70aee93fa0796dbef", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Which from following decides the rate of multistep reaction?", "image": null}, "options": [{"id": "f11rn", "text": "rate of slowest step.", "image": null, "isCorrect": true}, {"id": "bcB0f", "text": "rate of fastest step.", "image": null, "isCorrect": false}, {"id": "1Pkcl", "text": "average rate of various steps.", "image": null, "isCorrect": false}, {"id": "buKam", "text": "instantaneous rate of fast step.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a multistep reaction, the overall rate of the reaction is determined by the slowest step in the reaction mechanism.<br><br>This slowest step is called the rate-determining step (RDS).<br><br>Therefore, the rate of the slowest step decides the rate of a multistep reaction.<br><br>Answer: rate of slowest step.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d50aee93fa0796dbdf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "For the reaction $\\mathrm{A}+\\mathrm{B} \\longrightarrow$ product, rate law equation is, rate $=\\mathrm{k}[\\mathrm{A}]^2[\\mathrm{~B}]$. If rate of reaction is $0.22 \\mathrm{~mol} \\mathrm{~L}^{-1} \\cdot \\mathrm{~s}^{-1}$, calculate rate constant. $\\left([\\mathrm{A}]=1 \\mathrm{~mol} \\mathrm{~L}^{-1},[\\mathrm{~B}]=0.25 \\mathrm{~mol} \\mathrm{~L}^{-1}\\right)$", "image": null}, "options": [{"id": "LQE8y", "text": "$0.44 \\mathrm{~mol}^{-2} \\mathrm{~L}^2 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "KyhJ5", "text": "$0.88 \\mathrm{~mol}^{-2} \\mathrm{~L}^2 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "MDHL4", "text": "$1.136 \\mathrm{~mol}^{-2} \\mathrm{~L}^2 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "IVeYl", "text": "$\\quad 3.52 \\mathrm{~mol}^{-2} \\mathrm{~L}^2 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given rate law equation is $\\text{rate} = k[\\mathrm{A}]^2[\\mathrm{B}]$.<br><br>Substituting the given values:<br><br>$0.22 = k(1)^2(0.25)$<br><br>$k = \\dfrac{0.22}{0.25}$<br><br>$k = 0.88 \\text{ mol}^{-2} \\text{ L}^2 \\text{ s}^{-1}$<br><br>Answer: $0.88 \\mathrm{~mol}^{-2} \\mathrm{~L}^2 \\mathrm{~s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c20aee93fa0796db4c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Calculate rate constant of first order reaction if concentration of reactant decreases by $90 \\%$ in 30 minute?", "image": null}, "options": [{"id": "GuFxU", "text": "$2.16 \\times 10^{-2} \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}, {"id": "7JcYg", "text": "$3.52 \\times 10^{-2} \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}, {"id": "q683B", "text": "$4.81 \\times 10^{-2} \\mathrm{~min}^{-1}$", "image": null, "isCorrect": false}, {"id": "CDQ3g", "text": "$\\quad 7.67 \\times 10^{-2} \\cdot \\mathrm{~min}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a first order reaction, the rate constant $k$ is given by the equation:<br><br>$k = \\dfrac{2.303}{t} \\log \\left( \\dfrac{[A]_0}{[A]_t} \\right)$<br><br>Given that the concentration decreases by $90\\%$, the remaining concentration $[A]_t$ is $10\\%$ of the initial concentration $[A]_0$.<br><br>$[A]_t = 0.1 [A]_0$<br><br>Substituting $t = 30 \\text{ min}$ and the concentrations into the rate equation:<br><br>$k = \\dfrac{2.303}{30} \\log \\left( \\dfrac{[A]_0}{0.1 [A]_0} \\right)$<br><br>$k = \\dfrac{2.303}{30} \\log (10)$<br><br>Since $\\log (10) = 1$:<br><br>$k = \\dfrac{2.303}{30} = 0.07676 \\text{ min}^{-1}$<br><br>$k = 7.67 \\times 10^{-2} \\text{ min}^{-1}$<br><br>Answer: $\\quad 7.67 \\times 10^{-2} \\cdot \\mathrm{~min}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c00aee93fa0796db3b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Which of the following is NOT true about order of a reaction?", "image": null}, "options": [{"id": "lDbae", "text": "It is sum of power of concentration terms in rate law equation.", "image": null, "isCorrect": false}, {"id": "GG2QU", "text": "It may be integer, fraction or zero.", "image": null, "isCorrect": false}, {"id": "p0nEK", "text": "It is theoretical quantity", "image": null, "isCorrect": true}, {"id": "f6eb5", "text": "It is experimentally determined quantity.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Order of a reaction is defined as the sum of the powers to which the concentration terms are raised in the experimentally determined rate law equation.<br><br>It is an experimentally determined quantity and cannot be deduced theoretically from the balanced chemical equation.<br><br>The order of a reaction can be zero, an integer, or a fraction.<br><br>Therefore, the statement that it is a theoretical quantity is incorrect.<br><br>Answer: It is theoretical quantity", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c00aee93fa0796db37", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "For a zero order reaction, $\\mathrm{A} \\longrightarrow$ product, concentration of A decreases from $1.2 \\mathrm{moldm}^{-3}$ to $0.4 \\mathrm{moldm}^{-3}$ in 240 second. What is rate constant of the reaction?", "image": null}, "options": [{"id": "PEnk3", "text": "$0.1 \\mathrm{~mol} \\mathrm{dm}^{-3}$ minute ${ }^{-1}$", "image": null, "isCorrect": false}, {"id": "m46w1", "text": "$0.2 \\mathrm{~mol} \\mathrm{dm}^{-3}$ minute $^{-1}$", "image": null, "isCorrect": true}, {"id": "AHt6U", "text": "$0.3 \\mathrm{~mol} \\mathrm{dm}^{-3}$ minute ${ }^{-1}$", "image": null, "isCorrect": false}, {"id": "7T3OL", "text": "$0.4 \\mathrm{~mol} \\mathrm{dm}^{-3}$ minute $^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a zero order reaction, the integrated rate equation is given by:<br><br>$k = \\dfrac{[A]_0 - [A]_t}{t}$<br><br>Given:<br><br>$[A]_0 = 1.2 \\text{ mol dm}^{-3}$<br><br>$[A]_t = 0.4 \\text{ mol dm}^{-3}$<br><br>$t = 240 \\text{ s} = \\dfrac{240}{60} \\text{ minutes} = 4 \\text{ minutes}$<br><br>Substituting the values into the equation:<br><br>$k = \\dfrac{1.2 - 0.4}{4}$<br><br>$k = \\dfrac{0.8}{4} = 0.2 \\text{ mol dm}^{-3} \\text{ minute}^{-1}$<br><br>Answer: $0.2 \\mathrm{~mol} \\mathrm{dm}^{-3}$ minute $^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ae0aee93fa0796dab4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Identify order of following reaction.\n$2\\text{H}_2\\text{O}_{2(aq)} \\longrightarrow 2\\text{H}_2\\text{O}_{(l)} + \\text{O}_{2(g)}$", "image": null}, "options": [{"id": "qNUMX", "text": "0", "image": null, "isCorrect": false}, {"id": "rIwRk", "text": "1", "image": null, "isCorrect": true}, {"id": "2kPz1", "text": "1.5", "image": null, "isCorrect": false}, {"id": "hwh75", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The decomposition of hydrogen peroxide in an aqueous solution is a well-known example of a first-order reaction.<br><br>The rate law for this reaction is experimentally determined to be:<br>Rate = $k[\\text{H}_2\\text{O}_2]$<br><br>Since the power of the concentration term in the rate law is $1$, the order of the reaction is $1$.<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139f0aee93fa0796da38", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Find the percentage of unreacted reactant for a zero order reaction in 90 seconds having rate constant 1 $\\text{mol dm}^{-3}\\text{ s}^{-1}$ and initial concentration 100 $\\text{mol dm}^{-3}$.", "image": null}, "options": [{"id": "kbNQU", "text": "$5 \\%$", "image": null, "isCorrect": false}, {"id": "uzhMe", "text": "$10 \\%$", "image": null, "isCorrect": true}, {"id": "rbYq1", "text": "$15 \\%$", "image": null, "isCorrect": false}, {"id": "TeT6E", "text": "$20 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a zero order reaction, the concentration of reactant at time $t$ is given by the integrated rate law:<br><br>$[A]_t = [A]_0 - kt$<br><br>Substituting $[A]_0 = 100 \\text{ mol dm}^{-3}$, $k = 1 \\text{ mol dm}^{-3}\\text{ s}^{-1}$, and $t = 90 \\text{ s}$:<br><br>$[A]_t = 100 - (1 \\times 90) = 10 \\text{ mol dm}^{-3}$<br><br>The percentage of unreacted reactant is:<br><br>$\\dfrac{[A]_t}{[A]_0} \\times 100 = \\dfrac{10}{100} \\times 100 = 10 \\%$<br><br>Answer: $10 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139c0aee93fa0796da25", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "For the reaction, $\\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{CO}_{(\\mathrm{g})} \\longrightarrow \\mathrm{NO}_{(\\mathrm{g})}+\\mathrm{CO}_{2(\\mathrm{~g})}$ rate of reaction is proportional to square of [ $\\mathrm{NO}_2$ ] and independent of [CO].\nWhat is the rate law equation?", "image": null}, "options": [{"id": "ikCJQ", "text": "$r=k \\dfrac{\\left[\\mathrm{NO}_2\\right]^{\\dfrac{1}{2}}}{[\\mathrm{CO}]}$", "image": null, "isCorrect": false}, {"id": "8af61", "text": "$\\mathrm{r}=\\mathrm{k}\\left[\\mathrm{NO}_2\\right]^2[\\mathrm{CO}]^0$", "image": null, "isCorrect": true}, {"id": "8uShx", "text": "$\\mathrm{r}=\\dfrac{1}{2} \\mathrm{k}\\left[\\mathrm{NO}_2\\right][\\mathrm{CO}]$", "image": null, "isCorrect": false}, {"id": "jtLCJ", "text": "$\\mathrm{r}=\\mathrm{k}\\left[\\mathrm{NO}_2\\right]^2[\\mathrm{CO}]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given that the rate of reaction is proportional to the square of $[\\mathrm{NO}_2]$, the order of the reaction with respect to $\\mathrm{NO}_2$ is $2$.<br><br>Given that the rate of reaction is independent of $[\\mathrm{CO}]$, the order of the reaction with respect to $\\mathrm{CO}$ is $0$.<br><br>The rate law equation can be written as $r = k[\\mathrm{NO}_2]^2[\\mathrm{CO}]^0$.<br><br>Answer: $\\mathrm{r}=\\mathrm{k}\\left[\\mathrm{NO}_2\\right]^2[\\mathrm{CO}]^0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139c0aee93fa0796da24", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Consider the reaction $3 \\mathrm{I}^{-}+\\mathrm{S}_2 \\mathrm{O}_8^{2-} \\longrightarrow \\mathrm{I}_3^{-}+2 \\mathrm{SO}_4^{2-}$, at a particular time t , $\\dfrac{\\mathrm{d}\\left[\\mathrm{SO}_4^{2-}\\right]}{\\mathrm{dt}}$ is $2.2 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$. What is the value of $\\dfrac{\\mathrm{d}\\left[\\mathrm{S}_2 \\mathrm{O}_8^{2-}\\right]}{\\mathrm{dt}}$ ?", "image": null}, "options": [{"id": "XwwlS", "text": "$1.1 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$.", "image": null, "isCorrect": true}, {"id": "TiapR", "text": "$2.2 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "KdAyP", "text": "$3.3 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "ZMi9U", "text": "$6.6 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the given reaction:<br><br>$3 \\mathrm{I}^{-} + \\mathrm{S}_2 \\mathrm{O}_8^{2-} \\longrightarrow \\mathrm{I}_3^{-} + 2 \\mathrm{SO}_4^{2-}$<br><br>The rate of reaction is given by:<br><br>$\\text{Rate} = -\\dfrac{1}{3} \\dfrac{\\mathrm{d}[\\mathrm{I}^{-}]}{\\mathrm{dt}} = -\\dfrac{\\mathrm{d}[\\mathrm{S}_2 \\mathrm{O}_8^{2-}]}{\\mathrm{dt}} = \\dfrac{\\mathrm{d}[\\mathrm{I}_3^{-}]}{\\mathrm{dt}} = \\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{SO}_4^{2-}]}{\\mathrm{dt}}$<br><br>Therefore, the magnitude of the rate of change of concentration of $\\mathrm{S}_2 \\mathrm{O}_8^{2-}$ is:<br><br>$\\left| \\dfrac{\\mathrm{d}[\\mathrm{S}_2 \\mathrm{O}_8^{2-}]}{\\mathrm{dt}} \\right| = \\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{SO}_4^{2-}]}{\\mathrm{dt}}$<br><br>Substituting the given value:<br><br>$\\left| \\dfrac{\\mathrm{d}[\\mathrm{S}_2 \\mathrm{O}_8^{2-}]}{\\mathrm{dt}} \\right| = \\dfrac{1}{2} \\times 2.2 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$<br><br>$\\left| \\dfrac{\\mathrm{d}[\\mathrm{S}_2 \\mathrm{O}_8^{2-}]}{\\mathrm{dt}} \\right| = 1.1 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$<br><br>Answer: $1.1 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138a0aee93fa0796d991", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "For the reaction $2 \\mathrm{~N}_2 \\mathrm{O}_{5(\\mathrm{~g})} \\longrightarrow 4 \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})}$ rate and rate constant are $1.02 \\times 10^{-4} \\mathrm{~mol} \\mathrm{~L}^{-1} \\mathrm{~s}^{-1}$ and $3.4 \\times 10^{-5} \\mathrm{~s}^{-1}$.\nWhat is the conc. of $\\mathrm{N}_2 \\mathrm{O}_5$ ?", "image": null}, "options": [{"id": "FKwtZ", "text": "$1.7 \\mathrm{~mol} \\mathrm{~L}^{-1}$", "image": null, "isCorrect": false}, {"id": "obEND", "text": "$3.0 \\mathrm{~mol} \\mathrm{~L}^{-1}$", "image": null, "isCorrect": true}, {"id": "JKcTt", "text": "$3.4 \\mathrm{~mol} \\mathrm{~L}^{-1}$", "image": null, "isCorrect": false}, {"id": "PC6kN", "text": "$5.1 \\mathrm{~mol} \\mathrm{~L}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The unit of the rate constant ($\\mathrm{s}^{-1}$) indicates that the reaction is of the first order.<br><br>The rate law for the first-order reaction is given by:<br><br>$\\text{Rate} = k [\\mathrm{N}_2\\mathrm{O}_5]$<br><br>Given:<br><br>$\\text{Rate} = 1.02 \\times 10^{-4} \\mathrm{~mol} \\mathrm{~L}^{-1} \\mathrm{~s}^{-1}$<br><br>$k = 3.4 \\times 10^{-5} \\mathrm{~s}^{-1}$<br><br>Substituting the given values into the rate law:<br><br>$1.02 \\times 10^{-4} = 3.4 \\times 10^{-5} \\times [\\mathrm{N}_2\\mathrm{O}_5]$<br><br>$[\\mathrm{N}_2\\mathrm{O}_5] = \\dfrac{1.02 \\times 10^{-4}}{3.4 \\times 10^{-5}}$<br><br>$[\\mathrm{N}_2\\mathrm{O}_5] = \\dfrac{10.2 \\times 10^{-5}}{3.4 \\times 10^{-5}} = 3.0 \\mathrm{~mol} \\mathrm{~L}^{-1}$<br><br>Answer: $3.0 \\mathrm{~mol} \\mathrm{~L}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213890aee93fa0796d989", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "What is the half life of a first order reaction if time required to decrease concentration of reactant from 0.8 M to 0.2 M is 12 hour?", "image": null}, "options": [{"id": "70hmR", "text": "1.5 hour", "image": null, "isCorrect": false}, {"id": "biwl5", "text": "3 hour", "image": null, "isCorrect": false}, {"id": "QMlVo", "text": "6 hour", "image": null, "isCorrect": true}, {"id": "VkU4N", "text": "12 hour", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Initial concentration, $[A]_0 = 0.8$ M<br><br>Final concentration, $[A]_t = 0.2$ M<br><br>Time taken, $t = 12$ hour<br><br>For a first order reaction, the concentration after $n$ half-lives is:<br><br>$[A]_t = \\dfrac{[A]_0}{2^n}$<br><br>$0.2 = \\dfrac{0.8}{2^n}$<br><br>$2^n = 4$<br><br>$n = 2$<br><br>The total time is related to the half-life by $t = n \\times t_{1/2}$<br><br>$12 = 2 \\times t_{1/2}$<br><br>$t_{1/2} = 6$ hour<br><br>Answer: 6 hour", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792132a0aee93fa0796d6a9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Rate law for the reaction $2 \\mathrm{NO}+\\mathrm{Cl}_2 \\rightarrow 2 \\mathrm{NOCl}$ is rate $=\\mathrm{k}[\\mathrm{NO}]^2\\left[\\mathrm{Cl}_2\\right]$. When will the value of k increase?", "image": null}, "options": [{"id": "mLlCG", "text": "by increasing temperature", "image": null, "isCorrect": true}, {"id": "W4cz2", "text": ". by increasing [NO]", "image": null, "isCorrect": false}, {"id": "gINGy", "text": "by increasing $\\left[\\mathrm{Cl}_2\\right]$", "image": null, "isCorrect": false}, {"id": "9OjZr", "text": "by increasing both [ NO$]$ and $\\left[\\mathrm{Cl}_2\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate constant $k$ of a chemical reaction is independent of the concentration of the reactants.<br><br>It depends only on the temperature of the reaction and the presence of a catalyst.<br><br>According to the Arrhenius equation, $k = A e^{-E_a/RT}$.<br><br>As temperature increases, the exponential term $e^{-E_a/RT}$ increases, which leads to an increase in the value of the rate constant $k$.<br><br>Thus, the value of $k$ will increase by increasing the temperature.<br><br>Answer: by increasing temperature", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213270aee93fa0796d68f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Calculate the time required for reactant to decrease the concentration from $100 \\%$ to $20 \\%$, if rate constant of first order reaction is 0.02303 hours $^{-1}$.", "image": null}, "options": [{"id": "QE0N5", "text": "28 hour", "image": null, "isCorrect": false}, {"id": "4qs6f", "text": "42 hour", "image": null, "isCorrect": false}, {"id": "XLYk7", "text": "56 hour", "image": null, "isCorrect": false}, {"id": "lju7e", "text": "70 hour", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a first order reaction, the time required is given by the integrated rate equation:<br><br>$t = \\dfrac{2.303}{k} \\log \\left( \\dfrac{[A]_0}{[A]_t} \\right)$<br><br>Given:<br><br>$k = 0.02303 \\text{ hours}^{-1}$<br><br>$[A]_0 = 100 \\%$<br><br>$[A]_t = 20 \\%$<br><br>Substituting the values into the equation:<br><br>$t = \\dfrac{2.303}{0.02303} \\log \\left( \\dfrac{100}{20} \\right)$<br><br>$t = 100 \\log(5)$<br><br>Using $\\log(5) \\approx 0.699$:<br><br>$t = 100 \\times 0.699 = 69.9 \\approx 70 \\text{ hours}$<br><br>Answer: 70 hour", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262820279619d9d8a3517", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "The rate law for the reaction $\\mathrm{A}+\\mathrm{B} \\rightarrow$ product is rate $=k[A][B]$. When will the rate of reaction increase by factor two?", "image": null}, "options": [{"id": "RreZF", "text": "$[\\mathrm{A}]$ and $[\\mathrm{B}]$ both are doubled", "image": null, "isCorrect": false}, {"id": "f1qGi", "text": "$[A]$ is doubled and $[B]$ is kept constant", "image": null, "isCorrect": true}, {"id": "x1Trq", "text": "$[\\mathrm{B}]$ is doubled and $[\\mathrm{A}]$ is halved", "image": null, "isCorrect": false}, {"id": "rG2zp", "text": "$[\\mathrm{A}]$ is kept constant $[\\mathrm{B}]$ is halved", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Rate }=\\mathrm{k}[\\mathrm{A}][\\mathrm{B}] \\\\ & (\\text { Rate })_1=\\mathrm{k} \\times 2[\\mathrm{~A}][\\mathrm{B}] \\\\ & \\frac{(\\text { Rate })_1}{\\text { Rate }}=\\frac{\\mathrm{k} 2[\\mathrm{~A}][\\mathrm{B}]}{\\mathrm{k}[\\mathrm{A}][\\mathrm{B}]}=2 \\\\ & (\\text { Rate })_1=2 \\times \\text { Rate }\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262810279619d9d8a3513", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "What is the value of rate constant for first order reaction if slope for the graph of rate versus concentration is $2.5 \\times 10^{-3}$ ?", "image": null}, "options": [{"id": "lDNtI", "text": "$2.5 \\times 10^{-3}$ time $^{-1}$", "image": null, "isCorrect": true}, {"id": "rw7cc", "text": "$5.0 \\times 10^{-3}$ time $^{-1}$", "image": null, "isCorrect": false}, {"id": "9uYgU", "text": "$7.5 \\times 10^{-3}$ time $^{-1}$", "image": null, "isCorrect": false}, {"id": "C37A1", "text": "$1.25 \\times 10^{-3}$ time $^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction,\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/A53EnU4rhrA_MZ8fzjiDs83Ce60l4iO-peIeF3uqXWE.original.fullsize.png\"><br>\n$\\therefore \\quad$ Rate constant $(\\mathrm{k})=2.5 \\times 10^{-3}$ time $^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627d0279619d9d8a34f4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Calculate the rate constant of the first order reaction if $80 \\%$ of the reactant decomposes in 60 minutes.", "image": null}, "options": [{"id": "OcLj2", "text": "$2.68 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": true}, {"id": "4Qn04", "text": "$5.36 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "zcw1k", "text": "$1.34 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "UWyeC", "text": "$8.1 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{k} & =\\frac{2.303}{\\mathrm{t}} \\log _{10} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}} \\\\ & =\\frac{2.303}{60} \\log _{10} \\frac{(100)}{(20)}=\\frac{2.303}{60} \\log _{10} \\frac{10}{2} \\\\ & =\\frac{2.303}{60}\\left[\\log _{10}(10)-\\log _{10}(2)\\right] \\\\ & =\\frac{2.303}{60} \\times 0.699=2.68 \\times 10^{-2} \\text { minute }^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626f0279619d9d8a347d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "The rate for reaction $2 \\mathrm{~A}+\\mathrm{B} \\rightarrow$ product is $6 \\times 10^{-4} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$ Calculate the rate constant if the reaction is first order in $\\mathrm{A}$ and zeroth order in B. $[\\operatorname{Given}[\\mathrm{A}]=[\\mathrm{B}]=0.3 \\mathrm{M}]$", "image": null}, "options": [{"id": "awWp2", "text": "$1 \\times 10^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "noRyc", "text": "$2 \\times 10^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "vOyEk", "text": "$3 \\times 10^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "p1Qn4", "text": "$4 \\times 10^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Rate }=\\mathrm{k}[\\mathrm{A}] \\\\ & \\therefore \\quad \\mathrm{k}=\\frac{\\text { Rate }}{[\\mathrm{A}]}=\\frac{6 \\times 10^{-4} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}}{0.3 \\mathrm{~mol} \\mathrm{dm}^{-3}}=2 \\times 10^{-3} \\mathrm{~s}^{-1} \\\\ & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626e0279619d9d8a347c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Find the rate law for the reaction, $\\mathrm{CHCl}_{3(\\mathrm{~g})}+\\mathrm{Cl}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{CCl}_{4(\\mathrm{~g})}+\\mathrm{HCl}_{(\\mathrm{g})}$ if order of reaction with respect to $\\mathrm{CHCl}_{\\mathrm{a}(\\mathrm{g})}$ is one and $\\frac{1}{2}$ with $\\mathrm{Cl}_{2(\\mathrm{~g})}$.", "image": null}, "options": [{"id": "lCdHk", "text": "Rate $=\\mathrm{k}\\left[\\mathrm{CHCl}_3\\right]\\left[\\mathrm{Cl}_2\\right]^{1 / 2}$", "image": null, "isCorrect": true}, {"id": "N4ce4", "text": "Rate $=\\mathrm{k}\\left[\\mathrm{CHCl}_3\\right]^2\\left[\\mathrm{Cl}_2\\right]^{1 / 2}$", "image": null, "isCorrect": false}, {"id": "PsxbG", "text": "Rate $=\\mathrm{k}\\left[\\mathrm{CHCl}_3\\right]^{3 / 2}\\left[\\mathrm{Cl}_2\\right]$", "image": null, "isCorrect": false}, {"id": "LeuBx", "text": "Rate $=\\mathrm{k}\\left[\\mathrm{CHCl}_3\\right]^{1 / 2}\\left[\\mathrm{Cl}_2\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std. $12 \\mid$ Ch-6 | Subtopic-6.3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625b0279619d9d8a33e0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "For the reaction $2 \\mathrm{~A}+2 \\mathrm{~B} \\rightarrow 2 \\mathrm{C}+\\mathrm{D}$, the rate law is expressed as rate $=k[A]^2[B]$. Calculate the rate constant if rate of reaction is $0.24 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$.\n$([\\mathrm{A}]=0.5 \\mathrm{M}$ and $[\\mathrm{B}]=0.2 \\mathrm{M}$ )", "image": null}, "options": [{"id": "Qyaea", "text": "$4.8 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "VEicW", "text": "$9.6 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "GmRez", "text": "$12.1 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "eAXNJ", "text": "$14.4 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rate $=k[A]^2[B]$\n$\\therefore \\quad \\mathrm{k}=\\frac{\\text { Rate }}{[\\mathrm{A}]^2[\\mathrm{~B}]}$\n$=\\frac{0.24 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}}{\\left(0.5 \\mathrm{~mol} \\mathrm{dm}^{-3}\\right)^2\\left(0.2 \\mathrm{~mol} \\mathrm{dm}^{-3}\\right)}$\n$=4.8 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262590279619d9d8a33ca", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Which from following statements about rate constant is NOT true?", "image": null}, "options": [{"id": "2Wo5c", "text": "It is independent of concentration.", "image": null, "isCorrect": false}, {"id": "qIRbG", "text": "It varies with temperature.", "image": null, "isCorrect": false}, {"id": "TVszl", "text": "It is equal to rate of reaction at unit concentration of reactants.", "image": null, "isCorrect": false}, {"id": "ET4gM", "text": "Its unit is independent of order of reaction.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The unit of rate constant depends on the order of the reaction.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262460279619d9d8a3333", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Calculate the rate constant of the first order reaction if $20 \\%$ of the reactant decomposes in 15 minutes.", "image": null}, "options": [{"id": "GaR7O", "text": "$1.488 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": true}, {"id": "iPaAf", "text": "$1.881 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "oOI17", "text": "$1.984 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "U8DCC", "text": "$1.18 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$20 \\%$ of the reactant has decomposed.\nSo, if $[A]_0=100$, then $[A]_{\\mathrm{t}}=100-20=80$\n$$\n\\begin{aligned}\nk & =\\frac{2.303}{t} \\log _{10} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}} \\\\\n& =\\frac{2.303}{15} \\log _{10} \\frac{100}{80} \\\\\n& =\\frac{2.303}{15} \\log _{10} \\frac{5}{4} \\\\\n& =\\frac{2.303}{15} \\times\\left(\\log _{10} 5-\\log _{10} 4\\right) \\\\\n& =\\frac{2.303}{15} \\times(0.699-0.602) \\\\\n& =0.01488=1.488 \\times 10^{-2} \\text { minute }^{-1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262340279619d9d8a32a3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "A first order reaction takes 23.03 minutes for $20 \\%$ decomposition. Calculate its rate constant.", "image": null}, "options": [{"id": "EwN7O", "text": "5:6 $6 \\times 10^{-3}$ minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "QeDhL", "text": "$4.5 \\times 10^{-3}$ minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "tNEZU", "text": "$6.5 \\times 10^{-3}$ minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "7HO8b", "text": "$9.69 \\times 10^{-3}$ minute $^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n[A]_0=100 \\%,[A]_t=100-20=80 \\%\n$$\n\nSubstitution of these in above\n$$\n\\begin{aligned}\n\\mathrm{k} & =\\frac{2.303}{\\mathrm{t}} \\log _{10} \\frac{[\\mathrm{A}]_0}{[\\mathrm{~A}]_{\\mathrm{t}}} \\\\\n\\mathrm{k} & =\\frac{2.303}{\\mathrm{t}} \\log _{10} \\frac{100}{80} \\\\\n& =\\frac{2.303}{23.03 \\mathrm{~min}} \\log _{10}(1.25) \\\\\n& =\\frac{2.303}{23.03 \\mathrm{~min}} \\times 0.0969 \\\\\n& =9.69 \\times 10^{-3} \\text { minute }^{-1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262230279619d9d8a321a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Identify rate law expression for $2 \\mathrm{NO}_{(\\mathrm{g})}+\\mathrm{Cl}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{NOCl}_{(\\mathrm{g})}$ if the reaction is second order in $\\mathrm{NO}$ and first order in $\\mathrm{Cl}_2$.", "image": null}, "options": [{"id": "sqHqN", "text": "Rate $=\\mathrm{k}\\left[\\mathrm{NO}^2\\left[\\mathrm{Cl}_2\\right]\\right.$", "image": null, "isCorrect": true}, {"id": "rHJmv", "text": "Rate $=\\mathrm{k}[\\mathrm{NO}]\\left[\\mathrm{Cl}_2\\right]$", "image": null, "isCorrect": false}, {"id": "neWkp", "text": "Rate $=\\mathrm{k}[\\mathrm{NO}]^2$", "image": null, "isCorrect": false}, {"id": "EAaky", "text": "Rate $=\\mathrm{k}\\left[\\mathrm{Cl}_2\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\begin{array}{|l|l|l|} \\hline Std.12 & Ch-6 & Subtopic-6.3 \\\\ \\hline \\end{array}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262230279619d9d8a3218", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Calculate the rate constant of first order reaction if half life of reaction is 40 minutes.", "image": null}, "options": [{"id": "fC3LC", "text": "$1.733 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": true}, {"id": "dn6mN", "text": "$1.951 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "n25uR", "text": "$1.423 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": false}, {"id": "GShfl", "text": "$1.256 \\times 10^{-2}$ minute $^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a first order reaction, $k=\\frac{0.693}{t_{1 / 2}}$\n$$\n\\mathrm{k}=\\frac{0.693}{40}=1.733 \\times 10^{-2} \\text { minute }^{-1}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262220279619d9d8a320e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Calculate the time needed for reactant to decompose $99.9 \\%$ if rate constant of first order reaction is 0.576 minute $^{-1}$.", "image": null}, "options": [{"id": "CuZPa", "text": "8 minutes", "image": null, "isCorrect": false}, {"id": "XAsTW", "text": "12 minutes", "image": null, "isCorrect": true}, {"id": "PLWG0", "text": "16 minutes", "image": null, "isCorrect": false}, {"id": "NweBx", "text": "20 minutes", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$99.9 \\%$ of the reaction is complete.\
