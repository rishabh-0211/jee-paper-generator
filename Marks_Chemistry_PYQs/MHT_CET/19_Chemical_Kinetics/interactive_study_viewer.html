{-3} \\text{ s}^{-1}$<br><br>The rate of formation of $\\text{O}_2$ is:<br><br>$\\dfrac{d[\\text{O}_2]}{dt} = \\dfrac{1}{2} \\left(-\\dfrac{d[\\text{N}_2\\text{O}_5]}{dt}\\right)$<br><br>$\\dfrac{d[\\text{O}_2]}{dt} = \\dfrac{1}{2} \\times 0.06 = 0.03 \\text{ mol dm}^{-3} \\text{ s}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30d8c30a4553e1bdfaa", "type": "singleCorrect", "question": {"text": "Consider the reaction,<br>$3\\text{I}^-_{(aq)} + \\text{S}_2\\text{O}_8^{2-}{}_{(aq)} \\longrightarrow \\text{I}_3^-{}_{(aq)} + 2\\text{SO}_4^{2-}{}_{(aq)}$<br>If the rate of formation of $\\text{SO}_4^{2-}$ at a particular time is $2.2 \\times 10^{-2}\\,\\text{mol dm}^{-3}\\,\\text{s}^{-1}$. Calculate the rate of consumption of $\\text{I}^-$.", "image": null}, "options": [{"id": "DctyN", "label": "A", "text": "$1.1 \\times 10^{-2}\\,\\text{mol dm}^{-3}\\,\\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "f8hcu", "label": "B", "text": "$2.2 \\times 10^{-2}\\,\\text{mol dm}^{-3}\\,\\text{s}^{-1}$", "isCorrect": false, "image": null}, {"id": "3qDKJ", "label": "C", "text": "$3.3 \\times 10^{-2}\\,\\text{mol dm}^{-3}\\,\\text{s}^{-1}$", "isCorrect": true, "image": null}, {"id": "N5Z3c", "label": "D", "text": "$4.4 \\times 10^{-2}\\,\\text{mol dm}^{-3}\\,\\text{s}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The rate of reaction is given by:<br><br>$\\text{Rate} = -\\dfrac{1}{3} \\dfrac{d[\\text{I}^-]}{dt} = \\dfrac{1}{2} \\dfrac{d[\\text{SO}_4^{2-}]}{dt}$<br><br>The rate of consumption of $\\text{I}^-$ is $-\\dfrac{d[\\text{I}^-]}{dt}$.<br><br>$-\\dfrac{d[\\text{I}^-]}{dt} = \\dfrac{3}{2} \\dfrac{d[\\text{SO}_4^{2-}]}{dt}$<br><br>Substituting the given rate of formation of $\\text{SO}_4^{2-}$:<br><br>$-\\dfrac{d[\\text{I}^-]}{dt} = \\dfrac{3}{2} \\times 2.2 \\times 10^{-2}$<br><br>$-\\dfrac{d[\\text{I}^-]}{dt} = 3.3 \\times 10^{-2} \\text{ mol dm}^{-3} \\text{ s}^{-1}$<br><br>Answer: $3.3 \\times 10^{-2}\\,\\text{mol dm}^{-3}\\,\\text{s}^{-1}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e28c30a4553e1bddd8", "type": "singleCorrect", "question": {"text": "For the reaction $2\\text{A} \\longrightarrow 3\\text{C} + \\text{D}$, the rate of reaction is represented by", "image": null}, "options": [{"id": "uRXiX", "label": "A", "text": "$-\\text{d}[A]/\\text{dt} = -\\text{d}[D]/\\text{dt}$", "isCorrect": false, "image": null}, {"id": "NahLc", "label": "B", "text": "$-\\text{d}[C]/\\text{dt} = -2\\text{d}[A]/\\text{dt}$", "isCorrect": false, "image": null}, {"id": "0wDQ1", "label": "C", "text": "$-\\text{d}[A]/\\text{dt} = -\\text{d}[D]/\\text{dt}$", "isCorrect": false, "image": null}, {"id": "e7ZH0", "label": "D", "text": "$-\\dfrac{1}{2}\\dfrac{\\text{d}[A]}{\\text{dt}} = +\\dfrac{1}{3}\\dfrac{\\text{d}[C]}{\\text{dt}}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For the reaction $2\\text{A} \\longrightarrow 3\\text{C} + \\text{D}$, the rate of reaction is expressed as the rate of disappearance of reactants divided by their stoichiometric coefficients, which is equal to the rate of appearance of products divided by their stoichiometric coefficients.<br><br>$\\text{Rate} = -\\dfrac{1}{2}\\dfrac{\\text{d}[\\text{A}]}{\\text{dt}} = +\\dfrac{1}{3}\\dfrac{\\text{d}[\\text{C}]}{\\text{dt}} = +\\dfrac{\\text{d}[\\text{D}]}{\\text{dt}}$<br><br>Comparing this with the given options, the correct relationship is $-\\dfrac{1}{2}\\dfrac{\\text{d}[\\text{A}]}{\\text{dt}} = +\\dfrac{1}{3}\\dfrac{\\text{d}[\\text{C}]}{\\text{dt}}$.<br><br>Answer: $-\\dfrac{1}{2}\\dfrac{\\text{d}[A]}{\\text{dt}} = +\\dfrac{1}{3}\\dfrac{\\text{d}[C]}{\\text{dt}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c00bf9280d7f9932e61", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For the reaction,\n$2 \\mathrm{~N}_2 \\mathrm{O}_{5(\\mathrm{~g})} \\rightarrow 4 \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})}$\n\n$\\mathrm{N}_2 \\mathrm{O}_5$ disappears at a rate of $x \\mathrm{~mol~} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$\nFind the rate of formation of $\\mathrm{O}_2$ ?", "image": null}, "options": [{"id": "7KOV0", "text": "$x \\mathrm{~mol} \\quad \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "OfRq5", "text": "$2 x \\mathrm{~mol} \\quad \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "7DXjB", "text": "$\\frac{x}{2} \\mathrm{~mol} \\quad \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "Pci3o", "text": "$\\frac{3 x}{2} \\mathrm{~mol} \\quad \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the given reaction:<br><br>$2 \\mathrm{N}_2 \\mathrm{O}_{5(\\mathrm{g})} \\rightarrow 4 \\mathrm{NO}_{2(\\mathrm{g})} + \\mathrm{O}_{2(\\mathrm{g})}$<br><br>The rate of reaction can be expressed in terms of the rate of disappearance of reactants and the rate of formation of products:<br><br>$\\text{Rate} = -\\dfrac{1}{2} \\dfrac{d[\\mathrm{N}_2\\mathrm{O}_5]}{dt} = \\dfrac{1}{4} \\dfrac{d[\\mathrm{NO}_2]}{dt} = \\dfrac{d[\\mathrm{O}_2]}{dt}$<br><br>Given that the rate of disappearance of $\\mathrm{N}_2\\mathrm{O}_5$ is $x \\mathrm{~mol~dm}^{-3}\\mathrm{s}^{-1}$, we have:<br><br>$-\\dfrac{d[\\mathrm{N}_2\\mathrm{O}_5]}{dt} = x$<br><br>The rate of formation of $\\mathrm{O}_2$ is $\\dfrac{d[\\mathrm{O}_2]}{dt}$. From the rate equation:<br><br>$\\dfrac{d[\\mathrm{O}_2]}{dt} = \\dfrac{1}{2} \\left( -\\dfrac{d[\\mathrm{N}_2\\mathrm{O}_5]}{dt} \\right)$<br><br>$\\dfrac{d[\\mathrm{O}_2]}{dt} = \\dfrac{x}{2} \\mathrm{~mol~dm}^{-3}\\mathrm{s}^{-1}$<br><br>Answer: $\\frac{x}{2} \\mathrm{~mol} \\quad \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871becbf9280d7f9932da9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For the reaction,\n$A+3 B \\rightarrow 2 C$\nrate of consumption of $A$ is $1.4 \\mathrm{~mol~} \\mathrm{dm}^{-3}$ minute ${ }^{-1}$.\nCalculate rate of consumption of B .", "image": null}, "options": [{"id": "o1gFe", "text": "$4.2 \\mathrm{~mol~} \\mathrm{dm}^{-3}$ minute ${ }^{-1}$", "image": null, "isCorrect": true}, {"id": "wY7Tu", "text": "$0.7 \\mathrm{~mol~} \\mathrm{dm}{ }^{-3}$ minute ${ }^{-1}$", "image": null, "isCorrect": false}, {"id": "N3vf5", "text": "$2.1 \\mathrm{~mol~} \\mathrm{dm}{ }^{-3}$ minute ${ }^{-1}$", "image": null, "isCorrect": false}, {"id": "blwPd", "text": "$2.8 \\mathrm{~mol~} \\mathrm{dm}^{-3}$ minute ${ }^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the given reaction $A + 3B \\rightarrow 2C$, the rate of reaction is expressed as:<br><br>$\\text{Rate} = -\\dfrac{d[A]}{dt} = -\\dfrac{1}{3}\\dfrac{d[B]}{dt} = \\dfrac{1}{2}\\dfrac{d[C]}{dt}$<br><br>The rate of consumption of $A$ is $-\\dfrac{d[A]}{dt} = 1.4 \\text{ mol dm}^{-3} \\text{ min}^{-1}$.<br><br>The rate of consumption of $B$ is $-\\dfrac{d[B]}{dt}$.<br><br>From the rate expression:<br><br>$-\\dfrac{1}{3}\\dfrac{d[B]}{dt} = -\\dfrac{d[A]}{dt}$<br><br>$-\\dfrac{d[B]}{dt} = 3 \\times \\left(-\\dfrac{d[A]}{dt}\\right)$<br><br>$-\\dfrac{d[B]}{dt} = 3 \\times 1.4 = 4.2 \\text{ mol dm}^{-3} \\text{ min}^{-1}$<br><br>Answer: $4.2 \\mathrm{~mol~} \\mathrm{dm}^{-3}$ minute ${ }^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdfbf9280d7f9932d2e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the average rate of reaction when change in concentration of product is 0.05 M in 20 seconds?", "image": null}, "options": [{"id": "HbWNp", "text": "$0.0025 \\mathrm{M} \\mathrm{s}^{-1}$", "image": null, "isCorrect": true}, {"id": "SlN5b", "text": "$0.05 \\mathrm{M} \\mathrm{s}^{-1}$", "image": null, "isCorrect": false}, {"id": "4JxfD", "text": "$1.0 \\mathrm{M} \\mathrm{s}^{-1}$", "image": null, "isCorrect": false}, {"id": "nVJdh", "text": "$4.0 \\mathrm{M} \\mathrm{s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The average rate of reaction is given by the ratio of the change in concentration of the product to the time interval.<br><br>Average rate $= \\dfrac{\\Delta [P]}{\\Delta t}$<br><br>Substituting the given values:<br><br>$\\Delta [P] = 0.05$ M<br><br>$\\Delta t = 20$ s<br><br>Average rate $= \\dfrac{0.05}{20} = 0.0025$ M s$^{-1}$<br><br>Answer: $0.0025 \\mathrm{M} \\mathrm{s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbabf9280d7f9932be7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If Instantaneous rate of reaction is stated as $-\\frac{1}{2} \\frac{\\mathrm{~d}[x]}{\\mathrm{dt}}=-\\frac{\\mathrm{d}[\\mathrm{y}]}{\\mathrm{dt}}=\\frac{1}{2} \\frac{\\mathrm{~d}[\\mathrm{z}]}{\\mathrm{dt}}$, identify the reaction.", "image": null}, "options": [{"id": "4pWRv", "text": "$x-2 y \\rightarrow 2 z$", "image": null, "isCorrect": false}, {"id": "obn6I", "text": "$2 x+y \\rightarrow 2 z$", "image": null, "isCorrect": true}, {"id": "hqwp3", "text": "$x+\\mathrm{y} \\rightarrow \\mathrm{z}$", "image": null, "isCorrect": false}, {"id": "0f3z3", "text": "$2 x-2 y \\rightarrow z$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a general reaction $aA + bB \\rightarrow cC$, the rate of reaction is given by:<br><br>$\\text{Rate} = -\\dfrac{1}{a} \\dfrac{\\mathrm{d}[A]}{\\mathrm{dt}} = -\\dfrac{1}{b} \\dfrac{\\mathrm{d}[B]}{\\mathrm{dt}} = \\dfrac{1}{c} \\dfrac{\\mathrm{d}[C]}{\\mathrm{dt}}$<br><br>The given rate expression is:<br><br>$-\\dfrac{1}{2} \\dfrac{\\mathrm{d}[x]}{\\mathrm{dt}} = -\\dfrac{\\mathrm{d}[y]}{\\mathrm{dt}} = \\dfrac{1}{2} \\dfrac{\\mathrm{d}[z]}{\\mathrm{dt}}$<br><br>The negative signs indicate that $x$ and $y$ are reactants, while the positive sign indicates that $z$ is a product.<br><br>Comparing the given expression with the general rate equation, the stoichiometric coefficients are $2$ for $x$, $1$ for $y$, and $2$ for $z$.<br><br>Therefore, the balanced chemical equation is $2x + y \\rightarrow 2z$.<br><br>Answer: $2 x+y \\rightarrow 2 z$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b89bf9280d7f9932a27", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Find the rate of following reaction.\n$2 \\mathrm{~N}_2 \\mathrm{O}_{5(\\mathrm{~g})} \\rightarrow 4 \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})}$\nif concentration of $\\mathrm{NO}_2$ increases to $5.2 \\times 10^{-3} \\mathrm{M}$ in 100 seconds.", "image": null}, "options": [{"id": "rAB3u", "text": "$1.3 \\times 10^{-3} \\mathrm{~mol} \\quad \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "Tc75L", "text": "$1.3 \\times 10^{-5} \\mathrm{~mol} \\quad \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "Sdp0H", "text": "$4.0 \\times 10^{-5} \\mathrm{~mol} \\quad \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "M5hqD", "text": "$5.2 \\times 10^{-5} \\mathrm{~mol} \\quad \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is $2 \\mathrm{N}_2 \\mathrm{O}_{5(\\mathrm{g})} \\rightarrow 4 \\mathrm{NO}_{2(\\mathrm{g})} + \\mathrm{O}_{2(\\mathrm{g})}$.<br><br>The rate of reaction is given by:<br><br>$\\text{Rate} = \\dfrac{1}{4} \\dfrac{\\Delta[\\mathrm{NO}_2]}{\\Delta t}$<br><br>Given that the concentration of $\\mathrm{NO}_2$ increases to $5.2 \\times 10^{-3} \\mathrm{M}$ in $100 \\mathrm{s}$, the rate of formation of $\\mathrm{NO}_2$ is:<br><br>$\\dfrac{\\Delta[\\mathrm{NO}_2]}{\\Delta t} = \\dfrac{5.2 \\times 10^{-3} \\mathrm{M}}{100 \\mathrm{s}} = 5.2 \\times 10^{-5} \\mathrm{mol} \\mathrm{dm}^{-3} \\mathrm{s}^{-1}$<br><br>Substituting this into the rate expression:<br><br>$\\text{Rate} = \\dfrac{1}{4} \\times 5.2 \\times 10^{-5} = 1.3 \\times 10^{-5} \\mathrm{mol} \\mathrm{dm}^{-3} \\mathrm{s}^{-1}$<br><br>Answer: $1.3 \\times 10^{-5} \\mathrm{~mol} \\quad \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7bbf9280d7f99329a7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Nitric oxide reacts with $\\mathrm{H}_2$ according to reaction. \n$2 \\mathrm{NO}_{(\\mathrm{g})}+2 \\mathrm{H}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{N}_{2(\\mathrm{~g})}+2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}$\nIdentify the correct relationship for consumption of reactant and formation of product.", "image": null}, "options": [{"id": "EIlm8", "text": "$\\frac{1}{2} \\frac{\\mathrm{~d}[\\mathrm{NO}]}{\\mathrm{dt}}=-\\frac{\\mathrm{d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}, {"id": "shkI3", "text": "$\\frac{\\mathrm{d}\\left[\\mathrm{N}_2\\right]}{\\mathrm{dt}}=-\\frac{1}{2} \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": true}, {"id": "sW79K", "text": "$\\frac{\\mathrm{d}\\left[\\mathrm{H}_2 \\mathrm{O}\\right]}{\\mathrm{dt}}=\\frac{\\mathrm{d}\\left[\\mathrm{N}_2\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}, {"id": "0CXZi", "text": "$\\frac{\\mathrm{d}\\left[\\mathrm{H}_2 \\mathrm{O}\\right]}{\\mathrm{dt}}=\\frac{1}{2} \\frac{\\mathrm{~d}\\left[\\mathrm{~N}_2\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the given reaction:<br><br>$2 \\mathrm{NO}_{(\\mathrm{g})} + 2 \\mathrm{H}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{N}_{2(\\mathrm{~g})} + 2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}$<br><br>The rate of reaction is expressed in terms of the rate of consumption of reactants and the rate of formation of products as:<br><br>$\\text{Rate} = -\\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{NO}]}{\\mathrm{dt}} = -\\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{H}_2]}{\\mathrm{dt}} = \\dfrac{\\mathrm{d}[\\mathrm{N}_2]}{\\mathrm{dt}} = \\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{H}_2\\mathrm{O}]}{\\mathrm{dt}}$<br><br>Equating the rate of formation of $\\mathrm{N}_2$ and the rate of consumption of $\\mathrm{H}_2$, we get:<br><br>$\\dfrac{\\mathrm{d}[\\mathrm{N}_2]}{\\mathrm{dt}} = -\\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{H}_2]}{\\mathrm{dt}}$<br><br>Answer: $\\frac{\\mathrm{d}\\left[\\mathrm{N}_2\\right]}{\\mathrm{dt}}=-\\frac{1}{2} \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6abf9280d7f99328fc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Nitric oxide reacts with $\\mathrm{H}_2$ according to reaction. $2 \\mathrm{NO}_{(\\mathrm{g})}+2 \\mathrm{H}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{N}_{2(\\mathrm{~g})}+2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}$, identify correct relation for disappearance of reactant and appearance of product.", "image": null}, "options": [{"id": "9dO9R", "text": "$\\frac{1}{2} \\frac{\\mathrm{~d}[\\mathrm{NO}]}{\\mathrm{dt}}=-\\frac{\\mathrm{d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}, {"id": "b0KdG", "text": "$\\frac{\\mathrm{d}\\left[\\mathrm{N}_2\\right]}{\\mathrm{dt}}=\\frac{1}{2} \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2 \\mathrm{O}\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": true}, {"id": "4hY11", "text": "$-\\frac{\\mathrm{d}\\left[\\mathrm{N}_2\\right]}{\\mathrm{dt}}=\\frac{1}{2} \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2 \\mathrm{O}\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}, {"id": "hy6SD", "text": "$\\frac{\\mathrm{d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}=-\\frac{1}{2} \\frac{\\mathrm{~d}\\left[\\mathrm{~N}_2\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the given reaction:<br><br>$2 \\mathrm{NO}_{(\\mathrm{g})} + 2 \\mathrm{H}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{N}_{2(\\mathrm{~g})} + 2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}$<br><br>The rate of reaction is expressed in terms of the rate of disappearance of reactants and the rate of appearance of products as follows:<br><br>$\\text{Rate} = -\\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{NO}]}{\\mathrm{dt}} = -\\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{H}_2]}{\\mathrm{dt}} = \\dfrac{\\mathrm{d}[\\mathrm{N}_2]}{\\mathrm{dt}} = \\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{H}_2\\mathrm{O}]}{\\mathrm{dt}}$<br><br>Equating the terms for the products $\\mathrm{N}_2$ and $\\mathrm{H}_2\\mathrm{O}$, we get:<br><br>$\\dfrac{\\mathrm{d}[\\mathrm{N}_2]}{\\mathrm{dt}} = \\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{H}_2\\mathrm{O}]}{\\mathrm{dt}}$<br><br>Answer: $\\frac{\\mathrm{d}\\left[\\mathrm{N}_2\\right]}{\\mathrm{dt}}=\\frac{1}{2} \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2 \\mathrm{O}\\right]}{\\mathrm{dt}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b58bf9280d7f993286c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Nitric oxide reacts with $\\mathrm{H}_2$ according to reaction, $2 \\mathrm{NO}_{(\\mathrm{g})}+2 \\mathrm{H}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{N}_{2(\\mathrm{~g})}+2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}$, identify the correct relationship among the following.", "image": null}, "options": [{"id": "OLeRD", "text": "$-\\frac{1}{2} \\frac{\\mathrm{~d}[\\mathrm{NO}]}{\\mathrm{dt}}=\\frac{\\mathrm{d}\\left[\\mathrm{H}_2 \\mathrm{O}\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}, {"id": "wZ29J", "text": "$-\\frac{\\mathrm{d}[\\mathrm{NO}]}{\\mathrm{dt}}=\\frac{\\mathrm{d}\\left[\\mathrm{H}_2 \\mathrm{O}\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": true}, {"id": "mX0DU", "text": "$-\\frac{3}{2} \\frac{\\mathrm{~d}[\\mathrm{NO}]}{\\mathrm{dt}}=\\frac{\\mathrm{d}\\left[\\mathrm{H}_2 \\mathrm{O}\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}, {"id": "xrzfM", "text": "$2 \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}=\\frac{\\mathrm{d}\\left[\\mathrm{N}_2\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the given reaction:<br><br>$2 \\mathrm{NO}_{(\\mathrm{g})} + 2 \\mathrm{H}_{2(\\mathrm{~g})} \\rightarrow \\mathrm{N}_{2(\\mathrm{~g})} + 2 \\mathrm{H}_2 \\mathrm{O}_{(\\mathrm{g})}$<br><br>The rate of the reaction can be expressed in terms of the rate of disappearance of reactants and the rate of appearance of products as follows:<br><br>$\\text{Rate} = -\\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{NO}]}{\\mathrm{dt}} = -\\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{H}_2]}{\\mathrm{dt}} = \\dfrac{\\mathrm{d}[\\mathrm{N}_2]}{\\mathrm{dt}} = \\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{H}_2\\mathrm{O}]}{\\mathrm{dt}}$<br><br>Equating the terms for $\\mathrm{NO}$ and $\\mathrm{H}_2\\mathrm{O}$:<br><br>$-\\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{NO}]}{\\mathrm{dt}} = \\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{H}_2\\mathrm{O}]}{\\mathrm{dt}}$<br><br>Multiplying both sides by $2$, we get:<br><br>$-\\dfrac{\\mathrm{d}[\\mathrm{NO}]}{\\mathrm{dt}} = \\dfrac{\\mathrm{d}[\\mathrm{H}_2\\mathrm{O}]}{\\mathrm{dt}}$<br><br>Answer: $-\\frac{\\mathrm{d}[\\mathrm{NO}]}{\\mathrm{dt}}=\\frac{\\mathrm{d}\\left[\\mathrm{H}_2 \\mathrm{O}\\right]}{\\mathrm{dt}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b28bf9280d7f99326c7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following equations is correct regarding rate of disappearance of reactant and appearance of product for $\\mathrm{N}_{2(g)}+3 \\mathrm{H}_{2(g)} \\rightarrow 2 \\mathrm{NH}_{3(g)}$", "image": null}, "options": [{"id": "Mfbcb", "text": "$3 \\frac{\\mathrm{~d}\\left[\\mathrm{~N}_2\\right]}{\\mathrm{dt}}=\\frac{1}{2} \\frac{\\mathrm{~d}\\left[\\mathrm{~N}_2\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}, {"id": "6BZ95", "text": "$\\frac{1}{2} \\frac{\\mathrm{~d}\\left[\\mathrm{~N}_2\\right]}{\\mathrm{dt}}=\\frac{1}{3} \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}, {"id": "INsfE", "text": "$2 \\frac{\\mathrm{~d}\\left[\\mathrm{NH}_3\\right]}{\\mathrm{dt}}=3 \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}, {"id": "M5nwy", "text": "$3 \\frac{\\mathrm{~d}\\left[\\mathrm{NH}_3\\right]}{\\mathrm{dt}}=-2 \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For the given reaction $\\mathrm{N}_{2(g)} + 3 \\mathrm{H}_{2(g)} \\rightarrow 2 \\mathrm{NH}_{3(g)}$, the rate of reaction is expressed as:<br><br>$\\text{Rate} = -\\dfrac{\\mathrm{d}[\\mathrm{N}_2]}{\\mathrm{dt}} = -\\dfrac{1}{3} \\dfrac{\\mathrm{d}[\\mathrm{H}_2]}{\\mathrm{dt}} = \\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{NH}_3]}{\\mathrm{dt}}$<br><br>Equating the terms for $\\mathrm{H}_2$ and $\\mathrm{NH}_3$:<br><br>$-\\dfrac{1}{3} \\dfrac{\\mathrm{d}[\\mathrm{H}_2]}{\\mathrm{dt}} = \\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{NH}_3]}{\\mathrm{dt}}$<br><br>Multiplying both sides by $6$ gives:<br><br>$-2 \\dfrac{\\mathrm{d}[\\mathrm{H}_2]}{\\mathrm{dt}} = 3 \\dfrac{\\mathrm{d}[\\mathrm{NH}_3]}{\\mathrm{dt}}$<br><br>Answer: $3 \\frac{\\mathrm{~d}\\left[\\mathrm{NH}_3\\right]}{\\mathrm{dt}}=-2 \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b12bf9280d7f993260d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following is a currect representation of reaction rate for reaction stated below?\n$\\mathrm{N}_{2(\\mathrm{~g})}+3 \\mathrm{H}_{2(\\mathrm{~g})} \\rightleftharpoons 2 \\mathrm{NH}_{3(\\mathrm{~g})}$", "image": null}, "options": [{"id": "J3mVZ", "text": "$\\frac{\\mathrm{d}\\left[\\mathrm{N}_2\\right]}{\\mathrm{dt}}=-3 \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}=2 \\frac{\\mathrm{~d}\\left[\\mathrm{NH}_3\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}, {"id": "JaFpw", "text": "$\\frac{\\mathrm{d}\\left[\\mathrm{N}_2\\right]}{\\mathrm{dt}}=-\\frac{1}{3} \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}=\\frac{1}{2} \\frac{\\mathrm{~d}\\left[\\mathrm{NH}_3\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}, {"id": "0BNuT", "text": "$-\\frac{\\mathrm{d}\\left[\\mathrm{N}_2\\right]}{\\mathrm{dt}}=-\\frac{1}{3} \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}=\\frac{1}{2} \\frac{\\mathrm{~d}\\left[\\mathrm{NH}_3\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": true}, {"id": "NGQdb", "text": "$\\frac{\\mathrm{d}\\left[\\mathrm{N}_2\\right]}{\\mathrm{dt}}=\\frac{1}{3} \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}=-\\frac{1}{2} \\frac{\\mathrm{~d}\\left[\\mathrm{NH}_3\\right]}{\\mathrm{dt}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a general chemical reaction $aA + bB \\rightarrow cC + dD$, the rate of reaction is expressed as:<br><br>Rate $= -\\dfrac{1}{a} \\dfrac{\\mathrm{d}[A]}{\\mathrm{dt}} = -\\dfrac{1}{b} \\dfrac{\\mathrm{d}[B]}{\\mathrm{dt}} = \\dfrac{1}{c} \\dfrac{\\mathrm{d}[C]}{\\mathrm{dt}} = \\dfrac{1}{d} \\dfrac{\\mathrm{d}[D]}{\\mathrm{dt}}$<br><br>For the given reaction:<br><br>$\\mathrm{N}_{2(\\mathrm{g})} + 3 \\mathrm{H}_{2(\\mathrm{g})} \\rightleftharpoons 2 \\mathrm{NH}_{3(\\mathrm{g})}$<br><br>The rate of reaction is given by the rate of disappearance of reactants and the rate of appearance of products, divided by their respective stoichiometric coefficients:<br><br>Rate $= -\\dfrac{\\mathrm{d}[\\mathrm{N}_2]}{\\mathrm{dt}} = -\\dfrac{1}{3} \\dfrac{\\mathrm{d}[\\mathrm{H}_2]}{\\mathrm{dt}} = \\dfrac{1}{2} \\dfrac{\\mathrm{d}[\\mathrm{NH}_3]}{\\mathrm{dt}}$<br><br>Answer: $-\\frac{\\mathrm{d}\\left[\\mathrm{N}_2\\right]}{\\mathrm{dt}}=-\\frac{1}{3} \\frac{\\mathrm{~d}\\left[\\mathrm{H}_2\\right]}{\\mathrm{dt}}=\\frac{1}{2} \\frac{\\mathrm{~d}\\left[\\mathrm{NH}_3\\right]}{\\mathrm{dt}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871affbf9280d7f9932574", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "For the reaction, $\\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{CO}_{(\\mathrm{g})} \\rightarrow \\mathrm{NO}_{(\\mathrm{g})}+\\mathrm{CO}_{2(\\mathrm{~g})}$, rate of formation of $\\mathrm{NO}_{(\\mathrm{g})}$ is $\\mathrm{Y} \\mathrm{~mol~} \\mathrm{dm}{ }^{-3} \\mathrm{~s}^{-1}$. Find the rate of disappearance of $\\mathrm{CO}_{(\\mathrm{g})}$.", "image": null}, "options": [{"id": "tseNL", "text": "\\(\\mathrm{Y} \\mathrm{~mol~} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}\\)", "image": null, "isCorrect": true}, {"id": "r0rxD", "text": "\\(2 \\mathrm{Y} \\mathrm{~mol~} \\mathrm{dm}{ }^{-3} \\mathrm{~s}^{-1}\\)", "image": null, "isCorrect": false}, {"id": "KJDGH", "text": "\\(\\frac{\\mathrm{Y}}{2} \\mathrm{~mol~} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}\\)", "image": null, "isCorrect": false}, {"id": "JBrwJ", "text": "\\(\\frac{3}{2} Y \\mathrm{~mol~} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the given reaction:<br><br>$\\mathrm{NO}_{2(\\mathrm{g})} + \\mathrm{CO}_{(\\mathrm{g})} \\rightarrow \\mathrm{NO}_{(\\mathrm{g})} + \\mathrm{CO}_{2(\\mathrm{g})}$<br><br>The rate of reaction is given by:<br><br>$\\text{Rate} = -\\dfrac{d[\\mathrm{NO}_2]}{dt} = -\\dfrac{d[\\mathrm{CO}]}{dt} = +\\dfrac{d[\\mathrm{NO}]}{dt} = +\\dfrac{d[\\mathrm{CO}_2]}{dt}$<br><br>Given that the rate of formation of $\\mathrm{NO}_{(\\mathrm{g})}$ is:<br><br>$+\\dfrac{d[\\mathrm{NO}]}{dt} = \\mathrm{Y} \\text{ mol dm}^{-3} \\text{ s}^{-1}$<br><br>The rate of disappearance of $\\mathrm{CO}_{(\\mathrm{g})}$ is $-\\dfrac{d[\\mathrm{CO}]}{dt}$.<br><br>From the rate equation:<br><br>$-\\dfrac{d[\\mathrm{CO}]}{dt} = +\\dfrac{d[\\mathrm{NO}]}{dt} = \\mathrm{Y} \\text{ mol dm}^{-3} \\text{ s}^{-1}$<br><br>Thus, the rate of disappearance of $\\mathrm{CO}_{(\\mathrm{g})}$ is $\\mathrm{Y} \\text{ mol dm}^{-3} \\text{ s}^{-1}$.<br><br>Answer: \\(\\mathrm{Y} \\mathrm{~mol~} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214480aee93fa0796df6e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "For the reaction,\r\n$\\mathrm{CH}_3 \\mathrm{Br}_{(\\mathrm{aq})}+\\mathrm{OH}_{(\\mathrm{aq})}^{-} \\longrightarrow \\mathrm{CH}_3 \\mathrm{OH}_{(\\mathrm{aq})}+\\mathrm{Br}_{(\\mathrm{aq})}^{-}$\r\nrate of consumption of $\\mathrm{OH}_{(\\mathrm{aq})}^{-}$is $\\mathrm{x} \\mathrm{mol} \\mathrm{dm}{ }^{-3} \\mathrm{~s}^{-1}$ What is the rate of formation of $\\mathrm{Br}_{(\\mathrm{aq})}^{-}$?", "image": null}, "options": [{"id": "CWBQT", "text": "$0.5 \\mathrm{x} \\mathrm{mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "io6Wy", "text": "$\\mathrm{x} \\mathrm{mol} \\mathrm{dm}{ }^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "rBsqv", "text": "$2 \\mathrm{x} \\mathrm{mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "BXTBN", "text": "$\\frac{3}{2} \\mathrm{x} \\mathrm{mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is:<br><br>$\\mathrm{CH}_3\\mathrm{Br}_{(\\mathrm{aq})} + \\mathrm{OH}_{(\\mathrm{aq})}^{-} \\rightarrow \\mathrm{CH}_3\\mathrm{OH}_{(\\mathrm{aq})} + \\mathrm{Br}_{(\\mathrm{aq})}^{-}$<br><br>The rate of reaction can be expressed as:<br><br>Rate $= -\\dfrac{d[\\mathrm{CH}_3\\mathrm{Br}]}{dt} = -\\dfrac{d[\\mathrm{OH}^{-}]}{dt} = \\dfrac{d[\\mathrm{CH}_3\\mathrm{OH}]}{dt} = \\dfrac{d[\\mathrm{Br}^{-}]}{dt}$<br><br>Given that the rate of consumption of $\\mathrm{OH}^{-}$ is $x \\text{ mol dm}^{-3} \\text{ s}^{-1}$, we have:<br><br>$-\\dfrac{d[\\mathrm{OH}^{-}]}{dt} = x \\text{ mol dm}^{-3} \\text{ s}^{-1}$<br><br>From the rate expression, the rate of formation of $\\mathrm{Br}^{-}$ is equal to the rate of consumption of $\\mathrm{OH}^{-}$:<br><br>$\\dfrac{d[\\mathrm{Br}^{-}]}{dt} = x \\text{ mol dm}^{-3} \\text{ s}^{-1}$<br><br>Answer: $\\mathrm{x} \\mathrm{mol} \\mathrm{dm}{ }^{-3} \\mathrm{~s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214230aee93fa0796de48", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "For a reaction $r=k[A][B]^2$, if concentration of $A$ is doubled the rate of reaction", "image": null}, "options": [{"id": "99RE7", "text": "increases by a factor of 2", "image": null, "isCorrect": true}, {"id": "jn2yE", "text": "decreases by $\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "mOvYK", "text": "increases by a factor of 4", "image": null, "isCorrect": false}, {"id": "Elp58", "text": "decreases by 2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given rate law is $r = k[A][B]^2$.<br><br>When the concentration of $A$ is doubled, the new concentration becomes $[A]' = 2[A]$.<br><br>The new rate of reaction is $r' = k[A]'[B]^2$.<br><br>Substituting $[A]' = 2[A]$, we get:<br><br>$r' = k(2[A])[B]^2 = 2k[A][B]^2 = 2r$<br><br>Thus, the rate of reaction increases by a factor of 2.<br><br>Answer: increases by a factor of 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141f0aee93fa0796de27", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "The reaction given below $2 \\mathrm{NH}_{3(\\mathrm{~g})} \\xrightarrow{\\mathrm{Pt}} \\mathrm{N}_{2(\\mathrm{~g})}+3 \\mathrm{H}_{2(\\mathrm{~g})}$ has rate of reaction $2.5 \\times 10^{-6} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$. What is the rate of formation of $\\mathrm{H}_{2(\\mathrm{~g})}$ ?", "image": null}, "options": [{"id": "OzGTe", "text": "$2.5 \\times 10^{-6} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "7Nqcg", "text": "$3.75 \\times 10^{-6} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "IJjTX", "text": "$5.0 \\times 10^{-6} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "vtElc", "text": "$7.5 \\times 10^{-6} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For the reaction $2 \\mathrm{NH}_{3(\\mathrm{g})} \\xrightarrow{\\mathrm{Pt}} \\mathrm{N}_{2(\\mathrm{g})} + 3 \\mathrm{H}_{2(\\mathrm{g})}$, the rate of reaction is given by:<br><br>$\\text{Rate} = -\\dfrac{1}{2} \\dfrac{d[\\mathrm{NH}_3]}{dt} = \\dfrac{d[\\mathrm{N}_2]}{dt} = \\dfrac{1}{3} \\dfrac{d[\\mathrm{H}_2]}{dt}$<br><br>Given that the rate of reaction is $2.5 \\times 10^{-6} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$.<br><br>The rate of formation of $\\mathrm{H}_2$ is $\\dfrac{d[\\mathrm{H}_2]}{dt}$.<br><br>$\\dfrac{1}{3} \\dfrac{d[\\mathrm{H}_2]}{dt} = \\text{Rate}$<br><br>$\\dfrac{d[\\mathrm{H}_2]}{dt} = 3 \\times \\text{Rate}$<br><br>$\\dfrac{d[\\mathrm{H}_2]}{dt} = 3 \\times 2.5 \\times 10^{-6} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$<br><br>$\\dfrac{d[\\mathrm{H}_2]}{dt} = 7.5 \\times 10^{-6} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$<br><br>Answer: $7.5 \\times 10^{-6} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fb0aee93fa0796dd10", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Rate law for a reaction is $\\mathrm{r}=\\mathrm{k}[\\mathrm{A}]^2[\\mathrm{~B}]$. If rate constant is $6.25 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}$, what is the rate of reaction when $[\\mathrm{A}]=1 \\mathrm{~mol} \\mathrm{dm}^{-3}$ and $[\\mathrm{B}]=0.2 \\mathrm{~mol} \\mathrm{dm}^{-3}$ ?", "image": null}, "options": [{"id": "oDgmp", "text": "$1.250 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": true}, {"id": "VBLMs", "text": "$2.125 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "sBJhe", "text": "$3.105 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "BflBr", "text": "$2.0 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given rate law is $r = k[A]^2[B]$.<br><br>Substituting the given values into the rate law:<br><br>$k = 6.25 \\text{ mol}^{-2} \\text{ dm}^6 \\text{ s}^{-1}$<br><br>$[A] = 1 \\text{ mol dm}^{-3}$<br><br>$[B] = 0.2 \\text{ mol dm}^{-3}$<br><br>$r = 6.25 \\times (1)^2 \\times 0.2$<br><br>$r = 1.250 \\text{ mol dm}^{-3} \\text{ s}^{-1}$<br><br>Answer: $1.250 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f80aee93fa0796dcf5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "If instantaneous rate of reaction is given as $-\\frac{1}{a} \\frac{\\mathrm{d}[\\mathrm{A}]}{\\mathrm{d}t} = -\\frac{1}{b} \\frac{\\mathrm{d}[\\mathrm{B}]}{\\mathrm{d}t} = \\frac{1}{c} \\frac{\\mathrm{d}[\\mathrm{C}]}{\\mathrm{d}t} = \\frac{1}{d} \\frac{\\mathrm{d}[\\mathrm{D}]}{\\mathrm{d}t}$, the reaction is represented as,", "image": null}, "options": [{"id": "bJnUc", "text": "$\\mathrm{A}+\\mathrm{B} \\longrightarrow \\mathrm{C}+\\mathrm{D}$", "image": null, "isCorrect": false}, {"id": "fZBiD", "text": "$\\quad \\mathrm{aA}+\\mathrm{B} \\longrightarrow \\mathrm{cC}+\\mathrm{dD}$", "image": null, "isCorrect": false}, {"id": "o84cg", "text": "$\\mathrm{aA}+\\mathrm{bB} \\rightarrow \\mathrm{cC}+\\mathrm{dD}$", "image": null, "isCorrect": true}, {"id": "K4OLo", "text": "$\\mathrm{aA}+\\mathrm{bB} \\longrightarrow \\mathrm{C}+\\mathrm{D}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate of reaction is given by the rate of disappearance of reactants divided by their stoichiometric coefficients, which is equal to the rate of appearance of products divided by their stoichiometric coefficients.<br><br>Given the rate expression:<br>$-\\dfrac{1}{a} \\dfrac{\\mathrm{d}[\\mathrm{A}]}{\\mathrm{d}t} = -\\dfrac{1}{b} \\dfrac{\\mathrm{d}[\\mathrm{B}]}{\\mathrm{d}t} = \\dfrac{1}{c} \\dfrac{\\mathrm{d}[\\mathrm{C}]}{\\mathrm{d}t} = \\dfrac{1}{d} \\dfrac{\\mathrm{d}[\\mathrm{D}]}{\\mathrm{d}t}$<br><br>The negative sign indicates that $\\mathrm{A}$ and $\\mathrm{B}$ are reactants, while the positive sign indicates that $\\mathrm{C}$ and $\\mathrm{D}$ are products. The denominators $a, b, c, d$ represent the stoichiometric coefficients of $\\mathrm{A}, \\mathrm{B}, \\mathrm{C}, \\mathrm{D}$ respectively.<br><br>Thus, the balanced chemical equation is:<br>$a\\mathrm{A} + b\\mathrm{B} \\rightarrow c\\mathrm{C} + d\\mathrm{D}$<br><br>Answer: $\\mathrm{aA}+\\mathrm{bB} \\rightarrow \\mathrm{cC}+\\mathrm{dD}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e60aee93fa0796dc66", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Which of the following is an elementary reaction?", "image": null}, "options": [{"id": "Kbmst", "text": "$\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{I}_{(\\mathrm{g})} \\longrightarrow \\mathrm{C}_2 \\mathrm{H}_{4(\\mathrm{~g})}+\\mathrm{HI}_{(\\mathrm{g})}$", "image": null, "isCorrect": true}, {"id": "DlFaB", "text": "$\\mathrm{NO}_2 \\mathrm{Cl}_{(\\mathrm{g})} \\longrightarrow 2 \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{Cl}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "e2SVM", "text": "$2 \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{F}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{NO}_2 \\mathrm{~F}_{(\\mathrm{g})}$", "image": null, "isCorrect": false}, {"id": "XuwWa", "text": "$\\mathrm{NO}_{(\\mathrm{g})}+\\mathrm{Cl}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{NaCl}_{(\\mathrm{g})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "An elementary reaction is a chemical reaction that occurs in a single step and cannot be broken down into simpler steps.<br><br>The decomposition of ethyl iodide, $\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{I}_{(\\mathrm{g})} \\longrightarrow \\mathrm{C}_2 \\mathrm{H}_{4(\\mathrm{~g})}+\\mathrm{HI}_{(\\mathrm{g})}$, is a unimolecular elementary reaction.<br><br>The other given reactions, such as $2 \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{F}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{NO}_2 \\mathrm{F}_{(\\mathrm{g})}$ and the decomposition of $\\mathrm{NO}_2\\mathrm{Cl}$, are complex reactions that take place in multiple steps.<br><br>Answer: $\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{I}_{(\\mathrm{g})} \\longrightarrow \\mathrm{C}_2 \\mathrm{H}_{4(\\mathrm{~g})}+\\mathrm{HI}_{(\\mathrm{g})}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213af0aee93fa0796dabb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "For the reaction, $\\mathrm{N}_{2(\\mathrm{~g})}+3 \\mathrm{H}_{2(\\mathrm{~g})} \\longrightarrow 2 \\mathrm{NH}_{3(\\mathrm{~g})}$ $\\mathrm{NH}_3$ is formed at a rate of $0.088 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$. Calculate consumption rate of $\\mathrm{N}_{2(\\mathrm{~g})}$.", "image": null}, "options": [{"id": "w7YOw", "text": "$0.011 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "MYcS8", "text": "$0.022 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "1OFOQ", "text": "$0.033 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "HYwbW", "text": "$0.044 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given reaction is $\\mathrm{N}_{2(\\mathrm{g})} + 3\\mathrm{H}_{2(\\mathrm{g})} \\longrightarrow 2\\mathrm{NH}_{3(\\mathrm{g})}$<br><br>The rate of reaction can be expressed as:<br><br>$-\\dfrac{d[\\mathrm{N}_2]}{dt} = -\\dfrac{1}{3}\\dfrac{d[\\mathrm{H}_2]}{dt} = \\dfrac{1}{2}\\dfrac{d[\\mathrm{NH}_3]}{dt}$<br><br>Given that the rate of formation of $\\mathrm{NH}_3$ is $\\dfrac{d[\\mathrm{NH}_3]}{dt} = 0.088 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$<br><br>The consumption rate of $\\mathrm{N}_2$ is $-\\dfrac{d[\\mathrm{N}_2]}{dt}$<br><br>$-\\dfrac{d[\\mathrm{N}_2]}{dt} = \\dfrac{1}{2} \\times 0.088 = 0.044 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$<br><br>Answer: $0.044 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ad0aee93fa0796daab", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "The reaction $2 \\mathrm{~A}+\\mathrm{B}+\\mathrm{C} \\longrightarrow \\mathrm{D}+\\mathrm{E}$ is found to. be first order in A , second order in B and zero order in C . What is the effect of increasing concentration of all reactants twice?", "image": null}, "options": [{"id": "zbtrv", "text": "Rate of reaction increases 8 times.", "image": null, "isCorrect": true}, {"id": "PyCU4", "text": "Rate of reaction increases 24 times.", "image": null, "isCorrect": false}, {"id": "GZwU8", "text": "Rate of reaction increases 36 times.", "image": null, "isCorrect": false}, {"id": "q4uk8", "text": "Rate of reaction remains unaffected.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The rate law for the given reaction is:<br><br>$r = k[A]^{1}[B]^{2}[C]^{0} = k[A][B]^{2}$<br><br>When the concentration of all reactants is doubled, the new concentrations become $[A]' = 2[A]$, $[B]' = 2[B]$, and $[C]' = 2[C]$.<br><br>The new rate of reaction is:<br><br>$r' = k(2[A])(2[B])^{2}$<br><br>$r' = k(2[A])(4[B]^{2})$<br><br>$r' = 8k[A][B]^{2}$<br><br>$r' = 8r$<br><br>The rate of reaction increases 8 times.<br><br>Answer: Rate of reaction increases 8 times.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213770aee93fa0796d8fe", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "For the reaction,\r\n$3 \\mathrm{I}^{-(\\mathrm{aq}, \\mathrm{~s})}+\\mathrm{S}_2 \\mathrm{O}_{8(\\mathrm{aq})}^{2-} \\longrightarrow 2 \\mathrm{SO}_{4(\\mathrm{aq},)}^{2-}+\\mathrm{I}_{3(\\mathrm{aq},)}^{-}$\r\nrate of formation of $\\mathrm{SO}_{4(\\mathrm{aq} .)}^{2-}$ is $0.044 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$.\r\nCalculate rate of consumptiuon of $\\mathrm{I}_{(\\mathrm{aq} .)}^{-}$.", "image": null}, "options": [{"id": "cYgKd", "text": "$0.022 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "DYnDt", "text": "$0.044 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "L6ZIg", "text": "$0.066 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "EiDMk", "text": "$0.088 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the stoichiometry of the given reaction, the relationship between the rates of consumption and formation is:<br><br>$-\\dfrac{1}{3} \\dfrac{d[\\mathrm{I}^{-}]}{dt} = \\dfrac{1}{2} \\dfrac{d[\\mathrm{SO}_{4}^{2-}]}{dt}$<br><br>Given that the rate of formation of $\\mathrm{SO}_{4}^{2-}$ is $\\dfrac{d[\\mathrm{SO}_{4}^{2-}]}{dt} = 0.044 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$.<br><br>The rate of consumption of $\\mathrm{I}^{-}$ is $-\\dfrac{d[\\mathrm{I}^{-}]}{dt}$.<br><br>$-\\dfrac{d[\\mathrm{I}^{-}]}{dt} = \\dfrac{3}{2} \\times \\dfrac{d[\\mathrm{SO}_{4}^{2-}]}{dt}$<br><br>$-\\dfrac{d[\\mathrm{I}^{-}]}{dt} = \\dfrac{3}{2} \\times 0.044 = 0.066 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$<br><br>Answer: $0.066 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213510aee93fa0796d7db", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "For a reaction,\r\n$2 \\mathrm{~N}_2 \\mathrm{O}_{5(\\mathrm{~g})} \\longrightarrow 4 \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})}$\r\n$\\mathrm{N}_2 \\mathrm{O}_5$ disappears at a rate of $0.06 \\mathrm{moldm}^{-3} \\mathrm{~s}^{-1}$. What is rate of $\\mathrm{NO}_{2(\\mathrm{~g})}$ formation?", "image": null}, "options": [{"id": "lFb2o", "text": "$0.06 \\mathrm{moldm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "xrzcV", "text": "$0.12 \\mathrm{moldm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "J2mMo", "text": "$\\quad 0 \\cdot 18 \\mathrm{moldm}^{-3} \\cdot \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "ckbfj", "text": "$0.24 \\mathrm{moldm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the given reaction:<br><br>$2 \\mathrm{N}_2 \\mathrm{O}_{5(\\mathrm{g})} \\longrightarrow 4 \\mathrm{NO}_{2(\\mathrm{g})} + \\mathrm{O}_{2(\\mathrm{g})}$<br><br>The rate of reaction can be expressed as:<br><br>$\\text{Rate} = -\\dfrac{1}{2} \\dfrac{d[\\mathrm{N}_2\\mathrm{O}_5]}{dt} = \\dfrac{1}{4} \\dfrac{d[\\mathrm{NO}_2]}{dt} = \\dfrac{d[\\mathrm{O}_2]}{dt}$<br><br>Given the rate of disappearance of $\\mathrm{N}_2\\mathrm{O}_5$ is $-\\dfrac{d[\\mathrm{N}_2\\mathrm{O}_5]}{dt} = 0.06 \\mathrm{mol} \\mathrm{dm}^{-3} \\mathrm{s}^{-1}$.<br><br>The rate of formation of $\\mathrm{NO}_2$ is:<br><br>$\\dfrac{d[\\mathrm{NO}_2]}{dt} = \\dfrac{4}{2} \\left( -\\dfrac{d[\\mathrm{N}_2\\mathrm{O}_5]}{dt} \\right)$<br><br>$\\dfrac{d[\\mathrm{NO}_2]}{dt} = 2 \\times 0.06 = 0.12 \\mathrm{mol} \\mathrm{dm}^{-3} \\mathrm{s}^{-1}$<br><br>Answer: $0.12 \\mathrm{moldm}^{-3} \\mathrm{~s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133d0aee93fa0796d73d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "For the reaction, $\\mathrm{A}+3 \\mathrm{~B} \\longrightarrow 2 \\mathrm{C}$ rate of consumption of A is $1.4 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$. Calculate rate of formation of C ?", "image": null}, "options": [{"id": "fORl3", "text": "$0.07 \\mathrm{moldm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "0cSkn", "text": "$1.4 \\mathrm{moldm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}, {"id": "OApTj", "text": "$2.8 \\mathrm{moldm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": true}, {"id": "JlqNA", "text": "$3.5 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{sec}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the given reaction $\\text{A} + 3\\text{B} \\longrightarrow 2\\text{C}$, the rate of reaction can be expressed as:<br><br>$\\text{Rate} = -\\dfrac{d[\\text{A}]}{dt} = -\\dfrac{1}{3}\\dfrac{d[\\text{B}]}{dt} = \\dfrac{1}{2}\\dfrac{d[\\text{C}]}{dt}$<br><br>Given that the rate of consumption of A is $-\\dfrac{d[\\text{A}]}{dt} = 1.4 \\text{ mol dm}^{-3} \\text{ sec}^{-1}$.<br><br>From the rate expression, we have:<br><br>$\\dfrac{1}{2}\\dfrac{d[\\text{C}]}{dt} = -\\dfrac{d[\\text{A}]}{dt}$<br><br>$\\dfrac{d[\\text{C}]}{dt} = 2 \\times \\left(-\\dfrac{d[\\text{A}]}{dt}\\right)$<br><br>$\\dfrac{d[\\text{C}]}{dt} = 2 \\times 1.4 = 2.8 \\text{ mol dm}^{-3} \\text{ sec}^{-1}$<br><br>The rate of formation of C is $2.8 \\text{ mol dm}^{-3} \\text{ sec}^{-1}$.<br><br>Answer: $2.8 \\mathrm{moldm}^{-3} \\mathrm{sec}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792132a0aee93fa0796d6a5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "What is the rate of formation of $\\mathrm{O}_2$ for the reaction stated below?\r\n$\\begin{aligned}\r\n& 2 \\mathrm{~N}_2 \\mathrm{O}_{5(\\mathrm{~g})} \\longrightarrow 4 \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})} \\\\\r\n& {\\left[\\dfrac{\\mathrm{d}\\left[\\mathrm{~N}_2 \\mathrm{O}_5\\right]}{\\mathrm{dt}}=0.02 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}\\right]}\r\n\\end{aligned}$", "image": null}, "options": [{"id": "XpxRR", "text": "$0.01 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "GSekP", "text": "$0.02 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "MMtY3", "text": "$0.03 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "c3wAs", "text": "$0.04 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the given reaction $2 \\mathrm{N}_2\\mathrm{O}_5 \\longrightarrow 4 \\mathrm{NO}_2 + \\mathrm{O}_2$, the rate of reaction is expressed as:<br><br>$\\text{Rate} = -\\dfrac{1}{2}\\dfrac{\\mathrm{d}[\\mathrm{N}_2\\mathrm{O}_5]}{\\mathrm{dt}} = \\dfrac{1}{4}\\dfrac{\\mathrm{d}[\\mathrm{NO}_2]}{\\mathrm{dt}} = \\dfrac{\\mathrm{d}[\\mathrm{O}_2]}{\\mathrm{dt}}$<br><br>The rate of disappearance of $\\mathrm{N}_2\\mathrm{O}_5$ is given as $0.02 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$.<br><br>The rate of formation of $\\mathrm{O}_2$ is:<br><br>$\\dfrac{\\mathrm{d}[\\mathrm{O}_2]}{\\mathrm{dt}} = \\dfrac{1}{2} \\left(-\\dfrac{\\mathrm{d}[\\mathrm{N}_2\\mathrm{O}_5]}{\\mathrm{dt}}\\right)$<br><br>$\\dfrac{\\mathrm{d}[\\mathrm{O}_2]}{\\mathrm{dt}} = \\dfrac{1}{2} \\times 0.02 = 0.01 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$<br><br>Answer: $0.01 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627e0279619d9d8a34fa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "For a reaction $\\mathrm{A}+\\mathrm{B} \\rightarrow$ products $\\Delta \\mathrm{H}$ is $-84.2 \\mathrm{~kJ}$ and $\\Delta \\mathrm{S}$ is $-200 \\mathrm{~J} \\mathrm{~K}^{-1}$. Calculate the highest value of temperature so that the reaction will proceed in forward direction.", "image": null}, "options": [{"id": "rDeWx", "text": "$421 \\mathrm{~K}$", "image": null, "isCorrect": true}, {"id": "Vausi", "text": "$237 \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "QVihI", "text": "$168 \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "RNs3M", "text": "$273 \\mathrm{~K}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n\\mathrm{T} & =\\frac{\\Delta \\mathrm{H}}{\\Delta \\mathrm{S}} \\\\\n\\therefore \\quad \\mathrm{T} & =\\frac{-84200 \\mathrm{~J}}{-200 \\mathrm{~J} \\mathrm{~K}^{-1}}=421 \\mathrm{~K}\n\\end{aligned}$\nSince $\\Delta H$ and $\\Delta S$ are negative, the reaction is spontaneous at low temperatures. Therefore, the highest temperature is $421 \\mathrm{~K}$ and the reaction will proceed in forward direction spontaneously below $421 \\mathrm{~K}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262580279619d9d8a33c8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "For the reaction,\n$$\n\\mathrm{CH}_3 \\mathrm{Br}_{(\\mathrm{aq})}+\\mathrm{OH}_{(\\mathrm{sq})}^{-} \\rightarrow \\mathrm{CH}_3 \\mathrm{OH}_{(\\mathrm{aq})}+\\mathrm{Br}_{(\\mathrm{aq})}^{-}\n$$\nthe rate law is rate $=\\mathrm{k}\\left[\\mathrm{CH}_3 \\mathrm{Br}\\right][\\mathrm{OH}]$. What is change in rate of reaction if concentration of both reactants is doubled?", "image": null}, "options": [{"id": "lwgzM", "text": "Rate increases by factor 2", "image": null, "isCorrect": false}, {"id": "G9Qqz", "text": "Rate increases by factor 4", "image": null, "isCorrect": true}, {"id": "c01nx", "text": "Rate remains same", "image": null, "isCorrect": false}, {"id": "UyTk9", "text": "Rate decreases by factor 2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Rate $=\\mathrm{k}\\left[\\mathrm{CH}_3 \\mathrm{Br}\\right][\\mathrm{OH}]$\n$(\\text { Rate })_1=\\mathrm{k} \\times 2\\left[\\mathrm{CH}_3 \\mathrm{Br}\\right] \\times 2\\left[\\mathrm{OH}^{-}\\right]$\n$=4 \\mathrm{k}\\left[\\mathrm{CH}_3 \\mathrm{Br}\\right][\\mathrm{OH}]$\n$\\therefore \\quad \\frac{\\text { (Rate })_1}{\\text { Rate }}=\\frac{4 \\mathrm{k}\\left[\\mathrm{CH}_3 \\mathrm{Br}\\right]\\left[\\mathrm{OH}^{-}\\right]}{\\mathrm{k}\\left[\\mathrm{CH}_3 \\mathrm{Br}\\right]\\left[\\mathrm{OH}^{-}\\right]}=4$\n$\\therefore \\quad(\\text { Rate })_1=4 \\times$ Rate", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262450279619d9d8a3331", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Find the rate of formation of $\\mathrm{NO}_{2(\\mathrm{~g})}$ in the following reaction.\n$$\n\\begin{aligned}\n& 2 \\mathrm{~N}_2 \\mathrm{O}_{5(\\mathrm{~g})} \\rightarrow 4 \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})} \\\\\n& {\\left[\\frac{-\\mathrm{d}\\left[\\mathrm{N}_2 \\mathrm{O}_5\\right]}{\\mathrm{dt}}=0.02 \\mathrm{~mol} \\mathrm{dm}^{-3}\\right]}\n\\end{aligned}\n$$", "image": null}, "options": [{"id": "OjaLX", "text": "$0.01 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "6seHS", "text": "$0.02 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "w0pWz", "text": "$0.03 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": false}, {"id": "fQswg", "text": "$0.04 \\mathrm{~mol} \\mathrm{dm}^{-3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\text { Rate of reaction } & =-\\frac{1}{2} \\frac{\\mathrm{d}\\left[\\mathrm{N}_2 \\mathrm{O}_5\\right]}{\\mathrm{dt}} \\\\ & =+\\frac{1}{4} \\frac{\\mathrm{d}\\left[\\mathrm{NO}_2\\right]}{\\mathrm{dt}}=\\frac{\\mathrm{d}\\left[\\mathrm{O}_2\\right]}{\\mathrm{dt}}\\end{aligned}$\nRate of formation of $\\begin{aligned} \\mathrm{NO}_2 & =\\frac{\\mathrm{d}\\left[\\mathrm{NO}_2\\right]}{\\mathrm{dt}} \\\\ & =-\\frac{4}{2} \\frac{\\mathrm{d}\\left[\\mathrm{N}_2 \\mathrm{O}_5\\right]}{\\mathrm{dt}} \\\\ & =-2 \\frac{\\mathrm{d}\\left[\\mathrm{N}_2 \\mathrm{O}_5\\right]}{\\mathrm{dt}} \\\\ & =2 \\times 0.02 \\\\ & =0.04 \\mathrm{~mol} \\mathrm{dm}^{-3}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262380279619d9d8a32c6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "The rate law for the reaction $\\mathrm{A}+\\mathrm{B} \\rightarrow \\mathrm{C}$ at $25^{\\circ} \\mathrm{C}$ is given by rate $=k[A][B]^2$. Calculate the rate of reaction if rate constant at same temperature is $6.25 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1}[[\\mathrm{~A}]=1 \\mathrm{M},[\\mathrm{B}]=0.2 \\mathrm{M}]$", "image": null}, "options": [{"id": "oRWvA", "text": "$0.25 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "CYdpO", "text": "$0.5 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "qs2IA", "text": "$0.75 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "Rm0uT", "text": "$1.25 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\text { Rate } & =\\mathrm{k}[\\mathrm{A}][\\mathrm{B}]^2 \\\\ & =6.25 \\mathrm{~mol}^{-2} \\mathrm{dm}^6 \\mathrm{~s}^{-1} \\times 1 \\mathrm{~mol} \\mathrm{dm}^{-3} \\\\ & \\quad \\times 0.2 \\mathrm{~mol} \\mathrm{dm}^{-3} \\times 0.2 \\mathrm{~mol} \\mathrm{dm}^{-3} \\\\ & =0.25 \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262120279619d9d8a318d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "Identify the expression for average rate for following reaction.\n$\\mathrm{N}_{2(\\mathrm{~g})}+3 \\mathrm{H}_{2(\\mathrm{~g})} \\rightarrow 2 \\mathrm{NH}_{3(\\mathrm{~g})}$", "image": null}, "options": [{"id": "DoeI3", "text": "$\\frac{-\\Delta\\left[\\mathrm{N}_2\\right]}{\\Delta \\mathrm{t}}=-\\frac{1}{3} \\frac{\\Delta\\left[\\mathrm{H}_2\\right]}{\\Delta \\mathrm{t}}=\\frac{1}{2} \\frac{\\Delta\\left[\\mathrm{NH}_3\\right]}{\\Delta \\mathrm{t}}$", "image": null, "isCorrect": true}, {"id": "UvWTM", "text": "$-\\frac{1}{3} \\frac{\\Delta\\left[\\mathrm{N}_2\\right]}{\\Delta \\mathrm{t}}=\\frac{\\Delta\\left[\\mathrm{H}_2\\right]}{\\Delta \\mathrm{t}}=\\frac{1}{2} \\frac{\\Delta\\left[\\mathrm{NH}_3\\right]}{\\Delta \\mathrm{t}}$", "image": null, "isCorrect": false}, {"id": "C3kow", "text": "$\\frac{-\\Delta\\left[\\mathrm{N}_2\\right]}{\\Delta \\mathrm{t}}=\\frac{-\\Delta\\left[\\mathrm{H}_2\\right]}{\\Delta \\mathrm{t}}=\\frac{\\Delta\\left[\\mathrm{NH}_3\\right]}{\\Delta \\mathrm{t}}$", "image": null, "isCorrect": false}, {"id": "3qEsg", "text": "$-\\frac{1}{2} \\frac{\\Delta\\left[\\mathrm{N}_2\\right]}{\\Delta \\mathrm{t}}=\\frac{-\\Delta\\left[\\mathrm{H}_2\\right]}{\\Delta \\mathrm{t}}=\\frac{1}{3} \\frac{\\Delta\\left[\\mathrm{NH}_3\\right]}{\\Delta \\mathrm{t}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the rate expression, always make sure to express the rates with the correct sign: Negative for the reactants and positive for the products.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fb0279619d9d8a30dd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "For an elementary reaction\n$$\n2 \\mathrm{~A}+\\mathrm{B} \\longrightarrow 3 \\mathrm{C}\n$$\nrate of appearance of $\\mathrm{C}$ is $1.3 \\times 10^{-4} \\mathrm{~mol} \\mathrm{~L}^{-1} \\mathrm{~s}^{-1}$, the rate of disappearance of $\\mathrm{A}$ is:", "image": null}, "options": [{"id": "pnCjG", "text": "$1.3 \\times 10^{-4} \\mathrm{~mol} \\mathrm{~L}^{-1} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "vE8dj", "text": "$2.6 \\times 10^{-4} \\mathrm{~mol} \\mathrm{~L}^{-1} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "gb42M", "text": "$5.2 \\times 10^{-4} \\mathrm{~mol} \\mathrm{~L}^{-1} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "Qhn8G", "text": "$8.66 \\times 10^{-5} \\mathrm{~mol} \\mathrm{~L}^{-1} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n\\text { Rate of reaction } & =-\\frac{1}{2} \\frac{\\mathrm{d}[\\mathrm{A}]}{\\mathrm{dt}}=-\\frac{\\mathrm{d}[\\mathrm{B}]}{\\mathrm{dt}}=\\frac{1}{3} \\frac{\\mathrm{d}[\\mathrm{C}]}{\\mathrm{dt}} \\\\\n\\text { Rate of reaction } & =\\frac{1}{3} \\frac{\\mathrm{d}[\\mathrm{C}]}{\\mathrm{dt}} \\\\\n& =\\frac{1}{3} \\times 1.3 \\times 10^{-4} \\mathrm{~mol} \\mathrm{~L}^{-1} \\mathrm{~s}^{-1} \\\\\n& =0.433 \\times 10^{-4} \\mathrm{~mol} \\mathrm{~L}^{-1} \\mathrm{~s}^{-1}\n\\end{aligned}\n$$\n$\\therefore \\quad$ Rate of disappearance of $\\mathrm{A}$\n$$\n\\begin{aligned}\n& =2 \\times 0.433 \\times 10^{-4} \\mathrm{~mol} \\mathrm{~L}^{-1} \\mathrm{~s}^{-1} \\\\\n& =0.866 \\times 10^{-4} \\mathrm{~mol} \\mathrm{~L}^{-1} \\mathrm{~s}^{-1} \\\\\n& =8.66 \\times 10^{-5} \\mathrm{~mol} \\mathrm{~L}^{-1} \\mathrm{~s}^{-1}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e80279619d9d8a3046", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "Find the average rate of formation of $\\mathrm{NO}_{2(\\mathrm{~g})}$, in following reaction.\n$2 \\mathrm{~N}_2 \\mathrm{O}_{5(\\mathrm{~g})} \\rightarrow 4 \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})}$\n$\\left[-\\frac{\\Delta\\left[\\mathrm{N}_2 \\mathrm{O}_5\\right]}{\\Delta \\mathrm{t}}\\right]=x \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null}, "options": [{"id": "LMEZ3", "text": "$x \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "tszyN", "text": "$\\frac{x}{2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}, {"id": "nLMcp", "text": "$2 x \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": true}, {"id": "kpRPe", "text": "$4 x \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\frac{-\\Delta\\left[\\mathrm{N}_2 \\mathrm{O}_5\\right]}{\\Delta \\mathrm{t}}=x \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1} \\\\\n& 2 \\mathrm{~N}_2 \\mathrm{O}_{5(\\mathrm{~g})} \\rightarrow 4 \\mathrm{NO}_{2(\\mathrm{~g})}+\\mathrm{O}_{2(\\mathrm{~g})}\n\\end{aligned}$\nAverage rate of reaction\n$\\begin{gathered}\n=-\\frac{1}{2} \\frac{\\Delta\\left[\\mathrm{N}_2 \\mathrm{O}_5\\right]}{\\Delta \\mathrm{t}}=\\frac{1}{4} \\frac{\\Delta\\left[\\mathrm{NO}_2\\right]}{\\Delta \\mathrm{t}}=\\frac{\\Delta\\left[\\mathrm{O}_2\\right]}{\\Delta \\mathrm{t}} \\\\\n\\therefore \\quad \\frac{\\Delta\\left[\\mathrm{NO}_2\\right]}{\\Delta \\mathrm{t}}=-\\frac{4}{2} \\frac{\\Delta\\left[\\mathrm{N}_2 \\mathrm{O}_5\\right]}{\\Delta \\mathrm{t}}=\\frac{4}{2} \\times x \\\\\n=2 x \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}\n\\end{gathered}$\n$\\therefore \\quad$ Average rate of formation of $\\mathrm{NO}_{2(\\mathrm{~g})}$ $=2 x \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$\n[Note: In the question, $\\frac{\\Delta\\left[\\mathrm{N}_2 \\mathrm{O}_5\\right]}{\\Delta \\mathrm{t}}$ is changed to $\\frac{-\\Delta\\left[\\mathrm{N}_2 \\mathrm{O}_5\\right]}{\\Delta \\mathrm{t}}$ to apply appropriate textual concepts.]", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d50279619d9d8a2fb3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "For the reaction, $3 \\mathrm{I}^{-}+\\mathrm{S}_2 \\mathrm{O}_8^{2-} \\rightarrow \\mathrm{I}_3^{-}+2 \\mathrm{SO}_4^{2-}$, at a particular time $\\mathrm{t}$, $\\frac{\\mathrm{d}\\left[\\mathrm{SO}_4^{2-}\\right]}{\\mathrm{dt}}$ is $2.2 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$. What is the value of $-\\frac{\\mathrm{d}\\left[\\mathrm{I}^{-}\\right]}{\\mathrm{dt}}$ ?", "image": null}, "options": [{"id": "HL3Sv", "text": "$1.1 \\times 10^{-2} \\mathrm{~mol} \\mathrm{dm}^{-3} \\mathrm{~s}^{-1}$", "image": null, "is
