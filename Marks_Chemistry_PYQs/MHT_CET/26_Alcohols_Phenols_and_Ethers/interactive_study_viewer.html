-chain alcohol (least branched).<br>2. 2-Methylpropan-1-ol has one branch.<br>3. Butan-2-ol is a secondary alcohol.<br>4. 2-Methylpropan-2-ol (tert-butyl alcohol) is a tertiary alcohol and is the most branched isomer.<br><br>Due to maximum branching, 2-methylpropan-2-ol has the most compact, spherical shape, resulting in the weakest intermolecular van der Waals forces. Therefore, it has the lowest boiling point.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/hDy9h3Oif4Z-F2UOLHTxHNlSsz72yACDdAAXCr2vBT4.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b29bf9280d7f99326ca", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following compounds has lowest boiling point?", "image": null}, "options": [{"id": "coVWM", "text": "$\\left(\\mathrm{C}_2 \\mathrm{H}_5\\right)_2 \\mathrm{NH}$", "image": null, "isCorrect": false}, {"id": "EqfP3", "text": "$\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{~N}\\left(\\mathrm{CH}_3\\right)_2$", "image": null, "isCorrect": true}, {"id": "pKY34", "text": "$\\mathrm{n}-\\mathrm{C}_4 \\mathrm{H}_9 \\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "D24GB", "text": "$\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{COOH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The boiling point of a compound depends on the strength of its intermolecular forces. The given compounds have comparable molecular masses but differ in their functional groups.<br><br>$\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{COOH}$ is a carboxylic acid, which forms strong intermolecular hydrogen bonds and exists as a dimer, resulting in the highest boiling point.<br><br>$\\mathrm{n}-\\mathrm{C}_4 \\mathrm{H}_9 \\mathrm{OH}$ is a primary alcohol, which also forms strong intermolecular hydrogen bonds due to the highly electronegative oxygen atom.<br><br>$\\left(\\mathrm{C}_2 \\mathrm{H}_5\\right)_2 \\mathrm{NH}$ is a secondary amine. It has one $\\mathrm{N}-\\mathrm{H}$ bond and can form intermolecular hydrogen bonds, but these are weaker than those in alcohols because nitrogen is less electronegative than oxygen.<br><br>$\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{N}\\left(\\mathrm{CH}_3\\right)_2$ is a tertiary amine. It lacks any hydrogen atom directly attached to the nitrogen atom, so it cannot form intermolecular hydrogen bonds. Its molecules are held together only by weak dipole-dipole interactions and van der Waals forces.<br><br>Therefore, the tertiary amine $\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{N}\\left(\\mathrm{CH}_3\\right)_2$ has the weakest intermolecular forces and the lowest boiling point among the given compounds.<br><br>Answer: $\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{~N}\\left(\\mathrm{CH}_3\\right)_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b15bf9280d7f9932628", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following compounds is least soluble in water at STP?", "image": null}, "options": [{"id": "K8rA3", "text": "$\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "Pic9i", "text": "$\\mathrm{CH}_3 \\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "IeUBA", "text": "$\\mathrm{CH}_3 \\mathrm{NH}_2$", "image": null, "isCorrect": false}, {"id": "lJVj8", "text": "$\\mathrm{CH}_4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Water is a polar solvent and can form hydrogen bonds.<br><br>$\\mathrm{C}_2\\mathrm{H}_5\\mathrm{OH}$, $\\mathrm{CH}_3\\mathrm{OH}$, and $\\mathrm{CH}_3\\mathrm{NH}_2$ are polar molecules and can form intermolecular hydrogen bonds with water molecules. Hence, they are highly soluble in water.<br><br>$\\mathrm{CH}_4$ is a non-polar molecule and cannot form hydrogen bonds with water. According to the principle of \"like dissolves like\", non-polar solutes are least soluble in polar solvents.<br><br>Therefore, $\\mathrm{CH}_4$ is the least soluble in water.<br><br>Answer: $\\mathrm{CH}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b02bf9280d7f9932596", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is the structure of an alcohol with molecular formula $\\mathrm{C}_5 \\mathrm{H}_{12} \\mathrm{O}$ ?", "image": null}, "options": [{"id": "eLJVY", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/yAjq-JJrsmM2ncfd-xV57XOYgnpgNus_3w3MxJ0QU1A.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "uqKJA", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/hUMLUoLukHmTqqAQOQaa4XWy8Ih4vzP1IMrcLA8O_Qg.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "y3Pjq", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/JyXBO5d0_qBkr_vLhm_dLW2r1nbfyj7d9GOV5z5d0Cw.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "AMud1", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/e547c99kbkavuUs4GOvBlMgpSEhoN-KLigPQYMLEE5w.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The general formula for an acyclic, saturated alcohol is $\\mathrm{C}_n \\mathrm{H}_{2n+2} \\mathrm{O}$. For $n=5$, the molecular formula is $\\mathrm{C}_5 \\mathrm{H}_{12} \\mathrm{O}$.<br><br>Let us analyze the given options:<br>1. Cyclopentanol: It has a ring structure, so its formula is $\\mathrm{C}_5 \\mathrm{H}_{10} \\mathrm{O}$.<br>2. Butan-1-ol: It has 4 carbon atoms, so its formula is $\\mathrm{C}_4 \\mathrm{H}_{10} \\mathrm{O}$.<br>3. Pentan-3-ol: It is an acyclic saturated alcohol with 5 carbon atoms, so its formula is $\\mathrm{C}_5 \\mathrm{H}_{12} \\mathrm{O}$.<br>4. Cyclopent-3-en-1-ol: It has a ring and a double bond, so its formula is $\\mathrm{C}_5 \\mathrm{H}_8 \\mathrm{O}$.<br><br>Therefore, the structure corresponding to the molecular formula $\\mathrm{C}_5 \\mathrm{H}_{12} \\mathrm{O}$ is pentan-3-ol.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/JyXBO5d0_qBkr_vLhm_dLW2r1nbfyj7d9GOV5z5d0Cw.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b01bf9280d7f993258c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is primary allylic alcohol?", "image": null}, "options": [{"id": "YpFjb", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/wc3EK1x8XCodD4GpBWxoETIFD_xzXXY32iuIM1ROC7g.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "2IfJC", "text": "$\\mathrm{H}_2 \\mathrm{C}=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{OH}$", "image": null, "isCorrect": true}, {"id": "9I3cZ", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/gBdSAPgabDEaWy8tnU6r3yalwyNfOQz4pZsoxZgbp4w.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "Qp96q", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/TPP696oOPweoxkN2h0ZPVJLd7CR0-UMnta_DiznjDq0.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "An allylic alcohol is one in which the hydroxyl group ($-\\mathrm{OH}$) is attached to an $sp^3$ hybridized carbon atom that is adjacent to a carbon-carbon double bond.<br><br>A primary allylic alcohol has the $-\\mathrm{OH}$ group attached to a primary carbon atom, meaning the carbon bearing the $-\\mathrm{OH}$ group is bonded to only one other carbon atom.<br><br>Let us analyze the given options:<br>1. $\\mathrm{H_2C=CH-CH(CH_3)-OH}$: The carbon attached to $-\\mathrm{OH}$ is bonded to two other carbons. It is a secondary allylic alcohol.<br>2. $\\mathrm{H_2C=CH-CH_2-OH}$: The carbon attached to $-\\mathrm{OH}$ is bonded to only one other carbon. It is a primary allylic alcohol.<br>3. $\\mathrm{H_2C=CH-C(CH_3)_2-OH}$: The carbon attached to $-\\mathrm{OH}$ is bonded to three other carbons. It is a tertiary allylic alcohol.<br>4. $\\mathrm{CH_3-CH=CH-CH(CH_3)-OH}$: The carbon attached to $-\\mathrm{OH}$ is bonded to two other carbons. It is a secondary allylic alcohol.<br><br>Therefore, $\\mathrm{H_2C=CH-CH_2-OH}$ is the primary allylic alcohol.<br><br>Answer: $\\mathrm{H}_2 \\mathrm{C}=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{OH}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871affbf9280d7f9932577", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the molar mass of compound represented by following structure formula?\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/qwynQMl3FNay0oe3E-t-Wx_nJ8TNyfftXUEomnXfZf8.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "ZHjtN", "text": "$36 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "DVrCb", "text": "$46 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "fI0fd", "text": "$22 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "I83jf", "text": "$32 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given structural formula represents ethanol.<br><br>The molecular formula of ethanol is $C_2H_5OH$ or $C_2H_6O$.<br><br>The molar mass of the compound is calculated by adding the atomic masses of all the atoms present in the molecule:<br>Molar mass $= (2 \\times 12) + (6 \\times 1) + (1 \\times 16)$<br>Molar mass $= 24 + 6 + 16 = 46 \\text{ g mol}^{-1}$<br><br>Answer: $46 \\mathrm{~g} \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214490aee93fa0796df70", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Which of the following is allylic alcohol?", "image": null}, "options": [{"id": "bxHxM", "text": "But-1-en-1-ol", "image": null, "isCorrect": false}, {"id": "eTRdO", "text": "But-3-en-1-ol", "image": null, "isCorrect": false}, {"id": "EIvBl", "text": "But-2-en-1-ol", "image": null, "isCorrect": true}, {"id": "si8wB", "text": "Butane-1,3-diol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Allylic alcohols are the compounds in which the hydroxyl group ($-OH$) is attached to an $sp^3$ hybridized carbon atom next to a carbon-carbon double bond.<br><br>But-1-en-1-ol: $CH_3-CH_2-CH=CH-OH$ (Vinylic alcohol/enol)<br><br>But-3-en-1-ol: $CH_2=CH-CH_2-CH_2-OH$ (Homoallylic alcohol)<br><br>But-2-en-1-ol: $CH_3-CH=CH-CH_2-OH$ (Allylic alcohol)<br><br>Butane-1,3-diol: $CH_3-CH(OH)-CH_2-CH_2-OH$ (Aliphatic diol)<br><br>Thus, But-2-en-1-ol is an allylic alcohol.<br><br>Answer: But-2-en-1-ol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214330aee93fa0796dec3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "What is the product of Hydroborationoxidation of but-1-ene?", "image": null}, "options": [{"id": "aQTJ1", "text": "Butanal", "image": null, "isCorrect": false}, {"id": "8DH8B", "text": "Butanone", "image": null, "isCorrect": false}, {"id": "4HdV8", "text": "Butan-1-ol", "image": null, "isCorrect": true}, {"id": "YO49y", "text": "Butan-2-ol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Hydroboration-oxidation of an alkene involves the addition of borane ($BH_3$) followed by oxidation with hydrogen peroxide ($H_2O_2$) in an alkaline medium.<br><br>The addition of water across the double bond takes place according to anti-Markovnikov's rule. The hydroxyl ($-OH$) group attaches to the less substituted carbon atom of the double bond.<br><br>For but-1-ene ($CH_3-CH_2-CH=CH_2$), the less substituted carbon is the terminal carbon ($C_1$).<br><br>$CH_3-CH_2-CH=CH_2 \\xrightarrow[\\text{2. } H_2O_2, \\, OH^-]{\\text{1. } B_2H_6} CH_3-CH_2-CH_2-CH_2-OH$<br><br>Thus, the product formed is butan-1-ol.<br><br>Answer: Butan-1-ol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141e0aee93fa0796de22", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Identify reactant ' $A$ ' in following reaction.\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/QIextfaNO2ZOtNUCIdo5BuDphhx3bNsZIlZ7YU9C_CA.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "In7EY", "text": "HCHO", "image": null, "isCorrect": false}, {"id": "toUD9", "text": "$\\mathrm{CH}_3 \\mathrm{CHO}$", "image": null, "isCorrect": true}, {"id": "JQjll", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/1eUlp3uTFOp-ydcAN_KXYP_4kwjSiMDgDT1Oa7ZmNVk.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "S9q0G", "text": "$\\mathrm{CH}_3 \\mathrm{COOH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is the addition of a Grignard reagent ($\\mathrm{CH}_3\\mathrm{MgBr}$) to a carbonyl compound 'A', followed by acid hydrolysis to yield propan-2-ol ($\\mathrm{CH}_3-\\mathrm{CH}(\\mathrm{OH})-\\mathrm{CH}_3$), which is a secondary alcohol.<br><br>Grignard reagents react with aldehydes (other than formaldehyde) to form secondary alcohols. Since the product contains three carbon atoms and the Grignard reagent provides one methyl group (one carbon atom), the reactant 'A' must be a two-carbon aldehyde.<br><br>Therefore, reactant 'A' is acetaldehyde ($\\mathrm{CH}_3\\mathrm{CHO}$).<br><br>The reaction proceeds as follows:<br>$\\mathrm{CH}_3\\mathrm{CHO} + \\mathrm{CH}_3\\mathrm{MgBr} \\xrightarrow{\\text{dry ether}} \\mathrm{CH}_3-\\mathrm{CH}(\\mathrm{OMgBr})-\\mathrm{CH}_3$<br>$\\mathrm{CH}_3-\\mathrm{CH}(\\mathrm{OMgBr})-\\mathrm{CH}_3 \\xrightarrow{\\mathrm{H}_3\\mathrm{O}^+} \\mathrm{CH}_3-\\mathrm{CH}(\\mathrm{OH})-\\mathrm{CH}_3 + \\mathrm{Mg}(\\mathrm{OH})\\mathrm{Br}$<br><br>Answer: $\\mathrm{CH}_3 \\mathrm{CHO}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140f0aee93fa0796ddab", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Identify the product formed in the following reaction.\n\\(\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{MgBr} \\xrightarrow[\\text { ii) dil. } \\mathrm{HCl}]{\\text { i) } \\mathrm{CO}_2}\\) product", "image": null}, "options": [{"id": "0YcSe", "text": "Ethanoic acid", "image": null, "isCorrect": false}, {"id": "vsVmM", "text": "Propanoic acid", "image": null, "isCorrect": true}, {"id": "rGWdB", "text": "2-Methylpropanoic acid", "image": null, "isCorrect": false}, {"id": "qyY4c", "text": "Butanoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction of a Grignard reagent with carbon dioxide followed by acid hydrolysis yields a carboxylic acid with one more carbon atom than the original alkyl group.<br><br>In the first step, ethylmagnesium bromide undergoes nucleophilic addition to carbon dioxide to form a magnesium salt of a carboxylic acid:<br>$\\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{MgBr} + \\mathrm{O}=\\mathrm{C}=\\mathrm{O} \\rightarrow \\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{COOMgBr}$<br><br>In the second step, the magnesium salt is hydrolyzed by dilute $\\mathrm{HCl}$ to give propanoic acid:<br>$\\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{COOMgBr} + \\mathrm{H}_2\\mathrm{O} \\xrightarrow{\\mathrm{H}^+} \\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{COOH} + \\mathrm{Mg}(\\mathrm{OH})\\mathrm{Br}$<br><br>The final product is propanoic acid.<br><br>Answer: Propanoic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d60aee93fa0796dbe9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Which of the following is a tertiary allylic alcohol?", "image": null}, "options": [{"id": "PbpDv", "text": "Prop-2-en-1-ol", "image": null, "isCorrect": false}, {"id": "Nhw1U", "text": "But-3-en-2-ol", "image": null, "isCorrect": false}, {"id": "u0fHL", "text": "2-methylprop-2-en-1-ol", "image": null, "isCorrect": false}, {"id": "inDii", "text": "2-methylbut-3-en-2-ol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "An allylic alcohol has the hydroxyl group (-OH) attached to an $sp^3$ hybridized carbon atom that is adjacent to a carbon-carbon double bond. A tertiary allylic alcohol has the -OH group attached to a tertiary carbon, which is bonded to three other carbon atoms.<br><br>Prop-2-en-1-ol is $CH_2=CH-CH_2-OH$. The carbon with the -OH group is bonded to one other carbon, making it a primary allylic alcohol.<br><br>But-3-en-2-ol is $CH_2=CH-CH(OH)-CH_3$. The carbon with the -OH group is bonded to two other carbons, making it a secondary allylic alcohol.<br><br>2-methylprop-2-en-1-ol is $CH_2=C(CH_3)-CH_2-OH$. The carbon with the -OH group is bonded to one other carbon, making it a primary allylic alcohol.<br><br>2-methylbut-3-en-2-ol is $CH_2=CH-C(CH_3)(OH)-CH_3$. The carbon atom bearing the -OH group is bonded to three other carbon atoms and is adjacent to a double bond. Thus, it is a tertiary allylic alcohol.<br><br>Answer: 2-methylbut-3-en-2-ol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d40aee93fa0796dbdb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Which isomer of $\\mathrm{C}_4 \\mathrm{H}_9 \\mathrm{OH}$ has highest boiling point?", "image": null}, "options": [{"id": "mE1hh", "text": "n-Butyl alcohol", "image": null, "isCorrect": true}, {"id": "f999m", "text": "Isobutyl alcohol", "image": null, "isCorrect": false}, {"id": "5uwYQ", "text": "sec-Butyl alcohol", "image": null, "isCorrect": false}, {"id": "3fXKa", "text": "tert-Butyl alcohol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The boiling point of isomeric alcohols decreases with an increase in branching.<br><br>As branching increases, the molecule becomes more spherical, which decreases its surface area. A smaller surface area leads to weaker van der Waals forces of attraction.<br><br>Additionally, increased branching causes steric hindrance, which reduces the extent of intermolecular hydrogen bonding.<br><br>Among the given isomers of $\\mathrm{C}_4 \\mathrm{H}_9 \\mathrm{OH}$, n-butyl alcohol is a straight-chain primary alcohol with the maximum surface area and least steric hindrance.<br><br>Thus, n-butyl alcohol has the strongest intermolecular forces and the highest boiling point.<br><br>Answer: n-Butyl alcohol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d20aee93fa0796dbca", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Select the correct increasing order of boiling points of alcohols, amines and carboxylic acids of comparable molar mass from the following.", "image": null}, "options": [{"id": "GUCAI", "text": "Alcohols $ \\lt $ Amines $ \\lt $ Carboxylic acids", "image": null, "isCorrect": false}, {"id": "q3Hsd", "text": "Amines $ \\lt $ Carboxylic acids $ \\lt $ Alcohols", "image": null, "isCorrect": false}, {"id": "w1lFg", "text": "Amines  &lt; Alcohols &lt; Carboxylic acid", "image": null, "isCorrect": true}, {"id": "weLfB", "text": "Carboxylic acids $ \\lt $ Alcohols $ \\lt $ Amines", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The boiling point of a compound depends on the strength and extent of intermolecular forces, particularly hydrogen bonding.<br><br>Oxygen is more electronegative than nitrogen, making the O-H bond more polar than the N-H bond. As a result, the intermolecular hydrogen bonds in alcohols are stronger than those in amines of comparable molar mass. Therefore, alcohols have higher boiling points than amines.<br><br>Carboxylic acids contain both a carbonyl oxygen (a strong hydrogen bond acceptor) and a hydroxyl group (a strong hydrogen bond donor). This allows them to form more extensive and stronger hydrogen bonds than alcohols, often existing as dimers even in the vapor phase. This significantly increases their effective intermolecular forces.<br><br>Thus, the increasing order of boiling points for compounds of comparable molar mass is: Amines $ \\lt $ Alcohols $ \\lt $ Carboxylic acids.<br><br>Answer: Amines  &lt; Alcohols &lt; Carboxylic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213af0aee93fa0796dab6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Which isomer of $\\mathrm{C}_4 \\mathrm{H}_9 \\mathrm{OH}$ has lower boiling point?", "image": null}, "options": [{"id": "INwHR", "text": "n-Butyl alcohol", "image": null, "isCorrect": false}, {"id": "YMdcN", "text": "Isobutyl alcohol", "image": null, "isCorrect": false}, {"id": "QBAcx", "text": "Sec-Butyl alcohol", "image": null, "isCorrect": false}, {"id": "VaE7f", "text": "tert-Butyl alcohol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The boiling point of isomeric alcohols decreases with an increase in branching.<br><br>As branching increases, the molecule becomes more spherical in shape, which decreases the effective surface area. A smaller surface area results in weaker van der Waals forces of attraction.<br><br>Additionally, increased steric hindrance in highly branched alcohols reduces the extent of intermolecular hydrogen bonding.<br><br>Among the given isomers of $\\text{C}_4\\text{H}_9\\text{OH}$, tert-Butyl alcohol is the most branched.<br><br>Therefore, tert-Butyl alcohol has the lowest boiling point.<br><br>Answer: tert-Butyl alcohol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138b0aee93fa0796d99e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Crotonyl alcohol is an example of", "image": null}, "options": [{"id": "LUWSa", "text": "Allylic alcohol", "image": null, "isCorrect": true}, {"id": "MJhXh", "text": "Benzylic alcohol", "image": null, "isCorrect": false}, {"id": "jJYfJ", "text": "Vinylic alcohol", "image": null, "isCorrect": false}, {"id": "3Dqoj", "text": "Polyhydric alcohol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical structure of crotonyl alcohol is $CH_3-CH=CH-CH_2-OH$.<br><br>In this molecule, the hydroxyl ($-OH$) group is attached to an $sp^3$ hybridized carbon atom that is adjacent to a carbon-carbon double bond ($C=C$).<br><br>Alcohols in which the $-OH$ group is attached to an allylic carbon (a carbon atom next to a double bond) are classified as allylic alcohols.<br><br>Therefore, crotonyl alcohol is an example of an allylic alcohol.<br><br>Answer: Allylic alcohol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213780aee93fa0796d905", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which of the following is a secondary allylic alcohol?", "image": null}, "options": [{"id": "aK00c", "text": "$\\mathrm{CH}_2=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "Vw9Bd", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/7T1TbqZw2sp99vdaziPQP2LpXiVxlKH0WkjrOnLzdiw.original.fullsize.png\"/><br/>", "image": null, "isCorrect": true}, {"id": "MBOm8", "text": "$\\mathrm{CH}_3-\\mathrm{CH}=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "i27hg", "text": "$\\mathrm{CH}_2=\\mathrm{CH}-\\mathrm{C}\\left(\\mathrm{CH}_3\\right)_2-\\mathrm{OH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "An allylic alcohol has the hydroxyl group ($\\mathrm{-OH}$) attached to an $sp^3$ hybridized carbon atom that is adjacent to a carbon-carbon double bond ($\\mathrm{C=C}$).<br><br>A secondary alcohol has the $\\mathrm{-OH}$ group attached to a secondary carbon atom, which is a carbon atom bonded to two other carbon atoms.<br><br>Let us analyze the given options:<br>1. $\\mathrm{CH}_2=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{OH}$: The $\\mathrm{-OH}$ group is attached to a primary carbon. Thus, it is a primary allylic alcohol.<br>2. $\\mathrm{CH}_2=\\mathrm{CH}-\\mathrm{CH}(\\mathrm{CH}_3)-\\mathrm{OH}$ (from the image): The $\\mathrm{-OH}$ group is attached to a $\\mathrm{CH}$ carbon, which is bonded to two other carbons (a vinyl group and a methyl group). It is adjacent to a double bond. Thus, it is a secondary allylic alcohol.<br>3. $\\mathrm{CH}_3-\\mathrm{CH}=\\mathrm{CH}-\\mathrm{CH}_2-\\mathrm{OH}$: The $\\mathrm{-OH}$ group is attached to a primary carbon. Thus, it is a primary allylic alcohol.<br>4. $\\mathrm{CH}_2=\\mathrm{CH}-\\mathrm{C}(\\mathrm{CH}_3)_2-\\mathrm{OH}$: The $\\mathrm{-OH}$ group is attached to a tertiary carbon (bonded to three other carbons). Thus, it is a tertiary allylic alcohol.<br><br>Therefore, the compound in the image is the secondary allylic alcohol.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/7T1TbqZw2sp99vdaziPQP2LpXiVxlKH0WkjrOnLzdiw.original.fullsize.png\"/><br/>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213620aee93fa0796d85c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "What type of product is obtained when formaldehyde reacts with $\\mathrm{CH}_3 \\mathrm{MgBr}$ in dry ether?", "image": null}, "options": [{"id": "1Toqw", "text": "Primary alcohol with same number of carbon atoms as in aldehyde.", "image": null, "isCorrect": false}, {"id": "fFE1k", "text": "Primary alcohol with one carbon atom more than aldehyde.", "image": null, "isCorrect": true}, {"id": "2KgkC", "text": "Secondary alcohol with one carbon atom more than aldehyde.", "image": null, "isCorrect": false}, {"id": "2WGaS", "text": "Tertiary alcohol with two carbon atoms more than aldehyde.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction of formaldehyde with methylmagnesium bromide (Grignard reagent) proceeds as follows:<br><br>$\\mathrm{HCHO} + \\mathrm{CH}_3\\mathrm{MgBr} \\xrightarrow{\\text{dry ether}} \\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{OMgBr}$<br><br>Upon acidic hydrolysis, the intermediate adduct yields an alcohol:<br><br>$\\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{OMgBr} \\xrightarrow{\\mathrm{H}_3\\mathrm{O}^+} \\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{OH} + \\mathrm{Mg(OH)Br}$<br><br>The final product is ethanol, which is a primary alcohol. Formaldehyde contains one carbon atom, whereas ethanol contains two carbon atoms. Therefore, the product is a primary alcohol with one carbon atom more than the starting aldehyde.<br><br>Answer: Primary alcohol with one carbon atom more than aldehyde.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213500aee93fa0796d7cc", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Which of the following on reaction with Grignard reagent followed by hydrolysis forms secondary alcohol?", "image": null}, "options": [{"id": "77Kia", "text": "HCHO", "image": null, "isCorrect": false}, {"id": "1EZmJ", "text": "$\\mathrm{CH}_3 \\mathrm{CHO}$", "image": null, "isCorrect": true}, {"id": "jh2H2", "text": "$\\mathrm{CH}_3-\\mathrm{CO}-\\mathrm{CH}_3$", "image": null, "isCorrect": false}, {"id": "rBBWk", "text": "$\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{CO}-\\mathrm{CH}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Reaction of Grignard reagent ($RMgX$) with different carbonyl compounds followed by hydrolysis yields different classes of alcohols.<br><br>Formaldehyde ($HCHO$) reacts with $RMgX$ to give a primary alcohol.<br><br>Aldehydes other than formaldehyde, such as acetaldehyde ($\\mathrm{CH}_3 \\mathrm{CHO}$), react with $RMgX$ to give secondary alcohols.<br><br>Ketones, such as acetone ($\\mathrm{CH}_3-\\mathrm{CO}-\\mathrm{CH}_3$) and butanone ($\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{CO}-\\mathrm{CH}_3$), react with $RMgX$ to give tertiary alcohols.<br><br>Thus, $\\mathrm{CH}_3 \\mathrm{CHO}$ forms a secondary alcohol.<br><br>Answer: $\\mathrm{CH}_3 \\mathrm{CHO}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2627e0279619d9d8a34f8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Identify the compound ' $\\mathrm{A}$ ' in the following sequence of reactions.\n$\\mathrm{A} \\underset{\\text { Dryether }}{\\stackrel{\\mathrm{C}_2 \\mathrm{H}_3 \\mathrm{MeBr}}{\\longrightarrow}} \\mathrm{B} \\stackrel{\\mathrm{H}_2 \\mathrm{O}^{-}}{\\longrightarrow} \\text { 3-Methylpentan-3-ol }$", "image": null}, "options": [{"id": "TIXZJ", "text": "Propanal", "image": null, "isCorrect": false}, {"id": "9cIfJ", "text": "Propanone", "image": null, "isCorrect": false}, {"id": "35Brm", "text": "Butanal", "image": null, "isCorrect": false}, {"id": "VRHLx", "text": "Butanone", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/7mGRNkfW9vXN_yETu3tAjrEgG1WiXUUFeWZYrCqv_hI.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262590279619d9d8a33cf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Which of the following is NOT prepared by the action of Grignard's reagent on methanal?", "image": null}, "options": [{"id": "njYLr", "text": "Ethanol", "image": null, "isCorrect": false}, {"id": "TzF67", "text": "Propan-1-ol", "image": null, "isCorrect": false}, {"id": "6tr2Q", "text": "Propan-2-ol", "image": null, "isCorrect": true}, {"id": "IWWMw", "text": "Butan-1-ol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Methanal (formaldehyde) on reaction with Grignard reagent gives primary alcohols. Hence, propan-2-ol (secondary alcohol) cannot be prepared by the action of Grignard reagent on methanal.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262460279619d9d8a3336", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Which of the following is tertiary benzylic alcohol?", "image": null}, "options": [{"id": "ZEWp2", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/IrJQWHvx_Fp2pTWou2fwWeos4SMCw5-0ub1wg4HPzT8.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "EaHzP", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/-pKOyDzL-8AcAlYgcl_WnXj5SAyjdKrLtVOEhDBXlNw.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "FLdLS", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/1OQl22ch8LighcnHi7k0OQkgTiDkeB-r_bsm77VCOgE.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "ioJhH", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/G85kZ9F2D4rJgndad6BFke1qtuiMCnWzikiqf-RzIh0.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In tertiary benzylic alcohol, $-\\mathrm{OH}$ group is bonded to a $\\mathrm{sp}^3$ hybridised tertiary carbon atom which is further bonded to an aromatic ring.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262260279619d9d8a322f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Identify the product obtained in following reaction.\n$$\n\\mathrm{n} \\mathrm{CH}_3 \\mathrm{MgI}+\\mathrm{H}_2 \\mathrm{O} \\stackrel{\\text { dry ether }}{\\longrightarrow} \\text { product }\n$$", "image": null}, "options": [{"id": "mQVom", "text": "$\\mathrm{n} \\mathrm{MgI}$ and $\\mathrm{n} \\mathrm{CH}_4$", "image": null, "isCorrect": false}, {"id": "VfPzZ", "text": "$\\frac{\\mathrm{n}}{2} \\mathrm{C}_2 \\mathrm{H}_6$", "image": null, "isCorrect": false}, {"id": "AWzU7", "text": "$\\mathrm{n} \\mathrm{CH}_3 \\mathrm{OH}$ and $\\mathrm{n} \\mathrm{MgI}$", "image": null, "isCorrect": false}, {"id": "iZcjP", "text": "$\\mathrm{n} \\mathrm{CH}_4$ and $\\mathrm{n} \\mathrm{MgI}(\\mathrm{OH})$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "\\begin{array}{|l|l|l|} \\hline Std.12 & Ch-10 & Subtopic-10.6 \\\\ \\hline \\end{array}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d30279619d9d8a2fa6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "Identify the compound with highest acidic strength from following.", "image": null}, "options": [{"id": "aTztN", "text": "Ethanol", "image": null, "isCorrect": false}, {"id": "yuDRT", "text": "t-Butyl alcohol", "image": null, "isCorrect": false}, {"id": "YrDrk", "text": "Phenol", "image": null, "isCorrect": false}, {"id": "4jy4b", "text": "p-Nitrophenol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Phenols show weak acidic character while alcohols are neutral. Electron-withdrawing groups (like $-\\mathrm{NO}_2$ ) increase the acidity of substituted phenols. Hence, p-nitrophenol has the highest acidic strength among the given compound.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261780279619d9d8a2cd0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "Which among the following is not a property of alcohols?", "image": null}, "options": [{"id": "7CXxG", "text": "These are non-polar molecules.", "image": null, "isCorrect": true}, {"id": "xb6Q2", "text": "Methanol is toxic liquid.", "image": null, "isCorrect": false}, {"id": "c3BeH", "text": "The boiling points of alcohols increases with increase in their molecular mass.", "image": null, "isCorrect": false}, {"id": "sfDbZ", "text": "Dihydric alcohols contain two $-\\mathrm{OH}$ groups in their structures.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Alcohols are polar molecules. So, option (A) is wrong.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261670279619d9d8a2c48", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "Identify the compound $\\mathrm{A}$ in the following reaction.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/eC1VvGmNs6WI4Lgv4wJwC8j720ueO8YqU-BNqWc2R0Q.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "Ah1jQ", "text": "Acetic acid", "image": null, "isCorrect": false}, {"id": "eS9iO", "text": "Acetaldehyde", "image": null, "isCorrect": false}, {"id": "8cj7N", "text": "Formaldehyde", "image": null, "isCorrect": true}, {"id": "FRkTD", "text": "Acetone", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/AE28ZRlIrbuECqW3Q6Ym7ACc-Aj4knKgTqWc7ikoTig.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261550279619d9d8a2bb6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "Which among the following has highest melting point?", "image": null}, "options": [{"id": "962Ji", "text": "P - Cresol", "image": null, "isCorrect": false}, {"id": "OKinx", "text": "P - Nitrophenol", "image": null, "isCorrect": true}, {"id": "wS1Ko", "text": "O-Nitrophenol", "image": null, "isCorrect": false}, {"id": "LXgfp", "text": "Phenol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "P - Nitrophenol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261540279619d9d8a2bad", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "Which of the following compounds has difficulty in breaking $\\mathrm{C}-\\mathrm{X}$ bond?", "image": null}, "options": [{"id": "uABNT", "text": "O-nitrochlorobenzene", "image": null, "isCorrect": false}, {"id": "ZBWpK", "text": "P - nitrochlorobenzene", "image": null, "isCorrect": false}, {"id": "vXdZt", "text": "m-nitrochlorobenzene", "image": null, "isCorrect": true}, {"id": "zOciB", "text": "2, 4, 6-trinitrochlorobenzene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In aryl halide, $\\mathrm{X}$ atom is attached with $\\mathrm{sp}^2(\\mathrm{C})$, the $\\mathrm{C}-\\mathrm{X}$ bond in aryl halide is shorter than in alkyl halides. This makes $\\mathrm{C}-\\mathrm{X}$ bond stronger in aryl halides.\nUnder normal conditions, halobenzene's are inert to nucleophiles. However, Chlorobenzene can be made to react if the experimental conditions are:\n1. High temperature and high pressure.\n2. In presence of strong electron-withdrawing $\\left(-\\mathrm{NO}_2\\right)$ substituent at ortho and/or para positions.\nThus, $\\mathrm{m}-$ nitrochlorobenzene has difficulty in breaking $\\mathrm{C}-\\mathrm{X}$ bond.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261400279619d9d8a2b05", "type": "singleCo src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/380bb552-d3f5-44be-87a7-b9181daaaad7.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f100279619d9d8a197b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "Isobutylene on hydroboration followed by oxidation with hydrogen peroxide in presence of base yields", "image": null}, "options": [{"id": "93Caw", "text": "N- butyl alcohol", "image": null, "isCorrect": false}, {"id": "81nmN", "text": "Sec- butyl alcohol", "image": null, "isCorrect": false}, {"id": "RudPG", "text": "Tert – butyl alcohol", "image": null, "isCorrect": false}, {"id": "yAe83", "text": "Isobutyl alcohol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Isobutylene on hydroboration followed by oxidation with hydrogen peroxide in presence of base yields isobutyl alcohol. <br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/b0107f8e-c615-41ba-8b63-d8ff8c769418.png\"> <br/><strong>Note</strong> The alcohol formed is in accordance to anti- Markovnikov’s rule.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracti
