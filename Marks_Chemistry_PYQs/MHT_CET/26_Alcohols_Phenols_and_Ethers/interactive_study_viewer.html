  <script>
    const data = {"index": 26, "chapterId": "61c089bea4cd05b3d1d626c9", "chapter": "Alcohols Phenols and Ethers", "exam": "MHT CET", "totalTopics": 14, "totalQuestions": 310, "downloadTime": "2026-10-08 20:07:04", "topics": [{"index": 1, "topicId": "65a263300279619d9d8a3cd2", "title": "Preparation and Properties of Alcohols", "totalQuestions": 96, "questions": [{"_id": "6abb88a315a9fc0fc8c1459a", "type": "singleCorrect", "question": {"text": "Water solubility of alcohol, amines and alkanes of comparable molar mass are in order?", "image": null}, "options": [{"id": "s6qDG", "label": "A", "text": "Alcohol $>$ alkane $>$ amine", "isCorrect": false, "image": null}, {"id": "H47oc", "label": "B", "text": "Amine $>$ Alcohol $>$ alkane", "isCorrect": false, "image": null}, {"id": "4VjQr", "label": "C", "text": "Alcohol $>$ amines $>$ alkanes", "isCorrect": true, "image": null}, {"id": "t7HMR", "label": "D", "text": "Alkane $>$ Alcohol $>$ amine", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Water solubility of organic compounds depends primarily on their ability to form hydrogen bonds with water molecules.<br><br>Oxygen is more electronegative than nitrogen, which makes the O-H bond in alcohols more polar than the N-H bond in amines. As a result, alcohols form stronger hydrogen bonds with water compared to amines, leading to higher solubility.<br><br>Alkanes are non-polar hydrocarbons and cannot form hydrogen bonds with water, making them essentially insoluble (hydrophobic).<br><br>Therefore, the order of water solubility for compounds of comparable molar mass is Alcohol $>$ amines $>$ alkanes.<br><br>Answer: Alcohol $>$ amines $>$ alkanes", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a315a9fc0fc8c14596", "type": "singleCorrect", "question": {"text": "Propene reacts with diborane in the presence of THF followed by $\\text{H}_2\\text{O}_2$ in alkaline medium to give compound A. Compound A reacts with phosphorous pentachloride to give compound B. Identify compound B.", "image": null}, "options": [{"id": "MM1WB", "label": "A", "text": "Propan-1-ol", "isCorrect": false, "image": null}, {"id": "Dwh87", "label": "B", "text": "Propan-2-ol", "isCorrect": false, "image": null}, {"id": "bLhIK", "label": "C", "text": "1-chloropropane", "isCorrect": true, "image": null}, {"id": "b4Bst", "label": "D", "text": "2-chloropropane", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Propene undergoes hydroboration-oxidation when treated with diborane in THF followed by hydrogen peroxide in an alkaline medium. This reaction proceeds via anti-Markovnikov addition of water across the double bond.<br><br>$CH_3-CH=CH_2 \\rightarrow CH_3-CH_2-CH_2-OH$<br><br>Compound A is propan-1-ol.<br><br>Propan-1-ol reacts with phosphorous pentachloride ($PCl_5$) to undergo a substitution reaction where the hydroxyl group is replaced by a chlorine atom.<br><br>$CH_3-CH_2-CH_2-OH + PCl_5 \\rightarrow CH_3-CH_2-CH_2-Cl + POCl_3 + HCl$<br><br>Compound B is 1-chloropropane.<br><br>Answer: 1-chloropropane", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885415a9fc0fc8c142a6", "type": "singleCorrect", "question": {"text": "An organic compound gives hydrogen on reaction with sodium metal and it also forms an aldehyde having molecular formula $\\text{C}_2\\text{H}_4\\text{O}$ on oxidation with pyridinium chlorochromate, identify the organic compound from following ?", "image": null}, "options": [{"id": "0TzpV", "label": "A", "text": "Acetone", "isCorrect": false, "image": null}, {"id": "sp5E3", "label": "B", "text": "Ethyl alcohol", "isCorrect": true, "image": null}, {"id": "gWBuc", "label": "C", "text": "Dimethyl ether", "isCorrect": false, "image": null}, {"id": "DjEe8", "label": "D", "text": "Acetic acid", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The organic compound reacts with sodium metal to evolve hydrogen gas, which indicates the presence of an active hydrogen atom, such as in an alcohol or a carboxylic acid.<br><br>The compound undergoes oxidation with pyridinium chlorochromate (PCC) to form an aldehyde. PCC is a mild oxidizing agent that specifically oxidizes primary alcohols to aldehydes.<br><br>The aldehyde formed has the molecular formula $\\text{C}_2\\text{H}_4\\text{O}$, which corresponds to acetaldehyde ($\\text{CH}_3\\text{CHO}$).<br><br>Therefore, the original organic compound must be a primary alcohol with two carbon atoms, which is ethyl alcohol ($\\text{CH}_3\\text{CH}_2\\text{OH}$).<br><br>The reactions are:<br>$2\\text{CH}_3\\text{CH}_2\\text{OH} + 2\\text{Na} \\rightarrow 2\\text{CH}_3\\text{CH}_2\\text{ONa} + \\text{H}_2$<br>$\\text{CH}_3\\text{CH}_2\\text{OH} \\xrightarrow{\\text{PCC}} \\text{CH}_3\\text{CHO}$<br><br>Answer: Ethyl alcohol", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889315a9fc0fc8c144ff", "type": "singleCorrect", "question": {"text": "What is a name of tert. Butyl alcohol according to carbinol systeme?", "image": null}, "options": [{"id": "zPmAr", "label": "A", "text": "Trimethyl carbinol", "isCorrect": true, "image": null}, {"id": "RR0gJ", "label": "B", "text": "Dimethyl ethyl carbinol", "isCorrect": false, "image": null}, {"id": "jRrYm", "label": "C", "text": "Methyl carbinol", "isCorrect": false, "image": null}, {"id": "RzvJP", "label": "D", "text": "Ethyl carbinol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In the carbinol system of nomenclature, methyl alcohol ($CH_3OH$) is named as carbinol.<br><br>Other alcohols are considered as alkyl derivatives of carbinol, where the alkyl groups attached to the carbon bearing the $-OH$ group are named in alphabetical order, followed by the word 'carbinol'.<br><br>The structure of tert-butyl alcohol is $(CH_3)_3C-OH$.<br><br>In this structure, three methyl groups are attached to the carbinol carbon (the carbon atom bonded to the hydroxyl group).<br><br>Therefore, the name of tert-butyl alcohol in the carbinol system is trimethyl carbinol.<br><br>Answer: Trimethyl carbinol", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889315a9fc0fc8c144fe", "type": "singleCorrect", "question": {"text": "Which of the following compounds is obtained when an acetic acid is treated with reagent $\\text{LiAlH}_4$?", "image": null}, "options": [{"id": "kaJNK", "label": "A", "text": "Acetaldehyde", "isCorrect": false, "image": null}, {"id": "z73VK", "label": "B", "text": "Methane", "isCorrect": false, "image": null}, {"id": "lOHWt", "label": "C", "text": "Ethyl alcohol", "isCorrect": true, "image": null}, {"id": "xJFeI", "label": "D", "text": "Methyl alcohol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Acetic acid ($\\text{CH}_3\\text{COOH}$) is a carboxylic acid.<br><br>Lithium aluminium hydride ($\\text{LiAlH}_4$) is a strong reducing agent which reduces carboxylic acids directly to their corresponding primary alcohols.<br><br>Therefore, the reduction of acetic acid with $\\text{LiAlH}_4$ yields ethyl alcohol ($\\text{CH}_3\\text{CH}_2\\text{OH}$).<br><br>$\\text{CH}_3\\text{COOH} \\xrightarrow{\\text{LiAlH}_4} \\text{CH}_3\\text{CH}_2\\text{OH}$<br><br>Answer: Ethyl alcohol", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c315a9fc0fc8c146c4", "type": "singleCorrect", "question": {"text": "Which of the following reagents, when reacted with aldehydes other than formaldehyde, forms secondary alcohols?", "image": null}, "options": [{"id": "ps68u", "label": "A", "text": "Tollen's reagent", "isCorrect": false, "image": null}, {"id": "WUjLe", "label": "B", "text": "Grignard reagent", "isCorrect": true, "image": null}, {"id": "TFZGk", "label": "C", "text": "Fehling's reagent", "isCorrect": false, "image": null}, {"id": "jkoxx", "label": "D", "text": "Schiff's reagent", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Aldehydes react with Grignard reagents ($R'MgX$) followed by hydrolysis to yield alcohols.<br><br>Formaldehyde ($HCHO$) reacts with Grignard reagents to form primary alcohols.<br><br>Aldehydes other than formaldehyde ($RCHO$) react with Grignard reagents to form secondary alcohols. The reaction is:<br><br>$RCHO + R'MgX \\rightarrow RCH(OMgX)R' \\xrightarrow{H_2O} RCH(OH)R' + Mg(OH)X$<br><br>Ketones react with Grignard reagents to form tertiary alcohols.<br><br>Tollen's reagent, Fehling's reagent, and Schiff's reagent are used to test for the presence of aldehydes and do not form secondary alcohols.<br><br>Answer: Grignard reagent", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883415a9fc0fc8c1417b", "type": "singleCorrect", "question": {"text": "Identify false statements regarding the properties of alcohol and phenol.", "image": null}, "options": [{"id": "6b22G", "label": "A", "text": "Aqueous solution of alcohol is neutral to litmus.", "isCorrect": false, "image": null}, {"id": "VpEcP", "label": "B", "text": "An aqueous solution of phenol turns blue litmus red.", "isCorrect": false, "image": null}, {"id": "mQF7o", "label": "C", "text": "Alcohols and phenols do not form intermolecular hydrogen bonds.", "isCorrect": true, "image": null}, {"id": "d2cT4", "label": "D", "text": "Phenols and lower alcohols have appreciable solubility in water.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Alcohols and phenols contain a highly polarized $-OH$ group, which allows them to form intermolecular hydrogen bonds with each other as well as with water molecules. This hydrogen bonding is responsible for their higher boiling points compared to hydrocarbons of similar molecular mass and their solubility in water.<br><br>Aqueous solutions of alcohols are neutral to litmus because alcohols are extremely weak acids (weaker than water).<br><br>Phenol is more acidic than alcohols and water, so its aqueous solution turns blue litmus red.<br><br>Lower alcohols and phenols are soluble in water due to their ability to form hydrogen bonds with water molecules.<br><br>Thus, the statement that alcohols and phenols do not form intermolecular hydrogen bonds is false.<br><br>Answer: Alcohols and phenols do not form intermolecular hydrogen bonds.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883415a9fc0fc8c1417a", "type": "singleCorrect", "question": {"text": "Identify the increasing order of boiling points for the compounds stated below.<br>(A) n-Propyl alcohol<br>(B) n-Butyl alcohol<br>(C) Isopropyl alcohol<br>(D) Isobutyl alcohol", "image": null}, "options": [{"id": "Maigz", "label": "A", "text": "$(A)<(B)<(C)<(D)$.", "isCorrect": false, "image": null}, {"id": "GpytO", "label": "B", "text": "$(C)<(A)<(D)<(B)$.", "isCorrect": true, "image": null}, {"id": "MttdJ", "label": "C", "text": "$(B)<(D)<(A)<(C)$.", "isCorrect": false, "image": null}, {"id": "dHln9", "label": "D", "text": "$(C)<(A)<(B)<(D)$.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Boiling point increases with an increase in molecular mass. Therefore, the boiling points of propyl alcohols (3 carbon atoms) are lower than those of butyl alcohols (4 carbon atoms).<br><br>Among isomeric alcohols, the boiling point decreases with an increase in branching due to a decrease in surface area, which leads to weaker van der Waals forces.<br><br>For propyl alcohols: Isopropyl alcohol (C) is branched, while n-propyl alcohol (A) is a straight chain. Thus, the boiling point order is $(C) < (A)$.<br><br>For butyl alcohols: Isobutyl alcohol (D) is branched, while n-butyl alcohol (B) is a straight chain. Thus, the boiling point order is $(D) < (B)$.<br><br>Combining these observations, the overall increasing order of boiling points is $(C) < (A) < (D) < (B)$.<br><br>Answer: $(C)<(A)<(D)<(B)$.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ab8c30a4553e1bdb8d", "type": "singleCorrect", "question": {"text": "Which of the following alcohols contains the hydroxy group, at the side chain of the aromatic ring?", "image": null}, "options": [{"id": "FmBsM", "label": "A", "text": "allylic alcohol", "isCorrect": false, "image": null}, {"id": "exliq", "label": "B", "text": "vinylic alcohol", "isCorrect": false, "image": null}, {"id": "Tl0V3", "label": "C", "text": "aromatic alcohols", "isCorrect": true, "image": null}, {"id": "exGSD", "label": "D", "text": "aliphatic alcohol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Aromatic alcohols are compounds in which the hydroxyl group ($-OH$) is attached to an $sp^3$ hybridized carbon atom of the side chain of an aromatic ring.<br><br>For example, benzyl alcohol ($C_6H_5CH_2OH$) is an aromatic alcohol.<br><br>If the hydroxyl group is directly attached to the aromatic ring, the compound is classified as a phenol rather than an alcohol.<br><br>Thus, aromatic alcohols contain the hydroxy group at the side chain of the aromatic ring.<br><br>Answer: aromatic alcohols", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3558c30a4553e1be29a", "type": "singleCorrect", "question": {"text": "Which of the following on reaction with Grignard's reagent followed by hydrolysis forms tertiary alcohol ?", "image": null}, "options": [{"id": "96Kmc", "label": "A", "text": "$\\text{HCHO}$", "isCorrect": false, "image": null}, {"id": "xGObX", "label": "B", "text": "$\\text{CH}_3\\text{CHO}$", "isCorrect": false, "image": null}, {"id": "BeDdz", "label": "C", "text": "$\\text{CH}_3\\text{-CH}_2\\text{-CHO}$", "isCorrect": false, "image": null}, {"id": "j7hKf", "label": "D", "text": "$\\text{CH}_3 - \\text{CO} - \\text{CH}_3$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Grignard reagents react with carbonyl compounds to form addition products which on hydrolysis yield alcohols.<br><br>Formaldehyde ($\\text{HCHO}$) reacts with Grignard reagents to form primary alcohols.<br><br>Other aldehydes (such as $\\text{CH}_3\\text{CHO}$ and $\\text{CH}_3\\text{-CH}_2\\text{-CHO}$) react with Grignard reagents to form secondary alcohols.<br><br>Ketones (such as $\\text{CH}_3 - \\text{CO} - \\text{CH}_3$) react with Grignard reagents to form tertiary alcohols.<br><br>The reaction proceeds as follows:<br><br>$\\text{CH}_3 - \\text{CO} - \\text{CH}_3 + \\text{RMgX} \\rightarrow \\text{CH}_3 - \\text{C}(\\text{R})(\\text{OMgX}) - \\text{CH}_3$<br><br>$\\text{CH}_3 - \\text{C}(\\text{R})(\\text{OMgX}) - \\text{CH}_3 + \\text{H}_2\\text{O} \\rightarrow \\text{CH}_3 - \\text{C}(\\text{R})(\\text{OH}) - \\text{CH}_3 + \\text{Mg}(\\text{OH})\\text{X}$<br><br>The final product is a tertiary alcohol.<br><br>Answer: $\\text{CH}_3 - \\text{CO} - \\text{CH}_3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3008c30a4553e1bdf1c", "type": "singleCorrect", "question": {"text": "Which of the following pair of reagents is used for the conversion of carboxylic acid to alcohol ?", "image": null}, "options": [{"id": "A7lQH", "label": "A", "text": "$\\text{LiAlH}_4 / \\text{H}_3\\text{O}^+$", "isCorrect": true, "image": null}, {"id": "1gQP5", "label": "B", "text": "$\\text{H}_2 / \\text{Ni - heat}$", "isCorrect": false, "image": null}, {"id": "xauQH", "label": "C", "text": "$\\text{B}_2\\text{H}_6 / \\text{H}_2\\text{O}_2, \\text{OH}^-$", "isCorrect": false, "image": null}, {"id": "bY0rt", "label": "D", "text": "$\\text{H}_2 / \\text{Pd}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Carboxylic acids are reduced to primary alcohols by strong reducing agents such as lithium aluminium hydride ($\\text{LiAlH}_4$) followed by acid hydrolysis ($\\text{H}_3\\text{O}^+$).<br><br>$\\text{RCOOH} \\xrightarrow{\\text{LiAlH}_4} \\text{RCH}_2\\text{O}^- \\text{Li}^+ \\xrightarrow{\\text{H}_3\\text{O}^+} \\text{RCH}_2\\text{OH}$<br><br>Catalytic hydrogenation using $\\text{H}_2 / \\text{Ni}$ or $\\text{H}_2 / \\text{Pd}$ does not reduce carboxylic acids.<br><br>$\\text{B}_2\\text{H}_6 / \\text{H}_2\\text{O}_2, \\text{OH}^-$ is the reagent for the hydroboration-oxidation of alkenes to alcohols.<br><br>Answer: $\\text{LiAlH}_4 / \\text{H}_3\\text{O}^+$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fd8c30a4553e1bdefa", "type": "singleCorrect", "question": {"text": "Which from the following hydroxy compounds contain only one $-\\text{OH}$ group in a molecule?", "image": null}, "options": [{"id": "CSyxI", "label": "A", "text": "Crotonyl alcohol", "isCorrect": true, "image": null}, {"id": "mID5m", "label": "B", "text": "Ethylene glycol", "isCorrect": false, "image": null}, {"id": "MrI1M", "label": "C", "text": "Pyrogallol", "isCorrect": false, "image": null}, {"id": "Cc4Q8", "label": "D", "text": "Hydroquinone", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Crotonyl alcohol (2-buten-1-ol) has the structure $\\text{CH}_3-\\text{CH}=\\text{CH}-\\text{CH}_2\\text{OH}$, which contains only one $-\\text{OH}$ group.<br><br>Ethylene glycol (ethane-1,2-diol) has the structure $\\text{HO}-\\text{CH}_2-\\text{CH}_2-\\text{OH}$, which contains two $-\\text{OH}$ groups.<br><br>Pyrogallol (benzene-1,2,3-triol) contains three $-\\text{OH}$ groups attached to a benzene ring.<br><br>Hydroquinone (benzene-1,4-diol) contains two $-\\text{OH}$ groups attached to a benzene ring.<br><br>Therefore, crotonyl alcohol is the only compound among the given options that contains a single $-\\text{OH}$ group.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fd8c30a4553e1bdef6", "type": "singleCorrect", "question": {"text": "Identify the compound obtained when ethyl methyl ketone is treated with $\\text{CH}_3\\text{MgBr}$ and hydrolyzed.", "image": null}, "options": [{"id": "ZhBM0", "label": "A", "text": "$(\\text{CH}_3)_3\\text{C}-\\text{OH}$", "isCorrect": false, "image": null}, {"id": "6CIYN", "label": "B", "text": "$\\text{C}_2\\text{H}_5 - \\overset{\\overset{\\text{CH}_3}{|}}{\\underset{\\underset{\\text{CH}_3}{|}}{\\text{C}}} - \\text{OH}$", "isCorrect": true, "image": null}, {"id": "q2Xxd", "label": "C", "text": "$(\\text{C}_2\\text{H}_5)_3\\,\\text{C}-\\text{OH}$", "isCorrect": false, "image": null}, {"id": "bYIVA", "label": "D", "text": "$\\text{CH}_3 - \\overset{\\overset{\\text{C}_2\\text{H}_5}{|}}{\\underset{\\underset{\\text{C}_2\\text{H}_5}{|}}{\\text{C}}} - \\text{OH}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Ethyl methyl ketone is $\\text{CH}_3-\\text{CO}-\\text{C}_2\\text{H}_5$.<br><br>When it reacts with the Grignard reagent $\\text{CH}_3\\text{MgBr}$, the nucleophilic methyl group attacks the electrophilic carbonyl carbon to form an intermediate alkoxide.<br><br>$\\text{CH}_3-\\text{CO}-\\text{C}_2\\text{H}_5 + \\text{CH}_3\\text{MgBr} \\rightarrow \\text{CH}_3-\\text{C}(\\text{OMgBr})(\\text{CH}_3)-\\text{C}_2\\text{H}_5$<br><br>Upon hydrolysis, the alkoxide is protonated to yield a tertiary alcohol.<br><br>$\\text{CH}_3-\\text{C}(\\text{OMgBr})(\\text{CH}_3)-\\text{C}_2\\text{H}_5 \\xrightarrow{\\text{H}_2\\text{O}} \\text{C}_2\\text{H}_5-\\text{C}(\\text{CH}_3)_2-\\text{OH} + \\text{Mg}(\\text{OH})\\text{Br}$<br><br>The final product is 2-methylbutan-2-ol, which matches the structure $\\text{C}_2\\text{H}_5 - \\overset{\\overset{\\text{CH}_3}{|}}{\\underset{\\underset{\\text{CH}_3}{|}}{\\text{C}}} - \\text{OH}$.<br><br>Answer: $\\text{C}_2\\text{H}_5 - \\overset{\\overset{\\text{CH}_3}{|}}{\\underset{\\underset{\\text{CH}_3}{|}}{\\text{C}}} - \\text{OH}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ef8c30a4553e1bde64", "type": "singleCorrect", "question": {"text": "Which of the following isomers of $\\text{C}_4\\text{H}_9\\text{OH}$ has lowest boiling point ?", "image": null}, "options": [{"id": "plofo", "label": "A", "text": "n - Butyl alcohol", "isCorrect": false, "image": null}, {"id": "SvXrC", "label": "B", "text": "Isobutyl alcohol", "isCorrect": false, "image": null}, {"id": "xVcNc", "label": "C", "text": "sec-Butyl alcohol", "isCorrect": false, "image": null}, {"id": "Tn17l", "label": "D", "text": "tert Butyl alcohol", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The boiling point of isomeric alcohols decreases with an increase in branching.<br><br>As branching increases, the molecule becomes more spherical in shape, which decreases the effective surface area.<br><br>A smaller surface area results in weaker van der Waals forces of attraction between the molecules, thereby lowering the boiling point.<br><br>Among the given isomers of $\\text{C}_4\\text{H}_9\\text{OH}$, tert-butyl alcohol is the most branched.<br><br>Therefore, tert-butyl alcohol has the lowest boiling point.<br><br>Answer: tert Butyl alcohol", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3298c30a4553e1be0d7", "type": "singleCorrect", "question": {"text": "Which among the following has lowest boiling point?", "image": null}, "options": [{"id": "zELsr", "label": "A", "text": "n - Butyl alcohol", "isCorrect": false, "image": null}, {"id": "0f45V", "label": "B", "text": "Isobutyl alcohol", "isCorrect": false, "image": null}, {"id": "fUvm5", "label": "C", "text": "sec-Butyl alcohol", "isCorrect": false, "image": null}, {"id": "FHigO", "label": "D", "text": "tert-Butyl alcohol", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The boiling point of isomeric alcohols decreases with an increase in branching.<br><br>As branching increases, the molecule becomes more spherical in shape, which decreases the surface area. A smaller surface area leads to weaker van der Waals forces of attraction between the molecules, thereby lowering the boiling point.<br><br>Among the given isomers of butyl alcohol, tert-butyl alcohol is the most branched.<br><br>Therefore, tert-butyl alcohol has the lowest boiling point.<br><br>Answer: tert-Butyl alcohol", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3278c30a4553e1be0ba", "type": "singleCorrect", "question": {"text": "Which from following is obtained by hydroboration - oxidation of propene?", "image": null}, "options": [{"id": "LhaAF", "label": "A", "text": "Propanal", "isCorrect": false, "image": null}, {"id": "kwFkS", "label": "B", "text": "Propanone", "isCorrect": false, "image": null}, {"id": "5fQ1T", "label": "C", "text": "Propan-1-ol", "isCorrect": true, "image": null}, {"id": "BqMII", "label": "D", "text": "Propan-2-ol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Hydroboration-oxidation of an alkene results in the anti-Markovnikov addition of water across the double bond.<br><br>Propene ($CH_3-CH=CH_2$) reacts with diborane ($B_2H_6$) to form tripropylborane as an intermediate.<br><br>Subsequent oxidation with hydrogen peroxide ($H_2O_2$) in an alkaline medium yields propan-1-ol.<br><br>$CH_3-CH=CH_2 \\xrightarrow[2. H_2O_2, OH^-]{1. B_2H_6} CH_3-CH_2-CH_2-OH$<br><br>Answer: Propan-1-ol", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c78c30a4553e1bdcb0", "type": "singleCorrect", "question": {"text": "Which from the following is a correct decreasing order of boiling points for following organic compounds ?", "image": null}, "options": [{"id": "Shoht", "label": "A", "text": "Aldehyde > Ketone > Alcohol > Carboxylic acid", "isCorrect": false, "image": null}, {"id": "g6RGJ", "label": "B", "text": "Carboxylic acid > Alcohol > Ketone > Aldehyde", "isCorrect": true, "image": null}, {"id": "dS3J4", "label": "C", "text": "Ketone > Aldehyde > Carboxylic acid > Alcohol", "isCorrect": false, "image": null}, {"id": "kwliG", "label": "D", "text": "Alcohol > Aldehyde > Ketone > Carboxylic acid", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Boiling point depends on the strength of intermolecular forces.<br><br>Carboxylic acids form strong intermolecular hydrogen bonds and exist as dimers, leading to the highest boiling points among compounds of comparable molecular mass.<br><br>Alcohols also form intermolecular hydrogen bonds, but they are weaker than those in carboxylic acids.<br><br>Ketones and aldehydes lack intermolecular hydrogen bonding but possess dipole-dipole interactions.<br><br>Ketones have slightly higher boiling points than isomeric aldehydes due to the presence of two electron-donating alkyl groups, which makes the carbonyl group more polar, resulting in stronger dipole-dipole interactions.<br><br>Thus, the correct decreasing order of boiling points is Carboxylic acid > Alcohol > Ketone > Aldehyde.<br><br>Answer: Carboxylic acid > Alcohol > Ketone > Aldehyde", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29d8c30a4553e1bdaf6", "type": "singleCorrect", "question": {"text": "Find the order of formation of alcohol from alkene from the following.", "image": null}, "options": [{"id": "SdTP6", "label": "A", "text": "$3^\\circ > 1^\\circ > 2^\\circ$", "isCorrect": false, "image": null}, {"id": "9nQn7", "label": "B", "text": "$3^\\circ > 2^\\circ > 1^\\circ$", "isCorrect": true, "image": null}, {"id": "rsWfi", "label": "C", "text": "$1^\\circ > 2^\\circ > 3^\\circ$", "isCorrect": false, "image": null}, {"id": "qJvc5", "label": "D", "text": "$1^\\circ > 3^\\circ > 2^\\circ$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The formation of alcohol from an alkene typically proceeds via acid-catalyzed hydration, which is an electrophilic addition reaction.<br><br>The rate-determining step in this reaction is the attack of the electrophile ($H^+$) on the alkene to form a carbocation intermediate.<br><br>The rate of the reaction is directly proportional to the stability of the carbocation formed.<br><br>The stability of carbocations follows the order: $3^\\circ > 2^\\circ > 1^\\circ$ due to the $+I$ effect of alkyl groups and hyperconjugation.<br><br>Therefore, the order of reactivity of alkenes towards hydration, and hence the rate of formation of alcohol, is $3^\\circ > 2^\\circ > 1^\\circ$.<br><br>Answer: $3^\\circ > 2^\\circ > 1^\\circ$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3708c30a4553e1be3c2", "type": "singleCorrect", "question": {"text": "Find the structure of A in following reaction<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/13_april_shift_1__q90_d1.png\" />", "image": null}, "options": [{"id": "NHWK9", "label": "A", "text": "<img style=\"width: 140px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/13_april_shift_1__q90_d2.png\" />", "isCorrect": false, "image": null}, {"id": "8ZQTz", "label": "B", "text": "<img style=\"width: 100px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/13_april_shift_1__q90_d3.png\" />", "isCorrect": true, "image": null}, {"id": "AFPPJ", "label": "C", "text": "<img style=\"width: 120px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/13_april_shift_1__q90_d4.png\" />", "isCorrect": false, "image": null}, {"id": "nOTA3", "label": "D", "text": "<img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/13_april_shift_1__q90_d5.png\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction is the acid-catalyzed hydration of an alkene. <br><br>Step 1: The electrophile $H^+$ from the acid attacks the double bond of 1-methylcyclohexene. According to Markovnikov's rule, protonation occurs at the less substituted carbon (C2) to form the more stable tertiary carbocation at the C1 position (1-methylcyclohexyl cation).<br><br>Step 2: A water molecule acts as a nucleophile and attacks the tertiary carbocation, forming an oxonium ion intermediate.<br><br>Step 3: Deprotonation of the oxonium ion yields the final product, 1-methylcyclohexanol.<br><br>The structure of 1-methylcyclohexanol matches the second option.<br><br>Answer: <img style=\"width: 100px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/13_april_shift_1__q90_d3.png\" />", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3708c30a4553e1be3c0", "type": "singleCorrect", "question": {"text": "Identify the alcohol obtained when aldehyde other than formaldehyde is treated with Grignard's reagent followed by hydrolysis.", "image": null}, "options": [{"id": "9wGuH", "label": "A", "text": "Primary alcohol", "isCorrect": false, "image": null}, {"id": "zx4qI", "label": "B", "text": "Secondary alcohol", "isCorrect": true, "image": null}, {"id": "W7wHv", "label": "C", "text": "Tertiary alcohol", "isCorrect": false, "image": null}, {"id": "gonUh", "label": "D", "text": "Ketone", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Formaldehyde reacts with Grignard reagent to form primary alcohols.<br><br>Aldehydes other than formaldehyde react with Grignard reagent to form secondary alcohols.<br><br>Ketones react with Grignard reagent to form tertiary alcohols.<br><br>The reaction of an aldehyde ($R'CHO$) with Grignard reagent ($RMgX$) proceeds as follows:<br><br>$R'CHO + RMgX \\rightarrow R'-CH(OMgX)-R$<br><br>Hydrolysis of the intermediate adduct gives a secondary alcohol:<br><br>$R'-CH(OMgX)-R + H_2O \\rightarrow R'-CH(OH)-R + Mg(OH)X$<br><br>Thus, a secondary alcohol is obtained.<br><br>Answer: Secondary alcohol", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3628c30a4553e1be32a", "type": "singleCorrect", "question": {"text": "The number of primary isomeric alcohols of the molecular formula $\\text{C}_4\\text{H}_{10}\\text{O}$ is", "image": null}, "options": [{"id": "bOVTJ", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "eR0ax", "label": "B", "text": "$2$", "isCorrect": true, "image": null}, {"id": "6UlD4", "label": "C", "text": "$3$", "isCorrect": false, "image": null}, {"id": "4J8mt", "label": "D", "text": "$4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The molecular formula $\\text{C}_4\\text{H}_{10}\\text{O}$ represents saturated acyclic alcohols and ethers.<br><br>Primary alcohols have the general formula $\\text{R}-\\text{CH}_2-\\text{OH}$. For $\\text{C}_4\\text{H}_{10}\\text{O}$, the alkyl group $\\text{R}$ must be a propyl group ($\\text{C}_3\\text{H}_7$).<br><br>There are two isomeric propyl groups:<br>1. n-propyl group: $-\\text{CH}_2\\text{CH}_2\\text{CH}_3$<br>2. isopropyl group: $-\\text{CH}(\\text{CH}_3)_2$<br><br>Attaching these to the $-\\text{CH}_2\\text{OH}$ group gives two primary alcohols:<br>1. $\\text{CH}_3\\text{CH}_2\\text{CH}_2\\text{CH}_2\\text{OH}$ (Butan-1-ol)<br>2. $\\text{CH}_3\\text{CH}(\\text{CH}_3)\\text{CH}_2\\text{OH}$ (2-Methylpropan-1-ol)<br><br>Thus, there are 2 primary isomeric alcohols.<br><br>Answer: $2$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b98c30a4553e1bdc22", "type": "singleCorrect", "question": {"text": "The molecule with a maximum boiling point is", "image": null}, "options": [{"id": "Y1uNy", "label": "A", "text": "$\\text{CH}_3 - \\text{CH}(\\text{OH}) - \\text{CH}_2 - \\text{CH}_2 - \\text{OH}$", "isCorrect": true, "image": null}, {"id": "MIAJn", "label": "B", "text": "$\\text{CH}_3 - \\text{CH}_2 - \\text{Br}$", "isCorrect": false, "image": null}, {"id": "FlCGf", "label": "C", "text": "$\\text{CH}_3 - \\text{CH}_2 - \\text{CH}_2 - \\text{Br}$", "isCorrect": false, "image": null}, {"id": "Wl7mM", "label": "D", "text": "$\\text{CH}_3 - \\text{C}(\\text{CH}_3)(\\text{Cl}) - \\text{OH}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The boiling point of a compound depends on the strength of its intermolecular forces.<br><br>Molecules containing $-\\text{OH}$ groups can form intermolecular hydrogen bonds, which are significantly stronger than the dipole-dipole interactions and London dispersion forces present in alkyl halides. Therefore, alcohols generally have higher boiling points than alkyl halides of comparable molecular mass.<br><br>Among the given options:<br>$\\text{CH}_3 - \\text{CH}_2 - \\text{Br}$ and $\\text{CH}_3 - \\text{CH}_2 - \\text{CH}_2 - \\text{Br}$ are alkyl halides and do not exhibit hydrogen bonding.<br>$\\text{CH}_3 - \\text{C}(\\text{CH}_3)(\\text{Cl}) - \\text{OH}$ has one $-\\text{OH}$ group, allowing for intermolecular hydrogen bonding.<br>$\\text{CH}_3 - \\text{CH}(\\text{OH}) - \\text{CH}_2 - \\text{CH}_2 - \\text{OH}$ (a diol) contains two $-\\text{OH}$ groups per molecule. This allows for a more extensive network of intermolecular hydrogen bonds compared to a monohydric alcohol.<br><br>Due to the presence of two hydroxyl groups and the resulting extensive intermolecular hydrogen bonding, $\\text{CH}_3 - \\text{CH}(\\text{OH}) - \\text{CH}_2 - \\text{CH}_2 - \\text{OH}$ has the maximum boiling point.<br><br>Answer: $\\text{CH}_3 - \\text{CH}(\\text{OH}) - \\text{CH}_2 - \\text{CH}_2 - \\text{OH}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c00bf9280d7f9932e64", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following on reaction with Grignards reagent followed by hydrolysis forms tertiary alcohol?", "image": null}, "options": [{"id": "C7Ka6", "text": "Methanal", "image": null, "isCorrect": false}, {"id": "fDhuC", "text": "Ethanal", "image": null, "isCorrect": false}, {"id": "rgP2I", "text": "Propanal", "image": null, "isCorrect": false}, {"id": "BLEIu", "text": "Propanone", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Reaction of Grignard reagent ($RMgX$) with different carbonyl compounds followed by hydrolysis yields different types of alcohols:<br><br>Methanal (formaldehyde) reacts with Grignard reagent to form a primary alcohol.<br><br>Other aldehydes like ethanal and propanal react with Grignard reagent to form secondary alcohols.<br><br>Ketones react with Grignard reagent to form tertiary alcohols. Propanone is a ketone, so its reaction with a Grignard reagent followed by hydrolysis yields a tertiary alcohol.<br><br>For example:<br>$CH_3-CO-CH_3 + RMgX \\rightarrow (CH_3)_2C(R)(OMgX)$<br>$(CH_3)_2C(R)(OMgX) + H_2O \\rightarrow (CH_3)_2C(R)(OH) + Mg(OH)X$<br><br>The product $(CH_3)_2C(R)(OH)$ is a tertiary alcohol.<br><br>Answer: Propanone", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bfebf9280d7f9932e4e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What type of alcohol is the crotonyl alcohol?", "image": null}, "options": [{"id": "oc7VI", "text": "Allylic alcohol", "image": null, "isCorrect": true}, {"id": "EEnof", "text": "Benzylic alcohol", "image": null, "isCorrect": false}, {"id": "Vt38r", "text": "Vinylic alcohol", "image": null, "isCorrect": false}, {"id": "QFSyH", "text": "Polyhydric alcohol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Crotonyl alcohol is but-2-en-1-ol, with the chemical structure $CH_3-CH=CH-CH_2-OH$.<br><br>In this structure, the $-OH$ group is attached to an $sp^3$ hybridized carbon atom that is adjacent to a carbon-carbon double bond ($>C=C<$).<br><br>Alcohols with this structural feature are classified as allylic alcohols.<br><br>Answer: Allylic alcohol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bedbf9280d7f9932db6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the number of moles of propane-1,2,3-triol formed when $n$ mole of triglyceride is hydrolysed ?", "image": null}, "options": [{"id": "GSCut", "text": "n", "image": null, "isCorrect": true}, {"id": "aXFBD", "text": "2n", "image": null, "isCorrect": false}, {"id": "mDgMM", "text": "3n", "image": null, "isCorrect": false}, {"id": "7gNt6", "text": "0.5n", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A triglyceride is an ester formed from one molecule of glycerol (propane-1,2,3-triol) and three molecules of fatty acids.<br><br>The general reaction for the hydrolysis of a triglyceride is:<br>Triglyceride + $3H_2O \\rightarrow$ Glycerol + $3$ Fatty acids<br><br>From the stoichiometry of the reaction, $1$ mole of triglyceride upon hydrolysis yields exactly $1$ mole of propane-1,2,3-triol.<br><br>Therefore, the hydrolysis of $n$ moles of triglyceride will yield $n$ moles of propane-1,2,3-triol.<br><br>Answer: n", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdfbf9280d7f9932d2f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product ' $A$ ' in the following reaction,\nAnisole $\\xrightarrow[398 \\mathrm{~K}]{\\mathrm{HI}} \\mathrm{A}+$ Iodomethane", "image": null}, "options": [{"id": "GqMRH", "text": "Aniline", "image": null, "isCorrect": false}, {"id": "fR1sY", "text": "Iodobenzene", "image": null, "isCorrect": false}, {"id": "6qS1x", "text": "Benzenol", "image": null, "isCorrect": true}, {"id": "gyqQO", "text": "Benzene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Anisole is methoxybenzene ($C_6H_5OCH_3$).<br><br>When anisole is heated with $HI$ at $398 \\text{ K}$, the cleavage of the $C-O$ bond takes place. Due to resonance, the phenyl-oxygen bond has partial double bond character and is stronger than the methyl-oxygen bond. Thus, the methyl-oxygen bond is cleaved.<br><br>The reaction is:<br>$C_6H_5OCH_3 + HI \\xrightarrow{398 \\text{ K}} C_6H_5OH + CH_3I$<br><br>The products formed are phenol (also known as benzenol) and iodomethane. Therefore, the product 'A' is benzenol.<br><br>Answer: Benzenol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdebf9280d7f9932d24", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following has highest boiling point?", "image": null}, "options": [{"id": "86Xw5", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/P3sBIatnssa27SOJKeIcFezmVuiVrTbQaYuem5Mlajw.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "iGuT7", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/SEizcHXir5Ca781F4hDoneV4qNM-OBT4IhxAMXc_8pk.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "VqBJY", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/sK3I3yEAEmm5rg5wXLGLUR6EHHHads5sFv7JEUTr1JY.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "kZnD8", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/dcbBj8J-4DJUt0fyLtiiG5ou448Nz2E_Txu7vlA1vLo.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given compounds are isomeric alcohols with the molecular formula $C_4H_{10}O$.<br><br>The boiling point of isomeric alcohols decreases with an increase in branching. This is because branching decreases the surface area of the molecule, which in turn weakens the intermolecular van der Waals forces of attraction.<br><br>Among the given options:<br>1. Butan-1-ol is a straight-chain primary alcohol and has the maximum surface area.<br>2. 2-Methylpropan-1-ol is a branched primary alcohol.<br>3. Butan-2-ol is a secondary alcohol.<br>4. 2-Methylpropan-2-ol is a highly branched tertiary alcohol and has the minimum surface area.<br><br>Therefore, the straight-chain isomer, butan-1-ol, has the strongest intermolecular forces and the highest boiling point.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/P3sBIatnssa27SOJKeIcFezmVuiVrTbQaYuem5Mlajw.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bddbf9280d7f9932d1d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following compounds has lowest boiling point?", "image": null}, "options": [{"id": "AQKwp", "text": "Ethanol", "image": null, "isCorrect": false}, {"id": "Nveeq", "text": "Propanol", "image": null, "isCorrect": false}, {"id": "yO4I5", "text": "Butanol", "image": null, "isCorrect": false}, {"id": "GXjtf", "text": "Methanol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The boiling point of alcohols increases with an increase in the number of carbon atoms (molecular mass) due to the increase in the magnitude of van der Waals forces of attraction.<br><br>Among the given options, methanol has the lowest number of carbon atoms (one carbon atom) and the lowest molecular mass.<br><br>Therefore, methanol has the weakest van der Waals forces and consequently the lowest boiling point.<br><br>Answer: Methanol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcdbf9280d7f9932c8f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following compounds does NOT form inter molecular hydrogen bonding?", "image": null}, "options": [{"id": "bkWax", "text": "Ethanol", "image": null, "isCorrect": false}, {"id": "pR6X5", "text": "Butane", "image": null, "isCorrect": true}, {"id": "CIISM", "text": "Phenol", "image": null, "isCorrect": false}, {"id": "EIjwq", "text": "Butan-1-ol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Intermolecular hydrogen bonding occurs in compounds where hydrogen is directly bonded to a highly electronegative atom such as fluorine, oxygen, or nitrogen.<br><br>Ethanol ($C_2H_5OH$), phenol ($C_6H_5OH$), and butan-1-ol ($C_4H_9OH$) all contain an -OH group, which allows them to form intermolecular hydrogen bonds.<br><br>Butane ($C_4H_{10}$) is an alkane consisting only of carbon and hydrogen atoms. Since it lacks a highly electronegative atom bonded to hydrogen, it cannot form hydrogen bonds and only exhibits weak van der Waals forces between its molecules.<br><br>Answer: Butane", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbbbf9280d7f9932bf0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In carbinol system, sec-Butyl alcohol is named as", "image": null}, "options": [{"id": "DaH5H", "text": "Ethyl methyl carbinol", "image": null, "isCorrect": true}, {"id": "qSNQW", "text": "sec-Butylcarbinol", "image": null, "isCorrect": false}, {"id": "yZEBz", "text": "Isopropyl carbinol", "image": null, "isCorrect": false}, {"id": "S1Rw0", "text": "Diethylcarbinol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the carbinol system of nomenclature, methyl alcohol ($CH_3OH$) is named as carbinol. Other alcohols are named as alkyl derivatives of carbinol.<br><br>The structure of sec-butyl alcohol is $CH_3-CH_2-CH(OH)-CH_3$.<br><br>The carbon atom bonded to the $-OH$ group is considered as the carbinol carbon. In sec-butyl alcohol, this carbinol carbon is bonded to one ethyl group ($-CH_2CH_3$) and one methyl group ($-CH_3$).<br><br>Therefore, its name in the carbinol system is ethyl methyl carbinol.<br><br>Answer: Ethyl methyl carbinol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8bbf9280d7f9932a36", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following has highest solubility in water?", "image": null}, "options": [{"id": "K2Tej", "text": "Phenol", "image": null, "isCorrect": true}, {"id": "O3fwB", "text": "p-Cresol", "image": null, "isCorrect": false}, {"id": "rE9P7", "text": "o-Nitrophenol", "image": null, "isCorrect": false}, {"id": "JnI7J", "text": "p-Nitrophenol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Solubility of these compounds in water depends on their ability to form intermolecular hydrogen bonds with water molecules and the extent of their hydrophobic nature.<br><br>Phenol forms effective intermolecular hydrogen bonds with water, making it fairly soluble (approx. $8.3 \\text{ g/100 mL}$).<br><br>p-Cresol contains an additional hydrophobic methyl ($-CH_3$) group on the benzene ring, which increases the non-polar character and decreases its solubility in water compared to phenol.<br><br>o-Nitrophenol exhibits strong intramolecular hydrogen bonding (chelation) between the $-OH$ and $-NO_2$ groups. This restricts its ability to form hydrogen bonds with water, making it the least soluble among the given options.<br><br>p-Nitrophenol forms intermolecular hydrogen bonds, but these occur strongly between the p-nitrophenol molecules themselves, leading to a highly associated solid state with a high crystal lattice energy. This strong self-association makes it less soluble in water (approx. $1.6 \\text{ g/100 mL}$) than phenol.<br><br>Therefore, phenol has the highest solubility in water among the given compounds.<br><br>Answer: Phenol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7cbf9280d7f99329aa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is correct IUPAC name of catechol?", "image": null}, "options": [{"id": "G7Vn1", "text": "Benzene-1,2-diol", "image": null, "isCorrect": true}, {"id": "tnPCD", "text": "Benzene-1,3-diol", "image": null, "isCorrect": false}, {"id": "hvTsJ", "text": "Benzene-1,4-diol", "image": null, "isCorrect": false}, {"id": "B0uNI", "text": "Benzene-1,3,5-triol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Catechol is a dihydric phenol in which two hydroxyl ($-OH$) groups are attached to adjacent carbon atoms of the benzene ring.<br><br>Its structure corresponds to 1,2-dihydroxybenzene.<br><br>According to IUPAC nomenclature rules, it is named as Benzene-1,2-diol.<br><br>For reference:<br>Benzene-1,3-diol is commonly known as resorcinol.<br>Benzene-1,4-diol is commonly known as hydroquinone or quinol.<br>Benzene-1,3,5-triol is commonly known as phloroglucinol.<br><br>Answer: Benzene-1,2-diol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6dbf9280d7f993291e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Hydroboration-oxidation of but-1-ene forms", "image": null}, "options": [{"id": "lb6cb", "text": "Butanal", "image": null, "isCorrect": false}, {"id": "DQ13Z", "text": "Butanone", "image": null, "isCorrect": false}, {"id": "o3JBU", "text": "Butan-1-ol", "image": null, "isCorrect": true}, {"id": "tS3Xq", "text": "Butan-2-ol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Hydroboration-oxidation of an alkene results in the anti-Markovnikov addition of water across the double bond.<br><br>In but-1-ene ($CH_3-CH_2-CH=CH_2$), the double bond is between C1 and C2. According to the anti-Markovnikov rule, the $-OH$ group attaches to the less substituted carbon atom (C1) and the $-H$ atom attaches to the more substituted carbon atom (C2).<br><br>The reaction proceeds as follows:<br>$3 CH_3-CH_2-CH=CH_2 + BH_3 \\rightarrow (CH_3-CH_2-CH_2-CH_2)_3B$<br>$(CH_3-CH_2-CH_2-CH_2)_3B + 3 H_2O_2 \\xrightarrow{OH^-} 3 CH_3-CH_2-CH_2-CH_2-OH + B(OH)_3$<br><br>The final product is butan-1-ol.<br><br>Answer: Butan-1-ol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6cbf9280d7f9932914", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is a bondline structure of glycerol?", "image": null}, "options": [{"id": "NJsYU", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/btbZR6b2v0VTcY4RfZntNyu9pSjwVeSz6xJgSkNKbQg.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "Em6CA", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/zmLUFHSJgYr8VYFubjnc13EgB7wwwQqN_gKX9Vi4B6Q.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "3MkLI", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/Fz3-WBrFHKIdasterP4qGqXs_eqP-OvtABC18TbdDGQ.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "gAfDL", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/i_c32GD2AGYny_ovvDFkPg0idJFs6g_Ov0GYAnfbpFM.original.fullsize.png\"><br>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Glycerol is a trihydric alcohol with the IUPAC name propane-1,2,3-triol.<br><br>Its chemical formula is $\\text{CH}_2(\\text{OH})-\\text{CH}(\\text{OH})-\\text{CH}_2(\\text{OH})$.<br><br>Looking at the given bond-line structures:<br>The first structure represents prop-1-ene-1,2,3-triol.<br>The second structure represents a diol with a double bond.<br>The third structure represents butane-1,2,3-triol (it has a four-carbon chain).<br>The fourth structure has a three-carbon chain with one $-\\text{OH}$ group attached to each carbon atom, which corresponds to propane-1,2,3-triol.<br><br>Therefore, the fourth structure is the correct bond-line structure of glycerol.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/i_c32GD2AGYny_ovvDFkPg0idJFs6g_Ov0GYAnfbpFM.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6cbf9280d7f9932910", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following has lowest boiling point?", "image": null}, "options": [{"id": "H55hs", "text": "$\\mathrm{CH}_3-\\mathrm{O}-\\mathrm{CH}_2-\\mathrm{CH}_3$", "image": null, "isCorrect": false}, {"id": "mAdtM", "text": "$\\mathrm{CH}_3-\\mathrm{COOH}$", "image": null, "isCorrect": false}, {"id": "pQbQw", "text": "$\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{CH}_3$", "image": null, "isCorrect": true}, {"id": "VA7kV", "text": "$\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{OH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The boiling point of a compound depends on the strength of its intermolecular forces. The given compounds have comparable molecular masses.<br><br>$\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{CH}_3$ (n-butane) is a non-polar alkane and possesses only weak van der Waals dispersion forces between its molecules.<br><br>$\\mathrm{CH}_3-\\mathrm{O}-\\mathrm{CH}_2-\\mathrm{CH}_3$ (methoxyethane) is an ether and exhibits dipole-dipole interactions.<br><br>$\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{OH}$ (propan-1-ol) and $\\mathrm{CH}_3-\\mathrm{COOH}$ (acetic acid) exhibit strong intermolecular hydrogen bonding.<br><br>Since van der Waals dispersion forces are the weakest intermolecular forces, they require the least amount of thermal energy to overcome. Therefore, n-butane has the lowest boiling point.<br><br>Answer: $\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{CH}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5cbf9280d7f993288f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following has highest boiling point?", "image": null}, "options": [{"id": "jubob", "text": "Propanone", "image": null, "isCorrect": false}, {"id": "S9MrH", "text": "Ethanoic acid", "image": null, "isCorrect": true}, {"id": "mXmwK", "text": "Propan-1-ol", "image": null, "isCorrect": false}, {"id": "q5iS8", "text": "Propanal", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Boiling point depends on the strength of intermolecular forces.<br><br>Propanone and propanal have dipole-dipole interactions.<br><br>Propan-1-ol and ethanoic acid have intermolecular hydrogen bonding.<br><br>The hydrogen bonding in carboxylic acids (ethanoic acid) is stronger than in alcohols (propan-1-ol) because the O-H bond is more strongly polarized due to the presence of the electron-withdrawing carbonyl group. Furthermore, ethanoic acid molecules exist as dimers due to strong intermolecular hydrogen bonding, which significantly increases the effective molecular mass and the boiling point.<br><br>Thus, ethanoic acid has the highest boiling point among the given compounds.<br><br>Answer: Ethanoic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b48bf9280d7f99327d8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the correct decreasing order of boiling points for different organic compounds from following.", "image": null}, "options": [{"id": "HFZIf", "text": "Carboxylic acids > Amines > Alcohols", "image": null, "isCorrect": false}, {"id": "xixiV", "text": "Carboxylic acids > Alcohols > Amines", "image": null, "isCorrect": true}, {"id": "rn7o9", "text": "Amines > Alcohols > Carboxylic acids", "image": null, "isCorrect": false}, {"id": "hqkmA", "text": "Alcohols > Amines > Carboxylic acids", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The boiling points of organic compounds depend on the strength of their intermolecular forces.<br><br>Carboxylic acids have the highest boiling points among compounds of comparable molecular mass because they form strong intermolecular hydrogen bonds, often existing as dimers.<br><br>Alcohols also exhibit intermolecular hydrogen bonding, but it is weaker than in carboxylic acids. This is because the O-H bond in carboxylic acids is more strongly polarized by the adjacent electron-withdrawing carbonyl group.<br><br>Amines have lower boiling points than alcohols because nitrogen is less electronegative than oxygen. This makes the N-H bond less polar than the O-H bond, resulting in weaker hydrogen bonding.<br><br>Therefore, the correct decreasing order of boiling points is Carboxylic acids > Alcohols > Amines.<br><br>Answer: Carboxylic acids > Alcohols > Amines", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3abf9280d7f9932749", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following compounds has lowest boiling point?", "image": null}, "options": [{"id": "x6fxd", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/0_Zl2ezBUHES-sk63kEOhg6KTkDXU600gmeBaUZkDnY.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "UTTbd", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/-wDyYtMoHKRHiJv4jTgBA_N42wf3N1ey2qxzoN72vSY.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "oh6OR", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/uq1SXNlE79vGulg-8U4PCrPRAYLwGj2vNcSH3fLlVQo.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "sgWEd", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/hDy9h3Oif4Z-F2UOLHTxHNlSsz72yACDdAAXCr2vBT4.original.fullsize.png\"><br>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given compounds are isomeric alcohols with the molecular formula $C_4H_{10}O$.<br><br>The boiling point of isomeric alcohols decreases with an increase in branching. This is because as branching increases, the molecule becomes more spherical in shape, which decreases the effective surface area. A smaller surface area leads to weaker van der Waals forces of attraction between the molecules, thereby lowering the boiling point.<br><br>Among the given options:<br>1. Butan-1-ol is a straight
