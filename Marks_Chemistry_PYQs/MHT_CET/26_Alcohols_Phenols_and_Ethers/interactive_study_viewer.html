r>\nIUPAC name $\\rightarrow 1$-Chloro-2-methylpropane", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f230279619d9d8a1a10", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "When carbolic acid is heated with concentrated nitric acid in presence of concentrated sulphuric acid it forms", "image": null}, "options": [{"id": "Dz4L1", "text": "benzoic acid", "image": null, "isCorrect": false}, {"id": "e2eql", "text": "picric acid", "image": null, "isCorrect": true}, {"id": "nsA3R", "text": "phthalic acid", "image": null, "isCorrect": false}, {"id": "AVTOO", "text": "benzene sulphonic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When phenol is warmed with a mixture of conc. nitric acid and conc. sulphuric acid (a nitrating mixture or the mixed acid), $2,4,6$-trinitrophenol, commonly called picric acid, is formed.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/kurYD3sSP7xGNcN_rldnyTVgTZZoh5UGu7oVyVb39UA.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed80279619d9d8a17bb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "Phenol in presence of sodium hydroxide reacts with chloroform to form salicyladehyde. The reaction is known as:", "image": null}, "options": [{"id": "8dXKj", "text": "Kolbe's reaction", "image": null, "isCorrect": false}, {"id": "wT1gW", "text": "Reimer-Tiemann reaction", "image": null, "isCorrect": true}, {"id": "1C38j", "text": "Stephen reaction", "image": null, "isCorrect": false}, {"id": "BrPxe", "text": "Etard reaction", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/332664.jpg\" style=\"width: 362px; height: 130px;\" /><br />This reaction is known as Reimer-Tiemann reaction", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eb30279619d9d8a168f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "Which among the following phenolic compounds is most acidic in nature?", "image": null}, "options": [{"id": "gquhj", "text": "p-Aminophenol", "image": null, "isCorrect": false}, {"id": "ZEZuP", "text": "Phenol", "image": null, "isCorrect": false}, {"id": "eNrEo", "text": "m-Nitrophenol", "image": null, "isCorrect": false}, {"id": "D326L", "text": "p-Nitrophenol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The order for acidity in phenols depends upon the <math><msup><mrow><mi>e</mi></mrow><mrow><mo>-</mo></mrow></msup></math> withdrawing group's position.<br />p-Nitrophenol &gt; m-Nitro phenol &gt; Phenol.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea20279619d9d8a1608", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "Which of the following compound forms white precipitate with bromine water?", "image": null}, "options": [{"id": "vgGvO", "text": "Nitrobenzene", "image": null, "isCorrect": false}, {"id": "0rDRW", "text": "Phenol", "image": null, "isCorrect": true}, {"id": "BRurB", "text": "Benzene", "image": null, "isCorrect": false}, {"id": "YBAqa", "text": "All of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Phenol reacts with bromine water to yield white precipitate of $2,4,6$ - tribromophenol.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/gxPjwThJ-ak2KyFWEpOhnZVd7E_K8SHqUL3WUX00wG8.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a263300279619d9d8a3cd5", "title": "Preparation of Ethers", "totalQuestions": 18, "questions": [{"_id": "6abb88a315a9fc0fc8c14594", "type": "singleCorrect", "question": {"text": "Which of the following reactions is used to prepare diethyl ether from ethyl chloride?", "image": null}, "options": [{"id": "hEG64", "label": "A", "text": "Wurtz reaction", "isCorrect": false, "image": null}, {"id": "9BDpP", "label": "B", "text": "Wurtz- fitting reaction", "isCorrect": false, "image": null}, {"id": "X14i9", "label": "C", "text": "Williamson's reaction", "isCorrect": true, "image": null}, {"id": "Lms3G", "label": "D", "text": "Reimer- Tiemann reaction", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Williamson's synthesis is a widely used method for the preparation of symmetrical and unsymmetrical ethers.<br><br>In this reaction, an alkyl halide reacts with sodium alkoxide to form an ether.<br><br>$C_2H_5Cl + C_2H_5ONa \\rightarrow C_2H_5-O-C_2H_5 + NaCl$<br><br>Thus, diethyl ether is prepared from ethyl chloride by Williamson's reaction.<br><br>Answer: Williamson's reaction", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885415a9fc0fc8c142a8", "type": "singleCorrect", "question": {"text": "Which of the following is gaseous ether?", "image": null}, "options": [{"id": "qRZb1", "label": "A", "text": "Ethyl methyl ether", "isCorrect": true, "image": null}, {"id": "x58Sv", "label": "B", "text": "Anisole", "isCorrect": false, "image": null}, {"id": "XckcZ", "label": "C", "text": "$4$-Methoxyacetophenone", "isCorrect": false, "image": null}, {"id": "fteIZ", "label": "D", "text": "p-Bromo anisole", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Lower members of ethers such as dimethyl ether and ethyl methyl ether are gases at ordinary room temperature.<br><br>Higher members are volatile liquids or solids. Anisole, $4$-methoxyacetophenone, and p-bromo anisole have higher molecular masses and stronger intermolecular forces, making them liquids or solids at room temperature.<br><br>Therefore, ethyl methyl ether is a gaseous ether.<br><br>Answer: Ethyl methyl ether", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885415a9fc0fc8c142a7", "type": "singleCorrect", "question": {"text": "Identify the temperature required for preparation of ethoxyethane from ethanol in the presence of $\\text{H}_2\\text{SO}_4$.", "image": null}, "options": [{"id": "WTJZp", "label": "A", "text": "$113\\,K$", "isCorrect": false, "image": null}, {"id": "7y5OK", "label": "B", "text": "$443\\,K$", "isCorrect": false, "image": null}, {"id": "3DwwI", "label": "C", "text": "$413\\,K$", "isCorrect": true, "image": null}, {"id": "U330n", "label": "D", "text": "$213\\,K$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The dehydration of ethanol in the presence of concentrated $\\text{H}_2\\text{SO}_4$ gives different products depending on the temperature.<br><br>At $443\\,\\text{K}$, ethanol undergoes intramolecular dehydration (elimination) to form ethene.<br><br>At $413\\,\\text{K}$, ethanol undergoes intermolecular dehydration (nucleophilic substitution) to form ethoxyethane (diethyl ether).<br><br>The reaction is:<br><br>$2\\text{CH}_3\\text{CH}_2\\text{OH} \\xrightarrow{\\text{H}_2\\text{SO}_4, 413\\,\\text{K}} \\text{CH}_3\\text{CH}_2\\text{O}\\text{CH}_2\\text{CH}_3 + \\text{H}_2\\text{O}$<br><br>Thus, the required temperature is $413\\,\\text{K}$.<br><br>Answer: $413\\,K$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b315a9fc0fc8c1462c", "type": "singleCorrect", "question": {"text": "Which of the following compounds cannot be prepared by Williamson's synthesis?", "image": null}, "options": [{"id": "aayfY", "label": "A", "text": "$\\text{C}_6\\text{H}_5\\text{OCH}_2\\text{CH}_3$", "isCorrect": false, "image": null}, {"id": "esBsA", "label": "B", "text": "$\\text{CH}_3\\text{CH}_2\\text{O CH}_2\\text{CH}_3$", "isCorrect": false, "image": null}, {"id": "kf5if", "label": "C", "text": "$(\\text{CH}_3)_3\\text{C-O-CH}_2\\text{CH}_3$", "isCorrect": false, "image": null}, {"id": "hT1m3", "label": "D", "text": "$(\\text{CH}_3)_3\\text{C-O-C(CH}_3)_3$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Williamson's synthesis is an $S_N2$ reaction between an alkoxide ion and an alkyl halide.<br><br>For the successful synthesis of an ether, the alkyl halide must be primary or methyl to avoid elimination. If a tertiary alkyl halide is used, elimination dominates over substitution, yielding an alkene instead of an ether.<br><br>To prepare di-tert-butyl ether, $(\\text{CH}_3)_3\\text{C-O-C(CH}_3)_3$, the reaction would require a tert-butyl halide and a tert-butoxide ion. Since the alkyl halide is tertiary and the alkoxide is a strong base, an elimination reaction will occur exclusively to form isobutylene.<br><br>Thus, $(\\text{CH}_3)_3\\text{C-O-C(CH}_3)_3$ cannot be prepared by Williamson's synthesis.<br><br>Answer: $(\\text{CH}_3)_3\\text{C-O-C(CH}_3)_3$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3448c30a4553e1be1f1", "type": "singleCorrect", "question": {"text": "Which among the following does NOT undergo Williamson's synthesis?", "image": null}, "options": [{"id": "GAA69", "label": "A", "text": "$\\text{C}_2\\text{H}_5\\text{Br}$", "isCorrect": false, "image": null}, {"id": "kbuMZ", "label": "B", "text": "<img style=\"width: 200px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_2__q75_d1.png\" />", "isCorrect": false, "image": null}, {"id": "Cavgb", "label": "C", "text": "$\\text{C}_6\\text{H}_5 - \\text{Br}$", "isCorrect": true, "image": null}, {"id": "lYGkw", "label": "D", "text": "$\\text{C}_6\\text{H}_5 - \\text{CH}_2 - \\text{Br}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Williamson's synthesis is a method for preparing ethers by the reaction of an alkyl halide with a sodium alkoxide. This reaction follows an $S_N2$ mechanism.<br><br>For an $S_N2$ reaction to occur favorably, the halide should be primary or secondary (primary being the most reactive).<br><br>Let us evaluate the given options:<br>1. $\\text{C}_2\\text{H}_5\\text{Br}$ (Ethyl bromide) is a primary alkyl halide and readily undergoes Williamson's synthesis.<br>2. $\\text{CH}_3-\\text{CH}(\\text{CH}_3)-\\text{CH}_2-\\text{Br}$ (Isobutyl bromide) is a primary alkyl halide and undergoes Williamson's synthesis.<br>3. $\\text{C}_6\\text{H}_5-\\text{Br}$ (Bromobenzene) is an aryl halide. In aryl halides, the carbon-halogen bond acquires a partial double bond character due to resonance with the benzene ring. Additionally, the $sp^2$ hybridized carbon is more electronegative, making the $\\text{C}-\\text{Br}$ bond stronger and difficult to break. The bulky benzene ring also sterically hinders the backside attack required for an $S_N2$ mechanism. Therefore, aryl halides do not undergo Williamson's synthesis.<br>4. $\\text{C}_6\\text{H}_5-\\text{CH}_2-\\text{Br}$ (Benzyl bromide) is a primary benzylic halide, which is highly reactive towards $S_N2$ reactions and readily undergoes Williamson's synthesis.<br><br>Thus, $\\text{C}_6\\text{H}_5-\\text{Br}$ does not undergo Williamson's synthesis.<br><br>Answer: $\\text{C}_6\\text{H}_5 - \\text{Br}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d68c30a4553e1bdd50", "type": "singleCorrect", "question": {"text": "What is action of $\\text{CH}_3\\text{ONa}$ on $\\text{CH}_3\\text{CH}_2\\text{Br}$<br>$\\text{CH}_3\\text{ONa} + \\text{CH}_3\\text{CH}_2\\text{Br} \\rightarrow$ ?", "image": null}, "options": [{"id": "D2Oy4", "label": "A", "text": "Formation of $\\text{CH}_3\\text{OCH}_2\\text{CH}_3 + \\text{NaBr}$", "isCorrect": true, "image": null}, {"id": "wuJti", "label": "B", "text": "Formation of $\\text{CH}_3\\text{OH} + \\text{NaBr}$", "isCorrect": false, "image": null}, {"id": "Was8w", "label": "C", "text": "Formation of $\\text{CH}_3\\text{CH}_2\\text{OH}$", "isCorrect": false, "image": null}, {"id": "Uy35M", "label": "D", "text": "Formation of $(\\text{CH}_3)_2\\text{O}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reaction between sodium methoxide ($\\text{CH}_3\\text{ONa}$) and ethyl bromide ($\\text{CH}_3\\text{CH}_2\\text{Br}$) is an example of Williamson ether synthesis.<br><br>The methoxide ion ($\\text{CH}_3\\text{O}^{-}$) acts as a nucleophile and attacks the primary alkyl halide ($\\text{CH}_3\\text{CH}_2\\text{Br}$) via an $S_N2$ mechanism.<br><br>The reaction proceeds as follows:<br>$\\text{CH}_3\\text{ONa} + \\text{CH}_3\\text{CH}_2\\text{Br} \\rightarrow \\text{CH}_3\\text{OCH}_2\\text{CH}_3 + \\text{NaBr}$<br><br>The products formed are ethyl methyl ether and sodium bromide.<br><br>Answer: Formation of $\\text{CH}_3\\text{OCH}_2\\text{CH}_3 + \\text{NaBr}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e38c30a4553e1bdde4", "type": "singleCorrect", "question": {"text": "Which of the following compounds is obtained by Williamson synthesis ?", "image": null}, "options": [{"id": "bEcEy", "label": "A", "text": "only simple ethers", "isCorrect": false, "image": null}, {"id": "zZ7kh", "label": "B", "text": "only mixed ethers", "isCorrect": false, "image": null}, {"id": "PDhpL", "label": "C", "text": "simple and mixed ethers.", "isCorrect": true, "image": null}, {"id": "thriw", "label": "D", "text": "esters", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Williamson synthesis is a general method for the preparation of ethers. It involves the nucleophilic substitution reaction of an alkyl halide with a sodium alkoxide.<br><br>$R-X + R'-ONa \\rightarrow R-O-R' + NaX$<br><br>When the alkyl groups $R$ and $R'$ are identical, symmetrical or simple ethers are formed. When $R$ and $R'$ are different, unsymmetrical or mixed ethers are formed.<br><br>Thus, both simple and mixed ethers can be prepared by this method.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3628c30a4553e1be32b", "type": "singleCorrect", "question": {"text": "What type of mechanism is followed by dehydration of alcohol to form ether?", "image": null}, "options": [{"id": "nHbfR", "label": "A", "text": "Nucleophilic substitution unimolecular reaction", "isCorrect": false, "image": null}, {"id": "9dvPZ", "label": "B", "text": "Nucleophilic substitution bimolecular reaction", "isCorrect": true, "image": null}, {"id": "lACgq", "label": "C", "text": "Electrophilic substitution reaction", "isCorrect": false, "image": null}, {"id": "0Q72X", "label": "D", "text": "Electrophilic addition reaction", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The dehydration of alcohols to form ethers is an acid-catalyzed reaction that proceeds via an $S_N2$ mechanism.<br><br>Step 1: Protonation of the alcohol to form an oxonium ion.<br>$R-OH + H^+ \\rightleftharpoons R-OH_2^+$<br><br>Step 2: Nucleophilic attack of an unprotonated alcohol molecule on the protonated alcohol. This is a bimolecular nucleophilic substitution ($S_N2$) reaction where water acts as the leaving group.<br>$R-OH + R-OH_2^+ \\rightarrow R-O^+(H)-R + H_2O$<br><br>Step 3: Loss of a proton to yield the ether.<br>$R-O^+(H)-R \\rightarrow R-O-R + H^+$<br><br>Since the rate-determining step involves two molecules (the alcohol acting as a nucleophile and the protonated alcohol acting as the substrate), the mechanism is a nucleophilic substitution bimolecular reaction.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b98c30a4553e1bdc23", "type": "singleCorrect", "question": {"text": "Which from following is a suitable method for preparation of ether?", "image": null}, "options": [{"id": "fvgcD", "label": "A", "text": "Reacting sodium methoxide and tertiary butyl bromide", "isCorrect": false, "image": null}, {"id": "vHYYS", "label": "B", "text": "Reacting sodium tertiarybutoxide and methyl bromide", "isCorrect": true, "image": null}, {"id": "xVNbs", "label": "C", "text": "Reacting methyl alcohol and ethene", "isCorrect": false, "image": null}, {"id": "CkQgF", "label": "D", "text": "Reacting methyl alcohol and methyl bromide", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Williamson ether synthesis is an $S_N2$ reaction between an alkoxide ion and an alkyl halide. For the successful preparation of an ether, the alkyl halide must be primary or methyl, as secondary and tertiary alkyl halides tend to undergo elimination reactions in the presence of strong bases (alkoxides) to form alkenes.<br><br>Reacting sodium methoxide with tertiary butyl bromide (a $3^{\\circ}$ alkyl halide) will predominantly yield isobutylene (an alkene) due to elimination.<br><br>Reacting sodium tertiarybutoxide with methyl bromide (a methyl halide) will successfully yield methyl tert-butyl ether, as methyl halides cannot undergo elimination and are highly reactive towards $S_N2$ substitution.<br><br>Therefore, reacting sodium tertiarybutoxide and methyl bromide is the suitable method.<br><br>Answer: Reacting sodium tertiarybutoxide and methyl bromide", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214230aee93fa0796de44", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Which of the following compounds does not undergo Williamson's synthesis?", "image": null}, "options": [{"id": "fDLSQ", "text": "$\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{Br}$", "image": null, "isCorrect": false}, {"id": "alHIc", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/AhRgJRbyYPAnxk1Qy7zq0ErZbd1ogBU_K4UdotGZCjU.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "ecK3d", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{Cl}$", "image": null, "isCorrect": true}, {"id": "a6Gdu", "text": "$\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{Cl}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Williamson's synthesis is a method for preparing ethers by the reaction of an alkyl halide with a sodium alkoxide. The reaction follows an $S_N2$ mechanism.<br><br>For the reaction to be successful and give a good yield of ether, the halide used must be an alkyl halide (preferably primary).<br><br>Aryl halides, such as chlorobenzene ($\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{Cl}$), are extremely unreactive towards nucleophilic substitution reactions under normal conditions. This is because the $\\mathrm{C}-\\mathrm{Cl}$ bond acquires a partial double bond character due to resonance with the benzene ring, and the carbon atom attached to the chlorine is $sp^2$ hybridized, making the bond stronger and harder to break.<br><br>The other options (ethyl bromide, isobutyl chloride, and n-propyl chloride) are all primary alkyl halides and readily undergo Williamson's synthesis.<br><br>Therefore, $\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{Cl}$ does not undergo Williamson's synthesis.<br><br>Answer: $\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{Cl}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139d0aee93fa0796da2d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Which among the following is the method for the preparation of ethers?", "image": null}, "options": [{"id": "jTceV", "text": "By the action of moist $\\mathrm{Ag}_2 \\mathrm{O}$ an alkyl halide", "image": null, "isCorrect": false}, {"id": "IE13k", "text": "By the action of aq. KOH on alkyl halide.", "image": null, "isCorrect": false}, {"id": "yrmCf", "text": "By the action of alc. Sodium hydroxide on alkyl halide.", "image": null, "isCorrect": false}, {"id": "ciD1n", "text": "By the action of sodium alkoxide on alkyl halide.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The reaction of an alkyl halide with sodium alkoxide is known as Williamson ether synthesis, which is a standard method for the preparation of ethers.<br><br>$R-X + R'-O^{-}Na^{+} \\rightarrow R-O-R' + NaX$<br><br>The action of moist $Ag_2O$ on an alkyl halide yields an alcohol, as moist $Ag_2O$ behaves like $AgOH$.<br><br>The action of aqueous $KOH$ on an alkyl halide also yields an alcohol via nucleophilic substitution.<br><br>The action of alcoholic sodium hydroxide on an alkyl halide results in an elimination reaction, yielding an alkene.<br><br>Answer: By the action of sodium alkoxide on alkyl halide.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213280aee93fa0796d695", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Identify the product obtained when methyl bromide reacts with sodium tert-butoxide.", "image": null}, "options": [{"id": "WwtLc", "text": "Isobutylene and methanol", "image": null, "isCorrect": false}, {"id": "pnRNU", "text": "1-Methoxybutane", "image": null, "isCorrect": false}, {"id": "Jk49X", "text": "2-Methoxvbutane", "image": null, "isCorrect": false}, {"id": "Ywd9l", "text": "2-Methoxy-2-methylpropane", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Methyl bromide ($CH_3Br$) is a methyl halide, which is highly reactive towards $S_N2$ substitution and cannot undergo elimination.<br><br>Sodium tert-butoxide ($(CH_3)_3CO^{-}Na^{+}$) acts as a nucleophile.<br><br>The reaction proceeds via the $S_N2$ mechanism, which is a standard Williamson ether synthesis.<br><br>$(CH_3)_3CO^{-}Na^{+} + CH_3Br \\rightarrow (CH_3)_3C-O-CH_3 + NaBr$<br><br>The product $(CH_3)_3C-O-CH_3$ is tert-butyl methyl ether, and its IUPAC name is 2-methoxy-2-methylpropane.<br><br>Answer: 2-Methoxy-2-methylpropane", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262240279619d9d8a3221", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Identify the product obtained when ethoxybenzene reacts with hot and concentrated $\\mathrm{HI}$.", "image": null}, "options": [{"id": "uIPqT", "text": "Ethyl iodide and Phenol", "image": null, "isCorrect": true}, {"id": "ZGDG3", "text": "Ethyl alcohol and Phenol", "image": null, "isCorrect": false}, {"id": "hu6Fb", "text": "Ethyl alcohol and Iodobenzene", "image": null, "isCorrect": false}, {"id": "THD5N", "text": "Ethyl iodide and Iodobenzene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/ckoKQdL4BJB3oJHs_5udUZM0KhSqyFEb0H8T_fAPoCQ.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262210279619d9d8a3205", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Which of the following compounds does NOT undergo Williamson's synthesis?", "image": null}, "options": [{"id": "ZBmF9", "text": "$\\mathrm{C}_2 \\mathrm{H}_5-\\mathrm{Cl}$", "image": null, "isCorrect": false}, {"id": "S2F95", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/2elv2Z3WL7V_Qg9E0dinro7PnmLRdcwLpwDHzHy1jo4.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "vMUR1", "text": "$\\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{Cl}$", "image": null, "isCorrect": true}, {"id": "2ahji", "text": "$\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{Cl}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Aryl halides do not give Williamson's synthesis.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2617a0279619d9d8a2ce7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "What is the temperature at which the ethers can be prepared from alcohols by the action of concentrated $\\mathrm{H}_2 \\mathrm{SO}_4$ ?", "image": null}, "options": [{"id": "OBqxb", "text": "$413 \\mathrm{~K}$", "image": null, "isCorrect": true}, {"id": "WjcKU", "text": "$213 \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "VvB6j", "text": "$113 \\mathrm{~K}$", "image": null, "isCorrect": false}, {"id": "N5O5J", "text": "$443 \\mathrm{~K}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/uGQVF6vhCK3FU1ZEDMGsHGE1bBcSzPFJ8oFBQrx3Hjk.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8e0279619d9d8a1563", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "Which of the following ether is formed from alcohol and diazomethane?", "image": null}, "options": [{"id": "DfReE", "text": "1-ethoxypropane", "image": null, "isCorrect": false}, {"id": "CoSs6", "text": "ethoxyethane", "image": null, "isCorrect": false}, {"id": "Xl5hC", "text": "l-methoxypropane", "image": null, "isCorrect": true}, {"id": "qIL4S", "text": "2-ethoxypropane", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "1-methoxypropane is formed from propanol and diazomethane.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/U4oQfJOekGjdbu95tNw7IZqY7TbiL7UpjNuWGDAJIdc.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/w4ayE4hU5a-eVhMI2-knDXtYejNW76fardOivUrgdag.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e690279619d9d8a1438", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "In the following reaction,\nEthyl alcohol $+\\mathrm{H}^{+} \\quad \\frac{413 \\mathrm{~K}}{\\longrightarrow}$\n$\\begin{array}{ll}\\text { (in excess) } & \\text { (from } \\mathrm{H}_{2} \\mathrm{SO}_{4} \\text { ) }\\end{array}$\nproduct, the product is", "image": null}, "options": [{"id": "MJCDO", "text": "ethene", "image": null, "isCorrect": false}, {"id": "9mNnW", "text": "ethyl hydrogen sulphate", "image": null, "isCorrect": false}, {"id": "1KliO", "text": "diethyl ether", "image": null, "isCorrect": true}, {"id": "wqt3q", "text": "acetylene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/n1yB-br0yW-tp1MSzZr3rzQ6rOIikxE6E-uONU0tmsU.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e530279619d9d8a1384", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "In the reaction,\n$2 A+$ dry silver oxide $\\stackrel{\\Delta}{\\longrightarrow}$ ether $+2 \\operatorname{Ag} X$\n$A$ is a/an", "image": null}, "options": [{"id": "wusXp", "text": "primary alcohol", "image": null, "isCorrect": false}, {"id": "cOuaf", "text": "acid", "image": null, "isCorrect": false}, {"id": "YOD1s", "text": "alkyl halide", "image": null, "isCorrect": true}, {"id": "bAfW7", "text": "alcohol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "An alkyl halide on heating with dry silver oxide gives ether.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Ai0_HJxvM-PDG8ksUvTje9BbH-ruo-lZPN4hTt2b1jI.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "6a44d3998c30a4553e1be405", "title": "Physical Properties of Phenol", "totalQuestions": 5, "questions": [{"_id": "6abb886315a9fc0fc8c1433d", "type": "singleCorrect", "question": {"text": "Which of the following compounds is NOT a dihydric phenol?", "image": null}, "options": [{"id": "Y3Aa2", "label": "A", "text": "Quinol", "isCorrect": false, "image": null}, {"id": "4mJ0I", "label": "B", "text": "Resorcinol", "isCorrect": false, "image": null}, {"id": "xWQGm", "label": "C", "text": "Catechol", "isCorrect": false, "image": null}, {"id": "h8Iva", "label": "D", "text": "Phloroglucinol", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Dihydric phenols are compounds that contain two hydroxyl ($-OH$) groups attached directly to a benzene ring.<br><br>Quinol (hydroquinone) is benzene-$1,4$-diol, which has two $-OH$ groups.<br><br>Resorcinol is benzene-$1,3$-diol, which has two $-OH$ groups.<br><br>Catechol is benzene-$1,2$-diol, which has two $-OH$ groups.<br><br>Phloroglucinol is benzene-$1,3,5$-triol, which contains three $-OH$ groups and is therefore a trihydric phenol.<br><br>Thus, phloroglucinol is not a dihydric phenol.<br><br>Answer: Phloroglucinol", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886315a9fc0fc8c1433c", "type": "singleCorrect", "question": {"text": "Which of the following is trihydric phenol?", "image": null}, "options": [{"id": "ItZ9Q", "label": "A", "text": "Cresol", "isCorrect": false, "image": null}, {"id": "ki5nb", "label": "B", "text": "Quinol", "isCorrect": false, "image": null}, {"id": "0cmt1", "label": "C", "text": "Catechol", "isCorrect": false, "image": null}, {"id": "4X4Im", "label": "D", "text": "Phloroglucinol", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "A trihydric phenol contains three hydroxyl ($-OH$) groups attached to a benzene ring.<br><br>Cresol is methylphenol, which contains one $-OH$ group and one $-CH_3$ group. It is a monohydric phenol.<br><br>Quinol (hydroquinone) is benzene-$1,4$-diol, which contains two $-OH$ groups. It is a dihydric phenol.<br><br>Catechol is benzene-$1,2$-diol, which contains two $-OH$ groups. It is a dihydric phenol.<br><br>Phloroglucinol is benzene-$1,3,5$-triol, which contains three $-OH$ groups. It is a trihydric phenol.<br><br>Answer: Phloroglucinol", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3538c30a4553e1be285", "type": "singleCorrect", "question": {"text": "Which among the following compounds has highest solubility in water?", "image": null}, "options": [{"id": "MB3Ls", "label": "A", "text": "Phenol", "isCorrect": true, "image": null}, {"id": "YbLtB", "label": "B", "text": "p-resol", "isCorrect": false, "image": null}, {"id": "D8KCt", "label": "C", "text": "o-Nitrophenol", "isCorrect": false, "image": null}, {"id": "sbEKh", "label": "D", "text": "p-Nitrophenol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Solubility of organic compounds in water depends on their ability to form hydrogen bonds with water molecules, the size of the hydrophobic part, and the lattice energy of the solid.<br><br>1. Phenol forms strong intermolecular hydrogen bonds with water, making it quite soluble (solubility $\\approx 8.3 \\text{ g/100 mL}$).<br><br>2. p-Cresol contains an additional hydrophobic methyl ($-CH_3$) group, which increases the non-polar character and decreases its solubility compared to phenol (solubility $\\approx 1.9 \\text{ g/100 mL}$).<br><br>3. o-Nitrophenol exhibits intramolecular hydrogen bonding (chelation). This restricts its ability to form intermolecular hydrogen bonds with water, resulting in very low solubility (solubility $\\approx 0.2 \\text{ g/100 mL}$).<br><br>4. p-Nitrophenol can form intermolecular hydrogen bonds with water. However, due to its higher molecular mass and strong intermolecular interactions in the solid state (high lattice energy), its solubility is lower than that of phenol (solubility $\\approx 1.6 \\text{ g/100 mL}$).<br><br>Therefore, phenol has the highest solubility in water among the given compounds.<br><br>Answer: Phenol", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3468c30a4553e1be207", "type": "singleCorrect", "question": {"text": "Which among the following has highest melting point ?", "image": null}, "options": [{"id": "VTNnU", "label": "A", "text": "Phenol", "isCorrect": false, "image": null}, {"id": "g55Fq", "label": "B", "text": "o-Nitrophenol", "isCorrect": false, "image": null}, {"id": "RPEWu", "label": "C", "text": "p-Nitrophenol", "isCorrect": true, "image": null}, {"id": "6ea2d", "label": "D", "text": "p-Cresol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "p-Nitrophenol has the highest melting point among the given compounds.<br><br>In p-nitrophenol, there is strong intermolecular hydrogen bonding between the -OH group of one molecule and the -NO$_2$ group of another molecule. This leads to the association of molecules, requiring more thermal energy to break the crystal lattice.<br><br>In contrast, o-nitrophenol exhibits intramolecular hydrogen bonding (chelation), which restricts molecular association and lowers its melting point.<br><br>Phenol and p-cresol also exhibit intermolecular hydrogen bonding, but the interactions are weaker compared to p-nitrophenol. Additionally, the highly symmetrical structure of p-nitrophenol allows it to pack more efficiently in the solid state, further increasing its melting point.<br><br>Answer: p-Nitrophenol", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c78c30a4553e1bdcb5", "type": "singleCorrect", "question": {"text": "Identify trihydric phenol from following.", "image": null}, "options": [{"id": "PhUVp", "label": "A", "text": "Hydroquinone", "isCorrect": false, "image": null}, {"id": "qlJCq", "label": "B", "text": "Catechol", "isCorrect": false, "image": null}, {"id": "wTksg", "label": "C", "text": "O-Cresol", "isCorrect": false, "image": null}, {"id": "gKpzk", "label": "D", "text": "Pyrogallol", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Trihydric phenols are compounds that contain three hydroxyl ($-OH$) groups attached directly to the benzene ring.<br><br>Hydroquinone is benzene-1,4-diol, which contains two $-OH$ groups and is a dihydric phenol.<br><br>Catechol is benzene-1,2-diol, which contains two $-OH$ groups and is a dihydric phenol.<br><br>o-Cresol is 2-methylphenol, which contains one $-OH$ group and is a monohydric phenol.<br><br>Pyrogallol is benzene-1,2,3-triol, which contains three $-OH$ groups and is a trihydric phenol.<br><br>Answer: Pyrogallol", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "65a263310279619d9d8a3cdb", "title": "Reactions of Ethers", "totalQuestions": 23, "questions": [{"_id": "6abb887315a9fc0fc8c143d4", "type": "singleCorrect", "question": {"text": "Identify the product obtained in following reaction.<br>\n\\(\\mathrm{C}_3 \\mathrm{H}_7-\\mathrm{O}-\\mathrm{C}_3 \\mathrm{H}_7+\\underset{\\text { excess }}{\\mathrm{HI}} \\xrightarrow[\\mathrm{Hot}]{\\Delta} X+Y\\)", "image": null}, "options": [{"id": "l27Hc", "label": "A", "text": "\\(\\mathrm{C}_3 \\mathrm{H}_7 \\mathrm{OH}\\) and \\(\\mathrm{H}_2 \\mathrm{O}\\)", "isCorrect": false, "image": null}, {"id": "hsW8O", "label": "B", "text": "\\(\\mathrm{C}_3 \\mathrm{H}_7\\) and \\(\\mathrm{H}_2 \\mathrm{O}\\)", "isCorrect": false, "image": null}, {"id": "VDwGE", "label": "C", "text": "\\(\\mathrm{C}_3 \\mathrm{H}_7 \\mathrm{I}\\) and \\(\\mathrm{C}_3 \\mathrm{H}_7 \\mathrm{OH}\\)", "isCorrect": false, "image": null}, {"id": "8SNRK", "label": "D", "text": "\\(\\mathrm{C}_3 \\mathrm{H}_7 \\mathrm{I}\\) and \\(\\mathrm{H}_2 \\mathrm{O}\\)", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The reaction of an ether with excess hot hydroiodic acid ($\\mathrm{HI}$) leads to the cleavage of the $\\mathrm{C}-\\mathrm{O}$ bond on both sides.<br><br>First, the ether reacts with one molecule of $\\mathrm{HI}$ to form an alkyl iodide and an alcohol:<br>$\\mathrm{C}_3\\mathrm{H}_7-\\mathrm{O}-\\mathrm{C}_3\\mathrm{H}_7 + \\mathrm{HI} \\rightarrow \\mathrm{C}_3\\mathrm{H}_7\\mathrm{I} + \\mathrm{C}_3\\mathrm{H}_7\\mathrm{OH}$<br><br>Since $\\mathrm{HI}$ is present in excess and the reaction mixture is heated, the alcohol formed undergoes further substitution by $\\mathrm{HI}$ to yield another molecule of alkyl iodide and water:<br>$\\mathrm{C}_3\\mathrm{H}_7\\mathrm{OH} + \\mathrm{HI} \\rightarrow \\mathrm{C}_3\\mathrm{H}_7\\mathrm{I} + \\mathrm{H}_2\\mathrm{O}$<br><br>The overall reaction is:<br>$\\mathrm{C}_3\\mathrm{H}_7-\\mathrm{O}-\\mathrm{C}_3\\mathrm{H}_7 + 2\\mathrm{HI} \\xrightarrow{\\Delta} 2\\mathrm{C}_3\\mathrm{H}_7\\mathrm{I} + \\mathrm{H}_2\\mathrm{O}$<br><br>Thus, the products $X$ and $Y$ are $\\mathrm{C}_3\\mathrm{H}_7\\mathrm{I}$ and $\\mathrm{H}_2\\mathrm{O}$.<br><br>Answer: \\(\\mathrm{C}_3 \\mathrm{H}_7 \\mathrm{I}\\) and \\(\\mathrm{H}_2 \\mathrm{O}\\)", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887315a9fc0fc8c143d2", "type": "singleCorrect", "question": {"text": "Identify 'X' and 'Y' in the following reaction.<br>$C_3H_7 - O - C_3H_7 + HI\\ (\\text{excess}) \\xrightarrow[\\text{Hot}]{\\Delta} X + Y$", "image": null}, "options": [{"id": "jOukV", "label": "A", "text": "$C_3H_7OH$ and $H_2O$", "isCorrect": false, "image": null}, {"id": "ZeTEK", "label": "B", "text": "$C_3H_7$ and $H_2O$", "isCorrect": false, "image": null}, {"id": "RsD6a", "label": "C", "text": "$C_3H_7I$ and $C_3H_7OH$", "isCorrect": false, "image": null}, {"id": "5zgIS", "label": "D", "text": "$C_3H_7I$ and $H_2O$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "When an ether is treated with excess $HI$ at high temperature, the ether undergoes complete cleavage to form alkyl iodides and water.<br><br>The reaction proceeds in two steps. First, one molecule of $HI$ cleaves the ether to form one molecule of alkyl iodide and one molecule of alcohol.<br><br>$C_3H_7 - O - C_3H_7 + HI \\rightarrow C_3H_7I + C_3H_7OH$<br><br>Since $HI$ is present in excess and the reaction mixture is hot, the alcohol formed further reacts with $HI$ to form another molecule of alkyl iodide and water.<br><br>$C_3H_7OH + HI \\rightarrow C_3H_7I + H_2O$<br><br>The overall reaction is:<br><br>$C_3H_7 - O - C_3H_7 + 2HI \\xrightarrow{\\Delta} 2C_3H_7I + H_2O$<br><br>Thus, the products $X$ and $Y$ are $C_3H_7I$ and $H_2O$.<br><br>Answer: $C_3H_7I$ and $H_2O$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888315a9fc0fc8c14468", "type": "singleCorrect", "question": {"text": "Which of the following statements regarding ethers is NOT true?", "image": null}, "options": [{"id": "Wrshk", "label": "A", "text": "Aryl alkyl ethers have weaker and longer bonds between oxygen and aromatic ring.", "isCorrect": true, "image": null}, {"id": "zMKL2", "label": "B", "text": "The alkoxy group in aryl alkyl ethers exhibits $+R$ effect.", "isCorrect": false, "image": null}, {"id": "EqoJd", "label": "C", "text": "When ethers are exposed to the atmosphere, they form corresponding peroxides.", "isCorrect": false, "image": null}, {"id": "knMIL", "label": "D", "text": "Ethers dissolve in cold, concentrated $\\text{H}_2\\text{SO}_4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In aryl alkyl ethers, the lone pair of electrons on the oxygen atom is in conjugation with the aromatic ring. This resonance imparts a partial double bond character to the carbon-oxygen bond attached to the aromatic ring. As a result, the bond between the oxygen and the aromatic ring is shorter and stronger than a typical single bond.<br><br>The alkoxy group ($-OR$) exhibits a $+R$ effect, increasing electron density on the benzene ring.<br><br>Ethers react with atmospheric oxygen to form peroxides, which is a well-known property.<br><br>Ethers act as Lewis bases and dissolve in cold, concentrated $\\text{H}_2\\text{SO}_4$ by forming soluble oxonium salts.<br><br>Therefore, the statement that aryl alkyl ethers have weaker and longer bonds between oxygen and the aromatic ring is incorrect.<br><br>Answer: Aryl alkyl ethers have weaker and longer bonds between oxygen and aromatic ring.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c315a9fc0fc8c146c1", "type": "singleCorrect", "question": {"text": "Identify the product formed when aryl-alkyl ether reacts with cold HI.", "image": null}, "options": [{"id": "7ELsX", "label": "A", "text": "alkyl iodide and water", "isCorrect": false, "image": null}, {"id": "leWsP", "label": "B", "text": "aryl iodide and water", "isCorrect": false, "image": null}, {"id": "5g7AJ", "label": "C", "text": "alkyl iodide, aryl iodide and water", "isCorrect": false, "image": null}, {"id": "tL7wU", "label": "D", "text": "phenol and alkyl iodide", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Aryl-alkyl ethers have the general formula $Ar-O-R$.<br><br>When reacted with cold $HI$, the ether oxygen gets protonated to form an oxonium ion, $Ar-\\overset{+}{O}(H)-R$.<br><br>The $Ar-O$ bond has partial double bond character due to resonance between the lone pair of electrons on the oxygen atom and the aromatic ring. This makes the $Ar-O$ bond stronger and more difficult to cleave than the $O-R$ bond.<br><br>Furthermore, nucleophilic substitution ($S_{N}2$) by the iodide ion cannot occur at the $sp^2$ hybridized carbon of the aromatic ring.<br><br>Therefore, the iodide ion attacks the alkyl group $R$, cleaving the $O-R$ bond to yield phenol ($Ar-OH$) and an alkyl iodide ($R-I$).<br><br>Answer: phenol and alkyl iodide", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c315a9fc0fc8c146c0", "type": "singleCorrect", "question": {"text": "Identify the product obtained when tert-Butyl methyl ether is heated with hot HI.", "image": null}, "options": [{"id": "mVpQS", "label": "A", "text": "$\\text{CH}_3\\text{I} + (\\text{CH}_3)_3\\text{COH}$", "isCorrect": false, "image": null}, {"id": "IBH3Y", "label": "B", "text": "$\\text{CH}_3\\text{OH} + (\\text{CH}_3)_3\\text{C-I}$", "isCorrect": false, "image": null}, {"id": "dJOwX", "label": "C", "text": "$\\text{CH}_3\\text{OH} + (\\text{CH}_3)_3\\text{C-OH}$", "isCorrect": false, "image": null}, {"id": "Hu6Hc", "label": "D", "text": "$\\text{CH}_3\\text{I} + (\\text{CH}_3)_3\\text{C-I}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "When tert-butyl methyl ether is treated with HI, the ether oxygen is first protonated to form an oxonium ion.<br><br>The cleavage of the C-O bond occurs via an $S_N1$ mechanism because the resulting tert-butyl carbocation is highly stable. The iodide ion ($I^-$) then attacks the tert-butyl carbocation to form tert-butyl iodide, $(\\text{CH}_3)_3\\text{C-I}$, and methanol, $\\text{CH}_3\\text{OH}$, is released.<br><br>Since the reaction is carried out with hot HI (which implies excess HI and elevated temperature), the methanol formed undergoes further nucleophilic substitution with HI to form methyl iodide, $\\text{CH}_3\\text{I}$, and water.<br><br>The overall reaction is:<br>$(\\text{CH}_3)_3\\text{C-O-CH}_3 + 2\\text{HI} \\xrightarrow{\\Delta} (\\text{CH}_3)_3\\text{C-I} + \\text{CH}_3\\text{I} + \\text{H}_2\\text{O}$<br><br>Therefore, the final products are $\\text{CH}_3\\text{I}$ and $(\\text{CH}_3)_3\\text{C-I}$.<br><br>Answer: $\\text{CH}_3\\text{I} + (\\text{CH}_3)_3\\text{C-I}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d58c30a4553e1bdd4e", "type": "singleCorrect", "question": {"text": "Which of the following ether, on hydrolysis, gives two different products that are successive members of the homologous series?", "image": null}, "options": [{"id": "jO6GI", "label": "A", "text": "Methoxymethane", "isCorrect": false, "image": null}, {"id": "RCZT3", "label": "B", "text": "Methoxypropane", "isCorrect": false, "image": null}, {"id": "0Rw03", "label": "C", "text": "Ethoxypropane", "isCorrect": true, "image": null}, {"id": "rcpB8", "label": "D", "text": "1-Methoxypropane", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Hydrolysis of an ether $R-O-R'$ yields two alcohol molecules, $R-OH$ and $R'-OH$.<br><br>For the products to be successive members of a homologous series, they must differ by exactly one $-CH_2-$ unit. This means the alkyl groups $R$ and $R'$ must differ by one carbon atom.<br><br>Methoxymethane ($CH_3-O-CH_3$) gives two molecules of methanol, which are identical.<br><br>Methoxypropane ($CH_3-O-C_3H_7$) gives methanol and propanol, which differ by two carbon atoms.<br><br>Ethoxypropane ($C_2H_5-O-C_3H_7$) gives ethanol ($C_2H_5OH$) and propanol ($C_3H_7OH$). These are successive members of the alcohol homologous series as they differ by one $-CH_2-$ group.<br><br>Answer: Ethoxypropane", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba9bf9280d7f9932b56", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following compounds is formed when ether is dissolved in cold concentrated sulphuric acid?", "image": null}, "options": [{"id": "Fw06C", "text": "Alkanol", "image": null, "isCorrect": false}, {"id": "Xm0fC", "text": "Alkanoic acid", "image": null, "isCorrect": false}, {"id": "zgkQv", "text": "Alkyl hydrogen sulphate", "image": null, "isCorrect": false}, {"id": "oVDb9", "text": "Oxonium salt", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Ethers behave as Lewis bases due to the presence of two lone pairs of electrons on the oxygen atom.<br><br>When dissolved in cold concentrated sulphuric acid, ethers accept a proton from the acid to form oxonium salts.<br><br>$R-O-R + H_2SO_4 \\rightarrow [R-O(H)-R]^+ HSO_4^-$<br><br>Due to the formation of this oxonium salt, ethers are soluble in cold concentrated sulphuric acid.<br><br>Answer: Oxonium salt", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214100aee93fa0796ddae", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Ethers when dissolved in cold concentrated sulfuric acid forms,", "image": null}, "options": [{"id": "RLNSD", "text": "Alkanols", "image": null, "isCorrect": false}, {"id": "9tPC2", "text": "Alkanoic acids", "image": null, "isCorrect": false}, {"id": "hyVIY", "text": "Alkyl hydrogen sulphate", "image": null, "isCorrect": false}, {"id": "9vkwB", "text": "Oxonium salts", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Ethers behave as Lewis bases due to the presence of two lone pairs of electrons on the oxygen atom.<br><br>When dissolved in cold concentrated sulfuric acid, ethers accept a proton from the acid to form oxonium salts.<br><br>$R-O-R + H_2SO_4 \\rightarrow [R-\\overset{+}{O}(H)-R] HSO_4^-$<br><br>This property is used to distinguish ethers from alkanes, which do not react with cold concentrated sulfuric acid.<br><br>Answer: Oxonium salts", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fe0aee93fa0796dd26", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Identify product ' $B$ ' in the following reaction.\r\nSodium phenoxide $\\xrightarrow[6 \\text { atm }]{\\mathrm{CO}_2, 398 \\mathrm{~K}} \\mathrm{~A} \\xrightarrow{\\mathrm{H}_3 \\mathrm{O}^{+}} \\mathrm{B}$", "image": null}, "options": [{"id": "fx8uY", "text": "Picric acid", "image": null, "isCorrect": false}, {"id": "82h3Q", "text": "Sulphonic acid", "image": null, "isCorrect": false}, {"id": "s8jua", "text": "Salicylic acid", "image": null, "isCorrect": true}, {"id": "zYbQD", "text": "Salicylaldehyde", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is Kolbe's reaction.<br><br>When sodium phenoxide is treated with carbon dioxide at $398 \\text{ K}$ under a pressure of $6 \\text{ atm}$, it undergoes electrophilic substitution to form sodium salicylate (A).<br><br>Acidification of sodium salicylate with $\\text{H}_3\\text{O}^{+}$ yields salicylic acid (B).<br><br>Answer: Salicylic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213750aee93fa0796d8ef", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Identify the product obtained when ethers are dissolved in cold concentrated sulphuric acid.", "image": null}, "options": [{"id": "fjkpE", "text": "Alkanols", "image": null, "isCorrect": false}, {"id": "9MKxN", "text": "Alkanoic acids", "image": null, "isCorrect": false}, {"id": "dkQdr", "text": "Alkyl hydrogen sulphate", "image": null, "isCorrect": false}, {"id": "xicSu", "text": "Oxonium salts", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Ethers behave as Lewis bases due to the presence of two lone pairs of electrons on the oxygen atom.<br><br>When treated with cold concentrated sulphuric acid, ethers accept a proton from the acid to form oxonium salts.<br><br>$R-O-R + H_2SO_4 \\rightarrow [R-O(H)-R]^+ HSO_4^-$<br><br>This formation of oxonium salts makes ethers soluble in cold concentrated sulphuric acid, a property often used to distinguish them from alkanes and alkyl halides.<br><br>Answer: Oxonium salts", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133a0aee93fa0796d721", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "What is the percentage of p-bromoanisole formed in the bromination of anisole with bromine in acetic acid?", "image": null}, "options": [{"id": "rWcsV", "text": "$10 \\%$", "image": null, "isCorrect": false}, {"id": "p6qAY", "text": "$30 \\%$", "image": null, "isCorrect": false}, {"id": "zPV0g", "text": "$60 \\%$", "image": null, "isCorrect": false}, {"id": "krLwU", "text": "$90 \\%$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Bromination of anisole with bromine in ethanoic acid (acetic acid) occurs even in the absence of a Lewis acid catalyst due to the strong activating nature of the methoxy group.<br><br>The methoxy group is ortho/para directing. Due to steric hindrance at the ortho position, the para isomer (p-bromoanisole) is formed as the major product.<br><br>The yield of p-bromoanisole in this reaction is $90 \\%$.<br><br>Answer: $90 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260aa0279619d9d8a2658", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisib tionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e450279619d9d8a1314", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Which does not react with Fehling's solution?", "image": null}, "options": [{"id": "LokWE", "text": "$\\mathrm{CH}_{3} \\mathrm{CHO}$", "image": null, "isCorrect": false}, {"id": "xcBMP", "text": "$\\mathrm{C}_{6} \\mathrm{H}_{5} \\mathrm{CHO}$", "image": null, "isCorrect": true}, {"id": "dMNMh", "text": "$\\mathrm{C}_{6} \\mathrm{H}_{12} \\mathrm{O}_{6}$", "image": null, "isCorrect": false}, {"id": "HynSh", "text": "$\\mathrm{HCOOH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Aromatic aldehyde $i e, \\mathrm{C}_{6} \\mathrm{H}_{5} \\mathrm{CHO}$ are not able to reduce Fehling's solution but it gives Cannizaro's reaction with alkali.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e440279619d9d8a1310", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The aldol condensation of $\\mathrm{CH}_{3}-\\ma
