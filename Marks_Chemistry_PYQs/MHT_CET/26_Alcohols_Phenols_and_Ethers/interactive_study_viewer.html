{"text": "Silver mirror test or Tollen's test is given by only aldehydes. Hence, ethanal on reaction with ammonical silver nitrate solution forms precipitate of silver.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2603d0279619d9d8a22e1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "When alcoholic solution of an organic compound is treated with few drops of shiff's reagent, pink colour appears. This confirms the presence of group", "image": null}, "options": [{"id": "zKPfy", "text": "$-\\mathrm{COOH}$", "image": null, "isCorrect": false}, {"id": "bbDl3", "text": "$-\\mathrm{CHO}$", "image": null, "isCorrect": true}, {"id": "FxWKn", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/SdT7swiYYFOrHIyrqSA5PLPGCdtk-bNfLRnzQk2uLB8.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "0zuUV", "text": "$$\n\\text { }-\\mathrm{CH}_2 \\mathrm{OH}\n$$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Schiff test confirms the presence of aldehydic $(-\\mathrm{CHO})$ group.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e580279619d9d8a13ad", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "Iodoform test is not given by", "image": null}, "options": [{"id": "tZIPb", "text": "2 -pentanone", "image": null, "isCorrect": false}, {"id": "2g1kG", "text": "ethanol", "image": null, "isCorrect": false}, {"id": "qoQ46", "text": "ethanal", "image": null, "isCorrect": false}, {"id": "6KgGj", "text": "3-pentanone", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Iodoform test is given by compounds which have \n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/igQoMRp1DPPiQ_BegXmomiv1QFTU69TyAamLVOugnrE.original.fullsize.png\"><br> group or<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/uBsqwF7-LoMVnM8Iq4z4J6wSAsVeJWWaNSgE4_CeFwA.original.fullsize.png\"><br>\ngroup, Hence, $\\quad$ 2-pentanone, $\\mathrm{CH}_{3} \\mathrm{CHO}$ and $\\mathrm{C}_{2} \\mathrm{H}_{5} \\mathrm{OH}$\ngive this test. But 3-pentanone $\\left(\\mathrm{CH}_{3} \\mathrm{CH}_{2} \\mathrm{COCH}_{2} \\mathrm{CH}_{3}\\right)$ does not give iodoform test.<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Oc8r8YZdeoyWNvdKtbLqESHLFp7seyRX2S-qE5LDoJA.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/bA-25gS16pHeNGXasz7usA58SfnhoFJalUqUqlNx1g0.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e570279619d9d8a13a7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "An ester $(A)$ with molecular formula $\\mathrm{C}_{9} \\mathrm{H}_{10} \\mathrm{O}_{2}$ was treated with excess of $\\mathrm{CH}_{3} \\mathrm{MgBr}$ and the complex so formed was treated with $\\mathrm{H}_{2} \\mathrm{SO}_{4}$ to give an olefin $(B)$. Ozonolysis of $(B)$ gave $a$ ketone with molecular formula $\\mathrm{C}_{8} \\mathrm{H}_{8} \\mathrm{O}$ which shows positive iodoform test. The structure of $(A)$ is", "image": null}, "options": [{"id": "ZdRYI", "text": "$\\mathrm{C}_{6} \\mathrm{H}_{5} \\mathrm{COOC}_{2} \\mathrm{H}_{5}$", "image": null, "isCorrect": true}, {"id": "8UYWQ", "text": "$\\mathrm{C}_{6} \\mathrm{H}_{5} \\mathrm{COOC}_{6} \\mathrm{H}_{5}$", "image": null, "isCorrect": false}, {"id": "J19m4", "text": "$\\mathrm{C}_{6} \\mathrm{H}_{5} \\mathrm{COOCH}_{3}$", "image": null, "isCorrect": false}, {"id": "sSarW", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/QMXv9NAUxRpJFoSyuv4ilxiLPnRzQwEDVb40hWLE1RQ.original.fullsize.png\">", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/tKyA8xchIDguTjAhTZH_eX3ne_Bfk8vhgQqyMKnpoiE.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 14, "topicId": "65a263310279619d9d8a3cd9", "title": "Properties of Phenol", "totalQuestions": 14, "questions": [{"_id": "68871bbcbf9280d7f9932bf9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following reagents is used in the conversion of phenol into picric acid?", "image": null}, "options": [{"id": "HEPDL", "text": "dil. $\\mathrm{HNO}_3$", "image": null, "isCorrect": false}, {"id": "xtF4v", "text": "dil. $\\mathrm{HNO}_2$", "image": null, "isCorrect": false}, {"id": "jFAuY", "text": "conc. $\\mathrm{HNO}_3+$ conc. $\\mathrm{H}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": true}, {"id": "NrUy6", "text": "conc. $\\mathrm{H}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Phenol reacts with a nitrating mixture containing concentrated nitric acid and concentrated sulfuric acid to form 2,4,6-trinitrophenol, commonly known as picric acid.<br><br>The reaction involves electrophilic aromatic substitution where the $-\\mathrm{OH}$ group strongly activates the benzene ring, directing the incoming nitro groups to the ortho and para positions.<br><br>Dilute $\\mathrm{HNO}_3$ yields a mixture of ortho and para nitrophenols, not picric acid.<br><br>Answer: conc. $\\mathrm{HNO}_3+$ conc. $\\mathrm{H}_2 \\mathrm{SO}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbbbf9280d7f9932bef", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following statements is NOT true for phenol?", "image": null}, "options": [{"id": "TmklY", "text": "Phenols are polar molecules.", "image": null, "isCorrect": false}, {"id": "WGpep", "text": "Pure phenol is odourless, nontoxic, high melting solid.", "image": null, "isCorrect": true}, {"id": "7a0hn", "text": "Boiling points of phenols increases with increase in molecular mass.", "image": null, "isCorrect": false}, {"id": "CqfX8", "text": "Phenols show appreciable solubility in water.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Phenol is a colourless, toxic, low melting solid having a characteristic carbolic odour.<br><br>Phenols are polar molecules due to the presence of the -OH group.<br><br>The boiling points of phenols increase with an increase in molecular mass due to the increase in van der Waals forces.<br><br>Phenols show appreciable solubility in water because they can form intermolecular hydrogen bonds with water molecules.<br><br>Therefore, the statement that pure phenol is odourless, nontoxic, and a high melting solid is incorrect.<br><br>Answer: Pure phenol is odourless, nontoxic, high melting solid.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9cbf9280d7f9932adc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is NOT phenol?", "image": null}, "options": [{"id": "8vDSN", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/nN7IVCbGUKtCiu94WtKOFL_8BjWyWv4tLp-g7cp0Uno.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "YLurA", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/MLd5TJ-lP4qV1Uvj7WaGbHNUONgtGOyGUWpAB_ESEzs.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "nEbu3", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/Wc72W8Z3rXXDeS9MV4jrHk8lnS-MXngevcCapuZVOpI.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "KUUSk", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/4RUss1MECMCla9ckH9ivdbv1w1Jjv7A-nt-MTAKWVdA.original.fullsize.png\"><br>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "A phenol is defined as a compound in which a hydroxyl group ($-OH$) is directly attached to an $sp^2$ hybridized carbon atom of an aromatic ring.<br><br>In the first option, the $-OH$ group is directly attached to the benzene ring, making it $o$-nitrophenol, which is a phenol.<br><br>In the second option, the $-OH$ group is directly attached to a naphthalene ring, making it $2$-naphthol, which is a phenolic compound.<br><br>In the third option, the $-OH$ group is directly attached to the benzene ring, making it $p$-bromophenol, which is a phenol.<br><br>In the fourth option, the $-OH$ group is attached to an $sp^3$ hybridized carbon atom of a side chain ($-CH_2-$ group) rather than directly to the aromatic ring. This compound is benzyl alcohol, which is an aromatic alcohol and not a phenol.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/4RUss1MECMCla9ckH9ivdbv1w1Jjv7A-nt-MTAKWVdA.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9abf9280d7f9932ac2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following compounds has lowest solubility in water?", "image": null}, "options": [{"id": "dDqIz", "text": "Phenol", "image": null, "isCorrect": false}, {"id": "jOWU0", "text": "p-Cresol", "image": null, "isCorrect": false}, {"id": "380PR", "text": "o-Nitrophenol", "image": null, "isCorrect": true}, {"id": "tTHFV", "text": "p-Nitrophenol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Solubility of phenols in water is primarily due to their ability to form intermolecular hydrogen bonds with water molecules.<br><br>In o-nitrophenol, the $-\\text{OH}$ and $-\\text{NO}_2$ groups are adjacent to each other, leading to strong intramolecular hydrogen bonding (chelation). This restricts the molecule from forming intermolecular hydrogen bonds with water.<br><br>In contrast, phenol, p-cresol, and p-nitrophenol do not exhibit intramolecular hydrogen bonding and can readily form intermolecular hydrogen bonds with water, making them more soluble.<br><br>Therefore, o-nitrophenol has the lowest solubility in water among the given compounds.<br><br>Answer: o-Nitrophenol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8bbf9280d7f9932a39", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the medicinal property of Eugenol?", "image": null}, "options": [{"id": "a2bPe", "text": "Antiseptic", "image": null, "isCorrect": false}, {"id": "761lB", "text": "Antioxidant", "image": null, "isCorrect": false}, {"id": "L4lpO", "text": "Analgesic and antimicrobial", "image": null, "isCorrect": true}, {"id": "teI7U", "text": "Antidiabetic", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Eugenol is the main active component of clove oil. It is widely used in dentistry and traditional medicine due to its strong analgesic (pain-relieving) properties, particularly for toothaches, as well as its antimicrobial properties which help in preventing infections.<br><br>Answer: Analgesic and antimicrobial", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7bbf9280d7f99329a1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The common name of Benzene-1,4-diol is", "image": null}, "options": [{"id": "Y6BcC", "text": "Catechol", "image": null, "isCorrect": false}, {"id": "To9ss", "text": "Resorcinol", "image": null, "isCorrect": false}, {"id": "0ZHSj", "text": "Quinol", "image": null, "isCorrect": true}, {"id": "uXhaY", "text": "Pyrogallol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Benzene-1,4-diol has two hydroxyl ($-OH$) groups attached to the benzene ring at para positions (1 and 4).<br><br>The common name for benzene-1,2-diol is catechol.<br><br>The common name for benzene-1,3-diol is resorcinol.<br><br>The common name for benzene-1,4-diol is hydroquinone or quinol.<br><br>The common name for benzene-1,2,3-triol is pyrogallol.<br><br>Answer: Quinol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b57bf9280d7f993285e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is IUPAC name of hydroquinone?", "image": null}, "options": [{"id": "uI4Kc", "text": "Benzene-1,2-diol", "image": null, "isCorrect": false}, {"id": "KmlDw", "text": "Benzene-1,3-diol", "image": null, "isCorrect": false}, {"id": "xf14m", "text": "Benzene-1,4-diol", "image": null, "isCorrect": true}, {"id": "1XQqA", "text": "Benzene-1,3,5-triol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Hydroquinone is a dihydric phenol in which two hydroxyl ($-OH$) groups are attached to the benzene ring at para positions with respect to each other.<br><br>The positions of the $-OH$ groups on the benzene ring are 1 and 4.<br><br>Therefore, the IUPAC name of hydroquinone is Benzene-1,4-diol.<br><br>Answer: Benzene-1,4-diol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b49bf9280d7f99327dc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following compounds does NOT contain phenolic -OH group?", "image": null}, "options": [{"id": "TYz5d", "text": "Curcumin", "image": null, "isCorrect": false}, {"id": "aB6kZ", "text": "Eugenol", "image": null, "isCorrect": false}, {"id": "tWOkd", "text": "Gallic acid", "image": null, "isCorrect": false}, {"id": "tX13M", "text": "Ascorbic acid", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Curcumin is a diarylheptanoid containing two phenol rings, specifically 4-hydroxy-3-methoxyphenyl groups, so it has phenolic -OH groups.<br><br>Eugenol is 4-allyl-2-methoxyphenol, which contains a benzene ring directly attached to a hydroxyl group, making it a phenol.<br><br>Gallic acid is 3,4,5-trihydroxybenzoic acid, which contains three phenolic -OH groups attached to the benzene ring.<br><br>Ascorbic acid (Vitamin C) is a cyclic ester (lactone) containing enolic and alcoholic -OH groups, but it does not contain a benzene ring. Therefore, it does not contain any phenolic -OH group.<br><br>Answer: Ascorbic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b28bf9280d7f99326c6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the structural formula of phloroglucinol.", "image": null}, "options": [{"id": "W9XnE", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/2GeLtPy6bfY3RROryHm3cNgog1NaCv4U4bVeZqVe2xo.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "D4qO2", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/IJWV0QpcGBJWPQ1qe5M6c8IBY90oLmiVUocRT8YIPD0.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "Js9eq", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/hyX0oBaJKjjk8OTCoRk1Tfar8wX2zW9X9MLVIOVBbNk.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "aE2Px", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/B5-NOIbktpAgKrgujQPZdHXcYrHsv6E3AG5pVWAcPjk.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Phloroglucinol is the common name for benzene-1,3,5-triol. Its structure consists of a benzene ring with three hydroxyl ($-OH$) groups attached at the 1, 3, and 5 positions.<br><br>Let us analyze the given options:<br>First structure: Benzene-1,3,5-triol (Phloroglucinol)<br>Second structure: Benzene-1,2,3-triol (Pyrogallol)<br>Third structure: Benzene-1,2,4-triol (Hydroxyquinol)<br>Fourth structure: Benzene-1,3-diol (Resorcinol)<br><br>Therefore, the first structure correctly represents phloroglucinol.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/2GeLtPy6bfY3RROryHm3cNgog1NaCv4U4bVeZqVe2xo.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b03bf9280d7f993259e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Select the correct IUPAC name of pyrogallol.", "image": null}, "options": [{"id": "dsfli", "text": "Benzene-1,3-diol", "image": null, "isCorrect": false}, {"id": "duRNl", "text": "Benzene-1,4-diol", "image": null, "isCorrect": false}, {"id": "OsNg0", "text": "Benzene-1,3,5-triol", "image": null, "isCorrect": false}, {"id": "zfich", "text": "Benzene-1,2,3-triol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Pyrogallol is a trihydric phenol in which three hydroxyl ($-OH$) groups are attached to adjacent carbon atoms of the benzene ring.<br><br>Its chemical structure consists of a benzene ring with $-OH$ groups at positions 1, 2, and 3.<br><br>Therefore, the IUPAC name of pyrogallol is Benzene-1,2,3-triol.<br><br>Answer: Benzene-1,2,3-triol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214350aee93fa0796ded1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Which among the following has the highest melting point?", "image": null}, "options": [{"id": "4tVL8", "text": "Phenol", "image": null, "isCorrect": false}, {"id": "n77OY", "text": "p-Nitrophenol", "image": null, "isCorrect": true}, {"id": "7pJU4", "text": "p-Cresol", "image": null, "isCorrect": false}, {"id": "wlR9S", "text": "o-Nitrophenol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "p-Nitrophenol has the highest melting point among the given compounds.<br><br>In p-nitrophenol, the -OH and -NO$_2$ groups are at the para position, which allows for strong intermolecular hydrogen bonding. This leads to the association of molecules and a highly symmetrical structure that packs efficiently in the crystal lattice, resulting in a high melting point (around $114^\\circ$C).<br><br>In contrast, o-nitrophenol forms intramolecular hydrogen bonds, which restricts intermolecular association, giving it a lower melting point (around $45^\\circ$C). Phenol and p-cresol also have lower melting points (around $41^\\circ$C and $35^\\circ$C respectively) due to less efficient packing and weaker intermolecular forces compared to p-nitrophenol.<br><br>Answer: p-Nitrophenol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213600aee93fa0796d851", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Identify the compound having highest solubility in water from the following?", "image": null}, "options": [{"id": "KVPsw", "text": "tert-Butyl alcohol", "image": null, "isCorrect": true}, {"id": "FJ3in", "text": "Phenol", "image": null, "isCorrect": false}, {"id": "X77Bh", "text": "o-Nitrophenol", "image": null, "isCorrect": false}, {"id": "KhvkD", "text": "p-Nitrophenol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Solubility of organic compounds in water depends on their ability to form hydrogen bonds with water molecules and the size of the hydrophobic hydrocarbon part.<br><br>tert-Butyl alcohol has a small hydrocarbon part (4 carbon atoms) and a highly polar $-OH$ group, which forms strong intermolecular hydrogen bonds with water. It is completely miscible with water in all proportions.<br><br>Phenol has a larger hydrophobic phenyl ring (6 carbon atoms), which decreases its solubility in water compared to lower aliphatic alcohols.<br><br>o-Nitrophenol exhibits intramolecular hydrogen bonding, which reduces its ability to form hydrogen bonds with water, making it sparingly soluble.<br><br>p-Nitrophenol can form intermolecular hydrogen bonds with water, making it more soluble than o-nitrophenol, but its large hydrophobic aromatic ring still limits its solubility compared to tert-butyl alcohol.<br><br>Therefore, tert-butyl alcohol has the highest solubility in water.<br><br>Answer: tert-Butyl alcohol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620d0279619d9d8a316b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "Which among the following phenols has highest melting point?", "image": null}, "options": [{"id": "fj4VO", "text": "o-Nitrophenol", "image": null, "isCorrect": false}, {"id": "fRws4", "text": "p-Nitrophenol", "image": null, "isCorrect": true}, {"id": "8KZc9", "text": "p-Cresol", "image": null, "isCorrect": false}, {"id": "QADqR", "text": "Phenol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/u2Y7ssj25dNIehWAjGupnRUIDI4Y99_ruFZh4TvT7s8.original.fullsize.png\"><br>\np-Nitrophenol has the highest meting point because of intermolecular hydrogen bonding.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9e0279619d9d8a15e7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The nature of $2,4,6$ -trinitrophenol is", "image": null}, "options": [{"id": "19oUc", "text": "neutral", "image": null, "isCorrect": false}, {"id": "YULu1", "text": "basic", "image": null, "isCorrect": false}, {"id": "4W2vT", "text": "acidic", "image": null, "isCorrect": true}, {"id": "IoQ4b", "text": "weak basic", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$2,4,6$ -trinitrophenol is picric acid. It is acidic in nature.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/fvUWPh8SaMRTvcK2xc6p2NoQGXH9-JbNRdYiFX0txDI.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
