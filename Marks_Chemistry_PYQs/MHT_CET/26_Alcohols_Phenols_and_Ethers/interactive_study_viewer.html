apers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "What is the intermediate product obtained in the preparation of phenol from aniline?", "image": null}, "options": [{"id": "2BKgM", "text": "Anilnium cation", "image": null, "isCorrect": false}, {"id": "i0oyp", "text": "Benzene diazonium chloride", "image": null, "isCorrect": true}, {"id": "4BE6W", "text": "Benzene", "image": null, "isCorrect": false}, {"id": "aXW1m", "text": "Sodium phenoxide", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/4C2wvXAlxXqAMKoJTx1Pt5ac-K9GnZpikyZXdpgddhE.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fdd0279619d9d8a1fd9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "Which catalyst is used in conversion of chlorobenzene to phenol by Rasching process?", "image": null}, "options": [{"id": "ZXqv4", "text": "Calcium phosphate", "image": null, "isCorrect": true}, {"id": "IEGqZ", "text": "Calcium carbonate", "image": null, "isCorrect": false}, {"id": "OXzli", "text": "Calcium sulphate", "image": null, "isCorrect": false}, {"id": "duTsG", "text": "Calcium chloride", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/NUUwYH_3UQuRo0TSD8hANOBDwjCpj-vvwCyCY8J1a78.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fa70279619d9d8a1e37", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "Which of the following is dihydric phenol?", "image": null}, "options": [{"id": "q7AGE", "text": "Resorcinol", "image": null, "isCorrect": true}, {"id": "tRyRq", "text": "m-Cresol", "image": null, "isCorrect": false}, {"id": "OZFdJ", "text": "Phloroglucinol", "image": null, "isCorrect": false}, {"id": "6QaF3", "text": "Pyrogallol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$p$ - Cresol $\\rightarrow$ Phenol, Catechol - Dihydric phenol Pyrogallol, Phloroglucinol - Trihydric phenol\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/PwpGNpuRpRF3DbQD80sjgaYBPT5BPM79v3oxbdVEgC8.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/BJ-k--MjpDOgWPgV5FuwgWuAFawLjxrSqgAKcr7IIBk.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/pVZxUJjE7WsHQog9HxoXrjw4JEXSJMGKcV-7kWUEOK8.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/r1kCPnkJTQFUr2p6XmaSAIvhYhgVIykTw35gqMcwJzo.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f5d0279619d9d8a1bde", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "Which of the following phenols is isolated from defensive secretion of grasshopper species?", "image": null}, "options": [{"id": "2TQOr", "text": "4 - Methylphenol", "image": null, "isCorrect": false}, {"id": "tSKxc", "text": "Benzene-1, 3- diol", "image": null, "isCorrect": false}, {"id": "ZkgiX", "text": "2, 5 - dichlorophenol", "image": null, "isCorrect": true}, {"id": "vZN9R", "text": "Phenol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The defensive froth emitted by the grasshopper Romalea microptera contains several odorous compounds (phenols, terpenes, benzoquinone), including a chlorinated aromatic compound, 2,5-dichlorophenol. This compound, which is repellent to ants and therefore defensively useful to the grasshopper, probably stems from herbicide or herbicide derivative ingested by the insect with its diet. Although there is precedent for the defensive employ by one species of chemical agents produced by another, no instance was known involving secondary utilization of a pesticide dispensed by man.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eb30279619d9d8a1694", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "Name the catalyst used in the commercial preparation of phenol.", "image": null}, "options": [{"id": "qb540", "text": "Silica", "image": null, "isCorrect": false}, {"id": "0TEIu", "text": "Calcium phosphate", "image": null, "isCorrect": false}, {"id": "kAWKH", "text": "Anhydrous aluminium chloride", "image": null, "isCorrect": false}, {"id": "YUF9s", "text": "Cobalt naphthenate", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Cobalt naphthenate is used as a&nbsp;catalyst in the commercial production of phenol.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "6abb88f815a9fc0fc8c14797", "title": "Isomerism of Organic Compounds", "totalQuestions": 1, "questions": [{"_id": "6abb885115a9fc0fc8c14289", "type": "singleCorrect", "question": {"text": "Which of the following functional groups is functional isomer of Ethers?", "image": null}, "options": [{"id": "MeJGu", "label": "A", "text": "Aldehydes", "isCorrect": false, "image": null}, {"id": "nMBFp", "label": "B", "text": "Carboxylic acids", "isCorrect": false, "image": null}, {"id": "4J9WV", "label": "C", "text": "Alcohols", "isCorrect": true, "image": null}, {"id": "I178P", "label": "D", "text": "Ketones", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Ethers and alcohols have the same general molecular formula $C_n H_{2n+2}O$ for saturated non-cyclic compounds.<br><br>They differ in the nature of the functional group. Ethers have an alkoxy group ($-O-$) while alcohols have a hydroxyl group ($-OH$).<br><br>Thus, ethers and alcohols are functional isomers.<br><br>Aldehydes and ketones have the general formula $C_n H_{2n}O$, while carboxylic acids have the general formula $C_n H_{2n}O_2$.<br><br>Answer: Alcohols", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a263310279619d9d8a3cda", "title": "Reactions of Phenol", "totalQuestions": 56, "questions": [{"_id": "6abb88b315a9fc0fc8c1462b", "type": "singleCorrect", "question": {"text": "Which of the following compounds is obtained when phenol is heated with Zn dust?", "image": null}, "options": [{"id": "seaoM", "label": "A", "text": "Benzene", "isCorrect": true, "image": null}, {"id": "THTJp", "label": "B", "text": "Cyclohexanol", "isCorrect": false, "image": null}, {"id": "oZPEm", "label": "C", "text": "Zinc phenoxide", "isCorrect": false, "image": null}, {"id": "kmwDH", "label": "D", "text": "Benzoic acid", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "When phenol is heated with zinc dust, it undergoes reduction to form benzene along with zinc oxide.<br><br>The chemical reaction is given by:<br><br>$C_6H_5OH + Zn \\xrightarrow{\\Delta} C_6H_6 + ZnO$<br><br>Therefore, the compound obtained is benzene.<br><br>Answer: Benzene", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b315a9fc0fc8c1462a", "type": "singleCorrect", "question": {"text": "Identify the reagent used for preparation of p-Benzoquinone from phenol.", "image": null}, "options": [{"id": "7GDVQ", "label": "A", "text": "Concentrated $\\text{H}_2\\text{SO}_4$", "isCorrect": false, "image": null}, {"id": "8FQjR", "label": "B", "text": "Dilute $\\text{H}_2\\text{SO}_4$", "isCorrect": false, "image": null}, {"id": "V5278", "label": "C", "text": "$\\text{Na}_2\\text{Cr}_2\\text{O}_7/\\text{H}_2\\text{SO}_4$", "isCorrect": true, "image": null}, {"id": "W6WVs", "label": "D", "text": "$\\text{Cu}/573\\ \\text{K}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Phenol undergoes oxidation with chromic acid, which is produced in situ from sodium dichromate ($\\text{Na}_2\\text{Cr}_2\\text{O}_7$) and sulfuric acid ($\\text{H}_2\\text{SO}_4$), to form a conjugated diketone known as p-benzoquinone.<br><br>The reaction is a standard method for the oxidation of phenols.<br><br>Therefore, the correct reagent is $\\text{Na}_2\\text{Cr}_2\\text{O}_7/\\text{H}_2\\text{SO}_4$.<br><br>Answer: $\\text{Na}_2\\text{Cr}_2\\text{O}_7/\\text{H}_2\\text{SO}_4$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888315a9fc0fc8c1446a", "type": "singleCorrect", "question": {"text": "Which of the following substances reacts with phenol to develop deep [purple/violet/green] coloration?", "image": null}, "options": [{"id": "6n6O2", "label": "A", "text": "Iodine", "isCorrect": false, "image": null}, {"id": "buIJ4", "label": "B", "text": "Bromine", "isCorrect": false, "image": null}, {"id": "no8Br", "label": "C", "text": "Neutral $\\text{FeCl}_3$ solution", "isCorrect": true, "image": null}, {"id": "jeGjk", "label": "D", "text": "Ammonium hydroxide", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Phenol reacts with neutral $\\text{FeCl}_3$ solution to form a colored (violet/purple/green/blue) water-soluble complex. This is a characteristic test for the presence of a phenolic $-\\text{OH}$ group.<br><br>The reaction is given by:<br><br>$6\\text{C}_6\\text{H}_5\\text{OH} + \\text{FeCl}_3 \\rightarrow [\\text{Fe}(\\text{OC}_6\\text{H}_5)_6]^{3-} + 3\\text{H}^+ + 3\\text{HCl}$<br><br>The complex formed is responsible for the deep coloration.<br><br>Answer: Neutral $\\text{FeCl}_3$ solution", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888315a9fc0fc8c14469", "type": "singleCorrect", "question": {"text": "Identify the reason for acidic nature of phenol.", "image": null}, "options": [{"id": "AIB67", "label": "A", "text": "Presence of hydrogen bonding.", "isCorrect": false, "image": null}, {"id": "4YUFA", "label": "B", "text": "Phenoxide ion is least stable.", "isCorrect": false, "image": null}, {"id": "gkcBU", "label": "C", "text": "Presence of strong and stable O-H bond.", "isCorrect": false, "image": null}, {"id": "z1xgJ", "label": "D", "text": "Due to resonance stabilization of its anion.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Phenol is acidic in nature because it can easily lose a proton to form a phenoxide ion. The phenoxide ion formed is highly stabilized by resonance, as the negative charge on the oxygen atom is delocalized over the benzene ring. This resonance stabilization of the conjugate base (phenoxide anion) is the primary reason for the acidic nature of phenol.<br><br>Answer: Due to resonance stabilization of its anion.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889415a9fc0fc8c14505", "type": "singleCorrect", "question": {"text": "<img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/may/watermarked_images/13_may_shift_2__q95_d1.png\" /><br>Identify the type of above reaction.", "image": null}, "options": [{"id": "8Qx1x", "label": "A", "text": "Nucleophilic aromatic substitution reaction.", "isCorrect": false, "image": null}, {"id": "KWpMI", "label": "B", "text": "Nucleophilic aromatic addition reaction", "isCorrect": false, "image": null}, {"id": "bRJhF", "label": "C", "text": "Electrophilic aromatic substitution reaction.", "isCorrect": true, "image": null}, {"id": "4gGyz", "label": "D", "text": "Electrophilic aromatic addition reaction.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction is an azo coupling reaction between benzenediazonium chloride and phenol to form $p$-hydroxyazobenzene.<br><br>In this reaction, the benzenediazonium cation ($C_6H_5N_2^+$) acts as a weak electrophile. It attacks the electron-rich aromatic ring of phenol (which is highly activated, especially in a slightly basic medium where it exists as a phenoxide ion).<br><br>The electrophile attacks the para position of the phenol ring, and a hydrogen atom is substituted by the azo group ($-N=N-Ar$). Since an electrophile substitutes a hydrogen atom on an aromatic ring, this is a classic example of an electrophilic aromatic substitution reaction.<br><br>Answer: Electrophilic aromatic substitution reaction.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c315a9fc0fc8c146c2", "type": "singleCorrect", "question": {"text": "Which of the following compounds is obtained when phenol reacts with concentrated nitric acid in the presence of conc. $\\text{H}_2\\text{SO}_4$ ?", "image": null}, "options": [{"id": "QJS2T", "label": "A", "text": "Benzoic acid", "isCorrect": false, "image": null}, {"id": "1MIAK", "label": "B", "text": "Salicylic acid", "isCorrect": false, "image": null}, {"id": "eP4Dv", "label": "C", "text": "o- and p-nitrophenol", "isCorrect": false, "image": null}, {"id": "OoSYb", "label": "D", "text": "Picric acid", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "When phenol is treated with concentrated nitric acid in the presence of concentrated sulphuric acid, nitration takes place at all the ortho and para positions.<br><br>This results in the formation of 2,4,6-trinitrophenol, which is commonly known as picric acid.<br><br>Note that if dilute nitric acid is used at low temperatures, a mixture of ortho-nitrophenol and para-nitrophenol is obtained.<br><br>Answer: Picric acid", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ab8c30a4553e1bdb8c", "type": "singleCorrect", "question": {"text": "In the following reaction, condition 'A' is -<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/19_april_shift_2__q88_d1.png\" />", "image": null}, "options": [{"id": "enpzT", "label": "A", "text": "Reduction with Zinc dust", "isCorrect": false, "image": null}, {"id": "Q6fsL", "label": "B", "text": "Dehydration with $\\text{H}_2\\text{SO}_4$ / 443 K", "isCorrect": false, "image": null}, {"id": "YV3DT", "label": "C", "text": "Treatment with $\\text{CS}_2$ / low temperture", "isCorrect": false, "image": null}, {"id": "MOsaH", "label": "D", "text": "Oxidation with $\\text{CrO}_3$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given reaction shows the conversion of phenol to $p$-benzoquinone.<br><br>This transformation is an oxidation reaction. Phenol is oxidized to $p$-benzoquinone by strong oxidizing agents such as chromic acid ($\\text{Na}_2\\text{Cr}_2\\text{O}_7$ with $\\text{H}_2\\text{SO}_4$ or $\\text{CrO}_3$).<br><br>In contrast, reduction with zinc dust converts phenol to benzene, and $\\text{CS}_2$ at low temperature is used as a solvent for monohalogenation of phenol.<br><br>Hence, condition 'A' is oxidation with $\\text{CrO}_3$.<br><br>Answer: Oxidation with $\\text{CrO}_3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32a8c30a4553e1be0da", "type": "singleCorrect", "question": {"text": "Identify the product P obtained in following reaction<br><img style=\"width: 330px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/17_april_shift_1__q96_d1.png\" />", "image": null}, "options": [{"id": "804BL", "label": "A", "text": "<img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/17_april_shift_1__q96_d2.png\" />", "isCorrect": false, "image": null}, {"id": "hIVHT", "label": "B", "text": "<img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/17_april_shift_1__q96_d3.png\" />", "isCorrect": false, "image": null}, {"id": "tNWo8", "label": "C", "text": "<img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/17_april_shift_1__q96_d4.png\" />", "isCorrect": false, "image": null}, {"id": "31c1i", "label": "D", "text": "<img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/17_april_shift_1__q96_d5.png\" />", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given reaction is the condensation of phenol with formaldehyde in the presence of an acid catalyst, which is the first step in the synthesis of Bakelite (Lederer-Manasse reaction).<br><br>In the presence of an acid, formaldehyde is protonated to generate the electrophile $^+CH_2OH$:<br>$HCHO + H^+ \\rightleftharpoons ^+CH_2OH$<br><br>The $-OH$ group of phenol is strongly activating and directs the incoming electrophile to the ortho and para positions.<br><br>The electrophile $^+CH_2OH$ attacks the ortho and para positions of the phenol ring, leading to the formation of ortho-hydroxybenzyl alcohol and para-hydroxybenzyl alcohol.<br><br>Among the given options, ortho-hydroxybenzyl alcohol is present, which corresponds to the correct product.<br><br>Answer: <img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/17_april_shift_1__q96_d5.png\" />", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c88c30a4553e1bdcbb", "type": "singleCorrect", "question": {"text": "Identify ' Z' in the following reaction.<br><img style=\"width: 300px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_1__q91_d1_v2.png\" />", "image": null}, "options": [{"id": "5fCzi", "label": "A", "text": "$\\text{Ar} - \\text{O} - \\text{R}$", "isCorrect": false, "image": null}, {"id": "iTahj", "label": "B", "text": "<img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_1__q91_d2.png\" />", "isCorrect": false, "image": null}, {"id": "vVRZa", "label": "C", "text": "<img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_1__q91_d3.png\" />", "isCorrect": true, "image": null}, {"id": "lzCAJ", "label": "D", "text": "<img style=\"width: 100px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_1__q91_d4.png\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction is an esterification reaction where a phenol ($\\text{Ar-OH}$) reacts with an acid chloride ($\\text{R-COCl}$) in the presence of a base like pyridine.<br><br>In this nucleophilic acyl substitution reaction, the oxygen atom of the phenol acts as a nucleophile and attacks the electrophilic carbonyl carbon of the acid chloride. <br><br>Pyridine is used as a base to neutralize the $\\text{HCl}$ formed during the reaction, which prevents the backward reaction and drives the equilibrium in the forward direction.<br><br>The reaction proceeds as follows:<br>$\\text{Ar-OH} + \\text{R-CO-Cl} \\xrightarrow{\\text{Pyridine}} \\text{R-CO-O-Ar} + \\text{HCl}$<br><br>The product 'Z' formed is an aryl ester, which has the structure $\\text{R-C(=O)-O-Ar}$.<br><br>Answer: <img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_1__q91_d3.png\" />", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e38c30a4553e1bdde6", "type": "singleCorrect", "question": {"text": "Identify the name of reaction when phenol reacts with chloroform in aqueous NaOH.", "image": null}, "options": [{"id": "4mWx9", "label": "A", "text": "Kolbe's reaction", "isCorrect": false, "image": null}, {"id": "f3Kwy", "label": "B", "text": "Reimer-Tiemann reaction", "isCorrect": true, "image": null}, {"id": "aISo2", "label": "C", "text": "Williamson synthesis", "isCorrect": false, "image": null}, {"id": "r9JLO", "label": "D", "text": "Friedel-Crafts acylation", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "When phenol is treated with chloroform ($CHCl_3$) in the presence of aqueous sodium hydroxide ($NaOH$), an aldehyde group ($-CHO$) is introduced at the ortho position of the benzene ring. This reaction results in the formation of salicylaldehyde (2-hydroxybenzaldehyde) as the major product.<br><br>This electrophilic substitution reaction, which proceeds via a dichlorocarbene ($:CCl_2$) intermediate, is known as the Reimer-Tiemann reaction.<br><br>Answer: Reimer-Tiemann reaction", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31b8c30a4553e1be03e", "type": "singleCorrect", "question": {"text": "In the following sequence of the reaction, the final product \"C\" is-<br><img style=\"width: 450px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/14_april_shift_1__q90_d1.png\" />", "image": null}, "options": [{"id": "bboPp", "label": "A", "text": "<img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/14_april_shift_1__q90_d2.png\" />", "isCorrect": false, "image": null}, {"id": "oU6Ar", "label": "B", "text": "<img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/14_april_shift_1__q90_d3.png\" />", "isCorrect": true, "image": null}, {"id": "7Rp7M", "label": "C", "text": "<img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/14_april_shift_1__q90_d4.png\" />", "isCorrect": false, "image": null}, {"id": "HVJcg", "label": "D", "text": "<img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/14_april_shift_1__q90_d5.png\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction sequence is a variant of the Reimer-Tiemann reaction.<br><br>Step 1: Phenol reacts with carbon tetrachloride ($CCl_4$) in the presence of aqueous $NaOH$. The phenoxide ion undergoes electrophilic aromatic substitution to form an intermediate with a $-CCl_3$ group at the ortho position. This intermediate is 2-(trichloromethyl)phenoxide (A).<br><br>Step 2: The intermediate A undergoes alkaline hydrolysis with $NaOH$. The three chlorine atoms are replaced by hydroxyl groups, forming an unstable intermediate that loses a water molecule to form a carboxylate group. This results in the formation of sodium salicylate (B).<br><br>Step 3: Acidification of sodium salicylate (B) with $H_3O^+$ protonates the carboxylate and phenoxide ions, yielding salicylic acid (2-hydroxybenzoic acid) as the final product C.<br><br>Therefore, the final product C is salicylic acid, which has a benzene ring with $-OH$ and $-COOH$ groups at ortho positions.<br><br>Answer: <img style=\"width: 150px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/14_april_shift_1__q90_d3.png\" />", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31b8c30a4553e1be03c", "type": "singleCorrect", "question": {"text": "What happens when phenol reacts with bromine water?", "image": null}, "options": [{"id": "3HhOu", "label": "A", "text": "Brown coloured liquid is obtained", "isCorrect": false, "image": null}, {"id": "skcsL", "label": "B", "text": "Colourless gas evolves", "isCorrect": false, "image": null}, {"id": "iP3Bu", "label": "C", "text": "White precipitate formed", "isCorrect": true, "image": null}, {"id": "Dols2", "label": "D", "text": "Pink colored solution is obtained", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Phenol reacts with bromine water to undergo electrophilic aromatic substitution at all ortho and para positions due to the strong activating effect of the $-OH$ group in aqueous medium.<br><br>The reaction yields $2,4,6$-tribromophenol, which appears as a white precipitate.<br><br>$C_6H_5OH + 3Br_2 (aq) \\rightarrow 2,4,6$-tribromophenol $\\downarrow + 3HBr$<br><br>Answer: White precipitate formed", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3628c30a4553e1be32c", "type": "singleCorrect", "question": {"text": "An organic compound with the molecular formula $\\text{C}_6\\text{H}_6\\text{O}$ dissolves in NaOH, gives a characteristic colour with neutral $\\text{FeCl}_3$ and on treatment with bromine water gives a tri bromo derivative. Which is that compound among the following?", "image": null}, "options": [{"id": "pQnQy", "label": "A", "text": "Alcohol", "isCorrect": false, "image": null}, {"id": "f1JOp", "label": "B", "text": "Ether", "isCorrect": false, "image": null}, {"id": "gRx1F", "label": "C", "text": "Ketone", "isCorrect": false, "image": null}, {"id": "LijdD", "label": "D", "text": "Phenol", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The molecular formula $\\text{C}_6\\text{H}_6\\text{O}$ corresponds to phenol ($\\text{C}_6\\text{H}_5\\text{OH}$).<br><br>Phenol is weakly acidic in nature and dissolves in aqueous $\\text{NaOH}$ to form sodium phenoxide.<br><br>It reacts with neutral $\\text{FeCl}_3$ to form a complex that gives a characteristic violet colour.<br><br>On treatment with bromine water, phenol undergoes electrophilic aromatic substitution at both ortho and para positions to yield a white precipitate of 2,4,6-tribromophenol.<br><br>Thus, the given compound is phenol.<br><br>Answer: Phenol", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bedbf9280d7f9932db2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product ' B ' in the following series of reactions.\n$\\text { Chlorobenzene } \\xrightarrow[\\text { ii) } \\mathrm{H}_3 \\mathrm{O}^{+}]{\\text { i) } \\mathrm{NaOH}, 623 \\mathrm{~K} / 150 \\mathrm{~atm}} \\mathrm{A} \\xrightarrow{\\mathrm{Br}_2 \\text { water }} \\mathrm{B}$", "image": null}, "options": [{"id": "j2zQ6", "text": "2,4,6-tribromophenol", "image": null, "isCorrect": true}, {"id": "dVgkZ", "text": "Phenol", "image": null, "isCorrect": false}, {"id": "k5N5J", "text": "o-Bromophenol", "image": null, "isCorrect": false}, {"id": "HQLdY", "text": "p-Bromophenol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Chlorobenzene reacts with aqueous $\\mathrm{NaOH}$ at $623 \\text{ K}$ and $150 \\text{ atm}$ pressure to form sodium phenoxide, which on acidification yields phenol. This is known as Dow's process. Thus, product A is phenol.<br><br>Phenol reacts with bromine water to undergo electrophilic aromatic substitution at all ortho and para positions, yielding a white precipitate of 2,4,6-tribromophenol. Thus, product B is 2,4,6-tribromophenol.<br><br>Answer: 2,4,6-tribromophenol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdcbf9280d7f9932d14", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the natural source of salicylic acid?", "image": null}, "options": [{"id": "KQYkB", "text": "Cinnamon", "image": null, "isCorrect": false}, {"id": "iYmFG", "text": "Willow plant", "image": null, "isCorrect": true}, {"id": "V8fHo", "text": "Turmeric plant", "image": null, "isCorrect": false}, {"id": "n1ZpT", "text": "Indian gooseberry", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Salicylic acid is naturally obtained from the bark of the willow tree (willow plant).<br><br>Cinnamon is a source of cinnamaldehyde.<br><br>Turmeric plant is a source of curcumin.<br><br>Indian gooseberry is a rich source of ascorbic acid (Vitamin C).<br><br>Answer: Willow plant", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcfbf9280d7f9932ca2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following compounds is obtained when phenol reacts with dilute nitric acid at low temperature?", "image": null}, "options": [{"id": "5A8da", "text": "o-Nitrophenol only", "image": null, "isCorrect": false}, {"id": "Hq4nu", "text": "p-Nitrophenol only", "image": null, "isCorrect": false}, {"id": "9vbIL", "text": "2,4,6-trinitrophenol", "image": null, "isCorrect": false}, {"id": "293Yf", "text": "Mixture of ortho and para nitrophenols", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Phenol reacts with dilute nitric acid ($\\text{HNO}_3$) at low temperature ($298\\text{ K}$) to undergo electrophilic aromatic substitution.<br><br>Since the $-\\text{OH}$ group is an activating and ortho/para-directing group, mononitration takes place at the ortho and para positions.<br><br>This results in the formation of a mixture of o-nitrophenol and p-nitrophenol.<br><br>Reaction:<br>$\\text{C}_6\\text{H}_5\\text{OH} + \\text{dil. HNO}_3 \\xrightarrow{298\\text{ K}} \\text{o-nitrophenol} + \\text{p-nitrophenol}$<br><br>Answer: Mixture of ortho and para nitrophenols", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba9bf9280d7f9932b5e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product ' B ' in the following reaction.\nSodium phenoxide $\\xrightarrow[6 \\mathrm{~atm}]{\\mathrm{CO}_2 ;~ 398 \\mathrm{~K}} \\mathrm{~A} \\xrightarrow{\\mathrm{H}_3 \\mathrm{O}^{+}} \\mathrm{B}$", "image": null}, "options": [{"id": "zpSsr", "text": "Picric acid", "image": null, "isCorrect": false}, {"id": "Ajd2B", "text": "Sulphonic acid", "image": null, "isCorrect": false}, {"id": "WgZVK", "text": "Salicylic acid", "image": null, "isCorrect": true}, {"id": "cOrNu", "text": "Salicylaldehyde", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is Kolbe's reaction.<br><br>When sodium phenoxide is treated with carbon dioxide at $398 \\text{ K}$ under a pressure of $6 \\text{ atm}$, it undergoes electrophilic substitution to form sodium salicylate as the major product (A).<br><br>Acidification of sodium salicylate with $\\text{H}_3\\text{O}^{+}$ yields salicylic acid (2-hydroxybenzoic acid) as product B.<br><br>Therefore, product B is salicylic acid.<br><br>Answer: Salicylic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9cbf9280d7f9932add", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify ' $A$ ' in the following reaction.\n$\\text { A + Acetic anhydride } \\xrightarrow{\\mathrm{H}^{+}} \\text {Aspirin + Acetic acid }$", "image": null}, "options": [{"id": "zuVcW", "text": "Acrylic acid", "image": null, "isCorrect": false}, {"id": "GVVsC", "text": "Oxalic acid", "image": null, "isCorrect": false}, {"id": "1lyuE", "text": "Salicylic acid", "image": null, "isCorrect": true}, {"id": "hheSb", "text": "Phthalic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Aspirin is chemically known as acetylsalicylic acid.<br><br>It is prepared by the acetylation of salicylic acid. When salicylic acid is treated with acetic anhydride in the presence of a small amount of acid catalyst (like concentrated $\\mathrm{H}_{2}\\mathrm{SO}_{4}$), the hydroxyl group of salicylic acid gets acetylated to form acetylsalicylic acid (aspirin) and acetic acid as a byproduct.<br><br>Therefore, the reactant 'A' is salicylic acid.<br><br>Answer: Salicylic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8cbf9280d7f9932a40", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the final product obtained when a mixture of vapours of phenol and hydrogen is passed over nickel catalyst at 433 K .", "image": null}, "options": [{"id": "Mt1Nq", "text": "Cyclohexanol", "image": null, "isCorrect": true}, {"id": "O6Hhs", "text": "Cyclohex-2-en-1-ol", "image": null, "isCorrect": false}, {"id": "OgGaO", "text": "Cyclohexane", "image": null, "isCorrect": false}, {"id": "udXdz", "text": "Benzene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When a mixture of vapours of phenol and hydrogen is passed over a nickel catalyst at $433$ K, catalytic hydrogenation of the aromatic ring takes place.<br><br>The three double bonds of the benzene ring are reduced by the addition of three molecules of hydrogen, while the hydroxyl group remains intact.<br><br>The reaction is given by:<br>$C_6H_5OH + 3H_2 \\xrightarrow{Ni,\\ 433\\ K} C_6H_{11}OH$<br><br>Thus, the final product obtained is cyclohexanol.<br><br>Answer: Cyclohexanol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6cbf9280d7f9932912", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Phenol on reaction with aqueous solution of bromine gives", "image": null}, "options": [{"id": "5Hkch", "text": "o-Bromophenol", "image": null, "isCorrect": false}, {"id": "YtbCZ", "text": "m-Bromophenol", "image": null, "isCorrect": false}, {"id": "W7Jqi", "text": "p-Bromophenol", "image": null, "isCorrect": false}, {"id": "ssePG", "text": "2,4,6-tribromophenol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Phenol reacts with an aqueous solution of bromine (bromine water) to undergo electrophilic aromatic substitution.<br><br>In an aqueous medium, phenol ionizes to form the phenoxide ion, which is highly activating towards electrophilic substitution due to the strong +R effect of the $-O^{-}$ group.<br><br>As a result, polyhalogenation occurs, and bromine atoms are substituted at all the ortho and para positions.<br><br>This reaction yields a white precipitate of 2,4,6-tribromophenol.<br><br>Answer: 2,4,6-tribromophenol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5abf9280d7f993287d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify ' Z ' in the following reaction.\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/w6_TJMVOdOA5n23jUtMRSI4p2j5u7dRW8MS0NHgqYso.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "8D9Pe", "text": "Ar-O-R", "image": null, "isCorrect": false}, {"id": "AUqJi", "text": "\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/LjiSjPSLcDl_KoY1qVrPX_aNa_7TItUafdGgqEMR4Xk.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "zoYtn", "text": "\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/uon4ZczPv-XsmXyvw-XEn0huNbCrvsmFo-kv4x8yVeY.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "JWuBY", "text": "\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/ewVWWnLpNwPcYVzaq4GKBQQJ2Tah8G-0YNa2V6la2Ts.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is an esterification reaction between a phenol ($\\text{Ar-OH}$) and an acyl chloride ($\\text{R-COCl}$) in the presence of a base like pyridine.<br><br>The oxygen atom of the phenol acts as a nucleophile and attacks the electrophilic carbonyl carbon of the acyl chloride. The chloride ion acts as a leaving group, resulting in a nucleophilic acyl substitution.<br><br>$\\text{Ar-OH} + \\text{R-COCl} \\xrightarrow{\\text{Pyridine}} \\text{R-COO-Ar} + \\text{HCl}$<br><br>The product 'Z' formed is an aryl ester, which has the structure $\\text{R-C(=O)-OAr}$.<br><br>Answer: \n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/uon4ZczPv-XsmXyvw-XEn0huNbCrvsmFo-kv4x8yVeY.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4cbf9280d7f99327f9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify substrate ' $A$ ' in the following reaction.\n$\\mathrm{A}+\\mathrm{CO}_2 \\xrightarrow[6 \\mathrm{~atm}]{398 \\mathrm{~K}}$ Sodium salicylate $\\xrightarrow{\\mathrm{H}_3 \\mathrm{O}^{+}}$Salicylic acid", "image": null}, "options": [{"id": "Qgdm2", "text": "Phenol", "image": null, "isCorrect": false}, {"id": "Ku2fh", "text": "Sodium phenoxide", "image": null, "isCorrect": true}, {"id": "5DDBK", "text": "Salicyldehyde", "image": null, "isCorrect": false}, {"id": "8DU0i", "text": "o-Phenolsulphonic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is Kolbe's reaction.<br><br>Sodium phenoxide reacts with carbon dioxide at $398 \\mathrm{~K}$ and $6 \\mathrm{~atm}$ pressure to undergo electrophilic substitution, forming sodium salicylate. This intermediate upon acid hydrolysis yields salicylic acid.<br><br>Thus, substrate 'A' is sodium phenoxide.<br><br>Answer: Sodium phenoxide", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3bbf9280d7f9932751", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the major product obtained when anisole reacts with bromine in acetic acid.", "image": null}, "options": [{"id": "Z1eV1", "text": "o-bromoanisole", "image": null, "isCorrect": false}, {"id": "tEy7H", "text": "m-bromoanisole", "image": null, "isCorrect": false}, {"id": "uavIw", "text": "p-bromoanisole", "image": null, "isCorrect": true}, {"id": "skUeB", "text": "2,4,6-tribromoanisole", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Anisole undergoes electrophilic aromatic substitution when treated with bromine in acetic acid.<br><br>The methoxy group ($-OCH_3$) is an activating group and directs the incoming electrophile to the ortho and para positions.<br><br>Bromination of anisole yields a mixture of ortho-bromoanisole and para-bromoanisole.<br><br>Due to steric hindrance at the ortho position, para-bromoanisole is formed as the major product (about $90\\%$).<br><br>Answer: p-bromoanisole", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b16bf9280d7f993262e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product ' B ' in the following series of reactions.\n$\\text { Chlorobenzene } \\frac{\\text { i) } \\mathrm{NaOH}, 623 \\mathrm{~K} / 150 \\mathrm{~atm}}{\\text { ii) } \\mathrm{H}_3 \\mathrm{O}^{+}} \\mathrm{A} \\xrightarrow{\\mathrm{Br}_2 \\text { water }} \\mathrm{B}$", "image": null}, "options": [{"id": "pxAEI", "text": "Phenol", "image": null, "isCorrect": false}, {"id": "fUhIq", "text": "o-Bromophenol", "image": null, "isCorrect": false}, {"id": "dAePl", "text": "p-Bromophenol", "image": null, "isCorrect": false}, {"id": "nlPkb", "text": "2,4,6-tribromophenol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Chlorobenzene reacts with aqueous $\\text{NaOH}$ at $623 \\text{ K}$ and $150 \\text{ atm}$ pressure to form sodium phenoxide, which on acidification with $\\text{H}_3\\text{O}^{+}$ gives phenol. This is known as Dow's process.<br><br>Thus, product A is phenol.<br><br>Phenol reacts with bromine water to undergo electrophilic aromatic substitution at all ortho and para positions, yielding a white precipitate of 2,4,6-tribromophenol.<br><br>Thus, product B is 2,4,6-tribromophenol.<br><br>Answer: 2,4,6-tribromophenol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214470aee93fa0796df65", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Which reagent is used in the conversion of phenol to picric acid?", "image": null}, "options": [{"id": "wwxUC", "text": "Nitric acid (dil.)", "image": null, "isCorrect": false}, {"id": "xWndM", "text": "Nitrous acid (conc.)", "image": null, "isCorrect": false}, {"id": "AT9E2", "text": "Sulphuric acid (conc.)", "image": null, "isCorrect": false}, {"id": "48I12", "text": "Nitric acid (conc.) + Sulphuric acid (conc.)", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Phenol reacts with a mixture of concentrated nitric acid and concentrated sulphuric acid (nitrating mixture) to form $2,4,6$-trinitrophenol, which is commonly known as picric acid.<br><br>The reaction proceeds by first forming phenol disulphonic acid with concentrated sulphuric acid, which then reacts with concentrated nitric acid to yield picric acid.<br><br>Answer: Nitric acid (conc.) + Sulphuric acid (conc.)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214220aee93fa0796de3d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Phenol on heating with zinc dust forms", "image": null}, "options": [{"id": "1am30", "text": "Benzoquinone", "image": null, "isCorrect": false}, {"id": "JXMAi", "text": "Cyclohexane", "image": null, "isCorrect": false}, {"id": "OJf0I", "text": "Benzene", "image": null, "isCorrect": true}, {"id": "TAhbx", "text": "Cyclohexanol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Phenol on heating with zinc dust undergoes reduction to form benzene. The zinc dust acts as a reducing agent and removes the oxygen atom from the phenol molecule as zinc oxide.<br><br>The chemical reaction is given by:<br><br>$C_6H_5OH + Zn \\xrightarrow{\\Delta} C_6H_6 + ZnO$<br><br>Thus, the main product formed is benzene.<br><br>Answer: Benzene", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fd0aee93fa0796dd1b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Which from following reagents is used in the conversion of phenol to picric acid?", "image": null}, "options": [{"id": "oJo4i", "text": "dil. Nitric acid", "image": null, "isCorrect": false}, {"id": "TXI3g", "text": "conc. Nitrous acid", "image": null, "isCorrect": false}, {"id": "lGAq4", "text": "conc. Sulphuric acid", "image": null, "isCorrect": false}, {"id": "y9Zgf", "text": "conc. $\\mathrm{HNO}_3+$ conc. $\\mathrm{H}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Phenol undergoes electrophilic aromatic substitution when treated with a nitrating mixture, which is a mixture of concentrated nitric acid and concentrated sulphuric acid.<br><br>The strong nitrating mixture introduces nitro groups at both the ortho positions and the para position of the phenol ring, resulting in the formation of 2,4,6-trinitrophenol, commonly known as picric acid.<br><br>In contrast, reaction with dilute nitric acid yields only a mixture of ortho-nitrophenol and para-nitrophenol.<br><br>Therefore, the reagent used for the conversion of phenol to picric acid is conc. $\\mathrm{HNO}_3$ + conc. $\\mathrm{H}_2 \\mathrm{SO}_4$.<br><br>Answer: conc. $\\mathrm{HNO}_3+$ conc. $\\mathrm{H}_2 \\mathrm{SO}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213eb0aee93fa0796dc8e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Which reagent from following is used in Reimer-Tiemann reaction?", "image": null}, "options": [{"id": "7bJFr", "text": "$\\mathrm{CO}_2, 6 \\mathrm{~atm} \\mathrm{H}_3 \\mathrm{O}^{+}$", "image": null, "isCorrect": false}, {"id": "47K0S", "text": "$\\mathrm{CHCl}_3$, aq. $\\mathrm{NaOH}, \\mathrm{H}_3 \\mathrm{O}^{+}$", "image": null, "isCorrect": true}, {"id": "jM3jx", "text": "$\\mathrm{CS}_2$ (at low temperature)", "image": null, "isCorrect": false}, {"id": "bpYLX", "text": "$\\mathrm{Na}_2 \\mathrm{Cr}_2 \\mathrm{O}_7 / \\mathrm{H}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The Reimer-Tiemann reaction involves the treatment of phenol with chloroform ($\\mathrm{CHCl}_3$) in the presence of aqueous sodium hydroxide ($\\mathrm{NaOH}$), followed by acid hydrolysis ($\\mathrm{H}_3 \\mathrm{O}^{+}$) to yield salicylaldehyde.<br><br>$\\mathrm{CO}_2$ under pressure followed by acid hydrolysis is used in Kolbe's reaction to prepare salicylic acid.<br><br>$\\mathrm{Na}_2 \\mathrm{Cr}_2 \\mathrm{O}_7 / \\mathrm{H}_2 \\mathrm{SO}_4$ is an oxidizing agent used to convert phenol to benzoquinone.<br><br>Answer: $\\mathrm{CHCl}_3$, aq. $\\mathrm{NaOH}, \\mathrm{H}_3 \\mathrm{O}^{+}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ea0aee93fa0796dc83", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Identify product obtained in following reaction.\r\n$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{OH} \\xrightarrow{\\mathrm{CrO}_3} \\text { Product }$", "image": null}, "options": [{"id": "evGR4", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/hnyulRl2kt2bhNQ8BJqP-6_1Bum1D83BXZB-_SrZEfo.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "kiiLG", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/BjLrL4eIFjxFKKlMZYRvKn1zvVUz7t4v5bnCXDAuPko.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "Woegw", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/Jo0k7Uuu85ncWydp5qGbS4EsMCwnOcFpbvvXkDU7fA0.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "iqape", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/1o4MHYtSli_9y7au9vusSToc42ksuj5ESYDXOmw_VjY.original.fullsize.png\"/><br/>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Phenol undergoes oxidation in the presence of chromic anhydride ($\\mathrm{CrO}_3$) or chromic acid ($\\mathrm{Na}_2\\mathrm{Cr}_2\\mathrm{O}_7 / \\mathrm{H}_2\\mathrm{SO}_4$) to form a conjugated diketone known as $p$-benzoquinone.<br><br>$\\mathrm{C}_6\\mathrm{H}_5\\mathrm{OH} \\xrightarrow{\\mathrm{CrO}_3} p\\text{-benzoquinone}$<br><br>The structure of $p$-benzoquinone consists of a six-membered ring with two double bonds and two carbonyl groups at para positions.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/1o4MHYtSli_9y7au9vusSToc42ksuj5ESYDXOmw_VjY.original.fullsize.png\"/><br/>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213730aee93fa0796d8dd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Identify the product of following reaction.\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/CX8eDtAXYcMvW1u1_TNhUij-YTIstQtZZnk8b0s1SWI.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "nAMxV", "text": "Benzene", "image": null, "isCorrect": false}, {"id": "XgrRP", "text": "Benzoic acid", "image": null, "isCorrect": false}, {"id": "3F8It", "text": "Benzaldehyde", "image": null, "isCorrect": false}, {"id": "i0zM0", "text": "p-Benzoquinone", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given reactant is phenol and the reagent is $\\text{CrO}_3$, which is a strong oxidizing agent.<br><br>Oxidation of phenol with chromic acid or $\\text{CrO}_3$ produces a conjugated diketone known as p-benzoquinone.<br><br>Reaction:<br>$\\text{C}_6\\text{H}_5\\text{OH} \\xrightarrow{\\text{CrO}_3} \\text{p-Benzoquinone}$<br><br>Answer: p-Benzoquinone", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135f0aee93fa0796d847", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "is
