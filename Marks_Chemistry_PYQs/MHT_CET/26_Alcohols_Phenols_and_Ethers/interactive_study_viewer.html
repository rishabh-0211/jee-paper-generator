tion": {"text": "(+) 2-Methylbutan-1-ol&nbsp;and (-) 2- Methylbutan-1-ol are enantiomers of each other.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8f0279619d9d8a156d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "3 -methylpentan-3-ol will be prepared from", "image": null}, "options": [{"id": "C8EfN", "text": "ethyl formate and methyl magnesium bromide", "image": null, "isCorrect": false}, {"id": "k9jQN", "text": "ethyl ethanoate and ethyl magnesium bromide", "image": null, "isCorrect": true}, {"id": "jx5sO", "text": "ethyl propanoate and methyl magnesium bromide", "image": null, "isCorrect": false}, {"id": "Iix4J", "text": "ethyl formate and ethyl magnesium bromide", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/w1NYWm4wC7PCp512U4YF-wUl-26AdZuSlsy9sHwFTLQ.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/ad3a3PooywdTfyT7H3G0_8d1R_RT4dPy9iBvbnhUNAM.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/2qVYQ8DNVMPOcgEkQ-0BnfJ76RrounELMAXabFXirq8.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/MAbTSaV2sCo6YGjWy0ZUKlj_Y67tYOaUNDbUam0Iev4.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8d0279619d9d8a155e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "$\\mathrm{CH} \\equiv \\mathrm{CH} \\frac{\\mathrm{HCl}}{\\text { Excess }} A \\frac{\\text { Hydrolysis }}{\\Delta} B \\frac{\\text { Reduction }}{\\mathrm{Na}-\\mathrm{Hg} / \\mathrm{H}_{2} \\mathrm{O}} C$\nCompound $C$ is", "image": null}, "options": [{"id": "iZlTR", "text": "ethanal", "image": null, "isCorrect": false}, {"id": "DCQWx", "text": "propenal", "image": null, "isCorrect": false}, {"id": "MxMhy", "text": "ethanol", "image": null, "isCorrect": true}, {"id": "GBbqW", "text": "2-methyl butan-1-ol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/1S1hayVZngAXjRTUGhIcypX-7fdoWp9IpYJM7wtFi0k.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Pm1RjfnWvJLlmDQU2BikthmCQ6NBKBJTdVRA483W__A.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/3kf4zD90kKE1qVP2ucnF3F5cdxL2Sf9beJRfOvWsfYc.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e560279619d9d8a139e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The correct order of boiling point for primary $\\left(1^{\\circ}\\right)$, secondary $\\left(2^{\\circ}\\right)$ and tertiary $\\left(3^{\\circ}\\right)$ alcohols is", "image": null}, "options": [{"id": "jiu77", "text": "$1^{\\circ}>2^{\\circ}>3^{\\circ}$", "image": null, "isCorrect": true}, {"id": "gUSgR", "text": "$3^{\\circ}>2^{\\circ}>1^{\\circ}$", "image": null, "isCorrect": false}, {"id": "rGFnk", "text": "$2^{\\circ}>1^{\\circ}>3^{\\circ}$", "image": null, "isCorrect": false}, {"id": "buCTK", "text": "$2^{\\circ}>3^{\\circ}>1^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Alcohols with same molecular weight are expected to have almost same boiling point however two more factors other than molecular weight are important, they are namely H-bonding and surface area of molecule. Both these factors are least in $3^{\\circ}$ alcohols and maximum in $1^{\\circ}$ alcohols. Hence, $3^{\\circ}$ alcohols have least boiling point while $1^{\\circ}$ alcohols have maximum boiling point.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e430279619d9d8a1305", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "2,2 -dichloro propane on hydrolysis yields", "image": null}, "options": [{"id": "4AFHD", "text": "acetone", "image": null, "isCorrect": true}, {"id": "R3hBI", "text": "2,2 -propane diol", "image": null, "isCorrect": false}, {"id": "JNl6N", "text": "isopropyl alcohol", "image": null, "isCorrect": false}, {"id": "t8XsX", "text": "acetaldehyde", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/c7MQgJaPQwYgPf3VZB05KCUSIRJJRxk3CsU3EwnwbwA.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263300279619d9d8a3cd6", "title": "Reactions of Alcohols", "totalQuestions": 46, "questions": [{"_id": "6abb88d415a9fc0fc8c14757", "type": "singleCorrect", "question": {"text": "What is the product formed when a primary alcohol undergoes catalytic dehydrogenation by passing its vapor over heated copper at $573$ K ?", "image": null}, "options": [{"id": "lMNSd", "label": "A", "text": "Ketone", "isCorrect": false, "image": null}, {"id": "H6bss", "label": "B", "text": "Aldehyde", "isCorrect": true, "image": null}, {"id": "iU4wy", "label": "C", "text": "Alkene", "isCorrect": false, "image": null}, {"id": "ETxYd", "label": "D", "text": "Ether", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "When the vapors of a primary alcohol are passed over heated copper at $573$ K, it undergoes catalytic dehydrogenation to form an aldehyde.<br><br>$R-CH_2-OH \\xrightarrow{Cu, 573 \\text{ K}} R-CHO + H_2$<br><br>Secondary alcohols yield ketones, while tertiary alcohols undergo dehydration to form alkenes under the same conditions.<br><br>Answer: Aldehyde", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88d415a9fc0fc8c14755", "type": "singleCorrect", "question": {"text": "Identify the product of the following reaction.<br>$\\text{CH}_3\\text{CH}_2\\text{CH}_2\\text{OH} + \\text{SOCl}_2 \\rightarrow \\text{P}$", "image": null}, "options": [{"id": "ZoRkY", "label": "A", "text": "$\\text{CH}_3\\text{CH}_2\\text{CH}_2\\text{Cl} + \\text{SO}_2 + \\text{HCl}$", "isCorrect": true, "image": null}, {"id": "2ecNn", "label": "B", "text": "$\\text{CH}_3\\text{CH}_2\\text{CH}_2\\text{Br}$", "isCorrect": false, "image": null}, {"id": "Wc5N8", "label": "C", "text": "$\\text{CH}_3\\text{CH}_2\\text{OH}$", "isCorrect": false, "image": null}, {"id": "29Qk5", "label": "D", "text": "$\\text{CH}_3\\text{CH}_2\\text{CH}_2\\text{OCl}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reaction of an alcohol with thionyl chloride ($\\text{SOCl}_2$) yields an alkyl chloride, sulfur dioxide, and hydrogen chloride gas.<br><br>$\\text{CH}_3\\text{CH}_2\\text{CH}_2\\text{OH} + \\text{SOCl}_2 \\rightarrow \\text{CH}_3\\text{CH}_2\\text{CH}_2\\text{Cl} + \\text{SO}_2 \\uparrow + \\text{HCl} \\uparrow$<br><br>This is a preferred method for the preparation of alkyl chlorides because the byproducts $\\text{SO}_2$ and $\\text{HCl}$ are gases that escape from the reaction mixture, leaving behind pure alkyl chloride.<br><br>Answer: $\\text{CH}_3\\text{CH}_2\\text{CH}_2\\text{Cl} + \\text{SO}_2 + \\text{HCl}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885015a9fc0fc8c14288", "type": "singleCorrect", "question": {"text": "Which of the following most readily gives $2$-Methylbut-$2$-ene on heating with concentrated sulphuric acid ?", "image": null}, "options": [{"id": "U5bMI", "label": "A", "text": "$2$-Bromo-$2$-methylbutane", "isCorrect": false, "image": null}, {"id": "toifH", "label": "B", "text": "$2$-Bromo-$3$-methylbutane", "isCorrect": false, "image": null}, {"id": "GP7El", "label": "C", "text": "$2$-Methylbutan-$1$-ol", "isCorrect": false, "image": null}, {"id": "KeJZd", "label": "D", "text": "$2$-Methylbutan-$2$-ol", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Heating with concentrated sulphuric acid causes the dehydration of alcohols to form alkenes.<br><br>Alkyl halides, such as 2-bromo-2-methylbutane and 2-bromo-3-methylbutane, typically undergo elimination using an alcoholic base rather than concentrated sulphuric acid.<br><br>The rate of dehydration of alcohols depends on the stability of the intermediate carbocation. The order of ease of dehydration is $3^{\\circ} > 2^{\\circ} > 1^{\\circ}$.<br><br>2-Methylbutan-1-ol is a primary alcohol, while 2-Methylbutan-2-ol is a tertiary alcohol.<br><br>Therefore, 2-Methylbutan-2-ol undergoes dehydration most readily. It forms a stable tertiary carbocation, and subsequent removal of a proton according to Saytzeff's rule yields the more substituted alkene, 2-methylbut-2-ene.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b315a9fc0fc8c14629", "type": "singleCorrect", "question": {"text": "Identify the type of compounds obtained when methanol is reacted with R-Mg-X.", "image": null}, "options": [{"id": "QkPcy", "label": "A", "text": "Alkane", "isCorrect": true, "image": null}, {"id": "Xo7eV", "label": "B", "text": "Alkene", "isCorrect": false, "image": null}, {"id": "jdqtD", "label": "C", "text": "Ether", "isCorrect": false, "image": null}, {"id": "CBBjf", "label": "D", "text": "Ester", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Methanol ($CH_3OH$) contains an acidic hydrogen atom attached to the highly electronegative oxygen atom.<br><br>Grignard reagents ($R-Mg-X$) act as strong bases. When a Grignard reagent reacts with a compound containing an active or acidic hydrogen, an acid-base reaction takes place.<br><br>The alkyl group ($R^-$) from the Grignard reagent abstracts the acidic proton ($H^+$) from methanol to form an alkane ($R-H$).<br><br>The chemical reaction is given by:<br>$CH_3OH + R-Mg-X \\rightarrow R-H + CH_3OMgX$<br><br>Thus, the compound obtained is an alkane.<br><br>Answer: Alkane", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889315a9fc0fc8c14501", "type": "singleCorrect", "question": {"text": "What is the final product of the oxidation reaction of a primary alcohol by acidified $\\text{K}_2\\text{Cr}_2\\text{O}_7$?", "image": null}, "options": [{"id": "n6h3D", "label": "A", "text": "Aldehyde", "isCorrect": false, "image": null}, {"id": "TtCQW", "label": "B", "text": "ketone", "isCorrect": false, "image": null}, {"id": "PctKV", "label": "C", "text": "carboxylic acid", "isCorrect": true, "image": null}, {"id": "f74cq", "label": "D", "text": "alkene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Acidified $\\text{K}_2\\text{Cr}_2\\text{O}_7$ is a strong oxidizing agent.<br><br>When a primary alcohol is treated with acidified $\\text{K}_2\\text{Cr}_2\\text{O}_7$, it undergoes oxidation to first form an aldehyde.<br><br>Since the oxidizing agent is strong and present in the acidic medium, the aldehyde is further oxidized to a carboxylic acid.<br><br>$\\text{R-CH}_2\\text{OH} \\xrightarrow{\\text{K}_2\\text{Cr}_2\\text{O}_7 / \\text{H}^+} \\text{R-CHO} \\xrightarrow{\\text{K}_2\\text{Cr}_2\\text{O}_7 / \\text{H}^+} \\text{R-COOH}$<br><br>Thus, the final product of the oxidation of a primary alcohol by acidified $\\text{K}_2\\text{Cr}_2\\text{O}_7$ is a carboxylic acid.<br><br>Answer: carboxylic acid", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889315a9fc0fc8c14500", "type": "singleCorrect", "question": {"text": "Which of the following is the correct order of acidic strength of following compounds?<br>i. $\\text{CH}_3\\text{OH}$,<br>ii. $(\\text{CH}_3)_3\\text{C.OH}$,<br>iii. $\\text{C}_6\\text{H}_5\\text{OH}$,<br>iv. $\\text{p-NO}_2\\text{-C}_6\\text{H}_4\\text{OH}$", "image": null}, "options": [{"id": "dEFeX", "label": "A", "text": "iv $>$ iii $>$ i $>$ ii", "isCorrect": true, "image": null}, {"id": "ygIDa", "label": "B", "text": "iv $>$ iii $>$ ii $>$ i", "isCorrect": false, "image": null}, {"id": "dZL7l", "label": "C", "text": "iii $>$ iv $>$ i $>$ ii", "isCorrect": false, "image": null}, {"id": "3OKsI", "label": "D", "text": "iii $>$ iv $>$ ii $>$ i", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Acidic strength depends on the stability of the conjugate base formed after the removal of an $\\text{H}^+$ ion.<br><br>Phenols (iii and iv) are more acidic than aliphatic alcohols (i and ii) because the phenoxide ion is stabilized by resonance.<br><br>In p-nitrophenol (iv), the $-\\text{NO}_2$ group exerts strong $-M$ and $-I$ effects, which further stabilizes the phenoxide ion. Hence, p-nitrophenol is more acidic than phenol (iii).<br><br>In aliphatic alcohols, electron-donating alkyl groups ($+I$ effect) destabilize the alkoxide ion, decreasing acidity. The tert-butyl group in (ii) has a much stronger $+I$ effect than the methyl group in (i), making tert-butyl alcohol less acidic than methanol.<br><br>Therefore, the correct order of acidic strength is iv $>$ iii $>$ i $>$ ii.<br><br>Answer: iv $>$ iii $>$ i $>$ ii", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883315a9fc0fc8c14178", "type": "singleCorrect", "question": {"text": "Which of the following reactions is NOT used for preparation of alkyl halide?", "image": null}, "options": [{"id": "hMsu4", "label": "A", "text": "$\\text{CH}_3\\text{-CH}_2\\text{-OH} + \\text{HBr} \\xrightarrow{\\text{NaBr}/\\text{H}_2\\text{SO}_4}$", "isCorrect": false, "image": null}, {"id": "UOMS9", "label": "B", "text": "$\\text{CH}_3\\text{-CH}_2\\text{-OH} + \\text{HCl}$ (anhydrous $\\text{ZnCl}_2$) $\\rightarrow$", "isCorrect": false, "image": null}, {"id": "T8u1K", "label": "C", "text": "$\\text{CH}_3\\text{-CH}_2\\text{-OH} + \\text{NaCl} \\rightarrow$", "isCorrect": true, "image": null}, {"id": "Qr0uh", "label": "D", "text": "$\\text{CH}_3\\text{-CH}_2\\text{-OH} + \\text{PCl}_3 \\rightarrow$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Alcohols react with hydrogen halides to form alkyl halides. The reaction requires an acidic medium to protonate the hydroxyl group, converting it into a good leaving group ($\\text{H}_2\\text{O}$).<br><br>In the reaction with $\\text{NaCl}$, there is no acid present to protonate the $-\\text{OH}$ group of the alcohol. Since $\\text{OH}^{-}$ is a poor leaving group, the nucleophilic substitution by $\\text{Cl}^{-}$ does not take place. Thus, this reaction is not used for the preparation of alkyl halides.<br><br>The other reactions successfully produce alkyl halides:<br>$\\text{CH}_3\\text{CH}_2\\text{OH} + \\text{HBr} \\rightarrow \\text{CH}_3\\text{CH}_2\\text{Br} + \\text{H}_2\\text{O}$ (using $\\text{NaBr}$ and $\\text{H}_2\\text{SO}_4$ to generate $\\text{HBr}$ in situ)<br>$\\text{CH}_3\\text{CH}_2\\text{OH} + \\text{HCl} \\xrightarrow{\\text{ZnCl}_2} \\text{CH}_3\\text{CH}_2\\text{Cl} + \\text{H}_2\\text{O}$<br>$3\\text{CH}_3\\text{CH}_2\\text{OH} + \\text{PCl}_3 \\rightarrow 3\\text{CH}_3\\text{CH}_2\\text{Cl} + \\text{H}_3\\text{PO}_3$<br><br>Answer: $\\text{CH}_3\\text{-CH}_2\\text{-OH} + \\text{NaCl} \\rightarrow$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3538c30a4553e1be288", "type": "singleCorrect", "question": {"text": "Identify product 'B' in following series of reactions<br>2-methylpropan-2-ol $\\xrightarrow[\\large{363\\ \\text{K}}]{\\large{20\\%\\ \\text{H}_2\\text{SO}_4}}$ A $\\xrightarrow[\\large{\\text{Conc. H}_2\\text{SO}_4}]{\\large{\\text{H}_2\\text{O}\\ \\ \\Delta}}$ B", "image": null}, "options": [{"id": "bJBAh", "label": "A", "text": "n-Butylalcohol", "isCorrect": false, "image": null}, {"id": "DLOnD", "label": "B", "text": "sec-Butylalcohol", "isCorrect": false, "image": null}, {"id": "13eF5", "label": "C", "text": "Iso-butylalcohol", "isCorrect": false, "image": null}, {"id": "GZ8k8", "label": "D", "text": "tert-Butylalcohol", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The starting material, 2-methylpropan-2-ol, is a tertiary alcohol. On heating with $20\\%$ $H_2SO_4$ at $363\\ \\text{K}$, it undergoes acid-catalyzed dehydration to form an alkene, 2-methylpropene (product A).<br><br>$(CH_3)_3C-OH \\xrightarrow{H^+, \\Delta} (CH_3)_2C=CH_2 + H_2O$<br><br>Product A is 2-methylpropene.<br><br>When 2-methylpropene is treated with water in the presence of concentrated $H_2SO_4$ and heat, it undergoes acid-catalyzed hydration. The addition of water follows Markovnikov's rule, proceeding via the formation of a stable tertiary carbocation.<br><br>$(CH_3)_2C=CH_2 + H^+ \\rightarrow (CH_3)_3C^+$<br><br>$(CH_3)_3C^+ + H_2O \\rightarrow (CH_3)_3C-OH + H^+$<br><br>The final product B is 2-methylpropan-2-ol, which is commonly known as tert-butyl alcohol.<br><br>Answer: tert-Butylalcohol", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f28c30a4553e1bde85", "type": "singleCorrect", "question": {"text": "Select the correct decreasing order of acid strength for the following compounds.<br>a) Ethanol &nbsp; b) 2-Methyl propan-2-ol &nbsp; c) Phenol &nbsp; d) p - Nitrophenol", "image": null}, "options": [{"id": "sZDHX", "label": "A", "text": "a > b > c > d", "isCorrect": false, "image": null}, {"id": "8cSvn", "label": "B", "text": "c > d > b > a", "isCorrect": false, "image": null}, {"id": "foVAP", "label": "C", "text": "d > c > a > b", "isCorrect": true, "image": null}, {"id": "Use74", "label": "D", "text": "d > b > c > a", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Acid strength is directly proportional to the stability of the conjugate base formed after the removal of an $H^+$ ion.<br><br>The conjugate bases are:<br>a) Ethoxide ion ($CH_3CH_2O^-$)<br>b) tert-Butoxide ion ($(CH_3)_3CO^-$)<br>c) Phenoxide ion ($C_6H_5O^-$)<br>d) p-Nitrophenoxide ion ($p-NO_2-C_6H_4O^-$)<br><br>Phenoxide ions are resonance stabilized, making phenols more acidic than aliphatic alcohols. Thus, (c) and (d) are more acidic than (a) and (b).<br><br>In p-nitrophenol (d), the $-NO_2$ group exerts strong $-I$ and $-R$ effects, which further stabilizes the phenoxide ion. Hence, p-nitrophenol is more acidic than phenol (c).<br><br>Among the alcohols, the $+I$ effect of the alkyl groups destabilizes the alkoxide ion. The tert-butyl group in 2-methylpropan-2-ol (b) exerts a stronger $+I$ effect than the ethyl group in ethanol (a). Therefore, ethanol is more acidic than 2-methylpropan-2-ol.<br><br>The correct decreasing order of acid strength is d > c > a > b.<br><br>Answer: d > c > a > b", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3458c30a4553e1be1fa", "type": "singleCorrect", "question": {"text": "Which of the following alcohols on addition of Lucas reagent reacts fast and turns the reagent turbid instantly.", "image": null}, "options": [{"id": "PTPGA", "label": "A", "text": "n - Butyl alcohol", "isCorrect": false, "image": null}, {"id": "2eqrO", "label": "B", "text": "sec - Butyl alcohol", "isCorrect": false, "image": null}, {"id": "V3NMz", "label": "C", "text": "iso - Butyl alcohol", "isCorrect": false, "image": null}, {"id": "3wrBg", "label": "D", "text": "tert - Butyl alcohol", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Lucas reagent is a mixture of concentrated $\\text{HCl}$ and anhydrous $\\text{ZnCl}_2$.<br><br>The reaction of alcohols with Lucas reagent proceeds via an $S_N1$ mechanism, which involves the formation of a carbocation intermediate.<br><br>The rate of reaction depends on the stability of the carbocation formed. The order of stability of carbocations is tertiary $>$ secondary $>$ primary. Therefore, the reactivity of alcohols towards Lucas reagent follows the order: tertiary $>$ secondary $>$ primary.<br><br>Tertiary alcohols react instantly to form an insoluble alkyl halide, producing immediate turbidity.<br><br>Secondary alcohols react in about 5 minutes to produce turbidity.<br><br>Primary alcohols do not produce turbidity at room temperature.<br><br>Among the given options, tert-butyl alcohol is a tertiary alcohol, so it forms a stable tertiary carbocation and reacts instantly to give turbidity.<br><br>n-butyl alcohol and iso-butyl alcohol are primary alcohols, while sec-butyl alcohol is a secondary alcohol.<br><br>Answer: tert - Butyl alcohol", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d68c30a4553e1bdd4f", "type": "singleCorrect", "question": {"text": "Which of the following reagents limits the oxidation of $\\text{R-CH}_2\\text{OH}$ up to R-CHO only?", "image": null}, "options": [{"id": "Iqlp5", "label": "A", "text": "PCC", "isCorrect": true, "image": null}, {"id": "SWmrH", "label": "B", "text": "$\\text{CrO}_3$", "isCorrect": false, "image": null}, {"id": "gBVXl", "label": "C", "text": "$\\text{K}_2\\text{Cr}_2\\text{O}_7$ / dil. $\\text{H}_2\\text{SO}_4$", "isCorrect": false, "image": null}, {"id": "oCHO6", "label": "D", "text": "$\\text{KMnO}_4$ (acidic)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Primary alcohols ($\\text{R-CH}_2\\text{OH}$) can be oxidized to aldehydes ($\\text{R-CHO}$) or carboxylic acids ($\\text{R-COOH}$) depending on the oxidizing agent used.<br><br>Strong oxidizing agents like acidic $\\text{KMnO}_4$, $\\text{K}_2\\text{Cr}_2\\text{O}_7$ / dil. $\\text{H}_2\\text{SO}_4$, and $\\text{CrO}_3$ in aqueous medium oxidize primary alcohols directly to carboxylic acids.<br><br>To limit the oxidation to the aldehyde stage, mild oxidizing agents are required. Pyridinium chlorochromate (PCC) is a mild oxidizing agent that selectively oxidizes primary alcohols to aldehydes and prevents further oxidation to carboxylic acids.<br><br>$\\text{R-CH}_2\\text{OH} \\xrightarrow{\\text{PCC}} \\text{R-CHO}$<br><br>Answer: PCC", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d38c30a4553e1bdd31", "type": "singleCorrect", "question": {"text": "Identify the product X in the following reaction.<br><img style=\"width: 500px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/15_april_shift_2__q59_d1.png\" />", "image": null}, "options": [{"id": "uXiJA", "label": "A", "text": "2,3-dimethyl-2-butene", "isCorrect": true, "image": null}, {"id": "2Y4DI", "label": "B", "text": "3,2-diethyl butene", "isCorrect": false, "image": null}, {"id": "q5lYH", "label": "C", "text": "3,3-dimethyl-1-butene", "isCorrect": false, "image": null}, {"id": "4w1ee", "label": "D", "text": "2,2-diethyl butene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given reaction is the acid-catalyzed dehydration of an alcohol. The reactant is 3,3-dimethyl-2-butanol.<br><br>Step 1: Protonation of the hydroxyl group by $H_2SO_4$ to form a good leaving group ($-OH_2^+$).<br>$CH_3-C(CH_3)_2-CH(OH)-CH_3 + H^+ \\rightarrow CH_3-C(CH_3)_2-CH(OH_2^+)-CH_3$<br><br>Step 2: Loss of a water molecule to form a secondary ($2^\\circ$) carbocation.<br>$CH_3-C(CH_3)_2-CH(OH_2^+)-CH_3 \\rightarrow CH_3-C(CH_3)_2-CH^+-CH_3 + H_2O$<br><br>Step 3: The $2^\\circ$ carbocation undergoes a 1,2-methyl shift to form a more stable tertiary ($3^\\circ$) carbocation.<br>$CH_3-C(CH_3)_2-CH^+-CH_3 \\xrightarrow{\\text{1,2-methyl shift}} CH_3-C^+(CH_3)-CH(CH_3)-CH_3$<br><br>Step 4: Elimination of a proton ($H^+$) from the adjacent carbon atom yields the most substituted alkene as the major product, according to Saytzeff's rule.<br>$CH_3-C^+(CH_3)-CH(CH_3)-CH_3 \\rightarrow CH_3-C(CH_3)=C(CH_3)-CH_3 + H^+$<br><br>The major product formed is 2,3-dimethyl-2-butene.<br><br>Answer: 2,3-dimethyl-2-butene", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3378c30a4553e1be168", "type": "singleCorrect", "question": {"text": "What is the nature of alcohols in aqueous medium?", "image": null}, "options": [{"id": "mYTSh", "label": "A", "text": "Acidic", "isCorrect": false, "image": null}, {"id": "e3HPq", "label": "B", "text": "Basic", "isCorrect": false, "image": null}, {"id": "w7Bx3", "label": "C", "text": "Neutral", "isCorrect": true, "image": null}, {"id": "chOBK", "label": "D", "text": "Amphoteric", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Alcohols are very weak acids, generally weaker than water. In an aqueous medium, they do not ionize to produce $H^+$ or $OH^-$ ions to any appreciable extent.<br><br>Because they do not alter the concentration of hydrogen or hydroxyl ions in water, they do not affect the pH of the solution. Consequently, they do not change the colour of red or blue litmus paper.<br><br>Therefore, the nature of alcohols in an aqueous medium is neutral.<br><br>Answer: Neutral", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e48c30a4553e1bdde8", "type": "singleCorrect", "question": {"text": "Which of following on oxidation forms propanone?", "image": null}, "options": [{"id": "EB0fw", "label": "A", "text": "1-Propanol", "isCorrect": false, "image": null}, {"id": "DEOK2", "label": "B", "text": "2-Propanol", "isCorrect": true, "image": null}, {"id": "wzIKI", "label": "C", "text": "2-Butanol", "isCorrect": false, "image": null}, {"id": "mOvLi", "label": "D", "text": "2- methylbutan-1-ol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Oxidation of secondary alcohols yields ketones.<br><br>2-Propanol is a secondary alcohol containing three carbon atoms. Upon oxidation with common oxidizing agents like acidic $K_2Cr_2O_7$ or $KMnO_4$, it forms propanone (acetone).<br><br>$CH_3-CH(OH)-CH_3 \\xrightarrow{[O]} CH_3-CO-CH_3 + H_2O$<br><br>1-Propanol is a primary alcohol and oxidizes to propanal, which further oxidizes to propanoic acid.<br><br>2-Butanol oxidizes to 2-butanone.<br><br>2-methylbutan-1-ol oxidizes to 2-methylbutanoic acid.<br><br>Answer: 2-Propanol", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29d8c30a4553e1bdaf8", "type": "singleCorrect", "question": {"text": "How many moles of hydrogen are liberated when $6$ moles of ethyl alcohol reacts with sodium metal?", "image": null}, "options": [{"id": "BvBUK", "label": "A", "text": "$2$", "isCorrect": false, "image": null}, {"id": "9eRsE", "label": "B", "text": "$3$", "isCorrect": true, "image": null}, {"id": "pjexq", "label": "C", "text": "$4$", "isCorrect": false, "image": null}, {"id": "pPeDN", "label": "D", "text": "$6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The balanced chemical equation for the reaction of ethyl alcohol with sodium metal is:<br><br>$2\\text{C}_2\\text{H}_5\\text{OH} + 2\\text{Na} \\rightarrow 2\\text{C}_2\\text{H}_5\\text{ONa} + \\text{H}_2$<br><br>From the stoichiometry of the reaction, $2$ moles of ethyl alcohol produce $1$ mole of hydrogen gas.<br><br>Therefore, the number of moles of hydrogen gas produced by $6$ moles of ethyl alcohol is:<br><br>$\\dfrac{1}{2} \\times 6 = 3$ moles<br><br>Answer: $3$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bacbf9280d7f9932b76", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following forms 2-Methylbut-2-ene on heating with concentrated sulphuric acid?", "image": null}, "options": [{"id": "K28cZ", "text": "Butan-2-ol", "image": null, "isCorrect": false}, {"id": "V1aes", "text": "2-Methyl-2-propanol", "image": null, "isCorrect": false}, {"id": "iTE0W", "text": "Pentan-1-ol", "image": null, "isCorrect": false}, {"id": "bgDs1", "text": "2-Methylbutan-1-ol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Dehydration of alcohols with concentrated $H_2SO_4$ proceeds via a carbocation intermediate.<br><br>For 2-Methylbutan-1-ol, protonation and loss of a water molecule yields a primary carbocation: $CH_3-CH_2-CH(CH_3)-CH_2^+$<br><br>This primary carbocation undergoes a 1,2-hydride shift to form a more stable tertiary carbocation: $CH_3-CH_2-C^+(CH_3)-CH_3$<br><br>Elimination of a proton from the adjacent $CH_2$ group (following Saytzeff's rule) gives the most substituted alkene as the major product: $CH_3-CH=C(CH_3)-CH_3$ (2-Methylbut-2-ene).<br><br>The other given alcohols do not have the required carbon skeleton to form 2-Methylbut-2-ene.<br><br>Answer: 2-Methylbutan-1-ol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8abf9280d7f9932a35", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product ' $Z$ ' in the following series of reactions.\nEthanol \n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/w5Ux6swZSR3qeYOyBASkRvcZnhz0SMuJ60es2p1Iva4.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "fYVlI", "text": "Ethylchloride", "image": null, "isCorrect": false}, {"id": "E4jur", "text": "Ethyl magnesium chloride", "image": null, "isCorrect": false}, {"id": "RjiDT", "text": "Ethyl amine", "image": null, "isCorrect": false}, {"id": "6c5EZ", "text": "Ethane", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given reaction sequence can be broken down into three steps:<br><br>Step 1: Ethanol ($C_2H_5OH$) reacts with thionyl chloride ($SOCl_2$) upon heating to form ethyl chloride ($C_2H_5Cl$).<br>$C_2H_5OH + SOCl_2 \\xrightarrow{\\Delta} C_2H_5Cl + SO_2 \\uparrow + HCl \\uparrow$<br>Thus, X is ethyl chloride ($C_2H_5Cl$).<br><br>Step 2: Ethyl chloride reacts with magnesium metal in the presence of dry ether to form a Grignard reagent, ethyl magnesium chloride.<br>$C_2H_5Cl + Mg \\xrightarrow{\\text{Dry ether}} C_2H_5MgCl$<br>Thus, Y is ethyl magnesium chloride ($C_2H_5MgCl$).<br><br>Step 3: Grignard reagents react with compounds containing active hydrogen, such as ammonia ($NH_3$), to yield alkanes. Ethyl magnesium chloride reacts with ammonia to form ethane.<br>$C_2H_5MgCl + H-NH_2 \\rightarrow C_2H_6 + Mg(NH_2)Cl$<br>Thus, the final product Z is ethane ($C_2H_6$).<br><br>Answer: Ethane", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5bbf9280d7f9932885", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Methyl propanoate on hydrolysis with dil NaOH forms a salt that on further acidification with conc. HCl forms", "image": null}, "options": [{"id": "ZhCKR", "text": "\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/nII1BzM3HAs7tOzPp20MLNpcwwXnAF2Jbt1QsoTEwlE.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "2lwmT", "text": "\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/hZMNCXef9vJT4jwOWoPits790jHFtuqymxL7_36DUpQ.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "PBzns", "text": "\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/lTV4-aSlf5EE7FvVsDLLxbTaMSwrwuo-fFme8WR_4RE.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "e6enL", "text": "\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/DHo9w5zCeutDbfeNxrAK7ZdqJpB1Vi-bVG44NjDBFXs.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical formula of methyl propanoate is $CH_3-CH_2-COOCH_3$.<br><br>When methyl propanoate undergoes alkaline hydrolysis with dilute NaOH, it forms sodium propanoate (a salt) and methanol.<br>$CH_3-CH_2-COOCH_3 + NaOH \\rightarrow CH_3-CH_2-COONa + CH_3OH$<br><br>Further acidification of the salt (sodium propanoate) with concentrated HCl yields propanoic acid.<br>$CH_3-CH_2-COONa + HCl \\rightarrow CH_3-CH_2-COOH + NaCl$<br><br>The structure of propanoic acid can be written as $HO-C(=O)-C_2H_5$, which matches the third option.<br><br>Answer: \n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/lTV4-aSlf5EE7FvVsDLLxbTaMSwrwuo-fFme8WR_4RE.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b59bf9280d7f9932873", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product in the following reaction.\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/w6_TJMVOdOA5n23jUtMRvb.png\">", "image": null}, "options": [{"id": "7gXTx", "text": "Benzene", "image": null, "isCorrect": false}, {"id": "l0gGB", "text": "Benzoic acid", "image": null, "isCorrect": false}, {"id": "44Xzl", "text": "Benzaldehyde", "image": null, "isCorrect": false}, {"id": "qVYqz", "text": "p-Benzoquinone", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Phenol undergoes oxidation in the presence of chromic anhydride ($\\text{CrO}_3$) or chromic acid to form a conjugated diketone known as p-benzoquinone.<br><br>The reaction is a standard oxidation of phenol where the aromatic ring is oxidized to a quinone structure.<br><br>$\\text{C}_6\\text{H}_5\\text{OH} \\xrightarrow{\\text{CrO}_3} \\text{p-Benzoquinone}$<br><br>Answer: p-Benzoquinone", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4bbf9280d7f99327f2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the major product formed when 2-Methylhexan-3-ol is heated with concentrated sulphuric acid.", "image": null}, "options": [{"id": "7BOuX", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/z3mbCTQ11LDSsXOUTEETyicG_pZay8DWW93BFY-GJcg.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "72XRU", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/Mx_PoVaXGp_oV7RMSpTaeiurK2ROxjiq8w7kHxYATJk.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "v1chq", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/ud-fnbrvCFO0xiiv-iccNKrMQ5yCHOsFpfC71UnGaco.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "YHnVl", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/YqqTcsHbHt2ShvDQeNPulHoOaKESbsVVamVjU31mwVE.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reactant is 2-methylhexan-3-ol, which has the structure:<br>$\\text{CH}_3-\\text{CH}(\\text{CH}_3)-\\text{CH}(\\text{OH})-\\text{CH}_2-\\text{CH}_2-\\text{CH}_3$<br><br>When heated with concentrated sulphuric acid, the alcohol undergoes acid-catalyzed dehydration.<br><br>Step 1: Protonation of the hydroxyl group followed by the loss of a water molecule generates a secondary carbocation at C-3:<br>$\\text{CH}_3-\\text{CH}(\\text{CH}_3)-\\text{CH}^+-\\text{CH}_2-\\text{CH}_2-\\text{CH}_3$<br><br>Step 2: A 1,2-hydride shift from C-2 to C-3 occurs to form a more stable tertiary carbocation at C-2:<br>$\\text{CH}_3-\\text{C}^+(\\text{CH}_3)-\\text{CH}_2-\\text{CH}_2-\\text{CH}_2-\\text{CH}_3$<br><br>Step 3: Elimination of a proton ($\\text{H}^+$) from the adjacent carbon (C-3) yields the alkene. According to Saytzeff's rule, the more highly substituted alkene is more stable and is formed as the major product.<br><br>Elimination of $\\text{H}^+$ from C-3 gives 2-methylhex-2-ene:<br>$\\text{CH}_3-\\text{C}(\\text{CH}_3)=\\text{CH}-\\text{CH}_2-\\text{CH}_2-\\text{CH}_3$<br><br>This is a trisubstituted alkene. (Note: Even without the hydride shift, elimination of $\\text{H}^+$ from C-2 of the secondary carbocation yields the same trisubstituted alkene, which is more stable than the disubstituted 2-methylhex-3-ene formed by elimination from C-4).<br><br>Therefore, the major product is 2-methylhex-2-ene, which corresponds to the first skeletal structure.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/z3mbCTQ11LDSsXOUTEETyicG_pZay8DWW93BFY-GJcg.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213eb0aee93fa0796dc8c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Which from following is called as Lucas reagent?", "image": null}, "options": [{"id": "lTat0", "text": "Conc. $\\mathrm{HCl}+\\mathrm{ZnCl}_2$", "image": null, "isCorrect": true}, {"id": "VCsxl", "text": "Neutral $\\mathrm{FeCl}_3$ solution in water", "image": null, "isCorrect": false}, {"id": "APOXl", "text": "$\\mathrm{NaNO}_2+\\mathrm{HCl}($ dil. $)$", "image": null, "isCorrect": false}, {"id": "jA17S", "text": "$\\mathrm{CHCl}_3+\\mathrm{NaOH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Lucas reagent is a mixture of concentrated hydrochloric acid ($\\mathrm{HCl}$) and anhydrous zinc chloride ($\\mathrm{ZnCl}_2$).<br><br>It is used in organic chemistry to differentiate between primary, secondary, and tertiary alcohols based on their reactivity.<br><br>Answer: Conc. $\\mathrm{HCl}+\\mathrm{ZnCl}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d50aee93fa0796dbe4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Identify the product ' B ' in the following series of reactions.\r\n$\\text { Propan-1-ol } \\xrightarrow[623 \\mathrm{~K}]{\\mathrm{Al}_2 \\mathrm{O}_3} \\mathrm{~A} \\xrightarrow[\\text { ii) } \\mathrm{H}_2 \\mathrm{O}]{\\text { i) } \\text{Conc. }\\mathrm{H}_2\\mathrm{SO}_4} \\mathrm{~B}$", "image": null}, "options": [{"id": "zUI3z", "text": "Propene", "image": null, "isCorrect": false}, {"id": "c1gUj", "text": "Propanal", "image": null, "isCorrect": false}, {"id": "xAtjK", "text": "Propanone", "image": null, "isCorrect": false}, {"id": "MN5kI", "text": "Propan-2-ol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Propan-1-ol undergoes dehydration in the presence of $Al_2O_3$ at $623 \\text{ K}$ to form propene (A).<br><br>$CH_3-CH_2-CH_2-OH \\xrightarrow[623 \\text{ K}]{Al_2O_3} CH_3-CH=CH_2 + H_2O$<br><br>Propene (A) then undergoes hydration upon reaction with concentrated $H_2SO_4$ followed by hydrolysis. The addition of water follows Markovnikov's rule.<br><br>$CH_3-CH=CH_2 \\xrightarrow{\\text{Conc. } H_2SO_4} CH_3-CH(OSO_3H)-CH_3 \\xrightarrow{H_2O} CH_3-CH(OH)-CH_3$<br><br>The final product B is Propan-2-ol.<br><br>Answer: Propan-2-ol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c40aee93fa0796db5b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Identify the product P of following reaction.\r\n$\\mathrm{CH}_3 \\mathrm{OH}+\\mathrm{CH}_3 \\mathrm{MgX} \\longrightarrow \\mathrm{P}+\\mathrm{MgX}\\left(\\mathrm{OCH}_3\\right)$", "image": null}, "options": [{"id": "fEr1x", "text": "$\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "AtZyb", "text": "$\\mathrm{CH}_2=\\mathrm{CH}_2$", "image": null, "isCorrect": false}, {"id": "wD7Q8", "text": "$\\mathrm{CH}_4$", "image": null, "isCorrect": true}, {"id": "6Z3ud", "text": "$\\mathrm{C}_2 \\mathrm{H}_6$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Methanol ($\\mathrm{CH}_3\\mathrm{OH}$) contains an active (acidic) hydrogen atom attached to the highly electronegative oxygen atom.<br><br>Grignard reagents ($\\mathrm{RMgX}$) act as strong bases and react with compounds containing active hydrogen to form alkanes ($\\mathrm{RH}$).<br><br>In this reaction, the methyl carbanion ($\\mathrm{CH}_3^-$) from methylmagnesium halide ($\\mathrm{CH}_3\\mathrm{MgX}$) abstracts the acidic proton ($\\mathrm{H}^+$) from methanol to form methane ($\\mathrm{CH}_4$).<br><br>The chemical equation is:<br><br>$\\mathrm{CH}_3\\mathrm{OH} + \\mathrm{CH}_3\\mathrm{MgX} \\longrightarrow \\mathrm{CH}_4 + \\mathrm{MgX}(\\mathrm{OCH}_3)$<br><br>Therefore, the product P is $\\mathrm{CH}_4$.<br><br>Answer: $\\mathrm{CH}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139e0aee93fa0796da31", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "The decreasing order of reactivity of following alcohols with halo acid is\n(I) $\\mathrm{CH}_3 \\mathrm{OH}$\n(II) $\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{OH}$\n(III)<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/UMoTDey3dqqXmrZs-UQJD6DT-eqrmdTRwJXm8jbTLeU.original.fullsize.png\"/><br/>(IV)<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/SByfIFaOym1wFFUofmq43S67-qHoYqL9bn3L40uOi3g.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "xuNSp", "text": "(IV) $\\gt$ (III) $\\gt$ (II) $\\gt$ (I)", "image": null, "isCorrect": true}, {"id": "tQllh", "text": "(I) $\\gt$ (II) $\\gt$ (III) $\\gt$ (IV)", "image": null, "isCorrect": false}, {"id": "xfj47", "text": "(II) $\\gt$ (I) $\\gt$ (IV) $\\gt$ (III)", "image": null, "isCorrect": false}, {"id": "kC6td", "text": "$\\quad(IV) $&gt;$ (II) $&gt;$ (III) $&gt;$ (I)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reactivity of alcohols with halo acids (like $\\mathrm{HCl}$, $\\mathrm{HBr}$, $\\mathrm{HI}$) generally follows the order of stability of the carbocation intermediate formed during the reaction. The reaction proceeds via an $S_N1$ mechanism for secondary and tertiary alcohols, and an $S_N2$ mechanism for primary alcohols, but overall, the rate is highest for tertiary alcohols.<br><br>The given alcohols are:<br>(I) $\\mathrm{CH}_3\\mathrm{OH}$ (Methanol) $\\rightarrow$ forms methyl carbocation (least stable)<br>(II) $\\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{OH}$ (Ethanol, $1^{\\circ}$ alcohol) $\\rightarrow$ forms primary carbocation<br>(III) $\\mathrm{CH}_3-\\mathrm{CH}(\\mathrm{OH})-\\mathrm{CH}_3$ (Propan-2-ol, $2^{\\circ}$ alcohol) $\\rightarrow$ forms secondary carbocation<br>(IV) $\\mathrm{CH}_3-\\mathrm{C}(\\mathrm{CH}_3)(\\mathrm{OH})-\\mathrm{CH}_3$ (2-Methylpropan-2-ol, $3^{\\circ}$ alcohol) $\\rightarrow$ forms tertiary carbocation (most stable)<br><br>The stability of carbocations follows the order: $3^{\\circ} \\gt 2^{\\circ} \\gt 1^{\\circ} \\gt \\mathrm{CH}_3^+$.<br><br>Therefore, the decreasing order of reactivity of the given alcohols with halo acids is:<br>(IV) $\\gt$ (III) $\\gt$ (II) $\\gt$ (I)<br><br>Answer: (IV) $\\gt$ (III) $\\gt$ (II) $\\gt$ (I)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213880aee93fa0796d986", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Identify the product ' $Z$ ' in the following series of reactions.\n$\\text { Ethanol } \\xrightarrow[\\Delta]{\\mathrm{SOCl}_2} \\mathrm{X} \\xrightarrow[\\text { Dryeher }]{\\mathrm{Mg}} \\mathrm{Y} \\xrightarrow{\\mathrm{NH}_3} \\mathrm{Z}$", "image": null}, "options": [{"id": "ybvqq", "text": "Ethylchlorịde", "image": null, "isCorrect": false}, {"id": "QJfVY", "text": "Ethyl magnesium chloride", "image": null, "isCorrect": false}, {"id": "Yov65", "text": "Ethyl amine", "image": null, "isCorrect": false}, {"id": "3IKB4", "text": "Ethane", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Ethanol reacts with $\\mathrm{SOCl}_2$ to form ethyl chloride ($\\mathrm{X}$).<br><br>$\\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{OH} + \\mathrm{SOCl}_2 \\xrightarrow{\\Delta} \\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{Cl} + \\mathrm{SO}_2 + \\mathrm{HCl}$<br><br>Ethyl chloride reacts with magnesium in dry ether to form ethyl magnesium chloride ($\\mathrm{Y}$), which is a Grignard reagent.<br><br>$\\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{Cl} + \\mathrm{Mg} \\xrightarrow{\\text{Dry ether}} \\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{MgCl}$<br><br>Grignard reagents react with compounds containing active hydrogen, such as ammonia, to yield alkanes. Ethyl magnesium chloride abstracts a proton from ammonia to form ethane ($\\mathrm{Z}$).<br><br>$\\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{MgCl} + \\mathrm{NH}_3 \\rightarrow \\mathrm{CH}_3\\mathrm{CH}_3 + \\mathrm{Mg}(\\mathrm{NH}_2)\\mathrm{Cl}$<br><br>Thus, the final product $\\mathrm{Z}$ is ethane.<br><br>Answer: Ethane", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792132a0aee93fa0796d6a4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Which from following compounds is obtained when acyl chloride is hydrolysed with water?", "image": null}, "options": [{"id": "eNu3C", "text": "Alcohols", "image": null, "isCorrect": false}, {"id": "lP7U1", "text": "Aldehydes", "image": null, "isCorrect": false}, {"id": "1K5ye", "text": "Carboxylic acids", "image": null, "isCorrect": true}, {"id": "ZySM0", "text": "Esters", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Acyl chlorides react with water to undergo hydrolysis, resulting in the formation of carboxylic acids and hydrogen chloride gas.<br><br>$R-COCl + H_2O \\rightarrow R-COOH + HCl$<br><br>Thus, the compound obtain
