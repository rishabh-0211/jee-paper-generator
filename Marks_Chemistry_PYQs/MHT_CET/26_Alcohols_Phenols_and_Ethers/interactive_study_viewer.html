{2} \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "RvMjr", "text": "DMSO", "image": null, "isCorrect": true}, {"id": "l6ax2", "text": "benzene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Polar aprotic solvents such as DMSO increase the rate of $\\mathrm{S}_{\\mathrm{N}} 2$ reactions.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7a0279619d9d8a14c0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "$1 \\mathrm{~mol}$ alcohol reacts with Na to give what weight of hydrogen?", "image": null}, "options": [{"id": "AKAVg", "text": "$1 \\mathrm{~g}$", "image": null, "isCorrect": true}, {"id": "y2Sea", "text": "$2 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "WCvBX", "text": "$3 \\mathrm{~g}$", "image": null, "isCorrect": false}, {"id": "OKhXf", "text": "$3.5 \\mathrm{~g}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$2 \\mathrm{C}_{2} \\mathrm{H}_{5} \\mathrm{OH}+2 \\mathrm{Na} \\longrightarrow 2 \\mathrm{C}_{2} \\mathrm{H}_{5} \\mathrm{ONa}+\\mathrm{H}_{2}$\n$\\mathrm{mol}$\nmo\n$\\mathrm{mol}$\n$$\n\\frac{1}{2} \\mathrm{~mol}\n$$\nThe weight of $\\frac{1}{2} \\mathrm{~mol} \\mathrm{H}_{2}=\\frac{2}{2} \\mathrm{~g}=1 \\mathrm{~g}$\nThus, $1 \\mathrm{~g} \\mathrm{H}_{2}$ is produced when 1 mole of alcohol reacts with Na.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e590279619d9d8a13b3", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The alcohol that produces turbidity immediately with $\\mathrm{ZnCl}_{2} /$ conc. HCl at room temperature", "image": null}, "options": [{"id": "eLUkd", "text": "1-hydroxy butane", "image": null, "isCorrect": false}, {"id": "171nz", "text": "2-hydroxy butane", "image": null, "isCorrect": false}, {"id": "E3w7m", "text": "2-hydroxy-2-methyl propane", "image": null, "isCorrect": true}, {"id": "YxPOg", "text": "1-hydroxy-2-methyl propane", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Mixture of anhydrous $\\mathrm{ZnCl}_{2}$ and conc. HCl is known as Lucas reagent. Lucas test is used for the distinction between primary, secondary and tertiary alcohols. The tertiary alcohol reacts immediately with Lucas reagent producing turbidity. The secondary alcohol gives turbidity within 5-10 min and primary alcohol do not give turbidity at all at room temperature. In the given alternates, 2 -hydroxy-2-methyl propane is $3^{\\circ}$ alcohol, so it is more reactive.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e540279619d9d8a1390", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "Following reaction,\n$$\n\\left(\\mathrm{CH}_{3}\\right)_{3} \\mathrm{CBr}+\\mathrm{H}_{2} \\mathrm{O} \\rightarrow\\left(\\mathrm{CH}_{3}\\right)_{3} \\mathrm{COH}+\\mathrm{HBr}\n$$\nis an example of", "image": null}, "options": [{"id": "mCQEB", "text": "elimination reaction", "image": null, "isCorrect": false}, {"id": "qVZfY", "text": "free radical substitution", "image": null, "isCorrect": false}, {"id": "S6Adu", "text": "nucleophilic substitution", "image": null, "isCorrect": true}, {"id": "tIPPm", "text": "electrophilic substitution", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\left(\\mathrm{CH}_{3}\\right)_{3} \\mathrm{CBr}+\\mathrm{H}_{2} \\mathrm{O} \\longrightarrow\\left(\\mathrm{CH}_{3}\\right)_{3} \\mathrm{C}-\\mathrm{OH}+\\mathrm{HBr}$\nBr is substituted by $-\\mathrm{OH}^{-}$ (nucleophile) $\\mathrm{S}_{\\mathrm{N}} 1$ (unimolecular substitution reaction)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263310279619d9d8a3cdc", "title": "Preparation of Phenols", "totalQuestions": 15, "questions": [{"_id": "68871b25bf9280d7f99326aa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the substrate ' X ' in the following reaction.\n$\\mathrm{X}+\\underset{\\text { (air) }}{\\mathrm{O}_2} \\xrightarrow[\\text { ii) dil } \\mathrm{HCl} \\Delta]{\\text { i) Co-naphthenate } 423 \\mathrm{~K}}$ phenol + Acetone", "image": null}, "options": [{"id": "LBliE", "text": "Chlorobenzene", "image": null, "isCorrect": false}, {"id": "LXQHE", "text": "Benzene sulphonic acid", "image": null, "isCorrect": false}, {"id": "ORX2X", "text": "Benzenamine", "image": null, "isCorrect": false}, {"id": "WriZx", "text": "Isopropyl benzene", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given reaction is the commercial method for the preparation of phenol from cumene.<br><br>Cumene is isopropyl benzene. When isopropyl benzene is oxidized by air in the presence of cobalt naphthenate catalyst at $423 \\text{ K}$, it forms cumene hydroperoxide.<br><br>Cumene hydroperoxide on heating with dilute $\\text{HCl}$ undergoes decomposition to yield phenol and acetone as a byproduct.<br><br>Therefore, the substrate 'X' is isopropyl benzene.<br><br>Answer: Isopropyl benzene", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214110aee93fa0796ddb8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Which of the following compounds is NOT a phenol?", "image": null}, "options": [{"id": "8mutk", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/iklH7WUAuui8JYyUqrAF16loZPS4AgeW2rjBRC6y9kM.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "P625p", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/HvBDHQoLNCMGThqBJvdmy3hZDBLvpu4X_noDX8Xt5W8.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "0V4Lc", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/R8c-74QKteyl-VjqgqR4B12zxb5bT7In6KyPinCEWV4.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "RqQeD", "text": "<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/0o7s_pgEx3WnBjqnHQqGNUjpKe4nwHq2gvH9-e8A-HA.original.fullsize.png\"/><br/>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Phenols are compounds in which the hydroxyl group ($-OH$) is directly attached to an $sp^2$ hybridized carbon atom of an aromatic ring.<br><br>In the first option, the $-OH$ group is directly attached to the benzene ring, making it a phenol (o-nitrophenol).<br><br>In the second option, the $-OH$ group is directly attached to the naphthalene ring, making it a phenolic compound (2-naphthol).<br><br>In the third option, the $-OH$ group is directly attached to the benzene ring, making it a phenol (o-bromophenol).<br><br>In the fourth option, the $-OH$ group is attached to an $sp^3$ hybridized carbon atom of a side chain ($-CH_2OH$) rather than directly to the aromatic ring. This compound is benzyl alcohol, which is an aromatic alcohol and not a phenol.<br><br>Answer: <img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/0o7s_pgEx3WnBjqnHQqGNUjpKe4nwHq2gvH9-e8A-HA.original.fullsize.png\"/><br/>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213870aee93fa0796d980", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Identify the product ' B ' in the following reaction.\n\\(\\text {Toluene } \\xrightarrow[\\mathrm{CS}_2]{\\text { Chromylchloride }} \\mathrm{A} \\xrightarrow{\\mathrm{H}_3 \\mathrm{O}^{+}} \\mathrm{B}\\)", "image": null}, "options": [{"id": "gvqv9", "text": "Benzal chloride", "image": null, "isCorrect": false}, {"id": "U4Qmx", "text": "Benzaldehyde", "image": null, "isCorrect": true}, {"id": "QeAfO", "text": "Benzyl alcohol", "image": null, "isCorrect": false}, {"id": "kJjDP", "text": "Benzoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is the Etard reaction.<br><br>Toluene reacts with chromyl chloride ($\\mathrm{CrO_2Cl_2}$) in a non-polar solvent like $\\mathrm{CS_2}$ to form a brown chromium complex, which is intermediate $\\mathrm{A}$.<br><br>$\\mathrm{C_6H_5CH_3} + 2\\mathrm{CrO_2Cl_2} \\xrightarrow{\\mathrm{CS_2}} \\mathrm{C_6H_5CH(OCrOHCl_2)_2}$ (Complex $\\mathrm{A}$)<br><br>Hydrolysis of the chromium complex $\\mathrm{A}$ with acidic water ($\\mathrm{H_3O^+}$) yields benzaldehyde as the final product $\\mathrm{B}$.<br><br>$\\mathrm{C_6H_5CH(OCrOHCl_2)_2} \\xrightarrow{\\mathrm{H_3O^+}} \\mathrm{C_6H_5CHO}$ (Benzaldehyde)<br><br>Therefore, product $\\mathrm{B}$ is benzaldehyde.<br><br>Answer: Benzaldehyde", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792134e0aee93fa0796d7c3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Identify the substrate ' S ' in the following reaction.\r\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/py35bdsq/L88TxUY0V_ZComcTUleNSabaLCdzaHisVocQa3Sz0g4.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "ST35M", "text": "p-Nitrochlorobenzene", "image": null, "isCorrect": false}, {"id": "fhlPE", "text": "o-Nitrochlorobenzene", "image": null, "isCorrect": false}, {"id": "EBfp2", "text": "2,4,6 -trichloronitrobenzene", "image": null, "isCorrect": false}, {"id": "fBYvE", "text": "2,4,6-trinitrochlorobenzene", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given reaction is a nucleophilic aromatic substitution where a leaving group on the benzene ring is replaced by a hydroxyl ($-OH$) group from water to form 2,4,6-trinitrophenol (picric acid).<br><br>For an aryl halide to undergo nucleophilic substitution under very mild conditions (like warming with water), the ring must be strongly activated by the presence of multiple powerful electron-withdrawing groups at the ortho and para positions relative to the leaving group.<br><br>Among the given options, 2,4,6-trinitrochlorobenzene has three strongly electron-withdrawing nitro ($-NO_2$) groups at the ortho and para positions with respect to the chlorine atom. These groups highly stabilize the intermediate carbanion (Meisenheimer complex) through resonance and inductive effects, making the $C-Cl$ bond extremely susceptible to nucleophilic attack.<br><br>Thus, 2,4,6-trinitrochlorobenzene reacts readily with warm water to yield 2,4,6-trinitrophenol.<br><br>Reaction:<br>2,4,6-trinitrochlorobenzene + $H_2O \\xrightarrow{\\text{Warm}}$ 2,4,6-trinitrophenol + $HCl$<br><br>Answer: 2,4,6-trinitrochlorobenzene", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792132b0aee93fa0796d6ae", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "What is the name of tert-butyl alcohol according to carbinol system?", "image": null}, "options": [{"id": "M0smu", "text": "Methyl carbinol", "image": null, "isCorrect": false}, {"id": "pD7Aq", "text": "Ethyl carbinol", "image": null, "isCorrect": false}, {"id": "W6Kjd", "text": "Propyl carbinol", "image": null, "isCorrect": false}, {"id": "7DZCT", "text": "Trimethyl carbinol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In the carbinol system of nomenclature, the simplest alcohol, methanol ($CH_3OH$), is named as carbinol.<br><br>Other alcohols are named as alkyl derivatives of carbinol. The alkyl groups attached to the carbon atom bearing the hydroxyl group (the carbinol carbon) are listed in alphabetical order as prefixes to the word carbinol.<br><br>The structure of tert-butyl alcohol is $(CH_3)_3C-OH$.<br><br>Here, the carbinol carbon is attached to three methyl groups. Therefore, its name in the carbinol system is trimethyl carbinol.<br><br>Answer: Trimethyl carbinol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262260279619d9d8a3231", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Which from following compounds is obtained when anisole is heated with dilute sulfuric acid?", "image": null}, "options": [{"id": "klwbn", "text": "Phenol and ethanol", "image": null, "isCorrect": false}, {"id": "LXD9M", "text": "Phenol and methanol", "image": null, "isCorrect": true}, {"id": "vp2Yg", "text": "Pyrogallol and methanol", "image": null, "isCorrect": false}, {"id": "yf2gA", "text": "Phloroglucinol and ethanol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ethers when heated with dilute sulfuric acid under pressure undergo hydrolysis to give alcohols/phenols.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/1UAa3tqhFqE-z9iVenqDskIkxgf6FSIcBLi7mYFrfnw.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2619c0279619d9d8a2df2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Cumene on air oxidation in presence of co-naphthenate forms", "image": null}, "options": [{"id": "PNf49", "text": "Cumene hydroperoxide", "image": null, "isCorrect": true}, {"id": "beeid", "text": "Acetone", "image": null, "isCorrect": false}, {"id": "jiFec", "text": "Phenol", "image": null, "isCorrect": false}, {"id": "dufG9", "text": "Phenol + acetone", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/BI05OUWhx1FDtKgW3biaDNz2EjB9Cn6UQCGXzeOro_4.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261880279619d9d8a2d52", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "What is the product formed when cumene is air oxidized in presence of co-naphthenate and further treated with dilute acid?", "image": null}, "options": [{"id": "j9iS6", "text": "Cumene hydroperoxide", "image": null, "isCorrect": false}, {"id": "lfSGo", "text": "Phenol + Acetone", "image": null, "isCorrect": true}, {"id": "oTyRR", "text": "Acetone and Benzoic acid", "image": null, "isCorrect": false}, {"id": "W7WX9", "text": "Phenol and $\\mathrm{CO}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/JzPpmzMK4SNptoZYRkeafp1pUEdZe96zfcM0jGUD_sQ.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260f90279619d9d8a28ca", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "What is the product formed when aniline is treated with $\\mathrm{NaNO}_2+\\mathrm{HCl}$ previous to hydrolysis?", "image": null}, "options": [{"id": "yxfcx", "text": "Benzene diazonium chloride", "image": null, "isCorrect": true}, {"id": "VorxD", "text": "Benzene", "image": null, "isCorrect": false}, {"id": "lLtPb", "text": "Phenol $+\\mathrm{N}_2 \\uparrow$", "image": null, "isCorrect": false}, {"id": "I9Wlj", "text": "Phenol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/chEYS4iyi23-G6egCkTCjcTS79xXtYKMZj9J3P2JcaM.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": nu
