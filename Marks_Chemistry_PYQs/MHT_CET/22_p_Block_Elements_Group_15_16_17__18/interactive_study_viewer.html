Name": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "Concentrated $\\mathrm{H}_{2} \\mathrm{SO}_{4}$ reacts with $\\mathrm{PCl}_{5}$ to produce", "image": null}, "options": [{"id": "7De57", "text": "$\\mathrm{HClO}_{2}$", "image": null, "isCorrect": false}, {"id": "WevlQ", "text": "$\\mathrm{SO}_{2} \\mathrm{Cl}_{2}$", "image": null, "isCorrect": true}, {"id": "BRS1p", "text": "$\\mathrm{SOCl}_{2}$", "image": null, "isCorrect": false}, {"id": "ijGPu", "text": "$\\mathrm{HClO}_{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When excess of $\\mathrm{Pa}_{5}$ reacts with conc. $\\mathrm{H}_{2} \\mathrm{SO}_{4}$, it gives suphuryl chloride $\\left(\\mathrm{SO}_{2} \\mathrm{Cl}_{2}\\right)$ as product\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/jjHRQ6N8eKu_H3NZKx_pGZLEYmoo2hZypMjyzh4WJSQ.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f370279619d9d8a1ab2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "Which of the following oxyacid of sulphur contain both $\\mathrm{S}=\\mathrm{S}$ and $\\mathrm{S}=0$ bonds?", "image": null}, "options": [{"id": "xe3VF", "text": "$\\mathrm{H}_{2} \\mathrm{~S}_{2} \\mathrm{O}_{5}$", "image": null, "isCorrect": false}, {"id": "LdY8L", "text": "$\\mathrm{H}_{2} \\mathrm{~S}_{2} \\mathrm{O}_{4}$", "image": null, "isCorrect": false}, {"id": "iMUIT", "text": "$\\mathrm{H}_{2} \\mathrm{~S}_{2} \\mathrm{O}_{2}$", "image": null, "isCorrect": false}, {"id": "W3RZ5", "text": "$\\mathrm{H}_{2} \\mathrm{~S}_{2} \\mathrm{O}_{3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Thiosulphuric acid, $\\mathrm{H}_{2} \\mathrm{~S}_{2} \\mathrm{O}_{3}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/VIO7bdW_L3aDcqmj2wfCwx2fFrR7EQigZ1nlu5O2-0g.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f200279619d9d8a19f8", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "Which of the following oxyacid of sulphur contains $\\mathrm{S}=\\mathrm{S}$ linkage?", "image": null}, "options": [{"id": "qbLnV", "text": "$\\mathrm{H}_{2} \\mathrm{~S}_{2} \\mathrm{O}_{4}$", "image": null, "isCorrect": false}, {"id": "tuyr8", "text": "$\\mathrm{H}_{2} \\mathrm{SO}_{3}$", "image": null, "isCorrect": false}, {"id": "51Wj1", "text": "$\\mathrm{H}_{2} \\mathrm{~S}_{2} \\mathrm{O}_{5}$", "image": null, "isCorrect": false}, {"id": "LGoN4", "text": "$\\mathrm{H}_{2} \\mathrm{~S}_{2} \\mathrm{O}_{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{H} 2 \\mathrm{SO} 3$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/TLHRBFQ7O_d5sUG3rLL7snGrTefdlRdm_fnV0yctI2M.original.fullsize.png\"><br>\n$\\mathrm{H} 2 \\mathrm{~S} 2 \\mathrm{O} 4$<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/ehizAYsvi0S8PHK9R5e2mFwEoUkbwk3CcuVlUsu6QK0.original.fullsize.png\"><br>\n$\\mathrm{H} 2 \\mathrm{~S} 2 \\mathrm{O} 5$<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Ylzl-sP84pl8cFbNnyKgW17ShFNIPOLM2HdqU4OHwOw.original.fullsize.png\"><br>\n$\\mathrm{H}_{2} \\mathrm{~S} 2 \\mathrm{O} 2$<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/JXfWIXv5IniIbZqbOQg2GwGDNK4F2bKp4m1IFpDT0UU.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f0f0279619d9d8a1977", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "The oxidation state of sulphur in <math><msub><mrow><mi>H</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>S</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>O</mi></mrow><mrow><mn>7</mn></mrow></msub></math> is", "image": null}, "options": [{"id": "nBzp9", "text": "+4", "image": null, "isCorrect": true}, {"id": "5fidE", "text": "+6", "image": null, "isCorrect": false}, {"id": "wynLO", "text": "+5", "image": null, "isCorrect": false}, {"id": "RENwL", "text": "+7", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Antibiotics which kill or inhibit a wide range of gram positive and gram negative bacteria are called broad spectrum antibiotics. Among the given options, penicillin is not a broad spectrum antibiotics. It is a narrow spectrum antibiotics i.e. it is effective mainly against specific families of bacteria.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f0d0279619d9d8a1964", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "The oxidation number of sulphur in <math><msub><mrow><mi>S</mi></mrow><mrow><mn>8</mn></mrow></msub></math> molecule is", "image": null}, "options": [{"id": "j55uH", "text": "6", "image": null, "isCorrect": false}, {"id": "qmMWw", "text": "0", "image": null, "isCorrect": true}, {"id": "KqUcm", "text": "2", "image": null, "isCorrect": false}, {"id": "C1vIg", "text": "3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Oxidation number of sulphur is zero in <math><msub><mrow><mi>S</mi></mrow><mrow><mn>8</mn></mrow></msub></math> molecule as it monoatomic molecule.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eaf0279619d9d8a1674", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "Which is the most stable allotrope of sulphur?", "image": null}, "options": [{"id": "1oEO9", "text": "Octahedral Sulphur", "image": null, "isCorrect": true}, {"id": "hD0Mi", "text": "Monoclinic Sulphur", "image": null, "isCorrect": false}, {"id": "VXfdm", "text": "Plastic Sulphur", "image": null, "isCorrect": false}, {"id": "WjgsJ", "text": "Colloidal Sulphur", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The most stable allotrope of sulphur is 'Octahedral Sulphur'.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a263300279619d9d8a3ccc", "title": "Halogens and Its Compounds", "totalQuestions": 64, "questions": [{"_id": "6abb88a215a9fc0fc8c1458c", "type": "singleCorrect", "question": {"text": "Which element from following exhibits anomalous behavior with remaining three members?", "image": null}, "options": [{"id": "F3pw4", "label": "A", "text": "$\\text{F}$", "isCorrect": true, "image": null}, {"id": "UBplt", "label": "B", "text": "$\\text{Cl}$", "isCorrect": false, "image": null}, {"id": "qhVC9", "label": "C", "text": "$\\text{Br}$", "isCorrect": false, "image": null}, {"id": "198F2", "label": "D", "text": "$\\text{I}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Fluorine ($\\text{F}$) is the first member of the halogen family (Group 17).<br><br>It exhibits anomalous behavior compared to the other members of the group ($\\text{Cl}$, $\\text{Br}$, $\\text{I}$) due to its exceptionally small atomic size, highest electronegativity, low $\\text{F-F}$ bond dissociation enthalpy, and the absence of vacant d-orbitals in its valence shell.<br><br>Answer: $\\text{F}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885315a9fc0fc8c1429d", "type": "singleCorrect", "question": {"text": "Which of the following halogens is never the central atom in interhalogen compounds?", "image": null}, "options": [{"id": "y2X4d", "label": "A", "text": "$F$", "isCorrect": true, "image": null}, {"id": "Bhbdy", "label": "B", "text": "$Cl$", "isCorrect": false, "image": null}, {"id": "MnBdC", "label": "C", "text": "$Br$", "isCorrect": false, "image": null}, {"id": "v8O3N", "label": "D", "text": "$I$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In interhalogen compounds of the general formula $XX'_{n}$, the central atom $X$ is always the larger and less electronegative halogen.<br><br>Fluorine is the most electronegative element in the periodic table and has the smallest atomic size among all halogens. Additionally, it lacks vacant d-orbitals in its valence shell, which prevents it from expanding its octet to form multiple bonds with other halogen atoms.<br><br>Therefore, fluorine can never act as the central atom in any interhalogen compound.<br><br>Answer: $F$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b215a9fc0fc8c14622", "type": "singleCorrect", "question": {"text": "Which of the following molecules has highest bond dissociation enthalpy?", "image": null}, "options": [{"id": "ZIRNz", "label": "A", "text": "$\\text{Cl}_2$", "isCorrect": true, "image": null}, {"id": "7LgH9", "label": "B", "text": "$\\text{F}_2$", "isCorrect": false, "image": null}, {"id": "bfwYS", "label": "C", "text": "$\\text{Br}_2$", "isCorrect": false, "image": null}, {"id": "vIJKy", "label": "D", "text": "$\\text{I}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The bond dissociation enthalpy of halogens generally decreases as the size of the atom increases down the group.<br><br>However, $\\text{F}_2$ has an exceptionally low bond dissociation enthalpy due to its small size, which leads to strong interelectronic repulsions between the lone pairs on the two fluorine atoms, weakening the $\\text{F}-\\text{F}$ bond.<br><br>The correct order of bond dissociation enthalpy for halogens is $\\text{Cl}_2 > \\text{Br}_2 > \\text{F}_2 > \\text{I}_2$.<br><br>Therefore, $\\text{Cl}_2$ has the highest bond dissociation enthalpy.<br><br>Answer: $\\text{Cl}_2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887215a9fc0fc8c143ca", "type": "singleCorrect", "question": {"text": "Identify the correct order of bond dissociation enthalpy of halogens from following.", "image": null}, "options": [{"id": "k9Ccb", "label": "A", "text": "$\\text{I-I} > \\text{Br-Br} > \\text{Cl-Cl} > \\text{F-F}$", "isCorrect": false, "image": null}, {"id": "o9Ofo", "label": "B", "text": "$\\text{Cl-Cl} > \\text{Br-Br} > \\text{F-F} > \\text{I-I}$", "isCorrect": true, "image": null}, {"id": "0WhAb", "label": "C", "text": "$\\text{I-I} > \\text{Br-Br} > \\text{Cl-Cl} > \\text{F-F}$", "isCorrect": false, "image": null}, {"id": "ZUD16", "label": "D", "text": "$\\text{Br-Br} > \\text{F-F} > \\text{I-I} > \\text{Cl-Cl}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The bond dissociation enthalpy of halogens generally decreases down the group as the atomic size increases, which leads to a longer and weaker bond.<br><br>However, the bond dissociation enthalpy of $\\text{F}_2$ is exceptionally lower than that of $\\text{Cl}_2$ and $\\text{Br}_2$. This is due to the very small size of the fluorine atom, which results in strong interelectronic repulsions between the non-bonding electrons (lone pairs) on the two closely spaced fluorine atoms.<br><br>The experimental values of bond dissociation enthalpies are:<br>$\\text{Cl-Cl} = 242.6 \\text{ kJ mol}^{-1}$<br>$\\text{Br-Br} = 192.8 \\text{ kJ mol}^{-1}$<br>$\\text{F-F} = 158.8 \\text{ kJ mol}^{-1}$<br>$\\text{I-I} = 151.1 \\text{ kJ mol}^{-1}$<br><br>Thus, the correct order of bond dissociation enthalpy is $\\text{Cl-Cl} > \\text{Br-Br} > \\text{F-F} > \\text{I-I}$.<br><br>Answer: $\\text{Cl-Cl} > \\text{Br-Br} > \\text{F-F} > \\text{I-I}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888215a9fc0fc8c14460", "type": "singleCorrect", "question": {"text": "Identify the halogen that forms only one type of oxoacid.", "image": null}, "options": [{"id": "lLS1S", "label": "A", "text": "$\\text{F}$", "isCorrect": true, "image": null}, {"id": "9VRu4", "label": "B", "text": "$\\text{Cl}$", "isCorrect": false, "image": null}, {"id": "W9uOH", "label": "C", "text": "$\\text{Br}$", "isCorrect": false, "image": null}, {"id": "ophWy", "label": "D", "text": "$\\text{I}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Fluorine forms only one oxoacid, $\\text{HOF}$ (hypofluorous acid).<br><br>This is due to its high electronegativity, small size, and the absence of d-orbitals in its valence shell, which prevents it from exhibiting higher oxidation states.<br><br>Other halogens ($\\text{Cl}$, $\\text{Br}$, $\\text{I}$) form multiple oxoacids such as hypohalous, halous, halic, and perhalic acids.<br><br>Answer: $\\text{F}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886215a9fc0fc8c14333", "type": "singleCorrect", "question": {"text": "Identify the Chlorous acid from the following.", "image": null}, "options": [{"id": "rutXx", "label": "A", "text": "$\\text{HClO}$", "isCorrect": false, "image": null}, {"id": "S1FEo", "label": "B", "text": "$\\text{HOClO}$", "isCorrect": true, "image": null}, {"id": "Sy2qg", "label": "C", "text": "$\\text{HClO}_3$", "isCorrect": false, "image": null}, {"id": "3Eb6c", "label": "D", "text": "$\\text{HClO}_4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The oxoacids of chlorine and their formulas are as follows:<br><br>Hypochlorous acid is $\\text{HClO}$ or $\\text{HOCl}$.<br><br>Chlorous acid is $\\text{HClO}_2$ or $\\text{HOClO}$.<br><br>Chloric acid is $\\text{HClO}_3$ or $\\text{HOClO}_2$.<br><br>Perchloric acid is $\\text{HClO}_4$ or $\\text{HOClO}_3$.<br><br>Therefore, chlorous acid is $\\text{HOClO}$.<br><br>Answer: $\\text{HOClO}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30b8c30a4553e1bdf94", "type": "singleCorrect", "question": {"text": "Which of the following is the correct decreasing order of bond dissociation enthalpy of halogens ?", "image": null}, "options": [{"id": "Pnl2K", "label": "A", "text": "$\\text{F}_2 > \\text{Cl}_2 > \\text{Br}_2 > \\text{I}_2$", "isCorrect": false, "image": null}, {"id": "bn4OL", "label": "B", "text": "$\\text{I}_2 > \\text{Br}_2 > \\text{Cl}_2 > \\text{F}_2$", "isCorrect": false, "image": null}, {"id": "htVUD", "label": "C", "text": "$\\text{Cl}_2 > \\text{Br}_2 > \\text{F}_2 > \\text{I}_2$", "isCorrect": true, "image": null}, {"id": "FdRth", "label": "D", "text": "$\\text{Br}_2 > \\text{I}_2 > \\text{F}_2 > \\text{Cl}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The bond dissociation enthalpy of halogens generally decreases down the group as the atomic size increases, which leads to less effective overlap of orbitals.<br><br>However, the bond dissociation enthalpy of $\\text{F}_2$ is exceptionally lower than that of $\\text{Cl}_2$ and $\\text{Br}_2$. This is due to the very small size of the fluorine atom, which results in strong interelectronic repulsions between the non-bonding electrons (lone pairs) on the two closely spaced fluorine atoms.<br><br>The experimental values of bond dissociation enthalpies are approximately:<br>$\\text{Cl}_2 = 242.6 \\text{ kJ mol}^{-1}$<br>$\\text{Br}_2 = 192.8 \\text{ kJ mol}^{-1}$<br>$\\text{F}_2 = 158.8 \\text{ kJ mol}^{-1}$<br>$\\text{I}_2 = 151.1 \\text{ kJ mol}^{-1}$<br><br>Thus, the correct decreasing order of bond dissociation enthalpy is $\\text{Cl}_2 > \\text{Br}_2 > \\text{F}_2 > \\text{I}_2$.<br><br>Answer: $\\text{Cl}_2 > \\text{Br}_2 > \\text{F}_2 > \\text{I}_2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fc8c30a4553e1bdef0", "type": "singleCorrect", "question": {"text": "Which among the following oxoacids of chlorine exhibits $+3$ oxidation state of chlorine?", "image": null}, "options": [{"id": "JYxUe", "label": "A", "text": "$\\text{HClO}$", "isCorrect": false, "image": null}, {"id": "P8XAg", "label": "B", "text": "$\\text{HClO}_2$", "isCorrect": true, "image": null}, {"id": "zSS5k", "label": "C", "text": "$\\text{HClO}_3$", "isCorrect": false, "image": null}, {"id": "JhUF7", "label": "D", "text": "$\\text{HClO}_4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the oxidation state of chlorine be $x$.<br><br>In $\\text{HClO}$:<br>$+1 + x - 2 = 0 \\Rightarrow x = +1$<br><br>In $\\text{HClO}_2$:<br>$+1 + x + 2(-2) = 0 \\Rightarrow x = +3$<br><br>In $\\text{HClO}_3$:<br>$+1 + x + 3(-2) = 0 \\Rightarrow x = +5$<br><br>In $\\text{HClO}_4$:<br>$+1 + x + 4(-2) = 0 \\Rightarrow x = +7$<br><br>Chlorine exhibits a $+3$ oxidation state in $\\text{HClO}_2$.<br><br>Answer: $\\text{HClO}_2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ee8c30a4553e1bde56", "type": "singleCorrect", "question": {"text": "What is the oxidation state of chlorine in its weakest oxoacid?", "image": null}, "options": [{"id": "bcMzY", "label": "A", "text": "$+1$", "isCorrect": true, "image": null}, {"id": "4hltK", "label": "B", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "fXF1n", "label": "C", "text": "$+3$", "isCorrect": false, "image": null}, {"id": "Yki5e", "label": "D", "text": "$-3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The oxoacids of chlorine are $HClO$, $HClO_2$, $HClO_3$, and $HClO_4$.<br><br>The acidic strength of oxoacids of a halogen increases with an increase in the oxidation number of the halogen atom. As the number of oxygen atoms increases, the electron density is pulled away from the $O-H$ bond, making it easier to release an $H^+$ ion.<br><br>The order of acidic strength is $HClO < HClO_2 < HClO_3 < HClO_4$.<br><br>Therefore, the weakest oxoacid of chlorine is hypochlorous acid, $HClO$.<br><br>Let the oxidation state of chlorine in $HClO$ be $x$.<br><br>The typical oxidation state of hydrogen is $+1$ and that of oxygen is $-2$. Since the molecule is neutral, the sum of oxidation states is zero.<br><br>$(+1) + x + (-2) = 0$<br><br>$x - 1 = 0$<br><br>$x = +1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c78c30a4553e1bdcb7", "type": "singleCorrect", "question": {"text": "Which from following compounds has lowest thermal stability?", "image": null}, "options": [{"id": "YBZZu", "label": "A", "text": "$\\text{IBr}$", "isCorrect": false, "image": null}, {"id": "wI3Ft", "label": "B", "text": "$\\text{BrCl}$", "isCorrect": false, "image": null}, {"id": "E7JgX", "label": "C", "text": "$\\text{BrF}$", "isCorrect": true, "image": null}, {"id": "MOZxX", "label": "D", "text": "$\\text{ClF}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The thermal stability of interhalogen compounds of the type $XY$ with respect to disproportionation follows the order:<br><br>$ClF > ICl > IBr > BrCl > BrF$<br><br>Bromine monofluoride ($BrF$) is highly unstable and rapidly undergoes disproportionation at room temperature to form bromine trifluoride and bromine:<br><br>$3BrF \\rightarrow BrF_3 + Br_2$<br><br>Because of its high tendency to decompose, $BrF$ has the lowest thermal stability among the given options.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e38c30a4553e1bdddc", "type": "singleCorrect", "question": {"text": "Identify weakest acid from following.", "image": null}, "options": [{"id": "UAxbi", "label": "A", "text": "Hypochlorous acid", "isCorrect": true, "image": null}, {"id": "Plzt4", "label": "B", "text": "Chlorous acid", "isCorrect": false, "image": null}, {"id": "2iSTd", "label": "C", "text": "Chloric acid", "isCorrect": false, "image": null}, {"id": "tk7kr", "label": "D", "text": "Perchloric acid", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given acids are oxoacids of chlorine.<br><br>The chemical formulas and oxidation states of chlorine in these acids are:<br>Hypochlorous acid: $HClO$ (Oxidation state of $Cl = +1$)<br>Chlorous acid: $HClO_2$ (Oxidation state of $Cl = +3$)<br>Chloric acid: $HClO_3$ (Oxidation state of $Cl = +5$)<br>Perchloric acid: $HClO_4$ (Oxidation state of $Cl = +7$)<br><br>The acidic strength of oxoacids of the same halogen increases with an increase in the oxidation number of the halogen atom. This is because a higher oxidation state of the central atom leads to greater polarization of the $O-H$ bond, making it easier to release an $H^+$ ion. Alternatively, the stability of the conjugate base increases with the number of oxygen atoms due to greater resonance stabilization.<br><br>Thus, the order of acidic strength is $HClO < HClO_2 < HClO_3 < HClO_4$.<br><br>Hypochlorous acid is the weakest acid among the given options.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36f8c30a4553e1be3b7", "type": "singleCorrect", "question": {"text": "Which of the following is the correct decreasing order of oxidizing power of perhalate ions?", "image": null}, "options": [{"id": "qLofT", "label": "A", "text": "$\\text{BrO}_4^- < \\text{IO}_4^- < \\text{ClO}_4^-$", "isCorrect": false, "image": null}, {"id": "fwo0i", "label": "B", "text": "$\\text{IO}_4^- > \\text{BrO}_4^- > \\text{ClO}_4^-$", "isCorrect": false, "image": null}, {"id": "Q2q6n", "label": "C", "text": "$\\text{IO}_4^- < \\text{BrO}_4^- < \\text{ClO}_4^-$", "isCorrect": false, "image": null}, {"id": "HDVbE", "label": "D", "text": "$\\text{BrO}_4^- > \\text{IO}_4^- > \\text{ClO}_4^-$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The oxidizing power of perhalate ions depends on their standard reduction potentials. A higher positive standard reduction potential indicates a stronger oxidizing agent.<br><br>The standard reduction potentials ($E^{\\circ}$) for the reduction of perhalate ions to halate ions in acidic medium are:<br>$E^{\\circ}(\\text{BrO}_4^- / \\text{BrO}_3^-) = +1.74\\text{ V}$<br>$E^{\\circ}(\\text{IO}_4^- / \\text{IO}_3^-) = +1.65\\text{ V}$<br>$E^{\\circ}(\\text{ClO}_4^- / \\text{ClO}_3^-) = +1.20\\text{ V}$<br><br>Since the reduction potential is highest for $\\text{BrO}_4^-$ and lowest for $\\text{ClO}_4^-$, the decreasing order of oxidizing power is $\\text{BrO}_4^- > \\text{IO}_4^- > \\text{ClO}_4^-$.<br><br>The exceptionally high oxidizing power of $\\text{BrO}_4^-$ is due to the relative instability of the $+7$ oxidation state of bromine, which arises from the poor shielding of the $3d$ electrons (d-block contraction or middle row anomaly).<br><br>Answer: $\\text{BrO}_4^- > \\text{IO}_4^- > \\text{ClO}_4^-$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b88c30a4553e1bdc19", "type": "singleCorrect", "question": {"text": "Which of the following is not characteristics of interhalogen compounds?", "image": null}, "options": [{"id": "AHKLa", "label": "A", "text": "Covalent nature", "isCorrect": false, "image": null}, {"id": "XbTz6", "label": "B", "text": "Volatile but not explosive", "isCorrect": false, "image": null}, {"id": "vk7A9", "label": "C", "text": "Form addition products with unsaturated hydrocarbons.", "isCorrect": false, "image": null}, {"id": "xZScG", "label": "D", "text": "Behave as strong reducing agent.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Interhalogen compounds are formed by the combination of two different halogens. They are covalent in nature due to the small electronegativity difference between the halogen atoms.<br><br>They are generally volatile solids or liquids (except $ClF$, which is a gas) and are not explosive.<br><br>They are highly reactive and form addition products with unsaturated hydrocarbons.<br><br>Because halogens are highly electronegative, interhalogen compounds have a strong tendency to accept electrons. Therefore, they act as strong oxidizing agents, not reducing agents.<br><br>Answer: Behave as strong reducing agent.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bffbf9280d7f9932e59", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following halogens does always show oxidation state -1 ?", "image": null}, "options": [{"id": "6vW3J", "text": "Cl", "image": null, "isCorrect": false}, {"id": "Zl1K0", "text": "F", "image": null, "isCorrect": true}, {"id": "49A5C", "text": "Br", "image": null, "isCorrect": false}, {"id": "za30E", "text": "I", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Fluorine is the most electronegative element in the periodic table and lacks vacant d-orbitals in its valence shell.<br><br>Due to its high electronegativity and absence of d-orbitals, it cannot expand its octet and always exhibits an oxidation state of -1 in all its compounds.<br><br>Other halogens like chlorine, bromine, and iodine have vacant d-orbitals and are less electronegative than fluorine and oxygen, allowing them to show variable positive oxidation states such as +1, +3, +5, and +7.<br><br>Answer: F", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bccbf9280d7f9932c85", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is the number of oxygen atoms bonded to chlorine in its strongest oxoacid?", "image": null}, "options": [{"id": "FLuZu", "text": "1", "image": null, "isCorrect": false}, {"id": "b0Xno", "text": "2", "image": null, "isCorrect": false}, {"id": "RII2z", "text": "3", "image": null, "isCorrect": false}, {"id": "PgDy3", "text": "4", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The oxoacids of chlorine are $HClO$, $HClO_2$, $HClO_3$, and $HClO_4$.<br><br>The acidic strength of oxoacids increases with an increase in the oxidation state of the central halogen atom. The oxidation states of chlorine in $HClO$, $HClO_2$, $HClO_3$, and $HClO_4$ are $+1$, $+3$, $+5$, and $+7$ respectively.<br><br>Thus, the strongest oxoacid of chlorine is perchloric acid ($HClO_4$).<br><br>In the structure of $HClO_4$, the central chlorine atom is $sp^3$ hybridized and is bonded to four oxygen atoms (three oxygen atoms via double bonds and one oxygen atom via a single bond which is further attached to a hydrogen atom).<br><br>Therefore, the number of oxygen atoms bonded to chlorine in its strongest oxoacid is $4$.<br><br>Answer: 4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba8bf9280d7f9932b55", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is existing oxoacid of fluorine?", "image": null}, "options": [{"id": "YGfi2", "text": "HOF", "image": null, "isCorrect": true}, {"id": "OxbZ0", "text": "$\\mathrm{HFO}_2$", "image": null, "isCorrect": false}, {"id": "I3hAG", "text": "$\\mathrm{HFO}_3$", "image": null, "isCorrect": false}, {"id": "O6hL3", "text": "$\\mathrm{HFO}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Fluorine is the most electronegative element and has a small atomic size. It does not have vacant d-orbitals in its valence shell, so it cannot expand its octet to exhibit higher positive oxidation states such as $+3$, $+5$, or $+7$.<br><br>Because of this, fluorine forms only one oxoacid, which is hypofluorous acid ($\\mathrm{HOF}$). In contrast, other halogens can form multiple oxoacids like $\\mathrm{HOX}$, $\\mathrm{HXO}_2$, $\\mathrm{HXO}_3$, and $\\mathrm{HXO}_4$.<br><br>Thus, the only existing oxoacid of fluorine is $\\mathrm{HOF}$.<br><br>Answer: HOF", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9bbf9280d7f9932ad0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is shape of interhalogen compound so that central halogen exhibits +3 oxidation state?", "image": null}, "options": [{"id": "VmjBO", "text": "Tetrahedral", "image": null, "isCorrect": false}, {"id": "KkWEr", "text": "Bent ' $T$ ' shape", "image": null, "isCorrect": true}, {"id": "hy39C", "text": "Square pyramidal", "image": null, "isCorrect": false}, {"id": "RLrZN", "text": "Square planer", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Interhalogen compounds with the central halogen in a $+3$ oxidation state have the general formula $XX'_3$ (e.g., $ClF_3$, $BrF_3$).<br><br>The central halogen atom $X$ has $7$ valence electrons. In $XX'_3$, it forms $3$ single bonds with the surrounding $X'$ atoms, utilizing $3$ electrons. The remaining $4$ valence electrons form $2$ lone pairs.<br><br>Total number of electron pairs around the central atom = $3$ bond pairs + $2$ lone pairs = $5$.<br><br>The hybridization of the central atom is $sp^3d$, which corresponds to a trigonal bipyramidal electron geometry.<br><br>According to VSEPR theory, to minimize repulsion, the two lone pairs occupy the equatorial positions. The three bond pairs occupy the remaining two axial positions and one equatorial position.<br><br>This arrangement results in a bent 'T' shape for the molecule.<br><br>Answer: Bent ' $T$ ' shape", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b99bf9280d7f9932ab9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following interhalogen compounds in liquid state at room temperature?", "image": null}, "options": [{"id": "NBV58", "text": "ICl", "image": null, "isCorrect": false}, {"id": "j4ZGB", "text": "$\\mathrm{ClF}_3$", "image": null, "isCorrect": false}, {"id": "FCIjh", "text": "$\\mathrm{BrF}_5$", "image": null, "isCorrect": true}, {"id": "GyK5u", "text": "$\\mathrm{IF}_7$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The physical states of the given interhalogen compounds at room temperature are as follows:<br><br>$\\mathrm{ICl}$ is a ruby red solid.<br><br>$\\mathrm{ClF}_3$ is a colorless gas.<br><br>$\\mathrm{BrF}_5$ is a colorless liquid.<br><br>$\\mathrm{IF}_7$ is a colorless gas.<br><br>Therefore, $\\mathrm{BrF}_5$ is in the liquid state at room temperature.<br><br>Answer: $\\mathrm{BrF}_5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7cbf9280d7f99329ab", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following halogen forms maximum number of oxoacids?", "image": null}, "options": [{"id": "UVbwq", "text": "$F$", "image": null, "isCorrect": false}, {"id": "mmXUc", "text": "Cl", "image": null, "isCorrect": true}, {"id": "klnOE", "text": "Br", "image": null, "isCorrect": false}, {"id": "uLw8H", "text": "I", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Fluorine forms only one oxoacid, $HOF$ (hypofluorous acid).<br><br>Chlorine forms four oxoacids: $HOCl$ (hypochlorous acid), $HOClO$ (chlorous acid), $HOClO_2$ (chloric acid), and $HOClO_3$ (perchloric acid).<br><br>Bromine forms three oxoacids: $HOBr$ (hypobromous acid), $HOBrO_2$ (bromic acid), and $HOBrO_3$ (perbromic acid).<br><br>Iodine forms three oxoacids: $HOI$ (hypoiodous acid), $HOIO_2$ (iodic acid), and $HOIO_3$ (periodic acid).<br><br>Therefore, chlorine forms the maximum number of oxoacids.<br><br>Answer: Cl", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7bbf9280d7f99329a2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is the molecular formula of halous acid of chlorine?", "image": null}, "options": [{"id": "hdXzq", "text": "HClO", "image": null, "isCorrect": false}, {"id": "LuaYk", "text": "$\\mathrm{HClO}_2$", "image": null, "isCorrect": true}, {"id": "xIKOQ", "text": "$\\mathrm{HClO}_3$", "image": null, "isCorrect": false}, {"id": "koLOY", "text": "$\\mathrm{HClO}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The oxoacids of chlorine are classified based on the oxidation state of chlorine.<br><br>Hypochlorous acid (hypohalous acid): $\\mathrm{HClO}$ (oxidation state $+1$)<br><br>Chlorous acid (halous acid): $\\mathrm{HClO}_2$ (oxidation state $+3$)<br><br>Chloric acid (halic acid): $\\mathrm{HClO}_3$ (oxidation state $+5$)<br><br>Perchloric acid (perhalic acid): $\\mathrm{HClO}_4$ (oxidation state $+7$)<br><br>The halous acid of chlorine is chlorous acid, which has the molecular formula $\\mathrm{HClO}_2$.<br><br>Answer: $\\mathrm{HClO}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4abf9280d7f99327eb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following statements is false about interhalogen compounds?", "image": null}, "options": [{"id": "8U5bn", "text": "They are covalent in nature.", "image": null, "isCorrect": false}, {"id": "8eepp", "text": "They are diamagnetic.", "image": null, "isCorrect": false}, {"id": "QloiM", "text": "They are more reactive than halogens.", "image": null, "isCorrect": false}, {"id": "ThXKt", "text": "If these are represented as $\\mathrm{XX}^1$, number of $\\mathrm{X}^1$ atoms is always even .", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Interhalogen compounds are formed by the combination of two different halogens. They are covalent in nature because they are formed by the sharing of electrons.<br><br>They are diamagnetic because all their electrons are paired.<br><br>They are generally more reactive than halogens (except fluorine) because the $X-X'$ bond is weaker than the $X-X$ bond in pure halogens.<br><br>The general formula of interhalogen compounds is $XX'_{n}$, where $n = 1, 3, 5, 7$. Thus, the number of $X'$ atoms is always odd, not even.<br><br>Therefore, the statement that the number of $X'$ atoms is always even is false.<br><br>Answer: If these are represented as $\\mathrm{XX}^1$, number of $\\mathrm{X}^1$ atoms is always even .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b39bf9280d7f993273e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the correct decreasing order of boiling point for hydrides of halogens.", "image": null}, "options": [{"id": "xJ2KG", "text": "$\\mathrm{HF}>\\mathrm{HCl}>\\mathrm{HBr}>\\mathrm{HI}$", "image": null, "isCorrect": false}, {"id": "GhfrV", "text": "$\\mathrm{HI}>\\mathrm{HBr}>\\mathrm{HCl}>\\mathrm{HF}$", "image": null, "isCorrect": false}, {"id": "aOHO7", "text": "$\\mathrm{HF}>\\mathrm{HI}>\\mathrm{HBr}>\\mathrm{HCl}$", "image": null, "isCorrect": true}, {"id": "y1FNJ", "text": "$\\mathrm{HI}>\\mathrm{HF}>\\mathrm{HBr}>\\mathrm{HCl}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The boiling point of hydrogen halides generally increases from $\\mathrm{HCl}$ to $\\mathrm{HI}$ due to an increase in the size of the halogen atom, which leads to stronger van der Waals forces of attraction.<br><br>However, $\\mathrm{HF}$ has an exceptionally high boiling point due to the presence of strong intermolecular hydrogen bonding between its molecules.<br><br>The boiling points of the hydrogen halides are approximately:<br>$\\mathrm{HF} \\approx 293 \\text{ K}$<br>$\\mathrm{HCl} \\approx 189 \\text{ K}$<br>$\\mathrm{HBr} \\approx 206 \\text{ K}$<br>$\\mathrm{HI} \\approx 238 \\text{ K}$<br><br>Therefore, the correct decreasing order of boiling points is $\\mathrm{HF} > \\mathrm{HI} > \\mathrm{HBr} > \\mathrm{HCl}$.<br><br>Answer: $\\mathrm{HF}>\\mathrm{HI}>\\mathrm{HBr}>\\mathrm{HCl}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b25bf9280d7f99326a4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify false statement from the following about fluorine.", "image": null}, "options": [{"id": "nKpqi", "text": "It is highly electronegative element.", "image": null, "isCorrect": false}, {"id": "KCE2O", "text": "It exhibits only -1 oxidation state.", "image": null, "isCorrect": false}, {"id": "ZGCYE", "text": "It has high bond dissociation enthalpy among all halogens.", "image": null, "isCorrect": true}, {"id": "mAnSY", "text": "It form only one oxoacid.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Fluorine is the most electronegative element in the periodic table.<br><br>Due to its high electronegativity and absence of d-orbitals, it exhibits only a $-1$ oxidation state in its compounds.<br><br>Fluorine forms only one oxoacid, which is hypofluorous acid (HOF).<br><br>The bond dissociation enthalpy of the $F-F$ bond is anomalously low, being lower than that of $Cl-Cl$ and $Br-Br$. This is due to the strong interelectronic repulsions between the lone pairs of electrons on the small fluorine atoms. The order of bond dissociation enthalpy is $Cl_2 > Br_2 > F_2 > I_2$.<br><br>Thus, the statement that fluorine has a high bond dissociation enthalpy among all halogens is false.<br><br>Answer: It has high bond dissociation enthalpy among all halogens.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214470aee93fa0796df66", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Identify the reactivity order for halogens towards alkanes.", "image": null}, "options": [{"id": "ckMzN", "text": "$\\mathrm{I}_2\\gt\\mathrm{Br}_2\\gt\\mathrm{Cl}_2\\gt\\mathrm{F}_2$", "image": null, "isCorrect": false}, {"id": "cYuvK", "text": "$\\mathrm{Br}_2\\gt\\mathrm{Cl}_2\\gt\\mathrm{F}_2\\gt\\mathrm{I}_2$", "image": null, "isCorrect": false}, {"id": "5WQqW", "text": "$\\mathrm{F}_2\\gt\\mathrm{Cl}_2\\gt\\mathrm{Br}_2\\gt\\mathrm{I}_2$", "image": null, "isCorrect": true}, {"id": "rswWL", "text": "$\\mathrm{Cl}_2\\gt\\mathrm{F}_2\\gt\\mathrm{Br}_2\\gt\\mathrm{I}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The halogenation of alkanes proceeds via a free radical substitution mechanism.<br><br>The reactivity of halogens towards alkanes depends on the activation energy of the propagation steps, which increases down the group.<br><br>Fluorine reacts explosively with alkanes even in the dark because the reaction is highly exothermic with very low activation energy.<br><br>Chlorine reacts readily in the presence of UV light or heat.<br><br>Bromine reacts less readily than chlorine and requires higher temperatures or stronger illumination.<br><br>Iodine is the least reactive, and its reaction with alkanes is very slow and reversible.<br><br>Therefore, the decreasing order of reactivity of halogens towards alkanes is $\\mathrm{F}_2 \\gt \\mathrm{Cl}_2 \\gt \\mathrm{Br}_2 \\gt \\mathrm{I}_2$.<br><br>Answer: $\\mathrm{F}_2\\gt\\mathrm{Cl}_2\\gt\\mathrm{Br}_2\\gt\\mathrm{I}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214320aee93fa0796debd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Which from following compounds is NOT in gaseous phase at $25^{\\circ} \\mathrm{C}$ ?", "image": null}, "options": [{"id": "jVYwn", "text": "ClF", "image": null, "isCorrect": false}, {"id": "LtCDm", "text": "BrF", "image": null, "isCorrect": false}, {"id": "PPtMT", "text": "$\\quad \\mathrm{IF}_3$", "image": null, "isCorrect": true}, {"id": "xCv2F", "text": "$\\mathrm{ClF}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At $25^{\\circ} \\mathrm{C}$ (room temperature), the physical states of the given interhalogen compounds are as follows:<br><br>$\\mathrm{ClF}$ is a colorless gas.<br><br>$\\mathrm{BrF}$ is a pale brown gas.<br><br>$\\mathrm{ClF}_3$ is a colorless gas.<br><br>$\\mathrm{IF}_3$ is a yellow solid.<br><br>Therefore, $\\mathrm{IF}_3$ is not in the gaseous phase at $25^{\\circ} \\mathrm{C}$.<br><br>Answer: $\\quad \\mathrm{IF}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214240aee93fa0796de51", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Which element from following combines with hydrogen to form a compound with lowest thermal stability?", "image": null}, "options": [{"id": "Ukllj", "text": "F", "image": null, "isCorrect": false}, {"id": "R5lOd", "text": "Cl", "image": null, "isCorrect": false}, {"id": "fDQSH", "text": "I", "image": null, "isCorrect": true}, {"id": "CetQ4", "text": "Br", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given elements are halogens (Group 17). They combine with hydrogen to form hydrogen halides (HX).<br><br>As we move down the group from F to I, the atomic size of the halogen increases.<br><br>This results in an increase in the H-X bond length and a corresponding decrease in the H-X bond dissociation enthalpy.<br><br>Consequently, the thermal stability of hydrogen halides decreases down the group in the order: HF > HCl > HBr > HI.<br><br>Therefore, iodine (I) forms the compound with the lowest thermal stability (HI).<br><br>Answer: I", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213860aee93fa0796d975", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Which from following compounds is NOT in solid state at $25^{\\circ} \\mathrm{C}$ ?", "image": null}, "options": [{"id": "4ACQ8", "text": "ICI", "image": null, "isCorrect": false}, {"id": "7U59h", "text": "IBr", "image": null, "isCorrect": false}, {"id": "wqnV3", "text": "$\\mathrm{IF}_3$", "image": null, "isCorrect": false}, {"id": "tHk6X", "text": "$\\mathrm{IF}_5$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Based on the physical properties of interhalogen compounds at $298 \\text{ K}$ ($25^{\\circ} \\text{C}$):<br><br>$\\text{ICl}$ exists as a ruby red solid ($\\alpha$-form) or brown red solid ($\\beta$-form).<br><br>$\\text{IBr}$ exists as a black solid.<br><br>$\\text{IF}_3$ exists as a yellow powder (solid).<br><br>$\\text{IF}_5$ exists as a colourless liquid.<br><br>Therefore, $\\text{IF}_5$ is not in the solid state at $25^{\\circ} \\text{C}$.<br><br>Answer: $\\mathrm{IF}_5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213780aee93fa0796d908", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which of the following is correct decreasing order of boiling point of compounds?", "image": null}, "options": [{"id": "mTwet", "text": "$\\mathrm{CH}_3 \\mathrm{Cl}\\gt\\mathrm{CH}_3 \\mathrm{Br}\\gt\\mathrm{CH}_2 \\mathrm{Br}_2\\gt\\mathrm{CHBr}_3$", "image": null, "isCorrect": false}, {"id": "0vOni", "text": "$\\mathrm{CH}_3 \\mathrm{Br}\\gt\\mathrm{CH}_2 \\mathrm{Br}_2\\gt\\mathrm{CHBr}_3\\gt\\mathrm{CH}_3 \\mathrm{Cl}$", "image": null, "isCorrect": false}, {"id": "xVOMr", "text": "$\\mathrm{CHBr}_3\\gt\\mathrm{CH}_2 \\mathrm{Br}_2\\gt\\mathrm{CH}_3 \\mathrm{Br}\\gt\\mathrm{CH}_3 \\mathrm{Cl}$", "image": null, "isCorrect": true}, {"id": "fumfi", "text": "$\\mathrm{CH}_3 \\mathrm{Br}\\gt\\mathrm{CH}_3 \\mathrm{Cl}\\gt\\mathrm{CHBr}_3\\gt\\mathrm{CH}_2 \\mathrm{Br}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The boiling point of haloalkanes increases with an increase in the molecular mass and the size of the halogen atom due to stronger van der Waals forces of attraction.<br><br>As the number of halogen atoms increases, the molecular mass and surface area increase, leading to higher boiling points.<br><br>Comparing the given compounds, the molecular masses are in the order: $\\mathrm{CH}_3\\mathrm{Cl} < \\mathrm{CH}_3\\mathrm{Br} < \\mathrm{CH}_2\\mathrm{Br}_2 < \\mathrm{CHBr}_3$.<br><br>Therefore, the correct decreasing order of boiling points is $\\mathrm{CHBr}_3 \\gt \\mathrm{CH}_2\\mathrm{Br}_2 \\gt \\mathrm{CH}_3\\mathrm{Br} \\gt \\mathrm{CH}_3\\mathrm{Cl}$.<br><br>Answer: $\\mathrm{CHBr}_3\\gt\\mathrm{CH}_2 \\mathrm{Br}_2\\gt\\mathrm{CH}_3 \\mathrm{Br}\\gt\\mathrm{CH}_3 \\mathrm{Cl}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213600aee93fa0796d84b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Identify the correct decreasing order of thermal stability from following.\r\n[Note: The question has been modified to get the correct answer.]", "image": null}, "options": [{"id": "34p0M", "text": "$\\mathrm{ClF}\\gt\\mathrm{ICl}\\gt\\mathrm{IBr}\\gt\\mathrm{BrCl}$", "image": null, "isCorrect": true}, {"id": "ZKddN", "text": "$\\mathrm{BrCl}\\gt\\mathrm{IBr}\\gt\\mathrm{ICl}\\gt\\mathrm{ClF}$", "image": null, "isCorrect": false}, {"id": "b4HNW", "text": "$\\mathrm{ClF}\\gt\\mathrm{IBr}\\gt\\mathrm{BrCl}\\gt\\mathrm{ICl}$", "image": null, "isCorrect": false}, {"id": "zP1fP", "text": "$\\mathrm{ClF}\\gt\\mathrm{BrCl}\\gt\\mathrm{IBr}\\gt\\mathrm{ClF}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The thermal stability of interhalogen compounds is directly proportional to the electronegativity difference ($\\Delta EN$) between the two halogen atoms. A greater electronegativity difference leads to a more polar and stronger bond, which increases thermal stability.<br><br>The approximate electronegativity values of halogens on the Pauling scale are:<br>$\\mathrm{F} = 4.0$<br>$\\mathrm{Cl} = 3.0$<br>$\\mathrm{Br} = 2.8$<br>$\\mathrm{I} = 2.5$<br><br>Calculating the electronegativity difference ($\\Delta EN$) for the given compounds:<br>$\\mathrm{ClF}$: $\\Delta EN = 4.0 - 3.0 = 1.0$<br>$\\mathrm{ICl}$: $\\Delta EN = 3.0 - 2.5 = 0.5$<br>$\\mathrm{IBr}$: $\\Delta EN = 2.8 - 2.5 = 0.3$<br>$\\mathrm{BrCl}$: $\\Delta EN = 3.0 - 2.8 = 0.2$<br><br>Since thermal stability increases with the electronegativity difference, the correct decreasing order of thermal stability is:<br>$\\mathrm{ClF} \\gt \\mathrm{ICl} \\gt \\mathrm{IBr} \\gt \\mathrm{BrCl}$<br><br>Answer: $\\mathrm{ClF}\\gt\\mathrm{ICl}\\gt\\mathrm{IBr}\\gt\\mathrm{BrCl}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133a0aee93fa0796d722", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Which of the following compounds contains chlorine in +5 oxidation state?", "image": null}, "options": [{"id": "qDKto", "text": "$\\mathrm{HClO}_4$", "image": null, "isCorrect": false}, {"id": "qPtAT", "text": "$\\mathrm{HClO}_2$", "image": null, "isCorrect": false}, {"id": "vQx5S", "text": "$\\mathrm{HClO}_3$", "image": null, "isCorrect": true}, {"id": "gaPAS", "text": "HCl", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the oxidation state of chlorine be $x$.<br><br>In $\\mathrm{HClO}_4$:<br>$+1 + x + 4(-2) = 0 \\Rightarrow x = +7$<br><br>In $\\mathrm{HClO}_2$:<br>$+1 + x + 2(-2) = 0 \\Rightarrow x = +3$<br><br>In $\\mathrm{HClO}_3$:<br>$+1 + x + 3(-2) = 0 \\Rightarrow x = +5$<br><br>In $\\mathrm{HCl}$:<br>$+1 + x = 0 \\Rightarrow x = -1$<br><br>Therefore, $\\mathrm{HClO}_3$ contains chlorine in the $+5$ oxidation state.<br><br>Answer: $\\mathrm{HClO}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213390aee93fa0796d71d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Identify a compound having highest thermal stability.", "image": null}, "options": [{"id": "6Tekd", "text": "ICl", "image": null, "isCorrect": false}, {"id": "Qtin8", "text": "BrCl", "image": null, "isCorrect": false}, {"id": "86ndm", "text": "BrF", "image": null, "isCorrect": false}, {"id": "gDWzi", "text": "ClF", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The thermal stability of interhalogen compounds depends on the bond dissociation enthalpy of the $X-X'$ bond.<br><br>Bond dissociation enthalpy is inversely proportional to the bond length, which in turn depends on the size of the bonded atoms.<br><br>The order of atomic size for halogens is $\\text{F} < \\text{Cl} < \\text{Br} < \\text{I}$.<br><br>Among the given options, the compound with the smallest constituent atoms will have the shortest bond length and the strongest bond.<br><br>The sizes of the atoms in $\\text{ClF}$ are the smallest compared to the atoms in $\\text{ICl}$, $\\text{BrCl}$, and $\\text{BrF}$.<br><br>Thus, the $\\text{Cl}-\\text{F}$ bond is the shortest and strongest, leading to the highest bond dissociation enthalpy.<br><br>Therefore, $\\text{ClF}$ has the highest thermal stability.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213390aee93fa0796d71a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "What is the number of moles of sulfur atoms present in n mole molecules of mustard gas?", "image": null}, "options": [{"id": "F1vxm", "text": "n", "image": null, "isCorrect": true}, {"id": "lalOo", "text": "3 n", "image": null, "isCorrect": false}, {"id": "VETuK", "text": "2 n", "image": null, "isCorrect": false}, {"id": "Fp3Fl", "text": "4 n", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical formula of mustard gas (sulfur mustard) is $C_4H_8Cl_2S$.<br><br>One molecule of mustard gas contains exactly one sulfur atom.<br><br>Therefore, one mole of mustard gas molecules contains one mole of sulfur atoms.<br><br>For $n$ moles of mustard gas molecules, the number of moles of sulfur atoms present is $n \\times 1 = n$.<br><br>Answer: n", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262580279619d9d8a33c6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Which element from following does NOT belong to chalcogen family?", "image": null}, "options": [{"id": "FmLhJ", "text": "At", "image": null, "isCorrect": true}, {"id": "Ajnl9", "text": "$\\mathrm{Po}$", "image": null, "isCorrect": false}, {"id": "Dv27A", "text": "$\\mathrm{Se}$", "image": null, "isCorrect": false}, {"id": "WSVod", "text": "$\\mathrm{Te}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Astatine (At) belongs to halogen family.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262130279619d9d8a3196", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "Identify weakest halogen acid from following.", "image": null}, "options": [{"id": "xhIrD", "text": "$\\mathrm{HCl}$", "image": null, "isCorrect": false}, {"id": "zXB6E", "text": "$\\mathrm{HI}$", "image": null, "isCorrect": false}, {"id": "aaRnf", "text": "HF", "image": null, "isCorrect": true}, {"id": "J8Y1v", "text": "$\\mathrm{HBr}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Acidic strength of halogen acids increases in the order : $\\mathrm{HF} < \\mathrm{HCl} < \\mathrm{HBr} < \\mathrm{HI}$\nHence, the weakest halogen acid is HF.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d80279619d9d8a2fcd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "Identify strongest oxoacid of halogen from following.", "image": null}, "options": [{"id": "VAWxj", "text": "Hypochlorous acid", "image": null, "isCorrect": false}, {"id": "pUz3s", "text": "Chlorous acid", "image": null, "isCorrect": false}, {"id": "mnQyh", "text": "Chloric acid", "image": null, "isCorrect": false}, {"id": "YEvZS", "text": "Perchloric acid", "image": null, "isCorrect": true l, "isCorrect": false}, {"id": "Te7NV", "text": "Br", "image": null, "isCorrect": false}, {"id": "WGoR1", "text": "F", "image": null, "isCorrect": true}, {"id": "yC2i7", "text": "I", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Down the group the electronegativity decreases and the size increases. Thus, it becomes easy to lose $\\mathrm{H}^{+}$ion. This causes the increase in acidic strength down the group.\nAcidic strength order: $\\mathrm{HF} < \\mathrm{HCl} < \\mathrm{HBr} < \\mathrm{HI}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260870279619d9d8a2539", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "Which among the following compounds is NOT a colourless gas?", "image": null}, "options": [{"id": "MIVzd", "text": "CIF", "image": null, "isCorrect": false}, {"id": "QVMtr", "text": "$\\mathrm{IF}_7$", "image": null, "isCorrect": false}, {"id": "yuQig", "text": "$\\mathrm{IF}_3$", "image": null, "isCorrect": true}, {"id": "G0DWC", "text": "$\\mathrm{CIF}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Iodine trifluoride is an interhalogen compound with the chemical formula IF3. It is a yellow compound", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c5 raft pulp.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb90279619d9d8a1ec0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "Which among the following pairs of halogen forms the interhalogen compound of the type $\\mathrm{XX}_{7}^{\\prime}$ ?", "image": null}, "options": [{"id": "her3v", "text": "Br and $\\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "DMZQP", "text": "Cl and $\\mathrm{F}$", "image": null, "isCorrect": false}, {"id": "O79Rg", "text": "I and F", "image": null, "isCorrect": true}, {"id": "EpK5L", "text": "I and Cl", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "I and F\nThe interhalogen compound of type $\\mathrm{XX}_{7}^{\\prime}$, iodine heptafluoride with the chemical formula $\\mathrm{IF}_{7}$, is made up of the halogen pairs iodine (I) and fluorine (F).\nVSEPR theory predicts that it has an unusual pentagonal bipyramidal structure.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/BN4Ltt0BCVpDZkSgDGbMUDR_AqIjHIvN88qWzgyKb2k.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)
