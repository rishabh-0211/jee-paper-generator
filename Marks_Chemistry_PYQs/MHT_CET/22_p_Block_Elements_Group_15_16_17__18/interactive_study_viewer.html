>O</mtext></mrow><mrow><mn>4</mn></mrow></msub><mo>)</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mn>3</mn><mo stretchy=\"false\">(</mo><mo>+</mo><mn>1</mn><mo stretchy=\"false\">)</mo><mo>+</mo><mtext>x</mtext><mo>+</mo><mn>2</mn><mo stretchy=\"false\">(</mo><mo>−</mo><mn>2</mn><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0</mn> </mrow> </math><br /><math> <mrow> <mtext>x</mtext><mo>=</mo><mo>+</mo><mn>1</mn> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263300279619d9d8a3cd1", "title": "Oxygen and Its Compounds", "totalQuestions": 17, "questions": [{"_id": "6abb884315a9fc0fc8c14208", "type": "singleCorrect", "question": {"text": "Which of the following factors is responsible for the anomalous behavior of oxygen?<br>(A). small atomic size.<br>(B). higher electronegativity.<br>(C). low O - O bond dissociation energy.<br>(D). absence of d - orbital<br>(E). presence of vaccant d - orbitals.<br>Choose the <strong>correct</strong> answer from the options given below:", "image": null}, "options": [{"id": "JVZ9E", "label": "A", "text": "(A), (B), (C) and (E) only.", "isCorrect": false, "image": null}, {"id": "aMZtt", "label": "B", "text": "(A), (B) and (D) only.", "isCorrect": true, "image": null}, {"id": "P1W9k", "label": "C", "text": "(A), (B), (C) and (D).", "isCorrect": false, "image": null}, {"id": "Mmv8s", "label": "D", "text": "(B), (C) and (D) only.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The anomalous behaviour of oxygen compared to other members of group 16 is primarily due to the following factors:<br><br>1. Small atomic size.<br>2. High electronegativity.<br>3. Absence of d-orbitals in its valence shell.<br><br>These fundamental factors lead to unique properties such as the ability to form strong $p\\pi-p\\pi$ multiple bonds, the presence of hydrogen bonding in its compounds (like $H_2O$), and the restriction of its maximum covalency to four.<br><br>The low $O-O$ single bond dissociation energy is a consequence of its small size (due to high interelectronic repulsions between lone pairs), rather than a primary cause of its anomalous behaviour.<br><br>Therefore, the correct factors are (A), (B), and (D).<br><br>Answer: (A), (B) and (D) only.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f08c30a4553e1bde6d", "type": "singleCorrect", "question": {"text": "Which of the following reactions exhibits the reducing property of ozone ?", "image": null}, "options": [{"id": "lXfAP", "label": "A", "text": "$\\text{NO}\\text{(g)} + \\text{O}_3\\text{(g)} \\longrightarrow \\text{NO}_2\\text{(g)} + \\text{O}_2\\text{(g)}$", "isCorrect": false, "image": null}, {"id": "XNAPU", "label": "B", "text": "$2\\text{KI}\\text{(aq)} + \\text{H}_2\\text{O}\\text{(l)} + \\text{O}_3\\text{(g)} \\longrightarrow 2\\text{KOH}\\text{(aq)} + \\text{I}_2\\text{(g)} + \\text{O}_2\\text{(g)}$", "isCorrect": false, "image": null}, {"id": "ARm2i", "label": "C", "text": "$\\text{H}_2\\text{O}_2\\text{(l)} + \\text{O}_3\\text{(g)} \\longrightarrow \\text{H}_2\\text{O}\\text{(l)} + 2\\text{O}_2\\text{(g)}$", "isCorrect": true, "image": null}, {"id": "goK2G", "label": "D", "text": "$\\text{PbS}\\text{(s)} + 4\\text{O}_3\\text{(g)} \\longrightarrow \\text{PbSO}_4\\text{(s)} + 4\\text{O}_2\\text{(g)}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In the reaction $\\text{NO}\\text{(g)} + \\text{O}_3\\text{(g)} \\longrightarrow \\text{NO}_2\\text{(g)} + \\text{O}_2\\text{(g)}$, nitrogen is oxidized from $+2$ to $+4$. $\\text{O}_3$ acts as an oxidizing agent.<br><br>In the reaction $2\\text{KI}\\text{(aq)} + \\text{H}_2\\text{O}\\text{(l)} + \\text{O}_3\\text{(g)} \\longrightarrow 2\\text{KOH}\\text{(aq)} + \\text{I}_2\\text{(g)} + \\text{O}_2\\text{(g)}$, iodine is oxidized from $-1$ to $0$. $\\text{O}_3$ acts as an oxidizing agent.<br><br>In the reaction $\\text{PbS}\\text{(s)} + 4\\text{O}_3\\text{(g)} \\longrightarrow \\text{PbSO}_4\\text{(s)} + 4\\text{O}_2\\text{(g)}$, sulphur is oxidized from $-2$ to $+6$. $\\text{O}_3$ acts as an oxidizing agent.<br><br>In the reaction $\\text{H}_2\\text{O}_2\\text{(l)} + \\text{O}_3\\text{(g)} \\longrightarrow \\text{H}_2\\text{O}\\text{(l)} + 2\\text{O}_2\\text{(g)}$, both hydrogen peroxide and ozone undergo mutual reduction. Ozone reduces $\\text{H}_2\\text{O}_2$ to $\\text{H}_2\\text{O}$ and itself gets reduced to $\\text{O}_2$. Thus, this reaction exhibits the reducing property of ozone.<br><br>Answer: $\\text{H}_2\\text{O}_2\\text{(l)} + \\text{O}_3\\text{(g)} \\longrightarrow \\text{H}_2\\text{O}\\text{(l)} + 2\\text{O}_2\\text{(g)}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29c8c30a4553e1bdaed", "type": "singleCorrect", "question": {"text": "What is O-O bond length in ozone ?", "image": null}, "options": [{"id": "fPXpL", "label": "A", "text": "$178$ pm", "isCorrect": false, "image": null}, {"id": "iRTOC", "label": "B", "text": "$128$ pm", "isCorrect": true, "image": null}, {"id": "3IHlc", "label": "C", "text": "$256$ pm", "isCorrect": false, "image": null}, {"id": "IoCm5", "label": "D", "text": "$483$ pm", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Ozone ($O_3$) is a resonance hybrid of two equivalent structures.<br><br>Due to resonance, both O-O bonds in the ozone molecule are identical.<br><br>The O-O bond length is intermediate between a typical O-O single bond ($148$ pm) and an O=O double bond ($121$ pm).<br><br>The experimentally determined O-O bond length in ozone is $128$ pm.<br><br>Answer: $128$ pm", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871beebf9280d7f9932dbf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following compounds is NOT acidic in nature?", "image": null}, "options": [{"id": "vtlTd", "text": "$\\mathrm{N}_2 \\mathrm{O}$", "image": null, "isCorrect": true}, {"id": "EDCtV", "text": "$\\mathrm{SO}_2$", "image": null, "isCorrect": false}, {"id": "Mk1cO", "text": "$\\mathrm{CO}_2$", "image": null, "isCorrect": false}, {"id": "YXOd5", "text": "$\\mathrm{N}_2 \\mathrm{O}_5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Non-metal oxides are generally acidic in nature, but there are a few exceptions which are neutral.<br><br>$\\mathrm{SO}_2$, $\\mathrm{CO}_2$, and $\\mathrm{N}_2\\mathrm{O}_5$ are acidic oxides because they react with water to form sulfurous acid, carbonic acid, and nitric acid respectively.<br><br>$\\mathrm{N}_2\\mathrm{O}$ (nitrous oxide), along with $\\mathrm{NO}$ and $\\mathrm{CO}$, is a neutral oxide. It does not exhibit acidic or basic properties.<br><br>Answer: $\\mathrm{N}_2 \\mathrm{O}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcebf9280d7f9932c97", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following statements is false about oxygen and sulphur?", "image": null}, "options": [{"id": "E65o3", "text": "Atoms of oxygen and sulphur consist two unpaired electrons in valence shell.", "image": null, "isCorrect": false}, {"id": "QD14D", "text": "Oxygen and sulphur show $-2,+4$ and +6 oxidation states.", "image": null, "isCorrect": true}, {"id": "8dw97", "text": "Oxygen is gas while sulphur is solid at room temperature.", "image": null, "isCorrect": false}, {"id": "c35lx", "text": "Hydride of oxygen is more stable than hydride of sulphur.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The electronic configuration of oxygen is $[\text{He}] 2s^2 2p^4$ and sulphur is $[\text{Ne}] 3s^2 3p^4$. Both have two unpaired electrons in their valence $p$-subshell.<br><br>Oxygen is a diatomic gas ($O_2$) at room temperature, whereas sulphur is a polyatomic solid ($S_8$).<br><br>The thermal stability of group 16 hydrides decreases down the group as the size of the central atom increases and the $E-H$ bond dissociation energy decreases. Thus, $H_2O$ is more stable than $H_2S$.<br><br>Oxygen exhibits oxidation states of $-2, -1, +1,$ and $+2$. Due to the absence of vacant d-orbitals in its valence shell, oxygen cannot expand its octet and does not show $+4$ and $+6$ oxidation states. Sulphur exhibits $-2, +2, +4,$ and $+6$ oxidation states. Therefore, the statement that both oxygen and sulphur show $-2, +4,$ and $+6$ oxidation states is false.<br><br>Answer: Oxygen and sulphur show $-2,+4$ and +6 oxidation states.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba9bf9280d7f9932b5d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following statements is NOT correct about ozone?", "image": null}, "options": [{"id": "LsJwr", "text": "It is strong reducing agent", "image": null, "isCorrect": true}, {"id": "KO3Ag", "text": "It has angular shape", "image": null, "isCorrect": false}, {"id": "F6vnb", "text": "It is good bleaching agent", "image": null, "isCorrect": false}, {"id": "QkyI4", "text": "It absorbs harmful Ultra Violet radiation from the sun", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ozone ($O_3$) is a powerful oxidizing agent, not a reducing agent, because it easily decomposes to yield nascent oxygen ($O_3 \\rightarrow O_2 + [O]$).<br><br>It has an angular (bent) shape with a bond angle of approximately $117^\\circ$.<br><br>It acts as a good bleaching agent due to its strong oxidizing properties.<br><br>It absorbs harmful ultraviolet (UV) radiation from the sun in the stratosphere.<br><br>Therefore, the statement that it is a strong reducing agent is incorrect.<br><br>Answer: It is strong reducing agent", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b15bf9280d7f9932629", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following statements is correct about $\\mathrm{O}_2$ and $\\mathrm{O}_3$ molecule?", "image": null}, "options": [{"id": "PKtwy", "text": "$\\mathrm{O}_2$ and $\\mathrm{O}_3$ are paramagnetic", "image": null, "isCorrect": false}, {"id": "mySor", "text": "The enthalpy change during the formation of $\\mathrm{O}_3$ from $\\mathrm{O}_2$ is positive", "image": null, "isCorrect": true}, {"id": "ADVIU", "text": "The entropy change in the formation of $\\mathrm{O}_3$ from $\\mathrm{O}_2$ is positive", "image": null, "isCorrect": false}, {"id": "jOHwy", "text": "$\\mathrm{O}_3$ is more stable than $\\mathrm{O}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The formation of ozone from oxygen is an endothermic process.<br><br>$3\\mathrm{O}_2(g) \\rightarrow 2\\mathrm{O}_3(g)$<br><br>The enthalpy change ($\\Delta H$) for this reaction is positive ($\\Delta H = +142 \\text{ kJ/mol}$ of $\\mathrm{O}_3$).<br><br>$\\mathrm{O}_2$ is paramagnetic due to the presence of two unpaired electrons in its antibonding molecular orbitals, while $\\mathrm{O}_3$ is diamagnetic.<br><br>During the formation of $\\mathrm{O}_3$, the number of gaseous moles decreases from $3$ to $2$, meaning the entropy change ($\\Delta S$) is negative.<br><br>$\\mathrm{O}_3$ is thermodynamically less stable than $\\mathrm{O}_2$ because its decomposition into $\\mathrm{O}_2$ is exothermic and accompanied by an increase in entropy, making the decomposition highly spontaneous.<br><br>Answer: The enthalpy change during the formation of $\\mathrm{O}_3$ from $\\mathrm{O}_2$ is positive", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792140c0aee93fa0796dd92", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "What is $\\mathrm{O}-\\mathrm{O}$ bond length in ozone molecule?", "image": null}, "options": [{"id": "68MDQ", "text": "128 pm", "image": null, "isCorrect": true}, {"id": "DOZl2", "text": "117 pm", "image": null, "isCorrect": false}, {"id": "A3hmw", "text": "$\\quad 107 \\mathrm{pm}$", "image": null, "isCorrect": false}, {"id": "QvCn0", "text": "134 pm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The ozone molecule ($\\mathrm{O}_3$) is a resonance hybrid of two equivalent structures.<br><br>Due to resonance, both $\\mathrm{O}-\\mathrm{O}$ bonds are identical.<br><br>The $\\mathrm{O}-\\mathrm{O}$ bond length in ozone is $128 \\mathrm{pm}$, which is intermediate between a typical $\\mathrm{O}-\\mathrm{O}$ single bond ($148 \\mathrm{pm}$) and an $\\mathrm{O}=\\mathrm{O}$ double bond ($121 \\mathrm{pm}$).<br><br>The $\\mathrm{O}-\\mathrm{O}-\\mathrm{O}$ bond angle is $117^{\\circ}$.<br><br>Answer: 128 pm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ea0aee93fa0796dc8a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Which among the following P-block elements forms colourless and odourless hydride?", "image": null}, "options": [{"id": "qpN1e", "text": "Oxygen", "image": null, "isCorrect": true}, {"id": "yMiDS", "text": "Nitrogen", "image": null, "isCorrect": false}, {"id": "pIls1", "text": "Sulphur", "image": null, "isCorrect": false}, {"id": "atF7n", "text": "Selenium", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The hydrides of the given p-block elements are $H_2O$ (Oxygen), $NH_3$ (Nitrogen), $H_2S$ (Sulphur), and $H_2Se$ (Selenium).<br><br>$H_2O$ (Water) is a colourless and odourless liquid.<br><br>$NH_3$ (Ammonia) is a colourless gas with a strong pungent odour.<br><br>$H_2S$ (Hydrogen sulphide) is a colourless gas with a rotten egg odour.<br><br>$H_2Se$ (Hydrogen selenide) is a colourless gas with a disagreeable odour.<br><br>Therefore, oxygen forms a colourless and odourless hydride.<br><br>Answer: Oxygen", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d40aee93fa0796dbd8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Which from following elements is NOT a member of group 16 from periodic table?", "image": null}, "options": [{"id": "CI7Wt", "text": "Tellurium", "image": null, "isCorrect": false}, {"id": "iJnSE", "text": "Polonium", "image": null, "isCorrect": false}, {"id": "O095w", "text": "Selenium", "image": null, "isCorrect": false}, {"id": "02aXk", "text": "Astatine", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Group 16 of the periodic table consists of oxygen (O), sulfur (S), selenium (Se), tellurium (Te), polonium (Po), and livermorium (Lv).<br><br>Astatine (At) is a member of group 17 (halogens).<br><br>Therefore, astatine is not a member of group 16.<br><br>Answer: Astatine", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213780aee93fa0796d909", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "What is the value of electronegativity of oxygen?", "image": null}, "options": [{"id": "bCuU4", "text": "4.0", "image": null, "isCorrect": false}, {"id": "Geut7", "text": "3.5", "image": null, "isCorrect": true}, {"id": "sAMNS", "text": "2.48", "image": null, "isCorrect": false}, {"id": "YFUao", "text": "3.2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the Pauling scale, the electronegativity of oxygen is $3.5$.<br><br>Fluorine has the highest electronegativity of $4.0$, followed by oxygen with $3.5$.<br><br>Answer: 3.5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262490279619d9d8a334b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Identify FALSE statement from following.", "image": null}, "options": [{"id": "kYdTR", "text": "Boiling point of sulfur is lower than oxygen.", "image": null, "isCorrect": true}, {"id": "xK7C7", "text": "Ionization enthalpy of group 16 elements gradually decreases from top to bottom.", "image": null, "isCorrect": false}, {"id": "NnjH9", "text": "Group 16 elements have lower ionization enthalpy than group 15 elements in corresponding periods.", "image": null, "isCorrect": false}, {"id": "3ZeDi", "text": "Oxygen has highest electronegativity next to fluorine amongst all the elements.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Melting and boiling points of elements of group 16 increase with increasing atomic number. Therefore, oxygen has low melting and boiling points as compared to sulfur.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620e0279619d9d8a316e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "Which from following molecules exhibits lowest thermal stability?", "image": null}, "options": [{"id": "NwQiT", "text": "$\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "CzYZg", "text": "$\\mathrm{H}_2 \\mathrm{Te}$", "image": null, "isCorrect": true}, {"id": "1ZKA6", "text": "$\\mathrm{H}_2 \\mathrm{Se}$", "image": null, "isCorrect": false}, {"id": "SBf2s", "text": "$\\mathrm{H}_2 \\mathrm{~S}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The thermal stability of hydrides of group 16 elements decreases from $\\mathrm{H}_2 \\mathrm{O}$ to $\\mathrm{H}_2 \\mathrm{Te}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f8f0279619d9d8a1d7a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "Which from following elements has lowest tendency to form it's oxide?", "image": null}, "options": [{"id": "b8izl", "text": "$\\mathrm{Al}$", "image": null, "isCorrect": false}, {"id": "xHSOd", "text": "$\\mathrm{Fe}$", "image": null, "isCorrect": false}, {"id": "UyJr6", "text": "$\\mathrm{Cr}$", "image": null, "isCorrect": false}, {"id": "V3HDP", "text": "$\\mathrm{Hg}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Mercury has the lowest tendency to form its oxide.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f820279619d9d8a1d0a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "Which among the following oxides is amphoteric in nature?", "image": null}, "options": [{"id": "eoWDN", "text": "$\\mathrm{Cl}_{2} \\mathrm{O}_{7}$", "image": null, "isCorrect": false}, {"id": "hCLCs", "text": "$\\mathrm{CaO}$", "image": null, "isCorrect": false}, {"id": "mulRq", "text": "$\\mathrm{B}_{2} \\mathrm{O}_{3}$", "image": null, "isCorrect": false}, {"id": "0MCyU", "text": "$\\mathrm{Sn} \\mathrm{O}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{Cl}_{2} \\mathrm{O}_{7} \\rightarrow$ Acidic oxide \n$\\text { Cao }\\rightarrow$ Basic oxide \n$\\mathrm{B}_{2} \\mathrm{O}_{3} \\rightarrow$ ACidic oxide \nSno $\\longrightarrow$ Amphoteric oxide", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eeb0279619d9d8a1855", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "For the conversion of oxygen to ozone in the atmosphere, nitric oxide in gaseous phase acts as", "image": null}, "options": [{"id": "AFTil", "text": "enzyme catalyst", "image": null, "isCorrect": false}, {"id": "wh3oN", "text": "Inhibitor", "image": null, "isCorrect": false}, {"id": "5ZoQ6", "text": "homogeneous catalyst", "image": null, "isCorrect": true}, {"id": "XtECn", "text": "heterogeneous catalyst", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the conversion of ozone to oxygen in atmosphere, <math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">O</mi></math> (nitric acid) acts as a homogeneous catalyst. <br/><math><mn>2</mn><msub><mrow><mtext>O</mtext></mrow><mrow><mn>3</mn></mrow></msub><mfenced separators=\"|\"><mrow><mtext>g</mtext></mrow></mfenced><mover><mrow><mo>⇌</mo></mrow><mrow><mtext>NO</mtext><mfenced separators=\"|\"><mrow><mtext>g</mtext></mrow></mfenced></mrow></mover><mn>3</mn><msub><mrow><mtext>O</mtext></mrow><mrow><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><mtext>g</mtext></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f0d0279619d9d8a1967", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "In ozone molecule the formal charge on the central oxygen atom is", "image": null}, "options": [{"id": "A9N9l", "text": "-1", "image": null, "isCorrect": false}, {"id": "iX6bt", "text": "+2", "image": null, "isCorrect": false}, {"id": "gQLpX", "text": "0", "image": null, "isCorrect": false}, {"id": "geA2m", "text": "+1", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<strong>Key Idea</strong> The format charge can be calculated using formula, Formula charger = number of valence electrons - <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math> (number of electrons in bond pairs) – number of electrons in lone pair.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263300279619d9d8a3ccf", "title": "Sulphur and Its Compounds", "totalQuestions": 26, "questions": [{"_id": "6abb88d315a9fc0fc8c1474d", "type": "singleCorrect", "question": {"text": "Sulfuric acid is used as a dehydrating agent in the following reaction. Identify the term used for carbon left.<br>$\\text{C}_{12}\\text{H}_{22}\\text{O}_{11} \\xrightarrow{\\text{H}_2\\text{SO}_4} 12\\text{C} + 11\\text{H}_2\\text{O}$", "image": null}, "options": [{"id": "otiBr", "label": "A", "text": "sugar charcoal", "isCorrect": true, "image": null}, {"id": "zeVbG", "label": "B", "text": "charring", "isCorrect": false, "image": null}, {"id": "71gUZ", "label": "C", "text": "graphite", "isCorrect": false, "image": null}, {"id": "Uu1m8", "label": "D", "text": "fused mixture", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Concentrated sulfuric acid acts as a strong dehydrating agent. When it reacts with sucrose (cane sugar, $\\text{C}_{12}\\text{H}_{22}\\text{O}_{11}$), it removes water molecules from it, leaving behind a black, porous mass of carbon.<br><br>$\\text{C}_{12}\\text{H}_{22}\\text{O}_{11} \\xrightarrow{\\text{conc. H}_2\\text{SO}_4} 12\\text{C} + 11\\text{H}_2\\text{O}$<br><br>The black mass of carbon left behind is known as sugar charcoal, and the process is called charring of sugar.<br><br>Answer: sugar charcoal", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c215a9fc0fc8c146b7", "type": "singleCorrect", "question": {"text": "Which of the following molecular formulae represents peroxy disulfuric acid?", "image": null}, "options": [{"id": "1ojk1", "label": "A", "text": "$\\text{H}_2\\text{S}_2\\text{O}_7$", "isCorrect": false, "image": null}, {"id": "LGgiy", "label": "B", "text": "$\\text{H}_2\\text{S}_2\\text{O}_8$", "isCorrect": true, "image": null}, {"id": "5cS2I", "label": "C", "text": "$\\text{H}_2\\text{S}_2\\text{O}_6$", "isCorrect": false, "image": null}, {"id": "Q74rE", "label": "D", "text": "$\\text{H}_2\\text{SO}_5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Peroxydisulfuric acid, also known as Marshall's acid, contains one peroxy linkage ($-O-O-$) between two sulfur atoms.<br><br>Its molecular formula is $\\text{H}_2\\text{S}_2\\text{O}_8$.<br><br>The names of the given compounds are:<br>$\\text{H}_2\\text{S}_2\\text{O}_7$: Pyrosulfuric acid (Oleum)<br>$\\text{H}_2\\text{S}_2\\text{O}_8$: Peroxydisulfuric acid (Marshall's acid)<br>$\\text{H}_2\\text{S}_2\\text{O}_6$: Dithionic acid<br>$\\text{H}_2\\text{SO}_5$: Peroxymonosulfuric acid (Caro's acid)<br><br>Answer: $\\text{H}_2\\text{S}_2\\text{O}_8$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c88c30a4553e1bdcc0", "type": "singleCorrect", "question": {"text": "Which from following catalysts is used in contact process of industrial production of sulfuric acid using $\\text{SO}_2$ and $\\text{O}_2$ (air).", "image": null}, "options": [{"id": "K4MqK", "label": "A", "text": "Ni (finely divided)", "isCorrect": false, "image": null}, {"id": "qdoKU", "label": "B", "text": "Platinised asbestos", "isCorrect": true, "image": null}, {"id": "Z47ma", "label": "C", "text": "Co-Th", "isCorrect": false, "image": null}, {"id": "7vZ9A", "label": "D", "text": "Fe-Cr", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The contact process is used for the industrial production of sulfuric acid.<br><br>The key step in this process is the catalytic oxidation of sulfur dioxide ($\\text{SO}_2$) to sulfur trioxide ($\\text{SO}_3$) using oxygen ($\\text{O}_2$) from the air.<br><br>The reaction is:<br>$2\\text{SO}_2(g) + \\text{O}_2(g) \\rightleftharpoons 2\\text{SO}_3(g)$<br><br>This reaction is catalyzed by platinised asbestos or vanadium pentoxide ($\\text{V}_2\\text{O}_5$).<br><br>Among the given options, platinised asbestos is the correct catalyst.<br><br>Finely divided Ni is used in the hydrogenation of oils.<br>Co-Th is used in Fischer-Tropsch synthesis.<br>Fe-Cr is used in the Bosch process.<br><br>Answer: Platinised asbestos", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d36f8c30a4553e1be3b8", "type": "singleCorrect", "question": {"text": "In the Charring process, concentrated sulfuric acid reacts with sugar to give sugar charcoal. What is the role of conc. $\\text{H}_2\\text{SO}_4$ in this reaction?", "image": null}, "options": [{"id": "RlwZJ", "label": "A", "text": "An oxidizing agent", "isCorrect": false, "image": null}, {"id": "ytzBH", "label": "B", "text": "A sulfonating agent", "isCorrect": false, "image": null}, {"id": "PrEgB", "label": "C", "text": "A dehydrating agent", "isCorrect": true, "image": null}, {"id": "vqzxy", "label": "D", "text": "A decomposing agent", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reaction of concentrated sulfuric acid with sugar (sucrose) is known as the charring process.<br><br>$\\text{C}_{12}\\text{H}_{22}\\text{O}_{11} \\xrightarrow{\\text{conc. H}_2\\text{SO}_4} 12\\text{C} + 11\\text{H}_2\\text{O}$<br><br>In this reaction, concentrated sulfuric acid removes water molecules from the sugar molecule, leaving behind a black mass of elemental carbon, which is called sugar charcoal. This demonstrates the strong affinity of concentrated sulfuric acid for water.<br><br>Therefore, concentrated $\\text{H}_2\\text{SO}_4$ acts as a strong dehydrating agent.<br><br>Answer: A dehydrating agent", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6abf9280d7f9932902", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What are the different types of bonds formed by sulphur with oxygen in thiosulfuric acid?", "image": null}, "options": [{"id": "rBAG5", "text": "One double bond and two single bond", "image": null, "isCorrect": true}, {"id": "ixvq1", "text": "One double bond and one single bond", "image": null, "isCorrect": false}, {"id": "0tyvd", "text": "Two double bond and one single bond", "image": null, "isCorrect": false}, {"id": "R9xUY", "text": "Two double bond and two single bond", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical formula of thiosulfuric acid is $H_2S_2O_3$.<br><br>Its structure is derived from sulfuric acid ($H_2SO_4$) by replacing one of the doubly bonded oxygen atoms with a sulfur atom.<br><br>In the structure of thiosulfuric acid, the central sulfur atom is bonded to:<br>1. One sulfur atom via a double bond ($S=S$).<br>2. One oxygen atom via a double bond ($S=O$).<br>3. Two oxygen atoms (of the hydroxyl groups) via single bonds ($S-OH$).<br><br>Therefore, the bonds formed by the central sulphur atom with oxygen are one double bond and two single bonds.<br><br>Answer: One double bond and two single bond", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b14bf9280d7f9932618", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the correct molecular formula of 'Oleum' from following.", "image": null}, "options": [{"id": "4suVK", "text": "$\\mathrm{H}_2 \\mathrm{~S}_2 \\mathrm{O}_3$", "image": null, "isCorrect": false}, {"id": "GjYQK", "text": "$\\mathrm{H}_2 \\mathrm{~S}_2 \\mathrm{O}_5$", "image": null, "isCorrect": false}, {"id": "ocWqH", "text": "$\\mathrm{H}_2 \\mathrm{~S}_2 \\mathrm{O}_7$", "image": null, "isCorrect": true}, {"id": "0A36Z", "text": "$\\mathrm{H}_2 \\mathrm{~S}_2 \\mathrm{O}_8$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Oleum is also known as fuming sulfuric acid or pyrosulfuric acid.<br><br>It is formed by dissolving sulfur trioxide ($\\mathrm{SO}_3$) in concentrated sulfuric acid ($\\mathrm{H}_2\\mathrm{SO}_4$).<br><br>The chemical reaction is given by:<br>$\\mathrm{H}_2\\mathrm{SO}_4 + \\mathrm{SO}_3 \\rightarrow \\mathrm{H}_2\\mathrm{S}_2\\mathrm{O}_7$<br><br>Thus, the molecular formula of oleum is $\\mathrm{H}_2\\mathrm{S}_2\\mathrm{O}_7$.<br><br>Answer: $\\mathrm{H}_2 \\mathrm{~S}_2 \\mathrm{O}_7$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b03bf9280d7f993259c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the correct order of thermal stability of hydrides of 16 group elements from the following.", "image": null}, "options": [{"id": "NCZ7j", "text": "$\\mathrm{H}_2 \\mathrm{~S} < \\mathrm{H}_2 \\mathrm{O} < \\mathrm{H}_2 \\mathrm{Se} < \\mathrm{H}_2 \\mathrm{Te}$", "image": null, "isCorrect": false}, {"id": "dfRLD", "text": "$\\mathrm{H}_2 \\mathrm{O} < \\mathrm{H}_2 \\mathrm{~S} < \\mathrm{H}_2 \\mathrm{Se} < \\mathrm{H}_2 \\mathrm{Te}$", "image": null, "isCorrect": false}, {"id": "0raXu", "text": "$\\mathrm{H}_2 \\mathrm{Te} < \\mathrm{H}_2 \\mathrm{Se} < \\mathrm{H}_2 \\mathrm{~S} < \\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": true}, {"id": "hGV4n", "text": "$\\mathrm{H}_2 \\mathrm{Se} < \\mathrm{H}_2 \\mathrm{Te} < \\mathrm{H}_2 \\mathrm{O} < \\mathrm{H}_2 \\mathrm{~S}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The thermal stability of hydrides of Group 16 elements decreases down the group.<br><br>As the size of the central atom increases from oxygen to tellurium, the E-H bond length increases.<br><br>This results in a decrease in the bond dissociation enthalpy of the E-H bond.<br><br>Therefore, the thermal stability decreases in the order: $\\mathrm{H}_2\\mathrm{O} > \\mathrm{H}_2\\mathrm{S} > \\mathrm{H}_2\\mathrm{Se} > \\mathrm{H}_2\\mathrm{Te}$.<br><br>The correct increasing order is $\\mathrm{H}_2\\mathrm{Te} < \\mathrm{H}_2\\mathrm{Se} < \\mathrm{H}_2\\mathrm{S} < \\mathrm{H}_2\\mathrm{O}$.<br><br>Answer: $\\mathrm{H}_2 \\mathrm{Te} < \\mathrm{H}_2 \\mathrm{Se} < \\mathrm{H}_2 \\mathrm{~S} < \\mathrm{H}_2 \\mathrm{O}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214460aee93fa0796df5b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Identify a compound having properties of tear gas.", "image": null}, "options": [{"id": "KMPgL", "text": "$\\mathrm{SOCl}_2$", "image": null, "isCorrect": false}, {"id": "00gPz", "text": "$\\mathrm{COCl}_2$", "image": null, "isCorrect": false}, {"id": "i2dTB", "text": "$\\mathrm{Cl}\\left(\\mathrm{CH}_2\\right)_2 \\mathrm{~S}\\left(\\mathrm{CH}_2\\right)_2 \\mathrm{Cl}$", "image": null, "isCorrect": false}, {"id": "J39CN", "text": "$\\mathrm{CCl}_3 \\mathrm{NO}_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Chloropicrin ($\\mathrm{CCl}_3\\mathrm{NO}_2$) is known as tear gas and is used as a riot control agent.<br><br>Phosgene ($\\mathrm{COCl}_2$) is a highly poisonous gas.<br><br>Mustard gas ($\\mathrm{Cl}(\\mathrm{CH}_2)_2\\mathrm{S}(\\mathrm{CH}_2)_2\\mathrm{Cl}$) is a chemical warfare agent that causes severe blistering.<br><br>Thionyl chloride ($\\mathrm{SOCl}_2$) is a common chlorinating agent.<br><br>Answer: $\\mathrm{CCl}_3 \\mathrm{NO}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214310aee93fa0796deb7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Identify the angle $\\mathrm{O}-\\mathrm{S}-\\mathrm{O}$ in $\\mathrm{SO}_2$ molecule.", "image": null}, "options": [{"id": "BRF1R", "text": "$119.5^{\\circ}$", "image": null, "isCorrect": true}, {"id": "ss2ea", "text": "$180^{\\circ}$", "image": null, "isCorrect": false}, {"id": "Amodg", "text": "$109^{\\circ}$", "image": null, "isCorrect": false}, {"id": "SilGf", "text": "$107.5^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\mathrm{SO}_2$ molecule, the central sulfur atom undergoes $sp^2$ hybridization.<br><br>It has two bond pairs and one lone pair of electrons.<br><br>The expected bond angle for $sp^2$ hybridization is $120^{\\circ}$.<br><br>Due to lone pair-bond pair repulsion being greater than bond pair-bond pair repulsion, the $\\mathrm{O}-\\mathrm{S}-\\mathrm{O}$ bond angle is slightly reduced to $119.5^{\\circ}$.<br><br>Answer: $119.5^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626b0279619d9d8a3461", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "What is the value of $\\angle \\mathrm{S}$-S-S in puckered $\\mathrm{S}_8$ rhombic sulfur?", "image": null}, "options": [{"id": "PDUBf", "text": "$107^{\\circ}$", "image": null, "isCorrect": true}, {"id": "lZLVf", "text": "$120^{\\circ}$", "image": null, "isCorrect": false}, {"id": "PhRDg", "text": "$104.5^{\\circ}$", "image": null, "isCorrect": false}, {"id": "EihX0", "text": "$60^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Structure of $\\mathrm{S}_8$ ring in rhombic sulfur:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/QJxRIALyszlKdFvcuk6EaX5rjrXE0Qfusc6ZfZZTl64.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d90279619d9d8a2fd1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "Identify the method used to obtain $\\mathrm{SO}_2$ gas in industry.", "image": null}, "options": [{"id": "U3xto", "text": "By burning sulphur in air", "image": null, "isCorrect": false}, {"id": "nxuJT", "text": "By treating sodium sulphite with dil. sulphuric acid", "image": null, "isCorrect": false}, {"id": "0nuHS", "text": "By treating sodium sulphite with dil. hydrochloric acid", "image": null, "isCorrect": false}, {"id": "07XKW", "text": "By roasting zinc sulphide and iron pyrites", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In industry, sulphur dioxide can be prepared by roasting zinc sulphide and iron pyrites.\n$\\begin{aligned}\n& 2 \\mathrm{ZnS}_{(\\mathrm{s})}+3 \\mathrm{O}_{2(\\mathrm{~g})} \\stackrel{\\Delta}{\\longrightarrow} 2 \\mathrm{ZnO}_{(\\mathrm{s})}+2 \\mathrm{SO}_{2(\\mathrm{~g})} \\\\\n& 4 \\mathrm{FeS}_{2(\\mathrm{~s})}+11 \\mathrm{O}_{2(\\mathrm{~g})} \\stackrel{\\Delta}{\\longrightarrow} 2 \\mathrm{Fe}_2 \\mathrm{O}_{3(\\mathrm{~s})}+8 \\mathrm{SO}_{2(\\mathrm{~g})}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c50279619d9d8a2f37", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "What is the number of electrons around sulfur in $\\mathrm{H}_2 \\mathrm{SO}_4$ molecule?", "image": null}, "options": [{"id": "t2mBq", "text": "4", "image": null, "isCorrect": false}, {"id": "bdwNE", "text": "6", "image": null, "isCorrect": false}, {"id": "uDXm9", "text": "10", "image": null, "isCorrect": false}, {"id": "wXbtg", "text": "12", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/ZJRkzdLD0bOlNerZGSwaeHF0sIEH5NIlM7vOcgKy1pM.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b20279619d9d8a2e9f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Which of the following metals is used as catalyst in manufacture of sulphuric acid by contact process?", "image": null}, "options": [{"id": "E8cqb", "text": "Iron", "image": null, "isCorrect": false}, {"id": "UA4SQ", "text": "Platinum", "image": null, "isCorrect": true}, {"id": "N0JEl", "text": "Nickel", "image": null, "isCorrect": false}, {"id": "C0ll1", "text": "Cobalt", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the contact process of industrial production of sulfuric acid; sulphur dioxide and oxygen from the air react reversibly over a solid catalyst of platinised asbestos.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2619b0279619d9d8a2deb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Which from following activities results in to the formation of oleum in manufacture of sulphuric acid contact process?", "image": null}, "options": [{"id": "axStn", "text": "By adding sodium sulphite and $\\mathrm{SO}_2$ in water", "image": null, "isCorrect": false}, {"id": "oENLu", "text": "By passing $\\mathrm{SO}_2$ gas in to the dil. $\\mathrm{H}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": false}, {"id": "8h5j1", "text": "Passing $\\mathrm{SO}_2$ gas through $\\mathrm{NaOH}$ solution", "image": null, "isCorrect": false}, {"id": "gRJgV", "text": "By absorbing $\\mathrm{SO}_3$ gas in conc. $\\mathrm{H}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Constant volume process is isochoric process\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/lGfyGse782H3hIHrx9GVD2fMzHocxoqq4v2BK9GY7sM.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c , "question": {"text": "Which among the following is NOT the use of $\\mathrm{SO}_2$ gas?", "image": null}, "options": [{"id": "UigJh", "text": "As a preservative", "image": null, "isCorrect": false}, {"id": "54wlX", "text": "In manufacture of $\\mathrm{H}_2 \\mathrm{SO}_4$", "image": null, "isCorrect": false}, {"id": "lwKSy", "text": "With conc. $\\mathrm{H}_2 \\mathrm{SO}_4$ it forms oleum", "image": null, "isCorrect": true}, {"id": "7XI50", "text": "As an antichlor", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Sulfur dioxide has the chemical composition of $\\mathrm{SO}_2$ and is also commonly referred to as sulfurous acid anhydride, sulfurous anhydride, or sulfur oxide.\nUses of Sulphur Dioxide\nIn the food industries, as a food preservative.\nIt acts as a bleaching agent to remove the excess chlorine and as a disinfectant.\nIn cold storage plant, it acts as a refrigerant. It is used as a reagent and a solvent in the laboratory.\nIn the preparation of sulfuric acid, sulfur trioxide, and sulfites $\\mathrm{SO}_3$ forms oleum with $\\mathrm{H}_2 \\mathrm{SO}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260060279619d9d8a211e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "When $\\mathrm{SO}_{2}$ is passed through acidified $\\mathrm{K}_{2} \\mathrm{Cr}_{2} \\mathrm{O}_{7}$ solution", "image": null}, "options":
