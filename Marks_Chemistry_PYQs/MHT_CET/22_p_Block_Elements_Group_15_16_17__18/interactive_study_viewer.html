    const data = {"index": 22, "chapterId": "61c0898cb44d09aaffccb2eb", "chapter": "p Block Elements (Group 15, 16, 17 & 18)", "exam": "MHT CET", "totalTopics": 6, "totalQuestions": 175, "downloadTime": "2026-10-08 20:06:48", "topics": [{"index": 1, "topicId": "65a263300279619d9d8a3ccd", "title": "Nitrogen and Its Compounds", "totalQuestions": 29, "questions": [{"_id": "6abb885315a9fc0fc8c142a0", "type": "singleCorrect", "question": {"text": "Which of the following catalysts is used in the manufacture of ammonia by Haber's process?", "image": null}, "options": [{"id": "xOsrV", "label": "A", "text": "$\\text{Fe-Cr}$", "isCorrect": false, "image": null}, {"id": "K6A4C", "label": "B", "text": "$\\text{Mo/Fe}$", "isCorrect": true, "image": null}, {"id": "pIWTj", "label": "C", "text": "$\\text{MnO}_2$", "isCorrect": false, "image": null}, {"id": "s4mZe", "label": "D", "text": "$\\text{Pt}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In Haber's process for the manufacture of ammonia, the reaction between nitrogen and hydrogen is given by:<br><br>$\\text{N}_2(g) + 3\\text{H}_2(g) \\rightleftharpoons 2\\text{NH}_3(g)$<br><br>Finely divided iron ($\\text{Fe}$) is used as the catalyst to increase the rate of reaction, and molybdenum ($\\text{Mo}$) is used as a promoter to enhance the efficiency of the iron catalyst. Therefore, $\\text{Mo/Fe}$ is the correct catalyst-promoter combination used in this process.<br><br>Answer: $\\text{Mo/Fe}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887415a9fc0fc8c143de", "type": "singleCorrect", "question": {"text": "Which of the following catalysts is used for Haber's process of manufacture of ammonia?", "image": null}, "options": [{"id": "FtjDQ", "label": "A", "text": "Ni", "isCorrect": false, "image": null}, {"id": "kEVKB", "label": "B", "text": "Pt", "isCorrect": false, "image": null}, {"id": "KkxEd", "label": "C", "text": "Fe", "isCorrect": true, "image": null}, {"id": "n5OG9", "label": "D", "text": "$\\text{V}_2\\text{O}_5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Haber's process is used for the industrial manufacture of ammonia from nitrogen and hydrogen gases.<br><br>$\\text{N}_2(g) + 3\\text{H}_2(g) \\rightleftharpoons 2\\text{NH}_3(g)$<br><br>The catalyst used in this process is finely divided iron (Fe), often with molybdenum (Mo) as a promoter, or iron oxide mixed with small amounts of $\\text{K}_2\\text{O}$ and $\\text{Al}_2\\text{O}_3$ to increase the rate of attainment of equilibrium.<br><br>Other catalysts mentioned:<br>Ni is used in the hydrogenation of vegetable oils.<br>Pt is used in Ostwald's process for the manufacture of nitric acid.<br>$\\text{V}_2\\text{O}_5$ is used in the Contact process for the manufacture of sulphuric acid.<br><br>Answer: Fe", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a88c30a4553e1bdb6d", "type": "singleCorrect", "question": {"text": "In Haber process of production of ammonia $\\text{Al}_2\\text{O}_3$ is used as", "image": null}, "options": [{"id": "U2zJF", "label": "A", "text": "Adsorbate", "isCorrect": false, "image": null}, {"id": "rwiFj", "label": "B", "text": "Inhibitor", "isCorrect": false, "image": null}, {"id": "6EW9n", "label": "C", "text": "Catalyst", "isCorrect": false, "image": null}, {"id": "rIdQA", "label": "D", "text": "Promoter", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "In the Haber process for the synthesis of ammonia, finely divided iron is used as the catalyst.<br><br>To enhance the activity of the iron catalyst, small amounts of aluminum oxide ($\\text{Al}_2\\text{O}_3$) and potassium oxide ($\\text{K}_2\\text{O}$) are added.<br><br>Substances that increase the efficiency or activity of a catalyst are known as promoters. Therefore, $\\text{Al}_2\\text{O}_3$ acts as a promoter.<br><br>Answer: Promoter", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbebf9280d7f9932c0b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is an acidic oxide?", "image": null}, "options": [{"id": "9qadA", "text": "CO", "image": null, "isCorrect": false}, {"id": "3Rl5c", "text": "NO", "image": null, "isCorrect": false}, {"id": "PjO4s", "text": "$\\mathrm{N}_2 \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "n3hod", "text": "$\\mathrm{N}_2 \\mathrm{O}_5$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Oxides of non-metals are generally acidic in nature, but some are neutral.<br><br>$\\mathrm{CO}$, $\\mathrm{NO}$, and $\\mathrm{N}_2\\mathrm{O}$ are well-known neutral oxides.<br><br>$\\mathrm{N}_2\\mathrm{O}_5$ is an acidic oxide because it reacts with water to form nitric acid ($\\mathrm{HNO}_3$).<br><br>Answer: $\\mathrm{N}_2 \\mathrm{O}_5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e70aee93fa0796dc6e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "In Haber's process of production of ammonia, $\\mathrm{K}_2 \\mathrm{O}$ is used as", "image": null}, "options": [{"id": "8dGoO", "text": "catalyst", "image": null, "isCorrect": false}, {"id": "X3Xrv", "text": "inhibitor", "image": null, "isCorrect": false}, {"id": "mofz4", "text": "promotor", "image": null, "isCorrect": true}, {"id": "NTLkW", "text": "adsorbate", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In Haber's process for the manufacture of ammonia, finely divided iron (Fe) is used as a catalyst.<br><br>A small amount of potassium oxide ($\\mathrm{K}_2\\mathrm{O}$) and aluminium oxide ($\\mathrm{Al}_2\\mathrm{O}_3$) are added to the catalyst to increase its activity.<br><br>Substances that enhance the activity of a catalyst are called promoters. Therefore, $\\mathrm{K}_2\\mathrm{O}$ acts as a promoter.<br><br>Answer: promotor", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139b0aee93fa0796da19", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "What is the number of moles of Cl atoms and N atoms respectively present in n moles of chloropicrin?", "image": null}, "options": [{"id": "leZqQ", "text": "3n and n", "image": null, "isCorrect": true}, {"id": "HwKBM", "text": "2n and 2n", "image": null, "isCorrect": false}, {"id": "y2VYF", "text": "n and n", "image": null, "isCorrect": false}, {"id": "y8HV3", "text": "n and 2n", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical formula of chloropicrin is $CCl_3NO_2$.<br><br>One molecule of chloropicrin contains $3$ chlorine (Cl) atoms and $1$ nitrogen (N) atom.<br><br>Therefore, $1$ mole of chloropicrin contains $3$ moles of Cl atoms and $1$ mole of N atoms.<br><br>For $n$ moles of chloropicrin, the number of moles of Cl atoms is $3n$ and the number of moles of N atoms is $n$.<br><br>Answer: 3n and n", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133e0aee93fa0796d745", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Which from following catalysts is used in the Haber's process for manufacture of ammonia?", "image": null}, "options": [{"id": "7yyGt", "text": "$\\mathrm{MnO}_2$", "image": null, "isCorrect": false}, {"id": "nHm7s", "text": "$\\mathrm{Mo} / \\mathrm{Fe}$", "image": null, "isCorrect": true}, {"id": "DmaUQ", "text": "$\\mathrm{Co}-\\mathrm{Th}$", "image": null, "isCorrect": false}, {"id": "tMoXL", "text": "$\\mathrm{Fe}-\\mathrm{Cr}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In Haber's process for the manufacture of ammonia, finely divided iron ($\\mathrm{Fe}$) is used as a catalyst and molybdenum ($\\mathrm{Mo}$) is used as a promoter to increase the efficiency of the catalyst.<br><br>The reaction is given by:<br>$\\mathrm{N}_2(\\mathrm{g}) + 3\\mathrm{H}_2(\\mathrm{g}) \\xrightarrow{\\mathrm{Fe}/\\mathrm{Mo}} 2\\mathrm{NH}_3(\\mathrm{g})$<br><br>Thus, $\\mathrm{Mo} / \\mathrm{Fe}$ is the correct catalyst system.<br><br>Answer: $\\mathrm{Mo} / \\mathrm{Fe}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", nLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "Which among the following oxides is acidic in nature?", "image": null}, "options": [{"id": "d3Tfh", "text": "$\\mathrm{N}_2 \\mathrm{O}_5$", "image": null, "isCorrect": true}, {"id": "qlhZN", "text": "$\\mathrm{NO}$", "image": null, "isCorrect": false}, {"id": "lW1Hj", "text": "$\\mathrm{Na}_2 \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "TAPij", "text": "$\\mathrm{CO}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{N}_2 \\mathrm{O}_5 \\rightarrow$ Acidic\n$\\mathrm{NO} \\rightarrow$ Neutral\n$\\mathrm{Na}_2 \\mathrm{O} \\rightarrow$ Basic\n$\\mathrm{CO} \\rightarrow$ Neutral", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fcf0279619d9d8a1f6a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "Which of the following is obtained by catalytic oxidation of ammonia?", "image": null}, "options": [{"id": "l4uWp", "text": "$\\mathrm{N}_{2} \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "c0RaP", "text": "$\\mathrm{NO}$", "image": null, "isCorrect": true}, {"id": "GJqxL", "text": "$\\mathrm{HNO}_{2}$", "image": null, "isCorrect": false}, {"id": "qCI1x", "text": "$\\mathrm{NO}_{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "NO\nNitric oxide (NO) is obtained by catalytic oxidation of ammonia. The catalytic oxidation of ammonia uses a metal catalyst such as platinum, copper or nickel. This metal catalyst is heated, so that ammonia can reduce it, oxygen added to the system can then oxidise the ammonia, forming nitric oxide.<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/SWvzRx65Q5MpxRnr3mYnCI1srRP_sbgDxMF2nfgJiHQ.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fb80279619d9d8a1eb5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "Which among the following group-15 elements does NOT react with concentrated sulphuric acid?", "image": null}, "options": [{"id": "xr5zV", "text": "Phosphorus", "image": null, "isCorrect": false}, {"id": "ShLrd", "text": "Arsenic", "image": null, "isCorrect": false}, {"id": "tvn49", "text": "Nitrogen", "image": null, "isCorrect": true}, {"id": "4KNdx", "text": "Antimony", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathbf{N}$\nBecause nitrogen has the highest bond dissociating energy of all the elements, it does not react with concentrated sulphuric acid. This is due to its little size.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fa80279619d9d8a1e3f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "Which of the following oxide of nitrogen is coloured?", "image": null}, "options": [{"id": "OFasO", "text": "$\\mathrm{N}_{2} \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "tzZdm", "text": "$\\mathrm{NO}$", "image": null, "isCorrect": false}, {"id": "3AE4H", "text": "$\\mathrm{NO}_{2}$", "image": null, "isCorrect": true}, {"id": "mx5Ro", "text": "$\\mathrm{~N}_{2} \\mathrm{O}_{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The nitrogen gas at higher temperature is a reddish brown gas. The nitrogen dioxide is paramagnetic in nature. Thus, the oxides of nitrogen is a coloured gas is nitrogen dioxide.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f5e0279619d9d8a1be6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "Which among the following group $-15$ elements forms hydrogen bonding in it's hydride compounds?", "image": null}, "options": [{"id": "Q9gAd", "text": "Sb", "image": null, "isCorrect": false}, {"id": "dOCPp", "text": "P", "image": null, "isCorrect": false}, {"id": "1Hwgv", "text": "As", "image": null, "isCorrect": false}, {"id": "Em7Pm", "text": "N", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Nitrogen forms hydrogen bonding in its hydride compounds.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f4a0279619d9d8a1b42", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "Which among the following oxides of nitrogen is brown coloured gas?", "image": null}, "options": [{"id": "iSPaw", "text": "$\\mathrm{N}_{2} \\mathrm{O}_{5}$", "image": null, "isCorrect": false}, {"id": "zNLGq", "text": "$\\mathrm{N}_{2} \\mathrm{O}_{3}$", "image": null, "isCorrect": false}, {"id": "xLZAu", "text": "$\\mathrm{NO}_{2}$", "image": null, "isCorrect": true}, {"id": "47g2n", "text": "$\\mathrm{N}_{2} \\mathrm{O}_{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nitrogen dioxide is a dark reddish brown gas and dinitrogen tetroxide is a colorless gas. When the equilibrium is shifted to the left, as written, the amount of nitrogen dioxide increases, the amount of dinitrogen tetroxide decreases and the color of the tube darkens.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f330279619d9d8a1a91", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "Which of the following formula represents laughing gas?", "image": null}, "options": [{"id": "lR8HR", "text": "$\\mathrm{N}_{2} \\mathrm{O}$", "image": null, "isCorrect": true}, {"id": "gqa8M", "text": "$\\mathrm{N}_{2} \\mathrm{O}_{5}$", "image": null, "isCorrect": false}, {"id": "klP9H", "text": "$\\mathrm{~N}_{2} \\mathrm{O}_{4}$", "image": null, "isCorrect": false}, {"id": "nr3Jo", "text": "$\\mathrm{~N}_{2} \\mathrm{O}_{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nitrous oxide, also known as dinitrogen oxide or dinitrogen monoxide with chemical formula $\\mathrm{N}_{2} \\mathrm{O}$.\nIt is commonly known as laughing gas.\nUnder room conditions it is a colourless nonflammable gas, with a pleasant slightly sweet odour.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed row><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><mtext>g</mtext></mrow></mfenced></math><br /><br><br /><br>In the reaction,", "image": null}, "options": [{"id": "1yFQJ", "text": "<math><mtext>N</mtext><msub><mrow><mtext>O</mtext></mrow><mrow><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><mtext>g</mtext></mrow></mfenced></math> is intermediate", "image": null, "isCorrect": false}, {"id": "XNhS6", "text": "<math><mtext>N</mtext><msub><mrow><mtext>O</mtext></mrow><mrow></mrow></msub><mfenced separators=\"|\"><mrow><mtext>g</mtext></mrow></mfenced></math> is intermediate", "image": null, "isCorrect": true}, {"id": "lzCjy", "text": "<math><mtext>N</mtext><msub><mrow><mtext>O</mtext></mrow><mrow></msub><mfenced separators=\"|\"><mrow><mtext>g</mtext></mrow></mfenced></mrow></math> is catalyst", "image": null, "isCorrect": false}, {"id": "hPmwl", "text": "<math><msub><mrow><mtext>O</mtext></mrow><mrow><mn>2</mn></msub><mfenced separators=\"|\"><mrow><mtext>g</mtext></mrow></mfenced></mrow></math> is intermediate", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "On adding equation (1) &amp; (2) we get<br /><math> <mrow> <mn>2</mn><mtext>S</mtext><msub> <mtext>O</mtext> <mn>2</mn> </msub> <mo>+</mo><mn>2</mn><mtext>N</mtext><msub> <mtext>O</mtext> <mn>2</mn> </msub> <mo>+</mo><msub> <mtext>O</mtext> <mn>2</mn> </msub> <mo>→</mo><mn>2</mn><mtext>S</mtext><msub> <mtext>O</mtext> <mn>3</mn> </msub> <mo>+</mo><mn>2</mn><mtext>N</mtext><msub> <mtext>O</mtext> <mn>2</mn> </msub> </mrow> </math><br />The <math> <mrow> <mtext>N</mtext><mtext>O</mtext></mrow> </math> is not considered.<br />It is a intermediate in the reaction.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea10279619d9d8a1602", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "Haber process is used for the production of which of the following?", "image": null}, "options": [{"id": "MUWW6", "text": "$\\mathrm{NH}_{3}$", "image": null, "isCorrect": true}, {"id": "zLcfr", "text": "$\\mathrm{HNO}_{3}$", "image": null, "isCorrect": false}, {"id": "ZDXA1", "text": "$\\mathrm{H}_{2} \\mathrm{SO}_{4}$", "image": null, "isCorrect": false}, {"id": "cdgKK", "text": "$\\mathrm{O}_{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Haber process is used for the production of ammonia gas. $\\mathrm{N}_{2}(g)+3 \\mathrm{H}_{2}(g) \\rightleftharpoons 2 \\mathrm{NH}_{3}(g)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9f0279619d9d8a15ec", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The laughing gas is", "image": null}, "options": [{"id": "t4O51", "text": "$\\mathrm{N}_{2} \\mathrm{O}_{4}$", "image": null, "isCorrect": false}, {"id": "uKnt9", "text": "NO", "image": null, "isCorrect": false}, {"id": "OADqS", "text": "$\\mathrm{N}_{2} \\mathrm{O}$", "image": null, "isCorrect": true}, {"id": "kYVge", "text": "$\\mathrm{N}_{2} \\mathrm{O}_{5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nitrous oxide, $\\mathrm{N}_{2} \\mathrm{O}$ is termed as laughing gas.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263300279619d9d8a3cd0", "title": "Phosphorus and Its Compounds", "totalQuestions": 18, "questions": [{"_id": "6abb884215a9fc0fc8c14207", "type": "singleCorrect", "question": {"text": "Find the number of allotropic forms of Tellurium under normal conditions.", "image": null}, "options": [{"id": "P66jD", "label": "A", "text": "$2$", "isCorrect": true, "image": null}, {"id": "6Z58j", "label": "B", "text": "$3$", "isCorrect": false, "image": null}, {"id": "nExL2", "label": "C", "text": "$6$", "isCorrect": false, "image": null}, {"id": "kOedh", "label": "D", "text": "$8$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Tellurium exists in two allotropic forms under normal conditions: crystalline and amorphous.<br><br>Crystalline tellurium has a silvery-white, metallic appearance and consists of parallel helical chains of atoms. Amorphous tellurium is a brownish-black powder.<br><br>Thus, the number of allotropic forms of Tellurium is $2$.<br><br>Answer: $2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883215a9fc0fc8c1416e", "type": "singleCorrect", "question": {"text": "What is the number of metallic allotrops of polonium?", "image": null}, "options": [{"id": "wL09q", "label": "A", "text": "$3$", "isCorrect": false, "image": null}, {"id": "SO6s5", "label": "B", "text": "$2$", "isCorrect": true, "image": null}, {"id": "fLENS", "label": "C", "text": "$4$", "isCorrect": false, "image": null}, {"id": "ukwF9", "label": "D", "text": "$5$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Polonium exists in two metallic allotropic forms: $\\alpha$-polonium and $\\beta$-polonium.<br><br>$\\alpha$-polonium has a simple cubic structure, while $\\beta$-polonium has a rhombohedral structure.<br><br>The transition from the $\\alpha$ form to the $\\beta$ form occurs at around $36^{\\circ}\\text{C}$.<br><br>Therefore, the number of metallic allotropes of polonium is $2$.<br><br>Answer: $2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b27bf9280d7f99326bc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04  "options": [{"id": "b3xGy", "text": "$\\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "dDGOX", "text": "$\\mathrm{S}$", "image": null, "isCorrect": true}, {"id": "BV3Bd", "text": "$\\mathrm{Se}$", "image": null, "isCorrect": false}, {"id": "Qgsw3", "text": "$\\mathrm{Te}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Among the given, $\\mathrm{S}$ has higher catenation property and therefore, it has greater number of isotopes.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b00279619d9d8a2e8c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Which from following molecules exhibits highest acidic nature?", "image": null}, "options": [{"id": "gkgtC", "text": "$H_2O$", "image": null, "isCorrect": false}, {"id": "EnMvK", "text": "$H_2S$", "image": null, "isCorrect": false}, {"id": "KYWuF", "text": "$H_2Se$", "image": null, "isCorrect": false}, {"id": "o5oGa", "text": "$H_2Te$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The acidic character of the hydrides of group 16 increases from $\\mathrm{H}_2 \\mathrm{O}$ to $\\mathrm{H}_2 \\mathrm{Te}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z",
