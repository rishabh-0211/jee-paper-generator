 not from polyhalide ion?", "image": null}, "options": [{"id": "O1VbK", "text": "Chlorine", "image": null, "isCorrect": false}, {"id": "qp6HV", "text": "Bromine", "image": null, "isCorrect": false}, {"id": "NI6CI", "text": "Iodine", "image": null, "isCorrect": false}, {"id": "ncp6l", "text": "Fluorine", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When the halide ions combine with halogen molecules or interhalogen, univalent ions are obtained. These are known as polyhalide ions. Among the given options, F does’t form polyhalide ion because it doesn’t have d-orbitals and cannot show higher oxidation state.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eb30279619d9d8a1692", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "What is the highest oxidation state exhibited by Group-17 elements?", "image": null}, "options": [{"id": "6unAE", "text": "+ 1", "image": null, "isCorrect": false}, {"id": "wcwf7", "text": "+ 3", "image": null, "isCorrect": false}, {"id": "IFWOg", "text": "+ 5", "image": null, "isCorrect": false}, {"id": "nyi9X", "text": "+ 7", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "General electronic configuration of 17-group elements is <math> <mrow> <mtext>n</mtext><msup> <mtext>s</mtext> <mn>2</mn> </msup> <mtext>n</mtext><msup> <mtext>p</mtext> <mn>5</mn>&nbsp;</msup></mrow></math>. Except fluorine all other atoms can lose 7 electrons so, the highest oxidation state by Group-17 elements is +7.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9f0279619d9d8a15f1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The solution of $\\mathrm{BiCl}_{3}$ in dil. $\\mathrm{HCl}$ when diluted with water, white precipitate is formed which is", "image": null}, "options": [{"id": "wbLXd", "text": "Bismith oxychloride", "image": null, "isCorrect": true}, {"id": "0BNL3", "text": "Bismith oxide", "image": null, "isCorrect": false}, {"id": "XPZtX", "text": "Bismith hydroxide", "image": null, "isCorrect": false}, {"id": "Pd2OE", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{BiCl}_{3}+\\mathrm{H}_{2} \\mathrm{O} \\rightleftharpoons \\underset{\\text { bismuth oxy chloride(white precipitate) }}{\\mathrm{BiOCl} \\downarrow +2 \\mathrm{HCl}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8e0279619d9d8a1566", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "Which of the following property does not correspond to the order $\\mathrm{HI} < \\mathrm{HBr} < \\mathrm{HCl} < \\mathrm{HF} ?$", "image": null}, "options": [{"id": "h0xeH", "text": "Thermal stability", "image": null, "isCorrect": false}, {"id": "CFHRh", "text": "Reducing power", "image": null, "isCorrect": true}, {"id": "67ssW", "text": "Ionic character", "image": null, "isCorrect": false}, {"id": "CyR1j", "text": "Dipole moment", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Reducing power increases in the order as $\\mathrm{H}-X$ bond length increases from HF to HI.\n$$\n\\mathrm{HF} < \\mathrm{HCl} < \\mathrm{HBr} < \\mathrm{HI}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e430279619d9d8a1307", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The comparatively high b.pt. of $\\mathrm{HF}$ is due to", "image": null}, "options": [{"id": "J1gfz", "text": "high reactivity of fluorine", "image": null, "isCorrect": false}, {"id": "bhdhM", "text": "small size of hydrogen atom", "image": null, "isCorrect": false}, {"id": "wF5XD", "text": "formation of hydrogen bonds and consequent association", "image": null, "isCorrect": true}, {"id": "6Qxxl", "text": "high IE of fluorine", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Intermolecular hydrogen bonding is found in (HF) $_{n}$ due to higher electronegativity of fluorine atoms.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/dutYpVUgfB0EvTWpL-m0nzAuGVhNlUIerFKxnxIlrm4.original.fullsize.png\"><br>\nHydrogen bonding is helpful in the association of HF molecule, so $\\mathrm{HF}$ is found in liquid form.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e430279619d9d8a1303", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Which one of the following can be purified by sublimation ?", "image": null}, "options": [{"id": "xhDva", "text": "$\\mathrm{F}_{2}$", "image": null, "isCorrect": false}, {"id": "QVolU", "text": "$\\mathrm{Cl}_{2}$", "image": null, "isCorrect": false}, {"id": "eTYfY", "text": "$\\mathrm{Br}_{2}$", "image": null, "isCorrect": false}, {"id": "WYTUH", "text": "$\\mathrm{I}_{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In the sublimation, the solids substance converts into vapours directly. Iodine is found in solid state while $\\mathrm{F}_{2}$ and $\\mathrm{Cl}_{2}$ are found in gaseous state and $\\mathrm{Br}_{2}$ is found in liquid state. So, iodine can be purified by sublimation.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e420279619d9d8a1302", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Which one of the following reacts with glass?", "image": null}, "options": [{"id": "g7JtN", "text": "$\\mathrm{H}_{2} \\mathrm{SO}_{4}$", "image": null, "isCorrect": false}, {"id": "twuPZ", "text": "HF", "image": null, "isCorrect": true}, {"id": "Qw2N7", "text": "$\\mathrm{HNO}_{3}$", "image": null, "isCorrect": false}, {"id": "eCPKo", "text": "$\\mathrm{K}_{2} \\mathrm{Cr}_{2} \\mathrm{O}_{7}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Silica $\\left(\\mathrm{SiO}_{2}\\right)$ is present in the glass. This silica react with hydrofluoric acid.\n$$\n\\begin{aligned}\n\\mathrm{SiO}_{2}+4 \\mathrm{HF} \\longrightarrow & \\mathrm{SiF}_{4}+2 \\mathrm{H}_{2} \\mathrm{O} \\\\\n\\mathrm{SiF}_{4}+2 \\mathrm{HF} \\longrightarrow & \\mathrm{H}_{2} \\mathrm{SiF}_{6} \\\\\n\\text { fluorosilicic acid }\n\\end{aligned}\n$$\nNote : HF is used for the etching of glass.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a263300279619d9d8a3cce", "title": "Noble Gases", "totalQuestions": 21, "questions": [{"_id": "6abb887215a9fc0fc8c143c9", "type": "singleCorrect", "question": {"text": "Which of the following inert gases is used in supersonic wind tunnels?", "image": null}, "options": [{"id": "XQ5Vn", "label": "A", "text": "Xenon", "isCorrect": false, "image": null}, {"id": "phWnX", "label": "B", "text": "Argon", "isCorrect": false, "image": null}, {"id": "AMVFC", "label": "C", "text": "Neon", "isCorrect": false, "image": null}, {"id": "vIXlw", "label": "D", "text": "Helium", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Helium is used in supersonic wind tunnels because of its low density and high speed of sound compared to air.<br><br>It is also used as a cooling gas in gas-cooled nuclear reactors and as a diluent for oxygen in deep-sea diving apparatus.<br><br>Answer: Helium", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3458c30a4553e1be1f5", "type": "singleCorrect", "question": {"text": "Which of the following noble gases exhibits higher oxidation states ?", "image": null}, "options": [{"id": "FKEbQ", "label": "A", "text": "Ne", "isCorrect": false, "image": null}, {"id": "0GXGV", "label": "B", "text": "Ar", "isCorrect": false, "image": null}, {"id": "PZ7J0", "label": "C", "text": "Kr", "isCorrect": false, "image": null}, {"id": "bmI2k", "label": "D", "text": "Xe", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "As we move down the group of noble gases, the atomic size increases and the ionization enthalpy decreases.<br><br>Xenon has a relatively low ionization enthalpy, which allows its valence electrons to be excited to empty d-orbitals.<br><br>This enables Xenon to form compounds with highly electronegative elements like fluorine and oxygen.<br><br>Xenon exhibits higher oxidation states such as $+2$, $+4$, $+6$, and $+8$ in compounds like $\\text{XeF}_2$, $\\text{XeF}_4$, $\\text{XeF}_6$, $\\text{XeO}_3$, and $\\text{XeO}_4$.<br><br>Neon and Argon do not form stable compounds, and Krypton only forms $\\text{KrF}_2$ with an oxidation state of $+2$.<br><br>Therefore, Xenon exhibits higher oxidation states.<br><br>Answer: Xe", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3618c30a4553e1be322", "type": "singleCorrect", "question": {"text": "Match the Xenon compounds in Column-1 with its structure in Column-II.<br><table style=\"border: 1px solid black; border-collapse: collapse; width: auto;\"><tr><th style=\"border: 1px solid black; padding: 10px;\">Column – I</th><th style=\"border: 1px solid black; padding: 10px;\">Column – II</th></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(a) $\\text{XeF}_4$</td><td style=\"border: 1px solid black; padding: 10px;\">(i) pyramidal</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(b) $\\text{XeF}_6$</td><td style=\"border: 1px solid black; padding: 10px;\">(ii) square planar</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(c) $\\text{XeOF}_4$</td><td style=\"border: 1px solid black; padding: 10px;\">(iii) distorted octahedral</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(d) $\\text{XeO}_3$</td><td style=\"border: 1px solid black; padding: 10px;\">(iv) square pyramidal</td></tr></table>", "image": null}, "options": [{"id": "ho0M4", "label": "A", "text": "(a) - (ii), (b) - (iii), (c) - (i), (d) - (iv)", "isCorrect": false, "image": null}, {"id": "xhwfB", "label": "B", "text": "(a) - (iii), (b) - (iv), (c) - (i), (d) - (ii)", "isCorrect": false, "image": null}, {"id": "dXIif", "label": "C", "text": "(a) - (i), (b) - (ii), (c) - (iii), (d) - (iv)", "isCorrect": false, "image": null}, {"id": "zORGa", "label": "D", "text": "(a) - (ii), (b) - (iii), (c) - (iv), (d) - (i)", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For $\\text{XeF}_4$: Xenon has $8$ valence electrons. It forms $4$ single bonds with fluorine atoms and has $2$ lone pairs. The hybridization is $sp^3d^2$ and the shape is square planar. Thus, (a) matches (ii).<br><br>For $\\text{XeF}_6$: Xenon forms $6$ single bonds with fluorine atoms and has $1$ lone pair. The hybridization is $sp^3d^3$ and the shape is distorted octahedral. Thus, (b) matches (iii).<br><br>For $\\text{XeOF}_4$: Xenon forms $4$ single bonds with fluorine atoms, $1$ double bond with oxygen, and has $1$ lone pair. The hybridization is $sp^3d^2$ and the shape is square pyramidal. Thus, (c) matches (iv).<br><br>For $\\text{XeO}_3$: Xenon forms $3$ double bonds with oxygen atoms and has $1$ lone pair. The hybridization is $sp^3$ and the shape is pyramidal. Thus, (d) matches (i).<br><br>The correct matching is (a) - (ii), (b) - (iii), (c) - (iv), (d) - (i).<br><br>Answer: (a) - (ii), (b) - (iii), (c) - (iv), (d) - (i)", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be0bf9280d7f9932d31", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What is oxidation state of xenon in xenonmonooxytetrafluoride?", "image": null}, "options": [{"id": "aC6WB", "text": "+2", "image": null, "isCorrect": false}, {"id": "FfIov", "text": "+4", "image": null, "isCorrect": false}, {"id": "cg7ol", "text": "+6", "image": null, "isCorrect": true}, {"id": "wt8ep", "text": "+8", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The chemical formula of xenon monooxytetrafluoride is $XeOF_4$.<br><br>Let the oxidation state of xenon be $x$.<br><br>The oxidation state of oxygen is $-2$ and that of fluorine is $-1$.<br><br>The sum of oxidation states of all atoms in a neutral molecule is zero.<br><br>$x + (-2) + 4(-1) = 0$<br><br>$x - 6 = 0$<br><br>$x = +6$<br><br>Answer: +6", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdbbf9280d7f9932d12", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following xenon compound has chlorine pentafluoride like structure?", "image": null}, "options": [{"id": "rp7iR", "text": "$\\mathrm{XeF}_4$", "image": null, "isCorrect": false}, {"id": "n153S", "text": "$\\mathrm{XeF}_6$", "image": null, "isCorrect": false}, {"id": "W4JSD", "text": "$\\mathrm{XeO}_3$", "image": null, "isCorrect": false}, {"id": "hrlw7", "text": "$\\mathrm{XeOF}_4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Chlorine pentafluoride ($\\mathrm{ClF}_5$) has $7$ valence electrons on the central chlorine atom. It forms $5$ single bonds with fluorine atoms, leaving $1$ lone pair. The steric number is $5 + 1 = 6$, corresponding to $sp^3d^2$ hybridization. Its shape is square pyramidal.<br><br>Let us examine the given xenon compounds:<br><br>For $\\mathrm{XeF}_4$: Xenon has $8$ valence electrons. It forms $4$ single bonds with fluorine, leaving $2$ lone pairs. The shape is square planar.<br><br>For $\\mathrm{XeF}_6$: Xenon forms $6$ single bonds, leaving $1$ lone pair. The shape is distorted octahedral.<br><br>For $\\mathrm{XeO}_3$: Xenon forms $3$ double bonds with oxygen, leaving $1$ lone pair. The shape is trigonal pyramidal.<br><br>For $\\mathrm{XeOF}_4$: Xenon forms $1$ double bond with oxygen and $4$ single bonds with fluorine. Electrons used in bonding $= 2 + 4 = 6$. This leaves $1$ lone pair. The steric number is $5$ (sigma bonds) $+ 1$ (lone pair) $= 6$, corresponding to $sp^3d^2$ hybridization. Its shape is square pyramidal.<br><br>Thus, $\\mathrm{XeOF}_4$ has a square pyramidal structure similar to $\\mathrm{ClF}_5$.<br><br>Answer: $\\mathrm{XeOF}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8dbf9280d7f9932a51", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify from following compounds that valence shell of 'Xe' consists one lone pair of electrons.", "image": null}, "options": [{"id": "MtFPl", "text": "$\\mathrm{XeF}_2$", "image": null, "isCorrect": false}, {"id": "DzjhE", "text": "$\\mathrm{XeF}_4$", "image": null, "isCorrect": false}, {"id": "jcgbu", "text": "$\\mathrm{XeOF}_2$", "image": null, "isCorrect": false}, {"id": "TXboK", "text": "$\\mathrm{XeOF}_4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The central atom Xenon (Xe) has 8 valence electrons.<br><br>For $\\mathrm{XeF}_2$: Xe forms 2 single bonds with F atoms, using 2 electrons. Remaining electrons = $8 - 2 = 6$, which corresponds to 3 lone pairs.<br><br>For $\\mathrm{XeF}_4$: Xe forms 4 single bonds with F atoms, using 4 electrons. Remaining electrons = $8 - 4 = 4$, which corresponds to 2 lone pairs.<br><br>For $\\mathrm{XeOF}_2$: Xe forms 1 double bond with O (using 2 electrons) and 2 single bonds with F (using 2 electrons). Remaining electrons = $8 - 4 = 4$, which corresponds to 2 lone pairs.<br><br>For $\\mathrm{XeOF}_4$: Xe forms 1 double bond with O (using 2 electrons) and 4 single bonds with F (using 4 electrons). Remaining electrons = $8 - 6 = 2$, which corresponds to 1 lone pair.<br><br>Therefore, $\\mathrm{XeOF}_4$ has exactly one lone pair of electrons on the central Xe atom.<br><br>Answer: $\\mathrm{XeOF}_4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b89bf9280d7f9932a29", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following inert gases is used for magnetic resonance imaging?", "image": null}, "options": [{"id": "vbYrl", "text": "He", "image": null, "isCorrect": true}, {"id": "3vG5v", "text": "Ne", "image": null, "isCorrect": false}, {"id": "paWja", "text": "Ar", "image": null, "isCorrect": false}, {"id": "Q9Wav", "text": "Xe", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Liquid helium is used as a cryogenic agent to cool the superconducting magnets used in magnetic resonance imaging (MRI) systems and nuclear magnetic resonance (NMR) spectrometers.<br><br>Therefore, helium (He) is the inert gas used for this purpose.<br><br>Answer: He", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792141f0aee93fa0796de26", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Which group element from following achieves noble gas configuration after gaining two electrons?", "image": null}, "options": [{"id": "akboH", "text": "Group-14", "image": null, "isCorrect": false}, {"id": "P5RMG", "text": "Group-15", "image": null, "isCorrect": false}, {"id": "Qtnps", "text": "Group-16", "image": null, "isCorrect": true}, {"id": "5jXGI", "text": "Group-13", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Elements of Group 16 have the general valence shell electronic configuration $ns^2 np^4$.<br><br>To achieve the stable noble gas configuration ($ns^2 np^6$), they need to gain two electrons.<br><br>For example, Oxygen (Group 16) has the configuration $1s^2 2s^2 2p^4$. By gaining two electrons, it forms $O^{2-}$ with the configuration $1s^2 2s^2 2p^6$, which is the stable noble gas configuration of Neon.<br><br>Answer: Group-16", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262470279619d9d8a3340", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Which noble gas element from following exhibits highest number of different oxidation states?", "image": null}, "options": [{"id": "e61V1", "text": "$\\mathrm{Xe}$", "image": null, "isCorrect": true}, {"id": "3DItm", "text": "$\\mathrm{Kr}$", "image": null, "isCorrect": false}, {"id": "q2uya", "text": "$\\mathrm{Ar}$", "image": null, "isCorrect": false}, {"id": "OR5N9", "text": "$\\mathrm{Ne}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Xenon has large atomic size and lower ionisation enthalpy compared to $\\mathrm{He}, \\mathrm{Ne}, \\mathrm{Ar}$ and $\\mathrm{Kr}$. Hence, xenon exhibits highest number of different oxidation states.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261530279619d9d8a2ba3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "Identify the gases used to fill in electric bulbs?", "image": null}, "options": [{"id": "lNDrX", "text": "Ar and $\\mathrm{N}_2$", "image": null, "isCorrect": true}, {"id": "NPW1z", "text": "He and $\\mathrm{O}_2$", "image": null, "isCorrect": false}, {"id": "mStiH", "text": "$\\mathrm{He}$ and $\\mathrm{N}_2$", "image": null, "isCorrect": false}, {"id": "oXJlv", "text": "$\\mathrm{Ne}$ and $\\mathrm{He}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Theory based.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260bc0279619d9d8a26e1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "Identify the use of mixture of $\\mathrm{Ar}$ and $\\mathrm{N}_2$ from following.", "image": null}, "options": [{"id": "cT9Db", "text": "For magnetic resonance imaging", "image": null, "isCorrect": false}, {"id": "aAfxT", "text": "For production of lasers", "image": null, "isCorrect": false}, {"id": "CDTGt", "text": "To fill in electric bulbs", "image": null, "isCorrect": true}, {"id": "GGJh1", "text": "To produce low temperature for research work", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The filament in an electric bulb is made using tungsten which would burn quickly when it comes in contact with the oxygen in the air. This is the reason why unreactive gases such as argon and nitrogen are used for filling an electric bulb. These gases are chemically inactive.\nHence, bulbs are filled with chemically inactive Nitrogen or Argon gas in order to prevent the oxidation of tungsten filament used in the bulb.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260840279619d9d8a2521", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "Identify use of argon from following.", "image": null}, "options": [{"id": "mYgoN", "text": "In supersonic wind tunnels", "image": null, "isCorrect": false}, {"id": "PERTA", "text": "For magnetic resonance imaging", "image": null, "isCorrect": false}, {"id": "82az9", "text": "For producing inert atmosphere in welding", "image": null, "isCorrect": true}, {"id": "1W8eT", "text": "For production of lasers", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Argon is used in the welding of specialty alloys as well as in the welding of automobile frames, mufflers and other automotive parts. It is called a shield gas because it does not react with whatever gases and metals are hovering in the vicinity of the metals being welded; it merely takes up space and prevents other, unwanted reactions from occurring nearby owing to reactive gases such as nitrogen and oxygen.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260620279619d9d8a2409", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "Which among the following noble gases reacts with fluorine to given crystalline fluorides?", "image": null}, "options": [{"id": "7eXSg", "text": "Ne", "image": null, "isCorrect": false}, {"id": "4WMEt", "text": "He", "image": null, "isCorrect": false}, {"id": "Wojx3", "text": "Xe", "image": null, "isCorrect": true}, {"id": "PbLf5", "text": "Ar", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ionisation enthalpy decreases on moving down the group and $\\mathrm{Xe}$ has the lowest ionization enthalpy. This is the reason that stable fluorides for noble gases are reported only with Xe.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260170279619d9d8a21ab", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "Which of the following pairs of inert gases is used in flash bulb?", "image": null}, "options": [{"id": "5chUM", "text": "$\\mathrm{Xe}$ and $\\mathrm{He}$", "image": null, "isCorrect": false}, {"id": "m8H4p", "text": "$\\mathrm{Xe}$ and $\\mathrm{Kr}$", "image": null, "isCorrect": true}, {"id": "dUF7n", "text": "$\\mathrm{Xe}$ and $\\mathrm{Rn}$", "image": null, "isCorrect": false}, {"id": "PSfut", "text": "$\\mathrm{Xe}$ and $\\mathrm{Ar}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{Xe}$ and $\\mathrm{Kr}$ are used in flash bulbs.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructur 9619d9d8a1738", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}], "question": {"text": "Which element among the following does <u><b>NOT</b></u> form diatomic molecules?", "image": null}, "options": [{"id": "z1pfr", "text": "Argon", "image": null, "isCorrect": true}, {"id": "XMMx9", "text": "Oxygen", "image": null, "isCorrect": false}, {"id": "D6toq", "text": "Nitrogen", "image": null, "isCorrect": false}, {"id": "QEyZb", "text": "Bromine", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Argon does not form diatomic molecules.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eb40279619d9d8a169e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "The most abundant noble gas in the atmosphere is", "image": null}, "options": [{"id": "osnPL", "text": "Neon", "image": null, "isCorrect": false}, {"id": "CgEQB", "text": "Argon", "image": null, "isCorrect": true}, {"id": "day7X", "text": "Xenon", "image": null, "isCorrect": false}, {"id": "0MEQm", "text": "Krypton", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Argon is the most abundant noble gas present in the atmosphere.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9f0279619d9d8a15f0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "Which of the following compound of xenon does not exists?", "image": null}, "options": [{"id": "J2Sum", "text": "XeF $_{6}$", "image": null, "isCorrect": false}, {"id": "XBAQz", "text": "$\\mathrm{XeF}_{4}$", "image": null, "isCorrect": false}, {"id": "tMr2Z", "text": "$\\mathrm{XeF}_{5}$", "image": null, "isCorrect": true}, {"id": "mXBy9", "text": "$\\mathrm{XeF}_{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Xenon forms following fluorides\n$\\mathrm{XeF}_{2}, \\mathrm{XeF}_{4}$ and $\\mathrm{XeF}_{6}$\nIt does not exists as $\\mathrm{XeF}_{5}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
