rect": false}], "correctValue": null, "solution": {"text": "Citric acid is a tricarboxylic acid.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9f0279619d9d8a15ef", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "Which of the following acids does not contain\n-COOH group?", "image": null}, "options": [{"id": "pxlnj", "text": "Carbamic acid", "image": null, "isCorrect": false}, {"id": "kDZru", "text": "Barbituric acid", "image": null, "isCorrect": true}, {"id": "0Qy5C", "text": "Lactic acid", "image": null, "isCorrect": false}, {"id": "k2gNY", "text": "Succinic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Carbamic acid $\\quad \\mathrm{HOOC}-\\mathrm{NH}_{2}$\n(b) Barbituric acid $\\quad \\mathrm{C}_{4} \\mathrm{H}_{4} \\mathrm{~N}_{2} \\mathrm{O}_{3}$\n(c) Lactic acid\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/__yJWLDB_gDm_yD1Psbb7W6Nz7qaoBX8GywtRlTpQJo.original.fullsize.png\"><br>\n(d) Succinic acid HOOC $-\\mathrm{CH}_{2}-\\mathrm{CH}_{2}-\\mathrm{COOH}$\nTherefore, barbituric acid is actually not an acid.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e440279619d9d8a130d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Lemon gives sour taste because of", "image": null}, "options": [{"id": "BAaYW", "text": "citric acid", "image": null, "isCorrect": true}, {"id": "uUl9g", "text": "tartaric acid", "image": null, "isCorrect": false}, {"id": "PTa29", "text": "oxalic acid", "image": null, "isCorrect": false}, {"id": "xCTgI", "text": "acetic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Citric acid is found in lemon. Therefore, lemon gives sour taste.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263340279619d9d8a3cf8", "title": "Reaction Involving Cleavage of –OH Group", "totalQuestions": 8, "questions": [{"_id": "6abb88b315a9fc0fc8c1462e", "type": "singleCorrect", "question": {"text": "Which of the following reactions is used to prepare acid anhydride?", "image": null}, "options": [{"id": "ts5MM", "label": "A", "text": "By heating sodium salt of carboxylic acid with NaOH in the presence of CaO.", "isCorrect": false, "image": null}, {"id": "8M95H", "label": "B", "text": "By heating carboxylic acid in excess with $\\text{P}_2\\text{O}_5$.", "isCorrect": true, "image": null}, {"id": "GQDzZ", "label": "C", "text": "By reacting carboxylic acids with $\\text{LiAlH}_4$.", "isCorrect": false, "image": null}, {"id": "hjeaR", "label": "D", "text": "By heating Carboxylic acids with $\\text{SOCl}_2$.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Heating a sodium salt of a carboxylic acid with NaOH and CaO (soda lime) results in decarboxylation, yielding an alkane.<br><br>Heating a carboxylic acid with a strong dehydrating agent like $\\text{P}_2\\text{O}_5$ or concentrated $\\text{H}_2\\text{SO}_4$ removes a molecule of water from two molecules of the acid, forming an acid anhydride. The reaction is: $2\\text{RCOOH} \\xrightarrow{\\text{P}_2\\text{O}_5, \\Delta} (\\text{RCO})_2\\text{O} + \\text{H}_2\\text{O}$.<br><br>Reacting a carboxylic acid with $\\text{LiAlH}_4$ reduces it to a primary alcohol.<br><br>Heating a carboxylic acid with $\\text{SOCl}_2$ converts it into an acid chloride.<br><br>Answer: By heating carboxylic acid in excess with $\\text{P}_2\\text{O}_5$.", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888315a9fc0fc8c1446b", "type": "singleCorrect", "question": {"text": "Identify the product obtained when acetic acid reacts with $\\text{PCl}_5$.", "image": null}, "options": [{"id": "fqBfv", "label": "A", "text": "$\\text{CH}_2\\text{ClCOOH}$", "isCorrect": false, "image": null}, {"id": "aBHVf", "label": "B", "text": "$\\text{CH}_3\\text{COOCl}$", "isCorrect": false, "image": null}, {"id": "LF2o1", "label": "C", "text": "$\\text{CH}_3\\text{COCl}$", "isCorrect": true, "image": null}, {"id": "dvlVY", "label": "D", "text": "$\\text{CHCl}_2\\text{COOH}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reaction of acetic acid with phosphorus pentachloride yields acetyl chloride, phosphoryl chloride, and hydrogen chloride.<br><br>$\\text{CH}_3\\text{COOH} + \\text{PCl}_5 \\rightarrow \\text{CH}_3\\text{COCl} + \\text{POCl}_3 + \\text{HCl}$<br><br>The main product obtained is acetyl chloride ($\\text{CH}_3\\text{COCl}$).<br><br>Answer: $\\text{CH}_3\\text{COCl}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30b8c30a4553e1bdf8b", "type": "singleCorrect", "question": {"text": "Identify the reagent used in following reaction.<br>$\\text{Benzoic acid} \\xrightarrow[\\Delta]{\\large{\\text{Reagent}}} \\text{Benzoyl chloride} + \\text{phosphorous oxychloride} + \\text{Hydrogen chloride}$", "image": null}, "options": [{"id": "o49oS", "label": "A", "text": "$\\text{PCl}_3$", "isCorrect": false, "image": null}, {"id": "epk85", "label": "B", "text": "$\\text{HCl}$", "isCorrect": false, "image": null}, {"id": "TQlYY", "label": "C", "text": "$\\text{PCl}_5$", "isCorrect": true, "image": null}, {"id": "3hD0T", "label": "D", "text": "$\\text{SOCl}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The reaction of benzoic acid with phosphorus pentachloride ($\\text{PCl}_5$) yields benzoyl chloride, phosphorus oxychloride ($\\text{POCl}_3$), and hydrogen chloride ($\\text{HCl}$).<br><br>$\\text{C}_6\\text{H}_5\\text{COOH} + \\text{PCl}_5 \\xrightarrow{\\Delta} \\text{C}_6\\text{H}_5\\text{COCl} + \\text{POCl}_3 + \\text{HCl}$<br><br>Thus, the reagent used is $\\text{PCl}_5$.<br><br>Answer: $\\text{PCl}_5$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260d20279619d9d8a2796", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "Identify the product ' $\\mathrm{B}$ ' in the following series of reaction.\n$\\mathrm{CH}_3 \\mathrm{COOH}+\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{OH} \\underset{\\mathrm{H}}{\\stackrel{\\mathrm{H}^{+}}{\\rightleftharpoons}} \\mathrm{A} \\underset{\\mathrm{Ni} / \\mathrm{Pd}, \\Delta}{\\stackrel{\\mathrm{H}_2}{\\longrightarrow}} \\mathrm{B}$", "image": null}, "options": [{"id": "O8sid", "text": "$\\mathrm{CH}_3 \\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "i1eUj", "text": "$\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{OH}$", "image": null, "isCorrect": true}, {"id": "zyijK", "text": "$\\mathrm{CH}_3 \\mathrm{CH}_2-\\mathrm{O}-\\mathrm{CH}_3$", "image": null, "isCorrect": false}, {"id": "77IJm", "text": "$\\mathrm{CH}_3 \\mathrm{CH}_2-\\mathrm{O}-\\mathrm{CH}_2 \\mathrm{CH}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/fg4-Iq9Xkob-snUsCGyL5zNt-ZS8xDNRyoZ87JmgRjA.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260160279619d9d8a21a7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "Identify ' $A^{\\prime}$ in the following reaction\nSalicylic acid $\\stackrel{\\text { Acetic anthydride }}{\\longrightarrow} \\mathrm{A}$", "image": null}, "options": [{"id": "B0As9", "text": "Aspirin", "image": null, "isCorrect": true}, {"id": "D9V1J", "text": "Methyl salicylate", "image": null, "isCorrect": false}, {"id": "hYHVw", "text": "BHT", "image": null, "isCorrect": false}, {"id": "qZKmq", "text": "Steric acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Rzik90esisvmcg2hiuL8Y6gR1GkScizQEgDW4z0dImk.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed60279619d9d8a17ae", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "Which of the following carboxylic acids is most reactive towards esterification?", "image": null}, "options": [{"id": "z8t65", "text": "<math><msub><mrow><mfenced separators=\"|\"><mrow><mi>C</mi><msub><mrow><mi>H</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msub><mi>C</mi><mi>C</mi><mi>O</mi><mi>O</mi><mi>H</mi></math>", "image": null, "isCorrect": false}, {"id": "Qw5SV", "text": "<math><msub><mrow><mfenced separators=\"|\"><mrow><mi>C</mi><msub><mrow><mi>H</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub><mi>C</mi><mi>H</mi><mi>C</mi><mi>O</mi><mi>O</mi><mi>H</mi></math>", "image": null, "isCorrect": false}, {"id": "tOBKY", "text": "<math><mi>C</mi><msub><mrow><mi>H</mi></mrow><mrow><mn>3</mn></mrow></msub><mi>C</mi><msub><mrow><mi>H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi>C</mi><mi>O</mi><mi>O</mi><mi>H</mi></math>", "image": null, "isCorrect": true}, {"id": "3kEYD", "text": "<math><msub><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi>H</mi></mrow><mrow><mn>5</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub><mi>C</mi><mi>H</mi><mi>C</mi><mi>O</mi><mi>O</mi><mi>H</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\mathrm{CH}_{3} \\mathrm{CH}_{2} \\mathrm{COOH}\\) is most reactive towards esterification as \\(\\mathrm{C}\\) atom of carboxylic group is stericaly least hindered. Greater is the steric hinderance, lower is the reactivity.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7b0279619d9d8a14c8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "$\\mathrm{CH}_{3} \\mathrm{COOH}$ when reacts with $\\mathrm{C}_{2} \\mathrm{H}_{5} \\mathrm{OH}$ gives a\nproduct. The same product is obtained by which reaction?", "image": null}, "options": [{"id": "Tg5Wb", "text": "Acetic acid + methanol", "image": null, "isCorrect": false}, {"id": "t2Mey", "text": "Acetic anhydride $+$ water", "image": null, "isCorrect": false}, {"id": "yCnPd", "text": "Acetic anhydride $+$ ethanol", "image": null, "isCorrect": true}, {"id": "QpfeS", "text": "Acetamide $+$ methanol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Acids when react with alcohols form ester. Thus,\n$$\n\\mathrm{CH}_{3} \\mathrm{COOH}+\\mathrm{C}_{2} \\mathrm{H}_{5} \\mathrm{OH} \\longrightarrow \\mathrm{CH}_{3} \\mathrm{COOC}_{2} \\mathrm{H}_{5}+\\mathrm{H}_{2} \\mathrm{O}\n$$\nethyl ethanoate\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/NFLryZ_AsnLqBC5N2FBBTXdmXzVUNQ9ApyNU3kVxXaI.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e450279619d9d8a1315", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Reaction of acids with alcohols is also known as", "image": null}, "options": [{"id": "8ashN", "text": "esterification", "image": null, "isCorrect": true}, {"id": "vt455", "text": "saponification", "image": null, "isCorrect": false}, {"id": "ufL2F", "text": "alkalisation", "image": null, "isCorrect": false}, {"id": "Asbg0", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Acids react with alcohols give ester, this process is known as esterification.\n$$\n\\mathrm{RCOOH}+\\mathrm{R}^{\\prime} \\mathrm{OH} \\longrightarrow \\mathrm{RCOOR}^{\\prime}\n$$\nacid $\\quad$ alcohol ester", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263340279619d9d8a3cf9", "title": "Reactions Involving Acid Group", "totalQuestions": 10, "questions": [{"_id": "679213ae0aee93fa0796dab2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Identify the product $X$ in the following reaction.\r\nSodium propanoate $\\xrightarrow[\\Delta]{\\text { soda-lime }} X+$ sodium carbonate", "image": null}, "options": [{"id": "XQn9z", "text": "Propane", "image": null, "isCorrect": false}, {"id": "ANbFG", "text": "Ethane", "image": null, "isCorrect": true}, {"id": "vMsmQ", "text": "Methane", "image": null, "isCorrect": false}, {"id": "jIbMG", "text": "Butane", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction of sodium propanoate with soda-lime is a decarboxylation reaction.<br><br>$CH_3CH_2COONa + NaOH \\xrightarrow{CaO, \\Delta} CH_3CH_3 + Na_2CO_3$<br><br>The alkyl group attached to the carboxylate group is an ethyl group ($CH_3CH_2-$). Upon decarboxylation, it gains a hydrogen atom to form ethane ($C_2H_6$).<br><br>Therefore, the product $X$ is ethane.<br><br>Answer: Ethane", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262820279619d9d8a351c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Which among the following is NOT dicarboxylic acid?", "image": null}, "options": [{"id": "fURIk", "text": "Malonic acid", "image": null, "isCorrect": false}, {"id": "atQaq", "text": "Caproic acid", "image": null, "isCorrect": true}, {"id": "cGhz7", "text": "Glutaric Acid", "image": null, "isCorrect": false}, {"id": "7zzOw", "text": "Succinic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>A dicarboxylic acid contains two carboxyl functional groups. Malonic acid (HOOC-CH$_{2}$-COOH), glutaric acid (HOOC-(CH$_{2}$)$_{3}$-COOH), and succinic acid (HOOC-(CH$_{2}$)$_{2}$-COOH) all possess this structural feature.</p><p>Caproic acid (CH$_{3}$(CH$_{2}$)$_{4}$COOH) contains only one carboxyl group, classifying it as a monocarboxylic acid.</p><p>The compound that is not a dicarboxylic acid is $\\boxed{B}$.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262340279619d9d8a32a4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Which among the following is dicarboxylic acid?", "image": null}, "options": [{"id": "jB8Hz", "text": "Valeric acid", "image": null, "isCorrect": false}, {"id": "qjwHx", "text": "Caproic acid", "image": null, "isCorrect": false}, {"id": "mAYdh", "text": "Glutaric acid", "image": null, "isCorrect": true}, {"id": "XGYsC", "text": "Butyric acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>To identify the dicarboxylic acid, we examine the carboxyl group count for each compound.</p><p>Valeric acid (pentanoic acid) has formula $\\text{CH}_3(\\text{CH}_2)_3\\text{COOH}$, containing one carboxyl group and is thus monocarboxylic.</p><p>Caproic acid (hexanoic acid) is $\\text{CH}_3(\\text{CH}_2)_4\\text{COOH}$, also monocarboxylic.</p><p>Glutaric acid (pentanedioic acid) has structure $\\text{HOOC}(\\text{CH}_2)_3\\text{COOH}$, with two carboxyl groups, making it dicarboxylic.</p><p>Butyric acid (butanoic acid) is $\\text{CH}_3(\\text{CH}_2)_2\\text{COOH}$, again monocarboxylic.</p><p><strong>The dicarboxylic acid is glutaric acid.</strong></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260bd0279619d9d8a26e7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "Identify the products of following reaction:\n$$\n\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{COOC}_2 \\mathrm{H}_5 \\underset{\\text { dil. } \\mathrm{H}_2 \\mathrm{SO}_4}{\\longrightarrow}\n$$", "image": null}, "options": [{"id": "SuMam", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{OH}+\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "3rdAc", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{COOH}+\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{COOH}$", "image": null, "isCorrect": false}, {"id": "9AOp9", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{COOH}+\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{OH}$", "image": null, "isCorrect": true}, {"id": "n8Epd", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{OH}+\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{COOH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/AcuP29tVgKSdgxVbbvXSgNWu9XO9WpIeWRwNrFB2iSc.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fde0279619d9d8a1fe3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "Which of the following reactions involves $\\alpha$ -halogenation of carboxylic acid?", "image": null}, "options": [{"id": "OCyqT", "text": "Gattermann reaction", "image": null, "isCorrect": false}, {"id": "npzoW", "text": "Riemer - Tiemann reaction", "image": null, "isCorrect": false}, {"id": "y9TEb", "text": "Sandmeyer reaction", "image": null, "isCorrect": false}, {"id": "Zt2fn", "text": "Hell-Vohlard-Zelinsky reaction", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Hell Volhard Zelinsky (HVZ) reaction:\nThis reaction involves alpha bromination of carboxylic acids. Carboxylic acids react with chlorine or bromine in presence of small amount of red phosphorous to give alpha halo carboxylic acids.\n$\\mathrm{CH}_{3}-\\mathrm{CH}_{2}-\\mathrm{COOH} \\stackrel{\\mathrm{Br}_{2} / \\mathrm{P}}{\\rightarrow} \\mathrm{CH}_{3}-\\mathrm{CHBr}-\\mathrm{COOH} \\stackrel{\\mathrm{Br}_{2} / \\mathrm{P}}{\\rightarrow} \\mathrm{CH}_{3}-\\mathrm{CBr}_{2}-$\n$\\mathrm{COOH} \\stackrel{\\mathrm{Br}_{2} / \\mathrm{P}}{\\longrightarrow}$ No further reaction.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f470279619d9d8a1b2c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "Which of the following acids, does NOT undergo Hell-Vohlard-Zelinsky reaction?", "image": null}, "options": [{"id": "YSGzP", "text": "Butanoic acid", "image": null, "isCorrect": false}, {"id": "qvSUf", "text": "Propanoic acid", "image": null, "isCorrect": false}, {"id": "nNu2c", "text": "Ethanoic acid", "image": null, "isCorrect": false}, {"id": "Pt5Y5", "text": "Methanoic acid", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Carboxylic acid which contain a – hydrogen atom reacts with chlorine or bromine in presence of red phosphorus to give a – chloro or a – bromo acids. This reaction is called H.V.Z (Hell Volhard Zelinsky ) reaction. CH3COOH ? CCl3COOH(trichloroacetic acid). CH3CH2COOH ? CH3CBr2COOH (a,a-dibromopropionic acid) Due to absence of a – H atom HCOOH does not undergo HVZ reaction.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9f0279619d9d8a15ee", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The reaction of sodium acetate and sodalime gives", "image": null}, "options": [{"id": "6VtHg", "text": "butane", "image": null, "isCorrect": false}, {"id": "fxX43", "text": "ethane", "image": null, "isCorrect": false}, {"id": "FO7UU", "text": "methane", "image": null, "isCorrect": true}, {"id": "xyybs", "text": "propane", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\underset{\\text { sodium acetate }}{\\mathrm{CH}_{3} \\mathrm{COOH}}+\\underset{\\text { sodalime }}{\\mathrm{NaOH}} \\longrightarrow \\underset{\\text { methane }}{\\mathrm{CH}_{4}}$\n\\begin{array}{c}+\\mathrm{Na}_{2} \\mathrm{CO}_{3} \\\\ \\text { sodium } \\\\ \\text { carbonate }\\end{array}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e900279619d9d8a1573", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "Decarboxylation of malonic acid gives", "image": null}, "options": [{"id": "aCNRY", "text": "$\\mathrm{CH}_{4}$", "image": null, "isCorrect": false}, {"id": "UmMvz", "text": "$\\mathrm{CH}_{3} \\mathrm{COOH}$", "image": null, "isCorrect": true}, {"id": "w8hES", "text": "Both (a) and (b)", "image": null, "isCorrect": false}, {"id": "DOCjR", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Decarboxylation of malonic acid gives acetic acid and $\\mathrm{CO}_{2}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/JNy1Qkj66lM8fa2VSC837f9cuLYf3f9o9dMmqbe 9:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "End product of the following reaction is\n$$\n\\mathrm{CH}_{3} \\mathrm{CH}_{2} \\mathrm{COOH} \\frac{\\mathrm{Cl}_{2}}{\\text { red } \\mathrm{P}} X \\stackrel{\\mathrm{Alc} \\mathrm{KOH}}{\\longrightarrow}\n$$", "image": null}, "options": [{"id": "qPXe8", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/8YMayfChhDC8uezq7-Btq_if91EwA4WAuWKesZDs8_c.original.fullsize.png\">", "image": null, "isCorrect": false}, {"id": "ywFmW", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/p_Sxtq4QqS_SMJOzJi6EPg7J15tdDqnj8Yxoc_rCOt4.original.fullsize.png\">", "image": null, "isCorrect": false}, {"id": "0JItQ", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/OdJGTOYZgolOeHUQYUm7PThGqPolv4BiFmCx1x3tbaU.original.fullsize.png\">", "image": null, "isCorrect": true}, {"id": "q2CzQ", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Qi8ytvl8EMsdxGQJw-uRANh7cuxPla9oYD7CIs4LAI4.original.fullsize.png\">", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/KrpShBJ_RVn3GrOgYDYVmWNv509SvdQ3bZXEC94-LOg.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/rDubAD7vMdCgFEXXLKScE1yN-vCvxJqZlumA6g3zKLI.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263340279619d9d8a3cf7", "title": "Abnormal Behaviour of Formic Acid", "totalQuestions": 4, "questions": [{"_id": "6a44d3378c30a4553e1be16c", "type": "singleCorrect", "question": {"text": "What is the common name for the simplest carboxylic acid, HCOOH ?", "image": null}, "options": [{"id": "5omwo", "label": "A", "text": "Acetic acid", "isCorrect": false, "image": null}, {"id": "Xgjuh", "label": "B", "text": "Formic acid", "isCorrect": true, "image": null}, {"id": "SQxOq", "label": "C", "text": "Propanoic acid", "isCorrect": false, "image": null}, {"id": "AH4mH", "label": "D", "text": "Butanoic acid", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The simplest carboxylic acid is $HCOOH$.<br><br>Its IUPAC name is methanoic acid.<br><br>Its common name is formic acid, derived from the Latin word 'formica' meaning ant, as it was first isolated from the destructive distillation of ants.<br><br>Answer: Formic acid", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9e0279619d9d8a15ea", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "Which of the following statement is false?", "image": null}, "options": [{"id": "Fr9JF", "text": "$40 \\%$ solution HCHO is known as formalin", "image": null, "isCorrect": false}, {"id": "5mZvB", "text": "HCHO is least reactive in its homologous series", "image": null, "isCorrect": true}, {"id": "CLINd", "text": "The boiling point of iso-vareladehyde is less than $n$ -varelaldehyde (4)", "image": null, "isCorrect": false}, {"id": "hutgH", "text": "The boiling point of ketones are higher than that of aldehydes", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Formaldehyde is the most reactive in its homologous series. Order of reactivity of some aldehydes is as follows $\\mathrm{HCHO}>\\mathrm{CH}_{3} \\mathrm{CHO}>\\mathrm{CH}_{3} \\mathrm{CH}_{2} \\mathrm{CHO}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e670279619d9d8a1422", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "The compound from which formic acid cannot be prepared is", "image": null}, "options": [{"id": "LbF8o", "text": "methyl alcohol", "image": null, "isCorrect": false}, {"id": "JC8L6", "text": "carbon monoxide $+\\mathrm{NaOH}$", "image": null, "isCorrect": false}, {"id": "GsifY", "text": "glycerol", "image": null, "isCorrect": false}, {"id": "kuL0p", "text": "methyl magnesium bromide", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Formic acid (HCOOH) cannot be prepared from methyl magnesium bromide $\\left(\\mathrm{CH}_{3} \\mathrm{MgBr}\\right)$ while from all other reagents, it is obtained as\n(a) $\\quad \\mathrm{CH}_{3} \\mathrm{OH} \\quad \\stackrel{[\\mathrm{O}]}{\\longrightarrow} \\mathrm{HCHO} \\stackrel{[\\mathrm{O}]}{\\longrightarrow} \\mathrm{HCOOH}$\nmethyl alcohol\n(b) $\\mathrm{CO}+\\mathrm{NaOH} \\longrightarrow \\mathrm{HCOONa} \\frac{\\mathrm{NaHSO}_{4}}{\\Delta}$\n$\\mathrm{HCOOH}+\\mathrm{Na}_{2} \\mathrm{SO}_{4}$\n(c) Glycerol + Oxalic acid $\\frac{383 \\mathrm{~K}}{\\mathrm{H}_{2} \\mathrm{O}}$ HCOOH\n$+$ glycerol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e440279619d9d8a1311", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "Corrosive sublimate $\\left(\\mathrm{HgCl}_{2}\\right)$ can be used to distinguish between", "image": null}, "options": [{"id": "Mw3Hu", "text": "formic acid and acetic acid", "image": null, "isCorrect": true}, {"id": "gilZb", "text": "acetaldehyde and butanone", "image": null, "isCorrect": false}, {"id": "3p4RI", "text": "formaldehyde and propanone", "image": null, "isCorrect": false}, {"id": "MvrJ3", "text": "All of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Corrosive sublimate gives black ppt of calomel with formic acid but it does not react with acetic acid.\n$$\n2 \\mathrm{HCOOH}+2 \\mathrm{HgCl}_{2} \\longrightarrow \\mathrm{Hg}_{2} \\mathrm{Cl}_{2}+\\mathrm{CO}_{2}+\\mathrm{H}_{2} \\mathrm{O}\n$$\n$\\mathrm{CH}_{3} \\mathrm{COOH}+\\mathrm{HgCl}_{2} \\longrightarrow$ No reaction", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a263340279619d9d8a3cfb", "title": "Preparation and Properties of Acid Derivatives", "totalQuestions": 19, "questions": [{"_id": "6a44d3628c30a4553e1be32e", "type": "singleCorrect", "question": {"text": "Which of the following species is used in Friedel - Craft reaction?", "image": null}, "options": [{"id": "15V5l", "label": "A", "text": "<img style=\"width: 100px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/11_april_shift_2__q92_d1.png\" />", "isCorrect": true, "image": null}, {"id": "j0Wk5", "label": "B", "text": "<img style=\"width: 145px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/11_april_shift_2__q92_d2.png\" />", "isCorrect": false, "image": null}, {"id": "yydAu", "label": "C", "text": "<img style=\"width: 135px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/11_april_shift_2__q92_d3.png\" />", "isCorrect": false, "image": null}, {"id": "qYf43", "label": "D", "text": "<img style=\"width: 100px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/11_april_shift_2__q92_d4.png\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Friedel-Crafts acylation is an electrophilic aromatic substitution reaction where an acyl group is introduced into an aromatic ring. The reagents typically used for this reaction are acyl halides (such as acid chlorides, $R-CO-Cl$) or acid anhydrides, in the presence of a Lewis acid catalyst like anhydrous $AlCl_3$.<br><br>Among the given options, $R-CO-Cl$ (acid chloride) is the correct species used in the Friedel-Crafts acylation reaction.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bedbf9280d7f9932db3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify product obtained when acyl chloride undergoes hydrolysis.", "image": null}, "options": [{"id": "3XxGl", "text": "Carboxylic acids", "image": null, "isCorrect": true}, {"id": "MEAA6", "text": "Alcohols", "image": null, "isCorrect": false}, {"id": "QDOOt", "text": "Aldehydes", "image": null, "isCorrect": false}, {"id": "YCRIX", "text": "Esters", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Acyl chlorides (acid chlorides) react with water to form carboxylic acids. The reaction is a nucleophilic acyl substitution where the chloride ion is replaced by a hydroxyl group.<br><br>$R-COCl + H_2O \\rightarrow R-COOH + HCl$<br><br>Therefore, the product obtained when an acyl chloride undergoes hydrolysis is a carboxylic acid.<br><br>Answer: Carboxylic acids", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bddbf9280d7f9932d1a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify ' B ' in the following sequence of reactions.\nAcetic acid $\\xrightarrow[\\Delta]{\\text { Thionyl chloride }} \\mathrm{A} \\xrightarrow{\\text { Ammonia }} \\mathrm{B}$", "image": null}, "options": [{"id": "mLr15", "text": "Ethyl amine", "image": null, "isCorrect": false}, {"id": "NjOaJ", "text": "Ammonium acetate", "image": null, "isCorrect": false}, {"id": "1VRPJ", "text": "Acetyl chloride", "image": null, "isCorrect": false}, {"id": "ra4yU", "text": "Acetamide", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Acetic acid reacts with thionyl chloride ($\\mathrm{SOCl_2}$) upon heating to form acetyl chloride as the major product.<br><br>$\\mathrm{CH_3COOH} + \\mathrm{SOCl_2} \\xrightarrow{\\Delta} \\mathrm{CH_3COCl} + \\mathrm{SO_2} + \\mathrm{HCl}$<br><br>Thus, compound A is acetyl chloride.<br><br>Acetyl chloride then reacts with ammonia ($\\mathrm{NH_3}$) to form acetamide.<br><br>$\\mathrm{CH_3COCl} + 2\\mathrm{NH_3} \\rightarrow \\mathrm{CH_3CONH_2} + \\mathrm{NH_4Cl}$<br><br>Thus, compound B is acetamide.<br><br>Answer: Acetamide", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbcbf9280d7f9932bfc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product formed in the following reaction.\n$\\left(\\mathrm{CH}_3 \\mathrm{CO}\\right)_2 \\mathrm{O} \\xrightarrow{\\mathrm{H}_2 \\mathrm{O}} \\text { Product }$", "image": null}, "options": [{"id": "9oW43", "text": "$\\mathrm{CH}_3 \\mathrm{COCH}_3$", "image": null, "isCorrect": false}, {"id": "L1XEU", "text": "$\\mathrm{CH}_3-\\mathrm{CHO}$", "image": null, "isCorrect": false}, {"id": "s9Kzn", "text": "$\\mathrm{CH}_3-\\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "YRvkp", "text": "$\\mathrm{CH}_3 \\mathrm{COOH}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given reactant is acetic anhydride, $(\\mathrm{CH}_3\\mathrm{CO})_2\\mathrm{O}$.<br><br>When acetic anhydride undergoes hydrolysis by reacting with water, it cleaves to form two molecules of acetic acid.<br><br>The chemical equation for the reaction is:<br><br>$(\\mathrm{CH}_3\\mathrm{CO})_2\\mathrm{O} + \\mathrm{H}_2\\mathrm{O} \\rightarrow 2\\mathrm{CH}_3\\mathrm{COOH}$<br><br>Thus, the product formed is acetic acid, $\\mathrm{CH}_3\\mathrm{COOH}$.<br><br>Answer: $\\mathrm{CH}_3 \\mathrm{COOH}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b89bf9280d7f9932a22", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the reagent $R$ necessary to bring the following conversion.\n<img src=\"https://cdn.quizrr.in/question-assets/mhtcet/mhtcet2025/hQUb1D-ScE2U-W7LK-BSdP_6wSV1918Ny5gxrI9E0Uo.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "hxqV5", "text": "$\\mathrm{H}_2 \\mathrm{O}$", "image": null, "isCorrect": true}, {"id": "M0i53", "text": "$\\mathrm{CrO}_3$", "image": null, "isCorrect": false}, {"id": "SJmxv", "text": "dil. NaOH", "image": null, "isCorrect": false}, {"id": "UMTjA", "text": "$\\mathrm{KMnO}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is the conversion of benzoyl chloride to benzoic acid.<br><br>This is a hydrolysis reaction where the $-\\mathrm{Cl}$ group of the acid chloride is replaced by an $-\\mathrm{OH}$ group.<br><br>Acid chlorides are highly reactive and readily undergo hydrolysis when treated with water ($\\mathrm{H_2O}$) to form the corresponding carboxylic acid and hydrogen chloride gas.<br><br>$\\mathrm{C_6H_5COCl} + \\mathrm{H_2O} \\rightarrow \\mathrm{C_6H_5COOH} + \\mathrm{HCl}$<br><br>Therefore, the required reagent $\\mathrm{R}$ is $\\mathrm{H_2O}$.<br><br>Answer: $\\mathrm{H}_2 \\mathrm{O}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7abf9280d7f9932995", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the reagent used in the following reaction.\n$\\begin{aligned}\n\\text { Benzoic acid } \\xrightarrow{\\text { Reagent }} & \\text { Benzoyl chloride }+ \\text { Phosphorus oxychloride } \\\\\n& + \\text { Hydrogen chloride }\n\\end{aligned}$", "image": null}, "options": [{"id": "WKjnG", "text": "$\\mathrm{PCl}_3$", "image": null, "isCorrect": false}, {"id": "XbGcs", "text": "HCl", "image": null, "isCorrect": false}, {"id": "Kzjla", "text": "$\\mathrm{PCl}_5$", "image": null, "isCorrect": true}, {"id": "qgsm9", "text": "$\\mathrm{SOCl}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction of benzoic acid with phosphorus pentachloride ($\\mathrm{PCl_5}$) gives benzoyl chloride, phosphorus oxychloride, and hydrogen chloride.<br><br>$\\mathrm{C_6H_5COOH} + \\mathrm{PCl_5} \\rightarrow \\mathrm{C_6H_5COCl} + \\mathrm{POCl_3} + \\mathrm{HCl}$<br><br>Thus, the reagent used is $\\mathrm{PCl_5}$.<br><br>Answer: $\\mathrm{PCl}_5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b28bf9280d7f99326c8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If salicylic acid (138 u) reacts with acetic anhydride (102 u) to from aspirin (180 u) calculate % atom economy", "image": null}, "options": [{"id": "6fEub", "text": "$25 \\%$", "image": null, "isCorrect": false}, {"id": "qf9yT", "text": "$50 \\%$", "image": null, "isCorrect": false}, {"id": "2RIlq", "text": "$65 \\%$", "image": null, "isCorrect": false}, {"id": "mtoCE", "text": "$75 \\%$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The formula for percentage atom economy is given by:<br><br>$\\% \\text{ atom economy} = \\dfrac{\\text{Mass of desired product}}{\\text{Sum of mass of all reactants}} \\times 100$<br><br>The desired product is aspirin, with a mass of $180 \\text{ u}$.<br><br>The reactants are salicylic acid and acetic anhydride. The sum of their masses is:<br><br>$\\text{Total mass of reactants} = 138 \\text{ u} + 102 \\text{ u} = 240 \\text{ u}$<br><br>Substituting these values into the formula:<br><br>$\\% \\text{ atom economy} = \\dfrac{180}{240} \\times 100$<br><br>$\\% \\text{ atom economy} = \\dfrac{3}{4} \\times 100 = 75 \\%$<br><br>Answer: $75 \\%$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214490aee93fa0796df6f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Identify the product $X$ in the following reaction.\n$\\text {Ethanoyl chloride } \\xrightarrow{\\mathrm{H}_2 \\mathrm{O}} \\mathrm{X}$", "image": null}, "options": [{"id": "4DG05", "text": "Ethanol", "image": null, "isCorrect": false}, {"id": "oCioS", "text": "Ethanoic acid", "image": null, "isCorrect": true}, {"id": "niqts", "text": "Ethanal", "image": null, "isCorrect": false}, {"id": "SaQhI", "text": "Ethylethanoate", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ethanoyl chloride is an acid chloride with the chemical formula $\\mathrm{CH}_3\\mathrm{COCl}$.<br><br>When ethanoyl chloride reacts with water, it undergoes hydrolysis to form the corresponding carboxylic acid and hydrogen chloride gas.<br><br>The chemical reaction is given by:<br>$\\mathrm{CH}_3\\mathrm{COCl} + \\mathrm{H}_2\\mathrm{O} \\rightarrow \\mathrm{CH}_3\\mathrm{COOH} + \\mathrm{HCl}$<br><br>The product $\\mathrm{CH}_3\\mathrm{COOH}$ is ethanoic acid. Therefore, the product $X$ is ethanoic acid.<br><br>Answer: Ethanoic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e70aee93fa0796dc6b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Identify the product obtained when excess of benzoyl chloride is treated with dimethyl cadmium.", "image": null}, "options": [{"id": "as5qd", "text": "Acetophenone", "image": null, "isCorrect": true}, {"id": "tEmPu", "text": "Benzoic acid", "image": null, "isCorrect": false}, {"id": "Z8d7Q", "text": "Benzophenone", "image": null, "isCorrect": false}, {"id": "f6j1B", "text": "Benzaldehyde", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction of an acid chloride with a dialkyl cadmium yields a ketone. Dialkyl cadmium is a less reactive organometallic reagent and does not react further with the ketone produced.<br><br>When benzoyl chloride is treated with dimethyl cadmium, the methyl group from dimethyl cadmium replaces the chlorine atom of benzoyl chloride to form acetophenone.<br><br>$2C_6H_5COCl + (CH_3)_2Cd \\rightarrow 2C_6H_5COCH_3 + CdCl_2$<br><br>The product obtained is acetophenone.<br><br>Answer: Acetophenone", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213880aee93fa0796d988", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Which among the following is a pair of monocarboxylic acids?", "image": null}, "options": [{"id": "qKvep", "text": "Malonic acid and propionic acid", "image": null, "isCorrect": false}, {"id": "j2OzK", "text": "Valeric acid and succinic acid", "image": null, "isCorrect": false}, {"id": "Rix9b", "text": "Acetic acid and adipic acid", "image": null, "isCorrect": false}, {"id": "Puy7I", "text": "Butyric acid and caproic acid", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Monocarboxylic acids contain only one carboxylic acid group ($-COOH$).<br><br>Malonic acid is a dicarboxylic acid ($HOOC-CH_2-COOH$).<br><br>Succinic acid is a dicarboxylic acid ($HOOC-(CH_2)_2-COOH$).<br><br>Adipic acid is a dicarboxylic acid ($HOOC-(CH_2)_4-COOH$).<br><br>Butyric acid ($CH_3-(CH_2)_2-COOH$) and caproic acid ($CH_3-(CH_2)_4-COOH$) both contain only one $-COOH$ group and are therefore monocarboxylic acids.<br><br>Answer: Butyric acid and caproic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213630aee93fa0796d863", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Which from following compounds is NOT a mono carboxylic acid?", "image": null}, "options": [{"id": "HoeGc", "text": "Phthalic acid", "image": null, "isCorrect": true}, {"id": "irFq5", "text": "Salicylic acid", "image": null, "isCorrect": false}, {"id": "vu0SY", "text": "o-toluic acid", "image": null, "isCorrect": false}, {"id": "Z0qEJ", "text": "Benzoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Phthalic acid is benzene-1,2-dicarboxylic acid, which contains two carboxyl (-COOH) groups. Thus, it is a dicarboxylic acid.<br><br>Salicylic acid is 2-hydroxybenzoic acid, containing one -COOH group.<br><br>o-toluic acid is 2-methylbenzoic acid, containing one -COOH group.<br><br>Benzoic acid contains one -COOH group.<br><br>Therefore, phthalic acid is not a mono carboxylic acid.<br><br>Answer: Phthalic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626b0279619d9d8a3462", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Identify the reagent used in the following reaction.\n\nBenzoic acid $\\stackrel{\\text { Reagent }}{\\Delta}$ Benzoyl chloride + Phosphorous oxychloride + Hydrogen chloride", "image": null}, "options": [{"id": "2nNWv", "text": "$\\mathrm{PCl}_3$", "image": null, "isCorrect": false}, {"id": "xuRbQ", "text": "$\\mathrm{HCl}$", "image": null, "isCorrect": false}, {"id": "5H2dz", "text": "$\\mathrm{PCl}_5$", "image": null, "isCorrect": true}, {"id": "XVnAy", "text": "$\\mathrm{SOCl}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/3ORtVlJqlDk6MnY-6enEy4nOGjSgm1BaOS6pLGTbXJE.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2626b0279619d9d8a3460", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "is 000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a263340279619d9d8a3cfa", "title": "Preparation and Properties of Esters", "totalQuestions": 9, "questions": [{"_id": "6abb887015a9fc0fc8c143b6", "type": "singleCorrect", "question": {"text": "Which of the following compounds is obtained in the saponification process?", "image": null}, "options": [{"id": "eyvyk", "label": "A", "text": "$\\text{R-CHO}$", "isCorrect": false, "image": null}, {"id": "ZUrA2", "label": "B", "text": "$\\text{R-COONa}$", "isCorrect": true, "image": null}, {"id": "Amk7M", "label": "C", "text": "$\\text{R-CO-R}$", "isCorrect": false, "image": null}, {"id": "HRsju", "label": "D", "text": "$\\text{R-COCl}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Saponification is the process of alkaline hydrolysis of an ester (such as fats and oils) with an alkali like $\\text{NaOH}$ or $\\text{KOH}$.<br><br>The general reaction is given by:<br>$\\text{R-COOR'} + \\text{NaOH} \\rightarrow \\text{R-COONa} + \\text{R'OH}$<br><br>The products formed are sodium or potassium salts of carboxylic acids (soap) and alcohol.<br><br>Thus, $\\text{R-COONa}$ is obtained in the saponification process.<br><br>Answer: $\\text{R-COONa}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3478c30a4553e1be209", "type": "singleCorrect", "question": {"text": "Identify the main product of following reaction<br><img style=\"width: 400px\" src=\"https://cdn.quizrr.in/question-assets/mht_cet_pyqs_2026/april/watermarked_images/16_april_shift_2__q99_d1.png\" />", "image": null}, "options": [{"id": "uTzkt", "label": "A", "text": "$\\text{R} - \\text{COOH}$", "isCorrect": false, "image": null}, {"id": "TNiRJ", "label": "B", "text": "$\\text{RCOR}'$", "isCorrect": false, "image": null}, {"id": "hymXp", "label": "C", "text": "$\\text{RCHO}$", "isCorrect": true, "image": null}, {"id": "BkHmq", "label": "D", "text": "$\\text{R CH}_2\\text{ OH}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "DIBAL-H (Diisobutylaluminium hydride) is a selective reducing agent.<br><br>It reduces esters and nitriles to aldehydes.<br><br>The reaction proceeds as follows:<br>$\\text{R}-\\text{CO}-\\text{O}-\\text{R}' \\xrightarrow[\\text{2. H}_3\\text{O}^+]{\\text{1. DIBAL-H}} \\text{R}-\\text{CHO} + \\text{R}'-\\text{OH}$<br><br>Therefore, the main product is an aldehyde, $\\text{RCHO}$.<br><br>Answer: $\\text{RCHO}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9bbf9280d7f9932ad2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Find the number of moles of glycerol produced when n mole of triglyceride undergoes saponification.", "image": null}, "options": [{"id": "OORZb", "text": "n", "image": null, "isCorrect": true}, {"id": "SPuoI", "text": "2n", "image": null, "isCorrect": false}, {"id": "IL5nn", "text": "3n", "image": null, "isCorrect": false}, {"id": "s0Ig8", "text": "$\\frac{3}{2} \\mathrm{n}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Saponification of a triglyceride is the hydrolysis of the ester with an alkali. The general reaction is:<br><br>Triglyceride + $3$NaOH $\\rightarrow$ Glycerol + $3$Soap<br><br>From the stoichiometry of the balanced chemical equation, $1$ mole of triglyceride produces $1$ mole of glycerol and $3$ moles of soap.<br><br>Therefore, $n$ moles of triglyceride will produce $n$ moles of glycerol.<br><br>Answer: n", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b26bf9280d7f99326b0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product ' B ' in the following sequence of reactions.\nMethylpropanoate $\\underset{\\text { dil. } \\mathrm{NaOH}}{\\stackrel{\\Delta}{\\longrightarrow}} \\mathrm{A} \\xrightarrow[\\text { Conc. } \\mathrm{HCl}]{\\mathrm{H}^{+}} \\mathrm{B}$", "image": null}, "options": [{"id": "17S0U", "text": "sodium propanoate", "image": null, "isCorrect": false}, {"id": "N6OfB", "text": "propanone", "image": null, "isCorrect": false}, {"id": "GCvAN", "text": "propanal", "image": null, "isCorrect": false}, {"id": "kIkE1", "text": "propanoic acid", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Methylpropanoate is an ester with the chemical formula $\\text{CH}_3\\text{CH}_2\\text{COOCH}_3$.<br><br>When methylpropanoate is heated with dilute $\\text{NaOH}$, it undergoes alkaline hydrolysis (saponification) to form the sodium salt of the carboxylic acid and an alcohol. Thus, product A is sodium propanoate.<br><br>$\\text{CH}_3\\text{CH}_2\\text{COOCH}_3 + \\text{NaOH} \\xrightarrow{\\Delta} \\text{CH}_3\\text{CH}_2\\text{COONa} (\\text{A}) + \\text{CH}_3\\text{OH}$<br><br>When sodium propanoate (A) is treated with concentrated $\\text{HCl}$, it undergoes acidification to yield the corresponding carboxylic acid. Thus, product B is propanoic acid.<br><br>$\\text{CH}_3\\text{CH}_2\\text{COONa} + \\text{HCl} \\rightarrow \\text{CH}_3\\text{CH}_2\\text{COOH} (\\text{B}) + \\text{NaCl}$<br><br>Therefore, the final product B is propanoic acid.<br><br>Answer: propanoic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262110279619d9d8a318c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z"     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
