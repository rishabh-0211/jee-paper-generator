  <script>
    const data = {"index": 28, "chapterId": "61c0898e830a10a21dc8c2d4", "chapter": "Carboxylic Acid Derivatives", "exam": "MHT CET", "totalTopics": 6, "totalQuestions": 102, "downloadTime": "2026-10-08 20:07:18", "topics": [{"index": 1, "topicId": "65a263330279619d9d8a3cf6", "title": "Preparation and Properties of Carboxylic Acids", "totalQuestions": 52, "questions": [{"_id": "6abb88a315a9fc0fc8c14599", "type": "singleCorrect", "question": {"text": "Which of the following compounds reacts with Grignard's reagent and hydrolyzes further to form carboxylic acid?", "image": null}, "options": [{"id": "m4L9o", "label": "A", "text": "ethanal", "isCorrect": false, "image": null}, {"id": "Uui8P", "label": "B", "text": "methanal", "isCorrect": false, "image": null}, {"id": "QDbox", "label": "C", "text": "methyl cyanide", "isCorrect": false, "image": null}, {"id": "dOXGs", "label": "D", "text": "carbon dioxide", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Grignard reagent ($RMgX$) reacts with carbon dioxide ($CO_2$) to form an addition product, which upon acidic hydrolysis yields a carboxylic acid.<br><br>$RMgX + O=C=O \\rightarrow R-COOMgX$<br><br>$R-COOMgX + H_2O \\rightarrow R-COOH + Mg(OH)X$<br><br>Reaction with other given compounds:<br>Ethanal reacts with Grignard reagent to form a secondary alcohol.<br>Methanal reacts with Grignard reagent to form a primary alcohol.<br>Methyl cyanide reacts with Grignard reagent to form a ketone after hydrolysis.<br><br>Answer: carbon dioxide", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885415a9fc0fc8c142aa", "type": "singleCorrect", "question": {"text": "Which of the following reagents tests the presence of $-\\text{COOH}$ in carboxylic acids?", "image": null}, "options": [{"id": "VvPit", "label": "A", "text": "Tollen's reagent", "isCorrect": false, "image": null}, {"id": "4twtw", "label": "B", "text": "$\\text{NaHCO}_3$", "isCorrect": true, "image": null}, {"id": "gLjnV", "label": "C", "text": "Fehling's solution", "isCorrect": false, "image": null}, {"id": "WxOTl", "label": "D", "text": "$\\text{NaHSO}_3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Carboxylic acids react with sodium bicarbonate ($\\text{NaHCO}_3$) to produce sodium carboxylate, water, and carbon dioxide gas.<br><br>The evolution of carbon dioxide gas with brisk effervescence confirms the presence of the $-\\text{COOH}$ group.<br><br>The reaction is given by:<br>$\\text{R-COOH} + \\text{NaHCO}_3 \\rightarrow \\text{R-COONa} + \\text{H}_2\\text{O} + \\text{CO}_2 \\uparrow$<br><br>Tollen's reagent and Fehling's solution are used to test for aldehydes, while sodium bisulfite ($\\text{NaHSO}_3$) is used to test for aldehydes and methyl ketones.<br><br>Answer: $\\text{NaHCO}_3$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889315a9fc0fc8c14502", "type": "singleCorrect", "question": {"text": "Identify the carboxylic acid having least pKa value from following.", "image": null}, "options": [{"id": "kEqOH", "label": "A", "text": "$\\text{CH}_3\\text{COOH}$", "isCorrect": false, "image": null}, {"id": "i5ZCj", "label": "B", "text": "$\\text{I-CH}_2\\text{COOH}$", "isCorrect": false, "image": null}, {"id": "8Naki", "label": "C", "text": "$\\text{F-CH}_2\\text{COOH}$", "isCorrect": true, "image": null}, {"id": "uFBzp", "label": "D", "text": "$\\text{Br-CH}_2\\text{COOH}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The acidic strength of carboxylic acids increases with the electron-withdrawing nature of the substituent attached to the $\\alpha$-carbon, as it stabilizes the conjugate base through the $-I$ effect.<br><br>The $-I$ effect of halogens follows the order: $F > Cl > Br > I$.<br><br>Fluorine exerts the strongest $-I$ effect, stabilizing the fluoroacetate ion to the maximum extent. Therefore, fluoroacetic acid ($\\text{F-CH}_2\\text{COOH}$) is the strongest acid among the given options.<br><br>Since stronger acids have lower $pK_a$ values, $\\text{F-CH}_2\\text{COOH}$ has the least $pK_a$ value.<br><br>Answer: $\\text{F-CH}_2\\text{COOH}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886415a9fc0fc8c14340", "type": "singleCorrect", "question": {"text": "Which of the following has a higher acidic character than benzoic acid?", "image": null}, "options": [{"id": "9xU74", "label": "A", "text": "Acetic acid", "isCorrect": false, "image": null}, {"id": "XvCY3", "label": "B", "text": "p-Methoxybenzoic acid", "isCorrect": false, "image": null}, {"id": "y5qxb", "label": "C", "text": "p-Bromobenzoic acid", "isCorrect": true, "image": null}, {"id": "Fi90g", "label": "D", "text": "p-Aminobenzoic acid", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The acidic strength of carboxylic acids depends on the stability of the conjugate base (carboxylate ion). Electron-withdrawing groups (EWG) stabilize the carboxylate ion and increase acidity, while electron-donating groups (EDG) destabilize it and decrease acidity.<br><br>Acetic acid is less acidic than benzoic acid because the methyl group has a $+I$ effect, whereas the $sp^2$ hybridized carbon of the phenyl ring in benzoic acid acts as an electron-withdrawing group.<br><br>In p-methoxybenzoic acid, the $-\\text{OCH}_3$ group exerts a strong $+M$ effect which dominates over its $-I$ effect, making it an electron-donating group. This decreases the acidic strength compared to benzoic acid.<br><br>In p-bromobenzoic acid, the $-\\text{Br}$ atom exerts a $-I$ effect that dominates over its $+M$ effect. It acts as an electron-withdrawing group, stabilizing the carboxylate ion and making p-bromobenzoic acid more acidic than benzoic acid.<br><br>In p-aminobenzoic acid, the $-\\text{NH}_2$ group exerts a strong $+M$ effect, which significantly decreases the acidic strength.<br><br>Therefore, p-bromobenzoic acid has a higher acidic character than benzoic acid.<br><br>Answer: p-Bromobenzoic acid", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ac8c30a4553e1bdb91", "type": "singleCorrect", "question": {"text": "Identify the reason for the highest boiling point of R-COOH as compared to alkanes, ethers, alcohols and aldehydes.", "image": null}, "options": [{"id": "rWUHx", "label": "A", "text": "Formation of carboxylate ion", "isCorrect": false, "image": null}, {"id": "6Gl74", "label": "B", "text": "Van der waals force of attraction", "isCorrect": false, "image": null}, {"id": "8XUEQ", "label": "C", "text": "Formation of intramolecular hydrogen bonding", "isCorrect": false, "image": null}, {"id": "0bTv9", "label": "D", "text": "Formation of intermolecular hydrogen bonding", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Carboxylic acids have higher boiling points than alkanes, ethers, alcohols, and aldehydes of comparable molecular mass.<br><br>This is due to the presence of strong intermolecular hydrogen bonding in carboxylic acids. The highly polarized O-H bond, enhanced by the electron-withdrawing carbonyl group, allows carboxylic acid molecules to form strong hydrogen bonds with each other. Because of this extensive intermolecular hydrogen bonding, they often exist as dimers even in the vapor phase or in non-polar solvents, requiring more energy to separate the molecules during boiling.<br><br>Answer: Formation of intermolecular hydrogen bonding", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2fe8c30a4553e1bdefe", "type": "singleCorrect", "question": {"text": "Which from the following is NOT a monocarboxylic acid?", "image": null}, "options": [{"id": "w6ZIe", "label": "A", "text": "Toluic acid", "isCorrect": false, "image": null}, {"id": "UbzAj", "label": "B", "text": "Acrylic acid", "isCorrect": false, "image": null}, {"id": "RtHwr", "label": "C", "text": "Phthalic acid", "isCorrect": true, "image": null}, {"id": "pZG5O", "label": "D", "text": "Isobutyric acid", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Toluic acid is methylbenzoic acid, which contains one $-COOH$ group.<br><br>Acrylic acid is propenoic acid ($CH_2=CH-COOH$), which contains one $-COOH$ group.<br><br>Phthalic acid is benzene-1,2-dicarboxylic acid ($C_6H_4(COOH)_2$), which contains two $-COOH$ groups. Thus, it is a dicarboxylic acid.<br><br>Isobutyric acid is 2-methylpropanoic acid ($(CH_3)_2CH-COOH$), which contains one $-COOH$ group.<br><br>Therefore, phthalic acid is not a monocarboxylic acid.<br><br>Answer: Phthalic acid", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f08c30a4553e1bde6a", "type": "singleCorrect", "question": {"text": "Identify the product obtained when isopropyl magnesium chloride in dry ether reacts with dry ice forming a complex, hydrolysed further.", "image": null}, "options": [{"id": "VvCED", "label": "A", "text": "Propanoic acid", "isCorrect": false, "image": null}, {"id": "oTXZu", "label": "B", "text": "Propanal", "isCorrect": false, "image": null}, {"id": "DXHtv", "label": "C", "text": "2 - Methylpropanoic acid", "isCorrect": true, "image": null}, {"id": "KYcqh", "label": "D", "text": "2 - Methylpropanol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Isopropyl magnesium chloride is $(CH_3)_2CHMgCl$.<br><br>Dry ice is solid $CO_2$.<br><br>When a Grignard reagent reacts with dry ice, it undergoes nucleophilic addition to the carbonyl group of $CO_2$ to form a magnesium carboxylate complex.<br><br>$(CH_3)_2CHMgCl + O=C=O \\rightarrow (CH_3)_2CH-COOMgCl$<br><br>Upon acid hydrolysis, the complex yields a carboxylic acid.<br><br>$(CH_3)_2CH-COOMgCl + H_2O \\rightarrow (CH_3)_2CH-COOH + Mg(OH)Cl$<br><br>The product $(CH_3)_2CH-COOH$ is 2-methylpropanoic acid.<br><br>Answer: 2 - Methylpropanoic acid", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3268c30a4553e1be0af", "type": "singleCorrect", "question": {"text": "Identify final products in the following sequence of reactions<br>$\\text{RCOOH} + \\text{R'OH} \\xrightarrow{\\large{\\text{H}^+}} \\text{intermediate} \\xrightarrow{\\large{\\text{Ni}, \\Delta}}^{\\large{\\text{H}_2}} \\text{Products}$", "image": null}, "options": [{"id": "JVPfs", "label": "A", "text": "$\\text{R'COOH} + \\text{RCH}_2\\text{OH}$", "isCorrect": false, "image": null}, {"id": "t7190", "label": "B", "text": "$\\text{RCH}_2\\text{OH} + \\text{R'}-\\text{OH}$", "isCorrect": true, "image": null}, {"id": "t9omB", "label": "C", "text": "$\\text{R'CH}_2\\text{OH} + \\text{R}-\\text{OH}$", "isCorrect": false, "image": null}, {"id": "lg9yG", "label": "D", "text": "$\\text{R}-\\text{OH} + \\text{R'}-\\text{OH}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The first step is the Fischer esterification reaction between a carboxylic acid and an alcohol in the presence of an acid catalyst. The reaction produces an ester as the intermediate.<br><br>$\\text{RCOOH} + \\text{R'OH} \\xrightarrow{\\text{H}^+} \\text{RCOOR'} + \\text{H}_2\\text{O}$<br><br>The intermediate formed is the ester $\\text{RCOOR'}$.<br><br>The second step involves the catalytic hydrogenation (hydrogenolysis) of the ester using hydrogen gas over a nickel catalyst at high temperature. This process cleaves the ester bond, reducing the acyl group ($\\text{RCO}-$) to a primary alcohol and releasing the alkoxy group ($-\\text{OR'}$) as another alcohol.<br><br>$\\text{RCOOR'} + 2\\text{H}_2 \\xrightarrow{\\text{Ni}, \\Delta} \\text{RCH}_2\\text{OH} + \\text{R'OH}$<br><br>Thus, the final products are $\\text{RCH}_2\\text{OH}$ and $\\text{R'OH}$.<br><br>Answer: $\\text{RCH}_2\\text{OH} + \\text{R'}-\\text{OH}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c78c30a4553e1bdcb3", "type": "singleCorrect", "question": {"text": "When will be the acidic character of carboxylic acid higher in following cases ?", "image": null}, "options": [{"id": "1gOEG", "label": "A", "text": "Lower $K_a$ and $pK_a$ values", "isCorrect": false, "image": null}, {"id": "uqvPE", "label": "B", "text": "Lower $K_a$ value and higher $pK_a$ value", "isCorrect": false, "image": null}, {"id": "U6PHd", "label": "C", "text": "Higher $K_a$ value and lower $pK_a$ value", "isCorrect": true, "image": null}, {"id": "Sc5CZ", "label": "D", "text": "Higher $K_a$ and $pK_a$ values", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Acidic strength of a carboxylic acid is directly proportional to its acid dissociation constant $K_a$.<br><br>Higher the value of $K_a$, stronger is the acid.<br><br>The relationship between $pK_a$ and $K_a$ is given by $pK_a = -\\log K_a$.<br><br>Thus, a higher value of $K_a$ corresponds to a lower value of $pK_a$.<br><br>Therefore, higher acidic character corresponds to a higher $K_a$ value and a lower $pK_a$ value.<br><br>Answer: Higher $K_a$ value and lower $pK_a$ value", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d68c30a4553e1bdd51", "type": "singleCorrect", "question": {"text": "When sodium bicarbonate is added to an organic compound, brisk effervescences is evolved. This indicate the presence of which functional group.", "image": null}, "options": [{"id": "d9QHz", "label": "A", "text": "$-\\text{CHO}$", "isCorrect": false, "image": null}, {"id": "ecvpt", "label": "B", "text": "$-\\text{C}=\\text{O}$", "isCorrect": false, "image": null}, {"id": "N8uC5", "label": "C", "text": "$-\\text{COCl}$", "isCorrect": false, "image": null}, {"id": "OsZ4e", "label": "D", "text": "$-\\text{COOH}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Sodium bicarbonate ($NaHCO_3$) is a weak base that reacts with compounds more acidic than carbonic acid ($H_2CO_3$).<br><br>Carboxylic acids ($-\\text{COOH}$) react with sodium bicarbonate to produce sodium carboxylate, water, and carbon dioxide gas.<br><br>The reaction is given by:<br><br>$R-\\text{COOH} + NaHCO_3 \\rightarrow R-\\text{COONa} + H_2O + CO_2 \\uparrow$<br><br>The evolution of carbon dioxide ($CO_2$) gas is observed as brisk effervescence. This test is the standard qualitative test used to detect the presence of the carboxylic acid functional group in an organic compound.<br><br>Answer: $-\\text{COOH}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e48c30a4553e1bdde9", "type": "singleCorrect", "question": {"text": "Which of the following is the strongest carboxylic acid?", "image": null}, "options": [{"id": "IqVzq", "label": "A", "text": "$\\text{CH}_3\\text{COOH}$", "isCorrect": false, "image": null}, {"id": "b3Bsf", "label": "B", "text": "$\\text{HCOOH}$", "isCorrect": false, "image": null}, {"id": "X6Apm", "label": "C", "text": "$\\text{CH}_3\\text{CH}_2\\text{-COOH}$", "isCorrect": false, "image": null}, {"id": "RAveq", "label": "D", "text": "$\\text{ClCH}_2\\text{COOH}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The acidic strength of carboxylic acids depends on the stability of the conjugate base (carboxylate ion).<br><br>Electron-withdrawing groups (EWG) stabilize the conjugate base through the $-I$ effect, thereby increasing the acidic strength. Electron-donating groups (EDG) destabilize the conjugate base through the $+I$ effect, decreasing the acidic strength.<br><br>In the given options:<br>$\\text{ClCH}_2\\text{COOH}$ has a $-\\text{Cl}$ group which exerts a strong $-I$ effect.<br>$\\text{HCOOH}$ has a hydrogen atom (reference for $I$ effect).<br>$\\text{CH}_3\\text{COOH}$ has a $-\\text{CH}_3$ group which exerts a $+I$ effect.<br>$\\text{CH}_3\\text{CH}_2\\text{COOH}$ has an ethyl group which exerts a stronger $+I$ effect than the methyl group.<br><br>Due to the strong $-I$ effect of the chlorine atom, the chloroacetate ion is the most stable conjugate base. Thus, $\\text{ClCH}_2\\text{COOH}$ is the strongest acid.<br><br>Answer: $\\text{ClCH}_2\\text{COOH}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29e8c30a4553e1bdafb", "type": "singleCorrect", "question": {"text": "Which is a weakest acid among the following ?", "image": null}, "options": [{"id": "7Qrf7", "label": "A", "text": "$(\\text{CH}_3)_2\\text{CHCOOH}$", "isCorrect": true, "image": null}, {"id": "jN3W9", "label": "B", "text": "$\\text{CH}_3\\text{COOH}$", "isCorrect": false, "image": null}, {"id": "jQAUL", "label": "C", "text": "$\\text{ClCH}_2\\text{COOH}$", "isCorrect": false, "image": null}, {"id": "WSMNJ", "label": "D", "text": "$\\text{Cl}_3\\text{CCOOH}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Acidic strength is directly proportional to the stability of the conjugate base.<br><br>Electron-withdrawing groups ($-I$ effect) stabilize the carboxylate ion and increase acidic strength, while electron-donating groups ($+I$ effect) destabilize the carboxylate ion and decrease acidic strength.<br><br>The $+I$ effect of the isopropyl group $(\\text{CH}_3)_2\\text{CH}-$ is greater than that of the methyl group $\\text{CH}_3-$.<br><br>Chlorine atoms exert a $-I$ effect, which increases acidic strength. Thus, $\\text{Cl}_3\\text{CCOOH}$ and $\\text{ClCH}_2\\text{COOH}$ are stronger acids.<br><br>Since $(\\text{CH}_3)_2\\text{CH}-$ has the maximum $+I$ effect among the given groups, it destabilizes the conjugate base the most, making $(\\text{CH}_3)_2\\text{CHCOOH}$ the weakest acid.<br><br>Answer: $(\\text{CH}_3)_2\\text{CHCOOH}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bfbbf9280d7f9932e3d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following is dicarboxylic acid?", "image": null}, "options": [{"id": "wMbro", "text": "Valeric acid", "image": null, "isCorrect": false}, {"id": "3WQkj", "text": "Caproic acid", "image": null, "isCorrect": false}, {"id": "EVmQn", "text": "Glutaric acid", "image": null, "isCorrect": true}, {"id": "r1aTs", "text": "Butyric acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Valeric acid is pentanoic acid, which is a monocarboxylic acid with the formula $CH_3(CH_2)_3COOH$.<br><br>Caproic acid is hexanoic acid, which is a monocarboxylic acid with the formula $CH_3(CH_2)_4COOH$.<br><br>Glutaric acid is pentanedioic acid, which is a dicarboxylic acid with the formula $HOOC(CH_2)_3COOH$.<br><br>Butyric acid is butanoic acid, which is a monocarboxylic acid with the formula $CH_3(CH_2)_2COOH$.<br><br>Therefore, glutaric acid is the only dicarboxylic acid among the given options.<br><br>Answer: Glutaric acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be1bf9280d7f9932d3a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product formed in the following reaction.\n$\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{Mg} \\mathrm{Br} \\xrightarrow[\\text { ii) dil. } \\mathrm{HCl}]{\\text { i) Dry ice/ dry ether }} \\text { Product }$", "image": null}, "options": [{"id": "simDp", "text": "Ethanoic acid", "image": null, "isCorrect": false}, {"id": "Qqn5i", "text": "Propanoic acid", "image": null, "isCorrect": true}, {"id": "IHAPL", "text": "2-Methylpropanoic acid", "image": null, "isCorrect": false}, {"id": "kEAKA", "text": "Butanoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction of a Grignard reagent with solid carbon dioxide (dry ice) in the presence of dry ether forms a magnesium salt of a carboxylic acid. This intermediate upon acid hydrolysis yields the corresponding carboxylic acid.<br><br>$\\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{MgBr} + \\mathrm{O}=\\mathrm{C}=\\mathrm{O} \\xrightarrow{\\text{dry ether}} \\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{COOMgBr}$<br><br>$\\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{COOMgBr} \\xrightarrow{\\text{dil. } \\mathrm{HCl}} \\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{COOH} + \\mathrm{Mg(OH)Br}$<br><br>The final product is $\\mathrm{CH}_3\\mathrm{CH}_2\\mathrm{COOH}$, which is propanoic acid.<br><br>Answer: Propanoic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bcebf9280d7f9932c92", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following has highest boiling point?", "image": null}, "options": [{"id": "UmyL4", "text": "Butyric acid", "image": null, "isCorrect": false}, {"id": "W1Nhr", "text": "Valeric acid", "image": null, "isCorrect": true}, {"id": "RBYuE", "text": "Acetic acid", "image": null, "isCorrect": false}, {"id": "QDRvp", "text": "Formic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The boiling point of carboxylic acids increases with an increase in molecular mass due to the corresponding increase in the magnitude of van der Waals forces of attraction.<br><br>The given carboxylic acids and their number of carbon atoms are:<br>Formic acid: $1$ carbon atom<br>Acetic acid: $2$ carbon atoms<br>Butyric acid: $4$ carbon atoms<br>Valeric acid: $5$ carbon atoms<br><br>Since valeric acid has the highest molecular mass among the given options, it has the strongest intermolecular forces and consequently the highest boiling point.<br><br>Answer: Valeric acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bacbf9280d7f9932b78", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following is NOT dicarboxylic acid?", "image": null}, "options": [{"id": "iTrMC", "text": "Malonic acid", "image": null, "isCorrect": false}, {"id": "YELka", "text": "Caproic acid", "image": null, "isCorrect": true}, {"id": "nhqHD", "text": "Glutaric acid", "image": null, "isCorrect": false}, {"id": "LSpI1", "text": "Succinic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Malonic acid is a dicarboxylic acid with the formula $\\text{HOOC}-\\text{CH}_2-\\text{COOH}$.<br><br>Succinic acid is a dicarboxylic acid with the formula $\\text{HOOC}-(\\text{CH}_2)_2-\\text{COOH}$.<br><br>Glutaric acid is a dicarboxylic acid with the formula $\\text{HOOC}-(\\text{CH}_2)_3-\\text{COOH}$.<br><br>Caproic acid is a monocarboxylic acid with the formula $\\text{CH}_3-(\\text{CH}_2)_4-\\text{COOH}$ (hexanoic acid).<br><br>Therefore, caproic acid is not a dicarboxylic acid.<br><br>Answer: Caproic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b78bf9280d7f993298c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In a reaction,\n$\\left(\\mathrm{CH}_3\\right)_2 \\mathrm{CHMgBr}+\\mathrm{CO}_2 \\xrightarrow[\\text { ether }]{\\text { dry }} \\mathrm{A} \\xrightarrow[\\text { dil HCl }]{\\mathrm{H} \\cdot \\mathrm{OH}} \\mathrm{~B} .$\nFind the product ' $B$ ' of above reaction.", "image": null}, "options": [{"id": "hcOoL", "text": "Propanoic acid", "image": null, "isCorrect": false}, {"id": "HMvsv", "text": "2-Methyl propanoic acid", "image": null, "isCorrect": true}, {"id": "0JbVx", "text": "Butanoic acid", "image": null, "isCorrect": false}, {"id": "d70VF", "text": "2,2-dimethyl ethanoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The reaction involves the addition of a Grignard reagent to carbon dioxide followed by acid hydrolysis to yield a carboxylic acid.<br><br>Step 1: Isopropylmagnesium bromide reacts with carbon dioxide in the presence of dry ether to form a magnesium carboxylate complex (A).<br>$\\left(\\mathrm{CH}_3\\right)_2 \\mathrm{CHMgBr} + \\mathrm{CO}_2 \\xrightarrow{\\text{dry ether}} \\left(\\mathrm{CH}_3\\right)_2 \\mathrm{CH}-\\mathrm{COOMgBr}$ (A)<br><br>Step 2: The complex (A) undergoes acid hydrolysis to form the corresponding carboxylic acid (B).<br>$\\left(\\mathrm{CH}_3\\right)_2 \\mathrm{CH}-\\mathrm{COOMgBr} \\xrightarrow{\\mathrm{H}_3\\mathrm{O}^+} \\left(\\mathrm{CH}_3\\right)_2 \\mathrm{CH}-\\mathrm{COOH} + \\mathrm{Mg}(\\mathrm{OH})\\mathrm{Br}$<br><br>The product B is $\\left(\\mathrm{CH}_3\\right)_2 \\mathrm{CH}-\\mathrm{COOH}$, which has the IUPAC name 2-methylpropanoic acid.<br><br>Answer: 2-Methyl propanoic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6dbf9280d7f9932922", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product ' $B$ ' in following reaction.\nDry ice $\\xrightarrow[\\text { dry ether }]{\\mathrm{CH}_3 \\mathrm{MgBr}} \\mathrm{A} \\xrightarrow{\\mathrm{H}_3 \\mathrm{O}^{+}} \\mathrm{B}$", "image": null}, "options": [{"id": "4vlyY", "text": "Methanoic acid", "image": null, "isCorrect": false}, {"id": "Qjj4F", "text": "Ethanoic acid", "image": null, "isCorrect": true}, {"id": "L8obL", "text": "Methanol", "image": null, "isCorrect": false}, {"id": "KX86R", "text": "Ethanol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Dry ice is solid carbon dioxide ($\\mathrm{CO}_2$).<br><br>When methyl magnesium bromide ($\\mathrm{CH}_3\\mathrm{MgBr}$) reacts with dry ice in the presence of dry ether, it undergoes nucleophilic addition to form a magnesium salt of a carboxylic acid (intermediate A).<br><br>$\\mathrm{O=C=O} + \\mathrm{CH}_3\\mathrm{MgBr} \\xrightarrow{\\text{dry ether}} \\mathrm{CH}_3-\\mathrm{COO}^{-}\\mathrm{MgBr}^{+}$ (A)<br><br>Acid hydrolysis of this intermediate complex A yields ethanoic acid (acetic acid) as the final product B.<br><br>$\\mathrm{CH}_3-\\mathrm{COO}^{-}\\mathrm{MgBr}^{+} \\xrightarrow{\\mathrm{H}_3\\mathrm{O}^{+}} \\mathrm{CH}_3\\mathrm{COOH} + \\mathrm{Mg}(\\mathrm{OH})\\mathrm{Br}$<br><br>The product B is ethanoic acid.<br><br>Answer: Ethanoic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3cbf9280d7f993275f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following functional groups is reduced by diborane?", "image": null}, "options": [{"id": "ZzYld", "text": "-COOR", "image": null, "isCorrect": false}, {"id": "rOCmF", "text": "$-\\mathrm{COOH}$", "image": null, "isCorrect": true}, {"id": "ZIXHQ", "text": "$-\\mathrm{NO}_2$", "image": null, "isCorrect": false}, {"id": "glaz3", "text": "$-\\mathrm{X}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Diborane ($B_2H_6$) is an electrophilic reducing agent.<br><br>It readily reduces carboxylic acids ($-\\mathrm{COOH}$) to primary alcohols in excellent yields.<br><br>It does not reduce esters ($-COOR$), nitro groups ($-\\mathrm{NO}_2$), or halogens ($-\\mathrm{X}$).<br><br>Thus, the functional group reduced by diborane is $-\\mathrm{COOH}$.<br><br>Answer: $-\\mathrm{COOH}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b25bf9280d7f99326a9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which among the following is NOT dicarboxylic acid?", "image": null}, "options": [{"id": "xK3RK", "text": "Adipic acid", "image": null, "isCorrect": false}, {"id": "aJn62", "text": "Glutaric acid", "image": null, "isCorrect": false}, {"id": "4cWTk", "text": "Valeric acid", "image": null, "isCorrect": true}, {"id": "t2Oci", "text": "Malonic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Adipic acid is hexanedioic acid, which is a dicarboxylic acid.<br><br>Glutaric acid is pentanedioic acid, which is a dicarboxylic acid.<br><br>Valeric acid is pentanoic acid, which is a monocarboxylic acid.<br><br>Malonic acid is propanedioic acid, which is a dicarboxylic acid.<br><br>Therefore, valeric acid is not a dicarboxylic acid.<br><br>Answer: Valeric acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214450aee93fa0796df53", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Identify the product formed in the following reaction.\r\n$\\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{CH}_2-\\mathrm{CH}_3 \\xrightarrow[\\text { ii) } \\mathrm{H}_3 \\mathrm{O}^{+}]{\\text {alk } \\mathrm{KMnO}_4} \\text {. product }$", "image": null}, "options": [{"id": "TmfOH", "text": "$\\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{CH}_2 \\mathrm{COOH}$", "image": null, "isCorrect": false}, {"id": "Phgjt", "text": "$\\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{CH}_2-\\mathrm{COOH}$", "image": null, "isCorrect": false}, {"id": "c1Vng", "text": "$\\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "b1G5X", "text": "$\\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{COOH}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Alkylbenzenes having at least one benzylic hydrogen atom are oxidized to benzoic acid on treatment with strong oxidizing agents like alkaline $\\mathrm{KMnO}_4$ followed by acid hydrolysis.<br><br>In ethylbenzene ($\\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{CH}_2-\\mathrm{CH}_3$), the benzylic carbon has two hydrogen atoms. Therefore, the entire ethyl side chain is oxidized to a carboxyl group ($-\\mathrm{COOH}$), regardless of the length of the carbon chain.<br><br>The reaction proceeds as follows:<br>$\\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{CH}_2-\\mathrm{CH}_3 \\xrightarrow{\\text{alk } \\mathrm{KMnO}_4} \\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{COO}^{-} \\mathrm{K}^{+} \\xrightarrow{\\mathrm{H}_3 \\mathrm{O}^{+}} \\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{COOH}$<br><br>The final product is benzoic acid ($\\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{COOH}$).<br><br>Answer: $\\mathrm{C}_6 \\mathrm{H}_5-\\mathrm{COOH}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c40aee93fa0796db5d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "What is the product obtained when phenylethene is treated with $\\mathrm{KMnO}_4$ in dilute $\\mathrm{H}_2 \\mathrm{SO}_4$ ?", "image": null}, "options": [{"id": "IqVCR", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{CH}_2 \\mathrm{CHO}$", "image": null, "isCorrect": false}, {"id": "0wdxO", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{CH}_2 \\mathrm{COOH}$", "image": null, "isCorrect": false}, {"id": "eV1hQ", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{COOH}$", "image": null, "isCorrect": true}, {"id": "01BBy", "text": "$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{COCH}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Phenylethene (styrene) has the chemical formula $\\mathrm{C}_6\\mathrm{H}_5\\mathrm{CH}=\\mathrm{CH}_2$.<br><br>When treated with a strong oxidizing agent like $\\mathrm{KMnO}_4$ in dilute $\\mathrm{H}_2\\mathrm{SO}_4$ (acidic medium), oxidative cleavage of the carbon-carbon double bond takes place.<br><br>The terminal $=\\mathrm{CH}_2$ group is oxidized to $\\mathrm{CO}_2$ and $\\mathrm{H}_2\\mathrm{O}$, while the $\\mathrm{C}_6\\mathrm{H}_5\\mathrm{CH}=$ group is oxidized to a carboxylic acid group, yielding benzoic acid.<br><br>The reaction is:<br>$\\mathrm{C}_6\\mathrm{H}_5\\mathrm{CH}=\\mathrm{CH}_2 \\xrightarrow{\\mathrm{KMnO}_4 / \\mathrm{H}^+} \\mathrm{C}_6\\mathrm{H}_5\\mathrm{COOH} + \\mathrm{CO}_2 + \\mathrm{H}_2\\mathrm{O}$<br><br>Thus, the main product obtained is benzoic acid, $\\mathrm{C}_6\\mathrm{H}_5\\mathrm{COOH}$.<br><br>Answer: $\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{COOH}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c10aee93fa0796db43", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Which compound from following has highest boiling point?", "image": null}, "options": [{"id": "5oQ4e", "text": "$\\mathrm{n}^{-}-\\mathrm{C}_4 \\mathrm{H}_9 \\mathrm{OH}$", "image": null, "isCorrect": false}, {"id": "cD5XW", "text": "$\\left(\\mathrm{CH}_3\\right)_3 \\mathrm{C}-\\mathrm{NH}_2$", "image": null, "isCorrect": false}, {"id": "pDzMY", "text": "$\\quad \\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{~N}\\left(\\mathrm{CH}_3\\right)_2$", "image": null, "isCorrect": false}, {"id": "JYtj1", "text": "$\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{COOH}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The boiling point of a compound depends on the strength of its intermolecular forces. All the given compounds have comparable molar masses (approximately $73-74 \\text{ g/mol}$).<br><br>$\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{N}\\left(\\mathrm{CH}_3\\right)_2$ is a tertiary amine and lacks intermolecular hydrogen bonding, resulting in the lowest boiling point.<br><br>$\\left(\\mathrm{CH}_3\\right)_3 \\mathrm{C}-\\mathrm{NH}_2$ is a primary amine and forms hydrogen bonds, but these are weaker than those in alcohols and carboxylic acids because nitrogen is less electronegative than oxygen.<br><br>$\\mathrm{n}-\\mathrm{C}_4 \\mathrm{H}_9 \\mathrm{OH}$ is an alcohol and forms strong intermolecular hydrogen bonds.<br><br>$\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{COOH}$ is a carboxylic acid. It forms stronger intermolecular hydrogen bonds than alcohols due to the more polarized $\\mathrm{O}-\\mathrm{H}$ bond and the presence of the carbonyl oxygen, allowing it to exist as a stable dimer. This extensive hydrogen bonding gives it the highest boiling point among the given options.<br><br>Answer: $\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{COOH}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b10aee93fa0796dac6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Identify product ' B ' in the following reaction. Cumene $\\xrightarrow[\\Delta]{\\mathrm{KMnO}_4, \\mathrm{KOH}} \\mathrm{A} \\xrightarrow{\\mathrm{H}_3 \\mathrm{O}^{+}} \\mathrm{B}$", "image": null}, "options": [{"id": "88K73", "text": "Phenol", "image": null, "isCorrect": false}, {"id": "QR9yL", "text": "Benzophenone", "image": null, "isCorrect": false}, {"id": "B7vsD", "text": "Benzaldehyde", "image": null, "isCorrect": false}, {"id": "Yp0qr", "text": "Benzoic acid", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Cumene is isopropylbenzene, which contains a benzylic hydrogen atom.<br><br>When treated with a strong oxidizing agent like alkaline $\\mathrm{KMnO}_4$ under heating, the entire alkyl side chain containing a benzylic hydrogen is oxidized to a carboxylate salt.<br><br>Thus, cumene reacts with $\\mathrm{KMnO}_4$ and $\\mathrm{KOH}$ to form potassium benzoate (Product A).<br><br>Upon subsequent acidification with $\\mathrm{H}_3\\mathrm{O}^{+}$, potassium benzoate is converted to benzoic acid (Product B).<br><br>Answer: Benzoic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138b0aee93fa0796d99a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Which of the following is obtained on oxidation of prop-1-ene with acidic $\\mathrm{KMnO}_4$ ?", "image": null}, "options": [{"id": "ISxSP", "text": "Ethanoic acid", "image": null, "isCorrect": true}, {"id": "t0BOC", "text": "Propanol", "image": null, "isCorrect": false}, {"id": "Ct0p2", "text": "Propanoic acid", "image": null, "isCorrect": false}, {"id": "TLu6w", "text": "Propanone", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Prop-1-ene is $\\mathrm{CH}_3-\\mathrm{CH}=\\mathrm{CH}_2$.<br><br>When prop-1-ene is treated with a strong oxidizing agent like acidic $\\mathrm{KMnO}_4$, the carbon-carbon double bond is completely cleaved.<br><br>The terminal $=\\mathrm{CH}_2$ group is oxidized to $\\mathrm{CO}_2$ and $\\mathrm{H}_2\\mathrm{O}$, while the $\\mathrm{CH}_3-\\mathrm{CH}=$ group is oxidized to a carboxylic acid, which is ethanoic acid ($\\mathrm{CH}_3\\mathrm{COOH}$).<br><br>The reaction is:<br><br>$\\mathrm{CH}_3-\\mathrm{CH}=\\mathrm{CH}_2 \\xrightarrow{\\mathrm{KMnO}_4, \\mathrm{H}^+} \\mathrm{CH}_3\\mathrm{COOH} + \\mathrm{CO}_2 + \\mathrm{H}_2\\mathrm{O}$<br><br>Thus, ethanoic acid is obtained.<br><br>Answer: Ethanoic acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213640aee93fa0796d86d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Which from following is NOT a dicarboxylic acid?", "image": null}, "options": [{"id": "baPiW", "text": "Citric acid", "image": null, "isCorrect": true}, {"id": "7ox40", "text": "Malonic acid", "image": null, "isCorrect": false}, {"id": "eGyqn", "text": "Oxalic acid", "image": null, "isCorrect": false}, {"id": "ryv64", "text": "Glutaric acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Oxalic acid is a dicarboxylic acid with the formula $\\text{HOOC}-\\text{COOH}$.<br><br>Malonic acid is a dicarboxylic acid with the formula $\\text{HOOC}-\\text{CH}_2-\\text{COOH}$.<br><br>Glutaric acid is a dicarboxylic acid with the formula $\\text{HOOC}-(\\text{CH}_2)_3-\\text{COOH}$.<br><br>Citric acid is a tricarboxylic acid with the IUPAC name 2-hydroxypropane-1,2,3-tricarboxylic acid. It contains three carboxyl groups ($-\\text{COOH}$).<br><br>Therefore, citric acid is not a dicarboxylic acid.<br><br>Answer: Citric acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2624b0279619d9d8a335a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Which among the following compounds has highest boiling point?", "image": null}, "options": [{"id": "EKfCS", "text": "Propanone", "image": null, "isCorrect": false}, {"id": "zkPXs", "text": "Ethanoic acid", "image": null, "isCorrect": true}, {"id": "UpkQU", "text": "Propan-1-ol", "image": null, "isCorrect": false}, {"id": "q8YHq", "text": "Propanal", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Carboxylic acids have higher boiling points than those of alkanes, ethers, alcohols aldehydes and ketones of comparable mass.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262470279619d9d8a3341", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Which among the following is a pair of monocarboxylic acids?", "image": null}, "options": [{"id": "8DcHt", "text": "Malonic acid and propionic acid", "image": null, "isCorrect": false}, {"id": "IaJbP", "text": "Valeric acid and succinic acid", "image": null, "isCorrect": false}, {"id": "r3NpC", "text": "Acetic acid and adipic acid", "image": null, "isCorrect": false}, {"id": "yY4BD", "text": "Butyric acid and caproic acid", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/CysuA5D4zZHG-oKDJD-DjIvgCWLR8Gk2s4t-a3e0Vfc.original.fullsize.png\"><br>\n\nPropionic acid, valeric acid and acetic acid are monocarboxylic acids. Malonic acid, succinic acid and adipic acid are dicarboxylic acids.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262380279619d9d8a32c7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Select the CORRECT increasing order of boiling points of alcohols, amines and carboxylic acids of comparable molar mass from the following.", "image": null}, "options": [{"id": "C4YpG", "text": "Alcohols $ < $ Amines $ < $ Carboxylic acids", "image": null, "isCorrect": false}, {"id": "pXp4o", "text": "Amines $ < $ Carboxylic acids $ < $ Alcohols", "image": null, "isCorrect": false}, {"id": "HqbJL", "text": "Amines $ < $ Alcohols $ < $ Carboxylic acids", "image": null, "isCorrect": true}, {"id": "zaUJW", "text": "Carboxylic acids $ < $ Alcohols $ < $ Amines", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{N}-\\mathrm{H}$ bonds in amines are less polar than $\\mathrm{O}-\\mathrm{H}$ bond in alcohols. Carboxyl group $(-\\mathrm{COOH})$ of carboxylic acid contains $\\mathrm{O}-\\mathrm{H}$ bond which is responsible for formation of hydrogen bonding. Strength of hydrogen bonding in carboxylic acid is greater than that of alcohols.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c50279619d9d8a2f3a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "Which among the following has the lowest boiling point?", "image": null}, "options": [{"id": "6bVlu", "text": "Butyric acid", "image": null, "isCorrect": false}, {"id": "O49dK", "text": "Valeric acid", "image": null, "isCorrect": false}, {"id": "v5WvW", "text": "Acetic acid", "image": null, "isCorrect": false}, {"id": "RsOQr", "text": "Formic acid", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Boiling point increases as the molar mass increases. Formic has the lowest molar mass among given and hence, it has the lowest boiling point.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c50279619d9d8a2f34", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "Identify the reagent ' $A$ ' used in the following conversion.\nEthyl bromide $\\stackrel{\\mathrm{A}}{\\longrightarrow}$ Ethylpropanoate", "image": null}, "options": [{"id": "a0JJ8", "text": "Sodium propoxide", "image": null, "isCorrect": false}, {"id": "0NBSC", "text": "Ethoxy propane", "image": null, "isCorrect": false}, {"id": "UUyk6", "text": "Silver propanoate", "image": null, "isCorrect": true}, {"id": "pL9Jz", "text": "Silver ethanoate", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/BNe3UimChihPh2sh_4jQxfH-uOQzTLScxzc-1LrQsAU.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2618c0279619d9d8a2d71", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "
