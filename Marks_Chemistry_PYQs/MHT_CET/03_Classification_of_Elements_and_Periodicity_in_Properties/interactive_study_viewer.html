bels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "Which of the following elements belongs to first group and fifth period of periodic table?", "image": null}, "options": [{"id": "cNcMZ", "text": "Rubidium", "image": null, "isCorrect": true}, {"id": "1Abri", "text": "Strontium", "image": null, "isCorrect": false}, {"id": "E8FWJ", "text": "Caesium", "image": null, "isCorrect": false}, {"id": "IKw2g", "text": "Barium", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The elements of the first group (alkali metals) in the periodic table are Lithium (Period 2), Sodium (Period 3), Potassium (Period 4), Rubidium (Period 5), Caesium (Period 6), and Francium (Period 7).<br><br>Therefore, Rubidium belongs to the first group and fifth period of the periodic table.<br><br>Strontium belongs to the second group and fifth period.<br><br>Caesium belongs to the first group and sixth period.<br><br>Barium belongs to the second group and sixth period.<br><br>Answer: Rubidium", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213290aee93fa0796d69f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "What is the total number of unpaired electrons in an element placed at period-4 and group-12 either in its oxidation state or at ground state?", "image": null}, "options": [{"id": "4uj4r", "text": "Zero", "image": null, "isCorrect": true}, {"id": "Ukdi8", "text": "One", "image": null, "isCorrect": false}, {"id": "dVgOh", "text": "Two", "image": null, "isCorrect": false}, {"id": "hcrQR", "text": "Three", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The element present in period 4 and group 12 of the periodic table is Zinc (Zn).<br><br>The atomic number of Zn is 30.<br><br>The electronic configuration of Zn in its ground state is $[Ar] 3d^{10} 4s^{2}$. Since all the subshells are completely filled, there are no unpaired electrons in the ground state.<br><br>The most common and stable oxidation state of Zinc is $+2$.<br><br>The electronic configuration of $Zn^{2+}$ is $[Ar] 3d^{10}$. Here as well, the $d$-subshell is completely filled, meaning there are no unpaired electrons.<br><br>Therefore, the total number of unpaired electrons in either its ground state or its oxidation state is zero.<br><br>Answer: Zero", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625a0279619d9d8a33d2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "What is the number of elements present in each series of transition element?", "image": null}, "options": [{"id": "a1yM6", "text": "8" rue}, {"id": "FstjD", "text": "Period-4, Group- 10", "image": null, "isCorrect": false}, {"id": "Rt6wg", "text": "Period- 3 , Group- 9", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Group 11 and period 4.\ncopper\n$\\mathrm{Cu}(\\mathrm{Z}=29)=(\\mathrm{Ar}) 3 \\mathrm{~d}^{10} 4 \\mathrm{~S}^1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260d10279619d9d8a278c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "Which of the following is an alkali metal?", "image": null}, "options": [{"id": "8C9qX", "text": "Ba", "image": null, "isCorrect": false}, {"id": "LmiSX", "text": "Cs", "image": null, "isCorrect": true}, {"id": "OnHB8", "text": "Ca", "image": null, "isCorrect": false}, {"id": "FSbnq", "text": "Sr", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The alkali metals consist of the chemical elements lithium (Li), sodium $(\\mathrm{Na})$, potassium $(\\mathrm{K})$, rubidium $(\\mathrm{Rb})$, caesium $(\\mathrm{Cs})$, and francium (Fr).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260bc0279619d9d8a26e0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "Which of the following is an alkali metal?", "image": null}, "options": [{"id": "bAn0S", "text": "Barium", "image": null, "isCorrect": false}, {"id": "eA0P5", "text": "Rubidium", "image": null, "isCorrect": true}, {"id": "DJr0D", "text": "Strontium", "image": null, "isCorrect": false}, {"id": "mWEYl", "text": "Gallium", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The alkali metals consist of the chemical elements lithium, sodium, potassium, rubidium, caesium, and francium.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a80279619d9d8a2649", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "Which from following statements is true for group 16 elements?", "image": null}, "options": [{"id": "XAwvD", "text": "All elements of this group form $\\mathrm{EO}_2$ type oxides", "image": null, "isCorrect": false}, {"id": "AiU48", "text": "It includes all the nonmetals", "image": null, "isCorrect": false}, {"id": "kFtQx", "text": "Oxides of all elements of this group are gaseous at room temperature", "image": null, "isCorrect": false}, {"id": "084Lz", "text": "Reducing properties of dioxides of this group element decreases form $\\mathrm{SO}_2$ to $\\mathrm{TeO}_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Besides $\\mathrm{EO}_2$ type, Sulphur, Selenium, and tellurium also form $\\mathrm{EO}_3$ type oxides.\nGroup 16 Elements: Oxygen and Sulfur are non-metals, Selenium and Tellurium are metalloids and Polonium is a metal under typical conditions.\nAll the elements of this group need 2 electrons to attain inert gas configuration either by gaining or sharing of electrons. Oxygen has high E.N so it gains two electrons to become inert gas configuration so all metal oxides are ionic and contains $\\mathrm{O}^{2-}$ in which the oxidation state is -2 . Oxygen shows $-1,-1 / 2,+1$ and +2 oxidation state. The tendency to show -2 oxidation state decreases from sulphur to polonium.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f6c0279619d9d8a1c59", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "What is the symbol of element if it's atomic number is 116?", "image": null}, "options": [{"id": "uFPjw", "text": "UuS", "image": null, "isCorrect": false}, {"id": "iXpl4", "text": "Uut", "image": null, "isCorrect": false}, {"id": "hIhOO", "text": "Uuh", "image": null, "isCorrect": true}, {"id": "vnPoz", "text": "Uun", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\begin{array}{|c|l|c|c|c|}\n\\hline Atomic number & Temp. Name & Temp. Symbol & Name of the element & Symbol \\\\\n\\hline 109 & Unnilennium & Une & Meitnerium & \\mathrm{Mt} \\\\\n\\hline 110 & Ununnilium & Uun & Darmstadtium & \\mathrm{Ds} \\\\\n\\hline 111 & Unununium & Uuu & Roentgenium & \\mathrm{Rg} \\\\\n\\hline 112 & Ununbium & Uub & Copernicium & \\mathrm{Cn} \\\\\n\\hline 113 & Ununtrium & Uut & Nihonium & \\mathrm{Nh} \\\\\n\\hline 114 & Ununquadium & Uuq & Flerovium & \\mathrm{Fl} \\\\\n\\hline 115 & Ununpentium & Uup & Moscovium & \\mathrm{Mc} \\\\\n\\hline 116 & Ununhexium & Uuh & Livermorium & \\mathrm{Lv} \\\\\n\\hline 117 & Ununseptium & Uus & Tennessine & \\mathrm{Ts} \\\\\n\\hline 118 & Ununoctium & Uuo & Oganesson & \\mathrm{Og} \\\\\n\\hline\n\\end{array}", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f350279619d9d8a1aa3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "What is the position of elements $\\mathrm{La}(\\mathrm{Z}=57)$ and $\\mathrm{Ce}(\\mathrm{Z}=58)$ respectively in the long form of periodic table?", "image": null}, "options": [{"id": "iuyhF", "text": "$\\mathrm{La}=$ Group-3, Period-6 $\\mathrm{Ce}=$ Group-3, Period-6", "image": null, "isCorrect": true}, {"id": "v9Qr4", "text": "La $=$ Group $-4$, Period-7 $\\mathrm{Ce}=$ Group-5, Period-7", "image": null, "isCorrect": false}, {"id": "iYg4u", "text": "$\\mathrm{La}=$ Group $-3$, Period-7 $\\mathrm{Ce}=$ Group-3, Period-6", "image": null, "isCorrect": false}, {"id": "y3NRL", "text": "$\\mathrm{La}=$ Group-3, Period-6 $\\mathrm{Ce}=$ Group-3, Period-7", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{Zn}^{2+} \\longrightarrow 3 \\mathrm{~d}^{10}$ (No unpaired d-electron) \n$\\therefore \\mathrm{Zn}$ forms colourless compounds in $+2$ oxidation state.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25efc0279619d9d8a18d8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "The highest oxidation state in plutonium (At. No. = 94) is", "image": null}, "options": [{"id": "BtaJx", "text": "+6", "image": null, "isCorrect": false}, {"id": "o3zAk", "text": "+4", "image": null, "isCorrect": false}, {"id": "EUNx6", "text": "+5", "image": null, "isCorrect": false}, {"id": "Pr2AF", "text": "+7", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The highest oxidation state in plutonium (Atomic number = 94) is + 7. It can show a greater range of oxidation states which (in part) is attributed to the fact 5f, 6d and 7s levels are of comparable energies. Plutonium (Pu) can show oxidation state of +3, +4, +5, +6 and +7 in its compound.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25efb0279619d9d8a18d3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "The element which does not belong to group <math><mn>15</mn></math> is", "image": null}, "options": [{"id": "vHtuE", "text": "As", "image": null, "isCorrect": false}, {"id": "SUubl", "text": "P", "image": null, "isCorrect": false}, {"id": "1IuTs", "text": "Bi", "image": null, "isCorrect": false}, {"id": "MBmNb", "text": "Se", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The element which does not belong to group 15 is Se (selenium). It belongs to group [16 of the periodic table. It resides in 4<sup>th</sup> period and 16<sup>th</sup> group having atomic number 34. Electronic configuration of Se is <math><mn>4</mn><msup><mrow><mi>s</mi></mrow><mrow><mn>2</mn></mrow></msup><mn>4</mn><msup><mrow><mi>P</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>.</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a2634e0279619d9d8a3e02", "title": "Periodic properties", "totalQuestions": 38, "questions": [{"_id": "6abb885315a9fc0fc8c1429e", "type": "singleCorrect", "question": {"text": "Which is the incorrect statement among the following?", "image": null}, "options": [{"id": "G9QNx", "label": "A", "text": "The oxide that forms acid when combined with water, is acidic oxide.", "isCorrect": false, "image": null}, {"id": "65xpZ", "label": "B", "text": "The oxides showing acidic as well as basic characteristics are amphoteric oxides.", "isCorrect": false, "image": null}, {"id": "1jjx3", "label": "C", "text": "The acidic character of oxides increases, whereas basic character decreases in a period from left to right in the periodic table.", "isCorrect": false, "image": null}, {"id": "9PucE", "label": "D", "text": "$\\text{NO}$, $\\text{N}_2\\text{O}$ and $\\text{CO}$ are amphoteric oxides.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "$\\text{NO}$, $\\text{N}_2\\text{O}$ and $\\text{CO}$ are neutral oxides, not amphoteric oxides. Neutral oxides are those which show neither acidic nor basic properties.<br><br>Amphoteric oxides are those which show both acidic and basic characteristics, such as $\\text{Al}_2\\text{O}_3$ and $\\text{ZnO}$.<br><br>Therefore, the statement claiming that $\\text{NO}$, $\\text{N}_2\\text{O}$ and $\\text{CO}$ are amphoteric oxides is incorrect.<br><br>Answer: $\\text{NO}$, $\\text{N}_2\\text{O}$ and $\\text{CO}$ are amphoteric oxides.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c215a9fc0fc8c146b8", "type": "singleCorrect", "question": {"text": "Which element in group $17$ has the highest electronegativity?", "image": null}, "options": [{"id": "RTK6C", "label": "A", "text": "$\\text{I}$", "isCorrect": false, "image": null}, {"id": "aaktY", "label": "B", "text": "$\\text{Br}$", "isCorrect": false, "image": null}, {"id": "0MUfp", "label": "C", "text": "$\\text{Cl}$", "isCorrect": false, "image": null}, {"id": "iT75R", "label": "D", "text": "$\\text{F}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Electronegativity is the tendency of an atom to attract a shared pair of electrons towards itself. In the periodic table, electronegativity decreases down a group due to an increase in atomic size and shielding effect.<br><br>Group $17$ elements (halogens) include Fluorine ($\\text{F}$), Chlorine ($\\text{Cl}$), Bromine ($\\text{Br}$), Iodine ($\\text{I}$), and Astatine ($\\text{At}$). Since Fluorine is at the top of the group, it has the smallest atomic radius and the highest effective nuclear charge among the halogens.<br><br>Therefore, Fluorine ($\\text{F}$) has the highest electronegativity in group $17$ (and in the entire periodic table).<br><br>Answer: $\\text{F}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883315a9fc0fc8c14171", "type": "singleCorrect", "question": {"text": "Which of the following elements of group $17$ has the highest negative electron gain enthalpy?", "image": null}, "options": [{"id": "3uhoj", "label": "A", "text": "Fluorine", "isCorrect": false, "image": null}, {"id": "bNnb7", "label": "B", "text": "Chlorine", "isCorrect": true, "image": null}, {"id": "wSqLX", "label": "C", "text": "Bromine", "isCorrect": false, "image": null}, {"id": "gFm8Q", "label": "D", "text": "Iodine", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The electron gain enthalpy generally becomes less negative as we move down a group. However, in group $17$, chlorine has a more negative electron gain enthalpy than fluorine.<br><br>This anomaly is due to the very small size of the fluorine atom. The added electron goes into the compact $2p$ subshell of fluorine, where it experiences significant interelectronic repulsion from the existing electrons. In contrast, chlorine has a larger $3p$ subshell, so the interelectronic repulsions are much weaker, and it can more easily accommodate an extra electron.<br><br>Therefore, chlorine has the highest negative electron gain enthalpy among all the halogens.<br><br>Answer: Chlorine", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3518c30a4553e1be275", "type": "singleCorrect", "question": {"text": "Which element from following has positive electron gain enthalpy?", "image": null}, "options": [{"id": "sntSE", "label": "A", "text": "Xenon", "isCorrect": true, "image": null}, {"id": "trIZx", "label": "B", "text": "Bromine", "isCorrect": false, "image": null}, {"id": "OZhQL", "label": "C", "text": "Iodine", "isCorrect": false, "image": null}, {"id": "yejHK", "label": "D", "text": "Chlorine", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Electron gain enthalpy is the enthalpy change when an electron is added to a neutral gaseous atom.<br><br>Halogens such as Chlorine, Bromine, and Iodine have a strong tendency to accept an electron to achieve a stable noble gas configuration, resulting in highly negative electron gain enthalpies.<br><br>Noble gases like Xenon have a completely filled and stable valence shell ($ns^2 np^6$). Adding an electron requires energy to place it in a higher energy principal quantum shell, overcoming interelectronic repulsions. Thus, Xenon has a positive electron gain enthalpy.<br><br>Answer: Xenon", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d58c30a4553e1bdd45", "type": "singleCorrect", "question": {"text": "Identify the most electronegative element by the following.", "image": null}, "options": [{"id": "Ze3b2", "label": "A", "text": "Oxygen", "isCorrect": false, "image": null}, {"id": "DOxaN", "label": "B", "text": "Nitrogen", "isCorrect": false, "image": null}, {"id": "jv1Lt", "label": "C", "text": "Fluorine", "isCorrect": true, "image": null}, {"id": "TlU70", "label": "D", "text": "Chlorine", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Electronegativity is the tendency of an atom to attract a shared pair of electrons towards itself.<br><br>According to the Pauling scale, the electronegativity values of the given elements are:<br>Fluorine: $4.0$<br>Oxygen: $3.5$<br>Nitrogen: $3.0$<br>Chlorine: $3.0$<br><br>Fluorine has the highest electronegativity among all elements in the periodic table.<br><br>Answer: Fluorine", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3368c30a4553e1be15f", "type": "singleCorrect", "question": {"text": "Identify increasing order of acidity for following diprotic acids in aqueous solutions.", "image": null}, "options": [{"id": "hhahY", "label": "A", "text": "$\\text{H}_2\\text{S} < \\text{H}_2\\text{Se} < \\text{H}_2\\text{Te}$", "isCorrect": true, "image": null}, {"id": "667dh", "label": "B", "text": "$\\text{H}_2\\text{Se} < \\text{H}_2\\text{S} < \\text{H}_2\\text{Te}$", "isCorrect": false, "image": null}, {"id": "4UaDX", "label": "C", "text": "$\\text{H}_2\\text{Te} < \\text{H}_2\\text{S} < \\text{H}_2\\text{Se}$", "isCorrect": false, "image": null}, {"id": "bWHYL", "label": "D", "text": "$\\text{H}_2\\text{Se} < \\text{H}_2\\text{Te} < \\text{H}_2\\text{S}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given compounds are hydrides of Group 16 elements.<br><br>As we move down the group from Sulphur (S) to Tellurium (Te), the atomic size of the central atom increases.<br><br>This leads to an increase in the H-E bond length (where E is S, Se, Te) and a corresponding decrease in the bond dissociation enthalpy.<br><br>Consequently, the H-E bond becomes weaker, making the release of an $\\text{H}^{+}$ ion easier.<br><br>Therefore, the acidic strength increases down the group.<br><br>The increasing order of acidity is $\\text{H}_2\\text{S} < \\text{H}_2\\text{Se} < \\text{H}_2\\text{Te}$.<br><br>Answer: $\\text{H}_2\\text{S} < \\text{H}_2\\text{Se} < \\text{H}_2\\text{Te}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31a8c30a4553e1be034", "type": "singleCorrect", "question": {"text": "Which group elements have the smallest atomic radii in their respective periods?", "image": null}, "options": [{"id": "YsWz4", "label": "A", "text": "group 15", "isCorrect": false, "image": null}, {"id": "nR0bB", "label": "B", "text": "group 16", "isCorrect": false, "image": null}, {"id": "TdDAD", "label": "C", "text": "group 17", "isCorrect": true, "image": null}, {"id": "vWXlS", "label": "D", "text": "group 18", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In a given period, the atomic radius decreases from left to right as the effective nuclear charge increases.<br><br>This trend continues up to group 17 (halogens).<br><br>For group 18 (noble gases), the atomic radius is expressed as van der Waals radius since they do not form covalent bonds under normal conditions.<br><br>Since van der Waals radii are always larger than covalent radii, group 18 elements have larger radii than group 17 elements.<br><br>Thus, group 17 elements possess the smallest atomic radii in their respective periods.<br><br>Answer: group 17", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31a8c30a4553e1be033", "type": "singleCorrect", "question": {"text": "What happens to the size of atoms in p-block elements when we move from left to right in the same period?", "image": null}, "options": [{"id": "EZVbt", "label": "A", "text": "Size does not change", "isCorrect": false, "image": null}, {"id": "Tcqf6", "label": "B", "text": "Size increases then decreases", "isCorrect": false, "image": null}, {"id": "kTSyG", "label": "C", "text": "Size increases", "isCorrect": false, "image": null}, {"id": "z6NvO", "label": "D", "text": "Size decreases", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "As we move from left to right across a period, the atomic number increases, meaning the number of protons in the nucleus increases.<br><br>The additional electrons are added to the same principal shell, so the shielding effect remains almost constant.<br><br>This results in an increase in the effective nuclear charge ($Z_{eff}$), which pulls the valence electrons closer to the nucleus.<br><br>Consequently, the atomic size decreases from left to right in the same period.<br><br>Answer: Size decreases", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3618c30a4553e1be321", "type": "singleCorrect", "question": {"text": "Which of the following compounds is most acidic in nature?", "image": null}, "options": [{"id": "ISDbb", "label": "A", "text": "$\\text{H}_2\\text{O}$", "isCorrect": false, "image": null}, {"id": "2MGWA", "label": "B", "text": "$\\text{H}_2\\text{S}$", "isCorrect": false, "image": null}, {"id": "VyryK", "label": "C", "text": "$\\text{H}_2\\text{Se}$", "isCorrect": false, "image": null}, {"id": "YIPi6", "label": "D", "text": "$\\text{H}_2\\text{Te}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given compounds are hydrides of Group 16 elements.<br><br>As we move down the group from oxygen to tellurium, the atomic size of the central atom increases.<br><br>Due to the increase in atomic size, the bond length of the $\\text{H-E}$ bond (where $\\text{E}$ is $\\text{O}$, $\\text{S}$, $\\text{Se}$, $\\text{Te}$) increases, which leads to a decrease in the bond dissociation enthalpy.<br><br>A lower bond dissociation enthalpy means the $\\text{H-E}$ bond can be broken more easily to release an $\\text{H}^+$ ion.<br><br>Therefore, the acidic character increases down the group.<br><br>The order of acidic strength is $\\text{H}_2\\text{O} < \\text{H}_2\\text{S} < \\text{H}_2\\text{Se} < \\text{H}_2\\text{Te}$.<br><br>Thus, $\\text{H}_2\\text{Te}$ is the most acidic compound among the given options.<br><br>Answer: $\\text{H}_2\\text{Te}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b88c30a4553e1bdc1a", "type": "singleCorrect", "question": {"text": "Which of the following hydrides of Group $16$ elements has highest reducing property?", "image": null}, "options": [{"id": "Vtfbi", "label": "A", "text": "$\\text{H}_2\\text{O}$", "isCorrect": false, "image": null}, {"id": "uA2JL", "label": "B", "text": "$\\text{H}_2\\text{S}$", "isCorrect": false, "image": null}, {"id": "T0BZ5", "label": "C", "text": "$\\text{H}_2\\text{Se}$", "isCorrect": false, "image": null}, {"id": "T605V", "label": "D", "text": "$\\text{H}_2\\text{Te}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The reducing property of Group $16$ hydrides depends on the ease with which they can release hydrogen atoms.<br><br>As we move down the group from oxygen to tellurium, the atomic size of the central atom increases.<br><br>This leads to an increase in the $E-\\text{H}$ bond length ($E = \\text{O, S, Se, Te}$) and a corresponding decrease in the bond dissociation enthalpy.<br><br>Due to the lowest bond dissociation enthalpy among the given options, $\\text{H}_2\\text{Te}$ releases hydrogen most easily.<br><br>Therefore, the reducing property increases in the order: $\\text{H}_2\\text{O} < \\text{H}_2\\text{S} < \\text{H}_2\\text{Se} < \\text{H}_2\\text{Te}$.<br><br>Hence, $\\text{H}_2\\text{Te}$ has the highest reducing property.<br><br>Answer: $\\text{H}_2\\text{Te}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bdebf9280d7f9932d21", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following elements has highest electronegativity?", "image": null}, "options": [{"id": "Ghjsz", "text": "Li", "image": null, "isCorrect": true}, {"id": "B4RV7", "text": "Na", "image": null, "isCorrect": false}, {"id": "7mCDV", "text": "K", "image": null, "isCorrect": false}, {"id": "kcqmt", "text": "Rb", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given elements belong to Group 1 (alkali metals) of the periodic table.<br><br>As we move down a group, the atomic size increases due to the addition of new electron shells. This increases the distance between the nucleus and the valence electrons, resulting in a weaker nuclear pull on the shared pair of electrons.<br><br>Therefore, electronegativity decreases down the group.<br><br>The order of electronegativity for the given elements is Li > Na > K > Rb.<br><br>Hence, Lithium (Li) has the highest electronegativity among the given options.<br><br>Answer: Li", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9abf9280d7f9932ac9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following elements has highest electronegativity?", "image": null}, "options": [{"id": "4OQ6S", "text": "Sr", "image": null, "isCorrect": false}, {"id": "exrzX", "text": "Ca", "image": null, "isCorrect": false}, {"id": "PKzVK", "text": "Mg", "image": null, "isCorrect": false}, {"id": "U11fM", "text": "Be", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given elements belong to Group 2 (alkaline earth metals) of the periodic table.<br><br>The order of elements in Group 2 from top to bottom is Be, Mg, Ca, Sr, Ba, Ra.<br><br>Electronegativity decreases as we move down a group due to an increase in atomic size and shielding effect, which reduces the effective nuclear charge felt by the valence electrons.<br><br>Therefore, the element at the top of the group among the given options, which is Beryllium (Be), has the highest electronegativity.<br><br>Answer: Be", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b79bf9280d7f9932993", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which is the correct increasing order of atomic radii of $\\mathrm{Na}, \\mathrm{K}, \\mathrm{Mg}, \\mathrm{Rb}$ ?", "image": null}, "options": [{"id": "iQ65A", "text": "$\\mathrm{Mg} < \\mathrm{K} < \\mathrm{Na} < \\mathrm{Rb}$", "image": null, "isCorrect": false}, {"id": "Nvcqy", "text": "$\\mathrm{Mg} < \\mathrm{Na} < \\mathrm{K} < \\mathrm{Rb}$", "image": null, "isCorrect": true}, {"id": "Kq2o8", "text": "$\\mathrm{Mg} < \\mathrm{Na} < \\mathrm{Rb} < \\mathrm{K}$", "image": null, "isCorrect": false}, {"id": "ez1yd", "text": "$\\mathrm{Na} < \\mathrm{K} < \\mathrm{Rb} < \\mathrm{Mg}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Atomic radius decreases across a period from left to right. Since $\\mathrm{Na}$ and $\\mathrm{Mg}$ belong to the same period (Period 3) and $\\mathrm{Mg}$ is to the right of $\\mathrm{Na}$, the atomic radius of $\\mathrm{Mg}$ is smaller than that of $\\mathrm{Na}$ ($\\mathrm{Mg} < \\mathrm{Na}$).<br><br>Atomic radius increases down a group. Since $\\mathrm{Na}$, $\\mathrm{K}$, and $\\mathrm{Rb}$ belong to the same group (Group 1) and are placed in the order $\\mathrm{Na}$, $\\mathrm{K}$, $\\mathrm{Rb}$ from top to bottom, their atomic radii increase in the order $\\mathrm{Na} < \\mathrm{K} < \\mathrm{Rb}$.<br><br>Combining these trends, the correct increasing order of atomic radii is $\\mathrm{Mg} < \\mathrm{Na} < \\mathrm{K} < \\mathrm{Rb}$.<br><br>Answer: $\\mathrm{Mg} < \\mathrm{Na} < \\mathrm{K} < \\mathrm{Rb}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214480aee93fa0796df6b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Identify basic oxide from following.", "image": null}, "options": [{"id": "WbRLF", "text": "$\\mathrm{SO}_3$", "image": null, "isCorrect": false}, {"id": "9dFTh", "text": "NO", "image": null, "isCorrect": false}, {"id": "U6RBt", "text": "$\\quad \\mathrm{Al}_2 \\mathrm{O}_3$", "image": null, "isCorrect": false}, {"id": "WIsJ3", "text": "CaO", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Oxides of metals are generally basic in nature, while oxides of non-metals are acidic or neutral.<br><br>$\\mathrm{SO}_3$ is an acidic oxide as it reacts with water to form sulfuric acid.<br><br>NO is a neutral oxide.<br><br>$\\mathrm{Al}_2 \\mathrm{O}_3$ is an amphoteric oxide as it reacts with both acids and bases.<br><br>CaO is a basic oxide as it is an oxide of an alkaline earth metal and reacts with water to form calcium hydroxide, a strong base.<br><br>Answer: CaO", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fd0aee93fa0796dd1c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Which element from following has largest atomic size as compared to other three?", "image": null}, "options": [{"id": "HSTol", "text": "S", "image": null, "isCorrect": false}, {"id": "gCRfu", "text": "Se", "image": null, "isCorrect": true}, {"id": "nPAqW", "text": "Cl", "image": null, "isCorrect": false}, {"id": "bwFWf", "text": "Br", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given elements belong to Group 16 (S, Se) and Group 17 (Cl, Br) of the periodic table.<br><br>Atomic size increases down a group due to the addition of new electron shells. Therefore, the elements in Period 4 (Se, Br) are larger than those in Period 3 (S, Cl).<br><br>Atomic size decreases across a period from left to right due to an increase in effective nuclear charge. Therefore, in Period 4, Group 16 element Selenium (Se) is larger than Group 17 element Bromine (Br).<br><br>Thus, Se has the largest atomic size among the given elements.<br><br>Answer: Se", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d50aee93fa0796dbdd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "If four different elements $\\mathrm{A}, \\mathrm{B}, \\mathrm{C}$ and D having electronic configuration as $A=[\\mathrm{Ne}] 3 \\mathrm{~s}^2 3 \\mathrm{p}^4$, $\\dot{B}=[\\mathrm{Ne}] 3 \\mathrm{~s}^2 3 \\mathrm{p}^5, \\mathrm{C}=[\\mathrm{Ar}] 3 \\mathrm{~d}^{10} 4 \\mathrm{~s}^2 4 \\mathrm{p}^4$ and $\\mathrm{D}=[\\mathrm{Ar}] 3 \\mathrm{~d}^{10} 4 \\mathrm{~s}^2 4 \\mathrm{p}^5$.\r\nIdentify the element with largest atomic radius.", "image": null}, "options": [{"id": "P8Avg", "text": "A", "image": null, "isCorrect": false}, {"id": "YlEFN", "text": "B", "image": null, "isCorrect": false}, {"id": "avGcy", "text": "C", "image": null, "isCorrect": true}, {"id": "852cY", "text": "D", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The electronic configurations of the given elements are:<br><br>$\\mathrm{A} = [\\mathrm{Ne}] 3\\mathrm{s}^2 3\\mathrm{p}^4$ (Period 3, Group 16)<br>$\\mathrm{B} = [\\mathrm{Ne}] 3\\mathrm{s}^2 3\\mathrm{p}^5$ (Period 3, Group 17)<br>$\\mathrm{C} = [\\mathrm{Ar}] 3\\mathrm{d}^{10} 4\\mathrm{s}^2 4\\mathrm{p}^4$ (Period 4, Group 16)<br>$\\mathrm{D} = [\\mathrm{Ar}] 3\\mathrm{d}^{10} 4\\mathrm{s}^2 4\\mathrm{p}^5$ (Period 4, Group 17)<br><br>Atomic radius increases down a group due to the addition of new electron shells and decreases across a period from left to right due to an increase in effective nuclear charge.<br><br>Since elements $\\mathrm{C}$ and $\\mathrm{D}$ belong to Period 4, they have larger atomic radii than elements $\\mathrm{A}$ and $\\mathrm{B}$, which belong to Period 3.<br><br>Between $\\mathrm{C}$ and $\\mathrm{D}$, element $\\mathrm{C}$ belongs to Group 16 while element $\\mathrm{D}$ belongs to Group 17. As atomic radius decreases across a period, element $\\mathrm{C}$ has a larger atomic radius than element $\\mathrm{D}$.<br><br>Thus, element $\\mathrm{C}$ has the largest atomic radius among the given elements.<br><br>Answer: C", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b10aee93fa0796dac8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Which from following elements has highest value of ionization enthalpy $\\left(\\Delta_1 \\mathrm{H}_1\\right)$ ?", "image": null}, "options": [{"id": "11KPn", "text": "He", "image": null, "isCorrect": true}, {"id": "H29RY", "text": "Ar", "image": null, "isCorrect": false}, {"id": "JGJrN", "text": "Cl", "image": null, "isCorrect": false}, {"id": "w9rUL", "text": "I", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ionization enthalpy generally increases across a period from left to right and decreases down a group from top to bottom.<br><br>Helium (He) is a noble gas placed at the extreme top right of the periodic table.<br><br>It has the smallest atomic size and a completely filled, highly stable $1s^2$ electronic configuration.<br><br>Due to the strong effective nuclear charge and small size, the removal of an electron from He requires the maximum amount of energy among all elements.<br><br>Thus, He has the highest first ionization enthalpy.<br><br>Answer: He", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213740aee93fa0796d8e6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Identify the element having lowest first ionization enthalpy.", "image": null}, "options": [{"id": "5aaUi", "text": "Po", "image": null, "isCorrect": true}, {"id": "RGCXD", "text": "Te", "image": null, "isCorrect": false}, {"id": "F2z08", "text": "Br", "image": null, "isCorrect": false}, {"id": "g6RiV", "text": "Kr", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "First ionization enthalpy generally increases across a period from left to right and decreases down a group from top to bottom.<br><br>Among the given elements, Kr is a noble gas (Group 18) and Br is a halogen (Group 17), both of which have relatively high first ionization enthalpies.<br><br>Te and Po belong to Group 16. Since ionization enthalpy decreases down the group due to an increase in atomic size and shielding effect, Po (Period 6) has a lower first ionization enthalpy than Te (Period 5).<br><br>Thus, Po has the lowest first ionization enthalpy among the given options.<br><br>Answer: Po", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213500aee93fa0796d7d1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Identify the element with lowest electronegativity.", "image": null}, "options": [{"id": "dv0NK", "text": "O", "image": null, "isCorrect": false}, {"id": "d6agp", "text": "$\\cdot \\mathrm{S}$", "image": null, "isCorrect": true}, {"id": "4k3wQ", "text": "F", "image": null, "isCorrect": false}, {"id": "8jmwR", "text": "Cl", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Electronegativity generally increases across a period from left to right and decreases down a group from top to bottom.<br><br>Among the given elements, F and O belong to the second period, while Cl and S belong to the third period. Therefore, S and Cl have lower electronegativity than O and F.<br><br>Between S and Cl, S is placed to the left of Cl in the third period, so S has a lower electronegativity than Cl.<br><br>The Pauling electronegativity values are F = 4.0, O = 3.5, Cl = 3.0, and S = 2.5.<br><br>Thus, S has the lowest electronegativity.<br><br>Answer: $\\cdot \\mathrm{S}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792132b0aee93fa0796d6af", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Identify the element having outer electronic configuration $\\mathrm{ns}^2 \\mathrm{np}^5$.", "image": null}, "options": [{"id": "GAIIU", "text": "I", "image": null, "isCorrect": true}, {"id": "3UmYj", "text": "Te", "image": null, "isCorrect": false}, {"id": "8QpsA", "text": "Ar", "image": null, "isCorrect": false}, {"id": "5WjPP", "text": "Ne", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The outer electronic configuration $ns^2 np^5$ corresponds to the elements of Group 17 (halogens) in the periodic table.<br><br>Among the given options, Iodine (I) belongs to Group 17 and has the outer electronic configuration $5s^2 5p^5$.<br><br>Tellurium (Te) belongs to Group 16 with configuration $5s^2 5p^4$.<br><br>Argon (Ar) and Neon (Ne) belong to Group 18 (noble gases) with configurations $3s^2 3p^6$ and $2s^2 2p^6$ respectively.<br><br>Answer: I", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792132b0aee93fa0796d6ad", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Which from following species does not have number of electrons similar to other three species?", "image": null}, "options": [{"id": "DJ6x8", "text": "Ne", "image": null, "isCorrect": false}, {"id": "pcZT4", "text": "$\\mathrm{O}^{2-}$", "image": null, "isCorrect": false}, {"id": "meZSJ", "text": "Na", "image": null, "isCorrect": true}, {"id": "wPgZx", "text": "$\\mathrm{Na}^{+}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Atomic number of Ne is $10$, so neutral Ne has $10$ electrons.<br><br>Atomic number of O is $8$, so $\\mathrm{O}^{2-}$ has $8 + 2 = 10$ electrons.<br><br>Atomic number of Na is $11$, so $\\mathrm{Na}^{+}$ has $11 - 1 = 10$ electrons.<br><br>Neutral Na has $11$ electrons.<br><br>Thus, Na has $11$ electrons while the other three species are isoelectronic with $10$ electrons each.<br><br>Answer: Na", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213250aee93fa0796d683", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "Which element from following is used in photoelectric cells?", "image": null}, "options": [{"id": "4ZO3w", "text": "Li", "image": null, "isCorrect": false}, {"id": "YFhiH", "text": "Be", "image": null, "isCorrect": false}, {"id": "Jfz3z", "text": "Cs", "image": null, "isCorrect": true}, {"id": "pIyJ2", "text": "Mg", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Photoelectric cells require metals with very low ionization enthalpy so that they can easily emit electrons when exposed to light.<br><br>Among the given options, Cesium (Cs) is an alkali metal located at the bottom of group 1, and it has the lowest ionization enthalpy.<br><br>Therefore, Cs is widely used in photoelectric cells.<br><br>Answer: Cs", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262810279619d9d8a3511", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Identify the element having highest ionization enthalpy.", "image": null}, "options": [{"id": "4Ex0Z", "text": "Ti", "image": null, "isCorrect": false}, {"id": "GttZg", "text": "Sc", "image": null, "isCorrect": false}, {"id": "oFsit", "text": "Zn", "image": null, "isCorrect": true}, {"id": "9AKoN", "text": "Ni", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{Zn}$ has completely filled outer shell configuration. Hence, it has highest ionization enthalpy among $3 \\mathrm{~d}$ series elements.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625d0279619d9d8a33eb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Which from following series of elements is CORRECTLY arranged according to their decreasing order of ionization enthalpy $\\left(\\mathrm{IE}_1\\right)$ ?", "image": null}, "options": [{"id": "kYyex", "text": "$\\mathrm{Zn}>\\mathrm{Fe}>\\mathrm{Cr}>\\mathrm{Sc}$", "image": null, "isCorrect": true}, {"id": "Ek07k", "text": "$\\mathrm{Cr}>\\mathrm{Fe}>\\mathrm{Zn}>\\mathrm{Sc}$", "image": null, "isCorrect": false}, {"id": "Kb93o", "text": "$\\mathrm{Sc}>\\mathrm{Fe}>\\mathrm{Cr}>\\mathrm{Zn}$", "image": null, "isCorrect": false}, {"id": "4MpZl", "text": "$\\mathrm{Cr}>\\mathrm{Zn}>\\mathrm{Sc}>\\mathrm{Fe}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The ionization enthalpy $\\left(\\mathrm{IE}_1\\right)$ of the elements of the $3 \\mathrm{~d}$ transition series increases gradually from left to right with some irregularities. Therefore, the decreasing order of ionization enthalpy $\\left(\\mathrm{IE}_1\\right)$ is: $\\mathrm{Zn}>\\mathrm{Fe}>\\mathrm{Cr}>\\mathrm{Sc}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 iced": null}, {"_id": "65a262250279619d9d8a3228", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Identify the element having highest density from following.", "image": null}, "options": [{"id": "Ldy56", "text": "$\\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "DBUFE", "text": "$\\mathrm{S}$", "image": null, "isCorrect": false}, {"id": "JjgIO", "text": "$\\mathrm{Se}$", "image": null, "isCorrect": false}, {"id": "tp0C7", "text": "$\\mathrm{Te}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In group 16 , density increases down the group.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e70279619d9d8a3043", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "Which from following is a CORRECT decreasing order of ionization enthalpies of different elements?", "image": null}, "options": [{"id": "3qPme", "text": "$\\mathrm{S}>\\mathrm{Se}>\\mathrm{Te}>\\mathrm{Po}$", "image": null, "isCorrect": true}, {"id": "y12IL", "text": "$\\mathrm{Te}>\\mathrm{Po}>\\mathrm{S}>\\mathrm{Se}$", "image": null, "isCorrect": false}, {"id": "hG3rp", "text": "$\\mathrm{S}>\     let currentTopicIndex = 0;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
