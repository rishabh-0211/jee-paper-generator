usCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213fd0aee93fa0796dd19", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Identify the correct statement for following reaction.\r\n$3 \\mathrm{Mg}+\\mathrm{N}_2 \\longrightarrow \\mathrm{Mg}_3 \\mathrm{~N}_2$", "image": null}, "options": [{"id": "OkGEA", "text": "Mg is reduced", "image": null, "isCorrect": false}, {"id": "ma2EK", "text": "Mg is oxidised", "image": null, "isCorrect": true}, {"id": "JBw8T", "text": "$\\mathrm{N}_2$ is oxidised", "image": null, "isCorrect": false}, {"id": "oJKXW", "text": "oxidation state of Mg changes from +2 to zero", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given reaction is $3 \\mathrm{Mg} + \\mathrm{N}_2 \\longrightarrow \\mathrm{Mg}_3\\mathrm{N}_2$.<br><br>The oxidation state of elemental Mg is $0$.<br><br>In $\\mathrm{Mg}_3\\mathrm{N}_2$, the oxidation state of Mg is $+2$.<br><br>Since the oxidation state of Mg increases from $0$ to $+2$, Mg undergoes oxidation.<br><br>The oxidation state of elemental $\\mathrm{N}_2$ is $0$.<br><br>In $\\mathrm{Mg}_3\\mathrm{N}_2$, the oxidation state of N is $-3$.<br><br>Since the oxidation state of N decreases from $0$ to $-3$, $\\mathrm{N}_2$ undergoes reduction.<br><br>Thus, Mg is oxidised.<br><br>Answer: Mg is oxidised", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b00aee93fa0796dabd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "Which of the following elements does not react with water to form metal hydroxide?", "image": null}, "options": [{"id": "mbSnM", "text": "Mg", "image": null, "isCorrect": false}, {"id": "n3R1c", "text": "Ca", "image": null, "isCorrect": false}, {"id": "yDbMm", "text": "Be", "image": null, "isCorrect": true}, {"id": "eUC9A", "text": "Sr", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Beryllium (Be) is the only alkaline earth metal that does not react with water or steam even at red heat due to its small size and high ionization enthalpy.<br><br>Magnesium (Mg) reacts with hot water to form magnesium hydroxide.<br><br>Calcium (Ca) and Strontium (Sr) react with cold water to form their respective metal hydroxides.<br><br>Answer: Be", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792135f0aee93fa0796d846", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "Which of the following does not react with cold or hot water?", "image": null}, "options": [{"id": "mMCcK", "text": "Ba", "image": null, "isCorrect": false}, {"id": "ZPC05", "text": "Ca", "image": null, "isCorrect": false}, {"id": "AnAO8", "text": "Sr", "image": null, "isCorrect": false}, {"id": "iAQN7", "text": "Be", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Beryllium (Be) does not react with cold or hot water due to its small size and high ionization enthalpy.<br><br>Magnesium (Mg) reacts with hot water to form magnesium hydroxide and hydrogen gas.<br><br>Calcium (Ca), Strontium (Sr), and Barium (Ba) react readily with cold water to form their respective hydroxides and evolve hydrogen gas.<br><br>Therefore, Be is the element that does not react with cold or hot water.<br><br>Answer: Be", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133b0aee93fa0796d72b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Which compound is used in medicine as barium meal for intestinal x-ray?", "image": null}, "options": [{"id": "7WYf4", "text": "Barium chloride", "image": null, "isCorrect": false}, {"id": "DfGIq", "text": "Barium sulphate", "image": null, "isCorrect": true}, {"id": "nCBpr", "text": "Barium sulphide", "image": null, "isCorrect": false}, {"id": "gtbEO", "text": "Barium nitrate", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Barium sulphate ($BaSO_4$) is used in medicine as a barium meal for intestinal X-rays.<br><br>Although barium ions are highly toxic, barium sulphate is highly insoluble in water and gastric juices. Therefore, it is not absorbed into the bloodstream and passes safely through the digestive tract.<br><br>It is opaque to X-rays, which helps in providing a clear contrast image of the gastrointestinal tract.<br><br>Other barium compounds like barium chloride, barium sulphide, and barium nitrate are soluble in water and are highly toxic.<br><br>Answer: Barium sulphate", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625e0279619d9d8a33f3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Identify alkaline earth metal from following.", "image": null}, "options": [{"id": "YAVib", "text": "$\\mathrm{Rb}$", "image": null, "isCorrect": false}, {"id": "AbP1H", "text": "$\\mathrm{Sr}$", "image": null, "isCorrect": true}, {"id": "QKG2G", "text": "$\\mathrm{Fr}$", "image": null, "isCorrect": false}, {"id": "jeD2K", "text": "$\\mathrm{Cs}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.11|Ch-8 | Subtopic-8.2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2618b0279619d9d8a2d6d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "Which from following elements does not react with water?", "image": null}, "options": [{"id": "LRcg4", "text": "$\\mathrm{Sr}$", "image": null, "isCorrect": false}, {"id": "zT5xG", "text": "Mg", "image": null, "isCorrect": false}, {"id": "kgVcg", "text": "$\\mathrm{Be}$", "image": null, "isCorrect": true}, {"id": "LWs38", "text": "$\\mathrm{Ca}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Be is inert with $\\mathrm{H}_2 \\mathrm{O}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260e10279619d9d8a280b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "Which among the following elements is used in nuclear reactors as moderator?", "image": null}, "options": [{"id": "oBeYX", "text": "Mg", "image": null, "isCorrect": false}, {"id": "7yZDl", "text": "Ca", "image": null, "isCorrect": false}, {"id": "11pk1", "text": "$\\mathrm{Be}$", "image": null, "isCorrect": true}, {"id": "V4qgE", "text": "K", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Theory based", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a90279619d9d8a264c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "All the elements of group 2 react with water to form metal hydroxide and hydrogen, except the element", "image": null}, "options": [{"id": "w3kkU", "text": "Barium", "image": null, "isCorrect": false}, {"id": "di3WJ", "text": "Calcium", "image": null, "isCorrect": false}, {"id": "oeg86", "text": "Magnesium", "image": null, "isCorrect": false}, {"id": "cqM3B", "text": "Beryllium", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Beryllium $(\\mathrm{Be})$ is the only alkaline earth metal that does not react with water. This is due to its small size and high ionization energy in relation to the other elements in the group.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260640279619d9d8a241a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "Which of the following is NOT true for alkaline earth metals?", "image": null}, "options": [{"id": "TvJz2", "text": "Their divalent ions have inert gas configuration", "image": null, "isCorrect": false}, {"id": "oyqRK", "text": "They are more electropositive than alkali metals", "image": null, "isCorrect": true}, {"id": "byaXa", "text": "Alkaline earth metals are silvery white and soft", "image": null, "isCorrect": false}, {"id": "YWzu8", "text": "Their compounds are diamagnetic and colourless", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "- Alkali metals have low ionization energies and their atoms readily lose the valence electron hence they are most electropositive elements.\n- Compound of alkaline earth metals are diamagnetic and colour less.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fa30279619d9d8a1e13", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "The increasing order of reactivity of alkaline earth metals with water is", "image": null}, "options": [{"id": "pVz3d", "text": "$\\mathrm{Mg} < \\mathrm{Sr} < \\mathrm{Ca} < \\mathrm{Ba}$", "image": null, "isCorrect": false}, {"id": "AFqLg", "text": "$\\mathrm{Ba} < \\mathrm{Mg} < \\mathrm{Ca} < \\mathrm{Sr}$", "image": null, "isCorrect": false}, {"id": "H8s6n", "text": "$\\mathrm{Ba} < \\mathrm{Sr} < \\mathrm{Ca} < \\mathrm{Mg}$", "image": null, "isCorrect": false}, {"id": "iX8bE", "text": "$\\mathrm{Mg} < \\mathrm{Ca} < \\mathrm{Sr} < \\mathrm{Ba}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "From top to bottom of the group, size of atoms increases hence the valence electrons goes away from the nucleus. Therefore, the reactivity of alkaline earth metals increases from top to bottom of the group.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f360279619d9d8a1aa7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "Identify the ore of magnesium from following?", "image": null}, "options": [{"id": "iANpc", "text": "Siderite", "image": null, "isCorrect": false}, {"id": "4q19f", "text": "Calamine", "image": null, "isCorrect": false}, {"id": "xHKcg", "text": "Limonite", "image": null, "isCorrect": false}, {"id": "rZpWF", "text": "Dolomite", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Magnesium is found in minerals such as magnesite, dolomite, brucite, serpentinite, etc. and is mostly recovered from seawater, brines and bitterns . Dolomite ore is considered one of the most suitable ores for obtaining magnesium and its various compounds.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e9f0279619d9d8a15eb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "Which of the following is least hydrolysed?", "image": null}, "options": [{"id": "EGDhp", "text": "$\\mathrm{BeCl}_{2}$", "image": null, "isCorrect": true}, {"id": "BZ2Gp", "text": "$\\mathrm{MgCl}_{2}$", "image": null, "isCorrect": false}, {"id": "yVn9U", "text": "$\\mathrm{CaCl}_{2}$", "image": null, "isCorrect": false}, {"id": "jJQep", "text": "$\\mathrm{BaCl}_{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{BeCl}_{2}$ is covalent whereas all other group-II metal halides are electrovalent. Therefore, $\\mathrm{BeCl}_{2}$ is least hydrolysed.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263470279619d9d8a3dc4", "title": "Compounds of Alkaline Earth Metals", "totalQuestions": 6, "questions": [{"_id": "6abb888f15a9fc0fc8c144dd", "type": "singleCorrect", "question": {"text": "Which compound is used in medicine as barium meal for intestinal x-ray?", "image": null}, "options": [{"id": "xtMXn", "label": "A", "text": "Barium chloride", "isCorrect": false, "image": null}, {"id": "vhV5M", "label": "B", "text": "Barium sulphate", "isCorrect": true, "image": null}, {"id": "2Imqp", "label": "C", "text": "Barium sulphide", "isCorrect": false, "image": null}, {"id": "xoEsU", "label": "D", "text": "Barium nitrate", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Barium sulphate ($BaSO_4$) is used in medicine as a barium meal for intestinal X-rays. It is highly insoluble in water and gastric juices, which prevents the toxic barium ions from being absorbed into the bloodstream. Its high atomic number makes it an excellent radiocontrast agent that absorbs X-rays, providing clear imaging of the gastrointestinal tract.<br><br>Answer: Barium sulphate", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3368c30a4553e1be160", "type": "singleCorrect", "question": {"text": "Which of the following compounds is formed when chlorine reacts with dry slake lime $\\text{Ca(OH)}_2$ ?", "image": null}, "options": [{"id": "uGYJg", "label": "A", "text": "$\\text{CaOCl}_2$", "isCorrect": true, "image": null}, {"id": "aQDjP", "label": "B", "text": "$\\text{CaO}_2\\text{Cl}_2$", "isCorrect": false, "image": null}, {"id": "fZIq4", "label": "C", "text": "$\\text{CaOCl}$", "isCorrect": false, "image": null}, {"id": "TW1gv", "label": "D", "text": "$\\text{CaCl}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "When chlorine gas is passed over dry slaked lime $\\text{Ca(OH)}_2$, bleaching powder is formed.<br><br>The chemical reaction is given by:<br><br>$\\text{Ca(OH)}_2 + \\text{Cl}_2 \\rightarrow \\text{CaOCl}_2 + \\text{H}_2\\text{O}$<br><br>The compound formed is $\\text{CaOCl}_2$.<br><br>Answer: $\\text{CaOCl}_2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b39bf9280d7f9932744", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following compound is used for preparation of quicklime?", "image": null}, "options": [{"id": "lBJfC", "text": "Caustic soda", "image": null, "isCorrect": false}, {"id": "ZS5Iw", "text": "Sodium carbonate", "image": null, "isCorrect": false}, {"id": "VpCqW", "text": "Calcium carbonate", "image": null, "isCorrect": true}, {"id": "i19yG", "text": "Magnesium carbonate", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Quicklime is calcium oxide, $CaO$.<br><br>It is prepared commercially by heating limestone, which is calcium carbonate ($CaCO_3$), in a rotary kiln at $1070-1270\\text{ K}$.<br><br>The reaction is:<br>$CaCO_3 \\xrightarrow{\\Delta} CaO + CO_2$<br><br>Therefore, calcium carbonate is used for the preparation of quicklime.<br><br>Answer: Calcium carbonate", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c10aee93fa0796db40", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Which of the following compounds is recovered in solvay's process when $\\mathrm{NH}_4 \\mathrm{Cl}$ is treated with slaked lime?", "image": null}, "options": [{"id": "EoCcc", "text": "NaCl", "image": null, "isCorrect": false}, {"id": "Y05WL", "text": "$\\quad \\mathrm{NH}_4 \\mathrm{HCO}_3$", "image": null, "isCorrect": false}, {"id": "rnzvi", "text": "$\\mathrm{NH}_3$", "image": null, "isCorrect": true}, {"id": "OJp5Q", "text": "$\\mathrm{CO}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In Solvay's process, ammonia is recovered from the byproduct ammonium chloride by treating it with slaked lime, $\\mathrm{Ca(OH)}_2$.<br><br>The reaction involved is:<br><br>$2\\mathrm{NH}_4\\mathrm{Cl} + \\mathrm{Ca(OH)}_2 \\rightarrow 2\\mathrm{NH}_3 + \\mathrm{CaCl}_2 + 2\\mathrm{H}_2\\mathrm{O}$<br><br>Thus, the compound recovered is $\\mathrm{NH}_3$.<br><br>Answer: $\\mathrm{NH}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2610b0279619d9d8a295f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "Which element from following forms a chlorophyll complex?", "image": null}, "options": [{"id": "TdRwl", "text": "Iron", "image": null, "isCorrect": false}, {"id": "VdtKZ", "text": "Magnesium", "image": null, "isCorrect": true}, {"id": "4UqaL", "text": "Calcium", "image": null, "isCorrect": false}, {"id": "fluDd", "text": "Cobalt", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Theory based", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea20279619d9d8a1609", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "Gypsum is", "image": null}, "options": [{"id": "hbLwn", "text": "$\\mathrm{CaSO}_{4} \\cdot \\mathrm{H}_{2} \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "P9ITE", "text": "$\\mathrm{CaSO}_{4} \\cdot 2 \\mathrm{H}_{2} \\mathrm{O}$", "image": null, "isCorrect": true}, {"id": "1bkvq", "text": "$2 \\mathrm{CaSO}_{4} \\cdot 2 \\mathrm{H}_{2} \\mathrm{O}$", "image": null, "isCorrect": false}, {"id": "ZxSp5", "text": "$\\mathrm{CaSO}_{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Gypsum is $\\mathrm{CaSO}_{4} \\cdot 2 \\mathrm{H}_{2} \\mathrm{O}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a263480279619d9d8a3dc6", "title": "Properties of S-block elements", "totalQuestions": 16, "questions": [{"_id": "6abb88d015a9fc0fc8c14735", "type": "singleCorrect", "question": {"text": "Which element from group $2$ of periodic table resembles with lithium for different properties ?", "image": null}, "options": [{"id": "PyGkP", "label": "A", "text": "Ca", "isCorrect": false, "image": null}, {"id": "RvP2P", "label": "B", "text": "Be", "isCorrect": false, "image": null}, {"id": "anXJv", "label": "C", "text": "Ba", "isCorrect": false, "image": null}, {"id": "yJagE", "label": "D", "text": "Mg", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Lithium (Group $1$, Period $2$) shows a diagonal relationship with magnesium (Group $2$, Period $3$) in the periodic table.<br><br>This resemblance is due to their similar atomic and ionic radii, as well as their similar polarizing power (charge-to-size ratio).<br><br>Because of this diagonal relationship, lithium and magnesium share several similar chemical properties, such as forming normal oxides, reacting directly with nitrogen to form nitrides, and having carbonates that decompose on heating.<br><br>Answer: Mg", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889f15a9fc0fc8c14573", "type": "singleCorrect", "question": {"text": "Which of the following is an amphoteric hydroxide?", "image": null}, "options": [{"id": "1KLPS", "label": "A", "text": "$\\text{Mg(OH)}_2$", "isCorrect": false, "image": null}, {"id": "sWXEx", "label": "B", "text": "$\\text{Be(OH)}_2$", "isCorrect": true, "image": null}, {"id": "AJDs0", "label": "C", "text": "$\\text{Sr(OH)}_2$", "isCorrect": false, "image": null}, {"id": "mWEKA", "label": "D", "text": "$\\text{Ca(OH)}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Beryllium hydroxide, $\\text{Be(OH)}_2$, is amphoteric in nature because it reacts with both acids and bases.<br><br>$\\text{Be(OH)}_2 + 2\\text{HCl} \\rightarrow \\text{BeCl}_2 + 2\\text{H}_2\\text{O}$<br><br>$\\text{Be(OH)}_2 + 2\\text{NaOH} \\rightarrow \\text{Na}_2[\\text{Be(OH)}_4]$<br><br>The hydroxides of other alkaline earth metals ($\\text{Mg}$, $\\text{Ca}$, $\\text{Sr}$, $\\text{Ba}$) are basic in nature.<br><br>Answer: $\\text{Be(OH)}_2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214200aee93fa0796de32", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "Beryllium shows diagonal relationship with", "image": null}, "options": [{"id": "LDL7V", "text": "Na", "image": null, "isCorrect": false}, {"id": "T5BaC", "text": "Mg", "image": null, "isCorrect": false}, {"id": "X8umu", "text": "Al", "image": null, "isCorrect": true}, {"id": "gm1vt", "text": "Si", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the periodic table, certain elements of the second period show a diagonal relationship with elements of the third period present in the next group. This is due to their similar ionic radii and charge-to-size ratio (polarizing power).<br><br>Beryllium (Be) is present in Group 2 and Period 2. It shows a diagonal relationship with Aluminum (Al), which is present in Group 13 and Period 3.<br><br>Answer: Al", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213e90aee93fa0796dc7e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Which of the following element is used in photoelectric cell?", "image": null}, "options": [{"id": "i3N4c", "text": "Beryllium", "image": null, "isCorrect": false}, {"id": "Ztqc4", "text": "Liquid sodium", "image": null, "isCorrect": false}, {"id": "Zq9NJ", "text": "Caesium", "image": null, "isCorrect": true}, {"id": "hjMHL", "text": "Calcium", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Caesium has a very low ionization enthalpy and a low work function. Therefore, it can easily emit electrons when exposed to light, making it highly suitable for use in photoelectric cells.<br><br>Answer: Caesium", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262460279619d9d8a3332", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Which from following properties is exhibited by group 2 elements?", "image": null}, "options": [{"id": "qGqEu", "text": "Act as inert elements in +1 state.", "image": null, "isCorrect": false}, {"id": "cNdVA", "text": "Form $\\mathrm{MH}_2$ type hydrides with hydrogen on heating.", "image": null, "isCorrect": true}, {"id": "sUzDP", "text": "Elements at the top in the group catch fire when kept on water.", "image": null, "isCorrect": false}, {"id": "gBihJ", "text": "Reducing power of these elements is more than group I elements.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "All the metals of group 2, except beryllium, when heated with hydrogen form $\\mathrm{MH}_2$ type hydrides. Hence, statement (B) is correct.\nElements of group 2 elements act as inert elements in +2 state. Elements at the top in the group 2 do not catch fire when kept on water. Reducing power of group 2 elements is less than group 1 elements. Hence, statements (A), (C) and (D) are incorrect.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262240279619d9d8a321f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "Which element from following exhibits diagonal relationship with $\\mathrm{Mg}$ ?", "image": null}, "options": [{"id": "tx2Zb", "text": "$\\mathrm{Be}$", "image": null, "isCorrect": false}, {"id": "8dYID", "text": "$\\mathrm{Li}$", "image": null, "isCorrect": true}, {"id": "x1KKT", "text": "$\\mathrm{Na}$", "image": null, "isCorrect": false}, e and Al is due to", "image": null}, "options": [{"id": "O7QoB", "text": "Similar ionisation enthalpy", "image": null, "isCorrect": false}, {"id": "fCsd1", "text": "Similar metallic character", "image": null, "isCorrect": false}, {"id": "tDk1Z", "text": "Similar ionic size and charge/radius ratio", "image": null, "isCorrect": true}, {"id": "QGWPc", "text": "Anthraquinone", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The diagonal relationship in Be and Al is due to similar ionic size and charge/radius ratio. Generally, on moving from left to right across a period the ionic charge/radius ratio. Period, the ionic charge increase to maximum and then decreases, while the ionic size decreases causing an increase in its polarising power (Fajan’s). on the other hand, on moving down a group the ionic charge remains the same while ionic size increases. Therefore, polarising power decreases. On moving diagonally, therefore, there is no marked change in their properties.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ed80279619d9d8a17bc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "Which among the following elements of group-2 exhibits anomalous properties?", "image": null}, "options": [{"id": "npvDs", "text": "Be", "image": null, "isCorrect": true}, {"id": "EOMt5", "text": "Mg", "image": null, "isCorrect": false}, {"id": "PR7Xt", "text": "Ca", "image": null, "isCorrect":     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
