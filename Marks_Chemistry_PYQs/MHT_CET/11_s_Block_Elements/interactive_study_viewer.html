  <script>
    const data = {"index": 11, "chapterId": "61c089a7663468b6d34550ff", "chapter": "s Block Elements", "exam": "MHT CET", "totalTopics": 5, "totalQuestions": 80, "downloadTime": "2026-10-08 20:06:05", "topics": [{"index": 1, "topicId": "65a263480279619d9d8a3dc5", "title": "General Characteristics of Alkali Metals", "totalQuestions": 28, "questions": [{"_id": "6abb885015a9fc0fc8c14285", "type": "singleCorrect", "question": {"text": "Which one of the following nitrates will decompose to give $\\text{NO}_2$ on heating ?", "image": null}, "options": [{"id": "vj8G2", "label": "A", "text": "$\\text{NaNO}_3$", "isCorrect": false, "image": null}, {"id": "Doai1", "label": "B", "text": "$\\text{KNO}_3$", "isCorrect": false, "image": null}, {"id": "8chmh", "label": "C", "text": "$\\text{RbNO}_3$", "isCorrect": false, "image": null}, {"id": "cFCg3", "label": "D", "text": "$\\text{LiNO}_3$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Alkali metal nitrates generally decompose on heating to give the corresponding metal nitrite and oxygen gas.<br><br>$2\\text{MNO}_3 \\xrightarrow{\\Delta} 2\\text{MNO}_2 + \\text{O}_2$ (where $\\text{M} = \\text{Na}, \\text{K}, \\text{Rb}, \\text{Cs}$)<br><br>However, lithium is an exception due to its small size and high polarizing power. It exhibits a diagonal relationship with magnesium. Lithium nitrate decomposes on heating to give lithium oxide, nitrogen dioxide, and oxygen.<br><br>$4\\text{LiNO}_3 \\xrightarrow{\\Delta} 2\\text{Li}_2\\text{O} + 4\\text{NO}_2 + \\text{O}_2$<br><br>Therefore, $\\text{LiNO}_3$ decomposes to give $\\text{NO}_2$ on heating.<br><br>Answer: $\\text{LiNO}_3$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3008c30a4553e1bdf15", "type": "singleCorrect", "question": {"text": "Which element from following forms superoxide with oxygen?", "image": null}, "options": [{"id": "36pAK", "label": "A", "text": "Sodium", "isCorrect": false, "image": null}, {"id": "Eyj2y", "label": "B", "text": "Potassium", "isCorrect": true, "image": null}, {"id": "FmF6s", "label": "C", "text": "Lithium", "isCorrect": false, "image": null}, {"id": "xJGmI", "label": "D", "text": "Magnesium", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Alkali metals react with oxygen to form different types of oxides depending on their size.<br><br>Lithium forms mainly monoxide ($Li_{2}O$).<br><br>Sodium forms mainly peroxide ($Na_{2}O_{2}$).<br><br>Potassium, rubidium, and cesium form mainly superoxides ($MO_{2}$) due to the stabilization of the large superoxide ion by large cations.<br><br>Magnesium forms mainly monoxide ($MgO$).<br><br>Therefore, potassium forms a superoxide with oxygen.<br><br>Answer: Potassium", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ee8c30a4553e1bde57", "type": "singleCorrect", "question": {"text": "What is the general formula of halide salts of alkali metals if M is a metal atom ?", "image": null}, "options": [{"id": "uChXz", "label": "A", "text": "$\\text{MX}$", "isCorrect": true, "image": null}, {"id": "exyn4", "label": "B", "text": "$\\text{MX}_2$", "isCorrect": false, "image": null}, {"id": "79Mcd", "label": "C", "text": "$\\text{M}_3\\text{X}_2$", "isCorrect": false, "image": null}, {"id": "0AU6y", "label": "D", "text": "$\\text{M}_2\\text{X}_3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Alkali metals belong to Group 1 of the periodic table and have one valence electron. They lose this electron to form a unipositive ion, $M^{+}$.<br><br>Halogens belong to Group 17 and have seven valence electrons. They gain one electron to form a uninegative ion, $X^{-}$.<br><br>To form a neutral salt, one $M^{+}$ ion combines with one $X^{-}$ ion.<br><br>The general formula of halide salts of alkali metals is $MX$.<br><br>Answer: $\\text{MX}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3468c30a4553e1be206", "type": "singleCorrect", "question": {"text": "Which from the following metal chlorides does not contain water of crystallisation ?", "image": null}, "options": [{"id": "gnrNe", "label": "A", "text": "$\\text{LiCl}$", "isCorrect": false, "image": null}, {"id": "8D0Xp", "label": "B", "text": "$\\text{MgCl}_2$", "isCorrect": false, "image": null}, {"id": "OHva5", "label": "C", "text": "$\\text{CsCl}$", "isCorrect": true, "image": null}, {"id": "YlaoB", "label": "D", "text": "$\\text{BeCl}_2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Alkali metal chlorides generally do not form hydrates, with the exception of lithium chloride, which is deliquescent and crystallises as a dihydrate, $\\text{LiCl} \\cdot 2\\text{H}_2\\text{O}$.<br><br>Alkaline earth metal chlorides such as $\\text{MgCl}_2$ and $\\text{BeCl}_2$ readily form hydrates. $\\text{MgCl}_2$ crystallises as a hexahydrate, $\\text{MgCl}_2 \\cdot 6\\text{H}_2\\text{O}$, and $\\text{BeCl}_2$ crystallises as a tetrahydrate, $\\text{BeCl}_2 \\cdot 4\\text{H}_2\\text{O}$.<br><br>Caesium chloride ($\\text{CsCl}$) is an alkali metal chloride that does not form hydrates and crystallises as an anhydrous salt.<br><br>Therefore, $\\text{CsCl}$ does not contain water of crystallisation.<br><br>Answer: $\\text{CsCl}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3188c30a4553e1be01b", "type": "singleCorrect", "question": {"text": "Identify the alkali metal having the smallest atomic size from following.", "image": null}, "options": [{"id": "sGXok", "label": "A", "text": "Sodium", "isCorrect": true, "image": null}, {"id": "kGKxl", "label": "B", "text": "Potassium", "isCorrect": false, "image": null}, {"id": "DJZgk", "label": "C", "text": "Rubidium", "isCorrect": false, "image": null}, {"id": "8kpkB", "label": "D", "text": "Caesium", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The alkali metals given in the options belong to Group 1 of the periodic table.<br><br>As we move down a group, the number of electron shells increases, which leads to an increase in atomic size.<br><br>The order of the given alkali metals from top to bottom in Group 1 is Sodium (Na), Potassium (K), Rubidium (Rb), and Caesium (Cs).<br><br>Therefore, the order of their atomic sizes is Na < K < Rb < Cs.<br><br>Among the given options, Sodium has the smallest atomic size.<br><br>Answer: Sodium", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29a8c30a4553e1bdad5", "type": "singleCorrect", "question": {"text": "Identify the elements of alkali metals and alkaline earth metals respectively having highest 1st ionization enthalpy.", "image": null}, "options": [{"id": "sZGCk", "label": "A", "text": "$\\text{K}$ and $\\text{Ca}$", "isCorrect": false, "image": null}, {"id": "SHOGX", "label": "B", "text": "$\\text{Li}$ and $\\text{Be}$", "isCorrect": true, "image": null}, {"id": "IKiAj", "label": "C", "text": "$\\text{Rb}$ and $\\text{Ba}$", "isCorrect": false, "image": null}, {"id": "MBmx8", "label": "D", "text": "$\\text{K}$ and $\\text{Sr}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Ionization enthalpy decreases down a group in the periodic table due to an increase in atomic size and shielding effect.<br><br>Among alkali metals (Group 1), Lithium ($\\text{Li}$) is at the top of the group and has the smallest atomic size, hence it has the highest first ionization enthalpy.<br><br>Among alkaline earth metals (Group 2), Beryllium ($\\text{Be}$) is at the top of the group and has the smallest atomic size, hence it has the highest first ionization enthalpy.<br><br>Therefore, the elements with the highest first ionization enthalpy are $\\text{Li}$ and $\\text{Be}$ respectively.<br><br>Answer: $\\text{Li}$ and $\\text{Be}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8abf9280d7f9932a32", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the element forming peroxide on reaction with oxygen.", "image": null}, "options": [{"id": "Hzmqt", "text": "C", "image": null, "isCorrect": false}, {"id": "eYj3w", "text": "Ar", "image": null, "isCorrect": false}, {"id": "h91Is", "text": "Na", "image": null, "isCorrect": true}, {"id": "034X8", "text": "He", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Sodium (Na) reacts with oxygen to form sodium peroxide ($Na_2O_2$).<br><br>$2Na + O_2 \\rightarrow Na_2O_2$<br><br>Carbon (C) forms oxides such as carbon monoxide ($CO$) and carbon dioxide ($CO_2$).<br><br>Argon (Ar) and Helium (He) are noble gases and do not react with oxygen.<br><br>Answer: Na", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6abf9280d7f9932903", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which of the following is not an alkali metal?", "image": null}, "options": [{"id": "FOVhL", "text": "Lithium", "image": null, "isCorrect": false}, {"id": "no03B", "text": "Potassium", "image": null, "isCorrect": false}, {"id": "yXw5Z", "text": "Beryllium", "image": null, "isCorrect": true}, {"id": "o6auP", "text": "Caesium", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Alkali metals belong to Group 1 of the periodic table. The elements in this group are Lithium (Li), Sodium (Na), Potassium (K), Rubidium (Rb), Caesium (Cs), and Francium (Fr).<br><br>Beryllium (Be) belongs to Group 2 of the periodic table and is classified as an alkaline earth metal.<br><br>Therefore, Beryllium is not an alkali metal.<br><br>Answer: Beryllium", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5bbf9280d7f9932886", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which from following elements form superoxide with air?", "image": null}, "options": [{"id": "Jj5yw", "text": "Li", "image": null, "isCorrect": false}, {"id": "eMYuJ", "text": "Na", "image": null, "isCorrect": false}, {"id": "faZAy", "text": "K", "image": null, "isCorrect": true}, {"id": "Q7kAi", "text": "Mg", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Alkali metals react with oxygen in the air to form different types of oxides depending on the size of the metal ion.<br><br>Lithium (Li) forms mainly the normal oxide, lithium oxide ($Li_2O$).<br><br>Sodium (Na) forms mainly the peroxide, sodium peroxide ($Na_2O_2$).<br><br>Potassium (K), rubidium (Rb), and cesium (Cs) form superoxides ($MO_2$) because the larger size of these metal ions stabilizes the larger superoxide ion ($O_2^-$).<br><br>Magnesium (Mg) forms the normal oxide, magnesium oxide ($MgO$).<br><br>Therefore, potassium (K) forms a superoxide ($KO_2$) when it reacts with air.<br><br>Answer: K", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b01bf9280d7f9932589", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "What are the products formed when $\\mathrm{Li}_2 \\mathrm{CO}_3$ undergoes decomposition?", "image": null}, "options": [{"id": "8iiSI", "text": "$\\mathrm{Li}_2 \\mathrm{O}+\\mathrm{CO}_2$", "image": null, "isCorrect": true}, {"id": "goWPp", "text": "$\\mathrm{LiO}+\\mathrm{CO}_2$", "image": null, "isCorrect": false}, {"id": "iwxir", "text": "$\\mathrm{LiC}+\\mathrm{CO}_2$", "image": null, "isCorrect": false}, {"id": "AMmPy", "text": "$\\mathrm{Li}_2 \\mathrm{O}_2+\\mathrm{CO}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Lithium carbonate decomposes on heating to form lithium oxide and carbon dioxide.<br><br>$\\mathrm{Li}_2 \\mathrm{CO}_3 \\xrightarrow{\\Delta} \\mathrm{Li}_2 \\mathrm{O} + \\mathrm{CO}_2$<br><br>This is due to the small size and high polarizing power of the $\\mathrm{Li}^+$ ion, which distorts the electron cloud of the large $\\mathrm{CO}_3^{2-}$ ion, leading to the formation of the more stable $\\mathrm{Li}_2 \\mathrm{O}$.<br><br>Answer: $\\mathrm{Li}_2 \\mathrm{O}+\\mathrm{CO}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213760aee93fa0796d8f6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "Which of the following colours is developed when alkali metal is dissolved in liquid ammonia?", "image": null}, "options": [{"id": "kSVeb", "text": "dark red", "image": null, "isCorrect": false}, {"id": "siICw", "text": "violet", "image": null, "isCorrect": false}, {"id": "Xoqym", "text": "deep blue", "image": null, "isCorrect": true}, {"id": "LTKyf", "text": "green", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Alkali metals dissolve in liquid ammonia to give deep blue solutions which are conducting in nature.<br><br>The reaction is given by:<br><br>$M + (x+y)NH_3 \\rightarrow [M(NH_3)_x]^+ + [e(NH_3)_y]^-$<br><br>The deep blue colour of the solution is due to the ammoniated electron which absorbs energy in the visible region of light and thus imparts blue colour to the solution.<br><br>Answer: deep blue", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262700279619d9d8a3487", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Which element from following exhibits common oxidation state +2 ?", "image": null}, "options": [{"id": "iFypK", "text": "$\\mathrm{Sr}$", "image": null, "isCorrect": true}, {"id": "tm6ft", "text": "$\\mathrm{Rb}$", "image": null, "isCorrect": false}, {"id": "brSE0", "text": "$\\mathrm{Na}$", "image": null, "isCorrect": false}, {"id": "bMq63", "text": "$\\mathbf{L i}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.11| Ch-8 | Subtopic-8.2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2620d0279619d9d8a316c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "Identify the element having general electronic configuration $\\mathrm{ns}^1$ from following.", "image": null}, "options": [{"id": "0hVot", "text": "$\\mathrm{Ca}$", "image": null, "isCorrect": false}, {"id": "HLsLw", "text": "$\\mathrm{Sr}$", "image": null, "isCorrect": false}, {"id": "m90ci", "text": "$\\mathrm{Ba}$", "image": null, "isCorrect": false}, {"id": "uahH0", "text": "$\\mathrm{Fr}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The general electronic configuration $\\mathrm{ns}^1$ is of group 1 elements. Among the given elements, francium $(\\mathrm{Fr})$ belongs to group 1 .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ff0279619d9d8a30f7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Which among the following halogens combines readily with metals to form metal halides with highest ionic character?", "image": null}, "options": [{"id": "syDAN", "text": "Chlorine", "image": null, "isCorrect": false}, {"id": "yOxQP", "text": "Bromine", "image": null, "isCorrect": false}, {"id": "mGBGP", "text": "Iodine", "image": null, "isCorrect": false}, {"id": "FveSA", "text": "Fluorine", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Ionic character of metal halides decreases in the order $\\mathrm{MF}>\\mathrm{MCl}>\\mathrm{MBr}>\\mathrm{MI}$, where, $\\mathrm{M}$ is a monovalent metal. Smaller the size of anion, greater is the ionic character (Fajan's rule). Therefore, fluorine forms metal halides with highest ionic character.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fa0279619d9d8a30d8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "If $\\mathrm{K}_{\\mathrm{b}}$ denote molal elevation constant of water, then boiling point of an aqueous solution containing $36 \\mathrm{~g}$ glucose (molar mass $=180$ ) per $\\mathrm{dm}^3$ is:", "image": null}, "options": [{"id": "ppeO0", "text": "MF", "image": null, "isCorrect": false}, {"id": "VVNHO", "text": "$\\mathrm{MCl}$", "image": null, "isCorrect": false}, {"id": "ZPxS4", "text": "$\\mathrm{MBr}$", "image": null, "isCorrect": false}, {"id": "T1pyU", "text": "MI", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Ionic character of metal halides decreases in the order $\\mathrm{MF}>\\mathrm{MCl}>\\mathrm{MBr}>\\mathrm{MI}$, where, $\\mathrm{M}$ is a monovalent metal. Smaller the size of anion, greater is the ionic character (Fajan's rule). Therefore, MI has the lowest ionic character.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261fa0279619d9d8a30d5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Which of the following is a property of alkali metals?", "image": null}, "options": [{"id": "5oWgG", "text": "High density", "image": null, "isCorrect": false}, {"id": "BIpOH", "text": "Compounds are paramagnetic", "image": null, "isCorrect": false}, {"id": "ys42e", "text": "Form dipositive ions only", "image": null, "isCorrect": false}, {"id": "mJkV1", "text": "Most electropositive elements", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Alkali metals are the most electropositive elements and have low density. Alkali metals can lose their one valence shell electron and form unipositive ions with no unpaired electrons. Hence, they form diamagnetic compounds.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261d80279619d9d8a2fc8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "Which among the following statements of group-1 elements is NOT true?", "image": null}, "options": [{"id": "glnxB", "text": "Unipositive ions have inert gas configuration.", "image": null, "isCorrect": false}, {"id": "LkWMA", "text": "Compounds of unipositive ions are paramagnetic.", "image": null, "isCorrect": true}, {"id": "5vrrq", "text": "These form colourless compounds in +1 state.", "image": null, "isCorrect": false}, {"id": "GKeFY", "text": "These have high negative values of standard reduction potential.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Std.11|Ch-8|Subtopic-8.2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c30279619d9d8a2f28", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "Identify the CORRECT decreasing order of melting point of cluster of sodium atoms depending on size.", "image": null}, "options": [{"id": "bzHmk", "text": "Cluster of $10^3$ atoms $>$ cluster of $10^4$ atoms $>$ Bulk sodium", "image": null, "isCorrect": false}, {"id": "AwNIv", "text": "Bulk sodium $>$ cluster of $10^4$ atoms $>$ Cluster of $10^3$ atoms", "image": null, "isCorrect": true}, {"id": "YacB1", "text": "Cluster of $10^4$ atoms $>$ Cluster of $10^3$ atoms $>$ Bulk sodium", "image": null, "isCorrect": false}, {"id": "PSRej", "text": "Bulk sodium $>$ cluster of $10^3$ atoms $>$ Cluster of $10^4$ atoms", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Sodium clusters $\\left(\\mathrm{Na}_{\\mathrm{n}}\\right)$ of 1000 atoms melts at $288 \\mathrm{~K}$ while cluster of 10,000 atoms melts at $303 \\mathrm{~K}$ and bulk sodium melts at $371 \\mathrm{~K}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ae0279619d9d8a2e7c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Which from following statements is NOT correct?", "image": null}, "options": [{"id": "ODBc1", "text": "All alkali metals are silvery white.", "image": null, "isCorrect": false}, {"id": "yS2Ek", "text": "Density of potassium is less than sodium.", "image": null, "isCorrect": false}, {"id": "KQIiX", "text": "Compounds of group- 1 elements are diamagnetic.", "image": null, "isCorrect": false}, {"id": "V0V4W", "text": "Melting point of group-1 elements increase down the group.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Melting point of group- 1 elements decreases down the group.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2619d0279619d9d8a2df6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Which among the following elements is used in devising photo electric cells?", "image": null}, "options": [{"id": "4rBeD", "text": "K", "image": null, "isCorrect": false}, {"id": "co3kL", "text": "Cs", "image": null, "isCorrect": true}, {"id": "0dVLz", "text": "Ba", "image": null, "isCorrect": false}, {"id": "JkmRP", "text": "Be", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Theory based", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2604d0279619d9d8a2365", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "Which among the following statement is NOT true?", "image": null}, "options": [{"id": "lhsaC", "text": "Compounds of unipositive ions of alkali metals are paramagnetic.", "image": null, "isCorrect": true}, {"id": "W1iUe", "text": "Alkali metals have low density.", "image": null, "isCorrect": false}, {"id": "3fBlG", "text": "All alkali metals are silvery white and soft.", "image": null, "isCorrect": false}, {"id": "frIHH", "text": "Alkali metals are most electropositive elements.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Alkali metals are soft and can be cut by knife.\nAlkali metals have low density-Lithium, sodium and potassium float on water.\nThey have low ionization energies and their atoms readily lose the valence electron hence they are most electropositive elements.\nAlkali metal salts are diamagnetic.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2603e0279619d9d8a22ea", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "How many water molecules are present in formula of crystalline chloride of lithium?", "image": null}, "options": [{"id": "byPBa", "text": "4", "image": null, "isCorrect": false}, {"id": "cdlqV", "text": "3", "image": null, "isCorrect": false}, {"id": "flPcS", "text": "1", "image": null, "isCorrect": false}, {"id": "lFHzZ", "text": "2", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\text { Formula of Crystalline chloride of lithium } \\Rightarrow \\mathrm{LiCl} .2 \\mathrm{H}_2 \\mathrm{O}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260150279619d9d8a219b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "Which of the following compound is used as fire extinguisher?", "image": null}, "options": [{"id": "0QaqC", "text": "$\\mathrm{NaHCO}_{3}$", "image": null, "isCorrect": true}, {"id": "xzwxw", "text": "$\\mathrm{Na}_{2} \\mathrm{CO}_{3}$", "image": null, "isCorrect": false}, {"id": "zkroO", "text": "$\\mathrm{NaOH}$", "image": null, "isCorrect": false}, {"id": "eculm", "text": "$\\mathrm{Na}_{2} \\mathrm{SO}_{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When the fire extinguisher is operated by pressing the knob on it, the sulphuric acid gets mixed with sodium bicarbonate solution producing a lot of carbon dioxide gas. Carbon dioxide gas is neither combustible nor helps combustion. Hence, sodium bicarbonate is used in fire extinguishers", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fcc0279619d9d8a1f54", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "Which of the following formula represents lithium imide?", "image": null}, "options": [{"id": "heqQh", "text": "$\\mathrm{L} \\mathrm{i}_{3} \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "GWhgg", "text": "$\\mathrm{LiNH}_{2}$", "image": null, "isCorrect": false}, {"id": "110U5", "text": "$\\mathrm{Li}_{2} \\mathrm{NH}$", "image": null, "isCorrect": true}, {"id": "OjLOP", "text": "LiNH", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathbf{L i}_{2} \\mathrm{NH}$\nThe inorganic compound lithium imide has the chemical formula NH. A reaction between lithium amide and lithium hydride can produce this whitish substance.\n$\\mathrm{LiH}_{2}+\\mathrm{LiH} \\longrightarrow \\mathrm{Li}_{2} \\mathrm{NH}+\\mathrm{H}_{2}$\nLithium Imlde\nThe product is sensitive to light and can be disproportionated to generate lithium nitride.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f900279619d9d8a1d81", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "Which among the following is used as a source of oxygen in submarine in emergency breathing apparatus?", "image": null}, "options": [{"id": "88FWJ", "text": "potassium superoxide", "image": null, "isCorrect": true}, {"id": "sG0v9", "text": "sodium peroxide", "image": null, "isCorrect": false}, {"id": "HByjf", "text": "rubidium superoxide", "image": null, "isCorrect": false}, {"id": "gv07T", "text": "lithium monoxide", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Potassium superoxide $\\left(\\mathrm{KO}_{2}\\right)$ is used as a source of oxygen in submarines in emergency breathing apparatus because it has ability to absorb carbon dioxide and give out oxygen at the same time.\n$4 \\mathrm{KO}_{2}+2 \\mathrm{CO}_{2} \\longrightarrow 2 \\mathrm{~K}_{2} \\mathrm{CO}_{3}+3 \\mathrm{O}_{2} \\uparrow$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ec40279619d9d8a171a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}], "question": {"text": "Solubility of which among the following solids in water changes slightly with temperature?", "image": null}, "options": [{"id": "bJtkN", "text": "<math><mi>K</mi><mi>N</mi><msub><mrow><mi>O</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "pibvQ", "text": "<math><mi>N</mi><mi>a</mi><mi>N</mi><msub><mrow><mi>O</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "vMmsR", "text": "<math><mi>K</mi><mi>B</mi><mi>r</mi></math>", "image": null, "isCorrect": false}, {"id": "OfszG", "text": "<math><mi>N</mi><mi>a</mi><mi>B</mi><mi>r</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Solubility of <math><mi>N</mi><mi>a</mi><mi>B</mi><mi>r</mi></math> in water changes slightly with temperature. Because <math><mi>N</mi><mi>a</mi><mi>B</mi><mi>r</mi></math> bond is weaker.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ec20279619d9d8a170d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}], "question": {"text": "Identify the weakest oxidizing agent among the following.", "image": null}, "options": [{"id": "Eazy8", "text": "<math><msubsup><mrow><mi>Li</mi></mrow><mrow><mn></mn></mrow><mrow><mo>+</mo></mrow></msubsup></math>", "image": null, "isCorrect": true}, {"id": "SpyQF", "text": "<math><mi>N</mi><msup><mrow><mi>a</mi></mrow><mrow><mo>+</mo></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "gDikY", "text": "<math><mi>C</mi><msup><mrow><mi>d</mi></mrow><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "m8La9", "text": "<math><msub><mrow><mi>I</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "It has smallest ionic size and higher hydration energy. Therefore has higher reduction&nbsp;potential. So it is a weaker oxidising agent.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eb20279619d9d8a168b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "Which halide of magnesium has the&nbsp;highest ionic character?", "image": null}, "options": [{"id": "ilbvA", "text": "Chloride", "image": null, "isCorrect": false}, {"id": "PqWNV", "text": "Bromide", "image": null, "isCorrect": false}, {"id": "uxcYM", "text": "Iodide", "image": null, "isCorrect": false}, {"id": "EDtIE", "text": "Fluoride", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Size of anion is <math> <mrow> <msup> <mtext>I</mtext> <mo>−</mo> </msup> <mo>&gt;</mo><mtext>B</mtext><msup> <mtext>r</mtext> <mo>−</mo> </msup> <mo>&gt;</mo><mtext>C</mtext><msup> <mtext>l</mtext> <mo>−</mo> </msup> <mo>&gt;</mo><msup> <mtext>F</mtext> <mo>−</mo>&nbsp; </msup></mrow></math>. As the size increases, polarisation of an anion is more, hence when covalent character increases ionic character decreases.<br />Order of ionic character is <math> <mrow> <mtext>M</mtext><mtext>g</mtext><msub> <mtext>F</mtext> <mn>2</mn> </msub> <mo>&gt;</mo><mtext>M</mtext><mtext>g</mtext><mtext>C</mtext><msub> <mtext>l</mtext> <mn>2</mn> </msub> <mo>&gt;</mo><mtext>M</mtext><mtext>g</mtext><mtext>B</mtext><msub> <mtext>r</mtext> <mn>2</mn> </msub> <mo>&gt;</mo><mtext>M</mtext><mtext>g</mtext><msub> <mtext>I</mtext> <mn>2</mn> </msub> </mrow> </math><br />Hence Magnesium fluoride has the highest ionic character.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263470279619d9d8a3dc2", "title": "Compounds of Alkali Metals", "totalQuestions": 11, "questions": [{"_id": "6a44d2a88c30a4553e1bdb6b", "type": "singleCorrect", "question": {"text": "Choose a false statement regarding the properties of sodium hydroxide.", "image": null}, "options": [{"id": "mP1w4", "label": "A", "text": "It is highly water soluble.", "isCorrect": false, "image": null}, {"id": "f7dg8", "label": "B", "text": "It absorbs atmospheric $\\text{CO}_2$ to form $\\text{Na}_2\\text{CO}_3$.", "isCorrect": false, "image": null}, {"id": "NGC5g", "label": "C", "text": "the solution of NaOH turns blue litmus red.", "isCorrect": true, "image": null}, {"id": "Wa1ff", "label": "D", "text": "NaOH is a white deliquescent solid.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Sodium hydroxide ($\\text{NaOH}$) is a strong base. Basic solutions turn red litmus paper blue. Therefore, the statement that the solution of $\\text{NaOH}$ turns blue litmus red is false.<br><br>The other statements are true:<br>$\\text{NaOH}$ is highly soluble in water.<br>It reacts with atmospheric $\\text{CO}_2$ to form sodium carbonate ($\\text{Na}_2\\text{CO}_3$).<br>It is a white, deliquescent solid that readily absorbs moisture from the air.<br><br>Answer: the solution of NaOH turns blue litmus red.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214110aee93fa0796ddb7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Which from following compounds is obtained as by product in synthesis of sodium carbonate by Solvay process?", "image": null}, "options": [{"id": "WbajG", "text": "Ammonium carbonate", "image": null, "isCorrect": false}, {"id": "fPtjl", "text": "Sodium bicarbonate", "image": null, "isCorrect": false}, {"id": "6PUzY", "text": "Calcium Chloride", "image": null, "isCorrect": true}, {"id": "vSbMO", "text": "Ammonium Chloride.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The Solvay process is used for the industrial preparation of sodium carbonate. The overall reaction for the process can be represented as:<br><br>$2NaCl + CaCO_3 \\rightarrow Na_2CO_3 + CaCl_2$<br><br>During the process, sodium bicarbonate precipitates out and ammonium chloride is formed in the solution:<br><br>$NH_3 + H_2O + CO_2 + NaCl \\rightarrow NaHCO_3 + NH_4Cl$<br><br>Ammonia is recovered for reuse by treating the ammonium chloride solution with calcium hydroxide:<br><br>$2NH_4Cl + Ca(OH)_2 \\rightarrow 2NH_3 + CaCl_2 + 2H_2O$<br><br>In this recovery step, calcium chloride is formed. Since it is not reused in the process, it is obtained as the final byproduct.<br><br>Answer: Calcium Chloride", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261530279619d9d8a2ba1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "Which among the following is used in the breathing equipment for mountaineers?", "image": null}, "options": [{"id": "VWwaK", "text": "$\\mathrm{Na}_2 \\mathrm{O}_2$", "image": null, "isCorrect": false}, {"id": "EGRDS", "text": "$\\mathrm{KO}_2$", "image": null, "isCorrect": true}, {"id": "XSDEf", "text": "$\\mathrm{CaO}$", "image": null, "isCorrect": false}, {"id": "THhhq", "text": "$\\mathrm{Li}_2 \\mathrm{O}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{KO}_2+\\mathrm{CO}_2 \\Rightarrow \\mathrm{K}_2 \\mathrm{CO}_3+\\mathrm{O}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fbc0279619d9d8a1ed5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "Which of the following is NOT present in baking powder?", "image": null}, "options": [{"id": "F1G0E", "text": "Sodium carbonate", "image": null, "isCorrect": true}, {"id": "xE6ey", "text": "Sodium hydrogen carbonate", "image": null, "isCorrect": false}, {"id": "67sA7", "text": "Potassium hydrogen tartrate", "image": null, "isCorrect": false}, {"id": "y78NV", "text": "Starch", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(C)\n$\\mathrm{Na}_{2} \\mathrm{CO}_{3}$ is present in washing soda.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f480279619d9d8a1b39", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "Which among the following alkali metal chloride crystallises in form of hydrate?", "image": null}, "options": [{"id": "gV4ek", "text": "$\\mathrm{LiCl}$", "image": null, "isCorrect": true}, {"id": "zM6YB", "text": "KCl", "image": null, "isCorrect": false}, {"id": "YnCiy", "text": "$\\mathrm{CsCl}$", "image": null, "isCorrect": false}, {"id": "oFZpT", "text": "NaCl", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Lithium is smallest in size among the alkali metals. Hence $\\mathrm{Li}^{+}$ion can polarize water molecules more easily than other alkali metals. As the size of the ions increases, their polarizing power decreases. Hence, other alkali metal ions usually form anhydrous salts.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f360279619d9d8a1aaa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "What is the formula of lithium imide?", "image": null}, "options": [{"id": "ZfZdh", "text": "$\\mathrm{LiNO}_{3}$", "image": null, "isCorrect": false}, {"id": "WHsr2", "text": "$\\mathrm{Li}_{2} \\mathrm{NH}$", "image": null, "isCorrect": true}, {"id": "vWga2", "text": "$\\mathrm{Li}_{3} \\mathrm{~N}$", "image": null, "isCorrect": false}, {"id": "XsMY1", "text": "$\\mathrm{LiNH}_{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Lithium imide is an inorganic compound with the chemical formula Li 2NH. This white solid can be formed by a reaction between lithium amide and lithium hydride. LiNH2 + LiH ? Li2NH + H2 The product is light-sensitive and can undergo disproportionation to form lithium nitride, which is characteristically red.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f210279619d9d8a1a03", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "Which among the following gas is bubbled through the brine solution during the preparation of sodium carbonate in Solvay's process?", "image": null}, "options": [{"id": "DhwNw", "text": "$\\mathrm{CO}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "42kDX", "text": "$\\mathrm{N}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}, {"id": "ebj6E", "text": "$\\mathrm{NO}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": true}, {"id": "NjWkG", "text": "$\\mathrm{O}_{2(\\mathrm{~g})}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No solution", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eeb0279619d9d8a1852", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "Which among the following sets of compounds is used as raw material for the preparation of sodium carbonate by Solvay process?", "image": null}, "options": [{"id": "XJIVK", "text": "<math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "TulVL", "text": "<math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>4</mn></mrow></msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi></math>", "image": null, "isCorrect": false}, {"id": "02ytg", "text": "<math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "GPmxF", "text": "<math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>,</mo><mi mathvariant=\"normal\"></mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Solvay’s process of manufacturing of sodium carbonate: <br/><math><mn>2</mn><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi><mo>+</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>+</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mo>→</mo><mn>2</mn><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>+</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mn>2</mn></mrow></msub></math>  <br/><math><mn>2</mn><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub><mover accent=\"false\"><mo>→</mo><mrow><mi mathvariant=\"normal\">Δ</mi></mrow></mover><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25eb10279619d9d8a167f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}], "question": {"text": "The element that does <u><b>NOT</b></u> form acidic oxide is", "image": null}, "options": [{"id": "V2zCj", "text": "Carbon", "image": null, "isCorrect": false}, {"id": "Ayw6U", "text": "Phosphorus", "image": null, "isCorrect": false}, {"id": "dGQ3I", "text": "Chlorine", "image": null, "isCorrect": false}, {"id": "vds0h", "text": "Barium", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Barium is an alkali&nbsp;metal so it forms basic oxide while others are non-metal and generally their oxides are acidic in nature", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e8c0279619d9d8a1556", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "When Zn is treated with excess of $\\mathrm{NaOH}$, the product obtained is", "image": null}, "options": [{"id": "xYwG7", "text": "$\\mathrm{Zn}(\\mathrm{OH})_{2}$", "image": null, "isCorrect": false}, {"id": "Gu9ct", "text": "$\\mathrm{ZnOH}$", "image": null, "isCorrect": false}, {"id": "uzxgE", "text": "$\\mathrm{Na}_{2} \\mathrm{ZnO}_{2}$", "image": null, "isCorrect": true}, {"id": "vYLJU", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When $\\mathrm{Zn}$ is reacted with excess of $\\mathrm{NaOH}$, sodium zincate is obtained.\n$$\n\\mathrm{Zn}+2 \\mathrm{NaOH}+2 \\mathrm{H}_{2} \\mathrm{O} \\longrightarrow \\mathrm{Na}_{2}\\left[\\mathrm{Zn}(\\mathrm{OH})_{4}\\right]+\\mathrm{H}_{2}\n$$\nsoluble\nOr\n$$\n\\mathrm{Zn}+2 \\mathrm{NaOH} \\longrightarrow \\mathrm{Na}_{2} \\mathrm{ZnO}_{2}+\\mathrm{H}_{2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7a0279619d9d8a14c2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "Reaction for the formation of $\\mathrm{NaCl}$ is", "image": null}, "options": [{"id": "Szbu9", "text": "$\\mathrm{Na}(g)+\\mathrm{Cl}_{2}(g) \\longrightarrow \\mathrm{NaCl}(s)$", "image": null, "isCorrect": false}, {"id": "cHGLQ", "text": "$\\mathrm{Na}(s)+\\frac{1}{2} \\mathrm{Cl}_{2}(g) \\longrightarrow \\operatorname{NaCl}(s)$", "image": null, "isCorrect": true}, {"id": "t1YDL", "text": "$\\mathrm{Na}(g)+\\frac{1}{2} \\mathrm{Cl}_{2}(g) \\longrightarrow \\mathrm{NaCl}(s)$", "image": null, "isCorrect": false}, {"id": "PSAaj", "text": "$\\mathrm{Na}(g)+\\mathrm{Cl}_{2}(g) \\longrightarrow \\mathrm{NaCl}(g)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The correct reaction for the formation of $\\mathrm{NaCl}$ is\n$$\n\\mathrm{Na}(s)+\\frac{1}{2} \\mathrm{Cl}_{2}(g) \\longrightarrow \\mathrm{NaCl}(s)\n$$\n(As the compounds are formed from their elements when they are present in their most stable form.)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263470279619d9d8a3dc3", "title": "Alkaline Earth Metals", "totalQuestions": 19, "questions": [{"_id": "6abb887f15a9fc0fc8c14447", "type": "singleCorrect", "question": {"text": "Which of the following elements does not form its hydroxide and Dihydrogen with water?", "image": null}, "options": [{"id": "vgeJq", "label": "A", "text": "Barium", "isCorrect": false, "image": null}, {"id": "FikH7", "label": "B", "text": "Calcium", "isCorrect": false, "image": null}, {"id": "YnZD0", "label": "C", "text": "Magnesium", "isCorrect": false, "image": null}, {"id": "grC6j", "label": "D", "text": "Beryllium", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Beryllium does not react with water or steam even at high temperatures due to its high ionization enthalpy and small size.<br><br>Other alkaline earth metals like Magnesium, Calcium, Strontium, and Barium react with water to form their respective hydroxides and liberate dihydrogen gas. Magnesium reacts with hot water, while Calcium, Strontium, and Barium react with cold water.<br><br>Therefore, Beryllium is the element that does not form its hydroxide and dihydrogen with water.<br><br>Answer: Beryllium", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88bf15a9fc0fc8c1469f", "type": "singleCorrect", "question": {"text": "Which of the following elements is used as a moderator in nuclear reactors ?", "image": null}, "options": [{"id": "uKFSr", "label": "A", "text": "Mg", "isCorrect": false, "image": null}, {"id": "C0k8F", "label": "B", "text": "Be", "isCorrect": true, "image": null}, {"id": "6HlAK", "label": "C", "text": "Ba", "isCorrect": false, "image": null}, {"id": "81EzP", "label": "D", "text": "Sr", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "A moderator in a nuclear reactor is a substance that slows down fast neutrons to thermal energies, making them more likely to cause fission in uranium-235. Good moderators must have low atomic mass and a low tendency to absorb neutrons.<br><br>Commonly used moderators include ordinary water, heavy water, graphite, and beryllium (Be). Beryllium is highly effective as a moderator and reflector due to its low neutron absorption cross-section and high scattering cross-section.<br><br>Therefore, among the given options, Beryllium (Be) is used as a moderator in nuclear reactors.<br><br>Answer: Be", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d35f8c30a4553e1be309", "type": "singleCorrect", "question": {"text": "Which alkaline earth metal carbonate decomposes most easily?", "image": null}, "options": [{"id": "MbLaY", "label": "A", "text": "$\\text{MgCO}_3$", "isCorrect": true, "image": null}, {"id": "geSpk", "label": "B", "text": "$\\text{CaCO}_3$", "isCorrect": false, "image": null}, {"id": "ff7Db", "label": "C", "text": "$\\text{SrCO}_3$", "isCorrect": false, "image": null}, {"id": "0lwIy", "label": "D", "text": "$\\text{BaCO}_3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The thermal stability of alkaline earth metal carbonates increases down the group from $Be$ to $Ba$.<br><br>This is because as the size of the cation increases, its polarizing power decreases. A smaller cation like $Mg^{2+}$ polarizes the large carbonate ion ($CO_3^{2-}$) more effectively, weakening the $C-O$ bond and facilitating its decomposition into the metal oxide and $CO_2$.<br><br>The order of thermal stability is $MgCO_3 < CaCO_3 < SrCO_3 < BaCO_3$.<br><br>Therefore, $MgCO_3$ has the lowest thermal stability among the given options and decomposes most easily.<br><br>Answer: $\\text{MgCO}_3$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbdbf9280d7f9932c00", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Which colour is developed to the solution when alkaline earth metals are dissolved in liquid ammonia ?", "image": null}, "options": [{"id": "6Zh3a", "text": "Crimson red", "image": null, "isCorrect": false}, {"id": "GjWun", "text": "Deep blue black", "image": null, "isCorrect": true}, {"id": "4wKyB", "text": "Orange", "image": null, "isCorrect": false}, {"id": "KHB1w", "text": "Faint green", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Alkaline earth metals dissolve in liquid ammonia to form ammoniated cations and ammoniated electrons. The reaction is given by:<br><br>$M + (x+y)NH_3 \\rightarrow [M(NH_3)_x]^{2+} + 2[e(NH_3)_y]^-$<br><br>The presence of ammoniated electrons imparts a deep blue black colour to the solution.<br><br>Answer: Deep blue black", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4bbf9280d7f99327f4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Identify the product when magnesium burns in air.", "image": null}, "options": [{"id": "mFmgg", "text": "MgO only", "image": null, "isCorrect": false}, {"id": "E1gf4", "text": "$\\mathrm{Mg}_3 \\mathrm{~N}_2$ only", "image": null, "isCorrect": false}, {"id": "5f1lW", "text": "$\\mathrm{Mg}_2 \\mathrm{NO}_3$", "image": null, "isCorrect": false}, {"id": "OB8ED", "text": "MgO and $\\mathrm{Mg}_3 \\mathrm{~N}_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Air is a mixture containing mainly nitrogen and oxygen.<br><br>When magnesium burns in air, it reacts with both oxygen and nitrogen to form magnesium oxide and magnesium nitride, respectively.<br><br>The chemical reactions are:<br>$2\\mathrm{Mg} + \\mathrm{O}_2 \\rightarrow 2\\mathrm{MgO}$<br>$3\\mathrm{Mg} + \\mathrm{N}_2 \\rightarrow \\mathrm{Mg}_3\\mathrm{N}_2$<br><br>Therefore, the products formed are $\\mathrm{MgO}$ and $\\mathrm{Mg}_3\\mathrm{N}_2$.<br><br>Answer: MgO and $\\mathrm{Mg}_3 \\mathrm{~N}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214480aee93fa0796df69", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "What products are obtained when beryllium oxide is treated separately with aq. HCl and aq. NaOH solutions respectively?", "image": null}, "options": [{"id": "gWCXI", "text": "$\\mathrm{BeCl}_2$ and $\\mathrm{Be}(\\mathrm{OH})_2$", "image": null, "isCorrect": false}, {"id": "HD9VP", "text": "$\\mathrm{BeCl}_2$ and $\\mathrm{Na}_2 \\mathrm{BeO}_4$", "image": null, "isCorrect": false}, {"id": "IJOAl", "text": "$\\mathrm{Be}(\\mathrm{OH})_2$ and $\\mathrm{BeCl}_2$", "image": null, "isCorrect": false}, {"id": "aNgcv", "text": "$\\mathrm{BeCl}_2$ and $\\mathrm{Na}_2 \\mathrm{BeO}_2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Beryllium oxide ($\\mathrm{BeO}$) is an amphoteric oxide, meaning it reacts with both acids and bases.<br><br>Reaction with aqueous $\\mathrm{HCl}$ (acid):<br>$\\mathrm{BeO} + 2\\mathrm{HCl} \\rightarrow \\mathrm{BeCl}_2 + \\mathrm{H}_2\\mathrm{O}$<br>The product is beryllium chloride ($\\mathrm{BeCl}_2$).<br><br>Reaction with aqueous $\\mathrm{NaOH}$ (base):<br>$\\mathrm{BeO} + 2\\mathrm{NaOH} \\rightarrow \\mathrm{Na}_2\\mathrm{BeO}_2 + \\mathrm{H}_2\\mathrm{O}$<br>The product is sodium beryllate ($\\mathrm{Na}_2\\mathrm{BeO}_2$).<br><br>Thus, the products obtained are $\\mathrm{BeCl}_2$ and $\\mathrm{Na}_2\\mathrm{BeO}_2$.<br><br>Answer: $\\mathrm{BeCl}_2$ and $\\mathrm{Na}_2 \\mathrm{BeO}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214360aee93fa0796deda", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Which of the following elements belongs to second group and fifth period of periodic table?", "image": null}, "options": [{"id": "eC7nH", "text": "Rubidium", "image": null, "isCorrect": false}, {"id": "45c7W", "text": "Strontium", "image": null, "isCorrect": true}, {"id": "UKB7a", "text": "Caesium", "image": null, "isCorrect": false}, {"id": "PlrLv", "text": "Barium", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The elements of Group 2 (alkaline earth metals) are Beryllium (Period 2), Magnesium (Period 3), Calcium (Period 4), Strontium (Period 5), Barium (Period 6), and Radium (Period 7).<br><br>Rubidium is in Group 1, Period 5.<br>Strontium is in Group 2, Period 5.<br>Caesium is in Group 1, Period 6.<br>Barium is in Group 2, Period 6.<br><br>Therefore, Strontium belongs to the second group and fifth period of the periodic table.<br><br>Answer: Strontium", "image": null}, "videoSolution": null, "syllab
