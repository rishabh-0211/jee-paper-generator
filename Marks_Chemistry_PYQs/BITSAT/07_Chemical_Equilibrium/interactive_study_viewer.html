eftharpoons \\mathrm{CO}_{2}(g)$ is:", "image": null}, "options": [{"id": "QB6kl", "text": "$\\frac{1}{\\sqrt{R T}}$", "isCorrect": true, "image": null}, {"id": "BgsdK", "text": "$(R T)^{1 / 2}$", "isCorrect": false, "image": null}, {"id": "mSUvN", "text": "$\\mathrm{RT}$", "isCorrect": false, "image": null}, {"id": "wVn09", "text": "1", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$K_{P}=K_{C}(R T)^{\\Delta n_{\\text {g }}}$\r\n\r\nFor the reaction\r\n\r\n$\\mathrm{CO}(\\mathrm{g})+\\frac{1}{2} \\mathrm{O}_{2}(g) \\leftrightharpoons \\mathrm{CO}_{2}(\\mathrm{~g})$\r\n\r\n$\\Delta n_{g}=1-\\left(1+\\frac{1}{2}\\right)=-\\frac{1}{2}$\r\n\r\n$\\therefore \\quad \\mathrm{K}_{\\mathrm{P}}=\\frac{\\mathrm{K}_{\\mathrm{C}}}{\\sqrt{\\mathrm{RT}}} ; \\quad \\frac{\\mathrm{K}_{\\mathrm{P}}}{\\mathrm{K}_{\\mathrm{C}}}=\\frac{1}{\\sqrt{\\mathrm{RT}}}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8096f5bfc7ab78aea07", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 2, "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> moles of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> are mixed with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> moles of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>. At equilibrium for the reaction <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> 160;</mo><mo>&#160;</mo><mo>&#8652;</mo><mo>&#160;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">D</mi><mspace linebreak=\"newline\"></mspace><mi>initial</mi><mo>&#160;</mo><mi>conc</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mn>4</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mn>4</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mn>0</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mn>0</mn><mspace linebreak=\"newline\"></mspace><mi>at</mi><mo>&#160;</mo><mi>equilibrium</mi><mo>&#160;</mo><mfenced><mrow><mn>4</mn><mo>-</mo><mn>2</mn></mrow></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mfenced><mrow><mn>4</mn><mo>-</mo><mn>2</mn></mrow></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mn>2</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mn>2</mn></math></p><p>The expression for the equilibrium constant is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mo>[</mo><mi mathvariant=\"normal\">C</mi><mo>]</mo><mo>[</mo><mi mathvariant=\"normal\">D</mi><mo>]</mo><mo>&#8203;</mo></mrow><mrow><mo>[</mo><mi mathvariant=\"normal\">A</mi><mo>]</mo><mo>[</mo><mi mathvariant=\"normal\">B</mi><mo>]</mo></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">K</mi><mfenced><mi>eq</mi></mfenced></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>2</mn></mrow><mrow><mn>2</mn><mo>&#215;</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7de6f5bfc7ab78ae88b", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "In a closed system, $\\mathrm{A}(\\mathrm{s}) \\rightleftharpoons 2 \\mathrm{~B}(\\mathrm{~g})+3 \\mathrm{C}(\\mathrm{g})$, if partial\r\n\r\npressure of $\\mathrm{C}$ is doubled, then partial pressure of $\\mathrm{B}$ will be", "image": null}, "options": [{"id": "iqMfB", "text": "$2 \\sqrt{2}$ times the original value", "isCorrect": false, "image": null}, {"id": "Vj1ia", "text": "$\\frac{1}{2}$ times the original value", "isCorrect": false, "image": null}, {"id": "z3vqr", "text": "2 times the original value", "isCorrect": false, "image": null}, {"id": "PBFNP", "text": "$\\frac{1}{2 \\sqrt{2}}$ times the original value", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "$\\quad K_{p}=p_{B_{1}}^{2} \\times p_{C_{1}}^{3}$\r\n\r\nAgain, $K_{p}=p_{B_{2}}^{2} \\times\\left(2 p_{C_{1}}\\right)^{3}$\r\n\r\n$\\therefore \\mathrm{p}_{\\mathrm{B}_{1}}^{2} \\times \\mathrm{p}_{\\mathrm{C}_{1}}^{3}=\\mathrm{P}_{\\mathrm{B}_{2}}^{2} \\times 8 \\mathrm{p}_{\\mathrm{C}_{1}}^{3}$\r\n\r\n$$\r\n\r\n\\therefore \\frac{\\mathrm{p}_{\\mathrm{B}_{1}}^{2}}{8}=\\mathrm{p}_{\\mathrm{B}_{2}}^{2} \\text { or, } \\frac{\\mathrm{p}_{\\mathrm{B}_{1}}}{2 \\sqrt{2}}=\\mathrm{p}_{\\mathrm{B}_{2}}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7de6f5bfc7ab78ae88a", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 1, "question": {"text": "The degree of dissociation of $\\mathrm{PCl}_{5}(\\alpha)$ obeying\r\n\r\nthe equilibrium $\\mathrm{PCl}_{5} \\rightleftharpoons \\mathrm{PCl}_{3}+\\mathrm{Cl}_{2}$ is related to the equilibrium pressure by", "image": null}, "options": [{"id": "EE0Hw", "text": "$\\alpha \\propto \\frac{1}{\\mathrm{P}^{4}}$", "isCorrect": false, "image": null}, {"id": "jYCkg", "text": "$\\alpha \\propto \\frac{1}{\\sqrt{\\mathrm{P}}}$", "isCorrect": true, "image": null}, {"id": "Tm3VA", "text": "$\\alpha \\propto \\frac{1}{\\mathrm{P}^{2}}$", "isCorrect": false, "image": null}, {"id": "xlpmJ", "text": "$\\alpha \\propto \\mathrm{P}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/CH0qTfl1P3Qd2qDlQOHZysyowccoOImkNqBE-GV84UA.original.fullsize.png\"><br>\r\n\r\n$\\therefore \\mathrm{K}_{\\mathrm{p}}=\\frac{\\frac{\\alpha}{1+\\alpha} \\mathrm{P} \\times \\frac{\\alpha}{1+\\alpha} \\mathrm{P}}{\\frac{1-\\alpha}{1+\\alpha} \\mathrm{P}}=\\frac{\\alpha^{2} \\mathrm{P}}{1-\\alpha^{2}}$\r\n\r\nor, $\\mathrm{K}_{\\mathrm{p}}=\\alpha^{2} \\mathrm{P}$\r\n\r\n$\\therefore \\alpha=\\sqrt{\\frac{\\mathrm{K}_{\\mathrm{p}}}{\\mathrm{P}}}$ when $1-\\alpha^{2}=1$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b06f5bfc7ab78ae703", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 1, "question": {"text": "For the reaction $\\mathrm{CO}(\\mathrm{g})+(1 / 2) \\mathrm{O}_{2}(\\mathrm{~g}) \\longrightarrow \\mathrm{CO}_{2}(\\mathrm{~g}), \\mathrm{K}_{\\mathrm{p}} / \\mathrm{K}_{\\mathrm{c}}$ is", "image": null}, "options": [{"id": "WZsg0", "text": "$\\mathrm{RT}$", "isCorrect": false, "image": null}, {"id": "4UoVa", "text": "$(\\mathrm{RT})^{-1}$", "isCorrect": false, "image": null}, {"id": "pQsfp", "text": "$(\\mathrm{RT})^{-1 / 2}$", "isCorrect": true, "image": null}, {"id": "hgyzU", "text": "$(\\mathrm{RT})^{1 / 2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\mathrm{K}_{\\mathrm{p}}=\\mathrm{K}_{\\mathrm{c}}(\\mathrm{RT})^{\\Delta n},$\r\n\r\n$\\Delta \\mathrm{n}=1-\\left(1+\\frac{1}{2}\\right)=1-\\frac{3}{2}=-\\frac{1}{2}$\r\n\r\n$\\therefore \\frac{\\mathrm{K}_{\\mathrm{p}}}{\\mathrm{K}_{\\mathrm{c}}}=(\\mathrm{RT})^{-1 / 2}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b06f5bfc7ab78ae702", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "If 1.0 mole of $I_{2}$ is introduced into 1.0 litre flask at $1000 \\mathrm{~K},$ at equilibrium $\\left(\\mathrm{K}_{\\mathrm{c}}=10^{-6}\\right),$ which one is correct?", "image": null}, "options": [{"id": "ueTCp", "text": "$\\left[\\mathrm{I}_{2}(\\mathrm{~g})\\right]>\\left[\\mathrm{I}^{-}(\\mathrm{g})\\right]$", "isCorrect": false, "image": null}, {"id": "49TnR", "text": "$\\left[\\mathrm{I}_{2}(\\mathrm{~g})\\right]<\\left[\\mathrm{I}^{-}(\\mathrm{g})\\right]$", "isCorrect": true, "image": null}, {"id": "Sb4mD", "text": "$\\left[\\mathrm{I}_{2}(\\mathrm{~g})\\right]=\\left[\\mathrm{I}^{-}(\\mathrm{g})\\right]$", "isCorrect": false, "image": null}, {"id": "zQd9c", "text": "$\\left[\\mathrm{I}_{2}(\\mathrm{~g})\\right]=\\frac{1}{2}\\left[\\mathrm{I}^{-}(\\mathrm{g})\\right]$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/JUMljcBOs8oao9k61hYcukGCiES4JNR-uo4gF1JVF6w.original.fullsize.png\"><br>\r\n\r\n$K_{C}=\\frac{(2 x)^{2}}{(1-x)}=10^{-6}$\r\n\r\nIt shows that $(1-x)<2 x$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a06f5bfc7ab78ae685", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "The reaction, $\\mathrm{SO}_{2}+\\mathrm{Cl}_{2} \\longrightarrow \\mathrm{SO}_{2} \\mathrm{Cl}_{2}$ is\r\nexothermic and reversible. A mixture of $\\mathrm{SO}_{2}(\\mathrm{~g})$, $\\mathrm{Cl}_{2}(\\mathrm{~g})$ and $\\mathrm{SO}_{2} \\mathrm{Cl}_{2}(\\mathrm{l})$ is at equilibrium in a closed container. Now a certain quantity of extra $\\mathrm{SO}_{2}$ is introduced into the container, the volume remaining the same. Which of the following is/are true?", "image": null}, "options": [{"id": "a2JN2", "text": "The pressure inside the container will not change.", "isCorrect": false, "image": null}, {"id": "230Cf", "text": "The temperature will not change.", "isCorrect": false, "image": null}, {"id": "ohHJu", "text": "The temperature will increase.", "isCorrect": true, "image": null}, {"id": "94azk", "text": "The temperature will decrease.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Byaddition of $\\mathrm{SO}_{2}$, equilibrium will shift to RHS which is exothermic. Hence temp, will increase.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7766f5bfc7ab78ae50b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "If the equilibrium constant of the reaction $2 \\mathrm{HI} \\rightleftharpoons \\mathrm{H}_{2}+\\mathrm{I}_{2}$ is $0.25,$ then the equilibrium constant for the reaction $\\mathrm{H}_{2} ry": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
