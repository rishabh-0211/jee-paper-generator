/mo><mn>3</mn><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#10230;</mo><mn>2</mn><mi>ZnO</mi><mo>+</mo><mn>2</mn><msub><mi>SO</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "fDst5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>MgCO</mi><mn>3</mn></msub><mover><mo>&#10230;</mo><mi mathvariant=\"normal\">&#916;</mi></mover><mi>MgO</mi><mo>+</mo><msub><mi>CO</mi><mn>2</mn></msub></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>The process of conversion of a concentrated ore into its oxide by heating in absence of or in limited supply of air is called calcination. It is usually done for hydroxide, hydrated oxides and carbonate&nbsp;ores.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>MgCO</mi><mn>3</mn></msub><mover><mo>&#10230;</mo><mi mathvariant=\"normal\">&#916;</mi></mover><mi>MgO</mi><mo>+</mo><msub><mi>CO</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7946f5bfc7ab78ae616", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "Calcination is used in metallurgy for removal of?", "image": null}, "options": [{"id": "zLFgS", "text": "Water and sulphide", "image": null, "isCorrect": false}, {"id": "B3pSt", "text": "Water and $\\mathrm{CO}_{2}$", "image": null, "isCorrect": true}, {"id": "fvaUA", "text": "$\\mathrm{CO}_{2}$ and $\\mathrm{H}_{2} \\mathrm{~S}$", "image": null, "isCorrect": false}, {"id": "JxuJI", "text": "$\\mathrm{H}_{2} \\mathrm{O}$ and $\\mathrm{H}_{2} \\mathrm{~S}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Calcination is used for removal of volatile impurities and decompose carbonates.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e8626f5bfc7ab78aed93", "title": "Reduction to Crude Metal", "totalQuestions": 1, "questions": [{"_id": "64c0e8186f5bfc7ab78aea8a", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "$\\Delta_{f} \\mathrm{G}^{-}$ vs $\\mathrm{T}$ plot in the Ellingham diagram slopes downward for the reaction", "image": null}, "options": [{"id": "s3aBT", "text": "$\\mathrm{Mg}+\\frac{1}{2} \\mathrm{O}_{2} \\rightarrow \\mathrm{MgO}$", "isCorrect": false, "image": null}, {"id": "GzF9e", "text": "$2 \\mathrm{Ag}+\\frac{1}{2} \\mathrm{O}_{2} \\rightarrow \\mathrm{Ag}_{2} \\mathrm{O}$", "isCorrect": false, "image": null}, {"id": "cx2sN", "text": "$\\mathrm{C}+\\frac{1}{2} \\mathrm{O}_{2} \\rightarrow \\mathrm{CO}$", "isCorrect": true, "image": null}, {"id": "2ZYVr", "text": "$\\mathrm{CO}+\\frac{1}{2} \\mathrm{O}_{2} \\rightarrow \\mathrm{CO}_{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\mathrm{C}(\\mathrm{s})+\\frac{1}{2} \\mathrm{O}_{2}(\\mathrm{~g}) \\rightarrow \\mathrm{CO}(\\mathrm{g}) ; \\Delta \\mathrm{S}$ increases.\r\n\r\nHence, as the temperature increases, $\\mathrm{T} \\Delta \\mathrm{S}$ increases and hence $\\Delta \\mathrm{G}(\\Delta \\mathrm{H}-\\mathrm{T} \\Delta \\mathrm{S})$ decreases. In other words, the slope of the curve for formation of CO decreases. However, for all other oxides, it increases.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e8626f5bfc7ab78aed91", "title": "Refining of Crude Metal", "totalQuestions": 2, "questions": [{"_id": "64c0e7eb6f5bfc7ab78ae8fd", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 2, "question": {"text": "Which of the following metal is leached by cyanide process&nbsp;", "image": null}, "options": [{"id": "KZEHq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ag</mi></math>", "isCorrect": true, "image": null}, {"id": "ABLfY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi></math>", "isCorrect": false, "image": null}, {"id": "ophJ3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Al</mi></math>", "isCorrect": false, "image": null}, {"id": "U9BrG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cu</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Cyanide process, which is also known as MacArthur cyanide process involves the extraction of gold and silver from their ores by dissolving them in a dilute solution of sodium cyanide or potassium cyanide.&nbsp;The leaching is carried out in the presence of air or oxygen to oxidise the metal.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ag</mi></math> is leached by cyanide process by making the complex using <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaCN</mi><mo>/</mo><mi>KCN</mi></math> as follows</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Ag</mi><mn>2</mn></msub><mi mathvariant=\"normal\">S</mi><mo>+</mo><mn>4</mn><mi>NaCN</mi><mo>&#10230;</mo><mn>2</mn><munder><mrow><mi>Na</mi><mfenced close=\"]\" open=\"[\"><mrow><mi>Ag</mi><mo>(</mo><mi>CN</mi><msub><mo>)</mo><mn>2</mn></msub></mrow></mfenced></mrow><mi>Soluble</mi></munder><mo>+</mo><msub><mi>Na</mi><mn>2</mn></msub><mi mathvariant=\"normal\">S</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7cd6f5bfc7ab78ae803", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 1, "question": {"text": "Semiconductor materials like Si and Ge are usually purified by", "image": null}, "options": [{"id": "QVDaD", "text": "distillation", "isCorrect": false, "image": null}, {"id": "EX6NX", "text": "zone refining", "isCorrect": true, "image": null}, {"id": "ejQvP", "text": "liquation", "isCorrect": false, "image": null}, {"id": "pgSDX", "text": "electrolytic refining", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Semiconductor materials like Si and Ge are usually purified by zone refining. Zone refining is based on the principle of fractional crystallisation i.e. difference in\r\n\r\nstates of metal, so that the zones of impurities are formed and finally removed.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64c0e8626f5bfc7ab78aed92", "title": "Extraction of Metals", "totalQuestions": 4, "questions": [{"_id": "67726d07c49e8ef28ee2b3b3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "The chemical composition of 'slag' formed during the smelting process in the extraction of copper is", "image": null}, "options": [{"id": "rhEG7", "text": "$\\mathrm{Cu}_2 \\mathrm{O}+\\mathrm{FeS}$", "image": null, "isCorrect": false}, {"id": "MutiU", "text": "$\\mathrm{FeSiO}_3$", "image": null, "isCorrect": true}, {"id": "YZ3VV", "text": "$\\mathrm{CuFeS}_2$", "image": null, "isCorrect": false}, {"id": "969MA", "text": "$\\mathrm{Cu}_2 \\mathrm{~S}+\\mathrm{FeO}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "During the extraction of copper, iron is present in the ore as impurity (FeS).\nThe ore together with a little coke and silica is smelted; FeS present as impurity in the ore is oxidized to iron oxide, which then reacts with silica to form fusible ferrous silicate which is removed as slag.\n$2 \\mathrm{FeS}+3 \\mathrm{O}_2 \\rightarrow 2 \\mathrm{FeO}+2 \\mathrm{SO}_2 \\uparrow$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/6cK-T1m2YLKpiMG1exrlR_WDOlXvmbBGKhhiXVWaveI.original.fullsize.png\"/><br/>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87397ae24e9e2db8c78", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "The reaction that does NOT take place in a blast furnace between $900 \\mathrm{~K}$ to $1500 \\mathrm{~K}$ temperature range during extraction of iron is :", "image": null}, "options": [{"id": "B6wMf", "text": "$\\mathrm{Fe}_2 \\mathrm{O}_3+\\mathrm{CO} \\rightarrow 2 \\mathrm{FeO}+\\mathrm{CO}_2$", "image": null, "isCorrect": true}, {"id": "c4nnS", "text": "$\\mathrm{FeO}+\\mathrm{CO} \\rightarrow \\mathrm{Fe}+\\mathrm{CO}_2$", "image": null, "isCorrect": false}, {"id": "PqP27", "text": "$\\mathrm{C}+\\mathrm{CO}_2 \\rightarrow 2 \\mathrm{CO}$", "image": null, "isCorrect": false}, {"id": "ATJU5", "text": "$\\mathrm{CaO}+\\mathrm{SiO}_2 \\rightarrow \\mathrm{CaSiO}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "At $900-1500 \\mathrm{~K}$ (higher temperature range in the blast furnace)<br />Reaction which take place are:<br />$\\mathrm{C}+\\mathrm{CO}_2 \\longrightarrow 2 \\mathrm{CO}$<br />$\\mathrm{FeO}+\\mathrm{CO} \\longrightarrow \\mathrm{Fe}+\\mathrm{CO}_2$<br />$\\mathrm{CaO}+\\mathrm{SiO}_2 \\longrightarrow \\mathrm{CaSiO}_3$ (Slag formation)<br />$\\mathrm{Fe}_2 \\mathrm{O}_3+\\mathrm{CO} \\longrightarrow 2 \\mathrm{FeO}+\\mathrm{CO}_2$ at $500-800 \\mathrm{~K}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e80a6f5bfc7ab78aea0e", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 2, "question": {"text": "The final step for extraction of copper from copper pyrite in bessemer converter involves the reaction", "image": null}, "options": [{"id": "Mo6D6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Cu</mi><mn>2</mn></msub><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>+</mo><mn>2</mn><msub><mi>Cu</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#10230;</mo><mn>6</mn><mi>Cu</mi><mo>+</mo><msub><mi>SO</mi><mn>2</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "bdUMm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi>Cu</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><mi>FeS</mi><mo>&#10230;</mo><mn>8</mn><mi>Cu</mi><mo>+</mo><msub><mi>FeSO</mi><mn>4</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "xKcXp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>Cu</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><mi>FeS</mi><mo>&#10230;</mo><mn>4</mn><mi>Cu</mi><mo>+</mo><mi>Fe</mi><mo>+</mo><msub><mi>SO</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "crfeH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Cu</mi><mn>2</mn></msub><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>+</mo><mn>2</mn><mi>FeO</mi><mo>&#10230;</mo><mn>2</mn><mi>Cu</mi><mo>+</mo><mi>Fe</mi><mo>+</mo><msub><mi>SO</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>In Bessemer converter, copper-sulphide is partially oxidised to cuprous oxide, which further reacts with the remaining copper sulphide to give copper and sulphur di oxide, i.e. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Cu</mi><mn>2</mn></msub><mo>&#160;</mo><mi mathvariant=\"normal\">S</mi><mo>+</mo><mn>2</mn><msub><mi>Cu</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#10230;</mo><mn>6</mn><mi>Cu</mi><mo>+</mo><msub><mi>SO</mi><mn>2</mn></msub></math></p><p>This reaction represents auto reduction.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Cu</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>&nbsp;reacts with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Cu</mi><mn>2</mn></msub><mi mathvariant=\"normal\">S</mi></math>&nbsp;to give copper metal. The solid metal obtained is called as blister copper and is about 99% pure.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f86f5bfc7ab78ae96f", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 3, "question": {"text": "In the context of the Hall-Heroult process for the extraction of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Al</mi></math>, which of the following statement is incorrect.", "image": null}, "options": [{"id": "ABezA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CO</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math> are produced in the process.", "isCorrect": false, "image": null}, {"id": "4HASi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Al</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math> is mixed with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaF</mi><mn>2</mn></msub></math> which lowers the melting point of the mixture and brings conductivity.", "isCorrect": false, "image": null}, {"id": "UJ0JB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Al</mi><mrow><mn>3</mn><mo>+</mo></mrow></msup></math> is reduced at the cathode to form <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Al</mi></math>.", "isCorrect": false, "image": null}, {"id": "M9aSH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>3</mn></msub><msub><mi>AlF</mi><mn>6</mn></msub></math> serves as the electrolyte.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>(i) In Hall-Heroult process for extraction of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Al</mi></math>, carbon anode is oxidised to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CO</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math>.</p><p>(ii) When <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Al</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math> is mixed with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaF</mi><mn>2</mn></msub></math>, it lowers the melting point of the mixture and brings conductivity.</p><p>(iii) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Al</mi><mrow><mn>3</mn><mo>+</mo></mrow></msup></math> is reduced at cathode to form <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Al</mi></math>.</p><p>(iv) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Al</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math> serves as the electrolyte, undergoing the redox process. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>3</mn></msub><msub><mi>AlF</mi><mn>6</mn></msub></math> although is an electrolyte but serves as a solvent, not electrolyte.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
