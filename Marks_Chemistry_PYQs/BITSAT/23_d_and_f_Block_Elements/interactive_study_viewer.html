: ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7fb6f5bfc7ab78ae98a", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 1, "question": {"text": "When dil. sulphuric acid reacts with aqueous solution of potassium chromate, the colour changes from yellow to orange. This shows that", "image": null}, "options": [{"id": "uXPUu", "text": "chromate ions reduced", "isCorrect": false, "image": null}, {"id": "fYYcO", "text": "chromate ions are oxidised", "isCorrect": false, "image": null}, {"id": "axKKp", "text": "monocentric complex is converted into dicentric complex", "isCorrect": true, "image": null}, {"id": "nWQkp", "text": "oxygen gets removed from chromate ions", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>On acidification of potassium chromate solution, yellow colour changes to orange colour due to formation of dichromate which suggests that monocentric complex is converted into dicentric complex.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi mathvariant=\"normal\">K</mi><mn>2</mn></msub><msub><mi>CrO</mi><mn>4</mn></msub><mo>+</mo><munder><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>SO</mi><mn>4</mn></msub></mrow><mfenced><mtext>Dil.</mtext></mfenced></munder><mo>&#10230;</mo><msub><mi mathvariant=\"normal\">K</mi><mn>2</mn></msub><msub><mi>Cr</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>7</mn></msub><mo>+</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">K</mi><mn>2</mn></msub><msub><mi>SO</mi><mn>4</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7cf6f5bfc7ab78ae80f", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 1, "question": {"text": "The number of elements present in the d-block of the periodic table is", "image": null}, "options": [{"id": "O7aTY", "text": "40", "isCorrect": true, "image": null}, {"id": "eWWJG", "text": "41", "isCorrect": false, "image": null}, {"id": "xKmsx", "text": "45", "isCorrect": false, "image": null}, {"id": "MoyBG", "text": "46", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "40 elements are present in d-block.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c06f5bfc7ab78ae791", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which form coloured salts:", "image": null}, "options": [{"id": "TvSSX", "text": "Non-metals", "isCorrect": false, "image": null}, {"i f74", "text": "hydrogen peroxide", "image": null, "isCorrect": false}, {"id": "4WXj8", "text": "conc. nitric acid", "image": null, "isCorrect": false}, {"id": "t3wGO", "text": "peroxy disulphate", "image": null, "isCorrect": true}, {"id": "9GxyY", "text": "dichromate", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In laboratory, manganese (II) ion salt is oxidised to permanganate ion in aqueous solution by peroxodisulphate.<br />$2 \\mathrm{Mn}^{2+}+\\underset{\\text{peroxodisulphate ion}}{5 \\mathrm{~S}_2 \\mathrm{O}_8^{2-}}+8 \\mathrm{H}_2 \\mathrm{O} \\rightarrow$ $2 \\mathrm{MnO}_4^{-}+10 \\mathrm{SO}_4^{2-}+16 \\mathrm{H}^{+}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b16f5bfc7ab78ae705", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 1, "question": {"text": "When same amount of zinc is treated separately with excess of sulphuric acid and excess of sodium hydroxide solution, the ratio of volumes of hydrogen evolved is:", "image": null}, "options": [{"id": "WxKPk", "text": "1: 1", "isCorrect": true, "image": null}, {"id": "EA5xN", "text": "1: 2", "isCorrect": false, "image": null}, {"id": "TRcv3", "text": "2: 1", "isCorrect": false, "image": null}, {"id": "ZrFgG", "text": "9: 4", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\mathrm{Zn}+\\mathrm{H}_{2} \\mathrm{SO}_{4} \\rightarrow \\mathrm{ZnSO}_{4}+\\mathrm{H}_{2}$\r\n\r\n$\\mathrm{Zn}+2 \\mathrm{NaOH} \\rightarrow \\mathrm{Na}_{2} \\mathrm{ZnO}_{2}+\\mathrm{H}_{2}$\r\n\r\n$\\therefore$ Ratio of volumes of $\\mathrm{H}_{2}$ evolved is 1: 1", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7876f5bfc7ab78ae5a7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "Which one of the following statements is correct?", "image": null}, "options": [{"id": "WMfmg", "text": "From a mixed precipitate of $\\mathrm{AgCl}$ and $\\mathrm{AgI}$, ammonia solution dissolves only $\\mathrm{AgCl}$.", "image": null, "isCorrect": true}, {"id": "sLwuX", "text": "Ferric ions give a deep green precipitate on adding potassium ferrocyanide solution.", "image": null, "isCorrect": false}, {"id": "JcfSa", "text": "On boiling a solution having $\\mathrm{K}^{+}, \\mathrm{Ca}^{2+}$ and $\\mathrm{HCO}_{3}^{-}$ ions we get a precipitate of $\\mathrm{K}_{2} \\mathrm{Ca}\\left(\\mathrm{CO}_{3}\\right)_{2}$", "image": null, "isCorrect": false}, {"id": "js7gJ", "text": "Manganese salts give a violet borax bead test in the reducing flame.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ammonia can dissolve ppt. of AgCl only due to formation of complex as given below:\n$$\n\\mathrm{AgCl}+2 \\mathrm{NH}_{3} \\rightarrow\\left[\\mathrm{Ag}\\left(\\mathrm{NH}_{3}\\right)_{2}\\right] \\mathrm{Cl}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
