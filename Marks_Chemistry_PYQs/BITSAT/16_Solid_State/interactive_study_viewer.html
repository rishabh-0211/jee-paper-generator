age": null}, {"id": "8uCX3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mn>25</mn></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Edge length of the unit cell <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mover><mi mathvariant=\"normal\">A</mi><mo>.</mo></mover><mo>=</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>8</mn></mrow></msup><mo>&#160;</mo><mi>cm</mi></math></p><p>Volume of unit cell&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mfenced><mrow><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>8</mn></mrow></msup></mrow></mfenced><mn>3</mn></msup><mo>=</mo><mn>8</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>24</mn></mrow></msup><mo>&#160;</mo><msup><mi>cm</mi><mn>3</mn></msup></math></p><p>Mass of one unit cell <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo></math> volume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo></math> density</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>8</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>24</mn></mrow></msup><mo>&#215;</mo><mn>25</mn></math></p><p>Number of unit cell in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> of metal</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mtext>&#160;mass of the metal&#160;</mtext><mtext>&#160;mass of one unit cell&#160;</mtext></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>200</mn><mrow><mn>8</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>24</mn></mrow></msup><mo>&#215;</mo><mn>25</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mn>24</mn></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7df6f5bfc7ab78ae896", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "$\\mathrm{Al}$ (at. wt 27 ) crystallizes in the cubic system with a cell edge of $4.05 Ã…$. Its density is $2.7 \\mathrm{~g}$ per $\\mathrm{cm}^{3}$. Determine the unit cell type calculate the radius of the $\\mathrm{Al}$ atom", "image": null}, "options": [{"id": "WHd4R", "text": "$\\mathrm{fcc}, 2.432 Ã$", "isCorrect": false, "image": null}, {"id": "K21Bv", "text": "bcc, $2.432 Ã$", "isCorrect": false, "image": null}, {"id": "K2J0M", "text": "bcc, $1.432 Ã$", "isCorrect": false, "image": null}, {"id": "4WlEo", "text": "$\\mathrm{fcc}, 1.432 Ã$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "$\\rho=\\frac{Z \\times M}{N_{0} \\times a^{3}}$,\r\n\r\n$$\r\n\r\n2.7=\\frac{Z \\times 27}{6.02 \\times 10^{23} \\times(4.05)^{3} \\times 10^{-24}}\r\n\r\n$$\r\n\r\n$\\therefore Z=4$\r\n\r\nHence it is face centred cubic unit lattice.\r\n\r\nAgain $4 r=a \\sqrt{2}=5.727 Ã…$\r\n\r\n$\\therefore \\mathrm{r}=1.432 Ã…$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7bf6f5bfc7ab78ae786", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 3, "question": {"text": "An elemental crystal has a density of $8570 \\mathrm{~kg} / \\mathrm{m}^{3}$. The packing efficiency is 0.68 . The closest distance of approach between neighbouring atom is $2.86 Ã…$. What is the mass of one atom approximately?", "image": null}, "options": [{"id": "7AIyD", "text": "$93 \\mathrm{amu}$", "isCorrect": true, "image": null}, {"id": "al9L0", "text": "$39 \\mathrm{amu}$", "isCorrect": false, "image": null}, {"id": "Dibo1", "text": "$63 \\mathrm{amu}$", "isCorrect": false, "image": null}, {"id": "PVwGt", "text": "$29 \\mathrm{amu}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The packing efficiency $=0.68$, means the given lattice is $\\mathrm{BCC}$. The closest distance of approach $=2 \\mathrm{r}$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n2 r=2.86 A=a \\sqrt{3} \\\\\r\n\r\n\\text { or a }=\\frac{2 \\times 2.86}{\\sqrt{3}}=3.30 Ã…\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nLet atomic weight of the element $=\\mathrm{a}$\r\n\r\n$$\r\n\r\n\\begin{aligned}\r\n\r\n\\therefore & \\frac{2 \\times 9}{36 \\times 10^{23} \\times(3.3)^{3} \\times 10^{-24}}=8.57 \\\\\r\n\r\n\\mathrm{a} &=8.57 \\times 3 \\times(3.3)^{3} \\times 0.1 \\\\\r\n\r\n&=92.39 \\simeq 93 \\mathrm{amu}\r\n\r\n\\end{aligned}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7936f5bfc7ab78ae610", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "The fraction of total volume occupied by the atoms present in a simple cube is", "image": null}, "options": [{"id": "56vRu", "text": "$\\frac{\\pi}{3 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "Hz0r7", "text": "$\\frac{\\pi}{4 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "DMtZn", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": false}, {"id": "dzrzj", "text": "$\\frac{\\pi}{6}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Number of atoms per unit cell $=1$ Atoms touch each other along edges. Hence $r=\\frac{a}{2}$\n$(\\mathrm{r}=$ radius of atom and $\\mathrm{a}=$ edge length)\nTherefore $\\%$ $=\\frac{\\frac{4}{3} \\pi r^{3}}{(2 r)^{3}}=\\frac{\\pi}{6}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7776f5bfc7ab78ae516", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "The atomic radius of atom is r. Total volume of atoms present in a $f c c$ unit cell of an element is", "image": null}, "options": [{"id": "axPun", "text": "$\\frac{24}{3} \\pi r^{3}$", "image": null, "isCorrect": false}, {"id": "UwZn9", "text": "$\\frac{12}{3} \\pi r^{3}$", "image": null, "isCorrect": false}, {"id": "ArHei", "text": "$\\frac{16}{3} \\pi r^{3}$", "image": null, "isCorrect": true}, {"id": "w2Zcu", "text": "None", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "4 atom are present in $f c c$.\n$$\n\\mathrm{So}, \\mathrm{V}=4\\left[\\frac{4}{3} \\pi \\mathrm{r}^{3}\\right]=\\frac{16}{3} \\pi \\mathrm{r}^{3}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e8616f5bfc7ab78aed82", "title": "Stoichiometric defects", "totalQuestions": 4, "questions": [{"_id": "65b7b87c97ae24e9e2db8cd7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "In a solid lattice, the cation has left a lattice site and is located at an interstitial position, the lattice defect is :", "image": null}, "options": [{"id": "gCKrD", "text": "<br />Interstitial defect", "image": null, "isCorrect": false}, {"id": "uiUAg", "text": "<br />Valency defect", "image": null, "isCorrect": false}, {"id": "cDPAW", "text": "<br />Frenkel defect", "image": null, "isCorrect": true}, {"id": "fM3qU", "text": "<br />Schottky defect", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Frenkel defect is due to dislocation of ion from its usual lattice site to interstitial position.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87297ae24e9e2db8c6f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "Frenkel and Schottky defects are :", "image": null}, "options": [{"id": "zZDMH", "text": "nucleus defects", "image": null, "isCorrect": false}, {"id": "SRbVT", "text": "non-crystal defects", "image": null, "isCorrect": false}, {"id": "BEdSA", "text": "crystal defects", "image": null, "isCorrect": true}, {"id": "ZyXxU", "text": "nuclear defects", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Frenkel and Schottky defects are crystal defects. It arises due to dislodgement of cation or anion from their places in the crystal lattice.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8056f5bfc7ab78ae9e7", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 2, "question": {"text": "In a compound, atoms of elements <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math> form ccp lattice and those of element <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math> occupy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>/</mo><mn>3</mn><mo>&#160;</mo><mi>rd</mi></math>&nbsp;of&nbsp;tetrahedral voids. The formula of the compound can be", "image": null}, "options": [{"id": "0lQYi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">X</mi><mn>4</mn></msub><msub><mi mathvariant=\"normal\">Y</mi><mn>3</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "9CnsR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">X</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">Y</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "LBwBf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">X</mi><mn>2</mn></msub><mi mathvariant=\"normal\">Y</mi></math>", "isCorrect": false, "image": null}, {"id": "2zDbf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">X</mi><mn>3</mn></msub><msub><mi mathvariant=\"normal\">Y</mi><mn>4</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Let atoms of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math> in ccp structure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>100</mn></math></p><p>Then, number of tetrahedral voids <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>100</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo></math> Number of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math> atoms <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac></math> rd of tetrahedral voids</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> Number of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math> atoms <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>&#215;</mo><mn>200</mn><mo>=</mo><mfrac><mn>400</mn><mn>3</mn></mfrac></math></p><p>Hence, formula of compound can be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msub><mi mathvariant=\"normal\">X</mi><mn>4</mn></msub><msub><mi mathvariant=\"normal\">Y</mi><mn>3</mn></msub></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b16f5bfc7ab78ae70d", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 1, "question": {"text": "Due to Frenkel defect, the density of ionic solids", "image": null}, "options": [{"id": "Uz4Pb", "text": "decreases", "isCorrect": false, "image": null}, {"id": "91kNw", "text": "increases", "isCorrect": false, "image": null}, {"id": "2vsLn", "text": "does not change", "isCorrect": true, "image": null}, {"id": "MmF8o", "text": "changes", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "No change in density.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e8616f5bfc7ab78aed83", "title": "Non-stoichiometric defects", "totalQuestions": 1, "questions": [{"_id": "64c0e7df6f5bfc7ab78ae895", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 3, "question": {"text": "The non stoichiometric compound $\\mathrm{Fe}_{0.94} \\mathrm{O}$ is formed when $\\mathrm{x} \\%$ of $\\mathrm{Fe}^{2+}$ ions are replaced by as many $\\frac{2}{3} \\mathrm{Fe}^{3+}$ ions, $\\mathrm{x}$ is", "image": null}, "options": [{"id": "zFNkV", "text": "18", "isCorrect": true, "image": null}, {"id": "Xp0tb", "text": "12", "isCorrect": false, "image": null}, {"id": "v6oW0", "text": "15", "isCorrect": false, "image": null}, {"id": "cytD8", "text": "6", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The number of $\\mathrm{Fe}^{3+}$ ions replacing $\\mathrm{x} \\mathrm{Fe}^{2+}$ ions $=\\frac{2 \\mathrm{x}}{3}$ vacancies of cations\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n=x-\\frac{2 x}{3}=x / 3 \\\\\r\n\r\n\\text { But } x / 3=1-0.94=0.06, x=0.06 \\times 3 \\\\\r\n\r\n=0.18=18 \\%\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
