ath/MathML\"><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> of its oxide on strong heating the equivalent weight of copper is", "image": null}, "options": [{"id": "jMMOl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>23</mn></math>", "isCorrect": false, "image": null}, {"id": "HAqAq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>32</mn></math>", "isCorrect": true, "image": null}, {"id": "fSBOE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn></math>", "isCorrect": false, "image": null}, {"id": "P1Ins", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math>&nbsp;of copper gave <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> of its oxide means,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> of oxygen combine with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> of copper.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo></math> Eq. wt of oxygen <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>8</mn></math>,</p><p>Therefore,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> of oxygen combine with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4</mn><mo>&#215;</mo><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> of copper <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>32</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math></p><p>Hence,&nbsp;</p><p>Equivalent weight of copper <math xm 3}{5}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "\\mathrm{KCl} x & =-1 & \\mathrm{KClO}_{3}\r\n\r\npotassium chloride $+1+x-6=0$\r\n\r\n$$\r\n\r\nx=+5\r\n\r\n$$\r\n\r\npotassium chlorate.\r\n\r\n$\\therefore$ Ratio of oxidation state of $\\mathrm{Cl}=\\frac{-1}{5}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b06f5bfc7ab78ae704", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 1, "question": {"text": "The oxidation state of sulphur in $\\mathrm{Na}_{2} \\mathrm{~S}_{4} \\mathrm{O}_{6}$ is", "image": null}, "options": [{"id": "0fhA1", "text": "6", "isCorrect": false, "image": null}, {"id": "tMMzZ", "text": "$\\frac{+3}{2}$", "isCorrect": false, "image": null}, {"id": "T2Tm1", "text": "$\\frac{+5}{2}$", "isCorrect": true, "image": null}, {"id": "l0wK6", "text": "-2", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\mathrm{Na}_{2} \\mathrm{~S}_{4} \\mathrm{O}_{6}$\r\n\r\n$2+4 x-12=0$\r\n\r\n$4 x-10=0$\r\n\r\n$x=\\frac{10}{4}=\\frac{+5}{2}$\r\n\r\nOxidation state of $\\mathrm{S}$ is $=\\frac{+5}{2}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7766f5bfc7ab78ae50c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "The oxidation states of sulphur in the anions $\\mathrm{SO}_{3}^{2-}, \\mathrm{S}_{2} \\mathrm{O}_{4}^{2-}$ and $\\mathrm{S}_{2} \\mathrm{O}_{6}^{2-}$ follow the order", "image": null}, "options": [{"id": "qR84Y", "text": "$\\mathrm{SO}_{3}^{2-}<\\mathrm{S}_{2} \\mathrm{O}_{4}^{2-}<\\mathrm{S}_{2} \\mathrm{O}_{6}^{2-}$", "image": null, "isCorrect": false}, {"id": "gw6OK", "text": "$\\mathrm{S}_{2} \\mathrm{O}_{4}^{2-}<\\mathrm{S}_{2} \\mathrm{O}_{6}^{2-}<\\mathrm{SO}_{3}^{2-}$", "image": null, "isCorrect": false}, {"id": "fSTnA", "text": "$\\mathrm{S}_{2} \\mathrm{O}_{6}^{2-}<\\mathrm{S}_{2} \\mathrm{O}_{4}^{2-}<\\mathrm{SO}_{3}^{2-}$", "image": null, "isCorrect": false}, {"id": "RQYJo", "text": "$\\mathrm{S}_{2} \\mathrm{O}_{4}^{2-}<\\mathrm{SO}_{3}^{2-}<\\mathrm{S}_{2} \\mathrm{O}_{6}^{2-}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to chemical bond method:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/CiGhmbDxmHV-6qt6fbLHgAigU8yCStERw-2U_gLiYs0.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e8606f5bfc7ab78aed72", "title": "Balancing of redox reactions", "totalQuestions": 2, "questions": [{"_id": "67726d14c49e8ef28ee2b416", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "What is the stoichiometric coefficient of $\\mathrm{SO}_2$ in the following balance reaction?\n$\\mathrm{MnO}_4^{-}(a q)+\\mathrm{SO}_2(g) \\longrightarrow \\mathrm{Mn}^{2+}(a q)+\\mathrm{HSO}_4^{-}(a q)$\n(in acidic solution)", "image": null}, "options": [{"id": "Tu9SM", "text": "5", "image": null, "isCorrect": true}, {"id": "aArtF", "text": "4", "image": null, "isCorrect": false}, {"id": "Hcv6u", "text": "3", "image": null, "isCorrect": false}, {"id": "mGHxQ", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Oxidation half reaction:\n$\\mathrm{SO}_2(\\mathrm{~g})+2 \\mathrm{H}_2 \\mathrm{O}(l) \\longrightarrow \\mathrm{HSO}_4^{-}(a q)+3 \\mathrm{H}^{+}(a q)+2 e^{-}...(i)$\nReduction half reaction:\n$\\mathrm{MnO}_4^{-}(a q)+8 \\mathrm{H}^{+}+5 e^{-} \\longrightarrow \\mathrm{Mn}^{2+}(a q)+4 \\mathrm{H}_2 \\mathrm{O}(l)...(ii)$\nMultiply eq. (i) by 5 and (ii) by 2 and then add\n$\\begin{aligned}\n2 \\mathrm{MnO}_4^{-}(a q)+5 \\mathrm{SO}_2(g) & +2 \\mathrm{H}_2 \\mathrm{O}(l)+\\mathrm{H}^{+}(a q) \\\\\n& \\longrightarrow 2 \\mathrm{Mn}^{+}(a q)+5 \\mathrm{HSO}_4^{-}(a q)\n\\end{aligned}$\nThus, the stoichiometric coefficient of $\\mathrm{SO}_2$ in the above balance equation is 5 .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8266f5bfc7ab78aeb05", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "For the reaction: $\\mathrm{NH}_{3}+\\mathrm{OCl}^{-} \\rightarrow \\mathrm{N}_{2} \\mathrm{H}_{4}+\\mathrm{Cl}^{-}$in basic medium, the coefficients of $\\mathrm{NH}_{3}, \\mathrm{OCl}^{-}$and $\\mathrm{N}_{2} \\mathrm{H}_{4}$ for the balanced equation are respectively", "image": null}, "options": [{"id": "twhDg", "text": "$2,2,2$", "isCorrect": false, "image": null}, {"id": "axzNy", "text": "$2,2,1$", "isCorrect": false, "image": null}, {"id": "cFdwF", "text": "$2,1,1$", "isCorrect": true, "image": null}, {"id": "l2Kgs", "text": "$4,4,2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The balanced equation :\r\n\r\n$2 \\mathrm{NH}_{3}+\\mathrm{OCl}^{-} \\rightarrow \\mathrm{N}_{2} \\mathrm{H}_{4}+\\mathrm{Cl}^{-}+\\mathrm{H}_{2} \\mathrm{O}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64c0e85f6f5bfc7ab78aed6e", "title": "Equivalence concept", "totalQuestions": 4, "questions": [{"_id": "64c0e7b46f5bfc7ab78ae720", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "Volume of $3 \\%$ solution of sodium carbonate necessary to neutralise a litre of $0.1 \\mathrm{~N}$ sulphuric acid", "image": null}, "options": [{"id": "s1AgE", "text": "$176.66 \\mathrm{ml}$", "isCorrect": true, "image": null}, {"id": "O97ru", "text": "$156.6 \\mathrm{ml}$", "isCorrect": false, "image": null}, {"id": "Y8qej", "text": "$116.0 \\mathrm{ml}$", "isCorrect": false, "image": null}, {"id": "xjVHq", "text": "$196.1 \\mathrm{ml}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Normality of $3 \\% \\mathrm{Na}_{2} \\mathrm{CO}_{3}$\r\n\r\n$\\mathrm{N}=\\frac{3 \\times 1000}{53 \\times 100}=0.566 \\mathrm{~N}$\r\n\r\nFor $\\mathrm{H}_{2} \\mathrm{SO}_{4}$ sol. $\\mathrm{N}_{1}=0.1, \\mathrm{~V}_{1}=100 \\mathrm{~mL}$\r\n\r\nFor $\\mathrm{Na}_{2} \\mathrm{CO}_{3}$ sol. $\\mathrm{N}_{2}=0.566$\r\n\r\nNow apply $\\mathrm{N}_{1} \\mathrm{~V}_{1}=\\mathrm{N}_{2} \\mathrm{~V}_{2}$\r\n\r\n$\\mathrm{V}_{2}=\\frac{\\mathrm{N}_{1} \\mathrm{~V}_{1}}{\\mathrm{~N}_{2}}=\\frac{0.1 \\times 1000 \\mathrm{~mL}}{0.566}=176.66 \\mathrm{~mL}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a46f5bfc7ab78ae6a1", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "$0.45 \\mathrm{~g}$ of acid molecular weight 90 is neutralised by $20 \\mathrm{ml}$ of $0.5 \\mathrm{~N}$ caustic potash. The basicity of acid is", "image": null}, "options": [{"id": "AuZIu", "text": "1", "isCorrect": false, "image": null}, {"id": "bsWOe", "text": "2", "isCorrect": true, "image": null}, {"id": "A4ygg", "text": "3", "isCorrect": false, "image": null}, {"id": "J1Q9m", "text": "4", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Eq. of acid = Eq of base,\r\n$\\begin{array}{l}\r\n\\therefore \\frac{0.45}{\\mathrm{E} \\cdot \\mathrm{wt}}=\\frac{20 \\times 0.5}{1000}=\\mathrm{E} \\mathrm{wt}=45 \\\\\r\n\\text { Basicity }=\\frac{\\mathrm{M} \\cdot \\mathrm{wt}}{\\mathrm{E} \\cdot \\mathrm{wt}}=\\frac{90}{45}=2\r\n\\end{array}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7916f5bfc7ab78ae600", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "$1.520 \\mathrm{~g}$ of hydroxide of a metal on ignition gave $0.995 \\mathrm{~g}$ of oxide. The equivalent weight of metal is:", "image": null}, "options": [{"id": "852ia", "text": "1.52", "image": null, "isCorrect": false}, {"id": "rgzL0", "text": "0.995", "image": null, "isCorrect": false}, {"id": "DnsqS", "text": "190", "image": null, "isCorrect": false}, {"id": "QXC3w", "text": "9", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $E$ be the equivalent weight of the metal\n$$\n\\text { So, } \\frac{E+17}{E+8}=\\frac{1.52}{0.995}\n$$\n[17 is equivalent weight of $\\mathrm{OH}$ and 8 is equivalent weight of oxygen]\n$$\n\\begin{array}{l}\n\\Rightarrow 0.995 \\mathrm{E}+17 \\times 0.995=\\mathrm{E} \\times 1.52+8 \\times 1.52 \\\\\n\\Rightarrow 0.525 \\mathrm{E}=16.915-12.16=4.755 \\\\\n\\therefore \\quad \\mathrm{E}=\\frac{4.755}{0.525}=9\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7836f5bfc7ab78ae583", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "In redox reaction $1 \\mathrm{~g}$ -eq of reducing agent requires $\\mathrm{Pgm}-\\mathrm{eq} .$ of oxidising agent. The value of $\\mathrm{P}$ is", "image": null}, "options": [{"id": "aAV6H", "text": "1", "image": null, "isCorrect": true}, {"id": "3QkWn", "text": "2", "image": null, "isCorrect": false}, {"id": "PHqdo", "text": "3", "image": null, "isCorrect": false}, {"id": "U6bPO", "text": "Depends on reaction", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In redox reaction, $g$ equivalent of reducing agent $=\\mathrm{g}$. equivalent of oxidising agent Hence lg equ. of reducing agent $=\\mathrm{Pg}$ equ. of oxidising agent.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "64c0e85f6f5bfc7ab78aed70", "title": "Redox titration", "totalQuestions": 1, "questions": [{"_id": "64c0e7966f5bfc7ab78ae625", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "Which of the following cannot give iodometric titration?", "image": null}, "options": [{"id": "5eFJb", "text": "$\\mathrm{Fe}^{3+}$", "image": null, "isCorrect": true}, {"id": "mEaAH", "text": "$\\mathrm{Cu}^{2+}$", "image": null, "isCorrect": false}, {"id": "ykDQ9", "text": "$\\mathrm{Pb}^{2+}$", "image": null, "isCorrect": false}, {"id": "0gxNF", "text": "$\\mathrm{Ag}^{2+}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "There is no reaction between $\\mathrm{I}^{-}$ and $\\mathrm{Fe}^{3+}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
