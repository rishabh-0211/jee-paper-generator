 "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "The Bohr orbit radius for the hydrogen atom $(n=1)$ is approximately $0.530 Å$. The radius for the first excited state $(n=2)$ orbit is (in $Å$ )", "image": null}, "options": [{"id": "AzVmx", "text": "0.13", "image": null, "isCorrect": false}, {"id": "1bWqX", "text": "1.06", "image": null, "isCorrect": false}, {"id": "bM3p2", "text": "4.77", "image": null, "isCorrect": false}, {"id": "ccAs0", "text": "2.12", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given : Radius of hydrogen atom $=0.530$<br />$Å$, Number of excited state $(n)=2$ and atomic number of hydrogen atom $(Z)=1$. We know that the Bohr radius<br />$(r)=\\frac{n^2}{Z} \\times \\text { radius of atom }=\\frac{(2)^2}{1} \\times 0.530$<br />$=4 \\times 0.530=2.12 Å$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8096f5bfc7ab78aea0a", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 2, "question": {"text": "If the photon of wavelength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>150</mn><mo>&#160;</mo><mi>pm</mi></math> strikes an atom and one of its inner bound electron is ejected out with a velocity of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>7</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>/</mo><mi mathvariant=\"normal\">s</mi></math>,&nbsp;what is the energy with which it is bound to the nucleus?", "image": null}, "options": [{"id": "ZB4kz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>2</mn></msup><mo>&#160;</mo><mi>eV</mi></math>", "isCorrect": false, "image": null}, {"id": "cqPNf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>15</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi>eV</mi></math>", "isCorrect": false, "image": null}, {"id": "mb8Rq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi>eV</mi></math>", "isCorrect": true, "image": null}, {"id": "rxyZC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>.</mo><mn>12</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi>eV</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Total energy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">E</mi></mfenced></math> of any photon is given by the relation :&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi><mo>=</mo><mfrac><mi>hc</mi><mi mathvariant=\"normal\">&#955;</mi></mfrac></math></p><p>Where, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">h</mi><mo>=</mo></math> Planck&#39;s constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>6</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>34</mn></mrow></msup><mo>&#160;</mo><mi>Js</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">c</mi><mo>=</mo></math> Velocity of light <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>/</mo><mi mathvariant=\"normal\">s</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#955;</mi><mo>=</mo></math> wavelength <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>10</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>,</mo></math>&nbsp;i.e, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>150</mn><mo>&#160;</mo><mi>pm</mi></mrow></mfenced></math></p><p>Thus, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi><mo>=</mo><mfrac><mi>hc</mi><mi mathvariant=\"normal\">&#955;</mi></mfrac><mo>=</mo><mfrac><mrow><mn>6</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>34</mn></mrow></msup><mo>&#215;</mo><mn>3</mn><mo>&#215;</mo><msup><mn>10</mn><mn>8</mn></msup></mrow><mrow><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>10</mn></mrow></msup></mrow></mfrac><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">E</mi><mo>=</mo><mn>1</mn><mo>.</mo><mn>32</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>15</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math>&nbsp;and, energy of ejected electron <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><msup><mi mathvariant=\"normal\">E</mi><mo>&#39;</mo></msup></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">E</mi><mo>&#39;</mo></msup><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>mv</mi><mn>2</mn></msup></math>,</p><p>where,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi><mo>=</mo></math> mass of electron <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>9</mn><mo>.</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>31</mn></mrow></msup><mo>&#160;</mo><mi>kg</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">v</mi><mo>=</mo></math> velocity of electron</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>7</mn></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>/</mo><mi mathvariant=\"normal\">s</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">E</mi><mo>&#39;</mo></msup><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>mv</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>9</mn><mo>.</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>31</mn></mrow></msup><mo>&#215;</mo><msup><mfenced><mrow><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>7</mn></msup></mrow></mfenced><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">E</mi><mo>&#39;</mo></msup><mo>=</mo><mn>1</mn><mo>.</mo><mn>024</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>16</mn></mrow></msup></math></p><p>Thus, total energy of photon <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo></math> Binding energy of electron</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">B</mi></mfenced></math> + energy of ejected electron <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><msup><mi mathvariant=\"normal\">E</mi><mo>&#39;</mo></msup></mfenced></math></p><p>Thus, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>32</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>15</mn></mrow></msup><mo>=</mo><mfenced><mi mathvariant=\"normal\">B</mi></mfenced><mo>+</mo><mfenced><mi mathvariant=\"normal\">E</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">B</mi></mfenced><mo>=</mo><mfenced><mi mathvariant=\"normal\">E</mi></mfenced><mo>-</mo><mfenced><msup><mi mathvariant=\"normal\">E</mi><mo>&#39;</mo></msup></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><mn>1</mn><mo>.</mo><mn>32</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>15</mn></mrow></msup></mrow></mfenced><mo>-</mo><mfenced close=\"]\" open=\"[\"><mrow><mn>1</mn><mo>.</mo><mn>024</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>16</mn></mrow></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>.</mo><mn>2176</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>15</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">J</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>1</mn><mo>.</mo><mn>2176</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>15</mn></mrow></msup></mrow><mrow><mn>1</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>19</mn></mrow></msup></mrow></mfrac><mo>&#160;</mo><mi>eV</mi><mo>=</mo><mn>7</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>&#160;</mo><mi>eV</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8096f5bfc7ab78aea09", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 2, "question": {"text": "In a homonuclear molecule, which of the following set of orbitals is degenerated?", "image": nu als:</p><p>As, energy of,</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#963;</mi><mn>2</mn><mi mathvariant=\"normal\">s</mi><mo>&#62;</mo><mi mathvariant=\"normal\">&#963;</mi><mn>1</mn><mi mathvariant=\"normal\">s</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn><msub><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">x</mi></msub><mo>&#8776;</mo><mn>2</mn><msub><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">y</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">&#960;</mi><mo>*</mo></msup><mn>2</mn><msub><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">x</mi></msub><mo>&#60;</mo><msup><mi mathvariant=\"normal\">&#963;</mi><mo>*</mo></msup><mn>2</mn><msub><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">z</mi></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#963;</mi><mn>2</mn><msub><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">x</mi></msub><mo>&#60;</mo><msup><mi mathvariant=\"normal\">&#963;</mi><mo>*</mo></msup><mn>2</mn><msub><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">z</mi></msub></math></p><p>Thus, only <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn><msub><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">x</mi></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#960;</mi><mn>2</mn><msub><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">y</mi></msub></math> are degenerate orbitals.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "is ": "J7ENY", "text": "$3.08 \\times 10^{15} \\mathrm{~s}^{-1}$", "isCorrect": true, "image": null}, {"id": "gfHpr", "text": "$2.00 \\times 10^{15} \\mathrm{~s}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{v} &=\\frac{1}{\\mathrm{~h}} \\times \\mathrm{IE} \\times\\left[\\frac{1}{\\mathrm{n}_{1}{ }^{2}}-\\frac{1}{\\mathrm{n}_{2}{ }^{2}}\\right] \\\\ &=\\frac{2.18 \\times 10^{-18}}{6.625 \\times 10^{-34}} \\times\\left[\\frac{1}{1}-\\frac{1}{16}\\right]=3.08 \\times 10^{15} \\mathrm{~s}^{-1} \\end{aligned}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8156f5bfc7ab78aea6d", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "What is the maximum wavelength line in the Lyman series of $\\mathrm{He}^{+}$ ion?", "image": null}, "options": [{"id": "bNxKi", "text": "$3 R$", "isCorrect": false, "image": null}, {"id": "se6TB", "text": "$\\frac{1}{\\mathrm{R}}$", "isCorrect": false, "image": null}, {"id": "f8MNH", "text": "$\\frac{1}{3 R}$", "isCorrect": true, "image": null}, {"id": "S0WPd", "text": "None of these", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\frac{1}{\\lambda}=\\mathrm{RZ}^{2}\\left[\\frac{1}{\\mathrm{n}_{1}^{2}}-\\frac{1}{\\mathrm{n}_{2}^{2}}\\right]=\\mathrm{R} \\times 2^{2}\\left[\\frac{1}{\\mathrm{l}^{2}}-\\frac{1}{2^{2}}\\right]$\r\n\r\n$\\Rightarrow 3 \\mathrm{R} ; \\lambda=\\frac{1}{3 \\mathrm{R}}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8066f5bfc7ab78ae9ea", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 1, "question": {"text": "The wavelength corresponding to maximum energy for hydrogen is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>91</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>nm</mi></math>. The corresponding wavelength for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>He</mi><mo>+</mo></msup></math> ion is", "image": null}, "options": [{"id": "NZZSh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>28</mn><mo>&#160;</mo><mi>nm</mi></math>", "isCorrect": false, "image": null}, {"id": "i3Tdz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>22</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mi>nm</mi></math>", "isCorrect": true, "image": null}, {"id": "HDezq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>182</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mi>nm</mi></math>", "isCorrect": false, "image": null}, {"id": "bg0Nm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>364</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mi>nm</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Accordinq to Rydberg&#39;s equation</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi mathvariant=\"normal\">v</mi><mo>&#175;</mo></mover><mo>=</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">&#955;</mi></mfrac><mo>=</mo><msup><mi>RZ</mi><mn>2</mn></msup><mfenced close=\"]\" open=\"[\"><mrow><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">L</mi><mn>2</mn></msubsup></mfrac><mo>-</mo><mfrac><mn>1</mn><msubsup><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">H</mi><mn>2</mn></msubsup></mfrac></mrow></mfenced></math></p><p>where,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi mathvariant=\"normal\">v</mi><mo>&#175;</mo></mover><mo>=</mo></math> wave number</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#955;</mi><mo>=</mo></math> wavelength</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo></math> Rydberg constant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>=</mo><mn>109677</mn><mo>&#160;</mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Z</mi><mo>=</mo></math> atomic number</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">L</mi></msub><mo>=</mo></math> lower energy state</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">H</mi></msub><mo>=</mo></math> higher energy state.</p><p>i.e. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi mathvariant=\"normal\">&#955;</mi></mfrac><mo>&#8733;</mo><msup><mi mathvariant=\"normal\">Z</mi><mn>2</mn></msup></math></p><p>Thus, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi mathvariant=\"normal\">&#955;</mi><mfenced><msup><mi>He</mi><mo>+</mo></msup></mfenced></mrow><mrow><mi mathvariant=\"normal\">&#955;</mi><mfenced><mi mathvariant=\"normal\">H</mi></mfenced></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mi mathvariant=\"normal\">Z</mi><mn>2</mn></msup><mfenced><mi mathvariant=\"normal\">H</mi></mfenced></mrow><mrow><msup><mi mathvariant=\"normal\">Z</mi><mn>2</mn></msup><mfenced><msup><mi>He</mi><mo>+</mo></msup></mfenced></mrow></mfrac></math></p><p>To find <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#955;</mi><mfenced><msup><mi>He</mi><mo>+</mo></msup></mfenced><mo>=</mo><mo>?</mo></math></p><p>Given, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#955;</mi><mfenced><mi mathvariant=\"normal\">H</mi></mfenced><mo>=</mo><mn>91</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>nm</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Z</mi><mfenced><mi mathvariant=\"normal\">H</mi></mfenced><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Z</mi><mfenced><mi>He</mi></mfenced><mo>=</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">&#955;</mi><mfenced><msup><mi>He</mi><mo>+</mo></msup></mfenced><mo>=</mo><mfrac><mrow><mn>1</mn><mo>&#215;</mo><mn>91</mn><mo>.</mo><mn>2</mn></mrow><mn>4</mn></mfrac><mo>=</mo><mn>22</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mi>nm</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7dd6f5bfc7ab78ae886", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 1, "question": {"text": "The first emission line in the atomic spectrum of hydrogen in the Balmer series appears at", "image": null}, "options": [{"id": "ZalBq", "text": "$\\frac{9 R}{400} \\mathrm{~cm}^{-1}$", "isCorrect": false, "image": null}, {"id": "W3KQE", "text": "$\\frac{7 \\mathrm{R}}{144} \\mathrm{~cm}^{-1}$", "isCorrect": false, "image": null}, {"id": "6WYcj", "text": "$\\frac{3 \\mathrm{R}}{4} \\mathrm{~cm}^{-1}$", "isCorrect": false, "image": null}, {"id": "ErYo4", "text": "$\\frac{5 \\mathrm{R}}{36} \\mathrm{~cm}^{-1}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For Balmer $\\mathrm{n}_{1}=2$ and $\\mathrm{n}_{2}=3$; $v=R\\left(\\frac{1}{2^{2}}-\\frac{1}{3^{2}}\\right)=\\frac{5 R}{36} \\mathrm{~cm}^{-1}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7bd6f5bfc7ab78ae777", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 1, "question": {"text": "The wave number of the limiting line in Lyman series of hydrogen is $109678 \\mathrm{~cm}^{-1}$. The wave number of the limiting line in Balmer series of $\\mathrm{He}^{+}$ would be :", "image": null}, "options": [{"id": "c24Y0", "text": "$54839 \\mathrm{~cm}^{-1}$", "isCorrect": false, "image": null}, {"id": "W2Wdb", "text": "$109678 \\mathrm{~cm}^{-1}$", "isCorrect": true, "image": null}, {"id": "sAccw", "text": "$219356 \\mathrm{~cm}^{-1}$", "isCorrect": false, "image": null}, {"id": "vhE1G", "text": "$438712 \\mathrm{~cm}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\mathrm{R}_{\\mathrm{H}}=109678 \\mathrm{~cm}^{-1}$\r\n\r\nWave number of the limiting line in Balmer series of $\\mathrm{He}^{+}$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n=\\mathrm{R}_{\\mathrm{H}} \\cdot \\mathrm{Z}^{2}\\left[\\frac{1}{\\mathrm{n}_{1}^{2}}-\\frac{1}{\\mathrm{n}_{2}^{2}}\\right] \\\\\r\n\r\n=109678 \\times(2)^{2}\\left[\\frac{1}{[2)^{2}}-\\frac{1}{\\infty}\\right] \\\\\r\n\r\n=109678 \\mathrm{~cm}^{-1}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e8726f5bfc7ab78aee4a", "title": "Dual Behaviour of Matter and Heisenberg Uncertainty Principle", "totalQuestions": 6, "questions": [{"_id": "67726d14c49e8ef28ee2b417", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "If the de-broglie wavelength of a particle of mass $(m)$ is 100 times its velocity. Then, its value in terms of its mass $(m)$ and plank constant $(h)$ is", "image": null}, "options": [{"id": "QleKT", "text": "$\\frac{1}{10} \\sqrt{\\frac{m}{h}}$", "image": null, "isCorrect": false}, {"id": "u7STz", "text": "$10 \\sqrt{\\frac{h}{m}}$", "image": null, "isCorrect": true}, {"id": "n5FlA", "text": "$\\frac{1}{10} \\sqrt{\\frac{h}{m}}$", "image": null, "isCorrect": false}, {"id": "TQgcg", "text": "$10 \\sqrt{\\frac{m}{h}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the wavelength of given particle $=x$\nVelocity $(v)=\\frac{x}{100}$\nUsing wavelength formula\n$\\begin{aligned}\n \\lambda = \\frac{h}{m v} \\\\\n\\therefore &  x  =\\frac{h}{m\\left(\\frac{x}{100}\\right)} \\\\\nx & =\\frac{100 h}{m x} \\\\\nx^2 & =100 \\frac{h}{m} \\\\\n\\Rightarrow \\quad x & =10 \\sqrt{\\frac{h}{m}}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726cfac49e8ef28ee2b34f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "A stream of electrons from a heated filament was passed between two charged plates kept at a potential difference $V$ volt. If 'e' and $m$ are charge and mass of an electron, respectively, then the value of $h / \\lambda$ (where $\\lambda$ is wavelength associated with electron wave) is given by:", "image": null}, "options": [{"id": "9GzSu", "text": "$\\sqrt{m \\mathrm{e} V}$", "image": null, "isCorrect": false}, {"id": "RUhYI", "text": "$\\sqrt{2 m \\mathrm{e} V}$", "image": null, "isCorrect": true}, {"id": "YKeeu", "text": "$m \\mathrm{eV}$", "image": null, "isCorrect": false}, {"id": "kmzIN", "text": "$2 m \\mathrm{e} V$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As electron of charge ' $e$ ' is passed through ' $V$ ' volt, kinetic energy of electron will be eV .\nWavelength of electron wave $(\\lambda)=\\frac{h}{\\sqrt{2 m \\cdot \\mathrm{KE}}}$\n$\\lambda=-\\frac{h}{\\sqrt{2 m \\mathrm{eV}}} \\quad \\therefore \\frac{h}{\\lambda}=\\sqrt{2 m \\mathrm{eV}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726cfac49e8ef28ee2b34a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "A photon of wavelength $3000 Ã…$ strikes a metal surface. The work function of the metal is 2.13 eV. What is the kinetic energy of the emitted photoelectron?\n$\\left(\\mathrm{h}=6.626 \\times 10^{-34} \\mathrm{Js}\\right)$", "image": null}, "options": [{"id": "GLPNy", "text": "4.0 eV", "image": null, "isCorrect": false}, {"id": "F3PrJ", "text": "3.0 eV", "image": null, "isCorrect": false}, {"id": "BUY1H", "text": "2.0 eV", "image": null, "isCorrect": true}, {"id": "7LWFS", "text": "1.0 eV", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lambda=3000 Ã…=3 \\times 10^{-7} \\mathrm{~m}, \\phi=2.13 \\mathrm{eV}$\nK.E. $=h v-h v_0=h v-\\phi=\\frac{h c}{\\lambda}-\\phi$\n$=\\frac{\\left(6.626 \\times 10^{-34} \\times 3 \\times 10^8\\right)}{3 \\times 10^{-7}}-\\left(2.13 \\times 1.6 \\times 10^{-19}\\right)$\n$=\\frac{1.98 \\times 10^{-25}}{3 \\times 10^{-7}}-\\left(3.408 \\times 10^{-19}\\right)$\n$=\\left(6.60 \\times 10^{-19}\\right)-\\left(3.408 \\times 10^{-19}\\right)$\n$=3.192 \\times 10^{-19} \\mathrm{~J}=2.0 \\mathrm{eV}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8246f5bfc7ab78aeaf8", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "Calculate the wavelength (in nanometer) associated with a proton moving at $1.0 \\times 10^{3} \\mathrm{~ms}^{-1}$.\r\n(Mass of proton $=1.67 \\times 10^{-27} \\mathrm{~kg}$ and $\\left.\\mathrm{h}=6.63 \\times 10^{-34} \\mathrm{Js}\\right)$", "image": null}, "options": [{"id": "xmXQw", "text": "$0.40 \\mathrm{~nm}$", "isCorrect": true, "image": null}, {"id": "IaG6b", "text": "$2.5 \\mathrm{~nm}$", "isCorrect": false, "image": null}, {"id": "tTCKV", "text": "$14.0 \\mathrm{~nm}$", "isCorrect": false, "image": null}, {"id": "ba6wa", "text": "$0.32 \\mathrm{~nm}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\lambda &=\\frac{h}{m v}=\\frac{6.63 \\times 10^{-34}}{1.67 \\times 10^{-27} \\times 1 \\times 10^{3}} \\\\ &=3.97 \\times 10^{-10} \\text { meter }=0.397 \\text { nanometer } \\approx 0.40 \\mathrm{~nm} \\end{aligned}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f96f5bfc7ab78ae976", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 2, "question": {"text": "In an atom, an electron is moving with a speed of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>/</mo><mi mathvariant=\"normal\">s</mi></math> with an accuracy of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>005</mn><mo>%</mo></math>. Certainty with which the position of the electron can be located is (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">h</mi><mo>=</mo><mn>6</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>34</mn></mrow></msup><mo>&#160;</mo><mi>kg</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>, mass of electron,&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi></msub><mo>=</mo><mn>9</mn><mo>.</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>31</mn></mrow></msup><mo>&#160;</mo><mi>kg</mi></math>)", "image": null}, "options": [{"id": "FyL6D", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>52</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>", "isCorrect": false, "image": null}, {"id": "BDjgY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>10</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>", "isCorrect": false, "image": null}, {"id": "hCiJg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>92</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>", "isCorrect": true, "image": null}, {"id": "n6yk4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>.</mo><mn>84</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given that velocity of electron, <math><mi>v</mi><mo>=</mo><mn>600</mn><mi>&#160;</mi><mrow><mrow><mi>m</mi></mrow><mo>/</mo><mrow><mi>s</mi></mrow></mrow></math></p>Accuracy of velocity <math><mo>=</mo><mn>0.005</mn><mi>%</mi></math><br /><br />According to Heisenberg&#39;s uncertainty principle<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>&#916;x</mi></mfenced><mo>.</mo><mfenced><mi>m&#916;v</mi></mfenced><mo>=</mo><mfrac><mi mathvariant=\"normal\">h</mi><mrow><mn>4</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi mathvariant=\"normal\">v</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>005</mn><mo>%</mo></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>600</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><msup><mi mathvariant=\"normal\">s</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>600</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>005</mn></mrow><mn>100</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>03</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi mathvariant=\"normal\">x</mi><mo>&#215;</mo><mn>9</mn><mo>.</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>31</mn></mrow></msup><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>03</mn><mo>=</mo><mfrac><mrow><mn>6</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>34</mn></mrow></msup></mrow><mrow><mn>4</mn><mo>&#215;</mo><mn>3</mn><mo>.</mo><mn>14</mn></mrow></mfrac></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>x</mi><mo>=</mo><mfrac><mrow><mn>6</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>34</mn></mrow></msup></mrow><mrow><mn>4</mn><mo>&#215;</mo><mn>3</mn><mo>.</mo><mn>14</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>03</mn><mo>&#215;</mo><mn>9</mn><mo>.</mo><mn>1</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>31</mn></mrow></msup></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>.</mo><mn>92</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7e96f5bfc7ab78ae8ef", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 2, "question": {"text": "The orbital angular momentum of an electron is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">s</mi></math>&nbsp;orbital is", "image": null}, "options": [{"id": "bExRA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">h</mi><mrow><mn>4</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "fyr5L", "text": "zero", "isCorrect": true, "image": null}, {"id": "ypThc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">h</mi><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "sdvXp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt><mo>&#183;</mo><mfrac><mi mathvariant=\"normal\">h</mi><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>For <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">s</mi></math>-subshell&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">l</mi><mo>=</mo><mn>0</mn></math></p><p>Orbital angular momentum <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>mvr</mi><mo>)</mo><mo>=</mo><mfrac><mi mathvariant=\"normal\">h</mi><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac><msqrt><mi mathvariant=\"normal\">l</mi><mo>(</mo><mi mathvariant=\"normal\">l</mi><mo>+</mo><mn>1</mn><mo>)</mo></msqrt></math></p><p>For <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">s</mi></math> orbital, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">l</mi></math> (azimuthal quantum number) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> orbital angular momentum <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mi mathvariant=\"normal\">h</mi><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac><msqrt><mn>0</mn><mo>(</mo><mn>0</mn><mo>+</mo><mn>1</mn><mo>)</mo></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mi mathvariant=\"normal\">h</mi><mrow><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></mrow></mfrac><msqrt><mn>0</mn></msqrt><mo>=</mo><mn>0</mn></math></p><p>Thus,&nbsp;the orbital angular momentum of an electron in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">s</mi></math> -orbital is&nbsp;Zero.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64c0e8726f5bfc7ab78aee49", "title": "Quantum mechanical model", "totalQuestions": 4, "questions": [{"_id": "65b7b87c97ae24e9e2db8cd3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "Observe the given boundary surface diagrams of two orbitals I and II and choose the correct option.<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/GYKz3EmQr_n_fr0MOL35Bk2XhGlRzEASRkVOxdpcEBs.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "uu3T9", "text": "$\\mathrm{I}-d_{x^2-y^2}, \\mathrm{II}-d_{y z}$", "image": null, "isCorrect": false}, {"id": "xI8kp", "text": "$\\mathrm{I}-d_{y z}, \\mathrm{II}-d_{x^2-y^2}$", "image": null, "isCorrect": true}, {"id": "PtwyI", "text": "$\\mathrm{I}-d_{x z}, \\mathrm{II}-d_{z^2}$", "image": null, "isCorrect": false}, {"id": "Tyryh", "text": "$\\mathrm{I}-d_{x y}, \\mathrm{II}-d_{x z}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In boundary surface diagram (1) the four lobes lie between $y$ and $z$-axis $\\left(d_{y z}\\right)$ whereas, in boundary surface diagram (2) the four lobes lie on the $x$ and $y$-axis $\\left(d_{x^2-y^2}\\right)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87397ae24e9e2db8c71", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "The probability density plots of $1 s$ and $2 s$ orbitals are given in figure.<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/KW6UlqtmYx8qU0E2Ze00YtyIq-_2FHH_3i0-1RRE1OQ.original.fullsize.png\"><br><br />The density of dots in a region represents the probability density of finding electrons in the region.<br />On the basis of above diagram which of the following statements is incorrect?", "image": null}, "options": [{"id": "s7owm", "text": "$1 s$ and $2 s$ orbitals are spherical in shape.", "image": null, "isCorrect": false}, {"id": "8QwEZ", "text": "The probability of finding the electron is maximum near the nucleus.", "image": null, "isCorrect": false}, {"id": "sfXQT", "text": "The probability of finding the electron at a given distance is equal in all directions.", "image": null, "isCorrect": false}, {"id": "rPe7y", "text": "The probability density of electrons for $2 s$ orbital decreases uniformly as distance from the nucleus increases.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The probability density of electrons in $2 s$ orbital first increases then decreases and after that it increases again as di (correct),</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7dd6f5bfc7ab78ae887", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 1, "question": {"text": "An e $^{-}$ has magnetic quantum number as $-3,$ what is its principal quantum number?", "image": null}, "options": [{"id": "rM2fc", "text": "1", "isCorrect": false, "image": null}, {"id": "QWX0Z", "text": "2", "isCorrect": false, "image": null}, {"id": "nungC", "text": "3", "isCorrect": false, "image": null}, {"id": "pFU5M", "text": "4", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "When $m=-3, l=3, \\therefore \\mathrm{n}=4$.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "64c0e8726f5bfc7ab78aee46", "title": "Electronic configuration", "totalQuestions": 2, "questions": [{"_id": "64c0e8246f5bfc7ab78aeaf4", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "The difference in the number of unpaired electron "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
