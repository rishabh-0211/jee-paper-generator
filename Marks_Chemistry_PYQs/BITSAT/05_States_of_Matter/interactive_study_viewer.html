&#160;</mo><mi>atm</mi></math> pressure</p><p>Which of the above gases is kept at highest temperature.</p>", "image": null}, "options": [{"id": "u8SaR", "text": "Gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">A</mi><mo>)</mo></math>", "isCorrect": true, "image": null}, {"id": "yaDYO", "text": "Gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">B</mi><mo>)</mo></math>", "isCorrect": false, "image": null}, {"id": "ek0AJ", "text": "Gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">C</mi><mo>)</mo></math>", "isCorrect": false, "image": null}, {"id": "w7325", "text": "Gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">D</mi><mo>)</mo></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo></math> For ideals gas</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>pV</mi><mo>=</mo><mi>nRT</mi></math></p><p>or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mfrac><mi>pV</mi><mi>nR</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>1</mn><mo>=</mo></math> constant</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>083</mn><mo>=</mo></math> constant</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">T</mi><mo>&#8733;</mo><mi>PV</mi></math></p><p>Thus,&nbsp;</p><p>The gas that shows highest product of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi><mo>&#215;</mo><mi mathvariant=\"normal\">V</mi></math>, has highest temperature.</p><p>for<br />(A) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi><mo>&#215;</mo><mi mathvariant=\"normal\">V</mi><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>5</mn><mo>=</mo><mn>10</mn><mo>&#160;</mo><mi>atm</mi><mo>&#160;</mo><mi mathvariant=\"normal\">L</mi></math></p><p>(B) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi><mo>&#215;</mo><mi mathvariant=\"normal\">V</mi><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>2</mn><mo>.</mo><mn>5</mn><mo>=</mo><mn>5</mn><mo>&#160;</mo><mi>atmL</mi></math></p><p>(C) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi><mo>&#215;</mo><mi mathvariant=\"normal\">V</mi><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>1</mn><mo>.</mo><mn>25</mn><mo>=</mo><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>atmL</mi><mo>&#8201;</mo></math></p><p>(D) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi><mo>&#215;</mo><mi mathvariant=\"normal\">V</mi><mo>=</mo><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><mn>2</mn><mo>.</mo><mn>5</mn><mo>=</mo><mn>6</mn><mo>.</mo><mn>25</mn><mo>&#160;</mo><mi>atm</mi><mo>&#160;</mo><mi mathvariant=\"normal\">L</mi></math></p><p>Hence gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">A</mi><mo>)</mo></math> show highest temperature.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e85e6f5bfc7ab78aed64", "title": "Mixture of gases", "totalQuestions": 1, "questions": [{"_id": "64c0e7dd6f5bfc7ab78ae888", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "At what temperature, the rate of effusion of $\\mathrm{N}_{2}$ would be 1.625 times than that of $\\mathrm{SO}_{2}$ at $50^{\\circ} \\mathrm{C}$ ?", "image": null}, "options": [{"id": "pSr3O", "text": "$110 \\mathrm{~K}$", "isCorrect": false, "image": null}, {"id": "mLYeK", "text": "$173 \\mathrm{~K}$", "isCorrect": false, "image": null}, {"id": "sOXpl", "text": "$373 \\mathrm{~K}$", "isCorrect": true, "image": null}, {"id": "izzIZ", "text": "$273 \\mathrm{~K}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\quad r \\propto U$ and $U=\\sqrt{\\frac{3 R T}{\\text { M }}}$\r\n\r\n$\\frac{\\mathrm{r}_{1}}{\\mathrm{r}_{2}}=\\sqrt{\\frac{\\mathrm{T}_{1} \\mathrm{M}_{2}}{\\mathrm{~T}_{2} \\mathrm{M}_{1}}}$ or $\\frac{\\mathrm{r}_{\\mathrm{N}_{2}}}{\\mathrm{r}_{\\mathrm{SO}_{2}}}=\\sqrt{\\frac{\\mathrm{T}_{1} \\times 64}{323 \\times 28}}=1.625$\r\n\r\nor $\\mathrm{T}_{2}=373 \\mathrm{~K}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e85e6f5bfc7ab78aed63", "title": "Kinetic theory of gases", "totalQuestions": 3, "questions": [{"_id": "65b7b87397ae24e9e2db8c79", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "Kinetic theory of gases proves", "image": null}, "options": [{"id": "HYGTb", "text": "only Boyle's law", "image": null, "isCorrect": false}, {"id": "7LgVF", "text": " only Charles' law", "image": null, "isCorrect": false}, {"id": "Eblnd", "text": "only Avogadro's law", "image": null, "isCorrect": false}, {"id": "oKakl", "text": "all of these", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Kinetic theory of gases proves all the given gas laws.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7de6f5bfc7ab78ae889", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 2, "question": {"text": "The average kinetic energy of an ideal gas per molecule in SI unit at $25^{\\circ} \\mathrm{C}$ will be", "image": null}, "options": [{"id": "Q72kB", "text": "$6.17 \\times 10^{-21} \\mathrm{~kJ}$", "isCorrect": false, "image": null}, {"id": "5SIUT", "text": "$6.17 \\times 10^{-21} \\mathrm{~J}$", "isCorrect": true, "image": null}, {"id": "i2xoG", "text": "$6.17 \\times 10^{-20} \\mathrm{~J}$", "isCorrect": false, "image": null}, {"id": "OfncO", "text": "$7.16 \\times 10^{-20} \\mathrm{~J}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\overline{\\mathrm{KE}}=\\frac{3}{2} \\mathrm{kT}=\\frac{3}{2} \\times \\frac{8.313}{6.023 \\times 10^{23}} \\times 298=6.17 \\times 10^{-21} \\mathrm{~J}$\r\n\r\n(Average Kinetic energy $\\left.\\overline{\\mathrm{KE}}=\\frac{3}{2} \\mathrm{k} \\mathrm{T}=\\frac{3}{2} \\frac{\\mathrm{R}}{\\mathrm{N}} \\mathrm{T}\\right)$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b06f5bfc7ab78ae6ff", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 1, "question": {"text": "Increasing order of rms velocities of $\\mathrm{H}_{2}, \\mathrm{O}_{2}, \\mathrm{~N}_{2}$ and $\\mathrm{HBr}$ is", "image": null}, "options": [{"id": "U1Ltq", "text": "$\\mathrm{H}_{2}>\\mathrm{O}_{2}>\\mathrm{N}_{2}>\\mathrm{HBr}$", "isCorrect": false, "image": null}, {"id": "XuEMf", "text": "$\\mathrm{HBr}<\\mathrm{O}_{2}<\\mathrm{N}_{2}<\\mathrm{H}_{2}$", "isCorrect": true, "image": null}, {"id": "XkAMi", "text": "$\\mathrm{H}_{2}>\\mathrm{N}_{2}<\\mathrm{O}_{2}>\\mathrm{HBr}$", "isCorrect": false, "image": null}, {"id": "kV6Yd", "text": "$\\mathrm{HBr}>\\mathrm{N}_{2}<\\mathrm{O}_{2}<\\mathrm{H}_{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "RMS velocity of molecules depends on mass. If mol. wt. increases, rms velocity of melocules decreases. $\\mathrm{rms} \\propto \\frac{1}{\\sqrt{\\mathrm{m} \\cdot \\mathrm{wt}}}$\r\n\r\nThe order of increasing $\\mathrm{m} . \\mathrm{wt}$. is\r\n\r\n$\\mathrm{H}_{2}<\\mathrm{N}_{2}<\\mathrm{O}_{2}<\\mathrm{HBr}$\r\n\r\nOrder of $V_{\\mathrm{mx}}$ of molecules. $\\mathrm{HBr}<\\mathrm{O}_{2}<\\mathrm{N}_{2}<\\mathrm{H}_{2}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e85e6f5bfc7ab78aed61", "title": "Real Gases and Van der Waal's Equation", "totalQuestions": 3, "questions": [{"_id": "65b7b87d97ae24e9e2db8cda", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "In van der Waal's equation of state for a nonideal gas, the term that accounts for intermolecular forces is", "image": null}, "options": [{"id": "maq76", "text": "$(V-b)$", "image": null, "isCorrect": false}, {"id": "ZbYry", "text": "$R T$", "image": null, "isCorrect": false}, {"id": "GpdVO", "text": "$\\left(P+\\frac{a}{V^2}\\right)$", "image": null, "isCorrect": true}, {"id": "9LKWC", "text": "$(R T)^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\left(P+\\frac{a}{V^2}\\right)(V-b)=R T$; Here $\\left(P+\\frac{a}{V^2}\\right)$ represents the intermolecular forces.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8326f5bfc7ab78aeb6e", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 3, "question": {"text": "The given graph represents the variation of compressibility factor $(Z)=\\frac{p V}{n R T}$, for three real gases $A, B$ and $C$. Identify the only incorrect statement.\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/oyRA5keONN_o_pg7YjXunRyP45aYxtUbrNo4PgoPv30.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "ynZRD", "text": "\r\nFor the gas $A, a=0$ and its dependence on $p$ is linear at all pressure.\r\n", "isCorrect": false, "image": null}, {"id": "8iNMQ", "text": "\r\nFor the gas $B, b=0$ and its dependence on $p$ is linear at all pressure.\r\n", "isCorrect": true, "image": null}, {"id": "BOvnE", "text": "\r\nFor the gas $C$, which is typical real gas for which neither. $a$ nor $b=0$. By knowing the minima and point of the intersection, with $Z=1, a$ and $b$ can be calculated.\r\n", "isCorrect": false, "image": null}, {"id": "5vA0X", "text": "\r\nAt high pressure the slope is positive for all real gases.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "From the graph it is clear that, the value of ' $Z$ ' decreases with increase of pressure. We can explain as follows on the basis of van der Waals' equation.\r\nAt high pressure, when ' $p$ ' is large, $V$ will be small and one cannot ignore ' $b$ ' in comparison to $V$. However, the team $a / V^2$ may be considered negligible in comparison to ' $p$ ' in van der Waals' equation.\r\n$\\left(p+\\frac{a}{V^2}\\right)(V-b)=n R T$\r\n$p(V-b)=n R T$\r\n$\\Rightarrow \\quad p V-p b=n R T$\r\nor    $\\frac{p V}{n R T}=1+\\frac{p b}{n R T}$\r\nor $Z=1+\\frac{p b}{n R T}$\r\nThus, $Z$ is greater than 1. As pressure is increased (at constant $T$ ), the factor $\\frac{p b}{n R T}$ increases. This explains why after minima in the curves, $Z$ increase continuously with pressure. Hence, the only incorrect statement is (b).", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef33 "singleCorrect", "level": 2, "question": {"text": "How will raise in temperature affects the viscosity of liquids and gases?", "image": null}, "options": [{"id": "7kdb5", "text": "\r\nBoth increases\r\n", "isCorrect": false, "image": null}, {"id": "akKfT", "text": "\r\nBoth decreases\r\n", "isCorrect": true, "image": null}, {"id": "PPUF7", "text": "\r\nIn case of liquids, decreases and in case of gases, increases.\r\n", "isCorrect": false, "image": null}, {"id": "EqHC5", "text": "\r\nIn case of liquid, increases and in case of gases, decreases.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In case of liquids, cohesive forces decrease and hence, their viscosity decreases while increasing the temperature.\r\nHowever, in case of gases, with the increase in temperature kinetic energy of gaseous molecules increases and the molecules become more mobile.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7f76f5bfc7ab78ae96b", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 2, "question": {"text": "Four gases <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Q</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">R</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> have almost same values of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">b</mi></mat     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
