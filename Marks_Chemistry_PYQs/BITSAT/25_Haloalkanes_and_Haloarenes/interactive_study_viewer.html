": "$\\mathrm{S}_{\\mathrm{N}} 2$ mechanism is followed in case of primary and secondary halides i.e., $\\mathrm{S}_{\\mathrm{N}}^{2}$ reaction is favoured by small groups on the carbon atom attached to halogens so\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/UxGpTB0zlK2tNKPe8q7QtZVHOXwWyjcPieTaY2aLHc4.original.fullsize.png\">", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7946f5bfc7ab78ae61b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "Which of the following is not considered as an organometallic compound?", "image": null}, "options": [{"id": "K1b6S", "text": "cis-platin", "image": null, "isCorrect": true}, {"id": "efUDX", "text": "Ferrocene", "image": null, "isCorrect": false}, {"id": "tFo3U", "text": "Zeise's salt", "image": null, "isCorrect": false}, {"id": "kYvc9", "text": "Grignard reagent", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The structural formula of cis-platin is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/2HhDl9zEykihnvpLm1nM8qK_H2YN2VpKmNjtcXeUCP0.original.fullsize.png\"><br>\nSince no carbon is involved it is not a\norganometallic compound.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7876f5bfc7ab78ae5a1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "Match List I (Reaction) with List II (Reagent) and select the correct answer using the codes given below the lists:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/8hVpQ4ARAN3Q9tIOSzpXg0LxITwnkhyilk1Ki2kFkt0.original.fullsize.png\">", "image": null}, "options": [{"id": "CCnjS", "text": "$\\quad \\mathrm{I}-\\mathrm{A}, \\mathrm{II}-\\mathrm{B}, \\mathrm{III}-\\mathrm{C}, \\mathrm{IV}-\\mathrm{B}$", "image": null, "isCorrect": false}, {"id": "JQBG8", "text": "$\\quad \\mathrm{I}-\\mathrm{D}, \\mathrm{II}-\\mathrm{C}, \\mathrm{III}-\\mathrm{A}, \\mathrm{IV}-\\mathrm{B}$", "image": null, "isCorrect": false}, {"id": "MlhPW", "text": "$\\quad \\mathrm{I}-\\mathrm{C}, \\mathrm{II}-\\mathrm{D}, \\mathrm{III}-\\mathrm{A}, \\mathrm{IV}-\\mathrm{B}$", "image": null, "isCorrect": true}, {"id": "qHGB0", "text": "$\\quad \\mathrm{I}-\\mathrm{B}, \\mathrm{II}-\\mathrm{A}, \\mathrm{III}-\\mathrm{D}, \\mathrm{IV}-\\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7876f5bfc7ab78ae5a0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "In which of the following conversions, phosphorus pentachloride is used as the reagent?", "image": null}, "options": [{"id": "WcZZ9", "text": "$\\mathrm{H}_{2} \\mathrm{C}=\\mathrm{CH}_{2} \\longrightarrow \\mathrm{CH}_{3} \\mathrm{CH}_{2} \\mathrm{Cl}$", "image": null, "isCorrect": false}, {"id": "z86MR", "text": "$\\mathrm{CH}_{3} \\mathrm{CH}_{2} \\mathrm{OH} \\longrightarrow \\mathrm{CH}_{3} \\mathrm{CH}_{2} \\mathrm{Cl}$", "image": null, "isCorrect": true}, {"id": "WT87l", "text": "$\\mathrm{H}_{3} \\mathrm{C}-\\mathrm{O}-\\mathrm{CH}_{3} \\longrightarrow \\mathrm{CH}_{3} \\mathrm{Cl}$", "image": null, "isCorrect": false}, {"id": "BYiB2", "text": "$\\mathrm{CH} \\equiv \\mathrm{CH} \\longrightarrow \\mathrm{CH}_{2}=\\mathrm{CHCl}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When ethyl alcohol is treated with $\\mathrm{PCl}_{5}$, then ethyl chloride is formed.\n$$\n\\begin{aligned}\n\\mathrm{CH}_{3} \\mathrm{CH}_{2}-\\mathrm{OH} &+\\mathrm{PCl}_{5} \\longrightarrow_{\\Delta} \\\\\n& \\mathrm{CH}_{3} \\mathrm{CH}_{2}-\\mathrm{Cl}+\\mathrm{HCl}+\\mathrm{POCl}_{3}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7796f5bfc7ab78ae522", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "Which of the following order is not correct?", "image": null}, "options": [{"id": "pdB5X", "text": "$\\mathrm{MeBr}>\\mathrm{Me}_{2} \\mathrm{CHBr}>\\mathrm{Me}_{3} \\mathrm{CBr}>$\n$\\mathrm{Et}_{3} \\mathrm{CBr}\\left(\\mathrm{S}_{\\mathrm{N}} 2\\right)$", "image": null, "isCorrect": false}, {"id": "sf0yF", "text": "$\\mathrm{Me}_{3} \\mathrm{CBr}>\\mathrm{Me}_{2} \\mathrm{CHBr}>\\mathrm{Me}_{2} \\mathrm{CH.CH}_{2} \\mathrm{Br}>$\n$\\mathrm{MeCH}_{2} \\mathrm{CH}_{2} \\mathrm{CH}_{2} \\mathrm{Br} .\\left(\\mathrm{E}_{2}\\right)$", "image": null, "isCorrect": false}, {"id": "l5cMH", "text": "$\\mathrm{PhCH}_{2} \\mathrm{Br}>\\mathrm{Ph} \\mathrm{CHBrMe}>\\mathrm{PhCBrMe}_{2}>$\n$\\operatorname{PhCBrMePh}\\left(\\mathrm{S}_{\\mathrm{N}} 1\\right)$", "image": null, "isCorrect": true}, {"id": "WPDXV", "text": "$\\mathrm{MeI}>\\mathrm{MeBr}>\\mathrm{MeCl}>\\mathrm{MeF}\\left(\\mathrm{S}_{\\mathrm{N}} 2\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The more is the stability of intermediate carbonium ion, the more is the chance of $\\mathrm{S}_{\\mathrm{N}} 1$ mechanism. The intermediates obtained will be \n$\\mathrm{Ph}^{+} \\mathrm{C} \\mathrm{H}_{2}(\\mathrm{i}), \\mathrm{Ph} \\mathrm{C} \\mathrm{H}-\\mathrm{Me}(\\mathrm{ii})$\n$\\mathrm{Ph} \\mathrm{C}-\\mathrm{Me}_{2}\\left(\\right.$ iii) $, \\mathrm{Ph} \\mathrm{C}^{+} \\mathrm{MePh}$ (iv)\nThe stabilty is of the order iv $>\\mathrm{iii}>\\mathrm{ii}>\\mathrm{i}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64c0e8646f5bfc7ab78aeda3", "title": "Preparation and Properties of Aryl Halides", "totalQuestions": 5, "questions": [{"_id": "64c0e8316f5bfc7ab78aeb66", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 1, "question": {"text": "The reaction of $\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{CH}=\\mathrm{CHCH}_3$ with $\\mathrm{HBr}$ produces", "image": null}, "options": [{"id": "KEeuQ", "text": "\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/sM8g3R2Lowv8hh07ko9elgOQu8s2lyEEt60k0gXDo60.original.fullsize.png\"><br>", "isCorrect": true, "image": null}, {"id": "fZa5a", "text": "\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/d2t-MC2jj-ALM5nfME5ftFVvnn28HrUdGnUm8HNvJWM.original.fullsize.png\"><br>", "isCorrect": false, "image": null}, {"id": "WjQJU", "text": "\r\n$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{CH}_2 \\mathrm{CH}_2 \\mathrm{Br}$\r\n", "isCorrect": false, "image": null}, {"id": "75aGI", "text": "\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/mu9NY6eP_5X7LZJgV6EEj0Axi2Tgc5lL7pStXK1ERqg.original.fullsize.png\"><br>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/QtPBDHH146Bbfl6e2FuBdjGhqPN9E0mPdeTjU1smme8.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/wHeqdZihl5o9_Ax_v4OvyRkdpwtULxXoqTnVWLhrzqw.original.fullsize.png\"><br>\r\nElectrophile addition reaction takes place via more stable carbocation.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8306f5bfc7ab78aeb62", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 2, "question": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/hs4XCQ7UFH1jYRDYHpqtvN3srjw6zADAKBZIWyQRMpY.original.fullsize.png\"><br>\r\n$X$ and $Y$ are", "image": null}, "options": [{"id": "WzbIS", "text": "\r\nbenzene, benzaldehyde\r\n", "isCorrect": false, "image": null}, {"id": "a7laV", "text": "\r\ntoluene, benzaldehyde\r\n", "isCorrect": false, "image": null}, {"id": "Qa5XC", "text": "\r\ntoluene, benzoic acid\r\n", "isCorrect": true, "image": null}, {"id": "PhDRD", "text": "\r\nbenzene, benzoic acid", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/5DtYD9iruTrF63mNJeutms9Acnenh0RRXrFy3Y_LoC4.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8096f5bfc7ab78aea0b", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Identify compound <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">C</mi></mfenced></math> in the following reaction</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>7</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>8</mn></msub><mover><mo>&#8594;</mo><mrow><mn>3</mn><msub><mi>Cl</mi><mn>2</mn></msub><mo>/</mo><mi mathvariant=\"normal\">&#916;</mi></mrow></mover><mfenced><mi mathvariant=\"normal\">A</mi></mfenced><mover><mo>&#8594;</mo><mrow><msub><mi>Br</mi><mn>2</mn></msub><mo>/</mo><mi>Fe</mi></mrow></mover><mfenced><mi mathvariant=\"normal\">B</mi></mfenced><mover><mo>&#8594;</mo><mrow><mi>Zn</mi><mo>/</mo><mi>HCl</mi></mrow></mover><mfenced><mi mathvariant=\"normal\">C</mi></mfenced></math></p>", "image": null}, "options": [{"id": "YB36l", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">o</mi></math>-bromotoluene", "isCorrect": false, "image": null}, {"id": "X7Nv8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>-bromotoluene", "isCorrect": true, "image": null}, {"id": "26dP6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi></math>-bromotoluene", "isCorrect": false, "image": null}, {"id": "mZa7D", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>-bromo, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>4</mn><mo>,</mo><mo>&#160;</mo><mn>6</mn></math> trichlorotoluene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Side chain hydrogen atoms are substituted by halogens in presence of light or heat by free radical mechanism. Ring hydrogens are substituted in presence of Lewis acid by electrofile. Alkyl halide (R-X) are reduced by Zn/HCl into alkane.</p><p>The degree of unsaturation for compound <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>7</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>8</mn></msub></math> is three&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>3</mn></mfenced></math>, as it reacts with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Cl</mi><mn>2</mn></msub><mo>/</mo><mi mathvariant=\"normal\">&#916;</mi><mo>.</mo></math> Hence <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>7</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>8</mn></msub></math> is toluene, i.e <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>6</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub><mo>.</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>.</mo></math> The whole reaction occurs as follows:</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/b5ccc3ad-260d-4c39-98bf-fbb659318bee-image.png\" style=\"width: 742px; height: 198px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8086f5bfc7ab78ae9fb", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>In the reaction <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">X</mi></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">Y</mi></mfenced></math> are respectively.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/e84e7933-f335-46c9-ba6c-e10d6c38ff10-4c85ae67-614f-4990-a868-28821819c8d3-image.png\" style=\"width: 677px; height: 163px;\" /></p>", "image": null}, "options": [{"id": "apGjb", "text": "<img height=\"179\" src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/58825c06-434a-4693-9333-1ad3c3914bbf-image.png\" width=\"272\" />", "isCorrect": false, "image": null}, {"id": "uEbdi", "text": "<img height=\"169\" src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/e7f0f7d7-c00b-497a-877e-356e49cbfc65-image.png\" width=\"254\" />", "isCorrect": true, "image": null}, {"id": "euOIF", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/c2536ab8-2613-42a3-9a44-8968003c8c45-image.png\" style=\"width: 317px; height: 168px;\" />", "isCorrect": false, "image": null}, {"id": "vKFh4", "text": "<img height=\"164\" src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/fbd04f9f-f710-432d-ac26-a479fd2d4dce-image.png\" width=\"343\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The given reaction is for preparation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>DDT</mi></math> (dichlorodiphenyl trichloroethane). Complete reaction is given as follows.</p><p>(i)</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/c49419d1-5434-42c7-b515-e22645f3c73a-image.png\" style=\"width: 300px; height: 130px;\" /></p><p>(ii)&nbsp;<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/230d6a1e-e8e5-4e0d-9c43-c0793d7fc9ca-image.png\" style=\"width: 500px; height: 97px;\" /></p><p>Dichloro-diphenyl-trichloroethane (DDT) is prepared by heating chloral and chlorobenzene in 1:2 ratio in the presence of conc. sulphuric acid.</p><p>DDT is used as an insecticide. It is also used as a mosquito repellant.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ed6f5bfc7ab78ae912", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Chlorobenzene</mi><mover><mo>&#8594;</mo><mrow><mi>Reaction</mi><mo>-</mo><mo>(</mo><mi mathvariant=\"normal\">X</mi><mo>)</mo></mrow></mover><mi>Phenol</mi><mover><mo>&#8594;</mo><mrow><mi>Reaction</mi><mo>-</mo><mo>(</mo><mi mathvariant=\"normal\">Y</mi><mo>)</mo></mrow></mover><mi>Salicylaldehyde</mi></math>.</p><p>The reactions(s) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi mathvariant=\"normal\">X</mi><none></none><mo>&#39;</mo><mprescripts></mprescripts><none></none><mo>&#39;</mo></mmultiscripts></math> and<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi mathvariant=\"normal\">Y</mi><none></none><mo>&#39;</mo><mprescripts></mprescripts><none></none><mo>&#39;</mo></mmultiscripts></math> respectively are</p>", "image": null}, "options": [{"id": "7Sm9G", "text": "Fries rearrangement and Kolbe", "isCorrect": false, "image": null}, {"id": "Upk0j", "text": "Cumene and Reimer-Tiemann", "isCorrect": false, "image": null}, {"id": "SpD9l", "text": "Dow and Reimer-Tiemann", "isCorrect": true, "image": null}, {"id": "Hydca", "text": "Dow and Sandmeyer.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Phenol is manufactured by heating chlorobenzene with 10% aqueous NaOH solution at about 623K under 300 atm and in the presence of copper salt acting as a catalyst to form sodium phenoxide. The sodium salt when treated with dil. HCl, gives phenol. This method is known as Dow&#39;s process.&nbsp;</p><p>When phenol is heated with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CHCl</mi><mn>3</mn></msub></math>&nbsp;in the presence of aqueous&nbsp;NaOH, an aldehydic group&nbsp;(&minus;CHO)&nbsp;get introduced in the ring at a position ortho to the phenolic group. This reaction is known as the Reimer-Tiemann reaction.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/6d6bb09a-1ad7-45bc-911a-55f8587d5688-image.png\" style=\"width: 450px; height: 163px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
