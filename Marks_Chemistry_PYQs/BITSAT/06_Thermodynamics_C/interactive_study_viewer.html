}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8266f5bfc7ab78aeb03", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}], "type": "singleCorrect", "level": 2, "question": {"text": "Work out the heat change (cal) when $40 \\mathrm{~g}$ of He gas at $27^{\\circ} \\mathrm{C}$ undergoes isothermal and reversible compression from initial pressure of $1 \\mathrm{~atm}$ to $10 \\mathrm{~atm}\\left(\\mathrm{R}=2 \\mathrm{cal} \\mathrm{K}^{-1} \\mathrm{~mol}^{-1}\\right)$.", "image": null}, "options": [{"id": "rADan", "text": "$13.818 \\mathrm{kcal}$", "isCorrect": false, "image": null}, {"id": "q3ptr", "text": "$-13.818 \\mathrm{kcal}$", "isCorrect": true, "image": null}, {"id": "BovMP", "text": "$55.272 \\mathrm{kcal}$", "isCorrect": false, "image": null}, {"id": "aFrHi", "text": "$-55.272 \\mathrm{k} \\mathrm{cal}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{q} &=-\\mathrm{w}_{\\mathrm{rev}}=-\\left(-2.303 \\mathrm{nRT} \\log \\frac{\\mathrm{P}_{1}}{\\mathrm{P}_{2}}\\right) \\\\ &=2.303 \\times \\frac{40}{4} \\times 2 \\times 300 \\log \\frac{1}{10}=-13.82 \\mathrm{kcal} \\end{aligned}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021", "title": "BITSAT 2021"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8156f5bfc7ab78aea72", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "For the combustion reaction at $298 \\mathrm{~K}$\r\n\r\n$2 \\mathrm{Ag}(\\mathrm{s})+1 / 2 \\mathrm{O}_{2}(\\mathrm{~g}) \\longrightarrow 2 \\mathrm{Ag}_{2} \\mathrm{O}(\\mathrm{s})$\r\n\r\nWhich of the following alternatives is correct?", "image": null}, "options": [{"id": "qHouN", "text": "$\\Delta \\mathrm{H}=\\Delta \\mathrm{U}$", "isCorrect": false, "image": null}, {"id": "SHrgf", "text": "$\\Delta \\mathrm{H}>\\Delta \\mathrm{U}$", "isCorrect": false, "image": null}, {"id": "sLO6E", "text": "$\\Delta \\mathrm{H}<\\Delta \\mathrm{U}$", "isCorrect": true, "image": null}, {"id": "7qeiE", "text": "$\\Delta \\mathrm{H}$ and $\\Delta \\mathrm{U}$ has no relation with each other", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\Delta \\mathrm{H}=\\Delta \\mathrm{U}+\\Delta \\mathrm{nRT}$\r\n\r\n$\\Delta \\mathrm{n}=\\mathrm{n}_{\\mathrm{p}}-\\mathrm{n}_{\\mathrm{R}}$\r\n\r\nNow, $\\Delta \\mathrm{n}=2-\\frac{5}{2}=-\\frac{1}{2}$\r\n\r\n$\\therefore \\Delta \\mathrm{H}=\\Delta \\mathrm{U}-\\frac{1}{2} \\mathrm{RT}$\r\n\r\nThus, $\\Delta \\mathrm{U}=\\Delta \\mathrm{H}+\\frac{1}{2} \\mathrm{RT}$\r\n\r\n$\\therefore \\Delta \\mathrm{U}>\\Delta \\mathrm{H}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8146f5bfc7ab78aea69", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "Acyclicprocess ABCD is shown in P-V diagram for an ideal gas. Which of the following diagram represents the same process?\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/Io-ECzOyZ8Mm11B5M1o-EN9YogdjX7drMMTegfwXna4.original.fullsize.png\">", "image": null}, "options": [{"id": "fIQUg", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/ufgIRqkqvYWp6MHKqSBWCZsRot5KsMfFIrBU4qItnCg.original.fullsize.png\">", "isCorrect": false, "image": null}, {"id": "lGIZU", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/TBXDMwDKS0B6ay7uFQZ3aj6kgPoedwdcNfQIMpc84_8.original.fullsize.png\">", "isCorrect": false, "image": null}, {"id": "KOZIH", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/KgORLGc83p7mbv7B0RjewhNmnQY76aU2H5bsLrYEUgw.original.fullsize.png\">", "isCorrect": true, "image": null}, {"id": "rZLws", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/sSvtephfcStXCy1sxGZuGycChz7RM96W095eBLY4-78.original.fullsize.png\">", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\mathrm{AB}$ : Isobaric expansion \r\n\r\n$\\mathrm{BC}:$ Isothermal expansion\r\n\r\nCD : Isochoric\r\n\r\nDA: Isothermal compression", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7846f5bfc7ab78ae589", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}], "question": {"text": "At a constant volume the specific heat of a gas is 0.075 and its molecular weight is $40 .$ The gas is:", "image": null}, "options": [{"id": "aFwZp", "text": "Monoatomic", "image": null, "isCorrect": true}, {"id": "iwxOe", "text": "Diatomic", "image": null, "isCorrect": false}, {"id": "Rcqah", "text": "Triatomic", "image": null, "isCorrect": false}, {"id": "jqkYJ", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & q=\\frac{c}{m} \\\\ & \\Rightarrow C_{v}=q \\times m \\\\ &=0.075 \\times 40 \\\\ &=3.0 \\mathrm{cal} \\\\ & C_{P}-C_{v}=R \\\\ & C_{P}=C_{V}+R \\\\ &=3+2=5 \\\\ & \\frac{C_{P}}{C_{V}}=\\frac{5}{3}=1.66 \\end{aligned}$\nMonoatomic gas", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d74", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "BITSAT 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7766f5bfc7ab78ae509", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "One mole of an ideal gas at $300 \\mathrm{~K}$ is expanded isothermally from an initial volume of 1 litre to 10 litres. The $\\Delta \\mathrm{E}$ for this process is $\\left(\\mathrm{R}=2\\right.$ cal $\\left.\\mathrm{mol}^{-1} \\mathrm{~K}^{-1}\\right)$", "image": null}, "options": [{"id": "4RJw1", "text": "$163.7 \\mathrm{cal}$", "image": null, "isCorrect": false}, {"id": "KGhvK", "text": "zero", "image": null, "isCorrect": true}, {"id": "8xkaT", "text": "$1381.1 \\mathrm{cal}$", "image": null, "isCorrect": false}, {"id": "PR4eP", "text": "9 lit atom", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For isothermal process, $\\Delta \\mathrm{E}=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7766f5bfc7ab78ae508", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "Which one of the following is correct regarding $\\Delta \\mathrm{H}:$", "image": null}, "options": [{"id": "m0Hmm", "text": "$\\quad \\Delta \\mathrm{H}=\\Delta \\mathrm{E}+2 \\mathrm{RT}$", "image": null, "isCorrect": false}, {"id": "r2Qx8", "text": "$\\quad \\Delta \\mathrm{H}=\\Delta \\mathrm{E}-2 \\mathrm{RT}$", "image": null, "isCorrect": true}, {"id": "5HKJc", "text": "$\\Delta \\mathrm{H}=\\Delta \\mathrm{E}+\\mathrm{RT}$", "image": null, "isCorrect": false}, {"id": "YU3Xb", "text": "$\\quad \\Delta \\mathrm{H}=\\Delta \\mathrm{E}-\\mathrm{RT}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{N}_{2}+3 \\mathrm{H}_{2} \\rightleftharpoons 2 \\mathrm{NH}_{3}$\nAccording to thermodynamics's Ist law\n$$\n\\Delta \\mathrm{H}=\\Delta \\mathrm{E}+\\mathrm{nRT}\n$$\nWhere $\\Delta \\mathrm{H}=$ enthalpy of reaction at constant pressure $\\Delta \\mathrm{E}=$ heat of reaction at constant volume $\\mathrm{R}=$ molar gas constant\n$$\n\\begin{array}{l}\n\\mathrm{T}=\\text { temperature of the reaction } \\\\\n\\mathrm{n}=(\\text { no. of moles of product })-(\\text { no. of moles }\n\\end{array}\n$$\nof reactant.) From reaction, $\\mathrm{n}=\\mathrm{n}_{\\mathrm{p}}-\\mathrm{n}_{\\mathrm{R}}=2-4=-2$\nHence, $\\Delta \\mathrm{H}=\\Delta \\mathrm{E}-2 \\mathrm{RT}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64c0e85f6f5bfc7ab78aed67", "title": "Laws of Thermochemistry and Enthalpy Change", "totalQuestions": 14, "questions": [{"_id": "67726d15c49e8ef28ee2b419", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}], "question": {"text": "The bond dissociation energy of $X_2, Y_2$ and $X Y$ are in the ratio of $1: 0.5: 1 . \\Delta H$ for the formation of $X Y$ is $-200 \\mathrm{~kJ} / \\mathrm{mol}$. The bond dissociation energy of $X_2$ will be", "image": null}, "options": [{"id": "jwugl", "text": "$200 \\mathrm{~kJ} / \\mathrm{mol}$", "image": null, "isCorrect": false}, {"id": "VPU1R", "text": "$100 \\mathrm{~kJ} / \\mathrm{mol}$", "image": null, "isCorrect": false}, {"id": "NmndH", "text": "$400 \\mathrm{~kJ} / \\mathrm{mol}$", "image": null, "isCorrect": false}, {"id": "TRNic", "text": "$800 \\mathrm{~kJ} / \\mathrm{mol}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the bond dissociation energy of $X_2=a \\mathrm{~kJ} / \\mathrm{mol}$\n$\\text { i.e. } \\mathrm{BE}\\left(X_2\\right)=a \\mathrm{~kJ} / \\mathrm{mol}$\nThen, $\\mathrm{BE}\\left(\\mathrm{Y}_2\\right)=0.5 a$\nand $\\mathrm{BE}(X Y)=a \\mathrm{~kJ} / \\mathrm{mol}$\nGiven, $\\frac{1}{2} X_2+\\frac{1}{2} Y_2 \\longrightarrow X Y, \\Delta H=-200 \\mathrm{~kJ} / \\mathrm{mol}$\n$\\begin{aligned}\n\\Delta_r H & =\\mathrm{BE}(\\text { Rreactants })-\\mathrm{BE}(\\text { Product }) \\\\\n\\Delta_r H & =\\left[\\frac{1}{2} \\mathrm{BE}\\left(X_2\\right)+\\frac{1}{2} \\mathrm{BE}\\left(Y_2\\right)\\right]-\\mathrm{BE}(X Y) \\\\\n\\therefore-200 & =\\frac{a}{2}+\\frac{0.5 a}{2}-a \\\\\na & =\\frac{200}{0.25}=800 \\mathrm{~kJ} / \\mathrm{mol}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6416", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T19:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 3)", "title": "BITSAT 2024 (Memory Based Paper 3)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726d07c49e8ef28ee2b3b1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "Which of the following relation is not correct?", "image": null}, "options": [{"id": "FA1DS", "text": "$\\Delta \\mathrm{H}=\\Delta \\mathrm{U}-\\mathrm{P} \\Delta \\mathrm{V}$", "image": null, "isCorrect": true}, {"id": "odYu4", "text": "$\\Delta \\mathrm{U}=\\mathrm{q}+\\mathrm{W}$", "image": null, "isCorrect": false}, {"id": "WJg6J", "text": "$\\Delta \\mathrm{S}_{\\mathrm{svs}}+\\Delta \\mathrm{S}_{\\mathrm{surr}} \\geq 0$", "image": null, "isCorrect": false}, {"id": "ElY6z", "text": "$\\Delta G=\\Delta H-T \\Delta S$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{H}=\\mathrm{U}+\\mathrm{PV}$ (By definition)\n$\\Delta \\mathrm{H}=\\Delta \\mathrm{U}+\\Delta(\\mathrm{PV})$ at constant pressure\n$\\Delta H=\\Delta U+P \\Delta V$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67726cfbc49e8ef28ee2b356", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}], "question": {"text": "The combustion of benzene (L) gives $\\mathrm{CO}_2(\\mathrm{~g})$ and $\\mathrm{H}_2 \\mathrm{O}(L)$. Given that heat of combustion of benzene at constant volume is $-3263.9 \\mathrm{~kJ} \\mathrm{~mol}^{-}$ ${ }^1$ at $25^{\\circ} \\mathrm{C}$; heat of combustion (in $\\mathrm{kJ} \\mathrm{mol}{ }^{-1}$ ) of benzene at constant pressure will be :\n$\\left(R=8.314 \\mathrm{JK}^{-1} \\mathrm{~mol}^{-1}\\right)$", "image": null}, "options": [{"id": "8oSyL", "text": "$4152.6$", "image": null, "isCorrect": false}, {"id": "3HAGU", "text": "$452.46$", "image": null, "isCorrect": false}, {"id": "pG0Jt", "text": "$3260$", "image": null, "isCorrect": false}, {"id": "dDkyz", "text": "$-3267.6$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{C}_6 \\mathrm{H}_6(\\mathrm{I})+\\frac{15}{2} \\mathrm{O}_2(\\mathrm{~g}) \\rightarrow 6 \\mathrm{CO}_2(\\mathrm{~g})+3 \\mathrm{H}_2 \\mathrm{O}(\\mathrm{l})$\n$\\Delta n_g=6-\\frac{15}{2}=-\\frac{3}{2}$\n$\\Delta H=\\Delta U+\\Delta n_{\\mathrm{g}} R T$\n$=-3263.9+\\left(-\\frac{3}{2}\\right) \\times 8.314 \\times 10^{-3} \\times 298$\n$=-3263.9+(-3.71)=-3267.6 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6414", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 1)", "title": "BITSAT 2024 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87d97ae24e9e2db8cdd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}], "question": {"text": "Given that bond energies of $\\mathrm{H}-\\mathrm{H}$ and $\\mathrm{Cl}-\\mathrm{Cl}$ are $430 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$ and $240 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$ respectively and $\\Delta \\mathrm{H}_{\\mathrm{f}}$ for $\\mathrm{HCl}$ is $-90 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$, bond enthalpy of $\\mathrm{HCl}$ is", "image": null}, "options": [{"id": "0LHg4", "text": "$380 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "VHIPi", "text": "$425 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": true}, {"id": "ydeCJ", "text": "$245 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}, {"id": "hbUE6", "text": "$290 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{1}{2} \\mathrm{H}_2+\\frac{1}{2} \\mathrm{Cl}_2 \\longrightarrow \\mathrm{HCl}$<br />$\\begin{aligned}<br />& \\Delta H_{\\mathrm{HCl}}=\\sum \\text { B.E. of reactant }-\\sum \\text { B.E. of products } \\\\<br />&-90=\\frac{1}{2} \\times 430+\\frac{1}{2} \\times 240-\\text { B.E. of } \\mathrm{HCl} \\\\<br />& \\therefore \\quad \\text { B.E. of } \\mathrm{HCl}=215+120+90=425 \\mathrm{~kJ} \\mathrm{~mol}^{-1}<br />\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe85", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 2)", "title": "BITSAT 2023 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65b7b87397ae24e9e2db8c7a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}], "question": {"text": "If enthalpies of formation of $\\mathrm{C}_2 \\mathrm{H}_4(\\mathrm{~g}), \\mathrm{CO}_2(\\mathrm{~g})$ and $\\mathrm{H}_2 \\mathrm{O}(\\mathrm{l})$ at $25^{\\circ} \\mathrm{C}$ and $1 \\mathrm{~atm}$ pressure are 52,394 and $-286 \\mathrm{~kJ} / \\mathrm{mol}$ respectively, the change in enthalpy for combustion of $\\mathrm{C}_2 \\mathrm{H}_4$ is equal to", "image": null}, "options": [{"id": "0F7Um", "text": "$-141.2 \\mathrm{~kJ} / \\mathrm{mol}$", "image": null, "isCorrect": false}, {"id": "oheS2", "text": " $-1412 \\mathrm{~kJ} / \\mathrm{mol}$", "image": null, "isCorrect": true}, {"id": "kBe74", "text": "$+14.2 \\mathrm{~kJ} / \\mathrm{mol}$", "image": null, "isCorrect": false}, {"id": "cUqPZ", "text": "$+1412 \\mathrm{~kJ} / \\mathrm{mol}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Enthalpy of formation of $\\mathrm{C}_2 \\mathrm{H}_4, \\mathrm{CO}_2$ and $\\mathrm{H}_2 \\mathrm{O}$ are $52,-394$ and $-286 \\mathrm{~kJ} / \\mathrm{mol}$ respectively.<br />(Given)<br />The reaction is<br />$\\mathrm{C}_2 \\mathrm{H}_4+3 \\mathrm{O}_2 \\rightarrow 2 \\mathrm{CO}_2+2 \\mathrm{H}_2 \\mathrm{O}$<br />change in enthalpy,<br />$(\\Delta H)=\\Delta H_{\\text {products }}-\\Delta H_{\\text {reactants }}$<br />$=2 \\times(-394)+2 \\times(-286)-(52+0)$<br />$=-1412 \\mathrm{~kJ} / \\mathrm{mol}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65b7b85fb3be70ed63adbe84", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Memory Based Paper 1)", "title": "BITSAT 2023 (Memory Based Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8146f5bfc7ab78aea68", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}], "type": "singleCorrect", "level": 2, "question": {"text": "For which one of the processes represented by the following equations the enthalpy (heat) change is likely to be negative", "image": null}, "options": [{"id": "uzt13", "text": "$\\mathrm{Cl}^{-}(\\mathrm{g})+\\mathrm{aq} \\rightarrow \\mathrm{Cl}^{-}(\\mathrm{aq})$", "isCorrect": true, "image": null}, {"id": "4SPC6", "text": "$\\mathrm{Cl}(\\mathrm{g}) \\rightarrow \\mathrm{Cl}^{+}(\\mathrm{g})+\\mathrm{e}^{-}$", "isCorrect": false, "image": null}, {"id": "YCOHw", "text": "$1 / 2 \\mathrm{Cl}_{2}(\\mathrm{~g}) \\rightarrow \\mathrm{Cl}(\\mathrm{g})$", "isCorrect": false, "image": null}, {"id": "A32JO", "text": "$\\mathrm{Cl}_{2}(\\mathrm{l}) \\rightarrow \\mathrm{Cl}_{2}(\\mathrm{~g})$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Gaseous ions, when dissolved in water, get hydrated and heat is evolved (heat of hydration).\r\n\r\n$\\mathrm{Cl}^{-}(\\mathrm{g})+\\mathrm{aq} \\rightarrow \\mathrm{Cl}^{-}(\\mathrm{aq})$ is such reaction", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7e", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020", "title": "BITSAT 2020"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e8066f5bfc7ab78ae9eb", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>The heat of reaction for</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>10</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>8</mn></msub><mfenced><mi mathvariant=\"normal\">s</mi></mfenced><mo>+</mo><mn>12</mn><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>&#10230;</mo><mn>10</mn><msub><mi>CO</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><mn>4</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>(</mo><mi mathvariant=\"normal\">l</mi><mo>)</mo></math> at constant volume is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1228</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>kcal</mi></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>25</mn><mn>0</mn></msup><mi mathvariant=\"normal\">C</mi></math>. The heat of reaction at constant pressure and same temperature is</p>", "image": null}, "options": [{"id": "hurRh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1228</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>kcal</mi></math>", "isCorrect": false, "image": null}, {"id": "OEWvs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1229</mn><mo>.</mo><mn>3</mn><mo>&#160;</mo><mi>kcal</mi></math>", "isCorrect": true, "image": null}, {"id": "Y9LWm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1232</mn><mo>.</mo><mn>9</mn><mo>&#160;</mo><mi>kcal</mi></math>", "isCorrect": false, "image": null}, {"id": "BWmhK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1242</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi>kcal</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Heat of reaction at constant pressure is represented by&nbsp;&Delta;H</p><p>Heat of reaction at constant volume is represented by&nbsp;&Delta;U</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>10</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>8</mn></msub><mfenced><mi mathvariant=\"normal\">s</mi></mfenced><mo>+</mo><mn>12</mn><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>&#10230;</mo><mn>10</mn><msub><mi>CO</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><mn>4</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math></p><p>We known that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;H</mi><mo>=</mo><mi>&#916;E</mi><mo>+</mo><msub><mi>&#916;n</mi><mi mathvariant=\"normal\">g</mi></msub><mi>RT</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#916;n</mi><mi>g</mi></msub><mo>=</mo><mn>10</mn><mo>-</mo><mn>12</mn><mo>=</mo><mo>-</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;H</mi><mo>=</mo><mo>-</mo><mn>1228</mn><mo>.</mo><mn>2</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>+</mo><mfenced><mrow><mo>-</mo><mn>2</mn></mrow></mfenced><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>298</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>1229393</mn><mo>&#160;</mo><mi>Cal</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>1229</mn><mo>.</mo><mn>39</mn><mo>&#160;</mo><mi>kcal</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944 nt=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>;</mo><mo>&#160;</mo><mi>&#916;H</mi><mo>=</mo><mo>-</mo></mpadded><mn>210</mn><mo>&#160;</mo><mi>kcal</mi><mo>/</mo><mi>mol</mi></math>&nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>6</mn></msub><mo>+</mo><mfrac><mn>7</mn><mn>2</mn></mfrac><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#10230;</mo><mn>2</mn><msub><mi>CO</mi><mn>2</mn></msub><mo>+</mo><mn>3</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>;</mo><mo>&#160;</mo><mi>&#916;H</mi><mo>=</mo><mo>-</mo><mn>368</mn><mo>&#160;</mo><mi>kcal</mi><mo>/</mo><mi>mol</mi></math>&nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>ii</mi><mo>)</mo></math></p><p>On subtracting Eq. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math> from Eq <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>ii</mi><mo>)</mo></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>2</mn></msub><mo>+</mo><mfrac><mn>3</mn><mn>2</mn></mfrac><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#10230;</mo><msub><mi>CO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>;</mo><mo>&#160;</mo><mi>&#916;H</mi><mo>=</mo><mo>-</mo><mn>158</mn><mo>&#160;</mo><mi>kcal</mi><mo>/</mo><mi>mol</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> Enthalpy of combustion of one <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>2</mn></msub><mo>&#160;</mo><mi>unit</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>158</mn><mo>&#160;</mo><mi>kcal</mi><mo>/</mo><mi>mol</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#916;H</mi><mi>comb</mi></msub><mfenced><mrow><msub><mi mathvariant=\"normal\">C</mi><mn>10</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>22</mn></msub></mrow></mfenced><mo>=</mo><msub><mi>&#916;H</mi><mi>comb</mi></msub><mfenced><msub><mi>CH</mi><mn>4</mn></msub></mfenced><mo>+</mo><mn>9</mn><mo>&#215;</mo><msub><mi>&#916;H</mi><mi>comb</mi></msub><mfenced><msub><mi>CH</mi><mn>2</mn></msub></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>210</mn><mo>+</mo><mfenced><mrow><mn>9</mn><mo>&#215;</mo><mo>-</mo><mn>158</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>1632</mn><mo>&#160;</mo><mi>kcal</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7de6f5bfc7ab78ae88d", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 3, "question": {"text": "Given\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/Ux0URB_JDWSQk4TcDOVexandpzC_7CmPBp8ijr1AtZE.original.fullsize.png\"><br>\r\n\r\n$\\mathrm{F}(\\mathrm{g})+\\mathrm{e}^{-} \\rightarrow \\mathrm{F}^{-}(\\mathrm{g}) \\quad$ (Electron gain enthalpy)\r\n\r\n$\\mathrm{Li}^{+}(\\mathrm{g})+\\mathrm{F}^{-}(\\mathrm{g}) \\rightarrow \\mathrm{LiF}(\\mathrm{s}) \\quad-1047$\r\n\r\n$\\mathrm{Li}(\\mathrm{s})+\\frac{1}{2} \\mathrm{~F}_{2}(\\mathrm{~g}) \\rightarrow \\mathrm{LiF}(\\mathrm{s}) \\quad-617$\r\n\r\nBased on data provided, the value of electron gain enthalpy of fluorine would be:", "image": null}, "options": [{"id": "sHBBg", "text": "$-300 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "z3tKR", "text": "$-350 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "i40Jn", "text": "$-328 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "isCorrect": true, "image": null}, {"id": "h3hR2", "text": "$-228 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Applying Hess's Law\r\n\r\n$$\r\n\r\n\\begin{array}{c}\r\n\r\n\\Delta_{\\mathrm{f}} \\mathrm{H}^{\\circ}=\\Delta_{\\mathrm{sub}} \\mathrm{H}+\\frac{1}{2} \\Delta_{\\mathrm{diss}} \\mathrm{H}+\\mathrm{L} \\text { .E. }+\\mathrm{E} . \\mathrm{A}+\\Delta_{\\text {lattice }} \\mathrm{H} \\\\\r\n\r\n-617=161+520+77+\\mathrm{E} \\mathrm{A} .+(-1047) \\\\\r\n\r\n\\mathrm{E} . \\mathrm{A} .=-617+289=-328 \\mathrm{~kJ} \\mathrm{~mol}^{-1}\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\n$\\therefore$ electron affinity of fluorine $=-328 \\mathrm{~kJ} \\mathrm{~mol}^{-1}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7be6f5bfc7ab78ae77d", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 1, "question": {"text": "The heats of neutralisation of $\\mathrm{CH}_{3} \\mathrm{COOH}$, $\\mathrm{HCOOH}, \\mathrm{HCN}$ and $\\mathrm{H}_{2} \\mathrm{~S}$ are -13.2,-13.4,-2.9\r\n\r\nand $-3.8 \\mathrm{kCal}$ per equivalent respectively. Arrange the acids in increasing order of acidic strength.", "image": null}, "options": [{"id": "qcf4O", "text": "$\\mathrm{HCOOH}>\\mathrm{CH}_{3} \\mathrm{COOH}>\\mathrm{H}_{2} \\mathrm{~S}>\\mathrm{HCN}$", "isCorrect": true, "image": null}, {"id": "vSD1p", "text": "$\\mathrm{CH}_{3} \\mathrm{COOH}>\\mathrm{HCOOH}>\\mathrm{H}_{2} \\mathrm{~S}>\\mathrm{HCN}$", "isCorrect": false, "image": null}, {"id": "mrMPv", "text": "$\\mathrm{H}_{2} \\mathrm{~S}>\\mathrm{HCOOH}>\\mathrm{CH}_{3} \\mathrm{COOH}>\\mathrm{HCN}$", "isCorrect": false, "image": null}, {"id": "ULaHx", "text": "$\\mathrm{HCOOH}>\\mathrm{H}_{2} \\mathrm{~S}>\\mathrm{CH}_{3} \\mathrm{COOH}>\\mathrm{HCN}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The greater the (negative value) of heat of neutralisation, the more is the strength of the acid. Hence,\r\n\r\n$$\r\n\r\n\\mathrm{HCOOH}>\\mathrm{CH}_{3} \\mathrm{COOH}>\\mathrm{H}_{2} \\mathrm{~S}>\\mathrm{HCN}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7be6f5bfc7ab78ae779", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 2, "question": {"text": "The enthalpy of sublimation of aluminium is 330 $\\mathrm{kJ} / \\mathrm{mol}$. Its Ist, II $^{\\text {nd }}$ and III $^{\\text {rd }}$ ionization enthalpies are 580,1820 and $2740 \\mathrm{~kJ}$ respectively. How much heat has too be supplied (in $\\mathrm{kJ}$ ) to convert $13.5 \\mathrm{~g}$ of aluminium into $\\mathrm{Al}^{3+}$ ions and electrons at $298 \\mathrm{k}$", "image": null}, "options": [{"id": "m3fk4", "text": "5470", "isCorrect": false, "image": null}, {"id": "SccaP", "text": "2735", "isCorrect": true, "image": null}, {"id": "hkrMt", "text": "4105", "isCorrect": false, "image": null}, {"id": "6XFTg", "text": "3765", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Heat needed too be supplied\r\n\r\n$$\r\n\r\n\\text { per } m o l=330+580+1820+2740\r\n\r\n$$\r\n\r\n$=5470 \\mathrm{~kJ}$\r\n\r\nNo. of mols of Al taken $=\\frac{13.5}{27}=0.5 \\mathrm{~mol}$\r\n\r\nHeat required $=0.5 \\times 5470 \\mathrm{~kJ}=2735 \\mathrm{~kJ}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b06f5bfc7ab78ae701", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 3, "question": {"text": "The enthalpy of combustion of 2 moles of benzene at $27^{\\circ} \\mathrm{C}$ differs from the value determined in bomb calorimeter by", "image": null}, "options": [{"id": "MNuyE", "text": "$-2.494 \\mathrm{~kJ}$", "isCorrect": false, "image": null}, {"id": "A5NoM", "text": "$2.494 \\mathrm{~kJ}$", "isCorrect": false, "image": null}, {"id": "MQIA3", "text": "$-7.483 \\mathrm{~kJ}$", "isCorrect": true, "image": null}, {"id": "l7fUk", "text": "$7.483 \\mathrm{~kJ}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "By bomb calorimeter we get $\\Delta \\mathrm{E}$.\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n2 \\mathrm{C}_{6} \\mathrm{H}_{6}(\\mathrm{l})+15 \\mathrm{O}_{2}(\\mathrm{~g}) \\longrightarrow \\\\\r\n\r\n12 \\mathrm{CO}_{2}(\\mathrm{~g})+6 \\mathrm{H}_{2} \\mathrm{O}(1) \\\\\r\n\r\n\\Delta \\mathrm{H}-\\Delta \\mathrm{E}=\\Delta \\mathrm{nRT} \\\\\r\n\r\n=(12-15) \\times 8.314 \\times 300=-7.483 \\mathrm{~kJ}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7b06f5bfc7ab78ae700", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}], "type": "singleCorrect", "level": 2, "question": {"text": "For the dissociation reaction, $\\mathrm{H}_{2}(\\mathrm{~g}) \\rightarrow 2 \\mathrm{H}(\\mathrm{g}) \\quad \\Delta \\mathrm{H}=162 \\mathrm{Kcal}$\r\n\r\nheat of atomisation of $\\mathrm{H}$ is", "image": null}, "options": [{"id": "0z2fQ", "text": "$81 \\mathrm{Kcal}$", "isCorrect": true, "image": null}, {"id": "gUGX0", "text": "$162 \\mathrm{Kcal}$", "isCorrect": false, "image": null}, {"id": "6QmCB", "text": "$208 \\mathrm{Kcal}$", "isCorrect": false, "image": null}, {"id": "uSUWl", "text": "$218 \\mathrm{Kcal}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\Delta \\mathrm{H}=\\Delta \\mathrm{H}_{\\text {(product) }}-\\Delta \\mathrm{H}_{\\text {(reactant) }}$\r\n\r\n$162=2 \\times \\Delta \\mathrm{H}_{\\mathrm{H}}-\\Delta \\mathrm{H}_{\\mathrm{H}_{2}}$\r\n\r\n$\\Delta \\mathrm{H}_{\\mathrm{H}}=\\frac{162}{2} \\quad\\left(\\because \\Delta \\mathrm{H}_{\\mathrm{H}_{2}}=0\\right)$\r\n\r\n$\\Delta \\mathrm{H}_{\\mathrm{H}}=81 \\mathrm{Kcal}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d77", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013", "title": "BITSAT 2013"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7766f5bfc7ab78ae50a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}], "question": {"text": "At $25^{\\circ} \\mathrm{C}$ and 1 bar which of the following has a non-zero $\\Delta \\mathrm{H}_{\\mathrm{f}}^{\\circ} ?$", "image": null}, "options": [{"id": "hOTCn", "text": "$\\operatorname{Br}_{2}(\\ell)$", "image": null, "isCorrect": false}, {"id": "wRB2v", "text": "C (graphite)", "image": null, "isCorrect": false}, {"id": "F4yA8", "text": "$\\mathrm{O}_{3}(\\mathrm{~g})$", "image": null, "isCorrect": true}, {"id": "HJ2yw", "text": "$\\mathrm{I}_{2}(\\mathrm{~s})$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ozone is allotropic form of oxygen and is of higher energy (by $68 \\mathrm{~K}$ Cal mol $^{-1}$ ) than $\\mathrm{O}_{2}$. Hence it can not be taken as the reference in standard state.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0cc821b6514e527d73", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "BITSAT 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64c0e85f6f5bfc7ab78aed69", "title": "Entropy and Second law of thermodynamics", "totalQuestions": 5, "questions": [{"_id": "64c0e8316f5bfc7ab78aeb68", "previousYearPapers": [{"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}], "type": "singleCorrect", "level": 3, "question": {"text": "Standard entropy of $X_2, Y_2$ and $X Y_2$ are 60,40 and $50 \\mathrm{JK}^{-1} \\mathrm{~mol}^{-1}$, respectively. For the reaction, $\\frac{1}{2} X_2+\\frac{3}{2} Y_2 \\longrightarrow X Y_3, \\Delta H=-30 \\mathrm{~kJ}$, to be at equilibrium, the temperature will be", "image": null}, "options": [{"id": "hSwId", "text": "\r\n$1250 \\mathrm{~K}$\r\n", "isCorrect": false, "image": null}, {"id": "ScW84", "text": "\r\n$500 \\mathrm{~K}$\r\n", "isCorrect": false, "image": null}, {"id": "HspeF", "text": "\r\n$750 \\mathrm{~K}$\r\n", "isCorrect": true, "image": null}, {"id": "ffYGY", "text": "\r\n$1000 \\mathrm{~K}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\Delta S=S\\left(X Y_3\\right)-\\frac{1}{2} S\\left(X_2\\right)-\\frac{3}{2} S\\left(Y_2\\right)$\r\n$=50-30-60=-40 \\mathrm{~J} \\mathrm{~mol}^{-1} \\mathrm{~K}^{-1}$\r\n$\\Delta H=-30 \\mathrm{~kJ}=-3000 \\mathrm{~J}$\r\n$\\Delta G=\\Delta H-T \\Delta S$\r\nAt equilibrium,\r\n$\\Delta G=0$\r\n$T=\\frac{\\Delta H}{\\Delta S}=\\frac{-3000}{-40}=750 \\mathrm{~K}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64c0e679aef333185c6bb44d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022", "title": "BITSAT 2022"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7fa6f5bfc7ab78ae987", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 1, "question": {"text": "When the heat of a reaction at constant pressure is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>25</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup><mo>&#160;</mo><mi>cal</mi></math>&nbsp;and entropy change for the reaction is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>.</mo><mn>4</mn><mo>&#160;</mo><mi>cal</mi><mo>&#160;</mo><msup><mo>deg</mo><mrow><mo>-</mo><mn>1</mn></mrow></msup></math>,&nbsp;it is predicted that the reaction at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>25</mn><mn>0</mn></msup><mi mathvariant=\"normal\">C</mi></math> is", "image": null}, "options": [{"id": "E1FZO", "text": "revesible", "isCorrect": false, "image": null}, {"id": "pN4ii", "text": "spontaneous", "isCorrect": true, "image": null}, {"id": "oTQld", "text": "non-spontaneous", "isCorrect": false, "image": null}, {"id": "hnbZj", "text": "irreversible", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Heat at constant pressure means enthalpy. i.e.,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;G</mi><mo>=</mo><mi>&#916;H</mi><mo>-</mo><mi>T&#916;S</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;H</mi><mo>=</mo><mn>2</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mi>cal</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;S</mi><mo>=</mo><mn>7</mn><mo>.</mo><mn>4</mn><msup><mi>caldeg</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>298</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;G</mi><mo>=</mo><mi>&#916;H</mi><mo>-</mo><mi>T&#916;S</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>25</mn><mo>&#215;</mo><msup><mn>10</mn><mn>3</mn></msup><mo>-</mo><mn>298</mn><mo>&#215;</mo><mn>7</mn><mo>.</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>4705</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>cal</mi></math></p><p>As the value of&nbsp;&Delta;G&nbsp;is&nbsp;&minus;4705.2&nbsp;cal, which is a negative value, so this reaction will be spontaneous.&nbsp;</p><p>Hence, the process is spontaneous.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ec6f5bfc7ab78ae908", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Which of the following show an increase in entropy?</p><p>I. Boiling of water</p><p>II. Melting of ice</p><p>III. Freezing of water</p><p>IV. Formation of hydrogen gas from water</p>", "image": null}, "options": [{"id": "50ISa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">I</mi><mo>)</mo></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>II</mi><mo>)</mo></math>", "isCorrect": false, "image": null}, {"id": "rqfog", "text": "Only <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>III</mi><mo>)</mo></math>", "isCorrect": false, "image": null}, {"id": "ZOfeu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">I</mi><mo>)</mo><mo>,</mo><mo>&#160;</mo><mo>(</mo><mi>II</mi><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>IV</mi><mo>)</mo></math>", "isCorrect": true, "image": null}, {"id": "jkJO0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>III</mi><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>IV</mi><mo>)</mo></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Entropy is the measure of disorderliness. It means as disorderliness increases entropy increases.</p><p>Melting of ice leads to the formation of liquid water where the particles are in random motion which leads to an increase in entropy.</p><p>Option (c) is the correct option as in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo><mo>,</mo><mo>(</mo><mi>ii</mi><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>iv</mi><mo>)</mo></math> the state changes towards more random state, thus entropy increases.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7ea6f5bfc7ab78ae8f4", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Which of the following reactions does not involve&nbsp;absorption of energy?</p><p>I. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><msup><mi mathvariant=\"normal\">e</mi><mo>-</mo></msup><mo>&#10230;</mo><msup><mi mathvariant=\"normal\">O</mi><mo>-</mo></msup><mfenced><mi mathvariant=\"normal\">g</mi></mfenced></math></p><p>II. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><msup><mi mathvariant=\"normal\">e</mi><mo>-</mo></msup><mo>&#10230;</mo><msup><mi mathvariant=\"normal\">S</mi><mo>-</mo></msup><mfenced><mi mathvariant=\"normal\">g</mi></mfenced></math></p><p>III. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">O</mi><mo>-</mo></msup><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><msup><mi mathvariant=\"normal\">e</mi><mo>-</mo></msup><mo>&#10230;</mo><msup><mi mathvariant=\"normal\">O</mi><mrow><mn>2</mn><mo>-</mo></mrow></msup><mfenced><mi mathvariant=\"normal\">g</mi></mfenced></math></p><p>IV. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cl</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><msup><mi mathvariant=\"normal\">e</mi><mo>-</mo></msup><mo>&#10230;</mo><msup><mi>Cl</mi><mo>-</mo></msup><mfenced><mi mathvariant=\"normal\">g</mi></mfenced></math></p>", "image": null}, "options": [{"id": "amNBr", "text": "Only <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math>", "isCorrect": false, "image": null}, {"id": "9B37Z", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>III</mi></math>", "isCorrect": false, "image": null}, {"id": "VXluC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi><mo>,</mo><mo>&#160;</mo><mi>II</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>III</mi></math>", "isCorrect": false, "image": null}, {"id": "u4uxz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi><mo>,</mo><mo>&#160;</mo><mi>II</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>IV</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Reaction <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">I</mi><mo>)</mo><mo>,</mo><mo>(</mo><mi>II</mi><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>IV</mi><mo>)</mo></math> are of exothermic nature, thus do not involve absorption energy.</p><p>The process&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">O</mi><mo>-</mo></msup><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><msup><mi mathvariant=\"normal\">e</mi><mo>-</mo></msup><mo>&#10230;</mo><msup><mi mathvariant=\"normal\">O</mi><mrow><mn>2</mn><mo>-</mo></mrow></msup><mfenced><mi mathvariant=\"normal\">g</mi></mfenced></math>​&nbsp;involves absorption of energy.</p><p>When a neutral atom gains an electron, energy is released. When an anion (having unit negative charge) gains an electron, energy is absorbed. This is due to the repulsion between the additional electron and negatively charged anion.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7be6f5bfc7ab78ae77c", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 1, "question": {"text": "If the enthalpy of vaporization of water is 186.5 $\\mathrm{kJmol}^{-1}$, the entropy if its vaporization will be:", "image": null}, "options": [{"id": "JMPAz", "text": "$0.5 \\mathrm{kJK}^{-1} \\mathrm{~mol}^{-1}$", "isCorrect": true, "image": null}, {"id": "I3diY", "text": "$1.0 \\mathrm{kJK}^{-1} \\mathrm{~mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "4Lcqz", "text": "$1.5 \\mathrm{kJK}^{-1} \\mathrm{~mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "ppYc8", "text": "$2.0 \\mathrm{kJK}^{-1} \\mathrm{~mol}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given enthalpy of vaporization,\r\n\r\n$$\r\n\r\n\\Delta \\mathrm{H}=186.5 \\mathrm{~kJ} \\mathrm{~mol}^{-1}\r\n\r\n$$\r\n\r\nBoiling point of water\r\n\r\n$$\r\n\r\n=100^{\\circ} \\mathrm{C}=100+273=373 \\mathrm{~K}\r\n\r\n$$\r\n\r\nEntropy change,\r\n\r\n$$\r\n\r\n\\begin{array}{r}\r\n\r\n\\Delta \\mathrm{S}=\\frac{\\Delta \\mathrm{H}}{\\mathrm{T}}=\\frac{186.5 \\mathrm{~kJ} \\mathrm{~mol}^{-1}}{373 \\mathrm{~K}} \\\\\r\n\r\n=0.5 \\mathrm{~kJ} \\mathrm{~mol}^{-1} \\mathrm{~K}^{-1}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64c0e85f6f5bfc7ab78aed68", "title": "Third law of thermodynamics", "totalQuestions": 6, "questions": [{"_id": "67726d09c49e8ef28ee2b3be", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}], "question": {"text": "The standard Gibbs energy $\\left(\\Delta G^0\\right)$ for the following reaction is\n$\\begin{aligned} & \\mathrm{A}(\\mathrm{s})+\\mathrm{B}^{2+}(\\mathrm{aq}) \\rightarrow \\mathrm{A}^{2+}(\\mathrm{aq})+\\mathrm{B}(\\mathrm{s}), \\mathrm{K}_{\\mathrm{c}}=10^{12} \\mathrm{at} \\\\ & 25^{\\circ} \\mathrm{C}\\end{aligned}$\n$\\left(\\mathrm{K}_c=\\right.$ equilibrium constant $)$", "image": null}, "options": [{"id": "kYSq1", "text": "$-150 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "ZlkHQ", "text": "$-96.80 \\mathrm{~kJ}$", "image": null, "isCorrect": false}, {"id": "ADNy0", "text": "$-68.47 \\mathrm{~kJ}$", "image": null, "isCorrect": true}, {"id": "BaN3R", "text": "-100 kJ", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{A}+\\mathrm{B}^{2+} \\rightleftharpoons \\mathrm{A}^{2+}+\\mathrm{B}$\n$\\mathrm{G}^{\\circ}=-\\mathrm{RT} \\ln \\mathrm{K}_{\\mathrm{c}}$\n$=-8.314 \\times 298 \\times 2.303 \\times \\log 10^{12}=68.47 \\mathrm{~kJ} /$ mol", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67726ce6d221dc77889e6415", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2024-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Memory Based Paper 2)", "title": "BITSAT 2024 (Memory Based Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7de6f5bfc7ab78ae88c", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}], "type": "singleCorrect", "level": 1, "question": {"text": "For a particular reversible reaction at temperature $T, \\Delta H$ and $\\Delta S$ were found to be both +ve. If $T_{e}$ is the temperature at equilibrium, the reaction would be spontaneous when", "image": null}, "options": [{"id": "YPqib", "text": "$T_{e}>T$", "isCorrect": false, "image": null}, {"id": "GgG9K", "text": "$T>T_{e}$", "isCorrect": true, "image": null}, {"id": "Oinfq", "text": "$T_{e}$ is 5 times $T$", "isCorrect": false, "image": null}, {"id": "3ybsC", "text": "$T=T_{e}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "At equilibrium $\\Delta G=0$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\text { Hence, } \\Delta G=\\Delta H-T_{e} \\Delta S=0 \\\\\r\n\r\n\\therefore \\Delta H=T_{e} \\Delta S \\text { or } T_{e}=\\frac{\\Delta H}{\\Delta S}\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\nFor a spontaneous reaction $\\Delta G$ must be negative which is possible only if $\\Delta H-T \\Delta S<0$\r\n\r\n$\\therefore \\Delta H<T \\triangle S$\r\n\r\nor $T>\\frac{\\Delta H}{\\Delta S} ; T_{e}<T$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7a", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "BITSAT 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7cf6f5bfc7ab78ae813", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 1, "question": {"text": "A spontaneous reaction is impossible if", "image": null}, "options": [{"id": "9wXGx", "text": "both $\\Delta \\mathrm{H}$ and $\\Delta \\mathrm{S}$ are negative", "isCorrect": false, "image": null}, {"id": "nDd7f", "text": "both $\\Delta \\mathrm{H}$ and $\\Delta \\mathrm{S}$ are positive", "isCorrect": false, "image": null}, {"id": "PfwRO", "text": "$\\Delta \\mathrm{H}$ is negative and $\\Delta \\mathrm{S}$ is positive", "isCorrect": false, "image": null}, {"id": "X5q0N", "text": "$\\Delta \\mathrm{H}$ is positive and $\\Delta \\mathrm{S}$ is negative", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "$\\Delta \\mathrm{G}=\\Delta \\mathrm{H}-\\mathrm{T} \\Delta \\mathrm{S} ; \\Delta \\mathrm{G}$ is positive for a reaction\r\n\r\nto be non-spontaneous when $\\Delta \\mathrm{H}$ is positive and $\\Delta \\mathrm{S}$ is negative.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7cc6f5bfc7ab78ae7f6", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which law of the thermodynamics helps in calculating the absolute entropies of various substances at different temperatures?", "image": null}, "options": [{"id": "rb7Ql", "text": "First law", "isCorrect": false, "image": null}, {"id": "FvuIG", "text": "Second law", "isCorrect": false, "image": null}, {"id": "YJybF", "text": "Third law", "isCorrect": true, "image": null}, {"id": "IO3wj", "text": "Zeroth law", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The third law helps to calculate the absolute entropies of pure substances at different temperature. The entropy of the substance at different temperature. $\\mathrm{T}$ may be calculated by the measurement of heat capacity change\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n\\mathrm{S}_{\\mathrm{T}}-\\mathrm{S}_{0}=\\Delta \\mathrm{S}=\\int_{0}^{\\mathrm{T}} \\frac{\\mathrm{C}_{\\mathrm{p}} \\mathrm{dt}}{\\mathrm{T}} \\\\\r\n\r\n\\text { Where } \\mathrm{S}_{\\mathrm{T}}=\\text { Entropy at } \\mathrm{T} \\mathrm{K}\r\n\r\n\\end{array}\r\n\r\n$$\r\n\r\n$\\mathrm{S}_{0}=$ Entropy at $0 \\mathrm{~K}$\r\n\r\n$$\r\n\r\n\\begin{array}{l}\r\n\r\n=\\mathrm{C}_{\\mathrm{p}} \\cdot \\log _{e} \\mathrm{~T} \\\\\r\n\r\n=2.303 \\mathrm{C}_{\\mathrm{p}} \\mathrm{log} \\mathrm{T}\r\n\r\n\\end{array}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d79", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015", "title": "BITSAT 2015"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7a06f5bfc7ab78ae681", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}], "type": "singleCorrect", "level": 2, "question": {"text": "In which of the following reactions, standard entropy change $\\left(\\Delta \\mathrm{S}^{\\circ}\\right)$ is positive and standard Gibb's energy change $\\left(\\Delta \\mathrm{G}^{\\circ}\\right)$ decreases sharply with increasing temperature?", "image": null}, "options": [{"id": "366rt", "text": "$\\mathrm{C}$ (graphite) $+\\frac{1}{2} \\mathrm{O}_{2}(\\mathrm{~g}) \\rightarrow \\mathrm{CO}(\\mathrm{g})$", "isCorrect": true, "image": null}, {"id": "O6Rxa", "text": "$\\mathrm{CO}(\\mathrm{g})+\\frac{1}{2} \\mathrm{O}_{2}(\\mathrm{~g}) \\rightarrow \\mathrm{CO}_{2}(\\mathrm{~g})$", "isCorrect": false, "image": null}, {"id": "PCc0I", "text": "$\\mathrm{Mg}(\\mathrm{s})+\\frac{1}{2} \\mathrm{O}_{2}(\\mathrm{~g}) \\rightarrow \\mathrm{MgO}(\\mathrm{s})$", "isCorrect": false, "image": null}, {"id": "Sx1cu", "text": "$\\frac{1}{2} \\mathrm{C}$ (graphite) $+\\frac{1}{2} \\mathrm{O}_{2}(\\mathrm{~g}) \\rightarrow \\frac{1}{2} \\mathrm{CO}_{2}(\\mathrm{~g})$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since, in the first reaction gaseous products are forming from solid carbon hence entropy will increase i.e. $\\Delta \\mathrm{S}=+\\mathrm{ve}$.\r\n$\\mathrm{C}(\\mathrm{gr} .)+\\frac{1}{2} \\mathrm{O}_{2}(\\mathrm{~g}) \\rightarrow \\mathrm{CO}(\\mathrm{g}) ; \\Delta \\mathrm{S}^{\\circ}=+\\mathrm{ve}$\r\nSince, $\\Delta \\overrightarrow{\\mathrm{G}^{\\circ}}=\\Delta \\mathrm{H}^{\\circ}-\\mathrm{T} \\Delta \\mathrm{S}$ hence the value of\r\n$\\Delta$ G decrease on increasing temperature.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d76", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "BITSAT 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7926f5bfc7ab78ae606", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}], "question": {"text": "What is the free energy change, $\\Delta \\mathrm{G}$, when 1.0 mole of water at $100^{\\circ} \\mathrm{C}$ and 1 atm pressure is converted into steam at $100^{\\circ} \\mathrm{C}$ and $1 \\mathrm{~atm}$.\npressure?", "image": null}, "options": [{"id": "5UcAx", "text": "$540 \\mathrm{cal}$", "image": null, "isCorrect": false}, {"id": "mcwET", "text": "-9800 cal", "image": null, "isCorrect": false}, {"id": "zuhz6", "text": "$9800 \\mathrm{cal}$", "image": null, "isCorrect": false}, {"id": "kEyx4", "text": "$0 \\mathrm{cal}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Condition of equilibrium, hence $\\Delta \\mathrm{G}=0$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d75", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "BITSAT 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
