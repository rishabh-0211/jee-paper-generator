mi>CHO</mi></math>", "isCorrect": true, "image": null}, {"id": "3UgkE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HCOOH</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Bakelite is a thermosetting plastic which is formed by the reaction of phenol with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">H</mi><mo>.</mo><mi>CHO</mi></math> in the presence of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>SO</mi><mn>4</mn></msub></math> (conc).</p><p>The reaction occurs as follows:</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/2c748085-481d-4449-8dd7-151e7fcde4bf-image.png\" style=\"width: 823px; height: 242px;\" /></p><p>A cross-linked condensation polymer (at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">o</mi></math>-and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi></math>-position) bakelite is thus produced.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7d", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019", "title": "BITSAT 2019"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7fc6f5bfc7ab78ae991", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match the polymer given in column I with correct monomer of column II and choose the correct option.</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td style=\"text-align: center;\"> variant=\"normal\">B</mi></mtd><mtd><mi mathvariant=\"normal\">C</mi></mtd><mtd><mi mathvariant=\"normal\">D</mi></mtd></mtr><mtr><mtd><mi>III</mi></mtd><mtd><mi mathvariant=\"normal\">I</mi></mtd><mtd><mi>II</mi></mtd><mtd><mi>IV</mi></mtd></mtr></mtable></math>", "isCorrect": true, "image": null}, {"id": "udV7L", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"left left left left\"><mtr><mtd><mi mathvariant=\"normal\">A</mi></mtd><mtd><mi mathvariant=\"normal\">B</mi></mtd><mtd><mi mathvariant=\"normal\">C</mi></mtd><mtd><mi mathvariant=\"normal\">D</mi></mtd></mtr><mtr><mtd><mi>II</mi></mtd><mtd><mi>IV</mi></mtd><mtd><mi mathvariant=\"normal\">I</mi></mtd><mtd><mi>III</mi></mtd></mtr></mtable></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Monomers basically create blocks for molecules, including proteins, starch and many other polymers. Four big monomers are found:&nbsp;amino acids, nucleotides, monosaccharides, and fatty acids. The main forms of macromolecules are those monomers: proteins, nucleic acids, carbohydrates, and lipids.<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/015f7191-e2a9-424a-a21d-fd08f73c0e95-6ad25077-1d9a-4f17-abbe-482d256b3f5d-9e325498-0795-41b0-acba-97fdccd22eef-image.png\" style=\"width: 537px; height: 436px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7c", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "BITSAT 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7eb6f5bfc7ab78ae8ff", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}], "type": "singleCorrect", "level": 1, "question": {"text": "Neoprene is a", "image": null}, "options": [{"id": "IHisJ", "text": "monomer of rubber", "isCorrect": false, "image": null}, {"id": "LkzQy", "text": "synthetic rubber", "isCorrect": true, "image": null}, {"id": "R8iXR", "text": "a natural rubber", "isCorrect": false, "image": null}, {"id": "jeRXk", "text": "vulcanised rubber", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Neoprene is a synthetic rubber. It is a polymer of chloroprene (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>-chlorobuta,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>,</mo><mn>3</mn></math> diene).", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d7b", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "BITSAT 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64c0e7c16f5bfc7ab78ae799", "previousYearPapers": [{"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which one of the following monomers gives the polymer neoprene on polymerization?", "image": null}, "options": [{"id": "hGQmr", "text": "$\\quad \\mathrm{CF}_{2}=\\mathrm{CF}_{2}$", "isCorrect": false, "image": null}, {"id": "aBC0M", "text": "$\\mathrm{CH}_{2}=\\mathrm{CHCl}$", "isCorrect": false, "image": null}, {"id": "giYWZ", "text": "$\\mathrm{CCl}_{2}=\\mathrm{CCl}_{2}$", "isCorrect": false, "image": null}, {"id": "qmrFE", "text": "\\(\\mathrm{CH}_2=\\stackrel{\\huge\\mathrm{Cl} \\atop \\huge |}{\\mathrm{C}}-\\mathrm{CH}=\\mathrm{CH}_2\\)", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/bitsat/X4qfeUbKSRDltCxBPMRbmnrHznA-Rl_puW08dXSsBAg.original.fullsize.png\">", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61a8bf0fc821b6514e527d78", "examId": "615d7713c52ffa3c944600e3", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014", "title": "BITSAT 2014"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'BITSAT';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
