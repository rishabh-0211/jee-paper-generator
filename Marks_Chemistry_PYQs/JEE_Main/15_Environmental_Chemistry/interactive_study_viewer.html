mn>2</mn></msub></math>, Methane is not a component of reducing smog.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MULTI_STATEMENT"], "previousYear": {"_id": "615d92edde3d91842a5cf812", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-18T09:00:00.000Z", "isVisible": true, "shortName": "2021 (18 Mar Shift 1)", "title": "JEE Main 2021 (18 Mar Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66f44", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf810", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-17T09:00:00.000Z", "isVisible": true, "shortName": "2021 (17 Mar Shift 1)", "title": "JEE Main 2021 (17 Mar Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Reducing smog is a mixture of:", "image": null}, "options": [{"id": "O8Eig", "text": "Smoke, fog and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "wPRmJ", "text": "Smoke, fog and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SO</mi><mn>2</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "84kQf", "text": "Smoke, fog and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>2</mn></msub><mo>=</mo><mi>CH</mi><mo>-</mo><mi>CHO</mi></math>", "isCorrect": false, "image": null}, {"id": "bGBba", "text": "Smoke, fog and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Reducing or classical smog is the combination of smoke, fog and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SO</mi><mn>2</mn></msub><mo>.</mo></math>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf810", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-17T09:00:00.000Z", "isVisible": true, "shortName": "2021 (17 Mar Shift 1)", "title": "JEE Main 2021 (17 Mar Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66ee1", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-16T14:00:00.000Z", "isVisible": true, "shortName": "2021 (16 Mar Shift 2)", "title": "JEE Main 2021 (16 Mar Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>The green house gas/es is (are):</p><p>(A) Carbon dioxide</p><p>(B) Oxygen</p><p>(C) Water vapour</p><p>(D) Methane</p><p>Choose the most appropriate answer from the options given below:</p>", "image": null}, "options": [{"id": "AXLDc", "text": "(A) and (C) only", "isCorrect": false, "image": null}, {"id": "S21Mm", "text": "(A) only", "isCorrect": false, "image": null}, {"id": "93S1n", "text": "(A), (C)&nbsp;and (D)&nbsp;only", "isCorrect": true, "image": null}, {"id": "M9Gn9", "text": "(A) and (B) only", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Greenhouse effect, a warming of Earth&#39;s surface and troposphere (the lowest layer of the atmosphere) caused by the presence of&nbsp;water vapour, carbon dioxide, methane, and certain other gases in the air. Of those gases, known as greenhouse gases, water vapour has the largest effect.</p><p>The green house gases are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mfenced><mi>vapour</mi></mfenced></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>4</mn></msub></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MULTI_STATEMENT"], "previousYear": {"_id": "615d92edde3d91842a5cf80f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-16T14:00:00.000Z", "isVisible": true, "shortName": "2021 (16 Mar Shift 2)", "title": "JEE Main 2021 (16 Mar Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66e93", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-16T09:00:00.000Z", "isVisible": true, "shortName": "2021 (16 Mar Shift 1)", "title": "JEE Main 2021 (16 Mar Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The type of pollution that gets increased during the daytime and in the presence of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>&nbsp;is :", "image": null}, "options": [{"id": "LtKZl", "text": "Reducing smog", "isCorrect": false, "image": null}, {"id": "2izSE", "text": "Oxidising smog", "isCorrect": true, "image": null}, {"id": "BN81E", "text": "Global warming", "isCorrect": false, "image": null}, {"id": "9CdhQ", "text": "Acid rain", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>In presence of ozone <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></mfenced></math>, oxidising smog gets increased during the daytime because automobiles and factories produce main components of the photochemical smog (oxidising smog) results from the action of sunlight on unsaturated hydrocarbon and nitrogen oxide.</p><p>Ozone is a strong oxidising agent and can react with the unburnt hydrocarbons in the polluted air to produce chemicals.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf80e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-16T09:00:00.000Z", "isVisible": true, "shortName": "2021 (16 Mar Shift 1)", "title": "JEE Main 2021 (16 Mar Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d6748b", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Feb Shift 1)", "title": "JEE Main 2021 (26 Feb Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The presence of ozone in troposphere:", "image": null}, "options": [{"id": "sxhGC", "text": "protects us from the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>UV</mi></math> radiation", "isCorrect": false, "image": null}, {"id": "wlbJk", "text": "protects us from greenhouse effect", "isCorrect": false, "image": null}, {"id": "eWRci", "text": "protects us from the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>-ray radiation", "isCorrect": false, "image": null}, {"id": "YXFCZ", "text": "generates photochemical smog", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>The presence of ozone in troposphere generates photochemical smog.</p><p>Ozone acts as an important infrared absorber (greenhouse gas), particularly in the upper troposphere, and also is an absorber of solar ultraviolet (UV) radiation.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf80c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Feb Shift 1)", "title": "JEE Main 2021 (26 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d672cc", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T14:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 2)", "title": "JEE Main 2021 (25 Feb Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Given below are two statements:</p><p>Statement I:&nbsp;The <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>pH</mi></math>&nbsp;of rain water is normally <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>~</mo><mn>5</mn><mo>.</mo><mn>6</mn></math>.</p><p>Statement II :&nbsp;If the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>pH</mi></math> of rain water drops below <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>6</mn></math> , it is called acid rain.</p><p>In the light of the above statements, choose the correct answer from the options given below:</p>", "image": null}, "options": [{"id": "zeo38", "text": "Both Statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math> and Statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> are true.", "isCorrect": true, "image": null}, {"id": "nRq66", "text": "Statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math> is false but Statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> is true.", "isCorrect": false, "image": null}, {"id": "9AlAm", "text": "Statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math> is true but Statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> is false.", "isCorrect": false, "image": null}, {"id": "IX18u", "text": "Both Statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math> and Statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> are false.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Both statements are correct. Normally rain water has <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>pH</mi></math> of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>6</mn></math>&nbsp;due to the presence of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">H</mi><mo>+</mo></msup></math> ions formed by the reaction of rain water with carbon dioxide present in the atmosphere.</p><p>Normal rain has a pH of about 5.6. This is because it reacts with carbon dioxide in the atmosphere and forms mildly acidic carbonic acid before it becomes rain.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "615d92edde3d91842a5cf80b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T14:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 2)", "title": "JEE Main 2021 (25 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d67266", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 1)", "title": "JEE Main 2021 (25 Feb Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Given below are two statements:</p><p>Statement I : An allotrope of oxygen is an important intermediate in the formation of reducing smog.</p><p>Statement II : Gases such as oxides of nitrogen and sulphur present in troposphere contribute to the formation of photochemical smog. In the light of the above statements, choose the correct answer from the options given below:</p>", "image": null}, "options": [{"id": "3yZ8q", "text": "Both Statement I and Statement II are false", "isCorrect": true, "image": null}, {"id": "yYlve", "text": "Both Statement I and Statement II are true", "isCorrect": false, "image": null}, {"id": "DiDBX", "text": "Statement I is true but Statement II is false", "isCorrect": false, "image": null}, {"id": "rIPOb", "text": "Statement I is false but Statement II is true", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Both Statement I and Statement II are false</p><p>Reducing smog is a mixture of smoke, fog and sulphur dioxide. Tropospheric pollutants such as hydrocarbon and nitrogen oxide contribute to the formation of photochemical smog.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "615d92edde3d91842a5cf80a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 1)", "title": "JEE Main 2021 (25 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66af8", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf803", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-04T14:00:00.000Z", "isVisible": true, "shortName": "2020 (04 Sep Shift 2)", "title": "JEE Main 2020 (04 Sep Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The processes of calcination and roasting in metallurgical industries, respectively, can lead to :", "image": null}, "options": [{"id": "3v2WJ", "text": "Global warming and photochemical smog", "isCorrect": false, "image": null}, {"id": "vC5Sr", "text": "Global warming and acid rain", "isCorrect": true, "image": null}, {"id": "KsOEA", "text": "Photochemical smog and ozone layer depletion", "isCorrect": false, "image": null}, {"id": "IDv6R", "text": "Photochemical smog and global warming", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In Calcination and roasting&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SO</mi><mn>2</mn></msub></math> are released which are responsible for Global warning and acid rain.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf803", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-04T14:00:00.000Z", "isVisible": true, "shortName": "2020 (04 Sep Shift 2)", "title": "JEE Main 2020 (04 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66a62", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf801", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-03T14:00:00.000Z", "isVisible": true, "shortName": "2020 (03 Sep Shift 2)", "title": "JEE Main 2020 (03 Sep Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>The incorrect statement(s) among (a) &ndash; (d) regarding acid rain is (are):</p><p>a) It can corrode water pipes</p><p>(b) It can damage structures made up of stone.</p><p>(c) It cannot cause respiratory ailments in animals</p><p>(d) It is not harmful for trees</p>", "image": null}, "options": [{"id": "h5caN", "text": "(a), (c) and (d)", "isCorrect": false, "image": null}, {"id": "s3uFp", "text": "(c) only", "isCorrect": false, "image": null}, {"id": "8UR3S", "text": "(a), (b) and (d)", "isCorrect": false, "image": null}, {"id": "slSmT", "text": "(c) and (d)", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Acid rain is harmful for trees and plants. It causes breathing problem in human being and animals.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MULTI_STATEMENT"], "previousYear": {"_id": "615d92ecde3d91842a5cf801", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-03T14:00:00.000Z", "isVisible": true, "shortName": "2020 (03 Sep Shift 2)", "title": "JEE Main 2020 (03 Sep Shift 2)"}, "evalSta variant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced></math>  <br/><math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>+</mo><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>→</mo><munder><mrow><mn>3</mn><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></mrow><mrow><mtext>Formaldehyde</mtext></mrow></munder><mo>+</mo><mn>3</mn><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math>  <br/>So the common component of photochemical smog are Ozone, No, acrolein, PAN, formaldehyde.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 1)", "title": "JEE Main 2019 (12 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d6666c", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 2)", "title": "JEE Main 2019 (10 Apr Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The noble gas that does not occur in the atmosphere is;", "image": null}, "options": [{"id": "jyyHD", "text": "<math><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">r</mi></math>", "isCorrect": false, "image": null}, {"id": "VfUx3", "text": "<math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">e</mi></math>", "isCorrect": false, "image": null}, {"id": "OsTTx", "text": "<math><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">a</mi></math>", "isCorrect": true, "image": null}, {"id": "KvBRe", "text": "<math><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">e</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>In the atmosphere, all the noble gases occur except radon. Out of all noble gases, argon is the major constituent. A decay product of radium is radon.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 2)", "title": "JEE Main 2019 (10 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d66669", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 2)", "title": "JEE Main 2019 (10 Apr Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Air pollution that occurs in sunlight is", "image": null}, "options": [{"id": "NvN5n", "text": "Acid rain", "isCorrect": false, "image": null}, {"id": "HadsV", "text": "Reducing smog", "isCorrect": false, "image": null}, {"id": "OtIV1", "text": "Fog", "isCorrect": false, "image": null}, {"id": "AKvnU", "text": "Oxidising smog", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Photochemical smog, also known as &#39;Oxidising smog&#39; is an atmospheric condition that produces various unwanted effects such as eye irritation and poor visibility.<br /><br />The main ingredients of photochemical smog include energy from sunlight, hydrocarbons and oxides of nitrogen.<br /><br />The name &#39;Oxidising smog&#39; is given because it contains high concentration of oxidising agents.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 2)", "title": "JEE Main 2019 (10 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d6660b", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 1)", "title": "JEE Main 2019 (10 Apr Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The regions of the atmosphere, where clouds form and where we live, respectively, are:", "image": null}, "options": [{"id": "DsIA1", "text": "Troposphere and Troposphere", "isCorrect": true, "image": null}, {"id": "PBZBH", "text": "Stratosphere and Stratosphere", "isCorrect": false, "image": null}, {"id": "6n482", "text": "Stratosphere and Troposphere", "isCorrect": false, "image": null}, {"id": "xOitl", "text": "Troposphere and Stratosphere", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Troposphere contains about 75% of air in atmosphere and all amount is the water vapour.<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/89f62c8f-1698-426a-a333-8d350fedbc2b-image.png\" style=\"width: 243px; height: 261px;\" />", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 1)", "title": "JEE Main 2019 (10 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d664f4", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 2)", "title": "JEE Main 2019 (09 Apr Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The layer of atmosphere between <math><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi></math> to <math><mn>50</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi></math> above the sea level is called as:", "image": null}, "options": [{"id": "a0Lau", "text": "stratosphere", "isCorrect": true, "image": null}, {"id": "ZDeTu", "text": "troposphere", "isCorrect": false, "image": null}, {"id": "oWaQV", "text": "mesosphere", "isCorrect": false, "image": null}, {"id": "169C7", "text": "thermosphere", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Based on fact layer of atmosphere between <math><mn>10</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi></math> to <math><mn>50</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi></math> above sea level is called as stratosphere.<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/923e6e90-6ec3-41e6-9b29-de31253f18ff-image11.png\" />", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 2)", "title": "JEE Main 2019 (09 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d66495", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 1)", "title": "JEE Main 2019 (09 Apr Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Excessive release of <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> into the atmosphere results in", "image": null}, "options": [{"id": "d1VuL", "text": "global warming.", "isCorrect": true, "image": null}, {"id": "JDUak", "text": "polar vortex.", "isCorrect": false, "image": null}, {"id": "7Xna1", "text": "depletion of ozone.", "isCorrect": false, "image": null}, {"id": "paoTK", "text": "formation of smog.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Carbon dioxide is very important for maintaining the climate which is suitable for our survival.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math>&nbsp;has the property of trapping heat from the sun. So higher the level of carbon dioxide, the higher will be the heat trapped. This leads to the rise in the temperature of the earth, resulting in global warming.Therefore, we can say excessive release of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math>&nbsp;into the atmosphere results in global warming.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Apr Shift 1)", "title": "JEE Main 2019 (09 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d663f5", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T09:00:00.000Z", "isVisibl
