Tetrachloroethylene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math>&nbsp;is used in dry cleaning is a better strategy to control environmental pollution.&nbsp;Liquid carbon dioxide is better to replace conventional halogenated solvents which are potentially carcinogenic. These detergents are developed in a way that one end of the molecule is soluble in non-polar substances like grease, oil stains and the other end dissolves in liquid carbon dioxide.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2016 (10 Apr Online)", "title": "JEE Main 2016 (10 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65f5d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}], "question": {"text": "Photochemical smog consists of excessive amount of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>, in addition to aldehydes, ketones, peroxy acetyl nitrile <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>PAN</mi><mo>)</mo><mo>.</mo><mo>&#160;</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math> is:", "image": null}, "options": [{"id": "4TpqY", "text": "<math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "cv8Gy", "text": "<math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "NwCPZ", "text": "<math><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "Ys9st", "text": "<math><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">O</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Photochemical smog is formed on the chemical reaction of sunlight, nitrogen oxides and volatile organic compounds in the atmosphere.<br /><br /><math><msub><mrow><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced><mover accent=\"false\"><mo>&#8594;</mo><mrow><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">v</mi></mrow></mover><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">O</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced><mo>+</mo><mi mathvariant=\"normal\">O</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced></math><br /><br />Oxygen atom (nascent) is very reactive and combines with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#160;</mo></math>in air to produce ozone.<br /><br /><math><mi mathvariant=\"normal\">O</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced><mo>&#8594;</mo><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65ef8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}], "question": {"text": "<strong>Assertion: </strong>Nitrogen and Oxygen are the main components in the atmosphere but these do not react to form oxides of nitrogen.<br />\r<br />\r<strong>Reason:</strong> The reaction between nitrogen and oxygen requires high temperature.", "image": null}, "options": [{"id": "35X17", "text": "Both the Assertion and Reason are incorrect.", "image": null, "isCorrect": false}, {"id": "ehSAc", "text": "Both Assertion and Reason are correct and the Reason is the correct explanation for the Assertion.", "image": null, "isCorrect": true}, {"id": "yOJnI", "text": "Both Assertion and Reason are correct, but the Reason is not the correct explanation for the Assertion.", "image": null, "isCorrect": false}, {"id": "Hx4EN", "text": "The Assertion is incorrect but the Reason is correct.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></math> react under electric arc at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>200</mn><mmultiscripts><mi mathvariant=\"normal\">C</mi><mprescripts/><none/><mn>0</mn></mmultiscripts></math> to form <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NO</mi><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo><mo>.</mo></math> Both the assertion and reason are correct and reason is correct explanation.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["ASSERTION_REASON"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65e4e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}], "question": {"text": "Global warming is due to increase of:", "image": null}, "options": [{"id": "Qseoi", "text": "\nmethane and nitrous oxide in atmosphere\n", "image": null, "isCorrect": false}, {"id": "uumM2", "text": "\nmethane and $\\mathrm{CO}_2$ in atmosphere\n", "image": null, "isCorrect": true}, {"id": "JHBlm", "text": "\nmethane and $\\mathrm{O}_3$ in atmosphere\n", "image": null, "isCorrect": false}, {"id": "rGSbC", "text": "\nmethane and CO in atmosphere", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The main gas responsible for the global warming is carbon dioxide. Other contributors include methane released from landfills and agriculture.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65df0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}], "question": {"text": "Which of the following statements about the depletion of ozone layer is correct?", "image": null}, "options": [{"id": "TPlsZ", "text": "\nThe problem of ozone depletion is less serious at poles because $\\mathrm{NO}_2$ solidifies and is not available for consuming $\\mathrm{CIO}^{\\circ}$ radicals.\n", "image": null, "isCorrect": false}, {"id": "5zZUL", "text": "\nThe problem of ozone depletion is more serious at poles because ice crystals in the clouds over poles act as catalyst for photochemical reactions involving the decomposition of ozone of $\\mathrm{Cl}^{\\bullet}$ and $\\mathrm{CIO}^{\\bullet}$ radicals.\n", "image": null, "isCorrect": false}, {"id": "BhmWF", "text": "\nFreons, chlorofluorocarbons, are inert. Chemically, they do not react with ozone in stratosphere.\n", "image": null, "isCorrect": true}, {"id": "ntZdx", "text": "\nOxides of nitrogen also do not react with ozone in stratosphere.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Freons and chlorofluorocarbon find their way to stratosphere through without being destroyed in the troposphere due to their low reactivity. In the stratosphere the $\\mathrm{Cl}$ and $\\mathrm{Br}$ atoms are liberated from the parent compounds by the action of ultraviolet light e.g.\n$$\n\\begin{aligned}\n&\\mathrm{CF}_2 \\mathrm{Cl}_2+h v \\longrightarrow \\mathrm{CF}_2 \\mathrm{Cl}+\\mathrm{Cl} \\\\\n&\\mathrm{CFCl}_3+h v \\longrightarrow \\mathrm{CFCl}_2+\\mathrm{Cl}\n\\end{aligned}\n$$\nThe $\\mathrm{Cl}$ atoms can destroy ozone molecules through a variety of catalytic cycles.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65ac6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}], "question": {"text": "Which one of the following depletes ozone layer?", "image": null}, "options": [{"id": "EXoBx", "text": "\n$\\mathrm{CO}$\n", "image": null, "isCorrect": false}, {"id": "1mKse", "text": "\n$\\mathrm{NO}$ and freons\n", "image": null, "isCorrect": true}, {"id": "MNK2R", "text": "\n$\\mathrm{SO}_2$\n", "image": null, "isCorrect": false}, {"id": "VZReA", "text": "\n$\\mathrm{CO}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "NO and freons are responsible for ozone layer depletion.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d659c5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}], "question": {"text": "Green house gases can be arranged in 'Global Warming Potential' sequence as", "image": null}, "options": [{"id": "UDxnB", "text": "\n$\\mathrm{N}_2 \\mathrm{O}>\\mathrm{CFC}>\\mathrm{CH}_4>\\mathrm{CO}_2$\n", "image": null, "isCorrect": false}, {"id": "A2Doo", "text": "\nCFC $>\\mathrm{N}_2 \\mathrm{O}>\\mathrm{CH}_4>\\mathrm{CO}_2$\n", "image": null, "isCorrect": true}, {"id": "ydmCF", "text": "\n$\\mathrm{CFC}>\\mathrm{CO}_2>\\mathrm{N}_2 \\mathrm{O}>\\mathrm{CH}_4$\n", "image": null, "isCorrect": false}, {"id": "btY53", "text": "\n$\\mathrm{CO}_2>\\mathrm{CFC}>\\mathrm{N}_2 \\mathrm{O}>\\mathrm{CH}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{CFC}>\\mathrm{N}_2 \\mathrm{O}>\\mathrm{CH}_4>\\mathrm{CO}_2$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["SEQUENCE_ORDER"], "previousYear": {"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6583c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}], "question": {"text": "Identify the wrong statements in the following:", "image": null}, "options": [{"id": "ZYYx8", "text": "\nChlorofluorocarbons are responsible for ozone layer depletion\n", "image": null, "isCorrect": false}, {"id": "veJf6", "text": "\nGreenhouse effect is responsible for global warming\n", "image": null, "isCorrect": false}, {"id": "9gFyF", "text": "\nOzone layer does not permit infrared radiation from the sun to reach the earth\n", "image": null, "isCorrect": true}, {"id": "uqKWu", "text": "\nAcid rains is mostly because of oxides of nitrogen and sulphur", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ozone layer does not allow ultraviolet radiation from sun to reach earth.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d655dc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "The smog is essentially caused by the presence of", "image": null}, "options": [{"id": "fVbX5", "text": "\n$\\mathrm{O}_2$ and $\\mathrm{O}_3$\n", "image": null, "isCorrect": false}, {"id": "GgpoX", "text": "\n$\\mathrm{O}_3$ and $\\mathrm{N}_2$\n", "image": null, "isCorrect": false}, {"id": "huHls", "text": "\nOxides of sulphur and nitrogen\n", "image": null, "isCorrect": true}, {"id": "use7w", "text": "\n$\\mathrm{O}_2$ and $\\mathrm{N}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Insulin", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "648b5a74417cc3fb48d693c2", "title": "Water Pollution", "totalQuestions": 37, "questions": [{"_id": "648b5a70417cc3fb48d6856e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6492", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 1)", "title": "JEE Main 2023 (11 Apr Shift 1)"}], "question": {"text": "<p>Given below are two statements :</p><p>Statement-I : If BOD is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mo>&#160;</mo><mi>ppm</mi></math> and dissolved oxygen is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>&#160;</mo><mo>&#160;</mo><mi>ppm</mi></math> , then it is a good quality water.</p><p>Statement-II : If the concentration of zinc and nitrate salts are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi>ppm</mi></math> each, then it can be a good quality water.</p><p>In the light of the above statements, choose the most appropriate answer from the options given below :</p>", "image": null}, "options": [{"id": "fBQlE", "text": "Statement I is correct but Statement II is incorrect", "image": null, "isCorrect": false}, {"id": "sEhcq", "text": "Statement I is incorrect but Statement II is correct", "image": null, "isCorrect": false}, {"id": "ovVim", "text": "Both the statements I and II are incorrect", "image": null, "isCorrect": false}, {"id": "tlloH", "text": "Both the statements I and II are correct", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Drinking water has a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BOD</mi></math> level of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>2</mn><mo>&#160;</mo><mi>ppm</mi></math>. When the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BOD</mi></math> value of water is in the range <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>5</mn><mo>&#160;</mo><mi>ppm</mi></math>, the water is moderately clean. Polluted water has a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BOD</mi></math> value in the range of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>9</mn><mo>&#160;</mo><mi>ppm</mi></math>.&nbsp;Healthy water should generally have dissolved oxygen concentrations above&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>.</mo><mn>5</mn><mo>-</mo><mn>8</mn><mo>&#160;</mo><mi>mg</mi><mo>/</mo><mi mathvariant=\"normal\">L</mi></math></p><p>Drinking water with concentrations of nitrate (measured as nitrate-nitrogen) below <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>mg</mi></math>&nbsp;of nitrate per liter of water (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>mg</mi><mo>/</mo><mi mathvariant=\"normal\">L</mi></math>) is considered safe.&nbsp;Permissible limit of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Zn</mi></math>&nbsp;in potable water is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi>ppm</mi></math>.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6492", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 1)", "title": "JEE Main 2023 (11 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68407", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}], "question": {"text": "<p>Match List I with List II</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td colspan=\"2\" rowspan=\"1\">\t\t\t<p style=\"text-align: center;\"><strong>List-I</strong></p>\t\t\t<p style=\"text-align: center;\"><strong>Species</strong></p>\t\t\t</td>\t\t\t<td colspan=\"2\" rowspan=\"1\">\t\t\t<p style=\"text-align: center;\"><strong>List-2</strong></p>\t\t\t<p style=\"text-align: center;\"><strong>Maximum allowed concentration in ppm in drinking water</strong></p>\t\t\t</td>\t\t</tr>\t\t<tr>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math></td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">F</mi><mo>-</mo></msup></math></td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math></td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#60;</mo><mo>&#160;</mo><mn>50</mn><mo>&#160;</mo><mi>ppm</mi></math></td>\t\t</tr>\t\t<tr>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math></td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>SO</mi><mn>4</mn><mrow><mn>2</mn><mo>-</mo></mrow></msubsup></math></td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math></td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#60;</mo><mo>&#160;</mo><mn>5</mn><mo>&#160;</mo><mi>ppm</mi></math></td>\t\t</tr>\t\t<tr>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math></td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>NO</mi><mn>3</mn><mo>-</mo></msubsup></math></td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>III</mi></math></td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#60;</mo><mn>2</mn><mo>&#160;</mo><mi>ppm</mi></math></td>\t\t</tr>\t\t<tr>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi></math></td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Zn</mi></math></td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>IV</mi></math></td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#60;</mo><mn>500</mn><mo>&#160;</mo><mi>ppm</mi></math></td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below.</p>", "image": null}, "options": [{"id": "wjGOT", "text": "A-I, B-II, C-III, D-IV", "image": null, "isCorrect": false}, {"id": "KuOmo", "text": "A-II, B-I, C-III, D-IV", "image": null, "isCorrect": false}, {"id": "SRrmF", "text": "A-IV, B-III, C-II, D-I", "image": null, "isCorrect": false}, {"id": "8RW3D", "text": "A-III, B-II, C-I, D-IV", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<blockquote><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td>Species</td>\t\t\t<td>Maximum allowed concentration in ppm in drinking water</td>\t\t</tr>\t\t<tr>\t\t\t<td>A.</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">F</mi><mo>-</mo></msup></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>B.</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>SO</mi><mn>4</mn><mrow><mn>2</mn><mo>-</mo></mrow></msubsup></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>C.</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>NO</mi><mn>3</mn><mo>-</mo></msubsup></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>D.</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Zn</mi><mo>&#160;</mo></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math></td>\t\t</tr>\t</tbody></table><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">F</mi><mo>&#8211;</mo></msup><mo>&#160;</mo></math>ion concentration above 2 ppm causes brown mottling of teeth. At the same time, excess fluoride (over 10 ppm) causes harmful effect to bones and teeth.</p><p>Excessive sulphate (&gt;500 ppm) in drinking water causes laxative effect, otherwise at moderate levels it is harmless.</p><p>The maximum limit of nitrate in drinking water is 50 ppm. Excess nitrate in drinking water can cause disease such as methemoglobinemia (&lsquo;blue baby&rsquo; syndrome).</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68246", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The water quality of a pond was analysed and its <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BOD</mi></math>&nbsp;was found to be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>. The pond has", "image": null}, "options": [{"id": "AIma5", "text": "Highly polluted water", "isCorrect": false, "image": null}, {"id": "9zj84", "text": "Water has high amount of fluoride compounds", "isCorrect": false, "image": null}, {"id": "NF3XR", "text": "Very clean water", "isCorrect": true, "image": null}, {"id": "9pfO3", "text": "Slightly polluted water", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The amount of BOD in the water is a measure of the amount of organic material in the water, in terms of how much oxygen will be required to break it down biologically.</p><p>Clean water has BOD&nbsp;value&nbsp;of less than 5 ppm whereas polluted water has a BOD value of 17 ppm or more.</p><p>So, the pond has very clean water.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68193", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The concentration of dissolved Oxygen in water for growth of fish should be more than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mi mathvariant=\"normal\">X</mi><mo>&#175;</mo></munder><mo>&#160;</mo><mi>ppm</mi></math> and Biochemical Oxygen Demand in clean water should be less than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mi mathvariant=\"normal\">Y</mi><mo>&#175;</mo></munder><mo>&#160;</mo><mi>ppm</mi></math>. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math> in ppm are, respectively.", "image": null}, "options": [{"id": "LhslV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable><mtr><mtd><mi mathvariant=\"normal\">X</mi></mtd><mtd><mi mathvariant=\"normal\">Y</mi></mtd></mtr><mtr><mtd><mn>6</mn></mtd><mtd><mn>5</mn></mtd></mtr></mtable></math>", "isCorrect": true, "image": null}, {"id": "9l05s", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable><mtr><mtd><mi mathvariant=\"normal\">X</mi></mtd><mtd><mi mathvariant=\"normal\">Y</mi></mtd></mtr><mtr><mtd><mn>4</mn></mtd><mtd><mn>8</mn></mtd></mtr></mtable></math>", "isCorrect": false, "image": null}, {"id": "O4LvL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable><mtr><mtd><mi mathvariant=\"normal\">X</mi></mtd><mtd><mi mathvariant=\"normal\">Y</mi></mtd></mtr><mtr><mtd><mn>4</mn></mtd><mtd><mn>15</mn></mtd></mtr></mtable></math>", "isCorrect": false, "image": null}, {"id": "wZcyB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable><mtr><mtd><mi mathvariant=\"normal\">X</mi></mtd><mtd><mi mathvariant=\"normal\">Y</mi></mtd></mtr><mtr><mtd><mn>6</mn></mtd><mtd><mn>12</mn></mtd></mtr></mtable></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The concentration of&nbsp;dissolved oxygen in water is very important for aquatic life. If the concentration of dissolved oxygen of water is below 6 ppm, the growth of fish gets inhibited. The amount of oxygen required by bacteria to break down the organic matter present in a certain volume of a sample of water, is called Biochemical Oxygen Demand (BOD). The amount of BOD in the water is a measure of the amount of organic material in the water, in terms of how much oxygen will be required to break it down biologically. Clean water would have BOD value of less than 5 ppm whereas highly polluted water could have a BOD value of 17 ppm or more.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67c47", "previousYearPapers": [{"_id": "63134c746e7bc9b332483706", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 1)", "title": "JEE Main 2022 (28 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Given below are two statements :</p><p>Statement I : In polluted water values of both dissolved oxygen and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BOD</mi></math> are very low.</p><p>Statement II : Eutrophication results in decrease in the amount of dissolved oxygen.</p><p>In the light of the above statements, choose the most appropriate answer from the options given below</p>", "image": null}, "options": [{"id": "uQLku", "text": "Both Statement I and Statement II are true", "isCorrect": false, "image": null}, {"id": "MkIXb", "text": "Both Statement I and Statement II are false", "isCorrect": false, "image": null}, {"id": "2WlED", "text": "Statement I is true but Statement II is false", "isCorrect": false, "image": null}, {"id": "3rAzN", "text": "Statement I is false but Statement II is true", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Since eutrophication is result of excessive growth of weed in water bodies, which consume dissolved oxygen of water bodies. So,&nbsp;Eutrophication decreases amount of dissolved oxygen in water bodies.</p><p>Polluted water has low value of dissolved oxygen, but high value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BOD</mi></math> (Biological oxygen demand), since more organic matter requires more dissolved oxygen to get decompose. Polluted water has BOD grater than 17.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "63134c746e7bc9b332483706", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 1)", "title": "JEE Main 2022 (28 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67ae1", "previousYearPapers": [{"_id": "63134c746e7bc9b332483705", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 1)", "title": "JEE Main 2022 (27 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match List I with List II</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\"><strong>List-I<br />\t\t\tPollutant</strong></td>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\"><strong>List-II<br />\t\t\tDisease /sickness</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td>A</td>\t\t\t<td>Sulphate&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#62;</mo><mn>500</mn><mi>ppm</mi></mrow></mfenced></math></td>\t\t\t<td>I</td>\t\t\t<td>Methemoglobinemia</td>\t\t</tr>\t\t<tr>\t\t\t<td>B</td>\t\t\t<td>Nitrate&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#62;</mo><mn>50</mn><mi>ppm</mi></mrow></mfenced></math></td>\t\t\t<td>II</td>\t\t\t<td>\t\t\t<p>Brown mottling of teeth</p>\t\t\t</td>\t\t</tr>\t\t<tr>\t\t\t<td>C</td>\t\t\t<td>Lead&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#62;</mo><mn>50</mn><mi>ppb</mi></mrow></mfenced></math></td>\t\t\t<td>III</td>\t\t\t<td>Laxative effect</td>\t\t</tr>\t\t<tr>\t\t\t<td>D</td>\t\t\t<td>Fluoride&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#62;</mo><mn>2</mn><mi>ppm</mi></mrow></mfenced></math></td>\t\t\t<td>IV</td>\t\t\t<td>Kidney damage</td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "YshR3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>III</mi></math>", "isCorrect": false, "image": null}, {"id": "nefAc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>II</mi></math>", "isCorrect": true, "image": null}, {"id": "BzWjN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>III</mi></math>", "isCorrect": false, "image": null}, {"id": "kpJyF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">F</mi><mo>-</mo></msup></math> ion concentration above <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi>ppm</mi></math> causes brown mottling of teeth. At the same time, excess fluoride (over <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>ppm</mi></math>) causes harmful effect to bones and teeth</p><p>Lead: Drinking water gets contaminated with lead when lead pipes are used for transportation of water. The prescribed upper limit concentration of lead in drinking water is about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi>ppb</mi></math>. Lead can damage kidney, liver, reproductive system etc.</p><p>Sulphate: Excessive sulphate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#62;</mo><mn>500</mn><mo>&#160;</mo><mi>ppm</mi></mrow></mfenced></math>&nbsp;in drinking water causes laxative effect, otherwise at moderate levels it is harmless.</p><p>Nitrate: The maximum limit of nitrate in drinking water is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi>ppm</mi></math>. Excess nitrate in drinking water can cause disease such as methaemoglobinaemia (&#39;blue baby&#39; syndrome).</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "63134c746e7bc9b332483705", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 1)", "title": "JEE Main 2022 (27 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d679d2", "previousYearPapers": [{"_id": "63134c746e7bc9b332483709", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 2)", "title": "JEE Main 2022 (26 Jul Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match List I with List II</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\">\t\t\t<p><strong>List-I</strong></p>\t\t\t<p><strong>Pollutant</strong></p>\t\t\t</td>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\">\t\t\t<p><strong>List-II</strong></p>\t\t\t<p><strong>Source</strong></p>\t\t\t</td>\t\t</tr>\t\t<tr>\t\t\t<td>A</td>\t\t\t<td>Microorganisms</td>\t\t\t<td>I</td>\t\t\t<td>Strip mining</td>\t\t</tr>\t\t<tr>\t\t\t<td>B</td>\t\t\t<td>Plant nutrients</td>\t\t\t<td>II</td>\t\t\t<td>Domestic sewage</td>\t\t</tr>\t\t<tr>\t\t\t<td>C</td>\t\t\t<td>Toxic heavy metals</td>\t\t\t<td>III</td>\t\t\t<td>Chemical fertilizer</td>\t\t</tr>\t\t<tr>\t\t\t<td>D</td>\t\t\t<td>Sediment</td>\t\t\t<td>IV</td>\t\t\t<td>Chemical factory</td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "BeZyl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi></math>", "isCorrect": true, "image": null}, {"id": "9We5d", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>III</mi></math>", "isCorrect": false, "image": null}, {"id": "BItGs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>III</mi></math>", "isCorrect": false, "image": null}, {"id": "O7Z3t", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>II</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Pollution of water originates from human activities. Through different paths, pollution reaches surface or ground water.</p><p>water soluble inorganic chemicals that include heavy metals such as cadmium, mercury, nickel etc constitute an important class of pollutants. All these metals are dangerous to humans because our body cannot excrete them. Over the time, it crosses the tolerance limit. These metals then can damage kidneys, central nervous system, liver etc</p><p>&nbsp;Clean water would have BOD value of less than 5 ppm whereas highly polluted water could have a&nbsp;value of 17 ppm or more</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td style=\"text-align: center;\"><strong>List-I<br />\t\t\tPollutant</strong></td>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\"><strong>List-II<br />\t\t\tSource</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td>A</td>\t\t\t<td>Microorganisms</td>\t\t\t<td>II</td>\t\t\t<td>Domestic sewage</td>\t\t</tr>\t\t<tr>\t\t\t<td>B</td>\t\t\t<td>Plant nutrients</td>\t\t\t<td>III</td>\t\t\t<td>Chemical fertilizer</td>\t\t</tr>\t\t<tr>\t\t\t<td>C</td>\t\t\t<td>Toxic heavy metals</td>\t\t\t<td>IV</td>\t\t\t<td>Industries and chemical factories</td>\t\t</tr>\t\t<tr>\t\t\t<td>D</td>\t\t\t<td>Sediment</td>\t\t\t<td>I</td>\t\t\t<td>Erosion of soil by agriculture and strip mining</td>\t\t</tr>\t</tbody></table></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "63134c746e7bc9b332483709", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 2)", "title": "JEE Main 2022 (26 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d6786a", "previousYearPapers": [{"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 2)", "title": "JEE Main 2022 (25 Jul Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>Match List I with List II.</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\"><strong>List-I</strong></td>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\"><strong>List-II</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td>A</td>\t\t\t<td>Sulphate</td>\t\t\t<td>I</td>\t\t\t<td>Pesticide</td>\t\t</tr>\t\t<tr>\t\t\t<td>B</td>\t\t\t<td>Fluoride</td>\t\t\t<td>II</td>\t\t\t<td>Bending of bones</td>\t\t</tr>\t\t<tr>\t\t\t<td>C</td>\t\t\t<td>Nicotine</td>\t\t\t<td>III</td>\t\t\t<td>Laxative effect</td>\t\t</tr>\t\t<tr>\t\t\t<td>D</td>\t\t\t<td>Sodium arsinite</td>\t\t\t<td>IV</td>\t\t\t<td>Herbicide</td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "wGugq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi></math>", "isCorrect": false, "image": null}, {"id": "2gjn1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>IV</mi></math>", "isCorrect": true, "image": null}, {"id": "guYBy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi></math>", "isCorrect": false, "image": null}, {"id": "2xw2m", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>-Sulphate - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>III</mi></math> (Laxative effect)</p><p>Sulfates are a large part of the haze pollution that&nbsp;irritates the lungs and affects your lung health.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>-Fluoride - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math>&nbsp;(Bending of bones)</p><p>Fluoride is a neurotoxin which,&nbsp;in high doses, can be harmful. Excessive exposure can lead to tooth discoloration and bone problems.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>-Nictoine - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math>&nbsp;(pesticides)</p><p>Nicotine has been used as a <span style=\"background-color:null;\">natural</span><span style=\"background-color:null;\"> </span> insecticide and is the archetype for the large range of synthetic neonicotinoid insecticides.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi></math>-Sodium Arsinite - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>IV</mi></math>&nbsp;(herbicide)</p><p>Inorganic arsenicals (arsenic trioxide,&nbsp;<em>sodium arsenite</em>&nbsp;and lead arsenate) have been used as rodenticides and herbicides.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 2)", "title": "JEE Main 2022 (25 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67a84", "previousYearPapers": [{"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The measured <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BOD</mi></math> values tor four difterent water samples <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi mathvariant=\"normal\">D</mi></mrow></mfenced></math>&nbsp;are as tollows: <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>=</mo><mn>3</mn></math>&nbsp;ppm; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>=</mo><mn>18</mn></math>&nbsp;ppm; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi><mo>=</mo><mn>21</mn></math>&nbsp;ppm; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi><mo>=</mo><mn>4</mn></math>&nbsp;ppm. The water samples which can be called as highly polluted with organic wastes, are", "image": null}, "options": [{"id": "jhWEl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>&#38;</mo><mi mathvariant=\"normal\">B</mi></math>", "isCorrect": false, "image": null}, {"id": "j3K6T", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>&#38;</mo><mi mathvariant=\"normal\">D</mi></math>", "isCorrect": false, "image": null}, {"id": "45Vck", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>&#38;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": true, "image": null}, {"id": "TY2Gm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>&#38;</mo><mi mathvariant=\"normal\">D</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The amount of oxygen required by bacteria to break down the organic matter present in a certain volume of a sample of water, is called Biochemical Oxygen Demand (BOD).</p><p>The amount of BOD in the water is a measure of the amount of organic material in the water, in terms of how much oxygen will be required to break it down biologically.</p><p>Clean water would have BOD value of less than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> ppm whereas highly polluted water could have a BOD value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>17</mn></math> ppm or more.</p><p>Hence,Among the given samples, sample number&nbsp;B&nbsp;and C&nbsp;are polluted.</p>", "image": null}, "videoSolution": {"videoId": "18a03494ac554a48813548a7f9d0401f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/LrZjNFZq0DpWM.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/LrZjNFZq0DpWM.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d6791e", "previousYearPapers": [{"_id": "62c481f001514d218a7934d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 2)", "title": "JEE Main 2022 (25 Jun Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Given below are two statements: one is labelled as Assertion and the other is labelled as Reason.</p><p><strong>Assertion:</strong>&nbsp;Polluted water may have a value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BOD</mi></math> of the order of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>17</mn><mi>ppm</mi></math>.</p><p><strong>Reason:</strong>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BOD</mi></math> is a measure of oxygen required to oxidise both the biodegradable and non-biodegradable organic material in water.</p><p>In the light of the above statements, choose the <em>most appropriate</em> answer from the options given below.</p>", "image": null}, "options": [{"id": "d5wP8", "text": "Both Assertion and Reason are true and Reason is the correct explanation of Assertion.", "isCorrect": false, "image": null}, {"id": "68Ro6", "text": "Both Assertion and Reason are true but Reason is NOT the correct explanation of Assertion.", "isCorrect": false, "image": null}, {"id": "dSwzW", "text": "Assertion is true but Reason is false.", "isCorrect": true, "image": null}, {"id": "logCg", "text": "Assertion is false but Reason is true.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The amount of oxygen required by bacteria to break down the organic matter present in a certain volume of a sample of water, is called Biochemical Oxygen Demand (BOD). The amount of BOD in the water is a measure of the amount of organic material in the water, in terms of how much oxygen will be required to break it down biologically. Clean water would have BOD value of less than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#160;</mo><mi>ppm</mi></math> whereas highly polluted water could have a BOD value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>17</mn><mo>&#160;</mo><mi>ppm</mi></math> or more.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["ASSERTION_REASON"], "previousYear": {"_id": "62c481f001514d218a7934d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 2)", "title": "JEE Main 2022 (25 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d678c2", "previousYearPapers": [{"_id": "62c481f001514d218a7934d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 1)", "title": "JEE Main 2022 (25 Jun Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The eutrophication of water body results in", "image": null}, "options": [{"id": "VqWrZ", "text": "Increase in biodiversity", "isCorrect": false, "image": null}, {"id": "WYhOr", "text": "Loss in biodiversity", "isCorrect": true, "image": null}, {"id": "fBQT8", "text": "Break down of organic matter", "isCorrect": false, "image": null}, {"id": "K3cnq", "text": "decrease in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BOD</mi></math>.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The addition of phosphates in water enhances algae growth. Such profuse growth of algae, covers the water surface and reduces the oxygen concentration in water. This leads to anaerobic conditions, commonly with accumulation of abnoxious decay and animal death. Thus, bloom-infested water inhibits the growth of other living organisms in the water body. This process in which nutrient enriched water bodies support a dense plant population, which kills animal life by depriving it of oxygen and results in subsequent loss of biodiversity is known as Eutrophication.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 1)", "title": "JEE Main 2022 (25 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66e34", "previousYe /MathML\"><mi>BOD</mi></math> value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>17</mn><mo>&#160;</mo><mi>ppm</mi></math> or more.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T09:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 1)", "title": "JEE Main 2021 (31 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d673d9", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 1)", "title": "JEE Main 2021 (26 Aug Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The conversion of hydroxyapatite occurs due to presence of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">F</mi><mo>-</mo></msup></math>ions in water. The correct formula of hydroxyapatite is:", "image": null}, "options": [{"id": "BclGF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><msub><mi>Ca</mi><mn>3</mn></msub><msub><mfenced><msub><mi>PO</mi><mn>4</mn></msub></mfenced><mn>2</mn></msub><mo>&#183;</mo><msub><mi>CaF</mi><mn>2</mn></msub></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "CQIaL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><mn>3</mn><msub><mi>Ca</mi><mn>3</mn></msub><msub><mfenced><msub><mi>PO</mi><mn>4</mn></msub></mfenced><mn>2</mn></msub><mo>&#183;</mo><mi>Ca</mi><mo>(</mo><mi>OH</mi><msub><mo>)</mo><mn>2</mn></msub></mrow></mfenced></math>", "isCorrect": true, "image": null}, {"id": "0o2IQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><mn>3</mn><msub><mi>Ca</mi><mn>3</mn></msub><msub><mfenced><msub><mi>PO</mi><mn>4</mn></msub></mfenced><mn>2</mn></msub><mo>&#183;</mo><msub><mi>CaF</mi><mn>2</mn></msub></mrow></mfenced></math>", "isCorrect": false, "image": null}, {"id": "H0DLf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"[\" close=\"]\"><mrow><mn>3</mn><mi>Ca</mi><mo>(</mo><mi>OH</mi><msub><mo>)</mo><mn>2</mn></msub><mo>&#183;</mo><msub><mi>CaF</mi><mn>2</mn></msub></mrow></mfenced></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Hydroxyapatite <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8594;</mo><mfenced close=\"]\" open=\"[\"><mrow><mn>3</mn><msub><mi>Ca</mi><mn>3</mn></msub><msub><mfenced><msub><mi>PO</mi><mn>4</mn></msub></mfenced><mn>2</mn></msub><mo>&#183;</mo><mi>Ca</mi><mo>(</mo><mi>OH</mi><msub><mo>)</mo><mn>2</mn></msub></mrow></mfenced></math><br />Hydroxyapatite in presence of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">F</mi><mo>-</mo></msup></math>ions converts to fluorapatite <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><mn>3</mn><msub><mi>Ca</mi><mn>3</mn></msub><msub><mfenced><msub><mi>PO</mi><mn>4</mn></msub></mfenced><mn>2</mn></msub><mo>&#183;</mo><msub><mi>CaF</mi><mn>2</mn></msub></mrow></mfenced></math>.", "image": null}, "videoSolution": {"videoId": "36b60153b3164c9cb0058e7e22a85212", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/MTxqB7elD2J7F.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/MTxqB7elD2J7F.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 1)", "title": "JEE Main 2021 (26 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d675f1", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf819", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-27T09:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Jul Shift 1)", "title": "JEE Main 2021 (27 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Which one of the following statements is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NOT</mi></math>&nbsp;correct?", "image": null}, "options": [{"id": "lc0N1", "text": "Eutrophication indicates that water body is polluted", "isCorrect": false, "image": null}, {"id": "ztCKw", "text": "The dissolved oxygen concentration below <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn></mn></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#160;</mo><mi>ppm</mi></math> inhibits fish growth", "isCorrect": false, "image": null}, {"id": "gnTOk", "text": "Eutrophication leads to increase in the oxygen level in water", "isCorrect": true, "image": null}, {"id": "nQY03", "text": "Eutrophication leads to anaerobic conditions", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Eutrophication leads to decrease in oxygen level of water.</p><p>Eutrophication is the process by which an entire body of water, or parts of it, becomes progressively enriched with minerals and nutrients, particularly nitrogen and phosphorus. It has also been defined as &quot;nutrient-induced increase in phytoplankton productivity&quot;.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf819", "examId": "615d76b2c5 O</mi><mn>2</mn></msub></math> is used as bleaching agent in laundry.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf817", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Jul Shift 1)", "title": "JEE Main 2021 (25 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d67157", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf816", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Jul Shift 1)", "title": "JEE Main 2021 (22 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The water having more dissolved <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math> is :", "image": null}, "options": [{"id": "j90v8", "text": "boiling water", "isCorrect": false, "image": null}, {"id": "UzxFV", "text": "water at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "Qoop4", "text": "polluted water", "isCorrect": false, "image": null}, {"id": "rZYwT", "text": "water at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "On heating concentration of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math> in water decreases. So boiling water and water at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> having less <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math> concentration. Polluted water also having less <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>&nbsp;concentration. So water at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;is having maximum&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math> concentration.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf816", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Jul Shift 1)", "title": "JEE Main 2021 (22 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d67059", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf813", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-18T14:00:00.000Z", "isVisible": true, "shortName": "2021 (18 Mar Shift 2)", "title": "JEE Main 2021 (18 Mar Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Given below are two statements :</p><p>Statement I : Non-biodegradable wastes are generated by the thermal power plants.</p><p>Statement II : Bio-degradable detergents leads to eutrophication.</p><p>In the light of the above statements, choose the most appropriate answer from the option given below:</p>", "image": null}, "options": [{"id": "fCe2C", "text": "Both statement I and statement II are false", "isCorrect": false, "image": null}, {"id": "iXaOW", "text": "Statement I is true but statement II is false", "isCorrect": false, "image": null}, {"id": "F3gbl", "text": "Statement I is false but statement II is true", "isCorrect": false, "image": null}, {"id": "8nb06", "text": "Both statement I and statement II are true.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Non-biodegradable wastes are generated by the thermal power plants, which produces fly ash. Detergents which are biodegradable cause&nbsp;problem called eutrophication which kills animal life by depriving it of oxygen.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "615d92edde3d91842a5cf813", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-18T14:00:00.000Z", "isVisible": true, "shortName": "2021 (18 Mar Shift 2)", "title": "JEE Main 2021 (18 Mar Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66fa6", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf811", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-17T14:00:00.000Z", "isVisible": true, "shortName": "2021 (17 Mar Shift 2)", "title": "JEE Main 2021 (17 Mar Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Which of the following statement(s) is (are)<br />incorrect reason for eutrophication?<br />(A) excess usage of fertilisers<br />(B) excess usage of detergents<br />(C) dense plant population in water bodies<br />(D) lack of nutrients in water bodies that prevent plant growth</p><p>Choose the most appropriate answer from the options given below :</p>", "image": null}, "options": [{"id": "ggTlI", "text": "(A) only", "isCorrect": false, "image": null}, {"id": "K842n", "text": "(C) only", "isCorrect": false, "image": null}, {"id": "nu1Zh", "text": "(B) and (D) only", "isCorrect": false, "image": null}, {"id": "5UOCA", "text": "(D) only", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The process in which nutrient enriched water bodies support a dense plant population which kills animal life by depriving it of oxygen and results in subsequent loss of biodiversity is known as eutrophication.", "image": null}, "vi th xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>ppm</mi></math> and&nbsp;optimum limit of BOD ranges from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>-</mo><mn>20</mn><mo>&#160;</mo><mi>ppm</mi></math>&nbsp;&amp; BOD stands for biochemical oxygen demand.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "615d92edde3d91842a5cf809", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Feb Shift 2)", "title": "JEE Main 2021 (24 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66b4d", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf804", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-05T09:00:00.000Z", "isVisible": true, "shortName": "2020 (05 Sep Shift 1)", "title": "JEE Main 2020 (05 Sep Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The condition that indicates a polluted environment is:", "image": null}, "options": [{"id": "uLN3B", "text": "eutrophication", "isCorrect": true, "image": null}, {"id": "aZguL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>03</mn><mo>%</mo></math> of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math> in the atmosphere", "isCorrect": false, "image": null}, {"id": "i2bge", "text": "BOD value of 5 ppm", "isCorrect": false, "image": null}, {"id": "zyCz5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>pH</mi></math> of rain water to be 5.6", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "(2) Clean water would have B.O.D value of less than 5 ppm whereas highly polluted water coluld have a<br />B.O.D value of 17 ppm or more.<br />(3) The process in which nutrient enriched water bodies support a dense plant population which kill animal life by depriving it of oxygen results in subsequent loss of biodiversity is known as Eutrophication.<br />(4) If the concentration of dissolved oxygen of water is below 6 ppm, the growth of fish get inhibited.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf804", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-05T09:00:00.000Z", "isVisible": true, "shortName": "2020 (05 Sep Shift 1)", "title": "JEE Main 2020 (05 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66df1", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7fd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2020 (09 Jan Shift 2)", "title": "JEE Main 2020 (09 Jan Shift 2)"}], "type": "numerical", "level": 1, "question": {"text": "<math><mn>10.30</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">g</mi></math> of <math><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is dissolved into a liter of sea water of density <math><mn>1.03</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">g</mi><mo>/</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">L</mi></math> . The concentration of <math><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> in ppm is _____________.", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "<p>Formula of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ppm</mi></math>&nbsp;is-</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ppm</mi><mo>=</mo><mfrac><mrow><mi>weight</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi>solute</mi></mrow><mrow><mi>weight</mi><mo>&#160;</mo><mi>of</mi ldOn": "2019-01-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 1)", "title": "JEE Main 2019 (10 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d665b4", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 2)", "title": "JEE Main 2019 (09 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which of the following conditions in drinking water causes methemoglobinemia?", "image": null}, "options": [{"id": "suHSA", "text": "<math><mo>&gt;</mo><mn>50</mn></math> ppm of nitrate", "isCorrect": true, "image": null}, {"id": "V8tkU", "text": "<math><mo>&gt;</mo><mn>50</mn></math> ppm of chloride", "isCorrect": false, "image": null}, {"id": "f6HcW", "text": "<math><mo>&gt;</mo><mn>100</mn></math> ppm of sulphate", "isCorrect": false, "image": null}, {"id": "CNMyL", "text": "<math><mo>&gt;</mo><mn>50</mn></math> ppm of lead", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Methemoglobinemia disease occur due to <math><mi>N</mi><msubsup><mrow><mi>O</mi></mrow><mrow><mn>3</mn></mrow><mrow><mo>-</mo></mrow></msubsup></math>, when it's concentration is higher than <math><mn>50</mn><mi>&nbsp;</mi><mi>p</mi><mi>p</mi><mi>m</mi><mi>&nbsp;</mi></math>in water.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 2)", "title": "JEE Main 2019 (09 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d665b2", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 2)", "title": "JEE Main 2019 (09 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The pH of rain water is approximately:", "image": null}, "options": [{"id": "PR8wt", "text": "<math><mn>5.6</mn></math>", "isCorrect": true, "image": null}, {"id": "qIcNm", "text": "<math><mn>6.5</mn></math>", "isCorrect": false, "image": null}, {"id": "kN3ZN", "text": "<math><mn>7.5</mn></math>", "isCorrect": false, "image": null}, {"id": "SEmri", "text": "<math><mn>7.0</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Normal, clean rain has a pH value of between 5.0 and 5.6, which is slightly acidic. However, when rain combines with sulfur dioxide or nitrogen oxides produced from power plants and automobiles the rain becomes much more acidic. Typical acid rain has a pH value of 4.0.</p><p>Rain water becomes acidic because gases present in environment are dissolved, so&nbsp;it&#39;s pH will be less than 7.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 2)", "title": "JEE Main 2019 (09 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d66548", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 1)", "title": "JEE Main 2019 (09 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A water sample has ppm level concentration of the following metals:<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Fe</mi><mo>=</mo><mn>0</mn><mo>.2</mo><mo>;</mo><mo>&#160;</mo><mi>Mn</mi> rect": false}], "correctValue": null, "solution": {"text": "<strong>Ions</strong>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <strong>Maximum prescribed<br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; concentration&nbsp;in drinking water</strong><br /><br />Fluoride&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>ppm</mi></math><br /><br />Sulphate&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>500</mn><mo>&#160;</mo><mi>ppm</mi></math><br /><br />Nitrate&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi>ppm</mi></math><br /><br /><br /><span style=\"font-size:16px;\">Fluoride ion concentration is more than the limit, so it makes&nbsp;water unsuitable for drinking</span><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6489", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-02T09:00:00.000Z", "isVisible": true, "shortName": "2017 (02 Apr)", "title": "JEE Main 2017 (02 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d6605b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7df", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2016 (09 Apr Online)", "title": "JEE Main 2016 (09 Apr Online)"}], "question": {"text": "BOD stands for:", "image": null}, "options": [{"id": "d9fUL", "text": "Bacterial Oxidation Demand", "image": null, "isCorrect": false}, {"id": "H4mgc", "text": "Biological oxygen demand", "image": null, "isCorrect": false}, {"id": "bHLt7", "text": "Biochemic
