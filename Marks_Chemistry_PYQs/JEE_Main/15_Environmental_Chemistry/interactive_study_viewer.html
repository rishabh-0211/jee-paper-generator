alse, "image": null}, {"id": "433j6", "text": "&nbsp;steel manufacturing<br />&nbsp;", "isCorrect": false, "image": null}, {"id": "hHLDY", "text": "Electricity generation in thermal power plants.<br />&nbsp;", "isCorrect": false, "image": null}, {"id": "CjdVl", "text": "&nbsp;Industrial production of urea", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "In urea industry, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub></math>,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><msub><mi>CO</mi><mn>2</mn></msub></math>&nbsp;&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math>&nbsp;are consumed and no greenhouse gases are emitted. So, it is least resposible for global warming.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67b39", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 2)", "title": "JEE Main 2022 (27 Jul Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Given below are two statements:</p><p>Statement I : The non bio-degradable fly ash and slag from steel industry can be used by cement industry.</p><p>Statement II : The fuel obtained from plastic waste is lead free.</p><p>In the light of the above statements, choose the most appropriate answer from the options given below</p>", "image": null}, "options": [{"id": "RCF2B", "text": "Both Statement I and Statement II are correct", "isCorrect": true, "image": null}, {"id": "H658T", "text": "Both Statement I and Statement II are incorrect", "isCorrect": false, "image": null}, {"id": "Lua4k", "text": "Statement&nbsp;I&nbsp;is correct but Statement II is incorrect", "isCorrect": false, "image": null}, {"id": "2smeX", "text": "Statement I is incorrect but Statement II is correct", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>(I) The disposal of non-degradable industrial solid wastes, if not done by a proper and suitable method, may cause serious threat to the environment. New innovations have led to different uses of waste material. Nowadays, fly ash and slag from the steel industry are utilised by the cement industry.</p><p>(II) Fuel obtained from plastic waste has high octane rating. It contains no lead and it is known as green fuel.</p><p>Both statement (I) &amp; (II) are correct.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "63134c746e7bc9b33248370a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 2)", "title": "JEE Main 2022 (27 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d67650", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Jul Shift 2)", "title": "JEE Main 2021 (27 Jul Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match List - I with List - II :</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td>List - I (compound)</td>\t\t\t<td>&nbsp;</td>\t\t\t<td>List - II<br />\t\t\t(effect/affected sp ": 1, "question": {"text": "The gas released during anaerobic degradation of vegetation may lead to:", "image": null}, "options": [{"id": "vlFYI", "text": "Corrosion of metals", "isCorrect": false, "image": null}, {"id": "gMKE9", "text": "Ozone hole", "isCorrect": false, "image": null}, {"id": "QHXlk", "text": "Global warming and cancer", "isCorrect": true, "image": null}, {"id": "rZwgD", "text": "Acid rain", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>4</mn></msub></math> evolved due to anaerobic degradation of vegetation, which causes global warming and cancer.</p><p>Anaerobic degradation means the breakdown in the absence of oxygen. During anaerobic degradation of vegetation, CH<sub>4</sub>&nbsp;is produced, which is responsible for global warming as it absorbs sun&rsquo;s heat. It is also known to cause cancer.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf808", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Feb Shift 1)", "title": "JEE Main 2021 (24 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d663f0", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 1)", "title": "JEE Main 2019 (08 Apr Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which is wrong with respect to our responsibility as a human being to protect our environment?", "image": null}, "options": [{"id": "smGEy", "text": "Using plastic bags.", "isCorrect": true, "image": null}, {"id": "AeqXS", "text": "Restricting the use of vehicles", "isCorrect": false, "image": null}  "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "648b5a74417cc3fb48d693c1", "title": "Air Pollution", "totalQuestions": 61, "questions": [{"_id": "648b5a71417cc3fb48d68728", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}], "question": {"text": "The possibility of photochemical smog formation will be minimum at", "image": null}, "options": [{"id": "BA8ol", "text": "Srinagar, Jammu and Kashmir in January", "image": null, "isCorrect": true}, {"id": "CTesr", "text": "Kolkata in October", "image": null, "isCorrect": false}, {"id": "XByZm", "text": "Mumbai in May", "image": null, "isCorrect": false}, {"id": "ai7fK", "text": "New-Delhi in August (Summer)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Photochemical smog is a mixture of pollutants that are formed when nitrogen oxides and volatile organic compounds (VOCs) react to sunlight, creating a brown haze above cities. It tends to occur more often in summer, because that is when we have the most sunlight. The average temperature of Kashmir in January is estimated to be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>3</mn><mo>.</mo><mn>6</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> in Srinagar, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>11</mn><mo>.</mo><mn>8</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> in Pahalgam, and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>10</mn><mo>.</mo><mn>4</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> in Gulmarg as their minimum temperatures.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d686db", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6495", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 Apr Shift 2)", "title": "JEE Main 2023 (13 Apr Shift 2)"}], "question": {"text": "<p>Which of the following are the Green house gases?</p><p>A. Water vapour</p><p>B.Ozone</p><p>C.<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">I</mi><mn>2</mn></msub></math></p><p>D.Molecular hydrogen</p><p>Choose the most appropriate answer from the options given below :</p>", "image": null}, "options": [{"id": "NI0Pu", "text": "<p>A and D only</p><p>&nbsp;</p>", "image": null, "isCorrect": false}, {"id": "qQTYG", "text": "B and C only", "image": null, "isCorrect": false}, {"id": "QgXRu", "text": "&nbsp;A and B only", "image": null, "isCorrect": true}, {"id": "474xD", "text": "C and D only", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The greenhouse effect is a process that occurs when gases in Earth&#39;s atmosphere trap the Sun&#39;s heat. This process makes Earth much warmer than it would be without an atmosphere.&nbsp;The main greenhouse gases whose concentrations are rising are carbon dioxide, methane, nitrous oxide, hydrochlorofluorocarbons (HCFCs), hydrofluor rectValue": null, "solution": {"text": "<p>Chlorofluorocarbons&nbsp; are chemicals which contain carbon, chlorine and fluorine. Ozone layer breaks when these CFC&#39;s are released&nbsp; into the atmosphere.So. Chlorine&nbsp;is one of the radical which belongs to CFC&#39;s family, responsible for break down.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6494", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 Apr Shift 1)", "title": "JEE Main 2023 (13 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d685bc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}], "question": {"text": "Which of the following compounds is an example of Freon?", "image": null}, "options": [{"id": "cgJb9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mo>&#160;</mo><msub><mi mathvariant=\"normal\">F</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "fUhSL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><mo>&#160;</mo><msub><mi mathvariant=\"normal\">F</mi><mn>4</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "8dOYB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><msub><mi>HF</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "Glvoz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><msub><mi>Cl</mi><mn>2</mn></msub><mo>&#160;</mo><msub><mi mathvariant=\"normal\">F</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><msub><mi>Cl</mi><mn>2</mn></msub><mo>&#8203;</mo><msub><mi mathvariant=\"normal\">F</mi><mn>2</mn></msub></math>​&nbsp;is an example of freon. It can act as an aerosol propellant, refrigerant, or organic solvent because it is&nbsp;a gas at room temperature and a liquid when cooled or compressed. Freon is a term that was commonly used to refer to a group of chlorofluorocarbon (CFC) and hydrochlorofluorocarbon (HCFC) compounds.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68519", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6491", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 2)", "title": "JEE Main 2023 (10 Apr Shift 2)"}], "question": {"text": "The delicate balance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math> is NOT disturbed by", "image": null}, "options": [{"id": "sHk4I", "text": "Respiration", "image": null, "isCorrect": true}, {"id": "bYwA3", "text": "Burning of coal", "image": null, "isCorrect": false}, {"id": "IlaOO", "text": "Deforestation", "image": null, "isCorrect": false}, {"id": "etDHN", "text": "Burning of petroleum", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Plants use up carbon dioxide during photosynthesis and release oxygen into the atmosphere. This maintains the delicate balance between oxygen and carbon dioxide in the atmosphere.</p><p>The burning of fuels and cutting of trees is disturbing this balance in nature. As a result of such activities, the amount of carbon dioxide in the air is going up and the level of oxygen is coming down. Continuous and excessive use of fuels and deforestation would increase this imbalance. This is bringing about a warming of the atmosphere, called global warming.&nbsp;Respiration, is a natural process, So balance of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math> not disturbed by respiration.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6491", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 2)", "title": "JEE Main 2023 (10 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d6845f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 2)", "title": "JEE Main 2023 (08 Apr Shift 2)"}], "question": {"text": "Which of these reactions is not a part of breakdown of ozone in stratosphere?", "image": null}, "options": [{"id": "LLmQh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mover><mi>Cl</mi><mo>&#8857;</mo></mover><mi mathvariant=\"normal\">O</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mover><mo>&#8594;</mo><mrow/></mover><msub><mi>ClO</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><mover><mi>Cl</mi><mo>&#8857;</mo></mover><mfenced><mi mathvariant=\"normal\">g</mi></mfenced></math>", "image": null, "isCorrect": true}, {"id": "3WJBM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mrow><mi>ClO</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced></mrow><mo>&#8857;</mo></mover><mo>+</mo><mi mathvariant=\"normal\">O</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mover><mo>&#8594;</mo><mrow/></mover><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><mover><mi>Cl</mi><mo>&#8857;</mo></mover></math>", "image": null, "isCorrect": false}, {"id": "jxyNt", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>Cl</mi><mo>&#8857;</mo></mover><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mover><mo>&#8594;</mo><mrow/></mover><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><mover><mrow><mi>ClO</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced></mrow><mo>&#8857;</mo></mover></math></p>", "image": null, "isCorrect": false}, {"id": "rx8Ci", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CF</mi><mn>2</mn></msub><msub><mi>Cl</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mover><mo>&#8594;</mo><mi>uv</mi></mover><mover><mi>Cl</mi><mo>&#8857;</mo></mover><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><mover><mi mathvariant=\"normal\">C</mi><mo>&#8857;</mo></mover><msub><mi mathvariant=\"normal\">F</mi><mn>2</mn></msub><mi>Cl</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Chlorofluorocarbon compounds (CFCs)&nbsp;are non-reactive, non-flammable molecules that are used in refrigerators, air conditioners, plastics, and electronic industries. Once released CFCs mix with atmospheric gases and reach the stratosphere, where they are decomposed by UV radiations.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CF</mi><mn>2</mn></msub><msub><mi>Cl</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mover><mo>&#8594;</mo><mi>uv</mi></mover><mover><mi>Cl</mi><mo>&#8857;</mo></mover><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><mover><mi mathvariant=\"normal\">C</mi><mo>&#8857;</mo></mover><msub><mi mathvariant=\"normal\">F</mi><mn>2</mn></msub><mi>Cl</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced></math></p><p>The chlorine radical released will react with ozone.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>Cl</mi><mo>&#8857;</mo></mover><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mover><mo>&#8594;</mo><mrow></mrow></mover><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><mover><mrow><mi>ClO</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced></mrow><mo>&#8857;</mo></mover></math></p><p>The&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>Cl</mi><mo>&#8857;</mo></mover><mi mathvariant=\"normal\">O</mi></math>&nbsp;will generate chlorine radicals again</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mrow><mi>ClO</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced></mrow><mo>&#8857;</mo></mover><mo>+</mo><mi mathvariant=\"normal\">O</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mover><mo>&#8594;</mo><mrow></mrow></mover><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><mover><mi>Cl</mi><mo>&#8857;</mo></mover></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "d3268af74c1c4c05b5a1b2c13bde2ed0", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/FHf1d9zXcD39f.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/FHf1d9zXcD39f.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 2)", "title": "JEE Main 2023 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d6834b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 1)", "title": "JEE Main 2023 (06 Apr Shift 1)"}], "question": {"text": "The possibility of photochemical smog formation is more at", "image": null}, "options": [{"id": "5Rk0y", "text": "<p>Marshy lands</p>", "image": null, "isCorrect": false}, {"id": "WqCDI", "text": "<p>Industrial areas</p>", "image": null, "isCorrect": true}, {"id": "5UxmV", "text": "<p>Himalayan villages in winter</p>", "image": null, "isCorrect": false}, {"id": "Xe4Yy", "text": "<p>The places with healthy vegetation</p>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Photochemical smog is a mixture of pollutants that are formed when nitrogen oxides and volatile organic compounds (VOCs) react to sunlight, creating a brown haze above cities. It tends to occur more often in summer, because that is when we have the most sunlight.</p><p>Photochemical smog formation will be more at Industrial areas.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 1)", "title": "JEE Main 2023 (06 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67f1d", "previousYearPapers": [{"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "How can photochemical smog be controlled?", "image": null}, "options": [{"id": "mcWzK", "text": "By using tall chimneys<br />&nbsp;", "isCorrect": false, "image": null}, {"id": "wTHD9", "text": "By complete combustion of fuel", "isCorrect": false, "image": null}, {"id": "pl1y9", "text": "By using catalytic converters in the&nbsp;automobiles/industry", "isCorrect": true, "image": null}, {"id": "RuQiP", "text": "By using catalyst", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Catalytic converters force <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CO</mi></math> and incompletely combusted hydrocarbons to react with a metal catalyst, typically platinum, to produce <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub><mo>&#160;</mo></math>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>. Additionally, catalytic converters reduce nitrogen oxides from exhaust gases into <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub></math>, eliminating the cycle of ozone formation.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d682f0", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The normal rain water is slightly acidic and its <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>pH</mi></math> value is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>6</mn></math>&nbsp;because of which one of the following ?", "image": null}, "options": [{"id": "UmMgD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#8594;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "YMy70", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>5</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#8594;</mo><mn>2</mn><msub><mi>HNO</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "G4Hby", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>SO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>+</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#8594;</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>SO</mi><mn>4</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "3sp3U", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi>NO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>+</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#8594;</mo><mn>4</mn><msub><mi>HNO</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Rain water has a&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>pH</mi></math>&nbsp;of&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>-</mo><mn>6</mn></math>&nbsp;due to presence of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">H</mi><mo>+</mo></msup></math>ions formed by the reaction of rain water with carbon dioxide present in the atmosphere.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>(</mo><mi mathvariant=\"normal\">l</mi><mo>)</mo><mo>+</mo><msub><mi>CO</mi><mn>2</mn></msub><mo>(</mo><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo><mo>&#8652;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub><mo>&#8652;</mo><msup><mi mathvariant=\"normal\">H</mi><mo>+</mo></msup><mo>+</mo><msub><mi>HCO</mi><mn>3</mn></msub></math></p><p>So, the correct option is A.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d681dd", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Formation of photochemical smog involves the following reaction in which <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> are respectively.</p><p>(i) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub><mover><mo>&#10230;</mo><mi>hu</mi></mover><mi mathvariant=\"normal\">A</mi><mo>+</mo><mi mathvariant=\"normal\">B</mi></math></p><p>(ii) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#8594;</mo><mi mathvariant=\"normal\">C</mi></math></p><p>(iii) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>+</mo><mi mathvariant=\"normal\">C</mi><mo>&#8594;</mo><msub><mi>NO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math></p><p>Choose the correct answer from the options given below:</p>", "image": null}, "options": [{"id": "rHRmF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi><mo>,</mo><mi>NO</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi>NO</mi><mn>3</mn><mo>-</mo></msubsup></math>", "isCorrect": false, "image": null}, {"id": "U5kgY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi><mo>,</mo><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NO</mi></math>", "isCorrect": false, "image": null}, {"id": "Zp1OT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>,</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "PrVoD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NO</mi><mo>,</mo><mi mathvariant=\"normal\">O</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>When fossil fuels are burnt, a variety of pollutants are emitted into the earth&rsquo;s&nbsp;troposphere.&nbsp;When these pollutants build up to sufficiently high levels, a chain reaction occurs from their interaction with sunlight in which <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NO</mi></math> is converted into nitrogen dioxide (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math>). This&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math>&nbsp;in turn absorbs energy from sunlight and breaks up into nitric oxide and free oxygen atom.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable><mtr><mtd><msub><mi>NO</mi><mn>2</mn></msub><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mtd><mtd><mover><mo>&#8594;</mo><mi>hv</mi></mover></mtd><mtd><mi>NO</mi><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mtd><mtd><mo>+</mo></mtd><mtd><mi mathvariant=\"normal\">O</mi><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mtd></mtr><mtr><mtd><mo>&#160;</mo></mtd><mtd><mo>&#160;</mo></mtd><mtd><mfenced><mi mathvariant=\"normal\">A</mi></mfenced></mtd><mtd><mo>&#160;</mo></mtd><mtd><mfenced><mi mathvariant=\"normal\">B</mi></mfenced></mtd></mtr></mtable><mo>-</mo><mo>-</mo><mo>-</mo><mo>-</mo><mo>-</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math></p><p>Oxygen atoms are very reactive and combine with the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math> in air to produce ozone.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable><mtr><mtd><mi mathvariant=\"normal\">O</mi><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mtd><mtd><mo>+</mo></mtd><mtd><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mtd><mtd><mo>&#8652;</mo></mtd><mtd><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mtd></mtr><mtr><mtd><mfenced><mi mathvariant=\"normal\">B</mi></mfenced></mtd><mtd><mo>&#160;</mo></mtd><mtd><mo>&#160;</mo></mtd><mtd><mo>&#160;</mo></mtd><mtd><mfenced><mi mathvariant=\"normal\">C</mi></mfenced></mtd></mtr></mtable><mo>-</mo><mo>-</mo><mo>-</mo><mo>-</mo><mo>-</mo><mo>(</mo><mi>ii</mi><mo>)</mo></math></p><p>The ozone formed in the above reaction (ii) reacts rapidly with the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NO</mi><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></math> formed in reaction (i) to regenerate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math> . <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math> is a brown gas and at sufficiently high levels can contribute to haze.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable><mtr><mtd><mi>NO</mi><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mtd><mtd><mo>+</mo></mtd><mtd><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mtd><mtd><mo>&#8594;</mo></mtd><mtd><msub><mi>NO</mi><mn>2</mn></msub><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mtd><mtd><mo>+</mo></mtd></mtr><mtr><mtd><mfenced><mi mathvariant=\"normal\">A</mi></mfenced></mtd><mtd><mo>&#160;</mo></mtd><mtd><mfenced><mi mathvariant=\"normal\">C</mi></mfenced></mtd><mtd><mo>&#160;</mo></mtd><mtd><mo>&#160;</mo></mtd><mtd><mo>&#160;</mo></mtd></mtr></mtable><mtable><mtr><mtd><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mtd></mtr><mtr><mtd><mo>&#160;</mo></mtd></mtr></mtable><mo>-</mo><mo>-</mo><mo>-</mo><mo>-</mo><mo>(</mo><mi>iii</mi><mo>)</mo></math></p><p>So, the A, B and C are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NO</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">O</mi><mo>&#160;</mo><mtext>and</mtext><mo>&#160;</mo><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>&nbsp;respectively.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68135", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Correct statement about smog is", "image": null}, "options": [{"id": "T24xi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math>&nbsp;is present in classical smog", "isCorrect": false, "image": null}, {"id": "b0dsz", "text": "Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SO</mi><mn>2</mn></msub></math>&nbsp;are present in classical smog", "isCorrect": false, "image": null}, {"id": "bzwYc", "text": "Photochemical smog has high concentration of oxidizing agents", "isCorrect": true, "image": null}, {"id": "9Kb4w", "text": "Classical smog also has high concentration of oxidizing agents", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>A. Classical smog occurs in cool humid climate. It is a mixture of smoke, fog, and sulphur dioxide. Chemically it is a reducing mixture and so it is called reducing smog. So statement A is incorrect.</p><p>B. Classical smog is a mixture of smoke, fog and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SO</mi><mn>2</mn></msub></math>.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math>&nbsp;is not present in classical smog. So, statement B is incorrect.</p><p>C. Photochemical smog occurs in warm,&nbsp;dry and sunny climate. The main components of the photochemical smog result from the action of sunlight on unsaturated hydrocarbons and nitrogen oxides produced by automobiles and factories. Photochemical smog has high concentration of oxidising agents and is, therefore, called as oxidising smog. So, statement C is correct.</p><p>D. Classical smog is a reducing mixture, so it is called as reducing smog. Hence, statement D is incorrect.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68080", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Some reactions of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math>&nbsp;relevant to photochemical smog formation are</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/890babc6-ffa7-4d2d-ae8b-a1b7f8cc1900-9895196.PNG\" style=\"width: 279px; height: 140px;\" /></p><p>Identify <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>,</mo><mi mathvariant=\"normal\">X</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math></p>", "image": null}, "options": [{"id": "mEUFX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>=</mo><mo>[</mo><mi mathvariant=\"normal\">O</mi><mo>]</mo><mo>,</mo><mi mathvariant=\"normal\">Y</mi><mo>=</mo><mi>NO</mi><mo>,</mo><mi mathvariant=\"normal\">A</mi><mo>=</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi><mo>=</mo><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "dUmY1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>=</mo><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>,</mo><mi mathvariant=\"normal\">Y</mi><mo>=</mo><mo>[</mo><mi mathvariant=\"normal\">O</mi><mo>]</mo><mo>,</mo><mi mathvariant=\"normal\">A</mi><mo>=</mo><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi><mo>=</mo><mi>NO</mi></math>", "isCorrect": false, "image": null}, {"id": "NLqdw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>,</mo><mi mathvariant=\"normal\">Y</mi><mo>=</mo><msub><mi>NO</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi><mo>=</mo><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi><mo>=</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "6zmdR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>=</mo><mi>NO</mi><mo>,</mo><mi mathvariant=\"normal\">Y</mi><mo>=</mo><mo>[</mo><mi mathvariant=\"normal\">O</mi><mo>]</mo><mo>,</mo><mi mathvariant=\"normal\">A</mi><mo>=</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi><mo>=</mo><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>When fossil fuels&nbsp;are burnt, a variety of pollutants are emitted into the earth&rsquo;s&nbsp;troposphere. Two of the pollutants that are emitted are hydrocarbons (unburnt fuels) and nitric oxide (NO).&nbsp;When these pollutants build up to sufficiently high levels, a chain reaction occurs from their interaction with sunlight in which NO is converted into nitrogen dioxide&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math>. This&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math>&nbsp;in turn absorbs energy from sunlight and breaks up into nitric oxide and a free oxygen atom.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><msub><mi>O</mi><mn>2</mn></msub><mo>&#160;</mo><mo>(</mo><mi>g</mi><mo>)</mo><mo>&#160;</mo><mover><mo>&#8594;</mo><mrow><mi>h</mi><mi>&#957;</mi></mrow></mover><mo>&#160;</mo><mi>N</mi><mi>O</mi><mo>&#160;</mo><mo>(</mo><mi>g</mi><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mi>O</mi><mo>(</mo><mi>g</mi><mo>)</mo></math></p><p>Oxygen atoms are very reactive and combine with the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math> in air to produce ozone.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo><mo>&#160;</mo><mo>&#8652;</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></math></p><p>Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mi mathvariant=\"normal\">O</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Y</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mi>NO</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math></p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d67fc6", "previousYearPapers": [{"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)", "title": "JEE Main 2023 (24 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which of the following is true about freons?", "image": null}, "options": [{"id": "4VeMg", "text": "These are chlorofluorocarbon compounds", "isCorrect": true, "image": null}, {"id": "raO1v", "text": "These are chemicals causing skin cancer", "isCorrect": false, "image": null}, {"id": "GJmxg", "text": "These are radicals of chlorine and chlorine monoxide", "isCorrect": false, "image": null}, {"id": "l39Th", "text": "All radicals are called freons", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Freons are chlorofluorocarbon compounds that contains only carbon, chlorine, and fluorine, produced as a volatile derivative of methane, ethane and propane.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)", "title": "JEE Main 2023 (24 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67810", "previousYearPapers": [{"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The photochemical smog does not generally contain", "image": null}, "options": [{"id": "7L47W", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NO</mi></math>", "isCorrect": false, "image": null}, {"id": "tbM3r", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "oFNTp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SO</mi><mn>2</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "VZdxZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HCHO</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>The major components of photochemical smog are nitrogen oxides, ozone <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></mfenced></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PAN</mi></math> (peroxyacetylnitrate), and chemical compounds that contain the-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CHO</mi></math>&nbsp;group (aldehydes). <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PAN</mi></math> and aldehydes can cause eye irritation and plant damage if their concentrations are sufficiently high.</p><p>Classical smog occurs in a cool, humid climate. Its components include smoke, fog and sulphur dioxide. It is reducing in nature.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67ebe", "previousYearPapers": [{"_id": "62c481f101514d218a7934dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 2)", "title": "JEE Main 2022 (29 Jun Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Sulphur dioxide is one of the components of polluted air. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SO</mi><mn>2</mn></msub></math> is also a major contributor to acid rain. The correct and complete reaction to represent acid rain caused by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SO</mi><mn>2</mn></msub></math> is :", "image": null}, "options": [{"id": "zcLrA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>SO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#8594;</mo><mn>2</mn><msub><mi>SO</mi><mn>3</mn></msub></math><br />&nbsp;", "isCorrect": false, "image": null}, {"id": "wd88C", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>&#8594;</mo><msub><mi>SO</mi><mn>3</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math><br />&nbsp;", "isCorrect": false, "image": null}, {"id": "vP5gy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#8594;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>SO</mi><mn>4</mn></msub></math><br />&nbsp;", "isCorrect": false, "image": null}, {"id": "eKdEz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>SO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>+</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#8594;</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>SO</mi><mn>4</mn></msub></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Acid rain is a by product&nbsp;of a variety of human activities that emit the oxides of sulphur and nitrogen in the atmosphere. As mentioned earlier, burning of fossil fuels (which contain sulphur and nitrogenous matter) such as coal and oil in power stations and furnaces or petrol and diesel in motor engines produce sulphur dioxide and nitrogen oxides. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SO</mi><mn>2</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math> after oxidation and reaction with water are major contributors to acid rain, because polluted air usually contains particulate matter that catalyse the oxidation.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>SO</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mfenced><mi mathvariant=\"normal\">l</mi></mfenced><mo>&#8594;</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>SO</mi><mn>4</mn></msub><mfenced><mi>aq</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi>NO</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mfenced><mi mathvariant=\"normal\">l</mi></mfenced><mo>&#8594;</mo><mn>4</mn><msub><mi>HNO</mi><mn>3</mn></msub><mfenced><mi>aq</mi></mfenced></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 2)", "title": "JEE Main 2022 (29 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67e64", "previousYearPapers": [{"_id": "62c481f101514d218a7934db", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 1)", "title": "JEE Main 2022 (29 Jun Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The acid that is believed to be mainly responsible for the damage of Taj Mahal is", "image": null}, "options": [{"id": "gJGwT", "text": "sulfuric acid.", "isCorrect": true, "image": null}, {"id": "s1SyL", "text": "hydrofluoric acid.", "isCorrect": false, "image": null}, {"id": "A1ZY6", "text": "phosphoric acid.", "isCorrect": false, "image": null}, {"id": "YYZY7", "text": "hydrochloric acid.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The air around the city of Agra, where the Taj Mahal is located, contains fairly high levels of sulphur and nitrogen oxides. It is mainly due to a large number of industries and power plants around the area. Use of poor quality of coal, kerosene and firewood as fuel for domestic purposes add up to this problem. The resulting acid rain reacts with marble,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaCO</mi><mn>3</mn></msub></math> of Taj Mahal&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>CaCO</mi><mn>3</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>SO</mi><mn>4</mn></msub><mo>&#8594;</mo><msub><mi>CaSO</mi><mn>4</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><msub><mi>CO</mi><mn>2</mn></msub></mrow></mfenced></math>&nbsp;causing damage to this wonderful monument.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934db", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 1)", "title": "JEE Main 2022 (29 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67d56", "previousYearPapers": [{"_id": "62c481f101514d218a7934da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 2)", "title": "JEE Main 2022 (28 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Correct statement about photo-chemical smog is", "image": null}, "options": [{"id": "bGxEK", "text": "It occurs in humid climate.", "isCorrect": false, "image": null}, {"id": "hLhTb", "text": "It is a mixture of smoke, fog and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SO</mi><mn>2</mn></msub></math>.", "isCorrect": false, "image": null}, {"id": "m6JNd", "text": "It is reducing smog.", "isCorrect": false, "image": null}, {"id": "GFWur", "text": "It results from reaction of unsaturated hydrocarbons.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Photochemical smog occurs in warm, dry and sunny climate.</p><p>Photochemical smog results from the action of sunlight on unsaturated hydro carbons and nitrogen oxide.</p><p>The common components of photochemical smog are ozone, nitric oxide, acrolein, formaldehyde and peroxyacetyl nitrate (PAN).</p><p>It is oxidising smog.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 2)", "title": "JEE Main 2022 (28 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67b94", "previousYearPapers": [{"_id": "62c481f101514d218a7934d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 1)", "title": "JEE Main 2022 (27 Jun Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Given below are two Statements :</p><p>Statement I : Classical smog occurs in cool humid climate. It is a reducing mixture of smoke, fog and sulphur dioxide.</p><p>Statement II : Photochemical smog has components, ozone, nitric oxide, acrolein, formaldehyde, PAN etc.</p><p>In the light of the above statements, choose the most appropriate answer from the options given below.</p>", "image": null}, "options": [{"id": "T6MG9", "text": "Both Statement I and Statement II are correct.", "isCorrect": true, "image": null}, {"id": "a4Erz", "text": "Both Statement I and Statement II are incorrect.", "isCorrect": false, "image": null}, {"id": "sokRS", "text": "Statement I is incorrect but Statement II is correct.", "isCorrect": false, "image": null}, {"id": "vjDw6", "text": "Statement I is correct but Statement II is incorrect.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Classical smog occurs in cool humid climate. It is a mixture of smoke, fog and sulphur dioxide. Chemically it is a reducing mixture and so it is also called as reducing smog.</p><p>Photochemical smog occurs in warm, dry and sunny climate. The main components of the photochemical smog result from the action of sunlight on unsaturated hydrocarbons and nitrogen oxides produced by automobiles and factories. Photochemical smog has high concentration of oxidising agents and is, therefore, called as oxidising smog.</p><p>Ozone is a toxic gas and both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math> are strong oxidising agents and can react with the unburnt hydrocarbons in the polluted air to produce chemicals such as formaldehyde, acrolein and peroxyacetyl nitrate (PAN).</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "62c481f101514d218a7934d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 1)", "title": "JEE Main 2022 (27 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d677b6", "previousYearPapers": [{"_id": "62c481f001514d218a7934d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T14:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 2)", "title": "JEE Main 2022 (24 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Some gases are responsible for heating of atmosphere (green house effect). Identify from the following the gaseous species which does not cause it.", "image": null}, "options": [{"id": "jIb4s", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>&nbsp;vapour", "isCorrect": false, "image": null}, {"id": "cExJb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "CJDgQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "2dwTG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>4</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "About <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>75</mn><mo>%</mo></math> of the solar energy reaching the earth is absorbed by the earth&rsquo;s surface, which increases its temperature. The rest of the heat radiates back to the atmosphere. Some of the heat is trapped by gases such as carbon dioxide, methane, ozone, chlorofluorocarbon compounds (CFCs) and water vapour in the atmosphere. Thus, they add to the heating of the atmosphere. This causes global warming. Hence, Nitrogen gas is not responsible for green house effect.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T14:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 2)", "title": "JEE Main 2022 (24 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67701", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf820", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T14:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 2)", "title": "JEE Main 2021 (31 Aug Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The deposition of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math> on ground surfaces is referred as wet and dry depositions, respectively. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math> are :", "image": null}, "options": [{"id": "ZqFKv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>=</mo><msub><mi>CO</mi><mn>2</mn></msub><mo>&#160;</mo><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Y</mi><mo>=</mo><msub><mi>SO</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "2zQMH", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>=</mo></math> Ammonium salts</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi><mo>=</mo><msub><mi>SO</mi><mn>2</mn></msub></math></p>", "isCorrect": true, "image": null}, {"id": "TqKxc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>=</mo></math> Ammonium salts<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi><mo>=</mo><msub><mi>CO</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "YyhPr", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>=</mo><msub><mi>SO</mi><mn>2</mn></msub><mo>&#160;</mo><mi mathvariant=\"normal\">Y</mi><mo>=</mo></math> Ammonium salts", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Wet deposition is the acidic water received through rain, fog, snow, dew, mist, etc. Dry deposition is deposition of wind blown acidic gases and particles on the ground. Ammonium salt in rain drop result in wet deposition. Oxides of Nitrogen and sulphur settle down on ground as dry deposition.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf820", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T14:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 2)", "title": "JEE Main 2021 (31 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d67594", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 2)", "title": "JEE Main 2021 (27 Aug Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "In stratosphere most of the ozone formation is assisted by :", "image": null}, "options": [{"id": "evJ9o", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#947;</mi></math>-rays", "isCorrect": false, "image": null}, {"id": "sbfwA", "text": "cosmic rays", "isCorrect": false, "image": null}, {"id": "QbpV5", "text": "visible radiations", "isCorrect": false, "image": null}, {"id": "QjO17", "text": "ultraviolet radiation", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Ozone in the stratosphere is a product of UV radiations acting on dioxygen <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mfenced></math> molecules.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>(</mo><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo><mover><mo>&#10230;</mo><mi>UV</mi></mover><mi mathvariant=\"normal\">O</mi><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo><mo>+</mo><mi mathvariant=\"normal\">O</mi><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>(</mo><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo><mover><mo>&#8652;</mo><mi>UV</mi></mover><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>(</mo><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 2)", "title": "JEE Main 2021 (27 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d6753a", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T09:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 1)", "title": "JEE Main 2021 (27 Aug Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>'</mo><mi mathvariant=\"normal\">A</mi><mo>'</mo></math> is having very low reactivity reaches to stratosphere. It is non-toxic and non-flammable but dissociated by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>UV</mi></math>-radiations in stratosphere. The intermediates formed initially from the gas <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>'</mo><mi mathvariant=\"normal\">A</mi><mo>'</mo></math> are:", "image": null}, "options": [{"id": "4uuPy", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/4485ed84-4dfe-438b-b75b-6936bd183564-image.png\" style=\"width: 174px; height: 62px;\" />", "isCorrect": false, "image": null}, {"id": "ggZWA", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6a4feb88-e4b5-4ccb-8b79-623d5ef916e9-image.png\" style=\"width: 183px; height: 64px;\" />", "isCorrect": true, "image": null}, {"id": "kPOWB", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/88bc657b-1994-4139-a991-0018b8a4835c-image.png\" style=\"width: 188px; height: 67px;\" />", "isCorrect": false, "image": null}, {"id": "NUSKM", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/4138b42c-8df4-4601-a3f9-1bf10f8cc626-image.png\" style=\"width: 191px; height: 60px;\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The gas is Chloro-fluoro carbon. In presence of UV radiation it follows free radical mechanism. Formation of free radical as intermediate occurs due to homolytic fission of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>Cl</mi></math>&nbsp;bond.&nbsp;</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e869dcf0-f276-4ef8-8ab3-acdd7a723c32-image.png\" style=\"width: 399px; height: 92px;\" /></p>", "image": null}, "videoSolution": {"videoId": "84a49b78fe4c4401806abf081fa82dc2", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/32PVTab0bQa2h.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/32PVTab0bQa2h.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T09:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 1)", "title": "JEE Main 2021 (27 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d6743a", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T14:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 2)", "title": "JEE Main 2021 (26 Aug Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Given below are two statements : one is labelled as Assertion (A) and the other is labelled as Reason <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>)</mo></math><br />Assertion (A) : Photochemical smog causes cracking of rubber.<br />Reason (R): Presence of ozone, nitric oxide, acrolein, formaldehyde and peroxyacetyl nitrate in photochemical smog makes it oxidizing.<br />Choose the most appropriate answer from the options given below :", "image": null}, "options": [{"id": "P9zO6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">A</mi><mo>)</mo></math> is false but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>)</mo></math> is true.", "isCorrect": false, "image": null}, {"id": "YIUTf", "text": "Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">A</mi><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>)</mo></math> are true but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>)</mo></math> is not the true explanation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">A</mi><mo>)</mo></math>.", "isCorrect": false, "image": null}, {"id": "nPkXX", "text": "Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">A</mi><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>)</mo></math> are true and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>)</mo></math> is the true explanation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">A</mi><mo>)</mo></math>.", "isCorrect": true, "image": null}, {"id": "zQ1IB", "text": "(A) is true but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">R</mi><mo>)</mo></math> is false.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Photochemical smog has high concentration of oxidising agents and is, therefore, called as oxidising smog.<br />The common components of photochemical smog are ozone, nitric oxide, acrolein, formaldehyde and peroxyacetyl nitrate (PAN). Photochemical smog causes serious health problems. Both ozone and PAN act as powerful eye irritants. Ozone and nitric oxide irritate the nose and throat and their high concentration causes headache, chest pain, dryness of the throat, cough and difficulty in breathing. Photochemical smog leads to cracking of rubber and extensive damage to plant life. It also causes corrosion of metals, stones, building materials, rubber and painted surfaces.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["ASSERTION_REASON"], "previousYear": {"_id": "615d92edde3d91842a5cf81c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T14:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 2)", "title": "JEE Main 2021 (26 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d67381", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf818", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Jul Shift 2)", "title": "JEE Main 2021 (25 Jul Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Given below are two statements :<br />Statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math>&nbsp;: Chlorofluoro carbons breakdown by radiation in the visible energy region and release chlorine gas in the atmosphere which then reacts with stratospheric ozone.</p><p>Statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> : Atmospheric ozone reacts with nitric oxide to give nitrogen and oxygen gases, which add to the atmosphere.</p><p>For the above statements choose the correct answer from the options given below :</p>", "image": null}, "options": [{"id": "nTc1Y", "text": "Statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math>&nbsp;is incorrect but statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> is true", "isCorrect": false, "image": null}, {"id": "8d1ZL", "text": "Both statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> are false", "isCorrect": true, "image": null}, {"id": "JylNn", "text": "Statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math>&nbsp;is correct but statement&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> is false", "isCorrect": false, "image": null}, {"id": "NCuUF", "text": "Both statement&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi></math> are correct", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Statement&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi><mo>:</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CFCs</mi></math> are broken down by powerful UV radiation and releases chlorine free radical which reacts with ozone and start chain reaction.</p><p><img height=\"168\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fccb726b-6304-4819-baef-a1a78f068fd0-image.png\" width=\"320\" /></p><p>Statement&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi><mo>:</mo></math><br />Atmosphere ozone reacts with nitric oxide to produce nitrogen dioxide and oxygen.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mrow><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mrow></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mrow><mn>3</mn><mo>(</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mrow></msub><mo>&rarr;</mo><msub><mi>NO</mi><mrow><mn>2</mn><mo>(</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mrow></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mrow><mn>2</mn><mo>(</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mrow></msub></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "615d92edde3d91842a5cf818", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Jul Shift 2)", "title": "JEE Main 2021 (25 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66ff8", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf812", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-18T09:00:00.000Z", "isVisible": true, "shortName": "2021 (18 Mar Shift 1)", "title": "JEE Main 2021 (18 Mar Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>The satements that are TRUE:<br />(A) Methane leads to both global warming and photochemical smog<br />(B) Methane is generated from paddy fields<br />(C) Methane is a stronger global warming gas than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math><br />(D) Methane is a part of reducing smog</p><p>Choose the most appropriate answer from the options given below:</p>", "image": null}, "options": [{"id": "1fB1i", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">A</mi><mo>)</mo><mo>,</mo><mo>(</mo><mi mathvariant=\"normal\">B</mi><mo>)</mo><mo>,</mo><mo>(</mo><mi mathvariant=\"normal\">C</mi><mo>)</mo></math> only", "isCorrect": true, "image": null}, {"id": "XBkuS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">A</mi><mo>)</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">B</mi><mo>)</mo></math> only", "isCorrect": false, "image": null}, {"id": "1VFXx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">B</mi><mo>)</mo><mo>,</mo><mo>(</mo><mi mathvariant=\"normal\">C</mi><mo>)</mo><mo>,</mo><mo>(</mo><mi mathvariant=\"normal\">D</mi><mo>)</mo></math> only", "isCorrect": false, "image": null}, {"id": "fadPA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">A</mi><mo>)</mo><mo>,</mo><mo>(</mo><mi mathvariant=\"normal\">B</mi><mo>)</mo><mo>,</mo><mo>(</mo><mi mathvariant=\"normal\">D</mi><mo>)</mo></math>&nbsp;only", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Methane leads to both global warming&nbsp;&amp; photochemical smog. Methane is generated in large amounts from paddy fields. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math> can be absorbed by photosynthesis, or by formation of acid rain etc., while no such activities are there for methane. Hence methane is stronger global warming gas than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><
