"text": "Lead", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<strong>Parameters</strong>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<strong>Maximum prescribed concentration in&nbsp; drinking water&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;&nbsp; &nbsp; &nbsp;&nbsp;</strong><br /><br />Iron&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>2</mn><mo>&#160;</mo><mi>ppm</mi></math><br /><br />Fluroide&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi>ppm</mi></math><br /><br />Lead&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi>ppb</mi></math><br /><br />Nitrate&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#160;</mo><mi>ppm</mi></math><br /><br />Hence the concentration of nitrate in a given<br />water sample exceeds from the upper limit as<br />given above.<br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6488", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2016 (03 Apr)", "title": "JEE Main 2016 (03 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65fc1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7dd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2015 (11 Apr Online)", "title": "JEE Main 2015 (11 Apr Online)"}], "question": {"text": "Addition of phosphate fertilizers to water bodies causes:", "image": null}, "options": [{"id": "COxL0", "text": "Deposition of calcium phosphate", "image": null, "isCorrect": false}, {"id": "QcQar", "text": "Enhanced growth of algae", "image": null, "isCorrect": true}, {"id": "7FQRT", "text": "Increase in fish population", "image": null, "isCorrect": false}, {"id": "Tenvp", "text": "Increase in amount of dissolved oxygen in water", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Addition of phosphate fertilizers or other fertilizers to water bodies causes enrichment in nutrients, this phenomenon is called Eutrophication. Increase in nutrients enhanced growth of algae (vegetation) which cause consume of dissolved oxygen. Hence decrease in quantity of dissolved oxygen, effects the life of aqua-animals or other vegetation. So Eutrophication is a types of water pollution.<div class=\"mod\" data-md=\"61\" lang=\"en-IN\" style=\"clear: none; padding-left: 16px; padding-right: 16px; color: rgb(34, 34, 34); font-family: arial, sans-serif; font-size: small;\"><div aria-level=\"3\" class=\"LGOjhe\" data-hveid=\"CAwQBw\" role=\"heading\" style=\"overflow: hidden; padding-bottom: 20px;\">&nbsp;</div></div>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7dd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2015 (11 Apr Online)", "title": "JEE Main 2015 (11 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a09", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}], "question": {"text": "Water sample is reported to be highly polluted if BOD (Biological Oxygen Demand) value of sample becomes", "image": null}, "options": [{"id": "cxwUU", "text": "\nmore than $17 \\mathrm{ppm}$\n", "image": null, "isCorrect": true}, {"id": "NnCk7", "text": "\nequal to $10 \\mathrm{ppm}$\n", "image": null, "isCorrect": false}, {"id": "nbFbr", "text": "\nequal to $5 \\mathrm{ppm}$\n", "image": null, "isCorrect": false}, {"id": "0Z1Il", "text": "\nless than $5 \\mathrm{ppm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Water sample is reported to be highly polluted if BOD value of sample is more than 17 ppm.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "648b5a74417cc3fb48d693c5", "title": "Land Pollution", "totalQuestions": 3, "questions": [{"_id": "648b5a70417cc3fb48d683a3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 2)", "title": "JEE Main 2023 (06 Apr Shift 2)"}], "question": {"text": "The group of chemicals used as pesticide is", "image": null}, "options": [{"id": "wvyKh", "text": "Aldrin, Sodium Chlorate, Sodium arsinite", "image": null, "isCorrect": false}, {"id": "72IRE", "text": "DDT, Aldrin", "image": null, "isCorrect": true}, {"id": "xN7Lk", "text": "Sodium chlorate, DDT, PAN", "image": null, "isCorrect": false}, {"id": "MZ5qu", "text": "Dieldrin, Sodium arsinite, Tetrachloroethene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>DDT(dichlorodiphenyltrichloroethane) and Aldrin are two synthetic pesticides that were widely used for insect control. Pesticides are groups of chemicals used for destruction of insects, weeds, fungi, bacteria etc. They are generally called insecticides, fungicides, bactericides, herbicides and rodenticides.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 2)", "title": "JEE Main 2023 (06 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67daf", "previousYearPapers": [{"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which among the following pairs has only herbicides?", "image": null}, "options": [{"id": "rhRGE", "text": "Aldrin and Dieldrin", "isCorrect": false, "image": null}, {"id": "tVLUa", "text": "Sodium chlorate and Aldrin", "isCorrect": false, "image": null}, {"id": "n9Ccp", "text": "Sodium arsinate and Dieldrin", "isCorrect": false, "image": null}, {"id": "0kuf0", "text": "Sodium chlorate and sodium arsenite.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Herbicides, also commonly known as weedkillers, are chemical substances used to control unwanted plants. Selective herbicides control specific weed species, while leaving the desired crop relatively unharmed, while non-selective herbicides can be used to clear waste ground, industrial and construction sites, railways and railway embankments as they kill all plant material with which they come into contact.</p><p>Nowadays, the pesticide industry has shifted its attention to herbicides such as sodium chlorate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><msub><mi>NaClO</mi><mn>3</mn></msub></mfenced></math>, sodium arsinite <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>Na</mi><mn>3</mn></msub><msub><mi>AsO</mi><mn>3</mn></msub></mrow></mfenced></math> and many others.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67cfa", "previousYearPapers": [{"_id": "62c481f101514d218a7934d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 1)", "title": "JEE Main 2022 (28 Jun Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which amongst the following is not a pesticide?", "image": null}, "options": [{"id": "4PnM0", "text": "DDT", "isCorrect": false, "image": null}, {"id": "46dO3", "text": "Dieldrin", "isCorrect": false, "image": null}, {"id": "ezY95", "text": "Organophosphate", "isCorrect": false, "image": null}, {"id": "IFZyC", "text": "Sodium Arsenite", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Dichlorodiphenyltrichloroethane (DDT) is an insecticide used in agriculture. Dieldrin a decades-old chlorocarbon&nbsp;insecticide that has long been banned from use in most of the world. It was introduced in 1948 by the now-defunct J. Organophosphates are a group of human-made chemicals that poison insects and mammals. Organophosphates are the most widely used insecticides today. They are used in agriculture, the home, gardens, and veterinary practice.</p><p>These days, the pesticide industry has shifted its attention to herbicides such as&nbsp;sodium chlorate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><msub><mi>NaClO</mi><mn>3</mn></msub><mo>)</mo></math>, sodium arsenite <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><msub><mi>Na</mi><mn>3</mn></msub><msub><mi>AsO</mi><mn>3</mn></msub><mo>&#160;</mo><mo>)</mo></math> and many others.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 1)", "title": "JEE Main 2022 (28 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "648b5a74417cc3fb48d693c4", "title": "Control of environmental pollution", "totalQuestions": 1, "questions": [{"_id": "648b5a6a417cc3fb48d670a5", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf814", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Jul Shift 1)", "title": "JEE Main 2021 (20 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Green chemistry in day-to-day life is in the use of:", "image": null}, "options": [{"id": "fSQuS", "text": "Chlorine for bleaching of paper", "isCorrect": false, "image": null}, {"id": "NGBGK", "text": "Large amount of water alone for washing clothes", "isCorrect": false, "image": null}, {"id": "d7gJ3", "text": "Tetrachloroethene for laundry", "isCorrect": false, "image": null}, {"id": "ETtVN", "text": "Liquified <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math> for dry cleaning of clothes", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Chlorine gas was used earlier for bleaching paper. These days, hydrogen peroxide <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></mrow></mfenced></math>&nbsp;is used with suitable catalyst.</p><p>Tetrachloroethene <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>Cl</mi><mn>2</mn></msub><mi mathvariant=\"normal\">C</mi><mo>=</mo><msub><mi>CCl</mi><mn>2</mn></msub></mrow></mfenced></math>&nbsp;was earlier used as solvent for dry cleaning. The compound contaminates the ground water and is also a suspected carcinogen. Replacement of halogenated solvent by liquid <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math> will result in less harm to groundwater. Hence, given statement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>4</mn><mo>)</mo></math> is correct.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf814", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Jul Shift 1)", "title": "JEE Main 2021 (20 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Main';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer Type' : 'Single Correct Option'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
