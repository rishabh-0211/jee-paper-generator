><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math></p><p>Hence, A is true and R is false.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["ASSERTION_REASON"], "previousYear": {"_id": "63134c746e7bc9b332483709", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 2)", "title": "JEE Main 2022 (26 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67867", "previousYearPapers": [{"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 2)", "title": "JEE Main 2022 (25 Jul Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The correct order of density is", "image": null}, "options": [{"id": "XGt8A", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi><mo>&#62;</mo><mi>Mg</mi><mo>&#62;</mo><mi>Ca</mi><mo>&#62;</mo><mi>Sr</mi></math>", "isCorrect": false, "image": null}, {"id": "O5r0Y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Sr</mi><mo>&#62;</mo><mi>Ca</mi><mo>&#62;</mo><mi>Mg</mi><mo>&#62;</mo><mi>Be</mi></math>", "isCorrect": false, "image": null}, {"id": "lYQdY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Sr</mi><mo>&#62;</mo><mi>Be</mi><mo>&#62;</mo><mi>Mg</mi><mo>&#62;</mo><mi>Ca</mi></math>", "isCorrect": true, "image": null}, {"id": "MqPJY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi><mo>&#62;</mo><mi>Sr</mi><mo>&#62;</mo><mi>Mg</mi><mo>&#62;</mo><mi>Ca</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>The size of alkali metals increases down the group, so volume also shows increment, and since volume is inversely proportional to the density but in the case <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Sr</mi><mo>&#160;</mo></math>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ba</mi></math>, increase in the volume is less compared to increasing mass.</p><p>So, down the group density decreases first and then increases.</p><p>Therefore, the&nbsp;correct order of density is as follows:</p><p>&#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi><mo>&#60;</mo><mi>Mg</mi><mo>&#60;</mo><mi>Be</mi><mo>&#60;</mo><mi>Sr</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["SEQUENCE_ORDER"], "previousYear": {"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 2)", "title": "JEE Main 2022 (25 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d6780d", "previousYearPapers": [{"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Choose the correct order of density of the alkali metals", "image": null}, "options": [{"id": "84TKM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi><mo>&#60;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>&#60;</mo><mi>Na</mi><mo>&#60;</mo><mi>Rb</mi><mo>&#60;</mo><mi>Cs</mi></math>", "isCorrect": true, "image": null}, {"id": "pG1Zp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi><mo>&#60;</mo><mo>&#160;</mo><mi>Na</mi><mo>&#60;</mo><mi mathvariant=\"normal\">K</mi><mo>&#160;</mo><mo>&#60;</mo><mi>Rb</mi><mo>&#60;</mo><mi>Cs</mi></math>", "isCorrect": false, "image": null}, {"id": "82Tyg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi><mo>&#60;</mo><mi>Na</mi><mo>&#60;</mo><mi mathvariant=\"normal\">K</mi><mo>&#60;</mo><mi>Cs</mi><mo>&#60;</mo><mi>Rb</mi></math>", "isCorrect": false, "image": null}, {"id": "Up9EH", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cs</mi><mo>&#60;</mo><mi>Rb</mi><mo>&#60;</mo><mi mathvariant=\"normal\">K</mi><mo>&#60;</mo><mi>Na</mi><mo>&#60;</mo><mi>Li</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>As we move down the group from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi></math>&nbsp;to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cs</mi></math>, both the atomic size and atomic mass increase. But the increase in atomic mass more than compensates the bigger atomic size. As a result, the densities of alkali metals increase from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi></math>&nbsp;to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cs</mi></math>. Potassium is, however, lighter than sodium.</p><p>Hence, the increasing order of density is as given below:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi><mo>&#60;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>&#60;</mo><mi>Na</mi><mo>&#60;</mo><mi>Rb</mi><mo>&#60;</mo><mi>Cs</mi></math></p><p>&nbsp;</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["SEQUENCE_ORDER"], "previousYear": {"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67705", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf820", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T14:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 2)", "title": "JEE Main 2021 (31 Aug Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Given below are two statements : one is labelled as Assertion (A) and the other is labelled as Reason (R).<br />Assertion (A): Lithium salts are hydrated.<br />Reason (R) : Lithium has higher polarising power than other alkali metal group members.</p><p>In the light of the above statements, choose the most appropriate answer from the options given below :</p>", "image": null}, "options": [{"id": "kfdub", "text": "(A) is not correct but (R)&nbsp;is correct.", "isCorrect": false, "image": null}, {"id": "QwY69", "text": "(A) is correct but (R)&nbsp;is not correct.", "isCorrect": false, "image": null}, {"id": "viDX5", "text": "Both (A) and (R) are correct but (R) is NOT the correct explanation of (A).", "isCorrect": true, "image": null}, {"id": "AgU17", "text": "Both (A) and (R) are correct and (R)&nbsp;is the correct explanation of (A).", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Li salts are hydrated <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>eg</mi><mo>.</mo><mo>&#160;</mo><mo>&#160;</mo><mi>LiCl</mi><mo>.</mo><mo>&#160;</mo><mn>6</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>, because lithium-ion has high hydration enthalpy.</p><p>Smaller the size of cation more is the polarising power.<br />Polarising power order:&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Li</mi><mo>+</mo></msup><mo>&#62;</mo><msup><mi>Na</mi><mo>+</mo></msup><mo>&#62;</mo><msup><mi mathvariant=\"normal\">K</mi><mo>+</mo></msup><mo>&#62;</mo><mo>&#160;</mo><msup><mi>Rb</mi><mo>+</mo></msup><mo>&#62;</mo><msup><mi>Cs</mi><mo>+</mo></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["ASSERTION_REASON"], "previousYear": {"_id": "615d92eede3d91842a5cf820", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T14:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 2)", "title": "JEE Main 2021 (31 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d67592", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 2)", "title": "JEE Main 2021 (27 Aug Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Choose the correct statement from the following :", "image": null}, "options": [{"id": "D2sgC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LiF</mi></math>&nbsp;has least negative standard enthalpy of formation among alkali metal fluorides.", "isCorrect": false, "image": null}, {"id": "FPcHS", "text": "The standard enthalpy of formation for alkali metal bromides becomes less negative on descending the group.", "isCorrect": false, "image": null}, {"id": "XBvwo", "text": "The low solubility of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CsI</mi></math>&nbsp;in water is due to its high lattice enthalpy.", "isCorrect": false, "image": null}, {"id": "jxo1j", "text": "Among the alkali metal halides, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LiF</mi></math>&nbsp;is least soluble in water.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>3</mn><mo>)</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CsI</mi></math>&nbsp;has less lattice enthalpy. But due to less hydration enthalpy of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Cs</mi><mo>+</mo></msup></math>ion it is less soluble.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>4</mn><mo>)</mo></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LiF</mi></math>&nbsp;is least soluble in water.", "image": null}, "videoSolution": {"videoId": "1ed776b487db4765b181f8fc9a88db56", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/tHaEmPJvvgVE4.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/tHaEmPJvvgVE4.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 2)", "title": "JEE Main 2021 (27 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d67646", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Jul Shift 2)", "title": "JEE Main 2021 (27 Jul Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Match List - I with List II :</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td>List-I</td>\t\t\t<td>&nbsp;</td>\t\t\t<td>List-II</td>\t\t</tr>\t\t<tr>\t\t\t<td>a</td>\t\t\t<td>Li</td>\t\t\t<td>i</td>\t\t\t<td>photoelectric cell</td>\t\t</tr>\t\t<tr>\t\t\t<td>b</td>\t\t\t<td>Na</td>\t\t\t<td>ii</td>\t\t\t<td>absorbent of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>c</td>\t\t\t<td>K</td>\t\t\t<td>iii</td>\t\t\t<td>coolant in fast breeder nuclear reactor</td>\t\t</tr>\t\t<tr>\t\t\t<td>d</td>\t\t\t<td>Cs</td>\t\t\t<td>iv</td>\t\t\t<td>treatment of cancer</td>\t iant=\"normal\">B</mi><mo>&#160;</mo></math>reacts with an aqueous solution of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CuSO</mi><mn>4</mn></msub></math> to form a deep blue compound. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi></math> respectively are", "image": null}, "options": [{"id": "5UDj9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NH</mi><mn>3</mn></msub></math>.", "image": null, "isCorrect": true}, {"id": "EnXqt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ba</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NH</mi><mrow><mn>3</mn><mo>.</mo></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "BdXBL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><mo>.</mo></math>", "image": null, "isCorrect": false}, {"id": "24dVe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Al</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mrow><mn>2</mn><mo>.</mo></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The given sequence of unbalanced reactions represents the above process.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/220a4c75-63f0-4194-ba46-cc7112330150-ea10791f-87b5-4e6c-b8e6-62e52af79fe7-image.png\" style=\"width: 376px; height: 200px;\" /></p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-08T09:00:00.000Z", i><mi mathvariant=\"normal\">K</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "nH1wo", "text": "<math><mi mathvariant=\"normal\">L</mi><msub><mrow><mi mathvariant=\"normal\">i</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mo>,</mo><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">K</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "3ZRol", "text": "<math><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">i</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>,</mo><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\"> </mi><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In 1A group<br /><br />Li on reaction&nbsp;with excess air<br /><br /><math><mn>4</mn><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">i</mi><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>→</mo><mn>2</mn><mi mathvariant=\"normal\">L</mi><msub><mrow><mi mathvariant=\"normal\">i</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math><br /><br />Na on reaction with excess air<br /><br /><math><mn>2</mn><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>→</mo><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br />K on reaction&nbsp;<math><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi></math>with excess air<br /><br /><math><mi mathvariant=\"normal\">K</mi><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>→</mo><mi mathvariant=\"normal\">K</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6488", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2016 (03 Apr)", "title": "JEE Main 2016 (03 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65770", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}], "question": {"text": "The ionic mobility of alkali metal ions in aqueous solution is maximum for", "image": null}, "options": [{"id": "ArlOO", "text": "\n${K}^+$\n", "image": null, "isCorrect": false}, {"id": "jMlEf", "text": "\n${Rb}^+$\n", "image": null, "isCorrect": true}, {"id": "JakuJ", "text": "\n${Li}^+$\n", "image": null, "isCorrect": false}, {"id": "dZpzu", "text": "\n${Na}^+$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "648b5a73417cc3fb48d6926f", "title": "Compounds of Alkali Metals", "totalQuestions": 17, "questions": [{"_id": "648b5a70417cc3fb48d6850b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6491", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 2)", "title": "JEE Main 2023 (10 Apr Shift 2)"}], "question": {"text": "Number of water molecules in washing soda and soda ash respectively are :", "image": null}, "options": [{"id": "Qnslt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><mn>10</mn><mo>&#160;</mo></math>", "image": null, "isCorrect": false}, {"id": "hsomY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "ImNqT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "8ixNG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The chemical formula for washing soda is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub><mo>.</mo><mn>10</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>, which means that each molecule of washing soda contains <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math> water molecules.</p><p>The chemical formula for soda ash is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub></math>, which does not contain any water molecules.</p><p>Therefore, there are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math> water molecules in washing soda and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#160;</mo></math>water molecules in soda ash.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6491", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 2)", "title": "JEE Main 2023 (10 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67f17", "previousYearPapers": [{"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Match List I with List II<br />(A) Slaked lime&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;(I) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math><br />(B) Dead burnt plaster&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; (II) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi><mo>(</mo><mi>OH</mi><msub><mo>)</mo><mn>2</mn></msub></math><br />(C) Caustic soda&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; (III) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub><mo>&#183;</mo><mn>10</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math><br />(D) Washing soda&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;(IV) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaSO</mi><mn>4</mn></msub></math><br />Choose the correct answer form the options given below:", "image": null}, "options": [{"id": "FqaXG", "text": "(A) - I, (B) - IV, (C) - II, (D) - III", "isCorrect": false, "image": null}, {"id": "T32MK", "text": "(A) - III, (B) - IV, (C) - II, (D) - I", "isCorrect": false, "image": null}, {"id": "MCKxg", "text": "(A) - II, (B) - IV, (C) - I, (D) - III", "isCorrect": true, "image": null}, {"id": "6ua5T", "text": "&nbsp;(A)&nbsp;- III, (B) - II, (C) -IV, (D) -I", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>(A) Slaked lime:&nbsp;Calcium oxide is a white amorphous solid. It has a melting point of 2870 K. On exposure to the atmosphere, it absorbs moisture and carbon dioxide.&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CaO</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mi>Ca</mi><mo>(</mo><mi>OH</mi><msub><mo>)</mo><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CaO</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi>CO</mi><mn>2</mn></msub><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><msub><mi>CaCO</mi><mn>3</mn></msub></math></p><p>The addition of a limited amount of water breaks the lump of lime. This process is called slaking of lime.</p><p>(B) Dead burnt plaster: Calcium sulphate&nbsp;is a hemihydrate of calcium sulphate. It is obtained when gypsum,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaSO</mi><mn>4</mn></msub><mo>.</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>&nbsp;is heated at 393K.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>(</mo><msub><mi>CaSO</mi><mn>4</mn></msub><mo>.</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>)</mo><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mn>2</mn><mo>(</mo><msub><mi>CaSO</mi><mn>4</mn></msub><mo>)</mo><mo>.</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>3</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math></p><p>Above 393 K, no water of crystallisation is left and anhydrous calcium sulphate, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaSO</mi><mn>4</mn></msub></math> is formed. This is known as &lsquo;dead burnt plaster&rsquo;.</p><p>(C) Caustic soda:&nbsp;Sodium hydroxide (caustic soda) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math> is generally prepared commercially by the electrolysis of sodium chloride in Castner-Kellner cell. A brine solution is electrolysed using a mercury cathode and a carbon anode. Sodium metal discharged at the cathode combines with mercury to form sodium amalgam.</p><p>(D) Washing soda:&nbsp;Sodium carbonate is a white crystalline solid which exists as a decahydrate,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub><mo>.</mo><mn>10</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>.&nbsp;This is also called washing soda. It is readily soluble in water.</p><p>So, the correct matching is (A)-II, (B)-IV, (C)-I, (D)-III.</p><p>&nbsp;</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d682fe", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The element playing significant role in neuromuscular function and interneuronal transmission is :", "image": null}, "options": [{"id": "vMEr0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi></math>", "isCorrect": false, "image": null}, {"id": "h6YNt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mg</mi></math>", "isCorrect": false, "image": null}, {"id": "TsntB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi></math>", "isCorrect": true, "image": null}, {"id": "6ZVkf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "About 99 % of body calcium is present in bones and teeth. Calcium plays important role in neuromuscular function, interneuronal transmission. Cell membrane integrity and blood coagulation.&nbsp;An adult body contains about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1200</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi></math>.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67ebb", "previousYearPapers": [{"_id": "62c481f101514d218a7934dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 2)", "title": "JEE Main 2022 (29 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Amongst baking soda, caustic soda and washing soda carbonate anion is present in :<br />&nbsp;", "image": null}, "options": [{"id": "hDu3L", "text": "Washing Soda only", "isCorrect": true, "image": null}, {"id": "NBf1J", "text": "washing soda and caustic soda only.<br />&nbsp;", "isCorrect": false, "image": null}, {"id": "UApyU", "text": "washing soda and baking soda only.<br />&nbsp;", "isCorrect": false, "image": null}, {"id": "hj25G", "text": "baking soda, caustic soda and washing soda.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Washing soda&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>Na</mi><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub><mo>.</mo><mn>10</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></mfenced></math>&nbsp;contains carbonate ion. Baking soda&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><msub><mi>NaHCO</mi><mn>3</mn></msub></mfenced></math>&nbsp;contains bicarbonate ion. Caustic soda is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math>.</p><p>Hence, carbonate ion is present only in washing soda.</p>", "image": null}, "videoSolution": {"videoId": "eb608d0982d5412998231941b351ec65", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/U4G5ARNzy4qUw.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/U4G5ARNzy4qUw.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 2)", "title": "JEE Main 2022 (29 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d677b3", "previousYearPapers": [{"_id": "62c481f001514d218a7934d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T14:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 2)", "title": "JEE Main 2022 (24 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which one of the following compounds is used as a chemical in certain type of fire extinguishers", "image": null}, "options": [{"id": "b2Isg", "text": "Washing soda", "isCorrect": false, "image": null}, {"id": "vTUAV", "text": "Baking soda", "isCorrect": true, "image": null}, {"id": "FXr3Y", "text": "Caustic soda", "isCorrect": false, "image": null}, {"id": "QJSQr", "text": "Soda ash", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>NaHCO</mi><mn>3</mn></msub><mo>(</mo><mi>aq</mi><mo>)</mo><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>SO</mi><mn>4</mn></msub><mo>(</mo><mi>aq</mi><mo>)</mo><mo stretchy=\"false\">&#8594;</mo><msub><mi>Na</mi><mn>2</mn></msub><msub><mi>SO</mi><mn>4</mn></msub><mo>(</mo><mi>aq</mi><mo>)</mo><mo>+</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>(</mo><mi mathvariant=\"normal\">l</mi><mo>)</mo><mo>+</mo><mn>2</mn><msub><mi>CO</mi><mn>2</mn></msub><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></math></p><p>When the fire extinguisher is operated by pressing the knob on it, the sulphuric acid gets mixed with sodium bicarbonate solution producing a lot of carbon dioxide gas.&nbsp;Carbon dioxide gas is neither combustible nor helps combustion.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T14:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 2)", "title": "JEE Main 2022 (24 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d6758f", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 2)", "title": "JEE Main 2021 (27 Aug Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The oxide that gives <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math> most readily on treatment with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math> is :", "image": null}, "options": [{"id": "MZSy9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "2R3Cz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>BaO</mi><mn>2</mn></msub><mo>.</mo><mn>8</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>", "isCorrect": false, "image": null}, {"id": "D61Z5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SnO</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "w0yvL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>PbO</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Among the given compounds&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#160;</mo><mtext>and</mtext><mo>&#160;</mo><msub><mi>BaO</mi><mn>2</mn></msub><mo>.</mo><mn>8</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>&nbsp;are the peroxides.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SnO</mi><mn>2</mn></msub><mo>&#160;</mo><mtext>and</mtext><mo>&#160;</mo><msub><mi>PbO</mi><mn>2</mn></msub></math>&nbsp;are the oxides.</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#8594;</mo><mi>NaOH</mi><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math></p><p>Acidified barium peroxide gives hydrogen peroxide.</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 2)", "title": "JEE Main 2021 (27 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d670af", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf814", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Jul Shift 1)", "title": "JEE Main 2021 (20 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A s-block element (M) reacts with oxygen to form an oxide of the formula <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>MO</mi><mn>2</mn></msub></math>. The oxide is pale yellow in colour and paramagnetic. The element&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">M</mi><mo>)</mo></math> is:", "image": null}, "options": [{"id": "arfNo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mg</mi></math>", "isCorrect": false, "image": null}, {"id": "F9lLu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi></math>", "isCorrect": false, "image": null}, {"id": "R9n9q", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi></math>", "isCorrect": false, "image": null}, {"id": "hHIKK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>(A) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>Mg</mi><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#8594;</mo><mn>2</mn><mi>MgO</mi></math> (Diamagnetic)<br />(B) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>Na</mi><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#8594;</mo><msub><mi>Na</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math> (Diamagnetic)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>Na</mi><mo>+</mo><munder accentunder=\"false\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mrow><mo>(</mo><mtext>excess</mtext><mo>)</mo></mrow></munder><mo stretchy=\"false\">&#8594;</mo><msub><mi>Na</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mtext>&#160;(Diamagnetic)</mtext></math></p><p>(C) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>Ca</mi><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#8594;</mo><mn>2</mn><mi>CaO</mi></math> (Diamagnetic)<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#8594;</mo><msub><mi>CaO</mi><mn>2</mn></msub></math> (Diamagnetic)</p><p>(D)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi><mo>+</mo><munder accentunder=\"false\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mtext>&#160;(excess)&#160;</mtext></munder><mo stretchy=\"false\">&#8594;</mo><msub><mi>KO</mi><mn>2</mn></msub><mtext>&#160;(Paramagnetic)</mtext></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf814", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Jul Shift 1)", "title": "JEE Main 2021 (20 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66fa3", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf811", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-17T14:00:00.000Z", "isVisible": true, "shortName": "2021 (17 Mar Shift 2)", "title": "JEE Main 2021 (17 Mar Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "One of the by-products formed during the recovery of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NH</mi><mn>3</mn></msub></math> from Solvay process is:", "image": null}, "options": [{"id": "3p17H", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi><mo>(</mo><mi>OH</mi><msub><mo>)</mo><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "yKyj1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NaHCO</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "iy1zC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaCl</mi><mn>2</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "74H1A", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NH</mi><mn>4</mn></msub><mi>Cl</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The Solvay&nbsp;process is also called&nbsp;ammonia recovery.</p><p>The calcium hydroxide is reacted with the ammonium chloride separated out of the carbonating tower by filtration.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi><msub><msub><mrow><mo>(</mo><mi>OH</mi><mo>)</mo></mrow><mn>2</mn></msub><mrow><mo>(</mo><mi>aq</mi><mo>)</mo></mrow></msub><mo>+</mo><mn>2</mn><msub><mi>NH</mi><mn>4</mn></msub><msub><mi>Cl</mi><mrow><mo>(</mo><mi>aq</mi><mo>)</mo></mrow></msub><mover><mo>&#8594;</mo><mrow/></mover><msub><msub><mi>CaCl</mi><mn>2</mn></msub><mrow><mo>(</mo><mi>aq</mi><mo>)</mo></mrow></msub><mo>+</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mrow><mo>(</mo><mi mathvariant=\"normal\">l</mi><mo>)</mo></mrow></msub><mo>+</mo><mn>2</mn><msub><msub><mi>NH</mi><mn>3</mn></msub><mrow><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></mrow></msub></math></p><p>The ammonia is recycled back into the process to form ammoniated brine.</p><p>Calcium chloride is formed as a by-product of the Solvay process.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf811", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-17T14:00:00.000Z", "isVisible": true, "shortName": "2021 (17 Mar Shift 2)", "title": "JEE Main 2021 (17 Mar Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d67482", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Feb Shift 1)", "title": "JEE Main 2021 (26 Feb Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Find&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> in the following reactions:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NH</mi><mn>3</mn></msub><mo>+</mo><mi mathvariant=\"normal\">A</mi><mo>+</mo><msub><mi>CO</mi><mn>2</mn></msub><mo>&#8594;</mo><msub><mfenced><msub><mi>NH</mi><mn>4</mn></msub></mfenced><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><msub><mi>NH</mi><mn>4</mn></msub></mfenced><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><mi mathvariant=\"normal\">B</mi><mo>&#8594;</mo><msub><mi>NH</mi><mn>4</mn></msub><msub><mi>HCO</mi><mn>3</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NH</mi><mn>4</mn></msub><msub><mi>HCO</mi><mn>3</mn></msub><mo>+</mo><mi>NaCl</mi><mo>&#8594;</mo><msub><mi>NH</mi><mn>4</mn></msub><mi>Cl</mi><mo>+</mo><mi mathvariant=\"normal\">C</mi></math></p>", "image": null}, "options": [{"id": "r7V51", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><msub><mi>CO</mi><mn>2</mn></msub><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><msub><mi>NaHCO</mi><mn>3</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "iOhQC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><msub><mi>Na</mi><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "iy1sn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><msub><mi>NaHCO</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "NyRRx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><msub><mi>CO</mi><mn>2</mn></msub><mo>;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><msub><mi>Na</mi><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Ammonia reacts with carbon dioxide and water to form ammonium bicarbonate.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>NH</mi><mn>3</mn></msub><mo>+</mo><munder><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow><mrow><mo>(</mo><mi mathvariant=\"normal\">A</mi><mo>)</mo></mrow></munder><mo>+</mo><msub><mi>CO</mi><mn>2</mn></msub><mo>&#10230;</mo><msub><mfenced><msub><mi>NH</mi><mn>4</mn></msub></mfenced><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><msub><mi>NH</mi><mn>4</mn></msub></mfenced><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><munder><msub><mi>CO</mi><mn>2</mn></msub><mrow><mo>(</mo><mi mathvariant=\"normal\">B</mi><mo>)</mo></mrow></munder><mo>&#10230;</mo><mn>2</mn><msub><mi>NH</mi><mn>4</mn></msub><msub><mi>HCO</mi><mn>3</mn></msub></math></p><p>Ammonium carbonate reacts with sodium chloride to form sodium bicarbonate and ammonium chloride.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NH</mi><mn>4</mn></msub><msub><mi>HCO</mi><mn>3</mn></msub><mo>+</mo><mi>NaCl</mi><mo>&#10230;</mo><munder><msub><mi>NaHCO</mi><mn>3</mn></msub><mrow><mo>(</mo><mi mathvariant=\"normal\">C</mi><mo>)</mo></mrow></munder><mo>+</mo><msub><mi>NH</mi><mn>4</mn></msub><mi>Cl</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf80c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Feb Shift 1)", "title": "JEE Main 2021 (26 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d6666b", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 2)", "title": "JEE Main 2019 (10 Apr Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A hydrated solid X on heating initially gives a monohydrated compound Y. Y upon heating above <math><mn>373</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">K</mi></math> leads to an anhydrous white powder Z. X and Z, respectively, are;", "image": null}, "options": [{"id": "agoeu", "text": "washing soda and soda ash.", "isCorrect": true, "image": null}, {"id": "ePTmS", "text": "baking soda and soda ash.", "isCorrect": false, "image": null}, {"id": "M5x3u", "text": "washing soda and dead burnt plaster.", "isCorrect": false, "image": null}, {"id": "y94uC", "text": "baking soda and dead burnt plaster.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "&#39;X&#39; is washing soda <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>.</mo><mn>10</mn><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></mrow></mfenced></math> which on heating gives a monohydrate <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>.</mo><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></mrow></mfenced><mo>.</mo></math> The monohydrate on further heating gives an anhydrous residue of <math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub></math><br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d164987b-6510-4585-bb0a-2c9ba70d212d-image.png\" style=\"width: 650px; height: 95px;\" /><br /><br /><math><mo>&#8756;</mo><mi mathvariant=\"normal\">X</mi><mi mathvariant=\"normal\">&#160;</mi></math> and <math><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">Z</mi></math> are washing soda and soda ash.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 2)", "title": "JEE Main 2019 (10 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d662d1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 2 Online)", "title": "JEE Main 2018 (15 Apr Shift 2 Online)"}], "question": {"text": "In $\\mathrm{KO}_2$, the nature of oxygen species and the oxidation state of oxygen atom are, respectively:", "image": null}, "options": [{"id": "msbLF", "text": "\nSuperoxide and $-1$\n", "image": null, "isCorrect": false}, {"id": "V7yaf", "text": "\nSuperoxide and $-1 / 2$\n", "image": null, "isCorrect": true}, {"id": "304DB", "text": "\nPeroxide and $-1 / 2$\n", "image": null, "isCorrect": false}, {"id": "e3CzL", "text": "\nOxide and $-2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\mathrm{KO}_2$, the nature of oxygen species and the oxidation state of oxygen atom are superoxide (superoxide ion is $\\mathrm{O}_2^{-}$) and $-1 / 2$ respectively.\nLet $x$ be oxidation state of oxygen. The oxidation state of $\\mathrm{K}$ is $+1$. Hence\n$$\n\\begin{gathered}\n+1+2(x)=0 \\\\\n2 x=-1 \\\\\nx=-\\frac{1}{2}\n\\end{gathered}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 2 Online)", "title": "JEE Main 2018 (15 Apr Shift 2 Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d66292", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 1 Online)", "title": "JEE Main 2018 (15 Apr Shift 1 Online)"}], "question": {"text": "A white sodium salt dissolves readily in water to give a solution which is neutral to litmus. When silver nitrate solution is added to the aforementioned solution, a white precipitate is obtained which does not dissolve in dil. nitric acid. The anion is :", "image": null}, "options": [{"id": "wyaSA", "text": "\n$\\mathrm{CO}_3^{2-}$\n", "image": null, "isCorrect": false}, {"id": "1rgB5", "text": "\n$\\mathrm{SO}_4^{2-}$\n", "image": null, "isCorrect": false}, {"id": "FH4Wv", "text": "\n$\\mathrm{S}^{2-}$\n", "image": null, "isCorrect": false}, {"id": "XZJzn", "text": "\n$\\mathrm{Cl}^{-}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/L9O8P46hjxskJlBkaa-cd2thuYhFOVl2mbPmEThROYw.original.fullsize.png\"><br>\nTherefore, the required locus is $\\frac{3}{x}+\\frac{2}{y}+\\frac{1}{z}=1$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["EXPERIMENT_BASED"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 1 Online)", "title": "JEE Main 2018 (15 Apr Shift 1 Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65def", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}], "question": {"text": "Which of the following statements about $\\mathrm{Na}_2 \\mathrm{O}_2$ is not correct?", "image": null}, "options": [{"id": "M9xAw", "text": "\nIt is diamagnetic in nature\n", "image": null, "isCorrect": false}, {"id": "dE4CJ", "text": "\nIt is derivative of $\\mathrm{H}_2 \\mathrm{O}_2$\n", "image": null, "isCorrect": false}, {"id": "UpyXI", "text": "\n$\\mathrm{Na}_2 \\mathrm{O}_2$ oxidises $\\mathrm{Cr}^{3+}$ to $\\mathrm{CrO}_4^{2-}$ in acid medium.\n", "image": null, "isCorrect": false}, {"id": "RPNKT", "text": "\nIt is the super oxide of sodium", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{Na}_2 \\mathrm{O}_2$ is peroxide of sodium not super oxide. The formula of sodium superoxide is $\\mathrm{NaO}_2$.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2014 (11 Apr Online)", "title": "JEE Main 2014 (11 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65ac5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}], "question": {"text": "Fire extinguishers contain $\\mathrm{H}_2 \\mathrm{SO}_4$ and which one of the following?", "image": null}, "options": [{"id": "eyKOp", "text": "\n$\\mathrm{NaHCO}_3$ and $\\mathrm{Na}_2 \\mathrm{CO}_3$\n", "image": null, "isCorrect": true}, {"id": "HHXjH", "text": "\n$\\mathrm{Na}_2 \\mathrm{CO}_3$\n", "image": null, "isCorrect": false}, {"id": "FiK7p", "text": "\n$\\mathrm{NaHCO}_3$\n", "image": null, "isCorrect": false}, {"id": "y0TU7", "text": "\n$\\mathrm{CaCO}_3^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Fire extinguishers contain a mixture of $\\mathrm{Na}_2 \\mathrm{CO}_3, \\mathrm{NaHCO}_3$ and $\\mathrm{H}_2 \\mathrm{SO}_4$.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65693", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "Based on lattice energy and other considerations which one of the following alkali metal chlorides is expected to have the highest melting point.", "image": null}, "options": [{"id": "iu2iy", "text": "\nLiCl\n", "image": null, "isCorrect": false}, {"id": "Kq4XE", "text": "\nNaCl\n", "image": null, "isCorrect": true}, {"id": "KKSLu", "text": "\nKCl \n", "image": null, "isCorrect": false}, {"id": "5QIVs", "text": "\nRbCl", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Although lattice energy of LiCl higher than NaCl but LiCl is covalent in nature and NaCl ionic there after , the melting point decreases as we move NaCl because the lattice energy decreases as a size of alkali metal atom increases (lattice energy ∝ to melting point of alkali metal halide)", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65402", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "A metal $\\mathrm{M}$ readily forms its sulphate $\\mathrm{MSO}_4$ which is water - soluble. It forms its oxide MO which becomes inert on heating. It forms an insoluble hydroxide $\\mathrm{M}(\\mathrm{OH})_2$ which is soluble in $\\mathrm{NaOH}$ solution. Then $M$ is", "image": null}, "options": [{"id": "od2Fz", "text": "\nMg\n", "image": null, "isCorrect": false}, {"id": "hqLXU", "text": "\nBa\n", "image": null, "isCorrect": false}, {"id": "Lw9L0", "text": "\nCa\n", "image": null, "isCorrect": false}, {"id": "m3OT4", "text": "\nBe", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Beryllium shows anomalous properties due to its small size", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d653e4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "$\\mathrm{KO}_2$ (potassium super oxide) is used in oxygen cylinders in space and submarines because it", "image": null}, "options": [{"id": "3TuZl", "text": "\nabsorbs $\\mathrm{CO}_2$ and increases $\\mathrm{O}_2$ content\n", "image": null, "isCorrect": true}, {"id": "NGufk", "text": "\neliminates moisture\n", "image": null, "isCorrect": false}, {"id": "OJH12", "text": "\nabsorbs $\\mathrm{CO}_2$\n", "image": null, "isCorrect": false}, {"id": "inuI6", "text": "\nproduces ozone.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/eCCzZQQWB2o2AomCJ__vTdNG2o2Rxj9_BQWnE1ZJ2Zg.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "648b5a73417cc3fb48d69273", "title": "Alkaline Earth Metals", "totalQuestions": 27, "questions": [{"_id": "648b5a6f417cc3fb48d6823c", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Chlorides of which metal are soluble in organic solvents:", "image": null}, "options": [{"id": "5uNaU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi></math>", "isCorrect": false, "image": null}, {"id": "bCCgD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mg</mi></math>", "isCorrect": false, "image": null}, {"id": "TVpK5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": false, "image": null}, {"id": "EF1SU", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>As per Fajan&#39;s rule, Be cations has a higher charge and smaller size, as a result, have a higher charge density and covalent nature.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi><mo>,</mo><mo>&#160;</mo><mi>Mg</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>&nbsp;are ionic compounds.</p><p>Hence, chlorides of Be will be more soluble in organic solvent.</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68021", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Given below are two statements, one is labelled as</p><p><strong>Assertion A</strong> and the other is labelled as <strong>Reason R</strong>.</p><p><strong>Assertion A :</strong> Beryllium has less negative value of reduction potential compared to the other alkaline earth metals</p><p><strong>Reason R :</strong> Beryllium has large hydration energy due to small size of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Be</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>but relatively large value of atomisation enthalpy.</p><p>In the light of the above statements, choose the most appropriate answer from the options given below.</p>", "image": null}, "options": [{"id": "qN4kI", "text": "A is correct but R is not correct", "isCorrect": false, "image": null}, {"id": "rYHaq", "text": "Both A and R are correct and R is the correct explanation of A", "isCorrect": true, "image": null}, {"id": "by99p", "text": "A is not correct but R is correct", "isCorrect": false, "image": null}, {"id": "BDbOz", "text": "Both A and R are correct and R is NOT the correct explanation of A", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Beryllium has the smallest atomic size amongst the alkaline earth metals. The loss of electrons or oxidation is difficult. Beryllium has the least oxidation potential. As Beryllium has the least oxidation potential, it has the highest reduction potential(Less negative value of reduction potential).&nbsp;However, it&#39;s reducing nature is due to large hydration energy associated with the small size of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Be</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math> ion and relatively large value of the atomisation enthalpy of metal.</p>", "image": null}, "videoSolution": {"videoId": "097b973a9bf346d69ac0c9324808182e", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/abumBYQvmdkU3.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/abumBYQvmdkU3.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["ASSERTION_REASON"], "previousYear": {"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d67fd1", "previousYearPapers": [{"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)", "title": "JEE Main 2023 (24 Jan Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>Reaction of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BeO</mi></math> with ammonia and hydrogen fluoride gives <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>'</mo><mi mathvariant=\"normal\">A</mi><mo>'</mo></math> which on thermal decomposition gives <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>BeF</mi><mn>2</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NH</mi><mn>4</mn></msub><mi mathvariant=\"normal\">F</mi></math>. What is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>'</mo><mi mathvariant=\"normal\">A</mi><mo>'</mo></math> ?</p>", "image": null}, "options": [{"id": "xn7oE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msub><mi>NBeF</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "g6lxH", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><msub><mi>NH</mi><mn>4</mn></msub></mfenced><mn>2</mn></msub><msub><mi>BeF</mi><mn>4</mn></msub></math></p>", "isCorrect": true, "image": null}, {"id": "3b1pR", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><msub><mi>NH</mi><mn>4</mn></msub></mfenced><mfenced><msub><mi>BeF</mi><mn>3</mn></msub></mfenced></math></p>", "isCorrect": false, "image": null}, {"id": "iPPMf", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><msub><mi>NH</mi><mn>4</mn></msub></mfenced><mn>2</mn></msub><mfenced><mrow><msub><mi>Be</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">F</mi><mn>6</mn></msub></mrow></mfenced></math></p>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Beryllium ion forms tetra coordinated complexes readily due to the presence of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">s</mi><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><mn>2</mn><mi mathvariant=\"normal\">p</mi></math>&nbsp;empty subshells&nbsp;as shown below.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d1f1cc6f-3fca-4836-91d3-cb4b20865443-75c934e2-501a-4efa-8cb0-bdd598eeb0c3-9884792.png\" style=\"width: 329px; height: 142px;\" /></p><p>&nbsp;</p>", "image": null}, "videoSolution": {"videoId": "7d0134b5acc94ce78f10ab24cb32f17b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/HYiqh9J6SDADW.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/HYiqh9J6SDADW.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)", "title": "JEE Main 2023 (24 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d67fc4", "previousYearPapers": [{"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)" ></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub></math>", "isCorrect": false, "image": null}, {"id": "TS02t", "text": "<math><mi>C</mi><mi>a</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi>N</mi><msub><mrow><mi>O</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<math><mi>B</mi><mi>a</mi><mi>&#160;</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi>N</mi><msub><mrow><mi>O</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub></math> does not have any water of crystallization. This happens because the large size of <math><mi>B</mi><msup><mrow><mi>a</mi></mrow><mrow><mo>+</mo><mn>2</mn></mrow></msup></math> leads to poor polarizing power and hence, unable to attract water molecules effectively.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 1)", "title": "JEE Main 2019 (09 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d6617f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2017 (08 Apr Online)", "title": "JEE Main 2017 (08 Apr Online)"}], "question": {"text": "Consider the following ionization enthalpies of two elements &#39;A&#39; and &#39;B&#39;.<br />&nbsp;<table border=\"1\">\t<tbody>\t\t<tr>\t\t\t<td>Element</td>\t\t\t<td colspan=\"3\">Ionization enthalphy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>kJ</mi><mo>/</mo><mi>mol</mi></mrow></mfenced></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>1</mn><mi>st</mi></msup></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mi>nd</mi></msup></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>3</mn><mi>rd</mi></msup></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>A</td>\t\t\t<td>899</td>\t\t\t<td>1757</td>\t\t\t<td>14847</td>\t\t</tr>\t\t<tr>\t\t\t<td>B</td>\t\t\t<td>737</td>\t\t\t<td>1450</td>\t\t\t<td>7731</td>\t\t</tr>\t</tbody></table><br /><br />Which of the following statements is correct?", "image": null}, "options": [{"id": "BNaVn", "text": "Both &#39;A&#39; and &#39;B&#39; belong to group-1 where &#39;A&#39; comes below &#39;B&#39;.", "image": null, "isCorrect": false}, {"id": "yYNFo", "text": "Both &#39;A&#39; and &#39;B&#39; belong to group-2 where &#39;A&#39; comes below &#39;B&#39;.", "image": null, "isCorrect": false}, {"id": "L4ISo", "text": "Both &#39;A&#39; and &#39;B&#39; belong to group-1 where &#39;B&#39; comes below &#39;A&#39;.", "image": null, "isCorrect": false}, {"id": "xfO1W", "text": "Both &#39;A&#39; and &#39;B&#39; belong to group-2 where &#39;B&#39; comes below &#39;A&#39;.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Both &#39;A&#39; and &#39;B&#39; belong to group-2, because the 3<sup>rd</sup> ionization energy is very high, it means 3<sup>rd</sup>&nbsp;electron&nbsp;gets removed from internal shell&nbsp;and&nbsp;where &#39;B&#39; comes below &#39;A&#39;,&nbsp;because on moving from top to bottom in group the ionization energy decreases.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["TABLE_BASED"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2017 (08 Apr Online)", "title": "JEE Main 2017 (08 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d66063", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7df", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2016 (09 Apr Online)", "title": "JEE Main 2016 (09 Apr Online)"}], "question": {"text": "The correct order of the solubility of alkaline-earth metal sulphates in water is:", "image": null}, "options": [{"id": "rmRWQ", "text": "Mg &gt; Ca &gt; Sr &gt; Ba", "image": null, "isCorrect": true}, {"id": "VL1Fm", "text": "Mg > Sr > Ca > Ba", "image": null, "isCorrect": false}, {"id": "D87d7", "text": "Mg < Ca < Sr < Ba", "image": null, "isCorrect": false}, {"id": "E8Wyp", "text": "Mg < Sr < Ca < Ba", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Hydration power energy <math><mo>&#8733;</mo></math>&nbsp; <math> <mrow> <msub> <mtext>q</mtext> <mtext>1</mtext> </msub> <msub> <mtext>q</mtext> <mtext>2</mtext> </msub> <mrow><mo>(</mo> <mrow> <mfrac> <mtext>1</mtext> <mrow> <msub> <mtext>r</mtext> <mo>+</mo> </msub> </mrow> </mfrac> <mtext>+</mtext><mfrac> <mtext>1</mtext> <mrow> <msub> <mtext>r</mtext> <mo>&#8722;</mo> </msub> </mrow> </mfrac> </mrow> <mo>)</mo></mrow></mrow> </math><br /><br /><math><mo>&#8756;</mo></math> Solubility order of IIA group element sulphates in water:<br /><br /><math><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>&#62;</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>&#62;</mo><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow
