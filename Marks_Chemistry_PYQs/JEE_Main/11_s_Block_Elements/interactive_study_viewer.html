  <script>
    const data = {"index": 11, "chapterId": "616024a89f964d9d52aa6b8b", "chapter": "s Block Elements", "totalTopics": 5, "totalQuestions": 134, "downloadTime": "2026-10-08 19:49:05", "topics": [{"index": 1, "topicId": "648b5a73417cc3fb48d69272", "title": "General Characteristics of Alkali Metals", "totalQuestions": 47, "questions": [{"_id": "69d8074f81239f6567c4f443", "type": "numerical", "question": {"text": "First and second ionization enthalpies of lithium are $520$ kJ mol$^{-1}$ and $7297$ kJ mol$^{-1}$ respectively. Energy required to convert $3.5$ mg lithium (g) into $\\text{Li}^{2+}$(g) $[\\text{Li(g)} \\rightarrow \\text{Li}^{2+}\\text{(g)}]$ is _______ kJ mol$^{-1}$. (nearest integer) [Molar mass of Li $= 7$ g mol$^{-1}$]", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "The total energy required to convert $1$ mole of $\\text{Li(g)}$ to $\\text{Li}^{2+}\\text{(g)}$ is the sum of the first and second ionization enthalpies:<br><br>$E = IE_1 + IE_2 = 520 + 7297 = 7817 \\text{ kJ mol}^{-1}$<br><br>Given mass of lithium $= 3.5 \\text{ mg} = 3.5 \\times 10^{-3} \\text{ g}$<br><br>Number of moles of lithium $= \\dfrac{3.5 \\times 10^{-3} \\text{ g}}{7 \\text{ g mol}^{-1}} = 5 \\times 10^{-4} \\text{ mol}$<br><br>Energy required for $5 \\times 10^{-4} \\text{ mol}$ of Li is:<br><br>$\\text{Energy} = 5 \\times 10^{-4} \\text{ mol} \\times 7817 \\text{ kJ mol}^{-1} = 3.9085 \\text{ kJ}$<br><br>Rounding to the nearest integer, we get $4$ KJ.<br><br>Answer: $4$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "892e5b9cdd954adbbcf56c0e8faf122b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/jQOTDXXOKX20c.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/ humbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/AL6cml9LDKVGT.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/AL6cml9LDKVGT.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d68676", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6494", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 Apr Shift 1)", "title": "JEE Main 2023 (13 Apr Shift 1)"}], "question": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi><mo>(</mo><mi>OH</mi><msub><mo>)</mo><mn>2</mn></msub></math> reacts with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Sr</mi><mo>(</mo><mi>OH</mi><msub><mo>)</mo><mn>2</mn></msub></math> to yield an ionic salt.&nbsp;Choose the incorrect option related to this reaction from the following</p>", "image": null}, "options": [{"id": "fbByC", "text": "<p>Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Sr</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi></math> elements are present in the ionic salt</p>", "image": null, "isCorrect": false}, {"id": "iiUfw", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi></math>is tetrahedrally coordinated in the ionic salt</p>", "image": null, "isCorrect": false}, {"id": "H59H7", "text": "<p>The element <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi></math> is present in the cationic part of the ionic salt</p>", "image": null, "isCorrect": true}, {"id": "3Qi16", "text": "<p>The reaction is an example of acid-base neutralization reaction</p>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi><msub><mfenced><mi>OH</mi></mfenced><mn>2</mn></msub></math>&nbsp;has&nbsp;amphoteric nature.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Sr</mi><msub><mfenced><mi>OH</mi></mfenced><mn>2</mn></msub></math>&nbsp;has basic nature. These two compounds undergo acid-base reaction to get salt,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi><msub><mfenced><mi>OH</mi></mfenced><mn>2</mn></msub><mo>+</mo><mi>Sr</mi><msub><mfenced><mi>OH</mi></mfenced><mn>2</mn></msub><mo>&#10230;</mo><msup><mi>Sr</mi><mrow><mo>+</mo><mn>2</mn></mrow></msup><msup><mfenced open=\"[\" close=\"]\"><mrow><mi>Be</mi><mo>(</mo><mi>OH</mi><msub><mo>)</mo><mn>4</mn></msub></mrow></mfenced><mrow><mo>-</mo><mn>2</mn></mrow></msup></math></p><p>As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi></math> is present in anionic part.</p>", "image": null}, "videoSolution": {"videoId": "30b8f9f3bc2843d3bc08e4ab9716901d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/IgIp28hhEQVvu.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/IgIp28hhEQVvu.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6494", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 Apr Shift 1)", "title": "JEE Main 2023 (13 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d68624", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}], "question": {"text": "The density of alkali metals is in the order", "image": null}, "options": [{"id": "hpwcc", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi><mo>&#60;</mo><mi>Cs</mi><mo>&#60;</mo><mi>Na</mi><mo>&#60;</mo><mi>Rb</mi></math>", "image": null, "isCorrect": false}, {"id": "oLXX1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi><mo>&#60;</mo><mi>Rb</mi><mo>&#60;</mo><mi mathvariant=\"normal\">K</mi><mo>&#60;</mo><mi>Cs</mi></math>", "image": null, "isCorrect": false}, {"id": "fkgoV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi><mo>&#60;</mo><mi mathvariant=\"normal\">K</mi><mo>&#60;</mo><mi>Cs</mi><mo>&#60;</mo><mi>Rb</mi></math>", "image": null, "isCorrect": false}, {"id": "t6ucV", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi><mo>&#60;</mo><mi>Na</mi><mo>&#60;</mo><mi>Rb</mi><mo>&#60;</mo><mi>Cs</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "As we down in a group then its size increases and also volume of the atom increases as the number of electrons and protons increases. But the increase in mass is greater than that of increase in volume so the density which is defined as mass per unit volume will increase generally. Density of alkali metals increases down the group except potassium. Therefore, correct order of density of given alkali metals is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi><mo>&#60;</mo><mi>Na</mi><mo>&#60;</mo><mi>Rb</mi><mo>&#60;</mo><mi>Cs</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["SEQUENCE_ORDER"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d685bd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}], "question": {"text": "Alkali metal from the following with least melting point is", "image": null}, "options": [{"id": "hvxTY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cs</mi></math>", "image": null, "isCorrect": true}, {"id": "sqI0u", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Rb</mi></math>", "image": null, "isCorrect": false}, {"id": "51gU3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi></math>", "image": null, "isCorrect": false}, {"id": "tY1Wk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>On moving down the group in alkali metals, the melting point generally decreases.&nbsp;</p><p>As you move down the alkali metal group (Group 1 of the periodic table), the atomic size or atomic radius increases. This increase in atomic size leads to a decrease in the strength of metallic bonds between the alkali metal atoms. Weaker metallic bonding results in lower melting points because less energy is required to overcome these weaker bonds and convert the solid metal into a liquid state.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Element</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">M</mi><mo>.</mo><mi mathvariant=\"normal\">P</mi><mo>.</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">K</mi><mo>)</mo><mspace linebreak=\"newline\"></mspace><mo>&#160;</mo><mi>Na</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mn>371</mn><mspace linebreak=\"newline\"></mspace><mi mathvariant=\"normal\">K</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mn>336</mn><mspace linebreak=\"newline\"></mspace><mi>Rb</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mn>312</mn><mspace linebreak=\"newline\"></mspace><mi>Cs</mi><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mn>302</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68565", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6492", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 1)", "title": "JEE Main 2023 (11 Apr Shift 1)"}], "question": {"text": "<p>Match List-I with List-II:</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td>List-I</td>\t\t\t<td>&nbsp;</td>\t\t\t<td>List-II</td>\t\t</tr>\t\t<tr>\t\t\t<td>A.</td>\t\t\t<td>K</td>\t\t\t<td>I.</td>\t\t\t<td>Thermonuclear reactions</td>\t\t</tr>\t\t<tr>\t\t\t<td>B.</td>\t\t\t<td>KCI</td>\t\t\t<td>II.</td>\t\t\t<td>Fertilizer</td>\t\t</tr>\t\t<tr>\t\t\t<td>C.</td>\t\t\t<td>KOH</td>\t\t\t<td>III.</td>\t\t\t<td>Sodium potassium pump</td>\t\t</tr>\t\t<tr>\t\t\t<td>D.</td>\t\t\t<td>Li</td>\t\t\t<td>IV.</td>\t\t\t<td>Absorbent of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math></td>\t\t</tr>\t</tbody></table><p>&nbsp;</p>", "image": null}, "options": [{"id": "gZwZU", "text": "A(III), B(II), C(IV), D(I)", "image": null, "isCorrect": true}, {"id": "FOsmR", "text": "A(III), B(IV), C(II), D(I)", "image": null, "isCorrect": false}, {"id": "vgQmh", "text": "A(IV), B(I), C(III), D(II)", "image": null, "isCorrect": false}, {"id": "3xF2h", "text": "A(IV), B(III), C(I), D(II)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Lithium can indeed participate in thermonuclear reactions, specifically in certain fusion reactions.</p><p>The movement of<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mo>+</mo></msup></math> ions (potassium ions) is indeed involved in the functioning of the sodium-potassium pump.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>KOH</mi><mo>&#160;</mo></math>(potassium hydroxide) can act as an absorbent of carbon dioxide.&nbsp;This property is primarily due to the alkaline nature of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>KOH</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>KCl</mi></math> (potassium chloride) is commonly used as a fertilizer in agriculture due to its high potassium content.</p><p>So option A is correct.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6492", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 1)", "title": "JEE Main 2023 (11 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d684c6", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6490", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 1)", "title": "JEE Main 2023 (10 Apr Shift 1)"}], "question": {"text": "<p>In the following reaction, the total number of oxygen atoms in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Y</mi></math> is______&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#8594;</mo><mn>2</mn><mi mathvariant=\"normal\">X</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Cl</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>7</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#8594;</mo><mn>2</mn><mi mathvariant=\"normal\">Y</mi></math></p>", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "<blockquote><p>Let&#39;s first balance the two given chemical equations:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#10230;</mo><mn>2</mn><mi>NaOH</mi><mfenced><mi mathvariant=\"normal\">X</mi></mfenced></math></p><p>In this equation, there are two <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math> molecules, so the total number of oxygen atoms in the products is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Cl</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>7</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#10230;</mo><mn>2</mn><msub><mi>HClO</mi><mn>4</mn></msub><mfenced><mi mathvariant=\"normal\">Y</mi></mfenced></math></p><p>In this equation, there are two&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>HClO</mi><mn>4</mn></msub></math> molecules, so the total number of oxygen atoms in the products is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo></math></p><p>So&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math> has one <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math> has four <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math>.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6490", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 1)", "title": "JEE Main 2023 (10 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68462", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 2)", "title": "JEE Main 2023 (08 Apr Shift 2)"}], "question": {"text": "<p>Given below are two statements: One is labelled as<br />Assertion <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math> and the other is labelled as Reason <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math><br />Assertion <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math>: Sodium is about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn></math> times as abundant as potassium in the oceans.<br />Reason <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math>: Potassium is bigger in size than sodium.<br />In the light of the above statements, choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "Wyu9p", "text": "Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> are true and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> is the correct explanation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math><br />&nbsp;", "image": null, "isCorrect": false}, {"id": "6QkgA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math> is true but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> is false", "image": null, "isCorrect": false}, {"id": "GD89x", "text": "Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> are true but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> is NOT the correct explanation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math>", "image": null, "isCorrect": true}, {"id": "Mz6qi", "text": "Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> are&nbsp;false", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Sodium is indeed about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn></math> times more abundant than potassium in seawater. This is because sodium is more soluble in water than potassium, and is therefore more readily dissolved from rocks and minerals into seawater.</p><p>Potassium is bigger than sodium in size as atomic number of potassium is more than sodium and Potassium has one additional electron shell compared to sodium, which means that its atomic radius is larger.</p><p>So Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> are true but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> is NOT the correct explanation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["ASSERTION_REASON"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 2)", "title": "JEE Main 2023 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68401", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}], "question": {"text": "<p>Given below are two statements :</p><p>Statement I : Lithium and Magnesium do not form superoxide</p><p>Statement II : The ionic radius of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Li</mi><mo>+</mo></msup></math> is larger than ionic radius of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Mg</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math> In the light of the above statements, choose the most appropriate answer from the questions given below :</p><p>In the light of the above statements, choose the most appropriate answer from the questions given below :</p>", "image": null}, "options": [{"id": "Vi5bX", "text": "Statement I is incorrect but Statement II is correct", "image": null, "isCorrect": false}, {"id": "zYyqa", "text": "Statement I is correct but Statement II is incorrect", "image": null, "isCorrect": false}, {"id": "NDc20", "text": "Both statement I and Statement II are incorrect", "image": null, "isCorrect": false}, {"id": "9BQ2t", "text": "Both Statement I and Statement II are correct", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<blockquote><p>The values of ionic radii of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Li</mi><mo>+</mo></msup><mo>=</mo><mo>&#160;</mo><mn>0</mn><mo>.</mo><mn>74</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#197;</mi></math>and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Mg</mi><mrow><mo>+</mo><mn>2</mn></mrow></msup><mo>=</mo><mo>&#160;</mo><mn>0</mn><mo>.</mo><mn>72</mn><mo>&#160;</mo><mi mathvariant=\"normal\">&#197;</mi></math>&nbsp;respectively. Thus, the lithium ion with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mn>1</mn></math> charge is only marginally larger than the magnesium ion having a charge of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mn>2</mn></math>.</p><p>The superoxide releases the most energy when formed, the superoxide is preferentially formed for the larger metals where the more complex anions are not polarised. So, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><mi>Mg</mi></math> do not form superoxides.</p><p>Therefore both the given options were correct.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d683ab", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 2)", "title": "JEE Main 2023 (06 Apr Shift 2)"}], "question": {"text": "Ion having highest hydration enthalpy among the given alkaline earth metal ions is:", "image": null}, "options": [{"id": "Y3LbR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Be</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "93hmn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Sr</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "5SN1f", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Ba</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "mye5y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Ca</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Smaller the size of the cation, more the hydration of ion, hence the more values of the hydration enthalpies. Now, as the down the group the size increases so the hydration enthalpies decreases, hence as the increasing order of the size of the ions is as follows:<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Be</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>&#60;</mo><msup><mi>Mg</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>&#60;</mo><msup><mi>Ca</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>&#60;</mo><msup><mi>Sr</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>&#60;</mo><msup><mi>Ba</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math><br />and reverse of this order is true for the hydration enthalpies.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Be</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>&#62;</mo><msup><mi>Mg</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>&#62;</mo><msup><mi>Ca</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>&#62;</mo><msup><mi>Sr</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>&#62;</mo><msup><mi>Ba</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 2)", "title": "JEE Main 2023 (06 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68306", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "The number of alkali metal(s), from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>,</mo><mo>&#160;</mo><mi>Cs</mi><mo>,</mo><mo>&#160;</mo><mi>Rb</mi></math> having ionization enthalpy greater than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>400</mn><mo>&#160;</mo><mi>kJ</mi><mo>&#160;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and forming stable super oxide is", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "<p>The super oxide <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">O</mi><mn>2</mn><mo>-</mo></msubsup></math> ion is stable only in the presence of large cations <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi><mo>,</mo><mi>Rb</mi><mo>,</mo><mi>Cs</mi></math>. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi><mo>,</mo><mi>Rb</mi></math> have <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>IE</mi><mn>1</mn></msub><mo>&#62;</mo><mn>400</mn><mo>&#160;</mo><mi>kJ</mi><mo>/</mo><mi>mol</mi></math>&nbsp;from the table below. Ionisation enthalpy decreases down the group as metallic character increases.<br />&nbsp;</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>Metal</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Rb</mi></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cs</mi></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>IE</mi><mo>(</mo><mi>KJ</mi><mo>/</mo><mi>mol</mi><mo>)</mo></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>520</mn></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>496</mn></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>419</mn></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>403</mn></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>376</mn></math></td>\t\t</tr>\t</tbody></table>", "image": null}, "videoSolution": {"videoId": "c394a2b8c7ec414ea2f0041ce433a60a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/7BquWZ10NInqy.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/7BquWZ10NInqy.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68241", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which of the following reaction is correct?", "image": null}, "options": [{"id": "YqRT7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>LiNO</mi><mn>3</mn></msub><mover><mo>&#10230;</mo><mi>&#916;</mi></mover><mn>2</mn><msub><mi>LiNO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "Ez2Jn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi>LiNO</mi><mn>3</mn></msub><mover><mo>&#10230;</mo><mi>&#916;</mi></mover><mn>2</mn><msub><mi>Li</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><mn>2</mn><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>4</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "X6Kvk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi>LiNO</mi><mn>3</mn></msub><mover><mo>&#10230;</mo><mi>&#916;</mi></mover><mn>2</mn><msub><mi>Li</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><mn>4</mn><msub><mi>NO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "VSowT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>LiNO</mi><mn>3</mn></msub><mover><mo>&#10230;</mo><mi>&#916;</mi></mover><mn>2</mn><mi>Li</mi><mo>+</mo><mn>2</mn><msub><mi>NO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Lithium nitrate when decomposed, the product formed are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Li</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>,</mo><mo>&#160;</mo><msub><mi>NO</mi><mn>2</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>. The remaining alkali metal nitrates decomposes to nitrite of metals and oxygen gas.&nbsp;It is due to the lithium monoxide is stable than other monoxides.&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi>LiNO</mi><mn>3</mn></msub><mover><mo>&#10230;</mo><mi>&#916;</mi></mover><mn>2</mn><msub><mi>Li</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><mn>4</mn><msub><mi>NO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68198", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}], "type": "numerical", "level": 1, "question": {"text": "On heating, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>LiNO</mi><mn>3</mn></msub></math>&nbsp;gives how many compounds among the following?<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Li</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>,</mo><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><mo>,</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>,</mo><msub><mi>LiNO</mi><mn>2</mn></msub><mo>,</mo><msub><mi>NO</mi><mn>2</mn></msub></math>", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<p>Decomposition of Lithium Nitrate occurs via the following reaction:<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>LiNO</mi><mn>3</mn></msub><mover><mo>&#10230;</mo><mi mathvariant=\"normal\">&#916;</mi></mover><msub><mi>Li</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><mn>2</mn><msub><mi>NO</mi><mn>2</mn></msub><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math></p><p>Hence three products <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Li</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>,</mo><msub><mi>NO</mi><mn>2</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68134", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>The correct order of hydration enthalpies is</p><p>(A)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">K</mi><mo>+</mo></msup></math><br />(B)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Rb</mi><mo>+</mo></msup></math><br />(C)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Mg</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math><br />(D)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Cs</mi><mo>+</mo></msup></math><br />(E)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Ca</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math></p><p>Choose the correct answer from the options given below:</p>", "image": null}, "options": [{"id": "krPhj", "text": "C &gt; A &gt; E &gt; B &gt; D", "isCorrect": false, "image": null}, {"id": "wRDDD", "text": "E &gt; C &gt; A &gt; B &gt; D", "isCorrect": false, "image": null}, {"id": "0eQnS", "text": "C &gt; E &gt; A &gt; D &gt; B", "isCorrect": false, "image": null}, {"id": "IEy0d", "text": "C &gt; E &gt; A &gt; B &gt; D", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>The hydration enthalpy of alkali metal ions decreases with an increase in ionic sizes.</p><p>So, the order is:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Li</mi><mo>+</mo></msup><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><msup><mi>Na</mi><mo>+</mo></msup><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mrow><mo>+</mo><mo>&#160;</mo></mrow></msup><mo>&#62;</mo><mo>&#160;</mo><msup><mi>Rb</mi><mo>+</mo></msup><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><msup><mi>Cs</mi><mo>+</mo></msup></math></p><p>Like alkali metal ions, the hydration enthalpies of alkaline earth metal ions decrease with an increase in ionic size down the group.</p><p>So, the order is:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Be</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><msup><mi>Mg</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><msup><mi>Ca</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><msup><mi>Sr</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><msup><mi>Ba</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>&nbsp;</p><p>The hydration enthalpies of alkaline earth metal ions are larger than those of alkali metal ions.&nbsp;</p><p>So, the correct order is:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Mg</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><msup><mi>Ca</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><msup><mi mathvariant=\"normal\">K</mi><mo>+</mo></msup><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><msup><mi>Rb</mi><mo>+</mo></msup><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><msup><mi>Cs</mi><mo>+</mo></msup></math>&nbsp;</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["SEQUENCE_ORDER"], "previousYear": {"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6812b", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The magnetic behaviour of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Li</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KO</mi><mn>2</mn></msub></math>, respectively, are", "image": null}, "options": [{"id": "Dl1u6", "text": "diamagnetic, paramagnetic and diamagnetic", "isCorrect": false, "image": null}, {"id": "VEvPE", "text": "paramagnetic, paramagnetic and diamagnetic", "isCorrect": false, "image": null}, {"id": "yIUK2", "text": "paramagnetic, diamagnetic and paramagnetic", "isCorrect": false, "image": null}, {"id": "n5Gr1", "text": "diamagnetic, diamagnetic and paramagnetic", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>In the structure&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Li</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>&nbsp;each&nbsp;lithium atom loses one electron to form 2 cations <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Li</mi><mo>+</mo></msup></math>&nbsp;and&nbsp;oxygen atom gains two electrons to form the anion&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">O</mi><mrow><mn>2</mn><mo>-</mo></mrow></msup></math>.&nbsp; It has no unpaired electrons. So, it is diamagnetic in nature.&nbsp;</p><p>The peroxide&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">O</mi><mn>2</mn><mrow><mn>2</mn><mo>-</mo></mrow></msubsup></math>&nbsp;present in&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>&nbsp;has 4 electron in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">&#960;</mi><mo>*</mo></msup><mn>2</mn><mi mathvariant=\"normal\">p</mi></math>, thus all are paired. So, it is diamagnetic in nature.</p><p>In the structure&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KO</mi><mn>2</mn></msub></math>&nbsp;oxygen is present in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">O</mi><mn>2</mn><mo>-</mo></msubsup></math>. The number of electrons present is 17, where the&nbsp;where the sixteen electrons are from two oxygen atoms and one from the negative charge. There is one unpaired electron present in the last orbital. Hence, it is paramagnetic in nature.&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Li</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#8594;</mo></math>&nbsp;diamagnetic</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#8594;</mo></math>&nbsp;diamagnetic</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KO</mi><mn>2</mn></msub><mo>&#8594;</mo></math>&nbsp;paramagnetic</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d680e1", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which of the following represents the correct order of metallic character of the given elements?", "image": null}, "options": [{"id": "v3i1C", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Si</mi><mo>&#60;</mo><mi>Be</mi><mo>&#60;</mo><mi>Mg</mi><mo>&#60;</mo><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": true, "image": null}, {"id": "GNbPo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi><mo>&#60;</mo><mi>Si</mi><mo>&#60;</mo><mi>Mg</mi><mo>&#60;</mo><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": false, "image": null}, {"id": "RendL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi><mo>&#60;</mo><mi>Mg</mi><mo>&#60;</mo><mi>Be</mi><mo>&#60;</mo><mi>Si</mi></math>", "isCorrect": false, "image": null}, {"id": "TxcUx", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi><mo>&#60;</mo><mi>Si</mi><mo>&#60;</mo><mi mathvariant=\"normal\">K</mi><mo>&#60;</mo><mi>Mg</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Group 1 elements are most metallic, as we go across the periodic table metallic character increases while going down the group and decreases along the period. Silicon is p-block element, potassium, beryllium and magnesium are s-block elements.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["SEQUENCE_ORDER"], "previousYear": {"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d680d5", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which one among the following metals is the weakest reducing agent?", "image": null}, "options": [{"id": "lSSzi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": false, "image": null}, {"id": "VkMkA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Rb</mi></math>", "isCorrect": false, "image": null}, {"id": "dzeBQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi></math>", "isCorrect": true, "image": null}, {"id": "eLKtz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>According to the electrochemical series</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">K</mi><mo>+</mo></msup><mo>&#160;</mo><mo>/</mo><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mo>-</mo><mn>2</mn><mo>.</mo><mn>93</mn><mi mathvariant=\"normal\">V</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Rb</mi><mo>+</mo></msup><mo>&#160;</mo><mo>/</mo><mo>&#160;</mo><mi>Rb</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mo>-</mo><mn>2</mn><mo>.</mo><mn>98</mn><mi mathvariant=\"normal\">V</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Na</mi><mo>+</mo></msup><mo>&#160;</mo><mo>/</mo><mo>&#160;</mo><mi>Na</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mo>-</mo><mn>2</mn><mo>.</mo><mn>71</mn><mi mathvariant=\"normal\">V</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Li</mi><mo>+</mo></msup><mo>&#160;</mo><mo>/</mo><mo>&#160;</mo><mi>Li</mi><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mo>-</mo><mn>3</mn><mo>.</mo><mn>05</mn><mi mathvariant=\"normal\">V</mi></math></p><p>Among the given alkali metals, sodium metal is the weakest reducing agent as its standard reduction potential is least&nbsp;negative which is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">E</mi><mrow><msup><mi>Na</mi><mo>+</mo></msup><mo>/</mo><mi>Na</mi></mrow><mo>&#176;</mo></msubsup><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mo>-</mo><mn>2</mn><mo>.</mo><mn>71</mn></math></p><p>So, the correct option is C.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d680d1", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Given below are two statements, one is labelled as Assertion A and the other is labelled as Reason R</p><p><strong>Assertion A:-</strong> The alkali metals and their salts impart characteristic colour to reducing flame.</p><p><strong>Reason R:-</strong> Alkali metals can be detected using flame tests.</p><p>In the light of the above statements, choose the most appropriate answer form the options given below</p>", "image": null}, "options": [{"id": "PQf7p", "text": "Both A and R are correct but R is NOT the correct explanation of A.", "isCorrect": false, "image": null}, {"id": "r9Nbx", "text": "A is correct but R is not correct.", "isCorrect": false, "image": null}, {"id": "6CQl1", "text": "A is not correct but R is correct", "isCorrect": true, "image": null}, {"id": "nXxVU", "text": "Both A and R are correct and R is the correct explanation of A.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>An assertion is incorrect because alkali metals and their salts impart characteristic colour to an oxidising part of the flame and not a reducing part of the flame. The heat from the flame excites the outermost orbital electron to a higher energy level. When the excited electron comes back to the ground state, there is an emission of radiation in the visible region.</p><p>Reason is correct because all alkali metals can be detected by their flame tests and can be determined by flame photometry or atomic absorption spectroscopy.&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["ASSERTION_REASON"], "previousYear": {"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68081", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match List I with List II</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 400px;\">\t<tbody>\t\t<tr>\t\t\t<td colspan=\"2\" rowspan=\"1\" style=\"text-align: center;\"><strong>List I</strong></td>\t\t\t<td colspan=\"2\" rowspan=\"1\" style=\"text-align: center;\"><strong>List II</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td colspan=\"2\" rowspan=\"1\" style=\"text-align: center;\"><strong>Elements</strong></td>\t\t\t<td colspan=\"2\" rowspan=\"1\" style=\"text-align: center;\"><strong>Colour imparted to the flame</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td style=\"text-align: center;\">A</td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi></math></td>\t\t\t<td style=\"text-align: center;\">I</td>\t\t\t<td style=\"text-align: center;\">Brick Red</td>\t\t</tr>\t\t<tr>\t\t\t<td style=\"text-align: center;\">B</td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi></math></td>\t\t\t<td style=\"text-align: center;\">II</td>\t\t\t<td style=\"text-align: center;\">Violet</td>\t\t</tr>\t\t<tr>\t\t\t<td style=\"text-align: center;\">C</td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Sr</mi></math></td>\t\t\t<td style=\"text-align: center;\">III</td>\t\t\t<td style=\"text-align: center;\">Apple Green</td>\t\t</tr>\t\t<tr>\t\t\t<td style=\"text-align: center;\">D</td>\t\t\t<td style=\"text-align: center;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ba</mi></math></td>\t\t\t<td style=\"text-align: center;\">IV</td>\t\t\t<td style=\"text-align: center;\">Crimson Red</td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below:</p>", "image": null}, "options": [{"id": "CJWOV", "text": "A-II, B-I, C-III, D-IV", "isCorrect": false, "image": null}, {"id": "lP1si", "text": "A-II, B-IV, C-I, D-III", "isCorrect": false, "image": null}, {"id": "IdPk9", "text": "A-II, B-I, C-IV, D-III", "isCorrect": true, "image": null}, {"id": "z44QP", "text": "A-IV, B-III, C-II, D-I", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The colours of the flame are produced because of the movement of the electrons in the metal ions present in their salts. Calcium exhibits a&nbsp;brick-red colour. Strontium exhibits crimson colour. And the barium exhibits an apple green colour.&nbsp;</p><p>K is an&nbsp;alkali metal.&nbsp;Potassium is colourless or white but when it is heated, it produces a violet flame due to the excitation of the electrons to the higher energy orbitals. Potassium burns with a light purple-coloured flame.</p><p>So, the correct option is C</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68028", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The number of s-electrons present in an ion with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>55</mn></math>&nbsp;protons in its unipositive state is", "image": null}, "options": [{"id": "PefnZ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>", "isCorrect": false, "image": null}, {"id": "FCpSl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn></math>", "isCorrect": false, "image": null}, {"id": "q1ksW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn></math>", "isCorrect": false, "image": null}, {"id": "9N14a", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>The atom with 55 protons is caesium(Cs). The electronic configuration of Cs is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup><mn>2</mn><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup><mn>2</mn><msup><mi mathvariant=\"normal\">p</mi><mn>6</mn></msup><mn>3</mn><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup><mn>3</mn><msup><mi mathvariant=\"normal\">p</mi><mn>6</mn></msup><mn>4</mn><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup><mn>3</mn><msup><mi mathvariant=\"normal\">d</mi><mn>10</mn></msup><mn>4</mn><msup><mi mathvariant=\"normal\">p</mi><mn>6</mn></msup><mn>5</mn><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup><mn>4</mn><msup><mi mathvariant=\"normal\">d</mi><mn>10</mn></msup><mn>5</mn><msup><mi mathvariant=\"normal\">p</mi><mn>6</mn></msup><mn>6</mn><msup><mi mathvariant=\"normal\">s</mi><mn>1</mn></msup></math>.</p><p>The mono positive ion means one electron is removed from outermost orbital. Hence, the sum of electrons in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mi mathvariant=\"normal\">s</mi><mo>,</mo><mo>&#160;</mo><mn>2</mn><mi mathvariant=\"normal\">s</mi><mo>,</mo><mo>&#160;</mo><mn>3</mn><mi mathvariant=\"normal\">s</mi><mo>,</mo><mo>&#160;</mo><mn>4</mn><mi mathvariant=\"normal\">s</mi><mo>,</mo><mo>&#160;</mo><mn>5</mn><mi mathvariant=\"normal\">s</mi></math>&nbsp;orbitals&nbsp;are<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68020", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Identify the correct statements about alkali metals.</p><p>A. The order of standard reduction potential <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><msup><mi mathvariant=\"normal\">M</mi><mo>+</mo></msup><mo>&#160;</mo><mo>|</mo><mo>&#160;</mo><mi mathvariant=\"normal\">M</mi><mo>)</mo></math>&nbsp;for alkali metal ions is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><mi>Rb</mi><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><mi>Li</mi></math>.</p><p>B. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CsI</mi></math> is highly soluble in water.</p><p>C. Lithium carbonate is highly stable to heat.</p><p>D. Potassium dissolved in concentrated liquid ammonia is blue and paramagnetic.</p><p>E. All alkali metal hydrides are ionic solids.</p><p>Choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "Sz5Zp", "text": "A, B, D only", "isCorrect": false, "image": null}, {"id": "OW5OA", "text": "C and E only", "isCorrect": false, "image": null}, {"id": "EkE3k", "text": "A and E only", "isCorrect": true, "image": null}, {"id": "DkKHm", "text": "A, B and E only", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>A. Electrode potential of given elements are:</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mo>-</mo><mn>3</mn><mo>.</mo><mn>04</mn><mo>&#160;</mo><mspace linebreak=\"newline\"></mspace><mo>&#160;</mo><mi>Na</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mo>-</mo><mn>2</mn><mo>.</mo><mn>714</mn><mo>&#160;</mo><mspace linebreak=\"newline\"></mspace><mo>&#160;</mo><mi>Rb</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mo>-</mo><mn>2</mn><mo>.</mo><mn>98</mn></math></p><p>The standard reduction potentials (E) of the alkali metals do not follow the trend based on ionisation energies. Unexpectedly, lithium is the strongest reductant, and sodium is the weakest. Therefore, reducing character sequences is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi><mo>&#160;</mo><mo>&#60;</mo><mi>Rb</mi><mo>&#160;</mo><mo>&#60;</mo><mo>&#160;</mo><mi>Li</mi><mo>.</mo></math></p><p>B. The low solubility of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CsI</mi></math> is due to smaller hydration enthalpy of its two ions.</p><p>C.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Li</mi><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub></math>&nbsp;decomposes readily to lithium monoxide and carbon dioxide.</p><p>D. Alkali metals are sodium, potassium which with liquid ammonia produce blue coloured solutions. Alkali metals dissolve in liquid ammonia to produce ammoniated electrons. It is paramagnetic due to the presence of unpaired electrons.</p><p>E.All the alkali metal hydrides are ionic solids with high melting points.</p><p>Hence, the correct option is A and E</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MULTI_STATEMENT"], "previousYear": {"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67dab", "previousYearPapers": [{"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Lithium nitrate and sodium nitrate, when heated separately, respectively, give", "image": null}, "options": [{"id": "Wkwnt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>LiNO</mi><mn>2</mn></msub></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NaNO</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "RkYJw", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Li</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>", "isCorrect": false, "image": null}, {"id": "4rIwg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Li</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NaNO</mi><mn>2</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "3N231", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>LiNO</mi><mn>2</mn></msub></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Na</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Lithium nitrate when heated gives lithium oxide, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Li</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>, whereas other alkali metal nitrates decompose to give the corresponding nitrite.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msub><mi>LiNO</mi><mn>3</mn></msub><mo>&#10230;</mo><mn>2</mn><msub><mi>Li</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><mn>4</mn><msub><mi>NO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi>NaNO</mi><mn>3</mn></msub><mo>&#10230;</mo><mn>2</mn><msub><mi>NaNO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math></p><p>However, the decomposition product of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NaNO</mi><mn>3</mn></msub></math> are temperature dependent process as shown in the below reaction.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/af997a1d-9714-4d01-bed6-bd981cc65604-image.png\" style=\"width: 281px; height: 120px;\" /></p></blockquote>", "image": null}, "videoSolution": {"videoId": "bf07403cf92d4e859efa4a76d674bd73", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/vTwrYMDmy0vUY.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/vTwrYMDmy0vUY.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67c44", "previousYearPapers": [{"_id": "63134c746e7bc9b332483706", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 1)", "title": "JEE Main 2022 (28 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Which of the following statement is incorrect?", "image": null}, "options": [{"id": "ZWSSo", "text": "Low solubility of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LiF</mi></math> in water is due to its small hydration enthalpy.", "isCorrect": true, "image": null}, {"id": "Rih0T", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KO</mi><mn>2</mn></msub></math> is paramagnetic.", "isCorrect": false, "image": null}, {"id": "G1Sf2", "text": "Solution of sodium in liquid ammonia is conducting in nature.", "isCorrect": false, "image": null}, {"id": "Ti4rV", "text": "Sodium metal has higher density than potassium metal", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Due to the small size of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Li</mi><mo>+</mo></msup></math> ion and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">F</mi><mo>-</mo></msup></math>ions, the lattice energy of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LiF</mi></math> is very high. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LiF</mi></math> is covalent in nature. Therefore, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LiF</mi></math> is insoluble in water.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KO</mi><mn>2</mn></msub></math>&nbsp;&nbsp;has <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> unpaired electron in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">&#960;</mi><mo>&#8902;</mo></msup><mn>2</mn><mi mathvariant=\"normal\">p</mi><mo>&#160;</mo><mi>Molecular</mi><mo>&#160;</mo><mi>orbital</mi></math>&nbsp;of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mi mathvariant=\"normal\">O</mi><mn>2</mn><mo>-</mo></msubsup></math>&nbsp;. Therefore, it is Paramagnetic.</p><p>&nbsp;Lithium has lesser atomic weight than sodium. So, lithium has lesser density than sodium. But in the case of &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi></math>&#39; and &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi></math>&#39;, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">d</mi></math>-orbitals present in Potassium, which increases the volume of &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi></math>&#39;.</p><p>Solution of sodium in liquid ammonia is conducting in nature, due to presence of free electron.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483706", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 1)", "title": "JEE Main 2022 (28 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67b35", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 2)", "title": "JEE Main 2022 (27 Jul Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "An element <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> of group <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>&nbsp;shows similarity to an element <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> belonging to group <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> has maximum hydration enthalpy in group&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;is", "image": null}, "options": [{"id": "lWhCQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mg</mi></math>", "isCorrect": true, "image": null}, {"id": "zCxlX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi></math>", "isCorrect": false, "image": null}, {"id": "eMUMe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi></math>", "isCorrect": false, "image": null}, {"id": "09pmf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Sr</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/41fe6f7f-a3d0-43ea-a2d8-c885a96c78fd-image.png\" style=\"width: 315px; height: 100px;\" /></p><p>Hydration enthalpy is inversely related to the size of the ion.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Li</mi><mo>+</mo></msup></math>&nbsp;has maximum hydration enthalpy in&nbsp;group <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>&nbsp;due to its small size.</p><p>Lithium shows diagonal relationship to magnesium.</p><p>The similarity between lithium and magnesium is particularly striking and arises because of their similar sizes : atomic radii, Li = 152 pm, Mg = 160 pm; ionic radii : Li<sup>+</sup> = 76 pm, Mg<sup>2+</sup>= 72 pm.</p><p>The main points of similarity are</p><p>(I)Both lithium and magnesium are harder&nbsp;and lighter (ii) Lithium and magnesium react slowly with water. Their oxides and hydroxides are much less soluble and their hydroxides decompose on heating. Both form a nitride, Li3N and Mg3N<sub>2</sub> , by direct combination with nitrogen. (iii) The oxides, Li<sub>2</sub>O and MgO do not combine with excess oxygen to give any superoxide. (iv) The carbonates of lithium and magnesium decompose easily on heating to form the oxides and CO<sub>2</sub> .</p><p>Solid hydrogencarbonates are not formed by lithium and magnesium. (v) Both LiCl and MgCl<sub>2</sub> are soluble in ethanol. (vi) Both LiCl and MgCl<sub>2 </sub>are deliquescent and crystallise from aqueous solution as hydrates, LiCl&middot;2H<sub>2</sub>O and MgCl<sub>2 </sub>&middot;6H<sub>2</sub>O.</p><p>So &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&#39; is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mg</mi></math>.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b33248370a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 2)", "title": "JEE Main 2022 (27 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d679cf", "previousYearPapers": [{"_id": "63134c746e7bc9b332483709", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 2)", "title": "JEE Main 2022 (26 Jul Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Given below are two statements: one is labelled as Assertion A and the other is labelled as Reason <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>. Assertion <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> : <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LiF</mi></math> is sparingly soluble in water. Reason <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> : The ionic radius of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Li</mi><mo>+</mo></msup></math>&nbsp;ion is smallest among its group members, hence has least hydration enthalpy.</p><p>In the light of the above statements, choose the most appropriate answer from the options given below.</p>", "image": null}, "options": [{"id": "b8gdG", "text": "Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> are true and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is the correct explanation of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>", "isCorrect": false, "image": null}, {"id": "f22BL", "text": "Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> are true but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is NOT the correct explanation of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>", "isCorrect": false, "image": null}, {"id": "ZzbvS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is true but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is false", "isCorrect": true, "image": null}, {"id": "4KoZf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is false but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is true", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>The low solubility of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LiF</mi></math> in water is due to its high lattice enthalpy.</p><p>The hydration enthalpies of alkali metal ions in aqueous solution&nbsp;decreases with increase in ionic sizes.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Li</mi><mo>+</mo></msup><mo>&#62;</mo><msup><mi>Na</mi><mo>+</mo></msup><mo>&#62;</mo><msup><mi mathvariant=\"normal\">K</mi><mo>+</mo></msup><mo>&#62;</mo><msup><mi>Rb</mi><mo>+</mo></msup><mo>&#62;</mo><msup><mi>Cs</mi><mo>+</mo></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Li</mi><mo>+</mo></msup></math>&nbsp;has maximum degree of hydration and for this reason lithium salts are mostly hydrated, e.g., <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LiCl</mi><mo>.</mo><mn>2</mn><msub
