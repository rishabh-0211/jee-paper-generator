"image": null}, "options": [{"id": "0rs6u", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><msub><mfenced separators=\"|\"><mi>OH</mi></mfenced><mn>2</mn></msub><mo>&#60;</mo><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">r</mi><msub><mfenced separators=\"|\"><mi>OH</mi></mfenced><mn>2</mn></msub><mo>&#60;</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><msub><mfenced separators=\"|\"><mi>OH</mi></mfenced><mn>2</mn></msub><mo>&#60;</mo><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">a</mi><msub><mfenced separators=\"|\"><mi>OH</mi></mfenced><mn>2</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "vFNoc", "text": "<math><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">r</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">a</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "kDhaH", "text": "<math><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">a</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">r</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "jpkzw", "text": "<math><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">a</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">r</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><msub><mfenced separators=\"|\"><mi>OH</mi></mfenced><mn>2</mn></msub><mo>&#60;</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><msub><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced><mn>2</mn></msub><mo>&#60;</mo><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">r</mi><msub><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced><mn>2</mn></msub><mo>&#60;</mo><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">a</mi><msub><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced><mn>2</mn></msub></math></p><p>Thermal stability increases down the group due to the decrease in the charge density of the metal cation. All group 2 metal ions have the same charge (2+) but the smaller ones at the top of the group have it all packed into a smaller space, so&nbsp;they polarise the O-H bond more (pull electrons towards the oxygen). This means the O-H bond is already partly broken, so&nbsp;it requires less heat to break fully. As you go down the group, the O-H is less polarised by the larger group 2 cations with a lower charge density, so the thermal stability increases.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["SEQUENCE_ORDER"], "previousYear": {"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65efa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}], "question": {"text": "Which one of the following alkaline earth metal sulphates has its hydration enthalpy greater than its lattice enthalpy?", "image": null}, "options": [{"id": "N0yug", "text": "<math><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "7aIEd", "text": "<math><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "wtM6b", "text": "<math><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "JhGpA", "text": "<math><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mo>&Delta;</mo> <msub> <mtext>H</mtext> <mtext>Hydration</mtext> </msub> <mo>&gt;</mo> <mo>&Delta;</mo> <msub> <mtext>H</mtext> <mtext>Lattice</mtext> </msub> </mrow> </math><br /><br />Salt is soluble. BeSO<sub>4</sub> is soluble due to high hydration energy of small Be<sup>2+</sup> ion. K<sub>sp</sub> for BeSO<sub>4</sub> is very high.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c7e", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}], "question": {"text": "Equimolar solutions of the following compounds are prepared separately in water. Which will have the lowest $\\mathrm{pH}$ value ?", "image": null}, "options": [{"id": "wz1dh", "text": "\n$\\mathrm{BeCl}_2$\n", "image": null, "isCorrect": true}, {"id": "COmXn", "text": "\n$\\mathrm{SrCl}_2$\n", "image": null, "isCorrect": false}, {"id": "dzEwr", "text": "\n$\\mathrm{CaCl}_2$\n", "image": null, "isCorrect": false}, {"id": "eYqcV", "text": "\n$\\mathrm{MgCl}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Metal halide on hydrolysis with water form corresponding hydroxides.\nThe basic strength of hydroxide increases as we move down in a group. This is because of the increase in size which results in decrease of ionization energy which weakens the strength of $\\mathrm{M}-\\mathrm{O}$ bonds in MOH and thus increases the basic strength.\n$$\n\\begin{aligned}\n& \\mathrm{Be}(\\mathrm{OH})_2 \\quad \\mathrm{Mg}(\\mathrm{OH})_2 \\\\\n& \\text { Amphoteric Weak base } \\\\\n& \\mathrm{Ca}(\\mathrm{OH})_2 \\mathrm{Sr}(\\mathrm{OH})_2 \\mathrm{Ba}(\\mathrm{OH})_2 \\\\\n&\n\\end{aligned}\n$$\nHence, $\\mathrm{Be}(\\mathrm{OH})_2$ will have lowest $\\mathrm{pH}$.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65bd5", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}], "question": {"text": "Sodium Carbonate cannot be used in place of $\\left(\\mathrm{NH}_4\\right)_2 \\mathrm{CO}_3$ for the identification of $\\mathrm{Ca}^{2+}, \\mathrm{Ba}^{2+}$ and $\\mathrm{Sr}^{2+}$ ions (in group $\\mathrm{V}$ ) during mixture analysis because :", "image": null}, "options": [{"id": "tgan5", "text": "\n$\\mathrm{Mg}^{2+}$ ions will also be precipitated.\n", "image": null, "isCorrect": true}, {"id": "21hbp", "text": "\nConcentration of $\\mathrm{CO}_3{ }^{2-}$ ions is very low.\n", "image": null, "isCorrect": false}, {"id": "pB3nU", "text": "\nSodium ions will react with acid radicals.\n", "image": null, "isCorrect": false}, {"id": "dfJ8X", "text": "\n$\\mathrm{Na}^{+}$ions will interfere with the detection of $\\mathrm{Ca}^{2+}, \\mathrm{Ba}^{2+}, \\mathrm{Sr}^{2+}$ ions.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If $\\mathrm{Na}_2 \\mathrm{CO}_3$ is used in place of $\\left(\\mathrm{NH}_4\\right)_2 \\mathrm{CO}_3$. It will precipitate group $\\mathrm{V}$ radicals as well as magnesium radicals. The reason for this is the high ionization of $\\mathrm{Na}_2 \\mathrm{CO}_3$ in water into $\\mathrm{Na}^{+}$and $\\mathrm{CO}_3^{--}$. Now the higher concentration of $\\mathrm{CO}_3^{--}$is available which exceeds the solubility product of group $\\mathrm{V}$ radicals as well as that of magnesium radicals.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["EXPERIMENT_BASED"], "previousYear": {"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "648b5a73417cc3fb48d69270", "title": "Compounds of Alkaline Earth Metals", "totalQuestions": 22, "questions": [{"_id": "648b5a71417cc3fb48d68619", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}], "question": {"text": "<p>In the given reaction cycle</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/bfbbe798-4265-47d0-81b6-ad383eaa17e1.png\" style=\"width: 335px; height: 139px;\" /></p><p>&nbsp; &nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Y</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Z</mi></math> respectively are</p>", "image": null}, "options": [{"id": "Fgyac", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>-</mo><msub><mi>CaCO</mi><mn>3</mn></msub><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Y</mi><mo>-</mo><mi>NaCl</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Z</mi><mo>-</mo><mi>KCl</mi></math>", "image": null, "isCorrect": false}, {"id": "D0yyS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>-</mo><msub><mi>CaCO</mi><mn>3</mn></msub><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Y</mi><mo>-</mo><mi>NaCl</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Z</mi><mo>-</mo><mi>HCl</mi></math>", "image": null, "isCorrect": true}, {"id": "e99vi", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>-</mo><mi>CaO</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Y</mi><mo>-</mo><mi>NaCl</mi><mo>+</mo><msub><mi>CO</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Z</mi><mo>-</mo><mi>NaCl</mi></math>", "image": null, "isCorrect": false}, {"id": "H5E5v", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>-</mo><mi>CaO</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Y</mi><mo>-</mo><mi>NaCl</mi><mo>+</mo><msub><mi>CO</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Z</mi><mo>-</mo><mi>KCl</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>When calcium chloride reacts with sodium carbonate, a double replacement reaction takes place. The products of this reaction are calcium carbonate and sodium chloride.<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaCl</mi><mn>2</mn></msub><mo>+</mo><msub><mi>Na</mi><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub><mo>&#8594;</mo><munder><msub><mi>CaCO</mi><mn>3</mn></msub><mfenced><mi mathvariant=\"normal\">X</mi></mfenced></munder><mo>+</mo><munder><mrow><mn>2</mn><mi>NaCl</mi></mrow><mfenced><mi mathvariant=\"normal\">Y</mi></mfenced></munder></math></p><p>To Obtain Calcium chloride from Calcium carbonate we need to react calcium carbonate with Hydro chloric acid.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><msub><mi>CaCO</mi><mn>3</mn></msub><mfenced><mi mathvariant=\"normal\">X</mi></mfenced></munder><mo>+</mo><munder><mrow><mn>2</mn><mi>HCl</mi></mrow><mfenced><mi mathvariant=\"normal\">Z</mi></mfenced></munder><mo>&#8594;</mo><msub><mi>CaCl</mi><mn>2</mn></msub><mo>+</mo><msub><mi>CO</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mfenced><mi mathvariant=\"normal\">l</mi></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">X</mi><mo>)</mo><mo>&#160;</mo><msub><mi>CaCO</mi><mn>3</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">Y</mi><mo>)</mo><mo>&#160;</mo><mi>NaCl</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">Z</mi><mo>)</mo><mo>&#160;</mo><mi>HCl</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d685d7", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mg</mi><msub><mfenced><msub><mi>NO</mi><mn>3</mn></msub></mfenced><mn>2</mn></msub><mo>.</mo><msub><mi>XH</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ba</mi><msub><mfenced><msub><mi>NO</mi><mn>3</mn></msub></mfenced><mn>2</mn></msub><mo>.</mo><msub><mi>YH</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>, represent formula of the crystalline forms of nitrate salts. Sum of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math> is.......<br />&nbsp;", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "<p>Magnesium nitrate crystallises with six molecules of water, whereas barium nitrate is anhydrous salts.&nbsp;</p><p>The hydrated form of magnesium nitrate is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mg</mi><msub><mfenced><msub><mi>NO</mi><mn>3</mn></msub></mfenced><mn>2</mn></msub><mo>.</mo><mn>6</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>&nbsp;and anhydrous salt of barium nitrate is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ba</mi><msub><mfenced><msub><mi>NO</mi><mn>3</mn></msub></mfenced><mn>2</mn></msub></math>&nbsp;respectively<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>6</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">y</mi><mo>=</mo><mn>0</mn></math></p>", "image": null}, "videoSolution": {"videoId": "1d277f1109a84ee79a6d571d96e4e424", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/tSJMV9RHP1Jux.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/tSJMV9RHP1Jux.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d684b5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6490", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 1)", "title": "JEE Main 2023 (10 Apr Shift 1)"}], "question": {"text": "Lime reacts exothermally with water to give &lsquo;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&rsquo; which has low solubility in water. Aqueous solution of &lsquo;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&rsquo; is often used for the test of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math>, a test in which insoluble <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> is formed. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> is further reacted with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math> then soluble compound is formed. &lsquo;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39;&nbsp;is", "image": null}, "options": [{"id": "OVXX0", "text": "Quick lime", "image": null, "isCorrect": false}, {"id": "RA0pF", "text": "Slaked lime", "image": null, "isCorrect": true}, {"id": "NfOUJ", "text": "White lime", "image": null, "isCorrect": false}, {"id": "BunFw", "text": "Lime water", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mi>CaO</mi><mi>Lime</mi></munder><mover><mo>&#8594;</mo><mrow><mi>Limited</mi><mo>&#160;</mo><mi>water</mi></mrow></mover><mi>Ca</mi><msub><mfenced><mi>OH</mi></mfenced><mn>2</mn></msub></math></p><p>The process is known as&nbsp;slaking of lime and the product is slaked lime. It is an exothermic process.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi><msub><mfenced><mi>OH</mi></mfenced><mn>2</mn></msub><mi>aq</mi></math>&nbsp;solution is known as&nbsp;lime water and used for test of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi><msub><mfenced><mi>OH</mi></mfenced><mn>2</mn></msub><mfenced><mi>aq</mi></mfenced><mover><mo>&#8594;</mo><msub><mi>CO</mi><mn>2</mn></msub></mover><msub><mi>CaCO</mi><mn>3</mn></msub><mspace linebreak=\"newline\"></mspace><msub><mi>CaCO</mi><mn>3</mn></msub><mo>+</mo><msub><mi>CO</mi><mn>2</mn></msub><mfenced><mi>excess</mi></mfenced><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mover><mo>&#8594;</mo><mrow></mrow></mover><mi>Ca</mi><msub><mfenced><msub><mi>HCO</mi><mn>3</mn></msub></mfenced><mn>2</mn></msub></math></p><p>Milkiness is due to the formation of calcium carbonate and disappearance of milkiness is due to the formation of calcium bicarbonate.</p><p>&nbsp;</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6490", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 1)", "title": "JEE Main 2023 (10 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68453", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 2)", "title": "JEE Main 2023 (08 Apr Shift 2)"}], "question": {"text": "For a good quality cement, the ratio of lime to the total of the oxides of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Si</mi><mo>,</mo><mi>Al</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Fe</mi></math>&nbsp;should be as close as to", "image": null}, "options": [{"id": "D7Q69", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "6p4LC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "6Vsil", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": true}, {"id": "9ufww", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Cement is made by strongly heating a mixture of lime stone and clay in a rotatory kiln. Lime stone and clay are finely powdered, and a little water is added. For a good quality cement, the ratio of silica (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SiO</mi><mn>2</mn></msub></math>) to alumina (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Al</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>) should be between&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> and the ratio of lime (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CaO</mi></math>) to the total of the oxides of silicon (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SiO</mi><mn>2</mn></msub></math>) aluminium (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Al</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>) and iron (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Fe</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>) should be as close as possible to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>.&nbsp;If lime is in excess, the cement cracks during setting. On the other hand, if lime is less than the required, the cement is weak in strength. Therefore, a proper composition of cement must be maintained to get cement of good quality.&nbsp;</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 2)", "title": "JEE Main 2023 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68405", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}], "question": {"text": "What is the purpose of adding gypsum to cement?", "image": null}, "options": [{"id": "5RxzZ", "text": "To facilitate the hydration of cement", "image": null, "isCorrect": false}, {"id": "cWUMK", "text": "To slow down the process of setting", "image": null, "isCorrect": true}, {"id": "f2iZK", "text": "To give a hard mass", "image": null, "isCorrect": false}, {"id": "eVR4D", "text": "To speed up the process of setting", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>When mixed with water the setting of cement takes place to give a hard mass. The is due to the hydration of molecules of the constituents and their rearrangement. Gypsum is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaSO</mi><mn>4</mn></msub><mo>.</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>. The purpose of adding gypsum is only to slow down the process of setting of the cement so that it gets sufficiently hardened.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68346", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 1)", "title": "JEE Main 2023 (06 Apr Shift 1)"}], "question": {"text": "<p>The setting time of Cement is increased by adding</p>", "image": null}, "options": [{"id": "bb58b", "text": "Clay", "image": null, "isCorrect": false}, {"id": "gYaEM", "text": "Silica", "image": null, "isCorrect": false}, {"id": "DmDsY", "text": "Gypsum", "image": null, "isCorrect": true}, {"id": "s75XX", "text": "Limestone", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Cement or Portland cement mainly contains oxides of calcium, silicon, aluminium, and iron. When water is mixed with cement, the oxides get hydrated, and cement sets extremely fast. To control the setting time of cement, gypsum is added to it, which increases the setting time of cement.</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 1)", "title": "JEE Main 2023 (06 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67f69", "previousYearPapers": [{"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Given below are two statements : one is labelled as Assertion (A) and the other is labelled as Reason (R).</p><p><strong>Assertion (A):</strong> Gypsum is used for making fireproof wall boards.</p><p><strong>Reason (R):</strong> Gypsum is unstable at high temperatures.</p><p>In the light of the above statements, choose the correct answer from the options given below:</p>", "image": null}, "options": [{"id": "Y3r6C", "text": "Both (A) and (R) are correct but (R) is not the correct explanation of (A).", "isCorrect": true, "image": null}, {"id": "pLrnG", "text": "(A) is correct but (R) is not correct.", "isCorrect": false, "image": null}, {"id": "Aqsox", "text": "(A) is not correct but (R) is correct.", "isCorrect": false, "image": null}, {"id": "a6oGQ", "text": "Both (A) and (R) are correct and (R) is the correct explanation of (A).", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Gypsum board is also known as plasterboard, drywall or wall board. It consists of the paper surface and non-combustible core. These boards are easy to install. It has excellent fire resistance. Helps in sound isolation by preventing the transfer of unnecessary sound. It is less expensive and has great durability.</p><p>When exposed to high temperatures,&nbsp;gypsum only delays the temperature rise and cannot prevent shrinkage and crack from occurring, which can lead to the eventual collapse or failure of gypsum-based products.</p><p>Hence, both (A) and (R) are true but (R) is not the correct explanation of (A).</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["ASSERTION_REASON"], "previousYear": {"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d681e1", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>The alkaline earth metal sulphate(s) which are readily soluble in water is/are:<br />(A) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>BeSO</mi><mn>4</mn></msub></math><br />(B) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>MgSO</mi><mn>4</mn></msub></math><br />(C) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaSO</mi><mn>4</mn></msub></math><br />(D) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SrSO</mi><mn>4</mn></msub></math><br />(E) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>BaSO</mi><mn>4</mn></msub></math></p><p>Choose the <strong>correct</strong> answer from the options given below:</p>", "image": null}, "options": [{"id": "5Kx1n", "text": "A only", "isCorrect": false, "image": null}, {"id": "TO8lz", "text": "B only", "isCorrect": false, "image": null}, {"id": "tj8Wk", "text": "A and B", "isCorrect": true, "image": null}, {"id": "0VmbT", "text": "B and C", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The solubility of any substance depends on the following two factors:</p><ul>\t<li>Lattice enthalpy</li>\t<li>Hydration enthalpy</li></ul><p>The magnitude of lattice enthalpy of the alkaline earth&rsquo;s metal sulphates remains almost constant as we move down the group. This is because sulphate ions are so big and the small increase in the size of cations on moving down the group doesn&rsquo;t make any difference in the lattice enthalpy of the alkaline earth&rsquo;s metal sulphates.</p><p>However, the hydration enthalpy decreases&nbsp;from Be<sup>2+</sup>&nbsp;to Ba<sup>2+</sup>&nbsp;significantly. This is because the hydration enthalpy depends on the size of the cation:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>Hydration&#160;enthalpy</mtext><mo>&#160;</mo><mo>&#8733;</mo><mo>&#160;</mo><mfrac><mn>1</mn><mtext>Size&#160;of&#160;cation</mtext></mfrac></math></p><p>As the size of the cation increases from Be to Ba, therefore hydration enthalpy decreases of alkaline earth metal sulphates. The greater hydration enthalpies overcome the lattice enthalpy factor.</p><p>Thus, the solubility of alkaline earth&rsquo;s metal sulphates decreases in the sequence:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><mi>Mg</mi><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><mi>Ca</mi><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><mi>Sr</mi><mo>&#160;</mo><mo>&#62;</mo><mo>&#160;</mo><mi>Ba</mi></math></p><p>From the above explanation we found that BeSO<sub>4</sub>&nbsp;and MgSO<sub>4</sub>&nbsp;are readily soluble in water.</p><p>&nbsp;</p>", "image": null}, "videoSolution": {"videoId": "0b108014e7a9473fa6915de179e21690", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/CSykkmgra4tJi.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/CSykkmgra4tJi.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67e06", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 2)", "title": "JEE Main 2022 (29 Jul Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Portland cement contains &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>&#39; to enhance the setting time. What is &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>&#39;?", "image": null}, "options": [{"id": "ZLsQf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaSO</mi><mn>4</mn></msub><mo>&#183;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>", "isCorrect": false, "image": null}, {"id": "W2okK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaSO</mi><mn>4</mn></msub><mo>&#183;</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>", "isCorrect": true, "image": null}, {"id": "A5lpF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaSO</mi><mn>4</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "Trccd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaCO</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Cement is an important building material. It was first introduced in England in 1824 by Joseph Aspdin. It is also called Portland cement because it resembles with the natural limestone quarried in the Isle of Portland, England.</p><p>The raw materials for the manufacture of cement are limestone and clay.</p><p>When mixed with water, the setting of cement takes place to give a hard mass. This is due to the hydration of the molecules of the constituents and their rearrangement. The purpose of adding gypsum is only to slow down the process of setting of the cement so that it gets sufficiently hardened.</p><p>Hence,Gypsum<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>CaSO</mi><mn>4</mn></msub><mo>&#183;</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></mfenced></math> is used to enhance setting time in portland cement.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b33248370c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 2)", "title": "JEE Main 2022 (29 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67c9b", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Statement I: An alloy of lithium and magnesium is used to make aircraft plates.</p><p>Statement II : The magnesium ions are important for cell-membrane integrity.</p><p>In the light the above statements, choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "BI0Yk", "text": "Both Statement I and Statement II are true", "isCorrect": false, "image": null}, {"id": "LTzRc", "text": "Both Statement I and Statement II are false", "isCorrect": true, "image": null}, {"id": "z3gMa", "text": "Statement I is true but Statement II is false", "isCorrect": false, "image": null}, {"id": "ryymo", "text": "Statement I is false but Statement II is true", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Lithium metal is used to make useful alloys, for example with lead to make &lsquo;white metal&rsquo; bearings for motor engines, with aluminium to make aircraft parts, and with magnesium to make armour plates. So, Alloy of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mg</mi></math> is used to make armour plates and not aircraft plates.</p><p>Calcium plays important roles in neuromuscular function, interneuronal transmission and cell membrane integrity</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67d53", "previousYearPapers": [{"_id": "62c481f101514d218a7934da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 2)", "title": "JEE Main 2022 (28 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Among the following, basic oxide is", "image": null}, "options": [{"id": "2kAUQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SO</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "fBOlg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SiO</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "wzyz5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CaO</mi></math>", "isCorrect": true, "image": null}, {"id": "H8KHM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Al</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Oxides of metals are generally basic in nature but some are amphoteric in nature.</p><p>Oxides of non-metals are acidic in nature but some of them are neutral.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SO</mi><mn>3</mn></msub></math>&nbsp;is acidic in nature it reacts with bases.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Al</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>&nbsp;is amphoteric in nature as it reacts with both acids and bases.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>SiO</mi><mn>2</mn></msub></math>&nbsp;is acidic in nature.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CaO</mi></math>&nbsp;is a basic oxide and it reacts with acids readily.</p><p>&nbsp;</p><p>&nbsp;</p><p>&nbsp;</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 2)", "title": "JEE Main 2022 (28 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d67548", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T09:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 1)", "title": "JEE Main 2021 (27 Aug Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The number of water molecules in gypsum, dead burnt plaster and plaster of Paris, respectively are:", "image": null}, "options": [{"id": "p6w8l", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn>< f", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65b1b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}], "question": {"text": "Which of the following on thermal decomposition yields a basic as well as an acidic oxide ?", "image": null}, "options": [{"id": "z7io6", "text": "\n$\\mathrm{NaNO}_3$\n", "image": null, "isCorrect": false}, {"id": "y8uZL", "text": "\n$\\mathrm{KClO}_3$\n", "image": null, "isCorrect": false}, {"id": "D12mS", "text": "\n$\\mathrm{CaCO}_3$\n", "image": null, "isCorrect": true}, {"id": "tGbvv", "text": "\n$\\mathrm{NH}_4 \\mathrm{NO}_3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{CaCO}_3 \\rightarrow \\underset{\\text { Basic }}{\\mathrm{CaO}}+\\underset{\\text { Acidic }}{\\mathrm{CO}_2}$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d654e7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "The substance not likely to contain $\\mathrm{CaCO}_3$ is", "image": null}, "options": [{"id": "ZUQBH", "text": "\ncalcined gypsum\n", "image": null, "isCorrect": true}, {"id": "3dQhC", "text": "\nsea shells\n", "image": null, "isCorrect": false}, {"id": "FH00o", "text": "\ndolomite\n", "image": null, "isCorrect": false}, {"id": "Er94U", "text": "\na marble statue", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Gypsum is $\\mathrm{CaSO}_4 \\cdot 2 \\mathrm{H}_2 \\mathrm{O}$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["ODD_ONE_OUT"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "648b5a73417cc3fb48d69271", "title": "Properties of S-block elements", "totalQuestions": 21, "questions": [{"_id": "648b5a71417cc3fb48d68732", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}], "question": {"text": "<p>Given below are two statements: One is labelled as Assertion <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and the other is labelled as Reason <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math>:</p><p>Assertion (A) : <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>BeCl</mi><mn>2</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>MgCl</mi><mn>2</mn></msub></math> produce characteristic flame</p><p>Reason (R) : The excitation energy is high in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>BeCl</mi><mn>2</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>MgCl</mi><mn>2</mn></msub></math></p><p>In the light of the above statements, choose the correct answer from the options given below:</p>", "image": null}, "options": [{"id": "aZl8A", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">A</mi></mfenced></math> is true but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">R</mi></mfenced></math> is false", "image": null, "isCorrect": false}, {"id": "eHR6E", "text": "Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">A</mi></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">R</mi></mfenced></math> are true but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">R</mi></mfenced></math> is NOT the correct explanation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">A</mi></mfenced></math>", "image": null, "isCorrect": false}, {"id": "hGW9f", "text": "Both (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">A</mi></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">R</mi></mfenced></math> are true and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">R</mi></mfenced></math> is the correct explanation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">A</mi></mfenced></math>", "image": null, "isCorrect": false}, {"id": "5OJRt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">A</mi></mfenced></math> is false but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">R</mi></mfenced></math> is true", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>In <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi><mo>&#160;</mo><mtext>and</mtext><mo>&#160;</mo><mi>Mg</mi></math>, the electrons are strongly bound. The energy required to excite these electrons is very high. Therefore, when the electron reverts back to its original position, the energy released does not fall in the visible region. Hence, no colour in the flame is seen.</p>", "image": null}, "videoSolution": {"videoId": "51b9b9fce3474e4794365a767d3a667d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/kg58NnfLesXVA.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/kg58NnfLesXVA.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "outOfSyllabus", "questionStructure": ["ASSERTION_REASON"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67f1e", "previousYearPapers": [{"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Choose the correct statement(s):<br />A. Beryllium oxide is purely acidic in nature.<br />B. Beryllium carbonate is kept in the atmosphere of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math>.<br />C. Beryllium sulphate is readily soluble in water.<br />D. Beryllium shows anomalous behavior.<br />Choose the correct answer from the options given below:", "image": null}, "options": [{"id": "eH7wu", "text": "A, B and C only", "isCorrect": false, "image": null}, {"id": "spOqV", "text": "&nbsp;B,C and&nbsp;D only", "isCorrect": true, "image": null}, {"id": "FSfqd", "text": "A&nbsp; and B only", "isCorrect": false, "image": null}, {"id": "JmMDx", "text": "A only", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>A. Beryllium oxide is amphoteric in nature.<br />B. Beryllium carbonate is kept in the atmosphere of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math>&nbsp;because it is thermally less stable.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>BeCO</mi><mn>3</mn></msub><mo>&#160;</mo><mo>&#8652;</mo><mo>&#160;</mo><mi>BeO</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi>CO</mi><mn>2</mn></msub></math></p><p>C. Beryllium sulphate is readily soluble in water due to high degree of hydration.</p><p>D. Beryllium shows anomalous behaviour due to small size, high ionization energy and high value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#981;</mi></math> (polarising power).</p><p>So, the correct statement is B, C and D only.</p>", "image": null}, "videoSolution": {"videoId": "3d8822af17c1492ea02b51ab62af5dc0", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/N8rD1zqiDwsVs.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/N8rD1zqiDwsVs.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MULTI_STATEMENT"], "previousYear": {"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d681f0", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Lithium aluminium hydride can be prepared from the reaction of", "image": null}, "options": [{"id": "aiKeb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LiCl</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Al</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>6</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "0wPzQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LiH</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Al</mi><mn>2</mn></msub><msub><mi>Cl</mi><mn>6</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "861Rt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LiCl</mi><mo>,</mo><mi>Al</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "DkScN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>LiH</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Al</mi><msub><mfenced><mi>OH</mi></mfenced><mn>3</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Lithium aluminium hydride can be prepared by the reaction of dimer of aluminium trichloride and lithium hydride by the below reaction with a high yield:<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mi>LiH</mi><mo>+</mo><msub><mi>Al</mi><mn>2</mn></msub><msub><mi>Cl</mi><mn>6</mn></msub><mo>&#10230;</mo><mn>2</mn><msub><mi>LiAlH</mi><mn>4</mn></msub><mo>+</mo><mn>6</mn><mi>LiCl</mi></math><br />Lithium aluminium hydride is extensively used for reduction of organic compounds.", "image": null}, "videoSolution": {"videoId": "c8a66769aa8e4aafb659b1b18a985af9", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/EjMfNMiwg6qdJ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/EjMfNMiwg6qdJ.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d680cf", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match List I with List II</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 400px;\">\t<tbody>\t\t<tr>\t\t\t<td colspan=\"2\" rowspan=\"1\">List I</td>\t\t\t<td colspan=\"2\" rowspan=\"1\">List II</td>\t\t</tr>\t\t<tr>\t\t\t<td>A.</td>\t\t\t<td>Cobalt catalyst</td>\t\t\t<td>I.</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mo>+</mo><msub><mi>Cl</mi><mn>2</mn></msub></mrow></mfenced></math>&nbsp;production</td>\t\t</tr>\t\t<tr>\t\t\t<td>B.</td>\t\t\t<td>Syngas</td>\t\t\t<td>II.</td>\t\t\t<td>Water gas production</td>\t\t</tr>\t\t<tr>\t\t\t<td>C.</td>\t\t\t<td>Nickel catalyst</td>\t\t\t<td>III.</td>\t\t\t<td>Coal gasification</td>\t\t</tr>\t\t<tr>\t\t\t<td>D.</td>\t\t\t<td>Brine solution</td>\t\t\t<td>IV.</td>\t\t\t<td>Methanol production</td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below:-</p>", "image": null}, "options": [{"id": "caqqR", "text": "A-IV, B-I, C-II, D-III", "isCorrect": false, "image": null}, {"id": "ZXnJL", "text": "A-IV, B-III, C-I, D-II", "isCorrect": false, "image": null}, {"id": "aSHOb", "text": "A-II, B-III, C-IV, D-I", "isCorrect": false, "image": null}, {"id": "PqU2n", "text": "A-IV, B-III, C-II, D-I", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Hydrogen reacts with carbon monoxide in presence of cobalt catalyst to give methanol.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mi>CO</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>&#160;</mo><mover><mo>&#8594;</mo><mtext>Cobalt&#160;catalyst</mtext></mover><mo>&#160;</mo><msub><mi>CH</mi><mn>3</mn></msub><mi>OH</mi><mfenced><mi mathvariant=\"normal\">l</mi></mfenced></math></p><p>As the mixture of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CO</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math>&nbsp;is used for the synthesis of methanol and a number of hydrocarbons, it is called synthesis gas or <strong>syngas. </strong>The process of producing syngas&nbsp;from coal is called coal gasification.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi><mfenced><mi mathvariant=\"normal\">s</mi></mfenced><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>&#160;</mo><mover><mo>&#8594;</mo><mrow><mn>1270</mn><mi mathvariant=\"normal\">K</mi></mrow></mover><mo>&#160;</mo><mi>CO</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>&#160;</mo></math></p><p>The reaction of steam with hydrocarbons or coke at high temperature in presence of nickel catalyst gives a mixture of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CO</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math>, called water gas.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>4</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>&#160;</mo><mo>&#160;</mo><munderover><mo>&#8594;</mo><mi>Ni</mi><mrow><mn>1270</mn><mi mathvariant=\"normal\">K</mi></mrow></munderover><mo>&#160;</mo><mi>CO</mi><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>3</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>&#160;</mo></math></p><p>Electrolysis of brine solution produces&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math>&nbsp;gas at cathode and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Cl</mi><mn>2</mn></msub></math>&nbsp;gas at anode.</p><p>Cathode:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mfenced><mi mathvariant=\"normal\">l</mi></mfenced><mo>+</mo><mo>&#160;</mo><mn>2</mn><msup><mi mathvariant=\"normal\">e</mi><mo>-</mo></msup><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mfenced><mi mathvariant=\"normal\">g</mi></mfenced><mo>&#160;</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>2</mn><msup><mi>OH</mi><mo>-</mo></msup><mfenced><mi>aq</mi></mfenced></math></p><p>Anode:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msup><mi>Cl</mi><mo>-</mo></msup><mo>&#160;</mo><mo>(</mo><mi>aq</mi><mo>)</mo><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><msub><mi>Cl</mi><mn>2</mn></msub><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>2</mn><msup><mi mathvariant=\"normal\">e</mi><mo>-</mo></msup></math></p><p>The overall reaction is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msup><mi>Na</mi><mo>+</mo></msup><mo>&#160;</mo><mo>(</mo><mi>aq</mi><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>2</mn><msup><mi>Cl</mi><mo>-</mo></msup><mo>&#160;</mo><mo>(</mo><mi>aq</mi><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>2</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">l</mi><mo>)</mo><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><msub><mi>Cl</mi><mn>2</mn></msub><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mo>&#160;</mo><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>2</mn><msup><mi>Na</mi><mo>+</mo></msup><mo>&#160;</mo><mo>(</mo><mi>aq</mi><mo>)</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>2</mn><msup><mi>OH</mi><mo>-</mo></msup><mo>&#160;</mo><mo>(</mo><mi>aq</mi><mo>)</mo></math></p><p>So, the cor  "shortName": "2021 (16 Mar Shift 1)", "title": "JEE Main 2021 (16 Mar Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Given below are two statements:</p><p>Statement I : Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaCl</mi><mn>2</mn></msub><mo>.</mo><mn>6</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>MgCl</mi><mn>2</mn></msub><mo>.</mo><mn>8</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>&nbsp;undergo dehydration on heating.</p><p>Statement II : <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BeO</mi></math> is amphoteric, whereas the oxides of other elements in the same group are acidic.</p><p>In the light of the above statements, choose the correct answer from the options given below:</p>", "image": null}, "options": [{"id": "pG7Va", "text": "Statement I is false but statement II is true", "isCorrect": false, "image": null}, {"id": "PXldu", "text": "Both statement I and statement II are false", "isCorrect": true, "image": null}, {"id": "3tbQj", "text": "Both statement I and statement II are true", "isCorrect": false, "image": null}, {"id": "E4OCR", "text": "Statement I is true but statement II is false", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>(a)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CaCl</mi><mn>2</mn></msub><mo>.</mo><mn>6</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mover><mo>&#10230;</mo><mi mathvariant=\"normal\">&#916;</mi></mover><munder><msub><mi>CaCl</mi><mn>2</mn></msub><mrow><mo>(</mo><mi>Anhydrous</mi><mo>)</mo></mrow></munder><mo>+</mo><mn>6</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math></p><p>(b) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>MgCl</mi><mn>2</mn></msub><mo>.</mo><mn>8</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mover><mo>&#10230;</mo><mi mathvariant=\"normal\">&#916;</mi></mover><mi>MgO</mi><mo>+</mo><mn>2</mn><mi>HCl</mi><mo>+</mo><mn>6</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math></p><p>The dehydration of hydrated chloride of calcium can be achieved. The corresponding hydrated chloride of magnesium on heating suffer hydrolysis.</p><p>(c) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BeO</mi><mo>&#8594;</mo></math> Amphoteric</p><p style=\"margin:0cm 0cm 8pt\"><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ef5358c7-009b-448c-82b7-01b8e2487d1d-image.png\" style=\"width: 213px; height: 78px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "615d92edde3d91842a5cf80e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-16T09:00:00.000Z", "isVisible": true, "shortName": "2021 (16 Mar Shift 1)", "title": "JEE Main 2021 (16 Mar Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66a59", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf801", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-03T14:00:00.000Z", "isVisible": true, "shortName": "2020 (03 Sep Shift 2)", "title": "JEE Main 2020 (03 Sep Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Among the statement (I &ndash; IV), the correct ones are:</p><p>(I) Be has smaller atomic radius compared to Mg.</p><p>(II) Be has higher ionization enthalpy than AI.</p><p>(III) Charge/radius ratio of Be is greater than that of Al.</p><p>(IV) Both Be and Al form mainly covalent compounds</p>", "image": null}, "options": [{"id": "8oF2m", "text": "(I), (II) and (IV)", "isCorrect": true, "image": null}, {"id": "z8wm4", "text": "(I), (III) and (IV)", "isCorrect": false, "image": null}, {"id": "C4sFt", "text": "(II), (III) and (IV)", "isCorrect": false, "image": null}, {"id": "GgCWx", "text": "(I), (II) and (III)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Charge/radius ratio of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Al</mi></math>&nbsp;is same because of diagonal relationship. Remaining statements are correct.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MULTI_STATEMENT"], "previousYear": {"_id": "615d92ecde3d91842a5cf801", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-03T14:00:00.000Z", "isVisible": true, "shortName": "2020 (03 Sep Shift 2)", "title": "JEE Main 2020 (03 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d669ca", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7ff", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-02T14:00:00.000Z", "isVisible": true, "shortName": "2020 (02 Sep Shift 2)", "title": "JEE Main 2020 (02 Sep Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Two elements <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> have similar chemical properties. They don&#39;t form solid hydrogencarbonates, but&nbsp;react with nitrogen to form nitrides. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>, respectively, are :", "image": null}, "options": [{"id": "Ks68G", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Rb</mi></math>", "isCorrect": false, "image": null}, {"id": "0CYov", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>Na</mi><mo>&#160;</mo></math>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi></math>", "isCorrect": false, "image": null}, {"id": "AKC5W", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cs</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ba</mi></math>", "isCorrect": false, "image": null}, {"id": "l06RX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mg</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mg</mi></math> do not form solid bicarbonate. But react with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub></math> to give nitrides. Both of them have similar properties due to diagonal relationship.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#160;</mo><mi>Li</mi><mo>+</mo><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><mover><mo>&#10230;</mo><mi mathvariant=\"normal\">&#916;</mi></mover><mo>&#160;</mo><mn>2</mn><mo>&#160;</mo><msub><mi>Li</mi><mn>3</mn></msub><mi mathvariant=\"normal\">N</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#160;</mo><mi>Mg</mi><mo>+</mo><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><mover><mo>&#10230;</mo><mi mathvariant=\"normal\">&#916;</mi></mover><msub><mi>Mg</mi><mn>3</mn></msub><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub></math>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": [" ": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d666c0", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ea", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 1)", "title": "JEE Main 2019 (10 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The electronegativity of aluminum is similar to:", "image": null}, "options": [{"id": "mO8Ty", "text": "Beryllium", "isCorrect": true, "image": null}, {"id": "kBzU0", "text": "Boron", "isCorrect": false, "image": null}, {"id": "OHMYg", "text": "Carbon", "isCorrect": false, "image": null}, {"id": "r7ypT", "text": "Lithium", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<math><mi>E</mi><mi>N</mi></math>  of  <math><mi>A</mi><mi>l</mi><mo>=</mo><mn>1.61</mn></math> <br/><br/> <math><mi>E</mi><mi>N</mi></math>  of  <math><mi>B</mi><mi>e</mi><mo>=</mo><mn>1.57</mn></math> <br/><br/> <math><mi>E</mi><mi>N</mi></math>  of  <math><mi>B</mi><mo>=</mo><mn>2.04</mn></math> <br/><br/> <math><mi>E</mi><mi>N</mi></math>  of  <math><mi>C</mi><mo>=</mo><mn>2.55</mn></math> <br/><br/>Due to diagonal relationship between  <math><mi>B</mi><mi>e</mi></math>  and  <math><mi>A</mi><mi>l</mi><mo>,</mo></math>  they exhibit similar properties and thus, have similar electronegativity values.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ea", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 1)", "title": "JEE Main 2019 (10 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d6611c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6489", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-02T09:00:00.000Z", "isVisible": true, "shortName": "2017 (02 Apr)", "title": "JEE Main 2017 (02 Apr)"}], "question": {"text": "Both lithium and magnesium display several similar properties due to the diagonal relationship; however, the one which is incorrect is:", "image": null}, "options": [{"id": "A1kt4", "text": "Both form soluble bicarbonates", "image": null, "isCorrect": false}, {"id": "H9odG", "text": "Both form nitrides", "image": null, "isCorrect": false}, {"id": "W5t8f", "text": "Nitrates of both <math> <semantics> <mrow> <mtext>L</mtext><mtext>i</mtext> </mrow> </semantics> </math> and <math> <semantics> <mrow> <mtext>M</mtext><mtext>g</mtext> </mrow> </semantics> </math> yield <math><mtext>N</mtext><msub><mrow><mtext>O</mtext></mrow><mrow><mn>2</mn></mrow></msub></math> and <math><msub><mrow><mtext>O</mtext></mrow><mrow><mn>2</mn></mrow></msub></math> on heating", "image": null, "isCorrect": false}, {"id": "xjzrn", "text": "Both form basic carbonate", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Carbonate of magnesium is basic, sometimes appears as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>MgCO</mi><mn>3</mn></msub><mo>.</mo><mi>Mg</mi><msub><mrow><mo>(</mo><mi>OH</mi><mo>)</mo></mrow><mn>2</mn></msub></math>&nbsp;but that of lithium is not basic.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6489", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-02T09:00:00.000Z", "isVisible": true, "shortName": "2017 (02 Apr)", "title": "JEE Main 2017 (02 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65e99", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-19T09:00:00.000Z", "isVisible": true, "shortName": "2014 (19 Apr Online)", "title": "JEE Main 2014 (19 Apr Online)"}], "question": {"text": "Amongst LiCl, RbCl, BeCl<sub>2</sub> and MgCl<sub>2</sub> the compounds with the greatest and the least ionic character, respectively are :", "image": null}, "options": [{"id": "sZbm5", "text": "MgCl<sub>2</sub> and BeCl<sub>2</sub>", "image": null, "isCorrect": false}, {"id": "wVJFK", "text": "RbCl and MgCl<sub>2</sub>", "image": null, "isCorrect": false}, {"id": "27wHp", "text": "LiCl&nbsp;and RbCl", "image": null, "isCorrect": false}, {"id": "j15zi", "text": "RbCl&nbsp;and BeCl<sub>2</sub>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>(i)&nbsp;% Ionic character = 16(X<sub>A</sub>&nbsp;&ndash; X<sub>B</sub>) + 3.5 (X<sub>A</sub>&nbsp;&ndash; X<sub>B</sub>)<sup>2</sup><br /><br /><math> <mrow> <msub> <mtext>X</mtext> <mtext>Rb</mtext> </msub> <mo>=</mo> <mn>0</mn> <mo>&#183;</mo> <mn>8</mn> </mrow> </math>&nbsp;,&nbsp; &nbsp;&nbsp;<math> <mrow> <msub> <mtext>X</mtext> <mtext>Cl</mtext> </msub> <mo>=</mo> <mn>3</mn> <mo>&#183;</mo> <mn>0</mn> </mrow></math>,&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">X</mi><mi>Be</mi></msub><mo>=</mo><mn>2</mn></math><br /><br />For <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Rb</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Cl</mi></math>&nbsp;the electronegativity difference is highest so having more ionic character. For&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Be</mi><mo>&#160;</mo><mtext>and</mtext><mo>&#160;</mo><mi>Cl</mi></math>, electronegativity difference is the lowest so having less ionic character</p><p>Covalent character in compound depends upon the charge and size of ions. As charge in cation increases, covalent character&nbsp;increases and as size of cation increases covalent character decreases. Charge factor dominate over size factor. Since&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Be</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>&nbsp;has higher charge and smallest size therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>BeCl</mi><mn>2</mn></msub></math>&nbsp;has maximum covalent character and least ionic character<br /><br />&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-19T09:00:00.000Z", "isVisible": true, "shortName": "2014 (19 Apr Online)", "title": "JEE Main 2014 (19 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65850", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}], "question": {"text": "Which one of the following is the correct statement?", "image": null}, "options": [{"id": "qQwiS", "text": "\nBoric acid is a protonic acid\n", "image": null, "isCorrect": false}, {"id": "oTmWU", "text": "\nBeryllium exhibits coordination number of six\n", "image": null, "isCorrect": false}, {"id": "srFBM", "text": "\nChlorides of both beryllium and aluminium have bridged chloride structures in solid phase\n", "image": null, "isCorrect": true}, {"id": "PaEMm", "text": "\n$\\mathrm{B}_2 \\mathrm{H}_6 .2 \\mathrm{NH}_3$ is known as 'inorganic benzene'", "image": null, "isCorrect": false}], "correctValue": null, "solu
