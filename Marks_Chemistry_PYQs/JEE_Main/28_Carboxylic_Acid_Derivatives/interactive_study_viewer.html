yl salicylate). Aspirin is prepared by chemical synthesis from salicylic acid, through acetylation with acetic anhydride.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/671e3d54-d3fa-47ae-8761-34b1efb27a37-9896850_1.PNG\" style=\"width: 602px; height: 150px;\" />&nbsp;Hence, reagent&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#39;</mo><mi mathvariant=\"normal\">Y</mi><mo>&#39;</mo></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#39;</mo><mi mathvariant=\"normal\">X</mi><mo>&#39;</mo></math>&nbsp;respectively are:&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mi>OH</mi><mo>/</mo><msup><mi mathvariant=\"normal\">H</mi><mo>+</mo></msup><mo>,</mo><mo>&#160;</mo><mo>&#8710;</mo></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced><mrow><msub><mi>CH</mi><mn>3</mn></msub><mi>CO</mi></mrow></mfenced><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>/</mo><msup><mi mathvariant=\"normal\">H</mi><mo>+</mo></msup></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67caa", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/578c8488-b037-4e34-8a53-e8213d8dac01-image.png\" style=\"width: 312px; height: 80px;\" /></p><p>Find out the major product for the above reaction.</p>", "image": null}, "options": [{"id": "qyoHn", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/17ad82ca-bd77-4f67-b340-21c05457c7d3-image.png\" style=\"width: 158px; height: 80px;\" /></p>", "isCorrect": false, "image": null}, {"id": "4Y95i", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/9b142730-f0be-4ce4-b152-aabc79f5e36b-image.png\" style=\"width: 180px; height: 110px;\" /></p>", "isCorrect": false, "image": null}, {"id": "kW6c9", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fc3ad91c-69bf-40d9-876b-adbcf5b5e5ea-image.png\" style=\"width: 158px; height: 80px;\" /></p>", "isCorrect": true, "image": null}, {"id": "3GKcz", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a8d5d272-10a3-43c0-bea7-a0ebe1f758d4-image.png\" style=\"width: 158px; height: 80px;\" /></p>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>First heterolytic&nbsp;fission of iodine will take place and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">I</mi><mo>+</mo></msup></math>&nbsp;will attack at double bond site. Then oxygen of carboxylic acid will attack on the carbocation, forming a cyclic ring. In last step elimination reaction will take place in presence of heat and Py.&nbsp;</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/aa35534c-b562-42c1-9744-d03fbbf1575d-image.png\" style=\"width: 526px; height: 250px;\" /></p></blockquote>", "image": null}, "videoSolution": {"videoId": "9d66a8ca3c8646d98866ea4d2560a003", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Ol1uKlGZN0xXc.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Ol1uKlGZN0xXc.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67bf2", "previousYearPapers": [{"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Decarboxylation of all six possible forms of diaminobenzoic acids <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>6</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msub><mfenced><msub><mi>NH</mi><mn>2</mn></msub></mfenced><mn>2</mn></msub><mi>COOH</mi></math> yields three products <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>. Three acids give a product &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39;, two acids gives a product &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&#39; and one acid give a product &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>&#39;. The melting&nbsp;point of product &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>&#39; is", "image": null}, "options": [{"id": "KOi2d", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>63</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "ugsct", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "RvVCn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>104</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": false, "image": null}, {"id": "ePMcI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>142</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f0ff0b80-bcb0-4fab-a066-6d3a09d469a4-image.png\" style=\"width: 800px; height: 90px;\" /></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1da264d8-5cf1-48df-999e-258094014a22-image.png\" style=\"width: 400px; height: 209px;\" /></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c8af080a-a5ba-430a-b3fa-e182e19e2d23-image.png\" style=\"width: 150px; height: 75px;\" />C is a para isomer.</p><p>The melting point of para-isomer is comparatively&nbsp;higher than the corresponding&nbsp; ortho and meta-isomers , because of more&nbsp;symmetrical nature; it&nbsp;fits into crystal lattice more readily&nbsp;and so, close packing of molecules in crystal lattice increases the intermolecular force of attraction between molecules.</p><p>Hence&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">C</mi></mfenced></math>&nbsp;has highest melting point that is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>142</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66ab2", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf802", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-04T09:00:00.000Z", "isVisible": true, "shortName": "2020 (04 Sep Shift 1)", "title": "JEE Main 2020 (04 Sep Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi mathvariant=\"normal\">P</mi></mfenced></math> on treatment with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Br</mi><mn>2</mn></msub><mo>/</mo><msub><mi>FeBr</mi><mn>3</mn></msub></math> in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CCl</mi><mn>4</mn></msub></math> produced a single isomer <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>8</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>7</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mi>Br</mi></math> wile heating <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi mathvariant=\"normal\">P</mi></mfenced></math> with sodalime gives toluene. The compound <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mi mathvariant=\"normal\">P</mi></mfenced></math> is:", "image": null}, "options": [{"id": "RisUI", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/eeed523f-8ce7-4824-922a-eacc9a8c74c2-image.png\" style=\"width: 112px; height: 186px;\" />", "isCorrect": true, "image": null}, {"id": "cJxeE", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2a166754-69a5-4828-885a-a4c08db852ef-image.png\" style=\"width: 147px; height: 156px;\" />", "isCorrect": false, "image": null}, {"id": "V4yEF", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5d478922-fda9-4181-a1cd-ffff32e4ece3-image.png\" style=\"width: 140px; height: 140px;\" />", "isCorrect": false, "image": null}, {"id": "gE0QB", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0fbe9d4c-9cfd-4267-a16f-cf1e5e45d785-image.png\" style=\"width: 150px; height: 145px;\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Isomer&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>8</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>7</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mi>Br</mi></math>&nbsp;on heating with sodalime gives toluene,hence it is an acid.Moreover since it has&nbsp;Degree of unsaturation 5 therefore it is an aromatic carboxylic acid.Since Carboxylic acid on heating gives toluene&nbsp;,therefore it is having&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub></math>&nbsp;group attached to the benzene ring.</p><p>Now it forms single isomer on halogenation, therefore&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub></math>&nbsp;group must be attached at para position with respect to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>COOH</mi></math>&nbsp;group.</p><p>Hence correct option is 1.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/394bbbfd-ceb6-44ca-a213-2335be70abcb-image.png\" style=\"width: 316px; height: 300px;\" />&nbsp;&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf802", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-04T09:00:00.000Z", "isVisible": true, "shortName": "2020 (04 Sep Shift 1)", "title": "JEE Main 2020 (04 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66d07", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7fa", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-08T09:00:00.000Z", "isVisible": true, "shortName": "2020 (08 Jan Shift 1)", "title": "JEE Main 2020 (08 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The most suitable reagent for the given conversion is: <br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/92f6f7a9-a778-4fc3-bfd1-89e7c8954202.jpeg\"> <br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f995b416-bb9c-4314-9f0d-2c5280db2ce7.jpeg\">", "image": null}, "options": [{"id": "Gv6EN", "text": "<math><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>6</mn></mrow></msub></math>", "isCorrect": true, "image": null}, {"id": "8j1nx", "text": "<math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">B</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "isCorrect": false, "image": null}, {"id": "oINGU", "text": "<math><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">l</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "isCorrect": false, "image": null}, {"id": "wXxVS", "text": "<math><mrow><mrow><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mo>/</mo><mrow><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">d</mi></mrow></mrow></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">B</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>6</mn></msub></math> is very selective and usually used to reduce acid into alcohol.</p><p>Borane is commonly used for the reduction of carboxylic acids in the presence of esters, lactones, amides, halides and other functional groups. In addition, borane rapidly reduces aldehydes, ketones, and alkenes.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7fa", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-08T09:00:00.000Z", "isVisible": true, "shortName": "2020 (08 Jan Shift 1)", "title": "JEE Main 2020 (08 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65f57", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}], "question": {"text": "In the presence of a small amount of phosphorous, aliphatic carboxylic acid reacts with chlorine or bromine to yield a reaction in which,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#945;</mi><mo>-</mo></math>hydrogen&nbsp;is&nbsp;been replaced by halogen. This reaction is known as", "image": null}, "options": [{"id": "GuTmN", "text": "Etard reaction", "image": null, "isCorrect": false}, {"id": "AMPXq", "text": "Wolff-Kischner reaction", "image": null, "isCorrect": false}, {"id": "3XaBy", "text": "Rosenmund reaction", "image": null, "isCorrect": false}, {"id": "gUv7S", "text": "Hell-volhard-zelinsky reaction", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>This reaction is known as HVZ reaction.<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/4f9b8036-e7ee-4751-b47e-433fb887c796-image.png\" style=\"width: 522px; height: 102px;\" /></p><p><span style=\"color: rgb(0, 0, 0); font-family: Arial, Helvetica, &quot;sans serif&quot;;\">Treatment with bromine and a catalytic amount of phosphorus leads to the selective <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#945;</mi><mo>-</mo></math>bromination of carboxylic acids.</span></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65f50", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}], "question": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b98d2ef2-2c35-41f9-b537-b22b1aa836a1-image.png\" style=\"width: 260px; height: 132px;\" /><br /><br />A is :", "image": null}, "options": [{"id": "ViUoA", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/71c6330d-31e4-4fdc-8ffa-a9a085be0624-image.png\" style=\"width: 122px; height: 75px;\" />", "image": null, "isCorrect": true}, {"id": "JAdHe", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/64e71f11-9d15-486e-a8b5-e0f7fa9c3a5a-image.png\" style=\"width: 170px; height: 75px;\" />", "image": null, "isCorrect": false}, {"id": "wXCDg", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/adbeb9f2-d1b3-409c-9e75-3953380b66b8-image.png\" style=\"width: 121px; height: 75px;\" />", "image": null, "isCorrect": false}, {"id": "8LZTv", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/33e701db-30f2-4d96-81de-505b434c4ac0-image.png\" style=\"width: 110px; height: 135px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/448bb025-0c1c-47f1-8abf-c266f31a6e64-image.png\" style=\"width: 600px; height: 124px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65b89", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}], "question": {"text": "An organic compound A upon reacting with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NH</mi><mn>3</mn></msub></math><sub>&nbsp;</sub>gives B. On heating, B gives C. C in presence of KOH reacts with Br<sub>2</sub> to give CH<sub>3</sub>CH<sub>2</sub>NH<sub>2</sub>. A is :", "image": null}, "options": [{"id": "oSoiq", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/9c7283c3-2dd8-42ca-b561-61a2f3b4dfb0-image.png\" style=\"width: 182px; height: 78px;\" />", "image": null, "isCorrect": false}, {"id": "0fXTu", "text": "<math> <mrow> <msub> <mtext>CH</mtext> <mn>3</mn> </msub> <msub> <mtext>CH</mtext> <mn>2</mn> </msub> <mtext>COOH</mtext> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "hmQl9", "text": "<math><mrow>  <msub>          <mtext>CH</mtext>        <mn>3</mn>  </msub>  <mtext>COOH</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "GRgZW", "text": "<math><mrow>  <msub>          <mtext>CH</mtext>        <mn>3</mn>  </msub>  <msub>          <mtext>CH</mtext>        <mn>2</mn>  </msub>  <msub>          <mtext>CH</mtext>        <mn>2</mn>  </msub>  <mtext>COOH</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p style=\"text-align: justify;\">Ammonia reacts with carboxylic acid to form ammonium carboxylate (B). Which on heating form amide (C). Amide on reaction with bromine and KOH&nbsp;undergo Hoffmann Bromamide reaction to form amine with one carbon less.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable><mtr><mtd><msub><mi>CH</mi><mn>3</mn></msub><mo>&#8722;</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>&#8722;</mo><mover><mi mathvariant=\"normal\">C</mi><munder><mi mathvariant=\"normal\">O</mi><mrow><mo>|</mo><mo>|</mo></mrow></munder></mover><mo>&#8722;</mo><mi>OH</mi><mo>+</mo><msub><mi>NH</mi><mn>3</mn></msub></mtd></mtr><mtr><mtd><mo>(</mo><mi mathvariant=\"normal\">A</mi><mo>)</mo></mtd></mtr></mtable><mover><mo>&#8594;</mo><mrow></mrow></mover><mtable><mtr><mtd><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mo>&#8722;</mo><mover><mi mathvariant=\"normal\">C</mi><munder><mi mathvariant=\"normal\">O</mi><mrow><mo>|</mo><mo>|</mo></mrow></munder></mover><mo>&#8722;</mo><msup><mi mathvariant=\"normal\">O</mi><mo>&#8854;</mo></msup></mtd></mtr><mtr><mtd><mo>(</mo><mi mathvariant=\"normal\">B</mi><mo>)</mo></mtd></mtr></mtable><mover><mi mathvariant=\"normal\">N</mi><mo>&#8853;</mo></mover><msub><mi mathvariant=\"normal\">H</mi><mn>4</mn></msub><mspace linebreak=\"newline\"></mspace><mtable><mtr><mtd><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mo>&#8722;</mo><mover><mi mathvariant=\"normal\">C</mi><munder><mi mathvariant=\"normal\">O</mi><mrow><mo>|</mo><mo>|</mo></mrow></munder></mover><mo>&#8722;</mo><msup><mi mathvariant=\"normal\">O</mi><mo>&#8854;</mo></msup></mtd></mtr><mtr><mtd><mo>(</mo><mi mathvariant=\"normal\">B</mi><mo>)</mo></mtd></mtr></mtable><mover><mi mathvariant=\"normal\">N</mi><mo>&#8853;</mo></mover><msub><mi mathvariant=\"normal\">H</mi><mn>4</mn></msub><mover><mo>&#8594;</mo><mi mathvariant=\"normal\">&#916;</mi></mover><mtable><mtr><mtd><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mo>&#8722;</mo><mover><mi mathvariant=\"normal\">C</mi><munder><mi mathvariant=\"normal\">O</mi><mrow><mo>|</mo><mo>|</mo></mrow></munder></mover><mo>&#8722;</mo><msub><mi>NH</mi><mn>2</mn></msub></mtd></mtr><mtr><mtd><mo>(</mo><mi mathvariant=\"normal\">C</mi><mo>)</mo></mtd></mtr></mtable><mspace linebreak=\"newline\"></mspace><mtable><mtr><mtd><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mo>&#8722;</mo><mover><mi mathvariant=\"normal\">C</mi><munder><mi mathvariant=\"normal\">O</mi><mrow><mo>|</mo><mo>|</mo></mrow></munder></mover><mo>&#8722;</mo><msub><mi>NH</mi><mn>2</mn></msub></mtd></mtr><mtr><mtd><mo>(</mo><mi mathvariant=\"normal\">C</mi><mo>)</mo></mtd></mtr></mtable><munderover><mo>&#8594;</mo><mrow><mo>(</mo><mi>Hoffmann</mi><mo>&#160;</mo><mi>bromamide</mi><mo>&#160;</mo><mi>degradation</mi><mo>)</mo></mrow><mrow><msub><mi>Br</mi><mn>2</mn></msub><mo>/</mo><mi>KOH</mi></mrow></munderover><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mo>&#8722;</mo><msub><mi>NH</mi><mn>2</mn></msub></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d655d8", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "Which of the following undergoes reaction with $50 \\%$ sodium hydroxide solution to give the corresponding alcohol and acid?", "image": null}, "options": [{"id": "lxMvm", "text": "\nPhenol\n", "image": null, "isCorrect": false}, {"id": "UUQdQ", "text": "\nBenzoic acid\n", "image": null, "isCorrect": false}, {"id": "U9fl8", "text": "\nButanal\n", "image": null, "isCorrect": false}, {"id": "8ECOC", "text": "\nBenzaldehyde", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Benzaldehyde does not contain $\\alpha$ - hydrogen. Hence goes for cannizarro's reaction forming alcohol and acid", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d655d5", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "On mixing ethyl acetate with aqueous sodium chloride, the composition of the resultant solution is", "image": null}, "options": [{"id": "tieH5", "text": "\n$\\mathrm{CH}_3 \\mathrm{COOC}_2 \\mathrm{H}_5+\\mathrm{NaCl}$\n", "image": null, "isCorrect": true}, {"id": "RUBlh", "text": "\n$\\mathrm{CH}_3 \\mathrm{Cl}+\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{COONa}$\n", "image": null, "isCorrect": false}, {"id": "LkTC8", "text": "\n$\\mathrm{CH}_3 \\mathrm{COCl}+\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{OH}+\\mathrm{NaOH}$\n", "image": null, "isCorrect": false}, {"id": "0Q9KD", "text": "\n$\\mathrm{CH}_3 \\mathrm{COONa}+\\mathrm{C}_2 \\mathrm{H}_5 \\mathrm{OH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d654e1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "When $\\mathrm{CH}_2=\\mathrm{CH}-\\mathrm{COOH}$ is reduced with $\\mathrm{LiAlH}_4$, the compound obtained will be", "image": null}, "options": [{"id": "25jAH", "text": "\n$\\mathrm{CH}_2=\\mathrm{CH}-\\mathrm{CH}_2 \\mathrm{OH}$\n", "image": null, "isCorrect": true}, {"id": "b9fDw", "text": "\n$\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{CH}_2 \\mathrm{OH}$\n", "image": null, "isCorrect": false}, {"id": "46t7k", "text": "\n$\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{CHO}$\n", "image": null, "isCorrect": false}, {"id": "Cdh5o", "text": "\n$\\mathrm{CH}_3-\\mathrm{CH}_2-\\mathrm{COOH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{LiAl}^{\\mathrm{H}}{ }_4$ can reduce $\\mathrm{COOH}$ group and not the double bond\n$\\mathrm{CH}_2=\\mathrm{CH}-\\mathrm{COOH} \\underset{\\mathrm{CH}_2=\\mathrm{CH}-\\mathrm{CH}_2 \\mathrm{OH}}{\\stackrel{\\mathrm{LAH}}{\\longrightarrow}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d653f2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "$\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{COOH} \\underset{\\text { red P }}{\\stackrel{\\mathrm{Cl}_2}{\\longrightarrow}} \\mathrm{A} \\stackrel{\\text { alc. } \\mathrm{KOH}}{\\longrightarrow} \\mathrm{B}$. What is $\\mathrm{B}$ ?", "image": null}, "options": [{"id": "PzuSK", "text": "\n$\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{COCl}$\n", "image": null, "isCorrect": false}, {"id": "UdWwp", "text": "\n$\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{CHO}$\n", "image": null, "isCorrect": false}, {"id": "X18Py", "text": "\n$\\mathrm{CH}_2=\\mathrm{CHCOOH}$\n", "image": null, "isCorrect": true}, {"id": "bR1pk", "text": "\n$\\mathrm{ClCH}_2 \\mathrm{CH}_2 \\mathrm{COOH}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/RnKOv31ZXIAr5RihYMyaBE3hQ_f5se7UqkY3V62OVnE.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "648b5a73417cc3fb48d69294", "title": "Preparation and Properties of Carboxylic Acids", "totalQuestions": 29, "questions": [{"_id": "69d8076281239f6567c4f51e", "type": "singleCorrect", "question": {"text": "Complete the following reaction sequence and give the name of major product 'P'.<br>$CH_3-CH_2-C\\equiv N \\xrightarrow[\\text{(ii) } H_3O^+]{\\text{(i) } OH^-/H_2O/\\Delta} \\xrightarrow[\\text{(iv) } H_2O]{\\text{(iii) } Cl_2/\\text{Red P}} P \\text{ (Major product)}$", "image": null}, "options": [{"id": "2jeo2", "text": "2-Chloropropanoic acid", "isCorrect": true, "image": null}, {"id": "6DHmR", "text": "3-Chloropropanoic acid", "isCorrect": false, "image": null}, {"id": "shn6F", "text": "1-Chloropropane", "isCorrect": false, "image": null}, {"id": "toeSB", "text": "2-Chloropropane", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Step 1: Hydrolysis of the nitrile.<br>Propanenitrile on basic hydrolysis followed by acidic workup gives propanoic acid:<br>$CH_3-CH_2-C \\equiv N \\xrightarrow[(ii)\\ H_3O^+]{(i)\\ OH^-/H_2O/\\Delta} CH_3-CH_2-COOH$<br><br>Step 2: Hell$-$Volhard$-$Zelinsky (HVZ) reaction.<br>Propanoic acid has an $sp^3$ $\\alpha$-carbon bearing two $\\alpha$-hydrogens. In the HVZ reaction, $Cl_2$ in the presence of red phosphorus selectively replaces one $\\alpha$-hydrogen by chlorine, giving the $\\alpha$-chloro acid after aqueous workup:<br>$CH_3-CH_2-COOH \\xrightarrow[(iv)\\ H_2O]{(iii)\\ Cl_2/\\text{Red P}} CH_3-CH(Cl)-COOH$<br><br>Hence, the major product $P$ is $2$-chloropropanoic acid, which corresponds to option $(1)$.", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "1e0aefcc3f6f4edc9658155beb02bdc2", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/gEifBQEUStSnL.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/gEifBQEUStSnL.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8074981239f6567c4f3f3", "type": "singleCorrect", "question": {"text": "The descending order of acidity among the following compounds is:<br>A. Phenol<br>B. $4$-nitrophenol<br>C. $4$-methoxyphenol<br>D. $4$-nitrobenzoic acid<br>E. Benzoic acid<br><img style=\"width:200px; \"src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/04APRS2__q66_d1.jpg\" /><br>Choose the correct answer from the options given below:", "image": null}, "options": [{"id": "k9r2P", "text": "$B>D>E>A>C$", "isCorrect": false, "image": null}, {"id": "J7tof", "text": "$D>B>E>A>C$", "isCorrect": false, "image": null}, {"id": "s5b6x", "text": "$C>A>B>D>E$", "isCorrect": false, "image": null}, {"id": "MN3Qz", "text": "$D>E>B>A>C$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Carboxylic acids are stronger acids than phenols because the carboxylate anion is stabilized by equivalent resonance structures. Thus, D and E are more acidic than A, B, and C.<br><br>For the carboxylic acids, the $-NO_2$ group in D is an electron-withdrawing group ($-I, -R$), which stabilizes the conjugate base, making D more acidic than E.<br><br>For the phenols, electron-withdrawing groups increase acidity while electron-donating groups decrease it. The $-NO_2$ group in B is electron-withdrawing, making it more acidic than A. The $-OCH_3$ group in C is electron-donating ($+R > -I$), making it less acidic than A. Thus, the order for phenols is B $>$ A $>$ C.<br><br>Combining these, the overall descending order of acidity is D $>$ E $>$ B $>$ A $>$ C.<br><br>Answer: $D>E>B>A>C$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd6", "title": "JEE Main 2026 (04 April Shift 2)", "shortName": "2026 (04 April Shift 2)", "isVisible": true, "heldOn": "2026-04-04T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "63e6762ecb22422e95e27db4fa73c2bb", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/qHJQyLkQV2bXc.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/qHJQyLkQV2bXc.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["SEQUENCE_ORDER"], "syllabusCategory": "noChange", "previousYear": {"_id": "69d806e28b80d82dea5b7dd6", "title": "JEE Main 2026 (04 April Shift 2)", "shortName": "2026 (04 April Shift 2)", "isVisible": true, "heldOn": "2026-04-04T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1b48bfdbb2435639810", "type": "singleCorrect", "level": 3, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "The correct order of acidic strength of the major products formed in the given reactions, is : <br> A. <img style=\"width:300px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/28S2_q_62_1.png\"> <br> B. $\\mathrm{CH}_{3} \\mathrm{CH}_{2} \\mathrm{CHO} \\xrightarrow[\\Delta]{\\left[\\mathrm{Ag}\\left(\\mathrm{NH}_{3}\\right)_{2}\\right]^{+}, \\mathrm{OH}^{-}}[\\mathrm{B}]$ <br> C. $\\mathrm{CH}_{4}+\\mathrm{O}_{2} \\xrightarrow[\\text { (ii) } \\mathrm{Na}_{2} \\mathrm{Cr}_{2} \\mathrm{O}_{7} / \\mathrm{H}^{+}]{\\text {(i) }}[\\mathrm{C}]$ <br> D. $\\mathrm{PhCH}_{2} \\mathrm{MgBr}+\\mathrm{CO}_{2} \\xrightarrow[\\mathrm{H}_{3} \\mathrm{O}^{+}]{\\text {Dry ether }}[\\mathrm{D}]$ <br> Choose the correct answer from the options given below :", "image": null}, "options": [{"id": "bXzws", "text": "$A>D>B>C$", "isCorrect": false, "image": null}, {"id": "aN4Ql", "text": "$C>A>D>B$", "isCorrect": true, "image": null}, {"id": "V6gW8", "text": "$C>B>A>D$", "isCorrect": false, "image": null}, {"id": "XyPxR", "text": "$A>D>C>B$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Product [A]: From PhNH₂, steps (1) NaNO₂ + HCl forms diazonium salt, (2) CuCN gives benzonitrile, (3) H₃O⁺/Δ hydrolyzes to benzoic acid (PhCOOH), pKa ≈ 4.2.<br>Product [B]: From CH₃CH₂CHO, Tollens' oxidation with $[Ag(NH_3)_2]^+$ produces acetic acid (CH₃COOH), pKa ≈ 4.8.<br>Product [C]: From CH₄ + O₂ with heat and Na₂Cr₂O₇/H⁺ produces formic acid (HCOOH), pKa ≈ 3.8 (strongest acid).<br>Product [D]: From PhCH₂MgBr + CO₂, the Grignard reaction produces phenylacetic acid (PhCH₂COOH), pKa ≈ 4.3.<br>Acidic strength order (lower pKa = stronger): C (3.8) > A (4.2) > D (4.3) > B (4.8).", "image": null}, "videoSolution": {"videoId": "580a94e712894c1f8c75239f90acdecd", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/a0Y28TDeLFZmO.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/a0Y28TDeLFZmO.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["SEQUENCE_ORDER"], "syllabusCategory": "noChange", "previousYear": {"_id": "69 l\">A</mi><mo>'</mo></math> is optically active and gives a pale yellow precipitate when warmed with alcoholic <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>AgNO</mi><mn>3</mn></msub></math>. Isomer <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>'</mo><mi mathvariant=\"normal\">A</mi><mo>'</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>'</mo><mi mathvariant=\"normal\">B</mi><mo>'</mo></math>&nbsp;are, respectively :", "image": null}, "options": [{"id": "Hw1qy", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/668ce3ce-2388-4c15-9278-b1d11b49d774-image.png\" style=\"width: 288px; height: 100px;\" /></p><p>&nbsp;</p>", "isCorrect": false, "image": null}, {"id": "dNqBD", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/8e8e7a64-b2dd-44c8-8317-2f3b163963a5-image.png\" style=\"width: 215px; height: 120px;\" /></p><p>&nbsp;</p>", "isCorrect": false, "image": null}, {"id": "pNp41", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>CHBr</mi><mo>-</mo><msub><mi mathvariant=\"normal\">C</mi><mn>6</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub></math>&nbsp;and&nbsp;<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3224c753-b644-4cf5-ad0b-a9b19eb2ee34-image.png\" style=\"width: 84px; height: 120px;\" /></p><p>&nbsp;</p>", "isCorrect": true, "image": null}, {"id": "nEqdB", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a6646ac4-6585-4b91-b897-613471f0e720-image.png\" style=\"width: 85px; height: 120px;\" />&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>CHBr</mi><mo>-</mo><msub><mi mathvariant=\"normal\">C</mi><mn>6</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub></math></p>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Based on the percentage composition of the elements given the molecular formula of the compound is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>8</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>9</mn></msub><mi>Br</mi></math></p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fc1671c4-65f6-42ef-9f4b-924a0c4a6842-dbe.png\" style=\"width: 350px; height: 156px;\" /></p><p>And the degree of unsaturation or double bond equivalent of&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>8</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>9</mn></msub><mi>Br</mi></math>&nbsp;is 4.</p><p>It is mentioned that A is optically active and gives pale yellow precipitate with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>AgNO</mi><mn>3</mn></msub></math>.</p><p>Hence, the structures of A and B can be deduced based on the following reactions.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1cfc77f5-782b-4944-9836-8f18e2d22e25-13-7-20223.png\" style=\"width: 300px; height: 378px;\" /></p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 2)", "title": "JEE Main 2022 (29 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67a89", "previousYearPapers": [{"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>The reagent, from the following, which converts benzoic acid to benzaldehyde in one step is</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ead2d568-d3fa-4b94-acb2-55283d1ae64a-image.png\" style=\"width: 300px; height: 159px;\" /></p>", "image": null}, "options": [{"id": "73jFm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>LiAlH</mi><mn>4</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "wkkWe", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KMnO</mi><mn>4</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "tno6V", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>MnO</mi></math>", "isCorrect": true, "image": null}, {"id": "0uDIG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NaBH</mi><mn>4</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>When benzoic acid is heated with formic acid in presence of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mno</mi></math>, benzaldehyde is obtained.</p><p>The reaction is given below, along with benzaldehyde, carbondioxide and water are also obtained.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>6</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub><mi>COOH</mi><mo>+</mo><mi>HCOOH</mi><munderover><mo>&#8594;</mo><mi>Heat</mi><mi>MnO</mi></munderover><msub><mi mathvariant=\"normal\">C</mi><mn>6</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub><mi>CHO</mi><mo>+</mo><msub><mi>CO</mi><mn>2</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d6775e", "previousYearPapers": [{"_id": "62c481f001514d218a7934d1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T09:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 1)", "title": "JEE Main 2022 (24 Jun Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Two statements are given belwo :</p><p>Statement I : The melting point of monocarboxylic acid with even number of carbon atoms is higher than that of with odd number of carbon atoms acid immediately below and above it in the series.</p><p>Statement II : The solubility of monocarboxylic acids in water decreases with increase in molar mass.</p><p>Choose the most appropriate option :</p>", "image": null}, "options": [{"id": "EBJ5o", "text": "Both Statement I and Statement II are correct.", "isCorrect": false, "image": null}, {"id": "NerIB", "text": "Both Statement I and Statement II are incorrect.", "isCorrect": false, "image": null}, {"id": "ciUY5", "text": "Statement I is correct but Statement II is incorrect.", "isCorrect": false, "image": null}, {"id": "oQRlg", "text": "Statement I is incorrect but Statement II is correct.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>The melting point of carboxylic acid has no trend as we can observe from the following data of metling point.</p><p>Methanoic acid <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>8</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, Ethanoic acid <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>17</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, Propanoic acid <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, Butanoic acid <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>6</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, Pentonoic acid <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>35</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, Hexonic acid <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>20</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, Heptanoic acid <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mn>8</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, Octanoic acid <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>17</mn><mo>&#160;</mo><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> acid. Water solubility of carboxylic acid decreases as we increase the molar mass &amp; hence hydrophobic part of the chain.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "62c481f001514d218a7934d1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T09:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 1)", "title": "JEE Main 2022 (24 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66e33", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf821", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-09-01T14:00:00.000Z", "isVisible": true, "shortName": "2021 (01 Sep Shift 2)", "title": "JEE Main 2021 (01 Sep Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>In the following sequence of reactions a compound <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>,</mo></math> (molecular formula <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"n question-pool.getmarks.app/pyq/jee_main/n7bszDuznaeJC54IvrfxB8Ho1Kwc99tXTjmz6tbbtRE.original.fullsize.png\"><br>", "isCorrect": true, "image": null}, {"id": "Q2ZoT", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fH-d7VGfOpKI5QoRm3s5RsBuVstpofXSeYPjmarzyvc.original.fullsize.png\"><br>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Alkaline $\\mathrm{KMnO}_{4}$ is a strong oxidising agent and oxidises $-\\mathrm{CH}_{3}$ as well as $-\\mathrm{CO}$ group to $-\\mathrm{COOH}$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7njBzhB72NHZ6lWD0CDN5a_i7jrjkhNhL_baHG0THks.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d66547", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 1)", "title": "JEE Main 2019 (09 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Acid strength given below the correct decreasing order will be&nbsp;:</p>", "image": null}, "options": [{"id": "dsV98", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi>COOH</mi><mo>&#62;</mo><msub><mi>FCH</mi><mn>2</mn></msub><mi>COOH</mi><mo>&#62;</mo><msub><mi>CNCH</mi><mn>2</mn></msub><mi>COOH</mi><mo>&#62;</mo><msub><mi>ClCH</mi><mn>2</mn></msub><mi>COOH</mi></math>", "isCorrect": false, "image": null}, {"id": "zSRN7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"> t=\"normal\">O</mi><mn>2</mn></msub><msub><mi>NCH</mi><mn>2</mn></msub><mi>COOH</mi><mo>&#62;</mo><mi>NC</mi><mi mathvariant=\"normal\">&#160;</mi><msub><mi>CH</mi><mn>2</mn></msub><mi>COOH</mi><mo>&#62;</mo><msub><mi>FCH</mi><mn>2</mn></msub><mi mathvariant=\"normal\">&#160;</mi><mi>COOH</mi><mo>&#62;</mo><mi>Cl</mi><mi mathvariant=\"normal\">&#160;</mi><msub><mi>CH</mi><mn>2</mn></msub><mi mathvariant=\"normal\">&#160;</mi><mi>COOH</mi></mtd></mtr><mtr><mtd><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo><mo>&#160;&#160;</mo></mtd></mtr></mtable></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["SEQUENCE_ORDER"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ebde3d91842a5cf7e8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 1)", "title": "JEE Main 2019 (09 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d662ec", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 2 Online)", "title": "JEE Main 2018 (15 Apr Shift 2 Online)"}], "question": {"text": "The increasing order of the acidity of the following carboxylic acids is:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/RV1BGUAchTdYKCipMgMlIzqB3qyOirq2r5S08derjvk.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "91zNA", "text": "\nIII $ < $ II $ < $ IV $ < $ I", "image": null, "isCorrect": true}, {"id": "smq0x", "text": "\nI $ < $ III $ < $ II $ < $ IV", "image": null, "isCorrect": false}, {"id": "z4rkc", "text": "\nIV $ < $ II $ < $ III $ < $ I", "image": null, "isCorrect": false}, {"id": "CDCxO", "text": "\nII $ < $ IV $ < $ III $ < $ I", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The increasing order of the acidity of the carboxylic acids is III $ < $ II $ < $ IV $ < $ I. In aromatic acids, electron withdrawing groups like $\\mathrm{Cl},-\\mathrm{CN},-\\mathrm{NO}_2$ increases the acidity, whereas electron releasing groups like $\\mathrm{CH}_3,-\\mathrm{OH},-\\mathrm{OCH}_3,-\\mathrm{NH}_2$ decreases the acidity.", "image": null}, "videoSolution": null, "questionStructure": ["SEQUENCE_ORDER"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ebde3d91842a5cf7e6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 2 Online)", "title": "JEE Main 2018 (15 Apr Shift 2 Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65b87", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}], "question": {"text": "Compound (A), <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>8</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>9</mn></msub><mi>Cl</mi></math>, gives a white precipitate when warmed with alcoholic <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>AgNO</mi><mn>3</mn></msub></math><sub>.</sub>&nbsp;Oxidation of (A) gives an acid (B), <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>8</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>6</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>4</mn></msub></math>. (B) easily forms anhydride on heating. Identify the compound (A).", "image": null}, "options": [{"id": "C94T1", "text": "​<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ed57dd2d-d997-4c61-aa49-a75d99cf77f7-image.png\" style=\"width: 128px; height: 220px;\" />", "image": null, "isCorrect": false}, {"id": "LLapP", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fc62bb74-aa4b-4f6d-99cf-6475eca20a62-image.png\" style=\"width: 178px; height: 127px;\" />​", "image": null, "isCorrect": true}, {"id": "1UPIj", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fa79ef7b-21fa-4db1-a39f-de21689f762d-image.png\" style=\"width: 179px; height: 159px;\" />​", "image": null, "isCorrect": false}, {"id": "Nf4hS", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/66d7dcde-1929-498f-8254-8038ba2dd764-image.png\" style=\"width: 183px; height: 142px;\" />​", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<img height=\"138\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/11cd197a-69fa-47ca-8a3a-5a42213a905a-image.png\" width=\"210\" /></p>Compound (A)&nbsp;gives a white precipitate when warmed with alcoholic <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>AgNO</mi><mn>3</mn></msub></math>means it contain a removable chloride&nbsp;atom(Benzylic position)<sub>.</sub>&nbsp;Oxidation of (A) gives an acid (B), <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>8</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>6</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>4</mn></msub></math>. (B) easily forms anhydride on heating. Means both acid should be ortho position of each other.<p><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f739a781-ac88-4863-8eac-590d7792d214-image.png\" style=\"width: 613px; height: 305px;\" /><br />&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d657e6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "JEE Main 2007"}], "question": {"text": "The compound formed as a result of oxidation of ethyl benzene by $\\mathrm{KMnO}_4$ is", "image": null}, "options": [{"id": "7A8Sd", "text": "\nbenzophenone\n", "image": null, "isCorrect": false}, {"id": "LQ9aM", "text": "\nacetophenone\n", "image": null, "isCorrect": false}, {"id": "JDlLN", "text": "\nbenzoic acid\n", "image": null, "isCorrect": true}, {"id": "iphGt", "text": "\nbenzyl alcohol", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Any aliphatic carbon with hydrogen attached to it, in combination with benzene ring, will be oxidized to benzoic acid by $\\mathrm{KMnO}_4 / \\mathrm{H}^{+}$.\nHence, (C) is correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "JEE Main 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6575a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}], "question": {"text": "The correct order of increasing acid strength of the compounds is\n(a) $\\mathrm{C 200px; height: 138px;\"/>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><strong>Freidel-Crafts Acylation:</strong></p><ul> <li>Friedel-Crafts acylation reaction is a type of reaction where an acyl group is added to an aromatic ring.</li> <li>This reaction occurs in the presence of an acid chloride <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi><mo>-</mo><mfenced><mrow><mi mathvariant=\"normal\">C</mi><mo>=</mo><mi mathvariant=\"normal\">O</mi></mrow></mfenced><mo>-</mo><mi>Cl</mi></math> and a Lewis acid catalyst like Aluminium chloride <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>AlCl</mi><mn>3</mn></msub></math>.</li> <li>Friedel-Crafts acylation reaction, changes the aromatic ring into a aromatic ketone.<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/de8f3d55-e97a-44e6-8539-3bf23280d899.png\" style=\"width: 704px; height: 521px;\"/></li></ul>", "image": null}, "videoSolution": {"videoId": "0c54a63dbf0a47168b01707160fc6ff9", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/iAmQuOaF41yQw.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/iAmQuOaF41yQw.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 2)", "title": "JEE Main 2024 (31 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Ja y amide. The secondary amide undergo reduction with lithium aluminium hydride to give secondary amine.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5546dec6-cec8-48ad-a320-e802a2d65c26.png\" style=\"width: 450px; height: 196px;\" /></p>", "image": null}, "videoSolution": {"videoId": "b1504236c7504f33955840fb97fdcf75", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/ce4yOC8C9Pe89.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/ce4yOC8C9Pe89.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d6850a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6491", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 2)", "title": "JEE Main 2023 (10 Apr Shift 2)"}], "question": {"text": "<p>In the reaction given below</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1c37b30a-b554-4e1d-b97b-b3f636bd4fa9.png\" style=\"width: 450px; height: 139px;\" /></p><p>The product &lsquo;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>&rsquo; is :</p>", "image": null}, "options": [{"id": "idog9", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ffa5264b-5a31-4a42-b546-9f836565ffc4.png\" style=\"width: 300px; height: 137px;\" />", "image": null, "isCorrect": false}, {"id": "jOo40", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d3ec2f57-a8ea-4093-9e7d-52605c4da0a1.png\" style=\"width: 300px; height: 105px;\" />", "image": null, "isCorrect": false}, {"id": "nmwv5", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5a140b78-b492-42aa-bcce-479fb0de115a.png\" style=\"width: 300px; height: 111px;\" />", "image": null, "isCorrect": true}, {"id": "2mqmK", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/33a5e242-9a46-45c5-924e-22906a181911.png\" style=\"width: 300px; height: 131px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Lithium aluminium hydride, is a reducing agent that is commonly used in modern organic synthesis. It is a nucleophilic reducing agent that is best suited for reducing multiple polar bonds such as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi><mo>=</mo><mi mathvariant=\"normal\">O</mi></math>. It can reduce carbonyl compounds to alcohols and amides to amines.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi><mo>=</mo><mi mathvariant=\"normal\">C</mi></math>&nbsp;is not effected during this reaction.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/bb16d825-61ff-4c79-9899-05c99238b64e.png\" style=\"width: 666px; height: 157px;\" /></p><p>&nbsp;</p>", "image": null}, "videoSolution": {"videoId": "08636478442446c883d46083a6b4161c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/xphpQrMJZdO0s.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/xphpQrMJZdO0s.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6491", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 2)", "title": "JEE Main 2023 (10 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d681f7", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}], "type": "numerical", "level": 3, "question": {"text": "A trisubstituted compound &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39;, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>10</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>12</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>&nbsp;gives neutral <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>FeCl</mi><mn>3</mn></msub></math>&nbsp;test positive. Treatment of compound &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39; with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mi>Br</mi></math> gives <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>11</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>14</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>, with hydroiodic acid gives methyl iodide and with hot conc. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math> gives a compound <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>10</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>12</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>. Compound &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39; also decolorises alkaline <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KMnO</mi><mn>4</mn></msub></math>. The number of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#960;</mi></math> bond/s &nbsp;present in the compound &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39; is _____ .", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p>The&nbsp;trisubstituted compound &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39;, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>10</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>12</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>&nbsp;gives neutral <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>FeCl</mi><mn>3</mn></msub></math>&nbsp;test positive, means the compound is phenol. Phenol on&nbsp;treatment with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mi>Br</mi></math> gives <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>10</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>11</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>3</mn></msub></math>. The given&nbsp;compound is reacting with hot conc. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math> gives a compound <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>10</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>12</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>. The reaction is Cannizzaro&#39;s reaction. Hence, compound must be&nbsp;benzaldehyde derivative. Compound &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39; also decolourises alkaline <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KMnO</mi><mn>4</mn></msub></math>, means compound contains an alkyl group attached to benzene ring. Hence, the structure of the compound can be written as follows,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/bbeffd61-56c1-4021-9be7-c9e485b6310c-image.png\" style=\"width: 236px; height: 222px;\" /></p><p>The reactions are shown below.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d4e638fa-0ba1-4d68-b78d-78eb3598acb6-image.png\" style=\"width: 441px; height: 169px;\" /></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/32fc7843-aab9-4637-8c93-33413037faf0-image.png\" style=\"width: 656px; height: 175px;\" /></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0a84fd7d-e596-4a39-b4d2-602f88beebd9-image.png\" style=\"width: 493px; height: 165px;\" /></p>", "image": null}, "videoSolution": {"videoId": "f7db6808dcad4e89aed6d7359a9a7993", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/PbPcOGGAskX3s.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/PbPcOGGAskX3s.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d679d6", "previousYearPapers": [{"_id": "63134c746e7bc9b332483709", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 2)", "title": "JEE Main 2022 (26 Jul Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b878b509-f206-4070-bf6a-c462160cfc78-image.png\" style=\"width: 483px; height: 90px;\" /></p><p>Consider the above reaction and predict the major product.</p>", "image": null}, "options": [{"id": "5fP2P", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1bf873c2-ea5c-4235-af37-d95927109697-image.png\" style=\"width: 346px; height: 70px;\" /></p>", "isCorrect": true, "image": null}, {"id": "Sp1Hc", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/94f580d1-c56f-4df0-9df5-9b7c80e4b7e4-image.png\" style=\"width: 352px; height: 90px;\" /></p>", "isCorrect": false, "image": null}, {"id": "1FiMT", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2dda7458-854d-4202-9b7f-dbbe05b5ec08-image.png\" style=\"width: 361px; height: 90px;\" />", "isCorrect": false, "image": null}, {"id": "F82Ud", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f0b799e6-8b68-4dc0-9bc9-d3eec561a68b-image.png\" style=\"width: 316px; height: 60px;\" /></p>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>DiBAL-H is&nbsp;Diisobutylaluminium hydride, which is a very useful reducing agent. It is used for selectively converting ester or nitriles into respective aldehydes. It does not affect other groups like aldehyde or double bond.&nbsp;</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/4ef7aab7-f5fc-4422-8d02-76f9e36b3c9a-dec4377f-1cd8-4a10-ae36-907c1a68790d-image.png\" style=\"width: 396px; height: 231px;\" /></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483709", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 2)", "title": "JEE Main 2022 (26 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67ec2", "previousYearPapers": [{"_id": "62c481f101514d218a7934dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 2)", "title": "JEE Main 2022 (29 Jun Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "In Friedel-Crafts alkylation of aniline, one gets:", "image": null}, "options": [{"id": "tifAR", "text": "alkylated product with ortho and para&nbsp;substitution.", "isCorrect": false, "image": null}, {"id": "4ZFwZ", "text": "secondary amine after acidic treatment.", "isCorrect": false, "image": null}, {"id": "3OWiv", "text": "an amide product.", "isCorrect": false, "image": null}, {"id": "8KQZX", "text": "positively charged nitrogen at benzene ring.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Aniline does not undergo Friedel-crafts reaction&nbsp;due to salt formation with aluminium chloride, the Lewis acid, which is used as a catalyst, whereas&nbsp;aniline is a strong base. So, an acid-base reaction will take place. Thus, aniline reacts with <math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mn>3</mn></mrow></msub></math> to form a salt.<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/75d7b7ac-4e45-493a-91c6-85fa0ddc3273-9711822.png\" style=\"width: 270px; height: 157px;\" /><br />Due to the positive charge on the nitrogen atom (shows <math><mo>-</mo><mi mathvariant=\"normal\">I</mi></math> effect and it is meta directing), electrophilic substitution in the benzene ring is deactivated. Hence, the Friedel-Crafts reaction will not take place in aniline.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 2)", "title": "JEE Main 2022 (29 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d673e0", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 1)", "title": "JEE Main 2021 (26 Aug Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "The correct sequential addition of reagents in the preparation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>-</mo></math>nitrobenzoic acid from benzene is:", "image": null}, "options": [{"id": "ec4C1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Br</mi><mn>2</mn></msub><mo>/</mo><msub><mi>AlBr</mi><mn>3</mn></msub><mo>,</mo><msub><mi>HNO</mi><mn>3</mn></msub><mo>/</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>SO</mi><mn>4</mn></msub><mo>,</mo><mi>Mg</mi><mo>/</mo></math> ether, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub><mo>,</mo><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msup><mi mathvariant=\"normal\">O</mi><mo>+</mo></msup></math>", "isCorrect": fa
