: "EsQqM", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/BMeSzXDJzjHUVzIelWPqFqLynwbblMC7WBEwr4j-_P0.original.fullsize.png\"><br>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Only those halides give precipitate with $\\mathrm{AgNO}_{3}$ which easily ionises to give halide ion and a stable carbocation. Corresponding carbocation from the four bromides are\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/jvg2dVC8Crk8yWFB1sGLLixdaqsxhX16A4pcemMnuOQ.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d6639f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-16T09:00:00.000Z", "isVisible": true, "shortName": "2018 (16 Apr Online)", "title": "JEE Main 2018 (16 Apr Online)"}], "question": {"text": "<p>The major product of the following reaction is:<br /><br /><img height=\"79\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/675aeb7b-cbe8-42d3-9db4-a34dc747cd6c-image.png\" width=\"355\" /></p>", "image": null}, "options": [{"id": "qhkEE", "text": "<p><img height=\"95\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/386d892f-f49e-431c-87a2-1a7cfd3eddd7-image.png\" width=\"107\" /></p>", "image": null, "isCorrect": false}, {"id": "fMoAu", "text": "<p><img height=\"67\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/14c6816d-8720-4e0d-882e-677723d58a7a-image.png\" width=\"189\" /></p>", "image": null, "isCorrect": true}, {"id": "Xqm2v", "text": "<p><img height=\"100\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f069343e-c266-4026-b7c8-794a704a971b-image.png\" width=\"150\" /></p>", "image": null, "isCorrect": false}, {"id": "3Mikr", "text": "<p><img height=\"95\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/48af9c3f-ea2f-4146-bc84-587fbf3c034b-image.png\" width=\"130\" /></p>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7b84c563-766f-4c6e-bf5d-79d7084b94a0-2741b4ad-f9ef-4136-a20b-ee22c52e91c8-image.png\" style=\"width: 628px; height: 214px;\" /></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-16T09:00:00.000Z", "isVisible": true, "shortName": "2018 (16 Apr Online)", "title": "JEE Main 2018 (16 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d66013", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6488", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2016 (03 Apr)", "title": "JEE Main 2016 (03 Apr)"}], "question": {"text": "The reaction of propene with<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>HOCl</mi></math> <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></mrow></mfenced></math> proceeds through the intermediate:", "image": null}, "options": [{"id": "hcTGM", "text": "<math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>-</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">H</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced><mo>-</mo><mi mathvariant=\"normal\">C</mi><msubsup><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow><mrow><mo>+</mo></mrow></msubsup></math>", "image": null, "isCorrect": false}, {"id": "feKpH", "text": "<math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>-</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi><mo>-</mo><mi mathvariant=\"normal\">C</mi><msubsup><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow><mrow><mo>+</mo></mrow></msubsup></math>", "image": null, "isCorrect": false}, {"id": "Q2nr5", "text": "<math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>-</mo><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mo>+</mo></mrow></msup><mo>-</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></math>", "image": null, "isCorrect": false}, {"id": "Xudm8", "text": "<math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>-</mo><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mo>+</mo></mrow></msup><mo>-</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<blockquote><p>The reaction of propene with hypochlorous acid which is also the mixture of chlorine gas and water is an electrophilic addition reaction. It proceeds through the carbocation intermediate.</p><p>The whole reaction sequence is given below:</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/135070.png\" style=\"width: 192px; height: 180px;\" /></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6488", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2016 (03 Apr)", "title": "JEE Main 2016 (03 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "65c4c158ce8f8861b8f3185f", "title": "Preparation and Reactions of cycloalkanes and cycloalkenes", "totalQuestions": 3, "questions": [{"_id": "69d8075c81239f6567c4f4da", "type": "numerical", "question": {"text": "Consider the isomers of hydrocarbon with molecular formula $C_5H_{10}$. These isomers do not decolourise $KMnO_4$ solution. These isomers are subjected to chlorination with chlorine in presence of light to give monochloro compounds. The total number of monochloro compounds (structural isomers only) formed is _______.", "image": null}, "options": [], "correctValue": "14", "solution": {"text": "The hydrocarbon with molecular formula $C_5H_{10}$ has a degree of unsaturation of $1$. Since its isomers do not decolourise $KMnO_4$ solution, they do not contain any carbon-carbon double bonds. Thus, they must be cycloalkanes.<br><br>The possible structural isomers of cyclic $C_5H_{10}$ and the number of their monochloro structural isomers are as follows:<br><br>1. Cyclopentane:<br>All carbon atoms are equivalent. Chlorination gives $1$ monochloro product (chlorocyclopentane).<br><br>2. Methylcyclobutane:<br>There are $4$ different types of hydrogen atoms (on the methyl group, on $C_1$, on $C_2/C_4$, and on $C_3$). Chlorination gives $4$ monochloro products.<br><br>3. Ethylcyclopropane:<br>There are $4$ different types of hydrogen atoms (on the $CH_3$ of ethyl, on the $CH_2$ of ethyl, on $C_1$ of the ring, and on $C_2/C_3$ of the ring). Chlorination gives $4$ monochloro products.<br><br>4. 1,1-Dimethylcyclopropane:<br>There are $2$ different types of hydrogen atoms (on the two equivalent methyl groups, and on the two equivalent $CH_2$ groups of the ring). Chlorination gives $2$ monochloro products.<br><br>5. 1,2-Dimethylcyclopropane:<br>There are $3$ different types of hydrogen atoms (on the two equivalent methyl groups, on the two equivalent $CH$ groups of the ring, and on the $CH_2$ group of the ring). Chlorination gives $3$ monochloro products.<br><br>Since each of these cycloalkanes has a different carbon skeleton, their monochloro derivatives will all be distinct structural isomers.<br><br>Total number of monochloro compounds (structural isomers only) = $1 + 4 + 4 + 2 + 3 = 14$.<br><br>Answer: $14$", "image": null}, "level": 3, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "bdace417edc146a5b5f47efc2b2613da", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/aDHxAqKtxXgoU.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/aDHxAqKtxXgoU.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd18ba0e94a3c4025a7b", "type": "singleCorrect", "level": 3, "questionLabels": [], "question": {"text": "<p>Major product of the following reaction is:</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/aab70b4c-aa07-4830-b226-819fa6c9538c.png\" style=\"width: 400px; height: 164px;\"/></p>", "image": null}, "options": [{"id": "b2eWY", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/10c99310-0d35-44a0-a79d-8f433631195b.png\" style=\"width: 150px; height: 197px;\"/>", "image": null, "isCorrect": false}, {"id": "plHX9", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e83ff9f3-dd71-4404-a88b-1dd71d59f0b3.png\" style=\"width: 150px; height: 191px;\"/>", "image": null, "isCorrect": false}, {"id": "vnxRg", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5cc9dc4c-38c3-4dec-9be8-b51c4d8a1fd6.png\" style=\"width: 150px; height: 212px;\"/>", "image": null, "isCorrect": true}, {"id": "wWnaP", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6df60ca3-0fd8-4af9-a21d-a896c7ee5868.png\" style=\"width: 170px; height: 233px;\"/>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>During an electrophilic addition reactions double bonds donate lone pair electrons to an electrophile.</p><p>Markovnikov's Rule: The addition of a proton <span style=\"background-color:null;\">acid</span> to the double bond of an alkene results in a product with the acid hydrogen bound to the carbon atom that already has the greater number of hydrogen attached.</p><p>In the given reaction electrophile <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">D</mi><mo>+</mo></msup></math> adds to the double bond, a carbocation is formed. Then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Cl</mi><mo>-</mo></msup></math> is added at the electron deficient carbocation.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/88865b3e-9c8b-4648-bcc8-41fc49554fe5.png\" style=\"width: 767px; height: 207px;\"/></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 2)", "title": "JEE Main 2024 (31 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 2)", "title": "JEE Main 2024 (31 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd18ba0e94a3c4025a7a", "type": "singleCorrect", "level": 2, "questionLabels": [], "question": {"text": "<p>Identify product A and product B</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/801a1c1e-c673-4774-8e31-6fb3f00bacd9.png\" style=\"width: 541px; height: 189px;\"/></p>", "image": null}, "options": [{"id": "0naWJ", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e1b17ea1-b465-457b-8ebf-bec07c8ffb3e.png\" style=\"width: 399px; height: 242px;\"/>", "image": null, "isCorrect": false}, {"id": "v3ba9", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/609b992a-1ab4-4d91-8e64-d552b35a8298.png\" style=\"width: 380px; height: 253px;\"/>", "image": null, "isCorrect": false}, {"id": "kEQtJ", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f1d34b27-9058-47bf-8242-706c768ab54a.png\" style=\"width: 480px; height: 186px;\"/>", "image": null, "isCorrect": false}, {"id": "xZpRS", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/328d5b18-0f4d-4253-a2e9-5c910f049801.png\" style=\"width: 450px; height: 248px;\"/>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The allylic position is a carbon position present adjacent to the carbon-carbon double bonds. The allylic carbon is attached to a carbon atom that forms a double bond with a different carbon atom. A substitution could be a reaction during which a group in an organic molecule is replaced with another group.</p><p>When the halogen concentration is low enough, alkenes containing allylic hydrogen undergo substitution at the allylic position rather than addition at the double bond. The product is an allylic halide (halogen on carbon next to double bond carbons), which is acquired through a radical chain mechanism.</p><p>When cyclohexene reacts with Chlorine in the presence of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CCl</mi><mn>4</mn></msub></math>, the electrophilic addition reaction takes place at double bond, which results in a dichloro product, here it is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>,</mo><mn>2</mn><mo>-</mo></math>dicholorocyclohexane.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0211780e-12b0-4e9b-93c4-7fe4c6bb7ec8.png\" style=\"width: 600px; height: 306px;\"/></p><p>Hence, the correct answer is D.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 9, "topicId": "648b5a74417cc3fb48d693be", "title": "Preparation and Properties of Benzene", "totalQuestions": 4, "questions": [{"_id": "648b5a6f417cc3fb48d6801d", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>Given below are two statements, one is labelled as</p><p><strong>Assertion A</strong> and the other is labelled as&nbsp;<strong>Reason R.</strong></p><p><strong>Assertion A :</strong> Benzene is more stable than hypothetical cyclohexatriene.</p><p><strong>Reason R :</strong> The delocalized <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#960;</mi></math>&nbsp;electron cloud is attracted more strongly by nuclei of carbon atoms.</p><p>In the light of the above statements, choose the correct answer from the options given below:</p>", "image": null}, "options": [{"id": "N4CkK", "text": "A is true but R is false.", "isCorrect": false, "image": null}, {"id": "foIyl", "text": "A is false but R is true.", "isCorrect": false, "image": null}, {"id": "IV73d", "text": "Both A and R are correct and R is the correct explanation of A.", "isCorrect": true, "image": null}, {"id": "kjoCY", "text": "Both A and R are correct but R is NOT the correct explanation of A.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The delocalised <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#960;</mi><mo>-</mo></math>electron cloud is attracted more strongly by the nuclei of the carbon atoms than the electron cloud localised between two carbon atoms. Therefore, presence of delocalised <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#960;</mi><mo>-</mo></math>electrons in benzene makes it more stable than the hypothetical cyclohexatriene.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["ASSERTION_REASON"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67ca3", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Arrange the following in increasing order of reactivity towards nitration</p><p>A. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi></math>-xylene</p><p>B. bromobenzene</p><p>C. mesitylene</p><p>D.&nbsp;nitrobenzene</p><p>E. benzene</p><p>Choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "yl0KL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi><mo>&#60;</mo><mi mathvariant=\"normal\">D</mi><mo>&#60;</mo><mi mathvariant=\"normal\">E</mi><mo>&#60;</mo><mi mathvariant=\"normal\">A</mi><mo>&#60;</mo><mi mathvariant=\"normal\">B</mi></math>", "isCorrect": false, "image": null}, {"id": "e1eoS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi><mo>&#60;</mo><mi mathvariant=\"normal\">B</mi><mo>&#60;</mo><mi mathvariant=\"normal\">E</mi><mo>&#60;</mo><mi mathvariant=\"normal\">A</mi><mo>&#60;</mo><mi mathvariant=\"normal\">C</mi></math>", "isCorrect": true, "image": null}, {"id": "OTdrX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi><mo>&#60;</mo><mi mathvariant=\"normal\">C</mi><mo>&#60;</mo><mi mathvariant=\"normal\">E</mi><mo>&#60;</mo><mi mathvariant=\"normal\">A</mi><mo>&#60;</mo><mi mathvariant=\"normal\">B</mi></math>", "isCorrect": false, "image": null}, {"id": "OVGrl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi><mo>&#60;</mo><mi mathvariant=\"normal\">D</mi><mo>&#60;</mo><mi mathvariant=\"normal\">E</mi><mo>&#60;</mo><mi mathvariant=\"normal\">B</mi><mo>&#60;</mo><mi mathvariant=\"normal\">A</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Nitration is an electrophilic aromatic substitution reaction. The <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mi mathvariant=\"normal\">M</mi></math>&nbsp;effect increases the rate of nitration whereas the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi mathvariant=\"normal\">M</mi></math>&nbsp;effect decreases the rate of nitration.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mo>-</mo><msub><mi>NO</mi><mn>2</mn></msub><mo>(</mo><mo>-</mo><mi mathvariant=\"normal\">M</mi><mo>)</mo><mo>,</mo><mo>&#160;</mo><mo>-</mo><mi>Br</mi><mo>(</mo><mo>+</mo><mi mathvariant=\"normal\">M</mi><mo>&#160;</mo><mi>but</mi><mo>&#160;</mo><mi>dominant</mi><mo>&#160;</mo><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>)</mo><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>(</mo><mo>+</mo><mi mathvariant=\"normal\">H</mi><mo>)</mo></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/416dfc6e-e7a4-4fcc-85d3-22a4ab1c5c88-image.png\" style=\"width: 456px; height: 150px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><msub><mi>NO</mi><mn>2</mn></msub></math> is strongly deactivating</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>Br</mi><mo>&#160;</mo><mo>,</mo><mo>&#160;</mo></math> deactivating</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>,</mo><mo>&#160;</mo></math> activating group</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi><mo>&#60;</mo><mi mathvariant=\"normal\">B</mi><mo>&#60;</mo><mi mathvariant=\"normal\">E</mi><mo>&#60;</mo><mi mathvariant=\"normal\">A</mi><mo>&#60;</mo><mi mathvariant=\"normal\">C</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["SEQUENCE_ORDER"], "syllabusCategory": "noChange", "previousYear": {"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67af2", "previousYearPapers": [{"_id": "63134c746e7bc9b332483705", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 1)", "title": "JEE Main 2022 (27 Jul Shift 1)"}], "type": "numerical", "level": 3, "question": {"text": "<p>In the following reaction</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3ebb1bf7-de11-4892-804a-cf7b0cb861e0-image.png\" style=\"width: 380px; height: 130px;\" />​​​​​​​</p><p>The <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>%</mo></math> yield for reaction <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">I</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>%</mo></math> and that of reaction II is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>%</mo></math>. The overall yield of the complete reaction is<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>%</mo></math></p>", "image": null}, "options": [], "correctValue": "30", "solution": {"text": "<blockquote><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c55c7b42-a9ef-42ca-97a5-480a74967b80-image.png\" style=\"width: 281px; height: 100px;\" /></p><p>Let initial moles of reactant taken <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi mathvariant=\"normal\">n</mi></math><br />Total moles obtained for benzene sulphonic acid (with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>%</mo></math> yield <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>60</mn><mo>%</mo></math>)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">n</mi></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/695204b0-b9cc-4830-a854-2549f143475e-image.png\" style=\"width: 262px; height: 120px;\" /></p><p>Moles of benzene sulphonic acid before reaction <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>II</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>6</mn><mo>&#160;</mo><mi mathvariant=\"normal\">n</mi></math></p><p>Moles obtained for phenol (with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>%</mo></math> yield = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>%</mo></math>)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>3</mn><mo>&#160;</mo><mi mathvariant=\"normal\">n</mi></math></p><p>So over all <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>%</mo></math>&nbsp;yield of complete reaction&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>3</mn><mi mathvariant=\"normal\">n</mi></mrow><mi mathvariant=\"normal\">n</mi></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>30</mn></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483705", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 1)", "title": "JEE Main 2022 (27 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66deb", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7fd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2020 (09 Jan Shift 2)", "title": "JEE Main 2020 (09 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The number of <math><mi mathvariant=\"normal\">s</mi><msup><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mn>2</mn></mrow></msup></math> hybrid orbitals in a molecule of benzene is:", "image": null}, "options": [{"id": "y0zNE", "text": "<math><mn>24</mn></math>", "isCorrect": false, "image": null}, {"id": "XnK15", "text": "<math><mn>6</mn></math>", "isCorrect": false, "image": null}, {"id": "ee9Fn", "text": "<math><mn>18</mn></math>", "isCorrect": true, "image": null}, {"id": "xpQGZ", "text": "<math><mn>12</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In benzene total six <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sp</mi><mn>2</mn></msup></math> hybrid carbon atoms are present .Each carbon atom has <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><msup><mi>sp</mi><mn>2</mn></msup></math> hybrid orbitals. Therefore total <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sp</mi><mn>2</mn></msup></math> hybrid orbitals are 18 in benzene.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7fd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2020 (09 Jan Shift 2)", "title": "JEE Main 2020 (09 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 10, "topicId": "648b5a74417cc3fb48d693c0", "title": "Reactions of Benzene", "totalQuestions": 6, "questions": [{"_id": "68542cb97c09d044e4c1a379", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2025 (3 Apr Shift 1)", "title": "JEE Main 2025 (3 Apr Shift 1)"}], "question": {"text": "Which compound would give 3-methyl-6oxoheptanal upon ozonolysis?", "image": null}, "options": [{"id": "Lhk39", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/iD-rDE4lVnB5OY5A7RuMNKyqOo1CTK7lPuIaSQ-pgC8.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "EX7y3", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/RLI8jwTeARTrwXMqSi1szyiiR-gkUD7Z7GeFwd7WULI.original.fullsize.png\"/><br/>", "image": null, "isCorrect": true}, {"id": "HpxsP", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/G2nevmJ1Yo4lieBOt1nbpHn0S_uJeyOFyVxe__xk7m8.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}, {"id": "SKJXu", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/_WIAscbFHK2KuxjIOG1lM8N2wNU-fFXZkz_BVpoPgnQ.original.fullsize.png\"/><br/>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/Z_tHnygHAa8TD6ZtSBz5TihmaICZFE3vIkNHqA5bUV0.original.fullsize.png\"/><br/>", "image": null}, "videoSolution": {"videoId": "c1b3300298524a95aeb46f47d700a838", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/xrKFDkmmtZvAw.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/xrKFDkmmtZvAw.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6852f2ff9d87935e0d80978d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2025 (3 Apr Shift 1)", "title": "JEE Main 2025 (3 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd18ba0e94a3c4025a7d", "type": "singleCorrect", "level": 3, "questionLabels": [], "question": {"text": "<p>In the given reactions identify the reagent <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and reagent <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math></p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e1b6e7ac-38c9-4817-830a-ed2a35dcf8eb.png\" style=\"width: 600px; height: 179px;\"/>", "image": null}, "options": [{"id": "Ifmvu", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><msub><mi>CrO</mi><mn>3</mn></msub><mo>  </mo><mo> </mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><msub><mi>CrO</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "NZ3Gd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>-</mo><mo> </mo><msub><mi>CrO</mi><mn>3</mn></msub><mo>  </mo><mo> </mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><msub><mi>CrO</mi><mn>2</mn></msub><msub><mi>Cl</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "qnnJd", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><msub><mi>CrO</mi><mn>2</mn></msub><msub><mi>Cl</mi><mn>2</mn></msub><mo>  </mo><mo> </mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><msub><mi>CrO</mi><mn>2</mn></msub><msub><mi>Cl</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "CSY4x", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><msub><mi>CrO</mi><mn>2</mn></msub><msub><mi>Cl</mi><mn>2</mn></msub><mo>  </mo><mo> </mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><msub><mi>CrO</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Toluene or substituted toluene is converted to benzylidene diacetate on treating with chromic oxide in acetic anhydride. The benzylidene diacetate can be hydrolysed to corresponding benzaldehyde with aqueous acid.</p><p>Chromyl chloride oxidises<br/>methyl group to a chromium complex, which on hydrolysis<br/>gives corresponding benzaldehyde. The reaction is known as Etard reaction.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2e946792-c97f-4635-9248-950de9c558f3.png\" style=\"width: 600px; height: 271px;\"/></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb02", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 1)", "title": "JEE Main 2024 (30 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb02", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 1)", "title": "JEE Main 2024 (30 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67db1", "previousYearPapers": [{"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Which among the following pairs of the structures will give different products on ozonolysis? (Consider the double bonds in the structures are rigid and not delocalized.)", "image": null}, "options": [{"id": "Xol8d", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e906fac1-6bcd-4b2d-854c-aeee0cde8e2b-image.png\" style=\"width: 256px; height: 100px;\" />", "isCorrect": false, "image": null}, {"id": "ZNfk3", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/81b86a68-fb30-4e0d-a356-74a2669291e7-image.png\" style=\"width: 188px; height: 120px;\" /></p>", "isCorrect": false, "image": null}, {"id": "J2f1F", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/99e0b3bd-22cc-425d-b8ba-3d538d7ed31d-image.png\" style=\"width: 278px; height: 100px;\" /></p>", "isCorrect": true, "image": null}, {"id": "JORK5", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/868e1e10-2043-4882-9f83-7652cf45b8de-image.png\" style=\"width: 232px; height: 100px;\" /></p>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Ozone is a very reactive allotrope of oxygen. The reaction of ozone with alkenes and alkynes causes the oxidative cleaving of the alkene or alkyne. The carbon-carbon double bonds are replaced with carbon-oxygen double bonds, giving the required carbonyl product as shown below.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e77ae704-4bcf-420c-a398-3f57ef5a9af5-6a3d76ae-7a7f-46e0-a6de-46c9c658d93c-image.png\" style=\"width: 420px; height: 217px;\" /></p><p>In all other options both compounds will give the same product on ozonolysis.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d6775d", "previousYearPapers": [{"_id": "62c481f001514d218a7934d1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T09:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 1)", "title": "JEE Main 2022 (24 Jun Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>In the given reaction sequence, the major product &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>&#39;&nbsp;is :</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>8</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>10</mn></msub><munder><mover><mo>&#10230;</mo><msub><mi>HNO</mi><mn>3</mn></msub></mover><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>SO</mi><mn>4</mn></msub></mrow></munder><mi mathvariant=\"normal\">A</mi><munder><mover><mo>&#10230;</mo><msub><mi>Br</mi><mn>2</mn></msub></mover><mi mathvariant=\"normal\">&#916;</mi></munder><mi mathvariant=\"normal\">B</mi><munder><mover><mo>&#10230;</mo><mi>alcoholic</mi></mover><mi>KOH</mi></munder><mi mathvariant=\"normal\">C</mi></math></p>", "image": null}, "options": [{"id": "K3UbC", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e468a28c-c558-43d9-b609-484022552a77-image.png\" style=\"width: 180px; height: 98px;\" /></p>", "isCorrect": false, "image": null}, {"id": "9JGUT", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a4d84947-878e-47df-8840-6b38c4249aac-image.png\" style=\"width: 240px; height: 77px;\" /></p>", "isCorrect": true, "image": null}, {"id": "NWbOA", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f15edc4f-4b78-4250-84aa-a692f64019d6-image.png\" style=\"width: 230px; height: 89px;\" /></p>", "isCorrect": false, "image": null}, {"id": "pVp9b", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/9d1e60de-d982-4070-8e27-1ec7a786bf6b-image.png\" style=\"width: 180px; height: 97px;\" /></p>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a768107f-9694-4157-bc21-63b89b832828-6c52b7a3-7a46-4f6a-818f-b96b15fde1ef-image.png\" style=\"width: 553px; height: 148px;\" /></p><p>In first step nitration of benzene ring will take place at para position, since ethyl group is ortho-para directing in nature.&nbsp;</p><p>Then halogenation&nbsp;reaction will take place at benzyl position followed by dehydrohalogenation&nbsp;reaction with alcoholic KOH.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T09:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 1)", "title": "JEE Main 2022 (24 Jun Shift 1)"}, "evalStatus": "incorrect", "lastPracticed": "2024-12-14T07:55:09.301Z"}, {"_id": "648b5a6c417cc3fb48d67700", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf820", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T14:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 2)", "title": "JEE Main 2021 (31 Aug Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "For the following sequence of reactions, the correct products are :<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7b0caa70-e4fa-4acc-bb04-c44f9093cdd1-image.png\" style=\"width: 399px; height: 117px;\" />", "image": null}, "options": [{"id": "FbqDQ", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a53d125d-55cc-475c-93fc-6306396432f9-image.png\" style=\"width: 332px; height: 136px;\" />", "isCorrect": false, "image": null}, {"id": "Srndj", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f03cdcbf-04e4-47ac-a207-5a7f569d0e3e-image.png\" style=\"width: 342px; height: 144px;\" />", "isCorrect": false, "image": null}, {"id": "L4eWc", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ae6945cb-0a96-42a6-a97a-3c420c8c465b-image.png\" style=\"width: 328px; height: 123px;\" />", "isCorrect": false, "image": null}, {"id": "KsZwP", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2aa7c423-a2a6-4e68-8228-228ca1106d3c-image.png\" style=\"width: 334px; height: 135px;\" />", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>In first step, bromination takes place which reacts with magnesium metal to form Grignard&#39;s reagent. This reagent generates very strong base which abstracts acidic hydrogen from methanol to produce benzene.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3121ac4d-db1f-4afb-bb9f-a76c0062b411-qnwnn.png\" style=\"width: 808px; height: 153px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf820", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T14:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 2)", "title": "JEE Main 2021 (31 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d676fc", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf820", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T14:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 2)", "title": "JEE Main 2021 (31 Aug Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Identify correct <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> in the reaction sequence given below :<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e31a2559-d584-4309-9599-5de45901dd0b-image.png\" style=\"width: 543px; height: 127px;\" />", "image": null}, "options": [{"id": "S4zXC", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/15d77764-665d-4d04-9f7d-c7380494f8c4-image.png\" style=\"width: 588px; height: 137px;\" />", "isCorrect": false, "image": null}, {"id": "phDkw", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b8d3ca83-ef6d-46a5-9d10-94c8c87d0888-image.png\" style=\"width: 699px; height: 109px;\" />", "isCorrect": false, "image": null}, {"id": "yEHx5", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/93058673-cb40-4e3d-9bf4-17034caa20b6-image.png\" style=\"width: 603px; height: 137px;\" />", "isCorrect": false, "image": null}, {"id": "LLZby", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/efcf139e-b2e3-4fd5-a2bc-e6104aa6f0fd-image.png\" style=\"width: 711px; height: 104px;\" />", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>In first step nitration occurs by mixture of concentrated nitric acid and concentrated sulphuric acid. From this step nitrobenzene (A) is produced.</p><p>In next step chlorination of nitrobenzene occurs, nitro group is meta directing which orients the incoming electrophile at meta position which results in formation of compound (B).</p><p>In last step, reduction occurs and nitro group is converted into amino group and produces compound (C).</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ff05fc6c-a183-42e6-9083-816b118a6ea4-04374754-4d47-4f50-b1f0-e539aa4d2cd6-image.png\" style=\"width: 943px; height: 124px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf820", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-31T14:00:00.000Z", "isVisible": true, "shortName": "2021 (31 Aug Shift 2)", "title": "JEE Main 2021 (31 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 11, "topicId": "648b5a73417cc3fb48d693b9", "title": "Reactions of aromatic compounds", "totalQuestions": 66, "questions": [{"_id": "69d8073581239f6567c4f311", "type": "singleCorrect", "question": {"text": "For the following Friedel Craft's alkylation reaction, which of the statements are correct?<br><img style=\"width: 400px\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/05APRS1__q65_d1.png\" /><br>A. Major product is n-propyl benzene.<br>B. iso-propyl carbocation intermediate is also generated.<br>C. Multiple substitution is inevitable.<br>D. Introducing electron-donating substituent on benzene will not produce any alkyl benzene.<br>Choose the correct answer from the options given below:", "image": null}, "options": [{"id": "OKukJ", "text": "A and D only", "isCorrect": false, "image": null}, {"id": "1ytZO", "text": "B and C only", "isCorrect": true, "image": null}, {"id": "F4xfS", "text": "A and C only", "isCorrect": false, "image": null}, {"id": "7rWJq", "text": "B and D only", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "In the given Friedel-Crafts alkylation reaction, $1$-chloropropane reacts with anhydrous $\\text{AlCl}_3$ to initially form a primary carbocation, the $n$-propyl carbocation ($\\text{CH}_3-\\text{CH}_2-\\text{CH}_2^+$).<br><br>This primary carbocation is less stable and undergoes a $1,2$-hydride shift to form a more stable secondary carbocation, the iso-propyl carbocation ($\\text{CH}_3-\\text{CH}^+-\\text{CH}_3$). Therefore, statement B is correct.<br><br>The iso-propyl carbocation then acts as an electrophile and attacks the benzene ring, yielding iso-propylbenzene (cumene) as the major product. Thus, statement A is incorrect.<br><br>Once an alkyl group is introduced to the benzene ring, it acts as an electron-donating group (via hyperconjugation and inductive effect), which activates the ring. This makes the newly formed alkylbenzene more reactive towards electrophilic aromatic substitution than the original benzene molecule, leading to polyalkylation. Hence, multiple substitution is a common and inevitable drawback. Therefore, statement C is correct.<br><br>Introducing an electron-donating substituent on benzene generally activates the ring and facilitates Friedel-Crafts alkylation (except for strong Lewis bases like $-\\text{NH}_2$ which complex with $\\text{AlCl}_3$). Thus, statement D is incorrect.<br><br>Therefore, only statements B and C are correct.<br><br>Answer: B and C only", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "aed6570180544585a270f562aea575c7", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/LdVdHgHZTHu2S.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/LdVdHgHZTHu2S.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["MULTI_STATEMENT"], "syllabusCategory": "noChange", "previousYear": {"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8075681239f6567c4f48f", "type": "numerical", "question": {"text": "Consider the following sequence of reactions to give the major product $(X)$<br><img style=\"width:400px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/04APRS1__q72_d1.png\" /><br>$P$ g of the major product $(X)$ formed is reacted with $NaHCO_3$ solution to liberate a gas which occupied $11.2$ dm$^3$ at STP. $P = $ _____ g. (Given molar mass in g mol$^{-1}$ H:$1$, C:$12$, O:$16$, Cl:$35.5$)", "image": null}, "options": [], "correctValue": "78.25", "solution": {"text": "Step 1: The first reaction is a Friedel-Crafts alkylation. Benzene reacts with $CH_3Cl$ in the presence of anhydrous $AlCl_3$ to form toluene.<br><br>Step 2: The second reaction is electrophilic aromatic substitution. Toluene reacts with $Cl_2$ in the presence of $FeCl_3$ to form a mixture of o-chlorotoluene and p-chlorotoluene. Due to steric hindrance at the ortho position, the major product is p-chlorotoluene.<br><br>Step 3: The third reaction is the oxidation of the alkyl side chain. p-chlorotoluene is oxidized by $K_2Cr_2O_7 / H_2SO_4$ to form p-chlorobenzoic acid, which is the major product $(X)$.<br><br>The molecular formula of p-chlorobenzoic acid is $C_7H_5ClO_2$.<br>Molar mass of $(X) = (7 \\times 12) + (5 \\times 1) + 35.5 + (2 \\times 16) = 84 + 5 + 35.5 + 32 = 156.5 \\text{ g mol}^{-1}$.<br><br>Step 4: Reaction of p-chlorobenzoic acid with $NaHCO_3$ liberates $CO_2$ gas:<br>$C_6H_4ClCOOH + NaHCO_3 \\rightarrow C_6H_4ClCOONa + H_2O + CO_2 \\uparrow$<br><br>From the stoichiometry, $1$ mole of p-chlorobenzoic acid produces $1$ mole of $CO_2$ gas.<br>Volume of $CO_2$ liberated at STP = $11.2 \\text{ dm}^3$.<br>Moles of $CO_2$ liberated = $\\dfrac{11.2}{22.4} = 0.5 \\text{ mol}$.<br><br>Therefore, moles of p-chlorobenzoic acid reacted = $0.5 \\text{ mol}$.<br>Mass of $(X)$ reacted, $P = 0.5 \\text{ mol} \\times 156.5 \\text{ g mol}^{-1} = 78.25 \\text{ g}$.<br><br>Answer: $78.25$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd5", "title": "JEE Main 2026 (04 April Shift 1)", "shortName": "2026 (04 April Shift 1)", "isVisible": true, "heldOn": "2026-04-04T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "35094c03e8d7481b9ec1fafbaaca5bf8", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/EOhSp8oRLz9UJ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/EOhSp8oRLz9UJ.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd5", "title": "JEE Main 2026 (04 April Shift 1)", "shortName": "2026 (04 April Shift 1)", "isVisible": true, "heldOn": "2026-04-04T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8072f81239f6567c4f2c9", "type": "singleCorrect", "question": {"text": "Identify compounds A and E in the following reaction sequence.<br><img style=\"width:700px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/02APRS2__q68_d1.png\" />", "image": null}, "options": [{"id": "tLQ7A", "text": "<img style=\"width:250px;\"  src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/02APRS2__q68_d2.png\" />", "isCorrect": false, "image": null}, {"id": "v9TCP", "text": "<img style=\"width:250px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/02APRS2__q68_d3.png\" />", "isCorrect": true, "image": null}, {"id": "nUrbX", "text": "<img style=\"width:250px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/02APRS2__q68_d4.png\" />", "isCorrect": false, "image": null}, {"id": "rrAKS", "text": "<img style=\"width:250px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/02APRS2__q68_d5.png\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The starting compound is 1-ethyl-4-nitrobenzene.<br><br>Reaction with $\\text{Br}_2/\\text{AlBr}_3$ is an electrophilic aromatic substitution. The $-\\text{C}_2\\text{H}_5$ group is activating and ortho/para-directing, while the $-\\text{NO}_2$ group is deactivating and meta-directing. Both groups direct the incoming electrophile ($\\text{Br}^+$) to the position ortho to the $-\\text{C}_2\\text{H}_5$ group. Thus, compound A is 2-bromo-1-ethyl-4-nitrobenzene.<br><br>Reaction with $\\text{Sn}/\\text{HCl}$ reduces the $-\\text{NO}_2$ group to an $-\\text{NH}_2$ group, forming compound B (4-amino-2-bromo-1-ethylbenzene).<br><br>Reaction with $\\text{NaNO}_2/\\text{HCl}$ at $273-278\\text{ K}$ converts the $-\\text{NH}_2$ group into a diazonium salt, forming compound C (3-bromo-4-ethylbenzenediazonium chloride).<br><br>Reaction with ethanol ($\\text{C}_2\\text{H}_5\\text{OH}$) reduces the diazonium group, replacing it with a hydrogen atom. This forms compound D (1-bromo-2-ethylbenzene).<br><br>Reaction with alkaline $\\text{KMnO}_4$ followed by acidic hydrolysis oxidizes the ethyl side chain ($-\\text{C}_2\\text{H}_5$) to a carboxylic acid group ($-\\text{COOH}$). The bromine atom remains unaffected. This forms compound E (2-bromobenzoic acid).<br><br>Answer: <img style=\"width:300px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/02APRS2__q68_d3.png\" />", "image": null}, "level": 3, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "6c66ee92161d442dbe8b5e27206b460a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/OXa7GCYJfrlWy.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/OXa7GCYJfrlWy.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8075c81239f6567c4f4d4", "type": "singleCorrect", "question": {"text": "For the given molecule, \"$x$\", the preferred site for the attack of the electrophile is :<br><img style=\"width:350px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/02APRS1__q66_d1.png\" />", "image": null}, "options": [{"id": "d7URA", "text": "Predominantly at \"r\"", "isCorrect": false, "image": null}, {"id": "DEq7a", "text": "\"r\" and \"u\"", "isCorrect": false, "image": null}, {"id": "YkfW8", "text": "\"p\" and \"s\"", "isCorrect": false, "image": null}, {"id": "MTjiw", "text": "Predominantly at \"u\"", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given molecule, benzanilide, contains two phenyl rings with different reactivities towards electrophilic aromatic substitution.<br><br>The left phenyl ring is attached to the carbonyl carbon of the amide group ($-C(=O)NHPh$). The carbonyl group is electron-withdrawing due to its $-M$ and $-I$ effects, which deactivates this ring towards electrophilic attack.<br><br>The right phenyl ring is attached to the nitrogen atom of the amide group ($-NHC(=O)Ph$). The nitrogen atom possesses a lone pair of electrons that can delocalize into the ring via resonance ($+M$ effect). This electron donation activates the right ring, making it significantly more reactive than the left ring.<br><br>The $-NHC(=O)Ph$ group is an ortho/para directing group. The possible sites for electrophilic attack on the activated ring are the ortho position ('s') and the para position ('u').<br><br>Due to the large steric bulk of the $-NHC(=O)Ph$ group, the ortho position ('s') experiences significant steric hindrance. Therefore, the electrophile will preferentially attack the less hindered para position.<br><br>Thus, the preferred site for the attack of the electrophile is predominantly at 'u'.<br><br>Answer: Predominantly at \"u\"", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "888bc6c283f9432db90b057e29af78a6", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/0x3zEAWdsPaGm.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/0x3zEAWdsPaGm.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1b38bfdbb243563980d", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Identify the correct statements : The presence of $-\\mathrm{NO}_{2}$ group in benzene ring <br> A. activates the ring towards electrophilic substitutions. <br> B. deactivates the ring towards electrophilic substitutions. <br> C. activates the ring towards nucleophilic substitutions. <br> D. deactivates the ring towards nucleophilic substitutions. <br> Choose the correct answer from the options given below :", "image": null}, "options": [{"id": "ZGXCF", "text": "C and A Only", "isCorrect": false, "image": null}, {"id": "W60Nl", "text": "B and C Only", "isCorrect": true, "image": null}, {"id": "K9xR0", "text": "A and D Only", "isCorrect": false, "image": null}, {"id": "ceVxC", "text": "B and D Only", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Presence of $NO_2$ group in Benzene ring deactivate ring towards electrophilic substitution reaction due to $-M$ effective & activate ring towards nucleophilic substitution.<br>So, B & C are correct.", "image": null}, "videoSolution": {"videoId": "3636071bb4dd4e4e98b3927aeb0849aa", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/5PTgCpgnjZDjt.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/5PTgCpgnjZDjt.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["MULTI_STATEMENT"], "syllabusCategory": "noChange", "previousYear": {"_id": "6983c0cb2f90f45c755e5f4a", "title": "JEE Main 2026 (28 January Shift 2)", "shortName": "2026 (28 January Shift 2)", "isVisible": true, "heldOn": "2026-01-28T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1ad8bfdbb24356397c0", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Method used for separation of mixture of products (B and C) obtained in the following reaction is <br> <img style=\"width:400px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/28S1_q_57_1.png\">", "image": null}, "options": [{"id": "VrIGV", "text": "steam distillation", "isCorrect": false, "image": null}, {"id": "8rsoF", "text": "simple distillation", "isCorrect": false, "image": null}, {"id": "n8cP1", "text": "sublimation", "isCorrect": false, "image": null}, {"id": "fZoSH", "text": "fractional distillation", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Benzene reacts with $\\text{Br}_2$ in the presence of $\\text{FeBr}_3$ (Friedel-Crafts halogenation) to give bromobenzene.<br><br>Bromobenzene on nitration with $\\text{HNO}_3 / \\text{H}_2\\text{SO}_4$ gives a mixture of ortho-bromonitrobenzene and para-bromonitrobenzene (since $-\\text{Br}$ is an ortho/para director).<br><br>The two products (B and C) are separated by fractional distillation method due to their different boiling points.", "image": null}, "videoSolution": {"videoId": "1ac43cbb0bff430381f09b11a56a4dd0", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/8z3Y52Gl7nxYe.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/8z3Y52Gl7nxYe.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c19d8bfdbb24356396ed", "type": "numerical", "level": 3, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Consider the following reaction of benzene. <br> <img style=\"width:500px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/23S2_q_71_1_v2.png\"> <br> In compound (Q), the percentage of oxygen is $\\_\\_\\_\\_$ %. (Nearest integer)", "image": null}, "options": [], "correctValue": 10, "solution": {"text": "Benzene reacts with $\\text{CH}_3\\text{-CO-CH}_2\\text{-CH}_2\\text{-CO-Cl}$ in the presence of anhydrous $\\text{AlCl}_3$ (Friedel-Crafts acylation) to give product P (a keto-ketone).<br>P on treatment with aq. NaOH and heating undergoes intramolecular aldol condensation to give a cyclic enone Q.<br>Molecular mass of Q $= 157$<br>Percentage of oxygen in Q $= \\frac{16}{157} \\times 100 = 10.19\\% \\approx 10\\%$", "image": null}, "videoSolution": {"videoId": "62592e96255a44fc93a8f5a19b6c145d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/vlh7y7Nukuf23.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/vlh7y7Nukuf23.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1958bfdbb2435639694", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f45", "title": "JEE Main 2026 (23 January Shift 1)", "shortName": "2026 (23 January Shift 1)", "isVisible": true, "heldOn": "2026-01-23T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Consider the following compounds <br> <img style=\"width:300px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/23S1_q_57_1.png\"> <br> Arrange these compounds in the increasing order of reactivity with nitrating mixture.", "image": null}, "options": [{"id": "8606544815", "text": "$\\mathrm{c}<\\mathrm{a}<\\mathrm{b}$", "isCorrect": false, "image": null}, {"id": "8606544816", "text": "$\\mathrm{b}<\\mathrm{a}<\\mathrm{c}$", "isCorrect": true, "image": null}, {"id": "8606544813", "text": "$\\mathrm{c}<\\mathrm{b}<\\mathrm{a}$", "isCorrect": false, "image": null}, {"id": "8606544814", "text": "$\\mathrm{b}<\\mathrm{c}<\\mathrm{a}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Electrophilic aromatic nitration reactivity depends on the electronic effects of substituents.<br>Compound a (chlorobenzene) has a weakly deactivating chlorine group.<br>Compound b (nitrobenzene) has a strongly electron-withdrawing nitro group, making it significantly deactivated.<br>Compound c (anisole) has an electron-donating methoxy group, making it highly activated.<br>In order of increasing reactivity with nitrating mixture: nitrobenzene (b) is least reactive due to strong deactivation, chlorobenzene (a) is moderately reactive, and anisole (c) is most reactive due to activation.<br>The increasing order is b < a < c.", "image": null}, "videoSolution": {"videoId": "bd53a051082743daade890507b0f57e1", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/DYXE6yyWMWXN9.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/DYXE6yyWMWXN9.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["SEQUENCE_ORDER"], "syllabusCategory": "noChange", "previousYear": {"_id": "6983c0cb2f90f45c755e5f45", "title": "JEE Main 2026 (23 January Shift 1)", "shortName": "2026 (23 January Shift 1)", "isVisible": true, "heldOn": "2026-01-23T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1898bfdbb24356395fc", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f43", "title": "JEE Main 2026 (22 January Shift 1)", "shortName": "2026 (22 January Shift 1)", "isVisible": true, "heldOn": "2026-01-22T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Given below are two statements: <br> <b>Statement I</b>: Benzene is nitrated to give nitrobenzene, which on further treatment with $\\mathrm{CH}_{3} \\mathrm{COCl} / \\mathrm{AlCl}_{3}$ will give <br> <img style=\"width:150px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/22S1_q_54_1.png\"> <br> <b>Statement II</b>: $-\\mathrm{NO}_{2}$ group is a $m$-directing, and deactivating group. <br> In the light of the above statements, choose the most appropriate answer from the options given below", "image": null}, "options": [{"id": "ucHY0", "text": "Statement I is incorrect but Statement II is correct", "isCorrect": true, "image": null}, {"id": "JoxKt", "text": "Both Statement I and Statement II are incorrect", "isCorrect": false, "image": null}, {"id": "yEqKn", "text": "Both Statement I and Statement II are correct", "isCorrect": false, "image": null}, {"id": "RY32Y", "text": "Statement I is correct but Statement II is incorrect", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Statement I: Benzene reacts with nitrating mixture ($conc. HNO_3 + conc. H_2SO_4$) to form nitrobenzene. However, nitrobenzene is highly deactivated due to the strong electron-withdrawing $-I$ and $-M$ effects of the $-NO_2$ group. Friedel-Crafts reactions (alkylation or acylation) do not occur on strongly deactivated rings like nitrobenzene. Thus, nitrobenzene will not react with $CH_3COCl/AlCl_3$ to give m-nitroacetophenone. Statement I is incorrect.<br><br>Statement II: The $-NO_2$ group is a meta-directing group because it withdraws electron density from the ortho and para positions more than from the meta position. It is also a deactivating group as it reduces the overall electron density of the benzene ring, making it less reactive towards electrophilic aromatic substitution. Statement II is correct.<br><br>Therefore, Statement I is incorrect but Statement II is correct.", "image": null}, "videoSolution": {"videoId": "39cd9feb2b1148afa437cfe12e79e31f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/GgdRWo793DYjx.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/GgdRWo793DYjx.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "6983c0cb2f90f45c755e5f43", "title": "JEE Main 2026 (22 January Shift 1)", "shortName": "2026 (22 January Shift 1)", "isVisible": true, "heldOn": "
