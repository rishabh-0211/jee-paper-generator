417cc3fb48d65f53", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}], "question": {"text": "A compound <strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math></strong> with molecular formula <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>10</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>13</mn></mrow></msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi></math>, gives a white precipitate on adding silver nitrate solution. <strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math></strong> on reacting with alcoholic <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>KOH</mi></math> gives compound <strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math></strong> as the main product. <strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math></strong> on ozonolysis, gives <strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> </strong>and <strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi></math></strong>. <strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math></strong> gives Cannizaro reaction, but not aldol condensation. <strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">D</mi></math></strong> gives aldol condensation, but not Cannizaro reaction. <strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math></strong> is", "image": null}, "options": [{"id": "QTsJY", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6f9cef44-a35f-4462-a2cc-5108d0fbd2cf-image.png\" style=\"width: 350px; height: 90px;\" />", "image": null, "isCorrect": false}, {"id": "PnxEs", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d7884beb-53e3-4ae9-af3a-6ed3d36949cc-image.png\" style=\"width: 200px; height: 83px;\" />", "image": null, "isCorrect": true}, {"id": "ytYAk", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d14b2ccf-cb73-43c6-b7d1-be25ed36d495-image.png\" style=\"width: 350px; height: 33px;\" />", "image": null, "isCorrect": false}, {"id": "xtENU", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/74f6415d-3f26-4fc1-91cf-accf9def417b-image.png\" style=\"width: 180px; height: 105px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Chlorine attached to tertiary carbon will give&nbsp;alkene (Saytzeff Rule).</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ad5ab65b-0657-4def-a512-db20f31cb9a7-60ed0772-ca24-4947-926c-dc52a2e7f0a7-image.png\" style=\"width: 500px; height: 229px;\" /></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65e54", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}], "question": {"text": "In the presence of peroxide, $\\mathrm{HCl}$ and $\\mathrm{HI}$ do not give anti-Markownikoff's addition of alkenes because:", "image": null}, "options": [{"id": "HKuAT", "text": "\nOne of the steps is endothermic in $\\mathrm{HCl}$ and $\\mathrm{HI}$\n", "image": null, "isCorrect": true}, {"id": "V5UVh", "text": "\nBoth $\\mathrm{HCl}$ and $\\mathrm{HI}$ are strong acids\n", "image": null, "isCorrect": false}, {"id": "7V5sB", "text": "\n$\\mathrm{HCl}$ is oxidizing and the $\\mathrm{HI}$ is reducing\n", "image": null, "isCorrect": false}, {"id": "dmtXW", "text": "\nAll the steps are exothermic is $\\mathrm{HCl}$ and $\\mathrm{HI}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Anti-Markownikoff addition is possible only in case of $\\mathrm{HBr}$ and not in $\\mathrm{HCl}$ and $\\mathrm{HI}$. In $\\mathrm{HBr}$ both the chain initiation and propagation steps are exothermic, while in $\\mathrm{HCl}$, first step is exothermic, and second step is endothermic and in HI, no step is exothermic. Hence $\\mathrm{HCl}$ and $\\mathrm{HI}$ do not undergo anti-Markownikoff's addition.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65e51", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}], "question": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/8DsvACR5WsEnShWPecrNZ9CCcZpo5Pe_Z9t2wbCpae4.original.fullsize.png\"><br>\non mercuration-demercuration produces the major product:", "image": null}, "options": [{"id": "qojZw", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/aozm_O6UvGkOjaLnTBdcvHVDdj5reVZXRANFHkQl75g.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "6VLdJ", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/dEAcUA_bWi_nWVNOlJlLrAUVNR-dG63On8DjQLrDWXs.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "a1aGs", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/_-jl5HFr4gUgYvfUK8fTPKGHvJLaDm1U1umq6ND00YM.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "w8MJA", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/JiDpHC_O8yqrCvHIIlgtCIGuEl7d87HbjLdv46-fTJs.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/rXjNhFEyXOiYoKEJOtZ9Gp8RkiMUepMb4j2VW0EZZCc.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2014 (12 Apr Online)", "title": "JEE Main 2014 (12 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65bca", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}], "question": {"text": "The addition of $\\mathrm{HI}$ in the presence of peroxide catalyst does not follow anti-Markovnikov's rule because :", "image": null}, "options": [{"id": "o7YJV", "text": "\n$\\mathrm{HI}$ is a strong reducing agent.\n", "image": null, "isCorrect": false}, {"id": "v6PVN", "text": "\n$\\mathrm{H-I}$ bond is too strong to be broken homolytically.\n", "image": null, "isCorrect": false}, {"id": "iR6wS", "text": "\n$\\mathrm{I}$ atom combines with $\\mathrm{H}$ atom to give back $\\mathrm{HI}$.\n", "image": null, "isCorrect": false}, {"id": "2jnil", "text": "\nIodine atom is not reactive enough to add across a double bond.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{HI}$ does not exhibit peroxide effect. $\\mathrm{HI}$ bond although dissociates easily into iodine radicals, they being bigger in size are not much reactive but recombine together to form iodine molecule.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65ac4", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}], "question": {"text": "Consider the following sequence of reactions\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/E2t_U_3QAr4zYV-QP-_SMmYjV3Ug6ZoMj64lZncMx68.original.fullsize.png\"><br>\nCompound ' $C$ ' is", "image": null}, "options": [{"id": "4WVnj", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5yR13DLgu-a5hHiPR2oLsmy_Awz0MOGsVz1R32mAGEc.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "wdrw8", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/HK7ka0EYK0VbzAxFFGM0ZtaRvVBtblQkE_Mhgiunt18.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "Fs8az", "text": "\n$\\mathrm{HOCH}_2-\\mathrm{CH}=\\mathrm{CH}_2$\n", "image": null, "isCorrect": false}, {"id": "5aTFK", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7Pr1kg3JVoGoaI0ga7NmU4sYkLkm4AAzgm7zspJnMAM.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/R1SOnyn_W5qcQe5XSVB9BZU9RQHQNvuV8H5ffezICeE.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65967", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}], "question": {"text": "Ozonolysis of an organic compound gives formaldehyde as one of the products. This confirms the presence of :", "image": null}, "options": [{"id": "QMLmn", "text": "\na vinyl group\n", "image": null, "isCorrect": true}, {"id": "PNa1j", "text": "\nan isopropyl group\n", "image": null, "isCorrect": false}, {"id": "vQclJ", "text": "\nan acetylenic triple bond\n", "image": null, "isCorrect": false}, {"id": "zMVHd", "text": "\ntwo ethylenic double bonds", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Vinyl group\n$$\n\\left(\\mathrm{CH}_2=\\mathrm{CH}-\\right)\n$$\non ozonolysis give formaldehyde", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6583e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}], "question": {"text": "In the following sequence of reactions, the alkene affords the compound ' $B$ ' $\\mathrm{CH}_3 \\mathrm{CH}=\\mathrm{CHCH}_3 \\stackrel{\\mathrm{O}_3}{\\longrightarrow} \\mathrm{A} \\stackrel{\\mathrm{H}_2 \\mathrm{O}}{\\mathrm{Zn}} \\mathrm{B}$.\nThe compound $\\mathrm{B}$ is", "image": null}, "options": [{"id": "E4BGP", "text": "\n$\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{CHO}$\n", "image": null, "isCorrect": false}, {"id": "9OPv8", "text": "\n$\\mathrm{CH}_3 \\mathrm{COCH}_3$\n", "image": null, "isCorrect": false}, {"id": "dsVsY", "text": "\n$\\mathrm{CH}_3 \\mathrm{CH}_2 \\mathrm{COCH}_3$\n", "image": null, "isCorrect": false}, {"id": "1sXgh", "text": "\n$\\mathrm{CH}_3 \\mathrm{CHO}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/QcH05vgydliCY9e81BFRqYcLeIGRTaHT3apJFmWcYzQ.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "648b5a74417cc3fb48d693bf", "title": "Properties and Preparation of Alkynes", "totalQuestions": 2, "questions": [{"_id": "6983c1968bfdbb2435639697", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f45", "title": "JEE Main 2026 (23 January Shift 1)", "shortName": "2026 (23 January Shift 1)", "isVisible": true, "heldOn": "2026-01-23T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "But-2-yne and hydrogen (one mole each) are separately treated with (i) $\\mathrm{Pd} / \\mathrm{C}$ and (ii) $\\mathrm{Na} / \\mathrm{liq}. \\mathrm{NH}_{3}$ to give the products X and Y respectively. <br> <img style=\"width:300px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/23S1_q_60_1.png\"> <br> Identify the incorrect statements. <br> A. $X$ and $Y$ are stereoisomers. <br> B. Dipole moment of X is zero. <br> C. Boiling point of $X$ is higher than $Y$. <br> D. X and Y react with $\\mathrm{O}_{3} / \\mathrm{Zn}+\\mathrm{H}_{2} \\mathrm{O}$ to give different products. <br> Choose the correct answer from the options given below :", "image": null}, "options": [{"id": "8606544818", "text": "B and D Only", "isCorrect": true, "image": null}, {"id": "8606544817", "text": "A and C Only", "isCorrect": false, "image": null}, {"id": "8606544820", "text": "A and B Only", "isCorrect": false, "image": null}, {"id": "8606544819", "text": "B and C Only", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "But-2-yne ($CH_3-C\\equiv C-CH_3$) undergoes partial hydrogenation.<br>Reaction with $Pd/C$ (Lindlar-like conditions for 1 mole $H_2$) gives cis-but-2-ene as product $X$.<br>Reaction with $Na/liq. NH_3$ (Birch reduction) gives trans-but-2-ene as product $Y$.<br>Statement A: $X$ (cis) and $Y$ (trans) are geometrical isomers, hence stereoisomers. This is correct.<br>Statement B: Cis-but-2-ene ($X$) has a non-zero dipole moment ($\\mu \\neq 0$) due to the additive nature of bond moments, while trans-but-2-ene ($Y$) has zero dipole moment ($\\mu = 0$) due to symmetry. Thus, statement B is incorrect.<br>Statement C: Cis-isomers generally have higher boiling points than trans-isomers due to higher dipole-dipole interactions. So, B.P. of $X > Y$. This is correct.<br>Statement D: Reductive ozonolysis ($O_3/Zn, H_2O$) of both cis-but-2-ene and trans-but-2-ene yields the same product, ethanal ($CH_3CHO$). Thus, statement D is incorrect.<br>The incorrect statements are B and D.", "image": null}, "videoSolution": {"videoId": "f63f82c74ee44d86834e540ce81c2064", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/M7HojojnNqAVK.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/M7HojojnNqAVK.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["MULTI_STATEMENT"], "syllabusCategory": "noChange", "previousYear": {"_id": "6983c0cb2f90f45c755e5f45", "title": "JEE Main 2026 (23 January Shift 1)", "shortName": "2026 (23 January Shift 1)", "isVisible": true, "heldOn": "2026-01-23T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d6732d", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf817", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Jul Shift 1)", "title": "JEE Main 2021 (25 Jul Shift 1)"}], "type": "numerical", "level": 1, "question": {"text": "The number of sigma bonds in&nbsp;<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ed0e182c-f954-458d-a1b0-1e457d69c87a-92c32ae2-ce9b-438a-9db0-2c7454d93150-image.png\" style=\"width: 261px; height: 79px;\" />&nbsp;is _______.", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/beeca9ad-4330-452c-b706-c977bc315f2a-image.png\" style=\"width: 227px; height: 103px;\" /></p><p>Numbers of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#963;</mi></math> bonds <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>10</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf817", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Jul Shift 1)", "title": "JEE Main 2021 (25 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "648b5a73417cc3fb48d693bb", "title": "Reactions of alkynes", "totalQuestions": 21, "questions": [{"_id": "69d8074281239f6567c4f3a7", "type": "singleCorrect", "question": {"text": "An optically active alkyl bromide C$_4$H$_9$Br, reacts with ethanolic KOH to form major compound [A] which reacts with bromine to give compound [B]. Compound [B] reacts with ethanolic KOH and sodamide to give compound [C]. One molecule of water adds to compound [C] on warming with mercuric sulphate and dilute sulphuric acid at $333$ K to form compound [D]. The functional group in compound D will be confirmed by :", "image": null}, "options": [{"id": "agCqN", "text": "Haloform test", "isCorrect": true, "image": null}, {"id": "fjOog", "text": "Lucas test", "isCorrect": false, "image": null}, {"id": "vvYSP", "text": "Silver mirror test", "isCorrect": false, "image": null}, {"id": "MMCtC", "text": "Benedict test", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The optically active alkyl bromide $\\text{C}_4\\text{H}_9\\text{Br}$ is $2$-bromobutane, $\\text{CH}_3\\text{CH}(\\text{Br})\\text{CH}_2\\text{CH}_3$.<br><br>Reaction with ethanolic $\\text{KOH}$ undergoes dehydrohalogenation to form but-$2$-ene as the major product [A] (Zaitsev's rule).<br><br>But-$2$-ene [A] reacts with $\\text{Br}_2$ to form $2,3$-dibromobutane [B], $\\text{CH}_3\\text{CH}(\\text{Br})\\text{CH}(\\text{Br})\\text{CH}_3$.<br><br>Compound [B] undergoes double dehydrohalogenation with ethanolic $\\text{KOH}$ and $\\text{NaNH}_2$ to give but-$2$-yne [C], $\\text{CH}_3\\text{C}\\equiv\\text{CCH}_3$.<br><br>Hydration of but-$2$-yne [C] with $\\text{HgSO}_4$ and dilute $\\text{H}_2\\text{SO}_4$ yields butan-$2$-one [D], $\\text{CH}_3\\text{COCH}_2\\text{CH}_3$.<br><br>Since compound [D] is a methyl ketone, its functional group is confirmed by the haloform test.<br><br>Answer: Haloform test", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "d190baf2f36b45a6b68cd1f158981078", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/MLWRjmHdGaRYN.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/MLWRjmHdGaRYN.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1ae8bfdbb24356397c4", "type": "singleCorrect", "level": 3, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52f Correct": false}, {"id": "U4fiN", "text": "Statement I is correct but Statement II is incorrect", "image": null, "isCorrect": true}, {"id": "4DKB2", "text": "Both Statement I and Statement II are incorrect", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{CH}_3-\\mathrm{C} \\equiv \\mathrm{CH}+\\mathrm{Na} \\rightarrow \\mathrm{CH}_3-\\mathrm{C} \\equiv \\mathrm{C}^{-} \\mathrm{Na}^{+}+\\frac{1}{2} \\mathrm{H}_2$\n\nStatement-l is correct.\nMoles of $\\mathrm{C}_3 \\mathrm{H}_4=\\frac{4}{40}=0.1$ mole\n$\\mathrm{CH}_3-\\mathrm{C} \\equiv \\mathrm{CH}+\\mathrm{NaNH}_2 \\rightarrow \\mathrm{CH}_3-\\mathrm{C} \\equiv \\mathrm{C}^{-} \\mathrm{Na}^{+}+\\mathrm{NH}_3$\n0.1 mole\n0.1 mole\n\nVolume of $\\mathrm{NH}_3=(0.1)(22.4)=2.24 \\mathrm{~L}$\nStatement-II is incorrect.", "image": null}, "videoSolution": {"videoId": "df69b580fc564140bc5f9ce9b7d5c583", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/WaOhFzzopDXu4.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/WaOhFzzopDXu4.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "67a2eb5ca6d4514bf2d97608", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T09:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 1)", "title": "JEE Main 2025 (22 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6644672e970e6e9ab542d0ef", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 1)", "title": "JEE Main 2024 (06 Apr Shift 1)"}], "question": {"text": "The major product of the following reaction is \\(P\\).\n\\(\\mathrm{CH}_3 \\mathrm{C}=\\mathrm{C}-\\mathrm{CH}_3 \\xrightarrow[\\substack{\\text { (ii) dil. } \\mathrm{KMnO}_4 \\\\ 273 \\mathrm{~K}}]{\\text { (i) } \\mathrm{Na} / \\text { ing } \\mathrm{NH}_3} '^{\\prime}\\)\nNumber of oxygen atoms present in product ' \\(\\mathrm{P}\\) ' is _______ (nearest integer)", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/Cb6KvLctinSUCIKOb0fjzFxuYBLA8RGC89d7q8FTTug.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda6c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2024 (06 Apr Shift 1)", "title": "JEE Main 2024 (06 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd18ba0e94a3c4025a79", "type": "singleCorrect", "level": 2, "questionLabels": [], "question": {"text": "<p>In the given reactions identify <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>.</mo></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/28c7cd2d-a949-4e2b-a0c4-740ab7078aae.png\" style=\"width: 573px; height: 204px;\"/></p>", "image": null}, "options": [{"id": "mo3cg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo> </mo><mo>:</mo><mo> </mo><mn>2</mn></math>–Pentyne <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo> </mo><mo>:</mo></math> trans – <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> – butene", "image": null, "isCorrect": true}, {"id": "1W5Fa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo> </mo><mo>:</mo><mo> </mo><mi mathvariant=\"normal\">n</mi></math> – Pentane <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo> </mo><mo>:</mo></math> trans – <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> – butene", "image": null, "isCorrect": false}, {"id": "MJDww", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo> </mo><mo>:</mo><mo> </mo><mn>2</mn></math> – Pentyne <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo> </mo><mo>:</mo></math> Cis – <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> – butene", "image": null, "isCorrect": false}, {"id": "kpiro", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo> </mo><mo>:</mo><mo> </mo><mi mathvariant=\"normal\">n</mi></math> – Pentane <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo> </mo><mo>:</mo><mo> </mo><mi>Cis</mi><mo> </mo><mo>–</mo><mo> </mo><mn>2</mn></math> – butene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>In palladium-catalyzed hydrogenations of alkynes, the Lindlar catalyst facilitates the addition of hydrogen to the alkyne to afford the corresponding alkene. When this catalyst is used, the addition of the hydrogen substituent always proceeds via syn addition (addition of the substituent on the same side of the bond).</p><p>But<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2</mn><mo>-</mo></math>yne when treated with sodium in liquid ammonia gives trans<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2</mn><mo>-</mo></math>butene. The reaction of alkyne with sodium in liquid ammonia produces sodamide in the process converting alkynes to alkenes. Mechanism of Birch Reduction: -Sodium in liquid ammonia produces solvated electrons.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/653c013f-d144-41e3-a3b4-073dcc847f30.png\" style=\"width: 800px; height: 372px;\"/></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb07", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 2)", "title": "JEE Main 2024 (01 Feb Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb07", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 2)", "title": "JEE Main 2024 (01 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd17ba0e94a3c4025a78", "type": "singleCorrect", "level": 2, "questionLabels": [], "question": {"text": "<p>Compound <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> formed in the following reaction reacts with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> gives the product <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>. Find out <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>.</mo></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b1d0b352-39c5-4df1-b60d-6ddb73faac63.png\" style=\"width: 700px; height: 116px;\"/></p>", "image": null}, "options": [{"id": "uQwWM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>=</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><mi mathvariant=\"normal\">C</mi><mo>≡</mo><msup><mi mathvariant=\"normal\">C</mi><mo>-</mo></msup><msup><mi>Na</mi><mo>+</mo></msup><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>=</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><mi>Br</mi></math>", "image": null, "isCorrect": true}, {"id": "eJhq5", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>=</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><mi>CH</mi><mo>=</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>,</mo><mo> </mo><mi mathvariant=\"normal\">B</mi><mo>=</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><mi>Br</mi></math>", "image": null, "isCorrect": false}, {"id": "3w8Uo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>=</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>,</mo><mo> </mo><mi mathvariant=\"normal\">B</mi><mo>=</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><mi mathvariant=\"normal\">C</mi><mo>≡</mo><mi>CH</mi></math>", "image": null, "isCorrect": false}, {"id": "X53lp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>=</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><mi mathvariant=\"normal\">C</mi><mo>≡</mo><msup><mi mathvariant=\"normal\">C</mi><mo>-</mo></msup><msup><mi>Na</mi><mo>+</mo></msup><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>=</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>When <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mi mathvariant=\"normal\">C</mi><mo>≡</mo><mi>CH</mi></math> reacts with sodium an intermediate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mi mathvariant=\"normal\">C</mi><mo>≡</mo><mi>CNa</mi></math> is formed which on further reaction with propyl bromide gives <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi mathvariant=\"normal\">C</mi><mo>≡</mo><msub><mi>CCH</mi><mn>3</mn></msub></math> as the product. The second step of the reaction follows, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">N</mi></msub><mn>2</mn></math> mechanism.</p><p>The reaction is as follows,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/eeb0ea7a-8cf1-486d-9f33-ce15143a5e9c.png\" style=\"width: 800px; height: 205px;\"/></p><p>Hence in the above reaction,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>=</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><mi mathvariant=\"normal\">C</mi><mo>≡</mo><msup><mi mathvariant=\"normal\">C</mi><mo>-</mo></msup><msup><mi>Na</mi><mo>+</mo></msup><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>=</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><mi>Br</mi></math></p><p>Hence option A is the answer.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb02", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 1)", "title": "JEE Main 2024 (30 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb02", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 1)", "title": "JEE Main 2024 (30 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67f0e", "previousYearPapers": [{"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>But-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>-yne is reacted separately with one mole of Hydrogen as shown below:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mi mathvariant=\"normal\">B</mi><mo>&#175;</mo></munder><munderover><mo>&#8592;</mo><mrow><mi>liq</mi><mo>&#160;</mo><msub><mi>NH</mi><mn>3</mn></msub></mrow><mi>Na</mi></munderover><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><munder><mrow><mi mathvariant=\"normal\">C</mi><mo>&#8801;</mo></mrow><mrow><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></mrow></munder><mi mathvariant=\"normal\">C</mi><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><munderover><mo>&#8594;</mo><mo>&#8710;</mo><mrow><mi>Pd</mi><mo>/</mo><mi mathvariant=\"normal\">C</mi></mrow></munderover><munder><mi mathvariant=\"normal\">A</mi><mo>&#175;</mo></munder></math></p><p>Identify the incorrect statements from the options given below:</p><p>A. A is more soluble than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>.<br />B. The boiling point &amp; melting point of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>&#160;</mo></math>are higher and lower than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> respectively.</p><p>C. A is more polar than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> because dipole moment of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is zero.<br />D. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Br</mi><mn>2</mn></msub></math>&nbsp;adds easily to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>.</p>", "image": null}, "options": [{"id": "H1fG0", "text": "B and C only", "isCorrect": false, "image": null}, {"id": "LLSp4", "text": "B, C and D only", "isCorrect": true, "image": null}, {"id": "7q5n0", "text": "A, C and D only", "isCorrect": false, "image": null}, {"id": "DHKZK", "text": "A and B only", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>A: Cis - But-2-ene</p><p>B: Trans - But-2-ene</p><p>More polar molecules are more soluble in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>. Hence A &gt;B.</p><p>Molecules having higher dipole moments have higher boiling points due to larger intermolecular&nbsp;forces of attraction.&nbsp;More symmetric isomers have higher melting points due to better packing in crystalline lattice &amp; trans isomers are more symmetric than cis. Hence, in case of boiling point it is A&gt;B and in case of melting point it is B&gt;A.</p><p>cis-isomer has resultant of dipoles while in trans isomer dipole moments cancel out.&nbsp;</p><p>So, the correct answer is B, C and D only.</p><p>&nbsp;</p><p>&nbsp;</p>", "image": null}, "videoSolution": {"videoId": "f7f5ee0a35d6491c98344304287b0848", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/2icpTq11CIDuR.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/2icpTq11CIDuR.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "questionStructure": ["MULTI_STATEMENT"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67dc1", "previousYearPapers": [{"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}], "type": "numerical", "level": 2, "question": {"text": "In bromination of Propyne, with Bromine <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>2</mn></math>-tetrabromopropane is obtained in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>27</mn><mo>%</mo></math> yield. The amount of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>2</mn></math>&nbsp;tetrabromopropane obtained from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> of Bromine in this reaction is_____<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> .&nbsp;(Molar Mass : Bromine <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>80</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>/</mo><mi>mol</mi></math>)", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<blockquote><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7279e8a6-4be2-4a38-a131-169dea3231d8-fb96104f-2652-47a4-b717-82139edfb1c9-image.png\" style=\"width: 364px; height: 120px;\" /></p><p>According to the above chemical reaction, 2 moles of bromine will give one mole of the product.</p><p>2 moles of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Br</mi><mn>2</mn></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>2</mn><mo>&#215;</mo><mn>160</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><msub><mi>Br</mi><mn>2</mn></msub><mo>&#160;</mo><mi>gives</mi><mo>&#160;</mo><mi>one</mi><mo>&#160;</mo><mi>mole</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi>product</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>360</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi>product</mi></math></p><p>So, mass of product formed from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#160;</mo><mi>gm</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><msub><mi>Br</mi><mn>2</mn></msub><mo>&#160;</mo><mi>will</mi><mo>&#160;</mo><mi>be</mi><mo>&#160;</mo><mo>=</mo><mfrac><mn>360</mn><mrow><mn>2</mn><mo>&#215;</mo><mn>160</mn></mrow></mfrac><mo>&#160;</mo><mo>&#215;</mo><mn>1</mn><mi mathvariant=\"normal\">g</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>9</mn><mn>8</mn></mfrac><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi>product</mi></math></p><p>But given that % yield = 27%.</p><p>So actual amount of product&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#160;</mo><mfrac><mn>9</mn><mn>8</mn></mfrac><mo>&#215;</mo><mfrac><mn>27</mn><mn>100</mn></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>0</mn><mo>.</mo><mn>30</mn><mo>&#160;</mo><mi>g</mi><mi>r</mi><mi>a</mi><mi>m</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn><mo>.</mo><mn>0</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "41b3d2aee31444d689ecc800382161a9", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/83LHz4ZXR3EVA.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/83LHz4ZXR3EVA.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d6797c", "previousYearPapers": [{"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 1)", "title": "JEE Main 2022 (26 Jul Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>The major product formed in the given reaction is:</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/99081888-b1fb-4019-b613-94fd92b596ca-9755471.png\" style=\"width: 350px; height: 189px;\" /></p>", "image": null}, "options": [{"id": "KrQvv", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a0149adb-7793-4a2f-aa45-0a4cdab34974-9755471_A.png\" style=\"width: 180px; height: 168px;\" />", "isCorrect": false, "image": null}, {"id": "DWdkt", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ab9ae3ab-51da-4a92-b6c4-dbc436be3e57-9755471_B.png\" style=\"width: 180px; height: 193px;\" />", "isCorrect": false, "image": null}, {"id": "7DQUo", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/105ced96-4956-4cc5-bdd7-e0dbaec5bba2-9755471_C.png\" style=\"width: 180px; height: 181px;\" />", "isCorrect": true, "image": null}, {"id": "60eVU", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2302ca5a-1bda-4575-b88f-8611e0267c53-9755471_D.png\" style=\"width: 150px; height: 283px;\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>The Birch reduction is an organic reaction where aromatic compounds which have a benzenoid ring are converted into 1,4-cyclohexadiene which have two hydrogen atoms attached at opposite ends of the molecule.&nbsp;The solvated electrons (the free electrons in the solution of sodium in liquid ammonia which are responsible for the intense blue colour) add to the aromatic ring, giving a radical anion. This radical anion is supplied with a proton by the alcohol. The alcohol also supplies another proton to the penultimate carbanion. Now, with the alcohol present, the products 1,4&ndash; cyclohexadiene and an alkoxide ion are formed.</p><p>The reaction with nitro anisole is given below.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi><mo>+</mo><msub><mi>NH</mi><mn>3</mn></msub><mo>&#8594;</mo><msup><mfenced close=\"]\" open=\"[\"><mrow><mi>Na</mi><mfenced><msub><mi>NH</mi><mn>3</mn></msub></mfenced></mrow></mfenced><mo>+</mo></msup><mo>+</mo><mi>ammoniated</mi><mo>&#160;</mo><mi>electrons</mi></math></p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e403cbce-cc23-41ef-a583-e78bb228ecb9-9755471_Sol_1.png\" style=\"width: 460px; height: 203px;\" /></p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/554a8dfa-78ca-4864-8628-30583291589a-98eb397d-5555-4552-a741-a6acd8f3e93b-9755471_Sol_2.png\" style=\"width: 521px; height: 195px;\" /></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 1)", "title": "JEE Main 2022 (26 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67bef", "previousYearPapers": [{"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>What will be the major product of following sequence of reactions?</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/83fd39e6-55ce-476c-ae25-9812216f66f8-image.png\" style=\"width: 250px; height: 93px;\" /></p>", "image": null}, "options": [{"id": "VUe4q", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a39d7924-b66a-4be4-871b-ff01daab688a-image.png\" style=\"width: 190px; height: 97px;\" />", "isCorrect": false, "image": null}, {"id": "uImnh", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/64f5b7cf-1e78-4881-9b55-39bc9822c6a3-image.png\" style=\"width: 180px; height: 108px;\" />", "isCorrect": false, "image": null}, {"id": "ajF7F", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/73190dcf-a7f3-45c1-bae3-9124518a1f72-image.png\" style=\"width: 200px; height: 92px;\" />", "isCorrect": true, "image": null}, {"id": "23f0P", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d96d18d5-53c4-4357-ac46-e11ab4cc5b15-image.png\" style=\"width: 160px; height: 145px;\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>First step of the reaction involves acid base reaction to form&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi><mo>-</mo><mi>Bu</mi><mo>-</mo><mi mathvariant=\"normal\">C</mi><mo>&#8801;</mo><msup><mi mathvariant=\"normal\">C</mi><mo>-</mo></msup><msup><mi>Li</mi><mo>+</mo></msup></math>.This is due to the presence of acidic hydrogen in the reactant Hex-1-yne.</p><p>Second step involves nucleophilic substitution to form a higher alkyne.</p><p>Third step involves hydrogenation of alkyne&nbsp;by using lindlar catalyst to form cis-alkene</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/782bde96-815c-48bb-979f-5e0291b67cbb-73d5ed69-7dd9-418f-9390-b25328f435d2-image.png\" style=\"width: 528px; height: 239px;\" /></p>", "image": null}, "videoSolution": {"videoId": "6d59e8dffb3943c7ab977490a306b690", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/HTgWFKIioQ9TI.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/HTgWFKIioQ9TI.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-14T07:55:55.097Z"}, {"_id": "648b5a69417cc3fb48d66eed", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-16T14:00:00.000Z", "isVisible": true, "shortName": "2021 (16 Mar Shift 2)", "title": "JEE Main 2021 (16 Mar Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "An unsaturated hydrocarbon <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>&nbsp;on ozonolysis gives <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>. Compound <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> when warmed with ammoniacal silver nitrate forms a bright silver mirror along the sides of the test tube. The unsaturated hydrocarbon <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math> is :", "image": null}, "options": [{"id": "I7dbv", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c0fcae87-d21a-4600-8e26-69cde9647a79-image.png\" style=\"width: 180px; height: 66px;\" />", "isCorrect": false, "image": null}, {"id": "HlBgl", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a55177ff-6c08-47cc-a64f-d0788a79fb96-image.png\" style=\"width: 118px; height: 69px;\" />", "isCorrect": false, "image": null}, {"id": "EiFZN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HC</mi><mo>&#8801;</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "MfpsD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><mi mathvariant=\"normal\">C</mi><mo>&#8801;</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/96156992-18b0-42c9-bfe3-12e5b8f87b5a-image.png\" style=\"width: 358px; height: 94px;\" /></p><p>As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">A</mi><mo>)</mo></math> compound given positive Tollen&#39;s test hence it may consist&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>CHO</mi></math> (aldehyde group)&nbsp;or it can be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HCOOH</mi></math></p><p>So for the given option :</p><p>(3)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><msu ], "correctValue": null, "solution": {"text": "<p>In this reaction, the given ether is converted to phenolic derivative and ethyl bromide.</p><p>Treatment of alkenes with hydrobromic acid will result in the formation of alkyl bromides according to Markonvikov's rule. Markonvikov's rule is that when an unsymmetrical reagent adds to an unsymmetrical alkene, the more positive part of the agent goes to the carbon that has more hydrogen atoms.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2f9f9d27-3994-4347-abe1-14c0fa5edb34.png\" style=\"width: 584px; height: 412px;\"/></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d673ce", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 1)", "title": "JEE Main 2021 (26 Aug Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>The major product formed in the following reaction is:</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ca5f0d4f-c12e-41b5-9607-3decb27400ac-image.png\" style=\"width: 334px; height: 114px;\" /></p>", "image": null}, "options": [{"id": "JVZ8W", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c3493ed3-db35-418d-8613-c853193dc398-image.png\" style=\"width: 282px; height: 104px;\" />", "isCorre
