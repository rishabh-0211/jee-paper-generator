=\"44\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/62387c1f-7f09-4c57-89f0-20964d8a4b66-image.png\" width=\"191\" /></p>", "isCorrect": true, "image": null}, {"id": "ce4Y6", "text": "<p><img height=\"46\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d73264b1-54ae-4f7b-a81f-dec0eee8dd95-image.png\" width=\"215\" /></p>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Alcoholic&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>KOH</mi></math>&nbsp;shows elimination reaction. In which nucleophile shows anti elimination reaction and base removes bromide ion as leaving group to form terminal alkyne.</p><p>Terminal alkyne&nbsp;has acidic hydrogen and behaves as acid.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e79d1fba-40b1-45c1-92b0-b86232b870ff-image.png\" style=\"width: 651px; height: 123px;\" /></p><p><img height=\"70\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b70f67d4-0fdb-408c-96c2-fb64f3579450-image.png\" width=\"591\" /></p>", "image": null}, "videoSolution": {"videoId": "ef932fd6002c48c8806a3affe35f75f4", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/pVjGOTy2zUhhy.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/pVjGOTy2zUhhy.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7ef", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Jan Shift 2)", "title": "JEE Main 2019 (12 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d666b0", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ea", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 1)", "title": "JEE Main 2019 (10 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>The major product of the following reaction is:<br /><br /><img height=\"146\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/bfd73f49-27bc-4063-a3f5-d20e76b90e25-image.png\" width=\"407\" /></p>", "image": null}, "options": [{"id": "aeRgB", "text": "<p><img height=\"93\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/93fe27ce-09ce-4a2f-a968-3621f559e37c-image.png\" width=\"182\" /></p>", "isCorrect": false, "image": null}, {"id": "HtxaX", "text": "<p><img height=\"123\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f344dc67-5c51-40fc-a7cb-3eab6798d417-image.png\" width=\"127\" /></p>", "isCorrect": false, "image": null}, {"id": "y5mkh", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b0058bac-6f29-425e-8b86-e95d3548c532-61f18e57-7060-4a94-a630-0a661010fea7-image.png\" style=\"width: 185px; height: 75px;\" /></p>", "isCorrect": true, "image": null}, {"id": "DJgJJ", "text": "<p><img height=\"71\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1f21a3b9-b718-4cbf-8f39-7b922b85f202-image.png\" width=\"208\" /></p>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p style=\"text-align: justify;\">Addition of alc. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>KOH</mi></math> to haloalkanes follows the Saytzeff rule which points towards greater stability. Saytzeff&#39;s rule implies that elimination reactions favour formation of alkene with greater number of substituents.<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/def9c059-c492-4e0a-8e19-5ed7876d30bf-61f18e57-7060-4a94-a630-0a661010fea7-image.png\" style=\"width: 185px; height: 75px;\" /><br /><br />Not only that, but it also gives the molecule an extended conjugate system which further enhances its stability.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ea", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 1)", "title": "JEE Main 2019 (10 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d662db", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 2 Online)", "title": "JEE Main 2018 (15 Apr Shift 2 Online)"}], "question": {"text": "The major product formed in the following reaction is:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/sXoq-SUm4KAoRwwAP-YjQKaZZwPjkUO9WVAt85GCxn0.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "uh1cM", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/DeJskMhDX5M8JS4brKF44wf8U3TyPG1gOZKAJ1dqFaU.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "RGrhj", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/PZ9hvlJzoeI1PXyYdVehhtnZPVr2wgw2KO851jQLkkw.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "S3FJf", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/dY7g4Eto_UrAfelUSmDdjfFkyu0XZWv6Kl9-kCekbG4.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "3mAM6", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ABMxMxBM9s74TwjYqf66hFLkQ5r_27NxRI43tyNGoWU.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Note: In the given reaction a molecule of $\\mathrm{HCl}$ is lost and $\\mathrm{C}=\\mathrm{C}$ double bond is formed. Thus it is dehydrohalogenation reaction.\nNitro group is electron withdrawing group. Hence increases the acidity of $\\mathrm{H}$ atom (attached to $\\mathrm{C}$ atom bearing nitro group) which is removed easily. Further the newly formed double bond is in conjugation with nitro group.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0Y-pUsuIdxQlmtM75eNgOgkqe1WY1Rkw5n_LlQt8Bpk.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 2 Online)", "title": "JEE Main 2018 (15 Apr Shift 2 Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d662d9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 2 Online)", "title": "JEE Main 2018 (15 Apr Shift 2 Online)"}], "question": {"text": "When 2-butyne is treated with $\\mathrm{H}_2$ /Lindlar's catalyst, compound $\\mathrm{X}$ is produced as the major product and when treated with $\\mathrm{Na}$ /liq. $\\mathrm{NH}_3$ it produces $\\mathrm{Y}$ as the major product. Which of the following statements is correct?", "image": null}, "options": [{"id": "GCwgT", "text": "\nY will have higher dipole moment and higher boiling point than $\\mathrm{X}$ Y\n", "image": null, "isCorrect": false}, {"id": "tq6rB", "text": "\n$\\mathrm{Y}$ will have higher dipole moment and lower boiling point than $\\mathrm{X}$\n", "image": null, "isCorrect": false}, {"id": "ARyF6", "text": "\nX will have lower dipole moment and lower boiling point than $\\mathrm{Y}$\n", "image": null, "isCorrect": false}, {"id": "QYnP6", "text": "\n$\\mathrm{X}$ will have higher dipole moment and higher boiling point than Y", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "When 2-butyne is treated with $\\mathrm{H}_2$ /Lindlar's catalyst, compound $\\mathrm{X}$ (cis-2-butene) is produced as the major product; and when treated with $\\mathrm{Na} /$ liq $\\mathrm{NH}_3$ it produces $\\mathrm{Y}$ (trans -2- butene) as the major product. Cisisomer $(\\mathrm{X})$ will have higher dipole moment and higher boiling point than $\\operatorname{trans}(\\mathrm{Y})$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T14:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 2 Online)", "title": "JEE Main 2018 (15 Apr Shift 2 Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d6627a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 1 Online)", "title": "JEE Main 2018 (15 Apr Shift 1 Online)"}], "question": {"text": "Which of the following will most readily give the dehydrohalogenation product?", "image": null}, "options": [{"id": "gT1pq", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/N3n3YUKr3Y2tZRnlJdLs77mU21WfFTpkY9DUNIaR3fM.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "S1aem", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/T7YeF4Wsy4mAmm_y00NJUfJ73jPAqenUuiJbBVHp94o.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "HUN42", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fsgiCzmnaQyyDPUSzemMop2HC2veLjSVaOvn-bVZIi0.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "WhTHw", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5tLRv3cvp9dw6Nzr6ghwS0m1S95xugrJ27UA-mCM6uw.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here dehydrohalogenation goes by $\\mathrm{E1cB}$ and most stable carbanion formation is favoured in (a).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 1 Online)", "title": "JEE Main 2018 (15 Apr Shift 1 Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d6622a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2018 (08 Apr)", "title": "JEE Main 2018 (08 Apr)"}], "question": {"text": "The trans-alkenes are formed by the reduction of alkynes with", "image": null}, "options": [{"id": "UrwBo", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Sn</mi><mo>-</mo><mi>HCl</mi></math>", "image": null, "isCorrect": false}, {"id": "yk09r", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mo>-</mo><mi>Pd</mi><mo>/</mo><mi mathvariant=\"normal\">C</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><msub><mi>BaSO</mi><mn>4</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "ro814", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NaBH</mi><mn>4</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "pR640", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi><mo>/</mo><mi>liq</mi><mo>.</mo><msub><mi>NH</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/266686.jpg\" style=\"width: 293px; height: 60px;\" /><br />Birch reduction is anti-addition. So trans alkene will be produced.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2018 (08 Apr)", "title": "JEE Main 2018 (08 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65906", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}], "question": {"text": "The main product of the following reaction is\n$\\mathrm{C}_6 \\mathrm{H}_5 \\mathrm{CH}_2 \\mathrm{CH}(\\mathrm{OH}) \\mathrm{CH}\\left(\\mathrm{CH}_3\\right)_2 \\stackrel{\\text { conc. } \\mathrm{H}_2 \\mathrm{SO}_4}{\\longrightarrow}$ ?", "image": null}, "options": [{"id": "xTNcm", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/VmCW6VD9eCYZ5i-o1YTU32gofbBLs7CoGamLHL8ixM0.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "1HqPj", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/36jJm1RnGZT-NNvqYkhmVvU66Mfd2iXktZG9YIaYeco.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "Khlft", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/yGiXCZsHAlcFldVav5sy6dARn1TmnM9nfiYFW4ZD1jc.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "zisdy", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/WxHsauI_3MNcyYYi1lazndfA7BZ1uA_q5wlIjHM15p0.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/E-vR9hlmuVkzvtszlt7wib-ekwZv27HRSGwSgO2UrLc.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65768", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}], "question": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/j77f777jxxPWWPNn82dVDK-nby9hSrc-gbG6vpgNywI.original.fullsize.png\"><br>\nThe alkene formed as a major product in the above elimination reaction is", "image": null}, "options": [{"id": "kAyQD", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c5j-2KslK95XGC4US9vpaIuWO_gpPa4LEiWtoUfU5JA.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "2UuPa", "text": "\n$\\mathrm{CH}_2=\\mathrm{CH}_2$\n", "image": null, "isCorrect": true}, {"id": "JCBgY", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/HDTbTM1f2GjMSqnbw47IyHYEvhGWptrqjxLyl_a1cd8.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "RslBx", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/iFBno9Oq8OMggihotcGIQURIPeql98wDQ9PdNJAQ4fc.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "648b5a73417cc3fb48d693ba", "title": "Reactions of alkenes", "totalQuestions": 72, "questions": [{"_id": "69d8074f81239f6567c4f43e", "type": "singleCorrect", "question": {"text": "Given below are two statements:<br><br>Statement I: $3$-phenylpropene reacts with HBr and gives secondary alkyl bromide having a chiral carbon atom as the major product.<br><br>Statement II: Aryl chlorides and aryl cyanides can be prepared by Sandmeyer reaction as well as Gattermann reaction.<br><br>In the light of the above statements, choose the correct answer from the options given below", "image": null}, "options": [{"id": "ScKwN", "text": "Both Statement I and Statement II are true", "isCorrect": false, "image": null}, {"id": "cD6tY", "text": "Both Statement I and Statement II are false", "isCorrect": false, "image": null}, {"id": "Dhu2Q", "text": "Statement I is true but Statement II is false", "isCorrect": true, "image": null}, {"id": "axr0d", "text": "Statement I is false but Statement II is true", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Statement I:<br>When $3$-phenylpropene reacts with $HBr$, protonation of the alkene occurs to form a secondary carbocation.<br><br>$C_6H_5-CH_2-CH=CH_2 + H^+ \\rightarrow C_6H_5-CH_2-CH^+-CH_3$<br><br>This secondary carbocation undergoes a $1,2$-hydride shift to form a more stable, resonance-stabilized benzylic carbocation.<br><br>$C_6H_5-CH_2-CH^+-CH_3 \\rightarrow C_6H_5-CH^+-CH_2-CH_3$<br><br>The bromide ion then attacks this benzylic carbocation to form the major product, $1$-bromo-$1$-phenylpropane.<br><br>$C_6H_5-CH^+-CH_2-CH_3 + Br^- \\rightarrow C_6H_5-CH(Br)-CH_2-CH_3$<br><br>The carbon atom bonded to the bromine is attached to four different groups: a phenyl group ($-C_6H_5$), an ethyl group ($-CH_2CH_3$), a hydrogen atom ($-H$), and a bromine atom ($-Br$). Thus, it is a chiral carbon. The product is a secondary alkyl bromide. Therefore, Statement I is true.<br><br>Statement II:<br>The Sandmeyer reaction involves treating a diazonium salt with $Cu(I)$ salts ($CuCl$, $CuBr$, $CuCN$) to prepare aryl chlorides, aryl bromides, and aryl cyanides, respectively.<br><br>The Gattermann reaction involves treating a diazonium salt with copper powder ($Cu$) and halogen acids ($HCl$, $HBr$) to prepare aryl chlorides and aryl bromides. Aryl cyanides are not prepared using the Gattermann reaction. Therefore, Statement II is false.<br><br>Conclusion: Statement I is true but Statement II is false.<br><br>Answer: Statement I is true but Statement II is false", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "cee0a2943bf2467ab6b9d051ec680f61", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/wQJWR0YKhQ2aT.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/wQJWR0YKhQ2aT.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8074f81239f6567c4f43b", "type": "singleCorrect", "question": {"text": "$R_f$ value for $2$-methylpropene in a solvent system (Ethyl acetate + ether) is $0.42$. $2$-methylpropene is treated with dilute $\\text{H}_2\\text{SO}_4$ to give major organic product (X). $R_f$ value for (X) in the same solvent system under identical condition will be:", "image": null}, "options": [{"id": "GK6Jw", "text": "$0.42$", "isCorrect": false, "image": null}, {"id": "kMdeK", "text": "$0.82$", "isCorrect": false, "image": null}, {"id": "k7Hr1", "text": "$0.62$", "isCorrect": false, "image": null}, {"id": "JO7W1", "text": "$0.12$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "$2$-methylpropene reacts with dilute $H_2SO_4$ to undergo hydration, forming tert-butyl alcohol as the major product (X).<br><br>The reaction is:<br><br>$CH_2=C(CH_3)_2 \\xrightarrow{\\text{dil. } H_2SO_4} (CH_3)_3C-OH$<br><br>Product (X) is an alcohol, which is significantly more polar than the starting alkene due to the presence of the $-OH$ group. In normal phase chromatography, the stationary phase (such as silica gel) is highly polar. The polar $-OH$ group forms strong hydrogen bonds with the stationary phase, causing the alcohol to be adsorbed more strongly than the non-polar alkene.<br><br>Consequently, the alcohol travels a shorter distance along the chromatography plate, resulting in a lower $R_f$ value compared to the alkene.<br><br>Since the $R_f$ value of $2$-methylpropene is $0.42$, the $R_f$ value of product (X) must be less than $0.42$. Among the given choices, only $0.12$ satisfies this condition.<br><br>Answer: $0.12$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "a89b61b1ed5a482b901727939b10e084", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/lWnKpEDQu5aNy.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/lWnKpEDQu5aNy.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8073581239f6567c4f310", "type": "singleCorrect", "question": {"text": "\"P\" is a hydrocarbon of molecular formula: C$_8$H$_{14}$. On ozonolysis, \"P\" forms \"Q\". \"Q\" on treatment with alkali under reflux condition produces \"R\", which on treatment with I$_2$/NaOH gives a yellow precipitate. Acidification of the solution gives \"S\". The structure of \"S\" is given below:<br><img style=\"width: 200px\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/05APRS1__q64_d1.png\" /><br>The correct structure of \"P\" is", "image": null}, "options": [{"id": "PtSRr", "text": "<img style=\"width: 200px\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/05APRS1__q64_d2.png\" />", "isCorrect": false, "image": null}, {"id": "6kjtU", "text": "<img style=\"width: 200px\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/05APRS1__q64_d3.png\" />", "isCorrect": false, "image": null}, {"id": "6B8wF", "text": "<img style=\"width: 180px\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/05APRS1__q64_d4.png\" />", "isCorrect": false, "image": null}, {"id": "l558S", "text": "<img style=\"width: 150px\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/05APRS1__q64_d5.png\" />", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The structure of \"S\" is 2-methylcyclopent-1-ene-1-carboxylic acid.<br><br>Since \"S\" is obtained by the acidification of the product from the iodoform reaction of \"R\", \"R\" must contain a methyl ketone group ($-COCH_3$). The iodoform reaction converts the $-COCH_3$ group into a $-COOH$ group alongside the formation of a yellow precipitate of iodoform ($CHI_3$). Therefore, the structure of \"R\" is 1-acetyl-2-methylcyclopentene.<br><br>\"R\" is formed by the intramolecular aldol condensation of \"Q\". Performing a retro-aldol condensation on \"R\" by cleaving the double bond in the cyclopentene ring yields octane-2,7-dione as \"Q\" ($CH_3-CO-CH_2-CH_2-CH_2-CH_2-CO-CH_3$).<br><br>\"Q\" is obtained by the ozonolysis of \"P\". To determine the structure of \"P\", we perform retro-ozonolysis by removing the oxygen atoms from the two carbonyl groups of \"Q\" and connecting the corresponding carbon atoms with a double bond. Connecting the C2 and C7 carbons forms a six-membered ring with methyl groups at the double bond.<br><br>Thus, \"P\" is 1,2-dimethylcyclohexene.<br><br>Answer: <img style=\"width: 180px\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/05APRS1__q64_d5.png\" />", "image": null}, "level": 3, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "68574a94890944338f3364f0705bbd2d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/IaMCE8UXjKofZ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/IaMCE8UXjKofZ.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd7", "title": "JEE Main 2026 (05 April Shift 1)", "shortName": "2026 (05 April Shift 1)", "isVisible": true, "heldOn": "2026-04-05T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8074881239f6567c4f3f1", "type": "singleCorrect", "question": {"text": "<img style=\"width:550px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/04APRS2__q64_d1.jpg\" /><br>Compound (X) [styrene] is subjected to the sequence of reactions as shown above: (i) $Br_2/CHCl_3$ (ii) $NaNH_2$ excess (iii) $CH_3I$ (iv) $H_2$, $Na/NH_3$ $(l)$, giving Major Product (Y). Molar mass of the major product (Y) formed is ______ g mol$^{-1}$.<br>(Given molar mass in g mol$^{-1}$ C:$12$, H: $1$, O: $16$)", "image": null}, "options": [{"id": "xBhS7", "text": "$90$", "isCorrect": false, "image": null}, {"id": "iu2Yx", "text": "$118$", "isCorrect": true, "image": null}, {"id": "8clYS", "text": "$160$", "isCorrect": false, "image": null}, {"id": "XAYmy", "text": "$125$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Addition of $Br_2$ to styrene (X) yields 1,2-dibromoethylbenzene.<br><br>$C_6H_5-CH=CH_2 \\xrightarrow{Br_2/CHCl_3} C_6H_5-CH(Br)-CH_2(Br)$<br><br>Reaction with excess $NaNH_2$ causes double dehydrohalogenation followed by deprotonation of the terminal alkyne, forming sodium phenylacetylide.<br><br>$C_6H_5-CH(Br)-CH_2(Br) \\xrightarrow{NaNH_2 \\text{ (excess)}} C_6H_5-C \\equiv C^- Na^+$<br><br>Nucleophilic substitution with $CH_3I$ yields 1-phenylpropyne.<br><br>$C_6H_5-C \\equiv C^- Na^+ \\xrightarrow{CH_3I} C_6H_5-C \\equiv C-CH_3$<br><br>Reduction with $Na/NH_3(l)$ reduces the internal alkyne to a trans-alkene without affecting the benzene ring.<br><br>$C_6H_5-C \\equiv C-CH_3 \\xrightarrow{Na/NH_3(l)} C_6H_5-CH=CH-CH_3$<br><br>The major product (Y) is trans-1-phenylpropene, which has the molecular formula $C_9H_{10}$.<br><br>Molar mass of $C_9H_{10} = (9 \\times 12) + (10 \\times 1) = 108 + 10 = 118 \\text{ g mol}^{-1}$.<br><br>Answer: $118$", "image": null}, "level": 3, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd6", "title": "JEE Main 2026 (04 April Shift 2)", "shortName": "2026 (04 April Shift 2)", "isVisible": true, "heldOn": "2026-04-04T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "35a92602fc054b40b0a56479be2df005", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/YzNYh97Eh6u20.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/YzNYh97Eh6u20.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd6", "title": "JEE Main 2026 (04 April Shift 2)", "shortName": "2026 (04 April Shift 2)", "isVisible": true, "heldOn": "2026-04-04T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8075581239f6567c4f487", "type": "singleCorrect", "question": {"text": "An alkene $(X)$ on ozonolysis followed by reduction gives following products: $H-CHO$ ($2$ moles), $H-CO-CO-CHO$, $CH_3-CO-CO-CH_3$. The alkene $(X)$ is:", "image": null}, "options": [{"id": "mZMUo", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/04APRS1__q64_d1.png\" />", "isCorrect": false, "image": null}, {"id": "3YWwR", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/04APRS1__q64_d2.png\" />", "isCorrect": false, "image": null}, {"id": "YGTVe", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/04APRS1__q64_d3.png\" />", "isCorrect": true, "image": null}, {"id": "jPKx6", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_april_watermarked/04APRS1__q64_d4.png\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Ozonolysis (followed by reductive workup with $Zn/H_2O$) cleaves $C=C$ bonds and converts each alkene carbon into a carbonyl. We can reverse-engineer the parent alkene from the fragments obtained.<br><br>Analysing the products:<br>$HCHO$ $(2\\text{ moles})$: Two equivalents of formaldehyde indicate the presence of two terminal or exocyclic $=CH_2$ groups in the parent molecule.<br><br>$CH_3-CO-CO-CH_3$ (biacetyl): To get this discrete fragment, the parent alkene must contain the structural unit $-C(CH_3)=C(CH_3)-$, i.e., an endocyclic double bond in which both sp$^2$ carbons bear methyl substituents.<br><br>$H-CO-CO-CHO$ (mesoxaldehyde): This arises from a fragment like $=CH-C(=CH_2)-CH=$, where cleavage of the adjacent $C=C$ bonds generates three consecutive carbonyl groups (and also contributes to the formaldehyde count from the exocyclic $=CH_2$).<br><br>Evaluating the options:<br>The most diagnostic product is biacetyl, so the parent structure must contain the $-C(CH_3)=C(CH_3)-$ unit.<br><br>Option $(1)$: One methyl group is on the endocyclic double bond and the other methyl is on a separate sp$^3$ carbon. Cleavage cannot give biacetyl.<br><br>Option $(2)$: Only a single methyl group is present, so biacetyl cannot be formed.<br><br>Option $(4)$: The methyl groups lie on opposite ends of the ring (across a $1,4$-diene-type arrangement). Ozonolysis would place these methyls in different fragments, so biacetyl cannot be formed.<br><br>Option $(3)$: The left side of the ring contains an endocyclic double bond in which both carbons carry methyl groups, giving exactly the required $-C(CH_3)=C(CH_3)-$ arrangement. Cleavage of this bond together with the adjacent ring double bonds releases a discrete $CH_3-CO-CO-CH_3$ fragment. The right side of the molecule carries exocyclic $=CH_2$ groups, which on cleavage produce the two moles of $HCHO$, while the intervening carbons give rise to $H-CO-CO-CHO$.<br><br>Hence, the correct structure that yields all three ozonolysis products is option $(3)$.", "image": null}, "level": 3, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd5", "title": "JEE Main 2026 (04 April Shift 1)", "shortName": "2026 (04 April Shift 1)", "isVisible": true, "heldOn": "2026-04-04T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "18617d5d198746bbb25cd741966fcf3c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/3TilaRBXc0iPv.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/3TilaRBXc0iPv.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd5", "title": "JEE Main 2026 (04 April Shift 1)", "shortName": "2026 (04 April Shift 1)", "isVisible": true, "heldOn": "2026-04-04T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c1ad8bfdbb24356397be", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "$\\mathrm{Ph}-\\mathrm{CH}=\\mathrm{CH}_{2} \\xrightarrow[\\mathrm{HBr}]{(\\mathrm{PhCOO})_{2}}$ Product <br> Consider the above reaction <br> A. The reaction proceeds through a more stable radical intermediate. <br> B. The role of peroxide is to generate $\\mathrm{H}^{\\circ}$ (Hydrogen radical). <br> C. During this reaction, benzene is formed as a byproduct. <br> D. 1-Bromo-2-phenylethane is formed as the minor product. <br> E. The same reaction in absence of peroxide proceeds via carbocation intermediate. <br> Identify the correct statements. Choose the correct answer from the options given below:", "image": null}, "options": [{"id": "enjQy", "text": "C, D & E Only", "isCorrect": false, "image": null}, {"id": "gphHJ", "text": "A, B & D Only", "isCorrect": false, "image": null}, {"id": "u3s3E", "text": "A, C & E Only", "isCorrect": true, "image": null}, {"id": "XsxuS", "text": "A & E Only", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$Ph-CH=CH_2 \\xrightarrow[HBr]{(PhCOO)_2} Ph-CH_2-CH_2-Br$<br>Anti Markovnikov addition<br>• Reaction follow radical addition in presence of peroxide<br>• In absence of peroxide follow carbocation mechanism<br>• Benzene also formed<br><img style=\"width:350px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/28S1_s_55_1.png\">", "image": null}, "videoSolution": {"videoId": "92a51b4477bc4ca68e8cd12624194a1a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/RyyOzVijrsZnN.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/RyyOzVijrsZnN.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "questionStructure": ["MULTI_STATEMENT"], "syllabusCategory": "noChange", "previousYear": {"_id": "6983c0cb2f90f45c755e5f49", "title": "JEE Main 2026 (28 January Shift 1)", "shortName": "2026 (28 January Shift 1)", "isVisible": true, "heldOn": "2026-01-28T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c19b8bfdbb24356396db", "type": "singleCorrect", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "<img style=\"width:350px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/23S2_q_53_1_v2.png\"><br>Identify (P)", "image": null}, "options": [{"id": "xQYE7", "text": "<img style=\"width:110px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/23S2_o_53_1_1_v2.png\">", "isCorrect": false, "image": null}, {"id": "fYPX0", "text": "<img style=\"width:110px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/23S2_o_53_2_1_v2.png\">", "isCorrect": false, "image": null}, {"id": "Sipdx", "text": "<img style=\"width:120px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/23S2_o_53_3_1_v2.png\">", "isCorrect": false, "image": null}, {"id": "Kfg19", "text": "<img style=\"width:130px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/23S2_o_53_4_1_v2.png\">", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The vicinal dibromide undergoes elimination with $\\text{Zn}/\\Delta$ to form cyclohexene.<br><br>Cyclohexene reacts with HBr. The secondary carbocation formed undergoes a 1,2-hydride shift to give a more stable tertiary carbocation, which then combines with $\\text{Br}^-$ to give 1-bromocyclohexane (with Br at the more substituted position).<br><br>The major product (P) is 1-bromo-1-methylcyclohexane (tertiary alkyl bromide).", "image": null}, "videoSolution": {"videoId": "82adf85b2cdd4831b573462fa6716cf3", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/4Kb4B7mVvqXFV.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/4Kb4B7mVvqXFV.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f46", "title": "JEE Main 2026 (23 January Shift 2)", "shortName": "2026 (23 January Shift 2)", "isVisible": true, "heldOn": "2026-01-23T14:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c18b8bfdbb243563960f", "type": "numerical", "level": 2, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f43", "title": "JEE Main 2026 (22 January Shift 1)", "shortName": "2026 (22 January Shift 1)", "isVisible": true, "heldOn": "2026-01-22T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "The cycloalkene $(\\mathrm{X})$ on bromination consumes one mole of bromine per mole of $(\\mathrm{X})$ and gives the product $(\\mathrm{Y})$ in which $\\mathrm{C}: \\mathrm{Br}$ ratio is 3:1. The percentage of bromine in the product $(\\mathrm{Y})$ is $\\_\\_\\_\\_$%. (Nearest integer) (Given : molar mass in $\\mathrm{g} \\mathrm{mol}^{-1} \\mathrm{H}: 1, \\mathrm{C}: 12, \\mathrm{O}: 16, \\mathrm{Br}: 80$)", "image": null}, "options": [], "correctValue": 66, "solution": {"text": "A cycloalkene (X) undergoes bromination with 1 mole of Br₂, consuming 2 moles of Br atoms (addition to the double bond).<br>The product (Y) has C:Br ratio of 3:1.<br>With 2 Br atoms present, the number of C atoms is 2 × 3 = 6.<br>Therefore, product Y has composition C₆H₁₂Br₂ with molar mass<br>$= 6(12) + 12(1) + 2(80) = 72 + 12 + 160 = 244$ g/mol.<br>Percentage of Br = (2 × 80 / 244) × 100 = (160 / 244) × 100<br>= 65.57%, which rounds to 66% (nearest integer).", "image": null}, "videoSolution": {"videoId": "f2119a9e795a4201b5ca3239befd43ac", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/VfuqmRXqSPjJb.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/VfuqmRXqSPjJb.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6983c0cb2f90f45c755e5f43", "title": "JEE Main 2026 (22 January Shift 1)", "shortName": "2026 (22 January Shift 1)", "isVisible": true, "heldOn": "2026-01-22T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6983c17d8bfdbb2435639567", "type": "singleCorrect", "level": 3, "previousYearPapers": [{"_id": "6983c0cb2f90f45c755e5f41", "title": "JEE Main 2026 (21 January Shift 1)", "shortName": "2026 (21 January Shift 1)", "isVisible": true, "heldOn": "2026-01-21T09:00:00.000Z", "examId": "615d76b2c52ffa3c944600df"}], "question": {"text": "Identify A in the following reaction.<br><img style=\"width:450px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/21S1_q_54_1.png\">", "image": null}, "options": [{"id": "3SJLx", "text": "<img style=\"width:150px;\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main_2026_watermark_improved/21S1_o_54_1_1.png\">", "isCorrect
