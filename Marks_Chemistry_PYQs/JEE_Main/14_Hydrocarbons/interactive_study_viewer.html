    const data = {"index": 14, "chapterId": "616024b99d2606a21d244446", "chapter": "Hydrocarbons", "totalTopics": 11, "totalQuestions": 242, "downloadTime": "2026-10-08 19:49:17", "topics": [{"index": 1, "topicId": "648b5a73417cc3fb48d693b7", "title": "Properties and Preparation of Alkanes", "totalQuestions": 19, "questions": [{"_id": "69d8074f81239f6567c4f43d", "type": "singleCorrect", "question": {"text": "Given below are two statements:<br><br>Statement I: Methane can be prepared by decarboxylation of sodium ethanoate, Kolbe's electrolysis of sodium acetate and reaction of $\\text{CH}_3\\text{MgBr}$ with water.<br><br>Statement II: Methane cannot be prepared from unsaturated hydrocarbons and by Wurtz reaction.<br><br>In the light of the above statements, choose the correct answer from the options given below", "image": null}, "options": [{"id": "Zex0z", "text": "Both Statement I and Statement II are true", "isCorrect": false, "image": null}, {"id": "6Qy4z", "text": "Both Statement I and Statement II are false", "isCorrect": false, "image": null}, {"id": "qxYGx", "text": "Statement I is true but Statement II is false", "isCorrect": false, "image": null}, {"id": "kBYfW", "text": "Statement I is false but Statement II is true", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Statement I is false because Kolbe's electrolysis of sodium acetate produces ethane, not methane. The reaction is: $2\\text{CH}_3\\text{COONa} + 2\\text{H}_2\\text{O} \\xrightarrow{\\text{Electrolysis}} \\text{CH}_3-\\text{CH}_3 + 2\\text{CO}_2 + \\text{H}_2 + 2\\text{NaOH}$. Decarboxylation of sodium ethanoate and the reaction of $\\text{CH}_3\\text{MgBr}$ with water do produce methane.<br><br>Statement II is true because the simplest unsaturated hydrocarbon is ethene ($\\text{C}_2\\text{H}_4$), which upon hydrogenation yields ethane, meaning methane cannot be prepared from unsaturated hydrocarbons. Additionally, the Wurtz reaction involves the coupling of two alkyl halide molecules to form an alkane with at least two carbon atoms ($2\\text{RX} + 2\\text{Na} \\rightarrow \\text{R}-\\text{R} + 2\\text{NaX}$), so methane cannot be prepared by this method.<br><br>Therefore, Statement I is false but Statement II is true.<br><br>Answer: Statement I is false but Statement II is true", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "d13880c3b7514f6bba4a7f0343d213bc", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/3sVfwkKnDFSI9.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/3sVfwkKnDFSI9.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "69d806e28b80d82dea5b7dd9", "title": "JEE Main 2026 (06 April Shift 1)", "shortName": "2026 (06 April Shift 1)", "isVisible": true, "heldOn": "2026-04-06T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542cb87c09d044e4c1a375", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-02T14:00:00.000Z", "isVisible": true, "shortName": "2025 (2 Apr Shift 2)", "title": "JEE Main 2025 (2 Apr Shift 2)"}], "question": {"text": "Given below are two statements :<br />Statement (I) : Neopentane forms only one monosubstituted derivative.<br />Statement (II) : Melting point of neopentane is higher than n-pentane<br />In the light of 14bf2d97609", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T14:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 2)", "title": "JEE Main 2025 (22 Jan Shift 2)"}], "question": {"text": "The alkane from below having two secondary hydrogens is :", "image": null}, "options": [{"id": "z9mTy", "text": "4-Ethyl-3,4-dimethyloctane", "image": null, "isCorrect": false}, {"id": "m7c2d", "text": "2,2,3,3-Tetramethylpentane", "image": null, "isCorrect": true}, {"id": "fMbzC", "text": "2,2,4,5-Tetramethylheptane", "image": null, "isCorrect": false}, {"id": "H47DO", "text": "2,2,4,4-Tetramethylhexane", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/PPA3I7bTwkUpvoM49AP9U1QgIhp30r-PiA9o-mE5NgA.original.fullsize.png\"><br>", "image": null}, "videoSolution": {"videoId": "e6fb7b925b5646a0b62f4be946b366bc", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/a8gMQBXGs7RuN.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/a8gMQBXGs7RuN.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5ca6d4514bf2d97609", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-22T14:00:00.000Z", "isVisible": true, "shortName": "2025 (22 Jan Shift 2)", "title": "JEE Main 2025 (22 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd17ba0e94a3c4025a72", "type": "numerical", "level": 2, "questionLabels": [], "question": {"text": "Total number of isomeric compounds (including stereoisomers) formed by monochlorination of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>-methylbutane is ______.", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "<p>Monochlorination means the substitution of a chlorine. When chlorine atom is added to the below structure, chlorine will substitute at one of the hydrogen.</p><p>Mono chlorination of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>-methyl butane gives four structural isomers.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5641f60d-8e46-4590-870c-9e90204e6a58.png\" style=\"width: 649px; height: 188px;\"/></p><p>Here only two, i.e., I and III are optically active. Since each optically active compound has two enantiomers, therefore, total six isomeric compounds are possible.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb07", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 2)", "title": "JEE Main 2024 (01 Feb Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb07", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 2)", "title": "JEE Main 2024 (01 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd16ba0e94a3c4025a71", "type": "numerical", "level": 3, "questionLabels": [], "question": {"text": "Number of alkanes obtained on electrolysis of a mixture of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mi>COONa</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub><mi>COONa</mi></math> is_____.", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<p>An aqueous solution of sodium or potassium salt of carboxylic acid is electrolysed in this reaction, resulting in the dissociation of the salt into a carboxylate ion and sodium or potassium ions. </p><p>The total number of different alkanes are formed when the following mixture is subjected to electrolysis:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>COONa</mi><mfenced><mi>aq</mi></mfenced></msub><mo> </mo><mi>and</mi><mo> </mo><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub><msub><mi>COONa</mi><mfenced><mi>aq</mi></mfenced></msub></math> </p><p>In this ethane, butane and propane are formed.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mi>COONa</mi><mo>→</mo><mover><mi mathvariant=\"normal\">C</mi><mo>∙</mo></mover><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub><mi>COONa</mi><mo>→</mo><msub><mover><mi mathvariant=\"normal\">C</mi><mo>∙</mo></mover><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mover><mi mathvariant=\"normal\">C</mi><mo>∙</mo></mover><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub><mo>→</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">C</mi><msub><mover><mi mathvariant=\"normal\">H</mi><mo>∙</mo></mover><mn>3</mn></msub><mo>→</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi mathvariant=\"normal\">C</mi><mo>∙</mo></mover><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><mo>+</mo><msub><mover><mi mathvariant=\"normal\">C</mi><mo>∙</mo></mover><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub><mo>→</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub></math></p><p>So, the total number of alkanes formed here will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd19ba0e94a3c4025a81", "type": "singleCorrect", "level": 3, "questionLabels": [], "question": {"text": "<p>The final product A formed in the following multistep reaction sequence is</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0d2318ce-ffc7-49c5-adac-b494670514a9.png\" style=\"width: 516px; height: 214px;\"/></p>", "image": null}, "options": [{"id": "EwPnl", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3aeb3488-2ef7-4ec6-9db9-19448da632e3.png\" style=\"width: 190px; height: 127px;\"/>", "image": null, "isCorrect": true}, {"id": "s0b6g", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1ec5c816-5949-4e18-be51-f2ee5fa4fad8.png\" style=\"width: 262px; height: 172px;\"/>", "image": null, "isCorrect": false}, {"id": "DfwfC", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c87f037e-5866-4261-91a0-1c2c0e8e08bf.png\" style=\"width: 273px; height: 136px;\"/>", "image": null, "isCorrect": false}, {"id": "AtWuB", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/cb0f8b00-66a3-479d-a1be-261d617c7d93.png\" style=\"width: 355px; height: 139px;\"/>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>During the reaction, first addition of water takes place according to Markownikoff's rule, alcohol is formed, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CrO</mi><mn>3</mn></msub></math> acts as an oxidising agents which converts alcohol into ketone, then Wolf Kishner reduction occurs.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/acef85d2-00e3-4c5c-8a36-c3ea1dc1953a.png\" style=\"width: 600px; height: 266px;\"/></p><p>Hence option A is the answer.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d685ce", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}], "question": {"text": "The major product formed in the following reaction is<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/44c8fa92-0b4a-4908-932d-423ce9006c50.png\" style=\"width: 400px; height: 65px;\" /><br />A.&nbsp;<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7d790448-d5a9-40c3-bb2a-797d2d27eb72.png\" style=\"width: 270px; height: 68px;\" /><br />B.&nbsp;<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b14461ea-541c-4f35-8e3f-a423c4db8d26.png\" style=\"width: 270px; height: 78px;\" /><br />C.&nbsp;<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f1a6b206-a726-4532-b131-6555bc8c4d1d.png\" style=\"width: 270px; height: 79px;\" /><br />D.&nbsp;<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/50eb6e8e-ebcc-4b76-a296-724f1642688b.png\" style=\"width: 180px; height: 136px;\" /><br />choose the correct answer from the options Given below:", "image": null}, "options": [{"id": "8zeBi", "text": "B only", "image": null, "isCorrect": false}, {"id": "g3Jxa", "text": "A only", "image": null, "isCorrect": true}, {"id": "Xaiy4", "text": "C only", "image": null, "isCorrect": false}, {"id": "K7mCB", "text": "D only", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The carbonyl compounds undergo Clemmenson&#39;s reduction in the presence of zinc amalgam and concentrated hydrochloric acid to form alkanes.&nbsp; The reagent in the Clemmenson&#39;s reduction effects the acid sensitive functional group. In the given reactant hydroxy group undergo dehydration to give alkene as shown below.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c87f71e0-afc7-42eb-8f2b-670c38c1d81f.png\" style=\"width: 509px; height: 88px;\" /></p>", "image": null}, "videoSolution": {"videoId": "e3d9454f61fe421bb948106fd50e65bf", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/poUQvLxUPulBg.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/poUQvLxUPulBg.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d685c9", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}], "question": {"text": "Given below are two statements, one is labelled as Assertion <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math> and the other is labelled&nbsp;as Reason <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math>.<br />Assertion <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math>:&nbsp;<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/8799f308-dd6f-4a38-958a-526a708a6013.png\" style=\"width: 101px; height: 93px;\" />can be subjected to Wolff-Kishner reduction to give&nbsp;<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c0999f29-3bcb-49a0-8aee-761a2963131e.png\" style=\"width: 104px; height: 80px;\" /><br />Reason <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math>: Wolff-Kishner reduction is used to convert&nbsp;<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/87c115b1-12ae-40ab-bd83-dede2dfc72b0.png\" style=\"width: 70px; height: 65px;\" />&nbsp;into&nbsp;<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/10198b14-d874-47e0-9e3c-c2f64e20bb67.png\" style=\"width: 100px; height: 51px;\" /><br />In the light of the above statements, choose the correct answer from the options given below:", "image": null}, "options": [{"id": "fSuZh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math> is true but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> is false", "image": null, "isCorrect": false}, {"id": "XxdD1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math> is false but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> is true", "image": null, "isCorrect": true}, {"id": "bOTEP", "text": "Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> are true and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> is the correct explanation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math>", "image": null, "isCorrect": false}, {"id": "C6Z8w", "text": "Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> are true and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">R</mi></math> is NOT the correct explanation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"bold\">A</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The reagent hydrazine in alkaline medium is used in the Wolff-Kishner reduction reaction. In this reaction aldehydes and ketone converts to respective alkanes.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/847d4718-67f2-4c71-b939-fc0b8f180e3c.png\" style=\"width: 252px; height: 83px;\" /></p><p>This reaction is not good for base sensitive groups in the carbonyl compounds.&nbsp; The following chloro carbonyl compound give alkene as elimination reaction expected in basic medium.</p><p>&nbsp;<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/92c6d5e7-53a9-4df2-a873-b0e5e11474db.png\" style=\"width: 343px; height: 93px;\" /></p>", "image": null}, "videoSolution": {"videoId": "b0984a8773014df4a358d65da8cf4b11", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/fi4DkbtBEIMxc.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/fi4DkbtBEIMxc.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionStructure": ["ASSERTION_REASON"], "syllabusCategory": "noChange", "previousYear": {"_id": "648b5a3a0d9d0b909f7b6493", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 2)", "title": "JEE Main 2023 (11 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d6829d", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b11", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 1)", "title": "JEE Main 2023 (31 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Choose the correct set of reagents for the following conversion<br />trans<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>Ph</mi><mo>-</mo><mi>CH</mi><mo>=</mo><mi>CH</mi><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub></mrow></mfenced><mo>&#8594;</mo><mtext>&#160;cis&#160;</mtext><mfenced><mrow><mi>Ph</mi><mo>-</mo><mi>CH</mi><mo>=</mo><mi>CH</mi><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub></mrow></mfenced></math>", "image": null}, "options": [{"id": "CILxC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Br</mi><mn>2</mn></msub><mo>,</mo><mtext>&#160;alc&#160;</mtext><mi>KOH</mi><mo>,</mo><msub><mi>NaNH</mi><mn>2</mn></msub><mo>,</mo><mi>Na</mi><mfenced><msub><mi>LiqNH</mi><mn>3</mn></msub></mfenced></math>", "isCorrect": false, "image": null}, {"id": "4t7L2", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Br</mi><mn>2</mn></msub><mtext>, alc&#160;</mtext><mi>KOH</mi><mo>,</mo><msub><mi>NaNH</mi><mn>2</mn></msub><mo>,</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math></p><p>Lindlar Catalyst</p>", "isCorrect": true, "image": null}, {"id": "h66Tm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Br</mi><mn>2</mn></msub><mo>,</mo><mi>aqKOH</mi><mo>,</mo><msub><mi>NaNH</mi><mn>2</mn></msub><mo>,</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math>&nbsp;Lindlar Catalyst", "isCorrect": false, "image": null}, {"id": "RxDIq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Br</mi><mn>2</mn></msub></math>, aq <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>KOH</mi><mo>,</mo><msub><mi>NaNH</mi><mn>2</mn></msub><mo>,</mo><mi>Na</mi><mfenced><msub><mi>LiqNH</mi><mn>3</mn></msub></mfenced></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>A trans alkene can be converted to a vicinal dihalide through a halogenation reaction. The vicinal dihalide can undergo double elimination to afford an alkyne. The alkyne can undergo partial reduction to give a cis alkene.</p><p>The reagents needed to convert&nbsp;trans<i><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>Ph</mi><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mi>CH</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mi>CH</mi><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>)</mo></math></i>&nbsp;to&nbsp;cis-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>Ph</mi><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mi>CH</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mi>CH</mi><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>)</mo></math>&nbsp;are shown in the reaction scheme below.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f915bf6b-e308-4d86-ad84-ed0ebbb3f799-9896079.png\" style=\"width: 600px; height: 431px;\" /></p><p>&nbsp;</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b11", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 1)", "title": "JEE Main 2023 (31 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68238", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Given below are two statements: One is labelled as Assertion A and the other is labelled as Reason R.</p><p><strong>Assertion A:&nbsp;</strong><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5cb32239-26a6-4ba8-9874-82ff838ac8c7-image.png\" style=\"width: 90px; height: 68px;\" />&nbsp;can be easily reduced using <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Zn</mi><mo>-</mo><mi>Hg</mi><mo>/</mo><mi>HCl</mi></math> to&nbsp;<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f2c5f34d-3d49-4f15-83eb-626fbafa5a94-image.png\" style=\"width: 80px; height: 52px;\" /></p><p><strong>Reason R:</strong> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Zn</mi><mo>-</mo><mi>Hg</mi><mo>/</mo><mi>HCl</mi></math> is used to reduce carbonyl group to &ndash;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>2</mn></msub></math> &ndash; group.</p><p>In the light of the above statements, choose the correct answer from the options given below:</p>", "image": null}, "options": [{"id": "Lnbfp", "text": "A is false but R is true", "isCorrect": true, "image": null}, {"id": "1HE8K", "text": "A is true but R is false", "isCorrect": false, "image": null}, {"id": "AFXxy", "text": "Both A and R are true but R is not the correct explanation of A", "isCorrect": false, "image": null}, {"id": "zec41", "text": "Both A and R are true and R is the correct explanation of A", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Clemmensen reduction: The carbonyl group of aldehydes and ketones is reduced to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>2</mn></msub></math>&nbsp;group on treatment with zinc-amalgam and concentrated hydrochloric acid.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/91fee4df-c1da-444d-b3c6-fd19cfa37c31-9896024.png\" style=\"width: 500px; height: 124px;\" /></p><p>The acid sensitive alcohol group reacts with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HCl</mi></math>, hence Clemmenson reduction is not suitable for above conversion.</p><p>So, assertion is false but reason is true.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["ASSERTION_REASON"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6807d", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000 y": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6801b", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Given below are two statements :</p><p><strong>Statement I :</strong></p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/46cc5333-58da-4b37-9f69-7634c90424d9-9894221.PNG\" style=\"width: 132px; height: 76px;\" />&nbsp;under&nbsp;Clemmensen reduction conditions will give&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3c66641b-313d-48c8-b4f9-8b9a43267f19-9894221_1.PNG\" style=\"width: 165px; height: 36px;\" /></p><p><strong>Statement II :</strong></p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fbd520f7-f3a8-4813-981f-161871d1f692-9894221_2.PNG\" style=\"width: 104px; height: 86px;\" />&nbsp;under Wolff-Kishner&nbsp;reduction condition will give&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/15bed215-85d8-42bd-97a6-6ca3e141b1d5-9894221_3.PNG\" style=\"width: 104px; height: 56px;\" /></p><p>In the light of the above statements, choose the correct answer from the options given below :</p>", "image": null}, "options": [{"id": "E7sfC", "text": "Statement I is false but Statement II is true", "isCorrect": false, "image": null}, {"id": "nYOKk", "text": "Both Statement I and Statement II are false", "isCorrect": false, "image": null}, {"id": "dE8Lj", "text": "Statement I is true but Statement II is false", "isCorrect": true, "image": null}, {"id": "FNY85", "text": "Both Statement I and Statement II are true", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The Clemmensen reduction is a reaction that is used to reduce aldehydes or ketones to alkanes using hydrochloric acid and zinc amalgam. In this reaction amide can undergo hydrolysis to convert into carboxylic acid.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/db2f7dc2-4686-45ba-a5f8-8557ebc197cc-image.png\" style=\"width: 464px; height: 86px;\" /></p><p>The Wolff&ndash;Kishner reduction is a reaction used in organic chemistry to convert carbonyl functionalities into methylene groups in the presence of hydrazine in basic medium. Due to the alkaline medium, alkyl halides undergo beta elimination to convert into alkene as shown below.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7281e158-681d-4565-a5af-4f9454704846-image.png\" style=\"width: 495px; height: 92px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66b4b", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf804", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-05T09:00:00.000Z", "isVisible": true, "shortName": "2020 (05 Sep Shift 1)", "title": "JEE Main 2020 (05 Sep Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>In the following reaction sequence the major products <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\ : "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}], "question": {"text": "Clemmensen reduction of a ketone is carried out in the presence of :", "image": null}, "options": [{"id": "KMAdt", "text": "\n$\\mathrm{LiAlH}_4$\n", "image": null, "isCorrect": false}, {"id": "IJgCh", "text": "\n$\\mathrm{Zn}-\\mathrm{Hg}$ with $\\mathrm{HCl}$\n", "image": null, "isCorrect": true}, {"id": "o5iKS", "text": "\nGlycol with $\\mathrm{KOH}$\n", "image": null, "isCorrect": false}, {"id": "DjPYr", "text": "\n$\\mathrm{H}_2$ with $\\mathrm{Pt}$ as catalyst", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1Uy8MtwNKUPe_bOZun2ceP84CttffQA-0rq-1V3JH50.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a1f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}], "question": {"text": "The reaction, $\\mathrm{CH}_3 \\mathrm{CHO} \\frac{[\\mathrm{H}]}{\\mathrm{Zn}(\\mathrm{Hg}) / \\text { Conc. } \\mathrm{HCl}} \\mathrm{CH}_3 \\mathrm{CH}_3$", "image": null}, "options": [{"id": "u4B7n", "text": "\nCannizaro's reaction\n", "image": null, "isCorrect": false}, {"id": "Lpv1F", "text": "\nRosenmund reduction\n", "image": null, "isCorrect": false}, {"id": "mY37p", "text": "\nWolf-Kishner reduction\n", "image": null, "isCorrect": false}, {"id": "irUQG", "text": "\nClemmenson reduction", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The reaction given is a Clemenson reduction.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ce", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2012 (12 May Online)", "title": "JEE Main 2012 (12 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d655cb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "Which one of the following has the minimum boiling point?", "image": null}, "options": [{"id": "nNcVe", "text": "\nn-butane\n", "image": null, "isCorrect": false}, {"id": "307iQ", "text": "\nisobutane\n", "image": null, "isCorrect": true}, {"id": "z7hAY", "text": "\n1- butene\n", "image": null, "isCorrect": false}, {"id": "WOXkH", "text": "\n1- butyne", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "648b5a74417cc3fb48d693bd", "title": "Reactions of alkanes", "totalQuestions": 23, "questions": [{"_id": "69d8074381239f6567c4f3ae", "type": "numerical", "question": {"text": "An alkane $(Y)$ requires $8$ moles of oxygen for complete combustion and on chlorination with Cl$_2$/h$\\nu$, $(Y)$ gives only one monochlorinated product $(Z)$. The total number of primary carbon atoms in $(Y)$ is __________.", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "The general formula of an alkane is $C_n H_{2n+2}$.<br><br>The balanced chemical equation for the complete combustion of an alkane is:<br><br>$C_n H_{2n+2} + \\left(\\dfrac{3n+1}{2}\\right) O_2 \\rightarrow n CO_2 + (n+1) H_2O$<br><br>Given that $8$ moles of oxygen are required for complete combustion:<br><br>$\\dfrac{3n+1}{2} = 8$<br><br>$3n + 1 = 16$<br><br>$n = 5$<br><br>The molecular formula of the alkane $(Y)$ is $C_5H_{12}$.<br><br>Since $(Y)$ yields only one monochlorinated product $(Z)$ upon reaction with $Cl_2/h\\nu$, all the hydrogen atoms in the alkane must be equivalent.<br><br>Among the isomers of $C_5H_{12}$ (n-pentane, isopentane, and neopentane), only 2,2-dimethylpropane (neopentane) has all equivalent hydrogen atoms.<br><br>The structure of neopentane is $C(CH_3)_4$.<br><br>In this structure, the central carbon is quaternary, and the four surrounding methyl carbons are primary carbon atoms.<br><br>Therefore, the total number of primary carbon atoms in $(Y)$ is $4$.<br><br>Answer: $4$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "b48e527327294bcea5fedbcd2bb0242d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/NreRGUjaI27YP.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/NreRGUjaI27YP.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dda", "title": "JEE Main 2026 (06 April Shift 2)", "shortName": "2026 (06 April Shift 2)", "isVisible": true, "heldOn": "2026-04-06T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8072f81239f6567c4f2c5", "type": "singleCorrect", "question": {"text": "The compound (X) on<br>(i) on heating in the presence of anhydrous $AlCl_3$ and HCl gas gives $2,4$-dimethyl pentane<br>(ii) aromatization gives toluene and<br>(iii) cyclisation gives methyl cyclohexane<br>The correct name of compound (X) is:", "image": null}, "options": [{"id": "Dy0p6", "text": "Hept-2-ene", "isCorrect": false, "image": null}, {"id": "50AIR", "text": "Hept-1,3,5-triene", "isCorrect": false, "image": null}, {"id": "VRISN", "text": "Heptane", "isCorrect": true, "image": null}, {"id": "cIqQD", "text": "Hept-2,4,6-triene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Compound (X) undergoes isomerization on heating with anhydrous $AlCl_3$ and HCl gas to give branched-chain alkanes. The formation of $2,4$-dimethylpentane (a $7$-carbon branched alkane) indicates that (X) is a $7$-carbon straight-chain alkane.<br><br>Aromatization of n-heptane at high temperature and pressure in the presence of oxides of V, Mo, or Cr supported over alumina gives toluene.<br><br>Cyclisation of n-heptane under similar conditions initially yields methylcyclohexane, which can further undergo dehydrogenation to form toluene.<br><br>Since all these reactions are characteristic of n-heptane, compound (X) is heptane.<br><br>Answer: Heptane", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "df47b0d44cf248cc8b6bd13bad1c74a6", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/yGst9ivUrdN5I.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/yGst9ivUrdN5I.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd4", "title": "JEE Main 2026 (02 April Shift 2)", "shortName": "2026 (02 April Shift 2)", "isVisible": true, "heldOn": "2026-04-02T14:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "69d8075d81239f6567c4f4db", "type": "numerical", "question": {"text": "One mole of an alkane (x) requires $8$ mole oxygen for complete combustion. Sum of number of carbon and hydrogen atoms in the alkane (x) is _______.", "image": null}, "options": [], "correctValue": "17", "solution": {"text": "The general formula of an alkane is $C_n H_{2n+2}$.<br><br>The balanced chemical equation for the complete combustion of an alkane is:<br><br>$C_n H_{2n+2} + \\left(\\dfrac{3n+1}{2}\\right) O_2 \\rightarrow n CO_2 + (n+1) H_2O$<br><br>Given that $1$ mole of the alkane requires $8$ moles of oxygen for complete combustion, we equate the stoichiometric coefficient of $O_2$ to $8$:<br><br>$\\dfrac{3n+1}{2} = 8$<br><br>$3n + 1 = 16$<br><br>$3n = 15$<br><br>$n = 5$<br><br>The molecular formula of the alkane is $C_5H_{12}$.<br><br>The number of carbon atoms is $5$ and the number of hydrogen atoms is $12$.<br><br>Sum of the number of carbon and hydrogen atoms $= 5 + 12 = 17$.<br><br>Answer: $17$", "image": null}, "level": 2, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "168f51e77e274b2899c2b7460663732a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/KFUVTKoULqoUT.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/KFUVTKoULqoUT.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "69d806e28b80d82dea5b7dd3", "title": "JEE Main 2026 (02 April Shift 1)", "shortName": "2026 (02 April Shift 1)", "isVisible": true, "heldOn": "2026-04-02T09:00:00.000Z"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68542cb87c09d044e4c1a374", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "6852f2ff9d87935e0d80978d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2025 (3 Apr Shift 1)", "title": "JEE Main 2025 (3 Apr Shift 1)"}], "question": {"text": "0.5 g of an organic compound on combustion gave 1.46 g of $\\mathrm{CO}_2$ and 0.9 g of $\\mathrm{H}_2 \\mathrm{O}$. The percentage of carbon in the compound is _______. (Nearest integer) [Given : Molar mass (in $\\mathrm{g} \\mathrm{mol}^{-1}$) $\\mathrm{C}: 12, \\mathrm{H}: 1$, O: 16]", "image": null}, "options": [], "correctValue": "80", "solution": {"text": "Organic $\\rightarrow \\mathrm{CO}_2$<br />Compound<br />Applying POAC on ' C '<br />(mole) of ' C ' in compound $=\\mathrm{n}_{\\mathrm{CO}_2} \\times 1$<br />So mass of '  $\\mathrm{H}-\\mathrm{Br}_{(\\mathrm{aq})}$ at the fastest rate?\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/JFljPFUyzLVBWu0y1iz93-nyB8X4TYqW4V226NIzbWo.original.fullsize.png\"/><br/>", "image": null}, "options": [{"id": "jYPw0", "text": "R", "image": null, "isCorrect": false}, {"id": "kKUsc", "text": "P", "image": null, "isCorrect": false}, {"id": "OXFRo", "text": "Q", "image": null, "isCorrect": true}, {"id": "Gl8aP", "text": "S", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Addition of $\\mathrm{H}-\\mathrm{Br}_{(\\mathrm{aq})}$ to alkene follows electrophilic addition mechanism. In the rate determining step a carbocation intermediate is formed. Among $\\mathrm{P}, \\mathrm{Q}$, R \\& S compound Q will form most stable carbocation intermediate since it is resonance stabilized.\n\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/OmDZb8mAnORkTQL_FzLcrPg1MkWTZ4qvYk1eornrp9Y.original.fullsize.png\"><br>", "image": null}, "videoSolution": {"videoId": "7914148084904bd8a55cd421d894cd19", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/frM6goD29KGlf.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/frM6goD29KGlf.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67a2eb5ca6d4514bf2d9760c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2025-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2025 (24 Jan Shift 1)", "title": "JEE Main 2025 (24 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "67a2ee9dc8b73881fdaea168", "type": "singleCorrect", "level": 1, "questionLabels": [], "previous ", "level": 3, "questionLabels": [], "question": {"text": "Number of isomeric products formed by monochlorination of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>-methylbutane in presence of sunlight is _______.", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "<p>Monochlorination means the addition of a chlorine atom. When chlorine atom is added to the below structure. Chlorine will substitute at one of the hydrogens</p><p>Mono chlorination of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>-methyl butane gives four structural isomers.<br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/53b446a6-88a5-4215-9b78-5cbac48bb681.png\" style=\"width: 600px; height: 277px;\"/></p><p>Here only two, i.e., I and III are optically active. Since each optically active compound has two enantiomers, therefore, total six isomeric compounds are possible.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo></math> Number of isomeric products <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>6</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 2)", "title": "JEE Main 2024 (31 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 2)", "title": "JEE Main 2024 (31 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d68673", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6494", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-13T09:00:00.000Z", "isVisible": true, "sho #160;</mo><mi mathvariant=\"normal\">g</mi></math> of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math>&nbsp;was produced. The molar mass of compound is _____&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>gmol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> (Nearest integer)", "image": null}, "options": [], "correctValue": "200", "solution": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> is the molar mass of the compound <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi mathvariant=\"normal\">g</mi><mo>/</mo><mi>mol</mi></mrow></mfenced></math><br />mass of compound <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mi>mole</mi><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mi>molecular</mi><mo>&#160;</mo><mi>mass</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>0</mn><mo>.</mo><mn>01</mn><mi mathvariant=\"normal\">M</mi><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math></p><p>mass of carbon <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn><mo>.</mo><mn>01</mn><mi mathvariant=\"normal\">M</mi><mo>&#215;</mo><mfrac><mn>60</mn><mn>100</mn></mfrac></math>&nbsp;....(i)</p><p>moles of carbon <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mi>mass</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi>compound</mi></mrow><mrow><mi>molecular</mi><mo>&#160;</mo><mi>mass</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi>carbon</mi></mrow></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>01</mn><mi mathvariant=\"normal\">M</mi></mrow><mn>12</mn></mfrac><mo>&#215;</mo><mfrac><mn>60</mn><mn>100</mn></mfrac></math>&nbsp; ....(ii)</p><p>Thus, moles of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CO</mi><mn>2</mn></msub></math>&nbsp;from combustion <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>4</mn><mo>.</mo><mn>4</mn></mrow><mn>44</mn></mfrac><mo>=</mo></math>0.1 moles of carbon dioxide</p><p>Using POAC,<br />Thus, from (i) and (ii),<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>01</mn><mi mathvariant=\"normal\">M</mi></mrow><mn>12</mn></mfrac><mo>&#215;</mo><mfrac><mn>60</mn><mn>100</mn></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mo>.</mo><mn>4</mn></mrow><mn>44</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">M</mi><mo>=</mo><mfrac><mrow><mn>4</mn><mo>.</mo><mn>4</mn></mrow><mn>44</mn></mfrac><mo>&#215;</mo><mfrac><mn>100</mn><mn>60</mn></mfrac><mo>&#215;</mo><mfrac><mn>12</mn><mrow><mn>0</mn><mo>.</mo><mn>01</mn></mrow></mfrac><mo>=</mo><mn>200</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>/</mo><mi>mol</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68183", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "When a hydrocarbon <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> undergoes combustion in the presence of air, it requires <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn><mo>.</mo><mn>5</mn></math> equivalents of oxygen and produces <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> equivalents of water. What is the molecular formula of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>?", "image": null}, "options": [{"id": "C534X", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>8</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>6</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "RQmnz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>9</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>9</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "bivB4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>6</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>6</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "yNwMI", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>9</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>6</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">x</mi></msub><msub><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">y</mi></msub><mo>+</mo><mfenced><mrow><mi mathvariant=\"normal\">x</mi><mo>+</mo><mfrac><mi mathvariant=\"normal\">y</mi><mn>4</mn></mfrac></mrow></mfenced><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#8594;</mo><msub><mi>xCO</mi><mn>2</mn></msub><mo>+</mo><mfrac><mi mathvariant=\"normal\">y</mi><mn>2</mn></mfrac><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math></p><p>Number of equivalents of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>&nbsp;= Number of equivalents of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math></p><p>Number of equivalents of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>&nbsp;=&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">y</mi><mn>2</mn></mfrac><mo>=</mo><mn>3</mn><mo>&#160;</mo><mo>&#8658;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">y</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>6</mn></math></p><p>Number of equivalents of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math>&nbsp;=&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>+</mo><mfrac><mi mathvariant=\"normal\">y</mi><mn>4</mn></mfrac><mo>=</mo><mo>&#160;</mo><mn>9</mn><mo>.</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mfrac><mn>6</mn><mn>4</mn></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>9</mn><mo>.</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>9</mn><mo>.</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">x</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>9</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>1</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>8</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>8</mn><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">y</mi><mo>=</mo><mn>6</mn></math>.</p><p>So, the formula is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>8</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>6</mn></msub></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68088", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d3579fb4-9c16-43d8-a231-930ac739d37e-9894725.PNG\" style=\"width: 420px; height: 71px;\" /></p><p>The correct sequence of reagents for the preparation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> is:</p>", "image": null}, "options": [{"id": "3MmLu", "text": "(i)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Cr</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>,</mo><mo>&#160;</mo><mn>770</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>,</mo><mo>&#160;</mo><mn>20</mn><mo>&#160;</mo><mi>atm</mi></math>; (ii)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CrO</mi><mn>2</mn></msub><msub><mi>Cl</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msup><mi mathvariant=\"normal\">O</mi><mo>+</mo></msup></math>; (iii)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math>; (iv)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msup><mi mathvariant=\"normal\">O</mi><mo>+</mo></msup></math>", "isCorrect": true, "image": null}, {"id": "IG6O3", "text": "(i)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CrO</mi><mn>2</mn></msub><msub><mi>Cl</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msup><mi mathvariant=\"normal\">O</mi><mo>+</mo></msup></math>; (ii)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Cr</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>,</mo><mo>&#160;</mo><mn>770</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi><mo>,</mo><mo>&#160;</mo><mn>20</mn><mo>&#160;</mo><mi>atm</mi></math>; (iii)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math>; (iv)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msup><mi mathvariant=\"normal\">O</mi><mo>+</mo></msup></math>", "isCorrect": false, "image": null}, {"id": "ofbuf", "text": "(i)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KMnO</mi><mn>4</mn></msub><mo>,</mo><mo>&#160;</mo><msup><mi>OH</mi><mo>-</mo></msup></math>; (ii)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Mo</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">&#916;</mi></math>; (iii)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math>; (iv)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msup><mi mathvariant=\"normal\">O</mi><mo>+</mo></msup></math>", "isCorrect": false, "image": null}, {"id": "U3SSH", "text": "(i)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Mo</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">&#916;</mi></math>; (ii)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CrO</mi><mn>2</mn></msub><msub><mi>Cl</mi><mn>2</mn></msub><mo>,</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msup><mi mathvariant=\"normal\">O</mi><mo>+</mo></msup></math>; (iii)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math>; (iv)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msup><mi mathvariant=\"normal\">O</mi><mo>+</mo></msup></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>It is a sequence of reactions where heptane is oxidised to methyl benzene, further oxidised to benzaldehyde,&nbsp;and finally cannizzaro reaction occurs to give the desired product.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/de1383f0-284a-4555-ba72-f7681356e0de-6cde4d31-7c89-4ae9-ae60-a7247449c6f1-9894725_.PNG\" style=\"width: 512px; height: 357px;\" />&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67976", "previousYearPapers": [{"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 1)", "title": "JEE Main 2022 (26 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>Cl</mi><mo>&#729;</mo></mover><mo>+</mo><msub><mi>CH</mi><mn>4</mn></msub><mo>&#8594;</mo><mi mathvariant=\"normal\">A</mi><mo>+</mo><mi mathvariant=\"normal\">B</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> in the above atmospheric reaction step are</p>", "image": null}, "options": [{"id": "7SmMD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>6</mn></msub></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Cl</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "wijqK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi mathvariant=\"normal\">C</mi><mo>&#729;</mo></mover><msub><mi>HCl</mi><mn>2</mn></msub></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "2WE0t", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><msub><mi>CH</mi><mn>3</mn></msub><mo>&#729;</mo></mover></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HCl</mi></math>", "isCorrect": true, "image": null}, {"id": "MfNh2", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>6</mn></msub></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HCl</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>In summer season, chlorine atoms&nbsp;forming chlorine sinks, preventing much ozone depletion, whereas In winter, special type of clouds called polar stratospheric clouds are formed over Antarctica.</p><p><math xmlns=\"http://www.w3.org/1998/M iant=\"normal\">&#160;</mi><mn>5</mn><mo>/</mo><mn>25</mn></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>So</mi><mo>,</mo><mo>&#160;</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">x</mi><mo>+</mo><mfrac><mi mathvariant=\"normal\">y</mi><mn>4</mn></mfrac></mrow></mfenced><mn>5</mn><mo>=</mo><mn>25</mn></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>+</mo><mfrac><mi mathvariant=\"normal\">y</mi><mn>4</mn></mfrac><mo>=</mo><mn>5</mn></math>,<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>which</mi><mi mathvariant=\"normal\">&#160;</mi><mi>is</mi><mi mathvariant=\"normal\">&#160;</mi><mi>satisfied</mi><mi mathvariant=\"normal\">&#160;</mi><mi>by</mi><mi mathvariant=\"normal\">&#160;</mi><msub><mi mathvariant=\"normal\">C</mi><mn>3</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>8</mn></msub></math>.<br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7df", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2016 (09 Apr Online)", "title": "JEE Main 2016 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "648b5a73417cc3fb48d693b8", "title": "Properties and Preparation of Alkenes", "totalQuestions": 20, "questions": [{"_id": "69d8076281239f6567c4f51c", "type": "singleCorrect", "question": {"text": "IUPAC name of the some alkenes are given below. Find out the correct stability order.<br>A. 2-Methylbut-2-ene<br>B. cis-But-2-ene<br>C. 2,3-Dimethylbut-2-ene<br>D. Prop-1-ene<br>Choose the correct answer from the options given below :", "image": null}, "options": [{"id": "jdfQk", "text": "C > A > B > D", "isCorrect": true, "image": null}, {"id": "JXEMe", "text": "C > A > D > B", "isCorrect": false, "image": null}, {"id": "0QhR9", "text": "B > D > A > C", "isCorrect": false, "image": null}, {"id": "0tRSc", "text": "A > B > C > D", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The stability of alkenes is directly proportional to the number of $\\alpha$-hydrogen atoms due to hyperconjugation.<br><br>Let us count the number of $\\alpha$-hydrogen atoms in each given alkene:<br><br>A. 2-Methylbut-2-ene: $(CH_3)_2C=CHCH_3$<br>Number of $\\alpha$-hydrogen atoms = $3 + 3 + 3 = 9$<br><br>B. cis-But-2-ene: $CH_3CH=CHCH_3$<br>Number of $\\alpha$-hydrogen atoms = $3 + 3 = 6$<br><br>C. 2,3-Dimethylbut-2-ene: $(CH_3)_2C=C(CH_3)_2$<br>Number of $\\alpha$-hydrogen atoms = $3 + 3 + 3 + 3 = 12$<br><br>D. Prop-1-ene: $CH_3CH=CH_2$<br>Number of $\\alpha$-hydrogen atoms = $3$<br><br>Since the stability of an alkene increases with the number of $\\alpha$-hydrogen atoms, the correct stability order is C > A > B > D.<br><br>Answer: C > A > B > D", "image": null}, "level": 1, "previousYearPapers": [{"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026-04-05T14:00:00.000Z"}], "questionLabels": [], "videoSolution": {"videoId": "5f6c73e93be04e12a4dfaa547a3239c1", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/TYFxcbWBCACXD.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/TYFxcbWBCACXD.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Main (Imp. PYQs from 2023 - 2019)"}, "questionStructure": ["SEQUENCE_ORDER"], "syllabusCategory": "noChange", "previousYear": {"_id": "69d806e28b80d82dea5b7dd8", "title": "JEE Main 2026 (05 April Shift 2)", "shortName": "2026 (05 April Shift 2)", "isVisible": true, "heldOn": "2026 48b5a6d417cc3fb48d67c4c", "previousYearPapers": [{"_id": "63134c746e7bc9b332483706", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 1)", "title": "JEE Main 2022 (28 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Identify the correct statement for the below given transformation.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/28121efb-f5d4-4213-ae97-7ec752a249b7-image.png\" style=\"width: 497px; height: 80px;\" /></p>", "image": null}, "options": [{"id": "R93lQ", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi>CH</mi><mo>=</mo><mi>CH</mi><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>,</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi>CH</mi><mo>=</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>,</mo></math>&nbsp;Saytzeff products</p>", "isCorrect": false, "image": null}, {"id": "MZuez", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi>CH</mi><mo>=</mo><mi>CH</mi><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>,</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi>CH</mi><mo>=</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>,</mo></math><br />Hafmann products</p>", "isCorrect": false, "image": null}, {"id": "5zjUn", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi>CH</mi><mo>=</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>,</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi>CH</mi><mo>=</mo><msub><mi>CHCH</mi><mn>3</mn></msub><mo>,</mo></math><br />Hofmann products</p>", "isCorrect": true, "image": null}, {"id": "htCW5", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi>CH</mi><mo>=</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>,</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi>CH</mi><mo>=</mo><msub><mi>CHCH</mi><mn>3</mn></msub><mo>,</mo></math><br />Saytzeff products</p>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>The Hofmann rule states that the major alkene product is the least substituted and least stable product when it comes to asymmetrical amines.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7a300eb1-c5e0-4262-8589-43153527d18b-image.png\" style=\"width: 451px; height: 140px;\" /></p><p>So, major product will be pent-1-ene and minor product will be pent-2-ene.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483706", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 1)", "title": "JEE Main 2022 (28 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d677b8", "previousYearPapers": [{"_id": "62c481f001514d218a7934d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T14:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 2)", "title": "JEE Main 2022 (24 Jun Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Given below are two statements.</p><p>Statement I: The presence of weaker <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#960;</mi></math>-bonds make alkenes less stable than alkanes</p><p>Statement II: The strength of the double bond is greater than that of carbon-carbon single bond.</p><p>In the light of the above statements, choose the correct answer from the options : given below.</p>", "image": null}, "options": [{"id": "n9JSv", "text": "Both Statement I and Statement II are correct.", "isCorrect": true, "image": null}, {"id": "F7wHv", "text": "Both Statement I and Statement II are incorrect.", "isCorrect": false, "image": null}, {"id": "0tVbM", "text": "Statement I is correct but Statement II is incorrect.", "isCorrect": false, "image": null}, {"id": "oSQPI", "text": "Statement I is incorrect but Statement II is correct.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>As sigma bond is formed along the internuclear axis it is stronger than pi-bond, and due to the presence of pi-bonds alkenes will be more reactive towards electrophilic reagents.Hence they are less stable than alkanes.</p><p>The strength of carbon-carbon double bond is greater than single bond as bond strength is directly proportional to bond order.</p><p>Hence, both the statements are correct.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "62c481f001514d218a7934d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T14:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 2)", "title": "JEE Main 2022 (24 Jun Shift 2)"}, "evalStatus": "notAttemp
