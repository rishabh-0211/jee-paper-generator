hich cannot undergo Friedel-Crafts reactions is: ________.\ntoluene, nitrobenzene, xylene, cumene, aniline, chlorobenzene, \\(m\\)-nitroaniline, \\(m\\)-dinitrobenzene", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "Compounds which can not undergo Friedel Crafts reaction are\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1GQr2wTB1M_n_Mbbsl0PQLXSQ1_8eVu0Ij_XC3YK_as.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ef278297dee60eda71", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 Apr Shift 2)", "title": "JEE Main 2024 (09 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446722970e6e9ab542d087", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T14:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 2)", "title": "JEE Main 2024 (05 Apr Shift 2)"}], "question": {"text": "Identify \\(A\\) and \\(B\\) in the given chemical reaction sequence :\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/KLJItgjEYFaRD00-RrnYsf01t2k0WkMt2fWE_cLQGnY.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "aYAD6", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/CVtd-Zt1ovdjFSc6OlpJ06mB_BhrmPEdCsf012nIonM.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "CYAmG", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/CdFD7dL51ZYCm12cQnq92h9Amr5HY01BBl1657AyGLE.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "sBSKv", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/GW-ZhYUIQOz1pnkBGNQUBB0XBmHUyzWIYsdcChILPEw.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "E61eE", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/OW-R_yQLCxjdxJWdXo9I7fQbZaJaof3viCw1Sr3XzMs.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/nkjS1PTGTEi8E5qq1XUVOqvgLwvoDfBvMBkWtszv9FM.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda6b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T14:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 2)", "title": "JEE Main 2024 (05 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66446718970e6e9ab542d02b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda6a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T09:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 1)", "title": "JEE Main 2024 (05 Apr Shift 1)"}], "question": {"text": "Given below are two statements:\nStatement I : Nitration of benzene involves the following step -\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/NtBqR50bkUGBuZTqMxwt8kotGzQRRI6AvwKJLf0IWtI.original.fullsize.png\"><br />Statement II : Use of Lewis base promotes the electrophilic substitution of benzene. In the light of the above statements, choose the most appropriate answer from the options given below :", "image": null}, "options": [{"id": "rBxrn", "text": "Statement I is correct but Statement II is incorrect", "image": null, "isCorrect": true}, {"id": "rkV6I", "text": "Statement I is incorrect but Statement II is correct", "image": null, "isCorrect": false}, {"id": "HL8cA", "text": "Both Statement I and Statement II are correct", "image": null, "isCorrect": false}, {"id": "TZnEX", "text": "Both Statement I and Statement II are incorrect", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In nitration of benzene concentrated $\\mathrm{H}_2 \\mathrm{SO}_4$ and $\\mathrm{HNO}_3$ is used as reagent which generates electrophile $\\mathrm{N}_2$ in following steps:\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/trZlbEBbqm5ay2m4fDwBGirAkzibpJd-0An86hW93aU.original.fullsize.png\"><br />Lewis acids can promote the formation of electrophiles not Lewis base", "image": null}, "videoSolution": null, "questionStructure": ["TWO_STATEMENT_BASED"], "syllabusCategory": "noChange", "previousYear": {"_id": "664466ee278297dee60eda6a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T09:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 1)", "title": "JEE Main 2024 (05 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd19ba0e94a3c4025a80", "type": "singleCorrect", "level": 1, "questionLabels": [], "question": {"text": "Which of the following compound will most easily be attacked by an electrophile?", "image": null}, "options": [{"id": "3TO8W", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/790eef58-bc1c-46e0-a813-5a77d46fbffc.png\" style=\"width: 80px; height: 95px;\"/>", "image": null, "isCorrect": false}, {"id": "2QQlm", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ae6066ac-bb71-410d-84d5-784211c8b7c5.png\" style=\"width: 134px; height: 109px;\"/>", "image": null, "isCorrect": false}, {"id": "AgJjl", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b52daada-16cc-475a-a47c-9d9bc2ff9088.png\" style=\"width: 119px; height: 106px;\"/>", "image": null, "isCorrect": false}, {"id": "KzXGZ", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a4a5c518-95c2-4352-a11d-068e4666a243.png\" style=\"width: 128px; height: 106px;\"/>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Ortho, para directing groups are electron-donating groups; meta directing groups are electron-withdrawing groups. The halide ions, which are electron-withdrawing but ortho, para directing, are the exception.</p><p>Here <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>OH</mi></math> group is strong electron donating group. Hence electrophile can easily give electron.</p><p><math><mo>-</mo><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></math> group in phenol can release electrons to the ring better than <math><mo>-</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></math> group in toluene. <math><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi></math> atom has electron withdrawing effect which inhibits electrophile attack readily.</p><p><br/><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/76de71f0-1dcd-4dba-99b5-ef165f66bbf6.png\" style=\"width: 566px; height: 112px;\"/></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb06", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 1)", "title": "JEE Main 2024 (01 Feb Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb06", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 1)", "title": "JEE Main 2024 (01 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd16ba0e94a3c4025a70", "type": "numerical", "level": 1, "questionLabels": [], "question": {"text": "<p>Total number of deactivating groups in aromatic electrophilic substitution reaction among the following is</p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3f55f8df-2452-4c98-8186-2d104fde87c6.png\" style=\"width: 700px; height: 173px;\"/>", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "<p>Atoms or groups that make the benzene molecule more reactive by increasing the ring's electron density are called <strong>activating groups.</strong></p><p>An atom or group that makes the benzene molecule less reactive by removing electron density from the ring acts as a <strong>deactivating group. </strong>Deactivating groups direct incoming electrophiles to the meta position. Deactivating groups decreases the rate of reaction relative to H. If the atom of the group attached to benzene ring has pi bond then that group act as deactivating group.</p><p>Hence,  <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>CN</mi><mo>,</mo><mo> </mo><mo>-</mo><msub><mi>COCH</mi><mn>3</mn></msub></math> are deactivating groups.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a7660155-da79-477c-b8d5-0b21722eb8aa.png\" style=\"width: 846px; height: 247px;\"/></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb06", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 1)", "title": "JEE Main 2024 (01 Feb Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb06", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2024 (01 Feb Shift 1)", "title": "JEE Main 2024 (01 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd19ba0e94a3c4025a7f", "type": "singleCorrect", "level": 3, "questionLabels": [], "question": {"text": "<p>Identify <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> in the following reaction sequence.</p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/15652e85-1fd8-4999-9d7e-b76838e1967d.png\" style=\"width: 500px; height: 170px;\"/>", "image": null}, "options": [{"id": "r9Lkt", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f5ecf5cc-cbbf-425e-8d67-5424b6995e78.png\" style=\"width: 601px; height: 214px;\"/>", "image": null, "isCorrect": true}, {"id": "iOjOd", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/577f2b31-d2e5-4a4a-b699-8ec783bb69a3.png\" style=\"width: 455px; height: 212px;\"/>", "image": null, "isCorrect": false}, {"id": "37tR2", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/caa0fdbf-9d1f-438a-867a-7c56fe5570db.png\" style=\"width: 494px; height: 211px;\"/>", "image": null, "isCorrect": false}, {"id": "6GVSx", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6652d6ac-4b7d-4144-9cfd-4da856e7d117.png\" style=\"width: 494px; height: 178px;\"/>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Bromobenzene is treated with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>conc</mi><mo>.</mo><mo> </mo><msub><mi>HNO</mi><mn>3</mn></msub></math> to give <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>, 4, 6 </mo><mi>trinitrophenol</mi></math> by electrophilic substitution reaction mechanism, which on reaction with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math> give trinitrophenol. It is also known as picric acid.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d843583a-718a-49ad-9b49-23041d60758f.png\" style=\"width: 734px; height: 451px;\"/></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 2)", "title": "JEE Main 2024 (31 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb05", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 2)", "title": "JEE Main 2024 (31 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd18ba0e94a3c4025a7e", "type": "singleCorrect", "level": 2, "questionLabels": [], "question": {"text": "The arenium ion which is not involved in the bromination of Aniline is", "image": null}, "options": [{"id": "N1dbA", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a829c74e-3efd-47c3-a5d2-fc1e8503a124.png\" style=\"width: 186px; height: 199px;\"/>", "image": null, "isCorrect": false}, {"id": "dAeP1", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/cf87737c-4418-494d-8d30-6f61e264ddc7.png\" style=\"width: 137px; height: 267px;\"/>", "image": null, "isCorrect": false}, {"id": "Zn75r", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/bb87782f-f7c6-454c-b98b-35e9a4829d75.png\" style=\"width: 186px; height: 200px;\"/>", "image": null, "isCorrect": true}, {"id": "sJJPD", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b86f812d-00c1-49dd-9c77-bc1a9f9364a5.png\" style=\"width: 182px; height: 219px;\"/>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p style=\"text-align: justify;\">Arenium ion: A carbocation formed by electrophilic attack on an aromatic ring, it is a reactive intermediate in electrophilic aromatic substitution. The formation of an arenium ion takes place by electrophilic attack on benzene.</p><p style=\"text-align: justify;\">As the delocalisation of electrons stops at an <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>sp</mi><mn>3</mn></msup></math> hybridized carbon atom, the arenium ion is not aromatic in nature. </p><p style=\"text-align: justify;\">Since <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mover><mi mathvariant=\"normal\">N</mi><mo>¨</mo></mover><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math> group is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">o</mi><mo>/</mo><mi mathvariant=\"normal\">p</mi></math> directing hence arenium ion will not be formed by attack at meta position i.e.</p><p style=\"text-align: justify;\"><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/462c6e2b-0072-42cd-b2f9-a57a303a53ef.png\" style=\"width: 170px; height: 218px;\"/></p><p style=\"text-align: justify;\">Hence, the answer is C.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68568", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6492", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 1)", "title": "JEE Main 2023 (11 Apr Shift 1)"}], "question": {"text": "<p>Arrange the following compounds in increasing order of rate of aromatic electrophilic substitution reaction.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6c8b0f83-54ad-4a3f-9004-b8a519c06153-image.png\" style=\"width: 500px; height: 137px;\" /></p><p>&nbsp;</p>", "image": null}, "options": [{"id": "I3qfG", "text": "d, b, c, a", "image": null, "isCorrect": false}, {"id": "rku8q", "text": "d, b, a, c", "image": null, "isCorrect": false}, {"id": "I38Df", "text": "b, c, a, d", "image": null, "isCorrect": false}, {"id": "vdxZx", "text": "c, a, b, d", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The more nucleophilic group will make ring more prone to aromatic substitution reaction. Benzene becomes more reactive towards Electrophilic Aromatic Substitution when any substituent raises its electron density.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/724db618-109f-4b81-8006-749e6e8f53cf-image.png\" style=\"width: 500px; height: 141px;\" /></p><p>In structure (a)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub></math>&nbsp;group shows&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mi mathvariant=\"normal\">H</mi></math>&nbsp;effect. while in (b)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>OH</mi></math>&nbsp;group shows&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mi mathvariant=\"normal\">R</mi></math>&nbsp;effect. In (c)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mi mathvariant=\"normal\">R</mi></math>&nbsp;effect is shown by functional group and in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">d</mi><mo>)</mo></math>&nbsp;both&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>OH</mi><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><mo>-</mo><mi mathvariant=\"normal\">O</mi><mo>-</mo></math>&nbsp;show&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mi mathvariant=\"normal\">R</mi></math>&nbsp;effect.&nbsp;</p><p>So Correct increasing order is :</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">c</mi><mo>&#160;</mo><mo>&#60;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">a</mi><mo>&#160;</mo><mo>&#60;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">b</mi><mo>&#160;</mo><mo>&#60;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">d</mi></math></p>", "image": null}, "videoSolution": null, "questionStructure": ["SEQUENCE_ORDER"], "syllabusCategory": "noChange", "previousYear": {"_id": "648b5a3a0d9d0b909f7b6492", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 Apr Shift 1)", "title": "JEE Main 2023 (11 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67f6b", "previousYearPapers": [{"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "&lsquo;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>&rsquo; is:&nbsp;<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/31ce1611-750d-4eef-9c30-db3ac83827ef-9896855.png\" style=\"width: 500px; height: 151px;\" />&nbsp;", "image": null}, "options": [{"id": "KUkVJ", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/58d4eb65-d934-4c16-9869-1506c2c549f2-9896855_A.png\" style=\"width: 150px; height: 332px;\" />&nbsp;", "isCorrect": true, "image": null}, {"id": "LdPZA", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e5200b6c-d26a-45b9-9692-086d16ec8e89-9896855_B.png\" style=\"width: 150px; height: 255px;\" />&nbsp;", "isCorrect": false, "image": null}, {"id": "4JC2g", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/cb0b5d78-0195-4a24-bcef-89c26416b6fd-9896855_C.png\" style=\"width: 150px; height: 255px;\" />&nbsp;", "isCorrect": false, "image": null}, {"id": "lKr0K", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e0adfc28-69d8-466b-a136-bdf5c7b2643d-9896855_D.png\" style=\"width: 150px; height: 255px;\" />&nbsp;", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>When benzene reacts with&nbsp;methylidenecyclohexane, the product X is formed.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/bc592609-ca49-40e6-a86b-f478953f715f-9896855_S.png\" style=\"width: 500px; height: 255px;\" />&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d6798a", "previousYearPapers": [{"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 1)", "title": "JEE Main 2022 (26 Jul Shift 1)"}], "type": "numerical", "level": 3, "question": {"text": "In the presence of sunlight, benzene reacts with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>Cl</mi><mn>2</mn></msub></math> to give product, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>. The number of hydrogens in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math> is", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "<blockquote><p>In the presence of ultraviolet light (but without a catalyst present), hot benzene will also undergo<i>&nbsp;</i>an addition reaction with chlorine. The ring delocalisation is permanently broken, and a chlorine atom adds on to each carbon atom.&nbsp;1,2,3,4,5,6-hexachlorocyclohexane or benzenehexachloride&nbsp;is formed as a product. It is&nbsp;an example of free radical addition reaction.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6e263a11-5a0d-4e48-8ee3-6e9fe132deb1-9755162_S.png\" style=\"width: 400px; height: 175px;\" /></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 1)", "title": "JEE Main 2022 (26 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67bf0", "previousYearPapers": [{"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>Product &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39; of following sequence of reactions is</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/35e4a07b-8f8c-4234-8c1a-f31014ac0f0e-image.png\" style=\"width: 450px; height: 98px;\" /></p>", "image": null}, "options": [{"id": "RxUlI", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/bc4a928b-bded-4b61-bf82-d7b41554a127-image.png\" style=\"width: 100px; height: 149px;\" />", "isCorrect": false, "image": null}, {"id": "boRR4", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3af17e56-2eab-4d1f-91b0-c25a45430c17-image.png\" style=\"width: 100px; height: 163px;\" />", "isCorrect": false, "image": null}, {"id": "Qcfjf", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/28946a68-8461-4076-abda-b712eaf29eb1-image.png\" style=\"width: 80px; height: 180px;\" />", "isCorrect": false, "image": null}, {"id": "s8Sw8", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/13fa77d1-d395-4597-913c-18813b769e25-image.png\" style=\"width: 90px; height: 160px;\" />", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>In the first step ethyl benzene undergoes electrophilic substitution reaction to form&nbsp;1-Bromo-4-ethylbenzene.</p><p>In the next&nbsp;step&nbsp;1-Bromo-4-ethylbenzene undergoes free radical substitution at benzylic position followed by dehydrohalogenation(last step) in presence of alcoholic KOH to form 4-bromo styrene.</p><p>&nbsp;</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d21191c7-7593-49f2-8a81-7c48c7ad3639-Untitled.png\" style=\"width: 430px; height: 510px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}, "evalStatus": "correct", "lastPracticed": "2024-12-14T07:56:53.441Z"}, {"_id": "648b5a6d417cc3fb48d67a88", "previousYearPapers": [{"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Halogenation of which one of the following will yield m-substituted product with respect to methyl group as a major product?", "image": null}, "options": [{"id": "ubNaC", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a9803c33-7c46-49f6-ad8c-8306f000bd76-image.png\" style=\"width: 130px; height: 127px;\" />", "isCorrect": false, "image": null}, {"id": "WQ517", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7dd92e9e-6c15-4216-8edc-ef3d90b66728-image.png\" style=\"width: 130px; height: 134px;\" />", "isCorrect": false, "image": null}, {"id": "KhhKK", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/91f8bf99-41ab-4372-8021-1f6803d3a45e-image.png\" style=\"width: 130px; height: 121px;\" />", "isCorrect": true, "image": null}, {"id": "O4EqX", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6c897a0e-21fd-4858-b617-1bcb2ab6d1f2-image.png\" style=\"width: 130px; height: 132px;\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Electrophile will attack at ortho and Para position with respect to better Electron releasing group(ERG)</p><p>ERG : &ndash; OH &gt; &ndash; CH<sub>3</sub></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1dc288b3-99fb-4f32-bb07-34b8d2828c64-image.png\" style=\"width: 160px; height: 134px;\" /></p><p>Para position with respect to group <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>OH</mi></math>&nbsp;group&nbsp;and it will be meta position with respect to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub></math> group.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d67599", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 2)", "title": "JEE Main 2021 (27 Aug Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>The major product (A) formed in the reaction given below is :</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/39f4292c-7c00-458d-8c4d-58541a6a71a0-aa3e3603-987e-4f50-a289-5ec53e72ac40-image.png\ 360-b07a-4b6a-b656-1f002da56617-image.png\" style=\"width: 298px; height: 350px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf80b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T14:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 2)", "title": "JEE Main 2021 (25 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d672ce", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T14:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 2)", "title": "JEE Main 2021 (25 Feb Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>The major product of the following reaction is :</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/462fe586-0f8c-4548-be9d-ff6640b7dbce-image.png\" style=\"width: 155px; height: 83px;\" /></p>", "image": null}, "options": [{"id": "afvb5", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/206722f4-fbad-4039-8630-1767ffb9cded-image.png\" style=\"width: 108px; height: 83px;\" />", "isCorrect": false, "image": null}, {"id": "Dv7bz", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b3b2ab41-d6f9-48d4-a302-63ad81da7b7c-image.png\" style=\"width: 98px; height: 83px;\" />", "isCorrect": false, "image": null}, {"id": "2pzgp", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5228e4d2-c1e7-4202-8c6c-c3706276a671-image.png\" style=\"width: 124px; height: 68px;\" />", "isCorrect": true, "image": null}, {"id": "Ldxf9", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c95196ec-d392-4993-ac17-527e5ccde6d4-image.png\" style=\"width: 119px; height: 81px;\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7159cdd1-ca17-44a7-856b-6e3666691912-image.png\" style=\"width: 253px; height: 116px;\" />", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf80b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T14:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 2)", "title": "JEE Main 2021 (25 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d672c4", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T14:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 2)", "title": "JEE Main 2021 (25 Feb Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/47c9d024-eb5d-48ed-b79e-0b3399d4fc37-image.png\" style=\"width: 470px; height: 135px;\" /></p><p>Correct statement about the given chemical reaction is</p>", "image": null}, "options": [{"id": "QxZ1C", "text": "Reaction is possible and compound (A) will be major product.", "isCorrect": true, "image": null}, {"id": "mZ1fp", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mover><mi mathvariant=\"normal\">N</mi><mo>&#168;</mo></mover><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math> group is ortho and para directive, so product (B) is not possible.", "isCorrect": false, "image": null}, {"id": "IHihP", "text": "Reaction is possible and compound&nbsp;(B) will be the major product.", "isCorrect": false, "image": null}, {"id": "tdLDH", "text": "The reaction will form sulphonated product instead of nitration.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Reaction is possible and compound (A) will be major product.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2d1b7fd0-e3b1-43ee-bd30-c5a0ec5110b2-image.png\" style=\"width: 339px; height: 133px;\" /></p><p>Due to formation of anilinium ion by acid base reaction m-product is form as considerable amount.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/8bd05f8b-fab7-420d-ac05-50699b196092-image.png\" style=\"width: 209px; height: 153px;\" /></p><p>Nitration of aniline in strong acidic medium also gives m-nitroaniline because in acidic (strong) medium aniline is present as anilinium ion.&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf80b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T14:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 2)", "title": "JEE Main 2021 (25 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d67268", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 1)", "title": "JEE Main 2021 (25 Feb Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Which of the following reaction/s will not give <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> -aminoazobenzene?</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0731b88d-aa27-4669-aeda-00ed5cad0294-image.png\" style=\"width: 264px; height: 356px;\" /></p>", "image": null}, "options": [{"id": "zof8l", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;only", "isCorrect": true, "image": null}, {"id": "d7dCY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;only", "isCorrect": false, "image": null}, {"id": "mU2GW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math>&nbsp;only", "isCorrect": false, "image": null}, {"id": "fqZIG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>In basic or neutral medium <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi><mo>-</mo><mi mathvariant=\"normal\">N</mi></math> coupling favourable while in slightly acidic medium <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CN</mi></math> coupling favourable.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/232797a8-db5d-4593-9dd3-f8b49cca2263-image.png\" style=\"width: 444px; height: 742px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf80a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Feb Shift 1)", "title": "JEE Main 2021 (25 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d67213", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf809", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Feb Shift 2)", "title": "JEE Main 2021 (24 Feb Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>The correct order of the following compounds showing increasing tendency towards nucleophilic substitution reaction is:</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/95e69d57-0ce2-4afa-b42b-b383c80b0b56-image.png\" style=\"width: 335px; height: 139px;\" /></p>", "image": null}, "options": [{"id": "1tEZB", "text": "(iv) &lt; (i) &lt;&nbsp;(ii) &lt;&nbsp;(iii)", "isCorrect": false, "image": null}, {"id": "5Eoaj", "text": "(i) &lt; (ii) &lt;&nbsp;(iii) &lt;&nbsp;(iv)", "isCorrect": true, "image": null}, {"id": "k3rW3", "text": "(iv) &lt; (i) &lt;&nbsp;(iii) &lt;&nbsp;(ii)", "isCorrect": false, "image": null}, {"id": "Lpn5j", "text": "(iv) &lt; (iii) &lt;&nbsp;(ii) &lt;&nbsp;(i)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>For nucleophile substitution in aromatic halides</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a0c743fc-932b-4d1e-bc6c-41f12c8dce29-image.png\" style=\"width: 335px; height: 139px;\" /></p><p>Correct order is:</p><p>(i) &lt; (ii) &lt;&nbsp;(iii) &lt;&nbsp;(iv)</p><p>More No. of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NO</mi><mn>2</mn></msub></math> substituted aromatic halide, increase the rate of nucleophile substitution reaction in aromatic halides.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "questionStructure": ["SEQUENCE_ORDER"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92edde3d91842a5cf809", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Feb Shift 2)", "title": "JEE Main 2021 (24 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d6720c", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf809", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Feb Shift 2)", "title": "JEE Main 2021 (24 Feb Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "What is the correct sequence of reagents used for converting nitrobenzene into <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">m</mi></math>-dibromobenzene?<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0fda6791-1c81-4103-ac66-b953b9029d73-image.png\" style=\"width: 293px; height: 110px;\" /></p>", "image": null}, "options": [{"id": "IbS0l", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mo>&#8594;</mo><mrow><mi>Sn</mi><mo>/</mo><mi>HCl</mi></mrow></mover><mo>/</mo><mover><mo>&#8594;</mo><mi>KBr</mi></mover><mo>/</mo><mover><mo>&#8594;</mo><msub><mi>Br</mi><mn>2</mn></msub></mover><mo>/</mo><mover><mo>&#8594;</mo><msup><mi mathvariant=\"normal\">H</mi><mo>+</mo></msup></mover></math>", "isCorrect": false, "image": null}, {"id": "Z4gBa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mo>&#8594;</mo><mrow><msub><mi>Br</mi><mn>2</mn></msub><mo>/</mo><mi>Fe</mi></mrow></mover><mo>/</mo><mover><mo>&#8594;</mo><mrow><mi>Sn</mi><mo>/</mo><mi>HCl</mi></mrow></mover><mo>/</mo><mover><mo>&#8594;</mo><mrow><msub><mi>NaNO</mi><mn>2</mn></msub><mo>/</mo><mi>HCl</mi></mrow></mover><mo>/</mo><mover><mo>&#8594;</mo><mrow><mi>CuBr</mi><mo>/</mo><mi>HBr</mi></mrow></mover></math>", "isCorrect": true, "image": null}, {"id": "vvU2A", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mo>&#8594;</mo><msub><mi>NaNO</mi><mn>2</mn></msub></mover><mo>/</mo><mover><mo>&#8594;</mo><mi>HCl</mi></mover><mo>/</mo><mover><mo>&#8594;</mo><mi>KBr</mi></mover><mo>/</mo><mover><mo>&#8594;</mo><msup><mi mathvariant=\"normal\">H</mi><mo>+</mo></msup></mover></math>", "isCorrect": false, "image": null}, {"id": "TvmjP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mo>&#8594;</mo><mrow><mi>Sn</mi><mo>/</mo><mi>HCl</mi></mrow></mover><mo>/</mo><mover><mo>&#8594;</mo><msub><mi>Br</mi><mn>2</mn></msub></mover><mo>/</mo><mover><mo>&#8594;</mo><msub><mi>NaNO</mi><mn>2</mn></msub></mover><mo>/</mo><mover><mo>&#8594;</mo><mi>NaBr</mi></mover></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The process of conversion of primary aromatic amines into its&nbsp;diazonium&nbsp;salt is called&nbsp;diazotization.&nbsp;</p><p>Diazonium&nbsp;salts are important synthetic intermediates that can undergo coupling&nbsp;reactions&nbsp;to form azo dyes and electrophilic substitution&nbsp;reactions&nbsp;to introduce functional groups.</p><p>The&nbsp;correct sequence of reagents used for converting nitrobenzene into m- dibromobenzene is found in option (b).</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/aefa6f34-12ff-4a77-af80-87730cc54f35-image.png\" style=\"width: 373px; height: 353px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf809", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Feb Shift 2)", "title": "JEE Main 2021 (24 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d671c2", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf808", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Feb Shift 1)", "title": "JEE Main 2021 (24 Feb Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>In the following reaction, the reason why meta-nitro product also formed is:</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0a29dd07-4d41-4b69-afe6-a8cd0256d4e2-image.png\" style=\"width: 500px; height: 205px;\" /></p>", "image": null}, "options": [{"id": "k904X", "text": "Formation of anilinium ion", "isCorrect": true, "image": null}, {"id": "oe13Y", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><msub><mi>NH</mi><mn>2</mn></msub></math> group is highly meta-directive", "isCorrect": false, "image": null}, {"id": "tGm1H", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><msub><mi>NO</mi><mn>2</mn></msub></math> substitution always takes place at meta-position", "isCorrect": false, "image": null}, {"id": "CP4IW", "text": "low temperature", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f36c78f9-1c96-4d4d-960e-1d6041874178-image.png\" style=\"width: 400px; height: 194px;\" /></p><p>Aniline on protonation gives anilinium ion which is meta directing. So considerable amount of meta product is formed.</p><p>Direct nitration of aniline yields tarry oxidation products in addition to the nitro derivatives. Moreover, in the strongly acidic medium, aniline is protonated to form the anilinium ion which is meta directing. That is why besides the ortho and para derivatives, significant amount of meta derivative is also formed.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf808", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Feb Shift 1)", "title": "JEE Main 2021 (24 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d671b6", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf808", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-02-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Feb Shift 1)", "title": "JEE Main 2021 (24 Feb Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Which of the following compound gives pink colour on reaction with phthalic anhydride in conc. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>SO</mi><mn>4</mn></msub></math> followed by treatment with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>NaOH</mi></math>?", "image": null}, "options": [{"id": "hiDgC", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/74bef9a0-18c9-4df6-bec5-38ad3ddd74a6-image.png\" style=\"width: 162px; height: 85px;\" />", "i ModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf805", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-05T14:00:00.000Z", "isVisible": true, "shortName": "2020 (05 Sep Shift 2)", "title": "JEE Main 2020 (05 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d669cc", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7ff", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-02T14:00:00.000Z", "isVisible": true, "shortName": "2020 (02 Sep Shift 2)", "title": "JEE Main 2020 (02 Sep Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>&nbsp;The major product of the following reaction is:</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2593e0be-3d91-4ca9-b88f-b799ab286a8b-image.png\" style=\"width: 487px; height: 164px;\" /></p>", "image": null}, "options": [{"id": "MS3Ra", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/078d9c0b-14ce-444d-ae52-01e1553bf20d-image.png\" style=\"width: 200px; height: 147px;\" />", "isCorrect": false, "image": null}, {"id": "LUfkr", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/18176eae-0580-4bd6-ac81-55c3cc0e31e6-image.png\" style=\"width: 200px; height: 142px;\" />", "isCorrect": false, "image": null}, {"id": "E6zlX", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/9dc9a58e-983c-4fb0-8940-da380fc6c0e0-image.png\" style=\"width: 200px; height: 190px;\" />", "isCorrect": true, "image": null}, {"id": "8CAIl", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ee1d0790-3f14-4203-a52b-14380cd76136-image.png\" style=\"width: 200px; height: 185px;\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>&nbsp;This is electrophilic substitution reaction which is determine by electronic effect of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>OH</mi><mo>\\</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>\\</mo><msub><mi>NO</mi><mn>2</mn></msub></math>.<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/14570784-5d58-4f77-9bbc-ba7fa1461a6e-image.png\" style=\"width: 531px; height: 201px;\" /></p><p>Electrophilic attacks in influence of activating group&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>OH</mi></math>&nbsp;so it is attached at para position with respect to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>OH</mi></math>&nbsp;group.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7ff", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-02T14:00:00.000Z", "isVisible": true, "shortName": "2020 (02 Sep Shift 2)", "title": "JEE Main 2020 (02 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66d5b", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7fb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-08T14:00:00.000Z", "isVisible": true, "shortName": "2020 (08 Jan Shift 2)", "title": "JEE Main 2020 (08 Jan Shift 2)"}], "type": "numerical", "level": 3, "question": {"text": "In the following sequence of reactions the maximum number of atoms present in molecule &lsquo; <math><mi>C</mi></math> &rsquo; in one plane is_______<br /><math><mi mathvariant=\"normal\">A</mi><mover><mrow><munder><mrow><mo>&#8594;</mo></mrow><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">u</mi><mtext>&#8201;</mtext><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">e</mi></mrow></munder></mrow><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">d</mi><mtext>&#8201;&#8201;</mtext><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi></mrow></mover><mi mathvariant=\"normal\">B</mi><mover><mrow><munder><mrow><mo>&#8594;</mo></mrow><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">s</mi><mtext>&#8201;</mtext><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></munder></mrow><mrow><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi><mfenced separators=\"|\"><mrow><mn>1</mn><mo>.</mo><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">q</mi></mrow></mfenced></mrow></mover><mi mathvariant=\"normal\">C</mi></math><br />(A is a lowest molecular weight alkyne)", "image": null}, "options": [], "correctValue": "13", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1df33e53-d0bd-4518-877f-02d6eee79a17.png\" /><br />Number of atoms in one plane = <math><mn>13</mn></math>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7fb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-08T14:00:00.000Z", "isVisible": true, "shortName": "2020 (08 Jan Shift 2)", "title": "JEE Main 2020 (08 Jan Shift 2)"}, "evalStatus": "incorrect", "lastPracticed": "2024-12-14T07:47:54.060Z"}, {"_id": "648b5a66417cc3fb48d6666f", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 2)", "title": "JEE Main 2019 (10 Apr Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>The major product obtained in the given reaction is:</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d946ea41-68dc-4df3-9486-7d28223a926a-image.png\" style=\"width: 500px; height: 76px;\" /></p>", "image": null}, "options": [{"id": "XP8zi", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2a7c0713-f91d-4011-8a11-77c400e55be0-image.png\" style=\"width: 500px; height: 115px;\" />", "isCorrect": false, "image": null}, {"id": "OzXgj", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/569090a3-47cf-428c-9d31-a0a8d7f9648b-image.png\" style=\"width: 200px; height: 165px;\" />", "isCorrect": false, "image": null}, {"id": "keqDi", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/dd313fd1-8d0c-4080-8c82-e955d80d7875-image.png\" style=\"width: 400px; height: 99px;\" />", "isCorrect": false, "image": null}, {"id": "WKOMz", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/be5bfdb2-4c2a-4cf8-bcfb-d03cfd9945e3-image.png\" style=\"width: 200px; height: 138px;\" />", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>We know that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>AlCl</mi><mn>3</mn></msub></math>&nbsp;is a lewis acid. It can give Friedel Crafts reactions.&nbsp;Here, we can see that&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>AlCl</mi><mn>3</mn></msub></math>&nbsp;acts as a lewis acid and accepts the electron pair from the chlorine atom. This forms<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8722;</mo><msub><mi>AlCl</mi><mn>4</mn></msub><mo>.</mo></math>&nbsp;Alongside this, a carbocation is also formed.</p><p>Now, this carbocation is an electrophilic carbon. So, benzene rings can give electrophilic substitution reactions here. So, as a result, the double bond of benzene will attack on the carbocation and a C-C bond will be formed there. Then after losing a proton, the carbon ring becomes aromatic. This, we obtain a compound which has two ring structures. One ring is aromatic and the other is not aromatic.</p><p>Friedel-Craft alkylation takes place to give a six membered ring.<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/63bfa5e0-9906-40fc-a13e-5d39a16cd2c8-7391c478-7a54-4f22-b819-6cc5cc2074b9-image.png\" style=\"width: 500px; height: 234px;\" /></p>", "image": null}, "videoSolution": {"videoId": "d1446f6dc45547f1a494ff2cc866c6d9", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/teazgQgaVbYLA.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/teazgQgaVbYLA.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 2)", "title": "JEE Main 2019 (10 Apr Shift 2)"}, "evalStatus": "incorrect", "lastPracticed": "2024-12-13T14:26:41.363Z"}, {"_id": "648b5a66417cc3fb48d665ff", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Apr Shift 1)", "title": "JEE Main 2019 (10 Apr Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The increasing order of the reactivity of the following compounds towards electrophilic aromatic substitution reactions is:<br /><img src= {"text": "<p><img height=\"71\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/89295506-a05d-47ae-9009-49950561ca15-image.png\" width=\"567\" /><br /><br />The final product is an isocyanide as the <math><mi>A</mi><mi>g</mi><mi>C</mi><mi>N</mi></math> bond has covalent nature, due to which <math><mi>C</mi></math> is unavailable for bond. Hence, N bonds with the benzylic carbon leading to formation of isocyanide.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 1)", "title": "JEE Main 2019 (09 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d66333", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr)", "title": "JEE Main 2018 (15 Apr)"}], "question": {"text": "The increasing order of nitration in the acidic medium of the following compounds is:<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/76945460-4730-4386-99b8-4268dcddad68-image.png\" style=\"width: 372px; height: 165px;\" />", "image": null}, "options": [{"id": "nMP7w", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mi mathvariant=\"normal\">a</mi></mfenced><mo>&#60;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">b</mi></mfenced><mo>&#60;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">d</mi></mfenced><mo>&#60;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">c</mi></mfenced></math>", "image": null, "isCorrect": true}, {"id": "FIb8v", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mi mathvariant=\"normal\">a</mi></mfenced><mo>&#60;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">b</mi></mfenced><mo>&#60;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">c</mi></mfenced><mo>&#60;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">d</mi></mfenced></math>", "image": null, "isCorrect": false}, {"id": "DlcRD", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mi mathvariant=\"normal\">b</mi></mfenced><mo>&#60;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">a</mi></mfenced><mo>&#60;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">c</mi></mfenced><mo>&#60;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">d</mi></mfenced></math>", "image": null, "isCorrect": false}, {"id": "opYe9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mi mathvariant=\"normal\">b</mi></mfenced><mo>&#60;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">a</mi></mfenced><mo>&#60;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">d</mi></mfenced><mo>&#60;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">c</mi></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><msub><mi>OCH</mi><mn>3</mn></msub><mo>=</mo><mo>+</mo><mi mathvariant=\"normal\">M</mi></math> effect so, ring activating group and ortho para directing.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>=</mo><mo>+</mo></math> hyperconjugation &amp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mi mathvariant=\"normal\">I</mi></math> so, ring activating group (ortho para directing).<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><mi>NH</mi><mn>2</mn><mo>=</mo></math>&nbsp;Here the aniline is the least reactive due to formation of anilinium ion in acidic medium. It will now act as strong <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi mathvariant=\"normal\">I</mi></math> group.<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8211;</mo><mi>Cl</mi><mo>=</mo><mo>&#8211;</mo><mi mathvariant=\"normal\">I</mi><mo>&#62;</mo><mo>+</mo><mi mathvariant=\"normal\">M</mi></math> so, ring deactivating &amp; meta directing.&nbsp;<br />&nbsp;", "image": null}, "videoSolution": null, "questionStructure": ["SEQUENCE_ORDER"], "syllabusCategory": "noChange", "previousYear": {"_id": "648b5a3a0d9d0b909f7b648a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr)", "title": "JEE Main 2018 (15 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d6627f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 1 Online)", "title": "JEE Main 2018 (15 Apr Shift 1 Online)"}], "question": {"text": "The increasing order of nitration of the following compounds is :\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/-8Oogn4zP7UrttZ7CImtKHJ-OWf82SdRj4nDHtfpvCk.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "wdn1W", "text": "\n$ < $ (B) $ < $ (D) $ < $ (C)", "image": null, "isCorrect": true}, {"id": "V2v19", "text": "\n$ < $ (B) $ < $ (C) $ < $ (D)", "image": null, "isCorrect": false}, {"id": "3sf9Q", "text": "\n$ < $ (A) $ < $ (C) $ < $ (D)", "image": null, "isCorrect": false}, {"id": "x7ppQ", "text": "\n$ < $ (A) $ < $ (D) $ < $ (C)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In the given substituted benzene rings, the substitutents methoxy $\\left(-\\mathrm{OCH}_3\\right)$ and amino $\\left(-\\mathrm{NH}_2\\right)$ are strongly activating groups while methyl $\\left(-\\mathrm{CH}_3\\right)$ is weakly activating and chloro $(-\\mathrm{Cl})$ is a deactivating group towards electrophilic aromatic substituation reaction. Since among methyl and methoxy group, methoxy group is more reactive than methyl group, (c) is more reactive than (d).\nAlthough amino group is strongly activating group, it gets protonated in presence of acid to form anilinium ion <img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d-01cCnLSDgXcOJxHbP8d0C7o24fqY5htp-sKykI7Cw.original.fullsize.png\"><br>  which is strongly deactivating. Hence, (a) is less reactive than (c) and (d). Chloro group is also deactivating group but less deactivating than<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d-01cCnLSDgXcOJxHbP8d0C7o24fqY5htp-sKykI7Cw.original.fullsize.png\"><br> . \nThus order is (a) $ < $ (b) $ < $ (d) $ < $ (c).\nNote:  \nThe activating groups increases the electron density on benzene ring and increases the rate of electrophilic aromatic substitution reaction. The deactivating groups decreases the electron density on benzene ring and decreases the rate of electrophilic aromatic substitution reaction.", "image": null}, "videoSolution": null, "questionStructure": ["SEQUENCE_ORDER"], "syllabusCategory": "noChange", "previousYear": {"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 1 Online)", "title": "JEE Main 2018 (15 Apr Shift 1 Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d6627c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 1 Online)", "title": "JEE Main 2018 (15 Apr Shift 1 Online)"}], "question": {"text": "The major product of the following reaction is\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0xx30QT2cDtXn6i5EYF_TJMvsyaQlMwiXuek8CRcMm4.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "xxhaw", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1RK4kopAOywS6zzfWz6CJ7Gp4VCaHHoLIwauO3HT31U.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "qqofX", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5FCFTXa52_LqmSfZUXMMJ73CQwkawms0pjUuK59M1fQ.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "QirPM", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/CwkRHSd2XMN3mJDBxVjjmlYwROGF2bBwu3ElCNnJ7i4.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "VepEP", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/FjmtUGxG1wQexk9JnXNMJj45bbde90VxVIgsHoDjI8k.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The major product of the reaction is given by the option (c).\nSince acid chloride is more reactive than alkyl halide $\\mathrm{-COCl}$ group will react first.\nIn the second step, Friedel Craft's alkylation occurs in a position that is ortho to alkoxy group and para to methoxy group. Both methoxy and alkoxy groups are ortho para directing groups.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fpaDQsbqFOPsp6zmlitBo-8VNrLgUU98bKLVnCgfKNc.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2018 (15 Apr Shift 1 Online)", "title": "JEE Main 2018 (15 Apr Shift 1 Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d6617d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2017 (08 Apr Online)", "title": "JEE Main 2017 (08 Apr Online)"}], "question": {"text": "Which of the following compounds will not undergo Friedel Crafts reaction with benzene?", "image": null}, "options": [{"id": "QNLJm", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/eddgzzpdqsufixjaxzqnrwknvltraqdjynqdrfomggddntwujv.jpeg\" />", "image": null, "isCorrect": true}, {"id": "AsFEF", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/rqhtmwswiuvdmcrgxqvbbismstbzrmdsouvajjyowdooubqyft.jpeg\" />", "image": null, "isCorrect": false}, {"id": "60dPz", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/spsxblkufabmofekozeddchaqhvjlymouivsbsoofydlbxmykv.jpeg\" />", "image": null, "isCorrect": false}, {"id": "BVgm0", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/lmzkaiuztgzsjuqanasamqtznnzylekoaqdkzhfcyyjxnrmidt.jpeg\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Formation of carbocation is not possible in case of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>2</mn></msub><mo>=</mo><mi>CHCl</mi></math>,​because partial double bond character is present in carbon and chlorine bond due to resonance between lone pair of chlorine atom and double bond.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2017 (08 Apr Online)", "title": "JEE Main 2017 (08 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d6611f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6489", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-02T09:00:00.000Z", "isVisible": true, "shortName": "2017 (02 Apr)", "title": "JEE Main 2017 (02 Apr)"}], "question": {"text": "Which of the following compounds will form significant amount of meta product during mono-nitration reaction?", "image": null}, "options": [{"id": "fTQs9", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f54d57f8-e832-414b-9861-9482a97454ef-image.png\" style=\"width: 100px; height: 110px;\" />", "image": null, "isCorrect": false}, {"id": "MGhH8", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e50a4396-afce-49c3-ae47-cd78d61cb361-image.png\" style=\"width: 90px; height: 129px;\" />", "image": null, "isCorrect": true}, {"id": "5UDKX", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/212d2ece-4093-4f7a-a77b-02518c550183-image.png\" style=\"width: 120px; height: 122px;\" />", "image": null, "isCorrect": false}, {"id": "zegBi", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5d0b1a6f-11af-42af-9b1b-25ac9be8b9a8-image.png\" style=\"width: 100px; height: 148px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e43d696b-ee4e-42f7-83a5-8f0e709f3288-image.png\" style=\"width: 400px; height: 170px;\" /></p><p><br />In&nbsp;a strong acidic medium acid-base reaction takes place so&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NH</mi><mn>2</mn></msub></math> group&nbsp;is converted to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover accent=\"true\"><mi mathvariant=\"normal\">N</mi><mo>+</mo></mover><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub></math> group.&nbsp;Due to the formation of anilinium ion, significant meta nitroaniline&nbsp;is also formed.<br />The net reaction can be written as follows,</p><p><img src=\"https://cdn-question- ": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c22", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-22T09:00:00.000Z", "isVisible": true, "shortName": "2013 (22 Apr Online)", "title": "JEE Main 2013 (22 Apr Online)"}], "question": {"text": "A major component of Borsch reagent is obtained by reacting hydrazine hydrate with which of the following ?", "image": null}, "options": [{"id": "2TvOd", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/gThXEaNogFuIoOaRO5q27DvaPrGlwo6LW9NF7U3E0Vc.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "AyAjm", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/EojC9Lr8jkzWyq-smlE7kB7WE9fNaNpRLt-qmxOTYTc.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "WZZgF", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/x7ZY35KI48s6cnXp2_re4rxYkUAT2xwdYruzAzCKxIQ.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "h3IiW", "text": "\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/_6BCuKM51sL2ohKpDp7j3U9wQeFXk6x_XBGA-iyJEWo.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The major component of Borsch reagent is 2,4- dinitrophenyl hydrazine which can be obtained by reaction of 2,4-dinitrochloro benzene and hydrazine\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/RRG8qBuKpt1U3eB-Jwk7N1jUCKZByAfjwEe-TXAtbBI.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/n-lxFT54f0PvQPDekDXp5G7QkLPI-8jeto7HfnBIb_c.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["defa     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Main';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer Type' : 'Single Correct Option'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
