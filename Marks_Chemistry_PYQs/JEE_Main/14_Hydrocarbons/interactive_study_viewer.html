297dee60eda6b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-05T14:00:00.000Z", "isVisible": true, "shortName": "2024 (05 Apr Shift 2)", "title": "JEE Main 2024 (05 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6644670e970e6e9ab542cfcb", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "664466ee278297dee60eda69", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 2)", "title": "JEE Main 2024 (04 Apr Shift 2)"}], "question": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/Uxcp7B_waixz_5eksMTTM7DfHyHZMwPFPvdZ1-_SAxY.original.fullsize.png\"><br />In the above chemical reaction sequence \" \\(\\mathrm{A}\\) \" and \" \\(\\mathrm{B}\\) \" respectively are", "image": null}, "options": [{"id": "FYJtZ", "text": "\\(\\mathrm{H}_2 \\mathrm{O}, \\mathrm{H}^{+}\\)and \\(\\mathrm{KMnO}_4\\)", "image": null, "isCorrect": false}, {"id": "j595h", "text": "\\(\\mathrm{O}_3, \\mathrm{Zn} / \\mathrm{H}_2 \\mathrm{O}\\) and \\(\\mathrm{NaOH}_{(\\text {alc) }} / \\mathrm{I}_2\\)", "image": null, "isCorrect": true}, {"id": "16kYy", "text": "\\(\\mathrm{O}_3, \\mathrm{Zn} / \\mathrm{H}_2 \\mathrm{O}\\) and \\(\\mathrm{KMnO}_4\\)", "image": null, "isCorrect": false}, {"id": "DS2PE", "text": "\\(\\mathrm{H}_2 \\mathrm{O}, \\mathrm{H}^{+}\\)and \\(\\mathrm{NaOH}_{(\\mathrm{alc})} / \\mathrm{I}_2\\)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/nkBLIW6MBikANwzX2grKoRSR54hhLWad1sIIntg9GtQ.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "664466ee278297dee60eda69", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-04-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 Apr Shift 2)", "title": "JEE Main 2024 (04 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd17ba0e94a3c4025a77", "type": "singleCorrect", "level": 3, "questionLabels": [], "question": {"text": "<p>The product (C) in the below mentioned reaction is:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><mi>Br</mi><munderover><mo>→</mo><mo>∆</mo><msub><mi>KOH</mi><mfenced><mi>alc</mi></mfenced></msub></munderover><mi mathvariant=\"normal\">A</mi><mover><mo>→</mo><mi>HBr</mi></mover><mi mathvariant=\"normal\">B</mi><munderover><mo>→</mo><msub><mi>KOH</mi><mfenced><mi>aq</mi></mfenced></msub><mo>∆</mo></munderover><mi mathvariant=\"normal\">C</mi></math></p>", "image": null}, "options": [{"id": "diSMZ", "text": "Propan-1-ol", "image": null, "isCorrect": false}, {"id": "j8C5n", "text": "Propene", "image": null, "isCorrect": false}, {"id": "OyuZT", "text": "Propyne", "image": null, "isCorrect": false}, {"id": "MlHvM", "text": "Propan-2-ol", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>When haloalkane or alkyl halide with a β hydrogen is heated with alcoholic solution of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>KOH</mi></math>, elimination of a hydrogen atom from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">β</mi></math> carbon and halogen atom from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi><mo>-</mo></math>carbon occurs as a result, alkene is formed as product. Since <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">β</mi></math> hydrogen atom is involved in the elimination reaction, it is often called <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">β</mi></math> elimination. An alkene is formed. This alkene then on reaction with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HBr</mi></math> undergoes addition reaction to give bromopropane, which on reaction with aqueous <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>KOH</mi></math> gives alcohol, propan<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2</mn><mo>-</mo></math>ol.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/983e1bfc-ed98-4ddf-b9f9-5be96d5ae35d.png\" style=\"width: 792px; height: 428px;\"/></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb04", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2024 (31 Jan Shift 1)", "title": "JEE Main 2024 (31 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd17ba0e94a3c4025a76", "type": "singleCorrect", "level": 2, "questionLabels": [], "question": {"text": "<p>Product A and B formed in the following set of reactions are:</p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/35739813-b8e5-4f58-8ab1-8809fb0f5df2.png\" style=\"width: 750px; height: 149px;\"/>", "image": null}, "options": [{"id": "8FU1X", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5a76b04f-0add-4d0b-97aa-40717a5167a8.png\" style=\"width: 500px; height: 120px;\"/>", "image": null, "isCorrect": false}, {"id": "OYYws", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fe128690-bd32-4742-8eda-4d3b36d65cbb.png\" style=\"width: 549px; height: 136px;\"/>", "image": null, "isCorrect": true}, {"id": "t5exo", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/4d952e1b-dfda-402f-a20b-5efff88ec83f.png\" style=\"width: 482px; height: 106px;\"/>", "image": null, "isCorrect": false}, {"id": "RDykI", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/99e4f8af-4ebb-4f7e-ac4c-443bb27376cc.png\" style=\"width: 450px; height: 134px;\"/>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>The reaction is known as hydroboration-oxidation. In this reaction, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">B</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>6</mn></msub></math> adds to the double bond of propene, resulting in the formation of an organoborane intermediate. Subsequent treatment with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub></math> converts the organoborane intermediate to an alcohol. Hydration follows anti-Markownikoff's rule.</p><p>In this hydration reaction, 1-methylcyclohexene (an alkene) is reacted with aqueous <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>3</mn></msub><msup><mi mathvariant=\"normal\">O</mi><mo>+</mo></msup></math> (formed from water and a strong acid such as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><msub><mi>SO</mi><mn>4</mn></msub></math>), resulting in Markovnikov addition of water across the pi bond. The product is an alcohol.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6bd88670-0c2c-4dcc-b3ef-338d5549b889.png\" style=\"width: 547px; height: 375px;\"/></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c11d30997d3436bb03", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (30 Jan Shift 2)", "title": "JEE Main 2024 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd17ba0e94a3c4025a75", "type": "numerical", "level": 2, "questionLabels": [], "question": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/748f20d2-16bc-4de4-936f-00c536f239c3.png\" style=\"width: 450px; height: 116px;\"/></p><p>Consider the given reaction. The total number of oxygen atoms present per molecule of the product <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">P</mi><mo>)</mo></math> is _________.</p>", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "<p>During ozonolysis, O<sub>3</sub>​ adds across C=C, and it produces ozonide.</p><p>The ozonide on hydrolysis produces carbonyl compounds. The reaction is used to locate double bond in alkene.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0b59cbff-8372-4716-90b8-689b175de2f9.png\" style=\"width: 600px; height: 122px;\"/></p><p>Hence total number of oxygen atom present per molecule of <img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7d97bfff-6614-4987-975d-65bb857e3e99.png\" style=\"width: 150px; height: 89px;\"/></p><p> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436bb00", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2024 (29 Jan Shift 1)", "title": "JEE Main 2024 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd19ba0e94a3c4025a82", "type": "singleCorrect", "level": 2, "questionLabels": [], "question": {"text": "<p>The final product A, formed in the following reaction sequence is:</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/48ad15ea-8818-4d67-9619-243535985023.png\" style=\"width: 677px; height: 163px;\"/></p>", "image": null}, "options": [{"id": "qbris", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ph</mi><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "NGzcP", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a28b0498-b247-4c00-9edb-a1244c57ce59.png\" style=\"width: 290px; height: 155px;\"/>", "image": null, "isCorrect": false}, {"id": "h61le", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5f6ed249-ffe6-4519-b2a0-2776777b595d.png\" style=\"width: 290px; height: 154px;\"/>", "image": null, "isCorrect": false}, {"id": "cqGN9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ph</mi><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><mi>OH</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The Hydroboration Oxidation reaction is an organic chemical reaction which is employed for the conversion of alkenes into alcohols that are neutral.</p><p>The hydroboration oxidation reaction mechanism can be considered as an anti-markownikov's reaction where a hydroxyl group attaches itself to the carbon which is less substituted. </p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d1243050-516e-499d-aea4-1d112e3ec222.png\" style=\"width: 500px; height: 194px;\"/></p><p>Hence, the answer is option D.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436baff", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T14:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 2)", "title": "JEE Main 2024 (27 Jan Shift 2)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436baff", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T14:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 2)", "title": "JEE Main 2024 (27 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6682bd17ba0e94a3c4025a74", "type": "numerical", "level": 2, "questionLabels": [], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>-</mo></math>Methylhex-2-ene on reaction with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HBr</mi></math> in presence of peroxide forms an addition product (A). The number of possible stereoisomers for ' <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> ' is ________.", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p>The hydrogen bromide addition in peroxides follows Anti Markovnikov rule.  Anti Markovnikov  addition reaction is found to follow a free radical mechanism. The peroxide compound involved helps in the generation of free radicals. The Anti-Markovnikov rule defines regiochemistry in which the substituent is attached to a less substituted carbon instead of the more substituted carbon.</p><p>The reaction of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>-</mo></math>Methylhex-2-ene  with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HBr</mi></math> in presence of peroxide, takes place as follows,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/af7b767c-8d53-40bf-9f4c-761a0924ba2f.png\" style=\"width: 400px; height: 200px;\"/></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> chiral carbons, here, so, total number of stereoisomers will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mi mathvariant=\"normal\">n</mi></msup><mo>=</mo><msup><mn>2</mn><mn>2</mn></msup><mo>=</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "previousYearPapers": [{"_id": "65c4c0c01d30997d3436bafe", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T09:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 1)", "title": "JEE Main 2024 (27 Jan Shift 1)"}], "questionStructure": ["default"], "previousYear": {"_id": "65c4c0c01d30997d3436bafe", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2024-01-27T09:00:00.000Z", "isVisible": true, "shortName": "2024 (27 Jan Shift 1)", "title": "JEE Main 2024 (27 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d68723", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}], "question": {"text": "<p>The product formed in the following multistep reaction is:</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/bb0f12ba-e740-4560-ac03-bd819d17faa6.png\" style=\"width: 323px; height: 125px;\" /></p>", "image": null}, "options": [{"id": "gCurc", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c0f53cea-c788-4964-97d5-5b978306d962.png\" style=\"width: 278px; height: 91px;\" /></p>", "image": null, "isCorrect": false}, {"id": "Mv4QJ", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c8c1e3e5-525d-4d18-ac6f-9b8b4b3c78d9.png\" style=\"width: 191px; height: 153px;\" /></p>", "image": null, "isCorrect": false}, {"id": "n1HOU", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3852a4b6-7534-4fa9-9328-97ad5377bc49.png\" style=\"width: 255px; height: 88px;\" /></p>", "image": null, "isCorrect": true}, {"id": "CxQI5", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/8ed707b0-b3cd-4c5f-9ac5-a8f176284918.png\" style=\"width: 301px; height: 43px;\" /></p>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Hydroboration-oxidation of terminal alkenes give primary alcohols. Propene gives propanol. Propanol on oxidation with PCC gives propanal. Propanal undergo nucleophilic addition reaction with methyl magnesium bromide give 2-butanol.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5338f041-4948-41d1-a392-779a0c6acf91.png\" style=\"width: 454px; height: 276px;\" /></p>", "image": null}, "videoSolution": {"videoId": "144f041985dd4e95a9845a07f38e6e5c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/cmscUPGItlFKt.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/cmscUPGItlFKt.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a71417cc3fb48d68622", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}], "question": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>-</mo><mi>hexene</mi><munderover><mo>&#8594;</mo><mrow><mfenced><mi>ii</mi></mfenced><mo>&#160;</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow><mrow><mfenced><mi mathvariant=\"normal\">i</mi></mfenced><mo>&#160;</mo><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></mrow></munderover><mi>Products</mi></math></p><p>The two products formed in above reaction are</p>", "image": null}, "options": [{"id": "u7xtn", "text": "Butanal and acetaldehyde", "image": null, "isCorrect": false}, {"id": "QpdRI", "text": "Butanoic acid and acetaldehyde", "image": null, "isCorrect": false}, {"id": "vIDKw", "text": "Butanal and acetic acid", "image": null, "isCorrect": false}, {"id": "Q9ffY", "text": "Butanoic acid and acetic acid", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Ozone will cleave carbon-carbon double bonds to give ketones/carboxylic acids after oxidative workup. Here in this reaction Cleavage occurs at unsaturation of hexene and Butanoic acid and acetic acid is formed.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/c8c23681-181c-4be7-821e-7e37c6776aeb.png\" style=\"width: 465px; height: 84px;\" /></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6496", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 Apr Shift 1)", "title": "JEE Main 2023 (12 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d684ad", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6490", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 1)", "title": "JEE Main 2023 (10 Apr Shift 1)"}], "question": {"text": "<p>The major product &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi></math>&#39; formed in the given reaction is</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/80df3150-4efd-494e-a91e-2366a4b2a427.png\" style=\"width: 500px; height: 157px;\" /></p><p>&nbsp;</p>", "image": null}, "options": [{"id": "PnBDd", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f99449af-de61-4743-af24-2ca801a3ff87.png\" style=\"width: 250px; height: 150px;\" /></p><p>&nbsp;</p>", "image": null, "isCorrect": false}, {"id": "uDnW3", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5e20e890-5a57-4e78-a61d-b9e2aab14afe.png\" style=\"width: 250px; height: 168px;\" /></p><p>&nbsp;</p>", "image": null, "isCorrect": true}, {"id": "lLgtP", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/729a2b45-9cbf-459e-b4ec-fe42cdd56a91.png\" style=\"width: 250px; height: 173px;\" /></p><p>&nbsp;</p>", "image": null, "isCorrect": false}, {"id": "wAPe5", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fef86f7a-b489-4113-b2c4-f4c4d02545c0.png\" style=\"width: 250px; height: 161px;\" /></p><p>&nbsp;</p>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Alkaline potassium permanganate is a strong oxidising agent. In the given molecule alkene part undergo oxidation with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>alk</mi><mo>.</mo><msub><mi>KMnO</mi><mn>4</mn></msub></math>. The alkene part present in the given molecule is terminal alkene, hence it converts to carboxylic acid group and carbon dioxide. Finally, ester part in the molecule undergo hydrolysis in acidic water.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ae074ef6-4f7f-4292-bb47-28e8dcebb494.png\" style=\"width: 550px; height: 310px;\" /></p><p>&nbsp;</p></blockquote>", "image": null}, "videoSolution": {"videoId": "0bb74ff04e5f44769caddfda906f4a51", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/KoUJbAh7cQrLK.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/KoUJbAh7cQrLK.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6490", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 1)", "title": "JEE Main 2023 (10 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68414", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}], "question": {"text": "Molar mass of the hydrocarbon (X) which on ozonolysis consumes one mole of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math>&nbsp;per mole of (X) and gives one mole each of ethanal and propanone is ______ g mol<sup>&ndash;1</sup> (Molar mass of C : 12 g mol<sup>&ndash;1</sup> , H : 1 g mol<sup>&ndash;1</sup> )", "image": null}, "options": [], "correctValue": "70", "solution": {"text": "<blockquote><p>When 2-methyl butene-2 is subjected to ozonolysis and then reduced in presence of dimethyl sulphide or Zn dust, it yields acetone and acetaldehyde. Cycloaddition of a molecule of ozone occurs first and then it is cleaved reductively to give aldehyde and ketone.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0fff387a-ae61-40b9-8aa1-51df6c21d667.png\" style=\"width: 500px; height: 140px;\" /></p><p>&nbsp;</p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d682ef", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A hydrocarbon &#39;X&#39; with formula <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>6</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>8</mn></msub></math>&nbsp;uses two moles of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math>&nbsp;on catalystic hydrogenation of its one mole. On ozonolysis, &#39;X&#39; yields two moles of methane dicarbaldehyde. The hydrocarbon &#39;X&#39; is :", "image": null}, "options": [{"id": "7I1QF", "text": "hexa-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>3</mn><mo>,</mo><mo>&#160;</mo><mn>5</mn></math>-triene", "isCorrect": false, "image": null}, {"id": "DTTYz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>-methylcyclopenta-<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>-</mo></math>diene", "isCorrect": false, "image": null}, {"id": "WYTd4", "text": "cyclohexa<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>-</mo></math>diene", "isCorrect": false, "image": null}, {"id": "jFdux", "text": "cyclohexa<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn></math>,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mn>4</mn><mo>-</mo></math>diene", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>A hydrocarbon X with formula&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>6</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>8</mn></msub></math>&nbsp;uses two moles of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math>&nbsp;on catalystic hydrogenation of its one mole. On ozonolysis,&nbsp; X yields two moles of methane dicarbaldehyde. The hydrocarbon is cyclohexa-1,4-diene.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/12f6ea3d-f3d6-4ab4-9b93-f1273bc8a560-9896324.PNG\" style=\"width: 430px; height: 100px;\" /></p>", "image": null}, "videoSolution": {"videoId": "4c9dd09cf8bb49a6a8f8d1f0d2a60ba9", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/BjAZqvtsqdC0H.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/BjAZqvtsqdC0H.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d681ec", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>The major products &lsquo;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&rsquo; and &lsquo;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&rsquo;, respectively, are</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0a1f0231-bf03-4fd8-820c-48ec4a297fe9-9895849.png\" style=\"width: 500px; height: 125px;\" />&nbsp;</p>", "image": null}, "options": [{"id": "86O3X", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/de65febc-24d9-458d-af24-0846a52faa16-9895849_3.png\" style=\"width: 400px; height: 130px;\" />&nbsp;", "isCorrect": true, "image": null}, {"id": "prWob", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e5bd3d20-e265-48fc-b092-ed94c722a509-9895849_4.png\" style=\"width: 400px; height: 123px;\" />&nbsp;", "isCorrect": false, "image": null}, {"id": "2hmBg", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/46da2a73-a514-42ef-8caf-41c40b6b03a6-9895849_5.png\" style=\"width: 400px; height: 123px;\" />&nbsp;", "isCorrect": false, "image": null}, {"id": "UiCaK", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/01618a35-c760-4a9d-928c-e80ec47ec933-9895849_6.png\" style=\"width: 400px; height: 107px;\" />&nbsp;", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Alkenes react with concentrated sulfuric acid in the cold to produce alkyl hydrogensulphates. At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math>, the carbocation intermediate formed reacts with another molecule of alkene.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/90e34ba6-8090-4ce7-99bb-5f71aa6d342e-9895849_2.png\" style=\"width: 600px; height: 607px;\" />&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68143", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}], "type": "numerical", "level": 1, "question": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>17</mn><mi>mg</mi></math> of a hydrocarbon (M.F. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>10</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>16</mn></msub></math>) takes up <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn><mo>.</mo><mn>40</mn><mi>mL</mi></math> of the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math>&nbsp;gas measured at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>&#176;</mo><mi mathvariant=\"normal\">C</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>760</mn><mi>mm</mi></math> of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Hg</mi></math>. Ozonolysis of the same hydrocarbon yields</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><munder><mi mathvariant=\"normal\">C</mi><munder><mrow><mo>|</mo><mo>|</mo></mrow><mi mathvariant=\"normal\">O</mi></munder></munder><mo>-</mo><msub><mi>CH</mi><mn>3</mn></msub><mo>,</mo><mi mathvariant=\"normal\">H</mi><mo>-</mo><munder><mi mathvariant=\"normal\">C</mi><munder><mrow><mo>|</mo><mo>|</mo></mrow><mi mathvariant=\"normal\">O</mi></munder></munder><mo>-</mo><mi mathvariant=\"normal\">H</mi><mo>,</mo><mi mathvariant=\"normal\">H</mi><mo>-</mo><munder><mi mathvariant=\"normal\">C</mi><munder><mrow><mo>|</mo><mo>|</mo></mrow><mi mathvariant=\"normal\">O</mi></munder></munder><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><msub><mi>CH</mi><mn>2</mn></msub><mo>-</mo><munder><mi mathvariant=\"normal\">C</mi><munder><mrow><mo>|</mo><mo>|</mo></mrow><mi mathvariant=\"normal\">O</mi></munder></munder><mo>-</mo><munder><mi mathvariant=\"normal\">C</mi><munder><mrow><mo>|</mo><mo>|</mo></mrow><mi mathvariant=\"normal\">O</mi></munder></munder><mo>-</mo><mi mathvariant=\"normal\">H</mi></math></p><p>The number of double bond/s present in the hydrocarbon is</p>", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<p>From the given information:<br />Moles of hydrocarbon&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>17</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow><mn>136</mn></mfrac><mo>=</mo><mn>1</mn><mo>.</mo><mn>25</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup></math>&nbsp;Mole of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math>&nbsp;gas</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>1</mn><mo>&#215;</mo><mfrac><mrow><mn>8</mn><mo>.</mo><mn>40</mn></mrow><mn>1000</mn></mfrac><mo>=</mo><mi mathvariant=\"normal\">n</mi><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>0821</mn><mo>&#215;</mo><mn>273</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>3</mn><mo>.</mo><mn>75</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup></math></p><p>Thus, moles of hydrogen used to hydrogenate double bonds:</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>3</mn><mo>.</mo><mn>75</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow><mrow><mn>1</mn><mo>.</mo><mn>25</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>4</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>3</mn></math></p>", "image": null}, "videoSolution": {"videoId": "8bf9a4c94b274b12bddd9f36bc05fc08", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/oR5f81XxcfLQJ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/oR5f81XxcfLQJ.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67c49", "previousYearPapers": [{"_id": "63134c746e7bc9b332483706", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 1)", "title": "JEE Main 2022 (28 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Choose the correct option for the following reactions.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/0abfc694-4fbf-4a33-8bf1-23b61cee5517-image.png\" style=\"width: 479px; height: 110px;\" /></p>", "image": null}, "options": [{"id": "2paQE", "text": "&#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39; and &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&#39; are both Markovnikov addition products.", "isCorrect": false, "image": null}, {"id": "EnA5n", "text": "&#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39; is Markovnikov product and &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&#39; is antiMarkovnikov product.", "isCorrect": true, "image": null}, {"id": "IYdbL", "text": "&#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39; and &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&#39; are both anti-Markovnikov products.", "isCorrect": false, "image": null}, {"id": "Ks56A", "text": "&#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&#39; is Markovnikov and &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39; is anti-<br />Markovnikov product.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>In the first step of hydroboration oxidation, the boron and hydrogen add to the same face of the double&nbsp;bond. In the second step, the OH takes the identical position occupied by the&nbsp;boron. Thus, the OH and H groups that are effectively added to the original&nbsp;double bond are cis. The overall addition takes place in anti Markovnikov&#39;s fashion.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/de84a424-c210-4858-beed-5f72dbc0ff5c-image.png\" style=\"width: 337px; height: 104px;\" /></p><p>The reagent is mercury(II) acetate, which dissociates slightly to form <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mi>Hg</mi><mo>(</mo><mi>OAc</mi><mo>)</mo></math>.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mi>Hg</mi><mo>(</mo><mi>OAc</mi><mo>)</mo></math> is the electrophile that adds to the pi bond. &bull; The intermediate is a three-membered ring called the mercurinium ion. Overall, the addition of water follows Markovnikov&rsquo;s rule</p><p>&nbsp;</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5904aa24-215d-4fed-813f-437aea1279d6-e608ab7c-55ed-4f21-8315-c86bd214ce49-image.png\" style=\"width: 611px; height: 229px;\" /></p><p>The reaction does not suffer from rearrangements because there is no carbocation intermediate.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "efed84cec5f5471787e3314dd9045f22", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/H1kxNF5q09TPw.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/H1kxNF5q09TPw.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483706", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 1)", "title": "JEE Main 2022 (28 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d6786b", "previousYearPapers": [{"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 2)", "title": "JEE Main 2022 (25 Jul Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Major product of the following reaction is</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1db52688-3e74-4033-b420-607cd2d71c9d-image.png\" style=\"width: 298px; height: 70px;\" /></p>", "image": null}, "options": [{"id": "hzsfd", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/112d73d2-cba3-4264-a2b4-c3f2eab0508e-image.png\" style=\"width: 240px; height: 93px;\" /></p>", "isCorrect": false, "image": null}, {"id": "5nERm", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/00a59fdb-4adf-49b2-bf46-618f13b0b19c-image.png\" style=\"width: 239px; height: 100px;\" /></p>", "isCorrect": true, "image": null}, {"id": "ong37", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2d2b8cf7-c945-4e63-ae57-5c8408edd7c2-image.png\" style=\"width: 195px; height: 100px;\" /></p>", "isCorrect": false, "image": null}, {"id": "mkqaf", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/840dabd4-c279-4f82-8347-e4383376a7b0-image.png\" style=\"width: 305px; height: 80px;\" /></p>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d181ebbc-29f3-42b4-baf9-80de2a0ab2b7-dd70d7e5-6059-40d5-aa22-ff7093129682-9754963_Solution.png\" style=\"width: 440px; height: 315px;\" /></p><p>The product of reaction will be based on stability of carbocation intermediate.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 2)", "title": "JEE Main 2022 (25 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67811", "previousYearPapers": [{"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>A compound &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39; on reaction with &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>&#39; and &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math>&nbsp;produces the same major product but different by product &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi></math>&#39; and &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">b</mi></math>&#39;. Oxidation of &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi></math>&#39; gives a substance produced by ants.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/8201d06c-dd9b-49b6-bcdf-7aadbb8b2e41-image.png\" style=\"width: 485px; height: 180px;\" />​​​​​​​</p><p>&#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>&#39; and &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math>&#39; respectively are</p>", "image": null}, "options": [{"id": "ErjQm", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KMnO</mi><mn>4</mn></msub><mo>/</mo><msup><mi mathvariant=\"normal\">H</mi><mo>+</mo></msup></math>and dil.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KMnO</mi><mn>4</mn></msub><mo>,</mo><mn>273</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math>", "isCorrect": false, "image": null}, {"id": "Hy4u0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KMnO</mi><mn>4</mn></msub></math>,(dilute), <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>273</mn><mo>&#160;</mo><mi mathvariant=\"normal\">K</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KMnO</mi><mn>4</mn></msub><mo>/</mo><msup><mi mathvariant=\"normal\">H</mi><mo>+</mo></msup></math>", "isCorrect": false, "image": null}, {"id": "HVS64", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KMnO</mi><mn>4</mn></msub><mo>/</mo><msup><mi mathvariant=\"normal\">H</mi><mo>+</mo></msup></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>,</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>/</mo><mi>Zn</mi></math>", "isCorrect": false, "image": null}, {"id": "Wp3Hf", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub><mo>,</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>/</mo><mi>Zn</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KMnO</mi><mn>4</mn></msub><mo>/</mo><msup><mi mathvariant=\"normal\">H</mi><mo>+</mo></msup></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/cdefb8ca-6cfb-4431-be57-306b2e23aee9-8525a8ca-bf38-4117-8ee9-7d0ffa5ab1ed-image.png\" style=\"width: 728px; height: 294px;\" /></p><p>The substance produce by ants is formic acid, which is the product of oxidation of &quot;a&quot;, means &#39;a&#39; should be formaldehyde. Now, formaldehyde and ketons are prepared by reductive&nbsp;ozonolysis of alkenes. And by oxidation in presence of strong oxidising agents alkenes give ketons and acids.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "24bc79b6c09943ed9d9cc4d2c57e04ba", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/tdaLSYM6RdILe.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/tdaLSYM6RdILe.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67e65", "previousYearPapers": [{"_id": "62c481f101514d218a7934db", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 1)", "title": "JEE Main 2022 (29 Jun Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Two isomers &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39;&nbsp;and &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&#39; with molecular formula <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>4</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>8</mn></msub></math> give different products on oxidation with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KMnO</mi><mn>4</mn></msub></math> in acidic medium. Isomer &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39; on reaction with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>KMnO</mi><mn>4</mn></msub><mo>/</mo><msup><mi mathvariant=\"normal\">H</mi><mo>+</ 2ce-b97f84aa97fa-image.png\" style=\"float: left;\" width=\"259\" /></p>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>EtOK is potassium ethylene oxide and it is colourless gas and is liquid at low temperatures and is highly flammable i.e. that catches fire easily and undergoes alkylation reactions with many organic compounds and EtOH is the ethanol.</p><p>The heating&nbsp;of 2-chloro-1-phenylbutane&nbsp; with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>EtOK</mi><mo>/</mo><mi>EtOH</mi></math>gives&nbsp;X&nbsp;as the major product. Reaction&nbsp;X&nbsp;with&nbsp;H<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">g</mi><msub><mrow><mo>(</mo><mi>OAc</mi><mo>)</mo></mrow><mn>2</mn></msub><mo>/</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></math>followed by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NaBH</mi><mn>4</mn></msub></math>&nbsp;gives&nbsp;Y&nbsp;as the major product.&nbsp;Y&nbsp;is 1-phenylbutanol.</p><p><img height=\"178\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b1f126db-30fd-46a5-8d02-667603c5be0a-image.png\" width=\"972\" /></p>", "image": null}, "videoSolution": {"videoId": "580a2c2fe79a445baad0909cfaecb3ea", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/UbLlFlwLbpeYA.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/UbLlFlwLbpeYA.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 2)", "title": "JEE Main 2019 (12 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d66831", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 1)", "title": "JEE Main 2019 (12 Apr Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "But-2-ene on reaction with alkaline <math><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">n</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math> at elevated temperature followed by acidification will give:", "image": null}, "options": [{"id": "vlrrR", "text": "2 molecules of <img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6bb88698-05d6-44a1-8a20-142623072b83-image.png\" style=\"width: 86px; height: 31px;\" />", "isCorrect": true, "image": null}, {"id": "9jlzT", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/34a588ff-8620-460e-ae8a-4956d2c46500-image.png\" style=\"width: 185px; height: 60px;\" />", "isCorrect": false, "image": null}, {"id": "clCfG", "text": "2 Molecules of <img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/73c5a392-bc4f-4f5a-86d4-d5d2e9917405-image.png\" style=\"width: 73px; height: 28px;\" />", "isCorrect": false, "image": null}, {"id": "ZIfAa", "text": "One molecular of <img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/df87a859-9ae3-4520-ab64-19df2f611308-image.png\" style=\"width: 73px; height: 28px;\" /> and one molecular of <img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/710ee5b2-8603-42c2-a97a-ff442bc7d4b5-image.png\" style=\"width: 84px; height: 29px;\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The reaction will be;</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/751c5266-cafa-403c-8443-bc581b41ec33-image.png\" style=\"width: 474px; height: 265px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 1)", "title": "JEE Main 2019 (12 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d66830", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 1)", "title": "JEE Main 2019 (12 Apr Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The major product of the following addition reaction is<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ff125a0f-cf0a-42b6-93d4-03066098c6b6-image.png\" style=\"width: 360px; height: 54px;\" />", "image": null}, "options": [{"id": "gBxhq", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/55de67e1-02d0-49d0-aa64-0030c5fb71c2-image.png\" style=\"width: 160px; height: 113px;\" />", "isCorrect": false, "image": null}, {"id": "EA9Hh", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/9180d02a-aa0b-493f-8b43-f3ea35981546-image.png\" style=\"width: 180px; height: 76px;\" />", "isCorrect": true, "image": null}, {"id": "NZS2H", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b1ab2e50-3762-488f-93e3-accb3f4e82d8-image.png\" style=\"width: 160px; height: 82px;\" />", "isCorrect": false, "image": null}, {"id": "PZoYm", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/93928ad0-be72-4ceb-9af4-742310e61d9e-image.png\" style=\"width: 160px; height: 72px;\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>This reaction is the halohydration of alkene. It is an electrophilic addition reaction.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/61fb1145-f910-4446-bb82-e55aa173bf07-ef335eea-7a20-41d2-ac30-736362ebb571-image.png\" style=\"width: 500px; height: 62px;\" /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b9383e0f-b370-4281-b699-b62221f1f947-image48.png\" style=\"width: 500px; height: 227px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 1)", "title": "JEE Main 2019 (12 Apr Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-12-13T14:34:53.210Z"}, {"_id": "648b5a67417cc3fb48d6681d", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 1)", "title": "JEE Main 2019 (12 Apr Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "The major product (s) obtained in the following reaction is/are:<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1d012074-6303-47f3-9962-55b3c78be59d-image.png\" style=\"width: 250px; height: 80px;\" />", "image": null}, "options": [{"id": "FJuwM", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f2a840d7-3860-445a-822f-5cd27760109f-image.png\" style=\"width: 250px; height: 72px;\" />", "isCorrect": false, "image": null}, {"id": "elF75", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/561614a7-9987-4ed6-98b8-bef61a6ec1ec-image.png\" style=\"width: 250px; height: 54px;\" />", "isCorrect": false, "image": null}, {"id": "RkhX7", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f467d990-b11d-4482-9f90-617f0541921e-image.png\" style=\"width: 300px; height: 64px;\" />", "isCorrect": true, "image": null}, {"id": "ci7Bf", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2effe9e5-155c-40d7-a5e5-e5527a0ed6ec-image.png\" style=\"width: 200px; height: 54px;\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>First step of the reaction is dehydrohalogenation and then ozonolysis.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/491fd501-7427-495f-af2b-bd02dccdd36a-image.png\" style=\"width: 450px; height: 288px;\" /></p><p>The dehydrohalogenation of alkyl halides, another &szlig; elimination reaction, involves the loss of a hydrogen and a halide from an alkyl halide (RX). Dehydrohalogenation is normally accomplished by reacting the alkyl halide with a strong base, such as sodium ethoxide.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 1)", "title": "JEE Main 2019 (12 Apr Shift 1)"}, "evalStatus": "correct", "lastPracticed": "2024-12-13T14:29:29.101Z"}, {"_id": "648b5a66417cc3fb48d66447", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 2)", "title": "JEE Main 2019 (08 Apr Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Which one of the following alkenes when treated with <math><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi></math> yields majorly an anti Markovnikov product?", "image": null}, "options": [{"id": "6KT1L", "text": "<math><msub><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mo>-</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">H</mi><mo>=</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "isCorrect": false, "image": null}, {"id": "5zV7I", "text": "<math><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi><mo>-</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">H</mi><mo>=</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "isCorrect": false, "image": null}, {"id": "LWH37", "text": "<math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">N</mi><mo>-</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">H</mi><mo>=</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "isCorrect": false, "image": null}, {"id": "wdWJn", "text": "<math><msub><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">H</mi><mo>=</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Markovnikov&rsquo;s product is formed when a stable carbocation is formed on the more substituted carbon.</p><p>In <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>-</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">H</mi><mo>=</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>,</mo></math> the carbocation formed will be destabilized by strong <math><mo>-</mo><mi mathvariant=\"normal\">I</mi></math> group of <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>.</mo></math> Hence, the Anti-Markovnikov&rsquo;s product will be formed.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/188a3e1f-5572-4059-81a2-08fabeb9dd35-image.png\" style=\"width: 684px; height: 117px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 2)", "title": "JEE Main 2019 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d663e2", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 1)", "title": "JEE Main 2019 (08 Apr Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The major product of the f following reaction is:<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/4cc0eb94-7fe0-483e-9c58-3859a54ac279-image.png\" style=\"width: 350px; height: 114px;\" />", "image": null}, "options": [{"id": "D9vjr", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/03334b10-8457-444b-9060-506954083074-image.png\" style=\"width: 150px; height: 160px;\" />", "isCorrect": true, "image": null}, {"id": "4Ex8Y", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d42c5739-b01f-4c76-adb7-9784e8f084d7-image.png\" style=\"width: 150px; height: 141px;\" />", "isCorrect": false, "image": null}, {"id": "Xq1Z5", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1c03e1dc-6fa6-4c52-b1ad-cb75a6bc4b2b-image.png\" style=\"width: 150px; h
