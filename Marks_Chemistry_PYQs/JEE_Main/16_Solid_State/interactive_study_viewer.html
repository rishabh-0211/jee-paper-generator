>&#215;</mo><msqrt><mn>2</mn></msqrt></mrow></mfrac><mo>=</mo><mfrac><mi mathvariant=\"normal\">a</mi><msqrt><mn>2</mn></msqrt></mfrac></math></p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6489", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-02T09:00:00.000Z", "isVisible": true, "shortName": "2017 (02 Apr)", "title": "JEE Main 2017 (02 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65f07", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}], "question": {"text": "Sodium metal crystallizes in a body centred cubic lattice with a unit cell edge of <math><mn>4.29</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#8491;</mi></math> . The radius of sodium atom is approximately:", "image": null}, "options": [{"id": "YvLlm", "text": "<math><mn>0.93</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Å</mi></math>", "image": null, "isCorrect": false}, {"id": "nUjVb", "text": "<math><mn>1.86</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">Å</mi></math>", "image": null, "isCorrect": true}, {"id": "FhGbi", "text": "<math><mn>3.22</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Å</mi></math>", "image": null, "isCorrect": false}, {"id": "YDuBB", "text": "<math><mn>5.72</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">Å</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>For B.C.C lattice,<br /><br /><math> <mrow> <mn>4</mn> <mtext>r</mtext> <mo>=</mo> <msqrt> <mn>3</mn> </msqrt> <mtext>a</mtext> </mrow> </math></p><p>where&nbsp;&#39;r&#39; is radius of atom and &#39;a&#39; is edge length of unit cell<br /><br /><math> <mrow> <mtext>r</mtext> <mo>=</mo> <mfrac> <mrow> <msqrt> <mn>3</mn> </msqrt> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mtext>a</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>1.732</mtext> </mrow> <mrow> <mn>4</mn> </mrow> </mfrac> <mo>&#215;</mo> <mtext>4.29</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>=</mo> <mtext>1.86</mtext> <mi>&#197;</mi> </mrow> </math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65d98", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2014 (09 Apr Online)", "title": "JEE Main 2014 (09 Apr Online)"}], "question": {"text": "In a face centered cubic lattice atoms A are at the corner points and atoms B at the face centered points. If atom B is missing from one of the face centered points, the formula of the ionic compound is :", "image": null}, "options": [{"id": "WmGqj", "text": "A<sub>2</sub>B<sub>3</sub>", "image": null, "isCorrect": false}, {"id": "LJZaS", "text": "AB<sub>2</sub>", "image": null, "isCorrect": false}, {"id": "ikjDg", "text": "A<sub>5</sub>B<sub>2</sub>", "image": null, "isCorrect": false}, {"id": "voyvt", "text": "A<sub>2</sub>B<sub>5</sub>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "A atoms at corners&nbsp;<math> <mrow> <mo>=</mo> <mn>8</mn> <mo>&#215;</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>8</mn> </mrow> </mfrac> <mo>=</mo> <mo>&#160;A (one atom)</mo> </mrow> </math><br /><br />B atom is missing at One face centre then will present at 5 faces<br /><br />At face centre atom contribute 1/2 part<br /><br />Number of B atom at Face centre = <math> <mrow> <mn>5</mn><mo>&#215;</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> </mrow> </math> (B atom)<br /><br />So formula of compound = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">A</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">B</mi><mn>5</mn></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2014 (09 Apr Online)", "title": "JEE Main 2014 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65d31", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6486", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2014 (06 Apr)", "title": "JEE Main 2014 (06 Apr)"}], "question": {"text": "<math> <mrow> <mtext>CsCl</mtext></mrow> </math> crystallises in body centred cubic lattice. If 'a' is its edge length then which of the following expressions is correct?", "image": null}, "options": [{"id": "CzW3V", "text": "<math> <mrow> <mrow> <msub> <mtext>r</mtext> <msup> <mtext>Cs</mtext> <mo>+</mo> </msup> </msub> </mrow> <mo>+</mo> <msub> <mtext>r</mtext> <msup> <mtext>Cl</mtext> <mo>-</mo> </msup> </msub> <mo>=</mo> <mn>3</mn> <mtext>a</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "N6sTo", "text": "<math> <mrow> <mrow> <msub> <mtext>r</mtext> <msup> <mtext>Cs</mtext> <mo>+</mo> </msup> </msub> </mrow> <mo>+</mo> <msub> <mtext>r</mtext> <msup> <mtext>Cl</mtext> <mo>-</mo> </msup> </msub> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> <mtext>a</mtext> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "SRJT8", "text": "<math> <mrow> <mrow> <msub> <mtext>r</mtext> <msup> <mtext>Cs</mtext> <mo>+</mo> </msup> </msub> </mrow> <mo>+</mo> <msub> <mtext>r</mtext> <msup> <mtext>Cl</mtext> <mo>-</mo> </msup> </msub> <mo>=</mo> <mfrac> <mrow> <msqrt> <mn>3</mn> </msqrt> </mrow> <mrow> <mn>2</mn> </mrow> </mfrac> <mo>a</mo> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "ahM1x", "text": "<math> <mrow> <mrow> <msub> <mtext>r</mtext> <msup> <mtext>Cs</mtext> <mo>+</mo> </msup> </msub> </mrow> <mo>+</mo> <msub> <mtext>r</mtext> <msup> <mtext>Cl</mtext> <mo>-</mo> </msup> </msub> <mo>=</mo> <msqrt> <mn>3</mn> </msqrt> <mtext>a</mtext> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mtext>8</mtext> </math> chloride ions at <math> <mtext>8</mtext> </math> corners <math> <mrow> <msup> <mrow> <mtext>Cs</mtext></mrow> <mtext>+</mtext> </msup> </mrow> </math> cation at body centre along body diagonal there will be one <math> <mrow> <msup> <mrow> <mtext>Cs</mtext></mrow> <mtext>+</mtext> </msup> </mrow> </math> cation and <math> <mrow> <mtext>2</mtext><mtext>&#8196;</mtext><msup> <mrow> <mtext>Cl</mtext></mrow> <mo>&#8722;</mo> </msup> </mrow> </math> ions at ends of body diagonal.<br /><math> <mrow> <mn>2</mn> <msub> <mtext>r</mtext> <msup> <mtext>Cs</mtext> <mo>+</mo> </msup> </msub> <mo>+</mo> <mn>2</mn> <msub> <mtext>r</mtext> <msup> <mtext>Cl</mtext> <mo>-</mo> </msup> </msub> <mo>=</mo> <msqrt> <mn>3</mn> </msqrt> <mo>a</mo> </mrow> </math><br /><math> <mtext>a</mtext> </math> is edge length<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/9bd5c5b8-0e91-499e-be2f-eefe7ff2fb6e-image.png\" style=\"width: 160px; height: 191px;\" /><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6486", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2014 (06 Apr)", "title": "JEE Main 2014 (06 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65cdf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}], "question": {"text": "Copper crystallises in fcc with a unit length of $361 \\mathrm{~pm}$. What is the radius of copper atom ?", "image": null}, "options": [{"id": "5Fmo5", "text": "\n$157 \\mathrm{~pm}$\n", "image": null, "isCorrect": false}, {"id": "VzCtR", "text": "\n$128 \\mathrm{~pm}$\n", "image": null, "isCorrect": true}, {"id": "JEYWe", "text": "\n$108 \\mathrm{~pm}$\n", "image": null, "isCorrect": false}, {"id": "ez2IN", "text": "\n$181 \\mathrm{~pm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For FCC,\n$r=\\frac{\\sqrt{2} a}{4}=\\frac{a}{2 \\sqrt{2}}=0.3535 a$\ngiven $a=361 \\mathrm{~pm}$\n$\\begin{aligned}\nr & =0.3535 \\times 361 \\\\\n& =128 \\mathrm{~pm}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-25T09:00:00.000Z", "isVisible": true, "shortName": "2013 (25 Apr Online)", "title": "JEE Main 2013 (25 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65c8f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}], "question": {"text": "In a face centred cubic lattice, atoms of A form the corner points and atoms of B form the face centred points. If two atoms of $\\mathrm{A}$ are missing from the corner points, the formula of the ionic compound is :", "image": null}, "options": [{"id": "NMALx", "text": "\n$\\mathrm{AB}_3$\n", "image": null, "isCorrect": false}, {"id": "QAzD5", "text": "\n$\\mathrm{AB}_4$\n", "image": null, "isCorrect": true}, {"id": "jrzHg", "text": "\n$\\mathrm{A}_2 \\mathrm{~B}_5$\n", "image": null, "isCorrect": false}, {"id": "zWkge", "text": "\n$\\mathrm{AB}_2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A form corner points and two atoms of A are missing from corner\n$$\n\\begin{aligned}\n\\therefore \\quad & \\text { Atoms at corner }(\\mathrm{A})=6 \\times \\frac{1}{8}=\\frac{3}{4} \\\\\n& \\text { Atoms at face centre }(\\mathrm{B})=6 \\times \\frac{1}{2}=3 \\\\\n\\therefore & \\mathrm{A}_{3 / 4} \\mathrm{~B}_3 \\text { i.e., } \\mathrm{AB}_4\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-23T09:00:00.000Z", "isVisible": true, "shortName": "2013 (23 Apr Online)", "title": "JEE Main 2013 (23 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65be0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}], "question": {"text": "An element having an atomic radius of $0.14 \\mathrm{~nm}$ crystallizes in an $f_{c c}$ unit cell. What is the length of a side of the cell ?", "image": null}, "options": [{"id": "pYNi1", "text": "\n$0.56 \\mathrm{~nm}$\n", "image": null, "isCorrect": false}, {"id": "tF8Wv", "text": "\n$0.24 \\mathrm{~nm}$\n", "image": null, "isCorrect": false}, {"id": "tjYXJ", "text": "\n$0.96 \\mathrm{~nm}$\n", "image": null, "isCorrect": false}, {"id": "QPOvG", "text": "\n$0.4 \\mathrm{~nm}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For a fcc unit cell\n$\\begin{aligned}\n& r=\\frac{\\sqrt{2} a}{4} \\\\\n& a=\\frac{4 r}{\\sqrt{2}}=2 \\sqrt{2} \\times 0.14=0.39 \\approx 0.4 \\mathrm{~nm}.\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2013 (09 Apr Online)", "title": "JEE Main 2013 (09 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65a64", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}], "question": {"text": "Ammonium chloride crystallizes in a body centred cubic lattice with edge length of unit cell of 390 $\\mathrm{pm}$. If the size of chloride ion is $180 \\mathrm{pm}$, the size of ammonium ion would be", "image": null}, "options": [{"id": "VY6H3", "text": "\n$174 \\mathrm{pm}$\n", "image": null, "isCorrect": false}, {"id": "tlj3x", "text": "\n$158 \\mathrm{pm}$\n", "image": null, "isCorrect": true}, {"id": "pDWAw", "text": "\n$142 \\mathrm{pm}$\n", "image": null, "isCorrect": false}, {"id": "Yndh9", "text": "\n$126 \\mathrm{pm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For bcc structure\n$$\n\\begin{aligned}\n\\text { Interionic distance }= & r^{+}+r^{-}=\\frac{\\sqrt{3}}{2} a \\\\\n& (a=\\text { edge length })\n\\end{aligned}\n$$\n\n$$\n\\begin{aligned}\n& r_{\\mathrm{NH}_4^{+}}^{+}+r_{\\mathrm{Cl}^{-}}^{-}=\\frac{\\sqrt{3}}{2} a \\\\\n& r_{\\mathrm{NH}_4^{+}}^{+}+180=\\frac{\\sqrt{3}}{2} \\times 390\n\\end{aligned}\n$$\n\n$$\n\\mathrm{r}_{\\mathrm{NH}_4^{+}}^{+}=338 \\mathrm{pm}-180 \\mathrm{pm}=158 \\mathrm{pm}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cf", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-19T09:00:00.000Z", "isVisible": true, "shortName": "2012 (19 May Online)", "title": "JEE Main 2012 (19 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d659bf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}], "question": {"text": "A solid has a ' $b c c$ ' structure. If the distance of nearest approach between two atoms is $1.73 Å$, the edge length of the cell is", "image": null}, "options": [{"id": "6ZTVc", "text": "\n$314.20 \\mathrm{pm}$\n", "image": null, "isCorrect": false}, {"id": "7pvK5", "text": "\n$1.41 \\mathrm{pm}$\n", "image": null, "isCorrect": false}, {"id": "nGidm", "text": "\n$200 \\mathrm{pm}$\n", "image": null, "isCorrect": true}, {"id": "aiqCW", "text": "\n$216 \\mathrm{pm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For bcc structure\n$$\nd=\\frac{\\sqrt{3} a}{2}\n$$\nwhere $d=$ distance between two atoms $a=$ edge length\n$$\n\\begin{aligned}\n& 1.73=\\frac{\\sqrt{3}}{2} a \\\\\n& a=\\frac{2 \\times 1.73}{\\sqrt{3}}=2 Å=200 \\mathrm{pm}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65b15", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}], "question": {"text": "Lithium forms body centred cubic structure. The length of the side of its unit cell is $351 \\mathrm{pm}$. Atomic radius of the lithium will be:", "image": null}, "options": [{"id": "islTc", "text": "\n$75 \\mathrm{~pm}$\n", "image": null, "isCorrect": false}, {"id": "wQ4wv", "text": "\n$300 \\mathrm{~pm}$\n", "image": null, "isCorrect": false}, {"id": "5sF9n", "text": "\n$240 \\mathrm{~pm}$\n", "image": null, "isCorrect": false}, {"id": "GHl9t", "text": "\n$152 \\mathrm{~pm}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For BCC, $\\sqrt{3} a=4 r$\n$r=\\frac{\\sqrt{3} \\times 351}{4}=152 \\mathrm{~pm}$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Offline)", "title": "JEE Main 2012 (Offline)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6596c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}], "question": {"text": "In a face centred cubic lattice, atom A occupies the corner positions and atom B occupies the face centre positions. If one atom of $B$ is missing from one of the face centred points, the formula of the compound is", "image": null}, "options": [{"id": "9vFta", "text": "\n$\\mathrm{AB}_2$\n", "image": null, "isCorrect": false}, {"id": "Jy4ci", "text": "\n$A_2 B_3$\n", "image": null, "isCorrect": false}, {"id": "yGpkU", "text": "\n$\\mathrm{A}_2 \\mathrm{~B}_5$\n", "image": null, "isCorrect": true}, {"id": "4j89B", "text": "\n$A_2 B$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Effective no.of $A$ atoms $=\\frac{1}{8} \\times 8=1$\nEffective no.of $B$ atoms $=\\frac{1}{2} \\times 5$ (One is missing) $=\\frac{5}{2}$\nTherefore formula is $A_1 B_{\\frac{5}{2}}=A_2 B_5$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "JEE Main 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6590f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}], "question": {"text": "Percentage of free space in cubic close packed structure and in body centred packed structure are respectively", "image": null}, "options": [{"id": "GyvVr", "text": "\n$30 \\%$ and $26 \\%$\n", "image": null, "isCorrect": false}, {"id": "mn33F", "text": "\n$26 \\%$ and $32 \\%$\n", "image": null, "isCorrect": true}, {"id": "cuLkA", "text": "\n$32 \\%$ and $48 \\%$\n", "image": null, "isCorrect": false}, {"id": "GBZ7O", "text": "\n$48 \\%$ and $26 \\%$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Packing fraction of cubic close packing and body centred packing are $0.74$ and $0.68$ respectively.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65909", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}], "question": {"text": "The edge length of a face centered cubic cell of an ionic substance is $508 \\mathrm{pm}$. If the radius of the cation is $110 \\mathrm{pm}$, the radius of the anion is", "image": null}, "options": [{"id": "xWjte", "text": "\n$288 \\mathrm{pm}$\n", "image": null, "isCorrect": false}, {"id": "ZrBTn", "text": "\n$398 \\mathrm{pm}$\n", "image": null, "isCorrect": false}, {"id": "skB2w", "text": "\n$618 \\mathrm{pm}$\n", "image": null, "isCorrect": false}, {"id": "LJTjV", "text": "\n$144 \\mathrm{pm}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For an ionic substance in FCC arrangement,\n$$\n\\begin{aligned}\n& 2\\left(r^{+}+r^{-}\\right)=\\text {edge length } \\\\\n& 2\\left(110+r^{-}\\right)=508 \\\\\n& r^{-}=144 \\mathrm{pm}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7ca", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "JEE Main 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d658ab", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}], "question": {"text": "Copper crystallizes in fcc with a unit cell length of $361 \\mathrm{pm}$. What is the radius of copper atom ?", "image": null}, "options": [{"id": "cBmF2", "text": "\n$108 \\mathrm{pm}$\n", "image": null, "isCorrect": false}, {"id": "TYwDQ", "text": "\n$127 \\mathrm{pm}$\n", "image": null, "isCorrect": true}, {"id": "8PtQA", "text": "\n157 pm\n", "image": null, "isCorrect": false}, {"id": "Qkw4B", "text": "\n$181 \\mathrm{pm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For FCC,\n$\\sqrt{2} a=4 r$ (the atoms touches each other along the face- diagonal)\n$$\n\\begin{aligned}\n& r=\\frac{\\sqrt{2} a}{4}=\\frac{\\sqrt{2} \\times 361}{4} \\\\\n& =127 \\mathrm{pm}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "JEE Main 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65856", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}], "question": {"text": "In a compound atoms of element $Y$ from ccp lattice and those of element $X$ occupy $2 / 3^{\\text {rd }}$ of tetrahedral voids. The formula of the compound will be", "image": null}, "options": [{"id": "KMVFu", "text": "\n$X_4 Y_3$\n", "image": null, "isCorrect": true}, {"id": "67Avo", "text": "\n$X_2 Y_3$\n", "image": null, "isCorrect": false}, {"id": "S089A", "text": "\n$X_2 Y$\n", "image": null, "isCorrect": false}, {"id": "uRsRp", "text": "\n$\\mathrm{X}_3 \\mathrm{Y}_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No. of atoms of $Y=4$\nNo. of atoms of $X=\\frac{2}{3} \\times 8$\nFormula of compound will be $X_4 Y_3$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "JEE Main 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d65746", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}], "question": {"text": "Total volume of atoms present in a face-centre cubic unit cell of a metal is ( $r$ is atomic radius)", "image": null}, "options": [{"id": "c6dSA", "text": "\n$\\frac{20}{3} \\pi r^3$\n", "image": null, "isCorrect": false}, {"id": "HkEwQ", "text": "\n$\\frac{24}{3} \\pi r^3$\n", "image": null, "isCorrect": false}, {"id": "ctsBh", "text": "\n$\\frac{12}{3} \\pi r^3$\n", "image": null, "isCorrect": false}, {"id": "tJThn", "text": "\n$\\frac{16}{3} \\pi r^3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} V & =n \\times\\left(\\frac{4}{3} \\pi r^3\\right) \\\\ & =4 \\times\\left(\\frac{4}{3} \\pi r^3\\right) \\\\ & =\\frac{16}{3} \\pi r^3\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Main 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a62417cc3fb48d6567a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}], "question": {"text": "An ionic compound has a unit cell consisting of A ions at the corners of a cube and B ions on the centres of the faces of the cube. The empirical formula for this compound would be", "image": null}, "options": [{"id": "6M3DS", "text": "\n$\\mathrm{A}\\mathrm{~B}$\n", "image": null, "isCorrect": false}, {"id": "6a425", "text": "\n$\\mathrm{A}_2 \\mathrm{~B}$\n", "image": null, "isCorrect": false}, {"id": "GLbMo", "text": "\n$\\mathrm{A}\\mathrm{~B}_3$\n", "image": null, "isCorrect": true}, {"id": "SUKjQ", "text": "\n$\\mathrm{A}_3 \\mathrm{~B}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\nA=\\frac{1}{8} \\times 8=1\n$$\n(Corner)\n$\\mathrm{B}=\\frac{1}{2} \\times 6=3$\n(Face centre)\n$\\therefore \\mathrm{AB}_3$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2005-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2005", "title": "JEE Main 2005"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d65416", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}], "question": {"text": "Na and Mg crystallize in BCC and FCC type crystals respectively, then the number of atoms of Na and Mg present in the unit cell of their respective crystal is", "image": null}, "options": [{"id": "TDP8m", "text": "\n4 and 2\n", "image": null, "isCorrect": false}, {"id": "Ti8wN", "text": "\n9 and 14\n", "image": null, "isCorrect": false}, {"id": "J2dsw", "text": "\n14 and 9\n", "image": null, "isCorrect": false}, {"id": "4H3tj", "text": "\n2 and 4", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "BCC - points are at corners and one in the centre of the unit cell\nNumber of atoms per unit cell $=8 \\times \\frac{1}{8}+1=2$\nFCC - points are at the corners and also centre of the six faces of each cell\nNumber of atoms per unit cell $=8 \\times \\frac{1}{8}+6 \\times \\frac{1}{2}=4$", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92e9de3d91842a5cf7c2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2002-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2002", "title": "JEE Main 2002"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "648b5a73417cc3fb48d692be", "title": "Ionic structure", "totalQuestions": 2, "questions": [{"_id": "648b5a71417cc3fb48d68733", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}], "question": {"text": "Which of the following expressions is correct in case of a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CsCl</mi></math>&nbsp;unit cell (edge length &lsquo;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi></math>&rsquo;)<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>?</mo></math>", "image": null}, "options": [{"id": "9npZg", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><msup><mi>Cs</mi><mo>+</mo></msup></msub><mo>+</mo><msub><mi mathvariant=\"normal\">r</mi><msup><mi>Cl</mi><mo>-</mo></msup></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">a</mi><mn>2</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "M7KSQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><msup><mi>Cs</mi><mo>+</mo></msup></msub><mo>+</mo><msub><mi mathvariant=\"normal\">r</mi><msup><mi>Cl</mi><mo>-</mo></msup></msub><mo>=</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac><mi mathvariant=\"normal\">a</mi></math>", "image": null, "isCorrect": true}, {"id": "RDUBN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><msup><mi>Cs</mi><mo>+</mo></msup></msub><mo>+</mo><msub><mi mathvariant=\"normal\">r</mi><msup><mi>Cl</mi><mo>-</mo></msup></msub><mo>=</mo><mfrac><mi mathvariant=\"normal\">a</mi><msqrt><mn>2</mn></msqrt></mfrac></math>", "image": null, "isCorrect": false}, {"id": "4yidl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><msup><mi>Cs</mi><mo>+</mo></msup></msub><mo>+</mo><msub><mi mathvariant=\"normal\">r</mi><msup><mi>Cl</mi><mo>-</mo></msup></msub><mo>=</mo><mi mathvariant=\"normal\">a</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CsCl</mi></math>&nbsp;has body centered type structure in which <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Cs</mi><mo>+</mo></msup></math> occupies at corner of a cube and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Cl</mi><mo>&#8211;</mo></msup></math> occupies the centre of the cube.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msub><mi mathvariant=\"normal\">r</mi><msup><mi>Cs</mi><mo>+</mo></msup></msub><mo>+</mo><mn>2</mn><msub><mi mathvariant=\"normal\">r</mi><msup><mi>Cl</mi><mo>-</mo></msup></msub><mo>=</mo><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">a</mi></math>&nbsp;(where a is the edge length of&nbsp;the cube)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">r</mi><msup><mi>Cs</mi><mo>+</mo></msup></msub><mo>+</mo><msub><mi mathvariant=\"normal\">r</mi><mi>Cr</mi></msub><mo>=</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac><mi mathvariant=\"normal\">a</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6497", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-15T09:00:00.000Z", "isVisible": true, "shortName": "2023 (15 Apr Shift 1)", "title": "JEE Main 2023 (15 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d654ce", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "How many unit cells are present in a cubeshaped ideal crystal of $\\mathrm{NaCl}$ of mass $1.00 \\mathrm{~g}$ ? [Atomic masses: $\\mathrm{Na}=23, \\mathrm{Cl}=35.5$ ]", "image": null}, "options": [{"id": "uoy0O", "text": "\n$5.14 \\times 10^{21}$ unit cells\n", "image": null, "isCorrect": false}, {"id": "BWa2z", "text": "\n$1.28 \\times 10^{21}$ unit cells\n", "image": null, "isCorrect": false}, {"id": "OKwjD", "text": "\n$1.71 \\times 10^{21}$ unit cells\n", "image": null, "isCorrect": false}, {"id": "GzvPO", "text": "\n$2.57 \\times 10^{21}$ unit cells", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Number of formulas in cube shaped crystals $=\\frac{1.0}{58.5} \\times 6.02 \\times 10^{23}$ since in $\\mathrm{NaCl}$ type of structure 4 formula units form a cell\n$\\therefore$ unit cells $=\\frac{1.0 \\times 6.02 \\times 10^{23}}{58.5 \\times 4}=2.57 \\times 10^{21}$ unit cells.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "648b5a73417cc3fb48d692bf", "title": "Stoichiometric defects", "totalQuestions": 7, "questions": [{"_id": "648b5a6e417cc3fb48d67cf1", "previousYearPapers": [{"_id": "62c481f101514d218a7934d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 1)", "title": "JEE Main 2022 (28 Jun Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The incorrect statement about the imperfections in solids is", "image": null}, "options": [{"id": "T1UrS", "text": "Schottky defect decreases the density of the substance.", "isCorrect": false, "image": null}, {"id": "YJzVK", "text": "Frenkel defect does not alter the density of the substance.", "isCorrect": false, "image": null}, {"id": "EC2oq", "text": "Interstitial defect increases the density of the substance.", "isCorrect": false, "image": null}, {"id": "cyEfv", "text": "Vacancy defect increases the density of the substance.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Frenkel Defect: This defect is shown by ionic solids. The smaller ion (usually cation) is dislocated from its normal site to an interstitial site. It creates a vacancy defect at its original site and an interstitial defect at its new location. Frenkel defect is also called dislocation defect. It does not change the density of the solid. In all other defects there is a change in the density.</p><p>In Schottky defect equal number of cation and anion are missing from their position so, it&nbsp;decreases the density of the substance.</p><p>In Interstitial defect extra atoms are present at interstitial position so, it&nbsp;increases the density of the substance.</p><p>Due to vacancy defect density of the substance will decrease. since atoms are missing from their positions.</p>", "image": null}, "videoSolution": {"videoId": "a081845c851647f99cebcdde5b507b67", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/rF408CtOX9co6.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/rF408CtOX9co6.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 1)", "title": "JEE Main 2022 (28 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d673cf", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 1)", "title": "JEE Main 2021 (26 Aug Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Given below are two statements:<br />Statement I : Frenkel defects are vacancy as well as interstitial defects.<br />Statement II : Frenkel defect leads to colour in ionic solids due to presence of F-centres.</p><p>Choose the most appropriate answer for the statements from the options given below:</p>", "image": null}, "options": [{"id": "q8K15", "text": "Statement I is false but Statement II is true", "isCorrect": false, "image": null}, {"id": "Kx0uU", "text": "Both Statement I and Statement II are false", "isCorrect": false, "image": null}, {"id": "W5eh5", "text": "Statement I is true but Statement II is false", "isCorrect": true, "image": null}, {"id": "Y75WK", "text": "Both Statement I and Statement II are true", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>A Frenkel defect is another form of a point defect which is created when an atom or cation leaves its original place in the lattice structure to create a vacancy while occupying another interstitial position within the solid crystal.&nbsp;Frenkel defect is dislocation defect, it is not interstitial defect, and it is not responsible for colour of solid.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "615d92edde3d91842a5cf81b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-26T09:00:00.000Z", "isVisible": true, "shortName": "2021 (26 Aug Shift 1)", "title": "JEE Main 2021 (26 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66d57", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7fb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-08T14:00:00.000Z", "isVisible": true, "shortName": "2020 (08 Jan Shift 2)", "title": "JEE Main 2020 (08 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which of the following compounds is likely to show both Frenkel and Schottky defects in its crystalline form?", "image": null}, "options": [{"id": "R2Sm1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AgBr</mi></math>", "isCorrect": true, "image": null}, {"id": "NpqZb", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CsCl</mi></math>", "isCorrect": false, "image": null}, {"id": "vCPta", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>KBr</mi></math>", "isCorrect": false, "image": null}, {"id": "lPPfF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>ZnS</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AgBr</mi></math> can exhibit both Schottky and Frenkel defect.</p><p>Schottky&nbsp;defect&nbsp;in&nbsp;<em><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AgBr</mi></math></em>&nbsp;is exhibited due to the precipitation of both cations and anions. In&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AgBr</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>Ag</mi><mo>+</mo></msup></math>&nbsp;ion is small in size and when removed&nbsp;from the lattice point, they can occupy the interstitial sites and, hence,&nbsp;shows&nbsp;both Frenkel and Schottky&nbsp;defects.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7fb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-08T14:00:00.000Z", "isVisible": true, "shortName": "2020 (08 Jan Shift 2)", "title": "JEE Main 2020 (08 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d66231", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2018 (08 Apr)", "title": "JEE Main 2018 (08 Apr)"}], "question": {"text": "Which type of 'defect' has the presence of cations in the interstitial sites?", "image": null}, "options": [{"id": "x6La8", "text": "Metal deficiency defect", "image": null, "isCorrect": false}, {"id": "SfNYc", "text": "Schottky defect", "image": null, "isCorrect": false}, {"id": "Aw0S6", "text": "Vacancy defect", "image": null, "isCorrect": false}, {"id": "a7Zo9", "text": "Frenkel defect", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "In Frenkel defect, some of the ions (usually cation due to their small size) missing from their correct position and occupies interstitial position.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2018 (08 Apr)", "title": "JEE Main 2018 (08 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65e98", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-19T09:00:00.000Z", "isVisible": true, "shortName": "2014 (19 Apr Online)", "title": "JEE Main 2014 (19 Apr Online)"}], "question": {"text": "The total number of octahedral void (s) per atom present in a cubic close packed structure is :", "image": null}, "options": [{"id": "6XM9r", "text": "1", "image": null, "isCorrect": true}, {"id": "TeEeJ", "text": "2", "image": null, "isCorrect": false}, {"id": "oXP8f", "text": "3", "image": null, "isCorrect": false}, {"id": "KKNOU", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>In CCP there are four atoms per unit cell octahedral voids are<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mfenced><mtext>Edge centres</mtext></mfenced><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>+</mo><mn>1</mn><mfenced><mtext>Body centre</mtext></mfenced><mo>=</mo><mn>4</mn><mo>&#160;</mo><mi mathvariant=\"normal\">O</mi><mo>.</mo><mi mathvariant=\"normal\">V</mi><mo>.</mo></math>&nbsp;[Contribution at edge centre is<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math> ]</p><p>Four octahedral voids are present in a unit cell i.e. four atoms.</p><p>Therefore, per atom one octahedral void will be present.</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-19T09:00:00.000Z", "isVisible": true, "shortName": "2014 (19 Apr Online)", "title": "JEE Main 2014 (19 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65acb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}], "question": {"text": "Among the following the incorrect statement is", "image": null}, "options": [{"id": "2hxNZ", "text": "\nDensity of crystals remains unaffected due to Frenkel defect.\n", "image": null, "isCorrect": false}, {"id": "fSd2t", "text": "\nIn BCC unit cell the void space is $32 \\%$.\n", "image": null, "isCorrect": false}, {"id": "HTeXQ", "text": "\nDensity of crystals decreases due to Schottky defect.\n", "image": null, "isCorrect": false}, {"id": "RuyqI", "text": "\nElectrical conductivity of semiconductors and metals increases with increase in temperature.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The electrical resistance of metals depends upon temperature. Electrical resistance decreases with decrease in temperature and becomes zero near the absolute temperature. Material in this state is said to possess super conductivity.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7d0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-26T09:00:00.000Z", "isVisible": true, "shortName": "2012 (26 May Online)", "title": "JEE Main 2012 (26 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d655a9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}], "question": {"text": "What type of crystal defect is indicated in the diagram below?\n$\\mathrm{Na}^{+} \\mathrm{Cl}^{-} \\mathrm{Na}^{+} \\mathrm{Cl}^{-} \\mathrm{Na}^{+} \\mathrm{Cl}^{-}$\n$\\mathrm{Cl}^{-} \\square \\mathrm{Cl}^{-} \\square \\mathrm{Na}^{+} \\square \\mathrm{Na}^{+}$\n$\\mathrm{Na}^{+} \\mathrm{Cl}^{-} \\square \\mathrm{Cl}^{-} \\mathrm{Na}^{+} \\mathrm{Cl}^{-}$\n$\\mathrm{Cl}^{-} \\mathrm{Na}^{+} \\mathrm{Cl}^{-} \\mathrm{Na}^{+} \\square \\mathrm{Na}^{+}$", "image": null}, "options": [{"id": "IvsNk", "text": "\nFrenkel defect\n", "image": null, "isCorrect": false}, {"id": "fwrix", "text": "\nFrenkel and Schottky defects\n", "image": null, "isCorrect": false}, {"id": "FdMJ0", "text": "\nInterstitial defect\n", "image": null, "isCorrect": false}, {"id": "Y22Ld", "text": "\nSchottky defect", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "648b5a73417cc3fb48d692c1", "title": "Non-stoichiometric defects", "totalQuestions": 5, "questions": [{"_id": "648b5a6e417cc3fb48d67f1a", "previousYearPapers": [{"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "<p>Which of the following represents the lattice structure of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">A</mi><mrow><mn>0</mn><mo>.</mo><mn>95</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math> containing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mpadded lspace=\"-1px\"><msup><mi mathvariant=\"normal\">A</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></mpadded><mo>,</mo><mo>&#160;</mo><msup><mi mathvariant=\"normal\">A</mi><mrow><mn>3</mn><mo>+</mo></mrow></msup></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">O</mi><mrow><mn>2</mn><mo>&#8211;</mo></mrow></msup></math> ions?</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/ca6c2cb7-289d-4766-bd6b-7808abaa641f-9896768.PNG\" style=\"width: 181px; height: 30px;\" /></p><p>A.<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fc7a20d3-d903-4158-b5b4-1d57fcf84518-9896768_1.PNG\" style=\"width: 374px; height: 230px;\" /></p><p>B.<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/8c675a0a-ac21-4674-b331-1c12c6b4a6da-9896768_2.PNG\" style=\"width: 300px; height: 300px;\" /></p><p>C.<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/750dd03f-cbda-4759-a421-e6fb57784aa2-9896768_3.PNG\" style=\"width: 359px; height: 360px;\" />&nbsp;</p>", "image": null}, "options": [{"id": "c9jda", "text": "B and C only", "isCorrect": false, "image": null}, {"id": "jGOgd", "text": "B only", "isCorrect": false, "image": null}, {"id": "ZULHC", "text": "A and B only", "isCorrect": false, "image": null}, {"id": "98jGH", "text": "A only", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Applying the electrical neutrality principle in metal deficiency defect.</p><p>One&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">A</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>&nbsp;is missing then two&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">A</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>&nbsp;ions are converted into&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">A</mi><mrow><mn>3</mn><mo>+</mo></mrow></msup></math>&nbsp;ion so&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>05</mn><mo>&#160;</mo><msup><mi mathvariant=\"normal\">A</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>&nbsp;ion are missing and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>.</mo><mn>05</mn><mo>&#215;</mo><mn>2</mn></mrow></mfenced></math>&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">A</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>&nbsp;ion are converted in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">A</mi><mrow><mn>3</mn><mo>+</mo></mrow></msup></math>&nbsp;ion so for each&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">O</mi><mrow><mn>2</mn><mo>-</mo></mrow></msup></math>&nbsp;ion total&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">A</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>&nbsp;ion&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>85</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mtext>A</mtext><mrow><mn>3</mn><mo>+</mo></mrow></msup></math>&nbsp;ion is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>1</mn></math>.</p><p>Hence, A satisfies the condition.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68308", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "A sample of a metal oxide has formula <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mrow><mn>0</mn><mo>.</mo><mn>83</mn></mrow></msub><msub><mi mathvariant=\"normal\">O</mi><mrow><mn>1</mn><mo>.</mo><mn>00</mn></mrow></msub></math>. The metal <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> can exist in two oxidation states <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mn>2</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mn>3</mn></math>. In the sample of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mrow><mn>0</mn><mo>.</mo><mn>83</mn></mrow></msub><msub><mi mathvariant=\"normal\">O</mi><mrow><mn>1</mn><mo>.</mo><mn>00</mn></mrow></msub></math>, the percentage of metal ions existing in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>+</mo><mn>2</mn></math>&nbsp;oxidation state is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>%</mo></math>. (nearest integer)", "image": null}, "options": [], "correctValue": "59", "solution": {"text": "<p>Let number of ions of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">M</mi><mrow><mo>+</mo><mn>2</mn></mrow></msup><mo>=</mo><mi mathvariant=\"normal\">x</mi></math></p><p>Thus, as net charge has to be zero,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">M</mi><mrow><mo>+</mo><mn>3</mn></mrow></msup><mo>=</mo><mn>0</mn><mo>.</mo><mn>83</mn><mo>-</mo><mi mathvariant=\"normal\">x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mi mathvariant=\"normal\">x</mi><mo>+</mo><mn>3</mn><mo>(</mo><mn>0</mn><mo>.</mo><mn>83</mn><mo>-</mo><mi mathvariant=\"normal\">x</mi><mo>)</mo><mo>+</mo><mn>1</mn><mo>(</mo><mo>-</mo><mn>2</mn><mo>)</mo><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mi mathvariant=\"normal\">x</mi><mo>+</mo><mn>2</mn><mo>.</mo><mn>49</mn><mo>-</mo><mn>3</mn><mi mathvariant=\"normal\">x</mi><mo>-</mo><mn>2</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>49</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>%</mo><msup><mi mathvariant=\"normal\">M</mi><mrow><mn>2</mn><mo>+</mo></mrow></msup><mtext>&#160;ions&#160;</mtext><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>49</mn></mrow><mrow><mn>0</mn><mo>.</mo><mn>83</mn></mrow></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>59</mn><mo>.</mo><mn>03</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67b9d", "previousYearPapers": [{"_id": "62c481f101514d218a7934d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T09:00:00.000Z", "isVisible": true, "shor     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Main';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer Type' : 'Single Correct Option'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
