l, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf813", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-18T14:00:00.000Z", "isVisible": true, "shortName": "2021 (18 Mar Shift 2)", "title": "JEE Main 2021 (18 Mar Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d6655d", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 1)", "title": "JEE Main 2019 (09 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The one that is extensively used as a piezoelectric material is:", "image": null}, "options": [{"id": "K81vZ", "text": "Tridymite", "isCorrect": false, "image": null}, {"id": "wvhTd", "text": "Quartz", "isCorrect": true, "image": null}, {"id": "wiKKd", "text": "Amorphous silica", "isCorrect": false, "image": null}, {"id": "Zzu0Q", "text": "Mica", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Piezoelectric materials are those that produce an electric current when placed under mechanical stress.</p><p>Quartz is used as a piezoelectric material in electronic devices.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 1)", "title": "JEE Main 2019 (09 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d65b86", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}], "question": {"text": "Which of the following exists as covalent crystals in the solid state ?", "image": null}, "options": [{"id": "lohiJ", "text": "Sulphur", "image": null, "isCorrect": false}, {"id": "mFqoZ", "text": "Phosphorus", "image": null, "isCorrect": false}, {"id": "mUvhJ", "text": "Iodine", "image": null, "isCorrect": false}, {"id": "MoG5g", "text": "Silicon", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Silicon is covalent or network solid.<br /><br />Each Si atom is in sp<sup>3&nbsp;</sup>hybridisation.<br /><br />Sulphur (S<sub>8</sub>)&nbsp; &ndash;&nbsp; molecular solid.<br /><br />Phosphorus (P<sub>4</sub>)&nbsp; &ndash;&nbsp;molecular solid.<br /><br />Iodine (I<sub>2</sub>)&nbsp;&nbsp;&nbsp;&ndash;&nbsp; molecular solid.<br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6485", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2013-04-07T09:00:00.000Z", "isVisible": true, "shortName": "2013 (07 Apr)", "title": "JEE Main 2013 (07 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a63417cc3fb48d659bb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}], "question": {"text": "Among the following which is the best description of water in the solid phase?", "image": null}, "options": [{"id": "Zj0qt", "text": "\nCovalent solid\n", "image": null, "isCorrect": false}, {"id": "hkeTr", "text": "\nMolecular solid\n", "image": null, "isCorrect": true}, {"id": "E8QqX", "text": "\nIonic solid\n", "image": null, "isCorrect": false}, {"id": "FWZmv", "text": "\nNetwork solid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Molecular solid is the best description of water in the solid phase. For example ice is hydrogen bonded molecular solid.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7cd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2012-05-07T09:00:00.000Z", "isVisible": true, "shortName": "2012 (07 May Online)", "title": "JEE Main 2012 (07 May Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a61417cc3fb48d654cc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}], "question": {"text": "Glass is a", "image": null}, "options": [{"id": "d1f7m", "text": "\nsuper-cooled liquid\n", "image": null, "isCorrect": true}, {"id": "jQFoK", "text": "\ngel\n", "image": null, "isCorrect": false}, {"id": "chlB4", "text": "\npolymeric mixture\n", "image": null, "isCorrect": false}, {"id": "m0SK3", "text": "\nmicro-crystalline solid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Glass is a transparent or translucent super cooled liquid.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2003-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2003", "title": "JEE Main 2003"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "648b5a73417cc3fb48d692c0", "title": "Crystal Structure of Solids", "totalQuestions": 7, "questions": [{"_id": "648b5a70417cc3fb48d683b3", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 2)", "title": "JEE Main 2023 (06 Apr Shift 2)"}], "question": {"text": "<p>Number of crystal systems from the following where body centred unit cell can be found, is _____.</p><p>Cubic, tetragonal, orthorhombic, hexagonal, rhombohedral, monoclinic, triclinic</p>", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<blockquote><p>Bravais Lattice refers to the 14 different 3-dimensional configurations into which atoms can be arranged in crystals. The smallest group of symmetrically aligned atoms which can be repeated in an array to make up the entire crystal is called a unit cell. Crystal systems where body centred unit cell can be found are Cubic, orthorhombic and tetragonal</p><p>Hence, correct answer is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 2)", "title": "JEE Main 2023 (06 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6824c", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}], "type": "numerical", "level": 3, "question": {"text": "<p>Iron oxide <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>FeO</mi></math>, crystallises in a cubic lattice with a unit cell edge length of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>.</mo><mn>0</mn><mo>&#8491;</mo></math>. If density of the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>FeO</mi></math> in the crystal is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>0</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>&#160;</mo><msup><mi>cm</mi><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>, then the number of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>FeO</mi></math>&nbsp;units present per unit cell is _____ (Nearest integer)</p><p>Given : Molar mass of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Fe</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>56</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> respectively.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><mn>6</mn><mo>.</mo><mn>0</mn><mo>&#215;</mo><msup><mn>10</mn><mn>23</mn></msup><mo>&#160;</mo><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></math></p>", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p>The density of the crystal can be calculated as follows,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">d</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">Z</mi><mo>&#215;</mo><mi mathvariant=\"normal\">M</mi></mrow><mrow><msub><mi mathvariant=\"normal\">N</mi><mn>0</mn></msub><mo>&#215;</mo><msup><mi mathvariant=\"normal\">a</mi><mn>3</mn></msup></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">d</mi><mo>=</mo><mi>density</mi><mspace linebreak=\"newline\"></mspace><mi mathvariant=\"normal\">Z</mi><mo>=</mo><mi>effective</mi><mo>&#160;</mo><mi>number</mi><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi>atoms</mi><mspace linebreak=\"newline\"></mspace><mi mathvariant=\"normal\">M</mi><mo>=</mo><mi>Molar</mi><mo>&#160;</mo><mi>mass</mi><mspace linebreak=\"newline\"></mspace><msub><mi mathvariant=\"normal\">N</mi><mn>0</mn></msub><mo>=</mo><mi>Avogadro</mi><mo>&#39;</mo><mi mathvariant=\"normal\">s</mi><mo>&#160;</mo><mi>number</mi><mspace linebreak=\"newline\"></mspace><mi mathvariant=\"normal\">a</mi><mo>=</mo><mi>Edge</mi><mo>&#160;</mo><mi>length</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">Z</mi><mo>&#215;</mo><mn>72</mn></mrow><mrow><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mn>23</mn></msup><mo>&#215;</mo><mn>125</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>24</mn></mrow></msup></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Z</mi><mo>=</mo><mn>4</mn><mo>.</mo><mn>166</mn><mo>&#8771;</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": {"videoId": "692cca7aaf6a4ab5a565a954edc59b33", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/kPsMW46wNK4JQ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/kPsMW46wNK4JQ.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d666b2", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ea", "examId": "615d76b >a</mi></math>", "image": null, "isCorrect": false}, {"id": "jfZA1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">a</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">r</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">a</mi></math>", "image": null, "isCorrect": false}, {"id": "22cD3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">a</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">r</mi><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">a</mi></math>", "image": null, "isCorrect": false}, {"id": "UdcZW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">r</mi><mo>=</mo><mi mathvariant=\"normal\">a</mi></math> and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi mathvariant=\"normal\">r</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">a</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<blockquote><p>A face-centered cubic (fcc) unit cell contains a component in the center of each face in addition to those at the corners of the cube. The atoms touch each other along the face diagonal.</p><p>For <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>FCC</mi><mo>:</mo><mo>&#160;</mo><mo>&#160;</mo><mi mathvariant=\"normal\">a</mi><msqrt><mn>2</mn></msqrt><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">r</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">r</mi></math></p><p>A body-centered cubic (bcc) unit cell contains a component in the center of the cube&nbsp;in addition to those at the corners of the cube.&nbsp;The atoms touch each other along the body&nbsp;diagonal.<br /><br />For <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BCC</mi><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mi mathvariant=\"normal\">a</mi><msqrt><mn>3</mn></msqrt><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">r</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6491", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 2)", "title": "JEE Main 2023 (10 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68347", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 1)", "title": "JEE Main 2023 (06 Apr Shift 1)"}], "question": {"text": "<p>A compound is formed by two elements <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi><mo>.</mo></math> The element <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math> forms cubic close packed arrangement and those of element <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math> occupy one third of the tetrahedral voids. What is the formula of the compound?</p>", "image": null}, "options": [{"id": "uUC4j", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">X</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">Y</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": true}, {"id": "bpQ1l", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">X</mi><mn>3</mn></msub><msub><mi mathvariant=\"normal\">Y</mi><mn>2</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "R9Jh4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">X</mi><mn>3</mn></msub><mi mathvariant=\"normal\">Y</mi></math>", "image": null, "isCorrect": false}, {"id": "ln6Rz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>XY</mi><mn>3</mn></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Atoms of Element&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math>, are present in cubic close packing. In cubic close packing the number of atoms per unit cell is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>.</p><p class=\"Solution_html__KkUW2\" style=\"border: 0px; margin: 0px; padding: 0px; text-align: start; -webkit-text-stroke-width: 0px;\">So, the effective number of element&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math>,&nbsp;per unit cell is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math></p><p class=\"Solution_html__KkUW2\" style=\"border: 0px; margin: 0px; padding: 0px; text-align: start; -webkit-text-stroke-width: 0px;\">Element&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>, are present at one third of the tetrahedral voids.</p><p class=\"Solution_html__KkUW2\" style=\"border: 0px; margin: 0px; padding: 0px; text-align: start; -webkit-text-stroke-width: 0px;\">Number of tetrahedral void&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo></math>Twice the number of atoms in unit cell</p><p class=\"Solution_html__KkUW2\" style=\"border: 0px; margin: 0px; padding: 0px; text-align: start; -webkit-text-stroke-width: 0px;\">Number of atoms of Element <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>&nbsp;are present&nbsp;unit cell&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#215;</mo><mn>8</mn><mo>=</mo><mfrac><mn>8</mn><mn>3</mn></mfrac></math></p><p class=\"Solution_html__KkUW2\" style=\"border: 0px; margin: 0px; padding: 0px; text-align: start; -webkit-text-stroke-width: 0px;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mi mathvariant=\"normal\">Y</mi><mspace linebreak=\"newline\"></mspace><mfrac><mn>8</mn><mn>3</mn></mfrac><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mn>4</mn><mspace linebreak=\"newline\"></mspace><mn>2</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mn>3</mn><mspace linebreak=\"newline\"></mspace></math></p><p class=\"Solution_html__KkUW2\" style=\"border: 0px; margin: 0px; padding: 0px; text-align: start; -webkit-text-stroke-width: 0px;\">Formula of the compound&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msub><mi mathvariant=\"normal\">X</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">Y</mi><mn>3</mn></msub></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T09:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 1)", "title": "JEE Main 2023 (06 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67f7b", "previousYearPapers": [{"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}], "type": "numerical", "level": 1, "question": {"text": "A metal M crystallizes into two lattices :- face centred cubic (fcc) and body centred cubic (bcc) with unit cell edge length of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>0</mn></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>5</mn><mover><mi mathvariant=\"normal\">A</mi><mo>&#176;</mo></mover></math> respectively. The ratio of densities of lattices fcc to bec for the metal M is _______(Nearest integer)", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p>The density of the crystal lattice can be calculated as follows,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">d</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">Z</mi><mo>&#215;</mo><mi mathvariant=\"normal\">M</mi></mrow><mrow><msub><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">A</mi></msub><msup><mi mathvariant=\"normal\">a</mi><mn>3</mn></msup></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Z</mi><mo>=</mo></math>effective number of atoms in unit cell(For BCC=2 and FCC=4)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi><mo>=</mo></math>Molar mass</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">A</mi></msub></math>=Avogadro&#39;s number</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo></math>Edge length</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi mathvariant=\"normal\">d</mi><mi>FCC</mi></msub><msub><mi mathvariant=\"normal\">d</mi><mi>BCC</mi></msub></mfrac><mo>=</mo><mfrac><mfrac><mrow><mn>4</mn><mo>&#215;</mo><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">w</mi></msub></mrow><mrow><msub><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">A</mi></msub><mo>&#215;</mo><mo>(</mo><mn>2</mn><msup><mo>)</mo><mn>3</mn></msup></mrow></mfrac><mfrac><mrow><mn>2</mn><mo>&#215;</mo><msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">w</mi></msub></mrow><mrow><msub><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">A</mi></msub><mo>&#215;</mo><mo>(</mo><mn>2</mn><mo>.</mo><mn>5</mn><msup><mo>)</mo><mn>3</mn></msup></mrow></mfrac></mfrac><mo>=</mo><mn>3</mn><mo>.</mo><mn>90</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6819a", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}], "type": "numerical", "level": 1, "question": {"text": "<p>A metal <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math>&nbsp;forms hexagonal close-packed structure. The total number of voids in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>02</mn><mo>&#160;</mo><mi>mol</mi></math> of it is _____&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><msup><mn>10</mn><mn>21</mn></msup></math> (Nearest integer)</p><p>(Given <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><mn>6</mn><mo>.</mo><mn>02</mn><mo>&#215;</mo><msup><mn>10</mn><mn>23</mn></msup></math>)</p>", "image": null}, "options": [], "correctValue": "36", "solution": {"text": "<p>From the diagram of voids in HCP:<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f1bac7f5-f4bd-45bc-9082-80ccb084d85b-16.PNG\" style=\"width: 400px; height: 221px;\" /><br />There are 6 octahedral voids and 12 tetrahedral voids in a HCP unit cell.<br />One unit cell of HCP contains <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>18</mn></math>&nbsp;voids</p><p>Thus, No. of voids in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>02</mn><mo>&#160;</mo><mi>mol</mi></math> of hcp</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>18</mn><mn>6</mn></mfrac><mo>&#215;</mo><mn>6</mn><mo>.</mo><mn>02</mn><mo>&#215;</mo><msup><mn>10</mn><mn>23</mn></msup><mo>&#215;</mo><mn>0</mn><mo>.</mo><mn>02</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8776;</mo><mn>3</mn><mo>.</mo><mn>6</mn><mo>&#215;</mo><msup><mn>10</mn><mn>22</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8776;</mo><mn>36</mn><mo>&#215;</mo><msup><mn>10</mn><mn>21</mn></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68075", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A cubic solid is made up of two elements <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math>. Atoms of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">X</mi></math> are present on every alternate corner and one at the center of cube. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi></math> is at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfrac><mn>1</mn><mn>3</mn></mfrac><mi>rd</mi></msup></math>&nbsp;of the&nbsp;total faces. The empirical formula of the compound is", "image": null}, "options": [{"id": "sv0yB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">X</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">Y</mi><mrow><mn>1</mn><mo>.</mo><mn>5</mn></mrow></msub></math>", "isCorrect": false, "image": null}, {"id": "vqZdv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">X</mi><mrow><mn>1</mn><mo>.</mo><mn>5</mn></mrow></msub><mi mathvariant=\"normal\">Y</mi></math>", "isCorrect": true, "image": null}, {"id": "ZivBl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>XY</mi><mrow><mn>2</mn><mo>.</mo><mn>5</mn></mrow></msub></math>", "isCorrect": false, "image": null}, {"id": "kk2nh", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">X</mi><mrow><mn>1</mn><mo>.</mo><mn>5</mn></mrow></msub><msub><mi mathvariant=\"normal\">Y</mi><mn>2</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The share of the atom present at corner of the cube is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>/</mo><mn>8</mn></math>. The share of the atom at face centre is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>/</mo><mn>2</mn><mo>.</mo></math>&nbsp;Hence, the molecule can be represented as follows,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">X</mi><mrow><mn>4</mn><mo>&#215;</mo><mfrac><mn>1</mn><mn>8</mn></mfrac><mo>+</mo><mn>1</mn><mo>&#215;</mo><mn>1</mn></mrow></msub><msub><mi mathvariant=\"normal\">Y</mi><mrow><mn>6</mn><mo>&#215;</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi mathvariant=\"normal\">X</mi><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>+</mo><mn>1</mn></mrow></msub><mo>&#160;&#160;</mo><msub><mi mathvariant=\"normal\">Y</mi><mn>1</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi mathvariant=\"normal\">X</mi><mfrac><mn>2</mn><mn>3</mn></mfrac></msub><mo>&#160;&#160;</mo><msub><mi mathvariant=\"normal\">Y</mi><mn>1</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi mathvariant=\"normal\">X</mi><mrow><mn>1</mn><mo>.</mo><mn>5</mn></mrow></msub><mo>&#160;&#160;</mo><msub><mi mathvariant=\"normal\">Y</mi><mn>1</mn></msub></math>(Empirical formula)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi mathvariant=\"normal\">X</mi><mn>3</mn></msub><mo>&#160;&#160;</mo><msub><mi mathvariant=\"normal\">Y</mi><mn>2</mn></msub></math>.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67dba", "previousYearPapers": [{"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}], "type": "numerical", "level": 2, "question": {"text": "Ionic radii of cation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">A</mi><mo>+</mo></msup></math>&nbsp;and anion <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">B</mi><mo>-</mo></msup></math> are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>102</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>181</mn><mi>pm</mi></math> respectively. These ions are allowed to crystallize into an ionic solid. This crystal has cubic close packing for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">B</mi><mo>-</mo></msup><mo>.</mo><msup><mi mathvariant=\"normal\">A</mi><mo>+</mo></msup></math>&nbsp;is present in all octahedral voids. The edge length of the unit cell of the crystal <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AB</mi></math> is___<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>pm</mi></math>.", "image": null}, "options": [], "correctValue": "566", "solution": {"text": "<blockquote><p>In given ionic compound anions form&nbsp;CCP lattice, And&nbsp;cation is&nbsp;present in octahedral void. Means this structure is similar to structure of NaCl. Which is also called rock salt structure.</p><p>Edge length =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mo>?</mo></math></p><p>In rock salt structure cations and anions are in contact along the edge of the cube.&nbsp;</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mn>2</mn><mfenced><mrow><msub><mi mathvariant=\"normal\">r</mi><mo>+</mo></msub><mo>+</mo><msub><mi mathvariant=\"normal\">r</mi><mo>-</mo></msub></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mn>2</mn><mfenced><mrow><mn>102</mn><mo>+</mo><mn>181</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mn>2</mn><mfenced><mn>283</mn></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mn>566</mn><mo>&#160;</mo><mi>pm</mi></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "972f92d6ca024c6a89ef80b873b0f889", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Us2qTIQnw3vKO.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Us2qTIQnw3vKO.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67cac", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}], "type": "numerical", "level": 1, "question": {"text": "<p>Metal <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math> crystallizes into a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>FCC</mi></math> lattice with the edge length of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>.</mo><mn>0</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>8</mn></mrow></msup><mo>&#160;</mo><mi>cm</mi></math>. The atomic th xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> which form <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>15</mn></math>&nbsp;moles of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">A</mi><mn>2</mn></msub><mi mathvariant=\"normal\">B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>AB</mi><mn>3</mn></msub></math> type compounds. If both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">A</mi><mn>2</mn></msub><mi mathvariant=\"normal\">B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>AB</mi><mn>3</mn></msub></math> weigh equally, then the atomic weight of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is____times of atomic weight of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>.", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "<p>Given: Molar mass of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">A</mi><mn>2</mn></msub><mi mathvariant=\"normal\">B</mi><mo>=</mo><msub><mi>AB</mi><mn>3</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mfenced><mrow><mn>2</mn><mi mathvariant=\"normal\">A</mi><mo>+</mo><mi mathvariant=\"normal\">B</mi></mrow></mfenced><mo>=</mo><mfenced><mrow><mi mathvariant=\"normal\">A</mi><mo>+</mo><mn>3</mn><mi mathvariant=\"normal\">B</mi></mrow></mfenced><mfenced open=\"[\" close=\"]\"><mtable columnalign=\"left\"><mtr><mtd><mi mathvariant=\"normal\">A</mi><mo>&#8594;</mo><mi>Atomicwt</mi><mo>.</mo><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></mtd></mtr><mtr><mtd><mi mathvariant=\"normal\">B</mi><mo>&#8594;</mo><mi>Atomicwt</mi><mo>.</mo><mo>&#160;</mo><mi>of</mi><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi></mtd></mtr></mtable></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">A</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> atomic wt. of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is 2 times of atomic wt. of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> Integer answer is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>.</p><p>&nbsp;</p>", "image": null}, "videoSolution": {"videoId": "3ee114b9ecfe445cb3dc7b931387c361", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Vp5V15ePGr7ZX.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Vp5V15ePGr7ZX.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 1)", "title": "JEE Main 2022 (27 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67a90", "previousYearPapers": [{"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "In a solid <math xmlns=\"http:/ br />(Nearest integer):&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo></math> Given&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>:</mo><msub><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><mn>6</mn><mo>.</mo><mn>022</mn><mo>&#215;</mo><msup><mn>10</mn><mn>23</mn></msup><msup><mrow><mo>&#160;</mo><mi>mol</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>]</mo></math>", "image": null}, "options": [], "correctValue": "106", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">d</mi><mfenced><mfrac><mi>gm</mi><mi>cc</mi></mfrac></mfenced><mo>=</mo><mfrac><mrow><mn>4</mn><mo>&#215;</mo><mfrac><mi mathvariant=\"normal\">M</mi><msub><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">A</mi></msub></mfrac></mrow><mrow><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>&#160;</mo><mi>cm</mi><msup><mo>)</mo><mn>3</mn></msup></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>.</mo><mn>62</mn><mo>=</mo><mfrac><mrow><mn>4</mn><mo>&#215;</mo><mi mathvariant=\"normal\">M</mi><mo>/</mo><mn>6</mn><mo>.</mo><mn>022</mn><mo>&#215;</mo><msup><mn>10</mn><mn>23</mn></msup></mrow><msup><mfenced><mrow><mn>0</mn><mo>.</mo><mn>4518</mn><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>7</mn></mrow></msup><mo>&#160;</mo><mi>cm</mi></mrow></mfenced><mn>3</mn></msup></mfrac><mo>&#8658;</mo><mi mathvariant=\"normal\">M</mi><mo>=</mo><mn>105</mn><mo>.</mo><mn>8</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>/</mo><mi>mol</mi></math>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf816", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Jul Shift 1)", "title": "JEE Main 2021 (22 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d67118", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf815", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Jul Shift 2)", "title": "JEE Main 2021 (20 Jul Shift 2)"}], "type": "numerical", "level": 1, "question": {"text": "Diamond has a three dimensional structure of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi></math> atoms formed by covalent bonds. The structure of diamond has face centred cubic lattice where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>%</mo></math> of the tetrahedral voids are also occupied by carbon atoms. The number of carbon atoms present per unit cell of diamond is ________.", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "<p>Carbon atoms occupy FCC lattice points as well as half of the tetrahedral voids</p><p>therefore number of carbon atoms atoms per unit cell <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>8</mn></math></p>", "image": null}, "videoSolution": {"videoId": "e0f0eeb828ba496991f4642ae15adf72", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/7TjhLclXnB1ec.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/7TjhLclXnB1ec.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf815", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Jul Shift 2)", "title": "JEE Main 2021 (20 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d67001", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf812", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-18T09:00:00.000Z", "isVisible": true, "shortName": "2021 (18 Mar Shift 1)", "title": "JEE Main 2021 (18 Mar Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "In a binary compound, atoms of element <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> form a hcp structure and those of element <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">M</mi></math>&nbsp;occupy <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>/</mo><mn>3</mn></math>&nbsp;of the tetrahedral voids of the hcp structure. The formula of the binary compound is:", "image": null}, "options": [{"id": "o3ZTn", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>2</mn></msub><msub><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></mrow><mn>3</mn></msub></math>", "isCorrect": false, "image": null}, {"id": "9YBSP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>4</mn></msub><msub><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></mrow><mn>3</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "ggCnO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>4</mn></msub><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></math>", "isCorrect": false, "image": null}, {"id": "Wkvn9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>MA</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>In HCP unit cell number of effective number of atoms is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>,</p><p>so&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mn>6</mn></math>.</p><p>Number of tetrahedral voids</p><p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo></math>&nbsp;2 x number of&nbsp;atoms forming the lattice&nbsp;</p><p>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mi mathvariant=\"normal\">X</mi><mo>&#160;</mo><mn>6</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mrow><mn>12</mn><mo>&#215;</mo><mfrac><mn>2</mn><mn>3</mn></mfrac></mrow></msub><msub><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></mrow><mn>6</mn></msub></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>8</mn></msub><msub><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></mrow><mn>6</mn></msub></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">M</mi><mn>4</mn></msub><msub><mrow><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi></mrow><mn>3</mn></msub></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf812", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-18T09:00:00.000Z", "isVisible": true, "shortName": "2021 (18 Mar Shift 1)", "title": "JEE Main 2021 (18 Mar Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66ef5", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-16T14:00:00.000Z", "isVisible": true, "shortName": "2021 (16 Mar Shift 2)", "title": "JEE Main 2021 (16 Mar Shift 2)"}], "type": "numerical", "level": 3, "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ga</mi></math> (atomic mass <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>70</mn><mo>&#160;</mo><mi mathvariant=\"normal\">u</mi></math>) crystallizes in a hexagonal close packed structure. The total number of voids in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>581</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></math> of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ga</mi></math> is ________&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo><msup><mn>10</mn><mn>21</mn></msup></math>. (Round off to the Nearest Integer).", "image": null}, "options": [], "correctValue": "15", "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HCP</mi></math> structure : Per atom, there will be one octahedral void <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>OV</mi><mo>)</mo></math> and two tetrahedral voids <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>TV</mi><mo>)</mo></math>.</p><p>Therefore, total three voids per atom are present in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HCP</mi></math> structure.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8594;</mo></math>&nbsp;Therefore total no. of atoms of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ga</mi></math>&nbsp;will be-</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mo>&#160;</mo><mi>Mass</mi><mo>&#160;</mo></mrow><mrow><mo>&#160;</mo><mi>Molar</mi><mo>&#160;</mo><mi>Mass</mi><mo>&#160;</mo></mrow></mfrac><mo>&#215;</mo><msub><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">A</mi></msub><mo>=</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>581</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>70</mn><mo>&#160;</mo><mi mathvariant=\"normal\">g</mi><mo>/</mo><mi>mol</mi></mrow></mfrac><mo>&#215;</mo><mn>6</mn><mo>.</mo><mn>023</mn><mo>&#215;</mo><msup><mn>10</mn><mn>23</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8594;</mo></math> Now, total Number of voids <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#215;</mo></math> total no. of atoms&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn><mo>&#215;</mo><mfrac><mrow><mn>0</mn><mo>.</mo><mn>581</mn></mrow><mn>70</mn></mfrac><mo>&#215;</mo><mn>6</mn><mo>.</mo><mn>023</mn><mo>&#215;</mo><msup><mn>10</mn><mn>23</mn></msup><mo>=</mo><mn>14</mn><mo>.</mo><mn>99</mn><mo>&#215;</mo><msup><mn>10</mn><mn>21</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8771;</mo><mn>15</mn><mo>&#215;</mo><msup><mn>10</mn><mn>21</mn></msup></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf80f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-16T14:00:00.000Z", "isVisible": true, "shortName": "2021 (16 Mar Shift 2)", "title": "JEE Main 2021 (16 Mar Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66ea3", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf80e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-16T09:00:00.000Z", "isVisible": true, "shortName": "2021 (16 Mar Shift 1)", "title": "JEE Main 2021 (16 Mar Shift 1)"}], "type": "numerical", "level": 1, "question": {"text": "<p>A certain element crystallises in a bcc lattice of unit cell edge length 27 <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">o</mi></mover></math>. If the same element under the same conditions crystallises in the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>fcc</mi></math> lattice, the edge length of the unit cell in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">o</mi></mover></math> will be __________. (Round off to the Nearest Integer).</p><p>[Assume each lattice point has a single atom]</p><p>[Assume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt><mo>=</mo><mn>1</mn><mo>.</mo><mn>73</mn><mo>,</mo><mo>&#160;</mo><msqrt><mn>2</mn></msqrt><mo>=</mo><mn>1</mn><mo>.</mo><mn>41</mn></math>]</p>", "image": null}, "options": [], "correctValue": "33", "solution": {"text": "<p>For <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>BCC</mi><mo>&#160;</mo><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">a</mi><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">r</mi></math></p><p>so&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>=</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>4</mn></mfrac><mo>&#215;</mo><mn>27</mn></math></p><p>for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>FCC</mi><mo>&#160;&#160;</mo><mi mathvariant=\"normal\">a</mi><mo>=</mo><mn>2</mn><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">r</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#215;</mo><msqrt><mn>2</mn></msqrt><mo>&#215;</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>4</mn></mfrac><mo>&#215;</mo><mn>27</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><msqrt><mn>3</mn></msqrt><msqrt><mn>2</mn></msqrt></mfrac><mo>&#215;</mo><mn>27</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>33</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf80e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-16T09:00:00.000Z", "isVisible": true, "shortName": " C</mi></msub><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>8</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>8</mn></mfrac><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>6</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>=</mo><mo>&#160;</mo><mn>1</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>3</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>4</mn></math>&nbsp;&nbsp;</p><p>[Atoms are at the corners and at the face centers]</p><p>Here,&nbsp;Z=&nbsp;effective number of atoms in the unit cell.</p><p>Therefore,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">Z</mi><mi>SC</mi></msub><mo>&#8203;</mo><mo>:</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">Z</mi><mi>BCC</mi></msub><mo>&#8203;</mo><mo>:</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">Z</mi><mi>FCC</mi></msub><mo>&#8203;</mo><mo>=</mo><mn>1</mn><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mn>2</mn><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mn>4</mn></math></p><p>&nbsp;</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/355fb20b-1fd9-4fda-a088-cbe666e07245-image15.png\" /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/374cb6e0-20e0-4cf2-8131-dab7a3574466-image16.png\" /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/16c8d674-da79-4a5c-b202-6707fa0b21ca-image17.png\" /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>SC</mi><mo>:</mo><mi>BCC</mi><mo>:</mo><mi>FCC</mi><mo>=</mo><mn>1</mn><mo>:</mo><mn>2</mn><mo>:</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T14:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 2)", "title": "JEE Main 2019 (12 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d6681f", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 1)", "title": "JEE Main 2019 (12 Apr Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "An element has a face-centered cubic&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>fcc</mi></mfenced></math>&nbsp;structure with a cell edge of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi></math>. The distance between the centres of two nearest tetrahedral voids in the lattice is", "image": null}, "options": [{"id": "dvNfZ", "text": "<math><mfrac><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "LcNlT", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mi mathvariant=\"normal\">a</mi></math>", "isCorrect": false, "image": null}, {"id": "vYK4U", "text": "<math><mi mathvariant=\"normal\">a</mi></math>", "isCorrect": false, "image": null}, {"id": "Hbfv6", "text": "<math><msqrt><mn>2</mn><mi mathvariant=\"normal\">a</mi></msqrt></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>&nbsp;symmetrical cube<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/78e8318c-5f93-454f-8b38-f9c6d87eec7b-image25.png\" /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5b656f1c-b9b8-4ba7-a0ef-8f526219ebf8-image26.png\" /><br />Distance between two <math><mtext>TV</mtext><mo>=</mo><mtext>a</mtext><mo>-</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mtext>a</mtext></mrow><mrow><mtext>4</mtext></mrow></mfrac><mtext>+</mtext><mfrac><mrow><mtext>a</mtext></mrow><mrow><mtext>4</mtext></mrow></mfrac></mrow></mfenced></math><br /><math><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math><br />Correct option is <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">C</mi></mrow></mfenced></math> .", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-12T09:00:00.000Z", "isVisible": true, "shortName": "2019 (12 Apr Shift 1)", "title": "JEE Main 2019 (12 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d66454", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 2)", "title": "JEE Main 2019 (08 Apr Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Consider the bcc unit cells of the solids <math><mn>1</mn></math> and <math><mn>2</mn></math> with the position of atoms as shown below. The radius of atom <math><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">&#160;</mi></math> is twice that of atom <math><mi mathvariant=\"normal\">A</mi><mo>.</mo></math> The unit cell edge length is <math><mn>50</mn><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">%</mi></math> more in solid <math><mn>2</mn></math> than in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> . What is the approximate packing efficiency in solid <math><mn>2</mn></math> ?</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/35e09cc0-d31d-4f83-9e71-0c32fc6b936c-image.png\" style=\"width: 400px; height: 210px;\" /></p>", "image": null}, "options": [{"id": "S0vnK", "text": "<math><mn>90</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">%</mi></math>", "isCorrect": true, "image": null}, {"id": "JRYBP", "text": "<math><mn>45</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">%</mi></math>", "isCorrect": false, "image": null}, {"id": "wcnZI", "text": "<math><mn>75</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">%</mi></math>", "isCorrect": false, "image": null}, {"id": "Yx9PE", "text": "<math><mn>65</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">%</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d56858d2-34ef-457b-b322-d2b27b5e8080-image.png\" style=\"width: 300px; height: 217px;\" /></p><p>If radius of <math><mi mathvariant=\"normal\">A</mi></math> is <math><mi mathvariant=\"normal\">r</mi></math> radius of <math><mi mathvariant=\"normal\">B</mi></math> will be <math><mn>2</mn><mi mathvariant=\"normal\">r</mi></math> . Atoms in the body diagonal touch.</p><p>Therefore:<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">r</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">r</mi><mo>+</mo><mi mathvariant=\"normal\">r</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mtext>&#8201;</mtext><mi mathvariant=\"normal\">a</mi></math></p><p><math><mn>6</mn><mtext>&#8201;</mtext><mi mathvariant=\"normal\">r</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mtext>&#8201;</mtext><mi mathvariant=\"normal\">a</mi></math> or <math><mi mathvariant=\"normal\">a</mi><mo>=</mo><mfrac><mrow><mn>6</mn><mi mathvariant=\"normal\">r</mi></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math></p><p>Packing Efficiency<br /><math><mo>=</mo><mfrac><mrow><mn>1</mn><mo>&#215;</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi mathvariant=\"normal\">&#960;</mi><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>+</mo><mn>1</mn><mo>&#215;</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi mathvariant=\"normal\">&#960;</mi><msup><mrow><mo>(</mo><mn>2</mn><mi mathvariant=\"normal\">r</mi><mo>)</mo></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi mathvariant=\"normal\">&#960;</mi><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>&#215;</mo><mn>9</mn></mrow><mrow><msup><mrow><mo>(</mo><mn>6</mn><mi mathvariant=\"normal\">r</mi><mo>/</mo><msqrt><mn>3</mn></msqrt><mo>)</mo></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac></math><br /><math><mo>=</mo><mfrac><mrow><mn>4</mn><mo>&#215;</mo><mn>9</mn><mo>&#215;</mo><mi mathvariant=\"normal\">&#960;</mi><mo>&#215;</mo><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>&#215;</mo><mn>3</mn><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>3</mn><mo>&#215;</mo><mn>216</mn><mo>&#215;</mo><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>90.5</mn><mtext>&#8201;</mtext><mi mathvariant=\"normal\">%</mi></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T14:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 2)", "title": "JEE Main 2019 (08 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d663eb", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7f0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 1)", "title": "JEE Main 2019 (08 Apr Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Element <math><mi mathvariant=\"normal\">B</mi></math> forms ccp structure and <math><mi mathvariant=\"normal\">A</mi></math> occupies half of the octahedral voids, while oxygen atoms occupy all the tetrahedral voids. The structure of bimetallic oxide is:", "image": null}, "options": [{"id": "JmLyo", "text": "<math><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">B</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "isCorrect": false, "image": null}, {"id": "Cga9P", "text": "<math><mi mathvariant=\"normal\">A</mi><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "isCorrect": true, "image": null}, {"id": "Zno0v", "text": "<math><msub><mrow><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math>", "isCorrect": false, "image": null}, {"id": "9X2FX", "text": "<math><msub><mrow><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>4</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For ccp structure: <br/>Number of octahedral voids are <math><mo>=</mo><mn>4</mn></math>  <br/>Number of tetrahedral voids are <math><mo>=</mo><mn>8</mn></math>  <br/><math><msub><mrow><mi mathvariant=\"normal\">Z</mi></mrow><mrow><mi mathvariant=\"normal\">B</mi></mrow></msub><mo>=</mo><mn>4</mn></math> (number of atoms present in ccp structure) <br/><math><msub><mrow><mi mathvariant=\"normal\">Z</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>×</mo><mn>4</mn><mo>=</mo><mn>2</mn></math>  <br/><math><msub><mrow><mi mathvariant=\"normal\">Z</mi></mrow><mrow><mi mathvariant=\"normal\">O</mi></mrow></msub><mo>=</mo><mn>8</mn></math>  <br/>So formula is <math><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>4</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>8</mn></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">A</mi><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>.</mo></math>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2019 (08 Apr Shift 1)", "title": "JEE Main 2019 (08 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d667c1", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The radius of the largest sphere which fits properly at the centre of the edge of a body centred cubic unit cell is :\r\n\r\n(Edge length is represented by 'a')", "image": null}, "options": [{"id": "rAKx6", "text": "0.027 a", "isCorrect": false, "image": null}, {"id": "9mpLN", "text": "0.047 a", "isCorrect": false, "image": null}, {"id": "2yRHy", "text": "$0.134 \\mathrm{a}$", "isCorrect": false, "image": null}, {"id": "5VxbZ", "text": "0.067 a", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "For bcc\r\n\r\n$$\r\n\r\n\\Rightarrow \\mathrm{R}=\\frac{\\sqrt{3} \\mathrm{a}}{4}\r\n\r\n$$\r\n\r\n$$\r\n\r\n\\therefore \\text { Empty space at edge }=a-2 R=a-\\frac{\\sqrt{3} a}{2}\r\n\r\n$$\r\n\r\n$=$ diameter of sphere.\r\n\r\n$$\r\n\r\n\\therefore \\quad \\mathrm{r}_{\\text {sphere }}=\\frac{a-\\frac{\\sqrt{3}}{2} \\mathrm{a}}{2}=\\left(\\frac{2-\\sqrt{3}}{4}\\right) \\mathrm{a}=0.067 \\mathrm{a}\r\n\r\n$$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ed", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T14:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 2)", "title": "JEE Main 2019 (11 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d66767", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "A solid having density of $9 \\times 10^{3} \\mathrm{~kg} \\mathrm{~m}^{-3}$ forms face centred cubic crystals of edge length $200 \\sqrt{2} \\mathrm{pm} .$ What is the molar mass of the solid?\r\n\r\n[Avogadro constant $\\left.\\approx 6 \\times 10^{23} \\mathrm{~mol}^{-1}, \\pi \\approx 3\\right]$", "image": null}, "options": [{"id": "v0Mpu", "text": "$0.0432 \\mathrm{~kg} \\mathrm{~mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "hcqFW", "text": "$0.0216 \\mathrm{~kg} \\mathrm{~mol}^{-1}$", "isCorrect": false, "image": null}, {"id": "vyDov", "text": "$0.0305 \\mathrm{~kg} \\mathrm{~mol}^{-1}$", "isCorrect": true, "image": null}, {"id": "2U42O", "text": "$0.4320 \\mathrm{~kg} \\mathrm{~mol}^{-1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Density $=\\frac{Z \\times M}{N_{A} \\times a^{3}}$\r\n\r\n$9 \\times 10^{3}=\\frac{4 \\times \\mathrm{M}}{\\left(200 \\times \\sqrt{2} \\times 10^{-12}\\right)^{3} 6 \\times 10^{23}}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7ec", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-11T09:00:00.000Z", "isVisible": true, "shortName": "2019 (11 Jan Shift 1)", "title": "JEE Main 2019 (11 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d6670f", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7eb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 2)", "title": "JEE Main 2019 (10 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "A compound of formula <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">A</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">B</mi><mn>3</mn></msub></math> has the HCP&nbsp;lattice. Which atom forms the HCP&nbsp;lattice and what fraction of the&nbsp;tetrahedral voids are occupied by the other atoms?", "image": null}, "options": [{"id": "yTFSL", "text": "<p>HCP lattice - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac></math>tetrahedral voids - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math></p>", "isCorrect": false, "image": null}, {"id": "Se9gi", "text": "<p>HCP lattice - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math> tetrahedral voids - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;</p>", "isCorrect": false, "image": null}, {"id": "5V520", "text": "<p>HCP lattice - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac></math> tetrahedral voids - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math></p>", "isCorrect": true, "image": null}, {"id": "E6qEU", "text": "<p>HCP lattice - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>3</mn></mfrac></math>&nbsp;tetrahedral voids - <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math></p>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Atom <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> forms HCP&nbsp;as&nbsp;anions are larger in size.</p><p>From the formula&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">A</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">B</mi><mn>3</mn></msub></math>,</p><p>Number of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> atoms<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn></math>,</p><p>Then, number of tetrahedral voids&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#215;</mo></math>Tetrahedral voids<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>3</mn><mo>=</mo><mn>6</mn></math>.</p><p>As <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>'</mo><mi mathvariant=\"normal\">A</mi><mo>'</mo></math>&nbsp;is occupying tetrahedral voids,</p><p>&nbsp;<math> <mrow> <mfrac> <mn>1</mn> <mn>3</mn> </mfrac> </mrow> </math>&nbsp;of&nbsp;tetrahedral voids<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#215;</mo><mn>6</mn><mo>=</mo><mn>2</mn></math><br /><br />Therefore, formula of the compound<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msub><mi mathvariant=\"normal\">A</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">B</mi><mn>3</mn></msub></math></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7eb", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-10T14:00:00.000Z", "isVisible": true, "shortName": "2019 (10 Jan Shift 2)", "title": "JEE Main 2019 (10 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a66417cc3fb48d665a7", "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 2)", "title": "JEE Main 2019 (09 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "At <math><msup><mrow><mn>100</mn></mrow><mrow><mi>o</mi></mrow></msup><mi>C</mi><mo>,</mo><mi>&#160;</mi></math> copper <math><mfenced separators=\"|\"><mrow><mi>C</mi><mi>u</mi></mrow></mfenced></math> has <math><mi>F</mi><mi>C</mi><mi>C</mi></math> unit cell structure with cell edge length of <math><mi>x</mi><mi>&#160;</mi><mi>&#8491;</mi></math> . What is the approximate density of <math><mi>C</mi><mi>u</mi></math> (in <math><mi>g</mi><mi>&#160;</mi><mi>c</mi><msup><mrow><mi>m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math> ) at this temperature?<br /><br /><math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">&#160;</mi><mi>C</mi><mi>u</mi><mo>=</mo><mn>63.55</mn><mi>&#160;</mi><mi>u</mi></mrow></mfenced></math>", "image": null}, "options": [{"id": "GFn7E", "text": "<math><mfrac><mrow><mn>105</mn></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "gukG0", "text": "<math><mfrac><mrow><mn>205</mn></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "uJIbR", "text": "<math><mfrac><mrow><mn>422</mn></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "okFlC", "text": "<math><mfrac><mrow><mn>211</mn></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Crystal structure is <math><mi>F</mi><mi>C</mi><mi>C,</mi></math> so number of atoms per unit cell <math><mfenced separators=\"|\"><mrow><mi>N</mi></mrow></mfenced><mo>=</mo><mn>4</mn></math><br /><br />Edge length <math><mo>=</mo><mi>x</mi><mo>.</mo><msup><mrow><mi>&#8491;</mi></mrow><mrow></mrow></msup><mo>=</mo><mi>x</mi><mi>&#160;</mi><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>8 &#160;</mn></mrow></msup><mi>c</mi><msup><mrow><mi>m</mi></mrow><mrow><mn>3</mn></mrow></msup></math><br /><br />Density <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>ZM</mi><mrow><msub><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">A</mi></msub><msup><mi mathvariant=\"normal\">a</mi><mn>3</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mo>&#215;</mo><mn>63</mn><mo>.5</mo></mrow><mrow><mfenced separators=\"|\"><mrow><mn>6</mn><mo>.03</mo><mo>&#215;</mo><msup><mn>10</mn><mn>23</mn></msup></mrow></mfenced><msup><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">x</mi><mo>&#215;</mo><msup><mn>10</mn><mrow><mo>-</mo><mn>8</mn></mrow></msup></mrow></mfenced><mn>3</mn></msup></mrow></mfrac><mi>gm</mi><mo>/</mo><msup><mi>cm</mi><mn>3</mn></msup></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>4</mn><mo>&#215;</mo><mn>63.5</mn></mrow><mrow><mfenced separators=\"|\"><mrow><mn>6.0</mn></mrow></mfenced><mo>&#215;</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>&#215;</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>422</mn></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac><mrow><mrow><mi>g</mi><mi>m</mi></mrow><mo>/</mo><mrow><mi>c</mi><msup><mrow><mi>m</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mrow><mo>=</mo><mfrac><mrow><mn>422</mn></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac></math>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T14:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 2)", "title": "JEE Main 2019 (09 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d66127", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6489", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2017-04-02T09:00:00.000Z", "isVisible": true, "shortName": "2017 (02 Apr)", "title": "JEE Main 2017 (02 Apr)"}], "question": {"text": "A metal crystallizes in a face centred cubic structure. If the edge length of its unit cell is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>'</mo><mi mathvariant=\"normal\">a</mi><mo>'</mo></math>, the closest approach between two atoms in the metallic crystal will be", "image": null}, "options": [{"id": "PxQH4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">a</mi></math>", "image": null, "isCorrect": false}, {"id": "cXsPF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">a</mi></math>", "image": null, "isCorrect": false}, {"id": "tTtRB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">a</mi><msqrt><mn>2</mn></msqrt></mfrac></math>", "image": null, "isCorrect": true}, {"id": "srExO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">a</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>FCC</mi><mo>&#160;</mo></math>unit cell: eight corners with six faces</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>2</mn><mi mathvariant=\"normal\">r</mi><mo>&#160;</mo><mo>+</mo><mi mathvariant=\"normal\">r</mi><mo>&#160;</mo><mo>=</mo><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">a</mi><mspace linebreak=\"newline\"/><mn>4</mn><mi mathvariant=\"normal\">r</mi><mo>&#160;</mo><mo>=</mo><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">a</mi><mspace linebreak=\"newline\"/><mi>Closest</mi><mo>&#160;</mo><mi>distance</mi><mo>&#160;</mo><mi>in</mi><mo>&#160;</mo><mi>fcc</mi><mspace linebreak=\"newline\"/><mn>2</mn><mi mathvariant=\"normal\">r</mi><mo>&#160;</mo><mo>=</mo><mfrac><mrow><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">a</mi></mrow><mn>2</mn></mfrac><mspace linebreak=\"newline\"/><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mrow><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">a</mi></mrow><mrow><msqrt><mn>2</mn></msqrt><mo
