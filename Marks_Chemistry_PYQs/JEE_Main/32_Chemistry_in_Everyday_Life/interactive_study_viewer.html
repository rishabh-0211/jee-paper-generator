lse}], "correctValue": null, "solution": {"text": "<p>The reaction used for preparation of soap from fat is not alkaline hydrolysis, but rather saponification. In saponification, a triglyceride (fat or oil) is reacted with a strong base, such as sodium hydroxide (or potassium hydroxide, in the presence of heat to produce soap molecules and glycerol as a byproduct. The reaction involves the hydrolysis of the ester bond in the triglyceride by the base to form carboxylate ions (the soap molecules) and glycerol.<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/344eabbd-ae3a-4ab3-bac0-779d90d07511.png\" style=\"width: 500px; height: 259px;\" /></p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6491", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 Apr Shift 2)", "title": "JEE Main 2023 (10 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d680d7", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>A. Ammonium salts produce haze in atmosphere.</p><p>B. Ozone gets produced when atmospheric oxygen reacts with chlorine radicals.</p><p>C. Polychlorinated biphenyls act as cleansing solvents.</p><p>D. &lsquo;Blue baby&rsquo; syndrome occurs due to the presence of excess of sulphate ions in water.</p><p>Choose the correct answer from the options given below:-</p>", "image": null}, "options": [{"id": "tCqu6", "text": "A, B and C only", "isCorrect": false, "image": null}, {"id": "eF9tI", "text": "B and C only", "isCorrect": false, "image": null}, {"id": "3PQa6", "text": "A and D only", "isCorrect": false, "image": null}, {"id": "dYlnS", "text": "A and C only", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>A. Ammonium salts produce atmospheric haze (aerosol of fine particles).</p><p>B. Ozone is produced by 3 atoms of oxygen. Some of the molecules in the atmosphere break due to sunlight and oxygen atoms are released. The oxygen atoms then react with other oxygen molecules to form ozone. The overall reaction is&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#160;</mo><mover><mo>&#8594;</mo><mi>UV</mi></mover><mo>&#160;</mo><mi mathvariant=\"normal\">O</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mi mathvariant=\"normal\">O</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">O</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">O</mi><mn>2</mn></msub><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math></p><p>C. Polychlorinated biphenyls&nbsp;have the&nbsp;number of applications including their use as cleansing solvents.&nbsp;</p><p>D. &#39;Blue baby&#39;&nbsp;syndrome occurs due to the presence of excess&nbsp;nitrate ions and not sulphate ions in water.</p><p>From the above statement we concluded that Statement A and C are correct.</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MULTI_STATEMENT"], "previousYear": {"_id": "63f499841d196b49d9cd6b0c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T14:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 2)", "title": "JEE Main 2023 (25 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67b40", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 2)", "title": "JEE Main 2022 (27 Jul Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which of the following enhances the lathering property of soap?", "image": null}, "options": [{"id": "XnXgA", "text": "Sodium stearate", "isCorrect": false, "image": null}, {"id": "UhRYq", "text": "Sodium carbonate", "isCorrect": false, "image": null}, {"id": "CaD4Y", "text": "Sodium rosinate", "isCorrect": true, "image": null}, {"id": "tT7t8", "text": "Trisodium phosphate", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Shaving soaps contain glycerol to prevent rapid drying. A gum called, rosin is added while making them. It forms sodium rosinate which lathers well. Laundry soaps contain fillers like sodium rosinate, sodium silicate, borax and sodium carbonate.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b33248370a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 2)", "title": "JEE Main 2022 (27 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d6797e", "previousYearPapers": [{"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 1)", "title": "JEE Main 2022 (26 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Stearic acid and polyethylene glycol react to form which one of the following soap/s detergents?", "image": null}, "options": [{"id": "iM0wb", "text": "Cationic detergent", "isCorrect": false, "image": null}, {"id": "cfNVz", "text": "Soap", "isCorrect": false, "image": null}, {"id": "nRxHS", "text": "Anionic detergent", "isCorrect": false, "image": null}, {"id": "DfFTR", "text": "Non-ionic detergent", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>&nbsp;Non-ionic detergents do not contain any ion in their constitution. One such detergent is formed when stearic acid reacts with polyethylene glycol.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mrow><msub><mi>CH</mi><mn>3</mn></msub><msub><mfenced><msub><mi>CH</mi><mn>2</mn></msub></mfenced><mn>16</mn></msub><mi>COOH</mi></mrow><mrow><mi>Stearic</mi><mo>&#160;</mo><mi>acid</mi></mrow></munder><mo>+</mo><munder><mrow><mi>HO</mi><msub><mfenced><mrow><msub><mi>CH</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></mfenced><mi mathvariant=\"normal\">n</mi></msub><msub><mi>CH</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi>OH</mi></mrow><mi>Polyethyleneglycol</mi></munder><mo>&#160;</mo><mover><mo>&#8594;</mo><mrow><mo>-</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></mover><msub><mi>CH</mi><mn>3</mn></msub><msub><mfenced><msub><mi>CH</mi><mn>2</mn></msub></mfenced><mn>16</mn></msub><mi>COO</mi><msub><mfenced><mrow><msub><mi>CH</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></mfenced><mi mathvariant=\"normal\">n</mi></msub><msub><mi>CH</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi>OH</mi></math></p><p>&nbsp;A&nbsp;type of detergent in which the active part of the molecule is a positive ion (cation). Cationic detergents are usually quaternary ammonium salts.</p><p>Anionic detergent is a synthetic detergent in which a lipophilic hydrocarbon group of the molecule is an anion. A detergent molecule consists of a long hydrocarbon chain and a water-soluble negative ionic group.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "f11c98bc9d2248d48b7aa84d5f3c5a81", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/BLItb4BA3Do4V.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/BLItb4BA3Do4V.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483704", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 1)", "title": "JEE Main 2022 (26 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67b9c", "previousYearPapers": [{"_id": "62c481f101514d218a7934d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 1)", "title": "JEE Main 2022 (27 Jun Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Match List - I with List - II.</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\"><strong>List-I</strong></td>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\"><strong>List-II</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td>A</td>\t\t\t<td><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f5cca91a-5e09-4c04-acca-7af7b47cf026-image.png\" style=\"width: 205px; height: 102px;\" /></td>\t\t\t<td>I</td>\t\t\t<td>Dishwashing powder</td>\t\t</tr>\t\t<tr>\t\t\t<td>B</td>\t\t\t<td><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5e740000-c816-4b4a-ad0f-134ca9eb1ecf-image.png\" style=\"width: 280px; height: 72px;\" /></td>\t\t\t<td>II</td>\t\t\t<td>Toothpaste</td>\t\t</tr>\t\t<tr>\t\t\t<td>C</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>17</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>35</mn></msub><msup><mi>COO</mi><mo>-</mo></msup><msup><mi>Na</mi><mo>+</mo></msup><mo>+</mo><msub><mi>Na</mi><mn>2</mn></msub><msub><mi>CO</mi><mn>3</mn></msub><mo>+</mo></math> Rosinate</td>\t\t\t<td>III</td>\t\t\t<td>Laundry soap</td>\t\t</tr>\t\t<tr>\t\t\t<td>D</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><msub><mfenced><msub><mi>CH</mi><mn>2</mn></msub></mfenced><mn>16</mn></msub><mi>COO</mi><msub><mfenced><mrow><msub><mi>CH</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></mfenced><mi mathvariant=\"normal\">n</mi></msub><msub><mi>CH</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi>OH</mi></math></td>\t\t\t<td>IV</td>\t\t\t<td>Hair conditioner</td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "Q10zj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">A</mi></mfenced><mo>-</mo><mfenced><mi>IV</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">B</mi></mfenced><mo>-</mo><mfenced><mi>II</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">C</mi></mfenced><mo>-</mo><mfenced><mi>III</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">D</mi></mfenced><mo>-</mo><mfenced><mi mathvariant=\"normal\">I</mi></mfenced></math>", "isCorrect": true, "image": null}, {"id": "yVZSK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">A</mi></mfenced><mo>-</mo><mfenced><mi>III</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">B</mi></mfenced><mo>-</mo><mfenced><mi>II</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">C</mi></mfenced><mo>-</mo><mfenced><mi>IV</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">D</mi></mfenced><mo>-</mo><mfenced><mi mathvariant=\"normal\">I</mi></mfenced></math>", "isCorrect": false, "image": null}, {"id": "5gIiF", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">A</mi></mfenced><mo>-</mo><mfenced><mi>IV</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">B</mi></mfenced><mo>-</mo><mfenced><mi>III</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">C</mi></mfenced><mo>-</mo><mfenced><mi>II</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">D</mi></mfenced><mo>-</mo><mfenced><mi mathvariant=\"normal\">I</mi></mfenced></math>", "isCorrect": false, "image": null}, {"id": "GLIJY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">A</mi></mfenced><mo>-</mo><mfenced><mi>II</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">B</mi></mfenced><mo>-</mo><mfenced><mi>IV</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">C</mi></mfenced><mo>-</mo><mfenced><mi mathvariant=\"normal\">I</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">D</mi></mfenced><mo>-</mo><mfenced><mi>II</mi></mfenced></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>1. Laundry soaps contain fillers like sodium rosinate, sodium silicate, borax and sodium carbonate.</p><p>2. Cationic detergents are quaternary ammonium salts of amines with acetates, chlorides or bromides as anions. Cationic part possess a long hydrocarbon chain and a positive charge on nitrogen atom. Hence, these are called cationic detergents. Cetyltrimethylammonium bromide is a popular cationic detergent and is used in hair conditioners.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f5cca91a-5e09-4c04-acca-7af7b47cf026-image.png\" style=\"width: 250px; height: 124px;\" /></p><p>3. Non-ionic Detergents: Non-ionic detergents do not contain any ion in their constitution. One such detergent is formed when stearic acid reacts with polyethyleneglycol. Liquid dishwashing detergents are non-ionic type.</p><p>4. In anionic detergents, the anionic part of the molecule is involved in the cleansing action. Sodium salts of alkylbenzenesulphonates are an important class of anionic detergents. They are mostly used for household work.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "62c481f101514d218a7934d7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 1)", "title": "JEE Main 2022 (27 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67a8d", "previousYearPapers": [{"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which of the following is NOT an example of synthetic detergent?", "image": null}, "options": [{"id": "Qzbfe", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2ca91a00-a3fa-484f-ac08-4135a8c03623-image.png\" style=\"width: 300px; height: 80px;\" />", "isCorrect": false, "image": null}, {"id": "yW2yG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><msub><mfenced><msub><mi>CH</mi><mn>2</mn></msub></mfenced><mn>16</mn></msub><mo>-</mo><msup><mi>COO</mi><mo>-</mo></msup><msup><mi>Na</mi><mo>+</mo></msup></math>", "isCorrect": true, "image": null}, {"id": "0lMIi", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/82a13fc6-ed6e-469d-8f0c-f943d511bab8-11-7-20226.png\" style=\"width: 280px; height: 106px;\" />", "isCorrect": false, "image": null}, {"id": "1h9Br", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><msub><mfenced><msub><mi>CH</mi><mn>2</mn></msub></mfenced><mn>16</mn></msub><mi>COO</mi><msub><mfenced><mrow><msub><mi>CH</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></mfenced><mi mathvariant=\"normal\">n</mi></msub><msub><mi>CH</mi><mn>2</mn></msub><msub><mi>CH</mi><mn>2</mn></msub><mi>OH</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Sulphonates and quaternary ammonium salt of long chain fatty acids are used as synthetic detergents.</p><p>option&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>2</mn></mfenced></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mo>-</mo><msub><mfenced><msub><mi>CH</mi><mn>2</mn></msub></mfenced><mn>16</mn></msub><mo>-</mo><msup><mi>COO</mi><mo>-</mo></msup><msup><mi>Na</mi><mo>+</mo></msup></math>&nbsp;is just a hydrocarbon chain which is insoluble in water.Hence, it is not a synthetic detergent.</p>", "image": null}, "videoSolution": {"videoId": "f64a49b344874e2d880b59c92428c904", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/iXeLIII2Thzjl.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/iXeLIII2Thzjl.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d678cb", "previousYearPapers": [{"_id": "62c481f001514d218a7934d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 1)", "title": "JEE Main 2022 (25 Jun Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Using very little soap while washing clothes, does not serve the purpose of cleaning of clothes, because", "image": null}, "options": [{"id": "oy64H", "text": "soap particles remain floating in water as ions.", "isCorrect": false, "image": null}, {"id": "3aPLx", "text": "colloidal structure of soap in water is completely disturbed.", "isCorrect": false, "image": null}, {"id": "x6gF5", "text": "the hydrophobic part of soap is not able to take away grease.", "isCorrect": false, "image": null}, {"id": "nbioe", "text": "the micelles are not formed due to concentration of soap, below its <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>CMC</mi></math> value.", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Micelle or associate colloid formation occurs above a certain concentration&nbsp;known as CMC. So, if the concentration of soap is less that means it hasn&#39;t reached the CMC&nbsp;value. That is why it does not serve the purpose of cleaning of clothes.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d3", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 1)", "title": "JEE Main 2022 (25 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d6731c", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf817", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Jul Shift 1)", "title": "JEE Main 2021 (25 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Sodium stearate <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><msub><mfenced><msub><mi>CH</mi><mn>2</mn></msub></mfenced><mn>16</mn></msub><msup><mi>COO</mi><mo>-</mo></msup><msup><mi>Na</mi><mo>+</mo></msup></math> is an anionic surfactant which forms micelles in oil. Choose the correct statement for it from the following :", "image": null}, "options": [{"id": "NoZQs", "text": "It forms spherical micelles with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><msub><mfenced><msub><mi>CH</mi><mn>2</mn></msub></mfenced><mn>16</mn></msub><mo>-</mo></math> group pointing towards the centre of sphere.", "isCorrect": true, "image": null}, {"id": "hnh9x", "text": "It forms non-spherical micelles with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><msup><mi>COO</mi><mo>-</mo></msup></math> group pointing outwards on the surface.", "isCorrect": false, "image": null}, {"id": "KI74v", "text": "It forms spherical micelles with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><msub><mfenced><msub><mi>CH</mi><mn>2</mn></msub></mfenced><mn>16</mn></msub><mo>-</mo></math> group pointing outwards on the surface of sphere", "isCorrect": false, "image": null}, {"id": "Wk1vd", "text": "It forms non-spherical micelles with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><msub><mfenced><msub><mi>CH</mi><mn>2</mn></msub></mfenced><mn>16</mn></msub></math> -group pointing towards the centre.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Forms spherical micelles with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><msub><mfenced><msub><mi>CH</mi><mn>2</mn></msub></mfenced><mn>16</mn></msub></math> group pointing towards the centre of sphere", "image": null}, "videoSolution": {"videoId": "dacff887207c482d98a356f4ac1b2e33", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/WroZX0VnrEhYB.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/WroZX0VnrEhYB.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf817", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2021 (25 Jul Shift 1)", "title": "JEE Main 2021 (25 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66a5a", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf801", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-03T14:00:00.000Z", "isVisible": true, "shortName": "2020 (03 Sep Shift 2)", "title": "JEE Main 2020 (03 Sep Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "An ionic micelle is formed on the addition of:", "image": null}, "options": [{"id": "ruzfw", "text": "liquid diethyl ether to aqueous <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>N</mi><mi>a</mi><mi>C</mi><mi>l</mi></math> solution", "isCorrect": false, "image": null}, {"id": "j1HAT", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3d6c80df-dd3c-4ac4-8274-e8bbf307fd91-image.png\" style=\"width: 159px; height: 102px;\" />", "isCorrect": false, "image": null}, {"id": "m3fg2", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b76b1c15-d8fe-4854-b229-b3d0c7a34128-image.png\" style=\"width: 284px; height: 99px;\" />", "isCorrect": true, "image": null}, {"id": "Y2BvZ", "text": "Sodium stearate to pure toluene", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d28a3665-2d44-4567-b37b-b12730c4ff5a-image.png\" style=\"width: 284px; height: 99px;\" /></p><p>Due to&nbsp; presence of hydrophobic cabin it forms micelle.</p><p>&nbsp;</p>", "image": null}, "videoSolution": {"videoId": "2ba0e997ec3645c486ca78e332065c79", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/jo7O4Q4MXI1X3.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/jo7O4Q4MXI1X3.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf801", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-03T14:00:00.000Z", "isVisible": true, "shortName": "2020 (03 Sep Shift 2)", "title": "JEE Main 2020 (03 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a67417cc3fb48d669c3", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf7ff", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-02T14:00:00.000Z", "isVisible": true, "shortName": "2020 (02 Sep Shift 2)", "title": "JEE Main 2020 (02 Sep Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "If you spill a chemical toilet cleaning liquid on your hand, your first aid would be:", "image": null}, "options": [{"id": "4YFm2", "text": "vinegar", "isCorrect": false, "image": null}, {"id": "CcNtN", "text": "aqueous NaOH", "isCorrect": false, "image": null}, {"id": "n0KPa", "text": "aqueous <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NaHCO</mi><mn>3</mn></msub></math>", "isCorrect": true, "image": null}, {"id": "ntRoT", "text": "aqueous <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NH</mi><mn>3</mn></msub></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>In toilet cleaning liquid the main constituent is<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HCl</mi><mo>,</mo></math> which can cause skin burn so it should be treated with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NaHCO</mi><mn>3</mn></msub></math> which can easily consume the acid.</p><p>If a few drops of a concentrated acid accidentally spill over the hand of a student, wash the hand immediately with plenty of water and apply a paste of sodium hydrogen carbonate.<br />Water will dilute the acid and wash it out. Any remaining acid will be neutralized with sodium hydrogen carbonate. This will minimize the effect of acid and damage to the skin.</p><p>Other given substances are not good for skin.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7ff", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-02T14:00:00.000Z", "isVisible": true, "shortName": "2020 (02 Sep Shift 2)", "title": "JEE Main 2020 (02 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d66009", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6488", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2016 (03 Apr)", "title": "JEE Main 2016 (03 Apr)"}], "question": {"text": "Which of the following is an anionic detergent?", "image": null}, "options": [{"id": "c9UjK", "text": "Cetyltrimethyl ammonium bromide", "image": null, "isCorrect": false}, {"id": "qQilo", "text": "Glyceryl oleate", "image": null, "isCorrect": false}, {"id": "YjoMf", "text": "hexadecyltrimethyl ammonium bromide", "image": null, "isCorrect": false}, {"id": "tJgdp", "text": "Sodium lauryl sulphate", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Organic compound with the formula <math> <mrow> <mi>C</mi><msub> <mi>H</mi> <mn>3</mn> </msub> <msub> <mrow> <mrow><mo>(</mo> <mrow> <mi>C</mi><msub> <mi>H</mi> <mn>2</mn> </msub> </mrow> <mo>)</mo></mrow> </mrow> <mrow> <mn>11</mn> </mrow> </msub> <mi>S</mi><msubsup> <mi>O</mi> <mn>4</mn> <mo>&#8722;</mo> </msubsup> <mi>N</mi><msup> <mi>a</mi> <mo>+</mo> </msup> </mrow> </math> . It is an anionic Detergent.<br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6488", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-03T09:00:00.000Z", "isVisible": true, "shortName": "2016 (03 Apr)", "title": "JEE Main 2016 (03 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "648b5a73417cc3fb48d692b1", "title": "Enzymes and Receptors", "totalQuestions": 18, "questions": [{"_id": "648b5a6f417cc3fb48d6807f", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>The variation of the rate of an enzyme catalyzed reaction with substrate concentration is correctly represented by graph</p><p>(a)<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b6e53a6f-e4e8-4c67-ad6c-759878032075-9894256_A.png\" style=\"width: 350px; height: 235px;\" />&nbsp;</p><p>(b)<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/7ebbfb48-46df-41eb-8271-a7b0d24190fb-9894256_B.png\" style=\"width: 350px; height: 235px;\" />&nbsp;</p><p>(c)<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a8e425bb-4880-42cb-aac5-350134d6d764-9894256_C.png\" style=\"width: 350px; height: 233px;\" />&nbsp;</p><p>(d)<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/d333bce6-4c93-49c5-8410-f543f9072a1d-9894256_D.png\" style=\"width: 350px; height: 233px;\" />&nbsp;</p>", "image": null}, "options": [{"id": "X01h9", "text": "b&nbsp;", "isCorrect": false, "image": null}, {"id": "V7mOW", "text": "c", "isCorrect": true, "image": null}, {"id": "lOcoy", "text": "d&nbsp;", "isCorrect": false, "image": null}, {"id": "3nAGg", "text": "a&nbsp;", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The substrate concentration influences enzyme activity. As the substrate concentration increases the rate of reaction also increases. This is because the more substrate molecules will interact with enzyme molecules, the more products will be formed.</p><p>However, after a certain concentration, further increase in substrate concentration&nbsp;will have no effect on the rate of reaction, since the substrate concentration will no longer be the limiting factor. At this stage, enzyme molecules become saturated and work at their maximum possible rate.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/bf9ab9bd-b3be-4417-92d0-a808fc4f8bd5-image.png\" style=\"width: 325px; height: 213px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["GRAPH_BASED"], "previousYear": {"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67ca7", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Two statements in respect of drug-enzyme interaction are given below</p><p>Statement I : Action of an enzyme can be blocked only when an inhibitor blocks the active site of the enzyme.</p><p>Statement II : An inhibitor can form a strong covalent bond with the enzyme.</p><p>In the light of the above statements. Choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "7fITY", "text": "Both Statement I and Statement II are true", "isCorrect": false, "image": null}, {"id": "gJqim", "text": "Both Statement I and Statement II are false", "isCorrect": false, "image": null}, {"id": "yVrQ5", "text": "Statement I is true but Statement II is false", "isCorrect": false, "image": null}, {"id": "9xeyr", "text": "Statement I is false but Statement II is true", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>The first function of an enzyme is to hold the substrate for a chemical reaction. Active sites of enzymes hold the substrate molecule in a suitable position, so that it can be attacked by the reagent effectively.</p><p>Substrates bind to the active site of the enzyme through a variety of interactions such as ionic bonding, hydrogen bonding, van der Waals interaction or dipole-dipole interaction.</p><p>Drugs inhibit activities of enzymes. These can block the binding site of the enzyme and prevent the binding of substrate, or can inhibit the catalytic activity of the enzyme. Such drugs are called enzyme inhibitors</p><p>Some drugs do not bind to active sites. These bind to different site of enzyme called allosteric sites.</p><p>This binding of inhibitor at allosteric site&nbsp;changes the shape of the active site in such a way that substrate cannot recognise it</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/5c214676-42ed-4bf7-accf-6faff0733ef7-16-08-2022new.png\" style=\"width: 458px; height: 373px;\" /></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "63134c746e7bc9b33248370b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 2)", "title": "JEE Main 2022 (28 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67c4f", "previousYearPapers": [{"_id": "63134c746e7bc9b332483706", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 1)", "title": "JEE Main 2022 (28 Jul Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Statements about Enzyme Inhibitor Drugs are given below :</p><p>(A) There are Competitive and Non-competitive inhibitor drugs.</p><p>(B) These can bind at the active sites and allosteric sites.</p><p>(C) Competitive Drugs are allosteric site blocking drugs.</p><p>(D) Non-competitive Drugs are active site blocking drugs.</p><p>Choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "bWwRa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">A</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">D</mi></mfenced></math>&nbsp;only", "isCorrect": false, "image": null}, {"id": "iWCmA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">A</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">C</mi></mfenced></math>&nbsp;only", "isCorrect": false, "image": null}, {"id": "31apa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">A</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">B</mi></mfenced></math>&nbsp;only", "isCorrect": true, "image": null}, {"id": "t0Ey8", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">A</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">B</mi></mfenced><mo>,</mo><mfenced><mi mathvariant=\"normal\">C</mi></mfenced></math>&nbsp;only", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Enzyme inhibitors are molecules that interact with enzymes (temporary or permanent) in some way and reduce the rate of an enzyme-catalyzed reaction or prevent enzymes to work in a normal manner. Enzyme inhibitors can be competitive inhibitors (inhibit the attachment of substrate on active site of enzyme) and non-competitive inhibitor (changes the active site of enzyme after binding at allosteric site.) So, statement A and B are correct. But statement C and D are incorrect.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "b32acb873e914f9c870014fbeec7cdbb", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/cvwJd2tLJnKWQ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/cvwJd2tLJnKWQ.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MULTI_STATEMENT"], "previousYear": {"_id": "63134c746e7bc9b332483706", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-28T09:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jul Shift 1)", "title": "JEE Main 2022 (28 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67817", "previousYearPapers": [{"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p style=\"margin-bottom:.0001pt; margin:0in 0in 8pt\">Drugs used to bind to receptors, inhibiting its natural function and blocking a message are called</p>", "image": null}, "options": [{"id": "TrGoT", "text": "antagonists.", "isCorrect": true, "image": null}, {"id": "ORGsm", "text": "agonists.", "isCorrect": false, "image": null}, {"id": "5lrLk", "text": "allosteric.", "isCorrect": false, "image": null}, {"id": "AXqmU", "text": "lead compounds.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Drugs that bind to receptor site and inhibit the natural functions are known as antagonists. Agonist are type of drugs that activate the natural messenger by switching on the receptor, useful when lack of chemical messenger. If the drug binds to a site other than active site in an enzyme, it is known as allosteric site.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483703", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T09:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 1)", "title": "JEE Main 2022 (25 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67a7c", "previousYearPapers": [{"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Match List I with List II.</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td style=\"text-align: center;\"><strong>List-I<br />\t\t\tEnzyme</strong></td>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\"><strong>List-II<br />\t\t\tConversion of</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td>A.</td>\t\t\t<td>Invertase</td>\t\t\t<td>I.</td>\t\t\t<td>Starch into maltose</td>\t\t</tr>\t\t<tr>\t\t\t<td>B.</td>\t\t\t<td>Zymase</td>\t\t\t<td>II.</td>\t\t\t<td>Maltose into glucose</td>\t\t</tr>\t\t<tr>\t\t\t<td>C.</td>\t\t\t<td>Diastase</td>\t\t\t<td>III.</td>\t\t\t<td>Glucose into ethanol</td>\t\t</tr>\t\t<tr>\t\t\t<td>D.</td>\t\t\t<td>Maltase</td>\t\t\t<td>IV.</td>\t\t\t<td>Cane sugar into glucose</td>\t\t</tr>\t</tbody></table><p>Choose the most appropriate answer from the options given below</p>", "image": null}, "options": [{"id": "OvCl3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi></math>", "isCorrect": false, "image": null}, {"id": "5ubUW", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>IV</mi></math>", "isCorrect": false, "image": null}, {"id": "l3aa7", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>II</mi></math>", "isCorrect": true, "image": null}, {"id": "HpBbT", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Invertase helps in the conversion of sucrose to glucose and fructose.</p><p>Zymase&nbsp;catalyses the conversion of glucose or fructose to ethyl alcohol.</p><p>Diastase is a starch hydrolysing enzyme that&nbsp;breaks down the complex carbohydrate (polysaccharides, i.e. starch) into simple carbohydrates (monosaccharides, i.e. simple sugar like glucose).</p><p>Maltase catalyses the conversion of maltose to glucose.</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "62c481f101514d218a7934d6", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 2)", "title": "JEE Main 2022 (26 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67a33", "previousYearPapers": [{"_id": "62c481f001514d218a7934d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 1)", "title": "JEE Main 2022 (26 Jun Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A chemical which stimulates the secretion of pepsin is", "image": null}, "options": [{"id": "c7neo", "text": "Histamine", "isCorrect": true, "image": null}, {"id": "rx3fp", "text": "Cimetidine", "isCorrect": false, "image": null}, {"id": "3N6hZ", "text": "Zantac", "isCorrect": false, "image": null}, {"id": "u2c4p", "text": "Anti histamine", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Histamine stimulates the secretion of pepsin and hydrochloric acid and antihistamines are used to prevent the action of histamines.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d5", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-26T09:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jun Shift 1)", "title": "JEE Main 2022 (26 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67917", "previousYearPapers": [{"_id": "62c481f001514d218a7934d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 2)", "title": "JEE Main 2022 (25 Jun Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Match the following correctly&nbsp;</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>(i)&nbsp;Zymase&nbsp;</td>\t\t\t<td>(a) Stomach&nbsp;</td>\t\t</tr>\t\t<tr>\t\t\t<td>(ii) Urease&nbsp;</td>\t\t\t<td>(b)&nbsp;Yeast&nbsp;</td>\t\t</tr>\t\t<tr>\t\t\t<td>(iii)&nbsp;Diastase&nbsp;</td>\t\t\t<td>(c) Malt&nbsp;</td>\t\t</tr>\t\t<tr>\t\t\t<td>(iv)&nbsp;Pepsin&nbsp;</td>\t\t\t<td>(d)Soyabean&nbsp;</td>\t\t</tr>\t</tbody></table><p>&nbsp;</p>", "image": null}, "options": [{"id": "TXXdl", "text": "&nbsp;(i)-B; (ii) D(iii)-C; (iv)-A&nbsp;", "isCorrect": true, "image": null}, {"id": "bGsJC", "text": "(i)-B; (ii)-A; (iii)-C; (iv)-D&nbsp;", "isCorrect": false, "image": null}, {"id": "BixUZ", "text": "(i)-A; (ii)-B; (iii)-C; (iv)-D&nbsp;", "isCorrect": false, "image": null}, {"id": "Y1LD5", "text": "(i)-D; (ii)-C; (iii)-B; (iv)-A&nbsp;", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>The enzymes and sources are:&nbsp;</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Zymase</mi><mo>&#8594;</mo><mi>Yeast</mi></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Urease</mi><mo>&#8594;</mo><mi>Soyabean</mi></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Diastase</mi><mo>&#8594;</mo><mi>Malt</mi></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Pepsin</mi><mo>&#8594;</mo><mi>Stomach</mi></math></td>\t\t</tr>\t</tbody></table><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["TABLE_BASED"], "previousYear": {"_id": "62c481f001514d218a7934d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 2)", "title": "JEE Main 2022 (25 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6a417cc3fb48d67107", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf815", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Jul Shift 2)", "title": "JEE Main 2021 (20 Jul Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which one of the following statements is not true about enzymes?", "image": null}, "options": [{"id": "YxEM7", "text": "Enzymes are non-specific for a reaction and substrate.", "isCorrect": true, "image": null}, {"id": "YRNR9", "text": "Almost all enzymes are proteins.", "isCorrect": false, "image": null}, {"id": "fGtAX", "text": "Enzymes work as catalysts by lowering the activation energy of a biochemical reaction.", "isCorrect": false, "image": null}, {"id": "JIh4h", "text": "The action of enzymes is temperature and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>pH</mi></math> specific", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Enzymes are very specific in nature.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf815", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-07-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Jul Shift 2)", "title": "JEE Main 2021 (20 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a69417cc3fb48d66f3b", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf810", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-17T09:00:00.000Z", "isVisible": true, "shortName": "2021 (17 Mar Shift 1)", "title": "JEE Main 2021 (17 Mar Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "With respect to drug-enzyme interaction, identify the wrong statement:", "image": null}, "options": [{"id": "JdNlz", "text": "Non-Competitive inhibitor binds to the allosteric site", "isCorrect": false, "image": null}, {"id": "5UHHa", "text": "Allosteric inhibitor changes the enzyme&#39;s active site", "isCorrect": false, "image": null}, {"id": "9s5sY", "text": "Allosteric inhibitor competes with the enzyme&#39;s active site", "isCorrect": true, "image": null}, {"id": "Quscb", "text": "Competitive inhibitor binds to the enzyme&#39;s active site", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Some drugs do not bind to the Enzyme&#39;s active site. These bind to a different site of enzyme which called allosteric site.</p><p>This binding of inhibitor at allosteric site changes the shape of the active site in such a way that substrate can not recognize it. Such inhibitor is known as Non-competitive inhibitor.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/9ce7c800-1855-4c76-97e3-e5df5cbe3fe0-image.png\" style=\"width: 402px; height: 167px;\" /></p>", "image": null}, "videoSolution": {"videoId": "84a06feafda542cd97ce32cddaff5e7e", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/YLDLF80oAbD1i.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/YLDLF80oAbD1i.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92edde3d91842a5cf810", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-03-17T09:00:00.000Z", "isVisible": true, "shortName": "2021 (17 Mar Shift 1)", "title": "JEE Main 2021 (17 Mar Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66b97", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf805", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-05T14:00:00.000Z", "isVisible": true, "shortName": "2020 (05 Sep Shift 2)", "title": "JEE Main 2020 (05 Sep Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>The following molecule acts as an :</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/b7374066-ee15-4b99-914f-ae61227ad109-image.png\" style=\"width: 380px; height: 261px;\" /></p>", "image": null}, "options": [{"id": "0nomt", "text": "Antiseptic", "isCorrect": false, "image": null}, {"id": "fKhjb", "text": "Anti&ndash;depressant", "isCorrect": false, "image": null}, {"id": "etSUi", "text": "Anti&ndash;bacterial", "isCorrect": false, "image": null}, {"id": "9sCRP", "text": "Anti&ndash;histamine", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Synthetic drugs, brompheniramine (Dimetapp) act as antihistamines.</p><p>Antihistamines are drugs which treat hay fever and other allergies. Typically, people take antihistamines as an inexpensive, not patented, drug that can be bought without a prescription and relieves from nasal congestion, sneezing, or hives caused by pollen, dust mites, or animal allergy with few side effects.</p><p>We know that drugs help us diagnose and cure numerous illnesses. But any drug consumed by humans can actually have two kinds of effects - therapeutic effects and side effects. The goal is to prescribe the ideal drug, the one that only has a therapeutic effect.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf805", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-05T14:00:00.000Z", "isVisible": true, "shortName": "2020 (05 Sep Shift 2)", "title": "JEE Main 2020 (05 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a68417cc3fb48d66afd", "previousYearPapers": [{"_id": "615d92ecde3d91842a5cf803", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-04T14:00:00.000Z", "isVisible": true, "shortName": "2020 (04 Sep Shift 2)", "title": "JEE Main 2020 (04 Sep Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The mechanism of action of &quot;Terfenadine&quot; (Seldane) is :", "image": null}, "options": [{"id": "x1ad7", "text": "Activates the histamine receptor", "isCorrect": false, "image": null}, {"id": "dHO96", "text": "Inhibits the secretion of histamine", "isCorrect": false, "image": null}, {"id": "nGeRn", "text": "Helps in the secretion of histamine", "isCorrect": false, "image": null}, {"id": "YKwLl", "text": "Inhibits the action of histamine receptor", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Seldane act as antihistamines and interfere with the natural action of histamine by competing with histamine for binding sites of receptor.&nbsp;", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf803", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-09-04T14:00:00.000Z", "isVisible": true, "sh pecific biological catalysts that can not be poisoned\n", "image": null, "isCorrect": false}, {"id": "KdH0i", "text": "\nEnzymes are normally heterogeneous catalysts that are very specific in their action", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No Solution Available", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92eade3d91842a5cf7c4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2004-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2004", "title": "JEE Main 2004"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "648b5a73417cc3fb48d692b2", "title": "Artificial Sweetning Agents and Food Preservatives", "totalQuestions": 8, "questions": [{"_id": "648b5a70417cc3fb48d683ff", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}], "question": {"text": "<p>Match List I with List II :</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td colspan=\"2\" rowspan=\"1\">List I</td>\t\t\t<td colspan=\"2\" rowspan=\"1\">List II</td>\t\t</tr>\t\t<tr>\t\t\t<td>A.</td>\t\t\t<td>Saccharin</td>\t\t\t<td>I.</td>\t\t\t<td>High potency sweetener</td>\t\t</tr>\t\t<tr>\t\t\t<td>B.</td>\t\t\t<td>Aspartame</td>\t\t\t<td>II.</td>\t\t\t<td>First artificial sweetening agent</td>\t\t</tr>\t\t<tr>\t\t\t<td>C</td>\t\t\t<td>Alitame</td>\t\t\t<td>III.</td>\t\t\t<td>Stable at cooking temperature</td>\t\t</tr>\t\t<tr>\t\t\t<td>D.</td>\t\t\t<td>Sucralose</td>\t\t\t<td>IV.</td>\t\t\t<td>Unstable at cooking temperature</td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below :</p><p>&nbsp;</p>", "image": null}, "options": [{"id": "UtsUW", "text": "A-IV, B-III, C-I, D-II", "image": null, "isCorrect": false}, {"id": "V69C5", "text": "A-II, B-III, C-IV, D-I", "image": null, "isCorrect": false}, {"id": "iOwNY", "text": "A-II, B-IV, C-III, D-I", "image": null, "isCorrect": false}, {"id": "q29DB", "text": "A-II, B-IV, C-I, D-III", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<blockquote><p>Saccharin is an artificial sweetener that is commonly used as a sugar substitute. It is about <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>300</mn><mo>-</mo><mn>400</mn></math> times sweeter than sugar and has a slightly bitter aftertaste.</p><p>Aspartame use is limited to cold foods and soft drinks because it is unstable at cooking temperature.</p><p>Alitame is high potency sweetener, which means that only a small amount is needed to achieve the same level of sweetness as sugar.</p><p>Sucralose is stable at cooking temperature.</p><p>So the correct option is , <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>&#8594;</mo><mi>II</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">B</mi><mo>&#8594;</mo><mi>IV</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">C</mi><mo>&#8594;</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">D</mi><mo>&#8594;</mo><mi>III</mi></math></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-08T09:00:00.000Z", "isVisible": true, "shortName": "2023 (08 Apr Shift 1)", "title": "JEE Main 2023 (08 Apr Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d68291", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b11", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 1)", "title": "JEE Main 2023 (31 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which of the following artificial sweeteners has the highest sweetness value in comparison to cane sugar?", "image": null}, "options": [{"id": "OsqMW", "text": "Aspartame<br />&nbsp;", "isCorrect": false, "image": null}, {"id": "6JgBd", "text": "Sucralose<br />&nbsp;", "isCorrect": false, "image": null}, {"id": "oDGwX", "text": "Alitame<br />&nbsp;", "isCorrect": true, "image": null}, {"id": "rmCoc", "text": "Saccharin", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Saccharin, also called ortho-sulphobenzimide,&nbsp;is the first popular artificial sweetening agent.&nbsp;It is about 550 times as sweet as cane sugar.&nbsp;Its use is of great value to diabetic persons and people who need to control their intake of calories.</p><p>Aspartame is the most successful and widely used artificial sweetener. It is roughly 100 times as sweet as cane sugar. It is the methyl ester of dipeptide formed from aspartic acid and phenylalanine. Use of aspartame is limited to cold foods and soft drinks because it is unstable at cooking temperature.</p><p>Alitame is a high-potency sweetener, and it is roughly 2000 times as sweet as cane sugar.</p><p>Sucralose is trichloro derivative of sucrose. Its appearance and taste are like sugar.&nbsp;It is roughly 600 times as sweet as cane sugar.</p><p>So, sweetness value order with respect to cane sugar is:</p><p>Alitame &gt; Sucralose &gt; Saccharin &gt; Aspartame</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b11", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T09:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 1)", "title": "JEE Main 2023 (31 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPractice ont.net/poster/iMYOPn7XiPylh.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ecde3d91842a5cf7f9", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2020-01-07T14:00:00.000Z", "isVisible": true, "shortName": "2020 (07 Jan Shift 2)", "title": "JEE Main 2020 (07 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d66070", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7df", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-09T09:00:00.000Z", "isVisible": true, "shortName": "2016 (09 Apr Online)", "title": "JEE Main 2016 (09 Apr Online)"}], "question": {"text": "The artificial sweetener that has the highest sweetness value in comparison to cane sugar is:", "image": null}, "options": [{"id": "vGbdg", "text": "Sucralose", "image": null, "isCorrect": false}, {"id": "reQgJ", "text": "Aspartame", "image": null, "isCorrect": false}, {"id": "qOwZg", "text": "Saccharin", "image": null, "isCorrect": false}, {"id": "c4gDX", "text": "Alitame", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<blockquote><p>Natural sweeteners, e.g., sucrose add to calorie intake and therefore many people prefer to use artificial sweeteners. Ortho-sulphobenzimide, also called saccharin, is the first popular artificial sweetening agent. It is about 550 times as sweet as cane sugar. Aspartame is 100 times as sweet as cane sugar.&nbsp;Sucralose is 600 times as sweet as cane sugar.&nbsp;Alitame is an artificial sweetener that has 1000 times the sweetness value of cane sugar.&nbsp;</p></blockquote>", "image": null}, "videoSolution":  and toothpaste. The structure of the Saccharin is<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e5d2b958-2f23-4a3b-ad0b-6fc525e2258b-image.png\" style=\"width: 140px; height: 134px;\" /><br /><br />Aspartame is an artificial, non-saccharide sweetener used as a sugar substitute in some foods and beverages. The structure of Aspartame is<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/2d862643-4df4-4c75-938c-cb0b0cc959b3-image.png\" style=\"width: 220px; height: 133px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7dd", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-11T09:00:00.000Z", "isVisible": true, "shortName": "2015 (11 Apr Online)", "title": "JEE Main 2015 (11 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Main';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer Type' : 'Single Correct Option'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
