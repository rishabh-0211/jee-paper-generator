"isCorrect": true}], "correctValue": null, "solution": {"text": "<blockquote><p>Opioids (narcotic analgesics) are a class of medicines that are used to provide relief from moderate-to-severe acute or chronic pain. They may also be called opiates, opioid analgesics, or narcotics. Analgesic is another name for a medicine that relieves pain. Morphine is a narcotic analgesic. It helps in relieving pain with&nbsp;producing sleep.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "e3e5b27b23ab4fed91232b25d6e6a99b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/d1OwitdEiMQAT.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/d1OwitdEiMQAT.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b648d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-04-06T14:00:00.000Z", "isVisible": true, "shortName": "2023 (06 Apr Shift 2)", "title": "JEE Main 2023 (06 Apr Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67f7d", "previousYearPapers": [{"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}], "type": "numerical", "level": 3, "question": {"text": "<p>Among the following, the number of tranquilizer/s is/are</p><p>A. Chloroliazepoxide<br />B. Veronal<br />C. Valium<br />D. Salvarsan</p>", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<p>A drug that calms and soothes, and reduces stress and tension is called tranquilizer. Tranquilizers are used to treat anxiety and insomnia.</p><p>Chlorodiazepoxide, Veronal, Valium are&nbsp;tranquilizers, where as salvarsan is antibiotic.</p>", "image": null}, "videoSolution": {"videoId": "99dcbed901ed4d968c9d1d23712ee61a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/gPteDxhhIY6AB.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/gPteDxhhIY6AB.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499891d196b49d9cd6b14", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T14:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 2)", "title": "JEE Main 2023 (01 Feb Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67f19", "previousYearPapers": [{"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Match List I with List II</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 300px;\">\t<tbody>\t\t<tr>\t\t\t<td colspan=\"2\" rowspan=\"1\" style=\"text-align: center;\"><strong>List II</strong></td>\t\t\t<td colspan=\"2\" rowspan=\"1\" style=\"text-align: center;\"><strong>List II</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td>(A)</td>\t\t\t<td>Tranquilizers</td>\t\t\t<td>(I)</td>\t\t\t<td>Anti blood clotting</td>\t\t</tr>\t\t<tr>\t\t\t<td>(B)</td>\t\t\t<td>Aspirin</td>\t\t\t<td>(II)</td>\t\t\t<td>Salvarsan</td>\t\t</tr>\t\t<tr>\t\t\t<td>(C)</td>\t\t\t<td>Antibiotic</td>\t\t\t<td>(III)</td>\t\t\t<td>Antidepressant drugs</td>\t\t</tr>\t\t<tr>\t\t\t<td>(D)</td>\t\t\t<td>Antiseptic</td>\t\t\t<td>(IV)</td>\t\t\t<td>Soframicine</td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below:</p>", "image": null}, "options": [{"id": "UcxLT", "text": "(A)&ndash;IV, (B)&ndash;II, (C)&ndash;I, (D)&ndash;III", "isCorrect": false, "image": null}, {"id": "XyHSE", "text": "(A)&ndash;II, (B)&ndash;I, (C)&ndash;III, (D)&ndash;IV", "isCorrect": false, "image": null}, {"id": "fvrWP", "text": "(A)&ndash;III, (B)&ndash;I, (C)&ndash;II, (D)&ndash;IV", "isCorrect": true, "image": null}, {"id": "iB4N3", "text": "(A)&ndash;II, (B)&ndash;IV, (C)&ndash;I, (D)&ndash;III", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Tranquilizers are a class of chemical compounds used for the treatment of stress and mild or even severe mental diseases. For example,&nbsp;noradrenaline is one of the neurotransmitters that play a role in mood changes. If the level of noradrenaline is low for some reason, then the signal-sending activity becomes low, and the person suffers from depression. In such situations, antidepressant drugs are required.</p><p>Aspirin inhibits the synthesis of chemicals known as prostaglandins which stimulate inflammation in the tissue and cause pain. These drugs are effective in relieving skeletal pain such as that due to arthritis. These drugs have many other effects such as reducing fever (antipyretic) and preventing platelet coagulation. Because of its anti-blood clotting action, aspirin finds use in the prevention of heart attacks.</p><p>Antibiotics are used as drugs to treat infections because of their low toxicity for humans and animals.&nbsp;Paul Ehrlich, a German bacteriologist,&nbsp;investigated arsenic-based structures in order to produce less toxic substances for the treatment of syphilis. He developed the medicine, arsphenamine, known as salvarsan.</p><p>Antiseptics are applied to the living tissues such as wounds, cuts, ulcers and diseased skin surfaces. Examples are furacine, soframicine, etc.</p><p>So, the correct matching is A-III, B-I, C-II, D-IV.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "63f499881d196b49d9cd6b13", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-02-01T09:00:00.000Z", "isVisible": true, "shortName": "2023 (01 Feb Shift 1)", "title": "JEE Main 2023 (01 Feb Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a70417cc3fb48d682f5", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Which of the following compounds are not used as disinfectants?</p><p>A. Chloroxylenol<br />B. Bithional<br />C. Veronal<br />D. Prontosil<br />E. Terpineol</p><p>Choose the correct answer from the options given below:</p>", "image": null}, "options": [{"id": "Lwx5h", "text": "A, B, E", "isCorrect": false, "image": null}, {"id": "TKnHI", "text": "C, D", "isCorrect": true, "image": null}, {"id": "Z2TFR", "text": "A, B", "isCorrect": false, "image": null}, {"id": "jMfgh", "text": "B, D, E", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Antiseptics and disinfectants are also chemicals that either kill or prevent the growth of microorganisms. Antiseptics are applied to living tissues such as wounds, cuts, ulcers and diseased skin surfaces. Examples are furacine, soframicine, etc. Commonly used antiseptic, Dettol is a mixture of chloroxylenol and terpineol.&nbsp;Bithionol (the compound is also called bithional) is added to soaps to impart antiseptic properties.&nbsp;Protonsil is an antibiotic, whereas veronal is a tranquilizer&nbsp;which is&nbsp;used for the treatment of stress and mild or severe mental diseases.</p><p>So, Veronal and Prontosil&nbsp;are not used as disinfectant.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499871d196b49d9cd6b12", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-31T14:00:00.000Z", "isVisible": true, "shortName": "2023 (31 Jan Shift 2)", "title": "JEE Main 2023 (31 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6823f", "previousYearPapers": [{"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Given below are two statements: One is labelled as Assertion A and the other labelled as Reason R.<br />Assertion <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>: Antihistamines do not affect the secretion of acid in stomach.<br />Reason <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> : Antiallergic and antacid drugs work on different receptors.<br />In the light of the above statements, choose the correct answer from the options given below:", "image": null}, "options": [{"id": "kjv7L", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is false but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is true", "isCorrect": false, "image": null}, {"id": "0pTMf", "text": "Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> are true and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is the correct explanation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>", "isCorrect": true, "image": null}, {"id": "PI081", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> is true but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is false", "isCorrect": false, "image": null}, {"id": "JJHQV", "text": "Both <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> are true but <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">R</mi></math> is not the correct explanation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Antihistamines do not affect the secretion of acid in stomach, the reason is that antiallergic and antacid drugs work on different receptors.</p><p>So, both assertion and reason are true and reason is the correct explanation of assertion.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["ASSERTION_REASON"], "previousYear": {"_id": "63f499871d196b49d9cd6b10", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 2)", "title": "JEE Main 2023 (30 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d681ea", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Amongst the following compounds, which one is an antacid?", "image": null}, "options": [{"id": "xLG5Y", "text": "Ranitidine", "isCorrect": true, "image": null}, {"id": "5LhD9", "text": "Meprobamate", "isCorrect": false, "image": null}, {"id": "D9gqa", "text": "Terfenadine", "isCorrect": false, "image": null}, {"id": "PelG9", "text": "Brompheniramine", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Antacids are actually alkaline ions that directly neutralize the gastric acids of the stomach.&nbsp;Substances such as sodium&nbsp;hydrogen carbonate&nbsp;or a mixture of aluminium and magnesium hydroxide are used as antacids. Ranitidine is an antacid.</p><p>Tranquilizers are a class of chemical compounds used for the treatment of stress, and mild or even severe mental diseases.Meprobamate&nbsp;is relatively mild&nbsp;tranquilizers&nbsp;suitable for relieving tension.</p><p>Synthetic drugs, brompheniramine (Dimetapp) and terfenadine (Seldane), act as antihistamines. They interfere with the natural action&nbsp;of histamine by competing with histamine for binding sites of receptor where histamine exerts its effect.</p><p>So, the correct answer is Ranitidine&nbsp;is an antacid.</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499861d196b49d9cd6b0f", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (30 Jan Shift 1)", "title": "JEE Main 2023 (30 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68185", "previousYearPapers": [{"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "A doctor prescribed the drug Equanil to a patient. The patient was likely to have symptoms of which disease?", "image": null}, "options": [{"id": "TFVQ5", "text": "Stomach ulcers", "isCorrect": false, "image": null}, {"id": "Pkssq", "text": "Hyperacidity", "isCorrect": false, "image": null}, {"id": "Rp4rZ", "text": "Anxiety and stress", "isCorrect": false, "image": null}, {"id": "xc5H4", "text": "Depression and hypertension", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Tranquilizers are neurologically active drugs used to treat stress and severe or mild mental disorders.<br />Equanil is an example of a tranquilizer that helps in controlling depression and hypertension.<br />This medication is used short term to treat symptoms of anxiety and nervousness. It acts on certain centres of the brain to help calm the nervous system.</p><p>&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a2755766-f041-4667-b8a1-63839b4366c9-f0247494-7702-4af8-a6cd-674327490731-image.png\" style=\"width: 351px; height: 162px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499861d196b49d9cd6b0e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T14:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 2)", "title": "JEE Main 2023 (29 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6813a", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "<p>Match List I with List II</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 400px;\">\t<tbody>\t\t<tr>\t\t\t<td style=\"text-align: center;\">List I</td>\t\t\t<td style=\"text-align: center;\">List II</td>\t\t</tr>\t\t<tr>\t\t\t<td style=\"text-align: center;\">Antimicrobials</td>\t\t\t<td style=\"text-align: center;\">Names</td>\t\t</tr>\t\t<tr>\t\t\t<td>(A)&nbsp;Narrow Spectrum<br />\t\t\tAntibiotic</td>\t\t\t<td>(I) Furacin</td>\t\t</tr>\t\t<tr>\t\t\t<td>(B) Antiseptic</td>\t\t\t<td>(II) Sulphur dioxide</td>\t\t</tr>\t\t<tr>\t\t\t<td>(C) Disinfectants<br />\t\t\t&nbsp;</td>\t\t\t<td>(III) Penicillin-G</td>\t\t</tr>\t\t<tr>\t\t\t<td>(D) Broad spectrum antibiotic</td>\t\t\t<td>(IV) Chloramphenicol</td>\t\t</tr>\t</tbody></table>", "image": null}, "options": [{"id": "lKjNA", "text": "(A) - III, (B) - I, (C) - II, (D) - IV", "isCorrect": true, "image": null}, {"id": "pBLQO", "text": "(A) - I, (B) - II, (C) - IV, (D) - III", "isCorrect": false, "image": null}, {"id": "X0HQ3", "text": "(A) - II, (B) - I, (C) - IV, (D) - III", "isCorrect": false, "image": null}, {"id": "ODXJz", "text": "(A) - III, (B) - I, (C) - IV, (D) - II", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Narrow spectrum antibiotic are effective over less pathogens. Antiseptic are used for surface wounds. Disinfectants are used to sanitize surfaces of objects. Broad spectrum antibiotics work on broad variety of pathogens.<br />(A) Narrow spectrum antibiotic - penicillin-G<br />(B) Antiseptic - Furacine<br />(C) Disinfectants - sulphur dioxide<br />(D) Broad spectrum antibiotics - chloramphenicol", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "63f499841d196b49d9cd6b0d", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-29T09:00:00.000Z", "isVisible": true, "shortName": "2023 (29 Jan Shift 1)", "title": "JEE Main 2023 (29 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6807b", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Which of the following statements is incorrect for antibiotics?", "image": null}, "options": [{"id": "tsv2C", "text": "An antibiotic must be a product of metabolism.", "isCorrect": false, "image": null}, {"id": "HfLL6", "text": "An antibiotic is a synthetic substance produced as a structural analogue of naturally occurring antibiotic.", "isCorrect": false, "image": null}, {"id": "JOleM", "text": "An antibiotic should promote the growth or survival of microorganisms.", "isCorrect": true, "image": null}, {"id": "yKZ4W", "text": "&nbsp;An antibiotic should be effective in low concentrations.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "An antibiotic should not promote growth or survival of microorganisms such as&nbsp;bacteria, fungi, algae because&nbsp;antibiotics are chemicals that kill or inhibit the growth of bacteria&nbsp;and are used to treat bacterial infections. They are produced in nature by soil bacteria and fungi.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0b", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-25T09:00:00.000Z", "isVisible": true, "shortName": "2023 (25 Jan Shift 1)", "title": "JEE Main 2023 (25 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d6802c", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match List I with List II</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 200px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td><strong>LIST I Type</strong></td>\t\t\t<td>&nbsp;</td>\t\t\t<td><strong>LIST II Name</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td>A</td>\t\t\t<td>Antifertility drug</td>\t\t\t<td>I</td>\t\t\t<td>Norethindrone</td>\t\t</tr>\t\t<tr>\t\t\t<td>B</td>\t\t\t<td>Tranquilizer</td>\t\t\t<td>II</td>\t\t\t<td>Meprobomate</td>\t\t</tr>\t\t<tr>\t\t\t<td>C</td>\t\t\t<td>Antihistamine</td>\t\t\t<td>III</td>\t\t\t<td>Seldane</td>\t\t</tr>\t\t<tr>\t\t\t<td>D</td>\t\t\t<td>Antibiotic</td>\t\t\t<td>IV</td>\t\t\t<td>Ampicillin</td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below :</p>", "image": null}, "options": [{"id": "xKe3p", "text": "A-II, B-I, C-III, D-IV", "isCorrect": false, "image": null}, {"id": "2rkJ5", "text": "A-IV, B-III, C-II, D-I", "isCorrect": false, "image": null}, {"id": "kQiv4", "text": "A-I, B-III, C-II, D-IV", "isCorrect": false, "image": null}, {"id": "bAIG5", "text": "A-I, B-II, C-III, D-IV", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Norethindrone is an example of synthetic progesterone derivative most widely used as antifertility drug. Meprobamate, is&nbsp;relatively mild tranquilizer&nbsp;suitable for relieving tension.&nbsp;Synthetic drugs, brompheniramine (Dimetapp) and terfenadine (Seldane), act as antihistamines.&nbsp;Ampicillin and Amoxycillin are synthetic modifications of penicillins. These have broad spectrum&nbsp;antibiotics.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d68029", "previousYearPapers": [{"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Correct statement is :", "image": null}, "options": [{"id": "KDhH1", "text": "An average human being consumes more food than air", "isCorrect": false, "image": null}, {"id": "c7Gqg", "text": "An average human being consumes nearly 15 times more air than food", "isCorrect": true, "image": null}, {"id": "69FSO", "text": "An average human being consumes equal amount of food and air", "isCorrect": false, "image": null}, {"id": "gcHca", "text": "An average human being consumes 100 times more air than food", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "An average human being requires nearly 12-15 times more air than the food. So, even small amounts of pollutants in the air become significant compared to similar levels present in the food. Pollutants can be degradable, like discarded vegetables which rapidly break down by natural processes.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63f499841d196b49d9cd6b0a", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T14:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 2)", "title": "JEE Main 2023 (24 Jan Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6f417cc3fb48d67fd0", "previousYearPapers": [{"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)", "title": "JEE Main 2023 (24 Jan Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Given below are two statements :</p><p>Statement I : Noradrenaline is a neurotransmitter.</p><p>Statement II : Low level of noradrenaline is not the cause of depression in human.</p><p>In the light of the above statements, choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "afXs0", "text": "Both statement 1 and 2 are correct..", "isCorrect": false, "image": null}, {"id": "275X1", "text": "Statement 1 is correct but statement 2 is incorrect", "isCorrect": true, "image": null}, {"id": "TrGkj", "text": "Statement 1 is incorrect but statement 2 is correct", "isCorrect": false, "image": null}, {"id": "8AjCv", "text": "Both statement 1 and 2 are correct", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Noradrenaline is one of the neurotransmitters that plays a role in mood changes. If the level of noradrenaline is low for some reason, then the signal-sending activity becomes low, and the person suffers from depression", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["TWO_STATEMENT_BASED"], "previousYear": {"_id": "63f499801d196b49d9cd6b09", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2023-01-24T09:00:00.000Z", "isVisible": true, "shortName": "2023 (24 Jan Shift 1)", "title": "JEE Main 2023 (24 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67e1c", "previousYearPapers": [{"_id": "63134c746e7bc9b33248370c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 2)", "title": "JEE Main 2022 (29 Jul Shift 2)"}], "type": "numerical", "level": 1, "question": {"text": "The number of chlorine atoms in bithionol is", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<blockquote><p>Bithionol is an antibacterial, anthelmintic, and algaecide.&nbsp;Bithionol&nbsp;(the compound is also called bithional) is added to soaps to impart antiseptic properties. It is&nbsp;aryl sulfide that is diphenyl sulfide in which each phenyl group is substituted at position 2 by hydroxy and at positions 3 and 5 by chlorine.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/4f66acd1-18fa-40b4-b31e-9536fe1272b3-image.png\" style=\"width: 254px; height: 150px;\" /></p><p>So, as we can see in the structure it has total of 4 chlorine atoms.</p><p>Chlorine atoms&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4</mn></math></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b33248370c", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 2)", "title": "JEE Main 2022 (29 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67db7", "previousYearPapers": [{"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which of the following compounds is an example of hypnotic drug?", "image": null}, "options": [{"id": "xc0Zm", "text": "Seldane", "isCorrect": false, "image": null}, {"id": "snp6g", "text": "Amytal", "isCorrect": true, "image": null}, {"id": "1lR9l", "text": "Aspartame", "isCorrect": false, "image": null}, {"id": "L5NwN", "text": "Prontosil", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Derivatives of barbituric acid viz., veronal, amytal, nembutal, luminal and seconal constitute an important class of tranquilizers. These derivatives are called barbiturates. Barbiturates are hypnotic. i.e.,&nbsp;sleep producing agents.</p><p>Amytal is hypnotic drug used to treat sleep disorder.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f8cf903f-f9ed-4faf-adb9-9fdd0075846e-image.png\" style=\"width: 125px; height: 200px;\" /></p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483707", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jul Shift 1)", "title": "JEE Main 2022 (29 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67ae6", "previousYearPapers": [{"_id": "63134c746e7bc9b332483705", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 1)", "title": "JEE Main 2022 (27 Jul Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match List-I with List-II</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\"><strong>List-I</strong></td>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\"><strong>List-II</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td>A</td>\t\t\t<td>\t\t\t<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/955f3355-5e0c-4226-81ee-b8a30ee769c8-image.png\" style=\"width: 218px; height: 150px;\" /></p>\t\t\t</td>\t\t\t<td>I</td>\t\t\t<td>Anti-depressant</td>\t\t</tr>\t\t<tr>\t\t\t<td>B</td>\t\t\t<td>\t\t\t<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/171a8be8-0949-4d19-bb49-23d31fef038a-image.png\" style=\"width: 173px; height: 150px;\" />​​​​​​​</p>\t\t\t</td>\t\t\t<td>II</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>550</mn></math>&nbsp;times sweeter than cane sugar</td>\t\t</tr>\t\t<tr>\t\t\t<td>C</td>\t\t\t<td>\t\t\t<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6ad619cc-952a-485f-996f-8d3c07b465c9-image.png\" style=\"width: 223px; height: 90px;\" /></p>\t\t\t</td>\t\t\t<td>III</td>\t\t\t<td>Narcotic analgesic</td>\t\t</tr>\t\t<tr>\t\t\t<td>D</td>\t\t\t<td>\t\t\t<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/76babdd8-ec96-46c2-8a76-fedbada8b173-image.png\" style=\"width: 149px; height: 150px;\" /></p>\t\t\t</td>\t\t\t<td>IV</td>\t\t\t<td>Antiseptic</td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "8Vqjy", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi></math>", "isCorrect": false, "image": null}, {"id": "habAt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>IV</mi></math>", "isCorrect": false, "image": null}, {"id": "M65BX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>II</mi></math>", "isCorrect": true, "image": null}, {"id": "CBU6b", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>II</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>(A)</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/955f3355-5e0c-4226-81ee-b8a30ee769c8-image.png\" style=\"width: 218px; height: 150px;\" /></p><p>Morphine and many of its homologues, when administered in medicinal doses, relieve pain and produce sleep. In poisonous doses, these produce stupor, coma, convulsions and ultimately death. Morphine narcotics are sometimes referred to as opiates, since they are obtained from the opium poppy.</p><p>(B)</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/171a8be8-0949-4d19-bb49-23d31fef038a-image.png\" style=\"width: 173px; height: 150px;\" /></p><p>Chloroxylenol used as an antiseptic</p><p>(C)</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/6ad619cc-952a-485f-996f-8d3c07b465c9-image.png\" style=\"width: 223px; height: 90px;\" /></p><p>Phenelzine (Nardil) use as Antidepressant</p><p>(D)</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/76babdd8-ec96-46c2-8a76-fedbada8b173-image.png\" style=\"width: 149px; height: 150px;\" />​​​​​​​</p><p>Saccharin <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>550</mn></math> times sweeter than cane sugar</p></blockquote>", "image": null}, "videoSolution": {"videoId": "12c8bc2296ba4a6e83fbf01328e0d103", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/bRCenVNUpcq2p.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/bRCenVNUpcq2p.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "63134c746e7bc9b332483705", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-27T09:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jul Shift 1)", "title": "JEE Main 2022 (27 Jul Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d679e4", "previousYearPapers": [{"_id": "63134c746e7bc9b332483709", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 2)", "title": "JEE Main 2022 (26 Jul Shift 2)"}], "type": "numerical", "level": 2, "question": {"text": "How many of the following drugs is/are example(s) of broad spectrum antibiotic? Ofloxacin, Penicillin <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">G</mi></math>, Terpineol, Salvarsan", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "<blockquote><p>The range of bacteria or other microorganisms that are affected by a certain antibiotic is expressed as its spectrum of action. Antibiotics which kill or inhibit a wide range of Gram-positive and Gram-negative bacteria are said to be broad spectrum antibiotics. Those effective mainly against Gram-positive or Gram-negative bacteria are narrow spectrum antibiotics.</p><p>Salvarsan&nbsp;is an antibacterial drug.<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>As</mi><mo>=</mo><mi>As</mi><mo>-</mo></math>linkage present in arsphenamine or&nbsp;Salvarsan</p><p>Penicillin&nbsp;G is a narrow spectrum antibiotic</p><p>Ofloxacin&nbsp;is an&nbsp;important broad spectrum antibiotic.</p><p>Terpineol along with chloroxylenol are the components of&nbsp;dettol&nbsp; which is used as&nbsp;antiseptic .</p><p>Hence, Ofloxacin is the only broad spectrum antibiotic among the given options.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483709", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-26T14:00:00.000Z", "isVisible": true, "shortName": "2022 (26 Jul Shift 2)", "title": "JEE Main 2022 (26 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67871", "previousYearPapers": [{"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 2)", "title": "JEE Main 2022 (25 Jul Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Some drugs bind to a site other than, the active site of an enzyme. This site is known as", "image": null}, "options": [{"id": "VaWfv", "text": "non-active site", "isCorrect": false, "image": null}, {"id": "n9xQq", "text": "allosteric site", "isCorrect": true, "image": null}, {"id": "mXAcU", "text": "competitive site", "isCorrect": false, "image": null}, {"id": "rDNYK", "text": "therapeutic site", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>Some drugs do not bind to the enzyme&rsquo;s active site. These bind to a different site of enzyme which is called allosteric site. This binding of inhibitor at allosteric site changes the shape of the active site in such a way that substrate cannot recognise it.&nbsp;</p><p>Non-competitive inhibitor changes the active site of enzyme after binding at allosteric site</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "63134c746e7bc9b332483708", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-07-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jul Shift 2)", "title": "JEE Main 2022 (25 Jul Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67ec5", "previousYearPapers": [{"_id": "62c481f101514d218a7934dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 2)", "title": "JEE Main 2022 (29 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "The mixture of chloroxylenol and terpineol is an example of :", "image": null}, "options": [{"id": "KDc99", "text": "Antiseptic", "isCorrect": true, "image": null}, {"id": "U83X7", "text": "Pesticide", "isCorrect": false, "image": null}, {"id": "T0r7t", "text": "Disinfectant", "isCorrect": false, "image": null}, {"id": "JJkiS", "text": "narcotic analgesic", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Commonly used antiseptic, dettol is a mixture of chloroxylenol and terpineol.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/736c3263-417e-4adb-bf9d-88d9c3d15852-b886ed1d-ef76-4542-8c3f-cbe0371f1f83-9709720.png\" style=\"width: 470px; height: 329px;\" /></p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T14:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 2)", "title": "JEE Main 2022 (29 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67e6b", "previousYearPapers": [{"_id": "62c481f101514d218a7934db", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 1)", "title": "JEE Main 2022 (29 Jun Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which of the following compound does not contain sulphur atom?", "image": null}, "options": [{"id": "MOudK", "text": "Histamine", "isCorrect": true, "image": null}, {"id": "Wsku8", "text": "Cimetidine", "isCorrect": false, "image": null}, {"id": "CrhRe", "text": "Saccharin", "isCorrect": false, "image": null}, {"id": "MAgxN", "text": "Ranitidine", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3be8e92b-e7ef-47d9-9d30-2f31aa6095f1-image.png\" style=\"width: 187px; height: 90px;\" /></p><p>Histamine is nitrogenous compound it does not contain sulpher.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934db", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-29T09:00:00.000Z", "isVisible": true, "shortName": "2022 (29 Jun Shift 1)", "title": "JEE Main 2022 (29 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6e417cc3fb48d67d5e", "previousYearPapers": [{"_id": "62c481f101514d218a7934da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 2)", "title": "JEE Main 2022 (28 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>The structure of Tagamet (Cimetidine) is:</p>", "image": null}, "options": [{"id": "EbLc4", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/a694bb61-87b5-4e4b-9d59-885da05a8d06-image.png\" style=\"width: 200px; height: 95px;\" />", "isCorrect": false, "image": null}, {"id": "wAdHN", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/1c993ff0-cdb5-467c-93f6-2c6fb89361f3-image.png\" style=\"width: 300px; height: 97px;\" />", "isCorrect": false, "image": null}, {"id": "6Lbwk", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e3e60033-6c8b-4991-84e2-616448dcf70b-image.png\" style=\"width: 260px; height: 113px;\" />", "isCorrect": true, "image": null}, {"id": "cpanK", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/bc0a2a59-c99b-4c66-a926-6c69f7fc4cf9-12-7-202217.png\" style=\"width: 255px; height: 120px;\" />", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Cimetidine is a member of the class of guanidines that consists of guanidine carrying a methyl substituent at position <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>, a cyano group at position <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> and a <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>-</mo><mrow><mo>{</mo><mo>[</mo><mo>(</mo><mn>5</mn><mo>-</mo><mi>methyl</mi><mo>-</mo><mn>1</mn><mi mathvariant=\"normal\">H</mi><mo>-</mo><mi>imidazol</mi><mo>-</mo><mn>4</mn><mo>-</mo><mi>yl</mi><mo>)</mo><mi>methyl</mi><mo>]</mo><mi>sulfanyl</mi><mo>}</mo><mi>ethyl</mi></mrow></math>&nbsp;group at position <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>.</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/e68052c6-0b78-49ec-bdd5-c9b253ce0441-image.png\" style=\"width: 270px; height: 126px;\" />&nbsp;</p>", "image": null}, "videoSolution": {"videoId": "d87896786530427390e1897cfd81d721", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/YyQkhg3DjDzSK.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/YyQkhg3DjDzSK.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Main"}, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f101514d218a7934da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-28T14:00:00.000Z", "isVisible": true, "shortName": "2022 (28 Jun Shift 2)", "title": "JEE Main 2022 (28 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6d417cc3fb48d67bf5", "previousYearPapers": [{"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>Match List-I with List-II</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\"><strong>List-I</strong></td>\t\t\t<td style=\"text-align: center;\">&nbsp;</td>\t\t\t<td style=\"text-align: center;\"><strong>List-II</strong></td>\t\t</tr>\t\t<tr>\t\t\t<td>(A)</td>\t\t\t<td>Antipyretic</td>\t\t\t<td>(I)</td>\t\t\t<td>Reduces pain</td>\t\t</tr>\t\t<tr>\t\t\t<td>(B)</td>\t\t\t<td>Analgesic</td>\t\t\t<td>(II)</td>\t\t\t<td>Reduces stress</td>\t\t</tr>\t\t<tr>\t\t\t<td>(C)</td>\t\t\t<td>Tranquilizer</td>\t\t\t<td>(III)</td>\t\t\t<td>Reduces fever</td>\t\t</tr>\t\t<tr>\t\t\t<td>(D)</td>\t\t\t<td>Antacid</td>\t\t\t<td>(IV)</td>\t\t\t<td>Reduces acidity(stomach)</td>\t\t</tr>\t</tbody></table><p>Choose the correct answer from the options given below</p>", "image": null}, "options": [{"id": "zAER1", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>IV</mi></math>", "isCorrect": true, "image": null}, {"id": "Y0vC6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>II</mi></math>", "isCorrect": false, "image": null}, {"id": "GOIvl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>IV</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>III</mi></math>", "isCorrect": false, "image": null}, {"id": "gAtNk", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi mathvariant=\"normal\">I</mi><mo>,</mo><mi mathvariant=\"normal\">B</mi><mo>-</mo><mi>III</mi><mo>,</mo><mi mathvariant=\"normal\">C</mi><mo>-</mo><mi>II</mi><mo>,</mo><mi mathvariant=\"normal\">D</mi><mo>-</mo><mi>IV</mi></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Analgesics reduce or abolish pain without causing impairment of consciousness, mental confusion,&nbsp;incoordination, paralysis or some other disturbances of nervous system.</p><p>Tranquillizers are a class of chemical compounds used for the treatment of stress, and mild or even severe mental diseases. These relieve anxiety, stress, irritability or excitement by inducing a sense of well-being. They form an essential component of sleeping pills.</p><p>Treatment for acidity was administration of antacids, such as sodium hydrogen carbonate or a mixture of aluminium and magnesium hydroxide. However, excessive hydrogen carbonate can make the stomach alkaline and trigger the production of even more acid.</p><p>An antipyretic is a substance that reduces fever. Antipyretics cause the hypothalamus to override a prostaglandin-induced increase in temperature.</p><p>Hence,</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 300px;\">\t<tbody>\t\t<tr>\t\t\t<td>(A)</td>\t\t\t<td>Antipyretic Reduces fever</td>\t\t</tr>\t\t<tr>\t\t\t<td>(B)</td>\t\t\t<td>Analgesic Reduces pain</td>\t\t</tr>\t\t<tr>\t\t\t<td>(C)</td>\t\t\t<td>Tranquilizer Reduces stress</td>\t\t</tr>\t\t<tr>\t\t\t<td>(D)</td>\t\t\t<td>Antacid Reduces acidity (Stomach)</td>\t\t</tr>\t</tbody></table>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "62c481f101514d218a7934d8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-27T14:00:00.000Z", "isVisible": true, "shortName": "2022 (27 Jun Shift 2)", "title": "JEE Main 2022 (27 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67926", "previousYearPapers": [{"_id": "62c481f001514d218a7934d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 2)", "title": "JEE Main 2022 (25 Jun Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "An antiseptic dettol is a mixture of two compounds &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&#39; and &#39;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&#39; where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">A</mi></math>&nbsp;has <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi mathvariant=\"normal\">&#960;</mi></math> electrons and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>&nbsp;has <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi mathvariant=\"normal\">&#960;</mi></math> electrons. What is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math>?", "image": null}, "options": [{"id": "okCBb", "text": "Bithional&nbsp;", "isCorrect": false, "image": null}, {"id": "Zv71M", "text": "<p>Terpineol</p>", "isCorrect": true, "image": null}, {"id": "5G0Xk", "text": "Chlorophenol", "isCorrect": false, "image": null}, {"id": "75uBb", "text": "Chloroxyenol", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/64d24f0d-812e-446e-8a55-1d5f920dba4c-image.png\" style=\"width: 350px; height: 198px;\" /></p><p>dettol is a mixture of chloroxylenol and terpineol. chloroxylenol has <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>6&#960;</mtext></math> electrons and &nbsp;terpineol has <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>2&#960;</mtext></math> electrons.</p><p>Hence,B is terpineol.</p><p>&nbsp;</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d4", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-25T14:00:00.000Z", "isVisible": true, "shortName": "2022 (25 Jun Shift 2)", "title": "JEE Main 2022 (25 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d677bd", "previousYearPapers": [{"_id": "62c481f001514d218a7934d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T14:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 2)", "title": "JEE Main 2022 (24 Jun Shift 2)"}], "type": "singleCorrect", "level": 1, "question": {"text": "<p>The structure shown below is of which well-known drug molecule?</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/f6eb3669-4d4a-46e7-995f-c9af8352d2b9-image.png\" style=\"width: 350px; height: 166px;\" /></p>", "image": null}, "options": [{"id": "QLQ3S", "text": "Codeine", "isCorrect": false, "image": null}, {"id": "G16vp", "text": "Morphine", "isCorrect": false, "image": null}, {"id": "CHk4H", "text": "Ranitidine", "isCorrect": false, "image": null}, {"id": "GC5Db", "text": "Cimetidine", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/33d30c99-150b-4591-aea7-740c60a38b37-image.png\" style=\"width: 350px; height: 139px;\" /></p><p>The given structure is of Cimetidine.&nbsp;Cimetidine is an antihistamine drug which is used to treat stomach acidity and peptic ulcers. It is a sulphur-containing derivative of imidazole.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d2", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T14:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 2)", "title": "JEE Main 2022 (24 Jun Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6c417cc3fb48d67763", "previousYearPapers": [{"_id": "62c481f001514d218a7934d1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T09:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 1)", "title": "JEE Main 2022 (24 Jun Shift 1)"}], "type": "singleCorrect", "level": 1, "question": {"text": "Which of the following is not a broad spectrum antibiotic?", "image": null}, "options": [{"id": "efBfw", "text": "Vancomycin", "isCorrect": false, "image": null}, {"id": "jGRkr", "text": "Penicillin&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">G</mi></math>", "isCorrect": true, "image": null}, {"id": "u0ZHj", "text": "Ofloxacin", "isCorrect": false, "image": null}, {"id": "UqTer", "text": "Ampicillin", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p>A broad-spectrum antibiotic is an antibiotic that acts on the two major bacterial groups, gram-positive and gram-negative, or any antibiotic that acts against a wide range of disease-causing bacteria.</p><p>Penicillin G has a narrow spectrum. Ampicillin and Amoxycillin are synthetic modifications of penicillins. These have broad spectrum.&nbsp;</p><p>Chloramphenicol is a broad spectrum antibiotic. It is rapidly absorbed from the gastrointestinal tract and hence can be given orally in case of typhoid, dysentery, acute fever, certain form of urinary infections, meningitis and pneumonia.</p></blockquote>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "62c481f001514d218a7934d1", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2022-06-24T09:00:00.000Z", "isVisible": true, "shortName": "2022 (24 Jun Shift 1)", "title": "JEE Main 2022 (24 Jun Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a6b417cc3fb48d6759c", "previousYearPapers": [{"_id": "615d92edde3d91842a5cf81e", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2021-08-27T14:00:00.000Z", "isVisible": true, "shortName": "2021 (27 Aug Shift 2)", "title": "JEE Main 2021 (27 Aug Shift 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Which one of the following chemicals is responsible for the production of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>HCl</mi></math> in the stomach leading to irritation and pain?", "image": null}, "options": [{"id": "djlag", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/fbdf0d37-9043-420b-b11f-7156d8617214-image.png\" style=\"width: 217px; height: 120px;\" /></p>", "isCorrect": false, "image": null}, {"id": "0gSAu", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/9d899d54-f0e8-4ab8-bb33-feb977b6e4e5-image.png\" style=\"width: 276px; height: 120px;\" /></p>", "isCorrect": true, "image": null}, {"id": "rFJ7E", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/9b9cadf6-3dd6-4f21-b6ea-6861333b67d2-image.png\" style=\"width: 353px; height: 150px;\" /></p>", "isCorrect": false, "image": null}, {"id": "wJQvr", "text": "<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/3fe10375-e6b7-4ec0-b57b-b8aba60f2b89-image.png\" style=\"width: 307px; height: 150px;\" /></p>", "isCorrect b6d6c68b0d9-image.png\" width=\"238\" /><br /><br />Chloroxylenol is a phenol derivative and hence, can be identified with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>FeCl</mi><mn>3</mn></msub></math> test.<br /><br />The primary amine of sulphapyridine can be identified with carbylamine test.<br /><br />The aliphatic alkyne of Norethindrone can be identified by the Baeyer&#39;s reagent.<br /><br />Penicillin gives test with sodium hydrogen carbonate.</p>", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e8", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2019-01-09T09:00:00.000Z", "isVisible": true, "shortName": "2019 (09 Jan Shift 1)", "title": "JEE Main 2019 (09 Jan Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d66399", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-16T09:00:00.000Z", "isVisible": true, "shortName": "2018 (16 Apr Online)", "title": "JEE Main 2018 (16 Apr Online)"}], "question": {"text": "The correct match between items of List-I and List-II is:<table border=\"1\">\t<tbody>\t\t<tr>\t\t\t<td>List &ndash;I</td>\t\t\t<td>List - II</td>\t\t</tr>\t\t<tr>\t\t\t<td>(A) Phenelzine</td>\t\t\t<td>(P) Pyrimidine</td>\t\t</tr>\t\t<tr>\t\t\t<td>(B) Chloroxylenol</td>\t\t\t<td>(Q) Furan</td>\t\t</tr>\t\t<tr>\t\t\t<td>(C) Uracil</td>\t\t\t<td>(R) Hydrazine</td>\t\t</tr>\t\t<tr>\t\t\t<td>(D) Ranitidine</td>\t\t\t<td>(S) Phenol</td>\t\t</tr>\t</tbody></table>", "image": null}, "options": [{"id": "t4bIX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mi mathvariant=\"normal\">A</mi></mfenced><mo>-</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">S</mi></mfenced><mo>,</mo><mi mathvariant=\"no ight: 214px;\" /><br /><math><mo>&#8594;</mo></math>&nbsp;&nbsp; Ranitidine contains furan ring<br /><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/65dd3698-d64e-4def-9a4b-345847cfaad6-image.png\" style=\"width: 557px; height: 154px;\" /></p></blockquote>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["MATCH_THE_LIST"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e7", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2018-04-16T09:00:00.000Z", "isVisible": true, "shortName": "2018 (16 Apr Online)", "title": "JEE Main 2018 (16 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a65417cc3fb48d660c3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7e0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2016 (10 Apr Online)", "title": "JEE Main 2016 (10 Apr Online)"}], "question": {"text": "Which of the following is a bactericidal antibiotic?", "image": null}, "options": [{"id": "yHlXm", "text": "Ofloxacin", "image": null, "isCorrect": true}, {"id": "kWSQe", "text": "Tetracycline", "image": null, "isCorrect": false}, {"id": "aeY4C", "text": "Chloramphenicol", "image": null, "isCorrect": false}, {"id": "SaSQt", "text": "Erythromycin", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ofloxacin is a bactericidal antibiotic which kills bacteria and all other given options are bacteria static which inhibit the growth of bacteria.", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7e0", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2016-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2016 (10 Apr Online)", "title": "JEE Main 2016 (10 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65f54", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}], "question": {"text": "<img alt=\"\" height=\"104\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/image22-f0e22483-2e12-4efd-b723-1bb5b7207581.jpg\" width=\"125\" /> is used as:", "image": null}, "options": [{"id": "LO8Xv", "text": "Antacid", "image": null, "isCorrect": false}, {"id": "S6hxM", "text": "Insecticide", "image": null, "isCorrect": false}, {"id": "h8PlP", "text": "Antihistamine", "image": null, "isCorrect": false}, {"id": "LQzx3", "text": "Analgesic", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The given structure is the acetylsalicylic acid, which&nbsp;is known as Aspirin.</p><p>Aspirin, also known as acetylsalicylic acid, is a medication used to reduce pain, fever, or inflammation.</p><p>This is an example of an analgesic drug.</p><p>An analgesic or painkiller is any member of the group of drugs used to achieve analgesia, relief from pain. They are distinct from anesthetics, which temporarily affect, and in some instances eliminate, sensation.</p><p>&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_main/999u.png\" style=\"width: 130px; height: 100px;\" /></p><p>Hence, Acetyl salicylic acid&nbsp;is analgesic.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["default"], "previousYear": {"_id": "615d92ebde3d91842a5cf7dc", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-10T09:00:00.000Z", "isVisible": true, "shortName": "2015 (10 Apr Online)", "title": "JEE Main 2015 (10 Apr Online)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65f0a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}], "question": {"text": "Which of the following compounds is not an antacid?", "image": null}, "options": [{"id": "Zc1b5", "text": "Ranitidine", "image": null, "isCorrect": false}, {"id": "69a9g", "text": "Aluminium hydroxide", "image": null, "isCorrect": false}, {"id": "Xjw4L", "text": "Cimetidine", "image": null, "isCorrect": false}, {"id": "x1oDU", "text": "Phenelzine", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Ranitidine, Cimetidine and metal hydroxides like aluminium hydroxide can be used as an antacid but not phenelzine. Phenelzine is not an antacid. It is an antidepressant. Antacids are a type of medication that can control the acid levels in the stomach.&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "outOfSyllabus", "questionStructure": ["ODD_ONE_OUT"], "previousYear": {"_id": "648b5a3a0d9d0b909f7b6487", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2015-04-04T09:00:00.000Z", "isVisible": true, "shortName": "2015 (04 Apr)", "title": "JEE Main 2015 (04 Apr)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "648b5a64417cc3fb48d65eab", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "615d92ebde3d91842a5cf7da", "examId": "615d76b2c52ffa3c944600df", "heldOn": "2014-04-19T09:00:00.000Z", "isVisible": true, "shortName": "2014 (19 Apr Online)", "title": "JEE Main 2014 (19 Apr Online)"}], "question": {"text": "Among the following organic acids, the acid present in rancid butter is :", "image": null}, "options": [{"id": "lNzEH", "text": "Pyruvic acid", "image": null, "isCorrect": false}, {"id": "hc76h", "text": "Acetic acid", "image": null, "isCorrect": false}, {"id": "NduNK", "text": "Butyric acid", "image":
