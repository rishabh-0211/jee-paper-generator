\">O</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>&lt;</mo><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c4209f887ec67dba", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The solubility order for alkali metal fluoride in water is", "image": null}, "options": [{"id": "UcVvq", "text": "<math><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">F</mi><mo>&lt;</mo><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">F</mi><mo>&lt;</mo><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">F</mi><mo>&lt;</mo><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">F</mi></math>", "image": null, "isCorrect": false}, {"id": "i22uc", "text": "<math><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">F</mi><mo>&lt;</mo><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">F</mi><mo>&lt;</mo><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">F</mi><mo>&lt;</mo><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">F</mi></math>", "image": null, "isCorrect": false}, {"id": "wDxlQ", "text": "<math><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">F</mi><mo>&gt;</mo><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">F</mi><mo>&gt;</mo><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">F</mi><mo>&gt;</mo><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">F</mi></math>", "image": null, "isCorrect": false}, {"id": "sXSoe", "text": "<math><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">F</mi><mo>&lt;</mo><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">F</mi><mo>&lt;</mo><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">F</mi><mo>&lt;</mo><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">F</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Higher the lattice enthalpy lower will be solubility <br/><br/>i.e., lattice enthalpy  <math><mo>∝</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mtext>Solubility</mtext></mrow></mfrac></math> <br/><br/>Since the lattice enthalpy of alkali metals follow the order <br/><br/> <math><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">i</mi><mo>&gt;</mo><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mo>&gt;</mo><mi mathvariant=\"normal\">K</mi><mo>&gt;</mo><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">b</mi></math> <br/><br/>Hence the correct order of solubility is <br/><br/> <math><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">F</mi><mo>&lt;</mo><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">F</mi><mo>&lt;</mo><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">F</mi><mo>&lt;</mo><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">F</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a3ed1ec372c752e1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The ionization energies of <math> <mrow> <mtext>Li</mtext></mrow> </math> and <math> <mrow> <mtext>Na</mtext></mrow> </math> are <math> <mrow> <mtext>520</mtext><mtext> </mtext><mtext>kJ</mtext></mrow> </math> <math><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">o</mi><msup><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> and <math> <mrow> <mtext>495</mtext><mtext> </mtext><mtext>kJ</mtext><mtext> </mtext><msup> <mrow> <mtext>mol</mtext></mrow> <mrow> <mo>−</mo><mn>1</mn></mrow> </msup> </mrow> </math> respectively. The energy required to convert all the atoms present in <math> <mrow> <mtext>7</mtext><mtext> </mtext><mtext>mg</mtext></mrow> </math> of <math> <mrow> <mtext>Li</mtext></mrow> </math> vapours and <math> <mrow> <mtext>23</mtext><mtext> </mtext><mtext>mg</mtext></mrow> </math> of sodium vapours to their respective gaseous cations respectively are:", "image": null}, "options": [{"id": "l0sZq", "text": "52 J, 49.5 J", "image": null, "isCorrect": false}, {"id": "nnxTV", "text": "520 J, 495 J", "image": null, "isCorrect": true}, {"id": "HGwG4", "text": "49.5 J, 52 J", "image": null, "isCorrect": false}, {"id": "SWJDt", "text": "495 J, 520 J", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For 1 mole Li i.e. 7 g will absorb 520 kJ heat<br />So for 7 mg lithium heat absorbed will be 520 J<br />Similarly for sodium<br />1 mole Na i.e. 23 g will absorb 495 kJ Heat<br />So for 23 mg sodium heat absorbed will be 520 J", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a1ca42873178b2aa", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "66", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The first <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math> and second <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math> ionization energies (kJ/mol) of a few elements designated by Roman numerals are given below. Which of these would be an alkali metal?", "image": null}, "options": [{"id": "SaNJD", "text": "<table border='1px solid'> <thead> <tr> <th></th> <th> <math><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></math> </th> <th> <math><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub></math> </th> </tr> </thead> <tbody> <tr> <td>I</td> <td>2372</td> <td>5251</td> </tr> </tbody> </table>", "image": null, "isCorrect": false}, {"id": "Q9Xrg", "text": "<table border='1px solid'> <thead> <tr> <th></th> <th> <math><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></math> </th> <th> <math><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub></math> </th> </tr> </thead> <tbody> <tr> <td>II</td> <td>520</td> <td>7300</td> </tr> </tbody> </table>", "image": null, "isCorrect": true}, {"id": "VClLp", "text": "<table border='1px solid'> <thead> <tr> <th></th> <th> <math><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></math> </th> <th> <math><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub></math> </th> </tr> </thead> <tbody> <tr> <td>III</td> <td>900</td> <td>1760</td> </tr> </tbody> </table>", "image": null, "isCorrect": false}, {"id": "8UQEj", "text": "<table border='1px solid'> <thead> <tr> <th></th> <th> <math><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></math> </th> <th> <math><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub></math> </th> </tr> </thead> <tbody> <tr> <td>IV</td> <td>1680</td> <td>3380</td> </tr> </tbody> </table>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As alkali metals have the lowest <math><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></math> values in their respectively periods and also there is a large jump between <math><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub></math> due to the removal of second electron from the noble gas core, therefore, out of the given <math><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><mi mathvariant=\"normal\">I</mi><msub><mrow><mi mathvariant=\"normal\">E</mi></mrow><mrow><mn>2</mn></mrow></msub></math> values (II) belongs to alkali metals.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639ec024bc0d78d05f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "86", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The solubility of metal halides depends on their nature, lattice enthalpy and hydration enthalpy of the individual ions, amongst fluorides of alkali metals, the lowest solubility of LiF in water is due to", "image": null}, "options": [{"id": "0nKOn", "text": "Ionic nature of lithium fluoride", "image": null, "isCorrect": false}, {"id": "X56BV", "text": "High lattice enthalpy", "image": null, "isCorrect": true}, {"id": "Xk5Vp", "text": "High hydration enthalpy of lithium ion", "image": null, "isCorrect": false}, {"id": "yastw", "text": "Low ionisation enthalpy of lithium atom", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The lowest solubility of LiF in water is due to strong packing of <math><msup><mrow><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">i</mi></mrow><mrow><mo>+</mo></mrow></msup></math> and <math><msup><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mo>-</mo></mrow></msup></math> ion, lattice energy of LIF is higher than its hydration energy.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639cf6ac0dbeb87c48", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "62", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Given below are two reactions of water with sodium and carbon dioxide. What is the nature of water in these reactions?<br/><br/>(i)  <math><mn>2</mn><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mo>+</mo><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mo>→</mo><mn>2</mn><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> <br/><br/>(ii)  <math><mn>6</mn><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mn>12</mn><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mo>→</mo><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>6</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>12</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>6</mn></mrow></msub><mo>+</mo><mn>6</mn><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mo>+</mo><mn>6</mn><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null}, "options": [{"id": "SUC6U", "text": "In (ii) water acts as an oxidising agent and in (i) it acts as a reducing agent", "image": null, "isCorrect": false}, {"id": "PUBsn", "text": "In (i) water acts an an oxidising agent while in (ii) it acts as a reducing agent", "image": null, "isCorrect": true}, {"id": "WPTQ2", "text": "In both, (i) and (ii) hydrogen acts as a reducing agent", "image": null, "isCorrect": false}, {"id": "TcVGm", "text": "In both, (i) and (ii) hydrogen acts as an oxidising agent", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "With sodium metal water acts as an oxidising agent and gets reduced to  <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> , with  <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>  water acts as a reducing agent and is oxidised to oxygen.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86395eeabd454364a92", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "98", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the given below alkali metal ions which has lowest ionic mobility in aqueous solutions?", "image": null}, "options": [{"id": "OYzJh", "text": "<math><mi mathvariant=\"normal\">R</mi><msup><mrow><mi mathvariant=\"normal\">b</mi></mrow><mrow><mo>+</mo></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "tKVcV", "text": "<math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>+</mo></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "41SGI", "text": "<math><mi mathvariant=\"normal\">L</mi><msup><mrow><mi mathvariant=\"normal\">i</mi></mrow><mrow><mo>+</mo></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "Oeab5", "text": "<math><mi mathvariant=\"normal\">N</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mo>+</mo></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As we know that hydration power decreases on moving down the group hence among alkali metals Li has excessive hydration & hence it has low mobility in aqeous solution.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863923e3ff3aa149236", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following metal pairs on burning in moist air do not give smell of ammonia?<br />\rMg, Ca, K, Li, Na, Al", "image": null}, "options": [{"id": "UqFQ1", "text": "Mg, K", "image": null, "isCorrect": false}, {"id": "JWEJp", "text": "Ca, Na", "image": null, "isCorrect": false}, {"id": "2uvqK", "text": "K, Na", "image": null, "isCorrect": true}, {"id": "38OSR", "text": "Li, Al", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mg</mi><mo>+</mo><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><mo>→</mo><msub><mi>Mg</mi><mn>3</mn></msub><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><munderover><mo>→</mo><mi>moist</mi><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></munderover><mi>Mg</mi><mfenced><msub><mi>OH</mi><mn>2</mn></msub></mfenced><mo>+</mo><msub><mi>NH</mi><mn>3</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi><mo>+</mo><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><mo>→</mo><msub><mi>Ca</mi><mn>3</mn></msub><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><munderover><mo>→</mo><mi>moist</mi><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></munderover><mi>Ca</mi><msub><mfenced><mi>OH</mi></mfenced><mn>2</mn></msub><mo>+</mo><msub><mi>NH</mi><mn>3</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi><mo>+</mo><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><mo>→</mo><msub><mi>Li</mi><mn>3</mn></msub><mi mathvariant=\"normal\">N</mi><munderover><mo>→</mo><mi>moist</mi><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></munderover><mi>LiOH</mi><mo>+</mo><msub><mi>NH</mi><mn>3</mn></msub></math></p><math><mi mathvariant=\"normal\">K</mi><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>→</mo></math> no reaction<br /><math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>→</mo></math> no reaction<br />Hence, Sodium and Potassium do not give smell of ammonia.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638eef6bfeca2297e7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "106", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When potassium is reacted with oxygen, which of the following compound(s) is/are formed?", "image": null}, "options": [{"id": "ufMFj", "text": "<math> <mrow>  <msub>   <mtext>K</mtext>   <mtext>2</mtext>  </msub>  <mtext>O</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "gviAZ", "text": "<math> <mrow>  <msub>   <mrow>    <mtext>KO</mtext></mrow>   <mtext>2</mtext>  </msub>  </mrow></math>", "image": null, "isCorrect": true}, {"id": "I3FcY", "text": "Both <math> <mrow>  <msub>   <mtext>K</mtext>   <mtext>2</mtext>  </msub>  <mtext>O</mtext></mrow></math> and <math> <mrow>  <msub>   <mrow>    <mtext>KO</mtext></mrow>   <mtext>2</mtext>  </msub>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "LAqOn", "text": "<math> <mrow>  <msub>   <mtext>K</mtext>   <mtext>2</mtext>  </msub>  <msub>   <mtext>O</mtext>   <mtext>2</mtext>  </msub>  </mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Various alkali metals react with oxygen to give different types of compounds. Lithium reacts with oxygen to form simple oxides (Li<sub>2</sub>O), Sodium reacts to form peroxides (Na<sub>2</sub>O<sub>2</sub>) while potassium, rubidium and caesium form superoxides (MO<sub>2</sub>).<br /><br />Hence, correct answer will be KO<sub>2</sub>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86378c09b3bd8f321c5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "72", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Among alkali metal salts, the lithium salts are the poorest conductors of electricity in aqueous solution because of", "image": null}, "options": [{"id": "xUNEg", "text": "easy diffusion of  <math><mi mathvariant=\"normal\">L</mi><msup><mrow><mi mathvariant=\"normal\">i</mi></mrow><mrow><mo>+</mo></mrow></msup></math>  ions", "image": null, "isCorrect": false}, {"id": "J9lyo", "text": "lower ability of  <math><mi mathvariant=\"normal\">L</mi><msup><mrow><mi mathvariant=\"normal\">i</mi></mrow><mrow><mo>+</mo></mrow></msup></math>  ions to polarize water molecules", "image": null, "isCorrect": false}, {"id": "T0T67", "text": "lowest charge to radius ratio", "image": null, "isCorrect": false}, {"id": "8IXvx", "text": "higher degree of hydration of  <math><mi mathvariant=\"normal\">L</mi><msup><mrow><mi mathvariant=\"normal\">i</mi></mrow><mrow><mo>+</mo></mrow></msup></math>  ions", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Ionic conductance in solution depends upon the mobility of ions, which depend upon the degree (or extent) of hydration. Since charge/radius ratio is maximum for  <math><mi mathvariant=\"normal\">L</mi><msup><mrow><mi mathvariant=\"normal\">i</mi></mrow><mrow><mo>+</mo></mrow></msup></math> , so it is hydrated to a maximum extent. Thus, the ionic size in aqueous solution, instead of increasing, actually decreases on moving from  <math><mi mathvariant=\"normal\">L</mi><msup><mrow><mi mathvariant=\"normal\">i</mi></mrow><mrow><mo>+</mo></mrow></msup></math>  to  <math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">s</mi></mrow><mrow><mo>+</mo></mrow></msup></math> .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86372af5cd65e2a4c4c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "39", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Sodium and potassium react with water much more vigorously than lithium because:", "image": null}, "options": [{"id": "wkKao", "text": "Sodium and potassium have high values of hydration energy as compared to that of lithium.", "image": null, "isCorrect": false}, {"id": "DEJoh", "text": "Sodium and potassium have higher melting point than that of lithium.", "image": null, "isCorrect": false}, {"id": "MR4RJ", "text": "Sodium and potassium have lower melting point than that of lithium.", "image": null, "isCorrect": true}, {"id": "l8GGY", "text": "Sodium and potassium have lower hydration energy than that of lithium.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When sodium and potassium react with water, the heat evolved causes them to melt, giving a larger area of contact with water, lithium on the other hand, does not melt under these conditions and thus reacts more slowly.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/637108.JPG\" style=\"width: 401px; height: 91px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86361ff4949323df63f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "45", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "When a substance, A reacts with water, it produces a combustible gas B and a solution of a substance, C in water. When another substance, D reacts with this solution of C, it also produces the same gas, B on warming, but D can produce B on reaction with dilute sulphuric acid at room temperature. A imparts a deep golden-yellow colour to a smokeless flame of Bunsen burner. A, B, C and D respectively are :", "image": null}, "options": [{"id": "J4Dft", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Na</mi><mo>,</mo><mtext>  </mtext><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mo>,</mo><mtext>  </mtext><mi>NaOH</mi><mtext>  </mtext><mi>and</mi><mtext>  </mtext><mi>Zn</mi></math>", "image": null, "isCorrect": true}, {"id": "iawNQ", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">K</mi><mo>,</mo><mtext>  </mtext><msub><mi mat o><mtext>(p);&#x00A0;B</mtext><mo>&#x2192;</mo><mtext>(s);&#x00A0;C</mtext><mo>&#x2192;</mo><mtext>(r);&#x00A0;D</mtext><mo>&#x2192;</mo><mtext>(q)</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "IXc6V", "text": "<math> <mrow>  <mtext>A</mtext><mo>&#x2192;</mo><mtext>(r);&#x00A0;B</mtext><mo>&#x2192;</mo><mtext>(q);&#x00A0;C</mtext><mo>&#x2192;</mo><mtext>(p);&#x00A0;D</mtext><mo>&#x2192;</mo><mtext>(s)</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<strong>Sodium metal&nbsp;</strong> It is manufactured by electrolysis of a fused mixture of <math> <mrow> <mtext>NaCl</mtext><mtext>&#8196;</mtext><mtext>(40%)</mtext></mrow> </math> and <math> <mrow> <msub> <mrow> <mtext>CaCl</mtext></mrow> <mtext>2</mtext> </msub> <mtext>&#8196;</mtext><mtext>(60%)</mtext></mrow> </math> in Down&#39;s cell at <math> <mrow> <mtext>873</mtext><mtext>&#8196;</mtext><mtext>K</mtext><mtext>.</mtext></mrow> </math> <math> <mrow> <mtext>Na</mtext></mrow> </math> liberated at the cathode is collected, in kerosene oil while <math> <mrow> <msub> <mrow> <mtext>Cl</mtext></mrow> <mtext>2</mtext> </msub> </mrow> </math> is evolved at the anode.<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mtable> <mtr> <mtd> </mtd> <mtd> <mtext>NaCl</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>l</mi><mo>&#8289;</mo> </mrow> </mfenced> </mtd> <mtd> <mover> <mo>&#8594;</mo> <mtext>Electrolysis</mtext> </mover> </mtd> <mtd> <msup> <mtext>Na</mtext> <mo>+</mo> </msup> <mo>+</mo> <msup> <mtext>Cl</mtext> <mo>-</mo> </msup> </mtd> </mtr> <mtr> <mtd> <mtext>At cathode</mtext> </mtd> <mtd> <msup> <mtext>Na</mtext> <mo>+</mo> </msup> <mo>+</mo> <msup> <mtext>e</mtext> <mo>-</mo> </msup> </mtd> <mtd> <mo>&#10230;</mo> </mtd> <mtd> <mtext>Na</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>l</mi><mo>&#8289;</mo> </mrow> </mfenced> </mtd> </mtr> <mtr> <mtd> <mtext>At anode</mtext> </mtd> <mtd> <mn>2</mn> <msup> <mtext>Cl</mtext> <mo>-</mo> </msup> </mtd> <mtd> <mo>&#10230;</mo> </mtd> <mtd> <msub> <mtext>Cl</mtext> <mn>2</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>g</mtext> </mrow> </mfenced> <mo>+</mo> <mn>2</mn> <msup> <mtext>e</mtext> <mo>-</mo> </msup> </mtd> </mtr> </mtable> </mrow> </math><br /><br /><strong>Sodium hydroxide</strong>&nbsp; It is manufactured by electrolysis of an aqueous solution of <math> <mrow> <mtext>NaCl</mtext></mrow> </math> (brine) in Castner - Kellner cell using mercury cathode and carbon anode. Sodium metal which is discharged at the cathode combines with mercury to form sodium amalgam. <math> <mrow> <msub> <mrow> <mtext>Cl</mtext></mrow> <mtext>2</mtext> </msub> <mtext>.</mtext></mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mtable> <mtr> <mtd> <mtext>At cathode</mtext> </mtd> <mtd> <msup> <mtext>Na</mtext> <mo>+</mo> </msup> <mo>+</mo> <msup> <mtext>e</mtext> <mo>-</mo> </msup> </mtd> <mtd> <mover> <mo>&#10230;</mo> <mtext>Hg</mtext> </mover> </mtd> <mtd> <mtext>Na</mtext> <mo>-</mo> <mtext>amalgam</mtext> </mtd> </mtr> <mtr> <mtd> <mtext>At anode</mtext> </mtd> <mtd> <mn>2</mn> <msup> <mtext>Cl</mtext> <mo>-</mo> </msup> </mtd> <mtd> <mo>&#10230;</mo> </mtd> <mtd> <msub> <mtext>Cl</mtext> <mn>2</mn> </msub> <mo>+</mo> <mn>2</mn> <msup> <mtext>e</mtext> <mo>-</mo> </msup> </mtd> </mtr> </mtable> </mrow> </math><br /><br />The sodium amalgam thus obtained is treated with water to form sodium hydroxide and hydrogen gas.<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mtable> <mtr> <mtd> <mn>2</mn> <mtext>Na</mtext> <mo>-</mo> <mtext>amalgam</mtext> <mo>+</mo> <mn>2</mn> <msub> <mtext>H</mtext> <mn>2</mn> </msub> <mtext>O</mtext> </mtd> <mtd> <mo>&#10230;</mo> </mtd> <mtd> <mn>2</mn> <mtext>NaOH</mtext> <mo>+</mo> <mn>2</mn> <mtext>Hg</mtext> <mo>+</mo> <msub> <mtext>H</mtext> <mn>2</mn> </msub> </mtd> </mtr> </mtable> </mrow> </math><br /><br /><strong>Sodium carbonate</strong>&nbsp; It is obtained by Solvay ammonia process. When <math> <mrow> <msub> <mrow> <mtext>CO</mtext></mrow> <mtext>2</mtext> </msub> </mrow> </math> is passed through a concentrated solution of brine (aqueous solution of <math> <mrow> <mtext>NaCl</mtext></mrow> </math> ) saturated with ammonia, <math> <mrow> <msub> <mrow> <mtext>NaHCO</mtext></mrow> <mtext>3</mtext> </msub> </mrow> </math> gets precipitated. <math> <mrow> <msub> <mrow> <mtext>NaHCO</mtext></mrow> <mtext>3</mtext> </msub> </mrow> </math> on subsequent heating gives <math> <mrow> <msub> <mrow> <mtext>Na</mtext></mrow> <mtext>2</mtext> </msub> <msub> <mrow> <mtext>CO</mtext></mrow> <mtext>3</mtext> </msub> <mtext>.</mtext></mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mtable> <mtr> <mtd> <mtext>NaCl</mtext> <mo>+</mo> <msub> <mtext>NH</mtext> <mn>3</mn> </msub> </mtd> <mtd> <mo>+</mo> </mtd> <mtd> <msub> <mtext>CO</mtext> <mn>2</mn> </msub> <mo>+</mo> <msub> <mtext>H</mtext> <mn>2</mn> </msub> <mtext>O</mtext> </mtd> <mtd> <mo>&#10230;</mo> </mtd> <mtd> <msub> <mtext>NaHCO</mtext> <mn>3</mn> </msub> <mo>&#8595;</mo> <mo>+</mo> <msub> <mtext>NH</mtext> <mn>4</mn> </msub> <mtext>Cl</mtext> </mtd> </mtr> <mtr> <mtd> </mtd> <mtd> </mtd> <mtd> <mn>2</mn> <msub> <mtext>NaHCO</mtext> <mn>3</mn> </msub> </mtd> <mtd> <mover> <mo>&#10230;</mo> <mo>&#916;</mo> </mover> </mtd> <mtd> <msub> <mtext>Na</mtext> <mn>2</mn> </msub> <msub> <mtext>CO</mtext> <mn>3</mn> </msub> <mo>+</mo> <msub> <mtext>CO</mtext> <mn>2</mn> </msub> <mo>+</mo> <msub> <mtext>H</mtext> <mn>2</mn> </msub> <mtext>O</mtext> </mtd> </mtr> </mtable> </mrow> </math><br /><br />It reacts with <math> <mrow> <msub> <mrow> <mtext>Cl</mtext></mrow> <mtext>2</mtext> </msub> </mrow> </math> to form calcium hypochlorite, <math> <mrow> <msub> <mrow> <mtext>Ca(OCl)</mtext></mrow> <mtext>2</mtext> </msub> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable equalrows=\"true\" equalcolumns=\"true\"><mtr><mtd><mtext>2Ca</mtext><msub><mfenced><mtext>OH</mtext></mfenced><mtext>2</mtext></msub></mtd><mtd><mtext>+</mtext></mtd><mtd><msub><mtext>2Cl</mtext><mtext>2</mtext></msub></mtd><mtd><mtext>&#8594;&#8196;</mtext></mtd><mtd><mover><munder><mrow><msub><mtext>CaCl</mtext><mtext>2</mtext></msub><mtext>+Ca</mtext><msub><mfenced><mtext>OCl</mtext></mfenced><mtext>2</mtext></msub></mrow><mrow/></munder><mrow/></mover></mtd><mtd><mtext>+</mtext></mtd><mtd><msub><mtext>2H</mtext><mtext>2</mtext></msub><mtext>O</mtext></mtd></mtr><mtr><mtd><mtext>Slaked&#160;lime</mtext></mtd><mtd/><mtd/><mtd/><mtd><mtext>Bleaching&#160;power</mtext></mtd><mtd/><mtd/></mtr></mtable></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86358aaa8ef247ccb76", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which one of the following cannot be prepared from <math> <mrow> <msub> <mtext>B</mtext> <mtext>2</mtext> </msub> <msub> <mtext>H</mtext> <mtext>6</mtext> </msub> <mtext>?</mtext></mrow> </math>", "image": null}, "options": [{"id": "CB1aZ", "text": "<math> <mrow>  <msub>   <mrow>    <mtext>NaBH</mtext></mrow>   <mtext>4</mtext>  </msub>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "FtbF1", "text": "<math> <mrow>  <msub>   <mtext>B</mtex ue}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The element A burns in nitrogen to give an ionic compound B. The compound B reacts with water to give C and D. A solution of C becomes milky on bubbling carbon dioxide. What is the nature of compound D?", "image": null}, "options": [{"id": "JF1WU", "text": "Acidic", "image": null, "isCorrect": false}, {"id": "bpiZq", "text": "Basic", "image": null, "isCorrect": true}, {"id": "SYNgX", "text": "Amphoteric", "image": null, "isCorrect": false}, {"id": "Yj74f", "text": "Neutral", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>A</mtext><mover> <mo>→</mo> <mrow> <mtext>burns,</mtext><mtext> </mtext><mtext>nitrogen</mtext></mrow> </mover> <munder> <mtext>B</mtext> <mrow> <mtext>ionic</mtext><mtext> </mtext><mtext>compound</mtext></mrow> </munder> <mover> <mo>→</mo> <mrow> <msub> <mtext>H</mtext> <mtext>2</mtext> </msub> <mtext>O</mtext></mrow> </mover> <munder> <mtext>C</mtext> <mrow> <mtext>milky</mtext><mtext> </mtext><mtext>solution</mtext></mrow> </munder> <mtext> </mtext><mtext>+</mtext><mtext> </mtext><mtext>D</mtext><mover> <mo>→</mo> <mrow> <msub> <mrow> <mtext>CO</mtext></mrow> <mtext>2</mtext> </msub> </mrow> </mover> </mrow> </math><br />Since the solution of C becomes milky on bubbling <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> into it, C is lime water <math><mo>(</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi><msub><mrow><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced><mo>.</mo></math> Thus, the element A is calcium and B is the compound of calcium with nitrogen. Nitrides on reacting with water give the corresponding hydroxide and ammonia. Therefore,<br />A is calcium (Ca)<br />B is calcium nitride <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math> .<br />C is lime water <math><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub></math><br />D is ammonia <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfenced></math> .<br /><math> <mrow> <mtext>Ca</mtext><mover> <mo>→</mo> <mrow> <mtext>burns,</mtext><mtext> </mtext><mtext>nitrogen</mtext></mrow> </mover> <munder> <mrow> <msub> <mrow> <mtext>Ca</mtext></mrow> <mn>3</mn> </msub> <msub> <mtext>N</mtext> <mn>2</mn> </msub> </mrow> <mrow> <mtext>ionic</mtext><mtext> </mtext><mtext>compound</mtext></mrow> </munder> <mover> <mo>→</mo> <mrow> <msub> <mtext>H</mtext> <mn>2</mn> </msub> <mtext>O</mtext></mrow> </mover> <munder> <mrow> <mtext>Ca</mtext><msub> <mrow> <mo stretchy=\"false\">(</mo><mtext>OH</mtext><mo stretchy=\"false\">)</mo></mrow> <mn>2</mn> </msub> </mrow> <mrow> <mtext>milky</mtext><mtext> </mtext><mtext>solution</mtext></mrow> </munder> <mtext> </mtext><mo>+</mo><mtext> </mtext><msub> <mrow> <mtext>NH</mtext></mrow> <mn>3</mn> </msub> <mover> <mo>→</mo> <mrow> <msub> <mrow> <mtext>CO</mtext></mrow> <mn>2</mn> </msub> </mrow> </mover> <msub> <mrow> <mtext>CaCO</mtext></mrow> <mn>3</mn> </msub> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863923e3ff3aa149236", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following metal pairs on burning in moist air do not give smell of ammonia?<br />\rMg, Ca, K, Li, Na, Al", "image": null}, "options": [{"id": "UqFQ1", "text": "Mg, K", "image": null, "isCorrect": false}, {"id": "JWEJp", "text": "Ca, Na", "image": null, "isCorrect": false}, {"id": "2uvqK", "text": "K, Na", "image": null, "isCorrect": true}, {"id": "38OSR", "text": "Li, Al", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Mg</mi><mo>+</mo><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><mo>→</mo><msub><mi>Mg</mi><mn>3</mn></msub><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><munderover><mo>→</mo><mi>moist</mi><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></munderover><mi>Mg</mi><mfenced><msub><mi>OH</mi><mn>2</mn></msub></mfenced><mo>+</mo><msub><mi>NH</mi><mn>3</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Ca</mi><mo>+</mo><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><mo>→</mo><msub><mi>Ca</mi><mn>3</mn></msub><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><munderover><mo>→</mo><mi>moist</mi><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></munderover><mi>Ca</mi><msub><mfenced><mi>OH</mi></mfenced><mn>2</mn></msub><mo>+</mo><msub><mi>NH</mi><mn>3</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Li</mi><mo>+</mo><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><mo>→</mo><msub><mi>Li</mi><mn>3</mn></msub><mi mathvariant=\"normal\">N</mi><munderover><mo>→</mo><mi>moist</mi><mrow><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></munderover><mi>LiOH</mi><mo>+</mo><msub><mi>NH</mi><mn>3</mn></msub></math></p><math><mi mathvariant=\"normal\">K</mi><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>→</mo></math> no reaction<br /><math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>→</mo></math> no reaction<br />Hence, Sodium and Potassium do not give smell of ammonia.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637cb7533411d5e509", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "68", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "How many of the following are electron deficient molecular hydride? <math><msub><mrow><mtext>NH</mtext></mrow><mrow><mn>3</mn></mrow></msub><mo>,</mo><msub><mrow><mtext>MgH</mtext></mrow><mrow><mn>2</mn></mrow></msub><mo>,</mo><msub><mrow><mtext>H</mtext></mrow><mrow><mn>2</mn></mrow></msub><mtext>O</mtext><mo>,</mo><msub><mrow><mtext>VH</mtext></mrow><mrow><mn>0.56</mn></mrow></msub><mo>,</mo><msub><mrow><mtext>B</mtext></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mtext>H</mtext></mrow><mrow><mn>6</mn></mrow></msub><mo>,</mo><msub><mrow><mtext>SiH</mtext></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "<math><msub><mrow><mtext>B</mtext></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mtext>H</mtext></mr : [{"title": "NTA Abhyas Paper", "value": "64", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Soaps do not work in hard water containing calcium and magnesium ions because", "image": null}, "options": [{"id": "yludA", "text": "<math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>  and  <math><mi mathvariant=\"normal\">M</mi><msup><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>  ions form insoluble calcium and magnesium salts in the form of scum", "image": null, "isCorrect": true}, {"id": "racXL", "text": "<math><mi mathvariant=\"normal\">N</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mo>+</mo></mrow></msup></math>  and  <math><msup><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mo>+</mo></mrow></msup></math>  present in soap react with  <math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>  and  <math><mi mathvariant=\"normal\">M</mi><msup><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mo>+</mo></mrow></msup></math>  and hinder cleansing process", "image": null, "isCorrect": false}, {"id": "19vfA", "text": "a large amount of soap is to be used in presence of  <math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mo>+</mo></mrow></msup></math>  and  <math><mi mathvariant=\"normal\">M</mi><msup><mrow><mi mathvariant=\"normal\">g</mi></mrow><mrow><mo>+</mo></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "mVEx2", "text": "scum formed by combination of  <math><mi mathvariant=\"normal\">N</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mo>+</mo></mrow></msup></math> ,  <math><mi mat /mn></mrow></msub></math></td>\r\t\t\t<td>(s)</td>\r\t\t\t<td>Shows H-bonding</td>\r\t\t</tr>\r\t\t<tr>\r\t\t\t<td>&nbsp;</td>\r\t\t\t<td>&nbsp;</td>\r\t\t\t<td>(t)</td>\r\t\t\t<td>Have a chain structure</td>\r\t\t</tr>\r\t</tbody>\r</table>\r", "image": null}, "options": [{"id": "zbHJR", "text": "(1)-p, r; (2)-p, q, t; (3)-t; (4)-q, r", "image": null, "isCorrect": false}, {"id": "i5TM3", "text": "(1)-p; r; (2)-p, s, t; (3)-t; (4)-q", "image": null, "isCorrect": false}, {"id": "WlD8l", "text": "(1)-p; (2)-p, q, s, t; (3)-t; (4)-q, r", "image": null, "isCorrect": true}, {"id": "bUugS", "text": "(1)-p; (2)-p, s, t; (3)-t; (4)-q", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(1) <math> <mrow>  <mtext>BeO(s)</mtext></mrow></math> Amphoteric in nature<br />(2) <math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub></math> (crystalline) Amphoteric in nature, Imparts characteristic colour to Bunsen Flame,<br />Shows H-bonding and Have a chain structure<br />(3) <math><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mn>2</mn></mrow></msub></math> Have a chain structure<br />(4) <math><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">s</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> Imparts characteristic colour to Bunsen Flame and Produces <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> and <math><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> on reaction with <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86328e795bc224f19b9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In curing cement plasters water is sprinkled from time to time. This helps in", "image": null}, "options": [{"id": "505ao", "text": "keeping it cool", "image": null, "isCorrect": false}, {"id": "4UN4t", "text": "developing interlocking needle-like crystals of hydrated silicates", "image": null, "isCorrect": true}, {"id": "KrMGI", "text": "hydrating sand and gravel mixed with cement", "image": null, "isCorrect": false}, {"id": "d0qCz", "text": "converting sand into silicic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Water develops interlocking needle-like crystals of hydrated silicates. The reactions involved are the hydration of calcium aluminates and calcium silicates which change into their colloidal gels. At the same time, some calcium hydroxide and aluminium hydroxides are formed as precipitates due to hydrolysis. Calcium hydroxide binds the particles of calcium silicates together while aluminium hydroxide fills the interstices rendering the mass impervious.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86327adac3b74fc722e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2 /mrow><mrow><mn>2</mn></mrow></msub></math> and <math><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>.</mo></math><br />So, three type of product:<br /><math> <mrow>  <mtext>2</mtext><mtext>&#x2004;</mtext><mtext>M</mtext><msub>   <mrow>    <mfenced>     <mrow>      <msub>       <mrow>        <mtext>NO</mtext></mrow>       <mtext>3</mtext>      </msub>      </mrow>    </mfenced></mrow>   <mtext>2</mtext>  </msub>  <mo>&#x2192;</mo><mtext>2</mtext><mtext>&#x2004;</mtext><mtext>MO</mtext><mo>+</mo><mtext>2</mtext><mtext>&#x2004;</mtext><msub>   <mrow>    <mtext>NO</mtext></mrow>   <mtext>2</mtext>  </msub>  <mo>+</mo><msub>   <mtext>O</mtext>   <mtext>2</mtext>  </msub>  <mtext>&#x2004;</mtext><mtext>(M</mtext><mo>=</mo><mtext>Be,</mtext><mtext>&#x2004;</mtext><mtext>Mg</mtext><mo>,</mo><mtext>&#x2004;</mtext><mtext>Ca</mtext><mo>,</mo><mtext>&#x2004;</mtext><mtext>Sr,</mtext><mtext>&#x2004;</mtext><mtext>Ba)</mtext></mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630a7bced2938a55ac", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "57", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "How many among the following imparts colour to the Bunsen flame, when flame test is carried out?<br />\r<math><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">a</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">B</mi><mi mathva <mtext>a</mtext></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">N</mi></math>", "image": null, "isCorrect": false}, {"id": "uSwTI", "text": "Na and  <math><mtext>NaN</mtext><msub><mrow><mtext>O</mtext></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "Odwfd", "text": "Mg and <math><mtext>M</mtext><msub><mrow><mtext>g</mtext></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "vibUJ", "text": "Mg and  <math><mtext>Mg</mtext><mo>(</mo><mtext>N</mtext><msub><mrow><mtext>O</mtext></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>P</mtext><mo>+</mo><msub> <mtext>N</mtext> <mtext>2</mtext> </msub> <mo>→</mo><mtext>nitride(Q)</mtext><mover> <mo>→</mo> <mrow> <msub> <mtext>H</mtext> <mn>2</mn> </msub> <mtext>O</mtext></mrow> </mover> <msub> <mrow> <mtext>NH</mtext></mrow> <mtext>3</mtext> </msub> <mo>+</mo><msub> <mrow> <mtext>CuSO</mtext></mrow> <mtext>4</mtext> </msub> <mo>→</mo></mrow> </math> Blue-violet coloured sol.<br /><math> <mrow>  <munder>   <mrow>    <mtext>3</mtext><mtext>&#x2004;</mtext><mtext>Mg</mtext></mrow>   <mrow>    <mfenced>     <mtext>P</mtext>    </mfenced></mrow>  </munder>  <mtext>&#x2004;</mtext><mtext>+</mtext><mtext>&#x2004;</mtext><msub>   <mtext>N</mtext>   <mtext>2</mtext>  </msub>  <mo>&#x2192;</mo><munder>   <mrow>    <msub>     <mrow>      <mtext>Mg</mtext></mrow>     <mtext>3</mtext>    </msub>    <msub>     <mtext>N</mtext>     <mtext>2</mtext>    </msub>    </mrow>   <mrow>    <mfenced>     <mtext>Q</mtext>    </mfenced></mrow>  </munder>  <mover>   <mo>&#x2192;</mo>   <mrow>    <msub>     <mtext>H</mtext>     <mtext>2</mtext>    </msub>    <mtext>O</mtext></mrow>  </mover>  <msub>   <mrow>    <mtext>Mg(OH)</m nced><mi mathvariant=\"normal\">Y</mi></mfenced><mo>;</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>NH</mi><mn>3</mn></msub><mo>+</mo><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>→</mo><munder><mrow><msub><mi>NH</mi><mn>4</mn></msub><mi>OH</mi></mrow><mi>Solution</mi></munder></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CuSO</mi><mn>4</mn></msub><mo>+</mo><mn>4</mn><msub><mi>NH</mi><mn>4</mn></msub><mi>OH</mi><mo>→</mo><mfenced close=\"]\" open=\"[\"><mrow><mi>Cu</mi><mfenced><mi mathvariant=\"normal\">N</mi></mfenced><msub><mi>SO</mi><mn>4</mn></msub><mo>+</mo><mn>4</mn><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86394484c9a5153ad7d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "66", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The element A burns in nitrogen to give an ionic compound B. The compound B reacts with water to give C and D. A solution of C becomes milky on bubbling carbon dioxide. What is the nature of compound D?", "image": null}, "options": [{"id": "JF1WU", "text": "Acidic", "image": null, "isCorrect": false}, {"id": "bpiZq", "text": "Basic", "image": null, "isCorrect": true}, {"id": "SYNgX", "text": "Amphoteric", "image": null, "isCorrect": false}, {"id": "Yj74f", "text": "Neutral", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>A</mtext><mover> <mo>→</mo> <mrow> <mtext>burns,</mtext><mtext> </mtext><mtext>nitrogen</mtext></mrow> </mover> <munder> <mtext>B</mtext> <mrow> <mtext>ionic</mtext><mtext> </mtext><mtext>compound</mtext></mrow> </munder> <mover> <mo>→</mo> <mrow> <msub> <mtext>H</mtext> <mtext>2</mtext> </msub> <mtext>O</mtext></mrow> </mover> <munder> <mtext>C</mtext> <mrow> <mtext>milky</mtext><mtext> </mtext><mtext>solution</mtext></mrow> </munder> <mtext> </mtext><mtext>+</mtext><mtext> </mtext><mtext>D</mtext><mover> <mo>→</mo> <mrow> <msub> <mrow> <mtext>CO</mtext></mrow> <mtext>2</mtext> </msub> </mrow> </mover> </mrow> </math><br />Since the solution of C becomes milky on bubbling <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> into it, C is lime water <math><mo>(</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi><msub><mrow><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced><mo>.</mo></math> Thus, the element A is calcium and B is the compound of calcium with nitrogen. Nitrides on reacting with water give the corresponding hydroxide and ammonia. Therefore,<br />A is calcium (Ca)<br />B is calcium nitride <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math> .<br />C is lime water <math><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><msub><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub></math><br />D is ammonia <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfenced></math> .<br /><math> <mrow> <mtext>Ca</mtext><mover> <mo>→</mo> <mrow> <mtext>burns,</mtext><mtext> </mtext><mtext>nitrogen</mtext></mrow> </mover> <munder> <mrow> <msub> <mrow> <mtext>Ca</mtext></mrow> <mn>3</mn> </msub> <msub> <mtext>N</mtext> <mn>2</mn> </msub> </mrow> <mrow> <mtext>ionic</mtext><mtext> </mtext><mtext>compound</mtext></mrow> </munder> <mover> <mo>→</mo> <mrow> <msub> <mtext>H</mtext> <mn>2</mn> </msub> <mtext>O</mtext></mrow> </mover> <munder> <mrow> <mtext>Ca</mtext><msub> <mrow> <mo stretchy=\"false\">(</mo><mtext>OH</mtext><mo stretchy=\"false\">)</mo></mrow> <mn>2</mn> </msub> </mrow> <mrow> <mtext>milky</mtext><mtext> </mtext><mtext>solution</mtext></mrow> </munder> <mtext> </mtext><mo>+</mo><mtext> </mtext><msub> <mrow> <mtext>NH</mtext></mrow> <mn>3</mn> </msub> <mover> <mo>→</mo> <mrow> <msub> <mrow> <mtext>CO</mtext></mrow> <mn>2</mn> </msub> </mrow> </mover> <msub> <mrow> <mtext>CaCO</mtext></mrow> <mn>3</mn> </msub> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638386607d301d90dc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "84", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A compound <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced></math> is used in preparation of washing soda to recover ammonia in Solvay's process. When <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is bubbled through an aqueous solution of <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced></math> , the solution turns milky. It is used in white was /mtext></mrow> </math> and <math> <mrow> <msub> <mrow> <mtext>CaCl</mtext></mrow> <mtext>2</mtext> </msub> <mtext>&#8196;</mtext><mtext>(60%)</mtext></mrow> </math> in Down&#39;s cell at <math> <mrow> <mtext>873</mtext><mtext>&#8196;</mtext><mtext>K</mtext><mtext>.</mtext></mrow> </math> <math> <mrow> <mtext>Na</mtext></mrow> </math> liberated at the cathode is collected, in kerosene oil while <math> <mrow> <msub> <mrow> <mtext>Cl</mtext></mrow> <mtext>2</mtext> </msub> </mrow> </math> is evolved at the anode.<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mtable> <mtr> <mtd> </mtd> <mtd> <mtext>NaCl</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>l</mi><mo>&#8289;</mo> </mrow> </mfenced> </mtd> <mtd> <mover> <mo>&#8594;</mo> <mtext>Electrolysis</mtext> </mover> </mtd> <mtd> <msup> <mtext>Na</mtext> <mo>+</mo> </msup> <mo>+</mo> <msup> <mtext>Cl</mtext> <mo>-</mo> </msup> </mtd> </mtr> <mtr> <mtd> <mtext>At cathode</mtext> </mtd> <mtd> <msup> <mtext>Na</mtext> <mo>+</mo> </msup> <mo>+</mo> <msup> <mtext>e</mtext> <mo>-</mo> </msup> </mtd> <mtd> <mo>&#10230;</mo> </mtd> <mtd> <mtext>Na</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mi>l</mi><mo>&#8289;</mo> </mrow> </mfenced> </mtd> </mtr> <mtr> <mtd> <mtext>At anode</mtext> </mtd> <mtd> <mn>2</mn> <msup> <mtext>Cl</mtext> <mo>-</mo> </msup> </mtd> <mtd> <mo>&#10230;</mo> </mtd> <mtd> <msub> <mtext>Cl</mtext> <mn>2</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>g</mtext> </mrow> </mfenced> <mo>+</mo> <mn>2</mn> <msup> <mtext>e</mtext> <mo>-</mo> </msup> </mtd> </mtr> </mtable> </mrow> </math><br /><br /><strong>Sodium hydroxide</strong>&nbsp; It is manufactured by electrolysis of an aqueous solution of <math> <mrow> <mtext>NaCl</mtext></mrow> </math> (brine) in Castner - Kellner cell using mercury cathode and carbon anode. Sodium metal which is discharged at the cathode combines with mercury to form sodium amalgam. <math> <mrow> <msub> <mrow> <mtext>Cl</mtext></mrow> <mtext>2</mtext> </msub> <mtext>.</mtext></mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mtable> <mtr> <mtd> <mtext>At cathode</mtext> </mtd> <mtd> <msup> <mtext>Na</mtext> <mo>+</mo> </msup> <mo>+</mo> <msup> <mtext>e</mtext> <mo>-</mo> </msup> </mtd> <mtd> <mover> <mo>&#10230;</mo> <mtext>Hg</mtext> </mover> </mtd> <mtd> <mtext>Na</mtext> <mo>-</mo> <mtext>amalgam</mtext> </mtd> </mtr> <mtr> <mtd> <mtext>At anode</mtext> </mtd> <mtd> <mn>2</mn> <msup> <mtext>Cl</mtext> <mo>-</mo> </msup> </mtd> <mtd> <mo>&#10230;</mo> </mtd> <mtd> <msub> <mtext>Cl</mtext> <mn>2</mn> </msub> <mo>+</mo> <mn>2</mn> <msup> <mtext>e</mtext> <mo>-</mo> </msup> </mtd> </mtr> </mtable> </mrow> </math><br /><br />The sodium amalgam thus obtained is treated with water to form sodium hydroxide and hydrogen gas.<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math> <mrow> <mtable> <mtr> <mtd> <mn>2</mn> <mtext>Na</mtext> <mo>-</mo> <mtext>amalgam</mtext> <mo>+</mo> <mn>2</mn> <msub> <mtext>H</mtext> <mn>2</mn> </msub> <mtext>O</mtext> </mtd> <mtd> <mo>&#10230;</mo> </mtd> <mtd> <mn>2</mn> <mtext>NaOH</mtext> <mo>+</mo> <mn>2</mn> <mtext>Hg</mtext> <mo>+</mo> <msub> <mtext>H</mtext> <mn>2</mn> </msub> </mtd> </mtr> </mtable> </mrow> </math><br /><br /><strong>Sodium carbonate</strong>&nbsp; It is obtained by Solvay ammonia process. When <math> <mrow> <msub> <mrow> <mtext>CO</mtext></mrow> <mtext>2</mtext> </msub> </mrow> </math> is passed through a concentrated solution of brine (aqueous solution of <math> <mrow> <mtext>NaCl</mtext></mrow> </math> ) saturated with ammonia, <math> <mrow> <msub> <mrow> <mtext>NaHCO</mtext></mrow> <mtext>3</mtext> </msub> </mrow> </math> gets precipitated. <math> w><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>.</mo><mn>5</mn><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math>  is known as Hypo.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631349a304319a7dfa", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "How many of the following are saline hydrides? <math><msub><mrow><mtext>CH</mtext></mrow><mrow><mn>4</mn></mrow></msub><mo>,</mo><mtext>NaH</mtext><mo>,</mo><mtext>HF</mtext><mo>,</mo><mtext>CrH</mtext><mo>,</mo><msub><mrow><mtext>PdH</mtext></mrow><mrow><mn>0.7</mn></mrow></msub><mo>,</mo><mtext>LiH</mtext><mo>,</mo><msub><mrow><mtext>CaH</mtext></mrow><mrow><mn>2</mn></mrow></msub><mo>,</mo><msub><mrow><mtext>TiH</mtext></mrow><mrow><mn>1.6</mn></mrow></msub></math>", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "<math><mtext>NaH</mtext><mo>,</mo><mtext>LiH</mtext></math> and <math><msub><mrow><mtext>CaH</mtext></mrow><mrow><mn>2</mn></mrow></msub></math> are saline hydrides.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
