tatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86302c9e5bdaad38ad5", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Among the compounds, Benzene, Carbon tetrachloride, Naphthalene, Benzoic acid, Isooctane and Anthracene, how many can be purified by sublimation.", "image": null}, "options": [], "correctValue": "3", "solution": {"text": "Naphthalene, Benzoic acid and Anthracene are purified by sublimation.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "6aa3ab79aa8dc1ff68177ef0", "title": "Reactions of Alkanes", "totalQuestions": 10, "questions": [{"_id": "6151e863fe3b8ac21cc46983", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "52", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The ratio of mass percent of C and H of an organic compound  <math><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mi mathvariant=\"normal\">X</mi></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mi mathvariant=\"normal\">Y</mi></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mi mathvariant=\"normal\">Z</mi></mrow></msub></mrow></mfenced></math>  is 6 : 1. If one molecule of the above compound  <math><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mi mathvariant=\"normal\">X</mi></mrow></msub><msub><mro \">H</mi></mrow><mrow><mn>4</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math>", "image": null, "isCorrect": false}, {"id": "1oN3p", "text": "<math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>4</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Ratio of mass % of C and H in  <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mi mathvariant=\"normal\">X</mi></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mi mathvariant=\"normal\">Y</mi></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mi mathvariant=\"normal\">Z</mi></mrow></msub></math>  is 6 : 1.<br/><br/>Therefore, Ratio of mole % of C and H in  <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mi mathvariant=\"normal\">X</mi></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mi mathvariant=\"normal\">Y</mi></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mi mathvariant=\"normal\">Z</mi></mrow></msub></math>  will be 1 : 2.<br/><br/>Therefore x : y = 1 : 2, which is possible in options 1,  2 and 3. <br/><br/>Now oxygen required to burn  <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mi mathvariant=\"normal\">X</mi></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mi mathvariant=\"normal\">Y</mi></mrow></msub></math> <br/><br/> <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mi mathvariant=\"normal\">X</mi></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mi mathvariant=\"normal\">Y</mi></mrow></msub><mo>+</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">x</mi><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">y</mi></mrow><mrow><mn>4</mn></mrow></mfrac></mro </mrow></mfenced><mo>=</mo><mn>4.5</mn></math> <br/><br/>Therefore correct option is 1  <math><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>4</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c64ce78b552c9d32", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "42", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Chlorination of toluene in presence of light and heat followed by treatment with aqueous NaOH gives", "image": null}, "options": [{"id": "6GNwO", "text": "o-Cresol", "image": null, "isCorrect": false}, {"id": "gaIve", "text": "p-Cresol", "image": null, "isCorrect": false}, {"id": "SokBL", "text": "2, 4-Dihydroxytoluene", "image": null, "isCorrect": false}, {"id": "PjnUi", "text": "Benzoic acid", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img alt=\"New1.11.PNG\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/kasjtr32rt8eghadvioq.png\" style=\"width: 345px; height: 253px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bc69069aec60ee0c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "34", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abh     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
