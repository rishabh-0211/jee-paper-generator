>", "image": null, "isCorrect": false}, {"id": "jODap", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/e1b6e134-5c29-457e-9ccd-fc258653b00f.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.65833in;height:1.28333in\">", "image": null, "isCorrect": false}, {"id": "BeYNk", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/d68341ee-953a-458b-aebf-fbc5cf42f623.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.6in;height:1.28333in\">", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">V</mi></mrow></mrow><mo>∝</mo><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">T</mi></mrow></mrow></math> at constant pressure<br /><math><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">V</mi><mo>=</mo><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">T</mi></math><br /><math><mn>0.821</mn><mi mathvariant=\"normal\">V</mi><mo>=</mo><mn>10</mn><mo>×</mo><mn>0.082</mn><mo>×</mo><mi mathvariant=\"normal\">T</mi></math><br /><math><mfrac><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">T</mi></mrow></mfrac><mo>=</mo></math> constant = 1<br />Slope of the line will be 1<br />i.e., angle will be <math><mn>45</mn><mo>°</mo></math> .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d0285924961c03ae", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "64", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A graph is plotted between pressure and volume at different temperature. On the basis of the graph what changes will you observe in the volume if<br />\r<br />\r(i) the pressure is increased at constant temperature<br />\r<br />\r(ii) the temperature is decreased at constant pressure<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/8_chem_1.JPG\" style=\"width: 180px; height: 126px;\" />", "image": null}, "options": [{"id": "p7iwz", "text": "volume increases in both the cases", "image": null, "isCorrect": false}, {"id": "yVZY8", "text": "volume decreases in both the cases", "image": null, "isCorrect": true}, {"id": "44sFt", "text": "volume increases in (i) and decreases in (ii)", "image": null, "isCorrect": false}, {"id": "JGBdC", "text": "volume decreases in (i) and increases in (ii)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Volume decrease when pressure is increased at constant temperature. When temperature is decreased at constant pressure, the volume decreases.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d014ada675d19160", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following graphs correctly represents the variation of <math><mi mathvariant=\"normal\">β</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">β</mi><mo>=</mo><mo>-</mo><mfrac><mrow><msub><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">P</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">T</mi></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">V</mi></mrow></mfrac></mrow></mfenced></math> with P for an ideal gas at constant temperature?", "image": null}, "options": [{"id": "OrP4z", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/20_opt_1_CA_d.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 150px; height: 122px;\" />", "image": null, "isCorrect": true}, {"id": "6rEyb", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/20_opt_2_CA_d.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 150px; height: 120px;\" />", "image": null, "isCorrect": false}, {"id": "a5Ygi", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/20_opt_3_CA_d.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 150px; height: 122px;\" />", "image": null, "isCorrect": false}, {"id": "vVCqk", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/20_opt_4_CA_d.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 150px; height: 119px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As PV = RT<br /><br />So P.dV + V.dP = 0<br /><br />or <math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">P</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">P</mi></mrow></mfrac></math><br /><br />or <math><mi mathvariant=\"normal\">β</mi><mo>=</mo><mo>-</mo><mfrac><mrow><msub><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">P</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">T</mi></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">V</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">P</mi></mrow></mfrac></math><br /><br />Hence plot in A is correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cfeb4ddf158bb295", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "47", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Calculate the number of hours of service that can be derived at 1 atm,&nbsp;<math><mn>300&nbsp;</mn><mi mathvariant=\"normal\">K</mi></math> from an acetylene lamp containing <math><mn>640</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">g</mi></math> calcium carbide. Given that the lamp requires <math><mn>50</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">L</mi></math> acetylene gas at 1 atm <math><mn>300&nbsp;</mn><mi mathvariant=\"normal\">K</mi></math> for one hour. [Take <math><mn>0.0821</mn><mi mathvariant=\"normal\">&nbsp;</mi><mo>×</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>300</mn><mo>=</mo><mn>25]</mn></math>", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "<math><mtext mathvariant=\"normal\">C</mtext><mtext mathvariant=\"normal\">a</mtext><msub><mrow><mtext mathvariant=\"normal\">C</mtext></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mn>2</mn><msub><mrow><mtext mathvariant=\"normal\">H</mtext></mrow><mrow><mn>2</mn></mrow></msub><mtext mathvariant=\"normal\">O</mtext><mtext mathvariant=\"normal\">&nbsp;</mtext><mo>→</mo><mtext mathvariant=\"normal\">&nbsp;</mtext><mtext mathvariant=\"normal\">C</mtext><mtext mathvariant=\"normal\">a</mtext><msub><mrow><mfenced separators=\"|\"><mrow><mtext mathvariant=\"normal\">O</mtext><mtext mathvariant=\"normal\">H</mtext></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mtext mathvariant=\"normal\">C</mtext></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mtext mathvariant=\"normal\">H</mtext></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br />moles of <math> <mrow> <mtext>C</mtext><mtext>a</mtext><msub> <mtext>C</mtext> <mn>2</mn> </msub> <mo>=</mo><mfrac> <mrow> <mn>640</mn> </mrow> <mrow> <mn>64</mn> </mrow> </mfrac> <mo>=</mo><mn>10</mn> </mrow> </math><br /><br /><math> <mo>∴</mo> </math> moles of C<sub>2</sub>H<sub>2</sub> formed = 10<br /><br /><math> <mrow> <mo>∴</mo><msub> <mrow> <mtext>&nbsp;&nbsp;V</mtext> </mrow> <mrow> <msub> <mtext>C</mtext> <mn>2</mn> </msub> <msub> <mtext>H</mtext> <mn>2</mn> </msub> </mrow> </msub> </mrow> </math> = 10 × 0.0821 × 300 = 250 Litres<br /><br /><math> <mo>∴</mo> </math> number of hours = <math> <mrow> <mfrac> <mrow> <mn>250</mn> </mrow> <mrow> <mn>50</mn> </mrow> </mfrac> <mo>=</mo><mn>5</mn> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cc67ef167f87ee7c", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "70", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Gaseous benzene reacts with hydrogen gas in presence of a nickel catalyst to form gaseous cyclohexane according to the reac mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub></math> mm. <br/>So <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>60</mn></math> mm …(i) <br/>After the reaction <br/>Pressure of <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>6</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>6</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced><mo>=</mo><mn>0</mn></math>  <br/>Pressure of <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mn>3</mn><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub></math>  <br/>Pressure of <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>6</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>12</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub></math>  <br/>Total pressure <math><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mn>3</mn><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>30</mn></math> mm <br/>Or <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>30</mn></math> mm …(ii) <br/>Solving (i) and (ii) we get <br/><math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>10</mn></math> mm <br/><math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>50</mn></math> mm <br/>Fraction of <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>6</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>6</mn></mrow></msub><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced></math> by volume = Fraction of moles = Fraction of pressures <br/><math><mo>=</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mn>60</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c61de617afa5ec10", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "74", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two inflated balloons I and II (thin skin) having volume 600 mL and 1500 mL at 300 K are taken as shown in diagram. If maximum volume of inner and outer balloons are 800 mL and 1800 mL respectively then find the balloon which will burst first on gradual heating.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/10_uwed_chem.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 250px; height: 211px;\" />", "image": null}, "options": [{"id": "IKRk0", "text": "inner balloon", "image": null, "isCorrect": false}, {"id": "5aO9A", "text": "outer balloon", "image": null, "isCorrect": true}, {"id": "fZQ7l", "text": "both simultaneously", "image": null, "isCorrect": false}, {"id": "xgzsh", "text": "unpredictable", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using Charle's law<br /><br /><math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><br />Sppose inner balloon burst first <math><mfrac><mrow><mn>600</mn></mrow><mrow><mn>300</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>800</mn></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><br /><math> <mrow> <msub> <mtext>T</mtext> <mtext>2</mtext> </msub> <mo>=</mo><mn>400</mn><mtext> </mtext><mtext>K</mtext></mrow> </math><br /><br />At <math> <mrow>  <mn>400</mn><mtext>&#x2004;</mtext><mtext>K</mtext></mrow></math> the volume of outer balloon is <math> <mrow>  <mtext>2000</mtext><mtext>&#x2004;</mtext><mtext>ml</mtext></mrow></math> so outer ballon burst first.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c362f79a9736d68d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two glass bulbs X and Y are connected by a very small tube having a stop-cock. Bulb X has a volume of 100 <math><mi mathvariant=\"normal\">c</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>3</mn></mrow></msup></math> and contained the gas; while bulb Y was empty. On opening the stop-cock, the pressure fell down to 60%. The volume of the bulb Y must be", "image": null}, "options": [{"id": "bf5WP", "text": "<math><mn>132.32&nbsp;</mn><mtext>c</mtext><msup><mrow><mtext>m</mtext></mrow><mrow><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "Y8hD7", "text": "<math><mn>124&nbsp;</mn><mtext>c</mtext><msup><mrow><mtext>m</mtext></mrow><mrow><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "AubES", "text": "<math><mn>66.66&nbsp;</mn><mtext>c</mtext><msup><mrow><mtext>m</mtext></mrow><mrow><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "IYftU", "text": "<math><mn>150&nbsp;</mn><mtext>c</mtext><msup><mrow><mtext>m</mtext></mrow><mrow><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn><mo>&nbsp;</mo><mtext>atm</mtext></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>2</mn></msub><mo>=</mo><mtext>1&nbsp;atm</mtext><mo>×</mo><mfrac><mn>60</mn><mn>100</mn></mfrac><mo>=</mo><mn>0.60</mn><mo>&nbsp;</mo><mtext>atm</mtext></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">V</mi><mn>1</mn></msub><mo>=</mo><mn>100</mn><mo>&nbsp;</mo><mtext>c</mtext><msup><mtext>m</mtext><mn>3</mn></msup></math><br /><math><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>?</mo></math><br />At constant temperature, <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br />So <math><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mrow><mn>1</mn><mo>&nbsp;</mo><mtext>atm</mtext><mo>×</mo><mtext>100&nbsp;c</mtext><msup><mtext>m</mtext><mn>3</mn></msup></mrow><mrow><mn>0.60</mn><mo>&nbsp;</mo><mtext>atm</mtext></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>166.66</mn><mo>&nbsp;</mo><mtext>c</mtext><msup><mtext>m</mtext><mn>3</mn></msup></math><br />Hence, the volume of bulb <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">Y</mi><mo>=</mo><mo>(</mo><mn>166.66</mn><mo>-</mo><mn>100</mn><mo>)</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">c</mi><msup><mi mathvariant=\"normal\">m</mi><mn>3</mn></msup></math><br /><math><mo>=</mo><mn>66.66&nbsp;</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">c</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>3</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c30f768119923c9e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "109", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following relationship when graphed give a rectangular parabola for helium gas?<br />\rI. KE vs T at constant P and V<br />\rII. V vs <math><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">T</mi></mrow></mfrac></math> at constant P and n<br />\rIII. P vs V at constant T and n", "image": null}, "options": [{"id": "sLqqK", "text": "III", "image": null, "isCorrect": false}, {"id": "zSCXz", "text": "I and III", "image": null, "isCorrect": false}, {"id": "K5nmm", "text": "II", "image": null, "isCorrect": false}, {"id": "x0WEz", "text": "II and III", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Graph of P vs V at constant T is a rectangular parabola.<br />Graph of V vs <math><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">T</mi></mrow></mfrac></math> at constant P and n is a rectangular parabola.<br />Kinetic energy <math><mo>∝</mo><mi mathvariant=\"normal\">T</mi></math><br />Hence a graph between KE v/s T will be in straight line.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c15cbd6b48788ff5", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The density of <math><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is 16 at NTP. At what temperature(in <sup>o</sup>C) its density will be 14? Consider that the pressure remains constant.&nbsp;", "image": null}, "options": [], "correctValue": "39", "solution": {"text": "As <math><mtext mathvariant=\"normal\">d</mtext><mo>=</mo><mfrac><mrow><mtext mathvariant=\"normal\">P</mtext><mtext mathvariant=\"normal\">M</mtext></mrow><mrow><mtext mathvariant=\"normal\">R</mtext><mtext mathvariant=\"normal\">T</mtext></mrow></mfrac></math><br /><br /><math><msub><mrow><mtext>d</mtext></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mtext>T</mtext></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mtext>d</mtext></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mtext>T</mtext></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br />When <math><mtext>p</mtext></math> remains constant<br /><br /><math><msub><mrow><mtext>d</mtext></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>16</mn><mo>;</mo><msub><mrow><mtext>d</mtext></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>14</mn><mo>;</mo><msub><mrow><mtext>T</mtext></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>273</mn><mtext>&nbsp;</mtext><mtext mathvariant=\"normal\">K</mtext><mo>,</mo><mtext mathvariant=\"normal\">&nbsp;</mtext><msub><mrow><mtext>T</mtext></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>?</mo></math><br /><br /><math><msub><mrow><mtext>d</mtext></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mtext>T</mtext></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mtext>d</mtext></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mtext>T</mtext></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mn>16</mn><mo>×</mo><mn>273</mn><mo>=</mo><mn>14</mn><mo>×</mo><msub><mrow><mtext>T</mtext></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><msub><mrow><mtext>T</mtext></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>312</mn><mtext>&nbsp;</mtext><mtext mathvariant=\"normal\">K</mtext></math><br /><br /><math><msub><mrow><mtext>T</mtext></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>312</mn><mo>-</mo><mn>273</mn><mo>=</mo><mn>39</mn><mtext>℃</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b6bb55fb2daa9c82", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "62", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Graphs between pressure and volume are plotted at different temperature. Which of the following isotherms represent Boyle's law as PV = constant?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/646771_1.PNG\" style=\"width: 144px; height: 163px;\" />&nbsp;&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/646771_2.PNG\" style=\"width: 161px; height: 156px;\" />&nbsp;&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/646771_3.PNG\" style=\"width: 148px; height: 148px;\" />&nbsp;&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/646771_4.PNG\" style=\"width: 159px; height: 146px;\" />", "image": null}, "options": [{"id": "2Z4Np", "text": "Only (ii) is correct representation of Boyle's law", "image": null, "isCorrect": false}, {"id": "hyMVQ", "text": "Only (iv) is correct representation of Boyle's law", "image": null, "isCorrect": false}, {"id": "x7aiC", "text": "All are correct representations of Boyle's law", "image": null, "isCorrect": true}, {"id": "AVBDN", "text": "None of these representations is correct for Boyle's law", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Boyle's law:<math> <mrow>  <mtext>P</mtext><mo>&#x221D;</mo><mfrac>   <mtext>1</mtext>   <mtext>V</mtext>  </mfrac>  </mrow></math> (at constant <math > <mtext>n</mtext></math>and <math > <mtext>T</mtext></math>)<b he behaviour of one mole of an ideal gas at one atmospheric pressure?", "image": null}, "options": [{"id": "7WCso", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0642754_1.JPG\" style=\"width: 200px; height: 106px;\" />", "image": null, "isCorrect": false}, {"id": "qWtUk", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0642754_2.JPG\" style=\"width: 200px; height: 106px;\" />", "image": null, "isCorrect": false}, {"id": "TMFCV", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0642754_3.JPG\" style=\"width: 200px; height: 103px;\" />", "image": null, "isCorrect": true}, {"id": "D628U", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0642754_4.JPG\" style=\"width: 200px; height: 104px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Find the volume by either<br /><br /><math><mi mathvariant=\"normal\">V</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">P</mi></mrow></mfrac><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">V</mi><mo>=</mo><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">T</mi></mrow></mfenced></math> or <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub></math> and match it with the values given in graph to find correct.<br /><br />Volume of 1 mole of an ideal gas at 273 K and 1 atm is 22.4 L and that at 373 K and 1 atm pressure is calculated as<br /><br /><math><mi mathvariant=\"normal\">V</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">P</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>0.082</mn><mo>×</mo><mn>373</mn></mrow><mrow><mn>1</mn></mrow></mfrac><mo>=</mo><mn>30.58</mn><mi mathvariant=\"normal\">L</mi><mo>≃</mo><mn>30.6</mn><mi mathvariant=\"normal\">L</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639e62cd077fac6609", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "To an evacuated vessel with movable piston under external pressure of 1 atm, 0.1 mole of He and 1.0 mole of an unknown compound (vapour pressure 0.68 atm at <math><msup><mrow><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">ο</mi></mrow></msup><mi mathvariant=\"normal\">C</mi></math> ) are introduced. Considering ideal gas behaviour, the total volume (in L) of the gas at <math><msup><mrow><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">ο</mi></mrow></msup><mi mathvariant=\"normal\">C</mi></math> is close to x L at equilibrium. Calculate the value of x.", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "If external pressure is 1 atm the pressure inside the cylinder will also be equal to 1 atm.<br />The pressure generated by unknown compound will be fixed and equal to <math><mn>0.68</mn></math> atm, so the pressure generated by He will be <math><mn>1</mn><mo>–</mo><mn>0.68</mn><mo>=</mo><mn>0.32</mn></math> atm<br />Now by: <math><mi mathvariant=\"normal\">V</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">n</mi><mo>×</mo><mi mathvariant=\"normal\">R</mi><mo>×</mo><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">P</mi></mrow></mfrac></math><br /><math> <mrow>  <mtext>V</mtext><mo>=</mo><mfrac>   <mrow>    <mn>0.1</mn><mo>&#x00D7;</mo><mn>0.082</mn><mo>&#x00D7;</mo><mn>273</mn></mrow>   <mrow>    <mn>0.32</mn></mrow>  </mfrac>  <mo>=</mo><mn>7</mn><mtext>&#x2004;</mtext><mtext>L</mtext></mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638e64fec714cbd455", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A 2 L vessel is filled with air <math><mn>50</mn><mo>°</mo></math> C and a pressure of 3 atm. The temperature is now raised to 200 <math><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> . A value is now opened so that the pressure inside drops to one atm. What will be the fraction of the total number of moles, inside escaped on opening the value? (Assume no change in the volume of the container).", "image": null}, "options": [{"id": "tC1x3", "text": "7.7", "image": null, "isCorrect": false}, {"id": "HTYxN", "text": "9.9", "image": null, "isCorrect": false}, {"id": "8vzMh", "text": "8.9", "image": null, "isCorrect": false}, {"id": "nTYBm", "text": "0.77", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given that, <math><mi mathvariant=\"normal\">V</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">L</mi><mo>,</mo><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>50</mn><mo>+</mo><mn>273</mn><mo>=</mo><mn>323</mn><mi mathvariant=\"normal\">K</mi><mo>,</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>3</mn><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">m</mi></math><br />On heating <math><mi mathvariant=\"normal\">V</mi><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">L</mi><mo>,</mo><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>200</mn><mo>+</mo><mn>273</mn><mo>=</mo><mn>473</mn><mo>,</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>?</mo></math><br />Using P-T law, <math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>3</mn><mo>×</mo><mn>473</mn></mrow><mrow><mn>323</mn></mrow></mfrac><mo>=</mo><mn>4.39</mn></math> atm<br />and <math><mi mathvariant=\"normal\">n</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mo>×</mo><mn>2</mn></mrow><mrow><mn>0.0821</mn><mo>×</mo><mn>323</mn></mrow></mfrac><mo>=</mo><mn>0.226</mn></math><br />Now value is opened till the pressure is maintained at 1 atm.<br />Thus, at constant V and T, <math><mi mathvariant=\"normal\">P</mi><mo>∝</mo><mi mathvariant=\"normal\">n</mi></math><br />So <math><mn>4.39</mn><mo>∝</mo><mn>0.226</mn></math><br />So <math><mn>1</mn><mo>∝</mo><msub><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">t</mi></mrow></msub></math><br />So <math><mi mathvariant=\"normal\">n</mi><mo>=</mo><mfrac><mrow><mn>0.226</mn></mrow><mrow><mn>4.39</mn></mrow></mfrac><mo>=</mo><mn>0.052</mn></math><br />So moles escaped out <math><mo>=</mo><mn>0.226</mn><mo>-</mo><mn>0.052</mn><mo>=</mo><mn>0.174</mn></math><br />So fraction of moles escaped out <math><mo>=</mo><mfrac><mrow><mn>0.174</mn></mrow><mrow><mn>0.226</mn></mrow></mfrac><mo>=</mo><mn>0.77</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638cca0f8c616857e6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An air column closed in a tube sealed at one end by a <math><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">g</mi></math> column having height <math><mi mathvariant=\"normal\">h</mi></math> . When the tube is placed with open end down, the height of the air column is <math><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></math>. If the tube is turned so that its open end is at the top, the height of the air column is <math> <mrow> <msub> <mi>l</mi> <mn>2</mn> </msub> <mo>.</mo></mrow> </math> What is the atmospheric pressure <math><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>0</mn></mrow></msub></mrow></mfenced></math>-<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/75974_1a.JPG\" style=\"width: 463px; height: 290px;\" />", "image": null}, "options": [{"id": "2znxi", "text": "<math><msub>< ll, "isCorrect": false}], "correctValue": null, "solution": {"text": "At constant volume and definite mass <br/><math><mi mathvariant=\"normal\">P</mi><mo>∝</mo><mi mathvariant=\"normal\">T</mi></math>  <br/>Thus, the pressure and temperature both will increase in the sequence given below <br/><math><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>&lt;</mo><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>&lt;</mo><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863614dd7582edc3761", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The drain cleaner, Drainex contains small bits of aluminium which react with caustic soda to produce dihydrogen. What volume of dihydrogen in mL at <math><mn>20</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and one bar will be released when 0.15 g of aluminium reacts? (Take <math> <mrow> <mtext>1</mtext><mtext> </mtext><mtext>bar</mtext><mtext> </mtext><mtext>=</mtext><mtext> </mtext><mtext>0</mtext><mtext>.987</mtext><mtext> </mtext><mtext>atm</mtext></mrow> </math>)", "image": null}, "options": [], "correctValue": "203", "solution": {"text": "The reaction between aluminium and caustic soda is<br /><math><munder><mrow><mn>2</mn><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">l</mi></mrow><mrow><munder><mrow><mn>2</mn><mo>×</mo><mn>27</mn></mrow><mrow><mo>=</mo><mn>54</mn><mi mathvariant=\"normal\">g</mi></mrow></munder></mrow></munder><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi><mo>+</mo><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mo>→</mo><mn>2</mn><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">l</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><munder><mrow><mn>3</mn><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><munder><mrow><mn>3</mn><mo>×</mo><mn>22.4</mn><mi mathvariant=\"normal\">L</mi></mrow><mrow><mtext>atSTP</mtext></mrow></munder></mrow></munder></math><br />So 54 g of Al produces <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> at STP <math><mo>=</mo><mn>3</mn><mo>×</mo><mn>22.4</mn></math> L<br />0.15 g of Al will produce <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> at STP<br /><math><mo>=</mo><mfrac><mrow><mn>3</mn><mo>×</mo><mn>22.4</mn></mrow><mrow><mn>54</mn></mrow></mfrac><mo>×</mo><mn>0.15</mn></math><br /><math><mo>=</mo><mn>0.186</mn><mi mathvariant=\"normal\">L</mi></math><table border=\"1px solid\">\t<thead>\t\t<tr>\t\t\t<th>At STP</th>\t\t\t<th>Given Conditions</th>\t\t</tr>\t</thead>\t<tbody>\t\t<tr>\t\t\t<td><math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>1</mn></math> atm</td>\t\t\t<td><math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>1</mn></math> bar <math><mo>=</mo><mn>0.987</mn></math> atm</td>\t\t</tr>\t\t<tr>\t\t\t<td><math><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>0.186</mn></math> L</td>\t\t\t<td><math><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>?</mo></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>273</mn></math> K</td>\t\t\t<td><math><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>273</mn><mo>+</mo><mn>20</mn><mo>=</mo><mn>293</mn><mi mathvariant=\"normal\">K</mi></math></td>\t\t</tr>\t</tbody></table><br />Applying ideal gas equation, <math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><math><mfrac><mrow><mn>1</mn><mo>×</mo><mn>0.1867</mn></mrow><mrow><mn>273</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>0.987</mn><mo>×</mo><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>293</mn></mrow></mfrac></math><br /><math><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>293</mn></mrow><mrow><mn>0.987</mn></mrow></mfrac><mo>×</mo><mfrac><mrow><mn>1</mn><mo>×</mo><mn>0.1867</mn></mrow><mrow><mn>273</mn></mrow></mfrac></math><br /><math><mo>=</mo><mn>0.2030</mn></math> L <math><mo>=</mo><mn>203</mn></math> mL", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635cf2c2708d4b50e8", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas viousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p><math><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mn>3</mn><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>⟶</mo><mn>2</mn><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></math>&nbsp;</p>\r\r<p><math> <mn>1</mn> </math> mole <math><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mn>2</mn></mrow></msub></math> and <math> <mn>4</mn> </math> moles <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are taken in <math> <mrow> <mn>15</mn><mtext>L</mtext></mrow> </math> flask at <math><msup><mrow><mn>27</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\">C</mi></math>. After complete conversion of <math><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mn>2</mn></mrow></msub></math> into <math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></math>, <math> <mrow> <mn>5</mn><mtext>L</mtext></mrow> </math> of <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math> is added. Pressure set up in the flask is (assume water dissolves&nbsp;<math><mtext>N</mtext><msub><mrow><mtext>H</mtext></mrow><mrow><mn>3</mn></mrow></msub></math>)</p>\r", "image": null}, "options": [{"id": "T5hcF", "text": "<math><mfrac><mrow><mn>3</mn><mo>×</mo><mn>0.0821</mn><mo>×</mo><mn>300</mn></mrow><mrow><mn>15</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "u5gXg", "text": "<math><mfrac><mrow><mn>2</mn><mo>×</mo><mn>0.0821</mn><mo>×</mo><mn>300</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "gKcim", "text": "<math><mfrac><mrow><mn>1</mn><mo>×</mo><mn>0.0821</mn><mo>×</mo><mn>300</mn></mrow><mrow><mn>15</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "M74qh", "text": "<math><mfrac><mrow><mn>1</mn><mo>×</mo><mn>0.0821</mn><mo>×</mo><mn>300</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtable> <mtr> <mtd> </mtd> <mtd> <msub> <mtext>N</mtext> <mn>2</mn> </msub> </mtd> <mtd> <mo>+</mo> </mtd> <mtd> <mn>3</mn> <msub> <mtext>H</mtext> <mn>2</mn> </msub> </mtd> <mtd> <mo>⟶</mo> </mtd> <mtd> <mn>2</mn> <msub> <mtext>NH</mtext> <mn>3</mn> </msub> </mtd> </mtr> <mtr> <mtd> <mtext>Initial mole</mtext> </mtd> <mtd> <mn>1</mn> </mtd> <mtd> </mtd> <mtd> <mn>4</mn> </mtd> <mtd> </mtd> <mtd> <mn>0</mn> </mtd> </mtr> <mtr> <mtd> <mtext>Reacted mole</mtext> </mtd> <mtd> <mn>1</mn> </mtd> <mtd> </mtd> <mtd> <mn>3</mn> </mtd><mtd>&nbsp;</mtd></mtr><mtr> <mtd> <mtext>Left mole</mtext> </mtd> <mtd> <mn>0</mn> </mtd> <mtd> </mtd> <mtd> <mn>4-3=1</mn> </mtd> <mtd> </mtd> <mtd> <mn>2</mn> </mtd> </mtr></mtable></mrow></math><br /><br /><math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> left = 1 mol<br /><br /><math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></math> formed = 2 mol<br /><br />But <math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">&nbsp;</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">g</mi></mrow></mfenced></math> dissolves in water forming <math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>4</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></math> . Residual gas is only <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> which exerts pressure.<br /><br />Volume <math><mo>=</mo><mn>15</mn><mo>-</mo><mn>5</mn><mo>=</mo><mn>10</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">L</mi></math> (5L occupied by <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math> added)<br /><br /><math><mo>∴</mo><mi mathvariant=\"normal\">p</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mi mathvariant=\"normal\">V</mi></mrow></mfrac><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">T</mi><mo>=</mo><mfrac><mrow><mn>1</mn><mo>×</mo><mn>0.0821</mn><mo>×</mo><mn>300</mn></mrow><mrow><mn>10</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632a5aabb5876f14a5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A balloon has a volume 400 ml at <math><mn>0</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> . The balloon is distended to 4/5th of its maximum stretching capacity.<br />\r(i) Will burst if it is brought into a room at <math><mn>40</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> ?<br />\r(ii) What is the maximum temperature above which it will burst?", "image": null}, "options": [{"id": "YXPzT", "text": "Balloon will not burst at <math><mn>40</mn><mo>°</mo></math> C, balloon will burst above 40 <math><mo>°</mo></math> C", "image": null, "isCorrect": false}, {"id": "3sa3Z", "text": "Balloon will burst at <math><mn>40</mn><mo>°</mo></math> C, balloon will not burst above 68.25 <math><mo>°</mo></math> C", "image": null, "isCorrect": false}, {"id": "ttOd4", "text": "Balloon will not burst at <math><mn>40</mn><mo>°</mo></math> C, balloon will burst above 68.25 <math><mo>°</mo></math> C", "image": null, "isCorrect": true}, {"id": "rsq9D", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(i) Maximum stretching capacity <math><mo>=</mo><mn>400</mn><mo>×</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mn>500</mn></math> ml<br /><math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br />or <math><mfrac><mrow><mn>400</mn></mrow><mrow><mn>273</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>313</mn></mrow></mfrac></math><br /><math><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>458.61</mn></math> ml<br />If the volume becomes more than 500 ml it will burst. The volume is below 500 ml, hence it will not burst at 40 <math><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> .<br />(ii) <math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br />or <math><mfrac><mrow><mn>400</mn></mrow><mrow><mn>273</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>500</mn></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><math><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>341.25</mn></math> K = 68.25 <math><mo>°</mo><mi mathvariant=\"normal\">C</mi></math><br />The temperature at which the volume becomes 500 ml the balloon will burst. So balloon burst above 68.26 <math><mo>°</mo><mi mathvariant=\"normal\">C</mi></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86319360ac96a9630e4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An open vessel at <math> <mrow><msup><mn>27</mn><mn>o</mn> </msup></mrow><mtext>C</mtext></math> is heated until <math> <mrow> <mrow><msup> <mtext>3/8</mtext></mrow> <mrow> <mtext>th</mtext></mrow> </msup> </mrow> </math> of the air in it has been expelled. Assuming that the volume remains constant, calculate the temperature at which the vessel was heated", "image": null}, "options": [{"id": "1RCX1", "text": "<math> <mrow>  <msup>   <mrow>    <mtext>307</mtext></mrow>   <mtext>o</mtext>  </msup>  <mtext>&#x2004;</mtext><mtext>C</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "p3wLO", "text": "<math> <mrow>  <msup>   <mrow>    <mtext>107</mtext></mrow>   <mtext>o</mtext>  </msup>  <mtext>&#x2004;</mtext><mtext>C</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "izost", "text": "<math> <mrow>  <msup>   <mrow>    <mtext>480</mtext></mrow>   <mtext>o</mtext>  </msup>  <mtext>&#x2004;</mtext><mtext>C</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "7kzXE", "text": "<math> <mrow>  <msup>   <mrow>    <mtext>207</mtext></mrow>   <mtext>o</mtext>  </msup>  <mtext>&#x2004;</mtext><mtext>C</mtext></mrow></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "If <math><mfrac><mrow><msup><mrow><mn>3</mn></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">h</mi></mrow></msup></mrow><mrow><mn>8</mn></mrow></mfrac></math> of the air is expelled out then remaining air <math><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>8</mn></mrow></mfrac></math><br /><br />In the open vessel volume and pressure are both constant but moles are decreasing<br /><br /><math> <mrow> <mo>∴</mo><mtext> </mtext><msub> <mrow> <mtext>&nbsp;n</mtext></mrow> <mtext>1</mtext> </msub> <msub> <mtext>T</mtext> <mtext>1</mtext> </msub> <mtext> </mtext><mtext>=</mtext><mtext> </mtext><msub> <mtext>n</mtext> <mtext>2</mtext> </msub> <msub> <mtext>T</mtext> <mtext>2</mtext> </msub> </mrow> </math><br /><br /><math> <mrow> <mo>∴</mo><msub> <mrow> <mtext>&nbsp;n</mtext></mrow> <mtext>1</mtext> </msub> <mtext> </mtext><mtext>×</mtext><mtext> </mtext><mtext>300</mtext><mtext> </mtext><mtext>=</mtext><mfenced> <mrow> <mfrac> <mtext>5</mtext> <mtext>8</mtext> </mfrac> <msub> <mtext>n</mtext> <mtext>1</mtext> </msub> </mrow> </mfenced><msub> <mtext>T</mtext> <mtext>2</mtext> </msub> </mrow> </math><br /><br /><math> <mrow> <mo>∴</mo><mtext> </mtext><msub> <mtext>T</mtext> <mtext>2</mtext> </msub> <mtext> </mtext><mtext>=</mtext><mtext> </mtext><mfrac> <mtext>8</mtext> <mtext>5</mtext> </mfrac> <mtext> </mtext><mtext>×</mtext><mtext> </mtext><msub> <mtext>T</mtext> <mtext>1</mtext> </msub> <mtext> </mtext><mtext>=</mtext><mtext> </mtext><mfrac> <mtext>8</mtext> <mtext>5</mtext> </mfrac> <mtext> </mtext><mtext>×</mtext><mtext> </mtext><mtext>300</mtext><mtext> </mtext><mtext>=</mtext><mtext> </mtext><mtext>480</mtext><mtext> </mtext><mtext>K</mtext></mrow> </math><br /><br /><math> <mrow> <mo>=</mo><mn>480</mn><mo>−</mo><mn>273</mn><mo>=</mo><msup> <mrow> <mtext>207</mtext></mrow> <mtext>o</mtext> </msup> <mtext>C</mtext></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86317602f1de58254b3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "99", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A sample of hydrogen gas was collected over water at <math><mn>21</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> and 685 mm Hg. The volume of the container was 7.80 L. Calculate the mass of <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>(</mo><mi mathvariant=\"normal\">g</mi><mo>)</mo></math> collected (vapour pressure of water = 18.6 mm Hg at <math><mn>21</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math> )", "image": null}, "options": [{"id": "MPqCD", "text": "0.283 g", "image": null, "isCorrect": false}, {"id": "3onia", "text": "0.570 g", "image": null, "isCorrect": true}, {"id": "sdsin", "text": "0.589 g", "image": null, "isCorrect": false}, {"id": "rhfn4", "text": "7.14 g", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The volume of <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> at STP<br /><math><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>×</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br />Here vapour pressure of <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> at <math><mn>21</mn><mo>°</mo><mi mathvariant=\"normal\">C</mi></math><br />= 685 mm – 18.6 mm = 666.4 mm<br />So <math> <mrow> <msub> <mtext>V</mtext> <mn>2</mn> </msub> <mo>=</mo><mfrac> <mrow> <mn>666.4</mn><mtext> </mtext><mtext>mm</mtext><mtext> </mtext><mtext>Hg</mtext><mtext> </mtext><mo>×</mo><mtext> </mtext><mtext>7</mtext><mtext>.80</mtext><mtext> </mtext><mtext>L</mtext><mtext> </mtext><mo>×</mo><mtext> </mtext><mtext>273</mtext><mtext> </mtext><mtext>K</mtext></mrow> <mrow> <mn>294</mn><mtext> </mtext><mtext>K</mtext><mtext> </mtext><mo>×</mo><mtext> </mtext><mtext>760</mtext><mtext> </mtext><mtext>mm</mtext></mrow> </mfrac> <mo>=</mo><mn>6.38</mn><mtext> </mtext><mtext>L</mtext></mrow> </math><br />At STP <math> <mrow> <mtext>22</mtext><mtext>.4</mtext><mtext> </mtext><mtext>L</mtext><mtext> </mtext><msub> <mtext>H</mtext> <mtext>2</mtext> </msub> <mtext> </mtext><mtext>weight</mtext><mtext> </mtext><mtext>=</mtext><mtext> </mtext><mtext>2</mtext><mtext> </mtext><mtext>g</mtext></mrow> </math><br />So, at STP <math> <mrow>  <mtext>6</mtext><mtext>.38</mtext><mtext>&#x2004;</mtext><mtext>L</mtext><mtext>&#x2004;</mtext><msub>   <mtext>H</mtext>   <mtext>2</mtext>  </msub>  <mtext>&#x2004;</mtext><mtext>weigh</mtext><mtext>&#x2004;</mtext><mtext>=</mtext><mtext>&#x2004;</mtext><mfrac>   <mrow>    <mtext>2</mtext><mtext>&#x2004;</mtext><mtext>g</mtext><mtext>&#x2004;</mtext><mtext>&#x00D7;</mtext><mtext>&#x2004;</mtext><mtext>6</mtext><mtext>.38</mtext><mtext>&#x2004;</mtext><mtext>L</mtext></mrow>   <mrow>    <mtext>22</mtext><mtext>.4</mtext><mtext>&#x2004;</mtext><mtext>L</mtext></mrow>  </mfrac>  <mtext>&#x2004;</mtext><mtext>=</mtext><mtext>&#x2004;</mtext><mtext>0</mtext><mtext>.570</mtext><mtext>&#x2004;</mtext><mtext>g</mtext></mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86313a6483d19d46b98", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "09", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "For a given one mole of ideal gas kept at <math><mn>6.5</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">m</mi></math> in a container of capacity <math><mn>2.463</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">L</mi></math>, the Avogadro proportionality constant for the hypothesis is (see figure)<br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image3-846d7a5c-5a89-4d75-b7a5-faf6ea7c14eb.jpg\" />", "image": null}, "options": [{"id": "VPjHY", "text": "<math><mn>0.406</mn></math>", "image": null, "isCorrect": false}, {"id": "lNNov", "text": "<math><mn>2.46</mn></math>", "image": null, "isCorrect": true}, {"id": "ngjJm", "text": "<math><mn>22.4</mn></math>", "image": null, "isCorrect": false}, {"id": "1IBSW", "text": "none of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to Avogadro hypothesis<br /><br /><math><mi mathvariant=\"normal\">V</mi><mo>∝</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">n</mi></math><br /><br /><math><mi mathvariant=\"normal\">V</mi><mo>=</mo><mi mathvariant=\"normal\">n</mi><mfrac><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">T</mi></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">P</mi></mrow></mfrac></math><br /><br /><math><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">P</mi></mrow></mfrac></math><br /><br />Using PV = nRT<br /><br /><math> <mrow> <mo>∴</mo><mtext>&nbsp;&nbsp;</mtext><mfrac> <mrow> <mtext>R</mtext><mtext>T</mtext> </mrow> <mtext>P</mtext> </mfrac> <mo>=</mo><mfrac> <mtext>V</mtext> <mtext>n</mtext> </mfrac> <mtext>=</mtext><mfrac> <mrow> <mn>2.463</mn> </mrow> <mn>1</mn> </mfrac> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863023776ca8836efda", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Nitrogen gas is kept in an open beaker at 273 K and 1 atm pressure. If the pressure of the surrounding suddenly falls to 0.5 atm and the temperature increases to 546 K, then the percentage of niitrogen remaining in the beaker is mn % of the initial amount. Then the value of m+n is:", "image": null}, "options": [], "correctValue": "7.00", "solution": {"text": "Let the initial number of moles of nitrogen gas in the beaker <math><mo>=</mo><msub><mrow><mtext mathvariant=\"\\&quot;normal\\&quot;\">n</mtext></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br />Now, total volume of gas in the beaker will remain constant.<br />Then, <math><mtext></mtext><mtext mathvariant=\"\\&quot;normal\\&quot;\">n</mtext><mo>∝</mo><mfrac><mrow><mtext mathvariant=\"\\&quot;normal\\&quot;\">P</mtext></mrow><mrow><mtext mathvariant=\"\\&quot;normal\\&quot;\">T</mtext></mrow></mfrac></math><br /><br />Therefore,<br /><br /><math><mo> ⇒</mo><mfrac><mrow><msub><mrow><mtext>n</mtext></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mtext>n</mtext></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mtext mathvariant=\"\\&quot;normal\\&quot;\">P</mtext></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mtext mathvariant=\"\\&quot;normal\\&quot;\">P</mtext></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>×</mo><mfrac><mrow><msub><mrow><mtext mathvariant=\"\\&quot;normal\\&quot;\">T</mtext></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mtext mathvariant=\"\\&quot;normal\\&quot;\">T</mtext></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></math><br /><br /><math><mo> ⇒</mo><mfrac><mrow><msub><mrow><mtext>n</mtext></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><msub><mrow><mtext>n</mtext></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>0.5</mn></mrow></mfrac><mo>×</mo><mfrac><mrow><mn>546</mn></mrow><mrow><mn>273</mn></mrow></mfrac><mo>=</mo><mn>4</mn></math><br /><br />Since, the final moles of nitrogen in the beaker is one-fourth of the initial amount in <math><mtext></mtext><mn>25</mn></math> % of the initial amount.<br />Therefore, <math><mtext mathvariant=\"\\&quot;normal\\&quot;\">m</mtext><mo>=</mo><mn>2</mn><mo>,</mo><mtext mathvariant=\"\\&quot;normal\\&quot;\"></mtext><mtext mathvariant=\"\\&quot;normal\\&quot;\">n</mtext><mo>=</mo><mn>5</mn></math> and <math><mtext mathvariant=\"\\&quot;normal\\&quot;\">m</mtext><mo>+</mo><mtext mathvariant=\"\\&quot;normal\\&quot;\">n</mtext><mo>=</mo><mn>7</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863021e3733766ff317", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An open manometer attached to a flask containing ammonia gas have no difference in mercury level initially as shown in diagram. After sparking into the flask, ammonia is partially dissociated as <math> <mrow> <mn>2</mn> <msub> <mtext>NH</mtext> <mn>3</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>g</mtext> </mrow> </mfenced> <mo>⟶</mo> <msub> <mtext>N</mtext> <mn>2</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>g</mtext> </mrow> </mfenced> <mo>+</mo> <mn>3</mn> <msub> <mtext>H</mtext> <mn>2</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>g</mtext> </mrow> </mfenced> </mrow> </math>. Now it have difference of <math> <mrow> <mtext>18</mtext><mtext> </mtext><mtext>cm</mtext></mrow> </math> in mercury level in two columns, what is partial pressure of <math> <mrow> <msub> <mtext>H</mtext> <mtext>2</mtext> </msub> <mfenced> <mtext>g</mtext> </mfenced></mrow> </math> at equilibrium ?<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0021971_Quest_1_1.jpg\" style=\"width: 253px; height: 150px;\" />", "image": null}, "options": [{"id": "mN9CW", "text": "<math> <mrow> <mtext>9</mtext><mtext> </mtext><mtext>cm</mtext></mrow> </math> of <math> <mrow> <mtext>Hg</mtext></mrow> </math>", "image": null, "isCorrect": false}, {"id": "zpvFN", "text": "<math> <mrow> <mtext>18&nbsp;cm</mtext></mrow> </math> of <math> <mrow> <mtext>Hg</mtext></mrow> </math>", "image": null, "isCorrect": false}, {"id": "a5kYo", "text": "<math> <mrow> <mtext>27</mtext><mtext> </mtext><mtext>cm</mtext></mrow> </math> of <math> <mrow> <mtext>Hg</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "3PYKG", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtable> <mtr> <mtd> <mn>2</mn> <msub> <mtext>NH</mtext> <mn>3</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>g</mtext> </mrow> </mfenced> </mtd> <mtd> <mo>⟶</mo> </mtd> <mtd> <msub> <mtext>N</mtext> <mn>2</mn> </msub> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>g</mtext> </mrow> </mfenced> </mtd> <mtd> <mo>+</mo> </mtd> <mtd> <mn>3</mn> <msub> <mtext>H</mtext> <mn>2</mn> </msub> </mtd> </mtr> <mtr> <mtd> <mn>7</mn> <mn>6</mn> <mo>-</mo> <mn>2</mn> <mtext>x</mtext> </mtd> <mtd> </mtd> <mtd> <mtext>x</mtext> </mtd> <mtd> </mtd> <mtd> <mn>3</mn> <mtext>x</mtext> </mtd> </mtr> </mtable> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mn>7</mn> <mn>6</mn> <mo>+</mo> <mn>2</mn> <mtext>x</mtext> <mo>=</mo> <mn>7</mn> <mn>6</mn> <mo>+</mo> <mn>1</mn> <mn>8</mn> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mn>2</mn> <mtext>x</mtext> <mo>=</mo> <mn>1</mn> <mn>8</mn> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mo> <mtext>x</mtext> <mo>=</mo> <mn>9</mn> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</mo> <msub> <mtext>p</mtext> <msub> <mtext>H</mtext> <mn>2</mn> </msub> </msub> <mo>=</mo> <mn>3</mn> <mo>×</mo> <mn>9</mn> </mrow> </math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<math> <mrow> <mo>=</mo> <mtext>&nbsp;27 cm of Hg</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863000d99cfca36d52c", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "92", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A spherical balloon of 21 cm diameter is to be filled up with <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> at NTP from cylinder containing the gas at 20 atm at <math><msup><mrow><mn>27</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\">C</mi><mo>.</mo></math> The cylinder can hold <math><mn>2.82&nbsp;</mn><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi></math> of water a NTP. Calculate the number of balloons that can be filled up.", "image": null}, "options": [], "correctValue": "10", "solution": {"text": "Volume of one balloon (to be filled)<br /><math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced><mi mathvariant=\"normal\">π</mi><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced><mo>×</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>22</mn></mrow><mrow><mn>7</mn></mrow></mfrac></mrow></mfenced><mo>×</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>21</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup></math><br /><math> <mrow> <mtext>=</mtext><mtext> </mtext><mtext>4851</mtext><mtext> </mtext><mtext>mL</mtext><mtext> </mtext><mtext>=</mtext><mtext> </mtext><mtext>4</mtext><mtext>.851</mtext><mtext> </mtext><mtext>litre</mtext></mrow> </math><br />Let <math><mi mathvariant=\"normal\">‘</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">’</mi></math> balloons are filled, then total volume of <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> used in filling balloons <math><mo>=</mo><mn>4.851</mn><mo>×</mo><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi></math><br />The cylinder of <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> used in filling balloons will also have <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> in it, after n balloons are filled. Also volume of cylinder <math> <mrow> <mtext>=</mtext><mtext> </mtext><mtext>2</mtext><mtext>.82</mtext><mtext> </mtext><mtext>litre</mtext></mrow> </math><br />Hence Total volume of <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> at NTP = volume of <math><mi mathvariant=\"normal\">'</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">'</mi></math> balloons + volume of cylinder<br /><math><mo>=</mo><mn>4.851</mn><mo>×</mo><mi mathvariant=\"normal\">n</mi><mo>+</mo><mn>2.82</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi></math> ….(i)<br />The volume of available <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> at NTP can be derived by the data<br />Given <math> <mrow> <mtext>P</mtext><mtext> </mtext><mtext>=</mtext><mtext> </mtext><mtext>1</mtext><mtext> </mtext><mtext>atm,</mtext><mtext> </mtext><mtext>V</mtext><mtext> </mtext><mtext>=</mtext><mtext> </mtext><mtext>?,</mtext><mtext> </mtext><mtext>T</mtext><mtext> </mtext><mtext>=</mtext><mtext> </mtext><mtext>273</mtext><mtext> </mtext><mtext>K</mtext></mrow> </math><br />and <math> <mrow> <mtext>P</mtext><mtext> </mtext><mtext>=</mtext><mtext> </mtext><mtext>
