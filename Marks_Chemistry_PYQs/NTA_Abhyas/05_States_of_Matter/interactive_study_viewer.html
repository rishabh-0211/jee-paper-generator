</mi><mo>/</mo><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">T</mi><mo>&gt;</mo><mn>1</mn><mo>.</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86326fe1aa50d694c13", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "For one mole of a van der Waals when b = 0 and T = 300 K, the PV vs. 1/V plot is shown below. The value of the van der Waals constant a (atm litre<sup>2</sup> mol<sup>-2</sup>) is:<br />\r<br />\r<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0028348_Question_1.jpg\" style=\"width: 223px; height: 222px;\" /></strong></u>", "image": null}, "options": [{"id": "JVsfH", "text": "1.0", "image": null, "isCorrect": false}, {"id": "LtlTa", "text": "4.5", "image": null, "isCorrect": false}, {"id": "0GJIG", "text": "1.5", "image": null, "isCorrect": true}, {"id": "CCjYB", "text": "3.0", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0028348_AnsExp_1.jpg\" style=\"width: 221px; height: 216px;\" /></strong></u><br /><br />van der Waals equation for 1 mol of real gas is<br /><br /><math> <mrow> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>P</mtext> <mo>+</mo> <mfrac> <mrow> <mtext>a</mtext> </mrow> <mrow> <msup> <mtext>V</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </mfenced> <mfenced close=\"]\" open=\"[\" separators=\",\"> <mrow> <mtext>V</mtext> <mo>-</mo> <mtext>b</mtext> </mrow> </mfenced> <mo>=</mo> <mtext>RT</mtext> </mrow> </math><br /><br />Given that b = 0<br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>P</mtext> <mo>+</mo> <mfrac> <mrow> <mtext>a</mtext> </mrow> <mrow> <msup> <mtext>V</mtext> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </mfenced> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>V</mtext> </mrow> </mfenced> <mo>=</mo> <mtext>RT</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;</mo> <mtext>PV</mtext> <mo>=</mo> <mtext>RT</mtext> <mo>-</mo> <mfrac> <mrow> <mtext>a</mtext> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> </mrow> </math>&nbsp; &nbsp;&nbsp; ........ (i)<br /><br />Following y = mx + c for the curve <math> <mrow> <mtext>PV vs&nbsp;</mtext> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mtext>V</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mtext>Slope</mtext> <mo>=</mo> <mo>-</mo> <mtext>a</mtext> </mrow> </math><br /><br /><math> <mrow> <mtext>Slope</mtext> <mo>=</mo> <mfrac> <mrow> <mtext>21.6</mtext> <mo>-</mo> <mtext>20.1</mtext> </mrow> <mrow> <mn>2</mn> <mo>-</mo> <mn>3</mn> </mrow> </mfrac> <mo>=</mo> <mo>-</mo> <mtext>1.5</mtext> </mrow> </math><br /><br /><math> <mrow> <mo>∴&nbsp;&nbsp;</mo> <mtext>a</mtext> <mo>=</mo> <mtext>1.5</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863224f13a74d1ff487", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The van der Waals equation for one mole of a real gas can be written as <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">&nbsp;</mi><mo>–</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">b</mi></mrow></mfenced><mo>=</mo><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">T</mi></math> . For the gases <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math> , <math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></math> , and <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>4</mn></mrow></msub></math> , the value of 'a' <math><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">&nbsp;</mi><msup><mrow><mi mathvariant=\"normal\">L</mi></mrow><mrow><mo>–</mo><mn>2</mn></mrow></msup><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">o</mi><msup><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mo>–</mo><mn>2</mn></mrow></msup></math> are 0.2453, 4.170 and 2.253 respectively.<br />\rWhich of the following can be inferred from the 'a' values?", "image": null}, "options": [{"id": "4vU52", "text": "<math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></math>  can be most easily liquified", "image": null, "isCorrect": true}, {"id": "GOdSY", "text": "<math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math>  can be most easily liquified", "image": null, "isCorrect": false}, {"id": "uv6YF", "text": "value of 'a' for  <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>4</mn></mrow></msub></math>  is less than that of  <math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></math>  because it has the lower molar mass", "image": null, "isCorrect": false}, {"id": "4ZaSb", "text": "intermolecular forces are the strongest in hydrogen", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Van der Wall's constant 'a' gives information about force of attraction between gaseous molecules. Higher the value of 'a' higher will be force of attraction, and easier the liquefaction of gas. Order of intermolecular force of attraction =  <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86306d3de2bf83d1957", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "49", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "One mole of a monoatomic real gas satisfies the equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi><mfenced><mrow><mi mathvariant=\"normal\">V</mi><mo>−</mo><mi mathvariant=\"normal\">b</mi></mrow></mfenced><mo>=</mo><mi>RT</mi></math> where b is a constant. The relationship of interatomic potential <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">V</mi><mo>(</mo><mi mathvariant=\"normal\">r</mi><mo>)</mo></math> and interatomic distance r for the gas is given by", "image": null}, "options": [{"id": "VtbWF", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ayepijtzsdrmuyusfwobolhbphsubanlqwkufvigpktdpbvfkh.png\" style=\"height: 154px; width: 170px;\" />", "image": null, "isCorrect": false}, {"id": "JA7JE", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/anbhdzmjhrdggiewrgbmwxgiqahsgavincsetwfxswtopiicwo.png\" style=\"height: 136px; width: 170px;\" />", "image": null, "isCorrect": false}, {"id": "mNIS9", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/xtlcxqbouhhozdfbizgujoawfkgpwxlkpeiekctrjtdmrxawtd.png\" style=\"height: 152px; width: 170px;\" />", "image": null, "isCorrect": true}, {"id": "65IIa", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/dnjmtdgvmoazrxdartvgwgtwzncmdwiwxqyufqldniwwbqonap.png\" style=\"height: 171px; width: 170px;\" />", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here the given equation is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mo>(</mo><mi mathvariant=\"normal\">V</mi><mo>-</mo><mi mathvariant=\"normal\">b</mi><mo>)</mo><mo>=</mo><mi>RT</mi></math>.<br />On comparing with van der Waals' equation<br /><math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">P</mi><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>[</mo><mi mathvariant=\"normal\">V</mi><mo>-</mo><mi mathvariant=\"normal\">b</mi><mo>]</mo><mo>=</mo><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">T</mi></math><br />That is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">a</mi><mo>=</mo><mn>0</mn></math>.<br />It means only repulsive forces are present which are contributive only at very close distance so the potential energy will increase abruptly. i.e., graph C is correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "6aa3ab79aa8dc1ff68177f16", "title": "Critical Phenomena and Liquefaction", "totalQuestions": 6, "questions": [{"_id": "6151e863da164704e0e0cd95", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> gas is liquefied at <math><msup><mrow><mn>27</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\">C</mi></math> . Gas follows the following graph during liquefaction for 1 mole of <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> .<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/635177_1.JPG\" style=\"width: 276px; height: 216px;\" /><br />\rThen which statement is (are) correct in gaseous phase will<br />\r(i) The maximum density of gas is 0.1 gm/ml<br />\r(ii) The density of liquid <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is 1 g/ml at 60 atm.<br />\r(iii) At point C 50% of <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is liquefied.<br />\r(iv) The compressibility factor of gas at <math><msup><mrow><mn>27</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mi mathvariant=\"normal\">C</mi></math> is always less than 1.<br />\rWhich of the above is/are correct", "image": null}, "options": [{"id": "KLNAb", "text": "only i", "image": null, "isCorrect": false}, {"id": "4UAe6", "text": "i and ii", "image": null, "isCorrect": false}, {"id": "BWHzu", "text": "i,ii and iii", "image": null, "isCorrect": true}, {"id": "wnSAb", "text": "all", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced></math> Maximum density of <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> in gaseous phase will be at point 'A'<br />Now: <math><mi mathvariant=\"normal\">d</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">M</mi></mrow><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">T</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>60</mn><mo>×</mo><mn>44</mn></mrow><mrow><mi mathvariant=\"normal\">R</mi><mo>×</mo><mn>300</mn></mrow></mfrac><mo>=</mo><mn>107</mn><mi mathvariant=\"normal\">&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">m</mi></mrow><mo>/</mo><mrow><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">t</mi></mrow></mrow><mo>=</mo><mn>0.107</mn><mi mathvariant=\"normal\">&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">m</mi></mrow><mo>/</mo><mrow><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">c</mi></mrow></mrow></math><br />Or <math><mi mathvariant=\"normal\">d</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">s</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>44</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>440</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">c</mi></mrow></mfrac><mo>=</mo><mn>0.1</mn></math><br /><math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">B</mi></mrow></mfenced></math> Density of liquid <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> at 60 atm (at point B)<br />At point B there will be only liquid <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> . So we can find out the density of density of liquid <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> only at point B.<br /><math> <mrow>  <mtext>d</mtext><mo>=</mo><mfrac>   <mtext>M</mtext>   <mtext>V</mtext>  </mfrac>  <mo>=</mo><mfrac>   <mrow>    <mn>44</mn></mrow>   <mrow>    <mn>0.044</mn></mrow>  </mfrac>  <mo>=</mo><mn>1</mn><mtext>&#x00A0;gm/cc</mtext></mrow></math><br /><math><mfenced separators=\"|\"><mrow><mi mathva ow></mfenced><mi mathvariant=\"normal\">θ</mi></math> <br/><br/>Hence substituting in the van der Waal's equation<br/><br/> <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">P</mi><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">V</mi><mo>-</mo><mi mathvariant=\"normal\">b</mi></mrow></mfenced><mo>=</mo><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">T</mi></math> <br/><br/> <math><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">π</mi><mo>+</mo><mfrac><mrow><mn>3</mn></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">ϕ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>3</mn><mi mathvariant=\"normal\">ϕ</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>8</mn><mi mathvariant=\"normal\">θ</mi></math> <br/><br/>This is reduced state equation<br/><br/> <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">π</mi><mo>+</mo><mfrac><mrow><mn>3</mn></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">ϕ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn><mi mathvariant=\"normal\">ϕ</mi></mrow><mrow><mn>8</mn><mi mathvariant=\"normal\">θ</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>8</mn><mi mathvariant=\"normal\">θ</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>1</mn></math> <br/><br/> <math><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">π</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">ϕ</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>3</mn><mi mathvariant=\"normal\">ϕ</mi><mo>-</mo><mn>1</mn></mrow></m mal\">m</mi><mi mathvariant=\"normal\">o</mi><msup><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mo>–</mo><mn>2</mn></mrow></msup></math> are 0.2453, 4.170 and 2.253 respectively.<br />\rWhich of the following can be inferred from the 'a' values?", "image": null}, "options": [{"id": "4vU52", "text": "<math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></math>  can be most easily liquified", "image": null, "isCorrect": true}, {"id": "GOdSY", "text": "<math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></math>  can be most easily liquified", "image": null, "isCorrect": false}, {"id": "uv6YF", "text": "value of 'a' for  <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>4</mn></mrow></msub></math>  is less than that of  <math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></math>  because it has the lower molar mass", "image": null, "isCorrect": false}, {"id": "4ZaSb", "text": "intermolecular forces are the strongest in hydrogen", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Van der Wall's constant 'a' gives information about force of attraction between gaseous molecules. Higher the value of 'a' higher will be force of attraction, and easier the liquefaction of gas. Order of intermolecular force of attraction =  <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStruc </msub><mtext>O</mtext><mtext>S</mtext><msubsup><mrow><mtext>O</mtext></mrow><mrow><mn>3</mn></mrow><mrow><mo>-</mo></mrow></msubsup><mtext>N</mtext><msup><mrow><mtext>a</mtext></mrow><mrow><mo>+</mo></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "4OW8N", "text": "I.III.<math ><mtext>C</mtext><msub><mrow><mtext>H</mtext></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mfenced separators=\"|\"><mrow><mtext>C</mtext><msub><mrow><mtext>H</mtext></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>11</mn></mrow></msub><mtext>O</mtext><mtext>S</mtext><msubsup><mrow><mtext>O</mtext></mrow><mrow><mn>3</mn></mrow><mrow><mo>-</mo></mrow></msubsup><mtext>N</mtext><msup><mrow><mtext>a</mtext></mrow><mrow><mo>+</mo></mrow></msup></math> ;<br />II.<math><mtext>C</mtext><msub><mrow><mtext>H</mtext></mrow><mrow><mn>3</mn></mrow></msub><mtext>OH</mtext></math> ;<br />III.<math> <mrow>  <mtext>KCl</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "hTQhG", "text": "I. <math> <mrow> <mtext>KCl</mtext></mrow> </math> ;<br />II.<math><mtext>C</mtext><msub><mrow><mtext>H</mtext></mrow><mrow><mn>3</mn></mrow></msub><mo>(</mo><mtext>C</mtext><msub><mrow><mtext>H</mtext></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mo>)</mo></mrow><mrow><mtext>11</mtext></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">S</mi><msubsup><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow><mrow><mo>-</mo></mrow></msubsup><mi mathvariant=\"normal\">N</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mo>+</mo></mrow></msup></math> ;<br />III.<math><mtext>C</mtext><msub><mrow><mtext>H</mtext></mrow><mrow><mn>3</mn></mrow></msub><mtext>OH</mtext></math>", "image": null, "isCorrect": false}, {"id": "KtNGw", "text": "I.<math><mtext>C</mtext><msub><mrow><mtext>H</mtext></mrow><mrow><mn>3</mn></mrow></msub><mtext>OH</mtext></math> ;<br />II.<math> <mrow> <mtext>KCl</mtext></mrow> </math> ;<br />III.<math ><mtext>C</mtext><msub><mrow><mtext>H</mtext></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mfenced separators=\"|\"><mrow><mtext>C</mtext><msub><mrow><mtext>H</mtext></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>11</mn></mrow></msub><mtext>O</mtext><mtext>S</mtext><msubsup><mrow><mtext>O</mtext></mrow><mrow><mn>3</mn></mrow><mrow><mo>-</mo></mrow></msubsup><mtext>N</mtext><msup><mrow><mtext>a</mtext></mrow><mrow><mo>+</mo></mrow></msup></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Impurities affect surface tension appreciably. It is observed that impurities which tend to concentrate on surface of liquids, compared to its bulk lower the surface tension.<br /><br />Substances like detergents and soaps <math> <mfenced close=\"]\" open=\"[\"> <mrow> <msub> <mrow> <mtext>CH</mtext></mrow> <mn>3</mn> </msub> <msub> <mrow> <mfenced> <mrow> <msub> <mrow> <mtext>CH</mtext></mrow> <mn>2</mn> </msub> </mrow> </mfenced></mrow> <mrow> <mn>11</mn></mrow> </msub> <msubsup> <mrow> <mtext>SO</mtext></mrow> <mn>3</mn> <mo>−</mo> </msubsup> <msup> <mrow> <mtext>Na</mtext></mrow> <mo>+</mo> </msup> </mrow> </mfenced> </math> decrease the surface tension sharply.<br /><br />Those like alcohol (eg. <math><mtext>C</mtext><msub><mrow><mtext>H</mtext></mrow><mrow><mn>3</mn></mrow></msub><mtext>OH</mtext><mo>,</mo><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>5</mn></mrow></msub><mtext>OH</mtext></math> ) lower the surface tension slightly.<br /><br />Inorganic impurities present in bulk of a liquid such as <math> <mrow> <mtext>KCl</mtext></mrow> </math> tend to increase the surface tension of water.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
