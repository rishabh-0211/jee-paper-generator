mrow></msub><msub><mrow><mi mathvariant=\"normal\">Z</mi></mrow><mrow><mn>8</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "ZdgTD", "text": "<math><msub><mrow><mi mathvariant=\"normal\">X</mi></mrow><mrow><mn>8</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">Y</mi></mrow><mrow><mn>4</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">Z</mi></mrow><mrow><mn>5</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "dNrqw", "text": "<math><msub><mrow><mi mathvariant=\"normal\">X</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">Y</mi><msub><mrow><mi mathvariant=\"normal\">Z</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "nQeDI", "text": "<math><mi mathvariant=\"normal\">X</mi><mi mathvariant=\"normal\">Y</mi><msub><mrow><mi mathvariant=\"normal\">Z</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/asdfaksdbjfqreg243.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 174px;\" /><br />Number of X-atoms in unit cell = 4<br />Number of Y-atoms = 4<br />Number of Z atoms = 8<br />If atoms along one body diagonal are removed then 2 from corners X, 1 from body center Y and 2 neat two corners Z atoms will be absent.<br />Effective number of atoms may be calculated as<br /><math><mi mathvariant=\"normal\">X</mi><mo>=</mo><mn>4</mn><mo>-</mo><mn>2</mn><mo>×</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>15</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><math><mi mathvariant=\"normal\">Y</mi><mo>=</mo><mn>4</mn><mo>-</mo><mn>1</mn><mo>=</mo><mn>3</mn></math><br /><math><mi mathvariant=\"normal\">Z</mi><mo>=</mo><mn>8</mn><mo>-</mo><mn>2</mn><mo>=</mo><mn>6</mn></math><br />Simplex ratio <math><mo>=</mo><mi mathvariant=\"normal\">X</mi><mo>:</mo><mi mathvariant=\"normal\">Y</mi><mo>:</mo><mi mathvariant=\"normal\">Z</mi></math><br /><math><mo>=</mo><mfrac><mrow><mn>15</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>:</mo><mn>3</mn><mo>:</mo><mn>6</mn></math><br /><math><mo>=</mo><mn>5</mn><mo>:</mo><mn>4</mn><mo>:</mo><mn>8</mn></math><br />Simplest formula <math><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">X</mi></mrow><mrow><mn>5</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">Y</mi></mrow><mrow><mn>4</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">Z</mi></mrow><mrow><mn>8</mn></mrow></msub></math> .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863faa9378ce174f809", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of unit cells present in <math> <mrow> <mtext>39</mtext><mtext> </mtext><mtext>g</mtext></mrow> </math> of potassium if it crystallizes as body centred cube is (<math> <mrow> <mtext>N</mtext><mtext> </mtext><mtext>=</mtext></mrow> </math> Avogadro number, At. Wt. of potassium = <math> <mrow> <mtext>39</mtext><mtext> </mtext><mtext>g/mol</mtext></mrow> </math> )", "image": null}, "options": [{"id": "CaqTH", "text": "<math> <mrow>  <mfrac>   <mtext>N</mtext>   <mtext>4</mtext>  </mfrac>  </mrow></math>", "image": null, "isCorrect": false}, {"id": "7taCw", "text": "<math> <mrow>  <mfrac>   <mtext>N</mtext>   <mtext>2</mtext>  </mfrac>  </mrow></math>", "image": null, "isCorrect": true}, {"id": "SWpc3", "text": "<math> <mrow>  <mfrac>   <mtext>N</mtext>   <mtext>3</mtext>  </mfrac>  </mrow></math>", "image": null, "isCorrect th><mn>2.44</mn><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">c</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math>. The type of defect introduced during the recrystalization may be", "image": null}, "options": [{"id": "5rPhs", "text": "additional <math><msup><mrow><mi mathvariant=\"normal\">M</mi></mrow><mrow><mo>+</mo></mrow></msup></math> and <math><msup><mrow><mi mathvariant=\"normal\">X</mi></mrow><mrow><mo>-</mo></mrow></msup></math> ions at interstitial sites", "image": null, "isCorrect": false}, {"id": "E6tO8", "text": "Schottky defect", "image": null, "isCorrect": true}, {"id": "JqDwE", "text": "F-centre", "image": null, "isCorrect": false}, {"id": "UjXDO", "text": "Frenkel defect", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Calculated density <math><mi mathvariant=\"normal\">d</mi><mo>=</mo><mi mathvariant=\"normal\">Z</mi><mo>×</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mi mathvariant=\"normal\">a</mi></mrow></msub><mo>×</mo><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi></mrow></mfrac><mo>=</mo><mn>2.78</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">c</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math><br />Is greater then actual density <math><mn>2.44</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">c</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math> therefore density decreases and defect is Schottky defect", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f0f87e1b1ec496fa", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "68", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The efficiency of packing in the case of a metal crystal for face-centered cubic is", "image": null}, "options": [], "correctValue": "74", "solution": {"text": "In face centred cubic, packing efficiency<br /><br /><math> <mrow> <mo>=</mo> <mfrac> <mrow> <mtext>Volume occupied by 4 atoms in the unit cell</mtext> <mo>×</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> </mrow> <mrow> <mtext>Volume of the unit cell</mtext> </mrow> </mfrac> </mrow> </math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>4</mn><mo>×</mo><mfenced><mrow><mn>4</mn><mo>/</mo><mn>3</mn></mrow></mfenced><mi>πr</mi><msup><mo>⁡</mo><mn>3</mn></msup><mo>×</mo><mn>100</mn></mrow><msup><mfenced><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">r</mi><mo>⁡</mo></mrow></mfenced><mn>3</mn></msup></mfrac><mo>=</mo><mfrac><mrow><mfenced><mrow><mn>16</mn><mo>/</mo><mn>3</mn></mrow></mfenced><mi>πr</mi><msup><mo>⁡</mo><mn>3</mn></msup><mo>×</mo><mn>100</mn></mrow><mrow><mn>16</mn><msqrt><mn>2</mn></msqrt><mi mathvariant=\"normal\">r</mi><msup><mo>⁡</mo><mn>3</mn></msup></mrow></mfrac><mo>=</mo><mn>74</mn><mtext>%</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863eeb6d64ab6855337", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "37", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of unit cells in <math> <mrow> <mtext>58</mtext><mtext>.5</mtext><mtext> </mtext><mtext>g</mtext></mrow> </math> of <math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi></math> is approximately", "image": null}, "options": [{"id": "aNi0U", "text": "<math><mn>6</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>20</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "hmblY", "text": "<math><mn>1.5</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>23</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "RsgwS", "text": "<math><mn>6</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>23</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "mL0Ta", "text": "<math><mn>0.5</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>24</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>58</mtext><mtext>.5</mtext><mtext> </mtext><mtext>g</mtext></mrow> </math> <math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi><mo>=</mo><mn>6</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>23</mn></mrow></msup></math> molecule (atoms) of <math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi></math> (as <math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi></math> occupies FCC system)<br />1-unit cell have 4 molecules of <math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi></math><br />So, no. of unit cell <math><mo>=</mo><mfrac><mrow><mn>6</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>23</mn></mrow></msup></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mn>1.5</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>23</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ed23d7a509d933ec", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "46", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the unit cell of a mineral has cubic close packed (ccp) array of oxygen atoms with m fraction of octahedral holes occupied by aluminium ions and n fraction of tetrahedral holes occupied by magnesium ions, m and n, respectively, are", "image": null}, "options": [{"id": "tL9Os", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>8</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "Owt8k", "text": "<math><mn>1</mn><mo>,</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "P4Yu7", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": athvariant=\"normal\">l</mi></mrow><mrow><mo>-</mo></mrow></msup></math> ions <br/><br/>Unit cell  <math><mo>=</mo><mfrac><mrow><mtext>1.029</mtext><mo>×</mo><mtext>1</mtext><msup><mrow><mtext>0</mtext></mrow><mrow><mtext>22</mtext></mrow></msup></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mtext>2.57</mtext><mo>×</mo><mtext>1</mtext><msup><mrow><mtext>0</mtext></mrow><mrow><mtext>21</mtext></mrow></msup></math>  unit cell", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cbff7989fa49a4ee", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What is the simplest formula of a solid whose unit cell has the atom A at each corner, the atom B at each face centre and a C atom at the body centre?", "image": null}, "options": [{"id": "5Ffvt", "text": "<math><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "KgrG3", "text": "<math><mi mathvariant=\"normal\">A</mi><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": false}, {"id": "1FOOc", "text": "<math><mi mathvariant=\"normal\">A</mi><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">C</mi></math>", "image": null, "isCorrect": true}, {"id": "3gi5m", "text": "<math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "An atom at the corner of a cube is shared among 8 unit cells. As there are 8 corners in a cube, number of corner<br />atom <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced></math> per unit cell <math><mn>8</mn><mo>×</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math><br />Face-centred atom in a cube is shared by two unit cells.<br />As there are 6 faces in a cube, number of face-centred<br />atom <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">B</mi></mrow></mfenced></math> per unit cell <math><mn>6</mn><mo>×</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>3</mn></math><br />An atom in the body of the cube is not shared by other cells.<br /><math><mo>∴</mo></math> Number of atoms <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">C</mi></mrow></mfenced></math> at the body centre per unit cell = 1.<br />Hence, the formula of the solid is <math><mi mathvariant=\"normal\">A</mi><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">C</mi></math> .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ba95eced8b0ea9a0", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "45", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What is the coordination number of Cs<sup>+</sup>&nbsp;in CsCl?", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "Coordination number is defined as the no. of nearest equidistant neighbo "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a2de53dad5b8688f", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A metallic element crystallizes into a lattice containing a sequence layers of ABABAB ..... . Any packing of spheres leaves out voids in the lattice. What percentage by volume of this lattice is empty space?", "image": null}, "options": [], "correctValue": "26", "solution": {"text": "Packing fraction in hcp <math><mo>=</mo><mfrac><mrow><mn>6</mn><mo>×</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi mathvariant=\"normal\">π</mi><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">V</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><mn>6</mn><mo>×</mo><mn>4</mn><mi mathvariant=\"normal\">π</mi><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>3</mn><mo>×</mo><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">a</mi><mo>×</mo><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">h</mi><mi mathvariant=\"normal\">t</mi></mrow></mfrac></math><br /><br />Area (of base) of unit cell in hcp <math><mo>=</mo><mn>6</mn><msqrt><mn>3</mn></msqrt><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>2</mn></mrow></msup></math> (follow text)<br /><br />height of unit cell in hcp <math><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">r</mi><mo>×</mo><msqrt><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></msqrt></math> (follow text)<br /><br />So packing fraction <math><mo>=</mo><mfrac><mrow><mn>6</mn><mo>×</mo><mn>4</mn><mi mathvariant=\"normal\">π</mi><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>3</mn><mo>×</mo><mn>6</mn><msqrt><mn>3</mn></msqrt><msup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>×</mo><mn>4</mn><mi mathvariant=\"normal\">r</mi><mo>×</mo><msqrt><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></msqrt></mrow></mfrac></math><br /><br /><math><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">π</mi></mrow><mrow><mn>3</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac><mo>=</mo><mn>0.74</mn></math><br /><br />or = 74%<br /><br />Thus, empty space in hcp = 1 - 0.74 = 0.26<br /><br />or = 26%.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a1b0f6e1eb2f0e98", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "56", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What are the coordination number (C.N.) of  <math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>  and  <math><msup><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mo>-</mo></mrow></msup></math>  ion in calcium fluoride  <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><msub><mrow><mi mathvariant=\"normal\">F</mi> <msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><msup><mrow><mn>2</mn></mrow><mrow><mn>1</mn><mo>/</mo><mn>3</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86383921258c1667eda", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "72", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "An element P (atomic weight = 80 g/mol) having fcc structure, calculate number of unit cells in 8 gm of P", "image": null}, "options": [{"id": "nvNeK", "text": "<math><mn>0.4</mn><mo>×</mo><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "oapO4", "text": "<math><mn>0.1</mn><mo>×</mo><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "KWo9X", "text": "<math><mn>4</mn><mo>×</mo><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "txeoW", "text": "None of these", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Number of atoms in fcc = 4<br/><br/>Total number of atoms  <math><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">w</mi></mrow><mrow><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">c</mi><mtext> wt.</mtext></mrow></mfrac><mo>×</mo><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub></math> <br/><br/>Total number of atoms  <math><mo>=</mo><mfrac><mrow><mn>8</mn></mrow><mrow><mn>80</mn></mrow></mfrac><mo>×</mo><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub></mrow><mrow><mn>10</mn></mrow></mfrac></math> <br/><br/>Number of unit cell  <math><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub></mrow><mrow><mn>10</mn></mrow></mfrac><mo>×</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math> <br/><br/> <math><mo>=</mo><mfrac><mrow><mn>6.0</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>22</mn></mrow></msup></math> <br/><br/> <math><mo>=</mo><mn>1.5</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>22</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86382ce537506c86331", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "01", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The radius ratio of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mtext>KF</mtext></mrow> </math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mn>0.98</mn></mrow> </math>. The structure of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mtext>KF</mtext></mrow> </math> is of the type", "image": null}, "options": [{"id": "CnWUa", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mtext>NaCl</mtext></mrow> </math>", "image": null, "isCorrect": false}, {"id": "5XVRC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mtext>ZnS</mtext></mrow> </math>", "image": null, "isCorrect": false}, {"id": "4vIR9", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mtext>CsCl</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "r71CV", "text": "Graphite", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As <math><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mo>+</mo></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mo>-</mo></mrow></msub></mrow></mfrac></math> lies in the range <math><mn>0.732</mn><mo>-</mo><mn>1.000</mn></math>. Hence the coordination number is 8 and crystal is of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mtext>CsCl</mtext></mrow> </math> type.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863827d505f828f1331", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a solid 'XY' having the NaCl structure, 'X' atoms occupy the corners of the cubic unit cell. If all the face centred atoms along one of the axes are removed, then the resultant stiochiometry of the solid is found to be <math><msub><mrow><mi mathvariant=\"normal\">X</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></msub><msub><mrow><mi mathvariant=\"normal\">Y</mi></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></msub></math> . Find the sum of m + n?", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "Na in NaCl has eight corner and six face atoms and thus, if we remove face centred atom of one axis, then two faces atoms are removed. Thus, X is at 8 corners and Y is at 4 faces.<br />Number of X atoms per unit cell <math><mo>=</mo><mn>8</mn><mo>×</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mo>+</mo><mn>4</mn><mo>×</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>3</mn></math><br />Number of Y atoms per unit cell <math><mo>=</mo><mn>12</mn><mo>×</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>+</mo><mn>1</mn><mo>=</mo><mn>4</mn></math><br />Thus, formula is <math><msub><mrow><mi mathvariant=\"normal\">X</mi></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">Y</mi></mrow><mrow><mn>4</mn></mrow></msub></math> .<br />Hence, m = 3, n = 4<br />sum of m + n = 3 + 4 = 7.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637e4dd94023a176b1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A metallic element exists in cubic lattice. Each edge of unit cell is <math> <mrow> <mtext>4</mtext><mover> <mtext>A</mtext> <mtext>o</mtext> </mover> </mrow> </math> The density of metal is <math> <mrow> <mtext>6</mtext><mtext>.25</mtext><mtext> </mtext><mtext>g</mtext><mtext> </mtext><msup> <mrow> <mtext>/m</mtext></mrow> <mtext>3</mtext> </msup> <mtext>.</mtext></mrow> </math> How many unit cells will be present in <math> <mrow> <mtext>100</mtext><mtext> </mtext><mtext>g</mtext></mrow> </math> of metal?", "image": null}, "options": [{"id": "98FUZ", "text": "<math><mn>1</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>22</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "5bkta", "text": "<math><mn>2.5</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>29</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "EsZv6", "text": "<math><mn>5</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>23</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "MXN9b", "text": "<math><mn>2</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>23</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>d</mtext><mtext> </mtext><mtext>=</mtext><mtext> </mtext><mfrac> <mrow> <mtext>weight</mtext></mrow> <mrow> <mtext>Total</mtext><mtext> </mtext><mtext>volume</mtext></mrow> </mfrac> </mrow> </math><br /><math> <mrow> <mn>6.25</mn><mo>=</mo><mfrac> <mrow> <mn>100</mn></mrow> <mrow> <mtext>n</mtext><mo>×</mo><msup> <mrow> <mfenced> <mrow> <mn>4</mn><mo>×</mo><msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>−</mo><mn>10</mn></mrow> </msup> </mrow> </mfenced></mrow> <mn>3</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><math> <mrow> <mfrac> <mrow> <mn>100</mn></mrow> <mrow> <mn>6.25</mn><mo>×</mo><mn>64</mn><mo>×</mo><msup> <mrow> <mn>10</mn></mrow> <mrow> <mo>−</mo><mn>30</mn></mrow> </msup> </mrow> </mfrac> </mrow> </math><br /><math> <mrow>  <mtext>n</mtext><mtext>&#x2004;</mtext><mtext>=</mtext><mtext>&#x2004;</mtext><mtext>2</mtext><mtext>.5</mtext><mtext>&#x2004;</mtext><mtext>&#x00D7;</mtext><mtext>&#x2004;</mtext><msup>   <mrow>    <mtext>10</mtext></mrow>   <mrow>    <mn>29</mn></mrow>  </msup>  </mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637bb236747b870cb0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "60", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of unit cells present in 1 g cube shaped ideal crystal of solid <math><msup><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>+</mo></mrow></msup><msup><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mo>-</mo></mrow></msup></math> (with CCP close packing) (formula mass <math><mo>=</mo><mn>60</mn></math> ) are", "image": null}, "options": [{"id": "Rt0u7", "text": "<math><mn>2.5</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>21</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "8iyEJ", "text": "<math><mn>6.02</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>23</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "1pmsP", "text": "<math><mn>4.0</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>22</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "JTHHF", "text": "<math><mn>1.0</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>22</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Number of moles present in  <math><mn>1</mn><mi mathvariant=\"normal\">g</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>60</mn></mrow></mfrac></math> <br/><br/>So number of formula units in  <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>60</mn></mrow></mfrac></math>  moles<br/><br/> <math><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>60</mn></mrow></mfrac><mo>×</mo><mn>6.023</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>23</mn></mrow></msup><mo>=</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>22</mn></mrow></msup><mo>=</mo><mn>10</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>21</mn></mrow></msup></math> <br/><br/>Since 4 formula units constitute a unit cell<br/><br/>So number of unit cells present <br/><br/> <math><mo>=</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>21</mn></mrow></msup><mo>=</mo><mn>2.5</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>21</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637a2ea3c044429c3a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In which of the following crystals alternate tetrahedral voids are occupied ?", "image": null}, "options": [{"id": "LhBBl", "text": "NaCl", "image": null, "isCorrect": false}, {"id": "eLkhJ", "text": "ZnS", "image": null, "isCorrect": true}, {"id": "cFKrF", "text": "CaF<sub>2</sub>", "image": null, "isCorrect": false}, {"id": "JJkFS", "text": "Na<sub>2</sub>O", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In ZnS structure, sulphides occupy all the lattice points while Zn<sup>2</sup><sup>+</sup> ions are present in alternative tetrahedral voids.<br /><math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi></math> has FCC structure and <math><mi mathvariant=\"normal\">N</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mo>+</mo></mrow></msup></math> atom occupied all octahedral hole.<br /><math><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><msub><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mn>2</mn></mrow></msub></math> has FCC structure and all T-holes will occupied by guest.<br /><math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math> has FCC sturcture and all T-holes will occupied by guest.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86370fe49cbe837d2f1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A crystal made up of particles X, Y, and Z. X forms fcc packing. Y occupies all octahedral voids of X and Z occupies all tetrahedral voids of X. It all particles along one body diagonal are removed, then the formula of the crystal is", "image": null}, "options": [{"id": "NOHrs", "text": "XYZ<sub>2</sub>", "image": null, "isCorrect": false}, {"id": "FBJae", "text": "X<sub>2</sub>YZ<sub>2</sub>", "image": null, "isCorrect": false}, {"id": "H45u1", "text": "X<sub>8</sub>Y<sub>4</sub>Z<sub>5</sub>", "image": null, "isCorrect": false}, {"id": "rJi9S", "text": "X<sub>5</sub>Y<sub>4</sub>Z<sub>8</sub>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>For fcc, number of X atoms = 4/unit cell<br /><br />Number of Tetrahedral Voids = Z = 8<br /><br />Number of Octahedral Voids = Y = 4<br /><br />Number of atoms removed along one body diagonal = 2X (corner) and 2Z (TVs) and 1 Y (OV at body centre)<br /><br /><math> <mrow> <mo>∴</mo> </mrow> </math>&nbsp;&nbsp;&nbsp;&nbsp;Number of X atoms left <math> <mrow> <mo>=</mo> <mn>4</ ></math>", "image": null, "isCorrect": false}, {"id": "0ADz9", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>8</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "inDkm", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "N3GIi", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Number of <math><msup><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn><mo>-</mo></mrow></msup></math> ions = n <br/>Number of tetrahedral voids = 2n <br/>Number of octahedral voids = n <br/>Number of Y ions <math><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math> , <br/>Number of X ions <math><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>  <br/>Occupied octahedral voids <math><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>  <br/>So fraction of occupied octahedral voids <math><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math> .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635382545aea254e5b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math><mtext>T</mtext><mtext>l<  "For any unit cell<br /><math> <mrow>  <mtext>d</mtext><mtext>&#x2004;</mtext><mtext>=</mtext><mtext>&#x2004;</mtext><mfrac>   <mrow>    <mtext>2</mtext><mtext>&#x2004;</mtext><mtext>M</mtext></mrow>   <mrow>    <msup>     <mtext>a</mtext>     <mtext>3</mtext>    </msup>    <mtext>&#x2004;</mtext><msub>     <mtext>N</mtext>     <mtext>A</mtext>    </msub>    </mrow>  </mfrac>  </mrow></math> (for <math> <mrow>  <mtext>BCC,</mtext><mtext>&#x2004;</mtext><mtext>Z</mtext><mtext>&#x2004;</mtext><mtext>=</mtext><mtext>&#x2004;</mtext><mtext>2</mtext></mrow></math>)<br /><math><mn>2.32</mn><mo>=</mo><mfrac><mrow><mn>2</mn><mi mathvariant=\"normal\">&nbsp;</mi><mo>×</mo><mi mathvariant=\"normal\">M</mi></mrow><mrow><mn>6</mn><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>23</mn></mrow></msup><mo>×</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>1.22</mn></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup><mo>×</mo><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>–</mo><mn>21</mn></mrow></msup></mrow></mfrac></math><br /><math><mo>∴</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">M</mi><mo>=</mo><mn>1264</mn></math><br />So <math> <mrow> <mn>4</mn> <mn>2</mn> <mn>3</mn> <mo>+</mo> <mtext>x</mtext> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>1</mn> <mn>8</mn> </mrow> </mfenced> <mo>=</mo> <mn>1</mn> <mn>2</mn> <mn>6</mn> <mn>4</mn> </mrow> </math>&nbsp; &nbsp;<br /><math> <mrow> <mtext>x</mtext> <mo>=</mo> <mn>4</mn> <mn>7</mn> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863503face9f80ba209", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a compound oxide ion have ccp arrangement, cations A are present in <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>8</mn></mrow></mfrac></math> of the tetrahedral voids and cations B occupy <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math> of the octahedral voids. What are the formula of the compound?", "image": null}, "options": [{"id": "uuvPJ", "text": "<math><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">B</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "luWSM", "text": "<math><mi mathvariant=\"normal\">A</mi><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "vDtL7", "text": "<math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "LFNxn", "text": "<math><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">B</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Oxide ions are forming the lattice<br />Effective number of oxide ions <math><mo>=</mo><mn>4</mn><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">p</mi></mrow></mfenced></math><br /><math><mo>∴</mo></math> Tetrahedral voids <math><mo>=</mo><mn>2</mn><mo>×</mo><mn>4</mn><mo>=</mo><mn>8</mn></math><br />And effective number of A atom <math><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mo>×</mo><mn>8</mn><mo>=</mo><mn>1</mn></math><br />Number of octahedral voids <math><mo>=</mo><mn>4</mn></math><br />Effective number of B atom <math><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>×</mo><mn>4</mn><mo>=</mo><mn>2</mn></math><br /><math><mo>∴</mo></math> Molecular formulae <math><mo>=</mo><mi mathvariant=\"normal\">A</mi><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634be5de4b25d4d225", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a hypothetical solid, C atoms are found to form cubical close-packed lattice. A atoms occupy all tetrahedral voids and B atoms occupy all octahedral voids.<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/che_que_.jpg\" style=\"width: 160px; height: 153px;\" /><br />\r<br />\rA and B atoms are of appropriate size, so that there is no distortion in the CCP lattice of C&nbsp; atoms. Now, if a plane as shown in the following figure is cut, then the cross section of this plane will look like", "image": null}, "options": [{"id": "VLyi3", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/che_opt_1.jpg\" style=\"width: 140px; height: 144px;\" />", "image": null, "isCorrect": false}, {"id": "RSmNF", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/che_opt_2.jpg\" style=\"widt msubsup></mrow></mfrac><mo>=</mo><mn>0.732</mn></math><br /><br /><math><mo>∴</mo><msubsup><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">x</mi></mrow><mrow><mo>-</mo></mrow></msubsup><mo>=</mo><mn>241.6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">m</mi></math>&nbsp;<br /><br /><math> <mrow> <mo>∴</mo><msub> <mtext>r</mtext> <mrow> <mtext>min</mtext></mrow> </msub> <mo>=</mo><mn>136.6</mn><mtext> </mtext><mtext>pm</mtext></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86319e530ad5cd17ac5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Calcium crystallizes in a face centred cubic unit cell with a <math> <mrow> <mtext>=</mtext><mtext> </mtext><mtext>0</mtext><mtext>.560</mtext><mtext> </mtext><mtext>nm</mtext><mtext>.</mtext></mrow> </math> &nbsp;The density of the metal if it contains 0.1% schottky defects would be:", "image": null}, "options": [{"id": "IveSB", "text": "<math> <mrow> <mtext>1</mtext><msup> <mrow> <mtext>.51&nbsp;gcm</mtext> </mrow> <mrow> <mtext>-3</mtext> </mrow> </msup> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "f0q4x", "text": "<math>  <mrow>   <mtext>2</mtext><msup>    <mrow>     <mtext>.51&nbsp;gcm</mtext>    </mrow>    <mrow>     <mtext>-3</mtext>    </mrow>   </msup>     </mrow> </math>", "image": null, "isCorrect": false}, {"id": "6xC1N", "text": "<math>  <mrow>   <mtext>15</mtext><msup>    <mrow>     <mtext>.1&nbsp;gcm</mtext>    </mrow>    <mrow>     <mtext>-3</mtext>    </mrow>   </msup>     </mrow> </math>", "image": null, "isCorrect": false}, {"id": "LKbtw", "text": "<math>  <mrow>   <mtext>0</mtext><msup>    <mrow>     <mtext>.151&nbsp;gcm</mtext>    </mrow>    <mrow>     <mtext>-3</mtext>    </mrow>   </msup>     </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A face centred cubic unit cell contains four atoms. Schottky defect is basically a vacancy defect in ionic solids. Due to Schottky defects, the vacant spaces will increase, resulting in decrease in number of atoms per unit cell.<br />Thus, number of atoms will reduce to:<br /><math> <mrow> <mtext>Z</mtext><mo>=</mo><mfenced> <mrow> <mn>4</mn><mo>−</mo><mfrac> <mrow> <mn>4</mn><mo>×</mo><mn>0.1</mn></mrow> <mrow> <mn>100</mn></mrow> </mfrac> </mrow> </mfenced><mo>=</mo><mn>3.996</mn></mrow> </math><br />The density of the metal can be calculated by:<br /><math> <mrow> <mtext>ρ</mtext><mtext> </mtext><mtext>=</mtext><mtext> </mtext><mfrac> <mrow> <mtext>Z</mtext><mtext> </mtext><mtext>×</mtext><mtext> </mtext><mtext>M</mtext></mrow> <mrow> <msub> <mtext>N</mtext> <mtext>0</mtext> </msub> <mtext> </mtext><mtext>×</mtext><mtext> </mtext><msup> <mtext>a</mtext> <mtext>3</mtext> </msup> </mrow> </mfrac> </mrow> </math><br />Where, <math> <mtext>M</mtext> </math> is the molecular mass of calcium <math> <mrow> <msup> <mrow> <mtext>=&nbsp;40&nbsp;g&nbsp;mol</mtext> </mrow> <mrow> <mtext>-1</mtext> </mrow> </msup> </mrow> </math><br /><math> <mrow> <msub> <mtext>N</mtext> <mtext>0</mtext> </msub> </mrow> </math> <span>is the Avogadro number <math> <mrow> <mo>=</mo><mn>6.022</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mrow> <mn>23</mn> </mrow> </msup> <msup> <mrow> <mtext>mol</mtext> </mrow> <mtext>-</mtext> </msup> <msup> <mrow></mrow> <mtext>1</mtext> </msup> </mrow> </math><br /><math> <mtext>a</mtext> </math> is the edge length <math> <mrow> <mtext>=&nbsp;0</mtext><mtext>.560&nbsp;nm&nbsp;</mtext><mtext> </mtext><mtext>=&nbsp;</mtext><mtext> </mtext><mtext>0</mtext><mtext>.56</mtext><mtext> </mtext><mtext>×</mtext><mtext> </mtext><msup> <mrow> <mtext>10</mtext></mrow> <mrow> <mo>−</mo><mtext>7</mtext></mrow> </msup> <mtext>cm</mtext></mrow> </math><br />Putting the values in the formula above:<br /><math> <mrow> <mtext>=</mtext><mtext> </mtext><mfrac> <mrow> <mtext>3</mtext><mtext>.996</mtext><mtext> </mtext><mtext>×</mtext><mtext> </mtext><mtext>(40</mtext><mtext> </mtext><mtext>g</mtext><mtext> </mtext><msup> <mrow> <mtext>mol</mtext></mrow> <mrow> <mo>−</mo><mtext>1</mtext></mrow> </msup> <mtext>)</mtext></mrow> <mrow> <msup> <mrow> <mtext>(0</mtext><mtext>.560</mtext><mtext> </mtext><mtext>×</mtext><mtext> </mtext><msup> <mrow> <mtext>10</mtext></mrow> <mrow> <mo>−</mo><mtext>7</mtext></mrow> </msup> <mtext> </mtext><mtext>cm)</mtext></mrow> <mtext>3</mtext> </msup> <mtext> </mtext><mtext>×</mtext><mtext> </mtext><mtext>(6</mtext><mtext>.022</mtext><mtext> </mtext><mtext>×</mtext><mtext> </mtext><msup> <mrow> <mtext>10</mtext></mrow> <mrow> <mtext>23</mtext></mrow> </msup> <mtext> </mtext><msup> <mrow> <mtext>mol</mtext></mrow> <mrow> <mo>−</mo><mtext>1</mtext></mrow> </msup> <mtext>)</mtext></mrow> </mfrac> </mrow> </math><br /><math> <mrow> <mo>=</mo><mn>1.51</mn><mtext> </mtext><mtext>g</mtext><mtext> </mtext><msup> <mrow> <mtext>cm</mtext></mrow> <mrow> <mo>−</mo><mn>3</mn></mrow> </msup> </mrow> </math> </span>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631464445cc622cfef", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": ctValue": "8", "solution": {"text": "Coordination number is defined as the no. of nearest equidistant neighbours.<br />The coordination number of CsCl is 8..8", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b433d0adea1cfa52", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Edge length of face centred cubic unit cell of an ionic solid AB is 508 pm. If the radius of <math><msup><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>+</mo></mrow></msup></math> ion is 110 pm, the radius of <math><msup><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mo>-</mo></mrow></msup></math> ion in pm will be", "image": null}, "options": [], "correctValue": "144", "solution": {"text": "Edge length <math><mo>=</mo><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mo>+</mo></mrow></msup></mrow></msub><mo>+</mo><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mo>-</mo></mrow></msup></mrow></msub></math><br /><math><mn>508</mn><mo>=</mo><mn>2</mn><mo>×</mo><mn>110</mn><mo>+</mo><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mo>-</mo></mrow></msup></mrow></msub></math><br /><math><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mo>-</mo></mrow></msup></mrow></msub><mo>=</mo><mn>508</mn><mo>-</mo><mn>220</mn><mo>=</mo><mn>288</mn></math><br /><math><msub><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><msup><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mo>-</mo></mrow></msup></mrow></msub><mo>=</mo><mn>144</mn></math> pm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b1ba87c54eac3296", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "94", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In a solid 'AB' having rock salt arrangement ( <math><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi></math> structure), 'A' atoms occupy the corners and face center of the cubic unit cell. 'B' atoms occupies all octahedral voids of the unit cell. If all the face-centered atoms along one of the axes are removed, then the resultant stoichiometry of the solid is", "image": null}, "options": [{"id": "kj3pT", "text": "<math><mi mathvariant=\"normal\">A</mi><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "o7v2i", "text": "<math><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">B</mi></math>", "image": null, "isCorrect": false}, {"id": "XTjTI", "text": "<math><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>4</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "GiyRe", "text": "<math><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "There were 6 A atoms on the face-centres removing face-centred atoms along one of the axes means removal of 2 A atoms.<br /><br />Now, number of A atoms per unit cell<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/14_que_chem.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 180px; height: 72px;\" /><br /><br />Number of B atoms per unit cell<br /><br /><math><mo>=</mo><munder><mrow><mn>12</mn><mo>×</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow><mrow><mo>(</mo><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">d</mi><mo>)</mo></mrow></munder><mo>+</mo><munder><mrow><mn>1</mn><mo>=</mo><mn>4</mn></mrow><mrow><mo>(</mo><mi mathvariant=\"normal\">b</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">d</mi><mo>)</mo></mrow></munder></math><br /><br />Hence the resultant stoichiometry is <math><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863abf0441a59660ea1", "type": "singleCorrect", "level": "NTA Abhyas Paper", "value": "77", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>How many units of NaCl is present per unit cell of NaCl?</p>\r", "image": null}, "options": [{"id": "VXukq", "text": "<math><mn>4</mn></math>", "image": null, "isCorrect": true}, {"id": "GXxSm", "text": "<math><mn>6</mn></math>", "image": null, "isCorrect": false}, {"id": "mRxcI", "text": "<math><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "Lq3fy", "text": "<math><mn>8</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mo>-</mo></mrow></msup></math> ions form ccp lattice i.e 8 at corners + 6 at face centres.<br /><br /><math><mo>⇒</mo><mn>8</mn><mo>×</mo><mfrac><mrow><mn>8</mn></mrow><mrow><mn>18</mn></mrow></mfrac><mo>+</mo><mn>6</mn><mo>×</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mo>-</mo></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">s</mi></math><br /><br /><math><mi mathvariant=\"normal\">N</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mo>+</mo></mrow></msup></math> at octahedral voids 12 at centre edges plus one at body centre.<br /><br /><math><mo>⇒</mo><mn>12</mn><mo>×</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>+</mo><mn>1</mn><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">N</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mo>+</mo></mrow></msup><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">s</mi></math><br /><br />i.e <math> <mrow>  <mtext>4NaCl</mtext></mrow></math> molecules per unit cell.<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/125926.PNG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 349px; height: 152px;\" /></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a1b0f6e1eb2f0e98", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "56", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What are the coordination number (C.N.) of  <math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>  and  <math><msup><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mo>-</mo></mrow></msup></math>  ion in calcium fluoride  <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">a</mi><msub><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math>  crystal structure?", "image": null}, "options": [{"id": "RMjpP", "text": "C.N. of  <math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>=</mo><mn>4</mn></math>  and  <math><msup><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mo>-</mo></mrow></msup><mo>=</mo><mn>8</mn></math>", "image": null, "isCorrect": false}, {"id": "oxG8p", "text": "C.N. of  <math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>=</mo><mn>6</mn></math>  and  <math><msup><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mo>-</mo></mrow></msup><mo>=</mo><mn>6</mn></math>", "image": null, "isCorrect": false}, {"id": "tYwAq", "text": "C.N. of  <math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>=</mo><mn>8</mn></math>  and  <math><msup><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mo>-</mo></mrow></msup><mo>=</mo><mn>8</mn></math>", "image": null, "isCorrect": false}, {"id": "7UAH9", "text": "C.N. of  <math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn><mo>+</mo></mrow></msup><mo>=</mo><mn>8</mn></math>  and  <math><msup><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mo>-</mo></mrow></msup><mo>=</mo><mn>4</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Each  <math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>  ion is surrounded by 8  <math><msup><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mo>-</mo></mrow></msup></math>  ions and each  <math><msup><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mo>-</mo></mrow></msup></math>  ion by 4  <math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>  ions. Thus, coordination number of  <math><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn><mo>+</mo></mrow></msup></math>  is 8 and  <math><msup><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mo>-</mo></mrow></msup></math>  is 4.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": " up></math> and <math><msup><mrow><mi mathvariant=\"normal\">X</mi></mrow><mrow><mo>-</mo></mrow></msup></math> ions at interstitial sites", "image": null, "isCorrect": false}, {"id": "E6tO8", "text": "Schottky defect", "image": null, "isCorrect": true}, {"id": "JqDwE", "text": "F-centre", "image": null, "isCorrect": false}, {"id": "UjXDO", "text": "Frenkel defect", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Calculated density <math><mi mathvariant=\"normal\">d</mi><mo>=</mo><mi mathvariant=\"normal\">Z</mi><mo>×</mo><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">s</mi></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mi mathvariant=\"normal\">a</mi></mrow></msub><mo>×</mo><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">l</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi></mrow></mfrac><mo>=</mo><mn>2.78</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">c</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math><br />Is greater then actual density <math><mn>2.44</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">c</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>3</mn></mrow></msup></math> therefore density decreases and defect is Schottky defect", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dca109d n (-8/3)<br />n = 3 (i.e., there will one anionic vacancy)<br />Thus, there will be one an ionic vacancy per unit cell.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634bb9fea410730102", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "15", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Strontium crystallizes in a fcc unit cell with edge length <math> <mrow> <mtext>a</mtext><mtext>.</mtext></mrow> </math> It contains <math> <mrow> <mtext>0</mtext><mtext>.2%</mtext></mrow> </math> Frenkel defect and another crystal of <math> <mrow> <mtext>Sr</mtext></mrow> </math> contains <math> <mrow> <mtext>0</mtext><mtext>.1%</mtext></mrow> </math> Schottky defect. Density of solid with Frankel defect = <math> <mrow> <msub> <mtext>d</mtext> <mtext>f</mtext> </msub> </mrow> </math> and density with Schottky defect = <math> <mrow> <msub> <mtext>d</mtext> <mtext>s</mtext> </msub> <mo>,</mo></mrow> </math> then", "image": null}, "options": [{"id": "zFlUZ", "text": "<math><msub><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "2mQTf", "text": "<math><msub><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub><mo>&gt;</mo><msub><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "Q6pov", "text": "<math><msub><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub><mo>&lt;</mo><msub><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "f3Pqe", "text": "<math><msub><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub><mo>=</mo><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "No effect on density due to Frenkel defect but due to Schottky defect density of solid decrease", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86319e530ad5cd17ac5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Calcium crystallizes in a face centred cubic unit cell with a <math> <mrow> <mtext>=</mtext><mtext> </mtext><mtext>0</mtext><mtext>.560</mtext><mtext> </mtext><mtext>nm</mtext><mtext>.</mtext></mrow> </math> &nbsp;The density of the metal if it contains 0.1% schottky defects would be:", "image": null}, "options": [{"id": "IveSB", "text": "<math> <mrow> <mtext>1</mtext><msup> <mrow> <mtext>.51&nbsp;gcm</mtext> </mrow> <mrow> <mtext>-3</mtext> </mrow> </msup> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "f0q4x", "text": "<math>  <mrow>   <mtext>2</mtext><msup>    <mrow>     <mtext>.51&nbsp;gcm</mtext>    </mrow>    <mrow>     <mtext>-3</mtext>    </mrow>   </msup>     </mrow> </math>", "image": null, "isCorrect": false}, {"id": "6xC1N", "text": "<math>  <mrow>   <mtext>15</mtext><msup>    <mrow>     <mtext>.1&nbsp;gcm</mtext>    </mrow>    <mrow>     <mtext>-3</mtext>    </mrow>   </msup>     </mrow> </math>", "image": null, "isCorrect": false}, {"id": "LKbtw", "text": "<math>  <mrow>   <mtext>0</mtext><msup>    <mrow>     <mtext>.151&nbsp;gcm</mtext>    </mrow>    <mrow>     <mtext>-3</mtext>    </mrow>   </msup>     </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A face centred cubic unit cell contains four atoms. Schottky defect is basically a vacancy defect in ionic solids. Due to Schottky defects, the vacant spaces will increase, resulting in decrease in number of atoms per unit cell.<br />Thus, number of atoms will reduce to:<br /><math> <mrow> <mtext>Z</mtext><mo>=</mo><mfenced> <mrow> <mn>4</mn><mo>−</mo><mfrac> <mrow> <mn>4</mn><mo>×</mo><mn>0.1</mn></mrow> <mrow> <mn>100</mn></mrow> </mfrac> </mrow> </mfenced><mo>=</mo><mn>3.996</mn></mrow> </math><br />The density of the metal can be calculated by:<br /><math> <mrow> <mtext>ρ</mtext><mtext> </mtext><mtext>=</mtext><mtext> </mtext><mfrac> <mrow> <mtext>Z</mtext><mtext> </mtext><mtext>×</mtext><mtext> </mtext><mtext>M</mtext></mrow> <mrow> <msub> <mtext>N</mtext> <mtext>0</mtext> </msub> <mtext> </mtext><mtext>×</mtext><mtext> </mtext><msup> <mtext>a</mtext> <mtext>3</mtext> </msup> </mrow> </mfrac> </mrow> </math><br />Where, <math> <mtext>M</mtext> </math> is the molecular mass of calcium <math> <mrow> <msup> <mrow> <mtext>=&nbsp;40&nbsp;g&nbsp;mol</mtext> </mrow> <mrow> <mtext>-1</mtext> </mrow> </msup> </mrow> </math><br /><math> <mrow> <msub> <mtext>N</mtext> <mtext>0</mtext> </msub> </mrow> </math> <span>is the Avogadro number <math> <mrow> <mo>=</mo><mn>6.022</mn><mo>×</mo><msup> <mrow> <mn>10</mn> </mrow> <mrow> <mn>23</mn> </mrow> </msup> <msup> <mrow> <mtext>mol</mtext> </mrow> <mtext>-</mtext> </msup> <msup> <mrow></mrow> <mtext>1</mtext> </msup> </mrow> </math><br /><math> <mtext>a</mtext> </math> is the edge length <math> <mrow> <mtext>=&nbsp;0</mtext><mtext>.560&nbsp;nm&nbsp;</mtext><mtext> </mtext><mtext>=&nbsp;</mtext><mtext> </mtext><mtext>0</mtext><mtext>.56</mtext><mtext> </mtext><mtext>×</mtext><mtext> </mtext><msup> <mrow> <mtext>10</mtext></mrow> <mrow> <mo>−</mo><mtext>7</mtext></mrow> </msup> <mtext>cm</mtext></mrow> </math><br />Putting the values in the formula above:<br /><math> <mrow> <mtext>=</mtext><mtext> </mtext><mfrac> <mrow> <mtext>3</mtext><mtext>.996</mtext><mtext> </mtext><mtext>×</mtext><mtext> </mtext><mtext>(40</mtext><mtext> </mtext><mtext>g</mtext><mtext> </mtext><msup> <mrow> <mtext>mol</mtext></mrow> <mrow> <mo>−</mo><mtext>1</mtext></mrow> </msup> <mtext>)</mtext></mrow> <mrow> <msup> <mrow> <mtext>(0</mtext><mtext>.560</mtext><mtext> </mtext><mtext>×</mtext><mtext> </mtext><msup> <mrow> <mtext>10</mtext></mrow> <mrow> <mo>−</mo><mtext>7</mtext></mrow> </msup> <mtext> </mtext><mtext>cm)</mtext></mrow> <mtext>3</mtext> </msup> <mtext> </mtext><mtext>×</mtext><mtext> </mtext><mtext>(6</mtext><mtext>.022</mtext><mtext> </mtext><mtext>×</mtext><mtext> </mtext><msup> <mrow> <mtext>10</mtext></mrow> <mrow> <mtext>23</mtext></mrow> </msup> <mtext> </mtext><msup> <mrow> <mtext>mol</mtext></mrow> <mrow> <mo>−</mo><mtext>1</mtext></mrow> </msup> <mtext>)</mtext></mrow> </mfrac> </mrow> </math><br /><math> <mrow> <mo>=</mo><mn>1.51</mn><mtext> </mtext><mtext>g</mtext><mtext> </mtext><msup> <mrow> <mtext>cm</mtext></mrow> <mrow> <mo>−</mo><mn>3</mn></mrow> </msup> </mrow> </math> </span>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "6aa3ab79aa8dc1ff68177f0a", "title": "Electrical and Magnetic Properties", "totalQuestions": 7, "questions": [{"_id": "6151e863e4dbad2014ca04f2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The bond structure in n-type semiconductor is<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/4_solu_chdadaw.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 350px; height: 112px;\" />", "image": null}, "options": [{"id": "8ch3b", "text": "I", "image": null, "isCorrect": true}, {"id": "fUJhC", "text": "II", "image": null, "isCorrect": false}, {"id": "cfagS", "text": "III", "image": null, "isCorrect": false}, {"id": "sHnrk", "text": "IV", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The band structure in an n-type semiconductor is as<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/4_solu_chdadaw_1.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 150px; height: 162px;\" /><br /><br />This is because a large energy difference (gap) exist between valence band and conduction band in case of a semiconductor and addition of an impurity (having higher valency) results in the n-type semiconductor.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b004818341ca69ea", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "104", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "On application of pressure certain crystals can produce electric signals. This phenomenon is known as", "image": null}, "options": [{"id": "MgeXs", "text": "Ferrielectricity", "image": null, "isCorrect": false}, {"id": "NRe0I", "text": "Ferroelectricity", "image": null, "isCorrect": false}, {"id": "CO5Zt", "text": "Peizoelectricity", "image": null, "isCorrect": true}, {"id": "plD6v", "text": "Pyroelectricity", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "When polar crystal is subjected to a mechanical stress, electricity is produced - a case of piezoelectricity. Reversely, if electric field is applied, mechanical stress is developed. Piezoelectric crystal acts as a mechanical electrical transductor.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863806aeb48d6977a08", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "55", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following arrangements shows the schematic alignment of magnetic moments of anti-ferromagnetic substance?", "image": null}, "options": [{"id": "d2Xte", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0643402_op_11.JPG\" style=\"width: 300px; height: 55px;\" />", "image": null, "isCorrect": false}, {"id": "thvpQ", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0643402_op_22.JPG\" style=\"width: 300px; height: 59px;\" />", "image": null, "isCorrect": false}, {"id": "Xs3gF", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0643402_op_33.JPG\" style=\"width: 300px; height: 55px;\" />", "image": null, "isCorrect": false}, {"id": "ys15H", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0643402_op_44. ack synthetic magnetic solid and was once widely used in magnetic tape emulsion.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636ecb62076271c74e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "36", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "For <math><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">e</mi><msub><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mn>6</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>3</mn><mo>-</mo></mrow></msup></math> and <math><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">o</mi><msub><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mn>6</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>3</mn><mo>-</mo></mrow></msup></math>, the correct statement is", "image": null}, "options": [{"id": "N4pGM", "text": "both are coloured", "image": null, "isCorrect": false}, {"id": "TtorK", "text": "both are colourless", "image": null, "isCorrect": false}, {"id": "vxIdQ", "text": "<math><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">e</mi><msub><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mn>6</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>3</mn><mo>-</mo></mrow></msup></math>  is coloured and  <math><msup><mrow><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">o</mi><msub><mrow><mi mathvariant=\"normal\">F</mi></mrow><mrow><mn>6</mn></mrow></msub></mrow> 3", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Semiconductors have a conductivity range of <math><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></math> to <math><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></msup><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">h</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> . What is the value of n here?", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "Conductivity range of semiconductors are in the range of   <math><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>6</mn></mrow></msup></math>  to  <math><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mn>4</mn></mrow></msup></math>   <math><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">h</mi><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></math> .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86340c84de4ad36c84d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "93", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Band theory predicts that magnesium is an insulator. However, in practice it acts as a conductor due to", "image": null}, "
