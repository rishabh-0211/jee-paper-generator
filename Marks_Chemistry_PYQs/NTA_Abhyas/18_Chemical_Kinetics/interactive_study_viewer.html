 src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/13182s.png\" style=\"width: 179px; height: 103px;\" /><br /><br />According to question, at presentation point <math> <mrow> <mo>⇒</mo><mfenced close=\"]\" open=\"[\"> <mtext>A</mtext> </mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"> <mtext>B</mtext> </mfenced></mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo><msub> <mtext>A</mtext> <mtext>0</mtext> </msub> <mo>−</mo><mtext>x</mtext><mo>=</mo><mtext>nx</mtext></mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo><msub> <mtext>A</mtext> <mtext>0</mtext> </msub> <mo>=</mo><mfenced> <mrow> <mtext>n</mtext><mo>+</mo><mn>1</mn></mrow> </mfenced><mtext>x</mtext></mrow> </math><br /><br /><math> <mrow> <mo>⇒</mo><mtext>x</mtext><mo>=</mo><mfrac> <mrow> <msub> <mtext>A</mtext> <mtext>0</mtext> </msub> </mrow> <mrow> <mtext>n</mtext><mo>+</mo><mn>1</mn></mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <mfenced close=\"]\" open=\"[\"> <mtext>B</mtext> </mfenced><mo>=</mo><mtext>nx</mtext></mrow> </math><br /><br /><math> <mrow> <mo>=</mo><mfenced> <mrow> <mfrac> <mrow> <mtext>n</mtext><mo>×</mo><msub> <mtext>A</mtext> <mtext>0</mtext> </msub> </mrow> <mrow> <mtext>n</mtext><mo>+</mo><mn>1</mn></mrow> </mfrac> </mrow> </mfenced></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638b38eb86a148b74a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following is/are correct for the first order reaction?<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/53b40de8-ac23-449e-a6b0-8570c43fad4e.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:5.59375in;height:1.48681in\" />", "image": null}, "options": [{"id": "NSNwH", "text": "I, II", "image": null, "isCorrect": true}, {"id": "UT1Ir", "text": "II, III", "image": null, "isCorrect": false}, {"id": "rB9nq", "text": "I, II III", "image": null, "isCorrect": false}, {"id": "XyauJ", "text": "I, III", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>I.<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>log</mi><mo>&nbsp;</mo><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>&nbsp;</mo><mo>–</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">x</mi><mo>)</mo></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">a</mi><mo>&nbsp;</mo><mo>–</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">x</mi><mo>)</mo></math> is remaining concentration, decreases with passage of time.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>log</mi><mfenced><mrow><mi mathvariant=\"normal\">a</mi><mo>−</mo><mi mathvariant=\"normal\">x</mi></mrow></mfenced><mo>=</mo><mi>log</mi><mo>&nbsp;</mo><mi>a</mi><mo>−</mo><mfrac><mi>kt</mi><mrow><mn>2</mn><mo>.303</mo></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">y</mi><mo>=</mo><mi>log</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">a</mi><mo>−</mo><mfrac><mi mathvariant=\"normal\">k</mi><mrow><mn>2</mn><mo>.3030</mo></mrow></mfrac><mi mathvariant=\"normal\">x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>slope</mi><mo>=</mo><mo>−</mo><mi>ve</mi></math><br />II. <math><mi mathvariant=\"normal\">k</mi><mo>=</mo><mfrac><mrow><mn>2.303</mn></mrow><mrow><mi mathvariant=\"normal\">t</mi></mrow></mfrac><mrow><mrow><msub><mrow><mi mathvariant=\"normal\">log</mi></mrow><mrow><mn>10</mn></mrow></msub></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\ riant=\"normal\">e</mi></mrow><mrow><mo>-</mo><mtext>kt</mtext></mrow></msup></math> <br/><br/>Hence concentration of  <math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mtext>N</mtext><msub><mrow><mtext>O</mtext></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math>  decreases exponentially (First  statement is correct).<br/><br/>Also,  <math><msub><mrow><mi mathvariant=\"normal\">t</mi></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msub><mo>=</mo><mfrac><mrow><mn>0.693</mn></mrow><mrow><mi mathvariant=\"normal\">K</mi></mrow></mfrac></math> . Which is independent of concentration and  <math><msub><mrow><mi mathvariant=\"normal\">t</mi></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msub></math>  decreases with the increase of temperature.<br/><br/> <math><msub><mrow><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>99.6</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>2.303</mn></mrow><mrow><mi mathvariant=\"normal\">K</mi></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">loglog</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>100</mn></mrow><mrow><mn>0.4</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math> <br/><br/> <math><msub><mrow><mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>99.6</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>2.303</mn></mrow><mrow><mi mathvariant=\"normal\">K</mi></mrow></mfrac><mfenced separators=\"|\"><mrow><mn>2.4</mn></mrow></mfenced><mo>=</mo><mn>8</mn><mo>×</mo><mfrac><mrow><mn>0.693</mn></mrow><mrow><mi mathvariant=\"normal\">K</mi></mrow></mfrac><mo>=</mo><mn>8</mn><mi mathvariant=\"normal\"> </mi><msub><mrow><mi mathvariant=\"normal\">t</mi></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></msub></math> <br/><br/>So statements 2 and 4 are also correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, wo steps. E<sub>a</sub> for first step should be higher than second step as first is slow step. These requirements fulfilled by choice (ii) &amp; not choice (i) the choice (iv) is not possible because that is for endothermic reaction <math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mo>Δ</mo> <mtext>H</mtext> <mo>+</mo> <mtext>ve</mtext> </mrow> </mfenced> </mrow> </math>&amp; (ii) is single step equation so not possible.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c40a5452538a306e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "107", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What is the activation energy for the decomposition of <math><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>5</mn></mrow></msub></math> as,<br />\r<br />\r<math><msub><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>5</mn></mrow></msub><mo>⇌</mo><mn>2</mn><msub><mrow><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br />\r<br />\rIf the values of rate constant are&nbsp;<math><mo></mo><mn>3.45</mn><mo>×</mo><msup><mrow><mn>10</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup><mi>&nbsp;</mi></math>at <math><mn>27</mn><mi mathvariant=\"normal\">℃</mi></math> and&nbsp;<math><mo>=</mo><mn>6.9</mn><mo>×</mo     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
