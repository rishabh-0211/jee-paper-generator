msub><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi></mrow></msub></mrow></mfrac><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>1</mn></mrow></msub></math> <br/><br/> <math><msub><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi></mrow></msub></math>             ...(i)<br/><br/>and according to Raoult's law<br/><br/> <math><msub><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow></msub><mo>=</mo><msubsup><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msubsup><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msub></math>             ...(ii)<br/><br/>Now by equating (i) and (ii), we get<br/><br/> <math><msub><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi></mrow></msub><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msubsup><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msubsup><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msub></math> <br/><br/> <math><msub><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi></mrow></msub><mo>=</mo><mfrac><mrow><msubsup><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msubsup><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863fe7d7628fafaa941", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "47", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The weight of glucose dissolved in 100 gm of water produce same lowering of vapor pressure as 1 gm urea dissolved in <math><mn>50</mn><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">m</mi></math> of water at same temperature is", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "since same lowering in vapour pressure.<br /><math> <msub> <mtext>X</mtext> <mrow> <mtext>solute&nbsp;of&nbsp;urea&nbsp;</mtext></mrow> </msub> <mo>=</mo><msub> <mtext>X</mtext> <mrow> <mtext>solute&nbsp;of&nbsp;glucose&nbsp;</mtext></mrow> </msub> </math><br /><math> <mfrac> <mrow> <mfrac> <mn>1</mn> <mrow> <mn>60</mn></mrow> </mfrac> </mrow> <mrow> <mfrac> <mn>1</mn> <mrow> <mn>60</mn></mrow> </mfrac> <mo>+</mo><mfrac> <mrow> <mn>50</mn></mrow> <mrow> <mn>18</mn></mrow> </mfrac> </mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mfrac> <mi>w</mi> <mrow> <mn>180</mn></mrow> </mfrac> </mrow> <mrow> <mfrac> <mi>w</mi> <mrow> <mn>180</mn></mrow> </mfrac> <mo>+</mo><mfrac> <mrow> <mn>100</mn></mrow> <mrow> <mn>18</mn></mrow> </mfrac> </mrow> </mfrac> <mo>⇒</mo><mfrac> <mrow> <mfrac> <mn>1</mn> <mrow> <mn>60</mn></mrow> </mfrac> </mrow> <mrow> <mfrac> <mrow> <mn>50</mn></mrow> <mrow> <mn>18</mn></mrow> </mfrac> </mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mfrac> <mi>w</mi> <mrow> <mn>180</mn></mrow> </mfrac> </mrow> <mrow> <mfrac> <mrow> <mn>100</mn></mrow> <mrow> <mn>18</mn></mrow>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp;</mfrac></mrow></mfrac></math>(For dilute solution)<br /><math> <mo>⇒</mo><mtext> </mtext><mi>w</mi><mo>=</mo><mn>6</mn><mtext> </mtext><mtext>of</mtext><mtext> </mtext><mtext>glucose</mtext> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f9ed80fe9d395f95", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "At a constant temperature, which of the following aqueous solutions will have the maximum vapour pressure?<br />\r<math> <mrow> <mtext>(Mol</mtext><mtext>.</mtext><mtext> </mtext><mtext>wt</mtext><mtext>.</mtext><mtext> </mtext><mtext>NaCl&nbsp;=&nbsp;58</mtext><mtext>.5,</mtext><mtext> </mtext><msub> <mtext>H</mtext> <mtext>2</mtext> </msub> <msub> <mrow> <mtext>SO</mtext></mrow> <mtext>4</mtext> </msub> <mtext> </mtext><mtext>=</mtext><mtext> </mtext><mtext>98</mtext><msup> <mrow> <mtext>.0&nbsp;g&nbsp;mol</mtext></mrow> <mrow> <mo>−</mo><mtext>1</mtext></mrow> </msup> <mtext>)</mtext></mrow> </math>", "image": null}, "options": [{"id": "b38FQ", "text": "<math> <mrow>  <mtext>1&#x00A0;molal&#x00A0;NaCl&#x00A0;(aq)</mtext></mrow></math>", "image": null, "isCorrect": true}, {"id": "Yt7l7", "text": "<math> <mrow>  <mtext>1&#x00A0;molar&#x00A0;NaCl&#x00A0;(aq)</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "OzEDg", "text": "<math> <mrow>  <mtext>1</mtext><mtext>&#x2004;</mtext><mtext>molal</mtext><mtext>&#x2004;</mtext><msub>   <mtext>H</mtext>   <mn>2</mn>  </msub>  <msub>   <mrow>    <mtext>SO</mtext></mrow>   <mn>4</mn>  </msub>  <mtext>&#x00A0;</mtext><mfenced>   <mrow>    <mtext>aq</mtext></mrow>  </mfenced></mrow></math>", "image": null, "isCorrect": false}, {"id": "Wbv5r", "text": "<math> <mrow>  <mtext>1</mtext><mtext>&#x2004;</mtext><mtext>molar</mtext><mtext>&#x2004;</mtext><msub>   <mtext>H</mtext>   <mn>2</mn>  </msub>  <msub>   <mrow>    <mtext>SO</mtext></mrow>   <mn>4</mn>  </msub>  <mtext>&#x00A0;</mtext><mfenced>   <mrow>    <mtext>aq</mtext></mrow>  </mfenced></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "One molar <math> <mrow>  <mtext>(1</mtext><mtext>&#x2004;</mtext><mtext>M)</mtext></mrow></math> aqueous solution is more concentrated than one molal aqueous solution of the same solute. In solution, <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math> provides three ions. While <math > <mrow>  <mtext>NaCl</mtext></mrow></math> provides two ions. Hence, vapour pressure of solution of <math > <mrow>  <mtext>NaCl</mtext></mrow></math> is higher (as it gives less ions). Therefore, <math > <mrow>  <mtext>1</mtext><mtext>&#x2004;</mtext><mtext>molal</mtext><mtext>&#x2004;</mtext><mtext>NaCl</mtext></mrow></math> will have the maximum vapour pressure.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f1f8ce62ed3782e5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A current of dry air was passed first through a series of bulbs containing a solution of <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>6</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>5</mn></mrow></msub><mo>–</mo><mi mathvariant=\"normal\">N</mi><msub><mrow><mtext>O</mtext></mrow><mrow><mn>2</mn></mrow></msub></math> in ethanol of molality 0.725 and then through a series of bulbs containing pure ethanol. (T = 284 K) loss in weight of the solvent bulbs was 0.0685 g. Calculate the loss in weight of the solution bulbs.", "image": null}, "options": [{"id": "B2RHh", "text": "4.60 g", "image": null, "isCorrect": false}, {"id": "ewySi", "text": "5.20 g", "image": null, "isCorrect": false}, {"id": "l2aVY", "text": "2.50 g", "image": null, "isCorrect": false}, {"id": "aIjmi", "text": "2.05 g", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "If <math><msub><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></msub></math> and <math><msub><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>1</mn></mrow></msub></math> are the number of moles of solute and solvent<br />Then <math><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mtext>mM</mtext></mrow><mrow><mn>1000</mn></mrow></mfrac></math><br />Here m = molality<br />M = molar mass of the solvent.<br /><math> <mrow> <mfenced> <mrow> <mfrac> <mrow> <ms 020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A liquid is immiscible in water was steam distilled at 95.2<sup>o</sup>C at a pressure of 0.983 atm. What is the mass of the liquid present per gram of water in the distillate. Molar mass of the liquid is 134.3 g/mol and the vapour pressure of water is 0.84 atm. Also, Vapour pressure of pure liquid is 0.143 atm.", "image": null}, "options": [{"id": "IB2z1", "text": "1 g", "image": null, "isCorrect": false}, {"id": "vfrbF", "text": "1.27 g", "image": null, "isCorrect": true}, {"id": "dZSKv", "text": "0.787 g", "image": null, "isCorrect": false}, {"id": "xklbW", "text": "13.43 g", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <msub> <mtext>p</mtext> <mtext>T</mtext> </msub> <mo>=</mo> <mtext>0.983 atm</mtext> </mrow> </math><br /><br /><math> <mrow> <msubsup> <mtext>p</mtext> <mtext>water</mtext> <mo>∘</mo> </msubsup> <mo>=</mo> <mtext>0.84 atm</mtext> </mrow> </math><br /><br /><math> <mo>∴</mo> </math> <math> <mrow> <msubsup> <mtext>p</mtext> <mtext>liquid</mtext> <mo>∘</mo> </msubsup> <mo>=</mo> <mtext>0.143 atm</mtext> </mrow> </math><br /><br />Apply Dalton's law of vapour phase&nbsp;<br /><br /><math> <mrow> <mfrac> <mrow> <msup> <mtext>p</mtext> <mtext>o</mtext> </msup> <mtext>water</mtext> </mrow> <mrow> <msup> <mtext>p</mtext> <mtext>o</mtext> </msup> <mtext>liquid</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>0.84</mtext> </mrow> <mrow> <mtext>0.143</mtext> </mrow> </mfrac> <mo>=</mo> <mrow> <mfrac> <mrow> <msub> <mi>n</mi> <mrow> <msub> <mi>H</mi> <mn>2</mn> </msub> <mi>O</mi></mrow> </msub> </mrow> <mrow> <msub> <mi>n</mi> <mrow> <mi>L</mi><mi>i</mi><mi>q</mi><mi>u</mi><mi>i</mi><mi>d</mi></mrow> </msub> </mrow> </mfrac> </mrow> </mo></mrow></math><br /><br /><math> <mrow> <mfrac> <mrow> <mtext>0.84</mtext> </mrow> <mrow> <mtext>0.143</mtext> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mfrac> <mrow> <mtext>1</mtext> </mrow> <mrow> <mtext>18</mtext> </mrow> </mfrac> </mrow> <mrow> <mfrac> <mrow> <msub> <mtext>w</mtext> <mtext>e</mtext> </msub> </mrow> <mrow> <mtext>134.3</mtext> </mrow> </mfrac> </mrow> </mfrac> <mo>=</mo> <mfrac> <mrow> <mtext>134.3</mtext> </mrow> <mrow> <mtext>18</mtext> <mo>×</mo> <msub> <mtext>w</mtext> <mtext>e</mtext> </msub> </mrow> </mfrac> </mrow> </math><br /><br /><math> <mrow> <msub> <mtext>w</mtext> <mtext>e</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mtext>134.3</mtext> </mrow> <mrow> <mtext>18</mtext> </mrow> </mfrac> <mo>×</mo> <mfrac> <mrow> <mtext>0.143</mtext> </mrow> <mrow> <mtext>0.84</mtext> </mrow> </mfrac> <mo>=</mo> <mtext>1.27 g</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c224b91c539993ca", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two beaker A and B present in a closed vessel. Beaker A contains <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>152</mn><mo>.4</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">g</mi></math> aqueous solution of urea, containing <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">g</mi></math> of urea. Beaker B contains 196.2 g glucose solution, containing 18 g of glucose. Both solutions allowed to attain the equilibrium. Determine wt. % of glucose in it's solution at equilibrium:", "image": null}, "options": [{"id": "QhqpZ", "text": "6.71", "image": null, "isCorrect": false}, {"id": "ng3Xm", "text": "14.49", "image": null, "isCorrect": true}, {"id": "2I4qg", "text": "16.94", "image": null, "isCorrect": false}, {"id": "tmESc", "text": "20", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Mole fraction of urea in its solution<br /><br /><math><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>12</mn></mrow><mrow><mn>60</mn></mrow></mfrac></mrow><mrow><mfrac><mrow><mn>12</mn></mrow><mrow><mn>60</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>140</mn><mo>.</mo><mn>4</mn></mrow><mrow><mn>18</mn></mrow></mfrac></mrow></mfrac><mo>=</mo><mn>0.025</mn></math><br /><br />Mole fraction of glucose<br /><br /><math><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>18</mn></mrow><mrow><mn>180</mn></mrow></mfrac></mrow><mrow><mfrac><mrow><mn>18</mn></mrow><mrow><mn>180</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>178.2</mn></mrow><mrow><mn>18</mn></mrow></mfrac></mrow></mfrac><mo>=</mo><mn>0.01</mn></math><br /><br />Mole fraction of glucose is less so vapour pressure above the glucose solution will be higher than the pressure above urea solution, so some <math><msub><mrow><mtext>H</mtext></mrow><mrow><mn>2</mn></mrow></msub><mtext>O</mtext></math> molecules will transfer from glucose to urea side in order to make the solutions of equal mole fraction to attain equilibrium, let <math><mtext>x</mtext></math> moles <math><msub><mrow><mtext>H</mtext></mrow><mrow><mn>2</mn></mrow></msub><mtext>O</mtext></math> transferred<br /><br /><math><mo>∴</mo><mtext mathvariant=\"normal\">&nbsp;</mtext><mtext mathvariant=\"normal\">&nbsp;</mtext><mfrac><mrow><mn>0.2</mn></mrow><mrow><mn>0.2</mn><mo>+</mo><mn>7.8</mn><mo>+</mo><mtext mathvariant=\"normal\">x</mtext></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>0.1</mn></mrow><mrow><mn>0.1</mn><mo>+</mo><mn>9.9</mn><mo>-</mo><mtext mathvariant=\"normal\">x</mtext></mrow></mfrac><mo>⇒</mo><mtext mathvariant=\"normal\">x</mtext><mo>=</mo><mn>4</mn></math><br /><br />Now mass of glucose solution<br /><br /><math><mo>⇒</mo><mtext>&nbsp;</mtext><mn>196.2</mn><mo>-</mo><mn>4</mn><mo>×</mo><mn>18</mn><mo>=</mo><mn>124.2</mn></math><br /><br />wt% of glucose <math><mo>=</mo><mfrac><mrow><mn>18</mn></mrow><mrow><mn>124.2</mn></mrow></mfrac><mo>×</mo><mn>100</mn><mo>=</mo><mn>14.49</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c0ceafb6c79cfb5a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "90", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Mole fraction of the toluene in the vapour phase which is in equilibrium with a solution of benzene <math><mfenced separators=\"|\"><mrow><msup><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>=</mo><mn>120</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">r</mi></mrow></mfenced></math> and toluene <math><mfenced separators=\"|\"><mrow><msup><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>=</mo><mn>80</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">r</mi></mrow></mfenced></math> having 2.0 moles of each, is", "image": null}, "options": [{"id": "j9Utv", "text": "0.50", "image": null, "isCorrect": false}, {"id": "UDPl4", "text": "0.25", "image": null, "isCorrect": false}, {"id": "EtQJw", "text": "0.60", "image": null, "isCorrect": false}, {"id": "47khm", "text": "0.40", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Mole fraction of toluene vapour <math><mo>=</mo><mfra t> </msub> <mo>=</mo> <mn>1</mn> </mrow> </math><br /><br />Hence, <math> <mrow> <msub> <mtext>x</mtext> <mtext>B</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math>&nbsp;and&nbsp;<math> <mrow> <msub> <mtext>x</mtext> <mtext>A</mtext> </msub> <mo>=</mo> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </math><br /><br />Putting in Equation (i)<br /><br /><math> <mrow> <msub> <mtext>P</mtext> <mtext>T</mtext> </msub> <mo>=</mo> <mtext>0.4</mtext> <mo>×</mo> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>+</mo> <mtext>1.2</mtext> <mo>×</mo> <mfrac> <mrow> <mn>1</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mo>=</mo> <mtext>0.667 atm</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639bbc8b188b9f595f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "64", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following azeotropes is not correctly matched?", "image": null}, "options": [{"id": "fs37a", "text": "<math><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub></math>  (68%)  <math><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math>  (32%): Maximum boiling azeotrope, boiling point = 393.5 K", "image": null, "isCorrect": false}, {"id": "lLmZc", "text": "<math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math>  (43%) + HI (57%): Minimum boiling azeotrope, boiling point = 290 K", "image": null, "isCorrect": true}, {"id": "BtMlV", "text": "<math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>5</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></math>  (95.5%)  <math><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math>  (4.5%): Minimum boiling azeotrope, boiling point = 351.15 K", "image": null, "isCorrect": false}, {"id": "S0VDY", "text": "Chloroform (93.2%)  <math><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>5</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></math>  (6.8%): Minimum boiling azeotrope, boiling point = 332.3 K", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math>  (43%) and HI (57%) make maximum boiling azeotropic mixture on boiling at 400 K.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863802993dcf520c355", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The boiling point of an azeotropic mixture of water and ethyl alcohol is less than that of theoretical value of water and alcohol mixture. Hence, the mixture shows", "image": null}, "options": [{"id": "X4HRr", "text": "that solution is highly saturated", "image": null, "isCorrect": false}, {"id": "U5Feb", "text": "positive deviation from Raoult's law", "image": null, "isCorrect": true}, {"id": "tE85B", "text": "negative deviation from Raoult's law", "image": null, "isCorrect": false}, {"id": "SEq5e", "text": "nothing can be said", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The boiling point of an azeotropic mixture of water and ethyl alcohol is less than that of theoretical value of water and alcohol mixture. Hence, the mixture shows positive deviation from Raoult's law.<br/><br/>Positive deviations from Raoult's law are noticed when<br/><br/>(i) Exp. vaue of vapour pressure of mixture is more than calculated value.<br/><br/>(ii) Exp. value of boiling point of mixture is less than calculated value.<br/><br/>(iii)  <math><mi mathvariant=\"normal\">Δ</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">x</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">g</mi></mrow></msub><mo>=</mo><mo>+</mo><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi></math> <br/><br/>(iv)  <math><mi mathvariant=\"normal\">Δ</mi><msub><mrow><mi mathvariant=\"normal\">V</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">x</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">g</mi></mrow></msub><mo>=</mo><mo>+</mo><mi mathvariant=\"normal\">v</mi><mi mathvariant=\"normal\">e</mi></math> .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637e6e6356fe7cc913", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "103", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following can show positive deviation from Raoult's law?", "image": null}, "options": [{"id": "nLEi3", "text": "Water-hydrochloric acid", "image": null, "isCorrect": false}, {"id": "l4BbE", "text": "Water-nitric acid", "image": null, "isCorrect": true}, {"id": "uuxG9", "text": "Benzene-methanol", "image": null, "isCorrect": false}, {"id": "jEcco", "text": "Acetone-chloroform", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In solution showing positive type of deviation the partial pressure of&nbsp;solution is greater than the vapour pressure as expected according to Raoult's law.&nbsp;In solution of methanol &amp; benzene methanol molecules are held together due to hydrogen&nbsp;bonding as shown below. On adding benzene, the benzene molecules get in between the&nbsp;molecule of methanol thus breaking the hydrogen bonds. As the resulting solution has weak&nbsp;intermolecular attraction, the escaping tendency of alcohol and benzene molecule from the&nbsp;solution increases. Consequently the vapour pressure of the solution is greater than the&nbsp;vapour pressure as expected from Raoult's law.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637c68f050f86b824b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "61", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Intramolecular forces between n-hexane and n-heptane are n ow></msub><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">X</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi></mrow></msub><msubsup><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msubsup><mo>=</mo><mn>0.5</mn><mo>×</mo><mn>60</mn></math>  torr = 30 torr<br/><br/>Hence, vapour pressure of solution = 80 torr + 30 torr = 110 torr<br/><br/>According to Dalton's law of partial pressure,<br/><br/>Partial vapour pressure of toluene,<br/><br/> <math><msub><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi></mrow></msub><mo>=</mo></math>  mole fraction of touene in vapour phase  <math><mo>×</mo></math>  total pressure  <math><mfenced separators=\"|\"><mrow><msub><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi></mrow></msub></mrow></mfenced></math> <br/><br/>or mole fraction of toluene in vapour phase  <math><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">l</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>30</mn><mtext> torr</mtext></mrow><mrow><mn>110</mn><mtext> torr</mtext></mrow></mfrac><mo>=</mo><mn>0.27</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86333c159c568086ff0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "48", "isVisible": true}], "previousYear row></math>", "image": null, "isCorrect": false}, {"id": "OzEDg", "text": "<math> <mrow>  <mtext>1</mtext><mtext>&#x2004;</mtext><mtext>molal</mtext><mtext>&#x2004;</mtext><msub>   <mtext>H</mtext>   <mn>2</mn>  </msub>  <msub>   <mrow>    <mtext>SO</mtext></mrow>   <mn>4</mn>  </msub>  <mtext>&#x00A0;</mtext><mfenced>   <mrow>    <mtext>aq</mtext></mrow>  </mfenced></mrow></math>", "image": null, "isCorrect": false}, {"id": "Wbv5r", "text": "<math> <mrow>  <mtext>1</mtext><mtext>&#x2004;</mtext><mtext>molar</mtext><mtext>&#x2004;</mtext><msub>   <mtext>H</mtext>   <mn>2</mn>  </msub>  <msub>   <mrow>    <mtext>SO</mtext></mrow>   <mn>4</mn>  </msub>  <mtext>&#x00A0;</mtext><mfenced>   <mrow>    <mtext>aq</mtext></mrow>  </mfenced></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "One molar <math> <mrow>  <mtext>(1</mtext><mtext>&#x2004;</mtext><mtext>M)</mtext></mrow></math> aqueous solution is more concentrated than one molal aqueous solution of the same solute. In solution, <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math> provides three ions. While <math > <mrow>  <mtext>NaCl</mtext></mrow></math> provides two ions. Hence, vapour pressure of solution of <math > <mrow>  <mtext>NaCl</mtext></mrow></math> is higher (as it gives less ions). Therefore, <math > <mrow>  <mtext>1</mtext><mtext>&#x2004;</mtext><mtext>molal</mtext><mtext>&#x2004;</mtext><mtext>NaCl</mtext></mrow></math> will have the maximum vapour pressure.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f1f8ce62ed3782e5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previou mn>0.725</mn><mo>×</mo><mn>46</mn></mrow> <mrow> <mn>1000</mn></mrow> </mfrac> <mtext>&nbsp;i</mtext><mtext>.&nbsp;e</mtext><mo>.</mo><mo>,</mo><mn>0.0334</mn></mrow> </math><br />Thus<br />Weight loss in solution bulb <math><mo>∝</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></msub></math><br />Weight loss in solution bulb <math><mo>∝</mo><msup><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></msub></math><br />Now<em>,</em> <math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></math><br /><math><mo>⇒</mo><mfrac><mrow><mn>0.0685</mn></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></msub></mrow></mfrac><mo>=</mo><mn>0.0334</mn></math><br /><math><mo>∴</mo><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mi mathvariant=\"normal\">s</mi></mrow></msub><mo>=</mo><mn>2.05</mn><mi></mi><mtext>g</mtext></math><br /><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ef60998d0ec6e16b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "96", "isVisible": true}], "pre nd <math> <mrow> <mn>400</mn><mn> </mn><mi mathvariant=\"normal\">g</mi></mrow> </math> of water boils at <math> <mrow> <mn>100</mn><msup> <mrow> <mn>.256</mn></mrow> <mn>o</mn> </msup> <mi mathvariant=\"normal\">C</mi></mrow> </math> at <math> <mrow> <mn>1</mn><mn> </mn><mi mathvariant=\"normal\">atm</mi></mrow> </math>. The molecular weight of the solute <math> <mrow> <mn>(in </mn><mn> </mn><mn>g/mol)</mn></mrow> </math> is<br />\rGiven: (<math><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mi mathvariant=\"normal\">b</mi></mrow></msub></math> for water <math><mn>0.512&nbsp;</mn> <mrow><mrow><mmultiscripts><mrow><mi mathvariant=\"normal\">C</mi></mrow><mprescripts></mprescripts><mrow><mi>&nbsp;</mi></mrow><mrow><mi mathvariant=\"normal\">ο</mi></mrow></mmultiscripts></mrow><mo>/</mo><mrow><mi mathvariant=\"normal\">m</mi></mrow></mrow></math>)", "image": null}, "options": [], "correctValue": "50", "solution": {"text": "<math><mi mathvariant=\"normal\">Δ</mi><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">b</mi></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">i</mi><mo>×</mo><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mi mathvariant=\"normal\">b</mi></mrow></msub><mo>×</mo><mi mathvariant=\"normal\">m</mi></math><br /><math><mn>0.256</mn><mo>=</mo><mn>1</mn><mo>×</mo><mn>0.512</mn><mo>×</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mfrac><mrow><mn>10.0</mn></mrow><mrow><mi mathvariant=\"normal\">M</mi></mrow></mfrac></mrow><mrow><mn>0.4</mn></mrow></mfrac></mrow></mfenced></math><br /><math><mi mathvariant=\"normal\">M</mi><mo>=</mo><mfrac><mrow><mn>0.512</mn><mo>×</mo><mn>10.0</mn></mrow><mrow><mn>0.4</mn><mo>×</mo><mn>0.256</mn></mrow></mfrac></math><br /><math> <mrow>  <mtext>M</mtext><mo>=</mo><mn>50</mn><mtext>&#x2004;</mtext><mtext>g/mol</mtext></mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86385f607d5b66bdeda", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "99", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mn>3</mn></mrow></msub></math> on reaction with <math><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>[</mo><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">e</mi><mfenced close=\"]\" separators=\"|\"><mrow><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">N</mi><msub><mrow><mo>)</mo></mrow><mrow><mn>6</mn></mrow></msub></mrow></mfenced></math> in aqueous solution gives blue colour. These are separated by a semipermeable membrane AB as shown. Due to osmosis there is<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/c0ba3231-c241-436f-a333-5386464dc3e3.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width:2.65833in;height:1.78333in\" />", "image": null}, "options": [{"id": "E0lNY", "text": "blue colour formation in side X", "image": null, "isCorrect": false}, {"id": "KGCG5", "text": "blue colour formation in side Y", "image": null, "isCorrect": false}, {"id": "nbsHw", "text": "blue colour formation in both of the side X and Y", "image": null, "isCorrect": false}, {"id": "Kj74O", "text": "no blue colour formation", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "There will be no blue colour formation because in the process of osmosis, solvent molecules migrate across the membrane and not solute molecules.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638312eb89180c8e67", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "57", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "1.22 g C<sub>6</sub>H<sub>5</sub>COOH is added into the 100 g solvent CH<sub>3</sub>COCH<sub>3</sub> where data of Δ T<sub>b</sub><sub>&nbsp; </sub>and K<sub>b</sub> are given as:<br />\rΔT<sub>b</sub> = 0.17, solute by K<sub>b</sub> = 1.7 K kg/mol<br />\rFind out the molecular weight (g/mol) of the solute in the solution by interpreting the result.", "image": null}, "options": [], "correctValue": "122", "solution": {"text": "<math> <mrow> <mo>Δ</mo> <msub> <mtext>T</mtext> <mtext>b</mtext> </msub> <mo>=</mo> <mtext>0.17</mtext> <mo>=</mo> <msub> <mtext>K</mtext> <mtext>b</mtext> </msub> <mo>·</mo> <mtext>m</mtext> </mrow> </math><br /><math> <mrow> <mtext>0.17</mtext> <mo>=</mo> <mtext>1.7</mtext> <mo>×</mo> <mfrac> <mrow> <mtext>1.22/M</mtext> </mrow> <mrow> <mtext>100/1000</mtext> </mrow> </mfrac> </mrow> </math><br />M = 122 g/mole<br />Benzoic acid is not associated or dissociated.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86376e4208c555b0d84", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "68", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "1 g of a monobasic acid (HA) in 100 g water lowers the freezing point by 0.1 K. If 0.75 g of same acid requires 15 ml of <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math> N NaOH solution for complete neutralization, then % degree of ionization of acid in water is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><msub><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">f</mi></msub><mi mathvariant=\"normal\">&nbsp;</mi><mi>of</mi><mi mathvariant=\"normal\">&nbsp;</mi><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">O</mi><mo>=</mo><mn>1</mn><mo>.86</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">K</mi><mi>kg</mi><msup><mi>mol</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfenced></math>", "image": null}, "options": [{"id": "trtWw", "text": "0.22", "image": null, "isCorrect": false}, {"id": "ogUOY", "text": "0.25", "image": null, "isCorrect": false}, {"id": "iP5YJ", "text": "0.34", "image": null, "isCorrect": true}, {"id": "ihrro", "text": "0.50", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Normal molecular weight of acid can be found as<br /><br />Meq of acid = Meq of NaOH<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>1</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>2</mn></msub><mo>;</mo><mo>&nbsp;&nbsp;</mo><msub><mi mathvariant=\"normal\">N</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>1</mn></msub><mo>=</mo><msub><mi mathvariant=\"normal\">M</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">V</mi><mn>2</mn></msub></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>0</mn><mo>.75</mo></mrow><msub><mi mathvariant=\"normal\">M</mi><mi>acid</mi></msub></mfrac><mo>×</mo><mn>1000</mn><mo>=</mo><mn>15</mn><mo>×</mo><mfrac><mn>1</mn><mn>5</mn></mfrac><mo>;</mo><mo>&nbsp;&nbsp;</mo><msub><mi mathvariant=\"normal\">M</mi><mi>acid</mi></msub><mo>=</mo><mn>250</mn></math><br /><br />Observed molecular weight of acid can be formed as<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∆</mo><msub><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">f</mi></msub><mo>=</mo><msub><mi mathvariant=\"normal\">K</mi><mi mathvariant=\"normal\">f</mi></msub><mfrac><msub><mi mathvariant=\"normal\">W</mi><mi>acid</mi></msub><msub><mi mathvariant=\"normal\">M</mi><mi>acid</mi></msub></mfrac><mo>×</mo><mfrac><mn>1000</mn><msub><mi mathvariant=\"normal\">W</mi><mi>solvent</mi></msub></mfrac><mo>×</mo><mi mathvariant=\"normal\">i</mi><mo>&nbsp;&nbsp;</mo><mo>;</mo><mo>&nbsp;&nbsp;</mo><mo>&nbsp;&nbsp;</mo><mn>0</mn><mo>.1</mo><mo>=</mo><mn>1</mn><mo>.86</mo><mo>×</mo><mfrac><mn>1</mn><mn>250</mn></mfrac><mo>×</mo><mfrac><mn>1000</mn><mn>100</mn></mfrac><mo>×</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mi mathvariant=\"normal\">α</mi></mrow></mfenced></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>.34</mo><mo>=</mo><mn>1</mn><mo>+</mo><mi mathvariant=\"normal\">α</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">α</mi><mo>=</mo><mn>0</mn><mo>.34</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86375461cbb82da80cc", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "70", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What is the correct sequence of the increasing order of freezing points at one atmosphere of the following 1.0 M aqueous solution? <br/><math><mn>1</mn><mo>.</mo></math> Urea, <math><mn>2</mn><mo>.</mo></math> Sodium chloride, <math><mi></mi><mn>3</mn><mo>.</mo></math> Sodium sulphate, <math><mn>4</mn><mo>.</mo></math> Sodium phosphate. <br/>Select the correct answer using the codes given below", "image": null}, "options": [{"id": "7PxqI", "text": "4, 3, 1, 2", "image": null, "isCorrect": false}, {"id": "8nQRS", "text": "3, 4, 2, 1", "image": null, "isCorrect": false}, {"id": "j2aop", "text": "3, 4, 1, 2", "image": null, "isCorrect": false}, {"id": "JrJqe", "text": "4, 3, 2, 1", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "vant Hoff factors for urea, NaCl, <math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math> and <math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">P</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math> are 1, 2, 3 and 4 respectively. <br/>As <math><mi mathvariant=\"normal\">Δ</mi><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub><mo>∝</mo><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">m</mi></math> , so <math><mi mathvariant=\"normal\">Δ</mi><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mi mathvariant=\"normal\">f</mi></mrow></msub></math> for urea, NaCl, <math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math> and <math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">P</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math> are proportional to 1, 2, 3 and 4 respectively. Hence, freezing point order is <math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">P</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>&lt;</mo><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi><mo>&lt;</mo></math> Urea", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863732efdcfd4f6082e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "42", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The freezing point of equimolal aqueous solution will be highest for", "image": null}, "options": [{"id": "XoQ3E", "text": "<math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>6</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>5</mn></mrow></msub><msup><mrow><mi mathvariant=\"normal\">N</mi></mrow><mrow><mo>+</mo></mrow></msup><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">C</mi><msup><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mo>-</mo></mrow></msup></math> (aniline hydrochloride)", "image": null, "isCorr     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
