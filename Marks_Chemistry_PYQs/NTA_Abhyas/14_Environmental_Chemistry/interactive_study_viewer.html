text": "It reacts with <math> <mrow>  <msub>   <mtext>O</mtext>   <mtext>2</mtext>  </msub>  </mrow></math> and <math> <mrow>  <msub>   <mtext>H</mtext>   <mtext>2</mtext>  </msub>  <mtext>O</mtext></mrow></math> to produce acid rain", "image": null, "isCorrect": true}, {"id": "kkKuL", "text": "It is a strong oxidant and oxidizes other components of atmosphere", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow>  <msub>   <mrow>    <mtext>SO</mtext></mrow>   <mtext>2</mtext>  </msub>  </mrow></math> is considered as air pollutant because it reacts with <math> <mrow>  <msub>   <mtext>O</mtext>   <mtext>2</mtext>  </msub>  </mrow></math> and <math> <mrow>  <msub>   <mtext>H</mtext>   <mtext>2</mtext>  </msub>  <mtext>O</mtext></mrow></math> to produce acid rain. Oxides from nitrogen and sulphur, released into the atmosphere from thermal power plants, industries and automobiles are the main sources of acid rain. These oxides on oxidation followed by hydrolysis give sulphuric acid and nitric acid that get dissolved in rain water and&nbsp;are responsible for the acidity of rain.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632945690e4f53c039", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "10", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>A petroleum fraction having boiling range <math>\r <mrow>\r  <mtext>70</mtext><mo>&#x2212;</mo><msup>\r   <mrow>\r    <mtext>200</mtext></mrow>\r   <mtext>o</mtext>\r  </msup>\r  <mtext>&#x2004;</mtext><mtext>C</mtext></mrow>\r</math>\r and containing <math> <mrow> <mtext>6</mtext><mo>−</mo><mtext>10</mtext></mrow> </math> carbon atoms per molecule is called</p>\r", "image": null}, "options": [{"id": "vJnmK", "text": "Natural gas", "image": null, "isCorrect": false}, {"id": "W0KSf", "text": "Gas oil", "image": null, "isCorrect": false}, {"id": "0igR5", "text": "Gasoline", "image": null, "isCorrect": true}, {"id": "58Zyy", "text": "Kerosene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The bulk of a typical gasoline consists of hydrocarbons with between <math > <mn>4</mn></math> and <math > <mrow>  <mn>12</mn></mrow></math> carbon atoms per molecule (commonly referred to as <math > <mrow>  <mtext>C4</mtext><mo>&#x2212;</mo><mtext>C12</mtext></mrow></math>). It is a mixture of paraffins (alkanes), cycloalkanes (naphthenes), and olefins (alkenes), where the usage of the terms paraffin and olefin is particular to the oil industry. The actual ratio depends on:</p><ul>\t<li>The oil refinery that makes the gasoline, as not all refineries have the same set of processing units;</li>\t<li>The crude oil feed used by the refinery;</li>\t<li>The grade of gasoline, in particular, the octane rating.</li></ul><p>Below carbon atoms per molecule are mentioned.</p><p><strong>(i)</strong> Gasoline <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>6</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>10</mn></mrow></msub></math><br /><br /><strong>(ii) </strong>Kerosene <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>10</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>13</mn></mrow></msub></math><br /><br /><strong>(iii)</strong> Gas oil <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>13</mn></mrow></msub><mo>-</mo><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>18</mn></mrow></msub></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear"       const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
