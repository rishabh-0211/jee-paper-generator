zing agent in acidic solution decreases in the following order<br /><math><msub><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mn>2</mn></mrow></msub><msubsup><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>8</mn></mrow><mrow><mn>2</mn><mo>-</mo></mrow></msubsup><mo>&gt;</mo><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">n</mi><msubsup><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow><mrow><mo>-</mo></mrow></msubsup><mo>&gt;</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">r</mi></mrow><mrow><mn>2</mn></mrow></msub><msubsup><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>7</mn></mrow><mrow><mn>2</mn><mo>-</mo></mrow></msubsup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86355350960d820bf9b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "68", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following acts as both reducing and oxidising agents?", "image": null}, "options": [{"id": "Bmb27", "text": "<math><msub><mrow><mtext>H</mtext></mrow><mrow><mn>2</mn></mrow></msub><mtext>S</mtext><msub><mrow><mtext>O</mtext></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "IfhoT", "text": "<math><mtext>H</mtext><mtext>N</mtext><msub><mrow><mtext>O</mtext></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "Hl1Qg", "text": "<math><msub><mrow><mtext>H</mtext></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mtext>O</mtext></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": true}, {"id": "Ma4qV", "text": "<math><mtext>K</mtext><mtext>M</mtext><mtext>n</mtext><msub><mrow><mtext>O</mtext></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In <math><mo>(</mo><mtext>a</mtext><mo>)</mo><mo>,</mo></math> <math><mo>(</mo><mtext>b</mtext><mo>)</mo></math> and <math><mfenced separators=\"|\"><mrow><mtext>d</mtext></mrow></mfenced><mo>;</mo></math> Sulphur, nitrogen and Mn are in their maximum oxidation state, so they can only be reduced and thus can act only as oxidising agent.<br /><br /><math><mo>(</mo><mtext>c</mtext><mo>)</mo></math> only <math><msub><mrow><mtext>H</mtext></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mtext>O</mtext></mrow><mrow><mn>2</mn></mrow></msub></math> will act as both.<br /><br />(i) In case of oxidising agent<br /><br /><math><msub><mrow><mtext>H</mtext></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mtext>O</mtext></mrow><mrow><mn>2</mn></mrow></msub></math> itself get reduced:<br /><br />e.g.,<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/321125_3_.png\" style=\"width: 172px; height: 40px;\" /><br /><br />(ii) In case of reducing agent <math><msub><mrow><mtext>H</mtext></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mtext>O</mtext></mrow><mrow><mn>2</mn></mrow></msub></math> itself get oxidise<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/321125_2_.png\" style=\"width: 129px; height: 39px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86312da64e09d3b6350", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following acts as an oxidising as well as reducing agent?", "image": null}, "options": [{"id": "Asm07", "text": "<math><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">a</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math>", "image": null, "isCorrect": false}, {"id": "fnLgw", "text": "<math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "CeFlB", "text": "<math><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "5wpZB", "text": "<math><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "As in <math><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></math> , <math> <mtext>N</mtext> </math> is in <math> <mrow> <mtext>+3</mtext></mrow> </math> oxidation state but nitrogen can have oxidation states from <math> <mrow> <mo>−</mo><mtext>3</mtext></mrow> </math> to <math> <mrow> <mo>+</mo><mn>5</mn></mrow> </math> so it is in between the maximum and minimum oxidation state hence it can either get reduced or oxidized, depending on the conditions. It means it can act both as an oxidizing and a reducing agent. It can work both as oxidising as well as reducing agent.<br />(I) As an oxidising agent:<br /><math><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow>< />Then, <math><mo>(</mo><mo>+</mo><mn>3</mn><mo>)</mo><mtext>a</mtext><mo>+</mo><mo>(</mo><mo>+</mo><mn>5</mn><mo>)</mo><mtext>b</mtext><mo>+</mo><mo>(</mo><mo>-</mo><mn>2</mn><mo>)</mo><mtext>c</mtext><mo>=</mo><mn>0</mn></math><br /><br />Or<br /><br /><math><mn>3</mn><mtext>a</mtext><mo>+</mo><mn>5</mn><mtext>b</mtext><mo>-</mo><mn>2</mn><mtext>c</mtext><mo>=</mo><mn>0</mn></math><br /><br />Now, putting values of a, b and c for all the given options, which will give sum equal to zero, will be our formula.<br /><br />(a) For, <math><msub><mrow><mtext>X</mtext></mrow><mrow><mn>2</mn></mrow></msub><mtext>Y</mtext><mtext>Z</mtext></math><br /><br /><math><mtext>a</mtext><mo>=</mo><mn>2</mn></math><br /><br /><math><mtext>b</mtext><mo>=</mo><mn>1</mn></math><br /><br /><math><mtext>c</mtext><mo>=</mo><mn>1</mn></math><br /><br />Thus, <math><mn>3</mn><mtext>a</mtext><mo>+</mo><mn>5</mn><mtext>b</mtext><mo>-</mo><mn>2</mn><mtext>c</mtext><mo>=</mo><mn>0</mn></math><br /><br /><math><mn>3</mn><mo>×</mo><mn>2</mn><mo>+</mo><mn>5</mn><mo>-</mo><mn>2</mn><mo>≠</mo><mn>0</mn></math><br /><br />(b) For, <math><mtext>X</mtext><mtext>Y</mtext><msub><mrow><mtext>Z</mtext></mrow><mrow><mn>3</mn></mrow></msub></math><br /><br /><math><mtext>a</mtext><mo>=</mo><mn>1</mn><mo>,</mo><mtext>b</mtext><mo>=</mo><mn>1</mn><mo>,</mo><mtext>c</mtext><mo>=</mo><mn>3</mn></math><br /><br /><math><mn>3</mn><mtext>a</mtext><mo>+</mo><mn>5</mn><mtext>b</mtext><mo>-</mo><mn>2</mn><mtext>c</mtext><mo>=</mo><mn>0</mn></math><br /><br /><math><mn>3</mn><mo>+</mo><mn>5</mn><mo>-</mo><mn>6</mn><mo>≠</mo><mn>0</mn></math><br /><br />(c) <math><msub><mrow><mtext>X</mtext></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mo>(</mo><mtext>Y</mtext><msub><mrow><mtext>Z</mtext></mrow><mrow><mn>4</mn></mrow></msub><mo>)</mo></mrow><mrow><mn>3</mn></mrow></msub></math><br /><br /><math><mtext>a</mtext><mo>=</mo><mn>3</mn><mo>,</mo><mtext>b</mtext><mo>=</mo><mn>3</mn><mo>,</mo><mtext>c</mtext><mo>=</mo><mn>12</mn></math><br /><br /><math><mn>3</mn><mtext>a</mtext><mo>+</mo><mn>5</mn><mtext>b</mtext><mo>-</mo><mn>2</mn><mtext>c</mtext><mo>=</mo><mn>0</mn></math><br /><br /><math><mo>(</mo><mn>3</mn><mo>×</mo><mn>3</mn><mo>+</mo><mn>5</mn><mo>×</mo><mn>3</mn><mo>)</mo><mo>-</mo><mo>(</mo><mn>2</mn><mo>×</mo><mn>12</mn><mo>)</mo><mo>=</mo><mn>0</mn></math><br /><br /><math><mn>9</mn><mo>+</mo><mn>15</mn><mo>-</mo><mn>24</mn></math><br /><br /><math><mn>24</mn><mo>-</mo><mn>24</mn><mo>=</mo><mn>0</mn></math><br /><br />(d) <math><msub><mrow><mtext>X</mtext></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mtext>Y</mtext></mrow><mrow><mn>2</mn></mrow></msub><mtext>Z</mtext></math><br /><br /><math><mtext>a</mtext><mo>=</mo><mn>2</mn><mo>,</mo><mtext>b</mtext><mo>=</mo><mn>2</mn><mo>,</mo><mtext>c</mtext><mo>=</mo><mn>1</mn></math><br /><br /><math><mn>3</mn><mtext>a</mtext><mo>+</mo><mn>5</mn><mtext>b</mtext><mo>-</mo><mn>2</mn><mtext>c</mtext><mo>=</mo><mn>0</mn></math><br /><br /><math><mo>(</mo><mn>3</mn><mo>×</mo><mn>2</mn><mo>)</mo><mo>+</mo><mo>(</mo><mn>5</mn><mo>×</mo><mn>2</mn><mo>)</mo><mo>-</mo><mo>(</mo><mn>2</mn><mo>×</mo><mn>1</mn><mo>)</mo><mo>=</mo><mn>0</mn></math><br /><br /><math><mn>6</mn><mo>+</mo><mn>10</mn><mo>-</mo><mn>2</mn><mo>≠</mo><mn>0</mn></math><br /><br />Hence, option (c) is the correct answer.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a51f0f021997bf94", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "96", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Find the values of  <math><mi mathvariant=\"normal\">x</mi><mo>,</mo><mo> </mo><mi mathvariant=\"normal\">y</mi><mo>,</mo><mo> </mo><mi mathvariant=\"normal\">z</mi></math>  in the given balanced equation  <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>+</mo><mi mathvariant=\"normal\">x</mi><mo> </mo><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">I</mi><mo>→</mo><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">S</mi><mo>+</mo><mi mathvariant=\"normal\">y</mi><mo> </mo><msub><mrow><mi mathvariant=\"normal\">I</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><mi mathvariant=\"normal\">z</mi><mo> </mo><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">O</mi></math> ,", "image": null}, "options": [{"id": "Qf4vI", "text": "<math><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>3</mn><mo>,</mo><mi mathvariant=\"normal\">y</mi><mo>=</mo><mn>5</mn><mo>,</mo><mi mathvariant=\"normal\">z</mi><mo>=</mo><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "wZNaz", "text": "<math><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>4</mn><mo>,</mo><mi mathvariant=\"normal\">y</mi><mo>=</mo><mn>8</mn><mo>,</mo><mi mathvariant=\"normal\">z</mi><mo>=</mo><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "rB1v5", "text": "<math><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>8</mn><mo>,</mo><mi mathvariant=\"normal\">y</mi><mo>=</mo><mn>4</mn><mo>,</mo><mi mathvariant=\"normal\">z</mi><mo>=</mo><mn>4</mn></math>", "image": null, "isCorrect": true}, {"id": "Md9CA", "text": "<math><mi mathvariant=\"normal\">x</mi><mo>=</mo><mn>5</mn><mo>,</mo><mi mathvariant=\"normal\">y</mi><mo>=</mo><mn>3</mn><mo>,</mo><mi mathvariant=\"normal\">z</mi><mo>=</mo><mn>4</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Sulphur gains 8 electron in reduction and iodide ion lo     function renderQuestions(questions) {

        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';

            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">

                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';

        const val = q.correctValue;
