msub>  </mrow></math>", "image": null, "isCorrect": true}, {"id": "P82yh", "text": "<math> <mrow>  <msub>   <mrow>    <mtext>CH</mtext></mrow>   <mtext>3</mtext>  </msub>  <mtext>COOH,</mtext><mtext>&#x2004;</mtext><msub>   <mtext>H</mtext>   <mtext>2</mtext>  </msub>  <msub>   <mrow>    <mtext>SO</mtext></mrow>   <mtext>4</mtext>  </msub>  </mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow>  <mtext>Propan-1-ol</mtext></mrow></math> can be prepared from propene by using <math> <mrow>  <msub>   <mtext>B</mtext>   <mtext>2</mtext>  </msub>  <msub>   <mtext>H</mtext>   <mtext>6</mtext>  </msub>  </mrow></math> followed by <math> <mrow>  <msub>   <mtext>H</mtext>   <mtext>2</mtext>  </msub>  <msub>   <mtext>O</mtext>   <mtext>2</mtext>  </msub>  </mrow></math><br /><br /><math> <mrow>  <msub>   <mrow>    <mtext>6CH</mtext></mrow>   <mtext>3</mtext>  </msub>  <mo>&#x2212;</mo><mtext>CH</mtext><mtext>&#x2004;</mtext><mtext>=</mtext><mtext>&#x2004;</mtext><msub>   <mrow>    <mtext>CH</mtext></mrow>   <mtext>2</mtext>  </msub>  <mtext>&#x2004;</mtext><mtext>+</mtext><mtext>&#x2004;</mtext><msub>   <mtext>B</mtext>   <mtext>2</mtext>  </msub>  <msub>   <mtext>H</mtext>   <mtext>6</mtext>  </msub>  <mover>   <mo>&#x2192;</mo>   <mrow>    <msub>     <mtext>H</mtext>     <mtext>2</mtext>    </msub>    <msub>     <mtext>O</mtext>     <mtext>2</mtext>    </msub>    </mrow>  </mover>  <msub>   <mrow>    <mtext>CH</mtext></mrow>   <mtext>3</mtext>  </msub>  <mo>&#x2212;</mo><msub>   <mrow>    <mtext>CH</mtext></mrow>   <mtext>2</mtext>  </msub>  <mo>&#x2212;</mo><msub>   <mrow>    <mtext>CH</mtext></mrow>   <mtext>2</mtext>  </msub>  <mtext>OH</mtext></mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e9b99ace407e8ad6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "28", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Terpinen-4-ol is an active ingredient in tea tree oil has the following structure<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ugbxfyjjixivbzwcajnmelzjulwbmxosblgmlorphmyohuwvin.jpeg\" /><br />\r<br />\rThe correct observations for terpinen-4-ol is/are<br />\r<br />\rI. It rotates the plane of plane polarized light.<br />\r<br />\rII. It reacts with Baeyer's reagent to form form a triol<br />\r<br />\rIII. On reaction with NaBr and <math><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">S</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>4</mn></mrow></msub></math> , it gives a di bromo compound<br />\r<br />\rIV. On ozonolysis it gives a compound with molecular formula <math><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>10</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>18</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null}, "options": [{"id": "Isc12", "text": "I, II, III and IV", "image": null, "isCorrect": true}, {"id": "PDrPh", "text": "I, III and IV", "image": null, "isCorrect": false}, {"id": "ZXzaU", "text": "II and III", "image": null, "isCorrect": false}, {"id": "cd5mI", "text": "III and IV", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mo>(</mo><mi mathvariant=\"normal\">I</mi><mo>)</mo></math>  Terpinen-4-ol is an optically active molecule because it is chiral molecule<br/><br/>        (II)  <img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/udedlgegxntqkohrpaopupbflqsprhteiqwjkstrhddgzxatpz.jpeg\"/> <br/><br/>(III)  <img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/nkhhunvbygilwrbyosrxhwtwhgnwbxhvotzncvlwssiimacafk.jpeg\"/> <br/><br/>(IV)  <img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/dkrciuywzzpoynowygmotjclzjauhehaapmdzylmrvpyehjyvn.jpeg\"/>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e4de46fa60933db8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "96", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the given statement is not correct", "image": null}, "options": [{"id": "GdRMq", "text": "Phenol is more acidic than acetic acid", "image": null, "isCorrect": true}, {"id": "TSMlr", "text": "Ethanol is less acidic than phenol", "image": null, "isCorrect": false}, {"id": "hnJbi", "text": "Ethanol has lower boiling point than ethane", "image": null, "isCorrect": false}, {"id": "h7iK7", "text": "Ethyne is a non-linear molecule", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Phenols are much more acidic than alcohols but less so than carboxylic acids or even carbonic acid. This is indicated by the values of ionisation constants. The relative acidity follows the order:<br/><br/> <math><msub><mrow><mi mathvariant=\"normal\">K</mi></mrow><mrow><mi mathvariant=\"normal\">a</mi></mrow></msub><munder><mrow><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></munder><mo>&gt;</mo><munder><mrow><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>7</mn></mrow></msup></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></munder><mo>&gt;</mo><munder><mrow><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>10</mn></mrow></msup></mrow><mrow><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>6</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>5</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></munder><mo>&gt;</mo><munder><mrow><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>14</mn></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></munder><mo>&gt;</mo><munder><mrow><mn>1</mn><msup><mrow><mn>0</mn></mrow><mrow><mo>-</mo><mn>18</mn></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></mrow></munder></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dd5daecb881ecad9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "68", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which one of the following statements is <strong>not</strong> correct?", "image": null}, "options": [{"id": "v7bxV", "text": "The bond angle <img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0026149_ques1_1.jpg\" /> in methanol is <math> <mrow> <mn>1</mn> <mn>0</mn> <mn>8</mn> <mtext>.</mtext> <msup> <mn>9</mn> <mtext>o</mtext> </msup> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "FrnDR", "text": "Alcohols are weaker acids than water", "image": null, "isCorrect": false}, {"id": "18qP3", "text": "Carbon-oxygen bond length in methanol, CH<sub>3</sub>OH is shorter than that of C - O bond length in phenol.", "image": null, "isCorrect": true}, {"id": "PTsun", "text": "Acid strength of&nbsp;alcohols&nbsp;decreases in the following order <math> <mrow> <mtext>RCH</mtext> <msub> <mspace></mspace> <mn>2</mn> </msub> <mtext>OH</mtext> <mo>&gt;</mo> <mtext>R</mtext> <msub> <mspace></mspace> <mtext>2</mtext> </msub> <mtext>CHOH</mtext> <mo>&gt;</mo> <msub> <mtext>R</mtext> <mtext>3</mtext> </msub> <mtext>COH</mtext> </mrow> </math> ​", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Carbon-oxygen bond length in methanol, CH<sub>3</sub>OH is longer than that of C - O bond length in phenol. This is due to the partial double bond character in C-O bond of Phenol due to resonance.<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/reso1.JPG\" style=\"width: 450px; height: 112px;\" />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863db9f50ea32c9bd4a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "07", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The major product formed during the hydroboration-oxidation of 1-methylcyclopentene is-", "image": null}, "options": [{"id": "2FEfK", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/je ing group (nucleophile) is replaced by an electron rich compound (nucleophile). The whole molecular entity of which the electrophile and the leaving group are part is usually called the substrate. The nucleophile essentially attempts to replace the leaving group as the primary substituent in the reaction itself, as a part of another molecule. <br><br>Nuc: + R-LG → R-Nuc + LG:<br><br>The electron pair (:) from the nucleophile (Nuc) attacks the substrate (R-LG) forming a new bond, while the leaving group (LG) departs with an electron pair. The principal product in this case is R-Nucleophile. The nucleophile may be electrically neutral or negatively charged, whereas the substrate is typically neutral or positively charged. <br>An example of nucleophilic substitution is the hydrolysis of an alkyl bromide, R-Br, under basic conditions, where the attacking nucleophile is the OH− and the leaving group is Br−. <br>R-Br + OH<sup>−</sup> → R-OH + Br<sup>−</sup>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639c1822cff8609717", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/7659f564-fcf6-4b6c-879b-58771a459c96.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 300px; height: 36px;\" /><br />\rIn the above sequence of reaction, (Y) is", "image": null}, "options": [{"id": "OU9P3", "text": "Isobutyl alcohol", "image": null, "isCorrect": false}, {"id": "AHoDr", "text": "n-Butyl alcohol", "image": null, "isCorrect": false}, {"id": "ymsL9", "text": "Tertiary butyl alcohol" ution": {"text": "Tertiary alcohol offers resistance to oxidation. Hence, Cr<sup>3</sup><sup>+</sup> ions are not formed, and the solution does not turn green.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c06d61fca68bfbac", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "69", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider the following compound <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">A</mi></mrow></mfenced></math> . Select the correct statement.<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/691ad28d-f867-45d9-a0db-3981d933f5fd.jpeg\" style=\"width:1.5in;height:1.375in\" />", "image": null}, "options": [{"id": "v5EMs", "text": "It is more acidic than <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></math>", "image": null, "isCorrect": true}, {"id": "z4rO5", "text": "It is more acidic than <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub><mi mathvariant=\"normal\">S</mi><msub><mi mathvariant=\"normal\">O</mi><mn>4</mn></msub></math>", "image": null, "isCorrect": false}, {"id": "HH5cW", "text": "It does not react with <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">r</mi></math>", "image": null, "isCorrect": false}, {"id": "VXCQq", "text": "It is a tribasic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "It is a strong dibasic acid and stronger than <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></math>  <br/><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/c699ce7a-b762-4fcf-9282-253c5839eb48.jpeg\" style=\"width:4.71667in;height:1.34167in\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bf5b8c80c53545e4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Place the following alcohols in decreasing order of rate of dehydration with concentrated H<sub>2</sub>SO<sub>4</sub> :<br />\r<br />\r1. CH<sub>3</sub>CH<sub>2</sub>CH(OH)CH<sub>2</sub>CH<sub>2</sub>CH<sub>3</sub><br />\r<br />\r2. (CH<sub>3</sub>)<sub>2</sub>C(OH)CH<sub>2</sub>CH<sub>2</sub>CH<sub>3</sub><br />\r<br />\r3. (CH<sub>3</sub>)<sub>2</sub>C(OH)CH(CH<sub>3</sub>)<sub>2</sub><br />\r<br />\r4. CH<sub>3</sub>CH<sub>2</sub>CH(OH)CH(CH<sub>3</sub>)<sub>2</sub><br />\r<br />\r​5. CH<sub>3</sub>CH<sub>2</sub>CH<sub>2</sub>CH<sub>2</sub>CH<sub>2</sub>CH<sub>2</sub>OH", "image": null}, "options": [{"id": "YPf6B", "text": "3 &gt; 2 &gt; 4 &gt; 5 &gt; 1", "image": null, "isCorrect": false}, {"id": "DLNlT", "text": "3 &gt; 2 &gt; 4 &gt; 1 &gt; 5", "image": null, "isCorrect": true}, {"id": "RR8F8", "text": "3 &gt; 2 &gt; 1 &gt; 4 &gt; 5", "image": null, "isCorrect": false}, {"id": "tOK1D", "text": "3 &gt; 2 &gt; 1 &gt; 5 &gt; 4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The alcohols (3) and (2) are both 3<sup>o</sup>, but alcohol (3) gives a more substituted alkene. Alcohol&nbsp;(4) and (1) are both 2<sup>o</sup>, but alcohol (4) can give a more substituted alkene and alcohol (5) is 1<sup>o</sup>. Rate of dehydration of alcohols with concentrated H<sub>2</sub>SO<sub>4</sub>&nbsp;follows the order 3<sup>o</sup> &gt; 2<sup>o</sup> &gt; 1<sup>o</sup>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bc96406ec097b69d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "92", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/e427d100-5e11-4366-97f8-3fc3f7b954d1.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width:3.58333in;height:0.825in\" /><br />\rCompound <math><mo>(</mo><mi mathvariant=\"normal\">C</mi><mo>)</mo></math> is", "image": null}, "options": [{"id": "SknOU", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/b29e8fa9-06ae-45cb-bac9-0661d19d64ec.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width:0.525in;height:0.60833in\">", "image": null, "isCorrect": false}, {"id": "0zi5I", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/dfe1a978-47bf-4011-a644-d27b8de8eccd.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width:0.525in;height:0.60833in\">", "image": null, "isCorrect": false}, {"id": "zW7QS", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/c4649d04-4f99-4919-8d67-920073601a96.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width:0.525in;height:0.825in\" />", "image": null, "isCorrect": true}, {"id": "XJLCV", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/d80fba43-ae13-4725-916d-9910378f307e.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width:0.525in;height:0.83333in\">", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/6c4089b1-488c-48ec-bd00-ea31c0e965d1.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width:4.53333in;height:1.10833in\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ba655fd8299397af", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "58", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What will be the correct decreasing order of acid strength of the hydroxybenzoic acids? (Symbols and notations carry their usual meanings)", "image": null}, "options": [{"id": "YqUTe", "text": "p-Hydroxybenzoic acid > benzoic acid > m-hydroxybenzoic acid > o-hydroxybenzoic acid", "image": null, "isCorrect": false}, {"id": "h49iI", "text": "o-Hydroxybenzoic acid &gt; m-hydroxybenzoic acid &gt; benzoic acid &gt; p-hydroxybenzoic acid", "image": null, "isCorrect": true}, {"id": "bN06U", "text": "o-Hydroxybenzoic acid > benzoic acid > m-hydroxybenzoic acid > p-hydroxybenzoic acid", "image": null, "isCorrect": false}, {"id": "o0xvc", "text": "m-Hydroxybenzoic acid > benzoic acid > o-hydroxybenzoic acid > p-hydroxybenzoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In case of hydroxybenzoic acids, they display both kind of effect and there is a decrease in electron density at all positions due to inductive effect of -OH group, but increase in electron density at o- and p-positions due to resonance effect by -OH group. o-hydroxy benzoic acid is strongest among the given acids due to intramolecular hydrogen bonding in its&nbsp; conjugate base<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/emoilfrnfvmlkvugfycjdeqstjetniuwtsogeitiexzwvdaqdm.jpeg\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a4dc51d537659e84", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "05", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Identify number of nucleophilic substitution reactions in the given reactions?<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ab0389ef-5be8-436d-b342-3ab4eab19b7c.png\" />", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "Use the concept explained below on each of the reaction to identify the nucleophilic substitution reaction: <br><br>In a nucleophilic substitution reaction, the leaving group (nucleophile) is replaced by an electron rich compound (nucleophile). The whole molecular entity of which the electrophile and the leaving group are part is usually called the substrate. The nucleophile essentially attempts to replace the leaving group as the primary substituent in the reaction itself, as a part of another molecule. <br><br>Nuc: + R-LG → R-Nuc + LG:<br><br>The electron pair (:) from the nucleophile (Nuc) attacks the substrate (R-LG) forming a new bond, while the leaving group (LG) departs with an electron pair. The principal product in this case is R-Nucleophile. The nucleophile may be electrically neutral or negatively charged, whereas the substrate is typically neutral or positively charged. <br>An example of nucleophilic substitution is the hydrolysis of an alkyl bromide, R-Br, under basic conditions, where the attacking nucleophile is the OH− and the leaving group is Br−. <br>R-Br + OH<sup>−</sup> → R-OH + Br<sup>−</sup>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639d91ce6c9a70dbb8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Dehydration of the following in increasing order is <br/>(I) <img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/b086e00e-cfcc-42ee-860a-fed8ffa513d5.png\" style=\"width:1.05347in;height:0.61319in\"> <br/>(II) <img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/db01b326-e0fe-461c-ac13-b87243ef6e1b.png\" style=\"width:1.12708in;height:0.65347in\"> <br/>(III) <img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/1f3980d7-e516-40d4-8565-c018cfbd9607.png\" style=\"width:1.2in;height:0.66667in\"> <br/>(IV) <img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/f9213bff-9800-4357-b823-624206a2a8a5.png\" style=\"width:1.13333in;height:0.64653in\">", "image": null}, "options": [{"id": "y91tb", "text": "I &lt; II &lt; III &lt; IV", "image": null, "isCorrect": true}, {"id": "16e7z", "text": "II &lt; III &lt; IV &lt; I", "image": null, "isCorrect": false}, {"id": "ywEbP", "text": "I &lt; III &lt; IV &lt; II", "image": null, "isCorrect": false}, {"id": "AkKcL", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Dehydration of IV is most facile since, it gives an aromatic compound. Dehydration of III gives a conjugated diene which is stabilized by resonance. <br/><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/06db46f3-8551-4385-9c97-2082a51514b0.png\" style=\"width:2.3in;height:0.74653in\"> <br/><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/c799289f-e824-4fbd-b568-7b2ed18114d1.png\" style=\"width:2.27986in;height:0.75972in\"> <br/>Dehydration of II gives only cyclohexene which is not stabilized by resonance. <br/><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ab09ad99-087f-4f2c-8b56-a42a953ebb92.png\" style=\"width:2.25347in;height:0.75347in\"> <br/>In contrast, phenol (I) does not undergo dehydration. Thus, the ease of dehydration is <br/>IV &gt; III &gt; II &gt; I.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639c1822cff8609717", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/7659f564-fcf6-4b6c-879b-58771a459c96.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 300px; height: 36px;\" /><br />\rIn the above sequence of reaction, (Y) is", "image": null}, "options": [{"id": "OU9P3", "text": "Isobutyl alcohol", "image": null, "isCorrect": false}, {"id": " t=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/633418_opt_3.png\" style=\"width: 250px; height: 79px;\"/>", "image": null, "isCorrect": false}, {"id": "osLvm", "text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/633418_opt_4.png\" style=\"width: 250px; height: 79px;\"/>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Here the reaction is as follows<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/yftusnsectjpujngqofdvalcjhihoffajuckddcuquwxhsjujl.jpeg\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634173c55ab94388b8", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "How many of the following ethers CANNOT be prepared by Williamson's synthesis? <math><msub><mrow><mtext>CH</mtext></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mtext>OCH</mtext></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mtext>CH</mtext></mrow><mrow><mn>3</mn></mrow></msub><mo>,</mo><msub><mrow><mtext>C</mtext></mrow><mrow><mn>6</mn></mrow></msub><msub><mrow><mtext>H</mtext></mrow><mrow><mn>5</mn></mrow></msub><msub><mrow><mtext>OCH</mtext></mrow><mrow><mn>3</mn></mrow></msub><mo>,</mo><msub><mrow><mo>(</mo><msub><mrow><mtext>C</mtext></mrow><mrow><mn>6</mn></mrow></msub><msub><mrow><mtext>H</mtext></mrow><mrow><mn>5</mn></mrow></msub><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msub><mtext>O</mtext><mtext>,</mtext><msub><mrow><mo>(</mo><msub><mrow><mtext>CH</mtext></mrow><mrow><mn>3</mn></mrow></msub><mo>)</mo></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mtext>COCH</mtext></mrow><mrow><mn>3</mn></mrow></msub><mo>,</mo><msub><mrow><mo>(</mo><msub><mrow><mtext>C</mtext></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mtext>H</mtext></mrow><mrow><mn>5</mn></mrow></msub><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msub><mtext>O</mtext><mo>,</mo><msub><mrow><mo>(</mo><msub><mrow><mtext>CH</mtext></mrow><mrow><mn>3</mn></mrow></msub><mo>)</mo></mrow><mrow><mn>3</mn></mrow></msub><mtext>C</mtext><mo>-</mo><mtext>O</mtext><mo>-</mo><mtext>C</mtext><msub><mrow><mo>(</mo><msub><mrow><mtext>CH</mtext></mrow><mrow><mn>3</mn></mrow></msub><mo>)</mo></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "In Williamson's synthesis, <br/>i. <math><msup><mrow><mn>1</mn></mrow><mrow><mo>°</mo></mrow></msup></math> alkyl halide and <math><msup><mrow><mn>3</mn></mrow><mrow><mo>°</mo></mrow></msup></math> alkoxide give best yield of corresponding ethers. <br/>ii. In case of, <math><msup><mrow><mn>3</mn></mrow><mrow><mo>°</mo></mrow></msup></math> alkyl halide, elimination competes over substitution and alkene is obtained as a product. <br/>iii. Aryl halides do not undergo nucleophilic substitution unless it is activated by the presence of electron withdrawing group. Thus, <math><msub><mrow><mo>(</mo><msub><mrow><mtext>C</mtext></mrow><mrow><mn>6</mn></mrow></msub><msub><mrow><mtext>H</mtext></mrow><mrow><mn>5</mn></mrow></msub><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msub><mtext>O</mtext></math> and <math><msub><mrow><mo>(</mo><msub><mrow><mtext>CH</mtext></mrow><mrow><mn>3</mn></mrow></msub><mo>)</mo></mrow><mrow><mn>3</mn></mrow></msub><mtext>C</mtext><mo>-</mo><mtext>O</mtext><mo>-</mo><mtext>C</mtext><msub><mrow><mo>(</mo><msub><mrow><mtext>CH</mtext></mrow><mrow><mn>3</mn></mrow></msub><mo>)</mo></mrow><mrow><mn>3</mn></mrow></msub></math> cannot be prepared by Williamson's synthesis.", "image": null}, "videoSolution": null, "syllabusCategory" acteristic colour with <math><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mn>3</mn></mrow></msub></math> .<br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/5af09596-d9f8-4df0-8a15-4516901fc2f7.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width:2.88333in;height:1.60833in\" /><br />Only compound (II) can give tribromo-derivative.<br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/9d2b7a70-2131-41ad-99f2-17cc54be5a41.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width:2.00833in;height:1.525in\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d1133301f032258a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "38", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the reaction sequence.<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/omyoleowpqgdjtuzfksyjzxehpsoxqtemtzqxmmlihgamiruhn.jpeg\" /> . Correct statement regarding B is:", "image": null}, "options": [{"id": "PUTmo", "text": "It is less acidic than&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/635228_op.JPG\" style=\"width: 70px; height: 94px;\" />", "image": null, "isCorrect": false}, {"id": "v2aQm", "text": "Degree of unsaturation in  <math><mi mathvariant=\"normal\">B</mi></math>  is  <math><mn>6</mn></math>", "image": null, "isCorrect": false}, {"id": "CFBs2", "text": "It reacts with <math><mi mathvariant=\"normal\">B</mi><msub><mrow><mi mathvariant=\" ; (III) &gt; (V)", "image": null, "isCorrect": true}, {"id": "QHHIa", "text": "(IV) &gt; (V) &gt; (III) &gt; (II) &gt; (I)", "image": null, "isCorrect": false}, {"id": "G9TaF", "text": "(V) &gt; (IV) &gt; (III) &gt; (II) &gt; (I)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The electron withdrawing group <math><mfenced separators=\"|\"><mrow><mo>-</mo><mi mathvariant=\"normal\">N</mi><msub><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math> increases the acidity of phenols and the electron donating group <math><mfenced separators=\"|\"><mrow><mo>-</mo><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfenced></math> decreases the acidity of phenols. The effect oat p-position is greater than at m-position. <br/>Hence the order of acidic nature is (II) &gt; (IV) &gt; (I) &gt; (III) &gt; (V).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ba655fd8299397af", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "58", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What will be the correct decreasing order of acid strength of the hydroxybenzoic acids? (Symbols and notations carry their usual meanings)", "image": null}, "options": [{"id": "YqUTe", "text": "p-Hydroxybenzoic acid > benzoic acid > m-hydroxybenzoic acid > o-hydroxybenzoic acid", "image": null, "isCorrect": false}, {"id": "h49iI", "text": "o-Hydroxybenzoic acid &gt; m-hydroxybenzoic acid &gt; benzoic acid &gt; p-hydroxybenzoic acid", "image": null, "isCorrect": true}, {"id": "bN06U", "text": "o-Hydroxybenzoic acid > benzoic acid > m-hydroxybenzoic acid > p-hydroxybenzoic acid", "image": null, "isCorrect": false}, {"id": "o0xvc", "text": "m-Hydroxybenzoic acid > benzoic acid > o-hydroxybenzoic acid > p-hydroxybenzoic acid", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In case of hydroxybenzoic acids, they display both kind of effect and there is a decrease in electron density at all positions due to inductive effect of -OH group, but increase in electron density at o- and p-positions due to resonance effect by -OH group. o-hydroxy benzoic acid is strongest among the given acids due to intramolecular hydrogen bonding in its&nbsp; conjugate base<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/emoilfrnfvmlkvugfycjdeqstjetniuwtsogeitiexzwvdaqdm.jpeg\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "6aa3ab79aa8dc1ff68177e93", "title": "Reactions of Ethers", "totalQuestions": 11, "questions": [{"_id": "6151e863fd82ba2f4229cad1", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "How many of these compounds are more reactive towards electrophillic substitution reaction than toluene. Phenol, Aniline, Anisole, Benzaldehyde, Chorobenzene,<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/21_que_chemd.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 350px; height: 57px;\" />", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "<img alt=\"\" src=     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
