ory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86368fc2b79ed458c5a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "39", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following statements about physical adsorption is not correct?", "image": null}, "options": [{"id": "FUpSm", "text": "It is usually monolayer", "image": null, "isCorrect": true}, {"id": "ks71C", "text": "It is reversible in nature", "image": null, "isCorrect": false}, {"id": "uXtgN", "text": "It involves van der Waals interactions between adsorbent and adsorbate", "image": null, "isCorrect": false}, {"id": "r8BVp", "text": "It involves small value of adsorption", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Physical adsorption is a multilayer phenomenon. Rest all are correct features of physical adsorption.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634f796e1edda50cb5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "86", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The degree of adsorption of solution on solid surface depends on concentration of solution<br />\r<math><mfrac><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac><mo>=</mo><mi mathvariant=\"normal\">K</mi><msup><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac></mrow></msup></math><br />\rIn which of the conditions, we get following type of graph?<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/93ce9f94-aa18-4395-b8e0-13b740a0eb34.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 130px; height: 91px;\" />", "image": null}, "options": [{"id": "3IM3x", "text": "C = 0", "image": null, "isCorrect": false}, {"id": "lzRd4", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "mwzpK", "text": "<math><mi mathvariant=\"normal\">C</mi><mo>=</mo></math> constant", "image": null, "isCorrect": false}, {"id": "bvZC9", "text": "C = 2 M", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Horizontal straight line will be possible when slope is zero. <br/>i.e., <math><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mo>=</mo><mn>0</mn></math> .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86330378555cd197cd4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the plots is adsorption isobar for chemisorption?", "image": null}, "options": [{"id": "sTA4T", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/16fe61e5-e114-4232-9cc7-c11faa334326.png\" style=\"width:1.225in;height:1in\">", "image": null, "isCorrect": false}, {"id": "IUzSA", "text": "<img src=\" bhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The degree of adsorption of solution on solid surface depends on concentration of solution<br />\r<math><mfrac><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac><mo>=</mo><mi mathvariant=\"normal\">K</mi><msup><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac></mrow></msup></math><br />\rIn which of the conditions, we get following type of graph?<br />\r<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/93ce9f94-aa18-4395-b8e0-13b740a0eb34.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 130px; height: 91px;\" />", "image": null}, "options": [{"id": "3IM3x", "text": "C = 0", "image": null, "isCorrect": false}, {"id": "lzRd4", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "mwzpK", "text": "<math><mi mathvariant=\"normal\">C</mi><mo>=</mo></math> constant", "image": null, "isCorrect": false}, {"id": "bvZC9", "text": "C = 2 M", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Horizontal straight line will be possible when slope is zero. <br/>i.e., <math><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mo>=</mo><mn>0</mn></math> .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633e856f9874aa4c63", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In the Freundlich adsorption isotherm, the value of <math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac></mrow></mfenced><mi mathvariant=\"normal\"></mi></math> is between <math><mn>0</mn><mi mathvariant=\"normal\"></mi></math> and -----.", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "<math> <mfrac>  <mtext>X</mtext>  <mtext>M</mtext> </mfrac> <msup>  <mtext>=KP</mtext>  <mrow>   <mfrac>    <mtext>1</mtext>    <mtext>n</mtext>   </mfrac>   </mrow> </msup> </math><br><math> <mo>&#x21D2;</mo><mn>0</mn><mo>&#x2264;</mo><mfrac>  <mtext>1</mtext>  <mtext>n</mtext> </mfrac> <mo>&#x003C;</mo><mn>1</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633b0beff11ca74338", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "93", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Graph between <math><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac></mrow></mfenced></mrow></mrow></math> and log P is straight line at angle of <math><mn>45</mn><mo>°</mo></math> with the intercept of 0.6020.<br />\r<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/74c00b7f-7c56-4410-8e03-7f51b882e534.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width:2.225in;height:1.75833in\" /><br />\rThe extent of adsorption <math><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac></mrow></mfenced></math> at a pressure of 1 atm is", "image": null}, "options": [], "correctValue": "4.00", "solution": {"text": "<math><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac></mrow></mfenced></mrow></mrow><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">K</mi></mrow></mrow><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">P</mi></mrow></mrow></math><br /><math><mo>=</mo><mn>0.602</mn><mo>+</mo><mn>1</mn><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mn>1</mn></mrow></mrow></math><br />= 0.602<br />So <math><mfrac><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac><mo>=</mo><mn>4</mn></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86338f57cef02df2aca", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "61", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A graph is plotted between log (x/m) and log P according to the equation <math><mfrac><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac><mo>=</mo><mi mathvariant=\"normal\">k</mi><msup><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac></mrow></msup></math> .<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/15_que.JPG\" style=\"width: 180px; height: 123px;\" /><br />\r<br />\rWhich of the following statements about this graph is not correct?", "image": null}, "options": [{"id": "B4CTY", "text": "The figure shows Freundlich adsorption isotherm", "image": null, "isCorrect": false}, {"id": "1N9wU", "text": "The figure shows Langmuir adsorption isotherm", "image": null, "isCorrect": true}, {"id": "uKFva", "text": "The adsorption varies with pressure", "image": null, "isCorrect": false}, {"id": "4sDtD", "text": "The factor 1/n can have values between 0 and 1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "This is Freundlich isotherm not Langmuir.<br /><br />It is also written as<br /><br /><math><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mfrac><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac></mrow></mrow><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">k</mi></mrow></mrow><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">p</mi></mrow></mrow></math><br /><br />where<br /><br />x = mass of adsorbate<br /><br />m = mass of adsorbent<br /><br />p = Equilibrium pressure of adsorbate<br /><br />K and n are constants for a given adsorbate and adsorbent at a particular temperature.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86334e0de47092cb9e5", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "66", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Plot of log x/m against log p is a straight line inclined at an angle of <math><mn>45</mn><mo>°</mo></math> . When the pressure is 0.5 atm and Freundlich parameter, k is 10, the amount of soluble adsorbed per gram of adsorbent will be (log 5 = 0.6990)", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "According to Freundlich equation <br/><math><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mi mathvariant=\"normal\">k</mi><msup><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac></mrow></msup></math>  <br/><math><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac></mrow></mfenced></mrow></mrow><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">k</mi></mrow></mrow><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">p</mi></mrow></mrow></math>  <br/>So plot of log x/m vs log p is linear wit slope = 1/n and intercept = log k. <br/>Thus <math><mfrac><mrow><mn>1</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mn>4</mn></mrow></mrow><mn>5</mn><mo>°</mo><mo>=</mo><mn>1</mn></math>  <br/>or n = 1 <br/>At p = 0.5 atm and k = 10 <br/><math><mfrac><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi></mrow></mfrac><mo>=</mo><mn>10</mn><mo>×</mo><mo>(</mo><mn>0.5</mn><msup><mrow><mo>)</mo></mrow><mrow><mn>1</mn></mrow></msup><mo>=</mo><mn>5</mn></math>  <br/>so x = 5 g", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86330378555cd197cd4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the plots is adsorption isobar for chemisorption?", "image": null}, "options": [{"id": "sTA4T", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/16fe61e5-e114-4232-9cc7-c11faa334326.png\" style=\"width:1.225in;height:1in\">", "image": null, "isCorrect": false}, {"id": "IUzSA", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/a4ea5cb5-e052-40a8-a5f8-438e76d02123.png\" style=\"width:1.31319in;height:1.04028in\" />", "image": null, "isCorrect": true}, {"id": "jQP11", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/22475005-399a-48fc-af7f-e637193e097a.png\" style=\"width:1.35in;height:1.09167in\">", "image": null, "isCorrect": false}, {"id": "VyEf2", "text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/e7f5e8ec-cb70-4672-832e-e4e708dfec25.png\" style=\"width:1.22708in;height:1.02014in\">", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "chemisorption involves a high activation energy. so, it first increases and then decreases with i ><mn>1</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>2</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "E8NM6", "text": "<math><mn>1</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>2</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>4</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Zeolites are naturally occurring or synthetic microporous aluminosilicates which are used to remove permanent hardness from hard water. Shape selectivity of zeolites depends upon porous structures of the catalyst.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86325d51ddd0b8a8c0b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "43", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following is not an example of heterogeneous catalysis?", "image": null}, "options": [{"id": "5Cgug", "text": "<math><mi mathvariant=\"normal\">n</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced><mover accent=\"false\"><mo>→</mo><mrow><msub><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">l</mi><mo>+</mo><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">l</mi></mrow><mrow><mn>4</mn></mrow></msub></mrow></mover><ms     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
