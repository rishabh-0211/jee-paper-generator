><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">H</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">H</mi><mo>(</mo><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">r</mi><mo>)</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub></math> and its enantiomer", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863df5886251b603e1e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "72", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Neopentyl bromide, undergoes dehydrohalogenation to give alkenes even though it has no <math> <mrow> <mtext>β</mtext><mo>−</mo><mtext>H</mtext></mrow> </math>. This is due to", "image": null}, "options": [{"id": "OPAM9", "text": "<math> <mrow>  <msub>   <mtext>E</mtext>   <mtext>2</mtext>  </msub>  </mrow></math> mechanism", "image": null, "isCorrect": false}, {"id": "6g7IT", "text": "Rearrangement of carbocations by <math> <mrow>  <msub>   <mtext>E</mtext>   <mtext>1</mtext>  </msub>  </mrow></math> mechanism", "image": null, "isCorrect": true}, {"id": "RmnpB", "text": "<math> <mrow>  <msub>   <mtext>E</mtext>   <mtext>1</mtext>  </msub>  <mtext>cB</mtext></mrow></math> mechanism", "image": null, "isCorrect": false}, {"id": "T4DLV", "text": "<math> <mrow>  <msub>   <mtext>E</mtext>   <mtext>4</mtext>  </msub>  </mrow></math> mechanism", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/338887.PNG\" style=\"width: 300px; height: 168px;\" /><br />Neopentyl bromide give a carbocation as intermediate which undergo for rearrangement and show <math> <mrow> <msub> <mtext>E</mtext> <mtext>1</mtext> </msub> </mrow> </math> mechanism (even though it has no <math> <mrow> <mtext>β</mtext><mo>−</mo><mtext>H</mtext></mrow> </math> atom).<br /><br />Thus Rearrangement of carbocations by <math> <mrow>  <msub>   <mtext>E</mtext>   <mtext>1</mtext>  </msub>  </mrow></math> mechanism is the correct option.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dc3c77c8a28318a7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "90", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Calculate the percentage of all the monochlorinated products obtained from the chlorination of 2 - methyl butane. The relative reactivity of <math> <mrow> <msup> <mn>1</mn> <mo>∘</mo> </msup> </mrow> </math>, <math> <mrow> <msup> <mn>2</mn> <mo>∘</mo> </msup> </mrow> </math>, and <math> <mrow> <msup> <mn>3</mn> <mo>∘</mo> </msup> </mrow> </math> hydrogen to chlorination is (1 : 3.8 : 5).", "image": null}, "options": [{"id": "mXznX", "text": "15%, 45%, 20%, 25%", "image": null, "isCorrect": false}, {"id": "snBu4", "text": "14%, 35%, 23%, 28%", "image": null, "isCorrect": true}, {"id": "wc9M2", "text": "12%, 30%, 22%, 29%", "image": null, "isCorrect": false}, {"id": "nIWt0", "text": "17%, 36%, 20%, 23%", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014814_AnsExp1_1._.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 450px; height: 119px;\" /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014814_AnsExp2_1._.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 449px; height: 177px;\" /><br /><br /><br />There are four different (A, B, C and D) monochloro products.<br />&nbsp;<table align=\"center\" border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 100%;\">\t<thead>\t\t<tr>\t\t\t<th scope=\"col\">&nbsp;</th>\t\t\t<th scope=\"col\">&nbsp;</th>\t\t\t<th scope=\"col\">&nbsp;</th>\t\t\t<th scope=\"col\">Relative amount</th>\t\t</tr>\t</thead>\t<tbody>\t\t<tr>\t\t\t<td>(A)</td>\t\t\t<td><u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014814_AnsExp1_3.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 143px; height: 96px;\" /></strong></u></td>\t\t\t<td>(A) is obtained from the reaction of three equivalent <math> <mrow> <msup> <mn>1</mn> <mo>∘</mo> </msup> </mrow> </math> H atoms.</td>\t\t\t<td>3 x 1 = 3.0</td>\t\t</tr>\t\t<tr>\t\t\t<td>(B)</td>\t\t\t<td><u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014814_AnsExp1_4.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 113px; height: 111px;\" /></strong></u></td>\t\t\t<td>(B) is obtained from the reaction of two equivalent <math> <mrow> <msup> <mn>2</mn> <mo>∘</mo> </msup> </mrow> </math> H atoms.</td>\t\t\t<td>2 x 3.8 = 7.6</td>\t\t</tr>\t\t<tr>\t\t\t<td>(C)</td>\t\t\t<td><u><strong><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014814_AnsExp1_5.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 137px; height: 97px;\" /></strong></u></td>\t\t\t<td>(C) is obtained from the reaction of one equivalent <math> <mrow> <msup> <mn>3</mn> <mo>∘</mo> </msup> </mrow> </math> H atoms.</td>\t\t\t<td>1 x 5 = 5.0</td>\t\t</tr>\t\t<tr>\t\t\t<td>(D)</td>\t\t\t<td><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014814_AnsExp1_6_.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 132px; height: 128px;\" /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/EM0014814_AnsExp1_7_.jpg\" style=\"max-width:100%; object-fit:contain\" style=\"width: 98px; height: 101px;\" /></td>\t\t\t<td>(D) is obtained from the reaction of six equivalent <math> <mrow> <msup> <mn>1</mn> <mo>∘</mo> </msup> </mrow> </math> H atoms.</td>\t\t\t<td><br />\t\t\t6 x 1 = 6.0<br />\t\t\t<br />\t\t\t<br />\t\t\tTotal = 21.6</td>\t\t</tr>\t</tbody></table><br /><br />Therefore, percentages of the A, B, C and D monochloro products are as follows :<br /><br /><math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>A</mtext> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>2</mn> <mn>1</mn> <mtext>.</mtext> <mn>6</mn> </mrow> </mfrac> <mo>&times;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mo>=</mo> <mn>1</mn> <mn>3</mn> <mtext>.</mtext> <mn>9</mn> <mo>&asymp;</mo> <mn>1</mn> <mn>4</mn> <mtext>%</mtext> </mrow> </math><br /><br /><math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>B</mtext> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <mn>7</mn> <mtext>.</mtext> <mn>6</mn> </mrow> <mrow> <mn>2</mn> <mn>1</mn> <mtext>.</mtext> <mn>6</mn> </mrow> </mfrac> <mo>&times;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mo>=</mo> <mn>3</mn> <mn>5</mn> <mtext>.</mtext> <mn>1</mn> <mn>8</mn> <mo>&asymp;</mo> <mn>3</mn> <mn>5</mn> <mtext>%</mtext> </mrow> </math><br /><br /><math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>C</mtext> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <mn>5</mn> <mtext>.</mtext> <mn>0</mn> </mrow> <mrow> <mn>2</mn> <mn>1</mn> <mtext>.</mtext> <mn>6</mn> </mrow> </mfrac> <mo>&times;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mo>=</mo> <mn>2</mn> <mn>3</mn> <mtext>.</mtext> <mn>1</mn> <mn>5</mn> <mo>&asymp;</mo> <mn>2</mn> <mn>3</mn> <mtext>%</mtext> </mrow> </math><br /><br /><math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>D</mtext> </mrow> </mfenced> <mo>=</mo> <mfrac> <mrow> <mn>6</mn> <mtext>.</mtext> <mn>0</mn> </mrow> <mrow> <mn>2</mn> <mn>1</mn> <mtext>.</mtext> <mn>6</mn> </mrow> </mfrac> <mo>&times;</mo> <mn>1</mn> <mn>0</mn> <mn>0</mn> <mo>=</mo> <mn>2</mn> <mn>7</mn> <mtext>.</mtext> <mn>8</mn> <mo>&asymp;</mo> <mn>2</mn> <mn>8</mn> <mtext>%</mtext> </mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d0dcddbb6a852b11", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The major product in the dehydrohalogenation of 3-Bromo-2, 2-dimethylbutane is", "image": null}, "options": [{"id": "AcGaL", "text": "3, 3-dimethyl but-1-ene", "image": null, "isCorrect": false}, {"id": "42QHC", "text": "2, 3-dimethylbut-1-ene", "image": null, "isCorrect": false}, {"id": "LQCJN", "text": "2, 3-dimethyl but-2-ene", "image": null, "isCorrect": true}, {"id": "j3sMx", "text": "4-methylpent-2-ene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/1325sdfgricveqwrr3.jpg\" style=\"height: 213px; width: 500px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cebbd27656db69c1", ": [{"title": "NTA Abhyas Paper", "value": "30", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider the following reaction<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/634745_1.JPG\" style=\"width: 363px; height: 60px;\" /><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/634745_2.JPG\" style=\"width: 341px; height: 83px;\" /><br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/634745_3.JPG\" style=\"width: 386px; height: 59px;\" /><br />\r<br />\r<br />\r<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/634745_4.JPG\" style=\"width: 490px; height: 62px;\" /><br />\r<br />\rWhich of these reactions are possible?", "image": null}, "options": [{"id": "V9RMf", "text": "<math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">b</mi></mrow></mfenced></math> ,  <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">c</mi></mrow></mfenced></math>  and  <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">d</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "YZLnU", "text": "<math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">b</mi></mrow></mfenced></math>  and  <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">d</mi></mrow></mfenced><mi mathvariant=\"normal\"> </mi></math>", "image": null, "isCorrect": true}, {"id": "SY347", "text": "<math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi></mrow></mfenced></math>  and  <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">d</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "ABqyr", "text": "<math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">a</mi></mrow></mfenced></math>  and  <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">b</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Vinyl halides and Aryl halides do not give Friedel Craft Reaction due to partial double bond character which is reso stabilised .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a5cadd5f0cbea0fb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following is correct?", "image": null}, "options": [{"id": "009E4", "text": "Vinyl chloride is more reactive than ethyl chloride in  <math><msub><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mi mathvariant=\"normal\">N</mi></mrow></msub><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "uMXlM", "text": "Vinyl chloride is more reactive than ethyl chloride in  <math><msub><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mi mathvariant=\"normal\">N</mi></mrow></msub><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "wEtSq", "text": "allyl chloride is less reactive than n-propyl chloride in  <math><msub><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mi mathvariant=\"normal\">N</mi></mrow></msub><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "FENxH", "text": "allyl chloride is more reactive than n-propyl chloride in <math><msub><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mi mathvariant=\"normal\">N</mi></mrow></msub><mn>2</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "As the electronegativity order of hybridized carbons is <math><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">p</mi><mo>&gt;</mo><mi mathvariant=\"normal\">s</mi><msup><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>&gt;</mo><mi mathvariant=\"normal\">s</mi><msup><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mn>3</mn></mrow></msup></math> so in an allylic halide, such as <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">H</mi><mo>-</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">l</mi></math>, the alpha carbon is much more partially positive than the alpha carbon in(n-propyl chloride) <math> <mrow>  <msub>   <mrow>    <mtext>CH</mtext></mrow>   <mtext>3</mtext>  </msub>  <mo>&#x2212;</mo><msub>   <mrow>    <mtext>CH</mtext></mrow>   <mtext>2</mtext>  </msub>  <mo>&#x2212;</mo><msub>   <mrow>    <mtext>&#x00A0;CH</mtext></mrow>   <mtext>2</mtext>  </msub>  <mo>&#x2212;</mo><mtext>Cl</mtext></mrow></math>. Therefore, the attacking nucleophile will be attracted to the alpha carbon more in the allylic halide compound than in the primary halide. It means allylic halides tend to follow <math><msub><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mi mathvariant=\"normal\">N</mi><mn>2</mn></mrow></msub></math> pathways more than primary halides.<br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/635831.JPG\" style=\"width: 431px; height: 68px;\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a5c741f0c6090a00", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "95", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math> <mrow> <mtext>(Z)-3-bromo-3-hexene</mtext></mrow> </math> when treated with <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><msup><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mo>-</mo></mrow></msup></math> in <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></math> gives", "image": null}, "options": [{"id": "5sWnB", "text": "3-hexyne", "image": null, "isCorrect": true}, {"id": "U5hZi", "text": "2-hexyne", "image": null, "isCorrect": false}, {"id": "7iWYe", "text": "2, 3-hexadiene", "image": null, "isCorrect": false}, {"id": "5ULBo", "text": "2, 4-hexadiene", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <mtext>(Z)-3-bromo-3-hexene</mtext></mrow> </math> when treated with <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><msup><mrow><mi mathvariant=\"normal\">O</mi></mrow><mrow><mo>-</mo></mrow></msup></math> in <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">H</mi></math> gives <math> <mrow> <mtext>hex-3-yne</mtext></mrow> </math>.<br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0b2f7014-3a1e-41f3-87a9-04ed3b557c7b.jpeg\" style=\"max-width:100%; object-fit:contain\" style=\"width:4.36667in;height:1.41667in\" /><br />&nbsp;", "image": null}, "videoSolution": null, "syll  44px;\"/>&nbsp;is more reactive than&nbsp;<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/633843_6.png\" style=\"width: 150px; height: 44px;\"/>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The electronegativity order of hybridized carbons is <math><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">p</mi><mo>&gt;</mo><mi mathvariant=\"normal\">s</mi><msup><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>&gt;</mo><mi mathvariant=\"normal\">s</mi><msup><mrow><mi mathvariant=\"normal\">p</mi></mrow><mrow><mn>3</mn></mrow></msup></math> . So in an allylic halide, such as <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">H</mi><mo>-</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mi mathvariant=\"normal\">I</mi></math> , the alpha carbon is much more partially positive than the alpha carbon in <math><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>-</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>-</mo><mi mathvariant=\"normal\">C</mi><msub><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">I</mi></math> . Therefore, the attacking nucleophile will be attracted to the alpha carbon more in the allylic halide compound than in the primary halide. Hence, allylic halides tend to follow <math> <mrow> <msub> <mtext>S</mtext> <mtext>N</mtext> </msub> <mtext>2</mtext></mrow> </math> pathways more than primary halides.<br />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "ev     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
