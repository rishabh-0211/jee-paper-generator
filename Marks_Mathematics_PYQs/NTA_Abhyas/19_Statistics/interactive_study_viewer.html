>y</mi></math> be remaining <math><mn>2</mn></math> observations<br />Mean <math><mo>=</mo><mn>8</mn><mo>=</mo><mfrac><mrow><mn>2</mn><mo>+</mo><mn>4</mn><mo>+</mo><mn>10</mn><mo>+</mo><mn>12</mn><mo>+</mo><mn>14</mn><mo>+</mo><mi>x</mi><mo>+</mo><mi>y</mi></mrow><mrow><mn>7</mn></mrow></mfrac></math><br /><math><mo>⇒</mo></math> <math><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>14</mn></math>&nbsp;...(i)<br />Variance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>16</mn><mo>=</mo><mfrac><mn>1</mn><mn>7</mn></mfrac><mfenced separators=\"|\"><mrow><msup><mn>2</mn><mn>2</mn></msup><mo>+</mo><msup><mn>4</mn><mn>2</mn></msup><mo>+</mo><mn>1</mn><msup><mn>0</mn><mn>2</mn></msup><mo>+</mo><mn>1</mn><msup><mn>2</mn><mn>2</mn></msup><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup></mrow></mfenced><mo>-</mo><msup><mfenced separators=\"|\"><mn>8</mn></mfenced><mn>2</mn></msup></math><br /><math><mo>⇒</mo></math> <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>100</mn></math>&nbsp;...(ii)<br />now solving equation (i) and (ii),&nbsp;we get,</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>8</mn><mo>,</mo><mo>&nbsp;</mo><mi>y</mi><mo>=</mo><mn>6</mn></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>6</mn><mo>,</mo><mo>&nbsp;</mo><mi>y</mi><mo>=</mo><mn>8</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639013185614837b22", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "58", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": " ormal\"></mi><mi>α</mi><mo>+</mo><mi>β</mi><mo>=</mo><mn>20</mn><mo>-</mo><mn>9</mn><mo>=</mo><mn>1</mn><mn>1</mn></math><br />Clearly <math><mn>5</mn><mo>,</mo><mi></mi><mn>6</mn></math> only satisfy the above equations in <math><mi>α</mi><mo>,</mo><mi>β</mi><mo>.</mo></math><br />Hence, the required numbers are <math><mn>5,6</mn><mo>.</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638a9e34c187c71bc0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "83", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "All the students of a class performed poorly in physics. The teacher decided to give grace marks of <math><mn>15</mn></math> to the entire class. Which of the following statistical measures will not change even after the grace marks were given?", "image": null}, "options": [{"id": "EWFqo", "text": "median", "image": null, "isCorrect": false}, {"id": "ZudYW", "text": "mode", "image": null, "isCorrect": false}, {"id": "jiBgf", "text": "variance", "image": null, "isCorrect": true}, {"id": "0Fcn6", "text": "mean", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Variance is not changed by the change of origin.<br /><math><mi>σ</mi><mo>=</mo><msqrt><mfrac><mrow><mrow><mo stretchy=\"false\">∑</mo><mrow><msup><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mover accent=\"true\"><mrow><mi>x</mi></mrow><mo>-</mo></mover></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow></mrow><mrow><mi>n</mi></mrow></mfrac></msqrt></math>. Therefore, <math><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><mn>15</mn><mo>⇒</mo><mover accent=\"true\"><mrow><mi>y</mi></mrow><mo>-</mo></mover><mo>=</mo><mover accent=\"true\"><mrow><mi>x</mi></mrow><mo>-</mo></mover><mo>+</mo><mn>15</mn></math><br /><math><msub><mrow><mi>σ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msqrt><mfrac><mrow><mrow><mo stretchy=\"false\">∑</mo><mrow><msup><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>y</mi><mo>+</mo><mn>15</mn><mo>-</mo><mover accent=\"true\"><mrow><mi>y</mi></mrow><mo>-</mo></mover><mo>-</mo><mn>15</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow></mrow><mrow><mi>n</mi></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mrow><mo stretchy=\"false\">∑</mo><mrow><msup><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mover accent=\"true\"><mrow><mi>y</mi></mrow><mo>-</mo></mover></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow></mrow><mrow><mi>n</mi></mrow></mfrac></msqrt><mo>=</mo><mi>σ</mi></math>.<br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86384497940b89cede5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two data sets each of size <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math>&nbsp;has the variance as <math><mn>4</mn></math> and <math><mi mathvariant=\"normal\">k</mi></math> and the corresponding means as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> respectively. If the variance of the combined data set is <math> <mrow> <mn>5</mn><mo>⋅</mo><mn>5</mn><mo>,</mo></mrow> </math> then the value of&nbsp;<math><mi mathvariant=\"normal\">k</mi></math> is equal to", "image": null}, "options": [{"id": "4DAMZ", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": true}, {"id": "h5Juf", "text": "<math><mn>6</mn></math>", "image": null, "isCorrect": false}, {"id": "cZ6gj", "text": "<math><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "qYJEx", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Combined mean,&nbsp;<math><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">x</mi></mrow><mo>-</mo></mover><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>10</mn><mo>+</mo><mn>4</mn><mo>&#215;</mo><mn>10</mn></mrow><mrow><mn>20</mn></mrow></mfrac><mo>=</mo><mn>3</mn></math><br /><math><msub><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mover accent=\"true\"><mrow><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mo>-</mo></mover><mo>-</mo><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">x</mi></mrow><mo>-</mo></mover><mo>=</mo><mo>-</mo><mn>1</mn></math><br /><math><msub><mrow><mi mathvariant=\"normal\">d</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mover accent=\"true\"><mrow><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mo>-</mo></mover><mo>-</mo><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">x</mi></mrow><mo>-</mo></mover><mo>=</mo><mn>1</mn></math><br />Combined variance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><msub><mi mathvariant=\"normal\">n</mi><mn>1</mn></msub><msubsup><mi mathvariant=\"normal\">&#963;</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msub><mi mathvariant=\"normal\">n</mi><mn>2</mn></msub><msup><mi mathvariant=\"normal\">&#963;</mi><mn>2</mn></msup><mo>+</mo><msub><mi mathvariant=\"normal\">n</mi><mn>1</mn></msub><msubsup><mi mathvariant=\"normal\">d</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msub><mi mathvariant=\"normal\">n</mi><mn>2</mn></msub><msubsup><mi mathvariant=\"normal\">d</mi><mn>2</mn><mn>2</mn></msubsup></mrow><mrow><msub><mi>n</mi><mn>1</mn></msub><mo>+</mo><msub><mi>n</mi><mn>2</mn></msub></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>11</mn><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mn>10</mn><mo>&#215;</mo><mn>4</mn><mo>+</mo><mn>10</mn><mo>&#215;</mo><mi mathvariant=\"normal\">k</mi><mo>+</mo><mn>10</mn><mo>&#215;</mo><mn>1</mn><mo>+</mo><mn>10</mn><mo>&#215;</mo><mn>1</mn></mrow><mn>20</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">k</mi><mo>=</mo><mn>5</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637cc060028ee682a2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "48", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "In ten observations, the mean of all&nbsp;<math><mn>10</mn></math> numbers is <math><mn>15</mn></math>, the mean of the first six observations is <math><mn>16</mn></math> and the mean of the last five observations is <math><mn>12</mn></math>. The sixth number is", "image": null}, "options": [{"id": "I4tmK", "text": "<math><mn>6</mn></math>", "image": null, "isCorrect": true}, {"id": "TLOtx", "text": "<math><mn>9</mn></math>", "image": null, "isCorrect": false}, {"id": "J8Fht", "text": "<math><mn>12</mn></math>", "image": null, "isCorrect": false}, {"id": "Dsn8i", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the mean of the last four observations be <math><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub></math>. Then, by the formula for combined mean, we get,<br /><br /><math><mn>15</mn><mo>=</mo><mfrac><mrow><mn>6</mn><mo>×</mo><mn>16</mn><mo>+</mo><mn>4</mn><mo>×</mo><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>6</mn><mo>+</mo><mn>4</mn></mrow></mfrac></math>&nbsp;<br /><br />or <math><mn>150</mn><mo>=</mo><mn>96</mn><mo>+</mo><mn>4</mn><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub></math>&nbsp;<br /><br /><math><mo>∴</mo><msub><mrow><mi>A</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>54</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br />Let the sixth number is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>, then taking the sixth number as a collection, the combined mean of this collection and the collection of the last four is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn></math>.<br /><br /><math><mo>∴</mo></math> By the definition of combined mean<br /><br /><math><mn>12</mn><mo>=</mo><mfrac><mrow><mn>1</mn><mo>×</mo><mi>x</mi><mo>+</mo><mn>4</mn><mo>×</mo><mfrac><mrow><mn>54</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow><mrow><mn>1</mn><mo>+</mo><mn>4</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mn>60</mn><mo>=</mo><mi>x</mi><mo>+</mo><mn>54</mn><mspace linebreak=\"newline\"></mspace><mo>∴</mo><mi>x</mi><mo>=</mo><mn>6</mn></math><br /><br />Hence, the sixth number <math><mo>=</mo><mn>6</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637842885dbecb1769", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "100", "isVisible": true}], "previousYearPapers": [{"_id": "690 ion (i) and (ii),&nbsp;we get,</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>8</mn><mo>,</mo><mo>&nbsp;</mo><mi>y</mi><mo>=</mo><mn>6</mn></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>6</mn><mo>,</mo><mo>&nbsp;</mo><mi>y</mi><mo>=</mo><mn>8</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639013185614837b22", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "58", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The mean of five observations is <math><mn>4</mn></math> and their variance is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2.8</mn></math>. If three of these observations are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>, then the other two are", "image": null}, "options": [{"id": "kNAqQ", "text": "<math><mn>2</mn></math> and <math><mn>9</mn></math>", "image": null, "isCorrect": false}, {"id": "WaX7J", "text": "<math><mn>3</mn></math> and <math><mn>8</mn></math>", "image": null, "isCorrect": false}, {"id": "sQ31F", "text": "<math><mn>4</mn></math> and <math><mn>7</mn></math>", "image": null, "isCorrect": false}, {"id": "wJVsL", "text": "<math><mn>5</mn></math> and <math><mn>6</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><mover accent=\"false\"><mrow><mi>x</mi></mrow><mo>¯</mo></mover><mo>=</mo><mn>4</mn><mo>,</mo><mi>N</mi><mo>=</mo><mn>5</mn></math><br />and <math><mfrac><mrow><mi mathvariant=\"normal\">Σ</mi><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mover accent=\"false\"><mrow><mi>x</mi></mrow><mo>¯</mo></mover></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>N</mi></mrow></mfrac><mo>=</mo><mn>2.8</mn></math><br /><math><mo>⇒</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">Σ</mi><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mover accent=\"false\"><mrow><mi>x</mi></mrow><mo>¯</mo></mover></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2.8</mn></mrow></mfenced><mn>5</mn></math><br /><math><mo>∴</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">Σ</mi><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mover accent=\"false\"><mrow><mi>x</mi></mrow><mo>¯</mo></mover></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>1</mn><mn>4</mn></math><br /><math><mo>∴</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mo>-</mo><mn>4</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mo>-</mo><mn>4</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>5</mn><mo>-</mo><mn>4</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>α</mi><mo>-</mo><mn>4</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>β</mi><mo>-</mo><mn>4</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>1</mn><mn>4</mn></math><br />Where <math><mi>α</mi><mo>,</mo><mi>β</mi></math> are the other two observations.<br /><math><mo>∴</mo><mn>4</mn><mo>+</mo><mn>4</mn><mo>+</mo><mn>1</mn><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>α</mi><mo>-</mo><mn>4</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>β</mi><mo>-</mo><mn>4</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>1</mn><mn>4</mn></math><br /><math><mo>∴</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>α</mi><mo>-</mo><mn>4</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>β</mi><mo>-</mo><mn>4</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>5</mn></math><br />Also, <math><mfrac><mrow><mn>2</mn><mo>+</mo><mn>2</mn><mo>+</mo><mn>5</mn><mo>+</mo><mi>α</mi><mo>+</mo><mi>β</mi></mrow><mrow><mn>5</mn></mrow></mfrac><mo>=</mo><mn>4</mn></math><br /><math><mo>∴</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi>α</mi><mo>+</mo><mi>β</mi><mo>=</mo><mn>20</mn><mo>-</mo><mn>9</mn><mo>=</mo><mn>1</mn><mn>1</mn></math><br />Clearly <math><mn>5</mn><mo>,</mo><mi></mi><mn>6</mn></math> only satisfy the above equations in <math><mi>α</mi><mo>,</mo><mi>β</mi><mo>.</mo></math><br />Hence, the required numbers are <math><mn>5,6</mn><mo>.</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638f2cd9c361d8e6d2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "66", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let <math><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>…</mo><mo>,</mo><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></msub></math> be <math><mi mathvariant=\"normal\">n</mi></math> observations such that <math><mrow><mo stretchy=\"false\">∑</mo><mrow><msubsup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mn>300</mn></mrow></mrow></math> and <math><mrow><mo stretchy=\"false\">∑</mo><mrow><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi></mrow></msub><mo>=</mo><mn>90</mn></mrow></mrow><mo>.</mo></math> Then a possible value of <math><mi mathvariant=\"normal\">n</mi></math> among the following is", "image": null}, "options": [{"id": "KKbdp", "text": "<math><mn>25</mn></math>", "image": null, "isCorrect": false}, {"id": "K87RS", "text": "<math><mn>18</mn></math>", "image": null, "isCorrect": false}, {"id": "qdyp3", "text": "<math><mn>29</mn></math>", "image": null, "isCorrect": true}, {"id": "XVYTK", "text": "<math><mn>22</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Variance <math><mi mathvariant=\"normal\"></mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">Σ</mi><msubsup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mo>-</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">Σ</mi><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math><mo>⇒</mo><msup><mrow><mfrac><mrow><mi mathvariant=\"normal\">Σ</mi><msubsup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi></mrow><mrow><mn>2</mn></mrow></msubsup></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mo>≥</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">Σ</mi><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">n</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math><mo>⇒</mo><mi mathvariant=\"normal\">n</mi><mo>≥</mo><mfrac><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">Σ</mi><msub><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi></mrow></msub></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi mathvariant=\"normal\">Σ</mi><msubsup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mi mathvariant=\"normal\">i</mi></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfrac><mo>⇒</mo><mi mathvariant=\"normal\">n</mi><mo>≥</mo><mfrac><mrow><mn>8100</mn></mrow><mrow><mn>300</mn></mrow></mfrac><mo>⇒</mo><mi mathvariant=\"normal\">n</mi><mo>≥</mo><mn>27</mn></math><br />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638a9e34c187c71bc0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "83", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "All the students of a class performed poorly in physics. The teacher decided to give grace marks of <math><mn>15</mn></math> to the entire class. Which of the following statistical measures will not change even after the grace marks were given?", "image": null}, "options": [{"id": "EWFqo", "text": "median", "image": null, "isCorrect": false}, {"id": "ZudYW", "text": "mode", "image": null, "isCorrect": false}, {"id": "jiBgf", "text": "variance", "image": null, "isCorrect": true}, {"id": "0Fcn6", "text": "mean", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Variance is not changed by the change of origin.<br /><math><mi>σ</mi><mo>=</mo><msqrt><mfrac><mrow><mrow><mo stretchy=\"false\">∑</mo><mrow><msup><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mover accent=\"true\"><mrow><mi>x</mi></mrow><mo>-</mo></mover></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow></mrow><mrow><mi>n</mi></mrow></mfrac></msqrt></math>. Therefore, <math><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><mn>15</mn><mo>⇒</mo><mover accent=\"true\"><mrow><mi>y</mi></mrow><mo>-</mo></mover><mo>=</mo><mover accent=\"true\"><mrow><mi>x</mi></mrow><mo>-</mo></mover><mo>+</mo><mn>15</mn></math><br /><math><msub><mrow><mi>σ</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msqrt><mfrac><mrow><mrow><mo stretchy=\"false\">∑</mo><mrow><msup><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>y</mi><mo>+</mo><mn>15</mn><mo>-</mo><mover accent=\"true\"><mrow><mi>y</mi></mrow><mo>-</mo></mover><mo>-</mo><mn>15</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow></mrow><mrow><mi>n</mi></mrow></mfrac></msqrt><mo>=</mo><msqrt><mfrac><mrow><mrow><mo stretchy=\"false\">∑</mo><mrow><msup><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mover accent=\"true\"><mrow><mi>y</mi></mrow><mo>-</mo></mover></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mrow></mrow><mrow><mi>n</mi></mrow></mfrac></msqrt><mo>=</mo><mi>σ</mi></math>.<br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863856bea4d06886dd7", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71 &#8721;</mo><msubsup><mi>x</mi><mi>i</mi><mn>2</mn></msubsup><mo>-</mo><mn>8</mn><mo>&#8721;</mo><msub><mi>x</mi><mi>i</mi></msub><mo>+</mo><mn>16</mn><mo>&#215;</mo><mn>50</mn></mrow><mn>50</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mo>&#8721;</mo><msubsup><mi>x</mi><mi>i</mi><mn>2</mn></msubsup></mrow><mn>50</mn></mfrac><mo>-</mo><mn>8</mn><mfrac><mrow><mo>&#8721;</mo><msub><mi>x</mi><mi>i</mi></msub></mrow><mn>50</mn></mfrac><mo>+</mo><mn>16</mn><mo>=</mo><mn>512</mn><mo>-</mo><mn>8</mn><mo>&#215;</mo><mn>16</mn><mo>+</mo><mn>16</mn><mo>=</mo><mn>400</mn></math>&nbsp;(using (i) and (ii))", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634f9fd7a8ed5e1e0a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "11", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The mean and standard deviation of <math><mn>100</mn></math> observations were calculated as <math><mn>40</mn></math> and <math><mn>5.1</mn><mo>,</mo></math> respectively by a student who took by mistake <math><mn>50</mn></math> instead of <math><mn>40</mn></math> for one observation, then&nbsp;the correct standard deviation is", "image": null}, "options": [{"id": "IkPVN", "text": "<math><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "SfL6T", "text": "<math><mn>6</mn></math>", "image": null, "isCorrect": false}, {"id": "BBt96", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "JnwQU", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Standard deviation <math><mfenced separators=\"|\ ><mi mathvariant=\"normal\">n</mi></mrow><mi mathvariant=\"normal\">n</mi></mfrac><mo>-</mo><mn>1</mn></msqrt><mo>=</mo><msqrt><mn>3</mn></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
