iced": null}, {"_id": "6151e863ee42a84acb87d98a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "73", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two vertical poles <math><mi>A</mi><mi>L</mi></math> and <math><mi>B</mi><mi>M</mi></math> of heights&nbsp;<math><mn>25</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi></math> and <math><mn>100</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi></math> respectively stand apart on a horizontal plane. If <math><mi>A</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi>B</mi></math> be the feet of the poles and <math><mi>A</mi><mi>M</mi></math> and <math><mi>B</mi><mi>L</mi></math> intersect at <math><mi>P</mi><mo>,</mo></math> then the height of <math><mi>P</mi></math> from the horizontal plane is equal to", "image": null}, "options": [{"id": "VWotC", "text": "<math><mn>20</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "dCwhV", "text": "<math><mn>18</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "SaJqD", "text": "<math><mn>16</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "l07Ot", "text": "<math><mn>15</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/d58d3e20-9285-4a1c-8be1-ab29deaf070b.png\" style=\"max-width:\"100%\"; object-fit:contain\" style=\"width:2.42014in;height:2.07361in\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>25</mn><mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow></mfrac><mo>=</mo><mfrac><mi>z</mi><mi>y</mi></mfrac><mo>&#160;</mo><mfenced open=\"{\" close=\"}\" separators=\"|\"><mrow><mo>&#8757;</mo><mo>&#8710;</mo><mi>L</mi><mi>A</mi><mi>B</mi><mo>~</mo><mo>&#8710;</mo><mi>P</mi><mi>N</mi><mi>B</mi></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mi>y</mi><mo>=</mo><mfrac><mrow><mi>z</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow></mfenced></mrow><mrow><mn>25</mn></mrow></mfrac><mi mathvariant=\"normal\"></mi><mo>&#8230;</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math><br />Also, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>100</mn><mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow></mfrac><mo>=</mo><mfrac><mi>z</mi><mi>x</mi></mfrac><mo>&#160;</mo><mfenced open=\"{\" close=\"}\" separators=\"|\"><mrow><mo>&#8757;</mo><mo>&#8710;</mo><mi>M</mi><mi>B</mi><mi>A</mi><mo>~</mo><mo>&#8710;</mo><mi>P</mi><mi>N</mi><mi>A</mi></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mfrac><mrow><mi>z</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow></mfenced></mrow><mrow><mn>100</mn></mrow></mfrac><mo>&#8230;</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math><br />Adding equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mi mathvariant=\"normal\">i</mi></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow></mfenced><mfenced separators=\"|\"><mrow><mfrac><mi>z</mi><mn>25</mn></mfrac><mo>+</mo><mfrac><mi>z</mi><mn>100</mn></mfrac></mrow></mfenced><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>z</mi><mo>=</mo><mn>20</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e6e8435821e648ae", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A harbour lies in the direction&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>60</mn><mi>o</mi></msup></math>&nbsp;south-west from a fort and at a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn></math> km from it. A ship sets out from the harbour at noon and sails due east at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math> km/hour, then the time (in hours) in the evening at which the ship will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>70</mn></math> km from the fort is", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> be the position of the harbour and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math> be of the fort. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>A</mi><mo>&#160;</mo><mo>=</mo><mn>30</mn><mo>,</mo><mo>&#160;</mo><mi>O</mi><mi>B</mi><mo>=</mo><mn>70</mn></math>. Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>=</mo><mo>&#160;</mo><mi>x</mi></math>.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/2e37d884-3bdb-4cc0-a97a-4c17e211f646-Capture.JPG\" style=\"width: 250px; height: 200px;\" /></p><p>Applying cosine formula in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mi>O</mi><mi>A</mi><mi>B</mi></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cos</mi><msup><mn>60</mn><mi>o</mi></msup><mo>=</mo><mfrac><mrow><mi>O</mi><msup><mi>A</mi><mn>2</mn></msup><mo>+</mo><mi>A</mi><msup><mi>B</mi><mn>2</mn></msup><mo>&#8722;</mo><mi>O</mi><msup><mi>B</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn><mi>O</mi><mi>A</mi><mo>.</mo><mi>A</mi><mi>B</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mn>900</mn><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup><mo>&#8722;</mo><mn>4900</mn></mrow><mrow><mn>2</mn><mo>&#215;</mo><mn>30</mn><mo>&#215;</mo><mi>x</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>&#8722;</mo><mn>30</mn><mi>x</mi><mo>&#8722;</mo><mn>4000</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>80</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>=</mo><mn>80</mn></math>&nbsp;kms</p><p>Speed of ship =<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math> km/hr</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;Time =<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math> hrs</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e549932f5ffa86c3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "08", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A chimney of <math> <mrow> <mtext>20&nbsp;m</mtext></mrow> </math> height standing on the top of a building subtends an angle whose tangent is <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac></math> at a distance of <math> <mrow> <mtext>70&nbsp;m</mtext></mrow> </math> from the foot of the building, then the height of building is", "image": null}, "options": [{"id": "tFNzt", "text": "<math> <mrow> <mtext>50&nbsp;m</mtext></mrow> </math>", "image": null, "isCorrect": true}, {"id": "rNFKo", "text": "<math> <mrow>  <mtext>25&#x00A0;m</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "Z0kVC", "text": "<math> <mrow>  <mtext>75&#x00A0;m</mtext></mrow></math>", "image": null, "isCorrect": false}, {"id": "4ydvZ", "text": "<math> <mrow>  <mtext>100&#x00A0;m</mtext></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/rgwyzfyyebmpzjqohjqxivnbmsywmqueocfrfbpjjbclzaulzh.jpeg\" /><br /><br />Given,&nbsp;<math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>α</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac></math><br /><br /><math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>α</mi><mo>+</mo><mi>β</mi></mrow></mfenced></mrow></mrow><mo>=</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>α</mi></mrow></mrow><mo>+</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>β</mi></mrow></mrow></mrow><mrow><mn>1</mn><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>α</mi></mrow></mrow><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>β</mi></mrow></mrow></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mi>h</mi><mo>+</mo><mn>20</mn></mrow><mrow><mn>70</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mn>70</mn></mrow></mfrac></mrow><mrow><mn>1</mn><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mo>⋅</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mn>70</mn></mrow></mfrac></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mi>h</mi><mo>+</mo><mn>20</mn></mrow><mrow><mn>70</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>70</mn><mo>+</mo><mn>6</mn><mi>h</mi></mrow><mrow><mn>420</mn><mo>-</mo><mi>h</mi></mrow></mfrac><mi>&nbsp;</mi></math><br /><br /><math><mo>⇒</mo></math> <math><mi>h</mi><mo>=</mo><mn>50</mn></math><br /><br />Hence,&nbsp;<math> <mrow> <mtext>50&nbsp;m</mtext></mrow> </math> is correct choice.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e3a9fa268e2c47b2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "39", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The angle of elevation of a cloud from a point <math><mn>10</mn></math> meters above the surface of a lake is <math><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> and the angle of depression of its reflection&nbsp;from that point is <math><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math>. Then the height of the cloud above the lake is", "image": null}, "options": [{"id": "QkFph", "text": "<math><mn>20&nbsp;</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}, {"id": "oF5ri", "text": "<math><mn>20</mn><msqrt><mn>3&nbsp;</mn></msqrt><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "4r7nD", "text": "<math><mfrac><mrow><mn>20</mn><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><msqrt><mn>3&nbsp;</mn></msqrt></mrow></mfrac><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "XnJi3", "text": "<math><mn>20</mn><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1&nbsp;</mn></mrow></mfenced><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let <math><mi>C</mi></math> be the cloud,&nbsp;<math><mi>D</mi></math> its reflection and&nbsp;<math><mi>P</mi><mi>B</mi></math> is the surface of the lake<br />Then,<br /><math><mi>P</mi><mi>C</mi><mo>=</mo><mi>P</mi><mi>D</mi><mo>=</mo><mi>H</mi><mo>,</mo></math><br /><mi></mi><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mi>A</mi><mo>=</mo><mfenced><mrow><mi>H</mi><mo>-</mo><mn>10</mn></mrow></mfenced><mi>cot</mi><mo>&#8289;</mo><msup><mn>30</mn><mi>o</mi></msup><mo>=</mo><mfenced><mrow><mi>H</mi><mo>+</mo><mn>10</mn></mrow></mfenced><mi>cot</mi><mo>&#8289;</mo><msup><mn>60</mn><mi>o</mi></msup></math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\"></mi></mrow></msup></mrow></mrow><br /><math><mi>H</mi><mo>=</mo><mn>10</mn><mfenced separators=\"|\"><mrow><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mo>&#8289;</mo><mrow><mn>3</mn><msup><mrow><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow><mo>+</mo><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mo>&#8289;</mo><mrow><mn>6</mn><msup><mrow><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mo>&#8289;</mo><mrow><mn>3</mn><msup><mrow><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mo>&#8289;</mo><mrow><mn>6</mn><msup><mrow><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow></mrow></mfrac></mrow></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>10</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mfenced separators=\"|\"><mrow><mn>9</mn><msup><mrow><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mfenced></mrow></mrow></mrow></mfenced><mo>/</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mfenced separators=\"|\"><mrow><mn>3</mn><msup><mrow><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mfenced><mo>=</mo><mn>20</mn></math> meters<br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/13803d68-5e00-405b-af1e-9ed3e357d957.png\" style=\"width:1.46875in;height:1.73958in\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dfae61d237696dfe", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A tower subtends angles&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>,</mo><mo>&nbsp;</mo><mn>2</mn><mi>α</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>α</mi></math>, respectively, at points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo mathvariant=\"italic\">,</mo><mi>B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math> all lying on a horizontal line through the foot of the tower. If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>A</mi><mi>B</mi></mrow><mrow><mi>B</mi><mi>C</mi></mrow></mfrac><mo>=</mo><mn>1</mn><mo>+</mo><mi>p</mi><mi>cos</mi><mo>(</mo><mi>p</mi><mi>α</mi><mo>)</mo></math>,&nbsp;then the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> is", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>M</mi></math> be the tower.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/91f9f5b2-2398-49c4-b9e8-ac93054ed292-Capture.JPG\" style=\"width: 200px; height: 137px;\" /></p><p>Given,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∠</mo><mi>B</mi><mi>A</mi><mi>P</mi><mo>=</mo><mi>α</mi><mo>,</mo><mo>∠</mo><mi>C</mi><mi>B</mi><mi>P</mi><mo>=</mo><mn>2</mn><mi>α</mi><mtext> </mtext><mi>a</mi><mi>n</mi><mi>d</mi><mtext> </mtext><mo>∠</mo><mi>M</mi><mi>C</mi><mi>P</mi><mo>=</mo><mn>3</mn><mi>α</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mo>∠</mo><mi>A</mi><mi>P</mi><mi>B</mi><mo>=</mo><mo>∠</mo><mi>P</mi><mi>B</mi><mi>C</mi><mo>−</mo><mo>∠</mo><mi>B</mi><mi>A</mi><mi>P</mi><mo>=</mo><mn>2</mn><mi>α</mi><mo>−</mo><mi>α</mi><mo>=</mo><mi>α</mi></math></p><p>Similarly,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∠</mo><mi>B</mi><mi>P</mi><mi>C</mi><mo>=</mo><mi>α</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>B</mi><mi>P</mi><mo>=</mo><mi>A</mi><mi>B</mi></math></p><p>By sine formula in triangle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mi>C</mi><mi>P</mi></math>, we have&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>B</mi><mi>C</mi></mrow><mrow><mi>sin</mi><mrow><mo>(</mo><mo>∠</mo><mi>B</mi><mi>P</mi><mi>C</mi><mo>)</mo></mrow></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>B</mi><mi>P</mi></mrow><mrow><mi>sin</mi><mrow><mo>(</mo><mo>∠</mo><mi>B</mi><mi>C</mi><mi>P</mi><mo>)</mo></mrow></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><mi>B</mi><mi>C</mi></mrow><mrow><mi>sin</mi><mi>α</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>A</mi><mi>B</mi></mrow><mrow><mi>sin</mi><mo>(</mo><msup><mn>180</mn><mi>o</mi></msup><mo>−</mo><mn>3</mn><mi>α</mi><mo>)</mo></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><mi>A</mi><mi>B</mi></mrow><mrow><mi>B</mi><mi>C</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>sin</mi><mn>3</mn><mi>α</mi></mrow><mrow><mi>sin</mi><mi>α</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>3</mn><mi>sin</mi><mi>α</mi><mo>−</mo><mn>4</mn><msup><mi>sin</mi><mn>3</mn></msup><mi>α</mi></mrow><mrow><mi>sin</mi><mi>α</mi></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn><mo>−</mo><mn>4</mn><msup><mi>sin</mi><mn>2</mn></msup><mi>α</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn><mo>−</mo><mn>2</mn><mrow><mo>(</mo><mn>1</mn><mo>−</mo><mi>cos</mi><mn>2</mn><mi>α</mi><mo>)</mo></mrow></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>+</mo><mn>2</mn><mi>cos</mi><mn>2</mn><mi>α</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dbdbd808e90945ea", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "33", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A pole stands vertically in the center of a square. When <math><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> is the elevation of the sun,&nbsp; the tip of its shadow just reaches the side of the square and is at a distance of&nbsp;<math><mn>30</mn></math> meters and <math><mn>40</mn></math> meters from the ends of that side.&nbsp;The height of the pole is", "image": null}, "options": [{"id": "fgEi6", "text": "<math><mn>50</mn></math> meters", "image": null, "isCorrect": false}, {"id": "P17X1", "text": "<math><mn>25</mn></math> meters", "image": null, "isCorrect": false}, {"id": "T7S1I", "text": "<math><mn>25</mn><msqrt><mn>2</mn></msqrt></math> meters", "image": null, "isCorrect": true}, {"id": "AbX62", "text": "<math><mn>50</mn><msqrt><mn>2</mn></msqrt></math> meters", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/e4dd170e-3a16-4b52-b1ab-623989c72de4.png\" style=\"width:2.92014in;height:1.68681in\" /><br />Let <math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">D</mi></math> is a square and <math><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">P</mi></math> is the pole.<br />Now, <math><mi>&#8736;</mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">Q</mi><mi mathvariant=\"normal\">O</mi><mo>=</mo><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math><br />Also,&nbsp;<math><mi mathvariant=\"normal\">D</mi><mi mathvariant=\"normal\">Q</mi><mo>=</mo><mn>30</mn></math> meters<br /><math><mi mathvariant=\"normal\">Q</mi><mi mathvariant=\"normal\">A</mi><mo>=</mo><mn>40</mn></math> meters<br />Side of square <math><mo>=</mo><mn>30</mn><mo>+</mo><mn>40</mn><mo>=</mo><mn>70</mn></math> meters<br />Now in <math><mo>&#8710;</mo><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">Q</mi></math>,</p><p><math><mi>&#8736;</mi><mi mathvariant=\"normal\">Q</mi><mo>=</mo><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> and <math><mi>&#8736;</mi><mi mathvariant=\"normal\">O</mi><mo>=</mo><msup><mrow><mn>90</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math><br /><math><mo>&#8756;</mo><mi>&#8736;</mi><mi mathvariant=\"normal\">P</mi><mo>=</mo><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math><br /><math><mo>&#8756;</mo><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">P</mi><mo>=</mo><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">Q</mi><mo>=</mo><mi>h</mi></math> (let)<br />Now, let a&nbsp;perpendicular is drawn from <math><mi mathvariant=\"normal\">O</mi></math> to <math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">D</mi></math> which is <math><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">M</mi></math><br />In <math><mo>&#8710;</mo><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">Q</mi></math>,<br /><math><mi mathvariant=\"normal\">Q</mi><mi mathvariant=\"normal\">M</mi><mo>=</mo><mi mathvariant=\"normal\">D</mi><mi mathvariant=\"normal\">M</mi><mo>-</mo><mi mathvariant=\"normal\">Q</mi><mi mathvariant=\"normal\">D</mi><mo>=</mo><mfrac><mrow><mn>70</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>-</mo><mn>30</mn><mo>=</mo><mn>5</mn></math> meters<br /><math><mi>O</mi><mi>M</mi><mo>=</mo><mfrac><mrow><mi>A</mi><mi>B</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>70</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>35</mn></math> meters<br /><math><mo>&#8756;</mo><mi>O</mi><mi>Q</mi><mo>=</mo><msqrt><msup><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">Q</mi><mi mathvariant=\"normal\">M</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">M</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mo>=</mo><msqrt><msup><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mn>35</mn></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><math><mo>=</mo><mn>5</mn><msqrt><mn>1</mn><mo>+</mo><msup><mrow><mn>7</mn></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mo>=</mo><mn>25</mn><msqrt><mn>2</mn></msqrt></math> meters</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cc109306e2eec7ab", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "66", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A person standing at the foot of a tower walks a distance of&nbsp;<math><mn>3</mn><mi mathvariant=\"normal\"></mi></math> meters from the tower and observes that the angle of elevation of the top of the tower is <math><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>.</mo></math> He then walks a distance <math><mn>4</mn></math> meters perpendicular to the previous direction and observes the angle of elevation to be <math><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">&#946;</mi><mo>.</mo></math>&nbsp;Then,&nbsp;<math><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mn>2</mn><mi mathvariant=\"normal\">&#946;</mi></mrow></mrow></math> is equal to", "image": null}, "options": [{"id": "c74eT", "text": "<math><mfrac><mrow><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "G2KYa", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "RGwBG", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "VASDe", "text": "<math><mfrac><mrow><mn>11</mn></mrow><mrow><mn>14</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Let <math><mi mathvariant=\"normal\">O</mi></math> be the foot of the tower <math><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">P</mi></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/028073cf-e478-4ace-b308-fadf7892f074.png\" style=\"width:1.86042in;height:2.62708in\" /><br /><math><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">A</mi><mo>=</mo><mn>3</mn><mi mathvariant=\"normal\">m</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\">m</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">B</mi><mo>=</mo><mn>5</mn><mi mathvariant=\"normal\">m</mi><mo>&#160;</mo><mfenced open=\"{\" close=\"}\" separators=\"|\"><mrow><mo>&#8757;</mo><mi mathvariant=\"normal\">O</mi><msup><mi mathvariant=\"normal\">A</mi><mn>2</mn></msup><mo>+</mo><mi mathvariant=\"normal\">A</mi><msup><mi mathvariant=\"normal\">B</mi><mn>2</mn></msup><mo>=</mo><mi mathvariant=\"normal\">O</mi><msup><mi mathvariant=\"normal\">B</mi><mn>2</mn></msup></mrow></mfenced></math><br /><math><mo>&#8756;</mo></math> In <math><mo>&#8710;</mo><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">P</mi><mo>,</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mo>&#8289;</mo><mn>30</mn><mo>&#176;</mo><mo>=</mo><mfrac><mi mathvariant=\"normal\">h</mi><mn>3</mn></mfrac><mo>&#160;</mo><mo>&#8756;</mo><mi mathvariant=\"normal\">h</mi><mo>=</mo><msqrt><mn>3</mn></msqrt></math><br />and in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">B</mi><mo>,</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#946;</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">h</mi><mn>5</mn></mfrac><mo>&#160;</mo><mo>&#8756;</mo><mi mathvariant=\"normal\">h</mi><mo>=</mo><mn>5</mn><mi>tan</mi><mo>&#8289;</mo><mi mathvariant=\"normal\">&#946;</mi></math><br />Thus, <math><mi mathvariant=\"normal\">h</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mo>=</mo><mn>5</mn><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi mathvariant=\"normal\">&#946;</mi><mo>&#8658;</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi mathvariant=\"normal\">&#946;</mi><mo>=</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>5</mn></mrow></mfrac></mrow></mrow><mi mathvariant=\"normal\"></mi></mrow></mrow></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cos</mi><mo>&#8289;</mo><mn>2</mn><mi mathvariant=\"normal\">&#946;</mi><mo>=</mo><mfrac><mrow><mn>1</mn><mo>-</mo><msup><mi>tan</mi><mn>2</mn></msup><mo>&#8289;</mo><mi mathvariant=\"normal\">&#946;</mi></mrow><mrow><mn>1</mn><mo>+</mo><msup><mi>tan</mi><mn>2</mn></msup><mo>&#8289;</mo><mi mathvariant=\"normal\">&#946;</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>-</mo><mfrac><mn>3</mn><mn>25</mn></mfrac></mrow><mrow><mn>1</mn><mo>+</mo><mfrac><mn>3</mn><mn>25</mn></mfrac></mrow></mfrac><mo>=</mo><mfrac><mn>11</mn><mn>14</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cbcbd16c17a944d3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "11", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The angle of elevation of a cloud from a point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>250</mn><mo>&#160;</mo><mi>m</mi></math> above a lake is <math><msup><mrow><mn>15</mn></mrow><mrow><mi>o</mi></mrow></msup></math> and angle of depression of its reflection in the lake is <math><msup><mrow><mn>45</mn></mrow><mrow><mi>o</mi></mrow></msup></math> . The height of the cloud is", "image": null}, "options": [{"id": "2Lo5S", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>250</mn><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mi>m</mi></math>", "image": null, "isCorrect": true}, {"id": "6O0WB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>250</mn><mo>&#160;</mo><mi>m</mi></math>", "image": null, "isCorrect": false}, {"id": "nM2jR", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>250</mn><msqrt><mn>3</mn></msqrt></mfrac><mo>&#160;</mo><mi>m</mi></math>", "image": null, "isCorrect": false}, {"id": "WJTTt", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/iawkxfnakkaaxhplhryjexxtlyoggocirdbvbsuyriwpryuzmr.jpeg\" /><br /><br /><math><mi>h</mi><mo>=</mo><mn>250</mn></math><br /><br /><math><mi>α</mi><mo>=</mo><msup><mrow><mn>15</mn></mrow><mrow><mi>o</mi></mrow></msup></math><br /><br /><math><mi>θ</mi><mo>=</mo><msup><mrow><mn>45</mn></mrow><mrow><mi>o</mi></mrow></msup></math><br /><br /><math><mi>x</mi><mo>=</mo><mfrac><mrow><mi>h</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>θ</mi><mo>+</mo><mi>α</mi></mrow></mfenced></mrow></mrow></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi>θ</mi><mo>-</mo><mi>α</mi></mrow></mfenced></mrow></mrow></mrow></mfrac></math><br /><br /><math><mo>=</mo><mn>250</mn><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><msup><mrow><mn>60</mn></mrow><mrow><mi>o</mi></mrow></msup></mrow></mrow></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><msup><mrow><mn>30</mn></mrow><mrow><mi>o</mi></mrow></msup></mrow></mrow></mrow></mfrac></math><br /><br /><math><mo>=</mo><mn>250</mn><mi>&nbsp;</mi><msqrt><mn>3</mn></msqrt></math><br /><br />&nbsp;", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cb76d817ebfe9436", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "01", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A flag - staff of <math><mn>5</mn></math> meters high stands on a building of <math><mn>25</mn></math> meters height. For an observer at a height of <math><mn>30</mn></math> meters,&nbsp;the flag-staff and the building subtend equal angles. The distance of the observer from the top of the flag - staff is", "image": null}, "options": [{"id": "xyS1X", "text": "<math><mfrac><mrow><mn>5</mn><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac><mtext>&nbsp;m</mtext></math> ", "image": null, "isCorrect": false}, {"id": "1m9h3", "text": "<math><mn>5</mn><msqrt><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt><mtext>&nbsp;m</mtext></math>", "image": null, "isCorrect": true}, {"id": "PekYo", "text": "<math><mn>5</mn><msqrt><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></msqrt><mtext>&nbsp;m</mtext></math>", "image": null, "isCorrect": false}, {"id": "RpiXw", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have <math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>α</mi><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mi>x</mi></mrow></mfrac></mrow></mrow></math> and <math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>α</mi><mo>=</mo><mfrac><mrow><mn>30</mn></mrow><mrow><mi>x</mi></mrow></mfrac></mrow></mrow></math><br /><br /><math><mo>∴</mo></math> <math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>α</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>30</mn></mrow><mrow><mn>5</mn><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mo>⁡</mo><mrow><mi>α</mi></mrow></mrow></mrow></mfrac><mi>&nbsp;</mi><mo>⇒</mo><mi>&nbsp;</mi><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>α</mi></mrow></mrow><mo>=</mo><mn>6</mn><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>α</mi></mrow></mrow></math><br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ci/image33-a1face81-2bf5-49b7-b264-0059c06b9652.jpg\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ca824dedbcc3ec07", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "56", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A tower subtends angles <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi><mo>,</mo><mo>&nbsp;</mo><mn>2</mn><mi>α</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>α</mi></math> respectively at points, <math><mi>A</mi><mo>,</mo><mi></mi><mi>B</mi></math> and <math><mi>C</mi></math> (all points lying on the same side on a horizontal line through the foot of the tower), then the value of&nbsp;<math><mfrac><mrow><mi>A</mi><mi>B</mi></mrow><mrow><mi>B</mi><mi>C</mi></mrow></mfrac></math> is equal to", "image": null}, "options": [{"id": "nfk4G", "text": "<math><mn>1</mn><mo>+</mo><mn>2</mn><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>α</mi></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "AcvR1", "text": "<math><mn>1</mn><mo>-</mo><mn>2</mn><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>α</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "6pxFI", "text": "<math><mn>1</mn><mo>+</mo><mn>3</mn><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>α</mi></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "60AkZ", "text": "<math><mn>1</mn><mo>-</mo><mn>3</mn><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>α</mi></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let, the height of the tower is <math><mi>P</mi><mi>Q</mi><mo>=</mo><mi>h</mi></math><br />Where,&nbsp;<math><mi>Q</mi></math> is the foot of the tower and <math><mi>P</mi></math> is the top of the tower, then<br /><math><mi>Q</mi><mi>A</mi><mo>=</mo><mi>h</mi><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mo>⁡</mo><mrow><mi>α</mi></mrow></mrow></math><br /><math><mi>Q</mi><mi>B</mi><mo>=</mo><mi>h</mi><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mo>⁡</mo><mrow><mn>2</mn><mi>α</mi></mrow></mrow></math><br /><math><mi>Q</mi><mi>C</mi><mo>=</mo><mi>h</mi><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mo>⁡</mo><mrow><mn>3</mn><mi>α</mi></mrow></mrow></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/345678ojhgfdfghjkliufd.JPG\" style=\"width: 150px; height: 140px;\" /></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>A</mi><mi>B</mi></mrow><mrow><mi>B</mi><mi>C</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>Q</mi><mi>A</mi><mo>-</mo><mi>Q</mi><mi>B</mi></mrow><mrow><mi>Q</mi><mi>B</mi><mo>-</mo><mi>Q</mi><mi>C</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>cot</mi><mo>⁡</mo><mi>α</mi><mo>-</mo><mi>cot</mi><mo>⁡</mo><mn>2</mn><mi>α</mi></mrow><mrow><mi>cot</mi><mo>⁡</mo><mn>2</mn><mi>α</mi><mo>-</mo><mi>cot</mi><mo>⁡</mo><mn>3</mn><mi>α</mi></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mfrac><mrow><mi>cos</mi><mo>⁡</mo><mi>α</mi></mrow><mrow><mi>sin</mi><mo>⁡</mo><mi>α</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>cos</mi><mo>⁡</mo><mn>2</mn><mi>α</mi></mrow><mrow><mi>sin</mi><mo>⁡</mo><mn>2</mn><mi>α</mi></mrow></mfrac></mrow><mrow><mfrac><mrow><mi>cos</mi><mo>⁡</mo><mn>2</mn><mi>α</mi></mrow><mrow><mi>sin</mi><mo>⁡</mo><mn>2</mn><mi>α</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>cos</mi><mo>⁡</mo><mn>3</mn><mi>α</mi></mrow><mrow><mi>
