ght-angled <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>A</mi><mi>B</mi><mi>D</mi><mo>,</mo></math><br /><math><mfrac><mrow><mi>A</mi><mi>B</mi></mrow><mrow><mi>B</mi><mi>D</mi></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><msup><mrow><mn>75</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mfrac><mi>h</mi><mi>x</mi></mfrac><mo>=</mo><mi>tan</mi><mo>&#8289;</mo><msup><mn>75</mn><mi mathvariant=\"normal\">o</mi></msup><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>h</mi><mo>=</mo><mi>x</mi><mi>tan</mi><mo>&#8289;</mo><msup><mn>75</mn><mi mathvariant=\"normal\">o</mi></msup><mo>&#8230;</mo><mo>&#8230;</mo><mo>.</mo><mo>.</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">i</mi></mfenced></math><br />In right-angled <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8710;</mo><mi>B</mi><mi>C</mi><mi>E</mi><mo>,</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>B</mi><mi>E</mi></mrow><mrow><mi>E</mi><mi>C</mi></mrow></mfrac><mo>=</mo><mi>tan</mi><mo>&#8289;</mo><msup><mn>15</mn><mi mathvariant=\"normal\">o</mi></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>10</mn><mi>x</mi></mfrac><mo>=</mo><mi>tan</mi><mo>&#8289;</mo><msup><mn>15</mn><mi mathvariant=\"normal\">o</mi></msup><mspace linebreak=\"newline\"/><mo>&#8756;</mo><mi>x</mi><mo>=</mo><mfrac><mn>10</mn><mrow><mi>tan</mi><mo>&#8289;</mo><msup><mn>15</mn><mi mathvariant=\"normal\">o</mi></msup></mrow></mfrac><mo>&#8230;</mo><mo>&#8230;</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math><br />From <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">i</mi></mrow></mfenced><mo>,</mo></math> we get,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>h</mi><mo>=</mo><mfrac><mn>10</mn><mrow><mi>tan</mi><mo>&#8289;</mo><msup><mn>15</mn><mi mathvariant=\"normal\">o</mi></msup></mrow></mfrac><mo>&#215;</mo><mi>tan</mi><mo>&#8289;</mo><msup><mn>75</mn><mi mathvariant=\"normal\">o</mi></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>10</mn><msup><mfenced separators=\"|\"><mrow><mn>2</mn><mo>+</mo><msqrt><mn>3</mn></msqrt></mrow></mfenced><mn>2</mn></msup></math>&nbsp;meters</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a881e8fa224ddbb4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The angular elevation of tower <math><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">D</mi></math> at a point <math><mi mathvariant=\"normal\">A</mi></math> due south of it is <math> <mrow> <msup> <mrow> <mtext>60</mtext></mrow> <mtext>o</mtext> </msup> </mrow> </math> and at a point <math><mi mathvariant=\"normal\">B</mi></math> due west of <math><mi mathvariant=\"normal\">A</mi><mo>,</mo></math> the elevation is <math> <mrow> <mn>3</mn><msup> <mtext>0</mtext> <mtext>o</mtext> </msup> <mo>.</mo></mrow> </math> If <math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi><mo>=</mo><mn>5&nbsp;</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi><mo>,</mo></math> then the height of the tower is (where,&nbsp;<math><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">C</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">B</mi></math> and <math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\"></mi></math> are on the same ground level)", "image": null}, "options": [{"id": "sM09v", "text": "<math><mn>2</mn><msqrt><mn>3</mn></msqrt><mi>&nbsp;</mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "rjBdF", "text": "<math><mn>2</mn><msqrt><mn>6</mn></msqrt><mi>&nbsp;</mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "cfxso", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>5</mn><msqrt><mn>3</mn></msqrt></mrow><mn>2</mn></mfrac><mi>km</mi></math>", "image": null, "isCorrect": false}, {"id": "A3slj", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>5</mn><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "From <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>&#916;CDA</mtext><mo>,</mo><mo>&#160;</mo><mtext>x</mtext><mo>=</mo><mtext>h</mtext><mi>cot</mi><msup><mn>60</mn><mtext>o</mtext></msup><mo>=</mo><mfrac><mtext>h</mtext><msqrt><mn>3</mn></msqrt></mfrac></math><br />From <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>&#916;CDB</mtext><mo>,</mo><mo>&#160;</mo><mtext>y</mtext><mo>=</mo><mtext>h</mtext><mi>cot</mi><msup><mn>30</mn><mtext>o</mtext></msup><mo>=</mo><msqrt><mn>3</mn></msqrt><mtext>h</mtext></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/9de11ad4-ffb1-451f-b0ab-3f2b4fb3b072.png\" style=\"width:1.13333in;height:1.92708in\" /><br /><math><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi mathvariant=\"normal\">y</mi></mrow><mrow><mn>2</mn></mrow></msup></math> (in <math><mo>&#8710;</mo><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">B</mi></math>)<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mfenced separators=\"|\"><mfrac><mi mathvariant=\"normal\">h</mi><msqrt><mn>3</mn></msqrt></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><msup><mn>5</mn><mn>2</mn></msup><mo>=</mo><msup><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">h</mi></mrow></mfenced><mn>2</mn></msup><mo>&#8658;</mo><mi mathvariant=\"normal\">h</mi><mo>=</mo><mfrac><mrow><mn>5</mn><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi><mo>.</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639b4dd082f5c39325", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "107", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A balloon is rising vertically upwards. At an instant, an observer on the ground, whose distance from the balloon is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn></math>&nbsp;meters, sees the balloon at an angle of elevation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>30</mn><mtext>o</mtext></msup><mo>.</mo></math> If the balloon rises further vertically to a point where the angle of elevation as seen by the observer is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>45</mn><mtext>o</mtext></msup></math>, then its height (in meters) from the ground is<br />\r(Take <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt><mo>=</mo><mn>1.</mn><mn>73</mn></math>)", "image": null}, "options": [], "correctValue": "36.5", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/d433c209-adbd-4ecf-92b2-ee7a187260e0.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 200px; height: 191px;\" /><br />Let <math><mi>A</mi></math> be the observer,&nbsp;<math><mi>P</mi></math> be the initial position of the balloon and it is at <math><mi>Q</mi></math> when the angle of elevation is <math> <mrow> <msup> <mrow> <mn>45</mn></mrow> <mtext>o</mtext> </msup> </mrow> </math></p><p>From triangle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>P</mi></math>&nbsp;and triangle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>Q</mi></math>,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>A</mi><mi>B</mi><mo>=</mo><mn>50</mn><msqrt><mn>3</mn></msqrt><mo>=</mo><mi>B</mi><mi>Q</mi></math><br />and&nbsp;<math><mi>B</mi><mi>P</mi><mo>=</mo><mn>50</mn></math><br />So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi><mo>=</mo><mi>B</mi><mi>Q</mi><mo>-</mo><mi>B</mi><mi>P</mi><mo>=</mo><mn>50</mn><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>50</mn><mfenced><mrow><mn>0</mn><mo>.</mo><mn>73</mn></mrow></mfenced><mo>=</mo><mn>36</mn><mo>.</mo><mn>5</mn></math>&nbsp;meters</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638da4db9d01f782c0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "32", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two vertical poles of height <math><mn>10&#160;</mn><mi></mi><mi>m</mi></math> and&nbsp;<math><mn>40&#160;</mn><mi></mi><mi>m</mi></math> stand apart on a horizontal plane. The height (in meters) of the point of intersection of the lines joining the top of each pole to the foot of the other, from this horizontal plane is", "image": null}, "options": [{"id": "5SN3Z", "text": "<math><mn>8</mn></math>", "image": null, "isCorrect": true}, {"id": "zWFGW", "text": "<math><mn>10</mn></math>", "image": null, "isCorrect": false}, {"id": "XFb84", "text": "<math><mn>6</mn></math>", "image": null, "isCorrect": false}, {"id": "tf0fA", "text": "<math><mn>4</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mfenced separators=\"|\"><mn>0,0</mn></mfenced><mo>,</mo><mo>&#160;</mo><mi>D</mi><mfenced separators=\"|\"><mn>0,10</mn></mfenced><mo>,</mo></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mfenced separators=\"|\"><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><mn>0</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mi>C</mi><mfenced separators=\"|\"><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,40</mo></mrow></mfenced></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/2b650198-4e69-4fa2-88aa-753bbfdd0adc.png\" style=\"width:2.07361in;height:1.15347in\" /><br />Equation of <math><mi>A</mi><mi>C</mi><mo>&#8658;</mo><mi>y</mi><mo>=</mo><mfrac><mrow><mn>40</mn></mrow><mrow><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mi>x</mi></math> &hellip; <math><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math><br />Equation <math><mi>B</mi><mi>D</mi><mo>&#8658;</mo><mi>y</mi><mo>-</mo><mn>10</mn><mo>=</mo><mfrac><mrow><mo>-</mo><mn>10</mn></mrow><mrow><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mi>x</mi></math> &hellip; <math><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></math><br />From <math><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></math>, we get,&nbsp;<br /><math><mfrac><mrow><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>&#8901;</mo><mi>y</mi></mrow><mrow><mn>40</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>10</mn></mrow></mfenced><mo>&#8901;</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>10</mn></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>40</mn><mo>&#8658;</mo><mi>y</mi><mo>=</mo><mn>8</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638d65d9151fa04457", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "16", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi><mi>R</mi></math> is a triangular park with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi><mo>=</mo><mi>P</mi><mi>R</mi><mo>=</mo><mn>200</mn><mo>&#160;</mo><mi>m</mi></math>. A TV tower stands at the mid-point of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mi>R</mi></math>. If the angles of elevation of the top of the tower from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>,</mo><mi>Q</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>45</mn><mi>o</mi></msup></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>30</mn><mi>o</mi></msup></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>30</mn><mi>o</mi></msup></math>&nbsp;respectively, then the height of the tower (in meters) is&nbsp;", "image": null}, "options": [], "correctValue": "100", "solution": {"text": "<p>In the figure <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi><mi>R</mi></math> is triangular park with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi><mo>=</mo><mi>P</mi><mi>R</mi><mo>=</mo><mn>200</mn></math>.</p><p>TV tower of height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math> stands at midpoint <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math> of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mi>R</mi></math>.</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/abs/e312ab1b-1195-4525-95f8-c57c63e34924-Capture.JPG\" style=\"width: 300px; height: 261px;\" /></p><p>In triangle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mi>M</mi><mi>R</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mi>R</mi><mo>=</mo><mi>h</mi><mi>cot</mi><msup><mn>30</mn><mi>o</mi></msup></math></p><p>In triangle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi><mi>M</mi><mi>P</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>M</mi><mo>=</mo><mi>T</mi><mi>M</mi><mo>=</mo><mi>h</mi></math></p><p>In triangle <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>M</mi><mi>R</mi></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><mi>P</mi><msup><mi>M</mi><mn>2</mn></msup><mo>+</mo><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msup><mn>200</mn><mn>2</mn></msup><mo>=</mo><msup><mi>h</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><msup><mi>h</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>h</mi><mo>=</mo><mn>100</mn><mo>&#160;</mo><mi>m</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638cbc1938dbd664c5", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "97", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "At the foot of the mountain, the angle of elevation of its summit is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>45</mn><mi mathvariant=\"normal\">o</mi></msup><mo>,</mo></math> after ascending <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1000</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math> towards the mountain up a slope of <math><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> inclination, the angle of elevation is found to be <math><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math>. The height (in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>km</mi></math>) of the mountain is (take&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt><mo>=</mo><mn>1</mn><mo>.7</mo></math>)", "image": null}, "options": [], "correctValue": "1.35", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/7ce09c57-1cf6-4dd2-bb31-43c4f14b3918.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.54028in;height:1.65347in\" /></p><p>Let <math><mi>P</mi></math> be the summit of the mountain and <math><mi>Q</mi></math> be the foot.</p><p>Let <math><mi>A</mi></math> be the first position and <math><mi>B</mi></math> the second position of observation.</p><p><math><mi>B</mi><mi>N</mi></math> and <math><mi>B</mi><mi>M</mi></math> are <math><mo>&#8869;</mo></math>s from <math><mi>B</mi></math> to <math><mi>P</mi><mi>Q</mi></math> and <math><mi>A</mi><mi>Q</mi></math> respectively.<br />Then,&nbsp;<math><mi>A</mi><mi>B</mi><mo>=</mo><mn>1000</mn><mi></mi><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>1</mn><mi></mi><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">m</mi></math> ,<br /><math><mi mathvariant=\"normal\">&#8736;</mi><mi>M</mi><mi>A</mi><mi>B</mi><mo>=</mo><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>,</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#8736;</mi><mi>M</mi><mi>A</mi><mi>P</mi><mo>=</mo><msup><mn>45</mn><mi mathvariant=\"normal\">o</mi></msup><mo>,</mo></math></p><p><math><mi>&#8736;</mi><mi>N</mi><mi>B</mi><mi>P</mi><mo>=</mo><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math><br />Now, <math><mi>&#8736;</mi><mi>B</mi><mi>A</mi><mi>P</mi><mo>=</mo><mi>&#8736;</mi><mi>M</mi><mi>A</mi><mi>P</mi><mo>-</mo><mi>&#8736;</mi><mi>M</mi><mi>A</mi><mi>B</mi><mo>=</mo><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>-</mo><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>=</mo><msup><mrow><mn>15</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math><br /><math><mi>&#8736;</mi><mi>A</mi><mi>P</mi><mi>B</mi><mo>=</mo><mi>&#8736;</mi><mi>A</mi><mi>P</mi><mi>N</mi><mo>-</mo><mi>&#8736;</mi><mi>B</mi><mi>P</mi><mi>N</mi><mo>=</mo><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>-</mo><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>=</mo><msup><mrow><mn>15</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math><br /><math><mo>&#8756;</mo><mo>&#8710;</mo><mi>A</mi><mi>B</mi><mi>P</mi></math> is isosceles&nbsp;</p><p><math><mo>&#8756;</mo><mi>A</mi><mi>B</mi><mo>=</mo><mi>B</mi><mi>P</mi></math><br />But,&nbsp;<math><mi>A</mi><mi>B</mi><mo>=</mo><mn>1</mn></math> kilometre</p><p><math><mo>&#8756;</mo><mi>B</mi><mi>P</mi><mo>=</mo><mn>1</mn></math> kilometre.<br />Now, <math><mi>P</mi><mi>Q</mi><mo>=</mo><mi>P</mi><mi>N</mi><mo>+</mo><mi>N</mi><mi>Q</mi><mo>=</mo><mi>P</mi><mi>N</mi><mo>+</mo><mi>B</mi><mi>M</mi></math><br /><math><mo>=</mo><mi>B</mi><mi>P</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow><mo>+</mo><mi>A</mi><mi>B</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>&#8901;</mo><mfrac><msqrt><mn>3</mn></msqrt><mn>2</mn></mfrac><mo>+</mo><mn>1</mn><mo>&#8901;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mspace linebreak=\"newline\"/><mo>=</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mo>+</mo><mn>1</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mn>1</mn><mo>.</mo><mn>35</mn><mo>&#160;</mo><mi mathvariant=\"normal\">k</mi><mtext>m</mtext></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86384893ac5d944c853", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A flagstaff stands vertically on a pillar, the height of the flagstaff being double the height of the pillar. A man on the ground at a distance finds that both the pillar and the flagstaff subtend equal angles at his eyes. The ratio of the height of the pillar and the distance of the man from the pillar is", "image": null}, "options": [{"id": "SpDui", "text": "<math><mfrac><mrow><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>1</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "CK7Up", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "MpRra", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "00TfI", "text": "<math><mfrac><mrow><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/hlyyjxusqzxxbygdmukaffnwdeenigdharnhednccfhjabrsxw.png\" style=\"height: 195px; width: 250px;\" /><br /><br />Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>h</mi><mi>x</mi></mfrac><mo>=</mo><mi>a</mi></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mfrac><mi>h</mi><mi>x</mi></mfrac><mo>=</mo><mi>a</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mo>⁡</mo><mn>2</mn><mi>θ</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi>h</mi></mrow><mi>x</mi></mfrac><mo>=</mo><mn>3</mn><mi>a</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mi>a</mi><mo>=</mo><mi>tan</mi><mo>⁡</mo><mn>2</mn><mi>θ</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>tan</mi><mo>⁡</mo><mi>θ</mi></mrow><mrow><mn>1</mn><mo>-</mo><msup><mi>tan</mi><mn>2</mn></msup><mo>⁡</mo><mi>θ</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mrow><mn>1-</mn><msup><mi>a</mi><mn>2</mn></msup></mrow></mfrac><mo>⇒</mo><mi>a</mi><mo>=</mo><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637c6a6dfa9ef12ef7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "109", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A statue of height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#160;</mo><mtext>m</mtext></math> stands on a tower of height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#160;</mo><mtext>m</mtext><mo>.</mo></math>&nbsp;The angle subtended by the statue at the eyes of an observer of height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mtext>m</mtext><mo>,</mo></math> standing at a distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#160;</mo><mtext>m</mtext></math> from base of the tower is", "image": null}, "options": [{"id": "1Q4Ig", "text": "<math><msup><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</mn></mrow><mrow><mn>11</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "QbiA0", "text": "<math><msup><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "mbzBf", "text": "<math><msup><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "FT8rP", "text": "<math><msup><mrow><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>7</mn></mrow><mrow><mn>13</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>From the figure<br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/7121bbc6-feb3-4d01-935a-86fb5b0ee0f2.png\" style=\"max-width:100%; object-fit:contain\" style=\"width: 230px; height: 167px;\" /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mo>&#8289;</mo><mi>&#945;</mi><mo>=</mo><mn>2</mn><mo>,</mo><mo>&#160;</mo><mi>tan</mi><mo>&#8289;</mo><mi>&#946;</mi><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math><br /><math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mo>-</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mn>8</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfrac></mrow></mrow><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>11</mn></mrow></mfrac></math></p><p>Hence, angle subtended by the statue at the eyes of the observer is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#952;</mi><mo>=</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfrac><mn>2</mn><mn>11</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863740465a69059ab43", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the angles of elevation of the top of a tower from three collinear points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>,</mo><mo>&nbsp;</mo><mi>B</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>&nbsp;on a line leading to the foot of the tower are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>30</mn><mo>°</mo><mo>,</mo><mo>&nbsp;</mo><mn>45</mn><mo>°</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>60</mn><mo>°</mo></math>respectively, then the ratio <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>&nbsp;</mo><mo>:</mo><mo>&nbsp;</mo><mi>B</mi><mi>C</mi></math>, is", "image": null}, "options": [{"id": "Talc6", "text": "2 : 3", "image": null, "isCorrect": false}, {"id": "P4TtN", "text": "<math> <mrow> <msqrt> <mn>3</mn>&nbsp; </msqrt> <mo>:</mo> <mn>1</mn> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "pHh3U", "text": "<math> <mrow> <msqrt> <mn>3&nbsp;</mn> </msqrt> <mo>:</mo> <msqrt> <mn>2</mn> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "L7FQ8", "text": "<math> <mrow> <mn>1&nbsp;</mn> <mo>:</mo> <msqrt> <mn>3</mn> </msqrt> </mrow> </math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/100005_s.jpg\" style=\"width: 250px; height: 200px;\" /><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mo>&#8289;</mo><msup><mn>30</mn><mi>o</mi></msup><mo>=</mo><mi>&#160;</mi><mfrac><mi>h</mi><mrow><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mi>z</mi></mrow></mfrac><mo>,</mo><mo>&#160;</mo><mi>tan</mi><mo>&#8289;</mo><msup><mn>45</mn><mn>0</mn></msup><mo>=</mo><mfrac><mi>h</mi><mrow><mi>y</mi><mo>+</mo><mi>z</mi></mrow></mfrac><mo>,</mo><mo>&#160;</mo><mi>tan</mi><mo>&#8289;</mo><msup><mn>60</mn><mn>0</mn></msup><mo>=</mo><mfrac><mi>h</mi><mi>z</mi></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mi>z</mi><mo>=</mo><mi>&#160;</mi><msqrt><mn>3</mn></msqrt><mi>&#160;</mi><mi>h</mi><mo>&#160; ... (i)</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>+</mo><mi>z</mi><mo>=</mo><mi>h</mi><mo>&#160; &#160; &#160;... (ii)</mo></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>z</mi><mo>=</mo><mfrac><mi>h</mi><msqrt><mn>3</mn></msqrt></mfrac></math> ... (iii)<br /><br />from (ii) &amp; (iii)<br /><br /><math><mi>y</mi><mo>=</mo><mi>h</mi><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mi>&#160;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></mrow></mfenced></math> ... (iv)<br /><br />from (i) &amp; (ii)<br /><br /><math><mi>x</mi><mo>=</mo><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfenced><mi>h</mi></math> ... (v)<br /><br /><math><mfrac><mrow><mi>x</mi></mrow><mrow><mi>y</mi></mrow></mfrac><mo>=</mo><mi>&#160;</mi><mfrac><mrow><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfenced><mi>h</mi></mrow><mrow><mi>h</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow></mfrac></math><br /><br /><math><mo>=</mo><mi>&#160;</mi><mfrac><mrow><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>1</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863660117dcc311dd59", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "64", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The tops of two poles of heights&nbsp;<math><mn>40</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi></math> and <math><mn>25</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi></math> are connected by a wire. If the wire makes an angle <math><msup><mrow><mn>3</mn><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> with the horizontal, then the length of the wire is", "image": null}, "options": [{"id": "cRAY2", "text": "<math><mn>30</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "Ai5bV", "text": "<math><mn>20</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "ypq5C", "text": "<math><mn>15</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "Hj7cR", "text": "<math><mn>25</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let <math><mi>A</mi><mi>B</mi><mo>=</mo><mn>40</mn></math> and <math><mi>C</mi><mi>D</mi><mo>=</mo><mn>25</mn></math> be the two poles.<br /><math><mi>A</mi><mi>C</mi><mo>=</mo><mi>l</mi></math> is the length of the wire.<br /><math><mi>C</mi><mi>E</mi><mo>,</mo></math> the horizontal through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">&#8736;</mi><mi>A</mi><mi>C</mi><mi>E</mi><mo>=</mo><msup><mn>30</mn><mi mathvariant=\"normal\">o</mi></msup></math><br /><math><mfrac><mrow><mi>A</mi><mi>E</mi></mrow><mrow><mi>l</mi></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><math><mo>&#8756;</mo><mi>l</mi><mo>=</mo><mn>2</mn><mi>A</mi><mi>E</mi><mo>=</mo><mn>30</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">m</mi></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/184e6b0f-7a66-40b5-a25f-e01d95286c4d.png\" style=\"width:1.45347in;height:1.92014in\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863623382ffb2c3a82e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "89", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A ladder rests against a vertical wall at an angle <math><mi>α</mi></math> to the horizontal. If the foot is pulled away through a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math>,&nbsp;then it slides a distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> down the wall, finally making an angle <math><mi>β</mi></math> with the horizontal. The value of&nbsp;<math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>α</mi><mo>+</mo><mi>β</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math> is equal to", "image": null}, "options": [{"id": "G82ZN", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "akmhm", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "nOAqa", "text": "<math><mn>10</mn></math>", "image": null, "isCorrect": false}, {"id": "j6SbI", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let, the length of the ladder be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi></math> and <math><mi>A</mi><mi>B</mi></math> is the wall.<br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ddc9d6ef-3cab-4481-a9bf-7d78dc767ae7.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.47361in;height:1.48681in\" /><br /><math><mo>&#8756;</mo><mi>A</mi><mi>D</mi><mo>=</mo><mi>E</mi><mi>C</mi><mo>=</mo><mi>l</mi></math><br />Now, <math><mi>B</mi><mi>E</mi><mo>-</mo><mi>B</mi><mi>D</mi><mo>=</mo><mn>2</mn></math><br /><math><mo>&#8658;</mo><mi>l</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mi>&#946;</mi></mrow></mrow><mo>-</mo><mi>l</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mi>&#945;</mi></mrow></mrow><mo>=</mo><mn>2</mn></math><br /><math><mo>&#8658;</mo><mi>l</mi><mfenced separators=\"|\"><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mi>&#946;</mi></mrow></mrow><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mi>&#945;</mi></mrow></mrow></mrow></mfenced><mo>=</mo><mn>2</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mi>l</mi><mi>sin</mi><mo>&#8289;</mo><mfrac><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></mrow><mn>2</mn></mfrac><mi>sin</mi><mo>&#8289;</mo><mfrac><mrow><mi>&#945;</mi><mo>-</mo><mi>&#946;</mi></mrow><mn>2</mn></mfrac><mo>=</mo><mn>2</mn><mo>&#8230;</mo><mo>&#8230;</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">i</mi></mfenced></math><br />Also, <math><mi>B</mi><mi>A</mi><mo>-</mo><mi>B</mi><mi>C</mi><mo>=</mo><mn>5</mn></math><br /><math><mo>&#8658;</mo><mi>l</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mi>&#945;</mi></mrow></mrow><mo>-</mo><mi>l</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mi>&#946;</mi></mrow></mrow><mo>=</mo><mi>l</mi><mfenced separators=\"|\"><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mi>&#945;</mi></mrow></mrow><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mi>&#946;</mi></mrow></mrow></mrow></mfenced><mo>=</mo><mn>5</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mi>l</mi><mi>cos</mi><mo>&#8289;</mo><mfrac><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></mrow><mn>2</mn></mfrac><mi>sin</mi><mo>&#8289;</mo><mfrac><mrow><mi>&#945;</mi><mo>-</mo><mi>&#946;</mi></mrow><mn>2</mn></mfrac><mo>=</mo><mn>5</mn><mo>&#8230;</mo><mo>&#8230;</mo><mfenced separators=\"|\"><mi>ii</mi></mfenced></math><br />Dividing equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mi mathvariant=\"normal\">i</mi></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math>, we get,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>tan</mi><mo>&#8289;</mo><mfrac><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>5</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635d04f8fe9b2dc322", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "15", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The angle of elevation of an object on a hill is observed from a certain point in the horizontal plane through its base, to be <math><mn>30</mn><mo>&#176;</mo></math>. After walking <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn><mo>&#160;</mo><mi>m</mi></math> towards it on a level ground, the angle of elevation is found to be <math><mn>60</mn><mo>&#176;</mo></math>. Then the height of the object (in metres) is", "image": null}, "options": [{"id": "7E38t", "text": "<math> <mrow>  <mn>120</mn></mrow></math>", "image": null, "isCorrect": false}, {"id": "iKifz", "text": "<math><mn>60</mn><msqrt><mn>3</mn></msqrt></math>", "image": null, "isCorrect": true}, {"id": "PocFE", "text": "<math><mn>120</mn><msqrt><mn>3</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "3l8tT", "text": "<math > <mrow>  <mn>60</mn></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In &nbsp;<math><mo>∆</mo><mi>C</mi><mi>A</mi><mi>D</mi><mo>,</mo><mi>&nbsp;</mi></math> <math><mrow><mrow><mi mathvariant=\"normal\">tan&nbsp;</mi></mrow><mo>⁡</mo><mrow><mn>30</mn><mo>°</mo><mo>=</mo><mfrac><mrow><mi>C</mi><mi>D</mi></mrow><mrow><mi>A</mi><mi>C</mi></mrow></mfrac></mrow></mrow></math><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/31280_11.JPG\" style=\"width: 200px; height: 128px;\" /><br /><br /><math><mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mn>120</mn><mo>+</mo><mi>x</mi></mrow></mfrac></math><br /><br /><math><mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;</mo><msqrt><mn>3</mn></msqrt><mi>h</mi><mo>=</mo><mn>120</mn><mo>+</mo><mi>x</mi></math> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(i)<br /><br />and in<math><mi>&nbsp;&nbsp;</mi><mo>∆</mo><mi>C</mi><mi>B</mi><mi>D</mi></math>, <math><mrow><mrow><mi mathvariant=\"normal\">tan&nbsp;</mi></mrow><mo>⁡</mo><mrow><mn>60</mn><mo>°</mo></mrow></mrow><mo>=</mo><mfrac><mrow><mi>C</mi><mi>D</mi></mrow><mrow><mi>B</mi><mi>C</mi></mrow></mfrac></math><br /><br /><math><mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;</mo><msqrt><mn>3</mn></msqrt><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mi>x</mi></mrow></mfrac><mo>&nbsp;⇒&nbsp;</mo><mi>h</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mi>x</mi></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ...(ii)<br /><br />From Eqs. (i) and (ii), we get, <math><mi>x</mi><mo>=</mo><mn>60</mn><mi>&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math><br /><br />On putting <math><mi>x</mi><mo>=</mo><mn>60</mn></math> in Eq.(i), we get<br /><br /><math><mi>h</mi><mo>=</mo><mn>60</mn><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86356d5f545a26846d5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "86", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A flagstaff stands vertically on a pillar, the height of the flagstaff being triple the height of the pillar. A man on the ground at a distance finds that both the pillar and the flagstaff subtend equal angles at his eyes. The ratio of the height of the pillar and the distance of the man from the pillar is", "image": null}, "options": [{"id": "exQe9", "text": "<math><msqrt><mn>3</mn></msqrt><mi></mi><mo>:</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "DSprp", "text": "<math><mn>1</mn><mi></mi><mo>:</mo><msqrt><mn>3</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "WEIJe", "text": "<math><mn>2</mn><mi></mi><mo>:</mo><msqrt><mn>3</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "kH36A", "text": "<math><mn>1</mn><mi></mi><mo>:</mo><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/50e30e73-a1b0-4cc8-b249-754e9af246f0.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:2.00694in;height:1.73333in\" /></p><p>Let,&nbsp;<math><mi>A</mi><mi>B</mi></math> is a pillar and <math><mi>B</mi><mi>C</mi></math> is the flagstaff on it and man is standing at <math><mi mathvariant=\"normal\">D</mi></math><br />We have, <math><mfrac><mrow><mi>h</mi></mrow><mrow><mi>x</mi></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi>&#945;</mi></mrow></mrow><mo>=</mo><mi>a</mi></math> (say) (in <math><mo>&#8710;</mo><mi>A</mi><mi>B</mi><mi>D</mi></math> )<br /><math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mn>2</mn><mi>&#945;</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>4</mn><mi>h</mi></mrow><mrow><mi>x</mi></mrow></mfrac><mo>=</mo><mn>4</mn><mi>a</mi></math> (in <math><mo>&#8710;</mo><mi>A</mi><mi>C</mi><mi>D</mi></math> )<br /><math><mo>&#8658;</mo><mfrac><mrow><mn>2</mn><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi>&#945;</mi><mi></mi></mrow></mrow></mrow><mrow><mn>1</mn><mo>-</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>&#8289;</mo><mrow><mi>&#945;</mi></mrow></mrow></mrow></mfrac><mo>=</mo><mn>4</mn><mi>a</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mrow><mn>1</mn><mo>-</mo><msup><mi>a</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>4</mn><mi>a</mi><mo>&#8658;</mo><mn>2</mn><mo>=</mo><mn>4</mn><mo>-</mo><mn>4</mn><msup><mi>a</mi><mn>2</mn></msup><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mn>4</mn><msup><mi>a</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac></math><br /><math><mo>&#8756;</mo><mi>h</mi><mi></mi><mo>:</mo><mi>x</mi><mo>=</mo><mn>1</mn><mi></mi><mo>:</mo><msqrt><mn>2</mn></msqrt></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635087d482433ece24", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "61", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two ships are sailling in the sea on the two sides of a lighthouse. If the distance between the ships is <math><mn>10</mn><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfenced></math> meters and their angle of elevations of the top of the lighthouse are <math><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math>&nbsp;and&nbsp;<math><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math>, then the height of the lighthouse is (The two ships and the foot of lighthouse are in a straight line)", "image": null}, "options": [{"id": "ofEFt", "text": "<math><mn>20</mn></math> meters", "image": null, "isCorrect": false}, {"id": "jmbyt", "text": "<math><mn>20</mn><msqrt><mn>3</mn></msqrt></math> meters", "image": null, "isCorrect": false}, {"id": "m97AQ", "text": "<math><mn>10</mn><msqrt><mn>3</mn></msqrt></math> meters", "image": null, "isCorrect": true}, {"id": "H7u9t", "text": "<math><mn>5</mn><msqrt><mn>3</mn></msqrt></math> meters", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let,&nbsp;<math><mi>A</mi><mi>C</mi></math> is the lighthouse and the ships are at <math><mi>B</mi></math> and <math><mi>D</mi><mo>.</mo></math><br />In <math><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\"></mi><mi>A</mi><mi>B</mi><mi>C,</mi></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/395d46ac-1c2d-490c-b4dd-9c9b62103879.png\" style=\"width:2.33333in;height:1.42014in\" /><br /><math><mfrac><mrow><mi>A</mi><mi>C</mi></mrow><mrow><mi>B</mi><mi>C</mi></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow></math> {where,&nbsp;<math><mi>A</mi><mi>C</mi><mo>=</mo><mi>h</mi></math> meters <math><mo>=</mo></math> height of lighthouse}<br /><math><mfrac><mrow><mi>h</mi></mrow><mrow><mi>B</mi><mi>C</mi></mrow></mfrac><mo>=</mo><msqrt><mn>3</mn></msqrt><mo>⇒</mo><mi>B</mi><mi>C</mi><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math> meters<br />In <math><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\"></mi><mi>A</mi><mi>C</mi><mi>D,</mi></math><br /><math><mfrac><mrow><mi>A</mi><mi>C</mi></mrow><mrow><mi>C</mi><mi>D</mi></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow><mo>⇒</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mi>C</mi><mi>D</mi></mrow></mfrac><mo>=</mo><mn>1</mn><mo>⇒</mo><mi>C</mi><mi>D</mi><mo>=</mo><mi>h</mi></math><br /><math><mi>B</mi><mi>C</mi><mo>+</mo><mi>C</mi><mi>D</mi><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac><mo>+</mo><mi>h</mi><mo>=</mo><mn>10</mn><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfenced></math><br /><math><mo>⇒</mo><mi>h</mi><mo>=</mo><mn>10</mn><msqrt><mn>3</mn></msqrt></math> meters", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634546b38ad6debaee", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "83", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two vertical poles <math><mi>A</mi><mi>L</mi></math> and <math><mi>B</mi><mi>M</mi></math> of height <math><mn>4&nbsp;</mn><mi></mi><mi mathvariant=\"normal\">m</mi></math> and <math><mn>16&nbsp;</mn><mi></mi><mi mathvariant=\"normal\">m</mi></math> respectively stand apart on a horizontal plane. If <math><mi>A</mi><mo>,</mo><mi>B</mi></math> be the feet of the poles and <math><mi>A</mi><mi>M</mi></math> and <math><mi>B</mi><mi>L</mi></math> intersect at <math><mi>P</mi><mo>,</mo></math> then the height of <math><mi>P</mi></math> from the horizontal plane is equal 8736;</mi><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">O</mi><mo>=</mo><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math><br />Let,&nbsp;<math><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">C</mi><mo>=</mo><mi mathvariant=\"normal\">h</mi></math> meters<br />In <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">O</mi><mo>,</mo></math></p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>OA</mi><mi>OB</mi></mfrac><mo>=</mo><mi>tan</mi><mo>&#8289;</mo><msup><mn>45</mn><mi mathvariant=\"normal\">o</mi></msup><mo>&#8658;</mo><mi>OB</mi><mo>=</mo><mfrac><mn>80</mn><mrow><mi>tan</mi><mo>&#8289;</mo><msup><mn>45</mn><mi mathvariant=\"normal\">o</mi></msup></mrow></mfrac><mo>=</mo><mn>80</mn></math> meters<br />In <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#916;</mi><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">D</mi><mi mathvariant=\"normal\">C</mi><mo>,</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>AD</mi><mi>DC</mi></mfrac><mo>=</mo><mi>tan</mi><mo>&#8289;</mo><msup><mn>30</mn><mi mathvariant=\"normal\">o</mi></msup></math><br /><math><mfrac><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">A</mi><mo>-</mo><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">D</mi></mrow><mrow><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">B</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac><mfenced close=\"}\" open=\"{\" separators=\"|\"><mrow><mo>&#8757;</mo><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">B</mi><mo>=</mo><mi mathvariant=\"normal\">D</mi><mi mathvariant=\"normal\">C</mi></mrow></mfenced></math><br /><math><mfrac><mrow><mn>80</mn><mo>-</mo><mi mathvariant=\"normal\">h</mi></mrow><mrow><mn>80</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math><br /><math><mn>80</mn><msqrt><mn>3</mn></msqrt><mo>-</mo><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">h</mi><mo>=</mo><mn>80</mn><mo>&#8658;</mo><mi mathvariant=\"normal\">h</mi><mo>=</mo><mfrac><mrow><mn>80</mn><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math> meters</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863296ffb6b364c2552", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "104", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two poles of height <math><mi>a</mi></math>&nbsp;meters and <math><mi>b</mi></math> meters stand at the centres of two circular plots which touch each other externally at a point and the two poles subtend angles of <math> <mrow> <msup> <mrow> <mn>30</mn></mrow> <mtext>o</mtext> </msup> </mrow> </math> and <math> <mrow> <msup> <mrow> <mn>60</mn></mrow> <mtext>o</mtext> </msup> </mrow> </math> respectively at this point, then the distance (in meters) between the centres of these plots is", "image": null}, "options": [{"id": "N00be", "text": "<math><mi>a</mi><mo>+</mo><mi>b</mi></math>", "image": null, "isCorrect": false}, {"id": "iUjCz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mfenced separators=\"|\"><mrow><mn>3</mn><mi>a</mi><mo>+</mo><mi>b</mi></mrow></mfenced><msqrt><mn>3</mn></msqrt></mfrac></math>", "image": null, "isCorrect": true}, {"id": "Wp9W1", "text": "<ma  "value": "96", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A vertical tower subtends an angle of <math> <mrow> <msup> <mrow> <mn>60</mn></mrow> <mtext>o</mtext> </msup> </mrow> </math> at a point on the same level as the foot of the tower. On moving <math><mn>100&nbsp;</mn><mi></mi><mi mathvariant=\"normal\">m</mi></math> further in line with the tower, it subtends an angle of <math> <mrow> <msup> <mrow> <mn>30</mn></mrow> <mtext>o</mtext> </msup> </mrow> </math> at the point. Then, the height of the tower is", "image": null}, "options": [{"id": "Pxxrs", "text": "<math><mn>20</mn><msqrt><mn>3&nbsp;</mn></msqrt><mi></mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "8UGgl", "text": "<math><mn>30</mn><msqrt><mn>3&nbsp;</mn></msqrt><mi></mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}, {"id": "5LHcK", "text": "<math><mn>50</mn><msqrt><mn>3&nbsp;</mn></msqrt><mi></mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": true}, {"id": "0r3FC", "text": "<math><mn>10</mn><msqrt><mn>3&nbsp;</mn></msqrt><mi></mi><mi mathvariant=\"normal\">m</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/573c5e35-551c-4ef1-9106-45ca2a47022a.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:2.58681in;height:1.27361in\" /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"/>From <math><mo>&#8710;</mo><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">D</mi></math> and <math><mo>&#8710;</mo><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">C</mi><mi mathvariant=\"normal\">D</mi></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><msup><mn>60</mn><mtext>o</mtext></msup><mo>=</mo><mfrac><mtext>H</mtext><mi>x</mi></mfrac><mo>,</mo><mo>&#160;</mo><mi>tan</mi><msup><mn>30</mn><mtext>o</mtext></msup><mo>=</mo><mfrac><mtext>H</mtext><mrow><mi>x</mi><mo>+</mo><mn>100</mn></mrow></mfrac></math><br /><math><mo>&#8658;</mo><mfrac><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mn>60</mn><mo>&#176;</mo></mrow></mrow></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mn>30</mn><mo>&#176;</mo></mrow></mrow></mrow></mfrac><mo>-</mo><mn>100</mn></math><br /><math><mo>&#8658;</mo><mfrac><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></mrow></mfrac><mo>-</mo><mn>100</mn></math><br /><math><mo>&#8658;</mo><msqrt><mn>3</mn></msqrt><mi mathvariant=\"normal\">H</mi><mo>-</mo><mfrac><mrow><mi mathvariant=\"normal\">H</mi></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac><mo>=</mo><mn>100</mn></math><br /><math><mo>&#8658;</mo><mn>3</mn><mi mathvariant=\"normal\">H</mi><mo>-</mo><mi mathvariant=\"normal\">H</mi><mo>=</mo><mn>100</mn><msqrt><mn>3</mn></msqrt></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi mathvariant=\"normal\">H</mi><mo>=</mo><mn>50</mn><msqrt><mn>3</mn></msqrt><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632723754ec05d0a87", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "85", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The tops of two poles of height <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>40</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>25</mn><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math> are connected by a wire of length <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>30</mn><msqrt><mn>2</mn></msqrt></mrow><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfenced></mfrac><mo>&nbsp;</mo><mi mathvariant=\"normal\">m</mi></math><em>.</em> If the wire makes an angle <math><mi>α</mi></math>&nbsp;with the horizontal, then the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt><mi>sin</mi><mi>α</mi></math> is equal to (take,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt><mo>=</mo><mn>1</mn><mo>.</mo><mn>7</mn></math>)", "image": null}, "options": [], "correctValue": "0.35", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/3a65a34c-810c-493f-9943-80a5cb61ac26.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.2in;height:1.68681in\" /></p><p>Let,&nbsp;<math><mi>A</mi><mi>B</mi><mo>=</mo><mn>40</mn></math> and <math><mi>C</mi><mi>D</mi><mo>=</mo><mn>25</mn></math> be the two poles.<br /><math><mi>A</mi><mi>C</mi><mo>=</mo><mi>l</mi></math> is the length of the wire.<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mi>E</mi></math>&nbsp;is the horizontal through <math><mi>C</mi></math>&nbsp;and&nbsp;<math><mi>&#8736;</mi><mi>A</mi><mi>C</mi><mi>E</mi><mo>=</mo><mi>&#945;</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>A</mi><mi>E</mi></mrow><mi>l</mi></mfrac><mo>=</mo><mi>sin</mi><mo>&#8289;</mo><mi>&#945;</mi><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>l</mi><mo>=</mo><mfrac><mn>15</mn><mrow><mi>sin</mi><mo>&#8289;</mo><mi>&#945;</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>30</mn><msqrt><mn>2</mn></msqrt></mrow><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfenced></mfrac><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mi>sin</mi><mo>&#8289;</mo><mi>&#945;</mi><mo>=</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></mrow><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt><mi>sin</mi><mi>&#945;</mi><mo>=</mo><mn>0</mn><mo>.</mo><mn>35</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86326506fc1ee7b8b4f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "93", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider a cubical hall <math><mi>A</mi><mi>B</mi><mi>C</mi><mi>D</mi><mi>P</mi><mi>Q</mi><mi>R</mi><mi>S</mi></math> with each side <math><mn>20&nbsp;</mn><mi></mi><mi mathvariant=\"normal\">m</mi></math> and base as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mi>C</mi><mi>D</mi><mo>.</mo></math>&nbsp;If&nbsp;<math><mi>G</mi></math> is the center of the wall <math><mi>B</mi><mi>C</mi><mi>R</mi><mi>Q</mi></math> and <math><mi>T</mi></math> is the midpoint of the side <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>,</mo></math>&nbsp;then the angle of elevation of <math><mi>G</mi></math> at the point <math><mi>T</mi></math> is", "image": null}, "options": [{"id": "2NIGP", "text": "<math><msup><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>⁡</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "v3yYl", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "mXpDd", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "v5PJN", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/23456789dfghjk456789dfghjk_.JPG\" style=\"max-width:100%; object-fit:contain\" style=\"width: 214px; height: 188px;\" /></p><p>Let <math><mi>H</mi></math> be the midpoint of <math><mi>B</mi><mi>C</mi></math></p><p>Since&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>∠</mi><mi>T</mi><mi>B</mi><mi>H</mi><mo>=</mo><msup><mn>90</mn><mi mathvariant=\"normal\">o</mi></msup><mo>,</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>T</mi><msup><mi>H</mi><mn>2</mn></msup><mo>=</mo><mi>B</mi><msup><mi>T</mi><mn>2</mn></msup><mo>+</mo><mi>B</mi><msup><mi>H</mi><mn>2</mn></msup><mo>=</mo><msup><mn>10</mn><mn>2</mn></msup><mo>+</mo><msup><mn>10</mn><mn>2</mn></msup><mo>=</mo><mn>200</mn></math><br />Also, since <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>∠</mi><mi>T</mi><mi>H</mi><mi>G</mi><mo>=</mo><msup><mn>90</mn><mi mathvariant=\"normal\">o</mi></msup><mo>,</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>T</mi><msup><mi>G</mi><mn>2</mn></msup><mo>=</mo><mi>T</mi><msup><mi>H</mi><mn>2</mn></msup><mo>+</mo><mi>G</mi><msup><mi>H</mi><mn>2</mn></msup><mo>=</mo><mn>200</mn><mo>+</mo><mn>100</mn><mo>=</mo><mn>300</mn></math><br />Let <math><mi>θ</mi></math> be the required angle of elevation of <math><mi>G</mi></math> at <math><mi>T</mi></math>.<br />Then, <math><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mi>G</mi><mi>H</mi></mrow><mrow><mi>T</mi><mi>G</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mn>10</mn><msqrt><mn>3</mn></msqrt></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>θ</mi><mo>=</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>⁡</mo><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631314a373be90fd14", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "55", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A stationary balloon is observed from three points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>,</mo><mo>&#160;</mo><mi>B</mi></math> and <math><mi>C</mi></math> on the plane ground and is found that its angle of elevation from each point is <math><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>.</mo></math> If <math><mi mathvariant=\"normal\">&#8736;</mi><mi>A</mi><mi>B</mi><mi>C</mi><mo>=</mo><msup><mrow><mn>3</mn><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> and <math><mi>A</mi><mi>C</mi><mo>=</mo><mn>5</mn></math> meters, then the height of the balloon from the ground is", "image": null}, "options": [{"id": "TVwLb", "text": "<math><mn>5</mn><msqrt><mn>3</mn></msqrt></math> meters", "image": null, "isCorrect": true}, {"id": "X41r5", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>4</mn></mrow></mfrac><msqrt><mn>3</mn></msqrt></math> meters", "image": null, "isCorrect": false}, {"id": "oJOo4", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math> meters", "image": null, "isCorrect": false}, {"id": "8hOHu", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>4</mn><msqrt><mn>3</mn></msqrt></mrow></mfrac></math> meters", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let,&nbsp;<math><mi>P</mi><mi>Q</mi></math> be vertical with height&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;meters&nbsp;and at its end <math><mi>Q</mi></math> there is a balloon and <math><mi>P</mi></math> is on the ground<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mi>A</mi><mo>=</mo><mi>P</mi><mi>B</mi><mo>=</mo><mi>P</mi><mi>C</mi><mo>=</mo><mi>h</mi><mi>cot</mi><mo>&#8289;</mo><msup><mn>60</mn><mi mathvariant=\"normal\">o</mi></msup><mo>=</mo><mfrac><mi>h</mi><msqrt><mn>3</mn></msqrt></mfrac></math><br /><math><mo>&#8756;</mo></math> <math><mi>P</mi></math> is the circumcentre of <math><mi mathvariant=\"normal\">&#916;</mi><mi>A</mi><mi>B</mi><mi>C</mi></math> and its circumradius <math><mfenced separators=\"|\"><mrow><mi>R</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/5e6537b4-383f-4163-965e-e1096c2cd33a.png\" style=\"width:1.96667in;height:1.71319in\" /><br />In <math><mi mathvariant=\"normal\">&#916;</mi><mi mathvariant=\"normal\"></mi><mi>A</mi><mi>B</mi><mi>C</mi></math>,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>R</mi><mo>=</mo><mfrac><mn>5</mn><mrow><mi>sin</mi><mo>&#8289;</mo><msup><mn>30</mn><mi mathvariant=\"normal\">o</mi></msup></mrow></mfrac><mo>&#8658;</mo><mn>2</mn><mfrac><mi>h</mi><msqrt><mn>3</mn></msqrt></mfrac><mo>=</mo><mfrac><mn>5</mn><mrow><mi>sin</mi><mo>&#8289;</mo><mn>3</mn><msup><mn>0</mn><mi mathvariant=\"normal\">o</mi></msup></mrow></mfrac></math><br /><math><mo>&#8756;</mo><mi>h</mi><mo>=</mo><mn>5</mn><msqrt><mn>3</mn></msqrt></math> meters.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86312fa437ac1569568", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "04", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A ladder <math> <mn>5&nbsp;</mn><mtext>m</mtext> </math> long leans against a vertical wall. The bottom of the ladder is <math> <mn>3&nbsp;</mn><mtext>m</mtext> </math> from the wall. If the bottom of the ladder is pulled <math> <mn>1&nbsp;</mn><mtext>m</mtext> </math> farther from the wall, how much does the top of the ladder slide down the wall", "image": null}, "options": [{"id": "cDH1Y", "text": "<math> <mrow> <mn>1</mn><mtext> </mtext><mtext>m</mtext> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "cdr7s", "text": "<math><mrow><mtext>4 </mtext><mtext>m</mtext> </mrow> </math>", "image": null, "isCorrect": false}, {"id": "YDF14", "text": "<math> <mrow>  <mn>2</mn><mtext>&#x2009;</mtext><mtext>m</mtext> </mrow></math>", "image": null, "isCorrect": false}, {"id": "6E41G", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>3 </mtext><mtext>m</mtext></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From first case<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/RAKESH03.PNG\" style=\"width: 230px; height: 203px;\" /><br /><br />&nbsp;From second case,<br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/RAKESH04.PNG\" style=\"width: 230px; height: 205px;\" /><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>A</mi><mi>B</mi><mo>=</mo><mn>4&nbsp;</mn><mtext>m</mtext></math> <math><mo>and</mo><mi>B</mi><mi>D</mi><mo>=</mo><mn>3&nbsp;</mn><mtext>m</mtext></math><br /><br /><math><mo>∴</mo></math> <math><mi>A</mi><mi>D</mi><mo>=</mo><mn>4</mn><mo>-</mo><mn>3</mn><mo>=</mo><mn>1&nbsp;</mn><mtext>m</mtext></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630d95480a80cedab3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Each side of a square subtends an angle of <math><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> at the top of a tower <math><mn>5</mn></math> meters high standing in the center of the square. If <math><mi>a</mi></math>&nbsp;meters is the length of each side of the square, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> is equal to", "image": null}, "options": [{"id": "phPKi", "text": "<math><mn>3</mn><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "crJDs", "text": "<math><mn>4</mn><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "maP9u", "text": "<math><mn>5</mn><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": true}, {"id": "GIo0Q", "text": "<math><mn>6</mn><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/4e0e46c6-0764-4a21-9084-71a8aeec2da9.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.62708in;height:2.06042in\" /><br />Let <math><mi>A</mi><mi>B</mi><mi>C</mi><mi>D</mi></math> be a square of each side of length <math><mi>a</mi></math>&nbsp;meters.</p><p>It is given that <math><mi>&#8736;</mi><mi>B</mi><mi>P</mi><mi>C</mi><mo>=</mo><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup><mo>.</mo></math><br />Let <math><mi>M</mi></math> be the midpoint of <math><mi>B</mi><mi>C</mi><mo>.</mo></math><br />Then,&nbsp;<math><mi>&#8736;</mi><mi>B</mi><mi>P</mi><mi>M</mi><mo>=</mo><mi>&#8736;</mi><mi>C</mi><mi>P</mi><mi>M</mi><mo>=</mo><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math><br />In <math><mo>&#8710;</mo><mi>B</mi><mi>M</mi><mi>P</mi><mo>,</mo></math> right angled at <math><mi>M</mi><mo>,</mo></math><br />We have<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mo>&#8289;</mo><mfenced separators=\"|\"><mrow><mi>&#8736;</mi><mi>B</mi><mi>P</mi><mi>M</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mi>B</mi><mi>M</mi></mrow><mrow><mi>P</mi><mi>M</mi></mrow></mfrac><mo>&#8658;</mo><mi>tan</mi><mo>&#8289;</mo><mfenced separators=\"|\"><mrow><mn>30</mn><mo>&#176;</mo></mrow></mfenced><mo>=</mo><mfrac><mrow><mi>a</mi><mo>/</mo><mn>2</mn></mrow><mrow><mi>P</mi><mi>M</mi></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mi>M</mi><mo>=</mo><mfrac><mrow><msqrt><mn>3</mn></msqrt><mi>a</mi></mrow><mn>2</mn></mfrac></math><br />In <math><mo>&#8710;</mo><mi>O</mi><mi>P</mi><mi>M</mi></math>,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><msup><mi>M</mi><mn>2</mn></msup><mo>=</mo><mi>O</mi><msup><mi>M</mi><mn>2</mn></msup><mo>+</mo><mi>O</mi><msup><mi>P</mi><mn>2</mn></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><msup><mi>a</mi><mn>2</mn></msup></mrow><mn>4</mn></mfrac><mo>=</mo><mfrac><msup><mi>a</mi><mn>2</mn></msup><mn>4</mn></mfrac><mo>+</mo><msup><mn>5</mn><mn>2</mn></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msup><mi>a</mi><mn>2</mn></msup><mo>=</mo><mn>50</mn><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mn>5</mn><msqrt><mn>2</mn></msqrt><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86307d935340fabb992", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "02", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math><mi>A</mi><mi>B</mi></math> is a vertical tower. The point <math><mi>A</mi></math> is on the ground and <math><mi>C</mi></math> is the middle point of <math><mi>A</mi><mi>B</m
