><mi>P</mi></mrow></mfrac></math><br /><br /><br /><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/27433__CA_soludddd.png\" style=\"width: 230px; height: 170px;\" /><br /><br /><br />In &nbsp;<math><mo>∆</mo><mi>P</mi><mi>A</mi><mi>C</mi><mo>,</mo><mrow><mrow><mi mathvariant=\"normal\">tan&nbsp;</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mi>A</mi><mi>C</mi></mrow><mrow><mi>A</mi><mi>P</mi></mrow></mfrac></math><br /><br /><math><mo>∴&nbsp;&nbsp;&nbsp;&nbsp;</mo><mrow><mrow><mi mathvariant=\"normal\">tan&nbsp;</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">α</mi></mrow></mrow><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">β</mi><mo>-</mo><mi mathvariant=\"normal\">θ</mi></mrow></mfenced></mrow></mrow></math><br /><br /><math><mo>=</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">tan&nbsp;</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">β</mi></mrow></mrow><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">tan&nbsp;</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow><mrow><mn>1</mn><mo>+</mo><mrow><mrow><mi mathvariant=\"normal\">tan&nbsp;</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">β</mi></mrow></mrow><mrow><mrow><mi mathvariant=\"normal\">&nbsp;tan&nbsp;</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow></mfrac></math><br /><br /><math><mo>=</mo><mi>&nbsp;</mi><mfrac><mrow><mfrac><mrow><mi>A</mi><mi>B</mi></mrow><mrow><mi>A</mi><mi>P</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>A</mi><mi>C</mi></mrow><mrow><mi>A</mi><mi>P</mi></mrow></mfrac></mrow><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mi>A</mi><mi>B</mi></mrow><mrow><mi>A</mi><mi>P</mi></mrow></mfrac><mo>⋅</mo><mfrac><mrow><mi>A</mi><mi>C</mi></mrow><mrow><mi>A</mi><mi>P</mi></mrow></mfrac></mrow></mfrac><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi></math>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;...(i)<br /><br /><math><mo>∵&nbsp;&nbsp;&nbsp;&nbsp;</mo><mi>A</mi><mi>P</mi><mo>=</mo><mi>n</mi><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><mi>A</mi><mi>B</mi></mrow></mfenced><mo>=</mo><mi>n</mi><mfenced separators=\"|\"><mrow><mn>2</mn><mi>A</mi><mi>C</mi></mrow></mfenced></math> (<math><mo>∵</mo><mi>C</mi></math> is the mid point of <math><mi>B</mi><mi>A</mi></math>)<br /><br />From Eq. (i), we get<br /><br /><math><mrow><mrow><mi mathvariant=\"normal\">tan&nbsp;</mi></mrow><mo>⁡</mo><mrow><mi>α</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>n</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>n</mi></mrow></mfrac></mrow><mrow><mn>1</mn><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>n</mi></mrow><mrow><mn>2</mn><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>1</mn></mrow></mfrac></math><br /><br /><math><mo>⇒&nbsp;&nbsp;&nbsp;&nbsp;</mo><mi>n</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><msup><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>1</mn></mrow></mfenced><mrow><mrow><mi mathvariant=\"normal\">tan&nbsp;</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">α</mi></mrow></mrow></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86303bcf3ffc7f90385", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "53", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two straight roads <math><mi>O</mi><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>B</mi></math>&nbsp;intersect at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi></math>. A tower is situated within the angle formed by them and subtends angles of <math><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> and <math><msup><mrow><mn>30</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> at the points <math><mi>A</mi></math> and <math><mi>B</mi></math> where the roads are nearest to it. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>A</mi><mo>=</mo><mn>400</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">s</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>B</mi><mo>=</mo><mn>300</mn><mo>&#160;</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">e</mi><mi mathvariant=\"normal\">r</mi><mi mathvariant=\"normal\">s</mi></math>, then the height of the tower is", "image": null}, "options": [{"id": "5nbWM", "text": "<math><mn>250</mn><msqrt><mn>2</mn></msqrt></math> meters", "image": null, "isCorrect": false}, {"id": "LPNb6", "text": "<math><mn>500</mn></math> meters", "image": null, "isCorrect": false}, {"id": "6BX6A", "text": "<math><mn>50</mn><msqrt><mn>14</mn></msqrt></math> meters", "image": null, "isCorrect": true}, {"id": "u9qm5", "text": "<math><mn>100</mn><msqrt><mn>7</mn></msqrt></math> meters", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/423b3ac0-fb54-4de3-b83a-4e1278b10c2d.png\" style=\"width: 200px; height: 156px;\" /><br />Let,&nbsp;< mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math><mo>&#8658;</mo><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>400</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>3</mn><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>300</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>&#8658;</mo><mn>2</mn><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>400</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>300</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math><mo>&#8658;</mo><mi>h</mi><mo>=</mo><msqrt><mfrac><mrow><msup><mrow><mn>4</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>50</mn><msqrt><mn>14</mn></msqrt></math> meters</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86303b6ecac8b9f4267", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "98", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A balloon moving in a straight line passes vertically above two points <math><mi>A</mi></math> and <math><mi>B</mi></math> on a horizontal plane <math><mn>10</mn><mi></mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">t</mi></math> apart. When above <math><mi>A</mi></math>&nbsp;the balloon has an angle of elevation of <math><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> as seen from <math><mi>B</mi></math>. When above <math><mi>B</mi></math> it has an angle of elevation of <math><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> as seen from <math><mi>A</mi><mo>.</mo></math> The distance of <math><mi>B</mi></math> from the point <math><mi>C</mi></math> where it will touch the plane is", "image": null}, "options": [{"id": "WzSIE", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfenced><mo>&#160;</mo><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">t</mi></math>", "image": null, "isCorrect": true}, {"id": "9I5fv", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn><mo>&#160;</mo><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">t</mi></math>", "image": null, "isCorrect": false}, {"id": "rHTjP", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mfenced separators=\"|\"><mrow><mn>3</mn><mo>+</mo><msqrt><mn>3</mn></msqrt></mrow></mfenced><mo>&#160;</mo><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">t</mi></math>", "image": null, "isCorrect": false}, {"id": "6YKo4", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/6e4884e8-a68e-4c00-85a3-6ea2d04fc6fa.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:2.47361in;height:1.57361in\" /></p><p>In <math><mo>&#8710;</mo><mi>A</mi><mi>B</mi><mi>E</mi></math>,<br /><math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><msup><mrow><mn>45</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mn>10</mn></mrow></mfrac><mo>&#8658;</mo><mi>h</mi><mo>=</mo><mn>10</mn><mi></mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">t</mi><mo>&#8230;</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>.</mo><mo>.</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math><br />And in <math><mo>&#8710;</mo><mi>A</mi><mi>B</mi><mi>D</mi><mo>,</mo></math><br /><math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mrow><mo>=</mo><mfrac><mrow><mi>H</mi></mrow><mrow><mn>10</mn></mrow></mfrac><mo>&#8658;</mo><mi>H</mi><mo>=</mo><mn>10</mn><msqrt><mn>3</mn></msqrt><mi></mi><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\"></mi><mo>&#8230;</mo><mo>&#8230;</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math><br />Also, <math><mfrac><mrow><mi>H</mi></mrow><mrow><mn>10</mn><mo>+</mo><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mi>B</mi><mi>C</mi></mrow></mfrac></math> (Similar triangle property)<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"/>Using equation <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math>, we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>10</mn><msqrt><mn>3</mn></msqrt></mrow><mrow><mn>10</mn><mo>+</mo><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mn>10</mn><mi>x</mi></mfrac></math><br /><math><mo>&#8658;</mo><msqrt><mn>3</mn></msqrt><mi>x</mi><mo>=</mo><mn>10</mn><mo>+</mo><mi>x</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mfrac><mn>10</mn><mrow><msqrt><mn>3</mn></msqrt><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mn>5</mn><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfenced><mo>&#160;</mo><mi mathvariant=\"normal\">f</mi><mi mathvariant=\"normal\">t</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
