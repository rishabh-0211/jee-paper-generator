><mrow><mn>3</mn><mi>a</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>3</mn><msqrt><mn>2</mn></msqrt><mo>⇒</mo><mi>a</mi><mo>=</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></math><br />Distance between the focus and centre <math><mo>=</mo><mi>a</mi><mi>e</mi><mo>=</mo><msqrt><mn>2</mn></msqrt></math><br />The slope of the axis of the ellipse is <math><mn>1</mn><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></math><br /><math><mo>⇒</mo><mfenced separators=\"|\"><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi><mo>,</mo></mrow></mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow></mfenced></math> or <math><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac><mo>,</mo><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow></mfenced></math><br />The points on the axis of the ellipse at a distance <math><msqrt><mn>2</mn></msqrt></math> units from <math><mfenced separators=\"|\"><mrow><mn>3,4</mn></mrow></mfenced></math> are <math><mfenced separators=\"|\"><mrow><mn>3</mn><mo>±</mo><msqrt><mn>2</mn></msqrt><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow></mfenced><mo>,</mo><mn>4</mn><mo>±</mo><msqrt><mn>2</mn></msqrt><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow></mfenced></math><br /><math><mo>⇒</mo></math> Points are <math><mfenced separators=\"|\"><mrow><mn>2,3</mn></mrow></mfenced></math> or <math><mfenced separators=\"|\"><mrow><mn>4,5</mn></mrow></mfenced></math> , but the centre is <math><mfenced separators=\"|\"><mrow><mn>4,5</mn></mrow></mfenced></math> because it is far from the directrix as compared to <math><mfenced separators=\"|\"><mrow><mn>2,3</mn></mrow></mfenced></math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634b2eb1cec9da23c6", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "39", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let the line <math><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi></math> and the ellipse <math><mn>2</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>1</mn></math> intersect at a point <math><mi>P</mi></math> in the first quadrant. If the normal to this ellipse at <math><mi>P</mi></math> meets the co-ordinate axes at <math><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi></mi><mi>β</mi></mrow></mfenced><mo>,</mo></math> then <math><mi>β</mi></math> is equal to", "image": null}, "options": [{"id": "VMCoU", "text": "<math><mfrac><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Bzgzr", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "vpQaa", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "OiVtM", "text": "<math><mfrac><mrow><msqrt><mn>2</mn></msqrt></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> be <math><mfenced separators=\"|\"><mrow><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo><msub><mrow><mi>y</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math><br />Equation of normal at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> is <math><mfrac><mrow><mi>x</mi></mrow><mrow><mn>2</mn><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>y</mi></mrow><mrow><msub><mrow><mi>y</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br />It passes through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mn>1</mn><mrow><mn>3</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac><mo>,</mo><mo>&#8201;</mo><mn>0</mn></mrow></mfenced><mo>&#8658;</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mrow><mn>6</mn><msqrt><mn>2</mn></msqrt><msub><mi>x</mi><mn>1</mn></msub></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#8658;</mo><msub><mi>x</mi><mn>1</mn></msub><mo>=</mo><mfrac><mn>1</mn><mrow><mn>3</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac></math><br />So,&nbsp;<math><msub><mrow><mi>y</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow><mrow><mn>3</mn></mrow></mfrac></math> (as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> lies in Ist quadrant)<br />So, <math><mi>&#946;</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi>y</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><msqrt><mn>2</mn></msqrt></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86344436c971772a44a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "73", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The ellipse <math><msub><mrow><mi>E</mi></mrow><mrow><mn>1</mn></mrow></msub><mi mathvariant=\"normal\"></mi><mo>:</mo><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>9</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math> is inscribed in a rectangle <math><mi>R</mi></math> whose sides are parallel to the coordinate axes. Another ellipse <math><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn></mrow></msub></math> passing through the point <math><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>4</mn></mrow></mfenced></math> circumscribes the rectangle <math><mi>R</mi></math>. The length (in units) of the major axis of ellipse <math><msub><mrow><mi>E</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "Let the ellipse be <math><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>1</mn></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/09f6e4 enced></math> is also a normal to the circle <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>8</mn><mi>x</mi><mo>+</mo><mn>4</mn><mi>y</mi><mo>,</mo></math> then the sum of all possible values of <math><mi mathvariant=\"normal\">θ</mi></math> is equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>∀</mo><mi>θ</mi><mo>∈</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mn>2</mn><mi>π</mi></mrow></mfenced></mrow></mfenced></math>", "image": null}, "options": [{"id": "fW6UN", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "AjafA", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Uu4sq", "text": "<math><mfrac><mrow><mn>5</mn><mi>π</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "zdvuf", "text": "<math><mfrac><mrow><mn>7</mn><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Tangent to the ellipse is <math><mi>x</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>+</mo><mn>2</mn><mi>y</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>=</mo><mn>4</mn></math> which is a normal to the given circle<br /><math><mo>⇒</mo></math> it satisfies&nbsp;<math><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>2</mn></mrow></mfenced></math><br /><math><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>+</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi ><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "ni7pf", "text": "<math><mn>9</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "O4R1l", "text": "<math><mn>24</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}, {"id": "RAoMm", "text": "<math><mn>16</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Any point on the ellipse <math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>3</mn><msqrt><mn>2</mn></msqrt></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>4</mn><msqrt><mn>2</mn></msqrt></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>1</mn></math> can be taken as <math><mfenced separators=\"|\"><mrow><mn>3</mn><msqrt><mn>2</mn></msqrt><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>4</mn><msqrt><mn>2</mn></msqrt><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow></mfenced></math> and the slope of the tangent as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>&nbsp;</mi><mfrac><mrow><msup><mi mathvariant=\"normal\">b</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi></mrow><mrow><msup><mi mathvariant=\"normal\">a</mi><mn>2</mn></msup><mi mathvariant=\"normal\">y</mi></mrow></mfrac></math><br /><br />Hence, slope<math><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>32</mn><mfenced separators=\"|\"><mrow><mn>3</mn><msqrt><mn>2</mn></msqrt><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow></mfenced></mrow><mrow><mn>18</mn><mi mathvariant=\"normal\">&nbsp;</mi><mfenced separators=\"|\"><mrow><mn>4</mn><msqrt><mn>2</mn></msqrt><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow></mfenced></mrow></mfrac><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>…</mo><mo>.</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math><br /><br />Given, the slope of the tangent&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>…</mo><mo>.</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfenced separators=\"|\"><mn>2</mn></mfenced></math><br /><br />From equations (1) and (2), we get,&nbsp;<br /><br /><math><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>=</mo><mn>1</mn><mo>⇒</mo><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br />Hence, the equation of the tangent is <math><mfrac><mrow><mi mathvariant=\"normal\">x</mi><mo>.</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow><mrow><mn>3</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mi mathvariant=\"normal\">y</mi><mo>.</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow><mrow><mn>4</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac><mo>=</mo><mn>1</mn></math><br /><br />(i.e.) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">x</mi><mn>6</mn></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mi mathvariant=\"normal\">y</mi><mn>8</mn></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;<br /><br />Hence,&nbsp;<math><mi mathvariant=\"normal\">A</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>6</mn><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>0</mn></mrow></mfenced><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">B</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>8</mn></mrow></mfenced></math><br /><br />Area of <math><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>×</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mo>×</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>8</mn><mo>=</mo><mn>24</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863334b1fd1ef3c1ff7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "72", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The tangents at the extremities of the latus rectum of the ellipse <math><mn>3</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>12</mn></math> form a rhombus <math><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">Q</mi><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi></math>. Area (in sq. units) of the rhombus <math><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">Q</mi><mi mathvariant=\"normal\">R</mi><mi mathvariant=\"normal\">S</mi></math> outside the ellipse is equal to", "image": null}, "options": [{"id": "TmGYj", "text": "<math><mn>8</mn><mo>-</mo><mn>2</mn><msqrt><mn>3</mn></msqrt><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "lrLb5", "text": "<math><mn>12</mn><mo>-</mo><mn>2</mn><msqrt><mn>3</mn></msqrt><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "mNfBA", "text": "<math><mn>14</mn><mo>-</mo><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "L3eq1", "text": "<math><mn>16</mn><mo>-</mo><mn>2</mn><msqrt><mn>3</mn></msqrt><mi>π</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/0d329269-7dd0-4252-90be-61da36aa19df.png\" style=\"width:2.14028in;height:1.32708in\" /><br />One of the end of latus rectum is <math><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math><br />Tangent at <math><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math> is&nbsp;<math><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>4</mn></math><br />Area of rhombus <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4</mn><mfenced><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#8901;</mo><mn>4</mn><mo>&#8901;</mo><mn>2</mn></mrow></mfenced><mo>=</mo><mn>16</mn></math></p><p>Hence, the required area <math><mo>=</mo><mn>16</mn><mo>-</mo><mn>2</mn><msqrt><mn>3</mn></msqrt><mi>&#960;</mi></math>&nbsp;sq. units</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633287d530abc2699a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "107", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A normal is drawn to the ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>9</mn></mfrac><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>1</mn></math> at the point <math><mfenced separators=\"|\"><mrow><mn>3</mn><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow><mo>,</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow></mrow></mfenced></math> where <math><mn>0</mn><mo>&#60;</mo><mi>&#952;</mi><mo>&#60;</mo><mfrac><mrow><mi>&#960;</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>.</mo></math> If <math><mi>N</mi></math> is the foot of the perpendicular from the origin&nbsp;<math><mi>O</mi></math>&nbsp;to the normal such that <math><mi>O</mi><mi>N</mi><mo>=</mo><mn>2</mn></math>, then <math><mi>&#952;</mi></math> is equal to", "image": null}, "options": [{"id": "JyIbD", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "L3OUe", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>12</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "CNazp", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "yG261", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Equation of the normal at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>3</mn><mi>cos</mi><mi>&#952;</mi><mo>,</mo><mi>sin</mi><mi>&#952;</mi></mrow></mfenced></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>3</mn><mi>x</mi></mrow><mrow><mi>cos</mi><mo>&#8289;</mo><mi>&#952;</mi></mrow></mfrac><mo>-</mo><mfrac><mi>y</mi><mrow><mi>sin</mi><mo>&#8289;</mo><mi>&#952;</mi></mrow></mfrac><mo>=</mo><mn>8</mn></math><br />So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>N</mi><mo>=</mo><mfenced open=\"|\" close=\"|\"><mfrac><mrow><mo>-</mo><mn>8</mn></mrow><msqrt><mn>9</mn><msup><mi>sec</mi><mn>2</mn></msup><mo>&#8289;</mo><mi>&#952;</mi><mo>+</mo><msup><mi>cosec</mi><mn>2</mn></msup><mo>&#8289;</mo><mi>&#952;</mi></msqrt></mfrac></m n>3</mn></math> cuts the ellipse <math><mn>4</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>5</mn></math> at <math><mi>P</mi></math> and <math><mi>Q</mi></math> . If <math><mi mathvariant=\"normal\">θ</mi></math> is the acute angle between normal at <math><mi>P</mi></math> and tangent at <math><mi>Q</mi></math>, then <math><mi mathvariant=\"normal\">θ</mi></math> is equal to", "image": null}, "options": [{"id": "jsi7x", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "L7fDO", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><msqrt><mn>34</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "9b7jf", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><msqrt><mn>34</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "45sCk", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Solving <math><mi>y</mi><mo>=</mo><mn>3</mn><mo>-</mo><mn>2</mn><mi>x</mi></math> and <math><mn>4</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>5</mn></math> , we get the intersection point <math><mi>P</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi></mi><mn>2</mn></mrow></mfenced></math> and <math><mi>Q</mi><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi></mi><mn>1</mn></mrow></mfenced></math><br />The equation of tangent at these points are <math><mn>4</mn><mi>x</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>5</mn></math> and <math><mn>4</mn><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced><mo>+</mo><mi>y</mi><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced><mo>=</mo><mn>5</mn></math><br /><math><mo>⇒</mo></math> Slope of tangents at <math><mi>P</mi></math> and <math><mi>Q</mi></math> are <math><mo>-</mo><mn>1</mn></math> and <math><mo>-</mo><mn>4</mn></math> respectively<br /><math><mo>⇒</mo></math> Slope of normal at <math><mi>P</mi></math> is <math><mn>1</mn></math><br /><math><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mn>1</mn><mo>-</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>4</mn></mrow></mfenced></mrow><mrow><mn>1</mn><mo>+</mo><mn>1</mn><mfenced separators=\"|\"><mrow><mo>-</mo><mn>4</mn></mrow></mfenced></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><msqrt><mn>34</mn></msqrt></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d3fe13ffcafd6489", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "93", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Two lines <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub></math> of slope <math><mn>1</mn></math> are tangent to <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> and <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>2</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math> respectively, such that the distance <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi></math>&nbsp;units between <math><msub><mrow><mi>L</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub></math> is minimum, then the value of&nbsp;<math><mi>d</mi></math> is equal to", "image": null}, "options": [{"id": "pcbWP", "text": "<math><msqrt><mn>3</mn></msqrt><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "IYuMm", "text": "<math><msqrt><mn>3</mn></msqrt><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "dHK68", "text": "<math><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "xc2JM", "text": "<math><msqrt><mn>3</mn></msqrt><mo>+</mo><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><mn>1</mn></math> is a tangent to <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math><br /><math><mi>y</mi><mo>=</mo><mi>x</mi><mo>&#177;</mo><msqrt><mn>4</mn><mo>+</mo><mn>2</mn></msqrt></math> is a tangent to <math><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>4</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math><br /><math><mo>&#8658;</mo></math> Minimum distance will be between the parallel lines<br /><math><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><msqrt><mn>6</mn></msqrt><mi></mi></math> and <math><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><mn>1</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>d</mi><mo>=</mo><mfrac><mrow><msqrt><mn>6</mn></msqrt><mo>-</mo><mn>1</mn></mrow><msqrt><mn>2</mn></msqrt></mfrac><mo>=</mo><msqrt><mn>3</mn></msqrt><mo>-</mo><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac></math>&nbsp;units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863caea0346cadec956", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If two points are taken on the minor axis of the ellipse <math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>25</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>9</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math> at the same distance from the centre as the foci, then the sum of the squares of the perpendicular distances from these points on any tangent to the ellipse is", "image": null}, "options": [{"id": "WOYTE", "text": "<math><mn>25</mn></math>", "image": null, "isCorrect": false}, {"id": "6JIc0", "text": "<math><mn>18</mn></math>", "image": null, "isCorrect": false}, {"id": "xk6bo", "text": "<math><mn>50</mn></math>", "image": null, "isCorrect": true}, {"id": "p4owz", "text": "<math><mn>80</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given ellipse is&nbsp;<math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>25</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>9</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math> … <math><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math><br /><math><mi mathvariant=\"normal\">e</mi><mo>=</mo><msqrt><mn>1</mn><mo>-</mo><mfrac bevelled=\"true\"><mrow><mn>9</mn></mrow><mrow><mn>25</mn></mrow></mfrac></msqrt><mo>=</mo><mfrac bevelled=\"true\"><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi><mfenced separators=\"|\"><mrow><mn>0,5</mn><mfenced separators=\"|\"><mfrac bevelled=\"true\"><mn>4</mn><mn>5</mn></mfrac></mfenced></mrow></mfenced><mo>=</mo><mi mathvariant=\"normal\">S</mi><mo>(</mo><mn>0,4</mn><mo>)</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">S</mi><mo>'</mo></msup><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mo>-</mo><mn>5</mn><mfenced separators=\"|\"><mfrac bevelled=\"true\"><mn>4</mn><mn>5</m mo><mfrac><mrow><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>1</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;is<br /><math><mi>y</mi><mo>=</mo><mn>2</mn><mi>x</mi><mo>&#177;</mo><msqrt><mn>4</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>1</mn></msqrt></math></p><p>Since, it passes through <math><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2,0</mn></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>0</mn><mo>=</mo><mn>2</mn><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2</mn></mrow></mfenced><mo>&#177;</mo><msqrt><mn>4</mn><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></msqrt></math><br /><math><mo>&#8658;</mo><mi mathvariant=\"normal\"></mi><mn>4</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>1</mn><mo>=</mo><mn>16</mn><mi mathvariant=\"normal\"></mi><mo>&#8658;</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>15</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mn>3.75</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86366948da5e3dfdfd5", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "11", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The point, which is at the shortest distance from the line <math><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>7</mn></math> and lying on an ellipse <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>2</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>6</mn></math>, has coordinates <math> <mrow> <mrow><mo>(</mo> <mrow> <mi>a</mi><mo>,</mo><mi>b</mi></mrow> <mo>)</mo></mrow></mrow> </math> then the value of <math> <mrow> <mfrac> <mi>a</mi> <mi>b</mi> </mfrac> </mrow> </math> is", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/56247i.PNG\" style=\"width: 300px; height: 202px;\" /><br />Equation of the ellipe is <math> <mrow> <mfrac> <mrow> <msup> <mi>x</mi> <mn>2</mn> </msup> </mrow> <mn>6</mn> </mfrac> <mo>+</mo><mfrac> <mrow> <msup> <mi>y</mi> <mn>2</mn> </msup> </mrow> <mn>3</mn> </mfrac> <mo>=</mo><mn>1</mn></mrow> </math><br /><br />The tangent at the point of shortest distance from the line <math><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>7</mn></math>&nbsp;should be parallel to the given line<br /><br />Any point on the given ellipse is <math><mo>(</mo><msqrt><mn>6</mn></msqrt><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>,</mo><mi>&nbsp;</mi><msqrt><mn>3</mn></msqrt><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>)</mo></math><br /><br />Equation of the tangent is<br /><br /><math><mfrac><mrow><mi>x</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow><mrow><msqrt><mn>6</mn></msqrt></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>y</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac><mo>=</mo><mn>1</mn><mo>.</mo></math> It is parallel to <math><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>7</mn></math><br /><br /><math> <mo>∵</mo> </math> Equation of the tangent at <math> <mrow> <mi>P</mi><mrow><mo>(</mo> <mrow> <mi>a</mi><mi>cos</mi><mi>θ</mi><mo>,</mo><mi>b</mi><mi>sin</mi><mi>θ</mi></mrow> <mo>)</mo></mrow></mrow> </math> on ellipse is&nbsp;<math><mrow><mfrac><mrow><mi>x</mi><mi>cos</mi><mi>θ</mi></mrow> <mi>a</mi> </mfrac> <mo>+</mo><mfrac> <mrow> <mi>y</mi><mi>sin</mi><mi>θ</mi></mrow> <mi>b</mi> </mfrac> <mo>=</mo><mn>1</mn></mrow> </math><br /><br /><math><mo>⇒</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow><mrow><msqrt><mn>6</mn></msqrt></mrow></mfrac><mo>=</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math><br /><br /><math><mo>⇒</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac><mo>=</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow><mrow><mn>1</mn></mrow></mfrac></math><math> <mrow> <mo>⇒</mo><mi>sin</mi><mi>θ</mi><mo>=</mo><mfrac> <mn>1</mn> <mrow> <msqrt> <mn>3</mn> </msqrt> </mrow> </mfrac> <mo>,</mo><mi>cos</mi><mi>θ</mi><mo>=</mo><msqrt> <mrow> <mfrac> <mn>2</mn> <mn>3</mn> </mfrac> </mrow> </msqrt> </mrow> </math><br /><br />The required point is <math><mo>(</mo><mn>2</mn><mo>,</mo><mi>&nbsp;</mi><mn>1</mn><mo>)</mo></math><br /><br />Hence,&nbsp;<math> <mrow> <mrow><mo>(</mo> <mrow> <mi>a</mi><mo>,</mo><mi>b</mi></mrow> <mo>)</mo></mrow><mo>=</mo><mrow><mo>(</mo> <mrow> <mn>2</mn><mo>,</mo><mn>1</mn></mrow> <mo>)</mo></mrow></mrow> </math><br /><br />therefore,&nbsp;<math><mrow><mfrac><mi>a</mi> <mi>b</mi> </mfrac> <mo>=</mo><mn>2</mn></mrow> </math>.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635a5a6fa0cf87cbd0", "type": "singleCorrect", "level": 1, "question mi></mrow></mrow></mrow></mfenced></math> at which the equation of the tangent is<br /><math><mfrac><mrow><mi>x</mi></mrow><mrow><mn>5</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>+</mo><mfrac><mrow><mi>y</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mn>1</mn></math><br />If it is also a tangent to the circle <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>16</mn></math>, then its distance&nbsp; from the origin is equal to the radius,&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mn>1</mn><msqrt><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup><mi>θ</mi></mrow><mn>25</mn></mfrac><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><msup><mi mathvariant=\"normal\">n</mi><mn>2</mn></msup><mi>θ</mi></mrow><mn>9</mn></mfrac></mrow></mfenced></msqrt></mfrac><mo>=</mo><mn>4</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><msup><mi>cos</mi><mn>2</mn></msup><mi>θ</mi></mrow><mn>25</mn></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn><mo>-</mo><msup><mi>cos</mi><mn>2</mn></msup><mi>θ</mi></mrow><mn>9</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>16</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mfrac><mrow><mn>5</mn><msqrt><mn>7</mn></msqrt></mrow><mn>16</mn></mfrac></math><br />If <math><mi>l</mi></math> be the length of the tangent then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>l</mi><mn>2</mn></msup><mo>=</mo><msup><mi>S</mi><mo>'</mo></msup></math><br />or <math><msup><mrow><mi>l</mi></mr ow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math><br />or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>sin</mi><mo>&#8289;</mo><mi>&#952;</mi><mo>=</mo><mo>-</mo><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac><mo>,</mo><mo>&#160;</mo><mi>cos</mi><mo>&#8289;</mo><mi>&#952;</mi><mo>=</mo><mo>-</mo><mfrac><msqrt><mn>2</mn></msqrt><msqrt><mn>3</mn></msqrt></mfrac></math>&nbsp;(rejected because it gives farthest point)<br /><math><mo>&#8658;</mo></math> Nearest point is <math><mfenced separators=\"|\"><mrow><msqrt><mn>6</mn></msqrt><mfenced separators=\"|\"><mrow><mfrac><mrow><msqrt><mn>2</mn></msqrt></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></mrow></mfenced><mo>,</mo><msqrt><mn>3</mn></msqrt><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow></mfenced><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2,1</mn></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634255971b621b5fd5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "34", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A tangent having slope&nbsp;<math><mo>-</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math> to the ellipse <math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>18</mn></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>32</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math> intersects the major and minor axes at <math><mi mathvariant=\"normal\">A</mi></math> and <math><mi mathvariant=\"normal\">B</mi></math>. If <math><mi mathvariant=\"normal\">O</mi></math> is the origin, then the area of&nbsp;<math><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi></math> is", "image": null}, "options": [{"id": "LiGTV", "text": "<math><mn>48</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "ni7pf", "text": "<math><mn>9</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}, {"id": "O4R1l", "text": "<math><mn>24</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": true}, {"id": "RAoMm", "text": "<math><mn>16</mn><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo><mi mathvariant=\"normal\"> </mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Any point on the ellipse <math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>3</mn><msqrt><mn>2</mn></msqrt></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>4</mn><msqrt><mn>2</mn></msqrt></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>1</mn></math> can be taken as <math><mfenced separators=\"|\"><mrow><mn>3</mn><msqrt><mn>2</mn></msqrt><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>4</mn><msqrt><mn>2</mn></msqrt><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow></mfenced></math> and the slope of the tangent as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mi>&nbsp;</mi><mfrac><mrow><msup><mi mathvariant=\"normal\">b</mi><mn>2</mn></msup><mi mathvariant=\"normal\">x</mi></mrow><mrow><msup><mi mathvariant=\"normal\">a</mi><mn>2</mn></msup><mi mathvariant=\"normal\">y</mi></mrow></mfrac></math><br /><br />Hence, slope<math><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>32</mn><mfenced separators=\"|\"><mrow><mn>3</mn><msqrt><mn>2</mn></msqrt><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow></mfenced></mrow><mrow><mn>18</mn><mi mathvariant=\"normal\">&nbsp;</mi><mfenced separators=\"|\"><mrow><mn>4</mn><msqrt><mn>2</mn></msqrt><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow></mfenced></mrow></mfrac><mo>=</mo><mo>-</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>…</mo><mo>.</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math><br /><br />Given, the slope of the tangent&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>-</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>…</mo><mo>.</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfenced separators=\"|\"><mn>2</mn></mfenced></math><br /><br />From equations (1) and (2), we get,&nbsp;<br /><br /><math><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>=</mo><mn>1</mn><mo>⇒</mo><mi mathvariant=\"normal\">θ</mi><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br />Hence, the equation of the tangent is <math><mfrac><mrow><mi mathvariant=\"normal\">x</mi><mo>.</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow><mrow><mn>3</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mi mathvariant=\"normal\">y</mi><mo>.</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow><mrow><mn>4</mn><msqrt><mn>2</mn></msqrt></mrow></mfrac><mo>=</mo><mn>1</mn></math><br /><br />(i.e.) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">x</mi><mn>6</mn></mfrac><mi mathvariant=\"normal\">&nbsp;</mi><mo>+</mo><mi mathvariant=\"normal\">&nbsp;</mi><mfrac><mi mathvariant=\"normal\">y</mi><mn>8</mn></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;<br /><br />Hence,&nbsp;<math><mi mathvariant=\"normal\">A</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>6</mn><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>0</mn></mrow></mfenced><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">B</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>8</mn></mrow></mfenced></math><br /><br />Area of <math><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>×</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>6</mn><mi mathvariant=\"normal\">&nbsp;</mi><mo>×</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>8</mn><mo>=</mo><mn>24</mn><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">q</mi><mo>.</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi mathvariant=\"normal\">u</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">s</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630f5cc9055668a98a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "31", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The line <math><mn>2</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>3</mn></math> cuts the ellipse <math><mn>4</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>5</mn></math> at points&nbsp;<math><mi>P</mi></math> and <math><mi>Q</mi></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi></math> is the acute angle between the normals at <math><mi>P</mi></math> and <math><mi>Q</mi></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi></math> is equal to", "image": null}, "options": [{"id": "E9ZaF", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "rztV5", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><msqrt><mn>34</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "SvqKB", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><msqrt><mn>34</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "2kz5G", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Solving <math><mi>y</mi><mo>=</mo><mn>3</mn><mo>-</mo><mn>2</mn><mi>x</mi></math> and <math><mn>4</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>5</mn><mo>,</mo></math> we get the intersection points&nbsp;<math><mi>P</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mn>2</mn></mrow></mfenced></math> and <math><mi>Q</mi><mfenced separators=\"|\"><mrow><mn>1,1</mn></mrow></mfenced></math><br />The equations of the tangents at these points are <math><mn>4</mn><mi>x</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>5</mn></math> and <math><mn>4</mn><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced><mo>+</mo><mi>y</mi><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced><mo>=</mo><mn>5</mn></math><br /><math><mo>⇒</mo></math>&nbsp;The slopes of the tangents at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>&nbsp;</mo><mo>&amp;</mo><mo>&nbsp;</mo><mi>Q</mi></math> are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>1</mn><mo>&nbsp;</mo><mo>&amp;</mo><mo>&nbsp;</mo><mo>-</mo><mn>4</mn></math> respectively<br /><math><mo>⇒</mo></math>&nbsp;The slopes of the normals at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>&nbsp;</mo><mo>&amp;</mo><mo>&nbsp;</mo><mi>Q</mi></math> are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&nbsp;</mo><mo>&amp;</mo><mo>&nbsp;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math> respectively<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>tan</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mfrac><mrow><mn>1</mn><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow><mrow><mn>1</mn><mo>+</mo><mn>1</mn><mfenced separators=\"|\"><mfrac><mn>1</mn><mn>4</mn></mfrac></mfenced></mrow></mfrac></mfenced><mo>=</mo><mfrac><mn>3</mn><mn>5</mn></mfrac><mo>⇒</mo><mi>θ</mi><mo>=</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>⁡</mo><mfrac><mn>3</mn><mn>5</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mfrac><mn>5</mn><msqrt><mn>34</mn></msqrt></mfrac><mo>,</mo><mo>&nbsp;</mo><mi>sin</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mfrac><mn>3</mn><msqrt><mn>34</mn></msqrt></mfrac><mo>⇒</mo><mi>θ</mi><mo>=</mo><msup><mi>sin</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>⁡</mo><mfrac><mn>3</mn><msqrt><mn>34</mn></msqrt></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86307b36664d23e9541", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "85", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let from a point <math><mi>A</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi></mi><mi>k</mi></mrow></mfenced></math> chords of contact are drawn to the ellipse <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>2</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>6</mn></math> where all these chords touch the ellipse <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math>.&nbsp;Then, the perimeter (in units) of the locus of point <math><mi>A</mi></math> is", "image": null}, "options": [{"id": "y6zbt", "text": "<math><mn>2</mn><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "fl6qz", "text": "<math><mn>3</mn><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "dF4Q3", "text": "<math><mn>4</mn><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "qr3aX", "text": "<math><mn>6</mn><mi>π</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Let the chord of contact is <math><mi>P</mi><mi>Q</mi></math> which touches <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math> at <math><mi>R</mi></math><br />Now, assume <math><mi>R</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow><mo>,</mo><mn>2</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow></mrow></mfenced></math><br />Equation of the chord of contact&nbsp;<math><mi>P</mi><mi>Q</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mi>k</mi><mo>=</mo><mn>6</mn><mo>&#8230;</mo><mo>.</mo><mo>.</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">i</mi></mfenced></math><br />Again, the equation of the tangent&nbsp;<math><mi>P</mi><mi>Q</mi></math> is <math><mfrac><mrow><mi>x</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>y</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow></mrow><mrow><mn>1</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mi></mi><mo>&#8230;</mo><mo>.</mo><mo>.</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math><br />From <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math>, we get,</p><p>&nbsp;<math><mfrac><mrow><mi>h</mi><mn>2</mn></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>k</mi></mrow><mrow><mi>s</mi><mi>i</mi><mi>n</mi><mi>&#952;</mi></mrow></mfrac><mo>=</mo><mn>6</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cos</mi><mo>&#8289;</mo><mi>&#952;</mi><mo>=</mo><mfrac><mi>h</mi><mn>3</mn></mfrac><mo>,</mo><mi>sin</mi><mo>&#8289;</mo><mi>&#952;</mi><mo>=</mo><mfrac><mi>k</mi><mn>3</mn></mfrac><mspace linebreak=\"newline\"/><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>9</mn></math></p><p>Hence, the perimeter of the circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi mathvariant=\"normal\">&#960;</mi></math>&nbsp;units</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "6aa3ab79aa8dc1ff68177f93", "title": "Tangent to Ellipse", "totalQuestions": 9, "questions": [{"_id": "6151e863fa2024c72f739889", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "98", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A trapezium is formed by the pair of tangents of parabola <math><mi>P</mi><mi></mi><mo>:</mo><mi>y</mi><mo>=</mo><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>4</mn></mrow></mfrac><mo>+</mo><mn>1</mn></math> drawn from the centre of the ellipse&nbsp;<math><mi>E</mi><mi></mi><mo>:</mo><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>4</mn></mrow></mfrac><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>, tangent at the vertex of <math><mi>P</mi></math> and the tangent at end point of the minor axis of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi></math>. The area (in sq. units) of the trapezium is", "image": null}, "options": [{"id": "efXgZ", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "Eaae1", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "jSj7y", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>16</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "W54bN", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>8</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/d9c03c33-4230-4bfb-8a15-02e8b0920f39.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:2.48056in;height:2.31319in\" /></p><p>The equation of the tangents from the centre of the ellipse to the parabola are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mo>±</mo><mi>x</mi></math></p><p>The equation of the tangent at the vertex&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;of the parabola&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>1</mn></math></p><p>The equation of the tangent at the end point of the minor axis of the ellipse is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p>&nbsp;Hence, the area of trapezium&nbsp;<math><mi>A</mi><mi>B</mi><mi>C</mi><mi>D</mi></math><math> <mrow> <mo>=</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mo>⋅</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mfenced> <mrow> <mn>1</mn><mo>+</mo><mn>2</mn></mrow> </mfenced><mo>=</mo><mfrac> <mn>3</mn> <mn>4</mn> </mfrac> </mrow> </math>&nbsp;sq. units</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dcb47f8b1ee95b72", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "103", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The tangent to the ellipse <math><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>25</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>16</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;at point <math><mi>P</mi></math> lying in the first quadrant meets <math><mi>x</mi></math>-axis at <math><mi>Q</mi></math> and <math><mi>y</mi></math>-axis at <math><mi>R</mi></math>. If the length&nbsp;<math><mi>Q</mi><mi>R</mi></math> is minimum, then the equation of this tangent is", "image": null}, "options": [{"id": "EGMsM", "text": "<math><mn>2</mn><mi>x</mi><mo>+</mo><msqrt><mn>5</mn></msqrt><mi>y</mi><mo>=</mo><mn>6</mn><msqrt><mn>5</mn></msqrt></math>", "image": null, "isCorrect": true}, {"id": "pHEFr", "text": "<math><msqrt><mn>5</mn></msqrt><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>6</mn><msqrt><mn>5</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "XA30x", "text": "<math><mn>2</mn><mi>x</mi><mo>-</mo><msqrt><mn>5</mn></msqrt><mo>=</mo><mn>6</mn><msqrt><mn>5</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "3SVcc", "text": "<math><mn>2</mn><msqrt><mn>5</mn></msqrt><mo></mo><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>6</mn><msqrt><mn>5</mn></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let point <math><mi>P</mi></math> be <math><mfenced separators=\"|\"><mrow><mn>5</mn><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>,</mo><mn>4</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced><mo>,</mo><mi></mi><mi>θ</mi><mo>∈</mo><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math><br />So, the equation of tangent is <math><mfrac><mrow><mi>x</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow><mrow><mn>5</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>y</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math><br />Points <math><mi>Q</mi></math> and <math><mi>R</mi></math> are <math><mfenced separators=\"|\"><mrow><mn>5</mn><mrow><mrow><mi mathvariant=\"normal\">sec</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>,</mo><mn>0</mn></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi></mi><mn>4</mn><mrow><mrow><mi mathvariant=\"normal\">cosec</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced></math> respectively.<br />Hence,&nbsp;<math><msup><mrow><mfenced separators=\"|\"><mrow><mi>Q</mi><mi>R</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>25</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sec</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>+</mo><mn>16</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cosec</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mn>25</mn><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced><mo>+</mo><mn>16</mn><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced></math><br /><math><mo>=</mo><mn>41</mn><mo>+</mo><mn>25</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>+</mo><mn>16</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mn>41</mn><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>5</mn><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>-</mo><mn>4</mn><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>40</mn></math><br /><math><msubsup><mrow><mfenced separators=\"|\"><mrow><mi>Q</mi><mi>R</mi></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mn>81</mn></math> when <math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><msqrt><mn>5</mn></msqrt></mrow></mfrac></math><br />Therefore,&nbsp;<math><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>,</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><msqrt><mn>5</mn></msqrt></mrow><mrow><mn>3</mn></mrow></mfrac></math><br />Hence, equation of tangent is <math><mn>2</mn><mi>x</mi><mo>+</mo><msqrt><mn>5</mn></msqrt><mi>y</mi><mo>=</mo><mn>6</mn><msqrt><mn>5</mn></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c21f8cab7d708b41", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "25", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If any tangent to the ellipse <math><mn>25</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>9</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>225</mn></math> meets the coordinate axes at <math><mi>A</mi></math> and <math><mi>B</mi></math> such that <math><mi>O</mi><mi>A</mi><mo>=</mo><mi>O</mi><mi>B</mi></math> then, the length&nbsp;<math><mi>A</mi><mi>B</mi></math> is equal to (where,&nbsp;<math><mi>O</mi></math> is the origin)", "image": null}, "options": [{"id": "9Euqt", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>17&#160;</mn></msqrt></math> units", "image": null, "isCorrect": false}, {"id": "VNadN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>34&#160;</mn></msqrt></math> units", "image": null, "isCorrect": false}, {"id": "hV29c", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msqrt><mn>17&nbsp;</mn></msqrt></math> units", "image": null, "isCorrect": true}, {"id": "XK2pO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><msqrt><mn>34&#160;</mn></msqrt></math> units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Give  is<br /><math><mfrac><mrow><mi>x</mi></mrow><mrow><mn>5</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>+</mo><mfrac><mrow><mi>y</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mn>1</mn></math><br />If it is also a tangent to the circle <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>16</mn></math>, then its distance&nbsp; from the origin is equal to the radius,&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mn>1</mn><msqrt><mfenced separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><msup><mi mathvariant=\"normal\">s</mi><mn>2</mn></msup><mi>θ</mi></mrow><mn>25</mn></mfrac><mo>+</mo><mfrac><mrow><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><msup><mi mathvariant=\"normal\">n</mi><mn>2</mn></msup><mi>θ</mi></mrow><mn>9</mn></mfrac></mrow></mfenced></msqrt></mfrac><mo>=</mo><mn>4</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mfrac><mrow><msup><mi>cos</mi><mn>2</mn></msup><mi>θ</mi></mrow><mn>25</mn></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn><mo>-</mo><msup><mi>cos</mi><mn>2</mn></msup><mi>θ</mi></mrow><mn>9</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>16</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>=</mo><mfrac><mrow><mn>5</mn><msqrt><mn>7</mn></msqrt></mrow><mn>16</mn></mfrac></math><br />If <math><mi>l</mi></math> be the length of the tangent then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>l</mi><mn>2</mn></msup><mo>=</mo><msup><mi>S</mi><mo>'</mo></msup></math><br />or <math><msup><mrow><mi>l</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>25</mn><mi mathvariant=\"normal
