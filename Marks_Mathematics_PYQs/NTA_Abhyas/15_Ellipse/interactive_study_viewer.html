mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>9</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math> form a square, then the area (in sq. units) of the square is", "image": null}, "options": [{"id": "F9Ih4", "text": "<math><mn>50</mn></math>", "image": null, "isCorrect": true}, {"id": "AkNov", "text": "<math><mn>100</mn></math>", "image": null, "isCorrect": false}, {"id": "JCUTm", "text": "<math><mn>25</mn></math>", "image": null, "isCorrect": false}, {"id": "Qs9Dt", "text": "<math><mn>40</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let, the equation of tangent in slope form for the circle be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>&#177;</mo><mi>r</mi><msqrt><mn>1</mn><mo>+</mo><msup><mi>m</mi><mn>2</mn></msup></msqrt></math></p><p>and&nbsp;the equation of tangent in slope form for the ellipse be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>&#177;</mo><msqrt><mn>16</mn><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>9</mn></msqrt></math></p><p>Now, for common tangets,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>&#177;</mo><mi>r</mi><msqrt><mn>1</mn><mo>+</mo><msup><mi>m</mi><mn>2</mn></msup></msqrt></math> is same as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>&#177;</mo><msqrt><mn>16</mn><msup><mi>m</mi><mn>2</mn></msup><mo>+</mo><mn>9</mn></msqrt></math><br /><math><mo>&#8658;</mo><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>16</mn><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>9</mn><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>16</mn></mrow></mfenced><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfenced separators=\"|\"><mrow><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>9</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p>Since, here&nbsp;<math><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>-</mo><mn>1</mn></math>&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mn>25</mn><mo>&#8658;</mo><mi>r</mi><mo>=</mo><mfrac><mn>5</mn><msqrt><mn>2</mn></msqrt></mfrac></math></p><p>So, the side of the square <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mi>r</mi><mo>=</mo><mn>5</mn><msqrt><mn>2</mn></msqrt></math><br /><math><mo>&#8658;</mo></math> area of the square is <math><mn>50</mn></math>&nbsp;sq. units<br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/413975b4-ee7b-4377-bdf2-d43fc4f1c354.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.78681in;height:1.43333in\" /></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "6aa3ab79aa8dc1ff68177f92", "title": "Properties of Tangent", "totalQuestions": 4, "questions": [{"_id": "6151e863dcb47f8b1ee95b72", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "103", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The tangent to the ellipse <math><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>25</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>16</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;at point <math><mi>P</mi></math> lying in the first quadrant meets <math><mi>x</mi></math>-axis at <math><mi>Q</mi></math> and <math><mi>y</mi></math>-axis at <math><mi>R</mi></math>. If the length&nbsp;<math><mi>Q</mi><mi>R</mi></math> is minimum, then the equation of this tangent is", "image": null}, "options": [{"id": "EGMsM", "text": "<math><mn>2</mn><mi>x</mi><mo>+</mo><msqrt><mn>5</mn></msqrt><mi>y</mi><mo>=</mo><mn>6</mn><msqrt><mn>5</mn></msqrt></math>", "image": null, "isCorrect": true}, {"id": "pHEFr", "text": "<math><msqrt><mn>5</mn></msqrt><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>6</mn><msqrt><mn>5</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "XA30x", "text": "<math><mn>2</mn><mi>x</mi><mo>-</mo><msqrt><mn>5</mn></msqrt><mo>=</mo><mn>6</mn><msqrt><mn>5</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "3SVcc", "text": "<math><mn>2</mn><msqrt><mn>5</mn></msqrt><mo></mo><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>6</mn><msqrt><mn>5</mn></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let point <math><mi>P</mi></math> be <math><mfenced separators=\"|\"><mrow><mn>5</mn><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>,</mo><mn>4</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced><mo>,</mo><mi></mi><mi>θ</mi><mo>∈</mo><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math><br />So, the equation of tangent is <math><mfrac><mrow><mi>x</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow><mrow><mn>5</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>y</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math><br />Points <math><mi>Q</mi></math> and <math><mi>R</mi></math> are <math><mfenced separators=\"|\"><mrow><mn>5</mn><mrow><mrow><mi mathvariant=\"normal\">sec</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>,</mo><mn>0</mn></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi></mi><mn>4</mn><mrow><mrow><mi mathvariant=\"normal\">cosec</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced></math> respectively.<br />Hence,&nbsp;<math><msup><mrow><mfenced separators=\"|\"><mrow><mi>Q</mi><mi>R</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>25</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sec</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>+</mo><mn>16</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cosec</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mn>25</mn><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced><mo>+</mo><mn>16</mn><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced></math><br /><math><mo>=</mo><mn>41</mn><mo>+</mo><mn>25</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>+</mo><mn>16</mn><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mn>41</mn><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>5</mn><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>-</mo><mn>4</mn><mrow><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>40</mn></math><br /><math><msubsup><mrow><mfenced separators=\"|\"><mrow><mi>Q</mi><mi>R</mi></mrow></mfenced></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mn>81</mn></math> when <math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><msqrt><mn>5</mn></msqrt></mrow></mfrac></math><br />Therefore,&nbsp;<math><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>,</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><msqrt><mn>5</mn></msqrt></mrow><mrow><mn>3</mn></mrow></mfrac></math><br />Hence, equation of tangent is <math><mn>2</mn><mi>x</mi><mo>+</mo><msqrt><mn>5</mn></msqrt><mi>y</mi><mo>=</mo><mn>6</mn><msqrt><mn>5</mn></msqrt></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863caea0346cadec956", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If two points are taken on the minor axis of the ellipse <math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>25</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>9</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math> at the same distance from the centre as the foci, then the sum of the squares of the perpendicular distances from these points on any tangent to the ellipse is", "image": null}, "options": [{"id": "WOYTE", "text": "<math><mn>25</mn></math>", "image": null, "isCorrect": false}, {"id": "6JIc0", "text": "<math><mn>18</mn></math>", "image": null, "isCorrect": false}, {"id": "xk6bo", "text": "<math><mn>50</mn></math>", "image": null, "isCorrect": true}, {"id": "p4owz", "text": "<math><mn>80</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given ellipse is&nbsp;<math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>25</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>9</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math> … <math><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math><br /><math><mi mathvariant=\"normal\">e</mi><mo>=</mo><msqrt><mn>1</mn><mo>-</mo><mfrac bevelled=\"true\"><mrow><mn>9</mn></mrow><mrow><mn>25</mn></mrow></mfrac></msqrt><mo>=</mo><mfrac bevelled=\"true\"><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi><mfenced separators=\"|\"><mrow><mn>0,5</mn><mfenced separators=\"|\"><mfrac bevelled=\"true\"><mn>4</mn><mn>5</mn></mfrac></mfenced></mrow></mfenced><mo>=</mo><mi mathvariant=\"normal\">S</mi><mo>(</mo><mn>0,4</mn><mo>)</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">S</mi><mo>'</mo></msup><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mo>-</mo><mn>5</mn><mfenced separators=\"|\"><mfrac bevelled=\"true\"><mn>4</mn><mn>5</mn></mfrac></mfenced></mrow></mfenced><mo>=</mo><msup><mi mathvariant=\"normal\">S</mi><mo>'</mo></msup><mo>(</mo><mn>0</mn><mo>,</mo><mo>-</mo><mn>4</mn><mo>)</mo></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/747c0de1-57ac-4d1d-9fe2-fd757f41388e.png\" style=\"width:1.64653in;height:1.36667in\" /><br />Let, the tangent to the ellipse be&nbsp;<math><mi mathvariant=\"normal\">y</mi><mo>=</mo><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">x</mi><mo>+</mo><msqrt><mn>25</mn><msup><mrow><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>9</mn></msqrt></math> where,&nbsp;<math><mi mathvariant=\"normal\">m</mi></math> is a parameter.</p><p>Now, the sum of the squares of <math><mo>⊥</mo></math>&nbsp;distances on this tangent from the points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">S</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi mathvariant=\"normal\">S</mi><mo>'</mo></msup></math> is<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mfenced separators=\"|\"><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mfenced separators=\"|\"><mn>0</mn></mfenced><mo>-</mo><mn>4</mn><mo>+</mo><msqrt><mn>25</mn><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>+</mo><mn>9</mn></msqrt></mrow><msqrt><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></msqrt></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><msup><mfenced separators=\"|\"><mfrac><mrow><mi mathvariant=\"normal\">m</mi><mfenced separators=\"|\"><mn>0</mn></mfenced><mo>+</mo><mn>4</mn><mo>+</mo><msqrt><mn>25</mn><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>+</mo><mn>9</mn></msqrt></mrow><msqrt><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></msqrt></mfrac></mfenced><mn>2</mn></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>2</mn><mrow><mo>(</mo><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><mo>)</mo></mrow></mfrac><mfenced close=\"}\" open=\"{\" separators=\"|\"><mrow><msup><mn>4</mn><mn>2</mn></msup><mo>+</mo><mo>(</mo><mn>25</mn><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup><mo>+</mo><mn>9</mn><mo>)</mo></mrow></mfenced><mo>=</mo><mn>50</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a1517ddb433d99cd", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "86", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the tangents <math><mi>P</mi><mi>Q</mi></math> and <math><mi>P</mi><mi>R</mi></math> are drawn from a variable point <math><mi>P</mi></math> to the ellipse <math><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>16</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>9</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mo>,</mo></math> such that the fourth point <math><mi>S</mi></math> of the parallelogram <math><mi>P</mi><mi>Q</mi><mi>S</mi><mi>R</mi></math> lies on the circumcircle of the&nbsp;<math><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mi>Q</mi><mi>R</mi></math>, then the area (in sq. units) of the locus of <math><mi>P</mi></math> is", "image": null}, "options": [{"id": "LsZVu", "text": "<math><mn>7</mn><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "9OwjV", "text": "<math><mn>16</mn><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "BOYPq", "text": "<math><mn>25</mn><mi>π</mi></math>", "image": null, "isCorrect": true}, {"id": "Ern3g", "text": "<math><mn>9</mn><mi>π</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Parallelogram <math><mi>P</mi><mi>Q</mi><mi>S</mi><mi>R</mi></math> is a cyclic quadrilateral<br /><math><mo>&#8658;</mo></math> Parallelogram is a rectangle<br /><math><mo>&#8658;</mo><mi>&#8736;</mi><mi>Q</mi><mi>P</mi><mi>R</mi><mo>=</mo><msup><mrow><mn>90</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math><br />Let, the equation of the tangent from <math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi></mi><mi>k</mi></mrow></mfenced></math> to the ellipse is <math><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>&#177;</mo><msqrt><mn>16</mn><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>9</mn></msqrt><mo>&#8658;</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>k</mi><mo>-</mo><mi>m</mi><mi>h</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>16</mn><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>9</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><msub><mi>m</mi><mn>1</mn></msub><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>1</mn><mo>&#8658;</mo><msup><mi>h</mi><mn>2</mn></msup><mo>-</mo><mn>16</mn><mo>=</mo><mo>-</mo><msup><mi>k</mi><mn>2</mn></msup><mo>+</mo><mn>9</mn></math><br /><math><mo>&#8658;</mo></math> locus of <math><mi>P</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>25</mn></math></p><p>Hence, the area of locus of <math><mi>P</mi></math> is <math><mn>25</mn><mi>&#960;</mi></math>&nbsp;sq. units</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863743604398d0d96af", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "106", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If a number of ellipses whose major axis is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis and the minor axis is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>-axis&nbsp;be described having the same length of the major axis as&nbsp;<math><mn>2</mn></math> but a variable minor axis, then the tangents at the ends of their latus rectum pass through fixed points whose distance from the centre is equal to&nbsp;", "image": null}, "options": [{"id": "dUteQ", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math> units", "image": null, "isCorrect": false}, {"id": "2WX5b", "text": "<math><mn>1</mn></math> unit", "image": null, "isCorrect": true}, {"id": "08zDI", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math> units", "image": null, "isCorrect": false}, {"id": "SXdS0", "text": "<math><mn>2</mn></math> units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Since the minor axis is variable, hence&nbsp;<math><mi>e</mi></math> is a variable quantity</p><p>Therefore the equation of the tangent to the ellipse can be written as <math><mfrac><mrow><mi>x</mi><mi>a</mi><mi>e</mi></mrow><mrow><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>y</mi><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>a</mi><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>1</mn></math><br /><math><mo>⇒</mo><mi>e</mi><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mi>a</mi><mo>⇒</mo><mi>y</mi><mo>-</mo><mi>a</mi><mo>+</mo><mi>e</mi><mi>x</mi><mo>=</mo><mn>0</mn></math><br />This line passes through the fixed point&nbsp;<math><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi>a</mi></mrow></mfenced></math> (where <math><mi>a</mi><mo>=</mo><mn>1</mn></math>)</p><p>Hence, distance fro the centre of the ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "6aa3ab79aa8dc1ff68177f90", "title": "Normal to Ellipse", "totalQuestions": 6, "questions": [{"_id": "6151e863ebbbc094445c3d1c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "88", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The line <math><mn>2</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>3</mn></math> cuts the ellipse <math><mn>4</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>5</mn></math> at <math><mi>P</mi></math> and <math><mi>Q</mi></math> . If <math><mi mathvariant=\"normal\">θ</mi></math> is the acute angle between normal at <math><mi>P</mi></math> and tangent at <math><mi>Q</mi></math>, then <math><mi mathvariant=\"normal\">θ</mi></math> is equal to", "image": null}, "options": [{"id": "jsi7x", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "L7fDO", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><msqrt><mn>34</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}, {"id": "9b7jf", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><msqrt><mn>34</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": true}, {"id": "45sCk", "text": "<math><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced></mrow></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Solving <math><mi>y</mi><mo>=</mo><mn>3</mn><mo>-</mo><mn>2</mn><mi>x</mi></math> and <math><mn>4</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>5</mn></math> , we get the intersection point <math><mi>P</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi></mi><mn>2</mn></mrow></mfenced></math> and <math><mi>Q</mi><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi></mi><mn>1</mn></mrow></mfenced></math><br />The equation of tangent at these points are <math><mn>4</mn><mi>x</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mo>+</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>5</mn></math> and <math><mn>4</mn><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced><mo>+</mo><mi>y</mi><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced><mo>=</mo><mn>5</mn></math><br /><math><mo>⇒</mo></math> Slope of tangents at <math><mi>P</mi></math> and <math><mi>Q</mi></math> are <math><mo>-</mo><mn>1</mn></math> and <math><mo>-</mo><mn>4</mn></math> respectively<br /><math><mo>⇒</mo></math> Slope of normal at <math><mi>P</mi></math> is <math><mn>1</mn></math><br /><math><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mn>1</mn><mo>-</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>4</mn></mrow></mfenced></mrow><mrow><mn>1</mn><mo>+</mo><mn>1</mn><mfenced separators=\"|\"><mrow><mo>-</mo><mn>4</mn></mrow></mfenced></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><msqrt><mn>34</mn></msqrt></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863650a60c3cc462545", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are corresponding points on the ellipse <math><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>16</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi mathvariant=\"normal\">y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>9</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math> and its auxiliary circle respectively. If the normal at <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub></math> to the ellipse meets <math><mi mathvariant=\"normal\">O</mi><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub></math> in <math><mi mathvariant=\"normal\">Q</mi></math> (where <math><mi mathvariant=\"normal\">O</mi></math> is the origin), then the length of <math><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">Q</mi></math> is equal to", "image": null}, "options": [{"id": "9Knsd", "text": "<math><mn>3</mn></math> units", "image": null, "isCorrect": false}, {"id": "32t5R", "text": "<math><mn>9</mn></math> units", "image": null, "isCorrect": false}, {"id": "KaoMR", "text": "<math><mn>4</mn></math> units", "image": null, "isCorrect": false}, {"id": "oVbV0", "text": "<math><mn>7</mn></math> units", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let,&nbsp;<math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mn>4</mn><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi><mo>,</mo></mrow></mrow><mn>3</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi mathvariant=\"normal\">θ</mi></mrow></mrow></mrow></mfenced></math><br />and <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfenced se hyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let from a point <math><mi>A</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></math> chord of contacts are drawn to the ellipse <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>2</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>6</mn></math> such that all these chords touch the ellipse <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math>, then locus of the point <math><mi>A</mi></math> is", "image": null}, "options": [{"id": "edaK2", "text": "<math><mn>4</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>9</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>36</mn></math>", "image": null, "isCorrect": false}, {"id": "z4RKl", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "Ftxjj", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>9</mn></math>", "image": null, "isCorrect": false}, {"id": "caePo", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>9</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let chord of contact is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math> that touches <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math> at <math><mi>R</mi></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/9964d14f-66eb-469b-b7df-9fe6a5f429b6.png\" style=\"height: 157px; width: 190px;\" /><br />Now, assume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>,</mo><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow></mfenced></math><br />Equation of <math><mi>P</mi><mi>Q</mi></math> is <math><mi>h</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mi>k</mi><mo>=</mo><mn>6</mn></math> … <math><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>T</mi><mo>=</mo><mn>0</mn><mo>&nbsp;</mo><mi>for</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi><mo>&nbsp;</mo><mi>A</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></mrow></mfenced></math><br />Again, the equation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math> is <math><mfrac><mrow><mi>x</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\"></mi><mi>θ</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>y</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\"></mi><mi>θ</mi></mrow><mrow><mn>1</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math> … <math><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></math><br />From <math><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math> &amp; <math><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></math> we get <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>k</mi></mrow><mrow><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow></mfrac><mo>=</mo><mn>6</mn></math><br /><math><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>,</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mi>k</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>⇒</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>9</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638bafaee80fd39815", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "38", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The line <math><mn>2</mn><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi mathvariant=\"normal\">y</mi><mo>=</mo><mn>3</mn></math> interesects the ellipse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><msup><mi mathvariant=\"normal\">x</mi><mn>2</mn></msup><mo>+</mo><msup><mi mathvariant=\"normal\">y</mi><mn>2</mn></msup><mo>=</mo><mn>5</mn></math> at two points. The point of intersection of the tangents to the ellipse at these points is", "image": null}, "options": [{"id": "KkNtd", "text": "<math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "rfwPj", "text": "<math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "A5V33", "text": "<math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "YsfoH", "text": "<math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let the required point be <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">h</mi><mo>,</mo><mi mathvariant=\"normal\">k</mi></mrow></mfenced><mo>.</mo></math></p><p>Now from this point, the equation of chord of contact to the ellipse is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>4</mn><mi>hx</mi><mo>+</mo><mi>ky</mi><mo>=</mo><mn>5</mn></math> which is same as <math><mn>2</mn><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi mathvariant=\"normal\">y</mi><mo>=</mo><mn>3</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mn>4</mn><mi mathvariant=\"normal\">h</mi></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mi mathvariant=\"normal\">k</mi><mn>1</mn></mfrac><mo>=</mo><mfrac><mn>5</mn><mn>3</mn></mfrac><mo>&#8658;</mo><mi mathvariant=\"normal\">h</mi><mo>=</mo><mfrac><mn>5</mn><mn>6</mn></mfrac><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">k</mi><mo>=</mo><mfrac><mn>5</mn><mn>3</mn></mfrac></math><br /><math><mo>&#8658;</mo></math> Point of intersection of the tangents is <math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86307b36664d23e9541", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "85", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let from a point <math><mi>A</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi></mi><mi>k</mi></mrow></mfenced></math> chords of contact are drawn to the ellipse <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>2</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>6</mn></math> where all these chords touch the ellipse <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math>.&nbsp;Then, the perimeter (in units) of the locus of point <math><mi>A</mi></math> is", "image": null}, "options": [{"id": "y6zbt", "text": "<math><mn>2</mn><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "fl6qz", "text": "<math><mn>3</mn><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "dF4Q3", "text": "<math><mn>4</mn><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "qr3aX", "text": "<math><mn>6</mn><mi>π</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>Let the chord of contact is <math><mi>P</mi><mi>Q</mi></math> which touches <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math> at <math><mi>R</mi></math><br />Now, assume <math><mi>R</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow><mo>,</mo><mn>2</mn><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow></mrow></mfenced></math><br />Equation of the chord of contact&nbsp;<math><mi>P</mi><mi>Q</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mi>k</mi><mo>=</mo><mn>6</mn><mo>&#8230;</mo><mo>.</mo><mo>.</mo><mfenced separators=\"|\"><mi mathvariant=\"normal\">i</mi></mfenced></math><br />Again, the equation of the tangent&nbsp;<math><mi>P</mi><mi>Q</mi></math> is <math><mfrac><mrow><mi>x</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>y</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow></mrow><mrow><mn>1</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mi></mi><mo>&#8230;</mo><mo>.</mo><mo>.</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math><br />From <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math>, we get,</p><p>&nbsp;<math><mfrac><mrow><mi>h</mi><mn>2</mn></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>k</mi></mrow><mrow><mi>s</mi><mi>i</mi><mi>n</mi><mi>&#952;</mi></mrow></mfrac><mo>=</mo><mn>6</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>cos</mi><mo>&#8289;</mo><mi>&#952;</mi><mo>=</mo><mfrac><mi>h</mi><mn>3</mn></mfrac><mo>,</mo><mi>sin</mi><mo>&#8289;</mo><mi>&#952;</mi><mo>=</mo><mfrac><mi>k</mi><mn>3</mn></mfrac><mspace linebreak=\"newline\"/><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>9</mn></math></p><p>Hence, the perimeter of the circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mi mathvariant=\"normal\">&#960;</mi></math>&nbsp;units</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 11, "topicId": "6aa3ab79aa8dc1ff68177f8f", "title": "Locus", "totalQuestions": 5, "questions": [{"_id": "6151e863bb612a467f533498", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let from a point <math><mi>A</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></math> chord of contacts are drawn to the ellipse <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>2</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>6</mn></math> such that all these chords touch the ellipse <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math>, then locus of the point <math><mi>A</mi></math> is", "image": null}, "options": [{"id": "edaK2", "text": "<math><mn>4</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>9</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>36</mn></math>", "image": null, "isCorrect": false}, {"id": "z4RKl", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "Ftxjj", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>9</mn></math>", "image": null, "isCorrect": false}, {"id": "caePo", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>9</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let chord of contact is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math> that touches <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn></math> at <math><mi>R</mi></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/9964d14f-66eb-469b-b7df-9fe6a5f429b6.png\" style=\"height: 157px; width: 190px;\" /><br />Now, assume <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mi>cos</mi><mo>⁡</mo><mi>θ</mi><mo>,</mo><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow></mfenced></math><br />Equation of <math><mi>P</mi><mi>Q</mi></math> is <math><mi>h</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mi>k</mi><mo>=</mo><mn>6</mn></math> … <math><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>T</mi><mo>=</mo><mn>0</mn><mo>&nbsp;</mo><mi>for</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">p</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">t</mi><mo>&nbsp;</mo><mi>A</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></mrow></mfenced></math><br />Again, the equation of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math> is <math><mfrac><mrow><mi>x</mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\"></mi><mi>θ</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>y</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\"></mi><mi>θ</mi></mrow><mrow><mn>1</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math> … <math><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></math><br />From <math><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math> &amp; <math><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></math> we get <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mrow><mi>cos</mi><mo>⁡</mo><mi>θ</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>k</mi></mrow><mrow><mi>sin</mi><mo>⁡</mo><mi>θ</mi></mrow></mfrac><mo>=</mo><mn>6</mn></math><br /><math><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>,</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mi>k</mi></mrow><mrow><mn>3</mn></mrow></mfrac><mo>⇒</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>9</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a8110b60c469e826", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "70", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Variable ellipses are drawn with <math><mi>x</mi><mo>=</mo><mo>-</mo><mn>4</mn></math> as directrix and the origin as the corresponding focus. The eccentricity of the locus of the extremities of the minor axes of these ellipses is", "image": null}, "options": [{"id": "flbF6", "text": "<math><mn>1</mn></math>", "image": null, "isCorrect": true}, {"id": "rk0Al", "text": "<math><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "jI9fG", "text": "<math><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "Imx05", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/c1690431-9f3c-4870-8e2b-a1aec2103247.png\" style=\"width:2.40694in;height:1.79375in\" /><br />Now <math><mi>k</mi><mi></mi><mo>=</mo><mi></mi><mi>b</mi></math> and <math><mi>h</mi><mo>=</mo><mi>a</mi><mi>e</mi></math><br />Also <math><mfrac><mrow><mi>a</mi></mrow><mrow><mi>e</mi></mrow></mfrac><mo>-</mo><mi>a</mi><mi>e</mi><mo>=</mo><mn>4</mn><mo>&#8658;</mo><mi>a</mi><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><msup><mrow><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mo>=</mo><mn>4</mn><mi>e</mi></math><br /><math><mo>&#8658;</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><msup><mrow><mi>e</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mo>=</mo><mn>4</mn><mi>a</mi><mi>e</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>b</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>h</mi></math><br /><math><mo>&#8658;</mo><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>h</mi><mo>&#8658;</mo><mtable><mtr><mtd><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></mtd></mtr></mtable></math><br /><math><mo>&#8658;</mo></math> eccentricity <math><mo>=</mo><mn>1</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a1517ddb433d99cd", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "86", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the tangents <math><mi>P</mi><mi>Q</mi></math> and <math><mi>P</mi><mi>R</mi></math> are drawn from a variable point <math><mi>P</mi></math> to the ellipse <math><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>16</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>9</mn></mrow></mfrac><mo>=</mo><mn>1</mn><mo>,</mo></math> such that the fourth point <math><mi>S</mi></math> of the parallelogram <math><mi>P</mi><mi>Q</mi><mi>S</mi><mi>R</mi></math> lies on the circumcircle of the&nbsp;<math><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mi>Q</mi><mi>R</mi></math>, then the area (in sq. units) of the locus of <math><mi>P</mi></math> is", "image": null}, "options": [{"id": "LsZVu", "text": "<math><mn>7</mn><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "9OwjV", "text": "<math><mn>16</mn><mi>π</mi></math>", "image": null, "isCorrect": false}, {"id": "BOYPq", "text": "<math><mn>25</mn><mi>π</mi></math>", "image": null, "isCorrect": true}, {"id": "Ern3g", "text": "<math><mn>9</mn><mi>π</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Parallelogram <math><mi>P</mi><mi>Q</mi><mi>S</mi><mi>R</mi></math> is a cyclic quadrilateral<br /><math><mo>&#8658;</mo></math> Parallelogram is a rectangle<br /><math><mo>&#8658;</mo><mi>&#8736;</mi><mi>Q</mi><mi>P</mi><mi>R</mi><mo>=</mo><msup><mrow><mn>90</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math><br />Let, the equation of the tangent from <math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi></mi><mi>k</mi></mrow></mfenced></math> to the ellipse is <math><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>&#177;</mo><msqrt><mn>16</mn><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>9</mn></msqrt><mo>&#8658;</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>k</mi><mo>-</mo><mi>m</mi><mi>h</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>16</mn><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>9</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8757;</mo><msub><mi>m</mi><mn>1</mn></msub><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>1</mn><mo>&#8658;</mo><msup><mi>h</mi><mn>2</mn></msup><mo>-</mo><mn>16</mn><mo>=</mo><mo>-</mo><msup><mi>k</mi><mn>2</mn></msup><mo>+</mo><mn>9</mn></math><br /><math><mo>&#8658;</mo></math> locus of <math><mi>P</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>25</mn></math></p><p>Hence, the area of locus of <math><mi>P</mi></math> is <math><mn>25</mn><mi>&#960;</mi></math>&nbsp;sq. units</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a14810754bccc715", "type": "singleCorre /mn></mrow></msub></math> and <math><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>2</mn></mrow></mfenced><mo>=</mo><msub><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mn>2</mn></mrow></msub></math> and eccentricity of ellipse is <math><mi>e</mi></math><br />then <math><msub><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">e</mi></math> and <math><msub><mrow><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">S</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">S</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><mi mathvariant=\"normal\">a</mi></math><br />(where <math><mn>2</mn><mi mathvariant=\"normal\">a</mi></math> is&nbsp;length of major axis)<br /><math><mo>⇒</mo><mi mathvariant=\"normal\">e</mi><mo>=</mo><mfrac><mrow><msub><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mi mathvariant=\"normal\">P</mi><msub><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><mi mathvariant=\"normal\">P</mi><msub><mrow><mi mathvariant=\"normal\">S</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>2</mn></mrow></mfrac></math><br /><math><mo>⇒</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">e</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfrac><mo>=</mo><msqrt><mn>2</mn></msqrt><mo>-</mo><mn>1</mn><mo>=</mo><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mfrac><mrow><mi mathvari 56789dfghjk.JPG\" style=\"height: 138px; width: 300px;\" /><br />Slope of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>O</mi><mi>P</mi></math> <math><mo>=</mo><mfrac><mrow><mi>k</mi></mrow><mrow><mi>h</mi></mrow></mfrac><mo>⇒</mo></math> slope of the tangent is <math><mfrac><mrow><mo>-</mo><mi>h</mi></mrow><mrow><mi>k</mi></mrow></mfrac></math></p><p>Hence, the equation of tangent <math><mi>P</mi><mi>Q</mi></math> is <math><mfrac><mrow><mo>(</mo><mi>y</mi><mo>-</mo><mi>k</mi><mo>)</mo></mrow><mrow><mi>x</mi><mo>-</mo><mi>h</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mi>h</mi></mrow><mrow><mi>k</mi></mrow></mfrac></math><br /><math><mo>⇒</mo></math> <math><mi>y</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mi>h</mi></mrow><mrow><mi>k</mi></mrow></mfrac><mi>x</mi><mo>+</mo><mfrac><mrow><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>k</mi></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mfenced separators=\"|\"><mfrac><mrow><msup><mi>h</mi><mn>2</mn></msup><mo>+</mo><msup><mi>k</mi><mn>2</mn></msup></mrow><mi>k</mi></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><mn>40</mn><msup><mfenced separators=\"|\"><mfrac><mrow><mo>-</mo><mi>h</mi></mrow><mi>k</mi></mfrac></mfenced><mn>2</mn></msup><mo>+</mo><mn>10</mn><mo>&nbsp;</mo><mo>&nbsp;</mo><mfenced close=\"}\" open=\"{\" separators=\"|\"><mtable columnalign=\"left\"><mtr><mtd><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">n</mi><mo>&nbsp;</mo><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">f</mi><mo>&nbsp;</mo><mi>ta</mi><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">g</mi><mi mathvariant=\"normal\">e</mi>< at <math><mn>4</mn></math> points <math><mi>P</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi>Q</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi>R</mi></math> and <math><mi>S</mi></math> which form a square, then the area (in sq. units) of the square is", "image": null}, "options": [{"id": "kQXmm", "text": "<math><mfrac><mrow><mn>144</mn></mrow><mrow><mn>25</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "jRz1s", "text": "<math><mfrac><mrow><mn>25</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "WRUjv", "text": "<math><mfrac><mrow><mn>15</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "g8kyC", "text": "<math><mfrac><mrow><mn>576</mn></mrow><mrow><mn>25</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/034141ba-752c-4d9e-aed3-469e25c1b6eb.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.7in;height:0.94028in\" /><br />Let,&nbsp;<math><mi>P</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi>a</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>,</mo><mi mathvariant=\"normal\"></mi><mi>a</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced></math><br />Then,&nbsp;<math><mfenced separators=\"|\"><mrow><mi>a</mi><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>,</mo><mi mathvariant=\"normal\"></mi><mi>a</mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></mrow></mfenced></math>&nbsp;lies on <math><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>16</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>9</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math><br />Also,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>θ</mi><mo>=</mo><mn>45</mn><mo>°</mo></math> because <math><mi>P</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi>Q</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi>R</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi>S</mi></math> form a square<br /><math><mo>⇒</mo><mfrac><mrow><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mo>×</mo><mn>16</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn><mo>×</mo><mn>9</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math><br /><math><mo>⇒</mo><mfrac><mrow><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>16</mn><mo>+</mo><mn>9</mn></mrow><mrow><mn>16</mn><mo>×</mo><mn>9</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>1</mn><mo>⇒</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>2</mn><mo>×</mo><mn>144</mn></mrow><mrow><mn>25</mn></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>a</mi><mo>=</mo><mfrac><mrow><mn>12</mn><msqrt><mn>2</mn></msqrt></mrow><mn>5</mn></mfrac><mo>⇒</mo><mi>P</mi><mi>Q</mi><mo>=</mo><mfrac><mn>24</mn><mn>5</mn></mfrac></math></p><p>Hence, the area of the square<math><mo>=</mo><mfrac><mrow><mn>576</mn></mrow><mrow><mn>25</mn></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
