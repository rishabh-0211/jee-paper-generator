e": null, "isCorrect": false}, {"id": "2oROr", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ZNdV2", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "DPtTI", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of the tangent to the parabola <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>y</mi></math> having slope <math><mi>m</mi></math> is <math><mi>x</mi><mo>=</mo><mfrac><mrow><mi>y</mi></mrow><mrow><mi>m</mi></mrow></mfrac><mo>+</mo><mi>m</mi></math><br />This tangent passes through <math><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mi></mi><mn>1</mn></mrow></mfenced><mo>.</mo></math> So,<br /><math><mn>4</mn><mo>=</mo><mi>m</mi><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>m</mi></mrow></mfrac></math> or <math><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><mi>m</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math><br />Now, angle between the tangents is given by<br /><math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>1</mn><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></mrow></mfenced></math><br /><math><mo>=</mo><mfrac><mrow><msqrt><msup><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub></msqrt></mrow><mrow><mn>1</mn><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><msqrt><mn>16</mn><mo>-</mo><mn>4</mn></msqrt></mrow><mrow><mn>1</mn><mo>+</mo><mn>1</mn></mrow></mfrac><mo>=</mo><msqrt><mn>3</mn></msqrt></math><br />or <math><mi>θ</mi><mo>=</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863983bc3e41b5a3e32", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "109", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The tangent to the parabola <math><mi>y</mi><mo>=</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>+</mo><mn>8</mn></math> at <math><mi>P</mi><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mi></mi><mn>8</mn></mrow></mfenced></math> touches the circle <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>18</mn><mi>x</mi><mo>+</mo><mn>14</mn><mi>y</mi><mo>+</mo><mi>λ</mi><mo>=</mo><mn>0</mn></math> at <math><mi>Q</mi><mo>.</mo></math>&nbsp;The coordinates of point <math><mi>Q</mi></math>&nbsp;are", "image": null}, "options": [{"id": "X9fA6", "text": "<math><mfenced separators=\"|\"><mrow><mo>-</mo><mn>7</mn><mo>,</mo><mi></mi><mo>-</mo><mn>12</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "MeZxB", "text": "<math><mfenced separators=\"|\"><mrow><mo>-</mo><mn>9</mn><mo>,</mo><mi></mi><mo>-</mo><mn>13</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "YtOLY", "text": "<math><mfenced separators=\"|\"><mrow><mo>-</mo><mn>11</mn><mo>,</mo><mi></mi><mo>-</mo><mn>16</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "oh1zj", "text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mn>31</mn><mn>5</mn></mfrac><mo>,</mo><mo>-</mo><mfrac><mn>42</mn><mn>5</mn></mfrac></mrow></mfenced></math></p>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The equation of the tangent at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>&nbsp;</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>8</mn></mrow></mfenced></math>&nbsp;to the parabola is</p><p><math><mfrac><mrow><mi>y</mi><mo>+</mo><mn>8</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>2</mn><mi>x</mi><mo>-</mo><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mn>2</mn></mrow></mfenced><mo>+</mo><mn>8</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>2</mn><mi>x</mi><mo>-</mo><mi>y</mi><mo>+</mo><mn>4</mn><mo>=</mo><mn>0</mn><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo></math>&nbsp;</p><p>So, the slope of the normal to the circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math><br />The equation of normal to the circle at <math><mi>Q</mi></math> will be</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>+</mo><mn>7</mn><mo>=</mo><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mi>x</mi><mo>+</mo><mn>9</mn></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>23</mn><mo>=</mo><mn>0</mn><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>ii</mi><mo>)</mo></math><br />The point <math><mi>Q</mi></math> is the intersection of the&nbsp;tangent at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;and the normal at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math></p><p>On solving the equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo><mo>&nbsp;</mo><mo>&amp;</mo><mo>&nbsp;</mo><mo>(</mo><mi>ii</mi><mo>)</mo></math>, we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mn>2</mn><mfenced><mrow><mn>2</mn><mi>x</mi><mo>+</mo><mn>4</mn></mrow></mfenced><mo>+</mo><mn>23</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>5</mn><mi>x</mi><mo>=</mo><mo>-</mo><mn>31</mn><mo>⇒</mo><mi>x</mi><mo>=</mo><mo>-</mo><mfrac><mn>31</mn><mn>5</mn></mfrac></math></p><p>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>2</mn><mfenced><mrow><mo>-</mo><mfrac><mn>31</mn><mn>5</mn></mfrac></mrow></mfenced><mo>+</mo><mn>4</mn><mo>=</mo><mo>-</mo><mfrac><mn>42</mn><mn>5</mn></mfrac></math></p><p>Hence, the coordinates of the point&nbsp;<math><mi>Q</mi></math>&nbsp;are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mn>31</mn><mn>5</mn></mfrac><mo>,</mo><mo>-</mo><mfrac><mn>42</mn><mn>5</mn></mfrac></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638f3a8927d20d9e75", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "21", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The parabolas <math><msub><mrow><mi>C</mi></mrow><mrow><mn>1</mn></mrow></msub><mi mathvariant=\"normal\"></mi><mo>:</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>a</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mi>a</mi></mrow></mfenced></math> and <math><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\"></mi><mo>:</mo><mi mathvariant=\"normal\"></mi><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mo>-</mo><mn>4</mn><mi>a</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mi>k</mi></mrow></mfenced></math> intersect at two distinct points <math><mi>A</mi></math> and <math><mi>B</mi><mo>.</mo></math> If the slope of the tangent at <math><mi>A</mi></math> on <math><msub><mrow><mi>C</mi></mrow><mrow><mn>1</mn></mrow></msub></math> is same as the slope of the normal at <math><mi>B</mi></math> on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>2</mn></msub></math>&nbsp;, then the value of k&nbsp;is equal to", "image": null}, "options": [{"id": "5eNOm", "text": "<math><mn>3</mn><mi>a</mi></math>", "image": null, "isCorrect": true}, {"id": "UiD2o", "text": "<math><mn>2</mn><mi>a</mi></math>", "image": null, "isCorrect": false}, {"id": "oGyUQ", "text": "<math><mi>a</mi></math>", "image": null, "isCorrect": false}, {"id": "JEsZv", "text": "<math><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>,</mo><mi>q</mi></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>B</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>,</mo><mo>-</mo><mi>q</mi></mrow></mfenced></math><br />Now <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>q</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>a</mi><mfenced separators=\"|\"><mrow><mi>p</mi><mo>-</mo><mi>a</mi></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msup><mi>q</mi><mn>2</mn></msup><mo>=</mo><mo>-</mo><mn>4</mn><mi>a</mi><mfenced separators=\"|\"><mrow><mi>p</mi><mo>-</mo><mi>k</mi></mrow></mfenced></math> &hellip;(i)<br /><math><mo>&#8658;</mo><mi mathvariant=\"normal\"></mi><mi>p</mi><mo>-</mo><mi>a</mi><mo>=</mo><mo>-</mo><mi>p</mi><mo>+</mo><mi>k</mi><mo>&#8658;</mo><mi>p</mi><mo>=</mo><mfrac><mrow><mi>a</mi><mo>+</mo><mi>k</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math> &hellip;(ii)<br />Now for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>C</mi><mn>1</mn></msub><mo>,</mo><mo>&#160;</mo><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mi>y</mi></mfrac></math><br /><math><msub><mrow><mfenced close=\"]\" open=\"\" separators=\"|\"><mrow><mfrac><mrow><mi>d</mi><mi>y</mi></mrow><mrow><mi>d</mi><mi>x</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mfenced separators=\"|\"><mrow><mi>p</mi><mo>,</mo><mi>q</mi></mrow></mfenced></mrow></msub><mo>=</mo><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mrow><mi>q</mi></mrow></mfrac></math> &amp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mfenced open=\"\" close=\"]\" separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mi>d</mi><mi>x</mi></mrow><mrow><mi>d</mi><mi>y</mi></mrow></mfrac></mrow></mfenced><mfenced separators=\"|\"><mrow><mi>p</mi><mo>,</mo><mo>-</mo><mi>q</mi></mrow></mfenced></msub><mo>=</mo><mfrac><mi>q</mi><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></math><br /><math><mo>&#8658;</mo></math> <math><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mrow><mi>q</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>q</mi></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac><mo>&#8658;</mo><msup><mrow><mi>q</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></math> &hellip; (iii)<br />Putting values from (ii)&nbsp;&amp; (iii)&nbsp;in equation (i), we get,<br /><math><mn>4</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>a</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>a</mi><mo>+</mo><mi>k</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>-</mo><mi>a</mi></mrow></mfenced></math> <math><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mfrac><mrow><mi>k</mi><mo>-</mo><mi>a</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#8658;</mo><mi>k</mi><mo>=</mo><mn>3</mn><mi>a</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86386c6f3b949a33108", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "28", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Tangents to the parabola&nbsp;<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>x</mi></math> at <math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>a</mi><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mn>2</mn><mi>a</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math> and <math><mi>Q</mi><mfenced separators=\"|\"><mrow><mi>a</mi><msubsup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mn>2</mn><mi>a</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math> meet at <math><mi>T</mi><mo>.</mo></math> If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>△</mo><mi>P</mi><mi>T</mi><mi>Q</mi></math> is right-angled at <math><mi>T</mi><mo>,</mo></math> then <math><mfrac><mrow><mn>1< o></math>&nbsp;</p><p>So, the slope of the normal to the circle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math><br />The equation of normal to the circle at <math><mi>Q</mi></math> will be</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>+</mo><mn>7</mn><mo>=</mo><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mi>x</mi><mo>+</mo><mn>9</mn></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mn>2</mn><mi>y</mi><mo>+</mo><mn>23</mn><mo>=</mo><mn>0</mn><mo>&nbsp;</mo><mo>&nbsp;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>(</mo><mi>ii</mi><mo>)</mo></math><br />The point <math><mi>Q</mi></math> is the intersection of the&nbsp;tangent at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;and the normal at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math></p><p>On solving the equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi mathvariant=\"normal\">i</mi><mo>)</mo><mo>&nbsp;</mo><mo>&amp;</mo><mo>&nbsp;</mo><mo>(</mo><mi>ii</mi><mo>)</mo></math>, we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>+</mo><mn>2</mn><mfenced><mrow><mn>2</mn><mi>x</mi><mo>+</mo><mn>4</mn></mrow></mfenced><mo>+</mo><mn>23</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mn>5</mn><mi>x</mi><mo>=</mo><mo>-</mo><mn>31</mn><mo>⇒</mo><mi>x</mi><mo>=</mo><mo>-</mo><mfrac><mn>31</mn><mn>5</mn></mfrac></math></p><p>and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mn>2</mn><mfenced><mrow><mo>-</mo><mfrac><mn>31</mn><mn>5</mn></mfrac></mrow></mfenced><mo>+</mo><mn>4</mn><mo>=</mo><mo>-</mo><mfrac><mn>42</mn><mn>5</mn></mfrac></math></p><p>Hence, the coordinates of the point&nbsp;<math><mi>Q</mi></math>&nbsp;are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced se sup><mo>=</mo><mn>4</mn><mi>a</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>&#8211;</mo><mi>k</mi></mrow></mfenced></math> and <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>a</mi><mfenced separators=\"|\"><mrow><mi>y</mi><mo>&#8211;</mo><mi>k</mi></mrow></mfenced></math> touche each other at line <math><mi>y</mi><mo>=</mo><mi>x</mi></math>&nbsp;<br />(<math><mo>&#8757;</mo></math> both parabola are inverse of each other)<br /><math><mo>&#8658;</mo></math> <math><mi>y</mi><mo>=</mo><mi>x</mi></math> is a common tangent at <math><mi>P</mi></math><br /><math><mo>&#8658;</mo></math> we get point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> by solving <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>a</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>&#8211;</mo><mi>k</mi></mrow></mfenced></math> and <math><mi>y</mi><mo>=</mo><mi>x</mi></math><br /><math><mo>&#8658;</mo></math> point of contact <math><mi>P</mi></math> is <math><mfenced separators=\"|\"><mrow><mn>2</mn><mi>a</mi><mo>,</mo><mi></mi><mn>2</mn><mi>a</mi></mrow></mfenced></math><br /><math><mo>&#8658;</mo></math> equation of normal at <math><mi>P</mi><mfenced separators=\"|\"><mrow><mn>2</mn><mi>a</mi><mo>,</mo><mn>2</mn><mi>a</mi></mrow></mfenced></math> is <math><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>4</mn><mi>a</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863133b9bd3ddd178dd", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "85", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The point of intersection of the tangent to the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> which also touches <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math> is", "image": null}, "options": [{"id": "DL72J", "text": "<math><mfenced separators=\"|\"><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "36Kq0", "text": "<math><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "rs81c", "text": "<math><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "1n10X", "text": "<math><mfenced separators=\"|\"><mrow><mfrac><mrow><mo>-</mo><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of the tangent to the parabola is <math><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>m</mi></mrow></mfrac></math><br />Equation of the tangent to the circle is <math><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>&#177;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac><msqrt><mn>1</mn><mo>+</mo><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br />For common tangent<br /><math><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mo>&#8658;</mo><msup><mrow><mi>m</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>+</mo><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mo>=</mo><mn>0</mn><mo>&#8658;</mo><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>1</mn><mo>&#8658;</mo><mi>m</mi><mo>=</mo><mo>&#177;</mo><mn>1</mn></math><br /><math><mo>&#8658;</mo></math>&nbsp;Equation of the tangents are <math><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><mn>1</mn></math> and <math><mi>y</mi><mo>=</mo><mo>-</mo><mi>x</mi><mo>-</mo><mn>1</mn></math><br /><math><mo>&#8658;</mo></math> Point of intersection of these tangents is <math><mfenced separators=\"|\"><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "6aa3ab79aa8dc1ff68177fd6", "title": "Normal to Parabola", "totalQuestions": 28, "questions": [{"_id": "6151e863fb973b74dcd27baa", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The shortest distance of <math><mfenced separators=\"|\"><mrow><mn>0,3</mn></mrow></mfenced></math> from the parabola <math><mi>y</mi><mo>=</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></math> is", "image": null}, "options": [{"id": "CWB51", "text": "<math><msqrt><mn>3</mn></msqrt></math> units", "image": null, "isCorrect": false}, {"id": "mxT2X", "text": "<math><mfrac><mrow><msqrt><mn>11</mn></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac></math> units", "image": null, "isCorrect": true}, {"id": "F7qF7", "text": "<math><mfrac><mrow><msqrt><mn>10</mn></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac></math> units", "image": null, "isCorrect": false}, {"id": "KuQbC", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math> units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Any point on the parabola is&nbsp;<math><mfenced separators=\"|\"><mrow><mi>x</mi><mo>,</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></math><br />Distance between <math><mo>(</mo><mi>x</mi><mo>,</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>)</mo></math> and <math><mo>(</mo><mn>0,3</mn><mo>)</mo></math> is<br /><math><mi>D</mi><mo>=</mo><msqrt><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>3</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt></math><br /><math><msup><mrow><mi>D</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>3</mn><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math> is minimum if<br /><math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>0</mn></math><br />Hence,&nbsp;<math><msub><mrow><mi>D</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><msqrt><mfrac><mrow><mn>11</mn></mrow><mrow><mn>4</mn></mrow></mfrac></msqrt><mo>=</mo><mfrac><mrow><msqrt><mn>11</mn></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac></math>&nbsp;units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f9ab07b8183a30ee", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "78", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The equation of a straight line passing through the point <math><mfenced separators=\"|\"><mrow><mn>3</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>6</mn></mrow></mfenced></math> and normal to the curve <math><mi>y</mi><mo>=</mo><msqrt><mi>x</mi></msqrt></math> is", "image": null}, "options": [{"id": "B0tWS", "text": "<math><mn>4</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>-</mo><mn>18</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "I7otO", "text": "<math><mi>x</mi><mo>+</mo><mi>y</mi><mo>-</mo><mn>9</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "8CLRS", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mi>x</mi><mo>-</mo><mi>y</mi><mo>-</mo><mn>6</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "BvDpu", "text": "<math><mi>x</mi><mo>-</mo><mi>y</mi><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/dd4ab0c6-0425-473c-997e-088e2f7a504f.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.92708in;height:1.59375in\" /></p><p>Normal to the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>x</mi></math> is<br /><math><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>-</mo><mfrac><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><msup><mrow><mi>m</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow><mrow><mn>4</mn></mrow></mfrac></math>&nbsp;</p><p>Since, it passes through the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mn>3</mn><mo>,</mo><mn>6</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mi>m</mi><mn>3</mn></msup><mo>-</mo><mn>10</mn><mi>m</mi><mo>+</mo><mn>24</mn><mo>=</mo><mn>0</mn><mo>;</mo><mo>&nbsp;</mo><mi>m</mi><mo>=</mo><mo>-</mo><mn>4</mn></math> is a root<br />Hence, the required equation is&nbsp;<math><mn>4</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>-</mo><mn>18</mn><mo>=</mo><mn>0</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e3cd455c91ba52da", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "31", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">A</mi><mn>1</mn></msub><mo>,</mo><mo>&nbsp;</mo><msub><mi mathvariant=\"normal\">A</mi><mn>2</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">A</mi><mn>3</mn></msub></math> lie on the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>8</mn><mi>x</mi><mo>.</mo></math> If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>△</mo><msub><mi mathvariant=\"normal\">A</mi><mn>1</mn></msub><msub><mi mathvariant=\"normal\">A</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">A</mi><mn>3</mn></msub></math> is an equilateral triangle and normals at points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">A</mi><mn>1</mn></msub><mo>,</mo><mo>&nbsp;</mo><msub><mi mathvariant=\"normal\">A</mi><mn>2</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">A</mi><mn>3</mn></msub></math> on this parabola meet at the point <math><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math>, then the value of&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;is", "image": null}, "options": [{"id": "PYsEl", "text": "<math><mn>24</mn></math>", "image": null, "isCorrect": false}, {"id": "6pBcQ", "text": "<math><mn>26</mn></math>", "image": null, "isCorrect": false}, {"id": "Lcny2", "text": "<math><mn>38</mn></math>", "image": null, "isCorrect": false}, {"id": "FBYc6", "text": "<math><mn>28</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/c0110eee-03de-4d76-8cfe-c230ca2b6d0c.png\" style=\"width:2.72708in;height:1.51319in\" /><br />One of the normal from <math><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math> on the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>8</mn><mi>x</mi></math> is <math><mi>y</mi><mo>=</mo><mn>0</mn></math><br />hence, assume <math><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>0</mn></mrow></mfenced></math><br />Let,&nbsp;<math><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mi></mi><mn>4</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math><br />and <math><msub ub></mrow></mfrac></mrow></mfenced></math> and <math><mi>k</mi><mo>=</mo><mfrac><mrow><mo>-</mo><mn>2</mn><mi>a</mi></mrow><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>.</mo></math> [Using (i)]<br /><math><mo>&#8658;</mo><mi>h</mi><mo>=</mo><mo>-</mo><mi>a</mi><mfenced separators=\"|\"><mrow><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><mn>2</mn></mrow></mfenced></math> and <math><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfrac><mrow><mo>-</mo><mn>2</mn><mi>a</mi></mrow><mrow><mi>k</mi></mrow></mfrac></math><br /><math><mo>&#8658;</mo><mi>h</mi><mo>=</mo><mo>-</mo><mi>a</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>4</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>+</mo><mn>2</mn></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mi>h</mi><mo>+</mo><mn>2</mn><mi>a</mi></mrow></mfenced><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mo>-</mo><mn>4</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>3</mn></mrow></msup></math><br />Hence, the locus of <math><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></math> is<br /><math><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mn>2</mn><mi>a</mi></mrow></mfenced><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mo>-</mo><mn>4</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>3</mn></mrow></msup></math><br />or <math><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mn>2</mn><mi>a</mi></mrow></mfenced><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mn>0</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalSt idth: 374px; height: 150px;\" /></p><p><math><mi>P</mi></math> is one of the end points of the latus rectum.</p><p>So,&nbsp;<math><mi>Q</mi></math> lies on the directrix.<br />Hence,&nbsp;<math><mi>R</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mo>-</mo><mn>4</mn></mrow></mfenced><mo>.</mo></math><br />Equation of the normal at <math><mi>R</mi></math> is <math><mi>y</mi><mo>=</mo><mi>x</mi><mo>-</mo><mn>6</mn></math><br /><math><mo>⇒</mo><mi>S</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>18</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>12</mn></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ae9508d09a5eb98d", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "41", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the normals at two points <math><mi>P</mi></math> and <math><mi>Q</mi></math> of a parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> intersect at a third point <math><mi>R</mi></math> on the parabola&nbsp;<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math>, then the product of the ordinates of <math><mi>P</mi></math> and <math><mi>Q</mi></math> is equal to", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "<p>Let,&nbsp;<math><mi>P</mi><mo>=</mo><mfenced separators=\"|\"><mrow><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mn>2</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math>,&nbsp;<m /mn></mrow></msup><mo>=</mo><mo>-</mo><mn>3</mn><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math><mo>&#8658;</mo><mi>m</mi><mfenced separators=\"|\"><mrow><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>3</mn><mi>m</mi><mo>+</mo><mn>2</mn></mrow></mfenced><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mi>m</mi><mo>=</mo><mo>-</mo><mn>1</mn><mo>,</mo><mi></mi><mo>-</mo><mn>2</mn></math> (<math><mi>m</mi><mo>=</mo><mn>0</mn></math> is rejected)</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86378becd31daac482b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The normal to the parabola <math> <mrow> <msup> <mi>y</mi> <mn>2</mn> </msup> <mo>=</mo><mn>8</mn><mi>x</mi></mrow> </math> at the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>2</mn><mo>,</mo><mn>4</mn><mo>)</mo></math> meets the parabola again at the point", "image": null}, "options": [{"id": "k4DqG", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#8211;</mo><mn>18</mn><mo>,</mo><mo>&#8211;</mo><mn>12</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "8h9sl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>&#8211;</mo><mn>18</mn><mo>,</mo><mn>12</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "4e55U", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>18</mn><mo>,</mo><mn>12</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "ViNKX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>18</mn><mo>,</mo><mo>-</mo><mn>12</mn></mrow></mfenced></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>We have,&nbsp;<math> <mrow> <msub> <mi>t</mi> <mn>2</mn> </msub> <mo>=</mo><mo>&#8722;</mo><msub> <mi>t</mi> <mn>1</mn> </msub> <mo>&#8722;</mo><mfrac> <mn>2</mn> <mrow> <msub> <mi>t</mi> <mn>1</mn> </msub> </mrow> </mfrac> </mrow> </math></p><p>Since <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>2</mn><mo>,</mo><mo>&#160;</mo><msub><mi>t</mi><mn>1</mn></msub><mo>=</mo><mn>1</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mi>t</mi><mn>2</mn></msub><mo>=</mo><mo>&#8722;</mo><mn>3</mn></math><br />Hence, the other end will be <math> <mrow> <mo stretchy=\"false\">(</mo><mi>a</mi><msubsup> <mi>t</mi> <mn>2</mn> <mn>2</mn> </msubsup> <mo>,</mo><mtext> </mtext><mn>2</mn><mi>a</mi><msub> <mi>t</mi> <mn>2</mn> </msub> <mo stretchy=\"false\">)</mo></mrow> </math>&nbsp;i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>18</mn><mo>,</mo><mo>-</mo><mn>12</mn><mo>)</mo><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637707a0234755527a", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "91", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the normals of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> drawn at the end points of its latus rectum are tangents to the circle&nbsp;<math><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mo>+</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></math>, then the value of <math><msup><mrow><mi>r</mi></mrow><mrow><mn>4</mn></mrow></msup></math> is equal to", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<p>End points of the latus rectum of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> and <math><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi></mi><mo>&#177;</mo><mn>2</mn></mrow></mfenced><mo>.</mo></math><br />Equation of the normals at points <math><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mo>&#177;</mo><mn>2</mn></mrow></mfenced></math> are<br /><math><mi>y</mi><mo>=</mo><mo>-</mo><mi>x</mi><mo>+</mo><mn>3</mn></math> and <math><mi>y</mi><mo>=</mo><mi>x</mi><mo>-</mo><mn>3</mn></math><br />rr <math><mi>x</mi><mo>+</mo><mi>y</mi><mo>-</mo><mn>3</mn><mo>=</mo><mn>0</mn></math> and <math><mi>x</mi><mo>-</mo><mi>y</mi><mo>-</mo><mn>3</mn><mo>=</mo><mn>0</mn></math><br />These lines are tangent to the circle&nbsp;<math><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mo>+</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mfenced open=\"|\" close=\"|\" separators=\"|\"><mfrac><mrow><mn>3</mn><mo>&#177;</mo><mn>2</mn><mo>-</mo><mn>3</mn></mrow><msqrt><mn>1</mn><mo>+</mo><mn>1</mn></msqrt></mfrac></mfenced><mo>=</mo><mi>r</mi><mo>=</mo><msqrt><mn>2</mn></msqrt></math>&nbsp;</p><p>Hence,&nbsp;<math><msup><mrow><mi>r</mi></mrow><mrow><mn>4</mn></mrow></msup><mo>=</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635cc18815a507eb17", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "53", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A tangent and a normal are drawn at the point <math><mi>P</mi><mfenced separators=\"|\"><mrow><mn>8,8</mn></mrow></mfenced></math> on the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>8</mn><mi>x</mi></math> which cuts the axis of the parabola at the points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> respectively. If the centre of the circle through <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>,</mo><mo>&nbsp;</mo><mi>A</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi></math>, then the sum of <math><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">∠</mi><mi>P</mi><mi>C</mi><mi>B</mi></mrow></mfenced></math> and <math><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">∠</mi><mi>P</mi><mi>C</mi><mi>B</mi></mrow></mfenced></math> is equal to", "image": null}, "options": [], "correctValue": "1.55", "solution": {"text": "Let,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mn>2</mn><msup><mi>t</mi><mn>2</mn></msup><mo>,</mo><mn>4</mn><mi>t</mi></mrow></mfenced><mo>=</mo><mfenced separators=\"|\"><mn>8,8</mn></mfenced><mo>=</mo><mi>P</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>t</mi><mo>=</mo><mn>2</mn></math><br />Equation of the tangent at <math><mfenced separators=\"|\"><mrow><mn>8,8</mn></mrow></mfenced></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><mn>8</mn></math><br />Equation of the normal at <math><mfenced separators=\"|\"><mrow><mn>8,8</mn></mrow></mfenced></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mo>-</mo><mn>2</mn><mi>x</mi><mo>+</mo><mn>24</mn></math><br />{Tangent &amp; normal at <math><mfenced separators=\"|\"><mrow><mi>a</mi><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>,</mo><mn>2</mn><mi>a</mi><mi>t</mi></mrow></mfenced></math>&nbsp;are&nbsp;<math><mi>t</mi><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><mi>a</mi><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></math> &amp; <math><mi>y</mi><mo>=</mo><mo>-</mo><mi>t</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>a</mi><mi>t</mi><mo>+</mo><mi>a</mi><msup><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msup></math> }<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi>A</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>8</mn><mo>,0</mo></mrow></mfenced></math> &amp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>12</mn><mo>,0</mo></mrow></mfenced></math><br />Because&nbsp;<math><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mi>A</mi><mi>B</mi></math> is a right-angled triangle<br />Hence, the centre of the circumcircle is the mid-point of the hypotenuse <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,0</mo></mrow></mfenced></math><br />The slope of line <math><mi>P</mi><mi>C</mi></math> is <math><mfrac><mrow><mn>8</mn><mo>-</mo><mn>0</mn></mrow><mrow><mn>8</mn><mo>-</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">∠</mi><mi>P</mi><mi>C</mi><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>,</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">∠</mi><mi>P</mi><mi>C</mi><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mn>4</mn><mn>5</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">t</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">∠</mi><mi>P</mi><mi>C</mi><mi>B</mi></mrow></mfenced><mo>+</mo><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">∠</mi><mi>P</mi><mi>C</mi><mi>B</mi></mrow></mfenced><mo>=</mo><mn>0</mn><mo>.</mo><mn>75</mn><mo>+</mo><mn>0</mn><mo>.</mo><mn>8</mn><mo>=</mo><mn>1.5</mn><mn>5</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635b71a54f513d6e86", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "79", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider a parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> with vertex at <math><mi>A</mi></math> and focus at <math><mi>S</mi><mo>.</mo></math> <math><mi>P</mi><mi>Q</mi></math> is a chord of the parabola which is normal at point <math><mi>P</mi><mo>.</mo></math> If the abscissa and the ordinate of the point <math><mi>P</mi></math> are equal, then the square of the length of the diameter of the circumcircle of triangle <math><mi>P</mi><mi>S</mi><mi>Q</mi></math> is", "image": null}, "options": [], "correctValue": "125", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/8ad2ad65-d459-428c-82c9-3e80ede44fac.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:3.12014in;height:1.80694in\" /></p><p><math><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mn>2</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mi>t</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msub><mi>t</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>3</mn></math><br />So, <math><mi>P</mi><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mi></mi><mn>4</mn></mrow></mfenced></math>&nbsp;and <math><mi>Q</mi><mfenced separators=\"|\"><mrow><mn>9</mn><mo>,</mo><mo>-</mo><mn>6</mn></mrow></mfenced></math><br />Slope of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>S</mi><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math></p><p>Slope of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mi>S</mi><mo>=</mo><mo>-</mo><mfrac><mn>6</mn><mn>8</mn></mfrac><mo>=</mo><mo>-</mo><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mi>S</mi><mo>&#8869;</mo><mi>Q</mi><mi>S</mi></math><br /><math><mo>&#8756;</mo><mi>P</mi><mi>Q</mi></math> is the diameter of the circle passing through <math><mi>P</mi><mo>,</mo><mi>S</mi><mo>,</mo><mi></mi><mi>Q</mi><mo>.</mo></math><br />Hence, the length of the diameter <math><mo>=</mo><msqrt><mn>25</mn><mo>+</mo><mn>100</mn></msqrt><mo>=</mo><msqrt><mn>125</mn></msqrt></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;square of the length of the diameter<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>125</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86352318703b9d7ee25", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "95", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the normals at two points <math><mfenced separators=\"|\"><mrow><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo><mi></mi><msub><mrow><mi>y</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>,</mo><msub><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math> of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> meets again on the parabola, where <math><msub><mrow><mi> <mi>t</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn></math></p><p>On solving, we get,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced separators=\"|\"><mrow><msub><mi>t</mi><mn>1</mn></msub><mo>-</mo><msub><mi>t</mi><mn>2</mn></msub></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>4</mn><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mfenced open=\"|\" close=\"|\" separators=\"|\"><mrow><msub><mi>t</mi><mn>1</mn></msub><mo>-</mo><msub><mi>t</mi><mn>2</mn></msub></mrow></mfenced><mo>=</mo><mn>2</mn><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mfenced open=\"|\" close=\"|\" separators=\"|\"><mrow><msub><mi>y</mi><mn>1</mn></msub><mo>-</mo><msub><mi>y</mi><mn>2</mn></msub></mrow></mfenced><mo>=</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86347dece1c6b065ee9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "61", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The ordinates of the points <math><mi>P</mi></math> and <math><mi>Q</mi></math> on the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>12</mn><mi>x</mi></math> are in the ratio <math><mn>1</mn><mo>:</mo><mn>2</mn><mo>.</mo></math> The locus of the point of intersection of the normals to the parabola at <math><mi>P</mi><mi></mi></math> and <math><mi>Q</mi></math> is&nbsp;", "image": null}, "options": [{"id": "msPCB", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>12</mn></mrow><mrow><mn>343</mn></mrow></mfrac><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>6</mn></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "scOcj", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>12</mn></mrow><mrow><mn>343</mn></mrow></mfrac><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mn>6</mn></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "EZH1R", "text": "<math><msup><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>6</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>12</mn><mi>x</mi></mrow><mrow><mn>343</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "9g1WF", "text": "<math><msup><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mo>+</mo><mn>6</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>12</mn><mi>x</mi></mrow><mrow><mn>343</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, <math><mi>a</mi><mo>=</mo><mn>3</mn><mo>.</mo></math> So, let <math><mi>P</mi><mfenced separators=\"|\"><mrow><mn>3</mn><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mn>6</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math> and <math><mi>Q</mi><mfenced separators=\"|\"><mrow><mn>3</mn><msubsup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mn>6</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math> be two points on the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>12</mn><mi>x</mi><mo>.</mo></math> Then,<br /><math><mfrac><mrow><mn>6</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>6</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></ {"id": "MgE1d", "text": "<math><mn>5</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mn>115</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "3mvUQ", "text": "<math><mn>5</mn><mi>x</mi><mo>-</mo><mi>y</mi><mo>-</mo><mn>115</mn><mi>a</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi>a</mi><msubsup><mi>t</mi><mn>1</mn><mn>2</mn></msubsup><mo>,</mo><mn>2</mn><mi>a</mi><msub><mi>t</mi><mn>1</mn></msub></mrow></mfenced><mo>,</mo><mo>&nbsp;</mo><mi>B</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi>a</mi><msubsup><mi>t</mi><mn>2</mn><mn>2</mn></msubsup><mo>,</mo><mn>2</mn><mi>a</mi><msub><mi>t</mi><mn>2</mn></msub></mrow></mfenced></math><br />and the foot of the required normal is <math><mfenced separators=\"|\"><mrow><mi>a</mi><msubsup><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mn>2</mn><mi>a</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfenced></math>, then<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>a</mi><msub><mi>t</mi><mn>1</mn></msub><mo>=</mo><mo>-</mo><mn>4</mn><mi>a</mi><mo>,</mo><mo>&nbsp;</mo><mn>2</mn><mi>a</mi><msub><mi>t</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>6</mn><mi>a</mi></math> and <math><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>t</mi><mn>1</mn></msub><mo>=</mo><mo>-</mo><mn>2</mn><mo>,</mo><mo>&nbsp;</mo><msub><mi>t</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>3</mn></math> and&nbsp;<math><mo>-</mo><mn>2</mn><mo>-</mo><mn>3</mn><mo>+</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mn>0</mn></math><br /><math><mo>⇒</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mn>5</mn></math><br />Hence, the equation of the required normal is <math><mi>y</mi><mo>=</mo><mo>-</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msub><mi>x</mi><mo>+</mo><mn>2</mn><mi>a</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>+</mo><mi>a</mi><msubsup><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math><br /><math><mo>⇒</mo><mi>y</mi><mo>=</mo><mo>-</mo><mn>5</mn><mi>x</mi><mo>+</mo><mn>10</mn><mi>a</mi><mo>+</mo><mn>125</mn><mi>a</mi></math><br /><math><mo>⇒</mo><mi>y</mi><mo>+</mo><mn>5</mn><mi>x</mi><mo>-</mo><mn>135</mn><mi>a</mi><mo>=</mo><mn>0</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863218742cd53e618a2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The normal to the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> at <math><mi>P</mi><mfenced separators=\"|\"><mrow><mn>9</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>6</mn></mrow></mfenced></math> meets the parabola again at <math><mi>Q</mi><mo>.</mo></math> If the tangent at <math><mi>Q</mi></math> meets the directrix at <math><mi>R</mi><mo>,</mo></math> then the slope of another tangent drawn from point <math><mi>R</mi></math> to this parabola is", "image": null}, "options": [{"id": "udV31", "text": "<math><mn>11</mn></math>", "image": null, "isCorrect": false}, {"id": "C1ntz", "text": "<math><mfrac><mrow><mn>11</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "55lac", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>11</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "cjcNa", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Parameter corresponding to <math><mi>P</mi></math> is <math><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>3</mn></math><br />Hence, the parameter corresponding to <math><mi>Q</mi></math> is <math><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>-</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mo>-</mo><mn>3</mn><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mn>11</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math></p><p>Let,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mfenced><msub><mi>t</mi><mn>3</mn></msub></mfenced></math>&nbsp;be the point where another tangent from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;touches the parabola<br />Now, if the tangent at <math><mi>Q</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math> and <math><mi>S</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfenced></math> meet on the directrix at <math><mi>R</mi></math> then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>t</mi><mn>2</mn></msub><msub><mi>t</mi><mn>3</mn></msub><mo>=</mo><mo>-</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>t</mi><mn>3</mn></msub><mo>=</mo><mfrac><mn>3</mn><mn>11</mn></mfrac></math></p><p>So the equa
