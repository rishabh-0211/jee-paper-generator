eparators=\"|\"><mrow><mn>2</mn></mrow></mfenced><mo>+</mo><mn>2</mn><mo>-</mo><mn>0</mn></mrow></mfenced></mrow><mrow><msqrt><msup><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>1</mn></msqrt></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>12</mn></mrow><mrow><msqrt><mn>5</mn></msqrt></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>1</mn><mi mathvariant=\"normal\">K</mi></mfrac><mo>=</mo><mfrac><mn>12</mn><msqrt><mn>5</mn></msqrt></mfrac><mo>&#8658;</mo><mi mathvariant=\"normal\">K</mi><mo>=</mo><mfrac><msqrt><mn>5</mn></msqrt><mn>12</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "6aa3ab79aa8dc1ff68177fda", "title": "Standard Equation of Parabola", "totalQuestions": 27, "questions": [{"_id": "6151e863fc62ad488a85c1f9", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "57", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>e</mi></math> and <math><mi>l</mi></math> are the eccentricity and length of the lactus rectum respectively of the conic described parametrically by <math><mi>x</mi><mo>=</mo><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mi>t</mi><mo>+</mo><mn>1</mn><mo>,</mo><mi>y</mi><mo>=</mo><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi>t</mi><mo>+</mo><mn>1</mn><mo>,</mo></math> then the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>e</mi><msup><mi>l</mi><mn>2</mn></msup></mfrac></math> is equal to", "image": null}, "options": [], "correctValue": "0.5", "solution": {"text": "<math><mfrac><mrow><mi>x</mi><mo>+</mo><mi>y</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>1</mn></math>&nbsp;and&nbsp;<math><mfrac><mrow><mi>x</mi><mo>-</mo><mi>y</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mi>t</mi></math><br /><math><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>x</mi><mo>+</mo><mi>y</mi><mo>-</mo><mn>2</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>x</mi><mo>-</mo><mi>y</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math><mo>&#8658;</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>x</mi><mo>-</mo><mi>y</mi></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msqrt><mn>2</mn></msqrt><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>x</mi><mo>+</mo><mi>y</mi><mo>-</mo><mn>2</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></mrow></mfenced></math><br />Comparing it with <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>x</mi></math>, we get,&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>=</mo><msqrt><mn>2</mn></msqrt></math> and <math><mi>e</mi><mo>=</mo><mn>1</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mi>e</mi><msup><mi>l</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>5</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863faef95a70712218b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let the focus <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>&nbsp;of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=8</mo><mi>x</mi></math> lies on the focal chord <math><mi>P</mi><mi>Q</mi></math> of the same parabola. If <math><mi>P</mi><mi>S</mi><mo>=</mo><mn>6</mn><mo>,</mo></math> then the square of the slope of the chord <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math>&nbsp;is", "image": null}, "options": [{"id": "ZoNLw", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><msqrt><mn>5</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "5TIyk", "text": "<math><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "dQ4Sa", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "80bVV", "text": "<math><mfrac><mrow><mn>9</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>S</mi><mo>,</mo><mo>&#160;</mo><mn>4</mn><mo>,</mo><mo>&#160;</mo><mi>S</mi><mi>Q</mi></math> are in <math><mi>H</mi><mo>.</mo><mi>P</mi><mo>.</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>1</mn><mn>6</mn></mfrac><mo>,</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>,</mo><mfrac><mn>1</mn><mrow><mi>S</mi><mi>Q</mi></mrow></mfrac></math> are in <math><mi>A</mi><mo>.</mo><mi>P</mi><mo>.</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>1</mn><mrow><mi>S</mi><mi>Q</mi></mrow></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>4</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>6</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#8658;</mo><mi>S</mi><mi>Q</mi><mo>=</mo><mn>3</mn></math><br /><math><mo>&#8658;</mo><mi>P</mi><mi>Q</mi><mo>=</mo><mn>6</mn><mo>+</mo><mn>3</mn><mo>=</mo><mn>9</mn><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>e</mi><msup><mrow><mi mathvariant=\"normal\">c</mi></mrow><mrow><mn>2</mn></mrow></msup><mi></mi><mi>&#952;</mi></math> (where,&nbsp;<math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow></math> is the slope of <math><mi>P</mi><mi>Q</mi></math> )<br /><math><mo>&#8658;</mo><mn>1</mn><mo>+</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>9</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>&#8658;</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><math><mo>&#8658;</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863fa70dadfb0ce6864", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The equation of parabola which cuts the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\"></mi><mi>b</mi><mi>x</mi></math> orthogonally having the same axis and length of latus rectum as&nbsp;<math><mn>8</mn><mi>b</mi></math>, is", "image": null}, "options": [{"id": "tgPqS", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mo>-</mo><mn>8</mn><mi>b</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>8</mn><mi>b</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "cePzD", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mo>-</mo><mn>8</mn><mi>b</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>4</mn><mi>b</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "BGr2N", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mo>-</mo><mn>8</mn><mi>b</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>32</mn><mi>b</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "NhQwc", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mo>-</mo><mn>8</mn><mi>b</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>3</mn><mi>b</mi></mrow></mfenced></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Focus of parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>b</mi><mi>x</mi><mi mathvariant=\"normal\"></mi></math> <em>is</em> <math><mi mathvariant=\"normal\"></mi><mfenced separators=\"|\"><mrow><mi>b</mi><mo>,</mo><mn>0</mn></mrow></mfenced></math><br />Focus of parabola in option <math><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></math> is <math><mfenced separators=\"|\"><mrow><mn>6</mn><mi></mi><mi>b</mi><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math><br />Focus of parabola in option <math><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced></math> is <math><mfenced separators=\"|\"><mrow><mn>2</mn><mi></mi><mi>b</mi><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math><br />Focus of parabola in option <math><mfenced separators=\"|\"><mrow><mi>C</mi></mrow></mfenced></math> is <math><mfenced separators=\"|\"><mrow><mn>30</mn><mi></mi><mi>b</mi><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math><br />Focus of parabola in option <math><mfenced separators=\"|\"><mrow><mi>D</mi></mrow></mfenced></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>b</mi><mo>,</mo><mn>0</mn></mrow></mfenced></math><br />Hence, option <math><mfenced separators=\"|\"><mrow><mi>D</mi></mrow></mfenced></math> is correct", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d6c90c5c2458aabe", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "59", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The length of the normal chord which subtends an angle of <math><msup><mrow><mn>9</mn><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> at the vertex of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> is", "image": null}, "options": [{"id": "IoKo3", "text": "<math><mn>6</mn><msqrt><mn>3</mn></msqrt></math> units", "image": null, "isCorrect": true}, {"id": "FQCFr", "text": "<math><mn>7</mn><msqrt><mn>2</mn></msqrt></math> units", "image": null, "isCorrect": false}, {"id": "wyQJf", "text": "<math><mn>8</mn><msqrt><mn>2</mn></msqrt></math> units", "image": null, "isCorrect": false}, {"id": "wbYv2", "text": "<math><mn>9</mn><msqrt><mn>2</mn></msqrt></math> units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>For the normal chord,&nbsp;<math><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>-</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></math> … <math><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math><br />Also, the chord subtends an angle of <math><msup><mrow><mn>9</mn><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math> at the vertex<br /><math><mo>∴</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>-</mo><mn>4</mn></math> … <math><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></math></p><p>From&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mn>1</mn></mfenced><mo>,</mo><mo>&nbsp;</mo><msub><mi>t</mi><mn>1</mn></msub><msub><mi>t</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><msubsup><mi>t</mi><mn>1</mn><mn>2</mn></msubsup><mo>-</mo><mn>2</mn></math> or <math><mo>-</mo><mn>4</mn><mo>=</mo><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><mn>2</mn></math></p><p><math><mo>∴</mo><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mn>2</mn></math><br /><math><mo>∴</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>-</mo><mfrac><mrow><mn>4</mn></mrow><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mn>4</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac><mo>=</mo><mo>-</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></math> or <math><msubsup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mn>8</mn></math><br />Now,&nbsp;<math><mi>P</mi><msup><mrow><mi>Q</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mfenced separators=\"|\"><mrow><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><msubsup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mfenced separators=\"|\"><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math><mo>=</mo><mn>1</mn><mo>⋅</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mo>-</mo><mn>8</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><msup><mrow><mfenced separators=\"|\"><mrow><msqrt><mn>2</mn></msqrt><mo>+</mo><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mn>36</mn><mo>+</mo><mn>72</mn></mrow></mfenced></math><br /><math><mi>P</mi><msup><mrow><mi>Q</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>108</mn></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi><mo>=</mo><mn>6</mn><msqrt><mn>3</mn></msqrt></math>&nbsp;units</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c7dbaffd9f6cc38a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "45", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math><mi>O</mi><mi>A</mi></math> is the chord of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> (where <math><mi>O</mi></math> is the origin). <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> is a chord of <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math>&nbsp;and perpendicular to <math><mi>O</mi><mi>A</mi></math> which cuts the axis of the parabola at <math><mi>C</mi><mo>.</mo></math>&nbsp;If the foot of <math><mi>A</mi></math> on the axis of the parabola is <math><mi>D</mi></math>, then the length&nbsp;<math><mi>C</mi><mi>D</mi></math> is equal to", "image": null}, "options": [{"id": "DTZs4", "text": "<math><mn>2</mn></math> units", "image": null, "isCorrect": false}, {"id": "WdqvO", "text": "<math><mn>3</mn></math> units", "image": null, "isCorrect": false}, {"id": "EtvyK", "text": "<math><mn>4</mn></math> units", "image": null, "isCorrect": true}, {"id": "fi1Fq", "text": "<math><mn>6</mn></math> units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let,&nbsp;<math><mi>A</mi><mo>=</mo><mfenced separators=\"|\"><mrow><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>,</mo><mn>2</mn><mi>t</mi></mrow></mfenced></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/271c4a88-3f47-4af6-a982-8fe18a926291.png\" style=\"width:2.48056in;height:1.74653in\" /><br />The slope of <math><mi>O</mi><mi>A</mi></math>&nbsp;is equal to <math><mfrac><mrow><mn>2</mn></mrow><mrow><mi>t</mi></mrow></mfrac></math><br /><math><mo>&#8658;</mo></math>&nbsp;The slope of <math><mi>A</mi><mi>B</mi></math>&nbsp;is equal to <math><mo>-</mo><mfrac><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><math><mo>&#8658;</mo></math>The equation of <math><mi>A</mi><mi>B</mi></math> is <math><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>y</mi><mo>-</mo><mn>2</mn><mi>t</mi></mrow><mrow><mi>x</mi><mo>-</mo><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mo>-</mo><mfrac><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><math><mo>&#8658;</mo><mi>C</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>4</mn><mo>+</mo><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>,</mo><mn>0</mn></mrow></mfenced></math> &amp; <math><mi>D</mi><mo>=</mo><mfenced separators=\"|\"><mrow><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>,</mo><mn>0</mn></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mi>C</mi><mi>D</mi><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><mo>-</mo><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mo>=</mo><mn>4</mn></math>&nbsp;units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c6ac0e0fad5291fb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "96", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The points&nbsp;<math><mi>A</mi><mfenced separators=\"|\"><mrow><mn>3</mn><mo>,</mo><mi></mi><mn>6</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;lie on the parabola <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>x</mi></math>, such that the chord <math><mi>A</mi><mi>B</mi></math> subtends <math><mn>90</mn><mo>°</mo></math> at the origin, then the length of the chord&nbsp;<math><mi>A</mi><mi>B</mi></math> is equal to", "image": null}, "options": [{"id": "Cm9Yx", "text": "<math><mn>15</mn><msqrt><mn>13</mn></msqrt></math> units", "image": null, "isCorrect": true}, {"id": "dhT1M", "text": "<math><mn>12</mn><msqrt><mn>17</mn></msqrt></math> units", "image": null, "isCorrect": false}, {"id": "Tt3Td", "text": "<math><mn>9</mn><msqrt><mn>17</mn></msqrt></math> units", "image": null, "isCorrect": false}, {"id": "p0you", "text": "<math><mn>9</mn><msqrt><mn>10</mn></msqrt></math> units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/f3c6fae4-2378-401f-b2db-719fe0cec5df.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.68681in;height:1.58681in\" /></p><p>Since the chord subtends a right angle at the origin,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mi>t</mi><mn>1</mn></msub><msub><mi>t</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>4</mn></math></p><p>Now, the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;lies on the parabola,</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mn>36</mn><mo>=</mo><mn>4</mn><mi>a</mi><mfenced separators=\"|\"><mn>3</mn></mfenced><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mn>3</mn></math><br />i.e.&nbsp;<math><mi>A</mi><mfenced separators=\"|\"><mrow><mn>3</mn><mo>,</mo><mi></mi><mn>6</mn></mrow></mfenced><mo>=</mo><mfenced separators=\"|\"><mrow><mn>3</mn><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mi></mi><mn>6</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math><br /><math><mo>&#8658;</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>1</mn><mo>&#8658;</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>-</mo><mn>4</mn></math><br />So,&nbsp;<math><mi>B</mi><mo>&#8801;</mo><mfenced separators=\"|\"><mrow><mn>48</mn><mo>,</mo><mo>-</mo><mn>24</mn></mrow></mfenced></math><br />Hence, the length of the chord&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>=</mo><mn>15</mn><msqrt><mn>13</mn></msqrt></math>&nbsp;units</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b994f9f0507507be", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A point <math><mi>P</mi></math> on the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi><mo>,</mo></math> the foot of the perpendicular from it upon the directrix and the focus are the vertices of an equilateral triangle. If the area of the equilateral triangle is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>β</mi></math>&nbsp;sq. units, then the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>β</mi><mn>2</mn></msup></math>&nbsp;is", "image": null}, "options": [], "correctValue": "48", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/ac9ad700-370b-4f09-ba06-7e727681aefa.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:2.06667in;height:1.47986in\" /></p><p>From the diagram,</p><p><math><mi>P</mi><mi>M</mi><mo>=</mo><mn>1</mn><mo>+</mo><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></m ub></math> from <math><mi mathvariant=\"normal\">P</mi><mo>.</mo></math></p><p>Now,&nbsp;<math><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\">D</mi></math> and <math><mi mathvariant=\"normal\">Δ</mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">S</mi><mi mathvariant=\"normal\">D</mi></math> are congruent triangles.</p><p>Hence,&nbsp;<math><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">F</mi><mo>=</mo><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">S</mi></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/455a752e-3a4b-45ae-ba9c-008180652329.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:2.09375in;height:1.78681in\" /><br /><math><mo>⇒</mo></math> locus of <math><mi mathvariant=\"normal\">P</mi></math> is a parabola having <math><mi mathvariant=\"normal\">S</mi></math> as focus and <math><msub><mrow><mi>l</mi></mrow><mrow><mn>1</mn></mrow></msub></math> as the directrix<br />Hence, the length of the latus rectum is <math><mn>2</mn><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mn>3</mn><mo>+</mo><mn>3</mn><mo>-</mo><mn>2</mn></mrow><mrow><msqrt><mn>1</mn><mo>+</mo><mn>1</mn></msqrt></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>4</mn><msqrt><mn>2</mn></msqrt></math>&nbsp;units<br />&nbsp;</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86383cb003215299f98", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "50", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The equation of the tangent to the parabola <math><ms ct-fit:contain\" style=\"width:2.06667in;height:1.41319in\" /></p><p>Let <math><mi mathvariant=\"normal\">A</mi><mo>&#8801;</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mi>t</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">B</mi><mo>&#8801;</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2</mn><mi>t</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></math> be the extremities on the double ordinate <math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi><mo>.</mo></math><br />Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></math> be it&rsquo;s trisection point, then<br /><math><mn>6</mn><mi>h</mi><mo>=</mo><mn>4</mn><mi>t</mi></math> and <math><mi>k</mi><mo>=</mo><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math><mo>&#8658;</mo><mi>t</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi>h</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi mathvariant=\"normal\"></mi><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>k</mi><mo>&#8658;</mo><mi>k</mi><mo>=</mo><mfrac><mrow><mn>9</mn><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>4</mn></mrow></mfrac></math><br />Thus, locus of <math><mi mathvariant=\"normal\">C</mi></math> is <math><mn>9</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>y</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86370a398c5b74c0760", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the line <math><mi mathvariant=\"normal\">y</mi><mo>-</mo><mn>2</mn><mo>=</mo><mn>0</mn><mi mathvariant=\"normal\"></mi></math> is the directrix of the parabola <math><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">y</mi><mo>+</mo><mn>32</mn><mo>=</mo><mn>0</mn><mo>,</mo><mi mathvariant=\"normal\">k</mi><mo>≠</mo><mn>0</mn><mi mathvariant=\"normal\"></mi></math> and the parabola intersects the circle <math><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi mathvariant=\"normal\">y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>8</mn><mi mathvariant=\"normal\"></mi></math> at two real distinct points, then the absolute value of <math><mi mathvariant=\"normal\">k</mi></math>&nbsp;is", "image": null}, "options": [], "correctValue": "16", "solution": {"text": "<math><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">y</mi><mo>+</mo><mn>32</mn><mo>=</mo><mn>0</mn></math><br /><math><mo>⇒</mo><msup><mrow><mi mathvariant=\"normal\">x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi mathvariant=\"normal\">k</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">y</mi><mo>-</mo><mfrac><mrow><mn>32</mn></mrow><mrow><mi mathvariant=\"normal\">k</mi></mrow></mfrac></mrow></mfenced></math><br />Put,&nbsp;<math><mi mathvariant=\"normal\">x</mi><mo>=</mo><mi mathvariant=\"normal\">X</mi><mo>,</mo><mi mathvariant=\"normal\">y</mi><mo>-</mo><mfrac><mrow><mn>32</mn></mrow><mrow><mi mathvariant=\"normal\">k</mi></mrow></mfrac><mo>=</mo><mi mathvariant=\"normal\">Y</mi></math><br />Th cts the circle at two real distinct points.<br /><math><mi mathvariant=\"normal\"></mi><mo>⇒</mo><mi mathvariant=\"normal\"></mi></math> Absolute value of <math><mi mathvariant=\"normal\">k</mi><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mo>-</mo><mn>16</mn></mrow></mfenced><mo>=</mo><mn>16</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636d375202032b02d9", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "49", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the line <math><mi>y</mi><mo>=</mo><mo>-</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math> is the directrix of the parabola <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi>k</mi><mi>y</mi><mo>+</mo><mn>8</mn><mo>=</mo><mn>0</mn></math>, then the sum of all the possible values of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math> is equal to", "image": null}, "options": [], "correctValue": "14", "solution": {"text": "Given equation of the parabola is&nbsp;<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi>k</mi><mi>y</mi><mo>+</mo><mn>8</mn><mo>=</mo><mn>0</mn><mo>&#8658;</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>k</mi><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mfrac><mrow><mn>8</mn></mrow><mrow><mi>k</mi></mrow></mfrac></mrow></mfenced></math><br /><br /><math><mo>&#8658;</mo></math> Directrix is <math><mi>y</mi><mo>=</mo><mfrac><mrow><mn>8</mn></mrow><mrow><mi>k</mi></mrow></mfrac><mo>-</mo><mfrac><mrow><mi>k</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><br /><mat On": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Consider a parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> with vertex at <math><mi>A</mi></math> and focus at <math><mi>S</mi><mo>.</mo></math> <math><mi>P</mi><mi>Q</mi></math> is a chord of the parabola which is normal at point <math><mi>P</mi><mo>.</mo></math> If the abscissa and the ordinate of the point <math><mi>P</mi></math> are equal, then the square of the length of the diameter of the circumcircle of triangle <math><mi>P</mi><mi>S</mi><mi>Q</mi></math> is", "image": null}, "options": [], "correctValue": "125", "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/8ad2ad65-d459-428c-82c9-3e80ede44fac.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:3.12014in;height:1.80694in\" /></p><p><math><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mn>2</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mi>t</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msub><mi>t</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>3</mn></math><br />So, <math><mi>P</mi><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mi></mi><mn>4</mn></mrow></mfenced></math>&nbsp;and <math><mi>Q</mi><mfenced separators=\"|\"><mrow><mn>9</mn><mo>,</mo><mo>-</mo><mn>6</mn></mrow></mfenced></math><br />Slope of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>S</mi><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math></p><p>Slope of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mi>S</mi><mo>=</mo><mo>-</mo><mfrac><mn>6</mn><mn>8</mn></mfrac><mo>=</mo><mo>-</mo><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mi>S</mi><mo>&#8869;</mo><mi>Q</mi><mi>S</mi></math><br /><math><mo>&#8756;</mo><mi>P</mi><mi>Q</mi></math> is the diameter of the circle passing through <math><mi>P</mi><mo>,</mo><mi>S</mi><mo>,</mo><mi></mi><mi>Q</mi><mo>.</mo></math><br />Hence, the length of the diameter <math><mo>=</mo><msqrt><mn>25</mn><mo>+</mo><mn>100</mn></msqrt><mo>=</mo><msqrt><mn>125</mn></msqrt></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;square of the length of the diameter<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>125</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635581c231e2bc1a50", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "52", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The distance between the focus and directrix of the parabola <math><msup><mrow><mfenced separators=\"|\"><mrow><msqrt><mn>3</mn></msqrt><mi>x</mi><mo>-</mo><mi>y</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>48</mn><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><msqrt><mn>3</mn></msqrt><mi>y</mi></mrow></mfenced></math> is", "image": null}, "options": [], "correctValue": "12", "solution": {"text": "Given, the equation of parabola is <math><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><msqrt><mn>3</mn></msqrt><mi>x</mi><mo>-</mo><mi>y</mi></mrow><mrow><mn>2</mn></mrow> >1</mn><mo>-</mo><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><msup><mi mathvariant=\"normal\">n</mi><mn>2</mn></msup><mi>θ</mi></mrow></mfrac></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/26370587-1b8c-46ec-b9cc-e78269ec40cd.png\" style=\"width:2.25347in;height:1.36667in\" /><br />i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mn>2</mn><mi>θ</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mfenced separators=\"|\"><mfrac><mn>3</mn><mn>4</mn></mfrac></mfenced></mrow><mrow><mn>1</mn><mo>-</mo><mfrac><mn>9</mn><mn>16</mn></mfrac></mrow></mfrac><mo>=</mo><mfrac><mn>24</mn><mn>7</mn></mfrac></math><br />Equation of the focal chord through <math><mi>P</mi></math> is <math><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>4</mn></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>24</mn></mrow><mrow><mn>7</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced></math><br />Focus is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mfenced separators=\"|\"><mrow><mfrac><mn>11</mn><mn>6</mn></mfrac><mo>,</mo><mn>0</mn></mrow></mfenced></math><br />Distance of the focus from the tangent is<br /><math><mfrac><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mn>3</mn><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>11</mn></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced><mo>-</mo><mn>4</mn><mfenced separators=\"|\"><mrow><mn>0</mn></mrow></mfenced><mo>+</mo><mn>7</mn></mrow></mfenced></mrow><mrow><msqrt><msup><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mn>4</mn></mrow><mrow><mn>2</mn></mrow></msup></msqrt></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>2</mn><mo>.</mo><mn>5</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "last </math>", "image": null, "isCorrect": false}, {"id": "MV0yV", "text": "<math><mn>4</mn><msqrt><mn>5</mn></msqrt><mo>+</mo><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "XeaNq", "text": "<math><mn>4</mn><mfenced separators=\"|\"><mrow><msqrt><mn>5</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfenced></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "On solving <math><mi>x</mi><mo>=</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></math> and <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>8</mn></math><br />we get,&nbsp;<math><mi>x</mi><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>8</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mo>-</mo><mn>1</mn><mo>,</mo><mn>4</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>4</mn></math>&nbsp;(as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#8800;</mo><mo>-</mo><mn>1</mn></math>&nbsp;is rejected because it makes&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>&nbsp;not defined)<br /><math><mo>&#8658;</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mo>&#8658;</mo><mi>y</mi><mo>=</mo><mo>&#177;</mo><mn>2</mn></math><br />Let,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mi>C</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/38c2e908-4523-43ba-a4ee-210151a8ac3d.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.92014in;height:1.59375in\" /><br />Now, perimeter of <math><mo>&#8710;</mo><mi>O</mi><mi>B</mi><mi>C</mi><mo>=</mo><mn>4</mn><mo>+</mo><mn>4</mn><msqrt><mn>5</mn></msqrt></math>&nbsp;units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "6aa3ab79aa8dc1ff68177fcd", "title": "Chord of Parabola", "totalQuestions": 21, "questions": [{"_id": "6151e863faef95a70712218b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let the focus <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>&nbsp;of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=8</mo><mi>x</mi></math> lies on the focal chord <math><mi>P</mi><mi>Q</mi></math> of the same parabola. If <math><mi>P</mi><mi>S</mi><mo>=</mo><mn>6</mn><mo>,</mo></math> then the square of the slope of the chord <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>Q</mi></math>&nbsp;is", "image": null}, "options": [{"id": "ZoNLw", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><msqrt><mn>5</mn></msqrt></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "5TIyk", "text": "<math><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "dQ4Sa", "text": "<math><mfrac><mrow><mn>5</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "80bVV", "text": "<math><mfrac><mrow><mn>9</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mi>S</mi><mo>,</mo><mo>&#160;</mo><mn>4</mn><mo>,</mo><mo>&#160;</mo><mi>S</mi><mi>Q</mi></math> are in <math><mi>H</mi><mo>.</mo><mi>P</mi><mo>.</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>1</mn><mn>6</mn></mfrac><mo>,</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>,</mo><mfrac><mn>1</mn><mrow><mi>S</mi><mi>Q</mi></mrow></mfrac></math> are in <math><mi>A</mi><mo>.</mo><mi>P</mi><mo>.</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>1</mn><mrow><mi>S</mi><mi>Q</mi></mrow></mfrac><mo>=</mo><mfrac><mn>2</mn><mn>4</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>6</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#8658;</mo><mi>S</mi><mi>Q</mi><mo>=</mo><mn>3</mn></math><br /><math><mo>&#8658;</mo><mi>P</mi><mi>Q</mi><mo>=</mo><mn>6</mn><mo>+</mo><mn>3</mn><mo>=</mo><mn>9</mn><mo>=</mo><mn>4</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi>e</mi><msup><mrow><mi mathvariant=\"normal\">c</mi></mrow><mrow><mn>2</mn></mrow></msup><mi></mi><mi>&#952;</mi></math> (where,&nbsp;<math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow></math> is the slope of <math><mi>P</mi><mi>Q</mi></math> )<br /><math><mo>&#8658;</mo><mn>1</mn><mo>+</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>9</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>&#8658;</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">cot</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math><br /><math><mo>&#8658;</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mo>&#8289;</mo><mrow><mi>&#952;</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f008cf093de4e69a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "97", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The length of intercept cut by the line <math><mn>4</mn><mi>x</mi><mo>+</mo><mn>4</mn><msqrt><mn>3</mn></msqrt><mi>y</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math> on the curve <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced></math>&nbsp;is equal to", "image": null}, "options": [{"id": "Q6f9A", "text": "<math><mn>4</mn></math> units", "image": null, "isCorrect": false}, {"id": "aISQv", "text": "<math><mn>9</mn></math> units", "image": null, "isCorrect": false}, {"id": "dZwlT", "text": "<math><mn>12</mn></math> units", "image": null, "isCorrect": false}, {"id": "o7PjV", "text": "<math><mn>16</mn></math> units", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The given line passes through the focus&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>,</mo><mn>0</mn></mrow></mfenced></math>, so it&nbsp;is a focal chord for the given parabola.</p><p>Hence, its slope is&nbsp;<math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi>&#945;</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;the length of the intercept is the same as the length of the focal chord</p><p>Hence, the length of the intercept<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4</mn><mi>a</mi><msup><mtext>cosec</mtext><mn>2</mn></msup><mi>&#945;</mi><mo>=</mo><mn>4</mn><mo>&#8901;</mo><mn>1</mn><mo>&#8901;</mo><msup><mfenced><mn>2</mn></mfenced><mn>2</mn></msup><mo>=</mo><mn>16</mn></math>&nbsp;units</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cb0aaee5537a4fb6", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "54", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let the focus<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>S</mi><mo>)</mo></math> of a parabola divides its one of the focal chords&nbsp;<math><mi>P</mi><mi>Q</mi></math> in the ratio <math><mn>2</mn><mo>:</mo><mn>1</mn><mo>.</mo></math>&nbsp;If the tangent at <math><mi>Q</mi></math> cuts the directrix at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> such that <math><mi>R</mi><mi>Q</mi><mo>=</mo><mn>6</mn><mo>,</mo></math> then the distance (in units) of the focus from the tangent at <math><mi>P</mi></math> is", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/c68d8e9f-e4f7-4e54-98f2-7443006512aa.png\" style=\"width:2.10694in;height:1.95347in\" /><br />Let, the foot of the perpendicular from the focus on the tangent <math><mi>P</mi><mi>R</mi></math> is <math><mi>A</mi></math> which lies on the tangent at the vertex.<br />Also,&nbsp;<math><mi mathvariant=\"normal\">∠</mi><mi>P</mi><mi>R</mi><mi>Q</mi><mo>=</mo><msup><mrow><mn>9</mn><mn>0</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></math><br />Now, in&nbsp;<math><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mi>R</mi><mi>Q</mi></math> &amp; <math><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mi>A</mi><mi>S</mi><mo>,</mo><mi mathvariant=\"normal\">∠</mi><mi>P</mi></math> is common &amp; <math><mi mathvariant=\"normal\">∠</mi><mi>R</mi><mo>=</mo><mi mathvariant=\"normal\">∠</mi><mi>A</mi></math><br />Then,&nbsp;<math><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mi>R</mi><mi>Q</mi></math> is similar to <math><mi mathvariant=\"normal\">Δ</mi><mi>P</mi><mi>A</mi><mi>S</mi></math><br /><math><mo>⇒</mo><mfrac><mrow><mi>P</mi><mi>S</mi></mrow><mrow><mi>P</mi><mi>Q</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>A</mi><mi>S</mi></mrow><mrow><mi>R</mi><mi>Q</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>⇒</mo><mi>A</mi><mi>S</mi><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>×</mo><mn>6</mn><mo>=</mo><mn>4</mn></math><br /><math><mo>⇒</mo></math>&nbsp;The distance of the focus from the tangent at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>=</mo><mn>4</mn></math>&nbsp;units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c7dbaffd9f6cc38a", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "45", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math><mi>O</mi><mi>A</mi></math> is the chord of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> (where <math><mi>O</mi></math> is the origin). <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi></math> is a chord of <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math>&nbsp;and perpendicular to <math><mi>O</mi><mi>A</mi></math> which cuts the axis of the parabola at <math><mi>C</mi><mo>.</mo></math>&nbsp;If the foot of <math><mi>A</mi></math> on the axis of the parabola is <math><mi>D</mi></math>, then the length&nbsp;<math><mi>C</mi><mi>D</mi></math> is equal to", "image": null}, "options": [{"id": "DTZs4", "text": "<math><mn>2</mn></math> units", "image": null, "isCorrect": false}, {"id": "WdqvO", "text": "<math><mn>3</mn></math> units", "image": null, "isCorrect": false}, {"id": "EtvyK", "text": "<math><mn>4</mn></math> units", "image": null, "isCorrect": true}, {"id": "fi1Fq", "text": "<math><mn>6</mn></math> units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let,&nbsp;<math><mi>A</mi><mo>=</mo><mfenced separators=\"|\"><mrow><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>,</mo><mn>2</mn><mi>t</mi></mrow></mfenced></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/271c4a88-3f47-4af6-a982-8fe18a926291.png\" style=\"width:2.48056in;height:1.74653in\" /><br />The slope of <math><mi>O</mi><mi>A</mi></math>&nbsp;is equal to <math><mfrac><mrow><mn>2</mn></mrow><mrow><mi>t</mi></mrow></mfrac></math><br /><math><mo>&#8658;</mo></math>&nbsp;The slope of <math><mi>A</mi><mi>B</mi></math>&nbsp;is equal to <math><mo>-</mo><mfrac><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><math><mo>&#8658;</mo></math>The equation of <math><mi>A</mi><mi>B</mi></math> is <math><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>y</mi><mo>-</mo><mn>2</mn><mi>t</mi></mrow><mrow><mi>x</mi><mo>-</mo><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mo>-</mo><mfrac><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><math><mo>&#8658;</mo><mi>C</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>4</mn><mo>+</mo><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>,</mo><mn>0</mn></mrow></mfenced></math> &amp; <math><mi>D</mi><mo>=</mo><mfenced separators=\"|\"><mrow><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>,</mo><mn>0</mn></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mi>C</mi><mi>D</mi><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><mo>-</mo><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mo>=</mo><mn>4</mn></math>&nbsp;units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c6ac0e0fad5291fb", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "96", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The points&nbsp;<math><mi>A</mi><mfenced separators=\"|\"><mrow><mn>3</mn><mo>,</mo><mi></mi><mn>6</mn></mrow></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;lie on the parabola <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>x</mi></math>, such that the chord <math><mi>A</mi><mi>B</mi></math> subtends <math><mn>90</mn><mo>°</mo></math> at the origin, then the length of the chord&nbsp;<math><mi>A</mi><mi>B</mi></math> is equal to", "image": null}, "options": [{"id": "Cm9Yx", "text": "<math><mn>15</mn><msqrt><mn>13</mn></msqrt></math> units", "image": null, "isCorrect": true}, {"id": "dhT1M", "text": "<math><mn>12</mn><msqrt><mn>17</mn></msqrt></math> units", "image": null, "isCorrect": false}, {"id": "Tt3Td", "text": "<math><mn>9</mn><msqrt><mn>17</mn></msqrt></math> units", "image": null, "isCorrect": false}, {"id": "p0you", "text": "<math><mn>9</mn><msqrt><mn>10</mn></msqrt></math> units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/f3c6fae4-2378-401f-b2db-719fe0cec5df.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.68681in;height:1.58681in\" /></p><p>Since the chord subtends a right angle at the origin,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><msub><mi>t</mi><mn>1</mn></msub><msub><mi>t</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>4</mn></math></p><p>Now, the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;lies on the parabola,</p><p>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mn>36</mn><mo>=</mo><mn>4</mn><mi>a</mi><mfenced separators=\"|\"><mn>3</mn></mfenced><mo>&#8658;</mo><mi>a</mi><mo>=</mo><mn>3</mn></math><br />i.e.&nbsp;<math><mi>A</mi><mfenced separators=\"|\"><mrow><mn>3</mn><mo>,</mo><mi></mi><mn>6</mn></mrow></mfenced><mo>=</mo><mfenced separators=\"|\"><mrow><mn>3</mn><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mi></mi><mn>6</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math><br /><math><mo>&#8658;</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>1</mn><mo>&#8658;</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>-</mo><mn>4</mn></math><br />So,&nbsp;<math><mi>B</mi><mo>&#8801;</mo><mfenced separators=\"|\"><mrow><mn>48</mn><mo>,</mo><mo>-</mo><mn>24</mn></mrow></mfenced></math><br />Hence, the length of the chord&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>B</mi><mo>=</mo><mn>15</mn><msqrt><mn>13</mn></msqrt></math>&nbsp;units</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c120bc83c66378f5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "68", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math><mi>P</mi><mfenced separators=\"|\"><mrow><mo>–</mo><mn>3,2</mn></mrow></mfenced></math> is one end of the focal chord <math> <mrow> <mi>P</mi><mi>Q</mi></mrow> </math> of the parabola <math><msup><mrow><mo>(</mo><mi>y</mi><mo>+</mo><mn>2</mn><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mo>-</mo><mn>4</mn><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>1,</mn></mrow></mfenced></math> then the slope of the normal at <math> <mi>Q</mi> </math> is", "image": null}, "options": [{"id": "rksUi", "text": "<math><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "EO0cf", "text": "<math><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "7EvZf", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ZwrqY", "text": "<math><mo>-</mo><mn>2</mn></math>", "image": null, "isCorrect": false}], "correctValue": nu ": "<math><mn>4</mn></math>", "image": null, "isCorrect": true}, {"id": "3Ja0v", "text": "<math><mn>9</mn></math>", "image": null, "isCorrect": false}, {"id": "vnJMf", "text": "<math><mn>12</mn></math>", "image": null, "isCorrect": false}, {"id": "uh8Ry", "text": "<math><mn>16</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given line is a focal chord for the parabola and its slope is <math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>α</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math><br /><math><mo>∴</mo></math> Length of the focal chord&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4</mn><mi>a</mi><msup><mi>cosec</mi><mn>2</mn></msup><mi>α</mi><mo>=</mo><mn>4</mn><mo>⋅</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>⋅</mo><msup><mfenced separators=\"|\"><mn>2</mn></mfenced><mn>2</mn></msup><mo>=</mo><mn>4</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86323550dd1d8da94e2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "87", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let <math><mi>B</mi></math> and <math><mi>C</mi></math> are the points of intersection of the parabola <math><mi>x</mi><mo>=</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></math> and the circle <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>8</mn><mo>.</mo></math> The perimeter (in units) of the triangle <math><mi></mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">B</mi><mi mathvariant=\"normal\">C</mi><mo>,</mo></math> where <math><mi mathvariant=\"normal\">O</mi></math> is the origin, is", "image": null}, "options": [{"id": "T3vtz", "text": "<math><mn>8</mn></math>", "image": null, "isCorrect": false}, {"id": "w11ZA", "text": "<math><mn>4</mn><msqrt><mn>5</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "MV0yV", "text": "<math><mn>4</mn><msqrt><mn>5</mn></msqrt><mo>+</mo><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "XeaNq", "text": "<math><mn>4</mn><mfenced separators=\"|\"><mrow><msqrt><mn>5</mn></msqrt><mo>+</mo><mn>1</mn></mrow></mfenced></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "On solving <math><mi>x</mi><mo>=</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></math> and <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>8</mn></math><br />we get,&nbsp;<math><mi>x</mi><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>8</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mo>-</mo><mn>1</mn><mo>,</mo><mn>4</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>4</mn></math>&nbsp;(as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#8800;</mo><mo>-</mo><mn>1</mn></math>&nbsp;is rejected because it makes&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi></math>&nbsp;not defined)<br /><math><mo>&#8658;</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mo>&#8658;</mo><mi>y</mi><mo>=</mo><mo>&#177;</mo><mn>2</mn></math><br />Let,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mi>C</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>4</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/38c2e908-4523-43ba-a4ee-210151a8ac3d.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.92014in;height:1.59375in\" /><br />Now, perimeter of <math><mo>&#8710;</mo><mi>O</mi><mi>B</mi><mi>C</mi><mo>=</mo><mn>4</mn><mo>+</mo><mn>4</mn><msqrt><mn>5</mn></msqrt></math>&nbsp;units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630e5aaeec28dcb374", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "43", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The length of the chord <math><mi>y</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mi>x</mi><mo>-</mo><mn>2</mn><msqrt><mn>3</mn></msqrt></math> intercepted by the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced></math> is equal to", "image": null}, "options": [{"id": "At8gD", "text": "<math><mn>4</mn><msqrt><mn>3</mn></msqrt></math> units", "image": null, "isCorrect": false}, {"id": "yEqDA", "text": "<math><mfrac><mrow><mn>8</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math> units", "image": null, "isCorrect": false}, {"id": "er8fv", "text": "<math><mfrac><mrow><mn>16</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math> units", "image": null, "isCorrect": true}, {"id": "jOckR", "text": "<math><mfrac><mrow><mn>4</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math> units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Focus of <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced></math> is <math><mfenced separators=\"|\"><mrow><mn>2,0</mn></mrow></mfenced></math>&nbsp;which satisfies the equation <math><mi>y</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mi>x</mi><mo>-</mo><mn>2</mn><msqrt><mn>3</mn></msqrt><mo>.</mo></math><br />Hence, line <math><mi>y</mi><mo>=</mo><msqrt><mn>3</mn></msqrt><mi>x</mi><mo>-</mo><mn>2</mn><msqrt><mn>3</mn></msqrt></math> is a focal chord.<br />Now, the length of the focal chord equals to <math><mn>4</mn><mi>a</mi></math> <math><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">e</mi><msup><mrow><mi mathvariant=\"normal\">c</mi></mrow><mrow><mn>2</mn></mrow></msup><mi></mi><mi>&#952;</mi></math> where <math><mi>a</mi><mo>=</mo><mn>1</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mo>&#8289;</mo><mi>&#952;</mi><mo>=</mo><msqrt><mn>3</mn><mo>&#160;</mo></msqrt><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">r</mi><mo>&#160;</mo><mi>&#952;</mi><mo>=</mo><mn>6</mn><msup><mn>0</mn><mi mathvariant=\"normal\">o</mi></msup></mrow></mfenced></math><br /><math><mo>&#8658;</mo></math> length of chord <math><mo>=</mo><mn>4</mn><mo>&#215;</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">c</mi><mi mathvariant=\"normal\">o</mi><mi mathvariant=\"normal\">s</mi><mi mathvariant=\"normal\">e</mi><msup><mrow><mi mathvariant=\"normal\">c</mi></mrow><mrow><mn>2</mn></mrow></msup><mi></mi><msup><mrow><mn>60</mn></mrow><mrow><mi mathvariant=\"normal\">o</mi></mrow></msup></mrow></mfenced></math><br /> <math><mo>=</mo><mn>4</mn><mo>&#215;</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>16</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math> units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "6aa3ab79aa8dc1ff68177fd8", "title": "Position of Point", "totalQuestions": 1, "questions": [{"_id": "6151e863f3b2a0cec3a030ca", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "29", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math> <mrow><mo>(</mo> <mrow> <mn>9</mn><mi>a</mi><mo>,</mo><mn>6</mn><mi>a</mi> </mrow> <mo>)</mo></mrow> </math> is a point bounded in the region formed by parabola <math> <mrow> <msup> <mi>y</mi> <mn>2</mn> </msup> <mo>=</mo><mn>16</mn><mi>x</mi> </mrow> </math> and <math> <mrow> <mi>x</mi><mo>=</mo><mn>9</mn><mo>,</mo> </mrow> </math> then", "image": null}, "options": [{"id": "eBmuF", "text": "<math><mi>a</mi><mo>∈</mo><mo>(</mo><mn>0,1</mn><mo>)</mo></math>", "image": null, "isCorrect": true}, {"id": "Vp7Je", "text": "<math><mi>a</mi><mo>&lt;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "1v6Df", "text": "<math><mi>a</mi><mo>&lt;</mo><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "OwNW7", "text": "<math><mn>0</mn><mo>&lt;</mo><mi>a</mi><mo>&lt;</mo><mn>4</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since, the point <math> <mrow><mo>(</mo> < [{"title": "NTA Abhyas Paper", "value": "97", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The length of intercept cut by the line <math><mn>4</mn><mi>x</mi><mo>+</mo><mn>4</mn><msqrt><mn>3</mn></msqrt><mi>y</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn></math> on the curve <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced></math>&nbsp;is equal to", "image": null}, "options": [{"id": "Q6f9A", "text": "<math><mn>4</mn></math> units", "image": null, "isCorrect": false}, {"id": "aISQv", "text": "<math><mn>9</mn></math> units", "image": null, "isCorrect": false}, {"id": "dZwlT", "text": "<math><mn>12</mn></math> units", "image": null, "isCorrect": false}, {"id": "o7PjV", "text": "<math><mn>16</mn></math> units", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p>The given line passes through the focus&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>,</mo><mn>0</mn></mrow></mfenced></math>, so it&nbsp;is a focal chord for the given parabola.</p><p>Hence, its slope is&nbsp;<math><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>&#8289;</mo><mrow><mi>&#945;</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mrow><msqrt><mn>3</mn></msqrt></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math>&nbsp;the length of the intercept is the same as the length of the focal chord</p><p>Hence, the length of the intercept<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4</mn><mi>a</mi><msup><mtext>cosec</mtext><mn>2</mn></msup><mi>&#945;</mi><mo>=</mo><mn>4</mn><mo>&#8901;</ is <math><mfenced separators=\"|\"><mrow><mn>2</mn><mi></mi><mi>b</mi><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math><br />Focus of parabola in option <math><mfenced separators=\"|\"><mrow><mi>C</mi></mrow></mfenced></math> is <math><mfenced separators=\"|\"><mrow><mn>30</mn><mi></mi><mi>b</mi><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math><br />Focus of parabola in option <math><mfenced separators=\"|\"><mrow><mi>D</mi></mrow></mfenced></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>b</mi><mo>,</mo><mn>0</mn></mrow></mfenced></math><br />Hence, option <math><mfenced separators=\"|\"><mrow><mi>D</mi></mrow></mfenced></math> is correct", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e07c6868db2a1da2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "108", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The angle between the tangents drawn from the point <math><mfenced separators=\"|\"><mrow><mn>2,6</mn></mrow></mfenced></math> to the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><mi>y</mi><mo>-</mo><mn>4</mn><mi>x</mi><mo>+</mo><mn>8</mn><mo>=</mo><mn>0</mn></math> is", "image": null}, "options": [{"id": "Z41rp", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "if5el", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "2mOh4", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "O4Gf6", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given parabola is <math><msup><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced></math><br />Equation of tangent in slope form to this parabola is&nbsp;<br /><math><mi>y</mi><mo>-</mo><mn>2</mn><mo>=</mo><mi>m</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>m</mi></mrow></mfrac></math><br />It passes through <math><mfenced separators=\"|\"><mrow><mn>2,6</mn></mrow></mfenced><mo>,</mo></math> so<br /><math><mn>4</mn><mo>=</mo><mi>m</mi><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>m</mi></mrow></mfrac><mo>&#8658;</mo><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><mi>m</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math><br />If <math><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are roots of this equation, then<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub><mo>+</mo><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mn>4</mn><mo>,</mo><mo>&#160;</mo><msub><mi>m</mi><mn>1</mn></msub><mo>&#183;</mo><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mn>1</mn></math><br />The angle between the tangents <math><mo>=</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>&#8289;</mo><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>1</mn><mo>+</mo><msub><mrow><mi>m</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></mrow></mfenced></mrow></mrow></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#8289;</mo><mfenced separators=\"|\"><mfrac><msqrt><msup><mfenced separators=\"|\"><mrow><msub><mi>m</mi><mn>1</mn></msub><mo>+</mo><msub><mi>m</mi><mn>2</mn></msub></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mn>4</mn><msub><mi>m</mi><mn>1</mn></msub><msub><mi>m</mi><mn>2</mn></msub></msqrt><mrow><mn>1</mn><mo>+</mo><msub><mi>m</mi><mn>1</mn></msub><msub><mi>m</mi><mn>2</mn></msub></mrow></mfrac></mfenced><mspace linebreak=\"newline\"/><mo>=</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><mo>&#8289;</mo><mfenced separators=\"|\"><mfrac><msqrt><mn>16</mn><mo>-</mo><mn>4</mn></msqrt><mn>2</mn></mfrac></mfenced><mo>=</mo><msup><mi>tan</mi><mrow><mo>-</mo><mn>1</mn></mrow></msup><msqrt><mn>3</mn></msqrt></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mi mathvariant=\"normal\">&#960;</mi><mn>3</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b6d6ac0666efd6fd", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "72", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A tangent is drawn to the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>8</mn><mi>x</mi></math> at <math><mi>P</mi><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>4</mn></mrow></mfenced></math> to intersect the&nbsp;<math><mi>x</mi></math>-axis at <math><mi>Q</mi><mo>,</mo></math> from which another tangent is drawn to the parabola to touch it at <math><mi>R</mi><mo>.</mo></math> If the normal at <math><mi>R</mi></math> intersects the parabola again at <math><mi>S</mi><mo>,</mo></math> then the coordinates of&nbsp;<math><mi>S</mi></math>&nbsp;are", "image": null}, "options": [{"id": "R5yKD", "text": "<math><mfenced separators=\"|\"><mrow><mn>6</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>4</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "APHR3", "text": "<math><mfenced separators=\"|\"><mrow><mn>18</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>12</mn></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "agFqR", "text": "<math><mfenced separators=\"|\"><mrow><mn>8</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>8</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "dExDW", "text": "<math><mfenced separators=\"|\"><mrow><mn>8</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>6</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/58627d2c-c12b-4a75-b01e-123bacc31b00.png\" style=\"width: 374px; height: 150px;\" /></p><p><math><mi>P</mi></math> is one of the end points of the latus rectum.</p><p>So,&nbsp;<math><mi>Q</mi></math> lies on the directrix.<br />Hence,&nbsp;<math><mi>R</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mo>-</mo><mn>4</mn></mrow></mfenced><mo>.</mo></math><br />Equation of the normal at <math><mi>R</mi></math> is <math><mi>y</mi><mo>=</mo><mi>x</mi><mo>-</mo><mn>6</mn></math><br /><math><mo>⇒</mo><mi>S</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>18</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>12</mn></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "n
