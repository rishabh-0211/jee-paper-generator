rmal\">h</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>8</mn></mrow></mfrac><mo>,</mo><mi mathvariant=\"normal\">h</mi></mrow></mfenced></math> respectively.<br />If <math><mi mathvariant=\"normal\">P</mi><mo>&#8801;</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">&#945;</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">&#946;</mi></mrow></mfenced></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#945;</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced separators=\"|\"><mrow><mfrac><msup><mi mathvariant=\"normal\">h</mi><mn>2</mn></msup><mn>4</mn></mfrac><mo>-</mo><mfrac><msup><mi mathvariant=\"normal\">h</mi><mn>2</mn></msup><mn>8</mn></mfrac></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">&#946;</mi><mo>=</mo><mi mathvariant=\"normal\">h</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mi mathvariant=\"normal\">&#945;</mi><mo>=</mo><mfrac><msup><mi mathvariant=\"normal\">h</mi><mn>2</mn></msup><mn>4</mn></mfrac><mfenced separators=\"|\"><mrow><mfrac><mn>1</mn><mn>1</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mo>=</mo><mfrac><msup><mi mathvariant=\"normal\">h</mi><mn>2</mn></msup><mn>8</mn></mfrac></math><br /><math><mo>&#8756;</mo></math> Locus of <math><mi mathvariant=\"normal\">P</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>=</mo><mfrac><msup><mi mathvariant=\"normal\">y</mi><mn>2</mn></msup><mn>16</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f892934415ade8b5", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "104", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "From a variable point <math><mi>P</mi></math> on the tangent at the vertex of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>2</mn><mi>x</mi><mo>,</mo></math> a line is drawn perpendicular to the chord of contact. These variable lines always pass through a fixed point, whose <math><mi>x</mi></math>-coordinate is", "image": null}, "options": [{"id": "nmyex", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "ErFZW", "text": "<math><mn>1</mn></math>", "image": null, "isCorrect": true}, {"id": "r8vhZ", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "t5s4W", "text": "<math><mn>2</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Comparing the given parabola with&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>x</mi></math>, we get&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math><br />Equation of the chord of contact of <math><mi>P</mi><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi></mi><mi>&#955;</mi></mrow></mfenced></math>&nbsp;is&nbsp;<math><mi>&#955;</mi><mi>y</mi><mo>=</mo><mn>2</mn><mi>a</mi><mi>x</mi></math><br />i.e.&nbsp;<math><mn>2</mn><mi>a</mi><mi>x</mi><mo>-</mo><mi>&#955;</mi><mi>y</mi><mo>=</mo><mn>0</mn><mi></mi><mi></mi><mi></mi><mi></mi><mi></mi><mo>&#8230;</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">i</mi></mrow></mfenced></math><br />A line perpendicular to it is&nbsp;<math><mi>&#955;</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>a</mi><mi>y</mi><mo>=</mo><mi>c</mi></math>&nbsp;</p><p>Since it passes through <math><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi></mi><mi>&#955;</mi></mrow></mfenced></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>0</mn><mo>+</mo><mn>2</mn><mi>a</mi><mi>&#955;</mi><mo>=</mo><mi>c</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>&#955;</mi><mi>x</mi><mo>+</mo><mn>2</mn><mi>a</mi><mi>y</mi><mo>-</mo><mn>2</mn><mi>a</mi><mi>&#955;</mi><mo>=</mo><mn>0</mn></math><br /><math><mi>&#955;</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>2</mn><mi>a</mi></mrow></mfenced><mo>+</mo><mn>2</mn><mi>a</mi><mi>y</mi><mo>=</mo><mn>0</mn></math><br /><math><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>2</mn><mi>a</mi></mrow></mfenced><mo>+</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>2</mn><mi>a</mi></mrow><mrow><mi>&#955;</mi></mrow></mfrac></mrow></mfenced><mi>y</mi><mo>=</mo><mn>0</mn></math><br />Passes through <math><mfenced separators=\"|\"><mrow><mn>2</mn><mi>a</mi><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math> i.e.&nbsp;<math><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c20adb57070dd82f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "83", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let <math><mi>A</mi></math> lies on <math><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0,</mn></math>&nbsp;<math><mi>B</mi></math> lies on <math><mn>4</mn><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>-</mo><mn>7</mn><mo>=</mo><mn>0</mn></math> and <math><mi>C</mi></math> is <math><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mi></mi><mn>5</mn></mrow></mfenced><mo>.</mo></math> If <math><mi>A</mi><mi>B</mi><mi>C</mi><mi>D</mi></math> is a rhombus, then the locus of <math><mi>D</mi></math> is a conic whose length of the latus rectum is equal to", "image": null}, "options": [{"id": "doddn", "text": "<math><mn>1</mn><mn>0</mn></math> units", "image": null, "isCorrect": true}, {"id": "W6CdZ", "text": "<math><mn>15</mn></math> units", "image": null, "isCorrect": false}, {"id": "DHAqL", "text": "<math><mn>5</mn></math> units", "image": null, "isCorrect": false}, {"id": "MiCPU", "text": "<math><mn>20</mn></math> units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/5c24b244-6ea3-4728-a2cc-731e0fa3d2f5.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:3.31389in;height:1.40694in\" /></p><p>Let,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi><mfenced><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></math><br /><math><mi>C</mi><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mi></mi><mn>5</mn></mrow></mfenced></math> lies on <math><mn>4</mn><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>-</mo><mn>7</mn><mo>=</mo><mn>0</mn></math><br /><math><mo>&#8658;</mo><mi>B</mi><mi>C</mi></math> is perpendicular to <math><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math><br /><math><mo>&#8658;</mo><mi>D</mi><mi>A</mi></math> is perpendicular to <math><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math><br /><math><mo>&#8658;</mo></math> Because <math><mi>D</mi><mi>A</mi><mo>=</mo><mi>D</mi><mi>C</mi></math> so, the distance of <math><mi>D</mi></math> from <math><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math> is equal to <math><mi>D</mi><mi>C</mi></math><br /><math><mo>&#8658;</mo><msqrt><msup><mrow><mfenced separators=\"|\"><mrow><mi>h</mi><mo>+</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>k</mi><mo>-</mo><mn>5</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></msqrt><mo>=</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mn>3</mn><mi>h</mi><mo>-</mo><mn>4</mn><mi>k</mi><mo>+</mo><mn>1</mn></mrow><mrow><mn>5</mn></mrow></mfrac></mrow></mfenced></math><br /><math><mo>&#8658;</mo><mn>25</mn><mfenced separators=\"|\"><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>5</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br />Which represents parabola with focus <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mn>5</mn></mrow></mfenced></math> and directrix is <math><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math><br /><math><mo>&#8658;</mo></math> Length of the latus rectum&nbsp;is <math><mn>2</mn><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mo>-</mo><mn>6</mn><mo>-</mo><mn>20</mn><mo>+</mo><mn>1</mn></mrow><mrow><mn>5</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>10</mn></math>&nbsp;units</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863746245a6bd03f35c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The locus of the trisection point of any arbitrary double ordinate of the parabola <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>y</mi><mo>,</mo></math> is", "image": null}, "options": [{"id": "Pbo2b", "text": "<math><mn>9</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>y</mi></math>", "image": null, "isCorrect": false}, {"id": "pX2en", "text": "<math><mn>3</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>2</mn><mi>y</mi></math>", "image": null, "isCorrect": false}, {"id": "QuZLH", "text": "<math><mn>9</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>y</mi></math>", "image": null, "isCorrect": true}, {"id": "sLFzt", "text": "<math><mn>9</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>2</mn><mi>y</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/a4f1e223-d9f6-4eea-bdb7-00adda03af44.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:2.06667in;height:1.41319in\" /></p><p>Let <math><mi mathvariant=\"normal\">A</mi><mo>&#8801;</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mi>t</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">B</mi><mo>&#8801;</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2</mn><mi>t</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></math> be the extremities on the double ordinate <math><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">B</mi><mo>.</mo></math><br />Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">C</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></math> be it&rsquo;s trisection point, then<br /><math><mn>6</mn><mi>h</mi><mo>=</mo><mn>4</mn><mi>t</mi></math> and <math><mi>k</mi><mo>=</mo><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math><mo>&#8658;</mo><mi>t</mi><mo>=</mo><mfrac><mrow><mn>3</mn><mi>h</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi mathvariant=\"normal\"></mi><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>k</mi><mo>&#8658;</mo><mi>k</mi><mo>=</mo><mfrac><mrow><mn>9</mn><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>4</mn></mrow></mfrac></math><br />Thus, locus of <math><mi mathvariant=\"normal\">C</mi></math> is <math><mn>9</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>y</mi></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636d431a936fa4825f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "100", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The locus of mid-points of all chords of parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi><mo>,</mo></math> for which all circles drawn taking them as diameters passes through the vertex of the parabola is a conic whose length of the smallest focal chord is equal to", "image": null}, "options": [{"id": "qt7EW", "text": "<math><mn>1</mn></math> units", "image": null, "isCorrect": false}, {"id": "3n0QZ", "text": "<math><mn>2</mn></math> units", "image": null, "isCorrect": true}, {"id": "4oqB6", "text": "<math><mn>3</mn></math> units", "image": null, "isCorrect": false}, {"id": "jVhmh", "text": "<math><mn>4</mn></math> units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/711081b9-ec6c-4bc3-9f1a-90b101d27189.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.52014in;height:1.72014in\" /></p><p>Circle drawn by taking <math><mi>A</mi><mi>B</mi></math> as diameter passes through vertex hence <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>V</mi></math>&nbsp;is perpendicular to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mi>V</mi></math></p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></math>&nbsp;be the mid-point of the chord<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>t</mi><mn>1</mn></msub><msub><mi>t</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>4</mn><mo>,</mo><mo>&#160;</mo><mi>h</mi><mo>=</mo><mfrac><mfenced separators=\"|\"><mrow><msubsup><mi>t</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>t</mi><mn>2</mn><mn>2</mn></msubsup></mrow></mfenced><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mi>k</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mfenced separators=\"|\"><mrow><msub><mi>t</mi><mn>1</mn></msub><mo>+</mo><msub><mi>t</mi><mn>2</mn></msub></mrow></mfenced></mrow><mn>2</mn></mfrac></math><br /><math><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><msubsup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><mn>2</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>8</mn></math></p><p>Hence, the locus of the conic is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>4</mn></mrow></mfenced></math><br /><math><mo>&#8658;</mo></math> Length of the latus rectum (smallest focal chord)&nbsp;<math><mo>=</mo><mn>2</mn></math>&nbsp;units</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86347dece1c6b065ee9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "61", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The ordinates of the points <math><mi>P</mi></math> and <math><mi>Q</mi></math> on the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>12</mn><mi>x</mi></math> are in the ratio <math><mn>1</mn><mo>:</mo><mn>2</mn><mo>.</mo></math> The locus of the point of intersection of the normals to the parabola at <math><mi>P</mi><mi></mi></math> and <math><mi>Q</mi></math> is&nbsp;", "image": null}, "options": [{"id": "msPCB", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>12</mn></mrow><mrow><mn>343</mn></mrow></mfrac><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>6</mn></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "scOcj", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>12</mn></mrow><mrow><mn>343</mn></mrow></mfrac><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mn>6</mn></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "EZH1R", "text": "<math><msup><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>6</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>12</mn><mi>x</mi></mrow><mrow><mn>343</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "9g1WF", "text": "<math><msup><mrow><mfenced separators=\"|\"><mrow><mi>y</mi><mo>+</mo><mn>6</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>12</mn><mi>x</mi></mrow><mrow><mn>343</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, <math><mi>a</mi><mo>=</mo><mn>3</mn><mo>.</mo></math> So, let <math><mi>P</mi><mfenced separators=\"|\"><mrow><mn>3</mn><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mn>6</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math> and <math><mi>Q</mi><mfenced separators=\"|\"><mrow><mn>3</mn><msubsup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mn>6</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math> be two points on the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>12</mn><mi>x</mi><mo>.</mo></math> Then,<br /><math><mfrac><mrow><mn>6</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>6</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>⇒</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>2</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>.</mo></math><br />Let,&nbsp;<math><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></math> be the point of intersection of the normals at <math><mi>P</mi></math> and <math><mi>Q</mi><mo>.</mo></math> Then,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mo>-</mo><msub><mi>t</mi><mn>1</mn></msub><mi>h</mi><mo>+</mo><mn>6</mn><msub><mi>t</mi><mn>1</mn></msub><mo>+</mo><mn>3</mn><msubsup><mi>t</mi><mn>1</mn><mn>3</mn></msubsup></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&nbsp;</mo><mi>k</mi><mo>=</mo><mo>-</mo><msub><mi>t</mi><mn>2</mn></msub><mi>h</mi><mo>+</mo><mn>6</mn><msub><mi>t</mi><mn>2</mn></msub><mo>+</mo><mn>3</mn><msup><msub><mi>t</mi><mn>2</mn></msub><mn>3</mn></msup></math><br /><math><mo>⇒</mo><mi>h</mi><mo>=</mo><mn>6</mn><mo>+</mo><mn>3</mn><mfenced separators=\"|\"><mrow><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><msubsup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math> and <math><mi>k</mi><mo>=</mo><mo>-</mo><mn>3</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mfenced separators=\"|\"><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math><br /><math><mo>⇒</mo><mi>h</mi><mo>=</mo><mn>6</mn><mo>+</mo><mn>3</mn><mfenced separators=\"|\"><mrow><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><mn>4</mn><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><mn>2</mn><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></mrow></mfenced></math> and <math><mi>k</mi><mo>=</mo><mo>-</mo><mn>6</mn><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mfenced separators=\"|\"><mrow><mn>3</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math><br /><math><mo>⇒</mo><mi>h</mi><mo>-</mo><mn>6</mn><mo>=</mo><mn>21</mn><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math> and <math><mi>k</mi><mo>=</mo><mo>-</mo><mn>18</mn><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></msubsup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msup><mfenced separators=\"|\"><mfrac><mrow><mi>h</mi><mo>-</mo><mn>6</mn></mrow><mn>21</mn></mfrac></mfenced><mn>3</mn></msup><mo>=</mo><msubsup><mi>t</mi><mn>1</mn><mn>6</mn></msubsup></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced separators=\"|\"><mfrac><mrow><mo>-</mo><mi>k</mi></mrow><mn>18</mn></mfrac></mfenced><mn>2</mn></msup><mo>=</mo><msubsup><mi>t</mi><mn>1</mn><mn>6</mn></msubsup></math><br /><math><mo>⇒</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>h</mi><mo>-</mo><mn>6</mn></mrow><mrow><mn>21</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mfrac><mrow><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>324</mn></mrow></mfrac></math><br /><math><mo>⇒</mo><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>12</mn></mrow><mrow><mn>343</mn></mrow></mfrac><msup><mrow><mfenced separators=\"|\"><mrow><mi>h</mi><mo>-</mo><mn>6</mn></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup></math><br />Hence, the locus of <math><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></math> is<br /><math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>12</mn></mrow><mrow><mn>343</mn></mrow></mfrac><msup><mrow><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>6</mn></mrow></mfenced></mrow><mrow><mn>3</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633c269bf8a7313cc1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "17", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The locus of the middle points of the chords of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>x</mi><mo>,</mo></math> which passes through the origin is", "image": null}, "options": [{"id": "UwUjQ", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>a</mi><mi>x</mi><mi> </mi></math>", "image": null, "isCorrect": false}, {"id": "s6gbf", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>2</mn><mi>a</mi><mi>x</mi></math>", "image": null, "isCorrect": true}, {"id": "UlBL2", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>x</mi></math>", "image": null, "isCorrect": false}, {"id": "WYA94", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>y</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let mid point be<math><mo>(</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo><mi></mi><msub><mrow><mi>y</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>)</mo></math><br /><br /><math><mo>∴</mo></math> Equation of chord is<br /><br /><math><mi>T</mi><mo>=</mo><msub><mrow><mi>S</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br /><math><msub><mrow><mi>y</mi><mi>y</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mn>2</mn><mi>a</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced><mo>=</mo><msubsup><mrow><mi>y</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><mn>4</mn><mi>a</mi><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br />Since, it passes through origin<br /><br /><math><mo>∴</mo><mi>&nbsp;</mi><mo>-</mo><mn>2</mn><mi>a</mi><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><msubsup><mrow><mi>y</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>-</mo><mn>4</mn><mi>a</mi><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br /><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msubsup><mrow><mi>y</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>=</mo><mn>2</mn><mi>a</mi><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br /><br /><math><mo>∴</mo></math> Locus is<math><mi>&nbsp;</mi><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>2</mn><mi>a</mi><mi>x</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632b6f358e2cde23f4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "60", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The locus of the centre of the circle described on any focal chord of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>x</mi></math> as the diameter is", "image": null}, "options": [{"id": "twTMJ", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>2</mn><mi>a</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mi>a</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "sx5Nc", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>a</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mi>a</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "8wqsx", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>2</mn><mi>a</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mi>a</mi></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "Qa0Gt", "text": "<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>a</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mi>a</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let,&nbsp;<math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>a</mi><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mn>2</mn><mi>a</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math> and <math><mi>Q</mi><mfenced separators=\"|\"><mrow><mi>a</mi><msubsup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mn>2</mn><mi>a</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math> be the extremities of a focal chord <math><mi>P</mi><mi>Q</mi></math> of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>x</mi><mo>.</mo></math> Then, <math><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>-</mo><mn>1</mn>< \"><mi>P</mi><mo>=</mo><mn>4</mn></math>&nbsp;units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b912332b6a7350c2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "62", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Tangents are drawn at the end points of a normal chord of the parabola <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>x</mi></math>. The locus of their point of intersection is", "image": null}, "options": [{"id": "wYPZ3", "text": "<math><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>2</mn><mi>a</mi></mrow></mfenced><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "ZOVMs", "text": "<math><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>2</mn><mi>a</mi></mrow></mfenced><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "EFdyD", "text": "<math><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mn>2</mn><mi>a</mi></mrow></mfenced><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "wekJZ", "text": "<math><mfenced separators=\"|\"><mrow><mi>x</mi><mo>+</mo><mn>2</mn><mi>a</mi></mrow></mfenced><msup><mrow><mi>y</mi></mrow><mrow><m /mrow></msub><mo>=</mo><mn>2</mn><mo>,</mo></math>&nbsp;then the locus of point <math><mi>P</mi></math> is", "image": null}, "options": [{"id": "zP5p6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mi>a</mi></math>", "image": null, "isCorrect": false}, {"id": "oYVNr", "text": "<math><mi>x</mi><mo>=</mo><mfrac><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "ElDSk", "text": "<math><mi>x</mi><mo>+</mo><mi>a</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "RO14i", "text": "<math><mi>x</mi><mo>=</mo><mn>2</mn><mi>a</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let co-ordinates of <math><mi>P</mi></math> be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></math> and equation of the tangent is <math><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>+</mo><mfrac><mrow><mi>a</mi></mrow><mrow><mi>m</mi></mrow></mfrac></math><br />Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><msup><mi>m</mi><mn>2</mn></msup><mo>-</mo><mi>k</mi><mi>m</mi><mo>+</mo><mi>a</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>m</mi><mn>1</mn></msub><msub><mi>m</mi><mn>2</mn></msub><mo>=</mo><mfrac><mi>a</mi><mi>h</mi></mfrac><mo>=</mo><mn>2</mn></math>&nbsp;(given)<br />Hence, the locus is <math><mi>x</mi><mo>=</mo><mfrac><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863500a704e22391871", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "25", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the equation of the tangent at the point <math><mi>P</mi><mfenced separators=\"|\"><mrow><mn>3,4</mn></mrow></mfenced></math> on the parabola whose axis is the&nbsp;<math><mi>x</mi></math> -axis is <math><mn>3</mn><mi>x</mi><mo>-</mo><mn>4</mn><mi>y</mi><mo>+</mo><mn>7</mn><mo>=</mo><mn>0,</mn></math>&nbsp;then the distance of the tangent from the focus of the parabola is", "image": null}, "options": [], "correctValue": "2.5", "solution": {"text": "Slope of the tangent is <math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow></math><br />Slope of the focal chord through <math><mi>P</mi><mfenced separators=\"|\"><mrow><mn>3,4</mn></mrow></mfenced></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mo>⁡</mo><mn>2</mn><mi>θ</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>tan</mi><mo>⁡</mo><mi>θ</mi></mrow><mrow><mn>1</mn><mo>-</mo><mi mathvariant=\"normal\">t</mi><mi mathvariant=\"normal\">a</mi><msup><mi mathvariant=\"normal\">n</mi><mn>2</mn></msup><mi>θ</mi></mrow></mfrac></math><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/26370587-1b8c-46ec-b9cc-e78269ec40cd.png\" style=\"width:2.25347in;height:1.36667in\" /><br />i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>tan</mi><mn>2</mn><mi>θ</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mfenced separators=\"|\"><mfrac><mn>3</mn><mn>4</mn></mfrac></mfenced></mrow><mrow><mn>1</mn><mo>-</mo><mfrac><mn>9</mn><mn>16</mn></mfrac></mrow></mfrac><mo>=</mo><mfrac><mn>24</mn><mn>7</mn></mfrac></math><br />Equation of the focal chord through <math><mi>P</mi></math> is <math><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>4</mn></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>24</mn></mrow><mrow><mn>7</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced></math><br />Focus is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mfenced separators=\"|\"><mrow><mfrac><mn>11</mn><mn>6</mn></mfrac><mo>,</mo><mn>0</mn></mrow></mfenced></math><br />Distance of the focus from the tangent is<br /><math><mfrac><mrow><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mn>3</mn><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>11</mn></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced><mo>-</mo><mn>4</mn><mfenced separators=\"|\"><mrow><mn>0</mn></mrow></mfenced><mo>+</mo><mn>7</mn></mrow></mfenced></mrow><mrow><msqrt><msup><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mn>4</mn></mrow><mrow><mn>2</mn></mrow></msup></msqrt></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>=</mo><mn>2</mn><mo>.</mo><mn>5</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633e464e4113932b8b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "101", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math><mi>P</mi><mi>Q</mi></math> is the focal chord of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mo>-</mo><mi>x</mi></math> and <math><mi>P</mi></math> is <math><mfenced separators=\"|\"><mrow><mo>-</mo><mn>4</mn><mo>,</mo><mi></mi><mn>2</mn></mrow></mfenced></math>, then the ordinate of the point of intersection of the tangents at <math><mi>P</mi></math> and <math><mi>Q</mi></math> is", "image": null}, "options": [{"id": "Hf6IT", "text": "<math><mfrac><mrow><mn>15</mn></mrow><mrow><mn>16</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "ruU5n", "text": "<math><mfrac><mrow><mn>7</mn></mrow><mrow><mn>8</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "XeV0f", "text": "<math><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "ETvoG", "text": "<math><mfrac><mrow><mn>17</mn></mrow><mrow><mn>18</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>The tangent at the end points of the focal chord meets at the directrix.</p><p>The equation of the tangent at <math><mi>P</mi></math> is <math> <mrow> <mi>y</mi><mo>&#8901;</mo><mn>2</mn><mo>=</mo><mo>&#8722;</mo><mfrac> <mrow> <mfenced> <mrow> <mi>x</mi><mo>&#8722;</mo><mn>4</mn></mrow> </mfenced></mrow> <mn>2</mn> </mfrac> </mrow> </math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>4</mn><mi>y</mi><mo>=</mo><mo>-</mo><mi>x</mi><mo>+</mo><mn>4</mn></math></p><p>This tangent intersects the directrix at <math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>15</mn></mrow><mrow><mn>16</mn></mrow></mfrac></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863218742cd53e618a2", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The normal to the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> at <math><mi>P</mi><mfenced separators=\"|\"><mrow><mn>9</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>6</mn></mrow></mfenced></math> meets the parabola again at <math><mi>Q</mi><mo>.</mo></math> If the tangent at <math><mi>Q</mi></math> meets the directrix at <math><mi>R</mi><mo>,</mo></math> then the slope of another tangent drawn from point <math><mi>R</mi></math> to this parabola is", "image": null}, "options": [{"id": "udV31", "text": "<math><mn>11</mn></math>", "image": null, "isCorrect": false}, {"id": "C1ntz", "text": "<math><mfrac><mrow><mn>11</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "55lac", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>11</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "cjcNa", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Parameter corresponding to <math><mi>P</mi></math> is <math><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mn>3</mn></math><br />Hence, the parameter corresponding to <math><mi>Q</mi></math> is <math><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>-</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac><mo>=</mo><mo>-</mo><mn>3</mn><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mo>-</mo><mfrac><mrow><mn>11</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math></p><p>Let,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mfenced><msub><mi>t</mi><mn>3</mn></msub></mfenced></math>&nbsp;be the point where another tangent from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math>&nbsp;touches the parabola<br />Now, if the tangent at <math><mi>Q</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math> and <math><mi>S</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfenced></math> meet on the directrix at <math><mi>R</mi></math> then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>t</mi><mn>2</mn></msub><msub><mi>t</mi><mn>3</mn></msub><mo>=</mo><mo>-</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>t</mi><mn>3</mn></msub><mo>=</mo><mfrac><mn>3</mn><mn>11</mn></mfrac></math></p><p>So the equation of the tangent at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>11</mn></mfrac><mi>y</mi><mo>=</mo><mi>x</mi><mo>+</mo><mfrac><mn>9</mn><mn>121</mn></mfrac></math><br />&nbsp;Hence, the slope of the tangent at <math><mi>S</mi></math> is <math><mfrac><mrow><mn>11</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 14, "topicId": "6aa3ab79aa8dc1ff68177fce", "title": "Chord with Given Middle Point", "totalQuestions": 4, "questions": [{"_id": "6151e86388fd96f104c361a8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the line <math><mi>y</mi><mo>=</mo><mi>x</mi><mo>-</mo><mn>1</mn></math> bisects two chords of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>b</mi><mi>x</mi></math> which are passing through the point&nbsp;<math><mfenced separators=\"|\"><mrow><mi>b</mi><mo>,</mo><mo>-</mo><mn>2</mn><mi>b</mi></mrow></mfenced><mo>,</mo></math> then the length of the latus rectum can be equal to", "image": null}, "options": [{"id": "7Qphx", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": true}, {"id": "cOmWs", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "o0X6D", "text": "<math><mn>6</mn></math>", "image": null, "isCorrect": false}, {"id": "CqmRx", "text": "<math><mn>8</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Any point on <math><mi>y</mi><mo>=</mo><mi>x</mi><mo>–</mo><mn>1</mn></math> can be taken as <math><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>h</mi><mo>–</mo><mn>1</mn></mrow></mfenced></math><br />Taking <math><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>h</mi><mo>-</mo><mn>1</mn></mrow></mfenced></math> as the midpoint of chord, the equation of chord is <math><mi>y</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>-</mo><mn>4</mn><mi>b</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>x</mi><mo>+</mo><mi>h</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>h</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><mi>b</mi><mi>h</mi></math><br />Which passes through the point <math><mfenced separators=\"|\"><mrow><mi>b</mi><mo>,</mo><mo>-</mo><mn>2</mn><mi>b</mi></mrow></mfenced></math><br /><math><mo>⇒</mo></math> <math><mo>-</mo><mn>2</mn><mi>b</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>-</mo><mn>2</mn><mi>b</mi><mfenced separators=\"|\"><mrow><mi>b</mi><mo>+</mo><mi>h</mi></mrow></mfenced><mo>=</mo><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>h</mi><mo>+</mo><mn>1</mn><mo>-</mo><mn>4</mn><mi>b</mi><mi>h</mi></math><br /><math><mo>⇒</mo></math> <math><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>h</mi><mo>+</mo><mfenced separators=\"|\"><mrow><mn>2</mn><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>b</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math><br />As, above equation has two real roots, hence,&nbsp;<br /><math><msup><mrow><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>2</mn><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>b</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mo>&gt;</mo><mn>0</mn></math><br /><math><mo>⇒</mo></math> <math><mn>2</mn><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>b</mi><mo>&lt;</mo><mn>0</mn><mo>⇒</mo><mi>b</mi><mo>&lt;</mo><mn>1</mn><mo>⇒</mo><mn>4</mn><mi>b</mi><mo>&lt;</mo><mn>4</mn></math><br /><math><mo>⇒</mo></math>&nbsp;length of latus rectum is less than <math><mn>4</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636d431a936fa4825f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "100", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The locus of mid-points of all chords of parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi><mo>,</mo></math> for which all circles drawn taking them as diameters passes through the vertex of the parabola is a conic whose length of the smallest focal chord is equal to", "image": null}, "options": [{"id": "qt7EW", "text": "<math><mn>1</mn></math> units", "image": null, "isCorrect": false}, {"id": "3n0QZ", "text": "<math><mn>2</mn></math> units", "image": null, "isCorrect": true}, {"id": "4oqB6", "text": "<math><mn>3</mn></math> units", "image": null, "isCorrect": false}, {"id": "jVhmh", "text": "<math><mn>4</mn></math> units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/711081b9-ec6c-4bc3-9f1a-90b101d27189.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.52014in;height:1.72014in\" /></p><p>Circle drawn by taking <math><mi>A</mi><mi>B</mi></math> as diameter passes through vertex hence <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>V</mi></math>&nbsp;is perpendicular to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mi>V</mi></math></p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>h</mi><mo>,</mo><mi>k</mi></mrow></mfenced></math>&nbsp;be the mid-point of the chord<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>t</mi><mn>1</mn></msub><msub><mi>t</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>4</mn><mo>,</mo><mo>&#160;</mo><mi>h</mi><mo>=</mo><mfrac><mfenced separators=\"|\"><mrow><msubsup><mi>t</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>t</mi><mn>2</mn><mn>2</mn></msubsup></mrow></mfenced><mn>2</mn></mfrac><mo>,</mo><mo>&#160;</mo><mi>k</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mfenced separators=\"|\"><mrow><msub><mi>t</mi><mn>1</mn></msub><mo>+</mo><msub><mi>t</mi><mn>2</mn></msub></mrow></mfenced></mrow><mn>2</mn></mfrac></math><br /><math><msup><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><msubsup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>+</mo><mn>2</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br hvariant=\"normal\">A</mi><mn>1</mn></msub><mo>,</mo><mo>&nbsp;</mo><msub><mi mathvariant=\"normal\">A</mi><mn>2</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">A</mi><mn>3</mn></msub></math> on this parabola meet at the point <math><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math>, then the value of&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi></math>&nbsp;is", "image": null}, "options": [{"id": "PYsEl", "text": "<math><mn>24</mn></math>", "image": null, "isCorrect": false}, {"id": "6pBcQ", "text": "<math><mn>26</mn></math>", "image": null, "isCorrect": false}, {"id": "Lcny2", "text": "<math><mn>38</mn></math>", "image": null, "isCorrect": false}, {"id": "FBYc6", "text": "<math><mn>28</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/c0110eee-03de-4d76-8cfe-c230ca2b6d0c.png\" style=\"width:2.72708in;height:1.51319in\" /><br />One of the normal from <math><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi></mi><mn>0</mn></mrow></mfenced></math> on the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>8</mn><mi>x</mi></math> is <math><mi>y</mi><mo>=</mo><mn>0</mn></math><br />hence, assume <math><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>0</mn></mrow></mfenced></math><br />Let,&nbsp;<math><msub><mrow><mi mathvariant=\"normal\">A</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><msubsup><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mi></mi><mn>4</mn><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math><br />and <math> 4b44bbc744", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "34", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The set of points on the axis of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>y</mi><mo>-</mo><mn>4</mn><mi>x</mi><mo>+</mo><mn>5</mn><mo>=</mo><mn>0</mn></math> from which all the three normals drawn to the parabola are real and distinct, is", "image": null}, "options": [{"id": "9D6z4", "text": "<math><mo>{</mo><mfenced separators=\"|\"><mrow><mi>x</mi><mo>,</mo><mn>1</mn></mrow></mfenced><mo>:</mo><mi>x</mi><mo>&gt;</mo><mn>3</mn><mo>}</mo></math>", "image": null, "isCorrect": true}, {"id": "eaFDd", "text": "<math><mo>{</mo><mfenced separators=\"|\"><mrow><mi>x</mi><mo>,</mo><mo>-</mo><mn>1</mn></mrow></mfenced><mo>:</mo><mi>x</mi><mo>≥</mo><mn>1</mn><mo>}</mo></math>", "image": null, "isCorrect": false}, {"id": "cNSt2", "text": "<math><mo>{</mo><mfenced separators=\"|\"><mrow><mi>x</mi><mo>,</mo><mn>3</mn></mrow></mfenced><mo>:</mo><mi>x</mi><mo>≥</mo><mn>1</mn><mo>}</mo></math>", "image": null, "isCorrect": false}, {"id": "HRUNU", "text": "<math><mo>{</mo><mfenced separators=\"|\"><mrow><mi>x</mi><mo>,</mo><mo>-</mo><mn>3</mn></mrow></mfenced><mo>:</mo><mi>x</mi><mo>≥</mo><mn>3</mn><mo>}</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation of the parabola can be rewritten as<br /><br /><math><msup><mrow><mo>(</mo><mi>y</mi><mo>-</mo><mn>1</mn><mo>)</mo></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mo>(</mo><mi>x</mi><mo>-</mo><mn>1</mn><mo>)</mo></math><br /><br />Axis of the parabola is <math><mi>y</mi><mo>=</mo><mn>1</mn></math>,<br />equation of normal is<br /><br /><math><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mi>m</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>-</mo><mn>2</mn><mi>m</mi><mo>-</mo><msup><mrow><mi>m</mi></mrow><mrow><mn>3</mn></mrow></msup></math><br /><br />Let <math><mo>(</mo><mi>h</mi><mo>,</mo><mi>&nbsp;</mi><mn>1</mn><mo>)</mo></math> is a point on its axis, then<br /><br /><math><mn>0</mn><mo>=</mo><mi>m</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>-</mo><mn>2</mn><mi>m</mi><mo>-</mo><msup><mrow><mi>m</mi></mrow><mrow><mn>3</mn></mrow></msup></math><br /><br /><math><mo>⇒</mo><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mi>h</mi><mo>-</mo><mn>3</mn></math><br /><br /><math><mo>⇒</mo><mi>h</mi><mo>&gt;</mo><mn>3</mn></math> for real &amp; distinct values of <math><mi>m</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637dc146ed2b071950", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "106", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The maximum number of points on the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>16</mn><mi>x</mi></math> which are equidistant from a variable point <math><mi>P</mi><mi mathvariant=\"normal\"></mi></math> (which lie inside the parabola) are", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "The maximum number of points on the parabola will be obtained when they are intersection point with a circle.<br />A circle can intersect a parabola at maximum&nbsp;<math><mn>4</mn></math> points<br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/a9f109f8-247c-4edf-b84a-e40aeacdec67.png\" style=\"max-width:100%; object-fit:contain\" style=\"width:1.96042in;height:1.44028in\" />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86352318703b9d7ee25", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "95", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the normals at two points <math><mfenced separators=\"|\"><mrow><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo><mi></mi><msub><mrow><mi>y</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>,</mo><msub><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math> of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> meets again on the parabola, where <math><msub><mrow><mi>x</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>8</mn><mo>,</mo></math> then <math><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><msub><mrow><mi>y</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>-</mo><msub><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced></math>&nbsp;is equal to", "image": null}, "options": [{"id": "h0RBO", "text": "<math><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "FrlM5", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "9clfO", "text": "<math><mn>4</mn></math>", "image": null, "isCorrect": true}, {"id": "hepYs", "text": "<math><mn>2</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><msub><mi>y</mi><mn>1</mn></msub></mrow></mfenced><mo>&#8801;</mo><mfenced><mrow><msup><msub><mi>t</mi><mn>1</mn></msub><mn>2</mn></msup><mo>,</mo><mn>2</mn><msub><mi>t</mi><mn>1</mn></msub></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><msub><mi>x</mi><mn>2</mn></msub><mo>,</mo><msub><mi>y</mi><mn>2</mn></msub></mrow></mfenced><mo>&#8801;</mo><mfenced><mrow><msup><msub><mi>t</mi><mn>2</mn></msub><mn>2</mn></msup><mo>,</mo><mn>2</mn><msub><mi>t</mi><mn>2</mn></msub></mrow></mfenced></math></p><p>Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>x</mi><mn>1</mn></msub><mo>+</mo><msub><mi>x</mi><mn>2</mn></msub><mo>=</mo><mn>8</mn></math>&nbsp;and both the normals again meets on the parabola,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><msubsup><mi>t</mi><mn>1</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>t</mi><mn>2</mn><mn>2</mn></msubsup><mo>=</mo><mn>8</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msub><mi>t</mi><mn>1</mn></msub><msub><mi>t</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn></math></p><p>On solving, we get,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced separators=\"|\"><mrow><msub><mi>t</mi><mn>1</mn></msub><mo>-</mo><msub><mi>t</mi><mn>2</mn></msub></mrow></mfenced><mn>2</mn></msup><mo>=</mo><mn>4</mn><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mfenced open=\"|\" close=\"|\" separators=\"|\"><mrow><msub><mi>t</mi><mn>1</mn></msub><mo>-</mo><msub><mi>t</mi><mn>2</mn></msub></mrow></mfenced><mo>=</mo><mn>2</mn><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mfenced open=\"|\" close=\"|\" separators=\"|\"><mrow><msub><mi>y</mi><mn>1</mn></msub><mo>-</mo><msub><mi>y</mi><mn>2</mn></msub></mrow></mfenced><mo>=</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86331c0a37e6588d1df", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let the normals at points&nbsp;<math><mi>A</mi><mfenced separators=\"|\"><mrow><mn>4</mn><mi>a</mi><mo>,</mo><mo>-</mo><mn>4</mn><mi>a</mi></mrow></mfenced></math> and <math><mi>B</mi><mfenced separators=\"|\"><mrow><mn>9</mn><mi>a</mi><mo>,</mo><mo>-</mo><mn>6</mn><mi>a</mi></mrow></mfenced></math> on the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>x</mi></math> meet at the point <math><mi>P</mi><mo>.</mo></math> The equation of the normal from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> on <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>a</mi><mi>x</mi></math>&nbsp;(other than <math><mi>P</mi><mi>A</mi></math> and&nbsp;<math><mi>P</mi><mi>B</mi></math>)&nbsp;is", "image": null}, "options": [{"id": "MWlcl", "text": "<math><mn>5</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>-</mo><mn>135</mn><mi>a</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "vczSq", "text": "<math><mn>5</mn><mi>x</mi><mo>-</mo><mi>y</mi><mo>+</mo><mn>115</mn><mi>a</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "MgE1d", "text": "<math><mn>5</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mn>115</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "3mvUQ", "text": "<math><mn>5</mn><mi>x</mi><mo>-</mo><mi>y</mi><mo>-</mo><mn>115</mn><mi>a</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi>a</mi><msubsup><mi>t</mi><mn>1</mn><mn>2</mn></msubsup><mo>,</mo><mn>2</mn><mi>a</mi><msub><mi>t</mi><mn>1</mn></msub></mrow></mfenced><mo>,</mo><mo>&nbsp;</mo><mi>B</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi>a</mi><msubsup><mi>t</mi><mn>2</mn><mn>2</mn></msubsup><mo>,</mo><mn>2</mn><mi>a</mi><msub><mi>t</mi><mn>2</mn></msub></mrow></mfenced></math><br />and the foot of the required normal is <math><mfenced separators=\"|\"><mrow><mi>a</mi><msubsup><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msubsup><mo>,</mo><mn>2</mn><mi>a</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msub></mrow></mfenced></math>, then<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>a</mi><msub><mi>t</mi><mn>1</mn></msub><mo>=</mo><mo>-</mo><mn>4</mn><mi>a</mi><mo>,</mo><mo>&nbsp;</mo><mn>2</mn><mi>a</mi><msub><mi>t</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>6</mn><mi>a</mi></math> and <math><msub><mrow><mi>t</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>+</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>+</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><msub><mi>t</mi><mn>1</mn></msub><mo>=</mo><mo>-</mo><mn>2</mn><mo>,</mo><mo>&nbsp;</mo><msub><mi>t</mi><mn>2</mn></msub><mo>=</mo><mo>-</mo><mn>3</mn></math> and&nbsp;<math><mo>-</mo><mn>2</mn><mo>-</mo><mn>3</mn><mo>+</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mn>0</mn></math><br /><math><mo>⇒</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mn>5</mn></math><br />Hence, the equation of the required normal is <math><mi>y</mi><mo>=</mo><mo>-</mo><msub><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msub><mi>x</mi><mo>+</mo><mn>2</mn><mi>a</mi><msub><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>+</mo><mi>a</mi><msubsup><mrow><mi>t</mi></mrow><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></msubsup></math><br /><math><mo>⇒</mo><mi>y</mi><mo>=</mo><mo>-</mo><mn>5</mn><mi>x</mi><mo>+</mo><mn>10</mn><mi>a</mi><mo>+</mo><mn>125</mn><mi>a</mi></math><br /><math><mo>⇒</mo><mi>y</mi><mo>+</mo><mn>5</mn><mi>x</mi><mo>-</mo><mn>135</mn><mi>a</mi><mo>=</mo><mn>0</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86310c2d688917872f8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "47", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If three normals are drawn from the point&nbsp;<math><mfenced separators=\"|\"><mrow><mi>c</mi><mo>,</mo><mn>0</mn></mrow></mfenced></math> to the parabola&nbsp;<math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>x</mi></math> and two of which are perpendicular, then the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi></math> is equal to", "image": null}, "options": [{"id": "HPBu5", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": true}, {"id": "xtUND", "text": "<math><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "jrvd8", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "mJUB5", "text": "<math><mn>6</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of the normal in slope form is <math><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo> mi mathvariant=\"normal\">h</mi></mrow></mfenced></math> respectively.<br />If <math><mi mathvariant=\"normal\">P</mi><mo>&#8801;</mo><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">&#945;</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">&#946;</mi></mrow></mfenced></math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">&#945;</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced separators=\"|\"><mrow><mfrac><msup><mi mathvariant=\"normal\">h</mi><mn>2</mn></msup><mn>4</mn></mfrac><mo>-</mo><mfrac><msup><mi mathvariant=\"normal\">h</mi><mn>2</mn></msup><mn>8</mn></mfrac></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">&#946;</mi><mo>=</mo><mi mathvariant=\"normal\">h</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mi mathvariant=\"normal\">&#945;</mi><mo>=</mo><mfrac><msup><mi mathvariant=\"normal\">h</mi><mn>2</mn></msup><mn>4</mn></mfrac><mfenced separators=\"|\"><mrow><mfrac><mn>1</mn><mn>1</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mo>=</mo><mfrac><msup><mi mathvariant=\"normal\">h</mi><mn>2</mn></msup><mn>8</mn></mfrac></math><br /><math><mo>&#8756;</mo></math> Locus of <math><mi mathvariant=\"normal\">P</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">x</mi><mo>=</mo><mfrac><msup><mi mathvariant=\"normal\">y</mi><mn>2</mn></msup><mn>16</mn></mfrac></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86388fd96f104c361a8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "22", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the line <math><mi>y</mi><mo>=</mo><mi>x</mi><mo>-</mo><mn>1</mn></math> bisects two chords of the parabola <math><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><mi>b</mi><mi>x</mi></math> which are passing through the point&nbsp;<math><mfenced separators=\"|\"><mrow><mi>b</mi><mo>,</mo><mo>-</mo><mn>2</mn><mi>b</mi></mrow></mfenced><mo>,</mo></math> then the length of the latus rectum can be equal to", "image": null}, "options": [{"id": "7Qphx", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": true}, {"id": "cOmWs", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "o0X6D", "text": "<math><mn>6</mn></math>", "image": null, "isCorrect": false}, {"id": "CqmRx", "text": "<math><mn>8</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Any point on <math><mi>y</mi><mo>=</mo><mi>x</mi><mo>–</mo><mn>1</mn></math> can be taken as <math><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>h</mi><mo>–</mo><mn>1</mn></mrow></mfenced></math><br />Taking <math><mfenced separators=\"|\"><mrow><mi>h</mi><mo>,</mo><mi>h</mi><mo>-</mo><mn>1</mn></mrow></mfenced></math> as the midpoint of chord, the equation of chord is <math><mi>y</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>-</mo><mn>4</mn><mi>b</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>x</mi><mo>+</mo><mi>h</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>h</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><mi>b</mi><mi>h</mi></math><br />Which passes through the point <math><mfenced separators=\"|\"><mrow><mi>b</mi><mo>,</mo><mo>-</mo><mn>2</mn><mi>b</mi></mrow></mfenced></math><br /><math><mo>⇒</mo></math> <math><mo>-</mo><mn>2</mn><mi>b</mi><mfenced separators=\"|\"><mrow><mi>h</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>-</mo><mn>2</mn><mi>b</mi><mfenced separators=\"|\"><mrow><mi>b</mi><mo>+</mo><mi>h</mi></mrow></mfenced><mo>=</mo><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>h</mi><mo>+</mo><mn>1</mn><mo>-</mo><mn>4</mn><mi>b</mi><mi>h</mi></math><br /><math><mo>⇒</mo></math> <math><msup><mrow><mi>h</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>h</mi><mo>+</mo><mfenced separators=\"|\"><mrow><mn>2</mn><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>b</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math><br />As, above equation has two real roots, hence,&nbsp;<br /><math><msup><mrow><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>2</mn><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>b</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mo>&gt;</mo><mn>0</mn></math><br /><math><mo>⇒</mo></math> <math><mn>2</mn><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>b</mi><mo>&lt;</mo><mn>0</mn><mo>⇒</mo><mi>b</mi><mo>&lt;</mo><mn>1</mn><mo>⇒</mo><mn>4</mn><mi>b</mi><mo>&lt;</mo><mn>4</mn></math><br /><math><mo>⇒</mo></math>&nbsp;length of latus rectum is less than <math><mn>4</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
