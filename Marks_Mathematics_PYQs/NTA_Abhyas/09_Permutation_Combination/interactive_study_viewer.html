of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> digits, but those numbers should be omitted in which <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn></math> comes at hundreds place}.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86318b7867159bb0800", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "20", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Number of words that can be formed with the letters of the word <math><mi>A</mi><mi>L</mi><mi>G</mi><mi>E</mi><mi>B</mi><mi>R</mi><mi>A</mi></math> so that all the vowels are separated (or no two vowels come together) is", "image": null}, "options": [{"id": "MVXG8", "text": "<math><mn>720</mn></math>", "image": null, "isCorrect": true}, {"id": "WF8dq", "text": "<math><mn>2160</mn></math>", "image": null, "isCorrect": false}, {"id": "FG0m0", "text": "<math><mn>1440</mn></math>", "image": null, "isCorrect": false}, {"id": "dQA2e", "text": "<math><mn>1200</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Vowels are <math><mi>A</mi><mo>,</mo><mi></mi><mi>E</mi><mo>,</mo><mi></mi><mi>A</mi></math>  <br/>Consonants are <math><mi>L</mi><mo>,</mo><mi>G</mi><mo>,</mo><mi>B</mi><mo>,</mo><mi>R</mi></math>  <br/><math><mi>X</mi><mi></mi><mi>L</mi><mi></mi><mi>X</mi><mi></mi><mi>G</mi><mi></mi><mi>X</mi><mi></mi><mi>B</mi><mi></mi><mi>X</mi><mi></mi><mi>R</mi><mi></mi><mi>X</mi></math>  <br/>Since there is no restriction on consonants, we must place them first and they can be arranged in <math><mn>4</mn><mo>!</mo><mo>=</mo><mn>24</mn></math> days. <br/>Now to arrange vowels so that no two of them are together we have <math><mn>5</mn></math> places <math><mfenced separators=\"|\"><mrow><mi>X</mi></mrow></mfenced><mo>.</mo></math> Out of these <math><mn>5</mn></math> places, <math><mn>3</mn></math> can be selected in <math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>5</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub></math> ways and then one arrangement can be made in <math><mfrac><mrow><mn>3</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac></math> ways. <br/>Thus, required ways <math><mo>=</mo><mn>4</mn><mo>!</mo><mo>×</mo><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>5</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>×</mo><mfrac><mrow><mn>3</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>720</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86303dea9d5d52a13de", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "05", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "There are eight rooms on the first floor of a hotel, with four rooms on each side of the corridor, symmetrically situated (that is each room is exactly opposite to one other room). Four guests have to be accommodated in four of the eight rooms (that is, one in each) such that no two guests are in adjacent rooms or in opposite rooms. If <math> <mi>N</mi> </math> is the number of ways in which guests can be accommodated. Then the value of <math><mfrac><mrow><mi>N</mi></mrow><mn>6</mn></mfrac></math> is", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "Clearly guests will stay either in '✓' or in '×'<br /><br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/qhncnjswdanqprwxcetgvvnzbsfgiobfiabzqgnnswxsuyqyvk.jpeg\" /><br /><br />Therefore, number of required ways <math><mo>=</mo><mn>2</mn><mo>×</mo><mn>4</mn><mo>!</mo><mo>=</mo><mn>48</mn></math> .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86301dd2a23b7cd763c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math> objects are arranged in a row, then the number of ways of selecting three objects such that no two of them are next to each other is", "image": null}, "options": [{"id": "tLe6R", "text": "<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mi>n</mi><mo>-</mo><mn>3</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "G2PUE", "text": "<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mi>n</mi><mo>-</mo><mn>3</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "jXido", "text": "<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mi>n</mi><mo>-</mo><mn>2</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub></math>", "image": null, "isCorrect": false}, {"id": "9tqvX", "text": "<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mi>n</mi><mo>-</mo><mn>2</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let \\(x\\) be the number of objects to the left of the first object chosen, \\(y\\) the number of objects between the first and the second, \\(\\mathrm{z}\\) the number of objects between the second and the third and \\(u\\) the number of objects to the right of the third objects. Then, \\(x, u \\geq 0 ; y, z \\geq 1\\) and \\(x+y+z+u=n-3\\). Let \\(y_{1}=\\) \\(\\mathrm{y}-1\\) and \\(\\mathrm{z}_{1}=\\mathrm{z}-1\\). Then, \\(\\mathrm{y}_{1} \\geq 0, \\mathrm{z}_{1} \\geq 0\\) such that \\(\\mathrm{x}+\\mathrm{y}_{1}+\\mathrm{z}_{1}+\\mathrm{u}=\\mathrm{n}-5\\). The total number of non-negative integral solutions of this equation is \\({ }^{\\mathrm{n}-5+4-1} \\mathrm{C}_{4-1}={ }^{\\mathrm{n}-2} \\mathrm{C}_{3} .\\)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "6aa3ab79aa8dc1ff68177fdd", "title": "Circular Permutation", "totalQuestions": 5, "questions": [{"_id": "6151e863beaa7774cbb442f0", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A total of <math><mn>6</mn></math> Boys and <math><mn>6</mn></math> girls are to sit in a row alternatively and in a circle.&nbsp;Let <math><mtext mathvariant=\"normal\">m</mtext></math> be the number of arrangements in the row and <math><mtext mathvariant=\"normal\">n</mtext></math> be the number of arrangements in the circle. If <math><mtext mathvariant=\"normal\">k</mtext><mo>=</mo><mfrac><mrow><mtext mathvariant=\"normal\">m</mtext></mrow><mrow><mn>10</mn><mtext mathvariant=\"normal\">n</mtext></mrow></mfrac></math>, then the value of <math><mtext>k</mtext></math> is", "image": null}, "options": [], "correctValue": "1.2", "solution": {"text": "<p>Linear permutations with boy in the first place are&nbsp;of the form <math><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">G</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">G</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">G</mi></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>4</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">G</mi></mrow><mrow><mn>4</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>5</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">G</mi></mrow><mrow><mn>5</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>6</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">G</mi></mrow><mrow><mn>6</mn></mrow></msub></math> and the number of such arrangements is <math><mn>6</mn><mo>!</mo><mo>×</mo><mn>6</mn><mo>!</mo><mo>.</mo></math><br />The number of linear permutations with girl in the first place is <math><mn>6</mn><mo>!</mo><mo>×</mo><mn>6</mn><mo>!</mo></math><br />So, the number of arrangements in row&nbsp;<math><mo>=</mo><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>2</mn><mo>×</mo><mn>6</mn><mo>!</mo><mo>×</mo><mn>6</mn><mo>!</mo></math><br />(In circular permutations, start with a place which can be filled by a boy or a girl and after that the arrangements become linear)</p><p>Placing the boys first and then arranging the girls in <math><mn>6</mn></math> gaps, the number of such circular arrangements is <math><mn>5</mn><mo>!</mo><mo>×</mo><mn>6</mn><mo>!</mo><mo>⇒</mo><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>5</mn><mo>!</mo><mo>×</mo><mn>6</mn><mo>!</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">k</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">m</mi><mrow><mn>10</mn><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mo>×</mo><mn>6</mn><mo>!</mo><mo>×</mo><mn>6</mn><mo>!</mo></mrow><mrow><mn>10</mn><mo>×</mo><mn>5</mn><mo>!</mo><mo>×</mo><mn>6</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mfrac><mn>12</mn><mn>10</mn></mfrac><mo>=</mo><mn>1.2</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b4f581ecc5d73b09", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "93", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of ways in which <math><mn>10</mn></math> boys can take positions around a circular round table, if two particular boys must not be seated side by side, is", "image": null}, "options": [{"id": "RezN3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#215;</mo><mn>48</mn><mo>!</mo></math>", "image": null, "isCorrect": false}, {"id": "W4q12", "text": "<math><mn>12</mn></math>", "image": null, "isCorrect": false}, {"id": "S9s86", "text": "<math><mn>360</mn></math>", "image": null, "isCorrect": false}, {"id": "rycjl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&#215;</mo><mn>8</mn><mo>!</mo></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Total number of ways without any restriction <math><mo>=</mo><mn>9</mn><mo>!</mo></math><br />Considering two of the particular boys sit together and then assuming them as one, the total no. of ways <math><mo>=</mo><mn>8</mn><mo>!</mo></math><br />They them selves can be arranged in <math><mn>2</mn></math> ways.<br />So, the required number of ways<br /><math><mo>=</mo><mn>9</mn><mo>!</mo><mo>-</mo><mn>2</mn><mo>×</mo><mn>8</mn><mo>!</mo><mo>=</mo><mn>7</mn><mo>×</mo><mn>8</mn><mo>!</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a83d94203b6c7697", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "94", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "There are fifty persons among whom <math><mn>2</mn></math> are brothers. The number of ways they can be arranged in a circle, if there is exactly one person between the two brothers, is", "image": null}, "options": [{"id": "0FoWC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#215;</mo><mn>48</mn><mo>!</mo></math>", "image": null, "isCorrect": true}, {"id": "DAGym", "text": "<math><mn>12</mn></math>", "image": null, "isCorrect": false}, {"id": "9GkbV", "text": "<math><mn>360</mn></math>", "image": null, "isCorrect": false}, {"id": "8ePEB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&#215;</mo><mn>8</mn><mo>!</mo></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider three persons as one unit. This unit and remaining <math><mn>47</mn></math> persons (total <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>48</mn></math>)&nbsp;can be arranged in a circle in <math><mn>47</mn><mo>!</mo><mi>&#160;</mi></math>&nbsp;ways.<br /><br />In this unit, the two brothers can be interchanged in <math><mn>2</mn></math> ways.<br /><br />The person between the two brothers can be any of the remaining <math><mn>48</mn></math> persons who can be selected in <math> <mrow> <mmultiscripts> <mi>C</mi> <mprescripts></mprescripts> <mo>&#160;</mo> <mrow> <mn>48</mn></mrow> </mmultiscripts> <msub> <mrow></mrow> <mn>1</mn> </msub> </mrow> </math> ways.<br /><br />Hence, the required number of ways <math> <mrow> <mo>=</mo><mmultiscripts> <mi>C</mi> <mprescripts></mprescripts> <mo>&#160;</mo> <mrow> <mn>48</mn></mrow> </mmultiscripts> <msub> <mrow></mrow> <mn>1</mn> </msub> <mo>&#215;</mo><mn>47</mn><mo>!</mo><mo>&#215;</mo><mn>2</mn><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>48</mn><mo>!</mo></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86337d96662e9341749", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "44", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of ways in which <math><mn>5</mn></math> boys and <math><mn>4</mn></math>&nbsp;girls can be arranged on a circular table such that no two girls sit together and two particular boys are always together is", "image": null}, "options": [{"id": "oehFi", "text": "<math><mn>288</mn></math>", "image": null, "isCorrect": true}, {"id": "PAl44", "text": "<math><mn>44</mn></math>", "image": null, "isCorrect": false}, {"id": "0eAQY", "text": "<math><mn>720</mn></math>", "image": null, "isCorrect": false}, {"id": "J4iIo", "text": "<math><mn>540</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let two particular boys as one boy, we have only four boys which can be seated at a round table in <math><mn>3</mn><mo>!</mo></math>&nbsp;ways.<br />The two boys together can be arranged in <math><mn>2</mn></math> ways.<br />So, boys can be seated in <math><mn>2</mn><mo>×</mo><mn>3</mn><mo>!</mo></math> ways.<br /><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/88b5a81a-ed13-498c-87b9-86e1934b75b1.png\" style=\"width:1.66667in;height:1.67986in\" /><br /><math><msub><mrow><mi>B</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msub></math> are together. Now <math><mn>4</mn></math> girls can be seated at four places (marked <math><mo>×</mo></math>) in <math><mn>4</mn><mo>!</mo></math> ways.<br /><math><mo>⇒</mo></math> Required number of ways <math><mo>=</mo><mn>3</mn><mo>!</mo><mo>×</mo><mn>2</mn><mo>×</mo><mn>4</mn><mo>!</mo></math><br /><math><mo>=</mo><mn>6</mn><mo>×</mo><mn>2</mn><mo>×</mo><mn>24</mn><mo>=</mo><mn>288</mn></math> ways", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631c999a55240bc406", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "02", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of ways of arranging <math><mn>8</mn></math> men and <math><mn>4</mn></math> women around a circular table such that no two women can sit together, is", "image": null}, "options": [{"id": "qscJU", "text": "<math><mn>8</mn><mo>!</mo></math>", "image": null, "isCorrect": false}, {"id": "vFeMD", "text": "<math><mn>4</mn><mo>!</mo></math>", "image": null, "isCorrect": false}, {"id": "fKGIX", "text": "<math><mn>8</mn><mo>!</mo><mn>4</mn><mo>!</mo></math>", "image": null, "isCorrect": false}, {"id": "Lm3vb", "text": "<math><mn>7 h/MathML\"><mn>4</mn></math> same, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> unique&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><msub><mi>C</mi><mn>1</mn></msub><mo>&#215;</mo><mn>4</mn><msub><mi>C</mi><mn>1</mn></msub><mo>=</mo><mn>8</mn></math><br />case(vii): all <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> same <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn></math><br />Hence, total number of ways&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>71</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863cd0f4d1fb83d062b", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "40", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of the positive integral solutions <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">x</mi><mo>,</mo><mi mathvariant=\"normal\">y</mi><mo>,</mo><mi mathvariant=\"normal\">z</mi></mrow></mfenced></math> of the equation <math><mi mathvariant=\"normal\">x</mi><mi mathvariant=\"normal\">y</mi><mi mathvariant=\"normal\">z</mi><mo>=</mo><mn>24</mn></math> is <math><mi mathvariant=\"normal\">t</mi></math>, then the number of all possible factors of <math><mi mathvariant=\"normal\">t</mi></math> is", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "<math><mn>24</mn><mo>=</mo><mn>1.1</mn><mo>.</mo><mn>24</mn><mo>=</mo><mn>1.2</mn><mo>.</mo><mn>12</mn><mo>=</mo><mn>1.3</mn><mo>.</mo><mn>8</mn><mo>=</mo><mn>1.4</mn><mo>.</mo><mn>6</mn><mo>=</mo><mn>2.2</mn><mo>.</mo><mn>6</mn><mo>=</mo><mn>2.3</mn><mo>.</mo><mn /mfenced></math>, there will be one way to group others <math><mfenced separators=\"|\"><mrow><mn>2,4</mn><mo>,</mo><mn>6,8</mn></mrow></mfenced><mo>,</mo><mfenced separators=\"|\"><mrow><mn>9,10,11,12</mn></mrow></mfenced></math>.</p><p>If the group containing <math><mn>1</mn></math> has common difference&nbsp;<math><mo>=</mo><mn>3</mn></math> i.e. if one group is <math><mfenced separators=\"|\"><mrow><mn>1,4</mn><mo>,</mo><mn>7,10</mn></mrow></mfenced></math> there will be one way to group others <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mn>5</mn><mo>,</mo><mn>8</mn><mo>,</mo><mn>11</mn></mrow></mfenced><mo>,</mo><mfenced separators=\"|\"><mrow><mn>3</mn><mo>,</mo><mn>6</mn><mo>,</mo><mn>9</mn><mo>,</mo><mn>12</mn></mrow></mfenced></math><br /><math><mo>⇒</mo><mi></mi></math> The number of ways <math><mo>=</mo><mn>2</mn><mo>+</mo><mn>1</mn><mo>+</mo><mn>1</mn><mo>=</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863388c917e3ccd4162", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "15", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the number of ways in which four distinct balls can be put into two identical boxes such that no box remains empty is equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math>, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi></math> is", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "Every ball has two options<br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>&#160;</mi><mn>4</mn><mi>&#160;</mi></math> balls can be put in <math><msup><mrow><mn>2</mn></mrow><mrow><mn>4</mn></mrow></msup></math> ways.<br /><br />Arrangement among themselves is&nbsp;<math><mn>2</mn><mo>!</mo></math><br /><br />So, total ways<math><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mo>&#215;</mo><msup><mrow><mn>2</mn></mrow><mrow><mn>4</mn></mrow></msup><mo>=</mo><mi>&#160;</mi><msup><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></msup></math><br /><br />But, above count also includes the one case in which all the balls are put in one box,<br /><br /><math><mo>&#8658;</mo><mi>&#160;</mi></math> required number of ways&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mi>&#160;</mi><msup><mn>2</mn><mn>3</mn></msup><mo>-</mo><mn>1</mn><mo>=</mo><mn>7</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863367638ea4e1bee7b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "92", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of ways in which four different toys and five indistinguishable marbles can be distributed between <math><mn>3</mn></math> boys, if each boy receives at least one toy and at least one marble, is", "image": null}, "options": [{"id": "27fas", "text": "<math><mn>42</mn></math>", "image": null, "isCorrect": false}, {"id": "a3nwH", "text": "<math><mn>100</mn></math>", "image": null, "isCorrect": false}, {"id": "u27Vn", "text": "<math><mn>150</mn></math>", "image": null, "isCorrect": false}, {"id": "RNoxo", "text": "<math><mn>216</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><mn>5</mn></math> identical marbles can be distributed to <math><mn>3</mn></math> boys, each receiving at least one in&nbsp;<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>5</mn><mo>-</mo><mn>1</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn><mo>-</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mmultiscripts><mrow><mi>C</mi></mrow><mprescripts></mprescripts><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>4</mn></mrow></mmultiscripts></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\"></mi></math> ways<br /><math><mn>4</mn></math> different toys can be grouped as <math><mn>2</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>1</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>1</mn></math> in&nbsp;<math><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo><mn>1</mn><mo>!</mo><mn>1</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac></math> ways<br />Two boys will get <math><mn>1</mn></math> each and they can be selected in <math><mmultiscripts><mrow><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mprescripts></mprescripts><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>3</mn></mrow></mmultiscripts></math> ways.<br />Required number of ways <math><mo>=</mo><msub><mrow><mmultiscripts><mrow><mi>C</mi></mrow><mprescripts></mprescripts><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>4</mn></mrow></mmultiscripts></mrow><mrow><mn>2</mn></mrow></msub><mo>&#215;</mo><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mo>&#215;</mo><msub><mrow><mmultiscripts><mrow><mi>C</mi></mrow><mprescripts></mprescripts><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>3</mn></mrow></mmultiscripts></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>6</mn><mo>&#215;</mo><mn>12</mn><mo>&#215;</mo><mn>3</mn><mo>=</mo><mn>216</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "no d": null}, {"_id": "6151e863367638ea4e1bee7b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "92", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of ways in which four different toys and five indistinguishable marbles can be distributed between <math><mn>3</mn></math> boys, if each boy receives at least one toy and at least one marble, is", "image": null}, "options": [{"id": "27fas", "text": "<math><mn>42</mn></math>", "image": null, "isCorrect": false}, {"id": "a3nwH", "text": "<math><mn>100</mn></math>", "image": null, "isCorrect": false}, {"id": "u27Vn", "text": "<math><mn>150</mn></math>", "image": null, "isCorrect": false}, {"id": "RNoxo", "text": "<math><mn>216</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><mn>5</mn></math> identical marbles can be distributed to <math><mn>3</mn></math> boys, each receiving at least one in&nbsp;<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>5</mn><mo>-</mo><mn>1</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn><mo>-</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mmultiscripts><mrow><mi>C</mi></mrow><mprescripts></mprescripts><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>4</mn></mrow></mmultiscripts></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\"></mi></math> ways<br /><math><mn>4</mn></math> different toys can be grouped as <math><mn>2</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>1</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>1</mn></math> in&nbsp;<math><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo><mn>1</mn><mo>!</mo><mn>1</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac></math> way <mo>,</mo><mn>6</mn><mi>c</mi><mo>,</mo><mn>60</mn></math> are divisible by <math><mn>3</mn><mo>,</mo></math> hence <math><mn>2</mn><mi>a</mi></math> is divisible by <math><mn>3</mn></math><br />Similarly <math><mn>2</mn><mi>a</mi><mo>,</mo><mn>6</mn><mi>c</mi><mo>,</mo><mn>60</mn></math> are even numbers hence <math><mn>3</mn><mi>b</mi></math> is an even number<br />Therefore <math><mi>a</mi><mo>=</mo><mn>3</mn><msub><mrow><mi>k</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo><mi></mi><mi>b</mi><mo>=</mo><mn>2</mn><msub><mrow><mi>k</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br />So the equation reduces to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><msub><mi>k</mi><mn>2</mn></msub><mo>+</mo><mi>C</mi><mo>=</mo><mn>10</mn><mo>,</mo><mo>&#160;</mo><mo>&#8704;</mo><msub><mi>k</mi><mn>1</mn></msub><mo>,</mo><msub><mi>k</mi><mn>2</mn></msub><mo>,</mo><mi>C</mi><mo>&#8712;</mo><mi>N</mi></math><br />Hence, the number of solutions <math><mo>=</mo><mmultiscripts><mrow><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mn>36</mn></mrow><mprescripts></mprescripts><mrow><mi></mi></mrow><mrow><mn>9</mn></mrow></mmultiscripts></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8632ea4c8642036f2d2", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "64", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of ordered pairs of positive integers <math><mfenced separators=\"|\"><mrow><mi>a</mi><mo>,</mo><mi>b</mi></mrow></mfenced><mo>,</mo></math> such that their Least Common Multiple is the given positive integer <math><msup><mrow><mn>7</ <mi mathvariant=\"normal\">t</mi></mrow><mrow><mn>8</mn></mrow></mfrac></math>&nbsp;is", "image": null}, "options": [], "correctValue": "9", "solution": {"text": "<math><mn>18</mn><mo>=</mo><mn>1.1</mn><mo>.</mo><mn>18</mn><mo>=</mo><mn>1.2</mn><mo>.</mo><mn>9</mn><mo>=</mo><mn>1.3</mn><mo>.</mo><mn>6</mn><mo>=</mo><mn>2.3</mn><mo>.</mo><mn>3</mn></math><br />Each of <math><mfenced separators=\"|\"><mrow><mn>1,2</mn><mo>,</mo><mn>9</mn></mrow></mfenced><mo>,</mo><mfenced separators=\"|\"><mrow><mn>1,3</mn><mo>,</mo><mn>6</mn></mrow></mfenced></math> can be permuted in <math><mn>3</mn><mo>!</mo></math> ways<br />Each of <math><mfenced separators=\"|\"><mrow><mn>1,1</mn><mo>,</mo><mn>18</mn></mrow></mfenced><mo>,</mo><mfenced separators=\"|\"><mrow><mn>2,3</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math> can be permuted in <math><mn>3</mn></math> ways<br />So, there are <math><mn>2</mn><mo>×</mo><mn>3</mn><mo>!</mo><mo>+</mo><mn>2</mn><mo>×</mo><mn>3</mn><mo>=</mo><mn>18</mn></math> triplets <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">x</mi><mo>,</mo><mi mathvariant=\"normal\">y</mi><mo>,</mo><mi mathvariant=\"normal\">z</mi></mrow></mfenced></math><br />Also, the signs are<br /><math><mfenced separators=\"|\"><mrow><mo>+</mo><mo>,</mo><mo>–</mo><mo>,</mo><mo>–</mo></mrow></mfenced><mo>,</mo><mfenced separators=\"|\"><mrow><mo>–</mo><mo>,</mo><mo>+</mo><mo>,</mo><mo>–</mo></mrow></mfenced><mo>,</mo><mfenced separators=\"|\"><mrow><mo>–</mo><mo>,</mo><mo>–</mo><mo>,</mo><mo>+</mo></mrow></mfenced><mo>,</mo><mfenced separators=\"|\"><mrow><mo>+</mo><mo>,</mo><mo>+</mo><mo>,</mo><mo>+</mo><mo>,</mo></mrow></mfenced></math><br />So, the desired number is <math><mn>18</mn><mo>×</mo><mn>4</mn><mo>=</mo><mn>72</mn></math><br />Hence,&nbsp;<br /><math><mfrac><mrow><mn>72</mn></mrow><mrow><mn>8</mn></mrow></mfrac><mo>=</mo><mn>9</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousY ue, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of times the digit <math><mn>0</mn></math> is used in writing the numbers from <math><mn>1</mn></math> to <math><mn>1000</mn></math>&nbsp;is equal to", "image": null}, "options": [{"id": "h4HJ5", "text": "<math><mi mathvariant=\"normal\"></mi><mn>189</mn></math>", "image": null, "isCorrect": false}, {"id": "2Gx4W", "text": "<math><mn>300</mn></math>", "image": null, "isCorrect": false}, {"id": "l80zs", "text": "<math><mn>192</mn></math>", "image": null, "isCorrect": true}, {"id": "DV2KE", "text": "<math><mn>270</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Consider the number from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>000,</mn><mo>&nbsp;</mo><mn>001,</mn><mo>&nbsp;</mo><mn>002</mn><mo>,</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>,</mo><mo>&nbsp;</mo><mn>998,</mn><mo>&nbsp;</mo><mn>999</mn><mo>.</mo></math><br />Since, each digit has an equal likelihood of coming and digits used are <math><mn>3</mn><mo>×</mo><mn>1000</mn><mo>.</mo></math><br />Hence, 0 appears&nbsp;<math><mo>=</mo><mn>300</mn></math> times<br />But,&nbsp;<math><mn>000,001,002</mn><mo>,</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>,</mo><mn>098,099</mn><mo>;</mo></math><br />have some unwanted zeros, we subtract<br />these zero’s i.e. <math><mn>3</mn><mo>×</mo><mn>1</mn><mo>+</mo><mn>2</mn><mo>×</mo><mn>9</mn><mo>+</mo><mn>1</mn><mo>×</mo><mn>90</mn><mo>=</mo><mn>111</mn><mo>.</mo></math><br />Thus, total times 0 appears&nbsp;<math><mo>=</mo><mn>300</mn><mo>-</mo><mn>111</mn><mo>=</mo><mn>189</mn></math><br />Also, add <math><mn>3</mn></math> zero’s in 1000.<br /><math><mo>⇒</mo><mn>189</mn><mo>+</mo><mn>3</mn><mo>=</mo><mn>192</mn><mo>.</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e  <mo>+</mo> <mtext>.....</mtext> <mo>+</mo> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mn>2</mn> <mi>n</mi> <mo>-</mo> <mn>1</mn> </mrow> </mfenced> </mrow> </mfenced> <mo>=</mo> <msup> <mtext>m</mtext> <mn>2</mn> </msup> <msup> <mi>n</mi> <mn>2</mn> </msup> </mrow> </math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863025d7c68f104fdec", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "96", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If there are nine straight lines of which five are concurrent at a point and the other four are concurrent at another point and no two of these nine lines are parallel, then the number of points of intersection is equal to", "image": null}, "options": [{"id": "Ygvbp", "text": "<math><mn>20</mn></math>", "image": null, "isCorrect": false}, {"id": "7bHuQ", "text": "<math><mn>22</mn></math>", "image": null, "isCorrect": true}, {"id": "TEOFN", "text": "<math><mn>36</mn></math>", "image": null, "isCorrect": false}, {"id": "K8YXF", "text": "<math><mn>38</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Nine straight lines will intersect at <math><mmultiscripts><mrow><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mprescripts></mprescripts><mrow><mi></mi></mrow><mrow><mi></mi><mn>9</mn></mrow></mmultiscripts></math> points<br />Five are concurrent at one point so there will be loss of <math><mmultiscripts><mrow><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mprescripts></mprescripts><mrow><mi></mi></mrow><mrow><mn>5</mn></mrow></mmultiscripts></math> points<br />Four othe ", "image": null, "isCorrect": true}, {"id": "Fq40T", "text": "<math><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "hUuwm", "text": "<math><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "caoz5", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that,&nbsp;<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>100</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>50</mn></mrow></msub><mo>=</mo><mfrac><mrow><mn>100</mn><mo>!</mo></mrow><mrow><mn>50</mn><mo>!</mo><mn>50</mn><mo>!</mo></mrow></mfrac></math><br />The exponent of <math><mn>7</mn></math> in <math><mn>50</mn><mo>!</mo></math> is<br /><math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>50</mn></mrow><mrow><mn>7</mn></mrow></mfrac></mrow></mfenced><mo>+</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>50</mn></mrow><mrow><msup><mrow><mn>7</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>7</mn><mo>+</mo><mn>1</mn><mo>=</mo><mn>8</mn></math><br />And the exponent of <math><mn>7</mn></math> in <math><mn>100</mn><mo>!</mo></math> is<br /><math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>100</mn></mrow><mrow><mn>7</mn></mrow></mfrac></mrow></mfenced><mo>+</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mn>100</mn></mrow><mrow><msup><mrow><mn>7</mn></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>14</mn><mo>+</mo><mn>2</mn><mo>=</mo><mn>1</mn><mn>6</mn></math><br />Thus, the exponent of <math><mn>7</mn></math> in <math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>100</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>50</mn></mrow></msub></math> is <math><mn>16</mn><mo>-</mo><mn>2</mn><mo>×</mo><mn>8</mn><mo>=</mo><mn>0</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
