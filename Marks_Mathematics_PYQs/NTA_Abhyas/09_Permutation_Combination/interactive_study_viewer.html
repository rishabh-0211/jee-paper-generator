xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi>C</mi><mn>3</mn><none></none><mprescripts></mprescripts><mrow></mrow><mn>13</mn></mmultiscripts><mo>×</mo><mfrac><mrow><mn>12</mn><mo>!</mo></mrow><mrow><mn>5</mn><mo>!</mo><mn>3</mn><mo>!</mo><mn>2</mn><mo>!</mo></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "All <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>AAAAA</mi><mo>,</mo><mo>&nbsp;</mo><mi>CCC</mi><mo>,</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">D</mi><mo>,</mo><mo>&nbsp;</mo><mi>EE</mi><mo>,</mo><mo>&nbsp;</mo><mi mathvariant=\"normal\">F</mi></math> can be arranged in <math><mfrac><mrow><mn>12</mn><mo>!</mo></mrow><mrow><mn>5</mn><mo>!</mo><mi mathvariant=\"normal\"></mi><mn>3</mn><mo>!</mo><mi mathvariant=\"normal\"></mi><mn>2</mn><mo>!</mo></mrow></mfrac></math> ways.<br />Between the gaps <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">B</mi></math> can be arranged in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi>C</mi><mn>3</mn><none></none><mprescripts></mprescripts><mrow></mrow><mn>13</mn></mmultiscripts></math> ways<br />Hence, the total number of ways <math><mo>=</mo><msub><mrow><mmultiscripts><mrow><mi>C</mi></mrow><mprescripts></mprescripts><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>13</mn></mrow></mmultiscripts></mrow><mrow><mn>3</mn></mrow></msub><mo>×</mo><mfrac><mrow><mn>12</mn><mo>!</mo></mrow><mrow><mn>5</mn><mo>!</mo><mi mathvariant=\"normal\"></mi><mn>3</mn><mo>!</mo><mi mathvariant=\"normal\"></mi><mn>2</mn><mo>!</mo></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f43db4b6919f7145", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "How many words, with or without meaning can be made from the letters of the word <math><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">D</mi><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">Y</mi></math>, assuming that no letter is repeated, if&nbsp;<math><mn>4</mn></math> letters are used at a time?", "image": null}, "options": [{"id": "tPVj3", "text": "<math><mn>360</mn></math>", "image": null, "isCorrect": true}, {"id": "cXcjZ", "text": "<math><mn>350</mn></math>", "image": null, "isCorrect": false}, {"id": "2xxsB", "text": "<math><mn>400</mn></math>", "image": null, "isCorrect": false}, {"id": "NtBRd", "text": "<math><mn>390</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">D</mi><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">Y</mi></math> has <math><mn>6</mn></math> letters<br /><br /><math><mn>4</mn></math> letters are taken at a time<br /><br />∴ Number of words <math><mo>=</mo><msup><mrow><mi mathvariant=\"normal\">&nbsp;</mi></mrow><mrow><mn>6</mn></mrow></msup><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>4</mn></mrow></msub></math><br /><br />&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <math><mo>=</mo><mn>6</mn><mo>×</mo><mn>5</mn><mo>×</mo><mn>4</mn><mo>×</mo><mn>3</mn><mo>=</mo><mn>360</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f2a81b90adf4ce47", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the number of five-digit numbers which can be read in the same way from the left and from the right is <math><mi>k</mi></math>, then <math><mfrac><mrow><mi>k</mi></mrow><mrow><mn>100</mn></mrow></mfrac></math> is equal to", "image": null}, "options": [], "correctValue": "9", "solution": {"text": "<p>The number will be of the form <math><mi>X</mi><mi>Y</mi><mi>Z</mi><mi>Y</mi><mi>X</mi></math> first place can&rsquo;t be zero, so it can be any <math><mn>1</mn></math> to <math><mn>9</mn><mo>&#8658;</mo><mn>9</mn></math> ways</p><p><math><mi>Y</mi></math> and <math><mi>Z</mi></math> each can be any of <math><mn>0</mn></math> and <math><mn>9</mn></math> so, they can be filled in <math><mn>10</mn></math> ways each.<br />The fourth place will be the same as second place and the last place will be the same as the first place.<br />So, the required number of ways <math><mo>=</mo><mn>9</mn><mo>&#215;</mo><mn>10</mn><mo>&#215;</mo><mn>10</mn><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><mn>1</mn><mo>=</mo><mn>900</mn></math><br /><math><mo>&#8658;</mo><mi>k</mi><mo>=</mo><mn>900</mn><mo>&#8658;</mo><mfrac><mrow><mi>k</mi></mrow><mrow><mn>100</mn></mrow></mfrac><mo>=</mo><mn>9</mn><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e6ac709dd844d199", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "54", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A straight is a five card hand containing consecutive values. If <math><mi>m</mi></math> is equal to the number of ways in which all the five cards, in a straight, are not from the same suit, then the value of&nbsp;<math><mfrac><mrow><mi>m</mi></mrow><mrow><mn>1500</mn></mrow></mfrac></math> is equal to (Consider the value of&nbsp;<math><mi>J</mi></math>&nbsp;as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn><mo>,</mo><mo>&nbsp;</mo><mi>Q</mi></math>&nbsp;as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>,</mo><mo>&nbsp;</mo><mi>K</mi></math>&nbsp;as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>13</mn></math>&nbsp;and&nbsp;Ace as <math><mn>14</mn></math>)", "image": null}, "options": [], "correctValue": "6.12", "solution": {"text": "Five consecutive cards can be chosen out of <math><mn>13</mn></math>&nbsp;cards in <math><mn>9</mn></math> ways. <math><mfenced separators=\"|\"><mrow><mn>2,3</mn><mo>,</mo><mn>4,5</mn><mo>,</mo><mn>6</mn></mrow></mfenced><mo>,</mo><mfenced separators=\"|\"><mrow><mn>3,4</mn><mo>,</mo><mn>5,6</mn><mo>,</mo><mn>7</mn></mrow></mfenced><mo>,</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced separators=\"|\"><mrow><mn>10</mn><mo>,</mo><mi>J</mi><mo>,</mo><mi>Q</mi><mo>,</mo><mi>K</mi><mo>,</mo><mi>A</mi></mrow></mfenced><mo>.</mo></math> The first card can be chosen in <math><mn>4</mn></math> ways (spades, hearts, diamonds and clubs). The second and the subsequent cards, too, can be chosen in <math><mn>4</mn></math> ways.<br />Thus, there are <math><msup><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></msup></math> ways to choose the five cards.<br />The number of ways in which all the five cards are not from the same suit is <math><msup><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></msup><mo>-</mo><mn>4</mn><mo>=</mo><mn>1020</mn><mo>.</mo></math><br />So, the number of straights in this case is <math><mi>m</mi><mo>=</mo><mn>9</mn><mo>×</mo><mn>1020</mn><mo>⇒</mo><mfrac><mrow><mi>m</mi></mrow><mrow><mn>1500</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>9</mn><mo>×</mo><mn>102</mn><menclose notation=\"updiagonalstrike\"><mn>0</mn></menclose></mrow><mrow><mn>150</mn><menclose notation=\"updiagonalstrike\"><mn>0</mn></menclose></mrow></mfrac><mo>=</mo><mn>6.12</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e40a548cf0fd7959", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "19", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the letters of the word CORONA are arranged in all possible ways and these words are written in order of a dictionary, then the word CORONA appears at the serial number", "image": null}, "options": [{"id": "mASS1", "text": "<math><mn>108</mn></math>", "image": null, "isCorrect": true}, {"id": "z96ks", "text": "<math><mn>110</mn></math>", "image": null, "isCorrect": false}, {"id": "Ny8Jg", "text": "<math><mn>106</mn></math>", "image": null, "isCorrect": false}, {"id": "AelXM", "text": "<math><mn>112</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi><mi>C</mi><mi>N</mi><mi>O</mi><mi>O</mi><mi>R</mi></math><br />Number of words starting with<br /><math><mi>A</mi><mo>&#8594;</mo><mfrac><mrow><mn>5</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>60</mn></math><br /><math><mi>C</mi><mi>A</mi><mo>&#8594;</mo><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>12</mn></math><br /><math><mi>C</mi><mi>N</mi><mo>&#8594;</mo><mfrac><mrow>< rue}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of all possible three digit even numbers which can be formed with the condition that if <math><mn>5</mn></math> is one of the digits, then <math><mn>7</mn></math> is the next digit is equal to", "image": null}, "options": [{"id": "aiFFG", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "3s3GP", "text": "<math><mn>325</mn></math>", "image": null, "isCorrect": false}, {"id": "YUE0n", "text": "<math><mn>345</mn></math>", "image": null, "isCorrect": false}, {"id": "ZamZR", "text": "<math><mn>365</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "If <math><mn>5</mn></math> is at hundreds place, <math><mn>7</mn></math> will be at tens place and ones place will have <math><mn>0,2</mn><mo>,</mo><mn>4,6</mn></math> or <math><mn>8</mn></math>. So, <math><mn>5</mn></math> numbers are possible.<br />If <math><mn>5</mn></math> is at tens place then, <math><mn>7</mn></math> will be at ones place but it won’t be an even number.<br />If <math><mn>5</mn></math> is at ones place, then it won’t be an even number. So, <math><mn>5</mn></math> can only be at hundreds place<br /><math><munder underaccent=\"false\"><mrow><mn>5</mn></mrow><mo>_</mo></munder><mi></mi><munder underaccent=\"false\"><mrow><mn>7</mn></mrow><mo>_</mo></munder><mi></mi><munder underaccent=\"false\"><mrow><mi>x</mi></mrow><mo>_</mo></munder><mo>→</mo><mi>x</mi><mo>=</mo><mn>0,2</mn><mo>,</mo><mn>4,6</mn><mo>,</mo><mn>8</mn><mo>→</mo><mn>5</mn></math> numbers<br /><math><munder underaccent=\"false\"><mrow><mn>8</mn></mrow><mo>_</mo></munder><mo>×</mo><munder underaccent=\"false\"><mrow><mn>9</mn></mrow><mo>_</mo></munder><mo>×</mo><munder underaccent=\"false\"><mrow><mn>5</mn></mrow><mo>_</mo></munder><mo>=</mo><mn>360</mn></math> numbers<br />(any number except <math><mn>0,5</mn></math> at hundreds place, any number except <math><mn>5</mn></math> at tens place and <math><mn>0,2</mn><mo>,</mo><mn>4,6</mn><mo>,</mo><mn>8</mn></math> at ones place)<br />Total numbers possible <math><mo>=</mo><mn>5</mn><mo>+</mo><mn>360</mn><mo>=</mo><mn>365</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d8678d693c40165c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "08", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The lock of a safe consists of five discs each of which features the digits <math> <mrow> <mn>0</mn><mo>,</mo><mtext> </mtext><mn>1</mn><mo>,</mo><mtext> </mtext><mn>2</mn><mo>,</mo><mn>....</mn><mo>,</mo><mn>9.</mn></mrow> </math> The safe can be opened by dialing a special combination of the digits. If the work day lasts <math> <mrow> <mn>13</mn></mrow> </math> hours and to dial&nbsp;one combination of digits takes <math> <mn>5</mn> </math> seconds, then&nbsp;number of days sufficient enough to open the safe, are", "image": null}, "options": [{"id": "GVCIe", "text": "<math> <mn>9</mn> </math>", "image": null, "isCorrect": false}, {"id": "e1n7r", "text": "<math> <mrow>  <mn>10</mn></mrow></math>", "image": null, "isCorrect": false}, {"id": "kjRjT", "text": "<math> <mrow> <mn>11</mn></mrow> </math>", "image": null, "isCorrect": true}, {"id": "BU9qV", "text": "<math> <mrow>  <mn>12</mn></mrow></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total time required=(total number of dials required to sure open the lock)<math><mo>&#215;</mo><mn>5</mn><mtext>s</mtext></math><br /><b s such that exactly <math><mn>10</mn></math> predictions are correct, are equal to", "image": null}, "options": [{"id": "YySJo", "text": "<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>20</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>10</mn></mrow></msub><mo>⋅</mo><msup><mrow><mn>2</mn></mrow><mrow><mn>10</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "iK2kP", "text": "<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>20</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>10</mn></mrow></msub><mo>⋅</mo><msup><mrow><mn>3</mn></mrow><mrow><mn>20</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "yHKrt", "text": "<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>20</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>10</mn></mrow></msub><mo>⋅</mo><msup><mrow><mn>3</mn></mrow><mrow><mn>10</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "HqWVi", "text": "<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>20</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>10</mn></mrow></msub><mo>⋅</mo><msup><mrow><mn>2</mn></mrow><mrow><mn>20</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In order to predict exactly <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math> correct predictions,<br /><math><mo>⇒</mo></math> we have to select <math><mn>10</mn></math> matches out of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn></math> in <math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>20</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>10</mn></mrow></msub></math> ways<br /><math><mo>⇒</mo></math> ways of making a correct prediction for each match is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>, so for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math> matches it is equal to <math><msup><mrow><mn>1</mn></mrow><mrow><mn>10</mn></mrow></msup><mo>=</mo><mn>1</mn><mo>.</mo></math><br /><math><mo>⇒</mo></math> Remaining <math><mn>10</mn></math> predictions must be wrong so for each incorrect prediction we have <math><mn>2</mn></math> choices out of <math><mn>3</mn><mo>,</mo></math> this can be done in <math><msup><mrow><mn>2</mn></mrow><mrow><mn>10</mn></mrow></msup></math> ways.<br />Hence, the required number of ways <math><mo>=</mo><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>20</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>10</mn></mrow></msub><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced><mo>⋅</mo><msup><mrow><mn>2</mn></mrow><mrow><mn>10</mn></mrow></msup><mo>=</mo><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>20</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>10</mn></mrow></msub><mo>×</mo><msup><mrow><mn>2</mn></mrow><mrow><mn>10</mn></mrow></msup><mo>.</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863926d83e0173b1b8d", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "09", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of four-digit numbers formed by using the digits <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>4</mn><mo>,</mo><mo>&#160;</mo><mn>5</mn></math> and which are not divisible by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>, is", "image": null}, "options": [{"id": "avsih", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math>", "image": null >1001</mn></mmultiscripts><mo>&#215;</mo><mn>2</mn></math><br /><math><mo>=</mo><msub><mrow><mmultiscripts><mrow><mi mathvariant=\"normal\">C</mi></mrow><mprescripts></mprescripts><mrow><mi></mi></mrow><mrow><mn>1001</mn></mrow></mmultiscripts></mrow><mrow><mn>2</mn></mrow></msub><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>2</mn><mo>=</mo><mfrac><mrow><mn>1001</mn><mo>&#215;</mo><mn>1000</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>2</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mi>k</mi><msup><mn>10</mn><mn>5</mn></msup></mfrac><mo>=</mo><mn>20.02</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637b932265a517f8e9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "13", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "All possible numbers are formed using the digits <math><mn>1</mn><mo>,</mo><mi>&nbsp;</mi><mn>1</mn><mo>,</mo><mi>&nbsp;</mi><mn>2</mn><mo>,</mo><mi>&nbsp;</mi><mn>2</mn><mo>,</mo><mi>&nbsp;</mi><mn>2</mn><mo>,</mo><mi>&nbsp;</mi><mn>2</mn><mo>,</mo><mi>&nbsp;</mi><mn>3</mn><mo>,</mo><mi>&nbsp;</mi><mn>4</mn><mo>,</mo><mi>&nbsp;</mi><mn>4</mn><mi>&nbsp;</mi></math> taken all at a time. The number of such numbers in which the odd digits occupy even places is", "image": null}, "options": [{"id": "lMKF5", "text": "<math><mn>175</mn></math>", "image": null, "isCorrect": false}, {"id": "iembn", "text": "<math><mn>162</mn></math>", "image": null, "isCorrect": false}, {"id": "HXNol", "text": "<math><mn>180</mn></math>", "image": null, "isCorrect": true}, {"id": "XaxmY", "text": "<math><mn>160</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/1aec8f06-15ca-4bbd-b70a-865b9b6bd459-image2.png\" /><br />Odd digits: <math><mn>1</mn><mo>,</mo><mi>&#160;</mi><mn>1</mn><mo>,</mo><mi>&#160;</mi><mn>3</mn></math><br />Even digits: <math><mn>2</mn><mo>,</mo><mi>&#160;</mi><mn>2</mn><mo>,</mo><mi>&#160;</mi><mn>2</mn><mo>,</mo><mi>&#160;</mi><mn>2</mn><mo>,</mo><mi>&#160;</mi><mn>4</mn><mo>,</mo><mi>&#160;</mi><mn>4</mn></math><br />The number of ways of placing odd digits at even position <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#160;</mo><mmultiscripts><mi>C</mi><mn>3</mn><none/><mprescripts/><none/><mn>4</mn></mmultiscripts><mo>&#215;</mo><mfrac><mrow><mn>3</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>4</mn><mo>&#215;</mo><mn>3</mn><mo>=</mo><mn>12</mn></math><br />The number of ways of placing even digits <math><mo>=</mo><mfrac><mrow><mn>6</mn><mo>!</mo></mrow><mrow><mn>4</mn><mo>!</mo><mi>&#160;</mi><mn>2</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>15</mn><mi>&#160;</mi></math><br /><math><mo>&#8756;</mo></math> Total number of ways <math><mo>=</mo><mn>12</mn><mo>&#215;</mo><mn>15</mn><mo>=</mo><mn>180</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86377725ea2dbb5c8e7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "There are <math><mn>7</mn></math> distinguishable rings. The number of possible five-rings arrangements on the four fingers (except the thumb) of one hand (the order of the rings on each finger is to be counted and it is not required that each finger has a ring) is equal to", "image": null}, "options": [{"id": "PAOS6", "text": "<math><mn>214110</mn></math>", "image": null, "isCorrect": false}, {"id": "A8w5O", "text": "<math><mn>211410</mn></math>", "image": null, "isCorrect": false}, {"id": "oTmvg", "text": "<math><mn>124110</mn></math>", "image": null, "isCorrect": false}, {"id": "F1Mwt", "text": "<math><mn>141120</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "There are <math><msub><mrow><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>7</mn></mrow></msup><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>5</mn></mrow></msub></math> ways of selecting the rings to be worn.<br />If <math><mi mathvariant=\"normal\">a</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">b</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">c</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">d</mi></math> are the number of the rings on the fingers, we need to find the non-negative integers such that <math><mi mathvariant=\"normal\">a</mi><mo>+</mo><mi mathvariant=\"normal\">b</mi><mo>+</mo><mi mathvariant=\"normal\">c</mi><mo>+</mo><mi mathvariant=\"normal\">d</mi><mo>=</mo><mn>5</mn><mo>.</mo></math>&nbsp;<br />The numbers of such quadruples is <math><msub><mrow><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>5</mn><mo>+</mo><mn>4</mn><mo>-</mo><mn>1</mn></mrow></msup><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>4</mn><mo>-</mo><mn>1</mn></mrow></msub><msup><mrow><mo>=</mo></mrow><mrow><mn>8</mn></mrow></msup><mi mathvariant=\"normal\">C</mi><msub><mrow></mrow><mrow><mn>3</mn></mrow></msub></math>.<br />For each set of <math><mn>5</mn></math> rings, there are <math><mn>5</mn><mo>!</mo></math> arrangements.<br />So, the total number of required arrangements is <math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>7</mn></mrow></msup><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>5</mn></mrow></msub><mo>×</mo><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>8</mn></mrow></msup><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>×</mo><mn>5</mn><mo>!</mo><mo>=</mo><mn>141120</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863753f8ee80de13499", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "91", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "There are six periods in each working day of a school. The number of ways in which <math><mn>5</mn></math> subjects can be arranged such that each subject is allotted at least one period and no period remains vacant is", "image": null}, "options": [{"id": "m0U9C", "text": "<math><mn>210</mn></math>", "image": null, "isCorrect": false}, {"id": "b4qSf", "text": "<math><mn>1800</mn></math>", "image": null, "isCorrect": true}, {"id": "lfRUy", "text": "<math><mn>360</mn></math>", "image": null, "isCorrect": false}, {"id": "1J4wf", "text": "<math><mn>120</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Select one subject which is to be repeated in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi>C</mi><mn>1</mn><none/><mprescripts/><mrow/><mn>5</mn></mmultiscripts></math>&nbsp;ways<br />Select two periods in which the selected subject will be taught in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi>C</mi><mn>2</mn><none/><mprescripts/><mrow/><mn>6</mn></mmultiscripts></math>&nbsp;ways< mg src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/68e6195f-153c-4d7f-8e97-440820028b42.png\" style=\"width:2.11319in;height:0.62639in\"> <math><mo>=</mo><mn>5</mn><mo>×</mo><mn>4</mn><mo>×</mo><mn>3</mn><mo>=</mo><mn>60</mn></math>  <br/>(ii) When <math><mn>0</mn></math> is not at unit place <br/><img src=\"https://cdn-question-pool.getmarks.app/nta_abhyas/jee_main/images/6e0eedcb-ec6e-4ac1-a8f2-9509b732cec2.png\" style=\"width:2.11319in;height:0.63333in\"> <math><mo>&#8658;</mo><mn>4</mn><mo>×</mo><mn>4</mn><mo>×</mo><mn>3</mn><mo>×</mo><mn>2</mn><mo>=</mo><mn>96</mn></math>  <br/>(First fill unit place by either <math><mn>2</mn></math> or <math><mn>4</mn></math> i.e. two ways. Since we can not put <math><mi>‘</mi><mn>0</mn><mi>’</mi></math> at the thousand place it can be filled in <math><mn>4</mn></math> ways, remaining as usual) <br/>Total ways <math><mo>=</mo><mn>60</mn><mo>+</mo><mn>96</mn><mo>=</mo><mn>156</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631c6109b7eebfde96", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "63", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of numbers, lying between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>99</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1000</mn></math>&nbsp;that can&nbsp;be made from the digits <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>,</mo><mo>&nbsp;</mo><mn>3</mn><mo>,</mo><mo>&nbsp;</mo><mn>7</mn><mo>,</mo><mo>&nbsp;</mo><mn>0</mn><mo>,</mo><mo>&nbsp;</mo><mn>8</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math> when the digits occur only once in each number, is", "image": null}, "options": [{"id": "twsAA", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>100</mn></math>", "image": null, "isCorrect": true}, {"id": "t3Qjs", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>90</mn></math>", "image": null, "isCorrect": false}, {"id": "R8v2w", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>120</mn></math>", "image": null, "isCorrect": false}, {"id": "1URgl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>80</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Required number of numbers&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mo>=</mo><mn>6</mn></msup><msub><mi>P</mi><mn>3</mn></msub><msup><mo>&#8722;</mo><mn>5</mn></msup><mtext>&#8203;</mtext><msub><mi>P</mi><mn>2</mn></msub><mo>=</mo><mn>120</mn><mo>&#8722;</mo><mn>20</mn><mo>=</mo><mn>100</mn></math>.</p><p>{Since, between <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>99</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mn>1000</mn></math>, the numbers are of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> digits, but those numbers should be omitted in which <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn></math> comes at hundreds place}.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86318b7867159bb0800", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "20", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Number of words that can be formed with the letters of the word <math><mi>A</mi><mi>L</mi><mi>G</mi><mi>E</mi><mi>B</mi><mi>R</mi><mi>A</mi></math> so that all the vowels are separated (or no two vowels come together) is", "image": null}, "options": [{"id": "MVXG8", "text": "<math><mn>720</mn></math>", "image": null, "isCorrect": true}, {"id": "WF8dq", "text": "<math><mn>2160</mn></math>", "image": null, "isCorrect": false}, {"id": "FG0m0", "text": "<math><mn>1440</mn></math>", "image": null, "isCorrect": false}, {"id": "dQA2e", "text": "<math><mn>1200</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Vowels are <math><mi>A</mi><mo>,</mo><mi></mi><mi>E</mi><mo>,</mo><mi></mi><mi>A</mi></math>  <br/>Consonants are <math><mi>L</mi><mo>,</mo><mi>G</mi><mo>,</mo><mi>B</mi><mo>,</mo><mi>R</mi></math>  <br/><math><mi>X</mi><mi></mi><mi>L</mi><mi></mi><mi>X</mi><mi></mi><mi>G</mi><mi></mi><mi>X</mi><mi></mi><mi>B</mi><mi></mi><mi>X</mi><mi></mi><mi>R</mi><mi></mi><mi>X</mi></math>  <br/>Since there is no restriction on consonants, we must place them first and they can be arranged in <math><mn>4</mn><mo>!</mo><mo>=</mo><mn>24</mn></math> days. <br/>Now to arrange vowels so that no two of them are together we have <math><mn>5</mn></math> places <math><mfenced separators=\"|\"><mrow><mi>X</mi></mrow></mfenced><mo>.</mo></math> Out of these <math><mn>5</mn></math> places, <math><mn>3</mn></math> can be selected in <math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>5</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub></math> ways and then one arrangement can be made in <math><mfrac><mrow><mn>3</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac></math> ways. <br/>Thus, required ways <math><mo>=</mo><mn>4</mn><mo>!</mo><mo>×</mo><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>5</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>×</mo><mfrac><mrow><mn>3</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>720</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86317cd5516a3096af1", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "75", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A word has <math><mn>4</mn></math> identical letters and rest all are distinct letters. If the total number of words that can be made with the letters of the word be <math><mn>210,</mn></math> then the total number of different letters in the word is equal to", "image": null}, "options": [{"id": "uQBfJ", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "FNlDm", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "NGxaq", "text": "<math><mn>4</mn></math>", "image": null, "isCorrect": true}, {"id": "gYsQD", "text": "<math><mn>7</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the number of distinct letters other than the identical letters be <math><mi>n</mi></math>.<br />Total letters <math><mo>=</mo><mi>n</mi><mo>+</mo><mn>4</mn></math><br />Identical <math><mo>=</mo><mn>4</mn><mo>,</mo><mi mathvariant=\"normal\"></mi></math> Distinct <math><mo>=</mo><mi>n</mi></math><br />Number of ways in which they can be arranged <math><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>n</mi><mo>+</mo><mn>4</mn></mrow></mfenced><mo>!</mo></mrow><mrow><mn>4</mn><mo>!</mo></mrow></mfrac></math><br /><math><mo>⇒</mo><mi mathvariant=\"normal\"></mi><mfrac><mrow><mfenced separators=\"|\"><mrow><mi>n</mi><mo>+</mo><mn>4</mn></mrow></mfenced><mo>!</mo></mrow><mrow><mn>4</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>210</mn></math><br /><math><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi>n</mi><mo>+</mo><mn>4</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mi>n</mi><mo>+</mo><mn>3</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mi>n</mi><mo>+</mo><mn>2</mn></mrow></mfenced><mo>…</mo><mn>6.5</mn></math><br /><math><mo>=</mo><mn>210</mn><mo>=</mo><mn>7</mn><mo>×</mo><mn>6</mn><mo>×</mo><mn>5</mn></math><br /><math><mo>⇒</mo><mi>n</mi><mo>+</mo><mn>4</mn><mo>=</mo><mn>7</mn><mi mathvariant=\"normal\"></mi><mo>⇒</mo><mi>n</mi><mo>=</mo><mn>3</mn></math><br />So, the required number of total different letters <math><mo>=</mo><mn>3</mn><mo>+</mo><mn>1</mn><mo>=</mo><mn>4</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630f67fc4594004261", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "23", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of words of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> letters which can be formed with the letters of the word <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi><mi>A</mi><mi>T</mi><mi>H</mi><mi>E</mi><mi>M</mi><mi>A</mi><mi>T</mi><mi>I</mi><mi>C</mi><mi>S</mi></math> is <math><mi>α</mi></math>, then <math><mfrac><mrow><mi>α</mi></mrow><mrow><mn>300</mn></mrow></mfrac></math> is", "image": null}, "options": [], "correctValue": "8.18", "solution": {"text": "<math><mi>M</mi><mo>,</mo><mi>A</mi><mo>,</mo><mi>T</mi><mo>→</mo><mn>2</mn></math><br /><math><mi>H</mi><mo>,</mo><mi>E</mi><mo>,</mo><mi>I</mi><mo>,</mo><mi>C</mi><mo>,</mo><mi>S</mi><mo>→</mo><mn>1</mn></math><table border=\"1px solid\">\t<thead>\t\t<tr> isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A box contains two white, three black and four red balls. The number of ways of selecting <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> balls from the box with atleast one black ball is", "image": null}, "options": [{"id": "Y5dDx", "text": "<math><mn>64</mn></math>", "image": null, "isCorrect": true}, {"id": "knRh8", "text": "<math><mn>74</mn></math>", "image": null, "isCorrect": false}, {"id": "BjVQc", "text": "<math><mn>54</mn></math>", "image": null, "isCorrect": false}, {"id": "AD4Rn", "text": "<math><mn>84</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Number of ways of selecting <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> balls out of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn></math> balls without any restriction is <math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>9</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>.</mo></math><br />Number of ways of selecting <math><mn>3</mn></math> balls such that no black ball is selected is&nbsp;<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>6</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>.</mo></math></p><p>Number of ways such that atleast one black ball is selected is <math> <mrow> <mmultiscripts> <mi>C</mi> <mprescripts></mprescripts> <none></none> <mn>9</mn> </mmultiscripts> <msub> <mrow></mrow> <mn>3</mn> </msub> <mo>−</mo><mmultiscripts> <mi>C</mi> <mprescripts></mprescripts> <none></none> <mn>6</mn> </mmultiscripts> <msub> <mrow></mrow> <mn>3</mn> </msub> <mo>=</mo><mn>84</mn><mo>−</mo><mn>20</mn><mo>=</mo><mn>64</mn></mrow> </math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a2fe35e4b3f447d3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "53", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A person predicts the outcome of <math><mn>20</mn></math> cricket matches of his home team. Each match can result either in a win, loss or tie for the home team. The total number of ways in which he can make the predictions such that exactly <math><mn>10</mn></math> predictions are correct, are equal to", "image": null}, "options": [{"id": "YySJo", "text": "<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>20</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>10</mn></mrow></msub><mo>⋅</mo><msup><mrow><mn>2</mn></mrow><mrow><mn>10</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "iK2kP", "text": "<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>20</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>10</mn></mrow></msub><mo>⋅</mo><msup><mrow><mn>3</mn></mrow><mrow><mn>20</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "yHKrt", "text": "<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>20</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>10</mn></mrow></msub><mo>⋅</mo><msup><mrow><mn>3</mn></mrow><mrow><mn>10</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "HqWVi", "text": "<math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>20</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>10</mn></mrow></msub><mo>⋅</mo><msup><mrow><mn>2</mn></mrow><mrow><mn>20</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In order to predict exactly <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math> correct pre Visible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of ways three different natural numbers can be drawn from the set <math><mfenced close=\"}\" open=\"{\" separators=\"|\"><mrow><mn>1,2</mn><mo>,</mo><mn>3,4</mn><mo>,</mo><mo>&#8230;</mo><mo>,</mo><mn>10</mn></mrow></mfenced></math>, if minimum of the chosen numbers is smaller than <math><mn>4</mn></math>, is", "image": null}, "options": [], "correctValue": "85", "solution": {"text": "The selection must have atleast one element of the set <math><mfenced close=\"}\" open=\"{\" separators=\"|\"><mrow><mn>1,2</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math><br />i.e. the required number of ways&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mmultiscripts><mtext>C</mtext><mn>1</mn><none/><mprescripts/><mrow/><mn>3</mn></mmultiscripts><mo>&#8901;</mo><mmultiscripts><mtext>C</mtext><mn>2</mn><none/><mprescripts/><mrow/><mn>7</mn></mmultiscripts><mo>+</mo><mmultiscripts><mtext>C</mtext><mn>2</mn><none/><mprescripts/><mrow/><mn>3</mn></mmultiscripts><mo>&#8901;</mo><mmultiscripts><mtext>C</mtext><mn>1</mn><none/><mprescripts/><mrow/><mn>7</mn></mmultiscripts><mo>+</mo><mmultiscripts><mtext>C</mtext><mn>3</mn><none/><mprescripts/><mrow/><mn>3</mn></mmultiscripts><mo>&#8901;</mo><mmultiscripts><mtext>C</mtext><mn>0</mn><none/><mprescripts/><mrow/><mn>7</mn></mmultiscripts></math><br /><math><mo>=</mo><mn>63</mn><mo>+</mo><mn>21</mn><mo>+</mo><mn>1</mn><mo>=</mo><mn>85</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86377725ea2dbb5c8e7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "65", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "There are <math><mn>7</mn></math> distinguishable rings. The number of possible five-rings arrangements on the four fingers (except the thumb) of one hand (the order of the rings on each finger is to be counted and it is not required that each finger has a ring) is equal to", "image": null}, "options": [{"id": "PAOS6", "text": "<math><mn>214110</mn></math>", "image": null, "isCorrect": false}, {"id": "A8w5O", "text": "<math><mn>211410</mn></math>", "image": null, "isCorrect": false}, {"id": "oTmvg", "text": "<math><mn>124110</mn></math>", "image": null, "isCorrect": false}, {"id": "F1Mwt", "text": "<math><mn>141120</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "There are <math><msub><mrow><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>7</mn></mrow></msup><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>5</mn></mrow></msub></math> ways of selecting the rings to be worn.<br />If <math><mi mathvariant=\"normal\">a</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">b</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">c</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">d</mi></math> are the number of the rings on the fingers, we need to find the non-negative integers such that <math><mi mathvariant=\"normal\">a</mi><mo>+</mo><mi mathvariant=\"normal\">b</mi><mo>+</mo><mi mathvariant=\"normal\">c</mi><mo>+</mo><mi mathvariant=\"normal\">d</mi><mo>=</mo><mn>5</mn><mo>.</mo></math>&nbsp;<br />The numbers of such quadruples is <math><msub><mrow><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>5</mn><mo>+</mo><mn>4</mn><mo>-</mo><mn>1</mn></mrow></msup><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>4</mn><mo>-</mo><mn>1</mn></mrow></msub><msup><mrow><mo>=</mo></mrow><mrow><mn>8</mn></mrow></msup><mi mathvariant=\"normal\">C</mi><msub><mrow></mrow><mrow><mn>3</mn></mrow></msub></math>.<br />For each set of <math><mn>5</mn></math> rings, there are <math><mn>5</mn><mo>!</mo></math> arrangements.<br />So, the total number of required arrangements is <math><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>7</mn></mrow></msup><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>5</mn></mrow></msub><mo>×</mo><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>8</mn></mrow></msup><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>×</mo><mn>5</mn><mo>!</mo><mo>=</mo><mn>141120</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86375696421b5e8263b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "73", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of ways of selecting two distinct numbers from the first <math><mn>15</mn></math> natural numbers such that their sum is a multiple of <math><mn>5,</mn></math> is equal to", "image": null}, "options": [{"id": "0m3t7", "text": "<math><mn>20</mn></math>", "image": null, "isCorrect": false}, {"id": "G0S5W", "text": "<math><mn>36</mn></math>", "image": null, "isCorrect": false}, {"id": "Xqg5U", "text": "<math><mn>21</mn></math>", "image": null, "isCorrect": true}, {"id": "89pbK", "text": "<math><mn>16</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>5</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>10</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>15</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>20</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mn>25</mn><mo>,</mo><mi mathva </mrow></mfenced></math><br />So, the required number of solutions<br /><math><mo>=</mo><mn>2</mn><mo>+</mo><mn>4</mn><mo>+</mo><mn>7</mn><mo>+</mo><mn>5</mn><mo>+</mo><mn>3</mn><mo>+</mo><mn>0</mn><mo>=</mo><mn>21</mn></math><br />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863753f8ee80de13499", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "91", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "There are six periods in each working day of a school. The number of ways in which <math><mn>5</mn></math> subjects can be arranged such that each subject is allotted at least one period and no period remains vacant is", "image": null}, "options": [{"id": "m0U9C", "text": "<math><mn>210</mn></math>", "image": null, "isCorrect": false}, {"id": "b4qSf", "text": "<math><mn>1800</mn></math>", "image": null, "isCorrect": true}, {"id": "lfRUy", "text": "<math><mn>360</mn></math>", "image": null, "isCorrect": false}, {"id": "1J4wf", "text": "<math><mn>120</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Select one subject which is to be repeated in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi>C</mi><mn>1</mn><none/><mprescripts/><mrow/><mn>5</mn></mmultiscripts></math>&nbsp;ways<br />Select two periods in which the selected subject will be taught in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi>C</mi><mn>2</mn><none/><mprescripts/><mrow/><mn>6</mn></mmultiscripts></math>&nbsp;ways<br />Remaining <math><mn>4</mn></math> subjects will be taught in <math><mn>4</mn></math> periods in <math><mn>4</mn><mo>!</mo></mat /mrow></msub><mo>=</mo><mfenced close=\"}\" open=\"{\" separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi></mi><mn>4</mn><mo>,</mo><mi></mi><mn>7</mn><mo>,</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>,</mo><mn>88</mn></mrow></mfenced></math><br /><math><msub><mrow><mi>S</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mfenced close=\"}\" open=\"{\" separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mi></mi><mn>5</mn><mo>,</mo><mi></mi><mn>8</mn><mo>,</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>.</mo><mo>,</mo><mi></mi><mn>89</mn></mrow></mfenced></math><br /><math><msub><mrow><mi>S</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>=</mo><mfenced close=\"}\" open=\"{\" separators=\"|\"><mrow><mn>3,6</mn><mo>,</mo><mi></mi><mn>9</mn><mo>,</mo><mi></mi><mo>&#8230;</mo><mo>&#8230;</mo><mo>,</mo><mi></mi><mn>90</mn></mrow></mfenced></math><br />For the sum of two numbers to be divisible by three, either we will choose the two numbers from <math><msub><mrow><mi>S</mi></mrow><mrow><mn>3</mn></mrow></msub></math> or one number from <math><msub><mrow><mi>S</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and one from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>2</mn></msub></math></p><p>i.e.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>k</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mmultiscripts><mi>C</mi><mn>1</mn><none/><mprescripts/><mrow/><mn>30</mn></mmultiscripts><mo>&#215;</mo><mmultiscripts><mi>C</mi><mn>1</mn><none/><mprescripts/><mrow/><mn>30</mn></mmultiscripts></mrow></mfenced><mo>+</mo><mmultiscripts><mi>C</mi><mn>2</mn><none/><mprescripts/><mrow/><mn>30</mn></mmultiscripts><mo>=</mo><mn>30</mn><mo>&#215;</mo><mn>30</mn><mo>+</mo><mfrac><mrow><mn>30</mn><mo>&#215;</mo><mn>29</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mn>1335</mn></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1335</mn><mn>500</mn></mfrac><mo>=</mo><mn>2</mn><mo>.</mo><mn>67</mn></math></p>", "image": null}, "videoSolution": null, "sylla  ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8630bac5801a4e13c85", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "104", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of ways in which <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>n</mi></math> distinct letters (addressed) can be distributed in <math><mi>N</mi></math> distinct mail boxes such that there are exactly <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>K</mi></math> letters <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi>n</mi><mo>&#60;</mo><mi>K</mi><mo>&#8804;</mo><mn>2</mn><mi>n</mi></mrow></mfenced></math> in one of the mail boxes is", "image": null}, "options": [{"id": "K8RNR", "text": "<math><msub><mrow><mmultiscripts><mrow><mi mathvariant=\"normal\">C</mi></mrow><mprescripts></mprescripts><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>2</mn><mi>n</mi></mrow></mmultiscripts></mrow><mrow><mi>K</mi></mrow></msub><mo>&#x22C5;</mo><mi>N</mi></math>", "image": null, "isCorrect": false}, {"id": "W69JO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi mathvariant=\"normal\">C</mi><mi>K</mi><none/><mprescripts/><mrow/><mrow><mn>2</mn><mi>n</mi></mrow></mmultiscripts><mo>&#183;</mo><mi>N</mi><msup><mfenced separators=\"|\"><mrow><mi>N</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mrow><mn>2</mn><mi>n</mi><mo>-</mo><mi>K</mi></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "pQQ8f", "text": "<math><msub><mrow><mmultiscripts><mrow><mi mathvariant=\"normal\">C</mi></mrow><mprescripts></mprescripts><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>2</mn><mi>n</mi></mrow></mmultiscripts></mrow><mrow><mi>K</mi be arranged in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mmultiscripts><mi>C</mi><mn>3</mn><none></none><mprescripts></mprescripts><mrow></mrow><mn>13</mn></mmultiscripts></math> ways<br />Hence, the total number of ways <math><mo>=</mo><msub><mrow><mmultiscripts><mrow><mi>C</mi></mrow><mprescripts></mprescripts><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>13</mn></mrow></mmultiscripts></mrow><mrow><mn>3</mn></mrow></msub><mo>×</mo><mfrac><mrow><mn>12</mn><mo>!</mo></mrow><mrow><mn>5</mn><mo>!</mo><mi mathvariant=\"normal\"></mi><mn>3</mn><mo>!</mo><mi mathvariant=\"normal\"></mi><mn>2</mn><mo>!</mo></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f2a81b90adf4ce47", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "105", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the number of five-digit numbers which can be read in the same way from the left and from the right is <math><mi>k</mi></math>, then <math><mfrac><mrow><mi>k</mi></mrow><mrow><mn>100</mn></mrow></mfrac></math> is equal to", "image": null}, "options": [], "correctValue": "9", "solution": {"text": "<p>The number will be of the form <math><mi>X</mi><mi>Y</mi><mi>Z</mi><mi>Y</mi><mi>X</mi></math> first place can&rsquo;t be zero, so it can be any <math><mn>1</mn></math> to <math><mn>9</mn><mo>&#8658;</mo><mn>9</mn></math> ways</p><p><math><mi>Y</mi></math> and <math><mi>Z</mi></math> each can be any of <math><mn>0</mn></math> and <math><mn>9</mn></math> so, they can be filled in <math><mn>10</mn></math> ways each.<br />The fourth place will be the same as second place and the last place will be the same as the first place.<br />So, the required number of ways <math><mo>=</mo><mn>9</mn><mo>&#215;</mo><mn>10</mn><mo>&#215;</mo><mn>10</mn><mo>&#215;</mo><mn>1</mn><mo>&#215;</mo><mn>1</mn><mo>=</mo><mn>900</mn></math><br /><math><mo>&#8658;</mo><mi>k</mi><mo>=</mo><mn>900</mn><mo>&#8658;</mo><mfrac><mrow><mi>k</mi></mrow><mrow><mn>100</mn></mrow></mfrac><mo>=</mo><mn>9</mn><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863e6ac709dd844d199", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "54", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A straight is a five card hand containing consecutive values. If <math><mi>m</mi></math> is equal to the number of ways in which all the five cards, in a straight, are not from the same suit, then the value of&nbsp;<math><mfrac><mrow><mi>m</mi></mrow><mrow><mn>1500</mn></mrow></mfrac></math> is equal to (Consider the value of&nbsp;<math><mi>J</mi></math>&nbsp;as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn><mo>,</mo><mo>&nbsp;</mo><mi>Q</mi></math>&nbsp;as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn><mo>,</mo><mo>&nbsp;</mo><mi>K</mi></math>&nbsp;as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>13</mn></math>&nbsp;and&nbsp;Ace as <math><mn>14</mn></math>)", "image": null}, "options": [], "correctValue": "6.12", "solution": {"text": "Five consecutive cards can be chosen out of <math><mn>13</mn></math>&nbsp;cards in <math><mn>9</mn></math> ways. <math><mfenced separators=\"|\"><mrow><mn>2,3</mn><mo>,</mo><mn>4,5</mn><mo>,</mo><mn>6</mn></mrow></mfenced><mo>,</mo><mfenced separators=\"|\"><mrow><mn>3,4</mn><mo>,</mo><mn>5,6</mn><mo>,</mo><mn>7</mn></mrow></mfenced><mo>,</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced separators=\"|\"><mrow><mn>10</mn><mo>,</mo><mi>J</mi><mo>,</mo><mi>Q</mi><mo>,</mo><mi>K</mi><mo>,</mo><mi>A</mi></mrow></mfenced><mo>.</mo></math> The first card can be chosen in <math><mn>4</mn></math> ways (spades, hearts, diamonds and clubs). The second and the subsequent cards, too, can be chosen in <math><mn>4</mn></math> ways.<br />Thus, there are <math><msup><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></msup></math> ways to choose the five cards.<br />The number of ways in which all the five cards are not from the same suit is <math><msup><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></msup><mo>-</mo><mn>4</mn><mo>=</mo><mn>1020</mn><mo>.</mo></math><br />So, the number of straights in this case is <math><mi>m</mi><mo>=</mo><mn>9</mn><mo>×</mo><mn>1020</mn><mo>⇒</mo><mfrac><mrow><mi>m</mi></mrow><mrow><mn>1500</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>9</mn><mo>×</mo><mn>102</mn><menclose notation=\"updiagonalstrike\"><mn>0</mn></menclose></mrow><mrow><mn>150</mn><menclose notation=\"updiagonalstrike\"><mn>0</mn></menclose></mrow></mfrac><mo>=</mo><mn>6.12</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d8fbf061210ff662", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "79", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of all possible three digit even numbers which can be formed with the condition that if <math><mn>5</mn></math> is one of the digits, then <math><mn>7</mn></math> is the next digit is equal to", "image": null}, "options": [{"id": "aiFFG", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "3s3GP", "text": "<math><mn>325</mn></math>", "image": null, "isCorrect": false}, {"id": "YUE0n", "text": "<math><mn>345</mn></math>", "image": null, "isCorrect": false}, {"id": "ZamZR", "text": "<math><mn>365</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "If <math><mn>5</mn></math> is at hundreds place, <math><mn>7</mn></math> will be at tens place and ones place will have <math><mn>0,2</mn><mo>,</mo><mn>4,6</mn></math> or <math><mn>8</mn></math>. So, <math><mn>5</mn></math> numbers are possible.<br />If <math><mn>5</mn></math> is at tens place then, <math><mn>7</mn></math> will be at ones place but it won’t be an even number.<br />If <math><mn>5</mn></math> is at ones place, then it won’t be an even number. So, <math><mn>5</mn></math> can only be at hundreds place<br /><math><munder underaccent=\"false\"><mrow><mn>5</mn></mrow><mo>_</mo></munder><mi></mi><munder underaccent=\"false\"><mrow><mn>7</mn></mrow><mo>_</mo></munder><mi></mi><munder underaccent=\"false\"><mrow><mi>x</mi></mrow><mo>_</mo></munder><mo>→</mo><mi>x</mi><mo>=</mo><mn>0,2</mn><mo>,</mo><mn>4,6</mn><mo>,</mo><mn>8</mn><mo>→</mo><mn>5</mn></math> numbers<br /><math><munder underaccent=\"false\"><mrow><mn>8</mn></mrow><mo>_</mo></munder><mo>×</mo><munder underaccent=\"false\"><mrow><mn>9</mn></mrow><mo>_</mo></munder><mo>×</mo><munder underaccent=\"false\"><mrow><mn>5</mn></mrow><mo>_</mo></munder><mo>=</mo><mn>360</mn></math> numbers<br />(any number except <math><mn>0,5</mn></math> at hundreds place, any number except <math><mn>5</mn></math> at tens place and <math><mn>0,2</mn><mo>,</mo><mn>4,6</mn><mo>,</mo><mn>8</mn></math> at ones place)<br />Total numbers possible <math><mo>=</mo><mn>5</mn><mo>+</mo><mn>360</mn><mo>=</mo><mn>365</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d809556c618283e8", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "83", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of ways in which the letters of the word ‘ARRANGE’ can be arranged so that two A’s are together is", "image": null}, "options": [{"id": "2TkDq", "text": "<math><mn>160</mn></math>", "image": null, "isCorrect": false}, {"id": "6YFiq", "text": "<math><mn>200</mn></math>", "image": null, "isCorrect": false}, {"id": "ja7xx", "text": "<math><mn>360</mn></math>", "image": null, "isCorrect": true}, {"id": "utMYE", "text": "<math><mn>900</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let us tie the two A’s.<br /><math><menclose notation=\"box\"><mi mathvariant=\"normal\">A</mi><mi mathvariant=\"normal\">A</mi></menclose></math> RRNGE <math><mo>→</mo></math> Total <math><mn>6</mn></math> objects, two identical<br /><math><mfrac><mrow><mn>6</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>6</mn><mo>×</mo><mn>5</mn><mo>×</mo><mn>4</mn><mo>×</mo><mn>3</mn></math><br /><math><mo>=</mo><mn>360</mn></math><br />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d597afe56af9f4ec", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "102", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of permutations of the alphabets of the word <math><mi mathvariant=\"normal\">“</mi><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">L</mi><mi mathvariant=\"normal\">E</mi><mi mathvariant=\"normal\">”</mi></math> in which <math><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">’</mi><mi mathvariant=\"normal\">s</mi></math> are together but <math><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">’</mi><mi mathvariant=\"normal\">s</mi></math> are separated, is", "image": null}, "options": [{"id": "gS2NL", "text": "<math><mn>24</mn></math>", "image": null, "isCorrect": false}, {"id": "JgGNj", "text": "<math><mn>48</mn></math>", "image": null, "isCorrect": false}, {"id": "mMSo3", "text": "<math><mn>72</mn></math>", "image": null, "isCorrect": false}, {"id": "ZABIN", "text": "<math><mn>36</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"/>Keep both <math><mi mathvariant=\"normal\">O</mi><mi mathvariant=\"normal\">&#8217;</mi><mi mathvariant=\"normal\">s</mi></math> together, then apart from <math><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">&#8217;</mi><mi mathvariant=\"normal\">s</mi></math> other alphabets can be arranged in <math><mn>3</mn><mo>!</mo><mo>=</mo><mn>6</mn></math> ways. In the gaps, two <math><mi mathvariant=\"normal\">G</mi><mi mathvariant=\"normal\">&#8217;</mi><mi mathvariant=\"normal\">s</mi></math> can be placed in <math><msub><mrow><mmultiscripts><mrow><mi>C</mi></mrow><mprescripts></mprescripts><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>4</mn></mrow></mmultiscripts></mrow><mrow><mn>2</mn></mrow></msub></math> ways.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"|\" close=\"|\" separators=\"|\"><menclose notation=\"box\"><mi>OO</mi></menclose></mfenced><mi mathvariant=\"normal\">L</mi><mfenced open=\"|\" close=\"|\" separators=\"|\"><mi mathvariant=\"normal\">E</mi></mfenced></math></p><p>Hence, the total number of ways<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>3</mn><mo>!</mo><mo>&#8901;</mo><mmultiscripts><mi>C</mi><mn>2</mn><none/><mprescripts/><mrow/><mn>4</mn></mmultiscripts><mo>=</mo><mn>36</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863d47bd475ede80dce", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "82", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of ways in which letters of the word ‘ARRANGE’ can be arranged, such that no two R’s are together, is", "image": null}, "options": [{"id": "10h59", "text": "<math><mn>160</mn></math>", "image": null, "isCorrect": false}, {"id": "eehdY", "text": "<math><mn>200</mn></math>", "image": null, "isCorrect": false}, {"id": "qBhZV", "text": "<math><mn>360</mn></math>", "image": null, "isCorrect": false}, {"id": "hcrlg", "text": "<math><mn>900</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "AANGE can be arranged in <math><mfrac><mrow><mn>5</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>60</mn></math> ways<br />Six gaps will be created, two can be selected in <math><mmultiscripts><mrow><msub><mrow><mi mathvariant=\"normal\">C</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mprescripts></mprescripts><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>6</mn></mrow></mmultiscripts></math> ways where two R’s can be arranged in one way<br />So, required number of ways<br /><math><mo>=</mo><mfrac><mrow><mn>6</mn><mo>×</mo><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>×</mo><mn>60</mn><mo>=</mo><mn>15</mn><mo>×</mo><mn>60</mn><mo>=</mo><mn>900</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863beaa7774cbb442f0", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "71", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A total of <math><mn>6</mn></math> Boys and <math><mn>6</mn></math> girls are to sit in a row alternatively and in a circle.&nbsp;Let <math><mtext mathvariant=\"normal\">m</mtext></math> be the number of arrangements in the row and <math><mtext mathvariant=\"normal\">n</mtext></math> be the number of arrangements in the circle. If <math><mtext mathvariant=\"normal\">k</mtext><mo>=</mo><mfrac><mrow><mtext mathvariant=\"normal\">m</mtext></mrow><mrow><mn>10</mn><mtext mathvariant=\"normal\">n</mtext></mrow></mfrac></math>, then the value of <math><mtext>k</mtext></math> is", "image": null}, "options": [], "correctValue": "1.2", "solution": {"text": "<p>Linear permutations with boy in the first place are&nbsp;of the form <math><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">G</mi></mrow><mrow><mn>1</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">G</mi></mrow><mrow><mn>2</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">G</mi></mrow><mrow><mn>3</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>4</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">G</mi></mrow><mrow><mn>4</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>5</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">G</mi></mrow><mrow><mn>5</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">B</mi></mrow><mrow><mn>6</mn></mrow></msub><msub><mrow><mi mathvariant=\"normal\">G</mi></mrow><mrow><mn>6</mn></mrow></msub></math> and the number of such arrangements is <math><mn>6</mn><mo>!</mo><mo>×</mo><mn>6</mn><mo>!</mo><mo>.</mo></math><br />The number of linear permutations with girl in the first place is <math><mn>6</mn><mo>!</mo><mo>×</mo><mn>6</mn><mo>!</mo></math><br />So, the number of arrangements in row&nbsp;<math><mo>=</mo><mi mathvariant=\"normal\">m</mi><mo>=</mo><mn>2</mn><mo>×</mo><mn>6</mn><mo>!</mo><mo>×</mo><mn>6</mn><mo>!</mo></math><br />(In circular permutations, start with a place which can be filled by a boy or a girl and after that the arrangements become linear)</p><p>Placing the boys first and then arranging the girls in <math><mn>6</mn></math> gaps, the number of such circular arrangements is <math><mn>5</mn><mo>!</mo><mo>×</mo><mn>6</mn><mo>!</mo><mo>⇒</mo><mi mathvariant=\"normal\">n</mi><mo>=</mo><mn>5</mn><mo>!</mo><mo>×</mo><mn>6</mn><mo>!</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>⇒</mo><mi mathvariant=\"normal\">k</mi><mo>=</mo><mfrac><mi mathvariant=\"normal\">m</mi><mrow><mn>10</mn><mi mathvariant=\"normal\">n</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mo>×</mo><mn>6</mn><mo>!</mo><mo>×</mo><mn>6</mn><mo>!</mo></mrow><mrow><mn>10</mn><mo>×</mo><mn>5</mn><mo>!</mo><mo>×</mo><mn>6</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mfrac><mn>12</mn><mn>10</mn></mfrac><mo>=</mo><mn>1.2</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bb2d2b31d07f6ef9", "type": "sin "notAttempted", "lastPracticed": null}, {"_id": "6151e863b4f581ecc5d73b09", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "93", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The number of ways in which <math><mn>10</mn></math> boys can take positions around a circular round table, if two particular boys must not be seated side by side, is", "image": null}, "options": [{"id": "RezN3", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#215;</mo><mn>48</mn><mo>!</mo></math>", "image": null, "isCorrect": false}, {"id": "W4q12", "text": "<math><mn>12</mn></math>", "image": null, "isCorrect": false}, {"id": "S9s86", "text": "<math><mn>360</mn></math>", "image": null, "isCorrect": false}, {"id": "rycjl", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&#215;</mo><mn>8</mn><mo>!</mo></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Total number of ways without any restriction <math><mo>=</mo><mn>9</mn><mo>!</mo></math><br />Considering two of the particular boys sit together and then assuming them as one, the total no. of ways <math><mo>=</mo><mn>8</mn><mo>!</mo></math><br />They them selves can be arranged in <math><mn>2</mn></math> ways.<br />So, the required number of ways<br /><math><mo>=</mo><mn>9</mn><mo>!</mo><mo>-</mo><mn>2</mn><mo>×</mo><mn>8</mn><mo>!</mo><mo>=</mo><mn>7</mn><mo>×</mo><mn>8</mn><mo>!</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a83d94203b6c7697", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "94", "isVisible": true}], "previou
