ath>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math><mfenced separators=\"|\"><mrow><mi>a</mi><mo>-</mo><mn>6</mn></mrow></mfenced><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mo>=</mo><mn>2</mn><mi>a</mi><mi>x</mi><mo>+</mo><mn>1</mn></math><br /><math><mfenced separators=\"|\"><mrow><mi>a</mi><mo>-</mo><mn>6</mn></mrow></mfenced><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>a</mi><mi>x</mi><mo>-</mo><mn>3</mn><mo>=</mo><mn>0</mn></math></p><p>Since&nbsp;the graphs do not intersect,<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>D</mi><mo>&#60;</mo><mn>0</mn><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mn>4</mn><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mo>&#215;</mo><mn>3</mn><mfenced separators=\"|\"><mrow><mi>a</mi><mo>-</mo><mn>6</mn></mrow></mfenced><mo>&#60;</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>a</mi><mo>-</mo><mn>18</mn><mo>&#60;</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mi>a</mi><mo>+</mo><mn>6</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mi>a</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mo>&#60;</mo><mn>0</mn></math><br /><math><mo>&#8658;</mo><mi>a</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>6</mn><mo>,</mo><mi></mi><mn>3</mn></mrow></mfenced></math></p><p>Hence, the least integer value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math>&nbsp;is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>5</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863bbeda2edce48e6e7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The integral value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>m</mi></math> for which the quadratic equation <math><mfenced separators=\"|\"><mrow><mn>2</mn><mi>m</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><mi>x</mi><mo>+</mo><mn>2</mn><mi>m</mi><mo>-</mo><mn>3</mn><mo>=</mo><mn>0</mn></math> has both the roots&nbsp;negative is given by", "image": null}, "options": [{"id": "EOg0P", "text": "<math><mn>1</mn></math>", "image": null, "isCorrect": true}, {"id": "0GMHY", "text": "<math><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "Si7hO", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "pKUVq", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mo>∵</mo></math> Both roots are negative<br /><math><mo>∴</mo><mi>D</mi><mo>&gt;</mo><mn>0</mn><mo>,</mo></math> sum of roots <math><mo>→</mo><mo>-</mo><mi>v</mi><mi>e</mi><mo>,</mo></math> product of roots <math><mo>→</mo><mo>+</mo><mi>v</mi><mi>e</mi></math><br /><math><mi>D</mi><mo>&gt;</mo><mn>0</mn><mo>⇒</mo><mn>16</mn><mo>-</mo><mn>4</mn><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi>m</mi><mo>-</mo><mn>3</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>&gt;</mo><mn>0</mn><mo>⇒</mo><mn>4</mn><mo>-</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi>m</mi><mo>-</mo><mn>3</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>&gt;</mo><mn>0</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mn>2</mn><mo>-</mo><mn>2</mn><mi>m</mi><mo>+</mo><mn>3</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>2</mn><mo>+</mo><mn>2</mn><mi>m</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mo>&gt;</mo><mn>0</mn><mo>⇒</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2</mn><mi>m</mi><mo>+</mo><mn>5</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>2</mn><mi>m</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>&gt;</mo><mn>0</mn></math><br /><math><mo>⇒</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mi>m</mi><mo>-</mo><mn>5</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>2</mn><mi>m</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>&lt;</mo><mn>0</mn><mo>⇒</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&lt;</mo><mi>m</mi><mo>&lt;</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><math><mi>α</mi><mo>+</mo><mi>β</mi><mo>&lt;</mo><mn>0</mn><mo>⇒</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi>m</mi><mo>-</mo><mn>3</mn></mrow></mfenced></mrow></mfrac><mo>&lt;</mo><mn>0</mn><mo>⇒</mo><mi>m</mi><mo>&lt;</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><math><mi>α</mi><mi>β</mi><mo>&gt;</mo><mn>0</mn><mo>⇒</mo><mn>1</mn><mo>&gt;</mo><mn>0</mn></math>&nbsp;(always true)<br />Taking intersection, we get,&nbsp;<math><mi>m</mi><mo>∈</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></math><br />Integral value of <math><mi>m</mi><mo>=</mo><mn>1</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863b9c6832932fa1f36", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "82", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>β</mi></math> are the roots of the equation <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn><mo>,</mo></math> then the sum of roots of the equation having roots as&nbsp;<math><msup><mrow><mi>α</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>-</mo><mn>3</mn><msup><mrow><mi>α</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>5</mn><mi>α</mi><mo>-</mo><mn>2</mn></math> and <math><msup><mrow><mi>β</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>-</mo><msup><mrow><mi>β</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mi>β</mi><mo>+</mo><mn>5</mn></math> is", "image": null}, "options": [{"id": "taA82", "text": "<math><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "ZpW0E", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": true}, {"id": "et6Ml", "text": "<math><mn>5</mn></math>", "image": null, "isCorrect": false}, {"id": "PG732", "text": "<math><mn>7</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since,&nbsp;<math><msup><mrow><mi>α</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>α</mi><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn></math><br /><math><mo>⇒</mo><msup><mrow><mi>α</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>-</mo><mn>3</mn><msup><mrow><mi>α</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>5</mn><mi>α</mi><mo>-</mo><mn>2</mn><mo>=</mo><mi>α</mi><mfenced separators=\"|\"><mrow><msup><mrow><mi>α</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>α</mi><mo>+</mo><mn>3</mn></mrow></mfenced><mo>-</mo><mfenced separators=\"|\"><mrow><msup><m If <math><mtext>x</mtext><mo>&nbsp;</mo><mo>=</mo><mo>&nbsp;</mo><mi>α</mi></math>&nbsp;is the common root of both the equations, then<br /><br /><math> <mrow> <msup> <mi>α</mi> <mn>4</mn> </msup> <mo>+</mo> <mn>6</mn> <msup> <mi>α</mi> <mn>2</mn> </msup> <mo>+</mo> <mn>2</mn> <mn>5</mn> <mo>=</mo> <mn>0</mn> <mo>⇒</mo> <msup> <mi>α</mi> <mn>4</mn> </msup> <mo>=</mo> <mo>-</mo> <mn>2</mn> <mn>5</mn> <mo>-</mo> <mn>6</mn> <msup> <mi>α</mi> <mn>2</mn> </msup> </mrow> </math></p><p>Using this value of&nbsp;<math><msup><mi>α</mi><mn>4</mn></msup></math>&nbsp;in the second equation</p><p><math><mo>⇒</mo><mn>3</mn><mfenced><mrow><mo>-</mo><mn>2</mn><mn>5</mn><mo>-</mo><mn>6</mn><msup><mi>α</mi><mn>2</mn></msup></mrow></mfenced><mo>+</mo><mn>4</mn><msup><mi>α</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mn>8</mn><mi>α</mi><mo>+</mo><mn>5</mn><mo>=</mo><mn>0</mn></math><br /><br /><math> <mrow> <mo>⇒</mo> <mo>-</mo> <mn>7</mn> <mn>5</mn> <mo>-</mo> <mn>1</mn> <mn>8</mn> <msup> <mi>α</mi> <mn>2</mn> </msup> <mo>+</mo> <mn>4</mn> <msup> <mi>α</mi> <mn>2</mn> </msup> <mo>+</mo> <mn>2</mn> <mn>8</mn> <mi>α</mi> <mo>+</mo> <mn>5</mn> <mo>=</mo> <mn>0</mn> </mrow> </math><br /><br /><math><mo>⇒</mo><mn>2</mn><msup><mi>α</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>α</mi><mo>+</mo><mn>1</mn><mn>0</mn><mo>=</mo><mn>0</mn></math><br /><br /><math><mo>⇒</mo><msup><mi>α</mi><mn>2</mn></msup><mo>-</mo><mn>2</mn><mi>α</mi><mo>+</mo><mn>5</mn><mo>=</mo><mn>0</mn></math><br /><br />on comparing with <math> <mrow> <msup> <mtext>x</mtext> <mn>2</mn> </msup> <mo>+</mo> <mtext>bx</mtext> <mo>+</mo> <mtext>c</mtext> </mrow> </math>, we get<br /><br /><math><mtext>b</mtext><mo>=</mo><mo>-</mo><mn>2</mn><mo>,</mo><mo>&nbsp;</mo><mtext>c</mtext><mo>=</mo><mn>5</mn></math><br /><br />So,&nbsp;<math> <mtext>P</mtext><mfenced> <mtext>x</mtext> </mfenced><mo>=</mo><msup> <mtext>x</mtext> <mn>2</mn> </msup> <mo>−</mo><mtext>2x</mtext><mo>+</mo><mtext>5</mtext> </math><br /><br /><math><mo>⇒</mo><mi mathvariant=\"normal\">P</mi><mfenced><mn>1</mn></mfenced><mo>=</mo><mfenced><mn>1</mn></mfenced><mo>-</mo><mn>2</mn><mo>+</mo><mn>5</mn></math><math><mo>=</mo><mn>4</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86351edafa93caf89b3", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The quadratic equations <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>+</mo><mi>a</mi><mo>=</mo><mn>0</mn></math> and <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi>c</mi><mi>x</mi><mo>+</mo><mn>6</mn><mo>=</mo><mn>0</mn></math> have one root in common. The other roots of the first equation and the second equation are integers in the ratio <math><mn>4</mn><mi></mi><mo>:</mo><mn>3</mn><mo>.</mo></math> Then the common root is", "image": null}, "options": [{"id": "SrhLx", "text": "<math><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "2bLDK", "text": "<math><mn>3</mn></math>", "image": null, "isCorrect": false}, {"id": "mJW2X", "text": "<math><mn>2</mn></math>", "image": null, "isCorrect": true}, {"id": "nKZJ2", "text": "<math><mn>1</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let,&nbsp;<math><mi>α</mi></math> be the common root and the other roots of the equations be <math><mn>4</mn><mi>β</mi></math> and <math><mn>3</mn><mi>β</mi></math> respectively. Then,<br /><math><mi>α</mi><mo>+</mo><mn>4</mn><mi>β</mi><mo>=</mo><mn>6</mn><mo>,</mo><mtext>  </mtext><mi>α</mi><mfenced separators=\"|\"><mrow><mn>4</mn><mi>β</mi></mrow></mfenced><mo>=</mo><mi>a</mi></math><br /><math><mi>α</mi><mo>+</mo><mn>3</mn><mi>β</mi><mo>=</mo><mi>c</mi><mo>,</mo><mtext>  </mtext><mi>α</mi><mfenced separators=\"|\"><mrow><mn>3</mn><mi>β</mi></mrow></mfenced><mo>=</mo><mn>6</mn><mo>⇒</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>a</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mtext> </mtext><mo>⇒</mo><mtext> </mtext><mi>α</mi><mo>=</mo><mn>8</mn></math><br />The first equation is <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>8</mn><mo>=</mo><mn>0</mn></math><br />Whose roots are <math><mn>2</mn></math> and <math><mn>4</mn></math><br />If <math><mi>α</mi><mo>=</mo><mn>2</mn><mtext> </mtext><mo>⇒</mo><mi>β</mi><mo>=</mo><mn>1</mn></math><br />So, roots of first equation is <math><mn>2</mn><mo>,</mo><mtext> </mtext><mn>4</mn></math> and that of second equation is <math><mn>2</mn><mo>,</mo><mtext> </mtext><mn>3</mn></math><br />If <math><mi>α</mi><mo>=</mo><mn>4</mn><mo>⇒</mo><mi>β</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>⇒</mo><mtext> </mtext><mn>3</mn><mi>β</mi><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mtext> </mtext><mn>4</mn><mi>β</mi><mo>=</mo><mn>2</mn></math><br />Here the roots are not integers <math><mo>⇒</mo><mi>α</mi><mo>=</mo><mn>2</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8633329631bfa9145df", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "76", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the equations <math><mn>2</mn><msup><m i>a</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>D</mi><mo>=</mo><msup><mrow><mi>B</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><mi>A</mi><mi>C</mi></math><br /><math><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mfenced separators=\"|\"><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi></mrow></mfenced></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><msup><mrow><mfenced separators=\"|\"><mrow><mi>a</mi><mo>-</mo><mi>b</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></math><br /><math><mo>=</mo><mn>4</mn><mfenced close=\"}\" open=\"{\" separators=\"|\"><mrow><msup><mrow><mfenced separators=\"|\"><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mfenced separators=\"|\"><mrow><mi>a</mi><mo>-</mo><mi>b</mi></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfenced></math><br /><math><mo>=</mo><mn>4</mn><mfenced separators=\"|\"><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi><mo>-</mo><mi>a</mi><mo>+</mo><mi>b</mi></mrow></mfenced><mfenced separators=\"|\"><mrow><mi>a</mi><mo>+</mo><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi><mo>+</mo><mi>a</mi><mo>-</mo><mi>b</mi></mrow></mfenced></math><br /><math><mo>=</mo><mn>4</mn><mfenced separators=\"|\"><mrow><mn>2</mn><mi>b</mi><mo>-</mo><mn>2</mn><mi>c</mi></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>2</mn><mi>a</mi><mo>-</mo><mn>2</mn><mi>c</mi></mrow></mfenced></math><br /><math><mo>=</mo><mn>16</mn><mfenced separators=\"|\"><mrow><mi>b</mi><mo>-</mo><mi>c</mi></mrow></mfenced><mfenced separators=\"|\"><mrow><mi>a</mi><mo>-</mo><mi>c</mi></mrow></mfenced></math><br /><math><mo>=</mo><mn>16</mn><mfenced separators=\"|\"><mrow><mi>c</mi><mo>-</mo><mi>b</mi></mrow></mfenced><mfenced separators=\"|\"><mrow><mi>c</mi><mo>-</mo><mi>a</mi></mrow></mfenced></mat <math> <mrow> <mo>⇒</mo> <msup> <mtext>y</mtext> <mn>2</mn> </msup> <mo>+</mo> <mn>2</mn> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>a</mtext> <mo>+</mo> <mtext>b</mtext> <mo>-</mo> <mn>2</mn> <mtext>c</mtext> </mrow> </mfenced> <mtext>y</mtext> <mo>+</mo> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mtext>a</mtext> <mo>-</mo> <mtext>b</mtext> </mrow> </mfenced> </mrow> <mn>2</mn> </msup> <mo>≥</mo> <mn>0</mn> </mrow> </math><br /><br />which is true for all real values of <math><mi mathvariant=\"normal\">y</mi></math> if<br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <math><mi mathvariant=\"normal\">D</mi><mo>≤</mo><mn>0</mn></math><br /><br />&nbsp; &nbsp; &nbsp;<math><mo>⇒</mo><mn>4</mn><msup><mfenced><mrow><mi mathvariant=\"normal\">a</mi><mo>+</mo><mi mathvariant=\"normal\">b</mi><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">c</mi></mrow></mfenced><mn>2</mn></msup><mo>-</mo><mn>4</mn><msup><mfenced><mrow><mi mathvariant=\"normal\">a</mi><mo>-</mo><mi mathvariant=\"normal\">b</mi></mrow></mfenced><mn>2</mn></msup><mo>≤</mo><mn>0</mn></math><br /><br />&nbsp;&nbsp;&nbsp;&nbsp; <math><mo>⇒</mo><mfenced><mrow><mi mathvariant=\"normal\">a</mi><mo>+</mo><mi mathvariant=\"normal\">b</mi><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">c</mi><mo>+</mo><mi mathvariant=\"normal\">a</mi><mo>-</mo><mi mathvariant=\"normal\">b</mi></mrow></mfenced><mfenced><mrow><mi mathvariant=\"normal\">a</mi><mo>+</mo><mi mathvariant=\"normal\">b</mi><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">c</mi><mo>-</mo><mi mathvariant=\"normal\">a</mi><mo>+</mo><mi mathvariant=\"normal\">b</mi></mrow></mfenced><mo>≤</mo><mn>0</mn></math><br /><br /><math><mo>⇒</mo><mfenced><mrow><mn>2</mn><mi mathvariant=\"normal\">a</mi><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">c</mi></mrow></mfenced><mfenced><mrow><mn>2</mn><mi mathvariant=\"normal\">b</mi><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">c</mi></mrow></mfenced><mo>≤</mo><mn>0</mn></math><br /><br />&nbsp msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><mi>p</mi><mi>x</mi><mo>+</mo><mn>2</mn><msup><mi>q</mi><mn>2</mn></msup></math> and <math><mi>g</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mo>=</mo><mo>-</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>q</mi><mi>x</mi><mo>+</mo><msup><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msup></math>&nbsp;(where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi><mo>&#8800;</mo><mn>0</mn></math>).&nbsp;If <math><mi>x</mi><mo>&#8712;</mo><mi>R</mi></math>&nbsp;and the the minimum value of <math><mi>f</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced></math> is equal to the maximum value of <math><mi>g</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced></math>, then the value of&nbsp;<math><mfrac><mrow><msup><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mi>q</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac></math>&nbsp;is equal to&nbsp;", "image": null}, "options": [], "correctValue": "0.5", "solution": {"text": "<p>Since the minimum/maximum value of a quadratic expression&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>b</mi><mi>x</mi><mo>+</mo><mi>c</mi></math> is given by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><mi>b</mi><mi>c</mi><mo>-</mo><msup><mi>b</mi><mn>2</mn></msup></mrow><mrow><mn>4</mn><mi>a</mi></mrow></mfrac></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>f</mi><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><mn>2</mn><msup><mi>q</mi><mn>2</mn></msup><mo>-</mo><msup><mi>p</mi><mn>2</mn></msup></math>, <math><msub><mrow><mi>g</mi></mrow><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">i</mi><mi mathvariant=\"normal\">n</mi></mrow></msub><mo>=</mo><msup><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>q</mi></mrow><mrow><mn>2</mn></mrow></msup></math><br />Now,&nbsp;<math><mn>2</mn><msup><mrow><mi>q</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>q</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>&#8658;</mo><msup><mrow><mi>q</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>2</mn><msup><mrow><mi>p</mi></mrow><mrow><mn>2</mn></mrow></msup></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>p</mi><mn>2</mn></msup><msup><mi>q</mi><mn>2</mn></msup></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>5</mn></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "6aa3ab79aa8dc1ff68177ff7", "title": "Location of Roots", "totalQuestions": 22, "questions": [{"_id": "6151e863f6190fed282fae53", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "104", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If the origin lies between zeroes of the&nbsp; polynomial <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced separators=\"|\"><mi>x</mi></mfenced><mo>=</mo><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>4</mn></mfrac><mo>-</mo><mi>a</mi><mi>x</mi><mo>+</mo><msup><mi>a</mi><mn>2</mn></msup><mo>+</mo><mi>a</mi><mo>-</mo><mn>2</mn></math>, then the number of integral value(s) of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> is", "image": null}, "option ,</mo><mi></mi><mn>1</mn></mrow></mfenced><mo>∪</mo><mfenced open=\"[\" separators=\"|\"><mrow><mn>6</mn><mo>,</mo><mi></mi><mi>∞</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "EozEj", "text": "<math><mi>x</mi><mo>∈</mo><mfenced open=\"[\" separators=\"|\"><mrow><mn>6</mn><mo>,</mo><mi></mi><mi>∞</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>7</mn><mi>x</mi><mo>+</mo><mn>6</mn><mo>&#8805;</mo><mn>0</mn><mo>&#8658;</mo><mi>x</mi><mo>&#8712;</mo><mfenced close=\"]\" separators=\"|\"><mrow><mo>-</mo><mi>&#8734;</mi><mo>,</mo><mn>1</mn></mrow></mfenced><mo>&#8746;</mo><mfenced open=\"[\" separators=\"|\"><mrow><mn>6</mn><mo>,</mo><mi>&#8734;</mi></mrow></mfenced></math><br />Case I: <math><mi>x</mi><mo>&#60;</mo><mo>-</mo><mn>2</mn></math><br />LHS is non negative, RHS is negative<br /><math><mo>&#8658;</mo></math>&nbsp;the inequality is always true</p><p><math><mo>&#8658;</mo><mi>x</mi><mo>&#60;</mo><mo>-</mo><mn>2</mn><mo>.</mo></math><br />Case II: <math><mi>x</mi><mo>&#8805;</mo><mo>-</mo><mn>2</mn></math><br /><math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>7</mn><mi>x</mi><mo>+</mo><mn>6</mn><mo>&#62;</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>4</mn><mi>x</mi><mo>+</mo><mn>4</mn></math><br /><math><mo>-</mo><mn>11</mn><mi>x</mi><mo>&#62;</mo><mo>-</mo><mn>2</mn><mo>&#8658;</mo><mi>x</mi><mo>&#60;</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>11</mn></mrow></mfrac></math><br /><math><mo>&#8658;</mo><mi>x</mi><mo>&#8712;</mo><mfenced open=\"[\" separators=\"|\"><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>11</mn></mrow></mfrac></mrow></mfenced></math><br />Taking the union of the two cases, we get,&nbsp;<br /><math><mi>x</mi><mo>&#8712;</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mi>&#8734;</mi><mo>,</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>11</mn></mrow></mfrac></mrow></mfenced></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8635bfb3b147ff4f500", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "18", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The possible values of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math> for which the equation&nbsp;<math><mi>n</mi><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mi>n</mi><mo>–</mo><mn>1</mn></mrow></mfenced><mi>x</mi><mo>+</mo><mfenced separators=\"|\"><mrow><mi>n</mi><mo>–</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math> has roots of opposite sign is/are given by", "image": null}, "options": [{"id": "fVYHI", "text": "no values of <math><mi>n</mi></math>", "image": null, "isCorrect": false}, {"id": "srINu", "text": "all values of <math><mi>n</mi></math>", "image": null, "isCorrect": false}, {"id": "D3C36", "text": "<math><mo>–</mo><mn>1</mn><mo>&lt;</mo><mi>n</mi><mo>&lt;</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "D07bA", "text": "<math><mn>0</mn><mo>&lt;</mo><mi>n</mi><mo>&lt;</mo><mn>1</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math><mi>D</mi><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi>n</mi><mo>–</mo><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>–</mo><mn>4</mn><mi>n</mi><mfenced separators=\"|\"><mrow><mi>n</mi><mo>–</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>4</mn><msup><mrow><mi>n</mi></mrow><mrow t": false}], "correctValue": null, "solution": {"text": "<p><math><mi>f</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mo>=</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi>m</mi><mi>x</mi><mo>+</mo><mn>1</mn></math> and <math><mi mathvariant=\"normal\">&#945;</mi><mo>&#8804;</mo><mi mathvariant=\"normal\">&#946;</mi></math> are the roots of <math><mi>f</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mo>=</mo><mn>0</mn><mo>.</mo></math><br />Now,&nbsp;<math><mi mathvariant=\"normal\">&#945;</mi><mo>&#60;</mo><mi mathvariant=\"normal\">&#946;</mi><mo>&#60;</mo><mn>1</mn></math> implies that <math><mi>f</mi><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math> and the coefficients of <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></math> have the same sign.</p><p>This gives <math><mi>f</mi><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced><mo>&#62;</mo><mn>0</mn></math><br /><math><mo>&#8658;</mo><mn>1</mn><mo>-</mo><mi>m</mi><mo>+</mo><mn>1</mn><mo>&#62;</mo><mn>0</mn><mo>&#8658;</mo><mi>m</mi><mo>&#60;</mo><mn>2</mn></math><br />Also, the discriminant is <math><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><mo>&#8805;</mo><mn>0</mn><mo>.</mo></math></p><p>So <math><mi>m</mi><mo>&#8804;</mo><mo>-</mo><mn>2</mn></math> or <math><mi>m</mi><mo>&#8805;</mo><mo>+</mo><mn>2</mn><mo>.</mo></math><br />Taking intersection, we get,</p><p>&nbsp;<math><mi>m</mi><mo>&#8804;</mo><mo>-</mo><mn>2</mn><mo>.</mo></math><br />Also, note that if <math><mi>m</mi><mo>=</mo><mo>-</mo><mn>2</mn><mo>,</mo></math> the roots are <math><mo>-</mo><mn>1</mn><mo>,</mo><mi mathvariant=\"normal\"></mi><mo>-</mo><mn>1</mn><mo>.</mo></math></p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8634cd943b523eeb369", "type": "s     let currentTopicIndex = 0;

    function toggleTheme() {

      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
