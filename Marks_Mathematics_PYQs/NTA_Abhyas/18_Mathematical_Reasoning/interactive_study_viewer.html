"_id": "6151e863f922c3a8b051cab7", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "104", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the following is true?<br />\r(i) If <math><mi>p</mi></math> is a statement then <math><mo>~</mo><mi>p</mi></math> is not a statement<br />\r(ii) If <math><mi>p</mi></math> is a statement then <math><mo>~</mo><mi>p</mi></math> is also a statement<br />\r(iii) Negation of \"<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>:</mo><mo>&nbsp;</mo><mi>x</mi></math> is a positive real number\" is, \"<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math> is a negative real number\"", "image": null}, "options": [{"id": "KWxhf", "text": "Only (ii)", "image": null, "isCorrect": true}, {"id": "UmaVI", "text": "Only (i)", "image": null, "isCorrect": false}, {"id": "Nb5Sf", "text": "(i) and (iii)", "image": null, "isCorrect": false}, {"id": "ogAIj", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As per definition of statement,negation of a statement is also a statement<br />Negation of <math><mi>p</mi></math> will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>&nbsp;is not a positive real number.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863f7bcebcb7b924669", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "29", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "qu "text": "Consider the statement <math><mi>p</mi></math> : If a cylinder is right circular cylinder then its volume is <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>π</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>h</mi><mo>.</mo></math><br />\rContrapositive of the statement <math><mi>p</mi></math> is", "image": null}, "options": [{"id": "2I7b6", "text": "If the volume of a cylinder is <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>π</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>h</mi></math> then it is not right circular cylinder", "image": null, "isCorrect": false}, {"id": "uJGKh", "text": "If the volume of a cylinder is not <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>π</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>h</mi></math> then it is not right circular cylinder", "image": null, "isCorrect": true}, {"id": "YA8Zu", "text": "If a cylinder is not right circular cylinder then its volume is not <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>π</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>h</mi></math>", "image": null, "isCorrect": false}, {"id": "omSQm", "text": "Volume can’t be <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>π</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mi>h</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Contrapositive of <math><mi mathvariant=\"normal\">&#8220;</mi><mi>p</mi><mo>&#8594;</mo><mi>q</mi><mi mathvariant=\"normal\">&#8221;</mi></math> is <math><mi mathvariant=\"normal\">&#8220;</mi><mo>~</mo><mi>q</mi><mo>&#8594;</mo><mo>~</mo><mi>p</mi><mi mathvariant=\"normal\">&#8221;</mi></math></p><p>Hence, the contrapositive of the given statement is: If the volume of a cylinder is not <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mi>&#960;</mi><msup> <mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>&#8658;</mo><mi>q</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "smggo", "text": "<math><mi>p</mi><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∨</mo><mi>q</mi></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "rx3Gq", "text": "<math><mi>p</mi><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∧</mo><mi>q</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "T5f0v", "text": "<math><mi>p</mi><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇔</mo><mi>q</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math><mi>p</mi><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mo>~</mo><mi mathvariant=\"normal\">q</mi><mo>&#8658;</mo><mi>p</mi></mrow></mfenced><mo>&#8801;</mo><mo>&#8764;</mo><mi>p</mi><mo>&#8744;</mo><mfenced separators=\"|\"><mrow><mi>q</mi><mo>&#8744;</mo><mi>p</mi></mrow></mfenced></math><br /><math><mo>&#8801;</mo><mfenced separators=\"|\"><mrow><mo>&#8764;</mo><mi>p</mi><mo>&#8744;</mo><mi>p</mi></mrow></mfenced><mo>&#8744;</mo><mfenced separators=\"|\"><mrow><mi>q</mi></mrow></mfenced><mo>&#8801;</mo><mi>t</mi><mo>&#8744;</mo><mfenced separators=\"|\"><mrow><mi>q</mi></mrow></mfenced><mo>&#8801;</mo><mi>t</mi></math><br />Hence, the given statement&nbsp;<math><mi>p</mi><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mo>~</mo><mi>q</mi><mo>&#8658;</mo><mi>p</mi></mrow></mfenced></math> is a tautology<br />Now,&nbsp;<math><mi>p</mi><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>&#8658;</mo><mi>q</mi></mrow></mfenced></math> is false when <math><mi>p</mi></math> is true and <math><mi>q</mi></math> is false</p><p>Hence, not a tautology<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mi>q</mi><mo>&#8744;</mo><mi>p</mi></mrow></mfenced><mo>&#8801;</mo><mo>~ : "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let <math><mo>⊕</mo></math> and <math><mo>⊗</mo></math> are two mathematical operators. If <math><mi>p</mi><mo>⊕</mo></math> <math><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⊗</mo><mi>q</mi></mrow></mfenced></math> is not a tautology, then <math><mo>⊕</mo></math> and <math><mo>⊗</mo></math> can be", "image": null}, "options": [{"id": "ghCcX", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8744;</mo></math> and <math><mo>&#8658;</mo></math> respectively", "image": null, "isCorrect": false}, {"id": "bVp4y", "text": "<math><mo>⇒</mo></math> and <math><mo>∧</mo></math> respectively", "image": null, "isCorrect": true}, {"id": "gT6vV", "text": "<math><mo>&#8658;</mo></math> and <math><mo>∨</mo></math> respectively", "image": null, "isCorrect": false}, {"id": "RJrh3", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></math> <math><mi>p</mi><mo>∨</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇒</mo><mi>q</mi></mrow></mfenced></math> is false only if <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> is false and&nbsp;<math><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇒</mo><mi>q</mi></mrow></mfenced></math> is false which is never possible simultaneously. Hence,&nbsp;<math><mi>p</mi><mo>∨</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇒</mo><mi>q</mi></mrow></mfenced></math> is a tautology<br /><math><mfenced separators=\"|\"><mrow><mi>C</mi></mrow></mfenced></math> <math><mi>p</mi><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∨</mo><mi>q</mi></mrow></mfenced></math> is false only if <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> is true and <math><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∨</mo><mi>q</mi></mrow></mfenced></math> is false which is never possible simultaneously. Hence,&nbsp;<math><mi>p</mi><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∨</mo><mi>q</mi></mrow></mfenced></math> is a tautology<br /><math><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced></math> <math><mi>p</mi><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∧</mo><mi>q</mi></mrow></mfenced></math> is false only if <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> is true &amp; <math><mi>p</mi><mo>∧</mo><mi>q</mi></math> is false which is possible when <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> is true &amp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math> is false. Hence,&nbsp;<math><mi>p</mi><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∧</mo><mi>q</mi></mrow></mfenced></math> is not a tautology", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863a7e70d00bb9d92c9", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "35", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let <math><mi>p</mi><mo>:</mo></math> Maths is interesting and <math><mi>q</mi><mo>:</mo></math> Maths is easy, then <math><mi>p</mi><mo>⇒</mo><mfenced separators=\"|\"><mrow><mo>~</mo><mi>p</mi><mo>∨</mo><mi>q</mi></mrow></mfenced></math> is equivalent to", "image": null}, "options": [{"id": "nQOwI", "text": "If Maths is easy then it is interesting", "image": null, "isCorrect": false}, {"id": "uPBrr", "text": "Either Maths is interesting or it easy", "image": null, "isCorrect": false}, {"id": "WMOvs", "text": "If Maths is interseting then it is easy", "image": null, "isCorrect": true}, {"id": "gRkgp", "text": "Maths is neither interesting nor easy", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>p</mi><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mo>~</mo><mi>p</mi><mo>∨</mo><mi>q</mi></mrow></mfenced></math>  <br/><math><mo>≡</mo><mo>~</mo><mi>p</mi><mo>∨</mo><mfenced separators=\"|\"><mrow><mo>~</mo><mi>p</mi><mo>∨</mo><mi>q</mi></mrow></mfenced></math>  <br/><math><mo>≡</mo><mfenced separators=\"|\"><mrow><mo>~</mo><mi>p</mi><mo>∨</mo><mo>~</mo><mi>p</mi></mrow></mfenced><mo>∨</mo><mi>q</mi></math>  <br/><math><mo>≡</mo><mo>~</mo><mi>p</mi><mo>∨</mo><mi>q</mi></math>  <br/><math><mo>≡</mo><mi>p</mi><mo>&#8658;</mo><mi>q</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8639e94eeab04f1e427", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "98", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Consider the statement&nbsp;<math><mi>p</mi><mi></mi><mo>:</mo></math> If slope of a straight line is <math><mn>1</mn></math>&nbsp;then it is equally inclined to both the axes.</p>\r\r<p>Then, the contrapositive of the statement&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;is</p>\r", "image": null}, "options": [{"id": "Wcmva", "text": "If a straight line is equally inclined to both the axes then its slope is <math><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "IPBIC", "text": "If a straight line is equally inclined to both the axes then its slope is not <math><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "vgHgW", "text": "If a straight line is not e as (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "What are the truth values of <math><mfenced separators=\"|\"><mrow><mo>&#8764;</mo><mi>p</mi><mo>&#8658;</mo><mo>&#8764;</mo><mi>q</mi></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><mo>&#8764;</mo><mi>p</mi><mo>&#8658;</mo><mi>q</mi></mrow></mfenced></math> respectively, when <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math> always speak the truth in any argument?", "image": null}, "options": [{"id": "LJp9A", "text": "<math><mi>T</mi><mo>,</mo><mi>&nbsp;</mi><mi>T</mi></math>", "image": null, "isCorrect": true}, {"id": "IBAe4", "text": "<math><mi>F</mi><mo>,</mo><mi> </mi><mi>F</mi></math>", "image": null, "isCorrect": false}, {"id": "jqcR9", "text": "<math><mi>T</mi><mo>,</mo><mi>&nbsp;</mi><mi>F</mi></math>", "image": null, "isCorrect": false}, {"id": "cONgB", "text": "<math><mi>F</mi><mo>,</mo><mi> </mi><mi>T</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since, truth value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math> and truth value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math> is also <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>T</mi></math><br /><br />So,&nbsp;<math><mo>~</mo><mi>p</mi></math> is always false, therefore&nbsp;<math><mfenced separators=\"|\"><mrow><mo>∼</mo><mi>p</mi><mo>⇒</mo><mo>∼</mo><mi>q</mi></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><mo>∼</mo><mi>p</mi><mo>⇒</mo><mi>q</mi></mrow></mfenced></math> are always true<br /><br />(since,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>⇒</mo><mi>q</mi></math> is false only when <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> is true and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math> is false<math><mo>)</mo></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638f5aba75655b7a7f", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "26", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math><mi>p</mi><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mi>q</mi><mo>&#8744;</mo><mi>r</mi></mrow></mfenced></math> is false, then the truth values of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>,</mo><mo>&#160;</mo><mi>q</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>r</mi></math>&nbsp;respectively&nbsp;are (here, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">T</mi></math> is true and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">F</mi></math> is false)", "image": null}, "options": [{"id": "WTmmL", "text": "<math><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">F</mi></math>", "image": null, "isCorrect": true}, {"id": "GKksN", "text": "<math><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">F</mi></math>", "image": null, "isCorrect": false}, {"id": "Ea8df", "text": "<math><mi mathvariant=\"normal\">F</mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">T</mi></math>", "image": null, "isCorrect": false}, {"id": "CjPGK", "text": "<math><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">T</mi><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\">F</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> is true and <math><mfenced separators=\"|\"><mrow><mi>q</mi><mo>&#8744;</mo><mi>r</mi></mrow></mfenced></math> is false<br /><math><mo>&#8658;</mo><mi>p</mi></math> is true, <math><mi>q</mi></math> is false and&nbsp;<math><mi>r</mi></math> is false", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638e4743aab2fb4e81", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "81", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">p</mi><mo>,</mo><mo>&#160;</mo><mi mathvariant=\"normal\">q</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">r</mi></math> are three logical statements, then the truth value of the statement <math><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">p</mi><mo>&#8743;</mo><mi mathvariant=\"normal\">q</mi></mrow></mfenced><mo>&#8744;</mo><mfenced separators=\"|\"><mrow><mo>&#8764;</mo><mi mathvariant=\"normal\">q</mi><mo>&#8594;</mo><mi mathvariant=\"normal\">r</mi></mrow></mfenced></math>, where <math><mi mathvariant=\"normal\">p</mi></math> is true, is", "image": null}, "options": [{"id": "bbYHS", "text": "True if <math><mi mathvariant=\"normal\">q</mi></math> is false", "image": null, "isCorrect": false}, {"id": "360Es", "text": "False if <math><mi mathvariant=\"normal\">q</mi></math> is false", "image": null, "isCorrect": false}, {"id": "hPgYe", "text": "True if <math><mi mathvariant=\"normal\">q</mi></math> is true", "image": null, "isCorrect": true}, {"id": "XhzYc", "text": "False if <math><mi mathvariant=\"normal\">q</mi></math> is true", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Clearly, if <math><mi mathvariant=\"normal\">q</mi></math> is true, <math><mi mathvariant=\"normal\">p</mi></math> is true then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">p</mi><mo>&#8743;</mo><mi mathvariant=\"normal\">q</mi></mrow></mfenced></math> is true<br />Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">p</mi><mo>&#8743;</mo><mi mathvariant=\"normal\">q</mi></mrow></mfenced><mo>&#8744;</mo><mfenced separators=\"|\"><mrow><mo>~</mo><mi mathvariant=\"normal\">q</mi><mo>&#8594;</mo><mi mathvariant=\"normal\">r</mi></mrow></mfenced></math> is true irrespective of <math><mi mathvariant=\"normal\">r</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8638b154cdd27dddd29", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "03", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The logically equivalent proposition of <math><mi>p</mi><mo>⇔</mo><mi>q</mi></math> is", "image": null}, "options": [{"id": "ElNUR", "text": "<math><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∧</mo><mi>q</mi></mrow></mfenced><mo>∨</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∧</mo><mi>q</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "OAD6W", "text": "<math><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇒</mo><mi>q</mi></mrow></mfenced><mo>∧</mo><mfenced separators=\"|\"><mrow><mi>q</mi><mo>⇒</mo><mi>p</mi></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "0452y", "text": "<math><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∧</mo><mi>q</mi></mrow></mfenced><mo>∨</mo><mfenced separators=\"|\"><mrow><mi>q</mi><mo>⇒</mo><mi>p</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "e4ybG", "text": "<math><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∧</mo><mi>q</mi></mrow></mfenced><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi>q</mi><mo>∨</mo><mi>p</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇒</mo><mi>q</mi></mrow></mfenced><mo>∧</mo><mfenced separators=\"|\"><mrow><mi>q</mi><mo>⇒</mo><mi>p</mi></mrow></mfenced></math> means <math><mi>p</mi><mo>⇔</mo><mi>q</mi></math>.<br /><br />Hence the logically equivalent proposition of <math><mi>p</mi><mo>⇔</mo><mi>q</mi></math> is <math><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇒</mo><mi>q</mi></mrow></mfenced><mo>∧</mo><mfenced separators=\"|\"><mrow><mi>q</mi><mo>⇒</mo><mi>p</mi></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863824a891280271891", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "12", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "For two statements <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"nor mi>p</mi><mo>∧</mo><mi>q</mi></mrow></mfenced><mo>≡</mo><mi>p</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8637150b91af5cc5ba4", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "67", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<math><mo>∼</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∨</mo><mi>q</mi></mrow></mfenced><mo>∨</mo><mfenced separators=\"|\"><mrow><mo>∼</mo><mi>p</mi><mo>∧</mo><mi>q</mi></mrow></mfenced></math> is equivalent to", "image": null}, "options": [{"id": "oUV8L", "text": "<math><mi>p</mi></math>", "image": null, "isCorrect": false}, {"id": "uessf", "text": "<math><mo>∼</mo><mi>p</mi></math>", "image": null, "isCorrect": true}, {"id": "DII7U", "text": "<math><mi>q</mi></math>", "image": null, "isCorrect": false}, {"id": "BRvW2", "text": "<math><mo>∼</mo><mi>q</mi></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>~</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∨</mo><mi>q</mi></mrow></mfenced><mo>∨</mo><mfenced separators=\"|\"><mrow><mo>~</mo><mi>p</mi><mo>∧</mo><mi>q</mi></mrow></mfenced><mo>≡</mo><mfenced separators=\"|\"><mrow><mo>~</mo><mi>p</mi><mo>∧</mo><mo>~</mo><mi>q</mi></mrow></mfenced><mo>∨</mo><mfenced separators=\"|\"><mrow><mo>~</mo><mi>p</mi><mo>∧</mo><mi>q</mi></mrow></mfenced></math> (By De morgan's Law)<br /><math><mo>≡</mo><mo>∼</mo><mi>p</mi><mo>∧</mo><mfenced separators=\"|\"><mrow><mo>∼</mo><mi>q</mi><mo>∨</mo><mi>q</mi></mrow></mfenced></math> (By complement laws)<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>≡</mo><mo>~</mo> xt": "<math><mi>p</mi><mo>⇒</mo><mfenced separators=\"|\"><mrow><mo>~</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi>p</mi><mo>∨</mo><mi>q</mi></mrow></mfenced></math> is false means <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math> is true and <math><mo>~</mo><mi mathvariant=\"normal\">&nbsp;</mi><mi>p</mi><mo>∨</mo><mi>q</mi></math> is false.<br /><br /><math><mo>⇒</mo></math> <math><mi>p</mi></math> is true and both <math><mo>~</mo><mi>p</mi></math> and <math><mi>q</mi></math> are false.<br /><br /><math><mo>⇒</mo><mi>p</mi></math> is true and <math><mi>q</mi></math> is false.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863289bd42ed55d7290", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "24", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math><mi>p</mi></math>&nbsp;and&nbsp;<math><mi>q</mi></math> are two statements, then which of the following statements is not equivalent to <math><mi>p</mi><mo>⇔</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇒</mo><mi>q</mi></mrow></mfenced></math>?", "image": null}, "options": [{"id": "72ZM7", "text": "<math><mi>p</mi><mo>∧</mo><mi>q</mi></math>", "image": null, "isCorrect": false}, {"id": "VKInO", "text": "<math><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇔</mo><mi>q</mi></mrow></mfenced><mo>∧</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∨</mo><mi>q</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "K6hYq", "text": "<math><mfenced separators=\"|\"><mrow><mi>q</mi><mo>&#8658;</mo><mi>p</mi></mrow></mfenced><mo>⇔</mo><mi>q</mi></math>", "image": null, "isCorrect": false}, {"id": "rA8NG", "text": "<math><mfenced separators=\"|\"><mrow><mo>~</mo><mi>q</mi><mo>⇒</mo><mi>p</mi></mrow></mfenced><mo>∧</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇒</mo><mi mathvariant=\"normal\"></mi><mo>~</mo><mi>q</mi></mrow></mfenced></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<table border=\"1px solid\">\t<thead>\t\t<tr>\t\t\t<th><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math></th>\t\t\t<th><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math></th>\t\t\t<th><math><mi>p</mi><mo>⇒</mo><mi>q</mi></math></th>\t\t\t<th><math><mi>p</mi><mo>⇔</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇒</mo><mi>q</mi></mrow></mfenced></math></th>\t\t</tr>\t</thead>\t<tbody>\t\t<tr>\t\t\t<td>T</td>\t\t\t<td>T</td>\t\t\t<td>T</td>\t\t\t<td>T</td>\t\t</tr>\t\t<tr>\t\t\t<td>T</td>\t\t\t<td>F</td>\t\t\t<td>F</td>\t\t\t<td>F</td>\t\t</tr>\t\t<tr>\t\t\t<td>F</td>\t\t\t<td>T</td>\t\t\t<td>T</td>\t\t\t<td>F</td>\t\t</tr>\t\t<tr>\t\t\t<td>F</td>\t\t\t<td>F</td>\t\t\t<td>T</td>\t\t\t<td>F</td>\t\t</tr>\t</tbody></table><br /><math><mo>⇒</mo><mi>p</mi><mo>⇔</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇒</mo><mi>q</mi></mrow></mfenced><mo>≡</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∧</mo><mi>q</mi></mrow></mfenced><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></math> is true<br />Now,&nbsp;<math><mi>q</mi><mo>⇔</mo><mfenced separators=\"|\"><mrow><mi>q</mi><mo>⇒</mo><mi>p</mi></mrow></mfenced><mo>≡</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∧</mo><mi>q</mi></mrow></mfenced><mo>≡</mo><mi>p</mi><mo>∧</mo><mi>q</mi></math><br /><math><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi>q</mi><mo>⇒</mo><mi>p</mi></mrow></mfenced><mo>⇒</mo><mi>q</mi><mo>≡</mo><mi>p</mi><mo>∧</mo><mi>q</mi><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi>C</mi></mrow></mfenced></math> is true<br />Now, common between<br /><math><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇔</mo><mi>q</mi></mrow></mfenced></math> &amp; <math><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∨</mo><mi>q</mi></mrow></mfenced></math> is<br /><math><mi>p</mi><mo>∧</mo><mi>q</mi><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇔</mo><mi>q</mi></mrow></mfenced><mo>∧</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>∨</mo><mi>q</mi></mrow></mfenced><mo>≡</mo><mi>p</mi><mo>∧</mo><mi>q</mi></math><br /><math><mo>⇒</mo><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced></math> is correct<br />Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced separators=\"|\"><mrow><mo>~</mo><mi>q</mi><mo>⇒</mo><mi>p</mi></mrow></mfenced><mo>∧</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇒</mo><mo>~</mo><mi>q</mi></mrow></mfenced><mo>≡</mo><mfenced separators=\"|\"><mrow><mi>q</mi><mo>∨</mo><mi>p</mi></mrow></mfenced><mo>∧</mo><mfenced separators=\"|\"><mrow><mo>~</mo><mi>p</mi><mo>∨</mo><mo>~</mo><mi>q</mi></mrow></mfenced></math><br /><math><mo>=</mo></math> Only <math><mi mathvariant=\"normal\"></mi><mi>p</mi></math> or only <math><mi>q</mi><mo>≡</mo><mo>~</mo><mfenced separators=\"|\"><mrow><mi>p</mi><mo>⇔</mo><mi>q</mi></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863282815a149270fe0", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "06", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>The contrapositive of the statement \"If two triangles are identical, then they are similar\" is</p>\r", "image": null}, "options": [{"id": "Zo0XU", "text": "If two triangles are not similar, then they are not identical", "image": null, "isCorrect": true}, {"id": "krK4t", "text": "If two triangles are not identical, then they are not similar", "image": null, "isCorrect": false}, {"id": "awyif", "text": "If two triangles are not identical, then they are similar", "image": null, "isCorrect": false}, {"id": "vD51r", "text": "If two triangles are not similar, then they are identical", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Let, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>: Two triangles are identical<br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>q</mi></math>: Two triangles are similar</p><p>Clearly, the given statement in symbolic form is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>→</mo><mi>q</mi></math>.<br /><br />Contrapositive of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>→</mo><mi>q</mi></math> is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"> <mrow> <mo>∼</mo><mi>q</mi><mo>→</mo><mo>∼</mo><mi>p</mi></mrow> </math><br /><br />i.e., If two triangles are not similar, then they are not identical.</p>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863250dadbd4e70e140", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "85", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Which of the statements is not a fallacy?", "image": null}, "options": [{"id": "TsU6m", "text": "<math><mi>p</mi><mo>∧</mo><mfenced separators=\"|\"><mrow><mo>∼</mo><mfenced separators=\"|\"><mrow><mo>∼</mo><mi>p</mi><mo>&#8658;</mo><mo>∼</mo><mi>q</mi></mrow></mfenced></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "7Ewk2", "text": "<math><mo>∼</mo><mfenced separators=\"|\"><mrow><mfence     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
