tegory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863dcf09c094678a1bd", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "99", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If <math><mn>4</mn></math> letter words are formed using letters of the word ‘MORADABAD’, then the probability that D comes exactly once in the&nbsp;<math><mn>4</mn></math> letter word is", "image": null}, "options": [{"id": "cQqt7", "text": "<math><mfrac><mrow><mn>146</mn></mrow><mrow><mn>313</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "v4r4g", "text": "<math><mfrac><mrow><mn>213</mn></mrow><mrow><mn>313</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Y9qwW", "text": "<math><mfrac><mrow><mn>167</mn></mrow><mrow><mn>313</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "8GTD4", "text": "<math><mfrac><mrow><mn>520</mn></mrow><mrow><mn>621</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total cases&nbsp;<math><mo>=</mo><mn>4</mn></math> letter word is formed by using either <math><mn>3</mn></math> identical letter and <math><mn>1</mn></math>&nbsp;distinct letter or <math><mn>2</mn></math> alike of one kind and <math><mn>2</mn></math> alike of <math><msup><mrow><mn>2</mn></mrow><mrow><mi mathvariant=\"normal\">n</mi><mi mathvariant=\"normal\">d</mi></mrow></msup></math> kind or <math><mn>2</mn></math> alike, <math><mn>2</mn></math> distinct or <math><mn>4</mn></math> distinct<br />Number of ways for&nbsp;<math><mn>3</mn></math> alike and <math><mn>1</mn></math> distinct <math><mo>=</mo><msub><mrow><mmultiscripts><mrow><mi>C</mi></mrow><mprescripts></mprescripts><mrow><mi></mi></mrow><mrow><mn>1</mn></mrow></mmultiscripts></mrow><mrow><mn>1</mn></mrow></msub><mo>&#215;</mo><msub><mrow><mmultiscripts><mrow><mi>C</mi></mrow><mprescripts></mprescripts><mrow><mi></mi></mrow><mrow><mn>5</mn></mrow></mmultiscripts></mrow><mrow><mn>1</mn></mrow></msub><mo>&#215;</mo><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>3</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>20</mn></math><br />Number of ways for&nbsp;<math><mn>2</mn></math> alike and <math><mn>2</mn></math> alike <math><mo>=</mo><msub><mrow><mmultiscripts><mrow><mi>C</mi></mrow><mprescripts></mprescripts><mrow><mi></mi></mrow><mrow><mn>2</mn></mrow></mmultiscripts></mrow><mrow><mn>2</mn></mrow></msub><mo>&#215;</mo><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo><mi></mi><mn>2</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>6</mn></math><br />Number of ways for&nbsp;<math><mn>2</mn></math> alike and <math><mn>2</mn></math> distinct <math><mo>=</mo><msub><mrow><mmultiscripts><mrow><mi>C</mi></mrow><mprescripts></mprescripts><mrow><mi></mi></mrow><mrow><mn>2</mn></mrow></mmultiscripts></mrow><mrow><mn>1</mn></mrow></msub><mo>&#215;</mo><msub><mrow><mmultiscripts><mrow><mi>C</mi></mrow><mprescripts></mprescripts><mrow><mi></mi></mrow><mrow><mn>5</mn></mrow></mmultiscripts></mrow><mrow><mn>2</mn></mrow></msub><mo>&#215;</mo><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>240</mn></math><br />Number of ways for&nbsp;<math><mn>4</mn></math> distinct <math><mo>=</mo><msub><mrow><mmultiscripts><mrow><mi>C</mi></mrow><mprescripts></mprescripts><mrow><mi></mi></mrow><mrow><mn>6</mn></mrow></mmultiscripts></mrow><mrow><mn>4</mn></mrow></msub><mo>&#215;</mo><mn>4</mn><mo>!</mo><mo>=</mo><mn>360</mn></math><br />The total number of ways <math><mo>=</mo><mn>20</mn><mo>+</mo><mn>6</mn><mo>+</mo><mn>240</mn><mo>+</mo><mn>360</mn><mo>=</mo><mn>626</mn></math><br />For favorable cases, the following possibilities are there (one D&nbsp;is always included)<br />Number of ways for&nbsp;<math><mn>3</mn></math> alike <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mmultiscripts><mi>C</mi><mn>1</mn><none/><mprescripts/><mrow/><mn>1</mn></mmultiscripts><mo>&#215;</mo><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>3</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>4</mn></math><br />Number of ways for&nbsp;<math><mn>2</mn></math> alike <math><mo>+</mo><mn>1</mn></math> distinct <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mmultiscripts><mi>C</mi><mn>1</mn><none/><mprescripts/><mrow/><mn>1</mn></mmultiscripts><mo>&#215;</mo><mmultiscripts><mi>C</mi><mn>1</mn><none/><mprescripts/><mrow/><mn>4</mn></mmultiscripts><mo>&#215;</mo><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>48</mn></math><br />Number of ways for&nbsp;<math><mn>3</mn></math> distinct <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mmultiscripts><mi>C</mi><mn>3</mn><none/><mprescripts/><mrow/><mn>5</mn></mmultiscripts><mo>&#215;</mo><mn>4</mn><mo>!</mo><mo>=</mo><mn>240</mn></math><br />The total number of ways for favorable cases <math><mo>=</mo><mn>240</mn><mo>+</mo><mn>48</mn><mo>+</mo><mn>4</mn><mo>=</mo><mn>292</mn></math><br />Hence, the required probability <math><mo>=</mo><mfrac><mrow><mn>292</mn></mrow><mrow><mn>626</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>146</mn></mrow><mrow><mn>313</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863ca218e07688d6f78", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "107", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"t te that <math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced><mo>=</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi><mo>&#8745;</mo><mi>C</mi></mrow></mfenced><mo>+</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi><mo>&#8745;</mo><mi>B</mi><mo>&#8745;</mo><mover accent=\"true\"><mrow><mi>C</mi></mrow><mo>-</mo></mover></mrow></mfenced><mo>+</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mover accent=\"true\"><mrow><mi>A</mi></mrow><mo>-</mo></mover><mo>&#8745;</mo><mi>B</mi><mo>&#8745;</mo><mover accent=\"true\"><mrow><mi>C</mi></mrow><mo>-</mo></mover></mrow></mfenced></math><br />Hence,&nbsp;<math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi><mo>&#8745;</mo><mi>C</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>12</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863c467f4fd7d0d7975", "type": "numerical", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "42", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A subset of <math><mn>5</mn></math> elements is chosen from the set of first <math><mn>15</mn></math> natural numbers. The probability that at least two of the five numbers are consecutive is <math><mi>λ</mi></math>, then the value of&nbsp;<math><mfrac><mrow><mn>22</mn></mrow><mrow><mi>λ</mi></mrow></mfrac></math> is equal to", "image": null}, "options": [], "correctValue": "26", "solution": {"text": "Total cases&nbsp;<math><mo> rrect": false}, {"id": "EHLTW", "text": "<math><mfrac><mrow><mn>16</mn></mrow><mrow><mn>35</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "2FRXy", "text": "<math><mfrac><mrow><mn>11</mn></mrow><mrow><mn>35</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Total number of ways <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mo>=</mo><mn>14</mn></msup><msub><mi>C</mi><mn>3</mn></msub></math><br />If three numbers are multiplied and the product is a negative number then it should be either <math><mn>3</mn></math> negative numbers or <math><mn>2</mn></math> positive and <math><mn>1</mn></math> negative number<br />Total favourbale number of ways <math><mo>=</mo><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>8</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>+</mo><msup><mrow><mi mathvariant=\"normal\"></mi></mrow><mrow><mn>6</mn></mrow></msup><msup><mrow><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>8</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>1</mn></mrow></msub></math><br />Hence, required probability <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><msup><mrow/><mn>8</mn></msup><msub><mi>C</mi><mn>3</mn></msub><msup><mo>+</mo><mn>6</mn></msup><msup><msub><mi>C</mi><mn>2</mn></msub><mn>8</mn></msup><msub><mi>C</mi><mn>1</mn></msub></mrow><mrow><msup><mrow/><mn>14</mn></msup><msub><mi>C</mi><mn>3</mn></msub></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>56</mn><mo>+</mo><mn>120</mn></mrow><mn>364</mn></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>44</mn><mn>91</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, { rue}], "correctValue": null, "solution": {"text": "Number of ways of selecting <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi></math> tickets from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi></math> tickets numbered from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">N</mi></math> with replacement <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">n</mi></msup></math><br /><br />Now, the largest number on selected tickets must be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">k</mi></math>. Hence, favorable cases <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">n</mi></msup><mo>−</mo><msup><mrow><mo>(</mo><mi mathvariant=\"normal\">k</mi><mo>−</mo><mn>1</mn><mo>)</mo></mrow><mi mathvariant=\"normal\">n</mi></msup></math><br /><br />Therefore, required probability <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><msup><mi mathvariant=\"normal\">k</mi><mi mathvariant=\"normal\">n</mi></msup><mo>−</mo><msup><mrow><mo>(</mo><mi mathvariant=\"normal\">k</mi><mo>−</mo><mn>1</mn><mo>)</mo></mrow><mi mathvariant=\"normal\">n</mi></msup></mrow><msup><mi mathvariant=\"normal\">N</mi><mi mathvariant=\"normal\">n</mi></msup></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863892b596105cd971b", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "59", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> are two independent events such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><mi>A</mi></mfenced><mo>&gt;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>,</mo><mo>&nbsp;</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi><mo>∩</mo><msup><mi>B</mi><mi>C</mi></msup></mrow></mfenced><mo>=</mo><mfrac><mn>3</mn><mn>25</mn></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><mrow><msup><mi>A</mi><mi>C</mi></msup><mo>∩</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mn>8</mn><mn>25</mn></mfrac><mo>,</mo></math> then <math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced></math>&nbsp;is equal to (where, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>A</mi><mi>c</mi></msup></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>B</mi><mi>c</mi></msup></math>&nbsp;represent the complement&nbsp;of events&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math>&nbsp;respectively)", "image": null}, "options": [{"id": "u54tm", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "bBCrx", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "ozxCT", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "h98oL", "text": "<math><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "s ath><br />From <math><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><mn>3</mn></mrow></mfenced></math><br /><math><mfenced separators=\"|\"><mrow><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn></mrow></mfrac></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>25</mn></mrow></mfrac></math><br />Let,&nbsp;<math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced><mo>=</mo><mi>t</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mn>6</mn><mn>5</mn></mfrac><mi>t</mi><mo>-</mo><mfrac><mn>1</mn><mn>5</mn></mfrac><mo>-</mo><msup><mi>t</mi><mn>2</mn></msup><mo>=</mo><mfrac><mn>3</mn><mn>25</mn></mfrac><mo>&#8658;</mo><mn>30</mn><mi>t</mi><mo>-</mo><mn>5</mn><mo>-</mo><mn>25</mn><msup><mi>t</mi><mn>2</mn></msup><mo>=</mo><mn>3</mn></math><br /><math><mo>&#8658;</mo><mn>25</mn><msup><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>30</mn><mi>t</mi><mo>+</mo><mn>8</mn><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mi>t</mi><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math><br /><math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>&#8658;</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math><br /><math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac><mo>&#8658;</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math><br /><math><mo>&#8757;</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>&#62;</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>&#8658;</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8636e5bb0259299600c", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "51", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Given two independent events, if the probability that both the events occur is <math><mfrac><mrow><mn>8</mn></mrow><mrow><mn>49</mn></mrow></mfrac></math>, the probability that exactly one of them occurs is <math><mfrac><mrow><mn>26</mn></mrow><mrow><mn>49</mn></mrow></mfrac></math>&nbsp;and&nbsp;the probability of more probable of the two events is <math><mi>λ</mi></math>, then <math><mn>14</mn><mi>λ</mi></math> is equal to", "image": null}, "options": [{"id": "DAdLy", "text": "<math><mn>2</mn></math>", "image": null, "isCorrect": false}, {"id": "7Xmha", "text": "<math><mn>4</mn></math>", "image": null, "isCorrect": false}, {"id": "RsEv5", "text": "<math><mn>8</mn></math>", "image": null, "isCorrect": true}, {"id": "2wlzK", "text": "<math><mn>7</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>A</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi></math> are two independent events<br /><math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi><mo>∩</mo><mi>B</mi></mrow></mfenced><mo>=</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>⋅</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>8</mn></mrow><mrow><mn>49</mn></mrow></mfrac></math> … <math><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math><br /><math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi><mo>∩</mo><msup><mrow><mi>B</mi></mrow><mrow><mi>c</mi></mrow></msup></mrow></mfenced><mo>+</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi><mo>∩</mo><msup><mrow><mi>A</mi></mrow><mrow><mi>c</mi></mrow></msup></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>26</mn></mrow><mrow><mn>49</mn></mrow></mfrac></math><br /><math><mo>⇒</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>+</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\"></mi><mi mathvariant=\"normal\"></mi><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>⋅</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>26</mn></mrow><mrow><mn>49</mn></mrow></mfrac></math><br /><math><mo>⇒</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>+</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>42</mn></mrow><mrow><mn>49</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>6</mn></mrow><mrow><mn>7</mn></mrow></mfrac></math> … <math><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></math><br />From <math><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></math> and <math><mfenced separators=\"|\"><mrow><mn>2</mn></mrow></mfenced></math>, we get,&nbsp;<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><mi>A</mi></mfenced><mo>=</mo><mfrac><mn>4</mn><mn>7</mn></mfrac><mo>,</mo><mo>&nbsp;</mo><mi>P</mi><mfenced separators=\"|\"><mi>B</mi></mfenced><mo>=</mo><mfrac><mn>2</mn><mn>7</mn></mfrac></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><mi>A</mi></mfenced><mo>=</mo><mfrac><mn>2</mn><mn>7</mn></mfrac><mo>,</mo><mo>&nbsp;</mo><mi>P</mi><mfenced separators=\"|\"><mi>B</mi></mfenced><mo>=</mo><mfrac><mn>4</mn><mn>7</mn></mfrac></math><br />hence, the probability of the more probable event is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>λ</mi><mo>=</mo><mfrac><mn>4</mn><mn>7</mn></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863644bdf1bbf72cc7e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "108", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "A man alternately tosses a coin and throw a dice, beginning with the coin. The probability that he gets a head in coin before he gets a <math><mn>5</mn></math> or <math><mn>6</mn></math> in dice, is", "image": null}, "options": [{"id": "otJKn", "text": "<math><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "ZYTZd", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "rv3Gq", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "hTRhz", "text": "<math><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>A</mi><mo>=</mo></math> coin show head<br /><m }, {"id": "vZQin", "text": "<math><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>10</mn></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For any toss, total cases: <math><mi>H</mi><mi>H</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi>H</mi><mi>T</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi>T</mi><mi>H</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi>T</mi><mi>T</mi></math> ( <math><mn>4</mn></math> cases)<br /><math><mo>∴</mo></math> both of them will not get tail at same toss, then the favorable cases: <math><mi>H</mi><mi>H</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi>H</mi><mi>T</mi><mo>,</mo><mi mathvariant=\"normal\"></mi><mi>T</mi><mi>H</mi></math> ( <math><mn>3</mn></math> cases)<br />Hence, the required probability <math><mo>=</mo><msup><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced></mrow><mrow><mn>10</mn></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e8631f18f11e235b1b0e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "91", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The probability of a problem being solved by <math><mn>3</mn></math> students independently are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>,</mo><mo>&nbsp;</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>α</mi></math> respectively. If the probability that the problem  />Hence, required probability <math><mo>=</mo><mfrac><mrow><mn>3</mn><mo>!</mo><mo>+</mo><mn>1</mn></mrow><mrow><msup><mrow><mn>3</mn></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>27</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e863117babcf75011990", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "02", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "<p>Fifteen coupons are numbered <math><mn>1, 2, 3</mn><mo>,</mo><mo>…</mo><mo>.</mo><mo>.</mo><mo>,</mo><mn>15</mn></math> respectively. Seven coupons are selected at random one at a time with replacement. The probability, that the largest number appearing on selected coupons is at most <math><mn>9</mn></math>, is</p>\r", "image": null}, "options": [{"id": "YAOxo", "text": "<math><mrow>  <msup>        <mrow>          <mfenced open=\"(\" close=\")\" separators=\",\">            <mrow>              <mfrac>                <mrow>                  <mn>1</mn>                </mrow>                <mrow>                  <mn>1</mn>                  <mn>5</mn>                </mrow>              </mfrac>            </mrow>          </mfenced>        </mrow>        <mn>7</mn>  </msup></mrow></math>", "image": null, "isCorrect": false}, {"id": "ml1nb", "text": "<math> <mrow> <msup> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>3</mn> </mrow> <mrow> <mn>5</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> <mn>7</mn> </msup> </mrow> </math>", "image": null, "isCorrect": true}, {"id": "Eq8pf", "text": "<math> <mrow> <msup> <mrow> <mfenced close=\")\" o ter</mi><mo>&#160;</mo><mi>turns</mi><mo>&#160;</mo><mi>out</mi><mo>&#160;</mo><mi>to</mi><mo>&#160;</mo><mi>be</mi><mo>&#160;</mo><mi>defective</mi><mo>&#160;</mo><mi>given</mi><mo>&#160;</mo><mi>that</mi><mo>&#160;</mo><mi>it</mi><mo>&#160;</mo><mi>is</mi><mo>&#160;</mo><mi>produced</mi><mo>&#160;</mo><mi>in</mi><mo>&#160;</mo><mi>plant</mi><mo>&#160;</mo><msub><mi>T</mi><mn>2</mn></msub><mo>)</mo></math>.<br />\r<br />\rWhere,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>(</mo><mi mathvariant=\"normal\">E</mi><mo>)</mo></math> denotes the probability of an event <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">E</mi></math>. A computer produced in the factory is randomly selected and it does not turn out to be defective. Then the probability that it is produced in plant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mtext mathvariant=\"italic\">T</mtext><mn>2</mn></msub></math> is", "image": null}, "options": [{"id": "HgjqZ", "text": "<math><mfrac><mrow><mn>36</mn></mrow><mrow><mn>73</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "bqqkM", "text": "<math><mfrac><mrow><mn>47</mn></mrow><mrow><mn>79</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "1SIvL", "text": "<math><mfrac><mrow><mn>78</mn></mrow><mrow><mn>93</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "K8gw5", "text": "<math><mfrac><mrow><mn>75</mn></mrow><mrow><mn>83</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>P</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>20</mn></mrow><mrow><mn>100</mn></mrow></mfrac></math><br /><br /><math><mi>P</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>80</mn></mrow><mrow><mn>100</mn></mrow></mfrac></math><br /><br />Let,&nbsp;<math><mi>P</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>D</mi></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></mrow></mfenced><mo>=</mo><mi>x</mi></math>&nbsp;(where,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi></math>&nbsp;represents defective units)<br /><br /><math><mi>P</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>D</mi></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced><mo>=</mo><mn>10</mn><mi>x</mi></math><br /><br /><math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>D</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>100</mn></mrow></mfrac></math> (given)<br /><br /><math><mi>P</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfenced><mi>&#160;</mi><mi>P</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>D</mi></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced><mo>+</mo><mi>P</mi><mfenced separators=\"|\"><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfenced><mi>&#160;</mi><mi>P</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>D</mi></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>100</mn></mrow></mfrac></math><br /><br /><math><mfrac><mrow><mn>20</mn></mrow><mrow><mn>100</mn></mrow></mfrac><mo>&#215;</mo><mn>10</mn><mi>x</mi><mo>+</mo><mfrac><mrow><mn>80</mn></mrow><mrow><mn>100</mn></mrow></mfrac><mo>&#215;</mo><mi>x</mi><mo>=</mo><mfrac><mrow><mn>7</mn></mrow><mrow><mn>100</mn></mrow></mfrac></math><br /><br /><math><mi>x</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>40</mn></mrow></mfrac></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><mfrac><mi>D</mi><msub><mi>T</mi><mn>2</mn></msub></mfrac></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>40</mn></mfrac><mi>&#160;</mi></math><br /><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>P</mi><mfenced separators=\"|\"><mfrac><mover><mi>D</mi><mo>-</mo></mover><msub><mi>T</mi><mn>2</mn></msub></mfrac></mfenced><mo>=</mo><mfrac><mn>39</mn><mn>40</mn></mfrac><mo>=&#160;</mo></math>Probability of not defective, given that it is produced in plant <math><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></math><br /><br /><math><mi>P</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>D</mi></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>10</mn></mrow><mrow><mn>40</mn></mrow></mfrac><mi>&#160;</mi><mo>&#8658;</mo><mi>&#160;</mi><mi>&#160;</mi><mi>P</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mover accent=\"true\"><mrow><mi>D</mi></mrow><mo>-</mo></mover></mrow><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>30</mn></mrow><mrow><mn>40</mn></mrow></mfrac></math><br /><br />Now using Bayes&#39; theorem<br /><br />Probability of computer from <math><msub><mrow><mi mathvariant=\"normal\">T</mi></mrow><mrow><mn>2</mn></mrow></msub></math> given that it is not defective :<br /><br /><math><mi>P</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><msub><mrow><mi>T</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mover accent=\"true\"><mrow><mi>D</mi></mrow><mo>-</mo></mover></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mfrac><mrow><mn>80</mn></mrow><mrow><mn>100</mn></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mn>39</mn></mrow><mrow><mn>40</mn></mrow></mfrac></mrow><mrow><mfrac><mrow><mn>20</mn></mrow><mrow><mn>100</mn></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mn>30</mn></mrow><mrow><mn>40</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>80</mn></mrow><mrow><mn>100</mn></mrow></mfrac><mo>&#215;</mo><mfrac><mrow><mn>39</mn></mrow><mrow><mn>40</mn></mrow></mfrac></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>78</mn></mrow><mrow><mn>93</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86334c44fcdcc75d28e", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "95", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Dice <math><mi>A</mi></math> has <math><mn>4</mn></math> red and <math><mn>2</mn></math> white faces whereas dice <math><mi>B</mi></math> has <math><mn>3</mn></math> red and <math><mn>3</mn></math> white faces. A coin is tossed once, if it falls head then the game continues by throwing the dice <math><mi>A</mi></math>&nbsp;and if it falls tail then the dice <math><mi>B</mi></math> is to be used. If red turns up at first <math><mn>3</mn></math> throws, then the probability that dice A is being used is", "image": null}, "options": [{"id": "X0aQB", "text": "<math><mfrac><mrow><mn>7</mn></mrow><mrow><mn>37</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Ddvwp", "text": "<math><mfrac><mrow><mn>64</mn></mrow><mrow><mn>91</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}, {"id": "q37Us", "text": "<math><mfrac><mrow><mn>9</mn></mrow><mrow><mn>41</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "Hl0hS", "text": "<math><mfrac><mrow><mn>27</mn></mrow><mrow><mn>35</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math><mi>R</mi><mo>&#8594;</mo></math> Red turns up at first three throws<br /><math><mi>A</mi><mo>&#8594;</mo></math> Dice <math><mi>A</mi></math> is selected.&nbsp;<math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br /><math><mi>B</mi><mo>&#8594;</mo></math> Dice <math><mi>B</mi></math> is selected.&nbsp;<math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br />Using Bayes theorem, we get,<br /><math><mi>P</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>A</mi></mrow><mrow><mi>R</mi></mrow></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi><mo>&#8745;</mo><mi>R</mi></mrow></mfenced></mrow><mrow><mi>P</mi><mfenced separators=\"|\"><mrow><mi>R</mi></mrow></mfenced></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>&#215;</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>R</mi></mrow><mrow><mi>A</mi></mrow></mfrac></mrow></mfenced></mrow><mrow><mi>P</mi><mfenced separators=\"|\"><mrow><mi>A</mi></mrow></mfenced><mo>&#215;</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>R</mi></mrow><mrow><mi>A</mi></mrow></mfrac></mrow></mfenced><mo>+</mo><mi>P</mi><mfenced separators=\"|\"><mrow><mi>B</mi></mrow></mfenced><mi>P</mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mi>R</mi></mrow><mrow><mi>B</mi></mrow></mfrac></mrow></mfenced></mrow></mfrac></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><msup><mfenced separators=\"|\"><mfrac><mn>2</mn><mn>3</mn></mfrac></mfenced><mn>3</mn></msup></mrow><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><msup><mfenced separators=\"|\"><mfrac><mn>2</mn><mn>3</mn></mfrac></mfenced><mn>3</mn></msup><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mfenced separators=\"|\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mn>3</mn></m     let currentTopicIndex = 0;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
