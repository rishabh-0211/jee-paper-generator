h> are in a geometric progression&nbsp;such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>&#60;</mo><mi>b</mi><mo>&#60;</mo><mi>c</mi><mo>&#60;</mo><mi>d</mi><mo>,</mo><mo>&#160;</mo><mi>a</mi><mo>+</mo><mi>d</mi><mo>=</mo><mn>112</mn></math> and <math><mi>b</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>48</mn><mo>.</mo></math> If the geometric progression&nbsp;is continued with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi></math> as the first term, then the sum of the first six terms is", "image": null}, "options": [{"id": "eAhtX", "text": "<math><mn>1156</mn></math>", "image": null, "isCorrect": false}, {"id": "Y87DF", "text": "<math><mn>1256</mn></math>", "image": null, "isCorrect": false}, {"id": "YuPSM", "text": "<math><mn>1356</mn></math>", "image": null, "isCorrect": false}, {"id": "1WYU0", "text": "<math><mn>1456</mn></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let <math><mi>r</mi></math> be the common ratio<br /><math><mi>a</mi><mo>+</mo><mi>d</mi><mo>=</mo><mn>112</mn><mo>&#8658;</mo><mi>a</mi><mo>+</mo><mi>a</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>=</mo><mn>112</mn></math><br /><math><mi>b</mi><mo>+</mo><mi>c</mi><mo>=</mo><mn>48</mn><mo>&#8658;</mo><mi>a</mi><mi>r</mi><mo>+</mo><mi>a</mi><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>48</mn></math><br />Dividing the first equation by the second equation we get<br /><math><mfrac><mrow><mi>a</mi><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><msup><mrow><mi>r</mi></mrow><mrow><mn>3</mn></mrow></msup></mrow></mfenced></mrow><mrow><mi>a</mi><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mi>r</mi></mrow></mfenced><mi>r</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>112</mn></mrow><mrow><mn>48</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mfenced separators=\"|\"><mrow><mn>1</mn><mo>+</mo><mi>r</mi></mrow></mfenced><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mi>r</mi TA Abhyas Paper", "value": "72", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "The second term of an infinite geometric progression is <math><mn>2</mn></math> and its sum to infinity is <math><mn>8</mn><mo>.</mo></math> The first term is", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "Second term is <math><mn>2</mn></math><br /><math><mo>⇒</mo><mi>a</mi><mi>r</mi><mo>=</mo><mn>2</mn></math><br />Sum to infinity is <math><mn>8</mn></math><br /><math><mo>⇒</mo><mfrac><mrow><mi>a</mi></mrow><mrow><mn>1</mn><mo>-</mo><mi>r</mi></mrow></mfrac><mo>=</mo><mn>8</mn></math><br />Eliminating <math><mi>a</mi></math> we get,<br /><math><mfrac><mrow><mn>2</mn><mo>/</mo><mi>r</mi></mrow><mrow><mn>1</mn><mo>-</mo><mi>r</mi></mrow></mfrac><mo>=</mo><mn>8</mn><mo>⇒</mo><mi>r</mi><mfenced separators=\"|\"><mrow><mn>1</mn><mo>-</mo><mi>r</mi></mrow></mfenced><mn>8</mn><mo>=</mo><mn>2</mn></math><br /><math><mo>⇒</mo><mn>8</mn><mi>r</mi><mo>-</mo><mn>8</mn><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>2</mn><mo>⇒</mo><mn>4</mn><msup><mrow><mi>r</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>4</mn><mi>r</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math><br /><math><mo>⇒</mo><mi>r</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>⇒</mo><mi>a</mi><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mfrac bevelled=\"true\"><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfrac><mo>=</mo><mn>4</mn></math>.<br />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": null, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6151e86305f7409c01f64f47", "type": "singleCorrect", "level": 1, "questionLabels": [{"title": "NTA Abhyas Paper", "value": "103", "isVisible": true}], "previousYearPapers": [{"_id": "6904b6feef55966cf1d71f2a", "title": "NTA Abhyas (JEE Main) 2020", "shortName": "2020", "isVisible": true, "heldOn": "2020-05-25T09:00:00.000Z"}], "question": {"text": "Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>,</mo><mo>&#160;</mo><mi>m</mi></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi></math> are three distinct numbers in arithmetic progression. Also <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>l</mi><mn>2</mn></msup><mo>,</mo><mo>&#160;</mo><msup><mi>m</mi><mn>2</mn></msup></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>n</mi><mn>2</mn></msup></math> are in geometric progression and <math><mi>l</mi><mo>+</mo><mi>m</mi><mo>+</mo><mi>n</mi><mo>=</mo><mn>3</mn></math>. If <math><mi>l</mi><mo>&#60;</mo><mi>m</mi><mo>&#60;</mo><mi>n</mi><mo>,</mo></math> then <math><mi>n</mi></math> is equal to", "image": null}, "options": [{"id": "Rc6pj", "text": "<math><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "v98Kb", "text": "<math><mn>1</mn><mo>-</mo><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": false}, {"id": "xexyS", "text": "<math><mn>1</mn><mo>+</mo><msqrt><mn>2</mn></msqrt></math>", "image": null, "isCorrect": true}, {"id": "7tp6q", "text": "<math><mn>2</mn><mo>+</mo><msqrt><mn>5</mn></msqrt></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>,</mo><mi>m</mi><mo>,</mo><mi>n</mi></math>&nbsp;are in A.P.&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>2</mn><mi>m</mi><mo>=</mo><mi>l</mi><mo>+</mo><mi>n</mi></math></p><p>Given,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>+</mo><mi>m</mi><mo>+</mo><mi>n</mi><mo>=</mo><mn>3</mn><mo>&#8658;</mo><mi>m</mi><mo>=</mo><mn>1</mn></math></p><p>Let,&nbsp;<mat     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'NTA Abhyas (JEE Main)';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
