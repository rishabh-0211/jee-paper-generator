n><mo>=</mo><mn>21816</mn></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "ecefb75ecda44c1ca341233836fc73fd", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/8voIrrETqzk1B.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/8voIrrETqzk1B.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "632c83583e3fd59bda92e46d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 2)", "title": "JEE Advanced 2022 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169ddf23ac7d519f9af29", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c41", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 2)", "title": "JEE Advanced 2007 (Paper 2)"}], "question": {"text": "The letters of the word $\\mathrm{COCHIN}$ are permuted and all the permutations are arranged in an alphabetical order as in an English dictionary. The number of words that appear before the word $\\mathrm{COCHIN}$ is", "image": null}, "options": [{"id": "lTVIk", "text": "\n360\n", "image": null, "isCorrect": false}, {"id": "ihZ9A", "text": "\n192\n", "image": null, "isCorrect": false}, {"id": "LtgWd", "text": "\n97\n", "image": null, "isCorrect": true}, {"id": "mLP3I", "text": "\n48", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a word $\\mathrm{COCHIN}$, the second place can be filled in ${ }^4 C_1$ ways and the remaining four alphabets can be arranged in $4 !$ ways in four different places. The next $97^{\\text {th }}$ word will be COCHIN.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c41", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 2)", "title": "JEE Advanced 2007 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "6a0be51944d287c9361e5cde", "title": "Division of Identical items", "totalQuestions": 1, "questions": [{"_id": "6a0be50d44d287c9361e5c82", "type": "numerical", "question": {"text": "The number of ways to distribute $10$ identical red pens and $14$ identical blue pens among four persons such that each person gets $6$ pens, is _____________.", "image": null}, "options": [], "correctValue": "206", "solution": {"text": "Let $r_i$ and $b_i$ be the number of red and blue pens given to the $i$-th person, where $i = 1, 2, 3, 4$.<br><br>Given that each person receives exactly $6$ pens, we have:<br>$r_i + b_i = 6 \\Rightarrow b_i = 6 - r_i$<br><br>Since the number of blue pens must be non-negative ($b_i \\ge 0$), we get $r_i \\le 6$. Also, $r_i \\ge 0$.<br><br>The total number of red pens is $10$, so:<br>$r_1 + r_2 + r_3 + r_4 = 10$<br><br>The number of ways to distribute the pens is the number of non-negative integer solutions to this equation subject to $0 \\le r_i \\le 6$.<br><br>This is equivalent to finding the coefficient of $x^{10}$ in the expansion of $(1 + x + x^2 + \\dots + x^6)^4$.<br><br>$(1 + x + x^2 + \\dots + x^6)^4 = \\left( \\dfrac{1 - x^7}{1 - x} \\right)^4 = (1 - x^7)^4 (1 - x)^{-4}$<br><br>Expanding both terms:<br>$(1 - x^7)^4 = 1 - 4x^7 + 6x^{14} - \\dots$<br>$(1 - x)^{-4} = \\sum_{k=0}^{\\infty} {}^{k+3}C_{3} x^k$<br><br>We need the coefficient of $x^{10}$ in the product $(1 - 4x^7 + \\dots) \\sum_{k=0}^{\\infty} {}^{k+3}C_{3} x^k$.<br><br>Coefficient of $x^{10} = 1 \\times (\\text{coefficient of } x^{10} \\text{ in } (1-x)^{-4}) - 4 \\times (\\text{coefficient of } x^3 \\text{ in } (1-x)^{-4})$<br><br>$= {}^{10+3}C_{3} - 4 \\times {}^{3+3}C_{3}$<br><br>$= {}^{13}C_{3} - 4 \\times {}^{6}C_{3}$<br><br>$= \\dfrac{13 \\times 12 \\times 11}{3 \\times 2 \\times 1} - 4 \\times \\dfrac{6 \\times 5 \\times 4}{3 \\times 2 \\times 1}$<br><br>$= 286 - 4 \\times 20$<br><br>$= 286 - 80 = 206$<br><br>Answer: $206$", "image": null}, "level": 2, "videoSolution": {"videoId": "f54da44fee394277beb773169e85216a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/JlPoi0pjCc3ni.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/JlPoi0pjCc3ni.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64b16adff23ac7d519f9b902", "title": "Combination", "totalQuestions": 4, "questions": [{"_id": "6a0be51244d287c9361e5cb2", "type": "numerical", "question": {"text": "A bookshelf contains $6$ distinct books of Mathematics and $5$ distinct books of Physics. From these $11$ books, $6$ books are chosen at random. Let $X$ be the absolute value of the difference between the number of Mathematics books chosen and the number of Physics books chosen. If $\\alpha$ is the mean of the random variable $X$, then the value of $77\\alpha$ is ___________.", "image": null}, "options": [], "correctValue": "100", "solution": {"text": "Total number of ways to choose $6$ books from $11$ books is $^{11}C_{6} = 462$.<br><br>Let $M$ and $P$ be the number of Mathematics and Physics books chosen respectively. Since $6$ books are chosen, $M + P = 6$.<br><br>The random variable $X$ is given by $X = |M - P| = |2M - 6|$.<br><br>The possible selections of $(M, P)$, the corresponding values of $X$, and the number of ways are as follows:<br><br>For $M=1, P=5$: $X = |1 - 5| = 4$, Number of ways $= ^{6}C_{1} \\times ^{5}C_{5} = 6 \\times 1 = 6$<br><br>For $M=2, P=4$: $X = |2 - 4| = 2$, Number of ways $= ^{6}C_{2} \\times ^{5}C_{4} = 15 \\times 5 = 75$<br><br>For $M=3, P=3$: $X = |3 - 3| = 0$, Number of ways $= ^{6}C_{3} \\times ^{5}C_{3} = 20 \\times 10 = 200$<br><br>For $M=4, P=2$: $X = |4 - 2| = 2$, Number of ways $= ^{6}C_{4} \\times ^{5}C_{2} = 15 \\times 10 = 150$<br><br>For $M=5, P=1$: $X = |5 - 1| = 4$, Number of ways $= ^{6}C_{5} \\times ^{5}C_{1} = 6 \\times 5 = 30$<br><br>For $M=6, P=0$: $X = |6 - 0| = 6$, Number of ways $= ^{6}C_{6} \\times ^{5}C_{0} = 1 \\times 1 = 1$<br><br>The mean $\\alpha$ of the random variable $X$ is given by:<br><br>$\\alpha = \\dfrac{\\sum X_i f_i}{\\sum f_i}$<br><br>$\\alpha = \\dfrac{4(6) + 2(75) + 0(200) + 2(150) + 4(30) + 6(1)}{462}$<br><br>$\\alpha = \\dfrac{24 + 150 + 0 + 300 + 120 + 6}{462}$<br><br>$\\alpha = \\dfrac{600}{462} = \\dfrac{100}{77}$<br><br>Therefore, the value of $77\\alpha$ is:<br><br>$77\\alpha = 77 \\times \\dfrac{100}{77} = 100$<br><br>Answer: $100$", "image": null}, "level": 3, "videoSolution": {"videoId": "ea548d407f4d4ca89acb6804d0e7e9c7", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/JmcaJOut6pZRk.480.jpeg", "thumbnailDark": "https://d >X</mi></math>. Suppose that each element of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math>&nbsp;has an equal chance of being chosen. Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;be the conditional probability that an element chosen at random is a multiple of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn></math> given that it is a multiple of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>. Then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>38</mn><mo>&#160;</mo><mi>p</mi></math>&nbsp;is equal to", "image": null}, "options": [], "correctValue": "31", "solution": {"text": "<blockquote><p>First we will find the sample space in which the number of five-digit numbers are divisible by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>,</p><p>So, fixing zero at the last place we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mrow><mo>-</mo><mo>-</mo><mo>-</mo><mo>-</mo><menclose notation=\"bottom\"><mn>0</mn></menclose></mrow><mo>&#9183;</mo></munder></math></p><p>Now in first four place following number can take place,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2224</mn><mo>&#160;</mo><mo>&#8594;</mo><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>3</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>4</mn><mo>&#160;</mo><mtext>ways</mtext></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2244</mn><mo>&#8594;</mo><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo><mn>2</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>6</mn><mo>&#160;</mo><mtext>ways</mtext></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2221</mn><mo>&#8594;</mo><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>3</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>4</mn><mo>&#160;</mo><mtext>ways</mtext></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2241</mn><mo>&#8594;</mo><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>12</mn><mo>&#160;</mo><mtext>ways</mtext></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2441</mn><mo>&#8594;</mo><mfrac><mrow><mn>4</mn><mo>!</mo></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mo>=</mo><mn>12</mn><mo>&#160;</mo><mtext>ways</mtext></math></p><p>So, total sample space will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>+</mo><mn>6</mn><mo>+</mo><mn>4</mn><mo>+</mo><mn>12</mn><mo>+</mo><mn>12</mn><mo>=</mo><mn>38</mn></math>&nbsp;</p><p>Now finding the number of favourable outcomes,</p><p>So, Number of five-digit numbers divisible by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> but <u>&#39;not&#39;</u> by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn></math></p><p>Now fixing&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math>&nbsp;in last two places, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mrow><mo>-</mo><mo>-</mo><mo>-</mo><menclose notation=\"bottom\"><mn>1</mn></menclose><mo>&#160;</mo><menclose notation=\"bottom\"><mn>0</mn></menclose></mrow><mo>&#9183;</mo></munder></math></p><p>So, the first three places can be occupied by,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>222</mn><mo>&#160;</mo><mo>&#8594;</mo><mo>&#160;</mo><mn>1</mn><mo>&#160;</mo><mtext>ways</mtext></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>224</mn><mo>&#160;</mo><mo>&#8594;</mo><mn>3</mn><mo>&#160;</mo><mtext>ways</mtext></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>244</mn><mo>&#160;</mo><mo>&#8594;</mo><mn>3</mn><mo>&#160;</mo><mtext>ways</mtext></math></p><p>So, total number of numbers which are divisible by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>&nbsp;but not&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn></math>&nbsp;will be,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>+</mo><mn>3</mn><mo>+</mo><mn>3</mn><mo>=</mo><mn>7</mn></math></p><p>So, favourable number of five-digit numbers that are divisible by <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>&nbsp;<u>and</u>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>20</mn><mo>=</mo><mn>38</mn><mo>-</mo><mn>7</mn><mo>=</mo><mn>31</mn></math></p><p>Hence, probability is given by,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>=</mo><mfrac><mn>31</mn><mn>38</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>38</mn><mo>&#160;</mo><mi>p</mi><mo>=</mo><mn>31</mn></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "473479566af54a168b991e5bf735b959", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/gYCVCRjmSIA0L.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/gYCVCRjmSIA0L.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a99f23ac7d519f9b5de", "previousYearPapers": [{"_id": "632c83573e3fd59bda92e46c", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 1)", "title": "JEE Advanced 2022 (Paper 1)"}], "type": "numerical", "level": 3, "question": {"text": "The number of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>-digit integers in the closed interval <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><mn>2022</mn><mo>,</mo><mn>4482</mn></mrow></mfenced></math>&nbsp;formed by using the digits <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>,</mo><mn>6</mn><mo>,</mo><mn>7</mn></math>&nbsp;is ______.", "image": null}, "options": [], "correctValue": "569", "solution": {"text": "<blockquote><p>Given the number to be formed by using the digits <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>,</mo><mn>6</mn><mo>,</mo><mn>7</mn></math>&nbsp;</p><p>Now assuming counting integers starting from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math></p><p>Case-I: if zero on&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mi>nd</mi></msup></math>&nbsp;place</p><p>(i)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mn>0</mn><mo>&#160;</mo><mn>2</mn><mo>&#160;</mo><mo>&#160;</mo><mi>_</mi></math>, now here at unit place&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>&nbsp;number can take place except zero {as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2020</mn><mo>&#60;</mo><mn>2022</mn></math>}, so&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>&nbsp;possible way.</p><p>(ii)&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>&#160;</mo><mn>0</mn><mo>&#160;</mo><mi>_</mi><mo>&#160;</mo><mi>_</mi></math>, now here at ten&#39;s place&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>&nbsp;number <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mrow><mn>3</mn><mo>,</mo><mn>4</mn><mo>,</mo><mn>6</mn><mo>,</mo><mn>7</mn></mrow></mfenced></math>&nbsp;can take place&nbsp;&nbsp;and at unit place all&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>&nbsp;number can take place so total&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn><mo>&#215;</mo><mn>6</mn><mo>=</mo><mn>24</mn></math>&nbsp;possible way</p><p>Case-II: If non-zero number on&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mi>nd</mi></msup></math>&nbsp;place</p><p>i.e&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><munder><mrow><mo>&#160;</mo><munder><mrow><mo>&#160;</mo><mi>_</mi></mrow><mo>&#9183;</mo></munder></mrow><mn>5</mn></munder><mo>&#160;</mo><mo>&#160;</mo><munder><munder><mi>_</mi><mo>&#9183;</mo></munder><mn>6</mn></munder><munder><mrow><mo>&#160;</mo><munder><mrow><mo>&#160;</mo><mi>_</mi></mrow><mo>&#9183;</mo></munder></mrow><mn>6</mn></munder></math>, here at hundredth place&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math>&nbsp;possibility will be there and at unit and ten&#39;s place&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mn>6</mn></math>&nbsp;possibility will be there, so in total&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>&#215;</mo><mn>6</mn><mo>&#215;</mo><mn>6</mn><mo>=</mo><mn>180</mn></math>&nbsp;possible cases,</p><p>Case -III when counting integers starting from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable><mtr><mtd><mn>3</mn></mtd><mtd><munder><munder><mi>_</mi><mo>&#9183;</mo></munder><mn>6</mn></munder></mtd><mtd><munder><munder><mi>_</mi><mo>&#9183;</mo></munder><mn>6</mn></munder></mtd><mtd><munder><munder><mi>_</mi><mo>&#9183;</mo></munder><mn>6</mn></munder></mtd></mtr></mtable></math>&nbsp;here total&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#215;</mo><mn>6</mn><mo>&#215;</mo><mn>6</mn><mo>=</mo><mn>216</mn></math>&nbsp;possible&nbsp;cases</p><p>Case -IV when counting integers starting from&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math></p><p>(i) If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>,</mo><mn>2</mn></math>&nbsp;or&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>&nbsp;on&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mi>nd</mi></msup></math>&nbsp;place</p><p>i.e.,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable><mtr><mtd><mn>4</mn></mtd><mtd><munder><munder><mi>_</mi><mo>&#9183;</mo></munder><mn>3</mn></munder></mtd><mtd><munder><munder><mi>_</mi><mo>&#9183;</mo></munder><mn>6</mn></munder></mtd><mtd><munder><munder><mi>_</mi><mo>&#9183;</mo></munder><mn>6</mn></munder></mtd></mtr></mtable></math>&nbsp;here total&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#215;</mo><mn>6</mn><mo>&#215;</mo><mn>6</mn><mo>=</mo><mn>108</mn></math>&nbsp;possible&nbsp;cases</p><p>(ii) If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>&nbsp;on&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mi>nd</mi></msup></math>&nbsp;place</p><p>i.e.,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable><mtr><mtd><mn>3</mn></mtd><mtd><mn>4</mn></mtd><mtd><munder><munder><mi>_</mi><mo>&#9183;</mo></munder><mn>6</mn></munder></mtd><mtd><munder><munder><mi>_</mi><mo>&#9183;</mo></munder><mn>6</mn></munder></mtd></mtr></mtable></math>&nbsp;here total&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#215;</mo><mn>6</mn><mo>=</mo><mn>36</mn></math>&nbsp;possible&nbsp;cases</p><p>So, total possible cases will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn><mo>+</mo><mn>24</mn><mo>+</mo><mn>180</mn><mo>+</mo><mn>216</mn><mo>+</mo><mn>108</mn><mo>+</mo><mn>36</mn><mo>=</mo><mn>569</mn></math>&nbsp;numbers</p></blockquote>", "image": nul </msub><mo>+</mo><msub><mrow><mi>n</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>+</mo><msub><mrow><mi>n</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>+</mo><msub><mrow><mi>n</mi></mrow><mrow><mn>5</mn></mrow></msub><mo>=</mo><mn>20</mn></math> . Then the number of such distinct arrangements <math><mfenced separators=\"|\"><mrow><msub><mrow><mi>n</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>,</mo><mi>&#160;</mi><msub><mrow><mi>n</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>,</mo><mi>&#160;</mi><msub><mrow><mi>n</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>,</mo><mi>&#160;</mi><msub><mrow><mi>n</mi></mrow><mrow><mn>4</mn></mrow></msub><mo>,</mo><mi>&#160;</mi><msub><mrow><mi>n</mi></mrow><mrow><mn>5</mn></mrow></msub></mrow></mfenced></math> is _________", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "When  <math><msub><mrow><mi>n</mi></mrow><mrow><mn>5</mn></mrow></msub></math>  takes value from 10 to 6 the carry forward moves from 0 to 4 which can be arranged in   <math><msup><mrow/><mrow><mn>4</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>0</mn></mrow></msub><mo>+</mo><mfrac><mrow><msup><mrow/><mrow><mn>4</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>1</mn></mrow></msub></mrow><mrow><mn>4</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow/><mrow><mn>4</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>2</mn></mrow></msub></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mrow/><mrow><mn>4</mn></mrow></msup><msub><mrow><mi>C</mi></mrow><mrow><mn>4</mn></mrow></msub></mrow><mrow><mn>1</mn></mrow></mfrac><mo>=</mo><mn>7</mn></math> <br >Alternate solution<br >Possible solutions are<br >1, 2, 3, 4, 10<br >1, 2, 3, 5, 9<br >1, 2, 3, 6, 8<br >1, 2, 4, 5, 8<br >1, 2, 4, 6, 7<br >1, 3, 4, 5, 7<br >2, 3, 4, 5, 6<br >Hence 7 solutions are there.", "image": null}, "videoSolution": {"videoId": "d0cf09adb12149efa8b14681f0ef8345", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/gfwsgUAUJn4jG.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/gfwsgUAUJn4jG.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf824", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014 (Paper 1)", "title": "JEE Advanced 2014 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a24f23ac7d519f9b1b7", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}], "type": "singleCorrect", "level": 3, "question": {"text": "Let $a_{n}$ denote the number of all $n$-digit positive integers formed by the digits 0,1 or both such that no consecutive digits in them are 0 . Let $b_{n}=$ the number of such $n$-digit integers ending with digit 1 and $c_{n}=$ the number of such $n$-digit integers ending with digit 0 .\r\n\r\n<strong> Question:</strong> Which of the following is correct?", "image": null}, "options": [{"id": "p0IBX", "text": "$a_{17}=a_{16}+a_{15}$", "isCorrect": true, "image": null}, {"id": "8Tb9K", "text": "$c_{17} \\neq c_{16}+c_{15}$", "isCorrect": false, "image": null}, {"id": "fPagp", "text": "$b_{17} \\neq b_{16}+c_{16}$", "isCorrect": false, "image": null}, {"id": "aXvAM", "text": "$a_{17}=c_{17}+b_{16}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "By recurring formula, $a_{17}=a_{16}+a_{15}$ is correct\r\n\r\nAlso $c_{17} \\neq c_{16}+c_{15}$\r\n\r\n$\\Rightarrow a_{15} \\neq a_{14}+a_{13}\\left(\\because c_{n}=a_{n-2}\\right)$\r\n\r\n$\\therefore$ Incorrect\r\n\r\nSimilarly, other parts are also incorrect.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a24f23ac7d519f9b1b6", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let $a_{n}$ denote the number of all $n$-digit positive integers formed by the digits 0,1 or both such that no consecutive digits in them are 0 . Let $b_{n}=$ the number of such $n$-digit integers ending with digit 1 and $c_{n}=$ the number of such $n$-digit integers ending with digit 0 .\r\n\r\n<strong> Question:</strong> The value of $b_{6}$ is", "image": null}, "options": [{"id": "SJoSL", "text": "7", "isCorrect": false, "image": null}, {"id": "LAuab", "text": "8", "isCorrect": true, "image": null}, {"id": "lliy8", "text": "9", "isCorrect": false, "image": null}, {"id": "rvZHy", "text": "11", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\because a_{n}=$ number of all $n$ digit +ve integers formed by the digits 0,1 or both such that no consecutive digits in them are 0 .\r\n\r\nand $b_{n}=$ number of such $n$ digit integers ending with 1 $c_{n}=$ number of such $n$ digit integers ending with 0\r\n\r\nClearly, $a_{n}=b_{n}+c_{n}\\left(\\because a_{n}\\right.$ can end with 0 or 1)\r\n\r\nAlso $b_{n}=a_{n-1}$ and $c_{n}=a_{n-2}[\\because$ if last digit is 0 , second last has to be 1]\r\n\r\n$\\therefore$ We get $a_{n}=a_{n-1}+a_{n-2}, n \\geq 3$\r\n\r\nAlso $a_{1}=1, a_{2}=2$,\r\n\r\nNow by this recurring formula, we get\r\n\r\n$\\begin{aligned} a_{3} &=a_{2}+a_{1}=3 \\\\ a_{4} &=a_{3}+a_{2}=3+2=5 \\\\ a_{5} &=a_{4}+a_{3}=5+3=8 \\\\ \\text { Also } b_{6} &=a_{5}=8 \\end{aligned}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169f3f23ac7d519f9aff7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}], "question": {"text": "<strong>Paragraph:</strong>\nLet $A$ be the set of all $3 \\times 3$ symmetric matrices all of whose entries are either 0 or 1 . Five of these entries are 1 and four of them are 0 .<strong>Question:</strong>\nThe number of matrices in $A$ is", "image": null}, "options": [{"id": "X9MMq", "text": "\n12\n", "image": null, "isCorrect": true}, {"id": "a8pJg", "text": "\n6\n", "image": null, "isCorrect": false}, {"id": "xeZVt", "text": "\n9\n", "image": null, "isCorrect": false}, {"id": "QuaYW", "text": "\n3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Case $I$ When all three diagonal elements are 1 , then\nNumber of matrices $={ }^3 C_1=3$\nCase II When two diagonal elements are zero and one element is one no, then Number of matrices $={ }^3 C_1 \\cdot{ }^3 C_1=9$\n$\\therefore$ Total matrices $=3+9=12$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169f2f23ac7d519f9afec", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}], "question": {"text": "The number of seven digit integers, with sum of the digits equal to 10 and formed by using the digits 1,2 and 3 only, is", "image": null}, "options": [{"id": "sHiUt", "text": "\n55\n", "image": null, "isCorrect": false}, {"id": "lC3HR", "text": "\n66\n", "image": null, "isCorrect": false}, {"id": "51TDz", "text": "\n77\n", "image": null, "isCorrect": true}, {"id": "ndfRM", "text": "\n88", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "There are two possible cases arise:\nCase I Five 1's, one 2's, one 3's\n$\\therefore$ Number of numbers $=\\frac{7 !}{5 !}=42$\nCase II Four 1's, three 2's\n$\\therefore$ Number of numbers $=\\frac{7 !}{4 ! 3 !}=35$\n$\\therefore$ Total number of numbers $=42+35=77$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169edf23ac7d519f9afc2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}], "question": {"text": "Consider all possible permutations of the letters of the word ENDEANOEL. Match the Statements/Expressions in Column I with the Statements/Expressions in Column II.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/1Oj7xgNtMlSTH_bJ2EXv-IV_L6I5OltoIjA2nwL0Yr0.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "SKFtn", "text": "\n(A) r, (B) q, (C) s, (D) p\n", "image": null, "isCorrect": false}, {"id": "vnmX6", "text": "\n(A) p, (B) s, (C) q, (D) q\n", "image": null, "isCorrect": true}, {"id": "8yplH", "text": "\n(A) p, (B) r, (C) s, (D) q\n", "image": null, "isCorrect": false}, {"id": "8sKyC", "text": "\n(A) r, (B) s, (C) r, (D) p", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A) If ENDEA is fixed word, then assume this as a single letter.\nTotal number of letters $=5$ and total number of arrangements $=5$ ! .\n(B) If $E$ is at first and last places, then total number of permutations\n$$\n\\frac{7 !}{2 !}=21 \\times 5 !\n$$\n(C) If $\\mathrm{D}, \\mathrm{L}, \\mathrm{N}$ are not in last five positions\n$$\n\\leftarrow \\mathrm{D}, \\mathrm{L}, \\mathrm{N}, \\mathrm{N} \\rightarrow \\leftarrow \\text { E, E, E, A, O } \\rightarrow\n$$\nTotal number of permutations $=\\frac{4 !}{2 !} \\times \\frac{5 !}{3 !}=2 \\times 5$ ! .\n(D) Total number of odd positions $=5$\nPermutations of AEEEO are $\\frac{5 !}{3 !}$\nTotal number of even positions $=4$\nNumber of permutations of $\\mathrm{N}, \\mathrm{N}, \\mathrm{D}, \\mathrm{L}=\\frac{4 !}{2 !}$\nHence, total number of permutations $=\\frac{5 !}{3 !} \\times \\frac{4 !}{2 !}=2 \\times 5 !$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64b16adff23ac7d519f9b8fc", "title": "Selection of one or more item", "totalQuestions": 3, "questions": [{"_id": "64b16aabf23ac7d519f9b687", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}], "question": {"text": "<p>Consider the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#215;</mo><mn>6</mn></math>&nbsp;square in the figure. Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mn>1</mn></msub><mo>,</mo><msub><mi>A</mi><mn>2</mn></msub><mo>,</mo><mo>&#8230;</mo><mo>,</mo><msub><mi>A</mi><mn>49</mn></msub></math> be the points of intersections (dots in the picture) in some order. We say that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mi>i</mi></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mi>j</mi></msub></math> are friends if they are adjacent along a row or along a column. Assume that each point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mi>i</mi></msub></math> has an equal chance of being chosen.</p>\n\n<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/d33e0b30-a00c-486d-8560-c6e3e5f7757d.png\" style=\"width: 200px; height: 197px;\" /></p>\n\n<p>(There are two questions based on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PARAGRAPH</mi><mo>&#160;</mo><mo>&#34;</mo><mi>II</mi><mo>&#34;</mo></math>, the question given below is one of them)</p>\n<br>Two distinct points are chosen randomly out of the points <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mn>1</mn></msub><mo>,</mo><msub><mi>A</mi><mn>2</mn></msub><mo>,</mo><mo>&#8230;</mo><mo>&#8230;</mo><mo>,</mo><msub><mi>A</mi><mn>49</mn></msub></math>. Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi></math>&nbsp;be the probability that they are friends. Then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&#160;</mo><mi>p</mi></math> is", "image": null}, "options": [], "correctValue": "0.5", "solution": {"text": "<blockquote><p>Given,</p><p>We have to choose two distinct points randomly,</p><p>Now number of ways of selecting <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> adjacent dots in row will be<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>6</mn></math>&nbsp;{as if you pick any dot then you have pick second dot from remaining <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math>&nbsp;dots, so total ways will be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>&#215;</mo><mmultiscripts><mi>C</mi><mn>1</mn><none></none><mprescripts></mprescripts><none></none><mn>6</mn></mmultiscripts><mo>=</mo><mn>6</mn></math>}</p><p>Similarly, number of ways of selecting <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> adjacent dots in&nbsp;column<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>6</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo></math>Number of ways of selecting <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> adjacent dots from the given diagram we will&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>6</mn><mo>&#215;</mo><mn>7</mn><mo>+</mo><mn>6</mn><mo>&#215;</mo><mn>7</mn><mo>=</mo><mn>84</mn></math></p><p>So, probability is given by,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>=</mo><mfrac><mn>84</mn><mmultiscripts><mi>C</mi><mn>2</mn><none></none><mprescripts></mprescripts><none></none><mn>49</mn></mmultiscripts></mfrac><mo>=</mo><mfrac><mrow><mn>84</mn><mo>&#215;</mo><mn>2</mn></mrow><mrow><mn>49</mn><mo>&#215;</mo><mn>48</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>7</mn><mi>p</mi><mo>=</mo><mfrac><mrow><mn>7</mn><mo>&#215;</mo><mn>84</mn><mo>&#215;</mo><mn>2</mn></mrow><mrow><mn>49</mn><mo>&#215;</mo><mn>48</mn></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>=</mo><mn>0</mn><mo>.</mo><mn>5</mn></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "b086889aa8864dfab0db4584cda0ecd9", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/KdhsfVy4zctk1.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/KdhsfVy4zctk1.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a92f23ac7d519f9b5a1", "previousYearPapers": [{"_id": "619f94437e944e1fdc2859b5", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 2)", "title": "JEE Advanced 2021 (Paper 2)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "<p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>1</mn></msub><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mi>i</mi><mo>,</mo><mi>j</mi><mo>,</mo><mi>k</mi></mrow></mfenced><mo>&#160;</mo><mo>:</mo><mi>i</mi><mo>,</mo><mi>j</mi><mo>,</mo><mi>k</mi><mo>&#8712;</mo><mfenced close=\"} xamId": "615d76cfc52ffa3c944600e0", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014 (Paper 1)", "title": "JEE Advanced 2014 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
