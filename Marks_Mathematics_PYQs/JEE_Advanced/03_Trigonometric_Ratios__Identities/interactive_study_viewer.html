Visible": true, "shortName": "2019 (Paper 2)", "title": "JEE Advanced 2019 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a24f23ac7d519f9b1bb", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "Let $f:(-1,1) \\rightarrow I R$ be such that $f(\\cos 4 \\theta)=\\frac{2}{2-\\sec ^{2} \\theta}$ for $\\theta \\in\\left(0, \\frac{\\pi}{4}\\right) \\cup\\left(\\frac{\\pi}{4}, \\frac{\\pi}{2}\\right)$. Then the value (s) of $f\\left(\\frac{1}{3}\\right)$ is (are)", "image": null}, "options": [{"id": "W6hUA", "text": "$1-\\sqrt{\\frac{3}{2}}$", "isCorrect": true, "image": null}, {"id": "epNPR", "text": "$1+\\sqrt{\\frac{3}{2}}$", "isCorrect": true, "image": null}, {"id": "jXPqg", "text": "$1-\\sqrt{\\frac{2}{3}}$", "isCorrect": false, "image": null}, {"id": "OmEfZ", "text": "$1+\\sqrt{\\frac{2}{3}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given : $f(\\cos 4 \\theta)=\\frac{2}{2-\\sec ^{2} \\theta}=\\frac{2 \\cos ^{2} \\theta}{2 \\cos ^{2} \\theta-1}$\r\n\r\n$=\\frac{1+\\cos 2 \\theta}{\\cos 2 \\theta}=1+\\frac{1}{\\cos 2 \\theta}$\r\n\r\nLet $\\cos 4 \\theta=\\frac{1}{3} \\Rightarrow 2 \\cos ^{2} 2 \\theta-1=\\frac{1}{3} \\Rightarrow \\cos 2 \\theta=\\pm \\sqrt{\\frac{2}{3}}$\r\n\r\n$\\therefore f(\\cos 4 \\theta)=1+\\frac{1}{\\cos 2 \\theta}=1 \\pm \\sqrt{\\frac{3}{2}}$ or $f\\left(\\frac{1}{3}\\right)=1 \\pm \\sqrt{\\frac{3}{2}}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169cdf23ac7d519f9ae9a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}], "question": {"text": "Let $\\theta \\in\\left(0, \\frac{\\pi}{4}\\right)$ and $t_1=(\\tan \\theta)^{\\tan \\theta}, t_2=(\\tan \\theta)^{\\cot \\theta}$ and $t_4=(\\cot \\theta)^{\\tan \\theta}$, then", "image": null}, "options": [{"id": "83ao5", "text": "\n$t_1>t_2>t_3>t_4$\n", "image": null, "isCorrect": false}, {"id": "ynJpv", "text": "\n$t_4>t_3>t_1>t_2$\n", "image": null, "isCorrect": true}, {"id": "Pi08d", "text": "\n$t_3>t_1>t_2>t_4$\n", "image": null, "isCorrect": false}, {"id": "Y3JaU", "text": "\n$t_2>t_3>t_1>t_4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As when $\\theta \\in\\left(0, \\frac{\\pi}{4}\\right)$\n$\\tan \\theta < \\cot \\theta$\nSince, $\\tan \\theta < 1$ and $\\cot \\theta>1$\n$\\therefore(\\tan \\theta)^{\\cot \\theta} < 1$ and $(\\cot \\theta)^{\\tan \\theta}>1$\n$\\therefore t_4>t_1$ which only holds in option (b).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "6a0be51a44d287c9361e5cdf", "title": "T-Ratios of Multiple & sub multiple angles", "totalQuestions": 1, "questions": [{"_id": "6a0be50d44d287c9361e5c83", "type": "numerical", "question": {"text": "Let<br><br>$\\alpha = \\left(1 - 2\\cos\\left(\\dfrac{\\pi}{11}\\right)\\right)\\left(1 - 2\\cos\\left(\\dfrac{3\\pi}{11}\\right)\\right)\\left(1 - 2\\cos\\left(\\dfrac{9\\pi}{11}\\right)\\right)\\left(1 - 2\\cos\\left(\\dfrac{27\\pi}{11}\\right)\\right)\\left(1 - 2\\cos\\left(\\dfrac{81\\pi}{11}\\right)\\right)$.<br><br>Then the value of $5 - \\alpha^2$ is _____________.", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "Let the given expression be $\\alpha$. First, we simplify the angles in the product.<br><br>$\\cos\\left(\\dfrac{27\\pi}{11}\\right) = \\cos\\left(2\\pi + \\dfrac{5\\pi}{11}\\right) = \\cos\\left(\\dfrac{5\\pi}{11}\\right)$<br><br>$\\cos\\left(\\dfrac{81\\pi}{11}\\right) = \\cos\\left(7\\pi + \\dfrac{4\\pi}{11}\\right) = -\\cos\\left(\\dfrac{4\\pi}{11}\\right) = \\cos\\left(\\pi - \\dfrac{4\\pi}{11}\\right) = \\cos\\left(\\dfrac{7\\pi}{11}\\right)$<br><br>Thus, the angles are $\\dfrac{\\pi}{11}, \\dfrac{3\\pi}{11}, \\dfrac{5\\pi}{11}, \\dfrac{7\\pi}{11}, \\dfrac{9\\pi}{11}$, which can be written as $\\theta_k = \\dfrac{(2k-1)\\pi}{11}$ for $k = 1, 2, 3, 4, 5$.<br><br>The expression becomes:<br>$\\alpha = \\prod_{k=1}^{5} \\left(1 - 2\\cos\\theta_k\\right)$<br><br>Using the trigonometric identity $1 - 2\\cos\\theta = 1 - 2(2\\cos^2(\\theta/2) - 1) = 3 - 4\\cos^2(\\theta/2)$.<br>Multiplying and dividing by $\\cos(\\theta/2)$, we get:<br>$1 - 2\\cos\\theta = \\dfrac{3\\cos(\\theta/2) - 4\\cos^3(\\theta/2)}{\\cos(\\theta/2)} = -\\dfrac{\\cos(3\\theta/2)}{\\cos(\\theta/2)}$<br><br>Applying this identity to the product:<br>$\\alpha = \\prod_{k=1}^{5} \\left( -\\dfrac{\\cos(3\\theta_k/2)}{\\cos(\\theta_k/2)} \\right) = (-1)^5 \\dfrac{\\prod_{k=1}^{5} \\cos(3\\theta_k/2)}{\\prod_{k=1}^{5} \\cos(\\theta_k/2)}$<br><br>The terms in the denominator are $\\cos\\left(\\dfrac{\\pi}{22}\\right), \\cos\\left(\\dfrac{3\\pi}{22}\\right), \\cos\\left(\\dfrac{5\\pi}{22}\\right), \\cos\\left(\\dfrac{7\\pi}{22}\\right), \\cos\\left(\\dfrac{9\\pi}{22}\\right)$.<br><br>The terms in the numerator are $\\cos\\left(\\dfrac{3\\pi}{22}\\right), \\cos\\left(\\dfrac{9\\pi}{22}\\right), \\cos\\left(\\dfrac{15\\pi}{22}\\right), \\cos\\left(\\dfrac{21\\pi}{22}\\right), \\cos\\left(\\dfrac{27\\pi}{22}\\right)$.<br><br>We can simplify the larger angles in the numerator:<br>$\\cos\\left(\\dfrac{15\\pi}{22}\\right) = \\cos\\left(\\pi - \\dfrac{7\\pi}{22}\\right) = -\\cos\\left(\\dfrac{7\\pi}{22}\\right)$<br><br>$\\cos\\left(\\dfrac{21\\pi}{22}\\right) = \\cos\\left(\\pi - \\dfrac{\\pi}{22}\\right) = -\\cos\\left(\\dfrac{\\pi}{22}\\right)$<br><br>$\\cos\\left(\\dfrac{27\\pi}{22}\\right) = \\cos\\left(\\pi + \\dfrac{5\\pi}{22}\\right) = -\\cos\\left(\\dfrac{5\\pi}{22}\\right)$<br><br>Substituting these back into the numerator product:<br>$\\prod_{k=1}^{5} \\cos(3\\theta_k/2) = \\cos\\left(\\dfrac{3\\pi}{22}\\right) \\cos\\left(\\dfrac{9\\pi}{22}\\right) \\left(-\\cos\\left(\\dfrac{7\\pi}{22}\\right)\\right) \\left(-\\cos\\left(\\dfrac{\\pi}{22}\\right)\\right) \\left(-\\cos\\left(\\dfrac{5\\pi}{22}\\right)\\right)$<br><br>$\\prod_{k=1}^{5} \\cos(3\\theta_k/2) = - \\left[ \\cos\\left(\\dfrac{\\pi}{22}\\right) \\cos\\left(\\dfrac{3\\pi}{22}\\right) \\cos\\left(\\dfrac{5\\pi}{22}\\right) \\cos\\left(\\dfrac{7\\pi}{22}\\right) \\cos\\left(\\dfrac{9\\pi}{22}\\right) \\right]$<br><br>Notice that the term in the brackets is exactly the denominator product. Therefore, the ratio of the numerator product to the denominator product is $-1$.<br><br>$\\alpha = (-1)^5 \\times (-1) = (-1) \\times (-1) = 1$<br><br>We need to find the value of $5 - \\alpha^2$:<br>$5 - (1)^2 = 5 - 1 = 4$<br><br>Answer: $4$", "image": null}, "level": 3, "videoSolution": {"videoId": "40484d876a81468fb1b6e698af1ea3f2", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/6NcSSb6RoLtPo.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/6NcSSb6RoLtPo.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "i 8734;</mo></munderover><msup><mi>sin</mi><mrow><mn>2</mn><mi>k</mi></mrow></msup><mfenced><mfrac><mi>&#960;</mi><mn>6</mn></mfrac></mfenced></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><msup><mn>2</mn><mrow><mi>a</mi><mi>x</mi></mrow></msup><mo>+</mo><msup><mn>2</mn><mrow><mi>a</mi><mfenced><mrow><mn>1</mn><mo>-</mo><mi>x</mi></mrow></mfenced></mrow></msup></math>.&nbsp;</p><p>Now solving,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>=</mo><munderover><mo>&#8721;</mo><mrow><mi>k</mi><mo>=</mo><mn>1</mn></mrow><mo>&#8734;</mo></munderover><msup><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mrow><mn>2</mn><mi>k</mi></mrow></msup><mo>=</mo><munderover><mo>&#8721;</mo><mrow><mi>k</mi><mo>=</mo><mn>1</mn></mrow><mo>&#8734;</mo></munderover><msup><mfenced><mfrac><mn>1</mn><mn>4</mn></mfrac></mfenced><mi>k</mi></msup><mo>=</mo><mfrac><mstyle displaystyle=\"true\"><mfrac><mn>1</mn><mn>4</mn></mfrac></mstyle><mrow><mn>1</mn><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac></math></p><p>Now putting the value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi></math>&nbsp;in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mfenced><mi>x</mi></mfenced></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><msup><mn>2</mn><mfrac><mi>x</mi><mn>3</mn></mfrac></msup><mo>+</mo><msup><mn>2</mn><mfrac><mfenced><mrow><mn>1</mn><mo>-</mo><mi>x</mi></mrow></mfenced><mn>3</mn></mfrac></msup></math></p><p>Now, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>g</mi><mo>&#39;</mo></msup><mfenced><mi>x</mi></mfenced><mo>=</mo><mfrac><mrow><mi>ln</mi><mn>2</mn></mrow><mn>3</mn></mfrac><mfrac><mfenced><mrow><msup><mn>2</mn><mstyle displaystyle=\"true\"><mfrac><mrow><mn>2</mn><mi>x</mi></mrow><mn>3</mn></mfrac></mstyle></msup><mo>-</mo><msup><mn>2</mn><mstyle displaystyle=\"true\"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle></msup></mrow></mfenced><msup><mn>2</mn><mstyle displaystyle=\"true\"><mfrac><mi>x</mi><mn>3</mn></mfrac></mstyle></msup></mfrac></math></p><p>Now finding the critical point by&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>g</mi><mo>&#39;</mo></msup><mfenced><mi>x</mi></mfenced><mo>=</mo><mn>0</mn></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p>And, derivative changes sign from negative to positive at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math>, hence <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math> is point of local minimum as well as absolute minimum of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mfenced><mi>x</mi></mfenced></math> for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#8712;</mo><mfenced close=\"]\" open=\"[\"><mrow><mn>0</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math></p><p>Hence, minimum value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mi>g</mi><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mn>2</mn><mfrac><mn>1</mn><mn>6</mn></mfrac></msup><mo>+</mo><msup><mn>2</mn><mfrac><mn>1</mn><mn>6</mn></mfrac></msup><mo>=</mo><msup><mn>2</mn><mfrac><mn>7</mn><mn>6</mn></mfrac></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math> Option <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>A</mi></mfenced></math> is correct</p><p>Now maximum value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mfenced><mi>x</mi></mfenced></math> is either     let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
