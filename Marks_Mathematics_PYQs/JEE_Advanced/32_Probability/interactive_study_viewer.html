ers produced. <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>%</mo></math> of computers produced in the factory turn out to be defective. It is known that,&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>(computer turns out to be defective given that it is produced in plant&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>1</mn></msub></math>)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>10</mn><mi>P</mi></math>(computer turns out to be defective given that it is produced in plant&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub></math>).</p><p>Where,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mi>E</mi></mfenced></math> denotes the probability of an event <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>E</mi><mo>.</mo></math>&nbsp;A computer produced in the factory is randomly selected and it does not turn out to be defective. Then the probability that it is produced in plant <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>T</mi><mn>2</mn></msub></math> is</p>", "image": null}, "options": [{"id": "fTW5f", "text": "<math><mfrac><mrow><mn>36</mn></mrow><mrow><mn>73</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "KFCi1", "text": "<math><mfrac><mrow><mn>47</mn></mrow><mrow><mn>79</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "37NRP", "text": "<math><mfrac><mrow><mn>78</mn></mrow><mrow><mn>93</mn></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "2bXEQ", "text": "<math><mfrac><mrow><mn>75</mn></mrow><mrow><mn>83</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><msub><mi>T</mi><mn>1</mn></msub></mfenced><mo>=</mo><mfrac><mn>20</mn><mn>100</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><msub><mi>T</mi><mn>2</mn></msub></mfenced><mo>=</mo><mfrac><mn>80</mn><mn>100</mn></mfrac></math></p><p>Let,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><mfrac><mi>D</mi><msub><mi>T</mi><mn>2</mn></msub></mfrac></mfenced><mo>=</mo><mi>x</mi></math>&nbsp;(where,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>D</mi></math>&nbsp;represents defective units)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><mfrac><mi>D</mi><msub><mi>T</mi><mn>1</mn></msub></mfrac></mfenced><mo>=</mo><mn>10</mn><mi>x</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><mi>D</mi></mfenced><mo>=</mo><mfrac><mn>7</mn><mn>100</mn></mfrac></math> (given)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><msub><mi>T</mi><mn>1</mn></msub></mfenced><mi>&#160;</mi><mi>P</mi><mfenced separators=\"|\"><mfrac><mi>D</mi><msub><mi>T</mi><mn>1</mn></msub></mfrac></mfenced><mo>+</mo><mi>P</mi><mfenced separators=\"|\"><msub><mi>T</mi><mn>2</mn></msub></mfenced><mi>&#160;</mi><mi>P</mi><mfenced separators=\"|\"><mfrac><mi>D</mi><msub><mi>T</mi><mn>2</mn></msub></mfrac></mfenced><mo>=</mo><mfrac><mn>7</mn><mn>100</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>20</mn><mn>100</mn></mfrac><mo>&#215;</mo><mn>10</mn><mi>x</mi><mo>+</mo><mfrac><mn>80</mn><mn>100</mn></mfrac><mo>&#215;</mo><mi>x</mi><mo>=</mo><mfrac><mn>7</mn><mn>100</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mn>1</mn><mn>40</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><mfrac><mi>D</mi><msub><mi>T</mi><mn>2</mn></msub></mfrac></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>40</mn></mfrac></math></p><p> dvanced 2015 (Paper 1)"}], "type": "numerical", "level": 1, "question": {"text": "The minimum number of times a fair coin needs to be tossed so that the probability of getting at least&nbsp;two heads is at least&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn><mo>.</mo><mn>96</mn></math>, is", "image": null}, "options": [], "correctValue": "8", "solution": {"text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced separators=\"|\"><mn>2</mn></mfenced><mo>+</mo><mi>P</mi><mfenced separators=\"|\"><mn>3</mn></mfenced><mo>&#8230;</mo><mo>&#8805;</mo><mn>0</mn><mo>.96</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>-</mo><mi>P</mi><mfenced separators=\"|\"><mn>0</mn></mfenced><mo>-</mo><mi>P</mi><mfenced separators=\"|\"><mn>1</mn></mfenced><mo>&#8805;</mo><mn>0</mn><mo>.96</mo></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn><mo>-</mo><mn>0</mn><mo>.96</mo><msup><mo>&#8805;</mo><mi>n</mi></msup><msub><mi>C</mi><mn>0</mn></msub><msup><mfenced separators=\"|\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mi>n</mi></msup><msup><mo>+</mo><mi>n</mi></msup><msub><mi>C</mi><mn>1</mn></msub><msup><mfenced separators=\"|\"><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mi>n</mi></msup></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mn>0</mn><mo>.04</mo></mrow></mfenced><msup><mn>2</mn><mi>n</mi></msup><mo>&#8805;</mo><mn>1</mn><mo>+</mo><mi>n</mi></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>4</mn><msup><mo>.2</mo><mi>n</mi></msup><mo>&#8805;</mo><mfenced separators=\"|\"><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mn>100</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mn>2</mn><mrow><mi>n</mi><mo>+</mo><mn>2</mn></mrow></msup><mo>&#8805;</mo><mfenced separators=\"|\"><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mn>100</mn></math><br />As,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mn>10</mn></msup><mo>&#8805;</mo><mn>900</mn></math><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>n</mi><mo>=</mo><mn>8</mn></math>", "image": null}, "videoSolution": {"videoId": "1724e9730edb40538dc6bfef1c89c8d0", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/PUZwSLQY2VhNf.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/PUZwSLQY2VhNf.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf826", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015 (Paper 1)", "title": "JEE Advanced 2015 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a23f23ac7d519f9b1b0", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Four fair dice $D_{1}, D_{2}, D_{3}$ and $D_{4}$; each having six faces numbered $1,2,3,4,5$ and 6 are rolled simultaneously. The probability that $D_{4}$ shows a number appearing on one of $D_{1}, D_{2}$ and $\\mathrm{D}_{3}$ is", "image": null}, "options": [{"id": "YM97P", "text": "$\\frac{91}{216}$", "isCorrect": true, "image": null}, {"id": "M2sDK", "text": "$\\frac{108}{216}$", "isCorrect": false, "image": null}, {"id": "umYCh", "text": "$\\frac{125}{216}$", "isCorrect": false, "image": null}, {"id": "dWnnL", "text": "$\\frac{127}{216}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$D_{4}$ can show a number appearing on one of $D_{1}, D_{2}$ and $D_{3}$ in the following cases.\r\n\r\nCase $\\mathbf{I}: D_{4}$ shows a number which is shown by exactly one of $D_{1}, D_{2}$ and $D_{3}$.\r\n\r\n$D_{4}$ shows a number in ${ }^{6} C_{1}$ ways.\r\n\r\nOne out of $D_{1}, D_{2}$ and $D_{3}$ can be selected in ${ }^{3} C_{1}$ ways.\r\n\r\n[The selected die shows the same number as on $D_{4}$ in one way and rest two dice show the different number in 5 ways each, ]\r\n\r\n$\\therefore$ Number of ways\r\n\r\n$={ }^{6} C_{1} \\times{ }^{3} C_{1} \\times 1 \\times 5 \\times 5=450$\r\n\r\nCase II : $D_{4}$ shows a number which is shown by exactly two of $D_{1}, D_{2}$ and $D_{3}$.\r\n\r\nNumber of ways\r\n\r\n$={ }^{6} C_{1} \\times{ }^{3} C_{2} \\times 1 \\times 1 \\times 5=90$\r\n\r\nCase III : $D_{4}$ shows a number which is shown by all three dice $D_{1}, D_{2}$ and $D_{3}$.\r\n\r\nNumber of ways\r\n\r\n$={ }^{6} C_{1} \\times{ }^{3} C_{3} \\times 1 \\times 1 \\times 1=6$\r\n\r\n$\\therefore$ Total number of favourable ways $=450+90+6=546$ Total ways $=6 \\times 6 \\times 6 \\times 6$\r\n\r\n$\\therefore$ Required Probability $=\\frac{546}{6 \\times 6 \\times 6 \\times 6}=\\frac{91}{216}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "64b16ae3f23ac7d519f9b92d", "title": "Random Variable and its Probability Distribution", "totalQuestions": 1, "questions": [{"_id": "64b16aabf23ac7d519f9b686", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}], "question": {"text": "<p>Consider the <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn><mo>&#215;</mo><mn>6</mn></math>&nbsp;square in the figure. Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mn>1</mn></msub><mo>,</mo><msub><mi>A</mi><mn>2</mn></msub><mo>,</mo><mo>&#8230;</mo><mo>,</mo><msub><mi>A</mi><mn>49</mn></msub></math> be the points of intersections (dots in the picture) in some order. We say that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mi>i</mi></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mi>j</mi></msub></math> are friends if they are adjacent along a row or along a column. Assume that each point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>A</mi><mi>i</mi></msub></math> has an equal chance of being chosen.</p>\n\n<p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/d33e0b30-a00c-486d-8560-c6e3e5f7757d.png\" style=\"width: 200px; height: 197px;\" /></p>\n\n<p>(There are two questions based on <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>PARAGRAPH</mi><mo>&#160;</mo><mo>&#34;</mo><mi>II</mi><mo>&#34;</mo></math>, the question given below is one of them)</p>\n<br>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>p</mi><mi>i</mi></msub></math> be the probability that a randomly chosen point has <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi></math> many friends, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn></math>. Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math> be a random variable such that for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>i</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn></math>, the probability <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>(</mo><mi>X</mi><mo>=</mo><mi>i</mi><mo>)</mo><mo>=</mo><msub><mi>p</mi><mi>i</mi></msub></math>. Then the value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&#160;</mo><mi>E</mi><mo>(</mo><mi>X</mi><mo>)</mo></math> is", "image": null}, "options": [], "correctValue": "24", "solution": {"text": "<blockquote><p>Plotting the diagram of the given data we get,<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/2c2054b5-d922-4928-bbde-072f8a9c9346.png\" style=\"width: 300px; height: 256px;\" /></p><p>Now from above diagram we get,</p><p>Number of points having <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn></math> friend <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn></math><br />Number of points having <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> friend <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>0</mn></math><br />Number of points having <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math> friends <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4</mn></math><br />Number of points having <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> friends <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>5</mn><mo>&#215;</mo><mn>4</mn><mo>=</mo><mn>20</mn></math></p><p>Number of points having <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math> friends&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>49</mn><mo>-</mo><mn>24</mn><mo>=</mo><mn>25</mn></math></p><p>So, probability distribution table will be,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/f91725a1-b101-4885-8908-39e179cd0627.png\" style=\"width: 300px; height: 74px;\" /></p><p>Now from above table expected value will be given by,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn><mo>&#183;</mo><mi>E</mi><mfenced><mi>X</mi></mfenced><mo>=</mo><mn>7</mn><mfenced separators=\"|\"><mrow><mn>0</mn><mo>+</mo><mn>0</mn><mo>+</mo><mfrac><mn>4</mn><mn>49</mn></mfrac><mo>&#215;</mo><mn>2</mn><mo>+</mo><mfrac><mn>20</mn><mn>49</mn></mfrac><mo>&#215;</mo><mn>3</mn><mo>+</mo><mfrac><mn>25</mn><mn>49</mn></mfrac><mo>&#215;</mo><mn>4</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>7</mn><mo>&#183;</mo><mi>E</mi><mfenced><mi>X</mi></mfenced><mo>=</mo><mn>7</mn><mfenced separators=\"|\"><mfrac><mrow><mn>100</mn><mo>+</mo><mn>60</mn><mo>+</mo><mn>8</mn></mrow><mn>49</mn></mfrac></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>7</mn><mo>&#183;</mo><mi>E</mi><mfenced><mi>X</mi></mfenced><mo>=</mo><mn>24</mn></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "593ae28c271c44ae8078c3c8df38df48", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/xG3ljPxh9FMuR.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/xG3ljPxh9FMuR.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
