.org/1998/Math/MathML\"><mi>X</mi></math>. Then the probability that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>,</mo><mo>&#160;</mo><mi>Q</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>R</mi></math> form a triangle whose area is a positive integer, is", "image": null}, "options": [{"id": "vEn11", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>71</mn><mn>220</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "WlEq4", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>73</mn><mn>220</mn></mfrac></math>", "image": null, "isCorrect": true}, {"id": "hUQCO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>79</mn><mn>220</mn></mfrac></math>", "image": null, "isCorrect": false}, {"id": "zTV27", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>83</mn><mn>220</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Given,</p><p>Equation of ellipse&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>8</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>20</mn></mfrac><mo>=</mo><mn>1</mn></math></p><p>And equation of parabola&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>5</mn><mi mathvariant=\"normal\">x</mi></math></p><p>Now intersection point of ellipse and parabola will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>2</mn><mo>,</mo><msqrt><mn>10</mn></msqrt></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mo>-</mo><msqrt><mn>10</mn></msqrt></mrow></mfenced></math></p><p>Now plotting the region&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>8</mn></mfrac><mo>+</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>20</mn></mfrac><mo>&#60;</mo><mn>1</mn><mo>&#160;</mo><mi>and</mi><mo>&#160;</mo><msup><mi>y</mi><mn>2</mn></msup><mo>&#60;</mo><mn>5</mn><mi mathvariant=\"normal\">x</mi></math>&nbsp;we get,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/e7ac496b-07c5-4b63-96d0-c586ebc3c5ce.png\" style=\"width: 300px; height: 229px;\" /></p><p>Now randomly chosen points will be between origin and the intersecting point,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/fe39bf9a-2da7-44d0-8ecf-2e43c948cfff.png\" style=\"width: 300px; height: 267px;\" /></p><p>So, the integer points inside region are&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>3</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>3</mn></mrow></mfenced><mo>,</mo><mspace linebreak=\"newline\"></mspace><mfenced><mrow><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced></mrow></mfenced></math></p><p>Total number of ways to select three points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mmultiscripts><mi>C</mi><mn>3</mn><none></none><mprescripts></mprescripts><none></none><mn>12</mn></mmultiscripts><mo>=</mo><mn>220</mn></math></p><p>Required number of triangle&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>4</mn><mo>&#215;</mo><mmultiscripts><mi>C</mi><mn>1</mn><none></none><mprescripts></mprescripts><none></none><mn>7</mn></mmultiscripts><mo>+</mo><mn>9</mn><mo>&#215;</mo><mmultiscripts><mi>C</mi><mn>1</mn><none></none><mprescripts></mprescripts><none></none><mn>5</mn></mmultiscripts><mo>=</mo><mn>73</mn></math></p><p>{Note: Points are taken such a way that distance between two points are multiple of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>&nbsp;for example if we take points on line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn></math>&nbsp;we can take following points&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mrow><mfenced><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mn>0</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mn>0</mn></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mo>-</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mo>-</mo><mn>2</mn></mrow></mfenced></mrow></mfenced></math></p><p>so there will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>&nbsp;pairs from line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn></math>&nbsp;and will chose another point from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>2</mn></math>&nbsp;line&nbsp;so triangle will have a positive area. Also note that height of the triangle will always be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>}</p><p>Hence, probability will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>73</mn><mn>220</mn></mfrac></math></p></blockquote>", "image": null}, "videoSolution": {"videoId": "37e53f53c4c54d75956958815c5b1738", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/97v2hHGXRd48i.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/97v2hHGXRd48i.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a94f23ac7d519f9b5b1", "previousYearPapers": [{"_id": "619f94437e944e1fdc2859b5", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 2)", "title": "JEE Advanced 2021 (Paper 2)"}], "type": "numerical", "level": 1, "question": {"text": "A number is chosen at random from the set&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced open=\"{\" close=\"}\"><mrow><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo rs $1,2,3,4,5,6,7$. A card is drawn from each of the boxes. Let $x_{i}$ be the number on the card drawn from the $i^{t h}$ box, $i=1,2,3$.\r\n\r\n<br> <strong> Question: </strong>\r\n\r\nThe probability that $x_{1}+x_{2}+x_{3}$ is odd, is", "image": null}, "options": [{"id": "lAGJa", "text": "<math><mfrac><mrow><mn>29</mn></mrow><mrow><mn>105</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "HGEFT", "text": "<math><mfrac><mrow><mn>53</mn></mrow><mrow><mn>105</mn></mrow></mfrac></math>", "isCorrect": true, "image": null}, {"id": "nN4Yp", "text": "<math><mfrac><mrow><mn>57</mn></mrow><mrow><mn>105</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}, {"id": "1Hsbt", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Case I: One odd, 2 even<br />Total number of ways <math><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>3</mn><mo>+</mo><mn>1</mn><mo>&#215;</mo><mn>3</mn><mo>&#215;</mo><mn>3</mn><mo>+</mo><mn>1</mn><mo>&#215;</mo><mn>2</mn><mo>&#215;</mo><mn>4</mn><mo>=</mo><mn>29</mn></math><br />Case II: All 3 odd<br />Number of ways <math><mo>=</mo><mn>2</mn><mo>&#215;</mo><mn>3</mn><mo>&#215;</mo><mn>4</mn><mo>=</mo><mn>24</mn></math><br />Favourable ways = 53<br />Required probability <math><mo>=</mo><mfrac><mrow><mn>53</mn></mrow><mrow><mn>3</mn><mo>&#215;</mo><mn>5</mn><mo>&#215;</mo><mn>7</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>53</mn></mrow><mrow><mn>105</mn></mrow></mfrac></math>", "image": null}, "videoSolution": {"videoId": "7eeada6fb0034acda2eaeaa7cfa45424", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/8JGlYWAZWJjt6.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/8JGlYWAZWJjt6.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "i  6}{6 \\times 6 \\times 6}=\\frac{2}{9}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169f4f23ac7d519f9affb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}], "question": {"text": "<strong>Paragraph:</strong>\nA fair die is tossed repeatedly until a six is obtained. Let $X$ denotes the number of tosses required.<strong>Question:</strong>\nThe probability that $X \\geq 3$ equals", "image": null}, "options": [{"id": "tzom7", "text": "\n$\\frac{125}{216}$\n", "image": null, "isCorrect": false}, {"id": "23HUe", "text": "\n$\\frac{25}{36}$\n", "image": null, "isCorrect": true}, {"id": "ayy54", "text": "\n$\\frac{5}{36}$\n", "image": null, "isCorrect": false}, {"id": "sAyo6", "text": "\n$\\frac{25}{216}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$P(X \\geq 3)=\\frac{5}{6} \\cdot \\frac{5}{6} \\cdot 1=\\frac{25}{36}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169f3f23ac7d519f9affa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c44", "e ": null}, "options": [{"id": "W3GOu", "text": "\n1\n", "image": null, "isCorrect": false}, {"id": "ExDAD", "text": "\n$\\frac{2}{3}$\n", "image": null, "isCorrect": true}, {"id": "d9Fo4", "text": "\n$\\frac{1}{4}$\n", "image": null, "isCorrect": false}, {"id": "l2lgQ", "text": "\n$\\frac{3}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/P2FXcCfLyF2E7Scmlez396yBvjhkeK-dJUDHezmuJrc.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64b16ae3f23ac7d519f9b92b", "title": "Addition and Subtraction Theorems", "totalQuestions": 2, "questions": [{"_id": "64b16a29f23ac7d519f9b1e9", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf822", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 1)", "title": "JEE Advanced 2013 (Paper 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Four persons independently solve a certain problem correctly with probabilities&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>,</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>,</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>,</mo><mfrac><mn>1</mn><mn>8</mn></mfrac></math>. Then the probability that the problem is solved correctly by at least one of them is", "image": null}, "options": [{"id": "9blV5", "text": "<math> <mrow> <mfrac> <mrow> <mn>2</mn> <mn>3</mn> <mn>5</mn> </mrow> <mrow> <mn>2</mn> <mn>5</mn> <mn>6</mn> </mrow> </mfrac> </mrow> </math>", "isCorrect": true, "image": null}, {"id": "cP2W2", "text": "<math ><mrow>  <mfrac>    <mrow>      <mn>2</mn>      <mn>1</mn>      <mn></mn>    </mrow>    <mrow>      <mn>2</mn>      <mn>5</mn>      <mn>6</mn>    </mrow>  </mfrac></mrow></math>", "isCorrect": false, "image": null}, {"id": "J75zb", "text": "<math><mrow>  <mfrac>    <mrow>      <mn>3</mn>      <mn></mn>      <mn></mn>    </mrow>    <mrow>      <mn>2</mn>      <mn>5</mn>      <mn>6</mn>    </mrow>  </mfrac></mrow></math>", "isCorrect": false, "image": null}, {"id": "ko5Uc", "text": "<math> <mrow> <mfrac> <mrow> <mn>2</mn> <mn>5</mn> <mn>3</mn> </mrow> <mrow> <mn>2</mn> <mn>5</mn> <mn>6</mn> </mrow> </mfrac> </mrow> </math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>(Problem solved by at least one) <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>-</mo><mi>P</mi></math>(Problem is not solved by all)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>-</mo><mi>P</mi><mfenced><mover><mi>A</mi><mo>&#175;</mo></mover></mfenced><mi>P</mi><mfenced><mover><mi>B</mi><mo>&#175;</mo></mover></mfenced><mi>P</mi><mfenced><mover><mi>C</mi><mo>&#175;</mo></mover></mfenced><mi>P</mi><mfenced><mover><mi>D</mi><mo>&#175;</mo></mover></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>1</mn><mo>-</mo><mfenced><mfrac><mn>1</mn><mn>2</mn></mfrac></mfenced><mfenced><mfrac><mn>1</mn><mn>4</mn></mfrac></mfenced><mfenced><mfrac><mn>3</mn><mn>4</mn></mfrac></mfenced><mfenced><mfrac><mn>7</mn><mn>8</mn></mfrac></mfenced><mo>=</mo><mn>1</mn><mo>-</mo><mfrac><mrow><mn>2</mn><mn>1</mn></mrow><mrow><mn>2</mn><mn>5</mn><mn>6</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mn>3</mn><mn>5</mn></mrow><mrow><mn>2</mn><mn>5</mn><mn>6</mn></mrow></mfrac></math></p>", "image": null}, "videoSolution": {"videoId": "63607c3e99614a238d4e211d601dd4f7", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/HkWqID414VSMz.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/HkWqID414VSMz.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf822", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 1)", "title": "JEE Advanced 2013 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a17f23ac7d519f9b13c", "type": "multipleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c49", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 2)", "title": "JEE Advanced 2011 (Paper 2)"}], "question": {"text": "Let $E$ and $F$ be two independent events. The probability that exactly one of them occurs is $11 / 25$ and the probability of none of them occurring is $2 / 25$. If $P(T)$ denotes the probability of occurrence of the event $T$, then", "image": null}, "options": [{"id": "nJ8Jg", "text": "\n$P(E)=\\frac{4}{5}, P(F)=\\frac{3}{5}$\n", "image": null, "isCorrect": true}, {"id": "bu3uw", "text": "\n$P(E)=\\frac{1}{5}, P(F)=\\frac{2}{5}$\n", "image": null, "isCorrect": false}, {"id": "8UTve", "text": "\n$P(E)=\\frac{2}{5}, P(F)=\\frac{1}{5}$\n", "image": null, "isCorrect": false}, {"id": "i496y", "text": "\n$P(E)=\\frac{3}{5}, P(F)=\\frac{4}{5}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/npte3oGDly9GUN3k8gBrVXSvn3jwoEwWiCLTtMUQ5Ng.original.fullsize.png\"><br>\n\n$$\nP(E \\cup F)-P(E \\cap F)=\\frac{11}{25}\n$$\n(i.e. only $E$ or only $F$ )<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/mBHGp2I9tOtkfP60SSq3iGSoDXC_ovlYuNpy4rtKhKE.original.fullsize.png\"><br>\nNeither of them occurs $=\\frac{2}{25}$ $\\Rightarrow \\quad P(\\bar{E} \\cap \\bar{F})=\\frac{2}{25}$\nFrom Eq. (i), we get\n$$\nP(E)+P(F)-2 P(E \\cap F)=\\frac{11}{25}\n$$\nFrom Eq. (ii), we get\n$$\n\\begin{gathered}\n(1-P(E))(1-P(F))=\\frac{2}{25} \\\\\n\\Rightarrow 1-P(E)-P(F)+P(E) \\cdot P(F)=\\frac{2}{25}\n\\end{gathered}\n$$\n(iv)\nFrom Eqs. (iii) and (iv), we get\n$$\n\\begin{aligned}\n& P(E)+P(F)=\\frac{7}{5} \\text { and } P(E) \\cdot P(F)=\\frac{12}{25} \\\\\n& \\therefore \\quad P(E) \\cdot\\left\\{\\frac{7}{5}-P(E)\\right\\}=\\frac{12}{25}\n\\end{aligned}\n$$\n\n$$\n\\begin{aligned}\n& \\Rightarrow \\quad(P(E))^2-\\frac{7}{5} P(E)+\\frac{12}{25}=0 \\\\\n& \\Rightarrow \\quad\\left(P(E)-\\frac{3}{5}\\right)\\left(P(E)-\\frac{4}{5}\\right)=0 \\\\\n& \\therefore \\quad P(E)=\\frac{3}{4} \\text { or } \\frac{4}{5} \\Rightarrow P(F)=\\frac{4}{5} \\text { or } \\frac{3}{5}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c49", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 2)", "title": "JEE Advanced 2011 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64b16ae3f23ac7d519f9b928", "title": "Conditional Probability and Multiplication Theorem", "totalQuestions": 23, "questions": [{"_id": "6a0be50c44d287c9361e5c7c", "type": "multipleCorrect", "question": {"text": "Suppose that Box I contains $6$ red balls and $9$ green balls, and Box II contains $8$ red balls and $12$ green balls. All the balls of Box I and Box II are mixed together and a ball is chosen at random from them. Let $E_1$ be the event that the ball chosen belonged to Box I and let $E_2$ be the event that the ball chosen belonged to Box II. Let $F_1$ be the event that the ball chosen is red and let $F_2$ be the event that the ball chosen is green.<br><br>Then which of the following statements is (are) TRUE?", "image": null}, "options": [{"id": "NVwsB", "text": "The events $E_1$ and $F_1$ are independent", "isCorrect": true, "image": null}, {"id": "nOYR8", "text": "The events $E_2$ and $F_2$ are dependent", "isCorrect": false, "image": null}, {"id": "LTYoK", "text": "The conditional probability $P(F_1 \\mid E_1)$ is equal to the conditional probability $P(F_1 \\mid E_2)$", "isCorrect": true, "image": null}, {"id": "2MOQk", "text": "The conditional probability $P(F_1 \\mid E_1)$ is greater than the conditional probability $P(F_2 \\mid E_2)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Total balls in Box I $= 6 + 9 = 15$<br>Total balls in Box II $= 8 + 12 = 20$<br>Total balls in the mixture $= 15 + 20 = 35$<br>Total red balls $= 6 + 8 = 14$<br>Total green balls $= 9 + 12 = 21$<br><br>The probabilities of the given events are:<br>$P(E_1) = \\dfrac{15}{35} = \\dfrac{3}{7}$<br>$P(E_2) = \\dfrac{20}{35} = \\dfrac{4}{7}$<br>$P(F_1) = \\dfrac{14}{35} = \\dfrac{2}{5}$<br>$P(F_2) = \\dfrac{21}{35} = \\dfrac{3}{5}$<br><br>The joint probabilities are:<br>$P(E_1 \\cap F_1) = \\dfrac{6}{35}$<br>$P(E_2 \\cap F_2) = \\dfrac{12}{35}$<br><br>For statement (A):<br>$P(E_1) P(F_1) = \\dfrac{3}{7} \\times \\dfrac{2}{5} = \\dfrac{6}{35} = P(E_1 \\cap F_1)$<br>Thus, $E_1$ and $F_1$ are independent. Statement (A) is TRUE.<br><br>For statement (B):<br>$P(E_2) P(F_2) = \\dfrac{4}{7} \\times \\dfrac{3}{5} = \\dfrac{12}{35} = P(E_2 \\cap F_2)$<br>Thus, $E_2$ and $F_2$ are independent. Statement (B) is FALSE.<br><br>For statement (C):<br>$P(F_1 \\mid E_1) = \\dfrac{P(E_1 \\cap F_1)}{P(E_1)} = \\dfrac{6/35}{15/35} = \\dfrac{2}{5}$<br>$P(F_1 \\mid E_2) = \\dfrac{P(E_2 \\cap F_1)}{P(E_2)} = \\dfrac{8/35}{20/35} = \\dfrac{2}{5}$<br>Since $P(F_1 \\mid E_1) = P(F_1 \\mid E_2)$, statement (C) is TRUE.<br><br>For statement (D):<br>$P(F_2 \\mid E_2) = \\dfrac{P(E_2 \\cap F_2)}{P(E_2)} = \\dfrac{12/35}{20/35} = \\dfrac{3}{5}$<br>Since $\\dfrac{2}{5} < \\dfrac{3}{5}$, $P(F_1 \\mid E_1)$ is not greater than $P(F_2 \\mid E_2)$. Statement (D) is FALSE.<br><br>Answer: The events $E_1$ and $F_1$ are independent; The conditional probability $P(F_1 \\mid E_1)$ is equal to the conditional probability $P(F_1 \\mid E_2)$", "image": null}, "level": 2, "videoSolution": {"videoId": "a58fd3d3105c44578992262dc5cc9c5d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/RL3ON4ql2auuZ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/RL3ON4ql2auuZ.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "685102bd6bba689a3eb09c70", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "684c67d769037fad219cb0c1", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 1)", "title": "JEE Advanced 2025 (Paper 1)"}], "question": {"text": "Three students $S_1, S_2$ and $S_1$ are given a problem to solve. Consider the following events :\n$U:$ At least one of $S_1, S_2$ and $S_3$ can solve the problem,\n$V: S_1$ can solve the problem, given that neither $\\mathrm{S}_2$ nor $\\mathrm{S}_3$ can solve the problem,\n$W: S_2$ can solve the problem and $S_3$ cannot solve the problem,\n$T: S_3$ can solve the problem.\nFor any event $E$, let $P(E)$ denote the probability of $E$.\nIf $P(U)=\\frac{1}{2}, P(V)=\\frac{1}{10}$ and $P(W)=\\frac{1}{12}$, then $P(T)$ is equal to", "image": null}, "options": [{"id": "o6ttF", "text": "$\\frac{13}{36}$", "image": null, "isCorrect": true}, {"id": "N84vV", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": false}, {"id": "huxhN", "text": "$\\frac{19}{60}$", "image": null, "isCorrect": false}, {"id": "05920", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\mathrm{P}(\\mathrm{U})=1-\\mathrm{P}\\left(\\mathrm{~S}_1^{\\prime} \\cap \\mathrm{S}_2^{\\prime} \\cap \\mathrm{S}_3^{\\prime}\\right)=\\frac{1}{2} \\\\\n& \\Rightarrow \\mathrm{P}\\left(\\mathrm{~S}_1^{\\prime} \\cap \\mathrm{S}_2^{\\prime} \\cap \\mathrm{S}_3^{\\prime}\\right)=\\frac{1}{2} ; \\mathrm{P}\\left(\\mathrm{~S}_1^{\\prime}\\right) \\cdot \\mathrm{P}\\left(\\mathrm{~S}_2^{\\prime}\\right) \\cdot \\mathrm{P}\\left(\\mathrm{~S}_3^{\\prime}\\right)=\\frac{1}{2} \\\\\n& \\Rightarrow\\left(1-\\mathrm{P}\\left(\\mathrm{~S}_1\\right)\\right)\\left(1-\\mathrm{P}\\left(\\mathrm{~S}_2\\right)\\right)\\left(1-\\mathrm{P}\\left(\\mathrm{~S}_3\\right)\\right)=\\frac{1}{2} \\quad \\ldots(1)\n\\end{aligned}$\n$\\begin{aligned} & \\mathrm{P}(\\mathrm{V})=\\frac{\\mathrm{P}\\left(\\mathrm{S}_1 \\cap \\mathrm{~S}_2^{\\prime} \\cap \\mathrm{S}_3^{\\prime}\\right)}{\\mathrm{P}\\left(\\mathrm{S}_2^{\\prime} \\cap \\mathrm{S}_3^{\\prime}\\right)}=\\frac{1}{10} \\\\ & \\Rightarrow \\mathrm{P}\\left(\\mathrm{S}_1\\right) \\cdot \\mathrm{P}\\left(\\mathrm{S}_2^{\\prime}\\right) \\mathrm{P}\\left(\\mathrm{S}_3^{\\prime}\\right)=\\frac{1}{10} \\mathrm{P}\\left(\\mathrm{S}_2^{\\prime}\\right) \\cdot \\mathrm{P}\\left(\\mathrm{S}_3^{\\prime}\\right) \\\\ & \\Rightarrow \\mathrm{P}\\left(\\mathrm{S}_1\\right)=\\frac{1}{10}\\end{aligned}$\n$\\begin{aligned}\n& \\mathrm{P}(\\mathrm{~W})=\\mathrm{P}\\left(\\mathrm{~S}_2 \\cap \\mathrm{~S}_3^{\\prime}\\right)=\\frac{1}{12} \\\\\n& \\mathrm{P}\\left(\\mathrm{~S}_2\\right) \\cdot \\mathrm{P}\\left(\\mathrm{~S}_3^{\\prime}\\right)=\\frac{1}{12} \\\\\n& \\mathrm{P}\\left(\\mathrm{~S}_2\\right)\\left(1-\\mathrm{P}\\left(\\mathrm{~S}_3\\right)\\right)=\\frac{1}{12}...(2)\n\\end{aligned}$\nEq. (1)\n$\\left(1-\\frac{1}{10}\\right)\\left(1-\\mathrm{P}\\left(\\mathrm{~S}_2\\right)\\right)\\left(1-\\mathrm{P}\\left(\\mathrm{~S}_3\\right)\\right)=\\frac{1}{2}$\n$\\left(1-\\mathrm{P}\\left(\\mathrm{~S}_2\\right)\\right)\\left(1-\\mathrm{P}\\left(\\mathrm{~S}_3\\right)\\right)=\\frac{5}{9}....(3)$\n$\\begin{aligned}\n& \\frac{\\text { Eq. }(2)}{\\text { Eq. }(3)} \\Rightarrow \\frac{\\mathrm{P}\\left(\\mathrm{~S}_2\\right)}{1-\\mathrm{P}\\left(\\mathrm{~S}_2\\right)}=\\frac{1}{12} \\times \\frac{9}{5} \\\\\n& \\mathrm{P}\\left(\\mathrm{~S}_2\\right)=\\frac{3}{23}\n\\end{aligned}$\nPut in Eq. (2)\n$\\begin{aligned}\n& \\frac{3}{23}\\left(1-\\mathrm{P}\\left(\\mathrm{~S}_3\\right)\\right)=\\frac{1}{12} \\\\\n& 1-\\mathrm{P}\\left(\\mathrm{~S}_3\\right)=\\frac{23}{36} \\\\\n& \\mathrm{P}\\left(\\mathrm{~S}_3\\right)=\\frac{13}{36} \\\\\n& \\mathrm{P}(\\mathrm{~T})=\\frac{13}{36}\n\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "4c08dbea44c242c98f181e20fe085f6e", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/h9vTSJSBf9Ks3.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/h9vTSJSBf9Ks3.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "684c67d769037fad219cb0c1", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 1)", "title": "JEE Advanced 2025 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66965deed603121f43a45b89", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}], "question": {"text": "A bag contains $N$ balls out of which 3 balls are white, 6 balls are green, and the remaining balls are blue. Assume that the balls are identical otherwise. Three balls are drawn randomly one after the other without replacement. For $i=1,2,3$, let $W_i, G_i$, and $B_i$ denote the events that the ball drawn in the $i^{\\text {th }}$ draw is a white ball, green ball, and blue ball, respectively. If the probability $P\\left(W_1 \\cap G_2 \\cap B_3\\right)=\\frac{2}{5 N}$ and the conditional probability $P\\left(B_3 \\mid W_1 \\cap G_2\\right)=\\frac{2}{9}$, then $N$ equals ________.", "image": null}, "options": [], "correctValue": 11, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/f7tSqEqBZsB0ppVs8efBEGWvpewRd8MPyr9pM2Xg2kk.original.fullsize.png\">\nGiven $\\mathrm{P}\\left(\\mathrm{W}_1 \\cap \\mathrm{G}_2 \\cap \\mathrm{B}_3\\right)=\\frac{2}{5 \\mathrm{~N}}$\nand $\\mathrm{P}\\left(\\mathrm{B}_3 \\mid \\mathrm{W}_1 \\cap \\mathrm{G}_2\\right)=\\frac{2}{9}$\n$\\begin{aligned} & \\Rightarrow \\frac{\\mathrm{P}\\left(\\mathrm{B}_3 \\cap \\mathrm{W}_1 \\cap \\mathrm{G}_2\\right)} mn>1</mn><mo>,</mo><mn>2</mn><mo>}</mo></math>&nbsp;chosen in the beginning&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><msub><mi>B</mi><mrow><mn>1</mn><mo>,</mo><mn>3</mn></mrow></msub></mfenced><mo>&#8594;</mo></math>If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>{</mo><mn>1</mn><mo>,</mo><mn>3</mn><mo>}</mo></math>&nbsp;chosen in the beginning</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><msub><mi>B</mi><mrow><mn>2</mn><mo>,</mo><mn>3</mn></mrow></msub></mfenced><mo>&#8594;</mo></math>If&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>{</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>}</mo></math>&nbsp;chosen in the beginning</p><p><strong>(i)</strong> If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>{</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>}</mo></math>&nbsp;is chosen in the begining, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>2</mn></msub><mo>=</mo><mo>{</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>}</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>2</mn></msub></math> must contain <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mn>1</mn></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>3</mn></msub><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced></math> from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>G</mi><mn>2</mn></msub><mo>=</mo><mo>{</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>,</mo><mn>5</mn><mo>}</mo></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><msub><mi>B</mi><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></msub></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#215;</mo><mfrac><mrow><mn>1</mn><mo>&#215;</mo><mmultiscripts><mi>C</mi><mn>1</mn><none></none><mprescripts></mprescripts><none></none><mn>3</mn></mmultiscripts></mrow><mmultiscripts><mi>C</mi><mn>2</mn><none></none><mprescripts></mprescripts><none></none><mn>4</mn></mmultiscripts></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mmultiscripts><mi>C</mi><mn>2</mn><none></none><mprescripts></mprescripts><none></none><mn>5</mn></mmultiscripts></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>10</mn></mfrac></math></p><p><strong>(ii)</strong> If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>{</mo><mn>1</mn><mo>,</mo><mn>3</mn><mo>}</mo></math>&nbsp;is chosen in the begining,&nbsp;then&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>2</mn></msub><mo>=</mo><mo>{</mo><mn>1</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>}</mo></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>2</mn></msub></math> must contain <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mn>1</mn></mfenced></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>3</mn></msub><mo>=</mo><mfenced close=\"}\" open=\"{\"><mrow><mn>1</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math> from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>G</mi><mn>2</mn></msub><mo>=</mo></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>{</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>,</mo><mn>5</mn><mo>}</mo></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><msub><mi>B</mi><mrow><mn>1</mn><mo>,</mo><mn>3</mn></mrow></msub></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#215;</mo><mfrac><mrow><mn>1</mn><mo>&#215;</mo><mmultiscripts><mi>C</mi><mn>1</mn><none></none><mprescripts></mprescripts><none></none><mn>2</mn></mmultiscripts></mrow><mmultiscripts><mi>C</mi><mn>2</mn><none></none><mprescripts></mprescripts><none></none><mn>3</mn></mmultiscripts></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mmultiscripts><mi>C</mi><mn>2</mn><none></none><mprescripts></mprescripts><none></none><mn>5</mn></mmultiscripts></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#215;</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>10</mn></mfrac></math></p><p><strong>(iii)</strong> If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>{</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>}</mo></math>&nbsp;is chosen in the begining, then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>F</mi><mn>2</mn></msub><mo>=</mo><mo>{</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>}</mo></math>, then two cases are possible</p><p>1.&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>2</mn></msub></math> may contain <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mn>1</mn></mfenced></math> and getting <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>3</mn></msub><mo>=</mo><mo>(</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>)</mo></math> from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>G</mi><mn>2</mn></msub><mo>=</mo><mo>{</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>,</mo><mn>5</mn><mo>)</mo></math></p><p>2.&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>2</mn></msub></math>&nbsp;does&nbsp;not contain <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mn>1</mn></mfenced></math> and getting <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>)</mo></math> from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>G</mi><mn>2</mn></msub><mo>=</mo><mo>{</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo>,</mo><mn>4</mn><mo>,</mo><mn>5</mn><mo>]</mo></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><msub><mi>B</mi><mrow><mn>2</mn><mo>,</mo><mn>3</mn></mrow></msub></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#215;</mo><mfenced close=\"]\" open=\"[\"><mrow><mfrac><mrow><mmultiscripts><mi mathvariant=\"normal\">C</mi><mn>2</mn><none></none><mprescripts></mprescripts><none></none><mn>3</mn></mmultiscripts><mo>&#215;</mo><mn>1</mn></mrow><mmultiscripts><mi mathvariant=\"normal\">C</mi><mn>2</mn><none></none><mprescripts></mprescripts><none></none><mn>4</mn></mmultiscripts></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mmultiscripts><mi mathvariant=\"normal\">C</mi><mn>2</mn><none></none><mprescripts></mprescripts><none></none><mn>4</mn></mmultiscripts></mfrac><mo>+</mo><mfrac><mrow><mn>1</mn><mo>&#215;</mo><mmultiscripts><mi mathvariant=\"normal\">C</mi><mn>1</mn><none></none><mprescripts></mprescripts><none></none><mn>3</mn></mmultiscripts></mrow><mmultiscripts><mi mathvariant=\"normal\">C</mi><mn>2</mn><none></none><mprescripts></mprescripts><none></none><mn>4</mn></mmultiscripts></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mmultiscripts><mi mathvariant=\"normal\">C</mi><mn>2</mn><none></none><mprescripts></mprescripts><none></none><mn>5</mn></mmultiscripts></mfrac></mrow></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#215;</mo><mfenced close=\"]\" open=\"[\"><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>6</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>10</mn></mfrac></mrow></mfenced></math></p><p>Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>p</mi><mo>=</mo><mfrac><mrow><mi>P</mi><mfenced><msub><mi>B</mi><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></msub></mfenced></mrow><mrow><mi>P</mi><mfenced><msub><mi>B</mi><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></msub></mfenced><mo>+</mo><mi>P</mi><mfenced><msub><mi>B</mi><mrow><mn>1</mn><mo>,</mo><mn>3</mn></mrow></msub></mfenced><mo>+</mo><mi>P</mi><mfenced><msub><mi>B</mi><mrow><mn>2</mn><mo>,</mo><mn>3</mn></mrow></msub></mfenced></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>10</mn></mfrac></mrow><mrow><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>10</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#215;</mo><mfrac><mn>2</mn><mn>3</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>10</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&#215;</mo><mfenced close=\"]\" open=\"[\"><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>6</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>10</mn></mfrac></mrow></mfenced></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>5</mn></mfrac></math></p>", "image": null}, "videoSolution": {"videoId": "a1167c7e9382419989c44c59975cc34d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/a29t9qcUpTbhZ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/a29t9qcUpTbhZ.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "619f94337e944e1fdc2859b4", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 1)", "title": "JEE Advanced 2021 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a87f23ac7d519f9b53e", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf831", "examI /www.w3.org/1998/Math/MathML\"><mn>5</mn></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>7</mn></math> or <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>11</mn></math>, which can be obtained by&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mn>4</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>4</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>3</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mn>6</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>6</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>5</mn><mo>,</mo><mn>2</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>2</mn><mo>,</mo><mn>5</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>3</mn><mo>,</mo><mn>4</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>4</mn><mo>,</mo><mn>3</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>6</mn><mo>,</mo><mn>5</mn></mrow></mfenced><mo>,</mo><mfenced><mrow><mn>5</mn><mo>,</mo><mn>6</mn></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>(square or prime)<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>22</mn><mn>36</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">P</mi><mfenced><mfrac><mtext>&#160;Perfect square&#160;is&#160;odd&#160;</mtext><mtext>&#160;perfect square&#160;before prime&#160;</mtext></mfrac></mfenced><mo>=</mo><mfrac><mrow><mstyle displaystyle=\"true\"><mfrac><mn>4</mn><mn>36</mn></mfrac></mstyle><mo>+</mo><mstyle displaystyle=\"true\"><mfrac><mn>14</mn><mn>36</mn></mfrac></mstyle><mo>.</mo><mstyle coin is tossed. If head appears then 1 ball is drawn at random from $U_1$ and put into $U_2$. However, if tail appears then 2 balls are drawn at random from $U_1$ and put into $U_2$. Now, 1 ball is drawn at random from $U_2$.<strong>Question:</strong>\nThe probability of the drawn ball from $U_2$ being white is", "image": null}, "options": [{"id": "AhSV8", "text": "\n$\\frac{13}{30}$\n", "image": null, "isCorrect": false}, {"id": "Wd5i3", "text": "\n$\\frac{23}{30}$\n", "image": null, "isCorrect": true}, {"id": "VBdYC", "text": "\n$\\frac{19}{30}$\n", "image": null, "isCorrect": false}, {"id": "ccZGN", "text": "\n$\\frac{11}{30}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Now, probability of the drawn ball from $\\mathrm{V}_2$ being white is\n$$\n\\Rightarrow P \\text { (white/ } V_2 \\text { ) }\n$$\n\n$$\n\\begin{aligned}\n& \\left.\\Rightarrow P \\text { (white/ } V_2\\right) \\\\\n& =P(H) \\cdot\\left\\{\\frac{{ }^3 C_1}{{ }^5 C_1} \\times \\frac{{ }^2 C_1}{{ }^2 C_1}+\\frac{{ }^2 C_1}{{ }^5 C_1} \\times \\frac{{ }^1 C_1}{{ }^2 C_1}\\right\\} \\\\\n& +P(T)\\left\\{\\frac{{ }^3 C_2}{{ }^5 C_2} \\times \\frac{{ }^3 C_2}{{ }^3 C_2}+\\frac{{ }^2 C_2}{{ }^5 C_2} \\times \\frac{{ }^1 C_1}{{ }^3 C_2}\\right. \\\\\n& \\left.+\\frac{{ }^3 C_1 \\cdot{ }^2 C_1}{{ }^5 C_2} \\times \\frac{{ }^2 C_1}{{ }^3 C_2}\\right\\} \\\\\n& \\text { Now, } P\\left(\\text { white } / V_2\\right)=\\frac{1}{2}\\left\\{\\frac{3}{5} \\times 1+\\frac{2}{5} \\times \\frac{1}{2}\\right\\} \\\\\n& +\\frac{1}{2}\\left\\{\\frac{3}{10} \\times 1+\\frac{1}{10} \\times \\frac{1}{3}+\\frac{6}{10} \\times \\frac{2}{3}\\right\\}=\\frac{23}{30} \\\\\n&\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169f4f23ac7d519f9affc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}], "question": {"text": "<strong>Paragraph:</strong>\nA fair die is tossed repeatedly until a six is obtained. Let $X$ denotes the number of tosses required.<strong>Question:</strong>\nThe conditional probability that $X \\geq 6$ given $X>3$ equals", "image": null}, "options": [{"id": "TXZ8d", "text": "\n$\\frac{125}{216}$\n", "image": null, "isCorrect": false}, {"id": "eiOAl", "text": "\n$\\frac{25}{216}$\n", "image": null, "isCorrect": false}, {"id": "CUugx", "text": "\n$\\frac{5}{36}$\n", "image": null, "isCorrect": false}, {"id": "LTGLO", "text": "\n$\\frac{25}{36}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$P((X \\geq 6) /(X>3))$\n\n$$\n\\begin{aligned}\n& =\\frac{P((X>3) /(X \\geq 6)) \\cdot P(X \\geq 6)}{P(X>3)} \\\\\n& =\\frac{1 \\cdot\\left[\\left(\\frac{5}{6}\\right)^5 \\cdot \\frac{1}{6}+\\left(\\frac{5}{6}\\right)^6 \\cdot \\frac{1}{6}+\\ldots \\infty\\right]}{\\left[\\left(\\frac{5}{6}\\right)^3 \\cdot \\frac{1}{6}+\\left(\\frac{5}{6}\\right)^4 \\cdot \\frac{1}{6}+\\ldots \\infty\\right]}=\\frac{25}{36} \\\\\n&\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169e5f23ac7d519f9af77", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c42", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 1)", "title": "JEE Advanced 2008 (Paper 1)"}], "question": {"text": "Consider the system of equations\nwhere $\\quad a, b, c, d \\in\\{0,1\\}$\nStatement 1 The probability that the system of equations has a unique solution, is $3 / 8$.\nStatement 2 The probability that the system of equations has a solution, is 1 .", "image": null}, "options": [{"id": "ENPmH", "text": "\nStatement 1 is true, Statement 2 is true, Statement 2 is a correct explanation for Statement 1.\n", "image": null, "isCorrect": false}, {"id": "Vjtxk", "text": "\nStatement 1 is true, Statement 2 is true, Statement 2 is not a correct explanation for Statement 1.\n", "image": null, "isCorrect": true}, {"id": "lMwRt", "text": "\nStatement 1 is true, Statement 2 is false.\n", "image": null, "isCorrect": false}, {"id": "hY73h", "text": "\nStatement 1 is false, Statement 2 is true", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The number of all possible deteminants of the form\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/miiF1S9q7HSANsbUETCrPwiWfrn8s-gtqeJ3Wn4bUkI.original.fullsize.png\"><br>\n\nOut of which only 10 determinants given by<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/4W-k0G-nLAT2todHF1RbeMvEgzAQgzuWF7dVWZeueic.original.fullsize.png\"><br>\n\nvanish and remaining six determinants have non-zero values.\nHence, the required probability $=\\frac{6}{16}=\\frac{3}{8}$\n$\\Rightarrow$ Statement 1 is correct.\nStatement 2 is also correct as the homogeneous equations have always a solution and Statement 2 is not a correct explanation of Statement 1.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c42", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 1)", "title": "JEE Advanced 2008 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169ddf23ac7d519f9af2e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c41", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 2)", "title": "JEE Advanced 2007 (Paper 2)"}], "question": {"text": "Let $E^c$ denotes the complement of an event $E$. Let $E, F, G$ be pairwise independent events with $P(G)>0$ and $P(E \\cap F \\cap G)=0$. Then, $P\\left(E^c \\cap F^c \\mid G\\right)$ equals", "image": null}, "options": [{"id": "FZZxV", "text": "\n$P\\left(E^c\\right)+P\\left(F^c\\right)$\n", "image": null, "isCorrect": false}, {"id": "CzAky", "text": "\n$P\\left(E^c\\right)-P\\left(F^c\\right)$\n", "image": null, "isCorrect": false}, {"id": "l6j11", "text": "\n$P\\left(E^c\\right)-P(F)$\n", "image": null, "isCorrect": true}, {"id": "BIhnJ", "text": "\n$P(E)-P\\left(F^c\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\text { } \\begin{aligned}\nP\\left(\\frac{E^c \\cap F^c}{G}\\right) & =\\frac{P\\left(E^c \\cap F^c \\cap G\\right)}{P(G)} \\\\\n& =\\frac{P(G)-P(E \\cap G)-P(G \\cap F)}{P(G)} \\\\\n& =\\frac{P(G)[1-P(E)-P(F)]}{P(G)} \\\\\n& =1-P(E)-P(F) \\\\\n& =P\\left(E^c\\right)-P(F) .\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c41", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 2)", "title": "JEE Advanced 2007 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169d6f23ac7d519f9aeef", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}], "question": {"text": "Let $H_1, H_2, \\ldots, H_n$ be mutually exclusive events with $P\\left(H_i\\right)>0, i=1,2, \\ldots, n$. Let $E$ be any other event with $0 < P(E) < 1$.\nStatement I $P\\left(H_i / E\\right)>P\\left(E / H_i\\right) P\\left(H_i\\right)$ for $i=1,2, \\ldots, n$.\nStatement II $\\sum_{i=1}^n P\\left(H_i\\right)=1$", "image": null}, "options": [{"id": "hBpEl", "text": "\nStatement I is true, Statement II is true; Statement II is a correct explanation for Statement I\n", "image": null, "isCorrect": false}, {"id": "eG456", "text": "\nStatement I is true, Statement II is true; Statement II is not a correct explanation for Statement II\n", "image": null, "isCorrect": false}, {"id": "B4BDD", "text": "\nStatement I is true, Statement II is false\n", "image": null, "isCorrect": false}, {"id": "nLbP4", "text": "\nStatement I is false, Statement II is true", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Statement : I If $P\\left(H_i \\cap E\\right)=0$ for some $i$, then\n$$\nP\\left(\\frac{H_i}{E}\\right)=P\\left(\\frac{E}{H_i}\\right)=0\n$$\nIf $P\\left(H_i \\cap E\\right) \\neq 0$ for $\\forall i=1,2, \\ldots . n$, then\n$$\n\\begin{aligned}\nP\\left(\\frac{H_i}{E}\\right) & =\\frac{P\\left(H_i \\cap E\\right)}{P\\left(H_i\\right)} \\times \\frac{P\\left(H_i\\right)}{P(E)} \\\\\n& \\left.=\\frac{P\\left(\\frac{E}{H_i}\\right) \\times P\\left(H_i\\right)}{P(E)}>P\\left(\\frac{E}{H_i}\\right) \\cdot P\\left(H_i\\right) \\quad \\text { [as } 0 < P(E) < 1\\right]\n\\end{aligned}\n$$\nHence, Statement I may not always be true.\nStatement II\nClearly, $H_1 \\cup H_2 \\cup \\ldots . \\cup H_n=S$ (sample space)\n$$\n\\Rightarrow \\quad P\\left(H_1\\right)+P\\left(H_2\\right)+\\ldots+P\\left(H_n\\right)=1 .\n$$\nHence, Statement II is true.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169d6f23ac7d519f9aeeb", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}], "question": {"text": "One Indian and four American men and their wives are to be seated randomly around a circular table. Then, the conditional probability that the Indian man is seated adjacent to his wife given that each American man is seated adjacent to his wife, is", "image": null}, "options": [{"id": "8TEXZ", "text": "\n$\\frac{1}{2}$\n", "image": null, "isCorrect": false}, {"id": "mzhfG", "text": "\n$\\frac{1}{3}$\n", "image": null, "isCorrect": false}, {"id": "awtwr", "text": "\n$\\frac{2}{5}$\n", "image": null, "isCorrect": true}, {"id": "ZmbDq", "text": "\n$\\frac{1}{5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $E=$ event when each American man is seated adjacent to his wife and $A=$ event when Indian man is seated adjacent to his wife.\nNow, $n(A \\cap E)=(4 !) \\times(2 !)^5$\nEven when each American man is seated adjacent to his wife.\nAgain\n$$\n\\begin{aligned}\nn(E) & =(5 !) \\times(2 !)^4 \\\\\nP\\left(\\frac{A}{E}\\right) & =\\frac{n(A \\cap E)}{n(E)} \\\\\n& =\\frac{(4 !) \\times(2 !)^5}{(5 !) \\times(2 !)^4}=\\frac{2}{5}\n\\end{aligned}\n$$\n$$\n\\Rightarrow \\quad P\\left(\\frac{A}{E}\\right)=\\frac{n(A \\cap E)}{n(E)}\n$$\nALITER\nFixing four American couples and one Indian man in between any two couples, we have 5 different ways in which his wife can be seated, of which 2 cases are favourable. $\\therefore$ Required probability $=\\frac{2}{5}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169cff23ac7d519f9aeac", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}], "question": {"text": "<strong>Paragraph:</strong>\nThere are $n$ urns each containing $(n+1)$ balls such that the ith urn contains $i$ white balls and $(n+1-i)$ red balls. Let $u_i$ be the event of selecting ith urn, $i=1,2,3, \\ldots, n$ and $W$ denotes the event of getting a white balls.<strong>Question:</strong>\nIf $n$ is even and $E$ denotes the event of choosing even numbered urn $\\left(P\\left(u_i\\right)=\\frac{1}{n}\\right)$, then the value of $P(W / E)$ is", "image": null}, "options": [{"id": "Nu9pl", "text": "\n$\\frac{n+2}{2 n+1}$\n", "image": null, "isCorrect": false}, {"id": "yA5ZB", "text": "\n$\\frac{n+2}{2(n+1)}$\n", "image": null, "isCorrect": true}, {"id": "tqFsT", "text": "\n$\\frac{n}{n+1}$\n", "image": null, "isCorrect": false}, {"id": "nwyVw", "text": "\n$\\frac{1}{n+1}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$P(W / E)=\\frac{2+4+6+\\ldots}{\\frac{n(n+1)}{2}}=\\frac{n+2}{2(n+1)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169cff23ac7d519f9aeab", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}], "question": {"text": "<strong>Paragraph:</strong>\nThere are $n$ urns each containing $(n+1)$ balls such that the ith urn contains $i$ white balls and $(n+1-i)$ red balls. Let $u_i$ be the event of selecting ith urn, $i=1,2,3, \\ldots, n$ and $W$ denotes the event of getting a white balls.<strong>Question:</strong>\nIf $P\\left(u_i\\right)=c$, where $c$ is a constant, then $P\\left(u_i / W\\right)$ is equal to", "image": null}, "options": [{"id": "ZEesU", "text": "\n$\\frac{2}{n+1}$\n", "image": null, "isCorrect": true}, {"id": "2JroW", "text": "\n$\\frac{1}{n+1}$\n", "image": null, "isCorrect": false}, {"id": "2ABai", "text": "\n$\\frac{n}{n+1}$\n", "image": null, "isCorrect": false}, {"id": "8WkQ1", "text": "\n$\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$P\\left(\\frac{u_i}{W}\\right)=\\frac{\\frac{n}{n+1}}{\\frac{\\Sigma i}{n+1}}=\\frac{2}{n+1}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64b16ae3f23ac7d519f9b929", "title": "Independent Events", "totalQuestions": 6, "questions": [{"_id": "64b16a7bf23ac7d519f9b4ce", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf82f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2019-04-30T14:00:00.000Z", "isVisi "type": "multipleCorrect", "level": 2, "question": {"text": "Let $X$ and $Y$ be two events such that $P(X \\mid Y)=\\frac{1}{2}$, $P(Y / X)=\\frac{1}{3}$ and $P(X \\cap Y)=\\frac{1}{6}$. Which of the following is (are) correct?", "image": null}, "options": [{"id": "WoUzt", "text": "$P(X \\cup Y)=\\frac{2}{3}$", "isCorrect": true, "image": null}, {"id": "ycZBO", "text": "$X$ and $Y$ are independent", "isCorrect": true, "image": null}, {"id": "E0t4Z", "text": "$X$ and $Y$ are not independent", "isCorrect": false, "image": null}, {"id": "ZVCbZ", "text": "$P\\left(X^{c} \\cap Y\\right)=\\frac{1}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\because P(X / Y)=\\frac{P(X \\cap Y)}{P(Y)} \\Rightarrow \\frac{1}{2}=\\frac{1 / 6}{P(Y)} \\Rightarrow P(Y)=\\frac{1}{3}$\r\n\r\nSimilarly, $\\mathrm{P}(Y / X)=\\frac{P(X \\cap Y)}{P(X)}$\r\n\r\n$\\Rightarrow \\frac{1}{3}=\\frac{1 / 6}{P(X)} \\Rightarrow P(X)=\\frac{1}{2}$\r\n\r\n(a) $P(X \\cup Y)=P(X)+P(Y)-P(X \\cap Y)=\\frac{1}{2}+\\frac{1}{3}-\\frac{1}{6}=\\frac{2}{3}$\r\n\r\n$\\therefore$ (a) is true.\r\n\r\n(b) $\\because P(X \\cap Y)=P(X) P(Y)$\r\n\r\n$\\Rightarrow X$ and $Y$ are independent events.\r\n\r\n$\\therefore$ (b) is true.\r\n\r\nBut (c) is not true.\r\n\r\n(d) $\\mathrm{P}\\left(X^{C} \\cap Y\\right)=P\\left(X^{C}\\right) \\times P(Y)=\\frac{1}{2} \\times \\frac{1}{3}=\\frac{1}{6}$\r\n\r\n$\\therefore$ (d) is not true.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a1df23ac7d519f9b17b", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}], "type": "multipleCorrect", "level": 3, "question": {"text": "A ship is fitted with three engines $E_{1}, E_{2}$ and $E_{3}$. The engines function independently of each other with respective probabilities $\\frac{1}{2}, \\frac{1}{4}$ and $\\frac{1}{4}$. For the ship to be operational at least two of its engines must function. Let $X$ denote the event that the ship is operational and let $X_{1}, X_{2}$ and $X_{3}$ denote respectively the events that the engines $E_{1}, E_{2}$ and $E_{3}$ are functioning. Which of the following is(are) true?", "image": null}, "options": [{"id": "Onfp6", "text": "$P\\left[X_{1}^{c} \\mid X\\right]=\\frac{3}{16}$", "isCorrect": false, "image": null}, {"id": "Nlbzy", "text": "$P$ [Exactly two engines of the ship are functioning $[X]=\\frac{7}{8}$", "isCorrect": true, "image": null}, {"id": "AKvSq", "text": "$P\\left[X \\mid X_{2}\\right]=\\frac{5}{16}$", "isCorrect": false, "image": null}, {"id": "U5qj8", "text": "$P\\left[X \\mid X_{1}\\right]=\\frac{7}{16}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given that $P\\left(X_{1}\\right)=\\frac{1}{2}, \\mathrm{P}\\left(X_{2}\\right)=\\frac{1}{4}, \\mathrm{P}\\left(X_{3}\\right)=\\frac{1}{4}$ $P(X)=P$ (at least 2 engines are functioning)\r\n\r\n$\\begin{aligned}=P\\left(X_{1} \\cap X_{2}\\right.&\\left.\\cap X_{3}^{C}\\right)+P\\left(X_{1} \\cap X_{2}^{C} \\cap X_{3}\\right) \\\\ &+P\\left(X_{1}^{C} \\cap X_{2} \\cap X_{3}\\right)+P\\left(X_{1} \\cap X_{2} \\cap X_{3}\\right) \\end{aligned}$\r\n\r\n$=\\frac{1}{2} \\times \\frac{1}{4} \\times \\frac{3}{4}+\\frac{1}{2} \\times \\frac{3}{4} \\times \\frac{1}{4}+\\frac{1}{2} \\times \\frac{1}{4} \\times \\frac{1}{4}+\\frac{1}{2} \\times \\frac{1}{4} \\times \\frac{1}{4}=\\frac{1}{4}$\r\n\r\n(a) $P\\left(X_{1}^{C} / X\\right)=\\frac{P\\left(X_{1}^{C} \\cap X\\right)}{P(X)}=\\frac{P\\left(X_{1}^{C} \\cap X_{2} \\cap X_{3}\\right)}{P(X)}$\r\n\r\n$=\\frac{\\frac{1}{2} \\times \\frac{1}{4} \\times \\frac{1}{4}}{\\frac{1}{4}}=\\frac{1}{8}$\r\n\r\n$\\therefore$ (a) is not true.\r\n\r\n(b) $P$ [Exactly two engines are functioning $/ X]$\r\n\r\n$=\\frac{P[(\\text { Exactly two engines are functioning }) \\cap X]}{P(X)}$\r\n\r\n$=\\frac{P\\left(X_{1}^{C} \\cap X_{2} \\cap X_{3}\\right)+P\\left(X_{1} \\cap X_{2}^{C} \\cap X_{3}\\right)+P\\left(X_{1} \\cap X_{2} \\cap X_{3}^{C}\\right)}{P(X)}$\r\n\r\n$=\\frac{\\frac{1}{2} \\times \\frac{1}{4} \\times \\frac{1}{4}+\\frac{1}{2} \\times \\frac{3}{4} \\times \\frac{1}{4}+\\frac{1}{2} \\times \\frac{1}{4} \\times \\frac{3}{4}}{\\frac{1}{4}}=\\frac{7}{8}$\r\n\r\n$\\therefore$ (b) is true.\r\n\r\n(c) $P\\left(X / X_{2}\\right)=\\frac{P\\left(X \\cap X_{2}\\right)}{P\\left(X_{2}\\right)}$\r\n\r\n$=\\frac{P\\left(X_{1} \\cap X_{2} \\cap X_{3}\\right)+P\\left(X_{1}^{C} \\cap X_{2} \\cap X_{3}\\right)+P\\left(X_{1} \\cap X_{2} \\cap X_{3}^{C}\\right)}{P\\left(X_{2}\\right)}$\r\n\r\n$=\\frac{\\frac{1}{2} \\times \\frac{1}{4} \\times \\frac{1}{4}+\\frac{1}{2} \\times \\frac{1}{4} \\times \\frac{1}{4}+\\frac{1}{2} \\times \\frac{1}{4} \\times \\frac{3}{4}}{\\frac{1}{4}}=\\frac{5}{8}$\r\n\r\n$\\therefore$ (c) is not true.\r\n\r\n(d) $P\\left(X / X_{1}\\right)=\\frac{P\\left(X \\cap X_{1}\\right)}{P\\left(X_{1}\\right)}$\r\n\r\n$=\\frac{P\\left(X_{1} \\cap X_{2} \\cap X_{3}\\right)+P\\left(X_{1} \\cap X_{2}^{C} \\cap X_{3}\\right)+P\\left(X_{1} \\cap X_{2} \\cap X_{3}^{C}\\right)}{P\\left(X_{1}\\right)}$\r\n\r\n$=\\frac{\\frac{1}{2} \\times \\frac{1}{4} \\times \\frac{1}{4}+\\frac{1}{2} \\times \\frac{3}{4} \\times \\frac{1}{4}+\\frac{1}{2} \\times \\frac{1}{4} \\times \\frac{3}{4}}{\\frac{1}{2}}=\\frac{7}{16}$\r\n\r\n$\\therefore$ (d) is true.", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a08f23ac7d519f9b0b6", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c47", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 2)", "title": "JEE Advanced 2010 (Paper 2)"}], "question": {"text": "A signal which can be green or red with probability $\\frac{4}{5}$ and $\\frac{1}{5}$ respectively, is received by station $A$ and then transmitted to station B. The probability of each station receiving the signal correctly is $\\frac{3}{4}$. If the signal received at station $B$ is green, then the probability that the original signal green is", "image": null}, "options": [{"id": "fiVQt", "text": "\n$\\frac{3}{5}$\n", "image": null, "isCorrect": false}, {"id": "rI5sE", "text": "\n$\\frac{6}{7}$\n", "image": null, "isCorrect": false}, {"id": "YeTKA", "text": "\n$\\frac{20}{23}$\n", "image": null, "isCorrect": true}, {"id": "5lEFn", "text": "\n$\\frac{9}{20}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "From the tree-diagram it follows that\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/l4-0jmsEW2b3RYr9-D6RJ2U3VsRy7evmHsKptiune_4.original.fullsize.png\"><br>\n$$\n\\begin{gathered}\nP\\left(B_G \\mid G\\right)=\\frac{10}{16}=\\frac{5}{8} \\\\\n\\therefore \\quad P\\left(B_G \\cap G\\right)=\\frac{5}{8} \\times \\frac{4}{5}=\\frac{1}{2} \\\\\nP\\left(G \\mid B_G\\right)=\\frac{\\frac{1}{2}}{P\\left(B_G\\right)}=\\frac{1}{2} \\times \\frac{80}{46}=\\frac{20}{23}\n\\end{gathered}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c47", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 2)", "title": "JEE Advanced 2010 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169ecf23ac7d519f9afb2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}], "question": {"text": "An experiment has 10 equally likely outcomes. Let $A$ and $B$ be two non-empty events of the experiment. If $A$ consists of 4 outcomes, the number of outcomes that $B$ must have so that $A$ and $B$ are independent, is", "image": null}, "options": [{"id": "3Wbs3", "text": "\n2,4 or 8\n", "image": null, "isCorrect": false}, {"id": "RC1FA", "text": "\n3,6 or 9\n", "image": null, "isCorrect": false}, {"id": "SvHzA", "text": "\n4 or 8\n", "image": null, "isCorrect": false}, {"id": "17U8c", "text": "\n5 or 10", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$P(A)=\\frac{2}{5}$\nFor independent events,\n$$\n\\begin{aligned}\n& P(A \\cap B)=P(A) P(B) \\Rightarrow P(A \\cap B) \\leq \\frac{2}{5} \\\\\n& \\Rightarrow P(A \\cap B)=\\frac{1}{10}, \\frac{2}{10}, \\frac{3}{10}, \\frac{4}{10} \\\\\n& \\text { (i) } P(A \\cap B)=\\frac{1}{10} \\\\\n& \\Rightarrow P(A) \\cdot P(B)=\\frac{1}{10} \\\\\n& \\Rightarrow \\quad P(B)=\\frac{1}{10} \\times \\frac{5}{2}=\\frac{1}{4}, \\text { not possible. } \\\\\n& \\text { (ii) } P(A \\cap B)=\\frac{2}{10} \\Rightarrow \\frac{2}{5} \\times P(B)=\\frac{2}{10} \\\\\n& \\Rightarrow \\quad P(B)=\\frac{5}{10}, \\text { outcomes of } B=5\n\\end{aligned}\n$$\n\n$$\n\\text { (iii) } \\begin{aligned}\n& P(A \\cap B)=\\frac{3}{10} \\Rightarrow P(A) \\cdot P(B)=\\frac{3}{10} \\\\\n& \\Rightarrow \\quad \\frac{2}{5} \\times P(B)=\\frac{3}{10} \\\\\n& P(B)=\\frac{3}{4}, \\text { not possible }\n\\end{aligned}\n$$\n\n$$\n\\text { (iv) } \\begin{aligned}\n& P(A \\cap B)=\\frac{4}{10} \\\\\n\\Rightarrow & P(A) \\cdot P(B)=\\frac{4}{10} \\\\\n\\Rightarrow & P(B)=1, \\text { outcomes of } B=10 .\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64b16ae3f23ac7d519f9b92a", "title": "Baye's Theorem", "totalQuestions": 8, "questions": [{"_id": "685102c26bba689a3eb09ca9", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "684c67d769037fad219cb0c2", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 2)", "title": "JEE Advanced 2025 (Paper 2)"}], "question": {"text": "A factory has a total of three manufacturing units, $M_1, M_2$, and $M_3$, which produce bulbs independent of each other. The units $M_1, M_2$, and $M_3$ produce bulbs in the proportions of 2:2:1, respectively. It is known that $20 \\%$ of the bulbs produced in the factory are defective. It is also known that, of all the bulbs produced by $M_1, 15 \\%$ are defective. Suppose that, if a randomly chosen bulb produced in the factory is found to be defective, the probability that it was produced by $M_2$ is $\\frac{2}{5}$.\nIf a bulb is chosen randomly from the bulbs produced by $M_3$, then the probability that it is defective is ____.", "image": null}, "options": [], "correctValue": "0.3", "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/97BQBuYdwZ1cFsl6KOxQicZCxZeXrOpwtVO_jqqu2jk.original.fullsize.png\"><br>Now given probability\n$\\begin{aligned}\n& P\\left(\\frac{\\text { Produced by } \\mathrm{M}_2}{\\text { defective }}\\right)=\\frac{\\frac{40}{100} \\times \\frac{14-\\mathrm{x}}{40}}{\\frac{20}{100}}=\\frac{2}{5} \\\\\n& \\Rightarrow \\frac{14-\\mathrm{x}}{40}=\\frac{1}{5} \\\\\n& \\Rightarrow 14-\\mathrm{x}=8 \\\\\n& \\Rightarrow \\mathrm{x}=6\n\\end{aligned}$\nSo, the required probability\n$=\\frac{6}{20}=0.3$", "image": null}, "videoSolution": {"videoId": "6b19bbfac1294c3e9e84f5ba9c3a33d6", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/S2u6dXqZpUXUv.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/S2u6dXqZpUXUv.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "684c67d769037fad219cb0c2", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 2)", "title": "JEE Advanced 2025 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66965dc9d603121f43a3d541", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "66965789b31faf98fda8fef9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 1)", "title": "JEE Advanced 2024 (Paper 1)"}], "question": {"text": "A student appears for a quiz consisting of only true-false type questions and answers all the questions. The student knows the answers of some questions and guesses the answers for the remaining questions. Whenever the student knows the answer of a question, he gives the correct answer. Assume that the probability of the student giving the correct answer for a question, given that he has guessed it, is $\\frac{1}{2}$. Also assume that the probability of the answer for a question being guessed, given that the student's answer is correct, is $\\frac{1}{6}$. Then the probability that the student knows the answer of a randomly chosen question is", "image": null}, "options": [{"id": "pTc6v", "text": "$\\frac{1}{12}$", "image": null, "isCorrect": false}, {"id": "S7X8K", "text": "$\\frac{1}{7}$", "image": null, "isCorrect": false}, {"id": "NERxP", "text": "$\\frac{5}{7}$", "image": null, "isCorrect": true}, {"id": "AZG3l", "text": "$\\frac{5}{12}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{C} \\rightarrow$ Correct\n$\\mathrm{G} \\rightarrow$ Guess\n$\\mathrm{K} \\rightarrow$ Knows\n$\\begin{array}{ll}\\mathrm{P}\\left(\\frac{\\mathrm{C}}{\\mathrm{G}}\\right)=\\frac{1}{2} \\quad, \\quad \\mathrm{P}\\left(\\frac{\\mathrm{C}}{\\mathrm{K}}\\right)=1 \\\\\\mathrm{P}\\left(\\frac{\\mathrm{G}}{\\mathrm{C}}\\right)=\\frac{1}{6}\\end{array}$\n$\\begin{aligned} & \\text { Let required probability }=\\mathrm{x} \\\\ & \\therefore \\mathrm{P}\\left(\\frac{\\mathrm{G}}{\\mathrm{C}}\\right)=\\frac{(1-\\mathrm{x}) \\mathrm{P}\\left(\\frac{\\mathrm{C}}{\\mathrm{G}}\\right)}{(1-\\mathrm{x}) \\mathrm{P}\\left(\\frac{\\mathrm{C}}{\\mathrm{G}}\\right)+\\mathrm{x} \\cdot \\mathrm{P}\\left(\\frac{\\mathrm{C}}{\\mathrm{K}}\\right)} \\\\ & \\frac{1}{6}=\\frac{(1-\\mathrm{x})\\left(\\frac{1}{2}\\right)}{(1-\\mathrm{x})\\left(\\frac{1}{2}\\right)+(\\mathrm{x})(1)} \\\\ & \\Rightarrow \\mathrm{x}=\\frac{5}{7} \\Rightarrow \\text { Option (3) is correct. }\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "7f61044f208944d1951e174428ce9428", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/1TAjBMc8vMV0Y.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/1TAjBMc8vMV0Y.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "66965789b31faf98fda8fef9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 1)", "title": "JEE Advanced 2024 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16aa0f23ac7d519f9b61e", "previousYearPapers": [{"_id": "632c83583e3fd59bda92e46d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 2)", "title": "JEE Advanced 2022 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Suppose that<br />Box-I contains <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>8</mn></math>&nbsp;red, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> blue and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>5</mn></math> green balls,<br />Box-ll contains <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>24</mn></math> red, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>9</mn></math> blue and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>15</mn></math> green balls,<br />Box-III contains <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> blue, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>12</mn></math> green and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math> yellow balls,<br />Box-IV contains <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn></math> green, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>16</mn></math> orange and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>6</mn></math> white balls.<br />A ball is chosen randomly from Box-l; call this ball <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math>. If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math> is red then a ball is chosen randomly from Box-ll, if <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math> is blue then a ball is chosen randomly from Box-III, and if <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>b</mi></math> is green then a ball is chosen randomly from Box-IV. The conditional probability of the event &#39;one of the chosen balls is white&#39; given that the event &#39;at least one of the chosen balls is green&#39; has happened, is equal to", "image": null}, "options": [{"id": "ae4aY", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>15</mn><mn>256</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "CY9N0", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>16</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "upuLO", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>5</mn><mn>52</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "6vFLK", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>8</mn></mfrac></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<blockquote><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mtext>Red&#160;from&#160;Box</mtext><mo>&#160;</mo><mi mathvariant=\"normal\">I</mi></mrow></mfenced><mo>=</mo><mfrac><mn>8</mn><mn>16</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mtext>Blue&#160;from&#160;Box</mtext><mo>&#160;</mo><mi mathvariant=\"normal\">I</mi></mrow></mfenced><mo>=</mo><mfrac><mn>3</mn><mn>16</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mfenced><mrow><mtext>Green&#160;from&#160;Box</mtext><mo>&#160;</mo><mi mathvariant=\"normal\">I</mi></mrow></mfenced><mo>=</mo><mfrac><mn>10</mn><m
