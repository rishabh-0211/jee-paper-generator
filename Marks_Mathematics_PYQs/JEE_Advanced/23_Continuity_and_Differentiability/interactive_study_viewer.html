  <script>
    const data = {"index": 23, "chapterId": "61602558b3ddd6290d8a872c", "chapter": "Continuity and Differentiability", "exam": "JEE Advanced", "subject": "Mathematics", "totalTopics": 2, "totalQuestions": 22, "downloadTime": "2026-10-08 20:36:27", "topics": [{"index": 1, "topicId": "64b16ae1f23ac7d519f9b917", "title": "Continuity", "totalQuestions": 8, "questions": [{"_id": "6a0be51244d287c9361e5cb5", "type": "numerical", "question": {"text": "For a real number $\\alpha$, let $[\\alpha]$ denote the greatest integer less than or equal to $\\alpha$. For a finite set $S$, let $|S|$ denote the number of elements in the set $S$.<br>Consider the functions $f : (-3, 3) \\rightarrow (-\\infty, \\infty)$ and $g : (-3, 3) \\rightarrow (-\\infty, \\infty)$ defined by<br>$f(x) = [x^3]\\log_e(1 + \\sin^2(\\pi(x - [x])))$<br>and<br>$g(x) = x^3 \\sin^2(\\pi \\log_e(1 + x - [x]))$.<br>Let<br>$A = \\{x \\in (-3, 3) : f \\text{ is discontinuous at } x\\}$<br>and<br>$B = \\{x \\in (-3, 3) : g \\text{ is discontinuous at } x\\}$.<br>Then the value of $|A| + 2|B| - |A \\cap B|$ is ___________.", "image": null}, "options": [], "correctValue": "56", "solution": {"text": "For the function $f(x) = [x^3]\\log_e(1 + \\sin^2(\\pi(x - [x])))$, we can simplify the argument of the sine function. Since $[x]$ is an integer, $\\sin(\\pi(x - [x])) = \\sin(\\pi x - \\pi[x]) = \\pm \\sin(\\pi x)$. Thus, $\\sin^2(\\pi(x - [x])) = \\sin^2(\\pi x)$.<br><br>The function $f(x)$ can be rewritten as $f(x) = [x^3]\\log_e(1 + \\sin^2(\\pi x))$.<br>The term $\\log_e(1 + \\sin^2(\\pi x))$ is continuous everywhere. The term $[x^3]$ has jump discontinuities where $x^3$ is an integer. For $x \\in (-3, 3)$, $x^3 \\in (-27, 27)$. The integer values of $x^3$ in this interval are $k \\in \\{-26, -25, \\dots, 26\\}$, which gives $53$ points of the form $x = k^{1/3}$.<br><br>At these points, $[x^3]$ is discontinuous. For $f(x)$ to be continuous at $x = k^{1/3}$, the continuous factor must be zero:<br>$\\log_e(1 + \\sin^2(\\pi x)) = 0 \\implies \\sin^2(\\pi x) = 0 \\implies x$ is an integer.<br>The integers in $(-3, 3)$ are $-2, -1, 0, 1, 2$. Their cubes are $-8, -1, 0, 1, 8$, which are $5$ values among the $53$ points. At these $5$ points, $f(x)$ is continuous. At the remaining $53 - 5 = 48$ points, $f(x)$ is discontinuous.<br>Thus, $|A| = 48$.<br><br>For the function $g(x) = x^3 \\sin^2(\\pi \\log_e(1 + x - [x]))$, we can write $x - [x] = \\{x\\}$, which is the fractional part of $x$.<br>The function $g(x) = x^3 \\sin^2(\\pi \\log_e(1 + \\{x\\}))$ is continuous everywhere except possibly at the integers, where $\\{x\\}$ is discontinuous.<br>The integers in $(-3, 3)$ are $c \\in \\{-2, -1, 0, 1, 2\\}$.<br>Let's check the continuity at $x = c$:<br>Right-hand limit ($x \\to c^+$): $\\{x\\} \\to 0$, so $g(x) \\to c^3 \\sin^2(\\pi \\log_e 1) = 0$.<br>Left-hand limit ($x \\to c^-$): $\\{x\\} \\to 1$, so $g(x) \\to c^3 \\sin^2(\\pi \\log_e 2)$.<br><br>For $g(x)$ to be continuous at $x = c$, we must have $c^3 \\sin^2(\\pi \\log_e 2) = 0$. Since $\\log_e 2 \\approx 0.693$, $\\pi \\log_e 2$ is not an integer multiple of $\\pi$, meaning $\\sin^2(\\pi \\log_e 2) \\neq 0$. Therefore, we must have $c^3 = 0 \\implies c = 0$.<br>So, $g(x)$ is continuous at $x = 0$ and discontinuous at $x \\in \\{-2, -1, 1, 2\\}$.<br>Thus, $B = \\{-2, -1, 1, 2\\}$ and $|B| = 4$.<br><br>Since $A$ contains no integers and $B$ contains only integers, $A \\cap B = \\emptyset$, which means $|A \\cap B| = 0$.<br><br>Finally, we calculate the required value:<br>$|A| + 2|B| - |A \\cap B| = 48 + 2(4) - 0 = 48 + 8 = 56$.<br><br>Answer: $56$", "image": null}, "level": 3, "videoSolution": {"videoId": "a024171a4680424aa4dac662784d9d6a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/PCUplh8cHriFK.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/PCUplh8cHriFK.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b43", "title": "JEE Advanced 2026 (Paper 2)", "shortName": "2026 (Paper 2)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b43", "title": "JEE Advanced 2026 (Paper 2)", "shortName": "2026 (Paper 2)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a0be50d44d287c9361e5c81", "type": "numerical", "question": {"text": "Consider the function $f : \\left(-\\dfrac{\\pi}{2}, \\dfrac{\\pi}{2}\\right) \\rightarrow (-\\infty, \\infty)$ defined by<br><br>$f(x) = (|x| + |x - 1|) \\sin x + [x \\sin x]$,<br><br>where $[x \\sin x]$ is the greatest integer less than or equal to $x \\sin x$.<br><br>Let $\\alpha$ be the total number of points in the interval $\\left(-\\dfrac{\\pi}{2}, \\dfrac{\\pi}{2}\\right)$ at which $f$ is NOT continuous, and let $\\beta$ be the total number of points in the interval $\\left(-\\dfrac{\\pi}{2}, \\dfrac{\\pi}{2}\\right)$ at which $f$ is NOT differentiable.<br><br>Then the value of $\\alpha + \\beta$ is ___________.", "image": null}, "options": [], "correctValue": "5", "solution": {"text": "Let $f(x) = g(x) + h(x)$, where $g(x) = (|x| + |x - 1|) \\sin x$ and $h(x) = [x \\sin x]$.<br><br>First, we analyze $h(x) = [x \\sin x]$ on the interval $\\left(-\\dfrac{\\pi}{2}, \\dfrac{\\pi}{2}\\right)$.<br>The function $y = x \\sin x$ is an even function. For $x \\in \\left[0, \\dfrac{\\pi}{2}\\right)$, $x \\sin x$ is strictly increasing. <br>At $x = 0$, $x \\sin x = 0$.<br>As $x \\to \\dfrac{\\pi}{2}$, $x \\sin x \\to \\dfrac{\\pi}{2} \\approx 1.57$.<br>Thus, $x \\sin x \\in [0, 1.57)$ for $x \\in \\left(-\\dfrac{\\pi}{2}, \\dfrac{\\pi}{2}\\right)$.<br>The value of $[x \\sin x]$ will be $0$ when $0 \\le x \\sin x < 1$, and $1$ when $1 \\le x \\sin x < \\dfrac{\\pi}{2}$.<br>Let $x_1 \\in \\left(0, \\dfrac{\\pi}{2}\\right)$ be the unique point where $x_1 \\sin x_1 = 1$. By symmetry, $-x_1$ is the unique point in $\\left(-\\dfrac{\\pi}{2}, 0\\right)$ where $(-x_1) \\sin(-x_1) = 1$.<br>Therefore, $h(x)$ has jump discontinuities at exactly two points: $x = x_1$ and $x = -x_1$.<br>At $x = 0$, $x \\sin x = 0$ and is non-negative in its neighborhood, so $[x \\sin x] = 0$ around $x = 0$, making $h(x)$ continuous and differentiable at $x = 0$.<br><br>Next, we analyze $g(x) = (|x| + |x - 1|) \\sin x$.<br>The absolute value functions have critical points at $x = 0$ and $x = 1$.<br>For $x$ in a small neighborhood of $0$ (specifically $x \\in (-1, 1)$):<br>If $x \\in [0, 1)$, $g(x) = (x - (x - 1)) \\sin x = \\sin x \\Rightarrow g'(0^+) = \\cos 0 = 1$.<br>If $x \\in (-1, 0)$, $g(x) = (-x - (x - 1)) \\sin x = (1 - 2x) \\sin x \\Rightarrow g'(0^-) = -2 \\sin 0 + 1 \\cdot \\cos 0 = 1$.<br>Since $g'(0^+) = g'(0^-)$, $g(x)$ is differentiable at $x = 0$.<br><br>For $x$ in a small neighborhood of $1$:<br>If $x \\in (0, 1]$, $g(x) = \\sin x \\Rightarrow g'(1^-) = \\cos 1$.<br>If $x \\in \\left(1, \\dfrac{\\pi}{2}\\right)$, $g(x) = (x + (x - 1)) \\sin x = (2x - 1) \\sin x \\Rightarrow g'(1^+) = 2 \\sin 1 + 1 \\cdot \\cos 1$.<br>Since $g'(1^-) \\neq g'(1^+)$, $g(x)$ is not differentiable at $x = 1$.<br><br>Now, combining the results for $f(x) = g(x) + h(x)$:<br>1. Discontinuities: $g(x)$ is continuous everywhere. $h(x)$ is discontinuous at $x_1$ and $-x_1$. Thus, $f(x)$ is discontinuous at $2$ points. $\\Rightarrow \\alpha = 2$.<br>2. Non-differentiability: $f(x)$ is not differentiable where it is discontinuous ($x_1$ and $-x_1$). Additionally, at $x = 1$, $h(x)$ is constant ($0$) because $1 \\cdot \\sin 1 \\approx 0.84 < 1$, meaning $h(x)$ is differentiable at $x = 1$. However, $g(x)$ is not differentiable at $x = 1$. Thus, $f(x)$ is not differentiable at $x = 1$.<br>This gives $3$ points of non-differentiability: $-x_1, 1, x_1$. $\\Rightarrow \\beta = 3$.<br><br>Finally, $\\alpha + \\beta = 2 + 3 = 5$.<br><br>Answer: $5$", "image": null}, "level": 3, "videoSolution": {"videoId": "0b2164d5089c419aa9d0012471450ced", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/93A9Ealkt8s7U.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/93A9Ealkt8s7U.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a0be50c44d287c9361e5c7e", "type": "multipleCorrect", "question": {"text": "Let $\\mathbb{R}$ denote the set of all real numbers. Let $f : \\mathbb{R} \\rightarrow \\mathbb{R}$ be an arbitrary function and let $g : \\mathbb{R} \\rightarrow \\mathbb{R}$ be the function defined by<br><br>$g(x) = x f(x)$, for all $x \\in \\mathbb{R}$.<br><br>Then which of the following statements is (are) TRUE?", "image": null}, "options": [{"id": "Olfx4", "text": "The function $g$ is always continuous at $x = 0$", "isCorrect": false, "image": null}, {"id": "ArxZt", "text": "If $f$ is continuous at $x = 0$, then $g$ is differentiable at $x = 0$", "isCorrect": true, "image": null}, {"id": "xrNf4", "text": "If $g$ is differentiable at $x = 0$, then $f$ is continuous at $x = 0$", "isCorrect": false, "image": null}, {"id": "szjwo", "text": "If $g$ is differentiable at $x = 0$, then $\\lim_{x \\to 0} f(x)$ exists", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $g(x) = x f(x)$ for all $x \\in \\mathbb{R}$.<br><br>For option A:<br>Let $f(x) = \\dfrac{1}{x}$ for $x \\neq 0$ and $f(0) = 0$.<br>Then $g(x) = 1$ for $x \\neq 0$ and $g(0) = 0$.<br>$\\lim_{x \\to 0} g(x) = 1 \\neq g(0)$.<br>Thus, $g$ is not necessarily continuous at $x = 0$. Option A is false.<br><br>For option B:<br>The derivative of $g$ at $x = 0$ is given by:<br>$g'(0) = \\lim_{x \\to 0} \\dfrac{g(x) - g(0)}{x - 0} = \\lim_{x \\to 0} \\dfrac{x f(x) - 0}{x} = \\lim_{x \\to 0} f(x)$.<br>If $f$ is continuous at $x = 0$, then $\\lim_{x \\to 0} f(x) = f(0)$.<br>Since $f(0)$ is a finite real number, $g'(0)$ exists and $g$ is differentiable at $x = 0$. Option B is true.<br><br>For option C:<br>Let $f(x) = 0$ for $x \\neq 0$ and $f(0) = 1$.<br>Then $g(x) = 0$ for all $x \\in \\mathbb{R}$.<br>Here, $g$ is differentiable at $x = 0$ with $g'(0) = 0$.<br>However, $\\lim_{x \\to 0} f(x) = 0 \\neq f(0)$, so $f$ is not continuous at $x = 0$. Option C is false.<br><br>For option D:<br>If $g$ is differentiable at $x = 0$, then $g'(0)$ exists.<br>Since $g'(0) = \\lim_{x \\to 0} \\dfrac{g(x) - g(0)}{x} = \\lim_{x \\to 0} f(x)$, the limit $\\lim_{x \\to 0} f(x)$ must exist. Option D is true.<br><br>Answer: If $f$ is continuous at $x = 0$, then $g$ is differentiable at $x = 0$; If $g$ is differentiable at $x = 0$, then $\\lim_{x \\to 0} f(x)$ exists", "image": null}, "level": 2, "videoSolution": {"videoId": "c9d99d485ee844cbac3cec6ec92845a5", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/ggeYy4kesqXq4.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/ggeYy4kesqXq4.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16aaaf23ac7d519f9b67c", "type": "multipleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>:</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mn>1</mn></mrow></mfenced><mo>&#8594;</mo><mi mathvariant=\"normal\">&#8477;</mi></math> be the function defined as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mfenced open=\"[\" close=\"]\"><mrow><mn>4</mn><mi>x</mi></mrow></mfenced><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>[</mo><mi>x</mi><mo>]</mo></math>&nbsp;denotes the greatest integer less than or equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>. Then which of the following is(are) true?", "image": null}, "options": [{"id": "krMpB", "text": "The function <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi></math>&nbsp;is discontinuous exactly at one point in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>)</mo></math>", "image": null, "isCorrect": true}, {"id": "i4Elh", "text": "There is exactly one point in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>)</mo></math>&nbsp;at which the function <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi></math>&nbsp;is continuous but NOT differentiable", "image": null, "isCorrect": true}, {"id": "s0N6f", "text": "The function <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi></math>&nbsp;is NOT differentiable at more than three points in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>)</mo></math>", "image": null, "isCorrect": false}, {"id": "Y4oXz", "text": "The minimum value of the function <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi></math>&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mfrac><mn>1</mn><mn>512</mn></mfrac></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>:</mo><mo>(</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>)</mo><mo>&#8594;</mo><mi mathvariant=\"normal\">&#8477;</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mfenced close=\"]\" open=\"[\"><mrow><mn>4</mn><mi>x</mi></mrow></mfenced><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced></math></p><p>We know that,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mrow><mn>4</mn><mi>x</mi></mrow></mfenced></math>&nbsp;will be discontinuous function at integer points,</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>critical point&#160;</mtext><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>,</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>,</mo><mfrac><mn>3</mn><mn>4</mn></mfrac></math>&nbsp;as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#8712;</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math></p><p>And function will be discontinuous&nbsp;at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac></math>&nbsp;because for&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math>,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mn>2</mn></msup></math>&nbsp;will make the function continuos</p><p>Hence, the function is discontinuous exactly at one point in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mn>1</mn></mrow></mfenced></math>, so option&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>A</mi></mfenced></math>&nbsp;is correct,</p><p>Now,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><mfenced close=\"\" open=\"{\"><mtable><mtr><mtd><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn><mo>&#60;</mo><mi>x</mi><mo>&#60;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mtd></mtr><mtr><mtd><mn>1</mn><mo>&#183;</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>&#8804;</mo><mi>x</mi><mo>&#60;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mtd></mtr><mtr><mtd><mn>2</mn><mo>&#183;</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#8804;</mo><mi>x</mi><mo>&#60;</mo><mfrac><mn>3</mn><mn>4</mn></mfrac></mtd></mtr><mtr><mtd><mn>3</mn><mo>&#183;</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>&#8804;</mo><mi>x</mi><mo>&#60;</mo><mn>1</mn></mtd></mtr></mtable></mfenced></math></p><p>Now differentiating the above function we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>'</mo></msup><mfenced><mi>x</mi></mfenced><mo>=</mo><mfenced open=\"{\" close=\"\"><mtable><mtr><mtd><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn><mo>&#60;</mo><mi>x</mi><mo>&#60;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mtd></mtr><mtr><mtd><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mn>2</mn><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>&#8804;</mo><mi>x</mi><mo>&#60;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mtd></mtr><mtr><mtd><mn>4</mn><mo>&#183;</mo><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mo>+</mo><mn>2</mn><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#8804;</mo><mi>x</mi><mo>&#60;</mo><mfrac><mn>3</mn><mn>4</mn></mfrac></mtd></mtr><mtr><mtd><mn>3</mn><mo>&#183;</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mn>6</mn><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>&#8804;</mo><mi>x</mi><mo>&#60;</mo><mn>1</mn></mtd></mtr></mtable></mfenced></math></p><p>Now from above function we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><msup><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>-</mo></msup></mfenced><mo>=</mo><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><msup><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>+</mo></msup></mfenced><mo>=</mo><mn>0</mn></math>&nbsp;so function is differentiable at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p><p>And&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><msup><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>-</mo></msup></mfenced><mo>=</mo><mfrac><mn>1</mn><mn>16</mn></mfrac><mo>&#38;</mo><mo>&#160;</mo><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><msup><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>+</mo></msup></mfenced><mo>=</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>1</mn><mn>16</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>8</mn></mfrac></math>&nbsp;so function is non-differentiable at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math>, hence option&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>B</mi></mfenced></math>&nbsp;is correct,</p><p>Now&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><msup><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>-</mo></msup></mfenced><mo>=</mo><mn>4</mn><mo>&#215;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>+</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>=</mo><mn>1</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><msup><mfrac><mn>3</mn><mn>4</mn></mfrac><mo>+</mo></msup></mfenced><mo>=</mo><mn>3</mn><mo>&#215;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>+</mo><mn>6</mn><mo>&#215;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>=</mo><mfrac><mn>3</mn><mn>2</mn></mfrac></math></p><p>Hence, the function is not differentiable at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mn>3</mn><mn>4</mn></mfrac></math></p><p>So, function non-differentiable at two points so option&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>C</mi></mfenced></math>&nbsp;is not correct.</p><p>Now plotting the graph from the above value we get,</p><p><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/61a98865-8d84-478f-b0b9-4c2166748046.png\" style=\"width: 304px; height: 172px;\" /></p><p>Now&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced></math>&nbsp;will be minimum between&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>&#8804;</mo><mi>x</mi><mo>&#60;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>&#8804;</mo><mi>x</mi><mo>&#60;</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><mi>x</mi></mfenced><mo>=</mo><msup><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mn>2</mn><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mo>=</mo><mfenced><mrow><mi>x</mi><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mfenced><mrow><mn>3</mn><mi>x</mi><mo>-</mo><mfrac><mn>5</mn><mn>4</mn></mfrac></mrow></mfenced></math></p><p>Now critical points will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><mi>x</mi></mfenced><mo>=</mo><mn>0</mn><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>&#160;</mo><mtext>or</mtext><mo>&#160;</mo><mi>x</mi><mo>=</mo><mfrac><mn>5</mn><mn>12</mn></mfrac></math></p><p>Now putting the value in first derivative we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><msup><mfrac><mn>5</mn><mn>12</mn></mfrac><mo>-</mo></msup></mfenced><mo>&#60;</mo><mn>0</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msup><mi>f</mi><mo>&#39;</mo></msup><mfenced><msup><mfrac><mn>5</mn><mn>12</mn></mfrac><mo>+</mo></msup></mfenced><mo>&#62;</mo><mn>0</mn></math></p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mn>5</mn><mn>12</mn></mfrac></math>&nbsp;is point of minima,</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><msub><mfenced><mfrac><mn>5</mn><mn>12</mn></mfrac></mfenced><mrow><mi>m</mi><mi>i</mi><mi>n</mi></mrow></msub><mo>=</mo><msup><mfenced><mrow><mfrac><mn>5</mn><mn>12</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mn>2</mn></msup><mfenced><mrow><mfrac><mn>5</mn><mn>12</mn></mfrac><mo>-</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></mfenced><mo>=</mo><mfrac><mrow><mo>-</mo><mn>1</mn></mrow><mn>432</mn></mfrac></math></p><p>Hence, option&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>D</mi></mfenced></math>&nbsp;is wrong.</p>", "image": null}, "videoSolution": {"videoId": "f392beaa61a7400eb78a17d7b9a03fab", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/dl0SuOt7ETteX.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/dl0SuOt7ETteX.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cda", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 2)", "title": "JEE Advanced 2023 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a5cf23ac7d519f9b3b9", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf82a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017 (Paper 1)", "title": "JEE Advanced 2017 (Paper 1)"}], "type": "multipleCorrect", "level": 1, "question": {"text": "Let <math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>x</mi></mrow></mfenced></math> be the gre  is discontinuous at all integers and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mi>cos</mi><mi>&#960;</mi><mi>x</mi></math> is continuous everywhere.</p><p>At&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>0</mn></math>, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><mn>0</mn></math>, so it&#39;s continuous.</p><p>At other integral points,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo></math>&nbsp;is discontinuous.</p>", "image": null}, "videoSolution": {"videoId": "fe25426d9aff49f389e947c19d0cbd09", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/aD7imAhwW9JYA.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/aD7imAhwW9JYA.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf82a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017 (Paper 1)", "title": "JEE Advanced 2017 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a37f23ac7d519f9b266", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf824", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2014-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2014 (Paper 1)", "title": "JEE Advanced 2014 (Paper 1)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "Let <math><mi>f</mi><mo>:</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mi>a</mi><mo>,</mo><mi>&#160;</mi><mi>b</mi></mrow></mfenced><mo>&#8594;</mo><mfenced open=\"[\" separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi>&#160;</mi><mi>&#8734;</mi></mrow></mfenced></math> be a continuous function and let <math><mi>g</mi><mi>&#160;</mi><mo>:</mo><mi>R</mi><mo>&#8594;</mo><mi>R</mi></math> be defined as<br /><math><mi>g</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mo>=</mo><mi>&#160;</mi><mfenced close=\"\" open=\"{\" separators=\"|\"><mrow><mtable><mtr><mtd><mn>0</mn></mtd><mtd><mi>i</mi><mi>f</mi></mtd><mtd><mi>x</mi><mo>&#60;</mo><mi>a</mi><mo>,</mo></mtd></mtr><mtr><mtd><mrow><munderover><mo stretchy=\"false\">&#8747;</mo><mrow><mi>a</mi></mrow><mrow><mi>x</mi></mrow></munderover><mrow><mi>f</mi><mfenced separators=\"|\"><mrow><mi>t</mi></mrow></mfenced><mi>d</mi><mi>t</mi></mrow></mrow></mtd><mtd><mi>i</mi><mi>f</mi></mtd><mtd><mi>a</mi><mi>&#160;</mi><mo>&#8804;</mo><mi>x</mi><mi>&#160;</mi><mo>&#8804;</mo><mi>b</mi><mo>,</mo></mtd></mtr><mtr><mtd><mrow><munderover><mo stretchy=\"false\">&#8747;</mo><mrow><mi>a</mi></mrow><mrow><mi>b</mi></mrow></munderover><mrow><mi>f</mi><mfenced separators=\"|\"><mrow><mi>t</mi></mrow></mfenced><mi>d</mi><mi>t</mi></mrow></mrow></mtd><mtd><mi>i</mi><mi>f</mi></mtd><mtd><mi>x</mi><mo>&#62;</mo><mi>b</mi></mtd></mtr></mtable></mrow></mfenced></math> . Then", "image": null}, "options": [{"id": "EStar", "text": "<math><mi>g</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced></math>  is continuous but not differentiable at a", "isCorrect": true, "image": null}, {"id": "mfR9p", "text": "<math><mi>g</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced></math>  is differentiable on R", "isCorrect": false, "image": null}, {"id": "dqnyt", "text": "<math><mi>g</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced></math>  is continuous but not differentiable at b", "isCorrect": true, "image": null}, {"id": "CXfLT", "text": "<math><mi>g</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced></math>  is continuous and differentiable at eith mo><mfenced><mi>i</mi></mfenced></math></p><p>Right-hand derivative :</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mfenced><mrow><mi>f</mi><mi>g</mi></mrow></mfenced><mo>&#39;</mo></msup><mfenced><msup><mn>1</mn><mo>+</mo></msup></mfenced><mo>=</mo><munder><mi>lim</mi><mrow><mi>h</mi><mo>&#8594;</mo><mn>0</mn></mrow></munder><mfrac><mrow><mi>f</mi><mi>g</mi><mfenced><mrow><mn>1</mn><mo>+</mo><mi>h</mi></mrow></mfenced><mo>&#8722;</mo><mi>f</mi><mi>g</mi><mfenced><mn>1</mn></mfenced></mrow><mi>h</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><munder><mi>lim</mi><mrow><mi>h</mi><mo>&#8594;</mo><mn>0</mn></mrow></munder><mfrac><mrow><mfenced close=\"}\" open=\"{\"><mrow><msup><mfenced><mrow><mn>1</mn><mo>+</mo><mi>h</mi></mrow></mfenced><mn>3</mn></msup><mo>-</mo><msup><mfenced><mrow><mn>1</mn><mo>+</mo><mi>h</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mi>h</mi><mi>sin</mi><mfenced><mrow><mn>1</mn><mo>+</mo><mi>h</mi></mrow></mfenced></mrow></mfenced><mi>g</mi><mfenced><mrow><mn>1</mn><mo>+</mo><mi>h</mi></mrow></mfenced><mo>&#8722;</mo><mn>0</mn></mrow><mi>h</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><munder><mi>lim</mi><mrow><mi>h</mi><mo>&#8594;</mo><mn>0</mn></mrow></munder><mfenced close=\"}\" open=\"{\"><mrow><msup><mfenced><mrow><mn>1</mn><mo>+</mo><mi>h</mi></mrow></mfenced><mn>2</mn></msup><mo>+</mo><mi>sin</mi><mfenced><mrow><mn>1</mn><mo>+</mo><mi>h</mi></mrow></mfenced></mrow></mfenced><mi>g</mi><mfenced><mrow><mn>1</mn><mo>+</mo><mi>h</mi></mrow></mfenced><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math></p><p>If <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math> is continuous at <math> <mrow> <mi>x</mi><mo>=</mo><mn>1</mn></mrow> </math>, then</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mi>lim</mi><mrow><mi>h</mi><mo>&#8594;</mo><mn>0</mn></mrow></munder><mi>g</mi><mfenced><mrow><mn>1</mn><mo>+</mo><mi>h</mi></mrow></mfenced><mo>=</mo><munder><mi>lim</mi><mrow><mi>h</mi><mo>&#8594;</mo><mn>0</mn></mrow></munder><mi>g</mi><mfenced><mrow><mn>1</mn><mo>-</mo><mi>h</mi></mrow></mfenced><mo>=</mo><mi>g</mi><mfenced><mn>1</mn></mfenced><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mrow><mi>i</mi><mi>i</mi><mi>i</mi></mrow></mfenced></math></p><p>From equations&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>i</mi></mfenced><mo>,</mo><mo>&#160;</mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><mi>i</mi><mi>i</mi><mi>i</mi></mrow></mfenced></math>, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mi>lim</mi><mrow><mi>h</mi><mo>&#8594;</mo><mn>0</mn></mrow></munder><msup><mfenced><mrow><mi>f</mi><mi>g</mi></mrow></mfenced><mo>&#39;</mo></msup><mfenced><msup><mn>1</mn><mo>+</mo></msup></mfenced><mo>=</mo><munder><mi>lim</mi><mrow><mi>h</mi><mo>&#8594;</mo><mn>0</mn></mrow></munder><msup><mfenced><mrow><mi>f</mi><mi>g</mi></mrow></mfenced><mo>&#39;</mo></msup><mfenced><msup><mn>1</mn><mo>-</mo></msup></mfenced><mo>=</mo><mfenced><mrow><mn>1</mn><mo>+</mo><mi>sin</mi><mn>1</mn></mrow></mfenced><mi>g</mi><mfenced><mn>1</mn></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>f</mi><mi>g</mi></math>&nbsp;is differentiable at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn></math>.</p><p>So, option&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>A</mi></mfenced></math>&nbsp;is correct.</p><p>Now, from equations&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>i</mi></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math>, we can say&nbsp;that for <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mi>g</mi></math>&nbsp;to be differentiable, we need only <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mfenced><mrow><mn>1</mn><mo>+</mo><mi>h</mi></mrow></mfenced><mo>=</mo><mi>g</mi><mfenced><mrow><mn>1</mn><mo>-</mo><mi>h</mi></mrow></mfenced></math>.</p><p>But for&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math>&nbsp;to be continuous, we need&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mfenced><mrow><mn>1</mn><mo>+</mo><mi>h</mi></mrow></mfenced><mo>=</mo><mi>g</mi><mfenced><mrow><mn>1</mn><mo>-</mo><mi>h</mi></mrow></mfenced><mo>=</mo><mi>g</mi><mfenced><mn>1</mn></mfenced></math>.</p><p>So, option&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>B</mi></mfenced></math>&nbsp;is incorrect.</p><p>Now, if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math>&nbsp;is differentiable at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi></math>&nbsp;is already differentiable at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn></math>&nbsp;as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>f</mi><mo>'</mo></msup><mfenced><msup><mn>1</mn><mo>-</mo></msup></mfenced><mo>=</mo><msup><mi>f</mi><mo>'</mo></msup><mfenced><msup><mn>1</mn><mo>+</mo></msup></mfenced><mo>=</mo><mn>1</mn><mo>+</mo><mi>sin</mi><mn>1</mn></math>, so product of two differentiable functions is also differentiable.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mi>f</mi><mi>g</mi></math>&nbsp;is differentiable at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn></math>.</p><p>So, option&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>C</mi></mfenced></math>&nbsp;is correct.</p><p>Now, from option&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>B</mi></mfenced></math>, if&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mi>g</mi></math>&nbsp;is differentiable at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn></math>, we cannot guarantee&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math>&nbsp;to be continuous at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn></math>.</p><p>So, we also cannot guarantee&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi></math>&nbsp;to be differentiable at&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mn>1</mn></math>.</p><p>So, option&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>D</mi></mfenced></math>&nbsp;is incorrect.</p>", "image": null}, "videoSolution": {"videoId": "dce638f3fd664fa1a8354562d0956ed7", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/fez1YQyswRWuF.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/fez1YQyswRWuF.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf830", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2020-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2020 (Paper 1)", "title": "JEE Advanced 2020 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a70f23ac7d519f9b469", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf82d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2018-04-30T14:00:00.000Z", "isVi  then", "image": null}, "options": [{"id": "PZqEx", "text": "\n$f(x)$ is differentiable only in a finite interval containing zero\n", "image": null, "isCorrect": false}, {"id": "vTTcd", "text": "\n$f(x)$ is continuous, $\\forall x \\in R$\n", "image": null, "isCorrect": true}, {"id": "EMwQ9", "text": "\n$f^{\\prime}(x)$ is constant, $\\forall x \\in R$\n", "image": null, "isCorrect": true}, {"id": "kNczA", "text": "\n$f(x)$ is differentiable except at finitely many points", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$f(x+y)=f(x)+f(y)$, as $f(x)$ is differentiable at $x=0$.\n$$\n\\begin{aligned}\n\\Rightarrow & f^{\\prime}(0)=k \\\\\n\\text { Now, } f^{\\prime}(x) & =\\lim _{h \\rightarrow 0} \\frac{f(x+h)-f(x)}{h} \\\\\n& =\\lim _{h \\rightarrow 0} \\frac{f(x)+f(h)-f(x)}{h} \\\\\n& =\\lim _{h \\rightarrow 0} \\frac{f(h)}{h} \\quad\\left[\\frac{0}{0} \\text { from }\\right]\n\\end{aligned}\n$$\nGiven, $f(x+y)=f(x)+f(y), \\forall x, y$\n$$\n\\begin{aligned}\n& \\therefore & f(0) & =f(0)+f(0), \\\\\n& \\text { when } & x & =y=0 \\Rightarrow f(0)=0\n\\end{aligned}\n$$\nUsing L'Hospital's rule,\n$$\n\\lim _{h \\rightarrow 0} \\frac{f^{\\prime}(h)}{1}=f^{\\prime}(0)=k\n$$\n$\\Rightarrow f^{\\prime}(x)=k$, on integrating both sides, $f(x)=k x+C$, as $f(0)=0 \\Rightarrow C=0$\nSo, $f(x)=k x$\n$\\therefore f(x)$ is continuous for all $x \\in R$ and $f^{\\prime}(x)=k$, i.e. constant for all $x \\in R$.\nHence, both (b) and (c) are correct.\nSolutions (Q. Nos. 12-13)\n$$\n\\left.\\left(\\begin{array}{l}\n3 \\mathrm{~W} \\\\\n2 \\mathrm{R}\n\\end{array}\\right)(\\underbrace{1 \\mathrm{~W}}_{u_1})\\right\\} \\text { Initial }\n$$\nHead appears.\n$\\left(\\begin{array}{l}2 \\mathrm{~W} \\\\ 2 \\mathrm{R}\\end{array}\\right) \\underset{u_1}{\\mathrm{wW}}(\\underbrace{2 \\mathrm{~W}}_{u_2})$\nor $\\left.\\left(\\begin{array}{l}3 \\mathrm{~W} \\\\ 1 \\mathrm{R}\\end{array}\\right) \\underset{u_1}{\\stackrel{1 \\mathrm{R}}{u_1}}\\left(\\begin{array}{c}1 \\mathrm{~W} \\\\ 1 \\mathrm{R}\\end{array}\\right)\\right)_{u_2}^{u_2}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/GBdGyDD_0UwU3UqT52VW0IalBzIUtwdpq7GUfZVxGHE.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a01f23ac7d519f9b07a", "type": "multipleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}], "question": {"text": "Let $f$ be a real-valued function defined on the interval $(0, \\infty)$, by $f(x)=\\ln x+\\int_0^x \\sqrt{1+\\sin t} d t$. Then which of the following statement(s) is (are) true ?", "image": null}, "options": [{"id": "zbd5O", "text": "\n$f^{\\prime \\prime}(x)$ exists for all $x \\in(0, \\infty)$\n", "image": null, "isCorrect": false}, {"id": "ww3gP", "text": "\n$f^{\\prime}(x)$ exists for all $x \\in(0, \\infty)$ and $f^{\\prime}$ is continuous on $(0, \\infty)$, but not differentiable on $(0, \\infty)$\n", "image": null, "isCorrect": true}, {"id": "qSzxn", "text": "\nthere exists $\\alpha>1$ such that $\\left|f^{\\prime}(x)\\right| < |f(x)|$ for all $x \\in(\\alpha, \\infty)$", "image": null, "isCorrect": true}, {"id": "NW5uW", "text": "\nthere exists $\\beta>0$ such that $|f(x)|+\\left|f^{\\prime}(x)\\right| \\leq \\beta \\quad$ from all $x \\in(0, \\infty)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, $f^{\\prime}(x)=\\frac{1}{x}+\\sqrt{1+\\sin x}, x>0$ but $f(x)$ is not differentiable in $(0, \\infty)$ as $\\sin x$ may be $-1$ and then $f^{\\prime \\prime}(x)=-\\frac{1}{x^2}+\\frac{\\cos x}{2 \\sqrt{1+\\sin x}}$ will not exists.\n$\\Rightarrow f^{\\prime}(x)$ is continuous for all $x \\in(0, \\infty)$ but $f^{\\prime}(x)$ is not differentiable on $(0, \\infty)$.\n$\\therefore$ Option (b) is true.\nAlso, $\\quad f^{\\prime}(x) \\leq 3$, if $x>1$ and $\\quad f(x)>3$, if $x>e^3$\n$\\therefore$ Let $\\alpha=e^3$\n$\\Rightarrow$ Option (c) is true.\n(d) is not possible as $f(x) \\rightarrow \\infty$ when $x \\rightarrow \\infty$.\nHence, (b, c) is the correct option.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169e5f23ac7d519f9af74", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c42", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 1)", "title": "JEE Advanced 2008 (Paper 1)"}], "question": {"text": "Let $f$ and $g$ be real valued functions defined on interval $(-1,1)$ such that $g^{\\prime \\prime}(x)$ is continuous, $g(0) \\neq 0, g^{\\prime}(0)=0, g^{\\prime \\prime}(0) \\neq 0$ and $f(x)=g(x) \\sin x$.\nStatement $1 \\lim _{x \\rightarrow 0}[g(x) \\cos x-g(0) \\operatorname{cosec} x]=f^{\\prime \\prime}(0)$.\nStatement $2 f^{\\prime}(0)=g(0)$.", "image": null}, "options": [{"id": "irnYJ", "text": "\nStatement 1 is true, Statement 2 is true, Statement 2 is a correct explanation for Statement 1.\n", "image": null, "isCorrect": false}, {"id": "kNnuk", "text": "\nStatement 1 is true, Statement 2 is true, Statement 2 is not a correct explanation for Statement 1.\n", "image": null, "isCorrect": true}, {"id": "aqInn", "text": "\nStatement 1 is true, Statement 2 is false.\n", "image": null, "isCorrect": false}, {"id": "jgvE7", "text": "\nStatement 1 is false, Statement 2 is true", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have,\n$$\n\\begin{aligned}\n& \\lim _{x \\rightarrow 0} \\frac{g(x) \\cos x-g(0)}{\\sin x} \\\\\n& =\\lim _{x \\rightarrow 0} \\frac{g^{\\prime}(x) \\cos x-g(x) \\sin x}{\\cos x}=0\n\\end{aligned}\n$$\nSince, $f(x)=g(x) \\sin x$\n$$\n\\begin{aligned}\n& \\Rightarrow \\quad f^{\\prime}(x)=g^{\\prime}(x) \\sin x+g(x) \\cos x \\\\\n& \\Rightarrow \\quad f^{\\prime \\prime}(x)=g^{\\prime \\prime}(x) \\sin x+2 g^{\\prime}(x) \\cos x-g(x) \\sin x \\\\\n& \\Rightarrow \\quad f^{\\prime \\prime}(0)=0\n\\end{aligned}\n$$\nThus, $\\lim _{x \\rightarrow 0}[g(x) \\cos x-g(0) \\operatorname{cosec} x]=0=f^{\\prime \\prime}(0)$\n$\\Rightarrow$ Statement 1 is true.\nStatement 2. $f^{\\prime}(x)=g^{\\prime}(x) \\sin x+g(x) \\cos x$\n$$\n\\Rightarrow \\quad f^{\\prime}(0)=g(0)\n$$\nStatement 2 is not a correct explanation of Statement 1.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c42", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 1)", "title": "JEE Advanced 2008 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169d7f23ac7d519f9aef9", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}], "question": {"text": "In the following $[x]$ denotes the greatest integer less than or equal to $x$. Match the functions in Column I with the properties Column II.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/ZOJzgUXgnR79Tqmkejx4TZv8JzPFeZlpF6VMfpG-z9A.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "WvFY3", "text": "\nA-p, r; B-p, q, s; C-p; D-q, r\n", "image": null, "isCorrect": false}, {"id": "l74SM", "text": "\nA-p, s; B-p, r, s; C-p, s; D-q, r\n", "image": null, "isCorrect": false}, {"id": "4O6Iz", "text": "\nA-p, q, r; B-p, s; C-r, s; D-p, q\n", "image": null, "isCorrect": true}, {"id": "gYbwK", "text": "\nA-r, s; B-q; C-p; D-p, q, s", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A) $x|x|$ is continuous, differentiable and strictly increasing in $(-1,1)$.\n(B) $\\sqrt{|x|}$ is continuous in $(-1,1)$ and not differentiable at $x=0$.\n(C) $x+[x]$ is strictly increasing in $(-1,1)$ and discontinuous at $x=0$ $\\Rightarrow$ not differentiable at $x=0$.\n(D) $|x-1|+|x+1|=2$ in $(-1,1)$\nThe function is continuous and differentiable in $(-1,1)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169cef23ac7d519f9aea0", "type": "multipleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}], "question": {"text": "If $f(x)=\\min \\left\\{1, x^2, x^3\\right\\}$, then", "image": null}, "options": [{"id": "NiIRx", "text": "\n$f(x)$ is continuous everywhere\n", "image": null, "isCorrect": true}, {"id": "SgT8Q", "text": "\n$f(x)$ is continuous and differentiable everywhere\n", "image": null, "isCorrect": false}, {"id": "7xLHN", "text": "\n$f(x)$ is not differentiable at two points\n", "image": null, "isCorrect": false}, {"id": "p2SOy", "text": "\n$f(x)$ is not differentiable at one point", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Here, $f(x)=\\min .\\left\\{1, x^2, x^3\\right\\}$ which could be graphically shown as\n$$\n\\therefore \\quad f(x)=\\left\\{\\begin{array}{c}\n1, x \\geq 1 \\\\\nx^3, x < 1\n\\end{array}\\right.\n$$<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/aMjTHolEozuYG-SqnJHOZWv-BUVKNUy9PvmW4-6Za-k.original.fullsize.png\"><br>\n$$\n\\Rightarrow f(x) \\text { is continuous for } x \\in R \\text { and not differentiable at } x=1 \\text { due to sharp edge. }\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
