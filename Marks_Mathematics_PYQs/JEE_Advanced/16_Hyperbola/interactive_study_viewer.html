nt.net/poster/baQj7byxgqZws.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf82d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2018-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2018 (Paper 2)", "title": "JEE Advanced 2018 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a0ff23ac7d519f9b0fb", "type": "multipleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}], "question": {"text": "Let the eccentricity of the hyperbola $\\frac{x^2}{a^2}-\\frac{y^2}{b^2}=1$ be reciprocal to that of the ellipse $x^2+4 y^2=4$. If the hyperbola passes through a focus of the ellipse, then", "image": null}, "options": [{"id": "9LyHj", "text": "\nthe equation of the hyperbola is $\\frac{x^2}{3^2}-\\frac{y^2}{2^2}=1$\n", "image": null, "isCorrect": false}, {"id": "QNGSJ", "text": "\na focus of the hyperbola is $(2,0)$\n", "image": null, "isCorrect": true}, {"id": "AWI7P", "text": "\nthe eccentricity of the hyperbola is $\\sqrt{\\frac{5}{3}}$\n", "image": null, "isCorrect": false}, {"id": "qKOT1", "text": "\nthe equation of the hyperbola is $x^2-3 y^2=3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Here, equation of ellipse\n$$\n\\begin{aligned}\n& \\frac{x^2}{4}+\\frac{y^2}{1}=1 \\\\\n& \\Rightarrow \\quad e^2=1-\\frac{b^2}{a^2}=1-\\frac{1}{4}=\\frac{3}{4} \\\\\n& \\therefore \\quad e=\\frac{\\sqrt{3}}{2} \\text { and focus }(\\pm a e, 0) \\\\\n& =(\\pm \\sqrt{3}, 0) \\\\\n&\n\\end{aligned}\n$$\nFor hyperbola $\\frac{x^2}{a^2}-\\frac{y^2}{b^2}=1$, $e_1^2=1+\\frac{b^2}{a^2}$ where, $e_1^2=\\frac{1}{e^2}=\\frac{4}{3}$\n$$\n\\Rightarrow \\quad 1+\\frac{b^2}{a^2}=\\frac{4}{3} \\Rightarrow \\frac{b^2}{a^2}=\\frac{1}{3}\n$$\nand hyperbola passes through $(\\pm \\sqrt{3}, 0)$. Now, $\\quad \\frac{3}{a^2}=1 \\Rightarrow a^2=3$\nFrom Eqs. (i) and (ii), we get $b^2=1$\n$\\therefore$ Equation of hyperbola is\n$$\n\\frac{x^2}{3}-\\frac{y^2}{1}=1\n$$\nFocus is $(\\pm a e, 0)$.\nNow, $\\quad\\left(\\pm \\sqrt{3} \\cdot \\frac{2}{\\sqrt{3}}, 0\\right) \\Rightarrow(\\pm 2,0)$\nHence, both options (b) and (d) are correct.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169ebf23ac7d519f9afaf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}], "question": {"text": "Consider a branch of the hyperbola $x^2-2 y^2-2 \\sqrt{2} x-4 \\sqrt{2} y-6=0$ with vertex at the point $A$. Let $B$ be one of the end points of its latus rectum. If $C$ is the focus of the hyperbola nearest to the point $A$, then the area of the $\\triangle A B C$ is", "image": null}, "options": [{"id": "szMNz", "text": "\n$1-\\sqrt{\\frac{2}{3}}$ sq unit\n", "image": null, "isCorrect": false}, {"id": "00S7n", "text": "\n$\\sqrt{\\frac{3}{2}}-1$ sq unit\n", "image": null, "isCorrect": true}, {"id": "vFIus", "text": "\n$1+\\sqrt{\\frac{2}{3}}$ sq unit\n", "image": null, "isCorrect": false}, {"id": "KS2ST", "text": "\n$\\sqrt{\\frac{3}{2}}+1$ sq unit", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation can be rewritten as $\\frac{(x-\\sqrt{2})^2}{1}-\\frac{(y+\\sqrt{2})^2}{2}=1$ for $A(x, y)$,\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/kJiDAgQz4cB8Ql-009_N5DDom8WjagEpxMaE9lZAfMg.original.fullsize.png\"><br>\n$$\n\\begin{aligned}\n& e=\\sqrt{1+\\frac{2}{4}}=\\sqrt{\\frac{3}{2}} \\\\\n& \\therefore x-\\sqrt{2}=2 \\Rightarrow x=2+\\sqrt{2} \\\\\n& \\text { For } C(x, y), x-\\sqrt{2}=a e=\\sqrt{6} \\\\\n& \\Rightarrow \\quad x=\\sqrt{6}+\\sqrt{2} \\\\\n& \\text { Now, } A C=\\sqrt{6}+\\sqrt{2}-2-\\sqrt{2}=\\sqrt{6}-2 \\\\\n& \\qquad B C=\\frac{b^2}{a}=\\frac{2}{2}=1 \\\\\n& \\text { Area of } \\Delta A B C=\\frac{1}{2} \\times(\\sqrt{6}-2) \\times B C \\\\\n& =\\frac{1}{2} \\times(\\sqrt{6}-2) \\times 1=\\sqrt{\\frac{3}{2}}-1\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169cef23ac7d519f9ae9e", "type": "multipleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}], "question": {"text": "If $e_1$ is the eccentricity of the ellipse $\\frac{x^2}{16}+\\frac{y^2}{25}=1$ and $e_2$ is the eccentricity of the hyperbola passing through the focii of the ellipse and $e_1 e_2=1$, then equation of the hyperbola is", "image": null}, "options": [{"id": "0ZU74", "text": "\n$\\frac{x^2}{9}-\\frac{y^2}{16}=1$\n", "image": null, "isCorrect": false}, {"id": "UFUPM", "text": "\n$\\frac{x^2}{16}-\\frac{y^2}{9}=-1$\n", "image": null, "isCorrect": true}, {"id": "WGOXc", "text": "\n$\\frac{x^2}{9}-\\frac{y^2}{25}=1$\n", "image": null, "isCorrect": false}, {"id": "SROzG", "text": "\nNone of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The eccentricity of $\\frac{x^2}{16}+\\frac{y^2}{25}=1$ is $e_1=\\sqrt{1-\\frac{16}{25}}=\\frac{3}{5}$ $\\therefore \\quad e_2=\\frac{5}{3}$\n$\\Rightarrow$ Foci of ellipse $(0, \\pm 3)$\n$\\therefore$ Equation of hyperbola is $\\frac{x^2}{16}-\\frac{y^2}{9}=-1$\nHence (b) is the correct answer.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64b16ae1f23ac7d519f9b915", "title": "Line and hyperbola", "totalQuestions": 1, "questions": [{"_id": "64b16a5cf23ac7d519f9b3b6", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf82a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017 (Paper 1)", "title": "JEE Advanced 2017 (Paper 1)"}], "type": "multipleCorrect", "level": 1, "question": {"text": "If <math><mn>2</mn><mi>x</mi><mo>-</mo><mi>y</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn></math> is a tangent to the hyperbola <math><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><mn>16</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math> , then which of the following CANNOT be sides of a right angled triangle?", "image": null}, "options": [{"id": "qDmK0", "text": "<math><mi>a</mi><mo>,</mo><mn>4</mn><mo>,</mo><mi>&nbsp;</mi><mn>2</mn></math>", "isCorrect": true, "image": null}, {"id": "oqO7r", "text": "<math><mn>2</mn><mi>a</mi><mo>,</mo><mi>&nbsp;</mi><mn>8</mn><mo>,</mo><mi>&nbsp;</mi><mn>1</mn></math>", "isCorrect": true, "image": null}, {"id": "iKIN0", "text": "<math><mn>2</mn><mi>a</mi><mo>,</mo><mi> </mi><mn>4</mn><mo>,</mo><mi> </mi><mn>1</mn></math>", "isCorrect": false, "image": null}, {"id": "QaDM8", "text": "<math><mi>a</mi><mo>,</mo><mi>&nbsp;</mi><mn>4</mn><mo>,</mo><mi>&nbsp;</mi><mn>1</mn></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The line <math><mi>y</mi><mo>=</mo><mi>m</mi><mi>x</mi><mo>+</mo><mi>c</mi></math> is tangent to hyperbola <math><mfrac><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>-</mo><mfrac><mrow><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow><mrow><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></mrow></mfrac><mo>=</mo><mn>1</mn><mo>,</mo></math>, if <math><msup><mrow><mi>c</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><msup><mrow><mi>m</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></math><p><math><mo>∴</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><msup><mrow><mfenced separators=\"|\"><mrow><mn>1</mn></mrow></mfenced></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mn>4</mn><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>16</mn><mi>&nbsp;</mi><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><mn>17</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math></p><p><math><mo>⇒</mo><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>&nbsp;</mi><mi>a</mi><mo>=</mo><mfrac><mrow><msqrt><mn>17</mn></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac></math></p><p>For <math> <mrow> <mn>2</mn><mi>a</mi><mo>,</mo><mtext>&nbsp;4,&nbsp;1</mtext> </mrow> </math>, sides are <math><msqrt><mn>17</mn></msqrt><mo>,</mo><mi>&nbsp;</mi><mn>4</mn><mo>,</mo><mi>&nbsp;</mi><mn>1</mn></math> (<math><mo>⇒</mo></math> Right angled triangle)</p><p>For <math> <mrow> <mtext>2a,&nbsp;8,&nbsp;1</mtext> </mrow> </math>, sides are <math><msqrt><mn>17</mn></msqrt><mo>,</mo><mi>&nbsp;</mi><mn>8</mn><mo>,</mo><mi>&nbsp;</mi><mn>1</mn></math> (<math><mo>⇒</mo></math>Triangle is not possible)</p><p>For <math> <mrow> <mtext>a,&nbsp;4,&nbsp;1</mtext> </mrow> </math>, sides are <math><mfrac><mrow><msqrt><mn>17</mn></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi>&nbsp;</mi><mn>4</mn><mo>,</mo><mi>&nbsp;</mi><mn>1</mn></math> (<math><mo>⇒</mo></math>Triangle is not possible)</p><p>For <math> <mrow> <mtext>a,&nbsp;4,&nbsp;2</mtext> </mrow> </math>, sides are <math><mfrac><mrow><msqrt><mn>17</mn></msqrt></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi>&nbsp;</mi><mn>4</mn><mo>,</mo><mi>&nbsp;</mi><mn>2</mn></math> (<math><mo>⇒</mo></math>Triangle exist but not right angled)</p>", "image": null}, "videoSolution": {"videoId": "4ff3a3ec6ffc41bfa02ef0298ac20074", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/luhvcatXY13Jx.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/luhvcatXY13Jx.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf82a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017 (Paper 1)", "title": "JEE Advanced 2017 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64b16ae1f23ac7d519f9b914", "title": "Tangent to hyperbola", "totalQuestions": 4, "questions": [{"_id": "64b16a9ff23ac7d519f9b614", "previousYearPapers": [{"_id": "632c83583e3fd59bda92e46d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 2)", "title": "JEE Advanced 2022 (Paper 2)"}], "type": "numerical", "level": 2, "question": {"text": "Consider the hyperbola <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msup><mi>x</mi><mn>2</mn></msup><mn>100</mn></mfrac><mo>-</mo><mfrac><msup><mi>y</mi><mn>2</mn></msup><mn>64</mn></mfrac><mo>=</mo><mn>1</mn></math>&nbsp;with foci at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>1</mn></msub></math>, where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> lies on the positive <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi></math>-axis. Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> be a point on the hyperbola, in the first quadrant. Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8736;</mo><mi>S</mi><mi>P</mi><msub><mi>S</mi><mn>1</mn></msub><mo>=</mo><mi>&#945;</mi></math>, with <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mo>&#60;</mo><mfrac><mi>&#960;</mi><mn>2</mn></mfrac></math>. The straight line passing through the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> and having the same slope as that of the tangent at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math> to the hyperbola, intersects the straight line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>S</mi><mn>1</mn></msub><mi>P</mi></math> at <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math>. Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#948;</mi></math> be the distance of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi></math>&nbsp;from the straight line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><msub><mi>P</mi><mn>1</mn></msub></math>, and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#946;</mi><mo>=</mo><msub><mi>S</mi><mn>1</mn></msub><mi>P</mi></math>. Then the greatest integer less than or equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>&#946;</mi><mi>&#948;</mi></mrow><mn>9</mn></mfrac><mi>sin</mi><mfrac><mi>&#945;</mi><mn>2</mn></mfrac></math> is _____ .", "image": null}, "options": [], "correctValue": "7", "solution": {"text": "<blockquote><p>Plotting the diagram of the given value we have,</p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/452e4632-f6e6-476b-a64e-4714c3ff8476-f65be8df-3a1e-42ff-a28a-d892ed05cdfb-image.png\" style=\"width: 300px; height: 250px;\" /></p><p>We know that product of distances of any tangent from two foci <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mi>b</mi><mn>2</mn></msup></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#948;</mi><mo>&#215;</mo><mi>&#946;</mi><mi>sin</mi><mfrac><mi>&#945;</mi><mn>2</mn></mfrac><mo>=</mo><msup><mi>b</mi><mn>2</mn></msup></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mi>&#946;</mi><mi>&#948;</mi><mi>sin</mi><mfrac><mi>&#945;</mi><mn>2</mn></mfrac></mrow><mn>9</mn></mfrac><mo>=</mo><mfrac><msup><mi>b</mi><mn>2</mn></msup><mn>9</mn></mfrac><mo>=</mo><mfrac><mn>64</mn><mn>9</mn></mfrac></math></p><p>Now finding the greatest integer less than or equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>&#946;</mi><mi>&#948;</mi><mi>sin</mi><mfrac><mi>&#945;</mi><mn>2</mn></mfrac></mrow><mn>9</mn></mfrac></math>&nbsp;which will be&nbsp;<math \\frac{1}{\\sqrt{2}}\\right)$", "isCorrect": true, "image": null}, {"id": "I4FyI", "text": "$\\left(-\\frac{9}{2 \\sqrt{2}},-\\frac{1}{\\sqrt{2}}\\right)$", "isCorrect": true, "image": null}, {"id": "gOxDF", "text": "$(3 \\sqrt{3},-2 \\sqrt{2})$", "isCorrect": false, "image": null}, {"id": "sNveN", "text": "$(-3 \\sqrt{3}, 2 \\sqrt{2})$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "If slope of tangents to hyperbola $\\frac{x^{2}}{a^{2}}-\\frac{y^{2}}{b^{2}}=1$ is $m$,\r\n\r\nthen equations of tangent to the hyperbola is\r\n\r\n$y=m x \\pm \\sqrt{a^{2} m^{2}-b^{2}} \\quad$ with the points of contact\r\n\r\n$\\quad\\left(\\quad \\pm a^{2} m\\right.$\r\n\r\n$\\left.\\frac{\\pm \\sqrt{a^{2} m^{2}-b^{2}}}{\\sqrt{a^{2} m^{2}-b^{2}}}\\right)$\r\n\r\n$\\therefore$ Tangent to hyperbola $\\frac{x^{2}}{9}-\\frac{y^{2}}{4}=1$ is parallel to $2 x-y=1$,\r\n\r\n$\\therefore$ Slope of tangent $=2$\r\n\r\n$\\therefore$ Points of contact are $\\left(\\frac{\\pm 9 \\times 2}{\\sqrt{9 \\times 4-4}}, \\frac{\\pm 4}{\\sqrt{9 \\times 4-4}}\\right)$\r\n\r\ni.e. $\\left(\\frac{9}{2 \\sqrt{2}}, \\frac{1}{\\sqrt{2}}\\right)$ and $\\left(\\frac{-9}{2 \\sqrt{2}}, \\frac{-1}{\\sqrt{2}}\\right)$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64b16ae1f23ac7d519f9b912", "title": "Properties of Tangent", "totalQuestions": 1, "questions": [{"_id": "64b16a03f23ac7d519f9b089", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}], "question": {"text": "The line $2 x+y=1$ is tangent to the hyperbola $\\frac{x^2}{a^2}-\\frac{y^2}{b^2}=1$. If this line passes through the point of intersection of the nearest directrix and the $x$-axis, then the eccentricity of the hyperbola is", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "On substituting $\\left(\\frac{a}{e}, 0\\right)$ in $y=-2 x+1$, we get\n$$\n\\begin{aligned}\n0 & =-\\frac{2 a}{e}+1 \\\\\n\\Rightarrow \\quad \\frac{a}{e} & =\\frac{1}{2}\n\\end{aligned}\n$$\nAlso, $y=-2 x+1$ is tangent to hyperbola\n$$\n\\begin{array}{ll}\n\\therefore & 1=4 a^2-b^2 \\\\\n\\Rightarrow & \\frac{1}{a^2}=4-\\left(e^2-1\\right)\n\\end{array}\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/NgSyx4jXoTQYo478MXUkIxfQykfFt5KH9BzzdvmUBQE.original.fullsize.png\"><br>\n$$\n\\begin{array}{ll}\n\\Rightarrow & \\frac{4}{e^2}=5-e^2 \\\\\n\\Rightarrow & e^4-5 e^2+4=0 \\\\\n\\Rightarrow & \\left(e^2-4\\right)\\left(e^2-1\\right)=0 \\\\\n\\Rightarrow & e=2, e=1\n\\end{array}\n$$\n$e=1$ gives the conic as parabola. But conic is given as hyperbola, hence $e=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "64b16ae1f23ac7d519f9b911", "title": "Common Tangent", "totalQuestions": 1, "questions": [{"_id": "64b16a02f23ac7d519f9b080", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}], "question": {"text": "<strong>Paragraph:</strong>\nThe circle $x^2+y^2-8 x=0$ and hyperbola $\\frac{x^2}{9}-\\frac{y^2}{4}=1$ intersect at the points $A$ and $B$.<strong>Question:</strong>\nEquation of a common tangent with positive slope to the circle as well as to the hyperbola is", "image": null}, "options": [{"id": "vlWDH", "text": "\n$2 x-\\sqrt{5} y-20=0$\n", "image": null, "isCorrect": false}, {"id": "SYrd8", "text": "\n$2 x-\\sqrt{5} y+4=0$\n", "image": null, "isCorrect": true}, {"id": "rmmxR", "text": "\n$3 x-4 y+8=0$\n", "image": null, "isCorrect": false}, {"id": "tw4Aa", "text": "\n$4 x-3 y+4=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of tangent to hyperbola having slope $m$ is\n$$\ny=m x+\\sqrt{9 m^2-4}\n$$\nEquation of tangent to circle is\n$$\ny=m(x-4)+\\sqrt{16 m^2+16}\n$$\nEqs. (i) and (ii) will be identical for $m=\\frac{2}{\\sqrt{5}}$ satisfy.\n$\\therefore$ Equation of common tangent is $2 x-\\sqrt{5} y+4=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "64b16ae1f23ac7d519f9b913", "title": "Normal to hyperbola", "totalQuestions": 1, "questions": [{"_id": "64b16a16f23ac7d519f9b132", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c49", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 2)", "title": "JEE Advanced 2011 (Paper 2)"}], "question": {"text": "Let $P(6,3)$ be a point on the hyperbola $\\frac{x^2}{a^2}-\\frac{y^2}{b^2}=1$. If the normal at the point $P$ intersects the $X$-axis at $(9,0)$, then the eccentricity of the hyperbola is", "image": null}, "options": [{"id": "k5erj", "text": "\n$\\sqrt{\\frac{5}{2}}$\n", "image": null, "isCorrect": false}, {"id": "dGP1t", "text": "\n$\\sqrt{\\frac{3}{2}}$\n", "image": null, "isCorrect": true}, {"id": "mP2Xn", "text": "\n$\\sqrt{2}$\n", "image": null, "isCorrect": false}, {"id": "GzFre", "text": "\n$\\sqrt{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of normal to hyperbola at $\\left(x_1, y_1\\right)$ is\n$$\n\\begin{gathered}\n\\frac{a^2 x}{x_1}+\\frac{b^2 y}{y_1}=a^2+b^2 \\\\\n\\therefore \\text { At }(6,3), \\frac{a^2 x}{6}+\\frac{b^2 y}{3}=a^2+b^2\n\\end{gathered}\n$$\nIt passes throught $(9,0)$.\n\n$$\n\\begin{aligned}\n& \\text { Now, } \\quad \\frac{a^2 \\cdot 9}{6}=a^2+b^2 \\\\\n& \\Rightarrow \\quad \\frac{3 a^2}{2}-a^2=b^2 \\Rightarrow \\frac{a^2}{b^2}=2 \\\\\n& \\therefore \\quad e^2=1+\\frac{b^2}{a^2}=1+\\frac{1}{2} \\Rightarrow e=\\sqrt{\\frac{3}{2}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c49", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 2)", "title": "JEE Advanced 2011 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "64b16ae1f23ac7d519f9b910", "title": "Locus", "totalQuestions": 1, "questions": [{"_id": "64b169f4f23ac7d519f9affe", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}], "question": {"text": "$$\n\\text { Match the conics in Column I with the statements/expressions in Column II. }\n$$\n\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/mttZypB7gORJPl-QC2KlWwOMRUJEI-jGBWeCxz3jUTE.original.fullsize.png\"><br><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/BSqFu76r11SkdAwZcbkeTMZ0RwfnU1zWrr8QDx9JnTE.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "uDY2P", "text": "\n(A) s, (B) q,s, (C) s, (D) p,s\n", "image": null, "isCorrect": false}, {"id": "ZpiTJ", "text": "\n(A) p, (B) q,s, (C) r, (D) q,s\n", "image": null, "isCorrect": false}, {"id": "FxGDN", "text": "\n(A) s, (B) s,t, (C) s, (D) p,s\n", "image": null, "isCorrect": false}, {"id": "E6Opc", "text": "\n(A) p, (B) s,t, (C) r, (D) q,s", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(p) $\\frac{1}{\\sqrt{h^2+k^2}}=2 \\Rightarrow h^2+k^2=\\frac{1}{4}$\nHence, locus is a circle.\n(q) ||$z+2|-| z-2||=3$\nand $\\quad 2-(-2)=4>3$\nHence, locus is hyperbola.\n(r) Let $x=\\sqrt{3}\\left(\\frac{1-t^2}{1+t^2}\\right), y=\\frac{2 t}{1+t^2}$\nLet $\\quad \\tan \\theta=t$ $\\Rightarrow x=\\sqrt{3} \\cos 2 \\theta, y=\\sin 2 \\theta$\n$\\therefore \\quad \\frac{x^2}{3}+y^2=1$\nHence, locus is an ellipse.\n(s) Eccentricity $x=1 \\Rightarrow$ Parabola, $1 < x < \\infty \\Rightarrow$ Hyperbola\n(t) Let $z=x+i y$\nSince, $\\operatorname{Re}(z+1)^2=|z|^2+1$\n$\\Rightarrow \\quad(x+1)^2-y^2=x^2+y^2+1$\n$\\Rightarrow \\quad 2 x=2 y^2$\n$\\Rightarrow \\quad x=y^2$\nHence, locus is parabola.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
