</td>\t\t\t<td>The mean deviation about the<br />\t\t\tmedian of the above data is</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>4</mn></mfenced></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>7</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td>&nbsp;</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>5</mn></mfenced></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mo>.</mo><mn>4</mn></math></td>\t\t</tr>\t</tbody></table><p>The correct option is</p>", "image": null}, "options": [{"id": "vvW6P", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">P</mi></mfenced><mo>&#8594;</mo><mfenced><mn>3</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">Q</mi></mfenced><mo>&#8594;</mo><mfenced><mn>2</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">R</mi></mfenced><mo>&#8594;</mo><mfenced><mn>4</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">S</mi></mfenced><mo>&#8594;</mo><mfenced><mn>5</mn></mfenced></math>", "image": null, "isCorrect": true}, {"id": "VagOB", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">P</mi></mfenced><mo>&#8594;</mo><mfenced><mn>3</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">Q</mi></mfenced><mo>&#8594;</mo><mfenced><mn>2</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">R</mi></mfenced><mo>&#8594;</mo><mfenced><mn>1</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">S</mi></mfenced><mo>&#8594;</mo><mfenced><mn>5</mn></mfenced></math>", "image": null, "isCorrect": false}, {"id": "Mu2HM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">P</mi></mfenced><mo>&#8594;</mo><mfenced><mn>2</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">Q</mi></mfenced><mo>&#8594;</mo><mfenced><mn>3</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">R</mi></mfenced><mo>&#8594;</mo><mfenced><mn>4</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">S</mi></mfenced><mo>&#8594;</mo><mfenced><mn>1</mn></mfenced></math>", "image": null, "isCorrect": false}, {"id": "39zek", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">P</mi></mfenced><mo>&#8594;</mo><mfenced><mn>3</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">Q</mi></mfenced><mo>&#8594;</mo><mfenced><mn>3</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">R</mi></mfenced><mo>&#8594;</mo><mfenced><mn>5</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">S</mi></mfenced><mo>&#8594;</mo><mfenced><mn>5</mn></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Arranging the given data in ascending order</p><p>we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtable columnalign=\"left\"><mtr><mtd><msub><mi>x</mi><mi>i</mi></msub></mtd><mtd><mn>3</mn></mtd><mtd><mn>4</mn></mtd><mtd><mn>5</mn></mtd><mtd><mn>8</mn></mtd><mtd><mn>10</mn></mtd><mtd><mn>11</mn></mtd></mtr><mtr><mtd><msub><mi>f</mi><mi>i</mi></msub></mtd><mtd><mn>5</mn></mtd><mtd><mn>4</mn></mtd><mtd><mn>4</mn></mtd><mtd><mn>2</mn></mtd><mtd><mn>2</mn></mtd><mtd><mn>3</mn></mtd></mtr></mtable></math></p><p>Now finding the mean of the above data we get,</p><p>Mean <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>3</mn><mo>&#215;</mo><mn>5</mn><mo>+</mo><mn>8</mn><mo>&#215;</mo><mn>2</mn><mo>+</mo><mn>11</mn><mo>&#215;</mo><mn>3</mn><mo>+</mo><mn>10</mn><mo>&#215;</mo><mn>2</mn><mo>+</mo><mn>5</mn><mo>&#215;</mo><mn>4</mn><mo>+</mo><mn>4</mn><mo>&#215;</mo><mn>4</mn></mrow><mrow><mn>5</mn><mo>+</mo><mn>2</mn><mo>+</mo><mn>3</mn><mo>+</mo><mn>2</mn><mo>+</mo><mn>4</mn><mo>+</mo><mn>4</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>15</mn><mo>+</mo><mn>16</mn><mo>+</mo><mn>33</mn><mo>+</mo><mn>20</mn><mo>+</mo><mn>20</mn><mo>+</mo><mn>16</mn></mrow><mn>20</mn></mfrac><mo>=</mo><mfrac><mn>120</mn><mn>20</mn></mfrac><mo>=</mo><mn>6</mn></math></p><p>Now, median <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><msup><mn>10</mn><mi>th</mi></msup><mo>+</mo><msup><mn>11</mn><mi>th</mi></msup><mo>&#160;</mo><mi>observation</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mfenced><mrow><mn>5</mn><mo>+</mo><mn>5</mn></mrow></mfenced><mo>=</mo><mn>5</mn></math></p><p>Hence, Mean deviation about mean will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>3</mn><mo>&#215;</mo><mn>5</mn><mo>+</mo><mn>2</mn><mo>&#215;</mo><mn>4</mn><mo>+</mo><mn>1</mn><mo>&#215;</mo><mn>4</mn><mo>+</mo><mn>2</mn><mo>&#215;</mo><mn>2</mn><mo>+</mo><mn>4</mn><mo>&#215;</mo><mn>2</mn><mo>+</mo><mn>5</mn><mo>&#215;</mo><mn>3</mn></mrow><mn>20</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>54</mn><mn>20</mn></mfrac><mo>=</mo><mn>2</mn><mo>.</mo><mn>7</mn></math></p><p>And Mean deviation about median</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#215;</mo><mn>5</mn><mo>+</mo><mn>1</mn><mo>&#215;</mo><mn>4</mn><mo>+</mo><mn>0</mn><mo>+</mo><mn>3</mn><mo>&#215;</mo><mn>2</mn><mo>+</mo><mn>5</mn><mo>&#215;</mo><mn>2</mn><mo>+</mo><mn>6</mn><mo>&#215;</mo><mn>3</mn></mrow><mn>20</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mrow><mn>4</mn><mo>.</mo><mn>8</mn></mrow><mn>20</mn></mfrac><mo>=</mo><mn>2</mn><mo>.</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>P</mi><mo>&#8594;</mo><mn>3</mn><mo>;</mo><mo>&#160;</mo><mi>Q</mi><mo>&#8594;</mo><mn>2</mn><mo>;</mo><mo>&#160;</mo><mi>R</mi><mo>&#8594;</mo><mn>4</mn><mo>;</mo><mo>&#160;</mo><mi>S</mi><mo>&#8594;</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> Option A&nbsp;is correct.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "ebcb0f42ddcd4e78ae55a78c335e3adf", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/eCBQg5SkkMf7h.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/eCBQg5SkkMf7h.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "6a0be52344d287c9361e5ce3", "title": "Mean", "totalQuestions": 1, "questions": [{"_id": "6a0be51244d287c9361e5cb3", "type": "numerical", "question": {"text": "Consider a data consisting of $10$ observations $x_1, x_2, \\ldots, x_{10}$, whose mean is $5$ and variance is $7$. If the mean and the variance of the first $8$ observations $x_1, x_2, \\ldots, x_8$ are $4$ and $3.5$, respectively, and $x_9 < x_{10}$, then the value of $3x_9 + 2x_{10}$ is ___________.", "image": null}, "options": [], "correctValue": "44", "solution": {"text": "Given $\\dfrac{\\sum_{i=1}^{10} x_i}{10} = 5 \\Rightarrow \\sum_{i=1}^{10} x_i = 50$<br><br>$\\dfrac{\\sum_{i=1}^{10} x_i^2}{10} - 5^2 = 7 \\Rightarrow \\sum_{i=1}^{10} x_i^2 = 320$<br><br>For the first $8$ observations:<br><br>$\\dfrac{\\sum_{i=1}^{8} x_i}{8} = 4 \\Rightarrow \\sum_{i=1}^{8} x_i = 32$<br><br>$\\dfrac{\\sum_{i=1}^{8} x_i^2}{8} - 4^2 = 3.5 \\Rightarrow \\sum_{i=1}^{8} x_i^2 = 8(3.5 + 16) = 156$<br><br>Subtracting the sums, we get:<br><br>$x_9 + x_{10} = 50 - 32 = 18$<br><br>$x_9^2 + x_{10}^2 = 320 - 156 = 164$<br><br>Using $(x_9 + x_{10})^2 = x_9^2 + x_{10}^2 + 2x_9 x_{10}$:<br><br>$18^2 = 164 + 2x_9 x_{10} \\Rightarrow 2x_9 x_{10} = 324 - 164 = 160 \\Rightarrow x_9 x_{10} = 80$<br><br>The numbers $x_9$ and $x_{10}$ are roots of the equation $t^2 - 18t + 80 = 0$.<br><br>$(t - 8)(t - 10) = 0 \\Rightarrow t = 8, 10$<br><br>Since $x_9 < x_{10}$, we have $x_9 = 8$ and $x_{10} = 10$.<br><br>Therefore, $3x_9 + 2x_{10} = 3(8) + 2(10) = 24 + 20 = 44$.<br><br>Answer: $44$", "image": null}, "level": 2, "videoSolution": {"videoId": "9997105b36a249f496eaaa27e26c4c2b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/GT6sQVGFmWicw.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/GT6sQVGFmWicw.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b43", "title": "JEE Advanced 2026 (Paper 2)", "shortName": "2026 (Paper 2)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b43", "title": "JEE Advanced 2026 (Paper 2)", "shortName": "2026 (Paper 2)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
