mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub></math>. If the distance of the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn></mrow></mfenced></math>,&nbsp;from <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>3</mn></mrow></msub></math>, is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>, and the distance of a point <math><mo>(</mo><mi mathvariant=\"normal\">&#945;</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#946;</mi><mo>,</mo><mi mathvariant=\"normal\">&#160;</mi><mi mathvariant=\"normal\">&#947;</mi><mo>)</mo></math>, from <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>3</mn></mrow></msub></math>, is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>, then which of the following relations is (are) true ?", "image": null}, "options": [{"id": "YReo5", "text": "<math><mn>2</mn><mi mathvariant=\"normal\">α</mi><mo>+</mo><mi mathvariant=\"normal\">β</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">γ</mi><mo>+</mo><mn>2</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "fq5Vp", "text": "<math><mn>2</mn><mi mathvariant=\"normal\">α</mi><mo>-</mo><mi mathvariant=\"normal\">β</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">γ</mi><mo>+</mo><mn>4</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": true, "image": null}, {"id": "dCoam", "text": "<math><mn>2</mn><mi mathvariant=\"normal\">α</mi><mo>+</mo><mi mathvariant=\"normal\">β</mi><mo>-</mo><mn>2</mn><mi mathvariant=\"normal\">γ</mi><mo>-</mo><mn>10</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": false, "image": null}, {"id": "GiyAK", "text": "<math><mn>2</mn><mi mathvariant=\"normal\">α</mi><mo>-</mo><mi mathvariant=\"normal\">β</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">γ</mi><mo>-</mo><mn>8</mn><mo>=</mo><mn>0</mn></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>1</mn></msub><mo>:</mo><mi mathvariant=\"normal\">y</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>2</mn></msub><mo>:</mo><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi>z</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">P</mi><mn>3</mn></msub><mo>:</mo><mi mathvariant=\"normal\">y</mi><mo>+</mo><mi mathvariant=\"normal\">λ</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">x</mi><mo>+</mo><mi mathvariant=\"normal\">z</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math></p><p><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image65-359bcea6-7ecd-4a0f-bc6d-4999b997de48.png\"/><br/><math><mo>∴</mo><mfenced close=\"|\" open=\"|\" separators=\"|\"><mrow><mfrac><mrow><mi mathvariant=\"normal\">β</mi><mo>+</mo><mi mathvariant=\"normal\">λ</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">α</mi><mo>+</mo><mi mathvariant=\"normal\">γ</mi><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mrow><msqrt><mn>1</mn><mo>+</mo><mn>2</mn><msup><mrow><mi mathvariant=\"normal\">λ</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></mrow></mfrac></mrow></mfenced><mo>=</mo><mo>±</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>∴</mo><mi mathvariant=\"normal\">β</mi><mo>+</mo><mi mathvariant=\"normal\">λ</mi><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">α</mi><mo>+</mo><mi mathvariant=\"normal\">γ</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mo>±</mo><mn>2</mn><msqrt><mn>1</mn><mo>+</mo><mn>2</mn><msup><mi>λ</mi><mn>2</mn></msup></msqrt></math></p><p><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image66-5ae4de7b-b22a-4750-9d45-455f35f5229a.png\"/><br/><math><mfrac><mrow><mn>1</mn><mo>-</mo><mi mathvariant=\"normal\">λ</mi></mrow><mrow><msqrt><mn>1</mn><mo>+</mo><mn>2</mn><msup><mrow><mi mathvariant=\"normal\">λ</mi></mrow><mrow><mn>2</mn></mrow></msup></msqrt></mrow></mfrac><mo>=</mo><mo>±</mo><mn>1</mn></math><br ><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">λ</mi><mo>=</mo><mo>-</mo><mn>2</mn><mo> </mo><mo> </mo><mo> </mo><mfenced><mrow><mi>λ</mi><mo>≠</mo><mn>0</mn></mrow></mfenced></math></p><p><math><mo>∴</mo><mi mathvariant=\"normal\">β</mi><mo>-</mo><mn>2</mn><mfenced separators=\"|\"><mrow><mi mathvariant=\"normal\">α</mi><mo>+</mo><mi mathvariant=\"normal\">γ</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mo>±</mo><mn>2</mn><mfenced separators=\"|\"><mrow><mn>3</mn></mrow></mfenced></math></p><p><math><mn>2</mn><mi mathvariant=\"normal\">α</mi><mo>-</mo><mi mathvariant=\"normal\">β</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">γ</mi><mo>+</mo><mn>4</mn><mo>=</mo><mn>0</mn></math> or <math><mn>2</mn><mi mathvariant=\"normal\">α</mi><mo>-</mo><mi mathvariant=\"normal\">β</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">γ</mi><mo>-</mo><mn>8</mn><mo>=</mo><mn>0</mn></math>.</p>", "image": null}, "videoSolution": {"videoId": "fd88ffa230be4b3f8630aecda525adb5", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/LMFxTkvTsR9Cy.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/LMFxTkvTsR9Cy.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf826", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015 (Paper 1)", "title": "JEE Advanced 2015 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a23f23ac7d519f9b1ab", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The equation of a plane passing through the line of intersection of the planes $x+2 y+3 z=2$ and $x-y+z=3$\r\n\r\nand at a distance $\\frac{2}{\\sqrt{3}}$ from the point $(3,1,-1)$ is", "image": null}, "options": [{"id": "ApitN", "text": "$5 x-11 y+z=17$", "isCorrect": true, "image": null}, {"id": "XwphK", "text": "$\\sqrt{2} x+y=3 \\sqrt{2}-1$", "isCorrect": false, "image": null}, {"id": "xF8Di", "text": "$x+y+z=\\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "VDNRS", "text": "$x-\\sqrt{2} y=1-\\sqrt{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Equation of the plane passing through the intersection line of given planes is\r\n\r\n$\\begin{array}{ll} \r\n\r\n& (x+2 y+3 z-2)+\\lambda(x-y+z-3)=0 \\\\\r\n\r\n\\text { or } & (1+\\lambda) x+(2-\\lambda) y+(3+\\lambda) z+(-2-3 \\lambda)=0\r\n\r\n\\end{array}$\r\n\r\n$\\because \\quad$ Its distance from the point $(3,1,-1)$ is $\\frac{2}{\\sqrt{3}}$\r\n\r\n$\\begin{array}{l}\r\n\r\n\\therefore\\left|\\frac{3(1+\\lambda)+1(2-\\lambda)-1(3+\\lambda)+(-2-3 \\lambda)}{\\sqrt{(1+\\lambda)^{2}+(2-\\lambda)^{2}+(3+\\lambda)^{2}}}\\right|=\\frac{2}{\\sqrt{3}} \\\\\r\n\r\n\\Rightarrow\\left|\\frac{-2 \\lambda}{\\sqrt{3 \\lambda^{2}+4 \\lambda+14}}\\right|=\\frac{2}{\\sqrt{3}} \\\\\r\n\r\n\\Rightarrow 3 \\lambda^{2}+4 \\lambda+14=3 \\lambda^{2} \\Rightarrow \\lambda=-\\frac{7}{2}\r\n\r\n\\end{array}$\r\n\r\n$\\therefore$ Required equation of plane is\r\n\r\n$(x+2 y+3 z-2)-\\frac{7}{2}(x-y+z-3)=0$\r\n\r\nor $5 x-11 y+z=17$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a08f23ac7d519f9b0b7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c47", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 2)", "title": "JEE Advanced 2010 (Paper 2)"}], "question": {"text": "If the distance of the point $P(1,-2,1)$ from the plane $x+2 y-2 z=\\alpha$, where $\\alpha>0$, is 5 , then the foot of the perpendicular from $P$ to the plane is", "image": null}, "options": [{"id": "ViC49", "text": "\n$\\left(\\frac{8}{3}, \\frac{4}{3},-\\frac{7}{3}\\right)$\n", "image": null, "isCorrect": true}, {"id": "zB20A", "text": "\n$\\left(\\frac{4}{3},-\\frac{4}{3}, \\frac{1}{3}\\right)$\n", "image": null, "isCorrect": false}, {"id": "ldjbO", "text": "\n$\\left(\\frac{1}{3}, \\frac{2}{3}, \\frac{10}{3}\\right)$\n", "image": null, "isCorrect": false}, {"id": "T9wrx", "text": "\n$\\left(\\frac{2}{3},-\\frac{1}{3}, \\frac{5}{2}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\text { Distance of point } P \\text { from plane }=5\n$$\n\n$$\n\\begin{gathered}\n\\therefore=\\left|\\frac{1-4-2-\\alpha}{3}\\right| \\\\\n\\alpha=10\n\\end{gathered}\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/MOxuxyIje_ig706wFu1-BnuXYO0fzZdi-AYRS4GoBC8.original.fullsize.png\"><br>\n\nFoot of perpendicular\n$$\n\\begin{aligned}\n\\quad \\frac{x-1}{1} & =\\frac{y+2}{2}=\\frac{z-1}{-2}=\\frac{5}{3} \\\\\n\\Rightarrow \\quad \\quad \\quad x & =\\frac{8}{3}, y=\\frac{4}{3}, z=-\\frac{7}{3}\n\\end{aligned}\n$$\nThus, the foot of the perpendicular is\n$$\nA\\left(\\frac{8}{3}, \\frac{4}{3},-\\frac{7}{3}\\right)\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c47", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 2)", "title": "JEE Advanced 2010 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a03f23ac7d519f9b08a", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}], "question": {"text": "If the distance between the plane $A x-2 y+z=d$ and the plane containing the lines $\\frac{x-1}{2}=\\frac{y-2}{3}=\\frac{z-3}{4} \\quad$ and $\\frac{x-2}{3}=\\frac{y-3}{4}=\\frac{z-4}{5}$ is $\\sqrt{6}$, then $|d|$ is", "image": null}, "options": [], "correctValue": "6", "solution": {"text": "Equation of plane containing the given lines is $\\left|\\begin{array}{ccc}x-1 & y-2 & z-3 \\\\ 2 & 3 & 4 \\\\ 3 & 4 & 5\\end{array}\\right|=0$\n$$\n\\begin{array}{rr}\n\\Rightarrow & (x-1)(-1)-(y-2)(-2) \\\\\n& +(z-3)(-1)=0 \\\\\n\\Rightarrow & -x+1+2 y-4-z+3=0 \\\\\n\\Rightarrow & -x+2 y-z=0 \\quad \\ldots(i)\n\\end{array}\n$$\nGiven plane is\n$$\nx-2 y+z=d\n$$\n\nEqs. (i) and (ii) are parallel.\nClearly, $\\quad A=1$\nNow, distance between plane\n$$\n\\begin{aligned}\n& =\\left|\\frac{d}{\\sqrt{1+4+1}}\\right|=\\sqrt{6} \\\\\n& \\Rightarrow \\quad|d|=6 \\\\\n&\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a01f23ac7d519f9b075", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}], "question": {"text": "Equation of the plane containing the straight line $\\frac{x}{2}=\\frac{y}{3}=\\frac{z}{4}$ and perpendicular to the plane containing the straight lines $\\frac{x}{3}=\\frac{y}{4}=\\frac{z}{2}$ and $\\frac{x}{4}=\\frac{y}{2}=\\frac{z}{3}$ is", "image": null}, "options": [{"id": "OUQfa", "text": "\n$x+2 y-2 z=0$\n", "image": null, "isCorrect": false}, {"id": "gg8Jp", "text": "\n$3 x+2 y-2 z=0$\n", "image": null, "isCorrect": false}, {"id": "mSb67", "text": "\n$x-2 y+z=0$\n", "image": null, "isCorrect": true}, {"id": "X5UmK", "text": "\n$5 x+2 y-4 z=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The DR's of normal to the plane containing $\\frac{x}{3}=\\frac{y}{4}=\\frac{z}{2}$ and $\\frac{x}{4}=\\frac{y}{2}=\\frac{z}{3}$. $\\Rightarrow \\quad \\overrightarrow{\\mathbf{n}}_1=\\left|\\begin{array}{ccc}\\hat{\\mathbf{i}} & \\hat{\\mathbf{j}} & \\hat{\\mathbf{k}} \\\\ 3 & 4 & 2 \\\\ 4 & 2 & 3\\end{array}\\right|=(8 \\hat{\\mathbf{i}}-\\hat{\\mathbf{j}}-10 \\hat{\\mathbf{k}})$\nAlso, equation of plane containing $\\frac{x}{2}=\\frac{y}{3}=\\frac{z}{4}$ and DR's of normal to be $\\overrightarrow{\\mathbf{n}}_2=a \\hat{\\mathbf{i}}+b \\hat{\\mathbf{j}}+c \\hat{\\mathbf{k}}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/ESo5D22LF0O07y3bQ2iMsKp6KgLfKJluZJ1-oU31OXI.original.fullsize.png\"><br>\n\n$$\n\\begin{array}{ll}\n\\Rightarrow & a x+b y+c z=0 \\\\\n\\text { where, } \\overrightarrow{\\mathbf{n}}_1 \\cdot \\overrightarrow{\\mathbf{n}}_2=0 \\\\\n\\Rightarrow & 8 a-b-10 c=0 \\\\\n\\text { and } & \\overrightarrow{\\mathbf{n}}_2 \\perp(2 \\hat{\\mathbf{i}}+3 \\hat{\\mathbf{j}}+4 \\hat{\\mathbf{k}}) \\\\\n\\Rightarrow & 2 a+3 b+4 c=0\n\\end{array}\n$$\nFrom Eqs. (ii) and (iii), we get\n$$\n\\begin{aligned}\n& \\frac{a}{-1 \\quad-10}=\\frac{b}{8}=\\frac{c}{-1} \\\\\n\\Rightarrow \\quad \\frac{a}{-4+30} & =\\frac{b}{-20-32}=\\frac{c}{24+2} \\\\\n\\Rightarrow \\quad \\quad \\quad \\frac{a}{26} & =\\frac{b}{-52}=\\frac{c}{26} \\\\\n\\Rightarrow \\quad \\quad \\quad \\quad \\frac{a}{1} & =\\frac{b}{-2}=\\frac{c}{1}\n\\end{aligned}\n$$\nFrom Eqs. (i) and (iv), required equation of plane, is $x-2 y+z=0$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169cdf23ac7d519f9ae9b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}], "question": {"text": "A plane passes through $(1,-2,1)$ and is perpendicular to two planes $2 x-2 y+z=0$ and $x-y+2 z=4$, then the distance of the plane from the point $(1,2,2)$ is", "image": null}, "options": [{"id": "xsIVN", "text": "\n0\n", "image": null, "isCorrect": false}, {"id": "w05B9", "text": "\n1\n", "image": null, "isCorrect": false}, {"id": "A932R", "text": "\n$\\sqrt{2}$\n", "image": null, "isCorrect": false}, {"id": "L8jm9", "text": "\n$2 \\sqrt{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the equation of plane be,\n$$\na(x-1)+b(y+2)+c(z-1)=0\n$$\nwhich is perpendicular to $2 x-2 y+z=0$ and $x-y+2 z=4$\n$$\n\\begin{array}{llrl}\n\\Rightarrow & 2 a-2 b+c & =0 \\text { and } a-b+2 c=0 \\\\\n\\text { or } & \\frac{a}{-2} 1 & =\\frac{b}{2}=\\frac{c}{-2} \\\\\n\\Rightarrow & -12 & 1 & -1 \\\\\n\\Rightarrow & \\frac{a}{-3} & =\\frac{b}{-3}=\\frac{c}{0} \\\\\n& \\frac{a}{1}=\\frac{b}{1}=\\frac{c}{0}\n\\end{array}\n$$\nSo, the equation of plane is,\n$x-1+y+2=0$ or $x+y+1=0$, its distance from the point $(1,2,2)$ is $\\frac{|1+2+1|}{\\sqrt{2}}=2 \\sqrt{2}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64b16ae0f23ac7d519f9b90a", "title": "Line and Plane", "totalQuestions": 10, "questions": [{"_id": "685102bd6bba689a3eb09c73", "type": "multipleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "684c67d769037fad219cb0c1", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 1)", "title": "JEE Advanced 2025 (Paper 1)"}], "question": {"text": "Let $L_1$ be the line of intersection of the planes given by the equation- $2 x+3 y+z=4 \\text { and } x+2 y+z=5 .$\nLet $L_2$ be the line passing through the point $P(2,-1,3)$ and parallel to $L_1$. Let $M$ denote the plane given by the equation- $2 x+y-2 z=6$\nSuppose that the line $L_2$ meets the plane $M$ at the point $Q$. Let $R$ be the foot of the perpendicular drawn from $P$ to the plane $M$.\nThen which of the following statements is (are) TRUE?", "image": null}, "options": [{"id": "FTpQZ", "text": "The length of the line segment $P Q$ is $9 \\sqrt{3}$", "image": null, "isCorrect": true}, {"id": "LISQv", "text": "The length of the line segment $Q R$ is 15", "image": null, "isCorrect": false}, {"id": "7XWHU", "text": "The area of $\\triangle P Q R$ is $\\frac{3}{2} \\sqrt{234}$", "image": null, "isCorrect": true}, {"id": "jfzmM", "text": "The acute angle between the line segments $P Q$ and $P R$ is $\\cos ^{-1}\\left(\\frac{1}{2 \\sqrt{3}}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $L_1: \\vec{r}=\\vec{a}+t \\vec{b}$\n$\\overrightarrow{\\mathrm{b}}=\\left|\\begin{array}{ccc}\\hat{\\mathrm{i}} & \\hat{\\mathrm{j}} & \\hat{\\mathrm{k}} \\\\ 2 & 3 & 1 \\\\ 1 & 2 & 1\\end{array}\\right|=\\hat{\\mathrm{i}}(1)-\\hat{\\mathrm{j}}(1)+\\hat{\\mathrm{k}}(1)$\nDr's of $L_1: <1,-1,1>$\n$\\begin{aligned}\n& L_1: \\frac{x+1}{1}=\\frac{y-0}{-1}=\\frac{z-6}{1} \\\\\n& \\& L_2: \\frac{x-2}{1}=\\frac{y+1}{-1}=\\frac{z-3}{1}=\\lambda \\\\\n& M: 2 x+y-2 z-6=0\n\\end{aligned}$\nLet point on $\\mathrm{L}_2(\\lambda+2,-\\lambda-1, \\lambda+3)$\n$\\begin{aligned}\n& 2(\\lambda+2)-\\lambda-1-2 \\lambda-6-6=0 \\\\\n& 2 \\lambda+4-3 \\lambda-13=0 \\\\\n& \\lambda=-9 \\\\\n& \\therefore Q(-7,8,-6)\n\\end{aligned}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/J_-cnHbNEsFw31b7TfQK1lk9TvbcJFMDBjMc2Ih_VAA.original.fullsize.png\"><br>Line PR: $\\frac{x-2}{2}=\\frac{y+1}{1}=\\frac{z-3}{-2}=\\mu$\n$\\mathrm{R}(2 \\mu+2, \\mu-1,-2 \\mu+3)$\nPut in plane\n$\\begin{aligned}\n& 2(2 \\mu+2)+\\mu-1-2(-2 \\mu+3)-6=0 \\\\\n& 4 \\mu+4+\\mu-1+4 \\mu-6-6=0 \\\\\n& 9 \\mu-9=0 \\Rightarrow \\mu=1 \\\\\n& \\mathrm{R}(4,0,1) \\\\\n& \\mathrm{P}(2,-1,3) \\& \\mathrm{Q}(-7,8,-6) \\\\\n& \\mathrm{PQ}=\\sqrt{81+81+81}=9 \\sqrt{3} \\\\\n& \\mathrm{Q}(-7,8,-6) \\& \\mathrm{R}(4,0,1)\n\\end{aligned}$\n$\\mathrm{QR}=\\sqrt{121+64+49}=\\sqrt{234}$\nArea ( $\\triangle \\mathrm{PQR}$ )\n$\\begin{aligned}\n& =\\frac{1}{2}|\\overrightarrow{\\mathrm{QP}} \\times \\overrightarrow{\\mathrm{QR}}| \\\\\n& =\\frac{1}{2}\\left|\\begin{array}{ccc}\n\\hat{\\mathrm{i}} & \\hat{\\mathrm{j}} & \\hat{\\mathrm{k}} \\\\\n9 & -9 & 9 \\\\\n11 & -8 & 7\n\\end{array}\\right| \\\\\n& =\\frac{3}{2} \\sqrt{234} \\\\\n& \\overrightarrow{\\mathrm{PQ}}=-9 \\hat{\\mathrm{i}}+9 \\hat{\\mathrm{j}}-9 \\hat{\\mathrm{k}}=-9(\\hat{\\mathrm{i}}-\\hat{\\mathrm{j}}+\\hat{\\mathrm{k}}) \\\\\n& \\overrightarrow{\\mathrm{PR}}=2 \\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}-2 \\hat{\\mathrm{k}}\n\\end{aligned}$\n$\\begin{aligned} & \\cos \\theta=\\left|\\frac{\\overrightarrow{\\mathrm{PQ}} \\cdot \\overrightarrow{\\mathrm{PR}}}{\\mathrm{PQ} \\cdot \\mathrm{PR}}\\right| \\\\ & =\\frac{9}{9 \\sqrt{3} \\times 3}=\\frac{1}{3 \\sqrt{3}} \\\\ & \\theta=\\cos ^{-1}\\left(\\frac{1}{3 \\sqrt{3}}\\right)\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "185094d0910c47b1bac2d4b6b485b51a", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/E02eI9lLj6F9h.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/E02eI9lLj6F9h.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "684c67d769037fad219cb0c1", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 1)", "title": "JEE Advanced 2025 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66965decd603121f43a45652", "type": "multipleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}], "question": {"text": "A straight line drawn from the point $P(1,3,2)$, parallel to the line $\\frac{x-2}{1}=\\frac{y-4}{2}=\\frac{z-6}{1}$, intersects the plane $L_1: x-y+3 z=6$ at the point $Q$. Another straight line which passes through $Q$ and is perpendicular to the plane $L_1$ intersects the plane $L_2: 2 x-y+z=-4$ at the point $R$. Then which of the following statements is (are) TRUE?", "image": null}, "options": [{"id": "ksZUH", "text": "The length of the line segment $P Q$ is $\\sqrt{6}$", "image": null, "isCorrect": true}, {"id": "pyhT5", "text": "The coordinates of $R$ are $(1,6,3)$", "image": null, "isCorrect": false}, {"id": "haZcq", "text": "The centroid of the triangle $P Q R$ is $\\left(\\frac{4}{3}, \\frac{14}{3}, \\frac{5}{3}\\right)$", "image": null, "isCorrect": true}, {"id": "RWGjU", "text": "The perimeter of the triangle $P Q R$ is $\\sqrt{2}+\\sqrt{6}+\\sqrt{11}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { line }: \\frac{x-1}{1}=\\frac{y-3}{2}=\\frac{z-2}{1} \\\\ & (x, y, z)=(\\lambda+1,2 \\lambda+3, \\lambda+2)\\end{aligned}$\nPut in $L_1: x-y+3 z=6$\n$\\begin{aligned} & (\\lambda+1)-(2 \\lambda+3)+3(\\lambda+2)=6 \\\\ & 2 \\lambda=2 \\Rightarrow \\lambda=1 \\\\ & Q=(2,5,3)\\end{aligned}$\nline : $\\frac{x-2}{1}=\\frac{y-5}{-1}=\\frac{z-3}{3}$\n$(x, y, z)=(t+2,5-t, 3 t+3)$\nPut in $L_2: 2 x-y+z=-4$\n$\\begin{aligned} & 2(t+4)-(5-t)+(3 t+3)=-4 \\\\ & 6 t=-6 \\Rightarrow t=-1 \\\\ & R=(1,6,0)\\end{aligned}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/hMxu0QMTmRDFM-zjZWhrDMjo-ctoViJEHl1Hh2diatk.original.fullsize.png\">\n$\\begin{aligned} & \\text { Perimeter }=\\sqrt{6}+\\sqrt{13}+\\sqrt{11} \\\\ & \\text { Centroid }=\\left(\\frac{4}{3}, \\frac{14}{3}, \\frac{5}{3}\\right)\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "cacafd6e013b4fdfa29c9d90a45a1643", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/75Cc2gEVYDoW9.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/75Cc mn>2</mn></mfrac><mo>=</mo><mfrac><mi>y</mi><mrow><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>+</mo><mn>3</mn></mrow><mn>1</mn></mfrac><mo>=</mo><msub><mi>k</mi><mn>1</mn></msub><mo>&#160;</mo><mfenced><mrow><mi>s</mi><mi>a</mi><mi>y</mi></mrow></mfenced><mspace linebreak=\"newline\"></mspace><msub><mi>L</mi><mrow><mn>2</mn><mo>&#160;</mo><mo>&#160;</mo></mrow></msub><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mfrac><mrow><mi>x</mi><mo>-</mo><mn>4</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>+</mo><mn>3</mn></mrow><mn>1</mn></mfrac><mo>&#160;</mo><mo>=</mo><mfrac><mrow><mi>z</mi><mo>+</mo><mn>3</mn></mrow><mn>2</mn></mfrac><mo>=</mo><msub><mi>k</mi><mn>2</mn></msub><mo>&#160;</mo><mo>&#160;</mo><mfenced><mrow><mi>s</mi><mi>a</mi><mi>y</mi></mrow></mfenced></math></p><p>And equation of two planes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><mtext>:&#160;</mtext><mn>7</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mn>2</mn><mi>z</mi><mo>=</mo><mn>3</mn><mtext>,</mtext><mspace linebreak=\"newline\"></mspace><msub><mi>P</mi><mn>2</mn></msub><mtext>:&#160;</mtext><mn>3</mn><mi>x</mi><mo>+</mo><mn>5</mn><mi>y</mi><mo>-</mo><mn>6</mn><mi>z</mi><mo>=</mo><mn>4</mn><mtext>.</mtext></math></p><p>Evaluating unit vector&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>n</mi><mo>^</mo></mover></math>&nbsp;perpendicular to both the given planes P<sub>1&nbsp;</sub>and P<sub>2</sub><br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mover><mi>n</mi><mo>&#8594;</mo></mover><mo>=</mo><mfenced open=\"|\" close=\"|\"><mtable><mtr><mtd><mover><mtext>i</mtext><mo>^</mo></mover></mtd><mtd><mover><mtext>j</mtext><mo>^</mo></mover></mtd><mtd><mover><mi mathvariant=\"normal\">k</mi><mo>^</mo></mover></mtd></mtr><mtr><mtd><mn>7</mn></mtd><mtd><mn>1</mn></mtd><mtd><mn>2</mn></mtd></mtr><mtr><mtd><mn>3</mn></mtd><mtd><mn>5</mn></mtd><mtd><mo>-</mo><mn>6</mn></mtd></mtr></mtable></mfenced><mspace linebreak=\"newline\"/><mo>=</mo><mover><mi>i</mi><mo>^</mo></mover><mfenced><mrow><mfenced><mrow><mo>-</mo><mn>6</mn><mo>.</mo><mn>1</mn></mrow></mfenced><mo>-</mo><mfenced><mrow><mn>2</mn><mo>.</mo><mn>5</mn></mrow></mfenced></mrow></mfenced><mo>-</mo><mover><mi>j</mi><mo>^</mo></mover><mfenced><mrow><mfenced><mrow><mo>-</mo><mn>6</mn><mo>.</mo><mn>7</mn></mrow></mfenced><mo>-</mo><mfenced><mrow><mn>2</mn><mo>.</mo><mn>3</mn></mrow></mfenced></mrow></mfenced><mo>+</mo><mover><mi>k</mi><mo>^</mo></mover><mfenced><mrow><mfenced><mrow><mn>5</mn><mo>.</mo><mn>7</mn></mrow></mfenced><mo>-</mo><mfenced><mrow><mn>3</mn><mo>.</mo><mn>1</mn></mrow></mfenced></mrow></mfenced><mspace linebreak=\"newline\"/><mo>=</mo><mfenced><mrow><mo>-</mo><mn>6</mn><mo>-</mo><mn>10</mn></mrow></mfenced><mover><mi>i</mi><mo>^</mo></mover><mo>-</mo><mfenced><mrow><mo>-</mo><mn>42</mn><mo>-</mo><mn>6</mn></mrow></mfenced><mover><mi>j</mi><mo>^</mo></mover><mo>+</mo><mfenced><mrow><mn>35</mn><mo>-</mo><mn>3</mn></mrow></mfenced><mover><mi>k</mi><mo>^</mo></mover><mspace linebreak=\"newline\"/><mo>=</mo><mo>-</mo><mn>16</mn><mover><mi>i</mi><mo>^</mo></mover><mo>+</mo><mn>48</mn><mover><mi>j</mi><mo>^</mo></mover><mo>+</mo><mn>32</mn><mover><mi>k</mi><mo>^</mo></mover><mspace linebreak=\"newline\"/><mo>&#8658;</mo><mover><mi>n</mi><mo>&#8594;</mo></mover><mo>=</mo><mfenced><mrow><mover><mi>i</mi><mo>^</mo></mover><mo>-</mo><mn>3</mn><mover><mi>j</mi><mo>^</mo></mover><mo>-</mo><mn>2</mn><mover><mi>k</mi><mo>^</mo></mover></mrow></mfenced></math></p><p>Now, the point of intersection of line<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><msub><mi>L</mi><mn>1</mn></msub></math>&nbsp;and<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><msub><mi>L</mi><mn>2</mn></msub><mo>&#160;</mo></math>be <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><msub><mi>x</mi><mn>1</mn></msub><mo>,</mo><msub><mi>y</mi><mn>1</mn></msub><mo>,</mo><msub><mi>z</mi><mn>1</mn></msub><mo>)</mo></math></p><p>So, the point will satisfy the equation of line</p><p>Hence,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>-</mo><mn>1</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><msub><mi>y</mi><mn>1</mn></msub><mrow><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>z</mi><mn>1</mn></msub><mo>+</mo><mn>3</mn></mrow><mn>1</mn></mfrac><mo>=</mo><msub><mi>k</mi><mn>1</mn></msub><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mfrac><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>-</mo><mn>1</mn></mrow><mn>2</mn></mfrac><mo>=</mo><msub><mi>k</mi><mn>1</mn></msub><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><msub><mi>x</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><mn>1</mn><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>&#160;</mo><mfenced><mi>i</mi></mfenced><mspace linebreak=\"newline\"></mspace><mi>a</mi><mi>l</mi><mi>s</mi><mi>o</mi><mo>,</mo><mo>&#160;</mo><mi>L</mi><mn>2</mn><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mfrac><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>-</mo><mn>4</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><msub><mi>y</mi><mn>1</mn></msub><mo>-</mo><mn>3</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><msub><mi>z</mi><mn>1</mn></msub><mo>+</mo><mn>3</mn></mrow><mn>2</mn></mfrac><mo>=</mo><msub><mi>k</mi><mn>2</mn></msub><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mfrac><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>-</mo><mn>4</mn></mrow><mn>1</mn></mfrac><mo>=</mo><msub><mi>k</mi><mn>2</mn></msub><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><msub><mi>x</mi><mn>1</mn></msub><mo>=</mo><msub><mi>k</mi><mn>2</mn></msub><mo>+</mo><mn>4</mn><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>&#160;</mo><mfenced><mrow><mi>i</mi><mi>i</mi></mrow></mfenced></math></p><p>Comparing equation (i) and (ii) we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><msub><mi>k</mi><mn>2</mn></msub><mo>+</mo><mn>4</mn><mo>=</mo><mn>2</mn><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><mn>1</mn><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><msub><mi>k</mi><mn>2</mn></msub><mo>=</mo><mn>2</mn><msub><mi>k</mi><mn>1</mn></msub><mo>-</mo><mn>3</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>&#160;</mo><mfenced><mi>a</mi></mfenced></math></p><p>Similarly,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><msub><mi>y</mi><mn>1</mn></msub><mrow><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><msub><mi>k</mi><mn>1</mn></msub><mo>&#160;</mo><mo>&#8658;</mo><msub><mi>y</mi><mn>1</mn></msub><mo>=</mo><mo>-</mo><msub><mi>k</mi><mn>1</mn></msub><mo>&#160;</mo><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>&#160;</mo><mfenced><mrow><mi>i</mi><mi>i</mi><mi>i</mi></mrow></mfenced><mspace linebreak=\"newline\"></mspace><mfrac><mrow><msub><mi>y</mi><mn>1</mn></msub><mo>+</mo><mn>3</mn></mrow><mn>1</mn></mfrac><mo>=</mo><msub><mi>k</mi><mn>2</mn></msub><mo>&#160;</mo><mo>&#8658;</mo><mo>&#160;</mo><msub><mi>y</mi><mn>1</mn></msub><mo>=</mo><msub><mi>k</mi><mn>2</mn></msub><mo>-</mo><mn>3</mn><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>&#160;</mo><mfenced><mrow><mi>i</mi><mi>v</mi></mrow></mfenced></math></p><p>Compare equation (iii) and (iv)</p><p>-k<sub>1</sub>=k<sub>2</sub>-3</p><p>k<sub>2</sub>=3-k<sub>1</sub>&nbsp; .... (b)</p><p>Now, compare equation (a) and (b)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>-</mo><msub><mi>k</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><msub><mi>k</mi><mn>1</mn></msub><mo>-</mo><mn>3</mn><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mn>3</mn><msub><mi>k</mi><mn>1</mn></msub><mo>=</mo><mn>6</mn><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><msub><mi>k</mi><mn>1</mn></msub><mo>=</mo><mn>2</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>a</mi><mi>n</mi><mi>d</mi><mo>&#160;</mo><msub><mi>k</mi><mn>2</mn></msub><mo>=</mo><mn>3</mn><mo>-</mo><mn>2</mn><mo>=</mo><mn>1</mn></math></p><p>So, point of intersection is obtained by substituting k<sub>1</sub>&nbsp;in L<sub>1</sub>&nbsp;or k<sub>2</sub> in L<sub>2</sub></p><p>So,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><msub><mi>x</mi><mn>1</mn></msub><mo>-</mo><mn>2</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mi>y</mi><mrow><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>+</mo><mn>3</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mn>2</mn></math></p><p>Now, equation of plane having unit vector</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>A</mi><mo>&#8640;</mo></mover><mo>=</mo><mover><mi>i</mi><mo>^</mo></mover><mo>-</mo><mn>3</mn><mover><mi>j</mi><mo>^</mo></mover><mo>-</mo><mn>2</mn><mover><mi>k</mi><mo>^</mo></mover></math>&nbsp;and passing through point (5,-2,-1)</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>1</mn><mfenced><mrow><mi>x</mi><mo>-</mo><mn>5</mn></mrow></mfenced><mo>-</mo><mn>3</mn><mfenced><mrow><mi>y</mi><mo>+</mo><mn>2</mn></mrow></mfenced><mo>-</mo><mn>2</mn><mfenced><mrow><mi>z</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>0</mn><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mi>x</mi><mo>-</mo><mn>5</mn><mo>-</mo><mn>3</mn><mi>y</mi><mo>-</mo><mn>6</mn><mo>-</mo><mn>2</mn><mi>z</mi><mo>-</mo><mn>2</mn><mo>=</mo><mn>0</mn><mspace linebreak=\"newline\"></mspace><mo>&#8658;</mo><mi>x</mi><mo>-</mo><mn>3</mn><mi>y</mi><mo>-</mo><mn>2</mn><mi>z</mi><mo>=</mo><mn>13</mn></math></p><p>Compare the above equation with ax+by+cz=d</p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>1 ak=\"newline\"/><mo>&#8658;</mo><mi>&#956;</mi><mo>=</mo><mn>2</mn></math></p><p>Hence the coordinates of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>M</mi></math>&nbsp;are<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mtext>M</mtext><mfenced><mtext>0, 1, 2</mtext></mfenced></math><br />Similarly foot of perpendicular from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>B</mi><mo>(</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>2</mn><mo>,</mo><mo>&#160;</mo><mn>3</mn><mo>)</mo></math> on plane is N <math> <mrow> <mfenced close=\")\" open=\"(\" separators=\",\"> <mrow> <mfrac> <mrow> <mn>2</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mtext>,</mtext> <mfrac> <mrow> <mo>-</mo> <mn>4</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> <mtext>,</mtext> <mfrac> <mrow> <mn>1</mn> <mn>1</mn> </mrow> <mrow> <mn>3</mn> </mrow> </mfrac> </mrow> </mfenced> </mrow> </math><br />So the required equation of MN is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mtext>x</mtext><mo>-</mo><mn>0</mn></mrow><mfrac><mn>2</mn><mn>3</mn></mfrac></mfrac><mo>=</mo><mfrac><mrow><mtext>y</mtext><mo>-</mo><mn>1</mn></mrow><mfrac><mrow><mo>-</mo><mn>7</mn></mrow><mn>3</mn></mfrac></mfrac><mo>=</mo><mfrac><mrow><mtext>z</mtext><mo>-</mo><mn>2</mn></mrow><mfrac><mn>5</mn><mn>3</mn></mfrac></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfrac><mrow><mtext>x</mtext><mo>-</mo><mn>0</mn></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mtext>y</mtext><mo>-</mo><mn>1</mn></mrow><mrow><mo>-</mo><mn>7</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mtext>z</mtext><mo>-</mo><mn>2</mn></mrow><mn>5</mn></mfrac></math></p>", "image": null}, "videoSolution": {"videoId": "3457ea2db1bf484bbf3ae50af1cc71f4", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/XdasUPbwUcdAr.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/XdasUPbwUcdAr.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf822", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 1)", "title": "JEE Advanced 2013 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a24f23ac7d519f9b1b9", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "If the straight lines $\\frac{x-1}{2}=\\frac{y+1}{k}=\\frac{z}{2}$ and $\\frac{x+1}{5}=\\frac{y+1}{2}=\\frac{z}{k}$ are coplanar, then the plane (s) containing these two lines is (are)", "image": null}, "options": [{"id": "sgk7G", "text": "$y+2 z=-1$", "isCorrect": false, "image": null}, {"id": "x63Vq", "text": "$y+z=-1$", "isCorrect": true, "image": null}, {"id": "vmvUk", "text": "$y-z=-1$", "isCorrect": true, "image": null}, {"id": "vWI7l", "text": "$y-2 z=-1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given that lines are coplanar.\r\n\r\n$\\therefore\\left|\\begin{array}{ccc}\r\n\r\nx_{2}-x_{1} & y_{2}-y_{1} & z_{2}-z_{1} \\\\\r\n\r\na_{1} & b_{1} & c_{1} \\\\\r\n\r\na_{2} & b_{2} & c_{2}\r\n\r\n\\end{array}\\right|=\\left|\\begin{array}{ccc}\r\n\r\n2 & 0 & 0 \\\\\r\n\r\n2 & k & 2 \\\\\r\n\r\n5 & 2 & k\r\n\r\n\\end{array}\\right|=0 \\Rightarrow k=\\pm 2$\r\n\r\nFor $k=2$, equation of the plane is given by $\\left|\\begin{array}{ccc}x-1 & y+1 & z \\\\ 2 & 2 & 2 \\\\ 5 & 2 & 2\\end{array}\\right|=0 \\Rightarrow y-z+1=0$\r\n\r\nFor $k=-2$, equation of the plane is given by $\\left|\\begin{array}{ccc}x-1 & y+1 & z \\\\ 2 & -2 & 2 \\\\ 5 & 2 & -2\\end{array}\\right|=0 \\Rightarrow y+z+1=0$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a1df23ac7d519f9b173", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The point $P$ is the intersection of the straight line joining the points $Q(2,3,5)$ and $R(1,-1,4)$ with the plane $5 x-4 y-$ $z=1$. If $S$ is the foot of the perpendicular drawn from the point $T(2,1,4)$ to $Q R$, then the length of the line segment $P S$ is", "image": null}, "options": [{"id": "ZDcSR", "text": "$\\frac{1}{\\sqrt{2}}$", "isCorrect": true, "image": null}, {"id": "l9utU", "text": "$\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "6VdHh", "text": "2", "isCorrect": false, "image": null}, {"id": "d0LFe", "text": "$2 \\sqrt{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Equation of st. line joining $Q(2,3,5)$ and $R(1,-1,4)$ is\r\n\r\n$\\frac{x-2}{-1}=\\frac{y-3}{-4}=\\frac{z-5}{1}=\\lambda$\r\n\r\nLet $P(-\\lambda+2,-4 \\lambda+3,-\\lambda+5)$\r\n\r\nSince $P$ also lies on $5 x-4 y-z=1$\r\n\r\n$\\therefore-5 \\lambda+10+16 \\lambda-12+\\lambda-5=1$\r\n\r\n$\\Rightarrow 12 \\lambda=8 \\Rightarrow \\lambda=\\frac{2}{3} \\quad \\therefore P=\\left(\\frac{4}{3}, \\frac{1}{3}, \\frac{13}{3}\\right)$\r\n\r\nNow let another point $S$ on $Q R$ be\r\n\r\n$(-\\mu+2,-4 \\mu+3,-\\mu+5)$\r\n\r\nSince $S$ is the foot of perpendicular drawn from\r\n\r\n$T(2,1,4)$ to $Q R$, where dr's of $S T$ are $\\mu, 4 \\mu-2, \\mu-1$ and dr's of $Q R$ are $-1,-4,-1$\r\n\r\n$\\begin{array}{ll}\r\n\r\n\\therefore & -\\mu-16 \\mu+8-\\mu+1=0 \\Rightarrow 18 \\mu=9 \\Rightarrow \\mu=\\frac{1}{2} \\\\\r\n\r\n\\therefore & S=\\left(\\frac{3}{2}, 1, \\frac{9}{2}\\right)\r\n\r\n\\end{array}$\r\n\r\n$\\therefore \\quad$ Distance between $P$ and $S$\r\n\r\n$\\begin{array}{l}\r\n\r\n=\\sqrt{\\left(\\frac{4}{3}-\\frac{3}{2}\\right)^{2}+\\left(\\frac{1}{3}-1\\right)^{2}+\\left(\\frac{13}{3}-\\frac{9}{2}\\right)^{2}} \\\\\r\n\r\n=\\sqrt{\\frac{1}{36}+\\frac{4}{9}+\\frac{1}{36}}=\\frac{1}{\\sqrt{2}}\r\n\r\n\\end{array}$\r\n\r\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/1Mtc8ys_t6stqipxTkbwUmoLcXdKw_dHQOJ0oBV5RNY.original.fullsize.png\">", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169f8f23ac7d519f9b027", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c45", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 2)", "title": "JEE Advanced 2009 (Paper 2)"}], "question": {"text": "A line with positive direction cosines passes through the point $P(2,-1,2)$ and makes equal angles with the coordinate axes. The line meets the plane $2 x+y+z=9$ at point $Q$. The length of the line segment $P Q$ equals", "image": null}, "options": [{"id": "P3IRj", "text": "\n1\n", "image": null, "isCo "question": {"text": "<strong>Paragraph:</strong>\nConsider the lines: $L_1: \\frac{x+1}{3}=\\frac{y+2}{1}=\\frac{z+1}{2}, L_2: \\frac{x-2}{1}=\\frac{y+2}{2}=\\frac{z-3}{3}$<strong>Question:</strong>\nThe distance of the point $(1,1,1)$ from the plane passing through the point $(-1,-2,-1)$ and whose normal is perpendicular to both the lines $L_1$ and $L_2$, is", "image": null}, "options": [{"id": "ojk6c", "text": "\n$2 / \\sqrt{75}$\n", "image": null, "isCorrect": false}, {"id": "YTsPA", "text": "\n$7 / \\sqrt{75}$\n", "image": null, "isCorrect": false}, {"id": "FkER8", "text": "\n$13 / \\sqrt{75}$\n", "image": null, "isCorrect": true}, {"id": "rUwR7", "text": "\n$23 / \\sqrt{75}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the plane passing through the point $(-1,-2,-1)$ and whose normal is perpendicular to both the given lines $L_1$ and $L_2$ may be written as\n$$\n\\begin{array}{rlrl}\n\\Rightarrow \\quad(x+1)+7(y+2)-5(z+1) & =0 \\\\\n& x+7 y-5 z+10 & =0\n\\end{array}\n$$\nThe distance of the point $(1,1,1)$ from the plane\n$$\n=\\left|\\frac{1+7-5+10}{\\sqrt{1+49+25}}\\right|=\\frac{13}{\\sqrt{75}}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
