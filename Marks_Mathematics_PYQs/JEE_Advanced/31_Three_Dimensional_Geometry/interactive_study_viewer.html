ow><mn>1</mn></mfrac><mo>=</mo><mfrac><mi>y</mi><mrow><mo>&#8722;</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>&#8722;</mo><mn>1</mn></mrow><mn>3</mn></mfrac></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub><mo>:</mo><mfrac><mrow><mi>x</mi><mo>&#8722;</mo><mn>1</mn></mrow><mrow><mo>&#8722;</mo><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mi>y</mi><mrow><mo>&#8722;</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>&#8722;</mo><mn>1</mn></mrow><mn>1</mn></mfrac></math><br />Suppose the straight line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>:</mo><mfrac><mrow><mi>x</mi><mo>&#8722;</mo><mi>&#945;</mi></mrow><mi>l</mi></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>&#8722;</mo><mn>1</mn></mrow><mi>m</mi></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>&#8722;</mo><mi>&#947;</mi></mrow><mrow><mo>&#8722;</mo><mn>2</mn></mrow></mfrac></math> lies in the plane containing <math><mrow><msub><mi>L</mi><mn>1</mn></msub></mrow></math> and <math><mrow><msub><mi>L</mi><mn>2</mn></msub></mrow></math>, and passes through the point of intersection of <math><mrow><msub><mi>L</mi><mn>1</mn></msub></mrow></math> and <math><mrow><msub><mi>L</mi><mn>2</mn></msub></mrow></math>. If the line <math><mi>L</mi></math> bisects the acute angle between the lines <math><mrow><msub><mi>L</mi><mn>1</mn></msub></mrow></math> and <math><mrow><msub><mi>L</mi><mn>2</mn></msub></mrow></math>, then which of the following statements is/are TRUE?", "image": null}, "options": [{"id": "rmm6u", "text": "<math><mrow><mi>&#945;</mi><mo>&#8722;</mo><mi>&#947;</mi><mo>=</mo><mn>3</mn></mrow></math>", "isCorrect": true, "image": null}, {"id": "jkfhP", "text": "<math><mrow><mi>l</mi><mo>+</mo><mi>m</mi><mo>=</mo><mn>2</mn></mrow></math>", "isCorrect": true, "image": null}, {"id": "9ISUo", "text": "<math><mrow><mi>&#945;</mi><mo>&#8722;</mo><mi>&#947;</mi><mo>=</mo><mn>1</mn></mrow></math>", "isCorrect": false, "image": null}, {"id": "lurko", "text": "<math><mrow><mi>l</mi><mo>+</mo><mi>m</mi><mo>=</mo><mn>0</mn></mrow></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given the lines&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub><mo>:</mo><mfrac><mrow><mi>x</mi><mo>&#8722;</mo><mn>1</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mi>y</mi><mrow><mo>&#8722;</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>&#8722;</mo><mn>1</mn></mrow><mn>3</mn></mfrac></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub><mo>:</mo><mfrac><mrow><mi>x</mi><mo>&#8722;</mo><mn>1</mn></mrow><mrow><mo>-</mo><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mi>y</mi><mrow><mo>&#8722;</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>&#8722;</mo><mn>1</mn></mrow><mn>1</mn></mfrac></math>.</p><p>From the given lines, we can say that both the lines pass&nbsp;through the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced></math>.</p><p>Now, let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>a</mi><mo>&#8594;</mo></mover></math>&nbsp;be the direction vector of line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub></math>&nbsp;i.e.,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>a</mi><mo>&#8594;</mo></mover><mo>=</mo><mi>i</mi><mo>-</mo><mi>j</mi><mo>+</mo><mn>3</mn><mi>k</mi></math>&nbsp;and let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>b</mi><mo>&#8594;</mo></mover></math>&nbsp;be the direction vector of line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>2</mn></msub></math>&nbsp;i.e.,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>b</mi><mo>&#8594;</mo></mover><mo>=</mo><mo>-</mo><mn>3</mn><mi>i</mi><mo>-</mo><mi>j</mi><mo>+</mo><mi>k</mi></math>.</p><p>We also know that the angle bisectors lie&nbsp;in the direction of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mover><mi>a</mi><mo>&#8594;</mo></mover><mo>+</mo><mover><mi>b</mi><mo>&#8594;</mo></mover></mrow></mfenced><mo>&#160;</mo><mtext>or</mtext><mo>&#160;</mo><mfenced><mrow><mover><mi>a</mi><mo>&#8594;</mo></mover><mo>-</mo><mover><mi>b</mi><mo>&#8594;</mo></mover></mrow></mfenced></math>.</p><p>Now,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>a</mi><mo>&#8594;</mo></mover><mo>.</mo><mover><mi>b</mi><mo>&#8594;</mo></mover><mo>=</mo><mfenced><mrow><mn>1</mn><mo>&#215;</mo><mo>-</mo><mn>3</mn></mrow></mfenced><mo>+</mo><mfenced><mrow><mo>-</mo><mn>1</mn><mo>&#215;</mo><mo>-</mo><mn>1</mn></mrow></mfenced><mo>+</mo><mfenced><mrow><mn>3</mn><mo>&#215;</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mo>-</mo><mn>3</mn><mo>+</mo><mn>1</mn><mo>+</mo><mn>3</mn><mo>=</mo><mn>1</mn><mo>&#62;</mo><mn>0</mn></math>.</p><p>So, direction ratios of the acute angle bisector between two lines will be in the direction of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>a</mi><mo>&#8594;</mo></mover><mo>+</mo><mover><mi>b</mi><mo>&#8594;</mo></mover></math>&nbsp;i.e.,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>-</mo><mn>3</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>1</mn><mo>-</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>3</mn><mo>+</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mfenced><mrow><mo>&#8722;</mo><mn>2</mn><mo>&#160;</mo><mo>,</mo><mo>&#160;</mo><mo>&#8722;</mo><mn>2</mn><mo>&#160;</mo><mo>,</mo><mo>&#160;</mo><mn>4</mn></mrow></mfenced><mo>=</mo><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>2</mn></mrow></mfenced></math>.</p><p>Since,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi><mo>:</mo><mfrac><mrow><mi>x</mi><mo>&#8722;</mo><mi>&#945;</mi></mrow><mi>l</mi></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>&#8722;</mo><mn>1</mn></mrow><mi>m</mi></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>&#8722;</mo><mi>&#947;</mi></mrow><mrow><mo>&#8722;</mo><mn>2</mn></mrow></mfrac></math>&nbsp;is the acute angle bisector between the&nbsp;lines&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>L</mi><mn>1</mn></msub><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msub><mi>L</mi><mn>2</mn></msub></math>.</p><p>So, by comparing the direction ratios, we get</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>l</mi><mo>=</mo><mn>1</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>m</mi><mo>=</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>l</mi><mo>+</mo><mi>m</mi><mo>=</mo><mn>2</mn></math></p><p>So, equation of line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>&nbsp;will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>&#8722;</mo><mi>&#945;</mi></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>&#8722;</mo><mn>1</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>&#8722;</mo><mi>&#947;</mi></mrow><mrow><mo>&#8722;</mo><mn>2</mn></mrow></mfrac></math>.</p><p>Given that the line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>&nbsp;passes through the point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced></math>.</p><p>Putting the point in line&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>L</mi></math>, we get&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>1</mn><mo>&#8722;</mo><mi>&#945;</mi></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mn>0</mn><mo>&#8722;</mo><mn>1</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>&#8722;</mo><mi>&#947;</mi></mrow><mrow><mo>&#8722;</mo><mn>2</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>1</mn><mo>&#8722;</mo><mi>&#945;</mi><mo>=</mo><mo>-</mo><mn>1</mn><mo>=</mo><mfrac><mrow><mn>1</mn><mo>&#8722;</mo><mi>&#947;</mi></mrow><mrow><mo>&#8722;</mo><mn>2</mn></mrow></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>1</mn><mo>&#8722;</mo><mi>&#945;</mi><mo>=</mo><mo>-</mo><mn>1</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfrac><mrow><mn>1</mn><mo>&#8722;</mo><mi>&#947;</mi></mrow><mrow><mo>&#8722;</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mo>-</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><mn>2</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>&#947;</mi><mo>=</mo><mo>-</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#945;</mi><mo>&#8722;</mo><mi>&#947;</mi><mo>=</mo><mn>3</mn></math></p><p>So, options <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>A</mi></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mi>B</mi></mfenced></math>&nbsp;are correct.</p>", "image": null}, "videoSolution": {"videoId": "96981783a11b45ff851dd900adf928c4", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/VAmDGkRAJeAC2.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/VAmDGkRAJeAC2.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf830", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2020-04-30T09:00:00. i>Q</mi></math> and <math><mi>R</mi></math> are collinear?", "image": null}, "options": [{"id": "R7KCj", "text": "<math><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover><mo>+</mo><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover></math>", "isCorrect": false, "image": null}, {"id": "4Yl4T", "text": "<math><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover></math>", "isCorrect": false, "image": null}, {"id": "af5D5", "text": "<math><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover></math>", "isCorrect": true, "image": null}, {"id": "6oHQr", "text": "<math><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "As given<br /><math><msub><mrow><mi>L</mi></mrow><mrow><mn>1</mn></mrow></msub><mo>&#8658;</mo><mover accent=\"true\"><mrow><mi>r</mi></mrow><mo>&#8594;</mo></mover><mo>=</mo><mi>&#955;</mi><mi>i</mi><mo>,</mo><mi>&#160;</mi><mi>&#955;</mi><mo>&#8712;</mo><mi>R</mi></math><br /><math><msub><mrow><mi>L</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>&#8658;</mo><mover accent=\"true\"><mrow><mi>r</mi></mrow><mo>&#8594;</mo></mover><mo>=</mo><mi>k</mi><mo>+</mo><mi>&#956;</mi><mi>j</mi><mo>,</mo><mi>&#160;</mi><mi>&#956;</mi><mo>&#8712;</mo><mi>R</mi></math><br />and <math><msub><mrow><mi>L</mi></mrow><mrow><mn>3</mn></mrow></msub><mo>&#8658;</mo><mover accent=\"true\"><mrow><mi>r</mi></mrow><mo>&#8594;</mo></mover><mo>=</mo><mi>i</mi><mo>+</mo><mi>j</mi><mo>+</mo><mi>&#957;</mi><mi>k</mi><mo>,</mo><mi>&#160;</mi><mi>&#957;</mi><mo>&#8712;</mo><mi>R</mi></math><br />Let point <math><mi>P</mi><mfenced separators=\"|\"><mrow><mi>&#955;</mi><mo>,</mo><mi> 998/Math/MathML\"><mo>⇒</mo><mn>9</mn><mtext>S</mtext><mfenced><mrow><mtext>S</mtext><mo>+</mo><mn>2</mn></mrow></mfenced><mo>+</mo><mn>1</mn><mn>0</mn><mfenced><mrow><mtext>S</mtext><mo>+</mo><mn>2</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math><br ><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mtext>⇒S</mtext><mo>=</mo><mo>-</mo><mn>2</mn><mtext>,</mtext><mspace width=\"0.5em\"></mspace><mo>-</mo><mn>1</mn><mn>0</mn><mo>/</mo><mn>9</mn></math><br >Using equation <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>v</mi><mi>i</mi></mrow></mfenced></math></p><p>The required points are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mo>-</mo><mn>1</mn><mo>,</mo><mn>0</mn></mrow></mfenced><mo> </mo><mo>&</mo><mo> </mo><mfenced><mrow><mfrac><mn>7</mn><mn>9</mn></mfrac><mo>,</mo><mfrac><mn>7</mn><mn>9</mn></mfrac><mo>,</mo><mfrac><mn>8</mn><mn>9</mn></mfrac></mrow></mfenced></math> </p>", "image": null}, "videoSolution": {"videoId": "839b9e22d7804f5c93d13cb11c4f5e04", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/PwimwdajzZRhF.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/PwimwdajzZRhF.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf822", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 1)", "title": "JEE Advanced 2013 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169edf23ac7d519f9afbe", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}], "question": {"text": "<strong>Paragraph:</strong>\nConsider the lines: $L_1: \\frac{x+1}{3}=\\frac{y+2}{1}=\\frac{z+1}{2}, L_2: \\frac{x-2}{1}=\\frac{y+2}{2}=\\frac{z-3}{3}$<strong>Question:</strong>\nThe shortest distance between $L_1$ and $L_2$ is", "image": null}, "options": [{"id": "WCY30", "text": "\n0\n", "image": null, "isCorrect": false}, {"id": "DVdBc", "text": "\n$17 / \\sqrt{3}$\n", "image": null, "isCorrect": false}, {"id": "BHGMt", "text": "\n$41 / 5 \\sqrt{3}$\n", "image": null, "isCorrect": false}, {"id": "hX0nt", "text": "\n$17 / 5 \\sqrt{3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The shortest distance between $L_1$ and $L_2$ is\n$$\n\\begin{array}{r}\n\\left|\\frac{\\{(2-(-1)) \\hat{\\mathbf{i}}+(2-2) \\hat{\\mathbf{j}}+(3-(-1)) \\hat{\\mathbf{k}}\\} \\cdot(-\\hat{\\mathbf{i}}-7 \\hat{\\mathbf{j}}+5 \\hat{\\mathbf{k}})}{5 \\sqrt{3}}\\right| \\\\\n=\\left|\\frac{(3 \\hat{\\mathbf{i}}+4 \\hat{\\mathbf{k}}) \\cdot(-\\hat{\\mathbf{i}}-7 \\hat{\\mathbf{j}}+5 \\hat{\\mathbf{k}})}{5 \\sqrt{3}}\\right|=\\frac{17}{5 \\sqrt{3}}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64b16ae0f23ac7d519f9b907", "title": "Plane in Space", "totalQuestions": 18, "questions": [{"_id": "6a0be50c44d287c9361e5c7d", "type": "multipleCorrect", "question": {"text": "Let $P$ be the plane such that it contains the straight line $\\dfrac{x-1}{2} = \\dfrac{y-3}{3} = \\dfrac{z+2}{1}$ and is perpendicular to the plane $x + 2y + 3z = 4$. Let $P_1$ be the plane which passes through the point $(4, 2, 2)$ and is parallel to $P$.<br><br>Then which of the following statements is (are) TRUE?", "image": null}, "options": [{"id": "xawqh", "text": "The equation of the plane $P$ is $7x - 5y + z = -10$", "isCorrect": true, "image": null}, {"id": "ECWnt", "text": "The distance between the planes $P$ and $P_1$ is $30$", "isCorrect": false, "image": null}, {"id": "isjLU", "text": "The distance of the plane $P$ from the origin is $2\\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "dCjeT", "text": "The acute angle between the plane $P$ and the plane $2x + 2y + z = 3$ is $\\cos^{-1}\\left(\\dfrac{1}{3\\sqrt{3}}\\right)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the normal vector to the plane $P$ be $\\vec{n}$.<br><br>Since the plane $P$ contains the line $\\dfrac{x-1}{2} = \\dfrac{y-3}{3} = \\dfrac{z+2}{1}$, its normal vector $\\vec{n}$ is perpendicular to the line's direction vector $\\vec{b} = 2\\hat{i} + 3\\hat{j} + \\hat{k}$.<br><br>Since $P$ is perpendicular to the plane $x + 2y + 3z = 4$, $\\vec{n}$ is perpendicular to its normal vector $\\vec{n}_1 = \\hat{i} + 2\\hat{j} + 3\\hat{k}$.<br><br>$\\vec{n} = (2\\hat{i} + 3\\hat{j} + \\hat{k}) \\times (\\hat{i} + 2\\hat{j} + 3\\hat{k}) = \\hat{i}(9-2) - \\hat{j}(6-1) + \\hat{k}(4-3) = 7\\hat{i} - 5\\hat{j} + \\hat{k}$<br><br>Plane $P$ passes through the point $(1, 3, -2)$ which lies on the given line.<br><br>Equation of plane $P$ is $7(x-1) - 5(y-3) + 1(z+2) = 0 \\Rightarrow 7x - 5y + z = -10$<br><br>Statement (1) is TRUE.<br><br>The plane $P_1$ is parallel to $P$ and passes through $(4, 2, 2)$.<br><br>Equation of plane $P_1$ is $7(x-4) - 5(y-2) + 1(z-2) = 0 \\Rightarrow 7x - 5y + z = 20$<br><br>Distance between parallel planes $P$ and $P_1$ is $d = \\dfrac{|20 - (-10)|}{\\sqrt{7^2 + (-5)^2 + 1^2}} = \\dfrac{30}{\\sqrt{75}} = 2\\sqrt{3}$. Statement (2) is FALSE.<br><br>Distance of plane $P$ from the origin is $d_0 = \\dfrac{|-10|}{\\sqrt{75}} = \\dfrac{2}{\\sqrt{3}}$. Statement (3) is FALSE.<br><br>Angle $\\theta$ between the planes $7x - 5y + z + 10 = 0$ and $2x + 2y + z - 3 = 0$ is given by:<br><br>$\\cos\\theta = \\dfrac{|7(2) + (-5)(2) + 1(1)|}{\\sqrt{7^2+(-5)^2+1^2} \\sqrt{2^2+2^2+1^2}} = \\dfrac{5}{\\sqrt{75} \\sqrt{9}} = \\dfrac{5}{15\\sqrt{3}} = \\dfrac{1}{3\\sqrt{3}}$<br><br>$\\theta = \\cos^{-1}\\left(\\dfrac{1}{3\\sqrt{3}}\\right)$. Statement (4) is TRUE.", "image": null}, "level": 3, "videoSolution": {"videoId": "446a39ff48af4f19aa5f5c2221f9b4a9", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/7CazannkpGjmK.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/7CazannkpGjmK.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66965dccd603121f43a3e317", "type": "multipleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "66965789b31faf98fda8fef9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 1)", "title": "JEE Advanced 2024 (Paper 1)"}], "question": {"text": "Let $\\mathbb{R}^3$ denote the three-dimensional space. Take two points $P=(1,2,3)$ and $Q=(4,2,7)$. Let $\\operatorname{dist}(X, Y)$ denote the distance between two points $X$ and $Y$ in $\\mathbb{R}^3$. Let\n$\\begin{gathered}S=\\left\\{X \\in \\mathbb{R}^3:(\\operatorname{dist}(X, P))^2-(\\operatorname{dist}(X, Q))^2=50\\right\\} \\text { and } \\\\T=\\left\\{Y \\in \\mathbb{R}^3:(\\operatorname{dist}(Y, Q))^2-(\\operatorname{dist}(Y, P))^2=50\\right\\} .\\end{gathered}$\nThen which of the following statements is (are) TRUE?", "image": null}, "options": [{"id": "JrLeL", "text": "There is a triangle whose area is 1 and all of whose vertices are from $S$.", "image": null, "isCorrect": true}, {"id": "xoawN", "text": "There are two distinct points $L$ and $M$ in $T$ such that each point on the line segment $L M$ is also in $T$.", "image": null, "isCorrect": true}, {"id": "zyOtB", "text": "There are infinitely many rectangles of perimeter 48 , two of whose vertices are from $S$ and the other two vertices are from $T$.", "image": null, "isCorrect": true}, {"id": "buCM9", "text": "There is a square of perimeter 48 , two of whose vertices are from $S$ and the other two vertices are from $T$.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned}& \\mathrm{S}=\\left\\{\\mathrm{X}:(\\mathrm{XP})^2-(\\mathrm{XQ})^2=50\\right\\} \\\\& \\mathrm{T}=\\left\\{\\mathrm{Y}:(\\mathrm{YQ})^2-(\\mathrm{YP})^2=50\\right\\}\\end{aligned}$\nfor finding $S \\equiv X(x, y, z)$ and for $T \\equiv Y(x, y, z)$\n$\\begin{aligned}&\\left((x-1)^2+(y-1)^2+(\\mathrm{z}-1)^2\\right)-\\left((\\mathrm{x}-4)^2+(\\mathrm{y}-2)^2+(\\mathrm{z}-7)^2\\right)=50 \\\\& \\Rightarrow \\quad \\mathrm{S}=\\{(\\mathrm{x}, \\mathrm{y}, \\mathrm{z}): 6 \\mathrm{x}+8 \\mathrm{z}=105\\} \\\\& \\mathrm{T}=\\{(\\mathrm{x}, \\mathrm{y}, \\mathrm{z}): 6 \\mathrm{x}+8 \\mathrm{z}=5\\}\\end{aligned}$\nSince $\\mathrm{S}$ and $\\mathrm{T}$ both are plane ;\n(1) There exist a triangle in plane $\\mathrm{S}$ whose area $=1$ (always)\n(2) $\\mathrm{L} ~\\&~ \\mathrm{M}$ lies on plane $\\mathrm{T}$, hence line segment joining $\\mathrm{L} \\& \\mathrm{M}$ will lie on plane $\\mathrm{T}$.\n(3) Distance between $\\mathrm{S} \\& \\mathrm{~T}$\n$\\mathrm{d}=\\left|\\frac{105-5}{10}\\right|=10$\nHence for rectangle of perimeter 48 can exist.\n(4) For Square\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/a9XIVkLb-k7s1awyKNeNOdYpCd5nYsKKTANatSFZxkY.original.fullsize.png\">\nThere will be infinite such rectangle possible.\nHence Answers 1,2,3,4 are correct.", "image": null}, "videoSolution": {"videoId": "ce09b8c15e974158aa469bb54bcc7a6b", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/ONbIhNGXBpKOr.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/ONbIhNGXBpKOr.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "66965789b31faf98fda8fef9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 1)", "title": "JEE Advanced 2024 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16aa5f23ac7d519f9b653", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}], "question": {"text": "<p>Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#8467;</mi><mn>1</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#8467;</mi><mn>2</mn></msub></math>&nbsp;be the lines <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mi>r</mi><mo>&#8594;</mo></mover><mn>1</mn></msub><mo>=</mo><mi>&#955;</mi><mfenced><mrow><mover><mi>i</mi><mo>^</mo></mover><mo>+</mo><mover><mi>j</mi><mo>^</mo></mover><mo>+</mo><mover><mi>k</mi><mo>^</mo></mover></mrow></mfenced></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mover><mi>r</mi><mo>&#8594;</mo></mover><mn>2</mn></msub><mo>=</mo><mfenced><mrow><mover><mi>j</mi><mo>^</mo></mover><mo>-</mo><mover><mi>k</mi><mo>^</mo></mover></mrow></mfenced><mo>+</mo><mi>&#956;</mi><mfenced><mrow><mover><mi>i</mi><mo>^</mo></mover><mo>+</mo><mover><mi>k</mi><mo>^</mo></mover></mrow></mfenced></math>, respectively, Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math> be the set of all the planes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi></math> that contain the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#8467;</mi><mn>1</mn></msub></math>. For a plane <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi></math>, let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mfenced><mi>H</mi></mfenced></math> denote the smallest possible distance between the points of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#8467;</mi><mn>2</mn></msub></math>&nbsp;and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi></math>. Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>H</mi><mn>0</mn></msub></math>&nbsp;be a plane in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math> for which <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mfenced><msub><mi>H</mi><mn>0</mn></msub></mfenced></math> is the maximum value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mfenced><mi>H</mi></mfenced></math> as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi></math> varies over all planes in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>X</mi></math>.</p><p>Match each entry in List-I to the correct entries in List-II.</p><table border=\"1\" cellpadding=\"1\" cellspacing=\"1\" style=\"width: 500px;\">\t<tbody>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td>List-I</td>\t\t\t<td>&nbsp;</td>\t\t\t<td>List-II</td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">P</mi></mfenced></math></td>\t\t\t<td>The value of <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mfenced><msub><mi>H</mi><mn>0</mn></msub></mfenced></math> is</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">Q</mi></mfenced></math></td>\t\t\t<td>The distance of the point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>2</mn></mrow></mfenced></math> from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>H</mi><mn>0</mn></msub></math> is</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>2</mn></mfenced></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msqrt><mn>3</mn></msqrt></mfrac></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">R</mi></mfenced></math></td>\t\t\t<td>The distance of origin from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>H</mi><mn>0</mn></msub></math>&nbsp;is</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>3</mn></mfenced></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>0</mn></math></td>\t\t</tr>\t\t<tr>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">S</mi></mfenced></math></td>\t\t\t<td>The distance of origin from the point of<br />\t\t\tintersection of planes <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>z</mi><mo>,</mo><mo>&#160;</mo><mi>x</mi><mo>=</mo><mn>1</mn></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>H</mi><mn>0</mn></msub></math>&nbsp;is</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>4</mn></mfenced></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>2</mn></msqrt></math></td>\t\t</tr>\t\t<tr>\t\t\t<td>&nbsp;</td>\t\t\t<td>&nbsp;</td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>5</mn></mfenced></math></td>\t\t\t<td><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac></math></td>\t\t</tr>\t</tbody></table><p>The correct option is</p>", "image": null}, "options": [{"id": "WkouN", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">P</mi></mfenced><mo>&#8594;</mo><mfenced><mn>2</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">Q</mi></mfenced><mo>&#8594;</mo><mfenced><mn>4</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">R</mi></mfenced><mo>&#8594;</mo><mfenced><mn>5</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">S</mi></mfenced><mo>&#8594;</mo><mfenced><mn>1</mn></mfenced></math>", "image": null, "isCorrect": false}, {"id": "tltNz", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">P</mi></mfenced><mo>&#8594;</mo><mfenced><mn>5</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">Q</mi></mfenced><mo>&#8594;</mo><mfenced><mn>4</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">R</mi></mfenced><mo>&#8594;</mo><mfenced><mn>3</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">S</mi></mfenced><mo>&#8594;</mo><mfenced><mn>1</mn></mfenced></math>", "image": null, "isCorrect": true}, {"id": "gCDBL", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">P</mi></mfenced><mo>&#8594;</mo><mfenced><mn>2</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">Q</mi></mfenced><mo>&#8594;</mo><mfenced><mn>1</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">R</mi></mfenced><mo>&#8594;</mo><mfenced><mn>3</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">S</mi></mfenced><mo>&#8594;</mo><mfenced><mn>2</mn></mfenced></math>", "image": null, "isCorrect": false}, {"id": "H0CwC", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">P</mi></mfenced><mo>&#8594;</mo><mfenced><mn>5</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">Q</mi></mfenced><mo>&#8594;</mo><mfenced><mn>1</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">R</mi></mfenced><mo>&#8594;</mo><mfenced><mn>4</mn></mfenced><mo>&#160;</mo><mfenced><mi mathvariant=\"normal\">S</mi></mfenced><mo>&#8594;</mo><mfenced><mn>2</mn></mfenced></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>H</mi><mn>0</mn></msub></math>&nbsp;will be the plane containing the line <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#8467;</mi><mn>1</mn></msub></math> and parallel to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#8467;</mi><mn>2</mn></msub></math>.</p><p>So, the normal vector of plane parallel to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#8467;</mi><mn>1</mn></msub></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#8467;</mi><mn>2</mn></msub></math> is given by,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"|\" open=\"|\"><mtable columnalign=\"left\"><mtr><mtd><mover><mi>i</mi><mo>^</mo></mover></mtd><mtd><mover><mi>j</mi><mo>^</mo></mover></mtd><mtd><mover><mi>k</mi><mo>^</mo></mover></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>1</mn></mtd><mtd><mn>1</mn></mtd></mtr><mtr><mtd><mn>1</mn></mtd><mtd><mn>0</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable></mfenced><mo>=</mo><mover><mi>j</mi><mo>^</mo></mover><mfenced><mn>1</mn></mfenced><mo>-</mo><mover><mi>j</mi><mo>^</mo></mover><mfenced><mrow><mn>1</mn><mo>-</mo><mn>1</mn></mrow></mfenced><mo>+</mo><mover><mi>k</mi><mo>^</mo></mover><mfenced><mrow><mo>-</mo><mn>1</mn></mrow></mfenced></math><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mover><mi>i</mi><mo>^</mo></mover><mo>-</mo><mover><mi>k</mi><mo>^</mo></mover></math></p><p>Hence, the equation of plane&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>H</mi><mrow><mn>0</mn><mo>&#160;</mo></mrow></msub></math>&nbsp;will be,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>H</mi><mrow><mn>0</mn><mo>&#160;</mo></mrow></msub><mo>:</mo><mo>&#160;</mo><mi>x</mi><mo>-</mo><mi>z</mi><mo>=</mo><mi>C</mi></math>&nbsp;which passes through origin,</p><p>So,<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>C</mi><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><msub><mi>H</mi><mn>0</mn></msub><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mi>x</mi><mo>-</mo><mi>z</mi><mo>=</mo><mn>0</mn></math></p><p>Now solving,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">P</mi></mfenced></math> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mfenced><msub><mi>H</mi><mn>0</mn></msub></mfenced><mo>=</mo><mn>1</mn></math>&nbsp;distance of point <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mo>-</mo><mn>1</mn></mrow></mfenced></math> from <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>H</mi></math>.</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mo>=</mo><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mn>0</mn><mo>-</mo><mfenced><mrow><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><msqrt><mn>2</mn></msqrt></mfrac></mfenced><mo>=</mo><mfrac><mn>1</mn><msqrt><mn>2</mn></msqrt></mfrac><mo>&#160;</mo><mo>&#8756;</mo><mo>&#160;</mo><mi>P</mi><mo>&#8594;</mo><mn>5</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">Q</mi></mfenced></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mo>=</mo><mfenced close=\"|\" open=\"|\"><mfrac><mrow><mn>0</mn><mo>-</mo><mn>2</mn></mrow><msqrt><mn>2</mn></msqrt></mfrac></mfenced><mo>=</mo><msqrt><mn>2</mn></msqrt><mo>&#160;</mo><mo>&#8756;</mo><mo>&#160;</mo><mi>Q</mi><mo>&#8594;</mo><mn>4</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">R</mi></mfenced></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mo>=</mo><mfenced close=\"|\" open=\"|\"><mfrac><mn>0</mn><msqrt><mn>2</mn></msqrt></mfrac></mfenced><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#8756;</mo><mo>&#160;</mo><mi>R</mi><mo>&#8594;</mo><mn>3</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi mathvariant=\"normal\">S</mi></mfenced></math>&nbsp;Point of intersection will be of given planes<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>y</mi><mo>=</mo><mi>z</mi><mo>,</mo><mo>&#160;</mo><mi>x</mi><mo>=</mo><mn>1</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mi>x</mi><mo>-</mo><mi>z</mi><mo>=</mo><mn>0</mn></math>&nbsp;&nbsp;will be,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>&#160;</mo></math></p><p>Hence, distance&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>d</mi><mo>=</mo><msqrt><mn>1</mn><mo>+</mo><mn>1</mn><mo>+</mo><mn>1</mn></msqrt><mo>=</mo><msqrt><mn>3</mn></msqrt></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo><mo>&#160;</mo><mi>S</mi><mo>&#8594;</mo><mn>1</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8756;</mo></math> Option (B) is correct.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "963a7d78f8f54326bd50ef0163cd7b74", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/81lQlESSZyCAi.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/81lQlESSZyCAi.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a99f23ac7d519f9b5e3", "previousYearPapers": [{"_id": "632c83573e3fd59bda92e46c", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 1)", "title": "JEE Advanced 2022 (Paper 1)"}], "type": "multipleCorrect", "level": 1, "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math>&nbsp;be the reflection of a point&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> with respect to the plane given by<br /><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>r</mi><mo>&#8594;</mo></mover><mo>=</mo><mo>-</mo><mfenced><mrow><mi>t</mi><mo>+</mo><mi>p</mi></mrow></mfenced><mover><mi>i</mi><mo>^</mo></mover><mo>+</mo><mi>t</mi><mover><mi>j</mi><mo>^</mo></mover><mo>+</mo><mfenced><mrow><mn>1</mn><mo>+</mo><mi>p</mi></mrow></mfenced><mover><mi>k</mi><mo>^</mo></mover></math><br />where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>t</mi><mo>,</mo><mi>p</mi></math>&nbsp;are real parameters and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>i</mi><mo>^</mo></mover><mo>,</mo><mover><mi>j</mi><mo>^</mo></mover><mo>,</mo><mover><mi>k</mi><mo>^</mo></mover></math>&nbsp;are the unit vectors along the three positive coordinate axes. If the position vectors of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi></math> and <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi></math> are <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mover><mi>i</mi><mo>^</mo></mover><mo>+</mo><mn>15</mn><mover><mi>j</mi><mo>^</mo></mover><mo>+</mo><mn>20</mn><mover><mi>k</mi><mo>^</mo></mover></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#945;</mi><mover><mi>i</mi><mo>^</mo></mover><mo>+</mo><mi>&#946;</mi><mover><mi>j</mi><mo>^</mo></mover><mo>+</mo><mi>&#947;</mi><mover><mi>k</mi><mo>^</mo></mover></math>&nbsp;respectively, then which of the following is/are TRUE?", "image": null}, "options": [{"id": "zdbby", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mfenced><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mn>101</mn></math>", "isCorrect": true, "image": null}, {"id": "BXfOM", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mfenced><mrow><mi>&#946;</mi><mo>+</mo><mi>&#947;</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mn>71</mn></math>", "isCorrect": true, "image": null}, {"id": "34C91", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mfenced><mrow><mi>&#947;</mi><mo>+</mo><mi>&#945;</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mn>86</mn></math>", "isCorrect": true, "image": null}, {"id": "Rha0v", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mfenced><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>+</mo><mi>&#947;</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mn>121</mn></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "<p>Given,</p><p>Equation of plane is</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>r</mi><mo>&#8594;</mo></mover><mo>=</mo><mo>-</mo><mfenced><mrow><mi>t</mi><mo>+</mo><mi>p</mi></mrow></mfenced><mover><mi>i</mi><mo>^</mo></mover><mo>+</mo><mi>t</mi><mover><mi>j</mi><mo>^</mo></mover><mo>+</mo><mfenced><mrow><mn>1</mn><mo>+</mo><mi>p</mi></mrow></mfenced><mover><mi>k</mi><mo>^</mo></mover></math></p><p>On rearranging we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mover><mi>r</mi><mo>&#8594;</mo></mover><mo>=</mo><mover><mi>k</mi><mo>^</mo></mover><mo>+</mo><mi>t</mi><mfenced><mrow><mo>-</mo><mover><mi>i</mi><mo>^</mo></mover><mo>+</mo><mover><mi>j</mi><mo>^</mo></mover></mrow></mfenced><mo>+</mo><mi>p</mi><mfenced><mrow><mo>-</mo><mover><mi>i</mi><mo>^</mo></mover><mo>+</mo><mover><mi>k</mi><mo>^</mo></mover></mrow></mfenced></math></p><p>So, equation of plane in standard form is given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"]\" open=\"[\"><mtable columnalign=\"left\"><mtr><mtd><mover><mi>r</mi><mo>&#8594;</mo></mover><mo>-</mo><mover><mi>k</mi><mo>^</mo></mover></mtd><mtd><mo>-</mo><mover><mi>i</mi><mo>^</mo></mover><mo>+</mo><mover><mi>j</mi><mo>^</mo></mover></mtd><mtd><mo>-</mo><mover><mi>i</mi><mo>^</mo></mover><mo>+</mo><mover><mi>k</mi><mo>^</mo></mover></mtd></mtr></mtable></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mfenced close=\"|\" open=\"|\"><mtable><mtr><mtd><mi>x</mi></mtd><mtd><mi>y</mi></mtd><mtd><mi>z</mi><mo>-</mo><mn>1</mn></mtd></mtr><mtr><mtd><mo>-</mo><mn>1</mn></mtd><mtd><mn>1</mn></mtd><mtd><mn>0</mn></mtd></mtr><mtr><mtd><mo>-</mo><mn>1</mn></mtd><mtd><mn>0</mn></mtd><mtd><mn>1</mn></mtd></mtr></mtable></mfenced><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mi>z</mi><mo>=</mo><mn>1</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo><mo>&#8943;</mo><mfenced><mn>1</mn></mfenced></math></p><p>Now given coordinate of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Q</mi><mo>=</mo><mfenced><mrow><mn>10</mn><mo>,</mo><mn>15</mn><mo>,</mo><mn>20</mn></mrow></mfenced></math></p><p>And coordinates of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mo>=</mo><mfenced><mrow><mi>&#945;</mi><mo>,</mo><mi>&#946;</mi><mo>,</mo><mi>&#947;</mi></mrow></mfenced></math></p><p>Now using the image formula of point and plane we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>&#945;</mi><mo>-</mo><mn>10</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>&#946;</mi><mo>-</mo><mn>15</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>&#947;</mi><mo>-</mo><mn>20</mn></mrow><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mo>-</mo><mn>2</mn><mfenced><mrow><mn>10</mn><mo>+</mo><mn>15</mn><mo>+</mo><mn>20</mn><mo>-</mo><mn>1</mn></mrow></mfenced></mrow><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#945;</mi><mo>-</mo><mn>10</mn><mo>=</mo><mi>&#946;</mi><mo>-</mo><mn>15</mn><mo>=</mo><mi>&#947;</mi><mo>-</mo><mn>20</mn><mo>=</mo><mo>-</mo><mfrac><mn>88</mn><mn>3</mn></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>&#945;</mi><mo>=</mo><mo>-</mo><mfrac><mn>58</mn><mn>3</mn></mfrac><mo>,</mo><mi>&#946;</mi><mo>=</mo><mo>-</mo><mfrac><mn>43</mn><mn>3</mn></mfrac><mo>,</mo><mi>&#947;</mi><mo>=</mo><mo>-</mo><mfrac><mn>28</mn><mn>3</mn></mfrac></math></p><p>Now solving all options we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mfenced><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mn>101</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mfenced><mrow><mi>&#946;</mi><mo>+</mo><mi>&#947;</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mn>71</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mfenced><mrow><mi>&#947;</mi><mo>+</mo><mi>&#945;</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mn>86</mn></math>&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mfenced><mrow><mi>&#945;</mi><mo>+</mo><mi>&#946;</mi><mo>+</mo><mi>&#947;</mi></mrow></mfenced><mo>=</mo><mo>-</mo><mn>129</mn></math></p>", "image": null}, "videoSolution": {"videoId": "de5756aa0d2647dd8f7c52e6053462b4", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/UKscKDKwLXZY5.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/UKscKDKwLXZY5.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "632c83573e3fd59bda92e46c", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 1)", "title": "JEE Advanced 2022 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a99f23ac7d519f9b5e2", "previousYearPapers": [{"_id": "632c83573e3fd59bda92e46c", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2022-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2022 (Paper 1)", "title": "JEE Advanced 2022 (Paper 1)"}], "type": "multipleCorrect", "level": 3, "question": {"text": "<p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub></math>&nbsp;be two planes given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><mo>:</mo><mn>10</mn><mi>x</mi><mo>+</mo><mn>15</mn><mi>y</mi><mo>+</mo><mn>12</mn><mi>z</mi><mo>-</mo><mn>60</mn><mo>=</mo><mn>0</mn><mo>,</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub><mo>:</mo><mo>-</mo><mn>2</mn><mi>x</mi><mo>+</mo><mn>5</mn><mi>y</mi><mo>+</mo><mn>4</mn><mi>z</mi><mo>-</mo><mn>20</mn><mo>=</mo><mn>0</mn></math>.</p><p>Which of the following straight lines can be an edge of some tetrahedron whose two faces lie on&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub></math>?</p>", "image": null}, "options": [{"id": "uIt8U", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow><mn>0</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>1</mn></mrow><mn>0</mn></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>-</mo><mn>1</mn></mrow><mn>5</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "yuwK6", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>6</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></mfrac><mo>=</mo><mfrac><mi>y</mi><mn>2</mn></mfrac><mo>=</mo><mfrac><mi>z</mi><mn>3</mn></mfrac></math>", "isCorrect": true, "image": null}, {"id": "wucms", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>x</mi><mrow><mo>-</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>4</mn></mrow><mn>5</mn></mfrac><mo>=</mo><mfrac><mi>z</mi><mn>4</mn></mfrac></math>", "isCorrect": false, "image": null}, {"id": "taipq", "text": "<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>x</mi><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>4</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mi>z</mi><mn>3</mn></mfrac></math>", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "<p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math>&nbsp;and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub></math>&nbsp;be two planes given by</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><mo>:</mo><mn>10</mn><mi>x</mi><mo>+</mo><mn>15</mn><mi>y</mi><mo>+</mo><mn>12</mn><mi>z</mi><mo>-</mo><mn>60</mn><mo>=</mo><mn>0</mn><mo>,</mo></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub><mo>:</mo><mo>-</mo><mn>2</mn><mi>x</mi><mo>+</mo><mn>5</mn><mi>y</mi><mo>+</mo><mn>4</mn><mi>z</mi><mo>-</mo><mn>20</mn><mo>=</mo><mn>0</mn></math>.</p><p>Now finding line of intersection of both the planes,</p><p>Let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>z</mi><mo>=</mo><mi>&#955;</mi></math>&nbsp;then we have equations,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mi>x</mi><mo>+</mo><mn>15</mn><mi>y</mi><mo>=</mo><mn>60</mn><mo>-</mo><mn>12</mn><mi>&#955;</mi><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>1</mn></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2</mn><mi>x</mi><mo>+</mo><mn>5</mn><mi>y</mi><mo>=</mo><mn>20</mn><mo>-</mo><mn>4</mn><mi>&#955;</mi><mo>&#160;</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mo>.</mo><mfenced><mn>2</mn></mfenced></math></p><p>Now on solving equation&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>1</mn></mfenced><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><mfenced><mn>2</mn></mfenced></math>&nbsp;we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi>x</mi><mn>0</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>4</mn></mrow><mrow><mo>-</mo><mn>4</mn></mrow></mfrac><mo>=</mo><mfrac><mi>z</mi><mn>5</mn></mfrac></math>&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced close=\"}\" open=\"{\"><mrow><mtext>Replacing&#160;</mtext><mi>&#955;</mi><mo>&#160;</mo><mtext>with&#160;</mtext><mi>z</mi></mrow></mfenced></math></p><p>Now any skew line with the line of intersection of given plane can be edge of tetrahedron,</p><p>Or any&nbsp;line which is intersecting&nbsp; with the line of intersection passing through plane&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub></math>&nbsp;or&nbsp;&nbsp;plane&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub></math>&nbsp;can be edge of tetrahedron,&nbsp;</p><p>Now using above concept we will solve all options,</p><p>Now form option&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>A</mi></mfenced></math>&nbsp;we have,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow><mn>0</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>1</mn></mrow><mn>0</mn></mfrac><mo>=</mo><mfrac><mrow><mi>z</mi><mo>-</mo><mn>1</mn></mrow><mn>5</mn></mfrac></math>, any point lying on this line will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>5</mn><mi>&#955;</mi><mo>+</mo><mn>1</mn></mrow></mfenced></math>&nbsp;now satisfying this point in given planes we have,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>10</mn><mo>&#215;</mo><mn>1</mn><mo>+</mo><mn>15</mn><mo>&#215;</mo><mn>1</mn><mo>+</mo><mn>12</mn><mo>&#215;</mo><mfenced><mrow><mn>5</mn><mi>&#955;</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mo>-</mo><mn>60</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>60</mn><mi>&#955;</mi><mo>=</mo><mn>23</mn><mo>&#8658;</mo><mi>&#955;</mi><mo>=</mo><mfrac><mn>23</mn><mn>60</mn></mfrac></math>&nbsp;now we can see line is intersecting the plane at some point,</p><p>Now checking for plane&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mn>2</mn></mfenced></math>&nbsp;we have,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2</mn><mo>&#215;</mo><mn>1</mn><mo>+</mo><mn>5</mn><mo>&#215;</mo><mn>1</mn><mo>+</mo><mn>4</mn><mo>&#215;</mo><mfenced><mrow><mn>5</mn><mi>&#955;</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mo>-</mo><mn>20</mn><mo>=</mo><mn>0</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mn>20</mn><mi>&#955;</mi><mo>=</mo><mn>13</mn><mo>&#8658;</mo><mi>&#955;</mi><mo>=</mo><mfrac><mn>13</mn><mn>20</mn></mfrac></math></p><p>So, we can say line is also intersecting plane&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub></math>&nbsp;for some value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math>, So this line can be edge of tetrahedron.</p><p>Now solving for option&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>B</mi></mfenced><mo>&#160;</mo><mfrac><mrow><mi>x</mi><mo>-</mo><mn>6</mn></mrow><mrow><mo>-</mo><mn>5</mn></mrow></mfrac><mo>=</mo><mfrac><mi>y</mi><mn>2</mn></mfrac><mo>=</mo><mfrac><mi>z</mi><mn>3</mn></mfrac></math>&nbsp;any point on the line will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>5</mn><mi>&#955;</mi><mo>+</mo><mn>6</mn><mo>,</mo><mn>2</mn><mi>&#955;</mi><mo>,</mo><mn>3</mn><mi>&#955;</mi></mrow></mfenced></math></p><p>Similarly putting in plane&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>1</mn></msub><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msub><mi>P</mi><mn>2</mn></msub></math>&nbsp;we get value of&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi></math>&nbsp;as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#955;</mi><msub><mi>P</mi><mn>1</mn></msub></msub><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msub><mi>&#955;</mi><msub><mi>P</mi><mn>2</mn></msub></msub><mo>=</mo><mn>1</mn><mo>&#160;</mo></math></p><p>So, it can be the edge of tetrahedron.</p><p>Now solving for option <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>C</mi></mfenced><mo>&#160;</mo><mfrac><mi>x</mi><mrow><mo>-</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>4</mn></mrow><mn>5</mn></mfrac><mo>=</mo><mfrac><mi>z</mi><mn>4</mn></mfrac></math>&nbsp;any point on this line will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>2</mn><mi>&#955;</mi><mo>,</mo><mn>5</mn><mi>&#955;</mi><mo>+</mo><mn>4</mn><mo>,</mo><mn>4</mn><mi>&#955;</mi></mrow></mfenced></math></p><p>Similarly checking in plane we get,&nbsp;&nbsp;</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>&#955;</mi><msub><mi>P</mi><mn>1</mn></msub></msub><mo>=</mo><mn>0</mn><mo>&#160;</mo><mo>&#38;</mo><mo>&#160;</mo><msub><mi>&#955;</mi><msub><mi>P</mi><mn>2</mn></msub></msub><mo>=</mo><mn>0</mn></math>, so it is passing through one point and not lying on plane&nbsp;</p><p>So, it cannot be the edge of tetrahedron.</p><p>Now checking for option <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mi>D</mi></mfenced><mo>&#160;</mo><mfrac><mi>x</mi><mn>1</mn></mfrac><mo>=</mo><mfrac><mrow><mi>y</mi><mo>-</mo><mn>4</mn></mrow><mrow><mo>-</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mfrac><mi>z</mi><mn>3</mn></mfrac></math>&nbsp;now any point on this line will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mi>&#955;</mi><mo>,</mo><mo>-</mo><mn>2</mn><mi>&#955;</mi><mo>+</mo><mn>4</mn><mo>,</mo><mn>3</mn><mi>&#955;</mi></mrow></mfenced></math>&nbsp;and&nbsp;for&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#955;</mi><mo>=</mo><mn>0</mn></math>&nbsp;point will be&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>0</mn><mo>,</mo><mo>-</mo><mn>4</mn><mo>,</mo><mn>0</mn></mrow></mfenced></math>&nbsp;which is lying on line of intersection and DR of plane&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub></math>&nbsp;is <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mo>-</mo><mn>2</mn><mo>,</mo><mn>5</mn><mo>,</mo><mn>4</mn></mrow></mfenced></math>&nbsp;and DR of line is&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>1</mn><mo>,</mo><mo>-</mo><mn>2</mn><mo>,</mo><mn>3</mn></mrow></mfenced></math>,&nbsp;</p><p>Now line is lying completely on plane&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>P</mi><mn>2</mn></msub></math>&nbsp;as&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>-</mo><mn>2</mn><mo>&#215;</mo><mn>1</mn><mo>+</mo><mn>5</mn><mo>&#215;</mo><mfenced><mrow><mo>-</mo><mn>2</mn></mrow></mfenced><mo>+</mo><mn>3</mn><mo>&#215;</mo><mn>4</mn><mo>=</mo><mn>0</mn></math></p><p>Hence, it can be the edge of tetrahedron.</p>", "image": null}, "videoSolution": {"videoId": "8be216e55b914dc9806f61f4ef80a5ab", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/S6aStpOfw5ByM.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/S6aStpOfw5ByM.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_ o>→</mo><mi mathvariant=\"normal\">Origin</mi></math><br/><math><mi mathvariant=\"normal\">P </mi><mfenced separators=\"|\"><mrow><mn>3,0</mn><mo>,</mo><mn>0</mn></mrow></mfenced><mo>→</mo><mi mathvariant=\"normal\">on x axis</mi></math><br/><math><math><mi mathvariant=\"normal\">R </mi><mfenced separators=\"|\"><mrow><mn>0,3</mn><mo>,</mo><mn>0</mn></mrow></mfenced><mo>→</mo><mi mathvariant=\"normal\">on y axis</mi></math></math><br/><math><mi mathvariant=\"normal\">Q </mi><mfenced separators=\"|\"><mrow><mn>3,3</mn><mo>,</mo><mn>0</mn></mrow></mfenced></math><br/><math><mi mathvariant=\"italic\">T </mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mn>0</mn></mrow></mfenced><mi> </mi><mo>,</mo><mi> </mi><mn>5</mn><mi> </mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mn>3</mn></mrow></mfenced></math><br ><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/math_43_solut_paper1.jpg\"/><br ><br/>Given OP = OR = 3 and OPQR is a square<br ><math><mo>⇒</mo></math> <math><mi>O</mi><mi>Q</mi><mo>=</mo><mn>3</mn><msqrt><mn>2</mn></msqrt><mi> </mi><mi> </mi><mi> </mi><mi> </mi><mo>⇒</mo><mi> </mi><mi> </mi><mi> </mi><mi>O</mi><mi>T</mi><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></math> and <math><mi>S</mi><mi>T</mi><mo>=</mo><mn>3</mn></math><br >Let θ be a angle between OQ & OS<br >Using <math><mi mathvariant=\"normal\">Δ</mi><mi>S</mi><mi>O</mi><mi>T</mi><mo>,</mo><mi> </mi><mrow><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mo>⁡</mo><mrow><mi>θ</mi></mrow></mrow><mo>=</mo><mfrac><mrow><mi>S</mi><mi>T</mi></mrow><mrow><mi>O</mi><mi>T</mi></mrow></mfrac><mo>=</mo><mi> </mi><msqrt><mn>2</mn></msqrt><mi> </mi><mi> </mi><mo>⇒</mo><mi> </mi><mi> </mi><mi> </mi><mi>θ</mi><mo>=</mo><mrow><mrow><msup><mrow><mi mathvariant=\"normal\">tan</mi></mrow><mrow><mo>-</mo><mn>1</mn></mrow></msup></mrow><mo>⁡</mo><mrow><msqrt><mn>2</mn></msqrt></mrow></mrow></math><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/image_file_123.jpg\"/><br/>Clearly, equation of plane containing triangle OQS is x - y = 0   as <math><mi mathvariant=\"normal\"> O </mi><mfenced separators=\"|\"><mrow><mn>0,0</mn><mo>,</mo><mn>0</mn></mrow></mfenced><mo>,</mo><mi mathvariant=\"normal\"> Q </mi><mfenced separators=\"|\"><mrow><mn>3,3</mn><mo>,</mo><mn>0</mn></mrow></mfenced><mo>,</mo><mi mathvariant=\"normal\"> S </mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mn>, 3</mn></mrow></mfenced><mi mathvariant=\"normal\">  lies on it</mi></math><br ><math><mi mathvariant=\"normal\">let ax</mi><mo>+</mo><mi mathvariant=\"normal\">by</mi><mo>+</mo><mi mathvariant=\"normal\">cz</mi><mo>=</mo><mi mathvariant=\"normal\">d</mi></math><br ><math><mfenced separators=\"|\"><mrow><mn>0,0</mn><mo>,</mo><mn>0</mn></mrow></mfenced><mo> ⇒ </mo><mi>d</mi><mo>=</mo><mn>0</mn></math><br ><math><mfenced separators=\"|\"><mrow><mn>3,3</mn><mo>,</mo><mn>0</mn></mrow></mfenced><mo> ⇒ </mo><mi>a</mi><mo>+</mo><mi>b</mi><mo>=</mo><mn>0</mn></math><br ><math><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mn>3</mn></mrow></mfenced><mi> </mi><mo>⇒</mo><mfrac><mrow><mn>3</mn><mi>a</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>3</mn><mi>b</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mn>3</mn><mi>c</mi><mo>=</mo><mn>0</mn></math><br ><math><mo>⇒</mo><mi>c</mi><mo>=</mo><mn>0</mn></math><br ><math><mo>⇒</mo><mi>b</mi><mo>=</mo><mo>-</mo><mi>a</mi></math><br ><math><mi>x</mi><mo>-</mo><mi>y</mi><mo>=</mo><mn>0</mn></math><br >Also, length of perpendicular from P to the plane containing the triangle OQS is PT <math><mo>=</mo><mfrac><mrow><mn>3</mn></mrow><mrow><msqrt><mn>2</mn></msqrt></mrow></mfrac></math> .<br >Also equation of RS is <math><mover accent=\"true\"><mrow><mi>r</mi></mrow><mo>→</mo></mover><mo>=</mo><mn>3</mn><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover><mo>+</mo><mi>t</mi><mi> </mi><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mover accent=\"true\"><mrow><mi>i</mi></mrow><mo>^</mo></mover><mo>-</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mover accent=\"true\"><mrow><mi>j</mi></mrow><mo>^</mo></mover><mo>+</mo><mn>3</mn><mover accent=\"true\"><mrow><mi>k</mi></mrow><mo>^</mo></mover></mrow></mfenced></math><br ><math><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi> </mi><mn>3</mn><mo>-</mo><mfrac><mrow><mn>3</mn><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi> </mi><mn>3</mn><mi>t</mi></mrow></mfenced></math><br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/maths_43_paper1_1.jpg\"/><br >Let M be foot of <math><mo>⊥</mo></math> from origin on line passing through R,S<br >Let co - ordinates of <math><mi>M</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>3</mn><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi> </mi><mn>3</mn><mo>-</mo><mfrac><mrow><mn>3</mn><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi> </mi><mn>3</mn><mi>t</mi></mrow></mfenced></math><br ><math><mo>∵</mo></math> <math><mover accent=\"true\"><mrow><mi>O</mi><mi>M</mi></mrow><mo>→</mo></mover><mi> </mi><mo>.</mo><mi> </mi><mover accent=\"true\"><mrow><mi>R</mi><mi>S</mi></mrow><mo>→</mo></mover><mo>=</mo><mn>0</mn></math><br ><math><mo>⇒</mo></math> <math><mfrac><mrow><mn>9</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mi>t</mi><mo>-</mo><mfrac><mrow><mn>3</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mfenced separators=\"|\"><mrow><mn>3</mn><mo>-</mo><mfrac><mrow><mn>3</mn><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced><mo>+</mo><mn>9</mn><mi>t</mi><mo>=</mo><mn>0</mn></math><br ><math><mo>⇒</mo></math> <math><mfrac><mrow><mn>9</mn><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mn>9</mn><mi>t</mi><mo>=</mo><mfrac><mrow><mn>9</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math><br ><math><mo>⇒</mo></math> <math><mi>t</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math><br ><math><mo>∴</mo></math> <math><mi>M</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>2</mn></mrow></mfrac><mo>,</mo><mi> </mi><mn>1</mn></mrow></mfenced></math><br ><math><mo>⇒</mo></math> <math><mi>O</mi><mi>M</mi><mo>=</mo><mi> </mi><msqrt><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><mn>25</mn></mrow><mrow><mn>4</mn></mrow></mfrac><mo>+</mo><mn>1</mn></msqrt><mo>=</mo><mi> </mi><msqrt><mfrac><mrow><mn>30</mn></mrow><mrow><mn>4</mn></mrow></mfrac></msqrt><mo>=</mo><mi> </mi><msqrt><mfrac><mrow><mn>15</mn></mrow><mrow><mn>2</mn></mrow></mfrac></msqrt></math>", "image": null}, "videoSolution": {"videoId": "84bb6fd69d3b42c6ae54815a4ec542e0", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/wKsWB4Q0uAO7P.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/wKsWB4Q0uAO7P.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf828", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016 (Paper 1)", "title": "JEE Advanced 2016 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a45f23ac7d519f9b2e1", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf826", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2015-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2015 (Paper 1)", "title": "JEE Advanced 2015 (Paper 1)"}], "type": "multipleCorrect", "level": 2, "question": {"text": "In <math><msup><mrow><mi mathvariant=\"normal\">R</mi></mrow><mrow><mn>3</mn></mrow></msup></math> , let L be a straight line passing through the origin. Suppose that all the points on L are at a constant distance from the two planes <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub><mi mathvariant=\"normal\">&#160;</mi><mo>:</mo><mi mathvariant=\"normal\">x</mi><mo>+</mo><mn>2</mn><mi mathvariant=\"normal\">y</mi><mo>-</mo><mi mathvariant=\"normal\">z</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>0</mn><mi mathvariant=\"normal\">&#160;</mi></math> and <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub><mi mathvariant=\"normal\">&#160;</mi><mo>:</mo><mn>2</mn><mi mathvariant=\"normal\">x</mi><mo>-</mo><mi mathvariant=\"normal\">y</mi><mo>+</mo><mi mathvariant=\"normal\">z</mi><mo>-</mo><mn>1</mn><mo>=</mo><mn>0</mn><mo>.</mo></math> Let M be the locus of the feet of the perpendiculars drawn from the points on L to the plane <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub></math> . Which of the following points lie (s) on M ?", "image": null}, "options": [{"id": "C7KVk", "text": "<math><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mo>-</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></math>", "isCorrect": true, "image": null}, {"id": "suPSG", "text": "<math><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mo>,</mo><mi mathvariant=\"normal\"> </mi><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></math>", "isCorrect": true, "image": null}, {"id": "vdiZv", "text": "<math><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mo>,</mo><mi mathvariant=\"normal\"> </mi><mn>0</mn><mo>,</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced><mi mathvariant=\"normal\"> </mi></math>", "isCorrect": false, "image": null}, {"id": "xYD0o", "text": "<math><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>,</mo><mi mathvariant=\"normal\">&nbsp;</mi><mn>0</mn><mo>,</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></math>", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Line L will lie on one of the angle bisector planes and will be parallel to line of intersection of the given planes. Also locus of foot of perpendicular of line L in plane <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub></math> will be line M, which will be parallel L.<br >Foot of perpendicular from (0, 0, 0) on plane <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub></math>  is  <math><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mo>,</mo><mi mathvariant=\"normal\"> </mi><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></math> <br >Hence equation of line M<br > <math><mfrac><mrow><mi mathvariant=\"normal\">x</mi><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac></mrow><mrow><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">y</mi><mo>+</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow><mrow><mo>-</mo><mn>3</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi mathvariant=\"normal\">z</mi><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac></mrow><mrow><mo>-</mo><mn>5</mn></mrow></mfrac></math> <br >Where  <math><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">i</mi></mrow><mo>^</mo></mover><mo>-</mo><mn>3</mn><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">j</mi></mrow><mo>^</mo></mover><mo>-</mo><mn>5</mn><mover accent=\"true\"><mrow><mi mathvariant=\"normal\">k</mi></mrow><mo>^</mo></mover></math>  is vector parallel to line of intersection of <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>1</mn></mrow></msub></math> and <math><msub><mrow><mi mathvariant=\"normal\">P</mi></mrow><mrow><mn>2</mn></mrow></msub></math> .<br >On checking <math><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi mathvariant=\"normal\"> </mi><mo>-</mo><mfrac><mrow><mn>5</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mo>-</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced><mo>,</mo><mi mathvariant=\"normal\"> </mi><mfenced separators=\"|\"><mrow><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac><mo>,</mo><mi mathvariant=\"normal\"> </mi><mo>-</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></math>  satisfy the above equation.", "image": null}, "videoSolution": {"videoId": "c75c8706256e4df0af92bc7d2bc0d741", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/yAddOXROv5Ofm.480.jpeg", "thumbnailDark": "https://d1z78r8i50
