x_0$ is equal to", "image": null}, "options": [{"id": "rIweA", "text": "\n$\\frac{1}{6}$\n", "image": null, "isCorrect": false}, {"id": "Lwepk", "text": "\n$\\frac{1}{2}$\n", "image": null, "isCorrect": false}, {"id": "QcTOM", "text": "\n$\\frac{1}{2}$\n", "image": null, "isCorrect": true}, {"id": "cDfc0", "text": "\n6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Taking log on both sides,\n$$\n\\log 2 \\cdot \\log (2 x)=\\log 3(\\log 3 y)\n$$\n\n\n$$\n\\begin{array}{ll}\n\\Rightarrow & \\log 2\\{\\log 2+\\log x\\} \\\\\n& =\\log 3\\{\\log 3+\\log y\\} \\\\\n\\text { and } & \\log x \\cdot \\log 3=\\log y \\log 2 \\\\\n& \\log y=\\frac{\\log x \\cdot \\log 3}{\\log 2}\n\\end{array}\n$$\nFrom Eqs. (i) and (ii), we get\n$$\n\\begin{aligned}\n& \\log 2\\{\\log 2+\\log x\\} \\\\\n&=\\log 3 \\cdot\\left\\{\\log 3+\\frac{\\log x \\cdot \\log 3}{\\log 2}\\right\\} \\\\\n& \\Rightarrow \\quad(\\log 2)^2+\\log 2 \\cdot \\log x \\\\\n&=(\\log 3)^2+\\frac{(\\log 3)^2}{(\\log 2)} \\cdot \\log x \\\\\n& \\Rightarrow \\quad \\log x\\left\\{\\frac{(\\log 3)^2}{\\log 2}-\\log 2\\right\\} \\\\\n&=(\\log 2)^2-(\\log 3)^2\n\\end{aligned}\n$$\n\n$$\n\\begin{aligned}\n& \\Rightarrow \\quad \\log x=-\\log 2=\\log 2^{-1} \\\\\n& \\therefore \\quad x=\\frac{1}{2}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64b16aedf23ac7d519f9b9a3", "title": "Inequalities", "totalQuestions": 1, "questions": [{"_id": "64b169edf23ac7d519f9afc1", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}], "question": {"text": "Match the Statements/Expressions in Column I with the Statements/Expressions in Column II.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/NV6MxxlCrdeWHLs9r4Y0EOApcJx3jyAt7MA2okb20P0.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "b8qKo", "text": "\n(A) r, (B) q,r, (C) s, (D) p,r\n", "image": null, "isCorrect": false}, {"id": "XhihE", "text": "\n(A) s, (B) q,s, (C) r, (D) p,q\n", "image": null, "isCorrect": false}, {"id": "YfPGY", "text": "\n(A) s, (B) q,r, (C) s, (D) p,q\n", "image": null, "isCorrect": false}, {"id": "Cosfd", "text": "\n(A) r, (B) q,s, (C) r, (D) p,r", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(A) Let $y=\\frac{x^2+2 x+4}{x+2}$\n$$\n\\begin{aligned}\n& \\Rightarrow x^2+(2-y) x+(4-2 y)=0 \\\\\n& \\Rightarrow \\quad(2-y)^2-4(4-2 y) \\geq 0 \\\\\n& \\Rightarrow \\quad y^2+4 y-12 \\geq 0 \\\\\n& \\Rightarrow \\quad y \\leq-6, y \\geq 2 \\\\\n&\n\\end{aligned}\n$$\n$\\therefore$ Minimum value of $y$ is 2 .\n(B) Since, $(A+B)(A-B)=(A-B)(A+B)$\n$$\n\\begin{aligned}\n& \\Rightarrow \\quad A^2-A B+B A-B^2=A^2+A B-B A-B^2 \\\\\n& \\Rightarrow \\quad A B=B A \\\\\n& \\text { and } \\quad(A B)^t=(-1)^k A B \\\\\n& \\Rightarrow \\quad B^t A^t=(-1)^k A B \\\\\n& \\Rightarrow \\quad-B A=(-1)^k A B \\quad\\left[\\because B^t=-B, A^t=A\\right] \\\\\n& \\Rightarrow \\quad B A=(-1)^{k+1} A B \\\\\n& \\Rightarrow \\quad(-1)^{k+1}=1 \\\\\n&\n\\end{aligned}\n$$\n\n$\\therefore k+1$ is even or $k$ is odd.\n(C) $1 < 2^{\\left(-k+3^{-a}\\right)} < 2 \\Rightarrow 0 < -k+3^{-a} < 1$\nGiven, $a=\\log _3 \\log _3 2 \\Rightarrow 3^a=\\log _3 2$\n$$\n\\begin{array}{lc}\n\\Rightarrow & 3^{-a}=\\log _2 3 \\\\\n\\therefore & k < \\log _2 3 < 2 \\\\\n\\text { and } & 1+k>\\log _2 3>1 \\Rightarrow k>0\n\\end{array}\n$$\nFrom Eqs. (ii) and (iii), $0 < k < 2 \\Rightarrow k=1$\n$[\\because k$ is an integer]\n$$\n\\begin{array}{rlrl}\n\\text { (D) } & \\sin \\theta & =\\cos \\phi \\\\\n\\Rightarrow & \\cos \\left(\\frac{\\pi}{2}-\\theta\\right) & =\\cos \\phi \\\\\n\\Rightarrow & \\frac{\\pi}{2}-\\theta & =2 n \\pi \\pm \\phi, n \\in Z \\\\\n\\Rightarrow & & \\theta \\pm \\phi-\\frac{\\pi}{2} & =-2 n \\pi, n \\in Z \\\\\n\\Rightarrow & & \\frac{1}{\\pi}\\left(\\theta \\pm \\phi-\\frac{\\pi}{2}\\right) & =-2 n, n \\in Z\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
