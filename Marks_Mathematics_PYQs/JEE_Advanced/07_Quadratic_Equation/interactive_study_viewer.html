    const data = {"index": 7, "chapterId": "61602526509c05a62a6370be", "chapter": "Quadratic Equation", "exam": "JEE Advanced", "subject": "Mathematics", "totalTopics": 4, "totalQuestions": 19, "downloadTime": "2026-10-08 20:36:05", "topics": [{"index": 1, "topicId": "64b16ae4f23ac7d519f9b93b", "title": "Relation between Roots and Coefficients", "totalQuestions": 16, "questions": [{"_id": "6a0be51244d287c9361e5cad", "type": "multipleCorrect", "question": {"text": "Let $a, b, c$ be positive integers in arithmetic progression such that the equation<br>$ax^2 + bx + c = 0$<br>has only integer solutions.<br>Then which of the following statements is (are) TRUE ?", "image": null}, "options": [{"id": "7ZAQk", "text": "$c - b$ is an integer multiple of $a$", "isCorrect": true, "image": null}, {"id": "cZEWy", "text": "Both the roots of the equation $ax^2 + bx + c = 0$ are odd integers", "isCorrect": true, "image": null}, {"id": "eRgn1", "text": "If $c = 15$, then $ab = 8$", "isCorrect": true, "image": null}, {"id": "UWHDC", "text": "If $b = 8$, then $x = 3$ is a root of the equation $ax^2 + bx + c = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $a, b, c$ are in arithmetic progression, we have $2b = a + c$.<br><br>Let the integer roots of the equation $ax^2 + bx + c = 0$ be $\\alpha$ and $\\beta$.<br><br>Sum of the roots is $\\alpha + \\beta = -\\dfrac{b}{a}$ and product of the roots is $\\alpha \\beta = \\dfrac{c}{a}$.<br><br>Dividing the arithmetic progression condition by $a$, we get:<br><br>$\\dfrac{2b}{a} = 1 + \\dfrac{c}{a}$<br><br>Substituting the sum and product of the roots:<br><br>$-2(\\alpha + \\beta) = 1 + \\alpha \\beta$<br><br>$\\alpha \\beta + 2\\alpha + 2\\beta + 1 = 0$<br><br>Adding $3$ to both sides to factorize:<br><br>$\\alpha \\beta + 2\\alpha + 2\\beta + 4 = 3$<br><br>$(\\alpha + 2)(\\beta + 2) = 3$<br><br>Since $\\alpha$ and $\\beta$ are integers, $(\\alpha + 2)$ and $(\\beta + 2)$ must be integer factors of $3$. The possible pairs are $(1, 3)$, $(3, 1)$, $(-1, -3)$, and $(-3, -1)$.<br><br>If $(\\alpha + 2, \\beta + 2) = (1, 3)$ or $(3, 1)$, the roots are $-1$ and $1$. The sum of the roots is $0$, which implies $b = 0$. This is rejected because $b$ is a positive integer.<br><br>If $(\\alpha + 2, \\beta + 2) = (-1, -3)$ or $(-3, -1)$, the roots are $-3$ and $-5$. The sum of the roots is $-8$, which implies $-\\dfrac{b}{a} = -8 \\Rightarrow b = 8a$.<br><br>The product of the roots is $15$, which implies $\\dfrac{c}{a} = 15 \\Rightarrow c = 15a$.<br><br>Since $a$ is a positive integer, $b = 8a$ and $c = 15a$ are also positive integers. The roots of the equation are always $-3$ and $-5$.<br><br>Evaluating the given statements:<br><br>$c - b = 15a - 8a = 7a$, which is an integer multiple of $a$.<br><br>The roots are $-3$ and $-5$, both of which are odd integers.<br><br>If $c = 15$, then $15a = 15 \\Rightarrow a = 1$. Consequently, $b = 8(1) = 8$. Thus, $ab = 1 \\times 8 = 8$.<br><br>If $b = 8$, then $8a = 8 \\Rightarrow a = 1$. The roots are $-3$ and $-5$, so $x = 3$ is not a root.<br><br>Answer: $c - b$ is an integer multiple of $a$; Both the roots of the equation $ax^2 + bx + c = 0$ are odd integers; If $c = 15$, then $ab = 8$", "image": null}, "level": 3, "videoSolution": {"videoId": "b660ce9950db42938654e088d36ffef1", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/SgZlsi6fd8HON.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/SgZlsi6fd8HON.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b43", "title": "JEE Advanced 2026 (Paper 2)", "shortName": "2026 (Paper 2)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a0be4ef402904185b819b43", "title": "JEE Advanced 2026 (Paper 2)", "shortName": "2026 (Paper 2)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a0be50d44d287c9361e5c84", "type": "singleCorrect", "question": {"text": "Match each entry in List-I to the correct entry in List-II and choose the correct option.<br><table style=\"border: 1px solid black; border-collapse: collapse; width: auto;\"><tr><th style=\"border: 1px solid black; padding: 10px;\">List-I</th><th style=\"border: 1px solid black; padding: 10px;\">List-II</th></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(P) If $\\alpha$ and $\\beta$ are the distinct roots of the equation $x^2 + x + 1 = 0$, then the quadratic equation with roots $\\dfrac{1}{(\\alpha+1)^{2026}}$ and $\\dfrac{1}{(\\beta+1)^{2026}}$ is</td><td style=\"border: 1px solid black; padding: 10px;\">(1) $x^2 + x + 1 = 0$</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(Q) If $\\alpha$ and $\\beta$ are the distinct roots of the equation $x^2 + x + 1 = 0$, then the quadratic equation with roots $\\dfrac{1}{(\\alpha+1)^{2027}}$ and $\\dfrac{1}{(\\beta+1)^{2027}}$ is</td><td style=\"border: 1px solid black; padding: 10px;\">(2) $x^2 - x + 1 = 0$</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(R) If $\\gamma$ and $\\delta$ are the distinct roots of the equation $x^2 - x + 1 = 0$, then the value of $\\dfrac{1}{(\\gamma-1)^{2026}} + \\dfrac{1}{(\\delta-1)^{2026}}$ is</td><td style=\"border: 1px solid black; padding: 10px;\">(3) $x^2 + x - 1 = 0$</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\">(S) If $p$ and $r$ are the distinct roots of the equation $x^2 + x - 1 = 0$, then the value of $\\dfrac{1}{(p+1)^3} + \\dfrac{1}{(r+1)^3}$ is</td><td style=\"border: 1px solid black; padding: 10px;\">(4) $-1$</td></tr><tr><td style=\"border: 1px solid black; padding: 10px;\"></td><td style=\"border: 1px solid black; padding: 10px;\">(5) $-4$</td></tr></table>", "image": null}, "options": [{"id": "Tni7R", "text": "(P) $\\rightarrow$ (1), (Q) $\\rightarrow$ (2), (R) $\\rightarrow$ (5), (S) $\\rightarrow$ (4)", "isCorrect": false, "image": null}, {"id": "JVeBb", "text": "(P) $\\rightarrow$ (3), (Q) $\\rightarrow$ (1), (R) $\\rightarrow$ (4), (S) $\\rightarrow$ (5)", "isCorrect": false, "image": null}, {"id": "PB3yP", "text": "(P) $\\rightarrow$ (1), (Q) $\\rightarrow$ (2), (R) $\\rightarrow$ (4), (S) $\\rightarrow$ (5)", "isCorrect": true, "image": null}, {"id": "fdBTx", "text": "(P) $\\rightarrow$ (2), (Q) $\\rightarrow$ (3), (R) $\\rightarrow$ (5), (S) $\\rightarrow$ (4)", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For (P):<br>Since $\\alpha$ and $\\beta$ are roots of $x^2 + x + 1 = 0$, we have $\\alpha^2 + \\alpha + 1 = 0 \\Rightarrow \\alpha + 1 = -\\alpha^2$ and $\\alpha^3 = 1$.<br>$\\dfrac{1}{(\\alpha+1)^{2026}} = \\dfrac{1}{(-\\alpha^2)^{2026}} = \\dfrac{1}{\\alpha^{4052}}$<br>Since $4052 = 3 \\times 1350 + 2$, $\\alpha^{4052} = (\\alpha^3)^{1350} \\cdot \\alpha^2 = \\alpha^2$.<br>Thus, $\\dfrac{1}{\\alpha^2} = \\dfrac{\\alpha^3}{\\alpha^2} = \\alpha$.<br>Similarly, $\\dfrac{1}{(\\beta+1)^{2026}} = \\beta$.<br>The quadratic equation with roots $\\alpha$ and $\\beta$ is the original equation $x^2 + x + 1 = 0$.<br>So, (P) $\\rightarrow$ (1).<br><br>For (Q):<br>$\\dfrac{1}{(\\alpha+1)^{2027}} = \\dfrac{1}{(-\\alpha^2)^{2027}} = -\\dfrac{1}{\\alpha^{4054}}$<br>Since $4054 = 3 \\times 1351 + 1$, $\\alpha^{4054} = \\alpha$.<br>Thus, $-\\dfrac{1}{\\alpha} = -\\beta$.<br>Similarly, the other root is $-\\alpha$.<br>Sum of roots $= -\\alpha - \\beta = -(\\alpha + \\beta) = -(-1) = 1$.<br>Product of roots $= (-\\alpha)(-\\beta) = \\alpha\\beta = 1$.<br>The quadratic equation is $x^2 - x + 1 = 0$.<br>So, (Q) $\\rightarrow$ (2).<br><br>For (R):<br>Since $\\gamma$ and $\\delta$ are roots of $x^2 - x + 1 = 0$, we have $\\gamma^2 - \\gamma + 1 = 0 \\Rightarrow \\gamma - 1 = \\gamma^2$ and $\\gamma^3 = -1$.<br>$\\dfrac{1}{(\\gamma-1)^{2026}} = \\dfrac{1}{(\\gamma^2)^{2026}} = \\dfrac{1}{\\gamma^{4052}}$<br>$\\gamma^{4052} = (\\gamma^3)^{1350} \\cdot \\gamma^2 = (-1)^{1350} \\cdot \\gamma^2 = \\gamma^2$.<br>Thus, $\\dfrac{1}{\\gamma^2} = \\dfrac{\\gamma}{\\gamma^3} = -\\gamma$.<br>Similarly, the second term is $-\\delta$.<br>The sum is $-\\gamma - \\delta = -(\\gamma + \\delta) = -(1) = -1$.<br>So, (R) $\\rightarrow$ (4).<br><br>For (S):<br>Since $p$ and $r$ are roots of $x^2 + x - 1 = 0$, we have $x^2 + x = 1 \\Rightarrow x(x+1) = 1 \\Rightarrow x+1 = \\dfrac{1}{x}$.<br>$\\dfrac{1}{(p+1)^3} + \\dfrac{1}{(r+1)^3} = p^3 + r^3$<br>We know $p+r = -1$ and $pr = -1$.<br>$p^3 + r^3 = (p+r)^3 - 3pr(p+r) = (-1)^3 - 3(-1)(-1) = -1 - 3 = -4$.<br>So, (S) $\\rightarrow$ (5).<br><br>Answer: (P) $\\rightarrow$ (1), (Q) $\\rightarrow$ (2), (R) $\\rightarrow$ (4), (S) $\\rightarrow$ (5)", "image": null}, "level": 3, "videoSolution": {"videoId": "626a4ef61a674f12bdc77d7288bfe01d", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/5nFtNuIVpEDAZ.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/5nFtNuIVpEDAZ.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "previousYearPapers": [{"_id": "6a0be4ef402904185b819b42", "title": "JEE Advanced 2026 (Paper 1)", "shortName": "2026 (Paper 1)", "isVisible": true, "heldOn": "2026-05-25T09:00:00.000Z", "examId": "615d76cfc52ffa3c944600e0"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructu mi><mi>P</mi><mfenced separators=\"|\"><mrow><mi>P</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced></mrow></mfenced><mo>≠</mo><mn>0</mn></math><br />Hence real or purely imaginary number can not satisfy <math><mi>P</mi><mi>&nbsp;</mi><mfenced separators=\"|\"><mrow><mi>P</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced></mrow></mfenced><mo>=</mo><mn>0</mn></math>", "image": null}, "videoSolution": {"videoId": "635b7a587a62461395a60d249e551bee", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/7Da4dFN9Wurmz.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/7Da4dFN9Wurmz.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf825", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2014-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2014 (Paper 2)", "title": "JEE Advanced 2014 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a0ff23ac7d519f9b0f9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}], "question": {"text": "Let $\\alpha$ and $\\beta$ be the roots of $x^2-6 x-2=0$ with $\\alpha>\\beta$. If $a_n=\\alpha^n-\\beta^n$ for $n \\geq 1$, then the value of $\\frac{a_{10}-2 a_8}{2 a_9}$ is", "image": null}, "options": [{"id": "z5X8C", "text": "\n1\n", "image": null, "isCorrect": false}, {"id": "7NS6l", "text": "\n2\n", "image": null, "isCorrect": false}, {"id": "aIRIg", "text": "\n3\n", "image": null, "isCorrect": true}, {"id": "fAnhz", "text": "\n4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{a_{10}-2 a_8}{2 a_9}=\\frac{\\left(\\alpha^{10}-\\beta^{10}\\right)-2\\left(\\alpha^8-\\beta^8\\right)}{2\\left(\\alpha^9-\\beta^9\\right)}$ $=\\frac{\\alpha^8\\left(\\alpha^2-2\\right)-\\beta^8\\left(\\beta^2-2\\right)}{2\\left(\\alpha^9-\\beta^9\\right)}$ $\\left[\\because \\alpha\\right.$ is root of $x^2-6 x-2=0$ $\\left.\\alpha^2-2=6 \\alpha\\right]$\nAlso, $\\beta$ is root of $x^2-6 x-2=0$\n$$\n\\begin{aligned}\n& \\Rightarrow \\quad \\beta^2-2=6 \\beta \\\\\n& =\\frac{\\alpha^8(6 \\alpha)-\\beta^8(6 \\beta)}{2\\left(\\alpha^9-\\beta^9\\right)}=\\frac{6\\left(\\alpha^9-\\beta^9\\right)}{2\\left(\\alpha^9-\\beta^9\\right)}=3\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a01f23ac7d519f9b072", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}], "question": {"text": "Let $p$ and $q$ be real numbers such that $p \\neq 0, p^3 \\neq q$ and $p^3 \\neq-q$. If $\\alpha$ and $\\beta$ are non-zero complex numbers satisfying $\\alpha+\\beta=-p$ and $\\alpha^3+\\beta^3=q$, then $a$ quadratic equation having $\\frac{\\alpha}{\\beta}$ and $\\frac{\\beta}{\\alpha}$ as its roots is", "image": null}, "options": [{"id": "8XTiS", "text": "\n$\\left(p^3+q\\right) x^2-\\left(p^3+2 q\\right) x$\n$$\n+\\left(p^3+q\\right)=0\n$$\n", "image": null, "isCorrect": false}, {"id": "5wMMA", "text": "\n$\\left(p^3+q\\right) x^2-\\left(p^3-2 q\\right) x$\n$$\n+\\left(p^3+q\\right)=0\n$$\n", "image": null, "isCorrect": true}, {"id": "CjxSO", "text": "\n$\\left(p^3-q\\right) x^2-\\left(5 p^3-2 q\\right) x$\n$$\n+\\left(p^3-q\\right)=0\n$$\n", "image": null, "isCorrect": false}, {"id": "Xquxo", "text": "\n$\\left(p^3-q\\right) x^2-\\left(5 p^3+2 q\\right) x$\n$$\n+\\left(p^3-q\\right)=0\n$$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Sum of roots $=\\frac{\\alpha^2+\\beta^2}{\\alpha \\beta}$ and product $=1$\nGiven, $\\alpha+\\beta=-p$ and $\\alpha^3+\\beta^3=q$\n$$\n\\begin{aligned}\n& \\Rightarrow(\\alpha+\\beta)\\left(\\alpha^2-\\alpha \\beta+\\beta^2\\right)=q \\\\\n& \\therefore \\quad \\alpha^2+\\beta^2-\\alpha \\beta=\\frac{-q}{p}\n\\end{aligned}\n$$\nand $\\quad(\\alpha+\\beta)^2=p^2$\n$$\n\\Rightarrow \\quad \\alpha^2+\\beta^2+2 \\alpha \\beta=p^2\n$$\nFrom Eqs. (i) and (ii), we get\n$$\n\\alpha^2+\\beta^2=\\frac{p^3-2 q}{3 p}\n$$\nand $\\alpha \\beta=\\frac{p^3+q}{3 p}$\n$\\therefore$ Required equation is\n$$\n\\begin{gathered}\nx^2-\\frac{\\left(p^3-2 q\\right) x}{\\left(p^3+q\\right)}+1=0 \\\\\n\\Rightarrow\\left(p^3+q\\right) x^2-\\left(p^3-2 q\\right) x+\\left(p^3+q\\right)=0\n\\end{gathered}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c46", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010 (Paper 1)", "title": "JEE Advanced 2010 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169faf23ac7d519f9b032", "type": "numerical", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c45", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 2)", "title": "JEE Advanced 2009 (Paper 2)"}], "question": {"text": "The smallest value of $k$, for which both the roots of the equation $x^2-8 k x+16\\left(k^2-k+1\\right)=0$ are real, distinct and have values atleast 4 , is", "image": null}, "options": [], "correctValue": "2", "solution": {"text": "(i) Given, $x^2-8 k x+16\\left(k^2-k+1\\right)=0$\nNow, $\\quad D=64\\left\\{k^2-\\left(k^2-k+1\\right)\\right\\}$\n$$\n\\begin{aligned}\n& =64(k-1)>0 \\\\\n& \\therefore \\quad k>1 \\\\\n& 16-32 k+16\\left(k^2-k+1\\right) \\geq 0 \\\\\n& \\Rightarrow \\quad k^2-3 k+2 \\geq 0 \\\\\n& \\Rightarrow(k-2)(k-1) \\geq 0 \\Rightarrow k \\leq 1 \\text { or } k \\geq 2 \\\\\n&\n\\end{aligned}\n$$\nHence, $k=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c45", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 2)", "title": "JEE Advanced 2009 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169ecf23ac7d519f9afb7", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}], "question": {"text": "Let $a, b, c, p, q$ be real numbers.\nSuppose, $\\alpha, \\beta$ are the roots of the equation $x^2+2 p x+q=0$ and $\\alpha, \\frac{1}{\\beta}$ are the roots of the equation $a x^2+2 b x+c=0$, where $\\beta^2 \\notin\\{-1,0,1\\}$.\nStatement $1\\left(p^2-q\\right)\\left(b^2-a c\\right) \\geq 0$.\nStatement $2 b \\neq p a$ or $c \\neq q a$.", "image": null}, "options": [{"id": "VPhVe", "text": "\nStatement 1 is true, Statement 2 is true, Statement 2 is a correct explanation for Statement 1.\n", "image": null, "isCorrect": false}, {"id": "7ToRc", "text": "\nStatement 1 is true, Statement 2 is true, Statement 2 is not a correct explanation for Statement 1.\n", "image": null, "isCorrect": true}, {"id": "migVH", "text": "\nStatement 1 is true, Statement 2 is false.\n", "image": null, "isCorrect": false}, {"id": "Er8nn", "text": "\nStatement 1 is false, Statement 2 is true", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $\\alpha$ and $\\beta$ are the roots of $x^2+2 p x+q=0$.\n$$\n\\begin{array}{rlrl} \n& \\therefore & \\alpha+\\beta & =-2 p \\\\\n\\text { and } & \\alpha \\beta & =q\n\\end{array}\n$$\n$\\alpha$ and $\\frac{1}{\\beta}$ are the roots of $a x^2+2 b x+c=0$\nand\n$$\n\\alpha+\\frac{1}{\\beta}=\\frac{-2 b}{a}\n$$\n\nand\n$$\n\\frac{\\alpha}{\\beta}=\\frac{c}{a}\n$$\n$$\n\\text { Now, } \\begin{aligned}\n\\left(p^2-q\\right)\\left(b^2-a c\\right) & =\\left[\\left(\\frac{\\alpha+\\beta}{-2}\\right)^2-\\alpha \\beta\\right]\\left[\\left(\\frac{\\alpha+\\frac{1}{\\beta}}{2}\\right)^2-\\frac{\\alpha}{\\beta}\\right] a^2 \\\\\n& =\\frac{(\\alpha-\\beta)^2}{16}\\left(\\alpha-\\frac{1}{\\beta}\\right)^2 \\cdot a^2 \\geq 0\n\\end{aligned}\n$$\nStatement 1 is true.\n$$\n\\begin{array}{ll}\n\\text { Again now, } & p a=-\\left(\\frac{\\alpha+\\beta}{2}\\right) a=-\\frac{a}{2}(\\alpha+\\beta) \\\\\n\\text { and } & b=-\\frac{a}{2}\\left(\\alpha+\\frac{1}{\\beta}\\right) \\\\\n& p a \\neq b \\Rightarrow \\alpha+\\frac{1}{\\beta} \\neq \\alpha+\\beta \\\\\n\\Rightarrow & \\beta \\neq 1 \\\\\n\\because & \\beta^2 \\neq\\{-1,0,1\\}, \\text { correct. } \\\\\n\\text { Similarly, if } & c \\neq q x \\\\\n\\Rightarrow & a \\frac{\\alpha}{\\beta} \\neq a \\alpha \\beta \\Rightarrow \\alpha\\left(\\beta-\\frac{1}{\\beta}\\right) \\neq 0\n\\end{array}\n$$\n\n$$\n\\begin{array}{ll}\n\\Rightarrow & \\alpha \\neq 0 \\text { and } \\beta-\\frac{1}{\\beta} \\neq 0 \\\\\n\\Rightarrow & \\beta \\neq\\{-1,0,1\\}\n\\end{array}\n$$\nStatement 2 is true.\nBoth Statement 1 and Statement 2 are true. But Statement 2 does not explain Statement 1.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c43", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 2)", "title": "JEE Advanced 2008 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169d6f23ac7d519f9aee9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}], "question": {"text": "Let $\\alpha, \\beta$ be the roots of the equation $x^2-p x+r=0$ and $\\frac{\\alpha}{2}, 2 \\beta$ be the roots of the equation $x^2-q x+r=0$. Then, the value of $r$ is", "image": null}, "options": [{"id": "uAnxI", "text": "\n$\\frac{2}{9}(p-q)(2 q-p)$\n", "image": null, "isCorrect": false}, {"id": "PX6uM", "text": "\n$\\frac{2}{9}(q-p)(2 p-q)$\n", "image": null, "isCorrect": false}, {"id": "Tcw9W", "text": "\n$$\n\\frac{2}{9}(q-2 p)(2 q-p)\n$$\n", "image": null, "isCorrect": false}, {"id": "ufsmq", "text": "\n$\\frac{2}{9}(2 p-q)(2 q-p)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The equation $x^2-p x+r=0$ has roots $(\\alpha, \\beta)$ and the equation $x^2-q x+r=0$ has roots\n$$\n\\begin{array}{ll}\n\\left(\\frac{\\alpha}{2}, 2 \\beta\\right) . & \\\\\n\\Rightarrow & r=\\alpha \\beta \\text { and } \\alpha+\\beta=p \\text { and } \\frac{\\alpha}{2}+2 \\beta=q \\\\\n\\Rightarrow & \\beta=\\frac{2 q-p}{3} \\text { and } \\alpha=\\frac{2(2 p-q)}{3} \\\\\n\\Rightarrow & \\alpha \\beta=r=\\frac{2}{9}(2 q-p)(2 p-q)\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169d0f23ac7d519f9aeb2", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}], "question": {"text": "If $x^2-10 a x-11 b=0$ have roots $c$ and $d$ and $x^2-10 c x-11 d=0$ have roots $a$ and $b$, then, find $a+b+c+d$.", "image": null}, "options": [], "correctValue": "1210", "solution": {"text": "Here, $a+b=10 c$\n$$\nc+d=10 a\n$$\nOn subtracting Eq. (ii) from Eq. (i), we get, $\\quad(a-c)+(b-d)=10(c-a)$ $\\Rightarrow \\quad(b-d)=11(c-a)$\nSince, $c$ is the root of $x^2-10 a x+11 b=0$\n$$\n\\Rightarrow \\quad c^2-10 a c-11 b=0\n$$\nSimilarly, $a$ is the root of\n$$\n\\begin{aligned}\n\\Rightarrow & x^2-10 c x+11 d=0 \\\\\n& a^2-10 c a-11 d=0\n\\end{aligned}\n$$\nOn subtracting Eq. (v) from Eq. (iv), we get\n$$\n\\begin{aligned}\n& \\left(c^2-a^2\\right)=11(b-d) \\\\\n& \\therefore \\quad(c+a)(c-a)=11 \\times 11(c-a) \\quad\\{\\text { from (i) \\& (ii) } \\\\\n& \\Rightarrow \\quad c+a=121 . \\\\\n& \\therefore \\quad a+b+c+d=10 c+10 a \\\\\n& =10(c+a)=1210 \\\\\n&\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64b16ae4f23ac7d519f9b93c", "title": "Common Roots", "totalQuestions": 1, "questions": [{"_id": "64b16a16f23ac7d519f9b139", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c49", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 2)", "title": "JEE Advanced 2011 (Paper 2)"}], "question": {"text": "The value of $b$ for which the equations $x^2+b x-1=0, x^2+x+b=0$ have one root in common is", "image": null}, "options": [{"id": "G9nnD", "text": "\n$-\\sqrt{2}$\n", "image": null, "isCorrect": false}, {"id": "9G3iR", "text": "\n$-i \\sqrt{3}$\n", "image": null, "isCorrect": true}, {"id": "cy1mf", "text": "\n$i \\sqrt{5}$\n", "image": null, "isCorrect": false}, {"id": "bXNJ7", "text": "\n$\\sqrt{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If $\\quad a_1 x^2+b_1 x+c_1=0$\nand $a_2 x^2+b_2 x+c_2=0$\nhave a common real root, then\n$$\n\\begin{aligned}\n\\Rightarrow \\quad\\left(a_1 c_2-a_2 c_1\\right)^2=\\left(b_1 c_2-\\right. & \\left.b_2 c_1\\right) \\\\\n& \\left(a_1 b_2-a_2 b_1\\right)\n\\end{aligned}\n$$\n$\\left.\\therefore \\begin{array}{l}x^2+b x-1=0 \\\\ x^2+x+b=0\\end{array}\\right\\}$ have a common root.\n$\\Rightarrow \\quad(1+b)^2=\\left(b^2+1\\right)(1-b)$\n$\\Rightarrow b^2+2 b+1=b^2-b^3+1-b$\n$\\Rightarrow \\quad b^3+3 b=0 \\Rightarrow b\\left(b^2+3\\right)=0$\n$\\Rightarrow \\quad b=0, \\pm \\sqrt{3} i$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c49", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 2)", "title": "JEE Advanced 2011 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64b16ae4f23ac7d519f9b93e", "title": "N degree equation", "totalQuestions": 1, "questions": [{"_id": "64b16a8df23ac7d519f9b578", "previousYearPapers": [{"_id": "619f94337e944e1fdc2859b4", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T09 org/1998/Math/MathML\"><mi>x</mi><mo>=</mo><mfrac><mrow><mn>1</mn><mo>&#177;</mo><msqrt><mn>1</mn><mo>+</mo><mn>12</mn></msqrt></mrow><mn>2</mn></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>+</mo><msqrt><mn>13</mn></msqrt></mrow><mn>2</mn></mfrac><mo>,</mo><mfrac><mrow><mn>1</mn><mo>-</mo><msqrt><mn>13</mn></msqrt></mrow><mn>2</mn></mfrac></math></p><p>We know,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn><mo>&#60;</mo><msqrt><mn>13</mn></msqrt><mo>&#60;</mo><mn>4</mn></math></p><p>So, both roots lie in the interval&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mo>-</mo><mo>&#8734;</mo><mo>,</mo><mo>-</mo><mn>1</mn><mo>]</mo><mo>&#8746;</mo><mo>[</mo><mn>1</mn><mo>,</mo><mo>&#8734;</mo><mo>)</mo></math></p><p>Hence, <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>4</mn></math>&nbsp;real roots.</p>", "image": null}, "videoSolution": {"videoId": "27394975c4c144cc8937835ef85fe819", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/31RIijYtcRyND.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/31RIijYtcRyND.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": true}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "619f94337e944e1fdc2859b4", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2021-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2021 (Paper 1)", "title": "JEE Advanced 2021 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64b16ae4f23ac7d519f9b93d", "title": "Descartes Rule of Sign", "totalQuestions": 1, "questions": [{"_id": "64b16a1ef23ac7d519f9b181", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}], "type": "numerical", "level": 2, "question": {"text": "The value of\r\n\r\n$6+\\log _{\\frac{3}{2}}\\left(\\frac{1}{3 \\sqrt{2}} \\sqrt{4-\\frac{1}{3 \\sqrt{2}} \\sqrt{4-\\frac{1}{3 \\sqrt{2}} \\sqrt{4-\\frac{1}{3 \\sqrt{2}}} \\cdots}}\\right) \\text { is }$", "image": null}, "options": [], "correctValue": "4", "solution": {"text": "Let $x=\\frac{1}{3 \\sqrt{2}} \\sqrt{4-\\frac{1}{3 \\sqrt{2}} \\sqrt{4-\\frac{1}{3 \\sqrt{2}} \\sqrt{4-\\frac{1}{3 \\sqrt{2}}}}} \\ldots \\ldots$\r\n\r\n$\\Rightarrow \\quad x=\\frac{1}{3 \\sqrt{2}} \\sqrt{4-x}$ \r\n\r\n$\\Rightarrow \\quad 3 \\sqrt{2} x=\\sqrt{4-x}$\r\n\r\n$\\begin{array}{l}\r\n\r\n\\Rightarrow \\quad 18 x^{2}=4-x \\\\\r\n\r\n\\Rightarrow \\quad 18 x^{2}+x-4=0 \\\\\r\n\r\n\\Rightarrow \\quad(9 x-4)(2 x+1)=0 \\\\\r\n\r\n\\Rightarrow \\quad x=\\frac{4}{9} \\text { or } x=-\\frac{1}{2}\r\n\r\n\\end{array}$\r\n\r\n(Not possible because log is not define for -ve value)\r\n\r\n$\\begin{aligned}\r\n\r\n\\therefore \\quad & 6+\\log _{\\frac{3}{2}}\\left(\\frac{4}{9}\\right)=6+\\log _{\\frac{3}{2}}\\left(\\frac{3}{2}\\right)^{-2} \\\\\r\n\r\n&=6-2=4\r\n\r\n\\end{aligned}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
