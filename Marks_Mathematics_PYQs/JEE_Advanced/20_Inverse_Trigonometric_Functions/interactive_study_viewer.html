he statements in Column I with the values in Column II.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/-gTv06R5XWK5EKREPVN42FLFgZnm7GEW-trEZSNPICY.original.fullsize.png\"><br>", "image": null}, "options": [{"id": "18iJi", "text": "\nA-p; B-q; C-q; D-p\n", "image": null, "isCorrect": false}, {"id": "VOmNk", "text": "\nA-p; B-q; C-p; D-s\n", "image": null, "isCorrect": true}, {"id": "8qdjY", "text": "\nA-s; B-p; C-q; D-p\n", "image": null, "isCorrect": false}, {"id": "as28R", "text": "\nA-r; B-q; C-p; D-r", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A) If $a=1$ and $b=0$, then $\\sin ^{-1} x+\\cos ^{-1} y=0$\n$$\n\\Rightarrow \\quad \\sin ^{-1} x=-\\cos ^{-1} y \\Rightarrow x^2+y^2=1\n$$\n(B) If $a=1$ and $b=1$, then\n$$\n\\begin{array}{rlrl} \n& & \\sin ^{-1} x+\\cos ^{-1} y+\\cos ^{-1} x y & =\\frac{\\pi}{2} \\\\\n\\Rightarrow & & \\cos ^{-1} x-\\cos ^{-1} y & =\\cos ^{-1} x y \\\\\n\\Rightarrow & x y+\\sqrt{1-x^2} \\sqrt{1-y^2} & =x y \\quad \\text { [taking sine on both the sides] }\n\\end{array}\n$$\n(C) If $a=1$ and $b=2$, then\n$$\n\\begin{aligned}\n& & \\sin ^{-1} x+\\cos ^{-1} y+\\cos ^{-1}(2 x y) & =\\frac{\\pi}{2} \\\\\n\\Rightarrow & & \\cos ^{-1} x-\\cos ^{-1} y & =\\cos ^{-1}(2 x y) \\\\\n\\Rightarrow & & x y+\\sqrt{1-x^2} \\sqrt{1-y^2} & =2 x y \\\\\n\\Rightarrow & & x^2+y^2 & =1\n\\end{aligned}\n$$\n[on squaring]\n(D) If $a=2$ and $b=2$, then\n$$\n\\begin{aligned}\n& & \\sin ^{-1}(2 x)+\\cos ^{-1}(y)+\\cos ^{-1}(2 x y) & =\\frac{\\pi}{2} \\\\\n\\Rightarrow & & 2 x y+\\sqrt{1+4 x^2} \\sqrt{1-y^2} & =2 x y \\\\\n\\Rightarrow & & \\left(4 x^2-1\\right)\\left(y^2-1\\right) & =0 .\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c41", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 2)", "title": "JEE Advanced 2007 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64b16aebf23ac7d519f9b98c", "title": "Converting one Inverse T function to other Inverse T", "totalQuestions": 2, "questions": [{"_id": "64b16a11f23ac7d519f9b107", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Paper 1)", "title": "JEE Advanced 2011 (Paper 1)"}], "question": {"text": "Let $f(\\theta)=\\sin \\left[\\tan ^{-1}\\left(\\frac{\\sin \\theta}{\\sqrt{\\cos 2 \\theta}}\\right)\\right]$, where $-\\frac{\\pi}{4} < \\theta < \\frac{\\pi}{4}$. Then, the value of $\\frac{d}{d(\\tan \\theta)}(f(\\theta))$ is", "image": null}, "options": [], "correctValue": "1", "solution": {"text": "$f(\\theta)=\\sin \\left(\\tan ^{-1} \\frac{\\sin \\theta}{\\sqrt{\\cos 2 \\theta}}\\right),-\\frac{\\pi}{4} < \\theta < \\frac{\\pi}{4}$\nLet $\\tan ^{-1} \\frac{\\sin \\theta}{\\sqrt{\\cos 2 \\theta}}=\\phi$\n$$\n\\Rightarrow \\quad \\tan \\phi=\\frac{\\sin \\theta}{\\sqrt{\\cos 2 \\theta}}\n$$<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/bbRBtOL8gHVb5FgMH9HblcPKawLYnY879QtTMljq-9M.original.fullsize.png\"><br>\n$$\n\\begin{aligned}\n\\therefore \\quad \\sin \\phi & =\\frac{\\sin \\theta}{\\sqrt{\\sin ^2 \\theta+\\cos 2 \\theta}} \\\\\n& =\\frac{\\sin \\theta}{\\sqrt{1-\\sin ^2 \\theta}}=\\frac{\\sin \\theta}{\\cos \\theta}=\\tan \\theta\n\\end{aligned}\n$$\n\n$$\n\\begin{array}{ll}\n\\therefore & f(\\theta)=\\sin \\phi=\\tan \\theta \\\\\n\\Rightarrow & \\frac{d f(\\theta)}{d(\\tan \\theta)}=1\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c48", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011 (Pap 1\\right]^{1 / 2} \\\\\n&=x \\sqrt{1+x^2}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c42", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 1)", "title": "JEE Advanced 2008 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "64b16aebf23ac7d519f9b98d", "title": "Sum of complementary angles", "totalQuestions": 1, "questions": [{"_id": "64b16a2af23ac7d519f9b1ee", "previousYearPapers": [{"_id": "615d92eede3d91842a5cf822", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2013-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2013 (Paper 1)", "title": "JEE Advanced 2013 (Paper 1)"}], "type": "singleCorrect", "level": 2, "question": {"text": "The value of&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><mi>o</mi><mi>t</mi><mo>&#160;</mo><mfenced><mrow><munderover><mi>&#931;</mi><mrow><mtext>n</mtext><mo>=</mo><mn>1</mn></mrow><mrow><mn>2</mn><mn>3</mn></mrow></munderover><msup><mtext>cot</mtext><mrow><mo>-</mo><mn>1</mn></mrow></msup><mfenced><mrow><mn>1</mn><mo>+</mo><munderover><mi>&#931;</mi><mrow><mtext>k</mtext><mo>=</mo><mn>1</mn></mrow><mtext>n</mtext></munderover><mn>2</mn><mtext>k</mtext></mrow></mfenced></mrow></mfenced></math> &nbsp;is", "image": null}, "options": [{"id": "H1jdm", "text": "<math><mrow>  <mfrac>    <mrow>      <mn>2</mn>      <mn>3</mn>    </mrow>    <mrow>      <mn>2</mn>      <mn>5</mn>    </mrow>  </mfrac></mrow></math>", "isCorrect": false, "image": null}, {"id": "Zixyc", "text": "<math> <mrow> <mfrac> <mrow> <mn>2</mn> <mn>5</mn> </mrow> <mrow> <mn>2</mn> <mn>3</mn> </mrow> </mfrac> </mrow> </math>", "isCorrect": true, "image": null}, {"id": "G4egz", "text": "<math> <mrow> <mfrac> <mrow> <mn>2</mn> <mn>3</mn> </mrow> <mrow> <mn>2</mn> <mn>4</mn> </mrow> </mfrac> </mrow> </m 7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf82d", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2018-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2018 (Paper 2)", "title": "JEE Advanced 2018 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
