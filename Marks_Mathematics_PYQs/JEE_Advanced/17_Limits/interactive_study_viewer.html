"evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "64b16adff23ac7d519f9b8f8", "title": "Algebraic and Rational Limits", "totalQuestions": 12, "questions": [{"_id": "685102c16bba689a3eb09c9f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "684c67d769037fad219cb0c2", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 2)", "title": "JEE Advanced 2025 (Paper 2)"}], "question": {"text": "Let $x_0$ be the real number such that $e^{x_0}+x_0=0$. For a given real number $\\alpha$, define $g(x)=\\frac{3 x e^x+3 x-\\alpha e^x-\\alpha x}{3\\left(e^x+1\\right)}$\nfor all real numbers $x$.\nThen which one of the following statements is TRUE?", "image": null}, "options": [{"id": "JPmI3", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/h7sx77AU_0lY5AHjMVOUbifoU5blYfN0Um3hH05Ev7I.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "ZOoY7", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/DzcoIwGcoAKpHi3sMNOwWg0iPXfWO1N-ovzgdXGphMA.original.fullsize.png\"><br>", "image": null, "isCorrect": false}, {"id": "1CdZH", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/qustdTazrmDDA5bVY1CYmelD3VlbdJJJqPIWlmM8-u4.original.fullsize.png\"><br>", "image": null, "isCorrect": true}, {"id": "tGWcx", "text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/Voccczcm9oFiCjg8PrDyRN3keema4wpNfd6SQguCxX4.original.fullsize.png\"><br>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & e^{x_0}+x_0=0 \\\\ & g(x)=\\frac{3 x e^x+3 x-\\alpha e^x-\\alpha x}{3\\left(e^x+1\\right)} \\\\ & g(x)=x-\\frac{\\alpha\\left(e^x+x\\right)}{3\\left(e^x+1\\right)}, g(x)+e^{x_0}=x+e^{x_0}-\\frac{\\alpha}{3}\\left(\\frac{e^x+x}{e^x+1}\\right) \\\\ & g(x)+e^{x_0}=\\left(x-x_0\\right)-\\frac{\\alpha}{3}\\left(\\frac{e^x+x}{e^x+1}\\right) \\\\ & \\Rightarrow \\text { As very clear } g\\left(x_0\\right)+x_0 \\Rightarrow 0\\end{aligned}$\n$\\begin{aligned} & \\lim _{x \\rightarrow x_0}\\left|\\frac{g(x)+e^{x_0}}{x-x_0}\\right| \\frac{0 \\uparrow}{0 \\uparrow}=\\lim _{x \\rightarrow x_0}\\left|\\frac{g^{\\prime}(x)}{1}\\right|=\\left|g^{\\prime}\\left(x_0\\right)\\right| \\\\ & g^{\\prime}(x)=1-\\frac{\\alpha}{3}\\left(\\frac{\\left(e^x+1\\right)\\left(e^x+1\\right)-\\left(e^x+x\\right) e^x}{\\left(e^x+1\\right)^2}\\right) \\\\ & g^{\\prime}\\left(x_0\\right)=1-\\frac{\\alpha}{3}\\left(\\frac{\\left(e^{x_0}+1\\right)^2}{\\left(e^{x_0}+1\\right)^2}\\right)=1-\\frac{\\alpha}{3} \\\\ & \\Rightarrow \\lim _{x \\rightarrow x_0}\\left|\\frac{g(x)+e^{x_0}}{x-x_0}\\right|=\\left|g^{\\prime}\\left(x_0\\right)\\right|=\\left|1-\\frac{\\alpha}{3}\\right|\\end{aligned}$", "image": null}, "videoSolution": {"videoId": "eb8d10e819a049a6b8c38d93957386f9", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Y3Al1Jkto4XxU.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Y3Al1Jkto4XxU.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "684c67d769037fad219cb0c2", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 2)", "title": "JEE Advanced 2025 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "685102bd6bba689a3eb09c79", "type": "numerical", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "684c67d769037fad219cb0c1", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 1)", "title": "JEE Advanced 2025 (Paper 1)"}], "question": {"text": "Let $\\alpha$ and $\\beta$ be the real numbers such that $\\lim _{x \\rightarrow 0} \\frac{1}{x^3}\\left(\\frac{\\alpha}{2} \\int_0^x \\frac{1}{1-t^2} d t+\\beta x \\cos x\\right)=2$. Then the value of $\\alpha+\\beta$ is _______", "image": null}, "options": [], "correctValue": "2.4", "solution": {"text": "$\\lim _{x \\rightarrow 0} \\frac{\\frac{\\alpha}{2} \\int_0^x \\frac{1}{1-t^2} d t+\\beta x \\cos x}{x^3}$\n$\\begin{aligned} & =\\lim _{x \\rightarrow 0} \\frac{\\frac{\\alpha}{2}\\left(\\frac{1}{1-x^2}\\right)+\\beta \\cos x-\\beta x \\sin x}{3 x^2} \\\\ & =\\frac{\\frac{\\alpha}{2}\\left(1-x^2\\right)^{-1}+\\beta\\left(1-\\frac{x^2}{2!}+\\frac{x^4}{4!} \\ldots\\right)-\\beta x\\left(x-\\frac{x^3}{3!}+\\frac{x^5}{5!} \\ldots\\right)}{3 x^2} \\\\ & =\\frac{\\frac{\\alpha}{2}\\left(1+x^2+x^4 \\ldots\\right)+\\beta\\left(1-\\frac{x^2}{2!}+\\frac{x^4}{4!} \\ldots\\right)-\\beta\\left(x^2-\\frac{x^4}{3!} \\ldots\\right)}{3 x^2}\\end{aligned}$\n$\\begin{aligned} & =\\frac{\\left(\\frac{\\alpha}{2}+\\beta\\right)+\\mathrm{x}^2\\left(\\frac{\\alpha}{2}-\\frac{\\beta}{2}-\\beta\\right)+\\mathrm{x}^4() \\ldots}{3 \\mathrm{x}^2}=2(\\text { Given }) \\\\ & \\therefore \\frac{\\alpha}{2}+\\beta=0 \\text { and } \\frac{\\alpha-3 \\beta}{6}=2 \\\\ & \\Rightarrow \\alpha=-2 \\beta \\text { and } \\alpha=12+3 \\beta \\\\ & \\Rightarrow \\beta=-\\frac{12}{5} \\text { and } \\alpha=\\frac{24}{5}\\end{aligned}$\n$\\therefore \\alpha+\\beta=\\frac{12}{5}=2.40$", "image": null}, "videoSolution": {"videoId": "35e910deddea4482b3e49639e9a60f93", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/6i3g4bf87b39D.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/6i3g4bf87b39D.480.jpeg", "premiumModules": [{"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}, {"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "684c67d769037fad219cb0c1", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2025-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2025 (Paper 1)", "title": "JEE Advanced 2025 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66965df0d603121f43a46526", "type": "numerical", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}], "question": {"text": "Let the function $f:[1, \\infty) \\rightarrow \\mathbb{R}$ be defined by\n$f(t)=\\left\\{\\begin{array}{cc}(-1)^{n+1} 2, & \\text { if } t=2 n-1, n \\in \\mathbb{N}, \\\\ \\frac{(2 n+1-t)}{2} f(2 n-1)+\\frac{(t-(2 n-1))}{2} f(2 n+1), & \\text { if } 2 n-1 < t < 2 n+1, n \\in \\mathbb{N} .\\end{array}\\right.$\nDefine $g(x)=\\int_1^x f(t) d t, x \\in(1, \\infty)$. Let $\\alpha$ denote the number of solutions of the equation $g(x)=0$ in the interval $(1,8]$ and $\\beta=\\lim _{x \\rightarrow 1^+} \\frac{g(x)}{x-1}$. Then the value of $\\alpha+\\beta$ is equal to ________.", "image": null}, "options": [], "correctValue": 5, "solution": {"text": "$\\mathrm{f}(\\mathrm{t})=\\left\\{\\begin{array}{ccc}2 & ; & \\mathrm{t}=1 \\\\ 4-2 \\mathrm{t} & ; & 1 < \\mathrm{t} < 3 \\\\ -2 & ; & \\mathrm{t}=3 \\\\ -8-2 \\mathrm{t} & ; & 3 < \\mathrm{t} < 5 \\\\ 2 & ; & \\mathrm{t}=5 \\\\ 12-2 \\mathrm{t} & ; & 5 < \\mathrm{t} < 7 \\\\ -2 & ; & \\mathrm{t}=7 \\\\ -16+2 \\mathrm{t} & ; & 7 < \\mathrm{t} < 9\\end{array}\\right.$\n$g(x)=\\int_1^x f(t) d t \\Rightarrow g^{\\prime}(x)=f(x)$\nfor $x \\in(1,8]$\n$g(x)=0 \\Rightarrow x=3,5,7 \\therefore \\alpha=3$\n$\\beta=\\lim _{x \\rightarrow 1^{+}} \\frac{g(x)}{x-1}$\nApply L'Hospital's\n$\\begin{aligned} & =\\frac{g^{\\prime}\\left(1^{+}\\right)}{1}=f\\left(1^{+}\\right) \\\\ & \\beta=2 \\\\ & \\therefore \\alpha+\\beta=5\\end{aligned}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/I0sWyNMHg9B3JNA01Y5dAGJ51buGeJ1hbCxfMeea924.original.fullsize.png\"><br>", "image": null}, "videoSolution": {"videoId": "8c4816480d6b4f468486284a66a88993", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/UvvnKInSHjUqF.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/UvvnKInSHjUqF.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66965dc8d603121f43a3d2f6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "66965789b31faf98fda8fef9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 1)", "title": "JEE Advanced 2024 (Paper 1)"}], "question": {"text": "Let $f(x)$ be a continuously differentiable function on the interval $(0, \\infty)$ such that $f(1)=2$ and $\\underset{t \\rightarrow x}{\\lim} \\frac{t^{10} f(x)-x^{10} f(t)}{t^9-x^9}=1$ for each $x>0$. Then, for all $x>0, f(x)$ is equal to", "image": null}, "options": [{"id": "fYbtK", "text": "$\\frac{31}{11 x}-\\frac{9}{11} x^{10}$", "image": null, "isCorrect": false}, {"id": "02JZk", "text": "$\\frac{9}{11 x}+\\frac{13}{11} x^{10}$", "image": null, "isCorrect": true}, {"id": "NG7ME", "text": "$\\frac{-9}{11 x}+\\frac{31}{11} x^{10}$", "image": null, "isCorrect": false}, {"id": "SsbmD", "text": "$\\frac{13}{11 x}+\\frac{9}{11} x^{10}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{t \\rightarrow x} \\frac{t^{10} f(x)-x^{10} f(t)}{t^9-x^9}=1 \\\\ & \\Rightarrow \\lim _{t \\rightarrow x} \\frac{10 t^9 f(x)-x^{10} f^{\\prime}(t)}{9 t^8}=1\\end{aligned}$\n$\\begin{aligned} & \\Rightarrow 10 x f(x)-x^2 f^{\\prime}(x)=9 \\\\ & \\Rightarrow x^2 f^{\\prime}(x)=10 x f(x)-9 \\\\ & \\Rightarrow f^{\\prime}(x)=\\frac{10 f(x)}{x}-\\frac{9}{x^2} \\\\ & \\Rightarrow \\frac{d y}{d x}-\\frac{10}{x} y=-\\frac{9}{x^2} \\\\ & \\Rightarrow y \\cdot \\frac{1}{x^{10}}=\\int-\\frac{9}{x^2} \\cdot \\frac{1}{x^{10}} d x \\\\ & \\Rightarrow \\frac{y}{x^{10}}=\\frac{9}{11 x^{11}}+c...(1)\\end{aligned}$\n$\\begin{aligned} & \\because \\mathrm{f}(1)=2 \\Rightarrow \\frac{2}{1}=\\frac{9}{11}+\\mathrm{c} \\Rightarrow \\mathrm{c}=\\frac{13}{11} \\\\ & \\therefore \\mathrm{f}(\\mathrm{x})=\\frac{9}{11 \\mathrm{x}}+\\frac{13}{11} \\mathrm{x}^{10}\\end{aligned}$\n$\\Rightarrow$ Option (2) is correct.", "image": null}, "videoSolution": {"videoId": "86d6a627b1a2411b92f03aead4335fec", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/qnY0Z61l4mw45.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/qnY0Z61l4mw45.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "66965789b31faf98fda8fef9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 1)", "title": "JEE Advanced 2024 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16aa4f23ac7d519f9b645", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}], "question": {"text": "Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>:</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>&#8594;</mo><mi mathvariant=\"normal\">&#8477;</mi></math> be the function defined as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><msqrt><mi>n</mi></msqrt></math> if <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#8712;</mo><mo>[</mo><mfrac><mn>1</mn><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><mo>)</mo></math> where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>&#8712;</mo><mi mathvariant=\"normal\">&#8469;</mi></math>. Let <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>:</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>&#8594;</mo><mi mathvariant=\"normal\">&#8477;</mi></math> be a function such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mo>&#8747;</mo><msup><mi>x</mi><mn>2</mn></msup><mi>x</mi></msubsup><msqrt><mfrac><mrow><mn>1</mn><mo>-</mo><mi>t</mi></mrow><mi>t</mi></mfrac></msqrt><mi>d</mi><mi>t</mi><mo>&#60;</mo><mi>g</mi><mfenced><mi>x</mi></mfenced><mo>&#60;</mo><mn>2</mn><msqrt><mi>x</mi></msqrt></math> for all <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#8712;</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced></math>. Then <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><mn>0</mn></mrow></munder><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>&#160;</mo><mi>g</mi><mfenced><mi>x</mi></mfenced></math>", "image": null}, "options": [{"id": "zS8Ew", "text": "Does NOT exist", "image": null, "isCorrect": false}, {"id": "HAx6c", "text": "is equal to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math>", "image": null, "isCorrect": false}, {"id": "AtEf4", "text": "is equal to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>", "image": null, "isCorrect": true}, {"id": "LlPnI", "text": "is equal to&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>3</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<blockquote><p>Given,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mo>:</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>&#8594;</mo><mi mathvariant=\"normal\">&#8477;</mi></math> be the function defined as <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><msqrt><mi>n</mi></msqrt></math> if <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#8712;</mo><mo>[</mo><mfrac><mn>1</mn><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></mfrac><mo>,</mo><mo>&#160;</mo><mfrac><mn>1</mn><mi>n</mi></mfrac><mo>)</mo></math> where <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>n</mi><mo>&#8712;</mo><mi mathvariant=\"normal\">&#8469;</mi></math></p><p>And&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>g</mi><mo>:</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced><mo>&#8594;</mo><mi mathvariant=\"normal\">&#8477;</mi></math> be a function such that <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mo>&#8747;</mo><msup><mi>x</mi><mn>2</mn></msup><mi>x</mi></msubsup><msqrt><mfrac><mrow><mn>1</mn><mo>-</mo><mi>t</mi></mrow><mi>t</mi></mfrac></msqrt><mi>d</mi><mi>t</mi><mo>&#60;</mo><mi>g</mi><mfenced><mi>x</mi></mfenced><mo>&#60;</mo><mn>2</mn><msqrt><mi>x</mi></msqrt></math> for all <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>x</mi><mo>&#8712;</mo><mfenced><mrow><mn>0</mn><mo>,</mo><mo>&#160;</mo><mn>1</mn></mrow></mfenced></math>.&nbsp;</p><p>Now we need to solve <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1</mn></math> sided limit here to get some answer, as&nbsp;&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><msup><mn>0</mn><mo>-</mo></msup></mrow></munder></math>&nbsp;doesn&rsquo;t exist here (not in domain)</p><p>As&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></mfrac><mo>&#8804;</mo><mi>x</mi><mo>&#60;</mo><mo>&#160;</mo><mfrac><mn>1</mn><mi>n</mi></mfrac></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>n</mi><mo>+</mo><mn>1</mn><mo>&#8805;</mo><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>&#62;</mo><mo>&#160;</mo><mi>n</mi></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mi>n</mi><mo>&#8805;</mo><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>-</mo><mn>1</mn><mo>&#8658;</mo><msqrt><mi>n</mi></msqrt><mo>&#8805;</mo><msqrt><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>-</mo><mn>1</mn></msqrt></math></p><p>So, let&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>=</mo><msqrt><mfenced><mfrac><mn>1</mn><mi>x</mi></mfrac></mfenced><mo>-</mo><mn>1</mn></msqrt></math>&nbsp;where&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mo>&#183;</mo></mfenced><mo>=</mo></math>&nbsp;least integer function</p><p>Now multiplying&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>f</mi><mfenced><mi>x</mi></mfenced></math>&nbsp;in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msubsup><mo>&#8747;</mo><msup><mi>x</mi><mn>2</mn></msup><mi>x</mi></msubsup><msqrt><mfrac><mrow><mn>1</mn><mo>-</mo><mi>t</mi></mrow><mi>t</mi></mfrac></msqrt><mi>d</mi><mi>t</mi><mo>&#60;</mo><mi>g</mi><mfenced><mi>x</mi></mfenced><mo>&#60;</mo><mn>2</mn><msqrt><mi>x</mi></msqrt></math>&nbsp;and taking limit we get,</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><msup><mn>0</mn><mo>+</mo></msup></mrow></munder><msubsup><mo>&#8747;</mo><msup><mi>x</mi><mn>2</mn></msup><mi>x</mi></msubsup><msqrt><mfrac><mrow><mn>1</mn><mo>-</mo><mi>t</mi></mrow><mi>t</mi></mfrac></msqrt><mi>d</mi><mi>t</mi><mo>&#183;</mo><msqrt><mfenced><mfrac><mn>1</mn><mi>x</mi></mfrac></mfenced><mo>-</mo><mn>1</mn></msqrt><mo>&#8804;</mo><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><msup><mn>0</mn><mo>+</mo></msup></mrow></munder><mi>f</mi><mfenced><mi>x</mi></mfenced><mo>&#183;</mo><mi>g</mi><mfenced><mi>x</mi></mfenced><mo>&#8804;</mo><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><msup><mn>0</mn><mo>+</mo></msup></mrow></munder><msqrt><mfenced><mfrac><mn>1</mn><mi>x</mi></mfrac></mfenced><mo>-</mo><mn>1</mn></msqrt><mo>&#215;</mo><mn>2</mn><msqrt><mi>x</mi></msqrt></math></p><p>Now&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><msup><mn>0</mn><mo>+</mo></msup></mrow></munder><msqrt><mfenced><mfrac><mn>1</mn><mi>x</mi></mfrac></mfenced><mo>-</mo><mn>1</mn></msqrt><mo>&#215;</mo><mn>2</mn><msqrt><mi>x</mi></msqrt><mo>=</mo><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><msup><mn>0</mn><mo>+</mo></msup></mrow></munder><mn>2</mn><msqrt><mi>x</mi></msqrt><msqrt><mfenced close=\"]\" open=\"[\"><mfrac><mn>1</mn><mi>x</mi></mfrac></mfenced></msqrt><mo>&#160;&#160;</mo><mfenced><mrow><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>&#8713;</mo><mi>Z</mi></mrow></mfenced></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><msup><mn>0</mn><mo>+</mo></msup></mrow></munder><mn>2</mn><msqrt><mi>x</mi><mfenced><mrow><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>-</mo><mfenced close=\"}\" open=\"{\"><mfrac><mn>1</mn><mi>x</mi></mfrac></mfenced></mrow></mfenced></msqrt><mo>=</mo><mn>2</mn></math></p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><msup><mn>0</mn><mo>+</mo></msup></mrow></munder><mn>2</mn><msqrt><mn>1</mn><mo>-</mo><mi>x</mi><mfenced><mfrac><mn>1</mn><mi>x</mi></mfrac></mfenced></msqrt><mo>=</mo><mn>2</mn><mo>;</mo><mo>&#160;</mo><mfenced><mrow><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>&#8713;</mo><mi>Z</mi></mrow></mfenced></math></p><p>So,&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><msup><mn>0</mn><mo>+</mo></msup></mrow></munder><msubsup><mo>&#8747;</mo><msup><mi>x</mi><mn>2</mn></msup><mi>x</mi></msubsup><msqrt><mfrac><mrow><mn>1</mn><mo>-</mo><mi>t</mi></mrow><mi>t</mi></mfrac></msqrt><mi>d</mi><mi>t</mi><mo>&#183;</mo><msqrt><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>-</mo><mfenced close=\"}\" open=\"{\"><mfrac><mn>1</mn><mi>x</mi></mfrac></mfenced></msqrt><mo>=</mo><mfrac><mrow><msubsup><mo>&#8747;</mo><msup><mi>x</mi><mn>2</mn></msup><mi>x</mi></msubsup><msqrt><mfrac><mrow><mn>1</mn><mo>-</mo><mi>t</mi></mrow><mi>t</mi></mfrac></msqrt><mi>d</mi><mi>t</mi><mo>&#183;</mo><msqrt><mn>1</mn><mo>-</mo><mi>x</mi><mfenced close=\"}\" open=\"{\"><mfrac><mn>1</mn><mi>x</mi></mfrac></mfenced></msqrt></mrow><msqrt><mi>x</mi></msqrt></mfrac></math></p><p>And&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><msup><mn>0</mn><mo>+</mo></msup></mrow></munder><mfrac><mrow><msubsup><mo>&#8747;</mo><msup><mi>x</mi><mn>2</mn></msup><mi>x</mi></msubsup><msqrt><mfrac><mrow><mn>1</mn><mo>-</mo><mi>t</mi></mrow><mi>t</mi></mfrac></msqrt><mi>d</mi><mi>t</mi></mrow><msqrt><mi>x</mi></msqrt></mfrac><mo>=</mo><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><msup><mn>0</mn><mo>+</mo></msup></mrow></munder><mfrac><mrow><msqrt><mfrac><mrow><mn>1</mn><mo>-</mo><mi>x</mi></mrow><mi>x</mi></mfrac></msqrt><mo>-</mo><mn>2</mn><mi>x</mi><msqrt><mfrac><mrow><mn>1</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></mrow><msup><mi>x</mi><mn>2</mn></msup></mfrac></msqrt></mrow><mfrac><mn>1</mn><mrow><mn>2</mn><msqrt><mi>x</mi></msqrt></mrow></mfrac></mfrac></math></p><p>{Using L-hospital rule}</p><p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><munder><mi>lim</mi><mrow><mi>x</mi><mo>&#8594;</mo><msup><mn>0</mn><mo>+</mo></msup></mrow></munder><mn>2</mn><msqrt><mn>1</mn><mo>-</mo><mi>x</mi></msqrt><mo>-</mo><mn>4</mn><msqrt><mi>x</mi></msqrt><mo>&#183;</mo><msqrt><mn>1</mn><mo>-</mo><msup><mi>x</mi><mn>2</mn></msup></msqrt><mo>=</mo><mn>2</mn></math></p><p>Similarly for&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mi>x</mi></mfrac><mo>&#8712;</mo><mi>Z</mi></math>&nbsp;is equal to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn></math>.</p></blockquote>", "image": null}, "videoSolution": {"videoId": "445dfffebd394015b303a9dd09f2ffa7", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/qiCazoRNbFgBv.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/qiCazoRNbFgBv.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "64b1672d25f94b8a85b91cd9", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2023-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2023 (Paper 1)", "title": "JEE Advanced 2023 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, sup><mo>-</mo><mi>e</mi></mrow><mrow><msup><mrow><mi>α</mi></mrow><mrow><mi>m</mi></mrow></msup></mrow></mfrac><mo>=</mo><mi> </mi><mo>-</mo><mfrac><mrow><mi>e</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mrow></math> <br > <math><mo>⇒</mo><mi> </mi><mi> </mi></math>  Using L'Hospital's Rule<br ><br > <math><mrow><mrow><munder><mrow><mi mathvariant=\"normal\">lim</mi></mrow><mrow><mi>α</mi><mo>→</mo><mn>0</mn></mrow></munder></mrow><mo>⁡</mo><mrow><mfrac><mrow><msup><mrow><mi>e</mi></mrow><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>α</mi></mrow><mrow><mi>n</mi></mrow></msup></mrow></mfenced></mrow></mrow></mrow></msup><mo>&sdot;</mo><mi> </mi><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mfenced separators=\"|\"><mrow><msup><mrow><mi>α</mi></mrow><mrow><mi>n</mi></mrow></msup></mrow></mfenced></mrow></mrow><mi> </mi><mo>&sdot;</mo><mi>n</mi><msup><mrow><mi>α</mi></mrow><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></msup></mrow><mrow><mi>m</mi><mi> </mi><mo>&sdot;</mo><msup><mrow><mi>α</mi></mrow><mrow><mi>m</mi><mo>-</mo><mn>1</mn></mrow></msup></mrow></mfrac></mrow></mrow><mo>=</mo><mi> </mi><mfrac><mrow><mo>-</mo><mi>e</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math> <br > <math><mo>⇒</mo><mi> </mi><mfrac><mrow><mi>m</mi></mrow><mrow><mi>n</mi></mrow></mfrac><mo>=</mo><mn>2</mn></math> .", "image": null}, "videoSolution": {"videoId": "ed4902fc79f94f2f8b001374ec2ca33c", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/p2EMVBAEyIsbA.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/p2EMVBAEyIsbA.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "615d92eede3d91842a5cf827", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2015-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2015 (Paper 2)", "title": "JEE Advanced 2015 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a23f23ac7d519f9b1af", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}], "type": "singleCorrect", "level": 2, "question": {"text": "Let $\\alpha(a)$ and $\\beta(a)$ be the roots of the equation $(\\sqrt[3]{1+a}-1) x^{2}+(\\sqrt{1+a}-1) x+(\\sqrt[6]{1+a}-1)=0$ where $a$ $>-1$. Then $\\lim _{a \\rightarrow 0^{+}} \\alpha(a)$ and $\\lim _{x \\rightarrow 0^{+}} \\beta(a)$ are", "image": null}, "options": [{"id": "LBBhm", "text": "$-\\frac{5}{2}$ and 1", "isCorrect": false, "image": null}, {"id": "RFzHP", "text": "$-\\frac{1}{2}$ and $-1$", "isCorrect": true, "image": null}, {"id": "mdest", "text": "$-\\frac{7}{2}$ and 2", "isCorrect": false, "image": null}, {"id": "MIlwS", "text": "$-\\frac{9}{2}$ and 3", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$(\\sqrt[3]{1+a}-1) x^{2}+(\\sqrt{1+a}-1) x+(\\sqrt[6]{1+a}-1)=0$\r\n\r\nLet $a+1=y$, then equation reduces to $\\left(y^{1 / 3}-1\\right) x^{2}+\\left(y^{1 / 2}-1\\right) x+\\left(y^{1 / 6}-1\\right)=0$\r\n\r\nOn dividing both sides by $y-1$, we get $\\left(\\frac{y^{1 / 3}-1}{y-1}\\right) x^{2}+\\left(\\frac{y^{1 / 2}-1}{y-1}\\right) x+\\left(\\frac{y^{1 / 6}-1}{y-1}\\right)=0$\r\n\r\nOn taking limit as $y \\rightarrow 1$ i.e. $a \\rightarrow 0$ on both sides, we get $\\frac{1}{3} x^{2}+\\frac{1}{2} x+\\frac{1}{6}=0 \\Rightarrow 2 x^{2}+3 x+1=0$\r\n\r\n$\\Rightarrow x=-1,-\\frac{1}{2}$ (roots of the equation)\r\n\r\n$\\therefore \\quad \\lim _{a \\rightarrow 0^{+}} \\alpha(a)=-1, \\lim _{a \\rightarrow 0^{+}} \\beta(a)=-\\frac{1}{2}$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c4b", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 2)", "title": "JEE Advanced 2012 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b16a1cf23ac7d519f9b16e", "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c4a", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012 (Paper 1)", "title": "JEE Advanced 2012 (Paper 1)"}], "type": "singleCorrect", "level": 3, "question": {"text": "If $\\lim _{x \\rightarrow \\infty}\\left(\\frac{x^{2}+x+1}{x+1}-a x-b\\right)=4$, then", "image": null}, "options": [{"id": "RehYG", "text": "$a=1, b=4$", "isCorrect": false, "image": null}, {"id": "SDNx2", "text": "$a=1, b=-4$", "isCorrect": true, "image": null}, {"id": "8qll6", "text": "$a=2, b=-3$", "isCorrect": false, "image": null}, {"id": "8BRea", "text": "$a=2, b=3$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given: $\\lim _{x \\rightarrow \\infty}\\left(\\frac{x^{2}+x+1}{x+1}-a x-b\\right)=4$\r\n\r\n$\\begin{array}{l}\r\n\r\n\\Rightarrow \\lim _{x \\rightarrow \\infty} \\frac{x^{2}+x+1-a x^{2}-a x-b x-b}{x+1}=4 \\\\\r\n\r\n\\Rightarrow \\lim _{x \\rightarrow \\infty} \\frac{(1-a) x^{2}+(1-a-b) x+(1-b)}{x+1}=4\r\n\r\n\\end{array}$\r\n\r\nFor this limit to be finite $1-a=0 \\Rightarrow a=1$ then given limit reduces to\r\n\r\n$\\lim _{x \\rightarrow \\infty} \\frac{-b x+(1-b)}{x+1}=4 \\Rightarrow \\lim _{x \\rightarrow \\infty} \\frac{-b+\\frac{(1-b)}{x}}{1+\\frac{1}{x}}=4$\r\n\r\n$\\Rightarrow-b=4$ or $b=-4, \\therefore a=1, b=-4$", "image": null}, "videoSolution": null, "questionLabels": [], "syllabusCategory": "noChange", "ques 9f9af6e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1f77301f65c2f92c42", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 1)", "title": "JEE Advanced 2008 (Paper 1)"}], "question": {"text": "Let $g(x)=\\frac{(x-1)^n}{\\log \\cos ^m(x-1)} ; 0 < x < 2, m$ and $n$ are integers, $m \\neq 0, n>0$ and let $p$ be the left hand derivative of $|x-1|$ at $x=1$. If $\\lim _{x \\rightarrow 1^{+}} g(x)=p$, then", "image": null}, "options": [{"id": "9XcKN", "text": "\n$n=1, m=1$\n", "image": null, "isCorrect": false}, {"id": "XumZb", "text": "\n$n=1, m=-1$\n", "image": null, "isCorrect": false}, {"id": "ZrhMo", "text": "\n$n=2, m=2$\n", "image": null, "isCorrect": true}, {"id": "ERJt1", "text": "\n$n>2, m=n$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $g(x)=\\frac{(x-1)^n}{\\log \\cos ^m(x-1)} ; 0 < x < 2, m \\neq 0, n$ are integers and $|x-1|=\\left\\{\\begin{array}{l}x-1 ; x \\geq 1 \\\\ 1-x ; x < 1\\end{array}\\right.$\nThe left hand derivative of $|x-1|$ at $x=1$ is $p=-1$.\nAlso,\n$$\n\\begin{aligned}\n& \\Rightarrow \\quad \\lim _{h \\rightarrow 0} \\frac{(1+h-1)^n}{\\log \\cos ^m(1+h-1)}=-1 \\Rightarrow \\lim _{h \\rightarrow 0} \\frac{h^n}{\\log \\cos ^m h}=-1 \\\\\n& \\Rightarrow \\quad \\lim _{h \\rightarrow 0} \\frac{h^n}{m \\log \\cos h}=-1\n\\end{aligned}\n$$\n[Using L' Hospital rule]\n$$\n\\begin{array}{ll}\n\\Rightarrow & \\quad \\lim _{h \\rightarrow 0} \\frac{n \\cdot h^{n-1}}{m \\frac{1}{\\cos h}(-\\sin h)}=-1 \\\\\n\\Rightarrow \\quad & \\quad \\lim _{h \\rightarrow 0}\\left(-\\frac{n}{m}\\right) \\cdot \\frac{h^{n-2}}{\\left(\\frac{\\tan h}{h}\\right)}=-1 \\\\\n\\Rightarrow \\quad & \\quad\\left(\\frac{n}{m}\\right) \\lim _{h \\rightarrow 0} \\frac{h^{n-2}}{\\left(\\frac{\\tan h}{h}\\right)}=1 \\\\\n\\Rightarrow & n=2 \\text { and } \\frac{n}{m}=1 \\\\\n\\therefore & \\quad m=n=2\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c42", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008 (Paper 1)", "title": "JEE Advanced 2008 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169d6f23ac7d519f9aeec", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}], "question": {"text": "$\\lim _{x \\rightarrow \\frac{\\pi}{4}} \\frac{\\int_2^{\\sec ^2 x} f(t) d t}{x^2-\\frac{\\pi^2}{16}}$ equals", "image": null}, "options": [{"id": "qc4Mb", "text": "\n$\\frac{8}{\\pi} f(2)$\n", "image": null, "isCorrect": true}, {"id": "jYZqu", "text": "\n$\\frac{2}{\\pi} f(2)$\n", "image": null, "isCorrect": false}, {"id": "gAXjq", "text": "\n$\\frac{2}{\\pi} f\\left(\\frac{1}{2}\\right)$\n", "image": null, "isCorrect": false}, {"id": "2luw5", "text": "\n$4 f(2)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\lim _{x \\rightarrow \\frac{x}{4}} \\frac{\\int_2^{\\sec ^2 x} f(t) d t}{x^2-\\frac{\\pi^2}{16}}$ $\\left[\\therefore \\frac{0}{0}\\right.$ form $]$\nLet\n$$\n\\begin{array}{ll}\n\\text { Let } & L=\\lim _{x \\rightarrow \\frac{x}{4}} \\frac{f\\left(\\sec ^2 x\\right) 2 \\sec x \\sec x \\tan x}{2 x} \\\\\n\\therefore & L=\\frac{2 f(2)}{\\pi / 4}=\\frac{8 f(2)}{\\pi}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "64b16adff23ac7d519f9b8fa", "title": "Trigonometric and Inverse Trigonometric limits", "totalQuestions": 4, "questions": [{"_id": "66965debd603121f43a45272", "type": "multipleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}], "question": {"text": "Let $S$ be the set of all $(\\alpha, \\beta) \\in \\mathbb{R} \\times \\mathbb{R}$ such that\n$\\lim _{x \\rightarrow \\infty} \\frac{\\sin \\left(x^2\\right)\\left(\\log _e x\\right)^\\alpha \\sin \\left(\\frac{1}{x^2}\\right)}{x^{\\alpha \\beta}\\left(\\log _e(1+x)\\right)^\\beta}=0$.\nThen which of the following is (are) correct?", "image": null}, "options": [{"id": "GMXaq", "text": "$(-1,3) \\in S$", "image": null, "isCorrect": false}, {"id": "Q8ssI", "text": "$(-1,1) \\in S$", "image": null, "isCorrect": true}, {"id": "kLbfm", "text": "$(1,-1) \\in S$", "image": null, "isCorrect": true}, {"id": "PEcEN", "text": "$(1,-2) \\in S$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\lim _{x \\rightarrow \\infty} \\frac{\\sin x^2 \\cdot\\left(\\log _e x\\right)^\\alpha \\cdot \\sin \\frac{1}{x^2}}{x^{\\alpha \\beta} \\cdot\\left(\\log _e(1+x)\\right)^\\beta}=0 \\\\ & \\lim _{x \\rightarrow \\infty} \\frac{\\left(\\log _e x\\right)^\\alpha}{\\left(\\log _e(x+1)\\right)^\\beta \\cdot x^{\\alpha \\beta+2}}=0\\end{aligned}$\n$\\begin{aligned} & \\lim _{x \\rightarrow \\infty}\\left(\\frac{\\log _e x}{\\log _e(x+1)}\\right)^\\beta \\cdot \\frac{\\left(\\log _e x\\right)^{\\alpha-\\beta}}{x^{\\alpha \\beta+2}}=0 \\\\ & \\lim _{x \\rightarrow \\infty} \\frac{\\left(\\log _e x\\right)^{\\alpha-\\beta}}{x^{\\alpha \\beta+2}}=0 \\quad \\text { Put } \\log _e x=t \\\\ & \\lim _{t \\rightarrow \\infty} \\frac{t^{\\alpha-\\beta}}{\\left(e^t\\right)^{\\alpha \\beta+2}}=0\\end{aligned}$\nAs we know $\\lim _{x \\rightarrow \\infty} \\frac{x}{e^x}=0$\n$\\alpha \\beta+2>0 \\Rightarrow \\alpha \\beta>-2$", "image": null}, "videoSolution": {"videoId": "626ac100b21e4437be1ad9b5a1f75b2f", "provider": "vdocipher", "thumbnailLight": "https://d1z78r8i505acl.cloudfront.net/poster/Wd7wNPEHhvBLB.480.jpeg", "thumbnailDark": "https://d1z78r8i505acl.cloudfront.net/poster/Wd7wNPEHhvBLB.480.jpeg", "premiumModules": [{"premiumModuleId": "6628114842d540dfcb148ecb", "isFree": false}, {"premiumModuleId": "64c7e8e829737784b294e469", "isFree": false}, {"premiumModuleId": "6788cc0b2dbc1ecacabb7026", "isFree": false}], "description": "JEE Advanced (All PYQs from 2023 - 2013)"}, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "66965dead603121f43a44d27", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "66965789b31faf98fda8fefa", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2024-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2024 (Paper 2)", "title": "JEE Advanced 2024 (Paper 2)"}], "question": {"text": "Let $k \\in \\mathbb{R}$. If $\\lim _{x \\rightarrow 0^+}(\\sin (\\sin k x)+\\cos x+x)^{\\frac{2}{x}}=e^6$, then the value of $k$ is", "image": null}, "options": [{"id": "TsKFw", "text": "$1$", "image": null, "isCorrect": false}, {"id": "hQwVm", "text": "$2$", "image": null, "isCorrect": true}, {"id": "dlpVD", "text": "$3$", "image": null, "isCorrect": false}, {"id": "LWcpv", "text": "$4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "\\(\\begin{aligned} & l=\\lim _{x \\rightarrow 0^{+}}(\\sin (\\s ": [{"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}], "question": {"text": "Let $L=\\lim _{x \\rightarrow 0} \\frac{a-\\sqrt{a^2-x^2}-\\frac{x^2}{4}}{x^4}$, $a>0$. If $L$ is finite, then", "image": null}, "options": [{"id": "PIlYX", "text": "\n$a=2$\n", "image": null, "isCorrect": true}, {"id": "yN4IG", "text": "\n$a=1$\n", "image": null, "isCorrect": false}, {"id": "bHN1M", "text": "\n$L=\\frac{1}{64}$\n", "image": null, "isCorrect": true}, {"id": "NbcyC", "text": "\n$L=\\frac{1}{32}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/jee_advanced/OppXIo5ahAMcXNcH9uV52GAIpIQkQcAKb8c0qNyv8nQ.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1f77301f65c2f92c44", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009 (Paper 1)", "title": "JEE Advanced 2009 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169d5f23ac7d519f9aee7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}], "question": {"text": "Let $f(x)$ be differentiable on the interval $(0, \\infty)$ such that $f(1)=1$, and $\\lim _{t \\rightarrow x} \\frac{t^2 f(x)-x^2 f(t)}{t-x}=1$ for each $x>0$. Then, $f(x)$ is", "image": null}, "options": [{"id": "VgP3O", "text": "\n$\\frac{1}{3 x}+\\frac{2 x^2}{3}$\n", "image": null, "isCorrect": true}, {"id": "YpCrU", "text": "\n$-\\frac{1}{3 x}+\\frac{4 x^2}{3}$\n", "image": null, "isCorrect": false}, {"id": "8bYMf", "text": "\n$-\\frac{1}{x}+\\frac{2}{x^2}$\n", "image": null, "isCorrect": false}, {"id": "RaNOj", "text": "\n$\\frac{1}{x}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\text { } \\lim _{t \\rightarrow x} \\frac{t^2 f(x)-x^2 f(t)}{t-x}=1\n$$\n\n$$\n\\begin{aligned}\n& \\Rightarrow & x^2 f^{\\prime}(x)-2 x f(x)+1 & =0 \\\\\n& \\Rightarrow & \\frac{x^2 f^{\\prime}(x)-2 x f(x)}{\\left(x^2\\right)^2}+\\frac{1}{x^4} & =0 \\\\\n& \\Rightarrow & \\frac{d}{d x}\\left(\\frac{f(x)}{x^2}\\right) & =-\\frac{1}{x^4} \\\\\n\\Rightarrow & & f(x) & =c x^2+\\frac{1}{3 x} \\text { also } f(1)=1 \\Rightarrow c=\\frac{2}{3} . \\\\\n& \\text { Hence, } & f(x) & =\\frac{2}{3} x^2+\\frac{1}{3 x}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c40", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007 (Paper 1)", "title": "JEE Advanced 2007 (Paper 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "64b169cff23ac7d519f9aea9", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}], "question": {"text": "<strong>Paragraph:</strong>\nRead the following passage and answer the questions.\nFor every function $f(x)$ which is twice differentiable, these will be good approximation of $\\int_a^b f(x) d x \\cong\\left(\\frac{b-a}{2}\\right)\\{f(a)+f(b)\\}$. Now, if we take $c=\\frac{a+b}{2}$, then using above again, we get $\\int_a^b f(x) d x=\\int_a^c f(x) d x+\\int_c^b f(x) d x \\cong \\frac{b-a}{4}\\{f(a)+f(b)+2 f(c)\\}$ and so on.\nWe get approximation for value of $\\int_a^b f(x) d x$.<strong>Question:</strong>\nIf $\\lim _{t \\rightarrow a} \\frac{\\int_a^t f(x) d x-\\frac{(t-a)}{2}\\{f(t)+f(a)\\}}{(t-a)^3}=0$, then degree of polynomial function $f(x)$ at most is", "image": null}, "options": [{"id": "Ydvs5", "text": "\n0\n", "image": null, "isCorrect": false}, {"id": "XwsdD", "text": "\n1\n", "image": null, "isCorrect": true}, {"id": "q6kdW", "text": "\n3\n", "image": null, "isCorrect": false}, {"id": "Rf5Ul", "text": "\n2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n\\lim _{t \\rightarrow a} \\frac{\\int_a^t f(t) d t-\\frac{(t-a)}{2}(f(t)+f(a))}{(t-a)^3} & =0 \\\\\n\\Rightarrow \\quad \\lim _{h \\rightarrow 0} \\frac{\\int_a^{a+h} f(t) d t-\\frac{h}{2}(f(a+h)+f(a))}{h^3} & =0 \\\\\n\\Rightarrow \\quad \\lim _{h \\rightarrow 0} \\frac{f(a+h)-\\frac{1}{2}(f(a+h)+f(a))-\\frac{h}{2}\\left(f^{\\prime}(a+h)\\right)}{3 h^2} & =0\n\\end{aligned}\n$$\n$f^{\\prime}(a+h)-\\frac{1}{2} f^{\\prime}(a+h)$\n$\\Rightarrow \\quad \\lim _{h \\rightarrow 0} \\frac{-\\frac{1}{2} f^{\\prime}(a+h)-\\frac{h}{2} f^{\\prime \\prime}(a+h)}{6 h}=0$\n$\\Rightarrow \\quad \\lim _{h \\rightarrow 0} \\frac{-\\frac{h}{2} f^{\\prime}(a+h)}{6 h}=0$\n$\\Rightarrow \\quad f^{\\prime \\prime}(a)=0, \\forall a \\in R$\n$\\Rightarrow(x)$ must have maximum degree 1.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "620a8a1e77301f65c2f92c3f", "examId": "615d76cfc52ffa3c944600e0", "heldOn": "2006-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2006", "title": "JEE Advanced 2006"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'JEE Advanced';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
