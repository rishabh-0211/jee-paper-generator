  <script>
    const data = {"index": 16, "chapterId": "61c089903330b6cd51234ba0", "chapter": "Parabola", "exam": "MHT CET", "subject": "Mathematics", "totalTopics": 7, "totalQuestions": 39, "downloadTime": "2026-10-08 20:43:01", "topics": [{"index": 1, "topicId": "65a2633a0279619d9d8a3d39", "title": "standard equation of parabola", "totalQuestions": 20, "questions": [{"_id": "6abb884615a9fc0fc8c14226", "type": "singleCorrect", "question": {"text": "The area (in sq.units) of a triangle formed by joining the vertex and the endpoints of the latus rectum of the parabola $x^2 = -20y$ is...", "image": null}, "options": [{"id": "4jQOa", "label": "A", "text": "$100$", "isCorrect": false, "image": null}, {"id": "xYPX0", "label": "B", "text": "$200$", "isCorrect": false, "image": null}, {"id": "1CNfk", "label": "C", "text": "$50$", "isCorrect": true, "image": null}, {"id": "ezxhx", "label": "D", "text": "$10$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given equation of the parabola is $x^2 = -20y$.<br><br>Comparing this with the standard form $x^2 = -4ay$, we get $4a = 20$, which gives $a = 5$.<br><br>The vertex of the parabola is $O(0, 0)$.<br><br>The endpoints of the latus rectum for $x^2 = -4ay$ are $(2a, -a)$ and $(-2a, -a)$.<br><br>Substituting $a = 5$, the endpoints of the latus rectum are $L(10, -5)$ and $L'(-10, -5)$.<br><br>The length of the base of the triangle formed by the vertex and the latus rectum is the length of the latus rectum, which is $4a = 20$.<br><br>The height of the triangle is the perpendicular distance from the vertex to the latus rectum, which is $a = 5$.<br><br>The area of the triangle is $\\dfrac{1}{2} \\times \\text{base} \\times \\text{height} = \\dfrac{1}{2} \\times 20 \\times 5 = 50$ sq. units.<br><br>Answer: $50$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885615a9fc0fc8c142bc", "type": "singleCorrect", "question": {"text": "The equation of the directrix of the parabola $x^2 - 4x - 5y - 1 = 0$ is...", "image": null}, "options": [{"id": "E87od", "label": "A", "text": "$4x + 9 = 0$", "isCorrect": false, "image": null}, {"id": "TKgjj", "label": "B", "text": "$4y + 9 = 0$", "isCorrect": true, "image": null}, {"id": "6VbN8", "label": "C", "text": "$4y - 9 = 0$", "isCorrect": false, "image": null}, {"id": "sv0oG", "label": "D", "text": "$4x - 9 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given equation of the parabola is $x^2 - 4x - 5y - 1 = 0$.<br><br>Completing the square for the $x$ terms:<br><br>$x^2 - 4x + 4 = 5y + 1 + 4$<br><br>$(x - 2)^2 = 5(y + 1)$<br><br>Comparing this with the standard form $(x - h)^2 = 4a(y - k)$, we get:<br><br>$h = 2$, $k = -1$, and $4a = 5 \\Rightarrow a = \\dfrac{5}{4}$<br><br>The equation of the directrix for this parabola is $y = k - a$.<br><br>Substituting the values of $k$ and $a$:<br><br>$y = -1 - \\dfrac{5}{4}$<br><br>$y = -\\dfrac{9}{4}$<br><br>$4y + 9 = 0$<br><br>Answer: $4y + 9 = 0$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b515a9fc0fc8c14640", "type": "singleCorrect", "question": {"text": "One of the tangents at the end of the latus rectum of the parabola $y^2 = 12x$ is", "image": null}, "options": [{"id": "NjL1W", "label": "A", "text": "$x - y + 3 = 0$", "isCorrect": true, "image": null}, {"id": "dqrTn", "label": "B", "text": "$2x + y = 0$", "isCorrect": false, "image": null}, {"id": "r9WPm", "label": "C", "text": "$3x + y - 3 = 0$", "isCorrect": false, "image": null}, {"id": "J6XSZ", "label": "D", "text": "$x + 3y - 3 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given equation of the parabola is $y^2 = 12x$.<br><br>Comparing this with the standard form $y^2 = 4ax$, we get $4a = 12 \\Rightarrow a = 3$.<br><br>The coordinates of the ends of the latus rectum for $y^2 = 4ax$ are $(a, 2a)$ and $(a, -2a)$.<br><br>Substituting $a = 3$, the ends of the latus rectum are $(3, 6)$ and $(3, -6)$.<br><br>The equation of the tangent to the parabola $y^2 = 4ax$ at a point $(x_1, y_1)$ is given by $y y_1 = 2a(x + x_1)$.<br><br>For the point $(3, 6)$, the equation of the tangent is:<br><br>$y(6) = 2(3)(x + 3)$<br><br>$6y = 6(x + 3)$<br><br>$x - y + 3 = 0$<br><br>For the point $(3, -6)$, the equation of the tangent is:<br><br>$y(-6) = 2(3)(x + 3)$<br><br>$-6y = 6(x + 3)$<br><br>$x + y + 3 = 0$<br><br>Among the given options, $x - y + 3 = 0$ is the correct equation.<br><br>Answer: $x - y + 3 = 0$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883615a9fc0fc8c14190", "type": "singleCorrect", "question": {"text": "The area of the triangle formed by the vertex and the endpoints of the latus rectum of the parabola $x^2=-18y$ is ...", "image": null}, "options": [{"id": "dHjl7", "label": "A", "text": "$\\dfrac{81}{4}$ square units.", "isCorrect": false, "image": null}, {"id": "nlQGI", "label": "B", "text": "$\\dfrac{81}{2}$ square units", "isCorrect": true, "image": null}, {"id": "EwhKR", "label": "C", "text": "$\\dfrac{81}{3}$ square units", "isCorrect": false, "image": null}, {"id": "pZIFg", "label": "D", "text": "$81$ square units", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given equation of the parabola is $x^2 = -18y$.<br><br>Comparing this with the standard form $x^2 = -4ay$, we get $4a = 18 \\Rightarrow a = \\dfrac{9}{2}$.<br><br>The vertex of the parabola is at the origin $V(0, 0)$.<br><br>The endpoints of the latus rectum are $L(2a, -a)$ and $L'(-2a, -a)$.<br><br>The base of the triangle formed by the vertex and the endpoints of the latus rectum is the length of the latus rectum, which is $LL' = 4a = 18$.<br><br>The height of the triangle is the perpendicular distance from the vertex to the latus rectum, which is equal to $a = \\dfrac{9}{2}$.<br><br>Area of the triangle $= \\dfrac{1}{2} \\times \\text{base} \\times \\text{height}$<br><br>Area $= \\dfrac{1}{2} \\times 18 \\times \\dfrac{9}{2} = \\dfrac{81}{2}$ square units.<br><br>Answer: $\\dfrac{81}{2}$ square units", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f38c30a4553e1bde90", "type": "singleCorrect", "question": {"text": "A parabola has its focus on the positive X-axis and the Y-axis as its directrix. If $P(\\alpha , 4)$ is a point on this parabola such that the tangent to the parabola at point P passes through the origin, then the distance of P from origin is", "image": null}, "options": [{"id": "ZIVi6", "label": "A", "text": "$4$", "isCorrect": false, "image": null}, {"id": "dTfHr", "label": "B", "text": "$\\sqrt{20}$", "isCorrect": false, "image": null}, {"id": "8ZfQb", "label": "C", "text": "$5$", "isCorrect": false, "image": null}, {"id": "pdYu2", "label": "D", "text": "$\\sqrt{32}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the focus of the parabola be $F(a, 0)$ with $a > 0$.<br><br>Since the directrix is the Y-axis ($x = 0$), the distance of any point $(x, y)$ on the parabola from the focus is equal to its distance from the directrix.<br><br>$\\sqrt{(x - a)^2 + y^2} = x$<br><br>Squaring both sides, we get:<br><br>$(x - a)^2 + y^2 = x^2$<br><br>$x^2 - 2ax + a^2 + y^2 = x^2$<br><br>$y^2 = 2ax - a^2$<br><br>The point $P(\\alpha, 4)$ lies on the parabola, so:<br><br>$16 = 2a\\alpha - a^2$<br><br>The equation of the tangent to the parabola $y^2 = 2ax - a^2$ at $P(\\alpha, 4)$ is given by $T = 0$:<br><br>$4y = a(x + \\alpha) - a^2$<br><br>Since the tangent passes through the origin $(0, 0)$, we substitute $x = 0$ and $y = 0$:<br><br>$0 = a(0 + \\alpha) - a^2$<br><br>$a\\alpha = a^2$<br><br>Since $a > 0$, we get $\\alpha = a$.<br><br>Substituting $\\alpha = a$ into the equation $16 = 2a\\alpha - a^2$:<br><br>$16 = 2a(a) - a^2$<br><br>$16 = a^2$<br><br>Since $a > 0$, we have $a = 4$, which gives $\\alpha = 4$.<br><br>The coordinates of point $P$ are $(4, 4)$.<br><br>The distance of $P$ from the origin is:<br><br>$OP = \\sqrt{4^2 + 4^2} = \\sqrt{16 + 16} = \\sqrt{32}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29f8c30a4553e1bdb0c", "type": "singleCorrect", "question": {"text": "The distance of the focus of the parabola $y^2 = 16x$ from its directrix is...", "image": null}, "options": [{"id": "DKA3Q", "label": "A", "text": "$4$", "isCorrect": false, "image": null}, {"id": "CU59s", "label": "B", "text": "$8$", "isCorrect": true, "image": null}, {"id": "XV5y9", "label": "C", "text": "$12$", "isCorrect": false, "image": null}, {"id": "nrpmN", "label": "D", "text": "$16$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given equation of the parabola is $y^2 = 16x$.<br><br>Comparing this with the standard form $y^2 = 4ax$, we get $4a = 16$, which gives $a = 4$.<br><br>The coordinates of the focus are $(a, 0) = (4, 0)$.<br><br>The equation of the directrix is $x = -a$, which is $x = -4$.<br><br>The distance between the focus and the directrix is the perpendicular distance from the point $(4, 0)$ to the line $x + 4 = 0$.<br><br>Distance $= |4 - (-4)| = 8$.<br><br>Alternatively, the distance from the focus to the directrix for a parabola $y^2 = 4ax$ is always $2a$.<br><br>Distance $= 2 \\times 4 = 8$.<br><br>Answer: $8$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3748c30a4553e1be3f1", "type": "singleCorrect", "question": {"text": "A point on the parabola $y^2 = \\dfrac{36}{5}x$ at which the ordinate increases at thrice the rate of the abscissa is .....", "image": null}, "options": [{"id": "4ZczO", "label": "A", "text": "$\\left(\\dfrac{6}{5}, \\dfrac{1}{5}\\right)$", "isCorrect": false, "image": null}, {"id": "Ftqrj", "label": "B", "text": "$\\left(\\dfrac{1}{5}, \\dfrac{6}{5}\\right)$", "isCorrect": true, "image": null}, {"id": "walIA", "label": "C", "text": "$(5, 6)$", "isCorrect": false, "image": null}, {"id": "RU0Vq", "label": "D", "text": "$\\left(\\dfrac{3}{5}, \\dfrac{9}{5}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given the equation of the parabola:<br><br>$y^2 = \\dfrac{36}{5}x$<br><br>Differentiating both sides with respect to time $t$:<br><br>$2y \\dfrac{dy}{dt} = \\dfrac{36}{5} \\dfrac{dx}{dt}$<br><br>It is given that the ordinate increases at thrice the rate of the abscissa, so:<br><br>$\\dfrac{dy}{dt} = 3 \\dfrac{dx}{dt}$<br><br>Substituting this into the differentiated equation:<br><br>$2y \\left(3 \\dfrac{dx}{dt}\\right) = \\dfrac{36}{5} \\dfrac{dx}{dt}$<br><br>$6y = \\dfrac{36}{5}$<br><br>$y = \\dfrac{6}{5}$<br><br>Substituting $y = \\dfrac{6}{5}$ into the equation of the parabola to find $x$:<br><br>$\\left(\\dfrac{6}{5}\\right)^2 = \\dfrac{36}{5}x$<br><br>$\\dfrac{36}{25} = \\dfrac{36}{5}x$<br><br>$x = \\dfrac{1}{5}$<br><br>The required point is $\\left(\\dfrac{1}{5}, \\dfrac{6}{5}\\right)$.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3748c30a4553e1be3ed", "type": "singleCorrect", "question": {"text": "The area of the triangle formed by the lines joining the vertex of the parabola $x^2 = 48y$ to the ends of its latus rectum, is .....", "image": null}, "options": [{"id": "LGZnA", "label": "A", "text": "$144$ sq. units", "isCorrect": false, "image": null}, {"id": "lzPFN", "label": "B", "text": "$288$ sq. units", "isCorrect": true, "image": null}, {"id": "CYiT6", "label": "C", "text": "$72$ sq. units", "isCorrect": false, "image": null}, {"id": "H1uik", "label": "D", "text": "$576$ sq. units", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given equation of the parabola is $x^2 = 48y$.<br><br>Comparing this with the standard form $x^2 = 4ay$, we get $4a = 48$, which gives $a = 12$.<br><br>The vertex of the parabola is $O(0, 0)$.<br><br>The ends of the latus rectum for $x^2 = 4ay$ are $(2a, a)$ and $(-2a, a)$.<br><br>Substituting $a = 12$, the ends of the latus rectum are $L(24, 12)$ and $L'(-24, 12)$.<br><br>The area of the triangle formed by the vertex and the ends of the latus rectum is given by $\\dfrac{1}{2} \\times \\text{base} \\times \\text{height}$.<br><br>The base is the length of the latus rectum $LL' = 4a = 48$.<br><br>The height is the distance from the vertex to the latus rectum, which is $a = 12$.<br><br>Area $= \\dfrac{1}{2} \\times 48 \\times 12 = 288$ sq. units.<br><br>Answer: $288$ sq. units", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf1bf9280d7f9932de0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The length of latus rectum of the parabola whose focus is $(3,3)$ and directrix is $3 x-4 y-2=0$ is ______ units.", "image": null}, "options": [{"id": "rRMnw", "text": "2", "image": null, "isCorrect": true}, {"id": "uO0q6", "text": "8", "image": null, "isCorrect": false}, {"id": "3Cs3w", "text": "6", "image": null, "isCorrect": false}, {"id": "np9vZ", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The length of the latus rectum of a parabola is twice the perpendicular distance from the focus to the directrix.<br><br>Let $d$ be the perpendicular distance from the focus $(3,3)$ to the directrix $3x - 4y - 2 = 0$.<br><br>$d = \\dfrac{|3(3) - 4(3) - 2|}{\\sqrt{3^2 + (-4)^2}}$<br><br>$d = \\dfrac{|9 - 12 - 2|}{\\sqrt{9 + 16}}$<br><br>$d = \\dfrac{|-5|}{5} = 1$<br><br>The length of the latus rectum is $2d = 2 \\times 1 = 2$ units.<br><br>Answer: 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd1bf9280d7f9932cb4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The equation of the directrix of the parabola $y^2+4 y+4 x+2=0$ is", "image": null}, "options": [{"id": "7AbBe", "text": "$x=-1$", "image": null, "isCorrect": false}, {"id": "0XWIN", "text": "$x=1$", "image": null, "isCorrect": false}, {"id": "rDgcW", "text": "$x=\\frac{-3}{2}$", "image": null, "isCorrect": false}, {"id": "WNJvG", "text": "$x=\\frac{3}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given equation of the parabola is $y^2 + 4y + 4x + 2 = 0$.<br><br>Rearranging the terms and completing the square for $y$:<br><br>$y^2 + 4y = -4x - 2$<br><br>$y^2 + 4y + 4 = -4x - 2 + 4$<br><br>$(y + 2)^2 = -4x + 2$<br><br>$(y + 2)^2 = -4\\left(x - \\dfrac{1}{2}\\right)$<br><br>Comparing this with the standard form $(y - k)^2 = -4a(x - h)$, we get:<br><br>$h = \\dfrac{1}{2}$, $k = -2$, and $4a = 4 \\Rightarrow a = 1$<br><br>The equation of the directrix for this parabola is $x = h + a$.<br><br>$x = \\dfrac{1}{2} + 1$<br><br>$x = \\dfrac{3}{2}$<br><br>Answer: $x=\\frac{3}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b2dbf9280d7f99326e6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The area of the triangle formed by the lines joining the vertex of the parabola $x^2=20 \\mathrm{y}$ to the end of its Latus rectum is", "image": null}, "options": [{"id": "mSxyQ", "text": "100 sq.units", "image": null, "isCorrect": false}, {"id": "YITAK", "text": "20 sq.units", "image": null, "isCorrect": false}, {"id": "NINxF", "text": "40 sq.units", "image": null, "isCorrect": false}, {"id": "6Bheo", "text": "50 sq.units", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given equation of the parabola is $x^2 = 20y$.<br><br>Comparing this with the standard form $x^2 = 4ay$, we get $4a = 20 \\Rightarrow a = 5$.<br><br>The vertex of the parabola is $V(0, 0)$.<br><br>The ends of the latus rectum are $L(2a, a)$ and $L'(-2a, a)$. Substituting $a = 5$, the coordinates are $L(10, 5)$ and $L'(-10, 5)$.<br><br>The triangle is formed by the points $V(0, 0)$, $L(10, 5)$, and $L'(-10, 5)$.<br><br>The base of this triangle is the length of the latus rectum, which is $4a = 20$.<br><br>The height of the triangle is the distance from the vertex to the latus rectum, which is $a = 5$.<br><br>Area of the triangle $= \\dfrac{1}{2} \\times \\text{base} \\times \\text{height}$<br><br>Area $= \\dfrac{1}{2} \\times 20 \\times 5 = 50$ sq. units.<br><br>Answer: 50 sq.units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ff90279619d9d8a20bc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "The equation of the directrix of the parabola $3 x^{2}=16 y$ is", "image": null}, "options": [{"id": "XL6uN", "text": "$3 y+4=0$", "image": null, "isCorrect": true}, {"id": "fMU4y", "text": "$3 x+4=0$", "image": null, "isCorrect": false}, {"id": "qfHaq", "text": "$3 y-4=0$", "image": null, "isCorrect": false}, {"id": "Vljgu", "text": "$3 x-4=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$3 x^{2}=16 y$\n$x^{2}=\\frac{16}{3} \\quad ; a=\\frac{4}{3}$\nDigectin $\\rightarrow$\n$y+\\frac{4}{3}=0$\n$3 y+4=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd20279619d9d8a1f88", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "The length of latus -rectum of the parabola $x^{2}+2 y=8 x-7$ is", "image": null}, "options": [{"id": "lj9ol", "text": "8", "image": null, "isCorrect": false}, {"id": "oHW0h", "text": "2", "image": null, "isCorrect": true}, {"id": "uNdfb", "text": "6", "image": null, "isCorrect": false}, {"id": "1Ofkc", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have,\n$\\begin{array}{l}\nx^{2}+2 y=8 x-7 \\\\\nx^{2}-8 x=-2 y-7 \\\\\nx^{2}-8 x+16=-2 y-7+16 \\\\\n(x-4)^{2}=-2 y+9 \\\\\n(x-4)^{2}=-2(y-9 / 2)\n\\end{array}$\n$\\therefore$ Length of latus rectum $=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc30279619d9d8a1f08", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "The cartesian co-ordinates of the point on the parabola $y^{2}=x$ whose parameter is $\\frac{-4}{3}$ are", "image": null}, "options": [{"id": "9WX77", "text": "$\\left(\\frac{4}{9}, \\frac{4}{3}\\right)$", "image": mo>×</mo><mfrac> <mn>1</mn> <mn>4</mn> </mfrac> <mo>,</mo><mn>2</mn><mrow><mo>(</mo> <mrow> <mfrac> <mn>1</mn> <mn>2</mn> </mfrac> <mn>4</mn></mrow> <mo>)</mo></mrow></mrow> <mo>)</mo></mrow></mrow> </math><br /><math> <mrow> <mi>P</mi><mrow><mo>(</mo> <mi>t</mi> <mo>)</mo></mrow><mo>=</mo><mrow><mo>(</mo> <mrow> <mo>−</mo><mn>1</mn><mo>,</mo><mn>4</mn></mrow> <mo>)</mo></mrow></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea80279619d9d8a1635", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The equation of directrix is to the parabola $4 x^{2}-4 x-2 y+3=0$ will be", "image": null}, "options": [{"id": "W7Of6", "text": "$2 y=1$", "image": null, "isCorrect": true}, {"id": "6ZCcM", "text": "$2 x=1$", "image": null, "isCorrect": false}, {"id": "gmw7I", "text": "$2 y=3$", "image": null, "isCorrect": false}, {"id": "Ahd1B", "text": "$2 x=3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given parabola, $4 x^{2}-4 x-2 y+3=0$ $\\Rightarrow 4\\left(x^{2}-x\\right)=2 y-3$\n$\\Rightarrow 4\\left(x^{2}-x+\\frac{1}{4}-\\frac{1}{4}\\right)=2 y-3$\n$\\Rightarrow\\left(x-\\frac{1}{2}\\right)^{2}=2 y-2$\n$\\Rightarrow\\left(x-\\frac{1}{2}\\right)^{2}=2(y-1)$\nwhich is of the form $X^{2}=4 a Y$\nwhere, $\\quad X=x-\\frac{1}{2}$ and $Y=y-1$\nand $\\quad a=\\frac{1}{2}$\n$\\therefore$ Directrix, $Y+a=0$ $\\Rightarrow \\quad y-1+\\frac{1}{2}=0$\n$\\Rightarrow \\quad y-\\frac{1}{2}=0$\n$\\Rightarrow 2 y=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea70279619d9d8a1634", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The intercept of the latusrectum to the parabola $y^{2}=4 a x$ are $b$ and $k$, then $k$ is equal to", "image": null}, "options": [{"id": "csSuL", "text": "$\\frac{a b}{a-b}$", "image": null, "isCorrect": false}, {"id": "MLWxQ", "text": "$\\frac{a}{b-a}$", "image": null, "isCorrect": false}, {"id": "MESMc", "text": "$\\frac{b}{b-a}$", "image": null, "isCorrect": false}, {"id": "jqBOb", "text": "$\\frac{a b}{b-a}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For latusrectum $P Q$.\n$$\ny\\left(t_{1}+t_{2}\\right)-2 x-2 a t_{1} t_{2}=0\n$$\nand $\\quad t_{1} t_{2}=-1$\nFor any point $P(x, y)$, the focal distance is $a+x$. $\\therefore \\quad b=a+x=a+a t_{1}^{2}=a\\left(1+t_{1}^{2}\\right) \\quad \\ldots(\\mathrm{i})$\n$c=a+x=a+a t_{2}^{2}=a+\\frac{a}{t_{1}^{2}} \\quad\\left(\\because t_{1} t_{2}=-1\\right)$\n$=\\frac{a\\left(1+t_{1}^{2}\\right)}{t_{1}^{2}}$...(ii)\n$\\frac{b}{c}=t_{1}^{2}$\n$\\therefore$ From Eq. (i), $b=a\\left(1+\\frac{b}{c}\\right)$\n$\\Rightarrow \\quad b=a+\\frac{a b}{c}$\n$c=\\frac{a b}{b-a}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e810279619d9d8a14f6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The equation of the curve whose vertex is $(0,0)$ and length of latusrectum is $\\frac{16}{3}$, is", "image": null}, "options": [{"id": "04eoR", "text": "$8 x^{2}+3 y^{2}=72$", "image": null, "isCorrect": false}, {"id": "cKO2d", "text": "$16 y^{2}=3 x$", "image": null, "isCorrect": false}, {"id": "CJcrR", "text": "$3 y^{2}=16 x$", "image": null, "isCorrect": true}, {"id": "Vp2BL", "text": "$3 x^{2}+16 y^{2}=48$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the curve $3 y^{2}=16 x$, the length of latusrectum is $\\frac{16}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a2633a0279619d9d8a3d37", "title": "Position of point", "totalQuestions": 2, "questions": [{"_id": "65a25e6f0279619d9d8a1469", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "The focal distance of a point $P$ on the parabola $y^{2}=12 x$ if the ordinate of $P$ is 6, is", "image": null}, "options": [{"id": "kHb4L", "text": "12", "image": null, "isCorrect": false}, {"id": "m2mT9", "text": "6", "image": null, "isCorrect": true}, {"id": "WlyES", "text": "3", "image": null, "isCorrect": false}, {"id": "iW1ZK", "text": "9", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given parabola is $y^{2}=12 x$\nHere $a=3$\nFor point $P(x, y), y=6$\nThis point lie on the parabola $\\therefore$\n$$\n(6)^{2}=12 x \\Rightarrow x=3\n$$\nNow, focal distance of point $P$ is $x+a=6$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e5a0279619d9d8a13bd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The focal distance of a point on the parabola $y^{2}=16 x$ whose ordinate is twice the abscissa, is", "image": null}, "options": [{"id": "vJgpz", "text": "6", "image": null, "isCorrect": false}, {"id": "zEOND", "text": "8", "image": null, "isCorrect": true}, {"id": "2gXI9", "text": "10", "image": null, "isCorrect": false}, {"id": "PHfci", "text": "12", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given curve is $y^{2}=16 x$. Let the point be $(h, k)$. But $2 h=k$, then $k^{2}=16 h$\n$$\n\\begin{aligned}\n\\Rightarrow & & 4 h^{2} &=16 h \\\\\n\\Rightarrow & & h &=0, h=4 \\\\\n\\Rightarrow & & k &=0, k=8\n\\end{aligned}\n$$\n$\\therefore$ Points are $(0,0),(4,8)$.\nHence, focal distance are respectively\n$$\n0+4=4,4+4=8\n$$\n$(\\because$ focal distance $=h-a)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263390279619d9d8a3d36", "title": "Tangent to Parabola", "totalQuestions": 7, "questions": [{"_id": "6abb88b815a9fc0fc8c14659", "type": "singleCorrect", "question": {"text": "The tangent to the parabola $x^2 = 2y$ at point P makes an angle of $45^\\circ$ with the X-axis, then the coordinates of P are:", "image": null}, "options": [{"id": "7CDfn", "label": "A", "text": "$\\left(1, \\dfrac{1}{2}\\right)$", "isCorrect": true, "image": null}, {"id": "E8izy", "label": "B", "text": "$(2, 2)$", "isCorrect": false, "image": null}, {"id": "tpJfZ", "label": "C", "text": "$(-2, 2)$", "isCorrect": false, "image": null}, {"id": "3MWuP", "label": "D", "text": "$\\left(-1, \\dfrac{1}{2}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given the equation of the parabola is $x^2 = 2y$.<br><br>Differentiating with respect to $x$, we get:<br><br>$2x = 2 \\dfrac{dy}{dx}$<br><br>$\\dfrac{dy}{dx} = x$<br><br>The tangent makes an angle of $45^\\circ$ with the X-axis, so its slope is $\\tan(45^\\circ) = 1$.<br><br>Therefore, $x = 1$.<br><br>Substituting $x = 1$ in the equation of the parabola:<br><br>$(1)^2 = 2y$<br><br>$y = \\dfrac{1}{2}$<br><br>The coordinates of point P are $\\left(1, \\dfrac{1}{2}\\right)$.<br><br>Answer: $\\left(1, \\dfrac{1}{2}\\right)$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887515a9fc0fc8c143e1", "type": "singleCorrect", "question": {"text": "If the tangent to the curve $y^2 = 4x$ at $(4, 4)$ touches the circle $x^2 + y^2 - c = 0$ then the value of $5c$ is", "image": null}, "options": [{"id": "4GTxm", "label": "A", "text": "$64$", "isCorrect": false, "image": null}, {"id": "4MxN3", "label": "B", "text": "$16$", "isCorrect": true, "image": null}, {"id": "N86mf", "label": "C", "text": "$4$", "isCorrect": false, "image": null}, {"id": "kEbeN", "label": "D", "text": "$8$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of the tangent to the parabola $y^2 = 4x$ at the point $(x_1, y_1)$ is given by $y y_1 = 2(x + x_1)$.<br><br>Substituting $x_1 = 4$ and $y_1 = 4$, we get $4y = 2(x + 4)$, which simplifies to $x - 2y + 4 = 0$.<br><br>This line touches the circle $x^2 + y^2 - c = 0$. The center of the circle is $(0, 0)$ and its radius is $\\sqrt{c}$.<br><br>For the line to be a tangent to the circle, the perpendicular distance from the center of the circle to the line must be equal to the radius.<br><br>The perpendicular distance $d = \\dfrac{|0 - 2(0) + 4|}{\\sqrt{1^2 + (-2)^2}} = \\dfrac{4}{\\sqrt{5}}$.<br><br>Equating this to the radius, we get $\\sqrt{c} = \\dfrac{4}{\\sqrt{5}}$.<br><br>Squaring both sides, $c = \\dfrac{16}{5}$.<br><br>Therefore, $5c = 16$.<br><br>Answer: $16$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd3bf9280d7f9932cc2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The angle, between the tangents drawn from the point $(1,4)$ to the parabola $\\mathrm{y}^2=4 x$, is", "image": null}, "options": [{"id": "0K2wW", "text": "$\\frac{\\pi}{6}$", "image": null, "isCorrect": false}, {"id": "lxerK", "text": "$\\frac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "fUbZr", "text": "$\\frac{\\pi}{3}$", "image": null, "isCorrect": true}, {"id": "PloWH", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of a tangent to the parabola $y^2 = 4ax$ having slope $m$ is $y = mx + \\dfrac{a}{m}$.<br><br>For the given parabola $y^2 = 4x$, we have $a = 1$. Thus, the equation of the tangent is $y = mx + \\dfrac{1}{m}$.<br><br>Since the tangent passes through the point $(1, 4)$, we substitute $x = 1$ and $y = 4$ into the equation:<br><br>$4 = m(1) + \\dfrac{1}{m}$<br><br>$m^2 - 4m + 1 = 0$<br><br>Let $m_1$ and $m_2$ be the roots of this quadratic equation, which represent the slopes of the two tangents.<br><br>$m_1 + m_2 = 4$<br><br>$m_1 m_2 = 1$<br><br>The angle $\\theta$ between the tangents is given by $\\tan \\theta = \\left| \\dfrac{m_1 - m_2}{1 + m_1 m_2} \\right|$.<br><br>We know that $(m_1 - m_2)^2 = (m_1 + m_2)^2 - 4m_1 m_2 = (4)^2 - 4(1) = 12$.<br><br>$|m_1 - m_2| = \\sqrt{12} = 2\\sqrt{3}$<br><br>Substituting the values, we get:<br><br>$\\tan \\theta = \\left| \\dfrac{2\\sqrt{3}}{1 + 1} \\right| = \\sqrt{3}$<br><br>$\\theta = \\dfrac{\\pi}{3}$<br><br>Answer: $\\frac{\\pi}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214170aee93fa0796dde6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "The equation of the tangent to the parabola $y^2=8 x$, which is parallel to the line $4 x-y+3=0$ is", "image": null}, "options": [{"id": "1fv4h", "text": "$2 x-8 y+1=0$", "image": null, "isCorrect": false}, {"id": "hZz1a", "text": "$8 x-2 y+1=0$", "image": null, "isCorrect": true}, {"id": "7YUTT", "text": "$8 x+2 y+1=0$", "image": null, "isCorrect": false}, {"id": "QHCdH", "text": "$2 x-8 y-1=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation of the parabola is $y^2 = 8x$.<br><br>Comparing this with the standard form $y^2 = 4ax$, we get $4a = 8 \\Rightarrow a = 2$.<br><br>The given line is $4x - y + 3 = 0$, which can be rewritten as $y = 4x + 3$.<br><br>The slope of this line is $m = 4$.<br><br>Since the required tangent is parallel to the given line, its slope is also $m = 4$.<br><br>The equation of the tangent to the parabola $y^2 = 4ax$ having slope $m$ is given by $y = mx + \\dfrac{a}{m}$.<br><br>Substituting $a = 2$ and $m = 4$, we get:<br><br>$y = 4x + \\dfrac{2}{4}$<br><br>$y = 4x + \\dfrac{1}{2}$<br><br>Multiplying by $2$, we get:<br><br>$2y = 8x + 1$<br><br>$8x - 2y + 1 = 0$<br><br>Answer: $8 x-2 y+1=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea60279619d9d8a162a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "If the line $b x+m y+n=0$ is tangent to the parabola $y^{2}=4 a x$, then", "image": null}, "options": [{"id": "H0rF3", "text": "$m n=a l^{2}$", "image": null, "isCorrect": false}, {"id": "ynabA", "text": "$\\mathrm{lm}=\\mathrm{an}^{2}$", "image": null, "isCorrect": false}, {"id": "cVZKw", "text": "$\\ln =a m^{2}$", "image": null, "isCorrect": true}, {"id": "X1b4G", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, parabola, $y^{2}=4 a x$\n$\\begin{array}{lr}\\Rightarrow & \\text { 2y } \\frac{d y}{d x}=4 a \\\\ \\Rightarrow \\quad \\frac{d y}{d x}=\\frac{2 a}{y}\\end{array}$\nwhich is the slope of tangent.\nGiven, $l x+m y+n=0$\nis an equation of tangent of the parabola $y^{2}=4 a x$\n$\\therefore$ Slope of tangent $=-\\frac{l}{m}$\nFrom Eqs. (i) and (ii)\n$$\n\\begin{aligned} \\frac{2 a}{y} &=-\\frac{l}{m} \\Rightarrow y=\\frac{-2 a m}{l} \\\\ \\Rightarrow \\quad & y^{2}=4 a x \\\\ \\Rightarrow \\quad \\frac{4 a^{2} m^{2}}{l^{2}} &=4 a x \\\\ \\Rightarrow & x=\\frac{a m^{2}}{l^{2}} \\end{aligned}\n$$\nOn putting the values of $x$ and $y$ in the following equation\n$$\n\\begin{aligned}\nb x+m y+n &=0 \\\\\nl\\left(\\frac{a m^{2}}{l^{2}}\\right)+m\\left(\\frac{-2 a m}{l}\\right)+n &=0 \\\\\n\\frac{a m^{2}}{l}-\\frac{2 a m^{2}}{l}+n &=0 \\\\\n\\Rightarrow \\quad \\quad \\frac{a m^{2}}{l}=n \\Rightarrow a m^{2} &=n l\n\\end{aligned}\n$$\nwhich is the required relation.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e710279619d9d8a1479", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "Equation of tangent to the parabola $y^{2}=16 x$ at\n$P(3,6)$ is", "image": null}, "options": [{"id": "NRxV9", "text": "$4 x-3 y+12=0$", "image": null, "isCorrect": false}, {"id": "ffLKp", "text": "$3 y-4 x-12=0$", "image": null, "isCorrect": true}, {"id": "XOZPx", "text": "$4 x-3 y-24=0$", "image": null, "isCorrect": false}, {"id": "KPjsM", "text": "$3 y-x-24=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of tangent to parabola $y^{2}=16 x$ at $P(3,6)$ is\n$\\begin{aligned} & & 6 y &=8(x+3) \\\\ \\Rightarrow & & 3 y &=4 x+12 \\\\ \\Rightarrow & 3 y-4 x &-12 &=0 \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e460279619d9d8a1323", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The equation to the line touching both the parabolas $y^{2}=4 x$ and $x^{2}=-32 y$, is", "image": null}, "options": [{"id": "7IDxl", "text": "$x+2 y+4=0$", "image": null, "isCorrect": false}, {"id": "gmUzB", "text": "$2 x+y-4=0$", "image": null, "isCorrect": false}, {"id": "ISiCF", "text": "$x-2 y-4=0$", "image": null, "isCorrect": false}, {"id": "5QIj8", "text": "$x-2 y+4=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The equation of any tangent to the parabola $y^{2}=4 x$ is\n$$\ny=m x+\\frac{1}{m}\n$$\nThis touches the parabola $x^{2}=-32 y$, therefore the equation $x^{2}=-32\\left(m x+\\frac{1}{m}\\right)$ has equal roots\n$\\therefore$\n$$\n(32 \\mathrm{~m})^{2}=4\\left(\\frac{32}{\\mathrm{~m}}\\right)\n$$\n$$\n\\Rightarrow \\quad 8 m^{3}=1 \\quad \\Rightarrow \\quad m=\\frac{1}{2}\n$$\nOn putting the value of $m$ in Eq. (i), we get\n$$\nx-2 y+4=0\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a2633a0279619d9d8a3d38", "title": "Common Tangent", "totalQuestions": 6, "questions": [{"_id": "6abb88a415a9fc0fc8c145a3", "type": "singleCorrect", "question": {"text": "The equation of the common tangent to the parabolas $y^2 = 4x$ and $x^2 = 32y$ is ...", "image": null}, "options": [{"id": "crErW", "label": "A", "text": "$x + 2y = 0$", "isCorrect": false, "image": null}, {"id": "IXCny", "label": "B", "text": "$x + 2y - 4 = 0$", "isCorrect": false, "image": null}, {"id": "SUkTc", "label": "C", "text": "$x + 2y + 4 = 0$", "isCorrect": true, "image": null}, {"id": "mxxUn", "label": "D", "text": "$x - 2y + 4 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of a tangent to the parabola $y^2 = 4ax$ with slope $m$ is $y = mx + \\dfrac{a}{m}$.<br>For $y^2 = 4x$, $a = 1$, so the tangent is $y = mx + \\dfrac{1}{m}$.<br><br>The equation of a tangent to the parabola $x^2 = 4by$ with slope $m$ is $y = mx - bm^2$.<br>For $x^2 = 32y$, $b = 8$, so the tangent is $y = mx - 8m^2$.<br><br>For a common tangent, both equations must represent the same line, which means their y-intercepts must be equal:<br>$\\dfrac{1}{m} = -8m^2$<br><br>$m^3 = -\\dfrac{1}{8}$<br><br>$m = -\\dfrac{1}{2}$<br><br>Substituting $m = -\\dfrac{1}{2}$ into the equation of the tangent:<br>$y = -\\dfrac{1}{2}x + \\dfrac{1}{-1/2}$<br><br>$y = -\\dfrac{1}{2}x - 2$<br><br>$2y = -x - 4$<br><br>$x + 2y + 4 = 0$<br><br>Answer: $x + 2y + 4 = 0$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b63bf9280d7f99328be", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Angle between the parabola $y^2=4(x-1)$ and $x^2+4(y-3)=0$ at the common end of their latus rectum is", "image": null}, "options": [{"id": "tv792", "text": "$\\frac{\\pi}{2}$", "image": null, "isCorrect": true}, {"id": "XI22t", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": false}, {"id": "hSTUG", "text": "$\\frac{\\pi}{6}$", "image": null, "isCorrect": false}, {"id": "8OVBc", "text": "$\\frac{\\pi}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the first parabola $y^2 = 4(x-1)$, the vertex is $(1, 0)$ and $a = 1$.<br><br>The focus is $(1+1, 0) = (2, 0)$.<br><br>Substituting $x = 2$ into the equation to find the endpoints of the latus rectum:<br><br>$y^2 = 4(2-1) = 4 \\Rightarrow y = \\pm 2$<br><br>The endpoints of its latus rectum are $(2, 2)$ and $(2, -2)$.<br><br>For the second parabola $x^2 = -4(y-3)$, the vertex is $(0, 3)$ and $a = 1$.<br><br>The focus is $(0, 3-1) = (0, 2)$.<br><br>Substituting $y = 2$ into the equation to find the endpoints of the latus rectum:<br><br>$x^2 = -4(2-3) = 4 \\Rightarrow x = \\pm 2$<br><br>The endpoints of its latus rectum are $(2, 2)$ and $(-2, 2)$.<br><br>The common end of their latus rectum is the point $(2, 2)$.<br><br>To find the angle between the parabolas at $(2, 2)$, we find the slopes of their tangents at this point.<br><br>Differentiating $y^2 = 4(x-1)$ with respect to $x$:<br><br>$2y \\dfrac{dy}{dx} = 4 \\Rightarrow \\dfrac{dy}{dx} = \\dfrac{2}{y}$<br><br>At $(2, 2)$, the slope is $m_1 = \\dfrac{2}{2} = 1$.<br><br>Differentiating $x^2 = -4(y-3)$ with respect to $x$:<br><br>$2x = -4 \\dfrac{dy}{dx} \\Rightarrow \\dfrac{dy}{dx} = -\\dfrac{x}{2}$<br><br>At $(2, 2)$, the slope is $m_2 = -\\dfrac{2}{2} = -1$.<br><br>Since $m_1 m_2 = (1)(-1) = -1$, the tangents are perpendicular to each other.<br><br>Therefore, the angle between the parabolas is $\\dfrac{\\pi}{2}$.<br><br>Answer: $\\frac{\\pi}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b51bf9280d7f9932826", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The Y-intercept of the common tangent to the parabola $y^2=32 x$ and $x^2=108 y$ is", "image": null}, "options": [{"id": "Xo5ki", "text": "$3$", "image": null, "isCorrect": false}, {"id": "TfpFE", "text": "$-12$", "image": null, "isCorrect": true}, {"id": "mloGj", "text": "$-3$", "image": null, "isCorrect": false}, {"id": "bd80n", "text": "$2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of a tangent to the parabola $y^2 = 4ax$ is given by $y = mx + \\dfrac{a}{m}$.<br><br>For the parabola $y^2 = 32x$, we have $4a = 32 \\Rightarrow a = 8$.<br>Thus, the tangent is $y = mx + \\dfrac{8}{m}$.<br><br>The equation of a tangent to the parabola $x^2 = 4by$ is given by $y = mx - bm^2$.<br><br>For the parabola $x^2 = 108y$, we have $4b = 108 \\Rightarrow b = 27$.<br>Thus, the tangent is $y = mx - 27m^2$.<br><br>For a common tangent, the Y-intercepts of both equations must be equal:<br><br>$\\dfrac{8}{m} = -27m^2$<br><br>$m^3 = -\\dfrac{8}{27}$<br><br>$m = -\\dfrac{2}{3}$<br><br>The Y-intercept of the common tangent is $c = \\dfrac{8}{m}$.<br><br>Substituting the value of $m$:<br><br>$c = \\dfrac{8}{-\\dfrac{2}{3}} = -12$<br><br>Answer: $-12$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e910279619d9d8a157d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "The equation of the common tangent touching the circle $(x-3)^{2}+y^{2}=9$ and the parabola $y^{2}=4 x$ above the $x$ -axis is", "image": null}, "options": [{"id": "R32Ik", "text": "$\\sqrt{2} y=3 x+1$", "image": null, "isCorrect": false}, {"id": "kfI1u", "text": "$\\sqrt{3} y=-(x+3)$", "image": null, "isCorrect": false}, {"id": "WEbBL", "text": "$\\sqrt{3} y=x+3$", "image": null, "isCorrect": true}, {"id": "Cxnjd", "text": "$\\sqrt{3} y=-(3 x+1)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the common tangent to the parabola\n$$\n\\begin{array}{l}\ny^{2}=4 x \\text { be } \\\\\ny=m x+\\frac{1}{m}\n\\end{array}\n$$\nIt should be also touch the circle\n$$\n(x-3)^{2}+y^{2}=9\n$$\nwhose centre is $(3,0)$ and radius $=3$, then\n$$\n\\begin{array}{cc} \n& \\frac{|3 m+1 / m|}{\\sqrt{1+m^{2}}}=3 \\\\\n\\Rightarrow & 3 m^{2}=1 \\\\\n\\Rightarrow & \\quad m=\\pm \\frac{1}{\\sqrt{3}}\n\\end{array}\n$$\nBut $m>0$, then equation of common tangent is\n$$\ny=\\frac{1}{\\sqrt{3}} \\cdot x+\\sqrt{3}\n$$\nor $\\sqrt{3} \\cdot y=x+3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e800279619d9d8a14f5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The equation of common tangent to the circle $x^{2}+y^{2}=2$ and the parabola $y^{2}=8 x$ is $x+y-k$. Then value of $k$ is", "image": null}, "options": [{"id": "70vVn", "text": "1", "image": null, "isCorrect": false}, {"id": "5GXen", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "AL4yb", "text": "$\\underline{2}$", "image": null, "isCorrect": false}, {"id": "4hnwu", "text": "$-2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given parabola is, $y^{2}=8 x$\nHere,\n$$\n4 a=8 \\Rightarrow a=2\n$$\nAny tangent to the parabola is $y=m x+\\frac{a}{m}$\nor\n$$\nm x-y+\\frac{2}{m}=0\n$$\nIf it is a tangent to the circle $x^{2}+y^{2}=2$, then length of perpendicular from centre $(0,0)$ is equal to radius $\\sqrt{2}$.\n$$\n\\begin{array}{lr}\n\\therefore & \\frac{2 / m}{\\sqrt{m^{2}+1}}=\\sqrt{2} \\\\\n\\Rightarrow & \\frac{4}{m^{2}}=2\\left(m^{2}+1\\right) \\\\\n\\Rightarrow & m^{4}+m^{2}-2=0 \\\\\n\\Rightarrow & \\left(m^{2}+2\\right)\\left(m^{2}-1\\right)=0\n\\end{array}\n$$\n$\\Rightarrow \\quad m^{2}=\\pm 1$\nHence, the common tangent are $y=\\pm(x+2)$. But given equation of tangent is $x+y=k$ On comparing, we get $k=-2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e5e0279619d9d8a13dd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The equation of common tangent to the circle $x^{2}+y^{2}=2$ and parabola $y^{2}=8 x$ is", "image": null}, "options": [{"id": "reU7R", "text": "$y=x+1$", "image": null, "isCorrect": false}, {"id": "DSX32", "text": "$y=x+2$", "image": null, "isCorrect": true}, {"id": "Zv6uN", "text": "$y=x-2$", "image": null, "isCorrect": false}, {"id": "7Wplq", "text": "$y=-x+2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $y^{2}=8 x$\n$$\n\\therefore \\quad 4 a=8 \\Rightarrow a=2\n$$\nAny tangent of parabola is,\n$$\n\\begin{aligned}\ny &=m x+\\frac{a}{m} \\\\\n\\Rightarrow \\quad & m x-y+\\frac{2}{m}=0\n\\end{aligned}\n$$\nIf it is a tangent to the circle $x^{2}+y^{2}=2$, then perpendicular from centre $(0,0)$ is equal to radius $\\sqrt{2}$.\n$$\n\\begin{array}{lr}\n\\therefore & \\frac{\\frac{2}{m}}{\\sqrt{m^{2}+1}}=\\sqrt{2} \\\\\n\\Rightarrow & \\frac{4}{m^{2}}=2\\left(m^{2}+1\\right) \\\\\n\\Rightarrow & \\quad m^{4}+m^{2}-2=0 \\\\\n\\Rightarrow & \\left(m^{2}+2\\right)\\left(m^{2}-1\\right)=0\n\\end{array}\n$$\n$\\Rightarrow$\n$m=\\pm 1$\nHence, the common tangents are $y=\\pm(x+2)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a2633a0279619d9d8a3d3a", "title": "Normal to Parabola", "totalQuestions": 2, "questions": [{"_id": "65a25ea60279619d9d8a1629", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "If $2 x+y+\\lambda=0$ is normal to the parabola $y^{2}=8 x$, then $\\lambda$ is", "image": null}, "options": [{"id": "iE8Tn", "text": "$-24$", "image": null, "isCorrect": true}, {"id": "76HoG", "text": "8", "image": null, "isCorrect": false}, {"id": "F73y2", "text": "$-16$", "image": null, "isCorrect": false}, {"id": "qlOlL", "text": "24", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, parabola, $y^{2}=8 x$\n$\\begin{array}{lr}\\Rightarrow & 2 y \\frac{d y}{d x}=8 \\\\ \\Rightarrow & \\frac{d y}{d x}=\\frac{4}{y}\\end{array}$\nSlope of normal of parabola $=-\\frac{y}{4}$ $\\ldots(\\mathrm{i})$\nGiven, $2 x+y+\\lambda=0$ is a equation of normal of the parabola $y^{2}=8 x$.\n$\\therefore$ Slope of normal $=-2$ $\\ldots$ (ii)\nFrom Eqs. (i) and (ii), we get\n$\\therefore$\n$-\\frac{y}{4}=-2 \\Rightarrow y=8$\n$(8)^{2}=8 x \\Rightarrow x=8$\nNow, putting the values of $x$ and $y$ in the equation of normal\n$\\begin{aligned} 2(8)+8+\\lambda &=0 \\\\\\Rightarrow \\lambda &=-24 \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e910279619d9d8a157e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "The equations of the normals at the ends of the latusrectum of the parabola $y^{2}=4 a x$ are given by", "image": null}, "options": [{"id": "XRNdi", "text": "$x^{2}-y^{2}-6 a x+9 a^{2}=0$", "image": null, "isCorrect": true}, {"id": "PD3ca", "text": "$x^{2}-y^{2}-6 a x-6 a y+9 a^{2}=0$", "image": null, "isCorrect": false}, {"id": "vOFVL", "text": "$x^{2}-y^{2}-6 a y+9 a^{2}=0$", "image": null, "isCorrect": false}, {"id": "FxL4O", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The coordinates of the ends of the latusrectum of the parabola $y^{2}=4 a x$ are $(a, 2 a)$ respectively. The equation of the normal at $(a, 2 a)$ to $y^{2}=4 a x$ is\n$$\ny-2 a=\\frac{-2 a}{2 a}(x-a)\n$$\nor $x+y-3 a=0$\nSimilarly, the equation of the normal $(a,-2 a)$ is\n$$\nx-y-3 a=0\n$$\nThe combined equation is\n$$\nx^{2}-y^{2}-6 a x+9 a^{2}=0\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a2633a0279619d9d8a3d3b", "title": "Locus", "totalQuestions": 1, "questions": [{"_id": "65a25ea60279619d9d8a1628", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The pole of the line $L x+m y+n=0$ w.r.t. the parabola $y^{2}=4 a x$ will be", "image": null}, "options": [{"id": "N7mmb", "text": "$\\left(\\frac{-n}{l}, \\frac{-2 a m}{l}\\right)$", "image": null, "isCorrect": false}, {"id": "OVB3Y", "text": "$\\left(\\frac{-n}{l}, \\frac{2 a m}{l}\\right)$", "image": null, "isCorrect": false}, {"id": "KycUB", "text": "$\\left(\\frac{n}{l}, \\frac{-2 a m}{l}\\right)$", "image": null, "isCorrect": true}, {"id": "jdDsX", "text": "$\\left(\\frac{n}{l}, \\frac{2 a m}{l}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Tangent of the parabola $y^{2}=4 a x$ at point $P\\left(x_{1}, y_{1}\\right)$ is\n$$\ny y_{1}=2 a\\left(x+x_{1}\\right)\n$$\n$$\n\\Rightarrow \\quad 2 a x_{1}-y y_{1}+2 \\alpha x=0 \\ldots(\\mathrm{i})\n$$\n\nwhich is also equation of the polar of the parabola $y^{2}=4 a x$. Same as the line\n$$\nb x+m y+n=0...(ii)\n$$\nOn comparing both lines, we get\n$$\n\\frac{2 a}{l}=\\frac{-y}{m}=\\frac{2 a x}{n}\n$$\nTaking first two parts\n$$\n\\left(y=-\\frac{2 a m}{l}\\right)\n$$\nTaking first and last parts,\n$$\n\\left(x=\\frac{n}{l}\\right)\n$$\n$\\therefore$ Required pole of the line is $\\left\\{\\frac{n}{l}, \\frac{-2 a m}{l}\\right\\} .$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "68871e9ebf9280d7f9933089", "title": "Line and parabola", "totalQuestions": 1, "questions": [{"_id": "68871b72bf9280d7f9932951", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The line $\\mathrm{y}=\\mathrm{m} x+3$ is tangent to the parabola $\\mathrm{y}^2=4 x$, if the value of m is", "image": null}, "options": [{"id": "uE62C", "text": "$3$", "image": null, "isCorrect": false}, {"id": "3TUtV", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": true}, {"id": "ptFUj", "text": "$4$", "image": null, "isCorrect": false}, {"id": "MHB8h", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the given parabola is $y^2 = 4x$.<br><br>Comparing with the standard form $y^2 = 4ax$, we get $4a = 4 \\Rightarrow a = 1$.<br><br>The equation of the given line is $y = mx + 3$.<br><br>Comparing with $y = mx + c$, we get $c = 3$.<br><br>The condition for the line $y = mx + c$ to be a tangent to the parabola $y^2 = 4ax$ is $c = \\dfrac{a}{m}$.<br><br>Substituting the values of $a$ and $c$, we get $3 = \\dfrac{1}{m}$.<br><br>Therefore, $m = \\dfrac{1}{3}$.<br><br>Answer: $\\frac{1}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
