{2}\\left[1-2\\left(\\frac{\\sqrt{5}-1}{4}\\right)^2\\right] \\\\ & =\\frac{\\sqrt{5}+1}{8}\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a60279619d9d8a2e3d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "In a triangle $A B C$ with usual notations, If $a: b: c=7: 8: 9$ : then $\\cos A: \\cos B: \\cos C=$", "image": null}, "options": [{"id": "6FZc4", "text": "14:11:6", "image": null, "isCorrect": true}, {"id": "pVHF6", "text": "7:8:9", "image": null, "isCorrect": false}, {"id": "tyiDK", "text": "3:4:5", "image": null, "isCorrect": false}, {"id": "PQcEE", "text": "5:6:7", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $a=7 k, b=8 k, c=9 k$\nUsing cosine rule $\\cos A=\\frac{2}{3}, \\cos B=\\frac{11}{21}, \\cos C=\\frac{2}{7}$\n$Rightarrow \\cos A: \\cos B: \\cos C=14: 11: 6$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261930279619d9d8a2daf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f418  ^2 70^{\\circ}}+\\frac{\\sin \\left(180^{\\circ}-\\theta\\right)}{\\sin \\theta}=$", "image": null}, "options": [{"id": "H824V", "text": "$\\sec ^2\\left(20^{\\circ}\\right)$", "image": null, "isCorrect": true}, {"id": "B4mmU", "text": "$\\cot ^2\\left(20^{\\circ}\\right)$", "image": null, "isCorrect": false}, {"id": "BzhIC", "text": "$\\tan ^2\\left(20^{\\circ}\\right)$", "image": null, "isCorrect": false}, {"id": "bM8pa", "text": "$\\operatorname{cosec}^2\\left(20^{\\circ}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\frac{\\sin ^2\\left(-160^{\\circ}\\right)}{\\sin ^2 70^{\\circ}}+\\frac{\\sin \\left(180^{\\circ}-\\theta\\right)}{\\sin \\theta} \\\\ & =\\frac{\\sin ^2\\left(160^{\\circ}\\right)}{\\sin ^2\\left(70^{\\circ}\\right)}+\\frac{\\sin \\theta}{\\sin \\theta} \\\\ & =\\frac{\\sin ^2\\left(90^{\\circ}+70^{\\circ}\\right)}{\\sin ^2 70^{\\circ}}+1 \\\\ & \\frac{\\cos ^2 70^{\\circ}}{\\sin ^2 70^{\\circ}}+1 \\\\ & =\\cot ^2 70^{\\circ}+1=\\operatorname{cosec}^2 70^{\\circ}=\\sec ^2 20^{\\circ}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2616c0279619d9d8a2c71", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "$\\operatorname{Cos}^2 48^{\\circ}-\\sin ^2 12^{\\circ}=$<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/1n-mwtS9R9NEpcfnZ5YMx3nJSGyX_wVQJCDNxtc row><mrow><mn>12</mn></mrow></mfrac></mrow></mfrac><mo>=</mo><mi> </mi><mo>-</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a2634d0279619d9d8a3dfc", "title": "Basic Identities & T Ratios", "totalQuestions": 28, "questions": [{"_id": "6abb88d515a9fc0fc8c14763", "type": "singleCorrect", "question": {"text": "If $\\sec 2\\theta = p + \\tan 2\\theta$ then, the value of $\\cos^2\\theta$ is", "image": null}, "options": [{"id": "r9Vij", "label": "A", "text": "$\\dfrac{(p-1)^2}{2(p^2+1)}$", "isCorrect": false, "image": null}, {"id": "3W3lg", "label": "B", "text": "$\\dfrac{(p+1)^2}{2(p^2+1)}$", "isCorrect": true, "image": null}, {"id": "NlWh4", "label": "C", "text": "$\\dfrac{p^2+1}{2(p+1)^2}$", "isCorrect": false, "image": null}, {"id": "kyMY0", "label": "D", "text": "$\\dfrac{p^2+1}{2(p-1)^2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\sec 2\\theta - \\tan 2\\theta = p$<br><br>We know the identity $\\sec^2 2\\theta - \\tan^2 2\\theta = 1$<br><br>$\\Rightarrow (\\sec 2\\theta - \\tan 2\\theta)(\\sec 2\\theta + \\tan 2\\theta) = 1$<br><br>$\\Rightarrow p(\\sec 2\\theta + \\tan 2\\theta) = 1$<br><br>$\\Rightarrow \\sec 2\\theta + \\tan 2\\theta = \\dfrac{1}{p}$<br><br>Adding the two equations, we get:<br><br>$2\\sec 2\\theta = p + \\dfrac{1}{p} = \\dfrac{p^2+1}{p}$<br><br>$\\Rightarrow \\sec 2\\theta = \\dfrac{p^2+1}{2p}$<br><br>$\\Rightarrow \\cos 2\\theta = \\dfrac{2p}{p^2+1}$<br><br>Using the identity $\\cos 2\\theta = 2\\cos^2\\theta - 1$:<br><br>$2\\cos^2\\theta - 1 = \\dfrac{2p}{p^2+1}$<br><br>$2\\cos^2\\theta = 1 + \\dfrac{2p}{p^2+1} = \\dfrac{p^2+1+2p}{p^2+1} = \\dfrac{(p+1)^2}{p^2+1}$<br><br>$\\Rightarrow \\cos^2\\theta = \\dfrac{(p+1)^2}{2(p^2+1)}$<br><br>Answer: $\\dfrac{(p+1)^2}{2(p^2+1)}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889415a9fc0fc8c1450b", "type": "singleCorrect", "question": {"text": "The value of expression $\\tan 9^\\circ - \\tan 27^\\circ - \\tan 63^\\circ + \\tan 81^\\circ$ is....", "image": null}, "options": [{"id": "xkH83", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "yMoPg", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "CbOb6", "label": "C", "text": "$4$", "isCorrect": true, "image": null}, {"id": "C3EFw", "label": "D", "text": "$8$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given expression is $\\tan 9^\\circ - \\tan 27^\\circ - \\tan 63^\\circ + \\tan 81^\\circ$<br><br>Grouping the terms, we get:<br><br>$(\\tan 9^\\circ + \\tan 81^\\circ) - (\\tan 27^\\circ + \\tan 63^\\circ)$<br><br>Using $\\tan(90^\\circ - \\theta) = \\cot \\theta$, this becomes:<br><br>$(\\tan 9^\\circ + \\cot 9^\\circ) - (\\tan 27^\\circ + \\cot 27^\\circ)$<br><br>Using the identity $\\tan \\theta + \\cot \\theta = \\dfrac{\\sin \\theta}{\\cos \\theta} + \\dfrac{\\cos \\theta}{\\sin \\theta} = \\dfrac{1}{\\sin \\theta \\cos \\theta} = \\dfrac{2}{\\sin 2\\theta}$:<br><br>$= \\dfrac{2}{\\sin 18^\\circ} - \\dfrac{2}{\\sin 54^\\circ}$<br><br>$= 2 \\left( \\dfrac{\\sin 54^\\circ - \\sin 18^\\circ}{\\sin 18^\\circ \\sin 54^\\circ} \\right)$<br><br>Using the formula $\\sin C - \\sin D = 2 \\cos \\left(\\dfrac{C+D}{2}\\right) \\sin \\left(\\dfrac{C-D}{2}\\right)$:<br><br>$= 2 \\left( \\dfrac{2 \\cos 36^\\circ \\sin 18^\\circ}{\\sin 18^\\circ \\sin 54^\\circ} \\right)$<br><br>Since $\\sin 54^\\circ = \\sin(90^\\circ - 36^\\circ) = \\cos 36^\\circ$, the expression simplifies to:<br><br>$= 2 \\left( \\dfrac{2 \\cos 36^\\circ \\sin 18^\\circ}{\\sin 18^\\circ \\cos 36^\\circ} \\right) = 4$<br><br>Answer: $4$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c615a9fc0fc8c146dc", "type": "singleCorrect", "question": {"text": "If $\\sin^4 \\theta + \\cos^4 \\theta = \\dfrac{5}{8}, 0 < \\theta < \\dfrac{\\pi}{2}$, then $\\sin 2\\theta = ...$", "image": null}, "options": [{"id": "t7ont", "label": "A", "text": "$\\dfrac{1}{2}$", "isCorrect": false, "image": null}, {"id": "Wg2bf", "label": "B", "text": "$\\dfrac{\\sqrt{3}}{2}$", "isCorrect": true, "image": null}, {"id": "aFwHV", "label": "C", "text": "$\\dfrac{1}{\\sqrt{2}}$", "isCorrect": false, "image": null}, {"id": "hJzgK", "label": "D", "text": "$\\dfrac{3}{4}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\sin^4 \\theta + \\cos^4 \\theta = \\dfrac{5}{8}$<br><br>We know that $\\sin^4 \\theta + \\cos^4 \\theta = (\\sin^2 \\theta + \\cos^2 \\theta)^2 - 2\\sin^2 \\theta \\cos^2 \\theta$<br><br>$\\Rightarrow 1 - 2\\sin^2 \\theta \\cos^2 \\theta = \\dfrac{5}{8}$<br><br>$\\Rightarrow 2\\sin^2 \\theta \\cos^2 \\theta = 1 - \\dfrac{5}{8} = \\dfrac{3}{8}$<br><br>Multiplying both sides by $2$, we get:<br><br>$4\\sin^2 \\theta \\cos^2 \\theta = \\dfrac{3}{4}$<br><br>$\\Rightarrow (2\\sin \\theta \\cos \\theta)^2 = \\dfrac{3}{4}$<br><br>$\\Rightarrow \\sin^2 2\\theta = \\dfrac{3}{4}$<br><br>Since $0 < \\theta < \\dfrac{\\pi}{2}$, we have $0 < 2\\theta < \\pi$, which means $\\sin 2\\theta > 0$.<br><br>Taking the positive square root, we get:<br><br>$\\sin 2\\theta = \\dfrac{\\sqrt{3}}{2}$<br><br>Answer: $\\dfrac{\\sqrt{3}}{2}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f28c30a4553e1bde87", "type": "singleCorrect", "question": {"text": "Let $f_k(x) = \\dfrac{1}{k}(\\cos^k x + \\sin^k x)$ where $k \\in N$, then $f_6(x) - f_4(x) = \\ldots$", "image": null}, "options": [{"id": "vB92f", "label": "A", "text": "$\\dfrac{1}{6}$", "isCorrect": false, "image": null}, {"id": "iaa3o", "label": "B", "text": "$-\\dfrac{1}{12}$", "isCorrect": true, "image": null}, {"id": "vADNy", "label": "C", "text": "$-\\dfrac{1}{6}$", "isCorrect": false, "image": null}, {"id": "zyr7i", "label": "D", "text": "$\\dfrac{1}{12}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $f_k(x) = \\dfrac{1}{k}(\\cos^k x + \\sin^k x)$<br><br>For $k = 6$:<br>$f_6(x) = \\dfrac{1}{6}(\\cos^6 x + \\sin^6 x)$<br><br>Using the identity $a^3 + b^3 = (a+b)^3 - 3ab(a+b)$ with $a = \\cos^2 x$ and $b = \\sin^2 x$:<br>$\\cos^6 x + \\sin^6 x = (\\cos^2 x + \\sin^2 x)^3 - 3\\cos^2 x \\sin^2 x(\\cos^2 x + \\sin^2 x) = 1 - 3\\cos^2 x \\sin^2 x$<br><br>Thus, $f_6(x) = \\dfrac{1}{6}(1 - 3\\cos^2 x \\sin^2 x) = \\dfrac{1}{6} - \\dfrac{1}{2}\\cos^2 x \\sin^2 x$<br><br>For $k = 4$:<br>$f_4(x) = \\dfrac{1}{4}(\\cos^4 x + \\sin^4 x)$<br><br>Using the identity $a^2 + b^2 = (a+b)^2 - 2ab$ with $a = \\cos^2 x$ and $b = \\sin^2 x$:<br>$\\cos^4 x + \\sin^4 x = (\\cos^2 x + \\sin^2 x)^2 - 2\\cos^2 x \\sin^2 x = 1 - 2\\cos^2 x \\sin^2 x$<br><br>Thus, $f_4(x) = \\dfrac{1}{4}(1 - 2\\cos^2 x \\sin^2 x) = \\dfrac{1}{4} - \\dfrac{1}{2}\\cos^2 x \\sin^2 x$<br><br>Subtracting $f_4(x)$ from $f_6(x)$:<br>$f_6(x) - f_4(x) = \\left(\\dfrac{1}{6} - \\dfrac{1}{2}\\cos^2 x \\sin^2 x\\right) - \\left(\\dfrac{1}{4} - \\dfrac{1}{2}\\cos^2 x \\sin^2 x\\right)$<br><br>$f_6(x) - f_4(x) = \\dfrac{1}{6} - \\dfrac{1}{4} = \\dfrac{2 - 3}{12} = -\\dfrac{1}{12}$<br><br>Answer: $-\\dfrac{1}{12}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ba8c30a4553e1bdc2f", "type": "singleCorrect", "question": {"text": "The value of the expression $\\tan(x - 9\\pi)$ is equal to:", "image": null}, "options": [{"id": "DulRV", "label": "A", "text": "$-\\tan x$", "isCorrect": false, "image": null}, {"id": "uMUa4", "label": "B", "text": "$-\\cot x$", "isCorrect": false, "image": null}, {"id": "maEYq", "label": "C", "text": "$\\tan x$", "isCorrect": true, "image": null}, {"id": "0RV53", "label": "D", "text": "$\\cot x$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\tan(x - 9\\pi) = -\\tan(9\\pi - x)$<br><br>$-\\tan(9\\pi - x) = -\\tan(4(2\\pi) + \\pi - x)$<br><br>Using the periodic property $\\tan(2n\\pi + \\theta) = \\tan \\theta$ for integer $n$:<br><br>$-\\tan(4(2\\pi) + \\pi - x) = -\\tan(\\pi - x)$<br><br>Since $\\tan(\\pi - \\theta) = -\\tan \\theta$:<br><br>$-\\tan(\\pi - x) = -(-\\tan x) = \\tan x$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b70bf9280d7f993293e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The value of\n$\\sin ^2 5^{\\circ}+\\sin ^2 10^{\\circ}+\\sin ^2 15+\\ldots \\ldots \\ldots \\ldots \\ldots . .+\\sin ^2 85^{\\circ}+\\sin ^2 90^{\\circ}=$", "image": null}, "options": [{"id": "HfmjN", "text": "$\\frac{19}{2}$", "image": null, "isCorrect": true}, {"id": "gLZOU", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}, {"id": "d1hZZ", "text": "$\\frac{23}{2}$", "image": null, "isCorrect": false}, {"id": "O7p1d", "text": "$\\frac{21}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given series is $S = \\sin^2 5^{\\circ} + \\sin^2 10^{\\circ} + \\sin^2 15^{\\circ} + \\dots + \\sin^2 85^{\\circ} + \\sin^2 90^{\\circ}$.<br><br>The angles are in an arithmetic progression with a common difference of $5^{\\circ}$. The number of terms is $\\dfrac{90}{5} = 18$.<br><br>We can group the terms from the beginning and the end (excluding $45^{\\circ}$ and $90^{\\circ}$) as follows:<br><br>$S = (\\sin^2 5^{\\circ} + \\sin^2 85^{\\circ}) + (\\sin^2 10^{\\circ} + \\sin^2 80^{\\circ}) + \\dots + (\\sin^2 40^{\\circ} + \\sin^2 50^{\\circ}) + \\sin^2 45^{\\circ} + \\sin^2 90^{\\circ}$<br><br>Using the complementary angle identity $\\sin(90^{\\circ} - \\theta) = \\cos \\theta$, we have $\\sin^2 85^{\\circ} = \\cos^2 5^{\\circ}$, $\\sin^2 80^{\\circ} = \\cos^2 10^{\\circ}$, and so on.<br><br>$S = (\\sin^2 5^{\\circ} + \\cos^2 5^{\\circ}) + (\\sin^2 10^{\\circ} + \\cos^2 10^{\\circ}) + \\dots + (\\sin^2 40^{\\circ} + \\cos^2 40^{\\circ}) + \\sin^2 45^{\\circ} + \\sin^2 90^{\\circ}$<br><br>Since $\\sin^2 \\theta + \\cos^2 \\theta = 1$, each of the $8$ pairs sums to $1$.<br><br>$S = 8(1) + \\left(\\dfrac{1}{\\sqrt{2}}\\right)^2 + (1)^2$<br><br>$S = 8 + \\dfrac{1}{2} + 1$<br><br>$S = 9 + \\dfrac{1}{2} = \\dfrac{19}{2}$<br><br>Answer: $\\frac{19}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792144e0aee93fa0796df97", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "The value of $\\cos 20^{\\circ}+2 \\sin ^2 55^{\\circ}-\\sqrt{2} \\sin 65^{\\circ}$ is", "image": null}, "options": [{"id": "TDPvS", "text": "0", "image": null, "isCorrect": false}, {"id": "GvT8q", "text": "1", "image": null, "isCorrect": true}, {"id": "JVZZQ", "text": "-1", "image": null, "isCorrect": false}, {"id": "KJmEA", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the identity $2 \\sin^2 \\theta = 1 - \\cos 2\\theta$, we have $2 \\sin^2 55^{\\circ} = 1 - \\cos 110^{\\circ}$.<br><br>The given expression becomes:<br>$\\cos 20^{\\circ} + 1 - \\cos 110^{\\circ} - \\sqrt{2} \\sin 65^{\\circ}$<br><br>Rearranging the terms, we get:<br>$1 + (\\cos 20^{\\circ} - \\cos 110^{\\circ}) - \\sqrt{2} \\sin 65^{\\circ}$<br><br>Using the formula $\\cos C - \\cos D = 2 \\sin\\left(\\dfrac{C+D}{2}\\right) \\sin\\left(\\dfrac{D-C}{2}\\right)$, we get:<br>$\\cos 20^{\\circ} - \\cos 110^{\\circ} = 2 \\sin\\left(\\dfrac{20^{\\circ}+110^{\\circ}}{2}\\right) \\sin\\left(\\dfrac{110^{\\circ}-20^{\\circ}}{2}\\right)$<br><br>$= 2 \\sin 65^{\\circ} \\sin 45^{\\circ}$<br><br>$= 2 \\sin 65^{\\circ} \\left(\\dfrac{1}{\\sqrt{2}}\\right)$<br><br>$= \\sqrt{2} \\sin 65^{\\circ}$<br><br>Substituting this back into the expression, we get:<br>$1 + \\sqrt{2} \\sin 65^{\\circ} - \\sqrt{2} \\sin 65^{\\circ} = 1$<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214030aee93fa0796dd4d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "If the sides of a triangle $a, b, c$ are in A.P., then with usual notations, a $\\cos ^2 \\frac{\\mathrm{C}}{2}+\\mathrm{c} \\cos ^2 \\frac{\\mathrm{~A}}{2}$ is", "image": null}, "options": [{"id": "3hD2K", "text": "$\\frac{3 a}{2}$", "image": null, "isCorrect": false}, {"id": "KmHGt", "text": "$\\frac{3 \\mathrm{c}}{2}$", "image": null, "isCorrect": false}, {"id": "g5bzv", "text": "$\\frac{3 b}{2}$", "image": null, "isCorrect": true}, {"id": "X2dcC", "text": "$\\frac{\\mathrm{a}+\\mathrm{c}}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the trigonometric identity $\\cos^2 \\theta = \\dfrac{1 + \\cos 2\\theta}{2}$, we can write the given expression as:<br><br>$a \\cos^2 \\dfrac{C}{2} + c \\cos^2 \\dfrac{A}{2} = a \\left( \\dfrac{1 + \\cos C}{2} \\right) + c \\left( \\dfrac{1 + \\cos A}{2} \\right)$<br><br>$= \\dfrac{a + c}{2} + \\dfrac{a \\cos C + c \\cos A}{2}$<br><br>By the projection formula, $a \\cos C + c \\cos A = b$. Substituting this, we get:<br><br>$= \\dfrac{a + c + b}{2}$<br><br>Since the sides $a, b, c$ are in A.P., we have $a + c = 2b$. Substituting this into the expression:<br><br>$= \\dfrac{2b + b}{2} = \\dfrac{3b}{2}$<br><br>Answer: $\\frac{3 b}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f10aee93fa0796dcbb", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "$\\cos ^3\\left(\\frac{\\pi}{8}\\right) \\cos \\left(\\frac{3 \\pi}{8}\\right)+\\sin ^3\\left(\\frac{\\pi}{8}\\right) \\sin \\left(\\frac{3 \\pi}{8}\\right)=$", "image": null}, "options": [{"id": "yF9lv", "text": "$\\frac{1}{2 \\sqrt{2}}$", "image": null, "isCorrect": true}, {"id": "1BsAN", "text": "$\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "RAlzN", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "wd7W2", "text": "$\\frac{\\sqrt{3}}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\theta = \\dfrac{\\pi}{8}$. Then $\\dfrac{3\\pi}{8} = \\dfrac{\\pi}{2} - \\dfrac{\\pi}{8} = \\dfrac{\\pi}{2} - \\theta$.<br><br>The given expression becomes:<br><br>$\\cos^3\\theta \\cos\\left(\\dfrac{\\pi}{2} - \\theta\\right) + \\sin^3\\theta \\sin\\left(\\dfrac{\\pi}{2} - \\theta\\right)$<br><br>Using $\\cos\\left(\\dfrac{\\pi}{2} - \\theta\\right) = \\sin\\theta$ and $\\sin\\left(\\dfrac{\\pi}{2} - \\theta\\right) = \\cos\\theta$, we get:<br><br>$\\cos^3\\theta \\sin\\theta + \\sin^3\\theta \\cos\\theta$<br><br>Taking $\\sin\\theta \\cos\\theta$ common:<br><br>$\\sin\\theta \\cos\\theta (\\cos^2\\theta + \\sin^2\\theta)$<br><br>Since $\\cos^2\\theta + \\sin^2\\theta = 1$, this simplifies to:<br><br>$\\sin\\theta \\cos\\theta = \\dfrac{1}{2}(2\\sin\\theta \\cos\\theta) = \\dfrac{1}{2}\\sin(2\\theta)$<br><br>Substituting $\\theta = \\dfrac{\\pi}{8}$:<br><br>$\\dfrac{1}{2}\\sin\\left(2 \\times \\dfrac{\\pi}{8}\\right) = \\dfrac{1}{2}\\sin\\left(\\dfrac{\\pi}{4}\\right)$<br><br>$\\dfrac{1}{2} \\times \\dfrac{1}{\\sqrt{2}} = \\dfrac{1}{2\\sqrt{2}}$<br><br>Answer: $\\frac{1}{2 \\sqrt{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f00aee93fa0796dcb3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "If angle $\\theta$ in $[0,2 \\pi]$ satisfies both the equations $\\cot \\theta=\\sqrt{3}$ and $\\sqrt{3} \\sec \\theta+2=0$, then $\\theta$ is equal to", "image": null}, "options": [{"id": "m19eV", "text": "$\\frac{\\pi}{6}$", "image": null, "isCorrect": false}, {"id": "0JhOG", "text": "$\\frac{7 \\pi}{6}$", "image": null, "isCorrect": true}, {"id": "Jc8HE", "text": "$\\frac{5 \\pi}{6}$", "image": null, "isCorrect": false}, {"id": "L2P41", "text": "$\\frac{11 \\pi}{6}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\cot \\theta = \\sqrt{3}$<br><br>$\\Rightarrow \\tan \\theta = \\dfrac{1}{\\sqrt{3}}$<br><br>Since $\\tan \\theta$ is positive, $\\theta$ lies in the first or third quadrant.<br><br>In $[0, 2\\pi]$, the solutions are $\\theta = \\dfrac{\\pi}{6}$ or $\\theta = \\dfrac{7\\pi}{6}$.<br><br>Also given $\\sqrt{3} \\sec \\theta + 2 = 0$<br><br>$\\Rightarrow \\sec \\theta = -\\dfrac{2}{\\sqrt{3}}$<br><br>$\\Rightarrow \\cos \\theta = -\\dfrac{\\sqrt{3}}{2}$<br><br>Since $\\cos \\theta$ is negative, $\\theta$ lies in the second or third quadrant.<br><br>In $[0, 2\\pi]$, the solutions are $\\theta = \\dfrac{5\\pi}{6}$ or $\\theta = \\dfrac{7\\pi}{6}$.<br><br>The common value satisfying both equations is $\\theta = \\dfrac{7\\pi}{6}$.<br><br>Answer: $\\frac{7 \\pi}{6}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213570aee93fa0796d804", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "If $\\tan x=\\dfrac{3}{4}$ and $\\pi \\lt x \\lt \\dfrac{3 \\pi}{2}$, then $\\cos \\dfrac{x}{2}=$ $\\qquad$", "image": null}, "options": [{"id": "9jMib", "text": "$\\dfrac{-2}{5}$", "image": null, "isCorrect": false}, {"id": "Jm7th", "text": "$\\dfrac{2}{5}$", "image": null, "isCorrect": false}, {"id": "ANXS1", "text": "$\\dfrac{1}{\\sqrt{10}}$", "image": null, "isCorrect": false}, {"id": "GLIbV", "text": "$\\dfrac{-1}{\\sqrt{10}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $\\tan x = \\dfrac{3}{4}$ and $\\pi < x < \\dfrac{3\\pi}{2}$.<br><br>Since $x$ lies in the third quadrant, $\\cos x$ is negative.<br><br>$\\sec^2 x = 1 + \\tan^2 x = 1 + \\dfrac{9}{16} = \\dfrac{25}{16}$<br><br>$\\sec x = -\\dfrac{5}{4} \\Rightarrow \\cos x = -\\dfrac{4}{5}$<br><br>Using the half-angle formula, $\\cos^2 \\dfrac{x}{2} = \\dfrac{1 + \\cos x}{2}$<br><br>$\\cos^2 \\dfrac{x}{2} = \\dfrac{1 - \\dfrac{4}{5}}{2} = \\dfrac{1}{10}$<br><br>Since $\\pi < x < \\dfrac{3\\pi}{2}$, dividing by $2$ gives $\\dfrac{\\pi}{2} < \\dfrac{x}{2} < \\dfrac{3\\pi}{4}$.<br><br>Thus, $\\dfrac{x}{2}$ lies in the second quadrant, where the cosine function is negative.<br><br>Therefore, $\\cos \\dfrac{x}{2} = -\\dfrac{1}{\\sqrt{10}}$.<br><br>Answer: $\\dfrac{-1}{\\sqrt{10}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615a0279619d9d8a2bde", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "The value of $(\\cos \\alpha+\\cos \\beta)^2+(\\sin \\alpha+\\sin \\beta)^2$ is", "image": null}, "options": [{"id": "M68zm", "text": "$2 \\sin ^2\\left(\\frac{\\alpha-\\beta}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "Mr5oJ", "text": "$2 \\cos ^2\\left(\\frac{\\alpha-\\beta}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "XFHsP", "text": "$4 \\cos ^2\\left(\\frac{\\alpha-\\beta}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "NLmpx", "text": "$4 \\sin ^2\\left(\\frac{\\alpha-\\beta}{2}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & (\\cos \\alpha+\\cos \\beta)^2+(\\sin \\alpha+\\sin \\beta)^2 \\\\ & =\\left(\\cos ^2 \\alpha+\\sin ^2 \\alpha\\right)+\\left(\\cos ^2 \\beta+\\sin ^2 \\beta\\right)+2(\\cos \\alpha \\cdot \\cos \\beta+\\sin \\alpha \\cdot \\sin \\beta) \\\\ & =1+1+2 \\cos (\\alpha-\\beta) \\\\ & =2\\{1+\\cos (\\alpha-\\beta)\\} \\\\ & =2 \\times 2 \\cos ^2\\left(\\frac{\\alpha-\\beta}{2}\\right) \\\\ & =4 \\cos ^2\\left(\\frac{\\alpha-\\beta}{2}\\right)\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2607c0279619d9d8a24dd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "$\\tan 3 \\mathrm{~A} \\cdot \\tan 2 \\mathrm{~A} \\cdot \\tan \\mathrm{A}=$", "image": null}, "options": [{"id": "uARwR", "text": "$\\tan 3 \\mathrm{~A}+\\tan 2 \\mathrm{~A}-\\tan \\mathrm{A}$", "image": null, "isCorrect": false}, {"id": "7TKhx", "text": "$\\tan 3 \\mathrm{~A}-\\tan 2 \\mathrm{~A}-\\tan \\mathrm{A}$", "image": null, "isCorrect": true}, {"id": "oBqf7", "text": "$\\tan 3 \\mathrm{~A}+\\tan 2 \\mathrm{~A}+\\tan \\mathrm{A}$", "image": null, "isCorrect": false}, {"id": "2hXkO", "text": "$\\tan 3 \\mathrm{~A}-\\tan 2 \\mathrm{~A}+\\tan \\mathrm{A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\tan 3 \\mathrm{~A}=\\tan (2 \\mathrm{~A}+\\mathrm{A}) \\\\ & =\\frac{\\tan 2 \\mathrm{~A}+\\tan \\mathrm{A}}{1-\\tan 2 \\mathrm{~A} \\tan \\mathrm{A}} \\\\ & \\therefore \\tan 3 \\mathrm{~A}-\\tan 3 \\mathrm{~A} \\tan 2 \\mathrm{~A} \\tan \\mathrm{A}=\\tan 2 \\mathrm{~A}+\\tan \\mathrm{A} \\\\ & \\therefore \\tan 3 \\mathrm{~A} \\tan 2 \\mathrm{~A} \\tan \\mathrm{A}=\\tan 3 \\mathrm{~A}-\\tan 2 \\mathrm{~A}-\\tan \\mathrm{A}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260670279619d9d8a2439", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "The number of solutions of $\\cos 2 \\theta=\\sin \\theta$ in $(0,2 \\pi)$ are", "image": null}, "options": [{"id": "BX9LC", "text": "3", "image": null, "isCorrect": true}, {"id": "HnH0a", "text": "2", "image": null, "isCorrect": false}, {"id": "q6RhI", "text": "4", "image": null, "isCorrect": false}, {"id": "b79Ui", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\cos 2 \\theta=\\sin \\theta \\\\\n& \\therefore 1-2 \\sin ^2 \\theta=\\sin \\theta \\Rightarrow 2 \\sin ^2 \\theta+\\sin \\theta-1=0 \\\\\n& \\therefore(2 \\sin \\theta-1)(\\sin \\theta+1)=0 \\Rightarrow \\sin \\theta=\\frac{1}{2},-1\n\\end{aligned}\n$$\nWe have $\\theta \\in(0,2 \\pi)$\n$\\therefore$ Possible values of $\\theta$ are $\\frac{\\pi}{6}, \\frac{5 \\pi}{6}, \\frac{3 \\pi}{6}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2601f0279619d9d8a21f0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "If $\\sin x+\\operatorname{cosec} x=3$, then value of $\\sin ^{4} x+\\operatorname{cosec}^{4} x$ is", "image": null}, "options": [{"id": "jEzf5", "text": "74", "image": null, "isCorrect": false}, {"id": "nYN24", "text": "47", "image": null, "isCorrect": true}, {"id": "0bmix", "text": "07", "image": null, "isCorrect": false}, {"id": "ZiIuJ", "text": "49", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $\\sin x+\\operatorname{cosec} x=3$\n$\\therefore \\sin ^{2} x+\\operatorname{cosec}^{2} x+2 \\sin x \\operatorname{cosec} x=9$\n$\\therefore \\sin ^{2} x+\\operatorname{cosec}^{2} x=9-2=7$\n$\\therefore \\sin ^{4} x+\\operatorname{cosec}^{4} x+2 \\sin ^{2} x \\operatorname{cosec}^{2} x=49$\n$\\therefore \\sin ^{4} x+\\operatorname{cosec}^{4} x=49-2=47$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2600e0279619d9d8a2160", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "If $\\tan \\theta+\\cot \\theta=4$, then $\\tan ^{4} \\theta+\\cot ^{4} \\theta=$", "image": null}, "options": [{"id": "eybJU", "text": "194", "image": null, "isCorrect": true}, {"id": "l9fUT", "text": "110", "image": null, "isCorrect": false}, {"id": "0W9M2", "text": "80", "image": null, "isCorrect": false}, {"id": "nFmCc", "text": "191", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\tan \\theta+\\cot \\theta=4$\nOn squaring both side, we get\n$\\tan ^{2} \\theta+\\cot ^{2} \\theta+2 \\tan \\theta \\cot \\theta=16 \\Rightarrow \\tan ^{2} \\theta+\\cot ^{2} \\theta=14$\nOn squaring both side, we get\n$\\begin{array}{l}\n\\tan ^{4} \\theta+\\cot ^{4} \\theta+2 \\tan ^{2} \\theta \\cot ^{2} \\theta=196 \\\\\n\\tan ^{4} \\theta+\\cot ^{4} \\theta=196-2=194\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2600d0279619d9d8a215e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "If $\\mathrm{A}, \\mathrm{B}, \\mathrm{C}, \\mathrm{D}$ are the angles of a cyclic quadrilateral taken in order, then $\\cos A+\\cos B+\\operatorname{Cos} C+\\operatorname{Cos} D=$", "image": null}, "options": [{"id": "trAbf", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "j5N0w", "text": "1", "image": null, "isCorrect": false}, {"id": "00xFk", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "VN1wq", "text": "0", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Since the quadrilateral $\\mathrm{ABCD}$ is cyclic, we have\n$\\mathrm{A}+\\mathrm{C}=180^{\\circ}$ and $\\mathrm{B}+\\mathrm{D}=180^{\\circ}$\n$\\therefore \\cos \\mathrm{A}=\\cos \\left(180^{\\circ}-\\mathrm{C}\\right)=-\\cos \\mathrm{C}$\n$\\cos \\mathrm{B}=\\cos \\left(180^{\\circ}-\\mathrm{D}\\right) \\quad=-\\cos \\mathrm{D}$\n$\\therefore \\cos \\mathrm{A}+\\cos \\mathrm{B}+\\cos \\mathrm{C}+\\cos \\mathrm{D}=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ff50279619d9d8a209a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "If $A$ and $B$ are supplementary angles, then $\\sin ^{2} \\frac{A}{2}+\\sin ^{2} \\frac{B}{2}=$", "image": null}, "options": [{"id": "WMyuF", "text": "1", "image": null, "isCorrect": true}, {"id": "NQ5Rv", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": false}, {"id": "cJAxy", "text": "0", "image": null, "isCorrect": false}, {"id": "qzdvw", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(C)\n$A$ and $B$ are supplementary angles. $\\Rightarrow A+B=180 \\Rightarrow A=180-B \\Rightarrow \\frac{A}{2}=90-\\frac{B}{2}$\n$\\therefore \\sin ^{2} \\frac{A}{2}+\\sin ^{2} \\frac{B}{2}=\\sin ^{2} \\frac{A}{2}+\\sin ^{2}\\left(90-\\frac{A}{2}\\right)=\\sin ^{2} \\frac{A}{2}+\\cos ^{2}\\left(\\frac{A}{2}\\right)=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd50279619d9d8a1f9a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "If $a=\\sin 175^{\\circ}+\\cos 175^{\\circ}$, then", "image": null}, "options": [{"id": "uvZXo", "text": "$a>0$", "image": null, "isCorrect": false}, {"id": "q3FyZ", "text": "$a=0$", "image": null, "isCorrect": false}, {"id": "0NcPk", "text": "$a < 0$", "image": null, "isCorrect": true}, {"id": "0bIg4", "text": "$a=1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(B)\n$\\begin{aligned} a &=\\sin \\left(180^{\\circ}-5^{\\circ}\\right)+\\cos \\left(180^{\\circ}-5^{\\circ}\\right) \\\\ &=\\sin 5^{\\circ}-\\cos 5^{\\circ} \\end{aligned}$\nIn first quadrunt, $\\sin \\theta < \\sin \\theta < \\cos \\theta$\nWhen $0 \\leq \\theta < 45^{\\circ}$\n$\\therefore \\sin 5^{\\circ} < \\cos 5^{\\circ} \\Rightarrow \\sin 5^{\\circ}-\\cos 5^{\\circ} < 0 \\Rightarrow a < 0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc10279619d9d8a1efe", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "If $\\sin \\theta=\\frac{-12}{13}, \\cos \\phi=\\frac{-4}{5}$ and $\\theta, \\phi$ lie in the third quadrant, then $\\tan(\\theta-\\phi)=$", "image": null}, "options": [{"id": "dHcTz", "text": "$\\frac{-33}{56}$", "image": null, "isCorrect": false}, {"id": "boBy5", "text": "$\\frac{-56}{33}$", "image": null, "isCorrect": false}, {"id": "JwLyB", "text": "$\\frac{56}{33}$", "image": null, "isCorrect": false}, {"id": "vlCTj", "text": "$\\frac{33}{56}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(D)\n$\\sin \\theta=\\frac{-12}{13} \\Rightarrow \\cos \\theta=\\sqrt{1-\\left(\\frac{-12}{13}\\right)^{2}}=\\sqrt{\\frac{25}{169}}=\\pm \\frac{5}{13}$\n$\\because \\theta$ is in third quadrant $\\Rightarrow \\cos \\theta \\quad=-\\frac{5}{13} \\Rightarrow \\frac{\\sin \\theta}{\\cos \\theta}=\\tan \\theta=\\frac{12}{5}$\n$\\cos \\phi=-\\frac{4}{5} \\Rightarrow \\sin \\phi=\\sqrt{1-\\left(\\frac{-4}{5}\\right)^{2}}=\\sqrt{\\frac{9}{25}}=\\pm \\frac{3}{5}$\n$\\phi$ is in third quadrant $\\Rightarrow \\sin \\phi=\\frac{-3}{5} \\Rightarrow \\frac{\\sin \\phi}{\\cos \\phi}=\\tan \\phi=\\frac{3}{4}$ $\\tan (\\theta-\\phi)=\\frac{\\tan \\theta-\\tan \\phi}{1+\\tan \\phi \\cdot \\tan \\phi}$\n$=\\frac{\\frac{12}{5}-\\frac{3}{4}}{1+\\left(\\frac{12}{5} \\times \\frac{3}{4}\\right)}=\\frac{\\frac{33}{20}}{\\frac{56}{20}}=\\frac{33}{56}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f9c0279619d9d8a1ddb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "$\\sin \\left(\\frac{\\pi}{3}+x\\right)-\\cos \\left(\\frac{\\pi}{6}+x\\right)=$", "image": null}, "options": [{"id": "bq7C5", "text": "$-\\cos x$", "image": null, "isCorrect": false}, {"id": "B2v1q", "text": "$-\\sin x$", "image": null, "isCorrect": false}, {"id": "BePXE", "text": "$\\cos x$", "image": null, "isCorrect": false}, {"id": "n4vzq", "text": "$\\sin x$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\sin \\left(\\frac{\\pi}{3}+x\\right)-\\cos \\left(\\frac{\\pi}{6}+x\\right)$\n$=\\frac{\\sqrt{3}}{2} \\cos x+\\frac{1}{2} \\sin x-\\frac{\\sqrt{3}}{2} \\cos x+\\frac{1}{2} \\sin x$\n$=\\sin x$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f980279619d9d8a1dc3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "If $x=3 \\sin \\theta, y=3 \\cos \\theta \\cos \\phi, z=3 \\cos \\theta \\sin \\emptyset$, then $x^{2}+y^{2}+z^{2}=$", "image": null}, "options": [{"id": "5fqBa", "text": "$18$", "image": null, "isCorrect": false}, {"id": "FVeSe", "text": "$27$", "image": null, "isCorrect": false}, {"id": "pyaUh", "text": "$9$", "image": null, "isCorrect": true}, {"id": "Phqlm", "text": "$3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} x^{2}+y^{2}+z^{2} &=9 \\sin ^{2} \\theta+9 \\cos ^{2} \\theta \\cos ^{2} \\phi+9 \\cos ^{2} \\theta \\sin ^{2} \\phi \\\\ &=9 \\sin ^{2} \\theta+9 \\cos ^{2} \\theta\\left(\\cos ^{2} \\phi+\\sin ^{2} \\phi\\right) \\\\ &=9 \\sin ^{2} \\theta+9 \\cos ^{2} \\theta \\\\ &=9\\left(\\sin ^{2} \\theta+\\cos ^{2} \\theta\\right)=9 \\times 1=9 \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f970279619d9d8a1db9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "$\\sin 690^{\\circ} \\times \\sec 240^{\\circ}=$", "image": null}, "options": [{"id": "79Tgz", "text": "$1$", "image": null, "isCorrect": true}, {"id": "jnrrJ", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "rR30W", "text": "$\\frac{-1}{2}$", "image": null, "isCorrect": false}, {"id": "NsmYK", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\sin 690^{\\circ} \\times \\sec 240^{\\circ}$\n$=\\sin \\left(1 \\times 360^{\\circ}+330^{\\circ}\\right) \\times \\sec \\left(180^{\\circ}+60^{\\circ}\\right)$\n$=\\sin 330^{\\circ} \\times\\left(-\\sec 60^{\\circ}\\right)$\n$=\\sin \\left(2 \\pi-30^{\\circ}\\right) \\times(-2)$\n$=-2\\left(-\\sin 30^{\\circ}\\right)=(-2)\\left(-\\frac{1}{2}\\right)=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f890279619d9d8a1d42", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "If $\\tan \\theta+\\sin \\theta=a$ and $\\tan \\theta-\\sin \\theta=b$, then the values of $\\cot \\theta$ and $\\operatorname{cosec} \\theta$\nare respectively", "image": null}, "options": [{"id": "YwCNt", "text": "$\\frac{1}{a+b}, \\frac{1}{a-b}$", "image": null, "isCorrect": false}, {"id": "YsiMo", "text": "$\\frac{2}{a+b}, \\frac{2}{a-b}$", "image": null, "isCorrect": true}, {"id": "xqIJp", "text": "$\\frac{2}{a-b}, \\frac{2}{a+b}$", "image": null, "isCorrect": false}, {"id": "5523Z", "text": "$\\frac{1}{a-b}, \\frac{1}{a+b}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have\n$\\tan \\theta+\\sin \\theta=a\\ldots(1)$ and \n$\\tan \\theta-\\sin \\theta=b\\ldots(2)$\nAdding equation (1) \\& (2), we get\n$2 \\tan \\theta=a+b \\Rightarrow \\tan \\theta=\\frac{a+b}{2} \\Rightarrow \\cot \\theta=\\frac{2}{a+b}$\nBy equation (1) - equation (2), we get\n$2 \\sin \\theta=a-b \\quad \\Rightarrow \\sin \\theta=\\frac{a-b}{2} \\Rightarrow \\operatorname{cosec} \\theta=\\frac{2}{a-b}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f860279619d9d8a1d2f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "Which of the following have the same value\n(a) $\\sin 120^{\\circ}$\n(b) $\\cos 930^{\\circ}$\n(c) $\\tan 840^{\\circ}$\n(d) $\\cot \\left(-1110^{\\circ}\\right)$", "image": null}, "options": [{"id": "ngHsO", "text": "only (a) and (b)", "image": null, "isCorrect": false}, {"id": "ZVB2s", "text": "All $(a),(b),(c),(d)$", "image": null, "isCorrect": false}, {"id": "ROQsB", "text": "only $(a)$ and $(c)$", "image": null, "isCorrect": false}, {"id": "h9cxB", "text": "only $(\\mathrm{c})$ and $(\\mathrm{d})$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(a) $\\sin 120^{\\circ}=\\sin \\left(90^{\\circ}+30^{\\circ}\\right)=\\cos 30^{\\circ}=\\frac{\\sqrt{3}}{2}$\n(b) $\\cos 930^{\\circ}=\\cos \\left[\\left(2 \\times 360^{\\circ}\\right)+210^{\\circ}\\right]=\\cos 210^{\\circ}=\\cos (180+30)=-\\cos 30^{\\circ}=-\\frac{\\sqrt{3}}{2}$\n(c) $\\tan 840^{\\circ}=\\tan \\left[\\left(2 \\times 360^{\\circ}\\right)+120^{\\circ}\\right]=-\\tan 120^{\\circ}=-\\cot 30^{\\circ}=-\\sqrt{3}$\n(d) $\\cot \\left(-1110^{\\circ}\\right)=-\\cot 1110^{\\circ}=-\\cot \\left[\\left(3 \\times 360^{\\circ}\\right)+30^{\\circ}\\right]=-\\cot 30^{\\circ}=-\\sqrt{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f5f0279619d9d8a1bed", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "If $\\tan \\theta=2$ and $\\theta$ lies in the third quadrant, then the value of $\\sec \\theta$ is", "image": null}, "options": [{"id": "zWHAZ", "text": "$-\\sqrt{5}$", "image": null, "isCorrect": true}, {"id": "JANwH", "text": "$\\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "FCvjx", "text": "$-\\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "aUPim", "text": "$\\sqrt{5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\sec ^{2} \\theta=1+(2)^{2}=5$\n$\\therefore \\sec \\theta=-\\sqrt{5}$ $\\quad\\quad\\left[\\because \\theta\\right.$ lies in $3^{\\text {nd }}$ quadrant. $]$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f510279619d9d8a1b7f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "If $\\sec \\theta=\\frac{13}{12}, \\theta$ lies in $4^{\\text {th }}$ quadrant, then $\\tan \\theta \\times \\operatorname{cosec} \\theta \\times \\sin \\theta \\times \\cos \\theta=$", "image": null}, "options": [{"id": "CcMNi", "text": "$\\frac{-5}{13}$", "image": null, "isCorrect": true}, {"id": "QpWyl", "text": "$\\frac{144}{169}$", "image": null, "isCorrect": false}, {"id": "PmfaQ", "text": "$\\frac{25}{169}$", "image": null, "isCorrect": false}, {"id": "zZnfz", "text": "$\\frac{5}{13}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\sec \\theta=\\frac{13}{12} \\Rightarrow \\cos \\theta=\\frac{12}{13}$\n$\\therefore \\sin \\theta=\\sqrt{1-\\frac{144}{169}}=-\\frac{5}{13} \\quad \\ldots\\left[\\theta\\right.$ lies in $4^{\\text {th }}$ quadrant $]$\n$\\tan \\theta=\\frac{\\left(\\frac{5}{13}\\right)}{\\left(\\frac{12}{13}\\right)}=\\frac{-5}{12}$ and $\\operatorname{cosec} \\theta=\\frac{-13}{5}$\n$\\therefore \\quad \\tan \\theta \\times \\operatorname{cosec} \\theta \\times \\sin \\theta \\times \\cos \\theta=\\left(\\frac{-5}{12}\\right) \\times\\left(\\frac{-13}{5}\\right) \\times\\left(\\frac{-5}{13}\\right)\\left(\\frac{12}{13}\\right)=\\frac{-5}{13}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f280279619d9d8a1a35", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "$\\tan 1^{\\circ} \\times \\tan 2^{\\circ} \\times \\tan 3^{\\circ} \\times \\cdots \\cdots \\cdots+\\cdots \\times \\tan 89^{\\circ}=$", "image": null}, "options": [{"id": "1md9d", "text": "$\\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "kNmHn", "text": "1", "image": null, "isCorrect": true}, {"id": "HbBI3", "text": "$\\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "VKzbi", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\tan 1^{\\circ} \\times \\tan 2^{\\circ} \\times \\tan 3^{\\circ} \\times \\ldots \\times \\tan 89^{\\circ}$\n$=\\left[\\tan 1^{\\circ} \\tan 2^{\\circ} \\tan 3^{\\circ} \\ldots \\tan 44^{\\circ}\\right]\\left(\\tan 45^{\\circ}\\right) \\times\\left[\\tan \\left(90^{\\circ}-44^{\\circ}\\right) \\cdot \\tan \\left(90^{\\circ}-43^{\\circ}\\right) \\ldots \\tan \\left(90^{\\circ}-1\\right)\\right]$\n$=\\left(\\tan 1^{\\circ} \\tan 2^{\\circ} \\ldots \\tan 44^{\\circ}\\right)\\left(\\cot 44^{\\circ} \\cot 43^{\\circ} \\ldots \\cot 1^{\\circ}\\right)$\n$=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a2634d0279619d9d8a3df9", "title": "Sum and Difference & Multiple angle Formula", "totalQuestions": 50, "questions": [{"_id": "6abb88d715a9fc0fc8c14774", "type": "singleCorrect", "question": {"text": "In $\\triangle ABC$, with usual notations, if $\\sin 2A + \\sin 2B = \\sin 2C$, then the type of the triangle is", "image": null}, "options": [{"id": "UI14h", "label": "A", "text": "Isosceles triangle", "isCorrect": false, "image": null}, {"id": "mNSGB", "label": "B", "text": "Equilateral triangle", "isCorrect": false, "image": null}, {"id": "o6l5y", "label": "C", "text": "Right angled triangle", "isCorrect": true, "image": null}, {"id": "j5j4b", "label": "D", "text": "Scalene triangle", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\sin 2A + \\sin 2B = \\sin 2C$<br><br>Using the sum-to-product formula on the left side:<br><br>$2 \\sin(A+B) \\cos(A-B) = 2 \\sin C \\cos C$<br><br>Since $A+B+C = \\pi$, we have $\\sin(A+B) = \\sin(\\pi - C) = \\sin C$. Substituting this into the equation:<br><br>$2 \\sin C \\cos(A-B) = 2 \\sin C \\cos C$<br><br>Since $C$ is an angle of a triangle, $0 < C < \\pi$, which implies $\\sin C \\neq 0$. Dividing both sides by $2 \\sin C$:<br><br>$\\cos(A-B) = \\cos C$<br><br>Using $C = \\pi - (A+B)$, we get $\\cos C = \\cos(\\pi - (A+B)) = -\\cos(A+B)$.<br><br>$\\cos(A-B) = -\\cos(A+B)$<br><br>$\\cos(A-B) + \\cos(A+B) = 0$<br><br>Expanding the terms or using the sum-to-product formula:<br><br>$2 \\cos A \\cos B = 0$<br><br>This implies that either $\\cos A = 0$ or $\\cos B = 0$.<br><br>Since $A$ and $B$ are angles of a triangle, either $A = \\dfrac{\\pi}{2}$ or $B = \\dfrac{\\pi}{2}$.<br><br>Therefore, the triangle is a right-angled triangle.<br><br>Answer: Right angled triangle", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b415a9fc0fc8c14637", "type": "singleCorrect", "question": {"text": "The value of the expression $\\cos\\left(\\dfrac{\\pi}{24}\\right)\\cos\\left(\\dfrac{\\pi}{12}\\right)\\cos\\left(\\dfrac{\\pi}{6}\\right)\\cos\\left(\\dfrac{\\pi}{3}\\right)$ is:", "image": null}, "options": [{"id": "ZpBlw", "label": "A", "text": "$\\dfrac{1}{16}\\sin\\left(\\dfrac{\\pi}{24}\\right)$", "isCorrect": false, "image": null}, {"id": "nGAWK", "label": "B", "text": "$\\dfrac{\\sqrt{3}}{32}\\csc\\left(\\dfrac{\\pi}{24}\\right)$", "isCorrect": true, "image": null}, {"id": "H9BAg", "label": "C", "text": "$\\dfrac{\\sqrt{3}}{16}$", "isCorrect": false, "image": null}, {"id": "2rxVu", "label": "D", "text": "$\\dfrac{1}{32}\\sec\\left(\\dfrac{\\pi}{12}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $E = \\cos\\left(\\dfrac{\\pi}{24}\\right)\\cos\\left(\\dfrac{\\pi}{12}\\right)\\cos\\left(\\dfrac{\\pi}{6}\\right)\\cos\\left(\\dfrac{\\pi}{3}\\right)$<br><br>This can be rewritten as:<br><br>$E = \\cos\\left(\\dfrac{\\pi}{24}\\right)\\cos\\left(2 \\times \\dfrac{\\pi}{24}\\right)\\cos\\left(2^2 \\times \\dfrac{\\pi}{24}\\right)\\cos\\left(2^3 \\times \\dfrac{\\pi}{24}\\right)$<br><br>Using the standard trigonometric identity $\\cos A \\cos 2A \\cos 2^2A \\dots \\cos 2^{n-1}A = \\dfrac{\\sin(2^n A)}{2^n \\sin A}$<br><br>Here $A = \\dfrac{\\pi}{24}$ and $n = 4$. Substituting these values, we get:<br><br>$E = \\dfrac{\\sin\\left(2^4 \\times \\dfrac{\\pi}{24}\\right)}{2^4 \\sin\\left(\\dfrac{\\pi}{24}\\right)}$<br><br>$E = \\dfrac{\\sin\\left(\\dfrac{16\\pi}{24}\\right)}{16 \\sin\\left(\\dfrac{\\pi}{24}\\right)}$<br><br>$E = \\dfrac{\\sin\\left(\\dfrac{2\\pi}{3}\\right)}{16 \\sin\\left(\\dfrac{\\pi}{24}\\right)}$<br><br>Since $\\sin\\left(\\dfrac{2\\pi}{3}\\right) = \\dfrac{\\sqrt{3}}{2}$:<br><br>$E = \\dfrac{\\dfrac{\\sqrt{3}}{2}}{16 \\sin\\left(\\dfrac{\\pi}{24}\\right)}$<br><br>$E = \\dfrac{\\sqrt{3}}{32} \\csc\\left(\\dfrac{\\pi}{24}\\right)$<br><br>Answer: $\\dfrac{\\sqrt{3}}{32}\\csc\\left(\\dfrac{\\pi}{24}\\right)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887415a9fc0fc8c143df", "type": "singleCorrect", "question": {"text": "In $\\Delta ABC$, $\\angle C = \\dfrac{2\\pi}{3}$, then the value of $\\cos^2 A + \\cos^2 B - \\cos A \\cos B$ is", "image": null}, "options": [{"id": "1fY6y", "label": "A", "text": "$\\dfrac{1}{4}$", "isCorrect": false, "image": null}, {"id": "CREPm", "label": "B", "text": "$\\dfrac{3}{4}$", "isCorrect": true, "image": null}, {"id": "7OPNR", "label": "C", "text": "$\\dfrac{5}{4}$", "isCorrect": false, "image": null}, {"id": "PBdDE", "label": "D", "text": "$\\dfrac{7}{4}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A + B + C = \\pi$ and $C = \\dfrac{2\\pi}{3}$, we have $A + B = \\dfrac{\\pi}{3}$.<br><br>The given expression is $\\cos^2 A + \\cos^2 B - \\cos A \\cos B$.<br><br>Using the identities $\\cos^2 A = \\dfrac{1 + \\cos 2A}{2}$ and $\\cos^2 B = \\dfrac{1 + \\cos 2B}{2}$, we get:<br><br>$\\cos^2 A + \\cos^2 B = 1 + \\dfrac{\\cos 2A + \\cos 2B}{2} = 1 + \\cos(A+B)\\cos(A-B)$<br><br>Also, using the product-to-sum formula:<br><br>$\\cos A \\cos B = \\dfrac{1}{2}[\\cos(A+B) + \\cos(A-B)]$<br><br>Substituting $\\cos(A+B) = \\cos\\left(\\dfrac{\\pi}{3}\\right) = \\dfrac{1}{2}$ into both expressions:<br><br>$\\cos^2 A + \\cos^2 B = 1 + \\dfrac{1}{2}\\cos(A-B)$<br><br>$\\cos A \\cos B = \\dfrac{1}{2}\\left[\\dfrac{1}{2} + \\cos(A-B)\\right] = \\dfrac{1}{4} + \\dfrac{1}{2}\\cos(A-B)$<br><br>Subtracting the second expression from the first:<br><br>$\\cos^2 A + \\cos^2 B - \\cos A \\cos B = 1 + \\dfrac{1}{2}\\cos(A-B) - \\left[\\dfrac{1}{4} + \\dfrac{1}{2}\\cos(A-B)\\right]$<br><br>$\\cos^2 A + \\cos^2 B - \\cos A \\cos B = 1 - \\dfrac{1}{4} = \\dfrac{3}{4}$<br><br>Answer: $\\dfrac{3}{4}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888415a9fc0fc8c14475", "type": "singleCorrect", "question": {"text": "$\\cos(4A) =$", "image": null}, "options": [{"id": "e4nJW", "label": "A", "text": "$1 + 8\\cos^2 A + 8\\cos^4 A$", "isCorrect": false, "image": null}, {"id": "9OJpb", "label": "B", "text": "$1 + 8\\cos^2 A - 8\\cos^4 A$", "isCorrect": false, "image": null}, {"id": "5dLgM", "label": "C", "text": "$1 - 8\\cos^2 A + 8\\cos^4 A$", "isCorrect": true, "image": null}, {"id": "kfLF5", "label": "D", "text": "$1 - 8\\cos^2 A - 8\\cos^4 A$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the double angle formula $\\cos(2\\theta) = 2\\cos^2 \\theta - 1$:<br><br>$\\cos(4A) = \\cos(2(2A))$<br><br>$\\cos(4A) = 2\\cos^2(2A) - 1$<br><br>Substituting $\\cos(2A) = 2\\cos^2 A - 1$:<br><br>$\\cos(4A) = 2(2\\cos^2 A - 1)^2 - 1$<br><br>Expanding the square:<br><br>$\\cos(4A) = 2(4\\cos^4 A - 4\\cos^2 A + 1) - 1$<br><br>$\\cos(4A) = 8\\cos^4 A - 8\\cos^2 A + 2 - 1$<br><br>$\\cos(4A) = 1 - 8\\cos^2 A + 8\\cos^4 A$<br><br>Answer: $1 - 8\\cos^2 A + 8\\cos^4 A$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886515a9fc0fc8c14349", "type": "singleCorrect", "question": {"text": "If $\\dfrac{\\cos A + \\sin A}{\\cos A - \\sin A} = \\cot(2A)$, where $A \\in \\left(0, \\dfrac{\\pi}{2}\\right) - \\left\\{\\dfrac{\\pi}{4}\\right\\}$, then the value of $A$ (in degrees) is...", "image": null}, "options": [{"id": "X12fl", "label": "A", "text": "$15$", "isCorrect": true, "image": null}, {"id": "nwKea", "label": "B", "text": "$22.5$", "isCorrect": false, "image": null}, {"id": "OXn2c", "label": "C", "text": "$30$", "isCorrect": false, "image": null}, {"id": "ifznQ", "label": "D", "text": "$60$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Dividing the numerator and denominator of the left hand side by $\\cos A$:<br><br>$\\dfrac{1 + \\tan A}{1 - \\tan A} = \\cot(2A)$<br><br>$\\tan\\left(\\dfrac{\\pi}{4} + A\\right) = \\tan\\left(\\dfrac{\\pi}{2} - 2A\\right)$<br><br>Equating the angles for the general solution:<br><br>$\\dfrac{\\pi}{4} + A = n\\pi + \\dfrac{\\pi}{2} - 2A$<br><br>$3A = n\\pi + \\dfrac{\\pi}{4}$<br><br>$A = \\dfrac{n\\pi}{3} + \\dfrac{\\pi}{12}$<br><br>For $n = 0$, $A = \\dfrac{\\pi}{12} = 15^{\\circ}$.<br><br>This value lies in the given interval $\\left(0, \\dfrac{\\pi}{2}\\right) - \\left\\{\\dfrac{\\pi}{4}\\right\\}$.<br><br>Answer: $15$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c415a9fc0fc8c146cd", "type": "singleCorrect", "question": {"text": "If $f(x) = \\sin x + \\cos x$, then which of the following is true?", "image": null}, "options": [{"id": "e6hu6", "label": "A", "text": "$f(130^\\circ) < 0$", "isCorrect": false, "image": null}, {"id": "al98k", "label": "B", "text": "$f(220^\\circ) > f(320^\\circ)$", "isCorrect": false, "image": null}, {"id": "QLO1O", "label": "C", "text": "$f(140^\\circ) = f(310^\\circ)$", "isCorrect": true, "image": null}, {"id": "GkgsX", "label": "D", "text": "$f(310^\\circ) > 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $f(x) = \\sin x + \\cos x$<br><br>Multiplying and dividing by $\\sqrt{2}$:<br><br>$f(x) = \\sqrt{2} \\left( \\dfrac{1}{\\sqrt{2}} \\sin x + \\dfrac{1}{\\sqrt{2}} \\cos x \\right) = \\sqrt{2} \\sin(x + 45^\\circ)$<br><br>Evaluating the given options:<br><br>$f(130^\\circ) = \\sqrt{2} \\sin(130^\\circ + 45^\\circ) = \\sqrt{2} \\sin 175^\\circ > 0$<br><br>$f(220^\\circ) = \\sqrt{2} \\sin(220^\\circ + 45^\\circ) = \\sqrt{2} \\sin 265^\\circ < 0$<br><br>$f(320^\\circ) = \\sqrt{2} \\sin(320^\\circ + 45^\\circ) = \\sqrt{2} \\sin 365^\\circ = \\sqrt{2} \\sin 5^\\circ > 0$<br><br>Thus, $f(220^\\circ) < f(320^\\circ)$<br><br>$f(140^\\circ) = \\sqrt{2} \\sin(140^\\circ + 45^\\circ) = \\sqrt{2} \\sin 185^\\circ = -\\sqrt{2} \\sin 5^\\circ$<br><br>$f(310^\\circ) = \\sqrt{2} \\sin(310^\\circ + 45^\\circ) = \\sqrt{2} \\sin 355^\\circ = -\\sqrt{2} \\sin 5^\\circ$<br><br>Thus, $f(140^\\circ) = f(310^\\circ)$<br><br>$f(310^\\circ) = -\\sqrt{2} \\sin 5^\\circ < 0$<br><br>Therefore, only $f(140^\\circ) = f(310^\\circ)$ is true.<br><br>Answer: $f(140^\\circ) = f(310^\\circ)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ac8c30a4553e1bdb99", "type": "singleCorrect", "question": {"text": "If $x + y = \\dfrac{\\pi}{4}$, then $(1 + \\tan x)(1 + \\tan y) =$", "image": null}, "options": [{"id": "mpX5U", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "SXnhm", "label": "B", "text": "$2$", "isCorrect": true, "image": null}, {"id": "tihoe", "label": "C", "text": "$3$", "isCorrect": false, "image": null}, {"id": "cL7b8", "label": "D", "text": "$0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $x + y = \\dfrac{\\pi}{4}$<br><br>Taking $\\tan$ on both sides:<br><br>$\\tan(x + y) = \\tan\\left(\\dfrac{\\pi}{4}\\right)$<br><br>$\\dfrac{\\tan x + \\tan y}{1 - \\tan x \\tan y} = 1$<br><br>$\\tan x + \\tan y = 1 - \\tan x \\tan y$<br><br>$\\tan x + \\tan y + \\tan x \\tan y = 1$<br><br>Adding $1$ to both sides:<br><br>$1 + \\tan x + \\tan y + \\tan x \\tan y = 2$<br><br>$(1 + \\tan x)(1 + \\tan y) = 2$<br><br>Answer: $2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3588c30a4553e1be2c1", "type": "singleCorrect", "question": {"text": "If $\\sec^{-1}\\left(\\dfrac{x^2 + y^2}{x^2 - y^2}\\right) = 2a$ such that $y\\dfrac{dy}{dx} = x \\cdot f(a)$ then the value of $f\\left(\\dfrac{2\\pi}{3}\\right)$ is", "image": null}, "options": [{"id": "Tioo4", "label": "A", "text": "$-3$", "isCorrect": false, "image": null}, {"id": "VJRFy", "label": "B", "text": "$\\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "3pljQ", "label": "C", "text": "$3$", "isCorrect": true, "image": null}, {"id": "AnlYs", "label": "D", "text": "$\\dfrac{1}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\sec^{-1}\\left(\\dfrac{x^2 + y^2}{x^2 - y^2}\\right) = 2a$<br><br>$\\Rightarrow \\dfrac{x^2 + y^2}{x^2 - y^2} = \\sec(2a)$<br><br>Applying componendo and dividendo:<br><br>$\\dfrac{(x^2 + y^2) - (x^2 - y^2)}{(x^2 + y^2) + (x^2 - y^2)} = \\dfrac{\\sec(2a) - 1}{\\sec(2a) + 1}$<br><br>$\\Rightarrow \\dfrac{2y^2}{2x^2} = \\dfrac{\\dfrac{1}{\\cos(2a)} - 1}{\\dfrac{1}{\\cos(2a)} + 1}$<br><br>$\\Rightarrow \\dfrac{y^2}{x^2} = \\dfrac{1 - \\cos(2a)}{1 + \\cos(2a)}$<br><br>$\\Rightarrow \\dfrac{y^2}{x^2} = \\dfrac{2\\sin^2(a)}{2\\cos^2(a)} = \\tan^2(a)$<br><br>$\\Rightarrow y^2 = x^2 \\tan^2(a)$<br><br>Differentiating both sides with respect to $x$:<br><br>$2y \\dfrac{dy}{dx} = 2x \\tan^2(a)$<br><br>$\\Rightarrow y \\dfrac{dy}{dx} = x \\tan^2(a)$<br><br>Comparing with $y \\dfrac{dy}{dx} = x \\cdot f(a)$, we get:<br><br>$f(a) = \\tan^2(a)$<br><br>Substituting $a = \\dfrac{2\\pi}{3}$:<br><br>$f\\left(\\dfrac{2\\pi}{3}\\right) = \\tan^2\\left(\\dfrac{2\\pi}{3}\\right) = (-\\sqrt{3})^2 = 3$<br><br>Answer: $3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3558c30a4553e1be2a1", "type": "singleCorrect", "question": {"text": "The value of $\\cos 15^\\circ - \\sin 15^\\circ$ is ......", "image": null}, "options": [{"id": "wR7y6", "label": "A", "text": "$\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "ZkZqY", "label": "B", "text": "$-\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "3knZG", "label": "C", "text": "$\\dfrac{1}{\\sqrt{2}}$", "isCorrect": true, "image": null}, {"id": "p5qqJ", "label": "D", "text": "$-\\dfrac{1}{\\sqrt{2}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given expression is $\\cos 15^\\circ - \\sin 15^\\circ$.<br><br>Multiplying and dividing by $\\sqrt{2}$, we get:<br><br>$\\sqrt{2} \\left( \\dfrac{1}{\\sqrt{2}} \\cos 15^\\circ - \\dfrac{1}{\\sqrt{2}} \\sin 15^\\circ \\right)$<br><br>Substituting $\\dfrac{1}{\\sqrt{2}} = \\cos 45^\\circ = \\sin 45^\\circ$:<br><br>$\\sqrt{2} (\\cos 45^\\circ \\cos 15^\\circ - \\sin 45^\\circ \\sin 15^\\circ)$<br><br>Using the identity $\\cos A \\cos B - \\sin A \\sin B = \\cos(A + B)$:<br><br>$\\sqrt{2} \\cos(45^\\circ + 15^\\circ)$<br><br>$\\sqrt{2} \\cos 60^\\circ$<br><br>$\\sqrt{2} \\times \\dfrac{1}{2} = \\dfrac{1}{\\sqrt{2}}$<br><br>Answer: $\\dfrac{1}{\\sqrt{2}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32a8c30a4553e1be0df", "type": "singleCorrect", "question": {"text": "In $\\triangle ABC$, if $\\angle C = \\dfrac{\\pi}{3}$, then the value of $\\cos^2 A + \\cos^2 B + \\cos A\\cos B$ is...", "image": null}, "options": [{"id": "Xfddh", "label": "A", "text": "$\\dfrac{3}{4}$", "isCorrect": true, "image": null}, {"id": "vLJHo", "label": "B", "text": "$\\dfrac{5}{4}$", "isCorrect": false, "image": null}, {"id": "DJ7Wq", "label": "C", "text": "$\\dfrac{-3}{4}$", "isCorrect": false, "image": null}, {"id": "MNJQ4", "label": "D", "text": "$\\dfrac{-5}{4}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $A + B + C = \\pi$ and $C = \\dfrac{\\pi}{3}$, we have $A + B = \\dfrac{2\\pi}{3}$.<br><br>The given expression is $\\cos^2 A + \\cos^2 B + \\cos A\\cos B$.<br><br>Using the identity $\\cos^2 A + \\cos^2 B = 1 + \\dfrac{\\cos 2A + \\cos 2B}{2}$, we get:<br><br>$\\cos^2 A + \\cos^2 B = 1 + \\cos(A+B)\\cos(A-B)$<br><br>Also, using the product-to-sum formula:<br><br>$\\cos A\\cos B = \\dfrac{\\cos(A+B) + \\cos(A-B)}{2}$<br><br>Substituting these into the expression, we get:<br><br>$1 + \\cos(A+B)\\cos(A-B) + \\dfrac{\\cos(A+B) + \\cos(A-B)}{2}$<br><br>Since $A + B = \\dfrac{2\\pi}{3}$, we have $\\cos(A+B) = \\cos\\left(\\dfrac{2\\pi}{3}\\right) = -\\dfrac{1}{2}$.<br><br>Substituting $\\cos(A+B) = -\\dfrac{1}{2}$ into the expression:<br><br>$1 - \\dfrac{1}{2}\\cos(A-B) + \\dfrac{-\\dfrac{1}{2} + \\cos(A-B)}{2}$<br><br>$= 1 - \\dfrac{1}{2}\\cos(A-B) - \\dfrac{1}{4} + \\dfrac{1}{2}\\cos(A-B)$<br><br>$= 1 - \\dfrac{1}{4} = \\dfrac{3}{4}$<br><br>Answer: $\\dfrac{3}{4}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c98c30a4553e1bdcc5", "type": "singleCorrect", "question": {"text": "If $\\cos 43^\\circ + \\sin 43^\\circ = k^3$, then $\\cos 2^\\circ = \\ldots$", "image": null}, "options": [{"id": "PgTwJ", "label": "A", "text": "$-\\dfrac{k^3}{\\sqrt{2}}$", "isCorrect": false, "image": null}, {"id": "Mbjss", "label": "B", "text": "$\\dfrac{k^3}{\\sqrt{2}}$", "isCorrect": true, "image": null}, {"id": "fsBpy", "label": "C", "text": "$-\\dfrac{k^3}{\\sqrt{3}}$", "isCorrect": false, "image": null}, {"id": "HhFoD", "label": "D", "text": "$\\dfrac{k^3}{\\sqrt{3}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\cos 43^\\circ + \\sin 43^\\circ = k^3$<br><br>Multiplying and dividing the LHS by $\\sqrt{2}$:<br><br>$\\sqrt{2} \\left( \\dfrac{1}
