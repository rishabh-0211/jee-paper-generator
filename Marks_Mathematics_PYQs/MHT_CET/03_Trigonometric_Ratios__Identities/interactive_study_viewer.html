{\\sqrt{2}} \\cos 43^\\circ + \\dfrac{1}{\\sqrt{2}} \\sin 43^\\circ \\right) = k^3$<br><br>$\\sqrt{2} (\\sin 45^\\circ \\cos 43^\\circ + \\cos 45^\\circ \\sin 43^\\circ) = k^3$<br><br>Using the identity $\\sin A \\cos B + \\cos A \\sin B = \\sin(A + B)$:<br><br>$\\sqrt{2} \\sin(45^\\circ + 43^\\circ) = k^3$<br><br>$\\sqrt{2} \\sin 88^\\circ = k^3$<br><br>Since $\\sin \\theta = \\cos(90^\\circ - \\theta)$:<br><br>$\\sqrt{2} \\cos(90^\\circ - 88^\\circ) = k^3$<br><br>$\\sqrt{2} \\cos 2^\\circ = k^3$<br><br>$\\cos 2^\\circ = \\dfrac{k^3}{\\sqrt{2}}$<br><br>Answer: $\\dfrac{k^3}{\\sqrt{2}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d78c30a4553e1bdd5b", "type": "singleCorrect", "question": {"text": "The value of $\\cos(60^\\circ - A)\\cdot\\cos A\\cdot\\cos(60^\\circ + A)$ is", "image": null}, "options": [{"id": "jEhLP", "label": "A", "text": "$\\dfrac{1}{4}\\cos 3A$", "isCorrect": true, "image": null}, {"id": "xjV1I", "label": "B", "text": "$\\sin 3A$", "isCorrect": false, "image": null}, {"id": "BNg4s", "label": "C", "text": "$\\cos 3A$", "isCorrect": false, "image": null}, {"id": "hjkmT", "label": "D", "text": "$\\dfrac{1}{4}\\sin 3A$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the identity $\\cos(x - y)\\cos(x + y) = \\cos^2 x - \\sin^2 y$<br><br>$\\cos(60^\\circ - A)\\cos(60^\\circ + A) = \\cos^2 60^\\circ - \\sin^2 A$<br><br>$= \\dfrac{1}{4} - \\sin^2 A$<br><br>Multiplying by $\\cos A$<br><br>$\\cos A \\left( \\dfrac{1}{4} - \\sin^2 A \\right) = \\dfrac{1}{4} \\cos A - \\cos A (1 - \\cos^2 A)$<br><br>$= \\cos^3 A - \\dfrac{3}{4} \\cos A$<br><br>$= \\dfrac{4\\cos^3 A - 3\\cos A}{4}$<br><br>$= \\dfrac{1}{4} \\cos 3A$<br><br>Answer: $\\dfrac{1}{4}\\cos 3A$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33c8c30a4553e1be19c", "type": "singleCorrect", "question": {"text": "The value of $\\dfrac{\\sin^2 3A}{\\sin^2 A} - \\dfrac{\\cos^2 3A}{\\cos^2 A}$ is", "image": null}, "options": [{"id": "fOlwR", "label": "A", "text": "$\\cos 2A$", "isCorrect": false, "image": null}, {"id": "56Iwj", "label": "B", "text": "$8\\cos 2A$", "isCorrect": true, "image": null}, {"id": "3QWcM", "label": "C", "text": "$\\dfrac{1}{8}\\cos 2A$", "isCorrect": false, "image": null}, {"id": "rwBRD", "label": "D", "text": "$\\dfrac{1}{2}\\sin 2A$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the multiple angle formulas $\\sin 3A = 3\\sin A - 4\\sin^3 A$ and $\\cos 3A = 4\\cos^3 A - 3\\cos A$.<br><br>$\\dfrac{\\sin 3A}{\\sin A} = 3 - 4\\sin^2 A$<br><br>$\\dfrac{\\cos 3A}{\\cos A} = 4\\cos^2 A - 3$<br><br>Substituting these into the given expression:<br><br>$\\left(\\dfrac{\\sin 3A}{\\sin A}\\right)^2 - \\left(\\dfrac{\\cos 3A}{\\cos A}\\right)^2 = (3 - 4\\sin^2 A)^2 - (4\\cos^2 A - 3)^2$<br><br>Expanding the squares:<br><br>$= (9 - 24\\sin^2 A + 16\\sin^4 A) - (16\\cos^4 A - 24\\cos^2 A + 9)$<br><br>$= 16(\\sin^4 A - \\cos^4 A) - 24(\\sin^2 A - \\cos^2 A)$<br><br>Using $a^2 - b^2 = (a-b)(a+b)$ and $\\sin^2 A + \\cos^2 A = 1$:<br><br>$= 16(\\sin^2 A - \\cos^2 A)(\\sin^2 A + \\cos^2 A) - 24(\\sin^2 A - \\cos^2 A)$<br><br>$= 16(\\sin^2 A - \\cos^2 A)(1) - 24(\\sin^2 A - \\cos^2 A)$<br><br>$= -8(\\sin^2 A - \\cos^2 A)$<br><br>$= 8(\\cos^2 A - \\sin^2 A)$<br><br>Since $\\cos^2 A - \\sin^2 A = \\cos 2A$, the expression simplifies to:<br><br>$= 8\\cos 2A$<br><br>Answer: $8\\cos 2A$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31e8c30a4553e1be059", "type": "singleCorrect", "question": {"text": "In $\\triangle ABC$, with the usual notations, $\\angle C = 90^\\circ$, then $\\sin(A - B)$ is equal to....", "image": null}, "options": [{"id": "pNrdk", "label": "A", "text": "$\\dfrac{a^2 + b^2}{a^2 - b^2}$", "isCorrect": false, "image": null}, {"id": "iZaHQ", "label": "B", "text": "$\\dfrac{a^2 + c^2}{a^2 - c^2}$", "isCorrect": false, "image": null}, {"id": "hxurP", "label": "C", "text": "$\\dfrac{b^2 + c^2}{b^2 - c^2}$", "isCorrect": false, "image": null}, {"id": "c0d3L", "label": "D", "text": "$\\dfrac{a^2 - b^2}{a^2 + b^2}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "In $\\triangle ABC$, $\\angle C = 90^\\circ$.<br><br>Using trigonometric ratios in a right-angled triangle:<br><br>$\\sin A = \\dfrac{a}{c}$<br><br>$\\cos A = \\dfrac{b}{c}$<br><br>$\\sin B = \\dfrac{b}{c}$<br><br>$\\cos B = \\dfrac{a}{c}$<br><br>Using the expansion formula for $\\sin(A - B)$:<br><br>$\\sin(A - B) = \\sin A \\cos B - \\cos A \\sin B$<br><br>Substituting the values:<br><br>$\\sin(A - B) = \\left(\\dfrac{a}{c}\\right)\\left(\\dfrac{a}{c}\\right) - \\left(\\dfrac{b}{c}\\right)\\left(\\dfrac{b}{c}\\right)$<br><br>$\\sin(A - B) = \\dfrac{a^2 - b^2}{c^2}$<br><br>By Pythagoras theorem in $\\triangle ABC$, $c^2 = a^2 + b^2$.<br><br>Substituting $c^2 = a^2 + b^2$:<br><br>$\\sin(A - B) = \\dfrac{a^2 - b^2}{a^2 + b^2}$<br><br>Answer: $\\dfrac{a^2 - b^2}{a^2 + b^2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31c8c30a4553e1be049", "type": "singleCorrect", "question": {"text": "If $P = \\tan 20^\\circ$, then the value of $\\dfrac{\\tan 160^\\circ - \\tan 110^\\circ}{1 + \\tan 160^\\circ \\tan 110^\\circ}$ in terms of $P$, is...", "image": null}, "options": [{"id": "q157U", "label": "A", "text": "$\\dfrac{1+P^2}{2P^2}$", "isCorrect": false, "image": null}, {"id": "rKyyZ", "label": "B", "text": "$\\dfrac{1+P^2}{2P}$", "isCorrect": false, "image": null}, {"id": "8snmC", "label": "C", "text": "$\\dfrac{1-P^2}{2P^2}$", "isCorrect": false, "image": null}, {"id": "AmnA1", "label": "D", "text": "$\\dfrac{1-P^2}{2P}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "We have $P = \\tan 20^{\\circ}$.<br><br>Expressing the terms in the given expression using $20^{\\circ}$:<br><br>$\\tan 160^{\\circ} = \\tan(180^{\\circ} - 20^{\\circ}) = -\\tan 20^{\\circ} = -P$<br><br>$\\tan 110^{\\circ} = \\tan(90^{\\circ} + 20^{\\circ}) = -\\cot 20^{\\circ} = -\\dfrac{1}{\\tan 20^{\\circ}} = -\\dfrac{1}{P}$<br><br>Substituting these values into the given expression:<br><br>$\\dfrac{\\tan 160^{\\circ} - \\tan 110^{\\circ}}{1 + \\tan 160^{\\circ} \\tan 110^{\\circ}} = \\dfrac{-P - \\left(-\\dfrac{1}{P}\\right)}{1 + (-P)\\left(-\\dfrac{1}{P}\\right)}$<br><br>$= \\dfrac{\\dfrac{1}{P} - P}{1 + 1}$<br><br>$= \\dfrac{\\dfrac{1 - P^2}{P}}{2}$<br><br>$= \\dfrac{1 - P^2}{2P}$<br><br>Answer: $\\dfrac{1-P^2}{2P}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a08c30a4553e1bdb14", "type": "singleCorrect", "question": {"text": "If $\\sin 3\\alpha = 4\\sin\\alpha \\cdot \\sin(x+\\alpha) \\cdot \\sin(x-\\alpha)$ where $\\alpha \\neq n\\pi, n \\in Z$, then all possible values of $x$ are given as", "image": null}, "options": [{"id": "iDLq5", "label": "A", "text": "$x = n\\pi \\pm \\dfrac{\\pi}{3}, n \\in Z$", "isCorrect": true, "image": null}, {"id": "AKRP3", "label": "B", "text": "$x = n\\pi \\pm \\dfrac{\\pi}{4}, n \\in Z$", "isCorrect": false, "image": null}, {"id": "TjiJf", "label": "C", "text": "$x = n\\pi \\pm \\dfrac{\\pi}{6}, n \\in Z$", "isCorrect": false, "image": null}, {"id": "J5kAN", "label": "D", "text": "$x = n\\pi \\pm \\dfrac{\\pi}{2}, n \\in Z$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given equation is $\\sin 3\\alpha = 4\\sin\\alpha \\cdot \\sin(x+\\alpha) \\cdot \\sin(x-\\alpha)$<br><br>Using the identities $\\sin 3\\alpha = 3\\sin\\alpha - 4\\sin^3\\alpha$ and $\\sin(A+B)\\sin(A-B) = \\sin^2 A - \\sin^2 B$, we get:<br><br>$3\\sin\\alpha - 4\\sin^3\\alpha = 4\\sin\\alpha(\\sin^2 x - \\sin^2\\alpha)$<br><br>$3\\sin\\alpha - 4\\sin^3\\alpha = 4\\sin\\alpha \\sin^2 x - 4\\sin^3\\alpha$<br><br>$3\\sin\\alpha = 4\\sin\\alpha \\sin^2 x$<br><br>Since $\\alpha \\neq n\\pi$, $\\sin\\alpha \\neq 0$. Dividing both sides by $\\sin\\alpha$, we get:<br><br>$3 = 4\\sin^2 x$<br><br>$\\sin^2 x = \\dfrac{3}{4}$<br><br>$\\sin^2 x = \\left(\\dfrac{\\sqrt{3}}{2}\\right)^2$<br><br>$\\sin^2 x = \\sin^2\\left(\\dfrac{\\pi}{3}\\right)$<br><br>The general solution is $x = n\\pi \\pm \\dfrac{\\pi}{3}, n \\in Z$.<br><br>Answer: $x = n\\pi \\pm \\dfrac{\\pi}{3}, n \\in Z$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29e8c30a4553e1bdb03", "type": "singleCorrect", "question": {"text": "If $\\cos(\\theta-\\alpha)=a$ and $\\sin(\\theta-\\beta)=b$, then the value of $\\cos^2(\\alpha-\\beta)+2ab\\sin(\\alpha-\\beta)+\\cos^2(\\theta-\\alpha)$ is...", "image": null}, "options": [{"id": "oXCHQ", "label": "A", "text": "$a^2 - 2b^2$", "isCorrect": false, "image": null}, {"id": "MR53X", "label": "B", "text": "$a^2 + 2b^2$", "isCorrect": false, "image": null}, {"id": "8sCSJ", "label": "C", "text": "$2a^2 - b^2$", "isCorrect": false, "image": null}, {"id": "1OfB3", "label": "D", "text": "$2a^2 + b^2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $x = \\theta - \\alpha$ and $y = \\theta - \\beta$.<br><br>Given $\\cos x = a$ and $\\sin y = b$.<br><br>We can write $\\alpha - \\beta = (\\theta - \\beta) - (\\theta - \\alpha) = y - x$.<br><br>Using the trigonometric expansion formulas:<br><br>$\\cos(\\alpha - \\beta) = \\cos(y - x) = \\cos y \\cos x + \\sin y \\sin x = a \\cos y + b \\sin x$<br><br>$\\sin(\\alpha - \\beta) = \\sin(y - x) = \\sin y \\cos x - \\cos y \\sin x = ab - \\cos y \\sin x$<br><br>Substituting these into the given expression $\\cos^2(\\alpha-\\beta)+2ab\\sin(\\alpha-\\beta)+\\cos^2(\\theta-\\alpha)$:<br><br>$(a \\cos y + b \\sin x)^2 + 2ab(ab - \\cos y \\sin x) + a^2$<br><br>Expanding the terms, we get:<br><br>$a^2 \\cos^2 y + b^2 \\sin^2 x + 2ab \\cos y \\sin x + 2a^2b^2 - 2ab \\cos y \\sin x + a^2$<br><br>Canceling $2ab \\cos y \\sin x$ and expressing $\\cos^2 y$ and $\\sin^2 x$ in terms of $a$ and $b$:<br><br>$a^2(1 - \\sin^2 y) + b^2(1 - \\cos^2 x) + 2a^2b^2 + a^2$<br><br>Since $\\sin y = b$ and $\\cos x = a$, this becomes:<br><br>$a^2(1 - b^2) + b^2(1 - a^2) + 2a^2b^2 + a^2$<br><br>$a^2 - a^2b^2 + b^2 - a^2b^2 + 2a^2b^2 + a^2$<br><br>Simplifying the expression, the terms with $a^2b^2$ cancel out:<br><br>$a^2 + b^2 + a^2 = 2a^2 + b^2$<br><br>Answer: $2a^2 + b^2$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3768c30a4553e1be3fd", "type": "singleCorrect", "question": {"text": "$\\tan 105^\\circ = $ ......", "image": null}, "options": [{"id": "6D5PF", "label": "A", "text": "$\\dfrac{\\sqrt{3} - 1}{2\\sqrt{2}}$", "isCorrect": false, "image": null}, {"id": "ystrI", "label": "B", "text": "$\\dfrac{\\sqrt{3} + 1}{2\\sqrt{2}}$", "isCorrect": false, "image": null}, {"id": "EFBy1", "label": "C", "text": "$\\dfrac{1 + \\sqrt{3}}{1 - \\sqrt{3}}$", "isCorrect": true, "image": null}, {"id": "eY1ox", "label": "D", "text": "$\\dfrac{2\\sqrt{2}}{\\sqrt{3} + 1}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "$\\tan 105^\\circ = \\tan(60^\\circ + 45^\\circ)$<br><br>Using the identity $\\tan(A + B) = \\dfrac{\\tan A + \\tan B}{1 - \\tan A \\tan B}$<br><br>Substituting $A = 60^\\circ$ and $B = 45^\\circ$:<br><br>$\\tan 105^\\circ = \\dfrac{\\tan 60^\\circ + \\tan 45^\\circ}{1 - \\tan 60^\\circ \\tan 45^\\circ}$<br><br>Since $\\tan 60^\\circ = \\sqrt{3}$ and $\\tan 45^\\circ = 1$:<br><br>$\\tan 105^\\circ = \\dfrac{\\sqrt{3} + 1}{1 - \\sqrt{3}(1)} = \\dfrac{1 + \\sqrt{3}}{1 - \\sqrt{3}}$<br><br>Answer: $\\dfrac{1 + \\sqrt{3}}{1 - \\sqrt{3}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3658c30a4553e1be346", "type": "singleCorrect", "question": {"text": "In $\\Delta ABC$, if $\\angle A = 90^\\circ$, then $\\sin(B - C) = $", "image": null}, "options": [{"id": "TYS6O", "label": "A", "text": "$\\dfrac{a^2 - c^2}{a^2 + c^2}$", "isCorrect": false, "image": null}, {"id": "yJBkB", "label": "B", "text": "$\\dfrac{c^2 - a^2}{c^2 + a^2}$", "isCorrect": false, "image": null}, {"id": "eWr7S", "label": "C", "text": "$\\dfrac{b^2 - c^2}{b^2 + c^2}$", "isCorrect": true, "image": null}, {"id": "bEh0q", "label": "D", "text": "$\\dfrac{c^2 - b^2}{c^2 + b^2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $\\angle A = 90^\\circ$, $\\Delta ABC$ is a right-angled triangle with hypotenuse $a$.<br><br>From the properties of a right-angled triangle, $\\sin B = \\dfrac{b}{a}$, $\\cos B = \\dfrac{c}{a}$, $\\sin C = \\dfrac{c}{a}$, and $\\cos C = \\dfrac{b}{a}$.<br><br>Using the expansion formula for sine:<br><br>$\\sin(B - C) = \\sin B \\cos C - \\cos B \\sin C$<br><br>Substituting the trigonometric ratios:<br><br>$\\sin(B - C) = \\left(\\dfrac{b}{a}\\right)\\left(\\dfrac{b}{a}\\right) - \\left(\\dfrac{c}{a}\\right)\\left(\\dfrac{c}{a}\\right)$<br><br>$\\sin(B - C) = \\dfrac{b^2 - c^2}{a^2}$<br><br>Using Pythagoras theorem, $a^2 = b^2 + c^2$.<br><br>Therefore, $\\sin(B - C) = \\dfrac{b^2 - c^2}{b^2 + c^2}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3638c30a4553e1be337", "type": "singleCorrect", "question": {"text": "The value of $\\cos^2 10^\\circ - \\cos 10^\\circ \\cos 50^\\circ + \\cos^2 50^\\circ$ is equal to....", "image": null}, "options": [{"id": "0ZFkl", "label": "A", "text": "$\\dfrac{1}{4}$", "isCorrect": false, "image": null}, {"id": "FlBtj", "label": "B", "text": "$\\dfrac{1}{2}$", "isCorrect": false, "image": null}, {"id": "HPGEl", "label": "C", "text": "$\\dfrac{3}{4}$", "isCorrect": true, "image": null}, {"id": "aQXw1", "label": "D", "text": "$1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given expression: $\\cos^2 10^\\circ - \\cos 10^\\circ \\cos 50^\\circ + \\cos^2 50^\\circ$<br><br>Multiplying and dividing by $2$:<br><br>$= \\dfrac{1}{2} [ 2\\cos^2 10^\\circ - 2\\cos 10^\\circ \\cos 50^\\circ + 2\\cos^2 50^\\circ ]$<br><br>Using the identities $2\\cos^2 \\theta = 1 + \\cos 2\\theta$ and $2\\cos A \\cos B = \\cos(A+B) + \\cos(A-B)$:<br><br>$= \\dfrac{1}{2} [ (1 + \\cos 20^\\circ) - (\\cos 60^\\circ + \\cos 40^\\circ) + (1 + \\cos 100^\\circ) ]$<br><br>Substituting $\\cos 60^\\circ = \\dfrac{1}{2}$:<br><br>$= \\dfrac{1}{2} \\left[ 1 + \\cos 20^\\circ - \\dfrac{1}{2} - \\cos 40^\\circ + 1 + \\cos 100^\\circ \\right]$<br><br>$= \\dfrac{1}{2} \\left[ \\dfrac{3}{2} + (\\cos 100^\\circ + \\cos 20^\\circ) - \\cos 40^\\circ \\right]$<br><br>Applying the sum-to-product formula $\\cos C + \\cos D = 2\\cos\\left(\\dfrac{C+D}{2}\\right)\\cos\\left(\\dfrac{C-D}{2}\\right)$:<br><br>$\\cos 100^\\circ + \\cos 20^\\circ = 2\\cos 60^\\circ \\cos 40^\\circ = 2 \\left(\\dfrac{1}{2}\\right) \\cos 40^\\circ = \\cos 40^\\circ$<br><br>Substituting this back into the expression:<br><br>$= \\dfrac{1}{2} \\left[ \\dfrac{3}{2} + \\cos 40^\\circ - \\cos 40^\\circ \\right]$<br><br>$= \\dfrac{1}{2} \\left( \\dfrac{3}{2} \\right) = \\dfrac{3}{4}$<br><br>Answer: $\\dfrac{3}{4}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c04bf9280d7f9932e82", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\begin{aligned} & \\text { If } \\sin (\\alpha+\\beta)=1, \\sin (\\alpha-\\beta)=\\frac{1}{2}, \\alpha, \\beta \\in\\left[0, \\frac{\\pi}{2}\\right] \\\\ & \\text { then } \\tan (\\alpha+2 \\beta) \\cdot \\tan (2 \\alpha+\\beta)=\\end{aligned}$", "image": null}, "options": [{"id": "dyJWP", "text": "1", "image": null, "isCorrect": true}, {"id": "XnOLC", "text": "-1", "image": null, "isCorrect": false}, {"id": "NJtNs", "text": "0", "image": null, "isCorrect": false}, {"id": "7CxAl", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\sin(\\alpha+\\beta) = 1$ and $\\alpha, \\beta \\in \\left[0, \\dfrac{\\pi}{2}\\right]$, we have $\\alpha+\\beta = \\dfrac{\\pi}{2}$.<br><br>Given $\\sin(\\alpha-\\beta) = \\dfrac{1}{2}$, we have $\\alpha-\\beta = \\dfrac{\\pi}{6}$.<br><br>Adding the two equations gives $2\\alpha = \\dfrac{2\\pi}{3} \\Rightarrow \\alpha = \\dfrac{\\pi}{3}$.<br><br>Subtracting the two equations gives $2\\beta = \\dfrac{\\pi}{3} \\Rightarrow \\beta = \\dfrac{\\pi}{6}$.<br><br>We need to find $\\tan(\\alpha+2\\beta) \\cdot \\tan(2\\alpha+\\beta)$.<br><br>Substituting the values of $\\alpha$ and $\\beta$:<br><br>$\\alpha+2\\beta = \\dfrac{\\pi}{3} + 2\\left(\\dfrac{\\pi}{6}\\right) = \\dfrac{2\\pi}{3}$<br><br>$2\\alpha+\\beta = 2\\left(\\dfrac{\\pi}{3}\\right) + \\dfrac{\\pi}{6} = \\dfrac{5\\pi}{6}$<br><br>$\\tan(\\alpha+2\\beta) \\cdot \\tan(2\\alpha+\\beta) = \\tan\\left(\\dfrac{2\\pi}{3}\\right) \\cdot \\tan\\left(\\dfrac{5\\pi}{6}\\right)$<br><br>$= (-\\sqrt{3}) \\cdot \\left(-\\dfrac{1}{\\sqrt{3}}\\right) = 1$<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf2bf9280d7f9932deb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The value of $\\tan \\frac{\\pi}{3}+2 \\tan \\frac{2 \\pi}{3}+4 \\tan \\frac{4 \\pi}{3}+8 \\tan \\frac{8 \\pi}{3}$ is equal to", "image": null}, "options": [{"id": "LqQbq", "text": "$-5 \\sqrt{3}$", "image": null, "isCorrect": true}, {"id": "pwsVs", "text": "$5 \\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "Ti4wT", "text": "$-10 \\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "ZDWFv", "text": "$15 \\sqrt{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The values of the trigonometric terms are evaluated as follows:<br><br>$\\tan \\dfrac{\\pi}{3} = \\sqrt{3}$<br><br>$\\tan \\dfrac{2 \\pi}{3} = \\tan \\left(\\pi - \\dfrac{\\pi}{3}\\right) = -\\tan \\dfrac{\\pi}{3} = -\\sqrt{3}$<br><br>$\\tan \\dfrac{4 \\pi}{3} = \\tan \\left(\\pi + \\dfrac{\\pi}{3}\\right) = \\tan \\dfrac{\\pi}{3} = \\sqrt{3}$<br><br>$\\tan \\dfrac{8 \\pi}{3} = \\tan \\left(2\\pi + \\dfrac{2\\pi}{3}\\right) = \\tan \\dfrac{2\\pi}{3} = -\\sqrt{3}$<br><br>Substituting these values into the given expression:<br><br>$\\tan \\dfrac{\\pi}{3} + 2 \\tan \\dfrac{2 \\pi}{3} + 4 \\tan \\dfrac{4 \\pi}{3} + 8 \\tan \\dfrac{8 \\pi}{3}$<br><br>$= \\sqrt{3} + 2(-\\sqrt{3}) + 4(\\sqrt{3}) + 8(-\\sqrt{3})$<br><br>$= \\sqrt{3} - 2\\sqrt{3} + 4\\sqrt{3} - 8\\sqrt{3}$<br><br>$= (1 - 2 + 4 - 8)\\sqrt{3}$<br><br>$= -5\\sqrt{3}$<br><br>Answer: $-5 \\sqrt{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc5bf9280d7f9932c43", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\cos ^4 \\frac{\\pi}{8}+\\cos ^4 \\frac{3 \\pi}{8}+\\cos ^4 \\frac{5 \\pi}{8}+\\cos ^4 \\frac{7 \\pi}{8}=$", "image": null}, "options": [{"id": "WbRj9", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "6NM0u", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": true}, {"id": "yynPV", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "RP3gu", "text": "$\\frac{3}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given expression is $\\cos^4 \\dfrac{\\pi}{8} + \\cos^4 \\dfrac{3\\pi}{8} + \\cos^4 \\dfrac{5\\pi}{8} + \\cos^4 \\dfrac{7\\pi}{8}$.<br><br>Using the property $\\cos(\\pi - \\theta) = -\\cos \\theta$, we have:<br>$\\cos \\dfrac{7\\pi}{8} = \\cos\\left(\\pi - \\dfrac{\\pi}{8}\\right) = -\\cos \\dfrac{\\pi}{8} \\Rightarrow \\cos^4 \\dfrac{7\\pi}{8} = \\cos^4 \\dfrac{\\pi}{8}$<br>$\\cos \\dfrac{5\\pi}{8} = \\cos\\left(\\pi - \\dfrac{3\\pi}{8}\\right) = -\\cos \\dfrac{3\\pi}{8} \\Rightarrow \\cos^4 \\dfrac{5\\pi}{8} = \\cos^4 \\dfrac{3\\pi}{8}$<br><br>Substituting these into the expression, we get:<br>$2 \\left( \\cos^4 \\dfrac{\\pi}{8} + \\cos^4 \\dfrac{3\\pi}{8} \\right)$<br><br>Using the property $\\cos\\left(\\dfrac{\\pi}{2} - \\theta\\right) = \\sin \\theta$, we have:<br>$\\cos \\dfrac{3\\pi}{8} = \\cos\\left(\\dfrac{\\pi}{2} - \\dfrac{\\pi}{8}\\right) = \\sin \\dfrac{\\pi}{8}$<br><br>The expression becomes:<br>$2 \\left( \\cos^4 \\dfrac{\\pi}{8} + \\sin^4 \\dfrac{\\pi}{8} \\right)$<br><br>Using the algebraic identity $a^4 + b^4 = (a^2 + b^2)^2 - 2a^2b^2$:<br>$2 \\left( (\\cos^2 \\dfrac{\\pi}{8} + \\sin^2 \\dfrac{\\pi}{8})^2 - 2 \\sin^2 \\dfrac{\\pi}{8} \\cos^2 \\dfrac{\\pi}{8} \\right)$<br><br>Since $\\cos^2 \\theta + \\sin^2 \\theta = 1$ and $2 \\sin \\theta \\cos \\theta = \\sin 2\\theta$:<br>$2 \\left( 1 - \\dfrac{1}{2} (2 \\sin \\dfrac{\\pi}{8} \\cos \\dfrac{\\pi}{8})^2 \\right)$<br><br>$= 2 \\left( 1 - \\dfrac{1}{2} \\sin^2 \\dfrac{\\pi}{4} \\right)$<br><br>$= 2 \\left( 1 - \\dfrac{1}{2} \\left(\\dfrac{1}{\\sqrt{2}}\\right)^2 \\right)$<br><br>$= 2 \\left( 1 - \\dfrac{1}{4} \\right)$<br><br>$= 2 \\times \\dfrac{3}{4} = \\dfrac{3}{2}$<br><br>Answer: $\\frac{3}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9dbf9280d7f9932ae9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\sin \\theta=\\frac{1}{2}\\left(x+\\frac{1}{x}\\right)$, then $\\sin 3 \\theta+\\frac{1}{2}\\left(x^3+\\frac{1}{x^3}\\right)=$", "image": null}, "options": [{"id": "qjJgQ", "text": "0", "image": null, "isCorrect": true}, {"id": "C0QVe", "text": "1", "image": null, "isCorrect": false}, {"id": "ZRLCk", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "rA5GX", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\sin \\theta = \\dfrac{1}{2}\\left(x + \\dfrac{1}{x}\\right)$<br><br>We know the trigonometric identity:<br><br>$\\sin 3\\theta = 3\\sin \\theta - 4\\sin^3 \\theta$<br><br>Substituting the value of $\\sin \\theta$ into the identity:<br><br>$\\sin 3\\theta = 3\\left[\\dfrac{1}{2}\\left(x + \\dfrac{1}{x}\\right)\\right] - 4\\left[\\dfrac{1}{2}\\left(x + \\dfrac{1}{x}\\right)\\right]^3$<br><br>$\\sin 3\\theta = \\dfrac{3}{2}\\left(x + \\dfrac{1}{x}\\right) - \\dfrac{4}{8}\\left(x + \\dfrac{1}{x}\\right)^3$<br><br>$\\sin 3\\theta = \\dfrac{3}{2}\\left(x + \\dfrac{1}{x}\\right) - \\dfrac{1}{2}\\left(x^3 + \\dfrac{1}{x^3} + 3x\\left(\\dfrac{1}{x}\\right)\\left(x + \\dfrac{1}{x}\\right)\\right)$<br><br>$\\sin 3\\theta = \\dfrac{3}{2}\\left(x + \\dfrac{1}{x}\\right) - \\dfrac{1}{2}\\left(x^3 + \\dfrac{1}{x^3} + 3\\left(x + \\dfrac{1}{x}\\right)\\right)$<br><br>$\\sin 3\\theta = \\dfrac{3}{2}\\left(x + \\dfrac{1}{x}\\right) - \\dfrac{1}{2}\\left(x^3 + \\dfrac{1}{x^3}\\right) - \\dfrac{3}{2}\\left(x + \\dfrac{1}{x}\\right)$<br><br>$\\sin 3\\theta = -\\dfrac{1}{2}\\left(x^3 + \\dfrac{1}{x^3}\\right)$<br><br>$\\sin 3\\theta + \\dfrac{1}{2}\\left(x^3 + \\dfrac{1}{x^3}\\right) = 0$<br><br>Answer: 0", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8fbf9280d7f9932a5c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\sin \\mathrm{A}+\\sin \\mathrm{B}=x$ and $\\cos \\mathrm{A}+\\cos \\mathrm{B}=\\mathrm{y}$, then $\\sin (\\mathrm{A}+\\mathrm{B})=$", "image": null}, "options": [{"id": "CXsLf", "text": "$\\frac{2 x y}{x^2+y^2}$", "image": null, "isCorrect": true}, {"id": "ABU6z", "text": "$\\frac{x y}{x^2+y^2}$", "image": null, "isCorrect": false}, {"id": "SuMc5", "text": "$\\frac{2 x y}{y^2-x^2}$", "image": null, "isCorrect": false}, {"id": "E0B1U", "text": "$\\frac{x y}{y^2-x^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\sin A + \\sin B = x$ and $\\cos A + \\cos B = y$.<br><br>Using the sum-to-product trigonometric identities:<br><br>$2 \\sin\\left(\\dfrac{A+B}{2}\\right) \\cos\\left(\\dfrac{A-B}{2}\\right) = x$<br><br>$2 \\cos\\left(\\dfrac{A+B}{2}\\right) \\cos\\left(\\dfrac{A-B}{2}\\right) = y$<br><br>Dividing the first equation by the second equation:<br><br>$\\dfrac{2 \\sin\\left(\\dfrac{A+B}{2}\\right) \\cos\\left(\\dfrac{A-B}{2}\\right)}{2 \\cos\\left(\\dfrac{A+B}{2}\\right) \\cos\\left(\\dfrac{A-B}{2}\\right)} = \\dfrac{x}{y}$<br><br>$\\tan\\left(\\dfrac{A+B}{2}\\right) = \\dfrac{x}{y}$<br><br>Using the half-angle formula for sine:<br><br>$\\sin(A+B) = \\dfrac{2 \\tan\\left(\\dfrac{A+B}{2}\\right)}{1 + \\tan^2\\left(\\dfrac{A+B}{2}\\right)}$<br><br>Substituting the value of $\\tan\\left(\\dfrac{A+B}{2}\\right)$:<br><br>$\\sin(A+B) = \\dfrac{2 \\left(\\dfrac{x}{y}\\right)}{1 + \\left(\\dfrac{x}{y}\\right)^2}$<br><br>$\\sin(A+B) = \\dfrac{\\dfrac{2x}{y}}{\\dfrac{x^2+y^2}{y^2}}$<br><br>$\\sin(A+B) = \\dfrac{2xy}{x^2+y^2}$<br><br>Answer: $\\frac{2 x y}{x^2+y^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7fbf9280d7f99329cc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\sin A=n \\sin (A+2 B)$, then $\\tan (A+B)=$", "image": null}, "options": [{"id": "UQWiE", "text": "$\\frac{1+n}{2-n} \\cdot \\tan B$", "image": null, "isCorrect": false}, {"id": "41SJ6", "text": "$\\frac{1-n}{1+n} \\cdot \\tan B$", "image": null, "isCorrect": false}, {"id": "JNkQF", "text": "$\\frac{1-n}{2+n} \\cdot \\tan B$", "image": null, "isCorrect": false}, {"id": "B7XFA", "text": "$\\frac{1+n}{1-n} \\cdot \\tan B$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $\\sin A = n \\sin (A+2B)$<br><br>$\\Rightarrow \\dfrac{\\sin (A+2B)}{\\sin A} = \\dfrac{1}{n}$<br><br>Applying componendo and dividendo, we get:<br><br>$\\dfrac{\\sin (A+2B) + \\sin A}{\\sin (A+2B) - \\sin A} = \\dfrac{1+n}{1-n}$<br><br>Using the sum-to-product formulas $\\sin C + \\sin D = 2 \\sin \\left(\\dfrac{C+D}{2}\\right) \\cos \\left(\\dfrac{C-D}{2}\\right)$ and $\\sin C - \\sin D = 2 \\cos \\left(\\dfrac{C+D}{2}\\right) \\sin \\left(\\dfrac{C-D}{2}\\right)$:<br><br>$\\dfrac{2 \\sin \\left(\\dfrac{A+2B+A}{2}\\right) \\cos \\left(\\dfrac{A+2B-A}{2}\\right)}{2 \\cos \\left(\\dfrac{A+2B+A}{2}\\right) \\sin \\left(\\dfrac{A+2B-A}{2}\\right)} = \\dfrac{1+n}{1-n}$<br><br>$\\dfrac{2 \\sin (A+B) \\cos B}{2 \\cos (A+B) \\sin B} = \\dfrac{1+n}{1-n}$<br><br>$\\tan (A+B) \\cot B = \\dfrac{1+n}{1-n}$<br><br>$\\tan (A+B) = \\dfrac{1+n}{1-n} \\tan B$<br><br>Answer: $\\frac{1+n}{1-n} \\cdot \\tan B$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b60bf9280d7f99328a5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The value of $\\tan 20^{\\circ} \\tan 80^{\\circ} \\cot 50^{\\circ}=$", "image": null}, "options": [{"id": "mizB6", "text": "$\\sqrt{3}$", "image": null, "isCorrect": true}, {"id": "C9vq4", "text": "$\\frac{1}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "55Wwu", "text": "$\\frac{1}{2 \\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "Vc2di", "text": "$2 \\sqrt{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given expression is $\\tan 20^{\\circ} \\tan 80^{\\circ} \\cot 50^{\\circ}$.<br><br>Using the complementary angle relation $\\cot \\theta = \\tan(90^{\\circ} - \\theta)$, we have $\\cot 50^{\\circ} = \\tan 40^{\\circ}$.<br><br>Substituting this into the expression, we get:<br><br>$\\tan 20^{\\circ} \\tan 40^{\\circ} \\tan 80^{\\circ}$<br><br>We know the standard trigonometric identity:<br><br>$\\tan \\theta \\tan(60^{\\circ} - \\theta) \\tan(60^{\\circ} + \\theta) = \\tan 3\\theta$<br><br>Putting $\\theta = 20^{\\circ}$, we get:<br><br>$\\tan 20^{\\circ} \\tan(60^{\\circ} - 20^{\\circ}) \\tan(60^{\\circ} + 20^{\\circ}) = \\tan(3 \\times 20^{\\circ})$<br><br>$\\Rightarrow \\tan 20^{\\circ} \\tan 40^{\\circ} \\tan 80^{\\circ} = \\tan 60^{\\circ}$<br><br>Since $\\tan 60^{\\circ} = \\sqrt{3}$, the value of the given expression is $\\sqrt{3}$.<br><br>Answer: $\\sqrt{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b51bf9280d7f993282a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$3 \\tan ^6 10^{\\circ}-27 \\tan ^4 10^{\\circ}+33 \\tan ^2 10^{\\circ}=$", "image": null}, "options": [{"id": "kuI5m", "text": "$0$", "image": null, "isCorrect": false}, {"id": "8q4yU", "text": "$1$", "image": null, "isCorrect": true}, {"id": "o2cCi", "text": "$2$", "image": null, "isCorrect": false}, {"id": "9FxvY", "text": "$3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\theta = 10^{\\circ}$. Then $3\\theta = 30^{\\circ}$.<br><br>Using the multiple angle formula $\\tan 3\\theta = \\dfrac{3 \\tan \\theta - \\tan^3 \\theta}{1 - 3 \\tan^2 \\theta}$, we get:<br><br>$\\tan 30^{\\circ} = \\dfrac{3 \\tan 10^{\\circ} - \\tan^3 10^{\\circ}}{1 - 3 \\tan^2 10^{\\circ}}$<br><br>$\\dfrac{1}{\\sqrt{3}} = \\dfrac{\\tan 10^{\\circ} (3 - \\tan^2 10^{\\circ})}{1 - 3 \\tan^2 10^{\\circ}}$<br><br>Squaring both sides, we obtain:<br><br>$\\dfrac{1}{3} = \\dfrac{\\tan^2 10^{\\circ} (3 - \\tan^2 10^{\\circ})^2}{(1 - 3 \\tan^2 10^{\\circ})^2}$<br><br>Let $x = \\tan^2 10^{\\circ}$. Substituting $x$ into the equation:<br><br>$\\dfrac{1}{3} = \\dfrac{x(9 - 6x + x^2)}{1 - 6x + 9x^2}$<br><br>$1 - 6x + 9x^2 = 3x(9 - 6x + x^2)$<br><br>$1 - 6x + 9x^2 = 27x - 18x^2 + 3x^3$<br><br>Rearranging the terms, we get:<br><br>$3x^3 - 27x^2 + 33x = 1$<br><br>Substituting $x = \\tan^2 10^{\\circ}$ back into the equation:<br><br>$3 \\tan^6 10^{\\circ} - 27 \\tan^4 10^{\\circ} + 33 \\tan^2 10^{\\circ} = 1$<br><br>Answer: $1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3dbf9280d7f9932764", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $3 \\sin 2 \\theta=2 \\sin 3 \\theta$ and $0 < \\theta < \\pi$, then the value of $\\sin \\theta$ is equal to", "image": null}, "options": [{"id": "nPctF", "text": "$\\frac{\\sqrt{17}}{4}$", "image": null, "isCorrect": false}, {"id": "pUg9x", "text": "$\\frac{5 \\sqrt{2}}{4}$", "image": null, "isCorrect": false}, {"id": "Vrx25", "text": "$\\frac{3 \\sqrt{2}}{4}$", "image": null, "isCorrect": false}, {"id": "2L5J1", "text": "$\\frac{\\sqrt{15}}{4}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $3 \\sin 2 \\theta = 2 \\sin 3 \\theta$<br><br>Using the formulas $\\sin 2 \\theta = 2 \\sin \\theta \\cos \\theta$ and $\\sin 3 \\theta = 3 \\sin \\theta - 4 \\sin^3 \\theta$:<br><br>$3(2 \\sin \\theta \\cos \\theta) = 2(3 \\sin \\theta - 4 \\sin^3 \\theta)$<br><br>$6 \\sin \\theta \\cos \\theta = 6 \\sin \\theta - 8 \\sin^3 \\theta$<br><br>Since $0 < \\theta < \\pi$, $\\sin \\theta \\neq 0$. Dividing both sides by $2 \\sin \\theta$:<br><br>$3 \\cos \\theta = 3 - 4 \\sin^2 \\theta$<br><br>Substituting $\\sin^2 \\theta = 1 - \\cos^2 \\theta$:<br><br>$3 \\cos \\theta = 3 - 4(1 - \\cos^2 \\theta)$<br><br>$3 \\cos \\theta = -1 + 4 \\cos^2 \\theta$<br><br>$4 \\cos^2 \\theta - 3 \\cos \\theta - 1 = 0$<br><br>$(4 \\cos \\theta + 1)(\\cos \\theta - 1) = 0$<br><br>$\\cos \\theta = -\\dfrac{1}{4}$ or $\\cos \\theta = 1$<br><br>Since $0 < \\theta < \\pi$, $\\cos \\theta \\neq 1$. Therefore, $\\cos \\theta = -\\dfrac{1}{4}$.<br><br>$\\sin \\theta = \\sqrt{1 - \\cos^2 \\theta} = \\sqrt{1 - \\left(-\\dfrac{1}{4}\\right)^2} = \\sqrt{1 - \\dfrac{1}{16}} = \\dfrac{\\sqrt{15}}{4}$<br><br>Answer: $\\frac{\\sqrt{15}}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b31bf9280d7f99326fc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "With usual notations, in a triangle ABC , if $\\theta$ is any real number, then $a \\cos (B-\\theta)+b \\cos (A+\\theta)$ is", "image": null}, "options": [{"id": "rpyXE", "text": "$a \\cos \\theta$", "image": null, "isCorrect": false}, {"id": "0Q3Vq", "text": "$\\mathrm{b} \\cos \\theta$", "image": null, "isCorrect": false}, {"id": "Yi4TL", "text": "$\\cos \\theta$", "image": null, "isCorrect": false}, {"id": "lKUqO", "text": "$c \\cos \\theta$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given expression is $a \\cos (B-\\theta) + b \\cos (A+\\theta)$.<br><br>Expanding the cosine terms using the formula $\\cos(x \\pm y) = \\cos x \\cos y \\mp \\sin x \\sin y$, we get:<br><br>$a (\\cos B \\cos \\theta + \\sin B \\sin \\theta) + b (\\cos A \\cos \\theta - \\sin A \\sin \\theta)$<br><br>Grouping the terms with $\\cos \\theta$ and $\\sin \\theta$ together:<br><br>$(a \\cos B + b \\cos A) \\cos \\theta + (a \\sin B - b \\sin A) \\sin \\theta$<br><br>By the projection rule in a triangle, $a \\cos B + b \\cos A = c$.<br><br>By the sine rule, $\\dfrac{a}{\\sin A} = \\dfrac{b}{\\sin B}$, which gives $a \\sin B = b \\sin A$, so $a \\sin B - b \\sin A = 0$.<br><br>Substituting these values into the expression, we get:<br><br>$c \\cos \\theta + 0 \\cdot \\sin \\theta = c \\cos \\theta$<br><br>Answer: $c \\cos \\theta$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b2ebf9280d7f99326f0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{A}+\\mathrm{B}=\\frac{\\pi}{2}$ then the maximum value of $\\cos \\mathrm{A} \\cdot \\cos \\mathrm{B}$ is", "image": null}, "options": [{"id": "uhx3j", "text": "$\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "Ja99a", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "tJB11", "text": "$-\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "puFxq", "text": "$-\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $A + B = \\dfrac{\\pi}{2}$<br><br>$B = \\dfrac{\\pi}{2} - A$<br><br>Let $y = \\cos A \\cdot \\cos B$<br><br>Substituting the value of $B$:<br><br>$y = \\cos A \\cdot \\cos\\left(\\dfrac{\\pi}{2} - A\\right)$<br><br>$y = \\cos A \\cdot \\sin A$<br><br>Multiplying and dividing by $2$:<br><br>$y = \\dfrac{1}{2} (2 \\sin A \\cos A)$<br><br>$y = \\dfrac{1}{2} \\sin 2A$<br><br>The maximum value of $\\sin 2A$ is $1$.<br><br>Therefore, the maximum value of $y$ is $\\dfrac{1}{2} \\times 1 = \\dfrac{1}{2}$.<br><br>Answer: $\\frac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b2abf9280d7f99326d9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The value of $\\sqrt{3} \\cot 20^{\\circ}-4 \\cos 20^{\\circ}$ is equal to", "image": null}, "options": [{"id": "OMaY7", "text": "$1$", "image": null, "isCorrect": true}, {"id": "FZ7k9", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "ujF5W", "text": "$0$", "image": null, "isCorrect": false}, {"id": "8KbeS", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\sqrt{3} \\cot 20^{\\circ} - 4 \\cos 20^{\\circ}$<br><br>$= \\dfrac{\\sqrt{3} \\cos 20^{\\circ}}{\\sin 20^{\\circ}} - 4 \\cos 20^{\\circ}$<br><br>$= \\dfrac{\\sqrt{3} \\cos 20^{\\circ} - 4 \\sin 20^{\\circ} \\cos 20^{\\circ}}{\\sin 20^{\\circ}}$<br><br>$= \\dfrac{\\sqrt{3} \\cos 20^{\\circ} - 2 \\sin 40^{\\circ}}{\\sin 20^{\\circ}}$<br><br>Substituting $\\sqrt{3} = 2 \\sin 60^{\\circ}$:<br><br>$= \\dfrac{2 \\sin 60^{\\circ} \\cos 20^{\\circ} - 2 \\sin 40^{\\circ}}{\\sin 20^{\\circ}}$<br><br>Using $2 \\sin A \\cos B = \\sin(A + B) + \\sin(A - B)$:<br><br>$= \\dfrac{\\sin(60^{\\circ} + 20^{\\circ}) + \\sin(60^{\\circ} - 20^{\\circ}) - 2 \\sin 40^{\\circ}}{\\sin 20^{\\circ}}$<br><br>$= \\dfrac{\\sin 80^{\\circ} + \\sin 40^{\\circ} - 2 \\sin 40^{\\circ}}{\\sin 20^{\\circ}}$<br><br>$= \\dfrac{\\sin 80^{\\circ} - \\sin 40^{\\circ}}{\\sin 20^{\\circ}}$<br><br>Using $\\sin C - \\sin D = 2 \\cos \\left(\\dfrac{C + D}{2}\\right) \\sin \\left(\\dfrac{C - D}{2}\\right)$:<br><br>$= \\dfrac{2 \\cos 60^{\\circ} \\sin 20^{\\circ}}{\\sin 20^{\\circ}}$<br><br>$= 2 \\cos 60^{\\circ}$<br><br>$= 2 \\times \\dfrac{1}{2} = 1$<br><br>Answer: $1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b06bf9280d7f99325b6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The sum to infinite terms of the series\n$\\tan ^{-1}\\left(\\frac{1}{3}\\right)+\\tan ^{-1}\\left(\\frac{2}{9}\\right)+\\ldots \\ldots \\ldots \\ldots+\\tan ^{-1}\\left(\\frac{2^{\\mathrm{n}-1}}{1+2^{2 \\mathrm{n}-1}}\\right)+\\ldots \\ldots \\ldots \\text { is }$", "image": null}, "options": [{"id": "F5E39", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": true}, {"id": "p2fwu", "text": "$\\frac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "xZ5Gx", "text": "$\\frac{\\pi}{6}$", "image": null, "isCorrect": false}, {"id": "npay5", "text": "$\\frac{\\pi}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The $n^{\\text{th}}$ term of the given series is:<br><br>$T_n = \\tan^{-1}\\left(\\dfrac{2^{n-1}}{1+2^{2n-1}}\\right)$<br><br>This can be rewritten by expressing the numerator as the difference of two terms whose product is the second term in the denominator:<br><br>$T_n = \\tan^{-1}\\left(\\dfrac{2^n - 2^{n-1}}{1 + 2^n \\cdot 2^{n-1}}\\right)$<br><br>Using the inverse trigonometric identity $\\tan^{-1}\\left(\\dfrac{x-y}{1+xy}\\right) = \\tan^{-1}(x) - \\tan^{-1}(y)$, we get:<br><br>$T_n = \\tan^{-1}(2^n) - \\tan^{-1}(2^{n-1})$<br><br>The sum of the first $n$ terms is:<br><br>$S_n = \\sum_{k=1}^n T_k$<br><br>$S_n = (\\tan^{-1}(2) - \\tan^{-1}(1)) + (\\tan^{-1}(2^2) - \\tan^{-1}(2)) + \\dots + (\\tan^{-1}(2^n) - \\tan^{-1}(2^{n-1}))$<br><br>This is a telescoping series where all intermediate terms cancel out, leaving:<br><br>$S_n = \\tan^{-1}(2^n) - \\tan^{-1}(1)$<br><br>To find the sum to infinite terms, we take the limit as $n \\to \\infty$:<br><br>$S_\\infty = \\lim_{n \\to \\infty} (\\tan^{-1}(2^n) - \\tan^{-1}(1))$<br><br>Since $\\lim_{n \\to \\infty} 2^n = \\infty$, we have $\\lim_{n \\to \\infty} \\tan^{-1}(2^n) = \\dfrac{\\pi}{2}$. Also, $\\tan^{-1}(1) = \\dfrac{\\pi}{4}$.<br><br>$S_\\infty = \\dfrac{\\pi}{2} - \\dfrac{\\pi}{4} = \\dfrac{\\pi}{4}$<br><br>Answer: $\\frac{\\pi}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b04bf9280d7f99325ab", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $3 \\sin \\alpha=5 \\sin \\beta$, then $\\tan \\left(\\frac{\\alpha+\\beta}{2}\\right) \\div \\tan \\left(\\frac{\\alpha-\\beta}{2}\\right)=$", "image": null}, "options": [{"id": "LxBgY", "text": "$1$", "image": null, "isCorrect": false}, {"id": "sv6WF", "text": "$2$", "image": null, "isCorrect": false}, {"id": "J9BXS", "text": "$3$", "image": null, "isCorrect": false}, {"id": "raRIt", "text": "$4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $3 \\sin \\alpha = 5 \\sin \\beta$<br><br>$\\dfrac{\\sin \\alpha}{\\sin \\beta} = \\dfrac{5}{3}$<br><br>By componendo and dividendo:<br><br>$\\dfrac{\\sin \\alpha + \\sin \\beta}{\\sin \\alpha - \\sin \\beta} = \\dfrac{5 + 3}{5 - 3}$<br><br>Using the formulas $\\sin C + \\sin D = 2 \\sin\\left(\\dfrac{C+D}{2}\\right) \\cos\\left(\\dfrac{C-D}{2}\\right)$ and $\\sin C - \\sin D = 2 \\cos\\left(\\dfrac{C+D}{2}\\right) \\sin\\left(\\dfrac{C-D}{2}\\right)$:<br><br>$\\dfrac{2 \\sin \\left(\\dfrac{\\alpha+\\beta}{2}\\right) \\cos \\left(\\dfrac{\\alpha-\\beta}{2}\\right)}{2 \\cos \\left(\\dfrac{\\alpha+\\beta}{2}\\right) \\sin \\left(\\dfrac{\\alpha-\\beta}{2}\\right)} = \\dfrac{8}{2}$<br><br>$\\tan \\left(\\dfrac{\\alpha+\\beta}{2}\\right) \\cot \\left(\\dfrac{\\alpha-\\beta}{2}\\right) = 4$<br><br>$\\dfrac{\\tan \\left(\\dfrac{\\alpha+\\beta}{2}\\right)}{\\tan \\left(\\dfrac{\\alpha-\\beta}{2}\\right)} = 4$<br><br>Answer: $4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c10279619d9d8a270f", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "If $\\sin (y+z-x), \\sin (z+x-y)$ and $\\sin (x+y-z)$ are in $A P$, then", "image": null}, "options": [{"id": "rBgya", "text": "$\\tan y=\\tan x+\\tan z$", "image": null, "isCorrect": false}, {"id": "uqbkC", "text": "$\\tan y=\\tan x-\\tan z$", "image": null, "isCorrect": false}, {"id": "4pznY", "text": "$2 \\tan y=\\tan x+\\tan z$", "image": null, "isCorrect": true}, {"id": "lKoz0", "text": "$2 \\tan y=\\tan x-\\tan z$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $2 \\sin (z+x-y)=\\sin (y+z-x)+\\sin (x+y-z)$\n$$\n\\begin{aligned}\n& \\therefore \\sin (\\mathrm{y}+\\mathrm{z}-\\mathrm{x})-\\sin (\\mathrm{z}+\\mathrm{x}-\\mathrm{y})=\\sin (\\mathrm{z}+\\mathrm{x}-\\mathrm{y})-\\sin (\\mathrm{x}+\\mathrm{y}-\\mathrm{z}) \\\\\n& \\therefore 2 \\cos \\mathrm{z} \\sin (\\mathrm{y}-\\mathrm{x})=2 \\cos \\mathrm{x} \\sin (\\mathrm{z}-\\mathrm{y}) \\\\\n& \\therefore \\cos \\mathrm{z}(\\sin \\mathrm{y} \\cos \\mathrm{x}-\\cos \\mathrm{y} \\sin \\mathrm{x})=\\cos \\mathrm{x}(\\sin \\mathrm{z} \\cos \\mathrm{y}-\\cos \\mathrm{z} \\sin \\mathrm{y}) \\\\\n& \\therefore \\cos \\mathrm{x} \\sin \\mathrm{y} \\cos \\mathrm{z}-\\sin \\mathrm{x} \\cos \\mathrm{y} \\cos \\mathrm{z}=\\cos \\mathrm{x} \\cos \\mathrm{y} \\sin \\mathrm{z} \\\\\n& -\\cos \\mathrm{x} \\sin \\mathrm{y} \\cos \\mathrm{z} \\\\\n& \\text { Dividing both } \\operatorname{sides} \\text { by } \\cos \\mathrm{x} \\cos \\mathrm{y} \\cos \\mathrm{z} \\text {, we get } \\\\\n& \\tan \\mathrm{y}-\\tan \\mathrm{x}=\\tan \\mathrm{z}-\\tan \\mathrm{y} \\\\\n& \\therefore 2 \\tan \\mathrm{y}=\\tan \\mathrm{x}+\\tan \\mathrm{z}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2609d0279619d9d8a25f1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "If in $A \\triangle A B C$, with usual notations, $a^2, b^2, c^2$ are in A.P. then $\\frac{\\sin 3 B}{\\sin B}=$", "image": null}, "options": [{"id": "XlXrT", "text": "$\\frac{a^2-c^2}{2 a c}$", "image": null, "isCorrect": false}, {"id": "3UjO7", "text": "$\\left(\\frac{a^2-c^2}{2 a c}\\right)^2$", "image": null, "isCorrect": true}, {"id": "20ndP", "text": "$\\frac{\\mathrm{a}^2-\\mathrm{c}^2}{\\mathrm{ac}}$", "image": null, "isCorrect": false}, {"id": "btxon", "text": "$\\left(\\frac{a^2-c^2}{a c}\\right)^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $2 b^2=a^2+c^2$\n$$\n\\begin{aligned}\n& \\frac{\\sin 3 \\mathrm{~B}}{\\sin \\mathrm{B}}=\\frac{3 \\sin \\mathrm{B}-4 \\sin ^2 \\mathrm{~B}}{\\sin \\mathrm{B}} \\\\\n& =3-4 \\sin ^2 \\mathrm{~B}=3-4\\left(1-\\cos ^2 \\mathrm{~B}\\right)=4 \\cos ^2 \\mathrm{~B}-1 \\\\\n& =4\\left[\\frac{\\mathrm{c}^2+\\mathrm{a}^2-\\mathrm{b}^2}{2 \\mathrm{ac}}\\right]^2-1=4\\left[\\frac{\\mathrm{b}^2}{2 \\mathrm{ac}}\\right]-1 \\\\\n& =\\left(\\frac{2 \\mathrm{~b}^2}{2 \\mathrm{ac}}\\right)-1=\\left(\\frac{\\mathrm{a}^2+\\mathrm{c}^2}{2 \\mathrm{ac}}\\right)-1=\\left(\\frac{\\mathrm{a}^2+\\mathrm{c}^2}{2 \\mathrm{ac}}+1\\right)\\left(\\frac{\\mathrm{a}^2+\\mathrm{c}^2}{2 \\mathrm{ac}}-1\\right) \\\\\n& =\\frac{(\\mathrm{a}+\\mathrm{c})^2(\\mathrm{a}-\\mathrm{c})^2}{(2 \\mathrm{ac})^2} \\\\\n& =\\left[\\frac{(\\mathrm{a}+\\mathrm{c})(\\mathrm{a}-\\mathrm{c})}{2 \\mathrm{ac}}\\right]=\\left(\\frac{\\mathrm{a}^2-\\mathrm{c}^2}{2 \\mathrm{ac}}\\right)^2\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2609d0279619d9d8a25f0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "$\\int \\frac{d x}{32-2 x^2}=A \\log (4-x)+B \\log (4+x)+c$, then the value of $\\mathrm{A}$ and $\\mathrm{B}$ are respectively (where $\\mathrm{c}$ is a constant of integration)", "image": null}, "options": [{"id": "K2fke", "text": "$\\frac{-1}{8}, \\frac{1}{8}$", "image": null, "isCorrect": false}, {"id": "kQSlQ", "text": "$\\frac{1}{8}, \\frac{-1}{8}$", "image": null, "isCorrect": false}, {"id": "t9afR", "text": "$\\frac{-1}{16}, \\frac{1}{16}$", "image": null, "isCorrect": true}, {"id": "pMnXx", "text": "$\\frac{1}{8}, \\frac{1}{8}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $I=\\int \\frac{d x}{32-2 x^2}$\n$$\n=\\frac{1}{2}\\left[\\frac{1}{2(4)} \\log \\left|\\frac{4+\\mathrm{x}}{4-\\mathrm{x}}\\right|\\right]+\\mathrm{c}=\\frac{1}{16}[\\log |4+\\mathrm{x}|-\\log |4-\\mathrm{x}|]+\\mathrm{c}\n$$\nComparing with given data we get $\\mathrm{A}=\\frac{-1}{16}, \\mathrm{~B}=\\frac{1}{16}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260660279619d9d8a242c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "If $\\theta+\\phi=\\alpha$ and $\\tan \\theta=\\mathrm{k} \\tan \\phi$ (where $\\mathrm{K}>1)$, then the value of $\\sin (\\theta-\\phi)$ is", "image": null}, "options": [{"id": "NHlDi", "text": "$\\mathrm{k} \\tan \\phi$", "image": null, "isCorrect": false}, {"id": "GB5mF", "text": "$\\sin \\alpha$", "image": null, "isCorrect": false}, {"id": "3TyHZ", "text": "$\\left(\\frac{\\mathrm{k}-1}{\\mathrm{k}+1}\\right) \\sin \\alpha$", "image": null, "isCorrect": true}, {"id": "47Jji", "text": "$\\mathrm{k} \\cos \\phi$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $\\tan \\theta=\\mathrm{k} \\tan \\phi$ and $\\theta+\\phi=\\alpha$\n$$\n\\therefore \\frac{\\tan \\theta}{\\tan \\phi}=\\frac{k}{1}\n$$\nBy Componendo Dividendo, we get\n$$\n\\begin{aligned}\n& \\frac{\\tan \\theta+\\tan \\phi}{\\tan \\theta-\\tan \\phi}=\\frac{\\mathrm{k}+1}{\\mathrm{k}-1} \\\\\n& \\therefore \\frac{\\frac{\\sin \\theta}{\\cos \\theta}+\\frac{\\sin \\phi}{\\cos \\phi}}{\\frac{\\sin \\theta}{\\cos \\theta}-\\frac{\\sin \\phi}{\\cos \\phi}}=\\frac{k+1}{k-1} \\\\\n& \\therefore \\frac{\\sin \\cos \\phi+\\cos \\theta \\sin \\phi}{\\sin \\theta \\cos \\phi-\\cos \\theta \\sin \\phi}=\\frac{k+1}{k-1} \\\\\n& \\therefore \\frac{\\sin (\\theta+\\phi)}{\\sin (\\theta-\\phi)}=\\frac{\\mathrm{k}+1}{\\mathrm{k}-1} \\Rightarrow \\frac{\\sin \\alpha}{\\sin (\\theta-\\phi)}=\\frac{\\mathrm{k}+1}{\\mathrm{k}-1} \\\\\n& \\therefore \\sin (\\theta-\\phi)=\\frac{\\mathrm{k}-1}{\\mathrm{k}+1}(\\sin \\alpha) \\\\\n&\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2601f0279619d9d8a21ef", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "The value of $\\sin ^{2}\\left(\\frac{\\pi}{8}\\right)=$", "image": null}, "options": [{"id": "c5WBa", "text": "$\\frac{\\sqrt{2}+1}{2 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "OUAYv", "text": "$\\frac{\\sqrt{5}+1}{2 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "Qs0D9", "text": "$\\frac{\\sqrt{5}-1}{2 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "rYURq", "text": "$\\frac{\\sqrt{2}-1}{2 \\sqrt{2}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n\\sin ^{2}\\left(\\frac{\\pi}{8}\\right) &=\\frac{1-\\cos 2\\left(\\frac{\\pi}{8}\\right)}{2} \\\\\n&=\\frac{1-\\cos \\frac{\\pi}{4}}{2}=\\frac{1-\\frac{1}{\\sqrt{2}}}{2}=\\frac{\\sqrt{2}-1}{2 \\sqrt{2}}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fe80279619d9d8a202f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "$\\operatorname{cosec} 2 \\theta-\\cot 2 \\theta=$", "image": null}, "options": [{"id": "2ZhyZ", "text": "$\\tan \\theta$", "image": null, "isCorrect": true}, {"id": "yubFp", "text": "$\\sin 2 \\theta$", "image": null, "isCorrect": false}, {"id": "hqUiH", "text": "$\\cos \\theta$", "image": null, "isCorrect": false}, {"id": "BSuco", "text": "$\\tan 2 \\theta$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\n$\\begin{aligned}\n\\operatorname{cosec} 2 \\theta-\\cot 2 \\theta &=\\frac{1}{\\sin 2 \\theta}-\\frac{\\cos 2 \\theta}{\\sin 2 \\theta} \\\\\n&=\\frac{1-\\cos 2 \\theta}{\\sin 2 \\theta}=\\frac{2 \\sin ^{2} \\theta}{2 \\sin \\theta \\cos \\theta}=\\tan \\theta\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc20279619d9d8a1f03", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "In a triangle $\\mathrm{ABC}$ if $\\frac{\\sin \\mathrm{A}-\\sin \\mathrm{C}}{\\cos \\mathrm{C}-\\cos \\mathrm{A}}=\\cot \\mathrm{B}$, then $\\mathrm{A}, \\mathrm{B}, \\mathrm{C}$ are in", "image": null}, "options": [{"id": "TWBAn", "text": "Arithmetico - Geometric progression", "image": null, "isCorrect": false}, {"id": "QElyP", "text": "Harmonic Progression", "image": null, "isCorrect": false}, {"id": "uUCrL", "text": "Geometric progression", "image": null, "isCorrect": false}, {"id": "bWmLT", "text": "Arithmetic progression", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(D)\n$\\frac{\\sin A-\\sin C}{\\cos C-\\cos A}=\\cot B$\n$2 \\cos \\left(\\frac{A+C}{2}\\right) \\cdot \\sin \\left(\\frac{A-C}{2}\\right)$\n$2 \\cdot \\sin \\left(\\frac{A+C}{2}\\right) \\cdot \\sin \\left(\\frac{A-C}{2}\\right)$\n$\\cot \\left(\\frac{A+C}{2}\\right)=\\cot B \\Rightarrow \\frac{A+C}{2}=B \\Rightarrow A+C=2 B$\n$\\therefore A, B, C$ are in A.P.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25faf0279619d9d8a1e72", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "If $A, B, C$ are angles of a $\\triangle A B C$, then $\\tan 2 A+\\tan 2 B+\\tan 2 C=$", "image": null}, "options": [{"id": "ya46t", "text": "$\\tan 2 A \\tan 3 B \\tan 2 C$", "image": null, "isCorrect": false}, {"id": "XwjQi", "text": "$\\tan 2 A \\tan 2 B \\tan 2 C$", "image": null, "isCorrect": true}, {"id": "6hf0W", "text": "$\\tan A \\tan B \\tan C$", "image": null, "isCorrect": false}, {"id": "7xC2h", "text": "$\\tan 3 A \\tan 2 B \\tan 2 C$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { In } \\Delta A B C, A+B+C=\\pi \\Rightarrow 2 A+2 B+2 C=2 \\pi \\\\ \\therefore & 2 A+2 B=2 \\pi-2 C \\Rightarrow \\tan (2 A+2 B)=\\tan (2 \\pi-2 C)=-\\tan 2 C \\\\ & \\frac{\\tan 2 A+\\tan 2 B}{1-\\tan 2 A \\tan 2 B}=-\\tan 2 C \\\\ \\therefore & \\tan 2 A+\\tan 2 B=-\\tan 2 C(1-\\tan 2 A \\tan 2 B) \\\\ \\therefore & \\tan 2 A+\\tan 2 B+\\tan 2 C=\\tan 2 A \\tan 2 B \\tan 2 C \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25faa0279619d9d8a1e4c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "$\\sqrt{2+\\sqrt{2+2 \\cos 4 \\theta}}=$", "image": null}, "options": [{"id": "m8aMQ", "text": "$2 \\cos \\theta$", "image": null, "isCorrect": true}, {"id": "XJMAx", "text": "$\\frac{\\cos \\theta}{2}$", "image": null, "isCorrect": false}, {"id": "cWZnL", "text": "$\\frac{\\cos \\theta}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "FCl1T", "text": "$\\sqrt{2} \\cdot \\cos \\theta$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\sqrt{2+\\sqrt{2+2 \\cos 4 \\theta}} &=\\sqrt{2+\\sqrt{2(1+\\cos 4 \\theta)}} \\\\ &=\\sqrt{2+\\sqrt{2 \\times 2 \\cos ^{2} 2 \\theta}}=\\sqrt{2+2 \\cos ^{2} 2 \\theta} \\\\ &=\\sqrt{2\\left(1+\\cos ^{2} 2 \\theta\\right)}=\\sqrt{2 \\times 2 \\cos ^{2} \\theta}=2 \\cos \\theta \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MH isCorrect": true, "image": null}, {"id": "betAD", "label": "B", "text": "$\\dfrac{\\sqrt{11}}{16}$", "isCorrect": false, "image": null}, {"id": "D8bGV", "label": "C", "text": "$-\\dfrac{\\sqrt{11}}{16}$", "isCorrect": false, "image": null}, {"id": "jlomq", "label": "D", "text": "$-\\dfrac{11}{16}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Using the trigonometric identity $2 \\sin x \\sin y = \\cos(x - y) - \\cos(x + y)$, we have:<br><br>$2 \\sin \\dfrac{A}{2} \\cdot \\sin \\dfrac{5A}{2} = \\cos\\left(\\dfrac{5A}{2} - \\dfrac{A}{2}\\right) - \\cos\\left(\\dfrac{5A}{2} + \\dfrac{A}{2}\\right)$<br><br>$= \\cos 2A - \\cos 3A$<br><br>Using the multiple angle formulas:<br><br>$\\cos 2A = 2 \\cos^2 A - 1$<br><br>$\\cos 3A = 4 \\cos^3 A - 3 \\cos A$<br><br>Substituting $\\cos A = \\dfrac{3}{4}$:<br><br>$\\cos 2A = 2 \\left(\\dfrac{3}{4}\\right)^2 - 1 = 2 \\left(\\dfrac{9}{16}\\right) - 1 = \\dfrac{9}{8} - 1 = \\dfrac{1}{8}$<br><br>$\\cos 3A = 4 \\left(\\dfrac{3}{4}\\right)^3 - 3 \\left(\\dfrac{3}{4}\\right) = 4 \\left(\\dfrac{27}{64}\\right) - \\dfrac{9}{4} = \\dfrac{27}{16} - \\dfrac{36}{16} = -\\dfrac{9}{16}$<br><br>Therefore, the value of the given expression is:<br><br>$\\cos 2A - \\cos 3A = \\dfrac{1}{8} - \\left(-\\dfrac{9}{16}\\right) = \\dfrac{2}{16} + \\dfrac{9}{16} = \\dfrac{11}{16}$<br><br>Answer: $\\dfrac{11}{16}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus":
