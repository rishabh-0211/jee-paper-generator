ft 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262620279619d9d8a3414", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "If $(1+\\sqrt{1+x}) \\tan x=1+\\sqrt{1-x}$, then $\\sin 4 x$ is", "image": null}, "options": [{"id": "KUPP4", "text": "$x$", "image": null, "isCorrect": true}, {"id": "8mI1p", "text": "$-x$", "image": null, "isCorrect": false}, {"id": "gwIma", "text": "$4 x$", "image": null, "isCorrect": false}, {"id": "XMWRy", "text": "$-4 x$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$(1+\\sqrt{1+x}) \\tan x=1+\\sqrt{1-x}$\n$\\Rightarrow \\tan x=\\frac{1+\\sqrt{1-x}}{1+\\sqrt{1+x}}$\nPut $x=\\sin \\theta$\n$\\therefore \\quad \\tan x=\\frac{1+\\sqrt{1-\\sin \\theta}}{1+\\sqrt{1+\\sin \\theta}}$\n$\\begin{aligned} & =\\frac{1+\\sqrt{\\left(\\cos \\frac{\\theta}{2}-\\sin \\frac{\\theta}{2}\\right)^2}}{1+\\sqrt{\\left(\\cos \\frac{\\theta}{2}+\\sin \\frac{\\theta}{2}\\right)^2}} \\\\ & =\\frac{1+\\cos \\frac{\\theta}{2}-\\sin \\frac{\\theta}{2}}{1+\\cos \\frac{\\theta}{2}+\\sin \\frac{\\theta}{2}} \\\\ & =\\frac{2 \\cos ^2 \\frac{\\theta}{4}-2 \\sin \\frac{\\theta}{4} \\cos \\frac{\\theta}{4}}{2 \\cos ^2 \\frac{\\theta}{4}+2 \\sin \\frac{\\theta}{4} \\cos \\frac{\\theta}{4}} \\\\ & =\\frac{2 \\cos ^2 \\frac{\\theta}{4}\\left(1-\\tan \\frac{\\theta}{4}\\right)}{2 \\cos ^2 \\frac{\\theta}{4}\\left(1+\\tan \\frac{\\theta}{4}\\right)}\\end{aligned}$\n$\\therefore \\quad \\tan x=\\tan \\left(\\frac{\\pi}{4}-\\frac{\\theta}{4}\\right) \\quad \\ldots\\left[\\because \\tan \\frac{\\pi}{4}=1\\right]$\n$\\begin{aligned} & \\Rightarrow x=\\frac{\\pi-\\theta}{4} \\\\ & \\Rightarrow \\sin 4 x=\\sin (\\pi-\\theta)=\\sin \\theta=x\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2601c0279619d9d8a21d6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "$\\frac{\\sin A+\\sin 7 A+\\sin 13 A}{\\cos A+\\cos 7 A+\\cos 13 A}=$", "image": null}, "options": [{"id": "xDATb", "text": "$\\cot 7 A$", "image": null, "isCorrect": false}, {"id": "9xKZv", "text": "$\\tan 6 A$", "image": null, "isCorrect": false}, {"id": "xfUd3", "text": "$\\tan 7 A$", "image": null, "isCorrect": true}, {"id": "ygpDr", "text": "$\\cot 6 A$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\frac{\\sin A+\\sin 7 A+\\sin 13 A}{\\cos A+\\cos 7 A+\\cos 13 A} &=\\frac{(\\sin A+\\sin 13 A)+\\sin 7 A}{(\\cos A+\\cos 13 A)+\\cos 7 A} \\\\ &=\\frac{2 \\sin 7 A \\cos 6 A+\\sin 7 A}{2 \\cos 7 A \\cos 6 A+\\cos 7 A} \\\\ &=\\frac{\\sin 7 A(2 \\cos 6 A+1)}{\\cos 7 A(2 \\cos 6 A+1)} \\\\ &=\\tan 7 A \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260090279619d9d8a213a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "If $\\sin \\theta=\\sin 15^{\\circ}+\\sin 45^{\\circ}$, where $0^{\\circ} < \\theta < 180^{\\circ}$, then $\\theta=$", "image": null}, "options": [{"id": "PoC9y", "text": "$75^{\\circ}$", "image": null, "isCorrect": true}, {"id": "VD0Ed", "text": "$150^{\\circ}$", "image": null, "isCorrect": false}, {"id": "kykVf", "text": "$45^{\\circ}$", "image": null, "isCorrect": false}, {"id": "XSbbE", "text": "$60^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\text { Given } \\sin \\theta &=\\sin 15^{\\circ}+\\sin 45^{\\circ} \\\\ &=2 \\sin \\left(\\frac{15^{\\circ}+45^{\\circ}}{2}\\right) \\cos \\left(\\frac{15^{\\circ}-45^{\\circ}}{2}\\right) \\\\ &=2 \\sin 30^{\\circ} \\cos 15^{\\circ}=2 \\times \\frac{1}{2} \\cos 15^{\\circ} \\\\ \\sin \\theta &=\\cos 15^{\\circ} \\Rightarrow \\sin \\theta=\\sin \\left(90^{\\circ}-15^{\\circ}\\right) \\Rightarrow \\theta=75^{\\circ} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fe80279619d9d8a2032", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "If A and B are two angles such that A, B, $\\in(0, \\pi)$ and they are not supplementary\nangles such that $\\sin A-\\sin B=0$, then", "image": null}, "options": [{"id": "qbRL1", "text": "$A-B=\\frac{\\pi}{3}$", "image": null, "isCorrect": false}, {"id": "tBwS1", "text": "$A-B=\\frac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "qoDys", "text": "$A=B$", "image": null, "isCorrect": true}, {"id": "5AqA6", "text": "$A \\neq B$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\n$\\sin A-\\sin B=0$\n$\\sin A=\\sin B$ and we know that $\\sin A=\\sin (\\pi-A)=\\sin B$\n$\\therefore \\mathrm{A}=\\mathrm{B}$ or $\\pi-\\mathrm{A}=\\mathrm{B}$\n$\\therefore \\mathrm{A}=\\mathrm{B}$ or $\\mathrm{A}+\\mathrm{B}=\\pi$\nSince the angles are not supplementary we say $\\mathrm{A}=\\mathrm{B}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd10279619d9d8a1f79", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "$\\operatorname{Cos}\\left(36^{\\circ}-\\mathrm{A}\\right) \\cos \\left(36^{\\circ}+\\mathrm{A}\\right)+\\cos \\left(54^{\\circ}+\\mathrm{A}\\right) \\cos \\left(54^{\\circ}-\\mathrm{A}\\right)=$", "image": null}, "options": [{"id": "luj22", "text": "$\\operatorname{Cos} 2 \\mathrm{~A}$", "image": null, "isCorrect": true}, {"id": "pqTIP", "text": "$\\operatorname{Cos} \\mathrm{A}$", "image": null, "isCorrect": false}, {"id": "KjeVo", "text": "$\\operatorname{Sin} 2 \\mathrm{~A}$", "image": null, "isCorrect": false}, {"id": "kQvz1", "text": "$\\operatorname{Sin} \\mathrm{A}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\n$\\begin{array}{l}\n\\cos \\left(36^{\\circ}-\\mathrm{A}\\right) \\cos \\left(36^{\\circ}+\\mathrm{A}\\right)+\\cos \\left(54^{\\circ}+\\mathrm{A}\\right) \\cos \\left(54^{\\circ}-\\mathrm{A}\\right) \\\\\n=\\cos \\left(36^{\\circ}-\\mathrm{A}\\right) \\cdot \\cos \\left(36^{\\circ}+\\mathrm{A}\\right)+\\cos \\left[90^{\\circ}-\\left(36^{\\circ}-\\mathrm{A}\\right)\\right] \\cdot \\cos \\left[90^{\\circ}-\\left(36^{\\circ}+\\mathrm{A}\\right)\\right]\n\\end{array}$\n$=\\cos \\left(36^{\\circ}-\\mathrm{A}\\right) \\cdot \\cos \\left(36^{\\circ}+\\mathrm{A}\\right)+\\sin \\left(36^{\\circ}-\\mathrm{A}\\right) \\cdot \\sin \\left(36^{\\circ}+\\mathrm{A}\\right)$\n$=\\cos \\left[\\left(36^{\\circ}-\\mathrm{A}\\right)-\\left(36^{\\circ}+\\mathrm{A}\\right)\\right]=\\cos \\left[36^{\\circ}-\\mathrm{A}-36^{\\circ}-\\mathrm{A}\\right]=\\cos (-2 \\mathrm{~A})=\\cos 2 \\mathrm{~A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fab0279619d9d8a1e50", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "If $\\sin (y+z-x), \\sin (z+x-y)$ and $\\sin (x+y-z)$ are in A.P., then", "image": null}, "options": [{"id": "aVoQM", "text": "$2 \\tan y=\\tan x-\\tan z$", "image": null, "isCorrect": false}, {"id": "udFBG", "text": "$\\tan y=\\tan x+\\tan z$", "image": null, "isCorrect": false}, {"id": "vuOse", "text": "$2 \\tan y=\\tan x+\\tan z$", "image": null, "isCorrect": true}, {"id": "43wmP", "text": "$\\tan y=\\tan x-\\tan z$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As $\\sin (y+z-x), \\sin (z+x-y)$ and $\\sin (x+y-z)$ are in A.P.\n$\\therefore \\sin (z+x-y)-\\sin (y+z-x)=\\sin (x+y-z)-\\sin (z+x-y)$\n$\\Rightarrow 2 \\cos z \\sin (x-y)=2 \\cos x \\sin (y-z)$\n$\\Rightarrow \\cos z \\sin (x-y)=\\cos x \\sin (y-z)$\n$\\Rightarrow \\frac{\\cos z \\sin (x-y)}{\\cos x \\cos y \\cos z}=\\frac{\\cos x \\sin (y-z)}{\\cos x \\cos y \\cos z}$\n$\\Rightarrow \\frac{\\sin (x-y)}{\\cos x \\cos y}=\\frac{\\sin (y-z)}{\\cos y \\cos z}$\nUsing $\\frac{\\sin (A-B)}{\\cos A \\cos B}=\\tan A-\\tan B$\n$\\Rightarrow \\tan x-\\tan y=\\tan y-\\operatorname{taz}$\n$\\Rightarrow \\tan y-\\tan x=\\tan z-\\tan y$\n$\\therefore \\tan x, \\tan y \\operatorname{and} \\tan z \\operatorname{are}$ in A.P.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f890279619d9d8a1d44", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "$$\\frac{\\cos 12^{\\circ}-\\sin 12^{\\circ}}{\\cos 12^{\\circ}+\\sin 12^{\\circ}}+\\frac{\\sin 147^{\\circ}}{\\cos 147^{\\circ}}=$$", "image": null}, "option 0$.<br><br>Therefore, $\\cos\\left(\\dfrac{\\pi}{5}\\right) = \\dfrac{1 + \\sqrt{5}}{4}$<br><br>Answer: $\\dfrac{1 + \\sqrt{5}}{4}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214120aee93fa0796ddc0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "The value of\r\n$\\begin{aligned}\r\n& \\cos \\left(18^{\\circ}-\\mathrm{A}\\right) \\cos \\left(18^{\\circ}+\\mathrm{A}\\right) \\\\\r\n& -\\cos \\left(72^{\\circ}-\\mathrm{A}\\right) \\cos \\left(72^{\\circ}+\\mathrm{A}\\right) \\text { is equal to }\r\n\\end{aligned}$", "image": null}, "options": [{"id": "Pc55H", "text": "$\\cos 54^{\\circ}$", "image": null, "isCorrect": false}, {"id": "ZYNJI", "text": "$\\cos 72^{\\circ}$", "image": null, "isCorrect": false}, {"id": "hSkzI", "text": "$\\sin 54^{\\circ}$", "image": null, "isCorrect": true}, {"id": "1qYB4", "text": "$\\sin 36^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the trigonometric identity $\\cos(x - y) \\cos(x + y) = \\cos^2 x - \\sin^2 y$, the given expression can be simplified as follows:<br><br>$\\cos(18^{\\circ} - \\mathrm{A}) \\cos(18^{\\circ} + \\mathrm{A}) - \\cos(72^{\\circ} - \\mathrm{A}) \\cos(72^{\\circ} + \\mathrm{A})$<br><br>$= (\\cos^2 18^{\\circ} - \\sin^2 \\mathrm{A}) - (\\cos^2 72^{\\circ} - \\sin^2 \\mathrm{A})$<br><br>$= \\cos^2 18^{\\circ} - \\cos^2 72^{\\circ}$<br><br>Since $\\cos 72^{\\circ} = \\sin(90^{\\circ} - 72^{\\circ}) = \\sin 18^{\\circ}$, substituting this into the expression gives:<br><br>$= \\cos^2 18^{\\circ} - \\sin^2 18^{\\circ}$<br><br>Using the double angle formula $\\cos^2 \\theta - \\sin^2 \\theta = \\cos 2\\theta$:<br><br>$= \\cos(2 \\times 18^{\\circ})$<br><br>$= \\cos 36^{\\circ}$<br><br>Using the complementary angle identity $\\cos \\theta = \\sin(90^{\\circ} - \\theta)$, we get:<br><br>$\\cos 36^{\\circ} = \\sin(90^{\\circ} - 36^{\\circ}) = \\sin 54^{\\circ}$<br><br>Answer: $\\sin 54^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c90aee93fa0796db7e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "The value of $\\left(1+\\cos \\dfrac{\\pi}{8}\\right)\\left(1+\\cos \\dfrac{3 \\pi}{8}\\right)\\left(1+\\cos \\dfrac{5 \\pi}{8}\\right)\\left(1+\\cos \\dfrac{7 \\pi}{8}\\right)$ is", "image": null}, "options": [{"id": "MHBaU", "text": "$\\dfrac{1}{8}$", "image": null, "isCorrect": true}, {"id": "DyFW9", "text": "$\\dfrac{-1}{8}$", "image": null, "isCorrect": false}, {"id": "S643S", "text": "$\\dfrac{1}{16}$", "image": null, "isCorrect": false}, {"id": "NhqGZ", "text": "$\\dfrac{-1}{16}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the property $\\cos(\\pi - \\theta) = -\\cos \\theta$, we can write:<br><br>$\\cos \\dfrac{7\\pi}{8} = \\cos \\left(\\pi - \\dfrac{\\pi}{8}\\right) = -\\cos \\dfrac{\\pi}{8}$<br><br>$\\cos \\dfrac{5\\pi}{8} = \\cos \\left(\\pi - \\dfrac{3\\pi}{8}\\right) = -\\cos \\dfrac{3\\pi}{8}$<br><br>Substituting these into the given expression:<br><br>$\\left(1+\\cos \\dfrac{\\pi}{8}\\right)\\left(1+\\cos \\dfrac{3 \\pi}{8}\\right)\\left(1-\\cos \\dfrac{3 \\pi}{8}\\right)\\left(1-\\cos \\dfrac{\\pi}{8}\\right)$<br><br>Grouping the terms and using $(a+b)(a-b) = a^2 - b^2$:<br><br>$\\left(1-\\cos^2 \\dfrac{\\pi}{8}\\right) \\left(1-\\cos^2 \\dfrac{3 \\pi}{8}\\right)$<br><br>Using $1-\\cos^2 \\theta = \\sin^2 \\theta$:<br><br>$\\sin^2 \\dfrac{\\pi}{8} \\sin^2 \\dfrac{3 \\pi}{8}$<br><br>Since $\\dfrac{3\\pi}{8} = \\dfrac{\\pi}{2} - \\dfrac{\\pi}{8}$, we have $\\sin \\dfrac{3\\pi}{8} = \\cos \\dfrac{\\pi}{8}$. The expression becomes:<br><br>$\\sin^2 \\dfrac{\\pi}{8} \\cos^2 \\dfrac{\\pi}{8}$<br><br>Multiplying and dividing by $4$:<br><br>$\\dfrac{1}{4} \\left(2 \\sin \\dfrac{\\pi}{8} \\cos \\dfrac{\\pi}{8}\\right)^2$<br><br>Using the double angle formula $\\sin 2\\theta = 2 \\sin \\theta \\cos \\theta$:<br><br>$\\dfrac{1}{4} \\left(\\sin \\dfrac{\\pi}{4}\\right)^2$<br><br>Substituting $\\sin \\dfrac{\\pi}{4} = \\dfrac{1}{\\sqrt{2}}$:<br><br>$\\dfrac{1}{4} \\left(\\dfrac{1}{\\sqrt{2}}\\right)^2 = \\dfrac{1}{4} \\times \\dfrac{1}{2} = \\dfrac{1}{8}$<br><br>Answer: $\\dfrac{1}{8}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792137e0aee93fa0796d932", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "The value of the expression $\\sqrt{3} \\operatorname{cosec} 20^{\\circ}-\\sec 20^{\\circ}$ is equal to", "image": null}, "options": [{"id": "12lN4", "text": "2", "image": null, "isCorrect": false}, {"id": "cPbGE", "text": "$\\dfrac{2 \\sin 20^{\\circ}}{\\sin 40^{\\circ}}$", "image": null, "isCorrect": false}, {"id": "2lpA0", "text": "4", "image": null, "isCorrect": true}, {"id": "Y8aMK", "text": "$4 \\dfrac{\\sin 20^{\\circ}}{\\sin 40^{\\circ}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given expression is $\\sqrt{3} \\operatorname{cosec} 20^{\\circ} - \\sec 20^{\\circ}$.<br><br>Converting to sine and cosine, we get:<br><br>$\\dfrac{\\sqrt{3}}{\\sin 20^{\\circ}} - \\dfrac{1}{\\cos 20^{\\circ}}$<br><br>Taking the common denominator:<br><br>$\\dfrac{\\sqrt{3} \\cos 20^{\\circ} - \\sin 20^{\\circ}}{\\sin 20^{\\circ} \\cos 20^{\\circ}}$<br><br>Multiplying and dividing the numerator by $2$, and the denominator by $2$:<br><br>$\\dfrac{2 \\left( \\dfrac{\\sqrt{3}}{2} \\cos 20^{\\circ} - \\dfrac{1}{2} \\sin 20^{\\circ} \\right)}{\\dfrac{1}{2} (2 \\sin 20^{\\circ} \\cos 20^{\\circ})}$<br><br>Substituting $\\sin 60^{\\circ} = \\dfrac{\\sqrt{3}}{2}$ and $\\cos 60^{\\circ} = \\dfrac{1}{2}$ in the numerator, and using $\\sin 2\\theta = 2 \\sin \\theta \\cos \\theta$ in the denominator:<br><br>$\\dfrac{4 (\\sin 60^{\\circ} \\cos 20^{\\circ} - \\cos 60^{\\circ} \\sin 20^{\\circ})}{\\sin 40^{\\circ}}$<br><br>Using the identity $\\sin(A - B) = \\sin A \\cos B - \\cos A \\sin B$:<br><br>$\\dfrac{4 \\sin(60^{\\circ} - 20^{\\circ})}{\\sin 40^{\\circ}}$<br><br>$\\dfrac{4 \\sin 40^{\\circ}}{\\sin 40^{\\circ}}$<br><br>$4$<br><br>Answer: 4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262030279619d9d8a3118", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "The value of $\\tan \\left(\\frac{\\pi}{8}\\right)$ is", "image": null}, "options": [{"id": "1qbR8", "text": "$\\sqrt{2}-1$", "image": null, "isCorrect": true}, {"id": "W7fbL", "text": "$1-\\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "OMTtN", "text": "$\\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "9ysok", "text": "$\\sqrt{2}+1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since, $\\tan \\frac{A}{2}=\\frac{1-\\cos A}{\\sin A}$ Putting $\\frac{\\mathrm{A}}{2}=\\frac{\\pi}{8}$, we get\n$\\begin{aligned} \\tan \\left(\\frac{\\pi}{8}\\right) & =\\frac{1-\\cos \\frac{\\pi}{4}}{\\sin \\frac{\\pi}{4}} \\\\ & =\\frac{1-\\frac{1}{\\sqrt{2}}}{\\left(\\frac{1}{\\sqrt{2}}\\right)} \\\\ \\therefore \\quad \\tan \\left(\\frac{\\pi}{8}\\right) & =\\sqrt{2}-1\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f10279619d9d8a3092", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "In a triangle $\\mathrm{ABC}$, with usual notations, if $\\mathrm{c}=4$, then value of $(a-b)^2 \\cos ^2 \\frac{C}{2}+(a+b)^2 \\sin ^2 \\frac{C}{2}$ is", "image": null}, "options": [{"id": "mPoL3", "text": "$4$", "image": null, "isCorrect": false}, {"id": "6TSFg", "text": "$16$", "image": null, "isCorrect": true}, {"id": "KtU8c", "text": "$9$", "image": null, "isCorrect": false}, {"id": "OhNzF", "text": "$2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & (a-b)^2 \\cos ^2 \\frac{C}{2}+(a+b)^2 \\sin ^2 \\frac{C}{2} \\\\ & =\\left(a^2-2 a b+b^2\\right) \\cos ^2 \\frac{C}{2}+\\left(a^2+2 a b+b^2\\right) \\sin ^2 \\frac{C}{2} \\\\ & =\\left(a^2+b^2\\right)\\left(\\cos ^2 \\frac{C}{2}+\\sin ^2 \\frac{C}{2}\\right) \\\\ & \\quad-2 a b \\cos ^2 \\frac{C}{2}+2 a b \\sin ^2 \\frac{C}{2} \\\\ & =a^2+b^2-2 a b\\left(\\cos ^2 \\frac{C}{2}-\\sin ^2 \\frac{C}{2}\\right) \\\\ & =a^2+b^2-2 a b \\cdot \\cos C \\\\ & =a^2+b^2-\\left(a^2+b^2-c^2\\right) \\quad \\ldots[\\text { By Cosine rule }] \\\\ & =c^2=4^2=16\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ca0279619d9d8a2f5c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "If $\\cos 2 B-\\frac{\\cos (A+C)}{\\cos (A-C)}$, Then $\\tan A, \\tan B, \\tan C$ are in", "image": null}, "options": [{"id": "2F4nz", "text": "Geometric Progression.", "image": null, "isCorrect": true}, {"id": "rF5rW", "text": "Arithmetic Progression.", "image": null, "isCorrect": false}, {"id": "z27D1", "text": "Harmonic Progression.", "image": null, "isCorrect": false}, {"id": "cFqEr", "text": "Arithmetico-Geometric Progression.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\cos 2 B=\\frac{\\cos (A+C)}{\\cos (A-C)} \\\\ & \\frac{1-\\tan ^2 B}{1+\\tan ^2 B}=\\frac{\\cos A \\cos C-\\sin A \\sin C}{\\cos A \\cos C+\\sin A \\sin C} \\\\ & \\frac{1-\\tan ^2 B}{1+\\tan ^2 B}=\\frac{\\cos A \\cos C(1-\\tan A \\tan C)}{\\cos A \\cos C(1+\\tan A \\tan C)} \\\\ & \\frac{1-\\tan ^2 B}{1+\\tan ^2 B}=\\frac{(1-\\tan A \\tan C)}{(1+\\tan A \\tan C)}\\end{aligned}$\n$\\begin{aligned} &\\left(1-\\tan ^2 \\mathrm{~B}\\right)(1+\\tan \\mathrm{A} \\tan \\mathrm{C}) \\\\ & \\quad=(1-\\tan \\mathrm{A} \\tan \\mathrm{C})\\left(1+\\tan ^2 \\mathrm{~B}\\right) \\\\ & \\quad 1+\\tan \\mathrm{A} \\tan \\mathrm{C}-\\tan ^2 \\mathrm{~B}-\\tan ^2 \\mathrm{~B} \\tan \\mathrm{A} \\tan \\mathrm{C} \\\\ & \\quad=1+\\tan ^2 \\mathrm{~B}-\\tan \\mathrm{A} \\tan \\mathrm{C}-\\tan \\mathrm{A} \\tan \\mathrm{C} \\tan ^2 \\mathrm{~B} \\\\ & \\quad 2 \\tan \\mathrm{A} \\tan \\mathrm{C}=2 \\tan ^2 \\mathrm{~B} \\\\ & \\quad \\tan ^2 \\mathrm{~B}=\\tan \\mathrm{A} \\cdot \\tan \\mathrm{C} \\\\ & \\therefore \\quad \\tan \\mathrm{A}, \\tan \\mathrm{B}, \\tan \\mathrm{C} \\text { are in G.P. }\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2610e0279619d9d8a2977", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "If $\\tan \\theta=\\frac{a}{b}$, then $b \\cos 2 \\theta+a \\sin 2 \\theta=$", "image": null}, "options": [{"id": "MJRji", "text": "b", "image": null, "isCorrect": true}, {"id": "JqoRA", "text": "a", "image": null, "isCorrect": false}, {"id": "HH0Rl", "text": "0", "image": null, "isCorrect": false}, {"id": "Z2ZTC", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & b \\cos 2 \\theta+a \\sin 2 \\theta=b \\times \\frac{1-\\tan ^2 \\theta}{1+\\tan ^2 \\theta}+a \\times \\frac{2 \\tan \\theta}{1+\\tan ^2 \\theta} \\\\ & =b \\times \\frac{1-\\frac{a^2}{b^2}}{1+\\frac{a^2}{b^2}}+a \\times \\frac{2 \\times \\frac{a}{b}}{1+\\frac{a^2}{b^2}} \\\\ & =\\frac{b\\left(b^2-a^2\\right)}{b^2+a^2}+\\frac{2 a^2 b}{b^2+a^2} \\\\ & =\\frac{b\\left(b^2+a^2\\right)}{b^2+a^2}=b\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260d70279619d9d8a27ba", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": " n ^2 \\mathrm{~A}\\right)}{8 \\tan \\mathrm{A}}=\\frac{8}{8 \\tan \\mathrm{A}}=\\cot \\mathrm{A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ff90279619d9d8a20b7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "$\\frac{1-\\sin \\theta+\\cos \\theta}{1-\\sin \\theta-\\cos \\theta}=$", "image": null}, "options": [{"id": "SrE66", "text": "$\\cot \\frac{\\theta}{2}$", "image": null, "isCorrect": false}, {"id": "46XTc", "text": "$-\\cot \\frac{\\theta}{2}$", "image": null, "isCorrect": true}, {"id": "41Okv", "text": "$\\tan \\frac{\\theta}{2}$", "image": null, "isCorrect": false}, {"id": "rys7T", "text": "$-\\tan \\frac{\\theta}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\n$\\begin{array}{l}\n\\text { We know } \\sin \\theta=2 \\sin \\frac{\\theta}{2} \\cdot \\cos \\frac{\\theta}{2} \\text { and } \\cos \\theta=2 \\cos ^{2} \\frac{\\theta}{2}-1=1-2 \\sin ^{2} \\frac{\\theta}{2} \\\\\n\\frac{1-\\sin \\theta+\\cos \\theta}{1-\\sin \\theta-\\cos \\theta}=\\frac{1-2 \\sin \\frac{\\theta}{2} \\cdot \\cos \\frac{\\theta}{2}+\\left(2 \\cos ^{2} \\frac{\\theta}{2}-1\\right)}{1-2 \\sin \\frac{\\theta}{2} \\cdot \\cos \\frac{\\theta}{2}-\\left(1-2 \\sin ^{2} \\frac{\\theta}{2}\\right)}\n\\end{array}$\n$=\\frac{-2 \\sin \\frac{\\theta}{2} \\cdot \\cos \\frac{\\theta}{2}+2 \\cos ^{2} \\frac{\\theta}{2}}{-2 \\sin \\frac{  4 \\mathrm{~A}}=\\tan \\mathrm{A}+2 \\tan 2 \\mathrm{~A}+4 \\cot 4 \\mathrm{~A}$\n$=\\tan \\mathrm{A}+2 \\tan 2 \\mathrm{~A}+4 \\times \\frac{1-\\tan ^{2} 2 \\mathrm{~A}}{2 \\tan 2 \\mathrm{~A}}=\\tan \\mathrm{A}+2 \\tan 2 \\mathrm{~A}+\\frac{2\\left(1-\\tan ^{2} 2 \\mathrm{~A}\\right)}{\\tan 2 \\mathrm{~A}}$\n$=\\tan \\mathrm{A}+\\frac{2 \\tan ^{2} 2 \\mathrm{~A}+2-2 \\tan ^{2} 2 \\mathrm{~A}}{\\tan 2 \\mathrm{~A}}=\\tan \\mathrm{A}+\\frac{2}{\\tan 2 \\mathrm{~A}}$\n$=\\tan \\mathrm{A}+2 \\cot 2 \\mathrm{~A}=\\frac{2\\left(1-\\tan ^{2} \\mathrm{~A}\\right)}{2 \\tan \\mathrm{A}}=\\tan \\mathrm{A}+\\frac{1-\\tan ^{2} \\mathrm{~A}}{\\tan \\mathrm{A}}$\n$=\\frac{\\tan ^{2} \\mathrm{~A}+1-\\tan ^{2} \\mathrm{~A}}{\\tan \\mathrm{A}}=\\frac{1}{\\tan \\mathrm{A}}=\\cot \\mathrm{A}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fac0279619d9d8a1e57", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "If $A+B+C=180^{\\circ}$, then the value of\n$\\tan \\left(\\frac{\\mathrm{A}}{2}\\right) \\tan \\left(\\frac{\\mathrm{B}}{2}\\right)+\\tan \\left(\\frac{\\mathrm{B}}{2}\\right) \\tan \\left(\\frac{\\mathrm{C}}{2}\\right)+\\tan \\left(\\frac{\\mathrm{C}}{2}\\right) \\tan \\left(\\frac{\\mathrm{A}}{2}\\right)$ is", "image": null}, "options": [{"id": "J9Su3", "text": "1", "image": null, "isCorrect": true}, {"id": "Uu875", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "PBn08", "text": "$-2$", "image": null, "isCorrect": false}, {"id": "PfpdD", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\ln \\Delta A B C, A+B+C=\\pi \\Rightarrow A+B=\\pi-C$\n$$\n\\tan \\left(\\frac{A+B}{2}\\right)=\\tan \\left(\\frac{\\pi-C}{2}\\right)=\\tan \\left(\\frac{\\pi}{2}-\\frac{C}{2}\\right)\n$$\n$\\therefore \\frac{\\tan \\frac{A}{2}+\\tan \\frac{B}{2}}{1-\\tan \\frac{A}{2} \\tan \\frac{B}{2}}=\\cot \\frac{C}{2} \\Rightarrow \\frac{\\tan \\frac{A}{2}+\\tan \\frac{B}{2}}{1-\\tan \\frac{A}{2} \\cdot \\tan \\frac{B}{2}}=\\frac{1}{\\tan \\frac{C}{2}}$\n$\\therefore \\tan \\frac{\\mathrm{C}}{2}\\left(\\tan \\frac{\\mathrm{A}}{2}+\\tan \\frac{\\mathrm{B}}{2}\\right) \\quad=1-\\tan \\frac{\\mathrm{A}}{2} \\tan \\frac{\\mathrm{B}}{2}$\n$\\therefore \\tan \\frac{\\mathrm{A}}{2} \\tan \\frac{\\mathrm{B}}{2}+\\tan \\frac{\\mathrm{B}}{2} \\tan \\frac{\\mathrm{C}}{2}+\\tan \\frac{\\mathrm{C}}{2} \\tan \\frac{\\mathrm{A}}{2}=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f4d0279619d9d8a1b5e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "$\\cos x \\cdot \\cos 7 x-\\cos 5 x \\cdot \\cos 13 x=$", "image": null}, "options": [{"id": "nmCgs", "text": "$2 \\cos ^{2} 6 x \\cdot \\cos 12 x$", "image": null, "isCorrect": false}, {"id": "GaKa5", "text": "$2 \\sin ^{2} 6 x \\cdot \\cos 6 x$", "image": null, "isCorrect": true}, {"id": "q5oPq", "text": "$2 \\sin 6 x \\cdot \\sin 12 x$", "image": null, "isCorrect": false}, {"id": "fDYJ0", "text": "$2 \\sin 6 x \\cdot \\cos 12 x$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\cos x \\cos 7 x-\\cos 5 x \\cos 13 x$\n$\\begin{array}{l}\n=\\frac{1}{2}(2 \\cos x \\cos 7 x-2 \\cos 5 x \\cos 13 x) \\\\\n=\\frac{1}{2}(\\cos 8 x+\\cos 6 x-\\cos 18 x-\\cos 8 x) \\\\\n=\\frac{1}{2}(\\cos 6 x-\\cos 18 x)=\\frac{1}{2}[(-2) \\sin 12 x \\sin (-6 x)] \\\\\n=\\sin 12 x \\sin 6 x=(2 \\sin 6 x \\cos 6 x) \\sin 6 x \\\\\n=2 \\sin ^{2} 6 x \\cos 6 x\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a2634d0279619d9d8a3dfb", "title": "Maximum and Minimum Values", "totalQuestions": 2, "questions": [{"_id": "68871bb0bf9280d7f9932b9c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The maximum value of the function $a \\sin x+\\mathrm{b} \\cos x$ is", "image": null}, "options": [{"id": "5ldW2", "text": "$\\sqrt{a^2+b^2}$", "image": null, "isCorrect": true}, {"id": "ySK1Y", "text": "$\\sqrt{a^2-b^2}$", "image": null, "isCorrect": false}, {"id": "LwtBk", "text": "$a^2+b^2$", "image": null, "isCorrect": false}, {"id": "guKKO", "text": "$a^2-b^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x) = a \\sin x + b \\cos x$<br><br>Multiply and divide by $\\sqrt{a^2+b^2}$:<br><br>$f(x) = \\sqrt{a^2+b^2} \\left( \\dfrac{a}{\\sqrt{a^2+b^2}} \\sin x + \\dfrac{b}{\\sqrt{a^2+b^2}} \\cos x \\right)$<br><br>Let $\\cos \\alpha = \\dfrac{a}{\\sqrt{a^2+b^2}}$ and $\\sin \\alpha = \\dfrac{b}{\\sqrt{a^2+b^2}}$<br><br>$f(x) = \\sqrt{a^2+b^2} (\\sin x \\cos \\alpha + \\cos x \\sin \\alpha)$<br><br>$f(x) = \\sqrt{a^2+b^2} \\sin(x + \\alpha)$<br><br>Since the maximum value of $\\sin(x + \\alpha)$ is $1$, the maximum value of $f(x)$ is $\\sqrt{a^2+b^2}$.<br><br>Answer: $\\sqrt{a^2+b^2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f270279619d9d8a1a2c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "$\\quad$ The maximum value of the function $y=e^{5+\\sqrt{3} \\sin x+\\cos x}$ is", "image": null}, "options": [{"id": "R4u0s", "text": "$e^{7}$", "image": null, "isCorrect": true}, {"id": "B8qLW", "text": "$e^{2}$", "image": null, "isCorrect": false}, {"id": "lhD80", "text": "$e^{5}$", "image": null, "isCorrect": false}, {"id": "OP1jD", "text": "$e^{8}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Maximum value of $\\sqrt{3} \\sin x+\\cos x$ is $\\sqrt{(\\sqrt{3})^{2}+(1)^{2}}=2$ \nHence maximum value of given function is $\\mathrm{e}^{5+2}=\\mathrm{e}^{7}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "65a2634d0279619d9d8a3dfe", "title": "Sum of three of more angles", "totalQuestions": 3, "questions": [{"_id": "679213b50aee93fa0796daea", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "If $\\mathrm{A}, \\mathrm{B}, \\mathrm{C}$ are the angles of a triangle with $\\tan \\dfrac{A}{2}=\\dfrac{1}{3}, \\tan \\dfrac{B}{2}=\\dfrac{2}{3}$ then the value of $\\tan \\dfrac{C}{2}$ is", "image": null}, "options": [{"id": "s5H4W", "text": "$\\dfrac{-7}{9}$", "image": null, "isCorrect": false}, {"id": "RpWEi", "text": "$\\dfrac{7}{9}$", "image": null, "isCorrect": true}, {"id": "Mr25n", "text": "$\\dfrac{9}{7}$", "image": null, "isCorrect": false}, {"id": "dOmWj", "text": "$\\dfrac{-9}{7}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In a triangle $A + B + C = \\pi$, which gives $\\dfrac{A}{2} + \\dfrac{B}{2} + \\dfrac{C}{2} = \\dfrac{\\pi}{2}$.<br><br>Using the identity for the half-angles of a triangle:<br><br>$\\tan \\dfrac{A}{2} \\tan \\dfrac{B}{2} + \\tan \\dfrac{B}{2} \\tan \\dfrac{C}{2} + \\tan \\dfrac{C}{2} \\tan \\dfrac{A}{2} = 1$<br><br>Substituting $\\tan \\dfrac{A}{2} = \\dfrac{1}{3}$ and $\\tan \\dfrac{B}{2} = \\dfrac{2}{3}$:<br><br>$\\left(\\dfrac{1}{3}\\right)\\left(\\dfrac{2}{3}\\right) + \\left(\\dfrac{2}{3}\\right)\\tan \\dfrac{C}{2} + \\tan \\dfrac{C}{2}\\left(\\dfrac{1}{3}\\right) = 1$<br><br>$\\dfrac{2}{9} + \\tan \\dfrac{C}{2} \\left(\\dfrac{2}{3} + \\dfrac{1}{3}\\right) = 1$<br><br>$\\dfrac{2}{9} + \\tan \\dfrac{C}{2} = 1$<br><br>$\\tan \\dfrac{C}{2} = 1 - \\dfrac{2}{9} = \\dfrac{7}{9}$<br><br>Answer: $\\dfrac{7}{9}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a00aee93fa0796da46", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "The sides of a triangle are $\\sin \\theta, \\cos \\theta$ and $\\sqrt{1+\\sin \\theta \\cos \\theta}$ for some $0 \\lt \\theta \\lt \\dfrac{\\pi}{2}$, then the greatest angle of a triangle is", "image": null}, "options": [{"id": "s1znw", "text": "$\\dfrac{\\pi}{3}$", "image": null, "isCorrect": false}, {"id": "vsKpW", "text": "$\\dfrac{2 \\pi}{3}$", "image": null, "isCorrect": true}, {"id": "Fk3b6", "text": "$\\dfrac{\\pi}{6}$", "image": null, "isCorrect": false}, {"id": "MhFTz", "text": "$\\dfrac{5 \\pi}{6}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the sides of the triangle be $a = \\sin \\theta$, $b = \\cos \\theta$, and $c = \\sqrt{1 + \\sin \\theta \\cos \\theta}$.<br><br>Since $0 < \\theta < \\dfrac{\\pi}{2}$, both $\\sin \\theta$ and $\\cos \\theta$ are positive.<br><br>We have $a^2 + b^2 = \\sin^2 \\theta + \\cos^2 \\theta = 1$.<br><br>Also, $c^2 = 1 + \\sin \\theta \\cos \\theta$.<br><br>Since $\\sin \\theta \\cos \\theta > 0$, $c^2 > 1 = a^2 + b^2$. This implies $c > a$ and $c > b$, making $c$ the largest side of the triangle.<br><br>The greatest angle $C$ is opposite to the largest side $c$. Using the cosine rule:<br><br>$\\cos C = \\dfrac{a^2 + b^2 - c^2}{2ab}$<br><br>Substituting the values of $a$, $b$, and $c$:<br><br>$\\cos C = \\dfrac{\\sin^2 \\theta + \\cos^2 \\theta - (1 + \\sin \\theta \\cos \\theta)}{2 \\sin \\theta \\cos \\theta}$<br><br>$\\cos C = \\dfrac{1 - 1 - \\sin \\theta \\cos \\theta}{2 \\sin \\theta \\cos \\theta}$<br><br>$\\cos C = \\dfrac{-\\sin \\theta \\cos \\theta}{2 \\sin \\theta \\cos \\theta} = -\\dfrac{1}{2}$<br><br>Since $C$ is an angle of a triangle, $0 < C < \\pi$. Therefore, $C = \\dfrac{2\\pi}{3}$.<br><br>Answer: $\\dfrac{2 \\pi}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261580279619d9d8a2bcd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "With usual notations in $\\triangle A B C$ if $a^2+b^2-c^2=a b$, then measure of angle $C$ is", "image": null}, "options": [{"id": "2edAE", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": false}, {"id": "cejuW", "text": "$\\frac{\\pi}{6}$", "image": null, "isCorrect": false}, {"id": "IjbL1", "text": "$\\frac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "Z3xUx", "text": "$\\frac{\\pi}{3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & a^2+b^2-c^2=a b \\\\ & \\Rightarrow \\frac{a^2+b^2-c^2}{2 a b}=\\frac{1}{2} \\\\ & \\Rightarrow \\cos c=\\frac{1}{2} \\\\ & \\Rightarrow c=\\frac{\\pi}{3}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "6792167c0aee93fa0796e193", "title": "Trigonometric Series", "totalQuestions": 3, "questions": [{"_id": "6a44d2e58c30a4553e1bddf9", "type": "singleCorrect", "question": {"text": "If $33\\theta = \\pi$, then the value of $\\cos\\theta \\cos2\\theta \\cos4\\theta \\cos8\\theta \\cos16\\theta$ is", "image": null}, "options": [{"id": "GwLVj", "label": "A", "text": "$\\dfrac{1}{16}$", "isCorrect": false, "image": null}, {"id": "rTKzZ", "label": "B", "text": "$\\dfrac{1}{32}$", "isCorrect": true, "image": null}, {"id": "rs5vr", "label": "C", "text": "$\\dfrac{1}{64}$", "isCorrect": false, "image": null}, {"id": "YLnda", "label": "D", "text": "$\\dfrac{-1}{32}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $P = \\cos\\theta \\cos2\\theta \\cos4\\theta \\cos8\\theta \\cos16\\theta$<br><br>Multiplying and dividing by $2\\sin\\theta$, we get:<br><br>$P = \\dfrac{2\\sin\\theta \\cos\\theta \\cos2\\theta \\cos4\\theta \\cos8\\theta \\cos16\\theta}{2\\sin\\theta}$<br><br>Using the identity $\\sin(2x) = 2\\sin x \\cos x$ repeatedly:<br><br>$P = \\dfrac{\\sin2\\theta \\cos2\\theta \\cos4\\theta \\cos8\\theta \\cos16\\theta}{2\\sin\\theta}$<br><br>$P = \\dfrac{\\sin4\\theta \\cos4\\theta \\cos8\\theta \\cos16\\theta}{4\\sin\\theta}$<br><br>$P = \\dfrac{\\sin8\\theta \\cos8\\theta \\cos16\\theta}{8\\sin\\theta}$<br><br>$P = \\dfrac{\\sin16\\theta \\cos16\\theta}{16\\sin\\theta}$<br><br>$P = \\dfrac{\\sin32\\theta}{32\\sin\\theta}$<br><br>Given $33\\theta = \\pi$, we have $32\\theta = \\pi - \\theta$<br><br>Therefore, $\\sin32\\theta = \\sin(\\pi - \\theta) = \\sin\\theta$<br><br>Substituting this back into the expression for $P$:<br><br>$P = \\dfrac{\\sin\\theta}{32\\sin\\theta} = \\dfrac{1}{32}$<br><br>Answer: $\\dfrac{1}{32}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143d0aee93fa0796df12", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "The maximum value of $\\left(\\cos \\alpha_1\\right) \\cdot\\left(\\cos \\alpha_2\\right) \\ldots\\left(\\cos \\alpha_n\\right)$ under the constraints $0 \\leq \\alpha_1, \\alpha_2, \\ldots, \\alpha_n \\leq \\frac{\\pi}{2}$ and $\\left(\\cot \\alpha_1\\right) \\cdot\\left(\\cot \\alpha_2\\right) \\ldots\\left(\\cot \\alpha_n\\right)=1$ is", "image": null}, "options": [{"id": "iBojC", "text": "$\\frac{1}{2^{\\left(\\frac{\\mathrm{n}}{2}\\right)}}$", "image": null, "isCorrect": true}, {"id": "eTYFR", "text": "$\\frac{1}{2^{\\mathrm{n}}}$", "image": null, "isCorrect": false}, {"id": "woRhT", "text": "$2^n$", "image": null, "isCorrect": false}, {"id": "KhzDk", "text": "$2^{\\frac{n}{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\prod_{i=1}^{n} \\cot \\alpha_i = 1$.<br><br>The expression to be maximized is $P = \\prod_{i=1}^{n} \\cos \\alpha_i$.<br><br>Using the identity $\\cos^2 \\alpha_i = \\dfrac{\\cot^2 \\alpha_i}{1 + \\cot^2 \\alpha_i}$.<br><br>Let $y_i = \\cot^2 \\alpha_i$. Since $\\prod_{i=1}^{n} \\cot \\alpha_i = 1$, we have $\\prod_{i=1}^{n} y_i = 1$.<br><br>The square of the expression is:<br><br>$P^2 = \\prod_{i=1}^{n} \\dfrac{y_i}{1 + y_i} = \\dfrac{\\prod_{i=1}^{n} y_i}{\\prod_{i=1}^{n} (1 + y_i)} = \\dfrac{1}{\\prod_{i=1}^{n} (1 + y_i)}$<br><br>To maximize $P^2$, the denominator $\\prod_{i=1}^{n} (1 + y_i)$ must be minimized.<br><br>Using the AM-GM inequality for $1$ and $y_i$ (since $y_i \\geq 0$):<br><br>$\\dfrac{1 + y_i}{2} \\geq \\sqrt{y_i} \\Rightarrow 1 + y_i \\geq 2\\sqrt{y_i}$<br><br>Multiplying these inequalities for $i = 1, 2, \\ldots, n$:<br><br>$\\prod_{i=1}^{n} (1 + y_i) \\geq 2^n \\prod_{i=1}^{n} \\sqrt{y_i}$<br><br>$\\prod_{i=1}^{n} (1 + y_i) \\geq 2^n \\sqrt{\\prod_{i=1}^{n} y_i}$<br><br>Since $\\prod_{i=1}^{n} y_i = 1$, we get:<br><br>$\\prod_{i=1}^{n} (1 + y_i) \\geq 2^n$<br><br>Therefore, the maximum value of $P^2$ is:<br><br>$P^2 \\leq \\dfrac{1}{2^n}$<br><br>Taking the square root (since $P > 0$):<br><br>$P \\leq \\dfrac{1}{2^{\\left(\\dfrac{n}{2}\\right)}}$<br><br>Equality holds when $y_i = 1$ for all $i$, which means $\\cot \\alpha_i = 1 \\Rightarrow \\alpha_i = \\dfrac{\\pi}{4}$.<br><br>Answer: $\\frac{1}{2^{\\left(\\frac{\\mathrm{n}}{2}\\right)}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a50aee93fa0796da68", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "For the triangle ABC , with usual notations, if the angles $A, B, C$ are in A.P. and $\\mathrm{m} \\angle \\mathrm{A}=30^{\\circ}, \\mathrm{c}=3$, then the values of a and b are respectively", "image": null}, "options": [{"id": "1n5ar", "text": "$\\dfrac{\\sqrt{3}}{2}, \\dfrac{3}{2}$", "image": null, "isCorrect": false}, {"id": "3Am8Q", "text": "$\\dfrac{3}{2}, \\dfrac{3 \\sqrt{3}}{2}$", "image": null, "isCorrect": true}, {"id": "Qc6pi", "text": "$\\dfrac{3 \\sqrt{3}}{2}, \\dfrac{3}{2}$", "image": null, "isCorrect": false}, {"id": "QEgeI", "text": "$\\dfrac{3}{2}, \\dfrac{\\sqrt{3}}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given that the angles $A, B, C$ are in A.P.<br><br>$2B = A + C$<br><br>Since $A + B + C = 180^{\\circ}$, we have $3B = 180^{\\circ} \\Rightarrow B = 60^{\\circ}$.<br><br>Given $\\angle A = 30^{\\circ}$, we can find $C$ as:<br><br>$C = 180^{\\circ} - (30^{\\circ} + 60^{\\circ}) = 90^{\\circ}$<br><br>Using the sine rule:<br><br>$\\dfrac{a}{\\sin A} = \\dfrac{b}{\\sin B} = \\dfrac{c}{\\sin C}$<br><br>Substituting the known values:<br><br>$\\dfrac{a}{\\sin 30^{\\circ}} = \\dfrac{b}{\\sin 60^{\\circ}} = \\dfrac{3}{\\sin 90^{\\circ}}$<br><br>$\\dfrac{a}{\\dfrac{1}{2}} = \\dfrac{b}{\\dfrac{\\sqrt{3}}{2}} = \\dfrac{3}{1} = 3$<br><br>Solving for $a$ and $b$:<br><br>$a = 3 \\times \\dfrac{1}{2} = \\dfrac{3}{2}$<br><br>$b = 3 \\times \\dfrac{\\sqrt{3}}{2} = \\dfrac{3\\sqrt{3}}{2}$<br><br>Answer: $\\dfrac{3}{2}, \\dfrac{3 \\sqrt{3}}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 9, "topicId": "65a2634d0279619d9d8a3dfa", "title": "Number of Solutions", "totalQuestions": 9, "questions": [{"_id": "679214020aee93fa0796dd46", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "The number of solutions of $\\tan x+\\sec x=2 \\cos x$ in $[0,2 \\pi]$ is", "image": null}, "options": [{"id": "sD7B0", "text": "2", "image": null, "isCorrect": true}, {"id": "KZRGv", "text": "3", "image": null, "isCorrect": false}, {"id": "kcox2", "text": "0", "image": null, "isCorrect": false}, {"id": "b8zJs", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation is $\\tan x + \\sec x = 2 \\cos x$.<br><br>Rewriting in terms of sine and cosine, we get:<br><br>$\\dfrac{\\sin x}{\\cos x} + \\dfrac{1}{\\cos x} = 2 \\cos x$<br><br>For the equation to be defined, $\\cos x \\neq 0$. Multiplying both sides by $\\cos x$, we get:<br><br>$\\sin x + 1 = 2 \\cos^2 x$<br><br>Using the identity $\\cos^2 x = 1 - \\sin^2 x$:<br><br>$\\sin x + 1 = 2(1 - \\sin^2 x)$<br><br>$\\Rightarrow 2 \\sin^2 x + \\sin x - 1 = 0$<br><br>$\\Rightarrow (2 \\sin x - 1)(\\sin x + 1) = 0$<br><br>This gives $\\sin x = \\dfrac{1}{2}$ or $\\sin x = -1$.<br><br>For $\\sin x = \\dfrac{1}{2}$, the solutions in $[0, 2\\pi]$ are $x = \\dfrac{\\pi}{6}$ and $x = \\dfrac{5\\pi}{6}$. For both values, $\\cos x \\neq 0$, so they are valid solutions.<br><br>For $\\sin x = -1$, the solution in $[0, 2\\pi]$ is $x = \\dfrac{3\\pi}{2}$. However, at $x = \\dfrac{3\\pi}{2}$, $\\cos x = 0$, which makes $\\tan x$ and $\\sec x$ undefined. Thus, this solution is rejected.<br><br>Therefore, there are exactly $2$ valid solutions.<br><br>Answer: 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b80aee93fa0796dafc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "The number of solutions, of $2^{1+|\\cos x|+|\\cos x|^2+\\ldots \\ldots \\ldots \\cdots}=4$ in $(-\\pi, \\pi)$, is", "image": null}, "options": [{"id": "6v94Z", "text": "2", "image": null, "isCorrect": false}, {"id": "bFdjQ", "text": "3", "image": null, "isCorrect": false}, {"id": "MISSx", "text": "4", "image": null, "isCorrect": true}, {"id": "xXsAj", "text": "6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation is $2^{1+|\\cos x|+|\\cos x|^2+\\ldots} = 4$.<br><br>The exponent is an infinite geometric progression with first term $a=1$ and common ratio $r=|\\cos x|$. For the sum to be finite, we must have $|\\cos x| < 1$.<br><br>The sum of the infinite geometric progression is $S = \\dfrac{1}{1 - |\\cos x|}$.<br><br>Substituting this into the equation gives $2^{\\dfrac{1}{1 - |\\cos x|}} = 2^2$.<br><br>Equating the exponents, we get $\\dfrac{1}{1 - |\\cos x|} = 2$.<br><br>$1 - |\\cos x| = \\dfrac{1}{2}$<br><br>$|\\cos x| = \\dfrac{1}{2}$<br><br>This gives $\\cos x = \\dfrac{1}{2}$ or $\\cos x = -\\dfrac{1}{2}$.<br><br>In the interval $(-\\pi, \\pi)$, the solutions for $\\cos x = \\dfrac{1}{2}$ are $x = \\dfrac{\\pi}{3}, -\\dfrac{\\pi}{3}$.<br><br>The solutions for $\\cos x = -\\dfrac{1}{2}$ are $x = \\dfrac{2\\pi}{3}, -\\dfrac{2\\pi}{3}$.<br><br>Thus, there are $4$ solutions in the given interval.<br><br>Answer: 4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a40aee93fa0796da61", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "In $(0,2 \\pi)$, the number of solutions of $\\tan \\theta+\\sec \\theta=2 \\cos \\theta$ is", "image": null}, "options": [{"id": "BqBMg", "text": "0", "image": null, "isCorrect": false}, {"id": "OMDiQ", "text": "1", "image": null, "isCorrect": false}, {"id": "KQ6hv", "text": "3", "image": null, "isCorrect": false}, {"id": "FvTqi", "text": "2", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given equation is $\\tan \\theta + \\sec \\theta = 2 \\cos \\theta$.<br><br>Rewriting in terms of sine and cosine:<br><br>$\\dfrac{\\sin \\theta}{\\cos \\theta} + \\dfrac{1}{\\cos \\theta} = 2 \\cos \\theta$<br><br>For the equation to be defined, $\\cos \\theta \\neq 0$, which implies $\\theta \\neq \\dfrac{\\pi}{2}, \\dfrac{3\\pi}{2}$.<br><br>Multiplying both sides by $\\cos \\theta$:<br><br>$\\sin \\theta + 1 = 2 \\cos^2 \\theta$<br><br>Using the identity $\\cos^2 \\theta = 1 - \\sin^2 \\theta$:<br><br>$\\sin \\theta + 1 = 2(1 - \\sin^2 \\theta)$<br><br>$2 \\sin^2 \\theta + \\sin \\theta - 1 = 0$<br><br>Factorizing the quadratic equation:<br><br>$(2 \\sin \\theta - 1)(\\sin \\theta + 1) = 0$<br><br>This gives $\\sin \\theta = \\dfrac{1}{2}$ or $\\sin \\theta = -1$.<br><br>If $\\sin \\theta = -1$, then $\\theta = \\dfrac{3\\pi}{2}$, which is rejected since $\\cos \\theta \\neq 0$.<br><br>If $\\sin \\theta = \\dfrac{1}{2}$, the solutions in the interval $(0, 2\\pi)$ are $\\theta = \\dfrac{\\pi}{6}$ and $\\theta = \\dfrac{5\\pi}{6}$.<br><br>Thus, there are exactly $2$ solutions.<br><br>Answer: 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213540aee93fa0796d7f0", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "Let $\\mathrm{S}=\\left\\{x \\in(-\\pi, \\pi) \\mid x \\neq 0, \\pm \\dfrac{\\pi}{2}\\right\\}$. The sum of all distinct solutions of the equation $\\sqrt{3} \\sec x+\\operatorname{cosec} x+2(\\tan x-\\cot x)=0$ in the set S is equal to", "image": null}, "options": [{"id": "9U2xf", "text": "$-\\dfrac{7 \\pi}{9}$", "image": null, "isCorrect": false}, {"id": "dnbVE", "text": "$-\\dfrac{2 \\pi}{9}$", "image": null, "isCorrect": false}, {"id": "nV4VP", "text": "0", "image": null, "isCorrect": true}, {"id": "1ZIfe", "text": "$\\dfrac{5 \\pi}{9}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation is:<br><br>$\\sqrt{3} \\sec x + \\operatorname{cosec} x + 2(\\tan x - \\cot x) = 0$<br><br>Converting the terms to sine and cosine:<br><br>$\\dfrac{\\sqrt{3}}{\\cos x} + \\dfrac{1}{\\sin x} + 2\\left(\\dfrac{\\sin x}{\\cos x} - \\dfrac{\\cos x}{\\sin x}\\right) = 0$<br><br>Multiplying the entire equation by $\\sin x \\cos x$ (which is non-zero for $x \\in S$):<br><br>$\\sqrt{3} \\sin x + \\cos x + 2(\\sin^2 x - \\cos^2 x) = 0$<br><br>Using the double angle identity $\\cos 2x = \\cos^2 x - \\sin^2 x$:<br><br>$\\sqrt{3} \\sin x + \\cos x - 2 \\cos 2x = 0$<br><br>$\\sqrt{3} \\sin x + \\cos x = 2 \\cos 2x$<br><br>Dividing both sides by 2:<br><br>$\\dfrac{\\sqrt{3}}{2} \\sin x + \\dfrac{1}{2} \\cos x = \\cos 2x$<br><br>$\\cos x \\cos \\dfrac{\\pi}{3} + \\sin x \\sin \\dfrac{\\pi}{3} = \\cos 2x$<br><br>$\\cos\\left(x - \\dfrac{\\pi}{3}\\right) = \\cos 2x$<br><br>The general solution is given by:<br><br>$2x = 2n\\pi \\pm \\left(x - \\dfrac{\\pi}{3}\\right)$, where $n \\in \\mathbb{Z}$<br><br>Taking the positive sign:<br><br>$2x = 2n\\pi + x - \\dfrac{\\pi}{3}$<br><br>$x = 2n\\pi - \\dfrac{\\pi}{3}$<br><br>For $x \\in (-\\pi, \\pi)$, the only valid solution is for $n = 0$:<br><br>$x_1 = -\\dfrac{\\pi}{3}$<br><br>Taking the negative sign:<br><br>$2x = 2n\\pi - x + \\dfrac{\\pi}{3}$<br><br>$3x = 2n\\pi + \\dfrac{\\pi}{3}$<br><br>$x = \\dfrac{2n\\pi}{3} + \\dfrac{\\pi}{9}$<br><br>For $x \\in (-\\pi, \\pi)$, the valid solutions are:<br><br>For $n = 0$, $x_2 = \\dfrac{\\pi}{9}$<br><br>For $n = 1$, $x_3 = \\dfrac{2\\pi}{3} + \\dfrac{\\pi}{9} = \\dfrac{7\\pi}{9}$<br><br>For $n = -1$, $x_4 = -\\dfrac{2\\pi}{3} + \\dfrac{\\pi}{9} = -\\dfrac{5\\pi}{9}$<br><br>All these solutions are distinct and belong to the set $S$ since none of them are $0$ or $\\pm \\dfrac{\\pi}{2}$.<br><br>The sum of all distinct solutions is:<br><br>$x_1 + x_2 + x_3 + x_4 = -\\dfrac{\\pi}{3} + \\dfrac{\\pi}{9} + \\dfrac{7\\pi}{9} - \\dfrac{5\\pi}{9}$<br><br>$= \\dfrac{-3\\pi + \\pi + 7\\pi - 5\\pi}{9} = 0$<br><br>Answer: 0", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792132f0aee93fa0796d6ca", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "The principal solutions, of the equation $\\sqrt{3} \\sec x+2=0$, are", "image": null}, "options": [{"id": "ZTggp", "text": "$\\dfrac{2 \\pi}{3}, \\dfrac{4 \\pi}{3}$", "image": null, "isCorrect": false}, {"id": "xyITO", "text": "$\\dfrac{4 \\pi}{3}, \\dfrac{5 \\pi}{3}$", "image": null, "isCorrect": false}, {"id": "CvHm4", "text": "$\\dfrac{5 \\pi}{6}, \\dfrac{7 \\pi}{6}$", "image": null, "isCorrect": true}, {"id": "yl8Zf", "text": "$\\dfrac{7 \\pi}{6}, \\dfrac{11 \\pi}{6}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation is $\\sqrt{3} \\sec x + 2 = 0$<br><br>$\\Rightarrow \\sec x = -\\dfrac{2}{\\sqrt{3}}$<br><br>$\\Rightarrow \\cos x = -\\dfrac{\\sqrt{3}}{2}$<br><br>Since $\\cos x$ is negative, $x$ lies in the second or third quadrant.<br><br>We know that $\\cos \\left( \\dfrac{\\pi}{6} \\right) = \\dfrac{\\sqrt{3}}{2}$<br><br>In the second quadrant, $x = \\pi - \\dfrac{\\pi}{6} = \\dfrac{5\\pi}{6}$<br><br>In the third quadrant, $x = \\pi + \\dfrac{\\pi}{6} = \\dfrac{7\\pi}{6}$<br><br>The principal solutions are $\\dfrac{5\\pi}{6}$ and $\\dfrac{7\\pi}{6}$.<br><br>Answer: $\\dfrac{5 \\pi}{6}, \\dfrac{7 \\pi}{6}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "que Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f740279619d9d8a1c9b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "The general solution of $\\tan 3 x=1$ is", "image": null}, "options": [{"id": "mrJZf", "text": "$x=n \\pi, n \\in Z$", "image": null, "isCorrect": false}, {"id": "JRJKb", "text": "$x=n\\left(\\frac{\\pi}{3}\\right)+\\frac{\\pi}{12}, n \\in Z$", "image": null, "isCorrect": true}, {"id": "rp96g", "text": "$x=n \\pi+\\frac{\\pi}{4}, n \\in Z$", "image": null, "isCorrect": false}, {"id": "bE5Pa", "text": "$x=n \\pi \\pm \\frac{\\pi}{4}, n \\in Z$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that $\\tan \\theta=\\tan \\alpha$ implies\n$\\theta=n \\pi+\\alpha$, where $n \\in Z$\nGiven $\\tan 3 x=1$\n$\\therefore \\tan 3 x=\\tan \\frac{\\pi}{4} \\Rightarrow 3 x=n \\pi+\\frac{\\pi}{4}$\n$\\therefore \\quad \\mathrm{x}=\\frac{\\mathrm{n} \\pi}{3}+\\frac{\\pi}{12}, \\quad \\mathrm{n} \\in Z$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f260279619d9d8a1a2a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "If $\\cos 2 \\theta=\\sin \\propto, \\quad$ then $\\theta=$", "image": null}, "options": [{"id": "2gKuJ", "text": "$2 n \\pi \\pm\\left(\\frac{\\pi}{2}-\\alpha\\right), n \\in z$", "image": null, "isCorrect": false}, {"id": "SaOXa", "text": "$n \\pi \\pm\\left(\\frac{\\pi}{4}+\\frac{\\alpha}{2}\\right), n \\in z$", "image": null, "isCorrect": false}, {"id": "ufkjD", "text": "$\\frac{1}{2}\\left[n \\pi+(-1)^{n} \\propto\\right], n \\in z$", "image": null, "isCorrect": false}, {"id": "HbduW", "text": "$n \\pi \\pm\\left(\\frac{\\pi}{4}-\\frac{\\alpha}{2}\\right), n \\in z$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We have $\\cos 2 \\theta=\\sin \\alpha \\Rightarrow \\cos 2 \\theta=\\cos (90-\\alpha)$ When $\\cos \\theta=\\cos \\alpha$, we get $\\theta=2 n \\pi \\pm \\alpha, n \\in Z$ $\\therefore \\quad 2 \\theta=2 \\mathrm{n} \\pi \\pm(90-\\alpha)$\n$\\theta=\\frac{2 n \\pi}{2} \\pm\\left(\\frac{90-\\alpha}{2}\\right) \\Rightarrow \\theta=n \\pi \\pm\\left(\\frac{\\pi}{4}-\\frac{\\alpha}{2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
