e points $\\mathrm{A}$ and $\\mathrm{C}$ have same $y$ co-ordinates i.e. 3 ,\nthe given points lie on the line $y=3$.\nSince the equation $\\mathrm{FE}$ passes through $\\mathrm{E}(1,3)$, the equation of $\\mathrm{FE}$ is $x=1$.\nTo find co-ordinates of circumcentre, we have to solve equations (i) and (ii).\nSubstituting the value of $x$ in (i), we get\n$\\begin{array}{ll} \n& 1-2 y-3=0 \\\\\n\\therefore \\quad & y=-1 \\\\\n\\therefore \\quad & \\text { Co-ordinates of circumcentre } \\mathrm{F} \\equiv(1,-1) .\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ee0279619d9d8a3077", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "Two sides of a square are along the lines $5 x-12 y+39=0$ and $5 x-12 y+78=0$, then area of the square is", "image": null}, "options": [{"id": "HgKPR", "text": "9 sq. units.", "image": null, "isCorrect": true}, {"id": "0wQmx", "text": "$\\frac{1}{3}$ sq. units.", "image": null, "isCorrect": false}, {"id": "8ZCaF", "text": "18 sq. units.", "image": null, "isCorrect": false}, {"id": "kPw9Q", "text": "3 sq. units.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equations of lines are $5 x-12 y+39=0$ and $5 x-12 y+78=0$.\nSlope of $5 x-12 y+39=0$ is $\\frac{5}{12}$\nSlope of $5 x-12 y+78=0$ is $\\frac{5}{12}$\n$\\therefore \\quad$ Lines are parallel.\n$\\therefore \\quad$ Distance between two parallel lines $=\\left|\\frac{\\mathrm{c}_1-\\mathrm{c}_2}{\\sqrt{\\mathrm{a}^2+\\mathrm{b}^2}}\\right|$\n$\\begin{aligned}\n& =\\left|\\frac{39-78}{\\sqrt{5^2+(-12)^2}}\\right| \\\\\n& =3 \\text { units }\n\\end{aligned}$\n$\\therefore \\quad$ Side of the square $=3$ units\n$\\therefore \\quad$ Area of square $=3^2=9$ sq. units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e00279619d9d8a3007", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "$\\mathrm{ABC}$ is a triangle in a plane with vertices $\\mathrm{A}(2,3,5), \\mathrm{B}(-1,3,2)$ and $\\mathrm{C}(\\lambda, 5, \\mu)$. If median through $\\mathrm{A}$ is equally inclined to the co-ordinate axes, then value of $\\lambda+\\mu$ is", "image": null}, "options": [{"id": "Y4hhH", "text": "17", "image": null, "isCorrect": true}, {"id": "hb3ru", "text": "10", "image": null, "isCorrect": false}, {"id": "b3tnw", "text": "7", "image": null, "isCorrect": false}, {"id": "tK6cH", "text": "3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\mathrm{AD}$ be the median\n$\\therefore \\quad$ Co-ordinates of\n$\\begin{aligned}\n& \\mathrm{D} \\equiv\\left(\\frac{x_1+x_2}{2}, \\frac{y_1+y_2}{2}, \\frac{\\mathrm{z}_1+\\mathrm{z}_2}{2}\\right) \\\\\n& \\mathrm{D} \\equiv\\left(\\frac{\\lambda-1}{2}, 4, \\frac{\\mu+2}{2}\\right) \\\\\n\\therefore \\quad & \\overline{\\mathrm{AD}}=\\left(\\frac{\\lambda-1}{2}-2\\right) \\hat{\\mathrm{i}}+(4-3) \\hat{\\mathrm{j}}+\\left(\\frac{\\mu+2}{2}-5\\right) \\hat{\\mathrm{k}} \\\\\n\\therefore \\quad & \\overline{\\mathrm{AD}}=\\left(\\frac{\\lambda-5}{2}\\right) \\hat{\\mathrm{i}}+\\hat{\\mathrm{j}}+\\left(\\frac{\\mu-8}{2}\\right) \\hat{\\mathrm{k}}\n\\end{aligned}$\nSince $\\mathrm{AD}$ makes equal angle with co-ordinate axes, the direction ratios are equal.\n$\\therefore \\quad \\frac{\\lambda-5}{2}=1=\\frac{\\mu-8}{2}$\nConsider,\n$\\begin{aligned}\n& \\frac{\\lambda-5}{2}=1 \\\\\n& \\Rightarrow \\lambda-5=2\n\\end{aligned}$\n$\\begin{aligned} & \\Rightarrow \\lambda=7 \\\\ & \\text { and } \\frac{\\mu-8}{2}=1 \\\\ & \\Rightarrow \\mu-8=2 \\\\ & \\Rightarrow \\mu=10 \\\\ & \\therefore \\quad \\lambda+\\mu=7+10=17 \\\\ & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261dc0279619d9d8a2fed", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "If one side of a triangle is double the other and the angles opposite to these sides differ by $60^{\\circ}$, then the triangle is", "image": null}, "options": [{"id": "5xlQy", "text": "obtuse angled", "image": null, "isCorrect": false}, {"id": "zDpB8", "text": "right angled", "image": null, "isCorrect": true}, {"id": "3cLb1", "text": "acute angled", "image": null, "isCorrect": false}, {"id": "DskA4", "text": "isosceles", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "In $\\triangle \\mathrm{ABC}$, by sine rule,\n$\\frac{\\sin A}{a}=\\frac{\\sin B}{b}=\\frac{\\sin C}{c}$\nAccording to the given condition,\nIn $\\triangle \\mathrm{ABC}, \\mathrm{a}=2 \\mathrm{~b}$ and\n$\\begin{aligned}\n& \\mathrm{A}-\\mathrm{B}=60^{\\circ} \\Rightarrow \\mathrm{A}=60^{\\circ}+\\mathrm{B} \\\\\n& \\Rightarrow \\frac{\\sin \\left(60^{\\circ}+\\mathrm{B}\\right)}{2 \\mathrm{~b}}=\\frac{\\sin \\mathrm{B}}{\\mathrm{b}} \\\\\n& \\Rightarrow \\frac{\\sin \\mathrm{B}}{\\sin \\left(\\mathrm{B}+60^{\\circ}\\right)}=\\frac{1}{2} \\\\\n& \\Rightarrow 2 \\sin \\mathrm{B}=\\sin \\mathrm{B} \\cos 60^{\\circ}+\\cos \\mathrm{B} \\sin 60^{\\circ} \\\\\n& \\Rightarrow 2 \\sin \\mathrm{B}=\\sin \\mathrm{B}\\left(\\frac{1}{2}\\right)+\\cos \\mathrm{B}\\left(\\frac{\\sqrt{3}}{2}\\right) \\\\\n& \\Rightarrow \\frac{3}{2} \\sin \\mathrm{B}=\\frac{\\sqrt{3}}{2} \\cos \\mathrm{B}\n\\end{aligned}$\n$\\begin{aligned}\n& \\Rightarrow \\tan \\mathrm{B}=\\frac{1}{\\sqrt{3}} \\Rightarrow \\mathrm{B}=30^{\\circ} \\\\\n& \\therefore \\quad \\mathrm{A}=30^{\\circ}+60^{\\circ}=90^{\\circ}\n\\end{aligned}$\n$\\therefore \\quad \\triangle \\mathrm{ABC}$ is right angled.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261920279619d9d8a2da6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "If $A \\equiv(5,1, p), B \\equiv(1, q, p)$ and $C \\equiv(1,-2,3)$ are vertices of the triangle and $G \\equiv\\left(r,-\\frac{4}{3}, \\frac{1}{3}\\right)$ is its centroid, then the values of $p, q, r$ are respectively", "image": null}, "options": [{"id": "G9UIG", "text": "$-1,3, \\frac{7}{3}$", "image": null, "isCorrect": false}, {"id": "6fzkR", "text": "$1,3, \\frac{7}{3}$", "image": null, "isCorrect": false}, {"id": "dK6S0", "text": "$1,-3, \\frac{7}{3}$", "image": null, "isCorrect": false}, {"id": "cwO6K", "text": "$-1,-3, \\frac{7}{3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\left(r, \\frac{-4}{3}, \\frac{1}{3}\\right) \\equiv\\left(\\frac{5+1+1}{3}, \\frac{1+q-2}{3}, \\frac{p+p+3}{3}\\right) \\\\ & \\Rightarrow r=\\frac{7}{3}, \\frac{-4}{3}=\\frac{q-1}{3}, \\frac{1}{3}=\\frac{2 p+3}{3} \\\\ & \\Rightarrow p=-1, q=-3, r=\\frac{7}{3}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261920279619d9d8a2da0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "The orthocentre and centroid of triangle are $A(-3,5)$ and $B(3,3)$ respectively. If $C$ is the circumcenter of this triangle, then the radius of the circle having line segment $A C$ as a diameter, is units.", "image": null}, "options": [{"id": "zyxW8", "text": "$\\sqrt{10}$", "image": null, "isCorrect": false}, {"id": "uzhNn", "text": "$3 \\sqrt{\\frac{5}{2}}$", "image": null, "isCorrect": true}, {"id": "TxdQs", "text": "$2 \\sqrt{10}$", "image": null, "isCorrect": false}, {"id": "wzr2E", "text": "$\\frac{3 \\sqrt{5}}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Circumcentre divides orthocentre $A(-3,0)$ and centroid $B(3,3)$ externally in the ratio 3:1\nHence, $C \\equiv\\left(\\frac{3 \\times 3-1 \\times(-3)}{3-1}, \\frac{3 \\times 3-1 \\times 5}{3-1}\\right) \\equiv(6,2)$\nNow required radius $=\\frac{1}{2} A C=\\frac{1}{2} \\sqrt{(6+3)^2+(2-5)^2}=3 \\sqrt{\\frac{5}{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2616e0279619d9d8a2c7f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "The Centroid of the triangle formed by the lines $6 x^2+x y-y^2=0$ and $x+3 y-10=0$ is", "image": null}, "options": [{"id": "zwhsC", "text": "$\\left(\\frac{1}{3}, \\frac{7}{3}\\right)$", "image": null, "isCorrect": false}, {"id": "f9jxI", "text": "$\\left(-\\frac{1}{3}, \\frac{-7}{3}\\right)$", "image": null, "isCorrect": false}, {"id": "sYebD", "text": "$\\left(-\\frac{1}{3}, \\frac{7}{3}\\right)$", "image": null, "isCorrect": true}, {"id": "ZS6tH", "text": "$\\left(\\frac{1}{3}, \\frac{-7}{3}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & 6 x^2+x y-y^2=0 \\\\ & \\Rightarrow(3 x-y)(2 x+y)=0 \\\\ & \\Rightarrow 3 x-y=0,2 x+y=0 \\\\ & \\Rightarrow L_1 \\equiv 3 x-y=0, L_2 \\equiv 2 x+y=0 \\text { and } L_3 \\equiv x+3 y=10 \\\\ & \\text { point of intersection of } \\\\ & L_1 \\text { and } L_2 \\text { is }(0,0), L_2 \\text { and } L_3 \\text { is }(-2,4), L_3 \\text { and } L_1 \\text { is }(1,3) \\\\ & \\Rightarrow \\text { centroid of triangle } \\equiv\\left(\\frac{0-2+1}{3}, \\frac{0+4+3}{3}\\right) \\equiv\\left(\\frac{-1}{3}, \\frac{7}{3}\\right)\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261120279619d9d8a298f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "If $\\mathrm{A} \\equiv(\\mathrm{x}, 4,-1), \\mathrm{B} \\equiv(3, \\mathrm{x},-5)$ and $\\mathrm{C} \\equiv(2,-2,3)$ are the vertices and $\\mathrm{G} \\equiv(2,1,-1)$ is the centroid of the triangle $A B C$, then the value of $x$ is", "image": null}, "options": [{"id": "Xuq7O", "text": "3", "image": null, "isCorrect": false}, {"id": "rvsSw", "text": "1", "image": null, "isCorrect": true}, {"id": "RwXcT", "text": "$-2$", "image": null, "isCorrect": false}, {"id": "iOigP", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & G \\equiv\\left(\\frac{x+3+2}{3}, \\frac{4+x-2}{3}, \\frac{-1-5+3}{3}\\right) \\equiv(2,1,-1) \\\\ & \\Rightarrow x=1\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2610e0279619d9d8a2975", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "The orthocenter of the triangle formed by the lines $x-2 y=10$ and $6 x^2+x y-y^2=0$ is", "image": null}, "options": [{"id": "lWWuy", "text": "$(2,-4)$", "image": null, "isCorrect": true}, {"id": "Bqkao", "text": "$(2,4)$", "image": null, "isCorrect": false}, {"id": "4rYVn", "text": "$(-2,-4)$", "image": null, "isCorrect": false}, {"id": "gTAiE", "text": "$(-2,4)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & 6 x^2+x y-y^2=0 \\\\ & \\Rightarrow(2 x+y)(3 x-y)=0 \\\\ & \\Rightarrow 3 x-y=0 \\text { and } 2 x+y=0 \\text { and } x-2 y=10 \\\\ & \\because 2 x+y=0 \\text { and } x-2 y=10 \\text { are perpendicular }\\end{aligned}$\nHence, orthocentre is point of intersection $2 x+y=0$ and $x-2 y=10$ i.e. $(2,-4)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260d90279619d9d8a27cb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "If $\\mathrm{G}(3,-5, \\mathrm{r})$ is the centroid of $\\triangle \\mathrm{ABC}$, where $\\mathrm{A} \\equiv(7,-8,1)$, $B \\equiv(p, q, 5), C \\equiv(q+1,5 p, 0)$ are vertices of the triangle $A B C$, then the values of $p, q, r$ are respectively", "image": null}, "options": [{"id": "BLFk2", "text": "-2,3,2", "image": null, "isCorrect": true}, {"id": "hsm73", "text": "-4,5,4", "image": null, "isCorrect": false}, {"id": "rArif", "text": "6,5,4", "image": null, "isCorrect": false}, {"id": "WJxYX", "text": "2,-2,3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{A}(7,-8,1) ; \\mathrm{B}(\\mathrm{p}, \\mathrm{q}, 5)$ and $\\mathrm{C}(\\mathrm{q}+1,5 \\mathrm{p}, 0)$ are vertices of $\\triangle \\mathrm{ABC}$ having centroid $\\mathrm{G}(3,-5, \\mathrm{r})$\n$\\therefore 3=\\frac{7+p+q+1}{3},-5=\\frac{-8+q+5 p}{3}, r=\\frac{1+5+0}{3}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/KFi4hwFhXywEGKii-vvcwI8ThrxE6jwIVDfyDqTPIe8.original.fullsize.png\"><br>\n$\\mathrm{r}=2$\nSolving (1) and (2), we get $p=-2, q=3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260d80279619d9d8a27c0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "If the polar co-ordinates of a point are $\\left(2, \\frac{\\pi^c}{4}\\right)$, then its Cartesian co-ordinates are", "image": null}, "options": [{"id": "2fU5J", "text": "$(\\sqrt{2}, \\sqrt{2})$", "image": null, "isCorrect": true}, {"id": "2Xayg", "text": "(2,2)", "image": null, "isCorrect": false}, {"id": "USLKm", "text": "$(2, \\sqrt{2})$", "image": null, "isCorrect": false}, {"id": "kKnjF", "text": "$(\\sqrt{2}, 2)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the Cartesian coordinates by $(\\mathrm{x}, \\mathrm{y})$\nWe have $\\sqrt{x^2+y^2}=2 \\Rightarrow x^2+y^2=4$ and $\\tan \\frac{\\pi}{4}=\\frac{y}{x} \\Rightarrow 1=\\frac{y}{x} \\Rightarrow x=y$\n$\\therefore 2 x^2=4 \\Rightarrow x^2=2 \\Rightarrow x= \\pm \\sqrt{2} \\Rightarrow y= \\pm \\sqrt{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c60279619d9d8a2738", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "If $G(\\bar{g}), H(\\bar{h})$ and $P(\\bar{p})$ are respectively centroid, orthocenter and circumcentre of a triangle and $x \\bar{p}+y \\bar{h}+z \\bar{g}=\\overline{0}$, then $x, y, z$ are respectively.", "image": null}, "options": [{"id": "JxRFG", "text": "$1,1,-2$", "image": null, "isCorrect": false}, {"id": "PxgPz", "text": "$1,3,-4$", "image": null, "isCorrect": false}, {"id": "i7bwi", "text": "$2,1,-3$", "image": null, "isCorrect": true}, {"id": "qa21s", "text": "$2,3,-5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that centroid divides a line joining orthocenter to circumcentre in the ratio $2: 1$.\n$$\n\\begin{aligned}\n& \\therefore \\overline{\\mathrm{g}}=\\frac{\\overline{\\mathrm{h}}+2 \\overline{\\mathrm{p}}}{1+2} \\Rightarrow 2 \\overline{\\mathrm{p}}+\\overline{\\mathrm{h}}=-3 \\overline{\\mathrm{g}} \\\\\n& \\therefore \\mathrm{x}=2, \\mathrm{y}=1, \\mathrm{z}=-3 \\text { as per data given. }\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2608c0279619d9d8a2565", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "If $\\mathrm{G}(4,3,3)$ is the centroid of the triangle $\\mathrm{ABC}$ whose vertices are $\\mathrm{A}(\\mathrm{a}, 3,1), \\mathrm{B}(4,5, \\mathrm{~b})$ and $\\mathrm{C}(6, \\mathrm{c}, 5)$, then the value of $\\mathrm{a}, \\mathrm{b}, \\mathrm{c}$ are", "image": null}, "options": [{"id": "t6HXY", "text": "$a=1, b=2, c=3$", "image": null, "isCorrect": false}, {"id": "Q9Knw", "text": "$a=3, b=2, c=1$", "image": null, "isCorrect": false}, {"id": "bNwKP", "text": "$a=2, b=1, c=3$", "image": null, "isCorrect": false}, {"id": "0Nk2B", "text": "$\\mathrm{a}=2, \\mathrm{~b}=3, \\mathrm{c}=1$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We have vertices $\\mathrm{A}(\\mathrm{a}, 3,1) ; \\mathrm{B}(4,5, \\mathrm{~b}) ; \\mathrm{C}(6, \\mathrm{c}, 5)$ and $\\mathrm{G}(4,3,3)$ of $\\triangle \\mathrm{ABC}$\n$$\n\\frac{\\mathrm{a}+4+6}{3}=4, \\frac{3+5+\\mathrm{c}}{3}=3, \\frac{1+\\mathrm{b}+5}{3}=3 \\Rightarrow \\mathrm{a}=2, \\mathrm{c}=1, \\mathrm{~b}=3\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260530279619d9d8a2393", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "If the polar co-ordinates of a point are $\\left(\\sqrt{2}, \\frac{\\pi}{4}\\right)$, then its Cartesian co-ordinates are", "image": null}, "options": [{"id": "1LqxN", "text": "$(\\sqrt{2}, 2)$", "image": null, "isCorrect": false}, {"id": "Wwrs3", "text": "$(1,-1)$", "image": null, "isCorrect": false}, {"id": "Mqiih", "text": "$(2, \\sqrt{2})$", "image": null, "isCorrect": false}, {"id": "IKyzK", "text": "$(1,1)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Polar coordinates $\\mathrm{z}=\\mathrm{a}+\\mathrm{ib}$ are $\\left(\\sqrt{2}, \\frac{\\pi}{4}\\right)$\n$\\therefore \\sqrt{2}=\\sqrt{\\mathrm{a}^2+\\mathrm{b}^2} \\Rightarrow \\mathrm{a}^2+\\mathrm{b}^2=2$ and $\\tan \\left(\\frac{\\pi}{4}\\right)=\\frac{\\mathrm{b}}{\\mathrm{a}} \\Rightarrow \\frac{\\mathrm{b}}{\\mathrm{a}}=1$\n$\\Rightarrow \\mathrm{a}=\\mathrm{b}$\n$\\therefore \\mathrm{a}^2+\\mathrm{b}^2=2 \\Rightarrow 2 \\mathrm{a}^2=2 \\Rightarrow \\mathrm{a}^2=1 \\Rightarrow \\mathrm{a}= \\pm 1$\nSince point lies in $1^{\\text {st }}$ quadrant, $a=1 \\Rightarrow b=1$\n$\\therefore$ Cartesian coordinates are $(1,1)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd00279619d9d8a1f74", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "The points $A(-a,-b)$, B $(0,0), C(a, b)$ and $D\\left(a^{2}, a b\\right)$ are", "image": null}, "options": [{"id": "257fz", "text": "collinear", "image": null, "isCorrect": true}, {"id": "9r6sC", "text": "vertices of a parallelogram", "image": null, "isCorrect": false}, {"id": "RoN7n", "text": "vertices of a square", "image": null, "isCorrect": false}, {"id": "ziRnr", "text": "vertices of a rectangle", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\nDistance between the points $A(-a,-b)$ and $B(0,0)=\\sqrt{(0+a)^{2}+(0+b)^{2}}=\\sqrt{a^{2}+b^{2}}$\nDistance between the points $B(0,0)$ and $C(a, b), \\sqrt{(a-0)^{2}+(b-0)^{2}}=\\sqrt{a^{2}+b^{2}}$\nDistance between the points $C(a, b)$ and $D\\left(a^{2}, a b\\right)$\n$\\begin{array}{l}\n=\\sqrt{\\left(a^{2}-a\\right)^{2}+(a b-b)^{2}}=\\sqrt{[a(a-1)]^{2}+[b(a-1)]^{2}} \\\\\n=\\sqrt{a^{2}(a-1)^{2}+b^{2}(a-1)^{2}}=\\sqrt{\\left(a^{2}+b^{2}\\right)(a-1)^{2}}=(a-1) \\sqrt{a^{2}+b^{2}}\n\\end{array}$\nSimilarly, distance between the points $A(-a,-b)$ and $D\\left(a^{2}, a b\\right)$\n$\\begin{aligned}\n=\\sqrt{\\left(a^{2}+a\\right)+(a b+b)^{2}} &=(a+1) \\sqrt{a^{2}+b^{2}} \\\\\nA B+B C+C D &=\\sqrt{a^{2}+b^{2}}+\\sqrt{a^{2}+b^{2}}+(a-1) \\sqrt{a^{2}+b^{2}} \\\\\n&=(a+1) \\sqrt{a^{2}+b^{2}}=A D\n\\end{aligned}$\nHence the point are collinear.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fbe0279619d9d8a1ee6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "The polar co-ordinates of the point whose cartesian co-ordinates are $(-2,-2)$, are given by", "image": null}, "options": [{"id": "uNtmz", "text": "$\\left(2 \\sqrt{2}, \\frac{5 \\pi}{4}\\right)$", "image": null, "isCorrect": true}, {"id": "EAzPu", "text": "$\\left(2 \\sqrt{2}, \\frac{3 \\pi}{4}\\right)$", "image": null, "isCorrect": false}, {"id": "tTfvY", "text": "$\\left(2 \\sqrt{2}, \\frac{7 \\pi}{6}\\right)$", "image": null, "isCorrect": false}, {"id": "J6koK", "text": "$\\left(2 \\sqrt{2}, \\frac{\\pi}{4}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(C) \nWe know that $r=\\sqrt{x^{2}+y^{2}}=\\sqrt{(-2)^{2}+(-2)^{2}}=2 \\sqrt{2}$ and $\\tan \\theta=\\frac{y}{x}=\\frac{-2}{-2}=1$ $\\theta=\\tan ^{-1} 1=\\left(\\pi+\\frac{\\pi}{4}\\right)=\\frac{5 \\pi}{4}$, as the point $(-2,-2)$ lies in III quadrant. $\\therefore(r, \\theta)=\\left(2 \\sqrt{2}, \\frac{5 \\pi}{4}\\right)$", "image": null}, "videoSolution": null, rac></mrow></mfenced></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f140279619d9d8a1998", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "The maximum value of z = 6x +8y subject to <math><mi>x</mi><mo>-</mo><mi>y</mi><mo>≥</mo><mn>0</mn><mo>,</mo><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>≤</mo><mn>12</mn><mo>,</mo><mi>x</mi><mo>≥</mo><mn>0</mn><mo>,</mo><mi>y</mi><mo>≥</mo><mn>0</mn></math> is…..", "image": null}, "options": [{"id": "ktQPP", "text": "72", "image": null, "isCorrect": true}, {"id": "F1a6Y", "text": "42", "image": null, "isCorrect": false}, {"id": "1Q0Ik", "text": "96", "image": null, "isCorrect": false}, {"id": "Et66a", "text": "24", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have, z = 6x +8y <br/>Subject to constraints <math><mi>x</mi><mo>-</mo><mi>y</mi><mo>≥</mo><mn>0</mn><mo>,</mo><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>≤</mo><mn>12</mn><mo>,</mo><mi>x</mi><mo>≥</mo><mn>0</mn><mo>,</mo><mi>y</mi><mo>≥</mo><mn>0</mn></math> . <br/>On taking given constraints as equations, we get the following graph <br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/d35c70cc-c750-46db-87f8-38bc1eddc9f7.png\"> <br/>Intersecting point of the line <math><mi>x</mi><mo>-</mo><mi>y</mi><mo>=</mo><mn>0</mn></math> and <math><mi>x</mi><mo>+</mo><mn>3</mn><mi>y</mi><mo>=</mo><mn>12</mn></math> is B (3, 3). <br/>Here, OABO is the required feasible region <br/>Whose corner points are O (0, 0), A (12, 0) and B (0, 4) Now, <br/>Corner points <math><mi>Z</mi><mo>=</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>8</mn><mi>y</mi></math>  <br/>O (0, 0) <math><mn>6</mn><mo>×</mo><mn>0</mn><mo>+</mo><mn>8</mn><mo>×</mo><mn>0</mn><mo>=</mo><mn>0</mn></math>  <br/>A (12, 0) <math><mn>6</mn><mo>×</mo><mn>12</mn><mo>+</mo><mn>8</mn><mo>×</mo><mn>0</mn><mo>=</mo><mn>72</mn></math>  <br/>(maximum) <br/>B (3, 3) <math><mn>6</mn><mo>×</mo><mn>3</mn><mo>+</mo><mn>8</mn><mo>×</mo><mn>3</mn><mo>=</mo><mn>42</mn></math>  <br/><math><mo>∴</mo></math> Maximum value of Z is 72.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f020279619d9d8a190b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "The polar co-ordinates of P are <math><mfenced separators=\"|\"><mrow><mn>2</mn><mo>.</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></math> . If Q is the image of P about the X-axis then the polar co-ordinates of Q are…", "image": null}, "options": [{"id": "2Ehml", "text": "<math><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mfrac><mrow><mn>5</mn><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "yQSpg", "text": "<math><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "LbSIt", "text": "<math><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "kLZJs", "text": "<math><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mfrac><mrow><mn>11</mn><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We have, polar coordinates of P are <math><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></math>  <br/>If Q is the image of P about the X-axis <br/><math><mo>∴</mo><mi>Q</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mo>-</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></math>  <br/><math><mo>&#8658;</mo><mi>Q</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mo>,</mo><mfrac><mrow><mn>11</mn><mi>π</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mrow></mfenced></math>  <br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/2791a75a-f970-4fbc-b3f7-74bfd54d8713.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea90279619d9d8a163e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The two vertices of triangle are $(2,-1),(3,2)$ and the third vertex lies on $x+y=5 .$ The area of the triangle is 4 units, then the third vertex is", "image": null}, "options": [{"id": "xZ4Uh", "text": "$(0,5)$ or $(1,4)$", "image": null, "isCorrect": false}, {"id": "BinqM", "text": "$(5,0)$ or $(4,1)$", "image": null, "isCorrect": false}, {"id": "sCS5q", "text": "$(5,0)$ or $(1,4)$", "image": null, "isCorrect": true}, {"id": "I2mrf", "text": "$(0,5)$ or $(4,1)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since, the third vertex $\\left(x_{1}, y_{1}\\right)$ lie on the line $x+y=5$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/k6CTJ33WMctk-9Mna1diGF5H79O1HzCx1J7H9YDxo20.original.fullsize.png\"><br>\n$\\therefore$\\begin{aligned}\nx_{1}+y_{1} &=5 \\\\\ny_{1} &=5-x_{1}\n\\end{aligned}\n$\\therefore$ Coordinate of $C$ is $\\left(x_{1}, 5-x_{1}\\right)$ \nGiven, area of $\\Delta A B C=4$ units\n$\\begin{array}{lc}\\therefore \\frac{1}{2}\\left|\\begin{array}{ccc}2 & -1 & 1 \\\\ 3 & 2 & 1 \\\\ x_{1} & 5-x_{1} & 1\\end{array}\\right|=4 \\\\ \\text { Using } R_{2} \\rightarrow R_{2}-R_{1} \\text { and } R_{3} \\rightarrow R_{3}-R_{1}, \\\\ & \\left|\\begin{array}{ccc}2 & -1 & 1 \\\\ 1 & 3 & 0 \\\\ x_{1} & -2 & 6-x_{1} & 0\\end{array}\\right|=8 \\\\ \\Rightarrow \\quad 6-x_{1}-3\\left(x_{1}-2\\right)=\\pm 8 \\\\ \\Rightarrow \\quad 6-x_{1}-3 x_{1}+6=\\pm 8 \\\\ \\Rightarrow 12-8=4 x_{1} \\quad \\text { or } \\quad 4 x_{1}=20 \\\\ \\Rightarrow \\quad x_{1}=1 \\quad \\quad \\text { or } \\quad x_{1}=5 \\\\ \\therefore \\quad y_{1}=5-1=4 \\quad \\text { or } \\quad y_{1}=0\\end{array}$\n$\\therefore C\\left(x_{1}, y_{1}\\right)=C(1,4)$ or $C(5,0)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e480279619d9d8a1332", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The circumcentre of the triangle formed by the lines $x y+2 x+2 y+4=0$ and $x+y+2=0$ is", "image": null}, "options": [{"id": "YsKfX", "text": "$(0,0)$", "image": null, "isCorrect": false}, {"id": "KFbZG", "text": "$(-2,-2)$", "image": null, "isCorrect": false}, {"id": "CRMYU", "text": "$(-1,-1)$", "image": null, "isCorrect": true}, {"id": "BpZ5s", "text": "$(-1,-2)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation $x y+2 x+2 y+4=0$ can be rewritten as $(x+2)(y+2)=0$ or $x+2=0$, $y+2=0$\nAnd also given that $x+y+2=0$.\nOn solving the above equations, we get $A(-2,0), B(0,-2), C(-2,-2)$\nIt is clearly that $\\Delta A B C$ is right angled triangle with right angle at $C$. Hence, centre of the circumcircle is the mid point of $A B$ whose coordinates are $(-1,-1)$.\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a2633f0279619d9d8a3d6c", "title": "Basic Forms of Straight Line", "totalQuestions": 38, "questions": [{"_id": "6abb88a415a9fc0fc8c145a2", "type": "singleCorrect", "question": {"text": "The equation of the line $\\sqrt{3}x - y + 4 = 0$ in the normal form is _____", "image": null}, "options": [{"id": "7Usf6", "label": "A", "text": "$x\\cos\\dfrac{\\pi}{3} + y\\sin\\dfrac{\\pi}{3} = 2$", "isCorrect": false, "image": null}, {"id": "PMMcB", "label": "B", "text": "$x\\cos\\dfrac{5\\pi}{6} + y\\sin\\dfrac{5\\pi}{6} = 2$", "isCorrect": true, "image": null}, {"id": "pZ5tb", "label": "C", "text": "$x\\cos\\dfrac{\\pi}{6} + y\\sin\\dfrac{\\pi}{6} = 2$", "isCorrect": false, "image": null}, {"id": "NttA0", "label": "D", "text": "$x\\cos\\dfrac{\\pi}{4} + y\\sin\\dfrac{\\pi}{4} = 2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given equation of the line is $\\sqrt{3}x - y + 4 = 0$.<br><br>Rewriting the equation so that the constant term is positive, we get:<br><br>$-\\sqrt{3}x + y = 4$<br><br>Dividing the entire equation by $\\sqrt{(-\\sqrt{3})^2 + (1)^2} = 2$, we obtain:<br><br>$-\\dfrac{\\sqrt{3}}{2}x + \\dfrac{1}{2}y = 2$<br><br>Comparing this with the normal form $x\\cos\\alpha + y\\sin\\alpha = p$, we have:<br><br>$\\cos\\alpha = -\\dfrac{\\sqrt{3}}{2}$, $\\sin\\alpha = \\dfrac{1}{2}$, and $p = 2$<br><br>Since $\\cos\\alpha < 0$ and $\\sin\\alpha > 0$, $\\alpha$ lies in the second quadrant.<br><br>$\\alpha = \\pi - \\dfrac{\\pi}{6} = \\dfrac{5\\pi}{6}$<br><br>Therefore, the equation of the line in normal form is:<br><br>$x\\cos\\dfrac{5\\pi}{6} + y\\sin\\dfrac{5\\pi}{6} = 2$<br><br>Answer: $x\\cos\\dfrac{5\\pi}{6} + y\\sin\\dfrac{5\\pi}{6} = 2$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888415a9fc0fc8c14476", "type": "singleCorrect", "question": {"text": "If $P(a, b)$ is the midpoint of a line segment intercepted between the coordinate axes, then the equation of the line is", "image": null}, "options": [{"id": "cAc6C", "label": "A", "text": "$x + y = 2$", "isCorrect": false, "image": null}, {"id": "GtKPl", "label": "B", "text": "$ax + by = 2$", "isCorrect": false, "image": null}, {"id": "y8bcH", "label": "C", "text": "$x + y = 2ab$", "isCorrect": false, "image": null}, {"id": "qzXxy", "label": "D", "text": "$\\dfrac{x}{a} + \\dfrac{y}{b} = 2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the line intersect the x-axis at $A(x_1, 0)$ and the y-axis at $B(0, y_1)$.<br><br>The midpoint of the line segment $AB$ is given by $\\left( \\dfrac{x_1 + 0}{2}, \\dfrac{0 + y_1}{2} \\right) = \\left( \\dfrac{x_1}{2}, \\dfrac{y_1}{2} \\right)$.<br><br>Given that the midpoint is $P(a, b)$, we have:<br><br>$\\dfrac{x_1}{2} = a \\Rightarrow x_1 = 2a$<br><br>$\\dfrac{y_1}{2} = b \\Rightarrow y_1 = 2b$<br><br>The intercepts of the line on the x-axis and y-axis are $2a$ and $2b$, respectively.<br><br>The equation of the line in intercept form is $\\dfrac{x}{x_1} + \\dfrac{y}{y_1} = 1$.<br><br>Substituting the values of $x_1$ and $y_1$, we get:<br><br>$\\dfrac{x}{2a} + \\dfrac{y}{2b} = 1$<br><br>Multiplying both sides by $2$, we obtain:<br><br>$\\dfrac{x}{a} + \\dfrac{y}{b} = 2$<br><br>Answer: $\\dfrac{x}{a} + \\dfrac{y}{b} = 2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886515a9fc0fc8c1434a", "type": "singleCorrect", "question": {"text": "A straight line passes through the point $(3, 3)$ and intersects the positive $x$ and $y$ axes at the points $A(h, 0)$ and $B(0, k)$ respectively. If O is the origin, then the minimum area of $\\triangle OAB$ is:", "image": null}, "options": [{"id": "OweZQ", "label": "A", "text": "$9$ square units.", "isCorrect": false, "image": null}, {"id": "nNYkR", "label": "B", "text": "$18$ square units.", "isCorrect": true, "image": null}, {"id": "YprDp", "label": "C", "text": "$27$ square units.", "isCorrect": false, "image": null}, {"id": "jeovN", "label": "D", "text": "$36$ square units.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of the line with $x$-intercept $h$ and $y$-intercept $k$ is given by $\\dfrac{x}{h} + \\dfrac{y}{k} = 1$.<br><br>Since the line passes through the point $(3, 3)$, we have:<br><br>$\\dfrac{3}{h} + \\dfrac{3}{k} = 1$<br><br>The area of $\\triangle OAB$ is given by $\\Delta = \\dfrac{1}{2}hk$.<br><br>Since the line intersects the positive axes, $h > 0$ and $k > 0$. Applying the AM-GM inequality to the positive numbers $\\dfrac{3}{h}$ and $\\dfrac{3}{k}$:<br><br>$\\dfrac{\\dfrac{3}{h} + \\dfrac{3}{k}}{2} \\ge \\sqrt{\\dfrac{3}{h} \\times \\dfrac{3}{k}}$<br><br>$\\dfrac{1}{2} \\ge \\dfrac{3}{\\sqrt{hk}}$<br><br>$\\sqrt{hk} \\ge 6$<br><br>$hk \\ge 36$<br><br>Therefore, the area of the triangle is:<br><br>$\\Delta = \\dfrac{1}{2}hk \\ge \\dfrac{1}{2}(36) = 18$<br><br>The minimum area of $\\triangle OAB$ is $18$ square units.<br><br>Answer: $18$ square units.", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ac8c30a4553e1bdb9a", "type": "singleCorrect", "question": {"text": "A straight line makes equal negative intercepts on the coordinate axes. If the perpendicular distance from the origin to the line is 4 units, then the equation of the line is ......", "image": null}, "options": [{"id": "BsURN", "label": "A", "text": "$x + y + 4 = 0$", "isCorrect": false, "image": null}, {"id": "RgKYV", "label": "B", "text": "$x + y + 4\\sqrt{2} = 0$", "isCorrect": true, "image": null}, {"id": "ESLZN", "label": "C", "text": "$x - y + 4 = 0$", "isCorrect": false, "image": null}, {"id": "n49ji", "label": "D", "text": "$x - y + 4\\sqrt{2} = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the equation of the line in intercept form be $\\dfrac{x}{a} + \\dfrac{y}{b} = 1$.<br><br>Since the line makes equal negative intercepts on the coordinate axes, $a = b = -c$ where $c > 0$.<br><br>The equation of the line becomes $\\dfrac{x}{-c} + \\dfrac{y}{-c} = 1 \\Rightarrow x + y + c = 0$.<br><br>The perpendicular distance from the origin $(0,0)$ to this line is given as $4$ units.<br><br>Using the perpendicular distance formula, $\\dfrac{|0 + 0 + c|}{\\sqrt{1^2 + 1^2}} = 4$.<br><br>$\\dfrac{|c|}{\\sqrt{2}} = 4 \\Rightarrow |c| = 4\\sqrt{2}$.<br><br>Since $c > 0$, we have $c = 4\\sqrt{2}$.<br><br>Substituting the value of $c$ in the equation of the line, we get $x + y + 4\\sqrt{2} = 0$.<br><br>Answer: $x + y + 4\\sqrt{2} = 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3558c30a4553e1be2a2", "type": "singleCorrect", "question": {"text": "The area of a triangle formed by a line with the coordinate axes is $49$ sq. units. If the perpendicular drawn from the origin to this line makes an angle of $45^\\circ$ with the positive X-axis, then the equation of line is....", "image": null}, "options": [{"id": "I1z1C", "label": "A", "text": "$x + y = 7$", "isCorrect": false, "image": null}, {"id": "T5jkY", "label": "B", "text": "$x + y = 7\\sqrt{2}$", "isCorrect": true, "image": null}, {"id": "8MAqx", "label": "C", "text": "$x + y = \\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "0tS9K", "label": "D", "text": "$x + y = 2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the equation of the line in normal form be $x \\cos \\alpha + y \\sin \\alpha = p$.<br><br>Given $\\alpha = 45^\\circ$, the equation becomes $x \\cos 45^\\circ + y \\sin 45^\\circ = p$, which simplifies to $x + y = p\\sqrt{2}$.<br><br>The x-intercept is $a = p\\sqrt{2}$ and the y-intercept is $b = p\\sqrt{2}$.<br><br>The area of the triangle formed with the coordinate axes is $\\dfrac{1}{2}ab = 49$.<br><br>Substituting the intercepts, we get $\\dfrac{1}{2}(p\\sqrt{2})(p\\sqrt{2}) = 49$.<br><br>This gives $p^2 = 49$, so $p = 7$ (since perpendicular distance $p > 0$).<br><br>Therefore, the equation of the line is $x + y = 7\\sqrt{2}$.<br><br>Answer: $x + y = 7\\sqrt{2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3018c30a4553e1bdf1f", "type": "singleCorrect", "question": {"text": "A line making equal intercepts on coordinate axes and is tangent to the circle $x^2 + y^2 = 4$. The length of each intercept made by line on the coordinate axes is ...", "image": null}, "options": [{"id": "wzsil", "label": "A", "text": "$\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "FkmXI", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "T7vy7", "label": "C", "text": "$2\\sqrt{2}$", "isCorrect": true, "image": null}, {"id": "oxuuJ", "label": "D", "text": "$4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the equation of the line making equal intercepts on the coordinate axes be $\\dfrac{x}{a} + \\dfrac{y}{a} = 1$.<br><br>This can be written as $x + y - a = 0$.<br><br>The line is tangent to the circle $x^2 + y^2 = 4$.<br><br>The center of the circle is $(0, 0)$ and its radius is $2$.<br><br>For a line to be tangent to a circle, the perpendicular distance from the center of the circle to the line must be equal to the radius.<br><br>$\\dfrac{|0 + 0 - a|}{\\sqrt{1^2 + 1^2}} = 2$<br><br>$\\dfrac{|a|}{\\sqrt{2}} = 2$<br><br>$|a| = 2\\sqrt{2}$<br><br>The length of each intercept made by the line on the coordinate axes is $2\\sqrt{2}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3008c30a4553e1bdf1e", "type": "singleCorrect", "question": {"text": "A straight line L passes through the point of intersection of the lines $x - y + 1 = 0$ and $2x + y - 7 = 0$. If L intersects the positive x-axis at $A(a, 0)$ and the positive y-axis at $B(0, b)$, then the minimum area of the triangle $OAB$ (where $O$ is the origin) is ....", "image": null}, "options": [{"id": "CUp6f", "label": "A", "text": "$6$ square units.", "isCorrect": false, "image": null}, {"id": "Z5qjW", "label": "B", "text": "$12$ square units.", "isCorrect": true, "image": null}, {"id": "21vj2", "label": "C", "text": "$24$ square units.", "isCorrect": false, "image": null}, {"id": "4Wwj2", "label": "D", "text": "$48$ square units.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Solving the equations $x - y + 1 = 0$ and $2x + y - 7 = 0$, we get the point of intersection as $(2, 3)$.<br><br>Let the equation of the line $L$ be $\\dfrac{x}{a} + \\dfrac{y}{b} = 1$.<br><br>Since it passes through $(2, 3)$, we have:<br><br>$\\dfrac{2}{a} + \\dfrac{3}{b} = 1$<br><br>Since $L$ intersects the positive x-axis and positive y-axis, $a > 0$ and $b > 0$. Applying the AM-GM inequality on $\\dfrac{2}{a}$ and $\\dfrac{3}{b}$:<br><br>$\\dfrac{\\dfrac{2}{a} + \\dfrac{3}{b}}{2} \\ge \\sqrt{\\dfrac{2}{a} \\times \\dfrac{3}{b}}$<br><br>$\\dfrac{1}{2} \\ge \\sqrt{\\dfrac{6}{ab}}$<br><br>Squaring both sides:<br><br>$\\dfrac{1}{4} \\ge \\dfrac{6}{ab} \\Rightarrow ab \\ge 24$<br><br>The area of the triangle $OAB$ is given by $\\Delta = \\dfrac{1}{2}ab$.<br><br>$\\Delta \\ge \\dfrac{1}{2} \\times 24 = 12$<br><br>The minimum area of the triangle is $12$ square units.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32a8c30a4553e1be0e0", "type": "singleCorrect", "question": {"text": "The line $L_1$ given by $\\dfrac{x}{p} + \\dfrac{y}{2} = 1$ passes through the point $(5,0)$. The line $L_2$ given by $\\dfrac{x}{10} + \\dfrac{y}{q} = 1$ is parallel to $L_1$. Then the distance between the lines $L_1$ and $L_2$ is...", "image": null}, "options": [{"id": "R9DSk", "label": "A", "text": "$\\dfrac{10}{\\sqrt{29}}$", "isCorrect": true, "image": null}, {"id": "54xtw", "label": "B", "text": "$\\dfrac{19}{2\\sqrt{29}}$", "isCorrect": false, "image": null}, {"id": "cg8F1", "label": "C", "text": "$\\dfrac{5}{\\sqrt{41}}$", "isCorrect": false, "image": null}, {"id": "BYvtt", "label": "D", "text": "$\\dfrac{10}{\\sqrt{41}}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since the line $L_1$ given by $\\dfrac{x}{p} + \\dfrac{y}{2} = 1$ passes through $(5,0)$, substituting these coordinates gives:<br><br>$\\dfrac{5}{p} + 0 = 1 \\Rightarrow p = 5$<br><br>The equation of $L_1$ becomes $\\dfrac{x}{5} + \\dfrac{y}{2} = 1$, which simplifies to $2x + 5y - 10 = 0$.<br><br>The line $L_2$ given by $\\dfrac{x}{10} + \\dfrac{y}{q} = 1$ is parallel to $L_1$. Equating their slopes:<br><br>$-\\dfrac{q}{10} = -\\dfrac{2}{5} \\Rightarrow q = 4$<br><br>The equation of $L_2$ becomes $\\dfrac{x}{10} + \\dfrac{y}{4} = 1$, which simplifies to $4x + 10y - 40 = 0$ or $2x + 5y - 20 = 0$.<br><br>The perpendicular distance between the parallel lines $2x + 5y - 10 = 0$ and $2x + 5y - 20 = 0$ is:<br><br>$d = \\dfrac{|-10 - (-20)|}{\\sqrt{2^2 + 5^2}} = \\dfrac{10}{\\sqrt{4 + 25}} = \\dfrac{10}{\\sqrt{29}}$<br><br>Answer: $\\dfrac{10}{\\sqrt{29}}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33a8c30a4553e1be18c", "type": "singleCorrect", "question": {"text": "The number of lines passing through A (3, 4) and the sum of whose non-zero intercepts is zero is (are)", "image": null}, "options": [{"id": "vBngh", "label": "A", "text": "$1$", "isCorrect": true, "image": null}, {"id": "ufYam", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "0bX8K", "label": "C", "text": "$3$", "isCorrect": false, "image": null}, {"id": "2peKV", "label": "D", "text": "$4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the equation of the line be $\\dfrac{x}{a} + \\dfrac{y}{b} = 1$, where $a$ and $b$ are the non-zero intercepts on the x-axis and y-axis respectively.<br><br>Given that the sum of the non-zero intercepts is zero, we have:<br>$a + b = 0 \\Rightarrow b = -a$<br><br>Substituting $b = -a$ into the equation of the line, we get:<br>$\\dfrac{x}{a} + \\dfrac{y}{-a} = 1$<br>$x - y = a$<br><br>Since the line passes through the point $A(3, 4)$, we substitute $x = 3$ and $y = 4$ into the equation:<br>$3 - 4 = a \\Rightarrow a = -1$<br><br>Since $a = -1 \\neq 0$, this is a valid non-zero intercept. The corresponding value of $b$ is $b = -(-1) = 1$.<br><br>Thus, there is exactly one such line, and its equation is $x - y = -1$ (or $x - y + 1 = 0$).<br><br>Therefore, the number of such lines is $1$.<br><br>Answer: $1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d29e8c30a4553e1bdb04", "type": "singleCorrect", "question": {"text": "The equation of the straight line passing through the point $(-5, 3)$ such that the portion of the line intercepted between the axes is divided by the point in the ratio $4:3$ (from the X-axis to the Y-axis) is...", "image": null}, "options": [{"id": "xNSZw", "label": "A", "text": "$9x + 20y + 105 = 0$", "isCorrect": false, "image": null}, {"id": "LpRY1", "label": "B", "text": "$9x - 20y - 105 = 0$", "isCorrect": false, "image": null}, {"id": "v4ZXb", "label": "C", "text": "$9x - 20y + 105 = 0$", "isCorrect": true, "image": null}, {"id": "kKBE9", "label": "D", "text": "$9x + 20y - 105 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the line intersect the X-axis at $A(a, 0)$ and the Y-axis at $B(0, b)$.<br><br>The point $P(-5, 3)$ divides the line segment $AB$ in the ratio $4:3$ from the X-axis to the Y-axis.<br><br>Using the section formula, the coordinates of $P$ are given by:<br><br>$P(x, y) = \\left( \\dfrac{4(0) + 3(a)}{4 + 3}, \\dfrac{4(b) + 3(0)}{4 + 3} \\right) = \\left( \\dfrac{3a}{7}, \\dfrac{4b}{7} \\right)$<br><br>Equating this to the given coordinates of $P(-5, 3)$:<br><br>$\\dfrac{3a}{7} = -5 \\Rightarrow a = -\\dfrac{35}{3}$<br><br>$\\dfrac{4b}{7} = 3 \\Rightarrow b = \\dfrac{21}{4}$<br><br>The equation of the line in intercept form is $\\dfrac{x}{a} + \\dfrac{y}{b} = 1$.<br><br>Substituting the values of $a$ and $b$:<br><br>$\\dfrac{x}{-\\dfrac{35}{3}} + \\dfrac{y}{\\dfrac{21}{4}} = 1$<br><br>$-\\dfrac{3x}{35} + \\dfrac{4y}{21} = 1$<br><br>Multiplying the entire equation by $105$ (the LCM of $35$ and $21$):<br><br>$-9x + 20y = 105$<br><br>$9x - 20y + 105 = 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3728c30a4553e1be3d4", "type": "singleCorrect", "question": {"text": "The area of the triangle formed by the co-ordinate axes and a line $px + qy = r$ (where p, q and r are positive real numbers) is $\\dfrac{1}{54}$ sq.units, then ....", "image": null}, "options": [{"id": "FvLWv", "label": "A", "text": "p, 3r, q are in G.P.", "isCorrect": false, "image": null}, {"id": "OYwbq", "label": "B", "text": "$p^2 + q^2 = r^2$", "isCorrect": false, "image": null}, {"id": "XM88k", "label": "C", "text": "p, $3\\sqrt{3}$ r, q are in G.P.", "isCorrect": true, "image": null}, {"id": "l3ScT", "label": "D", "text": "p, 27 r, q are in G.P.", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of the line is $px + qy = r$.<br><br>The intercepts on the coordinate axes are $\\dfrac{r}{p}$ and $\\dfrac{r}{q}$.<br><br>The area of the triangle formed by the line and the coordinate axes is given by $\\dfrac{1}{2} \\times \\text{base} \\times \\text{height}$.<br><br>Area $= \\dfrac{1}{2} \\times \\dfrac{r}{p} \\times \\dfrac{r}{q} = \\dfrac{r^2}{2pq}$<br><br>Given that the area is $\\dfrac{1}{54}$ sq. units, we have:<br><br>$\\dfrac{r^2}{2pq} = \\dfrac{1}{54}$<br><br>$2pq = 54r^2$<br><br>$pq = 27r^2$<br><br>$pq = (3\\sqrt{3}r)^2$<br><br>This satisfies the condition for $p$, $3\\sqrt{3}r$, and $q$ to be in Geometric Progression (G.P.).<br><br>Answer: p, $3\\sqrt{3}$ r, q are in G.P.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143a0aee93fa0796defc", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "A line with positive direction cosines passes through the point $\\mathrm{P}(2,-1,2)$ and makes equal angles with co-ordinate axes. The line meets the plane $2 x+y+z=9$ at point Q . Then the length of the line segment PQ equals", "image": null}, "options": [{"id": "34fHD", "text": "1 units", "image": null, "isCorrect": false}, {"id": "GpEBi", "text": "$\\sqrt{2}$ units", "image": null, "isCorrect": false}, {"id": "AVUd5", "text": "$\\sqrt{3}$ units", "image": null, "isCorrect": true}, {"id": "Q0vGg", "text": "2 units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the line makes equal angles with the coordinate axes and has positive direction cosines, we have $l = m = n$.<br><br>Using $l^2 + m^2 + n^2 = 1$, we get $3l^2 = 1 \\Rightarrow l = m = n = \\dfrac{1}{\\sqrt{3}}$.<br><br>The direction ratios of the line are proportional to $1, 1, 1$.<br><br>The equation of the line passing through $P(2, -1, 2)$ is:<br><br>$\\dfrac{x - 2}{1} = \\dfrac{y + 1}{1} = \\dfrac{z - 2}{1} = k$<br><br>Any point on this line is of the form $Q(k + 2, k - 1, k + 2)$.<br><br>Since $Q$ lies on the plane $2x + y + z = 9$, we substitute the coordinates of $Q$ into the plane's equation:<br><br>$2(k + 2) + (k - 1) + (k + 2) = 9$<br><br>$2k + 4 + k - 1 + k + 2 = 9$<br><br>$4k + 5 = 9$<br><br>$4k = 4 \\Rightarrow k = 1$<br><br>Substituting $k = 1$, the coordinates of $Q$ are $(3, 0, 3)$.<br><br>The length of the line segment $PQ$ is given by the distance formula:<br><br>$PQ = \\sqrt{(3 - 2)^2 + (0 - (-1))^2 + (3 - 2)^2}$<br><br>$PQ = \\sqrt{1^2 + 1^2 + 1^2} = \\sqrt{3}$ units.<br><br>Answer: $\\sqrt{3}$ units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214380aee93fa0796deec", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "If $\\frac{x^2}{\\mathrm{a}}+\\frac{2 x y}{\\mathrm{~h}}+\\frac{y^2}{\\mathrm{~b}}=0$ represents a pair of straight lines and slope of one of the lines is twice that of the other, then $a b: h^2$ is\r\n[Note: The question has been modified to get the correct answer.]", "image": null}, "options": [{"id": "K9AlS", "text": "$1: 2$", "image": null, "isCorrect": false}, {"id": "sT29Q", "text": "$9: 8$", "image": null, "isCorrect": true}, {"id": "IooGK", "text": "$2: 1$", "image": null, "isCorrect": false}, {"id": "RJaIN", "text": "$8: 9$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation of the pair of straight lines is $\\dfrac{x^2}{a} + \\dfrac{2xy}{h} + \\dfrac{y^2}{b} = 0$.<br><br>Dividing the entire equation by $x^2$ and substituting $m = \\dfrac{y}{x}$, we get the auxiliary equation in terms of slope $m$:<br><br>$\\dfrac{1}{b}m^2 + \\dfrac{2}{h}m + \\dfrac{1}{a} = 0$<br><br>Let $m_1$ and $m_2$ be the roots of this equation, which represent the slopes of the two lines.<br><br>Sum of the slopes: $m_1 + m_2 = -\\dfrac{2/h}{1/b} = -\\dfrac{2b}{h}$<br><br>Product of the slopes: $m_1 m_2 = \\dfrac{1/a}{1/b} = \\dfrac{b}{a}$<br><br>It is given that the slope of one line is twice that of the other. Let $m_2 = 2m_1$.<br><br>Substituting this into the sum of slopes:<br><br>$m_1 + 2m_1 = -\\dfrac{2b}{h}$<br><br>$3m_1 = -\\dfrac{2b}{h} \\Rightarrow m_1 = -\\dfrac{2b}{3h}$<br><br>Substituting $m_2 = 2m_1$ into the product of slopes:<br><br>$m_1(2m_1) = \\dfrac{b}{a}$<br><br>$2m_1^2 = \\dfrac{b}{a}$<br><br>Now, substitute the value of $m_1$ into this equation:<br><br>$2\\left(-\\dfrac{2b}{3h}\\right)^2 = \\dfrac{b}{a}$<br><br>$2\\left(\\dfrac{4b^2}{9h^2}\\right) = \\dfrac{b}{a}$<br><br>$\\dfrac{8b^2}{9h^2} = \\dfrac{b}{a}$<br><br>Since $b \\neq 0$, we can divide both sides by $b$ and rearrange the terms:<br><br>$\\dfrac{8b}{9h^2} = \\dfrac{1}{a}$<br><br>$8ab = 9h^2$<br><br>$\\dfrac{ab}{h^2} = \\dfrac{9}{8}$<br><br>Therefore, $ab : h^2 = 9 : 8$.<br><br>Answer: $9: 8$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792142a0aee93fa0796de7a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "The equation of a line passing through the point $(2,-1,1)$ and parallel to the line joining the points $\\hat{i}+2 \\hat{j}+2 \\hat{k}$ and $-\\hat{i}+4 \\hat{j}+\\hat{k}$ is", "image": null}, "options": [{"id": "KSKlF", "text": "$\\bar{r}=(2 \\hat{i}-\\hat{j}+\\hat{k})+\\lambda(-2 \\hat{i}+2 \\hat{j}-\\hat{k})$", "image": null, "isCorrect": true}, {"id": "KgS6R", "text": "$\\bar{r}=(2 \\hat{i}-\\hat{j}+\\hat{k})+\\lambda(2 \\hat{i}+6 \\hat{j}+3 \\hat{k})$", "image": null, "isCorrect": false}, {"id": "auZ4S", "text": "$\\bar{r}=(2 \\hat{i}-\\hat{j}+\\hat{k})+\\lambda(2 \\hat{i}-2 \\hat{j}-\\hat{k})$", "image": null, "isCorrect": false}, {"id": "f6iTS", "text": "$\\bar{r}=(2 \\hat{i}-\\hat{j}+\\hat{k})+\\lambda(2 \\hat{i}-6 \\hat{j}-3 \\hat{k})$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The position vector of the point through which the line passes is $\\vec{a} = 2\\hat{i} - \\hat{j} + \\hat{k}$.<br><br>The line is parallel to the vector joining the points $\\hat{i}+2\\hat{j}+2\\hat{k}$ and $-\\hat{i}+4\\hat{j}+\\hat{k}$. The direction vector $\\vec{b}$ is given by:<br><br>$\\vec{b} = (-\\hat{i} + 4\\hat{j} + \\hat{k}) - (\\hat{i} + 2\\hat{j} + 2\\hat{k})$<br><br>$\\vec{b} = -2\\hat{i} + 2\\hat{j} - \\hat{k}$<br><br>The vector equation of a line passing through a point with position vector $\\vec{a}$ and parallel to a vector $\\vec{b}$ is $\\bar{r} = \\vec{a} + \\lambda \\vec{b}$.<br><br>Substituting the values of $\\vec{a}$ and $\\vec{b}$, we get:<br><br>$\\bar{r} = (2\\hat{i} - \\hat{j} + \\hat{k}) + \\lambda(-2\\hat{i} + 2\\hat{j} - \\hat{k})$<br><br>Answer: $\\bar{r}=(2 \\hat{i}-\\hat{j}+\\hat{k})+\\lambda(-2 \\hat{i}+2 \\hat{j}-\\hat{k})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214280aee93fa0796de6c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "A line makes $45^{\\circ}$ angle with positive X -axis and makes equal angles with positive Y -axis ad Z -axis respectively, then the sum of the three angles which the line makes with positive X -axis, Y -axis and Z -axis is", "image": null}, "options": [{"id": "5JPFb", "text": "$135^{\\circ}$", "image": null, "isCorrect": false}, {"id": "SM8VO", "text": "$150^{\\circ}$", "image": null, "isCorrect": false}, {"id": "yNQZJ", "text": "$165^{\\circ}$", "image": null, "isCorrect": true}, {"id": "GVR7b", "text": "$180^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the angles made by the line with the positive X, Y, and Z axes be $\\alpha$, $\\beta$, and $\\gamma$ respectively.<br><br>Given $\\alpha = 45^{\\circ}$ and $\\beta = \\gamma$.<br><br>The direction cosines satisfy the relation:<br><br>$\\cos^2 \\alpha + \\cos^2 \\beta + \\cos^2 \\gamma = 1$<br><br>Substituting the given values:<br><br>$\\cos^2 45^{\\circ} + \\cos^2 \\beta + \\cos^2 \\beta = 1$<br><br>$\\left(\\dfrac{1}{\\sqrt{2}}\\right)^2 + 2\\cos^2 \\beta = 1$<br><br>$\\dfrac{1}{2} + 2\\cos^2 \\beta = 1$<br><br>$2\\cos^2 \\beta = \\dfrac{1}{2}$<br><br>$\\cos^2 \\beta = \\dfrac{1}{4}$<br><br>$\\cos \\beta = \\pm \\dfrac{1}{2}$<br><br>Taking the acute angle, $\\beta = 60^{\\circ}$. Since $\\beta = \\gamma$, we have $\\gamma = 60^{\\circ}$.<br><br>The sum of the three angles is:<br><br>$\\alpha + \\beta + \\gamma = 45^{\\circ} + 60^{\\circ} + 60^{\\circ} = 165^{\\circ}$<br><br>Answer: $165^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214260aee93fa0796de5f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "If one of the lines represented by $a x^2+2 h x y+b y^2=0$ is perpendicular to $\\mathrm{m} x+\\mathrm{n} y=18$, then", "image": null}, "options": [{"id": "Aut6j", "text": "$\\mathrm{an}^2+2 \\mathrm{hmn}+\\mathrm{bm}^2=0$", "image": null, "isCorrect": false}, {"id": "VyYuK", "text": "$\\mathrm{am}^2+2 \\mathrm{hmn}+\\mathrm{bn}^2=0$", "image": null, "isCorrect": true}, {"id": "lI4YA", "text": "$\\mathrm{am}^2-2 \\mathrm{hmn}+\\mathrm{bn}^2=0$", "image": null, "isCorrect": false}, {"id": "5AZvt", "text": "$\\quad \\mathrm{an}^2-2 \\mathrm{hmn}+\\mathrm{bm}^2=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The slope of the given line $mx + ny = 18$ is $-\\dfrac{m}{n}$.<br><br>Since one of the lines represented by $ax^2 + 2hxy + by^2 = 0$ is perpendicular to this line, its slope $M$ will be the negative reciprocal of $-\\dfrac{m}{n}$.<br><br>$M = \\dfrac{n}{m}$<br><br>The auxiliary equation for the pair of straight lines $ax^2 + 2hxy + by^2 = 0$ is given by:<br><br>$bM^2 + 2hM + a = 0$<br><br>Substituting $M = \\dfrac{n}{m}$ into the auxiliary equation, we get:<br><br>$b\\left(\\dfrac{n}{m}\\right)^2 + 2h\\left(\\dfrac{n}{m}\\right) + a = 0$<br><br>$\\dfrac{bn^2}{m^2} + \\dfrac{2hmn}{m^2} + \\dfrac{am^2}{m^2} = 0$<br><br>Multiplying the entire equation by $m^2$, we obtain:<br><br>$bn^2 + 2hmn + am^2 = 0$<br><br>$am^2 + 2hmn + bn^2 = 0$<br><br>Answer: $\\mathrm{am}^2+2 \\mathrm{hmn}+\\mathrm{bn}^2=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f10aee93fa0796dcba", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "If the slope of one of the lines given by $\\mathrm{K} x^2+6 x y+y^2=0$ is three times the other, then the value of K is", "image": null}, "options": [{"id": "pLew3", "text": "$\\frac{9}{4}$", "image": null, "isCorrect": false}, {"id": "hniH6", "text": "$\\frac{4}{9}$", "image": null, "isCorrect": false}, {"id": "hXmwF", "text": "$\\frac{27}{4}$", "image": null, "isCorrect": true}, {"id": "a3obP", "text": "$\\frac{4}{27}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Comparing the given equation $Kx^2 + 6xy + y^2 = 0$ with the general equation $ax^2 + 2hxy + by^2 = 0$, we get $a = K$, $2h = 6$, and $b = 1$.<br><br>Let $m_1$ and $m_2$ be the slopes of the lines represented by the equation.<br><br>The sum and product of the slopes are given by:<br>$m_1 + m_2 = -\\dfrac{2h}{b} = -6$<br>$m_1 m_2 = \\dfrac{a}{b} = K$<br><br>Given that the slope of one line is three times the other, let $m_2 = 3m_1$.<br><br>Substituting $m_2$ into the sum of slopes equation:<br>$m_1 + 3m_1 = -6$<br>$4m_1 = -6 \\Rightarrow m_1 = -\\dfrac{3}{2}$<br><br>Substituting $m_1$ and $m_2 = 3m_1$ into the product of slopes equation:<br>$m_1(3m_1) = K$<br>$3m_1^2 = K$<br><br>Substituting the value of $m_1$:<br>$3\\left(-\\dfrac{3}{2}\\right)^2 = K$<br>$K = 3 \\times \\dfrac{9}{4} = \\dfrac{27}{4}$<br><br>Answer: $\\frac{27}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792137a0aee93fa0796d919", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "If $4 a b=3 h^2$, then the ratio of the slope of lines represented by $a x^2+2 h x y+b y^2=0$ is", "image": null}, "options": [{"id": "Brj4N", "text": "$\\sqrt{3}: 1$", "image": null, "isCorrect": false}, {"id": "zVFgw", "text": "$1: \\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "S2dht", "text": "$1: 3$", "image": null, "isCorrect": true}, {"id": "TYTsR", "text": "$2: 1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the slopes of the lines be $m_1$ and $m_2$.<br><br>We know that $m_1 + m_2 = -\\dfrac{2h}{b}$ and $m_1 m_2 = \\dfrac{a}{b}$.<br><br>Let the ratio of the slopes be $m_1 : m_2 = r : 1$, so $m_1 = r m_2$.<br><br>Consider the expression $\\dfrac{(m_1 + m_2)^2}{m_1 m_2} = \\dfrac{\\left(-\\dfrac{2h}{b}\\right)^2}{\\dfrac{a}{b}} = \\dfrac{4h^2}{ab}$.<br><br>Given $4ab = 3h^2$, we have $\\dfrac{h^2}{ab} = \\dfrac{4}{3}$.<br><br>Substituting this value, we get $\\dfrac{(m_1 + m_2)^2}{m_1 m_2} = 4 \\left(\\dfrac{4}{3}\\right) = \\dfrac{16}{3}$.<br><br>Also, $\\dfrac{(m_1 + m_2)^2}{m_1 m_2} = \\dfrac{(r m_2 + m_2)^2}{r m_2^2} = \\dfrac{(r+1)^2}{r}$.<br><br>Equating the two expressions:<br><br>$\\dfrac{(r+1)^2}{r} = \\dfrac{16}{3}$<br><br>$3(r^2 + 2r + 1) = 16r$<br><br>$3r^2 - 10r + 3 = 0$<br><br>$3r^2 - 9r - r + 3 = 0$<br><br>$(3r - 1)(r - 3) = 0$<br><br>$r = 3$ or $r = \\dfrac{1}{3}$<br><br>Therefore, the ratio of the slopes is $1 : 3$.<br><br>Answer: $1: 3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213650aee93fa0796d877", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "The equation of the line passing through the point of intersection of the lines $3 x-y=5$ and $x+3 y=1$ and making equal intercepts on the axes is", "image": null}, "options": [{"id": "TeWAL", "text": "$5 x+5 y-7=0$", "image": null, "isCorrect": true}, {"id": "FTyBG", "text": "$5 x-5 y-7=0$", "image": null, "isCorrect": false}, {"id": "MOReb", "text": "$2 x+y-7=0$", "image": null, "isCorrect": false}, {"id": "55HCZ", "text": "$x-y+7=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given lines are $3x - y = 5$ and $x + 3y = 1$.<br><br>Multiplying the first equation by $3$, we get $9x - 3y = 15$.<br><br>Adding this to the second equation gives $10x = 16 \\Rightarrow x = \\dfrac{8}{5}$.<br><br>Substituting $x = \\dfrac{8}{5}$ in $x + 3y = 1$, we get $\\dfrac{8}{5} + 3y = 1 \\Rightarrow 3y = -\\dfrac{3}{5} \\Rightarrow y = -\\dfrac{1}{5}$.<br><br>The point of intersection is $\\left(\\dfrac{8}{5}, -\\dfrac{1}{5}\\right)$.<br><br>Let the equation of the line making equal intercepts on the axes be $\\dfrac{x}{a} + \\dfrac{y}{a} = 1$, which simplifies to $x + y = a$.<br><br>Since this line passes through $\\left(\\dfrac{8}{5}, -\\dfrac{1}{5}\\right)$, we substitute these coordinates into the equation:<br><br>$\\dfrac{8}{5} - \\dfrac{1}{5} = a \\Rightarrow a = \\dfrac{7}{5}$<br><br>Therefore, the equation of the line is $x + y = \\dfrac{7}{5}$, which can be written as $5x + 5y
