  <script>
    const data = {"index": 13, "chapterId": "61c0899eacfd7cf47dec8481", "chapter": "Straight Lines", "exam": "MHT CET", "subject": "Mathematics", "totalTopics": 9, "totalQuestions": 161, "downloadTime": "2026-10-08 20:42:48", "topics": [{"index": 1, "topicId": "65a2633e0279619d9d8a3d6a", "title": "Coordinate System", "totalQuestions": 61, "questions": [{"_id": "6abb887715a9fc0fc8c143f6", "type": "singleCorrect", "question": {"text": "Point C and D divide segment AB respectively internally and externally, in the ratio m:n then B divides CD internally in the ratio --------", "image": null}, "options": [{"id": "MWUGe", "label": "A", "text": "$(m + n) : m$", "isCorrect": false, "image": null}, {"id": "aQ0UY", "label": "B", "text": "$(m + n) : n$", "isCorrect": false, "image": null}, {"id": "x3GJf", "label": "C", "text": "$(m - n) : (m + n)$", "isCorrect": true, "image": null}, {"id": "QSn50", "label": "D", "text": "$(m + n) : (m - n)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the length of the line segment AB be $d$.<br><br>Since point C divides AB internally in the ratio $m:n$, the distance CB is given by:<br><br>$CB = \\dfrac{n}{m+n} d$<br><br>Since point D divides AB externally in the ratio $m:n$, the distance BD is given by:<br><br>$BD = \\dfrac{n}{m-n} d$<br><br>The ratio in which B divides CD internally is the ratio of the distance CB to the distance BD:<br><br>$\\dfrac{CB}{BD} = \\dfrac{\\dfrac{n}{m+n} d}{\\dfrac{n}{m-n} d}$<br><br>$\\dfrac{CB}{BD} = \\dfrac{m-n}{m+n}$<br><br>Thus, B divides CD internally in the ratio $(m-n) : (m+n)$.<br><br>Answer: $(m - n) : (m + n)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887615a9fc0fc8c143ec", "type": "singleCorrect", "question": {"text": "If the polar coordinates of the point P are $\\left(1, \\dfrac{7\\pi}{4}\\right)$, then the sum of the squares of abscissa and ordinate of Cartesian coordinates of point P is", "image": null}, "options": [{"id": "Jlwxs", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "rrl6s", "label": "B", "text": "$1$", "isCorrect": true, "image": null}, {"id": "7rkZK", "label": "C", "text": "$4$", "isCorrect": false, "image": null}, {"id": "3A4PB", "label": "D", "text": "$\\dfrac{1}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given polar coordinates $(r, \\theta) = \\left(1, \\dfrac{7\\pi}{4}\\right)$.<br><br>The Cartesian coordinates $(x, y)$ are given by $x = r \\cos \\theta$ and $y = r \\sin \\theta$.<br><br>The sum of the squares of the abscissa and ordinate is $x^2 + y^2$.<br><br>Using the relation between Cartesian and polar coordinates:<br><br>$x^2 + y^2 = (r \\cos \\theta)^2 + (r \\sin \\theta)^2 = r^2 (\\cos^2 \\theta + \\sin^2 \\theta) = r^2$<br><br>Substituting $r = 1$, we get:<br><br>$x^2 + y^2 = 1^2 = 1$<br><br>Alternatively, calculating the coordinates explicitly:<br><br>$x = 1 \\cdot \\cos\\left(\\dfrac{7\\pi}{4}\\right) = \\dfrac{1}{\\sqrt{2}}$<br><br>$y = 1 \\cdot \\sin\\left(\\dfrac{7\\pi}{4}\\right) = -\\dfrac{1}{\\sqrt{2}}$<br><br>$x^2 + y^2 = \\left(\\dfrac{1}{\\sqrt{2}}\\right)^2 + \\left(-\\dfrac{1}{\\sqrt{2}}\\right)^2 = \\dfrac{1}{2} + \\dfrac{1}{2} = 1$<br><br>Answer: $1$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887515a9fc0fc8c143e0", "type": "singleCorrect", "question": {"text": "If $P(2,7)$ is the mid-point of a line segment intercepted between the co-ordinate axes, then the equation of line is", "image": null}, "options": [{"id": "l4isJ", "label": "A", "text": "$2x + 7y = 28$", "isCorrect": false, "image": null}, {"id": "6fLOd", "label": "B", "text": "$2x - 7y = 28$", "isCorrect": false, "image": null}, {"id": "rPz10", "label": "C", "text": "$7x + 2y = 28$", "isCorrect": true, "image": null}, {"id": "JkpMA", "label": "D", "text": "$7x + 2y = 14$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the line intersect the x-axis at $A(a, 0)$ and the y-axis at $B(0, b)$.<br><br>The mid-point of the line segment $AB$ is $\\left(\\dfrac{a}{2}, \\dfrac{b}{2}\\right)$.<br><br>Given that the mid-point is $P(2, 7)$, we have:<br><br>$\\dfrac{a}{2} = 2 \\Rightarrow a = 4$<br><br>$\\dfrac{b}{2} = 7 \\Rightarrow b = 14$<br><br>The equation of the line in intercept form is $\\dfrac{x}{a} + \\dfrac{y}{b} = 1$.<br><br>Substituting the values of $a$ and $b$, we get:<br><br>$\\dfrac{x}{4} + \\dfrac{y}{14} = 1$<br><br>Multiplying the entire equation by $28$, we obtain:<br><br>$7x + 2y = 28$<br><br>Answer: $7x + 2y = 28$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889515a9fc0fc8c14513", "type": "singleCorrect", "question": {"text": "The polar coordinates of point $P$ are $\\left(\\sqrt{2}, \\dfrac{\\pi}{4}\\right)$. If $Q$ is the image of $P$ about $y$ axis, then the polar coordinates of $Q$ are ______", "image": null}, "options": [{"id": "YPiFg", "label": "A", "text": "$\\left(\\sqrt{2}, \\dfrac{-3\\pi}{4}\\right)$", "isCorrect": false, "image": null}, {"id": "QVS2G", "label": "B", "text": "$\\left(-\\sqrt{2}, \\dfrac{\\pi}{4}\\right)$", "isCorrect": false, "image": null}, {"id": "x4Rqi", "label": "C", "text": "$\\left(-\\sqrt{2}, \\dfrac{3\\pi}{4}\\right)$", "isCorrect": false, "image": null}, {"id": "LVgB0", "label": "D", "text": "$\\left(\\sqrt{2}, \\dfrac{3\\pi}{4}\\right)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Cartesian coordinates of $P$ are given by $x = r \\cos \\theta$ and $y = r \\sin \\theta$.<br><br>$x = \\sqrt{2} \\cos\\left(\\dfrac{\\pi}{4}\\right) = 1$<br><br>$y = \\sqrt{2} \\sin\\left(\\dfrac{\\pi}{4}\\right) = 1$<br><br>Thus, the Cartesian coordinates of $P$ are $(1, 1)$.<br><br>The image of $P(1, 1)$ about the $y$-axis is $Q(-1, 1)$.<br><br>Converting $Q(-1, 1)$ to polar coordinates $(r, \\theta)$:<br><br>$r = \\sqrt{(-1)^2 + 1^2} = \\sqrt{2}$<br><br>Since $Q$ lies in the second quadrant, $\\theta = \\pi - \\tan^{-1}\\left(\\left|\\dfrac{1}{-1}\\right|\\right) = \\pi - \\dfrac{\\pi}{4} = \\dfrac{3\\pi}{4}$.<br><br>Therefore, the polar coordinates of $Q$ are $\\left(\\sqrt{2}, \\dfrac{3\\pi}{4}\\right)$.<br><br>Answer: $\\left(\\sqrt{2}, \\dfrac{3\\pi}{4}\\right)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883715a9fc0fc8c14198", "type": "singleCorrect", "question": {"text": "A line passes through the points $O(0, 0), A(3, 3)$. Then the polar coordinates of point A are ...", "image": null}, "options": [{"id": "lJNP6", "label": "A", "text": "$\\left(3\\sqrt{3}, \\dfrac{\\pi^c}{4}\\right)$", "isCorrect": false, "image": null}, {"id": "UVwa5", "label": "B", "text": "$\\left(3\\sqrt{2}, \\dfrac{\\pi^c}{3}\\right)$", "isCorrect": false, "image": null}, {"id": "5J0aY", "label": "C", "text": "$\\left(3\\sqrt{2}, \\dfrac{\\pi^c}{4}\\right)$", "isCorrect": true, "image": null}, {"id": "ALqYt", "label": "D", "text": "$\\left(2\\sqrt{2}, \\dfrac{\\pi^c}{4}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given Cartesian coordinates of point A are $(x, y) = (3, 3)$.<br><br>The polar coordinates $(r, \\theta)$ are given by $r = \\sqrt{x^2 + y^2}$ and $\\theta = \\tan^{-1}\\left(\\dfrac{y}{x}\\right)$.<br><br>Substituting the values, $r = \\sqrt{3^2 + 3^2} = \\sqrt{9 + 9} = \\sqrt{18} = 3\\sqrt{2}$.<br><br>$\\theta = \\tan^{-1}\\left(\\dfrac{3}{3}\\right) = \\tan^{-1}(1) = \\dfrac{\\pi^c}{4}$.<br><br>The polar coordinates of point A are $\\left(3\\sqrt{2}, \\dfrac{\\pi^c}{4}\\right)$.<br><br>Answer: $\\left(3\\sqrt{2}, \\dfrac{\\pi^c}{4}\\right)$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f28c30a4553e1bde88", "type": "singleCorrect", "question": {"text": "The coordinates of the orthocenter of the triangle whose sides are represented by the lines $4x - 7y + 10 = 0$, $x + y = 5$ and $7x + 4y = 15$ are $\\ldots$", "image": null}, "options": [{"id": "8IlRw", "label": "A", "text": "$(1,2)$", "isCorrect": true, "image": null}, {"id": "82UcK", "label": "B", "text": "$(1,-2)$", "isCorrect": false, "image": null}, {"id": "IhIZY", "label": "C", "text": "$(-1,2)$", "isCorrect": false, "image": null}, {"id": "CQize", "label": "D", "text": "$(-1,-2)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given lines forming the triangle are $4x - 7y + 10 = 0$, $x + y = 5$, and $7x + 4y = 15$.<br><br>The slopes of the lines $4x - 7y + 10 = 0$ and $7x + 4y = 15$ are $\\dfrac{4}{7}$ and $-\\dfrac{7}{4}$ respectively.<br><br>Since the product of their slopes is $\\dfrac{4}{7} \\times \\left(-\\dfrac{7}{4}\\right) = -1$, these two lines are perpendicular to each other.<br><br>The triangle formed by the given lines is a right-angled triangle. In a right-angled triangle, the orthocenter is the vertex where the right angle is formed.<br><br>Thus, the orthocenter is the point of intersection of the perpendicular lines $4x - 7y + 10 = 0$ and $7x + 4y = 15$.<br><br>Solving the equations:<br>$4x - 7y = -10$<br>$7x + 4y = 15$<br><br>Multiplying the first equation by $4$ and the second by $7$, we get:<br>$16x - 28y = -40$<br>$49x + 28y = 105$<br><br>Adding these equations gives:<br>$65x = 65 \\Rightarrow x = 1$<br><br>Substituting $x = 1$ in $7x + 4y = 15$, we get:<br>$7(1) + 4y = 15 \\Rightarrow 4y = 8 \\Rightarrow y = 2$<br><br>The coordinates of the orthocenter are $(1, 2)$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3478c30a4553e1be20c", "type": "singleCorrect", "question": {"text": "The line $y = 2x + c$ passes through a point that is equidistant from both the axes and lies in the first quadrant $(x > 0, y > 0)$. Then the value of c is...", "image": null}, "options": [{"id": "JKW7c", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "NcZ8n", "label": "B", "text": "$1$", "isCorrect": false, "image": null}, {"id": "dCNMw", "label": "C", "text": "$2$", "isCorrect": false, "image": null}, {"id": "McxxX", "label": "D", "text": "$-2$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the point in the first quadrant equidistant from both axes be $(a, a)$, where $a > 0$.<br><br>Since the line $y = 2x + c$ passes through $(a, a)$, substituting the coordinates gives:<br><br>$a = 2a + c$<br><br>$c = -a$<br><br>Since $a > 0$, it follows that $c < 0$.<br><br>Among the given options, the only negative value is $-2$.<br><br>Answer: $-2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2c98c30a4553e1bdcc6", "type": "singleCorrect", "question": {"text": "If $A(2, -3)$ and $C(-6, 7)$ are opposite vertices of a rhombus ABCD, then the equation of diagonal BD is", "image": null}, "options": [{"id": "osWSx", "label": "A", "text": "$5x - 4y + 2 = 0$", "isCorrect": false, "image": null}, {"id": "geYJ3", "label": "B", "text": "$5x + 4y + 2 = 0$", "isCorrect": false, "image": null}, {"id": "oZgF0", "label": "C", "text": "$4x - 5y + 18 = 0$", "isCorrect": true, "image": null}, {"id": "6UycA", "label": "D", "text": "$4x + 5y + 18 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The diagonals of a rhombus bisect each other at right angles. Thus, diagonal $BD$ is the perpendicular bisector of diagonal $AC$.<br><br>The midpoint of diagonal $AC$ is $\\left(\\dfrac{2 - 6}{2}, \\dfrac{-3 + 7}{2}\\right) = (-2, 2)$.<br><br>The slope of diagonal $AC$ is $m_{AC} = \\dfrac{7 - (-3)}{-6 - 2} = \\dfrac{10}{-8} = -\\dfrac{5}{4}$.<br><br>Since $BD \\perp AC$, the slope of diagonal $BD$ is $m_{BD} = -\\dfrac{1}{m_{AC}} = \\dfrac{4}{5}$.<br><br>The equation of diagonal $BD$, which passes through the midpoint $(-2, 2)$ with slope $\\dfrac{4}{5}$, is:<br><br>$y - 2 = \\dfrac{4}{5}(x - (-2))$<br><br>$5(y - 2) = 4(x + 2)$<br><br>$5y - 10 = 4x + 8$<br><br>$4x - 5y + 18 = 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31c8c30a4553e1be04a", "type": "singleCorrect", "question": {"text": "If a triangle $ABC$ has vertices $A(1,-6), B(2,-3)$ and $C(3,-2)$, then the coordinates of its orthocenter are....", "image": null}, "options": [{"id": "udkEy", "label": "A", "text": "$(-6, 1)$", "isCorrect": true, "image": null}, {"id": "IKd0s", "label": "B", "text": "$(6, 1)$", "isCorrect": false, "image": null}, {"id": "xhauA", "label": "C", "text": "$(-2, 3)$", "isCorrect": false, "image": null}, {"id": "9q7M9", "label": "D", "text": "$(3, 2)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the vertices of the triangle be $A(1, -6)$, $B(2, -3)$, and $C(3, -2)$.<br><br>The slope of the side $BC$ is $m_{BC} = \\dfrac{-2 - (-3)}{3 - 2} = 1$.<br>The altitude from $A$ to $BC$ is perpendicular to $BC$, so its slope is $-1$.<br>The equation of the altitude from $A(1, -6)$ is:<br>$y - (-6) = -1(x - 1)$<br>$x + y = -5$  ... (i)<br><br>The slope of the side $AC$ is $m_{AC} = \\dfrac{-2 - (-6)}{3 - 1} = \\dfrac{4}{2} = 2$.<br>The altitude from $B$ to $AC$ is perpendicular to $AC$, so its slope is $-\\dfrac{1}{2}$.<br>The equation of the altitude from $B(2, -3)$ is:<br>$y - (-3) = -\\dfrac{1}{2}(x - 2)$<br>$2y + 6 = -x + 2$<br>$x + 2y = -4$  ... (ii)<br><br>The orthocenter is the point of intersection of the altitudes. Solving equations (i) and (ii):<br>Subtracting (i) from (ii), we get:<br>$(x + 2y) - (x + y) = -4 - (-5)$<br>$y = 1$<br><br>Substituting $y = 1$ into equation (i):<br>$x + 1 = -5$<br>$x = -6$<br><br>The coordinates of the orthocenter are $(-6, 1)$.<br><br>Answer: $(-6, 1)$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3638c30a4553e1be338", "type": "singleCorrect", "question": {"text": "The line $2x+y=4$ intersects X and Y axes at points A and B respectively. Let $C(p, q)$ be the point such that the lines AC and BC are perpendicular. The distance of point C from the midpoint of segment AB is...", "image": null}, "options": [{"id": "jmP1w", "label": "A", "text": "$\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "DR8PZ", "label": "B", "text": "$\\sqrt{5}$", "isCorrect": true, "image": null}, {"id": "KZPvt", "label": "C", "text": "$2\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "MSnDP", "label": "D", "text": "$2\\sqrt{5}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The line $2x+y=4$ intersects the X-axis at $A(2, 0)$ and the Y-axis at $B(0, 4)$.<br><br>The midpoint of segment AB is $M\\left(\\dfrac{2+0}{2}, \\dfrac{0+4}{2}\\right) = (1, 2)$.<br><br>Since the lines AC and BC are perpendicular, $\\angle ACB = 90^{\\circ}$.<br><br>This implies that the point C lies on a circle with AB as its diameter.<br><br>The distance of point C from the midpoint of segment AB is the radius of this circle.<br><br>The length of the diameter AB is $\\sqrt{(2-0)^2 + (0-4)^2} = \\sqrt{4+16} = \\sqrt{20} = 2\\sqrt{5}$.<br><br>The radius of the circle is $\\dfrac{AB}{2} = \\dfrac{2\\sqrt{5}}{2} = \\sqrt{5}$.<br><br>Thus, the distance of point C from the midpoint of segment AB is $\\sqrt{5}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c01bf9280d7f9932e6d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the line $3 x+4 y-24=0$ intersects $X$ and $Y$ axes in points $A$ and $B$ respectively then incenter of the triangle $O A B$ where $O$ is origin is", "image": null}, "options": [{"id": "0630Z", "text": "$(4,4)$", "image": null, "isCorrect": false}, {"id": "F9fmK", "text": "$(2,2)$", "image": null, "isCorrect": true}, {"id": "jETPL", "text": "$(3,4)$", "image": null, "isCorrect": false}, {"id": "CgOeX", "text": "$(4,3)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of the line is $3x + 4y - 24 = 0$.<br><br>For x-intercept, put $y = 0$, we get $x = 8$. Thus, $A \\equiv (8, 0)$.<br><br>For y-intercept, put $x = 0$, we get $y = 6$. Thus, $B \\equiv (0, 6)$.<br><br>The vertices of $\\triangle OAB$ are $O(0, 0)$, $A(8, 0)$ and $B(0, 6)$.<br><br>The lengths of the sides of $\\triangle OAB$ are:<br><br>$OA = 8$, $OB = 6$ and $AB = \\sqrt{8^2 + 6^2} = 10$.<br><br>Let $a = OB = 6$, $b = OA = 8$, $c = AB = 10$.<br><br>The coordinates of the incenter are given by $\\left( \\dfrac{a x_1 + b x_2 + c x_3}{a + b + c}, \\dfrac{a y_1 + b y_2 + c y_3}{a + b + c} \\right)$.<br><br>Substituting the values:<br><br>$x = \\dfrac{6(8) + 8(0) + 10(0)}{6 + 8 + 10} = \\dfrac{48}{24} = 2$<br><br>$y = \\dfrac{6(0) + 8(6) + 10(0)}{6 + 8 + 10} = \\dfrac{48}{24} = 2$<br><br>Therefore, the incenter is $(2, 2)$.<br><br>Answer: $(2,2)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd3bf9280d7f9932cc5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The circumcenter of the triangle formed by lines $x \\mathrm{y}+2 x+2 \\mathrm{y}+4=0$ and $x+\\mathrm{y}+2=0$ is", "image": null}, "options": [{"id": "KQ7J1", "text": "$(0,0)$", "image": null, "isCorrect": false}, {"id": "xAFLi", "text": "$(-2,-2)$", "image": null, "isCorrect": false}, {"id": "wHmtg", "text": "$(-1,-1)$", "image": null, "isCorrect": true}, {"id": "9Mhap", "text": "$(-1,-2)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the given pair of lines is $xy + 2x + 2y + 4 = 0$.<br><br>Factorizing this, we get $x(y + 2) + 2(y + 2) = 0$, which gives $(x + 2)(y + 2) = 0$.<br><br>Thus, the two lines are $x = -2$ and $y = -2$.<br><br>The third line is $x + y + 2 = 0$.<br><br>The vertices of the triangle are the points of intersection of these three lines:<br>Intersection of $x = -2$ and $y = -2$ is $A(-2, -2)$.<br>Intersection of $x = -2$ and $x + y + 2 = 0$ is $B(-2, 0)$.<br>Intersection of $y = -2$ and $x + y + 2 = 0$ is $C(0, -2)$.<br><br>Since the lines $x = -2$ and $y = -2$ are perpendicular to each other, the triangle is right-angled at $A(-2, -2)$.<br><br>In a right-angled triangle, the circumcenter is the midpoint of the hypotenuse.<br><br>The hypotenuse is the line segment joining $B(-2, 0)$ and $C(0, -2)$.<br><br>The midpoint of $BC$ is $\\left( \\dfrac{-2 + 0}{2}, \\dfrac{0 - 2}{2} \\right) = (-1, -1)$.<br><br>Therefore, the circumcenter of the triangle is $(-1, -1)$.<br><br>Answer: $(-1,-1)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc6bf9280d7f9932c44", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The straight line passing through $(-3,6)$ and midpoint of the line segment joining the points $(4,-5)$ and $(-2,9)$ have inclination", "image": null}, "options": [{"id": "2aGQj", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": false}, {"id": "RzgbP", "text": "$\\frac{\\pi}{6}$", "image": null, "isCorrect": false}, {"id": "W4TRC", "text": "$\\frac{\\pi}{3}$", "image": null, "isCorrect": false}, {"id": "D2RY6", "text": "$\\frac{3 \\pi}{4}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The midpoint of the line segment joining the points $(4,-5)$ and $(-2,9)$ is given by $\\left(\\dfrac{4-2}{2}, \\dfrac{-5+9}{2}\\right) = (1,2)$.<br><br>The slope $m$ of the line passing through $(-3,6)$ and $(1,2)$ is<br><br>$m = \\dfrac{2-6}{1-(-3)} = \\dfrac{-4}{4} = -1$<br><br>Let $\\theta$ be the inclination of the line. Then $\\tan \\theta = m = -1$.<br><br>Since the inclination $\\theta$ lies in the interval $[0, \\pi)$, we have $\\theta = \\dfrac{3\\pi}{4}$.<br><br>Answer: $\\frac{3 \\pi}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb2bf9280d7f9932ba6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A line passes through $\\mathrm{P}(-4,1)$ and meets the co-ordinate axes at points $A$ and $B$. If $P$ divides the segment $A B$ internally in the ratio $1: 2$, then the equation of the line is", "image": null}, "options": [{"id": "wcPra", "text": "$x-2 y+6=0$", "image": null, "isCorrect": true}, {"id": "Hv2JI", "text": "$x+10 y-6=0$", "image": null, "isCorrect": false}, {"id": "1c2V0", "text": "$2 x+y+4=0$", "image": null, "isCorrect": false}, {"id": "LWsB5", "text": "$x-y+5=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the line meet the x-axis at $A(a, 0)$ and the y-axis at $B(0, b)$.<br><br>The point $P(-4, 1)$ divides the line segment $AB$ internally in the ratio $1:2$.<br><br>Using the section formula, the coordinates of $P$ are given by:<br><br>$x = \\dfrac{1(0) + 2(a)}{1 + 2} = \\dfrac{2a}{3}$<br><br>$y = \\dfrac{1(b) + 2(0)}{1 + 2} = \\dfrac{b}{3}$<br><br>Equating these to the given coordinates of $P(-4, 1)$:<br><br>$\\dfrac{2a}{3} = -4 \\Rightarrow 2a = -12 \\Rightarrow a = -6$<br><br>$\\dfrac{b}{3} = 1 \\Rightarrow b = 3$<br><br>The intercepts of the line on the coordinate axes are $a = -6$ and $b = 3$.<br><br>The equation of the line in double-intercept form is:<br><br>$\\dfrac{x}{a} + \\dfrac{y}{b} = 1$<br><br>$\\dfrac{x}{-6} + \\dfrac{y}{3} = 1$<br><br>Multiplying the entire equation by $6$, we get:<br><br>$-x + 2y = 6$<br><br>$x - 2y + 6 = 0$<br><br>Answer: $x-2 y+6=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9dbf9280d7f9932aea", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Let $A \\equiv(0,0), B(3,0), C(0,-4)$ are vertices of $\\triangle A B C$ then the co-ordinates of incentre of $\\triangle A B C$ is", "image": null}, "options": [{"id": "4UWWz", "text": "$(1,1)$", "image": null, "isCorrect": false}, {"id": "TTRQH", "text": "$(1,-1)$", "image": null, "isCorrect": true}, {"id": "kiVtd", "text": "$(-1,1)$", "image": null, "isCorrect": false}, {"id": "J09NJ", "text": "$(-1,-1)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The vertices of the triangle are $A(0,0)$, $B(3,0)$, and $C(0,-4)$.<br><br>The lengths of the sides of the triangle are:<br>$a = BC = \\sqrt{(3-0)^2 + (0-(-4))^2} = \\sqrt{9+16} = 5$<br>$b = CA = \\sqrt{(0-0)^2 + (-4-0)^2} = \\sqrt{16} = 4$<br>$c = AB = \\sqrt{(3-0)^2 + (0-0)^2} = \\sqrt{9} = 3$<br><br>The coordinates of the incentre $(x, y)$ are given by the formula:<br>$x = \\dfrac{a x_1 + b x_2 + c x_3}{a + b + c}$<br>$y = \\dfrac{a y_1 + b y_2 + c y_3}{a + b + c}$<br><br>Substituting the values:<br>$x = \\dfrac{5(0) + 4(3) + 3(0)}{5 + 4 + 3} = \\dfrac{12}{12} = 1$<br><br>$y = \\dfrac{5(0) + 4(0) + 3(-4)}{5 + 4 + 3} = \\dfrac{-12}{12} = -1$<br><br>The coordinates of the incentre are $(1, -1)$.<br><br>Answer: $(1,-1)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b81bf9280d7f99329d9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The circumradius of the triangle formed by the lines $x y+2 x+2 y+4=0$ and $x+y+2=0$ is", "image": null}, "options": [{"id": "k046N", "text": "2 units", "image": null, "isCorrect": false}, {"id": "Wh4jB", "text": "1 unit", "image": null, "isCorrect": false}, {"id": "xh5M1", "text": "$\\sqrt{2}$ units", "image": null, "isCorrect": true}, {"id": "tRkAU", "text": "$\\sqrt{3}$ units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation $xy + 2x + 2y + 4 = 0$ can be factored as:<br><br>$x(y + 2) + 2(y + 2) = 0$<br><br>$(x + 2)(y + 2) = 0$<br><br>This represents two straight lines $x = -2$ and $y = -2$.<br><br>The third line is $x + y + 2 = 0$.<br><br>The vertices of the triangle formed by these three lines are the points of intersection of these lines taken pairwise.<br><br>Solving $x = -2$ and $y = -2$, we get the vertex $A(-2, -2)$.<br><br>Solving $x = -2$ and $x + y + 2 = 0$, we get the vertex $B(-2, 0)$.<br><br>Solving $y = -2$ and $x + y + 2 = 0$, we get the vertex $C(0, -2)$.<br><br>Since the lines $x = -2$ and $y = -2$ are parallel to the $y$-axis and $x$-axis respectively, they are perpendicular to each other. Thus, the triangle $ABC$ is a right-angled triangle with the right angle at $A(-2, -2)$.<br><br>For a right-angled triangle, the circumcenter is the midpoint of the hypotenuse, and the circumradius is half the length of the hypotenuse.<br><br>The hypotenuse is $BC$. Its length is:<br><br>$BC = \\sqrt{(0 - (-2))^2 + (-2 - 0)^2} = \\sqrt{4 + 4} = \\sqrt{8} = 2\\sqrt{2}$<br><br>Circumradius $= \\dfrac{BC}{2} = \\dfrac{2\\sqrt{2}}{2} = \\sqrt{2}$ units.<br><br>Answer: $\\sqrt{2}$ units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b63bf9280d7f99328bf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The points $(1,3)$ and $(5,1)$ are two opposite vertices of a rectangle. The other two vertices are lie on the line $\\mathrm{y}=2 x+\\mathrm{c}$ where c is the constant, then co-ordinates of other two vertices are", "image": null}, "options": [{"id": "szUFn", "text": "$(4,4),(2,0)$", "image": null, "isCorrect": true}, {"id": "Tf8Jy", "text": "$(4,4),(1,0)$", "image": null, "isCorrect": false}, {"id": "lUWDF", "text": "$(2,0),(4,1)$", "image": null, "isCorrect": false}, {"id": "XA6I0", "text": "$(2,0),(1,-1)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the given opposite vertices of the rectangle be $A(1,3)$ and $C(5,1)$.<br><br>The midpoint of the diagonal $AC$ is given by $M = \\left(\\dfrac{1+5}{2}, \\dfrac{3+1}{2}\\right) = (3,2)$.<br><br>In a rectangle, the diagonals bisect each other. Therefore, the midpoint of the other diagonal $BD$ is also $M(3,2)$.<br><br>Since the vertices $B$ and $D$ lie on the line $y = 2x + c$, the midpoint $M(3,2)$ must also lie on this line.<br><br>Substituting $x=3$ and $y=2$ into the equation of the line:<br><br>$2 = 2(3) + c \\Rightarrow c = -4$<br><br>So, the equation of the line containing $B$ and $D$ is $y = 2x - 4$.<br><br>The distance from the center $M(3,2)$ to vertex $A(1,3)$ is:<br><br>$MA = \\sqrt{(3-1)^2 + (2-3)^2} = \\sqrt{4+1} = \\sqrt{5}$<br><br>Since the diagonals of a rectangle are equal and bisect each other, the distance from $M$ to $B$ and $D$ must also be $\\sqrt{5}$. Let the coordinates of the other vertices be $(x, 2x-4)$.<br><br>Using the distance formula:<br><br>$(x-3)^2 + (2x-4-2)^2 = (\\sqrt{5})^2$<br><br>$(x-3)^2 + 4(x-3)^2 = 5$<br><br>$5(x-3)^2 = 5 \\Rightarrow (x-3)^2 = 1$<br><br>$x - 3 = \\pm 1 \\Rightarrow x = 4$ or $x = 2$<br><br>For $x = 4$, $y = 2(4) - 4 = 4$. The point is $(4,4)$.<br><br>For $x = 2$, $y = 2(2) - 4 = 0$. The point is $(2,0)$.<br><br>Thus, the coordinates of the other two vertices are $(4,4)$ and $(2,0)$.<br><br>Answer: $(4,4),(2,0)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b51bf9280d7f9932827", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the line $2 x+y=k$ passes though the point which divides the line segment joining the points $(1,1)$ and $(2,4)$ internally in the ratio $3: 2$ then, $(k+1):(k-1)=$", "image": null}, "options": [{"id": "0JnAL", "text": "$\\frac{5}{7}$", "image": null, "isCorrect": false}, {"id": "mAo8D", "text": "$\\frac{7}{5}$", "image": null, "isCorrect": true}, {"id": "FUzpv", "text": "$\\frac{8}{5}$", "image": null, "isCorrect": false}, {"id": "vBRm8", "text": "$\\frac{6}{5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the point dividing the line segment joining $(1,1)$ and $(2,4)$ internally in the ratio $3:2$ be $(x, y)$.<br><br>Using the section formula, we have:<br>$x = \\dfrac{3(2) + 2(1)}{3 + 2} = \\dfrac{8}{5}$<br>$y = \\dfrac{3(4) + 2(1)}{3 + 2} = \\dfrac{14}{5}$<br><br>The point $\\left(\\dfrac{8}{5}, \\dfrac{14}{5}\\right)$ lies on the line $2x + y = k$.<br><br>Substituting the coordinates into the equation of the line:<br>$2\\left(\\dfrac{8}{5}\\right) + \\dfrac{14}{5} = k$<br>$k = \\dfrac{16}{5} + \\dfrac{14}{5} = \\dfrac{30}{5} = 6$<br><br>We need to find the value of $\\dfrac{k+1}{k-1}$.<br><br>Substituting $k = 6$:<br>$\\dfrac{k+1}{k-1} = \\dfrac{6+1}{6-1} = \\dfrac{7}{5}$<br><br>Answer: $\\frac{7}{5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3ebf9280d7f993276e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the equation of the median through vertex $A(3, k)$ of $\\triangle A B C$ with vertices $\\mathrm{B}(2,1)$ and $\\mathrm{C}(-4,5)$ is $x+4 \\mathrm{y}=\\mathrm{p}$, then $\\mathrm{k}=$ where p and k are constants", "image": null}, "options": [{"id": "Zl86u", "text": "$1$", "image": null, "isCorrect": false}, {"id": "yOJel", "text": "$2$", "image": null, "isCorrect": true}, {"id": "LpOjl", "text": "$-2$", "image": null, "isCorrect": false}, {"id": "S7bct", "text": "$3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $D$ be the midpoint of the side $BC$.<br><br>The coordinates of $D$ are $\\left(\\dfrac{2 - 4}{2}, \\dfrac{1 + 5}{2}\\right) = (-1, 3)$.<br><br>Since the median passes through $D(-1, 3)$, its coordinates must satisfy the equation of the median $x + 4y = p$.<br><br>$-1 + 4(3) = p \\Rightarrow p = 11$<br><br>The equation of the median is $x + 4y = 11$.<br><br>Since the vertex $A(3, k)$ also lies on the median, its coordinates must satisfy this equation.<br><br>$3 + 4k = 11$<br><br>$4k = 8$<br><br>$k = 2$<br><br>Answer: $2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b17bf9280d7f9932639", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A straight line through the origin 0 meets the line $3 \\mathrm{y}=10-4 x$ and $8 x+6 y+5=0$ at the points $A$ and $B$ respectively. Then 0 divides the segment $A B$ in the ratio.", "image": null}, "options": [{"id": "37V5P", "text": "$4: 1$", "image": null, "isCorrect": true}, {"id": "PHN6M", "text": "$2: 3$", "image": null, "isCorrect": false}, {"id": "wkvrc", "text": "$1: 5$", "image": null, "isCorrect": false}, {"id": "fCW8i", "text": "$1: 3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given lines are $L_1: 4x + 3y - 10 = 0$ and $L_2: 8x + 6y + 5 = 0$.<br><br>Since the coefficients of $x$ and $y$ are proportional, the lines are parallel.<br><br>The perpendicular distance from the origin $O(0,0)$ to $L_1$ is:<br><br>$d_1 = \\dfrac{|-10|}{\\sqrt{4^2+3^2}} = \\dfrac{10}{5} = 2$<br><br>The perpendicular distance from the origin $O(0,0)$ to $L_2$ is:<br><br>$d_2 = \\dfrac{|5|}{\\sqrt{8^2+6^2}} = \\dfrac{5}{10} = \\dfrac{1}{2}$<br><br>A straight line through the origin intersects $L_1$ at $A$ and $L_2$ at $B$. By similar triangles, the ratio in which the origin divides the segment $AB$ is equal to the ratio of the perpendicular distances from the origin to the respective lines.<br><br>$\\dfrac{OA}{OB} = \\dfrac{d_1}{d_2} = \\dfrac{2}{1/2} = 4$<br><br>Thus, the required ratio is $4:1$.<br><br>Answer: $4: 1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b04bf9280d7f99325a7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The point of intersection of the diagonals of the rectangle whose sides are contained in the lines $x=8, x=10, \\mathrm{y}=11$ and $\\mathrm{y}=12$ is", "image": null}, "options": [{"id": "J2GXU", "text": "$\\left(\\frac{9}{2}, 23\\right)$", "image": null, "isCorrect": false}, {"id": "CvXzr", "text": "$\\left(9, \\frac{23}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "vTcfu", "text": "$\\left(7, \\frac{21}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "4JRGR", "text": "$\\left(\\frac{7}{2}, 21\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The sides of the rectangle are given by the lines $x=8$, $x=10$, $y=11$, and $y=12$.<br><br>The vertices of the rectangle are $(8, 11)$, $(10, 11)$, $(10, 12)$, and $(8, 12)$.<br><br>The point of intersection of the diagonals of a rectangle is the midpoint of the line segment joining opposite vertices.<br><br>Using the opposite vertices $(8, 11)$ and $(10, 12)$, the midpoint is given by $\\left(\\dfrac{8+10}{2}, \\dfrac{11+12}{2}\\right)$.<br><br>This simplifies to $\\left(9, \\dfrac{23}{2}\\right)$.<br><br>Answer: $\\left(9, \\frac{23}{2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f00aee93fa0796dcb4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "The area of the triangle with vertices $(1,2,0)$, $(1,0,2)$ and $(0,3,1)$ is.", "image": null}, "options": [{"id": "U0xqc", "text": "$\\sqrt{3}$ sq. units", "image": null, "isCorrect": false}, {"id": "iuFqk", "text": "$\\sqrt{6}$ sq. units", "image": null, "isCorrect": true}, {"id": "5406w", "text": "$\\sqrt{5}$ sq. units", "image": null, "isCorrect": false}, {"id": "TsT9V", "text": "$\\sqrt{7}$ sq. units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $A(1, 2, 0)$, $B(1, 0, 2)$ and $C(0, 3, 1)$ be the vertices of the triangle.<br><br>The vectors representing the sides $\\overrightarrow{AB}$ and $\\overrightarrow{AC}$ are:<br><br>$\\overrightarrow{AB} = (1-1)\\hat{i} + (0-2)\\hat{j} + (2-0)\\hat{k} = -2\\hat{j} + 2\\hat{k}$<br><br>$\\overrightarrow{AC} = (0-1)\\hat{i} + (3-2)\\hat{j} + (1-0)\\hat{k} = -\\hat{i} + \\hat{j} + \\hat{k}$<br><br>The area of the triangle is given by $\\dfrac{1}{2} |\\overrightarrow{AB} \\times \\overrightarrow{AC}|$.<br><br>$\\overrightarrow{AB} \\times \\overrightarrow{AC} = \\begin{vmatrix} \\hat{i} & \\hat{j} & \\hat{k} \\\\ 0 & -2 & 2 \\\\ -1 & 1 & 1 \\end{vmatrix}$<br><br>$= \\hat{i}(-2 - 2) - \\hat{j}(0 + 2) + \\hat{k}(0 - 2) = -4\\hat{i} - 2\\hat{j} - 2\\hat{k}$<br><br>Now, finding the magnitude of the cross product:<br><br>$|\\overrightarrow{AB} \\times \\overrightarrow{AC}| = \\sqrt{(-4)^2 + (-2)^2 + (-2)^2} = \\sqrt{16 + 4 + 4} = \\sqrt{24} = 2\\sqrt{6}$<br><br>Area of triangle $= \\dfrac{1}{2} \\times 2\\sqrt{6} = \\sqrt{6}$ sq. units.<br><br>Answer: $\\sqrt{6}$ sq. units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213cc0aee93fa0796db96", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "$\\triangle \\mathrm{OAB}$ is formed by the lines $x^2-4 x y+y^2=0$ and the line $A B$. The equation of line $A B$ is $2 x+3 y-1=0$. Then the equation of the median of the triangle drawn from the origin is", "image": null}, "options": [{"id": "V1lKb", "text": "$7 x+8 y=0$", "image": null, "isCorrect": false}, {"id": "tHU8Z", "text": "$7 x-8 y=0$", "image": null, "isCorrect": true}, {"id": "qOotv", "text": "$8 x+7 y=0$", "image": null, "isCorrect": false}, {"id": "iCQYg", "text": "$8 x-7 y=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given pair of straight lines passing through the origin is $x^2 - 4xy + y^2 = 0$.<br><br>The given line intersecting these lines at $A$ and $B$ is $2x + 3y - 1 = 0$, which can be written as $x = \\dfrac{1 - 3y}{2}$.<br><br>To find the coordinates of $A$ and $B$, we substitute $x$ into the equation of the pair of lines:<br><br>$\\left(\\dfrac{1 - 3y}{2}\\right)^2 - 4\\left(\\dfrac{1 - 3y}{2}\\right)y + y^2 = 0$<br><br>$\\dfrac{1 - 6y + 9y^2}{4} - 2y(1 - 3y) + y^2 = 0$<br><br>Multiplying the entire equation by $4$, we get:<br><br>$1 - 6y + 9y^2 - 8y(1 - 3y) + 4y^2 = 0$<br><br>$1 - 6y + 9y^2 - 8y + 24y^2 + 4y^2 = 0$<br><br>$37y^2 - 14y + 1 = 0$<br><br>The roots of this quadratic equation, $y_1$ and $y_2$, are the $y$-coordinates of points $A$ and $B$.<br><br>The sum of the roots is $y_1 + y_2 = \\dfrac{14}{37}$.<br><br>The $y$-coordinate of the midpoint $M$ of $AB$ is $y_m = \\dfrac{y_1 + y_2}{2} = \\dfrac{7}{37}$.<br><br>Since the midpoint $M(x_m, y_m)$ lies on the line $2x + 3y - 1 = 0$, we can find $x_m$ by substituting $y_m$:<br><br>$2x_m + 3\\left(\\dfrac{7}{37}\\right) - 1 = 0$<br><br>$2x_m = 1 - \\dfrac{21}{37} = \\dfrac{16}{37}$<br><br>$x_m = \\dfrac{8}{37}$<br><br>The coordinates of the midpoint $M$ are $\\left(\\dfrac{8}{37}, \\dfrac{7}{37}\\right)$.<br><br>The median of the triangle from the origin passes through $O(0,0)$ and $M\\left(\\dfrac{8}{37}, \\dfrac{7}{37}\\right)$. Its equation is given by:<br><br>$y = \\dfrac{y_m}{x_m} x$<br><br>$y = \\dfrac{7/37}{8/37} x$<br><br>$y = \\dfrac{7}{8} x$<br><br>$7x - 8y = 0$<br><br>Answer: $7 x-8 y=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c60aee93fa0796db69", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Let a line intersect the co-ordinate axes in points $A$ and $B$ such that the area of the triangle $O A B$ is 12 sq. units. If the line passes through the point $(2,3)$, then the equation of the line is", "image": null}, "options": [{"id": "xSqEc", "text": "$x+y=5$", "image": null, "isCorrect": false}, {"id": "G0MzY", "text": "$3 x+2 y=12$", "image": null, "isCorrect": true}, {"id": "RaSax", "text": "$2 x+y=7$", "image": null, "isCorrect": false}, {"id": "Ole3a", "text": "$2 x+3 y=13$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the equation of the line be $\\dfrac{x}{a} + \\dfrac{y}{b} = 1$<br><br>Since the line passes through the point $(2,3)$, we have:<br><br>$\\dfrac{2}{a} + \\dfrac{3}{b} = 1 \\Rightarrow 2b + 3a = ab$<br><br>The area of the triangle $OAB$ formed by the line with the coordinate axes is given by:<br><br>$\\dfrac{1}{2}|ab| = 12 \\Rightarrow |ab| = 24$<br><br>Taking $ab = 24$, we substitute $a = \\dfrac{24}{b}$ into the first equation:<br><br>$2b + 3\\left(\\dfrac{24}{b}\\right) = 24$<br><br>$2b^2 - 24b + 72 = 0$<br><br>$b^2 - 12b + 36 = 0$<br><br>$(b-6)^2 = 0 \\Rightarrow b = 6$<br><br>Substituting $b = 6$ into $ab = 24$, we get $a = 4$.<br><br>The equation of the line is:<br><br>$\\dfrac{x}{4} + \\dfrac{y}{6} = 1$<br><br>$3x + 2y = 12$<br><br>Answer: $3 x+2 y=12$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138d0aee93fa0796d9ad", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "The incenter of the triangle ABC , whose vertices are $\\mathrm{A}(0,2,1), \\mathrm{B}(-2,0,0)$ and $\\mathrm{C}(-2,0,2)$ is", "image": null}, "options": [{"id": "NcBM5", "text": "$\\left(\\dfrac{3}{2},-\\dfrac{1}{2},-1\\right)$", "image": null, "isCorrect": false}, {"id": "dMe2N", "text": "$\\left(\\dfrac{3}{2}, \\dfrac{1}{2}, 1\\right)$", "image": null, "isCorrect": false}, {"id": "njjd3", "text": "$\\left(-\\dfrac{3}{2}, \\dfrac{1}{2}, 1\\right)$", "image": null, "isCorrect": true}, {"id": "FLNQy", "text": "$\\quad\\left(-\\dfrac{3}{2},-\\dfrac{1}{2},-1\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The vertices of the triangle are $A(0,2,1)$, $B(-2,0,0)$, and $C(-2,0,2)$.<br><br>The lengths of the sides of the triangle are:<br><br>$a = BC = \\sqrt{(-2 - (-2))^2 + (0 - 0)^2 + (2 - 0)^2} = \\sqrt{0 + 0 + 4} = 2$<br><br>$b = AC = \\sqrt{(-2 - 0)^2 + (0 - 2)^2 + (2 - 1)^2} = \\sqrt{4 + 4 + 1} = 3$<br><br>$c = AB = \\sqrt{(-2 - 0)^2 + (0 - 2)^2 + (0 - 1)^2} = \\sqrt{4 + 4 + 1} = 3$<br><br>The coordinates of the incenter $I(x, y, z)$ are given by:<br><br>$I = \\left( \\dfrac{a x_1 + b x_2 + c x_3}{a + b + c}, \\dfrac{a y_1 + b y_2 + c y_3}{a + b + c}, \\dfrac{a z_1 + b z_2 + c z_3}{a + b + c} \\right)$<br><br>Substituting the values, we get:<br><br>$x = \\dfrac{2(0) + 3(-2) + 3(-2)}{2 + 3 + 3} = \\dfrac{-12}{8} = -\\dfrac{3}{2}$<br><br>$y = \\dfrac{2(2) + 3(0) + 3(0)}{2 + 3 + 3} = \\dfrac{4}{8} = \\dfrac{1}{2}$<br><br>$z = \\dfrac{2(1) + 3(0) + 3(2)}{2 + 3 + 3} = \\dfrac{2 + 0 + 6}{8} = \\dfrac{8}{8} = 1$<br><br>The incenter of the triangle is $\\left(-\\dfrac{3}{2}, \\dfrac{1}{2}, 1\\right)$.<br><br>Answer: $\\left(-\\dfrac{3}{2}, \\dfrac{1}{2}, 1\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138d0aee93fa0796d9ab", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "If $\\mathrm{O}(0,0), \\mathrm{A}(1,2)$ and $\\mathrm{B}(3,4)$ are the vertices of triangle OAB , then the joint equation of the altitude and median drawn from O is", "image": null}, "options": [{"id": "uokGK", "text": "$3 x^2-x y-2 y^2=0$", "image": null, "isCorrect": false}, {"id": "Z7qkM", "text": "$3 x^2+x y+2 y^2=0$", "image": null, "isCorrect": false}, {"id": "ZzcqR", "text": "$3 x^2-x y+2 y^2=0$", "image": null, "isCorrect": false}, {"id": "E31av", "text": "$3 x^2+x y-2 y^2=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The vertices of the triangle are $O(0,0)$, $A(1,2)$, and $B(3,4)$.<br><br>The midpoint of $AB$ is $M\\left(\\dfrac{1+3}{2}, \\dfrac{2+4}{2}\\right) = (2,3)$.<br><br>The equation of the median $OM$ passing through $O(0,0)$ and $M(2,3)$ is given by $y = \\dfrac{3}{2}x \\Rightarrow 3x - 2y = 0$.<br><br>The slope of the line $AB$ is $m_{AB} = \\dfrac{4-2}{3-1} = 1$.<br><br>Since the altitude from $O$ is perpendicular to $AB$, its slope is $m = -1$.<br><br>The equation of the altitude from $O(0,0)$ is $y = -x \\Rightarrow x + y = 0$.<br><br>The joint equation of the altitude and the median is the product of their individual equations:<br><br>$(3x - 2y)(x + y) = 0$<br><br>$3x^2 + 3xy - 2xy - 2y^2 = 0$<br><br>$3x^2 + xy - 2y^2 = 0$<br><br>Answer: $3 x^2+x y-2 y^2=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792137c0aee93fa0796d925", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "The line $L$ given by $\\dfrac{x}{5}+\\dfrac{y}{b} \\doteq 1$ passes through the point $(13,32)$. The line K is parallel to line L and has the equation $\\dfrac{x}{c}+\\dfrac{y}{3}=1$. Then the distance between L and K is $\\qquad$ units.", "image": null}, "options": [{"id": "IKhro", "text": "$\\dfrac{23}{15}$", "image": null, "isCorrect": false}, {"id": "mAY5c", "text": "$\\sqrt{17}$", "image": null, "isCorrect": false}, {"id": "3NRQN", "text": "$\\dfrac{17}{\\sqrt{15}}$", "image": null, "isCorrect": false}, {"id": "BYVRV", "text": "$\\dfrac{23}{\\sqrt{17}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The equation of line $L$ is $\\dfrac{x}{5} + \\dfrac{y}{b} = 1$.<br><br>Since it passes through $(13, 32)$, we have:<br><br>$\\dfrac{13}{5} + \\dfrac{32}{b} = 1$<br><br>$\\dfrac{32}{b} = 1 - \\dfrac{13}{5} = -\\dfrac{8}{5}$<br><br>$b = -20$<br><br>Thus, the equation of line $L$ is $\\dfrac{x}{5} - \\dfrac{y}{20} = 1$, which simplifies to $4x - y - 20 = 0$.<br><br>The line $K$ is given by $\\dfrac{x}{c} + \\dfrac{y}{3} = 1$. Since line $K$ is parallel to line $L$, their slopes must be equal.<br><br>Slope of $L = 4$<br><br>Slope of $K = -\\dfrac{3}{c}$<br><br>$-\\dfrac{3}{c} = 4 \\Rightarrow c = -\\dfrac{3}{4}$<br><br>Substituting $c$ into the equation of line $K$, we get:<br><br>$\\dfrac{x}{-3/4} + \\dfrac{y}{3} = 1$<br><br>$-\\dfrac{4x}{3} + \\dfrac{y}{3} = 1$<br><br>$4x - y + 3 = 0$<br><br>The distance between the parallel lines $4x - y - 20 = 0$ and $4x - y + 3 = 0$ is:<br><br>$d = \\dfrac{|-20 - 3|}{\\sqrt{4^2 + (-1)^2}} = \\dfrac{23}{\\sqrt{17}}$<br><br>Answer: $\\dfrac{23}{\\sqrt{17}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136b0aee93fa0796d8a1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "If $\\mathrm{A}(-4,5, \\mathrm{P}), \\mathrm{B}(3,1,4)$ and $\\mathrm{C}(-2,0, \\mathrm{q})$ are the vertices of a triangle $A B C$ and $G(r, q, 1)$ is its centroid, then the value of $2 p+q-r$ is equal to", "image": null}, "options": [{"id": "G21XI", "text": "-3", "image": null, "isCorrect": true}, {"id": "X0iah", "text": "-6", "image": null, "isCorrect": false}, {"id": "6EgGl", "text": "9", "image": null, "isCorrect": false}, {"id": "ODjjS", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The coordinates of the centroid $G$ of a triangle with vertices $(x_1, y_1, z_1)$, $(x_2, y_2, z_2)$, and $(x_3, y_3, z_3)$ are given by $\\left( \\dfrac{x_1 + x_2 + x_3}{3}, \\dfrac{y_1 + y_2 + y_3}{3}, \\dfrac{z_1 + z_2 + z_3}{3} \\right)$.<br><br>Equating the $x$-coordinates:<br>$r = \\dfrac{-4 + 3 - 2}{3} = \\dfrac{-3}{3} = -1$<br><br>Equating the $y$-coordinates:<br>$q = \\dfrac{5 + 1 + 0}{3} = \\dfrac{6}{3} = 2$<br><br>Equating the $z$-coordinates:<br>$1 = \\dfrac{p + 4 + q}{3}$<br><br>Substituting $q = 2$ into the equation for the $z$-coordinate:<br>$1 = \\dfrac{p + 4 + 2}{3}$<br>$3 = p + 6$<br>$p = -3$<br><br>The value of $2p + q - r$ is:<br>$2(-3) + 2 - (-1) = -6 + 2 + 1 = -3$<br><br>Answer: -3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213530aee93fa0796d7e4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "The number of possible distinct straight lines passing through $(2,3)$ and forming a triangle with co-ordinate axes whose area is 12 sq. units are,", "image": null}, "options": [{"id": "voNgI", "text": "one", "image": null, "isCorrect": false}, {"id": "DPSGm", "text": "two", "image": null, "isCorrect": false}, {"id": "NxOq6", "text": "three", "image": null, "isCorrect": true}, {"id": "yPLDK", "text": "four", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the equation of the line be $\\dfrac{x}{a} + \\dfrac{y}{b} = 1$.<br><br>Since the line passes through $(2,3)$, we have:<br><br>$\\dfrac{2}{a} + \\dfrac{3}{b} = 1 \\Rightarrow b = \\dfrac{3a}{a-2}$<br><br>The area of the triangle formed with the coordinate axes is $12$ sq. units. Therefore:<br><br>$\\dfrac{1}{2}|ab| = 12 \\Rightarrow |ab| = 24$<br><br>This gives two cases:<br><br>Case 1: $ab = 24$<br><br>Substituting $b = \\dfrac{3a}{a-2}$:<br><br>$a\\left(\\dfrac{3a}{a-2}\\right) = 24$<br><br>$3a^2 = 24a - 48$<br><br>$a^2 - 8a + 16 = 0$<br><br>$(a-4)^2 = 0 \\Rightarrow a = 4$<br><br>This gives exactly one real value of $a$, corresponding to one straight line.<br><br>Case 2: $ab = -24$<br><br>Substituting $b = \\dfrac{3a}{a-2}$:<br><br>$a\\left(\\dfrac{3a}{a-2}\\right) = -24$<br><br>$3a^2 = -24a + 48$<br><br>$a^2 + 8a - 16 = 0$<br><br>The discriminant of this quadratic equation is $D = 8^2 - 4(1)(-16) = 64 + 64 = 128$.<br><br>Since $D > 0$, there are two distinct real roots for $a$, corresponding to two distinct straight lines.<br><br>Total number of possible distinct straight lines is $1 + 2 = 3$.<br><br>Answer: three", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213450aee93fa0796d779", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The incentre of the triangle whose vertices are $\\mathrm{P}(0,3,0), \\mathrm{Q}(0,0,4)$ and $\\mathrm{R}(0,3,4)$ is", "image": null}, "options": [{"id": "ZtUoO", "text": "$\\quad(0,3,2)$", "image": null, "isCorrect": false}, {"id": "8AbdL", "text": "$(0,2,3)$", "image": null, "isCorrect": true}, {"id": "7qhsk", "text": "$(2,0,3)$", "image": null, "isCorrect": false}, {"id": "J5zpr", "text": "$(2,3,0)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The vertices of the triangle are $P(0,3,0)$, $Q(0,0,4)$, and $R(0,3,4)$.<br><br>The lengths of the sides of the triangle are:<br>$p = QR = \\sqrt{(0-0)^2 + (3-0)^2 + (4-4)^2} = 3$<br>$q = PR = \\sqrt{(0-0)^2 + (3-3)^2 + (4-0)^2} = 4$<br>$r = PQ = \\sqrt{(0-0)^2 + (0-3)^2 + (4-0)^2} = 5$<br><br>The coordinates of the incentre $I$ are given by the formula:<br>$I = \\left( \\dfrac{p x_1 + q x_2 + r x_3}{p+q+r}, \\dfrac{p y_1 + q y_2 + r y_3}{p+q+r}, \\dfrac{p z_1 + q z_2 + r z_3}{p+q+r} \\right)$<br><br>Substituting the values of the coordinates and side lengths:<br>$x = \\dfrac{3(0) + 4(0) + 5(0)}{3+4+5} = 0$<br><br>$y = \\dfrac{3(3) + 4(0) + 5(3)}{12} = \\dfrac{9 + 0 + 15}{12} = 2$<br><br>$z = \\dfrac{3(0) + 4(4) + 5(4)}{12} = \\dfrac{0 + 16 + 20}{12} = 3$<br><br>The coordinates of the incentre are $(0, 2, 3)$.<br><br>Answer: $(0,2,3)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262870279619d9d8a353e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "In a triangle $\\mathrm{ABC}, \\mathrm{m} \\angle \\mathrm{A}, \\mathrm{m} \\angle \\mathrm{B}, \\mathrm{m} \\angle \\mathrm{C}$ are in A.P. and lengths of two larger sides are 10 units, 9 units respectively, then the length (in units) of the third side is", "image": null}, "options": [{"id": "qdkuc", "text": "$5+\\sqrt{6}$", "image": null, "isCorrect": true}, {"id": "o8Hws", "text": "$\\sqrt{5}-1$", "image": null, "isCorrect": false}, {"id": "JdU2e", "text": "$\\sqrt{6}+1$", "image": null, "isCorrect": false}, {"id": "iFC2x", "text": "$\\sqrt{5}+1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\angle \\mathrm{A}, \\angle \\mathrm{B}, \\angle \\mathrm{C}$ are in A.P.\n$\\begin{aligned}\n& \\Rightarrow 2 \\mathrm{~B}=\\mathrm{A}+\\mathrm{C} \\\\\n& \\Rightarrow 3 \\mathrm{~B}=\\mathrm{A}+\\mathrm{B}+\\mathrm{C} \\\\\n& \\Rightarrow 3 \\mathrm{~B}=180^{\\circ} \\\\\n& \\Rightarrow \\mathrm{B}=60^{\\circ} \\\\\n& \\cos \\mathrm{B}=\\frac{\\mathrm{c}^2+\\mathrm{a}^2-\\mathrm{b}^2}{2 \\mathrm{ca}}\n\\end{aligned}$\n$\\Rightarrow \\cos 60^{\\circ}=\\frac{\\mathrm{c}^2+10^2-9^2}{2 \\mathrm{c}(10)}$\n$\\ldots[$ Let $a=10, b=9]$\n$\\begin{aligned} & \\Rightarrow \\frac{1}{2}=\\frac{\\mathrm{c}^2+100-81}{20 \\mathrm{c}} \\\\ & \\Rightarrow 10 \\mathrm{c}=\\mathrm{c}^2+19 \\\\ & \\Rightarrow \\mathrm{c}^2-10 \\mathrm{c}+19=0 \\\\ & \\Rightarrow \\mathrm{c}=\\frac{10 \\pm \\sqrt{100-76}}{2} \\\\ & =\\frac{10 \\pm 2 \\sqrt{6}}{2} \\\\ & =5 \\pm \\sqrt{6}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262860279619d9d8a3537", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Let $P \\equiv(-3,0), Q \\equiv(0,0)$ and $R \\equiv(3,3 \\sqrt{3})$ be three points. Then the equation of the bisector of the angle $\\mathrm{PQR}$ is", "image": null}, "options": [{"id": "6PjEJ", "text": "$\\frac{\\sqrt{3}}{2} x+y=0$", "image": null, "isCorrect": false}, {"id": "ZxpmO", "text": "$x+\\sqrt{3} y=0$", "image": null, "isCorrect": false}, {"id": "SJY9r", "text": "$\\sqrt{3} x+y=0$", "image": null, "isCorrect": true}, {"id": "GalIJ", "text": "$x+\\frac{\\sqrt{3}}{2} y=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/vooxeaoWmP_BXyqN88Ux_BoeAKbz3_hAjqmp_SnSRyw.original.fullsize.png\"><br>\nSlope of $\\mathrm{QR}=\\frac{3 \\sqrt{3}-0}{3-0}=\\sqrt{3}$ i.e., $\\theta=60^{\\circ}$ Clearly, $\\angle \\mathrm{PQR}=120^{\\circ}$ $\\mathrm{OQ}$ is the angle bisector of the angle PQR, so line OQ makes $120^{\\circ}$ with the positive direction of $\\mathrm{X}$-axis.\nTherefore, equation of the bisector of $\\angle \\mathrm{PQR}$ is $y=\\tan 120^{\\circ} x \\Rightarrow y=-\\sqrt{3} x \\Rightarrow \\sqrt{3} x+y=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262620279619d9d8a3413", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "PS is the median of the triangle with vertices at $P(2,2), Q(6,-1)$ and $R(7,3)$, then the intercepts on the co-ordinate axes of the line passing through point $(1,-1)$ and parallel to PS are respectively", "image": null}, "options": [{"id": "e4ThK", "text": "$\\frac{7}{2}, \\frac{-7}{9}$", "image": null, "isCorrect": false}, {"id": "Wi2fI", "text": "$\\frac{2}{7}, \\frac{9}{7}$", "image": null, "isCorrect": false}, {"id": "niHTF", "text": "$\\frac{-7}{2}, \\frac{-7}{9}$", "image": null, "isCorrect": true}, {"id": "Nzlx2", "text": "$-2,-9$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{S}=$ midpoint of $\\mathrm{QR}=\\left(\\frac{6+7}{2}, \\frac{-1+3}{2}\\right)=\\left(\\frac{13}{2}, 1\\right)$\n$\\therefore \\quad$ 'm' of $\\mathrm{PS}=\\frac{2-1}{2-\\frac{13}{2}}=-\\frac{2}{9}$\n$\\therefore \\quad$ The required equation is $y+1=\\frac{-2}{9}(x-1)$\n$\\Rightarrow 2 x+9 y+7=0$\nHere, intercept on $\\mathrm{X}$-axis is $-\\frac{7}{2}$ and intercept\non $Y$-axis is $-\\frac{7}{9}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262510279619d9d8a338d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "A line is drawn through the point $(1,2)$ to meet the co-ordinate axes at $\\mathrm{P}$ and $\\mathrm{Q}$ such that it forms a $\\triangle O P Q$, where $O$ is the origin. If the area of $\\triangle O P Q$ is least, then the slope of the line PQ is", "image": null}, "options": [{"id": "mog2G", "text": "-2", "image": null, "isCorrect": true}, {"id": "PROIZ", "text": "2", "image": null, "isCorrect": false}, {"id": "pcxn8", "text": "$\\frac{-1}{2}$", "image": null, "isCorrect": false}, {"id": "rsxyY", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of line PQ passing through $(1,2)$ is $y-2=\\mathrm{m}(x-1)$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/dodjB4w_b_utBm6i0XpLtIJsoH3mIOGlqCjjF8RQ3LE.original.fullsize.png\"><br>\n\n$\\begin{aligned} \\mathrm{A}(\\triangle \\mathrm{OPQ})=\\frac{1}{2} \\times \\mathrm{OP} \\times \\mathrm{OQ} & \\\\ & =\\frac{1}{2}\\left(1-\\frac{2}{\\mathrm{~m}}\\right)(2-\\mathrm{m}) \\\\ & =\\frac{1}{2}\\left(4-\\mathrm{m}-\\frac{4}{\\mathrm{~m}}\\right) \\\\ \\mathrm{A} & =2-\\frac{\\mathrm{m}}{2}-\\frac{2}{\\mathrm{~m}} \\\\ \\therefore \\quad \\frac{\\mathrm{dA}}{\\mathrm{dm}} & =-\\frac{1}{2}+\\frac{2}{\\mathrm{~m}^2} \\\\ \\mathrm{Now} & \\frac{\\mathrm{dA}}{\\mathrm{dm}}=0 \\\\ \\Rightarrow- & \\frac{1}{2}+\\frac{2}{\\mathrm{~m}^2}=0 \\\\ \\Rightarrow \\mathrm{m}^2 & =4 \\\\ \\Rightarrow \\mathrm{m} & = \\pm 2 \\\\ \\frac{\\mathrm{d}^2 \\mathrm{~A}}{\\mathrm{dm}^2} & =-\\frac{4}{\\mathrm{~m}^3} \\\\ \\mathrm{At} \\mathrm{m} & =2 \\\\ \\frac{\\mathrm{d}^2 \\mathrm{~A}}{\\mathrm{dm}^2} & < 0\\end{aligned}$\n$$\n\\begin{aligned}\n\\text { At } \\mathrm{m} & =-2, \\\\\n\\frac{\\mathrm{d}^2 \\mathrm{~A}}{\\mathrm{dm}^2} & >0\n\\end{aligned}\n$$\n$\\therefore \\quad$ Area of $\\triangle \\mathrm{OPQ}$ will be least at $\\mathrm{m}=-2$ $\\Rightarrow$ Slope of the line $P Q=-2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262500279619d9d8a3385", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "The base of an equilateral triangle is represented by the equation $2 x-y-1=0$ and its vertex is $(1,2)$, then the length (in units) of the side of the triangle is", "image": null}, "options": [{"id": "Hdw7o", "text": "$\\sqrt{\\frac{20}{13}}$", "image": null, "isCorrect": false}, {"id": "o5cjU", "text": "$\\frac{2}{\\sqrt{15}}$", "image": null, "isCorrect": true}, {"id": "USknt", "text": "$\\sqrt{\\frac{8}{15}}$", "image": null, "isCorrect": false}, {"id": "ovWIB", "text": "$\\sqrt{\\frac{15}{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} \\mathrm{AD} & =\\left|\\frac{2-2-1}{\\sqrt{2^2+(-1)^2}}\\right| \\\\ & =\\left|\\frac{-1}{\\sqrt{5}}\\right| \\\\ & =\\frac{1}{\\sqrt{5}}\\end{aligned}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/jJLJM4ku0S-j3Sbcv6tngcn7WRO0ePtZOiBRtA6VUFY.original.fullsize.png\"><br>\n\n$\\begin{aligned} & \\text { In } \\triangle \\mathrm{ABD}, \\tan 60^{\\circ}=\\frac{\\mathrm{AD}}{\\mathrm{BD}} \\\\ & \\Rightarrow \\sqrt{3}=\\frac{\\frac{1}{\\sqrt{5}}}{\\mathrm{BD}} \\\\ & \\Rightarrow \\mathrm{BD}=\\frac{1}{\\sqrt{15}} \\\\ & \\therefore \\quad \\mathrm{BC}=2 \\mathrm{BD}=\\frac{2}{\\sqrt{15}}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262140279619d9d8a31a3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "If the vertices of a triangle are $(-2,3),(6,-1)$ and $(4,3)$, then the co-ordinates of the circumcentre of the triangle are", "image": null}, "options": [{"id": "pgsP9", "text": "$(1,1)$", "image": null, "isCorrect": false}, {"id": "oX2bp", "text": "$(-1,-1)$", "image": null, "isCorrect": false}, {"id": "6EmBV", "text": "$(-1,1)$", "image": null, "isCorrect": false}, {"id": "ouRg1", "text": "$(1,-1)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Here, $\\mathrm{A}(-2,3), \\mathrm{B}(6,-1), \\mathrm{C}(4,3)$ are the vertices of $\\triangle \\mathrm{ABC}$.\nLet $\\mathrm{F}$ be the circumcentre of $\\triangle \\mathrm{ABC}$.\nLet $\\mathrm{FD}$ and $\\mathrm{FE}$ be the perpendicular bisectors of the sides $\\mathrm{BC}$ and $\\mathrm{AC}$ respectively.\n$\\therefore \\quad \\mathrm{D}$ and $\\mathrm{E}$ are the midpoints of side $\\mathrm{BC}$ and $\\mathrm{AC}$ respectively.\n$\\begin{array}{ll}\\therefore & D \\equiv\\left(\\frac{6+4}{2}, \\frac{-1+3}{2}\\right) \\\\ \\therefore & D=(5,1) \\\\ & \\text { and } E \\equiv\\left(\\frac{-2+4}{2}, \\frac{3+3}{2}\\right)\\end{array}$\n$\\therefore \\quad \\mathrm{E}=(1,3)$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Co3qsv9FYpZUg2Be6EHtw_4IVJBMuvP4RP59KE9YzNU.original.fullsize.png\"><br>\nNow, slope of $B C=\\frac{3-(-1)}{4-6}=\\frac{4}{-2}=-2$\n$\\therefore \\quad \\text { Slope of } \\mathrm{FD}=\\frac{1}{2} \\quad \\ldots[\\because \\mathrm{FD} \\perp \\mathrm{BC}]$\nSince FD passes through $(5,1)$ and has slope $\\frac{1}{2}$, equation of $\\mathrm{FD}$ is\n$\\begin{aligned}\n& y-1=\\frac{1}{2}(x-5) \\\\\n\\therefore \\quad & 2(y-1)=x-5 \\\\\n\\therefore \\quad & 2 y-2=x-5 \\\\\n\\therefore \\quad & x-2 y-3=0\n\\end{aligned}$\nSince both th
