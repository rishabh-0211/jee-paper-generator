- 7 = 0$.<br><br>Answer: $5 x+5 y-7=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792132d0aee93fa0796d6bb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "The slopes of the lines given by $x^2+2 h x y+2 y^2=0$ are in the ratio $1: 2$, then $h$ is", "image": null}, "options": [{"id": "6n4Bx", "text": "$\\dfrac{1}{2}$", "image": null, "isCorrect": false}, {"id": "cbxi8", "text": "$\\dfrac{3}{2}$", "image": null, "isCorrect": true}, {"id": "P0vu6", "text": "3", "image": null, "isCorrect": false}, {"id": "RCXsp", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation is $x^2 + 2hxy + 2y^2 = 0$.<br><br>Dividing by $x^2$, we get $2\\left(\\dfrac{y}{x}\\right)^2 + 2h\\left(\\dfrac{y}{x}\\right) + 1 = 0$.<br><br>Let $m_1$ and $m_2$ be the slopes of the lines represented by the given equation. Then $m_1$ and $m_2$ are the roots of the quadratic equation $2m^2 + 2hm + 1 = 0$.<br><br>Sum of the roots: $m_1 + m_2 = -\\dfrac{2h}{2} = -h$<br><br>Product of the roots: $m_1 m_2 = \\dfrac{1}{2}$<br><br>Given that the slopes are in the ratio $1:2$, let $m_1 = m$ and $m_2 = 2m$.<br><br>Then $m + 2m = -h \\Rightarrow 3m = -h \\Rightarrow m = -\\dfrac{h}{3}$<br><br>Also, $m \\times 2m = \\dfrac{1}{2} \\Rightarrow 2m^2 = \\dfrac{1}{2} \\Rightarrow m^2 = \\dfrac{1}{4}$<br><br>Substituting $m = -\\dfrac{h}{3}$ into $m^2 = \\dfrac{1}{4}$, we get:<br><br>$\\left(-\\dfrac{h}{3}\\right)^2 = \\dfrac{1}{4}$<br><br>$\\dfrac{h^2}{9} = \\dfrac{1}{4}$<br><br>$h^2 = \\dfrac{9}{4}$<br><br>$h = \\pm \\dfrac{3}{2}$<br><br>Answer: $\\dfrac{3}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262740279619d9d8a34a9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "$\\mathrm{p}$ is the length of perpendicular from the origin to the line whose intercepts on the axes are a and $\\mathrm{b}$ respectively, then $\\frac{1}{\\mathrm{a}^2}+\\frac{1}{\\mathrm{~b}^2}$ equals", "image": null}, "options": [{"id": "3wOuV", "text": "$\\mathrm{p}^2$", "image": null, "isCorrect": false}, {"id": "4KZKg", "text": "$\\frac{2}{\\mathrm{p}^2}$", "image": null, "isCorrect": false}, {"id": "AuIdB", "text": "$\\frac{1}{\\mathrm{p}^2}$", "image": null, "isCorrect": true}, {"id": "O6mEe", "text": "$\\frac{1}{2 p^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the equation of the line be $\\frac{x}{\\mathrm{a}}+\\frac{y}{\\mathrm{~b}}=1$\nAccording to the given condition,\n$$\n\\begin{aligned}\n& \\mathrm{p}=\\left|\\frac{\\mathrm{ab}}{\\sqrt{\\mathrm{a}^2+b^2}}\\right| \\\\\n& \\Rightarrow \\frac{\\mathrm{a}^2+\\mathrm{b}^2}{\\mathrm{a}^2 \\mathrm{~b}^2}=\\frac{1}{\\mathrm{p}^2} \\\\\n& \\Rightarrow \\frac{1}{\\mathrm{a}^2}+\\frac{1}{\\mathrm{~b}^2}=\\frac{1}{\\mathrm{p}^2}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262060279619d9d8a3132", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "$\\mathrm{a}$ and $\\mathrm{b}$ are the intercepts made by a line on the co-ordinate axes. If $3 \\mathrm{a}=\\mathrm{b}$ and the line passes through $(1,3)$, then the equation of the line is", "image": null}, "options": [{"id": "MDMyf", "text": "$x+3 y=10$", "image": null, "isCorrect": false}, {"id": "TuJ7O", "text": "$3 x+y=6$", "image": null, "isCorrect": true}, {"id": "CzFIP", "text": "$x-3 y+8=0$", "image": null, "isCorrect": false}, {"id": "6lspH", "text": "$3 x-2 y+3=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the equation of the line be\n$$\n\\frac{x}{\\mathrm{a}}+\\frac{y}{\\mathrm{~b}}=1\n$$\n\nThis line passes through the point $(1,3)$\n$$\n\\begin{aligned}\n\\therefore \\quad & \\frac{1}{a}+\\frac{3}{b}=1 \\\\\n& \\Rightarrow b+3 a=a b \\\\\n& \\Rightarrow 2 b=a b \\\\\n& \\Rightarrow a=2 \\\\\n\\therefore \\quad & b=3 a=6\n\\end{aligned}\n$$\n\nEquation (i) becomes,\n$$\n\\begin{aligned}\n& \\frac{x}{2}+\\frac{y}{6}=1 \\\\\n& 3 x+y=6\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261db0279619d9d8a2fe1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "The points $(1,3),(5,1)$ are opposite vertices of a diagonal of a rectangle. If the other two vertices lie on the line $y=2 x+c$, then one of the vertex on the other diagonal is", "image": null}, "options": [{"id": "oLnc5", "text": "(1,-2)", "image": null, "isCorrect": false}, {"id": "PPr3s", "text": "(0,-4)", "image": null, "isCorrect": false}, {"id": "IfR2s", "text": "(2,0)", "image": null, "isCorrect": true}, {"id": "w7Mfg", "text": "(3,2)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/_1dUsT5CgDtOsVAJ3FDYIa7xfPEjePkZsRGaWre8wk0.original.fullsize.png\"><br>\nDiagonals of rectangle bisect each other.\n$\\therefore \\quad$ Midpoint of $(1,3)$ and $(5,1)$ is $(3,2)$.\nAlso, $y=2 x+$ c passes through $(3,2)$.\n$\\begin{array}{rlrl}\n\\therefore & 2 & =2(3)+c \\\\\n& \\therefore & c & =-4\n\\end{array}$\n$\\therefore \\quad$ Other two vertices lie on $y=2 x-4$.\nLet co-ordinates of $\\mathrm{B}$ be $(x, y)$ i.e., $(x, 2 x-4)$\nslope of $\\mathrm{AB} \\times$ slope of $\\mathrm{BC}=-1$\n$\\begin{aligned}\n& \\Rightarrow\\left(\\frac{2 x-4-3}{x-1}\\right)\\left(\\frac{2 x-4-1}{x-5}\\right)=-1 \\\\\n& \\Rightarrow\\left(\\frac{2 x-7}{x-1}\\right)\\left(\\frac{2 x-5}{x-5}\\right)=-1 \\\\\n& \\Rightarrow x^2-6 x+8=0 \\\\\n& \\Rightarrow x=4,2\n\\end{aligned}$\nWhen $x=4, y=4$\nWhen $x=2, y=0$\n$\\therefore \\quad$ Vertex of the other diagonal is $(2,0)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2618d0279619d9d8a2d80", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "The slopes of the lines, making angle of measures $45^{\\circ}$ with the line $2 x-3 y=5$ are", "image": null}, "options": [{"id": "0yTjU", "text": "$5, \\frac{-1}{5}$", "image": null, "isCorrect": true}, {"id": "ZqNFU", "text": "$\\frac{-1}{5},-5$", "image": null, "isCorrect": false}, {"id": "BP8Aa", "text": "$\\frac{1}{5},-5$", "image": null, "isCorrect": false}, {"id": "6OSrM", "text": "$5, \\frac{1}{5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the required slope of the line be $m$\n$\\begin{aligned} & \\Rightarrow \\tan 45^{\\circ}=\\left|\\frac{m-\\frac{2}{3}}{1+m \\times \\frac{2}{3}}\\right| \\\\ & \\Rightarrow \\frac{3 m-2}{3+2 m}= \\pm 1 \\\\ & \\Rightarrow m=5 \\text { or } m=\\frac{-1}{5}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260d40279619d9d8a27a7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "The equation of a line with slope $-\\frac{1}{\\sqrt{2}}$ and makes an intercept of $2 \\sqrt{2}$ units on negative direction of $y$-axis is", "image": null}, "options": [{"id": "Zh311", "text": "$\\sqrt{2} y-x+4=0$", "image": null, "isCorrect": false}, {"id": "HTI8D", "text": "$x+\\sqrt{2} y+2 \\sqrt{2}=0$", "image": null, "isCorrect": false}, {"id": "vXKkU", "text": "$\\sqrt{2} y+x+4=0$", "image": null, "isCorrect": true}, {"id": "LC93u", "text": "$x+\\sqrt{2} y-2 \\sqrt{2}=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The line passes through point $(0,-2 \\sqrt{2})$ and has slope $=\\frac{-1}{\\sqrt{2}}$ Hence equation of line is\n$(\\mathrm{y}+2 \\sqrt{2})=\\frac{-1}{\\sqrt{2}}(\\mathrm{x}-0) \\Rightarrow \\mathrm{x}+\\sqrt{2} \\mathrm{y}+4=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b20279619d9d8a2693", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "The equation of line, where length of the perpendicular segment from origin to the line is 4 and the inclination of this perpendicular segment with the positive direction of $\\mathrm{X}$-axis is $30^{\\circ}$, is", "image": null}, "options": [{"id": "8dg0Z", "text": "$x+\\sqrt{3} y=8$", "image": null, "isCorrect": false}, {"id": "cDWeI", "text": "$x-\\sqrt{3} y=8$", "image": null, "isCorrect": false}, {"id": "k941P", "text": "$\\sqrt{3} x-y=8$", "image": null, "isCorrect": false}, {"id": "JMYay", "text": "$\\sqrt{3} x+y=8$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We have $\\ell(\\mathrm{OP})=4$ and $\\mathrm{m} \\angle \\mathrm{POX}=30^{\\circ}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/aLMbidvkVoVRoZVGT2fzFSNt7BbwQLgVPEQIOXeAdC8.original.fullsize.png\"><br>\n$$\n\\therefore \\mathrm{P} \\equiv\\left(4 \\cos 30^{\\circ}, 4 \\sin 30^{\\circ}\\right) \\equiv(2 \\sqrt{3}, 2)\n$$\nFrom figure, we conclude that angle made be line with +ve $\\mathrm{X}$ axis is $120^{\\circ}$.\n$\\therefore$ Slope of line $=\\tan \\left(120^{\\circ}\\right)=-\\sqrt{3}$\nHence required equation of line $\\mathrm{L}$ is\n$$\n(y-2)=(-\\sqrt{3})(x-2 \\sqrt{3}) \\Rightarrow \\sqrt{3} x+y=8\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260650279619d9d8a2424", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "If $\\mathrm{p}$ is the length of the perpendicular from origin to the whose intercepts on the axes are $a$ and $b$, then $\\frac{1}{a^2}+\\frac{1}{b^2}=$", "image": null}, "options": [{"id": "mEwrJ", "text": "$\\mathrm{p}^2$", "image": null, "isCorrect": false}, {"id": "kjHT5", "text": "$\\frac{1}{2 p^2}$", "image": null, "isCorrect": false}, {"id": "Zvoz8", "text": "$2 \\mathrm{p}^2$", "image": null, "isCorrect": false}, {"id": "tEOfZ", "text": "$\\frac{1}{\\mathrm{p}^2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Refer image\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/idtXHbY_WmG4IadE8BDUs_0lWOgP8xxWILZuzSWBBsg.original.fullsize.png\"><br>\nEquation of given line is<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/oi25XdqfxOMGlk5vKF_3ufzqw9f0r96f-V0p3zUPJWg.original.fullsize.png\"><br>\nDistance of line (1) from origin is\n$$\n\\begin{aligned}\n& \\frac{|-a b|}{\\sqrt{a^2+b^2}}=p \\quad \\Rightarrow a^2+b^2=\\frac{a^2 b^2}{p^2} \\\\\n& \\therefore \\frac{a^2+b^2}{a^2 b^2}=\\frac{1}{p^2} \\Rightarrow \\frac{1}{a^2}+\\frac{1}{b^2}=\\frac{1}{p^2}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260540279619d9d8a239f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "The equation of a line passing through $(\\rho \\cos \\propto, p \\sin \\propto)$ and making an angle $(90+\\propto)$ with positive direction of $\\mathrm{X}$-axis is", "image": null}, "options": [{"id": "g8IjS", "text": "$x \\cos \\propto-y \\sin \\propto=2 p$", "image": null, "isCorrect": false}, {"id": "BKYL2", "text": "$x \\sin \\propto+y \\cos \\propto=p$", "image": null, "isCorrect": false}, {"id": "n7fUk", "text": "$x \\cos \\propto+y \\sin \\propto=p$", "image": null, "isCorrect": true}, {"id": "L98WC", "text": "$\\mathrm{x} \\cos \\propto+\\mathrm{y} \\sin \\propto=3 \\mathrm{p}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Slope of line $=\\tan (90+\\propto)=-\\cot \\propto$\nEquation of required line is\n$$\n\\begin{aligned}\n& (y-p \\sin \\propto)=\\frac{-\\cos \\propto}{\\sin \\propto}(x-p \\cos \\propto) \\\\\n& \\therefore(\\sin \\propto) y-p \\sin ^2 \\propto=(-\\cos \\propto) x+p \\cos ^2 \\propto \\\\\n& \\therefore(\\operatorname{Cos} \\propto) x+(\\sin \\propto) y=p\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260400279619d9d8a22fc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "The $x$-intercept of a line passing through the points $\\left(\\frac{-1}{2}, 1\\right)$ and $B(1,3)$ is", "image": null}, "options": [{"id": "USDol", "text": "$-1 / 6$", "image": null, "isCorrect": false}, {"id": "zq2Rd", "text": "$-5 / 4$", "image": null, "isCorrect": true}, {"id": "Hwt3s", "text": "$1 / 3$", "image": null, "isCorrect": false}, {"id": "LvOjR", "text": "$4 / 3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Finding the slope from the given points as:\n$$\n\\begin{aligned}\n& \\text { Slope }=\\frac{y_2-y_1}{x_2-x_1} \\\\\n& \\text { Slope }=\\frac{3-1}{1-\\left(-\\frac{1}{2}\\right)} \\\\\n& \\text { Slope }=\\frac{2}{1+\\frac{1}{2}} \\\\\n& \\text { Slope }=\\frac{2}{\\frac{3}{2}}\n\\end{aligned}\n$$\n\n\nSlope $=\\frac{4}{3}$\nNow the equation will be:\n$$\n\\begin{aligned}\n& y=m x+c \\\\\n& y=\\frac{4}{3} x+c\n\\end{aligned}\n$$\nNow substituting the point $(1,3)$ into the above equation as:\n$$\n\\begin{gathered}\n3=\\frac{4}{3} \\times 1+c \\\\\n3-\\frac{4}{3}=c \\\\\n\\frac{5}{3}=c\n\\end{gathered}\n$$\n\n\n\nSo, the equation will be:\n$$\n\\begin{aligned}\n& y=\\frac{4}{3} x+c \\\\\n& y=\\frac{4}{3} x+\\frac{5}{3}\n\\end{aligned}\n$$\nNow to find the $x$-intercept substitute $y=0$ as:\n$$\ny=\\frac{4}{3} x+\\frac{5}{3}\n$$\n\n\n$$\n0=\\frac{4}{3} x+\\frac{5}{3}\n$$\n\n\n$$\n\\begin{gathered}\n\\text { undêfined } \\frac{20}{3} \\underline{2} \\text { (20 Sep Shift 2) } \\\\\nx=-\\frac{5}{3} \\times \\frac{3}{4} \\\\\nx=-\\frac{5}{4}\n\\end{gathered}\n$$\nTherefore, the answer is option [2].", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2602e0279619d9d8a226a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "The slope of the line through the origin which makes an angle of $30^{\\circ}$ with the positive direction of $\\mathrm{Y}$-axis measured anticlockwise is", "image": null}, "options": [{"id": "uYH6K", "text": "$\\frac{-2}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "NYpAJ", "text": "$-\\sqrt{3}$", "image": null, "isCorrect": true}, {"id": "WCA81", "text": "$\\frac{\\sqrt{3}}{2}$", "image": null, "isCorrect": false}, {"id": "BoeeZ", "text": "$\\frac{-1}{\\sqrt{3}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/6vPc4MAFSgoZTpchARayfIhMzeThaeZIOtGRpP9NzUc.original.fullsize.png\"><br>\nRefer figure\nAngle made by line $\\mathrm{L}$ with positive direction of $\\mathrm{X}$ axis is $\\left(90^{\\circ}+30^{\\circ}\\right)$ i.e. $120^{\\circ}$.\n$\\therefore$ Slope of line $\\mathrm{L}=\\tan \\left(120^{\\circ}\\right)=\\tan \\left(\\pi-60^{\\circ}\\right)=-\\tan 60^{\\circ}=-\\sqrt{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ff80279619d9d8a20af", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "The equation of a line passing through the point $(7,-4)$ and perpendicular to the\nline passing through the points $(2,3)$ and $(1,-2)$ is", "image": null}, "options": [{"id": "ioWng", "text": "$x+5 y+13=0$", "image": null, "isCorrect": true}, {"id": "1oiJ2", "text": "$x-5 y-13=0$", "image": null, "isCorrect": false}, {"id": "7xA0k", "text": "$x-2 y-15=0$", "image": null, "isCorrect": false}, {"id": "5vyKL", "text": "$x+2 y+1=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\nSlope of line through $(2,3)$ and $(1,-2)$ is $\\frac{-2-3}{1-2}=5$\nHence slope of required line is $-\\frac{1}{5}$\nEquation of required line is\n$(y+4)=-\\frac{1}{5}(x-7) \\Rightarrow 5 y+20=-x+7 \\text { i.e. } x+5 y+13=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fbf0279619d9d8a1eeb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "If $(a,-2 a), a>0$ is the midpoint of a line segment intercepted between the co-ordinate axes, then the equation of the line is", "image": null}, "options": [{"id": "MHwhM", "text": "$x-2 y+4 a=0$", "image": null, "isCorrect": false}, {"id": "0Vsh6", "text": "$2 x-y=4 a$", "image": null, "isCorrect": true}, {"id": "PaMv2", "text": "$x-2 y=5 a$", "image": null, "isCorrect": false}, {"id": "GRy27", "text": "$2x-y+4 a=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\nGiven point $(a,-2 a)$ is the midpoint of the intercepts.\nLet Points $A, B, M$ be as shown in figure.\nHence the intercept points are $(2 \\mathrm{a}, 0)$ and $(0,-4 \\mathrm{a})$\nEquation of line from intercept in intercept form.\n$\\frac{x}{2 a}+\\frac{y}{-4 a}=1 \\Rightarrow 2 x-y=4 a$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/6YEMTp-39tvaGTNGJfcp5VZUye36_y2CeE13_OYH6mA.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f850279619d9d8a1d29", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "The equation of a line passing through the point of intersection of the lines $-2 y+8=0$ and $3 x-y+4=0$ and having $x$ and $y$ intercept zero is", "image": null}, "options": [{"id": "ZINaF", "text": "$4 x-5 y=0$", "image": null, "isCorrect": true}, {"id": "Hs11s", "text": "$5 x-4 y=0$", "image": null, "isCorrect": false}, {"id": "dtspP", "text": "$5 x+4 y=0$", "image": null, "isCorrect": false}, {"id": "bDyWf", "text": "$4 x+5 y=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{array}{l}\nx+2 y+8=0 \\\\\n3 x-y+4=0\n\\end{array}\n$$\nSolving we get; $x=\\frac{-16}{7} ; y=\\frac{-20}{7}$\nline pacsing through $(0,0) \\&\\left(\\frac{-16}{7}, \\frac{-20}{7}\\right) \\&$ having $x$ \\& $y$ intercept $5 x-4 y=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f600279619d9d8a1bf6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "The equations of the lines which make intercepts on the axes whose sum is 8 and\nproduct is 15 are", "image": null}, "options": [{"id": "1ghAf", "text": "$3 x-5 y+15=0,5 x+3 y+15=0$", "image": null, "isCorrect": false}, {"id": "hdcga", "text": "$5 x-3 y+15=0,3 x+5 y+15=0$", "image": null, "isCorrect": false}, {"id": "zx3vQ", "text": "$3 x+5 y-15=0 \\quad, 3 y+5 x-15=0$", "image": null, "isCorrect": true}, {"id": "7c4d0", "text": "$3 x+5 y+15=0,5 x+3 y-15=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let ' $\\mathrm{a}$ ' and ' $\\mathrm{b}$ ' be the intercepts made by line.\nWe have $a+b=8$ and $a b=15$\nSolving, we get $(a, b)=(3,5)$ or $(5,3)$\nLet equation of line be $\\frac{x}{a}+\\frac{y}{b}=1$ ...(1)\nWhen $a=3, b=5$ from $(1)$, we get\n$\\frac{x}{3}+\\frac{y}{5}=1 \\quad \\Rightarrow \\quad 5 x+3 y-15=0$ ...(2)\nWhen $a=5, b=3$ from $(1)$, we get\n$\\frac{x}{5}+\\frac{y}{3}=1 \\quad \\Rightarrow \\quad 3 x+5 y-15=0$ ...(3)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f3f0279619d9d8a1aed", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "The line cuts $X$ and $Y$ axes at the points $A$ and $B$ respectively. The point $(5,6)$ divides\nthe line segment $\\mathrm{AB}$ internally in the ratio $3: 1$, then equation of line is", "image": null}, "options": [{"id": "nn4ra", "text": "$2 x+y=16$", "image": null, "isCorrect": false}, {"id": "2QPmR", "text": "$2 x+5 y=40$", "image": null, "isCorrect": true}, {"id": "K3MGv", "text": "$2 x-y=4$", "image": null, "isCorrect": false}, {"id": "fFmRz", "text": "$2 x-5 y=-20$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $A \\equiv(a, 0)$ and $B \\equiv(0, b)$\nLet $P \\equiv(5,6)$ and it divides $A B$ in the ratio $3: 1$\n$\\begin{array}{l}\n5=\\frac{3 \\times 0+1(a)}{3+1} \\Rightarrow 5=\\frac{a}{4} \\Rightarrow a=20 \\\\\n6=\\frac{3 b+1 \\times 0}{3+1} \\Rightarrow 3 b=24 \\Rightarrow b=8\n\\end{array}$\nThus intercepts on $X$ and $Y$ axes are 20 and 8 respectively. Equation of $\\mathrm{AB}$ is $\\frac{\\mathrm{x}}{20}+\\frac{\\mathrm{y}}{8}=1$ i.e. $2 \\mathrm{x}+5 \\mathrm{y}=40$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/BHA-UfvKSoGb_RdaELhETK2JdbeJ07Wsh943VEpQGAM.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f2c0279619d9d8a1a57", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "The line through the points $(1,4),(-5,1)$ intersects the line $4 x+3 y-5=0$ in the point", "image": null}, "options": [{"id": "2DVK5", "text": "$(-1,-3)$", "image": null, "isCorrect": false}, {"id": "H6wUS", "text": "$\\left(\\frac{5}{3}, \\frac{-5}{3}\\right)$", "image": null, "isCorrect": false}, {"id": "BUZdB", "text": "$(-1,3)$", "image": null, "isCorrect": true}, {"id": "YjJqW", "text": "$(2,1)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of line passing through $\\mathrm{A}(\\mathrm{x}, \\mathrm{y})=(1,4)$ and $\\mathrm{B}\\left(\\mathrm{x}_{2}, \\mathrm{y}_{2}\\right)=(-5,1)$ is\n$\\begin{array}{l}\n\\frac{y-4}{4-1}=\\frac{x-1}{1+5} \\\\\n\\frac{y-4}{3}=\\frac{x-1}{6} \\Rightarrow 2(y-4)=x-1 \\Rightarrow x-1-2 y+8=0 \\\\\nx-2 y+7=0 ...(1)\n\\end{array}$\nAlso given equation of line is $4 x+3 y-5=0$ ...(2)\nSolving (1) \\& (2) we get $x=-1, y=3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f150279619d9d8a19a5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "The y-intercept of the line passing through A(6, 1) and perpendicular to the line x- 2y =4 is …", "image": null}, "options": [{"id": "xwOZa", "text": "5", "image": null, "isCorrect": false}, {"id": "nW57T", "text": "13", "image": null, "isCorrect": true}, {"id": "3IILi", "text": "-2", "image": null, "isCorrect": false}, {"id": "xlzUq", "text": "26", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Slope of the given line, <br/><math><mi>x</mi><mo>-</mo><mn>2</mn><mi>y</mi><mo>=</mo><mn>4</mn><mi></mi></math> is <math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>  <br/>Equation of a line passing through A(6, 1) and perpendicular to given line is <br/><math><mi>y</mi><mo>-</mo><mn>1</mn><mo>=</mo><mfenced separators=\"|\"><mrow><mo>-</mo><mn>2</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>6</mn></mrow></mfenced></math>  <br/><math><mo>&#8658;</mo><mi>y</mi><mo>-</mo><mn>1</mn><mo>=</mo><mo>-</mo><mn>2</mn><mi>x</mi><mo>+</mo><mn>12</mn></math>  <br/><math><mo>&#8658;</mo><mn>2</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>13</mn></math>  <br/><math><mo>&#8658;</mo><mfrac><mrow><mi>x</mi></mrow><mrow><mfenced separators=\"|\"><mrow><mfrac><mrow><mn>13</mn></mrow><mrow><mn>2</mn></mrow></mfrac></mrow></mfenced></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>y</mi></mrow><mrow><mn>13</mn></mrow></mfrac><mo>=</mo><mn>1</mn></math>  <br/><math><mo>∴</mo></math> y-intercept of the obtained line is 13.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea90279619d9d8a163f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "If $2 a+b+3 c=0$, then the line $a x+b y+c=0$ passes through the fixed point that is", "image": null}, "options": [{"id": "HL7z7", "text": "$\\left(\\frac{2}{3}, \\frac{1}{3}\\right)$", "image": null, "isCorrect": true}, {"id": "lCWY4", "text": "$(0,1)$", "image": null, "isCorrect": false}, {"id": "byR3m", "text": "$\\left(\\frac{2}{3}, 0\\right)$", "image": null, "isCorrect": false}, {"id": "ZqyS1", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $2 a+b+3 c+0$...(i)\nand line, $\\quad a x+b y+c=0$\n$\\Rightarrow \\quad 3 a x+3 b y+3 c=0$...(ii)\nOn subtracting Eq. (i) from Eq. (ii), we get $(3 x-2) a+(3 y-1) b=0 \\cdot a+0 \\cdot b$\nOn comparing both sides, we get\n$$\n3 x-2=0 \\Rightarrow x=\\frac{2}{3}\n$$\nand $\\quad 3 y-1=0 \\Rightarrow y=\\frac{1}{3}$\n$\\therefore$ Line, $a x+b y+c=0$ passes through the fixed point $\\left(\\frac{2}{3}, \\frac{1}{3}\\right)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a2633f0279619d9d8a3d6d", "title": "Angle between Lines", "totalQuestions": 12, "questions": [{"_id": "6abb88c415a9fc0fc8c146ce", "type": "singleCorrect", "question": {"text": "If $(2, 8)$ is one vertex and $x - y + 3 = 0$ is one diagonal of a square, then the equation of the other diagonal is", "image": null}, "options": [{"id": "D9hez", "label": "A", "text": "$x + y - 10 = 0$", "isCorrect": true, "image": null}, {"id": "UaAfP", "label": "B", "text": "$x + y + 10 = 0$", "isCorrect": false, "image": null}, {"id": "8ORKw", "label": "C", "text": "$x - y + 10 = 0$", "isCorrect": false, "image": null}, {"id": "PvxIN", "label": "D", "text": "$x - y - 10 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Substituting the coordinates of the given vertex $(2, 8)$ into the equation of the given diagonal $x - y + 3 = 0$, we get $2 - 8 + 3 = -3 \\neq 0$.<br><br>Since the vertex does not lie on the given diagonal, the other diagonal must pass through $(2, 8)$.<br><br>The diagonals of a square are perpendicular to each other. The slope of the given diagonal $x - y + 3 = 0$ is $1$.<br><br>The slope of the other diagonal is $-1$.<br><br>The equation of the line passing through $(2, 8)$ with slope $-1$ is<br><br>$y - 8 = -1(x - 2)$<br><br>$x + y - 10 = 0$<br><br>Answer: $x + y - 10 = 0$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be1bf9280d7f9932d43", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The acute angle between the line $4 x-2 y+13=0$ and the line which makes equal intercepts with the co-ordinate axes is", "image": null}, "options": [{"id": "1BGWr", "text": "$\\tan ^{-1}(2)$", "image": null, "isCorrect": false}, {"id": "SHySL", "text": "$\\tan ^{-1}(3)$", "image": null, "isCorrect": true}, {"id": "lHCyX", "text": "$\\tan ^{-1}\\left(\\frac{1}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "Am9XO", "text": "$\\tan ^{-1}\\left(\\frac{1}{3}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The slope of the given line $4x - 2y + 13 = 0$ is $m_1 = -\\dfrac{4}{-2} = 2$.<br><br>A line making equal intercepts on the coordinate axes has the equation $\\dfrac{x}{a} + \\dfrac{y}{a} = 1$, which simplifies to $x + y = a$.<br><br>The slope of this line is $m_2 = -1$.<br><br>The acute angle $\\theta$ between the two lines is given by:<br><br>$\\tan \\theta = \\left| \\dfrac{m_1 - m_2}{1 + m_1 m_2} \\right|$<br><br>Substituting the values of $m_1$ and $m_2$:<br><br>$\\tan \\theta = \\left| \\dfrac{2 - (-1)}{1 + (2)(-1)} \\right| = \\left| \\dfrac{3}{-1} \\right| = 3$<br><br>$\\theta = \\tan^{-1}(3)$<br><br>Answer: $\\tan ^{-1}(3)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b2abf9280d7f99326d7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The acute angle between the lines\n\\(x=-2+2 \\mathrm{t}, \\mathrm{y}=3-4 \\mathrm{t}, \\mathrm{z}=-4+\\mathrm{t}\\) and \\(x=-2-\\mathrm{t}, \\mathrm{y}=3+2 \\mathrm{t}, \\mathrm{z}=-4+3 \\mathrm{t}\\) is", "image": null}, "options": [{"id": "HZnro", "text": "$\\cos ^{-1}\\left(\\frac{1}{\\sqrt{6}}\\right)$", "image": null, "isCorrect": true}, {"id": "g383l", "text": "$\\cos ^{-1}\\left(\\frac{1}{\\sqrt{5}}\\right)$", "image": null, "isCorrect": false}, {"id": "GV1U8", "text": "$\\sin ^{-1}\\left(\\frac{2}{\\sqrt{5}}\\right)$", "image": null, "isCorrect": false}, {"id": "D79lB", "text": "$\\cos ^{-1}\\left(\\frac{2}{\\sqrt{6}}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The direction ratios of the first line are $a_1 = 2$, $b_1 = -4$, $c_1 = 1$.<br><br>The direction ratios of the second line are $a_2 = -1$, $b_2 = 2$, $c_2 = 3$.<br><br>The acute angle $\\theta$ between the two lines is given by:<br><br>$\\cos \\theta = \\dfrac{|a_1 a_2 + b_1 b_2 + c_1 c_2|}{\\sqrt{a_1^2 + b_1^2 + c_1^2} \\sqrt{a_2^2 + b_2^2 + c_2^2}}$<br><br>Substituting the values:<br><br>$\\cos \\theta = \\dfrac{|(2)(-1) + (-4)(2) + (1)(3)|}{\\sqrt{2^2 + (-4)^2 + 1^2} \\sqrt{(-1)^2 + 2^2 + 3^2}}$<br><br>$\\cos \\theta = \\dfrac{|-2 - 8 + 3|}{\\sqrt{4 + 16 + 1} \\sqrt{1 + 4 + 9}}$<br><br>$\\cos \\theta = \\dfrac{|-7|}{\\sqrt{21} \\sqrt{14}}$<br><br>$\\cos \\theta = \\dfrac{7}{\\sqrt{3 \\times 7 \\times 2 \\times 7}}$<br><br>$\\cos \\theta = \\dfrac{7}{7\\sqrt{6}} = \\dfrac{1}{\\sqrt{6}}$<br><br>$\\theta = \\cos^{-1}\\left(\\dfrac{1}{\\sqrt{6}}\\right)$<br><br>Answer: $\\cos ^{-1}\\left(\\frac{1}{\\sqrt{6}}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143d0aee93fa0796df10", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "Suppose that the points $(\\mathrm{h}, \\mathrm{k}),(1,2)$ and $(-3,4)$ lie on the line $l_1$. If a line $l_2$ passing through the points $(h, k)$ and $(4,3)$ is perpendicular to $l_1$, then $\\left(\\frac{k}{h}\\right)$ equals", "image": null}, "options": [{"id": "zzkQo", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": true}, {"id": "DLOfl", "text": "0", "image": null, "isCorrect": false}, {"id": "EKDci", "text": "3", "image": null, "isCorrect": false}, {"id": "zFiyQ", "text": "$-\\frac{1}{7}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The slope of line $l_1$ passing through $(1, 2)$ and $(-3, 4)$ is given by:<br><br>$m_1 = \\dfrac{4 - 2}{-3 - 1} = -\\dfrac{1}{2}$<br><br>Since the point $(h, k)$ lies on $l_1$, the slope of the line segment joining $(h, k)$ and $(1, 2)$ is also $-\\dfrac{1}{2}$.<br><br>$\\dfrac{k - 2}{h - 1} = -\\dfrac{1}{2}$<br><br>$2k - 4 = -h + 1$<br><br>$h + 2k = 5 \\quad \\dots (1)$<br><br>The slope of line $l_2$ passing through $(h, k)$ and $(4, 3)$ is:<br><br>$m_2 = \\dfrac{3 - k}{4 - h}$<br><br>Since $l_2$ is perpendicular to $l_1$, we have $m_1 m_2 = -1$.<br><br>$\\left(-\\dfrac{1}{2}\\right) \\left(\\dfrac{3 - k}{4 - h}\\right) = -1$<br><br>$\\dfrac{3 - k}{4 - h} = 2$<br><br>$3 - k = 8 - 2h$<br><br>$2h - k = 5 \\quad \\dots (2)$<br><br>Solving equations (1) and (2):<br><br>Multiply equation (2) by 2:<br><br>$4h - 2k = 10$<br><br>Adding this to equation (1):<br><br>$(h + 2k) + (4h - 2k) = 5 + 10$<br><br>$5h = 15 \\Rightarrow h = 3$<br><br>Substituting $h = 3$ into equation (1):<br><br>$3 + 2k = 5 \\Rightarrow 2k = 2 \\Rightarrow k = 1$<br><br>Therefore, $\\dfrac{k}{h} = \\dfrac{1}{3}$.<br><br>Answer: $\\frac{1}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213920aee93fa0796d9d1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "The acute angle between the lines $x \\cos 30^{\\circ}+y \\sin 30^{\\circ}=3$ and $x \\cos 60^{\\circ}+y \\sin 60^{\\circ}=5$ is", "image": null}, "options": [{"id": "mYoyh", "text": "$75^{\\circ}$", "image": null, "isCorrect": false}, {"id": "KePpP", "text": "$30^{\\circ}$", "image": null, "isCorrect": true}, {"id": "IpGtw", "text": "$60^{\\circ}$", "image": null, "isCorrect": false}, {"id": "AXFFq", "text": "$45^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equations of the lines are in the normal form $x \\cos \\alpha + y \\sin \\alpha = p$.<br><br>For the first line, the angle made by the normal with the positive x-axis is $\\alpha_1 = 30^{\\circ}$.<br><br>For the second line, the angle made by the normal with the positive x-axis is $\\alpha_2 = 60^{\\circ}$.<br><br>The angle between two lines is equal to the angle between their normals.<br><br>The acute angle between the lines is $|\\alpha_1 - \\alpha_2| = |30^{\\circ} - 60^{\\circ}| = 30^{\\circ}$.<br><br>Answer: $30^{\\circ}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260fe0279619d9d8a28f4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "If the line through the points $(-2,6)$ and $(4,8)$ is perpendicular to the line passing through the points $(8,12)$ and $(x, 24)$, then the value of $x$ is", "image": null}, "options": [{"id": "U6h7d", "text": "$4$", "image": null, "isCorrect": true}, {"id": "ERa6y", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": false}, {"id": "XiHtr", "text": "$12$", "image": null, "isCorrect": false}, {"id": "w2C4r", "text": "$-2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{m}_1 \\times \\mathrm{m}_2=-1 \\Rightarrow \\frac{8-6}{4+2}=\\frac{24-12}{\\mathrm{x}-8} \\\\ & \\Rightarrow \\frac{2}{6} \\times \\frac{12}{\\mathrm{x}-8}=-1 \\\\ & \\Rightarrow 4=-\\mathrm{x}+8 \\\\ & \\Rightarrow \\mathrm{x}=4\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2609d0279619d9d8a25ef", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "If the angle between the lines is $\\frac{\\pi^c}{4}$ and slope of one of the lines is $\\frac{1}{2}$, then slope of the other line is", "image": null}, "options": [{"id": "hmp81", "text": "3 or $-\\frac{1}{3}$", "image": null, "isCorrect": true}, {"id": "GOzLA", "text": "4 or $-\\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "1XbeD", "text": "2 or $-\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "ZlB3B", "text": "3 or -3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $\\theta=45^{\\circ}$ and $\\mathrm{m}_1=\\frac{1}{2}$\n$$\n\\begin{aligned}\n& \\tan \\theta=\\left|\\frac{\\mathrm{m}_1-\\mathrm{m}_2}{1+\\mathrm{m}_1 \\mathrm{~m}_2}\\right| \\\\\n& \\therefore \\quad \\tan 45^{\\circ}=\\left|\\frac{\\frac{1}{2}-\\mathrm{m}_2}{1+\\left(\\frac{1}{2}\\right) \\mathrm{m}_2}\\right| \\Rightarrow\\left|\\frac{1-2 \\mathrm{~m}_2}{2+\\mathrm{m}_2}\\right|= \\pm 1 \\\\\n& \\therefore \\quad 1-2 \\mathrm{~m}_2=2+\\mathrm{m}_2 \\text { or } 1-2 \\mathrm{~m}_2=-2 \\\\\n& \\therefore \\mathrm{m}_2=\\frac{-1}{3} \\text { or } \\mathrm{m}_2=3\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2607a0279619d9d8a24d3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "The equation of perpendicular bisector of the line segment joining $\\mathrm{A}(-2,3)$ and $\\mathrm{B}(6,-5)$ is", "image": null}, "options": [{"id": "Ho2Fi", "text": "$x+y=3$", "image": null, "isCorrect": false}, {"id": "04taj", "text": "$x+y=1$", "image": null, "isCorrect": false}, {"id": "EXDHh", "text": "$x-y=-1$", "image": null, "isCorrect": false}, {"id": "dSqBx", "text": "$x-y=3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Slope of line $\\mathrm{AB}=\\frac{-5-3}{6+2}=\\frac{-8}{3}=-1$\nMid point of $\\mathrm{AB}=\\frac{-2+6}{2}, \\frac{3-5}{2}=(2,-1)$\nEquation of perpendicular bisector $\\mathrm{AB}$ is $(\\mathrm{y}+1)=1(\\mathrm{x}-2)$ i.e. $x-y=3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fae0279619d9d8a1e6c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "The acute angle between the lines given by $y-\\sqrt{3} x+1=0$ and\n$\\sqrt{3} y-x+7=0$ is", "image": null}, "options": [{"id": "WStLw", "text": "$75^{\\circ}$", "image": null, "isCorrect": false}, {"id": "1MNhL", "text": "$60^{\\circ}$", "image": null, "isCorrect": false}, {"id": "43yyR", "text": "$45^{\\circ}$", "image": null, "isCorrect": false}, {"id": "NUSxf", "text": "$30^{\\circ}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Slope of given lines are $m_{1}=\\sqrt{3}$, and $m_{2}=\\frac{1}{\\sqrt{3}}$\n$$\n\\begin{array}{l}\n\\therefore \\tan \\theta=\\left|\\frac{\\sqrt{3}-\\frac{1}{\\sqrt{3}}}{1+\\sqrt{3} \\times \\frac{1}{\\sqrt{3}}}\\right|=\\left|\\frac{2}{\\sqrt{3}}\\right| \\\\\n\\tan \\theta=\\frac{1}{\\sqrt{3}} \\Rightarrow \\theta=30^{\\circ}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f510279619d9d8a1b80", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "The acute angle included between the lines $x \\sin \\theta-y \\cos \\theta=5$ and\n$x \\sin \\propto-y \\cos \\propto+11=0$ is", "image": null}, "options": [{"id": "bfuAD", "text": "$|\\theta-\\propto|$", "image": null, "isCorrect": true}, {"id": "J1PSw", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": false}, {"id": "zK3C0", "text": "$\\frac{\\pi}{3}$", "image": null, "isCorrect": false}, {"id": "EQEvq", "text": "$\\theta+\\propto$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Slope of line $x \\sin \\theta-y \\cos \\theta=5$ is $m_{1}=\\frac{\\sin \\theta}{\\cos \\theta}=\\tan \\theta$ Slope of line $x \\sin \\alpha-y \\sin \\alpha+11=0$ is $m_{2}=\\frac{\\sin \\alpha}{\\cos \\alpha}=\\tan \\alpha$ Let $\\beta$ be the angle between the lines\n$\\begin{aligned}\n\\tan \\beta &=\\left|\\frac{\\tan \\theta-\\tan \\alpha}{1+\\tan \\alpha \\tan \\alpha}\\right| \\Rightarrow \\tan \\beta=\\tan (\\theta-\\alpha) \\\\\n\\beta &=|\\theta-\\alpha|\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f030279619d9d8a1910", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c5 \">t</mi><mi mathvariant=\"normal\">a</mi><mi mathvariant=\"normal\">n</mi><msub><mrow><mi>θ</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><mo>-</mo><mn>1</mn></math>  <br/><math><mo>&#8658;</mo><msub><mrow><mi>θ</mi></mrow><mrow><mn>2</mn></mrow></msub><mo>=</mo><msup><mrow><mn>135</mn></mrow><mrow><mi>o</mi></mrow></msup></math>  <br/><math><mo>∴</mo><mi></mi></math> Acute angle between given lines is <math><msup><mrow><mn>45</mn></mrow><mrow><mi>o</mi></mrow></msup></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25edc0279619d9d8a17e2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "If a line makes angles <math><msup><mrow><mn>120</mn></mrow><mrow><mi>o</mi></mrow></msup></math> and <math><msup><mrow><mn>60</mn></mrow><mrow><mi>o</mi></mrow></msup></math> with the positive directions of <math><mi>X</mi></math> and <math><mi>Z</mi></math> axes respectively then the angle made by the line with positive <math><mi>Y</mi><mo>-</mo></math> axis is", "image": null}, "options": [{"id": "mNttz", "text": "<math><msup><mrow><mn>150</mn></mrow><mrow><mi>o</mi></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "wRUZG", "text": "<math><msup><mrow><mn>60</mn></mrow><mrow><mi>o</mi></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "6uFIw", "text": "<math><msup><mrow><mn>135</mn></mrow><mrow><mi>o</mi></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "LFHNW", "text": "<math><msup><mrow><mn>120</mn></mrow><mrow><mi>o</mi></mrow></msup></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<math> <mrow> <msup> <mrow> <mi>cos</mi></mrow> <mn>2</mn> </msup> <mi>β</mi><mo>=</mo><mn>1</mn><mo>−</mo><msup> <mrow> <mi>cos</mi></mrow> <mn>2</mn> </msup> <mi>α</mi><mo>−</mo><msup> <mrow> <mi>cos</mi></mrow> <mn>2</mn> </msup> <mi>γ</mi></mrow> </math><br /><math> <mrow> <mo>=</mo><mn>1</mn><mo>−</mo><msup> <mrow> <mi>cos</mi></mrow> <mn>2</mn> </msup> <mrow><mo>(</mo> <mrow> <msup> <mrow> <mn>120</mn></mrow> <mi>o</mi> </msup> </mrow> <mo>)</mo></mrow><mo>−</mo><msup> <mrow> <mi>cos</mi></mrow> <mn>2</mn> </msup> <mrow><mo>(</mo> <mrow> <msup> <mrow> <mn>60</mn></mrow> <mi>o</mi> </msup> </mrow> <mo>)</mo></mrow></mrow> </math><br /><math> <mrow> <mo>=</mo><mn>1</mn><mo>−</mo><mfrac> <mn>1</mn> <mn>4</mn> </mfrac> <mo>−</mo><mfrac> <mn>1</mn> <mn>4</mn> </mfrac> </mrow> </math><br /><math> <mrow> <mo>=</mo><mn>1</mn><mo>−</mo><mfrac> <mn>1</mn> <mn>2</mn> </mfrac></mrow></math><br /><math> <mrow> <mi>cos</mi><mi>β</mi><mo>=</mo><mo>±</mo><mfrac> <mn>1</mn> <mrow> <msqrt> <mn>2</mn> </msqrt> </mrow> </mfrac> </mrow> </math><br /><math> <mrow> <mi>β</mi><mo>=</mo><msup> <mrow> <mn>135</mn></mrow> <mi>o</mi> </msup> </mrow> <mo>,</mo><mi>&nbsp;<msup> <mrow> <mn>45</mn></mrow> <mi>o</mi> </msup></mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a2633f0279619d9d8a3d6e", "title": "Derived Forms of Line", "totalQuestions": 12, "questions": [{"_id": "68871bf2bf9280d7f9932de8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The equation of the line passing through the point of intersection of the lines $x+2 y+6=0$ and $2 x-y=2$ and making an intercept 5 on the $y$-axis is", "image": null}, "options": [{"id": "kwg9L", "text": "$39 x-2 y+10=0$", "image": null, "isCorrect": true}, {"id": "CwLvz", "text": "$39 x+2 y+10=0$", "image": null, "isCorrect": false}, {"id": "RPuXN", "text": "$39 x-2 y-10=0$", "image": null, "isCorrect": false}, {"id": "7HFQx", "text": "$39 x+2 y-10=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given lines are $x+2y+6=0$ and $2x-y-2=0$.<br><br>Solving these equations, we get the point of intersection.<br><br>From the second equation, $y = 2x-2$. Substituting in the first equation:<br><br>$x + 2(2x-2) + 6 = 0$<br><br>$5x + 2 = 0 \\Rightarrow x = -\\dfrac{2}{5}$<br><br>$y = 2\\left(-\\dfrac{2}{5}\\right) - 2 = -\\dfrac{14}{5}$<br><br>The point of intersection is $\\left(-\\dfrac{2}{5}, -\\dfrac{14}{5}\\right)$.<br><br>The required line makes a $y$-intercept of $5$, so it passes through $(0, 5)$.<br><br>The slope of the line passing through $\\left(-\\dfrac{2}{5}, -\\dfrac{14}{5}\\right)$ and $(0, 5)$ is:<br><br>$m = \\dfrac{5 - \\left(-\\dfrac{14}{5}\\right)}{0 - \\left(-\\dfrac{2}{5}\\right)} = \\dfrac{\\dfrac{39}{5}}{\\dfrac{2}{5}} = \\dfrac{39}{2}$<br><br>The equation of the line is $y = mx + c$:<br><br>$y = \\dfrac{39}{2}x + 5$<br><br>$2y = 39x + 10$<br><br>$39x - 2y + 10 = 0$<br><br>Answer: $39 x-2 y+10=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd0bf9280d7f9932cad", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The line MN whose equation is $x-y-2=0$ cuts the X-axis at M and co-ordinates of N are $(4,2)$. The line MN is rotated about M through $45^{\\circ}$ in anticlockwise direction. The equation of the line MN in the new position is", "image": null}, "options": [{"id": "pqfTv", "text": "$\\mathrm{y}=-\\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "9UwZB", "text": "$\\mathrm{y}=2$", "image": null, "isCorrect": false}, {"id": "Yb3ET", "text": "$x=-2$", "image": null, "isCorrect": false}, {"id": "tJUqx", "text": "$x=2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The equation of line MN is $x - y - 2 = 0$.<br><br>To find the coordinates of M, substitute $y = 0$ in the equation of line MN.<br><br>$x - 0 - 2 = 0 \\Rightarrow x = 2$<br><br>The coordinates of M are $(2, 0)$.<br><br>The slope of line MN is $m = 1$.<br><br>Let $\\theta$ be the angle of inclination of line MN.<br><br>$\\tan \\theta = 1 \\Rightarrow \\theta = 45^{\\circ}$<br><br>The line MN is rotated about M through $45^{\\circ}$ in the anticlockwise direction.<br><br>The new angle of inclination of the line is $\\theta' = 45^{\\circ} + 45^{\\circ} = 90^{\\circ}$.<br><br>The new line passes through M $(2, 0)$ and is perpendicular to the X-axis.<br><br>The equation of the new line is $x = 2$.<br><br>Answer: $x=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143d0aee93fa0796df16", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "The abscissa of the point on the curve $y=\\mathrm{a}\\left(\\mathrm{e}^{\\frac{x}{a}}+\\mathrm{e}^{-\\frac{x}{a}}\\right)$ where the tangent is parallel to the X -axis is", "image": null}, "options": [{"id": "Zn5Km", "text": "0", "image": null, "isCorrect": true}, {"id": "e6BCm", "text": "a", "image": null, "isCorrect": false}, {"id": "h6p4e", "text": "2 a", "image": null, "isCorrect": false}, {"id": "VliA7", "text": "-2 a", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given the equation of the curve:<br><br>$y = a\\left(e^{\\dfrac{x}{a}} + e^{-\\dfrac{x}{a}}\\right)$<br><br>Differentiating with respect to $x$, we get:<br><br>$\\dfrac{dy}{dx} = a\\left(e^{\\dfrac{x}{a}} \\cdot \\dfrac{1}{a} + e^{-\\dfrac{x}{a}} \\cdot \\left(-\\dfrac{1}{a}\\right)\\right)$<br><br>$\\dfrac{dy}{dx} = e^{\\dfrac{x}{a}} - e^{-\\dfrac{x}{a}}$<br><br>Since the tangent is parallel to the X-axis, its slope is zero. Therefore, $\\dfrac{dy}{dx} = 0$.<br><br>$e^{\\dfrac{x}{a}} - e^{-\\dfrac{x}{a}} = 0$<br><br>$e^{\\dfrac{x}{a}} = e^{-\\dfrac{x}{a}}$<br><br>$e^{\\dfrac{2x}{a}} = 1$<br><br>$\\dfrac{2x}{a} = 0$<br><br>$x = 0$<br><br>The abscissa of the point is $0$.<br><br>Answer: 0", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b60aee93fa0796daf2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "A line $4 x+y=1$ passes through the point $\\mathrm{A}(2,-7)$ meets the line BC whose equation is $3 x-4 y+1=0$ at the point B . The equation of the line $A C$ so that $A B=A C$ is", "image": null}, "options": [{"id": "I2PMT", "text": "$52 x+89 y+519=0$", "image": null, "isCorrect": true}, {"id": "ONRfw", "text": "$52 x+89 y-727=0$", "image": null, "isCorrect": false}, {"id": "2V6Mn", "text": "$52 x-89 y+519=0$", "image": null, "isCorrect": false}, {"id": "VNlIf", "text": "$52 x-89 y-727=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The slope of the line AB is $m_1 = -4$.<br><br>The slope of the line BC is $m_2 = \\dfrac{3}{4}$.<br><br>Since $AB = AC$, $\\triangle ABC$ is an isosceles triangle, which means the angle between AB and BC is equal to the angle between AC and BC.<br><br>Let the angle between AB and BC be $\\theta$. Then,<br><br>$\\tan \\theta = \\left| \\dfrac{m_1 - m_2}{1 + m_1 m_2} \\right| = \\left| \\dfrac{-4 - \\dfrac{3}{4}}{1 + (-4)\\left(\\dfrac{3}{4}\\right)} \\right| = \\left| \\dfrac{-\\dfrac{19}{4}}{-2} \\right| = \\dfrac{19}{8}$<br><br>Let the slope of the line AC be $m$. The angle between AC and BC is also $\\theta$, so:<br><br>$\\left| \\dfrac{m - \\dfrac{3}{4}}{1 + \\dfrac{3m}{4}} \\right| = \\dfrac{19}{8}$<br><br>$\\dfrac{4m - 3}{4 + 3m} = \\pm \\dfrac{19}{8}$<br><br>Taking the positive sign yields $m = -4$, which is the slope of the line AB. Taking the negative sign gives the slope of AC:<br><br>$\\dfrac{4m - 3}{4 + 3m} = -\\dfrac{19}{8}$<br><br>$32m - 24 = -76 - 57m$<br><br>$89m = -52 \\Rightarrow m = -\\dfrac{52}{89}$<br><br>The equation of the line AC passing through $A(2, -7)$ with slope $m = -\\dfrac{52}{89}$ is:<br><br>$y - (-7) = -\\dfrac{52}{89}(x - 2)$<br><br>$89(y + 7) = -52(x - 2)$<br><br>$89y + 623 = -52x + 104$<br><br>$52x + 89y + 519 = 0$<br><br>Answer: $52 x+89 y+519=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a50aee93fa0796da66", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "The straight line, $2 x-3 y+17=0$ is perpendicular to the line passing through the points $(7,17)$ and $(15, \\beta)$, then $\\beta$ equals", "image": null}, "options": [{"id": "HHxQV", "text": "5", "image": null, "isCorrect": true}, {"id": "11x2B", "text": "$\\dfrac{35}{3}$", "image": null, "isCorrect": false}, {"id": "ayENF", "text": "$-\\dfrac{35}{3}$", "image": null, "isCorrect": false}, {"id": "SDDWH", "text": "-5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The slope of the given line $2x - 3y + 17 = 0$ is $m_1 = \\dfrac{2}{3}$.<br><br>The slope of the line passing through the points $(7, 17)$ and $(15, \\beta)$ is $m_2 = \\dfrac{\\beta - 17}{15 - 7} = \\dfrac{\\beta - 17}{8}$.<br><br>Since the two lines are perpendicular, the product of their slopes is $-1$.<br><br>$m_1 \\times m_2 = -1$<br><br>$\\dfrac{2}{3} \\times \\dfrac{\\beta - 17}{8} = -1$<br><br>$\\dfrac{\\beta - 17}{12} = -1$<br><br>$\\beta - 17 = -12$<br><br>$\\beta = 5$<br><br>Answer: 5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213410aee93fa0796d75d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The diagonals of a parallelogram ABCD are along the lines $x+3 y=4$ and $6 x-2 y=7$. Then ABCD must be a", "image": null}, "options": [{"id": "TgzVF", "text": "rectangle.", "image": null, "isCorrect": false}, {"id": "2uMsG", "text": "square.", "image": null, "isCorrect": false}, {"id": "96Ubl", "text": "rhombus.", "image": null, "isCorrect": true}, {"id": "zR33q", "text": "cyclic quadrilateral", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equations of the diagonals are $x + 3y = 4$ and $6x - 2y = 7$.<br><br>The slope of the first diagonal is $m_1 = -\\dfrac{1}{3}$.<br><br>The slope of the second diagonal is $m_2 = \\dfrac{6}{2} = 3$.<br><br>The product of their slopes is $m_1 m_2 = \\left(-\\dfrac{1}{3}\\right)(3) = -1$.<br><br>This implies that the diagonals are perpendicular to each other.<br><br>A parallelogram whose diagonals intersect at right angles is a rhombus.<br><br>Answer: rhombus.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615a0279619d9d8a2bda", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "$N(3,-4)$ is the foot of the perpendicular drawn from the orgin to a line $L$. Then the equation of the line $L$ is", "image": null}, "options": [{"id": "fKrWl", "text": "$4 x-3 y-24=0$", "image": null, "isCorrect": false}, {"id": "7gH6b", "text": "$x-y-7=0$", "image": null, "isCorrect": false}, {"id": "pCl2A", "text": "$3 x-4 y-25=0$", "image": null, "isCorrect": true}, {"id": "bboyn", "text": "$4 x+3 y=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Slope of the line $=\\frac{3}{4}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/lIDXhT3PlnWclvPm4lftS7F5y92GjdtH0rfyHmWqBjE.original.fullsize.png\"><br>\nequation of the line $y+4=\\frac{3}{4}(x-3)$\n$\\Rightarrow 3 x-4 y-25=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261330279619d9d8a2aa0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "The equation of the line perpendicular to $2 x-3 y+5=0$ and making an intercept 3 with positive Y-axis is", "image": null}, "options": [{"id": "2rbRT", "text": "$3 x+2 y-6=0$", "image": null, "isCorrect": true}, {"id": "8xTuX", "text": "$3 x+2 y+6=0$", "image": null, "isCorrect": false}, {"id": "3aUIr", "text": "$3 x+2 y-7=0$", "image": null, "isCorrect": false}, {"id": "KuFPR", "text": "$3 x+2 y-12=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the line be $3 x+2 y+\\lambda=0$\nPutting $x=0, y=\\frac{-\\lambda}{2}=3$ [given]\n$\\Rightarrow \\lambda=-6$\nHence the required line is $3 x+2 y-6=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260e80279619d9d8a2844", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "The equation of a line, whose perpendicular distance from the origin is 5 units and the angle, which the perpendicular to the line from the origin makes, is $210^{\\circ}$ with positive $\\mathrm{X}$-axis, is", "image": null}, "options": [{"id": "W2W3A", "text": "$-x \\sqrt{3}+y+10=0$", "image": null, "isCorrect": false}, {"id": "WASqO", "text": "$x \\sqrt{3}+y-10=0$", "image": null, "isCorrect": false}, {"id": "TJXQg", "text": "$x \\sqrt{3}+y+10=0$", "image": null, "isCorrect": true}, {"id": "dgqpZ", "text": "$x \\sqrt{3}-y+10=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, $P=5$ and $\\alpha=210^{\\circ}$\nWriting the equation of straight line in normal form\n$\\begin{aligned} & \\Rightarrow x \\cos \\left(210^{\\circ}\\right)+y \\sin 30^{\\circ}=5 \\\\ & \\Rightarrow-x \\cos 30^{\\circ}-y \\sin 30^{\\circ}=5 \\\\ & \\Rightarrow-x \\cdot \\frac{\\sqrt{3}}{2}-y \\cdot \\frac{1}{2}=5 \\\\ & \\Rightarrow-\\sqrt{3} x-y=10 \\\\ & \\Rightarrow \\sqrt{3} x+y+10=0\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2608a0279619d9d8a2550", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "If the line joining two points $\\mathrm{A}(2,0)$ and $\\mathrm{B}(3,1)$ is rotated about $\\mathrm{A}$ in anticlockwise direction through an angle of $15^{\\circ}$, then the equation of the line in new position is", "image": null}, "options": [{"id": "3EZkN", "text": "$y=3 x-6$", "image": null, "isCorrect": false}, {"id": "ImdlI", "text": "$y=\\sqrt{3} x-2 \\sqrt{3}$", "image": null, "isCorrect": true}, {"id": "IUVaP", "text": "$y=-\\sqrt{3} x+2 \\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "wuyAM", "text": "$y=\\frac{1}{\\sqrt{3}} x-\\frac{2}{\\sqrt{3}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Refer Figure\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Y6Oc0tkhF6qxHtQ3KY004QWVGaziSySvputeNSwaVao.original.fullsize.png\"><br>\nSlope of $\\mathrm{AB}=\\frac{1-0}{3-2}=1$\n$$\n\\therefore \\tan \\theta=1 \\Rightarrow \\theta=45^{\\circ}\n$$\nLine $\\mathrm{AB}$ is rotated through $15^{\\circ}$ in anticlockwise direction about\nA.\nTherefore in a new position, slope of line $=\\tan \\left(45^{\\circ}+15^{\\circ}\\right)=\\tan 60^{\\circ}=\\sqrt{3}$ and it passes through $\\mathrm{A}$.\nRequired equation of line is $(\\mathrm{y}-0)=\\sqrt{3}(\\mathrm{x}-2) \\Rightarrow$\n$$\n\\sqrt{3} x-2 \\sqrt{3}=y\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2600b0279619d9d8a2146", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "The distance between the lines given by $3 x+4 \\mathrm{y}=9$ and $6 x+8 \\mathrm{y}=15$ is", "image": null}, "options": [{"id": "lXhp2", "text": "$5$ units", "image": null, "isCorrect": false}, {"id": "kMobZ", "text": "$ 3 units", "image": null, "isCorrect": false}, {"id": "1nCFE", "text": "$0\\cdot 5$ units", "image": null, "isCorrect": false}, {"id": "iZ2sd", "text": "$0\\cdot 3$ units", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given parallel lines are\n$3 x+4 y=9 \\Rightarrow 6 x+8 y=18$ and $6 x+8 y=15$\nDistance between them is\n$d=\\left|\\frac{c_{1}-c_{2}}{\\sqrt{a^{2}+b^{2}}}\\right|=\\frac{|18-15|}{\\sqrt{36+64}}=\\frac{3}{10}=0.3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25edf0279619d9d8a17f6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "The equation of the line passing through the point <math><mfenced separators=\"|\"><mrow><mo>-</mo><mn>3</mn><mo>,</mo><mi>&nbsp;</mi><mn>1</mn></mrow></mfenced></math> and bisecting the angle between coordinate axes is", "image": null}, "options": [{"id": "Gp71I", "text": "<math><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mn>2</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "aMAI5", "text": "<math><mo>-</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mn>2</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "nWoaj", "text": "<math><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mn>4</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "v8l4g", "text": "<math><mn>2</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mn>5</mn><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/332774.png\" style=\"width: 250px; height: 189px;\" /><br /><math> <mrow> <mrow><mo>(</mo> <mrow> <mi>y</mi><mo>−</mo><mn>1</mn></mrow> <mo>)</mo></mrow><mo>=</mo><mo>−</mo><mn>1</mn><mrow><mo>(</mo> <mrow> <mi>x</mi><mo>+</mo><mn>3</mn></mrow> <mo>)</mo></mrow></mrow> </math><br /><math> <mrow> <mi>y</mi><mo>−</mo><mn>1</mn><mo>=</mo><mo>−</mo><mi>x</mi><mo>−</mo><mn>3</mn></mrow> <
