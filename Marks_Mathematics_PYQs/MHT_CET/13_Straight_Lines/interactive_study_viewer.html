/math><br /><math> <mrow> <mi>x</mi><mo>+</mo><mi>y</mi><mo>−</mo><mn>1</mn><mo>+</mo><mn>3</mn><mo>=</mo><mn>0</mn></mrow> </math><br /><math> <mrow> <mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mn>2</mn><mo>=</mo><mn>0</mn></mrow> </math><br/><img alt=\"\" src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/3327745.png\" /><br />", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a2633f0279619d9d8a3d71", "title": "Position of a point", "totalQuestions": 1, "questions": [{"_id": "65a261dc0279619d9d8a2fe8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "The vertices of the feasible region for the constraints $x+y \\leq 4, x \\leq 2, y \\leq 1, x+y \\geq 1, x$, $y \\geq 0$ are", "image": null}, "options": [{"id": "5LOzJ", "text": "(1,0),(2,0),(2,1),(0,4)", "image": null, "isCorrect": false}, {"id": "GchzH", "text": "(0,1),(4,0),(0,4),(1,0)", "image": null, "isCorrect": false}, {"id": "zhW8m", "text": "(1,0),(2,0),(2,1),(0,1)", "image": null, "isCorrect": true}, {"id": "ufJ8B", "text": "(1,0),(4,0),(2,1),(0,4)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Feasible region lies on origin side of $x+y=4$, $x=2, y=1$ and non-origin side of $x+y=1$ and in first quadrant.\n$\\therefore \\quad$ Vertices of feasible region are $\\mathrm{A}(1,0), \\mathrm{B}(2,0), \\mathrm{C}(2,1), \\mathrm{D}(0,1)$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/fQ_y9FII_MnQuWhiDzXUviiQfED6eATMvFpEzRsO8DA.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a2633f0279619d9d8a3d70", "title": "Point and Line", "totalQuestions": 21, "questions": [{"_id": "6abb88d515a9fc0fc8c14764", "type": "singleCorrect", "question": {"text": "If $p_1$ and $p_2$ are the lengths of perpendiculars from the origin to the lines $x\\sec\\theta + y\\csc\\theta = a$ and $x\\cos\\theta - y\\sin\\theta = a\\cos(2\\theta)$ respectively, then $4p_1^2 + p_2^2 =$", "image": null}, "options": [{"id": "ZeAoN", "label": "A", "text": "$2a^2$", "isCorrect": false, "image": null}, {"id": "mCin5", "label": "B", "text": "$4a^2$", "isCorrect": false, "image": null}, {"id": "Fl5iz", "label": "C", "text": "$a^2$", "isCorrect": true, "image": null}, {"id": "F2VLA", "label": "D", "text": "$3a^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The length of the perpendicular from the origin $(0,0)$ to the line $x\\sec\\theta + y\\csc\\theta - a = 0$ is given by<br><br>$p_1 = \\dfrac{|-a|}{\\sqrt{\\sec^2\\theta + \\csc^2\\theta}}$<br><br>Since $\\sec^2\\theta + \\csc^2\\theta = \\dfrac{1}{\\cos^2\\theta} + \\dfrac{1}{\\sin^2\\theta} = \\dfrac{1}{\\sin^2\\theta\\cos^2\\theta}$,<br><br>$p_1 = |a\\sin\\theta\\cos\\theta| = \\dfrac{|a\\sin(2\\theta)|}{2}$<br><br>Squaring both sides and multiplying by $4$,<br><br>$4p_1^2 = a^2\\sin^2(2\\theta)$<br><br>The length of the perpendicular from the origin to the line $x\\cos\\theta - y\\sin\\theta - a\\cos(2\\theta) = 0$ is given by<br><br>$p_2 = \\dfrac{|-a\\cos(2\\theta)|}{\\sqrt{\\cos^2\\theta + \\sin^2\\theta}}$<br><br>Since $\\cos^2\\theta + \\sin^2\\theta = 1$,<br><br>$p_2 = |a\\cos(2\\theta)|$<br><br>Squaring both sides,<br><br>$p_2^2 = a^2\\cos^2(2\\theta)$<br><br>Adding the two expressions,<br><br>$4p_1^2 + p_2^2 = a^2\\sin^2(2\\theta) + a^2\\cos^2(2\\theta)$<br><br>$4p_1^2 + p_2^2 = a^2(\\sin^2(2\\theta) + \\cos^2(2\\theta)) = a^2$<br><br>Answer: $a^2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b415a9fc0fc8c14638", "type": "singleCorrect", "question": {"text": "The sum of the ordinates of the points on the line $4x + 3y = 10$ whose distance from the line $x + y - 4 = 0$ is $\\sqrt{2}$ is equal to ...", "image": null}, "options": [{"id": "AEgl3", "label": "A", "text": "$-4$", "isCorrect": false, "image": null}, {"id": "0pNHB", "label": "B", "text": "$-10$", "isCorrect": false, "image": null}, {"id": "KMGrc", "label": "C", "text": "$12$", "isCorrect": true, "image": null}, {"id": "3ceyO", "label": "D", "text": "$18$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the point on the line $4x + 3y = 10$ be $(x_1, y_1)$.<br><br>We have $4x_1 + 3y_1 = 10 \\Rightarrow x_1 = \\dfrac{10 - 3y_1}{4}$.<br><br>The distance of $(x_1, y_1)$ from the line $x + y - 4 = 0$ is given as $\\sqrt{2}$.<br><br>$\\dfrac{|x_1 + y_1 - 4|}{\\sqrt{1^2 + 1^2}} = \\sqrt{2}$<br><br>$|x_1 + y_1 - 4| = 2$<br><br>This gives two possible cases:<br><br>$x_1 + y_1 - 4 = 2 \\Rightarrow x_1 + y_1 = 6$<br><br>$x_1 + y_1 - 4 = -2 \\Rightarrow x_1 + y_1 = 2$<br><br>Substituting $x_1 = \\dfrac{10 - 3y_1}{4}$ in the first equation:<br><br>$\\dfrac{10 - 3y_1}{4} + y_1 = 6$<br><br>$10 - 3y_1 + 4y_1 = 24$<br><br>$10 + y_1 = 24 \\Rightarrow y_1 = 14$<br><br>Substituting $x_1 = \\dfrac{10 - 3y_1}{4}$ in the second equation:<br><br>$\\dfrac{10 - 3y_1}{4} + y_1 = 2$<br><br>$10 - 3y_1 + 4y_1 = 8$<br><br>$10 + y_1 = 8 \\Rightarrow y_1 = -2$<br><br>The ordinates of the points are $14$ and $-2$.<br><br>The sum of the ordinates is $14 + (-2) = 12$.<br><br>Answer: $12$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889715a9fc0fc8c14525", "type": "singleCorrect", "question": {"text": "The points on the line $x + y - 4 = 0$ which are at one unit distance from the line $4x + 3y - 10 = 0$ are...", "image": null}, "options": [{"id": "rxYam", "label": "A", "text": "$(5, -1)$ and $(-2, 6)$", "isCorrect": false, "image": null}, {"id": "bkdlo", "label": "B", "text": "$(3, 1)$ and $(-7, 11)$", "isCorrect": true, "image": null}, {"id": "Mw6yy", "label": "C", "text": "$(9, -5)$ and $(-11, 15)$", "isCorrect": false, "image": null}, {"id": "AlXoi", "label": "D", "text": "$(-4, 8)$ and $(2, 2)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the point on the line $x + y - 4 = 0$ be $(a, 4 - a)$.<br><br>The distance of this point from the line $4x + 3y - 10 = 0$ is given as $1$ unit.<br><br>Using the perpendicular distance formula, we have:<br><br>$\\dfrac{|4a + 3(4 - a) - 10|}{\\sqrt{4^2 + 3^2}} = 1$<br><br>$\\dfrac{|4a + 12 - 3a - 10|}{5} = 1$<br><br>$|a + 2| = 5$<br><br>This gives two cases:<br><br>$a + 2 = 5 \\Rightarrow a = 3$<br><br>$a + 2 = -5 \\Rightarrow a = -7$<br><br>For $a = 3$, the $y$-coordinate is $4 - 3 = 1$. The point is $(3, 1)$.<br><br>For $a = -7$, the $y$-coordinate is $4 - (-7) = 11$. The point is $(-7, 11)$.<br><br>The required points are $(3, 1)$ and $(-7, 11)$.<br><br>Answer: $(3, 1)$ and $(-7, 11)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889415a9fc0fc8c1450c", "type": "singleCorrect", "question": {"text": "The coordinates of the foot of the perpendicular from the point $(2, 3)$ on the line $y=3x+4$ is given by ...", "image": null}, "options": [{"id": "kbgCL", "label": "A", "text": "$\\left(\\dfrac{37}{10}, \\dfrac{-1}{10}\\right)$", "isCorrect": false, "image": null}, {"id": "VXQov", "label": "B", "text": "$\\left(\\dfrac{-1}{10}, \\dfrac{37}{10}\\right)$", "isCorrect": true, "image": null}, {"id": "CtIk2", "label": "C", "text": "$\\left(\\dfrac{10}{37}, -10\\right)$", "isCorrect": false, "image": null}, {"id": "BL1DF", "label": "D", "text": "$\\left(\\dfrac{2}{3}, -\\dfrac{1}{3}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given line is $3x - y + 4 = 0$.<br><br>Let the foot of the perpendicular from the point $(2, 3)$ to the line be $(h, k)$.<br><br>Using the formula for the foot of the perpendicular:<br><br>$\\dfrac{h - x_1}{a} = \\dfrac{k - y_1}{b} = -\\dfrac{ax_1 + by_1 + c}{a^2 + b^2}$<br><br>Substituting the values $x_1 = 2$, $y_1 = 3$, $a = 3$, $b = -1$, $c = 4$:<br><br>$\\dfrac{h - 2}{3} = \\dfrac{k - 3}{-1} = -\\dfrac{3(2) - 1(3) + 4}{3^2 + (-1)^2}$<br><br>$\\dfrac{h - 2}{3} = \\dfrac{k - 3}{-1} = -\\dfrac{6 - 3 + 4}{10}$<br><br>$\\dfrac{h - 2}{3} = \\dfrac{k - 3}{-1} = -\\dfrac{7}{10}$<br><br>Solving for $h$:<br><br>$h - 2 = -\\dfrac{21}{10} \\Rightarrow h = 2 - \\dfrac{21}{10} = -\\dfrac{1}{10}$<br><br>Solving for $k$:<br><br>$k - 3 = \\dfrac{7}{10} \\Rightarrow k = 3 + \\dfrac{7}{10} = \\dfrac{37}{10}$<br><br>The coordinates of the foot of the perpendicular are $\\left(\\dfrac{-1}{10}, \\dfrac{37}{10}\\right)$.<br><br>Answer: $\\left(\\dfrac{-1}{10}, \\dfrac{37}{10}\\right)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883515a9fc0fc8c14188", "type": "singleCorrect", "question": {"text": "The coordinates of the foot of the perpendicular from the point $(2, 3)$ on the line $x+y-11=0$ are ...", "image": null}, "options": [{"id": "PqNQk", "label": "A", "text": "$(-6, 5)$", "isCorrect": false, "image": null}, {"id": "A8qZt", "label": "B", "text": "$(5, 6)$", "isCorrect": true, "image": null}, {"id": "kSBQF", "label": "C", "text": "$(-5, 6)$", "isCorrect": false, "image": null}, {"id": "h2mU1", "label": "D", "text": "$(6, 5)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the foot of the perpendicular be $(h, k)$.<br><br>The formula for the foot of the perpendicular from $(x_1, y_1)$ to the line $ax+by+c=0$ is:<br><br>$\\dfrac{h - x_1}{a} = \\dfrac{k - y_1}{b} = -\\dfrac{ax_1 + by_1 + c}{a^2 + b^2}$<br><br>Substituting $x_1 = 2$, $y_1 = 3$, $a = 1$, $b = 1$, $c = -11$:<br><br>$\\dfrac{h - 2}{1} = \\dfrac{k - 3}{1} = -\\dfrac{2 + 3 - 11}{1^2 + 1^2}$<br><br>$\\dfrac{h - 2}{1} = \\dfrac{k - 3}{1} = -\\dfrac{-6}{2} = 3$<br><br>$h - 2 = 3 \\Rightarrow h = 5$<br><br>$k - 3 = 3 \\Rightarrow k = 6$<br><br>The coordinates of the foot of the perpendicular are $(5, 6)$.<br><br>Answer: $(5, 6)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b8ebf9280d7f9932a58", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The distance of the point $(1,2)$ from the line $x+y=0$ measured parallel to the line $3 x-y=2$ is", "image": null}, "options": [{"id": "64bOn", "text": "$\\frac{3 \\sqrt{2}}{8}$ units", "image": null, "isCorrect": false}, {"id": "mYh5M", "text": "$\\frac{3 \\sqrt{10}}{4}$ units", "image": null, "isCorrect": true}, {"id": "aQlGC", "text": "10 units", "image": null, "isCorrect": false}, {"id": "gJhuG", "text": "$5 \\sqrt{5}$ units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the given point be $P(1, 2)$.<br><br>The line along which the distance is measured is parallel to $3x - y = 2$.<br><br>The equation of the line passing through $P(1, 2)$ and parallel to $3x - y = 2$ is:<br><br>$3x - y = 3(1) - 2$<br><br>$3x - y = 1$<br><br>Let this line intersect the given line $x + y = 0$ at point $Q$.<br><br>Solving $3x - y = 1$ and $x + y = 0$, we get:<br><br>$3x - (-x) = 1 \\Rightarrow 4x = 1 \\Rightarrow x = \\dfrac{1}{4}$<br><br>$y = -\\dfrac{1}{4}$<br><br>So, $Q = \\left(\\dfrac{1}{4}, -\\dfrac{1}{4}\\right)$.<br><br>The required distance is $PQ$:<br><br>$PQ = \\sqrt{\\left(1 - \\dfrac{1}{4}\\right)^2 + \\left(2 - \\left(-\\dfrac{1}{4}\\right)\\right)^2}$<br><br>$PQ = \\sqrt{\\left(\\dfrac{3}{4}\\right)^2 + \\left(\\dfrac{9}{4}\\right)^2}$<br><br>$PQ = \\sqrt{\\dfrac{9}{16} + \\dfrac{81}{16}} = \\sqrt{\\dfrac{90}{16}} = \\dfrac{3\\sqrt{10}}{4}$ units.<br><br>Answer: $\\frac{3 \\sqrt{10}}{4}$ units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6ebf9280d7f993292a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "From the following options, the nearest line to the origin is ....", "image": null}, "options": [{"id": "f3RXd", "text": "$3 x-4 y+4=0$", "image": null, "isCorrect": false}, {"id": "eN4Us", "text": "$2 x-3 y=5$", "image": null, "isCorrect": false}, {"id": "COnse", "text": "$4 x-3 y+12=0$", "image": null, "isCorrect": false}, {"id": "u4MGP", "text": "$5 x-2 y=3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The perpendicular distance of a line $ax + by + c = 0$ from the origin $(0,0)$ is given by $d = \\dfrac{|c|}{\\sqrt{a^2 + b^2}}$.<br><br>For $3x - 4y + 4 = 0$, $d_1 = \\dfrac{|4|}{\\sqrt{3^2 + (-4)^2}} = \\dfrac{4}{5} = 0.8$<br><br>For $2x - 3y - 5 = 0$, $d_2 = \\dfrac{|-5|}{\\sqrt{2^2 + (-3)^2}} = \\dfrac{5}{\\sqrt{13}} \\approx 1.38$<br><br>For $4x - 3y + 12 = 0$, $d_3 = \\dfrac{|12|}{\\sqrt{4^2 + (-3)^2}} = \\dfrac{12}{5} = 2.4$<br><br>For $5x - 2y - 3 = 0$, $d_4 = \\dfrac{|-3|}{\\sqrt{5^2 + (-2)^2}} = \\dfrac{3}{\\sqrt{29}} \\approx 0.55$<br><br>Since $d_4$ is the minimum, the line $5x - 2y = 3$ is nearest to the origin.<br><br>Answer: $5 x-2 y=3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b19bf9280d7f9932647", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The perpendicular distance between the lines given by $(x-2 \\mathrm{y}+1)^2+\\mathrm{k}(x-2 \\mathrm{y}+1)=0$ is $\\sqrt{5}$, then $\\mathrm{k}=$", "image": null}, "options": [{"id": "fpER2", "text": "$5$", "image": null, "isCorrect": true}, {"id": "Lm2jB", "text": "$2$", "image": null, "isCorrect": false}, {"id": "6VH6g", "text": "$4$", "image": null, "isCorrect": false}, {"id": "pAkhv", "text": "$6$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $x - 2y + 1 = u$.<br><br>The given equation becomes $u^2 + ku = 0$.<br><br>$u(u + k) = 0 \\Rightarrow u = 0$ or $u = -k$.<br><br>The two lines are $x - 2y + 1 = 0$ and $x - 2y + 1 + k = 0$.<br><br>The perpendicular distance between these parallel lines is given by $d = \\dfrac{|c_1 - c_2|}{\\sqrt{a^2 + b^2}}$.<br><br>$d = \\dfrac{|1 - (1 + k)|}{\\sqrt{1^2 + (-2)^2}} = \\dfrac{|-k|}{\\sqrt{5}} = \\dfrac{|k|}{\\sqrt{5}}$.<br><br>Given that the distance is $\\sqrt{5}$, we have:<br><br>$\\dfrac{|k|}{\\sqrt{5}} = \\sqrt{5}$<br><br>$|k| = 5 \\Rightarrow k = \\pm 5$.<br><br>From the given options, $k = 5$.<br><br>Answer: $5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214500aee93fa0796dfa6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "The co-ordinates of the foot of perpendicular, drawn from the point $(-2,3)$ on the line $3 x-y-1=0$ are", "image": null}, "options": [{"id": "grBHB", "text": "$(-1,2)$", "image": null, "isCorrect": false}, {"id": "RzXJl", "text": "$(1,-2)$", "image": null, "isCorrect": false}, {"id": "0dZna", "text": "$(-1,-2)$", "image": null, "isCorrect": false}, {"id": "uwygf", "text": "$(1,2)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the given point be $P(-2, 3)$ and the given line be $3x - y - 1 = 0$.<br><br>Let $(h, k)$ be the foot of the perpendicular drawn from $P$ to the line. The formula for the foot of the perpendicular is:<br><br>$\\dfrac{h - x_1}{a} = \\dfrac{k - y_1}{b} = -\\dfrac{ax_1 + by_1 + c}{a^2 + b^2}$<br><br>Substituting the values $x_1 = -2$, $y_1 = 3$, $a = 3$, $b = -1$, and $c = -1$:<br><br>$\\dfrac{h - (-2)}{3} = \\dfrac{k - 3}{-1} = -\\dfrac{3(-2) - (3) - 1}{3^2 + (-1)^2}$<br><br>$\\dfrac{h + 2}{3} = \\dfrac{k - 3}{-1} = -\\dfrac{-6 - 3 - 1}{10}$<br><br>$\\dfrac{h + 2}{3} = \\dfrac{k - 3}{-1} = -\\dfrac{-10}{10} = 1$<br><br>Equating each part to $1$:<br><br>$\\dfrac{h + 2}{3} = 1 \\Rightarrow h + 2 = 3 \\Rightarrow h = 1$<br><br>$\\dfrac{k - 3}{-1} = 1 \\Rightarrow k - 3 = -1 \\Rightarrow k = 2$<br><br>The coordinates of the foot of the perpendicular are $(1, 2)$.<br><br>Answer: $(1,2)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213300aee93fa0796d6d3", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "If two lines $x+(a-1) y=1$ and $2 x+\\mathrm{a}^2 y=1(\\mathrm{a} \\in \\mathrm{R}-\\{0,1\\})$ are perpendicular, then the distance of their point of intersection from the origin is", "image": null}, "options": [{"id": "qj44k", "text": "$\\dfrac{2}{5}$", "image": null, "isCorrect": false}, {"id": "PKexv", "text": "$\\dfrac{\\sqrt{2}}{5}$", "image": null, "isCorrect": false}, {"id": "4NtpZ", "text": "$\\dfrac{2}{\\sqrt{5}}$", "image": null, "isCorrect": false}, {"id": "mULBh", "text": "$\\sqrt{\\dfrac{2}{5}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given lines are $x + (a-1)y = 1$ and $2x + a^2 y = 1$.<br><br>The slope of the first line is $m_1 = -\\dfrac{1}{a-1}$ and the slope of the second line is $m_2 = -\\dfrac{2}{a^2}$.<br><br>Since the lines are perpendicular, $m_1 m_2 = -1$.<br><br>$\\left(-\\dfrac{1}{a-1}\\right) \\left(-\\dfrac{2}{a^2}\\right) = -1$<br><br>$\\dfrac{2}{a^2(a-1)} = -1$<br><br>$a^3 - a^2 + 2 = 0$<br><br>$(a+1)(a^2 - 2a + 2) = 0$<br><br>Since $a \\in \\mathbb{R}$, the only real root is $a = -1$.<br><br>Substituting $a = -1$ into the equations of the lines, we get:<br><br>$x - 2y = 1$<br><br>$2x + y = 1$<br><br>Solving these two equations, we multiply the second equation by $2$ and add it to the first equation:<br><br>$x - 2y + 4x + 2y = 1 + 2$<br><br>$5x = 3 \\Rightarrow x = \\dfrac{3}{5}$<br><br>Substituting $x = \\dfrac{3}{5}$ into $2x + y = 1$ gives $y = -\\dfrac{1}{5}$.<br><br>The point of intersection is $\\left(\\dfrac{3}{5}, -\\dfrac{1}{5}\\right)$.<br><br>The distance of this point from the origin is:<br><br>$d = \\sqrt{\\left(\\dfrac{3}{5}\\right)^2 + \\left(-\\dfrac{1}{5}\\right)^2} = \\sqrt{\\dfrac{9}{25} + \\dfrac{1}{25}} = \\sqrt{\\dfrac{10}{25}} = \\sqrt{\\dfrac{2}{5}}$<br><br>Answer: $\\sqrt{\\dfrac{2}{5}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262280279619d9d8a3241", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "The co-ordinates of the points on the line $2 x-y=5$ which are the distance of 1 unit from the line $3 x+4 y=5$ are", "image": null}, "options": [{"id": "YJ9tq", "text": "$\\left(\\frac{30}{11}, \\frac{-5}{11}\\right),\\left(\\frac{20}{11}, \\frac{15}{11}\\right)$", "image": null, "isCorrect": false}, {"id": "D1kBr", "text": "$\\left(\\frac{-30}{11}, \\frac{5}{11}\\right),\\left(\\frac{-20}{11}, \\frac{15}{11}\\right)$", "image": null, "isCorrect": false}, {"id": "97aDE", "text": "$\\left(\\frac{30}{11}, \\frac{5}{11}\\right),\\left(\\frac{20}{11}, \\frac{-15}{11}\\right)$", "image": null, "isCorrect": true}, {"id": "JSxfx", "text": "$\\left(\\frac{-30}{11}, \\frac{5}{11}\\right),\\left(\\frac{-20}{11}, \\frac{-15}{11}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\left(x_1, y_1\\right)$ be the required point\n$\\therefore \\quad 2 x_1-y_1=5$\nAlso, $\\left(x_1, y_1\\right)$ is at the distance of 1 unit from line $3 x+4 y=5$\n$$\n\\begin{array}{ll}\n\\therefore & 1=\\left|\\frac{3 x_1+4 y_1-5}{\\sqrt{9+16}}\\right| \\\\\n\\therefore & \\pm 5=3 x_1+4 y_1-5 \\\\\n\\therefore & 3 x_1+4 y_1-5=5 \\quad \\text { or } 3 x_1+4 y_1-5=-5 \\\\\n\\therefore & 3 x_1+4 y_1=10 \\\\\n& \\text { or } \\\\\n& 3 x_1+4 y_1=0\n\\end{array}\n$$\nSolving equations (i) and (ii), we get $x_1=\\frac{30}{11}$ and $y_1=\\frac{5}{11}$\nSolving equation (i) and (iii), we get $x_1=\\frac{20}{11}$ and $y_1=\\frac{-15}{11}$\n$\\therefore \\quad\\left(\\frac{30}{11}, \\frac{5}{11}\\right)$ and $\\left(\\frac{20}{11}, \\frac{-15}{11}\\right)$ are the required points.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261de0279619d9d8a2ffb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "The co-ordinates of the point, where the line through $\\mathrm{A}(3,4,1)$ and $\\mathrm{B}(5,1,6)$ crosses the $\\mathrm{XZ}$-plane, are", "image": null}, "options": [{"id": "VXQRe", "text": "$\\left(\\frac{11}{3}, 0, \\frac{21}{3}\\right)$", "image": null, "isCorrect": false}, {"id": "WBi3k", "text": "$\\left(\\frac{17}{3}, 0, \\frac{23}{3}\\right)$", "image": null, "isCorrect": true}, {"id": "AbDvq", "text": "$\\left(\\frac{-11}{3}, 0, \\frac{21}{3}\\right)$", "image": null, "isCorrect": false}, {"id": "UdxWD", "text": "$\\left(\\frac{17}{3}, 0, \\frac{-23}{3}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\mathrm{A}\\left(x_1, y_1, \\mathrm{z}_1\\right)=\\mathrm{A}(3,4,1)$ and\n$\\mathrm{B}\\left(x_2, y_2, z_2\\right)=\\mathrm{B}(5,1,6)$\nThe equation of the line passing through the - points $\\left(x_1^1, y_1, z_1\\right)$ and $\\left(x_2, y_2, z_2\\right)$ is given by\n$\\begin{aligned}\n& \\therefore \\quad \\frac{x-x_1}{x_2-x_1}=\\frac{y-y_1}{y_2-y_1}=\\frac{z-z_1}{z_2-z_1} \\\\\n& \\therefore \\quad \\frac{x-3}{5-3}=\\frac{y-4}{1-4}=\\frac{z-1^1}{6-1} \\\\\n& \\therefore \\quad \\frac{x-3}{2}=\\frac{y-4}{-3}=\\frac{z-1}{5}\n\\end{aligned}$\nSince the line crosses the $\\mathrm{XZ}$ plane, $y=0$\n$\\begin{aligned}\n\\therefore \\quad & \\frac{x-3}{2}=\\frac{4}{3}=\\frac{z-1}{5} \\\\\n\\therefore \\quad \\frac{x-3}{2} & =\\frac{4}{3} \\text { and } \\frac{z-1}{5}=\\frac{4}{3} \\\\\n\\Rightarrow x & =\\frac{17}{3} \\text { and } \\mathrm{z}=\\frac{23}{3}\n\\end{aligned}$\n$\\therefore \\quad$ The required point is $\\left(\\frac{17}{3}, 0, \\frac{23}{3}\\right)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c70279619d9d8a2f46", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "The equation of a line, whose perpendicular distance from the origin is 7 units and the angle, which the perpendicular to the line from the origin makes, is $120^{\\circ}$ with positive $\\mathrm{X}$-axis, is", "image": null}, "options": [{"id": "zArjQ", "text": "$x+\\sqrt{3} y-14=0$", "image": null, "isCorrect": false}, {"id": "f5H8M", "text": "$x+\\sqrt{3} y+14=0$", "image": null, "isCorrect": false}, {"id": "EWqGw", "text": "$x-\\sqrt{3} y+14=0$", "image": null, "isCorrect": true}, {"id": "dhxoE", "text": "$x-\\sqrt{3} y-14=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Normal form of the equation of line is\n$\\begin{array}{ll} & x \\cos \\alpha+y \\sin \\alpha=\\mathrm{p} \\\\ & \\text { Here, } \\alpha=120^{\\circ} \\text { and } \\mathrm{p}=7 \\\\ \\therefore \\quad & x \\cos 120^{\\circ}+y \\sin 120^{\\circ}=7 \\\\ \\therefore \\quad & x\\left(\\frac{-1}{2}\\right)+y\\left(\\frac{\\sqrt{3}}{2}\\right)=7 \\\\ \\therefore \\quad & \\frac{-x+\\sqrt{3} y}{2}=7 \\\\ \\therefore \\quad & -x+\\sqrt{3} y=14 \\\\ \\therefore \\quad & -x+\\sqrt{3} y-14=0 \\\\ \\therefore \\quad & x-\\sqrt{3} y+14=0\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b80279619d9d8a2ed0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "The distance of a point $(2,5)$ from the line $3 x+y+4=0$ measured along the line $\\mathrm{L}_1$ and $\\mathrm{L}_2$ are same. If slope of line $L_1$ is $\\frac{3}{4}$, then slope of the line $\\mathrm{L}_2$ is", "image": null}, "options": [{"id": "DXbI1", "text": "$\\frac {-3}{4}$", "image": null, "isCorrect": false}, {"id": "Sd9Jc", "text": "$\\frac {1}{3}$", "image": null, "isCorrect": false}, {"id": "qkCBU", "text": "$\\frac {1}{4}$", "image": null, "isCorrect": false}, {"id": "7J7Zy", "text": "$0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/RHVpPUrP2vueL9jupEvqrUMxtIu9S6inZy3z2ywXAtw.original.fullsize.png\"><br>\nAccording to the given condition, in $\\triangle \\mathrm{ABC}$, $\\mathrm{AB}=\\mathrm{AC}$.\n$\\therefore \\quad \\triangle \\mathrm{ABC}$ is an isosceles triangle.\nLet $\\mathrm{m}, \\mathrm{m}_1, \\mathrm{~m}_2$ be the slopes of given line, $\\mathrm{L}_1$ and $\\mathrm{L}_2$ respectively.\n$\\begin{array}{ll}\n\\therefore & \\mathrm{m}=-3, \\mathrm{~m}_1=\\frac{3}{4} \\\\\n\\therefore & \\left|\\frac{\\mathrm{m}-\\mathrm{m}_1}{1+\\mathrm{mm}_1}\\right|=\\left|\\frac{\\mathrm{m}-\\mathrm{m}_2}{1+\\mathrm{mm}_2}\\right| \\\\\n\\therefore & 3=\\left|\\frac{-3-\\mathrm{m}_2}{1+3 \\mathrm{~m}_2}\\right| \\\\\n& \\Rightarrow \\mathrm{m}_2=0\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b70279619d9d8a2ec8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "If the distance between the parallel lines given by the equation $x^2+4 x y+\\mathrm{p} y^2+3 x+\\mathrm{q} y-4=0$ is $\\lambda$, then $\\lambda^2=$", "image": null}, "options": [{"id": "MDSAI", "text": "$5$", "image": null, "isCorrect": true}, {"id": "Sp710", "text": "$\\sqrt{5}$", "image": null, "isCorrect": false}, {"id": "hPafT", "text": "$25$", "image": null, "isCorrect": false}, {"id": "7NgVH", "text": "$\\frac {9}{5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation is\n$\\begin{aligned}\n& x^2+4 x y+4 y^2+3 x+6 y-4=0 \\\\\n& (x+2 y)^2+3(x+2 y)-4=0 \\\\\n& (x+2 y+4)(x+2 y-1)=0\n\\end{aligned}$\n$\\therefore \\quad$ The lines are: $x+2 y+4=0$ and $x+2 y-1=0$\n$\\begin{aligned}\n\\therefore \\quad \\text { Required distance } & =\\frac{|4-(-1)|}{\\sqrt{1+4}} \\\\\n& =\\frac{5}{\\sqrt{5}}=\\sqrt{5} \\text { units }\n\\end{aligned}\n$\n$\\lambda=\\sqrt{5}$ units\n$\\lambda^2=5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2616c0279619d9d8a2c70", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "The co-ordinates of point on the line $x+y+3=0$, whose distance from the line $x+2 y+2=0$ is $\\sqrt{5}$ units, are", "image": null}, "options": [{"id": "FkqP7", "text": "(-1,-4)", "image": null, "isCorrect": false}, {"id": "2WMxq", "text": "(1,-4)", "image": null, "isCorrect": true}, {"id": "32sWk", "text": "(-1,4)", "image": null, "isCorrect": false}, {"id": "WwE2E", "text": "(1,4)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Any point on the line $x+y+3=0$ can be taken as $(k,-3-k)$ Now, its distance from $x+2 y+2=0$ is\n$\\begin{aligned}\n& \\frac{|k+2 \\times(-3-k)+2|}{\\sqrt{1^2+2^2}}=\\sqrt{5} \\\\\n& \\Rightarrow 1-k-41=5 \\\\\n& \\Rightarrow-k-4= \\pm 5 \\\\\n& \\Rightarrow k=1,-9\n\\end{aligned}$\nfor $k=1$ the point is $(1,-4)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2610e0279619d9d8a2970", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "The co-ordinates of the foot of the perpendicular from the point $(1,2)$ on the line $x-3 y+7=0$ are", "image": null}, "options": [{"id": "XTxA9", "text": "$\\left(\\frac{4}{5}, \\frac{13}{5}\\right)$", "image": null, "isCorrect": true}, {"id": "O2bbU", "text": "$(-13,-2)$", "image": null, "isCorrect": false}, {"id": "tE0oj", "text": "$\\left(\\frac{-13}{5}, \\frac{-2}{5}\\right)$", "image": null, "isCorrect": false}, {"id": "4rkEc", "text": "$(2,3)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\frac{x-1}{1}=\\frac{y-2}{-3}=\\frac{-(1-3 \\times 2+7)}{1^2+(-3)^2} \\\\ & \\Rightarrow \\frac{x-1}{1}=\\frac{y-2}{-3}=\\frac{-2}{10} \\\\ & \\Rightarrow x=\\frac{4}{5} \\text { and } y=\\frac{13}{5} \\\\ & \\Rightarrow\\left(\\frac{4}{5}, \\frac{13}{5}\\right)\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c60279619d9d8a2734", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "The distance between the lines $3 x+4 y=9$ and $6 x+8 y=15$ is", "image": null}, "options": [{"id": "7maXI", "text": "5 units", "image": null, "isCorrect": false}, {"id": "fBO1H", "text": "3 units", "image": null, "isCorrect": false}, {"id": "cwd48", "text": "0.3 units", "image": null, "isCorrect": true}, {"id": "DzaeW", "text": "0.5 units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Distance between the lines $=\\frac{|18-15|}{\\sqrt{(6)^2+(8)^2}}=\\frac{3}{10}=0.3$ units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2601c0279619d9d8a21d2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "If $p_{1}$ and $p_{2}$ are the lengths of perendiculars from the origin to the lines\n$x \\sin \\theta+y \\cos \\theta=5 \\cos 2 \\theta$ and $x \\operatorname{cosec} \\theta+y \\sec \\theta-5=0$ respectively, then\n$p_{1}^{2}+4 p_{2}^{2}=$", "image": null}, "options": [{"id": "b8RSN", "text": "$\\frac{1}{25}$", "image": null, "isCorrect": false}, {"id": "YyAJy", "text": "$\\frac{1}{5}$", "image": null, "isCorrect": false}, {"id": "RzEs9", "text": "25", "image": null, "isCorrect": true}, {"id": "xYi9l", "text": "5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "As per condition given, we write\n$$\n\\begin{aligned}\n\\mathrm{p}_{1} &=\\frac{|-5 \\cos 2 \\theta|}{\\sqrt{\\sin ^{2} \\theta+\\cos ^{2} \\theta}} \\text { and } p_{2}=\\frac{|-5|}{\\sqrt{\\operatorname{cosec}^{2} \\theta+\\sec ^{2} \\theta}} \\\\\n\\therefore \\mathrm{p}_{1}^{2}=\\frac{25 \\cos ^{2} 2 \\theta}{1} \\text { and } 4 \\mathrm{p}_{2}^{2} &=\\frac{4(25)}{\\operatorname{cosec}^{2} \\theta+\\sec ^{2} \\theta} \\\\\n\\therefore \\mathrm{p}_{1}^{2}+4 \\mathrm{p}_{2}^{2} &=25\\left(\\cos ^{2} \\theta-\\sin ^{2} \\theta\\right)^{2}+\\frac{100}{\\left(\\frac{1}{\\sin ^{2} \\theta}\\right)+\\frac{1}{\\cos ^{2} \\theta}} \\\\\n&=25(\\cos \\theta-\\sin \\theta)^{2}(\\cos \\theta+\\sin \\theta)^{2}+100 \\sin ^{2} \\theta \\cos ^{2} \\theta \\\\\n&=25(1-\\sin 2 \\theta)(1+\\sin 2 \\theta)+25\\left(4 \\sin ^{2} \\theta \\cos ^{2} \\theta\\right) \\\\\n&=25\\left(1-\\sin 2 \\theta+\\sin 2 \\theta-\\sin ^{2} 2 \\theta\\right)+25(2 \\sin \\theta \\cos \\theta)^{2} \\\\\n&=25\\left(1-\\sin ^{2} 2 \\theta\\right)+25(\\sin 2 \\theta)^{2} \\\\\n&=25\\left(\\cos ^{2} 2 \\theta\\right)+25\\left(\\sin ^{2} 2 \\theta\\right)=25\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fe30279619d9d8a200a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "If the length of perpendicular drawn from the point $(4,1)$ on the line $3 x-4 y+k=0$\nis 2 units, then the values of $\\mathrm{k}$ are", "image": null}, "options": [{"id": "U0zFe", "text": "$2,-18$", "image": null, "isCorrect": true}, {"id": "TFmGl", "text": "$-2,-18$", "image": null, "isCorrect": false}, {"id": "LmIIW", "text": "$-2,1$", "image": null, "isCorrect": false}, {"id": "wjYaj", "text": "$-2,18$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\nWe have, point $(4,1)$ and $3 x-4 y+k=0$\n$\\begin{array}{l}\n\\therefore\\left|\\frac{3 \\times 4-4 \\times 1+k}{\\sqrt{9+16}}\\right|=2 \\Rightarrow\\left|\\frac{12-4+k}{\\sqrt{25}}\\right|=2 \\\\\n8+k \\mid=10 \\Rightarrow \\pm(8+k)=10 \\\\\n8+k=10 \\text { or }-8-k=10 \\Rightarrow k=2 \\text { or } k=-18\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f750279619d9d8a1c9f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "The length of the perpendicular from the point $P(a, b)$ to the line $\\frac{x}{a}+\\frac{y}{b}=1$ is", "image": null}, "options": [{"id": "y7hvA", "text": "$\\mid \\frac{\\sqrt{a^{2}+b^{2}}}{a b}$ units", "image": null, "isCorrect": false}, {"id": "WiW2I", "text": "$\\left|\\frac{a b}{\\sqrt{a^{2}+b^{2}}}\\right|$ units", "image": null, "isCorrect": true}, {"id": "km6K1", "text": "$\\left|\\frac{b^{2}}{\\sqrt{a^{2}+b^{2}}}\\right|$ units", "image": null, "isCorrect": false}, {"id": "va6ay", "text": "$\\left|\\frac{a^{2}}{\\sqrt{a^{2}+b^{2}}}\\right|$ units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have line $b x+a y-a b=0$\nLength of $\\perp e r$ from $P(a, b)$ on the given line is\n$$\n\\left|\\frac{b a+a b-a b}{\\sqrt{b^{2}+a^{2}}}\\right|=\\left|\\frac{a b}{\\sqrt{a^{2}+b^{2}}}\\right|\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "65a2633f0279619d9d8a3d6f", "title": "Concurrency & Family of Lines", "totalQuestions": 11, "questions": [{"_id": "6abb884515a9fc0fc8c1421e", "type": "singleCorrect", "question": {"text": "The equation of the line which passes through the point of intersection of lines $x + 2y + 6 = 0$, $2x - y = 2$ and which makes intercept 5 on Y - axis is", "image": null}, "options": [{"id": "MXsOJ", "label": "A", "text": "$39x - 2y + 10 = 0$", "isCorrect": true, "image": null}, {"id": "kheyP", "label": "B", "text": "$39x + 2y + 10 = 0$", "isCorrect": false, "image": null}, {"id": "ckBcq", "label": "C", "text": "$39x + 2y - 10 = 0$", "isCorrect": false, "image": null}, {"id": "90e6f", "label": "D", "text": "$39x - 2y - 10 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given lines are $x + 2y + 6 = 0$ and $2x - y - 2 = 0$.<br><br>Solving these two equations, we multiply the second equation by 2 and add it to the first equation:<br><br>$x + 2y + 6 + 4x - 2y - 4 = 0$<br><br>$5x + 2 = 0 \\Rightarrow x = -\\dfrac{2}{5}$<br><br>Substituting the value of $x$ in $y = 2x - 2$, we get:<br><br>$y = 2\\left(-\\dfrac{2}{5}\\right) - 2 = -\\dfrac{14}{5}$<br><br>The point of intersection is $\\left(-\\dfrac{2}{5}, -\\dfrac{14}{5}\\right)$.<br><br>The required line makes an intercept of 5 on the Y-axis, which means it passes through the point $(0, 5)$.<br><br>The slope of the line passing through $\\left(-\\dfrac{2}{5}, -\\dfrac{14}{5}\\right)$ and $(0, 5)$ is:<br><br>$m = \\dfrac{5 - \\left(-\\dfrac{14}{5}\\right)}{0 - \\left(-\\dfrac{2}{5}\\right)} = \\dfrac{\\dfrac{39}{5}}{\\dfrac{2}{5}} = \\dfrac{39}{2}$<br><br>Using the slope-intercept form $y = mx + c$, the equation of the line is:<br><br>$y = \\dfrac{39}{2}x + 5$<br><br>Multiplying by 2, we get:<br><br>$2y = 39x + 10$<br><br>$39x - 2y + 10 = 0$<br><br>Answer: $39x - 2y + 10 = 0$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30e8c30a4553e1bdfb4", "type": "singleCorrect", "question": {"text": "The family of straight lines $4ax + 3by + c = 0$ such that $a + b + c = 0$ (where a, b, c are real constants) are concurrent at the point...", "image": null}, "options": [{"id": "6w6HA", "label": "A", "text": "$(4, 3)$", "isCorrect": false, "image": null}, {"id": "JoZRB", "label": "B", "text": "$\\left(\\dfrac{1}{2}, \\dfrac{1}{3}\\right)$", "isCorrect": false, "image": null}, {"id": "NRhSL", "label": "C", "text": "$\\left(\\dfrac{1}{4}, \\dfrac{1}{3}\\right)$", "isCorrect": true, "image": null}, {"id": "pvjUl", "label": "D", "text": "$\\left(\\dfrac{1}{3}, \\dfrac{1}{2}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given the family of straight lines $4ax + 3by + c = 0$ and the condition $a + b + c = 0$.<br><br>Substituting $c = -(a + b)$ into the equation of the line:<br><br>$4ax + 3by - (a + b) = 0$<br><br>$a(4x - 1) + b(3y - 1) = 0$<br><br>For the lines to be concurrent for all values of $a$ and $b$, the coefficients of $a$ and $b$ must be zero.<br><br>$4x - 1 = 0 \\Rightarrow x = \\dfrac{1}{4}$<br><br>$3y - 1 = 0 \\Rightarrow y = \\dfrac{1}{3}$<br><br>The point of concurrency is $\\left(\\dfrac{1}{4}, \\dfrac{1}{3}\\right)$.<br><br>Answer: $\\left(\\dfrac{1}{4}, \\dfrac{1}{3}\\right)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2d78c30a4553e1bdd5c", "type": "singleCorrect", "question": {"text": "The line $(2 + k)x + (1 + k)y = 5 + 7k$ passes through the fixed point for different values of k. If 'd' is the distance of a fixed point from the origin, then $d^2 = \\ldots$", "image": null}, "options": [{"id": "8eRyU", "label": "A", "text": "$29$", "isCorrect": false, "image": null}, {"id": "KmAUl", "label": "B", "text": "$37$", "isCorrect": false, "image": null}, {"id": "AwOJJ", "label": "C", "text": "$65$", "isCorrect": false, "image": null}, {"id": "zUeYj", "label": "D", "text": "$85$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given equation of the line is $(2 + k)x + (1 + k)y = 5 + 7k$.<br><br>Rearranging the terms to express it in the form $L_1 + kL_2 = 0$:<br><br>$2x + kx + y + ky - 5 - 7k = 0$<br><br>$(2x + y - 5) + k(x + y - 7) = 0$<br><br>This represents a family of lines passing through the point of intersection of the lines:<br><br>$2x + y - 5 = 0$<br><br>$x + y - 7 = 0$<br><br>Solving these two equations simultaneously, we subtract the second equation from the first:<br><br>$(2x + y - 5) - (x + y - 7) = 0$<br><br>$x + 2 = 0 \\Rightarrow x = -2$<br><br>Substituting $x = -2$ into the second equation:<br><br>$-2 + y - 7 = 0 \\Rightarrow y = 9$<br><br>The fixed point is $(-2, 9)$.<br><br>The distance $d$ of this fixed point from the origin $(0, 0)$ is given by:<br><br>$d^2 = (-2 - 0)^2 + (9 - 0)^2$<br><br>$d^2 = 4 + 81 = 85$<br><br>Answer: $85$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e68c30a4553e1bde03", "type": "singleCorrect", "question": {"text": "The equation of the line passing through the point of intersection of the lines $x + 2y + 6 = 0$ and $2x - y = 2$ and making an intercept 5 on the y-axis is", "image": null}, "options": [{"id": "tWcMj", "label": "A", "text": "$39x + 2y - 10 = 0$", "isCorrect": false, "image": null}, {"id": "7hmzQ", "label": "B", "text": "$39x - 2y + 10 = 0$", "isCorrect": true, "image": null}, {"id": "qtwtx", "label": "C", "text": "$x + 4y - 20 = 0$", "isCorrect": false, "image": null}, {"id": "EHneR", "label": "D", "text": "$x - 4y + 20 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Solving the given equations $x + 2y + 6 = 0$ and $2x - y = 2$.<br><br>Multiplying the second equation by $2$ and adding to the first gives $5x + 2 = 0 \\Rightarrow x = -\\dfrac{2}{5}$.<br><br>Substituting $x$ in the second equation gives $y = 2\\left(-\\dfrac{2}{5}\\right) - 2 = -\\dfrac{14}{5}$.<br><br>The point of intersection is $\\left(-\\dfrac{2}{5}, -\\dfrac{14}{5}\\right)$.<br><br>The required line makes an intercept of $5$ on the y-axis, so it passes through $(0, 5)$.<br><br>The slope of the line is $m = \\dfrac{5 - \\left(-\\dfrac{14}{5}\\right)}{0 - \\left(-\\dfrac{2}{5}\\right)} = \\dfrac{\\dfrac{39}{5}}{\\dfrac{2}{5}} = \\dfrac{39}{2}$.<br><br>The equation of the line is $y = mx + c \\Rightarrow y = \\dfrac{39}{2}x + 5$.<br><br>Rearranging the terms gives $39x - 2y + 10 = 0$.<br><br>Answer: $39x - 2y + 10 = 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2ba8c30a4553e1bdc30", "type": "singleCorrect", "question": {"text": "The equation of a line passing through the point of the intersection of the lines $x - y + 1 = 0$ and $2x + 3y - 8 = 0$ and having x intercept $3$ is", "image": null}, "options": [{"id": "LcAab", "label": "A", "text": "$x + y + 3 = 0$", "isCorrect": false, "image": null}, {"id": "l9TnN", "label": "B", "text": "$x + y - 3 = 0$", "isCorrect": true, "image": null}, {"id": "IJdmj", "label": "C", "text": "$x - y + 3 = 0$", "isCorrect": false, "image": null}, {"id": "vyER0", "label": "D", "text": "$-x + y - 2 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given lines are:<br><br>$x - y + 1 = 0$<br><br>$2x + 3y - 8 = 0$<br><br>From the first equation, $y = x + 1$. Substituting this into the second equation:<br><br>$2x + 3(x + 1) - 8 = 0$<br><br>$5x - 5 = 0 \\Rightarrow x = 1$<br><br>Substituting $x = 1$ into $y = x + 1$, we get $y = 2$.<br><br>The point of intersection is $(1, 2)$.<br><br>The required line has an x-intercept of $3$, which means it passes through the point $(3, 0)$.<br><br>The equation of the line passing through $(1, 2)$ and $(3, 0)$ is given by:<br><br>$y - 0 = \\dfrac{2 - 0}{1 - 3}(x - 3)$<br><br>$y = -1(x - 3)$<br><br>$x + y - 3 = 0$<br><br>Answer: $x + y - 3 = 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2623c0279619d9d8a32e3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "If $\\mathrm{k}_{\\mathrm{i}}$ are possible values of $\\mathrm{k}$ for which lines $\\mathrm{k} x+2 y+2=0,2 x+\\mathrm{k} y+3=0$ and $3 x+3 y+\\mathrm{k}=0$ are concurrent, then $\\sum \\mathrm{k}_{\\mathrm{i}}$ has the value", "image": null}, "options": [{"id": "A4il8", "text": "$0$", "image": null, "isCorrect": true}, {"id": "dhhdo", "text": "$-2$", "image": null, "isCorrect": false}, {"id": "oLxRY", "text": "$2$", "image": null, "isCorrect": false}, {"id": "t9YRZ", "text": "$5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If three lines $\\mathrm{a}_1 x+\\mathrm{b}_1 y+\\mathrm{c}_1=0$, $\\mathrm{a}_2+\\mathrm{b}_2 y+\\mathrm{c}_2=0$ and $\\mathrm{a}_3 x+\\mathrm{b}_3 y+\\mathrm{c}_3=0$ are\n$$\n\\begin{aligned}\n& \\text { concurrent, then }\\left|\\begin{array}{lll}\na_1 & b_1 & c_1 \\\\\na_2 & b_2 & c_2 \\\\\na_3 & b_3 & c_3\n\\end{array}\\right|=0 \\\\\n& \\Rightarrow\\left|\\begin{array}{lll}\nk & 2 & 2 \\\\\n2 & k & 3 \\\\\n3 & 3 & k\n\\end{array}\\right|=0 \\\\\n& \\Rightarrow k^2\\left(k^2-9\\right)-2(2 k-9)+2(6-3 k)=0 \\\\\n& \\Rightarrow k^3-9 k-4 k+18+12-6 k=0 \\\\\n& \\Rightarrow k^3-19 k+30=0 \\\\\n& \\Rightarrow(k-2)\\left(k^2 42 k-15\\right)=0 \\\\\n& \\Rightarrow(k-2)(k+5)(k-3)=0 \\\\\n& \\Rightarrow k_1=2, k_2=-5 \\text { and } k_3=3 \\\\\n& \\Rightarrow \\sum k_i=0\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261ee0279619d9d8a3076", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "The joint equation of a pair of lines passing through the origin and making an angle of $\\frac{\\pi}{4}$ with the line $3 x+2 y-8=0$ is", "image": null}, "options": [{"id": "tioFk", "text": "$5 x^2+24 x y-5 y^2=0$", "image": null, "isCorrect": true}, {"id": "lmgsz", "text": "$5 x^2-24 x y+5 y^2=0$", "image": null, "isCorrect": false}, {"id": "zYSSq", "text": "$5 x^2-24 x y-5 y^2=0$", "image": null, "isCorrect": false}, {"id": "rBy69", "text": "$5 x^2+24 x y+5 y^2=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The slope of line $3 x+2 y-8=0$ is\n$\\mathrm{m}_1=\\frac{-3}{2}$\nLet $\\mathrm{m}$ be the slope of one of the lines making an angle $\\frac{\\pi}{4}$ with $3 x+2 y-8=0$\n$\\begin{aligned}\n\\therefore \\quad \\tan \\frac{\\pi}{4} & =\\left|\\frac{\\mathrm{m}-\\mathrm{m}_1}{1+\\mathrm{mm}_1}\\right| \\\\\n\\Rightarrow 1 & =\\left|\\frac{\\mathrm{m}-\\left(\\frac{-3}{2}\\right)}{1+\\mathrm{m}\\left(\\frac{-3}{2}\\right)}\\right| \\\\\n\\Rightarrow 1 & =\\left|\\frac{2 \\mathrm{~m}+3}{2-3 \\mathrm{~m}}\\right|\n\\end{aligned}$\nSquaring on both sides, we get\n$\\begin{aligned}\n& (2-3 m)^2=(2 m+3)^2 \\\\\n& \\Rightarrow 5 m^2-24 m-5=0\n\\end{aligned}$\nThis is the auxiliary equation of two lines and their joint equation is obtained by putting\n$\\mathrm{m}=\\frac{y}{x}$\n$\\therefore \\quad$ The joint equation of the lines is\n$\\begin{gathered}\n5\\left(\\frac{y}{x}\\right)^2-24\\left(\\frac{y}{x}\\right)-5=0 \\\\\n\\text { i.e., } 5 x^2+24 x y-5 y^2=0\n\\end{gathered}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261da0279619d9d8a2fdc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "The number of integral values of $p$ in the domain $[-5,5]$, such that the equation $2 x^2+4 x y-\\mathrm{p} y^2+4 x+\\mathrm{q} y+1=0$ represents pair of lines, are", "image": null}, "options": [{"id": "Y1dcX", "text": "3", "image": null, "isCorrect": false}, {"id": "2dmrs", "text": "4", "image": null, "isCorrect": false}, {"id": "umzs4", "text": "7", "image": null, "isCorrect": false}, {"id": "7Q3ZP", "text": "8", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given equation of pair of lines is\n$2 x^2+4 x y-p y^2+4 x+q y+1=0$\nComparing with $\\mathrm{a} x^2+2 \\mathrm{~h} x y+\\mathrm{b} y^2+2 \\mathrm{~g} x+2 \\mathrm{f} y+\\mathrm{c}=0$, we get $\\mathrm{a}=2, \\mathrm{~h}=2, \\mathrm{~b}=-\\mathrm{p}$\nIf the given equation represents a pair of straight lines, then\n$\\begin{aligned}\n& \\mathrm{h}^2 \\geq \\mathrm{ab} \\\\\n& \\Rightarrow 4 \\geq-2 \\mathrm{p} \\\\\n& \\Rightarrow 2 \\geq-\\mathrm{p} \\\\\n& \\Rightarrow \\mathrm{p} \\geq-2\n\\end{aligned}$\n$\\therefore \\quad$ Possible values of $\\mathrm{p}$ from domain $[-5,5]$ are $-2,-1,0,1,2,3,4,5$.\n$\\therefore \\quad$ Number of integral values of $p=8$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261810279619d9d8a2d1b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "Let $a, b, c$ and be non-zero real numbers, if the point of intersection of the lines $4 a x+2 a y+c=0$ and $5 b x+2 b y+d=0$ lies in the $4^{\\text {th }}$ quadrant and is equidistant from the two axes, then", "image": null}, "options": [{"id": "coeJA", "text": "$3 b c+2 a d=0$", "image": null, "isCorrect": false}, {"id": "OxFux", "text": "$2 b c-3 a d=0$", "image": null, "isCorrect": false}, {"id": "TsJRR", "text": "$2 b c+3 a d=0$", "image": null, "isCorrect": false}, {"id": "W7BLL", "text": "$2 a d-3 b c=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { form (i) } \\times b-(\\mathrm{ii}) \\times a \\\\ & \\begin{array}{c}4 a b x+2 a b y+c b=0 \\\\ 5 a b x+2 a b y+a d=0 \\\\ -\\quad-\\quad- \\\\ \\hline-a b x+c b-a d=0 \\\\ \\Rightarrow x=\\frac{c b-a d}{a b}\\end{array}\\end{aligned}$\nPutting value of $x$ in (i) we get $y=\\frac{4 a d-5 c b}{2 a b}$\n$\\begin{aligned} & A / Q x=-y \\\\ & \\Rightarrow \\frac{c b-a d}{a b}=-\\frac{4 a d-5 c b}{2 a b} \\\\ & \\Rightarrow 2 a d-3 b c=0\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261460279619d9d8a2b37", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "If the lines $4 x+3 y-1=0, x-y+5=0$ and $k x+5 y-3=0$ are concurrent, then $k=$", "image": null}, "options": [{"id": "YNtZF", "text": "5", "image": null, "isCorrect": false}, {"id": "b2q93", "text": "6", "image": null, "isCorrect": true}, {"id": "zjwf3", "text": "7", "image": null, "isCorrect": false}, {"id": "bu9eC", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For concurrency $\\left|\\begin{array}{ccc}4 & 3 & -1 \\\\ 1 & -1 & 5 \\\\ k & 5 & -3\\end{array}\\right|=0$\n$\\Rightarrow 4(3-25)+3(5 k+3)-1(5+k)=0$\n$\\Rightarrow-88+15 k+9-5-k=0$\n$\\Rightarrow-84+14 k=0$\n$\\Rightarrow k=6$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f020279619d9d8a190c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}], "question": {"text": "a and b are non-collinear vectors. If <math><mi>c</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mi>a</mi><mo>+</mo><mi>b</mi></math> and <math><mi>d</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mi>x</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mi>a</mi><mo>-</mo><mi>b</mi></math> are collinear vectors, then the value of <math><mi>x</mi><mo>=</mo></math> …", "image": null}, "options": [{"id": "FbR3F", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "s2UZ9", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "6rEAH", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>5</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "jtNAH", "text": "<math><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given, <math><mi>c</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mi>a</mi><mo>+</mo><mi>b</mi></math> and <br/><math><mi>d</mi><mo>=</mo><mfenced separators=\"|\"><mrow><mn>2</mn><mi>x</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mi>a</mi><mo>-</mo><mi>b</mi></math> are collinear <br/><math><mo>∴</mo><mi>c</mi><mo>=</mo><mi>λ</mi><mi>d</mi></math>  <br/><math><mo>&#8658;</mo><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow></mfenced><mi>a</mi><mo>+</mo><mi>b</mi><mo>=</mo><mi>λ</mi><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfenced separators=\"|\"><mrow><mn>2</mn><mi>x</mi><mo>+</mo><mn>1</mn></mrow></mfenced><mi>a</mi><mo>-</mo><mi>b</mi></mrow></mfenced></math>  <br/><math><mo>&#8658;</mo><mfrac><mrow><mi>x</mi><mo>-</mo><mn>2</mn></mrow><mrow><mn>2</mn><mi>x</mi><mo>+</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mo>-</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mi>λ</mi></math>  <br/><math><mo>&#8658;</mo><mn>2</mn><mi>x</mi><mo>+</mo><mn>1</mn><mo>=</mo><mo>-</mo><mi>x</mi><mo>+</mo><mn>2</mn></math>  <br/><math><mo>&#8658;</mo><mn>3</mn><mi>x</mi><mo>=</mo><mn>1</mn></math>  <br/><math><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d0071b5bb33b3f9f64", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 1)", "title": "MHT CET 2019 (Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "65a2633e0279619d9d8a3d6b", "title": "Locus", "totalQuestions": 3, "questions": [{"_id": "65a25fc10279619d9d8a1eff", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "If $x \\cos \\theta+y \\sin \\theta=5, x \\sin \\theta-y \\cos \\theta=3$, then the value of $x^{2}+y^{2}=$", "image": null}, "options": [{"id": "Z7n4i", "text": "17", "image": null, "isCorrect": false}, {"id": "f9kxG", "text": "8", "image": null, "isCorrect": false}, {"id": "0Xi5j", "text": "12", "image": null, "isCorrect": false}, {"id": "JgFt6", "text": "34", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/nJgrot6YPmFkHVSXf8pzHdhN_Kx1gdRovPDfJulAYQQ.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f3d0279619d9d8a1ae0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "The locus of a point of intersection of two lines $x \\sqrt{3}-y=k \\sqrt{3}$ and\n$\\sqrt{3} k x+k y=\\sqrt{3}, k \\in R$, describes", "image": null}, "options": [{"id": "25R8O", "text": "a parabola", "image": null, "isCorrect": false}, {"id": "Bfzqa", "text": "a hyperbola", "image": null, "isCorrect": true}, {"id": "SbLUF", "text": "an ellipse", "image": null, "isCorrect": false}, {"id": "6KX0e", "text": "a pair of lines", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $\\begin{aligned} \\quad x \\sqrt{3}-y &=k \\sqrt{3} ...(1)\\\\ \\sqrt{3} k x+k y &=\\sqrt{3} ...(2) \\end{aligned}$\nWe will equate value of $k$ from eq. (1) and (2)\n$\\begin{aligned} & \\frac{x \\sqrt{3}-y}{\\sqrt{3}}=\\frac{\\sqrt{3}}{\\sqrt{3} x+y} \\\\ \\therefore &(x \\sqrt{3}-y)(x \\sqrt{3}+y)=(\\sqrt{3})(\\sqrt{3}) \\\\ \\therefore & 3 x^{2}-y^{2}=3 \\Rightarrow \\frac{3 x^{2}}{3}-\\frac{y^{2}}{3}=\\frac{3}{3} \\text { i.e. } \\frac{x^{2}}{1}-\\frac{y^{2}}{(\\sqrt{3})^{2}}=1, \\text { which is equation of hyperbola. } \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e6c0279619d9d8a144c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "Locus of the point of intersection of perpendicular tangents to the circle $x^{2}+y^{2}=16$ is", "image": null}, "options": [{"id": "aC5h4", "text": "$x^{2}+y^{2}=8$", "image": null, "isCorrect": false}, {"id": "Ou1oJ", "text": "$x^{2}+y^{2}=32$", "image": null, "isCorrect": true}, {"id": "wHPxD", "text": "$x^{2}+y^{2}=64$", "image": null, "isCorrect": false}, {"id": "dKqLd", "text": "$x^{2}+y^{2}=16$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We know that, if two perpendicular tangents to the circle $x^{2}+y^{2}=a^{2}$ meet at $P$, then the point\n$P$ lies on a director circle. $\\therefore$ Required locus is $x^{2}+y^{2}=32$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 9, "topicId": "679216770aee93fa0796e192", "title": "Angle bisector", "totalQuestions": 2, "questions": [{"_id": "68871b4ebf9280d7f993280d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The joint equation of the bisectors of the angles between the line $x=5$ and $\\mathrm{y}=3$ is", "image": null}, "options": [{"id": "rvUdO", "text": "$x^2-y^2-10 x+6 y+16=0$", "image": null, "isCorrect": true}, {"id": "4ppBI", "text": "$x^2+y^2-10 x-6 y-16=0$", "image": null, "isCorrect": false}, {"id": "2TviJ", "text": "$x^2+y^2+10 x+6 y-16=0$", "image": null, "isCorrect": false}, {"id": "wLJw5", "text": "$x^2+y^2-5 x-2 y-7=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given lines are $x - 5 = 0$ and $y - 3 = 0$.<br><br>The equations of the bisectors of the angles between the lines are given by:<br><br>$\\dfrac{x - 5}{\\sqrt{1^2 + 0^2}} = \\pm \\dfrac{y - 3}{\\sqrt{0^2 + 1^2}}$<br><br>$x - 5 = \\pm (y - 3)$<br><br>The joint equation of the bisectors is:<br><br>$(x - 5)^2 = (y - 3)^2$<br><br>$(x - 5)^2 - (y - 3)^2 = 0$<br><br>$(x^2 - 10x + 25) - (y^2 - 6y + 9) = 0$<br><br>$x^2 - y^2 - 10x + 6y + 16 = 0$<br><br>Answer: $x^2-y^2-10 x+6 y+16=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f10aee93fa0796dcbe", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "Let $P \\equiv(-5,0), Q \\equiv(0,0)$ and $R \\equiv(2,2 \\sqrt{3})$ be three points. Then the equation of the bisector of the angle $P Q R$ is", "image": null}, "options": [{"id": "3t3n1", "text": "$x-\\frac{\\sqrt{3}}{2} y=0$", "image": null, "isCorrect": false}, {"id": "yEcaV", "text": "$\\frac{\\sqrt{3}}{2} x-y=0$", "image": null, "isCorrect": false}, {"id": "D7nvc", "text": "$x+\\sqrt{3} y=0$", "image": null, "isCorrect": false}, {"id": "CUpDU", "text": "$\\sqrt{3} x+y=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The coordinates of the given points are $P(-5,0)$, $Q(0,0)$, and $R(2,2\\sqrt{3})$.<br><br>The angle bisector of $\\angle PQR$ passes through the origin $Q(0,0)$. The direction of the angle bisector is along the sum of the unit vectors of $\\overrightarrow{QP}$ and $\\overrightarrow{QR}$.<br><br>The vector $\\overrightarrow{QP} = -5\\hat{i}$.<br>The unit vector along $\\overrightarrow{QP}$ is $\\hat{n}_1 = -\\hat{i}$.<br><br>The vector $\\overrightarrow{QR} = 2\\hat{i} + 2\\sqrt{3}\\hat{j}$.<br>The magnitude of $\\overrightarrow{QR}$ is $\\sqrt{2^2 + (2\\sqrt{3})^2} = \\sqrt{4 + 12} = 4$.<br>The unit vector along $\\overrightarrow{QR}$ is $\\hat{n}_2 = \\dfrac{2\\hat{i} + 2\\sqrt{3}\\hat{j}}{4} = \\dfrac{1}{2}\\hat{i} + \\dfrac{\\sqrt{3}}{2}\\hat{j}$.<br><br>The vector along the angle bisector of $\\angle PQR$ is given by:<br>$\\hat{n}_1 + \\hat{n}_2 = -\\hat{i} + \\dfrac{1}{2}\\hat{i} + \\dfrac{\\sqrt{3}}{2}\\hat{j} = -\\dfrac{1}{2}\\hat{i} + \\dfrac{\\sqrt{3}}{2}\\hat{j}$<br><br>The slope of the angle bisector is $m = \\dfrac{\\dfrac{\\sqrt{3}}{2}}{-\\dfrac{1}{2}} = -\\sqrt{3}$.<br><br>The equation of the angle bisector passing through $Q(0,0)$ is:<br>$y - 0 = -\\sqrt{3}(x - 0)$<br><br>$\\sqrt{3}x + y = 0$<br><br>Answer: $\\sqrt{3} x+y=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
