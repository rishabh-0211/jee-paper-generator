xt": "$\\dfrac{1}{54\\pi}\\ \\text{cm}/\\text{min}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $r$ be the radius of the iron ball and $x$ be the thickness of the ice.<br><br>Given $r = 10$ cm.<br><br>The volume of the ice is $V = \\dfrac{4}{3}\\pi (r+x)^3 - \\dfrac{4}{3}\\pi r^3$.<br><br>Differentiating with respect to time $t$:<br><br>$\\dfrac{dV}{dt} = 4\\pi (r+x)^2 \\dfrac{dx}{dt}$<br><br>Given that the ice melts at a rate of $50\\ \\text{cm}^3/\\text{min}$, we have $\\dfrac{dV}{dt} = -50$.<br><br>When $x = 5$ cm, $r+x = 10 + 5 = 15$ cm.<br><br>Substituting the values:<br><br>$-50 = 4\\pi (15)^2 \\dfrac{dx}{dt}$<br><br>$-50 = 900\\pi \\dfrac{dx}{dt}$<br><br>$\\dfrac{dx}{dt} = -\\dfrac{50}{900\\pi} = -\\dfrac{1}{18\\pi}\\ \\text{cm}/\\text{min}$<br><br>The rate at which the thickness of ice decreases is $\\dfrac{1}{18\\pi}\\ \\text{cm}/\\text{min}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3118c30a4553e1bdfd5", "type": "singleCorrect", "question": {"text": "If the rate of increase of surface area of a spherical balloon is $5\\,\\text{cm}^2/\\text{sec}$ and rate of increase of volume of a spherical balloon is $10\\,\\text{cm}^3/\\text{sec}$, then the radius of the balloon at that time is...", "image": null}, "options": [{"id": "uSI1J", "label": "A", "text": "$3$ cm", "isCorrect": false, "image": null}, {"id": "WltFJ", "label": "B", "text": "$5$ cm", "isCorrect": false, "image": null}, {"id": "uYyOF", "label": "C", "text": "$6$ cm", "isCorrect": false, "image": null}, {"id": "pa4Bb", "label": "D", "text": "$4$ cm", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $r$ be the radius, $S$ be the surface area, and $V$ be the volume of the spherical balloon.<br><br>$S = 4\\pi r^2$<br><br>Differentiating with respect to time $t$:<br><br>$\\dfrac{dS}{dt} = 8\\pi r \\dfrac{dr}{dt} = 5$<br><br>$V = \\dfrac{4}{3}\\pi r^3$<br><br>Differentiating with respect to time $t$:<br><br>$\\dfrac{dV}{dt} = 4\\pi r^2 \\dfrac{dr}{dt} = 10$<br><br>Dividing $\\dfrac{dV}{dt}$ by $\\dfrac{dS}{dt}$:<br><br>$\\dfrac{4\\pi r^2 \\dfrac{dr}{dt}}{8\\pi r \\dfrac{dr}{dt}} = \\dfrac{10}{5}$<br><br>$\\dfrac{r}{2} = 2$<br><br>$r = 4$ cm<br><br>Answer: $4$ cm", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3048c30a4553e1bdf40", "type": "singleCorrect", "question": {"text": "A particle is fired straight up from the ground. Its height in feet after $t$ second is given by $s(t) = 128t - 16t^2$. The velocity of the particle when it hits the ground is...", "image": null}, "options": [{"id": "rtKSK", "label": "A", "text": "$-128$ ft/sec", "isCorrect": true, "image": null}, {"id": "xcNsI", "label": "B", "text": "$128$ ft/sec", "isCorrect": false, "image": null}, {"id": "InFEE", "label": "C", "text": "$0$ ft/sec", "isCorrect": false, "image": null}, {"id": "BPLPe", "label": "D", "text": "$256$ ft/sec", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The height of the particle is given by $s(t) = 128t - 16t^2$.<br><br>The particle hits the ground when $s(t) = 0$.<br><br>$128t - 16t^2 = 0$<br><br>$16t(8 - t) = 0$<br><br>This gives $t = 0$ or $t = 8$. The particle hits the ground at $t = 8$ seconds.<br><br>The velocity of the particle is given by the derivative of the position function:<br><br>$v(t) = \\dfrac{ds}{dt} = 128 - 32t$<br><br>Substituting $t = 8$ into the velocity equation:<br><br>$v(8) = 128 - 32(8) = 128 - 256 = -128$ ft/sec.<br><br>Answer: $-128$ ft/sec", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f68c30a4553e1bdea9", "type": "singleCorrect", "question": {"text": "If a particle moves such that the displacement (s) is proportional to the square of the velocity (v), then its acceleration (a) is", "image": null}, "options": [{"id": "CZFV5", "label": "A", "text": "proportional to $s^2$", "isCorrect": false, "image": null}, {"id": "2b1wm", "label": "B", "text": "proportional to $1/s$", "isCorrect": false, "image": null}, {"id": "5ZjL5", "label": "C", "text": "proportional to $1/s^2$", "isCorrect": false, "image": null}, {"id": "U8uRG", "label": "D", "text": "a constant", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $s \\propto v^2$<br><br>$s = k v^2$ where $k$ is a constant.<br><br>Differentiating both sides with respect to time $t$:<br><br>$\\dfrac{ds}{dt} = 2kv \\dfrac{dv}{dt}$<br><br>Since $\\dfrac{ds}{dt} = v$ and $\\dfrac{dv}{dt} = a$:<br><br>$v = 2kv a$<br><br>$a = \\dfrac{1}{2k}$<br><br>Since $k$ is a constant, acceleration $a$ is a constant.<br><br>Answer: a constant", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32d8c30a4553e1be101", "type": "singleCorrect", "question": {"text": "If the side of an equilateral triangle increases at the rate of $\\sqrt{3}\\ \\text{cm/sec}$, then the rate of change of increase of its area when the side is $12\\ \\text{cm}$ is ____", "image": null}, "options": [{"id": "As8Rs", "label": "A", "text": "$18\\ \\text{cm}^2/\\text{sec}$", "isCorrect": true, "image": null}, {"id": "2n7Ub", "label": "B", "text": "$10\\ \\text{cm}^2/\\text{sec}$", "isCorrect": false, "image": null}, {"id": "Ylc7Z", "label": "C", "text": "$12\\ \\text{cm}^2/\\text{sec}$", "isCorrect": false, "image": null}, {"id": "LkbHT", "label": "D", "text": "$3\\sqrt{3}\\ \\text{cm}^2/\\text{sec}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the side of the equilateral triangle be $a$ and its area be $A$.<br><br>Given $\\dfrac{da}{dt} = \\sqrt{3}\\ \\text{cm/sec}$ and $a = 12\\ \\text{cm}$.<br><br>The area of an equilateral triangle is given by $A = \\dfrac{\\sqrt{3}}{4}a^2$.<br><br>Differentiating with respect to time $t$:<br><br>$\\dfrac{dA}{dt} = \\dfrac{\\sqrt{3}}{4} \\times 2a \\times \\dfrac{da}{dt}$<br><br>$\\dfrac{dA}{dt} = \\dfrac{\\sqrt{3}}{2}a \\dfrac{da}{dt}$<br><br>Substituting the given values:<br><br>$\\dfrac{dA}{dt} = \\dfrac{\\sqrt{3}}{2} \\times 12 \\times \\sqrt{3}$<br><br>$\\dfrac{dA}{dt} = 6 \\times 3 = 18\\ \\text{cm}^2/\\text{sec}$<br><br>Answer: $18\\ \\text{cm}^2/\\text{sec}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2da8c30a4553e1bdd7e", "type": "singleCorrect", "question": {"text": "A spherical snow ball is melting so that its volume is decreasing at the rate of 8 c.c./sec then the rate of change of radius when the radius is 2 cm, is :", "image": null}, "options": [{"id": "Z3k4t", "label": "A", "text": "The radius is increasing at the rate of $\\dfrac{1}{2\\pi}\\ \\text{cm/s}$", "isCorrect": false, "image": null}, {"id": "pkmVa", "label": "B", "text": "The radius is decreasing at the rate of $\\dfrac{1}{2\\pi}\\ \\text{cm/s}$", "isCorrect": true, "image": null}, {"id": "IMT4k", "label": "C", "text": "The radius is increasing at the rate of $\\dfrac{1}{\\pi}\\ \\text{cm/s}$", "isCorrect": false, "image": null}, {"id": "laNzK", "label": "D", "text": "The radius is decreasing at the rate of $\\dfrac{1}{\\pi}\\ \\text{cm/s}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $V$ be the volume and $r$ be the radius of the spherical snowball.<br><br>$V = \\dfrac{4}{3}\\pi r^3$<br><br>Differentiating with respect to time $t$:<br><br>$\\dfrac{dV}{dt} = 4\\pi r^2 \\dfrac{dr}{dt}$<br><br>Given that the volume is decreasing at the rate of $8$ c.c./sec, $\\dfrac{dV}{dt} = -8$ cm$^3$/sec.<br><br>Substituting $r = 2$ cm and $\\dfrac{dV}{dt} = -8$:<br><br>$-8 = 4\\pi (2)^2 \\dfrac{dr}{dt}$<br><br>$-8 = 16\\pi \\dfrac{dr}{dt}$<br><br>$\\dfrac{dr}{dt} = -\\dfrac{1}{2\\pi}$ cm/sec<br><br>The negative sign indicates that the radius is decreasing at the rate of $\\dfrac{1}{2\\pi}$ cm/s.<br><br>Answer: The radius is decreasing at the rate of $\\dfrac{1}{2\\pi}\\ \\text{cm/s}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33c8c30a4553e1be19b", "type": "singleCorrect", "question": {"text": "A triangle has two fixed vertices A $(a, 0)$ and B$(0, b)$ . Let its third vertex C is moving along the line $x = y$. If $s$ is the area of triangle ABC, then $\\dfrac{ds}{dx} =$", "image": null}, "options": [{"id": "Hxvjw", "label": "A", "text": "$a + b$", "isCorrect": false, "image": null}, {"id": "PE51g", "label": "B", "text": "$-\\left(\\dfrac{a + b}{2}\\right)$", "isCorrect": true, "image": null}, {"id": "MDx9C", "label": "C", "text": "$\\dfrac{a - b}{2}$", "isCorrect": false, "image": null}, {"id": "bplRs", "label": "D", "text": "$\\dfrac{a}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the coordinates of the vertices of the triangle be $A(a, 0)$, $B(0, b)$, and $C(x, x)$ since $C$ lies on the line $y = x$.<br><br>The area of the triangle $s$ is given by the determinant formula:<br><br>$s = \\dfrac{1}{2} \\begin{vmatrix} a & 0 & 1 \\\\ 0 & b & 1 \\\\ x & x & 1 \\end{vmatrix}$<br><br>Expanding the determinant along the first row:<br><br>$s = \\dfrac{1}{2} [a(b - x) - 0 + 1(0 - bx)]$<br><br>$s = \\dfrac{1}{2} (ab - ax - bx)$<br><br>$s = \\dfrac{1}{2} [ab - (a + b)x]$<br><br>Differentiating $s$ with respect to $x$:<br><br>$\\dfrac{ds}{dx} = \\dfrac{d}{dx} \\left[ \\dfrac{1}{2} (ab - (a + b)x) \\right]$<br><br>$\\dfrac{ds}{dx} = -\\left(\\dfrac{a + b}{2}\\right)$<br><br>Answer: $-\\left(\\dfrac{a + b}{2}\\right)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e88c30a4553e1bde1c", "type": "singleCorrect", "question": {"text": "The surface area of a spherical ball is increasing at the rate of $4\\pi\\ \\text{cm}^2$/second. The rate at which the radius is increasing when the surface area is $16\\pi\\ \\text{cm}^2$ is", "image": null}, "options": [{"id": "VAlzQ", "label": "A", "text": "$0.5$ cm/second", "isCorrect": false, "image": null}, {"id": "yk9sw", "label": "B", "text": "$0.25$ cm/second", "isCorrect": true, "image": null}, {"id": "j68V4", "label": "C", "text": "$0.125$ cm/second", "isCorrect": false, "image": null}, {"id": "jJe0i", "label": "D", "text": "$1$ cm/second", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $S$ be the surface area and $r$ be the radius of the spherical ball.<br><br>$S = 4\\pi r^2$<br><br>Differentiating with respect to time $t$:<br><br>$\\dfrac{dS}{dt} = 8\\pi r \\dfrac{dr}{dt}$<br><br>Given $\\dfrac{dS}{dt} = 4\\pi$ cm$^2$/s.<br><br>When $S = 16\\pi$ cm$^2$:<br><br>$4\\pi r^2 = 16\\pi \\Rightarrow r^2 = 4 \\Rightarrow r = 2$ cm.<br><br>Substituting the values into the derivative equation:<br><br>$4\\pi = 8\\pi (2) \\dfrac{dr}{dt}$<br><br>$4\\pi = 16\\pi \\dfrac{dr}{dt}$<br><br>$\\dfrac{dr}{dt} = \\dfrac{4\\pi}{16\\pi} = 0.25$ cm/s.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e78c30a4553e1bde0d", "type": "singleCorrect", "question": {"text": "A spherical mothball has initial radius 3 cm. Due to evaporation, the radius of the ball reduces to 1 cm in 4 months. In how many months would the mothball evaporate completely if the volume is lost at a rate proportional to the surface area ?", "image": null}, "options": [{"id": "sIuew", "label": "A", "text": "$6$ months", "isCorrect": true, "image": null}, {"id": "VTe8I", "label": "B", "text": "$8$ months", "isCorrect": false, "image": null}, {"id": "MG3PI", "label": "C", "text": "$10$ months", "isCorrect": false, "image": null}, {"id": "iagB9", "label": "D", "text": "$12$ months", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $V$ be the volume and $S$ be the surface area of the spherical mothball of radius $r$.<br><br>$V = \\dfrac{4}{3} \\pi r^3$<br><br>$S = 4 \\pi r^2$<br><br>Given that the rate of loss of volume is proportional to the surface area:<br><br>$\\dfrac{dV}{dt} = -k S$<br><br>Differentiating $V$ with respect to $t$:<br><br>$\\dfrac{dV}{dt} = \\dfrac{d}{dt} \\left( \\dfrac{4}{3} \\pi r^3 \\right) = 4 \\pi r^2 \\dfrac{dr}{dt} = S \\dfrac{dr}{dt}$<br><br>Equating the two expressions for $\\dfrac{dV}{dt}$:<br><br>$S \\dfrac{dr}{dt} = -k S \\Rightarrow \\dfrac{dr}{dt} = -k$<br><br>Integrating both sides with respect to $t$:<br><br>$r(t) = -kt + C$<br><br>At $t = 0$, $r = 3$ cm, which gives $C = 3$.<br><br>$r(t) = 3 - kt$<br><br>At $t = 4$ months, $r = 1$ cm:<br><br>$1 = 3 - 4k \\Rightarrow 4k = 2 \\Rightarrow k = \\dfrac{1}{2}$<br><br>The mothball evaporates completely when $r(t) = 0$:<br><br>$0 = 3 - \\dfrac{1}{2} t \\Rightarrow t = 6$ months.<br><br>Answer: $6$ months", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3748c30a4553e1be3ee", "type": "singleCorrect", "question": {"text": "If a spherical balloon has a variable diameter $3x + \\dfrac{9}{2}$ units, then the rate of change of its volume with respect to $x$ is", "image": null}, "options": [{"id": "QfVOc", "label": "A", "text": "$\\dfrac{27\\pi}{4}(2x + 3)^2$", "isCorrect": false, "image": null}, {"id": "fjDf0", "label": "B", "text": "$\\dfrac{2\\pi}{3}(2x + 3)^2$", "isCorrect": false, "image": null}, {"id": "2rsb3", "label": "C", "text": "$\\dfrac{27\\pi}{8}(2x + 3)^2$", "isCorrect": true, "image": null}, {"id": "OF7Ww", "label": "D", "text": "$\\dfrac{27\\pi}{2}(2x + 3)^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given the diameter of the spherical balloon is $D = 3x + \\dfrac{9}{2} = \\dfrac{3(2x + 3)}{2}$<br><br>The radius of the balloon is $r = \\dfrac{D}{2} = \\dfrac{3(2x + 3)}{4}$<br><br>The volume of the spherical balloon is $V = \\dfrac{4}{3}\\pi r^3$<br><br>Substituting the value of $r$:<br><br>$V = \\dfrac{4}{3}\\pi \\left( \\dfrac{3(2x + 3)}{4} \\right)^3$<br><br>$V = \\dfrac{4}{3}\\pi \\left( \\dfrac{27(2x + 3)^3}{64} \\right)$<br><br>$V = \\dfrac{9\\pi}{16}(2x + 3)^3$<br><br>Differentiating the volume with respect to $x$:<br><br>$\\dfrac{dV}{dx} = \\dfrac{9\\pi}{16} \\cdot 3(2x + 3)^2 \\cdot \\dfrac{d}{dx}(2x + 3)$<br><br>$\\dfrac{dV}{dx} = \\dfrac{27\\pi}{16}(2x + 3)^2 \\cdot 2$<br><br>$\\dfrac{dV}{dx} = \\dfrac{27\\pi}{8}(2x + 3)^2$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2bd8c30a4553e1bdc4f", "type": "singleCorrect", "question": {"text": "The approximate value of $\\sqrt[3]{63}$ is", "image": null}, "options": [{"id": "OfvA8", "label": "A", "text": "$3.9791$", "isCorrect": true, "image": null}, {"id": "RwOte", "label": "B", "text": "$3.8791$", "isCorrect": false, "image": null}, {"id": "Iavxm", "label": "C", "text": "$3.9581$", "isCorrect": false, "image": null}, {"id": "FwDWI", "label": "D", "text": "$4.0205$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $f(x) = x^{1/3}$.<br><br>Let $x = 64$ and $\\Delta x = -1$.<br><br>We know that $f(x + \\Delta x) \\approx f(x) + f'(x) \\Delta x$.<br><br>Differentiating $f(x)$ with respect to $x$, we get:<br><br>$f'(x) = \\dfrac{1}{3} x^{-2/3}$<br><br>At $x = 64$, $f'(64) = \\dfrac{1}{3} (64)^{-2/3} = \\dfrac{1}{3} \\times \\dfrac{1}{16} = \\dfrac{1}{48}$<br><br>Now, $\\Delta y \\approx f'(64) \\Delta x = \\dfrac{1}{48} \\times (-1) \\approx -0.02083$<br><br>Therefore, the approximate value is:<br><br>$f(63) \\approx 4 - 0.02083 = 3.97917$<br><br>A more precise calculation using the binomial expansion yields $3.979057$, which rounds to $3.9791$. The closest given option is $3.9791$.<br><br>Answer: $3.9791$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c04bf9280d7f9932e89", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A spherical balloon is filled with $4500 \\pi$ cubic meters of helium gas. If a leak in the balloon causes the gas to escape at the rate of $72 \\pi$ cubic meters per minute, then the rate (in meters per minute) at which the radius of the balloon decreases 49 minutes after the leakage has begun, is", "image": null}, "options": [{"id": "UkWIJ", "text": "$\\frac{9}{7}$", "image": null, "isCorrect": false}, {"id": "6r0mx", "text": "$-\\frac{2}{9}$", "image": null, "isCorrect": false}, {"id": "5wD1s", "text": "$\\frac{9}{2}$", "image": null, "isCorrect": false}, {"id": "CqUtW", "text": "$\\frac{2}{9}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Volume of the spherical balloon is $V = \\dfrac{4}{3} \\pi r^3$.<br><br>Given initial volume $V_0 = 4500 \\pi$ and the rate of change of volume $\\dfrac{dV}{dt} = -72 \\pi$.<br><br>Volume after $49$ minutes is $V = 4500 \\pi - 72 \\pi \\times 49 = 4500 \\pi - 3528 \\pi = 972 \\pi$.<br><br>Equating to the volume formula:<br><br>$\\dfrac{4}{3} \\pi r^3 = 972 \\pi$<br><br>$r^3 = \\dfrac{972 \\times 3}{4} = 243 \\times 3 = 729$<br><br>$r = 9$<br><br>Differentiating $V = \\dfrac{4}{3} \\pi r^3$ with respect to $t$:<br><br>$\\dfrac{dV}{dt} = 4 \\pi r^2 \\dfrac{dr}{dt}$<br><br>Substituting the values $r = 9$ and $\\dfrac{dV}{dt} = -72 \\pi$:<br><br>$-72 \\pi = 4 \\pi (9)^2 \\dfrac{dr}{dt}$<br><br>$-72 \\pi = 324 \\pi \\dfrac{dr}{dt}$<br><br>$\\dfrac{dr}{dt} = -\\dfrac{72}{324} = -\\dfrac{2}{9}$<br><br>The rate at which the radius decreases is the negative of the rate of change, which is $\\dfrac{2}{9}$.<br><br>Answer: $\\frac{2}{9}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c03bf9280d7f9932e7a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The approximate value of $\\frac{1}{(2.002)^2}$ is", "image": null}, "options": [{"id": "wTVz5", "text": "0.2495", "image": null, "isCorrect": true}, {"id": "LAghe", "text": "0.2595", "image": null, "isCorrect": false}, {"id": "7eNkh", "text": "0.2095", "image": null, "isCorrect": false}, {"id": "WYUe0", "text": "0.2392", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x) = \\dfrac{1}{x^2} = x^{-2}$<br><br>Let $a = 2$ and $h = 0.002$<br><br>$f(a) = f(2) = \\dfrac{1}{2^2} = 0.25$<br><br>$f'(x) = -2x^{-3} = -\\dfrac{2}{x^3}$<br><br>$f'(a) = f'(2) = -\\dfrac{2}{2^3} = -0.25$<br><br>Using the approximation formula $f(a+h) \\approx f(a) + h f'(a)$<br><br>$f(2.002) \\approx 0.25 + (0.002)(-0.25)$<br><br>$f(2.002) \\approx 0.25 - 0.0005 = 0.2495$<br><br>Answer: 0.2495", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf5bf9280d7f9932e02", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The surface area of a spherical ball is increasing at the rate of $4 \\pi \\mathrm{~cm}^2 /$ second . The rate at which the radius is increasing when the surface area is $16 \\pi \\mathrm{~cm}^2$ is", "image": null}, "options": [{"id": "XKI1v", "text": "$0.25 \\mathrm{~cm} /$ second", "image": null, "isCorrect": true}, {"id": "xzL7W", "text": "$0.5 \\mathrm{~cm} /$ second", "image": null, "isCorrect": false}, {"id": "MBENe", "text": "$0.125 \\mathrm{~cm} /$ second", "image": null, "isCorrect": false}, {"id": "vpjvJ", "text": "$1 \\mathrm{~cm} /$ second", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $S$ be the surface area and $r$ be the radius of the spherical ball.<br><br>The surface area of a sphere is given by:<br>$S = 4 \\pi r^2$<br><br>Differentiating with respect to time $t$, we get:<br>$\\dfrac{dS}{dt} = 8 \\pi r \\dfrac{dr}{dt}$<br><br>We are given that $\\dfrac{dS}{dt} = 4 \\pi \\text{ cm}^2/\\text{second}$.<br><br>When the surface area $S = 16 \\pi \\text{ cm}^2$, we can find the radius $r$:<br>$4 \\pi r^2 = 16 \\pi$<br>$r^2 = 4 \\Rightarrow r = 2 \\text{ cm}$<br><br>Substituting the values of $\\dfrac{dS}{dt}$ and $r$ into the derivative equation:<br>$4 \\pi = 8 \\pi (2) \\dfrac{dr}{dt}$<br>$4 \\pi = 16 \\pi \\dfrac{dr}{dt}$<br><br>$\\dfrac{dr}{dt} = \\dfrac{4 \\pi}{16 \\pi} = \\dfrac{1}{4} = 0.25 \\text{ cm}/\\text{second}$<br><br>Answer: $0.25 \\mathrm{~cm} /$ second", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be1bf9280d7f9932d42", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $x$ and y are sides of two squares such that $\\mathrm{y}=x-x^2$, then the rate of change of area of the second square with respect to that of the first square is", "image": null}, "options": [{"id": "QqLF5", "text": "$2 x^2+3 x+1$", "image": null, "isCorrect": false}, {"id": "TEiLr", "text": "$3 x^2+2 x-1$", "image": null, "isCorrect": false}, {"id": "FFSdS", "text": "$2 x^2-3 x+1$", "image": null, "isCorrect": true}, {"id": "LJzSY", "text": "$3 x^2+2 x+1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $A_1$ and $A_2$ be the areas of the first and second squares respectively.<br><br>$A_1 = x^2$<br><br>$A_2 = y^2 = (x - x^2)^2$<br><br>Differentiating $A_1$ and $A_2$ with respect to $x$:<br><br>$\\dfrac{dA_1}{dx} = 2x$<br><br>$\\dfrac{dA_2}{dx} = 2(x - x^2)(1 - 2x) = 2x(1 - x)(1 - 2x)$<br><br>The rate of change of the area of the second square with respect to the first square is given by:<br><br>$\\dfrac{dA_2}{dA_1} = \\dfrac{\\dfrac{dA_2}{dx}}{\\dfrac{dA_1}{dx}}$<br><br>$\\dfrac{dA_2}{dA_1} = \\dfrac{2x(1 - x)(1 - 2x)}{2x}$<br><br>$\\dfrac{dA_2}{dA_1} = (1 - x)(1 - 2x) = 2x^2 - 3x + 1$<br><br>Answer: $2 x^2-3 x+1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb0bf9280d7f9932b9b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The rate of change of the volume of a sphere with respect to its surface area, when the radius is 5 m is", "image": null}, "options": [{"id": "kEwQt", "text": "$\\frac{5}{2} \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "JXdRn", "text": "$\\frac{2}{5} \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "uHMJX", "text": "$\\frac{1}{2} \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "bTdcF", "text": "$\\frac{1}{3} \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $V$ be the volume and $S$ be the surface area of the sphere with radius $r$.<br><br>$V = \\dfrac{4}{3} \\pi r^3$<br><br>$S = 4 \\pi r^2$<br><br>Differentiating both with respect to $r$:<br><br>$\\dfrac{dV}{dr} = 4 \\pi r^2$<br><br>$\\dfrac{dS}{dr} = 8 \\pi r$<br><br>The rate of change of volume with respect to surface area is given by:<br><br>$\\dfrac{dV}{dS} = \\dfrac{\\dfrac{dV}{dr}}{\\dfrac{dS}{dr}}$<br><br>$\\dfrac{dV}{dS} = \\dfrac{4 \\pi r^2}{8 \\pi r} = \\dfrac{r}{2}$<br><br>Substituting $r = 5$ m:<br><br>$\\dfrac{dV}{dS} = \\dfrac{5}{2}$ m<br><br>Answer: $\\frac{5}{2} \\mathrm{~m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba1bf9280d7f9932b11", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The length and breadth of a rectangle are $x \\mathrm{~cm}$ and y cm respectively. If the length decreases at the rate of $5 \\mathrm{~cm} /$ minute and the breadth increases at the rate of $3 \\mathrm{~cm} /$ minute, then the rates of change of the perimeter and area respectively when the length is 5 cm and breadth is 2 cm , are", "image": null}, "options": [{"id": "1mRJH", "text": "-4 and 5", "image": null, "isCorrect": true}, {"id": "M8neK", "text": "-5 and 3", "image": null, "isCorrect": false}, {"id": "TG2xT", "text": "3 and 5", "image": null, "isCorrect": false}, {"id": "lgdBG", "text": "3 and -5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $x$ be the length and $y$ be the breadth of the rectangle.<br><br>Given that the length decreases at $5$ cm/min and the breadth increases at $3$ cm/min, we have:<br>$\\dfrac{dx}{dt} = -5$<br>$\\dfrac{dy}{dt} = 3$<br><br>The perimeter of the rectangle is given by $P = 2(x + y)$.<br>Differentiating with respect to $t$ gives the rate of change of the perimeter:<br>$\\dfrac{dP}{dt} = 2\\left(\\dfrac{dx}{dt} + \\dfrac{dy}{dt}\\right)$<br>$\\dfrac{dP}{dt} = 2(-5 + 3) = 2(-2) = -4$ cm/min<br><br>The area of the rectangle is given by $A = xy$.<br>Differentiating with respect to $t$ gives the rate of change of the area:<br>$\\dfrac{dA}{dt} = x\\dfrac{dy}{dt} + y\\dfrac{dx}{dt}$<br><br>Substituting $x = 5$, $y = 2$, $\\dfrac{dx}{dt} = -5$, and $\\dfrac{dy}{dt} = 3$:<br>$\\dfrac{dA}{dt} = (5)(3) + (2)(-5)$<br>$\\dfrac{dA}{dt} = 15 - 10 = 5$ cm$^2$/min<br><br>The rates of change of the perimeter and area are $-4$ and $5$ respectively.<br><br>Answer: -4 and 5", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9fbf9280d7f9932afb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The rate of change of volume of spherical balloon at any instant is directly proportional to its surface area. If initially its radius is 3 cm , after 2 minutes its radius becomes 9 cm , then radius of balloon after 4 minutes is", "image": null}, "options": [{"id": "3iFZ7", "text": "12 cm", "image": null, "isCorrect": false}, {"id": "mlI7k", "text": "14 cm", "image": null, "isCorrect": false}, {"id": "NLEWo", "text": "15 cm", "image": null, "isCorrect": true}, {"id": "OSErA", "text": "18 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $V$ be the volume and $S$ be the surface area of the spherical balloon of radius $r$.<br><br>$V = \\dfrac{4}{3} \\pi r^3$ and $S = 4 \\pi r^2$<br><br>Given that the rate of change of volume is directly proportional to its surface area:<br><br>$\\dfrac{dV}{dt} \\propto S$<br><br>$\\dfrac{dV}{dt} = kS$<br><br>Differentiating $V$ with respect to $t$:<br><br>$\\dfrac{d}{dt} \\left( \\dfrac{4}{3} \\pi r^3 \\right) = k(4 \\pi r^2)$<br><br>$4 \\pi r^2 \\dfrac{dr}{dt} = 4 \\pi k r^2$<br><br>$\\dfrac{dr}{dt} = k$<br><br>Integrating both sides with respect to $t$:<br><br>$r = kt + c$<br><br>Initially, at $t = 0$, $r = 3$ cm:<br><br>$3 = k(0) + c \\Rightarrow c = 3$<br><br>After $t = 2$ minutes, $r = 9$ cm:<br><br>$9 = k(2) + 3 \\Rightarrow 2k = 6 \\Rightarrow k = 3$<br><br>The equation for the radius becomes:<br><br>$r = 3t + 3$<br><br>To find the radius after $t = 4$ minutes:<br><br>$r = 3(4) + 3 = 12 + 3 = 15$ cm.<br><br>Answer: 15 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b91bf9280d7f9932a73", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The equation of motion of the particle is $s=a t^2+b t+c$. If the displacement after 1 second is 20 m , velocity after 2 seconds is 30 $\\mathrm{m} /$ seconds and the acceleration is $10 \\mathrm{~m} /$ seconds $^2$, then", "image": null}, "options": [{"id": "UjUuP", "text": "$a+c=2 b$", "image": null, "isCorrect": false}, {"id": "fFBpY", "text": "$a+c=b$", "image": null, "isCorrect": true}, {"id": "DPuGl", "text": "$a-c=b$", "image": null, "isCorrect": false}, {"id": "8ULN2", "text": "$a+c=3 b$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $s = at^2 + bt + c$<br><br>Velocity $v = \\dfrac{ds}{dt} = 2at + b$<br><br>Acceleration $A = \\dfrac{dv}{dt} = 2a$<br><br>Given acceleration is $10 \\text{ m/s}^2$, so $2a = 10 \\Rightarrow a = 5$<br><br>Velocity after 2 seconds is $30 \\text{ m/s}$, so $v(2) = 4a + b = 30$<br><br>Substituting $a = 5$, we get $4(5) + b = 30 \\Rightarrow b = 10$<br><br>Displacement after 1 second is $20 \\text{ m}$, so $s(1) = a + b + c = 20$<br><br>Substituting $a = 5$ and $b = 10$, we get $5 + 10 + c = 20 \\Rightarrow c = 5$<br><br>Now, checking the options, we find $a + c = 5 + 5 = 10$ and $b = 10$<br><br>Therefore, $a + c = b$.<br><br>Answer: $a+c=b$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b72bf9280d7f993294e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The approximate value of $\\sqrt[3]{64.04}$ is", "image": null}, "options": [{"id": "0dbuE", "text": "$4.00043$", "image": null, "isCorrect": false}, {"id": "j4Po9", "text": "$4.00076$", "image": null, "isCorrect": false}, {"id": "JxACK", "text": "$4.00083$", "image": null, "isCorrect": true}, {"id": "pQRxX", "text": "$4.00064$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x) = x^{1/3}$.<br><br>Differentiating with respect to $x$, we get $f'(x) = \\dfrac{1}{3} x^{-2/3} = \\dfrac{1}{3x^{2/3}}$.<br><br>Let $x = 64$ and $\\Delta x = 0.04$.<br><br>$f(x) = f(64) = (64)^{1/3} = 4$<br><br>$f'(x) = f'(64) = \\dfrac{1}{3(64)^{2/3}} = \\dfrac{1}{3(16)} = \\dfrac{1}{48}$<br><br>The approximate value is given by $f(x + \\Delta x) \\approx f(x) + f'(x) \\Delta x$.<br><br>$f(64.04) \\approx 4 + \\left(\\dfrac{1}{48}\\right)(0.04)$<br><br>$f(64.04) \\approx 4 + \\dfrac{0.04}{48} = 4 + \\dfrac{1}{1200}$<br><br>$f(64.04) \\approx 4 + 0.000833... \\approx 4.00083$<br><br>Answer: $4.00083$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b63bf9280d7f99328b9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Let $x$ be the length of each of the equal sides of an isosceles triangle and $\\theta$ be the angle between these sides. If $x$ is increasing at the rate $\\frac{1}{12} \\mathrm{~m} /$ hour and $\\theta$ is increasing at the rate $\\frac{\\pi}{180} \\mathrm{rad} /$ hour, then the rate at which area of the triangle is increasing when $x=12 \\mathrm{~m}$ and $\\theta=\\frac{\\pi}{4}$ is", "image": null}, "options": [{"id": "4kCB0", "text": "$\\left(\\frac{\\pi}{5}+\\frac{1}{2}\\right) \\mathrm{m}^2 /$ hour", "image": null, "isCorrect": false}, {"id": "nRP13", "text": "$\\sqrt{2}\\left(\\frac{\\pi}{5}+\\frac{1}{2}\\right) \\mathrm{m}^2 /$ hour", "image": null, "isCorrect": true}, {"id": "ne5Hw", "text": "$2\\left(\\frac{\\pi}{5}+\\frac{1}{2}\\right) \\mathrm{m}^2 /$ hour", "image": null, "isCorrect": false}, {"id": "cs88l", "text": "$\\sqrt{3}\\left(\\frac{\\pi}{5}+\\frac{1}{2}\\right) \\mathrm{m}^2 /$ hour", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $A$ be the area of the isosceles triangle. The area is given by $A = \\dfrac{1}{2} x^2 \\sin \\theta$.<br><br>Differentiating with respect to time $t$:<br><br>$\\dfrac{dA}{dt} = \\dfrac{1}{2} \\left( 2x \\dfrac{dx}{dt} \\sin \\theta + x^2 \\cos \\theta \\dfrac{d\\theta}{dt} \\right)$<br><br>$\\dfrac{dA}{dt} = x \\dfrac{dx}{dt} \\sin \\theta + \\dfrac{1}{2} x^2 \\cos \\theta \\dfrac{d\\theta}{dt}$<br><br>Given $x = 12$, $\\theta = \\dfrac{\\pi}{4}$, $\\dfrac{dx}{dt} = \\dfrac{1}{12}$, and $\\dfrac{d\\theta}{dt} = \\dfrac{\\pi}{180}$.<br><br>Substituting these values:<br><br>$\\dfrac{dA}{dt} = 12 \\left( \\dfrac{1}{12} \\right) \\sin \\dfrac{\\pi}{4} + \\dfrac{1}{2} (12)^2 \\cos \\dfrac{\\pi}{4} \\left( \\dfrac{\\pi}{180} \\right)$<br><br>$\\dfrac{dA}{dt} = 1 \\cdot \\dfrac{1}{\\sqrt{2}} + 72 \\cdot \\dfrac{1}{\\sqrt{2}} \\cdot \\dfrac{\\pi}{180}$<br><br>$\\dfrac{dA}{dt} = \\dfrac{1}{\\sqrt{2}} + \\dfrac{2\\pi}{5\\sqrt{2}}$<br><br>$\\dfrac{dA}{dt} = \\dfrac{1}{\\sqrt{2}} \\left( 1 + \\dfrac{2\\pi}{5} \\right)$<br><br>$\\dfrac{dA}{dt} = \\dfrac{2}{\\sqrt{2}} \\left( \\dfrac{1}{2} + \\dfrac{\\pi}{5} \\right) = \\sqrt{2} \\left( \\dfrac{\\pi}{5} + \\dfrac{1}{2} \\right)$<br><br>Answer: $\\sqrt{2}\\left(\\frac{\\pi}{5}+\\frac{1}{2}\\right) \\mathrm{m}^2 /$ hour", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4ebf9280d7f9932814", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The radius of the base of a cone is increasing at the rate $3 \\mathrm{~cm} /$ minute and the altitude is decreasing at the rate $4 \\mathrm{~cm} /$ minute. The rate at which the lateral surface area is changing, when the radius is 7 cm and altitude is 24 cm . is", "image": null}, "options": [{"id": "X4Swj", "text": "$75 \\pi \\mathrm{~cm}^2 /$ minute", "image": null, "isCorrect": false}, {"id": "8hRWD", "text": "$25 \\pi \\mathrm{~cm}^2 /$ minute", "image": null, "isCorrect": false}, {"id": "ayZKQ", "text": "$3 \\pi \\mathrm{~cm}^2 /$ minute", "image": null, "isCorrect": false}, {"id": "HNcZx", "text": "$54 \\pi \\mathrm{~cm}^2 /$ minute", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $r$ be the radius, $h$ be the altitude, $l$ be the slant height, and $S$ be the lateral surface area of the cone.<br><br>Given: $\\dfrac{dr}{dt} = 3$ and $\\dfrac{dh}{dt} = -4$.<br><br>At the given instant, $r = 7$ and $h = 24$.<br><br>The slant height is $l = \\sqrt{r^2 + h^2} = \\sqrt{7^2 + 24^2} = 25$.<br><br>Differentiating $l^2 = r^2 + h^2$ with respect to $t$:<br><br>$2l \\dfrac{dl}{dt} = 2r \\dfrac{dr}{dt} + 2h \\dfrac{dh}{dt}$<br><br>$l \\dfrac{dl}{dt} = r \\dfrac{dr}{dt} + h \\dfrac{dh}{dt}$<br><br>$25 \\dfrac{dl}{dt} = 7(3) + 24(-4) = 21 - 96 = -75$<br><br>$\\dfrac{dl}{dt} = -3$<br><br>The lateral surface area is $S = \\pi r l$. Differentiating with respect to $t$:<br><br>$\\dfrac{dS}{dt} = \\pi \\left( r \\dfrac{dl}{dt} + l \\dfrac{dr}{dt} \\right)$<br><br>$\\dfrac{dS}{dt} = \\pi \\left( 7(-3) + 25(3) \\right) = \\pi (-21 + 75) = 54\\pi$<br><br>The rate at which the lateral surface area is changing is $54\\pi \\text{ cm}^2/\\text{minute}$.<br><br>Answer: $54 \\pi \\mathrm{~cm}^2 /$ minute", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b40bf9280d7f9932781", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The approximate value of $\\cos \\left(59^{\\circ} 30^{\\prime}\\right)$ is (given $1^{\\circ}=0.0175^{\\mathrm{c}}, \\sin 60^{\\circ}=0.8660$ )", "image": null}, "options": [{"id": "TeGu5", "text": "$0.5076$", "image": null, "isCorrect": true}, {"id": "18DtX", "text": "$0.5176$", "image": null, "isCorrect": false}, {"id": "JTvs5", "text": "$0.5256$", "image": null, "isCorrect": false}, {"id": "Z5YIX", "text": "$0.5150$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x) = \\cos x$, then $f'(x) = -\\sin x$.<br><br>We need to find the value of $f(59^{\\circ} 30')$.<br><br>Let $x = 60^{\\circ}$ and $h = -30' = -0.5^{\\circ}$.<br><br>Converting $h$ into radians:<br><br>$h = -0.5 \\times 0.0175^{\\mathrm{c}} = -0.00875^{\\mathrm{c}}$<br><br>Using the approximation formula $f(x+h) \\approx f(x) + h f'(x)$:<br><br>$\\cos(59^{\\circ} 30') \\approx \\cos(60^{\\circ}) + h(-\\sin 60^{\\circ})$<br><br>$\\cos(59^{\\circ} 30') \\approx 0.5 + (-0.00875)(-0.8660)$<br><br>$\\cos(59^{\\circ} 30') \\approx 0.5 + 0.0075775$<br><br>$\\cos(59^{\\circ} 30') \\approx 0.5075775 \\approx 0.5076$<br><br>Answer: $0.5076$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b17bf9280d7f993263a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The position of a point in time t is given by $x=\\mathrm{a}+\\mathrm{bt}-\\mathrm{ct}^2, \\mathrm{y}=\\mathrm{at}+\\mathrm{bt}^2$.\nIt's resultant acceleration at time $t$ in seconds is given by", "image": null}, "options": [{"id": "JktE3", "text": "$\\mathrm{b}-\\mathrm{c} \\quad$ unit/seconds ${ }^2$", "image": null, "isCorrect": false}, {"id": "lg9SR", "text": "$\\mathrm{b}+\\mathrm{c} \\quad$ unit/seconds ${ }^2$", "image": null, "isCorrect": false}, {"id": "De6gA", "text": "$2 \\mathrm{~b}-2 \\mathrm{c} \\quad$ unit $/$ seconds $^2$", "image": null, "isCorrect": false}, {"id": "bM0Wv", "text": "$2 \\sqrt{b^2+c^2}$ unit/seconds ${ }^2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $x = a + bt - ct^2$ and $y = at + bt^2$.<br><br>Differentiating with respect to time $t$, we get the velocity components:<br>$v_x = \\dfrac{dx}{dt} = b - 2ct$<br>$v_y = \\dfrac{dy}{dt} = a + 2bt$<br><br>Differentiating again with respect to time $t$, we get the acceleration components:<br>$a_x = \\dfrac{dv_x}{dt} = -2c$<br>$a_y = \\dfrac{dv_y}{dt} = 2b$<br><br>The resultant acceleration is given by:<br>$a = \\sqrt{a_x^2 + a_y^2}$<br>$a = \\sqrt{(-2c)^2 + (2b)^2}$<br>$a = \\sqrt{4c^2 + 4b^2} = 2\\sqrt{b^2 + c^2}$<br><br>Answer: $2 \\sqrt{b^2+c^2}$ unit/seconds ${ }^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b08bf9280d7f99325c8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "By dropping a stone in a quiet lake, a wave in the form of circle is generated. The radius of the circular wave increases at the rate of $2.1 \\mathrm{~cm} / \\mathrm{sec}$. Then the rate of increase of the enclosed circular region, when the radius of the circular wave is 10 cm, is (Given $\\pi = \\frac{22}{7}$)", "image": null}, "options": [{"id": "fq2EG", "text": "$66 \\mathrm{~cm}^2 /$ second", "image": null, "isCorrect": false}, {"id": "Whugu", "text": "$122 \\mathrm{~cm}^2 /$ second", "image": null, "isCorrect": false}, {"id": "vrO74", "text": "$132 \\mathrm{~cm}^2 /$ second", "image": null, "isCorrect": true}, {"id": "8gekm", "text": "$110 \\mathrm{~cm}^2 /$ second", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $r$ be the radius and $A$ be the area of the circular wave at time $t$.<br><br>Given $\\dfrac{dr}{dt} = 2.1 \\text{ cm/sec}$ and $r = 10 \\text{ cm}$.<br><br>The area of the circular region is $A = \\pi r^2$.<br><br>Differentiating with respect to $t$, we get:<br><br>$\\dfrac{dA}{dt} = 2\\pi r \\dfrac{dr}{dt}$<br><br>Substituting the given values:<br><br>$\\dfrac{dA}{dt} = 2 \\times \\dfrac{22}{7} \\times 10 \\times 2.1$<br><br>$\\dfrac{dA}{dt} = 2 \\times 22 \\times 10 \\times 0.3$<br><br>$\\dfrac{dA}{dt} = 44 \\times 3 = 132 \\text{ cm}^2/\\text{sec}$<br><br>Answer: $132 \\mathrm{~cm}^2 /$ second", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792144c0aee93fa0796df89", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "Water is being poured at the rate of $36 \\mathrm{~m}^3 / \\mathrm{min}$ into a cylindrical vessel, whose circular base is of radius 3 meters. Then the water level in the cylinder is rising at the rate of", "image": null}, "options": [{"id": "QBH0z", "text": "$4 \\pi \\mathrm{~m} / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "cBZOT", "text": "$\\frac{4}{\\pi} \\mathrm{~m} / \\mathrm{min}$", "image": null, "isCorrect": true}, {"id": "5lDlU", "text": "$\\frac{1}{4 \\pi} \\mathrm{~m} / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "VqNpe", "text": "$\\frac{\\pi}{4} \\mathrm{~m} / \\mathrm{min}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $V$ be the volume and $h$ be the height of the water in the cylindrical vessel at time $t$.<br><br>The volume of the cylinder is given by $V = \\pi r^2 h$.<br><br>Since the radius $r = 3 \\mathrm{~m}$ is constant, substituting $r = 3$ gives:<br><br>$V = 9 \\pi h$<br><br>Differentiating with respect to $t$, we get:<br><br>$\\dfrac{dV}{dt} = 9 \\pi \\dfrac{dh}{dt}$<br><br>Given that the rate of change of volume is $\\dfrac{dV}{dt} = 36 \\mathrm{~m}^3/\\mathrm{min}$, we have:<br><br>$36 = 9 \\pi \\dfrac{dh}{dt}$<br><br>$\\dfrac{dh}{dt} = \\dfrac{36}{9 \\pi} = \\dfrac{4}{\\pi} \\mathrm{~m}/\\mathrm{min}$<br><br>Answer: $\\frac{4}{\\pi} \\mathrm{~m} / \\mathrm{min}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792144c0aee93fa0796df86", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "The rate of change of the volume of a sphere with respect to its surface area, when its radius is 2 cm, is _______ $\\mathrm{cm}^3 / \\mathrm{cm}^2$.", "image": null}, "options": [{"id": "1ersZ", "text": "0.1", "image": null, "isCorrect": false}, {"id": "bkanI", "text": "0.5", "image": null, "isCorrect": false}, {"id": "bHczr", "text": "1", "image": null, "isCorrect": true}, {"id": "BoXIy", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $V$ be the volume and $S$ be the surface area of the sphere of radius $r$.<br><br>$V = \\dfrac{4}{3}\\pi r^3$ and $S = 4\\pi r^2$<br><br>Differentiating with respect to $r$:<br><br>$\\dfrac{dV}{dr} = 4\\pi r^2$<br><br>$\\dfrac{dS}{dr} = 8\\pi r$<br><br>The rate of change of volume with respect to surface area is:<br><br>$\\dfrac{dV}{dS} = \\dfrac{\\dfrac{dV}{dr}}{\\dfrac{dS}{dr}} = \\dfrac{4\\pi r^2}{8\\pi r} = \\dfrac{r}{2}$<br><br>Substituting $r = 2$ cm:<br><br>$\\dfrac{dV}{dS} = \\dfrac{2}{2} = 1$ cm$^3$/cm$^2$<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214170aee93fa0796dde8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "The approximate value of $3^{2.001}$, if $\\log 3=1.0986$ is", "image": null}, "options": [{"id": "MxLz5", "text": "9.00898", "image": null, "isCorrect": false}, {"id": "baWgy", "text": "9.0989", "image": null, "isCorrect": false}, {"id": "0KHjf", "text": "9.0898", "image": null, "isCorrect": false}, {"id": "UTS2d", "text": "9.00989", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $f(x) = 3^x$. We need to find the approximate value of $f(2.001)$.<br><br>Let $x = 2$ and $\\Delta x = 0.001$.<br><br>The derivative of the function is:<br><br>$f'(x) = 3^x \\log 3$<br><br>Using the approximation formula $f(x + \\Delta x) \\approx f(x) + f'(x) \\Delta x$, we have:<br><br>$f(2.001) \\approx f(2) + f'(2) \\times 0.001$<br><br>Calculate $f(2)$ and $f'(2)$:<br><br>$f(2) = 3^2 = 9$<br><br>$f'(2) = 3^2 \\log 3 = 9 \\times 1.0986 = 9.8874$<br><br>Substitute these values into the approximation formula:<br><br>$f(2.001) \\approx 9 + 9.8874 \\times 0.001$<br><br>$f(2.001) \\approx 9 + 0.0098874$<br><br>$f(2.001) \\approx 9.0098874$<br><br>Rounding to five decimal places, we get $9.00989$.<br><br>Answer: 9.00989", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214170aee93fa0796dde4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "A ladder 5 m in length is leaning against a wall. The bottom of the ladder is pulled along the ground away from the wall, at the rate of $2 \\mathrm{~m} / \\mathrm{sec}$. How fast is the height on the wall decreasing when the foot of the ladder is 4 m away from the wall?", "image": null}, "options": [{"id": "gALlt", "text": "$\\frac{4}{3} \\mathrm{~m} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "JJ2oX", "text": "$\\frac{2}{3} \\mathrm{~m} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "P2fxF", "text": "$\\frac{5}{3} \\mathrm{~m} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "Tk6C8", "text": "$\\frac{8}{3} \\mathrm{~m} / \\mathrm{sec}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $x$ be the distance of the foot of the ladder from the wall and $y$ be the height of the ladder on the wall.<br><br>By Pythagoras theorem, $x^2 + y^2 = 25$.<br><br>Given $\\dfrac{dx}{dt} = 2$ m/sec.<br><br>When $x = 4$ m, $4^2 + y^2 = 25 \\Rightarrow y = 3$ m.<br><br>Differentiating $x^2 + y^2 = 25$ with respect to $t$, we get:<br><br>$2x \\dfrac{dx}{dt} + 2y \\dfrac{dy}{dt} = 0$<br><br>$x \\dfrac{dx}{dt} + y \\dfrac{dy}{dt} = 0$<br><br>Substituting the values, we get:<br><br>$4(2) + 3 \\dfrac{dy}{dt} = 0$<br><br>$\\dfrac{dy}{dt} = -\\dfrac{8}{3}$ m/sec.<br><br>The height on the wall is decreasing at the rate of $\\dfrac{8}{3}$ m/sec.<br><br>Answer: $\\frac{8}{3} \\mathrm{~m} / \\mathrm{sec}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214160aee93fa0796dde0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "Twenty meters of wire is available for fencing off a flower-bed in the form of a circular sector. Then the maximum area (in sq.m) of the flowerbed is", "image": null}, "options": [{"id": "G2QnT", "text": "30", "image": null, "isCorrect": false}, {"id": "fQm8F", "text": "12.5", "image": null, "isCorrect": false}, {"id": "BYw07", "text": "25", "image": null, "isCorrect": true}, {"id": "GUu3Z", "text": "10", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $r$ be the radius and $s$ be the arc length of the circular sector.<br><br>The perimeter of the sector is given by $P = 2r + s$.<br><br>Since $20$ meters of wire is available, we have:<br><br>$2r + s = 20 \\Rightarrow s = 20 - 2r$<br><br>The area of the circular sector is $A = \\dfrac{1}{2}rs$.<br><br>Substituting the value of $s$ into the area formula, we get:<br><br>$A = \\dfrac{1}{2}r(20 - 2r) = 10r - r^2$<br><br>To find the maximum area, we differentiate $A$ with respect to $r$ and equate it to zero:<br><br>$\\dfrac{dA}{dr} = 10 - 2r = 0$<br><br>$\\Rightarrow r = 5$<br><br>To confirm it is a maximum, we check the second derivative:<br><br>$\\dfrac{d^2A}{dr^2} = -2 < 0$<br><br>Thus, the area is maximum when $r = 5$ m.<br><br>The maximum area is:<br><br>$A_{max} = 10(5) - (5)^2 = 50 - 25 = 25$ sq.m.<br><br>Answer: 25", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f20aee93fa0796dcc2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "The distance ' $s$ ' in meters covered by a body in $t$ seconds is given by $s=3 t^2-8 t+5$. The body will stop after", "image": null}, "options": [{"id": "6BdQS", "text": "1 sec", "image": null, "isCorrect": false}, {"id": "S68u0", "text": "$\\frac{3}{4} \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "Cr3fY", "text": "$\\frac{4}{3} \\mathrm{sec}$", "image": null, "isCorrect": true}, {"id": "Lp5kl", "text": "4 sec", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $s = 3t^2 - 8t + 5$.<br><br>Velocity $v = \\dfrac{ds}{dt}$.<br><br>$v = \\dfrac{d}{dt}(3t^2 - 8t + 5) = 6t - 8$.<br><br>The body stops when its velocity becomes zero, so $v = 0$.<br><br>$6t - 8 = 0$<br><br>$t = \\dfrac{8}{6} = \\dfrac{4}{3}$ sec.<br><br>Answer: $\\frac{4}{3} \\mathrm{sec}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f00aee93fa0796dcb2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "The rate of change of the volume of a sphere with respect to its surface area, when its radius is 2 cm , is", "image": null}, "options": [{"id": "vacMP", "text": "$0.1 \\mathrm{~cm}^3 / \\mathrm{cm}^2$", "image": null, "isCorrect": false}, {"id": "mzaWf", "text": "$\\frac{1}{2} \\mathrm{~cm}^3 / \\mathrm{cm}^2$", "image": null, "isCorrect": false}, {"id": "WHMfw", "text": "$1 \\mathrm{~cm}^3 / \\mathrm{cm}^2$", "image": null, "isCorrect": true}, {"id": "PfC9t", "text": "$2 \\mathrm{~cm}^3 / \\mathrm{cm}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $V$ be the volume and $S$ be the surface area of the sphere of radius $r$.<br><br>$V = \\dfrac{4}{3}\\pi r^3$<br><br>Differentiating with respect to $r$,<br><br>$\\dfrac{dV}{dr} = 4\\pi r^2$<br><br>$S = 4\\pi r^2$<br><br>Differentiating with respect to $r$,<br><br>$\\dfrac{dS}{dr} = 8\\pi r$<br><br>The rate of change of volume with respect to surface area is given by<br><br>$\\dfrac{dV}{dS} = \\dfrac{\\dfrac{dV}{dr}}{\\dfrac{dS}{dr}} = \\dfrac{4\\pi r^2}{8\\pi r} = \\dfrac{r}{2}$<br><br>Substituting $r = 2$ cm,<br><br>$\\dfrac{dV}{dS} = \\dfrac{2}{2} = 1 \\text{ cm}^3/\\text{cm}^2$<br><br>Answer: $1 \\mathrm{~cm}^3 / \\mathrm{cm}^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ee0aee93fa0796dca9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "The approximate value of $(3.978)^{\\frac{3}{2}}$ is", "image": null}, "options": [{"id": "awwWB", "text": "7.934", "image": null, "isCorrect": true}, {"id": "EDsOW", "text": "8.934", "image": null, "isCorrect": false}, {"id": "p2l5Q", "text": "7.022", "image": null, "isCorrect": false}, {"id": "Z8nEO", "text": "$8.866^{\\circ}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x) = x^{\\dfrac{3}{2}}$<br><br>Let $x = 4$ and $\\Delta x = -0.022$<br><br>$f(x) = 4^{\\dfrac{3}{2}} = 8$<br><br>$f'(x) = \\dfrac{3}{2} x^{\\dfrac{1}{2}}$<br><br>$f'(4) = \\dfrac{3}{2} (4)^{\\dfrac{1}{2}} = 3$<br><br>Using the approximation formula $f(x + \\Delta x) \\approx f(x) + f'(x) \\Delta x$<br><br>$f(3.978) \\approx 8 + 3(-0.022)$<br><br>$f(3.978) \\approx 8 - 0.066 = 7.934$<br><br>Answer: 7.934", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d90aee93fa0796dc00", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "The volume of a ball is increasing at the rate of $4 \\pi \\mathrm{cc} / \\mathrm{sec}$. The rate of increase of the radius, when the volume is $288 \\pi \\mathrm{cc}$, is", "image": null}, "options": [{"id": "StPV4", "text": "$\\dfrac{1}{6} \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "mOdBN", "text": "$\\dfrac{1}{36} \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": true}, {"id": "q39z1", "text": "$6 \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "d6sCf", "text": "$36 \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $V$ be the volume and $r$ be the radius of the ball.<br><br>$V = \\dfrac{4}{3} \\pi r^3$<br><br>Given $\\dfrac{dV}{dt} = 4 \\pi \\text{ cc/sec}$ and $V = 288 \\pi \\text{ cc}$.<br><br>$\\dfrac{4}{3} \\pi r^3 = 288 \\pi$<br><br>$r^3 = 216 \\Rightarrow r = 6 \\text{ cm}$<br><br>Differentiating $V$ with respect to $t$:<br><br>$\\dfrac{dV}{dt} = 4 \\pi r^2 \\dfrac{dr}{dt}$<br><br>$4 \\pi = 4 \\pi (6)^2 \\dfrac{dr}{dt}$<br><br>$\\dfrac{dr}{dt} = \\dfrac{1}{36} \\text{ cm/sec}$<br><br>Answer: $\\dfrac{1}{36} \\mathrm{~cm} / \\mathrm{sec}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ca0aee93fa0796db8c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "The approximate value of $x^3-2 x^2+3 x+2$ at $x=2.01$ is", "image": null}, "options": [{"id": "8zERy", "text": "8.07", "image": null, "isCorrect": true}, {"id": "8Lsv0", "text": "8.27", "image": null, "isCorrect": false}, {"id": "oCgZ3", "text": "8.007", "image": null, "isCorrect": false}, {"id": "Uf8AV", "text": "8.17", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x) = x^3 - 2x^2 + 3x + 2$.<br><br>We need to find the approximate value of $f(x)$ at $x = 2.01$.<br><br>Let $x = 2$ and $\\Delta x = 0.01$.<br><br>Using the approximation formula $f(x + \\Delta x) \\approx f(x) + f'(x) \\Delta x$:<br><br>$f(2) = 2^3 - 2(2)^2 + 3(2) + 2 = 8 - 8 + 6 + 2 = 8$<br><br>Differentiating $f(x)$ with respect to $x$, we get:<br><br>$f'(x) = 3x^2 - 4x + 3$<br><br>$f'(2) = 3(2)^2 - 4(2) + 3 = 12 - 8 + 3 = 7$<br><br>Substituting the values in the approximation formula:<br><br>$f(2.01) \\approx f(2) + f'(2) \\Delta x$<br><br>$f(2.01) \\approx 8 + 7(0.01) = 8 + 0.07 = 8.07$<br><br>Answer: 8.07", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c80aee93fa0796db7b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "A point moves along the arc of parabola $y=2 x^2$. Its abscissa increases uniformly at the rate of 2 units $/ \\mathrm{sec}$. At the instant, the point is passing through $(1,2)$, its distance from origin is increasing at the rate of", "image": null}, "options": [{"id": "Sz9Q3", "text": "$\\dfrac{36}{\\sqrt{5}}$ units/sec.", "image": null, "isCorrect": false}, {"id": "AH1Ms", "text": "$\\dfrac{18}{\\sqrt{5}}$ units $/ \\mathrm{sec}$.", "image": null, "isCorrect": true}, {"id": "bsIxR", "text": "$\\dfrac{36}{5}$ units/sec.", "image": null, "isCorrect": false}, {"id": "xtIMV", "text": "$\\dfrac{18}{5}$ units / sec.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $y = 2x^2$ and $\\dfrac{dx}{dt} = 2$.<br><br>Differentiating with respect to $t$, we get $\\dfrac{dy}{dt} = 4x \\dfrac{dx}{dt}$.<br><br>At $x = 1$, $\\dfrac{dy}{dt} = 4(1)(2) = 8$.<br><br>The distance of the point from the origin is $D = \\sqrt{x^2 + y^2}$.<br><br>Differentiating with respect to $t$, we get $2D \\dfrac{dD}{dt} = 2x \\dfrac{dx}{dt} + 2y \\dfrac{dy}{dt}$, which simplifies to $D \\dfrac{dD}{dt} = x \\dfrac{dx}{dt} + y \\dfrac{dy}{dt}$.<br><br>At the point $(1, 2)$, $D = \\sqrt{1^2 + 2^2} = \\sqrt{5}$.<br><br>Substituting the values, we get $\\sqrt{5} \\dfrac{dD}{dt} = (1)(2) + (2)(8)$.<br><br>$\\sqrt{5} \\dfrac{dD}{dt} = 2 + 16 = 18$.<br><br>$\\dfrac{dD}{dt} = \\dfrac{18}{\\sqrt{5}}$ units/sec.<br><br>Answer: $\\dfrac{18}{\\sqrt{5}}$ units $/ \\mathrm{sec}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c70aee93fa0796db6e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "Water is running in a hemispherical bowl of radius 180 cm at the rate of 108 cubic decimeters per minute. How fast the water level is rising when depth of the water level in the bowl is 120 cm ? ( 1 decimeter $=10 \\mathrm{~cm}$ )", "image": null}, "options": [{"id": "ReZYs", "text": "$16 \\pi \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "fPbyE", "text": "$\\dfrac{16}{\\pi} \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}, {"id": "oK5PI", "text": "$\\dfrac{1}{16 \\pi} \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": true}, {"id": "MPp4f", "text": "$\\dfrac{\\pi}{16} \\mathrm{~cm} / \\mathrm{s}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The volume $V$ of water in a hemispherical bowl of radius $R$ at a depth $h$ is given by the formula for the volume of a spherical cap:<br><br>$V = \\dfrac{\\pi h^2}{3}(3R - h)$<br><br>Differentiating both sides with respect to time $t$:<br><br>$\\dfrac{dV}{dt} = \\dfrac{\\pi}{3} \\left[ 2h(3R - h) \\dfrac{dh}{dt} + h^2 \\left( -\\dfrac{dh}{dt} \\right) \\right]$<br><br>$\\dfrac{dV}{dt} = \\pi h(2R - h) \\dfrac{dh}{dt}$<br><br>Given that the radius $R = 180$ cm, the depth $h = 120$ cm, and the rate of water flow $\\dfrac{dV}{dt} = 108$ dm$^3$/min.<br><br>Since $1$ dm $= 10$ cm, $1$ dm$^3 = 1000$ cm$^3$.<br><br>$\\dfrac{dV}{dt} = 108 \\times 1000 = 108000$ cm$^3$/min.<br><br>Substituting the given values into the differentiated equation:<br><br>$108000 = \\pi (120)(2(180) - 120) \\dfrac{dh}{dt}$<br><br>$108000 = \\pi (120)(360 - 120) \\dfrac{dh}{dt}$<br><br>$108000 = \\pi (120)(240) \\dfrac{dh}{dt}$<br><br>$108000 = 28800 \\pi \\dfrac{dh}{dt}$<br><br>$\\dfrac{dh}{dt} = \\dfrac{108000}{28800 \\pi} = \\dfrac{1080}{288 \\pi} = \\dfrac{15}{4 \\pi}$ cm/min.<br><br>To find the rate in cm/s, we divide by $60$:<br><br>$\\dfrac{dh}{dt} = \\dfrac{15}{4 \\pi \\times 60} = \\dfrac{15}{240 \\pi} = \\dfrac{1}{16 \\pi}$ cm/s.<br><br>Answer: $\\dfrac{1}{16 \\pi} \\mathrm{~cm} / \\mathrm{s}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b50aee93fa0796dae6", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "The approximate value of $(3.978)^{3 / 2}$ is", "image": null}, "options": [{"id": "F3U4Q", "text": "7.096", "image": null, "isCorrect": false}, {"id": "7IaQH", "text": "8.096", "image": null, "isCorrect": false}, {"id": "yLDLt", "text": "7.934", "image": null, "isCorrect": true}, {"id": "0NgjE", "text": "8.934", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x) = x^{3/2}$.<br><br>We need to find the approximate value of $f(3.978)$.<br><br>Let $x = 4$ and $\\Delta x = -0.022$.<br><br>Using the approximation formula $f(x + \\Delta x) \\approx f(x) + f'(x) \\Delta x$:<br><br>$f(4) = 4^{3/2} = 8$<br><br>$f'(x) = \\dfrac{3}{2} x^{1/2}$<br><br>$f'(4) = \\dfrac{3}{2} (4)^{1/2} = 3$<br><br>$f(3.978) \\approx 8 + 3(-0.022)$<br><br>$f(3.978) \\approx 8 - 0.066 = 7.934$<br><br>Answer: 7.934", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b30aee93fa0796dad7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "A square plate is contracting at the uniform rate $3 \\mathrm{~cm}^2 / \\mathrm{sec}$, then the rate at which the perimeter is decreasing, when the side of the square is 15 cm , is", "image": null}, "options": [{"id": "YyjUW", "text": "$\\dfrac{1}{5} \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "f7LAu", "text": "$\\dfrac{2}{5} \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": true}, {"id": "2yTCC", "text": "$\\dfrac{1}{10} \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "KN2wx", "text": "$\\dfrac{3}{10} \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the side of the square be $x$.<br><br>Area of the square, $A = x^2$<br><br>Differentiating with respect to time $t$, we get $\\dfrac{dA}{dt} = 2x \\dfrac{dx}{dt}$<br><br>Given that the area is contracting at the rate of $3 \\mathrm{~cm}^2/\\mathrm{sec}$, $\\dfrac{dA}{dt} = -3$<br><br>$-3 = 2x \\dfrac{dx}{dt} \\Rightarrow \\dfrac{dx}{dt} = \\dfrac{-3}{2x}$<br><br>Perimeter of the square, $P = 4x$<br><br>Differentiating with respect to time $t$, we get $\\dfrac{dP}{dt} = 4 \\dfrac{dx}{dt}$<br><br>Substituting the value of $\\dfrac{dx}{dt}$, we get $\\dfrac{dP}{dt} = 4 \\left( \\dfrac{-3}{2x} \\right) = \\dfrac{-6}{x}$<br><br>When $x = 15 \\mathrm{~cm}$, $\\dfrac{dP}{dt} = \\dfrac{-6}{15} = -\\dfrac{2}{5} \\mathrm{~cm}/\\mathrm{sec}$<br><br>The negative sign indicates that the perimeter is decreasing. Therefore, the rate of decrease of the perimeter is $\\dfrac{2}{5} \\mathrm{~cm}/\\mathrm{sec}$.<br><br>Answer: $\\dfrac{2}{5} \\mathrm{~cm} / \\mathrm{sec}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (0
