 "$9 \\mathrm{~cm}^2 / \\mathrm{min}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{A}=\\mathrm{a}^2$ and $\\frac{\\mathrm{da}}{\\mathrm{dt}}=3 \\mathrm{~cm} / \\mathrm{min}$\nNow $\\frac{\\mathrm{dA}}{\\mathrm{dt}}=2 \\mathrm{a} \\frac{\\mathrm{dA}}{\\mathrm{dt}}$\n$\\Rightarrow \\frac{\\mathrm{dA}}{\\mathrm{dt}}=2 \\times 6 \\times 3 \\mathrm{~cm}^2 / \\min =36 \\mathrm{~cm}^2 / \\min$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260eb0279619d9d8a285c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "A stone is dropped in a quiet lake and it is observed that waves move in circles, If the radius of a circular wave increases at the rate $2 \\mathrm{~cm} / \\mathrm{sec}$, then the rate of increase in its area at the instant when its radius is $10 \\mathrm{~cm}$, is $\\mathrm{cm}^2 / \\mathrm{sec}$.", "image": null}, "options": [{"id": "moGbl", "text": "$40 \\pi$", "image": null, "isCorrect": true}, {"id": "Yc2LI", "text": "$80 \\pi$", "image": null, "isCorrect": false}, {"id": "En9TY", "text": "$10 \\pi$", "image": null, "isCorrect": false}, {"id": "qmuXF", "text": "$20 \\pi$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\frac{d r}{d t}=2 \\mathrm{~cm} / \\mathrm{sec} r=10 \\mathrm{~cm}$\nWe have $A=\\pi r^2$\nDiff. w.r.t. $\\mathrm{t}$\n$\\begin{aligned} & \\frac{d A}{d t}=2 \\pi r \\frac{d r}{d t} \\\\ & =2 \\pi \\times 10 \\times 2 \\\\ & =40 \\pi\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260d70279619d9d8a27bf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "The distance ' $\\mathrm{s}$ ' in meters covered by a particle in $\\mathrm{t}$ seconds is given by $s=2+27 t-t^3$. The particle will stop after <img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/luPzKaQFjP2u82EjfruKwOgee1f6Xm73tgylXbYqW2A.original.fullsize.png\"><br>distance.", "image": null}, "options": [{"id": "Am7vv", "text": "65 meters", "image": null, "isCorrect": false}, {"id": "FFWc9", "text": "80 meters", "image": null, "isCorrect": false}, {"id": "QNB01", "text": "56 meters", "image": null, "isCorrect": true}, {"id": "NCDPo", "text": "60 meters", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\mathrm{s}=2+27 \\mathrm{t}-\\mathrm{t}^3$ and particle stops when its velocity is zero.\n$\\therefore \\frac{\\mathrm{ds}}{\\mathrm{dt}}=27-3 \\mathrm{t}^2=0 \\Rightarrow \\mathrm{t}^2=9 \\Rightarrow \\mathrm{t}=3 \\mathrm{sec} .$\n$\\therefore$ Distance covered in $3 \\mathrm{sec}$, is\n$\\mathrm{S}_{(\\mathrm{t}=3)}=2+27(3)-(3)^3=56 \\mathrm{~m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c60279619d9d8a2735", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "The radius of a circular plate is increasing at the rate of 0.01 $\\mathrm{cm} / \\mathrm{sec}$, when the radius is $12 \\mathrm{~cm}$. Then the rate at which the area increases is", "image": null}, "options": [{"id": "S9diF", "text": "$60 \\pi$ sq. cm $/ \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "QVUKs", "text": "$0.24 \\pi$ sq. cm $/ \\mathrm{sec}$", "image": null, "isCorrect": true}, {"id": "KL14s", "text": "$1.2 \\pi$ sq. cm $/ \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "lA67C", "text": "$24 \\pi$ sq. cm $/ \\mathrm{sec}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $\\frac{\\mathrm{dr}}{\\mathrm{dt}}=0.01$\n$$\n\\begin{aligned}\n& \\mathrm{A}=\\pi \\mathrm{r}^2 \\\\\n& \\therefore \\quad \\frac{\\mathrm{dA}}{\\mathrm{dt}}=\\pi(2 \\mathrm{r}) \\frac{\\mathrm{dr}}{\\mathrm{dt}}=(2 \\pi)(12)(0.01)=0.24 \\pi \\mathrm{sq} \\cdot \\mathrm{cm} / \\mathrm{sec}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2608c0279619d9d8a2560", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "A spherical raindrop evaporates at a rate proportional to its surface area. If its radius originally is $3 \\mathrm{~mm}$. and 1 hour later has been reduced to $2 \\mathrm{~mm}$, then the expression of radius $\\mathrm{r}$ of the raindrop at any time $t$ is (where $0 \\leq t < 3$ )", "image": null}, "options": [{"id": "Eqb3M", "text": "$\\mathrm{r}=\\mathrm{t}+5$", "image": null, "isCorrect": false}, {"id": "9uoRF", "text": "$r=t-5$", "image": null, "isCorrect": false}, {"id": "65mDf", "text": "$\\mathrm{r}=3-\\mathrm{t}$", "image": null, "isCorrect": true}, {"id": "fdMFC", "text": "$r=t+3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $\\frac{\\mathrm{dv}}{\\mathrm{dt}} \\propto-\\left(4 \\pi \\mathrm{r}^2\\right)$\nWe know that $\\mathrm{v}=\\frac{4}{3} \\pi \\mathrm{r}^2 \\Rightarrow \\frac{\\mathrm{dv}}{\\mathrm{dt}}=4 \\pi \\mathrm{r}^2 \\frac{\\mathrm{dr}}{\\mathrm{dt}}$\n$$\n\\begin{aligned}\n& \\therefore 4 \\pi \\mathrm{r}^2 \\frac{\\mathrm{dr}}{\\mathrm{dt}} \\propto-\\left(4 \\pi \\mathrm{r}^2\\right) \\\\\n& \\therefore 4 \\pi \\mathrm{r}^2 \\frac{\\mathrm{dr}}{\\mathrm{dt}}=\\left(-4 \\mathrm{k} \\pi \\mathrm{r}^2\\right) \\Rightarrow \\frac{\\mathrm{dr}}{\\mathrm{dt}}=-\\mathrm{k}\n\\end{aligned}\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/bHHdA1jBR0twhqo-gHi2m3I46GQK8xLQReTMrKGQNZ0.original.fullsize.png\"><br>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260780279619d9d8a24bd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "A spherical snow ball is forming so that its volume is increasing at the rate of $8 \\mathrm{~cm}^3 / \\mathrm{sec}$. Find the rate of increase of radius when radius is $2 \\mathrm{~cm}$", "image": null}, "options": [{"id": "G12h5", "text": "$\\pi \\mathrm{cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "JqZMT", "text": "$\\frac{1}{8 \\pi} \\mathrm{cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "9AZoJ", "text": "$2 \\pi \\mathrm{cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "JR4hf", "text": "$\\frac{1}{2 \\pi} \\mathrm{cm} / \\mathrm{sec}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\mathrm{V}=\\frac{4}{3} \\pi \\mathrm{r}^3$\n$\\therefore \\frac{\\mathrm{dV}}{\\mathrm{dt}}=\\frac{4}{3} \\pi\\left(3 \\mathrm{r}^2\\right) \\frac{\\mathrm{dr}}{\\mathrm{dt}}=4 \\pi \\mathrm{r}^2 \\frac{\\mathrm{dr}}{\\mathrm{dt}}$\n$\\therefore 8=4 \\pi(2)^2 \\frac{\\mathrm{dr}}{\\mathrm{dt}} \\Rightarrow \\frac{\\mathrm{dr}}{\\mathrm{dt}}=\\frac{1}{2 \\pi}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260520279619d9d8a238a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "A stone is dropped in a quiet lake and it is observed that waves move in circles, If the radius of a circular wave increases at the rate $2 \\mathrm{~cm} / \\mathrm{sec}$, then the rate of increase in its area at the instant when its radius is $10 \\mathrm{~cm}$, is $\\mathrm{cm}^2 / \\mathrm{sec}$.", "image": null}, "options": [{"id": "yAu7E", "text": "$40 \\pi$", "image": null, "isCorrect": true}, {"id": "iV1T1", "text": "$80 \\pi$", "image": null, "isCorrect": false}, {"id": "tTLuh", "text": "$10 \\pi$", "image": null, "isCorrect": false}, {"id": "T3zkP", "text": "$20 \\pi$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\frac{d r}{d t}=2 \\mathrm{~cm} / \\mathrm{sec} r=10 \\mathrm{~cm}$\nWe have $A=\\pi r^2$\nDiff. w.r.t. t\n$$\n\\begin{aligned}\n& \\frac{d A}{d t}=2 \\pi r \\frac{d r}{d t} \\\\\n& =2 \\pi \\times 10 \\times 2 \\\\\n& =40 \\pi\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260420279619d9d8a2305", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "The surface area of a spherical balloon is increasing at the rate $2 \\mathrm{~cm}^2 / \\mathrm{sec}$. Then rate of increase in the volume of the balloon is , when the radius of the balloon is $6 \\mathrm{~cm}$.", "image": null}, "options": [{"id": "7W1tJ", "text": "$4 \\mathrm{~cm}^3 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "6LwNN", "text": "$16 \\mathrm{~cm}^3 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "an4on", "text": "$36 \\mathrm{~cm}^3 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "bTyw7", "text": "$6 \\mathrm{~cm}^3 / \\mathrm{sec}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We have $\\frac{\\mathrm{dA}}{\\mathrm{dt}}=2$ and $\\mathrm{A}=4 \\pi \\mathrm{r}^2$\n$$\n\\begin{aligned}\n& \\therefore \\frac{\\mathrm{dA}}{\\mathrm{dt}}=8 \\pi \\mathrm{r} \\frac{\\mathrm{dt}}{\\mathrm{dt}} \\Rightarrow 2=8 \\pi(6) \\frac{\\mathrm{dr}}{\\mathrm{dt}} \\\\\n& \\therefore \\frac{\\mathrm{dr}}{\\mathrm{dt}}=\\frac{1}{24 \\pi}\n\\end{aligned}\n$$\nHere $\\mathrm{V}=\\frac{4}{3} \\pi \\mathrm{r}^3$\n$$\n\\begin{aligned}\n& \\therefore \\frac{\\mathrm{dV}}{\\mathrm{dt}}=4 \\pi \\mathrm{r}^2 \\frac{\\mathrm{dr}}{\\mathrm{dt}} \\\\\n& =4 \\pi(6)^2\\left(\\frac{1}{24 \\pi}\\right)=6 \\mathrm{~cm}^3 / \\mathrm{sec}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260410279619d9d8a22fd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "Water is being poured at the rate of $36 \\mathrm{~m}^3 / \\mathrm{min}$. into a cylindrical vessel, whose circular base is of radius $3 \\mathrm{~m}$. then the water level in the cylinder is rising at the rate of", "image": null}, "options": [{"id": "JO2q6", "text": "$\\frac{4}{\\pi} \\mathrm{m} / \\mathrm{min}$", "image": null, "isCorrect": true}, {"id": "B3uKr", "text": "$4 \\pi \\mathrm{m} / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "TADDb", "text": "$\\frac{1}{4 \\pi} \\mathrm{m} / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "qYjkR", "text": "$\\frac{2}{\\pi} \\mathrm{m} / \\mathrm{min}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Volume of cylinder $=\\pi \\mathrm{r}^2 \\mathrm{~h}$\n$$\n\\begin{aligned}\n& \\therefore \\frac{\\mathrm{dv}}{\\mathrm{dt}}=\\pi \\mathrm{r}^2 \\frac{\\mathrm{dh}}{\\mathrm{dt}} \\\\\n& \\therefore 36=\\pi(3)^2 \\frac{\\mathrm{dh}}{\\mathrm{dt}} \\Rightarrow \\frac{\\mathrm{dh}}{\\mathrm{dt}}=\\frac{4}{\\pi} \\mathrm{m} / \\mathrm{min}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260300279619d9d8a227a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "A particle is moving on a straight line. The distance $\\mathrm{S}$ travelled in time $t$ is given by $S=a t^2+b t+6$. If the particle comes to rest after 4 seconds at a distance of $16 \\mathrm{~m}$. from the starting point, then the acceleration of the particle is.", "image": null}, "options": [{"id": "aMJ4r", "text": "$\\frac{-3}{4} \\mathrm{~m} / \\mathrm{sec}^2$", "image": null, "isCorrect": false}, {"id": "WOEE3", "text": "$\\frac{-1}{2} \\mathrm{~m} / \\mathrm{sec}^2$", "image": null, "isCorrect": false}, {"id": "K5KSl", "text": "$-1 \\mathrm{~m} / \\mathrm{sec}^2$", "image": null, "isCorrect": false}, {"id": "C1gAi", "text": "$\\frac{-5}{4} \\mathrm{~m} / \\mathrm{sec}^2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{S}=\\mathrm{at} \\mathrm{t}^2+\\mathrm{bt}+6 \\\\\n& \\therefore \\mathrm{V}=\\frac{\\mathrm{dS}}{\\mathrm{dt}}=2 \\mathrm{at}+\\mathrm{b} \\text { and } \\mathrm{A}=\\frac{\\mathrm{d}^2 \\mathrm{~S}}{\\mathrm{dt}^2}=2 \\mathrm{a}\n\\end{aligned}\n$$\nWhen particle comes to rest,\n$$\n\\begin{aligned}\n& S=16, \\mathrm{t}=4, \\mathrm{~V}=0 \\\\\n& \\therefore 16=\\mathrm{a}(4)^2+\\mathrm{b}(4)+6 \\\\\n& \\Rightarrow 16 \\mathrm{a}+4 \\mathrm{~b}=10 \\ldots(1)\n\\end{aligned}\n$$\nAlso $0=2 \\mathrm{a}(1)(2)+4$\n$$\n\\Rightarrow \\mathrm{b}=-8 \\mathrm{a}\n$$\nFrom (1) and (2), we get\n$$\n16 a+4(8 a)=10 \\Rightarrow-16=10 \\Rightarrow a=\\frac{-5}{9}\n$$\nWe have acceleration $\\mathrm{A}=2 \\mathrm{a}=2\\left(\\frac{-5}{8}\\right)=\\frac{-5}{4} \\mathrm{~m} / \\mathrm{sec}^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2601d0279619d9d8a21e0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "The approximate value of $(66)^{\\frac{1}{3}}$ is", "image": null}, "options": [{"id": "9DRLf", "text": "$4.0416$", "image": null, "isCorrect": true}, {"id": "Ig2Aw", "text": "$4.0447$", "image": null, "isCorrect": false}, {"id": "WCRqP", "text": "$4.0433$", "image": null, "isCorrect": false}, {"id": "QQM25", "text": "$4.0481$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\mathrm{a}=64, \\mathrm{~h}=2$ and let $\\mathrm{f}(\\mathrm{x})=\\mathrm{x}^{\\frac{1}{3}} \\Rightarrow \\mathrm{f}^{\\prime}(\\mathrm{x})=\\frac{1}{3} \\mathrm{x}^{-\\frac{2}{3}}=\\frac{1}{3 \\mathrm{x}^{\\frac{2}{3}}}$\n$\\therefore \\mathrm{f}(\\mathrm{a})=64^{\\frac{1}{3}}=4 \\quad$ and $\\quad \\mathrm{f}^{\\prime}(\\mathrm{a})=\\frac{1}{3(64)^{\\frac{2}{3}}}=\\frac{1}{3(16)}=\\frac{1}{48}$\nWe have $\\mathrm{f}(\\mathrm{a}+\\mathrm{h}) \\neq \\mathrm{f}(\\mathrm{a})+\\mathrm{h} \\cdot \\mathrm{f}^{\\prime}(\\mathrm{a})$\n$\\therefore(66)^{\\frac{1}{3}} \\div 4+(2)\\left(\\frac{1}{48}\\right) \\div 4+\\frac{1}{24} \\div 4.0416$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260090279619d9d8a213b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "The approximate value of $f(x)=3 x^{2}+5 x+3$ at $x=3 \\cdot 02$ is", "image": null}, "options": [{"id": "Dq00e", "text": "$45.46$", "image": null, "isCorrect": false}, {"id": "9U0DD", "text": "$v=45 \\cdot 46$", "image": null, "isCorrect": true}, {"id": "BePTj", "text": "$44 \\cdot 76$", "image": null, "isCorrect": false}, {"id": "fjNTT", "text": "$44 \\cdot 46$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x)=3 x^{2}+5 x+3 \\Rightarrow f^{\\prime}(x)=6 x+5$\nLet $\\mathrm{a}=3, \\mathrm{~h}=0.02$\n$\\therefore \\mathrm{f}(\\mathrm{a}) \\quad=\\mathrm{f}(3)=27+15+3=45$\n$f^{\\prime}(a)=f^{\\prime}(3) \\quad=18+5=23$\nWe know that\n$$\n\\begin{aligned}\n\\mathrm{f}(\\mathrm{a}+\\mathrm{h}) & \\div \\mathrm{f}(\\mathrm{a})+\\mathrm{hf}^{\\prime}(\\mathrm{a}) \\\\\n&=45+(0.02)(23)=45+0.46=45.46\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ff80279619d9d8a20ae", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "The area of the square increases at the rate of $0.5 \\mathrm{~cm}^{2} / \\mathrm{sec}$. The rate at which its\nperimeter is increasing when the side of the square is $10 \\mathrm{~cm}$ long, is", "image": null}, "options": [{"id": "an7d0", "text": "$0 \\cdot 3 \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "URlYg", "text": "$0 \\cdot 1 \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": true}, {"id": "VwUNg", "text": "$0 \\cdot 2 \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "Dgfe8", "text": "$0 \\cdot 4 \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\nLet $x$ be the side of the square. Then area $A=x^{2}$\n$\\therefore \\frac{\\mathrm{d} \\mathrm{A}}{\\mathrm{dt}}=2 \\mathrm{x} \\frac{\\mathrm{dx}}{\\mathrm{dt}} \\Rightarrow 0.5=2(10) \\frac{\\mathrm{d} \\mathrm{x}}{\\mathrm{dt}}$\n$\\therefore \\frac{\\mathrm{dx}}{\\mathrm{dt}}=0.025$\nNow perimeter $=4 \\mathrm{x}=\\mathrm{p}$\n$\\therefore \\frac{\\mathrm{dp}}{\\mathrm{dt}}=4 \\frac{\\mathrm{dx}}{\\mathrm{dt}}=4(0.025)=0.1 \\mathrm{~cm} / \\mathrm{sec} .$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc20279619d9d8a1f05", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "The approximate value of the function $f(x)=x^{3}-3 x+5$ at $x=1.99$ is", "image": null}, "options": [{"id": "mW65L", "text": "6.91", "image": null, "isCorrect": true}, {"id": "ploK8", "text": "6.94", "image": null, "isCorrect": false}, {"id": "XMd5h", "text": "7.94", "image": null, "isCorrect": false}, {"id": "NPHNk", "text": "7.91", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\n$f(x)=x^{3}-3 x+5 \\Rightarrow f^{\\prime}(x)=3 x^{2}-3$\nLet $a=2, h=-0.01$\n$\\therefore f(a)=f(2)=2^{3}-3(2)+5=7$\n$f^{\\prime}(a)=f^{\\prime}(2)=3(2)^{2}-3=9$\nWe know that $f(a+h) \\neq f(a)+h f^{\\prime}(a)$\n$f(1.99) \\div 7-(0.01)(9) \\div 7-0.09 \\neq 6.91$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25faa0279619d9d8a1e4d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "The approximate value of the function $\\mathrm{f}(x)=x^{3}+5 x^{2}-7 x+10$ at $x=1 \\cdot 1$ is", "image": null}, "options": [{"id": "fww8o", "text": "$7 \\cdot 6$", "image": null, "isCorrect": false}, {"id": "4xmL3", "text": "$8 \\cdot 6$", "image": null, "isCorrect": false}, {"id": "bmzI6", "text": "$6 \\cdot 6$", "image": null, "isCorrect": false}, {"id": "aYedJ", "text": "$9 \\cdot 6$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $f(x)=x^{3}+5 x^{2}-7 x+10 \\Rightarrow f^{\\prime}(x)=3 x^{2}+10 x-7$\nLet $a=1, h=0.1$\n$\\therefore \\mathrm{f}(1)=1+5-7+10=9$ and $\\mathrm{f}^{\\prime}(1)=3+10-7=6$\nWe know that $\\mathrm{f}(\\mathrm{a}+\\mathrm{h}) \\div \\mathrm{f}(\\mathrm{a})+\\mathrm{hf}^{\\prime}(\\mathrm{a})$\n$f(1.1)=9+(0.1)(6)=9+0.6=9.6$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f850279619d9d8a1d24", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "The approximate value of $\\log _{10} 99$ is $\\quad\\left(\\right.$ Given $\\log _{10} \\mathrm{e}=0.4343$ )", "image": null}, "options": [{"id": "dQrQ3", "text": "$1.9657$", "image": null, "isCorrect": false}, {"id": "hQMAh", "text": "$1.9857$", "image": null, "isCorrect": false}, {"id": "U4QpS", "text": "$1.1 .9957$", "image": null, "isCorrect": true}, {"id": "1Yzxy", "text": "$1.9757$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x)=\\log _{10} x=\\frac{\\log _{e} x}{\\log _{e} 10}$\n$f^{\\prime}(x)=\\frac{1}{x \\log 10}$\nLet $\\mathrm{a}=100, \\mathrm{~h}=-1$\n$\\therefore f(a)=\\log _{10} 100 \\quad=\\log _{10} 10^{2}=2$\n$f^{\\prime}(a)=\\frac{1}{100 \\times \\log _{e} 10}=\\frac{1}{100} \\log _{10} e=\\frac{1}{100} \\times 0.4343$\nWe know that\n$$\n\\begin{aligned}\nf(a-h) & \\doteqdot f(a)+h f^{\\prime}(a) \\\\\n& \\doteqdot 2+(-1) \\times \\frac{1}{100}(0.4343)=2-0.004343=1.995657 \\\\\n& \\doteqdot 1.9957\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f850279619d9d8a1d21", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "If the displacement of a particle at a point is given by $s=3 t^{2}-12 t+14$, then the\ndisplacement of the particle when its velocity becomes zero is", "image": null}, "options": [{"id": "YfwFr", "text": "14 units", "image": null, "isCorrect": false}, {"id": "V4LD0", "text": "4 units", "image": null, "isCorrect": false}, {"id": "2op5P", "text": "0 units", "image": null, "isCorrect": false}, {"id": "61Zld", "text": "2 units", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $\\quad s \\quad=3 t^{2}-12 t+14$\n$$\nv=\\frac{d s}{d t}=6 t-12\n$$\nWhen $v=0$, we get $t=2$\n$\\therefore \\mathrm{s}=(3 \\times 4)-(12 \\times 2)+14=12-24+14=2$ units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f710279619d9d8a1c85", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "A particle moves according to the law $s=t^{3}-6 t^{2}+9 t+25 .$ The displacement of", "image": null}, "options": [{"id": "dIQQ1", "text": "0 units", "image": null, "isCorrect": false}, {"id": "B36Ql", "text": "-27 units", "image": null, "isCorrect": false}, {"id": "Cjokg", "text": "27 units", "image": null, "isCorrect": true}, {"id": "6pbjU", "text": "9 units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $s=t^{3}-6 t^{2}+9 t+25$ ....(1)\n$$\n\\begin{array}{l}v=\\frac{d s}{d t}=3 t^{2}-12 t+9 \\\\ \\frac{d v}{d t}=6 t-12\\end{array}\n$$\nGiven $6 t-12=0 \\Rightarrow t=2$\n$\\therefore$ from $(1), s=(2)^{3}-6 \\times 4+18+25=27$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f620279619d9d8a1c0c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "The approximate value of $\\cot ^{-1}(1 \\cdot 001)$ is", "image": null}, "options": [{"id": "hGpo0", "text": "$\\frac{\\pi}{4}-0 \\cdot 0005$", "image": null, "isCorrect": true}, {"id": "tBJjC", "text": "$\\frac{\\pi}{4}+0 \\cdot 005$", "image": null, "isCorrect": false}, {"id": "SFtdv", "text": "$\\frac{\\pi}{4}+0 \\cdot 0005$", "image": null, "isCorrect": false}, {"id": "Mwdns", "text": "$\\frac{\\pi}{4}-0 \\cdot 005$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x)=\\cos ^{-1} x \\Rightarrow f^{\\prime}(x)=\\frac{-1}{1+x^{2}}$\nLet, $\\mathrm{a}=1, \\mathrm{~h}=0.001$\nNow $\\mathrm{f}(\\mathrm{a})=\\cot ^{-1} 1=\\frac{\\pi}{4}$ and $\\mathrm{f}^{\\prime}(\\mathrm{a})=\\frac{-1}{1+1}=-\\frac{1}{2}$\nWe know that, $f(a+h) \\doteqdot f(a)+h f^{\\prime}(a)$\n$=\\frac{\\pi}{4}+(0.001)\\left(-\\frac{1}{2}\\right)=\\frac{\\pi}{4}-0.0005$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f4f0279619d9d8a1b6c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 1)", "title": "MHT CET 2020 (13 Oct Shift 1)"}], "question": {"text": "The radius of a circle is increasing at the rate $2 \\mathrm{~cm} / \\mathrm{sec}$. The rate at which its area is\nincreasing when the radius of the circle is 5 decimeters is", "image": null}, "options": [{"id": "ltl7e", "text": "$100 \\pi \\mathrm{cm}^{2} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "0akOt", "text": "$200 \\pi \\mathrm{cm}^{2} / \\mathrm{sec}$", "image": null, "isCorrect": true}, {"id": "mua7G", "text": "$2000 \\pi \\mathrm{cm}^{2} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "5zGml", "text": "$20 \\pi \\mathrm{cm}^{2} / \\mathrm{sec}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here $\\frac{\\mathrm{dr}}{\\mathrm{dt}}=2$ and $\\mathrm{r}=5$ decimeter $=50 \\mathrm{~cm}$ \nNow Area of circle $=\\mathrm{A}=\\pi \\mathrm{r}^{2}$.\n$\\begin{aligned}\n\\therefore \\frac{\\mathrm{d} \\mathrm{A}}{\\mathrm{dt}} &=2 \\pi \\mathrm{r} \\frac{\\mathrm{dr}}{\\mathrm{dt}} \\\\\n&=2 \\times \\pi \\times 50 \\times 2=200 \\pi \\mathrm{cm}^{2} / \\mathrm{sec}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f69", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T09:00:00.000Z", "isVisible": true, "shor mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea70279619d9d8a1633", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The height of right circular cylinder of maximum volume inscribed in a sphere of diameter $2 a$ is", "image": null}, "options": [{"id": "yvIbL", "text": "$2 \\sqrt{3} a$", "image": null, "isCorrect": false}, {"id": "2uaOO", "text": "$\\sqrt{3} a$", "image": null, "isCorrect": false}, {"id": "gRC0e", "text": "$\\frac{2 a}{\\sqrt{3}}$", "image": null, "isCorrect": true}, {"id": "85d3R", "text": "$\\frac{a}{\\sqrt{3}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the radius and height of the cylinder are and $h$, respectively.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/F2DXSEKSRvmuhVwpM35Nu44kM7b7fDXt13sq3cEgXHY.original.fullsize.png\"><br>\nIn $\\triangle A O M$\n$\\therefore$\n$$\n\\begin{array}{l}\nr^{2}+\\left(\\frac{h^{2}}{4}\\right)=a^{2} \\\\\nh^{2}=4\\left(a^{2}-r^{2}\\right)\n\\end{array}\n$$\nNow, $V=\\pi r^{2} h=\\pi\\left(a^{2} h-\\frac{1}{4} h^{3}\\right)$\nFor max or min,\n$$\n\\begin{aligned}\n& \\frac{d V}{d h} &=\\pi\\left(a^{2}-\\frac{3}{4} h^{2}\\right)=0 \\\\\n\\Rightarrow & h &=\\left(\\frac{2}{\\sqrt{3}}\\right) a\n\\end{aligned}\n$$\nNow, $\\quad \\frac{d^{2} V}{d h^{2}}=-\\frac{6 h}{4} < 0$\nSo, $V$ is maximum at $h=\\frac{2 a}{\\sqrt{3}}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea40279619d9d8a161b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "Divide 10 into two parts such that the sum of double of the first and the square of the second is minimum", "image": null}, "options": [{"id": "wzuqd", "text": "$(6,4)$", "image": null, "isCorrect": false}, {"id": "esy5a", "text": "$(7,3)$", "image": null, "isCorrect": false}, {"id": "tvsYs", "text": "$(8,2)$", "image": null, "isCorrect": false}, {"id": "SHJYv", "text": "$(9,1)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $x$ and $y$ be the two parts of the number 10 .\n$\\therefore$\n$x+y=10\\ldots$ (i)\nAccording to the question, Let $\\quad \\begin{aligned} A &=2 x+y^{2} \\\\ &=2 x+(10-x)^{2} \\\\ &=2 x+100+x^{2}-20 x \\\\ &=x^{2}-18 x+100 \\end{aligned}$\nOn differentiating w.r.t. $x$, we get $\\frac{d A}{d x}=2 x-18$\nFor max or min of $A$, Put $\\quad \\frac{d A}{d x}=0=2 x-18$\n$\\Rightarrow$\n$x=9$\nNow, $\\quad \\frac{d^{2} A}{d x^{2}}=2>0 \\quad(\\min )$\nOn putting $x=9$ in Eq. (i), we get $y=1$\n$\\therefore \\quad(x, y)=(9,1)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e6c0279619d9d8a144a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "The approximate value of $\\sqrt[3]{28}$ is", "image": null}, "options": [{"id": "U4vYU", "text": "$3.0037$", "image": null, "isCorrect": false}, {"id": "9utJX", "text": "$3.037$", "image": null, "isCorrect": true}, {"id": "XyVh9", "text": "$3.0086$", "image": null, "isCorrect": false}, {"id": "nyCzc", "text": "$3.37$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $y=\\sqrt[3]{28}$\nTaking log on both sides, we get\n$=3.037$ (approximately)", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4c0279619d9d8a134d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The maximum area of the rectangle that can be inscribed in a circle of radius $r$, is", "image": null}, "options": [{"id": "Nk0ev", "text": "$\\pi r^{2}$", "image": null, "isCorrect": false}, {"id": "3BrLe", "text": "$r^{2}$", "image": null, "isCorrect": false}, {"id": "lJfG8", "text": "$\\pi r^{2} / 4$", "image": null, "isCorrect": false}, {"id": "djUz4", "text": "$2 r^{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Area of rectangle,\n$$\n\\begin{aligned}\nA &=2 x \\cdot 2 \\sqrt{r^{2}-x^{2}} \\\\\n&=4 x \\sqrt{r^{2}-x^{2}} \\\\\n\\frac{d A}{d x} &=\\frac{4\\left(r^{2}-2 x^{2}\\right)}{\\sqrt{r^{2}-x^{2}}}\n\\end{aligned}\n$$\nFor maximum or minimum put $\\frac{d A}{d x}=0$\n$$\n\\Rightarrow \\quad x=r / \\sqrt{2}\n$$\nIt can be easily checked that $\\frac{d^{2} A}{d x^{2}} < 0$ for this value of $x$. $\\therefore A$ is maximum for $x=\\frac{r}{\\sqrt{2}}$ and the maximum value of $A$ is given by\n$$\nA=4 \\frac{r}{\\sqrt{2}} \\sqrt{r^{2}-\\frac{r^{2}}{2}}=2 r^{2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4b0279619d9d8a134a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The positive root of $x^{2}-78.8=0$ after first approximation by Newton Raphson method assuming initial approximation to the root is 14, is", "image": null}, "options": [{"id": "aLu4d", "text": "$9.821$", "image": null, "isCorrect": false}, {"id": "ouNiI", "text": "$9.814$", "image": null, "isCorrect": true}, {"id": "HYcj2", "text": "$9.715$", "image": null, "isCorrect": false}, {"id": "fu8FI", "text": "$9.915$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Here, $\\quad x_{0}=14, f(x)=x^{2}-78.8$\nand $f^{\\prime}(x)=2 x$\n$$\n\\begin{aligned}\n\\therefore \\quad x_{1}=x_{0}-& \\frac{f\\left(x_{0}\\right)}{f^{\\prime}\\left(x_{0}\\right)} \\\\\n&=14-\\frac{(14)^{2}-(78.8)}{2 \\times 14}=9.814\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "65a263380279619d9d8a3d25", "title": "Monotonicity", "totalQuestions": 50, "questions": [{"_id": "6abb88d915a9fc0fc8c14787", "type": "singleCorrect", "question": {"text": "Let $f(x) = (a+2)x^3 - 3ax^2 + 9ax - 5$. If $f(x)$ is strictly decreasing for all $x \\in R$, then the interval in which $a$ lies is", "image": null}, "options": [{"id": "CCEWI", "label": "A", "text": "$(-\\infty, -3)$", "isCorrect": true, "image": null}, {"id": "VCR5e", "label": "B", "text": "$(-\\infty, -2)$", "isCorrect": false, "image": null}, {"id": "cyLI4", "label": "C", "text": "$(0, \\infty)$", "isCorrect": false, "image": null}, {"id": "TSIN8", "label": "D", "text": "$(-\\infty, -5)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $f(x) = (a+2)x^3 - 3ax^2 + 9ax - 5$<br><br>Differentiating with respect to $x$, we get:<br><br>$f'(x) = 3(a+2)x^2 - 6ax + 9a$<br><br>For $f(x)$ to be strictly decreasing for all $x \\in R$, $f'(x) \\le 0$ for all $x \\in R$.<br><br>For a quadratic expression $Ax^2 + Bx + C \\le 0$ for all $x \\in R$, the leading coefficient must be negative ($A < 0$) and the discriminant must be less than or equal to zero ($D \\le 0$).<br><br>Condition 1: Leading coefficient is negative<br><br>$3(a+2) < 0 \\Rightarrow a < -2$<br><br>Condition 2: Discriminant $D \\le 0$<br><br>$D = (-6a)^2 - 4(3(a+2))(9a) \\le 0$<br><br>$36a^2 - 108a(a+2) \\le 0$<br><br>$36a^2 - 108a^2 - 216a \\le 0$<br><br>$-72a^2 - 216a \\le 0$<br><br>Dividing by $-72$ and reversing the inequality sign:<br><br>$a^2 + 3a \\ge 0$<br><br>$a(a+3) \\ge 0$<br><br>$a \\in (-\\infty, -3] \\cup [0, \\infty)$<br><br>Taking the intersection of Condition 1 and Condition 2, we get:<br><br>$a \\in (-\\infty, -3]$<br><br>From the given options, the interval in which $a$ lies is $(-\\infty, -3)$.<br><br>Answer: $(-\\infty, -3)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886815a9fc0fc8c1436d", "type": "singleCorrect", "question": {"text": "Let $f(x)$ be the cubic polynomial having one of its roots as $x = -1$. If $f(0) = 4, f'(0) = 0, f''(1) = 0$, then...", "image": null}, "options": [{"id": "vTz6h", "label": "A", "text": "$f(x)$ is increasing in $(-\\infty, 0) \\cup (2, \\infty)$", "isCorrect": true, "image": null}, {"id": "SyM1O", "label": "B", "text": "$f(x)$ is decreasing in $(-\\infty, 0) \\cup (2, \\infty)$", "isCorrect": false, "image": null}, {"id": "LlBub", "label": "C", "text": "$f(x)$ is increasing in $(0, 2)$", "isCorrect": false, "image": null}, {"id": "c9mTI", "label": "D", "text": "$f(x)$ is decreasing in $(2, \\infty)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the cubic polynomial be $f(x) = ax^3 + bx^2 + cx + d$.<br><br>Given $f(0) = 4$, we have $d = 4$.<br><br>Differentiating $f(x)$ with respect to $x$, we get:<br>$f'(x) = 3ax^2 + 2bx + c$<br><br>Given $f'(0) = 0$, we have $c = 0$.<br><br>Differentiating again, we get:<br>$f''(x) = 6ax + 2b$<br><br>Given $f''(1) = 0$, we have $6a + 2b = 0 \\Rightarrow b = -3a$.<br><br>Since $x = -1$ is a root of $f(x)$, $f(-1) = 0$:<br>$-a + b - c + d = 0$<br><br>Substituting $b = -3a$, $c = 0$, and $d = 4$:<br>$-a - 3a - 0 + 4 = 0 \\Rightarrow 4a = 4 \\Rightarrow a = 1$<br><br>Thus, $b = -3(1) = -3$.<br><br>The polynomial is $f(x) = x^3 - 3x^2 + 4$.<br><br>To find the intervals of monotonicity, we find $f'(x)$:<br>$f'(x) = 3x^2 - 6x = 3x(x - 2)$<br><br>Setting $f'(x) = 0$ gives critical points $x = 0$ and $x = 2$.<br><br>For $x \\in (-\\infty, 0) \\cup (2, \\infty)$, $f'(x) > 0$, so $f(x)$ is strictly increasing.<br>For $x \\in (0, 2)$, $f'(x) < 0$, so $f(x)$ is strictly decreasing.<br><br>Therefore, $f(x)$ is increasing in $(-\\infty, 0) \\cup (2, \\infty)$.<br><br>Answer: $f(x)$ is increasing in $(-\\infty, 0) \\cup (2, \\infty)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f68c30a4553e1bdeab", "type": "singleCorrect", "question": {"text": "Let $g(x) = f(x) + f(1-x)$ and $f''(x) < 0, 0 \\leq x \\leq 1$, then $\\ldots$", "image": null}, "options": [{"id": "r5WFt", "label": "A", "text": "$g(x)$ increases on $\\left[\\dfrac{1}{2}, 1\\right]$ and $g(x)$ decreases on $\\left[0, \\dfrac{1}{2}\\right]$", "isCorrect": false, "image": null}, {"id": "0No0I", "label": "B", "text": "$g(x)$ decreases on $[0, 1]$", "isCorrect": false, "image": null}, {"id": "43mvT", "label": "C", "text": "$g(x)$ increases on $[0, 1]$", "isCorrect": false, "image": null}, {"id": "3B7QO", "label": "D", "text": "$g(x)$ decreases on $\\left[\\dfrac{1}{2}, 1\\right]$ and $g(x)$ increases on $\\left[0, \\dfrac{1}{2}\\right]$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $g(x) = f(x) + f(1-x)$<br><br>Differentiating with respect to $x$, we get:<br><br>$g'(x) = f'(x) - f'(1-x)$<br><br>It is given that $f''(x) < 0$ for $0 \\leq x \\leq 1$, which implies that $f'(x)$ is a strictly decreasing function on $[0, 1]$.<br><br>For $g(x)$ to be increasing, $g'(x) > 0$:<br><br>$f'(x) - f'(1-x) > 0$<br><br>$f'(x) > f'(1-x)$<br><br>Since $f'(x)$ is strictly decreasing, the input values must satisfy the reverse inequality:<br><br>$x < 1 - x$<br><br>$2x < 1 \\Rightarrow x < \\dfrac{1}{2}$<br><br>Thus, $g(x)$ is increasing on $\\left[0, \\dfrac{1}{2}\\right]$.<br><br>For $g(x)$ to be decreasing, $g'(x) < 0$:<br><br>$f'(x) - f'(1-x) < 0$<br><br>$f'(x) < f'(1-x)$<br><br>Again, since $f'(x)$ is strictly decreasing, the input values must satisfy:<br><br>$x > 1 - x$<br><br>$2x > 1 \\Rightarrow x > \\dfrac{1}{2}$<br><br>Thus, $g(x)$ is decreasing on $\\left[\\dfrac{1}{2}, 1\\right]$.<br><br>Answer: $g(x)$ decreases on $\\left[\\dfrac{1}{2}, 1\\right]$ and $g(x)$ increases on $\\left[0, \\dfrac{1}{2}\\right]$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2cc8c30a4553e1bdce9", "type": "singleCorrect", "question": {"text": "The function $f(x) = \\int \\dfrac{x+3}{x^2-9x+20}\\,dx$, then $f(x)$ is", "image": null}, "options": [{"id": "aH3pg", "label": "A", "text": "increases on R", "isCorrect": false, "image": null}, {"id": "8YieV", "label": "B", "text": "decreases on R - (4, 5)", "isCorrect": false, "image": null}, {"id": "MqJRN", "label": "C", "text": "decreases on $(-\\infty, -3] \\cup (4, 5)$", "isCorrect": true, "image": null}, {"id": "9uFiA", "label": "D", "text": "increases on $(-3, \\infty)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $f(x) = \\int \\dfrac{x+3}{x^2-9x+20}\\,dx$<br><br>Differentiating with respect to $x$, we get:<br><br>$f'(x) = \\dfrac{x+3}{x^2-9x+20} = \\dfrac{x+3}{(x-4)(x-5)}$<br><br>For $f(x)$ to be decreasing, $f'(x) \\le 0$.<br><br>$\\dfrac{x+3}{(x-4)(x-5)} \\le 0$<br><br>The critical points are $x = -3$, $x = 4$, and $x = 5$.<br><br>Using the wavy curve method to determine the sign of $f'(x)$ in different intervals:<br><br>For $x \\in (5, \\infty)$, $f'(x) > 0$<br><br>For $x \\in (4, 5)$, $f'(x) < 0$<br><br>For $x \\in (-3, 4)$, $f'(x) > 0$<br><br>For $x \\in (-\\infty, -3)$, $f'(x) < 0$<br><br>Therefore, $f'(x) \\le 0$ for $x \\in (-\\infty, -3] \\cup (4, 5)$.<br><br>Hence, $f(x)$ decreases on $(-\\infty, -3] \\cup (4, 5)$.<br><br>Answer: decreases on $(-\\infty, -3] \\cup (4, 5)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2cc8c30a4553e1bdce8", "type": "singleCorrect", "question": {"text": "If $f(x) = \\log(1 + x) - \\dfrac{x}{1+x}$, then the values of $x$ for which $f(x)$ is monotonically increasing and monotonically decreasing are respectively.....", "image": null}, "options": [{"id": "Oc39O", "label": "A", "text": "$(-\\infty, 0), (0, \\infty)$", "isCorrect": false, "image": null}, {"id": "eT3dW", "label": "B", "text": "$(0, \\infty), (-\\infty, 0)$", "isCorrect": false, "image": null}, {"id": "l39oC", "label": "C", "text": "$(-1, 0), (0, \\infty)$", "isCorrect": false, "image": null}, {"id": "8HNMk", "label": "D", "text": "$(0, \\infty), (-1, 0)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The given function is $f(x) = \\log(1 + x) - \\dfrac{x}{1+x}$<br><br>The domain of the function is $1 + x > 0 \\Rightarrow x > -1$<br><br>Differentiating $f(x)$ with respect to $x$:<br><br>$f'(x) = \\dfrac{1}{1+x} - \\dfrac{(1+x) \\cdot 1 - x \\cdot 1}{(1+x)^2}$<br><br>$f'(x) = \\dfrac{1}{1+x} - \\dfrac{1}{(1+x)^2}$<br><br>$f'(x) = \\dfrac{1+x-1}{(1+x)^2} = \\dfrac{x}{(1+x)^2}$<br><br>For $f(x)$ to be monotonically increasing, $f'(x) > 0$<br><br>$\\dfrac{x}{(1+x)^2} > 0 \\Rightarrow x > 0$<br><br>Thus, $f(x)$ is monotonically increasing on $(0, \\infty)$<br><br>For $f(x)$ to be monotonically decreasing, $f'(x) < 0$<br><br>$\\dfrac{x}{(1+x)^2} < 0 \\Rightarrow x < 0$<br><br>Considering the domain $x > -1$, $f(x)$ is monotonically decreasing on $(-1, 0)$<br><br>The intervals for monotonically increasing and decreasing are $(0, \\infty)$ and $(-1, 0)$ respectively.<br><br>Answer: $(0, \\infty), (-1, 0)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d33b8c30a4553e1be197", "type": "singleCorrect", "question": {"text": "The function $f(x) = \\tan^{-1}(\\sin x + \\cos x)$ is an increasing function in the interval.....", "image": null}, "options": [{"id": "lsnvU", "label": "A", "text": "$\\left(0, \\dfrac{\\pi}{2}\\right)$", "isCorrect": false, "image": null}, {"id": "XhTVS", "label": "B", "text": "$\\left(\\dfrac{-\\pi}{2}, \\dfrac{\\pi}{2}\\right)$", "isCorrect": false, "image": null}, {"id": "6kHJL", "label": "C", "text": "$\\left(\\dfrac{\\pi}{4}, \\dfrac{\\pi}{2}\\right)$", "isCorrect": false, "image": null}, {"id": "YVCDM", "label": "D", "text": "$\\left(\\dfrac{-\\pi}{2}, \\dfrac{\\pi}{4}\\right)$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $f(x) = \\tan^{-1}(\\sin x + \\cos x)$<br><br>Differentiating with respect to $x$, we get:<br><br>$f'(x) = \\dfrac{1}{1 + (\\sin x + \\cos x)^2} \\times \\dfrac{d}{dx}(\\sin x + \\cos x)$<br><br>$f'(x) = \\dfrac{\\cos x - \\sin x}{1 + (\\sin x + \\cos x)^2}$<br><br>For $f(x)$ to be an increasing function, $f'(x) > 0$.<br><br>Since the denominator $1 + (\\sin x + \\cos x)^2$ is always positive for all real $x$, the sign of $f'(x)$ depends entirely on the numerator.<br><br>$\\Rightarrow \\cos x - \\sin x > 0$<br><br>$\\Rightarrow \\cos x > \\sin x$<br><br>From the standard trigonometric graphs, the inequality $\\cos x > \\sin x$ holds true in the interval $\\left(\\dfrac{-\\pi}{2}, \\dfrac{\\pi}{4}\\right)$.<br><br>Therefore, the function is increasing in the interval $\\left(\\dfrac{-\\pi}{2}, \\dfrac{\\pi}{4}\\right)$.<br><br>Answer: $\\left(\\dfrac{-\\pi}{2}, \\dfrac{\\pi}{4}\\right)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3668c30a4553e1be359", "type": "singleCorrect", "question": {"text": "The value of $k$ such that the function $f(x) = \\sin x - \\cos x - kx + b$ is strictly decreasing for all real $x$ is", "image": null}, "options": [{"id": "xI9NL", "label": "A", "text": "$k < 1$", "isCorrect": false, "image": null}, {"id": "karf0", "label": "B", "text": "$k > 1$", "isCorrect": false, "image": null}, {"id": "OReWE", "label": "C", "text": "$k < \\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "zTyLq", "label": "D", "text": "$k > \\sqrt{2}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $f(x) = \\sin x - \\cos x - kx + b$<br><br>Differentiating with respect to $x$, we get:<br><br>$f'(x) = \\cos x + \\sin x - k$<br><br>For $f(x)$ to be strictly decreasing for all real $x$, we must have $f'(x) \\le 0$ for all $x \\in \\mathbb{R}$ (with equality holding only at discrete points).<br><br>$\\cos x + \\sin x - k \\le 0$<br><br>$k \\ge \\cos x + \\sin x$<br><br>We know that the maximum value of $a \\cos x + b \\sin x$ is $\\sqrt{a^2 + b^2}$.<br><br>Maximum value of $\\cos x + \\sin x = \\sqrt{1^2 + 1^2} = \\sqrt{2}$<br><br>Therefore, for the inequality to hold for all $x$, we must have:<br><br>$k \\ge \\sqrt{2}$<br><br>Among the given options, $k > \\sqrt{2}$ satisfies this condition.<br><br>Answer: $k > \\sqrt{2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be2bf9280d7f9932d45", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The function $\\mathrm{f}(x)=[x(x-2)]^2$ is increasing in the set", "image": null}, "options": [{"id": "mXnxu", "text": "$(-\\infty, 0) \\cup(2, \\infty)$", "image": null, "isCorrect": false}, {"id": "fymwg", "text": "$(-\\infty, 1)$", "image": null, "isCorrect": false}, {"id": "wAEsy", "text": "$(1,2)$", "image": null, "isCorrect": false}, {"id": "4OTMA", "text": "$(0,1) \\cup(2, \\infty)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $\\mathrm{f}(x) = [x(x-2)]^2$<br><br>$\\mathrm{f}(x) = (x^2 - 2x)^2$<br><br>Differentiating with respect to $x$, we get:<br><br>$\\mathrm{f}'(x) = 2(x^2 - 2x)(2x - 2)$<br><br>$\\mathrm{f}'(x) = 4x(x - 2)(x - 1)$<br><br>For the function to be increasing, $\\mathrm{f}'(x) > 0$.<br><br>$4x(x - 1)(x - 2) > 0$<br><br>The critical points are $x = 0$, $x = 1$, and $x = 2$.<br><br>Using the wavy curve method, the sign of $\\mathrm{f}'(x)$ in different intervals is:<br>For $x \\in (2, \\infty)$, $\\mathrm{f}'(x) > 0$<br>For $x \\in (1, 2)$, $\\mathrm{f}'(x) < 0$<br>For $x \\in (0, 1)$, $\\mathrm{f}'(x) > 0$<br>For $x \\in (-\\infty, 0)$, $\\mathrm{f}'(x) < 0$<br><br>Thus, $\\mathrm{f}(x)$ is increasing in the interval $(0, 1) \\cup (2, \\infty)$.<br><br>Answer: $(0,1) \\cup(2, \\infty)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc4bf9280d7f9932c3b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{f}(x)=\\log (1+x)-\\frac{2 x}{2+x}$ then $\\mathrm{f}(x)$ is increasing in", "image": null}, "options": [{"id": "5mrzG", "text": "$(-1, \\infty)$", "image": null, "isCorrect": true}, {"id": "yZnvz", "text": "$(-\\infty, \\infty)$", "image": null, "isCorrect": false}, {"id": "iq7G1", "text": "$(0, \\infty)$", "image": null, "isCorrect": false}, {"id": "gl11K", "text": "$(1, \\infty)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\mathrm{f}(x) = \\log(1+x) - \\dfrac{2x}{2+x}$<br><br>For the function to be defined, $1+x > 0 \\Rightarrow x > -1$. Thus, the domain of $\\mathrm{f}(x)$ is $(-1, \\infty)$.<br><br>Differentiating $\\mathrm{f}(x)$ with respect to $x$:<br><br>$\\mathrm{f}'(x) = \\dfrac{1}{1+x} - \\left[ \\dfrac{(2+x)(2) - (2x)(1)}{(2+x)^2} \\right]$<br><br>$\\mathrm{f}'(x) = \\dfrac{1}{1+x} - \\dfrac{4}{(2+x)^2}$<br><br>$\\mathrm{f}'(x) = \\dfrac{(2+x)^2 - 4(1+x)}{(1+x)(2+x)^2}$<br><br>$\\mathrm{f}'(x) = \\dfrac{4 + 4x + x^2 - 4 - 4x}{(1+x)(2+x)^2}$<br><br>$\\mathrm{f}'(x) = \\dfrac{x^2}{(1+x)(2+x)^2}$<br><br>For $\\mathrm{f}(x)$ to be increasing, $\\mathrm{f}'(x) \\geq 0$.<br><br>Since $x^2 \\geq 0$ and $(2+x)^2 > 0$ for all $x \\neq -2$, the sign of $\\mathrm{f}'(x)$ depends on $1+x$.<br><br>In the domain $x > -1$, $1+x > 0$, which implies $\\mathrm{f}'(x) \\geq 0$ for all $x \\in (-1, \\infty)$.<br><br>Therefore, $\\mathrm{f}(x)$ is increasing in $(-1, \\infty)$.<br><br>Answer: $(-1, \\infty)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb0bf9280d7f9932b98", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "$\\mathrm{f}(x)=\\frac{x}{2}+\\frac{2}{x}, x \\neq 0$ is strictly decreasing in", "image": null}, "options": [{"id": "7wP0n", "text": "$(2,3)$", "image": null, "isCorrect": false}, {"id": "Rnomr", "text": "$(1,3)$", "image": null, "isCorrect": false}, {"id": "Cb7jS", "text": "$(-2, 0) \\cup (0, 2)$", "image": null, "isCorrect": true}, {"id": "tKGiu", "text": "$(1,4)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x) = \\dfrac{x}{2} + \\dfrac{2}{x}$<br><br>Differentiating with respect to $x$:<br><br>$f'(x) = \\dfrac{1}{2} - \\dfrac{2}{x^2}$<br><br>For a strictly decreasing function, $f'(x) < 0$.<br><br>$\\dfrac{1}{2} - \\dfrac{2}{x^2} < 0$<br><br>$\\dfrac{x^2 - 4}{2x^2} < 0$<br><br>Since $2x^2 > 0$ for all $x \\neq 0$, we have:<br><br>$x^2 - 4 < 0$<br><br>$(x - 2)(x + 2) < 0$<br><br>$-2 < x < 2$<br><br>Since $x \\neq 0$, the interval in which the function is strictly decreasing is $(-2, 0) \\cup (0, 2)$.<br><br>Answer: $(-2, 0) \\cup (0, 2)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7fbf9280d7f99329c7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The function $\\mathrm{f}(x)=\\sin ^4 x+\\cos ^4 x$ increases if", "image": null}, "options": [{"id": "wEnNN", "text": "$0 < x < \\frac{\\pi}{8}$", "image": null, "isCorrect": false}, {"id": "4JoR7", "text": "$\\frac{\\pi}{4} < x < \\frac{\\pi}{2}$", "image": null, "isCorrect": true}, {"id": "wof4S", "text": "$\\frac{3 \\pi}{8} < x < \\frac{5 \\pi}{8}$", "image": null, "isCorrect": false}, {"id": "ChPqN", "text": "$\\frac{5 \\pi}{8} < x < \\frac{3 \\pi}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x) = \\sin^4 x + \\cos^4 x$<br><br>Differentiating with respect to $x$, we get:<br><br>$f'(x) = 4\\sin^3 x \\cos x - 4\\cos^3 x \\sin x$<br><br>$f'(x) = -4\\sin x \\cos x (\\cos^2 x - \\sin^2 x)$<br><br>$f'(x) = -2(2\\sin x \\cos x) \\cos 2x$<br><br>$f'(x) = -2\\sin 2x \\cos 2x$<br><br>$f'(x) = -\\sin 4x$<br><br>For the function to be increasing, $f'(x) > 0$.<br><br>$-\\sin 4x > 0$<br><br>$\\sin 4x < 0$<br><br>The sine function is negative in the third and fourth quadrants. Therefore, for the principal interval:<br><br>$\\pi < 4x < 2\\pi$<br><br>Dividing by $4$, we get:<br><br>$\\dfrac{\\pi}{4} < x < \\dfrac{\\pi}{2}$<br><br>Answer: $\\frac{\\pi}{4} < x < \\frac{\\pi}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b72bf9280d7f993294d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{f}(x)=x \\cdot \\mathrm{e}^{x(1-x)}$, then $\\mathrm{f}(x)$ is", "image": null}, "options": [{"id": "tHbjz", "text": "increasing in $\\mathbb{R}$", "image": null, "isCorrect": false}, {"id": "ChrOt", "text": "increasing in $\\left(-\\frac{1}{2}, 1\\right)$", "image": null, "isCorrect": true}, {"id": "bMJkC", "text": "decreasing in $\\mathbb{R}$", "image": null, "isCorrect": false}, {"id": "7P2RE", "text": "decreasing in $\\left[-\\frac{1}{2}, 1\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\mathrm{f}(x) = x \\cdot \\mathrm{e}^{x(1-x)}$<br><br>Differentiating with respect to $x$ using the product rule:<br><br>$\\mathrm{f}'(x) = 1 \\cdot \\mathrm{e}^{x(1-x)} + x \\cdot \\mathrm{e}^{x(1-x)} \\cdot \\dfrac{d}{dx}(x - x^2)$<br><br>$\\mathrm{f}'(x) = \\mathrm{e}^{x(1-x)} + x \\cdot \\mathrm{e}^{x(1-x)} \\cdot (1 - 2x)$<br><br>$\\mathrm{f}'(x) = \\mathrm{e}^{x(1-x)} [1 + x(1 - 2x)]$<br><br>$\\mathrm{f}'(x) = \\mathrm{e}^{x(1-x)} (1 + x - 2x^2)$<br><br>$\\mathrm{f}'(x) = -\\mathrm{e}^{x(1-x)} (2x^2 - x - 1)$<br><br>$\\mathrm{f}'(x) = -\\mathrm{e}^{x(1-x)} (2x + 1)(x - 1)$<br><br>For $\\mathrm{f}(x)$ to be increasing, $\\mathrm{f}'(x) > 0$.<br><br>Since $\\mathrm{e}^{x(1-x)} > 0$ for all $x \\in \\mathbb{R}$, we must have:<br><br>$-(2x + 1)(x - 1) > 0$<br><br>$(2x + 1)(x - 1) < 0$<br><br>The critical points are $x = -\\dfrac{1}{2}$ and $x = 1$.<br><br>The inequality holds for $x \\in \\left(-\\dfrac{1}{2}, 1\\right)$.<br><br>Thus, $\\mathrm{f}(x)$ is increasing in $\\left(-\\dfrac{1}{2}, 1\\right)$.<br><br>Answer: increasing in $\\left(-\\frac{1}{2}, 1\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b6fbf9280d7f993292f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $x$ is real, then the difference between the greatest and least values of $\\frac{x^2-x+1}{x^2+x+1}$ is", "image": null}, "options": [{"id": "wTk19", "text": "$\\frac{10}{3}$", "image": null, "isCorrect": false}, {"id": "Vt3SQ", "text": "$\\frac{8}{3}$", "image": null, "isCorrect": true}, {"id": "11J1Q", "text": "$\\frac{5}{3}$", "image": null, "isCorrect": false}, {"id": "ot1k6", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $y = \\dfrac{x^2-x+1}{x^2+x+1}$<br><br>Cross-multiplying, we get:<br><br>$y(x^2+x+1) = x^2-x+1$<br><br>$yx^2 + yx + y - x^2 + x - 1 = 0$<br><br>$(y-1)x^2 + (y+1)x + (y-1) = 0$<br><br>Since $x$ is real, the discriminant of this quadratic equation must be greater than or equal to zero ($\\Delta \\ge 0$).<br><br>$(y+1)^2 - 4(y-1)(y-1) \\ge 0$<br><br>$y^2 + 2y + 1 - 4(y^2 - 2y + 1) \\ge 0$<br><br>$-3y^2 + 10y - 3 \\ge 0$<br><br>$3y^2 - 10y + 3 \\le 0$<br><br>$(3y-1)(y-3) \\le 0$<br><br>$\\dfrac{1}{3} \\le y \\le 3$<br><br>The greatest value of the expression is $3$ and the least value is $\\dfrac{1}{3}$.<br><br>The difference between the greatest and least values is:<br><br>$3 - \\dfrac{1}{3} = \\dfrac{8}{3}$<br><br>Answer: $\\frac{8}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b5ebf9280d7f993289f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{f}(\\mathrm{x})=\\frac{\\mathrm{k} \\sin \\mathrm{x}+2 \\cos \\mathrm{x}}{\\sin \\mathrm{x}+\\cos \\mathrm{x}}$ is strictly increasing for all $x$ in its domain, then", "image": null}, "options": [{"id": "dh6cR", "text": "$k=1$", "image": null, "isCorrect": false}, {"id": "qSfXs", "text": "$k>1$", "image": null, "isCorrect": false}, {"id": "28CAv", "text": "$\\mathrm{k} < 2$", "image": null, "isCorrect": false}, {"id": "IfYNQ", "text": "$k>2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $f(x) = \\dfrac{k \\sin x + 2 \\cos x}{\\sin x + \\cos x}$<br><br>Differentiating with respect to $x$ using the quotient rule:<br><br>$f'(x) = \\dfrac{(k \\cos x - 2 \\sin x)(\\sin x + \\cos x) - (k \\sin x + 2 \\cos x)(\\cos x - \\sin x)}{(\\sin x + \\cos x)^2}$<br><br>Expanding the numerator:<br><br>$(k \\sin x \\cos x + k \\cos^2 x - 2 \\sin^2 x - 2 \\sin x \\cos x) - (k \\sin x \\cos x - k \\sin^2 x + 2 \\cos^2 x - 2 \\sin x \\cos x)$<br><br>Simplifying the terms, we get:<br><br>$k \\cos^2 x - 2 \\sin^2 x + k \\sin^2 x - 2 \\cos^2 x$<br><br>$= k(\\cos^2 x + \\sin^2 x) - 2(\\sin^2 x + \\cos^2 x)$<br><br>$= k - 2$<br><br>Thus, $f'(x) = \\dfrac{k - 2}{(\\sin x + \\cos x)^2}$<br><br>For $f(x)$ to be strictly increasing for all $x$ in its domain, $f'(x) > 0$.<br><br>Since $(\\sin x + \\cos x)^2 > 0$ for all $x$ in the domain, the numerator must be positive.<br><br>$k - 2 > 0$<br><br>$k > 2$<br><br>Answer: $k>2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4fbf9280d7f9932818", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The function f defined by $\\mathrm{f}(x)=(x+2) \\mathrm{e}^{-x}$ is", "image": null}, "options": [{"id": "WNqn5", "text": "decreasing for all $x \\in \\mathbb{R}$", "image": null, "isCorrect": false}, {"id": "myxGU", "text": "decreasing in $(-\\infty,-1)$ and increasing in $(-1, \\infty)$", "image": null, "isCorrect": false}, {"id": "YBA0g", "text": "decreasing in $(-1, \\infty)$ and increasing in $(-\\infty,-1)$", "image": null, "isCorrect": true}, {"id": "jpkKX", "text": "increasing for all $x \\in \\mathbb{R}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x) = (x+2)e^{-x}$<br><br>Differentiating with respect to $x$ using the product rule:<br><br>$f'(x) = \\dfrac{d}{dx}[(x+2)e^{-x}]$<br><br>$f'(x) = 1 \\cdot e^{-x} + (x+2)(-e^{-x})$<br><br>$f'(x) = e^{-x}(1 - x - 2)$<br><br>$f'(x) = -(x+1)e^{-x}$<br><br>For $f(x)$ to be increasing, $f'(x) > 0$:<br><br>$-(x+1)e^{-x} > 0$<br><br>Since $e^{-x} > 0$ for all $x \\in \\mathbb{R}$, we have $-(x+1) > 0 \\Rightarrow x < -1$.<br><br>Thus, $f(x)$ is increasing in $(-\\infty, -1)$.<br><br>For $f(x)$ to be decreasing, $f'(x) < 0$:<br><br>$-(x+1)e^{-x} < 0 \\Rightarrow -(x+1) < 0 \\Rightarrow x > -1$.<br><br>Thus, $f(x)$ is decreasing in $(-1, \\infty)$.<br><br>Answer: decreasing in $(-1, \\infty)$ and increasing in $(-\\infty,-1)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3ebf9280d7f9932773", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $2 \\mathrm{f}(x)+3 \\mathrm{f}\\left(\\frac{1}{x}\\right)=x^2+1, x \\neq 0$ and $\\mathrm{y}=5 x^2 \\mathrm{f}(x)$, then y is strictly increasing in", "image": null}, "options": [{"id": "fUE2T", "text": "$\\left(0, \\frac{1}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "zmRTQ", "text": "$\\left(\\frac{-2}{5}, 0\\right)$", "image": null, "isCorrect": false}, {"id": "eDLg1", "text": "$\\left(\\frac{1}{2}, \\frac{\\sqrt{5}}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "q7alN", "text": "$\\left(\\frac{-1}{2}, 0\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation:<br><br>$2 \\mathrm{f}(x) + 3 \\mathrm{f}\\left(\\dfrac{1}{x}\\right) = x^2 + 1$  ... (1)<br><br>Replacing $x$ with $\\dfrac{1}{x}$ in equation (1), we get:<br><br>$2 \\mathrm{f}\\left(\\dfrac{1}{x}\\right) + 3 \\mathrm{f}(x) = \\dfrac{1}{x^2} + 1$  ... (2)<br><br>To eliminate $\\mathrm{f}\\left(\\dfrac{1}{x}\\right)$, multiply equation (1) by 2 and equation (2) by 3:<br><br>$4 \\mathrm{f}(x) + 6 \\mathrm{f}\\left(\\dfrac{1}{x}\\right) = 2x^2 + 2$<br><br>$9 \\mathrm{f}(x) + 6 \\mathrm{f}\\left(\\dfrac{1}{x}\\right) = \\dfrac{3}{x^2} + 3$<br><br>Subtracting the first from the second gives:<br><br>$5 \\mathrm{f}(x) = \\dfrac{3}{x^2} - 2x^2 + 1$<br><br>We are given $\\mathrm{y} = 5 x^2 \\mathrm{f}(x)$. Substituting the value of $5 \\mathrm{f}(x)$:<br><br>$\\mathrm{y} = x^2 \\left( \\dfrac{3}{x^2} - 2x^2 + 1 \\right)$<br><br>$\\mathrm{y} = 3 - 2x^4 + x^2$<br><br>For $\\mathrm{y}$ to be strictly increasing, $\\dfrac{d\\mathrm{y}}{dx} > 0$.<br><br>$\\dfrac{d\\mathrm{y}}{dx} = -8x^3 + 2x$<br><br>$-8x^3 + 2x > 0$<br><br>$2x(1 - 4x^2) > 0$<br><br>$x(4x^2 - 1) < 0$<br><br>$x(2x - 1)(2x + 1) < 0$<br><br>The critical points are $x = -\\dfrac{1}{2}, 0, \\dfrac{1}{2}$.<br><br>Using the wavy curve method, the inequality holds true for:<br><br>$x \\in \\left(-\\infty, -\\dfrac{1}{2}\\right) \\cup \\left(0, \\dfrac{1}{2}\\right)$<br><br>From the given options, the interval $\\left(0, \\dfrac{1}{2}\\right)$ is correct.<br><br>Answer: $\\left(0, \\frac{1}{2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214510aee93fa0796dfb0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "If $x=-1$ and $\\cdot x=2$ are extreme points of $f(x)=\\alpha \\log |x|+\\beta x^2+x$, then", "image": null}, "options": [{"id": "vtUF8", "text": "$\\alpha=-6, \\beta=\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "XUTUM", "text": "$\\alpha=-6, \\beta=-\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "s186z", "text": "$\\alpha=2, \\beta=-\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "yBit4", "text": "$\\alpha=2, \\beta=\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x) = \\alpha \\log |x| + \\beta x^2 + x$<br><br>Differentiating with respect to $x$, we get<br><br>$f'(x) = \\dfrac{\\alpha}{x} + 2\\beta x + 1$<br><br>Since $x = -1$ and $x = 2$ are extreme points, $f'(-1) = 0$ and $f'(2) = 0$.<br><br>For $x = -1$:<br><br>$f'(-1) = -\\alpha - 2\\beta + 1 = 0$<br><br>$\\alpha + 2\\beta = 1$ ... (i)<br><br>For $x = 2$:<br><br>$f'(2) = \\dfrac{\\alpha}{2} + 4\\beta + 1 = 0$<br><br>$\\alpha + 8\\beta = -2$ ... (ii)<br><br>Subtracting equation (i) from (ii), we get<br><br>$6\\beta = -3 \\Rightarrow \\beta = -\\dfrac{1}{2}$<br><br>Substituting $\\beta = -\\dfrac{1}{2}$ in equation (i), we get<br><br>$\\alpha + 2\\left(-\\dfrac{1}{2}\\right) = 1$<br><br>$\\alpha - 1 = 1 \\Rightarrow \\alpha = 2$<br><br>Thus, $\\alpha = 2$ and $\\beta = -\\dfrac{1}{2}$.<
