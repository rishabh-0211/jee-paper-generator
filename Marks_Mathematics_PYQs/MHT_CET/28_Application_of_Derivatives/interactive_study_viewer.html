imum value of $S$, we differentiate $S$ with respect to $x$ and equate it to zero:<br><br>$\\dfrac{dS}{dx} = 3x^2 + 2(28 - x)(-1)$<br><br>$\\dfrac{dS}{dx} = 3x^2 + 2x - 56$<br><br>Setting $\\dfrac{dS}{dx} = 0$, we get:<br><br>$3x^2 + 2x - 56 = 0$<br><br>$3x^2 + 14x - 12x - 56 = 0$<br><br>$x(3x + 14) - 4(3x + 14) = 0$<br><br>$(x - 4)(3x + 14) = 0$<br><br>Since $x$ must be positive, we have $x = 4$.<br><br>Now, we check the second derivative to confirm it is a minimum:<br><br>$\\dfrac{d^2S}{dx^2} = 6x + 2$<br><br>At $x = 4$, $\\dfrac{d^2S}{dx^2} = 6(4) + 2 = 26 > 0$, which confirms that $S$ is minimum at $x = 4$.<br><br>The two parts are $4$ and $28 - 4 = 24$.<br><br>The absolute difference between the two parts is $|24 - 4| = 20$.<br><br>Answer: $20$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2da8c30a4553e1bdd7f", "type": "singleCorrect", "question": {"text": "A cylindrical tank without a top lid is being manufactured to hold a fixed volume of $125\\pi$ cubic cm. The minimum surface area required to construct this tank is ............square cm", "image": null}, "options": [{"id": "1NcD8", "label": "A", "text": "$75\\pi$", "isCorrect": true, "image": null}, {"id": "bdACl", "label": "B", "text": "$50\\pi$", "isCorrect": false, "image": null}, {"id": "MTtZB", "label": "C", "text": "$25\\pi$", "isCorrect": false, "image": null}, {"id": "4eb4j", "label": "D", "text": "$125\\pi$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $r$ be the radius and $h$ be the height of the cylindrical tank.<br><br>Given the volume $V = \\pi r^2 h = 125\\pi$<br><br>$\\Rightarrow h = \\dfrac{125}{r^2}$<br><br>The surface area of the tank without a top lid is $S = 2\\pi r h + \\pi r^2$<br><br>Substituting the value of $h$, we get:<br><br>$S = 2\\pi r \\left(\\dfrac{125}{r^2}\\right) + \\pi r^2 = \\dfrac{250\\pi}{r} + \\pi r^2$<br><br>To find the minimum surface area, we differentiate $S$ with respect to $r$ and equate it to zero:<br><br>$\\dfrac{dS}{dr} = -\\dfrac{250\\pi}{r^2} + 2\\pi r = 0$<br><br>$\\Rightarrow 2\\pi r = \\dfrac{250\\pi}{r^2}$<br><br>$\\Rightarrow r^3 = 125 \\Rightarrow r = 5$<br><br>Also, $\\dfrac{d^2S}{dr^2} = \\dfrac{500\\pi}{r^3} + 2\\pi > 0$ for $r = 5$, which confirms a minimum.<br><br>The minimum surface area is:<br><br>$S = \\dfrac{250\\pi}{5} + \\pi (5)^2 = 50\\pi + 25\\pi = 75\\pi$<br><br>Answer: $75\\pi$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3398c30a4553e1be17d", "type": "singleCorrect", "question": {"text": "The minimum value of $\\dfrac{\\log x}{x}$ in the interval $(2, \\infty)$ is", "image": null}, "options": [{"id": "ioHmK", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "bKsiA", "label": "B", "text": "$e$", "isCorrect": false, "image": null}, {"id": "xoDAf", "label": "C", "text": "$\\dfrac{1}{e}$", "isCorrect": false, "image": null}, {"id": "n5JD2", "label": "D", "text": "Does not exist", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $f(x) = \\dfrac{\\log x}{x}$ for $x \\in (2, \\infty)$.<br><br>Differentiating with respect to $x$, we get $f'(x) = \\dfrac{1 - \\log x}{x^2}$.<br><br>Setting $f'(x) = 0$ gives $\\log x = 1 \\Rightarrow x = e$.<br><br>For $x \\in (2, e)$, $f'(x) > 0$, so $f(x)$ is strictly increasing.<br><br>For $x \\in (e, \\infty)$, $f'(x) < 0$, so $f(x)$ is strictly decreasing.<br><br>Thus, $f(x)$ attains its maximum value at $x = e$.<br><br>To find the minimum value, we check the behavior at the boundaries of the interval.<br><br>At $x = 2$, $f(2) = \\dfrac{\\log 2}{2} > 0$.<br><br>As $x \\rightarrow \\infty$, $\\lim_{x \\rightarrow \\infty} \\dfrac{\\log x}{x} = 0$.<br><br>Since $f(x) > 0$ for all $x \\in (2, \\infty)$ and $f(x) \\rightarrow 0$ as $x \\rightarrow \\infty$, the infimum of $f(x)$ is $0$.<br><br>However, there is no finite $x \\in (2, \\infty)$ for which $f(x) = 0$.<br><br>Therefore, the minimum value of $f(x)$ does not exist.<br><br>Answer: Does not exist", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e88c30a4553e1bde1b", "type": "singleCorrect", "question": {"text": "The maximum value of $\\left(\\dfrac{1}{x}\\right)^x$, $x > 0$ is", "image": null}, "options": [{"id": "j2IAj", "label": "A", "text": "$e^e$", "isCorrect": false, "image": null}, {"id": "WEihg", "label": "B", "text": "$e^{-e}$", "isCorrect": false, "image": null}, {"id": "NwWo5", "label": "C", "text": "$e^{1/e}$", "isCorrect": true, "image": null}, {"id": "wweDr", "label": "D", "text": "$\\left(\\dfrac{1}{e}\\right)^{1/e}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $y = \\left(\\dfrac{1}{x}\\right)^x = x^{-x}$<br><br>Taking natural logarithm on both sides:<br><br>$\\ln y = -x \\ln x$<br><br>Differentiating with respect to $x$:<br><br>$\\dfrac{1}{y} \\dfrac{dy}{dx} = - \\left( \\ln x + x \\cdot \\dfrac{1}{x} \\right) = -(\\ln x + 1)$<br><br>$\\dfrac{dy}{dx} = -x^{-x}(\\ln x + 1)$<br><br>For maximum or minimum value, $\\dfrac{dy}{dx} = 0$<br><br>$-x^{-x}(\\ln x + 1) = 0$<br><br>Since $x^{-x} \\neq 0$ for $x > 0$, we have $\\ln x + 1 = 0 \\Rightarrow x = \\dfrac{1}{e}$<br><br>For $0 < x < \\dfrac{1}{e}$, $\\dfrac{dy}{dx} > 0$ and for $x > \\dfrac{1}{e}$, $\\dfrac{dy}{dx} < 0$<br><br>Thus, $y$ attains its maximum value at $x = \\dfrac{1}{e}$<br><br>The maximum value is $y_{max} = \\left(\\dfrac{1}{1/e}\\right)^{1/e} = e^{1/e}$<br><br>Answer: $e^{1/e}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3748c30a4553e1be3ef", "type": "singleCorrect", "question": {"text": "A wire 40 metre in length is to be cut into two pieces. One piece is formed into a square and the other piece into a circle. The lengths of the two pieces so that the combined area of the square and the circle is minimum, are respectively", "image": null}, "options": [{"id": "uYXdi", "label": "A", "text": "$\\dfrac{160}{\\pi + 4}, \\dfrac{40\\pi}{\\pi + 4}$", "isCorrect": true, "image": null}, {"id": "GIXCO", "label": "B", "text": "$\\dfrac{\\pi + 4}{160}, \\dfrac{40\\pi}{\\pi + 4}$", "isCorrect": false, "image": null}, {"id": "5mt9v", "label": "C", "text": "$\\dfrac{160}{\\pi + 4}, \\dfrac{\\pi + 4}{40\\pi}$", "isCorrect": false, "image": null}, {"id": "xKCrs", "label": "D", "text": "$30, 10$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the length of the piece for the square be $x$ and for the circle be $40 - x$.<br><br>Perimeter of the square $= x \\Rightarrow$ side $= \\dfrac{x}{4}$<br><br>Area of the square, $A_1 = \\dfrac{x^2}{16}$<br><br>Circumference of the circle $= 40 - x \\Rightarrow$ radius $r = \\dfrac{40 - x}{2\\pi}$<br><br>Area of the circle, $A_2 = \\pi r^2 = \\dfrac{(40 - x)^2}{4\\pi}$<br><br>Total area, $A = \\dfrac{x^2}{16} + \\dfrac{(40 - x)^2}{4\\pi}$<br><br>For minimum area, $\\dfrac{dA}{dx} = 0$<br><br>$\\dfrac{2x}{16} - \\dfrac{2(40 - x)}{4\\pi} = 0$<br><br>$\\dfrac{x}{8} = \\dfrac{40 - x}{2\\pi}$<br><br>$\\pi x = 160 - 4x$<br><br>$x(\\pi + 4) = 160 \\Rightarrow x = \\dfrac{160}{\\pi + 4}$<br><br>Length of the other piece $= 40 - x = 40 - \\dfrac{160}{\\pi + 4} = \\dfrac{40\\pi}{\\pi + 4}$<br><br>Since $\\dfrac{d^2A}{dx^2} = \\dfrac{1}{8} + \\dfrac{1}{2\\pi} > 0$, the area is minimum for these lengths.<br><br>Answer: $\\dfrac{160}{\\pi + 4}, \\dfrac{40\\pi}{\\pi + 4}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2bf8c30a4553e1bdc5f", "type": "singleCorrect", "question": {"text": "The difference between the local extreme values of the function $f(x) = 2x^3 - 15x^2 + 36x + 40$ is ......", "image": null}, "options": [{"id": "mZAzE", "label": "A", "text": "$4$", "isCorrect": false, "image": null}, {"id": "vqdKZ", "label": "B", "text": "$3$", "isCorrect": false, "image": null}, {"id": "pCfBd", "label": "C", "text": "$2$", "isCorrect": false, "image": null}, {"id": "uzY1c", "label": "D", "text": "$1$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $f(x) = 2x^3 - 15x^2 + 36x + 40$<br><br>Differentiating with respect to $x$:<br><br>$f'(x) = 6x^2 - 30x + 36$<br><br>For local extrema, $f'(x) = 0$:<br><br>$6(x^2 - 5x + 6) = 0$<br><br>$(x - 2)(x - 3) = 0$<br><br>$x = 2, 3$<br><br>Evaluating the function at the critical points:<br><br>$f(2) = 2(2)^3 - 15(2)^2 + 36(2) + 40 = 16 - 60 + 72 + 40 = 68$<br><br>$f(3) = 2(3)^3 - 15(3)^2 + 36(3) + 40 = 54 - 135 + 108 + 40 = 67$<br><br>The difference between the local extreme values is $68 - 67 = 1$.<br><br>Answer: $1$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2bd8c30a4553e1bdc50", "type": "singleCorrect", "question": {"text": "A wire of length $64$ m is to be bent to form a rectangle such that its area is maximum, then its area is.....", "image": null}, "options": [{"id": "5H2mK", "label": "A", "text": "$156$ sq.m", "isCorrect": false, "image": null}, {"id": "EbKTR", "label": "B", "text": "$324$ sq.m", "isCorrect": false, "image": null}, {"id": "JrIXG", "label": "C", "text": "$256$ sq.m", "isCorrect": true, "image": null}, {"id": "M9HL2", "label": "D", "text": "$320$ sq.m", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the length and breadth of the rectangle be $x$ and $y$ respectively.<br><br>The perimeter of the rectangle is equal to the length of the wire.<br><br>$2(x + y) = 64$<br><br>$x + y = 32$<br><br>The area of the rectangle is $A = xy$.<br><br>Using the AM-GM inequality for positive numbers $x$ and $y$:<br><br>$\\dfrac{x + y}{2} \\ge \\sqrt{xy}$<br><br>$\\dfrac{32}{2} \\ge \\sqrt{A}$<br><br>$16 \\ge \\sqrt{A}$<br><br>$A \\le 256$<br><br>The maximum area of the rectangle is $256$ sq.m, which occurs when $x = y = 16$ m (when the rectangle is a square).", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c01bf9280d7f9932e70", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The minimum value of the slope of the tangent to curve $\\mathrm{y}=x^3-3 x^2+2 x+93$ is", "image": null}, "options": [{"id": "fqUPy", "text": "1", "image": null, "isCorrect": false}, {"id": "Ajxz4", "text": "-1", "image": null, "isCorrect": true}, {"id": "mah67", "text": "2", "image": null, "isCorrect": false}, {"id": "HIF0n", "text": "-2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The slope of the tangent to the curve is given by the derivative of $y$ with respect to $x$.<br><br>$m = \\dfrac{dy}{dx} = \\dfrac{d}{dx}(x^3 - 3x^2 + 2x + 93)$<br><br>$m = 3x^2 - 6x + 2$<br><br>To find the minimum value of the slope $m$, we can complete the square or use derivatives.<br><br>$m = 3(x^2 - 2x) + 2$<br><br>$m = 3(x^2 - 2x + 1) - 3 + 2$<br><br>$m = 3(x - 1)^2 - 1$<br><br>Since the square of a real number is always non-negative, $3(x - 1)^2 \\ge 0$ for all real $x$.<br><br>Therefore, the minimum value of $m$ is $-1$, which occurs at $x = 1$.<br><br>Answer: -1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf5bf9280d7f9932e01", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The Maximum value of $\\left(\\frac{1}{x}\\right)^x$ is", "image": null}, "options": [{"id": "GTZzx", "text": "$\\mathrm{e}^{1/\\mathrm{e}}$", "image": null, "isCorrect": true}, {"id": "Zcwpp", "text": "$\\mathrm{e}$", "image": null, "isCorrect": false}, {"id": "5IBTc", "text": "$\\frac{1}{\\mathrm{e}}$", "image": null, "isCorrect": false}, {"id": "VyCYj", "text": "$\\mathrm{e}^{-1/\\mathrm{e}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $y = \\left(\\dfrac{1}{x}\\right)^x = x^{-x}$<br><br>Taking logarithm on both sides, we get:<br><br>$\\ln y = -x \\ln x$<br><br>Differentiating with respect to $x$:<br><br>$\\dfrac{1}{y} \\dfrac{dy}{dx} = - \\left(x \\cdot \\dfrac{1}{x} + \\ln x \\cdot 1\\right)$<br><br>$\\dfrac{dy}{dx} = -y (1 + \\ln x)$<br><br>For maximum or minimum value, $\\dfrac{dy}{dx} = 0$<br><br>$-y (1 + \\ln x) = 0$<br><br>Since $y = x^{-x} > 0$ for $x > 0$, we have:<br><br>$1 + \\ln x = 0$<br><br>$\\ln x = -1$<br><br>$x = \\mathrm{e}^{-1} = \\dfrac{1}{\\mathrm{e}}$<br><br>For $x < \\dfrac{1}{\\mathrm{e}}$, $\\dfrac{dy}{dx} > 0$ and for $x > \\dfrac{1}{\\mathrm{e}}$, $\\dfrac{dy}{dx} < 0$. Thus, $y$ is maximum at $x = \\dfrac{1}{\\mathrm{e}}$.<br><br>The maximum value is:<br><br>$y_{max} = \\left(\\dfrac{1}{1/\\mathrm{e}}\\right)^{1/\\mathrm{e}} = \\mathrm{e}^{1/\\mathrm{e}}$<br><br>Answer: $\\mathrm{e}^{1/\\mathrm{e}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf0bf9280d7f9932dd6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $x+\\mathrm{y}=6, x \\geqslant 0, y \\geqslant 0$, then the maximum value of $x^2 \\mathrm{y}$ is", "image": null}, "options": [{"id": "IGuGX", "text": "32", "image": null, "isCorrect": true}, {"id": "3YD2M", "text": "30", "image": null, "isCorrect": false}, {"id": "noxfL", "text": "34", "image": null, "isCorrect": false}, {"id": "9yxhk", "text": "36", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $x + y = 6 \\Rightarrow y = 6 - x$<br><br>Let $P = x^2 y = x^2(6 - x) = 6x^2 - x^3$<br><br>Differentiating with respect to $x$, we get:<br><br>$\\dfrac{dP}{dx} = 12x - 3x^2$<br><br>For maximum or minimum value, $\\dfrac{dP}{dx} = 0$<br><br>$12x - 3x^2 = 0 \\Rightarrow 3x(4 - x) = 0 \\Rightarrow x = 0$ or $x = 4$<br><br>Differentiating again with respect to $x$:<br><br>$\\dfrac{d^2P}{dx^2} = 12 - 6x$<br><br>At $x = 4$, $\\dfrac{d^2P}{dx^2} = 12 - 6(4) = -12 < 0$<br><br>Thus, $P$ is maximum at $x = 4$.<br><br>When $x = 4$, $y = 6 - 4 = 2$<br><br>Maximum value of $x^2 y = (4)^2(2) = 32$<br><br>Answer: 32", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be2bf9280d7f9932d47", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The minimum value of $ax + by$ where $xy = c^2$ and $a, b, c, x, y > 0$ is", "image": null}, "options": [{"id": "fzfWa", "text": "$2 c \\sqrt{a b}$", "image": null, "isCorrect": true}, {"id": "AxNxY", "text": "$2 a b \\sqrt{c}$", "image": null, "isCorrect": false}, {"id": "rtahp", "text": "$-2 c \\sqrt{a b}$", "image": null, "isCorrect": false}, {"id": "hLdYm", "text": "$2 c(a b)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using the AM-GM inequality for positive numbers $ax$ and $by$:<br><br>$\\dfrac{ax + by}{2} \\ge \\sqrt{(ax)(by)}$<br><br>$\\dfrac{ax + by}{2} \\ge \\sqrt{abxy}$<br><br>Substituting $xy = c^2$ into the inequality:<br><br>$\\dfrac{ax + by}{2} \\ge \\sqrt{abc^2}$<br><br>Since $a, b, c > 0$, we get:<br><br>$\\dfrac{ax + by}{2} \\ge c\\sqrt{ab}$<br><br>$ax + by \\ge 2c\\sqrt{ab}$<br><br>The minimum value of $ax + by$ is $2c\\sqrt{ab}$.<br><br>Answer: $2 c \\sqrt{a b}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd4bf9280d7f9932ccd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If $\\mathrm{y}=\\alpha \\log |x|+\\beta x^3-x$ has extreme values at $x=-1$ and $x=1$, then $\\alpha$ and $\\beta$ are respectively", "image": null}, "options": [{"id": "DBIkj", "text": "0 and $\\frac{1}{3}$", "image": null, "isCorrect": true}, {"id": "ADFts", "text": "0 and $\\frac{-1}{3}$", "image": null, "isCorrect": false}, {"id": "FhHaL", "text": "$\\frac{-1}{3}$ and $\\frac{1}{3}$", "image": null, "isCorrect": false}, {"id": "e9ZZf", "text": "$\\frac{1}{3}$ and $\\frac{1}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given function is $y = \\alpha \\log |x| + \\beta x^3 - x$<br><br>Differentiating with respect to $x$, we get:<br><br>$\\dfrac{dy}{dx} = \\dfrac{\\alpha}{x} + 3\\beta x^2 - 1$<br><br>Since the function has extreme values at $x = -1$ and $x = 1$, the derivative must be zero at these points.<br><br>At $x = -1$:<br><br>$\\dfrac{\\alpha}{-1} + 3\\beta (-1)^2 - 1 = 0$<br><br>$-\\alpha + 3\\beta = 1$  ... (i)<br><br>At $x = 1$:<br><br>$\\dfrac{\\alpha}{1} + 3\\beta (1)^2 - 1 = 0$<br><br>$\\alpha + 3\\beta = 1$  ... (ii)<br><br>Adding equations (i) and (ii):<br><br>$6\\beta = 2 \\Rightarrow \\beta = \\dfrac{1}{3}$<br><br>Subtracting equation (i) from (ii):<br><br>$2\\alpha = 0 \\Rightarrow \\alpha = 0$<br><br>Therefore, $\\alpha = 0$ and $\\beta = \\dfrac{1}{3}$.<br><br>Answer: 0 and $\\frac{1}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd3bf9280d7f9932cca", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A manufacturer sells $x$ items at a price of rupees $\\left(6-\\frac{x}{40}\\right)$ each. The cost price of $x$ items is Rs. $\\left(\\frac{x}{5}+193\\right)$. The maximum profit in Rs. _______ is", "image": null}, "options": [{"id": "CSGoU", "text": "134.4", "image": null, "isCorrect": false}, {"id": "LxiWv", "text": "144.3", "image": null, "isCorrect": false}, {"id": "wcuzm", "text": "143.4", "image": null, "isCorrect": true}, {"id": "REigQ", "text": "133.4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The revenue function $R(x)$ for selling $x$ items is given by:<br><br>$R(x) = x \\left(6 - \\dfrac{x}{40}\\right) = 6x - \\dfrac{x^2}{40}$<br><br>The cost function $C(x)$ is given by:<br><br>$C(x) = \\dfrac{x}{5} + 193$<br><br>The profit function $P(x)$ is the difference between revenue and cost:<br><br>$P(x) = R(x) - C(x) = 6x - \\dfrac{x^2}{40} - \\left(\\dfrac{x}{5} + 193\\right)$<br><br>$P(x) = \\dfrac{29x}{5} - \\dfrac{x^2}{40} - 193$<br><br>For maximum profit, we set the first derivative $P'(x)$ to zero:<br><br>$P'(x) = \\dfrac{29}{5} - \\dfrac{2x}{40} = \\dfrac{29}{5} - \\dfrac{x}{20} = 0$<br><br>$\\dfrac{x}{20} = \\dfrac{29}{5} \\Rightarrow x = 116$<br><br>Checking the second derivative:<br><br>$P''(x) = -\\dfrac{1}{20} < 0$<br><br>Since $P''(x) < 0$, the profit is maximum at $x = 116$.<br><br>Substituting $x = 116$ into the profit function:<br><br>$P(116) = \\dfrac{29(116)}{5} - \\dfrac{(116)^2}{40} - 193$<br><br>$P(116) = 672.8 - 336.4 - 193$<br><br>$P(116) = 336.4 - 193 = 143.4$<br><br>The maximum profit is Rs. $143.4$.<br><br>Answer: 143.4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba1bf9280d7f9932b0e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The sum of two positive numbers is 4 . The minimum value of the sum of their reciprocals is", "image": null}, "options": [{"id": "mQxXK", "text": "$\\frac{3}{4}$", "image": null, "isCorrect": false}, {"id": "ABoib", "text": "$\\frac{6}{5}$", "image": null, "isCorrect": false}, {"id": "LpDzn", "text": "$1$", "image": null, "isCorrect": true}, {"id": "KjNXy", "text": "$4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the two positive numbers be $x$ and $y$.<br><br>Given $x + y = 4$.<br><br>We need to find the minimum value of $\\dfrac{1}{x} + \\dfrac{1}{y}$.<br><br>Using the relation between Arithmetic Mean (AM) and Harmonic Mean (HM) for two positive numbers:<br><br>$\\text{AM} \\ge \\text{HM}$<br><br>$\\dfrac{x + y}{2} \\ge \\dfrac{2}{\\dfrac{1}{x} + \\dfrac{1}{y}}$<br><br>Substituting $x + y = 4$:<br><br>$\\dfrac{4}{2} \\ge \\dfrac{2}{\\dfrac{1}{x} + \\dfrac{1}{y}}$<br><br>$2 \\ge \\dfrac{2}{\\dfrac{1}{x} + \\dfrac{1}{y}}$<br><br>$\\dfrac{1}{x} + \\dfrac{1}{y} \\ge 1$<br><br>The minimum value of the sum of their reciprocals is $1$, which occurs when $x = y = 2$.<br><br>Answer: $1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b90bf9280d7f9932a6b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The maximum value of $x^{2 / 3}+(x-2)^{2 / 3}$ on $[0, 2]$ is", "image": null}, "options": [{"id": "0PtXp", "text": "0", "image": null, "isCorrect": false}, {"id": "WIEri", "text": "2", "image": null, "isCorrect": true}, {"id": "elp6j", "text": "$2^{\\frac{2}{3}}$", "image": null, "isCorrect": false}, {"id": "1OqYM", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x) = x^{2/3} + (x-2)^{2/3}$<br><br>Differentiating with respect to $x$, we get:<br><br>$f'(x) = \\dfrac{2}{3}x^{-1/3} + \\dfrac{2}{3}(x-2)^{-1/3}$<br><br>For critical points, $f'(x) = 0$:<br><br>$\\dfrac{1}{x^{1/3}} + \\dfrac{1}{(x-2)^{1/3}} = 0$<br><br>$\\dfrac{1}{x^{1/3}} = -\\dfrac{1}{(x-2)^{1/3}}$<br><br>$x^{1/3} = -(x-2)^{1/3}$<br><br>Cubing both sides:<br><br>$x = -(x-2)$<br><br>$2x = 2 \\Rightarrow x = 1$<br><br>Now, we evaluate $f(x)$ at the critical point $x = 1$ and the endpoints $x = 0$ and $x = 2$:<br><br>$f(0) = 0^{2/3} + (-2)^{2/3} = 2^{2/3}$<br><br>$f(2) = 2^{2/3} + 0^{2/3} = 2^{2/3}$<br><br>$f(1) = 1^{2/3} + (1-2)^{2/3} = 1 + (-1)^{2/3} = 1 + 1 = 2$<br><br>Comparing the values, since $2 > 2^{2/3}$, the maximum value of the function on $[0, 2]$ is $2$.<br><br>Answer: 2", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b82bf9280d7f99329e3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "An open tank with a square bottom is to contain 4000 cubic cm . of liquid. The dimensions of the tank so that the surface area of the tank is minimum, is", "image": null}, "options": [{"id": "03iU4", "text": "side $=20 \\mathrm{~cm}$, height $=10 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "q92i4", "text": "side $=10 \\mathrm{~cm}$, height $=20 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "yiuz3", "text": "side $=10 \\mathrm{~cm}$, height $=40 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "U7E7t", "text": "side $=20 \\mathrm{~cm}$, height $=05 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the side of the square base be $x$ and the height be $y$.<br><br>Volume of the tank, $V = x^2y = 4000 \\Rightarrow y = \\dfrac{4000}{x^2}$<br><br>Surface area of the open tank, $S = x^2 + 4xy$<br><br>Substituting the value of $y$, we get:<br><br>$S = x^2 + 4x\\left(\\dfrac{4000}{x^2}\\right) = x^2 + \\dfrac{16000}{x}$<br><br>For minimum surface area, $\\dfrac{dS}{dx} = 0$<br><br>$\\dfrac{dS}{dx} = 2x - \\dfrac{16000}{x^2} = 0$<br><br>$2x^3 = 16000 \\Rightarrow x^3 = 8000 \\Rightarrow x = 20$<br><br>Now, $y = \\dfrac{4000}{(20)^2} = \\dfrac{4000}{400} = 10$<br><br>Also, $\\dfrac{d^2S}{dx^2} = 2 + \\dfrac{32000}{x^3} > 0$ at $x = 20$, which confirms the minimum.<br><br>Thus, side $= 20$ cm and height $= 10$ cm.<br><br>Answer: side $=20 \\mathrm{~cm}$, height $=10 \\mathrm{~cm}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b63bf9280d7f99328bc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A wire of length 8 units is cut into two parts which are bent respectively in the form of a square and a circle. The least value of the sum of the areas so formed is", "image": null}, "options": [{"id": "SYmZd", "text": "$\\frac{8}{\\pi+4}$", "image": null, "isCorrect": false}, {"id": "ueZYh", "text": "$\\frac{64}{\\pi+4}$", "image": null, "isCorrect": false}, {"id": "xeoh3", "text": "$\\frac{2}{\\pi+4}$", "image": null, "isCorrect": false}, {"id": "1uWpQ", "text": "$\\frac{16}{\\pi+4}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let the length of the wire used for the square be $x$ and for the circle be $8 - x$.<br><br>Side of the square $= \\dfrac{x}{4}$<br><br>Radius of the circle $= \\dfrac{8 - x}{2\\pi}$<br><br>Sum of their areas, $A = \\left(\\dfrac{x}{4}\\right)^2 + \\pi\\left(\\dfrac{8 - x}{2\\pi}\\right)^2 = \\dfrac{x^2}{16} + \\dfrac{(8 - x)^2}{4\\pi}$<br><br>For minimum area, $\\dfrac{dA}{dx} = 0$<br><br>$\\dfrac{2x}{16} - \\dfrac{2(8 - x)}{4\\pi} = 0$<br><br>$\\dfrac{x}{8} = \\dfrac{8 - x}{2\\pi}$<br><br>$\\pi x = 32 - 4x \\Rightarrow x = \\dfrac{32}{\\pi + 4}$<br><br>The minimum area is obtained by substituting $x$ back into $A$:<br><br>$A = \\dfrac{1}{16}\\left(\\dfrac{32}{\\pi + 4}\\right)^2 + \\dfrac{1}{4\\pi}\\left(8 - \\dfrac{32}{\\pi + 4}\\right)^2$<br><br>$A = \\dfrac{64}{(\\pi + 4)^2} + \\dfrac{1}{4\\pi}\\left(\\dfrac{8\\pi}{\\pi + 4}\\right)^2$<br><br>$A = \\dfrac{64}{(\\pi + 4)^2} + \\dfrac{16\\pi}{(\\pi + 4)^2}$<br><br>$A = \\dfrac{16(4 + \\pi)}{(\\pi + 4)^2} = \\dfrac{16}{\\pi + 4}$<br><br>Answer: $\\frac{16}{\\pi+4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4fbf9280d7f9932817", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The function $x^5-5 x^4+5 x^3-10$ has a maximum, when $x$ is equal to", "image": null}, "options": [{"id": "AZNmn", "text": "$0$", "image": null, "isCorrect": false}, {"id": "6HMsE", "text": "$1$", "image": null, "isCorrect": true}, {"id": "dPyVw", "text": "$2$", "image": null, "isCorrect": false}, {"id": "z7tPx", "text": "$3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x) = x^5 - 5x^4 + 5x^3 - 10$<br><br>Differentiating with respect to $x$, we get:<br>$f'(x) = 5x^4 - 20x^3 + 15x^2$<br><br>For maximum or minimum, $f'(x) = 0$<br>$\\Rightarrow 5x^2(x^2 - 4x + 3) = 0$<br>$\\Rightarrow 5x^2(x - 1)(x - 3) = 0$<br>$\\Rightarrow x = 0, 1, 3$<br><br>Now, finding the second derivative:<br>$f''(x) = 20x^3 - 60x^2 + 30x$<br><br>Checking the sign of $f''(x)$ at the critical points:<br>At $x = 1$, $f''(1) = 20(1)^3 - 60(1)^2 + 30(1) = -10 < 0$<br>At $x = 3$, $f''(3) = 20(3)^3 - 60(3)^2 + 30(3) = 90 > 0$<br>At $x = 0$, $f''(0) = 0$<br><br>Since $f''(1) < 0$, the function $f(x)$ has a local maximum at $x = 1$.<br><br>Answer: $1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b3ebf9280d7f9932770", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A manufacturer produces $x$ items per week at a total cost of Rs $\\left(x^2+78 x+2500\\right)$. The price per unit is given by $8 x=600-\\mathrm{p}$ where ' p ' is the price of each unit. Then the maximum profit obtained is", "image": null}, "options": [{"id": "aKv5r", "text": "Rs. 5069", "image": null, "isCorrect": true}, {"id": "2Z70h", "text": "Rs. 15138", "image": null, "isCorrect": false}, {"id": "hLqEU", "text": "Rs. 7569", "image": null, "isCorrect": false}, {"id": "e38gs", "text": "Rs. 2500", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Total cost $C(x) = x^2 + 78x + 2500$<br><br>Price per unit $p = 600 - 8x$<br><br>Total revenue $R(x) = p \\times x = (600 - 8x)x = 600x - 8x^2$<br><br>Profit $P(x) = R(x) - C(x)$<br><br>$P(x) = (600x - 8x^2) - (x^2 + 78x + 2500) = -9x^2 + 522x - 2500$<br><br>For maximum profit, $P'(x) = 0$<br><br>$-18x + 522 = 0 \\Rightarrow x = 29$<br><br>$P''(x) = -18 < 0$, which confirms a maximum at $x = 29$.<br><br>Maximum profit $P(29) = -9(29)^2 + 522(29) - 2500$<br><br>$P(29) = -7569 + 15138 - 2500 = 5069$<br><br>Answer: Rs. 5069", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b29bf9280d7f99326d0", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "20 is divided into two parts so that the product of the cube of one part and the square of the other part is maximum, then these two parts are", "image": null}, "options": [{"id": "CKY9w", "text": "15,5", "image": null, "isCorrect": false}, {"id": "WcuFB", "text": "16,4", "image": null, "isCorrect": false}, {"id": "O6I8h", "text": "12,8", "image": null, "isCorrect": true}, {"id": "zp08T", "text": "14,6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the two parts be $x$ and $20 - x$.<br><br>Let the product be $f(x) = x^3(20 - x)^2$.<br><br>Differentiating with respect to $x$, we get:<br><br>$f'(x) = 3x^2(20 - x)^2 + x^3 \\cdot 2(20 - x)(-1)$<br><br>$f'(x) = x^2(20 - x)[3(20 - x) - 2x]$<br><br>$f'(x) = x^2(20 - x)(60 - 5x)$<br><br>For maximum or minimum, $f'(x) = 0$.<br><br>$x^2(20 - x)(60 - 5x) = 0$<br><br>Since the parts are non-zero, $x \\neq 0$ and $x \\neq 20$.<br><br>$60 - 5x = 0 \\Rightarrow x = 12$<br><br>The other part is $20 - 12 = 8$.<br><br>Thus, the two parts are $12$ and $8$.<br><br>Answer: 12,8", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b07bf9280d7f99325c4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A population $\\mathrm{p}(\\mathrm{t})$ of 1000 bacteria introduced into a nutrient medium grows according to the relation $\\mathrm{p}(\\mathrm{t})=1000+\\frac{1000 \\mathrm{t}}{100+\\mathrm{t}^2}$. The maximum size of this bacterial population is", "image": null}, "options": [{"id": "66cxJ", "text": "$1100$", "image": null, "isCorrect": false}, {"id": "SPpfV", "text": "$1250$", "image": null, "isCorrect": false}, {"id": "gg8iF", "text": "$1050$", "image": null, "isCorrect": true}, {"id": "YTEam", "text": "$950$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given the population function:<br><br>$\\mathrm{p}(\\mathrm{t}) = 1000 + \\dfrac{1000 \\mathrm{t}}{100 + \\mathrm{t}^2}$<br><br>To find the maximum size of the population, we differentiate $\\mathrm{p}(\\mathrm{t})$ with respect to $\\mathrm{t}$ and equate it to zero:<br><br>$\\dfrac{d\\mathrm{p}}{d\\mathrm{t}} = \\dfrac{d}{d\\mathrm{t}} \\left( 1000 + \\dfrac{1000 \\mathrm{t}}{100 + \\mathrm{t}^2} \\right)$<br><br>Using the quotient rule:<br><br>$\\dfrac{d\\mathrm{p}}{d\\mathrm{t}} = 1000 \\left[ \\dfrac{(100 + \\mathrm{t}^2)(1) - \\mathrm{t}(2\\mathrm{t})}{(100 + \\mathrm{t}^2)^2} \\right]$<br><br>$\\dfrac{d\\mathrm{p}}{d\\mathrm{t}} = \\dfrac{1000(100 - \\mathrm{t}^2)}{(100 + \\mathrm{t}^2)^2}$<br><br>For maximum population, $\\dfrac{d\\mathrm{p}}{d\\mathrm{t}} = 0$:<br><br>$\\dfrac{1000(100 - \\mathrm{t}^2)}{(100 + \\mathrm{t}^2)^2} = 0$<br><br>$100 - \\mathrm{t}^2 = 0$<br><br>$\\mathrm{t}^2 = 100$<br><br>$\\mathrm{t} = 10$ (since time $\\mathrm{t} \\ge 0$)<br><br>Substituting $\\mathrm{t} = 10$ into the original function to find the maximum population:<br><br>$\\mathrm{p}(10) = 1000 + \\dfrac{1000(10)}{100 + (10)^2}$<br><br>$\\mathrm{p}(10) = 1000 + \\dfrac{10000}{100 + 100}$<br><br>$\\mathrm{p}(10) = 1000 + \\dfrac{10000}{200}$<br><br>$\\mathrm{p}(10) = 1000 + 50 = 1050$<br><br>Answer: $1050$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143a0aee93fa0796defa", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "If $y=\\mathrm{a} \\log |x|+\\mathrm{b} x^2+x$ has its extremum values at $x=-1$ and $x=2$, then", "image": null}, "options": [{"id": "FBREW", "text": "$\\mathrm{a}=2, \\mathrm{~b}=-1$", "image": null, "isCorrect": false}, {"id": "WKN2T", "text": "$\\mathrm{a}=2, \\mathrm{~b}=-\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "I5ulv", "text": "$\\mathrm{a}=-2, \\mathrm{~b}=\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "gtlYD", "text": "$\\mathrm{a}=2, \\mathrm{~b}=\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $y = \\mathrm{a} \\log |x| + \\mathrm{b} x^2 + x$<br><br>Differentiating with respect to $x$, we get<br><br>$\\dfrac{dy}{dx} = \\dfrac{\\mathrm{a}}{x} + 2\\mathrm{b}x + 1$<br><br>Since the function has extremum values at $x = -1$ and $x = 2$, we have $\\dfrac{dy}{dx} = 0$ at these points.<br><br>At $x = -1$:<br><br>$\\dfrac{\\mathrm{a}}{-1} + 2\\mathrm{b}(-1) + 1 = 0$<br><br>$-\\mathrm{a} - 2\\mathrm{b} + 1 = 0$<br><br>$\\mathrm{a} + 2\\mathrm{b} = 1$<br><br>At $x = 2$:<br><br>$\\dfrac{\\mathrm{a}}{2} + 2\\mathrm{b}(2) + 1 = 0$<br><br>$\\mathrm{a} + 8\\mathrm{b} + 2 = 0$<br><br>$\\mathrm{a} + 8\\mathrm{b} = -2$<br><br>Subtracting the first equation from the second equation:<br><br>$6\\mathrm{b} = -3 \\Rightarrow \\mathrm{b} = -\\dfrac{1}{2}$<br><br>Substituting $\\mathrm{b} = -\\dfrac{1}{2}$ in $\\mathrm{a} + 2\\mathrm{b} = 1$:<br><br>$\\mathrm{a} + 2\\left(-\\dfrac{1}{2}\\right) = 1$<br><br>$\\mathrm{a} - 1 = 1 \\Rightarrow \\mathrm{a} = 2$<br><br>Therefore, $\\mathrm{a} = 2$ and $\\mathrm{b} = -\\dfrac{1}{2}$.<br><br>Answer: $\\mathrm{a}=2, \\mathrm{~b}=-\\frac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214250aee93fa0796de57", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "An open tank with a square bottom, to contain 4000 cubic cm . of liquid, is to be constructed. The dimensions of the tank, so that the surface area of the tank is minimum, are", "image": null}, "options": [{"id": "vfwmm", "text": "side of square bottom $=40 \\mathrm{~cm}$, height $=10 \\mathrm{~cm}$.", "image": null, "isCorrect": false}, {"id": "heZ8f", "text": "side of square bottom $=20 \\mathrm{~cm}$, height $=10 \\mathrm{~cm}$.", "image": null, "isCorrect": true}, {"id": "2ADXy", "text": "side of square bottom $=10 \\mathrm{~cm}$, height $=40 \\mathrm{~cm}$.", "image": null, "isCorrect": false}, {"id": "LwFzG", "text": "side. of square bottom $=5 \\mathrm{~cm}$, height $=160 \\mathrm{~cm}$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $x$ be the side of the square base and $y$ be the height of the tank.<br><br>The volume of the tank is given by:<br>$V = x^2 y = 4000$<br>$\\Rightarrow y = \\dfrac{4000}{x^2}$<br><br>Since the tank is open at the top, its surface area $S$ consists of the base and four sides:<br>$S = x^2 + 4xy$<br><br>Substituting the value of $y$ into the surface area equation:<br>$S = x^2 + 4x \\left( \\dfrac{4000}{x^2} \\right)$<br>$S = x^2 + \\dfrac{16000}{x}$<br><br>To find the minimum surface area, we differentiate $S$ with respect to $x$ and equate it to zero:<br>$\\dfrac{dS}{dx} = 2x - \\dfrac{16000}{x^2} = 0$<br>$\\Rightarrow 2x = \\dfrac{16000}{x^2}$<br>$\\Rightarrow x^3 = 8000$<br>$\\Rightarrow x = 20$<br><br>To confirm it is a minimum, we check the second derivative:<br>$\\dfrac{d^2S}{dx^2} = 2 + \\dfrac{32000}{x^3}$<br>At $x = 20$, $\\dfrac{d^2S}{dx^2} = 2 + \\dfrac{32000}{8000} = 6 > 0$, which confirms the surface area is minimum.<br><br>Now, substituting $x = 20$ to find $y$:<br>$y = \\dfrac{4000}{(20)^2} = \\dfrac{4000}{400} = 10$<br><br>Thus, the side of the square bottom is $20$ cm and the height is $10$ cm.<br><br>Answer: side of square bottom $=20 \\mathrm{~cm}$, height $=10 \\mathrm{~cm}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214030aee93fa0796dd47", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "The maximum value of the function $\\mathrm{f}(x)=2 x^3-15 x^2+36 x-48$ on the set $\\mathrm{A}=\\left\\{x |x^2+20 \\leq 9 x\\right\\}$ is", "image": null}, "options": [{"id": "7Fdt7", "text": "-16", "image": null, "isCorrect": false}, {"id": "orZyJ", "text": "-7", "image": null, "isCorrect": false}, {"id": "fMEhp", "text": "16", "image": null, "isCorrect": false}, {"id": "JSPFJ", "text": "7", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given set is $\\mathrm{A}=\\left\\{x \\mid x^2+20 \\leq 9 x\\right\\}$.<br><br>Solving the inequality:<br><br>$x^2 - 9x + 20 \\leq 0$<br><br>$(x - 4)(x - 5) \\leq 0$<br><br>This gives $x \\in [4, 5]$.<br><br>Now, consider the function $\\mathrm{f}(x) = 2x^3 - 15x^2 + 36x - 48$.<br><br>Differentiating with respect to $x$:<br><br>$\\mathrm{f}'(x) = 6x^2 - 30x + 36$<br><br>$\\mathrm{f}'(x) = 6(x^2 - 5x + 6) = 6(x - 2)(x - 3)$<br><br>For $x \\in [4, 5]$, both $(x - 2)$ and $(x - 3)$ are positive, which means $\\mathrm{f}'(x) > 0$.<br><br>Since $\\mathrm{f}'(x) > 0$ for all $x \\in [4, 5]$, the function $\\mathrm{f}(x)$ is strictly increasing on the interval $[4, 5]$.<br><br>Therefore, the maximum value of $\\mathrm{f}(x)$ on this interval occurs at the upper bound, $x = 5$.<br><br>Substituting $x = 5$ into the function:<br><br>$\\mathrm{f}(5) = 2(5)^3 - 15(5)^2 + 36(5) - 48$<br><br>$\\mathrm{f}(5) = 2(125) - 15(25) + 180 - 48$<br><br>$\\mathrm{f}(5) = 250 - 375 + 180 - 48$<br><br>$\\mathrm{f}(5) = 430 - 423 = 7$<br><br>The maximum value of the function is $7$.<br><br>Answer: 7", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214000aee93fa0796dd32", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "If $y=\\mathrm{a} \\log |x|+\\mathrm{b} x^2+x$ has its extreme values at $x=-1$ and $x=2$, then the value of $\\left(\\frac{\\mathrm{a}}{\\mathrm{b}}+\\frac{\\mathrm{b}}{\\mathrm{a}}\\right)$ is", "image": null}, "options": [{"id": "Oqsd9", "text": "$-\\frac{7}{4}$", "image": null, "isCorrect": false}, {"id": "xq1yt", "text": "$-\\frac{15}{4}$", "image": null, "isCorrect": false}, {"id": "3HSDp", "text": "$-\\frac{17}{4}$", "image": null, "isCorrect": true}, {"id": "xN0Nk", "text": "$-\\frac{5}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $y = \\mathrm{a} \\log |x| + \\mathrm{b} x^2 + x$<br><br>Differentiating with respect to $x$, we get:<br><br>$\\dfrac{dy}{dx} = \\dfrac{\\mathrm{a}}{x} + 2\\mathrm{b}x + 1$<br><br>Since the function has extreme values at $x = -1$ and $x = 2$, $\\dfrac{dy}{dx} = 0$ at these points.<br><br>For $x = -1$:<br><br>$\\dfrac{\\mathrm{a}}{-1} + 2\\mathrm{b}(-1) + 1 = 0$<br><br>$\\Rightarrow \\mathrm{a} + 2\\mathrm{b} = 1$<br><br>For $x = 2$:<br><br>$\\dfrac{\\mathrm{a}}{2} + 2\\mathrm{b}(2) + 1 = 0$<br><br>$\\Rightarrow \\mathrm{a} + 8\\mathrm{b} = -2$<br><br>Subtracting the first equation from the second equation:<br><br>$(\\mathrm{a} + 8\\mathrm{b}) - (\\mathrm{a} + 2\\mathrm{b}) = -2 - 1$<br><br>$\\Rightarrow 6\\mathrm{b} = -3$<br><br>$\\Rightarrow \\mathrm{b} = -\\dfrac{1}{2}$<br><br>Substituting $\\mathrm{b} = -\\dfrac{1}{2}$ into the first equation:<br><br>$\\mathrm{a} + 2\\left(-\\dfrac{1}{2}\\right) = 1$<br><br>$\\Rightarrow \\mathrm{a} - 1 = 1$<br><br>$\\Rightarrow \\mathrm{a} = 2$<br><br>Now, we need to find the value of $\\left(\\dfrac{\\mathrm{a}}{\\mathrm{b}} + \\dfrac{\\mathrm{b}}{\\mathrm{a}}\\right)$:<br><br>$\\dfrac{\\mathrm{a}}{\\mathrm{b}} = \\dfrac{2}{-\\dfrac{1}{2}} = -4$<br><br>$\\dfrac{\\mathrm{b}}{\\mathrm{a}} = \\dfrac{-\\dfrac{1}{2}}{2} = -\\dfrac{1}{4}$<br><br>$\\dfrac{\\mathrm{a}}{\\mathrm{b}} + \\dfrac{\\mathrm{b}}{\\mathrm{a}} = -4 - \\dfrac{1}{4} = -\\dfrac{17}{4}$<br><br>Answer: $-\\frac{17}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b50aee93fa0796dae5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "A poster is to be printed on a rectangular sheet of paper of area $18 \\mathrm{~m}^2$. The margins at the top and bottom of 75 cm each and at the sides 50 cm each are to be left. Then the dimensions i.e. height and breadth of the sheet so that the space available for printing is maximum, are _________ respectively.", "image": null}, "options": [{"id": "lu87P", "text": "$2 \\sqrt{3} \\mathrm{~m}, 3 \\sqrt{3} \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "O2Ntz", "text": "$3 \\sqrt{3} \\mathrm{~m}, 2 \\sqrt{3} \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "0aVFp", "text": "$3 \\mathrm{~m}, 6 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "QY1ci", "text": "$6 \\mathrm{~m}, 3 \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $h$ be the height and $b$ be the breadth of the sheet in meters.<br><br>Given the area of the sheet is $18 \\mathrm{~m}^2$, we have $h \\times b = 18 \\Rightarrow b = \\dfrac{18}{h}$.<br><br>The margins at the top and bottom are $75 \\mathrm{~cm} = 0.75 \\mathrm{~m}$ each, so the height of the printing space is $h - 2(0.75) = h - 1.5$.<br><br>The margins at the sides are $50 \\mathrm{~cm} = 0.5 \\mathrm{~m}$ each, so the breadth of the printing space is $b - 2(0.5) = b - 1$.<br><br>The area of the printed space is $A = (h - 1.5)(b - 1)$.<br><br>Substituting $b = \\dfrac{18}{h}$, we get:<br><br>$A = (h - 1.5)\\left(\\dfrac{18}{h} - 1\\right)$<br><br>$A = 18 - h - \\dfrac{27}{h} + 1.5 = 19.5 - \\left(h + \\dfrac{27}{h}\\right)$<br><br>For $A$ to be maximum, its derivative with respect to $h$ must be zero:<br><br>$\\dfrac{dA}{dh} = -1 + \\dfrac{27}{h^2} = 0$<br><br>$h^2 = 27 \\Rightarrow h = 3\\sqrt{3} \\mathrm{~m}$<br><br>To confirm it is a maximum, we check the second derivative:<br><br>$\\dfrac{d^2A}{dh^2} = -\\dfrac{54}{h^3} < 0$ (since $h > 0$), which confirms a maximum.<br><br>The breadth is $b = \\dfrac{18}{3\\sqrt{3}} = 2\\sqrt{3} \\mathrm{~m}$.<br><br>Thus, the height and breadth are $3\\sqrt{3} \\mathrm{~m}$ and $2\\sqrt{3} \\mathrm{~m}$ respectively.<br><br>Answer: $3 \\sqrt{3} \\mathrm{~m}, 2 \\sqrt{3} \\mathrm{~m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a20aee93fa0796da4f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "The maximum value of $\\dfrac{\\log x}{x}$ is", "image": null}, "options": [{"id": "zotqK", "text": "e", "image": null, "isCorrect": false}, {"id": "nrlZb", "text": "$2 \\mathrm{e}$", "image": null, "isCorrect": false}, {"id": "ezEXi", "text": "$\\dfrac{1}{\\mathrm{e}}$", "image": null, "isCorrect": true}, {"id": "UeYu5", "text": "$\\dfrac{2}{\\mathrm{e}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x) = \\dfrac{\\log x}{x}$<br><br>Differentiating with respect to $x$, we get<br><br>$f'(x) = \\dfrac{x \\cdot \\dfrac{1}{x} - \\log x \\cdot 1}{x^2} = \\dfrac{1 - \\log x}{x^2}$<br><br>For maximum or minimum value, $f'(x) = 0$<br><br>$\\dfrac{1 - \\log x}{x^2} = 0$<br><br>$1 - \\log x = 0$<br><br>$\\log x = 1 \\Rightarrow x = e$<br><br>Now, finding the second derivative:<br><br>$f''(x) = \\dfrac{x^2 \\left(-\\dfrac{1}{x}\\right) - (1 - \\log x)(2x)}{x^4} = \\dfrac{2 \\log x - 3}{x^3}$<br><br>At $x = e$, $f''(e) = \\dfrac{2(1) - 3}{e^3} = -\\dfrac{1}{e^3} < 0$<br><br>Therefore, $f(x)$ attains its maximum value at $x = e$.<br><br>The maximum value is $f(e) = \\dfrac{\\log e}{e} = \\dfrac{1}{e}$<br><br>Answer: $\\dfrac{1}{\\mathrm{e}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213920aee93fa0796d9d2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "If $\\mathrm{f}(x)=\\left(\\sin ^4 x+\\cos ^4 x\\right), 0 \\lt x \\lt \\dfrac{\\pi}{2}$, then the function has minimum value _______ at $x=$ ________.", "image": null}, "options": [{"id": "YhsZj", "text": "$0.7934, \\dfrac{\\pi}{9}$", "image": null, "isCorrect": false}, {"id": "VpPBc", "text": "$\\dfrac{1}{2}, \\dfrac{\\pi}{4}$", "image": null, "isCorrect": true}, {"id": "UDuUz", "text": "$\\dfrac{5}{8}, \\dfrac{\\pi}{3}$", "image": null, "isCorrect": false}, {"id": "PQ0za", "text": "$0.75, \\dfrac{\\pi}{8}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$f(x) = \\sin^4 x + \\cos^4 x$<br><br>$f(x) = (\\sin^2 x + \\cos^2 x)^2 - 2\\sin^2 x \\cos^2 x$<br><br>$f(x) = 1 - \\dfrac{1}{2}(2\\sin x \\cos x)^2$<br><br>$f(x) = 1 - \\dfrac{1}{2}\\sin^2(2x)$<br><br>For the minimum value of $f(x)$, the term $\\sin^2(2x)$ must be maximum.<br><br>The maximum value of $\\sin^2(2x)$ is $1$.<br><br>Minimum value of $f(x) = 1 - \\dfrac{1}{2}(1) = \\dfrac{1}{2}$<br><br>This occurs when $\\sin^2(2x) = 1$.<br><br>Since $0 \\lt x \\lt \\dfrac{\\pi}{2}$, we have $0 \\lt 2x \\lt \\pi$.<br><br>$\\sin(2x) = 1 \\Rightarrow 2x = \\dfrac{\\pi}{2} \\Rightarrow x = \\dfrac{\\pi}{4}$<br><br>Answer: $\\dfrac{1}{2}, \\dfrac{\\pi}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792137e0aee93fa0796d936", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "If sum of two positive integers is 3 , then the maximum value of the product of first number and square of the second number is", "image": null}, "options": [{"id": "NOS3V", "text": "6", "image": null, "isCorrect": false}, {"id": "Qgwpu", "text": "4", "image": null, "isCorrect": true}, {"id": "2UFTK", "text": "5", "image": null, "isCorrect": false}, {"id": "X0XB8", "text": "3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the two positive integers be $x$ and $y$.<br><br>Given $x + y = 3$.<br><br>Since $x$ and $y$ are positive integers, the only possible pairs $(x, y)$ are $(1, 2)$ and $(2, 1)$.<br><br>The product of the first number and the square of the second number is $x y^2$.<br><br>For $x = 1$ and $y = 2$, the product is $1 \\times 2^2 = 4$.<br><br>For $x = 2$ and $y = 1$, the product is $2 \\times 1^2 = 2$.<br><br>The maximum value of the product is $4$.<br><br>Answer: 4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792137c0aee93fa0796d928", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "A wire of length 2 units is cut into two parts, which are bent respectively to form a square of side $x$ units and a circle of radius of r units. If the sum of the areas of square and the circle so formed is minimum, then", "image": null}, "options": [{"id": "19Gvm", "text": "$2 x=(\\pi+4) \\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "7e7ry", "text": "$(4-\\pi) x=\\pi \\mathrm{r}$", "image": null, "isCorrect": false}, {"id": "uKwE2", "text": "$x=2 r$", "image": null, "isCorrect": true}, {"id": "j6qFL", "text": "$2 x=\\mathrm{r}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the length of the wire be $2$ units.<br><br>The wire is cut into two parts to form a square of side $x$ and a circle of radius $r$.<br><br>Sum of their perimeters is equal to the total length of the wire:<br><br>$4x + 2\\pi r = 2$<br><br>$2x + \\pi r = 1$<br><br>$x = \\dfrac{1 - \\pi r}{2}$<br><br>The sum of the areas of the square and the circle is:<br><br>$A = x^2 + \\pi r^2$<br><br>Substituting the value of $x$:<br><br>$A = \\left(\\dfrac{1 - \\pi r}{2}\\right)^2 + \\pi r^2$<br><br>For the area to be minimum, $\\dfrac{dA}{dr} = 0$:<br><br>$\\dfrac{dA}{dr} = 2\\left(\\dfrac{1 - \\pi r}{2}\\right) \\left(-\\dfrac{\\pi}{2}\\right) + 2\\pi r = 0$<br><br>$-\\pi \\left(\\dfrac{1 - \\pi r}{2}\\right) + 2\\pi r = 0$<br><br>Dividing by $\\pi$:<br><br>$-\\left(\\dfrac{1 - \\pi r}{2}\\right) + 2r = 0$<br><br>Since $x = \\dfrac{1 - \\pi r}{2}$, we get:<br><br>$-x + 2r = 0$<br><br>$x = 2r$<br><br>Answer: $x=2 r$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213530aee93fa0796d7e6", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "A triangular park is enclosed on two sides by a fence and on the third side a straight river bank. The two sides having fence are of same length $x$.\r\nThe maximum area (in sq. units) enclosed by the park is", "image": null}, "options": [{"id": "ZUZ82", "text": "$\\dfrac{3}{2} x^2$", "image": null, "isCorrect": false}, {"id": "FECMs", "text": "$\\sqrt{\\dfrac{x^3}{8}}$", "image": null, "isCorrect": false}, {"id": "8B4Dd", "text": "$\\dfrac{1}{2} x^2$", "image": null, "isCorrect": true}, {"id": "2oAXU", "text": "$\\pi x^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the angle between the two fenced sides of length $x$ be $\\theta$.<br><br>The area of the triangular park is given by $A = \\dfrac{1}{2} x \\cdot x \\cdot \\sin \\theta = \\dfrac{1}{2} x^2 \\sin \\theta$.<br><br>For maximum area, $\\sin \\theta$ must be maximum.<br><br>The maximum value of $\\sin \\theta$ is $1$, which occurs at $\\theta = 90^{\\circ}$.<br><br>Therefore, the maximum area enclosed by the park is $A_{\\max} = \\dfrac{1}{2} x^2 (1) = \\dfrac{1}{2} x^2$.<br><br>Answer: $\\dfrac{1}{2} x^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213430aee93fa0796d767", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The maximum value of the function\r\n$f(x)=3 x^3-18 x^2+27 x-40$\r\non the set $\\mathrm{S}=\\left\\{x \\in \\mathbb{R} / x^2+30 \\leq 11 x\\right\\}$ is", "image": null}, "options": [{"id": "S9J77", "text": "-122", "image": null, "isCorrect": false}, {"id": "SvK0R", "text": "-222", "image": null, "isCorrect": false}, {"id": "SQTNo", "text": "222", "image": null, "isCorrect": false}, {"id": "lhy5c", "text": "122", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given set is $S = \\{x \\in \\mathbb{R} \\mid x^2 + 30 \\leq 11x\\}$.<br><br>Solving the inequality:<br>$x^2 - 11x + 30 \\leq 0$<br>$(x - 5)(x - 6) \\leq 0$<br>$\\Rightarrow x \\in [5, 6]$<br><br>The given function is $f(x) = 3x^3 - 18x^2 + 27x - 40$.<br><br>Differentiating with respect to $x$:<br>$f'(x) = 9x^2 - 36x + 27$<br>$f'(x) = 9(x^2 - 4x + 3)$<br>$f'(x) = 9(x - 1)(x - 3)$<br><br>For $x \\in [5, 6]$, both $(x - 1)$ and $(x - 3)$ are positive, which means $f'(x) > 0$.<br><br>Since $f'(x) > 0$ for all $x \\in [5, 6]$, the function $f(x)$ is strictly increasing on this interval.<br><br>Therefore, the maximum value of $f(x)$ on the set $S$ occurs at the upper bound of the interval, which is $x = 6$.<br><br>Substituting $x = 6$ into $f(x)$:<br>$f(6) = 3(6)^3 - 18(6)^2 + 27(6) - 40$<br>$f(6) = 3(216) - 18(36) + 162 - 40$<br>$f(6) = 648 - 648 + 162 - 40$<br>$f(6) = 122$<br><br>Answer: 122", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262890279619d9d8a3553", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Let $\\mathrm{f}(x)=5-|x-2|$ and $\\mathrm{g}(x)=|x+1|, x \\in \\mathrm{R}$ If $\\mathrm{f}(x)$ attains maximum value at $\\alpha$ and $\\mathrm{g}(x)$ attains minimum value at $\\beta$, then $\\lim _{x \\rightarrow-\\alpha \\beta} \\frac{(x-1)\\left(x^2-5 x+6\\right)}{x^2-6 x+8}$ is equal to", "image": null}, "options": [{"id": "sfP0W", "text": "$\\frac {1}{2}$", "image": null, "isCorrect": true}, {"id": "e7S0g", "text": "$\\frac {-3}{2}$", "image": null, "isCorrect": false}, {"id": "G0bex", "text": "$\\frac {-1}{2}$", "image": null, "isCorrect": false}, {"id": "TP4Sh", "text": "$\\frac {3}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& |x-2| \\geq 0 \\\\\n& \\Rightarrow-|x-2| \\leq 0 \\\\\n& \\Rightarrow 5-|x-2| \\leq 5\n\\end{aligned}$\nMaximum value of $\\mathrm{f}(x)$ is 5 .\n$\\begin{aligned}\n\\therefore \\quad & 5-|x-2|=5 \\\\\n& \\Rightarrow|x-2|=0 \\\\\n& \\Rightarrow x=2 \\\\\n& \\Rightarrow \\alpha=2 \\\\\n& |x+1| \\geq 0\n\\end{aligned}$\nMinimum value of $\\mathrm{g}(x)$ is 0 .\n$\\begin{aligned}\n\\therefore \\quad & |x+1|=0 \\\\\n& \\Rightarrow x=-1 \\\\\n& \\Rightarrow \\beta=-1\n\\end{aligned}$\n$\\begin{aligned}\n\\therefore \\quad & \\lim _{x \\rightarrow-\\alpha \\beta} \\frac{(x-1)\\left(x^2-5 x+6\\right)}{x^2-6 x+8} \\\\\n= & \\lim _{x \\rightarrow 2} \\frac{(x-1)(x-2)(x-3)}{(x-2)(x-4)} \\\\\n= & \\lim _{x \\rightarrow 2} \\frac{(x-1)(x-3)}{x-4} \\\\\n= & \\frac{(1)(-1)}{-2} \\\\\n= & \\frac{1}{2}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262840279619d9d8a352c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "The function $\\mathrm{f}(x)=x^3-6 x^2+9 x+2$ has maximum value when $x$ is", "image": null}, "options": [{"id": "wEvq4", "text": "1", "image": null, "isCorrect": true}, {"id": "mV0Ql", "text": "2", "image": null, "isCorrect": false}, {"id": "URIyO", "text": "3", "image": null, "isCorrect": false}, {"id": "D0ufB", "text": "6", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\mathrm{f}(x)=x^3-6 x^2+9 x+2 \\\\\n\\therefore \\quad & \\mathrm{f}^{\\prime}(x)=3 x^2-12 x+9\n\\end{aligned}$\nFor maximum or minimum,\n$\\begin{aligned}\n& \\mathrm{f}^{\\prime}(x)=0 \\\\\n& \\Rightarrow 3 x^2-12 x+9=0 \\\\\n& \\Rightarrow 3(x-1)(x-3)=0 \\\\\n& \\Rightarrow x=1,3\n\\end{aligned}$\nNow, $\\mathrm{f}^{\\prime \\prime}(x)=6 x-12$\n$\\therefore \\quad \\mathrm{f}^{\\prime \\prime}(1)=-6 < 0$\n$\\therefore \\quad \\mathrm{f}(x)$ is maximum at $x=1$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262760279619d9d8a34b9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "The maximum value of the function $f(x)=3 x^3-18 x^2+27 x-40$ on the set $\\mathrm{S}=\\left\\{x \\in \\mathrm{R} / x^2+30 \\leq 11 x\\right\\}$ is", "image": null}, "options": [{"id": "pg70o", "text": "$122$", "image": null, "isCorrect": true}, {"id": "7aiKG", "text": "$-122$", "image": null, "isCorrect": false}, {"id": "BPsxp", "text": "$-222$", "image": null, "isCorrect": false}, {"id": "LXnRi", "text": "$222$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n\\mathrm{S} & =\\left\\{x \\in \\mathrm{R} / x^2+30 \\leq 11 x\\right\\} \\\\\n& =\\left\\{x \\in \\mathrm{R} / x^2-11 x+30 \\leq 0\\right\\} \\\\\n& =\\{x \\in \\mathrm{R} /(x-5)(x-6) \\leq 0\\} \\\\\n& =\\{x \\in \\mathrm{R} / x \\in[5,6]\\} \\\\\n\\mathrm{f}(x) & =3 x^3-18 x^2+27 x-40 \\\\\n\\therefore \\quad \\mathrm{f}^{\\prime}(x) & =9 x^2-36 x+27 \\\\\n& =9(x-1)(x-3)>0 \\quad \\forall x \\in[5,6]\n\\end{aligned}\n$$\n$\\Rightarrow \\mathrm{f}(x)$ is increasing in $[5,6]$.\n$$\n\\begin{aligned}\n\\therefore \\quad \\text { Maximum value } & =\\mathrm{f}(6) \\\\\n& =3(6)^3-18(6)^2+27(6)-40 \\\\\n& =122\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2622b0279619d9d8a325c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "In a triangle, the sum of lengths of two sides is $x$ and the product of the lengths of the same two sides is $y$. If $x^2-\\mathrm{c}^2-y$, where $\\mathrm{c}$ is the length of the third side of the triangle, then the circumradius of the triangle is", "image": null}, "options": [{"id": "3CjYg", "text": "$\\frac{c}{3}$", "image": null, "isCorrect": false}, {"id": "sLdVW", "text": "$\\frac{c}{\\sqrt{3}}$", "image": null, "isCorrect": true}, {"id": "4sqkR", "text": "$\\frac{3}{2} y$", "image": null, "isCorrect": false}, {"id": "6n1gD", "text": "$\\frac{y}{\\sqrt{3}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\mathrm{a}$ and $\\mathrm{b}$ be the lengths of two sides of $\\mathrm{a}$ triangle.\n$\\therefore \\quad$ According to the given condition,\n$$\n\\begin{aligned}\n& \\mathrm{a}+\\mathrm{b}=x \\text { and } \\mathrm{ab}=y \\\\\n& \\therefore \\quad x^2-\\mathrm{c}^2=y \\Rightarrow(\\mathrm{a}+\\mathrm{b})^2-\\mathrm{c}^2=\\mathrm{ab} \\\\\n& \\Rightarrow a^2+b^2+2 a b-c^2=a b \\\\\n& \\Rightarrow a^2+b^2-c^2=-a b \\\\\n& \\Rightarrow \\frac{\\mathrm{a}^2+\\mathrm{b}^2-\\mathrm{c}^2}{2 \\mathrm{ab}}=-\\frac{1}{2} \\\\\n& \\Rightarrow \\cos \\mathrm{C}=\\frac{1}{2} \\\\\n& \\Rightarrow \\mathrm{C}=\\frac{2 \\pi}{3} \\\\\n& \\Rightarrow \\text { circumradius }=\\frac{\\mathrm{c}}{2 \\sin \\mathrm{C}}=\\frac{\\mathrm{c}}{2 \\sin \\left(\\frac{2 \\pi}{3}\\right)}=\\frac{\\mathrm{c}}{\\sqrt{3}} \\\\\n&\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262290279619d9d8a3248", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "If $x=-1$ and $x=2$ are extreme points of $\\mathrm{f}(x)=\\alpha \\log x+\\beta x^2+x, \\alpha$ and $\\beta$ are constants, then the value of $\\alpha^2+2 \\beta$ is", "image": null}, "options": [{"id": "Txg4z", "text": "$-3$", "image": null, "isCorrect": false}, {"id": "qLfDm", "text": "$3$", "image": null, "isCorrect": true}, {"id": "9473v", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}, {"id": "udMIX", "text": "$5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the given condition, $\\mathrm{f}^{\\prime}(1)=0$ and $\\mathrm{f}^{\\prime}(2)=0$\n$$\n\\mathrm{f}(x)=\\alpha \\log x+\\beta x^2+x\n$$\n$$\n\\begin{array}{ll}\n\\therefore & \\mathrm{f}^{\\prime}(x)=\\frac{\\alpha}{x}+2 \\beta x+1 \\\\\n\\therefore & \\mathrm{f}^{\\prime}(-1)=0 \\Rightarrow \\alpha+2 \\beta=1 \\\\\n& \\text { and } \\mathrm{f}^{\\prime}(2)=0 \\Rightarrow \\alpha+8 \\beta=-2\n\\end{array}\n$$\n$\\therefore \\quad$ From (i) and (ii), we get\n$$\n\\begin{aligned}\n& \\beta=\\frac{-1}{2} \\text { and } \\alpha=2 \\\\\n\\therefore \\quad & \\alpha^2+2 \\beta=4-1=3\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261da0279619d9d8a2fdd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "An open metallic tank is to be constructed, with a square base and vertical sides, having volume 500 cubic meter. Then the dimensions of the tank, for minimum area of the sheet metal used in its construction, are", "image": null}, "options": [{"id": "0YfkU", "text": "$5 \\mathrm{~m}, 5 \\mathrm{~m}, 10 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "IXEbb", "text": "$10 \\mathrm{~m}, 10 \\mathrm{~m}, 5 \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "foq0g", "text": "$2 \\mathrm{~m}, 2 \\mathrm{~m}, 8 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "ZFFTw", "text": "$15 \\mathrm{~m}, 15 \\mathrm{~m}, 5 \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the length, breadth and depth of open tank be $x, x$ and $y$ respectively.\nVolume $(\\mathrm{V})=x^2 y$\n$\\therefore \\quad 500=x^2 y$... (i)\nTotal surface area of open tank is given by\n$\\mathrm{S}=x^2+4 x y$... (ii)\nFrom (i), $y=\\frac{500}{x^2}$\nFrom (ii), $\\mathrm{S}=x^2+4 x \\times \\frac{500}{x^2}$\n$=x^2+\\frac{2000}{x}$\nDifferentiating w.r.t. $x$, we get\n$\\frac{\\mathrm{dS}}{\\mathrm{d} x}=2 x-\\frac{2000}{x^2}$\nFor minimum area, $\\frac{\\mathrm{dS}}{\\mathrm{d} x}=0$\n$\\begin{aligned}\n\\therefore \\quad & 2 x-\\frac{2000}{x^2}=0 \\\\\n& \\Rightarrow 2000=2 x^3 \\\\\n& \\Rightarrow x^3=1000\n\\end{aligned}$\n$\\begin{aligned}\n& \\Rightarrow x=10 \\mathrm{~m} \\\\\n& \\frac{\\mathrm{d}^2 \\mathrm{~S}}{\\mathrm{~d} x^2}=2+\\frac{4000}{x^3} \\\\\n& \\Rightarrow\\left(\\frac{\\mathrm{d}^2 \\mathrm{~S}}{\\mathrm{~d} x^2}\\right)_{x=10}>0\n\\end{aligned}$\n$\\mathrm{S}$ is minimum when $x=10 \\mathrm{~m}$ and $y=5 \\mathrm{~m}$\n...[From (i)]", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00
