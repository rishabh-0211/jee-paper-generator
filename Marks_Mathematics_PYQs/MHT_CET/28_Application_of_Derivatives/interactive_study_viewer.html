9 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792139f0aee93fa0796da3b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "The population of a town increases at a rate proportional to the population at that time. If the population increases from 40 thousand to 80 thousand in 40 years, then the population in another 40 years will be", "image": null}, "options": [{"id": "2QzHf", "text": "180000", "image": null, "isCorrect": false}, {"id": "oQyYJ", "text": "128000", "image": null, "isCorrect": false}, {"id": "Tn2JT", "text": "160000", "image": null, "isCorrect": true}, {"id": "JvFFl", "text": "256000", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $P$ be the population at time $t$.<br><br>$\\dfrac{dP}{dt} = kP$<br><br>$\\int \\dfrac{dP}{P} = \\int k dt$<br><br>$\\ln P = kt + C$<br><br>$P = P_0 e^{kt}$<br><br>Given $P_0 = 40000$ at $t = 0$.<br><br>At $t = 40$, $P = 80000$.<br><br>$80000 = 40000 e^{40k}$<br><br>$e^{40k} = 2$<br><br>We need to find the population in another $40$ years, i.e., at $t = 80$.<br><br>$P = 40000 e^{80k} = 40000 (e^{40k})^2$<br><br>$P = 40000 (2)^2 = 160000$<br><br>Answer: 160000", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213900aee93fa0796d9c3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "A ladder 5 m long rests against a vertical wall. If its top slides downwards at the rate of $10 \\mathrm{~cm} / \\mathrm{sec}$., then the foot of the ladder is sliding at the rate of _______ $\\mathrm{m} / \\mathrm{sec}$, when it is 4 m away from the wall.", "image": null}, "options": [{"id": "M2bYi", "text": "0.75", "image": null, "isCorrect": false}, {"id": "OvpNJ", "text": "7.5", "image": null, "isCorrect": false}, {"id": "kFL1J", "text": "0.0075", "image": null, "isCorrect": false}, {"id": "wzsxv", "text": "0.075", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $x$ be the distance of the foot of the ladder from the wall and $y$ be the height of the top of the ladder from the ground.<br><br>From the given information, $x^2 + y^2 = 5^2 = 25$.<br><br>Differentiating with respect to $t$, we get:<br><br>$2x \\dfrac{dx}{dt} + 2y \\dfrac{dy}{dt} = 0$<br><br>$x \\dfrac{dx}{dt} + y \\dfrac{dy}{dt} = 0$<br><br>We are given $\\dfrac{dy}{dt} = -10 \\text{ cm/sec} = -0.1 \\text{ m/sec}$.<br><br>When $x = 4 \\text{ m}$, $y = \\sqrt{25 - 4^2} = 3 \\text{ m}$.<br><br>Substituting these values into the differentiated equation:<br><br>$4 \\dfrac{dx}{dt} + 3(-0.1) = 0$<br><br>$4 \\dfrac{dx}{dt} = 0.3$<br><br>$\\dfrac{dx}{dt} = \\dfrac{0.3}{4} = 0.075 \\text{ m/sec}$<br><br>The foot of the ladder is sliding at the rate of $0.075 \\text{ m/sec}$.<br><br>Answer: 0.075", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792138d0aee93fa0796d9a9", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "The approximate value of $\\tan ^{-1}(0.999)$ is (use $\\pi=3.1415$ )", "image": null}, "options": [{"id": "HJ2fu", "text": "0.7843", "image": null, "isCorrect": false}, {"id": "loIuJ", "text": "0.7849", "image": null, "isCorrect": true}, {"id": "vG90g", "text": "0.7847", "image": null, "isCorrect": false}, {"id": "s9Yia", "text": "0.7851", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x) = \\tan^{-1}(x)$<br><br>Using the first-order approximation $f(x + \\Delta x) \\approx f(x) + f'(x) \\Delta x$<br><br>Let $x = 1$ and $\\Delta x = -0.001$<br><br>$f(1) = \\tan^{-1}(1) = \\dfrac{\\pi}{4}$<br><br>$f'(x) = \\dfrac{1}{1 + x^2} \\Rightarrow f'(1) = \\dfrac{1}{2} = 0.5$<br><br>$f(0.999) \\approx \\dfrac{\\pi}{4} + 0.5(-0.001) = \\dfrac{\\pi}{4} - 0.0005$<br><br>Given $\\pi = 3.1415$, $\\dfrac{\\pi}{4} = 0.785375$<br><br>$f(0.999) \\approx 0.785375 - 0.0005 = 0.784875$<br><br>Rounding to four decimal places, the approximate value is $0.7849$<br><br>Answer: 0.7849", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792137f0aee93fa0796d93a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "A wet substance in the open air loses its moisture at a rate proportional to the moisture content. If a sheet hung in the open air loses half its moisture during the first hour, then the time t , in which $99 \\%$ of the moisture will be lost, is", "image": null}, "options": [{"id": "oCHyL", "text": "$\\dfrac{2 \\log 10}{\\log 2}$", "image": null, "isCorrect": true}, {"id": "ywqKw", "text": "$\\dfrac{\\log 10}{\\log 2}$", "image": null, "isCorrect": false}, {"id": "yWEIi", "text": "$\\dfrac{3 \\log 10}{\\log 2}$", "image": null, "isCorrect": false}, {"id": "Rzpz7", "text": "$\\dfrac{1}{2} \\dfrac{\\log 10}{\\log 2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $M$ be the moisture content at time $t$.<br><br>$\\dfrac{dM}{dt} = -kM$<br><br>$\\int \\dfrac{dM}{M} = -k \\int dt$<br><br>$M = M_0 e^{-kt}$<br><br>At $t = 1$, $M = \\dfrac{M_0}{2}$:<br><br>$\\dfrac{M_0}{2} = M_0 e^{-k}$<br><br>$e^{-k} = \\dfrac{1}{2} \\Rightarrow k = \\log_e 2$<br><br>When $99\\%$ of the moisture is lost, the remaining moisture is $1\\%$, so $M = \\dfrac{M_0}{100}$.<br><br>$\\dfrac{M_0}{100} = M_0 e^{-kt}$<br><br>$e^{-kt} = \\dfrac{1}{100}$<br><br>$-kt = \\log_e \\left(\\dfrac{1}{100}\\right) = -2 \\log_e 10$<br><br>$t \\log_e 2 = 2 \\log_e 10$<br><br>$t = \\dfrac{2 \\log 10}{\\log 2}$<br><br>Answer: $\\dfrac{2 \\log 10}{\\log 2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136b0aee93fa0796d8a3", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "If a body cools from $80^{\\circ} \\mathrm{C}$ to $60^{\\circ} \\mathrm{C}$ in the room temperature of $30^{\\circ} \\mathrm{C}$ in 30 min , then the temperature of a body after one hour is", "image": null}, "options": [{"id": "sv7g6", "text": "$42^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "mt6Qm", "text": "$24^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "03Oeb", "text": "$48^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "Rtyjc", "text": "$56^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Using Newton's law of cooling, the temperature $T$ at time $t$ is given by:<br><br>$T = T_0 + (T_1 - T_0)e^{-kt}$<br><br>where $T_0$ is the room temperature and $T_1$ is the initial temperature.<br><br>Given $T_1 = 80^{\\circ}\\mathrm{C}$, $T_0 = 30^{\\circ}\\mathrm{C}$, and $T = 60^{\\circ}\\mathrm{C}$ at $t = 30$ min:<br><br>$60 = 30 + (80 - 30)e^{-30k}$<br><br>$30 = 50e^{-30k}$<br><br>$e^{-30k} = \\dfrac{3}{5}$<br><br>We need to find the temperature $T'$ after one hour, which is $t = 60$ min from the start:<br><br>$T' = 30 + (80 - 30)e^{-60k}$<br><br>$T' = 30 + 50(e^{-30k})^2$<br><br>Substituting the value of $e^{-30k}$:<br><br>$T' = 30 + 50\\left(\\dfrac{3}{5}\\right)^2$<br><br>$T' = 30 + 50\\left(\\dfrac{9}{25}\\right)$<br><br>$T' = 30 + 18 = 48^{\\circ}\\mathrm{C}$<br><br>Answer: $48^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213580aee93fa0796d80b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "The approximate value of $\\cos(30^\\circ 30')$ is, given that $1^\\circ = 0.0175^c$ and $\\cos 30^\\circ = 0.8660$", "image": null}, "options": [{"id": "D9dWT", "text": "0.8778", "image": null, "isCorrect": false}, {"id": "fAYMg", "text": "0.7666", "image": null, "isCorrect": false}, {"id": "EuNQI", "text": "0.7916", "image": null, "isCorrect": false}, {"id": "pecMW", "text": "0.8616", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $f(x) = \\cos x$<br><br>We need to find the value of $f(x + \\Delta x)$ where $x = 30^\\circ$ and $\\Delta x = 30' = 0.5^\\circ$<br><br>Converting $\\Delta x$ into radians:<br><br>$\\Delta x = 0.5 \\times 0.0175 = 0.00875$ radians<br><br>Using the approximation formula:<br><br>$f(x + \\Delta x) \\approx f(x) + f'(x) \\Delta x$<br><br>Here, $f'(x) = -\\sin x$<br><br>Substituting the values:<br><br>$\\cos(30^\\circ 30') \\approx \\cos 30^\\circ - \\sin 30^\\circ \\times \\Delta x$<br><br>$\\cos(30^\\circ 30') \\approx 0.8660 - 0.5 \\times 0.00875$<br><br>$\\cos(30^\\circ 30') \\approx 0.8660 - 0.004375$<br><br>$\\cos(30^\\circ 30') \\approx 0.861625$<br><br>Rounding to four decimal places, we get $0.8616$<br><br>Answer: 0.8616", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213560aee93fa0796d7ff", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "A bullet is shot horizontally and its distance S cm at time t second is given by $\\mathrm{S}=1200 \\mathrm{t}-15 \\cdot \\mathrm{t}^2$, then the distance covered by the bullet when it comes to the rest, is", "image": null}, "options": [{"id": "yAX9c", "text": "12000 cm", "image": null, "isCorrect": false}, {"id": "MSLiP", "text": "24000 cm", "image": null, "isCorrect": true}, {"id": "gtEob", "text": "1200 cm", "image": null, "isCorrect": false}, {"id": "wrawL", "text": "2400 cm", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $S = 1200t - 15t^2$<br><br>Velocity $v = \\dfrac{dS}{dt} = 1200 - 30t$<br><br>The bullet comes to rest when $v = 0$<br><br>$1200 - 30t = 0 \\Rightarrow t = 40$ s<br><br>Distance covered in $40$ s is:<br><br>$S = 1200(40) - 15(40)^2$<br><br>$S = 48000 - 15(1600)$<br><br>$S = 48000 - 24000 = 24000$ cm<br><br>Answer: 24000 cm", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213540aee93fa0796d7f2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "A stone is dropped into a quiet lake and waves move in circles at speed of $8 \\mathrm{~cm} / \\mathrm{sec}$. At the instant when the radius of the circular wave is 12 cm . how fast is the enclosed area increasing?", "image": null}, "options": [{"id": "yyMCd", "text": "$180 \\pi \\mathrm{~cm}^2 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "mkl2D", "text": "$196 \\pi \\mathrm{~cm}^2 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "zUZWZ", "text": "$192 \\pi \\mathrm{~cm}^2 / \\mathrm{sec}$", "image": null, "isCorrect": true}, {"id": "ddHUj", "text": "$200 \\pi \\mathrm{~cm}^2 / \\mathrm{sec}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $r$ be the radius of the circular wave and $A$ be the enclosed area.<br><br>Given that the waves move in circles at a speed of $8 \\text{ cm/sec}$, the rate of change of the radius is $\\dfrac{dr}{dt} = 8 \\text{ cm/sec}$.<br><br>The area of the circle is given by $A = \\pi r^2$.<br><br>Differentiating with respect to time $t$, we get:<br><br>$\\dfrac{dA}{dt} = 2\\pi r \\dfrac{dr}{dt}$<br><br>At the instant when $r = 12 \\text{ cm}$, substituting the values gives:<br><br>$\\dfrac{dA}{dt} = 2\\pi (12)(8) = 192\\pi \\text{ cm}^2/\\text{sec}$<br><br>Answer: $192 \\pi \\mathrm{~cm}^2 / \\mathrm{sec}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213450aee93fa0796d778", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The approximate value of $\\sqrt[3]{0 \\cdot 026}$ is", "image": null}, "options": [{"id": "8pHBp", "text": "0.2762", "image": null, "isCorrect": false}, {"id": "UwNK0", "text": "0.2963", "image": null, "isCorrect": true}, {"id": "IA43Y", "text": "0.2632", "image": null, "isCorrect": false}, {"id": "dFLdO", "text": "0.2692", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $y = x^{1/3}$. We need to find the value of $y$ when $x = 0.026$.<br><br>Let $x = 0.027$ and $\\Delta x = -0.001$.<br><br>For $x = 0.027$, $y = (0.027)^{1/3} = 0.3$.<br><br>Differentiating $y$ with respect to $x$, we get:<br><br>$\\dfrac{dy}{dx} = \\dfrac{1}{3} x^{-2/3} = \\dfrac{1}{3(0.027)^{2/3}} = \\dfrac{1}{3(0.09)} = \\dfrac{1}{0.27} = \\dfrac{100}{27}$<br><br>Using the approximation $\\Delta y \\approx \\dfrac{dy}{dx} \\Delta x$:<br><br>$\\Delta y \\approx \\dfrac{100}{27} \\times (-0.001) = -\\dfrac{0.1}{27} = -\\dfrac{1}{270} \\approx -0.0037$<br><br>The approximate value of $\\sqrt[3]{0.026}$ is:<br><br>$y + \\Delta y \\approx 0.3 - 0.0037 = 0.2963$<br><br>Answer: 0.2963", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213300aee93fa0796d6d5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "A spherical metal ball at $80^{\\circ} \\mathrm{C}$ cools in 5 minutes to $60^{\\circ} \\mathrm{C}$, in surrounding temperature of $20^{\\circ} \\mathrm{C}$, then the temperature of the ball after 20 minutes is approximately", "image": null}, "options": [{"id": "WaVsr", "text": "$(8.15)^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "qlMYX", "text": "$(11.85)^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "huiQy", "text": "$(28.15)^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "aqvIx", "text": "$(31.85)^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "According to Newton's law of cooling, the temperature $T$ of a body at time $t$ is given by:<br><br>$T(t) = T_s + (T_0 - T_s) e^{-kt}$<br><br>where $T_s$ is the surrounding temperature and $T_0$ is the initial temperature.<br><br>Given $T_0 = 80^{\\circ} \\mathrm{C}$, $T_s = 20^{\\circ} \\mathrm{C}$, and $T(5) = 60^{\\circ} \\mathrm{C}$ at $t = 5$ minutes:<br><br>$60 = 20 + (80 - 20) e^{-5k}$<br><br>$40 = 60 e^{-5k}$<br><br>$e^{-5k} = \\dfrac{2}{3}$<br><br>We need to find the temperature after 20 minutes, which corresponds to $t = 20$:<br><br>$T(20) = 20 + (80 - 20) e^{-20k}$<br><br>$T(20) = 20 + 60 (e^{-5k})^4$<br><br>Substituting the value of $e^{-5k}$:<br><br>$T(20) = 20 + 60 \\left(\\dfrac{2}{3}\\right)^4$<br><br>$T(20) = 20 + 60 \\times \\dfrac{16}{81}$<br><br>$T(20) = 20 + \\dfrac{320}{27}$<br><br>$T(20) \\approx 20 + 11.85$<br><br>$T(20) \\approx 31.85^{\\circ} \\mathrm{C}$<br><br>Answer: $(31.85)^{\\circ} \\mathrm{C}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262890279619d9d8a3551", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "Let $\\mathrm{P}(x)$ be a polynomial of degree 2 , with $\\mathrm{P}(2)=-1, \\mathrm{P}^{\\prime}(2)=0, \\mathrm{P}^{\\prime \\prime}(2)=2$, then $\\mathrm{P}(1.001)$ is", "image": null}, "options": [{"id": "oQduu", "text": "0.002", "image": null, "isCorrect": false}, {"id": "ueT6Z", "text": "-0.002", "image": null, "isCorrect": true}, {"id": "oKyYH", "text": "0.004", "image": null, "isCorrect": false}, {"id": "5rwHj", "text": "-0.004", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\text { Let } \\mathrm{P}(x)=\\mathrm{a} x^2+\\mathrm{b} x+\\mathrm{c} \\\\\n& \\Rightarrow \\mathrm{P}^{\\prime}(x)=2 \\mathrm{a} x+\\mathrm{b} \\\\\n& \\Rightarrow \\mathrm{P}^{\\prime \\prime}(x)=2 \\mathrm{a} \\\\\n& \\mathrm{P}^{\\prime \\prime}(2)=2 \\mathrm{a} \\\\\n& \\Rightarrow 2=2 \\mathrm{a} \\\\\n& \\Rightarrow \\mathrm{a}=1 \\\\\n& \\mathrm{P}^{\\prime}(2)=2 \\mathrm{a}(2)+\\mathrm{b} \\\\\n& \\Rightarrow 0=4 \\mathrm{a}+\\mathrm{b} \\\\\n& \\Rightarrow 0=4(1)+\\mathrm{b} \\\\\n& \\Rightarrow \\mathrm{b}=-4 \\\\\n& \\mathrm{P}(2)=\\mathrm{a}(2)^2+\\mathrm{b}(2)+\\mathrm{c} \\\\\n& \\Rightarrow-1=4 \\mathrm{a}+2 \\mathrm{~b}+\\mathrm{c} \\\\\n& \\Rightarrow-1=4(1)+2(-4)+\\mathrm{c} \\\\\n& \\Rightarrow \\mathrm{c}=3 \\\\\n& \\mathrm{P}(x)=x^2-4 x+3 \\\\\n& \\Rightarrow \\mathrm{P}^{\\prime}(x)=2 x-4 \\\\\n& x=1.001=1+0.001=\\mathrm{a}+\\mathrm{h}\n\\end{aligned}$\nHere, $\\mathrm{a}=1, \\mathrm{~h}=0.001$\n$\\begin{gathered}\n\\mathrm{P}(\\mathrm{a})=\\mathrm{P}(1)=1-4+3=0 \\\\\n\\mathrm{P}^{\\prime}(\\mathrm{a})=\\mathrm{P}^{\\prime}(1)=2-4=-2\n\\end{gathered}$\n$\\therefore \\quad \\mathrm{P}(1.001)=0+(0.001)(-2)=-0.002$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262850279619d9d8a3535", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "The diagonal of a square is changing at the rate of $0.5 \\mathrm{~cm} / \\mathrm{sec}$. Then the rate of change of area when the area is $400 \\mathrm{~cm}^2$ is equal to", "image": null}, "options": [{"id": "8ivw0", "text": "$20 \\sqrt{2} \\mathrm{~cm}^2 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "S7mmo", "text": "$10 \\sqrt{2} \\mathrm{~cm}^2 / \\mathrm{sec}$", "image": null, "isCorrect": true}, {"id": "JHyYD", "text": "$\\frac{1}{10 \\sqrt{2}} \\mathrm{~cm}^2 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "TI9Pg", "text": "$\\frac{10}{\\sqrt{2}} \\mathrm{~cm}^2 / \\mathrm{sec}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/l5VcQSw4PtmM_coCfl2CWKfM8L5rO84gFiLK0bZ9n9c.original.fullsize.png\"><br>\n$\\begin{array}{ll} \n& \\frac{\\mathrm{d} x}{\\mathrm{dt}}=0.5 \\mathrm{~cm} / \\mathrm{sec} \\\\\n\\therefore \\quad & \\text { Area }=\\frac{x^2}{2} \\\\\n\\therefore \\quad & \\frac{\\mathrm{dA}}{\\mathrm{dt}}=\\frac{2 x}{2} \\cdot \\frac{\\mathrm{d} x}{\\mathrm{dt}}=x \\frac{\\mathrm{d} x}{\\mathrm{dt}}=\\frac{1}{2} x\n\\end{array}$\n$\\begin{aligned} \\therefore \\quad\\left[\\frac{\\mathrm{dA}}{\\mathrm{dt}}\\right]_{\\mathrm{A}=400} & =\\frac{1}{2} \\sqrt{800} \\quad \\ldots\\left[\\begin{array}{l}\\because \\mathrm{A}=400 \\mathrm{~cm}^2 \\\\ x=\\sqrt{800} \\mathrm{~cm}\\end{array}\\right] \\\\ & =10 \\sqrt{2} \\mathrm{~cm}^2 / \\mathrm{sec}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262740279619d9d8a34ad", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Let $B \\equiv(0,3)$ and $C \\equiv(4,0)$. The point $A$ is moving on the line $y=2 x$ at the rate of 2 units/second. The area of $\\triangle \\mathrm{ABC}$ is increasing at the rate of", "image": null}, "options": [{"id": "OhA3y", "text": "$\\frac{11}{\\sqrt{5}}$ (units $)^2 / \\mathrm{sec}$", "image": null, "isCorrect": true}, {"id": "oIajB", "text": "$\\frac{11}{5}$ (units) $)^2 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "qw44T", "text": "$\\frac{43}{\\sqrt{5}}$ (units $)^2 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "Huiyh", "text": "$\\frac{13}{5}$ (units) $)^2 / \\mathrm{sec}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Let } \\mathrm{A}=(\\mathrm{h}, 2 \\mathrm{~h}) \\\\ & \\quad \\mathrm{OA}=\\sqrt{\\mathrm{h}^2+4 \\mathrm{~h}^2}=\\sqrt{5} \\mathrm{~h} \\\\ & \\therefore \\quad \\frac{\\mathrm{d}(\\mathrm{OA})}{\\mathrm{dt}}=\\sqrt{5} \\frac{\\mathrm{dh}}{\\mathrm{dt}} \\\\ & \\Rightarrow 2=\\sqrt{5} \\frac{\\mathrm{dh}}{\\mathrm{dt}} \\\\ & \\Rightarrow \\frac{\\mathrm{dh}}{\\mathrm{dt}}=\\frac{2}{\\sqrt{5}}\\end{aligned}$\n$\\begin{aligned} \\alpha & =\\mathrm{A}(\\triangle \\mathrm{ABC})=\\frac{1}{2}\\left|\\begin{array}{ccc}\\mathrm{h} & 2 \\mathrm{~h} & 1 \\\\ 0 & 3 & 1 \\\\ 4 & 0 & 1\\end{array}\\right| \\\\ & =\\frac{1}{2}(3 \\mathrm{~h}+8 \\mathrm{~h}-12) \\\\ & =\\frac{11 \\mathrm{~h}-12}{2} \\\\ \\therefore \\quad \\frac{\\mathrm{d} \\alpha}{\\mathrm{dt}} & =\\frac{11}{2} \\cdot \\frac{\\mathrm{dh}}{\\mathrm{dt}} \\\\ & =\\frac{11}{2} \\cdot \\frac{2}{\\sqrt{5}} \\\\ & =\\frac{11}{\\sqrt{5}}(\\text { units })^2 / \\mathrm{sec}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2625f0279619d9d8a33fc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Water is running in a hemispherical bowl of radius $180 \\mathrm{~cm}$ at the rate of 108 cubic decimetres per minute. How fast the water level is rising when depth of the water level in the bowl is $120 \\mathrm{~cm}$ ?\n$(1$ decimeter $=10 \\mathrm{~cm})$", "image": null}, "options": [{"id": "PUa16", "text": "$16 \\pi \\mathrm{cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "rNgtn", "text": "$\\frac{16}{\\pi} \\mathrm{cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "s0zcG", "text": "$\\frac{1}{16 \\pi} \\mathrm{cm} / \\mathrm{sec}$", "image": null, "isCorrect": true}, {"id": "wmmN6", "text": "$\\frac{\\pi}{16} \\mathrm{~cm} / \\mathrm{sec}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Radius of hemispherical bowl $(\\mathrm{r})=180 \\mathrm{~cm}$ Rate of flow $\\left(\\frac{\\mathrm{dV}}{\\mathrm{dt}}\\right)=108 \\mathrm{dm}^3 / \\mathrm{min}$\n$\\begin{aligned} & =108000 \\mathrm{~cm}^3 / \\mathrm{min} \\\\ & =\\frac{108000}{60} \\mathrm{~cm}^3 / \\mathrm{sec} \\\\ & =1800 \\mathrm{~cm}^3 / \\mathrm{sec}\\end{aligned}$\nLet depth of water in bowl be $x$.\n$\\therefore \\quad$ Volume of water in hemispherical.\n$\\begin{aligned} & \\text { bowl }(\\mathrm{V})=\\frac{\\pi}{3} x^2(3 \\mathrm{r}-x) \\\\ & \\mathrm{V}=\\frac{\\pi}{3} x^2(3 \\times 180-x)\\end{aligned}$\n$\\therefore \\quad \\mathrm{V}=180 \\pi x^2-\\frac{\\pi}{3} x^3$\nDifferentiating w.r.t. $x$, we get\n$\\frac{\\mathrm{dV}}{\\mathrm{dt}}=360 \\pi x \\frac{\\mathrm{d} x}{\\mathrm{dt}}-\\pi x^2 \\frac{\\mathrm{d} x}{\\mathrm{dt}}$\n$\\left.\\frac{\\mathrm{dV}}{\\mathrm{dt}}\\right|_{x=120}=\\frac{\\mathrm{d} x}{\\mathrm{dt}}\\left(360 \\pi \\times 120-120^2 \\pi\\right)$\n$\\therefore \\quad 1800=\\frac{\\mathrm{d} x}{\\mathrm{dt}}\\left(360 \\pi \\times 120-120^2 \\pi\\right)$\n$\\therefore \\quad 15=\\frac{\\mathrm{d} x}{\\mathrm{dt}}(360 \\pi-120 \\pi)$\n$\\frac{\\mathrm{d} x}{\\mathrm{dt}}=\\frac{15}{240 \\pi}$\n$=\\frac{1}{16 \\pi} \\mathrm{cm} / \\mathrm{sec}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262510279619d9d8a3390", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "A right circular cone has height $9 \\mathrm{~cm}$ and radius of base $5 \\mathrm{~cm}$. It is inverted and water is poured into it. If at any instant, the water level rises at the rate $\\frac{\\pi}{\\mathrm{A}} \\mathrm{cm} / \\mathrm{sec}$. where $\\mathrm{A}$ is area of the water surface at that instant, then cone is completely filled in", "image": null}, "options": [{"id": "k9rEh", "text": "$70 \\mathrm{sec}$.", "image": null, "isCorrect": false}, {"id": "cGCAp", "text": "$75 \\mathrm{sec}$.", "image": null, "isCorrect": true}, {"id": "2YFDA", "text": "$72 \\mathrm{sec}$.", "image": null, "isCorrect": false}, {"id": "5et3E", "text": "$77 \\mathrm{sec}$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/EacbuPluS0FHXvy3teJp6mFUFacYeP0-uiHv4ijKE1I.original.fullsize.png\"><br>\n\nFor the conical vessel, $\\mathrm{h}=9 \\mathrm{~cm}, \\mathrm{r}=5 \\mathrm{~cm}$\n$\\therefore \\quad$ Full volume of the vessel,\n$$\n\\begin{aligned}\n\\mathrm{V} & =\\frac{1}{3} \\pi \\mathrm{r}^2 \\mathrm{~h} \\\\\n& =\\frac{1}{3} \\pi \\times 25 \\times 9 \\\\\n& =75 \\pi \\mathrm{cm}^3\n\\end{aligned}\n$$\nNow, $\\frac{\\mathrm{h}}{\\mathrm{r}}=\\frac{9}{5}$\n$$\n\\begin{aligned}\n& \\therefore \\quad \\mathrm{r}=\\frac{5 \\mathrm{~h}}{9} \\\\\n& \\therefore \\quad \\mathrm{A}=\\pi \\mathrm{r}^2=\\pi \\frac{25 \\mathrm{~h}^2}{81}\n\\end{aligned}\n$$\nAccording to the given condition, $\\frac{\\mathrm{dh}}{\\mathrm{dt}}=\\frac{\\pi}{\\mathrm{A}}=\\pi \\frac{81}{\\pi 25 \\mathrm{~h}^2}=\\frac{81}{25 \\mathrm{~h}^2}$\n$\\therefore \\quad h^2 \\mathrm{dh}=\\frac{81}{25} \\mathrm{dt}$\nIntegrating on both sides, we get\n$$\n\\begin{aligned}\n& \\frac{\\mathrm{h}^3}{3}=\\frac{81}{25} \\mathrm{t}+\\mathrm{c}_1 \\\\\n\\therefore \\quad & \\mathrm{h}^3=\\frac{243}{25} \\mathrm{t}+\\mathrm{c}, \\text { where } \\mathrm{c}=3 \\mathrm{c}_1\n\\end{aligned}\n$$\nNaturally, $\\mathrm{h}=0$, when $\\mathrm{t}=0$ and hence, $\\mathrm{c}=0$\n$$\n\\begin{aligned}\n\\therefore \\quad \\mathrm{h}^3 & =\\frac{243}{25} \\mathrm{t} \\\\\n\\therefore \\quad \\mathrm{V} & =\\frac{1}{3} \\pi \\mathrm{r}^2 \\mathrm{~h} \\\\\n& =\\frac{1}{3} \\pi \\frac{25 \\mathrm{~h}^2}{81} \\mathrm{~h} \\\\\n& =\\frac{25}{243} \\pi \\mathrm{h}^3 \\\\\n& =\\frac{25}{243} \\pi \\frac{243}{25} \\mathrm{t} \\\\\n\\therefore \\quad \\mathrm{V} & =\\pi \\mathrm{t}\n\\end{aligned}\n$$\nBut volume of vessel, $\\mathrm{V}=75 \\pi$\n$$\n\\begin{array}{ll}\n\\therefore & \\pi \\mathrm{t}=75 \\pi \\\\\n\\therefore & \\mathrm{t}=75 \\text { seconds. }\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2623d0279619d9d8a32ea", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "Water flows from the base of rectangular tank, of depth 16 meters. The rate of flow of the water is proportional to the square root of depth at any time $\\mathrm{t}$. If depth is $4 \\mathrm{~m}$ when $\\mathrm{t}=2$ hours, then after 3.5 hours the depth (in meters) is", "image": null}, "options": [{"id": "TD9D6", "text": "$0$", "image": null, "isCorrect": false}, {"id": "Ivvhu", "text": "$0.25$", "image": null, "isCorrect": true}, {"id": "gdc1o", "text": "$0.5$", "image": null, "isCorrect": false}, {"id": "Zz731", "text": "$3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/7aHEShuqekarzkr2k6KiUkeB4U77lMRAHF2UcE6x0po.original.fullsize.png\"><br>\nGiven that $\\frac{\\mathrm{d} x}{\\mathrm{dt}} \\propto \\sqrt{x}$\n$\\therefore \\quad \\frac{\\mathrm{d} x}{\\mathrm{dt}}=\\mathrm{a} \\sqrt{x}$, for real number a\n$\\therefore \\quad \\int \\frac{\\mathrm{d} x}{\\sqrt{x}}=\\int \\mathrm{adt}$\n$\\therefore \\quad 2 \\sqrt{x}=\\mathrm{at}+\\mathrm{c}$\nWhen $\\mathrm{t}=0, x=16$\n$\\therefore \\quad$ (i) $\\Rightarrow \\mathrm{c}=8$\n$\\therefore \\quad$ (i) becomes $2 \\sqrt{x}=$ at +8\nWhen $\\mathrm{t}=2, x=4$\n$\\therefore \\quad$ (ii) $\\Rightarrow \\mathrm{a}=-2$\n$\\therefore \\quad$ (ii) becomes $2 \\sqrt{x}=-2 t+8$\n$\\therefore \\quad$ when $\\mathrm{t}=3.5$\n(iii) $\\Rightarrow x=0.25 \\mathrm{~m}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2623c0279619d9d8a32e4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "A tank with a rectangular base and rectangular sides, open at the top is to be constructed so that its depth is 4 meter and volume is 36 cubic meters. If building of the tank costs $₹ 100$ per square meter for the base and $₹ 50$ per square meter for the sides, then the cost of least expensive tank is", "image": null}, "options": [{"id": "qkPfo", "text": "$₹ 3000$", "image": null, "isCorrect": false}, {"id": "8WE5H", "text": "$₹ 3300$", "image": null, "isCorrect": true}, {"id": "wgYuy", "text": "$₹ 2400$", "image": null, "isCorrect": false}, {"id": "WrNPW", "text": "$₹ 3500$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let length and breadth of the tank be ' $x$ ' $\\mathrm{m}$ and ' $y$ ' $m$ respectively.\n\nHeight of the tank is $4 \\mathrm{~m}$.\nVolume $=36 \\mathrm{~m}^3$\n$$\n\\begin{array}{ll}\n\\therefore & 4 x y=36 \\\\\n\\therefore & x y=9 \\\\\n\\therefore & y=\\frac{9}{x}\n\\end{array}\n$$\n$\\therefore \\quad$ Total area of the tank including sides and base $=x y+2(4 x)+2(4 y)$\n....[From (i) and (ii)]\n$\\therefore \\quad \\mathrm{f}(x)=9+8 x+8\\left(\\frac{9}{x}\\right)$\n$$\n=9+8 x+\\frac{72}{x}\n$$\n$$\n\\therefore \\quad \\mathrm{f}^{\\prime}(x)=8-\\frac{72}{x^2}\n$$\n$\\therefore \\quad \\mathrm{f}^{\\prime}(x)=0 \\Rightarrow x=3$\n$$\n\\Rightarrow y=3\n$$\n$\\therefore \\quad$ Required cost $=100 \\times(3 \\times 3)+50$\n$$\n\\begin{aligned}\n& \\times(2 \\times 4 \\times 3+2 \\times 4 \\times 3) \\\\\n= & 900+2400 \\\\\n= & ₹ 3300\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2623a0279619d9d8a32d4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "A poster is to be printed on a rectangular sheet of paper of area $18 \\mathrm{~m}^2$. The margins at the top and bottom of $75 \\mathrm{~cm}$ each and at the sides $50 \\mathrm{~cm}$ each are to be left. Then the dimensions i.e. height and breadth of the sheet, so that the space available for printing is maximum, are respectively.", "image": null}, "options": [{"id": "k7pIB", "text": "$2 \\sqrt{3} \\mathrm{~m}, 3 \\sqrt{3} \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "1R7uB", "text": "$3 \\sqrt{3} \\mathrm{~m}, 2 \\sqrt{3} \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "mW6Dn", "text": "$3 \\mathrm{~m}, 6 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "JXtJC", "text": "$6 \\mathrm{~m}, 3 \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/3U80ui6ARx2YWMHPRMOprnDUK7Z0LYe3gZ6jdTYpPxo.original.fullsize.png\"><br>\nLet height and breadth of the sheet be ' $y$ ' $\\mathrm{m}$ and ' $x$ ' $\\mathrm{m}$ respectively.\n$$\n\\begin{aligned}\n& \\therefore \\quad x y=180000 \\mathrm{~cm}^2 \\\\\n& \\therefore \\quad y=\\frac{180000}{x}\n\\end{aligned}\n$$\n$\\therefore \\quad$ The area available for printing is\n$$\n\\begin{aligned}\n\\mathrm{A} & =(y-150)(x-100) \\\\\n& =\\left(\\frac{180000}{x}-150\\right)(x-100) \\\\\n& =180000-\\frac{18000000}{x}-150 x-15000 \\\\\n& =165000-150 x-\\frac{18000000}{x} \\\\\n\\therefore \\quad \\frac{\\mathrm{dA}}{\\mathrm{d} x} & =0-150+\\frac{18000000}{x^2} \\\\\n\\therefore \\quad \\frac{\\mathrm{dA}}{\\mathrm{d} x} & =0 \\Rightarrow x^2=\\frac{18000000}{150}=120000 \\\\\n\\Rightarrow x=200 \\sqrt{3} \\mathrm{~cm} & \\Rightarrow y=\\frac{180000}{200 \\sqrt{3}}=300 \\sqrt{3} \\mathrm{~cm}\n\\end{aligned}\n$$\n\nNow, $\\frac{\\mathrm{d}^2 \\mathrm{~A}}{\\mathrm{~d} x^2}=\\frac{-36000000}{x^3}$\n$\\therefore \\quad$ At $x=200 \\sqrt{3} \\mathrm{~cm}, \\frac{\\mathrm{d}^2 \\mathrm{~A}}{\\mathrm{~d} x^2} < 0$\n$\\therefore \\quad$ Area is maximum at $x=200 \\sqrt{3} \\mathrm{~cm}$ and $\\begin{aligned} y & =300 \\sqrt{3} \\mathrm{~cm} \\\\ \\therefore \\quad y & =3 \\sqrt{3} \\mathrm{~m} \\text { and } x=2 \\sqrt{3} \\mathrm{~m}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261f20279619d9d8a309b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}], "question": {"text": "If the surface area of a spherical balloon of radius $6 \\mathrm{~cm}$ is increasing at the rate $2 \\mathrm{~cm}^2 / \\mathrm{sec}$, then the rate of increase in its volume in $\\mathrm{cm}^3 / \\mathrm{sec}$ is", "image": null}, "options": [{"id": "YB4b4", "text": "$16$", "image": null, "isCorrect": false}, {"id": "mEWZS", "text": "$6$", "image": null, "isCorrect": true}, {"id": "TDWST", "text": "$12$", "image": null, "isCorrect": false}, {"id": "4TmCz", "text": "$8$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Surface area, $S=4 \\pi r^2$\n$\\begin{aligned}\n& \\therefore \\quad \\frac{\\mathrm{dS}}{\\mathrm{dt}}=8 \\pi \\mathrm{r} \\frac{\\mathrm{dr}}{\\mathrm{dt}} \\\\\n& \\Rightarrow 2=8 \\pi \\mathrm{r} \\frac{\\mathrm{dr}}{\\mathrm{dt}} \\\\\n& \\Rightarrow \\frac{\\mathrm{dr}}{\\mathrm{dt}}=\\frac{1}{4 \\pi \\mathrm{r}}...(i) \\\\\n& \\text { Volume, } V=\\frac{4}{3} \\pi r^3 \\\\\n& \\therefore \\quad \\frac{\\mathrm{dV}}{\\mathrm{dt}}=\\frac{4}{3} \\times 3 \\pi \\mathrm{r}^2 \\times \\frac{\\mathrm{dr}}{\\mathrm{dt}} \\\\\n& =4 \\pi r^2 \\times \\frac{1}{4 \\pi r}... [From (i)] \\\\\n& =\\mathrm{r} \\\\\n& =6 \\mathrm{~cm}^3 / \\mathrm{sec} \\\\\n&\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ad", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 2)", "title": "MHT CET 2023 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261e00279619d9d8a3006", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "A kite is $120 \\mathrm{~m}$ high and $130 \\mathrm{~m}$ of string is out. If the kite is moving away horizontally at the rate of $39 \\mathrm{~m} / \\mathrm{sec}$, then the rate at which the string is being out, is", "image": null}, "options": [{"id": "Hu3AN", "text": "$12 \\mathrm{~m} / \\mathrm{sec}$.", "image": null, "isCorrect": false}, {"id": "zYilZ", "text": "$15 \\mathrm{~m} / \\mathrm{sec}$.", "image": null, "isCorrect": true}, {"id": "Dip4i", "text": "$18 \\mathrm{~m} / \\mathrm{sec}$.", "image": null, "isCorrect": false}, {"id": "SVVVM", "text": "$20 \\mathrm{~m} / \\mathrm{sec}$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/XMh-3oePJ9QjPlheliKPjTVrzT9okNSPDN5s_7jjbp4.original.fullsize.png\"><br>\nLet 'P' be the position of the kite and PR be the string.\nLet $\\mathrm{QR}=x$ and $\\mathrm{PR}=y$\nBy Pythagoras theorem,\n$\\begin{aligned}\n& -\\mathrm{PR}^2=\\mathrm{PQ}^2+\\mathrm{QR}^2 \\\\\n& \\Rightarrow y^2=(120)^2+x^2... (i)\n\\end{aligned}$\nDifferentiating w.r.t.t, we get\n$\\begin{aligned}\n& 2 y \\frac{\\mathrm{d} y}{\\mathrm{dt}}=2 x \\frac{\\mathrm{d} x}{\\mathrm{dt}} \\\\\n& \\Rightarrow y \\frac{\\mathrm{d} y}{\\mathrm{dt}}=x \\frac{\\mathrm{d} x}{\\mathrm{dt}}... (ii)\n\\end{aligned}$\nNow, kite is moving away horizontally at the rate of $39 \\mathrm{~m} / \\mathrm{sec}$.\n$\\begin{aligned}\n\\therefore \\quad & \\frac{\\mathrm{d} x}{\\mathrm{dt}}=39 \\mathrm{~m} / \\mathrm{sec} \\\\\n& \\text { From (i), } \\\\\n& (130)^2=(120)^2+x^2 \\\\\n\\Rightarrow & x^2=16900-14400 \\\\\n\\Rightarrow & x^2=2500 \\\\\n\\Rightarrow & x=50 \\\\\n& \\text { From (ii), } \\\\\n& 130 \\frac{\\mathrm{d} y}{\\mathrm{dt}}=50 \\times 39 \\\\\n\\therefore \\quad & \\frac{\\mathrm{d} y}{\\mathrm{dt}}=\\frac{50 \\times 39}{130}=15 \\mathrm{~m} / \\mathrm{sec}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261de0279619d9d8a2ff9", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "A ladder of length $17 \\mathrm{~m}$ rests with one end against a vertical wall and the other on the level ground. If the lower end slips away at the rate of $1 \\mathrm{~m} / \\mathrm{sec}$., then when it is $8 \\mathrm{~m}$ away from the wall, its upper end is coming down at the rate of", "image": null}, "options": [{"id": "556MN", "text": "$\\frac{5}{8} \\mathrm{~m} / \\mathrm{sec}$.", "image": null, "isCorrect": false}, {"id": "Zs96B", "text": "$\\frac{8}{15} \\mathrm{~m} / \\mathrm{sec}$.", "image": null, "isCorrect": true}, {"id": "EGg7S", "text": "$\\frac{-8}{15} \\mathrm{~m} / \\mathrm{sec}$.", "image": null, "isCorrect": false}, {"id": "brZi8", "text": "$\\frac{15}{8} \\mathrm{~m} / \\mathrm{sec}$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/giaJ43zBv8W7yF1jhjU8O1f_HQ42SSQvqTrrrIrTHQo.original.fullsize.png\"><br>\nIn $\\triangle \\mathrm{ABC}, \\mathrm{AC}$ represents ladder\n$\\mathrm{AB} \\rightarrow$ vertical wall\nLet $\\mathrm{AB}=x, \\mathrm{BC}=y$\n$\\therefore \\quad \\angle \\mathrm{ABC}=90^{\\circ}$\nBy Pythagoras theorem,\n$\\begin{aligned}\n& \\mathrm{AB}^2+\\mathrm{BC}^2=\\mathrm{AC}^2 \\\\\n& \\Rightarrow x^2+y^2=17^2 \\\\\n& \\Rightarrow x^2=289-y^2 ... (i)\\\\\n& \\Rightarrow x^2=289-64 \\\\\n& \\Rightarrow x^2=225 \\\\\n& \\Rightarrow x=15 \\mathrm{~m}\n\\end{aligned}$\nConsider equation (i),\n$x^2=289-y^2$\nDifferentiating w.r.t. t, we get\n$\\begin{aligned}\n& 2 x \\frac{\\mathrm{d} x}{\\mathrm{dt}}=-2 y \\frac{\\mathrm{d} y}{\\mathrm{dt}} \\\\\n& \\Rightarrow 15 \\frac{\\mathrm{d} x}{\\mathrm{dt}}=-8(1) \\\\\n& \\Rightarrow \\frac{\\mathrm{d} x}{\\mathrm{dt}}=\\frac{-8}{15} \\mathrm{~m} / \\mathrm{s}\n\\end{aligned}$\nNegative sign shows that the ladder is moving down. i.e., vertical length is decreasing\n$\\therefore \\quad$ Upper end is coming down at the rate of $\\frac{8}{15} \\mathrm{~m} / \\mathrm{s}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261dd0279619d9d8a2ff3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "A square plate is contracting at the uniform rate $4 \\mathrm{~cm}^2 / \\mathrm{sec}$, then the rate at which the perimeter is decreasing, when side of the square is $20 \\mathrm{~cm}$, is", "image": null}, "options": [{"id": "VKfaf", "text": "$\\frac{1}{5} \\mathrm{~cm} / \\mathrm{sec}$.", "image": null, "isCorrect": false}, {"id": "uA7lX", "text": "$4 \\mathrm{~cm} / \\mathrm{sec}$.", "image": null, "isCorrect": false}, {"id": "xoKob", "text": "$2 \\mathrm{~cm} / \\mathrm{sec}$.", "image": null, "isCorrect": false}, {"id": "j92nT", "text": "$\\frac{2}{5} \\mathrm{~cm} / \\mathrm{sec}$.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $\\mathrm{A}, \\mathrm{P}$ and $\\mathrm{X}$ be the area, perimeter and length of side of square respectively at time ' $\\mathrm{t}$ ' seconds. Then,\n$\\begin{aligned}\n\\mathrm{A} & =\\mathrm{X}^2, \\mathrm{P}=4 \\mathrm{X} \\\\\n\\therefore \\quad \\mathrm{P} & =4 \\sqrt{\\mathrm{A}}\n\\end{aligned}$\nDifferentiating w.r.t. t, we get\n$\\begin{aligned}\n\\frac{\\mathrm{dP}}{\\mathrm{dt}} & =4 \\frac{1}{2 \\sqrt{\\mathrm{A}}} \\cdot \\frac{\\mathrm{dA}}{\\mathrm{dt}} \\\\\n& =\\frac{2}{\\mathrm{X}} \\cdot \\frac{\\mathrm{dA}}{\\mathrm{dt}} \\\\\n& =\\frac{2}{20} \\times 4...\\left[\\begin{array}{l}\n\\text { side }=20 \\mathrm{~cm} \\\\\n\\frac{\\mathrm{dA}}{\\mathrm{dt}}=4 \\mathrm{~cm}^2 / \\mathrm{sec}\n\\end{array}\\right] \\\\\n& =\\frac{2}{5} \\mathrm{~cm} / \\mathrm{sec}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b70279619d9d8a2ec2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "An object is moving in the clockwise direction around the unit circle $x^2+y^2=1$. As it passes through the point $\\left(\\frac{1}{2}, \\frac{\\sqrt{3}}{2}\\right)$, its $y$-co-ordinate is decreasing at the rate of 3 units per sec. The rate at which the $x$-co-ordinate changes at this point is", "image": null}, "options": [{"id": "IQ66q", "text": "$2$ units $/ \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "lwiEy", "text": "$3 \\sqrt{3}$ units $/ \\mathrm{sec}$", "image": null, "isCorrect": true}, {"id": "brdLb", "text": "$\\sqrt 3$ units $/ \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "amNxd", "text": "$2\\sqrt 3$ units $/ \\mathrm{sec}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation is $x^2+y^2=1$ Differentiating w.r.t. t, we get\n$\\begin{aligned}\n& 2 x \\frac{\\mathrm{d} x}{\\mathrm{dt}}+2 y \\frac{\\mathrm{d} y}{\\mathrm{dt}}=0 \\\\\n& 2 x \\frac{\\mathrm{d} x}{\\mathrm{dt}}+2 y(-3)=0 \\\\\n& \\frac{\\mathrm{d} x}{\\mathrm{dt}}=\\frac{6 y}{2 x} \\\\\n& \\frac{\\mathrm{d} x}{\\mathrm{dt}}=\\frac{3 y}{x} \\\\\n& \\left.\\frac{\\mathrm{d} x}{\\mathrm{dt}}\\right|_{\\left(\\frac{1}{2}, \\frac{\\sqrt{3}}{2}\\right)}=\\frac{3 \\times \\frac{\\sqrt{3}}{2}}{\\frac{1}{2}} \\\\\n& =3 \\sqrt{3} \\text { units/sec }\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b50279619d9d8a2eb4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "The approximate value of $\\log _{10} 998$ is (given that $\\log _{10} \\mathrm{e}=0.4343$ )", "image": null}, "options": [{"id": "0b7qs", "text": "3.0008686", "image": null, "isCorrect": false}, {"id": "1s9Mn", "text": "1.9991314", "image": null, "isCorrect": false}, {"id": "9iy0t", "text": "2.0008686", "image": null, "isCorrect": false}, {"id": "30ua1", "text": "2.9991314", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let\n$\\begin{aligned}\n\\mathrm{f}(x)=\\log _{10} x=\\frac{\\log _{\\mathrm{e}} x}{\\log _{\\mathrm{e}} 10} & =\\left(\\log _{10} \\mathrm{e}\\right)\\left(\\log _{\\mathrm{e}} x\\right) \\\\\n& =0.4343\\left(\\log _{\\mathrm{e}} x\\right)\n\\end{aligned}$\nOn differentiating w.r.t. $x$, we get\n$\\begin{aligned}\n\\mathrm{f}^{\\prime}(x) & =\\frac{0.4343}{x} \\\\\n\\text { Let } x & =998 \\\\\n& =1000-2=\\mathrm{a}+\\mathrm{h} \\\\\n\\therefore \\quad \\mathrm{a}= & 1000, \\mathrm{~h}=-2 \\\\\n\\mathrm{f}(\\mathrm{a}) & =\\mathrm{f}(1000) \\\\\n& =\\log _{10}(1000) \\\\\n& =3 \\log _{10} 10 \\\\\n\\therefore \\quad \\mathrm{f}(\\mathrm{a}) & =3\n\\end{aligned}$\n$\\begin{aligned}\n& \\text { Also, } \\mathrm{f}^{\\prime}(\\mathrm{a})=\\mathrm{f}^{\\prime}(1000)=\\frac{0.4343}{1000}=0.0004343 \\\\\n& \\mathrm{f}(\\mathrm{a}+\\mathrm{h}) \\approx \\mathrm{f}(\\mathrm{a})+\\mathrm{hf}^{\\prime}(\\mathrm{a}) \\\\\n& \\therefore \\quad \\log _{10}(998) \\approx 3-2(0.0004343) \\\\\n&\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a60279619d9d8a2e3a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "The radius of right circular cylinder increase at the rate $0.1 \\mathrm{~cm} / \\mathrm{min}$ and height decreases at the rate of $0 \\cdot 2 \\mathrm{~cm} / \\mathrm{min}$ The rate of change of volume of the cylinder in $\\mathrm{cm}^3 / \\mathrm{min}$, when the radius is $2 \\mathrm{~cm}$ and height is $3 \\mathrm{~cm}$, is", "image": null}, "options": [{"id": "v22Pk", "text": "$-2 \\mathrm{pm}^3 / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "G0fV9", "text": "$\\frac{-3 \\pi}{5} \\mathrm{~cm}^3 / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "X2UfQ", "text": "$\\frac{-8 \\pi}{5} \\mathrm{~cm}^3 / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "uqvKF", "text": "$\\frac{2 \\pi}{5} \\mathrm{~cm}^3 / \\mathrm{min}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & V=p r^2 h \\\\ & \\Rightarrow \\frac{\\mathrm{d} v}{\\mathrm{~d} t}=\\pi\\left\\{2 r \\cdot \\frac{\\mathrm{d} r}{\\mathrm{~d} t} \\cdot h+r^2 \\cdot \\frac{\\mathrm{d} h}{\\mathrm{~d} t}\\right\\} \\\\ & =\\pi\\left\\{2 \\times 2 \\times 0 \\cdot 1 \\times 3+2^2 \\times(-0 \\cdot 2)\\right\\} \\\\ & =\\pi\\{1 \\cdot 2-0 \\cdot 8\\}=0 \\cdot 4 \\pi=\\frac{2 \\pi}{5} \\mathrm{~cm}^3 / \\mathrm{min}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a30279619d9d8a2e21", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "The rate of change volume of a sphere with respect to its surface area when the radius is 5 meters is", "image": null}, "options": [{"id": "SbXAg", "text": "$\\frac{2}{5}$", "image": null, "isCorrect": false}, {"id": "CrvQm", "text": "5", "image": null, "isCorrect": false}, {"id": "3h6Gn", "text": "$\\frac{5}{2}$", "image": null, "isCorrect": true}, {"id": "4NKk1", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & V=\\frac{4}{3} \\pi r^3 \\\\ & \\Rightarrow \\frac{\\mathrm{d} v}{\\mathrm{~d} t}=4 \\pi r^2 \\frac{\\mathrm{d} r}{\\mathrm{~d} t} \\\\ & S=4 \\pi r^2 \\\\ & \\Rightarrow \\frac{\\mathrm{d} s}{\\mathrm{~d} t}=8 \\pi r \\frac{\\mathrm{d} r}{\\mathrm{~d} t} \\\\ & \\text { Now } \\frac{\\mathrm{d} v}{\\mathrm{~d} s}=\\frac{\\frac{\\mathrm{d} v}{\\mathrm{~d} t}}{\\frac{\\mathrm{ds}}{\\mathrm{d} t}}=\\frac{r}{2}=\\frac{5}{2}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2618f0279619d9d8a2d8a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "The radius of a cylinder is increasing at the rate $2 \\mathrm{~cm} / \\mathrm{sec}$ and its height is decreasing at the rate of $3 \\mathrm{~cm} / \\mathrm{sec}$, then the rate of change of volume, when radius is $3 \\mathrm{~cm}$ and the height is $5 \\mathrm{~cm}$, is", "image": null}, "options": [{"id": "8HBeb", "text": "$44 \\pi \\mathrm{cm}^3 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "xdGYR", "text": "$11 \\pi \\mathrm{cm}^3 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "TquGp", "text": "$23 \\pi \\mathrm{cm}^3 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "03gY0", "text": "$33 \\pi \\mathrm{cm}^3 / \\mathrm{sec}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$V=\\pi r^2 h$\n$\\begin{aligned} & \\Rightarrow \\frac{\\mathrm{d} v}{\\mathrm{~d} t}=\\pi\\left(2 r \\frac{\\mathrm{d} r}{\\mathrm{~d} t} h+r^2 \\frac{\\mathrm{d} h}{\\mathrm{~d} t}\\right) \\\\ & \\Rightarrow \\frac{\\mathrm{d} v}{\\mathrm{~d} t}=\\pi\\left(2 \\times 3 \\times 2 \\times 5+3^2 \\times(-3)\\right) \\\\ & \\Rightarrow \\frac{\\mathrm{d} v}{\\mathrm{~d} t}=33 \\pi \\mathrm{cm}^3 / \\mathrm{sec}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261800279619d9d8a2d16", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "A spherical iron ball $10 \\mathrm{~cm}$ in radius is coated with a layer of ice of uniform thickness that melts at a rate of $50 \\mathrm{~cm}^3 / \\mathrm{min}$. When the thickness of ice is $5 \\mathrm{~cm}$, then the rate at which the thickness of ice decreases, is", "image": null}, "options": [{"id": "baNHf", "text": "$\\frac{1}{36 \\pi} \\mathrm{cm} / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "hyOQD", "text": "$\\frac{5}{6 \\pi} \\mathrm{cm} / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "wR1fQ", "text": "$\\frac{1}{54 \\pi} \\mathrm{cm} / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "CHXZm", "text": "$\\frac{1}{18 \\pi} \\mathrm{cm} / \\mathrm{min}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & V=\\frac{4}{3} \\pi r^3 \\\\ & \\Rightarrow \\frac{\\mathrm{d} v}{\\mathrm{~d} t}=4 \\pi r^2 \\frac{\\mathrm{d} r}{\\mathrm{~d} t} \\\\ & \\Rightarrow 50=4 \\pi \\times 15^2 \\times \\frac{\\mathrm{d} r}{\\mathrm{~d} t} \\\\ & \\Rightarrow \\frac{\\mathrm{d} r}{\\mathrm{~d} t}=\\frac{50}{4 \\pi \\times 15^2}=\\frac{1}{18 \\pi} \\mathrm{cm} / \\mathrm{min}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2617c0279619d9d8a2cf8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "The sides of an equilateral triangle are increasing at the rate of $2 \\mathrm{~cm} / \\mathrm{sec}$. The rate at which the area increases, when side is $10 \\mathrm{~cm}$, is", "image": null}, "options": [{"id": "Mjw0j", "text": "$\\frac{\\sqrt{3}}{10} \\mathrm{~cm}^2 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "1tjP5", "text": "$\\frac{10}{\\sqrt{3}} \\mathrm{~cm}^2 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "7MRsP", "text": "$\\sqrt{3} \\mathrm{~cm}^2 / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "JTMr1", "text": "$10 \\sqrt{3} \\mathrm{~cm}^2 / \\mathrm{sec}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & A=\\frac{\\sqrt{3}}{4} S^2 \\\\ & \\Rightarrow \\frac{\\mathrm{d} A}{\\mathrm{~d} t}=\\frac{\\sqrt{3}}{4} \\cdot 2 S \\frac{\\mathrm{d} s}{\\mathrm{~d} t}=\\frac{\\sqrt{3}}{4} \\times 2 \\times 10 \\times 2 \\mathrm{~cm}^2 / \\mathrm{sec} \\\\ & \\Rightarrow \\frac{\\mathrm{d} A}{\\mathrm{~d} t}=10 \\sqrt{3} \\mathrm{~cm}^2 / \\mathrm{sec}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261560279619d9d8a2bbf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "If the water is being poured at the rate $36 \\mathrm{~m}^3 / \\mathrm{sec}$ in cylindrical vessel of base radius $3 \\mathrm{~m}$, then the rate at which water level is rising, is", "image": null}, "options": [{"id": "e3RiY", "text": "$\\frac{4}{\\pi} \\mathrm{m} / \\mathrm{sec}$", "image": null, "isCorrect": true}, {"id": "A4to7", "text": "$4 \\pi \\mathrm{m} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "VIOne", "text": "$\\frac{\\pi}{4} \\mathrm{~m} / \\mathrm{sec}$", "image": null, "isCorrect": false}, {"id": "x7fc7", "text": "$\\frac{3}{\\pi} \\mathrm{m} / \\mathrm{sec}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{\\mathrm{d} v}{\\mathrm{~d} t}=36 \\mathrm{~m}^3 / \\mathrm{sec}$\nand $v=\\pi r^2 \\mathrm{~h}=\\pi \\times 3^2 \\mathrm{~h}=9 \\pi \\mathrm{h}$\n$\\Rightarrow \\frac{\\mathrm{d} v}{\\mathrm{~d} t}=9 \\pi \\frac{\\mathrm{d} h}{\\mathrm{~d} t}$\n$\\Rightarrow 36=9 \\pi \\frac{\\mathrm{d} h}{\\mathrm{~d} t}$\n$\\Rightarrow \\frac{\\mathrm{d} h}{\\mathrm{~d} t}=\\frac{4}{\\pi} \\mathrm{m} / \\mathrm{sec}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261460279619d9d8a2b36", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "The rate of disintegration of a radio active element at time $t$ is proportional to its mass at that time. Then the time during which the original mass of $6 \\mathrm{gm}$ will disintegrate into its mass of $3 \\mathrm{gm}$ is proportional to", "image": null}, "options": [{"id": "hvsxw", "text": "$\\log 4$", "image": null, "isCorrect": false}, {"id": "vTjgf", "text": "$\\log 3$", "image": null, "isCorrect": false}, {"id": "duWd0", "text": "$\\log 5$", "image": null, "isCorrect": false}, {"id": "3G9BA", "text": "$\\log 2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\frac{d(m)}{d t} \\propto m \\\\ & \\Rightarrow \\frac{d m}{d t}=-k m \\\\ & \\int \\frac{d m}{m}=-\\int k d t \\\\ & \\Rightarrow \\log _e m=-k t+c \\\\ & \\Rightarrow m=e^{-k t+c}=e^c \\cdot e^{-k t} \\\\ & \\text { at } t=0, m=6 \\Rightarrow e^c=6 \\\\ & \\text { i.e., } m=6 \\cdot e^{-k t}\\end{aligned}$\nat $t=t, m=3$\nHence $3=6 \\cdot e^{-k t}$\n$\\begin{aligned} & \\Rightarrow \\frac{1}{2}=e^{-k t} \\\\ & \\Rightarrow \\log \\left(\\frac{1}{2}\\right)=-k t \\\\ & \\Rightarrow-\\log 2=-k t \\\\ & \\left.\\Rightarrow t=\\frac{\\log 2}{k} \\text { [Propotional to } \\log 2\\right]\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261370279619d9d8a2ac2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "If surrounding air is kept at $20^{\\circ} \\mathrm{C}$ and body cools from $80^{\\circ} \\mathrm{C}$ to $70^{\\circ} \\mathrm{C}$ in 5 minutes, then the temperature of the body after 15 minute will be", "image": null}, "options": [{"id": "ONx4E", "text": "$52.7^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "sqhgY", "text": "$51.7^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}, {"id": "saQ3r", "text": "$54.7^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": true}, {"id": "58WRk", "text": "$50.7^{\\circ} \\mathrm{C}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\frac{d T}{d t}=-k(T-20) \\Rightarrow T-20=e^{-k t+c} \\Rightarrow T=20+e^c e^{-k t}$\nfor $t=0, T=80 \\Rightarrow e^c=60$\ni.e. $T=20+60 \\cdot e^{-k t}$\nFor $t=5, T=70 \\Rightarrow 70=20+60 e \\Rightarrow-5 k=\\log \\frac{5}{6}$\ni.e. $T=20+60 e^{\\frac{1}{5} \\log \\frac{5}{6} \\times t}$\nNow, for $t=15$\n$T=20+60 e^{15 \\times \\frac{1}{5} \\log \\frac{5}{6}}=20+60 \\times\\left(\\frac{5}{6}\\right)^3=54.7$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261330279619d9d8a2a9f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "20 meters of wire is available to fence of a flowerbed in the form of a circular sector. If the flowerbed is to have maximum surface area, then the radius of the circle is", "image": null}, "options": [{"id": "NwgfV", "text": "$8 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "JEwQI", "text": "$4 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "1PBBr", "text": "$2 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "J3BOI", "text": "$5 \\mathrm{~m}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\theta^c=\\frac{\\ell}{r}=\\frac{20-2 r}{r}=\\frac{20-2 r}{r} \\times \\frac{180^{\\circ}}{\\pi}$\nNow area of sector $=\\frac{\\pi r^2 \\theta}{360^{\\circ}}$\n$A(r)=\\frac{\\pi r^2 \\times \\frac{20-2 r}{r} \\times \\frac{180^{\\circ}}{\\pi}}{360^{\\circ}}=10 r-r^2$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/bGe8KyjIwmYvTIG2RGK0E6lwiDWc0muD8c7JYZgaYTs.original.fullsize.png\">\nFor maximum area $A^{\\prime}(r)=0$\n$\\begin{aligned} & \\Rightarrow 10-2 r=0 \\\\ & \\Rightarrow r=5 \\mathrm{~m}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261200279619d9d8a2a05", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "A spherical iron ball of $10 \\mathrm{~cm}$ radius is coated with a layer of ice of uniform thickness that melts at the rate of $50 \\mathrm{~cm}^3 / \\mathrm{min}$. If the thickness of ice is $5 \\mathrm{~cm}$, then the rate at which the thickness of ice decrease is", "image": null}, "options": [{"id": "7vD4W", "text": "$\\frac{1}{18 \\pi} \\mathrm{cm} / \\mathrm{min}$", "image": null, "isCorrect": true}, {"id": "YGlJ0", "text": "$\\frac{2}{9 \\pi} \\mathrm{cm} / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "wYP21", "text": "$\\frac{-1}{18 \\pi} \\mathrm{cm} / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "QTbx3", "text": "$\\frac{1}{3 \\pi} \\mathrm{cm} / \\mathrm{min}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & v=\\frac{4}{3} \\pi r^3 \\\\ & \\frac{d v}{d t}=50 \\quad r=(10+5)=15 \\mathrm{~cm} \\\\ & \\Rightarrow \\frac{d v}{d t}=4 \\pi r^2 \\frac{d r}{d t} \\\\ & \\Rightarrow 50=4 \\pi \\times 15 \\times 15 \\times \\frac{d r}{d t} \\\\ & \\Rightarrow \\frac{d r}{d t}=\\frac{50}{4 \\pi \\times 15 \\times 15}=\\frac{1}{18 \\pi} \\mathrm{cm} / \\mathrm{min}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261200279619d9d8a2a04", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "A firm is manufacturing 2000 items. It is estimated that the rate of change of production $P$ with respect to additional number of workers $x$ is given by $\\frac{d p}{d x}=100-12 \\sqrt{x}$. If the firm employs 25 more workers, then the new level of production of items is", "image": null}, "options": [{"id": "undED", "text": "$2500$", "image": null, "isCorrect": false}, {"id": "KVOUn", "text": "$3000$", "image": null, "isCorrect": false}, {"id": "LgWlx", "text": "$3500$", "image": null, "isCorrect": true}, {"id": "5OX72", "text": "$4500$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\frac{d p}{d x}=100-12 \\sqrt{x} \\Rightarrow \\int d p=\\int(100-12 \\sqrt{x}) d x \\\\ & \\Rightarrow p=100 x-12 \\times \\frac{2}{3} x^{3 / 2}+C \\\\ & \\Rightarrow p=100 x-8 x^{3 / 2}+200[\\because \\text { at } x=0, p=2000] \\\\ & \\Rightarrow p=100 \\times 25-8 \\times(25)^{3 / 2}+2000[\\text { putting } x=25] \\\\ & \\Rightarrow p=2500-1000+2000=3500\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260fd0279619d9d8a28ec", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "The rate at which the population of a city increases varies as the population present. Within the period of 30 years, the population grew from 20 lakhs to 40 lakhs. Then, the population after a further period of 15 years will be\n$($ Take $\\sqrt{2}=1.41)$", "image": null}, "options": [{"id": "GMddz", "text": "56 lakhs", "image": null, "isCorrect": false}, {"id": "fha3J", "text": "60 lakhs", "image": null, "isCorrect": false}, {"id": "gedyb", "text": "57.4 lakhs", "image": null, "isCorrect": false}, {"id": "7oico", "text": "56.4 lakhs", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\frac{d p}{d t} \\propto p \\Rightarrow \\frac{d p}{d t}=k p \\Rightarrow \\int \\frac{d p}{p}=\\int k d t \\\\ & \\Rightarrow \\log _e P=k t+C\\end{aligned}$\nPutting $\\mathrm{t}=0$ year and $\\mathrm{p}=20$ lakhs\nWe get $\\mathrm{c}=\\log _{\\mathrm{e}} 20$\n$\\Rightarrow \\log _e P=K t+\\log _e 20$\nAgain putting $\\mathrm{t}=30$ years and $\\mathrm{P}=40$ lakhs\n$\\begin{aligned} & \\Rightarrow \\log _e 40=K \\times 30+\\log _e 20 \\\\ & \\Rightarrow K=\\frac{\\log _e 2}{30} \\\\ & \\Rightarrow \\log _e P=\\frac{\\log _e 2}{30} t \\log _e 20\\end{aligned}$\nPutting $\\mathrm{t}=45$ years\nWe get $\\log _e p=\\frac{\\log _e 2}{30} \\times 45+\\log _e 20$\n$\\begin{aligned} & \\Rightarrow \\log _e P=\\frac{3}{2} \\log _e 2+\\log _e 20 \\\\ & \\Rightarrow \\log _e P=\\log _e 2 \\frac{3}{2} \\times 20 \\\\ & \\Rightarrow P=2 \\sqrt{2} \\times 20 \\text { lakhs }\\end{aligned}$\n$\\Rightarrow \\mathrm{P}=2 \\times 1.41 \\times 20$ lakhs\n$\\Rightarrow \\mathrm{P}=56.4$ lakhs", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260fc0279619d9d8a28df", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "A circular sector of perimeter 60 meter with maximum area is to be constructed. The radius of the circular are in meter must be", "image": null}, "options": [{"id": "o4Cm9", "text": "$5 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "GaBDq", "text": "$15 \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "DO3Iv", "text": "$10 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "bLhel", "text": "$20 \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Perimeter $=2 r+r \\theta=60$\n$\\Rightarrow \\theta=\\frac{60-2 r}{r}$\nArea $=\\mathrm{A}(\\mathrm{r})=\\frac{\\pi \\mathrm{r}^2 \\theta}{360}=\\frac{\\pi \\mathrm{r}^2\\left(\\frac{60-2 \\mathrm{r}}{\\mathrm{r}}\\right)}{360}=\\frac{\\pi}{360}\\left(60 r-2 \\mathrm{r}^2\\right)$\n$A^{\\prime}(r)=\\frac{\\pi}{360}(60-4 r)$\nFor area to be maximum $A^{\\prime}(r)=0 \\Rightarrow r=15$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260fa0279619d9d8a28d3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "The side of a square sheet of metal is increasing at the rate of $3 \\mathrm{~cm} / \\mathrm{min}$. At what rate is the area increasing when the length of the side is $6 \\mathrm{~cm}$ long?", "image": null}, "options": [{"id": "OeYn5", "text": "$36 \\mathrm{~cm}^2 / \\mathrm{min}$", "image": null, "isCorrect": true}, {"id": "Ir96f", "text": "$12 \\mathrm{~cm}^2 / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "66u2W", "text": "$18 \\mathrm{~cm}^2 / \\mathrm{min}$", "image": null, "isCorrect": false}, {"id": "pen9B", "text":
