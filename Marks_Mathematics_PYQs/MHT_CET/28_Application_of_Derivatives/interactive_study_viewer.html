null}, "options": [{"id": "qrmdp", "text": "3", "image": null, "isCorrect": true}, {"id": "2v3Hw", "text": "1", "image": null, "isCorrect": false}, {"id": "2mzAQ", "text": "2", "image": null, "isCorrect": false}, {"id": "NN7VN", "text": "-1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given curve is\n$\\begin{aligned}\n& x y+\\mathrm{a} x+\\mathrm{b} y=0 \\\\\n\\therefore \\quad & \\text { Slope }=2=\\frac{\\mathrm{d} y}{\\mathrm{~d} x} \\\\\n\\therefore \\quad & x y+\\mathrm{a} x+\\mathrm{b} y=0\n\\end{aligned}$\nDifferentiating w.r.t. $x$, we get\n$\\begin{aligned}\n& x \\frac{\\mathrm{d} y}{\\mathrm{~d} x}+y+\\mathrm{a}+\\mathrm{b} \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=0 \\\\\n& \\therefore \\quad(x+\\mathrm{b}) \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=-(y+\\mathrm{a}) \\\\\n& \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=\\frac{-(y+\\mathrm{a})}{x+\\mathrm{b}} \\\\\n& \\therefore \\quad\\left(\\frac{\\mathrm{d} y}{\\mathrm{~d} x}\\right)_{(1,1)}=2 \\\\\n& \\therefore \\quad 2=\\frac{-(1+\\mathrm{a})}{1+\\mathrm{b}} \\\\\n& \\therefore \\quad \\mathrm{a}+2 \\mathrm{~b}=-3 ... (i)\n\\end{aligned}$\nSince $(1,1)$ lies on $x y+a x+b y=0$, we get $\\mathbf{a}+\\mathbf{b}=-1$ ... (ii)\nSolving (i), (ii), we get\n$\\begin{aligned}\n& a=1, b=-2 \\\\\n\\therefore \\quad & a-b=1-(-2)=3\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a30279619d9d8a2e22", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "If the curves $y^2=6 x, 9 x^2+b y^2=16$ intersect each other at right angles, the value of $b$ is", "image": null}, "options": [{"id": "6qqyR", "text": "4", "image": null, "isCorrect": false}, {"id": "xYjbp", "text": "$\\frac{7}{2}$", "image": null, "isCorrect": false}, {"id": "dwHMR", "text": "6", "image": null, "isCorrect": false}, {"id": "y3IC6", "text": "$\\frac{9}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\left(\\frac{\\mathrm{d} y}{\\mathrm{~d} x}\\right)_{C_1}=\\frac{3}{y} \\text { and }\\left(\\frac{\\mathrm{d} y}{\\mathrm{~d} x}\\right)_{C_2}=\\frac{-9 x}{b y}$\nfor orthogonal intersection $\\left(\\frac{\\mathrm{d} y}{\\mathrm{~d} x}\\right)_{C_1} \\times\\left(\\frac{\\mathrm{d} y}{\\mathrm{~d} x}\\right)_{C_2}=-1$\n$\\begin{aligned}\n& \\Rightarrow \\frac{3}{y} \\times \\frac{-9 x}{b y}=-1 \\\\\n& \\Rightarrow 27 x=b y^2 \\\\\n& \\Rightarrow 27 x=b \\times 6 x\\left[\\because y^2=6 x\\right] \\\\\n& \\Rightarrow b=\\frac{9}{2}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261900279619d9d8a2d95", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "The curve $\\left(\\frac{x}{a}\\right)^n+\\left(\\frac{y}{b}\\right)^n=2, n \\in N$ touches the line at the point $(a, b)$, then the equation of the line is", "image": null}, "options": [{"id": "x3cHd", "text": "$\\frac{x}{a}-\\frac{y}{b}=2$", "image": null, "isCorrect": false}, {"id": "VxIRl", "text": "$\\frac{x}{a}+\\frac{y}{2 b}=1$", "image": null, "isCorrect": false}, {"id": "KN2W2", "text": "$\\frac{x}{a}+\\frac{y}{b}=1$", "image": null, "isCorrect": false}, {"id": "KlPJV", "text": "$\\frac{x}{a}+\\frac{y}{b}=2$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Slope of the line $=\\frac{\\mathrm{d} y}{\\mathrm{~d} x}$ at $(a, b)$\n$\\begin{aligned} & =\\frac{-n\\left(\\frac{x}{a}\\right)^{n-1} \\cdot \\frac{1}{a}}{n \\cdot\\left(\\frac{y}{b}\\right)^{n-1} \\cdot \\frac{1}{b}} \\text { at }(a, b) \\\\ & =\\frac{-b}{a}\\end{aligned}$\nnow equation of the straight line\n$\\begin{aligned} & y-b=-\\frac{b}{a}(x-a) \\\\ & \\Rightarrow a y-a b=-b x+a b \\\\ & \\Rightarrow b x+a y=2 a b \\\\ & \\Rightarrow \\frac{x}{a}+\\frac{y}{b}=2\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2616d0279619d9d8a2c7c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "The tangent to the curve $y=x^3+a x-b$ at the point $(1,-5)$ is perpendicular to the line $y-x+4=0$, then which one of the following points lies on the curve?", "image": null}, "options": [{"id": "mNXEZ", "text": "(2,-2)", "image": null, "isCorrect": true}, {"id": "rW0Zw", "text": "(-2,2)", "image": null, "isCorrect": false}, {"id": "7OeTB", "text": "(-2,1)", "image": null, "isCorrect": false}, {"id": "cRbYs", "text": "(2,-1)", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$y=x^3+a x-b$\n$\\text { slope of tangent }=\\frac{\\mathrm{d} y}{\\mathrm{~d} x}=3 x^2+a$\nslope of the line $y-x+4=0$ is 1\n$\\begin{aligned}\n& \\Rightarrow \\frac{\\mathrm{d} y}{\\mathrm{~d} x}_{a t(1-5)}=-1 \\\\\n& \\Rightarrow 3 \\times 1^2+a=-1 \\\\\n& \\Rightarrow a=-4\n\\end{aligned}$\nalso $(1,-5)$ lies on the curve $y=x^3+a x-b$\n$\\begin{aligned}\n& \\Rightarrow-5=1^3+a \\times 1-b=1+(-4) \\times 1-b \\\\\n& \\Rightarrow b=2\n\\end{aligned}$\nHence, the curve is $y=x^3-4 x-2$ which is satisfied by $(2,-2)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2615c0279619d9d8a2bef", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "If $x=t^2$ and $y=2 t$ are parametric equations of a curve, then equation of the normal to the curve at $t=2$ is", "image": null}, "options": [{"id": "Y5IVK", "text": "$2 x+y-12=0$", "image": null, "isCorrect": true}, {"id": "rCIyj", "text": "$x+y-8=0$", "image": null, "isCorrect": false}, {"id": "0CBNh", "text": "$x+2 y-12=0$", "image": null, "isCorrect": false}, {"id": "WSrby", "text": "$2 x+3 y-20=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of normal at $t$\n$\\begin{aligned}\n& (y-2 t)=\\frac{-\\mathrm{d} x}{\\mathrm{~d} t}\\left(x-t^2\\right) \\\\\n& \\Rightarrow(y-2 t)=\\frac{-2 t}{2}\\left(x-t^2\\right) \\\\\n& \\Rightarrow(y-4)=-2(x-4)[\\text { for } t=2] \\\\\n& \\Rightarrow 2 x+y-12=0\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261350279619d9d8a2ab1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "If $y=4 x-5$ is tangent to the curve $y^2=p x^3+q$ at $(2,3)$, then", "image": null}, "options": [{"id": "psbVG", "text": "$p=2, q=-7$", "image": null, "isCorrect": true}, {"id": "cEDST", "text": "$p=2, q=7$", "image": null, "isCorrect": false}, {"id": "1H6n8", "text": "$p=-2, q=7$", "image": null, "isCorrect": false}, {"id": "xVtSw", "text": "$p=-2, q=-7$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & (2,3) \\text { lies on } y^2=p x^3+q \\\\ & \\Rightarrow 3^2=P \\times 2^3+q\\end{aligned}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/pc1vax462MnrzHnsjFsrinWAePsBpOUDONg7djVQrVA.original.fullsize.png\">\nfrom (i) and (ii) $q=-7$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261240279619d9d8a2a22", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}], "question": {"text": "If the normal to the curve $y=f(x)$ at the point $(3,4)$ makes and angle $\\left(\\frac{3 \\pi}{4}\\right)^{\\mathrm{C}}$ with positive $\\mathrm{X}$-axis, then $f^{\\prime}(3)$ is equal to", "image": null}, "options": [{"id": "CfSLG", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "4Z73d", "text": "$1$", "image": null, "isCorrect": true}, {"id": "NqUDb", "text": "$\\frac{4}{3}$", "image": null, "isCorrect": false}, {"id": "55f1J", "text": "$-\\frac{3}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\text { Slope of normal }=\\frac{-1}{f^{\\prime}(x)} \\\\ & \\Rightarrow \\tan \\left(\\frac{3 \\pi}{4}\\right)=\\frac{-1}{f^{\\prime}(3)} \\\\ & \\Rightarrow-1=\\frac{-1}{f^{\\prime}(3)} \\\\ & \\Rightarrow f^{\\prime}(3)=1\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T14:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 2)", "title": "MHT CET 2022 (06 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261120279619d9d8a2994", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "If the tangent to the curve $y=\\frac{x}{x^2-3}, x \\in R,(x \\neq \\pm \\sqrt{3})$ at a point $(\\alpha, \\beta) \\neq(0,0)$ on it, is parallel to the line $2 x+6 y-11=0$, then", "image": null}, "options": [{"id": "IPXTv", "text": "$|2 \\alpha+6 \\beta|=11$", "image": null, "isCorrect": false}, {"id": "pu12y", "text": "$|6 \\alpha+2 \\beta|=9$", "image": null, "isCorrect": false}, {"id": "bFS5F", "text": "$|6 \\alpha+2 \\beta|=19$", "image": null, "isCorrect": true}, {"id": "1Ty8Q", "text": "$|2 \\alpha+6 \\beta|=19$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$y=\\frac{x}{x^2-3} \\Rightarrow \\frac{d y}{d x}=\\frac{-\\left(3+x^2\\right)}{\\left(x^2-3\\right)^2}$\nNow slope of $2 x+6 y-11=0$ is $\\frac{-1}{3}$\n$\\begin{aligned} & \\frac{\\mathrm{A}}{\\mathrm{Q}}-\\frac{1}{3}=\\frac{-\\left(3+x^2\\right)}{\\left(x^2-3\\right)^2} \\\\ & \\Rightarrow x^4-9 x^2=0 \\\\ & \\Rightarrow x^2\\left(x^2-9\\right)=0 \\\\ & \\Rightarrow x=0 \\text { or } x= \\pm 3\\end{aligned}$\nBut $x \\neq 0$ so $x= \\pm 3 \\Rightarrow y= \\pm \\frac{1}{2}$\nHence, $\\alpha= \\pm 3, \\beta= \\pm \\frac{1}{2}$\n$\\Rightarrow|6 \\alpha+2 \\beta|=\\left| \\pm\\left(6 \\times 3+2 \\times \\frac{1}{2}\\right)\\right|=19$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260d40279619d9d8a27a6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "The curve $y=a x^3+b x^2+c x+5$ touches X-axis at $P(-2,0)$ and cuts $\\mathrm{Y}$-axis at a point $\\mathrm{Q}$, where its gradient is 3 , then", "image": null}, "options": [{"id": "5qsT6", "text": "$\\mathrm{a}=\\frac{1}{2}, \\mathrm{~b}=\\frac{3}{4}, \\mathrm{c}=3$", "image": null, "isCorrect": false}, {"id": "wgWDx", "text": "$\\mathrm{a}=\\frac{1}{2}, \\mathrm{~b}=\\frac{-1}{4}, \\mathrm{c}=-3$", "image": null, "isCorrect": false}, {"id": "98oE0", "text": "$a=\\frac{1}{2}, b=\\frac{-3}{4}, c=-3$", "image": null, "isCorrect": false}, {"id": "Vae8A", "text": "$\\mathrm{a}=\\frac{-1}{2}, \\mathrm{~b}=\\frac{-3}{4}, \\mathrm{c}=3$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The curve $y=a x^3+b x^2+c x+5$ touches $X$-axis at $P(-2,0)$ $\\therefore 0=\\mathrm{a}(-2)^3+\\mathrm{b}(-2)^2+\\mathrm{c}(-2)+5$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/_WEcCxX5mkowv75XDnPE_fLVAov5jhz22Do2jUy59lc.original.fullsize.png\"><br>\n$\\frac{d y}{d x}=3 a x^2+2 b x+c$ and at point $Q$ on $Y$ axis, we have $\\frac{d y}{d x}=3$.\nLet $Q \\equiv(0, k)$<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/1j1D_s8xHbOR-8sBsLnprIJgFNKuHv5SO--nex8uBOU.original.fullsize.png\"><br>\nThe equation (1) becomes $8 a-4 b+6=5$ i.e. $8 a-4 b=-1$\n$\\Rightarrow 2 \\mathrm{a}-\\mathrm{b}=\\frac{-1}{4}$\nAt $\\mathrm{P}(-2,0)$\n$\\frac{\\mathrm{dy}}{\\mathrm{dx}}=0$<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/2Na5V2_BFZrjJQa0m9L5jGErOEBezZi6qDjW644ZPqA.original.fullsize.png\"><br>\nFrom (1), (2) \\& (3)\n$\\mathrm{a}=\\frac{-1}{2}, \\mathrm{~b}=\\frac{-3}{4}, \\mathrm{c}=3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c30279619d9d8a271b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "The equation of tangent to the curve $y=y=\\sqrt{2} \\sin \\left(2 x+\\frac{\\pi}{4}\\right)$ at $x=\\frac{\\pi}{4}$, is", "image": null}, "options": [{"id": "bwodE", "text": "$2 x+y-\\frac{\\pi}{2}-1=0$", "image": null, "isCorrect": true}, {"id": "mmhsQ", "text": "$2 x-y-\\frac{\\pi}{2}+1=0$", "image": null, "isCorrect": false}, {"id": "ndWik", "text": "$x+y-\\frac{\\pi}{2}-1=0$", "image": null, "isCorrect": false}, {"id": "4W1wm", "text": "$x-y-\\frac{\\pi}{2}+1=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{y}=\\sqrt{2} \\sin \\left(2 \\mathrm{x}+\\frac{\\pi}{4}\\right) \\\\\n& \\frac{\\mathrm{dy}}{\\mathrm{dx}}=\\sqrt{2} \\cos \\left(2 \\mathrm{x}+\\frac{\\pi}{4}\\right)(2) \\\\\n& \\therefore\\left(\\frac{\\mathrm{dy}}{\\mathrm{dx}}\\right)_{\\mathrm{x}=\\frac{\\pi}{4}}=(2 \\sqrt{2}) \\cos \\left(\\frac{\\pi}{2}+\\frac{\\pi}{4}\\right)=2 \\sqrt{2}\\left(-\\sin \\frac{\\pi}{4}\\right)=-2\n\\end{aligned}\n$$\nWhen $\\mathrm{x}=\\frac{\\pi}{4}, \\mathrm{y}=\\sqrt{2} \\sin \\left(\\frac{\\pi}{2}+\\frac{\\pi}{4}\\right)=1$\nHence equation of required tangent is\n$$\n(y-1)=-2\\left(x-\\frac{\\pi}{4}\\right) \\Rightarrow 2 x+y-\\frac{\\pi}{2}-1=0\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260780279619d9d8a24c0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "The point on the curve $y^2=2(x-3)$ at which the normal is parallel to the line $y-2 x+1=0$ is", "image": null}, "options": [{"id": "dCuyt", "text": "$\\left(\\frac{-1}{2},-2\\right)$", "image": null, "isCorrect": false}, {"id": "vW8ok", "text": "$\\left(\\frac{3}{2}, 2\\right)$", "image": null, "isCorrect": false}, {"id": "ZSPld", "text": "$(5,2)$", "image": null, "isCorrect": false}, {"id": "7Zh3E", "text": "$(5,-2)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & y^2=2(x-3) \\\\ & \\therefore 2 y \\frac{d y}{d x}=2 \\quad \\Rightarrow \\frac{d y}{d x}=\\frac{1}{y} \\\\ & \\therefore \\text { Slope of normal }=-y \\text { and as per condition given } \\\\ & -y=2 \\quad \\Rightarrow y=-2 \\\\ & \\therefore \\quad(-2)^2=2(x-3) \\Rightarrow x=5 \\Rightarrow \\text { point is }(5,-2)\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2606a0279619d9d8a244f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "The abscissa of the points, where the tangent to the curve $y=x^3-3 x^2-9 x+5$ is parallel to $X$-axis are", "image": null}, "options": [{"id": "CoS2Q", "text": "x=1 and -1", "image": null, "isCorrect": false}, {"id": "olO0C", "text": "x=1 and -3", "image": null, "isCorrect": false}, {"id": "dW9Kr", "text": "x=-1 and 3", "image": null, "isCorrect": true}, {"id": "7NBPs", "text": "x=0 and 1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $y=x^3-3 x^2-9 x+5$\n$\\therefore \\frac{d y}{d x}=3 x^2-6 x-9$ and since tangent is parallel to $X$ axis, we write\n$$\n\\begin{aligned}\n& 3 x^2-6 x-9=0 \\Rightarrow x^2-2 x-3=0 \\text { i.e. }(x-3)(x+1)=0 \\\\\n& \\Rightarrow x=-1,3\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260530279619d9d8a2391", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "The curves $\\frac{x^2}{a^2}+\\frac{y^2}{4}=4$ and $y^3=16 x$ intersect each other orthogonally, then $\\mathrm{a}^2=$", "image": null}, "options": [{"id": "HxacG", "text": "2", "image": null, "isCorrect": false}, {"id": "aqoTg", "text": "$\\frac{3}{4}$", "image": null, "isCorrect": false}, {"id": "mL9Hp", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "Pg4xp", "text": "$\\frac{4}{3}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\frac{x^2}{a^2}+\\frac{y^2}{4}=1 \\\\\n& \\therefore \\frac{1}{a^2} 2 x+\\frac{1}{4} 2 y \\frac{d y}{d x}=0 \\quad \\Rightarrow \\frac{d y}{d x}=\\left(\\frac{-x}{a^2}\\right)\\left(\\frac{4}{y}\\right)\n\\end{aligned}\n$$\nAlso $\\mathrm{y}^3=16 \\mathrm{x}$\n$$\n\\therefore 3 y^2 \\frac{d y}{d x}=16 \\Rightarrow \\frac{d y}{d x}=\\frac{16}{3 y^2}\n$$\nSince curves intersect orthogonally, from (1) and (2), we write\n$$\n\\left(\\frac{-x}{a^2}\\right)\\left(\\frac{4}{y}\\right)\\left(\\frac{16}{3 y^2}\\right)=-1\n$$\n\n\n$\\therefore \\frac{64 x}{3 a^2 y^3}=1$ and we have $y^3=16 x$\n$$\n\\therefore \\frac{64 \\mathrm{x}}{3 \\mathrm{a}^2(16 \\mathrm{x})}=1 \\Rightarrow \\mathrm{a}^2=\\frac{4}{3}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260320279619d9d8a2285", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "The equation of the tangent to curve $y=4 \\mathrm{xe}^{\\mathrm{x}}$ at $\\left(-1, \\frac{-4}{\\mathrm{e}}\\right)$ is", "image": null}, "options": [{"id": "vfkwX", "text": "$6 x-\\frac{e}{4} y=-5$", "image": null, "isCorrect": false}, {"id": "coC6b", "text": "$\\mathrm{x}-\\frac{\\mathrm{e}}{4} \\mathrm{y}=0$", "image": null, "isCorrect": false}, {"id": "WwcBX", "text": "$x=-1$", "image": null, "isCorrect": false}, {"id": "tw36h", "text": "$y=\\frac{-4}{e}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& y=4 \\mathrm{x}^{\\mathrm{x}} \\\\\n& \\therefore\\left(\\frac{\\mathrm{dy}}{\\mathrm{dx}}\\right)_{\\left(-1, \\frac{-4}{\\mathrm{e}}\\right)}=4(-1) \\mathrm{e}^{-1}+4 \\mathrm{e}^{-1}=\\frac{-4}{\\mathrm{e}}+\\frac{4}{\\mathrm{e}}=0\n\\end{aligned}\n$$\nThus tangent is parallel to $\\mathrm{X}$ axis.\nHence required equation of tangent is $y=\\frac{-4}{e}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2600d0279619d9d8a215d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "If the line $y=4 x-5$ touches the curve $y^{2}=a x^{3}+b$ at the point $(2,3)$, then", "image": null}, "options": [{"id": "X8aAq", "text": "$a=-2, b=-7$", "image": null, "isCorrect": false}, {"id": "Occid", "text": "$a=-2, b=7$", "image": null, "isCorrect": false}, {"id": "ee1Oo", "text": "$a=2 \\quad, b=-7$", "image": null, "isCorrect": true}, {"id": "HUt2J", "text": "$a=2, b=7$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Line $y=4 x-5$ has slope 4\nWe have $y^{2}=a x^{3}+b \\Rightarrow 2 y \\frac{d y}{d x}=3 a x^{2}$\n$$\n\\begin{array}{l}\n\\therefore \\frac{\\mathrm{dy}}{\\mathrm{d} \\mathrm{x}}=\\frac{3 \\mathrm{ax}^{2}}{2 \\mathrm{y}} \\\\\n\\Rightarrow\\left(\\frac{\\mathrm{dy}}{\\mathrm{dx}}\\right)_{(2,3)}=\\frac{3 \\mathrm{a}(2)^{2}}{2(3)}=2 \\mathrm{a}\n\\end{array}\n$$\nAs per given condition, $2 \\mathrm{a}=4 \\Rightarrow \\mathrm{a}=2$\nNow $y^{2}=a x^{3}+b$ at point $(2,3)$ becomes\n$$\n9=8(2)+b \\Rightarrow b=-7\n$$\nThis problem can be alternatively solved as follows:\nPut $y=4 x-5$ in $y^{2}=a x^{3}+b$\n$\\therefore(4 x-5)^{2}=a x^{3}+b$\nWhen $x=2$, we get\n$9=8 a+b$$\\ldots(1)$\nNow we will go by options\nPut $\\mathrm{a}=2, \\mathrm{~b}=-7$ in equation $(1)$ we get\n$8(a)-7=16-7=9$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ff80279619d9d8a20b2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "The equation of the normal to the curve $2 x^{2}+y^{2}=12$ at the point $(2,2)$ is", "image": null}, "options": [{"id": "4G4CP", "text": "$2 x-y+6=0$", "image": null, "isCorrect": false}, {"id": "IvoRx", "text": "$2 x+y-6=0$", "image": null, "isCorrect": false}, {"id": "Tszoo", "text": "$x+2 y+2=0$", "image": null, "isCorrect": false}, {"id": "stiln", "text": "$x-2 y+2=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "(A)\nGiven equation of the curve is $2 x^{2}+y^{2}=12$\n$\\therefore \\quad 4 x+2 y \\frac{d y}{d x}=0 \\Rightarrow \\frac{d y}{d x}=\\frac{-2 x}{y}$\nSlope of tangent at $(2,2)$ is $\\frac{-2(2)}{2}-2 \\Rightarrow$ Slope of normal at $(2,2)$ is $\\frac{1}{2}$\nEquation of normal at $(2,2)$ is\n$y-2=\\frac{1}{2}(x-2) \\Rightarrow 2 y-4=x-2 \\Rightarrow x-2 y+2=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd10279619d9d8a1f7a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "The equation of normal to the curve $\\mathrm{y}=\\sin \\left(\\frac{\\pi x}{4}\\right)$ at the point $(2,5)$ is", "image": null}, "options": [{"id": "XKjl6", "text": "x+y=5", "image": null, "isCorrect": false}, {"id": "eBYIF", "text": "y=5", "image": null, "isCorrect": false}, {"id": "qSWRS", "text": "x=2", "image": null, "isCorrect": true}, {"id": "X3z7c", "text": "x+y=2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\nwe have, $y=\\sin \\frac{\\pi x}{4}$\n$\\begin{array}{l}\n\\frac{d y}{d x}=\\frac{\\pi}{4} \\cdot \\cos \\frac{\\pi x}{4} \\\\\n\\left(\\frac{d y}{d x}\\right)_{(2,5)}=\\frac{\\pi}{4} \\cos \\frac{2 \\pi}{4}=0\n\\end{array}$\nSince slope of tangent is zero, it is parallel to $\\mathrm{X}$ axis. So normal is parallel to $\\mathrm{Y}$ axis. Hence required equation of normal is $\\mathrm{x}=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fc20279619d9d8a1f01", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "The equation of tangent at $\\mathrm{P}(-4,-4)$ on the curve $x^{2}=-4 y$ is", "image": null}, "options": [{"id": "WF4SN", "text": "2x+y+4=0", "image": null, "isCorrect": false}, {"id": "D50YW", "text": "2x-y+4=0", "image": null, "isCorrect": true}, {"id": "b4qul", "text": "2x+y-4=0", "image": null, "isCorrect": false}, {"id": "gmCsg", "text": "3x-y+8=0", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\nWe have $x^{2}=-4 y \\Rightarrow 2 x=-4 \\frac{d y}{d x} \\Rightarrow \\frac{d y}{d x}=\\frac{-x}{2}$\nHence slope of tangent at $P(-4,-4)$ is 2 . Hence required eq. of tangent is $y+4=2(x+4) \\quad \\Rightarrow 2 x-y+4=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fac0279619d9d8a1e5d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "If the tangent to the curve given by $x=t^{2}-1$ and $y=t^{2}-t$ is parallel to $X$ - axis, then the value of $\\mathrm{t}$ is", "image": null}, "options": [{"id": "F45LQ", "text": "$\\frac{-1}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "W7ZAY", "text": "0", "image": null, "isCorrect": false}, {"id": "1A8zl", "text": "$\\frac{1}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "sfqxL", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "We have $x=t^{2}-1$ and $y=t^{2}-t$\n$$\n\\begin{array}{l}\n\\therefore \\frac{\\mathrm{dx}}{\\mathrm{dt}}=2 \\mathrm{t} \\text { and } \\frac{\\mathrm{dy}}{\\mathrm{dt}}=2 \\mathrm{t}-1 \\\\\n\\therefore \\frac{\\mathrm{dy}}{\\mathrm{dx}}=\\frac{\\left(\\frac{\\mathrm{dy}}{\\mathrm{dt}}\\right)}{\\left(\\frac{\\mathrm{dx}}{\\mathrm{dt}}\\right)}=\\frac{2 \\mathrm{t}-1}{2 \\mathrm{t}}\n\\end{array}\n$$\nSince tangent is parallel to $\\mathrm{X}$ axis, we write\n$$\n\\frac{2 t-1}{2 t}=0 \\Rightarrow t=\\frac{1}{2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f9a0279619d9d8a1dd3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "The equation of normal to the curve $2 x^{2}+3 y^{2}-5=0$ at $P(1,1)$ is", "image": null}, "options": [{"id": "ExLE2", "text": "$3 x+2 y+1=0$", "image": null, "isCorrect": false}, {"id": "b9ao9", "text": "$3 x-2 y+1=0$", "image": null, "isCorrect": false}, {"id": "n6DH6", "text": "$3 x+2 y-5=0$", "image": null, "isCorrect": false}, {"id": "z21LF", "text": "$3 x-2 y-1=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $2 x^{2}+3 y^{2}-5=0$\n$$\n4 x+6 y \\frac{d y}{d x}=0 \\Rightarrow \\frac{d y}{d x}=\\frac{-2 x}{3 y}\n$$\n$\\operatorname{At}(1,1), \\quad \\frac{\\mathrm{d} y}{\\mathrm{dx}}=\\frac{-2}{3} \\Rightarrow$ Slope of normal $=\\frac{3}{2}$ Equation of normal is\n$$\n\\begin{aligned}\n& y-1=\\frac{3}{2}(x-1) \\Rightarrow 2 y-2=3 x-3 \\\\\n\\therefore \\quad & 3 x-2 y-1=0\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f970279619d9d8a1db7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "If line $x+y=0$ touches the curve $a x^{2}=2 y^{2}-b$ at $(1,-1)$,\nthen the values of $a$ and $b$ are respectively", "image": null}, "options": [{"id": "uTqXA", "text": "$0,2$", "image": null, "isCorrect": false}, {"id": "4YMF6", "text": "$-2,0$", "image": null, "isCorrect": false}, {"id": "xKayb", "text": "$0,-2$", "image": null, "isCorrect": false}, {"id": "HTdOI", "text": "$2,0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{array}{l}\na x^{2}=2 y^{2}-b \\\\\na \\times 2 x=4 y \\frac{d y}{d x}-0 \\Rightarrow a x=2 y \\frac{d y}{d x} \\\\\n\\therefore \\frac{d y}{d x}=\\frac{a x}{2 y}\n\\end{array}\n$$\nAt $(1,-1)$ slope of tangent $=\\frac{d y}{d x}=\\frac{-a}{2}$ and slope of $x+y=0$ is $-1$\nAs per condition given, $\\frac{-a}{2}=-1 \\Rightarrow a=2$\nSubstituting $x=1, y=-1, a=2$ in the given equation of curve, we get\n$$\n2=2-b \\Rightarrow b=0\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f620279619d9d8a1c0d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "If the line $6 x-y-4=0$ touches the curve $y^{2}=a x^{3}+b$ at the point $(1,2)$ then\n$a+b=$", "image": null}, "options": [{"id": "bRCpM", "text": "8", "image": null, "isCorrect": false}, {"id": "ND5Jt", "text": "$-4$", "image": null, "isCorrect": false}, {"id": "ggZZM", "text": "4", "image": null, "isCorrect": true}, {"id": "w9Ikl", "text": "12", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Slope of line $6 x-y-4=0$ is 6 and this line is tangent to the curve $y^{2}=a x^{3}+b$ at point $(1,2)$ \n$\\therefore 2 y \\frac{d y}{d x}=3 a x^{2} \\Rightarrow\\left(\\frac{d y}{d x}\\right)_{(1,2)}=\\frac{3 a x^{2}}{2 y}=\\frac{3 a}{4}$ and $\\frac{3 a}{4}=6 \\Rightarrow a=8$\nNow point $(1,2)$ lies on given curve.\n$\\therefore(2)^{2}=(8)(1)^{3}+b \\Rightarrow b=-4 \\Rightarrow a+b=8-4=4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f510279619d9d8a1b83", "type": "singleCorrect", "level": 1, "questionLabels": [ 0279619d9d8a1632", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The length of normal at any point to the curve, $y=c \\cosh \\left(\\frac{x}{c}\\right)$ is", "image": null}, "options": [{"id": "D6BS5", "text": "fixed", "image": null, "isCorrect": false}, {"id": "5vrWc", "text": "$\\frac{y^{2}}{c^{2}}$", "image": null, "isCorrect": false}, {"id": "tePxl", "text": "$\\frac{y^{2}}{c}$", "image": null, "isCorrect": true}, {"id": "NdcU6", "text": "$\\frac{y}{c^{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $y=c \\cosh \\left(\\frac{x}{c}\\right)$...(i)\n$$\n\\frac{d y}{d x}=c \\cdot \\frac{1}{c} \\cdot \\sinh \\left(\\frac{x}{c}\\right)=\\sinh \\left(\\frac{x}{c}\\right)\n$$\nNow, length of normal\n$$\n=y \\sqrt{1+\\left(\\frac{d y}{d x}\\right)^{2}}\n$$\n$=c \\cosh \\left(\\frac{x}{c}\\right) \\sqrt{1+\\sin ^{2} \\mathrm{~h}\\left(\\frac{x}{c}\\right)}$\n$=c \\cosh \\left(\\frac{x}{c}\\right) \\sqrt{\\cosh ^{2}\\left(\\frac{x}{c}\\right)}$\n$=c\\left[\\cosh \\left(\\frac{x}{c}\\right)\\right]^{2}$\n$=c\\left(\\frac{y}{c}\\right)^{2} \\quad[$ from Eq. (i)]\n$=\\frac{y^{2}}{c}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea70279619d9d8a1631", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "All the points on the curve $y^{2}=4 a|x+a \\sin (x / a)|$, where the tangent is parallel to the axis of $x$ are lies on", "image": null}, "options": [{"id": "o1sNE", "text": "circle", "image": null, "isCorrect": false}, {"id": "JsMET", "text": "parabola", "image": null, "isCorrect": true}, {"id": "1l0Or", "text": "straight line", "image": null, "isCorrect": false}, {"id": "ZeMVl", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$y^{2}=4 a\\left[x+a \\sin \\left(\\frac{x}{a}\\right)\\right]$...(i)\n$\\therefore \\quad 2 y \\frac{d y}{d x}=4 a\\left[1+\\cos \\left(\\frac{x}{a}\\right)\\right]$...(ii)\nIf tangent is parallel to $x$ -axis, then $\\frac{d y}{d x}=0$\nSo, from Eq. (i), we get $\\cos \\left(\\frac{x}{a}\\right)=-1$\n$\\therefore$\n$$\n\\sin \\left(\\frac{x}{a}\\right)=0\n$$\nOn putting this value in Eq. (i), we get $y^{2}=4 a(x+0) \\Rightarrow y^{2}=4 a x$\nSo, all the points on the curve\n$$\ny^{2}=4 a\\left(x+a \\sin \\frac{x}{a}\\right)\n$$\nwhere the tangent is parallel to the $x$ -axis are lies on parabola.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e940279619d9d8a1594", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "If $x+y=k$ is normal to $y^{2}=12 x$, then $k$ is", "image": null}, "options": [{"id": "JyBUg", "text": "3", "image": null, "isCorrect": false}, {"id": "pvpCp", "text": "9", "image": null, "isCorrect": true}, {"id": "YSfpx", "text": "$-9$", "image": null, "isCorrect": false}, {"id": "B0cLJ", "text": "$-3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $x+y=k$ be normal to\n$$\ny^{2}=12 x \\text { at } P(\\alpha, \\beta)\n$$\n$\\therefore \\quad \\beta^{2}=12 \\alpha$\nAlso, slope of normal at $P(\\alpha, \\beta)$ is $-1$\nForm, Eq.(i),\n$$\n\\begin{aligned}\n\\frac{d y}{d x} &=\\frac{6}{y} \\\\\n\\Rightarrow \\quad\\left(\\frac{d y}{d x}\\right)_{P} &=\\frac{6}{\\beta}\n\\end{aligned}\n$$\n$\\therefore$\n$$\n-1=\\frac{-1}{6 / \\beta}\n$$\n$\\Rightarrow$\n$\\beta=6, \\alpha=3$\n$\\therefore P$ is $(3,6)$ which lies on $x+y=k$\n$\\therefore \\quad 3+6=k$\n$\\Rightarrow \\quad k=9$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7f0279619d9d8a14eb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The equation of tangent to the curve $y^{2}=a x^{2}+b$ at point $(2,3)$ is $y=4 x-5$, then the values of $a$ and $\\bar{b}$ are", "image": null}, "options": [{"id": "gSto9", "text": "$3,-5$", "image": null, "isCorrect": false}, {"id": "vTGKP", "text": "$6,-5$", "image": null, "isCorrect": false}, {"id": "s1Wgv", "text": "6,15", "image": null, "isCorrect": false}, {"id": "kWHhA", "text": "$6,-15$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given, $\\quad y^{2}=a x^{2}+b^{2}$\n$\\therefore$\n$2 y \\frac{d y}{d x}=2 a x$\n$\\Rightarrow \\quad \\frac{d y}{d x}=\\frac{a x}{y}$\n$\\therefore$ Slope at $(2,3)=\\left(\\frac{d y}{d x}\\right)_{(2,3)}=\\frac{2 a}{3}$\nBut slope of given tangent is $m=4$ $\\frac{2 a}{3}=4 \\Rightarrow \\bar{a}=6$\nSince, point $(2,3)$ lies on the curve so, it satisfies the equation of the curve\n$\\therefore$\n$(3)^{2}=6(2)^{2}+b$\n$\\Rightarrow \\quad b=-15$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e7e0279619d9d8a14e5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The equation of tangent to the curve given by $x=3 \\cos \\theta, y=3 \\sin \\theta$ at $\\theta=\\frac{\\pi}{4}$ is", "image": null}, "options": [{"id": "OPu0b", "text": "$x+y=\\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "RWNk3", "text": "$3 x+y=3 \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "hl49R", "text": "$x+y=3 \\sqrt{2}$", "image": null, "isCorrect": true}, {"id": "eoV48", "text": "$x+3 y=3 \\sqrt{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $x=3 \\cos \\theta, y=3 \\sin \\theta$. On squaring and\nadding we get $x^{2}+y^{2}=9$, which represent a circle.\nEquation of tangent at $\\theta=\\frac{\\pi}{4}$ is\n$$\n\\begin{aligned}\n& x \\cdot\\left(3 \\cos \\frac{\\pi}{4}\\right)+y \\cdot\\left(3 \\sin \\frac{\\pi}{4}\\right)=9 \\\\\n\\Rightarrow \\quad & x+y=3 \\sqrt{2}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e6d0279619d9d8a1458", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "The equation of the tangent to the curve $y=4 x e^{x}$ at $\\left(-1, \\frac{-4}{e}\\right)$ is", "image": null}, "options": [{"id": "7yk3f", "text": "$y=-1$", "image": null, "isCorrect": false}, {"id": "ke8qN", "text": "$y=-\\frac{4}{e}$", "image": null, "isCorrect": true}, {"id": "wNob5", "text": "$x=-1$", "image": null, "isCorrect": false}, {"id": "0sZ4P", "text": "$x=\\frac{-4}{e}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "iven curve is $y=4 x e^{x}$ $\\frac{d y}{d x}=4 e^{x}+4 x e^{x}$\n At $\\left(-1,-\\frac{4}{e}\\right)\\left(\\frac{d y}{d x}\\right)_{(-1,-4 / e)}=4 e^{-1}+4(-1) e^{-1}=0$\n$\\therefore$ Equation of tangent is $\\begin{aligned} &\\left(y+\\frac{4}{e}\\right) &=0(x+1) \\\\ \\Rightarrow & y &=-\\frac{4}{e} \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e5f0279619d9d8a13e5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The abscissae of the points, where the tangent to curve $y=x^{3}-3 x^{2}-9 x+5$ is parallel to $x$ -axis, are", "image": null}, "options": [{"id": "ZMQLO", "text": "$x=0$ and 0", "image": null, "isCorrect": false}, {"id": "lhEmn", "text": "$x=1$ and $-1$", "image": null, "isCorrect": false}, {"id": "sxYM3", "text": "$x=1$ and $-3$", "image": null, "isCorrect": false}, {"id": "qHV2U", "text": "$x=-1$ and 3", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given, $y=x^{3}-3 x^{2}-9 x+5$\n$\\Rightarrow \\quad \\frac{d y}{d x}=3 x^{2}-6 x-9$\nWe know that, this equation gives the slope of the tangent to the curve. The tangent is parallel to $x$ -axis, $\\frac{d y}{d x}=0$\n$\\Rightarrow \\quad 3 x^{2}-6 x-9=0$\n$\\Rightarrow \\quad x=-1,3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e5f0279619d9d8a13e3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The point of the curve $y^{2}=2(x-3)$ at which the normal is parallel to the line $y-2 x+1=0$ is", "image": null}, "options": [{"id": "E2AcG", "text": "$(5,2)$", "image": null, "isCorrect": false}, {"id": "EGddZ", "text": "$\\left(-\\frac{1}{2},-2\\right)$", "image": null, "isCorrect": false}, {"id": "ODR0r", "text": "$(5,-2)$", "image": null, "isCorrect": true}, {"id": "J2SJE", "text": "$\\left(\\frac{3}{2}, 2\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $y^{2}=2(x-3) \\quad$...(i)\nOn differentiating w.r.t. $x$, we get $2 y \\frac{d y}{d x}=2$\n$\\Rightarrow$\n$\\frac{d y}{d x}=\\frac{1}{y}$\nSlope of the normal $=\\frac{-1}{(d y / d x)}=-y$ Slope of the given line $=2$ $\\therefore \\quad y=-2$\nFrom Eq. (i), $x=5$ \n$\\therefore$ Required point is $(5,-2)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e5d0279619d9d8a13d5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The equation of the tangent parallel to $y-x+5=0$ drawn to $\\frac{x^{2}}{3}-\\frac{y^{2}}{2}=1$ is", "image": null}, "options": [{"id": "lGH0x", "text": "$x-y-1=0$", "image": null, "isCorrect": true}, {"id": "OKY42", "text": "$x-y+2=0$", "image": null, "isCorrect": false}, {"id": "bEMVE", "text": "$x+y-1=0$", "image": null, "isCorrect": false}, {"id": "y72GL", "text": "$x+y+2=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given hyperbola is $\\frac{x^{2}}{3}-\\frac{y^{2}}{2}=1$ ...(i)\nEquation of tangent parallel to $y-x+5=0$ is\n$$\n\\begin{aligned}\n& & y-x+\\lambda &=0 & \\\\\n\\Rightarrow & & y &=x-\\lambda ...(ii)\n\\end{aligned}\n$$\nIf line (ii) is a tangent to hyperbola (i), then\n$$\n\\begin{array}{rc}\n-\\lambda=\\pm \\sqrt{3 x-2} \\\\\n\\left(\\text { from } c=\\pm \\sqrt{a^{2} m^{2}-b^{2}}\\right) \\\\\n\\Rightarrow & -\\lambda=\\pm 1 \\\\\n\\Rightarrow & \\lambda=-1,+1\n\\end{array}\n$$\nPut the values of $\\lambda$ in Eq. (ii), we get $x-y-1=0 \\quad$ and $\\quad x-y+1=0$ are the required tangents.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e5d0279619d9d8a13d4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "Angle of intersection of the curve $r=\\sin \\theta+\\cos \\theta$ and $r=2 \\sin \\theta$ is equal to", "image": null}, "options": [{"id": "BLWUz", "text": "$\\frac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "rLtl2", "text": "$\\frac{\\pi}{3}$", "image": null, "isCorrect": false}, {"id": "2lhuT", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": true}, {"id": "buoY4", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $r=\\sin \\theta+\\cos \\theta$ and $r=2 \\sin \\theta$\n$$\n\\begin{array}{lr}\n\\therefore \\quad 2 \\sin \\theta=\\sin \\theta+\\cos \\theta \\\\\n\\Rightarrow \\quad \\sin \\theta=\\cos \\theta \\\\\n\\Rightarrow \\quad \\tan \\theta=1 \\\\\n\\Rightarrow \\quad \\quad \\theta=\\frac{\\pi}{4}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e460279619d9d8a1321", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The slope of the tangent at $(x, y)$ to a curve passing through $\\left(1, \\frac{\\pi}{4}\\right)$ is given by $\\frac{y}{x}-\\cos ^{2}\\left(\\frac{y}{x}\\right)$, then the equation of the curve is", "image": null}, "options": [{"id": "dCPDu", "text": "$y=\\tan ^{-1}\\left[\\log \\left(\\frac{e}{x}\\right)\\right]$", "image": null, "isCorrect": false}, {"id": "q4pSx", "text": "$y=x \\tan ^{-1}\\left[\\log \\left(\\frac{x}{e}\\right)\\right]$", "image": null, "isCorrect": false}, {"id": "HabAn", "text": "$y=x \\tan ^{-1}\\left[\\log \\left(\\frac{e}{x}\\right)\\right]$", "image": null, "isCorrect": true}, {"id": "LDpAZ", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the given condition,\n$$\n\\frac{d y}{d x}=\\frac{y}{x}-\\cos ^{2}\\left(\\frac{y}{x}\\right)\n$$\nOn putting $y=v x$\n$$\n\\Rightarrow \\quad \\frac{d y}{d x}=v+x \\frac{d v}{d x}, \\text { we get }\n$$\n$$\n\\begin{aligned}\n& v+x \\frac{d v}{d x}=v-\\cos ^{2} v \\\\\n\\Rightarrow & \\frac{d v}{\\cos ^{2} v}=-\\frac{d x}{x} \\\\\n\\Rightarrow & \\sec ^{2} v d v=\\frac{-1}{x} d x\n\\end{aligned}\n$$\nOn integrating both sides, we get\n$$\n\\tan v=-\\log x+\\log c\n$$\n$$\n\\Rightarrow \\tan \\left(\\frac{y}{x}\\right)=-\\log x+\\log c\n$$\nSince, this curve is passing through $(1, \\pi / 4)$.\n$$\n\\begin{array}{l}\n\\therefore \\quad \\tan \\left(\\frac{\\pi}{4}\\right)=-\\log 1+\\log c \\Rightarrow \\log c=1 \\\\\n\\therefore \\quad \\tan \\left(\\frac{y}{x}\\right)=-\\log x+1 \\\\\n\\Rightarrow \\tan \\left(\\frac{y}{x}\\right)=-\\log x+\\log e \\\\\n\\Rightarrow \\quad \\quad y=x \\tan ^{-1}\\left[\\log \\left(\\frac{e}{x}\\right)\\right]\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 2, "topicId": "65a263380279619d9d8a3d26", "title": "Rate Measure Error and Approximation", "totalQuestions": 119, "questions": [{"_id": "6abb884915a9fc0fc8c1423f", "type": "singleCorrect", "question": {"text": "A student learned 100 Math formulae for an examination. The number of formulae the student can remember in '$t$' days after learning is given by $f(t) = 100(1 - 0.1t)^2$. Then, the magnitude of the rate at which the student forgets the formula 3 days after learning is:", "image": null}, "options": [{"id": "Gh5mS", "label": "A", "text": "$-14$", "isCorrect": false, "image": null}, {"id": "Wnezg", "label": "B", "text": "$16$", "isCorrect": false, "image": null}, {"id": "M9WSj", "label": "C", "text": "$14$", "isCorrect": true, "image": null}, {"id": "vKd5g", "label": "D", "text": "$10$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $f(t) = 100(1 - 0.1t)^2$<br><br>Differentiating with respect to $t$:<br><br>$f'(t) = \\dfrac{d}{dt} [100(1 - 0.1t)^2]$<br><br>$f'(t) = 100 \\times 2(1 - 0.1t) \\times (-0.1)$<br><br>$f'(t) = -20(1 - 0.1t)$<br><br>At $t = 3$ days:<br><br>$f'(3) = -20(1 - 0.1 \\times 3)$<br><br>$f'(3) = -20(1 - 0.3) = -20(0.7) = -14$<br><br>The rate of change of remembered formulae is $-14$.<br><br>The magnitude of the rate at which the student forgets the formulae is $|-14| = 14$.<br><br>Answer: $14$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885915a9fc0fc8c142d5", "type": "singleCorrect", "question": {"text": "A right circular cone is melting such that its volume is decreasing at the rate of $12\\pi$ $\\text{cm}^3/\\text{sec}$. The radius of the base is always equal to half of its height. Then the rate of change of the radius when the radius is $2$ cm is:", "image": null}, "options": [{"id": "NrLCE", "label": "A", "text": "radius is increasing at the rate of $1$ cm/sec", "isCorrect": false, "image": null}, {"id": "H6E4T", "label": "B", "text": "radius is decreasing at the rate of $1$ cm/sec", "isCorrect": false, "image": null}, {"id": "1e4HM", "label": "C", "text": "radius is increasing at the rate of $1.5$ cm/sec", "isCorrect": false, "image": null}, {"id": "JHTRP", "label": "D", "text": "radius is decreasing at the rate of $1.5$ cm/sec", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $V$ be the volume, $r$ be the radius, and $h$ be the height of the cone.<br><br>Given $\\dfrac{dV}{dt} = -12\\pi$ cm$^3$/sec and $r = \\dfrac{h}{2} \\Rightarrow h = 2r$.<br><br>The volume of the cone is $V = \\dfrac{1}{3}\\pi r^2 h$.<br><br>Substituting $h = 2r$, we get:<br><br>$V = \\dfrac{1}{3}\\pi r^2 (2r) = \\dfrac{2}{3}\\pi r^3$<br><br>Differentiating with respect to time $t$:<br><br>$\\dfrac{dV}{dt} = \\dfrac{2}{3}\\pi (3r^2) \\dfrac{dr}{dt} = 2\\pi r^2 \\dfrac{dr}{dt}$<br><br>Substitute $\\dfrac{dV}{dt} = -12\\pi$ and $r = 2$:<br><br>$-12\\pi = 2\\pi (2)^2 \\dfrac{dr}{dt}$<br><br>$-12\\pi = 8\\pi \\dfrac{dr}{dt}$<br><br>$\\dfrac{dr}{dt} = -1.5$ cm/sec<br><br>Thus, the radius is decreasing at the rate of $1.5$ cm/sec.<br><br>Answer: radius is decreasing at the rate of $1.5$ cm/sec", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b815a9fc0fc8c1465b", "type": "singleCorrect", "question": {"text": "A man of height $1.2$ m is moving away from the lamp post at the rate $0.6$ m/sec. If the height of the lamp post is $4.8$ m, then the rate at which the shadow of the man is lengthening is:", "image": null}, "options": [{"id": "BdWkw", "label": "A", "text": "$0.02\\ \\text{m/s}$", "isCorrect": false, "image": null}, {"id": "Yjmc9", "label": "B", "text": "$1.8\\ \\text{m/s}$", "isCorrect": false, "image": null}, {"id": "HiC4l", "label": "C", "text": "$0.2\\ \\text{m/s}$", "isCorrect": true, "image": null}, {"id": "5F7w6", "label": "D", "text": "$2.0\\ \\text{m/s}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $x$ be the distance of the man from the lamp post and $y$ be the length of his shadow.<br><br>Using similar triangles formed by the lamp post, the man, and the shadow:<br><br>$\\dfrac{y}{1.2} = \\dfrac{x+y}{4.8}$<br><br>$4.8y = 1.2(x+y)$<br><br>$4y = x+y$<br><br>$3y = x$<br><br>Differentiating with respect to time $t$:<br><br>$3\\dfrac{dy}{dt} = \\dfrac{dx}{dt}$<br><br>Given that the man is moving away from the lamp post at $0.6$ m/s, we have $\\dfrac{dx}{dt} = 0.6$ m/s.<br><br>$3\\dfrac{dy}{dt} = 0.6$<br><br>$\\dfrac{dy}{dt} = 0.2$ m/s<br><br>The rate at which the shadow is lengthening is $0.2$ m/s.<br><br>Answer: $0.2\\ \\text{m/s}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88b815a9fc0fc8c1465a", "type": "singleCorrect", "question": {"text": "The approximate surface area of a sphere of radius $2.01$ cm is", "image": null}, "options": [{"id": "ziTsl", "label": "A", "text": "$16.16\\pi\\ \\text{cm}^2$", "isCorrect": true, "image": null}, {"id": "Tpfvz", "label": "B", "text": "$16.15\\pi\\ \\text{cm}^2$", "isCorrect": false, "image": null}, {"id": "qMvVI", "label": "C", "text": "$16.14\\pi\\ \\text{cm}^2$", "isCorrect": false, "image": null}, {"id": "YLSAK", "label": "D", "text": "$16.17\\pi\\ \\text{cm}^2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The surface area of a sphere of radius $r$ is given by $S = 4\\pi r^2$.<br><br>Let $r = 2$ and $\\Delta r = 0.01$.<br><br>Differentiating $S$ with respect to $r$, we get:<br><br>$\\dfrac{dS}{dr} = 8\\pi r$<br><br>The approximate change in surface area is given by $dS = \\left(\\dfrac{dS}{dr}\\right) \\Delta r$.<br><br>At $r = 2$ and $\\Delta r = 0.01$:<br><br>$dS = 8\\pi (2) (0.01) = 0.16\\pi$<br><br>The approximate surface area is $S(r + \\Delta r) \\approx S(r) + dS$.<br><br>$S(2) = 4\\pi (2)^2 = 16\\pi$<br><br>$S(2.01) \\approx 16\\pi + 0.16\\pi = 16.16\\pi\\ \\text{cm}^2$<br><br>Answer: $16.16\\pi\\ \\text{cm}^2$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996b", "title": "MHT CET 2026 (15 May Shift 1)", "shortName": "2026 (15 May Shift 1)", "isVisible": true, "heldOn": "2026-05-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887815a9fc0fc8c14402", "type": "singleCorrect", "question": {"text": "A stone is dropped into a quiet lake and waves move in circles at the speed of $7$ cm s$^{-1}$. At the instant when the radius of circular wave is $5$ cm, the enclosed area is increasing at the rate -------- cm$^2$ s$^{-1}$", "image": null}, "options": [{"id": "OYlSp", "label": "A", "text": "$50\\pi$", "isCorrect": false, "image": null}, {"id": "mFA6X", "label": "B", "text": "$60\\pi$", "isCorrect": false, "image": null}, {"id": "vMnhL", "label": "C", "text": "$25\\pi$", "isCorrect": false, "image": null}, {"id": "0zd9B", "label": "D", "text": "$70\\pi$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $r$ be the radius of the circular wave and $A$ be the enclosed area.<br><br>Given that the waves move in circles at the speed of $7$ cm s$^{-1}$, we have $\\dfrac{dr}{dt} = 7$ cm s$^{-1}$.<br><br>The area of the circle is given by $A = \\pi r^2$.<br><br>Differentiating with respect to time $t$, we get:<br><br>$\\dfrac{dA}{dt} = 2\\pi r \\dfrac{dr}{dt}$<br><br>Substituting $r = 5$ cm and $\\dfrac{dr}{dt} = 7$ cm s$^{-1}$:<br><br>$\\dfrac{dA}{dt} = 2\\pi (5)(7) = 70\\pi$ cm$^2$ s$^{-1}$<br><br>Answer: $70\\pi$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889815a9fc0fc8c1452f", "type": "singleCorrect", "question": {"text": "A water tank in the house of an inverted cone is being emptied at the rate of $2$ cubic feet per second. The height of the cone is $8$ feet and the radius is $4$ feet, then the rate of change of the water level when the depth is $6$ feet.", "image": null}, "options": [{"id": "M7J1C", "label": "A", "text": "$\\dfrac{2}{9\\pi} ft/sec$", "isCorrect": true, "image": null}, {"id": "I9E6s", "label": "B", "text": "$\\dfrac{4}{9\\pi} ft/sec$", "isCorrect": false, "image": null}, {"id": "ILfrz", "label": "C", "text": "$\\dfrac{8}{9\\pi} ft/sec$", "isCorrect": false, "image": null}, {"id": "MxVe5", "label": "D", "text": "$\\dfrac{10}{9\\pi} ft/sec$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $r$ be the radius and $h$ be the height of the water level at any time $t$.<br><br>From similar triangles, $\\dfrac{r}{h} = \\dfrac{4}{8} \\Rightarrow r = \\dfrac{h}{2}$<br><br>The volume of water in the cone is $V = \\dfrac{1}{3}\\pi r^2 h$<br><br>Substituting $r = \\dfrac{h}{2}$, we get $V = \\dfrac{1}{3}\\pi \\left(\\dfrac{h}{2}\\right)^2 h = \\dfrac{\\pi h^3}{12}$<br><br>Differentiating with respect to $t$, we get $\\dfrac{dV}{dt} = \\dfrac{\\pi}{12} (3h^2) \\dfrac{dh}{dt} = \\dfrac{\\pi h^2}{4} \\dfrac{dh}{dt}$<br><br>Given that the tank is being emptied at the rate of $2$ cubic feet per second, the magnitude of the rate of change of volume is $\\dfrac{dV}{dt} = 2$<br><br>Substituting $h = 6$ and $\\dfrac{dV}{dt} = 2$, we get $2 = \\dfrac{\\pi (6)^2}{4} \\dfrac{dh}{dt}$<br><br>$2 = 9\\pi \\dfrac{dh}{dt}$<br><br>$\\dfrac{dh}{dt} = \\dfrac{2}{9\\pi}$ ft/sec<br><br>Answer: $\\dfrac{2}{9\\pi} ft/sec$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889815a9fc0fc8c1452e", "type": "singleCorrect", "question": {"text": "The approximate value of $\\sin^{-1}(0.51)$ is .......<br>[Given $\\pi = 3.1416$, $\\dfrac{2}{\\sqrt{3}} = 1.1547$]", "image": null}, "options": [{"id": "sgUWl", "label": "A", "text": "$0.535247$", "isCorrect": false, "image": null}, {"id": "6MTnh", "label": "B", "text": "$0.535547$", "isCorrect": false, "image": null}, {"id": "zObV2", "label": "C", "text": "$0.535347$", "isCorrect": false, "image": null}, {"id": "aCkz6", "label": "D", "text": "$0.535147$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let $f(x) = \\sin^{-1}(x)$.<br><br>Using the first-order approximation, $f(x + \\Delta x) \\approx f(x) + f'(x) \\Delta x$.<br><br>Let $x = 0.5$ and $\\Delta x = 0.01$.<br><br>$f(0.5) = \\sin^{-1}(0.5) = \\dfrac{\\pi}{6}$<br><br>$f'(x) = \\dfrac{1}{\\sqrt{1 - x^2}}$<br><br>$f'(0.5) = \\dfrac{1}{\\sqrt{1 - (0.5)^2}} = \\dfrac{1}{\\sqrt{1 - 0.25}} = \\dfrac{2}{\\sqrt{3}}$<br><br>Substituting these values into the approximation formula:<br><br>$f(0.51) \\approx \\dfrac{\\pi}{6} + \\dfrac{2}{\\sqrt{3}} \\times 0.01$<br><br>Given $\\pi = 3.1416$ and $\\dfrac{2}{\\sqrt{3}} = 1.1547$:<br><br>$\\dfrac{\\pi}{6} = \\dfrac{3.1416}{6} = 0.5236$<br><br>$\\dfrac{2}{\\sqrt{3}} \\times 0.01 = 1.1547 \\times 0.01 = 0.011547$<br><br>$f(0.51) \\approx 0.5236 + 0.011547 = 0.535147$<br><br>Answer: $0.535147$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889815a9fc0fc8c1452d", "type": "singleCorrect", "question": {"text": "The radius of a spherical balloon increases at the rate of $4$ cm/sec. The rate at which its surface area increases, when the radius is $5$ metres is", "image": null}, "options": [{"id": "SGxKf", "label": "A", "text": "$160\\pi$ $\\text{cm}^2/\\text{sec}$", "isCorrect": false, "image": null}, {"id": "LAPFb", "label": "B", "text": "$1600\\pi$ $\\text{cm}^2/\\text{sec}$", "isCorrect": false, "image": null}, {"id": "DwbLf", "label": "C", "text": "$16000\\pi$ $\\text{cm}^2/\\text{sec}$", "isCorrect": true, "image": null}, {"id": "FWx1c", "label": "D", "text": "$16000$ $\\text{cm}^2/\\text{sec}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $r$ be the radius and $S$ be the surface area of the spherical balloon.<br><br>Given $\\dfrac{dr}{dt} = 4$ cm/sec and $r = 5$ m $= 500$ cm.<br><br>The surface area of a sphere is given by $S = 4\\pi r^2$.<br><br>Differentiating with respect to time $t$, we get:<br><br>$\\dfrac{dS}{dt} = 8\\pi r \\dfrac{dr}{dt}$<br><br>Substituting the values of $r$ and $\\dfrac{dr}{dt}$:<br><br>$\\dfrac{dS}{dt} = 8\\pi (500) (4) = 16000\\pi$ $\\text{cm}^2/\\text{sec}$<br><br>Answer: $16000\\pi$ $\\text{cm}^2/\\text{sec}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb886815a9fc0fc8c1436b", "type": "singleCorrect", "question": {"text": "The radius of a spherical soap bubble is increasing at a constant rate of $0.5$ cm/sec. At the instant when the radius is $5$ cm, the rate at which its volume is increasing is...", "image": null}, "options": [{"id": "cR872", "label": "A", "text": "$25\\pi$ cm$^3$/sec", "isCorrect": false, "image": null}, {"id": "fixd1", "label": "B", "text": "$50\\pi$ cm$^3$/sec", "isCorrect": true, "image": null}, {"id": "Wjuog", "label": "C", "text": "$100\\pi$ cm$^3$/sec", "isCorrect": false, "image": null}, {"id": "CvskT", "label": "D", "text": "$10\\pi$ cm$^3$/sec", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $r$ be the radius and $V$ be the volume of the spherical soap bubble.<br><br>Given $\\dfrac{dr}{dt} = 0.5$ cm/sec.<br><br>The volume of a sphere is $V = \\dfrac{4}{3}\\pi r^3$.<br><br>Differentiating with respect to time $t$, we get:<br><br>$\\dfrac{dV}{dt} = 4\\pi r^2 \\dfrac{dr}{dt}$<br><br>Substituting $r = 5$ cm and $\\dfrac{dr}{dt} = 0.5$ cm/sec:<br><br>$\\dfrac{dV}{dt} = 4\\pi (5)^2 (0.5) = 4\\pi (25) \\left(\\dfrac{1}{2}\\right) = 50\\pi$ cm$^3$/sec.<br><br>Answer: $50\\pi$ cm$^3$/sec", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99967", "title": "MHT CET 2026 (13 May Shift 1)", "shortName": "2026 (13 May Shift 1)", "isVisible": true, "heldOn": "2026-05-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883915a9fc0fc8c141ab", "type": "singleCorrect", "question": {"text": "A man of height $2$ meters walks at a uniform speed of $6$ km/hr away from a lamp post of height $6$ meters, then the rate at which the length of the shadow is increasing is ...", "image": null}, "options": [{"id": "LKOQ4", "label": "A", "text": "$7$ km/hr", "isCorrect": false, "image": null}, {"id": "Jjn6N", "label": "B", "text": "$10$ km/hr", "isCorrect": false, "image": null}, {"id": "mpbm7", "label": "C", "text": "$3$ km/hr", "isCorrect": true, "image": null}, {"id": "viPy2", "label": "D", "text": "$23$ km/hr", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $x$ be the distance of the man from the lamp post and $y$ be the length of his shadow.<br><br>From the property of similar triangles formed by the lamp post, the man, and the shadow:<br><br>$\\dfrac{6}{x + y} = \\dfrac{2}{y}$<br><br>$6y = 2x + 2y$<br><br>$4y = 2x$<br><br>$y = \\dfrac{x}{2}$<br><br>Differentiating with respect to time $t$:<br><br>$\\dfrac{dy}{dt} = \\dfrac{1}{2} \\dfrac{dx}{dt}$<br><br>Given that the speed of the man is $\\dfrac{dx}{dt} = 6$ km/hr:<br><br>$\\dfrac{dy}{dt} = \\dfrac{1}{2} \\times 6 = 3$ km/hr<br><br>The rate at which the length of the shadow is increasing is $3$ km/hr.<br><br>Answer: $3$ km/hr", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b08c30a4553e1bdbbd", "type": "singleCorrect", "question": {"text": "An aeroplane at an altitude of 1 km is flying horizontally at 600 km / hr, passes directly over an observer. Then the rate at which it is approaching the observer when it is 1250 meters away from him is........", "image": null}, "options": [{"id": "2kpLx", "label": "A", "text": "$360\\ km/hr$", "isCorrect": true, "image": null}, {"id": "sP7Lp", "label": "B", "text": "$430\\ km/hr$", "isCorrect": false, "image": null}, {"id": "9bkTR", "label": "C", "text": "$600\\ km/hr$", "isCorrect": false, "image": null}, {"id": "o6qIE", "label": "D", "text": "$250\\ km/hr$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the horizontal distance of the aeroplane from the observer be $x$ km and the actual distance be $s$ km.<br><br>The altitude of the aeroplane is $h = 1$ km.<br><br>From the right-angled triangle formed by the observer, the aeroplane, and the point on the ground directly below the aeroplane, we have:<br><br>$s^2 = x^2 + 1^2$<br><br>Differentiating with respect to time $t$, we get:<br><br>$2s \\dfrac{ds}{dt} = 2x \\dfrac{dx}{dt}$<br><br>$\\dfrac{ds}{dt} = \\dfrac{x}{s} \\dfrac{dx}{dt}$<br><br>We are given the horizontal velocity $\\dfrac{dx}{dt} = 600$ km/hr.<br><br>When the distance $s = 1250$ m $= 1.25$ km, the horizontal distance $x$ is:<br><br>$x = \\sqrt{s^2 - 1^2} = \\sqrt{1.25^2 - 1} = \\sqrt{1.5625 - 1} = \\sqrt{0.5625} = 0.75$ km<br><br>Substituting the values into the derivative equation:<br><br>$\\dfrac{ds}{dt} = \\dfrac{0.75}{1.25} \\times 600$<br><br>$\\dfrac{ds}{dt} = \\dfrac{3}{5} \\times 600 = 360$ km/hr<br><br>Answer: $360\\ km/hr$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3598c30a4553e1be2c5", "type": "singleCorrect", "question": {"text": "A spherical iron ball $10$ cm in radius is coated with a layer of ice of uniform thickness that melts at a rate of $50\\ \\text{cm}^3/\\text{min}$. When the thickness of ice is $5$ cm, the rate at which the thickness of ice decreases is...", "image": null}, "options": [{"id": "FAzCh", "label": "A", "text": "$\\dfrac{1}{18\\pi}\\ \\text{cm}/\\text{min}$", "isCorrect": true, "image": null}, {"id": "uUrg2", "label": "B", "text": "$\\dfrac{1}{36\\pi}\\ \\text{cm}/\\text{min}$", "isCorrect": false, "image": null}, {"id": "8yuie", "label": "C", "text": "$\\dfrac{5}{6\\pi}\\ \\text{cm}/\\text{min}$", "isCorrect": false, "image": null}, {"id": "lcZP8", "label": "D", "te
