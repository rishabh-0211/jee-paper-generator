  <script>
    const data = {"index": 28, "chapterId": "61c089c2bfc6752d818a444c", "chapter": "Application of Derivatives", "exam": "MHT CET", "subject": "Mathematics", "totalTopics": 6, "totalQuestions": 402, "downloadTime": "2026-10-08 20:43:45", "topics": [{"index": 1, "topicId": "65a263380279619d9d8a3d23", "title": "Tangent Normal", "totalQuestions": 111, "questions": [{"_id": "6abb88d915a9fc0fc8c14785", "type": "singleCorrect", "question": {"text": "Let the curve $y = e^{2x} + x^2$ cuts the Y-axis at the point P. If the tangent and normal to the curve at point P intersect the X-axis at points R and Q respectively, the area of triangle PQR is.....", "image": null}, "options": [{"id": "8A8BV", "label": "A", "text": "$\\dfrac{3}{4}$", "isCorrect": false, "image": null}, {"id": "BTyfa", "label": "B", "text": "$\\dfrac{3}{2}$", "isCorrect": false, "image": null}, {"id": "MNej4", "label": "C", "text": "$\\dfrac{5}{4}$", "isCorrect": true, "image": null}, {"id": "zEOkK", "label": "D", "text": "$\\dfrac{5}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of the curve is given by $y = e^{2x} + x^2$.<br><br>To find the point of intersection with the Y-axis, we substitute $x = 0$ into the equation of the curve:<br>$y = e^{0} + 0 = 1$<br>Thus, the point P is $(0, 1)$.<br><br>Next, we find the slope of the tangent to the curve at P by differentiating $y$ with respect to $x$:<br>$\\dfrac{dy}{dx} = 2e^{2x} + 2x$<br><br>At point P$(0, 1)$, the slope of the tangent is:<br>$m = \\left. \\dfrac{dy}{dx} \\right|_{x=0} = 2e^{0} + 0 = 2$<br><br>The equation of the tangent at P$(0, 1)$ is:<br>$y - 1 = 2(x - 0)$<br>$y = 2x + 1$<br>The tangent intersects the X-axis at R. Substituting $y = 0$, we get $x = -\\dfrac{1}{2}$.<br>So, R is $\\left(-\\dfrac{1}{2}, 0\\right)$.<br><br>The slope of the normal at P is $-\\dfrac{1}{m} = -\\dfrac{1}{2}$.<br>The equation of the normal at P$(0, 1)$ is:<br>$y - 1 = -\\dfrac{1}{2}(x - 0)$<br>$y = -\\dfrac{x}{2} + 1$<br>The normal intersects the X-axis at Q. Substituting $y = 0$, we get $x = 2$.<br>So, Q is $(2, 0)$.<br><br>The base of the triangle PQR lies on the X-axis along the segment RQ. The length of the base is:<br>$RQ = 2 - \\left(-\\dfrac{1}{2}\\right) = \\dfrac{5}{2}$<br><br>The height of the triangle is the y-coordinate of point P, which is $1$.<br><br>The area of triangle PQR is:<br>$\\text{Area} = \\dfrac{1}{2} \\times \\text{base} \\times \\text{height} = \\dfrac{1}{2} \\times \\dfrac{5}{2} \\times 1 = \\dfrac{5}{4}$<br><br>Answer: $\\dfrac{5}{4}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884915a9fc0fc8c14241", "type": "singleCorrect", "question": {"text": "The tangent to the curve $y = e^{2x}$ is drawn at the point $P(0,1)$. If this tangent intersects the $x$-axis at point $A$ and the $y$-axis at point $B$, then the area of $\\triangle OAB$ (where $O$ is the origin) in square units is:", "image": null}, "options": [{"id": "BY6jq", "label": "A", "text": "$\\dfrac{1}{4}$", "isCorrect": true, "image": null}, {"id": "vaORy", "label": "B", "text": "$\\dfrac{1}{2}$", "isCorrect": false, "image": null}, {"id": "up8Q4", "label": "C", "text": "$1$", "isCorrect": false, "image": null}, {"id": "Svosq", "label": "D", "text": "$2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given curve is $y = e^{2x}$.<br><br>Differentiating with respect to $x$, we get $\\dfrac{dy}{dx} = 2e^{2x}$.<br><br>At point $P(0,1)$, the slope of the tangent is $m = 2e^{0} = 2$.<br><br>The equation of the tangent at $P(0,1)$ is $y - 1 = 2(x - 0)$, which simplifies to $y = 2x + 1$.<br><br>The tangent intersects the $x$-axis at point $A$. Substituting $y = 0$, we get $x = -\\dfrac{1}{2}$. Thus, $A \\equiv \\left(-\\dfrac{1}{2}, 0\\right)$.<br><br>The tangent intersects the $y$-axis at point $B$. Substituting $x = 0$, we get $y = 1$. Thus, $B \\equiv (0, 1)$.<br><br>The area of $\\triangle OAB$ is $\\dfrac{1}{2} \\times OA \\times OB = \\dfrac{1}{2} \\times \\left|-\\dfrac{1}{2}\\right| \\times |1| = \\dfrac{1}{4}$ sq. units.<br><br>Answer: $\\dfrac{1}{4}$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb884915a9fc0fc8c14240", "type": "singleCorrect", "question": {"text": "The equation of the line tangent to the curve $y^2 = 4x$ with an inclination of $60^\\circ$ is:", "image": null}, "options": [{"id": "dVwck", "label": "A", "text": "$3x - \\sqrt{3}y - 1 = 0$", "isCorrect": false, "image": null}, {"id": "Ea1l7", "label": "B", "text": "$3x - \\sqrt{3}y + 1 = 0$", "isCorrect": true, "image": null}, {"id": "Yt4rI", "label": "C", "text": "$3x + \\sqrt{3}y + 1 = 0$", "isCorrect": false, "image": null}, {"id": "HprQD", "label": "D", "text": "$3x + \\sqrt{3}y - 1 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given curve is $y^2 = 4x$, which is a parabola of the form $y^2 = 4ax$.<br><br>Comparing, we get $a = 1$.<br><br>The inclination of the tangent is $60^{\\circ}$, so its slope is $m = \\tan 60^{\\circ} = \\sqrt{3}$.<br><br>The equation of a tangent to the parabola $y^2 = 4ax$ with slope $m$ is given by $y = mx + \\dfrac{a}{m}$.<br><br>Substituting $a = 1$ and $m = \\sqrt{3}$, we get:<br><br>$y = \\sqrt{3}x + \\dfrac{1}{\\sqrt{3}}$<br><br>Multiplying the entire equation by $\\sqrt{3}$, we obtain:<br><br>$\\sqrt{3}y = 3x + 1$<br><br>$3x - \\sqrt{3}y + 1 = 0$<br><br>Answer: $3x - \\sqrt{3}y + 1 = 0$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb885915a9fc0fc8c142d6", "type": "singleCorrect", "question": {"text": "The coordinates of the point on the curve $y = \\sin\\left(\\dfrac{\\pi x}{2}\\right)$ at which the normal is parallel to the Y- axis are:", "image": null}, "options": [{"id": "yHhSe", "label": "A", "text": "$(1, 0)$", "isCorrect": false, "image": null}, {"id": "HK6ig", "label": "B", "text": "$(1, 2)$", "isCorrect": false, "image": null}, {"id": "fgU8r", "label": "C", "text": "$(1, 1)$", "isCorrect": true, "image": null}, {"id": "T1Is3", "label": "D", "text": "$(2, 0)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given curve is $y = \\sin\\left(\\dfrac{\\pi x}{2}\\right)$<br><br>Differentiating with respect to $x$:<br><br>$\\dfrac{dy}{dx} = \\dfrac{\\pi}{2} \\cos\\left(\\dfrac{\\pi x}{2}\\right)$<br><br>Since the normal is parallel to the Y-axis, the tangent must be parallel to the X-axis. Therefore, the slope of the tangent is zero.<br><br>$\\dfrac{dy}{dx} = 0$<br><br>$\\dfrac{\\pi}{2} \\cos\\left(\\dfrac{\\pi x}{2}\\right) = 0$<br><br>$\\cos\\left(\\dfrac{\\pi x}{2}\\right) = 0$<br><br>$\\dfrac{\\pi x}{2} = (2n + 1)\\dfrac{\\pi}{2}$, where $n$ is an integer.<br><br>$x = 2n + 1$<br><br>For $n = 0$, $x = 1$.<br><br>Substituting $x = 1$ in the equation of the curve:<br><br>$y = \\sin\\left(\\dfrac{\\pi}{2}\\right) = 1$<br><br>Thus, the coordinates of the point are $(1, 1)$.<br><br>Answer: $(1, 1)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888815a9fc0fc8c14498", "type": "singleCorrect", "question": {"text": "The point on the curve $y = 3x^2 - 9x + 8$ where the tangent is parallel to x-axis is", "image": null}, "options": [{"id": "gwgnz", "label": "A", "text": "$\\left(\\dfrac{1}{2}, \\dfrac{3}{2}\\right)$", "isCorrect": false, "image": null}, {"id": "CA2mh", "label": "B", "text": "$\\left(\\dfrac{3}{2}, \\dfrac{5}{4}\\right)$", "isCorrect": true, "image": null}, {"id": "eVr6I", "label": "C", "text": "$\\left(\\dfrac{2}{3}, \\dfrac{1}{3}\\right)$", "isCorrect": false, "image": null}, {"id": "iQesN", "label": "D", "text": "$\\left(\\dfrac{1}{4}, \\dfrac{2}{5}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given curve is $y = 3x^2 - 9x + 8$.<br><br>Differentiating with respect to $x$, we get:<br><br>$\\dfrac{dy}{dx} = 6x - 9$<br><br>Since the tangent is parallel to the x-axis, its slope is zero. Therefore, $\\dfrac{dy}{dx} = 0$.<br><br>$6x - 9 = 0 \\Rightarrow x = \\dfrac{3}{2}$<br><br>Substituting $x = \\dfrac{3}{2}$ in the equation of the curve:<br><br>$y = 3\\left(\\dfrac{3}{2}\\right)^2 - 9\\left(\\dfrac{3}{2}\\right) + 8$<br><br>$y = \\dfrac{27}{4} - \\dfrac{27}{2} + 8$<br><br>$y = \\dfrac{27 - 54 + 32}{4} = \\dfrac{5}{4}$<br><br>The required point is $\\left(\\dfrac{3}{2}, \\dfrac{5}{4}\\right)$.<br><br>Answer: $\\left(\\dfrac{3}{2}, \\dfrac{5}{4}\\right)$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c815a9fc0fc8c146f0", "type": "singleCorrect", "question": {"text": "A tangent is drawn from the origin $(0,0)$ to the curve $y = \\sin x$. If $(x, y)$ is the point of contact and $x \\neq 0$, then which of the following relations is true?", "image": null}, "options": [{"id": "XHw6Y", "label": "A", "text": "$\\dfrac{1}{y^2} - \\dfrac{1}{x^2} = 1$", "isCorrect": true, "image": null}, {"id": "3Zecc", "label": "B", "text": "$\\dfrac{1}{y^2} + \\dfrac{1}{x^2} = 1$", "isCorrect": false, "image": null}, {"id": "Gwufh", "label": "C", "text": "$\\dfrac{1}{x^2} - \\dfrac{1}{y^2} = 1$", "isCorrect": false, "image": null}, {"id": "uGD6W", "label": "D", "text": "$\\dfrac{1}{x^2} + \\dfrac{1}{y^2} = -1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the point of contact be $(x, y)$.<br><br>The equation of the curve is $y = \\sin x$.<br><br>Differentiating with respect to $x$, we get the slope of the tangent:<br><br>$\\dfrac{dy}{dx} = \\cos x$<br><br>Since the tangent passes through the origin $(0,0)$ and the point of contact $(x, y)$, its slope can also be written as:<br><br>$\\dfrac{dy}{dx} = \\dfrac{y - 0}{x - 0} = \\dfrac{y}{x}$<br><br>Equating the two expressions for the slope:<br><br>$\\cos x = \\dfrac{y}{x}$<br><br>Since the point $(x, y)$ lies on the curve, we have:<br><br>$\\sin x = y$<br><br>Squaring and adding the equations for $\\sin x$ and $\\cos x$:<br><br>$\\sin^2 x + \\cos^2 x = y^2 + \\dfrac{y^2}{x^2}$<br><br>$1 = y^2 \\left(1 + \\dfrac{1}{x^2}\\right)$<br><br>Dividing both sides by $y^2$:<br><br>$\\dfrac{1}{y^2} = 1 + \\dfrac{1}{x^2}$<br><br>$\\dfrac{1}{y^2} - \\dfrac{1}{x^2} = 1$<br><br>Answer: $\\dfrac{1}{y^2} - \\dfrac{1}{x^2} = 1$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c815a9fc0fc8c146ef", "type": "singleCorrect", "question": {"text": "The sum of the abscissae of the points on the curve $y = x^3 - 6x^2 + x + 3$ whose normal is parallel to the line $x + y = 1975$ is...", "image": null}, "options": [{"id": "uxzne", "label": "A", "text": "$4$", "isCorrect": true, "image": null}, {"id": "xwJMq", "label": "B", "text": "$-22$", "isCorrect": false, "image": null}, {"id": "Ne9nQ", "label": "C", "text": "$7$", "isCorrect": false, "image": null}, {"id": "2dgBb", "label": "D", "text": "$0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of the curve is $y = x^3 - 6x^2 + x + 3$<br><br>Differentiating with respect to $x$, we get the slope of the tangent:<br><br>$\\dfrac{dy}{dx} = 3x^2 - 12x + 1$<br><br>The normal is parallel to the line $x + y = 1975$, which has a slope of $-1$.<br><br>Therefore, the slope of the normal is $-1$, which means the slope of the tangent is $1$.<br><br>Equating the slope of the tangent to $1$:<br><br>$3x^2 - 12x + 1 = 1$<br><br>$3x^2 - 12x = 0$<br><br>$3x(x - 4) = 0$<br><br>The abscissae of the points are $x = 0$ and $x = 4$.<br><br>The sum of the abscissae is $0 + 4 = 4$.<br><br>Answer: $4$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883915a9fc0fc8c141aa", "type": "singleCorrect", "question": {"text": "The sum of abscissa of the points on the curve $y=x^3-3x^2+x-2$ at which the tangent is parallel to the line $y=x$ is ___", "image": null}, "options": [{"id": "9D0gI", "label": "A", "text": "$-6$", "isCorrect": false, "image": null}, {"id": "vK2QG", "label": "B", "text": "$2$", "isCorrect": true, "image": null}, {"id": "fu1en", "label": "C", "text": "$0$", "isCorrect": false, "image": null}, {"id": "J9sAy", "label": "D", "text": "$6$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of the given curve is $y = x^3 - 3x^2 + x - 2$.<br><br>Differentiating with respect to $x$, we get the slope of the tangent:<br><br>$\\dfrac{dy}{dx} = 3x^2 - 6x + 1$<br><br>Since the tangent is parallel to the line $y = x$, its slope must be equal to the slope of the line, which is $1$.<br><br>Equating the slopes, we get:<br><br>$3x^2 - 6x + 1 = 1$<br><br>$3x^2 - 6x = 0$<br><br>$3x(x - 2) = 0$<br><br>This gives $x = 0$ or $x = 2$.<br><br>The abscissas of the points are $0$ and $2$.<br><br>Sum of the abscissas $= 0 + 2 = 2$.<br><br>Answer: $2$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2b08c30a4553e1bdbbc", "type": "singleCorrect", "question": {"text": "The line $x + y = 0$ touches the curve $y^2 = ax^3 + b$ at $(1, -1)$ then values of $a$ and $b$ respectively are ...........", "image": null}, "options": [{"id": "avk4h", "label": "A", "text": "$\\dfrac{1}{2}, \\dfrac{2}{5}$", "isCorrect": false, "image": null}, {"id": "QP2lQ", "label": "B", "text": "$\\dfrac{1}{3}, \\dfrac{2}{3}$", "isCorrect": false, "image": null}, {"id": "qZZHw", "label": "C", "text": "$\\dfrac{2}{3}, \\dfrac{1}{3}$", "isCorrect": true, "image": null}, {"id": "Bwpwi", "label": "D", "text": "$\\dfrac{2}{5}, \\dfrac{1}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since the point $(1, -1)$ lies on the curve $y^2 = ax^3 + b$, substituting $x = 1$ and $y = -1$ gives:<br><br>$(-1)^2 = a(1)^3 + b$<br><br>$a + b = 1$<br><br>Differentiating the equation of the curve with respect to $x$ gives:<br><br>$2y \\dfrac{dy}{dx} = 3ax^2$<br><br>$\\dfrac{dy}{dx} = \\dfrac{3ax^2}{2y}$<br><br>The slope of the tangent at $(1, -1)$ is:<br><br>$\\left. \\dfrac{dy}{dx} \\right|_{(1, -1)} = \\dfrac{3a(1)^2}{2(-1)} = -\\dfrac{3a}{2}$<br><br>The given tangent line is $x + y = 0$, which has a slope of $-1$. Equating the slopes gives:<br><br>$-\\dfrac{3a}{2} = -1$<br><br>$a = \\dfrac{2}{3}$<br><br>Substituting the value of $a$ into $a + b = 1$ gives:<br><br>$\\dfrac{2}{3} + b = 1$<br><br>$b = \\dfrac{1}{3}$<br><br>Answer: $\\dfrac{2}{3}, \\dfrac{1}{3}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3588c30a4553e1be2c4", "type": "singleCorrect", "question": {"text": "If the line $ax + by + 5 = 0$ is a normal to the curve $xy = 1$ then .....", "image": null}, "options": [{"id": "zhDv6", "label": "A", "text": "$a > 0, b < 0$", "isCorrect": true, "image": null}, {"id": "FnoiJ", "label": "B", "text": "$a < 0, b < 0$", "isCorrect": false, "image": null}, {"id": "rIvkj", "label": "C", "text": "$a > 0, b = 0$", "isCorrect": false, "image": null}, {"id": "IDLWH", "label": "D", "text": "$a > 0, b > 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of the given curve is $xy = 1$, which can be written as $y = \\dfrac{1}{x}$.<br><br>Differentiating with respect to $x$, we get the slope of the tangent:<br><br>$\\dfrac{dy}{dx} = -\\dfrac{1}{x^2}$<br><br>The slope of the normal to the curve is given by:<br><br>$m = -\\dfrac{1}{\\dfrac{dy}{dx}} = x^2$<br><br>Since $x \\neq 0$ for any point on the curve $xy = 1$, we have $x^2 > 0$. Thus, the slope of the normal is always strictly positive.<br><br>The given equation of the normal is $ax + by + 5 = 0$.<br><br>The slope of this line is $-\\dfrac{a}{b}$.<br><br>For this line to represent a normal to the curve, its slope must be positive:<br><br>$-\\dfrac{a}{b} > 0 \\Rightarrow \\dfrac{a}{b} < 0$<br><br>This condition implies that $a$ and $b$ must have opposite signs. Among the given options, the only one that satisfies this condition is $a > 0, b < 0$.<br><br>Answer: $a > 0, b < 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32d8c30a4553e1be103", "type": "singleCorrect", "question": {"text": "If the line $x + By + C = 0$ is the normal to the curve given by $x = a\\sin^3 t$, $y = b\\cos^3 t$, (where $a, b \\neq 0$) at a point $t = \\dfrac{\\pi}{2}$, then $B - C = $", "image": null}, "options": [{"id": "W8vsh", "label": "A", "text": "$a$", "isCorrect": true, "image": null}, {"id": "CfLNH", "label": "B", "text": "$2a$", "isCorrect": false, "image": null}, {"id": "DYEpy", "label": "C", "text": "$-a$", "isCorrect": false, "image": null}, {"id": "DjIjb", "label": "D", "text": "$0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given the parametric equations of the curve:<br><br>$x = a\\sin^3 t$<br><br>$y = b\\cos^3 t$<br><br>At $t = \\dfrac{\\pi}{2}$, the coordinates of the point on the curve are:<br><br>$x = a\\sin^3\\left(\\dfrac{\\pi}{2}\\right) = a(1)^3 = a$<br><br>$y = b\\cos^3\\left(\\dfrac{\\pi}{2}\\right) = b(0)^3 = 0$<br><br>So, the point is $(a, 0)$.<br><br>Differentiating $x$ and $y$ with respect to $t$:<br><br>$\\dfrac{dx}{dt} = 3a\\sin^2 t \\cos t$<br><br>$\\dfrac{dy}{dt} = -3b\\cos^2 t \\sin t$<br><br>The slope of the tangent to the curve is:<br><br>$\\dfrac{dy}{dx} = \\dfrac{\\dfrac{dy}{dt}}{\\dfrac{dx}{dt}} = \\dfrac{-3b\\cos^2 t \\sin t}{3a\\sin^2 t \\cos t} = -\\dfrac{b}{a}\\cot t$<br><br>At $t = \\dfrac{\\pi}{2}$, the slope of the tangent is $\\dfrac{dy}{dx} = -\\dfrac{b}{a}\\cot\\left(\\dfrac{\\pi}{2}\\right) = 0$.<br><br>Since the tangent is horizontal, the normal to the curve is vertical (parallel to the y-axis).<br><br>The equation of the vertical normal passing through $(a, 0)$ is:<br><br>$x = a \\Rightarrow x + 0 \\cdot y - a = 0$<br><br>Comparing this with the given equation of the normal $x + By + C = 0$, we get:<br><br>$B = 0$<br><br>$C = -a$<br><br>Therefore, the value of $B - C$ is:<br><br>$B - C = 0 - (-a) = a$<br><br>Answer: $a$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32d8c30a4553e1be102", "type": "singleCorrect", "question": {"text": "If the tangent to the curve $xy + ax + by = 0$ at $(1,1)$ makes an angle of $\\tan^{-1}2$ with positive direction of the $x$-axis, then the value of $\\dfrac{ab}{a+b}$ is...", "image": null}, "options": [{"id": "M4TgY", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "90yMR", "label": "B", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "zVp3L", "label": "C", "text": "$2$", "isCorrect": true, "image": null}, {"id": "KCybF", "label": "D", "text": "$-2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since the point $(1,1)$ lies on the curve $xy + ax + by = 0$, substituting $x=1$ and $y=1$ gives:<br><br>$1 + a + b = 0 \\Rightarrow a + b = -1$<br><br>Differentiating the equation of the curve with respect to $x$, we get:<br><br>$y + x\\dfrac{dy}{dx} + a + b\\dfrac{dy}{dx} = 0$<br><br>$\\dfrac{dy}{dx} = -\\dfrac{y+a}{x+b}$<br><br>The slope of the tangent at $(1,1)$ is given as $\\tan(\\tan^{-1}2) = 2$.<br><br>$\\left. \\dfrac{dy}{dx} \\right|_{(1,1)} = -\\dfrac{1+a}{1+b} = 2$<br><br>$-1 - a = 2 + 2b \\Rightarrow a + 2b = -3$<br><br>Solving $a + b = -1$ and $a + 2b = -3$, we get:<br><br>$b = -2$ and $a = 1$<br><br>The value of $\\dfrac{ab}{a+b}$ is:<br><br>$\\dfrac{(1)(-2)}{-1} = 2$<br><br>Answer: $2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d34a8c30a4553e1be22e", "type": "singleCorrect", "question": {"text": "The equation of the tangent to the curve $y = \\sqrt{9 - 3x^2}$ at the point where the ordinate and abscissa equal is...", "image": null}, "options": [{"id": "kOweU", "label": "A", "text": "$x - 3y + 3 = 0$", "isCorrect": false, "image": null}, {"id": "JUkzc", "label": "B", "text": "$3x - y - 3 = 0$", "isCorrect": false, "image": null}, {"id": "G8s8z", "label": "C", "text": "$x + 3y - 6 = 0$", "isCorrect": false, "image": null}, {"id": "t2YWz", "label": "D", "text": "$3x + y - 6 = 0$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given curve is $y = \\sqrt{9 - 3x^2}$<br><br>At the point where ordinate and abscissa are equal, $y = x$.<br><br>Substituting $y = x$ in the curve equation:<br><br>$x = \\sqrt{9 - 3x^2}$<br><br>Squaring both sides:<br><br>$x^2 = 9 - 3x^2$<br><br>$4x^2 = 9$<br><br>$x = \\dfrac{3}{2}$ (since $x \\ge 0$ as $y \\ge 0$)<br><br>Thus, the point of tangency is $\\left(\\dfrac{3}{2}, \\dfrac{3}{2}\\right)$.<br><br>Differentiating the curve equation $y^2 = 9 - 3x^2$ with respect to $x$:<br><br>$2y \\dfrac{dy}{dx} = -6x$<br><br>$\\dfrac{dy}{dx} = \\dfrac{-3x}{y}$<br><br>At the point $\\left(\\dfrac{3}{2}, \\dfrac{3}{2}\\right)$, the slope of the tangent is:<br><br>$m = \\dfrac{-3 \\left(\\dfrac{3}{2}\\right)}{\\dfrac{3}{2}} = -3$<br><br>The equation of the tangent is:<br><br>$y - \\dfrac{3}{2} = -3\\left(x - \\dfrac{3}{2}\\right)$<br><br>$2y - 3 = -6x + 9$<br><br>$6x + 2y - 12 = 0$<br><br>$3x + y - 6 = 0$<br><br>Answer: $3x + y - 6 = 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d34a8c30a4553e1be22d", "type": "singleCorrect", "question": {"text": "If the line $y = 4x - 5$ is tangent to the curve $y^2 = ax^3 + b$ at the point $(2,3)$, then the value of $7a - 2b$ is...", "image": null}, "options": [{"id": "3QzHL", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "yAl8B", "label": "B", "text": "$7$", "isCorrect": false, "image": null}, {"id": "DQ9Dv", "label": "C", "text": "$14$", "isCorrect": false, "image": null}, {"id": "QkKN4", "label": "D", "text": "$28$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The point $(2,3)$ lies on the curve $y^2 = ax^3 + b$.<br><br>Substituting $x = 2$ and $y = 3$ into the curve equation:<br><br>$3^2 = a(2^3) + b$<br><br>$8a + b = 9$<br><br>Differentiating the curve equation with respect to $x$:<br><br>$2y \\dfrac{dy}{dx} = 3ax^2$<br><br>$\\dfrac{dy}{dx} = \\dfrac{3ax^2}{2y}$<br><br>At the point $(2,3)$, the slope of the tangent is:<br><br>$\\dfrac{dy}{dx} = \\dfrac{3a(2^2)}{2(3)} = 2a$<br><br>The given tangent line is $y = 4x - 5$, which has a slope of $4$. Equating the slopes:<br><br>$2a = 4 \\Rightarrow a = 2$<br><br>Substituting $a = 2$ into $8a + b = 9$:<br><br>$8(2) + b = 9 \\Rightarrow b = -7$<br><br>The value of $7a - 2b$ is:<br><br>$7(2) - 2(-7) = 14 + 14 = 28$<br><br>Answer: $28$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2cd8c30a4553e1bdcf2", "type": "singleCorrect", "question": {"text": "The tangent to the curve intersects the Y-axis at point P. A line drawn through point P is perpendicular to this tangent and passes through another point $(1, 0)$. The differential equation of the curve is...", "image": null}, "options": [{"id": "g6lYg", "label": "A", "text": "$y\\dfrac{dy}{dx} - x\\left(\\dfrac{dy}{dx}\\right)^2 = 1$", "isCorrect": true, "image": null}, {"id": "xShz7", "label": "B", "text": "$x\\dfrac{dy}{dx} - y\\left(\\dfrac{dy}{dx}\\right)^2 = 1$", "isCorrect": false, "image": null}, {"id": "UpEqN", "label": "C", "text": "$y\\dfrac{dy}{dx} + x = 1$", "isCorrect": false, "image": null}, {"id": "0wZ6C", "label": "D", "text": "$x\\dfrac{dy}{dx} + y = 1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the point on the curve be $(x, y)$.<br><br>The equation of the tangent at $(x, y)$ is $Y - y = \\dfrac{dy}{dx}(X - x)$.<br><br>To find the intersection with the Y-axis (point P), substitute $X = 0$:<br><br>$Y = y - x\\dfrac{dy}{dx}$<br><br>Thus, the coordinates of point P are $\\left(0, y - x\\dfrac{dy}{dx}\\right)$.<br><br>The slope of the tangent is $\\dfrac{dy}{dx}$, so the slope of the line perpendicular to it is $-\\dfrac{dx}{dy}$.<br><br>This perpendicular line passes through P $\\left(0, y - x\\dfrac{dy}{dx}\\right)$ and $(1, 0)$. The slope of this line is also given by:<br><br>$\\dfrac{0 - \\left(y - x\\dfrac{dy}{dx}\\right)}{1 - 0} = x\\dfrac{dy}{dx} - y$<br><br>Equating the two expressions for the slope:<br><br>$x\\dfrac{dy}{dx} - y = -\\dfrac{dx}{dy}$<br><br>Multiplying both sides by $\\dfrac{dy}{dx}$:<br><br>$x\\left(\\dfrac{dy}{dx}\\right)^2 - y\\dfrac{dy}{dx} = -1$<br><br>$y\\dfrac{dy}{dx} - x\\left(\\dfrac{dy}{dx}\\right)^2 = 1$<br><br>Answer: $y\\dfrac{dy}{dx} - x\\left(\\dfrac{dy}{dx}\\right)^2 = 1$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a76", "title": "MHT CET 2026 (17 April Shift 1)", "shortName": "2026 (17 April Shift 1)", "isVisible": true, "heldOn": "2026-04-17T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2da8c30a4553e1bdd7d", "type": "singleCorrect", "question": {"text": "The equation of tangent to the curves $x = 1 - 3t^2$ and $y = t - 3t^3$ at the point $(-2, 2)$ is...", "image": null}, "options": [{"id": "Aiiy3", "label": "A", "text": "$4x + 3y + 2 = 0$", "isCorrect": true, "image": null}, {"id": "ViGEQ", "label": "B", "text": "$4x - 3y + 2 = 0$", "isCorrect": false, "image": null}, {"id": "Vp9hT", "label": "C", "text": "$3x + 4y + 2 = 0$", "isCorrect": false, "image": null}, {"id": "P9CFa", "label": "D", "text": "$3x - 4y + 2 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $x = 1 - 3t^2$ and $y = t - 3t^3$.<br><br>At the point $(-2, 2)$, we have $1 - 3t^2 = -2 \\Rightarrow 3t^2 = 3 \\Rightarrow t = \\pm 1$.<br><br>Also $t - 3t^3 = 2$. For $t = -1$, $-1 - 3(-1)^3 = 2$, which satisfies the equation. Thus, $t = -1$.<br><br>Differentiating $x$ and $y$ with respect to $t$:<br><br>$\\dfrac{dx}{dt} = -6t$<br><br>$\\dfrac{dy}{dt} = 1 - 9t^2$<br><br>The slope of the tangent is $\\dfrac{dy}{dx} = \\dfrac{\\dfrac{dy}{dt}}{\\dfrac{dx}{dt}} = \\dfrac{1 - 9t^2}{-6t}$.<br><br>At $t = -1$, $\\dfrac{dy}{dx} = \\dfrac{1 - 9(-1)^2}{-6(-1)} = \\dfrac{-8}{6} = -\\dfrac{4}{3}$.<br><br>The equation of the tangent at $(-2, 2)$ is:<br><br>$y - 2 = -\\dfrac{4}{3}(x - (-2))$<br><br>$3(y - 2) = -4(x + 2)$<br><br>$3y - 6 = -4x - 8$<br><br>$4x + 3y + 2 = 0$<br><br>Answer: $4x + 3y + 2 = 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e88c30a4553e1bde18", "type": "singleCorrect", "question": {"text": "The point on the curve $9y^2 = x^3$ where the normal to the curve makes equal intercepts with the co-ordinate axes is", "image": null}, "options": [{"id": "7vesj", "label": "A", "text": "$\\left(-4, \\dfrac{8}{3}\\right)$", "isCorrect": false, "image": null}, {"id": "Kx8vg", "label": "B", "text": "$\\left(4, \\dfrac{8}{3}\\right)$", "isCorrect": true, "image": null}, {"id": "upcN9", "label": "C", "text": "$\\left(-4, \\dfrac{-8}{3}\\right)$", "isCorrect": false, "image": null}, {"id": "3eXqy", "label": "D", "text": "$\\left(-4, \\dfrac{3}{8}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of the given curve is $9y^2 = x^3$.<br><br>Differentiating both sides with respect to $x$, we get:<br>$18y \\dfrac{dy}{dx} = 3x^2$<br>$\\dfrac{dy}{dx} = \\dfrac{3x^2}{18y} = \\dfrac{x^2}{6y}$<br><br>The slope of the normal to the curve is given by $-\\dfrac{dx}{dy}$:<br>Slope of normal = $-\\dfrac{6y}{x^2}$<br><br>Since the normal makes equal intercepts with the coordinate axes, its slope must be $-1$.<br>$-\\dfrac{6y}{x^2} = -1$<br>$x^2 = 6y \\Rightarrow y = \\dfrac{x^2}{6}$<br><br>Substituting $y = \\dfrac{x^2}{6}$ into the equation of the curve $9y^2 = x^3$, we get:<br>$9\\left(\\dfrac{x^2}{6}\\right)^2 = x^3$<br>$9 \\times \\dfrac{x^4}{36} = x^3$<br>$\\dfrac{x^4}{4} = x^3$<br>$x^4 - 4x^3 = 0$<br>$x^3(x - 4) = 0$<br><br>For a non-zero intercept, $x \\neq 0$, so we have $x = 4$.<br><br>Substituting $x = 4$ into $y = \\dfrac{x^2}{6}$:<br>$y = \\dfrac{4^2}{6} = \\dfrac{16}{6} = \\dfrac{8}{3}$<br><br>Thus, the required point on the curve is $\\left(4, \\dfrac{8}{3}\\right)$.<br><br>Answer: $\\left(4, \\dfrac{8}{3}\\right)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31f8c30a4553e1be06c", "type": "singleCorrect", "question": {"text": "The co-ordinates of the point on the curve $y = x\\log x$ at which the normal is parallel to the line $2x - 2y = 3$ are...", "image": null}, "options": [{"id": "i4Blk", "label": "A", "text": "$(0, 0)$", "isCorrect": false, "image": null}, {"id": "Kkz2Z", "label": "B", "text": "$(e, e)$", "isCorrect": false, "image": null}, {"id": "tKMC6", "label": "C", "text": "$(e^2, 2e^2)$", "isCorrect": false, "image": null}, {"id": "Y0Tcc", "label": "D", "text": "$(e^{-2}, -2e^{-2})$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given curve is $y = x \\log x$<br><br>Differentiating with respect to $x$, we get<br><br>$\\dfrac{dy}{dx} = \\log x + x \\cdot \\dfrac{1}{x} = \\log x + 1$<br><br>The normal to the curve is parallel to the line $2x - 2y = 3$, which has a slope of $1$.<br><br>Since the normal is perpendicular to the tangent, the slope of the tangent is $-1$.<br><br>Equating the derivative to the slope of the tangent:<br><br>$\\log x + 1 = -1$<br><br>$\\log x = -2$<br><br>$x = e^{-2}$<br><br>Substituting $x = e^{-2}$ in the equation of the curve:<br><br>$y = e^{-2} \\log(e^{-2}) = -2e^{-2}$<br><br>The required point is $(e^{-2}, -2e^{-2})$.<br><br>Answer: $(e^{-2}, -2e^{-2})$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a28c30a4553e1bdb26", "type": "singleCorrect", "question": {"text": "If the tangent to the curve $2y^3 = x^3 + ax^2$ at the point $(a, a)$ cuts off intercepts $\\alpha$ and $\\beta$ on the coordinate axes such that $\\alpha^2 + \\beta^2 = 61$, then the value of $a$ is", "image": null}, "options": [{"id": "kRtXV", "label": "A", "text": "$\\pm 61$", "isCorrect": false, "image": null}, {"id": "WK3jG", "label": "B", "text": "$\\pm 36$", "isCorrect": false, "image": null}, {"id": "mFZaP", "label": "C", "text": "$\\pm 30$", "isCorrect": true, "image": null}, {"id": "aP81j", "label": "D", "text": "$\\pm 25$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given curve: $2y^3 = x^3 + ax^2$<br><br>Differentiating with respect to $x$:<br><br>$6y^2 \\dfrac{dy}{dx} = 3x^2 + 2ax$<br><br>At the point $(a, a)$, the slope of the tangent is:<br><br>$6a^2 \\dfrac{dy}{dx} = 3a^2 + 2a^2 = 5a^2 \\Rightarrow \\dfrac{dy}{dx} = \\dfrac{5}{6}$<br><br>The equation of the tangent at $(a, a)$ is:<br><br>$y - a = \\dfrac{5}{6}(x - a)$<br><br>$6y - 6a = 5x - 5a$<br><br>$5x - 6y + a = 0$<br><br>The intercepts on the coordinate axes are $\\alpha$ and $\\beta$.<br><br>For the $x$-intercept $\\alpha$, put $y = 0$:<br><br>$5\\alpha + a = 0 \\Rightarrow \\alpha = -\\dfrac{a}{5}$<br><br>For the $y$-intercept $\\beta$, put $x = 0$:<br><br>$-6\\beta + a = 0 \\Rightarrow \\beta = \\dfrac{a}{6}$<br><br>Given that $\\alpha^2 + \\beta^2 = 61$:<br><br>$\\left(-\\dfrac{a}{5}\\right)^2 + \\left(\\dfrac{a}{6}\\right)^2 = 61$<br><br>$\\dfrac{a^2}{25} + \\dfrac{a^2}{36} = 61$<br><br>$a^2 \\left(\\dfrac{36 + 25}{900}\\right) = 61$<br><br>$a^2 \\left(\\dfrac{61}{900}\\right) = 61$<br><br>$a^2 = 900$<br><br>$a = \\pm 30$<br><br>Answer: $\\pm 30$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3748c30a4553e1be3f0", "type": "singleCorrect", "question": {"text": "The equation of the normal to the curve $xy + 7 = 0$ is $Ax + By + C = 0$, then", "image": null}, "options": [{"id": "YpE3O", "label": "A", "text": "$A > 0, B > 0$ or $A < 0, B < 0$", "isCorrect": true, "image": null}, {"id": "yBghm", "label": "B", "text": "$A > 0, B < 0$", "isCorrect": false, "image": null}, {"id": "azwAr", "label": "C", "text": "$A < 0, B > 0$", "isCorrect": false, "image": null}, {"id": "Hm3HE", "label": "D", "text": "$C = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given equation of the curve is $xy + 7 = 0$.<br><br>Differentiating with respect to $x$, we get:<br><br>$x \\dfrac{dy}{dx} + y = 0$<br><br>$\\dfrac{dy}{dx} = -\\dfrac{y}{x}$<br><br>Substituting $y = -\\dfrac{7}{x}$, we get:<br><br>$\\dfrac{dy}{dx} = \\dfrac{7}{x^2}$<br><br>Since $x^2 > 0$ for all $x \\neq 0$, the slope of the tangent $\\dfrac{dy}{dx} > 0$.<br><br>The slope of the normal is given by $-\\dfrac{dx}{dy} = -\\dfrac{x^2}{7} < 0$.<br><br>The given equation of the normal is $Ax + By + C = 0$, which has a slope of $-\\dfrac{A}{B}$.<br><br>Equating the slopes, we have:<br><br>$-\\dfrac{A}{B} < 0 \\Rightarrow \\dfrac{A}{B} > 0$<br><br>This implies that $A$ and $B$ must have the same sign. Therefore, either $A > 0, B > 0$ or $A < 0, B < 0$.<br><br>Answer: $A > 0, B > 0$ or $A < 0, B < 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3678c30a4553e1be35a", "type": "singleCorrect", "question": {"text": "The tangent to the curve $y^2 - xy + 9 = 0$ is vertical when", "image": null}, "options": [{"id": "4R5tk", "label": "A", "text": "$y = 0$", "isCorrect": false, "image": null}, {"id": "SchQR", "label": "B", "text": "$y = \\pm\\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "6VYPg", "label": "C", "text": "$y = \\dfrac{1}{2}$", "isCorrect": false, "image": null}, {"id": "apNCe", "label": "D", "text": "$y = \\pm 3$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given the equation of the curve:<br><br>$y^2 - xy + 9 = 0$<br><br>Differentiating both sides with respect to $x$, we get:<br><br>$2y \\dfrac{dy}{dx} - \\left( y + x \\dfrac{dy}{dx} \\right) = 0$<br><br>$\\dfrac{dy}{dx} (2y - x) = y$<br><br>$\\dfrac{dy}{dx} = \\dfrac{y}{2y - x}$<br><br>For the tangent to be vertical, its slope $\\dfrac{dy}{dx}$ must approach infinity. This occurs when the denominator is zero and the numerator is non-zero:<br><br>$2y - x = 0 \\Rightarrow x = 2y$<br><br>Substituting $x = 2y$ into the equation of the curve:<br><br>$y^2 - (2y)y + 9 = 0$<br><br>$y^2 - 2y^2 + 9 = 0$<br><br>$-y^2 + 9 = 0$<br><br>$y^2 = 9$<br><br>$y = \\pm 3$<br><br>For $y = \\pm 3$, the numerator $y \\neq 0$, so the tangent is indeed vertical.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2bd8c30a4553e1bdc4e", "type": "singleCorrect", "question": {"text": "The equation of the tangent to the curve $y = 3x^3 - 3x^2 + x$ at $x = 1$ is", "image": null}, "options": [{"id": "GOeuY", "label": "A", "text": "$4x - y + 3 = 0$", "isCorrect": false, "image": null}, {"id": "zTejh", "label": "B", "text": "$4x + y - 3 = 0$", "isCorrect": false, "image": null}, {"id": "6SX9P", "label": "C", "text": "$4x - y - 3 = 0$", "isCorrect": true, "image": null}, {"id": "2R7Fo", "label": "D", "text": "$4x + y + 3 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given curve is $y = 3x^3 - 3x^2 + x$<br><br>Substituting $x = 1$, we get $y = 3(1)^3 - 3(1)^2 + 1 = 1$<br><br>The point of tangency is $(1, 1)$<br><br>Differentiating the given equation with respect to $x$, we get<br><br>$\\dfrac{dy}{dx} = 9x^2 - 6x + 1$<br><br>The slope of the tangent at $x = 1$ is<br><br>$m = \\left( \\dfrac{dy}{dx} \\right)_{x=1} = 9(1)^2 - 6(1) + 1 = 4$<br><br>The equation of the tangent at $(1, 1)$ is<br><br>$y - 1 = 4(x - 1)$<br><br>$y - 1 = 4x - 4$<br><br>$4x - y - 3 = 0$<br><br>Answer: $4x - y - 3 = 0$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6e", "title": "MHT CET 2026 (11 April Shift 1)", "shortName": "2026 (11 April Shift 1)", "isVisible": true, "heldOn": "2026-04-11T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871c01bf9280d7f9932e6e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The area of the triangle formed by the co-ordinate axes and a tangent to the curve $x \\mathrm{y}=a^2$ at the point $\\left(x_1, \\mathrm{y}_1\\right)$ is ________ sq.units (where $a, x_1$ and $y_1$ are non zero)", "image": null}, "options": [{"id": "spGLZ", "text": "$\\frac{a^2 x_1}{\\mathrm{y}_1}$", "image": null, "isCorrect": false}, {"id": "hsCul", "text": "$\\frac{a^2 y_1}{x_1}$", "image": null, "isCorrect": false}, {"id": "vBHB6", "text": "$2 a^2$", "image": null, "isCorrect": true}, {"id": "DnOZv", "text": "$4 a^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given curve is $xy = a^2$.<br><br>Differentiating with respect to $x$, we get:<br><br>$y + x \\dfrac{dy}{dx} = 0 \\Rightarrow \\dfrac{dy}{dx} = -\\dfrac{y}{x}$<br><br>The slope of the tangent at $(x_1, y_1)$ is $m = -\\dfrac{y_1}{x_1}$.<br><br>The equation of the tangent at $(x_1, y_1)$ is:<br><br>$y - y_1 = -\\dfrac{y_1}{x_1} (x - x_1)$<br><br>$x_1 y - x_1 y_1 = -y_1 x + x_1 y_1$<br><br>$y_1 x + x_1 y = 2 x_1 y_1$<br><br>Dividing by $2 x_1 y_1$, we get the intercept form of the line:<br><br>$\\dfrac{x}{2 x_1} + \\dfrac{y}{2 y_1} = 1$<br><br>The intercept on the $x$ axis is $2 x_1$ and the intercept on the $y$ axis is $2 y_1$.<br><br>The area of the right angled triangle formed by the coordinate axes and the tangent is:<br><br>$A = \\dfrac{1}{2} | 2 x_1 \\times 2 y_1 | = 2 | x_1 y_1 |$<br><br>Since the point $(x_1, y_1)$ lies on the curve $xy = a^2$, we have $x_1 y_1 = a^2$.<br><br>Therefore, the area of the triangle is $2 a^2$.<br><br>Answer: $2 a^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6d", "heldOn": "2025-05-05T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (5 May Shift 2)", "title": "MHT CET 2025 (5 May Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf4bf9280d7f9932df8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The points on the curve $\\mathrm{y}^2=\\frac{x^3}{9}$, where the normal to the curve makes equal intercepts with the axes, are", "image": null}, "options": [{"id": "2wpIJ", "text": "$\\left(4, \\frac{8}{3}\\right)$", "image": null, "isCorrect": true}, {"id": "su5ns", "text": "$\\left(-4, \\frac{8}{3}\\right)$", "image": null, "isCorrect": false}, {"id": "KBJbG", "text": "$\\left(\\frac{8}{3}, 4\\right)$", "image": null, "isCorrect": false}, {"id": "KonoL", "text": "$\\left(1, \\frac{1}{3}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the given curve is $y^2 = \\dfrac{x^3}{9}$.<br><br>Differentiating both sides with respect to $x$, we get:<br><br>$2y \\dfrac{dy}{dx} = \\dfrac{3x^2}{9}$<br><br>$\\dfrac{dy}{dx} = \\dfrac{x^2}{6y}$<br><br>Since the normal to the curve makes equal intercepts with the coordinate axes, the slope of the normal is $-1$.<br><br>Therefore, the slope of the tangent is $1$.<br><br>$\\dfrac{x^2}{6y} = 1 \\Rightarrow x^2 = 6y$<br><br>Squaring both sides, we get:<br><br>$x^4 = 36y^2$<br><br>Substituting $y^2 = \\dfrac{x^3}{9}$ into the above equation:<br><br>$x^4 = 36 \\left(\\dfrac{x^3}{9}\\right)$<br><br>$x^4 = 4x^3$<br><br>$x^3(x - 4) = 0$<br><br>Since $x = 0$ gives the origin where the intercepts are zero, we take $x = 4$.<br><br>Substituting $x = 4$ in $x^2 = 6y$, we get:<br><br>$4^2 = 6y \\Rightarrow 16 = 6y \\Rightarrow y = \\dfrac{8}{3}$<br><br>Thus, the required point on the curve is $\\left(4, \\dfrac{8}{3}\\right)$.<br><br>Answer: $\\left(4, \\frac{8}{3}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be6bf9280d7f9932d71", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The equation of the tangent to the curve $y=b e^{-x / a}$ at the point where it crosses the Y axis is", "image": null}, "options": [{"id": "cZYvE", "text": "$x+\\mathrm{y}=\\mathrm{ab}$", "image": null, "isCorrect": false}, {"id": "akvpg", "text": "$\\frac{x}{a}+\\frac{\\mathrm{y}}{\\mathrm{~b}}=1$", "image": null, "isCorrect": true}, {"id": "gZYeU", "text": "$a x+b y=1$", "image": null, "isCorrect": false}, {"id": "nuMNe", "text": "$x+y=a+b$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The curve crosses the Y-axis when $x = 0$.<br><br>Substituting $x = 0$ in the equation of the curve:<br><br>$y = b e^{0} = b$<br><br>The point of contact is $(0, b)$.<br><br>Differentiating $y = b e^{-x/a}$ with respect to $x$:<br><br>$\\dfrac{dy}{dx} = b e^{-x/a} \\left(-\\dfrac{1}{a}\\right) = -\\dfrac{b}{a} e^{-x/a}$<br><br>The slope of the tangent at $(0, b)$ is:<br><br>$m = \\left. \\dfrac{dy}{dx} \\right|_{(0, b)} = -\\dfrac{b}{a} e^{0} = -\\dfrac{b}{a}$<br><br>The equation of the tangent is given by:<br><br>$y - y_1 = m(x - x_1)$<br><br>$y - b = -\\dfrac{b}{a}(x - 0)$<br><br>$a(y - b) = -bx$<br><br>$bx + ay = ab$<br><br>Dividing by $ab$, we get:<br><br>$\\dfrac{x}{a} + \\dfrac{y}{b} = 1$<br><br>Answer: $\\frac{x}{a}+\\frac{\\mathrm{y}}{\\mathrm{~b}}=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd4bf9280d7f9932ccc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The equation of the tangent to the curve $\\left(1+x^2\\right) y=2-x$, where it crosses the X-axis, is", "image": null}, "options": [{"id": "n6MDw", "text": "$x+5 y=2$", "image": null, "isCorrect": true}, {"id": "b1Wir", "text": "$x-5 y=2$", "image": null, "isCorrect": false}, {"id": "LgRk0", "text": "$5 x-y=10$", "image": null, "isCorrect": false}, {"id": "E5syy", "text": "$5 x+y-10=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The curve crosses the X-axis when $y = 0$.<br><br>Substituting $y = 0$ in the given equation $(1+x^2)y = 2-x$:<br><br>$0 = 2-x \\Rightarrow x = 2$<br><br>The point of intersection is $(2, 0)$.<br><br>Differentiating the given equation with respect to $x$:<br><br>$(1+x^2)\\dfrac{dy}{dx} + y(2x) = -1$<br><br>At the point $(2, 0)$, substituting $x = 2$ and $y = 0$:<br><br>$(1+2^2)\\dfrac{dy}{dx} + 0 = -1$<br><br>$5\\dfrac{dy}{dx} = -1 \\Rightarrow \\dfrac{dy}{dx} = -\\dfrac{1}{5}$<br><br>The equation of the tangent at $(2, 0)$ is:<br><br>$y - 0 = -\\dfrac{1}{5}(x - 2)$<br><br>$5y = -x + 2$<br><br>$x + 5y = 2$<br><br>Answer: $x+5 y=2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc4bf9280d7f9932c3c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The angle $\\theta$, at which the curves $\\mathrm{y}=3^x$ and $\\mathrm{y}=7^x$ intersect, is given by", "image": null}, "options": [{"id": "DeLXQ", "text": "$\\tan \\theta=\\frac{\\log \\left(\\frac{3}{7}\\right)}{1+(\\log 3)(\\log 7)}$", "image": null, "isCorrect": true}, {"id": "th2Ih", "text": "$\\tan \\theta=\\frac{\\log \\left(7\\right)}{1+(\\log 3)(\\log 7)}$", "image": null, "isCorrect": false}, {"id": "iX9SC", "text": "$\\tan \\theta=\\frac{\\log \\left(\\frac{3}{7}\\right)}{1-(\\log 3)(\\log 7)}$", "image": null, "isCorrect": false}, {"id": "mil8S", "text": "$\\tan \\theta=\\frac{\\log \\left(\\frac{7}{3}\\right)}{1-(\\log 3)(\\log 7)}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "To find the point of intersection, we equate the two equations:<br><br>$3^x = 7^x$<br><br>$\\left(\\dfrac{3}{7}\\right)^x = 1 \\Rightarrow x = 0$<br><br>At $x = 0$, $y = 3^0 = 1$. The point of intersection is $(0, 1)$.<br><br>Differentiating $y = 3^x$ with respect to $x$, we get $\\dfrac{dy}{dx} = 3^x \\log 3$.<br><br>The slope of the tangent to the first curve at $(0, 1)$ is $m_1 = 3^0 \\log 3 = \\log 3$.<br><br>Differentiating $y = 7^x$ with respect to $x$, we get $\\dfrac{dy}{dx} = 7^x \\log 7$.<br><br>The slope of the tangent to the second curve at $(0, 1)$ is $m_2 = 7^0 \\log 7 = \\log 7$.<br><br>The angle of intersection $\\theta$ between the two curves is given by:<br><br>$\\tan \\theta = \\dfrac{m_1 - m_2}{1 + m_1 m_2}$<br><br>Substituting the values of $m_1$ and $m_2$:<br><br>$\\tan \\theta = \\dfrac{\\log 3 - \\log 7}{1 + (\\log 3)(\\log 7)}$<br><br>Using the property of logarithms $\\log a - \\log b = \\log\\left(\\dfrac{a}{b}\\right)$:<br><br>$\\tan \\theta = \\dfrac{\\log\\left(\\dfrac{3}{7}\\right)}{1 + (\\log 3)(\\log 7)}$<br><br>Answer: $\\tan \\theta=\\frac{\\log \\left(\\frac{3}{7}\\right)}{1+(\\log 3)(\\log 7)}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc4bf9280d7f9932c3a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The length of the perpendicular drawn from the origin on the normal to the curve $x^2+2 x y-3 y^2=0$ at the point $(2,2)$ is", "image": null}, "options": [{"id": "IqMBi", "text": "$\\sqrt{2}$ units", "image": null, "isCorrect": false}, {"id": "jErJE", "text": "$3 \\sqrt{2}$ units", "image": null, "isCorrect": false}, {"id": "jvuF1", "text": "$2 \\sqrt{2}$ units", "image": null, "isCorrect": true}, {"id": "RStQ9", "text": "$\\frac{1}{\\sqrt{2}}$ units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given the equation of the curve: $x^2 + 2xy - 3y^2 = 0$<br><br>Differentiating with respect to $x$, we get:<br><br>$2x + 2\\left(x\\dfrac{dy}{dx} + y\\right) - 6y\\dfrac{dy}{dx} = 0$<br><br>Dividing by $2$ and rearranging terms:<br><br>$x + y + (x - 3y)\\dfrac{dy}{dx} = 0$<br><br>$\\dfrac{dy}{dx} = \\dfrac{-(x + y)}{x - 3y}$<br><br>At the point $(2, 2)$, the slope of the tangent is:<br><br>$\\dfrac{dy}{dx} = \\dfrac{-(2 + 2)}{2 - 3(2)} = \\dfrac{-4}{-4} = 1$<br><br>The slope of the normal is the negative reciprocal of the slope of the tangent:<br><br>$m = -1$<br><br>The equation of the normal at $(2, 2)$ is:<br><br>$y - 2 = -1(x - 2)$<br><br>$x + y - 4 = 0$<br><br>The length of the perpendicular drawn from the origin $(0, 0)$ to the normal is:<br><br>$d = \\dfrac{|0 + 0 - 4|}{\\sqrt{1^2 + 1^2}} = \\dfrac{4}{\\sqrt{2}} = 2\\sqrt{2}$ units<br><br>Answer: $2 \\sqrt{2}$ units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba1bf9280d7f9932b0f", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The combined equation of the tangent and normal to the curve $x y=100$ at the point $(5,20)$ is ________.", "image": null}, "options": [{"id": "wCTQ1", "text": "$15 x^2-15 y^2+16 x y=480$", "image": null, "isCorrect": false}, {"id": "kTLr4", "text": "$15 x^2+16 x y-198 x+10 y+480-15 y^2=0$", "image": null, "isCorrect": false}, {"id": "px3iL", "text": "$15 x^2-16 x y+19 x-10 y-480+15 y^2=0$", "image": null, "isCorrect": false}, {"id": "89rfR", "text": "None of these", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given the equation of the curve: $xy = 100$<br><br>Differentiating with respect to $x$, we get:<br>$y + x \\dfrac{dy}{dx} = 0 \\implies \\dfrac{dy}{dx} = -\\dfrac{y}{x}$<br><br>At the point $(5, 20)$, the slope of the tangent is:<br>$m_1 = -\\dfrac{20}{5} = -4$<br><br>The slope of the normal is:<br>$m_2 = -\\dfrac{1}{m_1} = \\dfrac{1}{4}$<br><br>The equation of the tangent at $(5, 20)$ is:<br>$y - 20 = -4(x - 5)$<br>$4x + y - 40 = 0$<br><br>The equation of the normal at $(5, 20)$ is:<br>$y - 20 = \\dfrac{1}{4}(x - 5)$<br>$x - 4y + 75 = 0$<br><br>The combined equation of the tangent and normal is given by the product of their individual equations:<br>$(4x + y - 40)(x - 4y + 75) = 0$<br><br>Expanding the product:<br>$4x(x - 4y + 75) + y(x - 4y + 75) - 40(x - 4y + 75) = 0$<br>$4x^2 - 16xy + 300x + xy - 4y^2 + 75y - 40x + 160y - 3000 = 0$<br>$4x^2 - 15xy - 4y^2 + 260x + 235y - 3000 = 0$<br><br>Since this equation does not match any of the given options, the correct choice is 'None of these'.<br><br>Answer: None of these", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871ba1bf9280d7f9932b0d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the line $\\mathrm{a} x+$ by $+\\mathrm{c}=0$ is normal to the curve $x \\mathrm{y}=1$, then", "image": null}, "options": [{"id": "zqMnL", "text": "$a>0, \\quad b>0$", "image": null, "isCorrect": false}, {"id": "f0L4K", "text": "$a>0, \\quad b < 0$", "image": null, "isCorrect": true}, {"id": "qY19O", "text": "$a < 0, \\quad b \\geqslant 0$", "image": null, "isCorrect": false}, {"id": "q0nAi", "text": "$a < 0, \\quad b < 0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of the curve is $xy = 1$.<br><br>Differentiating with respect to $x$, we get:<br><br>$x \\dfrac{dy}{dx} + y = 0 \\Rightarrow \\dfrac{dy}{dx} = -\\dfrac{y}{x}$<br><br>Substituting $y = \\dfrac{1}{x}$, the slope of the tangent is:<br><br>$m_T = -\\dfrac{1}{x^2}$<br><br>The slope of the normal to the curve is:<br><br>$m_N = -\\dfrac{1}{m_T} = x^2$<br><br>For any point on the curve $xy = 1$, $x \\neq 0$. Therefore, $x^2 > 0$, which means the slope of the normal is always strictly positive.<br><br>The given equation of the normal line is $ax + by + c = 0$.<br><br>The slope of this line is $-\\dfrac{a}{b}$.<br><br>Equating the slopes, we get:<br><br>$-\\dfrac{a}{b} > 0 \\Rightarrow \\dfrac{a}{b} < 0$<br><br>This implies that $a$ and $b$ must have opposite signs, and $b \\neq 0$.<br><br>Checking the given options, the condition $a > 0$ and $b < 0$ satisfies $\\dfrac{a}{b} < 0$.<br><br>Answer: $a>0, \\quad b < 0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b91bf9280d7f9932a72", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A particle moves along a curve $y=\\frac{2 x^3-1}{3}$. The points on the curve at which the $y$ co-ordinate is changing 18 times the $x$ co-ordinate are", "image": null}, "options": [{"id": "0KoI1", "text": "$\\left(-3,-\\frac{55}{3}\\right),\\left(3,-\\frac{53}{3}\\right)$", "image": null, "isCorrect": false}, {"id": "2nOsY", "text": "$\\left(-3, \\frac{53}{3}\\right),\\left(3, \\frac{55}{3}\\right)$", "image": null, "isCorrect": false}, {"id": "zJcL0", "text": "$\\left(-3,-\\frac{53}{3}\\right),\\left(3, \\frac{55}{3}\\right)$", "image": null, "isCorrect": false}, {"id": "W2t2E", "text": "$\\left(-3,-\\frac{55}{3}\\right),\\left(3, \\frac{53}{3}\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given the equation of the curve:<br><br>$y = \\dfrac{2x^3 - 1}{3}$<br><br>Differentiating with respect to time $t$, we get:<br><br>$\\dfrac{dy}{dt} = \\dfrac{d}{dx}\\left(\\dfrac{2x^3 - 1}{3}\\right) \\dfrac{dx}{dt}$<br><br>$\\dfrac{dy}{dt} = 2x^2 \\dfrac{dx}{dt}$<br><br>It is given that the $y$ co-ordinate is changing 18 times as fast as the $x$ co-ordinate, so:<br><br>$\\dfrac{dy}{dt} = 18 \\dfrac{dx}{dt}$<br><br>Substituting this into the derivative equation:<br><br>$18 \\dfrac{dx}{dt} = 2x^2 \\dfrac{dx}{dt}$<br><br>$2x^2 = 18$<br><br>$x^2 = 9$<br><br>$x = \\pm 3$<br><br>Now, finding the corresponding $y$ co-ordinates:<br><br>For $x = 3$:<br><br>$y = \\dfrac{2(3)^3 - 1}{3} = \\dfrac{54 - 1}{3} = \\dfrac{53}{3}$<br><br>For $x = -3$:<br><br>$y = \\dfrac{2(-3)^3 - 1}{3} = \\dfrac{-54 - 1}{3} = -\\dfrac{55}{3}$<br><br>The required points on the curve are $\\left(-3, -\\dfrac{55}{3}\\right)$ and $\\left(3, \\dfrac{53}{3}\\right)$.<br><br>Answer: $\\left(-3,-\\frac{55}{3}\\right),\\left(3, \\frac{53}{3}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b91bf9280d7f9932a6d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The point on the curve $4 y^2-4 y+2 x-1=0$ at which the tangent becomes parallel toY-axis is", "image": null}, "options": [{"id": "4FATD", "text": "$\\left(1, \\frac{1}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "oT9d6", "text": "$\\left(\\frac{1}{2}, 1\\right)$", "image": null, "isCorrect": false}, {"id": "G2LRd", "text": "$\\left(-1,-\\frac{1}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "Y9BxQ", "text": "$\\left(\\frac{1}{2}, 0\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the given curve is $4y^2 - 4y + 2x - 1 = 0$.<br><br>Differentiating both sides with respect to $y$, we get:<br><br>$8y - 4 + 2\\dfrac{dx}{dy} = 0$<br><br>$\\dfrac{dx}{dy} = 2 - 4y$<br><br>For the tangent to be parallel to the Y-axis, its slope must be infinite, which means $\\dfrac{dx}{dy} = 0$.<br><br>$2 - 4y = 0 \\Rightarrow y = \\dfrac{1}{2}$<br><br>Substituting $y = \\dfrac{1}{2}$ into the equation of the curve:<br><br>$4\\left(\\dfrac{1}{2}\\right)^2 - 4\\left(\\dfrac{1}{2}\\right) + 2x - 1 = 0$<br><br>$1 - 2 + 2x - 1 = 0$<br><br>$2x = 2 \\Rightarrow x = 1$<br><br>The required point is $\\left(1, \\dfrac{1}{2}\\right)$.<br><br>Answer: $\\left(1, \\frac{1}{2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f76", "heldOn": "2025-04-23T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 1)", "title": "MHT CET 2025 (23 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b81bf9280d7f99329dd", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The normal to the curve $x=9(1+\\cos \\theta), \\mathrm{y}=9 \\sin \\theta$ at $\\theta$ always passes through the fixed point", "image": null}, "options": [{"id": "MKTaQ", "text": "$(9,0)$", "image": null, "isCorrect": true}, {"id": "u1Qd4", "text": "$(8,9)$", "image": null, "isCorrect": false}, {"id": "kQR34", "text": "$(0,9)$", "image": null, "isCorrect": false}, {"id": "cICEB", "text": "$(9,8)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given parametric equations of the curve are $x = 9(1 + \\cos \\theta)$ and $y = 9 \\sin \\theta$.<br><br>Rewriting these equations, we get:<br>$x - 9 = 9 \\cos \\theta$<br>$y = 9 \\sin \\theta$<br><br>Squaring and adding both equations, we obtain:<br>$(x - 9)^2 + y^2 = 81(\\cos^2 \\theta + \\sin^2 \\theta)$<br>$(x - 9)^2 + y^2 = 81$<br><br>This is the equation of a circle with its center at $(9, 0)$ and a radius of $9$.<br><br>Since the normal to any point on a circle always passes through its center, the normal to the given curve will always pass through the fixed point $(9, 0)$.<br><br>Answer: $(9,0)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b40bf9280d7f9932784", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the curve $y=a x^2-6 x+b$ passes through $(0,4)$ and has its tangent parallel to the x -axis at $x=\\frac{3}{2}$, then the value of $a$ and b respectively are", "image": null}, "options": [{"id": "z7F7b", "text": "$-2,-4$", "image": null, "isCorrect": false}, {"id": "3CkMZ", "text": "2, 4", "image": null, "isCorrect": true}, {"id": "eAVqE", "text": "$-2,4$", "image": null, "isCorrect": false}, {"id": "n9h8T", "text": "$2,-4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the curve is given by $y = a x^2 - 6 x + b$.<br><br>Since the curve passes through the point $(0, 4)$, we substitute $x = 0$ and $y = 4$ into the equation:<br><br>$4 = a(0)^2 - 6(0) + b$<br><br>$b = 4$<br><br>The tangent to the curve is parallel to the x-axis at $x = \\dfrac{3}{2}$, which means the derivative $\\dfrac{dy}{dx}$ is zero at $x = \\dfrac{3}{2}$.<br><br>Differentiating the equation of the curve with respect to $x$:<br><br>$\\dfrac{dy}{dx} = 2ax - 6$<br><br>Substituting $x = \\dfrac{3}{2}$ and $\\dfrac{dy}{dx} = 0$:<br><br>$0 = 2a\\left(\\dfrac{3}{2}\\right) - 6$<br><br>$3a - 6 = 0$<br><br>$3a = 6$<br><br>$a = 2$<br><br>Thus, the values of $a$ and $b$ are $2$ and $4$ respectively.<br><br>Answer: 2, 4", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f71", "heldOn": "2025-04-20T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 2)", "title": "MHT CET 2025 (20 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b2abf9280d7f99326d8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the curves $y^2=6 x$ and $9 x^2+$ by $^2=16$ intersect each other at right angles, then the value of b is", "image": null}, "options": [{"id": "ImGe1", "text": "$4$", "image": null, "isCorrect": false}, {"id": "dp5BT", "text": "$\\frac{7}{2}$", "image": null, "isCorrect": false}, {"id": "x445b", "text": "$6$", "image": null, "isCorrect": false}, {"id": "hcboG", "text": "$\\frac{9}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given equations of the curves are $y^2 = 6x$ and $9x^2 + by^2 = 16$.<br><br>Let the point of intersection be $(x_1, y_1)$.<br><br>Differentiating $y^2 = 6x$ with respect to $x$, we get:<br>$2y \\dfrac{dy}{dx} = 6 \\Rightarrow \\dfrac{dy}{dx} = \\dfrac{3}{y}$<br>The slope of the tangent to the first curve at $(x_1, y_1)$ is $m_1 = \\dfrac{3}{y_1}$.<br><br>Differentiating $9x^2 + by^2 = 16$ with respect to $x$, we get:<br>$18x + 2by \\dfrac{dy}{dx} = 0 \\Rightarrow \\dfrac{dy}{dx} = -\\dfrac{9x}{by}$<br>The slope of the tangent to the second curve at $(x_1, y_1)$ is $m_2 = -\\dfrac{9x_1}{by_1}$.<br><br>Since the curves intersect at right angles, their tangents are perpendicular, so $m_1 m_2 = -1$.<br>$\\left(\\dfrac{3}{y_1}\\right) \\left(-\\dfrac{9x_1}{by_1}\\right) = -1$<br><br>$\\dfrac{27x_1}{by_1^2} = 1$<br><br>$by_1^2 = 27x_1$<br><br>Since $(x_1, y_1)$ lies on the first curve, we have $y_1^2 = 6x_1$. Substituting this into the above equation:<br>$b(6x_1) = 27x_1$<br><br>Since the point of intersection cannot be the origin (as $(0,0)$ does not satisfy $9x^2 + by^2 = 16$), $x_1 \\neq 0$. Dividing by $x_1$ gives:<br>$6b = 27$<br><br>$b = \\dfrac{27}{6} = \\dfrac{9}{2}$<br><br>Answer: $\\frac{9}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b2abf9280d7f99326d2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The shortest distance between the line $y-x=1$ and the curve $x=y^2$ is", "image": null}, "options": [{"id": "Qv1YN", "text": "$\\frac{3 \\sqrt{2}}{8}$", "image": null, "isCorrect": true}, {"id": "KPAcc", "text": "$\\frac{2 \\sqrt{3}}{8}$", "image": null, "isCorrect": false}, {"id": "h8Plh", "text": "$\\frac{3 \\sqrt{2}}{5}$", "image": null, "isCorrect": false}, {"id": "R9r2v", "text": "$\\frac{\\sqrt{3}}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The shortest distance between a curve and a line is the perpendicular distance from the point on the curve where the tangent is parallel
