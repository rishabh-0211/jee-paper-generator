:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261cd0279619d9d8a2f73", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "Let $f^{\\prime}(0)=-3$ and $f^{\\prime}(x) \\leq 5$ for all real values of $x$. The $\\mathrm{f}(2)$ can have possible maximum value as", "image": null}, "options": [{"id": "k37kQ", "text": "10", "image": null, "isCorrect": false}, {"id": "zCnCZ", "text": "5", "image": null, "isCorrect": false}, {"id": "pURND", "text": "7", "image": null, "isCorrect": true}, {"id": "OcIcg", "text": "13", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Applying Lagrange's mean value theorem on interval $[0,2]$, we get there exist atleast one ' $c$ ' $\\in(0,2)$ such that\n$\\begin{array}{ll} \n& \\frac{\\mathrm{f}(2)-\\mathrm{f}(0)}{2-0}=\\mathrm{f}^{\\prime}(\\mathrm{c}) \\\\\n\\therefore & \\mathrm{f}(2)-\\mathrm{f}(0)=2 \\mathrm{f}^{\\prime}(\\mathrm{c}) \\\\\n\\therefore & \\mathrm{f}(2)=\\mathrm{f}(0)+2 \\mathrm{f}^{\\prime}(\\mathrm{c}) \\\\\n\\therefore & \\mathrm{f}(2)=-3+2 \\mathrm{f}^{\\prime}(\\mathrm{c})\n\\end{array}$\nGiven that $\\mathrm{f}^{\\prime}(x) \\leq 5$ for all $x$\n$\\begin{array}{ll}\n\\therefore & \\mathrm{f}(2) \\leq-3+10 \\\\\n\\therefore & \\mathrm{f}(2) \\leq 7\n\\end{array}$\n$\\therefore \\quad$ Largest possible value of $\\mathrm{f}(2)$ is 7 .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c80279619d9d8a2f50", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "The maximum value of the function $f(x)=3 x^3-18 x^2+27 x-40$ on the set $\\mathrm{S}=\\left\\{x \\in \\mathbb{R} / x^2+30 \\leq 11 x\\right\\}$ is", "image": null}, "options": [{"id": "QDMIl", "text": "122", "image": null, "isCorrect": true}, {"id": "TpBnR", "text": "132", "image": null, "isCorrect": false}, {"id": "gNxB4", "text": "112", "image": null, "isCorrect": false}, {"id": "cDP5W", "text": "222", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\mathrm{S}=\\left\\{x \\in \\mathbb{R} / x^2+30 \\leq 11 x\\right\\} \\\\\n& x^2+30 \\leq 11 x \\\\\n& x^2-11 x+30 \\leq 0 \\\\\n& (x-5)(x-6) \\leq 0 \\\\\n& x \\in[5,6]\n\\end{aligned}$\nNow, $\\mathrm{f}(x)=3 x^3-18 x^2+27 x-40$\n$\\begin{aligned}\n\\mathrm{f}^{\\prime}(x) & =9 x^2-36 x+27 \\\\\n\\mathrm{f}^{\\prime}(x) & =9\\left(x^2-4 x+3\\right) \\\\\n& =9\\left[\\left(x^2-4 x+4\\right)-1\\right] \\\\\n& =9(x-2)^2-9\n\\end{aligned}$\n$\\therefore \\quad \\mathrm{f}^{\\prime}(x)>0 \\forall x \\in[5,6]$\n$\\therefore \\mathrm{f}(x)$ is strictly increasing in the interval $[5,6]$\n$\\therefore \\quad$ Maximum value of $\\mathrm{f}(x)$ when $x \\in[5,6]$ is\n$f(6)=122$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c80279619d9d8a2f4f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "The range of values of $x$ for which $f(x)=x^3+6 x^2-36 x+7$ is increasing in", "image": null}, "options": [{"id": "Bhx5E", "text": "$(-\\infty,-6) \\cup(2, \\infty)$", "image": null, "isCorrect": true}, {"id": "rtGdn", "text": "$(-6,2)$", "image": null, "isCorrect": false}, {"id": "26AQj", "text": "$(-\\infty,-2) \\cup(6, \\infty)$", "image": null, "isCorrect": false}, {"id": "Ss2JJ", "text": "$(-6,2]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n\\mathrm{f}(x) & =x^3+6 x^2-36 x+7 \\\\\n\\mathrm{f}^{\\prime}(x) & =3 x^2+12 x-36 \\\\\n& =3\\left(x^2+4 x-12\\right)\n\\end{aligned}$\nFor $\\mathrm{f}(x)$ to be increasing,\n$\\begin{aligned}\n& \\mathrm{f}^{\\prime}(x)>0 \\\\\n& \\Rightarrow 3\\left(x^2+4 x-12\\right)>0 \\\\\n& \\Rightarrow x^2+4 x-12>0 \\\\\n& \\Rightarrow(x+6)(x-2)>0 \\\\\n& \\Rightarrow x \\in(-\\infty,-6) \\cup(2, \\infty)\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c80279619d9d8a2f4d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "The equation $x^3+x-1=0$ has", "image": null}, "options": [{"id": "oPZP0", "text": "no real root.", "image": null, "isCorrect": false}, {"id": "G0A2i", "text": "exactly two real roots.", "image": null, "isCorrect": false}, {"id": "Fwk1P", "text": "exactly one real root.", "image": null, "isCorrect": true}, {"id": "ssys4", "text": "all three real roots.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation $x^3+x-1=0$\nLet $\\mathrm{f}(x)=x^3+x-1$\n$\\begin{array}{ll}\n\\therefore \\quad & \\mathrm{f}^{\\prime}(x)=3 x^2+1 \\\\\n& \\Rightarrow \\mathrm{f}^{\\prime}(x)>0 \\forall x \\in \\mathrm{R}\n\\end{array}$\n$\\Rightarrow \\mathrm{f}(x) \\text { is increasing }$\n$\\therefore \\quad$ for $x_2>x_1, \\mathrm{f}\\left(x_2\\right)>\\mathrm{f}\\left(x_1\\right)$\nNow, $\\mathrm{f}(0)=-1$ and $\\mathrm{f}(1)=1$\n$\\therefore \\quad \\mathrm{f}(x)=0$ for some $x \\in(0,1)$\n$\\therefore \\quad$ Equation has one real root.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b60279619d9d8a2ebb", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "The maximum value of $x y$ when $x+2 y=8$ is", "image": null}, "options": [{"id": "a3j6x", "text": "20", "image": null, "isCorrect": false}, {"id": "B5Taq", "text": "16", "image": null, "isCorrect": false}, {"id": "I1tgt", "text": "24", "image": null, "isCorrect": false}, {"id": "DTt0O", "text": "8", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& x+2 y=8 \\\\\n\\therefore \\quad & 2 y=8-x \\\\\n\\therefore \\quad & y=\\frac{8-x}{2}\n\\end{aligned}$\nLet $\\mathrm{f}(x)=x y$\n$\\therefore \\quad \\mathrm{f}(x)=x \\cdot \\frac{(8-x)}{2}$\nDifferentiating w.r.t $x$, we get\n$\\begin{aligned}\n\\mathrm{f}^{\\prime}(x) & =\\frac{(8-x)-x}{2} \\\\\n\\mathrm{f}^{\\prime}(x) & =4-x\n\\end{aligned}$\nTo find critical points,\n$\\begin{array}{ll} \n& \\mathrm{f}^{\\prime}(x)=0 \\\\\n\\therefore \\quad & 4-x=0 \\\\\n\\therefore \\quad & x=4\n\\end{array}$\ncritical point at $x=4$\n$\\therefore \\quad \\mathrm{f}(4)=\\frac{4(8-4)}{2}=8$\n$\\therefore \\quad$ Maximum value of the given function is 8 .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2616b0279619d9d8a2c67", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "Let $A D$ and $B C$ be two vertical poles at $A$ and $B$ respectively on a horizontal ground. If $A D=8 \\mathrm{~m}, B C=11 \\mathrm{~m}$ and $A B=10 \\mathrm{~m}$, then the distance (in meters) of point $M$ on $A B$ from the point $A$ such that $M D^2+M C^2$ is minimum, is", "image": null}, "options": [{"id": "gJTpK", "text": "8", "image": null, "isCorrect": false}, {"id": "RfyN7", "text": "5", "image": null, "isCorrect": true}, {"id": "dvZR5", "text": "4", "image": null, "isCorrect": false}, {"id": "D5mXN", "text": "7", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/PpP9zurAtGCtDPPwPGmudGM2OR1d11e4vyffOVL8T-k.original.fullsize.png\"><br>\n$\\begin{aligned} & f(x)=M D^2+M C^2 \\\\ & \\Rightarrow f(x)=x^2+8^2+(10-x)^2+11^2 \\\\ & \\Rightarrow f^{\\prime}(x)=2 x-2(10-x) \\\\ & \\Rightarrow f^{\\prime}(x)=4 x-20 \\\\ & \\text { for } f(x) \\text { to be minimum } x=5\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2616a0279619d9d8a2c5d", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}], "question": {"text": "On the interval $[0,1]$, the function $x^{25}(1-x)^{75}$ takes its maximum value at the point", "image": null}, "options": [{"id": "QJdnL", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": false}, {"id": "TKfFE", "text": "0", "image": null, "isCorrect": false}, {"id": "EKo9c", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": true}, {"id": "qHXNh", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & f(x)=x^{25}(1-x)^{75} \\\\ & \\Rightarrow f^{\\prime}(x)=25 x^{24}(1-x)^{75}-x^{25} \\cdot 75(1-x)^{74} \\\\ & =25 \\cdot x^{24} \\cdot(1-x)^{74}(1-4 x)\\end{aligned}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/VA_yVD8Dlh4Nswo-TaqtorByKiCO1Cn1Br-UZF915lI.original.fullsize.png\"><br>\n$\\begin{aligned} & \\Rightarrow f(x) \\text { takes maximum value at } x=\\frac{1}{4} \\\\ & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T14:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 2)", "title": "MHT CET 2022 (08 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261580279619d9d8a2bd1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}], "question": {"text": "The function, $f(x)=x \\sqrt{1-x}$, where $x \\in(0,1)$, has local maximum at $x=$", "image": null}, "options": [{"id": "1Xw2y", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": false}, {"id": "e3N4A", "text": "$\\frac{1}{4}$", "image": null, "isCorrect": false}, {"id": "e16nF", "text": "$\\frac{2}{3}$", "image": null, "isCorrect": true}, {"id": "OanGW", "text": "$\\frac{3}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& f(x)=x \\sqrt{1-x} \\\\\n& \\Rightarrow f^{\\prime}(x)=1 \\sqrt{1-x}+\\frac{x}{2 \\sqrt{1-x}} x(-1)=\\frac{2-3 x}{2 \\sqrt{1-x}}\n\\end{aligned}$\nsign scheme of $f^{\\prime}(x)$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/cK1GaDRWiWCwB3sWp09-j1UOeoLnCEfeBrZcAfRjzIM.original.fullsize.png\"><br>\nHence, local maxima at $x=\\frac{2}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-08T09:00:00.000Z", "isVisible": true, "shortName": "2022 (08 Aug Shift 1)", "title": "MHT CET 2022 (08 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2610d0279619d9d8a296b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "Local maximum and local minimum values respectively of the function $f(x)=(x-1)(x+2)^2$ are", "image": null}, "options": [{"id": "Etqtt", "text": "$-4,0$", "image": null, "isCorrect": false}, {"id": "jDx3D", "text": "$0,-4$", "image": null, "isCorrect": true}, {"id": "3M2iM", "text": "$-4,4$", "image": null, "isCorrect": false}, {"id": "T6qEa", "text": "$4,-4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & f(x)=(x-1)(x+2)^2 \\\\ & f^{\\prime}(x)=(x+2)^2+(x-1) 2(x+2)=(x+2)(x+2+2 x-2)=3 x(x+2) \\\\ & \\stackrel{+}{+}-0_{-2}^{+} \\\\ & f_{\\max }=f(-2)=0 \\\\ & f_{\\min }=f(0)=-4\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260e90279619d9d8a2849", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}], "question": {"text": "The maximum value of the function $f(x)=3 x^3-18 x 2+27 x-40$ on the set $S=\\left\\{x \\in R x^2+30 \\leq 11 x\\right\\}$ is", "image": null}, "options": [{"id": "OrCiO", "text": "$122$", "image": null, "isCorrect": true}, {"id": "7shLd", "text": "$222$", "image": null, "isCorrect": false}, {"id": "VuY6e", "text": "$810$", "image": null, "isCorrect": false}, {"id": "Dlqd1", "text": "$162$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & f(x)=3 x^3-18 x^2+27 x-40 \\\\ & \\Rightarrow f^{\\prime}(x)=9 x^2-36 x+27 \\\\ & =9(x-1)(x-3)\\end{aligned}$\nSign scheme for $f^{\\prime}(x)$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/wbQMkti8OhmQVWaBrMn9VsI5H6FOdmgyb-Co2SDJW94.original.fullsize.png\">\nNow, $x^2+30 \\leq 11 x$\n$\\begin{aligned} & \\Rightarrow(x-5)(x-6) \\leq 0 \\\\ & \\Rightarrow x \\in[5,6]\\end{aligned}$\nFor the interval $[5,6] f(x)$ is increasing\nHence $f_{\\max }=f(6)$\n$\\forall x \\in[5,6]$ i.e. on the set S\n$=3 \\times 6^3-18 \\times 6^2+27 \\times 6-40=122$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T09:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 1)", "title": "MHT CET 2022 (05 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260d70279619d9d8a27b8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "The minimum value of the function $f(x)=x \\log x$ is", "image": null}, "options": [{"id": "Wm6MA", "text": "-e", "image": null, "isCorrect": false}, {"id": "S9ywL", "text": "e", "image": null, "isCorrect": false}, {"id": "8VFxL", "text": "$\\frac{1}{\\mathrm{e}}$", "image": null, "isCorrect": false}, {"id": "O49oC", "text": "$-\\frac{1}{\\mathrm{e}}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$f(x)=x \\log x$\n$\\therefore \\quad \\mathrm{f}^{\\prime}(\\mathrm{x})=\\frac{\\mathrm{x}}{\\mathrm{x}}+\\log \\mathrm{x}=1+\\log \\mathrm{x}$\nWhen $1+\\log \\mathrm{x}=0 \\Rightarrow \\mathrm{x}=\\frac{1}{\\mathrm{e}}$\n$\\mathrm{f}^{\\prime \\prime}(\\mathrm{x})=\\frac{1}{\\mathrm{x}} \\Rightarrow\\left[\\mathrm{f}^{\\prime \\prime}(\\mathrm{x})\\right]_{\\mathrm{x}=\\frac{1}{\\mathrm{e}}}=\\mathrm{e}>0$\nThus $\\mathrm{f}(\\mathrm{x})$ is minimum at $\\mathrm{x}=\\frac{1}{\\mathrm{e}}$ and\n$f(x)=\\left(\\frac{1}{e}\\right) \\log \\left(\\frac{1}{e}\\right)=\\frac{-1}{e}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c40279619d9d8a2721", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "For all real $x$, the minimum value of the function $f(x)=\\frac{1-x+x^2}{1+x+x^2}$ is", "image": null}, "options": [{"id": "Nf02j", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": true}, {"id": "OsEEc", "text": "0", "image": null, "isCorrect": false}, {"id": "VmvlG", "text": "3", "image": null, "isCorrect": false}, {"id": "S9nED", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $f(x)=\\frac{1-x+x^2}{1+x+x^2}$\n$$\nf^{\\prime}(x)=\\frac{\\left(1+x+x^2\\right)(2 x-1)-\\left(1-x+x^2\\right)(2 x+1)}{\\left(1+x+x^2\\right)^2}\n$$\n$$\n=\\frac{\\left(2 x+2 x^2+2 x^3-x-1-x^2\\right)-\\left(2 x-2 x^2+2 x^3+1-x+x^2\\right)}{\\left(1+x+x^2\\right)^2}\n$$\n$$\n=\\frac{\\left(x+x^2+2 x^3-1\\right)-\\left(x-x^2+2 x^3+1\\right)}{\\left(1+x+x^2\\right)^2}\n$$\n$=\\frac{2 x^2-2}{\\left(1+x+x^2\\right)^2}$ and when $f^{\\prime}(x)=0$, we get\n$$\n2\\left(\\mathrm{x}^2-1\\right)=0 \\Rightarrow \\mathrm{x}= \\pm 1\n$$\nWhen $x=1, f(x)=\\frac{1}{3}$ and when $x=-1, f(x)=3$\nHence minimum value of $f(x)$ is $\\frac{1}{3}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b50279619d9d8a26a9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "If $x=-2$ and $x=4$ are the extreme points of $y=x^3-\\alpha x^2-\\beta x+5$, then", "image": null}, "options": [{"id": "oCQij", "text": "$\\alpha=3, \\beta=24$", "image": null, "isCorrect": true}, {"id": "ELtAs", "text": "$\\alpha=-24m \\beta=-3$", "image": null, "isCorrect": false}, {"id": "51QdQ", "text": "$\\alpha=-3, \\beta=-24$", "image": null, "isCorrect": false}, {"id": "zNrgS", "text": "$\\alpha=24 \\beta, \\beta=3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& y=x^3-\\alpha x^2-\\beta x+5 \\\\\n& \\therefore \\frac{d y}{d x}=3 x^2-2 \\alpha x-\\beta\n\\end{aligned}\n$$\nWe have $\\mathrm{x}=-2$ and $\\mathrm{x}=4$ as extreme points.\n$$\n\\begin{aligned}\n& \\therefore\\left(\\frac{d y}{d x}\\right)_{x=-2}=3(-2)^2-2 \\alpha(-2)-\\beta=0 \\\\\n& \\therefore 12+4 \\alpha-\\beta=0 \\Rightarrow 4 \\alpha-\\beta=-12 \\\\\n& \\left(\\frac{d y}{d x}\\right)_{x=4}=3(4)^2-2 \\alpha(4)-\\beta=0 \\\\\n& \\therefore 48-8 \\alpha-\\beta=0 \\Rightarrow 8 \\alpha+\\beta=48\n\\end{aligned}\n$$\nSolving eq. (1) and (2), we get $\\alpha=3, \\beta=24$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b10279619d9d8a268d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "10 is divided into two parts such that the sum of double of the first and square of the other is minimum, then the numbers are respectively", "image": null}, "options": [{"id": "pPWL4", "text": "9,1", "image": null, "isCorrect": true}, {"id": "F4zQj", "text": "8,2", "image": null, "isCorrect": false}, {"id": "rcswF", "text": "6,4", "image": null, "isCorrect": false}, {"id": "gkkhG", "text": "7,3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the two parts of 10 be $x$ and $(10-x)$.\n$$\nf(x)=2(10-x)+x^2=x^2-2 x+20\n$$\n$f^{\\prime}(x)=2 x-2$ and when $f^{\\prime}(x)=0$, we get $x=1$\n$$\n\\mathrm{f}^{\\prime \\prime}(\\mathrm{x})=2>0\n$$\n$\\therefore \\mathrm{f}(\\mathrm{x})$ is minimum at $\\mathrm{x}=1$.\nThus the parts are 1,9 .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2609c0279619d9d8a25e2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "The maximum area of the rectangle that can be inscribed in a circle of radius $r$ is", "image": null}, "options": [{"id": "7O4LR", "text": "$2 r^2$ sq. units", "image": null, "isCorrect": true}, {"id": "cbh1M", "text": "$\\frac{\\pi \\mathrm{r}^2}{4}$ sq. units", "image": null, "isCorrect": false}, {"id": "h6kqt", "text": "$\\pi \\mathrm{r}^2$ units", "image": null, "isCorrect": false}, {"id": "HZZvK", "text": "$r^3 \\text { sq units }$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Refer figure\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/2ElFZUUvUg7grMYjJoBdvMS5v8_dyvdR5NQpUVBIZ_M.original.fullsize.png\"><br>\n$$\n\\begin{aligned}\n& \\mathrm{B}=(\\mathrm{r} \\cos \\theta, \\mathrm{r} \\sin \\theta) \\\\\n& \\therefore \\mathrm{Ab} 2 \\mathrm{r} \\cos \\theta \\text { and } \\mathrm{BC}=2 \\mathrm{r} \\sin \\theta \\\\\n& \\text { Area }(\\mathrm{ABCD})=\\mathrm{AB} \\times \\mathrm{BC} \\\\\n& \\therefore \\mathrm{f}(\\theta)=(2 \\mathrm{r} \\cos \\theta)(2 \\mathrm{r} \\sin \\theta)=2 \\mathrm{r}^2 \\sin 2 \\theta \\\\\n& \\mathrm{f}^{\\prime}(\\theta)=4 \\mathrm{r}^2 \\cos 2 \\theta \\text { and when } \\mathrm{f}^{\\prime}(\\theta)=0 \\text {, we write } \\\\\n& \\cos 2 \\theta=0 \\Rightarrow \\cos 2 \\theta=\\cos \\frac{\\pi}{2} \\Rightarrow \\theta=\\frac{\\pi}{4} \\\\\n& \\mathrm{f}^{\\prime \\prime}(\\theta)=-8 \\mathrm{r}^2 \\sin 2 \\theta \\text { and } \\mathrm{f}^{\\prime \\prime}(\\theta)_{\\left[\\theta=\\frac{\\pi}{4}\\right]}=-8 \\mathrm{r}^2 < 0 \\backslash\n\\end{aligned}\n$$\nThus, area of required rectangle is maximum when $\\theta=\\frac{\\pi}{4}$\n$$\n\\begin{aligned}\n& \\therefore \\mathrm{AB}=2 \\mathrm{r} \\cos \\frac{\\pi}{4}=2 \\mathrm{r}\\left(\\frac{1}{\\sqrt{2}}\\right)=\\sqrt{2} \\mathrm{r} \\text { and } \\\\\n& \\mathrm{BC}=2 \\mathrm{r} \\sin \\frac{\\pi}{4}=2 \\mathrm{r}\\left(\\frac{1}{\\sqrt{2}}\\right)=\\sqrt{2} \\mathrm{r}\n\\end{aligned}\n$$\n$\\therefore$ Maximum Area $(\\mathrm{ABCD})==(\\sqrt{2} \\mathrm{r})(\\sqrt{2} \\mathrm{r})=2 \\mathrm{r}^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2608f0279619d9d8a257b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "The slant height of a right circular cone is $3 \\mathrm{~cm}$. The height of the cone for maximum volume is", "image": null}, "options": [{"id": "REHbX", "text": "$5 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "Km09W", "text": "$\\sqrt{5} \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "ywxJj", "text": "$3 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "9wZjl", "text": "$\\sqrt{3} \\mathrm{~cm}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Volume of cone $=\\frac{1}{3} \\pi \\mathrm{r}^2 \\mathrm{~h}$\nWe have slant height $\\ell=3 \\mathrm{~cm}$ and we know that $\\ell^2=\\mathrm{r}^2+\\mathrm{h}^2$\n$$\n\\begin{aligned}\n& \\therefore 9=\\mathrm{r}^2+\\mathrm{h}^2 \\Rightarrow \\mathrm{r}^2=9-\\mathrm{h}^2 \\\\\n& \\therefore \\mathrm{v}=\\frac{1}{3} \\pi\\left(9-\\mathrm{h}^2\\right) \\mathrm{h}=(3 \\pi) \\mathrm{h}-\\left(\\frac{\\pi}{3}\\right) \\mathrm{h}^3 \\\\\n& \\frac{\\mathrm{dv}}{\\mathrm{dh}}=3 \\pi-\\left(\\frac{\\pi}{3}\\right)\\left(3 \\mathrm{~h}^2\\right)=3 \\pi-\\pi \\mathrm{h}^2\n\\end{aligned}\n$$\nWhen $\\frac{\\mathrm{dv}}{\\mathrm{dh}}=0$, we get $3 \\pi=\\pi \\mathrm{h}^2 \\Rightarrow \\mathrm{h}=\\sqrt{3}$\n$$\n\\frac{\\mathrm{d}^2 \\mathrm{v}}{\\mathrm{dh}^2}=0-2 \\pi \\mathrm{h} \\quad \\Rightarrow\\left(\\frac{\\mathrm{d}^2 \\mathrm{v}}{\\mathrm{dh}^2}\\right)_{\\mathrm{b}-\\sqrt{3}}=-2 \\sqrt{3} \\pi < 0\n$$\n$\\therefore$ Volume of cone is maximum when $\\mathrm{h}=\\sqrt{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2608c0279619d9d8a2563", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "If $f(x)=x^2+a x+b$ has minima at $x=3$ whose value is 5 , then the values of $a$ and $b$ are respectively.", "image": null}, "options": [{"id": "5xPt9", "text": "-6,-14", "image": null, "isCorrect": false}, {"id": "mleX6", "text": "-6,14", "image": null, "isCorrect": true}, {"id": "rfKy2", "text": "14,-6", "image": null, "isCorrect": false}, {"id": "bWfKT", "text": "6,14", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\nf(x)=x^2+a x+b\n$$\n$\\therefore \\mathrm{f}^{\\prime}(\\mathrm{x})=2 \\mathrm{x}+\\mathrm{a}$ and when $\\mathrm{f}^{\\prime}(\\mathrm{x})=0$, we get $\\mathrm{x}=\\frac{-\\mathrm{a}}{2}$\nNow $\\mathrm{f}^{\\prime}(\\mathrm{x})=2$ and $2>0$\n$\\therefore \\mathrm{f}(\\mathrm{x})$ has minima at $\\mathrm{x}=\\frac{-\\mathrm{a}}{2}=3 \\quad \\ldots$ [as per given data]\n$$\n\\therefore \\mathrm{a}=-6\n$$\nSince Minimum value of $f(x)$ is 5 at $x=3$, we write\n$$\n5=(3)^2+(-6)(3)+b \\quad \\Rightarrow b=14\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260770279619d9d8a24ba", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}], "question": {"text": "A rectangle of maximum area is inscribed in an ellipse $\\frac{x^2}{25}+\\frac{y^2}{16}=1$, then its dimensions are", "image": null}, "options": [{"id": "1QI9p", "text": "$4 \\sqrt{2}, 6 \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "oqpDY", "text": "$\\sqrt{2}, 5 \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "tFXZP", "text": "$4 \\sqrt{2}, 5 \\sqrt{2}$", "image": null, "isCorrect": true}, {"id": "3BvBl", "text": "$4 \\sqrt{2}, \\sqrt{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/4-WRcAvsrUmC_IWjB3y5Zh80Hj6M_6zxHfiTtdTbPVk.original.fullsize.png\"><br>\nLength of rectangle $=10 \\cos \\theta$ and\nbreadth of rectangle $=8 \\sin \\theta$\n$\\therefore$ Area of rectangle $=(10 \\cos \\theta)(8 \\sin \\theta)=40(\\sin \\theta)$\nMaximum area will occur when $\\sin 2 \\theta=1$\n$$\n\\begin{aligned}\n& \\therefore \\sin 2 \\theta=\\sin \\frac{\\pi}{2} \\quad \\Rightarrow \\theta=\\frac{\\pi}{4} \\\\\n& \\therefore P=\\left(\\frac{5}{\\sqrt{2}}, \\frac{4}{\\sqrt{2}}\\right) \\Rightarrow \\text { Dimensions of rectangle are } 5 \\sqrt{2}, 4 \\sqrt{2}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260640279619d9d8a2420", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "For all real $\\mathrm{x}$, the minimum value of the function $f(x)=\\frac{1-x+x^2}{1+x+x^2}$ is", "image": null}, "options": [{"id": "r2bL6", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": true}, {"id": "8dLRR", "text": "0", "image": null, "isCorrect": false}, {"id": "PSYi7", "text": "3", "image": null, "isCorrect": false}, {"id": "4I39F", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $f(x)=\\frac{1-x+x^2}{1+x+x^2}$\n$$\nf^{\\prime}(x)=\\frac{\\left(1+x+x^2\\right)(2 x-1)-\\left(1-x+x^2\\right)(2 x+1)}{\\left(1+x+x^2\\right)^2}\n$$\n$$\n=\\frac{\\left(2 x+2 x^2+2 x^3-x-1-x^2\\right)-\\left(2 x-2 x^2+2 x^3+1-x+x^2\\right)}{\\left(1+x+x^2\\right)^2}\n$$\n$$\n=\\frac{\\left(x+x^2+2 x^3-1\\right)-\\left(x-x^2+2 x^3+1\\right)}{\\left(1+x+x^2\\right)^2}\n$$\n$=\\frac{2 x^2-2}{\\left(1+x+x^2\\right)^2}$ and when $f^{\\prime}(x)=0$, we get\n$$\n2\\left(\\mathrm{x}^2-1\\right)=0 \\Rightarrow \\mathrm{x}= \\pm 1\n$$\nWhen $\\mathrm{x}=1, \\mathrm{f}(\\mathrm{x})=\\frac{1}{3}$ and when $\\mathrm{x}=-1, \\mathrm{f}(\\mathrm{x})=3$\nHence minimum value of $f(x)$ is $\\frac{1}{3}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260400279619d9d8a22fa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "If $f(x)=2 x^3-15 x^2-144 x-7$, then $f(x)$ is strictly decreasing in", "image": null}, "options": [{"id": "UNUG2", "text": "$(-8,3)$", "image": null, "isCorrect": false}, {"id": "zedVH", "text": "$(-3,8)$", "image": null, "isCorrect": true}, {"id": "A7PxD", "text": "$(3,8)$", "image": null, "isCorrect": false}, {"id": "PiKLk", "text": "$(-8,-3)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{f}(\\mathrm{x})=2 \\mathrm{x}^3-15 \\mathrm{x}^2-144 \\mathrm{x}-7 \\\\\n& \\mathrm{f}^{\\prime}(\\mathrm{x})=6 \\mathrm{x}^2-30 \\mathrm{x}-144 \\\\\n& \\text { When } \\mathrm{f}^{\\prime}(\\mathrm{x}) < 0, \\text { we get } \\mathrm{x}^2-5 \\mathrm{x}-24 < 0 \\\\\n& \\therefore(\\mathrm{x}-8)(\\mathrm{x}+3) < 0 \\Rightarrow-3 < \\mathrm{x} < 8\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2602d0279619d9d8a2262", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "A wire of length 20 units is divided into two parts such that the product of one part and cube of the other part is maximum, then product of these parts is", "image": null}, "options": [{"id": "9GiTs", "text": "5", "image": null, "isCorrect": false}, {"id": "o8xy6", "text": "75", "image": null, "isCorrect": true}, {"id": "2sQcD", "text": "15", "image": null, "isCorrect": false}, {"id": "TNBBW", "text": "70", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $x$ be the one part and $y$ be the other part.\nWe have $\\mathrm{x}+\\mathrm{y}=20 \\Rightarrow \\mathrm{y}=20-\\mathrm{x}$\nAs per condition given, we write\n$$\n\\begin{aligned}\n& \\mathrm{f}(\\mathrm{x})=(20-\\mathrm{x}) \\mathrm{x}^3 \\\\\n& =20 \\mathrm{x}^3-\\mathrm{x}^4 \\\\\n& \\therefore \\mathrm{f}^{\\prime}(\\mathrm{x})=60 \\mathrm{x}^2-4 \\mathrm{x}^3\n\\end{aligned}\n$$\nWhen $\\mathrm{f}^{\\prime}(\\mathrm{x})$, we get\n$$\n\\begin{aligned}\n& 4 x^2(15-x)=0 \\Rightarrow x=0,15 \\\\\n& f^{\\prime}(x)=120 x-12 x^2 \\\\\n& {\\left[f^{\\prime}(x)\\right]_{x=15}=(120)(15)-(12)(15)^2=-900 < 0}\n\\end{aligned}\n$$\n$\\therefore \\mathrm{f}[\\mathrm{x}]$ is maximum when $\\mathrm{x}=15$.\n$$\n\\therefore \\mathrm{y}=5 \\Rightarrow \\mathrm{xy}=(15)(5)=75\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2601a0279619d9d8a21c8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "If $P$ is a point on the segment $A B$ of length $12 \\mathrm{~cm}$, then the position of $P$ for $A P^{2}+B P^{2}$ to be minimum is such that", "image": null}, "options": [{"id": "T10kR", "text": "$P$ divides $A B$ in the ratio $2: 3$ internally", "image": null, "isCorrect": false}, {"id": "mEmHH", "text": "$P$ divides $A B$ in the ratio $4: 3$ internally", "image": null, "isCorrect": false}, {"id": "M2HCK", "text": "$P$ is the midpoint of segment $A B$", "image": null, "isCorrect": true}, {"id": "vlQyd", "text": "$P$ divides $B A$ in the ratio $2: 1$ internally", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "A\n$\\begin{aligned} \\text { Let } \\mathrm{d}(\\mathrm{AP}) &=\\mathrm{x} \\Rightarrow \\mathrm{d}(\\mathrm{BP})=12-\\mathrm{x} \\\\ \\mathrm{f}(\\mathrm{x}) &=\\mathrm{AP}^{2}+\\mathrm{BP}^{2} \\\\ &=\\mathrm{x}^{2}+(12-\\mathrm{x})^{2} \\\\ &=2 \\mathrm{x}^{2}-24 \\mathrm{x}+144 \\\\ \\therefore \\quad \\mathrm{f}^{\\prime}(\\mathrm{x}) &=4 \\mathrm{x}-24 \\text { and when } \\mathrm{f}^{\\prime}(\\mathrm{x})=0, \\text { we get } \\mathrm{x}=6 . \\\\ \\mathrm{f}^{\\prime \\prime}(\\mathrm{x}) &=4>0 \\\\ \\text { Hence } \\mathrm{f}(\\mathrm{x}) \\text { is minimum at } \\mathrm{x}=6 & \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2600d0279619d9d8a2157", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "The minimum value of $f(x)=a^{2} \\cos ^{2} x+b^{2} \\sin ^{2} x$ if $a^{2}>b^{2}$, is", "image": null}, "options": [{"id": "dSPit", "text": "$a^{2}-b^{2}$", "image": null, "isCorrect": false}, {"id": "qNNHO", "text": "$b^{2}$", "image": null, "isCorrect": false}, {"id": "c1Ukp", "text": "$a^{2}+b^{2}$", "image": null, "isCorrect": false}, {"id": "l6bxv", "text": "$a^{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $f(x)$\n$=a^{2} \\cos ^{2} x+b^{2} \\sin ^{2} x$\n$=a^{2}\\left(\\frac{1+\\cos 2 x}{2}\\right)+b^{2}\\left(\\frac{1-\\cos 2 x}{2}\\right)$\n$=\\left(\\frac{a^{2}+b^{2}}{2}\\right)+\\left(\\frac{a^{2}-b^{2}}{2}\\right) \\cos 2 x$\n$f(x)$ will be maximum when $\\cos 2 x=1$\n$\\mathrm{f}(\\mathrm{x})$ will be minimum when $\\cos 2 \\mathrm{x}=-1$\nHence minimum value of $f(x)$ is\n$$\n\\begin{aligned}\nf(x) &=\\frac{a^{2}+b^{2}}{2}+\\left(\\frac{a^{2}-b^{2}}{2}\\right)(-1) \\\\\n&=\\frac{a^{2}+b^{2}}{2}-\\frac{a^{2}-b^{2}}{2}=b^{2}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ffa0279619d9d8a20c0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}], "question": {"text": "The maximum volume of a right circular cylinder if the sum of its radius and height is\n$6 \\mathrm{~m}$ is", "image": null}, "options": [{"id": "vF71Y", "text": "$16 \\pi m^{3}$", "image": null, "isCorrect": false}, {"id": "75mMF", "text": "$32 \\pi m^{3}$", "image": null, "isCorrect": true}, {"id": "QELuf", "text": "$4 \\pi m^{3}$", "image": null, "isCorrect": false}, {"id": "TlRtM", "text": "$64 \\pi m^{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(A)\nLet height of cylinder be $\\mathrm{h}$ and radius be $\\mathrm{r} \\Rightarrow \\mathrm{r}+\\mathrm{h}=6 \\Rightarrow \\mathrm{h}=6-\\mathrm{r}$\nVolume of cylinder $\\mathrm{V}=\\pi \\mathrm{r}^{2} \\mathrm{~h}$\n$=\\pi \\cdot r^{2} \\cdot(6-r)=\\pi\\left(6 r^{2}-r^{3}\\right)$\nFor the maximum volume, $\\frac{\\mathrm{dV}}{\\mathrm{dr}}=0$\n$\\pi\\left(12 r-3 r^{2}\\right)=0 \\Rightarrow 12 r=3 r^{2} \\Rightarrow r=4 \\Rightarrow h=6-4=2$.\n$\\therefore$ Volume of cylinder $=\\pi \\times 4^{2} \\times 2=32 \\pi \\cdot \\mathrm{m}^{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f72", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T14:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 2)", "title": "MHT CET 2020 (19 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fe30279619d9d8a2008", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "The function $f(x)=(x+2) e^{-x}$ is", "image": null}, "options": [{"id": "6aSia", "text": "decreasing in $(-\\infty,-1)$ and increasing in $(-1, \\infty)$", "image": null, "isCorrect": false}, {"id": "4kY9H", "text": "decreasing for all $x$", "image": null, "isCorrect": false}, {"id": "MRc96", "text": "increasing in $(-\\infty,-1)$ and decreasing in $(-1, \\infty)$", "image": null, "isCorrect": true}, {"id": "I0ywM", "text": "increasing for all $x$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(C)\nGiven\n$\\begin{array}{l}\nf(x)=(x+2) e^{-x} \\\\\n\\begin{aligned}\n\\therefore f^{\\prime}(x) &=(x+2)\\left(e^{-x}\\right)(-1)+e^{-x}(1) \\\\\n&=e^{-x}[1-(x+2)]=e^{-x}(-x-1) \\\\\n&=-e^{-x}(x+1)\n\\end{aligned}\n\\end{array}$\nHere $e^{-x}$ is always positive.\n$\\begin{array}{l}\n\\text { Now }-(x+1)>0 \\Rightarrow-x>1 \\Rightarrow x < -1 \\\\\n\\text { Also }-(x+1) < 0 \\Rightarrow-x < 1 \\Rightarrow x>-1\n\\end{array}$\nThus $\\mathrm{f}(\\mathrm{x})$ increases in $(-\\infty,-1)$ and decreases in $(-1, \\infty)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd50279619d9d8a1f99", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "If $x+y=\\frac{\\pi}{2}$, then the maximum value of $\\sin x$.siny is", "image": null}, "options": [{"id": "mzhzM", "text": "$\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "S1zTZ", "text": "$\\frac{-1}{2}$", "image": null, "isCorrect": false}, {"id": "ZgEGF", "text": "$\\frac{-1}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "ySnK6", "text": "$\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(C)\n$x+y=\\frac{\\pi}{2} \\quad \\Rightarrow \\quad y=\\frac{\\pi}{2}-x$\n$\\begin{array}{l}\n\\sin x \\cdot \\sin y=\\sin x \\cdot \\sin \\left(\\frac{\\pi}{2}-x\\right)=\\sin x \\cos x=\\frac{2 \\sin x \\cdot \\cos x}{2}=\\frac{\\sin 2 x}{2} \\\\\n\\text { We know, }-1 \\leq \\sin 2 x \\leq 1 \\Rightarrow \\frac{-1}{2} \\leq \\frac{\\sin 2 x}{2} \\leq \\frac{1}{2}\n\\end{array}$\nSo maximum value is $\\frac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25faf0279619d9d8a1e6f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "If rectangles are inscribed in a circle of radius r units. Then the dimensions of the rectangle which has maximum area are", "image": null}, "options": [{"id": "KBiAn", "text": "$2 \\mathrm{r}$ units, $\\mathrm{r}$ units,", "image": null, "isCorrect": false}, {"id": "dZZPh", "text": "2r units, $\\sqrt{2} \\mathrm{r}$ units,", "image": null, "isCorrect": false}, {"id": "1OciD", "text": "r units, $\\sqrt{2} \\mathrm{r}$ units,", "image": null, "isCorrect": false}, {"id": "ZKhXe", "text": "$\\sqrt{2} \\mathrm{r}$ units,$\\sqrt{2} \\mathrm{r}$ units", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $A B C D$ be the rectangle inscribed in a circle of radius 'r'.\n$\\Rightarrow \\mathrm{AC}=\\mathrm{BD}=2 \\mathrm{r}=$ diameter\nLet $x$ and $y$ be the length and breath of rectangle.\n$\\therefore x^{2}+y^{2}=(2 r)^{2} \\Rightarrow y=\\sqrt{4 r^{2}-x^{2}}$\nNow Area of rectangle $=\\mathrm{A}=\\mathrm{xy}$\n$$\n\\begin{aligned}\n\\therefore & A=x \\sqrt{4 r^{2}-x^{2}} \\\\\n\\therefore & \\frac{d A}{d x}=\\sqrt{4 r^{2}-x^{2}}+\\frac{x}{2 \\sqrt{4 r^{2}-x^{2}}} \\times(-2 x)=\\sqrt{4 r^{2}-x^{2}}-\\frac{x^{2}}{\\sqrt{4 r^{2}-x^{2}}} \\\\\n& \\frac{d A}{d x}=\\frac{4 r^{2}-2 x^{2}}{\\sqrt{4 r^{2}-x^{2}}}\n\\end{aligned}\n$$\nFor maximum Area, $\\frac{\\mathrm{dA}}{\\mathrm{dx}}=0 \\Rightarrow 4 \\mathrm{r}^{2}-2 \\mathrm{x}^{2}=0 \\Rightarrow \\mathrm{x}=\\sqrt{2} \\mathrm{r}$\n$$\n\\frac{\\mathrm{d}^{2} \\mathrm{~A}}{\\mathrm{dx}^{2}}>0 \\text { for } \\mathrm{x}=\\sqrt{2} \\mathrm{r}\n$$\nTherefore area is maximum when $x=\\sqrt{2} r \\Rightarrow y=\\sqrt{4 r^{2}-2 r^{2}}=\\sqrt{2} r$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/bwcmbp-N_xIfa4PMrBrcYMioxelKpNCIUcvKiq3rSwg.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f9a0279619d9d8a1dd1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "20 meters wire is available to fence a flower bed in the form of a circular sector. If the flower bed should have the greatest possible surface area, then the radius of the circle is", "image": null}, "options": [{"id": "WCVFh", "text": "$2 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "vIpaW", "text": "$4 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "HRXBq", "text": "$5 \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "eBptk", "text": "$10 \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\ell$ and $\\mathrm{r}$ be as shown in figure.\nWe have $20=2 r+\\ell$\n$$\n\\ell=20-2 \\mathrm{r}\n$$\nArea of flower bed\n$$\n\\begin{array}{l}\nA=\\frac{1}{2} \\times \\ell r=\\frac{1}{2}(20-2 r) \\cdot r \\\\\nA=10 r-r^{2}\n\\end{array}\n$$\n$$\n\\begin{array}{l}\n\\frac{\\mathrm{d} \\mathrm{A}}{\\mathrm{dr}}=10-2 \\mathrm{r} \\text { and } \\frac{\\mathrm{d}^{2} \\mathrm{~A}}{\\mathrm{dr}^{2}}=-2 < 0 \\\\\n\\text { When } \\frac{\\mathrm{d} \\mathrm{A}}{\\mathrm{dr}}=0 \\Rightarrow 10-2 \\mathrm{r}=0 \\Rightarrow \\mathrm{r}=5\n\\end{array}\n$$\nHence area of flower bed will be maximum when $r=5$.<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/UFgtXWAYV6Xi3fB7PaOJZc8gZyPUkGkJ0AmSmel8G7w.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f740279619d9d8a1c96", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}], "question": {"text": "A metal wire 108 meters long is bent to form a rectangle. If the area of the rectangle\nis maximum, then its dimensions are", "image": null}, "options": [{"id": "aN27E", "text": "$28 \\mathrm{~m}, 28 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "pNixl", "text": "27 m, $27 \\mathrm{~m}$", "image": null, "isCorrect": true}, {"id": "XCXDQ", "text": "$25 \\mathrm{~m}, 25 \\mathrm{~m}$", "image": null, "isCorrect": false}, {"id": "3HiUW", "text": "$26 \\mathrm{~m}, 26 \\mathrm{~m}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let sides of rectangle be $x$ and $y$\nThus $2 x+2 y=108 \\Rightarrow x+y=54 \\Rightarrow y=54-x$\nNow Area $=A=x y$\n$\\therefore \\quad=x(54-x)=54 x-x^{2}$\nDifferentiating w.r.t. $\\mathrm{x}$, we get\n$\\frac{\\mathrm{d} \\mathrm{A}}{\\mathrm{dx}}=54 \\times 1-2 \\mathrm{x}$ and $\\frac{\\mathrm{d}^{2} \\mathrm{~A}}{\\mathrm{dx}^{2}}=-2 < 0$\nWhen $\\frac{d A}{d x}=0$, we get $54-2 x=0 \\Rightarrow x=27 \\Rightarrow y=54-x=27$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T09:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 1)", "title": "MHT CET 2020 (14 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f630279619d9d8a1c13", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "The maximum value of the function $\\frac{\\log x}{x}, x \\neq 0$ is", "image": null}, "options": [{"id": "sxjub", "text": "$e^{2}$", "image": null, "isCorrect": false}, {"id": "B91UE", "text": "$\\frac{1}{e}$", "image": null, "isCorrect": true}, {"id": "JyqK9", "text": "$\\frac{1}{e^{2}}$", "image": null, "isCorrect": false}, {"id": "7fXQt", "text": "$e$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $y=\\frac{\\log x}{x}$\n$\\therefore \\frac{\\mathrm{dy}}{\\mathrm{dx}}=\\frac{\\mathrm{x} \\cdot \\frac{1}{\\mathrm{x}}-\\log \\mathrm{x}}{\\mathrm{x}^{2}}=\\frac{1-\\log \\mathrm{x}}{\\mathrm{x}^{2}}$\nPut $\\frac{d y}{d x}=0$, we get\n$\\begin{aligned}\n1-\\log x=0 & \\Rightarrow \\log x=1 \\Rightarrow \\log x=\\log e \\Rightarrow x=e \\\\\n\\text { Now } \\frac{d^{2} y}{d x^{2}} &=\\frac{x^{2}\\left(-\\frac{1}{x}\\right)-(1-\\log x)(2 x)}{x^{4}}=\\frac{-x-2 x+2 x \\log x}{x^{4}} \\\\\n&=\\frac{2 \\log x-3}{x^{3}}\n\\end{aligned}$\n$\\text { At } x=e, \\frac{d^{2} y}{d x^{2}} < 0$\nfrom (1), maximum value is $y=\\frac{1}{\\mathrm{e}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f3b0279619d9d8a1acf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "The perimeter of a triangle is $10 \\mathrm{~cm}$. If one of its side is $4 \\mathrm{~cm}$, then remaining sides of the triangle, when area of triangle is maximum are", "image": null}, "options": [{"id": "EmvK7", "text": "$5 \\mathrm{~cm}, 1 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "DTIVs", "text": "$3 \\cdot 6 \\mathrm{~cm}, 2 \\cdot 4 \\mathrm{~cm}$", "image": null, "isCorrect": false}, {"id": "TJhfn", "text": "$3 \\mathrm{~cm}, 3 \\mathrm{~cm}$", "image": null, "isCorrect": true}, {"id": "fW5vq", "text": "$2 \\mathrm{~cm}, 4 \\mathrm{~cm}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $\\mathrm{a}, \\mathrm{b}, \\mathrm{c}$ be the sides of the triangle.\nThe perimeter of triangle $(2 \\mathrm{~s})=\\mathrm{a}+\\mathrm{b}+\\mathrm{c}$\nLet $\\mathrm{a}=4$ and $2 \\mathrm{~s}=10$ i.e. $\\mathrm{s}=5$\n$\\therefore 10=4+b+c \\Rightarrow b=6-c$\nNow, area of triangle $=\\Delta=\\sqrt{s(s-a)(s-b)(s-c)}=\\sqrt{5(5-4)(5-6+c)(5-c)}$\n$\\Delta=\\sqrt{5(1)(\\mathrm{c}-1)(5-\\mathrm{c})} \\Rightarrow \\Delta^{2}=5(\\mathrm{c}-1)(5-\\mathrm{c})$\n$=5\\left(5 c-c^{2}-5+c\\right)=5\\left(-c^{2}+6 c-5\\right)$\nLet $f(c)=5\\left(-c^{2}+6 c-5\\right) \\Rightarrow f^{\\prime}(c)=5(-2 c+6) \\Rightarrow f^{\\prime \\prime}(c)=5(-2)=-10$\nFor extreme value, $f^{\\prime}(c)=0$ i.e. $5(-2 c+6)=0 \\Rightarrow c=3$\nThus $f^{\\prime \\prime}(3)=-10 < 0 \\Rightarrow f(c)$ has maximum value at $c=3$\n$\\therefore \\mathrm{b}=6-3=3$ i.e. the lengths of the remaining sides are $3 \\mathrm{~cm}$ and $3 \\mathrm{~cm}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ef30279619d9d8a1891", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f66", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2019 (02 May Shift 1)", "title": "MHT CET 2019 (02 May Shift 1)"}], "question": {"text": "If <math><mi>f</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mo>=</mo><mn>3</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>-</mo><mn>9</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>27</mn><mi>x</mi><mo>+</mo><mn>15</mn><mo>,</mo></math> then the maximum value of <math><mi>f</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced></math> is ________", "image": null}, "options": [{"id": "6UMQk", "text": "<math><mo>-</mo><mn>66</mn></math>", "image": null, "isCorrect": false}, {"id": "vVo2R", "text": "<math><mn>30</mn></math>", "image": null, "isCorrect": true}, {"id": "Vxur2", "text": "<math><mo>-</mo><mn>30</mn></math>", "image": null, "isCorrect": false}, {"id": "xyQo8", "text": "<math><mn>66</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If <math><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><mn>3</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>-</mo><mn>9</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>27</mn><mi>x</mi><mo>+</mo><mn>15</mn></math>  <br/><math><mi>f</mi><mi mathvariant=\"normal\">'</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mo>=</mo><mn>9</mn><mfenced separators=\"|\"><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mo>=</mo><mn>9</mn><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>3</mn></mrow></mfenced><mfenced separators=\"|\"><mrow>
