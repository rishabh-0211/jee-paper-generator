br><br>Answer: $\\alpha=2, \\beta=-\\frac{1}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792144d0aee93fa0796df92", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "If $\\mathrm{f}(x)=\\frac{\\mathrm{a} \\sin x+b \\cos x}{\\mathrm{c} \\sin x+\\mathrm{d} \\cos x}$ is decreasing for all $x$, then", "image": null}, "options": [{"id": "wScbM", "text": "$\\mathrm{ad}-\\mathrm{bc}\\gt0$", "image": null, "isCorrect": false}, {"id": "xmgCn", "text": "$\\mathrm{ad}-\\mathrm{bc} \\lt 0$", "image": null, "isCorrect": true}, {"id": "PSo7g", "text": "$\\mathrm{ab}-\\mathrm{cd}\\gt0$", "image": null, "isCorrect": false}, {"id": "6QqOo", "text": "ab $-\\mathrm{cd} \\lt 0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x) = \\dfrac{a \\sin x + b \\cos x}{c \\sin x + d \\cos x}$<br><br>Differentiating with respect to $x$ using the quotient rule:<br><br>$f'(x) = \\dfrac{(a \\cos x - b \\sin x)(c \\sin x + d \\cos x) - (a \\sin x + b \\cos x)(c \\cos x - d \\sin x)}{(c \\sin x + d \\cos x)^2}$<br><br>Expanding the numerator:<br><br>$ac \\sin x \\cos x + ad \\cos^2 x - bc \\sin^2 x - bd \\sin x \\cos x - (ac \\sin x \\cos x - ad \\sin^2 x + bc \\cos^2 x - bd \\sin x \\cos x)$<br><br>$= ad(\\cos^2 x + \\sin^2 x) - bc(\\sin^2 x + \\cos^2 x)$<br><br>$= ad - bc$<br><br>Therefore, $f'(x) = \\dfrac{ad - bc}{(c \\sin x + d \\cos x)^2}$<br><br>For the function $f(x)$ to be decreasing for all $x$ in its domain, we must have $f'(x) \\lt 0$.<br><br>Since $(c \\sin x + d \\cos x)^2 \\gt 0$ for all $x$ in the domain, the numerator must be negative.<br><br>$ad - bc \\lt 0$<br><br>Answer: $\\mathrm{ad}-\\mathrm{bc} \\lt 0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143b0aee93fa0796df01", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "The set of all points, for which $\\mathrm{f}(x)=x^2 \\mathrm{e}^{-x}$ strictly increases, is", "image": null}, "options": [{"id": "NuNvc", "text": "$(0,2)$", "image": null, "isCorrect": true}, {"id": "sfQS5", "text": "$(2, \\infty)$", "image": null, "isCorrect": false}, {"id": "VSAaK", "text": "$(-2,0)$", "image": null, "isCorrect": false}, {"id": "KQ4A3", "text": "$(-\\infty, \\infty)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\mathrm{f}(x) = x^2 \\mathrm{e}^{-x}$<br><br>Differentiating with respect to $x$, we get<br><br>$\\mathrm{f}'(x) = \\dfrac{\\mathrm{d}}{\\mathrm{d}x}(x^2 \\mathrm{e}^{-x})$<br><br>$\\mathrm{f}'(x) = 2x \\mathrm{e}^{-x} + x^2 (-\\mathrm{e}^{-x})$<br><br>$\\mathrm{f}'(x) = x(2 - x)\\mathrm{e}^{-x}$<br><br>For $\\mathrm{f}(x)$ to be strictly increasing, $\\mathrm{f}'(x) > 0$<br><br>Since $\\mathrm{e}^{-x} > 0$ for all real $x$, we must have<br><br>$x(2 - x) > 0$<br><br>$x(x - 2) < 0$<br><br>This inequality holds for $x \\in (0, 2)$.<br><br>Therefore, the set of all points for which $\\mathrm{f}(x)$ strictly increases is $(0, 2)$.<br><br>Answer: $(0,2)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214270aee93fa0796de64", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}], "question": {"text": "The function $\\mathrm{f}(x)=2 x^3-9 x^2+12 x+2$ is decreasing in", "image": null}, "options": [{"id": "Qpbou", "text": "$1 \\lt x \\lt 2$", "image": null, "isCorrect": true}, {"id": "i0603", "text": "$x \\lt 1$ or $x \\gt 2$", "image": null, "isCorrect": false}, {"id": "gXslj", "text": "$x \\lt -1$ or $x \\gt -2$", "image": null, "isCorrect": false}, {"id": "Ypxob", "text": "$-2 \\lt x \\lt -1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\mathrm{f}(x) = 2x^3 - 9x^2 + 12x + 2$<br><br>Differentiating with respect to $x$, we get:<br><br>$\\mathrm{f}'(x) = \\dfrac{d}{dx}(2x^3 - 9x^2 + 12x + 2)$<br><br>$\\mathrm{f}'(x) = 6x^2 - 18x + 12$<br><br>For the function to be decreasing, $\\mathrm{f}'(x) < 0$.<br><br>$6x^2 - 18x + 12 < 0$<br><br>Dividing by $6$, we get:<br><br>$x^2 - 3x + 2 < 0$<br><br>$(x - 1)(x - 2) < 0$<br><br>Using the method of intervals, the inequality holds true when $x$ lies between the roots $1$ and $2$.<br><br>Therefore, $1 < x < 2$.<br><br>Answer: $1 \\lt x \\lt 2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T14:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 2)", "title": "MHT CET 2024 (15 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214140aee93fa0796ddce", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "If $\\mathrm{f}(x)=x^3-10 x^2+200 x-10$, then", "image": null}, "options": [{"id": "J55ss", "text": "$\\mathrm{f}(x)$ is decreasing in $(-\\infty, 10]$ and increasing in $[10, \\infty)$", "image": null, "isCorrect": false}, {"id": "0by8M", "text": "$\\mathrm{f}(x)$ is increasing in $(-\\infty, 10]$ and decreasing in $[10, \\infty)$", "image": null, "isCorrect": false}, {"id": "f29hP", "text": "$\\mathrm{f}(x)$ is increasing throughout real line", "image": null, "isCorrect": true}, {"id": "4p9NM", "text": "$\\mathrm{f}(x)$ is decreasing throughout real line", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\mathrm{f}(x) = x^3 - 10x^2 + 200x - 10$<br><br>Differentiating with respect to $x$, we get:<br><br>$\\mathrm{f}'(x) = 3x^2 - 20x + 200$<br><br>To check the sign of $\\mathrm{f}'(x)$, we find the discriminant of the quadratic expression $3x^2 - 20x + 200$.<br><br>$\\Delta = b^2 - 4ac = (-20)^2 - 4(3)(200) = 400 - 2400 = -2000$<br><br>Since $\\Delta < 0$ and the coefficient of $x^2$ is $3 > 0$, the quadratic expression is strictly positive for all real values of $x$.<br><br>Alternatively, we can write:<br><br>$\\mathrm{f}'(x) = 3\\left(x^2 - \\dfrac{20}{3}x\\right) + 200 = 3\\left(x - \\dfrac{10}{3}\\right)^2 - \\dfrac{100}{3} + 200 = 3\\left(x - \\dfrac{10}{3}\\right)^2 + \\dfrac{500}{3}$<br><br>Since $3\\left(x - \\dfrac{10}{3}\\right)^2 \\ge 0$ and $\\dfrac{500}{3} > 0$, we have $\\mathrm{f}'(x) > 0$ for all $x \\in \\mathbb{R}$.<br><br>Therefore, $\\mathrm{f}(x)$ is increasing throughout the real line.<br><br>Answer: $\\mathrm{f}(x)$ is increasing throughout real line", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214040aee93fa0796dd54", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "Let $\\mathrm{f}(x)=\\frac{x}{\\sqrt{\\mathrm{a}^2+x^2}}-\\frac{\\mathrm{d}-x}{\\sqrt{\\mathrm{~b}^2+(\\mathrm{d}-x)^2}}, x \\in \\mathbb{R}$ where $a, b, d$ are non-zero real constants. Then", "image": null}, "options": [{"id": "yOI90", "text": "$\\mathrm{f}^{\\prime}$ is not a continuous function of $x$.", "image": null, "isCorrect": false}, {"id": "13QG0", "text": "f is neither increasing nor decreasing function of $x$.", "image": null, "isCorrect": false}, {"id": "Iknh1", "text": "f is an increasing function of $x$.", "image": null, "isCorrect": true}, {"id": "UgagW", "text": "f is a decreasing function of $x$.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given function is $\\mathrm{f}(x)=\\dfrac{x}{\\sqrt{\\mathrm{a}^2+x^2}}-\\dfrac{\\mathrm{d}-x}{\\sqrt{\\mathrm{b}^2+(\\mathrm{d}-x)^2}}$.<br><br>Differentiating $\\mathrm{f}(x)$ with respect to $x$, we get:<br><br>$\\mathrm{f}^{\\prime}(x) = \\dfrac{d}{dx}\\left(\\dfrac{x}{\\sqrt{\\mathrm{a}^2+x^2}}\\right) - \\dfrac{d}{dx}\\left(\\dfrac{\\mathrm{d}-x}{\\sqrt{\\mathrm{b}^2+(\\mathrm{d}-x)^2}}\\right)$<br><br>Using the quotient rule for the first term:<br><br>$\\dfrac{d}{dx}\\left(\\dfrac{x}{\\sqrt{\\mathrm{a}^2+x^2}}\\right) = \\dfrac{1 \\cdot \\sqrt{\\mathrm{a}^2+x^2} - x \\cdot \\dfrac{x}{\\sqrt{\\mathrm{a}^2+x^2}}}{\\mathrm{a}^2+x^2} = \\dfrac{\\mathrm{a}^2+x^2-x^2}{(\\mathrm{a}^2+x^2)^{3/2}} = \\dfrac{\\mathrm{a}^2}{(\\mathrm{a}^2+x^2)^{3/2}}$<br><br>Similarly, for the second term, let $u = \\mathrm{d}-x$, so $\\dfrac{du}{dx} = -1$:<br><br>$\\dfrac{d}{dx}\\left(\\dfrac{\\mathrm{d}-x}{\\sqrt{\\mathrm{b}^2+(\\mathrm{d}-x)^2}}\\right) = \\dfrac{d}{du}\\left(\\dfrac{u}{\\sqrt{\\mathrm{b}^2+u^2}}\\right) \\cdot \\dfrac{du}{dx} = \\dfrac{\\mathrm{b}^2}{(\\mathrm{b}^2+u^2)^{3/2}} \\cdot (-1) = -\\dfrac{\\mathrm{b}^2}{(\\mathrm{b}^2+(\\mathrm{d}-x)^2)^{3/2}}$<br><br>Substituting these back into the derivative of $\\mathrm{f}(x)$:<br><br>$\\mathrm{f}^{\\prime}(x) = \\dfrac{\\mathrm{a}^2}{(\\mathrm{a}^2+x^2)^{3/2}} - \\left( -\\dfrac{\\mathrm{b}^2}{(\\mathrm{b}^2+(\\mathrm{d}-x)^2)^{3/2}} \\right)$<br><br>$\\mathrm{f}^{\\prime}(x) = \\dfrac{\\mathrm{a}^2}{(\\mathrm{a}^2+x^2)^{3/2}} + \\dfrac{\\mathrm{b}^2}{(\\mathrm{b}^2+(\\mathrm{d}-x)^2)^{3/2}}$<br><br>Since $\\mathrm{a}, \\mathrm{b}$ are non-zero real constants, $\\mathrm{a}^2 > 0$ and $\\mathrm{b}^2 > 0$. Also, $(\\mathrm{a}^2+x^2)^{3/2} > 0$ and $(\\mathrm{b}^2+(\\mathrm{d}-x)^2)^{3/2} > 0$ for all $x \\in \\mathbb{R}$.<br><br>Therefore, $\\mathrm{f}^{\\prime}(x) > 0$ for all $x \\in \\mathbb{R}$.<br><br>Since the derivative is strictly positive, $\\mathrm{f}(x)$ is an increasing function of $x$. Also, $\\mathrm{f}^{\\prime}(x)$ is continuous for all $x \\in \\mathbb{R}$.<br><br>Answer: f is an increasing function of $x$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ed0aee93fa0796dc9e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "If $\\mathrm{f}(x)=x^3-6 x^2+9 x+3$ is monotonically decreasing function, then $x$ lies in", "image": null}, "options": [{"id": "vMbES", "text": "$(3, \\infty)$", "image": null, "isCorrect": false}, {"id": "iS6KF", "text": "$(1,3)$", "image": null, "isCorrect": true}, {"id": "khAbF", "text": "$[3, \\infty)$", "image": null, "isCorrect": false}, {"id": "JxTlk", "text": "$[0,3]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\mathrm{f}(x) = x^3 - 6x^2 + 9x + 3$<br><br>Differentiating with respect to $x$, we get<br><br>$\\mathrm{f}'(x) = 3x^2 - 12x + 9$<br><br>For a monotonically decreasing function, $\\mathrm{f}'(x) < 0$<br><br>$3x^2 - 12x + 9 < 0$<br><br>$3(x^2 - 4x + 3) < 0$<br><br>$3(x - 1)(x - 3) < 0$<br><br>This inequality holds true when $x$ lies between $1$ and $3$.<br><br>Therefore, $x \\in (1, 3)$.<br><br>Answer: $(1,3)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b30aee93fa0796dad4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "The function $\\mathrm{f}(x)=2 x^3-6 x+5$ is an increasing function, if", "image": null}, "options": [{"id": "GO41t", "text": "$0 \\lt x \\lt 1$", "image": null, "isCorrect": false}, {"id": "bDJYy", "text": "$-1 \\lt x \\lt 1$", "image": null, "isCorrect": false}, {"id": "rxiLf", "text": "$x \\lt -1$ or $x\\gt1$", "image": null, "isCorrect": true}, {"id": "JU6rD", "text": "$-1 \\lt x \\lt -\\dfrac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x) = 2x^3 - 6x + 5$<br><br>Differentiating with respect to $x$, we get<br><br>$f'(x) = 6x^2 - 6$<br><br>For $f(x)$ to be an increasing function, $f'(x) \\gt 0$<br><br>$6x^2 - 6 \\gt 0$<br><br>$x^2 - 1 \\gt 0$<br><br>$(x - 1)(x + 1) \\gt 0$<br><br>This inequality holds true for $x \\lt -1$ or $x \\gt 1$.<br><br>Answer: $x \\lt -1$ or $x\\gt1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a10aee93fa0796da4c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "If $\\mathrm{f}(x)=\\dfrac{\\log x}{x}(x\\gt0)$, then it is increasing in", "image": null}, "options": [{"id": "QT2n0", "text": "$(0, \\mathrm{e})$", "image": null, "isCorrect": true}, {"id": "cETgd", "text": "$(\\mathrm{e}, \\infty)$", "image": null, "isCorrect": false}, {"id": "DxNBX", "text": "$(0, \\infty)$", "image": null, "isCorrect": false}, {"id": "WgWVA", "text": "$(-\\infty, \\infty)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\mathrm{f}(x) = \\dfrac{\\log x}{x}$ for $x \\gt 0$.<br><br>Differentiating with respect to $x$ using the quotient rule:<br><br>$\\mathrm{f}'(x) = \\dfrac{x \\cdot \\dfrac{1}{x} - \\log x \\cdot 1}{x^2}$<br><br>$\\mathrm{f}'(x) = \\dfrac{1 - \\log x}{x^2}$<br><br>For the function to be increasing, $\\mathrm{f}'(x) \\gt 0$.<br><br>$\\dfrac{1 - \\log x}{x^2} \\gt 0$<br><br>Since $x \\gt 0$, $x^2 \\gt 0$. Therefore, the numerator must be positive:<br><br>$1 - \\log x \\gt 0$<br><br>$\\log x \\lt 1$<br><br>$x \\lt \\mathrm{e}$<br><br>Considering the domain $x \\gt 0$, the function is increasing in the interval $(0, \\mathrm{e})$.<br><br>Answer: $(0, \\mathrm{e})$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792137a0aee93fa0796d915", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "The function $f(x)=\\dfrac{\\log _e(\\pi+x)}{\\log _e(e+x)}$ is", "image": null}, "options": [{"id": "l599l", "text": "increasing on $(0, \\infty)$.", "image": null, "isCorrect": false}, {"id": "SXexH", "text": "increasing on $\\left(0, \\dfrac{\\pi}{\\mathrm{e}}\\right)$, decreasing on $\\left(\\dfrac{\\pi}{\\mathrm{e}}, \\infty\\right)$.", "image": null, "isCorrect": false}, {"id": "80SfU", "text": "decreasing on $(0, \\infty)$.", "image": null, "isCorrect": true}, {"id": "tLAN3", "text": "decreasing on $\\left(0, \\dfrac{\\pi}{\\mathrm{e}}\\right)$, increasing on $\\left(\\dfrac{\\pi}{\\mathrm{e}}, \\infty\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x) = \\dfrac{\\log_e(\\pi+x)}{\\log_e(e+x)}$<br><br>Differentiating with respect to $x$, we get:<br><br>$f'(x) = \\dfrac{\\dfrac{1}{\\pi+x} \\log_e(e+x) - \\dfrac{1}{e+x} \\log_e(\\pi+x)}{(\\log_e(e+x))^2}$<br><br>$f'(x) = \\dfrac{(e+x)\\log_e(e+x) - (\\pi+x)\\log_e(\\pi+x)}{(\\pi+x)(e+x)(\\log_e(e+x))^2}$<br><br>Consider the function $g(t) = t \\log_e t$.<br><br>Differentiating with respect to $t$, we get:<br><br>$g'(t) = 1 + \\log_e t$<br><br>For $t > 1$, $g'(t) > 0$, which means $g(t)$ is strictly increasing.<br><br>For $x > 0$, we have $\\pi+x > e+x > e > 1$.<br><br>Since $g(t)$ is strictly increasing for $t > 1$, we have $g(\\pi+x) > g(e+x)$.<br><br>Therefore, $(e+x)\\log_e(e+x) - (\\pi+x)\\log_e(\\pi+x) < 0$.<br><br>Since the denominator $(\\pi+x)(e+x)(\\log_e(e+x))^2 > 0$ for all $x > 0$, we conclude that $f'(x) < 0$ for all $x \\in (0, \\infty)$.<br><br>Thus, $f(x)$ is strictly decreasing on $(0, \\infty)$.<br><br>Answer: decreasing on $(0, \\infty)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136a0aee93fa0796d89b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "The minimum value of the function $\\mathrm{f}(x)=2 x^3-15 x^2+36 x-48 \\quad$ on the set $\\mathrm{A}=\\left\\{x \\mid x^2+20 \\leqslant 9 x\\right\\}$ is", "image": null}, "options": [{"id": "ZQPgY", "text": "-16", "image": null, "isCorrect": true}, {"id": "e1u9y", "text": "-7", "image": null, "isCorrect": false}, {"id": "89nNx", "text": "16", "image": null, "isCorrect": false}, {"id": "PTTtW", "text": "7", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given set is $\\mathrm{A}=\\left\\{x \\mid x^2+20 \\leqslant 9 x\\right\\}$.<br><br>Solving the inequality:<br>$x^2 - 9x + 20 \\leqslant 0$<br>$(x - 4)(x - 5) \\leqslant 0$<br>$\\Rightarrow x \\in [4, 5]$<br><br>The given function is $f(x) = 2x^3 - 15x^2 + 36x - 48$.<br><br>Finding the derivative of $f(x)$ with respect to $x$:<br>$f'(x) = 6x^2 - 30x + 36$<br>$f'(x) = 6(x^2 - 5x + 6)$<br>$f'(x) = 6(x - 2)(x - 3)$<br><br>For $x \\in [4, 5]$, both $(x - 2) > 0$ and $(x - 3) > 0$.<br>Thus, $f'(x) > 0$ for all $x \\in [4, 5]$.<br><br>Since $f'(x) > 0$, the function $f(x)$ is strictly increasing on the interval $[4, 5]$.<br><br>Therefore, the minimum value of $f(x)$ on this interval occurs at the left endpoint, $x = 4$.<br><br>Calculating the minimum value:<br>$f(4) = 2(4)^3 - 15(4)^2 + 36(4) - 48$<br>$f(4) = 2(64) - 15(16) + 144 - 48$<br>$f(4) = 128 - 240 + 144 - 48$<br>$f(4) = 272 - 288 = -16$<br><br>Answer: -16", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213680aee93fa0796d88d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "If $\\mathrm{f}(x)=x^3+\\mathrm{b} x^2+\\mathrm{c} x+\\mathrm{d}$ and $0 \\lt \\mathrm{b}^2 \\lt \\mathrm{c}$, then in $(-\\infty, \\infty)$", "image": null}, "options": [{"id": "fDryo", "text": "$\\mathrm{f}(x)$ is strictly increasing function", "image": null, "isCorrect": true}, {"id": "uhFUg", "text": "$\\mathrm{f}(x)$ is bounded", "image": null, "isCorrect": false}, {"id": "M7fuT", "text": "$\\mathrm{f}(x)$ has a local maxima", "image": null, "isCorrect": false}, {"id": "YHnuK", "text": "$\\mathrm{f}(x)$ is a strictly decreasing function", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\mathrm{f}(x) = x^3 + \\mathrm{b}x^2 + \\mathrm{c}x + \\mathrm{d}$<br><br>Differentiating with respect to $x$, we get:<br><br>$\\mathrm{f}'(x) = 3x^2 + 2\\mathrm{b}x + \\mathrm{c}$<br><br>To find the nature of $\\mathrm{f}'(x)$, we check its discriminant $D$:<br><br>$D = (2\\mathrm{b})^2 - 4(3)(\\mathrm{c}) = 4\\mathrm{b}^2 - 12\\mathrm{c} = 4(\\mathrm{b}^2 - 3\\mathrm{c})$<br><br>We are given $0 \\lt \\mathrm{b}^2 \\lt \\mathrm{c}$.<br><br>Since $\\mathrm{b}^2 \\lt \\mathrm{c}$ and $\\mathrm{c} \\gt 0$, we have $\\mathrm{b}^2 - 3\\mathrm{c} \\lt \\mathrm{c} - 3\\mathrm{c} = -2\\mathrm{c} \\lt 0$.<br><br>Therefore, $D \\lt 0$.<br><br>Since the leading coefficient of $\\mathrm{f}'(x)$ is $3 \\gt 0$ and $D \\lt 0$, $\\mathrm{f}'(x) \\gt 0$ for all $x \\in (-\\infty, \\infty)$.<br><br>Thus, $\\mathrm{f}(x)$ is a strictly increasing function.<br><br>Answer: $\\mathrm{f}(x)$ is strictly increasing function", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262760279619d9d8a34ba", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Let $\\mathrm{f}(x)=\\int \\frac{x^2-3 x+2}{x^4+1} \\mathrm{~d} x$, then function decreases in the interval", "image": null}, "options": [{"id": "XLvs7", "text": "$(-\\infty,-2)$", "image": null, "isCorrect": false}, {"id": "8Iocm", "text": "$(-2,-1)$", "image": null, "isCorrect": false}, {"id": "fGD4q", "text": "$(1,2)$", "image": null, "isCorrect": true}, {"id": "DRjXv", "text": "$(2, \\infty)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{f}(x)=\\int \\frac{x^2-3 x+2}{x^4+1} \\mathrm{~d} x \\\\\n& \\Rightarrow \\mathrm{f}^{\\prime}(x)=\\frac{x^2-3 x+2}{x^4+1}\n\\end{aligned}\n$$\n\nFor $\\mathrm{f}(x)$ to be decreasing,\n$$\n\\begin{aligned}\n& \\mathrm{f}^{\\prime}(x) < 0 \\\\\n& \\Rightarrow \\frac{x^2-3 x+2}{x^4+1} < 0 \\\\\n& \\Rightarrow \\frac{(x-1)(x-2)}{x^4+1} < 0 \\\\\n& \\Rightarrow(x-1)(x-2) < 0 \\\\\n& \\Rightarrow x \\in(1,2)\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2624b0279619d9d8a3360", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "If $\\mathrm{f}(x)=x^3+\\mathrm{b} x^2+\\mathrm{c} x+\\mathrm{d}$ and $0 < \\mathrm{b}^2 < \\mathrm{c}$, then in $(-\\infty, \\infty)$", "image": null}, "options": [{"id": "vQYvS", "text": "$\\mathrm{f}(x)$ has a local maxima.", "image": null, "isCorrect": false}, {"id": "TToBd", "text": "$\\mathrm{f}(x)$ is strictly increasing function.", "image": null, "isCorrect": true}, {"id": "2SI0i", "text": "$\\mathrm{f}(x)$ is bounded.", "image": null, "isCorrect": false}, {"id": "0XWHw", "text": "$\\mathrm{f}(x)$ is strictly decreasing function.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{f}(x)=x^3+\\mathrm{b} x^2+\\mathrm{c} x+\\mathrm{d} \\\\\n\\therefore \\quad & \\mathrm{f}^{\\prime}(x)=3 x^2+2 \\mathrm{~b} x+\\mathrm{c}\n\\end{aligned}\n$$\nNow its discriminant $=4\\left(b^2-3 c\\right)$ $\\Rightarrow 4\\left(\\mathrm{~b}^2-\\mathrm{c}\\right)-8 \\mathrm{c} < 0$, as $\\mathrm{b}^2 < \\mathrm{c}$ and $\\mathrm{c}>0$\n$\\Rightarrow \\mathrm{f}^{\\prime}(x)>0$ for all $x \\in \\mathrm{R}$\n$\\Rightarrow f$ is strictly increasing on $R$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262290279619d9d8a324a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "The function $\\mathrm{f}(x)=\\sin ^4 x+\\cos ^4 x$ is increasing in", "image": null}, "options": [{"id": "tliOX", "text": "$0 < x < \\frac{\\pi}{8}$", "image": null, "isCorrect": false}, {"id": "pV5Hh", "text": "$\\frac{\\pi}{4} < x < \\frac{\\pi}{2}$", "image": null, "isCorrect": true}, {"id": "C85Ce", "text": "$\\frac{3 \\pi}{8} < x < \\frac{5 \\pi}{8}$", "image": null, "isCorrect": false}, {"id": "IErG0", "text": "$\\frac{5 \\pi}{8} < x < \\frac{3 \\pi}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n\\therefore \\quad \\mathrm{f}(x) & =\\sin ^4 x+\\cos ^4 x \\\\\n\\therefore \\quad \\mathrm{f}^{\\prime}(x) & =4 \\sin ^3 x \\cos x-4 \\cos ^3 x \\sin x \\\\\n& =4 \\sin x \\cos x\\left(\\sin ^2 x-\\cos ^2 x\\right) \\\\\n& =+2 \\sin 2 x \\cos 2 x \\\\\n& =-\\sin 4 x\n\\end{aligned}\n$$\n$\\therefore \\quad$ If $\\mathrm{f}(x)$ is increasing, then $\\mathrm{f}^{\\prime}(x)>0$\n$$\n\\text { i.e., } \\begin{aligned}\n-\\sin 4 x>0 & \\Rightarrow \\pi < 4 x < 2 \\pi \\\\\n& \\Rightarrow \\frac{\\pi}{4} < x < \\frac{\\pi}{2}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262030279619d9d8a311b", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "If $\\mathrm{f}(x)=x \\mathrm{e}^{x(1-x)}, x \\in \\mathrm{R}$, then $\\mathrm{f}(x)$ is", "image": null}, "options": [{"id": "bFl7T", "text": "increasing in $\\left[-\\frac{1}{2}, 1\\right]$", "image": null, "isCorrect": true}, {"id": "Eskxu", "text": "decreasing $\\mathrm{R}$", "image": null, "isCorrect": false}, {"id": "1F0Ka", "text": "increasing in $\\mathrm{R}$", "image": null, "isCorrect": false}, {"id": "QURMI", "text": "decreasing in $\\left[-\\frac{1}{2}, 1\\right]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n\\mathrm{f}(x) & =x \\mathrm{e}^{x(1-x)} \\\\\n\\therefore \\quad \\mathrm{f}^{\\prime}(x) & =x \\mathrm{e}^{x(1-x)}[x(-1)+(1-x)]+\\mathrm{e}^{x(1-x)} \\\\\n& =\\mathrm{e}^{x(1-x)}\\left(x-2 x^2+1\\right)\n\\end{aligned}\n$$\n\nFor $\\mathrm{f}(x)$ to be increasing, $\\mathrm{f}^{\\prime}(x) \\geq 0$\n$$\n\\begin{aligned}\n& \\Rightarrow \\mathrm{e}^{x(1-x)}\\left(x-2 x^2+1\\right) \\geq 0 \\\\\n& \\Rightarrow x-2 x^2+1 \\geq 0 \\\\\n& \\Rightarrow 2 x^2-x-1 \\leq 0 \\\\\n& \\Rightarrow(2 x+1)(x-1) \\leq 0 \\\\\n& \\Rightarrow x \\in\\left[-\\frac{1}{2}, 1\\right]\n\\end{aligned}\n$$\nFor $\\mathrm{f}(x)$ to be decreasing, $\\mathrm{f}^{\\prime}(x) \\leq 0$\n$$\n\\begin{aligned}\n& \\Rightarrow(2 x+1)(x-1) \\geq 0 \\\\\n& \\Rightarrow x \\in\\left(-\\infty,-\\frac{1}{2}\\right] \\cup[1, \\infty)\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2618f0279619d9d8a2d8b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}], "question": {"text": "For every value of $x \\in[1,3]$, the function $f(x)=\\frac{1}{8^x}$ is", "image": null}, "options": [{"id": "xBAVb", "text": "increasing for $x>2$ and decreasing for $x \\leq 2$.", "image": null, "isCorrect": false}, {"id": "zLY4z", "text": "neither increasing nor decreasing.", "image": null, "isCorrect": false}, {"id": "AAYdl", "text": "decreasing.", "image": null, "isCorrect": true}, {"id": "Is4e0", "text": "increasing.", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & f(x)=\\frac{1}{8^x}=8^{-x} \\\\ & \\Rightarrow f^{\\prime}(x)=8^{-x} \\log 8 \\times(-1) \\\\ & \\Rightarrow f^{\\prime}(x)=\\frac{-\\log 8}{8^x}<0 \\forall x \\in[1,3] \\\\ & \\Rightarrow f(x) \\text { is decreasing } \\forall x \\in[1,3]\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T14:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 2)", "title": "MHT CET 2022 (10 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2617c0279619d9d8a2cf5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}], "question": {"text": "The set of all points, for which $f(x)=x^2 \\cdot e^{-x}$ strictly increases, is", "image": null}, "options": [{"id": "hZQMX", "text": "$(0,2)$", "image": null, "isCorrect": true}, {"id": "zMJuI", "text": "$(-\\infty, \\infty)$", "image": null, "isCorrect": false}, {"id": "M0p66", "text": "$(-2,0)$", "image": null, "isCorrect": false}, {"id": "JiJay", "text": "$(2, \\infty)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\nf(x)=x^2 e^{-x}\n$$\nnull\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/JGBQiXzeiYOu9XEgAJkSPxJbpY7aTjpCGT3wH5nysS4.original.fullsize.png\">\n$f(x)$ is strictly increasing in $(0,2)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-10T09:00:00.000Z", "isVisible": true, "shortName": "2022 (10 Aug Shift 1)", "title": "MHT CET 2022 (10 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261470279619d9d8a2b46", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "If $f(x)=\\frac{x}{\\log x}$, then $f(x)$ is increasing in", "image": null}, "options": [{"id": "bzQGo", "text": "$(0, \\infty)$", "image": null, "isCorrect": false}, {"id": "hFDzT", "text": "$(e, \\infty)$", "image": null, "isCorrect": false}, {"id": "7nd7h", "text": "$(-\\infty, 0)$", "image": null, "isCorrect": false}, {"id": "qYJSn", "text": "$[\\mathrm{e}, \\infty)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$y=\\frac{x}{\\log x} \\Rightarrow \\frac{d y}{d x}=\\frac{\\log x \\times 1-x \\times \\frac{1}{x}}{(\\log x)^2}=\\frac{(\\log x)-1}{(\\log x)^2}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/0JxzrQ5N4jm2Pphk8Tg0UOP1M_uSNRcAmDoufEmyBDM.original.fullsize.png\">\n$f(x)$ is increasing in $[e, \\infty)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261320279619d9d8a2a97", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}], "question": {"text": "The function $f(x)=2 x^3-9 x^2+12 x+29$ is monotonically increasing in the interval", "image": null}, "options": [{"id": "Ajwll", "text": "$(-\\infty, 1) \\cup(2, \\infty)$", "image": null, "isCorrect": true}, {"id": "2Gi1i", "text": "$(-\\infty, \\infty)$", "image": null, "isCorrect": false}, {"id": "bVCl7", "text": "$(2, \\infty)$", "image": null, "isCorrect": false}, {"id": "C8Pmv", "text": "$(-\\infty, 1)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$f(x)=2 x^3-9 x^2+12 x+29$\n$\\Rightarrow f^{\\prime}(x)=6 x^2-18 x+12=6(x-1)(x-2)$ sign scheme\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/4e8-IZkV7_dik8b4050Dq7GolkmopmUJAwGavLUHgqQ.original.fullsize.png\">\n$\\Rightarrow f(x)$ is increasing in the interval\n$x \\varepsilon(\\infty-, 1) \\cup(2, \\infty)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T09:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 1)", "title": "MHT CET 2022 (07 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261120279619d9d8a2991", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}], "question": {"text": "The function $f(x)=\\frac{\\log (\\pi+x)}{\\log (e+x)}$ is", "image": null}, "options": [{"id": "2C39v", "text": "decreasing on $\\left(0, \\frac{\\pi}{\\mathrm{e}}\\right)$, increasing on $\\left(\\frac{\\pi}{\\mathrm{e}}, \\infty\\right)$", "image": null, "isCorrect": false}, {"id": "4Q7lc", "text": "increasing on $\\left(0, \\frac{\\pi}{\\mathrm{e}}\\right)$, decreasing on $\\left(\\frac{\\pi}{\\mathrm{e}}, \\infty\\right)$", "image": null, "isCorrect": false}, {"id": "KnbCf", "text": "increasing on $(0, \\infty)$", "image": null, "isCorrect": false}, {"id": "jLseI", "text": "decreasing on $(0, \\infty)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{f}(\\mathrm{x})=\\frac{\\log (\\pi+\\mathrm{x})}{\\log (\\mathrm{e}+\\mathrm{x})} \\\\ & \\Rightarrow \\mathrm{f}^{\\prime}(\\mathrm{x})=\\frac{\\frac{1}{\\pi+\\mathrm{x}} \\log (\\mathrm{e}+\\mathrm{x})-\\log (\\pi+\\mathrm{x}) \\times \\frac{1}{\\mathrm{e}+\\mathrm{x}}}{\\{\\log (\\mathrm{e}+\\mathrm{x})\\}^2} \\\\ & \\Rightarrow \\mathrm{f}^{\\prime}(\\mathrm{x})=\\frac{(\\mathrm{e}+\\mathrm{x}) \\log (\\mathrm{e}+\\mathrm{x})-(\\pi+\\mathrm{x}) \\log (\\pi+\\mathrm{x})}{(\\pi+\\mathrm{x})(\\mathrm{e}+\\mathrm{x})\\{\\log (\\mathrm{e}+\\mathrm{x})\\}^2}\\end{aligned}$\nLet $g(x)=(e+x) \\log (e+x)-(\\pi+x) \\log (\\pi+x)$\n$\\Rightarrow \\mathrm{g}^{\\prime}(\\mathrm{x})=\\log (\\mathrm{e}+\\mathrm{x})-\\log (\\pi+\\mathrm{x})<0$\nSo, $\\mathrm{g}(\\mathrm{x})$ is decreasing\n$$\n\\begin{aligned}\n& \\Rightarrow \\mathrm{g}(\\mathrm{x})<\\mathrm{g}(0) \\forall \\mathrm{x} \\in(0, \\infty) \\\\\n& \\Rightarrow(\\mathrm{e}+\\mathrm{x}) \\log (\\mathrm{e}+\\mathrm{x})-(\\pi+\\mathrm{x}) \\log (\\pi+\\mathrm{x})<\\mathrm{e} \\log \\mathrm{e}-\\pi \\log \\pi<0 \\\\\n& \\Rightarrow \\mathrm{f}^{\\prime}(\\mathrm{x})<0 \\forall \\mathrm{x} \\in(0, \\infty) \\\\\n& \\Rightarrow \\mathrm{f}(\\mathrm{x}) \\text { is decreasing on }(0, \\infty)\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-06T09:00:00.000Z", "isVisible": true, "shortName": "2022 (06 Aug Shift 1)", "title": "MHT CET 2022 (06 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260ff0279619d9d8a28f5", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "The function $\\mathrm{f}(\\mathrm{x})$ is defined by $\\mathrm{f}(\\mathrm{x})=(\\mathrm{x}+2) \\mathrm{e}^{-\\mathrm{x}}$ is", "image": null}, "options": [{"id": "ul5RB", "text": "monotonically decreasing in $(-1, \\infty)$ and monotonically increasing in $(-\\infty,-1)$", "image": null, "isCorrect": true}, {"id": "I8xpu", "text": "decreasing for all $\\mathrm{x}$", "image": null, "isCorrect": false}, {"id": "SVbnJ", "text": "increasing for all $\\mathrm{x}$", "image": null, "isCorrect": false}, {"id": "Jfeee", "text": "decreasing in $(-\\infty,-1)$ and increasing in $(-1, \\infty)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & \\mathrm{f}(\\mathrm{x})=(\\mathrm{x}+2) \\mathrm{e}^{-\\mathrm{x}} \\Rightarrow \\mathrm{f} \\mathrm{P}^{\\prime}(\\mathrm{x})=\\mathrm{e}^{-\\mathrm{x}}-(\\mathrm{x}+2) \\mathrm{e}^{-\\mathrm{x}}=\\mathrm{e}^{-\\mathrm{x}}(1-\\mathrm{x}-2) \\\\ & \\Rightarrow \\mathrm{f}^{\\prime}(\\mathrm{x})=-\\mathrm{e}^{-\\mathrm{x}}(1+\\mathrm{x}) \\text { sign scheme }\\end{aligned}$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/y_hFOOIzbDEezhqLMHQ0Eyf8kkieceWTvuQ5X4DUGOs.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260b30279619d9d8a269a", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}], "question": {"text": "Function $\\mathrm{f}(\\mathrm{x})=\\mathrm{e}^{-1 / \\mathrm{x}}$ is strictly increasing for all $\\mathrm{x}$ where", "image": null}, "options": [{"id": "ZBS3U", "text": "$\\mathrm{x}$ is only positive real number", "image": null, "isCorrect": false}, {"id": "VIfxb", "text": "$\\mathrm{x}$ is only negative real number", "image": null, "isCorrect": false}, {"id": "rS4Iv", "text": "$\\mathrm{x}$ is a real number", "image": null, "isCorrect": false}, {"id": "mHHpl", "text": "$\\mathrm{x}$ is a non - zero real number", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& f(x)=e^{-\\frac{1}{x}} \\\\\n& f^{\\prime}(x)=e^{-\\frac{1}{x}}(-1)\\left(\\frac{-1}{x^2}\\right)=\\frac{1}{x^2 e^{\\frac{1}{x}}}\n\\end{aligned}\n$$\nWhen $\\mathrm{f}^{\\prime}(\\mathrm{x})>0, \\mathrm{x}^2 \\mathrm{e}^{\\frac{1}{\\mathrm{x}}}>0$ and $\\mathrm{x} \\neq 0$\nNow $\\mathrm{x}^2>0$ and $\\mathrm{e}^{\\frac{1}{\\mathrm{x}}}>0$ for $\\forall \\mathrm{x} \\in \\mathrm{R}$\nHence $f(x)$ is an increasing function for $\\forall x$, except $x=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T14:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 2)", "title": "MHT CET 2021 (23 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260a00279619d9d8a2604", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "$\\mathrm{F}(\\mathrm{x})=\\log |\\sin \\mathrm{x}|$, where $\\mathrm{x} \\in(0, \\pi)$ is strictly increasing on", "image": null}, "options": [{"id": "E9zeU", "text": "$\\left(\\frac{\\pi}{2}, \\pi\\right)$ only", "image": null, "isCorrect": false}, {"id": "B7QO2", "text": "$(0, \\pi)$ only", "image": null, "isCorrect": false}, {"id": "mXmgr", "text": "$\\left(0, \\frac{\\pi}{2}\\right)$ only", "image": null, "isCorrect": true}, {"id": "WEAE4", "text": "$\\left(\\frac{\\pi}{4}, \\frac{3 \\pi}{4}\\right)$ only", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$f(x)=\\log |\\sin x|$, where $x \\in(0, \\pi)$\n$\\therefore \\mathrm{f}^{\\prime}(\\mathrm{x})=\\frac{1}{\\sin \\mathrm{x}} \\times \\cos \\mathrm{x}=\\cot \\mathrm{x}$\nWhen $\\mathrm{f}^{\\prime}(\\mathrm{x})>0$, we say $\\frac{\\cos \\mathrm{x}}{\\sin \\mathrm{x}}>0$\nHere $\\sin x>0 \\ldots[x \\in(0, \\pi)]$\nfor the function to be strictly increasing, $\\cos x>0$\n$\\rightarrow \\mathrm{x} \\in\\left(0, \\frac{\\pi}{2}\\right)$ only.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2608d0279619d9d8a256e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "The function $f(x)=\\frac{\\lambda \\sin x+6 \\cos x}{2 \\sin x+3 \\cos x}$ is increasing, if", "image": null}, "options": [{"id": "rO8mm", "text": "$\\lambda>2$", "image": null, "isCorrect": true}, {"id": "Qsk1U", "text": "$\\lambda < 4$", "image": null, "isCorrect": false}, {"id": "MPNIl", "text": "$\\lambda \\geq 4$", "image": null, "isCorrect": false}, {"id": "3JbeN", "text": "$\\lambda>1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& f(x)=\\frac{\\lambda \\sin x+6 \\cos x}{2 \\sin x+3 \\cos x} \\\\\n& f^{\\prime}(x)=\\frac{\\{[(2 \\sin x+3 \\cos x)(\\lambda \\cos x-6 \\sin x]-[\\lambda \\sin x+6 \\cos x)(2 \\cos x-3 \\sin x)]\\}}{(2 \\sin x+3 \\cos x)^2}\n\\end{aligned}\n$$\nWhen $\\mathrm{f}^{\\prime}(\\mathrm{x}) \\geq 0$, we get\n$$\n\\begin{aligned}\n& {\\left[\\left(2 \\lambda \\sin \\mathrm{x} \\cos \\mathrm{x}+3 \\lambda \\cos ^2 \\mathrm{x}-12 \\sin ^2 \\mathrm{x}-18 \\sin \\mathrm{x} \\cos \\mathrm{x}\\right)\\right.} \\\\\n& \\left.-\\left(2 \\lambda \\sin \\mathrm{x} \\cos \\mathrm{x}+12 \\cos ^2 \\mathrm{x}-3 \\lambda \\sin ^2 \\mathrm{x}-18 \\operatorname{sun} \\mathrm{x} \\cos \\mathrm{x}\\right)\\right] \\geq 0 \\\\\n& \\therefore 3 \\lambda\\left(\\sin ^2 \\mathrm{x}+\\cos ^2 \\mathrm{x}\\right)-12\\left(\\sin ^2 \\mathrm{x}+\\cos ^2 \\mathrm{x}\\right) \\geq 0 \\\\\n& \\therefore 3 \\lambda-12 \\geq 0 \\Rightarrow \\lambda \\geq 4\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260640279619d9d8a2421", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "The function $\\mathrm{f}(\\mathrm{x})=\\log (1+\\mathrm{x})-\\frac{2 \\mathrm{x}}{2+\\mathrm{x}}$ is increasing on", "image": null}, "options": [{"id": "Yf3um", "text": "$(-\\infty, \\infty)$", "image": null, "isCorrect": false}, {"id": "6ypUH", "text": "$(-5, \\infty)$", "image": null, "isCorrect": false}, {"id": "5kpFe", "text": "$(-\\infty, 0)$", "image": null, "isCorrect": false}, {"id": "vStTG", "text": "$(-1, \\infty)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{f}(\\mathrm{x})=\\log (1+\\mathrm{x})-\\frac{2 \\mathrm{x}}{2+\\mathrm{x}} \\Rightarrow \\mathrm{x} \\neq-2 \\\\\n& \\begin{aligned}\n\\therefore \\mathrm{f}^{\\prime}(\\mathrm{x}) & =\\frac{1}{(1+\\mathrm{x})}-\\left[\\frac{(2+\\mathrm{x})(2)-(2 \\mathrm{x})(1)}{(2+\\mathrm{x})^2}\\right] \\\\\n& =\\frac{1}{1+\\mathrm{x}}-\\left[\\frac{4}{(2+\\mathrm{x})^2}\\right]=\\frac{(\\mathrm{x}+2)^2-4(\\mathrm{x}+1)}{(\\mathrm{x}+2)^2(1+\\mathrm{x})}\n\\end{aligned}\n\\end{aligned}\n$$\nWhen $f^{\\prime}(x)>0$, we write\n$$\n\\frac{x^2}{(x+2)^2(1+x)}>0\n$$\nSince $x^2>0$ and $(x+2)^2>0$, we write $(1+x)>0 \\Rightarrow x>-1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260560279619d9d8a23a8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "The function $f(x)=\\cot ^{-1} x+x$ is increasing in the interval.", "image": null}, "options": [{"id": "77wNi", "text": "$(-\\infty, \\infty)$", "image": null, "isCorrect": true}, {"id": "HRoHY", "text": "$(0,3)$", "image": null, "isCorrect": false}, {"id": "f0KWm", "text": "$(1, \\infty)$", "image": null, "isCorrect": false}, {"id": "5xkaI", "text": "$(-1, \\infty)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\mathrm{f}(\\mathrm{x})=\\cot ^{-1} \\mathrm{x}+\\mathrm{x} \\\\\n& \\therefore \\mathrm{f}^{\\prime}(\\mathrm{x})=\\frac{-1}{1+\\mathrm{x}^2}+1=\\frac{-1+1+\\mathrm{x}^2}{1+\\mathrm{x}^2}=\\frac{\\mathrm{x}^2}{1+\\mathrm{x}^2} \\\\\n& \\text { Here } \\mathrm{x}^2 \\geq 0 \\Rightarrow \\frac{\\mathrm{x}^2}{1+\\mathrm{x}^2} \\geq 0\n\\end{aligned}\n$$\nHence $\\mathrm{f}(\\mathrm{x})$ is always increasing.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2601f0279619d9d8a21f1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}], "question": {"text": "The function $f(x)=3 x^{4}+16 x^{3}-30 x^{2}+10$ is increasing for", "image": null}, "options": [{"id": "Qtcj7", "text": "every real value of $x$", "image": null, "isCorrect": false}, {"id": "JgmwE", "text": "$x=0, x=1$ only", "image": null, "isCorrect": false}, {"id": "0jtK0", "text": "$x \\in(-5,0) \\cup(1, \\infty)$", "image": null, "isCorrect": true}, {"id": "PYwZu", "text": "$x \\in[0,1]$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$f(x)=3 x^{4}+16 x^{3}-30 x^{2}+10$\n$\\therefore f^{\\prime}(x)=12 x^{3}+48 x^{2}-60 x$\nWhen $f^{\\prime}(x)>0$, we write\n$\\quad x\\left(12 x^{2}+48 x-60\\right)>0$\n$12 x\\left(x^{2}+4 x-5\\right)>0$\n$\\therefore f^{\\prime}(x)>0$, when $x \\in(-5,0) \\cup(1, \\infty)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f74", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T14:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 2)", "title": "MHT CET 2020 (20 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fd10279619d9d8a1f7c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}], "question": {"text": "For every value of $x$, the function $f(x)=\\frac{1}{a^{x}}, a>0$ is", "image": null}, "options": [{"id": "TbYBX", "text": "decreasing", "image": null, "isCorrect": true}, {"id": "9EjkN", "text": "increasing", "image": null, "isCorrect": false}, {"id": "uuPzw", "text": "Constant", "image": null, "isCorrect": false}, {"id": "duxdU", "text": "Neither increasing nor decreasing", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(D)\n$\\begin{aligned}\n\\mathrm{f}(\\mathrm{x})=& \\frac{1}{\\mathrm{a}^{\\mathrm{x}}}=\\mathrm{a}^{-\\mathrm{x}} \\\\\n\\therefore \\quad \\mathrm{f}^{\\prime}(\\mathrm{x}) &=-\\mathrm{a}^{-\\mathrm{x}} \\cdot \\log _{e} \\mathrm{a}=-\\frac{\\log _{\\mathrm{e}} \\mathrm{a}}{\\mathrm{a}^{\\mathrm{x}}}= < 0\n\\end{aligned}$\nSo $\\mathrm{f}(\\mathrm{x})$ is decreasing for all $\\mathrm{x}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f70", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T14:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 2)", "title": "MHT CET 2020 (16 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f890279619d9d8a1d47", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "The function $f(x)=\\log x-\\frac{2 x}{x+2}$", "image": null}, "options": [{"id": "YmbbM", "text": "$x \\in(-\\infty, 1)$", "image": null, "isCorrect": false}, {"id": "qwOnK", "text": "$x \\in(-1, \\infty)$", "image": null, "isCorrect": false}, {"id": "fdpWl", "text": "$x \\in(-\\infty, 0)$", "image": null, "isCorrect": false}, {"id": "2vPF4", "text": "$x\\in(0, \\infty)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n\\text { Given } f(x) &=\\log x-\\frac{2 x}{x+2} \\\\\n\\therefore f^{\\prime}(x) &=\\frac{1}{x}-\\left[\\frac{(x+2)(2)-(2 x)(1)}{(x+2)^{2}}\\right] \\\\\n&=\\frac{1}{x}-\\left[\\frac{4}{(x+2)^{2}}\\right]=\\frac{x^{2}+4 x}{x(x+2)^{2}} \\\\\n&=\\frac{x(x+4)}{x(x+2)^{2}}\n\\end{aligned}\n$$\nFor $f^{\\prime}(x)>0, x \\neq 0$ and $x>-4$\nHence $x \\in(0, \\infty)$ is permissible.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f160279619d9d8a19aa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "The function <math><mi>f</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mo>=</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>3</mn></mrow></msup><mo>-</mo><mn>3</mn><mi>x</mi></math> is….", "image": null}, "options": [{"id": "T1Bfo", "text": "Increasing in <math><mfenced separators=\"|\"><mrow><mo>-</mo><mi>∞</mi><mo>,</mo><mo>-</mo><mn>1</mn></mrow></mfenced><mo>∪</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi>∞</mi></mrow></mfenced></math> and decreasing in <math><mfenced separators=\"|\"><mrow><mo>-</mo><mn>1,1</mn></mrow></mfenced></math>", "image": null, "isCorrect": true}, {"id": "znusk", "text": "Increasing in <math><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi>∞</mi></mrow></mfenced></math> and decreasing in <math><mfenced separators=\"|\"><mrow><mo>-</mo><mi>∞</mi><mo>,</mo><mn>0</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "Bddxm", "text": "Decreasing in <math><mfenced separators=\"|\"><mrow><mn>0</mn><mo>,</mo><mi>∞</mi></mrow></mfenced></math> and increasing in <math> \"|\"><mrow><mo>-</mo><mi>∞</mi><mo>,</mo><mo>-</mo><mn>1</mn></mrow></mfenced></math> , <math><mo>∪</mo><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi>∞</mi></mrow></mfenced></math> and decreasing in (-1, 1).", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25edb0279619d9d8a17d7", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "If <math><mi>f</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mi>x</mi></mrow><mrow><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>1</mn></mrow></mfrac></math> is increasing function then the value of <math><mi>x</mi></math> lies in", "image": null}, "options": [{"id": "VkjOc", "text": "<math><mi>R</mi></math>", "image": null, "isCorrect": false}, {"id": "IMQce", "text": "<math><mfenced separators=\"|\"><mrow><mo>-</mo><mi>∞</mi><mo>,</mo><mi> </mi><mo>-</mo><mn>1</mn></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "UmTID", "text": "<math><mfenced separators=\"|\"><mrow><mn>1</mn><mo>,</mo><mi> </mi><mi>∞</mi></mrow></mfenced></math>", "image": null, "isCorrect": false}, {"id": "DpWJT", "text": "<math><mfenced separators=\"|\"><mrow><mo>-</mo><mn>1</mn><mo>,</mo><mi>&nbsp;</mi><mn>1</mn></mrow></mfenced></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<math> <mrow> <mi>f</mi><mrow><mo>(</mo> <mi>x</mi> <mo>)</mo></mrow><mo>=</mo><mfrac> <mi>x</mi> <mrow> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo><mn>1</mn></mrow> </mfrac> </mrow> </math><br /><math> <mrow> <mi>f</mi><mo>'</mo><mrow><mo>(</mo> <mi>x</mi> <mo>)</mo></mrow><mo>=</mo><mfrac> <mrow> <mrow><mo>(</mo> <mrow> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo><mn>1</mn></mrow> <mo>)</mo></mrow><mo>−</mo><mi>x</mi><mrow><mo>(</mo> <mrow> <mn>2</mn><mi>x</mi></mrow> <mo>)</mo></mrow></mrow> <mrow> <msup> <mrow> <mrow><mo>(</mo> <mrow> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo><mn>1</mn></mrow> <mo>)</mo></mrow></mrow> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mo>−</mo><msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo><mn>1</mn></mrow> <mrow> <msup> <mrow> <mrow><mo>(</mo> <mrow> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo><mn>1</mn></mrow> <mo>)</mo></mrow></mrow> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br />Since f(x) is increasing function,<br /><math> <mrow> <mi>f</mi><mo>'</mo><mrow><mo>(</mo> <mi>x</mi> <mo>)</mo></mrow><mo>&gt;</mo><mn>0</mn></mrow> </math><br /><math> <mrow> <mo>∴</mo><mrow><mo>(</mo> <mrow> <mo>−</mo><msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo><mn>1</mn></mrow> <mo>)</mo></mrow><mo>&gt;</mo><mn>0</mn></mrow> </math> as <math> <mrow> <msup> <mi>x</mi> <mn>2</mn> </msup> <mo>+</mo><mn>1</mn></mrow> </math> is always positive<br /><math> <mrow> <mo>∴</mo><msup> <mi>x</mi> <mn>2</mn> </msup> <mo>−</mo><mn>1</mn><mo>&lt;</mo><mn>0</mn></mrow> </math><br /><math> <mrow> <mo>∴</mo><mrow><mo>(</mo> <mrow> <mi>x</mi><mo>−</mo><mn>1</mn></mrow> <mo>)</mo></mrow><mrow><mo>(</mo> <mrow> <mi>x</mi><mo>+</mo><mn>1</mn></mrow> <mo>)</mo></mrow><mo>&lt;</mo><mn>0</mn></mrow> </math><br /><math> <mrow> <mi>∴&nbsp;x</mi><mo>∈</mo><mrow><mo>(</mo> <mrow> <mo>−</mo><mn>1</mn><mo>,</mo><mn>1</mn></mrow> <mo>)</mo></mrow></mrow> </math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4b0279619d9d8a1348", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "If $f(x)=k x-\\sin x$ is monotonically increasing, then", "image": null}, "options": [{"id": "i2HtN", "text": "$k>1$", "image": null, "isCorrect": true}, {"id": "yLLKW", "text": "$k>-1$", "image": null, "isCorrect": false}, {"id": "Ko1pM", "text": "$k < 1$", "image": null, "isCorrect": false}, {"id": "qMccG", "text": "$k < -1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since, $f(x)=k x-\\sin x$ is monotonically increasing for all $x \\in R$. Therefore,\n$$\nf^{\\prime}(x)>0 \\text { for all } x \\in R\n$$\n$\\therefore \\quad f^{\\prime}(0)>0$\n$$\n\\begin{array}{lr}\n\\Rightarrow & k-\\cos 0>0 \\\\\n\\Rightarrow & k>1\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4b0279619d9d8a1347", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The function $f(x)=\\log (1+x)-\\frac{2 x}{2+x}$ is increasing on", "image": null}, "options": [{"id": "y3bCS", "text": "$(0, \\infty)$", "image": null, "isCorrect": true}, {"id": "8ezJl", "text": "$(-\\infty, 0)$", "image": null, "isCorrect": false}, {"id": "dLrFB", "text": "$(-\\infty, \\infty)$", "image": null, "isCorrect": false}, {"id": "vaHJA", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $f(x)=\\log (1+x)-\\frac{2 x}{2+x}$\n$$\n\\begin{aligned}\n\\therefore \\quad f^{\\prime}(x) &=\\frac{1}{1+x}-\\frac{(2+x) \\cdot 2-2 x}{(2+x)^{2}} \\\\\n&=\\frac{x^{2}}{(1+x)(x+2)^{2}}\n\\end{aligned}\n$$\nClearly, $f^{\\prime}(x)>0$ for all $x>0$. Hence, $f(x)$ is increasing on $(0, \\infty)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263380279619d9d8a3d24", "title": "Maxima Minima", "totalQuestions": 83, "questions": [{"_id": "6abb88d915a9fc0fc8c14786", "type": "singleCorrect", "question": {"text": "If $f(x) = 5x^3 + 2x^2 - 3x + 1$ has a local maxima and a local minima at $x = \\sin\\theta, \\pi < \\theta < \\dfrac{3\\pi}{2}$ and $x = \\cos\\phi, \\dfrac{3\\pi}{2} < \\phi < 2\\pi$ respectively, then $(\\tan\\theta)(\\tan\\phi) = \\ldots$", "image": null}, "options": [{"id": "VSPs4", "label": "A", "text": "$\\dfrac{3\\sqrt{3}}{2}$", "isCorrect": false, "image": null}, {"id": "x9PLU", "label": "B", "text": "$\\dfrac{-3\\sqrt{3}}{2}$", "isCorrect": false, "image": null}, {"id": "vQrgN", "label": "C", "text": "$\\dfrac{3\\sqrt{2}}{2}$", "isCorrect": false, "image": null}, {"id": "J7OMf", "label": "D", "text": "$\\dfrac{-3\\sqrt{2}}{2}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $f(x) = 5x^3 + 2x^2 - 3x + 1$<br><br>Differentiating with respect to $x$:<br><br>$f'(x) = 15x^2 + 4x - 3$<br><br>For local maxima and minima, $f'(x) = 0$:<br><br>$15x^2 + 9x - 5x - 3 = 0$<br><br>$3x(5x + 3) - 1(5x + 3) = 0$<br><br>$(3x - 1)(5x + 3) = 0$<br><br>$x = \\dfrac{1}{3}$ or $x = -\\dfrac{3}{5}$<br><br>Finding the second derivative:<br><br>$f''(x) = 30x + 4$<br><br>At $x = -\\dfrac{3}{5}$, $f''\\left(-\\dfrac{3}{5}\\right) = -14 < 0$, so $x = -\\dfrac{3}{5}$ is a point of local maxima.<br><br>At $x = \\dfrac{1}{3}$, $f''\\left(\\dfrac{1}{3}\\right) = 14 > 0$, so $x = \\dfrac{1}{3}$ is a point of local minima.<br><br>Given that local maxima is at $x = \\sin\\theta$ for $\\pi < \\theta < \\dfrac{3\\pi}{2}$:<br><br>$\\sin\\theta = -\\dfrac{3}{5}$<br><br>Since $\\theta$ is in the third quadrant, $\\tan\\theta$ is positive:<br><br>$\\tan\\theta = \\dfrac{3}{4}$<br><br>Given that local minima is at $x = \\cos\\phi$ for $\\dfrac{3\\pi}{2} < \\phi < 2\\pi$:<br><br>$\\cos\\phi = \\dfrac{1}{3}$<br><br>Since $\\phi$ is in the fourth quadrant, $\\tan\\phi$ is negative:<br><br>$\\tan\\phi = -\\sqrt{\\sec^2\\phi - 1} = -\\sqrt{9 - 1} = -2\\sqrt{2}$<br><br>Therefore, $(\\tan\\theta)(\\tan\\phi) = \\left(\\dfrac{3}{4}\\right)(-2\\sqrt{2}) = \\dfrac{-3\\sqrt{2}}{2}$<br><br>Answer: $\\dfrac{-3\\sqrt{2}}{2}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88a815a9fc0fc8c145c5", "type": "singleCorrect", "question": {"text": "The maximum volume (in cubic units) of a right circular cylinder for which the sum of the square of its height and the square of its radius of base $48$, is", "image": null}, "options": [{"id": "h8R63", "label": "A", "text": "$48\\pi$", "isCorrect": false, "image": null}, {"id": "39xrs", "label": "B", "text": "$64\\pi$", "isCorrect": false, "image": null}, {"id": "MeME5", "label": "C", "text": "$128\\pi$", "isCorrect": true, "image": null}, {"id": "UnZGX", "label": "D", "text": "$16\\pi$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let $r$ be the radius of the base and $h$ be the height of the cylinder.<br><br>Given that the sum of the squares of the height and the radius is $48$:<br><br>$r^2 + h^2 = 48 \\Rightarrow r^2 = 48 - h^2$<br><br>The volume of the cylinder is given by:<br><br>$V = \\pi r^2 h$<br><br>Substituting the value of $r^2$:<br><br>$V = \\pi (48 - h^2) h = \\pi (48h - h^3)$<br><br>To find the maximum volume, differentiate $V$ with respect to $h$ and equate it to zero:<br><br>$\\dfrac{dV}{dh} = \\pi (48 - 3h^2) = 0$<br><br>$3h^2 = 48 \\Rightarrow h^2 = 16 \\Rightarrow h = 4$<br><br>Differentiating again to check for maxima:<br><br>$\\dfrac{d^2V}{dh^2} = -6\\pi h$<br><br>At $h = 4$, $\\dfrac{d^2V}{dh^2} = -24\\pi < 0$, which confirms that the volume is maximum.<br><br>Substituting $h = 4$ into the equation for $r^2$:<br><br>$r^2 = 48 - 16 = 32$<br><br>The maximum volume is:<br><br>$V = \\pi (32)(4) = 128\\pi$<br><br>Answer: $128\\pi$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887815a9fc0fc8c14403", "type": "singleCorrect", "question": {"text": "A rectangular sheet of paper has its area $32$ meters$^2$. The margins at the top and bottom are $50$ cm each and at the sides $25$ cm each. If the area of the printed space is maximum, then the dimensions of the paper are", "image": null}, "options": [{"id": "zJ3ez", "label": "A", "text": "$16$ meters and $2$ meters", "isCorrect": false, "image": null}, {"id": "bbpZm", "label": "B", "text": "$30$ meters and $2$ meters", "isCorrect": false, "image": null}, {"id": "kldrs", "label": "C", "text": "$8$ meters and $4$ meters", "isCorrect": true, "image": null}, {"id": "jixDO", "label": "D", "text": "$25$ meters and $7$ meters", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the dimensions of the rectangular sheet of paper be $x$ meters and $y$ meters.<br><br>The area of the paper is given as $xy = 32 \\Rightarrow y = \\dfrac{32}{x}$.<br><br>The margins at the top and bottom are $50$ cm $= 0.5$ m each, so the total vertical margin is $1$ m.<br><br>The margins at the sides are $25$ cm $= 0.25$ m each, so the total horizontal margin is $0.5$ m.<br><br>The dimensions of the printed space are $(x - 0.5)$ and $(y - 1)$.<br><br>The area of the printed space is $A = (x - 0.5)(y - 1)$.<br><br>Substituting $y = \\dfrac{32}{x}$, we get:<br><br>$A = (x - 0.5)\\left(\\dfrac{32}{x} - 1\\right)$<br><br>$A = 32 - x - \\dfrac{16}{x} + 0.5$<br><br>$A = 32.5 - \\left(x + \\dfrac{16}{x}\\right)$<br><br>For the printed area $A$ to be maximum, the term $\\left(x + \\dfrac{16}{x}\\right)$ must be minimum.<br><br>Using the AM-GM inequality for positive numbers $x$ and $\\dfrac{16}{x}$:<br><br>$\\dfrac{x + \\dfrac{16}{x}}{2} \\geq \\sqrt{x \\times \\dfrac{16}{x}}$<br><br>$x + \\dfrac{16}{x} \\geq 2 \\times 4 = 8$<br><br>The minimum value is attained when $x = \\dfrac{16}{x} \\Rightarrow x^2 = 16 \\Rightarrow x = 4$ meters.<br><br>When $x = 4$, $y = \\dfrac{32}{4} = 8$ meters.<br><br>Thus, the dimensions of the paper are $8$ meters and $4$ meters.<br><br>Answer: $8$ meters and $4$ meters", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3588c30a4553e1be2c3", "type": "singleCorrect", "question": {"text": "On the interval $[0, 1]$, the function $f(x) = x^{25}(1 - x)^{75}$ attains its maximum value at the point $x = $....", "image": null}, "options": [{"id": "Aq9Xr", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "TNhMx", "label": "B", "text": "$\\dfrac{1}{4}$", "isCorrect": true, "image": null}, {"id": "PM84S", "label": "C", "text": "$\\dfrac{1}{2}$", "isCorrect": false, "image": null}, {"id": "7CKsk", "label": "D", "text": "$\\dfrac{1}{3}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $f(x) = x^{25}(1 - x)^{75}$<br><br>Differentiating with respect to $x$:<br><br>$f'(x) = 25x^{24}(1 - x)^{75} - 75x^{25}(1 - x)^{74}$<br><br>$f'(x) = 25x^{24}(1 - x)^{74} [ (1 - x) - 3x ]$<br><br>$f'(x) = 25x^{24}(1 - x)^{74} (1 - 4x)$<br><br>For maximum or minimum, $f'(x) = 0$<br><br>$25x^{24}(1 - x)^{74} (1 - 4x) = 0$<br><br>$x = 0, 1, \\dfrac{1}{4}$<br><br>At $x = 0$ and $x = 1$, $f(x) = 0$.<br><br>For $x \\in (0, 1)$, $f(x) > 0$.<br><br>Thus, $f(x)$ attains its maximum value at $x = \\dfrac{1}{4}$.<br><br>Answer: $\\dfrac{1}{4}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7c", "title": "MHT CET 2026 (20 April Shift 1)", "shortName": "2026 (20 April Shift 1)", "isVisible": true, "heldOn": "2026-04-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3048c30a4553e1bdf41", "type": "singleCorrect", "question": {"text": "A tank with a rectangular base and rectangular sides, open at the top is made. Depth of the tank is $4$ m and its volume is $36$ cubic meters. For making a tank cost of base material used is Rs. $100$ per sq. meter and that of sides is Rs. $50$ per sq. meter. Then minimum cost of tank is ..............", "image": null}, "options": [{"id": "22nr2", "label": "A", "text": "Rs. $1100$", "isCorrect": false, "image": null}, {"id": "i8eC2", "label": "B", "text": "Rs. $2200$", "isCorrect": false, "image": null}, {"id": "L3K9a", "label": "C", "text": "Rs. $3300$", "isCorrect": true, "image": null}, {"id": "Tgomp", "label": "D", "text": "Rs. $4400$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the length and breadth of the base of the tank be $x$ and $y$ respectively.<br><br>Given depth $h = 4$ m and volume $V = 36$ m$^3$.<br><br>$V = x \\times y \\times h \\Rightarrow 4xy = 36 \\Rightarrow xy = 9$<br><br>Cost of the base $= 100 \\times xy = 100 \\times 9 = 900$<br><br>Area of the four sides $= 2(xh + yh) = 2(4)(x + y) = 8(x + y)$<br><br>Cost of the sides $= 50 \\times 8(x + y) = 400(x + y)$<br><br>Total cost $C = 900 + 400(x + y)$<br><br>To minimize $C$, we need to minimize $x + y$.<br><br>Using AM-GM inequality for $x, y > 0$:<br><br>$\\dfrac{x + y}{2} \\geq \\sqrt{xy}$<br><br>$x + y \\geq 2\\sqrt{9} = 6$<br><br>Minimum value of $x + y$ is $6$, which occurs when $x = y = 3$.<br><br>Minimum cost $C = 900 + 400(6) = 900 + 2400 = 3300$<br><br>Answer: Rs. $3300$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d34a8c30a4553e1be22f", "type": "singleCorrect", "question": {"text": "The coordinates of the points on the curve $4y = x^2$ that are nearest to the point $(0,5)$ are ...", "image": null}, "options": [{"id": "aa8jd", "label": "A", "text": "$(-2\\sqrt{3}, 3)$", "isCorrect": true, "image": null}, {"id": "hTGyy", "label": "B", "text": "$(2\\sqrt{3}, -3)$", "isCorrect": false, "image": null}, {"id": "hRI1c", "label": "C", "text": "$(3, 2\\sqrt{3})$", "isCorrect": false, "image": null}, {"id": "fvEj3", "label": "D", "text": "$(2\\sqrt{3}, 2)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the point on the curve be $(x, y)$.<br><br>The square of the distance $S$ between $(x, y)$ and $(0, 5)$ is given by:<br><br>$S = x^2 + (y - 5)^2$<br><br>Since the point lies on the curve $4y = x^2$, we substitute $x^2 = 4y$ into the equation for $S$:<br><br>$S = 4y + (y - 5)^2$<br><br>$S = y^2 - 6y + 25$<br><br>To find the minimum distance, we differentiate $S$ with respect to $y$ and equate it to zero:<br><br>$\\dfrac{dS}{dy} = 2y - 6 = 0$<br><br>$y = 3$<br><br>Since $\\dfrac{d^2S}{dy^2} = 2 > 0$, the distance is minimum at $y = 3$.<br><br>Substituting $y = 3$ in $x^2 = 4y$, we get:<br><br>$x^2 = 12 \\Rightarrow x = \\pm 2\\sqrt{3}$<br><br>The points on the curve nearest to $(0, 5)$ are $(2\\sqrt{3}, 3)$ and $(-2\\sqrt{3}, 3)$.<br><br>Answer: $(-2\\sqrt{3}, 3)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a77", "title": "MHT CET 2026 (17 April Shift 2)", "shortName": "2026 (17 April Shift 2)", "isVisible": true, "heldOn": "2026-04-17T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2cc8c30a4553e1bdce7", "type": "singleCorrect", "question": {"text": "The number 28 is divided into two positive parts such that the sum of the cube of one part and the square of the other part is minimum, then the absolute difference between the two parts is", "image": null}, "options": [{"id": "tJGHO", "label": "A", "text": "$24$", "isCorrect": false, "image": null}, {"id": "OYNyk", "label": "B", "text": "$12$", "isCorrect": false, "image": null}, {"id": "4o9rx", "label": "C", "text": "$8$", "isCorrect": false, "image": null}, {"id": "NPf1b", "label": "D", "text": "$20$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Let the two positive parts of $28$ be $x$ and $28 - x$, where $0 < x < 28$.<br><br>Let $S$ be the sum of the cube of one part and the square of the other part. Then,<br><br>$S = x^3 + (28 - x)^2$<br><br>To find the min
