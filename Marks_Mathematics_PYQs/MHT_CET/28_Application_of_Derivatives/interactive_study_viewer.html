ariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi>x</mi><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi>x</mi></mrow></mrow></mrow></mrow></mrow></mfenced></math> is verified on <math><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mfrac><mrow><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac><mo>,</mo><mfrac><mrow><mn>5</mn><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></mrow></mfenced></math> then the value of <math> <mi>c</mi> </math> is", "image": null}, "options": [{"id": "A0BiF", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>3</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "glurF", "text": "<math><mfrac><mrow><mi>π</mi></mrow><mrow><mn>2</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "jD2cD", "text": "<math><mfrac><mrow><mn>3</mn><mi>π</mi></mrow><mrow><mn>4</mn></mrow></mfrac></math>", "image": null, "isCorrect": false}, {"id": "WQVH5", "text": "<math><mi>π</mi></math>", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given, <math><mi>f</mi><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mo>=</mo><msup><mrow><mi>e</mi></mrow><mrow><mi>x</mi></mrow></msup><mo>(</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi> </mi><mi>x</mi><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi> </mi><mi>x</mi></mrow></mrow></mrow></mrow><mo>)</mo></math> <br/> <math><mo>∴</mo><mi> </mi><mi> </mi><msup><mrow><mi>f</mi></mrow><mrow><mi>&prime;</mi></mrow></msup><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mo>=</mo><msup><mrow><mi>e</mi></mrow><mrow><mi>x</mi></mrow></msup><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi> </mi><mi>x</mi><mo>+</mo><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi> </mi><mi>x</mi></mrow></mrow></mrow></mrow></mrow></mfenced><mo>+</mo><mfenced close=\"]\" open=\"[\" separators=\"|\"><mrow><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi> </mi><mi>x</mi><mo>-</mo><mrow><mrow><mi mathvariant=\"normal\">cos</mi></mrow><mo>⁡</mo><mrow><mi> </mi><mi>x</mi></mrow></mrow></mrow></mrow></mrow></mfenced><msup><mrow><mi>e</mi></mrow><mrow><mi>x</mi></mrow></msup></math> <br/> <math><mo>∴</mo><mi> </mi><mi> </mi><msup><mrow><mi>f</mi></mrow><mrow><mi>&prime;</mi></mrow></msup><mfenced separators=\"|\"><mrow><mi>x</mi></mrow></mfenced><mo>=</mo><mn>2</mn><msup><mrow><mi>e</mi></mrow><mrow><mi>x</mi></mrow></msup><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi> </mi><mi>x</mi></mrow></mrow></math>  <br/>To verify Rolle's Theorem.<br/> <math><msup><mrow><mi>f</mi></mrow><mrow><mi>&prime;</mi></mrow></msup><mfenced separators=\"|\"><mrow><mi>c</mi></mrow></mfenced><mo>=</mo><mn>0</mn></math> <br/> <math><mn>2</mn><msup><mrow><mi>e</mi></mrow><mrow><mi>c</mi></mrow></msup><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi> </mi><mi>c</mi><mo>=</mo><mn>0</mn></mrow></mrow></math> <br/> <math><mo>⇒</mo><mi> </mi><mrow><mrow><mi mathvariant=\"normal\">sin</mi></mrow><mo>⁡</mo><mrow><mi> </mi><mi>c</mi><mo>=</mo><mn>0</mn></mrow></mrow></math> <br/> <math><mo>∴</mo><mi> </mi><mi> </mi><mi>c</mi><mo>=</mo><mi>π</mi></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f61", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2016-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2016", "title": "MHT CET 2016"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e940279619d9d8a1593", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "For all real $x$, the minimum value of $\\frac{1-x+x^{2}}{1+x+x^{2}}$ is", "image": null}, "options": [{"id": "qOyfp", "text": "0", "image": null, "isCorrect": false}, {"id": "pPRp7", "text": "$1 / 3$", "image": null, "isCorrect": true}, {"id": "LXn0Q", "text": "1", "image": null, "isCorrect": false}, {"id": "kI3DL", "text": "3", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $y=\\frac{1-x+x^{2}}{1+x+x^{2}}=1-\\frac{2 x}{1+x+x^{2}}$\n$$\n\\begin{aligned}\n&=1-\\frac{2}{\\frac{1}{x}+1+x} \\\\\n\\Rightarrow \\quad y &=1-\\frac{2}{t}\n\\end{aligned}\n$$\nwhere\n$$\nt=\\frac{1}{x}+1+x\n$$\nNow, $y$ is minimum, when $\\frac{2}{t}$ is $\\max \\Rightarrow t$ is $\\mathrm{min}$.\n$$\n\\begin{array}{lc}\n\\therefore & \\frac{d t}{d x}=-\\frac{1}{x^{2}}+1=0 \\\\\n\\Rightarrow \\quad x=\\pm 1 \\\\\n\\frac{d^{2} t}{d x^{2}}=\\frac{2}{x^{3}}>0, \\text { for } x=1\n\\end{array}\n$$\n$\\therefore$ Minimum value of $y$ is\n$$\n\\begin{aligned}\n1-\\frac{2}{1+1+1} &=1-\\frac{2}{3} \\\\\n&=\\frac{1}{3}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "6abb890c15a9fc0fc8c1479b", "title": "Tangent to circle", "totalQuestions": 1, "questions": [{"_id": "6abb88a815a9fc0fc8c145c4", "type": "singleCorrect", "question": {"text": "If the slope of the tangent to the curve $2y^2 = ax^2 + b$ at $(1, -1)$ is $-1$, then ...", "image": null}, "options": [{"id": "QrCIt", "label": "A", "text": "$a = 2$ and $b = 0$", "isCorrect": true, "image": null}, {"id": "C9RBt", "label": "B", "text": "$a = 2$ and $b = 1$", "isCorrect": false, "image": null}, {"id": "Otzp1", "label": "C", "text": "$a = 0$ and $b = 1$", "isCorrect": false, "image": null}, {"id": "CeDwx", "label": "D", "text": "$a = 1$ and $b = 2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of the curve is $2y^2 = ax^2 + b$.<br><br>Since the point $(1, -1)$ lies on the curve, substituting $x = 1$ and $y = -1$ gives:<br>$2(-1)^2 = a(1)^2 + b$<br>$a + b = 2$<br><br>Differentiating the equation of the curve with respect to $x$, we get:<br>$4y \\dfrac{dy}{dx} = 2ax$<br>$\\dfrac{dy}{dx} = \\dfrac{ax}{2y}$<br><br>The slope of the tangent at $(1, -1)$ is given as $-1$. Substituting $x = 1$ and $y = -1$ into the derivative:<br>$\\dfrac{a(1)}{2(-1)} = -1$<br>$-\\dfrac{a}{2} = -1$<br>$a = 2$<br><br>Substituting $a = 2$ into the equation $a + b = 2$, we get:<br>$2 + b = 2$<br>$b = 0$<br><br>Thus, $a = 2$ and $b = 0$.<br><br>Answer: $a = 2$ and $b = 0$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}]}]};
    let currentTopicIndex = 0;
    let allSolutionsOpen = false;

    function toggleTheme() {
      const body = document.body;
      const isDark = body.getAttribute('data-theme') === 'dark';
      body.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    const pillsContainer = document.getElementById('topic-pills');
    data.topics.forEach((t, i) => {
      const pill = document.createElement('div');
      pill.className = 'topic-pill' + (i === 0 ? ' active' : '');
      pill.innerHTML = `<span>${t.index}. ${t.title}</span><span class="count">${t.totalQuestions}</span>`;
      pill.onclick = () => selectTopic(i);
      pillsContainer.appendChild(pill);
    });

    function selectTopic(index) {
      currentTopicIndex = index;
      document.querySelectorAll('.topic-pill').forEach((p, i) => {
        p.classList.toggle('active', i === index);
      });

      const topic = data.topics[index];
      document.getElementById('current-topic-title').textContent = `${topic.index}. ${topic.title}`;
      document.getElementById('current-topic-count').textContent = `${topic.totalQuestions} Questions`;

      renderQuestions(topic.questions);
    }

    function renderQuestions(questions) {
      const container = document.getElementById('questions-list');
      let html = '';

      questions.forEach((q, idx) => {
        const papers = (q.previousYearPapers || []).map(p => p.title).join(', ') || 'MHT CET';
        const qText = q.question ? q.question.text : '';
        const options = q.options || [];
        const isNumeric = q.type === 'numerical';
        let correctOptionText = '';

        html += `
          <div class="q-card">
            <div class="q-meta-line">
              <span class="q-number-badge">Q${idx + 1}</span>
              <span class="q-exam-tag">${papers}</span>
              <span class="q-type-tag">${isNumeric ? 'Numeric / Integer' : 'Single Correct'} &bull; Level ${q.level || 1}</span>
            </div>
            <div class="q-text">${qText}</div>
        `;

        if (options && options.length > 0) {
          html += '<div class="options-grid">';
          options.forEach((opt, oIdx) => {
            const letter = String.fromCharCode(65 + oIdx);
            const optText = opt.text || opt;
            if (opt.isCorrect) correctOptionText = `(${letter}) ${optText}`;
            html += `
              <div class="option-row">
                <span class="option-letter">(${letter})</span>
                <div class="option-body">${optText}</div>
              </div>
            `;
          });
          html += '</div>';
        }

        const val = q.correctValue;
        const solText = (q.solution && q.solution.text) ? q.solution.text : '';

        html += `
          <div class="solution-accordion">
            <details class="q-solution-details">
              <summary>View Answer & Detailed Solution</summary>
              <div class="solution-inner">
                ${correctOptionText ? `<div class="answer-highlight">Correct Option: ${correctOptionText}</div>` : ''}
                ${(val !== null && val !== undefined) ? `<div class="answer-highlight">Correct Value: ${val}</div>` : ''}
                ${solText ? `<div><b>Step-by-Step Solution:</b><br/>${solText}</div>` : '<div><em>No solution explanation provided.</em></div>'}
              </div>
            </details>
          </div>
        </div>`;
      });

      container.innerHTML = html;
      renderAllMath(container);
    }

    function renderAllMath(target) {
      const el = target || document.getElementById('questions-list');
      if (!el) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(el, {
            delimiters: [
              {left: '$$', right: '$$', display: true},
              {left: '$', right: '$', display: false},
              {left: '\\(', right: '\\)', display: false},
              {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
          });
        } catch (e) {
          console.warn('KaTeX error:', e);
        }
      } else if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(err => console.log('MathJax error:', err));
      } else {
        setTimeout(() => renderAllMath(el), 120);
      }
    }

    function toggleAllSolutions() {
      allSolutionsOpen = !allSolutionsOpen;
      document.querySelectorAll('.q-solution-details').forEach(d => {
        d.open = allSolutionsOpen;
      });
      document.getElementById('toggle-all-btn').textContent = allSolutionsOpen ? '🙈 Hide Solutions' : '👁️ Show Solutions';
    }

    window.addEventListener('DOMContentLoaded', () => selectTopic(0));
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      selectTopic(0);
    }
  </script>
</body>
</html>
