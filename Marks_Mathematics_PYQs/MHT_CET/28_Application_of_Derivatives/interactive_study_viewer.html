 to the given line.<br><br>The equation of the given line is $x - y + 1 = 0$, which has a slope of $1$.<br><br>The equation of the curve is $x = y^2$. Differentiating with respect to $x$, we get:<br><br>$1 = 2y \\dfrac{dy}{dx} \\Rightarrow \\dfrac{dy}{dx} = \\dfrac{1}{2y}$<br><br>Equating the slope of the tangent to the slope of the line:<br><br>$\\dfrac{1}{2y} = 1 \\Rightarrow y = \\dfrac{1}{2}$<br><br>Substituting $y = \\dfrac{1}{2}$ into the equation of the curve, we get $x = \\left(\\dfrac{1}{2}\\right)^2 = \\dfrac{1}{4}$.<br><br>The point on the curve closest to the line is $\\left(\\dfrac{1}{4}, \\dfrac{1}{2}\\right)$.<br><br>The perpendicular distance $d$ from this point to the line $x - y + 1 = 0$ is:<br><br>$d = \\dfrac{\\left|\\dfrac{1}{4} - \\dfrac{1}{2} + 1\\right|}{\\sqrt{1^2 + (-1)^2}}$<br><br>$d = \\dfrac{\\left|\\dfrac{3}{4}\\right|}{\\sqrt{2}} = \\dfrac{3}{4\\sqrt{2}}$<br><br>Rationalizing the denominator, we get:<br><br>$d = \\dfrac{3\\sqrt{2}}{8}$<br><br>Answer: $\\frac{3 \\sqrt{2}}{8}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f70", "heldOn": "2025-04-20T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (20 Apr Shift 1)", "title": "MHT CET 2025 (20 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b1ebf9280d7f9932669", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If two curves $x^2-4 y^2=2$ and $8 x^2=40-\\mathrm{my}^2$ are orthogonal to each other then $\\mathrm{m}=$", "image": null}, "options": [{"id": "EaGlg", "text": "$2$", "image": null, "isCorrect": false}, {"id": "3etUC", "text": "$16$", "image": null, "isCorrect": true}, {"id": "OkuaP", "text": "$\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "xmzjo", "text": "$4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Differentiating the equation of the first curve $x^2 - 4y^2 = 2$ with respect to $x$:<br><br>$2x - 8y \\dfrac{dy}{dx} = 0 \\Rightarrow \\dfrac{dy}{dx} = \\dfrac{x}{4y}$<br><br>Let the slope of the first curve at the point of intersection $(x, y)$ be $m_1 = \\dfrac{x}{4y}$.<br><br>Differentiating the equation of the second curve $8x^2 = 40 - my^2$ with respect to $x$:<br><br>$16x = -2my \\dfrac{dy}{dx} \\Rightarrow \\dfrac{dy}{dx} = -\\dfrac{8x}{my}$<br><br>Let the slope of the second curve at $(x, y)$ be $m_2 = -\\dfrac{8x}{my}$.<br><br>Since the curves are orthogonal, $m_1 m_2 = -1$:<br><br>$\\left(\\dfrac{x}{4y}\\right) \\left(-\\dfrac{8x}{my}\\right) = -1$<br><br>$\\dfrac{2x^2}{my^2} = 1 \\Rightarrow my^2 = 2x^2$<br><br>Substituting $my^2 = 2x^2$ into the equation of the second curve:<br><br>$8x^2 = 40 - 2x^2$<br><br>$10x^2 = 40 \\Rightarrow x^2 = 4$<br><br>Substituting $x^2 = 4$ into the equation of the first curve:<br><br>$4 - 4y^2 = 2 \\Rightarrow 4y^2 = 2 \\Rightarrow y^2 = \\dfrac{1}{2}$<br><br>Using $my^2 = 2x^2$, we get:<br><br>$m \\left(\\dfrac{1}{2}\\right) = 2(4)$<br><br>$\\dfrac{m}{2} = 8 \\Rightarrow m = 16$<br><br>Answer: $16$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b1ebf9280d7f9932666", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the tangent at $(1,7)$ to the curve $x^2=y-6$ touches the circle $x^2+\\mathrm{y}^2+16 \\mathrm{x}+12 \\mathrm{y}+\\mathrm{C}=0$, then $\\mathrm{C}=$", "image": null}, "options": [{"id": "gVJqj", "text": "$85$", "image": null, "isCorrect": false}, {"id": "UX1pY", "text": "$95$", "image": null, "isCorrect": true}, {"id": "7cqoN", "text": "$185$", "image": null, "isCorrect": false}, {"id": "9oa4q", "text": "$195$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the curve is $x^2 = y - 6$.<br><br>Differentiating with respect to $x$, we get:<br><br>$2x = \\dfrac{dy}{dx}$<br><br>At the point $(1, 7)$, the slope of the tangent is $m = 2(1) = 2$.<br><br>The equation of the tangent at $(1, 7)$ is:<br><br>$y - 7 = 2(x - 1)$<br><br>$2x - y + 5 = 0$<br><br>The given circle is $x^2 + y^2 + 16x + 12y + C = 0$.<br><br>The center of the circle is $(-8, -6)$ and its radius is $r = \\sqrt{8^2 + 6^2 - C} = \\sqrt{100 - C}$.<br><br>Since the tangent line touches the circle, the perpendicular distance from the center of the circle to the line must be equal to the radius of the circle.<br><br>The perpendicular distance $d$ from $(-8, -6)$ to the line $2x - y + 5 = 0$ is:<br><br>$d = \\dfrac{|2(-8) - (-6) + 5|}{\\sqrt{2^2 + (-1)^2}}$<br><br>$d = \\dfrac{|-16 + 6 + 5|}{\\sqrt{5}}$<br><br>$d = \\dfrac{|-5|}{\\sqrt{5}} = \\sqrt{5}$<br><br>Equating the distance to the radius:<br><br>$\\sqrt{100 - C} = \\sqrt{5}$<br><br>Squaring both sides, we get:<br><br>$100 - C = 5$<br><br>$C = 95$<br><br>Answer: $95$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b1ebf9280d7f9932664", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The equation of tangent to the curve $\\mathrm{y}=\\cos (x+\\mathrm{y})$ where $-2 \\pi \\leq x \\leq 2 \\pi$ and which is parallel to the line $x+2 \\mathrm{y}=0$, is", "image": null}, "options": [{"id": "5l1NL", "text": "$2 x+4 y+\\pi=0$", "image": null, "isCorrect": false}, {"id": "OVg80", "text": "$2 x+4 y-\\pi=0$", "image": null, "isCorrect": true}, {"id": "Kdsr1", "text": "$2 x+4 y-3 \\pi=0$", "image": null, "isCorrect": false}, {"id": "rcBIJ", "text": "$2 x-4 y+3 \\pi=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given the equation of the curve: $y = \\cos(x+y)$<br><br>Differentiating both sides with respect to $x$, we get:<br>$\\dfrac{dy}{dx} = -\\sin(x+y) \\left(1 + \\dfrac{dy}{dx}\\right)$<br><br>Since the tangent is parallel to the line $x + 2y = 0$, its slope is $m = -\\dfrac{1}{2}$. Thus, $\\dfrac{dy}{dx} = -\\dfrac{1}{2}$.<br><br>Substituting $\\dfrac{dy}{dx} = -\\dfrac{1}{2}$ into the derivative equation:<br>$-\\dfrac{1}{2} = -\\sin(x+y) \\left(1 - \\dfrac{1}{2}\\right)$<br><br>$-\\dfrac{1}{2} = -\\dfrac{1}{2} \\sin(x+y)$<br><br>$\\sin(x+y) = 1$<br><br>Using the identity $\\sin^2(x+y) + \\cos^2(x+y) = 1$, we find:<br>$\\cos(x+y) = 0$<br><br>From the original equation of the curve, $y = \\cos(x+y)$, so $y = 0$.<br><br>Substituting $y = 0$ into $\\sin(x+y) = 1$, we get:<br>$\\sin x = 1$<br><br>Given the interval $-2\\pi \\leq x \\leq 2\\pi$, the possible values for $x$ are $\\dfrac{\\pi}{2}$ and $-\\dfrac{3\\pi}{2}$.<br>Thus, the points of tangency are $\\left(\\dfrac{\\pi}{2}, 0\\right)$ and $\\left(-\\dfrac{3\\pi}{2}, 0\\right)$.<br><br>The equation of the tangent at the point $\\left(\\dfrac{\\pi}{2}, 0\\right)$ with slope $-\\dfrac{1}{2}$ is:<br>$y - 0 = -\\dfrac{1}{2} \\left(x - \\dfrac{\\pi}{2}\\right)$<br><br>$2y = -x + \\dfrac{\\pi}{2}$<br><br>$2x + 4y - \\pi = 0$<br><br>This matches one of the given options.<br><br>Answer: $2 x+4 y-\\pi=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b1bbf9280d7f9932656", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A normal is drawn at a point $\\mathrm{P}(x, y)$ of a curve $\\mathrm{y}=\\mathrm{f}(x)$. The normal meets the X axis at $\\mathrm{Q} . l(\\mathrm{PQ})=\\mathrm{k} .(\\mathrm{k}$ is a constant $)$\nThen equation of the curve through $(0, \\mathrm{k})$ is", "image": null}, "options": [{"id": "eAc3a", "text": "$x^2+\\mathrm{y}^2=\\mathrm{k}^2$", "image": null, "isCorrect": true}, {"id": "m8MfR", "text": "$(1+\\mathrm{k}) x^2+\\mathrm{y}^2=\\mathrm{k}^2$", "image": null, "isCorrect": false}, {"id": "JXWQB", "text": "$x^2+\\left(1+\\mathrm{k}^2\\right) \\mathrm{y}^2=\\mathrm{k}^2$", "image": null, "isCorrect": false}, {"id": "yoa2n", "text": "$x^2+2 \\mathrm{y}^2=2 \\mathrm{k}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the normal to the curve $y = f(x)$ at point $P(x, y)$ is given by:<br><br>$Y - y = -\\dfrac{dx}{dy}(X - x)$<br><br>The normal meets the X-axis at $Q$, so we substitute $Y = 0$:<br><br>$-y = -\\dfrac{dx}{dy}(X - x)$<br><br>$X = x + y\\dfrac{dy}{dx}$<br><br>Thus, the coordinates of $Q$ are $\\left(x + y\\dfrac{dy}{dx}, 0\\right)$.<br><br>The length of the segment $PQ$ is given as $k$. Using the distance formula:<br><br>$PQ^2 = \\left(x + y\\dfrac{dy}{dx} - x\\right)^2 + (0 - y)^2$<br><br>$k^2 = y^2\\left(\\dfrac{dy}{dx}\\right)^2 + y^2$<br><br>$y^2\\left(\\dfrac{dy}{dx}\\right)^2 = k^2 - y^2$<br><br>$y\\dfrac{dy}{dx} = \\pm\\sqrt{k^2 - y^2}$<br><br>Separating the variables:<br><br>$\\dfrac{y}{\\sqrt{k^2 - y^2}}dy = \\pm dx$<br><br>Integrating both sides:<br><br>$\\int \\dfrac{y}{\\sqrt{k^2 - y^2}}dy = \\pm \\int dx$<br><br>$-\\sqrt{k^2 - y^2} = \\pm x + C$<br><br>The curve passes through the point $(0, k)$. Substituting $x = 0$ and $y = k$:<br><br>$-\\sqrt{k^2 - k^2} = \\pm 0 + C$<br><br>$C = 0$<br><br>Substituting $C = 0$ back into the equation:<br><br>$-\\sqrt{k^2 - y^2} = \\pm x$<br><br>Squaring both sides:<br><br>$k^2 - y^2 = x^2$<br><br>$x^2 + y^2 = k^2$<br><br>Answer: $x^2+\\mathrm{y}^2=\\mathrm{k}^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6f", "heldOn": "2025-04-19T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 2)", "title": "MHT CET 2025 (19 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b08bf9280d7f99325c9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The angle between the curves $x \\mathrm{y}=6$ and $x^2 \\mathrm{y}=12$ is", "image": null}, "options": [{"id": "zYCfy", "text": "$\\tan ^{-1} \\frac{3}{11}$", "image": null, "isCorrect": true}, {"id": "gdSr0", "text": "$\\tan ^{-1} \\frac{11}{3}$", "image": null, "isCorrect": false}, {"id": "53AyO", "text": "$\\tan ^{-1} \\frac{2}{11}$", "image": null, "isCorrect": false}, {"id": "jcyJs", "text": "$\\tan ^{-1} \\frac{1}{11}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given curves are $xy = 6$ and $x^2y = 12$.<br><br>Solving these equations to find the point of intersection:<br><br>$x(xy) = 12 \\Rightarrow x(6) = 12 \\Rightarrow x = 2$<br><br>Substituting $x = 2$ in $xy = 6$, we get $y = 3$.<br><br>The point of intersection is $(2, 3)$.<br><br>Differentiating $xy = 6$ with respect to $x$:<br><br>$x \\dfrac{dy}{dx} + y = 0 \\Rightarrow \\dfrac{dy}{dx} = -\\dfrac{y}{x}$<br><br>Slope of the first curve at $(2, 3)$ is $m_1 = -\\dfrac{3}{2}$.<br><br>Differentiating $x^2y = 12$ with respect to $x$:<br><br>$x^2 \\dfrac{dy}{dx} + 2xy = 0 \\Rightarrow \\dfrac{dy}{dx} = -\\dfrac{2y}{x}$<br><br>Slope of the second curve at $(2, 3)$ is $m_2 = -\\dfrac{2(3)}{2} = -3$.<br><br>The angle $\\theta$ between the curves is given by:<br><br>$\\tan \\theta = \\left| \\dfrac{m_1 - m_2}{1 + m_1 m_2} \\right|$<br><br>$\\tan \\theta = \\left| \\dfrac{-\\dfrac{3}{2} - (-3)}{1 + \\left(-\\dfrac{3}{2}\\right)(-3)} \\right|$<br><br>$\\tan \\theta = \\left| \\dfrac{\\dfrac{3}{2}}{1 + \\dfrac{9}{2}} \\right| = \\left| \\dfrac{\\dfrac{3}{2}}{\\dfrac{11}{2}} \\right| = \\dfrac{3}{11}$<br><br>$\\theta = \\tan^{-1} \\left( \\dfrac{3}{11} \\right)$<br><br>Answer: $\\tan ^{-1} \\frac{3}{11}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214500aee93fa0796dfa3", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "The equation of the normal to the curve $y=x \\log x$ parallel to $2 x-2 y+3=0$ is", "image": null}, "options": [{"id": "Rqdkw", "text": "$x+y=3 \\mathrm{e}^{-2}$", "image": null, "isCorrect": false}, {"id": "t8IxX", "text": "$x-y=3 \\mathrm{e}^{-2}$", "image": null, "isCorrect": true}, {"id": "JIr5k", "text": "$x-y=3 \\mathrm{e}^2$", "image": null, "isCorrect": false}, {"id": "2VG2w", "text": "$x+y=3 \\mathrm{e}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given curve is $y = x \\log x$.<br><br>Differentiating with respect to $x$, we get:<br><br>$\\dfrac{dy}{dx} = x \\cdot \\dfrac{1}{x} + \\log x \\cdot 1 = 1 + \\log x$<br><br>The normal is parallel to the line $2x - 2y + 3 = 0$, which has a slope of $1$.<br><br>Therefore, the slope of the normal is $m_N = 1$.<br><br>The slope of the tangent is the negative reciprocal of the slope of the normal, so $m_T = -1$.<br><br>Equating the derivative to the slope of the tangent:<br><br>$1 + \\log x = -1$<br><br>$\\log x = -2$<br><br>$x = \\mathrm{e}^{-2}$<br><br>Substituting $x = \\mathrm{e}^{-2}$ into the equation of the curve to find the $y$-coordinate:<br><br>$y = \\mathrm{e}^{-2} \\log(\\mathrm{e}^{-2}) = -2\\mathrm{e}^{-2}$<br><br>The point of contact is $(\\mathrm{e}^{-2}, -2\\mathrm{e}^{-2})$.<br><br>The equation of the normal is given by:<br><br>$y - y_1 = m_N(x - x_1)$<br><br>$y - (-2\\mathrm{e}^{-2}) = 1(x - \\mathrm{e}^{-2})$<br><br>$y + 2\\mathrm{e}^{-2} = x - \\mathrm{e}^{-2}$<br><br>$x - y = 3\\mathrm{e}^{-2}$<br><br>Answer: $x-y=3 \\mathrm{e}^{-2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792143a0aee93fa0796def9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}], "question": {"text": "If $\\theta$ denotes the acute angle between the curves $y=10-x^2$ and $y=2+x^2$, at a point of the intersection, then $|\\tan \\theta|$ is equal to", "image": null}, "options": [{"id": "1814U", "text": "$\\frac{8}{15}$", "image": null, "isCorrect": true}, {"id": "g0mUJ", "text": "$\\frac{8}{17}$", "image": null, "isCorrect": false}, {"id": "CUXCU", "text": "$\\frac{4}{9}$", "image": null, "isCorrect": false}, {"id": "4BW9U", "text": "$\\frac{7}{17}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "To find the points of intersection, equate the equations of the two curves:<br><br>$10 - x^2 = 2 + x^2$<br><br>$2x^2 = 8 \\Rightarrow x^2 = 4 \\Rightarrow x = \\pm 2$<br><br>Let us consider the point of intersection where $x = 2$.<br><br>Differentiating the first curve $y = 10 - x^2$ with respect to $x$:<br><br>$\\dfrac{dy}{dx} = -2x$<br><br>At $x = 2$, the slope of the first curve is $m_1 = -4$.<br><br>Differentiating the second curve $y = 2 + x^2$ with respect to $x$:<br><br>$\\dfrac{dy}{dx} = 2x$<br><br>At $x = 2$, the slope of the second curve is $m_2 = 4$.<br><br>The acute angle $\\theta$ between the two curves is given by:<br><br>$|\\tan \\theta| = \\left| \\dfrac{m_1 - m_2}{1 + m_1 m_2} \\right|$<br><br>$|\\tan \\theta| = \\left| \\dfrac{-4 - 4}{1 + (-4)(4)} \\right|$<br><br>$|\\tan \\theta| = \\left| \\dfrac{-8}{1 - 16} \\right| = \\left| \\dfrac{-8}{-15} \\right| = \\dfrac{8}{15}$<br><br>Answer: $\\frac{8}{15}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccf", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T09:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 1)", "title": "MHT CET 2024 (16 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214030aee93fa0796dd49", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "If the normal to the curve $y=\\mathrm{f}(x)$ at the point (3,4) makes an angle of $\\left(\\frac{3 \\pi}{4}\\right)$ with the positive X -axis, then the value of $\\mathrm{f}^{\\prime}(3)$ is", "image": null}, "options": [{"id": "KycoY", "text": "-1", "image": null, "isCorrect": false}, {"id": "MAGfO", "text": "$-\\frac{3}{4}$", "image": null, "isCorrect": false}, {"id": "cOQaX", "text": "$\\frac{4}{3}$", "image": null, "isCorrect": false}, {"id": "bHsAn", "text": "1", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The slope of the normal to the curve at the point $(3, 4)$ is given by $m_n = \\tan\\left(\\dfrac{3\\pi}{4}\\right) = -1$.<br><br>The slope of the tangent to the curve at $x = 3$ is $m_t = \\mathrm{f}^{\\prime}(3)$.<br><br>Since the tangent and normal are perpendicular to each other, their slopes satisfy $m_t \\times m_n = -1$.<br><br>$\\mathrm{f}^{\\prime}(3) \\times (-1) = -1$<br><br>$\\mathrm{f}^{\\prime}(3) = 1$<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214000aee93fa0796dd37", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}], "question": {"text": "The curve $y=a x^3+b x^2+c x+5$ touches the $X$-axis at $(-2,0)$ and cuts the $Y^{\\prime}$-axis at a point Q where its gradient is 3 , then values of $\\mathrm{a}, \\mathrm{b}, \\mathrm{c}$ respectively, are", "image": null}, "options": [{"id": "TYdAZ", "text": "$3,-\\frac{1}{2},-\\frac{3}{4}$", "image": null, "isCorrect": false}, {"id": "KM5YJ", "text": "$-\\frac{3}{4},-\\frac{1}{2}, 3$", "image": null, "isCorrect": false}, {"id": "ScuMX", "text": "$-\\frac{1}{2},-\\frac{3}{4}, 3$", "image": null, "isCorrect": true}, {"id": "zT7xN", "text": "$-\\frac{1}{2}, 3,-\\frac{3}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the curve is $y = a x^3 + b x^2 + c x + 5$.<br><br>The gradient of the curve is given by $\\dfrac{dy}{dx} = 3a x^2 + 2b x + c$.<br><br>The curve cuts the Y-axis at $x = 0$. The gradient at this point is given as 3.<br><br>Substituting $x = 0$ in $\\dfrac{dy}{dx}$:<br><br>$\\left(\\dfrac{dy}{dx}\\right)_{x=0} = c = 3$<br><br>The curve touches the X-axis at $(-2, 0)$, which means the point $(-2, 0)$ lies on the curve and the gradient at this point is 0.<br><br>Substituting $x = -2, y = 0$ in the equation of the curve:<br><br>$0 = a(-2)^3 + b(-2)^2 + 3(-2) + 5$<br><br>$-8a + 4b - 1 = 0$<br><br>$8a - 4b = -1$  ... (i)<br><br>Substituting $x = -2$ in $\\dfrac{dy}{dx} = 0$:<br><br>$3a(-2)^2 + 2b(-2) + 3 = 0$<br><br>$12a - 4b + 3 = 0$<br><br>$12a - 4b = -3$  ... (ii)<br><br>Subtracting equation (i) from equation (ii):<br><br>$(12a - 4b) - (8a - 4b) = -3 - (-1)$<br><br>$4a = -2 \\Rightarrow a = -\\dfrac{1}{2}$<br><br>Substituting $a = -\\dfrac{1}{2}$ in equation (i):<br><br>$8\\left(-\\dfrac{1}{2}\\right) - 4b = -1$<br><br>$-4 - 4b = -1$<br><br>$-4b = 3 \\Rightarrow b = -\\dfrac{3}{4}$<br><br>Thus, the values of $a, b, c$ are $-\\dfrac{1}{2}, -\\dfrac{3}{4}, 3$ respectively.<br><br>Answer: $-\\frac{1}{2},-\\frac{3}{4}, 3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccd", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 2)", "title": "MHT CET 2024 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213ed0aee93fa0796dca2", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "If equation of normal to the curve $x=\\sqrt{t}$, $y=\\mathrm{t}-\\frac{1}{\\sqrt{\\mathrm{t}}}$ at $\\mathrm{t}=4$ is", "image": null}, "options": [{"id": "A1YEp", "text": "$8 x+2 y=23$", "image": null, "isCorrect": false}, {"id": "pVKBh", "text": "$34 x-8 y=40$", "image": null, "isCorrect": false}, {"id": "GoGNZ", "text": "$8 x+6 y=37$", "image": null, "isCorrect": false}, {"id": "LXKUh", "text": "$8 x+34 y=135$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given $x = \\sqrt{t}$ and $y = t - \\dfrac{1}{\\sqrt{t}}$.<br><br>At $t = 4$, $x = \\sqrt{4} = 2$ and $y = 4 - \\dfrac{1}{\\sqrt{4}} = \\dfrac{7}{2}$.<br><br>The point on the curve is $\\left(2, \\dfrac{7}{2}\\right)$.<br><br>Differentiating with respect to $t$:<br><br>$\\dfrac{dx}{dt} = \\dfrac{1}{2\\sqrt{t}}$<br><br>$\\dfrac{dy}{dt} = 1 + \\dfrac{1}{2t\\sqrt{t}}$<br><br>At $t = 4$:<br><br>$\\dfrac{dx}{dt} = \\dfrac{1}{4}$<br><br>$\\dfrac{dy}{dt} = 1 + \\dfrac{1}{16} = \\dfrac{17}{16}$<br><br>The slope of the tangent is $\\dfrac{dy}{dx} = \\dfrac{\\dfrac{dy}{dt}}{\\dfrac{dx}{dt}} = \\dfrac{\\dfrac{17}{16}}{\\dfrac{1}{4}} = \\dfrac{17}{4}$.<br><br>The slope of the normal is $m = -\\dfrac{1}{\\dfrac{dy}{dx}} = -\\dfrac{4}{17}$.<br><br>The equation of the normal is $y - \\dfrac{7}{2} = -\\dfrac{4}{17}(x - 2)$.<br><br>$17y - \\dfrac{119}{2} = -4x + 8$<br><br>$34y - 119 = -8x + 16$<br><br>$8x + 34y = 135$<br><br>Answer: $8 x+34 y=135$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213db0aee93fa0796dc0d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "If $y=4 x-5$ is a tangent to the curve $y^2=\\mathrm{p} x^3+\\mathrm{q}$ at $(2,3)$, then the values of p and q are respectively", "image": null}, "options": [{"id": "1pR7t", "text": "$-2,7$", "image": null, "isCorrect": false}, {"id": "IaZfp", "text": "$7,-2$", "image": null, "isCorrect": false}, {"id": "fiRzS", "text": "$2,-7$", "image": null, "isCorrect": true}, {"id": "LDmEP", "text": "$-7,-2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The point $(2,3)$ lies on the curve $y^2 = p x^3 + q$. Substituting $x=2$ and $y=3$:<br><br>$3^2 = p(2)^3 + q$<br><br>$8p + q = 9$<br><br>Differentiating the equation of the curve with respect to $x$:<br><br>$2y \\dfrac{dy}{dx} = 3p x^2$<br><br>$\\dfrac{dy}{dx} = \\dfrac{3p x^2}{2y}$<br><br>The slope of the tangent at $(2,3)$ is:<br><br>$\\left. \\dfrac{dy}{dx} \\right|_{(2,3)} = \\dfrac{3p(2)^2}{2(3)} = 2p$<br><br>The given tangent line is $y = 4x - 5$, which has a slope of $4$. Equating the slopes:<br><br>$2p = 4$<br><br>$p = 2$<br><br>Substituting $p = 2$ into the first equation:<br><br>$8(2) + q = 9$<br><br>$16 + q = 9$<br><br>$q = -7$<br><br>The values of $p$ and $q$ are $2$ and $-7$ respectively.<br><br>Answer: $2,-7$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c90aee93fa0796db84", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "The equation of the normal to the curve $y=x \\log x$, which is parallel to the line $2 x-2 y+3=0$, is", "image": null}, "options": [{"id": "U5dAQ", "text": "$x+y=3 \\mathrm{e}^{-2}$", "image": null, "isCorrect": false}, {"id": "2y5lg", "text": "$\\quad x-y=3 \\mathrm{e}^{-2}$", "image": null, "isCorrect": true}, {"id": "RsLyx", "text": "$x-y=3 \\mathrm{e}^2$", "image": null, "isCorrect": false}, {"id": "kf99Q", "text": "$x+y=3 \\mathrm{e}^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given the equation of the curve $y = x \\log x$.<br><br>Differentiating with respect to $x$, we get:<br><br>$\\dfrac{dy}{dx} = \\log x + x \\left(\\dfrac{1}{x}\\right) = 1 + \\log x$<br><br>The slope of the normal to the curve is given by $-\\dfrac{1}{\\dfrac{dy}{dx}} = -\\dfrac{1}{1 + \\log x}$.<br><br>The normal is parallel to the line $2x - 2y + 3 = 0$, which can be rewritten as $y = x + \\dfrac{3}{2}$. The slope of this line is $1$.<br><br>Equating the slopes, we get:<br><br>-\\dfrac{1}{1 + \\log x} = 1$<br><br>$1 + \\log x = -1$<br><br>$\\log x = -2 \\Rightarrow x = e^{-2}$<br><br>Substituting $x = e^{-2}$ into the equation of the curve to find the $y$-coordinate:<br><br>$y = e^{-2} \\log(e^{-2}) = -2e^{-2}$<br><br>The point of contact is $(e^{-2}, -2e^{-2})$.<br><br>The equation of the normal at this point with slope $1$ is:<br><br>$y - (-2e^{-2}) = 1(x - e^{-2})$<br><br>$y + 2e^{-2} = x - e^{-2}$<br><br>$x - y = 3e^{-2}$<br><br>Answer: $\\quad x-y=3 \\mathrm{e}^{-2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213c60aee93fa0796db6c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}], "question": {"text": "The curve $x^4-2 x y^2+y^2+3 x-3 y=0$ cuts the X -axis at $(0,0)$ at an angle of", "image": null}, "options": [{"id": "LPrUU", "text": "$\\dfrac{\\pi}{4}$", "image": null, "isCorrect": true}, {"id": "34pq8", "text": "$\\dfrac{\\pi}{2}$", "image": null, "isCorrect": false}, {"id": "gKz54", "text": "0", "image": null, "isCorrect": false}, {"id": "yfKiM", "text": "$\\dfrac{\\pi}{6}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the given curve is $x^4 - 2xy^2 + y^2 + 3x - 3y = 0$.<br><br>The equation of the tangent to the curve at the origin $(0,0)$ can be found directly by equating the lowest degree terms to zero.<br><br>$3x - 3y = 0$<br><br>$y = x$<br><br>The slope of the tangent at $(0,0)$ is $m = 1$.<br><br>Let $\\theta$ be the angle the tangent makes with the X-axis.<br><br>$\\tan \\theta = 1$<br><br>$\\theta = \\dfrac{\\pi}{4}$<br><br>Answer: $\\dfrac{\\pi}{4}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 1)", "title": "MHT CET 2024 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213b60aee93fa0796daec", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}], "question": {"text": "The equation of the tangent to the curve $x=\\operatorname{acos}^3 \\theta, y=\\operatorname{asin}^3 \\theta$ at $\\theta=\\dfrac{\\pi}{4}$ is", "image": null}, "options": [{"id": "uwp16", "text": "$x+y=\\dfrac{\\mathrm{a}}{\\sqrt{2}}$", "image": null, "isCorrect": true}, {"id": "8HoXg", "text": "$x+y=\\dfrac{\\mathrm{a}}{2}$", "image": null, "isCorrect": false}, {"id": "mmut7", "text": "$x+y=\\dfrac{\\mathrm{a}}{2 \\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "AgiQA", "text": "$x+y=\\dfrac{\\mathrm{a}}{8}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $x = a \\cos^3 \\theta$ and $y = a \\sin^3 \\theta$<br><br>At $\\theta = \\dfrac{\\pi}{4}$, the coordinates of the point are:<br><br>$x = a \\cos^3\\left(\\dfrac{\\pi}{4}\\right) = \\dfrac{a}{2\\sqrt{2}}$<br><br>$y = a \\sin^3\\left(\\dfrac{\\pi}{4}\\right) = \\dfrac{a}{2\\sqrt{2}}$<br><br>Differentiating $x$ and $y$ with respect to $\\theta$:<br><br>$\\dfrac{dx}{d\\theta} = -3a \\cos^2 \\theta \\sin \\theta$<br><br>$\\dfrac{dy}{d\\theta} = 3a \\sin^2 \\theta \\cos \\theta$<br><br>The slope of the tangent is given by:<br><br>$\\dfrac{dy}{dx} = \\dfrac{\\dfrac{dy}{d\\theta}}{\\dfrac{dx}{d\\theta}} = \\dfrac{3a \\sin^2 \\theta \\cos \\theta}{-3a \\cos^2 \\theta \\sin \\theta} = -\\tan \\theta$<br><br>At $\\theta = \\dfrac{\\pi}{4}$, the slope is $m = -\\tan\\left(\\dfrac{\\pi}{4}\\right) = -1$<br><br>The equation of the tangent is:<br><br>$y - \\dfrac{a}{2\\sqrt{2}} = -1\\left(x - \\dfrac{a}{2\\sqrt{2}}\\right)$<br><br>$x + y = \\dfrac{a}{2\\sqrt{2}} + \\dfrac{a}{2\\sqrt{2}}$<br><br>$x + y = \\dfrac{a}{\\sqrt{2}}$<br><br>Answer: $x+y=\\dfrac{\\mathrm{a}}{\\sqrt{2}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccb", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 2)", "title": "MHT CET 2024 (09 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a30aee93fa0796da58", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "If the curves $y^2=6 x, 9 x^2+b y^2=16$ intersect each other at right angles, then the value of $b$ is", "image": null}, "options": [{"id": "bhaXv", "text": "$\\dfrac{9}{2}$", "image": null, "isCorrect": true}, {"id": "yHC66", "text": "6", "image": null, "isCorrect": false}, {"id": "BbaOs", "text": "7", "image": null, "isCorrect": false}, {"id": "tJ5MP", "text": "$\\dfrac{7}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the first curve $y^2 = 6x$, differentiating with respect to $x$ gives:<br><br>$2y \\dfrac{dy}{dx} = 6 \\Rightarrow \\dfrac{dy}{dx} = \\dfrac{3}{y}$<br><br>Let the slope of the tangent to the first curve be $m_1 = \\dfrac{3}{y}$.<br><br>For the second curve $9x^2 + by^2 = 16$, differentiating with respect to $x$ gives:<br><br>$18x + 2by \\dfrac{dy}{dx} = 0 \\Rightarrow \\dfrac{dy}{dx} = -\\dfrac{9x}{by}$<br><br>Let the slope of the tangent to the second curve be $m_2 = -\\dfrac{9x}{by}$.<br><br>Since the curves intersect at right angles, the product of their slopes at the point of intersection must be $-1$:<br><br>$m_1 m_2 = -1$<br><br>$\\left(\\dfrac{3}{y}\\right) \\left(-\\dfrac{9x}{by}\\right) = -1$<br><br>$\\dfrac{27x}{by^2} = 1 \\Rightarrow by^2 = 27x$<br><br>Substituting $y^2 = 6x$ from the first curve into this condition, we get:<br><br>$b(6x) = 27x$<br><br>Since the point of intersection cannot be the origin (as $x=0, y=0$ does not satisfy $9x^2 + by^2 = 16$), we have $x \\neq 0$. Dividing by $x$ yields:<br><br>$6b = 27 \\Rightarrow b = \\dfrac{27}{6} = \\dfrac{9}{2}$<br><br>Answer: $\\dfrac{9}{2}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a00aee93fa0796da41", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "Let C be a curve given by $y(x)=1+\\sqrt{4 x-3}$, $x\\gt\\dfrac{3}{4}$. If P is a point on C , such that the tangent at P has slope $\\dfrac{2}{3}$, then a point through which the normal at P passes, is", "image": null}, "options": [{"id": "Ky7yF", "text": "$(1,7)$", "image": null, "isCorrect": true}, {"id": "FaceN", "text": "$(3,-4)$", "image": null, "isCorrect": false}, {"id": "j6nZk", "text": "$(4,-3)$", "image": null, "isCorrect": false}, {"id": "GofRz", "text": "$(2,3)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given curve $y = 1 + \\sqrt{4x-3}$<br><br>Differentiating with respect to $x$, we get<br><br>$\\dfrac{dy}{dx} = \\dfrac{1}{2\\sqrt{4x-3}} \\times 4 = \\dfrac{2}{\\sqrt{4x-3}}$<br><br>Slope of the tangent at point P is given as $\\dfrac{2}{3}$.<br><br>$\\dfrac{2}{\\sqrt{4x-3}} = \\dfrac{2}{3}$<br><br>$\\sqrt{4x-3} = 3 \\Rightarrow 4x - 3 = 9 \\Rightarrow x = 3$<br><br>Substituting $x = 3$ in the curve equation, we get<br><br>$y = 1 + \\sqrt{4(3)-3} = 1 + 3 = 4$<br><br>So, the point P is $(3, 4)$.<br><br>Slope of the normal at P is $-\\dfrac{3}{2}$.<br><br>Equation of the normal at P is<br><br>$y - 4 = -\\dfrac{3}{2}(x - 3)$<br><br>$2y - 8 = -3x + 9$<br><br>$3x + 2y = 17$<br><br>Checking the given options, the point $(1, 7)$ satisfies this equation since $3(1) + 2(7) = 17$.<br><br>Answer: $(1,7)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213910aee93fa0796d9ce", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}], "question": {"text": "The equation of the tangent to the curve $y=1-\\mathrm{e}^{\\dfrac{x}{3}}$ at the point of intersection with Y -axis is", "image": null}, "options": [{"id": "b6wQC", "text": "$x-3 y=0$", "image": null, "isCorrect": false}, {"id": "PTq2h", "text": "$x+3 y=0$", "image": null, "isCorrect": true}, {"id": "YAlBO", "text": "$x+2 y=0$", "image": null, "isCorrect": false}, {"id": "JmxQ2", "text": "$3 x^{\\prime}+y=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "To find the point of intersection with the Y-axis, substitute $x = 0$ in the given equation of the curve.<br><br>$y = 1 - \\mathrm{e}^{0} = 1 - 1 = 0$<br><br>The point of intersection is $(0, 0)$.<br><br>Differentiating the equation of the curve with respect to $x$, we get:<br><br>$\\dfrac{dy}{dx} = -\\dfrac{1}{3}\\mathrm{e}^{\\dfrac{x}{3}}$<br><br>The slope of the tangent at $(0, 0)$ is:<br><br>$\\left(\\dfrac{dy}{dx}\\right)_{(0,0)} = -\\dfrac{1}{3}\\mathrm{e}^{0} = -\\dfrac{1}{3}$<br><br>The equation of the tangent at $(0, 0)$ is:<br><br>$y - 0 = -\\dfrac{1}{3}(x - 0)$<br><br>$x + 3y = 0$<br><br>Answer: $x+3 y=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc7", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T14:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 2)", "title": "MHT CET 2024 (04 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792137c0aee93fa0796d922", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}], "question": {"text": "The sum of intercepts on coordinate axes made by tangent to the curve $\\sqrt{x}+\\sqrt{y}=\\sqrt{a}$ is", "image": null}, "options": [{"id": "3VZGZ", "text": "a", "image": null, "isCorrect": true}, {"id": "Ikcyv", "text": "2 a", "image": null, "isCorrect": false}, {"id": "gAk1X", "text": "$2 \\sqrt{\\mathrm{a}}$", "image": null, "isCorrect": false}, {"id": "RPgiN", "text": "$\\sqrt{2} a$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given curve is $\\sqrt{x} + \\sqrt{y} = \\sqrt{a}$<br><br>Differentiating with respect to $x$:<br><br>$\\dfrac{1}{2\\sqrt{x}} + \\dfrac{1}{2\\sqrt{y}} \\dfrac{dy}{dx} = 0 \\Rightarrow \\dfrac{dy}{dx} = -\\dfrac{\\sqrt{y}}{\\sqrt{x}}$<br><br>Let the point of tangency be $(x_1, y_1)$. The slope of the tangent is $m = -\\dfrac{\\sqrt{y_1}}{\\sqrt{x_1}}$.<br><br>The equation of the tangent at $(x_1, y_1)$ is:<br><br>$y - y_1 = -\\dfrac{\\sqrt{y_1}}{\\sqrt{x_1}} (x - x_1)$<br><br>$x \\sqrt{y_1} + y \\sqrt{x_1} = x_1 \\sqrt{y_1} + y_1 \\sqrt{x_1}$<br><br>$x \\sqrt{y_1} + y \\sqrt{x_1} = \\sqrt{x_1} \\sqrt{y_1} (\\sqrt{x_1} + \\sqrt{y_1})$<br><br>Since $(x_1, y_1)$ lies on the curve, $\\sqrt{x_1} + \\sqrt{y_1} = \\sqrt{a}$.<br><br>$x \\sqrt{y_1} + y \\sqrt{x_1} = \\sqrt{x_1} \\sqrt{y_1} \\sqrt{a}$<br><br>Dividing by $\\sqrt{x_1} \\sqrt{y_1} \\sqrt{a}$, we get the intercept form of the tangent:<br><br>$\\dfrac{x}{\\sqrt{a} \\sqrt{x_1}} + \\dfrac{y}{\\sqrt{a} \\sqrt{y_1}} = 1$<br><br>The $x$-intercept is $\\sqrt{a} \\sqrt{x_1}$ and the $y$-intercept is $\\sqrt{a} \\sqrt{y_1}$.<br><br>Sum of intercepts $= \\sqrt{a} \\sqrt{x_1} + \\sqrt{a} \\sqrt{y_1} = \\sqrt{a} (\\sqrt{x_1} + \\sqrt{y_1})$<br><br>Substituting $\\sqrt{x_1} + \\sqrt{y_1} = \\sqrt{a}$:<br><br>Sum of intercepts $= \\sqrt{a} \\times \\sqrt{a} = a$<br><br>Answer: a", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-04T09:00:00.000Z", "isVisible": true, "shortName": "2024 (04 May Shift 1)", "title": "MHT CET 2024 (04 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213560aee93fa0796d803", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "The equation of the normal to the curve $x=\\theta+\\sin \\theta, y=1+\\cos \\theta$ at $\\theta=\\dfrac{\\pi}{2}$ is", "image": null}, "options": [{"id": "yPlWI", "text": "$2 x+2 y+\\pi=0$", "image": null, "isCorrect": false}, {"id": "5eJCj", "text": "$2 x-2 y-\\pi=0$", "image": null, "isCorrect": true}, {"id": "mh2uC", "text": "$x+y+\\pi=0$", "image": null, "isCorrect": false}, {"id": "1pGut", "text": "$x+y-2 \\pi=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $x = \\theta + \\sin \\theta$ and $y = 1 + \\cos \\theta$.<br><br>At $\\theta = \\dfrac{\\pi}{2}$, the coordinates of the point are:<br>$x = \\dfrac{\\pi}{2} + \\sin\\left(\\dfrac{\\pi}{2}\\right) = \\dfrac{\\pi}{2} + 1$<br>$y = 1 + \\cos\\left(\\dfrac{\\pi}{2}\\right) = 1 + 0 = 1$<br><br>Differentiating $x$ and $y$ with respect to $\\theta$:<br>$\\dfrac{dx}{d\\theta} = 1 + \\cos \\theta$<br>$\\dfrac{dy}{d\\theta} = -\\sin \\theta$<br><br>The slope of the tangent is given by:<br>$\\dfrac{dy}{dx} = \\dfrac{\\dfrac{dy}{d\\theta}}{\\dfrac{dx}{d\\theta}} = \\dfrac{-\\sin \\theta}{1 + \\cos \\theta}$<br><br>At $\\theta = \\dfrac{\\pi}{2}$, the slope of the tangent is:<br>$m_T = \\dfrac{-\\sin\\left(\\dfrac{\\pi}{2}\\right)}{1 + \\cos\\left(\\dfrac{\\pi}{2}\\right)} = \\dfrac{-1}{1 + 0} = -1$<br><br>The slope of the normal is $m_N = -\\dfrac{1}{m_T} = 1$.<br><br>The equation of the normal at $\\left(\\dfrac{\\pi}{2} + 1, 1\\right)$ is:<br>$y - 1 = 1 \\left(x - \\left(\\dfrac{\\pi}{2} + 1\\right)\\right)$<br>$y - 1 = x - \\dfrac{\\pi}{2} - 1$<br>$x - y - \\dfrac{\\pi}{2} = 0$<br>$2x - 2y - \\pi = 0$<br><br>Answer: $2 x-2 y-\\pi=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213440aee93fa0796d771", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The equation of normal to the curve $x=\\theta+\\sin \\theta, y=1+\\cos \\theta$ at $\\theta=\\dfrac{\\pi}{2}$ is", "image": null}, "options": [{"id": "uivDw", "text": "$2 x+2 y-\\pi=0$", "image": null, "isCorrect": false}, {"id": "b5uVh", "text": "$2 x-y-\\pi=0$", "image": null, "isCorrect": false}, {"id": "j7ATh", "text": "$2 x-2 y-\\pi=0$", "image": null, "isCorrect": true}, {"id": "9H6BC", "text": "$2 x+y-\\pi=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given the parametric equations of the curve:<br><br>$x = \\theta + \\sin \\theta$<br><br>$y = 1 + \\cos \\theta$<br><br>At $\\theta = \\dfrac{\\pi}{2}$, the coordinates of the point are:<br><br>$x = \\dfrac{\\pi}{2} + \\sin\\left(\\dfrac{\\pi}{2}\\right) = \\dfrac{\\pi}{2} + 1$<br><br>$y = 1 + \\cos\\left(\\dfrac{\\pi}{2}\\right) = 1 + 0 = 1$<br><br>So, the point is $\\left(\\dfrac{\\pi}{2} + 1, 1\\right)$.<br><br>Now, differentiating $x$ and $y$ with respect to $\\theta$:<br><br>$\\dfrac{dx}{d\\theta} = 1 + \\cos \\theta$<br><br>$\\dfrac{dy}{d\\theta} = -\\sin \\theta$<br><br>The slope of the tangent to the curve is:<br><br>$\\dfrac{dy}{dx} = \\dfrac{\\dfrac{dy}{d\\theta}}{\\dfrac{dx}{d\\theta}} = \\dfrac{-\\sin \\theta}{1 + \\cos \\theta}$<br><br>At $\\theta = \\dfrac{\\pi}{2}$, the slope of the tangent is:<br><br>$m_t = \\dfrac{-\\sin\\left(\\dfrac{\\pi}{2}\\right)}{1 + \\cos\\left(\\dfrac{\\pi}{2}\\right)} = \\dfrac{-1}{1 + 0} = -1$<br><br>The slope of the normal is $m_n = -\\dfrac{1}{m_t} = 1$.<br><br>The equation of the normal at the point $\\left(\\dfrac{\\pi}{2} + 1, 1\\right)$ is:<br><br>$y - 1 = 1 \\left(x - \\left(\\dfrac{\\pi}{2} + 1\\right)\\right)$<br><br>$y - 1 = x - \\dfrac{\\pi}{2} - 1$<br><br>$y = x - \\dfrac{\\pi}{2}$<br><br>$2x - 2y - \\pi = 0$<br><br>Answer: $2 x-2 y-\\pi=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213410aee93fa0796d757", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The co-ordinates of a point on the curve $y=x \\log x$ at which the normal is parallel to the line $2 x-2 y=3$ are", "image": null}, "options": [{"id": "1Z1vY", "text": "$\\left(-\\mathrm{e}^{-2}, 2 \\mathrm{e}^{-2}\\right)$", "image": null, "isCorrect": false}, {"id": "ugg62", "text": "$\\left(-\\mathrm{e}^{-2},-2 \\mathrm{e}^{-2}\\right)$", "image": null, "isCorrect": false}, {"id": "PwKRv", "text": "$\\quad\\left(\\mathrm{e}^{-2}, 2 \\mathrm{e}^{-2}\\right)$", "image": null, "isCorrect": false}, {"id": "sTOdz", "text": "$\\left(\\mathrm{e}^{-2},-2 \\mathrm{e}^{-2}\\right)$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Equation of the given line is $2x - 2y = 3$, which can be written as $y = x - \\dfrac{3}{2}$.<br><br>Slope of the line is $1$. Since the normal is parallel to this line, the slope of the normal is $1$.<br><br>Slope of the tangent to the curve is $m = \\dfrac{-1}{\\text{slope of normal}} = -1$.<br><br>Given curve is $y = x \\log x$. Differentiating with respect to $x$, we get:<br><br>$\\dfrac{dy}{dx} = x \\cdot \\dfrac{1}{x} + \\log x = 1 + \\log x$<br><br>Equating the slope of the tangent to $-1$:<br><br>$1 + \\log x = -1$<br><br>$\\log x = -2$<br><br>$x = e^{-2}$<br><br>Substituting $x = e^{-2}$ in the equation of the curve:<br><br>$y = e^{-2} \\log(e^{-2}) = -2e^{-2}$<br><br>The required point is $(e^{-2}, -2e^{-2})$.<br><br>Answer: $\\left(\\mathrm{e}^{-2},-2 \\mathrm{e}^{-2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213320aee93fa0796d6e4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "The normal to the curve, $y(x-2)(x-3)=x+6$ at the point, where the curve intersects the Y-axis, passes through the point", "image": null}, "options": [{"id": "sOg32", "text": "$\\left(-\\dfrac{1}{2},-\\dfrac{1}{2}\\right)$", "image": null, "isCorrect": false}, {"id": "tJGlz", "text": "$\\left(\\dfrac{1}{2}, \\dfrac{1}{2}\\right)$", "image": null, "isCorrect": true}, {"id": "5pE2e", "text": "$\\left(\\dfrac{1}{2},-\\dfrac{1}{3}\\right)$", "image": null, "isCorrect": false}, {"id": "F8hB7", "text": "$\\left(\\dfrac{1}{2}, \\dfrac{1}{3}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The curve intersects the Y-axis where $x = 0$.<br><br>Substituting $x = 0$ into the equation of the curve $y(x-2)(x-3) = x+6$:<br><br>$y(0-2)(0-3) = 0+6$<br><br>$6y = 6 \\Rightarrow y = 1$<br><br>The point of intersection is $(0, 1)$.<br><br>Differentiating the given equation $y(x^2 - 5x + 6) = x + 6$ with respect to $x$:<br><br>$\\dfrac{dy}{dx}(x^2 - 5x + 6) + y(2x - 5) = 1$<br><br>Substituting $x = 0$ and $y = 1$:<br><br>$\\dfrac{dy}{dx}(6) + 1(-5) = 1$<br><br>$6\\dfrac{dy}{dx} = 6 \\Rightarrow \\dfrac{dy}{dx} = 1$<br><br>The slope of the tangent at $(0, 1)$ is $1$. Therefore, the slope of the normal is $-1$.<br><br>The equation of the normal at $(0, 1)$ is:<br><br>$y - 1 = -1(x - 0)$<br><br>$x + y = 1$<br><br>Checking the given options, the point $\\left(\\dfrac{1}{2}, \\dfrac{1}{2}\\right)$ satisfies the equation $x + y = 1$.<br><br>Answer: $\\left(\\dfrac{1}{2}, \\dfrac{1}{2}\\right)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262850279619d9d8a3531", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "If $y=4 x-5$ is a tangent to the curve $y^2=\\mathrm{p} x^3+\\mathrm{q}$ at $(2,3)$, then $\\mathrm{p}-\\mathrm{q}$ is", "image": null}, "options": [{"id": "Ghdwz", "text": "-5", "image": null, "isCorrect": false}, {"id": "J1KIW", "text": "5", "image": null, "isCorrect": false}, {"id": "xXpfx", "text": "9", "image": null, "isCorrect": true}, {"id": "BQS9C", "text": "-9", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$y^2=\\mathrm{p} x^3+\\mathrm{q}... (i)$\nDifferentiating both sides w.r.t. $x$, we get\n$\\begin{gathered}\n2 y \\cdot \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=3 \\mathrm{p} x^2 \\\\\n\\Rightarrow \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=\\frac{3 \\mathrm{p}}{2}\\left(\\frac{x^2}{y}\\right) \\\\\n\\therefore \\quad\\left(\\frac{\\mathrm{d} y}{\\mathrm{~d} x}\\right)_{(2,3)}=\\frac{3 \\mathrm{p}}{2} \\times \\frac{4}{3}=2 \\mathrm{p}\n\\end{gathered}$\nSlope of the line $y=4 x-5$ is 4 .\nSince the line touches the curve, their slopes are equal.\n$\\therefore \\quad 2 \\mathrm{p}=4 \\Rightarrow \\mathrm{p}=2$\nSince $(2,3)$ lies on $y^2=\\mathrm{p} x^3+\\mathrm{q}$.\n$\\begin{array}{ll}\n\\therefore & 9=2 \\times 8+q \\Rightarrow q=-7 \\\\\n\\therefore & p-q=2+7=9\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262840279619d9d8a352a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "If the slope of the tangent of the curve at any point is equal to $-y+\\mathrm{e}^{-x}$, then the equation of the curve passing through origin is", "image": null}, "options": [{"id": "sEx7P", "text": "$y+x \\mathrm{e}^x=0$", "image": null, "isCorrect": false}, {"id": "BgPhp", "text": "$y \\mathrm{e}^x+x=0$", "image": null, "isCorrect": false}, {"id": "Q0az5", "text": "$y \\mathrm{e}^x-x=0$", "image": null, "isCorrect": true}, {"id": "zV1g7", "text": "$y-x \\mathrm{e}^x=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=-y+\\mathrm{e}^{-x} \\\\\n\\Rightarrow & \\frac{\\mathrm{d} y}{\\mathrm{~d} x}+y=\\mathrm{e}^{-x} \\\\\n\\therefore \\quad & \\text { I.F. }=\\mathrm{e}^{\\mathrm{dx}}=\\mathrm{e}^x\n\\end{aligned}$\n$\\therefore \\quad$ Solution of the given equation is\n$\\begin{gathered}\ny \\mathrm{e}^x=\\int \\mathrm{e}^x \\cdot \\mathrm{e}^{-x} \\mathrm{~d} x+\\mathrm{c} \\\\\n\\Rightarrow y \\mathrm{e}^x=\\int \\mathrm{d} x \\pm \\mathrm{c} \\\\\n\\Rightarrow y \\mathrm{e}^x=x+\\mathrm{c}\n\\end{gathered}$\nSince the curve passes through $(0,0)$.\n$\\begin{array}{ll}\n\\therefore \\quad & 0=0+\\mathrm{c} \\\\\n& \\Rightarrow \\mathrm{c}=0 \\\\\n\\therefore \\quad & y \\mathrm{e}^x=x \\\\\n& \\Rightarrow y \\mathrm{e}^x-x^2=0\n\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262740279619d9d8a34a6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "Let the curve be represented by $x=2(\\cos \\mathrm{t}+\\mathrm{t} \\sin \\mathrm{t}), y=2(\\sin \\mathrm{t}-\\mathrm{t} \\cos \\mathrm{t})$. Then normal at any point ' $t$ ' of the curve is at a distance of <img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/2CqkIWioIlATEvVHY9kVsHCRY_qwWduB5Et9K2GARpk.original.fullsize.png\"><br>units from the origin.", "image": null}, "options": [{"id": "MogJt", "text": "$1$", "image": null, "isCorrect": false}, {"id": "KRbg5", "text": "$0$", "image": null, "isCorrect": false}, {"id": "PJkYm", "text": "$2$", "image": null, "isCorrect": true}, {"id": "9Z1YI", "text": "$4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & x=2(\\cos \\mathrm{t}+\\mathrm{t} \\sin \\mathrm{t}) \\\\ \\therefore \\quad & \\frac{\\mathrm{d} x}{\\mathrm{dt}}=2(-\\sin \\mathrm{t}+\\sin \\mathrm{t}+\\mathrm{t} \\cos \\mathrm{t})=2 \\mathrm{t} \\cos \\mathrm{t} \\\\ & y=2(\\sin \\mathrm{t}-\\mathrm{t} \\cos \\mathrm{t}) \\\\ \\therefore \\quad & \\frac{\\mathrm{d} y}{\\mathrm{dt}}=2(\\cos \\mathrm{t}-\\cos \\mathrm{t}+\\mathrm{t} \\sin \\mathrm{t})=2 \\mathrm{t} \\sin \\mathrm{t} \\\\ \\therefore \\quad & \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=\\frac{\\frac{\\mathrm{d} y}{\\mathrm{dt}}}{\\frac{\\mathrm{d} x}{\\mathrm{dt}}}=\\frac{2 \\mathrm{t} \\sin \\mathrm{t}}{2 \\mathrm{t} \\cos \\mathrm{t}}=\\mathrm{tan} \\mathrm{t} \\\\ & \\text { Slope of normal }=-\\frac{1}{\\frac{\\mathrm{d} y}{\\mathrm{~d} x}}=-\\frac{1}{\\tan \\mathrm{t}}=-\\frac{\\cos \\mathrm{t}}{\\sin \\mathrm{t}}\\end{array}$\n$\\therefore \\quad$ Equation of the normal is\n$$\n\\begin{aligned}\n& y-2(\\sin t-t \\cos t)=-\\frac{\\cos t}{\\sin t}[x-2(\\cos t+t \\sin t)] \\\\\n& \\Rightarrow y \\sin \\mathrm{t}-2 \\sin ^2 \\mathrm{t}+2 \\mathrm{t} \\sin \\mathrm{t} \\cos \\mathrm{t} \\\\\n& =-x \\cos t+2 \\cos ^2 t+2 t \\sin t \\cos t \\\\\n& \\Rightarrow x \\cos \\mathrm{t}+y \\sin \\mathrm{t}=2\\left(\\sin ^2 \\mathrm{t}+\\cos ^2 \\mathrm{t}\\right) \\\\\n& \\Rightarrow x \\cos \\mathrm{t}+y \\sin \\mathrm{t}=2 \\\\\n& \\therefore \\quad \\text { Distance from origin }=\\left|\\frac{-2}{\\sqrt{\\cos ^2 \\mathrm{t}+\\sin ^2 \\mathrm{t}}}\\right|=2 \\text { units } \\\\\n&\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262630279619d9d8a341f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "If slope of the tangent to the curve $x y+a x+b y=0$ at the point $(1,1)$ on it is 2 , then the value of $3 a+b$ is\n(", "image": null}, "options": [{"id": "nJSM2", "text": "3", "image": null, "isCorrect": false}, {"id": "RdLGM", "text": "1", "image": null, "isCorrect": true}, {"id": "W78bh", "text": "2", "image": null, "isCorrect": false}, {"id": "tDmW2", "text": "$-1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$x y+a x+b y=0$\nDifferentiating w.r.t. $x$, we get\n$\\frac{x \\mathrm{~d} y}{\\mathrm{~d} x}+y+\\mathrm{a}+\\mathrm{b} \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=0$\n$\\begin{aligned} & \\Rightarrow \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=-\\frac{\\mathrm{a}+y}{\\mathrm{~b}+x} \\\\ & \\Rightarrow\\left(\\frac{\\mathrm{d} y}{\\mathrm{~d} x}\\right)_{(\\mathrm{b}, 1)}=-\\frac{\\mathrm{a}+1}{\\mathrm{~b}+1} \\\\ & \\Rightarrow 2=-\\frac{\\mathrm{a}+1}{\\mathrm{~b}+1}\\end{aligned}$\n$\\Rightarrow a+2 b=-3$      ...(i)\nAlso, the point $(1,1)$ lies on the curve\n$x y+a x+b y=0$.\n$\\therefore \\quad 1+a+b=0$\n$\\Rightarrow a+b=-1$                ...(ii)\nSolving (i) and (ii), we get $a=1, b=-2$\n$\\therefore \\quad 3 a+b=1$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262620279619d9d8a341a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "Slope of the tangent to the curve $y=2 \\mathrm{e}^x \\sin \\left(\\frac{\\pi}{4}-\\frac{x}{2}\\right) \\cos \\left(\\frac{\\pi}{4}-\\frac{x}{2}\\right)$ where $0 \\leq x \\leq 2 \\pi$ is minimum at $x=$", "image": null}, "options": [{"id": "YLdEO", "text": "0", "image": null, "isCorrect": false}, {"id": "TUUBi", "text": "$\\pi$", "image": null, "isCorrect": true}, {"id": "raYjT", "text": "$2 \\pi$", "image": null, "isCorrect": false}, {"id": "8WTO1", "text": "1", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$y=2 \\mathrm{e}^x \\sin \\left(\\frac{\\pi}{4}-\\frac{x}{2}\\right) \\cos \\left(\\frac{\\pi}{4}-\\frac{x}{2}\\right)$\n$\\begin{aligned} & =\\mathrm{e}^x \\sin \\left(\\frac{\\pi}{2}-x\\right) \\ldots[2 \\sin \\theta \\cos \\theta=\\sin 2 \\theta] \\\\ & =\\mathrm{e}^x \\cos x\\end{aligned}$\n$\\therefore \\quad \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=\\mathrm{e}^x(\\cos x-\\sin x)$\nLet $\\mathrm{T}=\\mathrm{e}^x(\\cos x-\\sin x)$\n$\\therefore \\quad \\frac{\\mathrm{dT}}{\\mathrm{d} x}=\\mathrm{e}^x(\\cos x-\\sin x)+\\mathrm{e}^x(-\\sin x-\\cos x)$\n$=-2 \\mathrm{e}^x \\sin x$\nNow, $\\frac{\\mathrm{dT}}{\\mathrm{d} x}=0$\n$\\begin{aligned} & \\Rightarrow-2 \\mathrm{e}^x \\sin x=0 \\\\ & \\Rightarrow \\sin x=0\\end{aligned}$\n$\\Rightarrow x=0, \\pi, 2 \\pi \\quad \\ldots[\\because 0 \\leq x \\leq 2 \\pi]$\nAt $x=0, \\mathrm{~T}=\\mathrm{e}^0(\\cos 0-\\sin 0)=1$\nAt $x=\\pi, \\mathrm{T}=\\mathrm{e}^\\pi(\\cos \\pi-\\sin \\pi)=-\\mathrm{e}^\\pi$\nAt $x=2 \\pi, \\mathrm{T}=\\mathrm{e}^{2 \\pi}(\\cos 2 \\pi-\\sin 2 \\pi)=\\mathrm{e}^{2 \\pi}$\n$\\therefore \\quad$ Slope of the tangent is minimum at $x=\\pi$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262600279619d9d8a3402", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "$\\mathrm{A}(1,-3), \\mathrm{B}(4,3)$ are two points on the curve $y=x-\\frac{4}{x}$. The points on the curve, the tangents at which are parallel to the chord $\\mathrm{AB}$, are", "image": null}, "options": [{"id": "mzNU6", "text": "$(1,2),(-1,-2)$", "image": null, "isCorrect": false}, {"id": "PkYI7", "text": "$(2,0),(-2,0)$", "image": null, "isCorrect": true}, {"id": "b1MHK", "text": "$(0,2),(1,-2)$", "image": null, "isCorrect": false}, {"id": "H8JX6", "text": "$(3,2),(-3,1)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Slope of tangent $=$ slope of $\\mathrm{AB}=\\frac{3+3}{4-1}=\\frac{6}{3}=2$\n$y=x-\\frac{4}{x}$\n$\\therefore \\quad \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=1+\\frac{4}{x^2}$\n$\\begin{aligned} & \\Rightarrow 2=1+\\frac{4}{x^2} \\\\ & \\Rightarrow x^2=4 \\\\ & \\Rightarrow x= \\pm 2\\end{aligned}$\nWhen $x=2, y=2-\\frac{4}{2}=0$\nWhen $x=-2, y=-2+\\frac{4}{2}=0$\n$\\therefore \\quad$ The required points are $(2,0)$ and $(-2,0)$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2624e0279619d9d8a3374", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "The slope of the normal to the curve $x=\\sqrt{t}$ and $y=\\mathrm{t}-\\frac{1}{\\sqrt{\\mathrm{t}}}$ at $\\mathrm{t}=4$ is", "image": null}, "options": [{"id": "tlN6H", "text": "$\\frac{-17}{4}$", "image": null, "isCorrect": false}, {"id": "8kTQx", "text": "$\\frac{4}{17}$", "image": null, "isCorrect": false}, {"id": "WUju6", "text": "$\\frac{-4}{17}$", "image": null, "isCorrect": true}, {"id": "vsnVj", "text": "$\\frac{17}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=\\frac{\\frac{\\mathrm{d} y}{\\mathrm{dt}}}{\\frac{\\mathrm{d} x}{\\mathrm{dt}}}=\\frac{1+\\frac{1}{2 \\mathrm{t}^{\\frac{3}{2}}}}{\\frac{1}{2 \\sqrt{\\mathrm{t}}}}=\\frac{2 \\mathrm{t}^{\\frac{3}{2}}+1}{\\mathrm{t}} \\\\\n\\therefore \\quad\\left(\\frac{\\mathrm{d} y}{\\mathrm{~d} x}\\right)_{\\mathrm{t}=4}= & \\frac{2(4)^{\\frac{3}{2}}+1}{4}=\\frac{16+1}{4}=\\frac{17}{4}\n\\end{aligned}\n$$\n$\\therefore \\quad$ Slope of normal at $\\mathrm{t}=4$ is $-\\frac{1}{\\left(\\frac{\\mathrm{d} y}{\\mathrm{~d} x}\\right)_{t=4}}=-\\frac{4}{17}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2623a0279619d9d8a32d7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "If the curves $y^2=6 x$ and $9 x^2+b y^2=16$ intersect each other at right angle, then value of \" $b$ ' is", "image": null}, "options": [{"id": "boIzn", "text": "$\\frac{9}{2}$", "image": null, "isCorrect": true}, {"id": "5W98A", "text": "$6$", "image": null, "isCorrect": false}, {"id": "9LCDX", "text": "$\\frac{7}{2}$", "image": null, "isCorrect": false}, {"id": "hS178", "text": "$4$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned} & y^2=6 x \\\\ & \\Rightarrow 2 y \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=6 \\Rightarrow \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=\\frac{3}{y} \\\\ & \\text { Also, } 9 x^2+\\mathrm{b} y^2=16 \\\\ & \\Rightarrow 18 x+2 \\mathrm{~b} y \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=0 \\Rightarrow \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=\\frac{-9 x}{\\mathrm{~b} y}\\end{aligned}$\nAs given curves intersect each other at right angle, their tangents also intersect at right angles.\n$$\n\\begin{array}{ll} \n& \\frac{3}{y} \\times \\frac{-9 x}{\\mathrm{~b} y}=-1 \\\\\n\\Rightarrow & \\mathrm{b} y^2=27 x \\\\\n\\therefore \\quad & (\\mathrm{i}) \\Rightarrow \\mathrm{b}(6 x)=27 x \\\\\n& \\Rightarrow \\mathrm{b}=\\frac{9}{2}\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2623a0279619d9d8a32d5", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "The equation of the normal to the curve $3 x^2-y^2=8$, which is parallel to the line $x+3 y=10$, is", "image": null}, "options": [{"id": "VD2VH", "text": "$x+3 y+6=0$", "image": null, "isCorrect": false}, {"id": "KIo7t", "text": "$x+3 y-3=0$", "image": null, "isCorrect": false}, {"id": "MSFJd", "text": "$x+3 y+8=0$", "image": null, "isCorrect": true}, {"id": "4bY2a", "text": "$x+3 y-4=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n3 x^2-y^2=8\n$$\n\nDifferentiating w.r.t. $x$, we get\n$$\n\\begin{aligned}\n& 6 x-2 y \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=0 \\\\\n\\therefore \\quad & \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=\\frac{3 x}{y}\n\\end{aligned}\n$$\n$\\therefore \\quad$ Slope of the tangent to the curve is $\\frac{3 x}{y}$.\n$\\therefore \\quad$ Slope of the normal is $\\frac{-y}{3 x}$.\nIt is parallel to line $x+3 y=10 \\Rightarrow$ slope $=-\\frac{1}{3}$\n$\\therefore \\quad \\frac{-y}{3 x}=\\frac{-1}{3} \\Rightarrow x=y$\n$\\therefore \\quad$ When $x=y$, equation of the curve becomes\n$\\therefore \\quad 3 x^2-x^2=8$\n$\\therefore \\quad x^2=4$\n$\\therefore \\quad x=2,-2 \\Rightarrow y=2,-2$\n$\\therefore \\quad(2,2)$ and $(-2,-2)$ are the points of contact of the normal and the curve.\n$\\therefore \\quad$ Equations are $(y-2)=\\frac{-1}{3}(x-2)$ or\n$$\n\\begin{aligned}\n& (y+2)=\\frac{-1}{3}(x+2) \\\\\n& \\text { i.e., } x+3 y-8=0 \\text { or } x+3 y+8=0\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262280279619d9d8a323e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}], "question": {"text": "The angle between the tangents to the curves $y=2 x^2$ and $x=2 y^2$ at $(1,1)$ is", "image": null}, "options": [{"id": "1B2lf", "text": "$\\tan ^{-1}\\left(\\frac{15}{8}\\right)$", "image": null, "isCorrect": true}, {"id": "ldJUI", "text": "$\\tan ^{-1}\\left(\\frac{7}{8}\\right)$", "image": null, "isCorrect": false}, {"id": "m4Sy0", "text": "$\\tan ^{-1}\\left(\\frac{3}{4}\\right)$", "image": null, "isCorrect": false}, {"id": "fto47", "text": "$\\tan ^{-1}\\left(\\frac{1}{4}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\ny=2 x^2\n$$\n$\\therefore \\quad$ Slope of the tangent to this curve is $\\frac{\\mathrm{d} y}{\\mathrm{~d} x}=\\mathrm{m}_1=4 x$\n$\\therefore \\quad$ at $(1,1), \\mathrm{m}_1=4$\n$$\nx=2 y^2\n$$\n$\\therefore \\quad$ Slope of the tangent to this curve is $\\frac{\\mathrm{d} y}{\\mathrm{~d} x}=\\mathrm{m}_2=\\frac{1}{4 y}$\n$\\therefore \\quad$ at $(1,1), \\mathrm{m}_2=\\frac{1}{4}$\nLet $\\theta$ be the angle between two tangents.\n$$\n\\begin{aligned}\n& \\therefore \\quad \\tan \\theta=\\left|\\frac{m_1-m_2}{1+m_1 m_2}\\right|=\\left|\\frac{4-\\frac{1}{4}}{1+4 \\times \\frac{1}{4}}\\right|=\\frac{15}{8} \\\\\n& \\therefore \\quad \\theta=\\tan ^{-1}\\left(\\frac{15}{8}\\right)\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T09:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 1)", "title": "MHT CET 2023 (12 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262180279619d9d8a31be", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "The equation of the tangent to the curve $y=\\sqrt{9-2 x^2}$, at the point where the ordinate and abscissa are equal, is", "image": null}, "options": [{"id": "NbTHb", "text": "$2 x+y+\\sqrt{3}=0$", "image": null, "isCorrect": false}, {"id": "wrv5C", "text": "$2 x+y+3 \\sqrt{3}=0$", "image": null, "isCorrect": false}, {"id": "1D08F", "text": "$2 x-y-3 \\sqrt{3}=0$", "image": null, "isCorrect": false}, {"id": "NTddu", "text": "$2 x+y-3 \\sqrt{3}=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given curve is $y=\\sqrt{9-2 x^2}$\nIf ordinate and abscissa are equal, we get $y=x$.\n$\\therefore \\quad$ Equation of the curve becomes $x^2=9-2 x^2$ $\\Rightarrow x= \\pm \\sqrt{3}$\nIf $x=-\\sqrt{3}$, then $y=\\sqrt{9-2(3)}=\\sqrt{3}$\nIn this case, $x \\neq y$.\nHence, $x \\neq-\\sqrt{3}$\n$\\therefore \\quad x=\\sqrt{3}$ and $y=\\sqrt{3}$\n$\\therefore \\quad$ Slope of the tangent to the given curve is\n$\\begin{aligned}\n& 2 y \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=-4 x \\\\\n\\therefore \\quad & \\text { at }(\\sqrt{3}, \\sqrt{3}), \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=-2\n\\end{aligned}$\n$\\therefore \\quad$ Equation of the required tangent is\n$\\begin{aligned}\n& (y-\\sqrt{3})=-2(x-\\sqrt{3}) \\\\\n& \\text { i.e., } 2 x+y-3 \\sqrt{3}=0\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262170279619d9d8a31b9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "The slope of the tangent to a curve $y=\\mathrm{f}(x)$ at $(x, \\mathrm{f}(x))$ is $2 x+1$. If the curve passes through the point $(1,2)$, then the area (in sq. units), bounded by the curve, the $\\mathrm{X}$-axis and the line $x=1$, is", "image": null}, "options": [{"id": "P7jin", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}, {"id": "K04kD", "text": "$\\frac{4}{3}$", "image": null, "isCorrect": false}, {"id": "EShuZ", "text": "$\\frac{5}{6}$", "image": null, "isCorrect": true}, {"id": "9eujB", "text": "$\\frac{1}{12}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "According to the given condition, $\\frac{\\mathrm{d} y}{\\mathrm{~d} x}=2 x+1$ Integrating w.r.t. $x$, we get $y=x^2+x+\\mathrm{c}$ As curve passes through $(1,2)$, we get $2=(1)^2+1+c \\Rightarrow c=0$\n$\\therefore \\quad$ The equation of the curve is $y=x^2+x$.\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/BO96SyWZv69m2gr-R2wRLvdlxm3Ie51SkdTbkRAugko.original.fullsize.png\"><br>\n$\\therefore \\quad$ Required area\n$\\begin{aligned} & =\\int_0^1\\left(x^2+x\\right) \\mathrm{d} x \\\\ & =\\left[\\frac{x^3}{3}+\\frac{x^2}{2}\\right]_0^1 \\\\ & =\\frac{1}{3}+\\frac{1}{2} \\\\ & =\\frac{5}{6} \\text { sq. units }\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262050279619d9d8a3127", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "A curve passes through the point $\\left(1, \\frac{\\pi}{6}\\right)$. Let the slope of the curve at each point $(x, y)$ be $\\frac{y}{x}+\\sec \\left(\\frac{y}{x}\\right), x>0$, then, the equation of the curve is", "image": null}, "options": [{"id": "sVS0Z", "text": "$\\sin \\left(\\frac{y}{x}\\right)=\\log (x)+\\frac{1}{2}$", "image": null, "isCorrect": true}, {"id": "8QRri", "text": "$\\operatorname{cosec}\\left(\\frac{y}{x}\\right)=\\log (x)+2$", "image": null, "isCorrect": false}, {"id": "YLOCT", "text": "$\\sec \\left(\\frac{2 y}{x}\\right)=\\log (x)+2$", "image": null, "isCorrect": false}, {"id": "GdJ2F", "text": "$\\cos \\left(\\frac{2 y}{x}\\right)=\\log (x)+\\frac{1}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& \\quad \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=\\frac{y}{x}+\\sec \\left(\\frac{y}{x}\\right) \\\\\n& \\text { Put } y=\\mathrm{v} x \\\\\n& \\therefore \\quad \\frac{\\mathrm{d} y}{\\mathrm{~d} x}=\\mathrm{v}+x \\frac{\\mathrm{dv}}{\\mathrm{d} x} \\\\\n& \\therefore \\quad \\mathrm{v}+x \\frac{\\mathrm{dv}}{\\mathrm{d} x}=\\mathrm{v}+\\sec \\mathrm{v} \\\\\n& \\quad \\Rightarrow \\cos \\mathrm{v} \\mathrm{dv}=\\frac{1}{x} \\mathrm{~d} x\n\\end{aligned}\n$$\n\nIntegrating both sides, we get\n$$\n\\begin{aligned}\n& \\sin \\mathrm{V}=\\log (x)+\\mathrm{c} \\\\\n& \\Rightarrow \\sin \\left(\\frac{y}{x}\\right)=\\log (x)+\\mathrm{c}\n\\end{aligned}\n$$\n\nThe curve passes through $\\left(1, \\frac{\\pi}{6}\\right)$.\n$$\n\\sin \\left(\\frac{\\pi}{6}\\right)=\\log (1)+c \\Rightarrow c=\\frac{1}{2}\n$$\n$\\therefore \\quad$ Equation (ii) becomes\n$$\n\\sin \\left(\\frac{y}{x}\\right)=\\log (x)+\\frac{1}{2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261c70279619d9d8a2f45", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ab", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T14:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 2)", "title": "MHT CET 2023 (09 May Shift 2)"}], "question": {"text": "If slope of a tangent to the curve $x y+a x+b y=0$ at the point $(1,1)$ on it is 2 , then $a-b$ is", "image":
