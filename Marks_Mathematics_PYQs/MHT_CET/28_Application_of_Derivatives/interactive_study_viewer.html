> <mrow> <msup> <mi>f</mi> <mo>′</mo> </msup> <mo stretchy=\"false\">(</mo><mi>x</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mfrac> <mrow> <mi>x</mi><mfrac> <mn>1</mn> <mi>x</mi> </mfrac> <mo>−</mo><mi>log</mi><mi>x</mi> </mrow> <mrow> <msup> <mi>x</mi> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo><mfrac> <mrow> <mn>1</mn><mo>−</mo><mi>log</mi><mi>x</mi> </mrow> <mrow> <msup> <mi>x</mi> <mn>2</mn> </msup> </mrow> </mfrac> </mrow> </math><br /><math> <mrow> <msup> <mi>f</mi> <mo>′</mo> </msup> <mrow><mo>(</mo> <mi>x</mi> <mo>)</mo></mrow><mo>=</mo><mn>0</mn><mo>⇒</mo><mfrac> <mrow> <mn>1</mn><mo>−</mo><mi>log</mi><mi>x</mi> </mrow> <mrow> <msup> <mi>x</mi> <mn>2</mn> </msup> </mrow> </mfrac> <mo>=</mo><mn>0</mn> </mrow> </math><br /><math><mo>⇒</mo><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mi>x</mi><mo>=</mo><mn>1</mn></mrow></mrow><mi>&nbsp;</mi><mi>&nbsp;</mi></math><br /><math><mo>⇒</mo><mi>x</mi><mo>=</mo><mi>e</mi></math><br /><math> <mrow> <mo>⇒</mo> </mrow> </math> Max value is <math><mi>f</mi><mfenced separators=\"|\"><mrow><mi>e</mi></mrow></mfenced><mo>=</mo><mfrac><mrow><mrow><mrow><mi mathvariant=\"normal\">log</mi></mrow><mo>⁡</mo><mrow><mi>e</mi></mrow></mrow></mrow><mrow><mi>e</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>e</mi></mrow></mfrac></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cf071b5bb33b3f9f62", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2017-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2017", "title": "MHT CET 2017"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e5c0279619d9d8a13c9", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The maximum value of function $x^{3}-12 x^{2}+36 x+17$ in the interval $[1,10]$ is", "image": null}, "options": [{"id": "Uaalp", "text": "17", "image": null, "isCorrect": false}, {"id": "HdHOQ", "text": "177", "image": null, "isCorrect": true}, {"id": "pHiE2", "text": "77", "image": null, "isCorrect": false}, {"id": "EihvP", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $f(x)=x^{3}-12 x^{2}+36 x+17$\n$\\therefore f^{\\prime}(x)=3 x^{2}-24 x+36=0$\nFor maxima, put $f^{\\prime}(x)=0$ $\\Rightarrow \\quad 3 x^{2}-24 x+36=0$\n$\\Rightarrow \\quad(x-2)(x-6)=0$\n$\\Rightarrow \\quad x=2,6$\nAgain, $f^{\\prime \\prime}(x)=6 x-24$ is negative at $x=2$ So that, $f(6)=17, f(2)=49$\nAt the end points, $f(1)=42, f(10)=177$ So that, $f(x)$ has its maximum value 177 .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4b0279619d9d8a1344", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "On the interval $[0,1]$ the function $x^{25}(1-x)^{75}$ takes its maximum value at the point", "image": null}, "options": [{"id": "nBnIX", "text": "0", "image": null, "isCorrect": false}, {"id": "j7O0A", "text": "$1 / 4$", "image": null, "isCorrect": true}, {"id": "xeaC0", "text": "$1 / 2$", "image": null, "isCorrect": false}, {"id": "rBEsN", "text": "$1 / 3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $f(x)=x^{25}(1-x)^{75}$\n$$\n\\begin{aligned}\n\\Rightarrow f^{\\prime}(x) &=25 x^{24}(1-x)^{75}-75 x^{25}(1-x)^{74} \\\\\n&=25 x^{24}(1-x)^{74}(1-4 x) \\\\\n\\therefore \\quad f^{\\prime}(x) &=0 \\\\\n\\Rightarrow \\quad x &=0,1,1 / 4\n\\end{aligned}\n$$\nIf $x < 1 / 4$, then\n$$\nf^{\\prime}(x)=25 x^{24}(1-x)^{74}(1-4 x)>0 .\n$$\nand if $x>1 / 4$, then\n$$\nf^{\\prime}(x)=25 x^{24}(1-x)^{74}(1-4 x) < 0 .\n$$\nThus, $f^{\\prime}(x)$ changes its sign from positive to negative as $x$ passes through $1 / 4$ from left to right. Hence, $f(x)$ attains its maximum at $x=1 / 4$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e4a0279619d9d8a1343", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "If the function $f(x)=2 x^{3}-9 a x^{2}+12 a^{2} x+1$ attains its maximum and minimum at $p$ and $q$ respectively such that $p^{2}=q$, then $a$ equals", "image": null}, "options": [{"id": "X63AN", "text": "0", "image": null, "isCorrect": false}, {"id": "B15Wd", "text": "1", "image": null, "isCorrect": false}, {"id": "HNm1k", "text": "2", "image": null, "isCorrect": true}, {"id": "hmL0A", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given, $f(x)=2 x^{3}-9 a x^{2}+12 a^{2} x+1$ attains maximum and minimum at $p$ and $q$ respectively. $\\therefore$\n$$\nf^{\\prime}(p)=0, f^{\\prime}(q)=0\n$$\nNow,\n$$\n\\begin{array}{c}\nf^{\\prime \\prime}(p) < 0 \\text { and } f^{\\prime \\prime}(q)>0 \\\\\nf^{\\prime}(p)=0\n\\end{array}\n$$\nand\n$$\n\\begin{array}{r}\nf^{\\prime}(q)=0 \\\\\n6 p^{2}-18 a p+12 a^{2}=0 \\\\\n6 q^{2}-18 a q+12 a^{2}=0\n\\end{array}\n$$\nand\n$$\n\\begin{array}{ll}\n\\Rightarrow & p^{2}-3 a p+2 a^{2}=0 \\\\\n\\text { and } & q^{2}-3 a q+2 a^{2}=0\n\\end{array}\n$$\n$p=a, 2 a, q=a, 2 a$\n$\\begin{array}{lrl}\\Rightarrow & p=a, 2 a, q=a, \\\\ \\text { Now, } & f^{\\prime \\prime}(p) < 0\\end{array}$\n$\\Rightarrow \\quad 12 p-18 a < 0$\n$\\Rightarrow \\quad p < \\frac{3}{2} a$\nand $f^{\\prime \\prime}(q)>0 \\Rightarrow 12 q-18 a>0$\n$\\Rightarrow \\quad q>\\frac{3}{2} a$\nFrom Eqs. (i), (ii) and (iii), we get $\\begin{aligned} p &=a, q=2 a \\\\ \\text { Now, } \\quad p^{2} &=q \\end{aligned}$\n$$\n\\begin{array}{lc}\n\\Rightarrow & a^{2}=2 a \\\\\n\\Rightarrow & a=0,2\n\\end{array}\n$$\nBut for $a=0, f(x)=2 x^{3}+1$ which does not\nattains a maximum or minimum for any value of $x$. Hence, $a=2$.\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a263380279619d9d8a3d27", "title": "Mean Value Theorem", "totalQuestions": 38, "questions": [{"_id": "6abb88a815a9fc0fc8c145c3", "type": "singleCorrect", "question": {"text": "If $f(x)$ satisfy the condition of Rolle's Theorm in $[1, 2]$ and $f(x)$ is continuous in $[1, 2]$ then $\\int_1^2 f'(x)\\,dx$ is equal to _____", "image": null}, "options": [{"id": "nUbDa", "label": "A", "text": "$3$", "isCorrect": false, "image": null}, {"id": "ISl85", "label": "B", "text": "$0$", "isCorrect": true, "image": null}, {"id": "x0DjP", "label": "C", "text": "$1$", "isCorrect": false, "image": null}, {"id": "p0T3F", "label": "D", "text": "$2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since $f(x)$ satisfies the conditions of Rolle's Theorem on $[1, 2]$, we have $f(1) = f(2)$.<br><br>The given integral is $\\int_1^2 f'(x)\\,dx$.<br><br>Using the Fundamental Theorem of Calculus, we get:<br><br>$\\int_1^2 f'(x)\\,dx = [f(x)]_1^2 = f(2) - f(1)$<br><br>Substituting $f(1) = f(2)$, we get:<br><br>$f(2) - f(1) = 0$<br><br>Answer: $0$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb887815a9fc0fc8c14401", "type": "singleCorrect", "question": {"text": "If Rolle's theorem holds for the function $f(x) = x^2 - px + 10$, $x \\in [0, 4]$ with $c = 2$, then $p = $", "image": null}, "options": [{"id": "s3RNA", "label": "A", "text": "$4$", "isCorrect": true, "image": null}, {"id": "T08FJ", "label": "B", "text": "$2$", "isCorrect": false, "image": null}, {"id": "QvRwq", "label": "C", "text": "$-4$", "isCorrect": false, "image": null}, {"id": "pMU7x", "label": "D", "text": "$-2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For Rolle's theorem to hold for $f(x)$ on $[0, 4]$, the derivative $f'(x)$ must be zero at $x = c$.<br><br>Given $f(x) = x^2 - px + 10$, differentiating with respect to $x$ gives:<br><br>$f'(x) = 2x - p$<br><br>Since $c = 2$ is the point where $f'(c) = 0$:<br><br>$f'(2) = 2(2) - p = 0$<br><br>$4 - p = 0$<br><br>$p = 4$<br><br>Additionally, checking the condition $f(0) = f(4)$:<br><br>$10 = 16 - 4p + 10$<br><br>$4p = 16 \\Rightarrow p = 4$<br><br>Answer: $4$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be9996a", "title": "MHT CET 2026 (14 May Shift 2)", "shortName": "2026 (14 May Shift 2)", "isVisible": true, "heldOn": "2026-05-14T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888815a9fc0fc8c14499", "type": "singleCorrect", "question": {"text": "The value of $c$ for which the function $f(x) = \\log\\left(\\dfrac{x^2 + 6}{5x}\\right)$ satisfies Rolle's theorem in the interval $[2, 3]$ is ____", "image": null}, "options": [{"id": "tgPwC", "label": "A", "text": "$\\sqrt{5}$", "isCorrect": false, "image": null}, {"id": "2WWPb", "label": "B", "text": "$\\sqrt{7}$", "isCorrect": false, "image": null}, {"id": "IbWvp", "label": "C", "text": "$\\sqrt{8}$", "isCorrect": false, "image": null}, {"id": "5nQ45", "label": "D", "text": "$\\sqrt{6}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $f(x) = \\log\\left(\\dfrac{x^2 + 6}{5x}\\right)$ on the interval $[2, 3]$.<br><br>$f(2) = \\log\\left(\\dfrac{4 + 6}{10}\\right) = \\log(1) = 0$<br><br>$f(3) = \\log\\left(\\dfrac{9 + 6}{15}\\right) = \\log(1) = 0$<br><br>Since $f(2) = f(3)$, Rolle's theorem is applicable.<br><br>Differentiating $f(x)$ with respect to $x$:<br><br>$f'(x) = \\dfrac{d}{dx} (\\log(x^2 + 6) - \\log(5x))$<br><br>$f'(x) = \\dfrac{2x}{x^2 + 6} - \\dfrac{1}{x}$<br><br>$f'(x) = \\dfrac{2x^2 - (x^2 + 6)}{x(x^2 + 6)} = \\dfrac{x^2 - 6}{x(x^2 + 6)}$<br><br>By Rolle's theorem, there exists $c \\in (2, 3)$ such that $f'(c) = 0$.<br><br>$\\dfrac{c^2 - 6}{c(c^2 + 6)} = 0$<br><br>$c^2 - 6 = 0 \\Rightarrow c = \\pm\\sqrt{6}$<br><br>Since $c \\in (2, 3)$, we have $c = \\sqrt{6}$.<br><br>Answer: $\\sqrt{6}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb888815a9fc0fc8c14497", "type": "singleCorrect", "question": {"text": "In the Lagrange's Mean Value Theorem, $f(b) - f(a) = (b - a)f'(c);\\ (a < c < b)$. If $a = 2, b = 4$ and $f(x) = \\sqrt{x^2 - 4}$, then the value of $c$ is", "image": null}, "options": [{"id": "Tse7j", "label": "A", "text": "$\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "Ufk6n", "label": "B", "text": "$\\sqrt{7}$", "isCorrect": false, "image": null}, {"id": "q8esl", "label": "C", "text": "$\\sqrt{5}$", "isCorrect": false, "image": null}, {"id": "1RAJa", "label": "D", "text": "$\\sqrt{6}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Given $f(x) = \\sqrt{x^2 - 4}$ and the interval $[2, 4]$.<br><br>$f(2) = \\sqrt{2^2 - 4} = 0$<br><br>$f(4) = \\sqrt{4^2 - 4} = \\sqrt{12} = 2\\sqrt{3}$<br><br>Differentiating $f(x)$ with respect to $x$:<br><br>$f'(x) = \\dfrac{x}{\\sqrt{x^2 - 4}}$<br><br>By Lagrange's Mean Value Theorem:<br><br>$f'(c) = \\dfrac{f(b) - f(a)}{b - a}$<br><br>$\\dfrac{c}{\\sqrt{c^2 - 4}} = \\dfrac{2\\sqrt{3} - 0}{4 - 2}$<br><br>$\\dfrac{c}{\\sqrt{c^2 - 4}} = \\sqrt{3}$<br><br>Squaring both sides:<br><br>$\\dfrac{c^2}{c^2 - 4} = 3$<br><br>$c^2 = 3c^2 - 12$<br><br>$2c^2 = 12$<br><br>$c^2 = 6$<br><br>$c = \\sqrt{6}$ (since $c \\in (2, 4)$)<br><br>Answer: $\\sqrt{6}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99969", "title": "MHT CET 2026 (14 May Shift 1)", "shortName": "2026 (14 May Shift 1)", "isVisible": true, "heldOn": "2026-05-14T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c815a9fc0fc8c146f1", "type": "singleCorrect", "question": {"text": "If Rolle's theorem holds for the function $f(x) = x^3 + px^2 + qx + 5, x \\in [1, 3]$ with $c = 2 + \\dfrac{1}{\\sqrt{3}}$, then the values of $p$ and $q$ are respectively...", "image": null}, "options": [{"id": "mEfN6", "label": "A", "text": "$6, -11$", "isCorrect": false, "image": null}, {"id": "022Wb", "label": "B", "text": "$6, 11$", "isCorrect": false, "image": null}, {"id": "BPbI9", "label": "C", "text": "$-6, 11$", "isCorrect": true, "image": null}, {"id": "9U6M0", "label": "D", "text": "$-6, -11$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For Rolle's theorem to hold for $f(x)$ on $[1, 3]$, we must have $f(1) = f(3)$.<br><br>$f(1) = 1^3 + p(1)^2 + q(1) + 5 = p + q + 6$<br><br>$f(3) = 3^3 + p(3)^2 + q(3) + 5 = 9p + 3q + 32$<br><br>Equating $f(1)$ and $f(3)$:<br><br>$p + q + 6 = 9p + 3q + 32$<br><br>$8p + 2q + 26 = 0 \\Rightarrow 4p + q + 13 = 0$<br><br>Also, by Rolle's theorem, $f'(c) = 0$ for the given $c \\in (1, 3)$.<br><br>$f'(x) = 3x^2 + 2px + q$<br><br>Given $c = 2 + \\dfrac{1}{\\sqrt{3}}$, we have:<br><br>$f'\\left(2 + \\dfrac{1}{\\sqrt{3}}\\right) = 3\\left(2 + \\dfrac{1}{\\sqrt{3}}\\right)^2 + 2p\\left(2 + \\dfrac{1}{\\sqrt{3}}\\right) + q = 0$<br><br>$3\\left(4 + \\dfrac{1}{3} + \\dfrac{4}{\\sqrt{3}}\\right) + 4p + \\dfrac{2p}{\\sqrt{3}} + q = 0$<br><br>$12 + 1 + \\dfrac{12}{\\sqrt{3}} + 4p + \\dfrac{2p}{\\sqrt{3}} + q = 0$<br><br>$(4p + q + 13) + \\dfrac{12 + 2p}{\\sqrt{3}} = 0$<br><br>From the first condition, $4p + q + 13 = 0$. Substituting this gives:<br><br>$0 + \\dfrac{12 + 2p}{\\sqrt{3}} = 0$<br><br>$12 + 2p = 0 \\Rightarrow p = -6$<br><br>Substituting $p = -6$ into $4p + q + 13 = 0$:<br><br>$4(-6) + q + 13 = 0$<br><br>$-24 + q + 13 = 0 \\Rightarrow q = 11$<br><br>The values of $p$ and $q$ are $-6$ and $11$ respectively.<br><br>Answer: $-6, 11$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb883915a9fc0fc8c141a9", "type": "singleCorrect", "question": {"text": "For which of the following functions is Rolle's theorem not applicable?", "image": null}, "options": [{"id": "R9wZx", "label": "A", "text": "$f(x)=\\log(x^2+2)-\\log 3, on\\,[-1,1]$", "isCorrect": false, "image": null}, {"id": "hzx3c", "label": "B", "text": "$f(x)=3+(x-1)^{2/3}, on\\,[0,3]$", "isCorrect": true, "image": null}, {"id": "UK1Os", "label": "C", "text": "$f(x)=e^{1-x^2}, on\\,[-1,1]$", "isCorrect": false, "image": null}, {"id": "z2kae", "label": "D", "text": "$f(x)=\\sqrt{4-x^2}, on\\,[-2,2]$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "For Rolle's theorem to be applicable for a function $f(x)$ on $[a, b]$, the function must be continuous on $[a, b]$, differentiable on $(a, b)$, and $f(a) = f(b)$.<br><br>Checking the function $f(x) = 3 + (x-1)^{2/3}$ on $[0, 3]$:<br><br>Differentiating with respect to $x$, we get $f'(x) = \\dfrac{2}{3(x-1)^{1/3}}$.<br><br>At $x = 1 \\in (0, 3)$, $f'(x)$ is undefined. Thus, $f(x)$ is not differentiable on $(0, 3)$.<br><br>Also, $f(0) = 3 + (-1)^{2/3} = 4$ and $f(3) = 3 + (2)^{2/3} \\neq 4$, so $f(0) \\neq f(3)$.<br><br>Since the conditions of Rolle's theorem are not satisfied, it is not applicable for this function.<br><br>Answer: $f(x)=3+(x-1)^{2/3}, on\\,[0,3]$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99965", "title": "MHT CET 2026 (12 May Shift 1)", "shortName": "2026 (12 May Shift 1)", "isVisible": true, "heldOn": "2026-05-12T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2af8c30a4553e1bdbbb", "type": "singleCorrect", "question": {"text": "The function $f(x) = x(x + 3)e^{-\\left(\\frac{1}{2}\\right)x}$ satisfies all the conditions of Rolle's theorem in $[-3, 0]$, then $c =$", "image": null}, "options": [{"id": "JToYm", "label": "A", "text": "$-3$", "isCorrect": false, "image": null}, {"id": "igaWj", "label": "B", "text": "$-2$", "isCorrect": true, "image": null}, {"id": "iboH6", "label": "C", "text": "$-1$", "isCorrect": false, "image": null}, {"id": "ZHwLq", "label": "D", "text": "$0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given $f(x) = (x^2 + 3x)e^{-\\dfrac{x}{2}}$<br><br>Differentiating with respect to $x$:<br><br>$f'(x) = (2x + 3)e^{-\\dfrac{x}{2}} + (x^2 + 3x)e^{-\\dfrac{x}{2}} \\left(-\\dfrac{1}{2}\\right)$<br><br>$f'(x) = e^{-\\dfrac{x}{2}} \\left( 2x + 3 - \\dfrac{x^2 + 3x}{2} \\right)$<br><br>$f'(x) = e^{-\\dfrac{x}{2}} \\left( \\dfrac{-x^2 + x + 6}{2} \\right)$<br><br>By Rolle's theorem, there exists $c \\in (-3, 0)$ such that $f'(c) = 0$.<br><br>$\\dfrac{-c^2 + c + 6}{2} = 0$<br><br>$c^2 - c - 6 = 0$<br><br>$(c - 3)(c + 2) = 0$<br><br>$c = 3$ or $c = -2$<br><br>Since $c \\in (-3, 0)$, we get $c = -2$.<br><br>Answer: $-2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7d", "title": "MHT CET 2026 (20 April Shift 2)", "shortName": "2026 (20 April Shift 2)", "isVisible": true, "heldOn": "2026-04-20T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3128c30a4553e1bdfd6", "type": "singleCorrect", "question": {"text": "Rolle's theorem holds for monic quadratic polynomial $f(x)$ on the interval $[\\alpha, \\alpha + 3]$ where $f(\\alpha) = 0$. Similarly, $g(x) = f(x) + 2$ also follows Rolle's theorem in the interval $[\\beta, 3]$ where $g(3) = 0$, such that the value of $c$ is the same for both $f(x)$ and $g(x)$. Then the value of $(f \\circ g)(\\alpha)$ is...", "image": null}, "options": [{"id": "1nolz", "label": "A", "text": "$-4$", "isCorrect": false, "image": null}, {"id": "glvQK", "label": "B", "text": "$4$", "isCorrect": false, "image": null}, {"id": "EfiVq", "label": "C", "text": "$-2$", "isCorrect": true, "image": null}, {"id": "A7QQC", "label": "D", "text": "$2$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since $f(x)$ is a monic quadratic polynomial and Rolle's theorem holds on $[\\alpha, \\alpha + 3]$ with $f(\\alpha) = 0$, we have $f(\\alpha + 3) = f(\\alpha) = 0$.<br><br>Thus, $f(x) = (x - \\alpha)(x - \\alpha - 3)$.<br><br>The value of $c$ for $f(x)$ is the midpoint of the interval, $c = \\alpha + \\dfrac{3}{2}$.<br><br>For $g(x) = f(x) + 2$, Rolle's theorem holds on $[\\beta, 3]$. The value of $c$ is the same, so the midpoint of $[\\beta, 3]$ is also $\\alpha + \\dfrac{3}{2}$.<br><br>$\\dfrac{\\beta + 3}{2} = \\alpha + \\dfrac{3}{2} \\Rightarrow \\beta = 2\\alpha$.<br><br>We are given $g(3) = 0$, which means $f(3) + 2 = 0 \\Rightarrow f(3) = -2$.<br><br>Substituting $x = 3$ in $f(x)$, we get:<br><br>$(3 - \\alpha)(3 - \\alpha - 3) = -2 \\Rightarrow -\\alpha(3 - \\alpha) = -2 \\Rightarrow \\alpha^2 - 3\\alpha + 2 = 0$.<br><br>This gives $\\alpha = 1$ or $\\alpha = 2$.<br><br>If $\\alpha = 2$, then $\\beta = 4$, making the interval $[4, 3]$, which is invalid. Thus, $\\alpha = 1$ and $\\beta = 2$.<br><br>So, $f(x) = (x - 1)(x - 4)$ and $g(x) = f(x) + 2$.<br><br>We need to find $(f \\circ g)(\\alpha) = f(g(1))$.<br><br>Since $f(1) = 0$, $g(1) = f(1) + 2 = 2$.<br><br>Then, $f(g(1)) = f(2) = (2 - 1)(2 - 4) = -2$.<br><br>Answer: $-2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 3, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3048c30a4553e1bdf3f", "type": "singleCorrect", "question": {"text": "The value of $c$ satisfied by the Rolle's theorem for the function $f(x) = x^2(1 - x)^2$, $x \\in [0, 1]$ is...", "image": null}, "options": [{"id": "pymHi", "label": "A", "text": "$0$", "isCorrect": false, "image": null}, {"id": "ZAWam", "label": "B", "text": "$1$", "isCorrect": false, "image": null}, {"id": "09a2k", "label": "C", "text": "$\\dfrac{1}{2}$", "isCorrect": true, "image": null}, {"id": "ufzAV", "label": "D", "text": "$-1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Given function is $f(x) = x^2(1 - x)^2$ on the interval $[0, 1]$.<br><br>The function is a polynomial, so it is continuous on $[0, 1]$ and differentiable on $(0, 1)$.<br><br>Also, $f(0) = 0$ and $f(1) = 0$, so $f(0) = f(1)$.<br><br>By Rolle's theorem, there exists at least one $c \\in (0, 1)$ such that $f'(c) = 0$.<br><br>Differentiating $f(x)$ with respect to $x$:<br><br>$f'(x) = \\dfrac{d}{dx}[x^2(1 - x)^2] = 2x(1 - x)^2 + x^2 \\cdot 2(1 - x)(-1)$<br><br>$f'(x) = 2x(1 - x)[(1 - x) - x] = 2x(1 - x)(1 - 2x)$<br><br>Setting $f'(c) = 0$:<br><br>$2c(1 - c)(1 - 2c) = 0$<br><br>The possible values are $c = 0$, $c = 1$, and $c = \\dfrac{1}{2}$.<br><br>Since $c$ must lie in the open interval $(0, 1)$, the only valid value is $c = \\dfrac{1}{2}$.<br><br>Answer: $\\dfrac{1}{2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7a", "title": "MHT CET 2026 (19 April Shift 1)", "shortName": "2026 (19 April Shift 1)", "isVisible": true, "heldOn": "2026-04-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f68c30a4553e1bdeaa", "type": "singleCorrect", "question": {"text": "If the function $f(x) = ax^2 + bx + \\sin x$ satisfies all the conditions of Rolle's theorem on $[0, \\pi]$ and the slope of the tangent to the curve $y = f(x)$ at $x = \\dfrac{\\pi}{4}$ is zero, then $a - b = $", "image": null}, "options": [{"id": "HAsvs", "label": "A", "text": "$\\dfrac{\\sqrt{2}(1-\\pi)}{\\pi}$", "isCorrect": false, "image": null}, {"id": "Jd990", "label": "B", "text": "$\\dfrac{\\sqrt{2}(2+\\pi)}{\\pi}$", "isCorrect": false, "image": null}, {"id": "c2huu", "label": "C", "text": "$\\dfrac{\\sqrt{2}(\\pi-1)}{\\pi}$", "isCorrect": false, "image": null}, {"id": "7VKFp", "label": "D", "text": "$\\dfrac{\\sqrt{2}(\\pi+1)}{\\pi}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Since $f(x)$ satisfies Rolle's theorem on $[0, \\pi]$, we have $f(0) = f(\\pi)$.<br><br>$a(0)^2 + b(0) + \\sin 0 = a\\pi^2 + b\\pi + \\sin \\pi$<br><br>$0 = a\\pi^2 + b\\pi$<br><br>$b = -a\\pi$<br><br>The slope of the tangent at $x = \\dfrac{\\pi}{4}$ is zero, so $f'\\left(\\dfrac{\\pi}{4}\\right) = 0$.<br><br>$f'(x) = 2ax + b + \\cos x$<br><br>$f'\\left(\\dfrac{\\pi}{4}\\right) = 2a\\left(\\dfrac{\\pi}{4}\\right) + b + \\cos\\left(\\dfrac{\\pi}{4}\\right) = 0$<br><br>$\\dfrac{a\\pi}{2} + b + \\dfrac{1}{\\sqrt{2}} = 0$<br><br>Substituting $b = -a\\pi$:<br><br>$\\dfrac{a\\pi}{2} - a\\pi + \\dfrac{1}{\\sqrt{2}} = 0$<br><br>$-\\dfrac{a\\pi}{2} + \\dfrac{1}{\\sqrt{2}} = 0$<br><br>$a = \\dfrac{\\sqrt{2}}{\\pi}$<br><br>Using $b = -a\\pi$, we get $b = -\\sqrt{2}$.<br><br>Therefore, $a - b = \\dfrac{\\sqrt{2}}{\\pi} - (-\\sqrt{2}) = \\dfrac{\\sqrt{2}(\\pi+1)}{\\pi}$.<br><br>Answer: $\\dfrac{\\sqrt{2}(\\pi+1)}{\\pi}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d31f8c30a4553e1be06d", "type": "singleCorrect", "question": {"text": "If the function $f(x) = ax^3 - bx^2 - 8x - 4$ satisfies Roll's theorem in $[1,3]$, if $f'(2) = 0$ then $a - b$ is equal to...", "image": null}, "options": [{"id": "BjIlg", "label": "A", "text": "$2$", "isCorrect": true, "image": null}, {"id": "rDwaA", "label": "B", "text": "$-2$", "isCorrect": false, "image": null}, {"id": "JBRRM", "label": "C", "text": "$0$", "isCorrect": false, "image": null}, {"id": "zf7px", "label": "D", "text": "$1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since $f(x)$ satisfies Rolle's theorem in $[1, 3]$, we have $f(1) = f(3)$.<br><br>$a(1)^3 - b(1)^2 - 8(1) - 4 = a(3)^3 - b(3)^2 - 8(3) - 4$<br><br>$a - b - 12 = 27a - 9b - 28$<br><br>$26a - 8b = 16 \\Rightarrow 13a - 4b = 8$<br><br>Also, $f'(x) = 3ax^2 - 2bx - 8$.<br><br>Given $f'(2) = 0$, we have:<br><br>$3a(2)^2 - 2b(2) - 8 = 0$<br><br>$12a - 4b = 8$<br><br>Subtracting the second equation from the first:<br><br>$(13a - 4b) - (12a - 4b) = 8 - 8$<br><br>$a = 0$<br><br>Substituting $a = 0$ into $12a - 4b = 8$:<br><br>$-4b = 8 \\Rightarrow b = -2$<br><br>Therefore, $a - b = 0 - (-2) = 2$.", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a72", "title": "MHT CET 2026 (15 April Shift 1)", "shortName": "2026 (15 April Shift 1)", "isVisible": true, "heldOn": "2026-04-15T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a28c30a4553e1bdb27", "type": "singleCorrect", "question": {"text": "If Rolle's theorem is applicable for the function $f(x) = \\log\\left(\\dfrac{x^2+a}{x}\\right)$ on $[3, 4]$ with $c \\in (3, 4)$ such that $f'(c) = 0$, then the value of $f''(c)$ is", "image": null}, "options": [{"id": "WqhNG", "label": "A", "text": "$\\dfrac{1}{48}$", "isCorrect": false, "image": null}, {"id": "q8GwG", "label": "B", "text": "$\\dfrac{1}{36}$", "isCorrect": false, "image": null}, {"id": "TC4fh", "label": "C", "text": "$\\dfrac{1}{24}$", "isCorrect": false, "image": null}, {"id": "EQeh3", "label": "D", "text": "$\\dfrac{1}{12}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Since Rolle's theorem is applicable for $f(x)$ on $[3, 4]$, we have $f(3) = f(4)$.<br><br>$\\log\\left(\\dfrac{9+a}{3}\\right) = \\log\\left(\\dfrac{16+a}{4}\\right)$<br><br>$\\dfrac{9+a}{3} = \\dfrac{16+a}{4}$<br><br>$36 + 4a = 48 + 3a \\Rightarrow a = 12$<br><br>The function becomes $f(x) = \\log(x^2+12) - \\log x$.<br><br>Differentiating with respect to $x$:<br><br>$f'(x) = \\dfrac{2x}{x^2+12} - \\dfrac{1}{x}$<br><br>For $f'(c) = 0$:<br><br>$\\dfrac{2c}{c^2+12} - \\dfrac{1}{c} = 0 \\Rightarrow 2c^2 = c^2 + 12 \\Rightarrow c^2 = 12$<br><br>Differentiating $f'(x)$ again to find $f''(x)$:<br><br>$f''(x) = \\dfrac{2(x^2+12) - 2x(2x)}{(x^2+12)^2} + \\dfrac{1}{x^2} = \\dfrac{24-2x^2}{(x^2+12)^2} + \\dfrac{1}{x^2}$<br><br>Substituting $c^2 = 12$:<br><br>$f''(c) = \\dfrac{24 - 2(12)}{(12+12)^2} + \\dfrac{1}{12} = 0 + \\dfrac{1}{12} = \\dfrac{1}{12}$<br><br>Answer: $\\dfrac{1}{12}$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2a28c30a4553e1bdb25", "type": "singleCorrect", "question": {"text": "Let $f(x)$ be the differentiable function for all $x$ such that $f'(x) \\leq 5$ and $f(1) = 4$. The maximum value of $f(5)$ is...", "image": null}, "options": [{"id": "4dEVx", "label": "A", "text": "$16$", "isCorrect": false, "image": null}, {"id": "Tb2qX", "label": "B", "text": "$20$", "isCorrect": false, "image": null}, {"id": "ITB4I", "label": "C", "text": "$24$", "isCorrect": true, "image": null}, {"id": "2bpG2", "label": "D", "text": "$25$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "By Lagrange's Mean Value Theorem on the interval $[1, 5]$, there exists some $c \\in (1, 5)$ such that<br><br>$f'(c) = \\dfrac{f(5) - f(1)}{5 - 1}$<br><br>Given that $f'(x) \\leq 5$ for all $x$, we have $f'(c) \\leq 5$.<br><br>$\\dfrac{f(5) - 4}{4} \\leq 5$<br><br>$f(5) - 4 \\leq 20$<br><br>$f(5) \\leq 24$<br><br>The maximum value of $f(5)$ is $24$.<br><br>Answer: $24$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a71", "title": "MHT CET 2026 (13 April Shift 2)", "shortName": "2026 (13 April Shift 2)", "isVisible": true, "heldOn": "2026-04-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3678c30a4553e1be35b", "type": "singleCorrect", "question": {"text": "If the function $f(x) = ax^3 + bx^2 + 11x - 6$, defined on $[1, 3]$, satisfies all the conditions of Rolle's theorem for $c = 2 + \\dfrac{1}{\\sqrt{3}}$, then", "image": null}, "options": [{"id": "4fmrs", "label": "A", "text": "$a = -1, b = \\dfrac{1}{2}$", "isCorrect": false, "image": null}, {"id": "blEhy", "label": "B", "text": "$a = 1, b = -6$", "isCorrect": true, "image": null}, {"id": "mqvug", "label": "C", "text": "$a = -1, b = 6$", "isCorrect": false, "image": null}, {"id": "LoLK8", "label": "D", "text": "$a = -2, b = 1$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Since $f(x)$ satisfies Rolle's theorem on $[1, 3]$, we must have $f(1) = f(3)$.<br><br>$f(1) = a(1)^3 + b(1)^2 + 11(1) - 6 = a + b + 5$<br><br>$f(3) = a(3)^3 + b(3)^2 + 11(3) - 6 = 27a + 9b + 27$<br><br>Equating $f(1)$ and $f(3)$:<br><br>$a + b + 5 = 27a + 9b + 27$<br><br>$26a + 8b + 22 = 0 \\Rightarrow 13a + 4b + 11 = 0$<br><br>By Rolle's theorem, $f'(c) = 0$ for $c = 2 + \\dfrac{1}{\\sqrt{3}}$.<br><br>$f'(x) = 3ax^2 + 2bx + 11$<br><br>$f'\\left(2 + \\dfrac{1}{\\sqrt{3}}\\right) = 3a\\left(2 + \\dfrac{1}{\\sqrt{3}}\\right)^2 + 2b\\left(2 + \\dfrac{1}{\\sqrt{3}}\\right) + 11 = 0$<br><br>$3a\\left(4 + \\dfrac{1}{3} + \\dfrac{4}{\\sqrt{3}}\\right) + 4b + \\dfrac{2b}{\\sqrt{3}} + 11 = 0$<br><br>$13a + 4\\sqrt{3}a + 4b + \\dfrac{2b}{\\sqrt{3}} + 11 = 0$<br><br>$(13a + 4b + 11) + \\dfrac{1}{\\sqrt{3}}(12a + 2b) = 0$<br><br>Substituting $13a + 4b + 11 = 0$ into the above equation:<br><br>$\\dfrac{1}{\\sqrt{3}}(12a + 2b) = 0 \\Rightarrow 12a + 2b = 0 \\Rightarrow b = -6a$<br><br>Substituting $b = -6a$ into $13a + 4b + 11 = 0$:<br><br>$13a + 4(-6a) + 11 = 0$<br><br>$-11a + 11 = 0 \\Rightarrow a = 1$<br><br>$b = -6(1) = -6$<br><br>Answer: $a = 1, b = -6$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a6f", "title": "MHT CET 2026 (11 April Shift 2)", "shortName": "2026 (11 April Shift 2)", "isVisible": true, "heldOn": "2026-04-11T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bc4bf9280d7f9932c3d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The function $\\mathrm{f}(x)=x^3-6 x^2+a x+b$ satisfies the conditions of Rolle's theorem in $[1,3]$. Then the values of $a$ and $b$ are respectively", "image": null}, "options": [{"id": "SSYBT", "text": "$11,-6$", "image": null, "isCorrect": true}, {"id": "7edGN", "text": "$-6,11$", "image": null, "isCorrect": false}, {"id": "KW0NB", "text": "$-11,6$", "image": null, "isCorrect": false}, {"id": "JXcL0", "text": "$6, -11$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For a function to satisfy the conditions of Rolle's theorem in the interval $[1, 3]$, we must have $f(1) = f(3)$.<br><br>Given $f(x) = x^3 - 6x^2 + ax + b$, we find $f(1)$ and $f(3)$:<br><br>$f(1) = (1)^3 - 6(1)^2 + a(1) + b = a + b - 5$<br><br>$f(3) = (3)^3 - 6(3)^2 + a(3) + b = 27 - 54 + 3a + b = 3a + b - 27$<br><br>Equating $f(1)$ and $f(3)$:<br><br>$a + b - 5 = 3a + b - 27$<br><br>$2a = 22 \\Rightarrow a = 11$<br><br>The value of $b$ can be any real number. Looking at the given options, the only option with $a = 11$ is $11, -6$.<br><br>Thus, $a = 11$ and $b = -6$.<br><br>Answer: $11,-6$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871baebf9280d7f9932b87", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If Rolle's theorem holds for the function $x^3+a x^2+b x, 1 \\leqslant x \\leqslant 2$ at the point $\\frac{4}{3}$, then the values of $a$ and $b$ are respectively.", "image": null}, "options": [{"id": "B49DP", "text": "$5,8$", "image": null, "isCorrect": false}, {"id": "wQkzd", "text": "$-8,5$", "image": null, "isCorrect": false}, {"id": "uUB8E", "text": "$8,-5$", "image": null, "isCorrect": false}, {"id": "KUzxU", "text": "$-5,8$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For Rolle's theorem to hold for $f(x) = x^3 + ax^2 + bx$ on $[1, 2]$, we must have $f(1) = f(2)$ and $f'(c) = 0$ where $c = \\dfrac{4}{3}$.<br><br>Using $f(1) = f(2)$:<br><br>$1^3 + a(1)^2 + b(1) = 2^3 + a(2)^2 + b(2)$<br><br>$1 + a + b = 8 + 4a + 2b$<br><br>$3a + b = -7$<br><br>Using $f'(c) = 0$ at $c = \\dfrac{4}{3}$:<br><br>$f'(x) = 3x^2 + 2ax + b$<br><br>$f'\\left(\\dfrac{4}{3}\\right) = 3\\left(\\dfrac{4}{3}\\right)^2 + 2a\\left(\\dfrac{4}{3}\\right) + b = 0$<br><br>$\\dfrac{16}{3} + \\dfrac{8a}{3} + b = 0$<br><br>$8a + 3b = -16$<br><br>Solving the two equations $3a + b = -7$ and $8a + 3b = -16$:<br><br>From the first equation, $b = -7 - 3a$. Substituting into the second equation:<br><br>$8a + 3(-7 - 3a) = -16$<br><br>$8a - 21 - 9a = -16$<br><br>$-a = 5 \\Rightarrow a = -5$<br><br>Substituting $a = -5$ into $b = -7 - 3a$:<br><br>$b = -7 - 3(-5) = 8$<br><br>The values of $a$ and $b$ are $-5$ and $8$ respectively.<br><br>Answer: $-5,8$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7ebf9280d7f99329c2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Let f be a function which is continuous and differentiable for all $x$. If $\\mathrm{f}(1)=1$ and $\\mathrm{f}^{\\prime}(\\mathrm{x}) \\leq 5$ for all $x$ in $[1,5]$, then the maximum value of $f(5)$ is", "image": null}, "options": [{"id": "10xSf", "text": "$5$", "image": null, "isCorrect": false}, {"id": "GaVgR", "text": "$20$", "image": null, "isCorrect": false}, {"id": "uAREH", "text": "$6$", "image": null, "isCorrect": false}, {"id": "Lg5sZ", "text": "$21$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "By Lagrange's Mean Value Theorem for the function $f(x)$ on the interval $[1, 5]$, there exists at least one $c \\in (1, 5)$ such that<br><br>$f'(c) = \\dfrac{f(5) - f(1)}{5 - 1}$<br><br>It is given that $f'(x) \\leq 5$ for all $x \\in [1, 5]$. Therefore, $f'(c) \\leq 5$.<br><br>$\\dfrac{f(5) - 1}{4} \\leq 5$<br><br>$f(5) - 1 \\leq 20$<br><br>$f(5) \\leq 21$<br><br>The maximum value of $f(5)$ is $21$.<br><br>Answer: $21$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b63bf9280d7f99328b8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The abscissae of the points of the curve $\\mathrm{y}=x^3$ are in the interval $[-2,2]$, where the slope of the tangents can be obtained by mean value theorem for the interval $[-2,2]$ are", "image": null}, "options": [{"id": "mtnuV", "text": "$0$", "image": null, "isCorrect": false}, {"id": "XlKC0", "text": "$\\pm \\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "2L5u1", "text": "$\\pm \\frac{2}{\\sqrt{3}}$", "image": null, "isCorrect": true}, {"id": "KAyOc", "text": "$\\frac{\\sqrt{3}}{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x) = x^3$ and the interval $[-2, 2]$.<br><br>By Lagrange's Mean Value Theorem, there exists at least one point $c \\in (-2, 2)$ such that $f'(c) = \\dfrac{f(b) - f(a)}{b - a}$.<br><br>Here, $a = -2$ and $b = 2$.<br><br>$f(2) = 2^3 = 8$<br><br>$f(-2) = (-2)^3 = -8$<br><br>$f'(x) = 3x^2 \\Rightarrow f'(c) = 3c^2$<br><br>Substituting these values into the Mean Value Theorem formula:<br><br>$3c^2 = \\dfrac{8 - (-8)}{2 - (-2)}$<br><br>$3c^2 = \\dfrac{16}{4} = 4$<br><br>$c^2 = \\dfrac{4}{3}$<br><br>$c = \\pm \\dfrac{2}{\\sqrt{3}}$<br><br>Since $\\pm \\dfrac{2}{\\sqrt{3}} \\in (-2, 2)$, the required abscissae are $\\pm \\dfrac{2}{\\sqrt{3}}$.<br><br>Answer: $\\pm \\frac{2}{\\sqrt{3}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b4fbf9280d7f9932819", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the function $\\mathrm{f}(x)=x(x+3) \\mathrm{e}^{-\\frac{x}{2}}$ satisfies all the conditions of Rolle's theorem in $[-3,0]$, then c is", "image": null}, "options": [{"id": "ZOywZ", "text": "$0$", "image": null, "isCorrect": false}, {"id": "vszWB", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "cTKvo", "text": "$-2$", "image": null, "isCorrect": true}, {"id": "TMSHC", "text": "$-3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\mathrm{f}(x) = (x^2 + 3x) \\mathrm{e}^{-\\dfrac{x}{2}}$<br><br>Differentiating with respect to $x$ using the product rule:<br><br>$\\mathrm{f}'(x) = (2x + 3) \\mathrm{e}^{-\\dfrac{x}{2}} + (x^2 + 3x) \\mathrm{e}^{-\\dfrac{x}{2}} \\left(-\\dfrac{1}{2}\\right)$<br><br>$\\mathrm{f}'(x) = \\mathrm{e}^{-\\dfrac{x}{2}} \\left( 2x + 3 - \\dfrac{x^2}{2} - \\dfrac{3x}{2} \\right)$<br><br>$\\mathrm{f}'(x) = \\mathrm{e}^{-\\dfrac{x}{2}} \\left( \\dfrac{-x^2 + x + 6}{2} \\right)$<br><br>By Rolle's theorem, there exists $c \\in (-3, 0)$ such that $\\mathrm{f}'(c) = 0$.<br><br>$\\mathrm{e}^{-\\dfrac{c}{2}} \\left( \\dfrac{-c^2 + c + 6}{2} \\right) = 0$<br><br>Since $\\mathrm{e}^{-\\dfrac{c}{2}} \\neq 0$, we have:<br><br>$-c^2 + c + 6 = 0$<br><br>$c^2 - c - 6 = 0$<br><br>$(c - 3)(c + 2) = 0$<br><br>$c = 3$ or $c = -2$<br><br>Since $c \\in (-3, 0)$, we get $c = -2$.<br><br>Answer: $-2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b08bf9280d7f99325ca", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "In the mean value theorem, $\\mathrm{f}^{\\prime}(\\mathrm{c})=\\frac{\\mathrm{f}(\\mathrm{b})-\\mathrm{f}(\\mathrm{a})}{\\mathrm{b}-\\mathrm{a}}$, if $a=0, \\mathrm{~b}=\\frac{1}{2}$ and $\\mathrm{f}(x)=x(x-1)(x-2)$, then the value of c is", "image": null}, "options": [{"id": "Iv77T", "text": "$1-\\frac{\\sqrt{15}}{6}$", "image": null, "isCorrect": false}, {"id": "rOQJh", "text": "$1-\\frac{\\sqrt{13}}{6}$", "image": null, "isCorrect": false}, {"id": "O5Yuf", "text": "$1-\\frac{\\sqrt{21}}{6}$", "image": null, "isCorrect": true}, {"id": "7M6pR", "text": "$1+\\frac{\\sqrt{21}}{6}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x) = x(x-1)(x-2) = x^3 - 3x^2 + 2x$<br><br>Differentiating with respect to $x$, we get:<br><br>$f'(x) = 3x^2 - 6x + 2$<br><br>For the given interval $[a, b] = \\left[0, \\dfrac{1}{2}\\right]$:<br><br>$f(a) = f(0) = 0$<br><br>$f(b) = f\\left(\\dfrac{1}{2}\\right) = \\left(\\dfrac{1}{2}\\right)^3 - 3\\left(\\dfrac{1}{2}\\right)^2 + 2\\left(\\dfrac{1}{2}\\right) = \\dfrac{1}{8} - \\dfrac{3}{4} + 1 = \\dfrac{3}{8}$<br><br>By the Mean Value Theorem:<br><br>$f'(c) = \\dfrac{f(b) - f(a)}{b - a}$<br><br>$3c^2 - 6c + 2 = \\dfrac{\\dfrac{3}{8} - 0}{\\dfrac{1}{2} - 0}$<br><br>$3c^2 - 6c + 2 = \\dfrac{3}{4}$<br><br>Multiplying by $4$ on both sides:<br><br>$12c^2 - 24c + 8 = 3$<br><br>$12c^2 - 24c + 5 = 0$<br><br>Using the quadratic formula:<br><br>$c = \\dfrac{24 \\pm \\sqrt{(-24)^2 - 4(12)(5)}}{2(12)}$<br><br>$c = \\dfrac{24 \\pm \\sqrt{576 - 240}}{24}$<br><br>$c = \\dfrac{24 \\pm \\sqrt{336}}{24}$<br><br>$c = \\dfrac{24 \\pm 4\\sqrt{21}}{24}$<br><br>$c = 1 \\pm \\dfrac{\\sqrt{21}}{6}$<br><br>Since $c$ must lie in the open interval $(a, b) = \\left(0, \\dfrac{1}{2}\\right)$, we reject $c = 1 + \\dfrac{\\sqrt{21}}{6}$ as it is greater than $1$.<br><br>Therefore, $c = 1 - \\dfrac{\\sqrt{21}}{6}$.<br><br>Answer: $1-\\frac{\\sqrt{21}}{6}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213d90aee93fa0796dc03", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Let $\\mathrm{f}(x)=(x-1)(x-2)(x-3), x \\in[0,4]$, Values of C will be _______ [if L.M.V.T. (Lagrange's Mean Value Theorem) can be applied].", "image": null}, "options": [{"id": "oaCOz", "text": "$\\dfrac{4-2 \\sqrt{3}}{3}, \\dfrac{4+2 \\sqrt{3}}{3}$", "image": null, "isCorrect": false}, {"id": "hnd3s", "text": "$\\dfrac{6-2 \\sqrt{3}}{3}, \\dfrac{6+2 \\sqrt{3}}{3}$", "image": null, "isCorrect": true}, {"id": "WpwRC", "text": "$\\dfrac{6-\\sqrt{3}}{3}, \\dfrac{6+\\sqrt{3}}{3}$", "image": null, "isCorrect": false}, {"id": "LqDGv", "text": "$2-\\sqrt{3}, 2+\\sqrt{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x) = (x-1)(x-2)(x-3) = x^3 - 6x^2 + 11x - 6$<br><br>Differentiating with respect to $x$, we get:<br><br>$f'(x) = 3x^2 - 12x + 11$<br><br>By Lagrange's Mean Value Theorem, there exists $c \\in (0, 4)$ such that:<br><br>$f'(c) = \\dfrac{f(4) - f(0)}{4 - 0}$<br><br>Evaluating the function at the endpoints:<br><br>$f(4) = (4-1)(4-2)(4-3) = 3 \\times 2 \\times 1 = 6$<br><br>$f(0) = (0-1)(0-2)(0-3) = -1 \\times -2 \\times -3 = -6$<br><br>Substituting these values into the LMVT formula:<br><br>$3c^2 - 12c + 11 = \\dfrac{6 - (-6)}{4}$<br><br>$3c^2 - 12c + 11 = \\dfrac{12}{4} = 3$<br><br>$3c^2 - 12c + 8 = 0$<br><br>Solving for $c$ using the quadratic formula:<br><br>$c = \\dfrac{12 \\pm \\sqrt{(-12)^2 - 4(3)(8)}}{2(3)}$<br><br>$c = \\dfrac{12 \\pm \\sqrt{144 - 96}}{6}$<br><br>$c = \\dfrac{12 \\pm \\sqrt{48}}{6} = \\dfrac{12 \\pm 4\\sqrt{3}}{6}$<br><br>$c = \\dfrac{6 \\pm 2\\sqrt{3}}{3}$<br><br>Since both values $\\dfrac{6 - 2\\sqrt{3}}{3} \\approx 0.845$ and $\\dfrac{6 + 2\\sqrt{3}}{3} \\approx 3.155$ lie in the interval $(0, 4)$, they are valid values for $c$.<br><br>Answer: $\\dfrac{6-2 \\sqrt{3}}{3}, \\dfrac{6+2 \\sqrt{3}}{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213a30aee93fa0796da5b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}], "question": {"text": "If Mean value theorem holds for the function $\\mathrm{f}(x)=(x-1)(x-2)(x-3), x \\in[0,4] \\quad$ then the values of c as per the theorem are", "image": null}, "options": [{"id": "RVgff", "text": "$2 \\pm \\dfrac{4}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "ZxiWd", "text": "$2 \\pm \\dfrac{2}{\\sqrt{3}}$", "image": null, "isCorrect": true}, {"id": "yy8rq", "text": "$2 \\pm \\sqrt{2}$", "image": null, "isCorrect": false}, {"id": "xWQmA", "text": "$2 \\pm \\sqrt{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $\\mathrm{f}(x) = (x-1)(x-2)(x-3) = x^3 - 6x^2 + 11x - 6$<br><br>$\\mathrm{f}'(x) = 3x^2 - 12x + 11$<br><br>By Mean Value Theorem, there exists $c \\in (0, 4)$ such that $\\mathrm{f}'(c) = \\dfrac{\\mathrm{f}(4) - \\mathrm{f}(0)}{4 - 0}$<br><br>$\\mathrm{f}(4) = (4-1)(4-2)(4-3) = 3 \\times 2 \\times 1 = 6$<br><br>$\\mathrm{f}(0) = (0-1)(0-2)(0-3) = -1 \\times -2 \\times -3 = -6$<br><br>$\\mathrm{f}'(c) = \\dfrac{6 - (-6)}{4} = \\dfrac{12}{4} = 3$<br><br>$3c^2 - 12c + 11 = 3$<br><br>$3c^2 - 12c + 8 = 0$<br><br>$c = \\dfrac{12 \\pm \\sqrt{(-12)^2 - 4(3)(8)}}{2(3)}$<br><br>$c = \\dfrac{12 \\pm \\sqrt{144 - 96}}{6}$<br><br>$c = \\dfrac{12 \\pm \\sqrt{48}}{6} = \\dfrac{12 \\pm 4\\sqrt{3}}{6}$<br><br>$c = 2 \\pm \\dfrac{2}{\\sqrt{3}}$<br><br>Both values lie in the interval $(0, 4)$.<br><br>Answer: $2 \\pm \\dfrac{2}{\\sqrt{3}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cca", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2024 (09 May Shift 1)", "title": "MHT CET 2024 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792136a0aee93fa0796d8a0", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "The value of c for which Rolle's theorem for the function $\\mathrm{f}(x)=x^3-3 x^2+2 x$ in the interval $[0,2]$ are", "image": null}, "options": [{"id": "NbnM6", "text": "$\\pm 1$", "image": null, "isCorrect": false}, {"id": "E1KXo", "text": "$\\pm 2$", "image": null, "isCorrect": false}, {"id": "dQBVw", "text": "$1 \\pm \\dfrac{1}{\\sqrt{3}}$", "image": null, "isCorrect": true}, {"id": "G1HJm", "text": "$\\sqrt{3}(1 \\pm \\sqrt{3})$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given function is $f(x) = x^3 - 3x^2 + 2x$ on the interval $[0, 2]$.<br><br>$f(x)$ is a polynomial, so it is continuous on $[0, 2]$ and differentiable on $(0, 2)$.<br><br>$f(0) = 0^3 - 3(0)^2 + 2(0) = 0$<br><br>$f(2) = 2^3 - 3(2)^2 + 2(2) = 8 - 12 + 4 = 0$<br><br>Since $f(0) = f(2)$, Rolle's theorem is applicable.<br><br>By Rolle's theorem, there exists at least one $c \\in (0, 2)$ such that $f'(c) = 0$.<br><br>$f'(x) = 3x^2 - 6x + 2$<br><br>$f'(c) = 3c^2 - 6c + 2 = 0$<br><br>$c = \\dfrac{6 \\pm \\sqrt{36 - 24}}{6} = \\dfrac{6 \\pm \\sqrt{12}}{6} = \\dfrac{6 \\pm 2\\sqrt{3}}{6} = 1 \\pm \\dfrac{1}{\\sqrt{3}}$<br><br>Both values $1 + \\dfrac{1}{\\sqrt{3}}$ and $1 - \\dfrac{1}{\\sqrt{3}}$ lie in the interval $(0, 2)$.<br><br>Answer: $1 \\pm \\dfrac{1}{\\sqrt{3}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213410aee93fa0796d75b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "The value of C for which Mean value Theorem holds for the function $\\mathrm{f}(x)=\\log _{\\mathrm{e}} x$ on the interval $[1,3]$ is", "image": null}, "options": [{"id": "74XFa", "text": "$\\log _3 \\mathrm{e}$", "image": null, "isCorrect": false}, {"id": "XYaXE", "text": "$\\log _{\\mathrm{e}} 3$", "image": null, "isCorrect": false}, {"id": "iqB25", "text": "$\\quad \\dfrac{1}{2} \\log _{\\mathrm{e}} 3$", "image": null, "isCorrect": false}, {"id": "cYxI0", "text": "$2 \\log _3 \\mathrm{e}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given function is $f(x) = \\log_e x$ on the interval $[1, 3]$.<br><br>By Lagrange's Mean Value Theorem, there exists $c \\in (1, 3)$ such that $f'(c) = \\dfrac{f(3) - f(1)}{3 - 1}$.<br><br>Differentiating $f(x)$ with respect to $x$, we get $f'(x) = \\dfrac{1}{x}$, which gives $f'(c) = \\dfrac{1}{c}$.<br><br>We have $f(3) = \\log_e 3$ and $f(1) = \\log_e 1 = 0$.<br><br>Substituting these values into the Mean Value Theorem formula:<br><br>$\\dfrac{1}{c} = \\dfrac{\\log_e 3 - 0}{2}$<br><br>$\\dfrac{1}{c} = \\dfrac{\\log_e 3}{2}$<br><br>$c = \\dfrac{2}{\\log_e 3}$<br><br>$c = 2 \\log_3 e$<br><br>Since $e \\approx 2.718$, $\\log_3 e < 1$, and $2 \\log_3 e \\approx 1.82$, which lies in the interval $(1, 3)$.<br><br>Answer: $2 \\log _3 \\mathrm{e}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213310aee93fa0796d6da", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "If Rolle's theorem holds for the function $\\mathrm{f}(x)=x^3+\\mathrm{b} x^2+\\mathrm{ax}+5$ on $[1,3]$ with $\\mathrm{c}=2+\\dfrac{1}{\\sqrt{3}}$, then the values of $a$ and $b$ respectively are", "image": null}, "options": [{"id": "pSPQS", "text": "$-11,6$", "image": null, "isCorrect": false}, {"id": "DuplL", "text": "11,6", "image": null, "isCorrect": false}, {"id": "f41id", "text": "$-11,-6$", "image": null, "isCorrect": false}, {"id": "rSINJ", "text": "$11,-6$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For Rolle's theorem to hold on the interval $[1, 3]$, we must have $\\mathrm{f}(1) = \\mathrm{f}(3)$.<br><br>$\\mathrm{f}(1) = 1^3 + \\mathrm{b}(1)^2 + \\mathrm{a}(1) + 5 = \\mathrm{a} + \\mathrm{b} + 6$<br><br>$\\mathrm{f}(3) = 3^3 + \\mathrm{b}(3)^2 + \\mathrm{a}(3) + 5 = 3\\mathrm{a} + 9\\mathrm{b} + 32$<br><br>Equating $\\mathrm{f}(1)$ and $\\mathrm{f}(3)$:<br><br>$\\mathrm{a} + \\mathrm{b} + 6 = 3\\mathrm{a} + 9\\mathrm{b} + 32$<br><br>$2\\mathrm{a} + 8\\mathrm{b} + 26 = 0$<br><br>$\\mathrm{a} + 4\\mathrm{b} + 13 = 0$  --- (1)<br><br>Also, by Rolle's theorem, $\\mathrm{f}'(\\mathrm{c}) = 0$ for some $\\mathrm{c} \\in (1, 3)$.<br><br>$\\mathrm{f}'(x) = 3x^2 + 2\\mathrm{b}x + \\mathrm{a}$<br><br>Substituting $\\mathrm{c} = 2 + \\dfrac{1}{\\sqrt{3}}$:<br><br>$\\mathrm{f}'\\left(2 + \\dfrac{1}{\\sqrt{3}}\\right) = 3\\left(2 + \\dfrac{1}{\\sqrt{3}}\\right)^2 + 2\\mathrm{b}\\left(2 + \\dfrac{1}{\\sqrt{3}}\\right) + \\mathrm{a} = 0$<br><br>$3\\left(4 + \\dfrac{1}{3} + \\dfrac{4}{\\sqrt{3}}\\right) + 4\\mathrm{b} + \\dfrac{2\\mathrm{b}}{\\sqrt{3}} + \\mathrm{a} = 0$<br><br>$12 + 1 + \\dfrac{12}{\\sqrt{3}} + 4\\mathrm{b} + \\dfrac{2\\mathrm{b}}{\\sqrt{3}} + \\mathrm{a} = 0$<br><br>$(\\mathrm{a} + 4\\mathrm{b} + 13) + \\dfrac{12 + 2\\mathrm{b}}{\\sqrt{3}} = 0$<br><br>From equation (1), $\\mathrm{a} + 4\\mathrm{b} + 13 = 0$, so we get:<br><br>$\\dfrac{12 + 2\\mathrm{b}}{\\sqrt{3}} = 0$<br><br>$12 + 2\\mathrm{b} = 0 \\Rightarrow \\mathrm{b} = -6$<br><br>Substituting $\\mathrm{b} = -6$ into equation (1):<br><br>$\\mathrm{a} + 4(-6) + 13 = 0$<br><br>$\\mathrm{a} - 24 + 13 = 0 \\Rightarrow \\mathrm{a} = 11$<br><br>The values of $\\mathrm{a}$ and $\\mathrm{b}$ respectively are $11, -6$.<br><br>Answer: $11,-6$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262860279619d9d8a353b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "If $\\mathrm{f}(\\mathrm{a})=2, \\mathrm{f}^{\\prime}(\\mathrm{a})=1, \\mathrm{~g}(\\mathrm{a})=-1, \\mathrm{~g}^{\\prime}(\\mathrm{a})=2$, then as $x$ approaches a, $\\frac{\\mathrm{g}(x) \\mathrm{f}(\\mathrm{a})-\\mathrm{g}(\\mathrm{a}) \\mathrm{f}(x)}{(x-\\mathrm{a})}$ approaches", "image": null}, "options": [{"id": "eX2LS", "text": "3", "image": null, "isCorrect": false}, {"id": "XfSRG", "text": "5", "image": null, "isCorrect": true}, {"id": "uOBn7", "text": "0", "image": null, "isCorrect": false}, {"id": "Sw6gA", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Applying L-Hospital's rule, we get\n$\\begin{aligned}\n& \\lim _{x \\rightarrow a} \\frac{g(x) f(a)-g(a) f(x)}{(x-a)} \\\\\n& =\\lim _{x \\rightarrow a} \\frac{g^{\\prime}(x) f(a)-g(a) f^{\\prime}(x)}{1} \\\\\n& =g^{\\prime}(a) f(a)-g(a) f^{\\prime}(a) \\\\\n& =2(2)-(-1)(1) \\\\\n& =4+1 \\\\\n& =5\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262630279619d9d8a341e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}], "question": {"text": "If Rolle's theorem holds for the function $f(x)=x^3+b x^2+a x+5$ on $[1,3]$ with $c=2+\\frac{1}{\\sqrt{3}}$, then the values of $a$ and $b$ respectively are", "image": null}, "options": [{"id": "HuCNX", "text": "$-11,-6$", "image": null, "isCorrect": false}, {"id": "KBFF9", "text": "11,6", "image": null, "isCorrect": false}, {"id": "CUdkS", "text": "$11,-6$", "image": null, "isCorrect": true}, {"id": "LKVhc", "text": "6,11", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since $\\mathrm{f}(x)$ satisfies the Rolle's theorem,\n$f(1)=f(3)$\n$\\therefore \\quad 1+b+a+5=27+9 b+3 a+5$\n$\\Rightarrow 2 a+8 b=-26$\n$\\Rightarrow a+4 b=-13$                                ...(i)\n$\\vec{f}(x)=x^3+b x^2+a x+5$\n$\\therefore \\quad \\mathrm{f}^{\\prime}(x)=3 x^2+2 \\mathrm{~b} x+\\mathrm{a}$\nNow, $\\mathrm{f}^{\\prime}(\\mathrm{c})=0$\n$$\n\\begin{aligned}\n& \\Rightarrow \\mathrm{f}^{\\prime}\\left(2+\\frac{1}{\\sqrt{3}}\\right)=0 \\\\\n& \\Rightarrow 3\\left(2+\\frac{1}{\\sqrt{3}}\\right)^2+2 \\mathrm{~b}\\left(2+\\frac{1}{\\sqrt{3}}\\right)+\\mathrm{a}=0 \\\\\n& \\Rightarrow 3\\left(4+\\frac{4}{\\sqrt{3}}+\\frac{1}{3}\\right)+4 \\mathrm{~b}+\\frac{2 \\mathrm{~b}}{\\sqrt{3}}+\\mathrm{a}=0 \\\\\n& \\Rightarrow \\mathrm{a}+4 \\mathrm{~b}+\\frac{2 \\mathrm{~b}+12}{\\sqrt{3}}+13=0 \\\\\n& \\Rightarrow-13+\\frac{2 \\mathrm{~b}+12}{\\sqrt{3}}+13=0 \\\\\n& \\Rightarrow \\frac{2 \\mathrm{~b}+12}{\\sqrt{3}}=0 \\\\\n& \\Rightarrow \\mathrm{b}=-6\n\\end{aligned}\n$$\nSubstituting $b=-6$ in (i), we get $a=11$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T14:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 2)", "title": "MHT CET 2023 (13 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262510279619d9d8a338b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}], "question": {"text": "Values of $\\mathrm{c}$ as per Rolle's theorem for $f(x)=\\sin x+\\cos x+6$ on $[0,2 \\pi]$ are", "image": null}, "options": [{"id": "0Ill6", "text": "$\\frac{\\pi}{3}, \\frac{5 \\pi}{3}$", "image": null, "isCorrect": false}, {"id": "XUJRv", "text": "$\\frac{\\pi}{6}, \\frac{5 \\pi}{6}$", "image": null, "isCorrect": false}, {"id": "4riWZ", "text": "$\\frac{\\pi}{4}, \\frac{5 \\pi}{4}$", "image": null, "isCorrect": true}, {"id": "Mcols", "text": "$\\frac{\\pi}{4}, \\frac{7 \\pi}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{array}{ll} & \\mathrm{f}(x)=\\sin x+\\cos x+6 \\\\ \\therefore \\quad & \\mathrm{f}^{\\prime}(x)=\\cos x-\\sin x \\\\ & \\text { Now, } \\mathrm{f}^{\\prime}(\\mathrm{c})=0 \\\\ \\Rightarrow \\cos \\mathrm{c}-\\sin \\mathrm{c}=0 \\\\ \\Rightarrow \\cos \\mathrm{c}=\\sin \\mathrm{c} \\\\ \\Rightarrow \\tan \\mathrm{c}=1 \\\\ \\Rightarrow \\mathrm{c}=\\frac{\\pi}{4}, \\frac{5 \\pi}{4} \\quad \\ldots[\\because x \\in[0,2 \\pi]]\\end{array}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-13T09:00:00.000Z", "isVisible": true, "shortName": "2023 (13 May Shift 1)", "title": "MHT CET 2023 (13 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262150279619d9d8a31aa", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}], "question": {"text": "If the function $f$ is given by $\\mathrm{f}(x)=x^3-3(\\mathrm{a}-2) x^2+3 \\mathrm{a} x+7$, for some a $\\in \\mathbb{R}$, is increasing in $(0,1]$ and decreasing in $[1,5)$, then a root of the equation $\\frac{\\mathrm{f}(x)-14}{(x-1)^2}=0(x \\neq 1)$ is", "image": null}, "options": [{"id": "jVlSj", "text": "$-7$", "image": null, "isCorrect": false}, {"id": "wJu3G", "text": "$6$", "image": null, "isCorrect": false}, {"id": "rziWT", "text": "$7$", "image": null, "isCorrect": true}, {"id": "GwcsX", "text": "$5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$f(x)=x^3-3(a-2) x^2+3 a x+7$\nAs $\\mathrm{f}(x)$ is increasing in $(0,1]$ and decreasing in $[1,5)$, we get that $\\mathrm{f}(x)$ has critical point at $x=1$ $\\Rightarrow \\mathrm{f}^{\\prime}(1)=0$\n$\\mathrm{f}^{\\prime}(x)=3 x^2-6(\\mathrm{a}-2) x+3 \\mathrm{a}$\n$\\begin{aligned}\n& \\therefore \\quad 3(1)^2-6(a-2)+3 a=0 \\\\\n& \\therefore \\quad \\mathrm{a}=5 \\\\\n& \\therefore \\quad \\frac{\\mathrm{f}(x)-14}{(x-1)^2}=\\frac{x^3-9 x^2+15 x-7}{(x-1)^2} \\\\\n& =\\frac{(x-1)^2(x-7)}{(x-1)^2} \\\\\n& =x-7 \\\\\n&\n\\end{aligned}$\n$\\therefore \\quad$ The required root is 7 .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892af", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T14:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 2)", "title": "MHT CET 2023 (11 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262010279619d9d8a310e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Value of $c$ satisfying the conditions and conclusions of Rolle's theorem for the function $\\mathrm{f}(x)=x \\sqrt{x+6}, x \\in[-6,0]$ is", "image": null}, "options": [{"id": "rAfDr", "text": "$-4$", "image": null, "isCorrect": true}, {"id": "1scrw", "text": "$4$", "image": null, "isCorrect": false}, {"id": "G3RDd", "text": "$3$", "image": null, "isCorrect": false}, {"id": "TdiMu", "text": "$-3$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n\\mathrm{f}(x) & =x \\sqrt{x+6} \\\\\n\\therefore \\quad \\mathrm{f}^{\\prime}(x) & =x\\left(\\frac{1}{2 \\sqrt{x+6}}\\right)+\\sqrt{x+6}(1) \\\\\n& =\\frac{x}{2 \\sqrt{x+6}}+\\sqrt{x+6}\n\\end{aligned}\n$$\n\nSince $\\mathrm{f}(x)$ satisfies all the conditions of Rolle's Theorem,\n\nThere exists $c \\in(-6,0)$ such that\n$$\n\\begin{aligned}\n& \\mathrm{f}^{\\prime}(\\mathrm{c})=0 \\\\\n& \\Rightarrow \\frac{\\mathrm{c}}{2 \\sqrt{\\mathrm{c}+6}}+\\sqrt{\\mathrm{c}+6}=0 \\\\\n& \\Rightarrow \\mathrm{c}+2 \\mathrm{c}+12=0 \\\\\n& \\Rightarrow \\mathrm{c}=-4\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b40279619d9d8a2eb1", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "The value of $c$ of Lagrange's mean value theorem for $\\mathrm{f}(x)=\\sqrt{25-x^2}$ on $[1,5]$ is", "image": null}, "options": [{"id": "3FCEu", "text": "$\\sqrt {15}$", "image": null, "isCorrect": true}, {"id": "8wRLP", "text": "$5$", "image": null, "isCorrect": false}, {"id": "sTw7G", "text": "$\\sqrt{10}$", "image": null, "isCorrect": false}, {"id": "swxKi", "text": "$1$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& \\mathrm{f}(x)=\\sqrt{25-x^2} \\\\\n& \\therefore \\quad \\mathrm{f}^{\\prime}(x=\\mathrm{c})=\\frac{-2 \\mathrm{c}}{2 \\sqrt{25-\\mathrm{c}^2}} \\\\\n&=\\frac{-\\mathrm{c}}{\\sqrt{25-\\mathrm{c}^2}}\n\\end{aligned}$\nApplying Lagrange's mean value theorem, we get\n$\\begin{aligned}\n& \\mathrm{f}^{\\prime}(\\mathrm{c})=\\frac{\\mathrm{f}(1)-\\mathrm{f}(5)}{1-5} \\\\\n& \\therefore \\quad \\frac{\\mathrm{c}}{\\sqrt{25-\\mathrm{c}^2}}=\\frac{\\sqrt{25-1}-\\sqrt{25-5^2}}{1-5} \\\\\n& \\therefore \\quad \\frac{-\\mathrm{c}}{\\sqrt{25-\\mathrm{c}^2}}=\\frac{-\\sqrt{24}}{4}\n\\end{aligned}$\n$\\begin{array}{ll}\n\\therefore & 4 \\mathrm{c}=\\sqrt{24} \\cdot \\sqrt{25-\\mathrm{c}^2} \\\\\n\\therefore & 16 \\mathrm{c}^2=24\\left(25-\\mathrm{c}^2\\right) \\\\\n\\therefore & \\mathrm{c}^2=15 \\\\\n\\therefore & \\mathrm{c}= \\pm \\sqrt{15}\n\\end{array}$\nSince $c=-\\sqrt{15}$ does not lie in $[1,5]$ $c=\\sqrt{15}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261490279619d9d8a2b56", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "Two positive numbers $\\mathrm{x}$ and $\\mathrm{y}$ such that $(x+y)=60$ and $x y^3$ is maximum, then the numbers are respectively", "image": null}, "options": [{"id": "MC5G6", "text": "45,15", "image": null, "isCorrect": true}, {"id": "9u7gW", "text": "30,30", "image": null, "isCorrect": false}, {"id": "vYWBj", "text": "20,40", "image": null, "isCorrect": false}, {"id": "q7NCx", "text": "40,20", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$x+y=60 \\Rightarrow x=60-y$\nNow let $z=x y^3=(60-y) y^3=60 y^3-y^4$\n$$\n\\Rightarrow \\frac{d z}{d y}=180 y^2-4 y^3=4 y^2(45-y)\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/6ljFfCrpcY3-RYEicLYNEmM1LkQNsiBRYEkDawt960I.original.fullsize.png\">\ni.e., $x y^3$ is maximum $y=45$ and $x=60-45=15$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fe40279619d9d8a2016", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}], "question": {"text": "If L.M.V.T. is applicable for the function $f(x)=x+\\frac{1}{x}, x \\in[1,3]$, then $c=$", "image": null}, "options": [{"id": "95MRE", "text": "$-\\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "ufmFU", "text": "$\\sqrt{3}$", "image": null, "isCorrect": true}, {"id": "AqSXP", "text": "2", "image": null, "isCorrect": false}, {"id": "jgqPs", "text": "$\\sqrt{2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(C)\nGiven $\\mathrm{f}(\\mathrm{x})=\\mathrm{x}+\\frac{1}{\\mathrm{x}}$ and LMVT holds\n$\\begin{array}{l}\nf^{\\prime}(x)=1-\\frac{1}{x^{2}} \\Rightarrow f^{\\prime}(c)=1-\\frac{1}{c^{2}} \\\\\nf(1)=1+1=2 \\text { and } f(3)=3+\\frac{1}{3}=\\frac{10}{3}\n\\end{array}$\n$\\therefore \\quad f^{\\prime}(c)=1-\\frac{1}{c^{2}}=\\frac{\\frac{10}{3}-2}{(3-1)} \\Rightarrow 1-\\frac{1}{c^{2}}=\\frac{4}{3(2)}=\\frac{2}{3}$\n$\\therefore \\quad \\frac{1}{c^{2}}=1-\\frac{2}{3}=\\frac{1}{3} \\Rightarrow c^{2}=3 \\Rightarrow c=\\pm \\sqrt{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f71", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-19T09:00:00.000Z", "isVisible": true, "shortName": "2020 (19 Oct Shift 1)", "title": "MHT CET 2020 (19 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25fbe0279619d9d8a1ee4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}], "question": {"text": "If $f(x)=\\log (\\sin x), x \\in\\left[\\frac{\\pi}{6}, \\frac{5 \\pi}{6}\\right]$, then value of 'c'by applyng L.mv.T. is", "image": null}, "options": [{"id": "SpU9Y", "text": "$\\frac{\\pi}{2}$", "image": null, "isCorrect": true}, {"id": "xhvhV", "text": "$\\frac{2 \\pi}{3}$", "image": null, "isCorrect": false}, {"id": "JaK5W", "text": "$\\frac{3 \\pi}{4}$", "image": null, "isCorrect": false}, {"id": "I3scY", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "(B)\nValue of ' ' by applying L.M.V.T. is to be found out\n$\\begin{aligned}\nf(x) &=\\log (\\sin x) \\text { on }\\left[\\frac{\\pi}{6}, \\frac{5 \\pi}{6}\\right] \\Rightarrow \\operatorname{lot} a=\\frac{\\pi}{6}, b=\\frac{5 \\pi}{6} \\\\\nf^{\\prime}(x) &=\\frac{\\cos x}{\\sin x}=\\cot x \\Rightarrow f^{\\prime}(c)=\\cot c \\\\\nf^{\\prime}(c) &=\\frac{f(b)-f(a)}{b-a}=\\frac{f\\left(\\frac{5 \\pi}{6}\\right)-f\\left(\\frac{\\pi}{6}\\right)}{5 \\frac{\\pi}{6}-\\frac{\\pi}{6}} \\\\\n\\cot c &=\\frac{\\log \\left[\\sin \\left(\\frac{5 \\pi}{6}\\right)\\right]-\\log \\left[\\sin \\left(\\frac{\\pi}{6}\\right)\\right]}{\\frac{2 \\pi}{3}}=\\frac{\\log \\frac{1}{2}-\\log \\left(\\frac{1}{2}\\right)}{2 \\frac{\\pi}{3}} \\\\\n\\cot c=0 & \\Rightarrow c=\\frac{\\pi}{2}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-16T09:00:00.000Z", "isVisible": true, "shortName": "2020 (16 Oct Shift 1)", "title": "MHT CET 2020 (16 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f3b0279619d9d8a1acd", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "If the L. M. V. T. holds for the function $f(x)=x+\\frac{1}{x}, x \\in[1,3]$, then c=", "image": null}, "options": [{"id": "JEKwc", "text": "$\\sqrt{3}$", "image": null, "isCorrect": true}, {"id": "GKO6D", "text": "3", "image": null, "isCorrect": false}, {"id": "dcN1C", "text": "2", "image": null, "isCorrect": false}, {"id": "mjwoZ", "text": "$-\\sqrt{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given $f(x)=x+\\frac{1}{x}$ and LMVT holds\n$f^{\\prime}(x)=1-\\frac{1}{x^{2}} \\Rightarrow f^{\\prime}(c)=1-\\frac{1}{c^{2}}$\n$f(1)=1+1=2 \\text { and } f(3)=3+\\frac{1}{3}=\\frac{10}{3}$\n$\\therefore \\quad f^{\\prime}(c)=1-\\frac{1}{c^{2}}=\\frac{\\frac{10}{3}-2}{(3-1)} \\Rightarrow 1-\\frac{1}{c^{2}}=\\frac{4}{3(2)}=\\frac{2}{3}$\n$\\therefore \\quad \\frac{1}{c^{2}}=1-\\frac{2}{3}=\\frac{1}{3} \\Rightarrow c^{2}=3 \\Rightarrow c=\\pm \\sqrt{3}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f290279619d9d8a1a
