^2 + (-2)^2 - (-12)} = \\sqrt{9 + 4 + 12} = 5$.<br><br>The given point is $P(-4, -5)$. The distance between the point $P$ and the center $C$ is:<br>$PC = \\sqrt{(-4 - (-3))^2 + (-5 - 2)^2} = \\sqrt{(-1)^2 + (-7)^2} = \\sqrt{1 + 49} = \\sqrt{50} = 5\\sqrt{2}$<br><br>Let the tangents from $P$ touch the circle at points $A$ and $B$. The length of the tangent $PA$ is:<br>$PA = \\sqrt{PC^2 - r^2} = \\sqrt{50 - 25} = \\sqrt{25} = 5$<br><br>In the right-angled $\\triangle PAC$, we have $PA = 5$ and $AC = r = 5$.<br>The area of the quadrilateral $PACB$ formed by the two tangents and the two radii is:<br>Area of $PACB = 2 \\times \\text{Area of } \\triangle PAC = 2 \\times \\left(\\dfrac{1}{2} \\times PA \\times AC\\right) = 5 \\times 5 = 25$ sq. units.<br><br>Since $PA = AC = 5$, $\\triangle PAC$ is an isosceles right-angled triangle, which gives $\\angle PCA = \\dfrac{\\pi}{4}$.<br>By symmetry, $\\angle PCB = \\dfrac{\\pi}{4}$.<br>The total angle subtended by the minor arc $AB$ at the center is $\\angle ACB = \\dfrac{\\pi}{4} + \\dfrac{\\pi}{4} = \\dfrac{\\pi}{2}$.<br><br>The area of the sector $ACB$ is:<br>Area of sector = $\\dfrac{1}{2} r^2 \\theta = \\dfrac{1}{2} \\times (5)^2 \\times \\dfrac{\\pi}{2} = \\dfrac{25\\pi}{4}$ sq. units.<br><br>The area enclosed between the tangents and the circle is the area of the quadrilateral $PACB$ minus the area of the sector $ACB$:<br>Required Area = $25 - \\dfrac{25\\pi}{4} = 25\\left(\\dfrac{4 - \\pi}{4}\\right)$ sq. units.<br><br>Answer: $25\\left(\\frac{4-\\pi}{4}\\right)$ sq. units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b9ebf9280d7f9932aeb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The equations of the tangents to the circle $x^2+y^2=36$ which are perpendicular to the line $5 x+y-2=0$ are", "image": null}, "options": [{"id": "E1Myt", "text": "$x-5 y \\pm 6 \\sqrt{26}=0$", "image": null, "isCorrect": true}, {"id": "cZklP", "text": "$x+5 y \\pm 6 \\sqrt{26}=0$", "image": null, "isCorrect": false}, {"id": "40Bc6", "text": "$x-5 y \\pm \\sqrt{26}=0$", "image": null, "isCorrect": false}, {"id": "oXKuF", "text": "$x+5 y \\pm \\sqrt{26}=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the given line is $5x+y-2=0$.<br><br>Any line perpendicular to this line is of the form $x-5y+k=0$.<br><br>The given circle is $x^2+y^2=36$, which has its center at $(0,0)$ and radius $r=6$.<br><br>For the line to be a tangent to the circle, the perpendicular distance from the center of the circle to the line must be equal to the radius.<br><br>$\\dfrac{|1(0) - 5(0) + k|}{\\sqrt{1^2 + (-5)^2}} = 6$<br><br>$\\dfrac{|k|}{\\sqrt{1 + 25}} = 6$<br><br>$\\dfrac{|k|}{\\sqrt{26}} = 6$<br><br>$|k| = 6\\sqrt{26} \\Rightarrow k = \\pm 6\\sqrt{26}$<br><br>Substituting the value of $k$, the equations of the tangents are $x-5y \\pm 6\\sqrt{26}=0$.<br><br>Answer: $x-5 y \\pm 6 \\sqrt{26}=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f77", "heldOn": "2025-04-23T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (23 Apr Shift 2)", "title": "MHT CET 2025 (23 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b7fbf9280d7f99329cb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The equations of the tangents to the circle $x^2+y^2=36$ which are perpendicular to the line $5 x+y=2$, are", "image": null}, "options": [{"id": "262aB", "text": "$x+5 y \\pm 6 \\sqrt{26}=0$", "image": null, "isCorrect": false}, {"id": "1k78v", "text": "$x-5 y \\pm 6 \\sqrt{26}=0$", "image": null, "isCorrect": true}, {"id": "QP6UM", "text": "$5 x-y \\pm 6 \\sqrt{26}=0$", "image": null, "isCorrect": false}, {"id": "ato7B", "text": "$5 x+y \\pm 6 \\sqrt{26}=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given circle is $x^2+y^2=36$. Its center is $(0,0)$ and radius is $r=6$.<br><br>The given line is $5x+y=2$, which has a slope of $-5$.<br><br>Since the required tangents are perpendicular to this line, their slope is $m = \\dfrac{1}{5}$.<br><br>The equation of a line with slope $m$ is $y = mx + c$.<br><br>Substituting $m = \\dfrac{1}{5}$, we get $y = \\dfrac{1}{5}x + c$, which simplifies to $x - 5y + 5c = 0$.<br><br>For this line to be a tangent to the circle, the perpendicular distance from the center $(0,0)$ to the line must be equal to the radius $6$.<br><br>$\\dfrac{|1(0) - 5(0) + 5c|}{\\sqrt{1^2 + (-5)^2}} = 6$<br><br>$\\dfrac{|5c|}{\\sqrt{26}} = 6$<br><br>$5c = \\pm 6\\sqrt{26}$<br><br>Substituting the value of $5c$ back into the equation of the line, we get:<br><br>$x - 5y \\pm 6\\sqrt{26} = 0$<br><br>Answer: $x-5 y \\pm 6 \\sqrt{26}=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f75", "heldOn": "2025-04-22T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 2)", "title": "MHT CET 2025 (22 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b72bf9280d7f9932952", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If the tangent and the normal at the point $(\\sqrt{3}, 1)$ to the circle $x^2+\\mathrm{y}^2=4$, and the X -axis form a triangle, then the area (in sq.units) of this triangle is", "image": null}, "options": [{"id": "Xp5tp", "text": "$\\frac{1}{\\sqrt{2}}$", "image": null, "isCorrect": false}, {"id": "BuhN4", "text": "$\\frac{2}{\\sqrt{3}}$", "image": null, "isCorrect": true}, {"id": "1vJD9", "text": "$\\frac{4}{\\sqrt{3}}$", "image": null, "isCorrect": false}, {"id": "ZUvPW", "text": "$\\frac{1}{3}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the circle is $x^2+y^2=4$.<br><br>The point $P(\\sqrt{3}, 1)$ lies on the circle.<br><br>The equation of the tangent to the circle at $P(\\sqrt{3}, 1)$ is given by $xx_1 + yy_1 = r^2$, which is:<br>$\\sqrt{3}x + y = 4$<br><br>To find the intersection of the tangent with the X-axis, substitute $y = 0$:<br>$\\sqrt{3}x = 4 \\Rightarrow x = \\dfrac{4}{\\sqrt{3}}$<br>Thus, the tangent intersects the X-axis at $A\\left(\\dfrac{4}{\\sqrt{3}}, 0\\right)$.<br><br>The normal to the circle at any point passes through its center $(0,0)$. Therefore, the normal intersects the X-axis at the origin $O(0,0)$.<br><br>The triangle is formed by the points $O(0,0)$, $A\\left(\\dfrac{4}{\\sqrt{3}}, 0\\right)$, and $P(\\sqrt{3}, 1)$.<br><br>The length of the base $OA$ on the X-axis is $\\dfrac{4}{\\sqrt{3}}$.<br><br>The height of the triangle corresponding to this base is the y-coordinate of point $P$, which is $1$.<br><br>Area of the triangle $= \\dfrac{1}{2} \\times \\text{base} \\times \\text{height}$<br><br>Area $= \\dfrac{1}{2} \\times \\dfrac{4}{\\sqrt{3}} \\times 1 = \\dfrac{2}{\\sqrt{3}}$ sq. units.<br><br>Answer: $\\frac{2}{\\sqrt{3}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f74", "heldOn": "2025-04-22T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (22 Apr Shift 1)", "title": "MHT CET 2025 (22 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792144f0aee93fa0796dfa1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}], "question": {"text": "One end of the diameter of the circle $x^2+y^2-6 x-5 y-1=0$ is $(-1,3)$, then the equation of the tangent at the other end of the diameter is", "image": null}, "options": [{"id": "7tYFY", "text": "$8 x+y-58=0$", "image": null, "isCorrect": false}, {"id": "RMn3z", "text": "$8 x-2 y-52=0$", "image": null, "isCorrect": false}, {"id": "d2Jol", "text": "$8 x-y-54=0$", "image": null, "isCorrect": true}, {"id": "IoBjH", "text": "$8 x+2 y-60=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation of the circle is $x^2+y^2-6x-5y-1=0$.<br><br>Comparing this with the standard form $x^2+y^2+2gx+2fy+c=0$, we get the center of the circle as $C(-g, -f) = \\left(3, \\dfrac{5}{2}\\right)$.<br><br>Let the given end of the diameter be $A(-1, 3)$ and the other end be $B(x_2, y_2)$. Since the center $C$ is the midpoint of the diameter $AB$, we have:<br><br>$\\dfrac{-1 + x_2}{2} = 3 \\Rightarrow x_2 = 7$<br><br>$\\dfrac{3 + y_2}{2} = \\dfrac{5}{2} \\Rightarrow y_2 = 2$<br><br>Thus, the other end of the diameter is $B(7, 2)$.<br><br>The slope of the diameter $AB$ is:<br><br>$m = \\dfrac{3 - 2}{-1 - 7} = -\\dfrac{1}{8}$<br><br>Since the tangent at $B$ is perpendicular to the diameter, its slope is:<br><br>$m' = -\\dfrac{1}{m} = 8$<br><br>The equation of the tangent at $B(7, 2)$ with slope $8$ is:<br><br>$y - 2 = 8(x - 7)$<br><br>$y - 2 = 8x - 56$<br><br>$8x - y - 54 = 0$<br><br>Answer: $8 x-y-54=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e159a8109c6c5665cd1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-16T14:00:00.000Z", "isVisible": true, "shortName": "2024 (16 May Shift 2)", "title": "MHT CET 2024 (16 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679214140aee93fa0796ddcf", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}], "question": {"text": "The number of common tangents to the circles $x^2+y^2-x=0$ and $x^2+y^2+x=0$ is /are", "image": null}, "options": [{"id": "zghXu", "text": "1", "image": null, "isCorrect": false}, {"id": "Ikyw4", "text": "2", "image": null, "isCorrect": false}, {"id": "CWVTC", "text": "3", "image": null, "isCorrect": true}, {"id": "vrc50", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the first circle $x^2+y^2-x=0$, the center is $C_1\\left(\\dfrac{1}{2}, 0\\right)$ and the radius is $r_1 = \\sqrt{\\left(\\dfrac{1}{2}\\right)^2 + 0 - 0} = \\dfrac{1}{2}$.<br><br>For the second circle $x^2+y^2+x=0$, the center is $C_2\\left(-\\dfrac{1}{2}, 0\\right)$ and the radius is $r_2 = \\sqrt{\\left(-\\dfrac{1}{2}\\right)^2 + 0 - 0} = \\dfrac{1}{2}$.<br><br>The distance between the centers is $C_1C_2 = \\sqrt{\\left(\\dfrac{1}{2} - \\left(-\\dfrac{1}{2}\\right)\\right)^2 + (0 - 0)^2} = 1$.<br><br>The sum of the radii is $r_1 + r_2 = \\dfrac{1}{2} + \\dfrac{1}{2} = 1$.<br><br>Since $C_1C_2 = r_1 + r_2$, the two circles touch each other externally.<br><br>Therefore, the number of common tangents is $3$.<br><br>Answer: 3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cce", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-15T09:00:00.000Z", "isVisible": true, "shortName": "2024 (15 May Shift 1)", "title": "MHT CET 2024 (15 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213f00aee93fa0796dcb6", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}], "question": {"text": "The equation of the tangent to the circle, given by $x=5 \\cos \\theta, y=5 \\sin \\theta$ at the point $\\theta=\\frac{\\pi}{3}$ on it, is", "image": null}, "options": [{"id": "k2kHJ", "text": "$x-\\sqrt{3} y=-5$", "image": null, "isCorrect": false}, {"id": "lcKas", "text": "$x+\\sqrt{3} y=10$", "image": null, "isCorrect": true}, {"id": "cReMQ", "text": "$\\sqrt{3} x+y=5 \\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "Gookk", "text": "$\\sqrt{3} x-y=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The parametric equations of the circle are $x = 5 \\cos \\theta$ and $y = 5 \\sin \\theta$.<br><br>Squaring and adding, the Cartesian equation of the circle is $x^2 + y^2 = 25$.<br><br>At $\\theta = \\dfrac{\\pi}{3}$, the point on the circle is $\\left(5 \\cos \\dfrac{\\pi}{3}, 5 \\sin \\dfrac{\\pi}{3}\\right) = \\left(\\dfrac{5}{2}, \\dfrac{5\\sqrt{3}}{2}\\right)$.<br><br>The equation of the tangent to the circle $x^2 + y^2 = r^2$ at a point $(x_1, y_1)$ is given by $x x_1 + y y_1 = r^2$.<br><br>Substituting $(x_1, y_1) = \\left(\\dfrac{5}{2}, \\dfrac{5\\sqrt{3}}{2}\\right)$ and $r^2 = 25$:<br><br>$x \\left(\\dfrac{5}{2}\\right) + y \\left(\\dfrac{5\\sqrt{3}}{2}\\right) = 25$<br><br>Multiplying the entire equation by $2$:<br><br>$5x + 5\\sqrt{3}y = 50$<br><br>Dividing by $5$:<br><br>$x + \\sqrt{3}y = 10$<br><br>Answer: $x+\\sqrt{3} y=10$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665ccc", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2024 (11 May Shift 1)", "title": "MHT CET 2024 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213690aee93fa0796d891", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}], "question": {"text": "The tangent to the circle $x^2+y^2=5$ at $(1,-2)$ also touches the circle $x^2+y^2-8 x+6 y+20=0$ then the co-ordinates of the corresponding point of contact is", "image": null}, "options": [{"id": "qbaU3", "text": "$(3,-1)$", "image": null, "isCorrect": true}, {"id": "HP9DO", "text": "$\\quad(3,1)$", "image": null, "isCorrect": false}, {"id": "Yp1cs", "text": "$(-3,-1)$", "image": null, "isCorrect": false}, {"id": "LAdyt", "text": "$(-3,1)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of the tangent to the circle $x^2+y^2=5$ at $(1,-2)$ is given by $x(1) + y(-2) = 5$, which simplifies to $x - 2y - 5 = 0$.<br><br>The second circle is $x^2+y^2-8x+6y+20=0$.<br><br>Its center is $(4, -3)$.<br><br>The point of contact of the tangent with the second circle is the foot of the perpendicular drawn from the center $(4, -3)$ to the line $x - 2y - 5 = 0$.<br><br>The equation of the line perpendicular to $x - 2y - 5 = 0$ and passing through $(4, -3)$ is $2x + y = 2(4) + (-3)$, which gives $2x + y - 5 = 0$.<br><br>Solving the equations $x - 2y = 5$ and $2x + y = 5$, we get $x = 3$ and $y = -1$.<br><br>The coordinates of the point of contact are $(3, -1)$.<br><br>Answer: $(3,-1)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc8", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T14:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 2)", "title": "MHT CET 2024 (03 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261000279619d9d8a28fe", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}], "question": {"text": "The equation of tangents to the circle $x^2+y^2=4$ which are parallel to $x+2 y+3=0$ are", "image": null}, "options": [{"id": "gZbzq", "text": "$x+2 y= \\pm 2 \\sqrt{5}$", "image": null, "isCorrect": true}, {"id": "eWfhD", "text": "$x+2 y= \\pm 2 \\sqrt{3}$", "image": null, "isCorrect": false}, {"id": "XHd3N", "text": "$x-2 y= \\pm 2$", "image": null, "isCorrect": false}, {"id": "55Fik", "text": "$x-2 y= \\pm 2 \\sqrt{5}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of tangent to the circle $x^2+y^2=r^2$ having slope $m$ is\n$\\begin{aligned} & \\Rightarrow y=-\\frac{1}{2} x \\pm 2 \\sqrt{1+\\left(\\frac{-1}{2}\\right)^2} \\quad\\left[\\text { Here } \\mathrm{r}=2 \\text { and } \\mathrm{m}=\\frac{-1}{2}\\right] \\\\ & \\Rightarrow \\mathrm{y}=\\frac{-\\mathrm{x}}{2} \\pm 2 \\times \\frac{\\sqrt{5}}{2} \\\\ & \\Rightarrow 2 \\mathrm{y}=-\\mathrm{x} \\pm 2 \\sqrt{5} \\\\ & \\Rightarrow \\mathrm{x}+2 \\mathrm{y}= \\pm 2 \\sqrt{5}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f41892a0", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-05T14:00:00.000Z", "isVisible": true, "shortName": "2022 (05 Aug Shift 2)", "title": "MHT CET 2022 (05 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260440279619d9d8a2317", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}], "question": {"text": "The equation of tangent to the circle $x^2+y^2=64$ at the point $\\mathrm{P}\\left(\\frac{2 \\pi}{3}\\right)$ is", "image": null}, "options": [{"id": "nWgTO", "text": "$x-\\sqrt{3} y-16=0$", "image": null, "isCorrect": false}, {"id": "1QFR5", "text": "$\\sqrt{3} \\mathrm{x}+\\mathrm{y}-16=0$", "image": null, "isCorrect": false}, {"id": "xLwar", "text": "$\\mathrm{x}+\\sqrt{3} \\mathrm{y}+16=0$", "image": null, "isCorrect": false}, {"id": "7vV5C", "text": "$\\mathrm{x}-\\sqrt{3} \\mathrm{y}+16=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Circle $x^2+y^2=(8)^2$, has radius 8 and centre $(0,0)$. Point $\\mathrm{P}\\left(\\frac{2 \\pi}{3}\\right)$ on the circle has coordinates\n$$\n\\mathrm{P} \\equiv\\left(8 \\cos \\frac{2 \\pi}{3}, 8 \\sin \\frac{2 \\pi}{3}\\right) \\text { i.e. } \\mathrm{P} \\equiv(-4,4 \\sqrt{3})\n$$\nDifferentiating equation of circle w.r.t. $\\mathrm{x}$, we get\n$$\n2 x+2 y \\frac{d y}{d x}=0 \\Rightarrow \\frac{d y}{d x}=\\frac{-x}{y} \\Rightarrow\\left(\\frac{d y}{d x}\\right)_P=\\frac{4}{4 \\sqrt{3}}=\\frac{1}{\\sqrt{3}}\n$$\nHence required equation of tangent is\n$$\n(\\mathrm{y}-4 \\sqrt{3})=\\frac{1}{\\sqrt{3}}(\\mathrm{x}+4) \\Rightarrow \\mathrm{x}-\\sqrt{3} \\mathrm{y}+16=0\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189296", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T14:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 2)", "title": "MHT CET 2021 (20 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e840279619d9d8a1511", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "Let the equation of circle is $x^{2}+y^{2}-6 x-4 y+9=0$. Then the line $4 x+3 y-8=0$ is a", "image": null}, "options": [{"id": "TZiXB", "text": "tangent of the circle", "image": null, "isCorrect": true}, {"id": "Vxtnn", "text": "normal of the circle", "image": null, "isCorrect": false}, {"id": "8WYrF", "text": "chord of the circle", "image": null, "isCorrect": false}, {"id": "saUdO", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given circle is $x^{2}+y^{2}-6 x-4 y+9=0$\n$C=(3,2), r=2$\nIf line $4 x+3 y-8=0$ is a tangent to the circle, then\n$$\n\\left|\\frac{4(3)+3(2)-8}{\\sqrt{16+9}}\\right|=2\n$$\n$\\Rightarrow \\quad\\left|\\frac{10}{5}\\right|=2 \\Rightarrow 2=2$\nHence, it is a tangent of the circle.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e840279619d9d8a150f", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The equations of the tangents to the circle $x^{2}+y^{2}-6 x+4 y=12$, which are parallel to the straight line $4 x+3 y+5=0$, are", "image": null}, "options": [{"id": "Tw0Vh", "text": "$3 x-4 y-19=0,3 x-4 y+31=0$", "image": null, "isCorrect": false}, {"id": "fbNW9", "text": "$4 x+3 y-19=0,4 x+3 y+31=0$", "image": null, "isCorrect": false}, {"id": "JyTb7", "text": "$4 x+3 y+19=0,4 x+3 y-31=0$", "image": null, "isCorrect": true}, {"id": "kap7c", "text": "$3 x-4 y+19=0,3 x-4 y+31=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let equation of tangent be $4 x+3 y+k=0$ centre of the circle is $(3,-2)$. Then, $\\quad \\sqrt{9+4+12}=\\left|\\frac{4(3)+3(-2)+k}{\\sqrt{16+9}}\\right|$\n$\\Rightarrow \\quad 6+k=\\pm 25$\n$\\Rightarrow \\quad k=19$ and $-31$\nHence, the tangent are $4 x+3 y+19=0$ and $4 x+3 y-31=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e800279619d9d8a14f4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}], "question": {"text": "The equation of normal to the curve $x^{2}+y^{2}=r^{2}$ at $p(\\theta)$ is", "image": null}, "options": [{"id": "pbzbo", "text": "$x \\sin \\theta-y \\cos \\theta=0$", "image": null, "isCorrect": true}, {"id": "2LYG0", "text": "$x \\sin \\theta+y \\cos \\theta=0$", "image": null, "isCorrect": false}, {"id": "OoN3L", "text": "$x \\cos \\theta \\quad y \\sin \\theta=0$", "image": null, "isCorrect": false}, {"id": "MAF79", "text": "$x \\cos \\theta+y \\sin \\theta=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of normal is $\\frac{x}{\\cos \\theta}=\\frac{y}{\\sin \\theta}$\n$$\n\\Rightarrow\n$$\n$x \\sin \\theta-y \\cos \\theta=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2010-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2010", "title": "MHT CET 2010"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e700279619d9d8a146c", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}], "question": {"text": "If $m_{1}$ and $m_{2}$ are the slopes of tangents to the circle $x^{2}+y^{2}=4$ from the point $(3,2)$, then $m_{1}-m_{2}$ is equal to", "image": null}, "options": [{"id": "CsQQ2", "text": "$\\frac{5}{12}$", "image": null, "isCorrect": false}, {"id": "1RGs2", "text": "$\\frac{12}{5}$", "image": null, "isCorrect": true}, {"id": "ZV6xy", "text": "$\\frac{3}{2}$", "image": null, "isCorrect": false}, {"id": "AgSRR", "text": "0", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of pair of tangents is $S S_{1}=T^{2}$\n$\\Rightarrow\\left(x^{2}+y^{2}-4\\right)(9+4-4)=(3 x+2 y-4)^{2}$\n$\\Rightarrow 5 y^{2}+16 y-12 x y+24 x-52=0$\n$\\therefore \\quad m_{1}+m_{2}=\\frac{-2 h}{b}=\\frac{12}{5}$\nand $\\quad m_{1} m_{2}=0$\nNow, $m_{1}-m_{2}=\\sqrt{\\left(m_{1}+m_{2}\\right)^{2}-4 m_{1} m_{2}}$\n$=\\sqrt{\\left(\\frac{12}{5}\\right)^{2}-0}$\n$=\\frac{12}{5}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2009-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2009", "title": "MHT CET 2009"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e590279619d9d8a13b4", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "The equations of the tangents to the circle $x^{2}+y^{2}=13$ at the points whose abscissa is 2 ,\nare", "image": null}, "options": [{"id": "OlFbx", "text": "$2 x+3 y=13,2 x-3 y=13$", "image": null, "isCorrect": true}, {"id": "vcmIL", "text": "$3 x+2 y=13,2 x-3 y=13$", "image": null, "isCorrect": false}, {"id": "0s1sr", "text": "$2 x+3 y=13,3 x-2 y=13$", "image": null, "isCorrect": false}, {"id": "a7y7K", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the point be $\\left(2, y_{1}\\right)$, then\n$$\n\\begin{aligned}\n& 2^{2}+y_{1}^{2} &=13 \\\\\n\\Rightarrow & & y_{1} &=\\pm 3\n\\end{aligned}\n$$\nHence, the required tangents are $2 x \\pm 3 y=13$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 7, "topicId": "65a263380279619d9d8a3d2b", "title": "Pair of Tangents", "totalQuestions": 9, "questions": [{"_id": "6abb885515a9fc0fc8c142b5", "type": "singleCorrect", "question": {"text": "The angle between the tangents drawn from the point $(1, 1)$ to the circle $2x^2 + 2y^2 - 8x + 4y + 5 = 0$ is …………", "image": null}, "options": [{"id": "0BUol", "label": "A", "text": "$\\dfrac{\\pi}{2}$", "isCorrect": true, "image": null}, {"id": "ngEH7", "label": "B", "text": "$\\dfrac{\\pi}{3}$", "isCorrect": false, "image": null}, {"id": "yn217", "label": "C", "text": "$\\dfrac{\\pi}{4}$", "isCorrect": false, "image": null}, {"id": "BdqCV", "label": "D", "text": "$\\dfrac{\\pi}{6}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given equation of the circle is $2x^2 + 2y^2 - 8x + 4y + 5 = 0$.<br><br>Dividing by $2$, we get the standard form:<br><br>$x^2 + y^2 - 4x + 2y + \\dfrac{5}{2} = 0$<br><br>The center of the circle is $C(2, -1)$.<br><br>The radius of the circle is $r = \\sqrt{(-2)^2 + (1)^2 - \\dfrac{5}{2}} = \\sqrt{5 - \\dfrac{5}{2}} = \\sqrt{\\dfrac{5}{2}}$.<br><br>The point from which tangents are drawn is $P(1, 1)$.<br><br>The distance between the point $P$ and the center $C$ is $PC = \\sqrt{(2 - 1)^2 + (-1 - 1)^2} = \\sqrt{1 + 4} = \\sqrt{5}$.<br><br>Let the angle between the tangents be $2\\theta$. From the right-angled triangle formed by the center, the point $P$, and the point of tangency, we have:<br><br>$\\sin \\theta = \\dfrac{r}{PC} = \\dfrac{\\sqrt{\\dfrac{5}{2}}}{\\sqrt{5}} = \\dfrac{1}{\\sqrt{2}}$<br><br>This gives $\\theta = \\dfrac{\\pi}{4}$.<br><br>The angle between the tangents is $2\\theta = 2 \\times \\dfrac{\\pi}{4} = \\dfrac{\\pi}{2}$.<br><br>Answer: $\\dfrac{\\pi}{2}$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2e78c30a4553e1bde0c", "type": "singleCorrect", "question": {"text": "The angle between the tangents drawn from the origin to the circle $(x-7)^2 + (y+1)^2 = 25$ is", "image": null}, "options": [{"id": "EkSe0", "label": "A", "text": "$45^\\circ$", "isCorrect": false, "image": null}, {"id": "0tFSf", "label": "B", "text": "$90^\\circ$", "isCorrect": true, "image": null}, {"id": "Kly37", "label": "C", "text": "$60^\\circ$", "isCorrect": false, "image": null}, {"id": "mfjRc", "label": "D", "text": "$30^\\circ$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of the circle is $(x-7)^2 + (y+1)^2 = 25$.<br><br>The center of the circle is $C(7, -1)$ and its radius is $r = 5$.<br><br>Let the tangents be drawn from the origin $O(0, 0)$ and the angle between them be $2\\theta$.<br><br>The distance between the origin and the center of the circle is $OC = \\sqrt{(7-0)^2 + (-1-0)^2} = \\sqrt{50} = 5\\sqrt{2}$.<br><br>From the right-angled triangle formed by the origin, the center, and the point of contact, we have $\\sin \\theta = \\dfrac{r}{OC}$.<br><br>$\\sin \\theta = \\dfrac{5}{5\\sqrt{2}} = \\dfrac{1}{\\sqrt{2}}$<br><br>$\\theta = 45^\\circ$<br><br>The angle between the tangents is $2\\theta = 90^\\circ$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b60bf9280d7f99328a1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The locus of point of intersection of the tangents to the circle $x^2+y^2=16$, such that the angle between them is $60^{\\circ}$, is", "image": null}, "options": [{"id": "6Bxh0", "text": "$x^2+y^2=4$", "image": null, "isCorrect": false}, {"id": "UAsMN", "text": "$x^2+y^2=64$", "image": null, "isCorrect": true}, {"id": "7BtbX", "text": "$x^2+y^2=32$", "image": null, "isCorrect": false}, {"id": "HCWnL", "text": "$x^2+y^2=48$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the point of intersection of the tangents be $P(h, k)$.<br><br>The equation of the given circle is $x^2+y^2=16$, which has its center at $O(0,0)$ and radius $a=4$.<br><br>The angle between the tangents from $P$ is given as $\\theta = 60^{\\circ}$. The line joining the center $O$ to $P$ bisects the angle between the tangents.<br><br>In the right-angled triangle formed by the center $O$, the point of contact $T$, and $P$, we have:<br><br>$\\sin\\left(\\dfrac{\\theta}{2}\\right) = \\dfrac{OT}{OP}$<br><br>$\\sin(30^{\\circ}) = \\dfrac{4}{\\sqrt{h^2+k^2}}$<br><br>$\\dfrac{1}{2} = \\dfrac{4}{\\sqrt{h^2+k^2}}$<br><br>$\\sqrt{h^2+k^2} = 8$<br><br>Squaring both sides, we get:<br><br>$h^2+k^2 = 64$<br><br>Replacing $(h, k)$ with $(x, y)$, the locus of the point is $x^2+y^2 = 64$.<br><br>Answer: $x^2+y^2=64$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f73", "heldOn": "2025-04-21T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 2)", "title": "MHT CET 2025 (21 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213db0aee93fa0796dc10", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}], "question": {"text": "Let PQ and RS be tangents at the extremities of the diameter PR of a circle of radius r. If PS and RQ intersect at a point $X$ on the circumference of the circle, then 2 r equals", "image": null}, "options": [{"id": "g1E4p", "text": "$\\sqrt{\\mathrm{PQ} \\cdot \\mathrm{RS}}$", "image": null, "isCorrect": true}, {"id": "i8wG7", "text": "$\\dfrac{\\mathrm{PQ}+\\mathrm{RS}}{2}$", "image": null, "isCorrect": false}, {"id": "uT6qi", "text": "$\\dfrac{2 \\cdot \\mathrm{PQ} \\cdot \\mathrm{RS}}{\\mathrm{PQ}+\\mathrm{RS}}$", "image": null, "isCorrect": false}, {"id": "LZHHo", "text": "$\\sqrt{\\dfrac{\\mathrm{PQ}^2+\\mathrm{RS}^2}{2}}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the equation of the circle be $x^2 + y^2 = r^2$.<br><br>Let the extremities of the diameter $PR$ be $P(0, -r)$ and $R(0, r)$.<br><br>The equations of the tangents at $P$ and $R$ are $y = -r$ and $y = r$ respectively.<br><br>Let the coordinates of $Q$ on the tangent at $P$ be $(a, -r)$ and $S$ on the tangent at $R$ be $(b, r)$. Thus, $PQ = a$ and $RS = b$.<br><br>The equation of the line $PS$ passing through $P(0, -r)$ and $S(b, r)$ is:<br><br>$y + r = \\dfrac{r - (-r)}{b - 0}(x - 0) \\Rightarrow y = \\dfrac{2r}{b}x - r$<br><br>The equation of the line $RQ$ passing through $R(0, r)$ and $Q(a, -r)$ is:<br><br>$y - r = \\dfrac{-r - r}{a - 0}(x - 0) \\Rightarrow y = -\\dfrac{2r}{a}x + r$<br><br>To find the intersection point $X$, equate the expressions for $y$:<br><br>$\\dfrac{2r}{b}x - r = -\\dfrac{2r}{a}x + r$<br><br>$2rx \\left( \\dfrac{1}{a} + \\dfrac{1}{b} \\right) = 2r$<br><br>$x \\left( \\dfrac{a+b}{ab} \\right) = 1 \\Rightarrow x = \\dfrac{ab}{a+b}$<br><br>Substituting $x$ into the equation of $PS$ gives $y$:<br><br>$y = \\dfrac{2r}{b} \\left( \\dfrac{ab}{a+b} \\right) - r = \\dfrac{2ar}{a+b} - r = r \\left( \\dfrac{a-b}{a+b} \\right)$<br><br>Since the point $X$ lies on the circle $x^2 + y^2 = r^2$, substitute the coordinates of $X$:<br><br>$\\left( \\dfrac{ab}{a+b} \\right)^2 + r^2 \\left( \\dfrac{a-b}{a+b} \\right)^2 = r^2$<br><br>$a^2b^2 + r^2(a-b)^2 = r^2(a+b)^2$<br><br>$a^2b^2 = r^2 \\left[ (a+b)^2 - (a-b)^2 \\right]$<br><br>$a^2b^2 = r^2(4ab)$<br><br>Since $a$ and $b$ are non-zero lengths, dividing by $ab$ yields:<br><br>$ab = 4r^2$<br><br>$(2r)^2 = ab$<br><br>$2r = \\sqrt{ab}$<br><br>Substituting $a = PQ$ and $b = RS$, we get:<br><br>$2r = \\sqrt{PQ \\cdot RS}$<br><br>Answer: $\\sqrt{\\mathrm{PQ} \\cdot \\mathrm{RS}}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-10T14:00:00.000Z", "isVisible": true, "shortName": "2024 (10 May Shift 2)", "title": "MHT CET 2024 (10 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6792133f0aee93fa0796d74b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}], "question": {"text": "Two tangents drawn from $\\mathrm{P}(1,7)$ to the circle $x^2+y^2=25$, touch the circle at Q and R respectively. The area of the quadrilateral PQOR is", "image": null}, "options": [{"id": "KpdMv", "text": "16 sq. units", "image": null, "isCorrect": false}, {"id": "x6L6i", "text": "36 sq. units", "image": null, "isCorrect": false}, {"id": "LBcWa", "text": "25 sq. units", "image": null, "isCorrect": true}, {"id": "WKqWX", "text": "49 sq. units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The center of the given circle $x^2+y^2=25$ is $O(0,0)$ and its radius is $r = 5$.<br><br>The length of the tangent from $P(1,7)$ to the circle is given by $L = \\sqrt{x_1^2 + y_1^2 - r^2}$.<br><br>$L = \\sqrt{1^2 + 7^2 - 25} = \\sqrt{1 + 49 - 25} = \\sqrt{25} = 5$.<br><br>The quadrilateral $PQOR$ is formed by two congruent right-angled triangles, $\\triangle PQO$ and $\\triangle PRO$.<br><br>The area of $\\triangle PQO$ is $\\dfrac{1}{2} \\times OQ \\times PQ = \\dfrac{1}{2} \\times r \\times L = \\dfrac{1}{2} \\times 5 \\times 5 = \\dfrac{25}{2}$.<br><br>The total area of the quadrilateral $PQOR$ is $2 \\times \\dfrac{25}{2} = 25$ sq. units.<br><br>Answer: 25 sq. units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc3", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T14:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 2)", "title": "MHT CET 2024 (02 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261b60279619d9d8a2ebf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}], "question": {"text": "Two tangents to the circle $x^2+y^2=4$ at the points $\\mathrm{A}$ and $\\mathrm{B}$ meet at the point $\\mathrm{P}(-4,0)$. Then the area of the quadrilateral $\\mathrm{PAOB}, \\mathrm{O}$ being the origin, is", "image": null}, "options": [{"id": "V9ivC", "text": "$2 \\sqrt{3}$ sq. units", "image": null, "isCorrect": false}, {"id": "jjCps", "text": "$8 \\sqrt{3}$ sq. units", "image": null, "isCorrect": false}, {"id": "SoLx7", "text": "$4 \\sqrt{3}$ sq. units", "image": null, "isCorrect": true}, {"id": "jEPeW", "text": "$6 \\sqrt{3}$ sq. units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/6zeLI6_v1eXANyhA-iYLTZxDSjBjN1-KV1K6yWhwadM.original.fullsize.png\"><br>\n$\\begin{aligned} \\text { Required area } & =2 \\times \\text { Area of } \\triangle \\mathrm{PBO} \\\\ & =2 \\times \\frac{1}{2} \\times 2 \\times 2 \\sqrt{3} \\\\ & =4 \\sqrt{3} \\text { sq. units }\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892aa", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-09T09:00:00.000Z", "isVisible": true, "shortName": "2023 (09 May Shift 1)", "title": "MHT CET 2023 (09 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261440279619d9d8a2b2c", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}], "question": {"text": "Angle between the tangents to the circle $x^2+y^2=25 x^2$ from the point $(1,7)$ is", "image": null}, "options": [{"id": "0fbw4", "text": "$\\frac{\\pi}{4}$", "image": null, "isCorrect": false}, {"id": "Ty4Lx", "text": "$\\tan ^{-1}\\left(\\frac{2}{5}\\right)$", "image": null, "isCorrect": false}, {"id": "RKrnR", "text": "$\\tan ^{-1} 2$", "image": null, "isCorrect": false}, {"id": "8hANJ", "text": "$\\frac{\\pi}{2}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/bDxjkK70UokgG1ThPKzslju1rqD7mGiwG3_RjcOb9SY.original.fullsize.png\">\n$\\begin{aligned} & \\mathrm{OP}=5 \\sqrt{2} \\\\ & \\mathrm{OT}=5 \\\\ & \\mathrm{PT}=\\sqrt{\\mathrm{OP}^2-\\mathrm{OT}^2}=5 \\\\ & \\Rightarrow \\angle \\mathrm{OPT}=45^{\\circ} \\\\ & \\Rightarrow \\angle \\mathrm{TPT}^{\\prime}=2 \\angle \\mathrm{OPT}=2 \\times 45^{\\circ}=90^{\\circ}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-07T14:00:00.000Z", "isVisible": true, "shortName": "2022 (07 Aug Shift 2)", "title": "MHT CET 2022 (07 Aug Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea80279619d9d8a163c", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The equation of the pair of tangents at $(0,1)$ to the circle $x^{2}+y^{2}-2 x-6 y+6=0$ is", "image": null}, "options": [{"id": "ggNm0", "text": "$3\\left(x^{2}-y^{2}\\right)+4 x y-4 x-6 y+3=0$", "image": null, "isCorrect": false}, {"id": "pVnYL", "text": "$3 y^{2}+4 x y-4 x-6 y+3=0$", "image": null, "isCorrect": true}, {"id": "s8C3p", "text": "$3 x^{2}+4 x y-4 x-6 y+3=0$", "image": null, "isCorrect": false}, {"id": "Qy8LE", "text": "$3\\left(x^{2}+y^{2}\\right)+4 x y-4 x-6 y+3=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $S \\equiv x^{2}+y^{2}-2 x-6 y+6=0$\nand $\\begin{aligned} \\quad P\\left(x_{1}, y_{1}\\right)=(0,1) \\\\ S_{1}=& x_{1}^{2}+y_{1}^{2}-2 x_{1}-6 y_{1}+6=0 \\\\=&(0)^{2}+(1)^{2}-2(0)-6(1)+6 \\\\=& 1-6+6=1 \\\\ T=& x \\cdot x_{1}+y \\cdot y_{1}-\\left(x+x_{1}\\right)-3\\left(y+y_{1}\\right)+6 \\\\=& x \\cdot(0)+y(1)-(x+0)-3(y+1)+6 \\\\=& 0+y-x-3 y-3+6 \\\\ \\quad=&-x-2 y+3 \\end{aligned}$\n$\\begin{aligned} \\Rightarrow T^{2} &=(-x-2 y+3)^{2} \\\\ &=(-x-2 y)^{2}+9+6(-x-2 y) \\\\ &=x^{2}+4 y^{2}+4 x y+9-6 x-12 y \\end{aligned}$\n$\\therefore$ Equation of the pair of tangents $S \\cdot S_{1}=T^{2}$\n$\\left(x^{2}+y^{2}-2 x-6 y+6\\right)(1)$\n$\\quad=x^{2}+4 y^{2}+4 x y-6 x-12 y+9$\n$\\Rightarrow 3 y^{2}+4 x y-4 x-6 y+3=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e900279619d9d8a1578", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "The angle between a pair of tangents drawn from a point 'P' to the circle $x^{2}+y^{2}+4 x-6 y+9 \\sin ^{2} \\alpha+13 \\cos ^{2} \\alpha=0$ is\n$2 \\alpha$. The equation of the locus of the point ${ }^{'} P$ ' is", "image": null}, "options": [{"id": "IR9dL", "text": "$x^{2}+y^{2}+4 x-6 y+4=0$", "image": null, "isCorrect": false}, {"id": "xceyw", "text": "$x^{2}+y^{2}+4 x-6 y-9=0$", "image": null, "isCorrect": false}, {"id": "oDsTh", "text": "$x^{2}+y^{2}+4 x-6 y-4=0$", "image": null, "isCorrect": false}, {"id": "uIXYY", "text": "$x^{2}+y^{2}+4 x-6 y+9=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The equation of a given circle is\n$$\nx^{2}+y^{2}+4 x-6 y+9 \\sin ^{2} \\alpha+13 \\cos ^{2} \\alpha=0\n$$\n$\\therefore$ Centre $A(-2,3)$ in $\\Delta A B P$,\n$$\n\\sin \\alpha=\\frac{2 \\sin \\alpha}{\\sqrt{(h+2)^{2}+(k-3)^{2}}}\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/IBh8ksvbbvZK_1JfpaF1I7KODMMUBS62o8d01jpSsEY.original.fullsize.png\"><br>\n$\\Rightarrow \\quad(h+2)^{2}+(k-3)^{2}=4$\n$\\Rightarrow \\quad h^{2}+k^{2}+4 h-6 k+9=0$\nHence, the required locus of $P(h, k)$ is\n$$\nx^{2}+y^{2}+4 x-6 y+9=0\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 8, "topicId": "65a263390279619d9d8a3d31", "title": "Chord of Contact", "totalQuestions": 1, "questions": [{"_id": "65a25fac0279619d9d8a1e5a", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}], "question": {"text": "The co-ordinates of the mid-point of the chord cut off by theline $2 x-5 y+18=0$\nby the circle $x^{2}+y^{2}-6 x+2 y-54=0$ are", "image": null}, "options": [{"id": "S9drL", "text": "$(1,4)$", "image": null, "isCorrect": true}, {"id": "K9XVR", "text": "$(2,4)$", "image": null, "isCorrect": false}, {"id": "nUSkQ", "text": "$(4,1)$", "image": null, "isCorrect": false}, {"id": "pw1PX", "text": "$(1,1)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $A B$ be the chord\nLet the mid point of chord be $\\mathrm{M}(\\mathrm{h}, \\mathrm{k})$\nHere centre is $\\mathrm{O}=(3-1)$\nHere $O M \\perp A B$\n$\\therefore($ slope of $\\mathrm{OM})($ slope of $\\mathrm{AB})=-1$\n$\\left(\\frac{\\mathrm{k}+1}{\\mathrm{~h}-3}\\right)\\left(\\frac{2}{5}\\right)=-1$\n$\\therefore 5 \\mathrm{~h}+2 \\mathrm{k}=13$\nPoint $M(h, k)$ lies on the $2 x-5 y+18=0$...(1)\n$\\therefore 2 \\mathrm{~h}-5 \\mathrm{k}=-18$...(2)\nSolving equation (1) \\& (2) we get $\\mathrm{h}=1, \\mathrm{k}=4 \\Rightarrow(1,4)$ is required point.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T14:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 2)", "title": "MHT CET 2020 (15 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 9, "topicId": "65a263390279619d9d8a3d33", "title": "Chord with given Middle Point", "totalQuestions": 1, "questions": [{"_id": "65a2609c0279619d9d8a25e4", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}], "question": {"text": "Equation of the chord of the circle $x^2+y^2-4 x-10 y+25=0$ having mid-point $(1,2)$ is", "image": null}, "options": [{"id": "UCyQZ", "text": "$-x+3 y=5$", "image": null, "isCorrect": false}, {"id": "RsHI5", "text": "$x+3 y=7$", "image": null, "isCorrect": true}, {"id": "Nz97o", "text": "$5 x+y=7$", "image": null, "isCorrect": false}, {"id": "M6GVv", "text": "$3 x+y=5$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& x^2+y^2-4 x-10 y+25=0 \\Rightarrow \\text { centre }=(2,5) \\text { and } \\\\\n& \\text { radius }=\\sqrt{4+25-25}=2\n\\end{aligned}\n$$\nRefer figure\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/j_R9j6w2g9--8pgvKr217eCJVrQo1AzKIsBrwionUJQ.original.fullsize.png\"><br>\nLet $\\mathrm{M}(1,2)$ be the midpoint of chord\nSlope of $\\mathrm{CM}=\\frac{2-5}{1-2}=3$\n$\\therefore$ Slope of $\\mathrm{AB}=\\frac{-1}{3}$\nEquation of $\\mathrm{AB}$ is $(\\mathrm{y}-2)=\\frac{-1}{3}(\\mathrm{x}-1)$ i.e. $\\mathrm{x}+3 \\mathrm{y}=7$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-23T09:00:00.000Z", "isVisible": true, "shortName": "2021 (23 Sep Shift 1)", "title": "MHT CET 2021 (23 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 10, "topicId": "65a263390279619d9d8a3d2c", "title": "Intersection of Circles", "totalQuestions": 5, "questions": [{"_id": "6abb88a515a9fc0fc8c145a7", "type": "singleCorrect", "question": {"text": "The maximum number of points of intersection between $4$ circles and $4$ straight lines is:", "image": null}, "options": [{"id": "MLzhu", "label": "A", "text": "$66$", "isCorrect": false, "image": null}, {"id": "78mb4", "label": "B", "text": "$50$", "isCorrect": true, "image": null}, {"id": "cT6y1", "label": "C", "text": "$32$", "isCorrect": false, "image": null}, {"id": "GS8C2", "label": "D", "text": "$18$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The maximum number of points of intersection between $4$ circles is $2 \\times ^{4}C_{2} = 2 \\times 6 = 12$.<br><br>The maximum number of points of intersection between $4$ straight lines is $1 \\times ^{4}C_{2} = 6$.<br><br>The maximum number of points of intersection between $4$ circles and $4$ straight lines is $2 \\times (4 \\times 4) = 32$.<br><br>The total maximum number of points of intersection is $12 + 6 + 32 = 50$.<br><br>Answer: $50$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996e", "title": "MHT CET 2026 (19 May Shift 2)", "shortName": "2026 (19 May Shift 2)", "isVisible": true, "heldOn": "2026-05-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2623a0279619d9d8a32d8", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}], "question": {"text": "The circles $x^2+y^2+2 \\mathrm{a} x+\\mathrm{c}=0$ and $x^2+y^2+2 \\mathrm{~b} y+\\mathrm{c}=0$ touch each other externally, if", "image": null}, "options": [{"id": "t2SPL", "text": "$\\frac{1}{a^2}-\\frac{1}{b^2}=\\frac{1}{c}$", "image": null, "isCorrect": false}, {"id": "X0fGV", "text": "$\\frac{1}{\\mathrm{a}^2}+\\frac{1}{\\mathrm{~b}^2}=\\frac{1}{\\mathrm{c}}$", "image": null, "isCorrect": true}, {"id": "gJmw4", "text": "$\\frac{1}{a^2}+\\frac{1}{b^2}=\\frac{1}{c^2}$", "image": null, "isCorrect": false}, {"id": "yjnCe", "text": "$\\frac{1}{a^2}-\\frac{1}{b^2}=\\frac{1}{c^2}$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{aligned}\n& x^2+y^2+2 \\mathrm{a} x+\\mathrm{c}=0 \\\\\n& \\Rightarrow x^2+2 \\mathrm{a} x+\\mathrm{a}^2+y^2=\\mathrm{a}^2-\\mathrm{c} \\\\\n& \\Rightarrow(x+\\mathrm{a})^2+y^2=\\left(\\sqrt{\\mathrm{a}^2-\\mathrm{c}}\\right)^2\n\\end{aligned}\n$$\ni.e., it is a circle with centre $(-a, 0)$ and radius\n$$\n\\sqrt{\\mathrm{a}^2-\\mathrm{c}}\n$$\n\nSimiłarly,\n$$\n\\begin{aligned}\n& x^2+y^2+2 \\mathrm{~b} y+\\mathrm{c}=0 \\\\\n& \\Rightarrow x^2+(y+\\mathrm{b})^2=\\left(\\sqrt{\\mathrm{b}^2-\\mathrm{c}}\\right)^2\n\\end{aligned}\n$$\ni.e., it is a circle with centre $(0,-b)$ and\n$$\n\\text { radius }=t \\sqrt{b^2-c}\n$$\n$\\therefore \\quad$ If circles touch externally, then we get Sum of radii $=$ Distance between centres\n$$\n\\begin{aligned}\n& \\Rightarrow \\sqrt{a^2-c}+\\sqrt{b^2-c}=\\sqrt{a^2+b^2} \\\\\n& \\Rightarrow a^2-c+b^2-c+2 \\sqrt{a^2-c} \\sqrt{b^2-c}=a^2+b^2 \\\\\n& \\Rightarrow\\left(a^2-c\\right)\\left(b^2-c\\right)=c^2 \\\\\n& \\Rightarrow a^2 b^2-c b^2-c a^2+c^2=c^2 \\\\\n& \\Rightarrow \\frac{1}{a^2}+\\frac{1}{b^2}=\\frac{1}{c}\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b1", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-12T14:00:00.000Z", "isVisible": true, "shortName": "2023 (12 May Shift 2)", "title": "MHT CET 2023 (12 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261db0279619d9d8a2fe5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}], "question": {"text": "If the circles $x^2+y^2=9$ and $x^2+y^2+2 \\alpha x+2 y+1=0$ touch each other internally, then the value of $\\alpha^3$ is", "image": null}, "options": [{"id": "Xhs31", "text": "$\\frac{27}{64}$", "image": null, "isCorrect": false}, {"id": "L7G6c", "text": "$\\frac{125}{27}$", "image": null, "isCorrect": false}, {"id": "CCJPE", "text": "$\\frac{27}{125}$", "image": null, "isCorrect": false}, {"id": "hWH8L", "text": "$\\frac{64}{27}$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& x^2+y^2=9 \\\\\n& \\mathrm{C}_1=(0,0), \\mathrm{r}_1=3 \\\\\n& x^2+y^2+2 \\alpha x+2 y+1=0 \\\\\n& \\mathrm{C}_2=(-\\alpha,-1), \\\\\n& \\mathrm{r}_2=\\sqrt{\\alpha^2+1-1}=\\alpha\n\\end{aligned}$\nSince the given circles touch each other internally,\n$\\begin{aligned}\n& \\mathrm{C}_1 \\mathrm{C}_2=\\left|\\mathrm{r}_1-\\mathrm{r}_2\\right| \\\\\n& \\Rightarrow \\sqrt{\\mathrm{a}^2+1}=|3-\\alpha| \\\\\n& \\Rightarrow \\alpha^2+1=9+\\alpha^2-6 \\alpha \\\\\n& \\Rightarrow 6 \\alpha=8 \\\\\n& \\Rightarrow \\alpha=\\frac{4}{3} \\\\\n& \\Rightarrow \\alpha^3=\\frac{64}{27}\n\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ac", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-10T09:00:00.000Z", "isVisible": true, "shortName": "2023 (10 May Shift 1)", "title": "MHT CET 2023 (10 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a261a40279619d9d8a2e29", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}], "question": {"text": "Given two circles $\\quad x^2+y^2+8 x-6 y-24=0 \\quad$ and $x^2+y^2-4 x+10 y+20=0$. Then they are", "image": null}, "options": [{"id": "Vlm6O", "text": "Disjoint.", "image": null, "isCorrect": false}, {"id": "sX3Yb", "text": "Concentric,", "image": null, "isCorrect": false}, {"id": "SIKMa", "text": "Touching internally", "image": null, "isCorrect": false}, {"id": "M578J", "text": "Touching externally.", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& x^2+y^2+8 x-6 y-24=0, C_1 \\equiv(-4,3), r_1=7 \\\\\n& x^2+y^2-4 x+10 y+20=0, C_2 \\equiv(2,-5), r_2=3 \\\\\n& C_1 C_2=\\sqrt{(2+4)^2+(-5-3)^2}=10 \\text { and } r_1+r_2=7+3=10\n\\end{aligned}$\n$\\because C_1 C_2=r_1+r_2$ hence, the tow circles touching externally", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892a9", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2022-08-11T09:00:00.000Z", "isVisible": true, "shortName": "2022 (11 Aug Shift 1)", "title": "MHT CET 2022 (11 Aug Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e910279619d9d8a157b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "If the circles $x^{2}+y^{2}+2 x+2 k y+6=0$, $x^{2}+y^{2}+2 k y+k=0$ intersect orthogonally, then $k$ is", "image": null}, "options": [{"id": "XGfoY", "text": "2 or $-3 / 2$", "image": null, "isCorrect": true}, {"id": "AJYYE", "text": "$-2$ or $-3 / 2$", "image": null, "isCorrect": false}, {"id": "Po5dM", "text": "2 or $3 / 2$", "image": null, "isCorrect": false}, {"id": "nC1Kk", "text": "$-2$ or $3 / 2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since, circles cut orthogonally, if\n$$\n\\begin{aligned}\n& & 2 g g^{\\prime}+2 f f^{\\prime}=c+c^{\\prime} \\\\\n\\Rightarrow & & \\quad 0+2 k^{2}=6+k \\\\\n\\Rightarrow & & 2 k^{2}-k-6=0 \\\\\n\\Rightarrow & &(2 k+3)(k-2)=0\n\\end{aligned}\n$$\n$\\Rightarrow \\quad k=2$ or $-3 / 2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 11, "topicId": "65a263390279619d9d8a3d34", "title": "Common Tangents", "totalQuestions": 5, "questions": [{"_id": "6a44d2e68c30a4553e1bde01", "type": "singleCorrect", "question": {"text": "The equation of the common tangent touching the circle $(x-3)^2 + y^2 = 9$ and the parabola $y^2 = 4x$ above the X-axis is", "image": null}, "options": [{"id": "oY72C", "label": "A", "text": "$\\sqrt{3}y = 3x + 1$", "isCorrect": false, "image": null}, {"id": "8taor", "label": "B", "text": "$\\sqrt{3}y = -(x + 3)$", "isCorrect": false, "image": null}, {"id": "Xdb82", "label": "C", "text": "$\\sqrt{3}y = x + 3$", "isCorrect": true, "image": null}, {"id": "0FHCk", "label": "D", "text": "$\\sqrt{3}y = -(3x + 1)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of a tangent to the parabola $y^2 = 4x$ having slope $m$ is given by $y = mx + \\dfrac{1}{m}$, which can be written as $mx - y + \\dfrac{1}{m} = 0$.<br><br>Since this line is also a tangent to the circle $(x-3)^2 + y^2 = 9$, the perpendicular distance from the center of the circle $(3, 0)$ to the line must be equal to its radius $3$.<br><br>$\\dfrac{\\left|3m - 0 + \\dfrac{1}{m}\\right|}{\\sqrt{m^2 + 1}} = 3$<br><br>Squaring both sides:<br><br>$\\left(3m + \\dfrac{1}{m}\\right)^2 = 9(m^2 + 1)$<br><br>$9m^2 + 6 + \\dfrac{1}{m^2} = 9m^2 + 9$<br><br>$\\dfrac{1}{m^2} = 3 \\Rightarrow m = \\pm \\dfrac{1}{\\sqrt{3}}$<br><br>The point of contact of the tangent on the parabola is $\\left(\\dfrac{1}{m^2}, \\dfrac{2}{m}\\right)$. Since the tangent touches the parabola above the X-axis, the y-coordinate of the point of contact must be positive, which implies $m > 0$.<br><br>Therefore, $m = \\dfrac{1}{\\sqrt{3}}$.<br><br>Substituting $m = \\dfrac{1}{\\sqrt{3}}$ in the equation of the tangent:<br><br>$y = \\dfrac{1}{\\sqrt{3}}x + \\sqrt{3}$<br><br>$\\sqrt{3}y = x + 3$<br><br>Answer: $\\sqrt{3}y = x + 3$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a73", "title": "MHT CET 2026 (15 April Shift 2)", "shortName": "2026 (15 April Shift 2)", "isVisible": true, "heldOn": "2026-04-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf1bf9280d7f9932de2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The number of common tangents to the circles $x^2+y^2-4 x-6 y-12=0$ and $x^2+y^2+6 x+18 y+26=0$, is", "image": null}, "options": [{"id": "K0jFw", "text": "3", "image": null, "isCorrect": true}, {"id": "YxJeB", "text": "1", "image": null, "isCorrect": false}, {"id": "ZVMiE", "text": "2", "image": null, "isCorrect": false}, {"id": "sH9Jx", "text": "4", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "For the first circle $x^2+y^2-4x-6y-12=0$, the center is $C_1(2, 3)$ and the radius is $r_1 = \\sqrt{2^2 + 3^2 - (-12)} = \\sqrt{4+9+12} = 5$.<br><br>For the second circle $x^2+y^2+6x+18y+26=0$, the center is $C_2(-3, -9)$ and the radius is $r_2 = \\sqrt{(-3)^2 + (-9)^2 - 26} = \\sqrt{9+81-26} = 8$.<br><br>The distance between the centers $C_1$ and $C_2$ is $d = \\sqrt{(-3-2)^2 + (-9-3)^2} = \\sqrt{25 + 144} = \\sqrt{169} = 13$.<br><br>The sum of the radii is $r_1 + r_2 = 5 + 8 = 13$.<br><br>Since $d = r_1 + r_2$, the two circles touch each other externally.<br><br>Therefore, the number of common tangents is $3$.<br><br>Answer: 3", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b06bf9280d7f99325b5", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The number of common tangents that can be drawn to the circles $x^2+y^2-6 x=0$ and $x^2+y^2+6 x+2 y+1=0$ is .....", "image": null}, "options": [{"id": "fn3Pk", "text": "$0$", "image": null, "isCorrect": false}, {"id": "TOExe", "text": "$3$", "image": null, "isCorrect": false}, {"id": "PIrlQ", "text": "$2$", "image": null, "isCorrect": false}, {"id": "iKW6q", "text": "$4$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "For the first circle $x^2+y^2-6x=0$:<br>Center $C_1 = (3, 0)$<br>Radius $r_1 = \\sqrt{(-3)^2 + 0^2 - 0} = 3$<br><br>For the second circle $x^2+y^2+6x+2y+1=0$:<br>Center $C_2 = (-3, -1)$<br>Radius $r_2 = \\sqrt{3^2 + 1^2 - 1} = 3$<br><br>The distance between the centers is:<br>$d = \\sqrt{(-3 - 3)^2 + (-1 - 0)^2} = \\sqrt{36 + 1} = \\sqrt{37}$<br><br>The sum of the radii is:<br>$r_1 + r_2 = 3 + 3 = 6 = \\sqrt{36}$<br><br>Since $d > r_1 + r_2$, the two circles lie completely outside each other and do not intersect.<br><br>Therefore, the number of common tangents that can be drawn is $4$.<br><br>Answer: $4$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f6e", "heldOn": "2025-04-19T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (19 Apr Shift 1)", "title": "MHT CET 2025 (19 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262010279619d9d8a310b", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}], "question": {"text": "Number of common tangents to the circles $x^2+y^2-6 x-14 y+48=0$ and $x^2+y^2-6 x=0$ are", "image": null}, "options": [{"id": "jPJiV", "text": "$0$", "image": null, "isCorrect": false}, {"id": "QCOWN", "text": "$1$", "image": null, "isCorrect": false}, {"id": "CcgQ2", "text": "$4$", "image": null, "isCorrect": true}, {"id": "0igvo", "text": "$2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$$\n\\begin{array}{ll} \n& x^2+y^2-6 x-14 y+48=0 \\\\\n\\therefore \\quad & \\mathrm{C}_1(3,7), \\mathrm{r}_1=\\sqrt{10} \\\\\n& \\text { Again } x^2+y^2-6 x=0 \\\\\n\\therefore \\quad & \\mathrm{C}_2(3,0), \\mathrm{r}_2=3\n\\end{array}\n$$\n\nNow $l\\left(\\mathrm{C}_1 \\mathrm{C}_2\\right)=$ distance between centres\n$$\n\\begin{aligned}\n& \\therefore \\quad l\\left(\\mathrm{C}_1 \\mathrm{C}_2\\right)=\\sqrt{0^2+7^2}=7 \\text { and } \\\\\n& \\\\\n& \\mathrm{r}_1+\\mathrm{r}_2=\\sqrt{10}+3 < l\\left(\\mathrm{C}_1 \\mathrm{C}_2\\right)\n\\end{aligned}\n$$\n$\\Rightarrow$ The given circles are disjoint.\n$\\Rightarrow$ Number of common tangents is 4 .", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b88f20917a5f41892ae", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-11T09:00:00.000Z", "isVisible": true, "shortName": "2023 (11 May Shift 1)", "title": "MHT CET 2023 (11 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260c70279619d9d8a273e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}], "question": {"text": "The equation of common tangent to the circles $\\mathrm{x}^2+\\mathrm{y}^2-4 \\mathrm{x}+10 \\mathrm{y}+20=0$ and $\\mathrm{x}^2+\\mathrm{y}^2+8 \\mathrm{x}-6 \\mathrm{y}-24=0$ is", "image": null}, "options": [{"id": "HpInu", "text": "$3 x-4 y+11=0$", "image": null, "isCorrect": false}, {"id": "qS3k0", "text": "$3 x-4 y-11=0$", "image": null, "isCorrect": true}, {"id": "U08dm", "text": "$-3 x-4 y+11=0$", "image": null, "isCorrect": false}, {"id": "PJ9js", "text": "$3 x+4 y+11=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Circle $x^2+y^2-4 x+10 y+20=0$ has centre $C_1=(2,-5)$ and radius\n$$\n\\mathrm{r}_1=\\sqrt{4+25-20}=3\n$$\nCircle $\\mathrm{x}^2+\\mathrm{y}^2+8 \\mathrm{x}-6 \\mathrm{y}-24=0$ has centre $\\mathrm{C}_2=(2,-5)$ and radius\n$$\n\\mathrm{r}_2=\\sqrt{16+9+24}=7\n$$\nDistance between centres\n$$\n=\\sqrt{(2+4)^2+(5-2)^2}=10\n$$\nThus circle touch each other externally at one point only.\n$\\therefore$ Equation of common tangent is\n$$\n\\begin{aligned}\n& \\left(x^2+y^2-4 x+10 y+20\\right)-\\left(x^2+y^2+8 x-6 y-24\\right)=0 \\text { i.e. } \\\\\n& 12 x-16 y-44=0 \\quad \\Rightarrow \\quad 3 x-4 y-11=0\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T09:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 1)", "title": "MHT CET 2021 (24 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 12, "topicId": "65a263390279619d9d8a3d2d", "title": "Common Chord", "totalQuestions": 2, "questions": [{"_id": "65a2608f0279619d9d8a257d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}], "question": {"text": "Two circles centered at $(2,3)$ and $(4,5)$ intersects each other. If their radii are equal, then the equation of the common chord is", "image": null}, "options": [{"id": "OshM2", "text": "$x+y+1=0$", "image": null, "isCorrect": false}, {"id": "X0rX5", "text": "$x+y-1=0$", "image": null, "isCorrect": false}, {"id": "7G1uW", "text": "$x+y-7=0$", "image": null, "isCorrect": true}, {"id": "lud9Y", "text": "$x+y+7=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Equation of common chord is $S_1-S_2=0$, where $S_1$ and $S_2$ are equations of the circles\n$$\n\\begin{aligned}\n& \\therefore\\left[(\\mathrm{x}-2)^2+(\\mathrm{y}-3)^2\\right]-\\left[(\\mathrm{x}-4)^2+(\\mathrm{y}-5)^2\\right]=0 \\\\\n& \\therefore-4 \\mathrm{x}+4-6 \\mathrm{y}+9+8 \\mathrm{x}-16+10 \\mathrm{y}-25=0 \\\\\n& \\therefore 4 \\mathrm{x}+4 \\mathrm{y}-28=0 \\quad \\Rightarrow \\mathrm{x}+\\mathrm{y}=7\n\\end{aligned}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f418929a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T14:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 2)", "title": "MHT CET 2021 (22 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea80279619d9d8a163a", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "The equation of the circle whose diameter is common chord to the circles\n$x^{2}+y^{2}+2 a x+c=0$ \nand $x^{2}+y^{2}+2 b y+c=0$ is", "image": null}, "options": [{"id": "83oej", "text": "$x^{2}+y^{2}-\\frac{2 a b^{2}}{a^{2}+b^{2}} x+\\frac{2 a^{2} b}{a^{2}+b^{2}} y+c=0$", "image": null, "isCorrect": false}, {"id": "V33ek", "text": "$x^{2}+y^{2}-\\frac{2 a b^{2}}{a^{2}+b^{2}} x-\\frac{2 a^{2} b}{a^{2}+b^{2}} y+c=0$", "image": null, "isCorrect": false}, {"id": "UtIl2", "text": "$x^{2}+y^{2}+\\frac{2 a b^{2}}{a^{2}+b^{2}} x+\\frac{2 a^{2} b}{a^{2}+b^{2}} y+c=0$", "image": null, "isCorrect": true}, {"id": "U8bac", "text": "$x^{2}+y^{2}+\\frac{2 a b^{2}}{a^{2}+b^{2}} x-\\frac{2 a^{2} b}{a^{2}+b^{2}} y+c=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let $S_{1} \\equiv x^{2}+y^{2}+2 a x+c=0$\nand $S_{2} \\equiv x^{2}+y^{2}+2 b y+c=0$\nEquation of common chord as a diameter of the third circle\n$$\n\\begin{aligned}\nS_{1}-S_{2} &=0 \\\\\na x-b y &=0 \\\\\ny &=\\frac{a x}{b}...(i)\n\\end{aligned}\n$$\nOn putting the value of $y$ in Eq. (i), we get\n$$\n\\begin{array}{r}\nx^{2}+\\left(\\frac{a^{2} x^{2}}{b^{2}}\\right)+2 a x+c=0 \\\\\n\\left(a^{2}+b^{2}\\right) x^{2}+2 a b^{2} x+c b^{2}=0\n\\end{array}\n$$\nLet $x_{1}$ and $x_{2}$ be the roots of the equation.\n$\\therefore \\quad x_{1}+x_{2}=\\frac{-2 a b^{2}}{a^{2}+b^{2}}$ and $x_{1} x_{2}=\\frac{c b^{2}}{a^{2}+b^{2}}$\nSimilarly, $\\left(a^{2}+b^{2}\\right) y^{2}+2 b a^{2} y+c a^{2}=0$\nLet $y_{1}$ and $y_{2}$ be the roots of the equation $\\therefore \\quad y_{1}+y_{2}=\\frac{-2 a^{2} b}{a^{2}+b^{2}}$\nand $\\quad y_{1} y_{2}=\\frac{c a^{2}}{a^{2}+b^{2}}$\nNow, the required equation of third circle $\\left(x-x_{1}\\right)\\left(x-x_{2}\\right)+\\left(y-y_{1}\\right)\\left(y-y_{2}\\right)=0$\n$x^{2}-\\left(x_{1}+x_{2}\\right) x+x_{1} x_{2}+y^{2}-\\left(y_{1}+y_{2}\\right) y$\n$+y_{1} y_{2}=0$\n$x^{2}+y^{2}+\\frac{2 a b^{2}}{a^{2}+b^{2}} \\cdot x+\\frac{2 b a^{2}}{a^{2}+b^{2}} \\cdot y$\n$+\\frac{c b^{2}}{a^{2}+b^{2}}+\\frac{c a^{2}}{a^{2}+b^{2}}=0$\n$\\Rightarrow x^{2}+y^{2}+\\frac{2 a b^{2}}{a^{2}+b^{2}} \\cdot x+\\frac{2 a^{2} b}{a^{2}+b^{2}} \\cdot y$\n$+\\frac{c\\left(a^{2}+b^{2}\\right)}{\\left(a^{2}+b^{2}\\right)}=0$\n$\\Rightarrow x^{2}+y^{2}+\\frac{2 a b^{2}}{\\left(a^{2}+b^{2}\\right)} \\cdot x+\\frac{2 a^{2} b}{\\left(a^{2}+b^{2}\\right)} \\cdot y+c=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 13, "topicId": "65a263390279619d9d8a3d32", "title": "Family of Circle", "totalQuestions": 4, "questions": [{"_id": "679213580aee93fa0796d812", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}], "question": {"text": "The differential equation of family of circles, whose centres are on the X -axis and also touch the Y -axis is", "image": null}, "options": [{"id": "MJI6J", "text": "$4\\left(x+y \\dfrac{\\mathrm{~d} y}{\\mathrm{~d} x}\\right)^2 x^2=\\left(x^2+y^2\\right)^2$", "image": null, "isCorrect": true}, {"id": "ZF9IT", "text": "$\\left(x+y \\dfrac{\\mathrm{~d} y}{\\mathrm{~d} x}\\right)^2 x^2=\\left(x^2+y^2\\right)^2$", "image": null, "isCorrect": false}, {"id": "JYp8P", "text": "$2\\left(x+y \\dfrac{\\mathrm{~d} y}{\\mathrm{~d} x}\\right)^2 x^2=\\left(x^2+y^2\\right)^2$", "image": null, "isCorrect": false}, {"id": "gAJtU", "text": "$\\left(x+y \\dfrac{\\mathrm{~d} y}{\\mathrm{~d} x}\\right)^2 x^2=4\\left(x^2+y^2\\right)^2$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the centre of the circle be $(a, 0)$.<br><br>Since the circle touches the Y-axis, its radius is $a$.<br><br>The equation of the family of circles is $(x - a)^2 + y^2 = a^2$.<br><br>Expanding this, we get $x^2 - 2ax + a^2 + y^2 = a^2$, which simplifies to $x^2 + y^2 = 2ax$.<br><br>Differentiating both sides with respect to $x$, we get $2x + 2y \\dfrac{dy}{dx} = 2a$.<br><br>Thus, $a = x + y \\dfrac{dy}{dx}$.<br><br>Substituting the value of $a$ back into the equation $x^2 + y^2 = 2ax$, we get $x^2 + y^2 = 2x \\left( x + y \\dfrac{dy}{dx} \\right)$.<br><br>Squaring both sides, we obtain $\\left(x^2 + y^2\\right)^2 = 4x^2 \\left( x + y \\dfrac{dy}{dx} \\right)^2$.<br><br>Answer: $4\\left(x+y \\dfrac{\\mathrm{~d} y}{\\mathrm{~d} x}\\right)^2 x^2=\\left(x^2+y^2\\right)^2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e149a8109c6c5665cc6", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-03T09:00:00.000Z", "isVisible": true, "shortName": "2024 (03 May Shift 1)", "title": "MHT CET 2024 (03 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262850279619d9d8a352e", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}], "question": {"text": "The centre of the circle whose radius is 3 units and touching internally the circle $x^2+y^2-4 x-6 y-12=0$ at the point $(-1,-1)$ is", "image": null}, "options": [{"id": "WwE2i", "text": "$\\left(\\frac{4}{5}, \\frac{7}{5}\\right)$", "image": null, "isCorrect": true}, {"id": "H52xI", "text": "$\\left(\\frac{4}{5}, \\frac{-7}{5}\\right)$", "image": null, "isCorrect": false}, {"id": "hAQ0P", "text": "$\\left(\\frac{-4}{5}, \\frac{-7}{5}\\right)$", "image": null, "isCorrect": false}, {"id": "YukvP", "text": "$\\left(\\frac{-4}{5}, \\frac{7}{5}\\right)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/-qzTe-HRtwPWsh2axVghEt8BYo6x8HIwZpQoX6acuqo.original.fullsize.png\"><br>\n$\\begin{aligned}\n\\mathrm{PC}_1 & =\\sqrt{(2+1)^2+(3+1)^2} \\\\\n& =\\sqrt{25} \\\\\n& =5\n\\end{aligned}$\n$P$ divides $C_1 C_2$ externally in the ratio $r_1: r_2$ i.e. $5: 3$\n$\\therefore \\quad-1=\\frac{5(\\mathrm{~h})-3(2)}{5-3}$ and $-1=\\frac{5(\\mathrm{k})-3(3)}{5-3}$\n$\\begin{aligned} & \\Rightarrow-2=5 \\mathrm{~h}-6 \\text { and }-2=5 \\mathrm{k}-9 \\\\ & \\Rightarrow \\mathrm{h}=\\frac{4}{5} \\text { and } \\mathrm{k}=\\frac{7}{5}\\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b5", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T14:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 2)", "title": "MHT CET 2023 (14 May Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260da0279619d9d8a27d3", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f418929e", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-24T14:00:00.000Z", "isVisible": true, "shortName": "2021 (24 Sep Shift 2)", "title": "MHT CET 2021 (24 Sep Shift 2)"}], "question": {"text": "If $y=2 x$ is a chord of circle $x^2+y^2-10 x=0$, then the equation of circle with this chord as diameter is", "image": null}, "options": [{"id": "UxUPm", "text": "$x^2+y^2-2 x-4 y=0$", "image": null, "isCorrect": true}, {"id": "xJHRv", "text": "$x^2+y^2+2 x+4 y=0$", "image": null, "isCorrect": false}, {"id": "7DIxS", "text": "$x^2+y^2-2 x+4 y=0$", "image": null, "isCorrect": false}, {"id": "0XMd3", "text": "$x^2+y^2+2 x-4 y=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\begin{aligned}\n& x^2-10 x+y^2=0 \\\\\n& x-10 x+25+y^2=25 \\Rightarrow \\text { centre }=(5,0) \\text { and }
