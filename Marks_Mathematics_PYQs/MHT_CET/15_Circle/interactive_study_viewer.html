ight)$ and radius $\\sqrt{1+\\frac{9}{4}}=\\frac{\\sqrt{13}}{2}$ Hence required equation of circle is\n$$\nx^2+y^2+2(1) x+2\\left(\\frac{-3}{2}\\right) y+0=0 \\text { i.e. } x^2+y^2+2 x-3 y=0\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189299", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-22T09:00:00.000Z", "isVisible": true, "shortName": "2021 (22 Sep Shift 1)", "title": "MHT CET 2021 (22 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260690279619d9d8a2446", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}], "question": {"text": "The equation of circle with centre at $(2,-3)$ and the circumference $10 \\pi$ units is", "image": null}, "options": [{"id": "YznZ6", "text": "$x^2+y^2-4 x+6 y-12=0$", "image": null, "isCorrect": true}, {"id": "mYdXG", "text": "$x^2+y^2-4 x-6 y-12=0$", "image": null, "isCorrect": false}, {"id": "VJy2e", "text": "$x^2+y^2+4 x+6 y+12=0$", "image": null, "isCorrect": false}, {"id": "k1msB", "text": "$x^2+y^2-4 x+6 y+12=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have $2 \\pi r=10 \\pi \\Rightarrow r=5$ and centre of circle is $(2,-3)$ Hence equation of circle is $(x-2)^2+(y+3)^2=(5)^2$ i.e. $x^2+y^2-4 x+6 y-12=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189298", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T14:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 2)", "title": "MHT CET 2021 (21 Sep Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a260550279619d9d8a23a7", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}], "question": {"text": "The equation of the circle whose entre lies on the line $x-4 y=1$ and which passes through the points $(3,7)$ and $(5,5)$ is", "image": null}, "options": [{"id": "X6M2f", "text": "$x^2+y^2+6 x-2 y+90=0$", "image": null, "isCorrect": false}, {"id": "fDYwL", "text": "$x^2+y^2-6 x-2 y-25=0$", "image": null, "isCorrect": false}, {"id": "FaXwU", "text": "$x^2+y^2-6 x+2 y-30=0$", "image": null, "isCorrect": false}, {"id": "nYQ0k", "text": "$x^2+y^2+6 x+2 y-90=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let $(h, k) b$ the centre of the circle. It lies on the line $x-4 y=1$\n$$\n\\begin{aligned}\n& \\Rightarrow \\mathrm{h}=1+4 \\mathrm{k} \\\\\n& \\therefore \\text { centre } \\equiv(4 \\mathrm{k}+1, \\mathrm{k})\n\\end{aligned}\n$$\nCircle passes through points $(3,7)$ and $(5,5)$\n$$\n\\begin{aligned}\n& \\therefore(4 \\mathrm{k}+1-5)^2+(\\mathrm{k}-5)^2=(4 \\mathrm{k}-2)^2+(\\mathrm{k}-7)^2 \\\\\n& \\therefore 16 \\mathrm{k}^2+16-32 \\mathrm{k}+\\mathrm{k}^2+25-10 \\mathrm{k}=16 \\mathrm{k}^2+4-16 \\mathrm{k}+\\mathrm{k}^2+49 \\\\\n& -14 \\mathrm{k}\n\\end{aligned}\n$$\n\n\n\n$$\n\\begin{aligned}\n& \\therefore-42 \\mathrm{k}+41=-30 \\mathrm{k}+53 \\Rightarrow 12 \\mathrm{k}=-12 \\Rightarrow \\mathrm{k}=-1 \\\\\n& \\therefore \\text { centre } \\equiv(-3,-1) \\\\\n& \\therefore \\text { Radius }=\\sqrt{(-3-5)^2+(-1-5)^2}=10\n\\end{aligned}\n$$\nHence equation of required circle is\n$$\n(x+3)^2+(y+1)^2=(10)^2 \\text { i.e. } x^2+y^2+6 x+2 y-90=0\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b87f20917a5f4189297", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-21T09:00:00.000Z", "isVisible": true, "shortName": "2021 (21 Sep Shift 1)", "title": "MHT CET 2021 (21 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2600d0279619d9d8a2158", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}], "question": {"text": "The equation of the circle, the end-points of whose diameter are the centres of the circles $x^{2}+y^{2}-2 x+3 y-3=0$ and $x^{2}+y^{2}+6 x-12 y-5=0$ is", "image": null}, "options": [{"id": "DpHWl", "text": "$2 x^{2}+2 y^{2}+4 x-9 y-24=0$", "image": null, "isCorrect": true}, {"id": "WdMVd", "text": "$2 x^{2}+2 y^{2}+4 x+9 y-24=0$", "image": null, "isCorrect": false}, {"id": "rtAEe", "text": "$2 x^{2}+2 y^{2}+4 x-9 y+24=0$", "image": null, "isCorrect": false}, {"id": "xJALF", "text": "$2 x^{2}+2 y^{2}-4 x-9 y-24=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Since the quadrilateral $A B C D$ is cyclic, we have\n$\\mathrm{A}+\\mathrm{C}=180^{\\circ}$ and $\\mathrm{B}+\\mathrm{D}=180^{\\circ}$\n$\\therefore \\cos \\mathrm{A}=\\cos \\left(180^{\\circ}-\\mathrm{C}\\right) \\quad=-\\cos \\mathrm{C}$\n$\\cos \\mathrm{B}=\\cos \\left(180^{\\circ}-\\mathrm{D}\\right) \\quad=-\\cos \\mathrm{D}$\n$\\therefore \\cos \\mathrm{A}+\\cos \\mathrm{B}+\\cos \\mathrm{C}+\\cos \\mathrm{D}=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f73", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-20T09:00:00.000Z", "isVisible": true, "shortName": "2020 (20 Oct Shift 1)", "title": "MHT CET 2020 (20 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f9a0279619d9d8a1dd2", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}], "question": {"text": "If the radius of a circle $x^{2}+y^{2}-4 x+6 y-k=0$ is 5, then $\\mathrm{k}=$", "image": null}, "options": [{"id": "kiATx", "text": "$-12$", "image": null, "isCorrect": false}, {"id": "vf1fi", "text": "$-25$", "image": null, "isCorrect": false}, {"id": "j0HHX", "text": "$25$", "image": null, "isCorrect": false}, {"id": "JIdzW", "text": "$12$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Given equation of circle is\n$$\n\\begin{array}{l}\nx^{2}+y^{2}-4 x+6 y-k=0 \\\\\nr \\quad=\\sqrt{4+9+k} \\Rightarrow 5=\\sqrt{13+k} \\Rightarrow 13+k=25 \\\\\nk=12\n\\end{array}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6d", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-15T09:00:00.000Z", "isVisible": true, "shortName": "2020 (15 Oct Shift 1)", "title": "MHT CET 2020 (15 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f870279619d9d8a1d33", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}], "question": {"text": "The equation of a circle passing through origin and making $\\mathrm{x}$ -intercept 3 and $\\mathrm{y}$ -\nintercept $-5$ is", "image": null}, "options": [{"id": "GsJGO", "text": "$x^{2}+y^{2}+3 x+5 y=0$", "image": null, "isCorrect": false}, {"id": "ydXjA", "text": "$x^{2}+y^{2}+3 x-5 y=0$", "image": null, "isCorrect": false}, {"id": "k5Qub", "text": "$x^{2}+y^{2}-3 x+5 y=0$", "image": null, "isCorrect": true}, {"id": "TXWoc", "text": "$x^{2}+y^{2}-3 x-5 y=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$\\because A(3,0), B(0,-5)$ be the co-ordinate of ends of diameter AB. By diameter form, equation of circle is\n$$\n\\begin{array}{l}\n(x-3)(x-0)+(y-0)(y+5)=0 \\\\\nx^{2}-3 x+y^{2}+5 y=0 \\Rightarrow x^{2}+y^{2}-3 x+5 y=0\n\\end{array}\n$$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/Cs6sRGGD5cDQvVWQh_gy2WFCS1uOU9DHPpLTvUmTRDU.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-14T14:00:00.000Z", "isVisible": true, "shortName": "2020 (14 Oct Shift 2)", "title": "MHT CET 2020 (14 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f630279619d9d8a1c15", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}], "question": {"text": "The equation of the circle whose end points of a diameter are the centres of the\ncircles $x^{2}+y^{2}+2 x-4 y+1=0$ and $x^{2}+y^{2}-8 x+6 y+17=0$ is", "image": null}, "options": [{"id": "3QeRR", "text": "$x^{2}+y^{2}-3 x-y-10=0$", "image": null, "isCorrect": false}, {"id": "fleCw", "text": "$x^{2}+y^{2}+3 x-y-10=0$", "image": null, "isCorrect": false}, {"id": "0mh3e", "text": "$x^{2}+y^{2}+3 x+y-10=0$", "image": null, "isCorrect": false}, {"id": "p32uh", "text": "$x^{2}+y^{2}-3 x+y-10=0$", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "Let centres of given circles be $A(-1,2)$ and $B(4,-3)$ \nBy diameter form of equation of circle, we write \n$\\begin{array}{l}(x+1)(x-4)+(y-2)(y+3)=0 \\\\ \\therefore x^{2}-4 x+x-4+y^{2}+3 y-2 y-6 \\\\ \\therefore x^{2}+y^{2}-3 x+y-10=0\\end{array}=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d3071b5bb33b3f9f6a", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-13T14:00:00.000Z", "isVisible": true, "shortName": "2020 (13 Oct Shift 2)", "title": "MHT CET 2020 (13 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f3b0279619d9d8a1acc", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}], "question": {"text": "If A $(3,-2,2), \\mathrm{B}(2, \\lambda+1,5)$ are the end points of the diameter of the circle and if\nthe point $(5,6,-1)$ lies on the circle, then $\\lambda=$", "image": null}, "options": [{"id": "6GGvo", "text": "6", "image": null, "isCorrect": false}, {"id": "MuFUW", "text": "8", "image": null, "isCorrect": true}, {"id": "RKa40", "text": "7", "image": null, "isCorrect": false}, {"id": "rth9s", "text": "5", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The angle subtended at the point $\\mathrm{P}$ in the semicircle APB is a right angle. AP $\\perp P B$\nNow direction ratios of AP are $(5-3,6+2,-1-2)$ i.e. $(2,8,-3)$\nNow direction ratios of PB are $(2-5, \\lambda+1-6,5+1)$ i.e. $(-3, \\lambda-5,6)$\nSince AP $\\perp P B$, we write\n(2) $(-3)+8(\\lambda-5)-3(6)=0 \\Rightarrow-6+8 \\lambda-40-18=0 \\Rightarrow \\lambda=8$\n<img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/85vJG-4sWcjRYZb_dK36eLyUUnNhymhKsu2uHwLPJvQ.original.fullsize.png\">", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f68", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T14:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 2)", "title": "MHT CET 2020 (12 Oct Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f280279619d9d8a1a36", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}], "question": {"text": "If $\\theta$ is a parameter, then the parametric equations of the circle\n$x^{2}+y^{2}-6 x+4 y-3=0$ are given by", "image": null}, "options": [{"id": "du69J", "text": "$x=-3+4 \\sin \\theta$ and $y=-2+4 \\cos \\theta$", "image": null, "isCorrect": false}, {"id": "mPgsZ", "text": "$x=3+4 \\cos \\theta$ and $y=-2+4 \\sin \\theta$", "image": null, "isCorrect": true}, {"id": "Pe3Hp", "text": "$x=3+4 \\sin \\theta$ and $y=2+4 \\cos \\theta$", "image": null, "isCorrect": false}, {"id": "5kQAA", "text": "$x=3+4 \\cos \\theta$ and $y=2+4 \\sin \\theta$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Given equation of circle is\n$\\begin{aligned}\n& x^{2}+y^{2}-6 x+4 y-3=0 \\\\\n\\therefore &\\left(x^{2}-6 x+9\\right)-9+\\left(y^{2}+4 y+4\\right)-4-3=0 \\\\\n\\therefore &(x-3)^{2}+(y+2)^{2}=16\n\\end{aligned}$\nComparing with, $(x-h)^{2}+(y-k)^{2}=r^{2}$, we get $h=3, k=-2, r=4$\nParametric form is\n$\\begin{aligned} x &=h+r \\cos \\theta & \\text { and } & y &=k+r \\sin \\theta \\\\ x &=3+4 \\cos \\theta & \\text { and } & y &=-2+4 \\sin \\theta \\end{aligned}$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f67", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2020-10-12T09:00:00.000Z", "isVisible": true, "shortName": "2020 (12 Oct Shift 1)", "title": "MHT CET 2020 (12 Oct Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25f180279619d9d8a19bd", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}], "question": {"text": "The intercept on the line y = x by the circle <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>=</mo><mn>0</mn></math> is <math><mi>A</mi><mi>B</mi></math> . The equation of the circle with <math><mi>A</mi><mi>B</mi><mi></mi></math> as a diameter is ……", "image": null}, "options": [{"id": "f0b8O", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "ZcFb1", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi>x</mi><mo>-</mo><mi>y</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": true}, {"id": "xGsyO", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>3</mn><mi>x</mi><mo>+</mo><mi>y</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}, {"id": "Fif6q", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>-</mo><mi>y</mi><mo>=</mo><mn>0</mn></math>", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have equation of line y = x and equation of circle <math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>=</mo><mn>0</mn></math>  <br/><img src=\"https://cdn-question-pool.getmarks.app/pyq/mht_cet/93577b6b-d7af-4685-b992-85f11734be06.png\"> <br/>Now, intersecting points of given line and circle <br/><math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>=</mo><mn>0</mn></math>  <br/><math><mo>&#8658;</mo><mn>2</mn><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mi>x</mi><mo>=</mo><mn>0</mn></math>  <br/><math><mo>&#8658;</mo><mn>2</mn><mi>x</mi><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math>  <br/><math><mo>&#8658;</mo><mi>x</mi><mo>=</mo><mn>0,1</mn></math>  <br/>When x = 0 then y =0 when x =1 then y = 1 <br/><math><mo>∴</mo></math> Coordinates of end points of diameter AB are (0, 0) and (1, 1) <br/><math><mo>∴</mo></math> Required equation of circle with diameter AB <br/><math><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>0</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mi>x</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>+</mo><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>0</mn></mrow></mfenced><mfenced separators=\"|\"><mrow><mi>y</mi><mo>-</mo><mn>1</mn></mrow></mfenced><mo>=</mo><mn>0</mn></math>  <br/><math><mo>&#8658;</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mn>2</mn><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi>y</mi><mo>=</mo><mn>0</mn></math>  <br/><math><mo>&#8658;</mo><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><mi>x</mi><mo>-</mo><mi>y</mi><mo>=</mo><mn>0</mn></math>", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078d1071b5bb33b3f9f65", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2019-04-30T14:00:00.000Z", "isVisible": true, "shortName": "2019 (Shift 2)", "title": "MHT CET 2019 (Shift 2)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25edd0279619d9d8a17ea", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cf071b5bb33b3f9f63", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2018-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2018", "title": "MHT CET 2018"}], "question": {"text": "The sides of a rectangle are given by <math><mi>x</mi><mo>=</mo><mo>±</mo><mi>a</mi></math> and <math><mi>y</mi><mo>=</mo><mo>±</mo><mi>b</mi></math> . Then equation of the circle passing through the vertices of the rectangle is", "image": null}, "options": [{"id": "LzQ1K", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "zlOlv", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>+</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": true}, {"id": "KiK2O", "text": "<math><msup><mrow><mi>x</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>y</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>=</mo><msup><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></msup><mo>-</mo><msup><mrow><mi>b</mi></mrow><mrow><mn>2</mn></mrow></msup></math>", "image": null, "isCorrect": false}, {"id": "i7Z7d", "text": " ionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}], "question": {"text": "The equation of a circle which has a tangent $3 x+4 y=6$ and two normals given by $(x-1)(y-2)=0$ is", "image": null}, "options": [{"id": "UVea1", "text": "$(x-3)^{2}+(y-4)^{2}=5^{2}$", "image": null, "isCorrect": false}, {"id": "o6w1R", "text": "$x^{2}+y^{2}-4 x-2 y+4=0$", "image": null, "isCorrect": false}, {"id": "xW6FN", "text": "$x^{2}+y^{2}-2 x-4 y+4=0$", "image": null, "isCorrect": true}, {"id": "Pxx1j", "text": "$x^{2}+y^{2}-2 x-4 y+5=0$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "$(x-1)(y-2)=0$\n$$\n\\begin{array}{ll}\n\\Rightarrow \\quad x-1=0 \\text { and } y-2=0 \\\\\n\\therefore \\quad \\text { Radius }=\\frac{3(1)+4(2)-6}{\\sqrt{9+16}} \\\\\n=\\frac{5}{5}=1\n\\end{array}\n$$\n$\\therefore$ Equation of the circle is\n$$\n(x-1)^{2}+(y-2)^{2}=1\n$$\nor $\\quad x^{2}+y^{2}-2 x-4 y+4=0$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5f", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2011-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2011", "title": "MHT CET 2011"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e5c0279619d9d8a13cb", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}], "question": {"text": "If one end of the diameter is $(1,1)$ and the other end lies on the line $x+y=3$, then locus of centre of circle is", "image": null}, "options": [{"id": "xwINb", "text": "$x+y=1$", "image": null, "isCorrect": false}, {"id": "YOnuG", "text": "$2(x-y)=5$", "image": null, "isCorrect": false}, {"id": "Cidd8", "text": "$2 x+2 y=5$", "image": null, "isCorrect": true}, {"id": "h0sA3", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the other end be $(t, 3-t)$. \nSo, the equation of the variable circle is\n$$\n\\begin{array}{l}\n(x-1)(x-t)+(y-1)(y-3+t)=0 \\\\\n\\Rightarrow x^{2}+y^{2}-(1+t) x-(4-t) y+3=0\n\\end{array}\n$$\n$\\therefore$ The centre $(\\alpha, \\beta)$ is given by\n$$\n\\alpha=\\frac{1+t}{2}, \\beta=\\frac{4-t}{2}\n$$\n$$\n\\Rightarrow \\quad 2 \\alpha+2 \\beta=5\n$$\nHence, the locus is $2 x+2 y=5$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f5c", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2008-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2008", "title": "MHT CET 2008"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e480279619d9d8a132e", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "If the points $(2,0),(0,1),(4,5)$ and $(0, c)$ are concyclic, then the value of $c$ is", "image": null}, "options": [{"id": "yrPxZ", "text": "1", "image": null, "isCorrect": false}, {"id": "H5rT3", "text": "$\\frac{14}{3}$", "image": null, "isCorrect": true}, {"id": "gbpCU", "text": "5", "image": null, "isCorrect": false}, {"id": "VXKOt", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the circle passing through $(2,0),(0,1)$ and $(4,5)$ is\n$$\n3\\left(x^{2}+y^{2}\\right)-13 x-17 y+14=0\n$$\nThis passes through $(0, c)$.\n$$\n\\begin{array}{l}\n\\therefore 3 c^{2}-17 c+14=0 \\\\\n\\Rightarrow \\quad c=1, \\frac{14}{3}\n\\end{array}\n$$\nSince, $c=1$ is already there, for point $(0,1)$. Therefore, we take $c=\\frac{14}{3}$.", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e460279619d9d8a1322", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "The area of the circle centred at $(1,2)$ and passing through $(4,6)$, is", "image": null}, "options": [{"id": "y05wT", "text": "$5 \\pi$ sq unit", "image": null, "isCorrect": false}, {"id": "zKGjA", "text": "$10 \\pi$ sq unit", "image": null, "isCorrect": false}, {"id": "T5k81", "text": "$25 \\pi$ sq unit", "image": null, "isCorrect": true}, {"id": "tPoIV", "text": "None of these", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of a circle centred at $(1,2)$ and passing through $(4,6)$ is\n$$\n\\begin{array}{l}\n(x-1)^{2}+(y-2)^{2}=(4-1)^{2}+(6-2)^{2} \\\\\n\\Rightarrow x^{2}+y^{2}-2 x-4 y+1+4=9+16 \\\\\n\\Rightarrow \\quad x^{2}+y^{2}-2 x-4 y-20=0\n\\end{array}\n$$\nNow, radius\n$$\n=\\sqrt{(-1)^{2}+(-2)^{2}+20}\n$$\n$$\n=\\sqrt{1+4+20}=5\n$$\n$\\therefore \\quad$ Area of circle $=\\pi r^{2}$\n$=25 \\pi$ sq unit", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 3, "topicId": "6abb890015a9fc0fc8c14798", "title": "Director Circle", "totalQuestions": 1, "questions": [{"_id": "6abb884515a9fc0fc8c1421f", "type": "singleCorrect", "question": {"text": "The equation of the director circle of the circle $x^2 + y^2 + 3x - 8y - 3 = 0$ is:", "image": null}, "options": [{"id": "anh7o", "label": "A", "text": "$4x^2 + 4y^2 + 12x - 32y - 12 = 0$", "isCorrect": false, "image": null}, {"id": "3kTMH", "label": "B", "text": "$4x^2 + 4y^2 + 12x - 32y - 97 = 0$", "isCorrect": true, "image": null}, {"id": "FHkVR", "label": "C", "text": "$x^2 + y^2 + 12x - 32y - \\dfrac{97}{4} = 0$", "isCorrect": false, "image": null}, {"id": "E2WFW", "label": "D", "text": "$x^2 + y^2 + 3x - 8y - 12 = 0$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given circle is $x^2 + y^2 + 3x - 8y - 3 = 0$.<br><br>The center of the circle is $\\left(-\\dfrac{3}{2}, 4\\right)$ and its radius is $r = \\sqrt{\\left(\\dfrac{3}{2}\\right)^2 + (-4)^2 - (-3)} = \\sqrt{\\dfrac{9}{4} + 19} = \\sqrt{\\dfrac{85}{4}}$.<br><br>The director circle of a given circle is concentric with it and has a radius equal to $\\sqrt{2}$ times the radius of the given circle.<br><br>Radius of the director circle, $R = \\sqrt{2}r = \\sqrt{2} \\times \\sqrt{\\dfrac{85}{4}} = \\sqrt{\\dfrac{85}{2}}$.<br><br>The equation of the director circle is $\\left(x + \\dfrac{3}{2}\\right)^2 + (y - 4)^2 = R^2$<br><br>$x^2 + 3x + \\dfrac{9}{4} + y^2 - 8y + 16 = \\dfrac{85}{2}$<br><br>$x^2 + y^2 + 3x - 8y + \\dfrac{73}{4} - \\dfrac{170}{4} = 0$<br><br>$x^2 + y^2 + 3x - 8y - \\dfrac{97}{4} = 0$<br><br>$4x^2 + 4y^2 + 12x - 32y - 97 = 0$<br><br>Answer: $4x^2 + 4y^2 + 12x - 32y - 97 = 0$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996d", "title": "MHT CET 2026 (19 May Shift 1)", "shortName": "2026 (19 May Shift 1)", "isVisible": true, "heldOn": "2026-05-19T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 4, "topicId": "65a263390279619d9d8a3d2e", "title": "Position of point", "totalQuestions": 5, "questions": [{"_id": "6abb885915a9fc0fc8c142d7", "type": "singleCorrect", "question": {"text": "The coordinates of the point on the curve $x^2 + y^2 = 8$ which are nearest to the point $(2, 0)$ are:", "image": null}, "options": [{"id": "AX60L", "label": "A", "text": "$(2,\\,2)$", "isCorrect": false, "image": null}, {"id": "JNsvm", "label": "B", "text": "$(\\sqrt{2},\\,\\sqrt{6})$", "isCorrect": false, "image": null}, {"id": "eFBc9", "label": "C", "text": "$(2\\sqrt{2},\\,0)$", "isCorrect": true, "image": null}, {"id": "u7JKg", "label": "D", "text": "$(\\sqrt{6},\\,\\sqrt{2})$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the point on the curve be $(x, y)$.<br><br>The square of the distance from $(x, y)$ to $(2, 0)$ is given by $D = (x - 2)^2 + y^2$.<br><br>Since the point lies on the curve $x^2 + y^2 = 8$, we can substitute $y^2 = 8 - x^2$ into the distance equation.<br><br>$D = (x - 2)^2 + 8 - x^2$<br><br>$D = x^2 - 4x + 4 + 8 - x^2$<br><br>$D = 12 - 4x$<br><br>To find the nearest point, we need to minimize the distance $D$. This requires maximizing the value of $x$.<br><br>For the circle $x^2 + y^2 = 8$, the maximum possible value of $x$ is the radius of the circle, which is $\\sqrt{8} = 2\\sqrt{2}$.<br><br>Substituting $x = 2\\sqrt{2}$ into the equation of the curve, we get $y^2 = 8 - (2\\sqrt{2})^2 = 0$, which gives $y = 0$.<br><br>Thus, the coordinates of the nearest point are $(2\\sqrt{2}, 0)$.<br><br>Answer: $(2\\sqrt{2},\\,0)$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996c", "title": "MHT CET 2026 (15 May Shift 2)", "shortName": "2026 (15 May Shift 2)", "isVisible": true, "heldOn": "2026-05-15T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bd1bf9280d7f9932caf", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The least distance of the point $A(10,7)$ from the circle $x^2+\\mathrm{y}^2-4 x-2 \\mathrm{y}-20=0$ is length of seg. AM . If $\\mathrm{MM}^{\\prime}$ is the diameter of the circle, then the lengths of AM and $\\mathrm{AM}^{\\prime}$ are respectively _______ , ______ units", "image": null}, "options": [{"id": "UhTqE", "text": "5,10", "image": null, "isCorrect": false}, {"id": "6rtUK", "text": "4,15", "image": null, "isCorrect": false}, {"id": "CmOyx", "text": "5,15", "image": null, "isCorrect": true}, {"id": "dSfao", "text": "2,10", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the given circle is $x^2+y^2-4x-2y-20=0$.<br><br>Comparing with the standard equation $x^2+y^2+2gx+2fy+c=0$, we get $g = -2$, $f = -1$, and $c = -20$.<br><br>The center of the circle is $C(-g, -f) \\equiv (2, 1)$.<br><br>The radius of the circle is $r = \\sqrt{g^2+f^2-c} = \\sqrt{(-2)^2+(-1)^2-(-20)} = \\sqrt{4+1+20} = 5$.<br><br>The distance of point $A(10, 7)$ from the center $C(2, 1)$ is given by:<br><br>$AC = \\sqrt{(10-2)^2 + (7-1)^2} = \\sqrt{8^2 + 6^2} = \\sqrt{64+36} = 10$<br><br>Since $AC > r$, the point $A$ lies outside the circle.<br><br>The least distance of point $A$ from the circle is $AM = AC - r = 10 - 5 = 5$.<br><br>The greatest distance of point $A$ from the circle is $AM' = AC + r = 10 + 5 = 15$.<br><br>Therefore, the lengths of $AM$ and $AM'$ are $5$ and $15$ units respectively.<br><br>Answer: 5,15", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7a", "heldOn": "2025-04-26T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 1)", "title": "MHT CET 2025 (26 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871b51bf9280d7f9932828", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The minimum distance and maximum distance of the point $\\mathrm{P}(2,-7)$ from the circle $x^2+y^2-14 x-10 y-151=0$ are respectively _______ units", "image": null}, "options": [{"id": "Eere8", "text": "2,28", "image": null, "isCorrect": true}, {"id": "EMYEr", "text": "5,25", "image": null, "isCorrect": false}, {"id": "biHlP", "text": "6,24", "image": null, "isCorrect": false}, {"id": "MgR4j", "text": "3,27", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given equation of the circle is $x^2+y^2-14x-10y-151=0$.<br><br>Comparing with the standard equation $x^2+y^2+2gx+2fy+c=0$, we get $2g = -14 \\Rightarrow g = -7$ and $2f = -10 \\Rightarrow f = -5$.<br><br>The center of the circle is $C(-g, -f) \\equiv (7, 5)$.<br><br>The radius of the circle is $r = \\sqrt{g^2+f^2-c} = \\sqrt{(-7)^2+(-5)^2-(-151)} = \\sqrt{49+25+151} = \\sqrt{225} = 15$.<br><br>The distance of the point $P(2, -7)$ from the center $C(7, 5)$ is $d = \\sqrt{(7-2)^2 + (5-(-7))^2} = \\sqrt{5^2 + 12^2} = \\sqrt{25+144} = 13$.<br><br>Since $d < r$, the point $P$ lies inside the circle.<br><br>The minimum distance of the point $P$ from the circle is $|r - d| = |15 - 13| = 2$ units.<br><br>The maximum distance of the point $P$ from the circle is $r + d = 15 + 13 = 28$ units.<br><br>Answer: 2,28", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376de9b67616acec78f72", "heldOn": "2025-04-21T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (21 Apr Shift 1)", "title": "MHT CET 2025 (21 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "679213300aee93fa0796d6d2", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}], "question": {"text": "If $\\left(\\mathrm{m}_{\\mathrm{i}}, \\dfrac{1}{\\mathrm{~m}_{\\mathrm{i}}}\\right), \\mathrm{m}_{\\mathrm{i}}\\gt0, \\mathrm{i}=1,2,3,4$ are four distinct points on a circle, then the product $\\mathrm{m}_1 \\mathrm{~m}_2 \\mathrm{~m}_3 \\mathrm{~m}_4$ is equal to", "image": null}, "options": [{"id": "Zq8pm", "text": "-1", "image": null, "isCorrect": false}, {"id": "egkJv", "text": "1", "image": null, "isCorrect": true}, {"id": "bUfxG", "text": "0", "image": null, "isCorrect": false}, {"id": "nJITY", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Let the equation of the circle be $x^2 + y^2 + 2gx + 2fy + c = 0$.<br><br>Since the points $\\left(m_i, \\dfrac{1}{m_i}\\right)$ lie on the circle, substituting $x = m$ and $y = \\dfrac{1}{m}$ gives:<br><br>$m^2 + \\dfrac{1}{m^2} + 2gm + 2f\\left(\\dfrac{1}{m}\\right) + c = 0$<br><br>Multiplying the entire equation by $m^2$, we get:<br><br>$m^4 + 1 + 2gm^3 + 2fm + cm^2 = 0$<br><br>Rearranging the terms in descending powers of $m$:<br><br>$m^4 + 2gm^3 + cm^2 + 2fm + 1 = 0$<br><br>This is a polynomial equation of degree 4 in $m$. Since the four points are distinct, $m_1, m_2, m_3, m_4$ are the four roots of this equation.<br><br>By the theory of equations, the product of the roots of a polynomial $am^4 + bm^3 + cm^2 + dm + e = 0$ is given by $\\dfrac{e}{a}$.<br><br>Therefore, the product of the roots is $m_1 m_2 m_3 m_4 = \\dfrac{1}{1} = 1$.<br><br>Answer: 1", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "67920e139a8109c6c5665cc2", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2024-05-02T09:00:00.000Z", "isVisible": true, "shortName": "2024 (02 May Shift 1)", "title": "MHT CET 2024 (02 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25ea80279619d9d8a163b", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}], "question": {"text": "If $(3, \\lambda \\lambda \\lambda \\lambda)$ and $(5,6)$ are the conjugate points to the curve $x^{2}+y^{2}=3$, then $\\lambda \\lambda \\lambda \\lambda$ is", "image": null}, "options": [{"id": "8qa43", "text": "$-1$", "image": null, "isCorrect": false}, {"id": "sfuHP", "text": "1", "image": null, "isCorrect": false}, {"id": "tU0YV", "text": "$-2$", "image": null, "isCorrect": true}, {"id": "sjIGy", "text": "2", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "If the $(3, \\lambda \\lambda \\lambda \\lambda)$ and $(5,6)$ are the conjugate points to the curve $x^{2}+y^{2}=3$, then\n$\\begin{aligned} x_{1} x_{2}+y_{1} y_{2} &=3 \\\\ \\Rightarrow \\quad(3)(5)+(\\lambda \\lambda \\lambda \\lambda) \\cdot(6) &=3 \\end{aligned}$\n$\\Rightarrow \\quad 15+6(\\lambda \\lambda \\lambda \\lambda)=3$\n$\\Rightarrow 6(\\lambda \\lambda \\lambda \\lambda)=-12$\n$\\Rightarrow \\lambda \\lambda \\lambda \\lambda=-2$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078cd071b5bb33b3f9f60", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2012-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2012", "title": "MHT CET 2012"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 5, "topicId": "65a263380279619d9d8a3d29", "title": "line and circle", "totalQuestions": 4, "questions": [{"_id": "6a44d2d78c30a4553e1bdd5d", "type": "singleCorrect", "question": {"text": "Line $l : x + y = 4$ intersects the circle $x^2 + y^2 - 2x - 2y = 2$ at points $A$ and $B$. If C is the center of the circle, then the area of $\\triangle ABC$ is...", "image": null}, "options": [{"id": "pafC8", "label": "A", "text": "$\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "hwABX", "label": "B", "text": "$2$", "isCorrect": true, "image": null}, {"id": "l6EFS", "label": "C", "text": "$2\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "ob3q2", "label": "D", "text": "$4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Equation of the circle is $x^2 + y^2 - 2x - 2y = 2$, which can be written as $(x-1)^2 + (y-1)^2 = 4$.<br><br>Center of the circle is $C(1, 1)$ and radius is $R = 2$.<br><br>The perpendicular distance $d$ from the center $C(1, 1)$ to the line $x + y - 4 = 0$ is given by $d = \\dfrac{|1 + 1 - 4|}{\\sqrt{1^2 + 1^2}} = \\sqrt{2}$.<br><br>The length of the chord $AB$ is $2\\sqrt{R^2 - d^2} = 2\\sqrt{2^2 - (\\sqrt{2})^2} = 2\\sqrt{2}$.<br><br>The area of $\\triangle ABC$ is $\\dfrac{1}{2} \\times AB \\times d = \\dfrac{1}{2} \\times 2\\sqrt{2} \\times \\sqrt{2} = 2$.<br><br>Answer: $2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a75", "title": "MHT CET 2026 (16 April Shift 2)", "shortName": "2026 (16 April Shift 2)", "isVisible": true, "heldOn": "2026-04-16T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a262710279619d9d8a3493", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}], "question": {"text": "If the line $x-2 y=\\mathrm{m}(\\mathrm{m} \\in \\mathrm{Z})$ intersects the circle $x^2+y^2=2 x+4 y$ at two distinct points, then the number of possible values of $\\mathrm{m}$ are", "image": null}, "options": [{"id": "cqbCT", "text": "$8$", "image": null, "isCorrect": false}, {"id": "S69Jy", "text": "$9$", "image": null, "isCorrect": true}, {"id": "rEPuG", "text": "$10$", "image": null, "isCorrect": false}, {"id": "4xPzT", "text": "$11$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "Centre of circle is $(1,2)$ and radius $=\\sqrt{1+4-0}=\\sqrt{5}$\n\nSince the line intersects the circle at two points, length of perpendicular from the centre $ < $ radius\n$$\n\\begin{aligned}\n& \\Rightarrow\\left|\\frac{1-2(2)-m}{\\sqrt{1+4}}\\right| < \\sqrt{5} \\\\\n& \\Rightarrow|\\mathrm{m}+3| < 5 \\\\\n& \\Rightarrow-5 < \\mathrm{m}+3 < 5 \\\\\n& \\Rightarrow-8 < \\mathrm{m} < 2\n\\end{aligned}\n$$\n$\\therefore \\quad$ The number of possible values of $\\mathrm{m}=9$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b89f20917a5f41892b4", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2023-05-14T09:00:00.000Z", "isVisible": true, "shortName": "2023 (14 May Shift 1)", "title": "MHT CET 2023 (14 May Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a2602f0279619d9d8a2270", "type": "singleCorrect", "level": 1, "questionLabels": [], "previousYearPapers": [{"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}], "question": {"text": "If the lines $3 x-4 y+4=0$ and $6 x-8 y-7=0$ are tangent to circle, then the radius of the circle is", "image": null}, "options": [{"id": "bAkb7", "text": "$\\frac{7}{4}$ units", "image": null, "isCorrect": false}, {"id": "axt5i", "text": "$\\frac{3}{4}$ units", "image": null, "isCorrect": true}, {"id": "2Hfly", "text": "$\\frac{4}{3}$ units", "image": null, "isCorrect": false}, {"id": "CbUMf", "text": "$\\frac{1}{4}$ units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "We have, $3 x-4 y+4=0$\nand $6 x-8 y-7=0 \\Rightarrow 3 x-4 y-\\frac{7}{2}=0$\nLines (1) and (2) are parallel to one another and these lines are tangents to the circle.\n$\\therefore$ Distance between the lines is equal to diameter of circle.\n$$\n\\therefore \\mathrm{D}=\\frac{\\left|4-\\left(\\frac{-7}{2}\\right)\\right|}{\\sqrt{(3)^2+(-4)^2}}=\\frac{\\left(4+\\frac{7}{2}\\right)}{\\sqrt{25}}=\\frac{15}{2(5)}=\\frac{3}{2} \\Rightarrow \\text { radius }=\\frac{3}{4} \\text { units }\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "65a25b86f20917a5f4189295", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2021-09-20T09:00:00.000Z", "isVisible": true, "shortName": "2021 (20 Sep Shift 1)", "title": "MHT CET 2021 (20 Sep Shift 1)"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "65a25e480279619d9d8a132d", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}], "question": {"text": "A line is drawn through a fixed point $P(\\alpha, \\beta)$ to cut the circle $x^{2}+y^{2}=r^{2}$ at $A$ and $B$. Then\n$P A \\cdot P B$ is equal to", "image": null}, "options": [{"id": "GESfD", "text": "$(\\alpha+\\beta)^{2}-r^{2}$", "image": null, "isCorrect": false}, {"id": "shFQ3", "text": "$\\alpha^{2}+\\beta^{2}-r^{2}$", "image": null, "isCorrect": true}, {"id": "WL3QT", "text": "$(\\alpha-\\beta)^{2}+r^{2}$", "image": null, "isCorrect": false}, {"id": "pNtHA", "text": "None of the above", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of any line through the point $P(\\alpha, \\beta)$ is\n$$\n\\frac{x-\\alpha}{\\cos \\theta}=\\frac{y-\\beta}{\\sin \\theta}=k \\text { (say) }\n$$\nAny point on this line is\n$$\n(\\alpha+k \\cos \\theta, \\beta+k \\sin \\theta)\n$$\nThis point lies on the given circle, if\n$$\n(\\alpha+k \\cos \\theta)^{2}+(\\beta+k \\sin \\theta)^{2}=r^{2}\n$$\nor $k^{2}+2 k(\\alpha \\cos \\theta+\\beta \\sin \\theta)$\n$$\n+\\alpha^{2}+\\beta^{2}-r^{2}=0\n$$\nWhich being quadratic in $k$, gives two values of $k$. Let $P A=k_{1}, P B=k_{2}$, where $k_{1}, k_{2}$ are the roots of Eq. (i), then\n$$\nP A \\cdot P B=k_{1} k_{2}=\\alpha^{2}+\\beta^{2}-r^{2}\n$$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "61c078c7071b5bb33b3f9f5b", "examId": "615d7745c52ffa3c944600e5", "heldOn": "2007-04-30T09:00:00.000Z", "isVisible": true, "shortName": "2007", "title": "MHT CET 2007"}, "evalStatus": "notAttempted", "lastPracticed": null}]}, {"index": 6, "topicId": "65a263380279619d9d8a3d2a", "title": "Tangent to circle", "totalQuestions": 29, "questions": [{"_id": "6abb88d515a9fc0fc8c14765", "type": "singleCorrect", "question": {"text": "If the length of the tangent segment from the point $(8, -3)$ to the circle $x^2 + y^2 - 2x + ky - 23 = 0$ is $\\sqrt{10}$, then the value of $k$ is", "image": null}, "options": [{"id": "dT3MM", "label": "A", "text": "$10$", "isCorrect": false, "image": null}, {"id": "AQgUV", "label": "B", "text": "$8$", "isCorrect": true, "image": null}, {"id": "P1QkT", "label": "C", "text": "$24$", "isCorrect": false, "image": null}, {"id": "t8WeH", "label": "D", "text": "$34$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The length of the tangent from a point $(x_1, y_1)$ to the circle $S = 0$ is given by $\\sqrt{S_1}$.<br><br>Given the point $(8, -3)$ and the circle $S \\equiv x^2 + y^2 - 2x + ky - 23 = 0$.<br><br>Substituting the point into the circle's equation to find $S_1$:<br><br>$S_1 = (8)^2 + (-3)^2 - 2(8) + k(-3) - 23$<br><br>$S_1 = 64 + 9 - 16 - 3k - 23$<br><br>$S_1 = 34 - 3k$<br><br>The length of the tangent is given as $\\sqrt{10}$.<br><br>$\\sqrt{34 - 3k} = \\sqrt{10}$<br><br>Squaring both sides:<br><br>$34 - 3k = 10$<br><br>$3k = 24$<br><br>$k = 8$<br><br>Answer: $8$", "image": null}, "level": 1, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87f02fe711bb1be9996f", "title": "MHT CET 2026 (20 May Shift 1)", "shortName": "2026 (20 May Shift 1)", "isVisible": true, "heldOn": "2026-05-20T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb889515a9fc0fc8c1450d", "type": "singleCorrect", "question": {"text": "If the tangent to the circle $x^2 + y^2 = 5$ at point $(1, -2)$ also touches the circle $x^2 + y^2 - 8x + 6y + k = 0$, then $\\dfrac{k}{5} = \\cdots\\cdots\\cdots$", "image": null}, "options": [{"id": "iMjZY", "label": "A", "text": "$20$", "isCorrect": false, "image": null}, {"id": "UIUx3", "label": "B", "text": "$4$", "isCorrect": true, "image": null}, {"id": "xzruV", "label": "C", "text": "$5$", "isCorrect": false, "image": null}, {"id": "FLbWT", "label": "D", "text": "$\\dfrac{19}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of the tangent to the circle $x^2 + y^2 = 5$ at the point $(1, -2)$ is given by $T = 0$:<br><br>$x(1) + y(-2) = 5 \\Rightarrow x - 2y - 5 = 0$<br><br>This line also touches the second circle $x^2 + y^2 - 8x + 6y + k = 0$.<br><br>The center of the second circle is $(4, -3)$ and its radius is $r = \\sqrt{4^2 + (-3)^2 - k} = \\sqrt{25 - k}$.<br><br>For the line to be a tangent to the second circle, the perpendicular distance from the center $(4, -3)$ to the line $x - 2y - 5 = 0$ must be equal to the radius of the circle.<br><br>$\\dfrac{|4 - 2(-3) - 5|}{\\sqrt{1^2 + (-2)^2}} = \\sqrt{25 - k}$<br><br>$\\dfrac{|4 + 6 - 5|}{\\sqrt{5}} = \\sqrt{25 - k}$<br><br>$\\dfrac{5}{\\sqrt{5}} = \\sqrt{25 - k}$<br><br>$\\sqrt{5} = \\sqrt{25 - k}$<br><br>Squaring both sides, we get:<br><br>$5 = 25 - k \\Rightarrow k = 20$<br><br>Therefore, $\\dfrac{k}{5} = \\dfrac{20}{5} = 4$.<br><br>Answer: $4$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99968", "title": "MHT CET 2026 (13 May Shift 2)", "shortName": "2026 (13 May Shift 2)", "isVisible": true, "heldOn": "2026-05-13T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6abb88c415a9fc0fc8c146cf", "type": "singleCorrect", "question": {"text": "The length of the tangent segment drawn from point $P$ to the circle, $x^2 + y^2 - 2x - 2y - 2 = 0$ is $4\\sqrt{2}$ units. If $\\lambda_{max}$ and $\\lambda_{min}$ are the maximum and minimum distances of point $P$ from the circle, then $\\lambda_{max} + \\lambda_{min}$ is equal to....", "image": null}, "options": [{"id": "xE6ki", "label": "A", "text": "$6$", "isCorrect": false, "image": null}, {"id": "SKQzv", "label": "B", "text": "$8$", "isCorrect": false, "image": null}, {"id": "USrr0", "label": "C", "text": "$12$", "isCorrect": true, "image": null}, {"id": "OJ87e", "label": "D", "text": "$16$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of the circle is $x^2 + y^2 - 2x - 2y - 2 = 0$<br><br>The center of the circle is $C(1, 1)$ and its radius is $r = \\sqrt{1^2 + 1^2 - (-2)} = 2$<br><br>Let $d$ be the distance of point $P$ from the center $C$. The length of the tangent $L$ from $P$ to the circle is given by $L = \\sqrt{d^2 - r^2}$<br><br>Given $L = 4\\sqrt{2}$, we have $(4\\sqrt{2})^2 = d^2 - 2^2$<br><br>$32 = d^2 - 4 \\Rightarrow d^2 = 36 \\Rightarrow d = 6$<br><br>The maximum distance of point $P$ from the circle is $\\lambda_{max} = d + r$<br><br>The minimum distance of point $P$ from the circle is $\\lambda_{min} = d - r$<br><br>Therefore, $\\lambda_{max} + \\lambda_{min} = (d + r) + (d - r) = 2d$<br><br>$\\lambda_{max} + \\lambda_{min} = 2(6) = 12$<br><br>Answer: $12$", "image": null}, "level": 2, "videoSolution": null, "previousYearPapers": [{"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "questionLabels": [], "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6abb87ef2fe711bb1be99966", "title": "MHT CET 2026 (12 May Shift 2)", "shortName": "2026 (12 May Shift 2)", "isVisible": true, "heldOn": "2026-05-12T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3128c30a4553e1bdfd7", "type": "singleCorrect", "question": {"text": "Let PA and PB be the tangent segments drawn from point P$(6, 8)$ to the circle with the centre at origin O. The radius of circle for which the area of quadrilateral PAOB is maximum, is...", "image": null}, "options": [{"id": "No3AJ", "label": "A", "text": "$5$", "isCorrect": false, "image": null}, {"id": "G7Tmg", "label": "B", "text": "$5\\sqrt{2}$", "isCorrect": true, "image": null}, {"id": "RIp5u", "label": "C", "text": "$\\dfrac{5}{\\sqrt{2}}$", "isCorrect": false, "image": null}, {"id": "37H2W", "label": "D", "text": "$\\dfrac{5}{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "Let the radius of the circle be $r$.<br><br>The centre of the circle is $O(0, 0)$ and the external point is $P(6, 8)$.<br><br>The distance between $O$ and $P$ is:<br><br>$OP = \\sqrt{(6-0)^2 + (8-0)^2} = \\sqrt{36 + 64} = \\sqrt{100} = 10$<br><br>The length of the tangent segments $PA$ and $PB$ from $P$ to the circle is:<br><br>$PA = PB = \\sqrt{OP^2 - r^2} = \\sqrt{100 - r^2}$<br><br>The quadrilateral $PAOB$ consists of two congruent right-angled triangles, $\\triangle OAP$ and $\\triangle OBP$.<br><br>The area of the quadrilateral $PAOB$ is:<br><br>$A = 2 \\times \\text{Area of } \\triangle OAP = 2 \\times \\left( \\dfrac{1}{2} \\times OA \\times PA \\right) = r \\sqrt{100 - r^2}$<br><br>To maximize the area $A$, we can maximize its square, $A^2$:<br><br>$f(r) = A^2 = r^2 (100 - r^2) = 100r^2 - r^4$<br><br>Differentiating $f(r)$ with respect to $r$:<br><br>$f'(r) = 200r - 4r^3$<br><br>Setting the derivative to zero for maximum/minimum:<br><br>$200r - 4r^3 = 0$<br><br>$4r(50 - r^2) = 0$<br><br>Since $r > 0$, we have $50 - r^2 = 0 \\Rightarrow r^2 = 50$<br><br>$r = \\sqrt{50} = 5\\sqrt{2}$<br><br>To verify it is a maximum, check the second derivative:<br><br>$f''(r) = 200 - 12r^2$<br><br>At $r = 5\\sqrt{2}$, $f''(5\\sqrt{2}) = 200 - 12(50) = 200 - 600 = -400 < 0$<br><br>Thus, the area is maximum when the radius is $5\\sqrt{2}$.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d30e8c30a4553e1bdfb5", "type": "singleCorrect", "question": {"text": "A circle passes through the point $(0,1)$ and touches the parabola $y = x^2$ at the point $(1,1)$. The centre of the circle is...", "image": null}, "options": [{"id": "sPJ3x", "label": "A", "text": "$\\left(-\\dfrac{1}{2}, -\\dfrac{5}{2}\\right)$", "isCorrect": false, "image": null}, {"id": "Trup3", "label": "B", "text": "$\\left(\\dfrac{1}{2}, -\\dfrac{5}{2}\\right)$", "isCorrect": false, "image": null}, {"id": "Yb0aR", "label": "C", "text": "$\\left(\\dfrac{1}{2}, \\dfrac{5}{4}\\right)$", "isCorrect": true, "image": null}, {"id": "leF7B", "label": "D", "text": "$\\left(-\\dfrac{1}{2}, \\dfrac{5}{4}\\right)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The equation of the tangent to the parabola $y = x^2$ at the point $(1,1)$ is given by $T = 0$:<br><br>$\\dfrac{y+1}{2} = x(1) \\Rightarrow 2x - y - 1 = 0$<br><br>The equation of the family of circles touching the line $2x - y - 1 = 0$ at $(1,1)$ is:<br><br>$(x - 1)^2 + (y - 1)^2 + \\lambda(2x - y - 1) = 0$<br><br>Since the circle passes through the point $(0,1)$, substituting $x = 0$ and $y = 1$ gives:<br><br>$(0 - 1)^2 + (1 - 1)^2 + \\lambda(2(0) - 1 - 1) = 0$<br><br>$1 - 2\\lambda = 0 \\Rightarrow \\lambda = \\dfrac{1}{2}$<br><br>Substituting $\\lambda = \\dfrac{1}{2}$ into the equation of the circle:<br><br>$(x - 1)^2 + (y - 1)^2 + \\dfrac{1}{2}(2x - y - 1) = 0$<br><br>$x^2 - 2x + 1 + y^2 - 2y + 1 + x - \\dfrac{y}{2} - \\dfrac{1}{2} = 0$<br><br>$x^2 + y^2 - x - \\dfrac{5}{2}y + \\dfrac{3}{2} = 0$<br><br>The coordinates of the centre of the circle $x^2 + y^2 + 2gx + 2fy + c = 0$ are $(-g, -f)$.<br><br>Centre $= \\left(\\dfrac{1}{2}, \\dfrac{5}{4}\\right)$<br><br>Answer: $\\left(\\dfrac{1}{2}, \\dfrac{5}{4}\\right)$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a7b", "title": "MHT CET 2026 (19 April Shift 2)", "shortName": "2026 (19 April Shift 2)", "isVisible": true, "heldOn": "2026-04-19T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d2f28c30a4553e1bde89", "type": "singleCorrect", "question": {"text": "The number of circles passing through the origin and touching the lines $x + y = 1$ and $x - y = 1$ is $\\ldots$", "image": null}, "options": [{"id": "XsfcF", "label": "A", "text": "$1$", "isCorrect": false, "image": null}, {"id": "RGdfX", "label": "B", "text": "$2$", "isCorrect": true, "image": null}, {"id": "9W23M", "label": "C", "text": "$3$", "isCorrect": false, "image": null}, {"id": "7PBql", "label": "D", "text": "$4$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given lines are $x + y - 1 = 0$ and $x - y - 1 = 0$.<br><br>The center of a circle touching both lines must lie on one of their angle bisectors.<br><br>The equations of the angle bisectors are given by:<br><br>$\\dfrac{x + y - 1}{\\sqrt{1^2 + 1^2}} = \\pm \\dfrac{x - y - 1}{\\sqrt{1^2 + (-1)^2}}$<br><br>$\\dfrac{x + y - 1}{\\sqrt{2}} = \\pm \\dfrac{x - y - 1}{\\sqrt{2}}$<br><br>Taking the positive sign, we get $2y = 0 \\Rightarrow y = 0$.<br><br>Taking the negative sign, we get $2x - 2 = 0 \\Rightarrow x = 1$.<br><br>Case 1: Let the center lie on the bisector $y = 0$. Let the center be $(h, 0)$.<br><br>Since the circle passes through the origin $(0, 0)$, its radius is $r = \\sqrt{(h-0)^2 + (0-0)^2} = |h|$.<br><br>The perpendicular distance from the center $(h, 0)$ to the line $x + y - 1 = 0$ must be equal to the radius $r$.<br><br>$\\dfrac{|h + 0 - 1|}{\\sqrt{1^2 + 1^2}} = |h|$<br><br>$\\dfrac{|h - 1|}{\\sqrt{2}} = |h|$<br><br>Squaring both sides, we get:<br><br>$\\dfrac{(h - 1)^2}{2} = h^2$<br><br>$h^2 - 2h + 1 = 2h^2$<br><br>$h^2 + 2h - 1 = 0$<br><br>This is a quadratic equation in $h$ and its discriminant is $\\Delta = 2^2 - 4(1)(-1) = 8 > 0$. Thus, it has two distinct real roots ($h = -1 \\pm \\sqrt{2}$). This gives $2$ such circles.<br><br>Case 2: Let the center lie on the bisector $x = 1$. Let the center be $(1, k)$.<br><br>Since the circle passes through the origin $(0, 0)$, its radius is $r = \\sqrt{(1-0)^2 + (k-0)^2} = \\sqrt{1 + k^2}$.<br><br>The perpendicular distance from the center $(1, k)$ to the line $x + y - 1 = 0$ must be equal to the radius $r$.<br><br>$\\dfrac{|1 + k - 1|}{\\sqrt{1^2 + 1^2}} = \\sqrt{1 + k^2}$<br><br>$\\dfrac{|k|}{\\sqrt{2}} = \\sqrt{1 + k^2}$<br><br>Squaring both sides, we get:<br><br>$\\dfrac{k^2}{2} = 1 + k^2$<br><br>$k^2 = 2 + 2k^2$<br><br>$k^2 = -2$<br><br>This equation has no real solution for $k$. Thus, no circle exists with its center on $x = 1$.<br><br>Therefore, the total number of such circles is $2$.<br><br>Answer: $2$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a79", "title": "MHT CET 2026 (18 April Shift 2)", "shortName": "2026 (18 April Shift 2)", "isVisible": true, "heldOn": "2026-04-18T14:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32e8c30a4553e1be10a", "type": "singleCorrect", "question": {"text": "The area of the region (in sq. unit) bounded by x-axis, the tangent and normal to the circle $x^2 + y^2 = 4$, drawn at a point $(1, \\sqrt{3})$ is", "image": null}, "options": [{"id": "3upsf", "label": "A", "text": "$5$", "isCorrect": false, "image": null}, {"id": "r2hrB", "label": "B", "text": "$\\sqrt{3}$", "isCorrect": false, "image": null}, {"id": "apD3m", "label": "C", "text": "$2$", "isCorrect": false, "image": null}, {"id": "NOwAo", "label": "D", "text": "$2\\sqrt{3}$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "Equation of the circle is $x^2 + y^2 = 4$.<br><br>Equation of the tangent at the point $(1, \\sqrt{3})$ is given by $xx_1 + yy_1 = r^2$, which is $x + \\sqrt{3}y = 4$.<br><br>Equation of the normal at $(1, \\sqrt{3})$ passes through the origin $(0,0)$, so its equation is $y = \\sqrt{3}x$.<br><br>The region bounded by the tangent, normal, and the x-axis ($y=0$) forms a triangle. We find its vertices by solving the equations of the lines pairwise.<br><br>Intersection of the normal and the x-axis is $(0, 0)$.<br><br>Intersection of the tangent and the x-axis is obtained by putting $y=0$ in $x + \\sqrt{3}y = 4$, which gives $x=4$. The point is $(4, 0)$.<br><br>Intersection of the tangent and the normal is the point of contact $(1, \\sqrt{3})$.<br><br>The base of the triangle lies on the x-axis with length $4 - 0 = 4$.<br><br>The height of the triangle is the y-coordinate of the point $(1, \\sqrt{3})$, which is $\\sqrt{3}$.<br><br>Area of the triangle $= \\dfrac{1}{2} \\times \\text{base} \\times \\text{height} = \\dfrac{1}{2} \\times 4 \\times \\sqrt{3} = 2\\sqrt{3}$ sq. units.", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d32a8c30a4553e1be0e1", "type": "singleCorrect", "question": {"text": "The tangent to the circle $x^2 + y^2 = 10$ at the point $(3,1)$ touches the circle $x^2 + y^2 - 2\\sqrt{10}\\,x - 20y + k = 0$, then the value of $k$ is...", "image": null}, "options": [{"id": "MUuH3", "label": "A", "text": "$-109$", "isCorrect": false, "image": null}, {"id": "mubmJ", "label": "B", "text": "$109$", "isCorrect": false, "image": null}, {"id": "dgkJH", "label": "C", "text": "$-101$", "isCorrect": false, "image": null}, {"id": "fnVss", "label": "D", "text": "$101$", "isCorrect": true, "image": null}], "correctValue": null, "solution": {"text": "The equation of the tangent to the circle $x^2 + y^2 = 10$ at the point $(3,1)$ is given by $T = 0$:<br><br>$3x + y = 10 \\Rightarrow 3x + y - 10 = 0$<br><br>The equation of the second circle is $x^2 + y^2 - 2\\sqrt{10}x - 20y + k = 0$.<br><br>The center of this circle is $(\\sqrt{10}, 10)$ and its radius is $r = \\sqrt{(\\sqrt{10})^2 + (10)^2 - k} = \\sqrt{110 - k}$.<br><br>Since the line $3x + y - 10 = 0$ touches the second circle, the perpendicular distance from the center to the line must be equal to the radius of the circle.<br><br>The perpendicular distance $d$ is:<br><br>$d = \\dfrac{|3(\\sqrt{10}) + 10 - 10|}{\\sqrt{3^2 + 1^2}} = \\dfrac{3\\sqrt{10}}{\\sqrt{10}} = 3$<br><br>Equating the distance to the radius:<br><br>$\\sqrt{110 - k} = 3$<br><br>Squaring both sides:<br><br>$110 - k = 9$<br><br>$k = 101$<br><br>Answer: $101$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a78", "title": "MHT CET 2026 (18 April Shift 1)", "shortName": "2026 (18 April Shift 1)", "isVisible": true, "heldOn": "2026-04-18T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3398c30a4553e1be17b", "type": "singleCorrect", "question": {"text": "The equations of the tangent to the curve $x^2 + y^2 = 10$, where the tangent is parallel to the line $2x + y - 1 = 0$, are", "image": null}, "options": [{"id": "4TS6i", "label": "A", "text": "$2x + y = \\pm\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "Xaw7w", "label": "B", "text": "$2x + y = \\pm 5\\sqrt{2}$", "isCorrect": true, "image": null}, {"id": "Zyd1v", "label": "C", "text": "$2x + y = \\pm 2\\sqrt{2}$", "isCorrect": false, "image": null}, {"id": "oSrnQ", "label": "D", "text": "$2x + y = \\pm 3\\sqrt{2}$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The given curve is a circle $x^2 + y^2 = 10$ with center $(0,0)$ and radius $r = \\sqrt{10}$.<br><br>The tangent is parallel to the line $2x + y - 1 = 0$. Let the equation of the tangent be $2x + y + c = 0$.<br><br>The perpendicular distance from the center of the circle to the tangent is equal to its radius.<br><br>$\\dfrac{|2(0) + (0) + c|}{\\sqrt{2^2 + 1^2}} = \\sqrt{10}$<br><br>$\\dfrac{|c|}{\\sqrt{5}} = \\sqrt{10}$<br><br>$|c| = \\sqrt{50} = 5\\sqrt{2}$<br><br>$c = \\pm 5\\sqrt{2}$<br><br>The equations of the tangents are $2x + y = \\pm 5\\sqrt{2}$.<br><br>Answer: $2x + y = \\pm 5\\sqrt{2}$", "image": null}, "previousYearPapers": [{"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 1, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d2802d2155b816ec4a74", "title": "MHT CET 2026 (16 April Shift 1)", "shortName": "2026 (16 April Shift 1)", "isVisible": true, "heldOn": "2026-04-16T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "6a44d3718c30a4553e1be3cd", "type": "singleCorrect", "question": {"text": "If a circle with center $(-1, 1)$ touches the line $x + 2y + 4 = 0$, then the co-ordinates of the point of contact are", "image": null}, "options": [{"id": "DIrdU", "label": "A", "text": "$(-2, -1)$", "isCorrect": true, "image": null}, {"id": "abZv7", "label": "B", "text": "$(8, -2)$", "isCorrect": false, "image": null}, {"id": "HMPmz", "label": "C", "text": "$(2, -3)$", "isCorrect": false, "image": null}, {"id": "3vELA", "label": "D", "text": "$(4, -4)$", "isCorrect": false, "image": null}], "correctValue": null, "solution": {"text": "The point of contact is the foot of the perpendicular drawn from the center of the circle to the tangent line.<br><br>The coordinates of the foot of the perpendicular $(h, k)$ from a point $(x_1, y_1)$ to the line $ax + by + c = 0$ are given by:<br><br>$\\dfrac{h - x_1}{a} = \\dfrac{k - y_1}{b} = -\\dfrac{ax_1 + by_1 + c}{a^2 + b^2}$<br><br>Substituting $(x_1, y_1) = (-1, 1)$ and the line equation $x + 2y + 4 = 0$:<br><br>$\\dfrac{h - (-1)}{1} = \\dfrac{k - 1}{2} = -\\dfrac{1(-1) + 2(1) + 4}{1^2 + 2^2}$<br><br>$\\dfrac{h + 1}{1} = \\dfrac{k - 1}{2} = -\\dfrac{5}{5} = -1$<br><br>$h + 1 = -1 \\Rightarrow h = -2$<br><br>$\\dfrac{k - 1}{2} = -1 \\Rightarrow k - 1 = -2 \\Rightarrow k = -1$<br><br>The coordinates of the point of contact are $(-2, -1)$.<br><br>Answer: $(-2, -1)$", "image": null}, "previousYearPapers": [{"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}], "level": 2, "questionLabels": [], "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "6a44d27f2d2155b816ec4a70", "title": "MHT CET 2026 (13 April Shift 1)", "shortName": "2026 (13 April Shift 1)", "isVisible": true, "heldOn": "2026-04-13T09:00:00.000Z", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf3bf9280d7f9932df1", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The angle between the tangents drawn from the origin to the circle $(x-7)^2+(y+1)^2=25$ is", "image": null}, "options": [{"id": "RZZbV", "text": "1.5708", "image": null, "isCorrect": true}, {"id": "zT775", "text": "0.8265", "image": null, "isCorrect": false}, {"id": "ZUMQq", "text": "0.8652", "image": null, "isCorrect": false}, {"id": "udmAA", "text": "0.8625", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The given circle is $(x-7)^2+(y+1)^2=25$.<br><br>The center of the circle is $C(7, -1)$ and its radius is $r = \\sqrt{25} = 5$.<br><br>The distance from the origin $O(0,0)$ to the center $C$ is $OC = \\sqrt{7^2 + (-1)^2} = \\sqrt{49 + 1} = \\sqrt{50} = 5\\sqrt{2}$.<br><br>Let $2\\theta$ be the angle between the tangents drawn from the origin to the circle. From the right-angled triangle formed by the origin, the center of the circle, and the point of contact of the tangent, we have:<br><br>$\\sin \\theta = \\dfrac{r}{OC}$<br><br>Substituting the values, we get:<br><br>$\\sin \\theta = \\dfrac{5}{5\\sqrt{2}} = \\dfrac{1}{\\sqrt{2}}$<br><br>This gives $\\theta = \\dfrac{\\pi}{4}$.<br><br>The angle between the tangents is $2\\theta = 2 \\times \\dfrac{\\pi}{4} = \\dfrac{\\pi}{2}$.<br><br>The numerical value of $\\dfrac{\\pi}{2}$ is approximately $1.5708$.<br><br>Answer: 1.5708", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bf2bf9280d7f9932de7", "type": "singleCorrect", "level": 3, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "The equation of the common tangent touching the circle $(x-3)^2+\\mathrm{y}^2=9$ and the parabola $\\mathrm{y}^2=4 x$ above the X -axis is", "image": null}, "options": [{"id": "qqBhn", "text": "$\\sqrt{3}y=x+3$", "image": null, "isCorrect": true}, {"id": "nAxkV", "text": "$\\sqrt{3}y=-(x+3)$", "image": null, "isCorrect": false}, {"id": "wi10r", "text": "$\\sqrt{3}y=3x+1$", "image": null, "isCorrect": false}, {"id": "6JiBy", "text": "$\\sqrt{3}y=-(3x+1)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of a tangent to the parabola $y^2 = 4x$ having slope $m$ is given by $y = mx + \\dfrac{1}{m}$.<br><br>This line is also a tangent to the circle $(x-3)^2 + y^2 = 9$. The center of the circle is $(3, 0)$ and its radius is $3$.<br><br>The perpendicular distance from the center $(3, 0)$ to the line $mx - y + \\dfrac{1}{m} = 0$ must be equal to the radius of the circle.<br><br>$\\dfrac{\\left|m(3) - 0 + \\dfrac{1}{m}\\right|}{\\sqrt{m^2 + (-1)^2}} = 3$<br><br>$\\dfrac{\\left|3m + \\dfrac{1}{m}\\right|}{\\sqrt{m^2 + 1}} = 3$<br><br>Squaring both sides, we get:<br><br>$\\dfrac{9m^2 + 6 + \\dfrac{1}{m^2}}{m^2 + 1} = 9$<br><br>$9m^2 + 6 + \\dfrac{1}{m^2} = 9m^2 + 9$<br><br>$\\dfrac{1}{m^2} = 3 \\Rightarrow m^2 = \\dfrac{1}{3} \\Rightarrow m = \\pm \\dfrac{1}{\\sqrt{3}}$<br><br>The point of contact of the tangent on the parabola is $\\left(\\dfrac{1}{m^2}, \\dfrac{2}{m}\\right)$. Since the tangent touches the parabola above the X-axis, the y-coordinate must be positive, which implies $m > 0$.<br><br>Therefore, $m = \\dfrac{1}{\\sqrt{3}}$.<br><br>Substituting $m = \\dfrac{1}{\\sqrt{3}}$ in the equation of the tangent:<br><br>$y = \\dfrac{1}{\\sqrt{3}}x + \\sqrt{3}$<br><br>Multiplying by $\\sqrt{3}$, we get:<br><br>$\\sqrt{3}y = x + 3$<br><br>Answer: $\\sqrt{3}y=x+3$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7c", "heldOn": "2025-04-27T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (27 Apr Shift 2)", "title": "MHT CET 2025 (27 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871be4bf9280d7f9932d5d", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "Two tangents to the circle $x^2+y^2=4$ at the points $A$ and $B$ meet at $\\mathrm{P}(-4,0)$. Then the area of quadrilateral PAOB , where 'O' is the origin is", "image": null}, "options": [{"id": "nT8jR", "text": "$8 \\sqrt{3}$ sq. units", "image": null, "isCorrect": false}, {"id": "peZgV", "text": "$\\frac{4}{\\sqrt{3}}$ sq. units", "image": null, "isCorrect": false}, {"id": "PGNCz", "text": "$4 \\sqrt{3}$ sq. units", "image": null, "isCorrect": true}, {"id": "V8hSQ", "text": "$\\sqrt{3}$ sq. units", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The equation of the circle is $x^2+y^2=4$.<br><br>The center of the circle is $O(0,0)$ and its radius is $r=2$.<br><br>The point $P$ is $(-4,0)$. The distance between the center $O$ and point $P$ is $OP = 4$.<br><br>Let $PA$ and $PB$ be the tangents from $P$ to the circle. The radius $OA$ is perpendicular to the tangent $PA$ at the point of contact $A$.<br><br>In the right-angled triangle $OAP$, using Pythagoras theorem:<br><br>$PA = \\sqrt{OP^2 - OA^2} = \\sqrt{4^2 - 2^2} = \\sqrt{16 - 4} = \\sqrt{12} = 2\\sqrt{3}$<br><br>The area of $\\triangle OAP$ is:<br><br>Area$(\\triangle OAP) = \\dfrac{1}{2} \\times OA \\times PA = \\dfrac{1}{2} \\times 2 \\times 2\\sqrt{3} = 2\\sqrt{3}$ sq. units.<br><br>By symmetry, the area of $\\triangle OBP$ is equal to the area of $\\triangle OAP$.<br><br>The area of quadrilateral $PAOB$ is:<br><br>Area$(PAOB) = \\text{Area}(\\triangle OAP) + \\text{Area}(\\triangle OBP) = 2\\sqrt{3} + 2\\sqrt{3} = 4\\sqrt{3}$ sq. units.<br><br>Answer: $4 \\sqrt{3}$ sq. units", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f7b", "heldOn": "2025-04-26T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (26 Apr Shift 2)", "title": "MHT CET 2025 (26 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bbfbf9280d7f9932c14", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "If a circle with centre at $(-1,1)$ touches the line $x+2 y+4=0$ then the co-ordinates of the point of contact are", "image": null}, "options": [{"id": "7PfCW", "text": "$(-2,-1)$", "image": null, "isCorrect": true}, {"id": "exLve", "text": "$(8,-6)$", "image": null, "isCorrect": false}, {"id": "f5kiK", "text": "$(-10,3)$", "image": null, "isCorrect": false}, {"id": "cLKF4", "text": "$(-4,0)$", "image": null, "isCorrect": false}], "correctValue": null, "solution": {"text": "The point of contact is the foot of the perpendicular drawn from the centre of the circle to the tangent line.<br><br>Let the centre be $C(-1, 1)$ and the tangent line be $x + 2y + 4 = 0$.<br><br>The slope of the tangent line is $-\\dfrac{1}{2}$.<br><br>The slope of the normal (perpendicular line) passing through the centre is $2$.<br><br>The equation of the normal is $y - 1 = 2(x + 1)$, which simplifies to $2x - y + 3 = 0$.<br><br>Solving the equations $x + 2y + 4 = 0$ and $2x - y + 3 = 0$:<br><br>Multiplying the second equation by $2$ gives $4x - 2y + 6 = 0$.<br><br>Adding this to the first equation gives $5x + 10 = 0 \\Rightarrow x = -2$.<br><br>Substituting $x = -2$ in $2x - y + 3 = 0$ gives $2(-2) - y + 3 = 0 \\Rightarrow y = -1$.<br><br>The coordinates of the point of contact are $(-2, -1)$.<br><br>Answer: $(-2,-1)$", "image": null}, "videoSolution": null, "syllabusCategory": "noChange", "questionStructure": ["default"], "previousYear": {"_id": "688376df9b67616acec78f79", "heldOn": "2025-04-25T14:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 2)", "title": "MHT CET 2025 (25 Apr Shift 2)", "examId": "615d7745c52ffa3c944600e5"}, "evalStatus": "notAttempted", "lastPracticed": null}, {"_id": "68871bb2bf9280d7f9932ba8", "type": "singleCorrect", "level": 2, "questionLabels": [], "previousYearPapers": [{"_id": "688376df9b67616acec78f78", "heldOn": "2025-04-25T09:00:00.000Z", "isVisible": true, "shortName": "MHT CET 2025 (25 Apr Shift 1)", "title": "MHT CET 2025 (25 Apr Shift 1)", "examId": "615d7745c52ffa3c944600e5"}], "question": {"text": "A pair of tangents are drawn to the circle $x^2+y^2+6 x-4 y-12=0$ from a point $\\mathrm{P}(-4,-5)$, then the area enclosed between these tangents and the area of the circle is", "image": null}, "options": [{"id": "63ruR", "text": "$25\\left(\\frac{4+\\pi}{4}\\right)$ sq. units", "image": null, "isCorrect": false}, {"id": "rWSUL", "text": "$25\\left(\\frac{4+\\pi}{2}\\right)$ sq. units", "image": null, "isCorrect": false}, {"id": "0BAbM", "text": "$25\\left(\\frac{4-\\pi}{2}\\right)$ sq. units", "image": null, "isCorrect": false}, {"id": "Av5Uk", "text": "$25\\left(\\frac{4-\\pi}{4}\\right)$ sq. units", "image": null, "isCorrect": true}], "correctValue": null, "solution": {"text": "The given equation of the circle is $x^2+y^2+6x-4y-12=0$.<br><br>The center of the circle is $C(-3, 2)$ and its radius is $r = \\sqrt{3
